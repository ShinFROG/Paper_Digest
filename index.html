<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

rg/abs/2610.32986", "authors": "Guijia Zhang ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Zhang, G., & Yang, H. (2026). LLM-as-a-Judge Version Shift: The Instrument Changed, Not the Standard (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32986", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "研究提案を順位づけるLLM判定者を同系統の新しい版に替えると、点数の位置だけでなく評価基準の構造や分解能まで変わりうることを示した（抄録）。", "p3": "重みを固定した事前登録の設計で、Qwen・Gemma・Mistralの隣り合う版の3組の移行を、凍結した機械学習の研究提案と無作為化した情報条件で比べ、判定者の原点・基準の幾何・分解能の変化として整理した（抄録）。", "p5": "「新しい判定者ほど厳しい」という想定は成り立たず、2組は甘くなる方向に動き、1組では良い提案と欠陥のある提案の区別が崩れて点数の93%が1つの値に集まった（抄録）。同じ事実を与えても差は埋まらず、全体の再較正は平均を直しても個々のばらつきをほとんど説明しなかった（抄録）。", "fun": "テストの採点者が途中で交代したら、点数は同じ基準で比べられるだろうか。AIの採点者でも同じ問題が起きる。新しい版のAIは厳しくなるとは限らず、甘くなったり、良い案と悪い案の区別がつかなくなったりした。物差しを替えたら、まず物差し自体を確かめる必要があるという教訓だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "LLMのプロスペクト理論特性をメタ分析", "title": "Prospect Theory in Large Language Models: A Meta-Analysis of Loss Aversion, Diminishing Sensitivity, and Probability Weighting", "url": "https://arxiv.org/abs/2610.33103", "authors": "Adi Tarabeih", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Tarabeih, A. (2026). Prospect Theory in Large Language Models: A Meta-Analysis of Loss Aversion, Diminishing Sensitivity, and Probability Weighting (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33103", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "32のLLMを扱った11研究の102の推定値をメタ分析し、LLMの損失回避は人より弱く、価値関数の曲がり方は測定法によって結論が変わることを示した（抄録）。", "p3": "プロスペクト理論の3要素（損失回避λ、結果の大きさへの感応度の逓減、確率の非線形な重みづけ）の推定値を統合し、設計をそろえた比較で人の推定値と対照した（抄録）。", "p5": "統合した損失回避λは1.26（95%CI 1.06〜1.46）で、人の最も強いメタ分析の推定値1.96より小さく、損失が利得より小さい条件では人の2.3に対し1.46だった（抄録）。価値関数はTversky-Kahneman法でほぼ線形（1.01、人は0.67）、Tanaka法では人より凹（0.52）だった（抄録）。", "fun": "人はお金をもらう喜びより、同じ額を失う悲しみの方を大きく感じる。これを「損失回避」という。AIにも同じ傾向があるかを11の研究から調べると、AIの損失回避は人より弱めだった。AIを人の代わりの回答者として使うときは、こうした違いに注意が必要だとわかる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "相互作用で推論の整合が生まれる多エージェント", "title": "Collective Emergent Alignment: Measuring and Amplifying Interaction-Induced Reasoning Alignment in Multi-Agent LLMs", "url": "https://arxiv.org/abs/2610.34836", "authors": "Boxuan Wang ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Wang, B., Li, Z., Ramchurn, S. D., Huang, X., & Dong, Y. (2026). Collective Emergent Alignment: Measuring and Amplifying Interaction-Induced Reasoning Alignment in Multi-Agent LLMs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34836", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "複数のLLMエージェントが相互作用すると、各自の自己改善だけでは得られない推論の整合（参照に根拠づけられた推論の一致）が生まれることを測る枠組みREMAPを示した（抄録）。", "p3": "参照との含意行列にもとづく意味の網羅度と相互作用に固有の上積みを定義し、複数のモデル系統と2つのマルチホップ推論のベンチマークで個別の自己改善と比べた（抄録）。さらに推論過程の全体ではなく不足を補う事実だけを選んで伝える通信方式を提案した（抄録）。", "p5": "相互作用による上積みは全般に正で、エージェント間に分散した証拠を統合する推論で特に大きく、他者の情報の回復と一貫して関連した（抄録）。簡潔な事実の交換は通信量を減らしつつ整合と性能を高めた（抄録）。具体的な数値は抄録にない（未確認）。", "fun": "グループで話し合うと、一人で考え直すより良い答えにたどり着くことがある。この研究はAI同士でもそれが起きるかを測り、情報がメンバーに散らばっているときに特に効果が大きいことを見つけた。しかも、考えた過程を全部伝えるより、足りない事実だけを伝える方が効率的だった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "価値観の強いペルソナを安全に扱う整合手法", "title": "When Personas Become Harmful: Guiding LLMs with Global Citizenship Values Alignment", "url": "https://arxiv.org/abs/2610.33899", "authors": "Siqi Shen ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Shen, S., Logeswaran, L., Lee, M., Lee, H., & Mihalcea, R. (2026). When Personas Become Harmful: Guiding LLMs with Global Citizenship Values Alignment (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33899", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "価値観を帯びたペルソナを指定する依頼から有害な応答が生じる問題を示し、ユネスコの地球市民の原則を最小限の共通基盤として、ペルソナへの忠実さと安全性を推論時に調整できる整合モデルを提案した（抄録）。", "p3": "シュワルツの価値観調査の次元に対応するペルソナと論争的な話題の組11k件のデータを作り、話題とペルソナを反復的に洗練するエージェント型の手順で有害な応答を集めた（抄録）。", "p5": "安全に調整された商用LLMからも47%超の成功率で有害な応答を引き出せた（抄録）。提案モデルは多くのサンプルで比較手法より安全で、ペルソナにも忠実だった（抄録）。", "fun": "AIに「伝統を重んじる人として答えて」のように価値観を指定すると、悪意のない頼み方でも有害な答えが出てくることがある。この研究は、許される意見と有害な行動の線引きに世界共通の市民の原則を使い、利用者が忠実さと安全性のバランスを選べるAIを作った。多様な価値観をどう尊重するかという難しい問いに挑んでいる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "説得相手の暗黙の信念を報酬にする学習", "title": "Implicit Beliefs as Scalable Process Rewards for Strategic Persuasion", "url": "https://arxiv.org/abs/2610.33527", "authors": "Minqian Liu ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Liu, M., Shen, Y., An, H., Zhang, Q., Wisniewski, P. J., Lee, S. W., Cho, J.-H., & Huang, L. (2026). Implicit Beliefs as Scalable Process Rewards for Strategic Persuasion (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33527", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "多ターンの戦略的な説得をLLMに学ばせるため、心理的に根拠のある被説得者を模擬する環境と、被説得者の内部状態を密な過程報酬に変える強化学習Probe-RPOを提案した（抄録）。", "p3": "説得の模擬環境PersuArenaで、凍結した被説得者モデルのロジットから毎ターン3つの内省的なプローブを読み取り、多次元の報酬として方策最適化に使った（抄録）。医療・金融助言・職場管理・教育・人間関係の場面で評価した（抄録）。", "p5": "Probe-RPOは完全受諾率52.5%を達成し、比較対象の35.8%を上回った（抄録）。比較対象の詳細は抄録の範囲では未確認。", "fun": "相手を説得する会話の練習相手をAIで作るには、本当の人のように迷ったり意見を戻したりする相手が必要だ。この研究は、AIの説得相手の「心の中」の変化を毎回読み取って、それを上達の手がかりにした。どの一言が効いたのかが分かる点が、結果だけで学ぶ方法との違いだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "意図を保つ敵対的ユーザー模擬でエージェント評価", "title": "Intent-Preserving Adversarial User Simulation for Multi-Turn Agent Evaluation", "url": "https://arxiv.org/abs/2610.35426", "authors": "Atri Vivek Sharma ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Sharma, A. V., Formento, B., & Lomuscio, A. (2026). Intent-Preserving Adversarial User Simulation for Multi-Turn Agent Evaluation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35426", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "多ターンのエージェントを評価する模擬ユーザーが協力的すぎて性能を過大評価する問題に対し、ユーザーの目的は保ったまま手強い対話を作る敵対的な模擬ユーザーStressSimを提案した（抄録）。", "p3": "課題ごとに模擬ユーザーの高レベルの敵対的な計画を、実行の記録、課題達成の細かな信号、妥当性のフィードバックを使う遺伝的なプロンプト最適化で進化させた（抄録）。MultiWOZとtau-benchの小売・航空の領域で3つのエージェントを評価した（抄録）。", "p5": "tau-benchのpass^4はgemini-3.8-flashで最大69%、gpt-5.6-solで62%下がった一方、ユーザーの目的の保持の低下は最大10%にとどまった（課題あたり20回の実行の予算）（抄録）。", "fun": "AIの接客係をテストするとき、テスト役のAIが素直すぎると、本番の手強い客に対応できるかが分からない。この研究は、目的は変えずに手強い客を演じる模擬ユーザーを自動で鍛え、最新のAIでも成功率が大きく下がることを示した。テストの相手を賢くすることが、本当の実力を測る近道になる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "知見グラフに基づく多エージェント討論で着想", "title": "Distill, Debate, Discover: Grounding Multi-Agent Research Ideation in Graph-Distilled Insights", "url": "https://arxiv.org/abs/2610.33366", "authors": "Qianran Ma ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Ma, Q., Liu, M., Kim, G., Liang, X., & Callison-Burch, C. (2026). Distill, Debate, Discover: Grounding Multi-Agent Research Ideation in Graph-Distilled Insights (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33366", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "関連論文のグラフから知見を抽出してエージェントに専門性を持たせ、討論を通じて研究提案を作る多エージェントの研究着想の枠組みInsightAgentsを提案した（抄録）。", "p3": "研究の流れの中での手法の変遷、暗黙の前提、未解決の課題を示す知見でエージェントを方向づけ、共同で問題を定めて案を提示・批判・改善する討論で提案を作った（抄録）。NLPの100の研究テーマで、3つの既存の枠組みと2つのLLM判定者による対比較で評価した（抄録）。", "p5": "オンラインとオフラインの知識設定の両方で、2つの判定者のもとで5つの評価次元の平均点が最も高かった（抄録）。人による評価は抄録にない（未確認）。", "fun": "研究のアイデアを出すとき、本物の研究者は過去の論文から「どこが未解決か」を読み取ってから議論する。この研究は、AIの議論メンバーにも論文のつながりから知見を持たせ、提案・反論・修正を重ねさせた。物知りなメンバーをそろえるほど議論が良くなるという、人の会議にも通じる発想だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr24", "rank": 24, "headline": "議会議事録に見る女性議員のエネルギー転換議論", "title": "Women in Decision-making for Energy Transition: The Roles and Sentiments of Women Legislators Captured in National Parliament Meeting Notes", "url": "https://doi.org/10.2139/ssrn.7675059", "authors": "Minyoung Choi ほか", "venue": "SSRN", "date": "2026-10-27", "apa": "Choi, M., Kim, H., & Lee, H. (2026). Women in Decision-making for Energy Transition: The Roles and Sentiments of Women Legislators Captured in National Parliament Meeting Notes. https://doi.org/10.2139/ssrn.7675059", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "韓国国会の第21・22期の議事録を分析し、エネルギー転換の議論で女性議員は環境安全・公衆衛生・越境リスクの検証に集中し、男性議員は原発輸出や産業振興まで幅広く扱っていたことを示した（抄録）。", "p3": "大規模な韓国語の議事録に、BERTopicによる話題モデル、Transformerによる感情分類、感情を埋め込んだネットワーク分析を適用し、話題の重点、感情の枠づけ、相互作用の構造を調べた（抄録）。", "p5": "感情の枠づけの性差は小さく領域に依存し、女性はわずかに否定的だが原発などの争点では二極化が小さかった（抄録）。3つ目の結果は抄録の範囲では未確認。", "fun": "国会で同じエネルギーの話をしていても、女性議員は安全や健康の問題を、男性議員は原発の輸出や産業の話を多くしていた。議事録という膨大な文章をAIで読み解くと、誰がどんな視点で議論に加わっているかが見えてくる。多様な人が議論に加わる意味を、言葉の分析で示そうとする研究だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr25", "rank": 25, "headline": "執行品質の開示から個人投資家の損害を部分識別", "title": "Can Execution Disclosures Reveal Harm to Retail Traders? Accounting Gaps, Sample Selection, and Sharp Bounds", "url": "https://doi.org/10.5281/zenodo.23677535", "authors": "Golla, Akshaj", "venue": "Zenodo", "date": "2026-10-26", "apa": "Golla, A. (2026). Can Execution Disclosures Reveal Harm to Retail Traders? Accounting Gaps, Sample Selection, and Sharp Bounds (Version 1). Zenodo. https://doi.org/10.5281/ZENODO.23677535", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された説明（抄録）を使用", "preprint": true, "short": true, "p1": "Citadel SecuritiesとVirtuの2026年1〜6月のRule 605執行品質報告12件を監査し、価格区分の厳密な照合が標本の範囲と比較を大きく変えることを示し、開示から個人投資家の損害について言えることと言えないことを整理した（抄録）。", "p3": "価格区分の照合で会計上の欠落を特定し、分析者の選別による偏りと、不正や顧客の損害の証拠とを区別したうえで、初等的な計数による上下限と整数の株数の配分で、会場全体の合計から特定されない顧客群について示せる範囲を明らかにした（抄録）。", "p5": "Citadelの成行注文のセルで価格区分の不足が計36,239株あり、そのセルは同社の報告上の執行量の58.21%を占めたため、厳密な選別は欠落そのものよりはるかに多くの量を除いた（抄録）。著者は不正や因果を示すものではないとしている（抄録）。", "fun": "証券会社は「どれだけ良い値段で注文を処理したか」を報告書で公表している。この研究は報告書の数字を細かく照合し、合わない部分を機械的に除くと、ずれよりずっと多くのデータが消えてしまうことを示した。データの掃除の仕方しだいで結論が変わるという注意を、数字で示した点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "ドイツの非営利団体は何を開示しているか", "title": "What Do NPOs Disclose? Evidence from Germany", "url": "https://doi.org/10.2139/ssrn.7673379", "authors": "Michael Ebert ほか", "venue": "SSRN", "date": "2026-10-27", "apa": "Ebert, M., Simon, T., & Simons, D. (2026). What Do NPOs Disclose? Evidence from Germany. https://doi.org/10.2139/ssrn.7673379", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "ドイツの大規模な寄付受入れ非営利団体238団体の任意開示を手作業で調べ、検証可能な産出の情報はほぼすべてが開示する一方、成果・影響の情報や事業費比率の開示は少ないことを示した（抄録）。", "p3": "貸借対照表、事業への支出割合、検証可能な産出・成果・影響の情報の開示の有無を符号化し、外部認証の表示、監査人の開示、寄付額の開示、設立年、宗教団体の所有などの特性との関連を調べた記述的研究（抄録）。", "p5": "検証可能な産出の情報は90%が開示したが、成果は52%、影響は24%、事業費比率は24%だった（抄録）。外部認証の表示は費用比率と成果情報の開示と、外部監査人の開示は財務諸表の開示と関連し、古い団体や宗教団体は開示が少なかった（抄録）。", "fun": "寄付をするとき、その団体がお金をどう使い、どんな成果を出したかを知りたいと思う。ドイツの大きな団体を調べると、「何をしたか」はほぼ公開されていたが、「何が変わったか」まで示す団体は4分の1ほどだった。成果を見える形にする難しさが数字で分かる研究だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr27", "rank": 27, "headline": "サステナブル金融開示の語義変化を検出", "title": "Preference Optimization Improves Definition Generation: Semantic Change in EU Institutional Sustainable Finance Disclosures", "url": "https://arxiv.org/abs/2610.33357", "authors": "Mariia Fedorova ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Fedorova, M., Kutuzov, A., & Delascio, G. C. (2026). Preference Optimization Improves Definition Generation: Semantic Change in EU Institutional Sustainable Finance Disclosures (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33357", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "語の意味変化の検出に使う辞書型の定義生成が、同じ語義に過剰に多くの定義を作ってしまう問題を、直接選好最適化（DPO）での微調整で改善できることを示した（抄録）。", "p3": "定義生成モデルをDPOで微調整し、学術的な意味変化検出のベンチマークで定量的に、EUの開発金融の事業文書に現れる持続可能性の用語の経時変化の監査という実務課題で定性的に評価した（抄録）。", "p5": "DPOによる微調整は、語義の分布が細かくなりすぎる問題の克服に役立ったと報告した（抄録）。具体的な評価値は抄録にない（未確認）。モデル・コード・予測は公開されている（抄録）。", "fun": "「持続可能」という言葉は、昔と今とで同じ意味で使われているだろうか。この研究は、AIに言葉の定義を書かせて意味の変化を追う方法を改良し、同じ意味なのに別々の定義を量産してしまう癖を直した。お金の流れを記した文書から、言葉の使われ方の変化を監査できる点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "連合環境で表形式データを忠実に合成", "title": "Faithful Federated Tabular Data Synthesis", "url": "https://arxiv.org/abs/2610.33403", "authors": "Zilong Cao ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Cao, Z., Zhang, H., & Bi, X. (2026). Faithful Federated Tabular Data Synthesis (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33403", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "データが複数の組織に分散したままの連合学習の設定で、連続値と離散値が混在する表形式データの合成データを、分布を忠実に保って生成する枠組みFITSを提案した（抄録）。", "p3": "局所線形回帰で条件付き累積分布関数を推定する2段階の連合アルゴリズムを核に、確率の連鎖律で合成データを生成し、離散変数を連続空間に持ち上げて損失なく元の分布を復元する連続化で混在型の変数を統一的に扱った（抄録）。", "p5": "連合推定した条件付き累積分布関数の一様収束を示し、合成データは全参加組織で下流課題の性能を高め、効果は合成データの使い方に依存した（抄録）。具体的な数値は抄録にない（未確認）。", "fun": "病院や銀行のように、データを外に出せない組織が協力して分析したいときがある。この研究は、データを手元に置いたまま、本物とそっくりな「にせのデータ」を作る方法を考えた。数字と「男・女」のような分類が混ざった表でも、ゆがみなく再現できるよう工夫した点がポイントだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "業務上の意味をLLMで補う不正検知グラフ", "title": "LLM-Enhanced Heterogeneous Graph Learning with Business Semantics for Financial Fraud Detection", "url": "https://arxiv.org/abs/2610.35298", "authors": "Yixuan Chen ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Chen, Y., Zhan, H., Sheng, J., Han, W., Chen, S., Zhang, T., Tan, X., & Xia, J. (2026). LLM-Enhanced Heterogeneous Graph Learning with Business Semantics for Financial Fraud Detection (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35298", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "カードや加盟店など役割の異なる主体からなる取引グラフで、属性の業務上の意味をLLMで明示して不正検知に使う枠組みSemHGTを提案した（抄録）。", "p3": "(1)役割を考慮したプロンプトでノードの属性からリスクに関わる業務上の説明を引き出して意味ベクトルにし、(2)意味の類似度で対象ごとの経路事例を複数回サンプリングし、(3)局所の経路の証拠と大域的な近傍の要約を合わせたトークンを対象取引とともにTransformerで処理した（抄録）。", "p5": "3つのベンチマークデータで、多くのデータと指標の組み合わせで比較手法を上回った（抄録）。具体的な数値は抄録にない（未確認）。", "fun": "カードで1日に何十回も買い物をするのは怪しいが、お店が1日に何十回も売るのは普通だ。同じ数字でも、誰の数字かで意味が変わる。この研究は、AIの言葉の力で「その数字がその立場で何を意味するか」を説明させ、不正の見逃しを減らそうとした。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr30", "rank": 30, "headline": "AIを介したマーケティングへの消費者の信頼", "title": "Trust at the Interface: Consumer Trust, Transparency and Persuasion Knowledge in AI-Mediated Marketing", "url": "https://doi.org/10.20944/preprints202610.2583.v1", "authors": "Lalit Gautam", "venue": "Preprints.org", "date": "2026-10-27", "apa": "Gautam, L. (2026). Trust at the Interface: Consumer Trust, Transparency and Persuasion Knowledge in AI-Mediated Marketing. https://doi.org/10.20944/preprints202610.2583.v1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "AIが広告を選び、個別化し、書き、話す時代の消費者の信頼について、AIの開示・個人化とプライバシー・アルゴリズムへの選好と嫌悪の3つの研究の流れを、説得知識の活性化という1つの仕組みで統合する枠組みを示した概念的な論文（抄録）。", "p3": "AIの関与の開示、データ収集の明示性、エージェントの人間らしさ、課題の枠づけといった設計が、信頼に直接ではなく、説得者の目的と能力についての消費者の推論を通じて効くと論じ、AIと企業への信頼の帰属を分けて整理した（抄録）。", "p5": "AIの誤りの後の非対称な非難と回復を説明する失敗と修復のループを加え、検証可能な7つの命題を示した（抄録）。実証データは抄録の範囲にない。", "fun": "広告の文章をAIが書いていると知ったら、その広告を信じるだろうか。この論文は、AIだと明かすか、データをこっそり集めるか、人間らしく見せるかといった作り方が、「この相手は何をたくらんでいるのか」という推測を通じて信頼を左右すると整理した。AIが失敗した後の信頼の回復まで考えている点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "メキシコ高齢者の公的医療と非公式ケア", "title": "Public Health Coverage and Ageing with Chronic Conditions in Mexico: Healthcare Utilization, Functional Autonomy, and Informal Caregiving Among Adults Aged 50 and Older", "url": "https://doi.org/10.20944/preprints202610.2423.v1", "authors": "Odra A. Saucedo-Delgado ほか", "venue": "Preprints.org", "date": "2026-10-27", "apa": "Saucedo-Delgado, O. A., Bravo-Infanzón, I., & Mata, L. (2026). Public Health Coverage and Ageing with Chronic Conditions in Mexico: Healthcare Utilization, Functional Autonomy, and Informal Caregiving Among Adults Aged 50 and Older. https://doi.org/10.20944/preprints202610.2423.v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "メキシコの50歳以上で高血圧・糖尿病・関節炎のある人について、公的医療保険への加入が外来・入院の利用、機能的自立、家族への非公式な介護の提供と正に関連することを示した（抄録）。", "p3": "メキシコ健康加齢調査（ENASEM/MHAS、2001〜2024年）の7つの波を用い、傾向スコアのマッチングで処置群の平均処置効果（ATT）を推定し、従来の推定量と機械学習の推定量で頑健性を確かめた（抄録）。", "p5": "外来の利用（ATT = 0.148）、入院・医療の利用（0.034）、非公式な介護の提供（0.031）、機能的自立（0.017）のすべてと正に有意に関連した（抄録）。介護の提供の増加は必ずしもwell-beingの改善を意味しないと著者は注意している（抄録）。", "fun": "医療保険に入っている高齢者は病院をよく使えるだけでなく、家族の介護をしている割合も高かった。持病を抱えながら誰かの世話をしている高齢者がいるということだ。ただし著者は、それが幸せの向上とは限らないと注意している。数字の裏にある暮らしの重さを考えさせる研究だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "認知症の支援拒否を「否認」で片づけない", "title": "Beyond “Denial”: Understanding and Responding to Help-Refusal in Dementia", "url": "https://doi.org/10.20944/preprints202610.2516.v1", "authors": "Peter Carey", "venue": "Preprints.org", "date": "2026-10-27", "apa": "Carey, P. (2026). Beyond “Denial”: Understanding and Responding to Help-Refusal in Dementia. https://doi.org/10.20944/preprints202610.2516.v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "認知症の本人が受診や支援を拒むことを「否認」や頑固さとみなさず、症状であり関係上の課題として理解し対応するための、段階的で強制しない枠組みを示したナラティブレビュー（抄録）。", "p3": "既存の系統的レビュー、スコーピングレビュー、メタ民族誌、リアリスト統合などを統合し（新たな文献検索はしていない）、拒否の理由を病態失認、偏見と自立を失う恐れ、関係・コミュニケーション・状況の要因、制度の障壁の4つに整理した（抄録）。", "p5": "拒否を減らす介入の証拠は、身の回りのケア中の音楽と入浴方法の工夫で最も強いが、全体に質は低く、地域の家族介護者を含む研究は少ないとした（抄録）。理解・確認・枠づけ・協働・計画・段階的対応・継続の7段階を提案した（抄録）。", "fun": "認知症の家族が病院に行くのを嫌がると、つい「頑固だ」「認めたくないのだ」と思ってしまう。しかし本人は、病気のせいで自分の変化に気づけないこともある。この論文は、拒否を性格の問題ではなく症状として理解し、無理強いせずに段階を踏んで支える方法をまとめた。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr33", "rank": 33, "headline": "米国の豊かさと包摂的な帰属感の限界", "title": "United States Prosperity and the Limits of Inclusive Belonging: A Five Objective Comparison with Europe North America and Asia", "url": "https://doi.org/10.2139/ssrn.7672738", "authors": "Carlos Federico Obregon Diaz", "venue": "SSRN", "date": "2026-10-26", "apa": "Obregon Diaz, C. F. (2026). United States Prosperity and the Limits of Inclusive Belonging: A Five Objective Comparison with Europe North America and Asia. https://doi.org/10.2139/ssrn.7672738", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "所得と人間開発が高い一方で不平等が大きく、差別の報告が53か国の調査で最も多い米国を、帰属の経済学の5つの目標（成長・安定・分配・人間の潜在能力・社会と制度への帰属）で他国と比較した（抄録）。", "p3": "55か国の監査済みデータベースで、米国を欧州7か国、カナダ、メキシコ、日本、韓国、シンガポール、中国と比べ、報告された差別を相対所得と表現の自由で統計的に調整した（53の観測値の国レベルのモデル）（抄録）。", "p5": "表現の自由は差別の報告と正に関連し、それを入れると所得の係数は不正確になった（抄録）。米国の報告値50.52%は共通の基準条件で標準化得点45.08に相当し、米中の差は線形調整で26.32から5.83ポイントに縮むが、非線形の感度分析では逆転した（抄録）。", "fun": "「差別を受けた」と答える人が多い国ほど、本当に差別が多い国なのだろうか。自由に声を上げられる国ほど、差別を報告しやすいのかもしれない。この研究は、豊かな米国で差別の報告が最も多い理由を、表現の自由との関係から慎重に読み解こうとした。数字の読み方の難しさを教えてくれる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "都市インフォーマル経済を支える信頼の市場", "title": "Markets of Trust: Moral Economy and Social Control in the Urban Informal Economy", "url": "https://doi.org/10.31235/osf.io/keb7a_v2", "authors": "Floris Noordhoff", "venue": "SocArXiv", "date": "2026-10-26", "apa": "Noordhoff, F. (2026). Markets of Trust: Moral Economy and Social Control in the Urban Informal Economy. https://doi.org/10.31235/osf.io/keb7a_v2", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "オランダの不利な地域の低所得住民216人への詳細な面接から、インフォーマル経済は無秩序ではなく、名誉・体面・評判の規範による道徳的な規制と信頼・相互監視の仕組みで成り立っていることを示した（抄録）。", "p3": "面接の質的分析で、許容される助け合い、公正な取引、不当な稼ぎの境界がどう引かれるかを、道徳経済・社会関係資本・非公式な規制の理論から読み解いた（抄録）。", "p5": "信頼と非公式な監視は責任と連帯を生む一方、排他的な序列、性別による義務、道徳的な緊張も生んでいた（抄録）。著者は自助的な市民像に立つ単純な政策モデルに注意を促した（抄録）。", "fun": "お金に困った地域での「ちょっとした手伝いと謝礼」のやり取りは、ルールのない世界と思われがちだ。しかし216人の話を聞くと、名誉や評判という見えないルールが、何が良くて何がずるいかを細かく決めていた。秩序がないのではなく、目に見えない別の秩序があるという発見が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "近隣環境と生活空間が骨折後の回復を左右", "title": "Recovery in Place: A Multimodal Pilot Study of Neighborhood Context, Life-Space, and Social and Physical Functioning After Lower-Limb Fracture Surgery", "url": "https://doi.org/10.21203/rs.3.rs-11283018/v1", "authors": "Charlene H. Chu ほか", "venue": "Research Square (In Review)", "date": "2026-10-27", "apa": "Chu, C. H., Abedi, A., Julian, P., Maddiboina, D., & Khan, S. S. (2026). Recovery in Place: A Multimodal Pilot Study of Neighborhood Context, Life-Space, and Social and Physical Functioning After Lower-Limb Fracture Surgery. https://doi.org/10.21203/rs.3.rs-11283018/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "下肢骨折の手術や股関節置換の後に自宅で回復する高齢者18人を8週間追跡し、近隣の物質的な不利が社会的交流の少なさと、図書館や飲食店のある活動空間が股関節機能の良さと関連することを、多モードのセンサーで示したパイロット研究（抄録）。", "p3": "1,008人日のセンサーデータと隔週の臨床評価（社会的孤立尺度、オックスフォード股関節・膝スコア、TUG、30秒椅子立ち上がり）を、居住地と訪問地の施設・犯罪・国勢調査の社会経済データに結びつけ、一般化推定方程式と予測モデルで分析した（抄録）。", "p5": "近隣の物質的な不利は居住地と活動空間の両方で交流の少なさと関連し、1日の移動の回数の多さは交流の多さと関連した（抄録）。予測の誤差は人をまたぐ検証で大きく、社会空間の特徴の効果はモデルと結果によって異なった（抄録）。", "fun": "骨折の手術の後、家で元気を取り戻せるかどうかは、体の回復だけでなく住んでいる街にも左右されるらしい。18人の高齢者の移動を8週間記録すると、貧しい地域では人との交流が少なく、図書館やお店に出かける人ほど股関節の調子が良かった。街の環境がリハビリの一部になっている点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr36", "rank": 36, "headline": "中国の都市スクリーンはスマートシティの界面に", "title": "The Evolution and 'Chineseness' of Urban Screens in China: From Propaganda Posters to Smart City Interfaces", "url": "https://arxiv.org/abs/2610.35762", "authors": "Wuwu Ran", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Ran, W. (2026). The Evolution and 'Chineseness' of Urban Screens in China: From Propaganda Posters to Smart City Interfaces (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35762", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "中国の都市スクリーンの発展は、公共的な伝達の系譜、国家主導の技術的な飛躍、規模を可能にしつつ運用の統制を強める規制の逆説が結びついた独自のメディア都市の型（Chineseness）であると論じた（抄録）。", "p3": "1990年から現在までの5段階の系譜、代表的なスクリーンの年表、5つの典型事例を用いた歴史的・事例的な分析（抄録）。", "p5": "この構成が時間と空間の圧縮、複数の技術世代の共存、個人の端末での双方向性より集団での目撃の重視を生むことを示し、非西洋のメディア生態を分析する概念として提示した（抄録）。", "fun": "駅前やビルの巨大スクリーンは世界中にあるが、中国では宣伝ポスターの時代から続く「みんなに伝える」伝統と、国の後押しによる技術の一足飛びが重なって独特の発展をした。スマホで一人ずつ見るより、街でみんなで同時に見ることを重んじる点が、欧米との違いとして面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr37", "rank": 37, "headline": "人間中心のAI能力が従業員を力づける", "title": "Human-centered AI Capability and employee outcomes in an emerging economy: mediating role of empowerment and moderating role of digital culture", "url": "https://doi.org/10.21203/rs.3.rs-10923266/v1", "authors": "Mahmoud K. Abouraia ほか", "venue": "Research Square (In Review)", "date": "2026-10-27", "apa": "Abouraia, M. K., Morsy, R. M. E., El-Ashery, M. H., & Galal, H. M. (2026). Human-centered AI Capability and employee outcomes in an emerging economy: mediating role of empowerment and moderating role of digital culture. https://doi.org/10.21203/rs.3.rs-10923266/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "エジプトの42組織の従業員387人の調査で、組織のAI能力は従業員の成果とエンゲージメントと正に関連し、その一部は心理的エンパワーメントを通じた経路であることを示した（抄録）。", "p3": "資源ベース理論と心理的エンパワーメント理論に基づき、銀行・通信・医療・製造・小売の横断調査を共分散構造分析で分析し、ブートストラップによる媒介の検定と多母集団比較でデジタルな組織文化の調整効果を調べた（抄録）。", "p5": "エンパワーメントは部分的に媒介し、AI能力からエンパワーメントへの関係は、デジタル文化の発達した組織でそうでない組織のおよそ2倍強かった（抄録）。", "fun": "会社にAIを入れれば社員が元気になる、とは限らない。エジプトの387人の調査では、AIの力が社員の成果につながるのは、社員が「自分で決められる」「役に立てる」と感じるときだった。しかもデジタルに慣れた職場ほど、その効果が約2倍強かった。道具より使う人の気持ちが大事だという話だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "基本的欲求の必要条件効果は再検証で不確か", "title": "Inconclusive evidence for necessity effects of basic psychological need satisfaction on employee well-being: Re-examining Ding et al. (2026)", "url": "https://doi.org/10.31234/osf.io/bw7mf_v1", "authors": "Kimmo Sorjonen ほか", "venue": "PsyArXiv", "date": "2026-10-27", "apa": "Sorjonen, K., Melin, B., Folke, F., & Melin, M. (2026). Inconclusive evidence for necessity effects of basic psychological need satisfaction on employee well-being: Re-examining Ding et al. (2026). https://doi.org/10.31234/osf.io/bw7mf_v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "従業員のwell-beingには基本的心理欲求の充足が必要条件だとしたDingらの必要条件分析（NCA）を、相関だけから生じる見かけの必要性と比べて再分析し、結論の支持は乏しいことを示した（抄録）。", "p3": "NCAの必要性の効果は、真の必要条件がなくても変数間の相関から似た形で生じうるため、報告された効果を相関だけから期待される見かけの範囲と比べた（抄録）。", "p5": "報告された効果の96.4%は見かけの範囲の内側か下にあり、真の必要条件がない場合に期待される大きさを超えていなかった（抄録）。NCAの適用には見かけの範囲の評価を標準で含めるよう提案した（抄録）。", "fun": "「これがなければ絶対に幸せになれない」という必要条件を統計で示す方法がある。ところが、ただ2つの数字が一緒に動くだけでも、必要条件があるように見えてしまうことがある。この研究は既存の結論を再分析し、ほとんどの効果がその「見かけ」の範囲に収まることを示した。統計の落とし穴に気づかせてくれる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr39", "rank": 39, "headline": "リーダーシップ機能をエージェント型AIに委ねる", "title": "Leadership as a Service? Delegating Leadership Functions to Agentic AI—Boundaries, Risks and Accountabilities", "url": "https://doi.org/10.20944/preprints202610.2543.v1", "authors": "Lalit Gautam", "venue": "Preprints.org", "date": "2026-10-27", "apa": "Gautam, L. (2026). Leadership as a Service? Delegating Leadership Functions to Agentic AI—Boundaries, Risks and Accountabilities. https://doi.org/10.20944/preprints202610.2543.v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "エージェント型AIが監視・調整・タスク配分・フィードバックなどを担い始めた状況で、リーダーシップの機能をどこまでAIに委ねられるかを、機能ごとの委譲可能性の枠組みで整理した概念的な論文（抄録）。", "p3": "機能的リーダーシップ理論、自動化と拡張のパラドックス、アルゴリズム管理とAIへの信頼の研究に基づき、感知と監視、調整、決定と配分、育成とフィードバック、代表と意味づけの5つの機能を分類した（抄録）。", "p5": "委譲の可否は技術より説明責任で決まるとし、委譲すると責任の連鎖が切れる機能は実行を自動化しても所有は委ねない「説明責任の床」の原則を示した（抄録）。正統性と信頼、規模化した偏り、責任の空白、リーダー育成の経路の侵食という4つのリスクを挙げた（抄録）。", "fun": "仕事の割り振りや励ましの声かけをAIがしてくれる職場は、もう夢物語ではない。では、上司の仕事はどこまでAIに任せてよいのか。この論文は、技術的にできるかどうかより、「何かあったとき誰が責任を取るのか」で線を引くべきだと論じた。便利さと責任のバランスを考えさせる話だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr40", "rank": 40, "headline": "NYC採用AIのバイアス監査は統計的に不定", "title": "Four-Fifths of What? Statistical Indeterminacy in NYC Local Law 144 Bias Audits and the Governance Parameters It Exposes", "url": "https://doi.org/10.5281/zenodo.23672858", "authors": "Jackson, Matthew", "venue": "Zenodo", "date": "2026-10-26", "apa": "Jackson, M. (2026). Four-Fifths of What? Statistical Indeterminacy in NYC Local Law 144 Bias Audits and the Governance Parameters It Exposes (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.23672858", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された説明（抄録）を使用", "preprint": true, "short": true, "p1": "採用AIのバイアス監査の公表を義務づけるニューヨーク市地方法144の公開監査114件（影響比2,154個）を再分析し、多くの比率が4/5基準と統計的に区別できず、監査人に任された1つのパラメータが合否を左右することを示した（抄録）。", "p3": "ACLUの監査コーパスの影響比を、背後のデータから判定できる範囲と多重比較の誤差制御で評価し、応募者の2%未満の区分を除外できる裁量規定の有無で4/5基準の結論がどう変わるかを調べた（抄録）。", "p5": "報告された比率の22.1%は4/5基準と区別できず、誤差制御のもとで0.80未満の比率があると言える監査は114件中29件、すべて0.80以上と言えるのは27件だった（抄録）。除外の裁量は22件の結論を左右し、うち19件は合格の版を公表していた（抄録）。", "fun": "採用にAIを使う会社は、AIが特定の人種や性別に不利になっていないかの監査結果を公表する決まりがある。ところが、少人数の区分を除外してよいという一つの裁量だけで、合格か不合格かが変わる監査が22件もあった。ルールの細部が公正さを左右するという、身近で大事な指摘だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr41", "rank": 41, "headline": "直交多項式多様体で非線形に次元を縮約", "title": "Greedy Orthogonal Polynomial Manifolds with Lipschitz Control for Dimensionality Reduction and Reduced Modeling", "url": "https://arxiv.org/abs/2610.33784", "authors": "Tomoki Koike ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Koike, T., Peherstorfer, B., & Qian, E. (2026). Greedy Orthogonal Polynomial Manifolds with Lipschitz Control for Dimensionality Reduction and Reduced Modeling (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33784", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "多項式の復号器で非線形の低次元表現を作る多項式多様体について、復号器のリプシッツ定数に上限を課しながら、符号化のモードと多項式の特徴を貪欲に選ぶGreedy-OPMを提案した（抄録）。", "p3": "多項式の項を学習データ上で正規直交な特徴で表すことで、復元誤差を最小化する貪欲なアルゴリズムを可能にし、リプシッツ定数の上限の制約のもとでモードと特徴を同時に選んだ（抄録）。", "p5": "数値実験で、リプシッツ制約は高い復元精度を保ちながら、学習データから離れた領域での汎化を改善した（抄録）。具体的な数値と対象の問題は抄録にない（未確認）。", "fun": "複雑な現象を少数の変数で表す「次元の縮約」は、計算を大きく軽くする技だ。ただ、学習したデータの外では急におかしな答えを出すことがある。この研究は、答えが急に変わりすぎないよう「傾きの上限」を課すことで、見たことのない状況でも安定して使える縮約モデルを作った。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr42", "rank": 42, "headline": "乱流への生成AIの基礎と検証の総説", "title": "Generative AI in Turbulence: Foundations, Applications, Validations and Benchmarks", "url": "https://arxiv.org/abs/2610.35123", "authors": "Luca Biferale ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Biferale, L., & Buzzicotti, M. (2026). Generative AI in Turbulence: Foundations, Applications, Validations and Benchmarks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35123", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "観測が不完全で複数の物理的にあり得る解がある乱流の問題に、拡散モデルなどの生成AIをどう使い、どう検証すべきかを、AIと乱流の両分野の橋渡しとして整理した総説（抄録）。", "p3": "確率的なクロージャ、超解像、データ同化、不確実性の定量化、流れのアンサンブル生成への応用を、拡散モデル・スコアベース法・確率輸送の定式化を中心に、無条件生成、確率的再構成、縮約モデル、時間発展、メッシュフリー表現の観点から論じた（抄録）。", "p5": "見た目の写実性や点ごとの誤差では物理的な忠実度を測れないとし、エネルギー輸送、構造関数、異常スケーリング、確率密度の裾、保存則、時間的一貫性などで検証すべきだと主張し、公開データと隠しテストを含むベンチマークの必要性を述べた（抄録）。", "fun": "画像を作るAIで、川や風の乱れた流れも作れるだろうか。この総説は、乱流は「それらしく見える」だけでは不十分で、エネルギーの受け渡しやまれな極端現象まで正しく再現できているかを確かめる必要があると説く。見た目と物理の正しさは別物だという指摘が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr43", "rank": 43, "headline": "疎でノイズの多い3D観測で地すべりを検出", "title": "How Much Sensing is Enough? Landslide Detection from Sparse and Noisy 3D Observations", "url": "https://arxiv.org/abs/2610.34869", "authors": "Arijit Pal ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Pal, A., Mohanty, A., Paul, D., Chakraborty, S., & Palit, B. (2026). How Much Sensing is Enough? Landslide Detection from Sparse and Noisy 3D Observations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34869", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "大規模な地すべり検出に必要な3次元観測の密度を問い、疎でノイズの多い観測から地形を再構成して地すべりの起きやすい領域を特定する学習の枠組みを示した（抄録）。", "p3": "OpenTopographyの数値標高モデルとNASAのSMAPの土壌水分を組み合わせた物理に基づくデータセットを作り、地すべりを無作為に発生させて観測の間引きと確率的なノイズを加え、CNNとXGBoostで地形の再構成と検出を行った（抄録）。", "p5": "元の観測の20%だけで、検出の正解率80%、ROC-AUC 0.868、再構成誤差（L2チャンファー距離）99.67 m²を示し、観測密度と検出性能のトレードオフを調べた（抄録）。", "fun": "山の斜面を細かく3Dで測れば地すべりを見つけやすいが、広い範囲を密に測るのは大変だ。この研究は「どこまで測りを減らしても大丈夫か」を調べ、元の2割の観測でも8割の正解率で危ない場所を見つけられることを示した。限られた観測で賢く守る発想が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr44", "rank": 44, "headline": "残差で選ぶ局所ROMで流れの形状最適化", "title": "Residual-Screened Local Reduced-Order Modeling for Brinkman-Penalized Shape Optimization of Incompressible Flows", "url": "https://doi.org/10.2139/ssrn.7674771", "authors": "Xi Li ほか", "venue": "SSRN", "date": "2026-10-27", "apa": "Li, X., Ju, L., & Wang, Z. (2026). Residual-Screened Local Reduced-Order Modeling for Brinkman-Penalized Shape Optimization of Incompressible Flows. https://doi.org/10.2139/ssrn.7674771", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "非圧縮性の定常流れの形状最適化で、残差の指標で精度を確かめながらその場で局所的な縮約モデル（ROM）を作り、不正確なときだけ完全な計算に戻る方法を提案した（抄録）。", "p3": "ブリンクマンのペナルティ法で形状を位相場として1つの構造格子上に表し、スライドする窓の状態とアジョイントのスナップショットから縮約モデルを作り、較正した残差指標で各縮約解を選別し、双対重みの推定で目的関数を完全計算で検証する時機を決めた（抄録）。", "p5": "2次元のストークス流と物体まわりのナビエ–ストークス流（レイノルズ数40と200）、3次元のストークス最小抵抗体で、目的関数は完全計算と相対誤差6×10⁻⁵以内で一致し、速度は2次元で1.9〜2.1倍、3次元で20倍、簡易版は3.8〜7.4倍と30倍だった（抄録）。", "fun": "流れの中に置く物体の形を最適にするには、流れの計算を何百回も繰り返す必要があり、とても時間がかかる。この研究は計算の「近道」を使いながら、近道が怪しいときだけ本格的な計算に戻る仕組みで、精度を保ったまま3次元では最大30倍速くした。手を抜くところと抜かないところの見極めが面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr45", "rank": 45, "headline": "都市峡谷のGNSS異常検出の総覧", "title": "GNSS Anomaly Detection in Urban Canyons: A Comprehensive Survey of Multimodal Visibility Inference", "url": "https://arxiv.org/abs/2610.34468", "authors": "Abdelgabar Ahmed ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Ahmed, A., Ballal, T., Kouzayha, N., & Al-Naffouri, T. Y. (2026). GNSS Anomaly Detection in Urban Canyons: A Comprehensive Survey of Multimodal Visibility Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34468", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "都市の高層ビル街（都市峡谷）でGNSS測位を劣化させる非直接波やマルチパスを見分ける方法を、受信機側の信号、3次元地図と環境モデル、補助センサの3つの証拠の系統に整理した総説（抄録）。", "p3": "受信機側はアンテナ・追尾・観測量の証拠をルール・統計・機械学習・深層学習で解釈する方法を、地図側は幾何的な選別・影の照合・3次元レイトレーシング・ニューラルな可視性予測を、補助センサはIMU・カメラ・LiDARを扱い、精度・解釈性・必要な機器と較正・計算量・即時性で比べた（抄録）。", "p5": "データの質とラベル付け、領域をまたぐ汎化、地図の鮮度、資源効率の良い実装を未解決の課題として挙げた（抄録）。比較の数値は抄録にない（未確認）。", "fun": "ビルが立ち並ぶ街では、衛星からの電波がビルに反射して届くため、スマホの位置がずれることがある。この総説は、電波そのものの特徴、街の3D地図、カメラや加速度センサという3種類の手がかりで「怪しい電波」を見分ける方法を整理した。見えない電波の通り道を推理する技術が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr46", "rank": 46, "headline": "分岐桁橋の多尺度エネルギー解析と地震損傷", "title": "Progressive Multiscale Energy Analysis Framework and Seismic Damage Evolution of a Turnout Girder Bridge", "url": "https://doi.org/10.2139/ssrn.7675495", "authors": "Xin Fan ほか", "venue": "SSRN", "date": "2026-10-27", "apa": "Fan, X., Chen, S., Li, J., Jiang, Z., & Song, Y. (2026). Progressive Multiscale Energy Analysis Framework and Seismic Damage Evolution of a Turnout Girder Bridge. https://doi.org/10.2139/ssrn.7675495", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "高速鉄道の分岐桁橋のような不整形な橋で、構造・部材・区間・要素の4つの尺度へ段階的に絞り込むエネルギー解析の枠組みを提案し、地震による損傷の進展を追跡した（抄録）。", "p3": "縮尺模型の振動台実験で弾性の縦方向応答を検証した非線形有限要素モデルを作り、地震の強さと入力方向を変えてエネルギー応答と損傷の進展を解析した（抄録）。", "p5": "頻発地震では構造はほぼ弾性だが、まれな地震では塑性ひずみエネルギーが大きく増え、縦方向の塑性応答が横方向を上回った（抄録）。縦方向ではP3、横方向ではP2の橋脚が最も塑性化し、脆弱な部位は橋脚基部の外面の縁に絞り込まれ、支承の破壊後は橋脚の塑性の進展が遅くなり桁との相対変位が増えた（抄録）。", "fun": "地震で橋のどこが一番先に壊れるかを知るには、橋全体から部材、さらに細かな部分へと順に目を向けていく必要がある。この研究は、地震のエネルギーがどこにたまるかを段階的に追い、橋脚の根元の外側の角から壊れ始める様子を突き止めた。全体から部分へ絞り込む探偵のような分析が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr47", "rank": 47, "headline": "物理を組み込んだResNetで輪軸軸受を音響診断", "title": "Physics-Informed Modulated Fusion ResNet for Noise-Robust Acoustic Fault Diagnosis of Railway Wheelset Bearings", "url": "https://doi.org/10.21203/rs.3.rs-11348519/v1", "authors": "Peihai Li ほか", "venue": "Research Square (In Review)", "date": "2026-10-27", "apa": "Li, P., Li, Z., Cao, D., Zhang, B., Li, C., & Liu, H. (2026). Physics-Informed Modulated Fusion ResNet for Noise-Robust Acoustic Fault Diagnosis of Railway Wheelset Bearings. https://doi.org/10.21203/rs.3.rs-11348519/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "強い背景雑音の中で鉄道の輪軸軸受の故障を音で診断するため、聴覚に着想を得た音響表現と、軸受の形状と回転数から予測される故障周波数の知識を組み込む物理情報つきのResNet（PIMF-ResNet）を提案した（抄録）。", "p3": "故障の特徴周波数とその3次までの高調波の周りの包絡線スペクトルのピーク振幅15次元を事前知識として抽出し、物理注意機構でResNet34の特徴をチャネルごとに変調し、物理整合性の損失を加えた（抄録）。", "p5": "250 r/minで集めた実験室の音響データに環境雑音を加えた条件で、元の録音で98.83%、−15 dBで79.24%の正解率を示し、−15 dBでは聴覚表現だけの比較手法を6.64ポイント上回った（抄録）。", "fun": "電車の車輪の軸受が傷むと、回転に合わせて特有の音が出る。ところが線路の脇は騒がしく、その音はかき消されがちだ。この研究は、軸受の形と回転数から「故障ならこの高さの音が出るはず」という物理の知識をAIに教え、騒音の中でも聞き分けやすくした。耳の良い職人の勘をAIに持たせる発想だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr48", "rank": 48, "headline": "分布ずれ下の工学回帰の不確実性定量を比較", "title": "Benchmarking uncertainty quantification for engineering regression under graded distribution shift", "url": "https://arxiv.org/abs/2610.35356", "authors": "Ahmad Lawal ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Lawal, A., Pasbanigoloojeh, R., & Bilbis, A. L. (2026). Benchmarking uncertainty quantification for engineering regression under graded distribution shift (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35356", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "工学の回帰で使う不確実性定量の手法を、物理的に意味のある変数に沿った3段階の分布のずれ（分布内・弱いずれ・強いずれ）で比較するベンチマークを示し、強いずれでは被覆率が大きく下がることを示した（抄録）。", "p3": "5系統12手法を、7つの公開の工学データ（5つの外挿設定、未知のターボファン故障、冬の大気質センサの展開）で評価し、調整は元のデータだけで行った（抄録）。", "p5": "分布内では共形法がすべてのデータで0.946以上を被覆したが、強いずれでは常に区間を返す11手法の平均被覆率が0.40〜0.75に下がり、手法の順位に系統的な差はなかった（Friedman p = 0.63）（抄録）。重みつき共形分位点回帰は強いずれの点の平均85%で回答を控えた（抄録）。", "fun": "AIの予測に「どれくらい自信があるか」を付ける方法はたくさんあるが、学習したときと違う状況で本当に役立つのか。この研究は、状況のずれを3段階に分けて12の方法を試し、ずれが大きいと多くの方法の自信の幅が信用できなくなることを示した。想定外にこそ注意が要るという教訓だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr49", "rank": 49, "headline": "パラメトリック場予測のTucker型代理モデル", "title": "A Product-Grassmann Tucker Surrogate for Parametric Field Prediction", "url": "https://arxiv.org/abs/2610.34559", "authors": "Melika Baghi ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Baghi, M., Liu, X., & Paynabar, K. (2026). A Product-Grassmann Tucker Surrogate for Parametric Field Prediction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34559", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "設計最適化やデジタルツインで繰り返し必要になる偏微分方程式の全場予測のため、空間の各方向と時間を別々のモードとして保つTucker分解に基づく代理モデルを提案した（抄録）。", "p3": "因子の部分空間を積グラスマン多様体上で補間し、プロクラステス整合でTuckerのコアを同じ座標系にそろえ、その変化を打ち切り特異値分解でモデル化した（抄録）。", "p5": "2次元と3次元の5つのPDEのベンチマークで、単一部分空間のグラスマン代理モデルと比べ、補間の大きさを13〜482分の1、保存するモデルを13〜464分の1にし、問い合わせは3.3〜8.5倍速く、平均誤差の差は最大0.22ポイントだった（抄録）。3次元格子では比が2,260、速度向上が11.9倍に達した（抄録）。", "fun": "シミュレーションを何度も回す設計では、毎回の計算を軽くする「代理モデル」が欠かせない。この研究は、空間の縦・横・高さと時間を別々に扱う工夫で、保存するデータを最大で数百分の一に減らしながら、精度をほとんど落とさなかった。データの形をそのまま生かす発想が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr50", "rank": 50, "headline": "コンクリートのひび割れデータベースの作り方", "title": "Cement Structures Crack Database Methods Acquisition and Preparation: A Review", "url": "https://doi.org/10.3233/atde261109", "authors": "Ata Jahangir Moshayedi ほか", "venue": "HAL", "date": "2026-10-24", "apa": "Moshayedi, A. J., Nguyen, Q., & Bassir, D. (2026). Cement Structures Crack Database Methods Acquisition and Preparation: A Review. Civil Construction and Structural Engineering. https://doi.org/10.3233/atde261109", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、登録された抄録を使用", "preprint": true, "short": true, "p1": "橋・ダム・トンネルなどコンクリート構造物のひび割れの信頼できるデータベースを作るためのデータ取得法を、ドローンによる高解像度の光学・熱画像を中心に整理した総説（抄録）。", "p3": "現地での取得方法を比較し、RANSACや適応的な二値化などによる環境の干渉の雑音処理がAIモデルの信頼性を左右する点を論じた（抄録）。", "p5": "測定精度、費用、即時処理の間のトレードオフを比較した（抄録）。比較の具体的な数値は抄録にない（未確認）。", "fun": "橋やトンネルのひび割れをAIで見つけるには、まずたくさんの「ひび割れの写真」を集めた辞書が必要だ。この総説は、ドローンで撮る普通の写真と熱の写真の使い分けや、光や汚れによる雑音の消し方など、良い辞書づくりのコツをまとめた。AIの賢さはデータ集めで決まるという話だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習（Hugging Face）", "headline": "道具使用エージェントは根拠ある判断から学ぶ", "title": "Trajectory2Gym: Decision-Grounded Compositional Interaction Synthesis for Tool-Use Agents", "url": "https://arxiv.org/abs/2610.33568", "authors": "Yihao Hu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-27", "apa": "Hu, Y., Wen, Z., Lin, Y., Lu, S., Wang, P., Wu, W., Yang, J.-M., & Lin, T. (2026). Trajectory2Gym: Decision-Grounded Compositional Interaction Synthesis for Tool-Use Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33568", "why": "成功した軌跡を集めるだけでなく、依存関係を含み判断の根拠が見える対話を作って学ばせることで、Qwen3の5規模すべてで道具使用ベンチマークの平均を16.9〜29.8ポイント上げた。"}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "LLM家計のHANK経済で政策乗数を測る", "title": "LLM-Driven Households in HANK Economies", "url": "https://doi.org/10.2139/ssrn.7668360", "authors": "Mengzhong Ma ほか", "venue": "SSRN", "date": "2026-10-26", "apa": "Ma, M., Zhou, J., Ariel Mulyawan, W., Bao, T., Cong, L. W., & Wen, Y. (2026). LLM-Driven Households in HANK Economies. https://doi.org/10.2139/ssrn.7668360", "why": "消費を決める家計をLLMにした異質的エージェントのニューケインジアン経済で、期待の測り方がモデルの一部になることを示し、LLM家計が近い将来を過大に重みづけて財政乗数を押し上げることを3系統のLLMで確かめた。"}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "LLMが書いた弱操作変数2SLSの許容性論文", "title": "AI in Econometric Theory: An Example", "url": "https://arxiv.org/abs/2610.35831", "authors": "Isaiah Andrews ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Andrews, I., & Mikusheva, A. (2026). AI in Econometric Theory: An Example (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35831", "why": "弱い操作変数のもとでの二段階最小二乗法の許容性という計量経済理論の論文を、著者らのLLMがどう書いたかの記録とあわせて公開し、AIが理論研究に与える意味を論じた。"}, {"id": "pn04", "rank": 4, "field": "統計学", "headline": "生成AIで非構造処置の実験を設計し分析する", "title": "AI-assisted design and analysis of experiments with unstructured treatments", "url": "https://arxiv.org/abs/2610.33818", "authors": "Eli Ben-Michael ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Ben-Michael, E., & Branson, Z. (2026). AI-assisted design and analysis of experiments with unstructured treatments (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33818", "why": "文章や画像など非構造の処置を使う社会科学の実験で、生成AIで処置を抽出して内的妥当性と外的妥当性のトレードオフを明示的に扱い、AI予測で偏りなく精度を上げる推定量を示した。"}, {"id": "pn05", "rank": 5, "field": "因果推論", "headline": "NYCの混雑課金で区域内の交通量が4割減", "title": "Cordon Tolls and Urban Traffic Volumes: Evidence from NYC's 2025 Congestion Relief Zone", "url": "https://arxiv.org/abs/2610.34818", "authors": "Yash Prajapati", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Prajapati, Y. (2026). Cordon Tolls and Urban Traffic Volumes: Evidence from NYC's 2025 Congestion Relief Zone (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34818", "why": "米国初の恒久的なコードン型混雑課金について、区域内と北側の道路区間を比べる差の差法で、課金区域の時間当たり交通量が40〜45%減り、イーストリバーの橋で迂回による増加が生じたと推定した。"}, {"id": "pn06", "rank": 6, "field": "機械学習", "headline": "強化学習にも予測可能なスケーリング則", "title": "An Empirical Study of Reinforcement Learning Scaling Laws", "url": "https://arxiv.org/abs/2610.33420", "authors": "Zeyu Zheng ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Zheng, Z., Lyle, C., Khetarpal, K., & Dabney, W. (2026). An Empirical Study of Reinforcement Learning Scaling Laws (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33420", "why": "2つの手続き生成環境で行為者–批評者法のスケーリング則を見いだし、Eloスコアを指標にすると計算量で2桁大きい学習の性能・最適配分・ハイパーパラメータを予測できることを示した。"}, {"id": "pn07", "rank": 7, "field": "ヒューマンコンピュータインタラクション", "headline": "自分の人生の反実仮想で遠い政策リスクが近くなる", "title": "The As-If Machine: Personalized counterfactuals make distant policy risks feel close", "url": "https://arxiv.org/abs/2610.33301", "authors": "Joshua Ashkinaze ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Ashkinaze, J., Zhou, Y., Chen, P., Bhattacharya, A., Park, H., Zhang, Y., Preston, S., Gilbert, E., & Budak, C. (2026). The As-If Machine: Personalized counterfactuals make distant policy risks feel close (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33301", "why": "参加者がAIと共同で「その政策の未来に自分が生きていたら」という物語を書く仕組みを2つの事前登録実験で検証し、リスクを身近に感じる度合いを専門家の文章より高めた。"}, {"id": "pn08", "rank": 8, "field": "統計学", "headline": "ログと少数の試行でAIエージェントを監査する", "title": "Adaptive Probe Design for Auditing AI Agents", "url": "https://arxiv.org/abs/2610.34751", "authors": "Zhenghan Li ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Li, Z., Bi, X., & Ding, J. (2026). Adaptive Probe Design for Auditing AI Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34751", "why": "過去のログでは足りない状態と行動の領域に監査試行を集中させる凸最適化の設計で、展開予定の方策の性能推定を改善し、誤差の上限も与えた。"}, {"id": "pn09", "rank": 9, "field": "因果推論", "headline": "連続処置の効果に未観測交絡下で鋭い限界", "title": "Sharp Bounds on Continuous Treatment Effects under Unobserved Confounding", "url": "https://arxiv.org/abs/2610.33278", "authors": "Junzhe Zhang", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Zhang, J. (2026). Sharp Bounds on Continuous Treatment Effects under Unobserved Confounding (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33278", "why": "応答関数と傾向スコアの滑らかさだけを仮定し、観測された対角上のすべての参照点を使うことで、連続処置の条件付き平均潜在結果と効果に鋭い限界を与えた。"}, {"id": "pn10", "rank": 10, "field": "経済学", "headline": "生成AIで飾った応募書類をどう選抜するか", "title": "Screening AI-equipped applicants", "url": "https://arxiv.org/abs/2610.34508", "authors": "Pengyu Qian ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Qian, P., & Yu, S. H. (2026). Screening AI-equipped applicants (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34508", "why": "応募者が生成AIで書類を安く飾れるとき、操作能力のばらつきが大きいほど最適な採用は観察できる質だけに収束することを示し、書類経由の別ルートを設けた二重の仕組みが漸近的に最適になることを導いた。"}, {"id": "pn11", "rank": 11, "field": "組織行動・心理的安全性", "headline": "遊び心のある振り返りが開発チームの燃え尽きを防ぐ", "title": "Playfulness for Well-being in Software Development Teams", "url": "https://doi.org/10.2139/ssrn.7675016", "authors": "Phuong Thao Nguyen ほか", "venue": "SSRN", "date": "2026-10-27", "apa": "Nguyen, P. T., Chung, S. H., Rasmussen, T. W., & Persson, J. (2026). Playfulness for Well-being in Software Development Teams. https://doi.org/10.2139/ssrn.7675016", "why": "スプリントの振り返りに遊びの要素を入れる会話型ゲームを設計し、8チームでの検証から、心理的安全性と率直さを高め硬直した習慣を崩す設計原則を導いた。"}, {"id": "pn12", "rank": 12, "field": "経営学", "headline": "緊急流動性の利用行は預金金利を上げずに済んだ", "title": "Did Emergency Liquidity Distort Deposit Competition? Evidence from the Bank Term Funding Program", "url": "https://doi.org/10.2139/ssrn.7672004", "authors": "Nur Al Faisal", "venue": "SSRN", "date": "2026-10-26", "apa": "Faisal, N. A. (2026). Did Emergency Liquidity Distort Deposit Competition? Evidence from the Bank Term Funding Program. https://doi.org/10.2139/ssrn.7672004", "why": "米国の銀行タームファンディングプログラムの貸出データと支店の預金金利を結び、利用行は同じ郡の競合より定期預金金利の引き上げが6〜8ベーシスポイント小さかったことを示した。"}, {"id": "pn13", "rank": 13, "field": "機械学習（Hugging Face）", "headline": "必要に応じて協働を組み立てる多エージェント", "title": "DynaFlow: Learning Free-Form Multi-Agent Orchestration", "url": "https://arxiv.org/abs/2610.34467", "authors": "Ruhao Liu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-27", "apa": "Liu, R., Li, Q., Wang, S., & Wang, X. (2026). DynaFlow: Learning Free-Form Multi-Agent Orchestration (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34467", "why": "主エージェントが協働の要否を判断し、副エージェントを動かすワークフローをその場で生成する仕組みを学習させ、6つのベンチマークで最強の比較手法を10.90ポイント上回った。"}, {"id": "pn14", "rank": 14, "field": "ヒューマンコンピュータインタラクション", "headline": "AIへの情緒的ニーズと機能的ニーズは併存する", "title": "Affective and Functional Needs in AI Use: User Patterns and Their Relation to Real-Life Support and Well-Being", "url": "https://arxiv.org/abs/2610.34732", "authors": "Jessy Wang-Sun ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Wang-Sun, J., Sun, E. Y., Zhang, H., & Xu, Z. (2026). Affective and Functional Needs in AI Use: User Patterns and Their Relation to Real-Life Support and Well-Being (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34732", "why": "1,090人で会話AIから受ける支援の4次元を測る尺度を作り、情緒的と機能的の両方の目的でAIを使う利用者がいることと、現実の支援やwell-beingとの関係を示した。"}, {"id": "pn15", "rank": 15, "field": "統計学", "headline": "ラベルを能動的に選んで母平均を推定する", "title": "Pro-Active Inference", "url": "https://arxiv.org/abs/2610.34681", "authors": "Skyler Wu ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Wu, S., Nair, Y., Maechler, A., & Candès, E. J. (2026). Pro-Active Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34681", "why": "機械学習の予測を使い、次にラベルを付ける観測を逐次選びながら妥当な信頼区間を作る非復元の能動的推測を定式化し、有限標本の不偏性と漸近的な妥当性を示した。"}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "AIによる自動化は熟練者の育成経路を細らせる", "title": "The Capability Transfer: Cohort Reversal, Codified Expertise, and the Adaptability Tax of AI Transformation", "url": "https://arxiv.org/abs/2610.33102", "authors": "Ina Catrinescu", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Catrinescu, I. (2026). The Capability Transfer: Cohort Reversal, Codified Expertise, and the Adaptability Tax of AI Transformation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33102", "why": "若手の定型業務が先に自動化されると熟練者の供給が遅れて大きく減ることを2世代モデルで示し、内部で熟練者を育てる期間が約5年から9年に延びると試算した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "AIが定型化された仕事を自動化すると、若手の需要が先に減り、その後に熟練者の層が遅れて大きく減ることを、若手と熟練の2世代からなる企業のモデルで示した（抄録）。", "p3": "Caosun and Aral（2026）の単一労働者のモデルを2世代の企業に拡張し、AIにできない仕事での補助なしの練習で専門性が育つと仮定して、熟練者の育成経路を分析し、ベースラインの較正でシナリオを示した（抄録）。", "p5": "若手の需要は2022年の水準より約5分の1下で底を打ってから回復するが、熟練者の数は4分の1減ったのち半減し、内部で専門家を育てる期間は約5年から9年に延びた（抄録）。3年の視野の管理者は賃金総額を21%削るが、AIにできない仕事の能力は5分の2減る（抄録）。結果は予測ではなくシナリオである（抄録）。", "fun": "AIが新人の仕事を肩代わりしても、すぐには困らない。ところが新人が経験を積む場がなくなり、何年かたつとベテランが足りなくなる。このモデルでは、一人前に育つまでの年数が約5年から9年に延びた。目先の効率と将来の人材育成がぶつかるという、どの職場にも通じる話だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "固定価格契約の満了で家計の電気代と滞納が増加", "title": "Consumer Protection and Market Efficiency under Energy Price Shocks", "url": "https://doi.org/10.2139/ssrn.7675051", "authors": "Jacopo Lunghi ほか", "venue": "SSRN", "date": "2026-10-27", "apa": "Lunghi, J., Bonan, J., Cattaneo, C., anon, G., & Tavoni, M. (2026). Consumer Protection and Market Efficiency under Energy Price Shocks. https://doi.org/10.2139/ssrn.7675051", "why": "イタリアの電力会社で固定価格契約が順次満了し卸価格連動に切り替わる変化を使い、支出が20〜56%増え、滞納と分割払いの利用が増えたことを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "欧州エネルギー危機の中、イタリアの大手電力会社で長期の固定価格契約が順次満了して卸価格連動の料金に自動で切り替わった変化を使い、家計の支出・消費・支払い困難への影響を推定した（抄録）。", "p3": "契約満了の時期の違いを、高い電気代への曝露のほぼ外生的な変動として利用し、切り替えの前後の請求額、消費量、滞納、分割払いの利用、契約の乗り換えを比べた（抄録）。", "p5": "切り替えで請求額はすぐに20〜56%増え、消費は徐々に調整された（支出弾力性−0.117）（抄録）。滞納・分割払いの利用・乗り換えが増え、固定価格契約の暗黙の補助は絶対額では逆進的だが推定所得に対しては累進的で、効率の損失は所得分布の両端に集中した（抄録）。", "fun": "電気代が固定の契約は、値上がりの嵐から家計を守ってくれる。でも契約が切れて市場の値段に変わった家庭では、請求額がすぐに2割から5割以上も跳ね上がり、払えない家庭も増えた。値段の変化を伝えることと、暮らしを守ることのバランスの難しさが分かる研究だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "規制者の参加でマッチングの安定性を回復", "title": "Stable matching under regulation", "url": "https://arxiv.org/abs/2610.34412", "authors": "Chao Huang", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Huang, C. (2026). Stable matching under regulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34412", "why": "任意の提携が合意できる市場で、規制者がすべての合意に加わると代替性より弱い条件で安定な結果が存在することを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "どの提携でも合意できる市場では、代替的な選好のもとでも安定な結果が存在しないことがあるが、規制者がすべての合意に加われば安定性を回復できることを示した理論論文（抄録）。", "p3": "規制者が各合意に参加する市場をモデル化し、通常の主体の選好が代替性より弱い条件を満たせば、規制者の選好をほとんど制約せずに集合的に安定な結果が存在することを証明した（抄録）。", "p5": "別の存在定理として、通常の主体の選好が任意でも、規制者が各主体の有利な契約の削除を支持するなら安定な結果が存在することを示し、規制を伴う活動のマッチング市場に適用できるとした（抄録）。", "fun": "人と仕事、売り手と買い手の組み合わせを決める市場では、誰もが納得して誰も抜け駆けしない組み合わせ（安定な組み合わせ）が見つからないことがある。この論文は、規制者がすべての契約に立ち会う仕組みを入れると、そうした組み合わせが存在するようになることを示した。ルール作りの力を数学で示した点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "連続時間の動学ゲームの均衡の一意性条件", "title": "Multiplicity and Uniqueness of Equilibria in Continuous-Time Dynamic Discrete Games", "url": "https://arxiv.org/abs/2610.33660", "authors": "Jason R. Blevins ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Blevins, J. R., & Jeong, Y. (2026). Multiplicity and Uniqueness of Equilibria in Continuous-Time Dynamic Discrete Games (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33660", "why": "ポアソン過程で順に動く連続時間の動学離散ゲームで、マルコフ完全均衡が一意になる閉形式の十分条件を示し、参入退出モデルで複数均衡が生じる領域を特定した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ポアソン過程で順に動く連続時間の動学離散ゲームで、マルコフ完全均衡が一意になる閉形式の十分条件を示し、複数均衡が実証研究に与える影響を明らかにした（抄録）。", "p3": "モデルの基本要素から確かめられるセミパラメトリックな一意性の条件を導き、参入退出の動学的な複占モデルで均衡を大規模に数値探索して、条件の網羅範囲と複数均衡の様子を調べた（抄録）。", "p5": "一意性が普通だが、複数均衡は市場が2社を支えられない領域、企業が非常に辛抱強い領域、中間の意思決定頻度に集中し、典型的には安定な非対称均衡2つと不安定な対称均衡1つが現れた（抄録）。一意性を仮定する完全解の推定量は不安定な均衡に収束しうるが、2段階推定量は正しい均衡を回復した（抄録）。", "fun": "2つの会社が市場に入るか出るかを読み合うゲームでは、答え（均衡）が1つに決まらないことがある。この研究は、答えが1つになる条件を示し、答えが複数ある場合は計算方法によって間違った答えに引き寄せられる危険があることを示した。経済の分析に潜む数学の落とし穴を教えてくれる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "金融LLMベンチマークの点数は抽出規則で決まる", "title": "What FLARE's Published Numbers Actually Measure", "url": "https://arxiv.org/abs/2610.33604", "authors": "Dung Cao ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Cao, D., Gang, P., & Veluri, A. (2026). What FLARE's Published Numbers Actually Measure (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33604", "why": "金融タスク集FLAREの採点を監査し、多くの値がモデルではなく回答抽出の規則で決まっていることと、規則の違いで正解率が大きく変わることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "金融タスク集FLARE（PIXIUとFinBenの基盤）の採点を監査し、多くのセルで得点がモデルではなく回答抽出の規則で決まっていることを示した（抄録）。", "p3": "公開済みの得点を、ベンチマーク自身のコードとlm-evaluation-harnessの抽出規則と照合し、規則が明示されないため得点が部分識別になる状況を、204セルの要因計画と46セルの診断で評価した（抄録）。", "p5": "公開された34のHeadlinesの得点のうち9つは、出力がYesと完全一致しないときにコードが返す値と一致した（抄録）。同じ生成でも規則の違いで正解率が最大0.4216異なり、Financial PhraseBankでは7モデル中4つが規則によって多数派の下限0.5948を上回ったり下回ったりした（抄録）。", "fun": "テストの点数は、答案の採点ルールしだいで変わることがある。金融のAIの成績表を調べると、多くの点数がAIの実力ではなく「答えのどの部分を読み取るか」という採点の決まりで決まっていた。ランキングを見る前に、物差しの作り方を確かめる大切さが分かる研究だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "データ仲介業者の丸めがアナリスト予想を歪める", "title": "Does analyst forecast bias originate upstream in the information supply chain? *", "url": "https://doi.org/10.2139/ssrn.7672523", "authors": "Albert Mensah ほか", "venue": "SSRN", "date": "2026-10-26", "apa": "Mensah, A., Tang, V. W., & Asamoah, P. E. (2026). Does analyst forecast bias originate upstream in the information supply chain? *. https://doi.org/10.2139/ssrn.7672523", "why": "データ提供会社の丸め規則による外生的なノイズを回帰不連続デザインで使い、アナリストがそのノイズを補正しきれず予想の偏りが大きくなることを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "データ提供会社の丸め規則が配信する指標に外生的なノイズを加えることを回帰不連続デザインで利用し、アナリストがそのノイズを補正しきれず、利益予想の偏りが大きくなることを示した（抄録）。", "p3": "代替データの提供会社（LikeFolio）の顧客満足度スコアの丸めによる不連続を使い、配信される情報の形式がアナリストのEPS予想の偏りと短期の株価に与える影響を推定した（抄録）。", "p5": "丸めによる顧客満足度の1ポイントの上昇は、EPS予想の偏りを株価の0.1〜0.2%（偏りの標準偏差の7〜14%）大きくした（抄録）。効果は不透明で不確実性の高い企業と、経験の浅いアナリストや専門外のアナリストで大きく、短期の価格効果も生じた（抄録）。", "fun": "データ会社が数字をきりのいい値に丸めるだけで、プロのアナリストの予想が狂うことがある。この研究は、丸めで顧客満足度が少し高く見えると、アナリストが会社の利益を楽観的に予想してしまうことを示した。小さな数字の扱いが市場をゆがめるという話が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "欧州電力市場の最適な入札区域を探す", "title": "Drawing the Right Lines: Identifying Optimal Bidding Zones for the European Electricity Market *", "url": "https://doi.org/10.2139/ssrn.7673118", "authors": "Jonas Boeschemeier ほか", "venue": "SSRN", "date": "2026-10-27", "apa": "Boeschemeier, J., & Neuville, P. (2026). Drawing the Right Lines: Identifying Optimal Bidding Zones for the European Electricity Market *. https://doi.org/10.2139/ssrn.7673118", "why": "2万以上のノードの模擬価格で入札区域の構成を評価する指標を作り、ドイツを2区域に分けるだけで欧州全体の効率差の46.3%が解消されると示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "欧州の電力市場の入札区域が送電の混雑を反映しているかを、区域の構成が送電網の状態をどれだけ捉えるかを測る空間的R²で評価し、より効率的な区域の引き方を示した（抄録）。", "p3": "欧州29か国の20,000以上のノードの模擬的なノード価格に枠組みを適用し、現行の区域と、国境にとらわれない最適な区域の配置を比べた（抄録）。", "p5": "ドイツを2区域に分けると欧州全体の効率差の46.3%、フランスでは8.9%が解消し、他の分割は2%程度以下だった（抄録）。最適に置いた7区域で現行の38区域と同等の効率になり、要点は区域の数ではなく線の引き方だとした（抄録）。", "fun": "欧州の電気は、区域ごとに同じ値段で売り買いされる。しかし電線の混み具合は国境と一致しない。この研究は区域の線を引き直すと効率がどう変わるかを計算し、ドイツを2つに分けるだけで欧州全体の無駄の半分近くが消えることを示した。数より線の引き方が大事という結論が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "繰り返しゲームでのレベルk推論を識別する", "title": "Identifying level-$k$ reasoning in repeated games: Strategies, beliefs, and cognitive ability", "url": "https://arxiv.org/abs/2610.33098", "authors": "David Gill ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Gill, D., & Rosokha, Y. (2026). Identifying level-$k$ reasoning in repeated games: Strategies, beliefs, and cognitive ability (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33098", "why": "繰り返し囚人のジレンマで戦略と他者の戦略への信念を同時に測り、相当数の被験者をレベル1か2に分類し、認知能力と経験が高い推論水準を予測することを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "繰り返しゲームで、個々の行動ではなく戦略全体の水準で働くレベルk推論を識別し、認知能力と経験が高い推論水準を予測することを示した（抄録）。", "p3": "戦略の選択と他者の戦略への信念の両方を組み込んだレベルk推論のモデルを作り、無期限に繰り返す囚人のジレンマで引き出した戦略と信念を、新しい誤差許容の概念で分類した（抄録）。", "p5": "相当な割合の被験者をレベル1またはレベル2に分類でき、戦略の水準でレベルk推論が働くとき、認知能力と経験が高い推論水準を予測した（抄録）。具体的な割合は抄録にない（未確認）。", "fun": "「相手は私がこう考えると考えている」と何段階先まで読むかを、レベルk推論という。この研究は、協力するか裏切るかを何度も繰り返すゲームで、人がどこまで先を読んで作戦を立てるかを調べた。頭の回転が速く経験のある人ほど、深く読んでいた。じゃんけんの読み合いにも通じる話だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn24", "rank": 24, "field": "経営学", "headline": "環境目標の宣言より実践が管理職の主体性を高める", "title": "Declare Green, Do Green? The Interplay of Corporate Environmental Sustainability Objectives and Practices in Shaping Managerial Proactive Behavior", "url": "https://doi.org/10.2139/ssrn.7675282", "authors": "Jisun Kim ほか", "venue": "SSRN", "date": "2026-10-27", "apa": "Kim, J., Gao, H., Mesquita, L. F., Lee, H. W., & Hoetker, G. (2026). Declare Green, Do Green? The Interplay of Corporate Environmental Sustainability Objectives and Practices in Shaping Managerial Proactive Behavior. https://doi.org/10.2139/ssrn.7675282", "why": "ブラジル302社の管理職24,915人の調査と米国のオンライン実験で、環境の実践は目標の明確さと誇りを通じて主体的行動を高めるが、宣言された目標だけでは高めないことを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "ブラジル302社の管理職24,915人の調査と米国の管理職へのオンライン実験で、企業の環境への取り組みは、宣言された目標より実際の実践が、目標の明確さと誇りを通じて管理職の主体的行動を高めることを示した（抄録）。", "p3": "戦略過程の研究、意味づけと社会的アイデンティティの理論に基づき、使命やビジョンでの環境目標（宣言されたシグナル）と、日常業務や資源配分での実践（行動で示すシグナル）の効果を比べた（抄録）。", "p5": "環境の実践は目標の明確さと誇りを通じて主体的行動を高めたが、目標の宣言だけでは高めなかった（抄録）。ただし目標は、実践と目標の明確さの関係を強めて主体的行動を促した（抄録）。", "fun": "「環境にやさしい会社です」と掲げるだけで、社員はやる気になるだろうか。24,915人の管理職を調べると、やる気を高めたのは掲げた目標ではなく、実際の取り組みだった。ただ、目標は取り組みの意味を分かりやすくする手助けにはなっていた。言葉と行動の役割分担が見える研究だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn25", "rank": 25, "field": "経営学", "headline": "海外起業家は初回の成功で基盤に縛られる", "title": "Bound by success? Foreign entrepreneurs, first-campaign outcomes and asymmetric retention on a global crowdfunding platform", "url": "https://doi.org/10.2139/ssrn.7675027", "authors": "Eliran Solodoha", "venue": "SSRN", "date": "2026-10-27", "apa": "Solodoha, E. (2026). Bound by success? Foreign entrepreneurs, first-campaign outcomes and asymmetric retention on a global crowdfunding platform. https://doi.org/10.2139/ssrn.7675027", "why": "Kickstarterの初回キャンペーン389,314件で、成功後の再挑戦の上乗せが海外の起業家で米国より3.5ポイント大きいことを示し、基盤への非対称な依存を論じた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "Kickstarterで17か国の作り手が始めた初回キャンペーン389,314件を分析し、初回の成功後に再挑戦する傾向が米国外の作り手で米国の作り手より3.5ポイント強いことを示し、基盤への非対称な依存を論じた（抄録）。", "p3": "初回の成否と24か月以内の2回目の開始の関係を米国の作り手と海外の作り手で比べ、学習・満足・質の選別・累積的有利といった別の説明も検証した（抄録）。", "p5": "成功後の再挑戦の上乗せは海外の作り手で3.5ポイント大きく、失敗後は両者の戻る割合は同程度だった（抄録）。上乗せは英語でキャンペーンを示す海外の作り手に集中し、別の説明は検証で狭めたが排除はできなかった（抄録）。", "fun": "世界中から誰でも資金を募れるクラウドファンディングは、国の壁をなくす道具だと思われがちだ。ところが海外の作り手は、一度成功すると同じ場所に戻ってくる傾向が米国の作り手より強かった。ほかに頼れる場がないため、成功がかえって依存を生むという見方が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn26", "rank": 26, "field": "経営学", "headline": "大統領は分断的な課題を公の場で語らない", "title": "Behind Closed Doors: Presidential Meetings and Strategic Public Disclosure", "url": "https://doi.org/10.2139/ssrn.7664618", "authors": "Scott Jinzhiyang Wang", "venue": "SSRN", "date": "2026-10-26", "apa": "Wang, S. J. (2026). Behind Closed Doors: Presidential Meetings and Strategic Public Disclosure. https://doi.org/10.2139/ssrn.7664618", "why": "1935〜2009年の大統領日誌から会議の議題をLLMで推定し、公の発信との一致度が有権者に重要な課題で高く、党派的に分断的な課題で低いことを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "米国大統領が非公開の会議で扱う政策課題と公の発信がどれだけ一致するかを、1935〜2009年の大統領日誌から測り、発信の選び方と資本市場への影響を調べた（抄録）。", "p3": "大統領日誌から分単位の日程を復元し、LLMを補助に使って各会議で扱われた可能性のある政策課題と公の発信の話題を特定し、両者の類似度を測った（抄録）。", "p5": "有権者が重視する課題ほど発信は会議の内容に近く、自党内で割れる課題は発信が少なく、二大政党間で割れる課題は多かった（抄録）。類似度が高いほどその後の市場全体と個別企業の不確実性が低く、この関係は政府需要への依存が大きい企業で強かった（抄録）。", "fun": "大統領が毎日だれと会ったかは、分刻みの日誌に残っている。この研究は1935年から2009年までの日誌をAIの助けを借りて読み解き、大統領が実際に取り組む課題のうち何を国民に語るかを調べた。自分の党が割れる話題は語りたがらないという、人間らしい傾向が見えたのが面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "e閉包で危険予算の余りを使い決定を再認証", "title": "Recertifying decisions via e-closure: uniform improvements of conformal risk control and randomized e-BH", "url": "https://arxiv.org/abs/2610.35821", "authors": "Tian Bai ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Bai, T., & Ramdas, A. (2026). Recertifying decisions via e-closure: uniform improvements of conformal risk control and randomized e-BH (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35821", "why": "危険を制御する手続きが使い残した予算をe値の表現で定量化し、妥当性を保ったまま保守性を減らす再認証の枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "統計的な手続きがリスクの予算を使い残すことに着目し、e値による表現とe閉包の原理を使って、妥当性を保ったまま手続きを改良する「再認証」という一般的な枠組みを提案した（抄録）。", "p3": "予算で割った損失をe値の集まりとみなし、分布の構造から余りを数えてe値を大きくし、より保守的でない決定を作る方法を、コンフォーマルなリスク制御（CRC）と乱択e-BHに適用した（抄録）。", "p5": "CRCではどの較正標本でもCRCより保守的にならず、凸な損失では再認証の反復が許容的な制御器へ幾何級数的に収束した（抄録）。依存のあるe値の偽発見率の制御では乱択e-BHの棄却集合を常に含む閉形式の手続きを導き、CIFAR-100の階層分類とシミュレーションで予算の利用と検出力の改善を示した（抄録）。", "fun": "「間違いの割合をこの値以下に抑える」という統計の保証は、安全のために余裕を残しすぎることがある。この研究は、使い残した余裕を数えて分け直せば、保証を壊さずにもっと思い切った判断ができることを示した。余ったお小遣いを上手に回すような発想だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "重要なラベルから順に誤りを監査する", "title": "Not All Mislabels Are Equal: Efficient Task-Aware Auditing with Confidence Sequences", "url": "https://arxiv.org/abs/2610.33262", "authors": "Fangyuan Lin ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Lin, F., Krever, N., Černý, J., & Xu, L. (2026). Not All Mislabels Are Equal: Efficient Task-Aware Auditing with Confidence Sequences (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33262", "why": "下流の得点への影響と不確かさで点検の優先順位を決め、常時有効な推測で誤ラベル率を保証する監査法で、無作為抽出より少ない点検数を実現した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "専門家の確認が高価なデータのラベル監査で、下流の得点に効くラベルから優先的に調べ、いつ止めても妥当な信頼系列で誤りの割合を保証する枠組みATLASを提案した（抄録）。", "p3": "生物多様性クレジットでの種の記録の確認を動機に、ラベルの訂正を混同行列で表し、ラベルの不確かさと訂正が得点に与える影響の両方から次に調べるデータを選んだ（抄録）。", "p5": "誤ラベル率を±2ポイントで保証するのに必要な監査は、無作為抽出よりケニアの生物多様性データで24%、CIFAR-10Nで11%少なく、非線形のHill-Shannon多様度では36%少なかった（抄録）。汎用の厳密な手法は専門家の確認が現実的でないほど多く必要になることも示した（抄録）。", "fun": "生き物の記録に付いた種の名前が正しいかを、専門家が一つずつ確かめるのは大変だ。この研究は、間違っていると結果に大きく響くデータから先に確かめることで、確認の回数を減らした。多様さの指標では36%も減った。限られた時間で何から調べるかという、テスト勉強にも通じる工夫だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "高次元の分散成分行列のノンパラメトリック縮小推定", "title": "Nonparametric shrinkage estimation of high-dimensional variance component matrices", "url": "https://arxiv.org/abs/2610.33431", "authors": "Ran Xie ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Xie, R., & Johnstone, I. M. (2026). Nonparametric shrinkage estimation of high-dimensional variance component matrices (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33431", "why": "形質数が多いときに散らばる固有値を補正する核変換で、回転不変な最適推定量を狙う分散成分行列の推定法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "多変量の混合効果モデルで、形質の数が多いときの分散成分の共分散行列を、スペクトルの形を仮定せずに固有値を縮小して推定する方法を提案した（抄録）。", "p3": "MANOVA推定量の極限スペクトル分布を表す自己無撞着方程式に基づき、標本固有値をカーネルで非線形に変換して、フロベニウス損失で最適な回転不変推定量を目指した（抄録）。", "p5": "従来のMANOVA推定量は成分ごとには不偏だが、形質の数が変量効果の実現数に近いと固有値が大きく散らばって偏る。提案法はこれを補正し、Pythonパッケージmlmm-shrinkageとして実装して、シミュレーションと実データで従来法と比べた（抄録）。", "fun": "多くの性質（形質）が遺伝でどうつながっているかを調べると、データの数に比べて性質の数が多いとき、計算結果のばらつきが実際より大きく見えてしまう。この研究は、そのゆがみを行列の数学の性質を使って補正する方法を作り、誰でも使える道具として公開した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "操作変数を使う分布に依存しない予測推論", "title": "Distribution-free predictive inference with instrumental variables", "url": "https://arxiv.org/abs/2610.35605", "authors": "Yonghoon Lee ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Lee, Y., Dobriban, E., & Tchetgen, E. T. (2026). Distribution-free predictive inference with instrumental variables (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35605", "why": "欠測がランダムでない結果について、操作変数があるときの分布に依存しない予測推論の可能性を識別指標で特徴づけ、不可能性の結果も示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "結果が無作為でない形で欠測するときに、操作変数を使って分布を仮定せずに予測区間を作れるかを理論的に調べ、可能な場合の実用的な方法を提案した（抄録）。", "p3": "推論の可能性を決める「識別指標」を定義し、それが小さいとどの分布に依存しない方法も情報のある推論ができないことを示した。十分に大きい場合は、欠測した結果の分位点の鋭いIV境界の効率的影響関数を導いて方法を作った（抄録）。", "p5": "提案法の被覆の保証は二重頑健性を持ち、シミュレーションと2つの実データ（FESの賃金とNHANES IIIの自己申告の身長）で性能を示した（抄録）。", "fun": "アンケートで答えない人がいると、答えた人だけで平均を出すと結果がゆがむ。答えない理由が答えそのものに関係するときは特に厄介だ。この研究は、答えるかどうかだけに影響する手がかり（操作変数）があれば、どこまで信頼できる予測の幅を示せるかを数学で明らかにした。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn31", "rank": 31, "field": "統計学", "headline": "品切れによる代替を考えた需要推定の厳密な尤度", "title": "Demand Estimation with Unobserved Stockout Substitution: Exact Likelihood Maximization", "url": "https://arxiv.org/abs/2610.34547", "authors": "Chenhao Wang ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "why": "品切れ時刻が観測されない状況で、多項ロジットの厳密な尤度とその勾配が1次元の積分で書けることを示し、効率的な推定を可能にした。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "品切れで客が別の商品を買ったり買わずに去ったりする状況で、在庫が補充時にしか観測されなくても、多項ロジットの需要を厳密な尤度最大化で推定する方法を示した（抄録）。", "p3": "購買過程の連続時間表現を使い、商品・客・品切れの数によらず、厳密な尤度とその勾配が1次元の積分になることを示し、商品数と期間数に線形な計算量で評価した（抄録）。", "p5": "Anupindiら（1998）以来の難題に、多項ロジットモデルで完全な解を与えたとし、2,000商品・2,000販売期間の需要を10分未満で推定した（抄録）。", "fun": "売り切れの棚の前で、客は別の商品を買うか、何も買わずに帰る。でも店には売り切れた時刻の記録がないことも多い。この研究は、そんなデータからでも本当の人気を正確に計算する方法を見つけ、2,000種類の商品の需要を10分もかからずに推定した。無人店舗の時代に役立つ工夫だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn32", "rank": 32, "field": "統計学", "headline": "シミュレーションベース推論の要約統計量の情報量", "title": "Intrinsic Information Rates of Summaries in Simulation-Based Inference", "url": "https://arxiv.org/abs/2610.34703", "authors": "Vansh Bansal ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "why": "要約統計量を情報損失のある通信路とみなし、事後分布の集中に伴って必要な相互情報量が際限なく増えることを示し、情報の使い方を論じた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "シミュレーションに基づく推論で観測を固定次元の要約に圧縮するとき、要約が持つ情報量（予算）を明示し、どれだけ必要で、どう使うのが最善かを情報理論で調べた（抄録）。", "p3": "要約を観測から要約への損失のある通信路とみなして相互情報量で予算を測り、必要な予算を事後分布の量子化で上から、各事後状態を確率で重み付けた逆定理で下から評価した（抄録）。", "p5": "事後分布が集中するにつれ必要な予算は際限なく増え、予算が有限なら確率的な要約がどの決定的な要約よりも厳密に小さい歪みを達成した（抄録）。4つのベンチマークで確率的なボトルネックが良い率と損失の関係を示し、予算によって構造の順位が入れ替わった（抄録）。", "fun": "たくさんのデータを短いメモにまとめるとき、メモに書ける量には限りがある。この研究は、その限られた量をどう使うのが最もよいかを情報理論で調べ、毎回同じ書き方をするより、少しランダムさを混ぜた書き方の方が得になることを示した。直感に反する結論が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn33", "rank": 33, "field": "統計学", "headline": "局所化した共形p値で条件付きの新規性を検出", "title": "Conformal Novelty Detection via Data-enhanced Localization", "url": "https://arxiv.org/abs/2610.34999", "authors": "Xiaoyang Wu ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "why": "較正データと検証データを核推定に取り込む局所的な共形p値で、有限標本の妥当性と偽発見率の制御を保ったまま検出力を高めた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "変数間の関係から生じる新奇性（条件付きの新奇性）を検出するため、較正データと検査データの両方を使って局所化したコンフォーマルp値を作り、検出の効率を上げた（抄録）。", "p3": "両方のデータをカーネル推定に取り込んだ条件付き分布の推定量を再較正してp値を作り、それを使う検出アルゴリズムと、データに基づく帯域幅の選び方を提案した（抄録）。", "p5": "p値は有限標本で妥当で、検出アルゴリズムは有限標本で偽発見率を制御しつつ検出力を高め、シミュレーションと実データで利点を示した（抄録）。具体的な数値は抄録にない（未確認）。", "fun": "「いつもと違う」データを見つけるのは、不正や故障の発見に欠かせない。たとえば背が高いこと自体は普通でも、年齢の割に高いのは珍しい、というように、変数どうしの関係でしか分からない珍しさもある。この研究は、そうした珍しさを見逃さず、誤検出の割合も抑える方法を作った。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "アラインメントを汎化の問題として捉え直す", "title": "Alignment via Generalization", "url": "https://arxiv.org/abs/2610.34242", "authors": "Shai Shalev-Shwartz ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "why": "意図を複数の要件の集まりとして表し、学習に使った要件での成功が未知の要件に及ぶかという汎化の問題に帰着させる理論枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "AIが与えた目標の達成は上手になっても本当に望むことをするようにはならない整合（アラインメント）の問題を、学習理論の汎化の問題に置き換える枠組みAligned-PAC学習を提案した（抄録）。", "p3": "意図を一つの学習目標で表すのでなく具体的な要件の集まりで表し、学習に使った要件での成功が未知の要件にも及ぶかを問う形に定式化した（抄録）。", "p5": "独立した評価で表現された要件全体の整合の厳密な証拠が得られることと必要な評価の量を示し、明示した仮定のもとで学習済みモデルを組み合わせて要件を満たす最適化法を作った（抄録）。要件の選び方と未知の要件への汎化の条件は未解決とした（抄録）。", "fun": "「テストで満点を取れ」と教えたAIが、勉強せずに答えを丸暗記するようになったら困る。この研究は、そうした「目標は達成したが望みとずれた」状態を、練習問題で身につけたことが初めての問題でも通じるかという問題に置き換え、数学で扱えるようにした。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "利用者が指定する信頼度に合わせて回答を控える", "title": "Reinforcement Learning Done Right for Explicit Confidence Targets", "url": "https://arxiv.org/abs/2610.35059", "authors": "Zefeng He ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "why": "プロンプトで指定した正答率の目標に応じて回答か棄権かを選ぶ強化学習が失敗する原因を特定し、目標ごとに振る舞いを変えられる学習法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "利用者がプロンプトで正解率の目標pを指定し、LLMが答えるか控えるかを自分で選んで、答えた問題での正解率をp以上に保つよう、強化学習で1つのモデルを訓練する方法RLECを提案した（抄録）。", "p3": "従来の試みが目標を区別できなかった原因を、pを区別する報酬の信号が最適化中に失われることと、pが1に近づくと誤りの罰が際限なく大きくなることと特定し、安定な報酬の族と報酬の段階的な調整で対処した（抄録）。", "p5": "1つのLLMで明示的な確信度の目標を制御する訓練に初めて成功したとし、一般的な能力をおおむね保ちながら、外部の判定や訓練後の閾値調整なしで細かな目標の制御ができた（抄録）。数値は抄
