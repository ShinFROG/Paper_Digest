抄録）。", "p6": "AI導入の指標はLLMによる測定であり、その妥当性の確認方法は抄録からは分からない。AIを導入する企業の選ばれ方（逆の因果）の扱いも未確認。本文を読めていない。", "fun": "AIの話題はテクノロジー企業に集まりがちだ。この研究は、そうでない会社がどれだけAIを取り入れているかを測ろうとした。面白いのは測り方で、大規模言語モデルという別のAIを使って会社ごとの指標を作った。AIの広がりをAIで測るわけである。その結果、テクノロジー企業でなくても、AIを取り入れた会社は価値が高まっていた。", "unverified": "掲載誌の本文を取得できず、指標の作成に使った資料、標本、推定方法、効果の大きさは未確認。"}}, {"id": "jr14", "rank": 14, "headline": "流路と道路の地形を直すと土石流の再現が改善", "title": "Evaluating DEM Refinement Strategies and Flow-Depth Threshold Criteria for Debris Flow Simulation in a Data-Limited Catchment", "url": "https://doi.org/10.3390/w18222825", "authors": "Sujin Jang ほか", "venue": "Water", "date": "2026-11-12", "citescore": 6.7, "citescore_year": "2025", "apa": "Jang, S., Chun, K.-W., & Kim, S. (2026). Evaluating DEM Refinement Strategies and Flow-Depth Threshold Criteria for Debris Flow Simulation in a Data-Limited Catchment. Water, 18(22), 2825. https://doi.org/10.3390/w18222825", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は未取得", "preprint": false, "p1": "粗い地形データしかない流域で、数値標高モデルを手直しすることで土石流の氾濫範囲の再現が改善するか、そして流動深の閾値で結果の読み方を標準化できるかを、実際の災害事例で確かめた（抄録）。", "p2": "土石流は下流に大きな被害を与えるが、その影響の予測は粗い地形データに妨げられることが多い。データの限られた流域で、どの手直しが効くのか、シミュレーション結果をどう読むかの基準が必要だった（抄録）。", "p3": "土石流のシミュレーションシステムHyper KANAKOを使う。数値標高モデルを、建物の標高の組み込み、流路と道路の地形の修正、その両方、の3通りに手直しする。流動深の閾値を使って堆積範囲の境界を定め、観測された被災範囲と比べる（抄録）。", "p4": "韓国で記録された土石流の事例を対象に、シミュレーションの範囲と観測された被災範囲を、ROCにもとづく性能指標と混同行列の指標で比べた。過大予測と過小予測の両方を考える指標も使った（抄録）。", "p5": "流路と道路の地形の修正が最も一貫した改善を示し、精度0.961、F1は82.6%で最も高かった。流動深の閾値の分析から、堆積範囲の境界を定める実用的な閾値は0.3 mと分かった。過大・過小の両方を考慮すると、ROCから導いた用途別の閾値を使ったケースが最も高い総合指標を示した（抄録）。", "p6": "1つの流域・1つの災害事例での結果である。著者も、高解像度の地形データがない地域へ「移転できる可能性がある」と控えめに述べる。流量や土砂量の設定の影響は本文を読めておらず未確認。", "fun": "土石流がどこまで広がるかを計算するには、地面の高さのデータが要る。データが粗いと、予測は難しくなる。この研究は、流れ道と道路の地形を手直しするだけで、計算の結果が実際の被害範囲とよく合うようになることを示した。建物の高さを入れるより、流れ道と道路を直すほうが安定して効いた。流れを左右する場所を直すことが大事だという結果である。", "unverified": "本文を取得しておらず、地形データの解像度、災害事例の詳細、他の指標の値は未確認。"}}, {"id": "jr15", "rank": 15, "headline": "中南米のTODは地価上昇の一部しか回収できない", "title": "A framework for transit-oriented development outcomes in Latin American cities: accessibility, land value capture and displacement", "url": "https://doi.org/10.62486/tms2025150", "authors": "Dennyse María Patricia Hermosa Guzmán ほか", "venue": "SAP Transport, Mobility & Society", "date": "2026-11-12", "apa": "Hermosa Guzmán, D. M. P., Figueroa Suarez, A. D., & Carmen López, L. d. (2025). A framework for transit-oriented development outcomes in Latin American cities: accessibility, land value capture and displacement. SAP Transport, Mobility & Society, 4, 150. https://doi.org/10.62486/tms2025150", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "本文", "basis_note": "掲載誌サイトのHTML本文のうち、要旨、序論の末尾、要素3（地価上昇の還元）、統合枠組み、考察の限界の記述、結論を読んだ。他の要素の節と表は未読", "preprint": false, "p1": "中南米の都市の公共交通指向型開発（TOD）について、別々に蓄積されてきたアクセシビリティ、地価上昇の還元（land value capture）、立ち退きの研究を、一つの因果の連なりとして整理する5要素の枠組みと、検証できる3つの命題を示した文献レビュー（要旨、統合枠組みの節）。", "p2": "TODは中南米で公共交通と土地利用を結びつける中心的な戦略になったが、成果についての証拠は3つの文献群に分かれていた。アクセシビリティで止まる研究は公平性の改善を、価格と立ち退きまで見る研究は排除を報告し、評価が食い違っていた（要旨、統合枠組みの節）。", "p3": "2013〜2025年に公表された文献を対象に、交通投資、アクセシビリティ、地価上昇の還元、立ち退きとジェントリフィケーション、ガバナンスの5要素にまとめる。交通投資がアクセシビリティの期待を生み、それが立地のよい土地の価値を上げ、その上昇が還元を招き、還元と保護がなければ同じ上昇が立ち退きを生む、という順序で読む。ガバナンスが各段階を条件づける（序論、統合枠組みの節）。", "p4": "新しいデータによる検証ではなく、既存の準実験やヘドニック分析などの結果を総合する研究である。選定は記録されているが網羅的ではない（考察の節）。", "p5": "沿線の地価の上昇は開業前から先取りされ、駅の近くに集中するため、価格が上がった後に制度化された還元の手法は上昇分の大半を私的な所有者に残す。コロンビアでは地価増分への参加が理論上得られる上昇分の一部しか回収しておらず、メキシコシティでは地籍情報の弱さや非公式性などが妨げになっている（要素3の節）。命題の一つは、早く・駅の近くで働く手法ほど回収が大きい、である（統合枠組みの節）。", "p6": "著者は、選定が網羅的でなくスペイン語の地域誌を取りこぼしている可能性、有意な地価上昇の結果に偏る出版バイアス、そして立ち退きが価格や認識から推測されているだけで直接測られていないことを限界に挙げる（考察の節）。掲載誌の査読の水準は確認できていない。", "fun": "新しい鉄道ができると、駅の近くの土地の値段が上がる。その値上がり分を集めて公共の財源に回せれば理想的だ。ところが土地の値段は、開業の前からもう上がり始める。制度を作るのが遅れると、値上がり分の大半は土地の持ち主に残る。しかも同じ値上がりが、そこに住んでいた人を追い出す原因にもなる。便利になることと追い出されることが、同じ仕組みの続きだという整理が面白い。", "unverified": "要素1・2・4・5の節の詳細と、各手法をまとめた表は読んでおらず未確認。掲載誌の位置づけも未確認。"}}, {"id": "jr16", "rank": 16, "headline": "繰り返し移動する調和荷重で斜張アーチが内部共振", "title": "Nonlinear vibration of the cable-stayed shallow arch subjected to a repeatedly moving harmonic load: dynamic modeling and one-to-one internal resonance", "url": "https://doi.org/10.1142/s0219455428500800", "authors": "Lei Yu ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-12", "citescore": 6.5, "citescore_year": "2025", "apa": "Yu, L., Su, X., Kang, H., Hu, T., & Cong, Y. (2026). Nonlinear vibration of the cable-stayed shallow arch subjected to a repeatedly moving harmonic load: dynamic modeling and one-to-one internal resonance. International Journal of Structural Stability and Dynamics. https://doi.org/10.1142/s0219455428500800", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "走行車両が長大な斜張橋の動的挙動に与える影響を調べるため、ケーブルの振動と桁の初期形状を考慮した「斜張浅アーチ」のモデルを作り、全体モードと局所モードが1対1の内部共振の関係にあるときの非線形応答を解析した（抄録）。", "p3": "走行車両を、一定の速さで繰り返し通過する調和力として表す。ハミルトンの原理から支配方程式を導き、ガラーキン法で常微分方程式に離散化して、多重時間尺度法で解いた。主共振と分数調波共振が同時に起きる場合を調べた（抄録）。", "p5": "周波数応答曲線、力応答曲線、2パラメータの分岐図、時刻歴、位相図、パワースペクトルを示した。サドル・ノード分岐ごとに必要な加振の振幅が異なり、分数調波共振は加振の振幅が比較的大きくないと支配的にならない（抄録）。", "fun": "橋を車が次々に渡ると、橋は一定のリズムで押され続ける。ブランコをタイミングよく押すと大きく揺れるのと同じで、そのリズムが橋の揺れやすい周期と合うと揺れが育つ。斜張橋では、桁全体の揺れとケーブルの揺れが同じ周期を持つことがあり、片方の揺れがもう片方に乗り移る。この研究は、その乗り移りがどんな条件で起きるかを数式で調べた。", "unverified": "本文を読めていないため、モデルの諸元、分岐が起きる振幅の数値、実橋との対応は未確認。数値の結果は抄録に記載がない。"}}, {"id": "jr17", "rank": 17, "headline": "構造動力学のPINNは検証の証拠が偏っている", "title": "Beyond governing-equation residuals: verification and validation of physics-informed neural networks for forward structural-dynamic response prediction", "url": "https://doi.org/10.3389/fmech.2026.1979675", "authors": "Borun Das ほか", "venue": "Frontiers in Mechanical Engineering", "date": "2026-11-12", "citescore": 5.2, "citescore_year": "2025", "apa": "Das, B., & Bulbul, A. N. (2026). Beyond governing-equation residuals: verification and validation of physics-informed neural networks for forward structural-dynamic response prediction. Frontiers in Mechanical Engineering, 12. https://doi.org/10.3389/fmech.2026.1979675", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "構造の動的応答を予測する物理情報ニューラルネット（PINN）の研究で、検証と妥当性確認（V&V）の証拠がどの側面にどれだけあるかを、文献を点検して地図にした小総説（抄録）。", "p3": "計算力学のV&Vの実務にもとづき、方程式と数値の整合、構造応答の検証、動的な忠実度、予測の適用範囲と基準解の出所という4つの証拠次元を定め、明示的な判定規則で区分した。範囲を区切った文献群を全文で点検して適用した（抄録）。", "p5": "妥当性確認の網羅は不均一で、一つの研究の中で複数の次元にわたって証拠が積み上げられることはまれだった。4つの次元は互いに代わりにならず補い合う。支配方程式の残差の最小化だけでは信頼性は確立されないと論じる（抄録）。", "fun": "物理の方程式を「守るように」学習したAIは、物理的に正しい答えを出すと思いがちだ。しかし方程式の誤差が小さくても、長い時間の揺れ、周波数の特徴、微分して得る量まで正しいとは限らない。この総説は、これまでの研究が「何を確かめ、何を確かめていないか」を項目ごとに点検した。合格の印をどこに付けたのかを明らかにする点検表のような研究である。", "unverified": "抄録の末尾が切れており、適用例の内容と結論の後半は未確認。本文を読めていないため、点検した研究の数と各次元の充足の割合は未確認。"}}, {"id": "jr18", "rank": 18, "headline": "不規則な点検間隔のまま橋の健全度を予測", "title": "Bridge-CDE: A Physics-Informed Neural Controlled Differential Equation with Bridge-Specific Covariates for Irregularly Sampled Bridge Condition Index Prediction", "url": "https://doi.org/10.3390/ma19224805", "authors": "Bo Xu ほか", "venue": "Materials", "date": "2026-11-12", "citescore": 7.0, "citescore_year": "2025", "apa": "Xu, B., Li, J., Yang, W., & Chen, Z. (2026). Bridge-CDE: A Physics-Informed Neural Controlled Differential Equation with Bridge-Specific Covariates for Irregularly Sampled Bridge Condition Index Prediction. Materials, 19(22), 4805. https://doi.org/10.3390/ma19224805", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "点検の間隔が不ぞろいな橋梁の健全度指標（BCI）の記録を、等間隔に補間せずにそのまま扱って将来の値を予測するモデルBridge-CDEを提案した（抄録）。", "p3": "建設年、支間、橋長、幅員、標準と実測の振動数、技術状態、荷重等級を共変量に符号化する。有界な指数関数の基準線で連続な経路を作り、制御微分方程式（CDE）を直近の点検から目標の橋齢まで積分する。直近のBCIと線形の劣化傾向に結びつけた残差の読み出しで学習を安定させる（抄録）。", "p5": "中国河南省の735橋・3308件のBCI観測で、MAE 1.066、RMSE 1.643、決定係数0.955、MAPE 1.213%を得た。MAE・RMSE・MAPEは最小だが、決定係数はランダムフォレスト（0.957）がわずかに高い。橋種、床版の状態、実測振動数、建設年の影響が大きかった（抄録）。", "fun": "橋の定期点検は、きっちり同じ間隔では行われない。点検と点検の間は長いことも短いこともある。ふつうの予測手法は等間隔のデータを前提にするので、間を埋める作り物の値を入れることになり、「いつ測ったか」という大事な情報がゆがむ。この研究は、時間が連続に流れるものとして劣化を追う数式を使い、不ぞろいなままの記録から予測した。", "unverified": "本文を読めていないため、予測する年数の幅、比較した手法の一覧、物理的な制約の具体形は未確認。"}}, {"id": "jr19", "rank": 19, "headline": "顧客が感じる革新性は社会的革新が最も効く", "title": "Innovation by different means: exploring perceived firm-innovativeness archetypes", "url": "https://doi.org/10.1108/josm-02-2026-0143", "authors": "Lola C. Duque ほか", "venue": "Journal of Service Management", "date": "2026-11-12", "sjr": 3.759, "citescore": 24.1, "citescore_year": "2025", "apa": "Duque, L. C., & Santamaria, L. (2026). Innovation by different means: exploring perceived firm-innovativeness archetypes. Journal of Service Management, 1–29. https://doi.org/10.1108/josm-02-2026-0143", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "サービス業で、顧客が企業を「革新的だ」と感じる度合いが、提供物の変化・社会的革新・デジタル革新・マーケティングの発信という4つの信号の組み合わせでどう決まるかを調べ、企業を4つの型に分けた（抄録）。", "p3": "2025年のスペイン・イノベーション指数の大規模データ（N = 18,000）を使い、回帰分析で各要因の相対的な重要度を調べ、k平均法のクラスター分析で戦略の型を見いだし、各型の中で成績が最高・最低の「逸脱事例」を解釈的に分析した（抄録）。", "p5": "全体では社会的革新が革新性の知覚に最も効き、デジタル革新、提供物の変化、マーケティングの発信が続いた。デジタル・技術主導、社会的で密接な接点、中核の提供物主導、社会的革新主導の4つの型が見いだされた（抄録）。", "fun": "「革新的な会社」と聞くと、新製品や最新の技術を思い浮かべる。ところがお客が革新的だと感じる一番の決め手は、社会に役立つ取り組みのほうだった。しかも革新的だと思われる会社にはいくつかの型があり、技術で攻める型も、人との近さで攻める型もある。全社を一列に並べて順位を付けるより、似た型どうしで比べるほうが役に立つ、という提案が面白い。", "unverified": "抄録の末尾が切れており、実務への含意の後半は未確認。本文を読めていないため、係数の大きさと各型の企業数は未確認。"}}, {"id": "jr20", "rank": 20, "headline": "否定的な顧客関与は的を絞った回復で好転する", "title": "When negative customer engagement turns positive: A four-stage simulation model of engagement evolution in online brand communities", "url": "https://doi.org/10.1371/journal.pone.0360236", "authors": "Luning Zang ほか", "venue": "PLoS ONE", "date": "2026-11-11", "citescore": 4.8, "citescore_year": "2025", "apa": "Zang, L., Liu, Y., & Wang, L. (2026). When negative customer engagement turns positive: A four-stage simulation model of engagement evolution in online brand communities. PLOS One, 21(11), e0360236. https://doi.org/10.1371/journal.pone.0360236", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "オンラインのブランドコミュニティで、サービス回復が顧客の否定的な関与を肯定的な関与に変えられるか、いつ変えられるかを、4段階のシミュレーションモデルで調べた（抄録）。", "p3": "小米（Xiaomi）のコミュニティを想定し、消費者の効用を関与の前段の評価として扱う閾値型の枠組みを作った。否定と肯定の閾値の間に「関与なし」の区間を置き、価格、製品品質、サービス品質、個人的な必要の充足を要因とした。中核のシナリオを1,000回反復し、頑健性を調べた（抄録）。", "p5": "価格と製品品質は肯定・否定のバランスに強く逆向きに効き、品質が高いと高価格の悪影響が和らいだ。後期のサービス投資が早期より優れるとは言えなかった。否定的な関与の利用者に的を絞った回復が、より強く安定した好転の効果を生んだ（抄録）。", "fun": "ネットのファンの集まりで文句を書いている人は、ずっと敵のままなのだろうか。この研究は、不満を持つ人だけをねらって手当てすると、味方に変わりやすいことを計算上の実験で示した。全員に同じサービスを厚くするより、不満を持つ人に絞るほうが効く。ただし著者は、結果は仮定を置いた筋書きの比較であって、実際の割合の予測ではないと断っている。", "unverified": "抄録の末尾が切れており、限界の記述の後半は未確認。シミュレーションによる検討で、実データでの検証は抄録に記載がない。本文は読めていない。"}}, {"id": "jr21", "rank": 21, "headline": "財務データにLLMの説明文を加え倒産を予測", "title": "A semantic quality generation and class-aware contrastive learning network for corporate credit risk prediction", "url": "https://doi.org/10.1007/s10791-026-10767-w", "authors": "Tingrui Liu", "venue": "Discover Computing", "date": "2026-11-11", "citescore": 2.0, "citescore_year": "2025", "apa": "Liu, T. (2026). A semantic quality generation and class-aware contrastive learning network for corporate credit risk prediction. Discover Computing, 29(1). https://doi.org/10.1007/s10791-026-10767-w", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "企業の財務データに、LLMが生成した説明文を「質を確かめたうえで」組み合わせ、数の少ない倒産企業を見つけやすくする学習の枠組みSMCCL-Netを提案した（抄録）。", "p3": "複数のプロンプトで財務記録の説明文の候補を生成し、意味的な質の評価で採用する候補を選ぶ。選んだ表データと文章の対を共有の潜在空間で最適化し、クラスの頻度、下位クラスの関係、モダリティ間の難しさに応じて学習への寄与を変える（抄録）。", "p5": "公開の倒産予測データ2つで、比較した手法の中でPR-AUCとG-meanが最高で、ROC-AUCは強い表形式の基準手法と同等だった。改善は少数クラスの識別と均衡のとれた分類に集中しており、すべての指標で一様に良くなったわけではない（抄録）。", "fun": "倒産する会社は全体のごく一部なので、「全部安全」と答えるだけで高い正解率が出てしまう。難しいのは、少ない危ない会社を見逃さないことだ。この研究は、数字の表をAIに文章で説明させ、その文章を数字と一緒に学習に使う。ただしAIの文章は当てにならないこともあるので、質の良い説明だけを選ぶ関門を置いた。数字と言葉の両方から会社を見る工夫である。", "unverified": "抄録の末尾が切れており、切除実験と計算費用の記述は未確認。本文を読めていないため、データセットの名称と指標の数値は未確認。"}}, {"id": "jr22", "rank": 22, "headline": "知識変換は倫理的AI風土のもとで成果に結びつく", "title": "When knowledge conversion pays off: knowledge utilization and ethical AI climate for Generation Z employees’ job performance", "url": "https://doi.org/10.1108/jkm-05-2026-0954", "authors": "Md Asadul Islam ほか", "venue": "Journal of Knowledge Management", "date": "2026-11-12", "sjr": 2.382, "citescore": 17.6, "citescore_year": "2025", "apa": "Islam, M. A., Somu, S., & Vrontis, D. (2026). When knowledge conversion pays off: knowledge utilization and ethical AI climate for Generation Z employees’ job performance. Journal of Knowledge Management, 1–21. https://doi.org/10.1108/jkm-05-2026-0954", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "AIを使うホテルの職場で、組織の知識変換が、知識を仕事に合わせて活用することを通じてZ世代従業員の職務成果を高め、その経路が倫理的なAI風土のもとで強まることを示した（抄録）。", "p3": "インドのホテルで働く従業員423人に、時間差をおいた2時点の調査を行った。共分散構造分析で測定モデルを確かめ、階層的回帰とPROCESSマクロで媒介と調整媒介を検定した（抄録）。", "p5": "組織の知識変換は、仕事の効率・有効性・質を有意に高めた。仕事に合わせた知識活用がこの関係を部分的に媒介し、倫理的AI風土は知識活用を介した間接効果を強めた（抄録）。", "fun": "AIのおかげで職場には知識があふれている。それでも成果が上がるとは限らないのは、知識を目の前の仕事に合わせて使いこなす一手間が要るからだ。この調査では、その一手間が成果への橋渡しになっていた。さらに「AIを倫理的に使おう」という職場の雰囲気があると、橋渡しが強くなった。道具そのものより、使い方の文化が効くという結果が面白い。", "unverified": "抄録の末尾が切れており、理論的な貢献の記述は未確認。本文を読めていないため、係数の大きさは未確認。自己報告の調査である。"}}, {"id": "jr23", "rank": 23, "headline": "人間中心の視点でLLM研究を概観", "title": "A Survey on LLMs from a Human-Centric Perspective", "url": "https://doi.org/10.1145/3859364", "authors": "Jing Yi Wang ほか", "venue": "ACM Computing Surveys", "date": "2026-11-12", "sjr": 5.985, "citescore": 65.2, "citescore_year": "2025", "apa": "Wang, J. Y., Sukiennik, N., Li, T., Su, W., Hao, Q., Huang, Z., Xu, J., Xu, F., & Li, Y. (2026). A Survey on LLMs from a Human-Centric Perspective. ACM Computing Surveys. https://doi.org/10.1145/3859364", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "LLMを、人の認知・意思決定・社会的なやり取りを扱う研究と応用の道具として捉え、個人の水準と集合の水準に分けて整理した総説である（抄録）。", "p3": "まず、知覚、分析、統合、実行、社会的なやり取りにわたるLLMの能力と、それが観察された評価の条件を概観する。次に、行動科学、心理学、言語学、政治学、経済学、社会学で、研究の道具、行動の模擬装置、研究対象としてLLMがどう使われているかを整理する（抄録）。", "p5": "今後の課題として、適応性の改善、感情から行動までの評価、文化への感受性、内在する偏りへの対処、人とAIの協働の枠組みの強化を挙げる。定量的な結果は抄録に記載がない（抄録）。", "fun": "LLMは文章を書く道具として知られるが、社会科学では別の使われ方が広がっている。人の代わりに質問に答えさせて行動を模擬したり、LLMそのものを研究の対象にしたりする。この総説は、一人の人間に関わる話と、集団としての社会の過程に関わる話を分けて整理した。能力が示されたとされるとき、それがどんな評価の条件で観察されたのかを併せて見る姿勢が要である。", "unverified": "本文を読めていないため、取り上げた研究の数と、分野ごとの具体的な知見は未確認。"}}, {"id": "jr24", "rank": 24, "headline": "認知症介護者へのSNS支援で孤立者が46%減", "title": "AI-driven assessment of a social media intervention for AD/ADRD caregivers: a stage II-III trial of 966 participants", "url": "https://doi.org/10.1038/s44184-026-00258-7", "authors": "Sunmoo Yoon ほか", "venue": "npj Mental Health Research", "date": "2026-11-12", "sjr": 1.814, "citescore": 7.2, "citescore_year": "2025", "apa": "Yoon, S., Broadwell, P., Davis, N., Sun, F., & Alcantara, C. (2026). AI-driven assessment of a social media intervention for AD/ADRD caregivers: a stage II-III trial of 966 participants. Npj Mental Health Research. https://doi.org/10.1038/s44184-026-00258-7", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "認知症の人を介護する家族に、SNS上で毎日の支援メッセージを届ける介入が、感情の状態を改善し孤立した参加者を減らすことを、966人の試験で示した（抄録）。", "p3": "アフリカ系とヒスパニック系の家族介護者（18歳以上）が、12か月にわたり毎日の社会的支援のメッセージを受け取った。主要な評価項目は、自然言語処理で数値化した感情価の得点と、プラットフォーム上で継続的に捉えた孤立した参加者の割合である（抄録）。", "p5": "参加者の86.7%はデジタルの習熟度が低かったが、82.3%が9か月以上を完了した。両群で感情価の得点が有意に改善し（効果量d = 0.756）、孤立者の数は46.2%減った（効果量h = 1.144）（抄録）。", "fun": "家族の介護は、周りに相談できる人がいないと孤立しやすい。この試験では、ネットに不慣れな人が大半だったのに、8割以上が9か月以上続けられた。面白いのは、気持ちの変化を、自然言語処理という言葉をコンピュータで分析する方法で測った点である。孤立した人が減ったかどうかも、プラットフォーム上の記録から継続的に捉えた。", "unverified": "抄録の末尾が切れており、結論の後半は未確認。本文を読めていないため、群の分け方（対照の有無）と感情価の算出方法は未確認。"}}, {"id": "jr25", "rank": 25, "headline": "都市部では宗教組織が認知機能と正の関連", "title": "Associations Between Neighborhood Service, Religious, and Civic Organizations and Cognitive Decline for Older Mexican Americans Residing in Urban and Rural Areas", "url": "https://doi.org/10.1177/08982643261506030", "authors": "Ji Hyun Lee ほか", "venue": "Journal of Aging and Health", "date": "2026-11-12", "sjr": 1.146, "citescore": 5.4, "citescore_year": "2025", "apa": "Lee, J. H., Rote, S., Mahmoudi, E., Armendariz, M., Antonucci, T., & Manning, M. (2026). Associations Between Neighborhood Service, Religious, and Civic Organizations and Cognitive Decline for Older Mexican Americans Residing in Urban and Rural Areas. Journal of Aging and Health. https://doi.org/10.1177/08982643261506030", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "近隣にある社会サービス・宗教・市民組織の多さが、高齢のメキシコ系米国人の認知機能とその低下にどう関係するかを、都市部と農村部で比べた（抄録）。", "p3": "2004〜2013年の高齢ヒスパニック疫学調査の参加者628人（平均年齢80歳）のデータを、全米近隣データアーカイブと結びつけた。認知機能はミニメンタルステート検査で測った（抄録）。", "p5": "都市部では、宗教組織があることが認知機能の高さと関連した一方、市民組織が多いことは認知機能の低さと、より急な低下に関連した。農村部では近隣の資源と認知機能に関連が見られなかった（抄録）。", "fun": "近所に集まれる場所が多いほど、年をとっても頭がしっかりしていそうに思える。ところがこの研究では、宗教組織は良い方向に関連したのに、市民組織が多い地区ではかえって認知機能が低かった。しかも関連が出たのは都市部だけだった。「地域の資源」とひとくくりにせず、種類と場所で分けて見ないと結果を読み誤る、という教訓がある。", "unverified": "本文を読めていないため、関連の大きさ、調整した変数、市民組織の結果の解釈は未確認。観察研究のため因果は分からない。"}}, {"id": "jr26", "rank": 26, "headline": "住環境の設計は直接には共同体感覚と結びつかない", "title": "Hope for the helpless: Unveiling the drivers of sense of community in cluster housing—Insights from nowdapara Guchchhogram, Ishwardi, a district-level city in northwestern Bangladesh", "url": "https://doi.org/10.1016/j.sftr.2026.102268", "authors": "Audity Biswas ほか", "venue": "Sustainable Futures", "date": "2026-11-11", "citescore": 3.5, "citescore_year": "2025", "apa": "Biswas, A., Ashekin, A., Rahman, S., Ferdousi, J. A., & Gupta, B. D. (2026). Hope for the helpless: Unveiling the drivers of sense of community in cluster housing—Insights from nowdapara Guchchhogram, Ishwardi, a district-level city in northwestern Bangladesh. Sustainable Futures, 12, 102268. https://doi.org/10.1016/j.sftr.2026.102268", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "気候変動で住まいを失った人々のための政府の集合住宅地で、コミュニティ感覚（住民どうしの一体感）が何によって生まれるかを、住環境の物理的な特徴と心理的な要因から調べた（抄録）。", "p3": "バングラデシュ北西部の再定住地を単一の事例として、世帯調査（100世帯）、半構造化面接（27人）、現地観察、統計分析を組み合わせた混合研究法。住宅の配置、歩行の条件、共有の空き地、材料の性能と、愛着・社会的な絆・所有の感覚・つながりの感覚を分析した（抄録）。", "p5": "物理的な設計の要因は、コミュニティ感覚と直接には関連しなかったと報告する。心理的な媒介の役割などの詳細は、抄録の末尾が切れており未確認（抄録）。", "fun": "災害で家を失った人のために、行政が新しい住宅地をまとめて建てることがある。評価はふつう住宅の供給やリスクの低減で行われるが、そこで暮らす人どうしのつながりが生まれるかは別の問題だ。この研究は、建物の配置や広場といった形を整えるだけでは、一体感に直接は結びつかないことを示した。入れ物を作ることと、共同体ができることの間には距離がある。", "unverified": "抄録の末尾が切れており、心理的な要因の結果と結論は未確認。1つの住宅地・100世帯の事例研究で、本文は読めていない。"}}, {"id": "jr27", "rank": 27, "headline": "移転高齢者の社会関係資本は3類型に分かれる", "title": "Heterogeneous social capital patterns and mental health in older adults relocated for poverty alleviation: a cross-sectional study", "url": "https://doi.org/10.3389/fpubh.2026.1899673", "authors": "Jing Wang ほか", "venue": "Frontiers in Public Health", "date": "2026-11-11", "citescore": 6.4, "citescore_year": "2025", "apa": "Wang, J., Feng, H., Pang, Y., Yao, D., Yang, L., & Cheng, J. (2026). Heterogeneous social capital patterns and mental health in older adults relocated for poverty alleviation: a cross-sectional study. Frontiers in Public Health, 14. https://doi.org/10.3389/fpubh.2026.1899673", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "貧困対策で移転した高齢者の社会関係資本が、家族、親族と友人、地域の水準の組み合わせによって3つの型に分かれ、型によって精神的健康が異なることを示した（抄録）。", "p3": "中国山西省で多段層化抽出により選んだ1,882人を対象とした横断調査。社会関係資本に関する6変数で潜在プロファイル分析を行い、属性・慢性疾患・健康行動を調整した線形回帰で、抑うつ症状と生活満足との関連を調べた（抄録）。", "p5": "高度に統合された型（29%）、中程度に適応した型（58%）、全般に弱い型（13%）の3つが最適だった。中程度の型に比べ、高度に統合された型は抑うつ症状が有意に少なかった（抄録）。", "fun": "引っ越しは、慣れた近所づきあいを一度に失う出来事である。政策で移転した高齢者を調べると、家族とも友人とも地域ともつながりを保てている人、そこそこの人、どれも弱い人の3つの型に分かれた。つながりの合計の点数ではなく、どの相手とのつながりがそろっているかという「型」で見ると、気持ちの落ち込みとの関係が見えやすくなる。", "unverified": "抄録の末尾が切れており、弱い型の結果は未確認。抄録中の最終分析の人数の表記が乱れており未確認。横断調査のため因果は分からない。"}}, {"id": "jr28", "rank": 28, "headline": "共同体意識に根ざす社会関係資本が家計の回復力と関連", "title": "Social capital grounded in forging a strong sense of community for the Chinese nation and household livelihood resilience in rural border areas: evidence from southern Xinjiang, China", "url": "https://doi.org/10.3389/fsufs.2026.1909919", "authors": "Zhiyuan Xu ほか", "venue": "Frontiers in Sustainable Food Systems", "date": "2026-11-12", "sjr": 0.768, "citescore": 6.0, "citescore_year": "2025", "apa": "Xu, Z., & Ma, J. (2026). Social capital grounded in forging a strong sense of community for the Chinese nation and household livelihood resilience in rural border areas: evidence from southern Xinjiang, China. Frontiers in Sustainable Food Systems, 10. https://doi.org/10.3389/fsufs.2026.1909919", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "中国新疆南部の辺境農村で、「中華民族の共同体意識」に根ざす社会関係資本を測る指標を作り、それが家計の生計の回復力（レジリエンス）と正に関連することを示した（抄録）。", "p3": "2025年に4地区の591世帯を調査した。文脈に合わせた指標を従来の社会関係資本の基準指標と比べ、次元別の分析、資源の経路、生計の違いを調べた。世帯の資源を調整し、両指標で内容が重なりうる項目を除いた場合も検討した（抄録）。", "p5": "正の関連は調整後も残り、文脈に合わせた指標は従来の指標に加えて説明力を持った。関係的な資本と構造的な資本に独立した関連があり、認知的な志向は関係的な資本を介して回復力につながっていた（抄録）。", "fun": "「地域のきずな」を測る物差しは、どこでも同じでよいのだろうか。この研究は、多民族が暮らす地域の事情に合わせた物差しを作り、従来の一般的な物差しと並べて比べた。すると、地域に合わせた物差しが、家計が打撃から立ち直る力について追加の説明力を持った。測る道具を文脈に合わせて作ることの意味を示している。ただし一時点の調査で、因果は分からない。", "unverified": "抄録の末尾が切れており、デジタル能力と政策の経路の結果は未確認。本文を読めていないため、指標の項目と係数の大きさは未確認。"}}, {"id": "jr29", "rank": 29, "headline": "被災後の連帯の場で癒やしが組織化される", "title": "Healing As Organizing in Solidarity Spaces: An Affective Perspective on Post-disaster Recovery", "url": "https://doi.org/10.1177/01708406261508698", "authors": "Chaïma Sophia Benzekri", "venue": "Organization Studies", "date": "2026-11-12", "sjr": 4.358, "citescore": 11.4, "citescore_year": "2025", "apa": "Benzekri, C. S. (2026). Healing As Organizing in Solidarity Spaces: An Affective Perspective on Post-disaster Recovery. Organization Studies. https://doi.org/10.1177/01708406261508698", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "災害のあと、住民主導の連帯の取り組みがどのように人々の癒やしを可能にするかを、爆発事故後のベイルートでの2年間の質的研究から明らかにした（抄録）。", "p3": "連帯の場を、物資の対応と感情の回復が別々ではなく互いを形づくる「関係的な修復の構造」として分析した。災害後の組織化の研究は資源の動員と機敏さを、災害研究は住民主導の回復の重要性を強調してきたが、組織化が集合的な癒やしをどう可能にするかは十分に探られていなかった（抄録）。", "p5": "連帯の場を、苦しみを受け止めると同時に新しい社会的な仕組みを生み出す「生成的な抱える環境」として捉え直した。また癒やしを、共同体が苦しみを主体性に変える、分散した集合的な実践としての「組織化」と概念化した（抄録）。", "fun": "大きな災害のあと、支援の場に集まった人たちは、必要なものを届けるだけでなく、気持ちを立て直してもいる。この研究は、その二つを別々のものと見ない。手を動かして助け合うこと自体が、心の回復の過程だという。癒やしを「一人ひとりの心の中で起きること」ではなく「みんなで行う活動」として捉え直した点が面白い。", "unverified": "抄録の末尾が切れており、結論の後半は未確認。本文を読めていないため、調査対象の団体と面接の規模は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "浮くプラスチック粒子の輸送様式を地図化", "title": "Development Length and Transport Regimes of Buoyant Plastics in Open‐Channel Flows", "url": "https://doi.org/10.1029/2026wr045097", "authors": "Charuni Wickramarachchi ほか", "venue": "Water Resources Research", "date": "2026-11-12", "sjr": 1.778, "citescore": 9.2, "citescore_year": "2025", "apa": "Wickramarachchi, C., Condo‐Colcha, F., Niven, R. K., & Kramer, M. (2026). Development Length and Transport Regimes of Buoyant Plastics in Open‐Channel Flows. Water Resources Research, 62(11). https://doi.org/10.1029/2026wr045097", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "水に浮くプラスチック粒子が、乱流の開水路でどのように運ばれるかについて、粒子が境界と十分に相互作用するまでに必要な流下距離（発達距離）の式と、輸送の様式を見分ける図を示した（抄録）。", "p3": "浮く粒子の鉛直分布は修正したRouse分布で表せるとされる一方、表面張力のため水面にとどまるという実験もある。この食い違いを整理するため、発達距離の式を導き、水面からの離脱と底面からの巻き上げの過程をRouseの枠組みに組み込んだ様式の図を作った（抄録）。", "p5": "発達距離を目安にすると、これまでの実験は分布が発達する途中の区間で行われていた可能性が示された。様式の図は、浮く粒子と沈む粒子の両方について、支配的な輸送の様式を予測する（抄録）。", "fun": "川に流れ込んだプラスチックのかけらは、水面を流れるのか、水の中に散らばるのか。理論では乱れで水中に混ざるはずなのに、実験では水面にとどまったままのことがある。この研究は、混ざりきるまでに「ある距離」を流れる必要があると考えた。実験の水路が短ければ、混ざる前の姿を見ていることになる。食い違いを観測の条件の違いとして説明した点が面白い。", "unverified": "抄録の末尾が切れており、結論の後半は未確認。本文を読めていないため、発達距離の式の具体形と検証に使ったデータは未確認。"}}, {"id": "jr31", "rank": 31, "headline": "暴浪時は戻り流れが沖向きの土砂輸送を担う", "title": "Quantifying Near‐Bed Sediment Transport Components Under Storm and Recovery Conditions", "url": "https://doi.org/10.1029/2026jc024471", "authors": "G. Gumbira ほか", "venue": "Journal of Geophysical Research: Oceans", "date": "2026-11-12", "sjr": 1.376, "citescore": 5.5, "citescore_year": "2025", "apa": "Gumbira, G., Li, M., Zhou, Y., Zheng, P., Pasma, G., & Tang, X. (2026). Quantifying Near‐Bed Sediment Transport Components Under Storm and Recovery Conditions. Journal of Geophysical Research: Oceans, 131(11). https://doi.org/10.1029/2026jc024471", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "海岸の底面近くで砂が岸向き・沖向きに運ばれる量を、波の線形成分、非線形の束縛波、平均流（戻り流れ）、砕波に伴う乱れの4つの成分に分けて定量化した（抄録）。", "p3": "位相を解像するブシネスク型の波モデルFunwaveと鉛直1次元のモデルを結合し、大規模な室内実験の2つの基準事例（強い巻き波型の砕波と、エネルギーの低い崩れ波型の砕波）を再現した。底面近くの流速、底面せん断応力、土砂フラックスを成分に分解した（抄録）。", "p5": "暴浪に相当する巻き波の条件では、沖向きの輸送は主に戻り流れによって生じ、波に関係する成分は浅水変形の領域と岸側で岸向きの輸送を促した。回復期に相当する崩れ波の条件では、底面近くの輸送は主に岸向きだった（抄録）。", "fun": "砂浜は、嵐のときに削られ、穏やかな波の時期に戻ってくる（背景）。なぜ向きが変わるのだろうか。波そのものは砂を岸へ押し、底を伝って沖へ帰る流れは砂を沖へ運ぶ。この研究は、その綱引きを成分ごとに計算で分けた。嵐のような条件では沖へ帰る流れが主役になり、穏やかな条件では岸向きの輸送が主になる。浜の変化を力の内訳で説明している。", "unverified": "抄録の末尾が切れており、回復期の条件の結果の詳細は未確認。本文を読めていないため、各成分の寄与の数値は未確認。"}}, {"id": "jr32", "rank": 32, "headline": "道路補修への住民満足度をCSIとIPAで評価", "title": "Analysis of Community Satisfaction with Self-Managed Road Repair Works by the UPTD of Banjarmasin City", "url": "https://doi.org/10.47577/technium.13892", "authors": "Ana Noviana ほか", "venue": "Technium Romanian Journal of Applied Sciences and Technology", "date": "2026-11-11", "apa": "Noviana, A., & Mursadin, A. (2026). Analysis of Community Satisfaction with Self-Managed Road Repair Works by the UPTD of Banjarmasin City. Technium: Romanian Journal of Applied Sciences and Technology, 31, 901–907. https://doi.org/10.47577/technium.13892", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "自治体の直営で行う道路の補修（アスファルトの穴埋め）について、道路利用者である住民の満足度を測り、優先して改善すべき項目を特定した（抄録）。", "p3": "インドネシア・バンジャルマシン市の5つの道路区間で各20人、計100人に質問紙を配った。25のサービス指標について重要度と成果を尋ね、顧客満足指数（CSI）で全体の満足度を、重要度-成果分析（IPA）で改善の優先度を求めた。信頼性係数は0.96だった（抄録）。", "p5": "CSIは79.66%で「満足」の区分だった。優先的に改善すべき象限に入ったのは、作業量が住民の要望に合っているか、要望と完了の度合いの一致、作業員の保護具の使用、保護具の順守の監視の4指標だった（抄録）。", "fun": "道路の穴を埋める工事の評価は、ふつう工事をする側の目で行われる。この研究は、その道を使う住民に「満足か」を尋ねた。すると全体には満足でも、「頼んだ分だけ直してくれたか」という点と、「作業員が安全装備を着けているか」という点が改善の優先項目になった。利用者は仕上がりだけでなく、工事のやり方も見ていることが分かる。", "unverified": "回答者100人の便宜的な標本による調査で、一般化の範囲は限られる。本文を読めていないため、25指標の内訳は未確認。"}}, {"id": "jr33", "rank": 33, "headline": "外来の物理環境は知覚と社会的支援を介し満足へ", "title": "Are Favorable Hospital Outpatient Environmental Assessment Results Associated with Higher Patient Satisfaction? A Patient-Centred Analysis of Physical, Perceptual, and Social Pathways", "url": "https://doi.org/10.3390/buildings16224512", "authors": "Tao Yu ほか", "venue": "Buildings", "date": "2026-11-12", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "apa": "Yu, T., Liu, Y., & Guan, J. (2026). Are Favorable Hospital Outpatient Environmental Assessment Results Associated with Higher Patient Satisfaction? A Patient-Centred Analysis of Physical, Perceptual, and Social Pathways. Buildings, 16(22), 4512. https://doi.org/10.3390/buildings16224512", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "病院の外来で、客観的に評価した物理的な環境の質が患者の満足と関連し、その一部は患者が感じる環境と社会的な支援を介していることを示した（抄録）。", "p3": "中国ハルビンの10病院で、外来患者25人への面接から特定した機能空間について物理的な環境の質を評価し、質問紙（有効回答294件）で満足、社会的支援、環境の知覚、精神状態を測って、並列の媒介モデルで分析した横断研究（抄録）。", "p5": "物理的な環境の質は患者の満足と正に関連した（β = 0.406）。間接的な関連は、環境の知覚を介したものが0.068、社会的支援を介したものが0.165で、合計0.233だった（抄録）。", "fun": "病院の外来が基準どおりに整っていれば、患者は満足するのだろうか。この研究によると、建物の出来は確かに満足につながるが、その道筋の一部は「患者自身がどう感じたか」と「周りに支えられていると感じるか」を通っていた。しかも後者の道のほうが太かった。設備の評価に合格することと、人が満足することの間には、人の感じ方がはさまっている。", "unverified": "抄録の末尾が切れており、結論は未確認。横断研究のため因果は分からない。本文を読めていないため、環境評価の項目は未確認。"}}, {"id": "jr34", "rank": 34, "headline": "カバードボンドがスウェーデンの住宅金融化を支えた", "title": "Safe bonds, risky debt? Covered bonds and the financialisation of housing in Sweden", "url": "https://doi.org/10.1177/0308518x261499187", "authors": "Viktor Skyrman ほか", "venue": "Environment and Planning A", "date": "2026-11-12", "sjr": 1.742, "citescore": 10.2, "citescore_year": "2025", "apa": "Skyrman, V., Blackwell, T., Barredo, J., & Buendía, L. (2026). Safe bonds, risky debt? Covered bonds and the financialisation of housing in Sweden. Environment and Planning A: Economy and Space. https://doi.org/10.1177/0308518x261499187", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "スウェーデンで、住宅ローンの資金調達に使われるカバードボンド（銀行が貸借対照表に残したまま発行する担保つき債券）の成長が、住宅の金融化をどう後押ししたかを明らかにした（抄録）。", "p3": "規制の変化の歴史、政策論争、関係者への面接にもとづく。カバードボンドは、発行銀行と、分別された住宅ローン資産の「カバープール」の両方に請求できる二重の保護を投資家に与える仕組みである（抄録）。", "p5": "債券の保有者にはリスクを下げる仕組みだが、同時に、借入の多い都市部への住宅ローンの供給を強め、信用リスクを国内銀行の貸借対照表に集中させた。国の当局の抵抗にもかかわらず、金融業界は国際的な金融競争力の維持に不可欠だとして法制化を実現した（抄録）。", "fun": "「安全な債券」と呼ばれる仕組みがある。買った人は、銀行と担保の住宅ローンの両方から回収できるので安心だ。ところがその安心のおかげで住宅ローンの供給が強まり、借入の多い都市に信用が集まり、危険は銀行の内側に集中していく。誰かにとっての安全が、別の場所に危険を寄せているかもしれない、という見方が面白い。", "unverified": "抄録の末尾が切れており、結論の後半は未確認。本文を読めていないため、面接の対象と数、資料の範囲は未確認。"}}, {"id": "jr35", "rank": 35, "headline": "デジタルでつなぐ公共空間が高齢者の参加を促す", "title": "Digital and Social Participation in Age-Friendly Smart City Environments: Evidence from the Extended Interconnected Public Spaces (EIPS) Framework", "url": "https://doi.org/10.3390/urbansci10110654", "authors": "Olalla García Pérez ほか", "venue": "Urban Science", "date": "2026-11-11", "citescore": 3.7, "citescore_year": "2025", "apa": "García Pérez, O., Padrón Nápoles, V. M., Parada Taboada, Y., Bellido-Esteban, A., & Esteban Penelas, J. L. (2026). Digital and Social Participation in Age-Friendly Smart City Environments: Evidence from the Extended Interconnected Public Spaces (EIPS) Framework. Urban Science, 10(11), 654. https://doi.org/10.3390/urbansci10110654", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "離れた地域の人々をデジタル技術でつないで共有の活動を行う枠組み（EIPS）を通じて、高齢者のデジタルへの備え、意味のある参加、生活の質がどう関係するかを調べた（抄録）。", "p3": "農村、都市、地域、施設にわたる50〜94歳の63人を対象とした多段階の混合研究法。デジタルへの備えとAIについての質問紙、活動ごとの調査、標準化された心理尺度、面接、フォーカスグループでデータを集めた（抄録）。", "p5": "記述的な量的傾向では自己評価のデジタル能力が上がり、質的な結果では自信、学び、社会的なつながり、参加、AIを使う意欲の向上が語られた。共有の仮想体験は、感情的なつながりと異文化の学びを高い水準で生んだ（抄録）。", "fun": "スマートシティというと、機械や通信の技術の話になりがちだ。この研究が注目したのは、離れた地域の人どうしをデジタルでつなぎ、高齢者が一緒に活動するという使い方である。参加した人は、機械に慣れただけでなく、自信がつき、人とのつながりが増えたと語った。技術を「便利さ」ではなく「参加の機会」として測った点が面白い。", "unverified": "抄録の末尾が切れており、標準化尺度での結果は未確認。63人の研究で、分析ごとに標本の大きさが異なる。本文は読めていない。"}}, {"id": "jr36", "rank": 36, "headline": "「東数西算」は計算回廊か環境費用の移転か", "title": "Computing Corridor or Ecological Cost Conveyor? Regional Equity in China’s East‐Data‐West‐Computing Project", "url": "https://doi.org/10.17645/up.12612", "authors": "Haifeng Deng ほか", "venue": "Urban Planning", "date": "2026-11-11", "citescore": 3.8, "citescore_year": "2025", "apa": "Deng, H., & He, Y. (2026). Computing Corridor or Ecological Cost Conveyor? Regional Equity in China’s East‐Data‐West‐Computing Project. Urban Planning, 11. https://doi.org/10.17645/up.12612", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "中国の「東数西算」プロジェクト（東部の計算需要を中西部のデータセンターに振り向ける国家事業）が、環境の費用を中西部に移してしまうおそれを、地域間の公平の観点から論じた（抄録）。", "p3": "2020年に始まり8つの国家計算拠点を指定したこの事業について、資源の負荷（電力・土地・水）と便益の地理的な配分を検討した。事業ごとの評価の枠組みと、効率目標と公平・調整の目標の扱いの違いに注目する（抄録）。", "p5": "生態系への費用は事業ごとの評価では見えにくく、効率の目標は強制できる指標に翻訳されやすいのに対し、公平と調整の目標はそうでない。その結果、中西部は遅れて現れる生態リスクと資源・財政の制約に直面し、受ける便益が負う責任に見合わないおそれがあると論じる（抄録）。", "fun": "AIを動かすデータセンターは、大量の電気と水と土地を使う。中国は、需要の集中する東部の計算を、中部と西部に振り向ける計画を進めている。計算は遠くへ運べるが、資源の消費や環境への負担は現地に残る。効率は数字にしやすいので守られるが、公平は数字にしにくいので後回しになりやすい、という指摘が鋭い。", "unverified": "抄録の末尾が切れており、提言の内容は未確認。本文を読めていないため、根拠となるデータと分析方法は未確認。"}}, {"id": "jr37", "rank": 37, "headline": "非定常な浮標の観測から係留応答の変数を復元", "title": "Environmentally conditioned paired difference learning with field residual preservation for recovering controlled mooring response parameters from nonstationary buoy observations", "url": "https://doi.org/10.3389/fmars.2026.1949441", "authors": "Ruolan Zhang ほか", "venue": "Frontiers in Marine Science", "date": "2026-11-12", "sjr": 0.959, "citescore": 6.5, "citescore_year": "2025", "apa": "Zhang, R., Yang, C., Hu, J., & Pan, M. (2026). Environmentally conditioned paired difference learning with field residual preservation for recovering controlled mooring response parameters from nonstationary buoy observations. Frontiers in Marine Science, 13. https://doi.org/10.3389/fmars.2026.1949441", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "航路標識ブイの長期の運動記録から、環境による応答、係留の状態の変化、測位誤差が混ざった中で、係留の応答に関する変数を取り出す学習法を提案した（抄録）。", "p3": "まず風・波・流れ・姿勢の変数から、予測できる水平の応答を推定する。次に、同じ実測記録に制御した応答の差を加え、対応させたランダムフォレストで、等価な応答係数、軌跡の基準中心のずれ、将来の基準半径の超過確率を推定する。張力の計測や損傷のラベルは使わない（抄録）。", "p5": "後の期間での評価で、環境モデルはベクトルの正規化誤差を2次元の平均の基準より41.58%減らした。完全な手法の同時の正規化誤差は0.2659で、基準中心のずれの誤差は約0.371 m減った（抄録）。", "fun": "海に浮かぶブイは、海底につながれて風や波に揺られている。係留の状態が変わると動き方も変わるはずだが、ふだんの揺れに埋もれて分かりにくい。この研究は、まず「この風と波ならこのくらい動くはず」という分を見積もり、さらに実際の記録にわざと既知の変化を足して、それを当てられるかで手法を確かめた。答えの分かった問題を自分で作る発想が面白い。", "unverified": "抄録の末尾が切れており、考察の内容は未確認。本文を読めていないため、ブイの数と観測期間、実際の損傷の検出への適用は未確認。"}}, {"id": "jr38", "rank": 38, "headline": "適応的な代理モデルで有限要素モデルを更新", "title": "A finite element model updating method for silicone foam spacer using adaptive surrogate model", "url": "https://doi.org/10.1177/09544062261501700", "authors": "Haoliang Huang ほか", "venue": "Proceedings of the Institution of Mechanical Engineers, Part C: Journal of Mechanical Engineering Science", "date": "2026-11-12", "citescore": 4.3, "citescore_year": "2025", "apa": "Huang, H., Deng, Q., & Feng, D. (2026). A finite element model updating method for silicone foam spacer using adaptive surrogate model. Proceedings of the Institution of Mechanical Engineers, Part C: Journal of Mechanical Engineering Science. https://doi.org/10.1177/09544062261501700", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "非線形の強い材料（シリコーンフォームのスペーサー）の有限要素モデルの材料パラメータを、少ない計算で実験に合うよう更新する方法を提案した（抄録）。", "p3": "低食い違い量列によるサンプリング、代理モデルの予測値を最小化する点を追加する方法（MSP）、粒子群最適化（PSO）を、適応的なクリギング代理モデルに組み込んだ。複数の数値例で頑健性を調べ、要点を順に回る方策で材料パラメータを効率よく逆算した（抄録）。", "p5": "更新後の有限要素モデルの静的応答は、実験データとの決定係数が0.9990に達した（抄録）。背景：クリギングは、少数の計算結果から応答の曲面を補間する代理モデル。", "fun": "コンピュータの中の模型を実物に合わせるには、材料の硬さなどの値を少しずつ変えて、実験と合うまで計算をやり直す。一回の計算が重いと、とても終わらない。そこで、数回の計算結果から「だいたいこうなるはず」という身代わりの式を作り、次に試すべき値を賢く選ぶ。試すたびに身代わりの式も更新されていく。少ない試行で当たりを付ける工夫である。", "unverified": "本文を読めていないため、更新したパラメータの数、必要だった計算回数、従来法との比較は未確認。"}}, {"id": "jr39", "rank": 39, "headline": "内部監査の能力が利益増加型の裁量と負の関連", "title": "Internal audit quality and earnings management: the roles of competence, independence, and work performance", "url": "https://doi.org/10.1108/jaee-04-2025-0181", "authors": "Manirul Islam", "venue": "Journal of Accounting in Emerging Economies", "date": "2026-11-12", "citescore": 8.9, "citescore_year": "2025", "apa": "Islam, M. (2026). Internal audit quality and earnings management: the roles of competence, independence, and work performance. Journal of Accounting in Emerging Economies, 1–25. https://doi.org/10.1108/jaee-04-2025-0181", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "規制の執行にむらがある新興国で、内部監査の質が高い企業ほど、利益を増やす方向の裁量的な会計処理が少ないことを示した（抄録）。", "p3": "内部監査の能力・独立性・業務遂行を質問紙で測り、ダッカ証券取引所の非金融上場企業の公開データと組み合わせた。財務報告の質は、業績調整済みの修正ジョーンズモデル（Kothari et al., 2005）による符号つきの裁量的発生高で測った。横断の設計である（抄録）。", "p5": "内部監査の質が高いほど利益増加型の裁量的発生高が小さかった。この関連は主に能力によるもので、独立性と業務遂行は同時に入れると別個の関連を示さなかった。関連は赤字企業で強く、監査委員会の独立性が高い企業で弱かった（抄録）。", "fun": "会社の中にいる「内部監査」は、身内なので甘くなりそうに思える。それでもこの研究では、内部監査がしっかりしている会社ほど、利益をよく見せる方向の会計上の調整が少なかった。効いていたのは、立場の独立よりも、監査する人の専門的な力のほうだった。また、監査委員会の独立性が高い会社では関連が弱く、二つの見張りは互いに代わりになっているらしい。", "unverified": "抄録の末尾が切れており、実務への含意は未確認。本文を読めていないため、標本の規模と係数の大きさは未確認。横断の設計で因果は分からない。"}}, {"id": "jr40", "rank": 40, "headline": "中小企業の財務分析に予測とLLM助言を統合", "title": "A unified ML LLM decision support framework for SME financial analytics forecasting risk and advisory recommendations", "url": "https://doi.org/10.1007/s44163-026-02742-7", "authors": "Amit Pimpalkar ほか", "venue": "Discover Artificial Intelligence", "date": "2026-11-12", "citescore": 6.2, "citescore_year": "2025", "apa": "Pimpalkar, A., De, A., Abhani, P., Shelke, N., Kalpana, D., & Vanam, H. (2026). A unified ML LLM decision support framework for SME financial analytics forecasting risk and advisory recommendations. Discover Artificial Intelligence, 6(1). https://doi.org/10.1007/s44163-026-02742-7", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "中小企業と個人の財務の意思決定のために、予測、リスクの数値化、助言の生成を一つにまとめた意思決定支援システム（MoneyMind AI）を提示した（抄録）。", "p3": "取引単位のCSVデータから収入・支出・純キャッシュフロー・利益率を計算し、線形回帰とランダムフォレストで1〜3か月先を予測する。利益率、キャッシュフローの安定性、売上成長率、支出の変動の4指標を合成した財務健全度スコアで3段階に区分し、LLMが自然言語の助言を生成する（抄録）。", "p5": "24か月の観測のデータで、ランダムフォレストの予測は平均の絶対パーセント誤差（MAPE）11.2%で、ARIMAの基準モデルより良かったと報告する（抄録）。", "fun": "小さな会社には、専属の財務担当者がいないことが多い（背景）。このシステムは、取引の記録を読み込み、数か月先のお金の流れを予測し、健全さを3段階で示し、最後にAIが「何をすべきか」を文章で助言する。予測・診断・助言を一本につないだ点が特徴である。ただし助言の中身が妥当かをどう確かめたかは、抄録の範囲からは分からない。", "unverified": "抄録の末尾が切れており、データの規模、LLMの助言の評価方法と結果は未確認。本文は読めていない。"}}, {"id": "jr41", "rank": 41, "headline": "環境管理会計は財務には効くが環境には効かない", "title": "Unraveling performance asymmetry: environmental accounting and knowledge management as economic and environmental decision-support tools in an emerging market", "url": "https://doi.org/10.1108/jaoc-08-2025-0282", "authors": "Kwabena Agyarko Gyekye ほか", "venue": "Journal of Accounting & Organizational Change", "date": "2026-11-11", "citescore": 7.1, "citescore_year": "2025", "apa": "Gyekye, K. A., & Matemane, R. (2026). Unraveling performance asymmetry: environmental accounting and knowledge management as economic and environmental decision-support tools in an emerging market. Journal of Accounting & Organizational Change, 22(7), 455–482. https://doi.org/10.1108/jaoc-08-2025-0282", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "新興国の製造業で、環境管理会計は財務業績を高めるが環境業績には同じようには効かないという、効果の非対称性を示した（抄録）。", "p3": "ガーナの製造企業の回答者347人のデータを、層化無作為抽出による横断の設計で集め、PLS-SEMで分析した（抄録）。", "p5": "環境管理会計は財務業績を有意に改善したが、環境業績には対応する影響を与えなかった。環境の知識管理は財務業績にも寄与するが、その効果は比較的小さく、環境業績への影響ほど直接的ではなかった（抄録）。", "fun": "環境のための会計と聞くと、環境を良くする道具だと思う。ところがこの調査では、環境にかかる費用を数える会計は、会社の財務の成績を上げるほうに効き、環境そのものの改善にははっきり効いていなかった。著者は、この会計を経済的な意思決定を支える仕組みと見るべきだと述べる。環境を良くするには、知識を組織の力として育てる別の取り組みが要る、という結果である。", "unverified": "抄録の末尾が切れており、実務への含意の後半は未確認。横断の質問紙調査で、係数の大きさは未確認。本文は読めていない。"}}, {"id": "jr42", "rank": 42, "headline": "5つ星ホテルの原価計算は予算管理が中心", "title": "COSTING AND MANAGEMENT CONTROL PRACTICES IN THE HOTEL SECTOR: CASE STUDY", "url": "https://doi.org/10.29073/e3.v12i5.1324", "authors": "Cláudia Oliveira ほか", "venue": "e3", "date": "2026-11-10", "citescore": 0.2, "citescore_year": "2025", "apa": "Oliveira, C., Silva, A., Silva, A., & Monteiro, A. (2026). COSTING AND MANAGEMENT CONTROL PRACTICES IN THE HOTEL SECTOR: CASE STUDY. E3, 12(5), 265–278. https://doi.org/10.29073/e3.v12i5.1324", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "研究の少ないホテル業の管理会計について、5つ星ホテル1軒の原価計算と管理統制の実務を詳しく記述した事例研究（抄録）。", "p3": "自由回答の面接と、6か月にわたる日常業務の直接観察を組み合わせた。ホテルは宿泊業の統一会計報告様式（USALI）を適用し、サービスの評価と業績評価に直接原価計算を使っている（抄録）。", "p5": "予算管理が主要な管理会計の技法で、二重の会計システムが財務会計と管理会計の統合を促していた。管理統制は在庫、価格設定、財務成績、キャッシュフローの監視に重点があり、管理者は管理会計情報をよく理解して意思決定と予算統制に使っていた（抄録）。", "fun": "ホテルは経済的に大きな産業なのに、その中でどんな数字を見て経営しているかの研究は少ない。この研究は、高級ホテルに半年入り込み、面接と観察で実際の使われ方を調べた。中心にあったのは予算の管理で、在庫、価格、成績、お金の出入りを見張ることに重点があった。理論と現場の実務の間をつなぐ、地道な記述の研究である。", "unverified": "1軒の事例で、一般化の範囲は限られる。本文を読めていないため、面接の人数と具体的な帳票は未確認。"}}, {"id": "jr43", "rank": 43, "headline": "社会的処方は好評でも必要の解決は半数未満", "title": "Implementation of Social Prescribing: Caregiver Experiences of Community Connect", "url": "https://doi.org/10.1177/21501319261504802", "authors": "Amanda J. Nickel ほか", "venue": "Journal of Primary Care and Community Health", "date": "2026-11-12", "sjr": 0.915, "citescore": 3.9, "citescore_year": "2025", "apa": "Nickel, A. J., Udoeyop, M. L., & Finch, M. D. (2026). Implementation of Social Prescribing: Caregiver Experiences of Community Connect. Journal of Primary Care & Community Health, 17. https://doi.org/10.1177/21501319261504802", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "小児科の一次医療で、家庭の社会的な困りごとを尋ねて地域の支援につなぐ「社会的処方」について、紹介を受けた養育者だけでなく、断った養育者や困りごとなしと答えた養育者の経験も明らかにした（抄録）。", "p3": "2021年10月〜2022年2月に、メディケイド加入の子どもの健診で社会的な必要のスクリーニングを受けた養育者36人に半構造化面接を行い、内容分析で符号化した。支援プログラム（Community Connect）の参加者、断った人、陰性だった人を含む（抄録）。", "p5": "養育者は小児科での社会的処方に満足していた。案内役との明確なやり取りが参加に不可欠だった。参加者のうち必要が解決したのは半数未満で、事務手続きの負担が支援の利用を妨げていた。困りごとなしと答えたり断ったりしたことは、受け入れられていないことを意味しなかった（抄録）。", "fun": "診察の場で暮らしの困りごとを尋ね、困っていれば地域の支援を紹介する取り組みがある。断る人は不要だと感じているのかと思いきや、断ったことは、この仕組みが受け入れられていないことを意味しなかった。一方、紹介を受けても、手続きの負担が壁になって、困りごとが解決した人は半分に満たなかった。つなぐことと、解決することは別だと分かる。", "unverified": "36人の面接による質的研究で、一般化の範囲は限られる。本文を読めていないため、3つの群の人数の内訳は未確認。"}}, {"id": "jr44", "rank": 44, "headline": "航空サービス体験の非線形性を認知・感情で評価", "title": "Uncovering non-linearities in airline service experience: a dual cognitive-affective evaluation framework", "url": "https://doi.org/10.1016/j.rtbm.2026.101954", "authors": "Laura Eboli ほか", "venue": "Research in Transportation Business and Management", "date": "2026-11-12", "sjr": 1.014, "citescore": 8.7, "citescore_year": "2025", "apa": "Eboli, L., & Mazzulla, G. (2027). Uncovering non-linearities in airline service experience: a dual cognitive-affective evaluation framework. Research in Transportation Business & Management, 70, 101954. https://doi.org/10.1016/j.rtbm.2026.101954", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名と掲載誌の情報だけを使用", "preprint": false, "short": true, "p1" 名と掲載誌の情報だけを使用", "preprint": false, "short": true, "p1": "題名によれば、破壊を変分問題として扱うモデルの数値解法である固有侵食（eigenerosion）法について、その限界と拡張を論じる研究である（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "物がどこからどう割れるかを計算するのは難しい。割れ目は、計算のために切った網目とは無関係に、好きな向きへ進むからだ。題名は、破壊を扱う一つの計算手法について、どこでうまくいかなくなるのか、どう直せるのかを問うている。手法の使える範囲をはっきりさせる研究は、その手法を信頼して使うために欠かせない。", "unverified": "抄録・本文を入手できず、指摘される限界の内容、提案される拡張、検証例はすべて未確認。"}}, {"id": "jr48", "rank": 48, "headline": "離れたセンサの応答と次数低減で多面不釣合いを推定", "title": "Multi-plane unbalance estimation using non-collocated sensor responses and model order reduction techniques", "url": "https://doi.org/10.1016/j.mechmachtheory.2026.106680", "authors": "Khurram Shehzad ほか", "venue": "Mechanism and Machine Theory", "date": "2026-11-12", "sjr": 1.574, "citescore": 12.0, "citescore_year": "2025", "apa": "Shehzad, K., Ranjan, G., Nutakor, C., Choudhury, T., & Sopanen, J. (2026). Multi-plane unbalance estimation using non-collocated sensor responses and model order reduction techniques. Mechanism and Machine Theory, 232, 106680. https://doi.org/10.1016/j.mechmachtheory.2026.106680", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名と掲載誌の情報だけを使用", "preprint": false, "short": true, "p1": "題名によれば、回転体の複数の面にある不釣合いを、不釣合いのある位置とは異なる位置のセンサの応答と、モデルの次数低減の技法を使って推定する研究である（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "洗濯機が脱水のときにがたがた揺れるのは、中の洗濯物が片寄って重さの釣り合いが崩れるからだ。機械の回転軸でも同じことが起き、どこにどれだけ片寄りがあるかを知りたい。しかしセンサを片寄りのある場所そのものに付けられるとは限らない。題名は、離れた場所の揺れから片寄りを逆算し、そのために計算モデルを小さくまとめる工夫を使うことを示している。", "unverified": "抄録・本文を入手できず、対象の機械、推定の手順、精度はすべて未確認。"}}, {"id": "jr49", "rank": 49, "headline": "学習のためのデジタル社会関係資本尺度を開発", "title": "The development and validation of a Digital Social Capital for Learning (DSC-L) scale", "url": "https://doi.org/10.1080/10494820.2026.2755536", "authors": "Shu Cheng ほか", "venue": "Interactive Learning Environments", "date": "2026-11-12", "sjr": 2.24, "citescore": 17.8, "citescore_year": "2025", "apa": "Cheng, S., Feng, S., & Law, N. W. Y. (2026). The development and validation of a Digital Social Capital for Learning (DSC-L) scale. Interactive Learning Environments, 1–21. https://doi.org/10.1080/10494820.2026.2755536", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名と掲載誌の情報だけを使用", "preprint": false, "short": true, "p1": "題名によれば、学習に関わるデジタルな社会関係資本を測る尺度（DSC-L）を開発し、その妥当性を確かめた研究である（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "勉強で困ったとき、ネット上で質問できる相手や、情報を教え合える仲間がいるかどうかは、学びやすさを左右しそうだ。しかし「ネット上のつながりの豊かさ」は目に見えない。それを質問項目の組み合わせで数値にしようとするのが、この題名の示す研究である。目に見えないものを測る物差しを作り、それが測りたいものを測れているかを確かめる問いである。", "unverified": "抄録・本文を入手できず、尺度の項目と次元、標本、信頼性・妥当性の結果はすべて未確認。"}}, {"id": "jr50", "rank": 50, "headline": "尺度の次元性と得点解釈を3段階で評価", "title": "A three-step framework for evaluating dimensionality and score interpretation in L2 scale development", "url": "https://doi.org/10.1016/j.rmal.2026.100395", "authors": "Joanna Juntang Wang", "venue": "Research Methods in Applied Linguistics", "date": "2026-11-12", "sjr": 2.794, "citescore": 12.4, "citescore_year": "2025", "apa": "Wang, J. J. (2026). A three-step framework for evaluating dimensionality and score interpretation in L2 scale development. Research Methods in Applied Linguistics, 5(3), 100395. https://doi.org/10.1016/j.rmal.2026.100395", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名と掲載誌の情報だけを使用", "preprint": false, "short": true, "p1": "題名によれば、第二言語の研究で尺度を開発するときに、尺度の次元性（いくつの側面を測っているか）と得点の解釈を評価するための3段階の枠組みを示す方法論の研究である（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "アンケートの項目の点数を足し合わせて一つの得点と呼ぶとき、その項目群が本当に一つのものを測っているのかが問題になる。別々のものが混ざっていれば、合計点の意味はあいまいになる。題名は、それを確かめる手順を3つの段階に整理しようとしていることを示している。点数をどう読んでよいかの根拠を固めようとする問いである。", "unverified": "抄録・本文を入手できず、3段階の内容、使う統計手法、適用例はすべて未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "労働市場の逼迫がドイツの賃金格差を反転させた", "title": "Labor Market Tightness and the Reversal of Inequality Trends in Germany", "url": "https://doi.org/10.1093/qje/qjag057", "authors": "Christian Dustmann ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-11-10", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "apa": "Dustmann, C., Friedrich, M., Gergs, C., & Schönberg, U. (2026). Labor Market Tightness and the Reversal of Inequality Trends in Germany. The Quarterly Journal of Economics. https://doi.org/10.1093/qje/qjag057", "why": "ドイツでは大不況までの20年間に賃金格差が拡大したが、最低賃金導入（2015年）より前の2010年から下位の賃金が上位より速く伸び始めた。論文はこの反転を、内需に支えられた労働市場の逼迫で説明する。不況後に転職率と転職時の賃金上昇が特に職の階段の下位で高まり、労働者が低賃金企業から高賃金企業へ移り、企業と労働者の同類マッチングと技能プレミアム、企業の買い手独占力が弱まったと報告する。"}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "投資家の長期情報が鈍ると長期案件の投資が減る", "title": "The Horizon of Investors’ Information and Corporate Investment", "url": "https://doi.org/10.1093/rfs/hhag097", "authors": "Olivier Dessaint ほか", "venue": "The Review of Financial Studies", "date": "2026-11-10", "sjr": 17.406, "citescore": 13.2, "citescore_year": "2025", "apa": "Dessaint, O., Foucault, T., & Frésard, L. (2026). The Horizon of Investors’ Information and Corporate Investment. The Review of Financial Studies. https://doi.org/10.1093/rfs/hhag097", "why": "投資家が持つ情報の質が、予測の期間ごとに企業の実物投資へ影響することを示した。経営者が株価を気にするとき、長期のキャッシュフローに関する投資家のシグナルの情報量が落ちると、長期プロジェクトを持つ企業ほど投資を減らす。手作業で集めたプロジェクト期間の指標を使い、長期情報の質が1標準偏差下がると、長期案件の企業の投資が短期案件の企業に比べ3.7%減ると報告する。"}, {"id": "jn03", "rank": 3, "field": "経営学", "headline": "顧客の情報要求が取引先の気候開示を促す", "title": "The Role of Supply Chains in Climate Disclosure", "url": "https://doi.org/10.1111/1475-679x.70096", "authors": "Pietro Bonetti ほか", "venue": "Journal of Accounting Research", "date": "2026-11-12", "sjr": 9.774, "citescore": 13.4, "citescore_year": "2025", "apa": "Bonetti, P., EN, Y. (., Kadach, I., & Ormazabal, G. (2026). The Role of Supply Chains in Climate Disclosure. Journal of Accounting Research. https://doi.org/10.1111/1475-679x.70096", "why": "気候リスク報告の基盤であるCDPでは、顧客企業が仕入先に気候関連情報を求めることができる。この仕組みを使い、国際的な顧客・仕入先の組の大標本で、顧客の情報要求と仕入先のCDPでの公開開示に正の関連を見いだした。平均の関連は小さいが、双方の開示の誘因と交渉力に応じて大きく異なる。より環境負荷が小さく透明な仕入先へ取引関係が移る傾向も記述的に示す。"}, {"id": "jn04", "rank": 4, "field": "量子情報", "headline": "量子チャネルの学習に必要な回数の最適解を確定", "title": "Optimal learning of quantum channels in diamond distance", "url": "https://doi.org/10.1038/s41567-026-03499-7", "authors": "Antonio Anna Mele ほか", "venue": "Nature Physics", "date": "2026-11-12", "sjr": 6.581, "citescore": 29.4, "citescore_year": "2025", "apa": "Mele, A. A., & Bittel, L. (2026). Optimal learning of quantum channels in diamond distance. Nature Physics. https://doi.org/10.1038/s41567-026-03499-7", "why": "未知の量子チャネル（量子状態の時間発展を表す写像）を、標準的な距離であるダイヤモンド距離で一定の精度まで学ぶのに、チャネルを何回使う必要があるかという長年の未解決問題に答えた。入出力の次元とクラウス階数に対して最適な依存を持つアルゴリズムと、それに一致する下界を示す。チャネルのトモグラフィーを純粋状態のトモグラフィーに帰着させ、状態・ユニタリ・測定の推定を一つの枠組みで扱う（Nature Physics）。"}, {"id": "jn05", "rank": 5, "field": "経営学", "headline": "真正性の3類型が満足・口コミ・再購買につながる", "title": "Authenticity in marketing: A conceptual model and meta-analysis", "url": "https://doi.org/10.1007/s11747-026-01222-9", "authors": "Markus Blut ほか", "venue": "Journal of the Academy of Marketing Science", "date": "2026-11-12", "sjr": 6.426, "citescore": 22.3, "citescore_year": "2025", "apa": "Blut, M., Chaney, D., Lunardo, R., & Mencarelli, R. (2026). Authenticity in marketing: A conceptual model and meta-analysis. Journal of the Academy of Marketing Science. https://doi.org/10.1007/s11747-026-01222-9", "why": "マーケティングの真正性（authenticity）研究を、事実に忠実・理想に忠実・自己に忠実の3類型が全体的な真正性の知覚を生むという枠組みで統合したメタ分析。406の独立標本・173,577人の顧客のデータで、この統合モデルの当てはまりが最もよく、真正性が肯定的感情・信念・関係の質を介して満足、口コミ、再購買意図につながる連鎖を示した。財とサービス、オンラインとオフライン、国の違いによる調整効果も調べている。"}, {"id": "jn06", "rank": 6, "field": "計算社会科学・ネットワーク科学", "headline": "英議会100年の移民発言、近年は全党で否定的に", "title": "Measuring immigration rhetoric in the UK parliament", "url": "https://doi.org/10.1093/pnasnexus/pgag391", "authors": "Gloria Gennaro ほか", "venue": "PNAS Nexus", "date": "2026-11-12", "sjr": 1.339, "citescore": 6.7, "citescore_year": "2025", "apa": "Gennaro, G., Vissens, A., Thornewill von Essen, A., Ravalde, T., Egan, J., Dave, S., Dable, E., & Facini, G. (2026). Measuring immigration rhetoric in the UK parliament. PNAS Nexus. https://doi.org/10.1093/pnasnexus/pgag391", "why": "LLMと人手の入力を組み合わせた機械学習の手順で、英国下院の1923〜2025年の発言から移民への感情を測った。分類の性能は高く、モデルの選び方を変えても安定している。労働党議員は1960年代初めから保守党より肯定的で、1980年代初めに差が開いた。過去15年は党派を超えて否定的になり、保守党とリフォームUKの議員の論調は対象期間のどの党よりも否定的だと報告する。"}, {"id": "jn07", "rank": 7, "field": "計算社会科学・ネットワーク科学", "headline": "選挙監視のLLM、まれな脅威では精度が足りない", "title": "The Election Monitoring Trilemma: Measuring Rare Elite Threats on Social Media With Large Language Models", "url": "https://doi.org/10.1177/10659129261503387", "authors": "Sean T. Norton ほか", "venue": "Political Research Quarterly", "date": "2026-11-12", "sjr": 1.607, "citescore": 3.9, "citescore_year": "2025", "apa": "Norton, S. T., Greene, K. T., Leu, O., DeMattee, A. J., & Shapiro, J. N. (2026). The Election Monitoring Trilemma: Measuring Rare Elite Threats on Social Media With Large Language Models. Political Research Quarterly. https://doi.org/10.1177/10659129261503387", "why": "2024年の南アフリカ・インド・ドイツの選挙で、候補者・政党・記者・インフルエンサーの公開投稿を集め、無作為標本を人手とLLMで5項目について注釈した。暴力の扇動は投稿の0.2%、民主的規範への攻撃は1.9%とまれだった。LLMは真の該当例を拾えるが、まれな項目での適合率は低い。このため選挙監視は、網羅性・処理量・信頼性の三つを同時には満たせないと論じる。"}, {"id": "jn08", "rank": 8, "field": "政治学", "headline": "解放民局の事務所は郡の社会経済を数十年改善", "title": "America's most “far‐reaching institution”: The work and legacies of the Freedmen's Bureau", "url": "https://doi.org/10.1111/ajps.70096", "authors": "Michael Albertus ほか", "venue": "American Journal of Political Science", "date": "2026-11-12", "sjr": 6.539, "citescore": 12.4, "citescore_year": "2025", "apa": "Albertus, M., & Rogowski, J. (2026). America’s most “far‐reaching institution”: The work and legacies of the Freedmen’s Bureau. American Journal of Political Science. https://doi.org/10.1111/ajps.70096", "why": "米国の再建期に置かれた解放民局（Freedmen's Bureau）の活動について独自のデータを作り、事務所の配置と存続期間を郡の社会経済指標と結びつけた。事務所のあった郡では黒人・白人の双方に正の効果があり、地方の行政能力の発達を伴い、事務所が長く続くほど効果が大きい。効果は数十年続いたが、ジム・クロウ体制が深まるにつれ黒人では弱まり白人では強まったと報告する。"}, {"id": "jn09", "rank": 9, "field": "工学", "headline": "まばらな計測からダムの地震応答と損傷域を推定", "title": "A Deep Learning Framework for Seismic Response Reconstruction and Spatial Damage Assessment of Concrete Gravity Dams", "url": "https://doi.org/10.1142/s0219455428500782", "authors": "Bo Liu ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-12", "citescore": 6.5, "citescore_year": "2025", "apa": "Liu, B., Xu, Q., He, X., Zhang, X., Wang, M., & Zhang, Y. (2026). A Deep Learning Framework for Seismic Response Reconstruction and Spatial Damage Assessment of Concrete Gravity Dams. International Journal of Structural Stability and Dynamics. https://doi.org/10.1142/s0219455428500782", "why": "重力式コンクリートダムでは動的計測器が少なく、地震時の局所損傷を素早く特定しにくい。検証済みのダム・貯水池・基礎系の有限要素モデルをもとに、時間・周波数の制約を付けた多スケールの敵対的生成ネットワークで未計測点の地震応答を再構成し、応答とモード形状差の特徴から区域ごとの損傷体積比の時刻歴を推定する枠組みを示した。"}, {"id": "jn10", "rank": 10, "field": "機械学習", "headline": "技能を離散符号で再利用しキャラクター制御を継続学習", "title": "STRIDE: Continual Learning using Skill Transfer and Reuse with Incremental Discrete Encoding", "url": "https://doi.org/10.1145/3861007", "authors": "Pranav Agarwal ほか", "venue": "ACM Transactions on Graphics", "date": "2026-11-12", "sjr": 5.633, "citescore": 21.6, "citescore_year": "2025", "apa": "Agarwal, P., Rocca, M., Zordan, V. B., & Andrews, S. (2026). STRIDE: Continual Learning using Skill Transfer and Reuse with Incremental Discrete Encoding. ACM Transactions on Graphics. https://doi.org/10.1145/3861007", "why": "物理シミュレーションで動くキャラクターの制御を強化学習で汎用化するとき、連続空間で方策が干渉し合うことが障害になる。VQ-VAEで方策を量子化して再利用できる行動の基本要素を離散潜在空間に見つけ、新しい動作を既存の符号語の組み合わせで学ぶことで破滅的忘却を構造的に避ける。多様な歩行や蹴り、的を狙う課題で、下流の学習を基準手法の1.3〜2.0倍速くしたと報告する。"}, {"id": "jn11", "rank": 11, "field": "経営学", "headline": "タクシー業界の抗議はUber禁止と利用増を同時に招く", "title": "Street Fights and Court Battles: Incumbent mobilization and the timing of regulatory bans against platform entrants", "url": "https://doi.org/10.1177/01708406261508714", "authors": "Bilgehan Uzunca ほか", "venue": "Organization Studies", "date": "2026-11-12", "sjr": 4.358, "citescore": 11.4, "citescore_year": "2025", "apa": "Uzunca, B., & Ozcan, P. (2026). Street Fights and Court Battles: Incumbent mobilization and the timing of regulatory bans against platform entrants. Organization Studies. https://doi.org/10.1177/01708406261508714", "why": "欧州22か国・2012〜2020年について、タクシー業界の戦術と主張の枠組みを手作業で符号化し、最初の規制禁止、Uberアプリのダウンロード数、検索関心と結びつけた。実力行使型の戦術は動員直後の短い期間で、訴訟はより長い期間で最初の禁止の発生と関連する。同時に、これらの動員はダウンロードと検索関心の即時の増加とも重なり、排除しようとした参入者への注目を高めていた。因果の向きは特定できないと著者は述べる。"}, {"id": "jn12", "rank": 12, "field": "組織行動・心理的安全性", "headline": "職場の差別は否定的感情と反芻を経てサービス妨害へ", "title": "Discrimination takes its toll: unraveling employee service sabotage from a cognitive-appraisal perspective", "url": "https://doi.org/10.1108/ijchm-03-2026-0399", "authors": "Chia-Yun Tsai ほか", "venue": "International Journal of Contemporary Hospitality Management", "date": "2026-11-12", "sjr": 3.116, "citescore": 22.1, "citescore_year": "2025", "apa": "Tsai, C.-Y., Kluemper, D. H., & Tao, C.-W. (. (2026). Discrimination takes its toll: unraveling employee service sabotage from a cognitive-appraisal perspective. International Journal of Contemporary Hospitality Management, 1–20. https://doi.org/10.1108/ijchm-03-2026-0399", "why": "米国の飲食店従業員を対象にした複数の調査（300人、時間差をおいた234人）で、不公正の知覚が差別の知覚を生み、それが否定的感情と反芻を介してサービス妨害（故意に質を下げる行動）と間接的に関連することを示した。組織からの差別は顧客からの差別より一貫した関連を示し、性格特性の調整効果は外向性に限られた。"}, {"id": "jn13", "rank": 13, "field": "工学", "headline": "チタン合金筋とUHPCで橋脚の残留変形を抑える", "title": "Experimental Evaluation of the Influence of Titanium Alloy Bars on the Seismic Performance of Cast-in-Place Normal Concrete and Ultrahigh-Performance Concrete Bridge Piers", "url": "https://doi.org/10.1061/jbenf2.beeng-8228", "authors": "Mahesh Acharya ほか", "venue": "Journal of Bridge Engineering", "date": "2026-11-12", "citescore": 7.2, "citescore_year": "2025", "apa": "Acharya, M., Bedriñana, L. A., Portillo, H. M., & Mashal, M. (2027). Experimental Evaluation of the Influence of Titanium Alloy Bars on the Seismic Performance of Cast-in-Place Normal Concrete and Ultrahigh-Performance Concrete Bridge Piers. Journal of Bridge Engineering, 32(1). https://doi.org/10.1061/jbenf2.beeng-8228", "why": "腐食に強いチタン合金の鉄筋と超高性能コンクリート（UHPC）を使った橋脚の耐震性能を、大型試験体4体の繰り返し載荷で比べた。チタン合金筋は普通コンクリート・UHPCのどちらでも残留変形を大きく減らし、UHPCは基部のひび割れと損傷を抑えた。両者を組み合わせた試験体は強度と変形能が最も大きく、破壊時の塑性率は15を超えたが、減衰は鋼材の試験体より小さかった。"}, {"id": "jn14", "rank": 14, "field": "工学", "headline": "PC箱桁の有効ウェブ幅の特例はせん断耐力にほぼ無影響", "title": "Shear Resistance of Cast-in-Place Post-Tensioned Bridge Girders", "url": "https://doi.org/10.1061/jbenf2.beeng-8406", "authors": "Zhelun Zhang ほか", "venue": "Journal of Bridge Engineering", "date": "2026-11-12", "citescore": 7.2, "citescore_year": "2025", "apa": "Zhang, Z., Aljasar, A., Bolander, J. E., & Kunnath, S. (2027). Shear Resistance of Cast-in-Place Post-Tensioned Bridge Girders. Journal of Bridge Engineering, 32(1). https://doi.org/10.1061/jbenf2.beeng-8406", "why": "カリフォルニア州交通局は、グラウト充填ダクトを持つポストテンション箱桁橋の設計で、せん断耐力の計算に使う有効ウェブ幅とダクトの束ね配置についてAASHTO規定からの逸脱を認めている。実物に近い断面の桁を破壊まで載荷して検証し、修正した有効ウェブ幅による公称せん断強度の予測の変化は5%未満で、ダクトの健全性にも悪影響はないと報告する。"}, {"id": "jn15", "rank": 15, "field": "情報システム", "headline": "ダッシュボードという形式がデータの見え方を決める", "title": "Consider the Dashboard: Exploring a visual medium of datafication", "url": "https://doi.org/10.1177/01708406261508704", "authors": "Felix Diefenhardt", "venue": "Organization Studies", "date": "2026-11-12", "sjr": 4.358, "citescore": 11.4, "citescore_year": "2025", "apa": "Diefenhardt, F. (2026). Consider the Dashboard: Exploring a visual medium of datafication. Organization Studies. https://doi.org/10.1177/01708406261508704", "why": "組織の意思決定をデータ化するうえで中心的な媒体であるダッシュボードについて、媒介と図式の理論を使い、すべてのダッシュボードに共通する「汎用の形式」と、それが観察者に促す見方を分析した。人的資源管理のデータ化の事例を交え、視覚的な形式がデータ化の過程で果たす役割と、その組織的な含意を論じる。"}, {"id": "jn16", "rank": 16, "field": "組織行動・心理的安全性", "headline": "成長型の個別配慮が従業員のサービス創造性を高める", "title": "Promotion focus, growth i-deals and service creativity: a regulatory focus perspective", "url": "https://doi.org/10.1108/ijchm-02-2026-0236", "authors": "Lingyi Wang ほか", "venue": "International Journal of Contemporary Hospitality Management", "date": "2026-11-12", "sjr": 3.116, "citescore": 22.1, "citescore_year": "2025", "apa": "Wang, L., Sun, L.-Y., Park, S. H., & Pan, W. (2026). Promotion focus, growth i-deals and service creativity: a regulatory focus perspective. International Journal of Contemporary Hospitality Management, 1–20. https://doi.org/10.1108/ijchm-02-2026-0236", "why": "中国のホテルと商業施設の100チーム・第一線従業員600人から多時点・多情報源のデータを集め、促進焦点が成長型の個別配慮（growth i-deals）と正に関連し、それが創造的自己効力感・内発的動機・参加機会の知覚を高めてサービス創造性につながることを、マルチレベルのパス解析で調べた。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "従業員が自分の成長のために会社と個別に取り決める「成長型の個別配慮」（growth i-deals）が、どんな人に生まれ、どのようにサービスの創造性につながるかを明らかにした（抄録）。", "p3": "制御焦点理論と能力・動機・機会（AMO）モデルにもとづき、中国のホテルと商業施設の100チーム・第一線従業員600人から多時点・多情報源・多階層のデータを集め、マルチレベルのパス解析と20,000回のモンテカルロ・シミュレーションで調整媒介モデルを検定した（抄録）。", "p5": "促進焦点は成長型の個別配慮と正に関連し、それが創造的自己効力感、内発的動機、参加機会の知覚を高めてサービスの創造性を促した。チームのサーバント・リーダーシップが高いと、この主効果と間接効果が強まった（抄録）。", "fun": "自分の成長につながる働き方を、会社と個別に取り決める人がいる。そうした約束を取りつけやすいのは、成長や達成を求める気持ちの強い人だった。そして約束を得た人は、自信とやる気と参加の機会が増え、接客で新しい工夫をするようになった。部下を支える型のリーダーのいるチームでは、この流れが強まった。一人ひとりへの配慮が創造性の入口になる、という結果である。", "unverified": "抄録の末尾が切れており、実務への含意の後半は未確認。本文を読めていないため、係数の大きさは未確認。"}}, {"id": "jn17", "rank": 17, "field": "経済学", "headline": "結婚前の女性の就業と出生間隔・出産の打ち切り", "title": "Whether and when: Women's work, birth spacing, and parity progression in late‐nineteenth‐century Derbyshire", "url": "https://doi.org/10.1111/ehr.70166", "authors": "Emma Diduch", "venue": "Economic History Review", "date": "2026-11-12", "sjr": 1.004, "citescore": 3.6, "citescore_year": "2025", "apa": "Diduch, E. (2026). Whether and when: Women’s work, birth spacing, and parity progression in late‐nineteenth‐century Derbyshire. The Economic History Review. https://doi.org/10.1111/ehr.70166", "why": "19世紀後半の英ダービーシャーについて、連結した国勢調査記録と1911年国勢調査の出生力調査から1880年代以降に結婚した女性の完全な出生歴を復元し、出産をやめる行動と間隔をあける行動を分けて推定できる治癒モデル（split-population cure model）で分析した。結婚前の女性の職業とその後の夫婦出生力の関連を示し、夫婦が結婚当初から出生を制御していたことを示唆する。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "19世紀後半の英国ダービーシャーで、結婚前に女性が就いていた職業が、結婚後に子どもを「産むのをやめる」ことと「間隔をあける」ことにどう関係したかを、復元した出生歴から明らかにした（抄録）。", "p3": "連結した国勢調査の記録と1911年国勢調査の出生力調査を組み合わせ、1880年代以降に結婚した女性の完全な出生歴を復元した。産み終えと間隔あけを分けて推定できる分割母集団の治癒モデル（split-population cure model）で分析した（抄録）。", "p5": "この時期の夫婦は、結婚の初めから産み終えと間隔あけを組み合わせて出生を調整していた。繊維産業で働いていた女性の出生力の低さには、他のいくつかの職業集団に比べて、出産の間隔をあけることがより大きな役割を果たしていた（抄録）。", "fun": "子どもの数が減るとき、人々は「ある人数で産むのをやめる」のか、「次の子までの間をあける」のか。この二つは結果が似ていても、行動としては別物である。百年以上前の記録をつなぎ合わせて一人ひとりの出産の歴史を作り直すと、繊維の仕事をしていた女性では、間隔をあけることの役割が大きかった。働くことと子どもを持つことの調整は、昔からあったことが分かる。", "unverified": "本文を読めていないため、標本の規模、職業の分類、効果の大きさは未確認。関連の分析で、因果は確定しない。"}}, {"id": "jn18", "rank": 18, "field": "機械学習", "headline": "吸収スペクトルから原子の立体配置を拡散モデルで生成", "title": "Generative inverse estimation of 3D atomic coordination from near-edge spectra via equivariant diffusion models", "url": "https://doi.org/10.1038/s41524-026-02384-4", "authors": "Ren Okubo ほか", "venue": "npj Computational Materials", "date": "2026-11-12", "sjr": 2.943, "citescore": 17.4, "citescore_year": "2025", "apa": "Okubo, R., Fujikata, Y., Takahara, I., & Mizoguchi, T. (2026). Generative inverse estimation of 3D atomic coordination from near-edge spectra via equivariant diffusion models. Npj Computational Materials. https://doi.org/10.1038/s41524-026-02384-4", "why": "吸収端近傍のスペクトル（ELNES/XANES）から、原子サイトごとの3次元構造の分布を直接生成する同変拡散モデル。Si–O結晶で学習し、結合距離の平均絶対誤差は約0.04 ÅでEXAFSと同等、配位数の誤差は2.0%未満（EXAFSは約20%）で、結合角を含む立体構造を再構成する。結晶だけで学習しても非晶質へ組成に応じて転用でき、石英などの実験スペクトルにも適用した。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "吸収端近傍のスペクトルから、原子のまわりの3次元の配置を直接生成する拡散モデルを作った（抄録）。", "p3": "同変の拡散モデルで、スペクトル（ELNES/XANES）から原子サイトごとの3次元構造の分布を生成する。Si–O結晶で学習した（抄録）。背景：拡散モデルは雑音から少しずつ構造を作り出す生成モデルで、同変とは回転などの操作に対して出力が整合的に変わる性質。", "p5": "結合距離の平均絶対誤差は約0.04 Åで広域X線吸収微細構造（EXAFS）と同等、配位数の誤差は2.0%未満でEXAFSの約20%より良かった。結合角を含む立体構造を再構成でき、結晶だけで学習しても非晶質に組成に応じて転用できた。石英などの実験スペクトルにも適用した（抄録）。", "fun": "物質の吸収スペクトルには、原子のまわりに他の原子がどう並んでいるかの手がかりが含まれている。ただしそこから立体的な配置を逆算するのは、長年の難問だった。従来は、あらかじめ用意した参照の構造と照らし合わせていた。この研究は、AIにスペクトルから候補の立体構造を作り出させる。用意した見本の中から選ぶのではなく、学んだ構造の空間を探索できる点が新しい。", "unverified": "本文を読めていないため、学習データの規模、非晶質での精度の数値、実験スペクトルでの定量的な評価は未確認。"}}, {"id": "jn19", "rank": 19, "field": "経営学", "headline": "大規模な交流最適潮流つき起動停止計画を分解で解く", "title": "Alternating Methods for Large-Scale AC Optimal Power Flow with Unit Commitment", "url": "https://doi.org/10.1287/opre.2025.1935", "authors": "Matthew Brun ほか", "venue": "Operations Research", "date": "2026-11-12", "sjr": 3.759, "citescore": 6.4, "citescore_year": "2025", "apa": "Brun, M., Lee, T., Lauinger, D., Chen, X., & Sun, X. A. (2026). Alternating Methods for Large-Scale AC Optimal Power Flow with Unit Commitment. Operations Research. https://doi.org/10.1287/opre.2025.1935", "why": "発電機の起動停止と出力配分を、物理的に正確な交流送電モデルと機器故障への頑健性のもとで最適化する問題（SCUC-ACOPF）を扱う。価格に反応する需要、予備力、変圧器制御、エネルギー量に制約のある機器を含む詳細なモデルに対し、母線ごとの混合整数線形計画と時間帯ごとの連続非線形計画に分ける空間・時間分解と、罰則つき交互方向法で質の高い解を求める方法を示した。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "発電機の起動停止と出力配分を、交流の送電の物理を正確に表したまま、数千の母線を持つ大規模な系統について制限時間内に解く方法を提案した（抄録）。", "p3": "価格に反応する需要、予備力、変圧器の制御、エネルギー量に制約のある機器を含む詳細なモデルを扱う。問題を、母線ごとの混合整数線形計画と時間帯ごとの連続非線形計画に分ける空間・時間分解と、罰則つきの交互方向法で解く。二次錐計画による双対限界で解の質を測る（抄録）。", "p5": "米国エネルギー省の系統最適化コンペティションの大規模な試験事例で、平均の最適性ギャップ1.33%の実行可能解を得た。厳しい制限時間内に最適に近い解を出せることを示した（抄録）。", "fun": "どの発電機をいつ動かし、どれだけ発電させるかは、送電網の運用の中心的な問題である。電気の流れは物理法則に従い、発電機の「動かす・止める」は二択なので、性質の違う難しさが混ざる。この研究は、巨大な問題を、場所ごとの小さな問題と時間ごとの小さな問題に分けて交互に解く。分けて解いて合わせる工夫で、最適に近い答えを時間内に出した。", "unverified": "本文を読めていないため、問題の規模の詳細、計算時間、他手法との比較は未確認。"}}, {"id": "jn20", "rank": 20, "field": "計算社会科学・ネットワーク科学", "headline": "AI生成物があふれると質を見分ける手がかりが失われる", "title": "The social and cultural life of artificial intelligence (AI) slop: A research framework", "url": "https://doi.org/10.1177/20539517261506941", "authors": "Richard Jean So ほか", "venue": "Big Data and Society", "date": "2026-11-12", "sjr": 2.026, "citescore": 9.7, "citescore_year": "2025", "apa": "So, R. J., & Long, H. (2026). The social and cultural life of artificial intelligence (AI) slop: A research framework. Big Data & Society, 13(4). https://doi.org/10.1177/20539517261506941", "why": "AI生成コンテンツを検出して除く対象とみなす対応では不十分だとして、SLOPという分析概念を提案する。これは個々の生成物ではなく、AI生成コンテンツが量と見かけの完成度で一定の水準に達し、質の判断に使われてきた手がかりが当てにならなくなった情報生態系の状態を指す。生成物の価値と害は、誰が作り誰がどんな動機で関わるかという社会的文脈から生じると論じる研究枠組み。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "AIが生成したコンテンツがあふれる状況を、個々の生成物の問題ではなく情報生態系の「状態」として捉える分析概念SLOPを提案し、研究の枠組みを示した（抄録）。", "p3": "検出して取り除く対象とみなす対応は不十分だと論じ、スパム研究、誤情報研究、検出技術の研究の知見と限界を整理する。プラットフォーム研究と文化社会学にもとづき、SLOPを生産、受容、効果の3つの次元で特徴づけた（抄録）。", "p5": "SLOPとは、AI生成コンテンツが量と見かけの完成度で一定の水準に達し、質の判断に使われてきた手がかりが当てにならなくなった状態を指す。不足しているのはコンテンツではなく、それを判断する手段である。生産の民族誌、受容の研究、制度への効果と統治の分析という研究課題を提案する（抄録）。", "fun": "AIが作ったコンテンツは「汚染」のように扱われ、見つけて取り除くべきものとされがちだ。この論文は見方を変える。問題は一つ一つの作品ではなく、質を見分ける昔ながらの目印が使えなくなった状態そのものだという。しかもAIの作品は、迷惑メールと違って進んで求める人がおり、うそとも限らない。足りないのは中身ではなく見分ける手段だ、という指摘が鋭い。", "unverified": "概念的な枠組みの提案で、実証の結果は抄録に記載がない。本文は読めていない。"}}, {"id": "jn21", "rank": 21, "field": "機械学習", "headline": "LLMのフィードバック研究用に課題・採点基準の合成データ", "title": "Open Synthetic University Assignment Rubric and Submission Dataset for LLM Educational Feedback Research", "url": "https://doi.org/10.1038/s41597-026-08569-2", "authors": "Keyang Qian ほか", "venue": "Scientific Data", "date": "2026-11-12", "sjr": 1.907, "citescore": 9.6, "citescore_year": "2025", "apa": "Qian, K., Yang, K., Dai, W., Jin, F., Cheng, Y., Guan, R., Nawaz, S., Swiecki, Z., Chen, G., Yan, L., & Gašević, D. (2026). Open Synthetic University Assignment Rubric and Submission Dataset for LLM Educational Feedback Research. Scientific Data. https://doi.org/10.1038/s41597-026-08569-2", "why": "LLMによる学生の課題へのフィードバックを研究するための、大学の計算機科学の課題・採点基準・提出物をそろえた大規模な合成データセット（SCALEFeedback）。実在の課題の記述をLLMが1対1で模倣して教育資料を合成する枠組みで作られ、課題の詳細・採点基準・提出物を含む公開データの不足を補う（Scientific Data）。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "LLMによる課題へのフィードバックを研究するための、大学の計算機科学の課題・採点基準・提出物をそろえた大規模な合成データセットSCALEFeedbackを公開した（抄録）。", "p3": "実在の課題の記述、採点基準、学生の提出物を、LLMが1対1で模倣して教育資料を合成する枠組み（SAM）で生成した。学生のプライバシーと知的財産のリスクを抑えることをねらう（抄録）。", "p5": "59の大学水準の計算機科学の科目、155の課題にわたる合成の提出物10,000件を含む。技術的な検証で、合成データは元データの言語的な特徴と得点の分布をよく近似し、自動検証のもとで個人識別子の直接の漏れを防いでいた（抄録）。", "fun": "学生の課題にAIがどんな助言を返せるかを研究したくても、本物の課題や答案はプライバシーや知的財産の問題があって公開しにくい。そこでこの研究は、本物を一つずつAIにまねさせて、似ているが別物の課題と答案を大量に作った。文章の特徴も点数の分布も本物に近い。公開できない本物の代わりに、安全な合成データを共有するという発想が面白い。", "unverified": "抄録の末尾が切れており、結びの記述は未確認。本文を読めていないため、検証に使った指標の数値は未確認。"}}, {"id": "jn22", "rank": 22, "field": "情報システム", "headline": "農業のグリーンCSRは供給網とデジタル能力を介して成果へ", "title": "From green commitment to sustainable harvest: how digital capabilities and institutional pressure power agricultural sustainability", "url": "https://doi.org/10.1108/jeim-08-2026-1536", "authors": "Ahmad Zaeem Faraz ほか", "venue": "Journal of Enterprise Information Management", "date": "2026-11-12", "sjr": 1.665, "citescore": 19.6, "citescore_year": "2025", "apa": "Faraz, A. Z., Sarfraz, M., Fatima, N., & Abdullah, M. I. (2026). From green commitment to sustainable harvest: how digital capabilities and institutional pressure power agricultural sustainability. Journal of Enterprise Information Management, 1–31. https://doi.org/10.1108/jeim-08-2026-1536", "why": "パキスタン4州30地区の農家と農業関連企業の管理者420人の横断調査で、グリーンCSRの統合が持続可能な農業経営の成果につながる経路をPLS-SEMで調べた。グリーン供給網の動的能力、持続可能な農業イノベーション、デジタル技術能力の3つを並列の媒介とし、強制的な制度的圧力の調整効果を検討している。横断の質問紙調査である。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "気候変動の影響を受けやすい新興国の農業で、環境に配慮した社会的責任の取り組みが経営の持続可能性に結びつくのは、それが組織の能力に変換されたときだと示した（抄録）。", "p3": "パキスタン4州30地区の農家と農業関連企業の管理者420人の横断調査を、PLS-SEM（ブートストラップ10,000回）で分析した。グリーン供給網の動的能力、持続可能な農業イノベーション、デジタル技術能力を並列の媒介とし、強制的な制度的圧力の調整効果を調べた（抄録）。", "p5": "取り組みの効果の大半は能力の構築を通じて伝わり、間接効果はデジタル技術能力が最大だった。強制的な制度的圧力は3つの能力への変換を強めたが、3つの調整効果の大きさに統計的な差はなかった（抄録）。", "fun": "環境に配慮した経営を掲げるだけで、農場の成績が良くなるわけではない。この調査では、取り組みが効果を生む道の大部分は、デジタル技術を使いこなす力や、供給網を環境に合わせて組み替える力といった「できること」を増やす経路を通っていた。中でもデジタルの力を通る道が一番太かった。約束を能力に変えて初めて成果になる、という結果である。", "unverified": "抄録の末尾が切れており、結論の後半は未確認。目的に合わせて選んだ標本の横断調査で、因果は分からない。本文は読めていない。"}}, {"id": "jn23", "rank": 23, "field": "工学", "headline": "不釣合いとき裂のある回転軸の故障と支持特性を同時同定", "title": "Novel Modelling and Full Spectrum Analysis for Robust Fault Identification in an Unbalanced and Cracked Rotor System Supported by Viscoelastic Foil Bearings", "url": "https://doi.org/10.1142/s0219455428500770", "authors": "Gopal Kumar ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-12", "citescore": 6.5, "citescore_year": "2025", "apa": "Kumar, G., & Kumar, P. (2026). Novel Modelling and Full Spectrum Analysis for Robust Fault Identification in an Unbalanced and Cracked Rotor System Supported by Viscoelastic Foil Bearings. International Journal of Structural Stability and Dynamics. https://doi.org/10.1142/s0219455428500770", "why": "粘弾性フォイル軸受で支えた剛体ロータについて、不釣合い加振・ジャイロ効果・開閉するき裂を含むモデルを作り、時間領域の振動応答を周波数領域に変換する全スペクトル解析で、故障の検出と軸受の剛性・減衰の推定を同時に行う枠組みを提案した。雑音を加えた信号とモデル化誤差を入れた場合も検討している。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "粘弾性フォイル軸受で支えた高速回転軸について、不釣合いとき裂という2つの故障の検出と、軸受の剛性・減衰の推定を同時に行う同定の枠組みを提案した（抄録）。", "p3": "偏心した円板を持つ剛体ロータのモデルに、不釣合いによる加振、ジャイロ効果、開閉するき裂の仕組みを組み込む。時間領域の振動応答を周波数領域に変換する全スペクトル解析で特徴を取り出し、雑音とモデル化誤差を加えた場合も調べた（抄録）。", "p5": "不釣合いの影響は高い回転数で支配的になり、き裂による高調波は低い回転数で目立った。粘弾性の層は起動・停止時の過渡振動を抑えた。き裂の特徴は、雑音があっても応答の変調と8の字形の軌道として現れ、軸受の剛性と減衰の推定は雑音のもとでも一貫していた（抄録）。", "fun": "回っている軸の調子が悪いとき、原因が「重さの片寄り」なのか「ひび」なのかを見分けたい。この研究によると、片寄りは速く回すほど目立ち、ひびはゆっくり回すときに目立つ。ひびがあると、軸の中心が描く軌道が8の字の形になるという。揺れの波形を周波数の成分に分けて見ることで、二つの故障のそれぞれの特徴を区別している。", "unverified": "抄録の末尾が切れており、新規性の記述の後半は未確認。実験による検証の有無は未確認。本文は読めていない。"}}, {"id": "jn24", "rank": 24, "field": "工学", "headline": "鉄筋の引抜き試験99体で付着強度の過小評価を指摘", "title": "Experimental Study on Bond-slip Behavior of Rebar Anchored in Concrete", "url": "https://doi.org/10.1142/s0219455427420028", "authors": "Yi Zhu ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-12", "citescore": 6.5, "citescore_year": "2025", "apa": "Zhu, Y., Tan, M., Xu, J., & Chen, W. (2026). Experimental Study on Bond-slip Behavior of Rebar Anchored in Concrete. International Journal of Structural Stability and Dynamics. https://doi.org/10.1142/s0219455427420028", "why": "鉄筋とコンクリートの付着すべりは、柱端や柱梁接合部の剛性低下を通じて鉄筋コンクリート構造の動的挙動を左右する。載荷の偏心・局所拘束・回転による測定誤差を減らす新しい試験装置で、コンクリート強度・鉄筋径・定着長を変えた99体の引抜き試験を行い、破壊形式と付着強度を整理した。広く使われる付着強度式は実際の強度を大きく過小評価すると報告する。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "コンクリートに定着した鉄筋の付着すべりを、測定誤差を減らす新しい試験装置で調べ、広く使われる付着強度の式が実際の強度を大きく過小評価していることを示した（抄録）。", "p3": "載荷の偏心、局所的な拘束、回転による測定誤差を減らす引抜き試験の装置を設計し、コンクリート強度、鉄筋径、定着長を変えた4群・99体の引抜き試験を行って、破壊形式と付着強度を調べた（抄録）。", "p5": "破壊形式は、コンクリートの円錐状の破壊、割裂を伴う引抜き、ひび割れ、割裂に分かれた。広く受け入れられている式は、鉄筋径と定着の縦横比の影響を無視しているため、実際の付着強度を大きく過小評価していた（抄録）。", "fun": "鉄筋コンクリートは、鉄の棒とコンクリートがしっかり付着していることで成り立つ。その付着の強さは、鉄筋を引っぱって調べる。ところが引っぱり方がずれたり、周りを拘束しすぎたりすると、正しく測れない。この研究は、測り方そのものを見直した装置を作り、99体の試験を行った。すると広く使われている式より実際の強さのほうが大きかった。", "unverified": "本文を読めていないため、過小評価の程度の数値、試験体の寸法、提案する修正式の有無は未確認。"}}, {"id": "jn25", "rank": 25, "field": "工学", "headline": "回転する多孔質の傾斜機能円板の組合せ共振を解析", "title": "Nonlinear combination resonance of rotating functionally graded circular plates with pores in the temperature field", "url": "https://doi.org/10.1142/s0219455428500812", "authors": "Manman Dong ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-12", "citescore": 6.5, "citescore_year": "2025", "apa": "Dong, M., Hu, Y., & Liao, F. (2026). Nonlinear combination resonance of rotating functionally graded circular plates with pores in the temperature field. International Journal of Structural Stability and Dynamics. https://doi.org/10.1142/s0219455428500812", "why": "温度場の中で回転する、空孔を含む傾斜機能材料の円板について、パラメータ共振と主共振が組み合わさる非線形振動を調べた。幾何学的非線形を考慮してハミルトンの原理から支配方程式を導き、ガラーキン法と多重尺度法で振幅-周波数の関係を得て、リアプノフの安定論で定常解の安定判別条件を示した。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "温度場の中で回転する、空孔を含む傾斜機能材料の円板について、パラメータ共振と主共振が組み合わさる非線形振動の振幅と安定性を解析した（抄録）。", "p3": "空孔の分布の型ごとの物性を修正した混合べき乗則で与え、幾何学的非線形にもとづいて運動エネルギーとポテンシャルエネルギーを導く。ハミルトンの原理で支配方程式を立て、ガラーキン法と多重尺度法で振幅と周波数の関係式を得て、リアプノフの安定論で定常解の安定判別条件を示した（抄録）。", "p5": "系は、回転速度に比べて温度と横方向の調和加振の影響を強く受けた。温度場と回転運動の間には熱弾性の連成があり、パラメータを変えると分岐点に対応する周波数と振幅が変わった（抄録）。", "fun": "材料の性質が場所によって少しずつ変わる板を、温度のある環境で回転させる。回転と温度の両方が、板の横方向の揺れに影響する。この研究は、揺れが急に大きくなる条件を数式で調べ、回転の速さよりも温度と横からの加振の影響のほうが大きいことを示した。熱と回転と揺れが絡み合う問題を、一つの式にまとめて調べている。", "unverified": "本文を読めていないため、板の寸法と材料、数値例の具体的な値、実験との比較の有無は未確認。"}}, {"id": "jn26", "rank": 26, "field": "工学", "headline": "孔のある微細構造板で熱弾性波の分散を解析", "title": "Non-classical thermoelastic wave dispersion in microstructured plates: A structural dynamics approach based on couple-stress theory", "url": "https://doi.org/10.1142/s0219455428500769", "authors": "Hamza Abu Owida ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-12", "citescore": 6.5, "citescore_year": "2025", "apa": "Abu Owida, H., Mohammad, S. I., Vasudevan, A., Mohammad, A. A. S., Rajan, S. R. S., Ahmed, A., Yaylaci, M., & Alashker, Y. (2026). Non-classical thermoelastic wave dispersion in microstructured plates: A structural dynamics approach based on couple-stress theory. International Journal of Structural Stability and Dynamics. https://doi.org/10.1142/s0219455428500769", "why": "中央に長方形の孔を持つ微細構造の板を伝わる熱弾性波の分散を、固有の長さ尺度を持つ偶応力の熱弾性理論で調べた。孔の上・横・下の3領域に分けてフーリエ級数と指数関数を接続し、対称・反対称のレイリー・ラム波の特性方程式を導いた。孔の幅と高さを増やすと両方の波の位相速度が下がると報告する。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": false, "short": true, "p1": "中央に長方形の孔を持つ微細構造の板を伝わる熱弾性波について、材料の内部の長さ尺度を考慮した理論で、波の速さが周波数によってどう変わるか（分散）を解析した（抄録）。", "p3": "固有の長さ尺度のパラメータを持つ偶応力の熱弾性理論を使う。領域を孔の上・横・下の3つに分け、孔のある領域のフーリエ級数展開を他の領域の指数関数と接続して境界条件を満たす。対称・反対称のレイリー・ラム波について、断熱と等温の境界条件で特性方程式を導いた（抄録）。", "p5": "孔の幅と高さを増やすと、対称波と反対称波の位相速度がともに下がった。位相速度は特性長さの比の影響で上がり、反対称モードでは熱との連成で下がった。断熱の境界のほうが等温の境界より速度が高かった（抄録）。", "fun": "板を伝わる波は、孔が大きいほど遅くなる。面白いのは、材料の内部の細かい構造の大きさを表す長さを理論に入れると、波の速さが変わる点である。この研究は、その「大きさの効果」と、波が伝わるときの熱とのやり取りまで含めて計算した。孔の形、材料の細かさ、熱の境界の条件が、波の速さをそれぞれ違う向きに変える。", "unverified": "抄録の末尾が切れており、群速度と極限の場合の記述は未確認。本文を読めていないため、数値例の値は未確認。実験との比較の有無は未確認。"}}, {"id": "jn27", "rank": 27, "field": "工学", "headline": "回転する窒化ホウ素ナノチューブの振動と安定性", "title": "Voltage-driven transverse vibration and dynamic stability of a spinning SWBNNT partially embedded in an elastic foundation", "url": "https://doi.org/10.1142/s0219455428500794", "authors": "Merwan Behar", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-12", "citescore": 6.5, "citescore_year": "2025", "apa": "Behar, M. (2026). Voltage-driven transverse vibration and dynamic stability of a spinning SWBNNT partially embedded in an elastic foundation. International Journal of Structural Stability and Dynamics. https://doi.org/10.1142/s0219455428500794", "why": "炭素ナノチューブの固定子に囲まれて回転する単層窒化ホウ素ナノチューブ（ナノモータの回転子）の横振動と動的安定性を調べた。固定子の拘束を弾性基礎として表し、回転子を非局所ひずみ勾配理論を組み込んだティモシェンコ梁で定式化して、ジャイロ効果・回転慣性・せん断変形・逆圧電効果を含む運動方程式をハミルトンの原理から導き、ガラーキン法で解いた。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "炭素ナノチューブの固定子の中で回転する窒化ホウ素ナノチューブ（ナノモータの回転子）の、電圧で駆動される横振動と動的安定性を理論的に調べた（抄録）。", "p3": "固定子による拘束を弾性基礎として表し、回転子を、非局所ひずみ勾配理論を組み込んだティモシェンコ梁として定式化した。ジャイロ効果、回転慣性、せん断変形、逆圧電効果を含む運動方程式をハミルトンの原理から導き、ガラーキン法で解いた（抄録）。", "p5": "小さな尺度のパラメータ、弾性基礎、境界条件、外部の電圧が、ナノモータの動的安定性とふれ回りの振動数に与える影響をパラメータ解析で評価した。具体的な数値は抄録に記載がない（抄録）。", "fun": "ナノチューブという極めて細い筒を軸にした、目に見えない小さなモータを考える。これほど小さいと、ふつうの梁の理論に、小ささに由来する効果を加えなければならない。この研究は、そうした効果と、電圧をかけると変形する性質を合わせて、回る筒の揺れ方と安定性を調べた。機械の振動の理論を、ナノの世界にまで広げる試みである。", "unverified": "本文を読めていないため、数値結果とモデルの妥当性の確認方法は未確認。理論解析である。"}}, {"id": "jn28", "rank": 28, "field": "組織行動・心理的安全性", "headline": "雇用不安の引き金を潜在移行分析で探る", "title": "Triggers of job insecurity: a latent transition approach to understanding how people construe threats to their jobs", "url": "https://doi.org/10.1007/s10869-026-10162-8", "authors": "Mindy K. Shoss ほか", "venue": "Journal of Business and Psychology", "date": "2026-11-12", "sjr": 2.563, "citescore": 10.6, "citescore_year": "2025", "apa": "Shoss, M. K., Su, S., & Carusone, N. (2026). Triggers of job insecurity: a latent transition approach to understanding how people construe threats to their jobs. Journal of Business and Psychology. https://doi.org/10.1007/s10869-026-10162-8", "why": "題名から、人々が自分の職への脅威をどう受け止めるかを、潜在移行分析（時点間で潜在クラスの移り変わりを推定する方法）で調べた研究（Journal of Business and Psychology）。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名と掲載誌の情報だけを使用", "preprint": false, "short": true, "p1": "題名によれば、人々が自分の職への脅威をどう捉えるか（雇用不安の引き金）を、潜在移行分析で調べた研究である（題名）。背景：潜在移行分析は、観測されない類型への所属が時点間でどう移り変わるかを推定する方法。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "「仕事を失うかもしれない」という不安は、何をきっかけに生まれるのだろうか。題名は、人によって脅威の受け止め方に型があり、その型が時間とともに移り変わる、という見方で調べたことを示している。同じ出来事でも、ある人には脅威で、別の人にはそうでないかもしれない。その違いと変化を捉えようとする問いが面白い。", "unverified": "抄録・本文を入手できず、標本、測定した項目、見いだされた類型と移行の結果はすべて未確認。"}}, {"id": "jn29", "rank": 29, "field": "組織行動・心理的安全性", "headline": "職場のマインドフルネス研修の負の側面", "title": "The Dark Side of Mindfulness at Work: How Mindfulness Training Enlivens Machiavellian Inci
