<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">

<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.ask {
  align-self: flex-start; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 12px; padding: 10px 14px; font-size: 15px; font-weight: 700;
}
.askrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ask.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding: 12px 20px; font-size: 16px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 20;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 720px; background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); display: grid; gap: 10px;
  max-height: 100vh; max-height: 100dvh; overflow-y: auto; overscroll-behavior: contain;
}
.sheet h2 { margin: 0; font-size: 18px; }
.sheet p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
.sheet .btn { width: 100%; }
.sheet textarea {
  width: 100%; height: 38vh; font: 13px/1.6 var(--font); border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); padding: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">AIに聞く</h2>
    <p id="sheet-paper"></p>
    <button class="btn primary share" id="share-full" type="button">節ごとに詳しく聞く</button>
    <button class="btn share" id="share-brief" type="button">要点だけ聞く</button>
    <p id="sheet-note"></p>
    <button class="btn" id="copy-full" type="button">依頼文をコピー（節ごとに詳しく）</button>
    <button class="btn" id="copy-brief" type="button">依頼文をコピー（要点だけ）</button>
    <p id="sheet-status" aria-live="polite"></p>
    <textarea id="sheet-text" readonly hidden aria-label="依頼文"></textarea>
    <button class="btn" id="sheet-close" type="button">閉じる</button>
  </div>
</div>

<script id="report-data" type="application/json">{"date": "2026-09-30", "intro": "プレプリントの新着のうち研究テーマに関連する候補285件、学術誌の新着（上位10%誌3,535件のうち関連1,268件から300件、その他の学術誌150件）、注目分野の候補（プレプリント238件、論文誌154件）から選びました。注目分野は、組織行動・心理的安全性、経済学、経営学、統計学、機械学習、因果推論の6分野と、今日のおすすめ分野（情報システム、ヒューマンコンピュータインタラクション）です。プレプリント・関連50報、プレプリント・注目50報、論文誌・関連50報、論文誌・注目50報です。論文誌・関連の橋梁分野は、学会論文集（Procedia Structural Integrity）の抄録のない論文が多く、題名からの判断を含みます。組織行動・心理的安全性はプレプリントに方法のしっかりした候補が少なく2報、因果推論は論文誌の候補が1報にとどまりました。論文誌・注目は注目誌の新着が少なかったため、上位10%誌の新着から注目分野に当たる論文で補っています。各部の上位15報は詳しい解説、16位以下は抄録をもとにした短い解説です。あわせて、DataCiteに直近3日で登録された公開データセット・研究コードと、e-Statで新しく公表された令和7年国勢調査の集計から30件を「データ」タブに載せています。", "pre_related": [{"rank": 1, "theme": "VBI・橋梁SHM", "headline": "移動センサでハミルトン系を構造保存的に推定", "title": "Symplectic filtering of Hamiltonian dynamics with moving sensors", "url": "https://arxiv.org/abs/2609.35647", "authors": "Olga Mula ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr01", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、フィルタの構成、センサ配置の節、数値実験、結論と図のキャプション）を読んだ。定理の証明（付録A）は読んでいない", "preprint": true, "p1": "ハミルトン系（エネルギーを保つ力学系）に従う場の状態を、少数の移動するセンサの計測から逐次に再構成するフィルタを作り、再構成がシンプレクティック（位相空間の面積を保つ構造）な空間に留まり、エネルギーが近似誤差の範囲で保たれることを示した（抄録、§8）。", "p2": "順方向の数値計算では構造保存型の解法が確立しているが、データ同化・フィルタリング側では精度保証のある構造保存の方法が乏しかった（抄録）。さらに近似空間が時間とともに動くと、固定したセンサでは観測空間とのなす角が悪化し、再構成が不安定になる（§1.3、§6）。", "p3": "入力はm個の線形観測の履歴、出力は各時刻の状態の推定。状態そのものではなく速度（時間微分）を観測から近似して時間積分し（§1.2、補題1）、低次元のシンプレクティックな近似空間をPDEと観測に従って時間発展させる（§3〜4）。誤差は「安定定数β×最良近似誤差」で抑えられ（§5）、βは近似空間と観測空間の角度で決まるので、センサ位置をβが最大になるよう勾配法で毎時刻動かす（§6、アルゴリズム1）。", "p4": "2次元の浅水方程式（ハミルトン形式、パラメータ2個）で、真のパラメータを未知として8個のセンサで再構成し、①ランダムに固定、②格子状に固定、③移動の3条件を比べた（§7）。指標は相対再構成誤差、最良近似誤差との差、ハミルトニアンの保存誤差、安定定数βである（式45〜47）。", "p5": "固定センサ（ランダム）ではβが最終時刻に約10⁻⁵まで落ち、水位の振幅を捉えられなかった（図1〜2）。格子状の固定ではβが大半の時間で10⁻³未満、相対誤差は1%超、エネルギー誤差は最大1程度に達した（図5〜6）。移動センサではβが10⁻²以上を保ち、再構成誤差は最良近似誤差に近く最終時刻で約10⁻⁴（固定より約2桁小さい）、エネルギー誤差は終盤まで10⁻³未満だった（図8、図10）。", "p6": "著者は、パラメータ推定（パラメータ空間上の分布の更新）の組み込みと非線形な観測演算子への拡張を今後の課題とする（§8）。解釈：検証は1つの数値例（浅水方程式）のみで、雑音のある実測や、センサを自由に動かせない場合（決まった経路を走る計測など）での性能は示されていない。未査読のプレプリントである。", "fun": "振り子や波のように「エネルギーが保たれる」動きは、計算で追いかけると少しずつエネルギーがずれてしまうことが知られている。この研究は、わずか8個のセンサの測定から波全体の様子を推定するときにも、その保存の性質を壊さない方法を作った。しかもセンサを動かして「一番よく見える場所」を追いかけると、誤差が約100分の1になった。見る場所を変えるだけでこれほど違う、という点が面白い。", "unverified": "定理3の誤差評価の具体的な式と付録Aの証明、時間離散化（付録B）の詳細は確認していない。"}}, {"rank": 2, "theme": "VBI・橋梁SHM", "headline": "橋梁点検データの劣化ハザード推定を安定化", "title": "Convergence-Aware Pareto Selection of Covariate Scaling Transformations for Markov Deterioration Hazard Models: Evidence from Bridge Inspection Data", "url": "https://arxiv.org/abs/2609.31786", "authors": "Takato Yasuno ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr02", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（問題設定、手法、データ、結果の表2〜4、考察・限界の節）を読んだ", "preprint": true, "p1": "橋梁の点検記録から部材の劣化の進み方を推定するマルコフ劣化ハザードモデルで、説明変数の尺度変換（スケーリング）の選び方が推定の収束と予測の質を大きく左右することを示し、z得点（平均0・分散1への標準化）を既定にすべきだと実証した（§1.4、§5）。", "p2": "インフラのアセットマネジメントで使う劣化モデルは最尤推定の数値的な条件に敏感だが、実務のパイプラインでは一つの尺度変換を根拠なく使っていることが多い（抄録、§1.2）。また正解率と計算時間だけで手法を選ぶと、確率の較正（予測確率の妥当さ）が悪いモデルを見逃す（§1.2の課題2〜3）。", "p3": "指数ハザード・マルコフ（EHM）モデルは、状態kから次の状態へ移る率を説明変数の指数関数で表し、隣の状態にだけ進む連続時間マルコフ連鎖として遷移確率を閉形式で書く（式1〜2）。説明変数は供用年数、橋長、面積、交通量で、単位が数桁違う（§4.2）。最大値割り、最小-最大、z得点、Box-Cox変換の4つを学習データだけで当てはめ、L-BFGS-Bで推定し、正解率と最適化時間の2目的のパレート基準で選ぶ（式4〜10）。", "p4": "匿名化した橋梁点検の遷移データで、主桁・橋脚・支承・床版など10の部材・損傷区分について、3→4回目の点検を学習、4→5回目を橋単位で分けた評価データとした（表1、§4.1）。10区分×4手法の40試行で、収束の成否、評価データの正解率、最適化時間、対数損失（log loss：確率の当たり具合を測る適正スコア）を比べた（§3.4〜3.5）。", "p5": "z得点だけが10区分すべてで収束し、平均正解率0.5255と最も高く、最適化時間の中央値は0.358秒で、既存の最大値割り（0.928秒）の4割未満だった（表2）。パレート選択ではz得点が10区分中7区分で選ばれた（表3）。Box-Coxは4区分しか収束しなかったが速く、3区分で選ばれたものの、対数損失は他の手法の7〜13倍悪かった（表4、§5.3）。", "p6": "著者は、評価データをそのまま手法選択に使ったため選択後の正解率は楽観的であること、時間計測が1つの乱数シード・1つの計算環境であること、選択基準に対数損失を入れていないことを限界に挙げ、実務では対数損失の悪化を防ぐ条件を加えることを勧める（§6.5〜6.6）。解釈：平均正解率が0.4546〜0.5255にとどまり、劣化予測そのものの精度はまだ低い。未査読のプレプリントである。", "fun": "点検の記録から「この橋の部材は何年でどれくらい傷むか」を予測するとき、年数（数十年）と交通量（数万台）のように桁の違う数字をそのまま使うと、計算がうまく収束しないことがある。数字の目盛りをそろえる方法を変えるだけで、成功率も速さも大きく変わった。しかも「速くて正解率も同じ」方法が、実は予測の自信の付け方がめちゃくちゃだった、というのが面白い落とし穴だ。", "unverified": "付録A.3の試行ごとの全表と、対数損失の全手法の値は確認していない。データの出典（点検データの国・機関）は本文では匿名化されている。"}}, {"rank": 3, "theme": "LLM熟議・ペルソナ", "headline": "多視点のLLMエージェントで政策を熟議する", "title": "KITA AI: A Multi-Agent LLM System for Pluralistic Policy Deliberation", "url": "https://arxiv.org/abs/2609.34890", "authors": "Arnau Mayoral-Macau (United Nations University Institute in Macau ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr03", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（システムのデモ論文。導入、システム構成、利用例、責任ある利用と限界）を読んだ。本文は約1万字と短い", "preprint": true, "p1": "政策の場面に対して、人口属性と倫理的な考え方をそれぞれ持たせた複数のLLMエージェントに討論させ、誰が影響を受けるか、各立場の根拠と指標、そして合意に至らない点そのものを意思決定者に示すモジュール型のシステムKITA AIを作った（抄録、序論）。", "p2": "従来の多エージェント討論や合意形成の仕組み（多数決や「ハーバーマス・マシン」のような収束型）は、意見の違いを解消すべきものとして扱い、一つの答えを出す（序論）。政策では対立する利害関係者の根拠と量的な影響を吟味する必要があるが、その用途の仕組みは乏しかった（序論）。", "p3": "3つの必須モジュールが順に動く（§System Overview、図1）。①エージェント構築：政策場面から関係者のペルソナ一覧を作る（人口属性の軸と価値体系をLLMが提案）。②討論エンジン：各提案をトゥールミンの論証形式で表し、形式的な対話ゲームとして反論を重ね（反論に答えなければ譲歩とみなす）、論証グラフから合意を導く。③報告エンジン：結果を複数の価値体系（SDGsなど）の見方で読み直す。任意でネット検索による文脈づけと、エージェントベースのシミュレーションを加えられる。", "p4": "デモ論文で、定量的な評価はない。既定の流れのほか、過去の政策論争の結論前の情報だけで結果を再現する「バックテスト」、場面の書き方を変えて学習データの漏れを抑える「摂動」の3つの使い方を試したと述べる（§Use Cases）。", "p5": "性能の数値は報告されていない。成果はシステムそのもので、LLMの種類に依らない設計（OpenRouter経由）、共有の議事録を介したモジュールの差し替え、事前計算の結果を見られる画面、プラグイン作成支援を備える（§Modularity、§Use Cases）。", "p6": "著者は、ペルソナを指定しても基盤モデルの偏りが残るため、出力を住民への意見聴取とみなしてはならず、専門家が解釈すべきだとする（§Responsible Use）。解釈：討論の質、ペルソナの妥当性、バックテストでの再現の度合いは評価されておらず、有用性は今後の検証待ちである。未査読のプレプリントである。", "fun": "AI同士に議論させると、たいてい「多数決で一つの答え」にまとめてしまう。この仕組みは逆に、年齢や立場、考え方の違うAIの代表者たちに議論させ、「どこで意見が割れて、誰が損をするのか」をそのまま見せることを目的にしている。答えを出すより、対立の地図を描く道具にした発想の転換が面白い。", "unverified": "バックテスト・摂動の結果の具体例と精度、使われたLLMの種類は本文に記載がなく確認できなかった。"}}, {"rank": 4, "theme": "職場AI・組織行動", "headline": "AI利用の義務化はゲーム化を招く：5千人の実証", "title": "When Less Is More: Managing AI Adoption with Adaptive Incentive Design", "url": "https://arxiv.org/abs/2609.32859", "authors": "Jie Gong ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr04", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、制度背景、データと推定方法、第4〜5節の結果の要約、考察・限界）を読んだ。付録の表と頑健性の個々の数値は一部のみ", "preprint": true, "p1": "社内AIアシスタントの利用を「月200回以上」と義務づけた企業で、利用回数の水増し（ゲーム化）がどれだけ起き、目標を100回に下げると何が減り何が増えるかを、支店ごとの導入時期のずれを使って因果的に示した（抄録、§1）。", "p2": "生成AIは知識労働の生産性を上げうるが、自発的な利用は広がりにくく、企業は利用回数を評価や罰則に組み込み始めている（§1）。しかし測りやすい入力指標を報酬にすると働き手はそれを操作しうる（Kerr 1975など）。報道ではゲーム化が知られていたが、その規模と、目標を見直したときの効果は実証されていなかった（§1）。", "p3": "大手医療機器メーカーの非生産部門の従業員約5,000人の問い合わせログ（全文と時刻）を使う（§2〜3.1）。問い合わせの中身を分類し、繰り返しや業務外の質問と、業務に関連する新しい質問を分ける（付録B、人手による妥当性確認つき）。目標引き下げの実施時期が支店の人事部門ごとに異なったことを利用し、従業員・月の固定効果つきの差の差法（式1）とイベントスタディ、Sun-Abrahamの推定量で効果を推定する（§3.2、§5.5）。", "p4": "結果は月間の問い合わせ数、その内訳（繰り返し・業務外か、業務関連か）、月末への集中、営業職（8支店）の月間売上。標準誤差は42支店でクラスター化し、ワイルド・クラスター・ブートストラップや1支店除外の頑健性も確認した（§3.2、§5.5）。事前の傾向差がないことを支店特性とイベントスタディで点検した（付録表A1〜A2）。", "p5": "義務化前に一度でも使った人は14.8%だったが、義務化の月に31.2%、翌月に9.1%が初めて使った（§1）。一方、利用者の12%がちょうど200回、95%が220回以下に集中し、問い合わせの31%が繰り返しや業務外だった（§1、§4.2）。目標を100回に下げると月間の問い合わせは29回（平均比30%）減り、その約90%は繰り返し・業務外の減少で、業務関連の問い合わせの変化は小さく有意でなかった（抄録、§5.2）。営業職の月間売上は7%増えた（§5.3）。", "p6": "著者は、200回の義務化は全社一斉だったため導入そのものの効果は識別できないこと、AIの回答が仕事にどう使われたかは見えないこと、成果の測定が営業職に限られることを限界に挙げる（§6）。解釈：1社の事例であり、最適な目標水準は示されていない。売上の効果は8支店に基づき、推定の精度には限りがある。未査読のプレプリントである。", "fun": "「AIを毎月200回使いなさい」と会社が決めたら、同じ質問を繰り返したり、仕事と関係ない質問をしたりして、ちょうど200回にそろえる人が続出した。目標を100回に下げると、減ったのはほとんどが水増しの質問で、しかも営業成績は上がった。数を測って評価すると数だけが増える、という昔からの教訓がAIでもそのまま起きたのが面白い。", "unverified": "業務関連の問い合わせの推定値の具体的な数と信頼区間、異質性分析の係数は確認していない。"}}, {"rank": 5, "theme": "包摂的コミュニティ・社会", "headline": "定義されない介護者：政策を損なう曖昧さ", "title": "Undefined and Unmeasured: How Conceptual Ambiguity Around the Informal Carer and Carer Burden May Undermine Public Support Policies", "url": "https://doi.org/10.20944/preprints202609.2379.v1", "authors": "Hélène Rossinot", "venue": "Preprints.org", "date": "2026-09-29", "id": "pr05", "explain": {"basis": "抄録", "basis_note": "Preprints.orgの本文は取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": true, "p1": "インフォーマルな介護者（家族などの無償の介護者）とその「介護負担」の定義・測定があいまいなことが、支援政策の対象の特定・配分・評価の失敗につながっていることを批判的レビューで示し、定義と測定の改善案を提案した（抄録）。", "p2": "欧州では長期介護の大半を無償の介護者が担い、支援が政策課題になったが、誰を介護者とみなすか、何の支援が要るかという土台が不安定なままである（抄録の背景）。", "p3": "介護負担と介護者の概念、概念・心理測定・実証の一次研究、政策文書を批判的に検討した（抄録の方法）。", "p4": "定義の一致点と相違点、有病率の推計の違い、負担の概念の扱われ方、測定尺度の内容妥当性・反応性・支援ニーズに結びつく閾値の有無を検討の観点とした（抄録）。", "p5": "定義は「長期の必要がある人への、個人的な関係の中での非専門的な支援」で一致するが、いくつかの点で分かれ、そのため調査ごとの有病率の推計は定義の産物でもある（抄録）。負担はストレス要因・評価・結果のいずれとしても扱われ、ストレスや燃え尽きと混同され、尺度は主観的な負担に偏り、特定の支援ニーズに結びついた閾値を持つものはない（抄録）。フランスの介護者日額手当では、民間の被雇用者約27万人が対象になりえたのに、18か月で開かれた受給権は6,626件だった（抄録）。", "p6": "著者は、境界を明示した定義、客観的な負荷・主観的な負担・その帰結の区別、COSMIN（測定尺度の質の国際的な基準）に沿った文脈別の尺度の開発を提案する（抄録の結論）。解釈：批判的（非系統的）レビューであり、文献の選び方の偏りの可能性は抄録からは評価できない。未査読のプレプリントである。", "fun": "家族の介護をしている人を支える制度を作っても、「誰が介護者か」「どれくらい大変か」をうまく測れないと、必要な人に届かない。フランスの介護者向けの手当では、対象になりうる人が約27万人いたのに、1年半で実際に受け取れたのは6,626件だった。言葉の定義というと地味に聞こえるが、それが制度の成否を左右するという指摘が面白い。", "unverified": "本文が入手できず、検討した文献の数、他国の事例、提案した定義の具体的な文言は確認できていない。"}}, {"rank": 6, "theme": "VBI・橋梁SHM", "headline": "行動を補助情報にした粒子フィルタで損傷診断", "title": "Action-Aided Particle Filter for Damage Detection and Diagnosis on Hysteretic Non-Linear Structures Under Varying Environmental Conditions", "url": "https://doi.org/10.20944/preprints202609.2424.v1", "authors": "Lucio Pinello", "venue": "Preprints.org", "date": "2026-09-29", "id": "pr06", "explain": {"basis": "抄録", "basis_note": "Preprints.orgの本文は取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": true, "p1": "温度などの環境変動で損傷の兆候が隠れる状況で、自己符号化器（AE）による特徴の正規化と、物理的な「作用」の項を重みに加えた粒子フィルタを組み合わせ、履歴を持つ非線形構造の状態推定・損傷検知・位置特定を改善した（抄録）。", "p2": "状態基準保全・予知保全には実時間の損傷診断が要るが、損傷に敏感な特徴量は環境・運用条件の変動で揺らぎ、劣化の影響が隠れたり歪んだりする（抄録）。", "p3": "健全時のデータだけで学習したAEで温度による特徴のずれを補正する（抄録）。そのうえで標準の逐次重点リサンプリング粒子フィルタ（SIR PF：多数の仮説（粒子）を観測との当てはまりで重みづけして状態を追う方法）の尤度の重みに、停留作用の原理に基づく作用の項を加え、作用の大きい（物理的に不自然な）軌道を罰して時間的に滑らかな状態の変化を優先する（A-SIR PF、抄録）。", "p4": "Bouc-Wenの履歴を持つ非線形ばねを含むn自由度の振動系に温度変動を与え、1本のばねの段階的な剛性低下と、時間に比例して進む劣化の2つの場面で、同じ乱数・雑音・リサンプリング条件のもとSIR PFとA-SIR PFを比べた（抄録）。指標は状態推定の精度と損傷の検知・位置特定の能力である（抄録）。", "p5": "A-SIR PFは従来のSIR PFより良い性能を示し、計算コストは同程度だった（抄録）。精度の具体的な数値は抄録にない。", "p6": "解釈：検証は数値模擬の多自由度系に限られ、実構造物の計測データでの性能や、作用の項の重みの決め方への感度は抄録からは分からない。未査読のプレプリントである。", "fun": "粒子フィルタは、たくさんの「予想」を同時に走らせ、測定に合うものを残していく推定法だ。この研究では、物理の「自然の動きは作用という量を小さくする経路をとる」という原理を借りて、不自然にガタガタした予想を減点した。高校物理の先にある解析力学の考え方が、橋や建物の傷を見つける計算の工夫につながっているのが面白い。", "unverified": "本文が入手できず、精度の改善幅、自由度の数、温度変動の設定の詳細は確認できていない。"}}, {"rank": 7, "theme": "LLM熟議・ペルソナ", "headline": "オープンLLMは調査の母集団を再現できるか", "title": "Can Open-Weight Large Language Models (LLMs) Simulate Human Survey Populations? A Cross-Instrument Calibration Study", "url": "https://arxiv.org/abs/2609.32638", "authors": "Grandee Lee", "venue": "arXiv", "date": "2026-09-29", "id": "pr07", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（方法、結果の§4.1〜4.3・4.6・4.7、限界）と表2〜4・7を読んだ。§4.4〜4.5、4.8は一部のみ", "preprint": true, "p1": "実在の回答者の一つの心理尺度への逐語の回答だけをペルソナとしてオープンウェイトのLLMに与え、別の尺度に答えさせると、尺度間の相関の構造を人間の2,058人パネルとr=0.70〜0.73の一致度で再現できることを示した（抄録、表3）。", "p2": "LLMによる合成回答者やデジタルツインが、見かけのもっともらしさでなく人間の統計的構造を保つかは未解決で、証拠の多くは商用モデルによるものだった（抄録）。", "p3": "実在の回答者1人の、ある尺度（種）の各項目への回答をそのまま文章で与え、新しい文脈で別の尺度（測定対象）に答えさせる（§3.2）。これを40人分行い、「種の実得点と模擬の測定得点の相関」を人間の同じ組の相関と比べる（式1〜4）。尺度の組は語彙の重なりと4段階の構成概念の距離で統制し、表面的な言い換えで当たる組を区別する（§3.3）。", "p4": "人間の基準は全国パネル2,058人の15尺度（ビッグファイブ、認知スタイル、価値・経済選好など）（§3.1）。gemma4:31b、llama3.1:70b、qwen3.8:27bの3モデルで139組を試し、ピアソン・スピアマン相関、符号の一致率、平均絶対誤差（MAE）で評価した（§3.5、§4.3）。", "p5": "ペルソナなしでは回答が少数の選択肢に偏り（MAX尺度の項目のエントロピー1.24ビット、人間2.20）、1尺度で条件づけると2.01ビットに回復した（§4.1、図1）。温度を上げるとMAEは3モデルとも悪化した（表2）。139組の相関の一致はr=0.703〜0.731、符号一致82.7〜87.1%で、主に符号の正しさによる（表3）。回答者個人の得点の一致は平均0.15〜0.21と弱いが、14尺度で条件づけると平均0.424に上がった（§4.3、§4.6）。Llamaの新しい版ほど良いわけではなく、最新のllama3.3:70bは符号一致71.4%と旧版の92.9%より低かった（§4.7、14組）。", "p6": "著者は、139組が同じ40人と尺度を共有するため統計は記述的であること、回帰など非LLMの比較基準がないこと、版の比較が小さな14組の標本であることを限界に挙げる（§6）。解釈：一つの米国パネルに基づき、他の文化や尺度への一般化は未確認である。未査読のプレプリントである。", "fun": "ある人の性格テストの答えだけをAIに読ませて「この人になりきって別のアンケートに答えて」と頼むと、人間全体に見られる「この性格の人はこう答えがち」という関係をかなり再現できた。ただし一人ひとりの答えを当てるのはまだ苦手で、AIの新しい版ほどうまいとも限らない。人の「そっくりさん」をAIで作る夢と限界の両方が見える。", "unverified": "構成概念の距離の段階別の結果（表5）と、行動課題への拡張（§4.8）の数値は確認していない。"}}, {"rank": 8, "theme": "位相空間・土木三力学", "headline": "運動論的輸送を波と粒子に分けて解く", "title": "A wave-particle decomposition framework for multiscale kinetic transport: continuous-spectrum equations and coupled wave-particle iteration", "url": "https://arxiv.org/abs/2609.33622", "authors": "Chang Liu", "venue": "arXiv", "date": "2026-09-29", "id": "pr08", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、数値例の節、結論）と図のキャプションを読んだ。第2〜4節の方程式の導出は目次と序論の要約の範囲で確認した", "preprint": true, "p1": "位置と速度の空間で分布関数が従う運動論的方程式（ボルツマン方程式など）の解を、保存量だけで決まる「波」とその厳密な補完の「粒子」に分け、分子運動論から流体力学（ナビエ・ストークス）までを一つの方程式系で連続的につなぎ、定常流を大幅に速く解く反復法をまとめた（抄録、§6）。", "p2": "同じ計算領域に、平均自由行程が格子よりずっと小さい連続体に近い領域と、同程度の希薄な領域が混在する流れ（高高度の機体周りなど）では、運動論的方程式を直接解くと、細部が不要な連続体側で最も計算がかさむ（§1）。定常問題の通常の反復は、クヌーセン数（平均自由行程と代表長さの比）の2乗に反比例する回数を要する（§1）。", "p3": "各点に局所的な「運動論的視野（horizon）」ℓを付け、特性線に沿った積分解を、視野内の衝突で生まれた平衡分布（波W、保存量Uだけの関数）と上流から入ってくる残り（粒子P）に分ける（f=W+P、近似なし）（§1）。視野と緩和時間の比η=ℓ/τで、波はオイラー流束の1−e^(−η)、粘性流束の1−(1+η)e^(−η)を担い、ηが0から∞へ動くと系は運動論から流体方程式へ連続的に移る（§1、§2.6）。解法は、粒子を固定して保存量を進めるW反復と、波を固定して粒子を進めるP反復を交互に行う（§3）。", "p4": "BGK、Shakhov、ES-BGK、ボルツマン、ランダウ方程式、中性子輸送、放射輸送の7つのモデルで方程式と反復を具体化した（§2.7、§3.6）。数値例は既報（文献35、37）の計算の再掲で、マッハ5〜8の円柱周りの極超音速流、3次元のX38機体、Re=1000のキャビティ流を、従来の反復法（CIS）の解と反復回数で比べた（§5）。", "p5": "ボルツマン衝突項での円柱周り流れでは、CISの解との相対L2差が1.076×10⁻⁵〜1.275×10⁻³だった（図4）。局所の視野を使うと粒子が衝撃層と後流の近くに限られ、UGKWP法に比べて運動論的な自由度がクヌーセン数10⁻²で約2.6分の1、10⁻³で約88分の1になった（図5）。収束までの反復回数の比（CIS/WP）はキャビティで3,797.50、円柱（ε=10⁻⁴）で54,412.11だった（図6、§5）。", "p6": "数値例は既報の計算の再掲で、本論文は枠組みの整理と性質の記述が中心である（§5）。X38の例は定性的な示範で、空力の定量的な検証ではないと著者は述べる（§5）。解釈：対象は気体・中性子・放射の輸送で、固体や粒状体への適用は議論されていない。未査読のプレプリントである。", "fun": "空気は分子がぶつかり合う粒の集まりだが、ふだんは「流体」として滑らかに扱える。宇宙から帰ってくる機体の周りのように、粒として扱うべき場所と流体として扱える場所が混ざると計算が大変になる。この研究は、分布を「流体として分かる部分」と「粒としての残り」に正確に分け、場所ごとに割合を自動で変えることで、計算を数千〜数万倍速くした。粒と流れを一続きに見る発想が面白い。", "unverified": "第2〜4節の方程式（式13〜28）の詳細な導出と、漸近保存性の証明は確認していない。"}}, {"rank": 9, "theme": "会計情報科学", "headline": "ChatGPTは開示の理解を助け取引を同期させる", "title": "Large Language Models, Price Discovery, and Synchronized Trading", "url": "https://doi.org/10.2139/ssrn.7538559", "authors": "Jiawei Wang", "venue": "SSRN", "date": "2026-09-29", "id": "pr09", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": true, "p1": "ChatGPTの公開を自然実験として使い、読みにくい開示文書を持つ企業ほど、LLMの登場後に注文の流れが一方向にそろい（取引の同期）、同時に価格発見も速く確かになったことを示し、共通のモデルに読解を任せる投資家の理論で説明した（抄録）。", "p2": "LLMは投資家の開示の理解を助けうるが、皆が同じモデルに頼ると誤りが相関する。この利点と危うさのトレードオフは実証されていなかった（抄録）。", "p3": "公開前の開示文書の性質（読みやすさと不確実性の表現）を使い、公開後に読みにくい企業ほど何が変わったかを、似た企業と比べる（抄録）。解釈を支えるため、投資家が「読むのはうまいが共通の誤りを持つモデル」に読解を委ねられるKyle型のモデルを作った（抄録）。", "p4": "結果は、注文の流れの一方向性（個人・非個人投資家別）、注文の価格インパクトのうち次の四半期まで残る割合（恒久的な情報の反映の指標）、決算情報が価格に入る速さ、市場全体との連動である（抄録）。", "p5": "最も読みにくい十分位の企業では、最も読みやすい十分位に比べ、注文の一方向性が標本平均の6.4%分高まった（抄録）。読みにくさが1標準偏差大きい企業では、次の四半期まで残る価格インパクトの割合が約60%から約80%に上がり、決算情報がより速く価格に入った（抄録）。一方、開示の不確実性が大きいほど取引の同期は弱く、価格発見の改善もなかった（抄録）。", "p6": "解釈：LLMを実際に使ったかどうかは直接観測されず、ChatGPT公開の時期と読みやすさの交差で効果を推し量っているため、同時期の他の変化との区別は本文での確認が必要である。モデルでは、同じ情報で取引する利益が減るため委任は戦略的代替となり、混雑が採用を抑える（抄録）。未査読のプレプリントである。", "fun": "難しい決算書でもAIに要約させれば誰でも読めるようになる。すると皆が同じように売り買いするので市場が「そろって動く」危うさがある一方、情報が早く正しく株価に反映されるという良い面も同時に起きた。「みんなが同じAIに頼る」ことの光と影を、ChatGPT登場という出来事を実験の代わりに使って測った点が面白い。", "unverified": "本文が入手できず、標本の期間・企業数、読みやすさの指標の定義、推定式は確認できていない。"}}, {"rank": 10, "theme": "LLM熟議・ペルソナ", "headline": "ペルソナ指定は狙った属性だけを変えない", "title": "Persona Following Is Not Selective Control: The Neutrality Gap in LLM User Simulation", "url": "https://arxiv.org/abs/2609.35036", "authors": "Jiashen Ren ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr10", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、実験設定、第3〜4節、抄録の第5節の要約、付録A.14の限界）を読んだ。付録の大部分（A.5〜A.13）は読んでいない", "preprint": true, "p1": "LLMでのユーザ模擬において、ペルソナの一つの属性（例：リスク志向）を変えると、指定していない別の属性（例：色の好み）の回答まで動くことを8つの商用LLMすべてで示し、別の属性を「中立」と明示しても影響が消えない「中立性のギャップ」を見つけた（抄録、§3、§5）。", "p2": "ペルソナ・プロンプトによる模擬実験では、ある属性を操作して行動の差をその属性の効果とみなすが、それは他の属性が変わらない「選択的な操作」であることを前提にしている。この前提はほとんど検証されていなかった（§1）。", "p3": "課題・選択肢・他の情報を固定し、対象属性だけを変えて非対象の回答の変化を測る（§2〜3）。語の置き換え（意味は同じで名前を変える）、学習前後のモデル（base/instruct）の比較、文脈で相関を与える実験で原因を探り、隠れ状態から部分空間を消去して内部の結びつきを調べる（§3〜4）。さらに非対象の属性を「指定なし」「方向つき」「中立」の3状態で宣言する診断を提案した（抄録、図1c）。", "p4": "8つのAPI経由のLLM（GPT-5.5、Gemini-3-Flash-Previewなど）で自然な質問項目を調べ、回答確率や隠れ状態が要る分析は5つのオープンウェイトモデル（Qwen3-32B、Gemma-2-27Bなど）で行った（§2.2、表1）。項目クラスター・ブートストラップとBenjamini-Hochberg補正で区間を出した（§2.2）。", "p5": "リスク志向のプロンプトは、8モデルすべてで色などの日常の好みを目立つ側へ動かし、その選択肢の確率を平均0.43上げた（§3）。意味だけを定義した架空の名前でも同じ効果（対数オッズ9.13対9.06）が出たが、無意味な符号では1.59にとどまった（図2a）。非対象の属性を方向つきで宣言すると影響はほぼ消える（320の比較中最大1件）が、中立と宣言しても項目の51〜81%で対象属性の影響が残った（抄録）。", "p6": "著者は、商用モデルでの広がりは1つの属性の組に基づくこと、中立宣言や内部の分析はオープンウェイトモデルに限られること、材料が英語の文字のみであること、人間の基準を使っていないことを限界に挙げる（付録A.14）。解釈：模擬された選択が実在のリスク志向の人の好みを表すわけではない点は著者も注意している。未査読のプレプリントである。", "fun": "AIに「あなたは冒険好きな人です」と役を与えると、頼んでもいないのに好きな色まで派手な色に変わった。AIは役の説明を「この人はこういうタイプ」という手がかりとして読み、残りを勝手に想像で埋めるらしい。しかも「色の好みは普通です」と書き添えても影響が残る。人の代わりにAIで実験するとき、この「連想の暴走」をどう止めるかが問われる。", "unverified": "第5節の本文（中立性のギャップの推定値の詳細、緩和策の効果）と付録の多くの表は確認していない。"}}, {"rank": 11, "theme": "VBI・橋梁SHM", "headline": "計測応答から劣化を逐次ベイズで診断・予測", "title": "Sequential Bayesian diagnosis and prognosis of structural deterioration from measured structural responses", "url": "https://arxiv.org/abs/2609.33001", "authors": "Ronald Schneider", "venue": "arXiv", "date": "2026-09-29", "id": "pr11", "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（抄録、第4節の例題の設定と診断結果、考察）と図のキャプションを読んだ。第2〜3節の定式化の詳細（式）は一部のみ", "preprint": true, "p1": "計測された構造応答から、潜在的な劣化過程のパラメータをベイズ推定し、現在の劣化状態の診断、将来の予測、構造信頼性の予測までを一貫した確率の枠組みでつなぎ、監視データが増えるたびに前段の標本を引き継いで更新できる「逐次BUS」法を作った（抄録）。", "p2": "劣化は直接は見えず、応答から間接的に推定して工学的な量へ伝える必要がある（抄録）。構造信頼性法によるベイズ更新（BUS）とサブセット・シミュレーションは、データが増えるたびに事前分布から計算をやり直す必要があった（抄録、考察）。", "p3": "劣化モデル（溶接部の亀裂進展をParis則で表し、板厚を貫く亀裂で部材が切れる離散状態へ移る）を、監視と診断・予測を結ぶ共通の確率的なつなぎとする（§4.1〜4.2）。各段階のBUS事象を入れ子の列として定義し、前の段階の条件付き標本集団からサブセット・シミュレーションを続けられるようにした（抄録、考察）。尤度の上限（乗数）は離散損傷状態を評価して段階ごとに厳密に決めた（考察）。", "p4": "Berkeleyの実験に由来するジャケット型の冗長な骨組（Zayasフレーム）の22か所の溶接部の疲労を対象とした（§4.2、図1）。20年間、毎年、白色雑音加振のOpenSeesモデルの加速度に2%の雑音を加え、SSI-COVで同定した固有振動数とモード形を観測とし、20年目にブレース6が破断する模擬シナリオで検証した（§4.4、図3）。", "p5": "健全な観測が続いた19年目までは健全状態の事後確率が0.9945と高く保たれ、観測は「まだ壊れていない」という生存型の情報として、早期の破断に至る劣化履歴の重みを下げた（§4.6、表1）。20年目の観測後は、正解のブレース6のみの破断が0.51、ブレース5のみが0.48、両方の破断が0.01となり、モードが似る状態の区別がつかないあいまいさが事後分布に残った（§4.6）。両方の破断は尤度が最大でも、劣化モデルのもとで起こりにくいため確率は小さかった（§4.6）。", "p6": "著者は、劣化モデル・構造モデルの妥当性に依存すること、逐次法でも過去の尤度の評価が要り監視履歴が長いほど計算が増えること、サブセット・シミュレーションが多峰の領域の探索に弱いことを挙げる（考察）。解釈：検証は模擬データの1例のみで、温度など環境変動を含む実測での性能は示されていない。未査読のプレプリントである。", "fun": "「今年も壊れていなかった」という毎年の点検結果にも情報がある。もし弱い部材だったらもう壊れていたはずなので、その可能性が少しずつ消えていくからだ。20年目に揺れ方が変わると、どの部材が切れたかを確率で答えるが、揺れ方がそっくりな2本の部材はほぼ五分五分のまま残った。分からないことを正直に分からないと示すところが面白い。", "unverified": "信頼性予測の結果（破壊確率の推移の図）と、事後分布の検証に使った別手法の比較の数値は確認していない。"}}, {"rank": 12, "theme": "LLM熟議・ペルソナ", "headline": "同質なLLM討論の崩壊と訂正を測る", "title": "Measuring Collapse and Correction in Homogeneous-Panel LLM Debate", "url": "https://arxiv.org/abs/2609.35279", "authors": "Xin Li ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr12", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、評価手順の§3.1、限界の§7）と抄録を読んだ。第4〜6節の本文と付録の表は序論に書かれた要約の範囲で確認した", "preprint": true, "p1": "同じLLMを3体並べた多エージェント討論で、最初は正しかった多数派が誤りに崩れる「崩壊」と、誤りから正解に戻る「訂正」を別々に帳簿として記録する監査手順を作り、崩壊の防止だけを見ると誤った介入策を選んでしまうことを示した（抄録、§1）。", "p2": "多エージェント討論は最終正解率で評価されがちだが、同じ議論が誤った多数派を救うことも、正しい多数派を壊すこともあり、正解率はこの逆向きの二つを混ぜてしまう（抄録）。実際、Sonnet 4.5とLlama-3.1-8Bは回答を変える率がほぼ同じ（0.705対0.726）なのに、正解の崩壊率はLlamaが約4倍（8.46%対2.15%）だった（§1）。", "p3": "3体のエージェントが独立に答え（第0ラウンド）、第1〜3ラウンドで全員の答えを見て更新し、最終多数で決める（§3.1）。最初と最後の多数派の正誤で2×2の帳簿（維持・崩壊・訂正・未修復）を作り、崩壊が始まるラウンドと、介入策が防いだ崩壊と失った訂正を符号つきで数える（§3）。事前に、反論の強さ（4段階）×社会的圧力（1体か2体からの反論）の8種の質問で、答えを変えやすさを測るスクリーニングを行う（§3.1）。ラベルはすべて規則ベースで、LLMの採点者は使わない（§3.1）。", "p4": "MMLU-Proの6,925回の討論が主なデータで、7系統14モデルの行で分析した（抄録、§7）。事前スクリーニングと系統レベルの崩壊リスクの順位相関、第1ラウンドの軌跡の特徴による予測のAUC、介入策を過去の討論に当てはめ直す再生実験で評価した（§1、§4〜6）。", "p5": "6,925回で253回の崩壊が見つかり、最も影響を受けやすいモデルでは最初に正しかった多数派の1割超が失われた（§1）。追跡した崩壊の149/253は第1ラウンドで始まり、第1ラウンドの特徴で予測のAUCは0.669から0.768に上がった（§1）。1モデルを除いて学習する事前スクリーニングで討論を止める策は、崩壊を29回防ぐが訂正を108回失い、正味−79だった（抄録、§1）。スクリーニングと崩壊リスクの系統レベルの相関はρ=0.893（p=0.0123）だが、最初の多数派の正解率もρ=0.821と近かった（抄録）。", "p6": "著者は、分析が事前登録の18行でなく14行（7系統）と小さいこと、同一モデル・閉じた本・多肢選択の討論に範囲が限られること、スクリーニングは較正された予測ではなく優先順位づけの目安にすぎないこと、推論モードを分離していないことを挙げる（§7）。解釈：自由記述や道具を使う熟議への一般化は未検証である。未査読のプレプリントである。", "fun": "AIを3体集めて話し合わせると賢くなりそうだが、最初は正解だったのに話し合いで間違いに流されることもある。「何回意見を変えたか」ではなく「正しい方へ変えたか、間違った方へ変えたか」を数え分けると、話し合いを途中で止めるという対策が、防いだ失敗より多くの逆転勝ちを捨てていたことが分かった。会議の良し悪しを測る難しさは人間と同じだ。", "unverified": "第4〜6節の表の個々の数値（モデル別の崩壊率など）と、事前スクリーニングの推定の区間は本文で確認していない。"}}, {"rank": 13, "theme": "都市・インフラ政策", "headline": "Walk Scoreと実際の街路の質のずれ", "title": "Walkable on paper, walkable on the street? Divergence between Walk Score and streetscape quality in Los Angeles", "url": "https://doi.org/10.21203/rs.3.rs-11068045/v1", "authors": "Jisoo Sim", "venue": "Research Square (In Review)", "date": "2026-09-29", "id": "pr13", "explain": {"basis": "本文", "basis_note": "Research Squareの本文（データ・変数・分析方法、結果の§4.1〜4.4、限界の§5.3）と表の一部を読んだ", "preprint": true, "p1": "ロサンゼルスの2,232の国勢調査の街区グループで、目的地への近さで測るWalk Scoreと、Google Street Viewの画像から測った歩行者目線の街路の質が食い違う地区が6割に上り、しかもその食い違いが所得の低い地区に偏っていることを示した（抄録）。", "p2": "Walk Scoreは歩きやすさの代理指標として環境の公正の評価にも使われるが、主に目的地への近さで検証されており、歩行者が実際に目にする街路の状態とは照合されていなかった（抄録、§2）。", "p3": "2022年のGSV画像を4方向で撮影し、SegFormerの意味的領域分割で歩道・緑・車両の見える割合、囲まれ感、視覚的な複雑さを測り、CLIPのゼロショット評価で「快適か車中心か」「手入れされているか」「面白いか」を点数化した（§3.2）。歩道と緑を足し車両を引いた歩行者街路景観の質の指標（PSQI）を作り、Walk Scoreとの差を符号つきの乖離指数とした（§3.2）。", "p4": "2018年のWalk Scoreを目的変数とする階層的なOLS（社会経済・都市構造→GIS→目線の物理指標→VLM評価）と、空間的依存を考慮する空間誤差モデルで分析し、乖離指数を所得・民族構成・持ち家率などで説明した（§3.3）。所得等は米国コミュニティ調査の2013〜2017年の値を使った（§3.1）。", "p5": "Walk ScoreとPSQIの相関は−0.36で（§4.1）、中央値で分けると「紙の上だけ歩きやすい」地区が31.1%、「街路だけ良い」地区が30.2%、合わせて61.3%が不一致だった（§4.3、表4）。前者は世帯所得の中央値の平均が57,700ドル、持ち家率21.6%、貧困率26.8%で、後者（124,500ドル、65.9%、10.7%）と大きく違った（§4.4）。目線の変数を加えるとWalk Scoreの説明力R²は0.587から0.665に上がった（表2）。", "p6": "著者は、観察研究で因果は分からないこと、Walk Score（2018年）と画像（2022年）に約4年のずれがあること、PSQIが舗装や横断施設・車速を含まないこと、VLMの評価がプロンプトの言い回しで変わること、ロサンゼルス以外への一般化が未確認なことを挙げる（§5.3）。未査読のプレプリントである。", "fun": "地図の上では「店や駅が近いから歩きやすい」と評価される地区でも、実際の道路の写真を見ると、歩道が狭く車ばかりで緑が少ないことがある。この研究はAIで大量の道路の写真を読み取り、そのずれが所得の低い地区に集中していることを示した。数字の指標だけで街を評価すると、見落とされる人たちがいるという警告が面白い。", "unverified": "乖離指数の回帰（表5）の係数の値と、VLMの言い回しの感度分析（表S3）は確認していない。"}}, {"rank": 14, "theme": "サービス・マーケティング", "headline": "書式や句読点が口コミの有用性を左右する", "title": "From Hidden Neural Representations to Agentic Insight: Discovering Beyond-Semantic Drivers of Review Helpfulness through Mechanistic Interpretability", "url": "https://doi.org/10.2139/ssrn.7538302", "authors": "Alexander Moore ほか", "venue": "SSRN", "date": "2026-09-29", "id": "pr14", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": true, "p1": "LLMの内部表現から解釈可能な特徴を自動で取り出す枠組みを作り、Yelpのレビューの「役に立った」評価を左右する、書式・構造・句読点などの文章のパラ言語的な手がかりを見つけ、箇条書きと談話標識の因果効果を実験で確かめた（抄録）。", "p2": "マーケティングの文章研究は「何を言うか」に偏り、「どう書くか」（書式、構造、空白、句読点など）は、文脈に依存して事前に定義しにくく、前処理で消されることも多いため、大規模に分析されてこなかった（抄録）。", "p3": "機械的解釈性（mechanistic interpretability）の手法でLLMの内部表現から疎で解釈可能な特徴を抽出し、教師あり学習で結果（有用性）と関連する特徴を選び、多エージェントの過程で候補の特徴の意味を解釈する（抄録）。", "p4": "Yelpのレストランのレビューに適用し、有用性と関連するパラ言語的特徴を探索したうち、箇条書きなどの書式と構造的な談話標識の2つについて統制実験で因果効果と仕組みを検証した（抄録）。", "p5": "有用性に関連する幅広いパラ言語的特徴が見つかり、箇条書きと構造的な談話標識は知覚された有用性を高める因果効果を持ち、その仕組みとして処理の流暢さ（読みやすさの感覚）が示された（抄録）。効果の大きさは抄録に記載がない。", "p6": "解釈：特徴抽出に使ったLLMや特徴の数、実験の参加者数は抄録から分からず、Yelp以外の文脈への一般化も未確認である。未査読のプレプリントである。", "fun": "口コミが役に立つかどうかは内容だけで決まると思いがちだが、箇条書きにしたり「まず」「次に」とつないだりする書き方だけでも評価が上がった。しかもその手がかりを、人が決めるのではなくAIの頭の中（内部表現）から掘り出したのが新しい。読みやすさという身近な感覚が数字で確かめられる点が面白い。", "unverified": "本文が入手できず、効果量、実験の規模、使用したLLMは確認できていない。"}}, {"rank": 15, "theme": "サービス・マーケティング", "headline": "行政サービスの失敗と責任の帰属", "title": "Government service failures and attribution of responsibility", "url": "https://osf.io/h2rd9", "authors": "Zepeng Gong", "venue": "OSF Preprints", "date": "2026-09-26", "id": "pr15", "explain": {"basis": "題名", "basis_note": "OSF Preprintsの抄録・本文とも入手できず、題名のみ", "preprint": true, "p1": "題名から言えるのは、行政サービスの失敗が起きたときに、人々がその責任を誰に帰属させるか（政府・担当機関・個人など）を扱った研究だということだけである。", "p2": "未確認（抄録・本文を入手できず）", "p3": "未確認（抄録・本文を入手できず）", "p4": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "p6": "未確認（抄録・本文を入手できず）。未査読のプレプリントである。", "fun": "バスが遅れた、窓口で待たされた、といった公共サービスの失敗のとき、人は誰のせいだと思うのか。お店なら店員や会社を責めるが、行政では政治家、役所、担当者、制度など責める先がいくつもある。題名からは、この「責任の向け先」がどう決まるかという問いが読み取れ、身近だが奥の深い問いである。", "unverified": "抄録・本文とも入手できず、方法・データ・結果はすべて確認できていない。"}}, {"rank": 16, "theme": "VBI・橋梁SHM", "headline": "物理情報MLはSHMの炭素排出を減らせるか", "title": "From Grey-Box to Green-Box: When can Physics-Informed Machine Learning Reduce Carbon Footprints in Structural Health Monitoring?", "url": "https://arxiv.org/abs/2609.33387", "authors": "Daisy R. Bradley ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr16", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "構造ヘルスモニタリング（SHM）で、物理の知識を組み込んだ機械学習（グレーボックス）が、同じ誤差に達するまでの学習の計算量と炭素排出を減らせるかを調べた（抄録）。", "p3": "ガウス過程とニューラルネットの4つの物理情報型の手法（残差モデル、入力拡張、ハイブリッド、制約つき学習）について、所定の誤差までの学習に要する排出を比べた（抄録）。", "p5": "多くの例で物理情報型のほうが学習時の排出が少なかったが、入力拡張型は例外だった（抄録）。データの収集・保存を減らせる分の節約も上乗せされる一方、物理を入れる複雑さとの兼ね合いが要るとした（抄録）。", "fun": "AIの学習には電気が要り、二酸化炭素も出る。橋の点検に使うAIに物理の法則をあらかじめ教えておくと、少ないデータと短い学習で同じ精度に届き、環境への負担も減るという。賢く教えることが省エネにもなる、という見方が面白い。", "unverified": "本文が入手できず、排出の削減幅と対象の構造物の例は確認できていない。"}}, {"rank": 17, "theme": "VBI・橋梁SHM", "headline": "感度に基づく更新でアーチダムの物性を同定", "title": "Sensitivity Based Model Updating Parameter Identification for Concrete Arch Dams", "url": "https://doi.org/10.20944/preprints202609.2344.v1", "authors": "Bukhosi R. Nyoni", "venue": "Preprints.org", "date": "2026-09-29", "id": "pr17", "explain": {"basis": "抄録", "basis_note": "Preprints.orgの本文は取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": true, "short": true, "p1": "コンクリートアーチダムの有限要素モデルを更新する際、どの材料定数をどの観測で更新すべきかを感度分析で調べた（抄録）。", "p3": "熱荷重が支配的な非地震地域の運用条件で、系の剛性・ポアソン比・密度・熱膨張係数の変化に対する変位、固有振動数、モード形の感度を、複数のダム形状で調べた（抄録）。", "p5": "固有振動数と温度変位はともに系の剛性に敏感で、温度変位は熱膨張係数、固有振動数は密度にも敏感だった（抄録）。剛性は固有振動数で、熱膨張係数は温度変位で更新するのがよいと結論した（抄録）。", "fun": "巨大なダムのコンピュータモデルを現実に合わせるとき、どの「つまみ」をどの測定で調整するかが大事になる。揺れやすさ（固有振動数）は硬さと重さ、夏冬の変形は熱による伸び縮みで決まるので、それぞれに合う測定で合わせればよい、という整理が分かりやすい。", "unverified": "本文が入手できず、ダムの形状の数や感度の数値は確認できていない。"}}, {"rank": 18, "theme": "VBI・橋梁SHM", "headline": "拡張カルマンフィルタを学習で補正", "title": "Schur-Neural KF: Learned Schur-Consistent Corrections to the Extended Kalman Filter", "url": "https://arxiv.org/abs/2609.32640", "authors": "Min Kim ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr18", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "拡張カルマンフィルタ（EKF）を学習で補正しつつ、確率的な条件付けの解釈と共分散の正定値性を必ず保つSchur-Neural KFを提案した（抄録）。", "p3": "状態と観測の予測相互共分散と観測雑音の共分散のコレスキー因子を、シューア補行列に基づく形で摂動させ、共分散が常に半正定値になるようにし、再帰型ニューラルネットで出力する（抄録）。観測を加えても状態の不確かさが増えないことなどを証明した（抄録）。", "p5": "2台のレーダーの実験で、少ない学習データでも失敗しないハイパーパラメータの範囲が広くRMSEが下がり、一輪車モデルの実験ではセンサ故障の棄却で精度・再現率・誤警報率・RMSEが最良だった（抄録）。", "fun": "カーナビやロボットの位置推定で使うカルマンフィルタは、誤差の大きさの見積もりが数学的に正しい形でなければ壊れてしまう。この研究は、AIで補正しても「正しい形」が絶対に崩れない作り方を考えた。自由に学ばせつつルールは守らせる設計が面白い。", "unverified": "本文が入手できず、RMSEの改善幅などの具体的な数値は確認できていない。"}}, {"rank": 19, "theme": "VBI・橋梁SHM", "headline": "LLMエージェントでIMUの領域適応", "title": "SenseAgent: An LLM Agent for Adaptive Cross-Domain IMU Sensing", "url": "https://arxiv.org/abs/2609.32000", "authors": "Tianya Zhao ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr19", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "装着型の慣性計測装置（IMU）の行動認識で、利用者・機器・装着位置が変わったときに、LLMを実行時の計画役にして適切な補正の道具を選ぶエージェントSenseAgentを提案した（抄録）。", "p3": "LLMに生の信号を分類させるのではなく、ラベルなしで対象データの診断報告を作り、重力を考慮した処理、プロトタイプ転移、スタイル正規化などの道具を使うかを決め、検証器で較正・信頼性・害がないことを確かめてから採用する（抄録）。", "p5": "抄録は、固定の推論手順を、対象の変化を診断して行動を選ぶ閉ループの過程に変えたと述べる（抄録）。精度の数値は抄録の読めた範囲にない。", "fun": "スマホや腕時計の揺れのセンサで「歩いている」「走っている」を当てるAIは、持つ人や機種が変わると急に外れる。この研究は、AIに状況を診断させ、補正の道具を選ばせる「現場監督」役を与えた。道具を使い分ける発想が面白い。", "unverified": "本文が入手できず、精度の改善幅と評価データは確認できていない。"}}, {"rank": 20, "theme": "VBI・橋梁SHM", "headline": "アーチダムの形状と固有振動数・モード", "title": "Natural Frequencies and Mode Shapes of Various Configurations of Concrete Arch Dams", "url": "https://doi.org/10.20944/preprints202609.2337.v1", "authors": "Bukhosi R. Nyoni", "venue": "Preprints.org", "date": "2026-09-29", "id": "pr20", "explain": {"basis": "抄録", "basis_note": "Preprints.orgの本文は取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": true, "short": true, "p1": "コンクリートアーチダムの曲率（単曲率・二重曲率）、谷の形（狭い・広い、U字・V字）、厚さの区分が、固有振動数とモード形にどう影響するかを数値モデルで調べた（抄録）。", "p3": "さまざまな形状のダムの数値モデルで、系の剛性と付加質量（水位）も変えて固有値解析を行った（抄録）。", "p5": "モードの順序は曲率に影響されないが、一部の形状では剛性と水位で変わった（抄録）。固有振動数は二重曲率のほうが概して高く、V字谷ではすべて1次が対称・2次が逆対称だったが、U字谷では厚さの区分で入れ替わった（抄録）。", "fun": "同じアーチダムでも、谷がVの字かUの字かで、いちばん揺れやすい揺れ方（モード）が変わる。建物の揺れを測って健康診断するときには、形の違いによる揺れ方の違いをまず知っておく必要がある、という基本を丁寧に確かめた研究である。", "unverified": "本文が入手できず、固有振動数の具体的な値と解析したモデルの数は確認できていない。"}}, {"rank": 21, "theme": "位相空間・土木三力学", "headline": "離散観測から確率的な連続時間軌道を生成", "title": "Continuous-Time Trajectory Generation from Discrete Observations with Stochasticity", "url": "https://arxiv.org/abs/2609.32026", "authors": "Ruifeng Shang ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr21", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "離散時刻の観測だけから、確率微分方程式に従う系の確率分布の連続時間の変化（確率の速度場）を直接学び、観測間も含めて分布に整合する軌道を生成する手法PhiBE-Flowを提案した（抄録）。", "p3": "確率微分方程式の係数やスコア（対数密度の勾配）の推定を要しないモデルフリーの方法で、時間離散化誤差と有限標本誤差を含む収束保証を与えた（抄録）。", "p5": "制御された確率的な数値系からナビエ・ストークス方程式、実際の動画まで評価し、確率の流れを正確に復元し、多スケールの物理統計を保ち、動画生成で比較手法を上回ったと述べる（抄録）。", "fun": "物の動きは本当は連続なのに、観測はとびとびの時刻にしかできない。この研究は、とびとびの写真から「確率の雲がどう流れていくか」を直接学んで、間の時間も自然につなげる方法を作った。確率の分布そのものを流体のように扱う発想が面白い。", "unverified": "本文が入手できず、誤差の具体的な数値と比較手法の名前は確認できていない。"}}, {"rank": 22, "theme": "位相空間・土木三力学", "headline": "PINNで雪崩の深さ平均流を解く", "title": "Physics-Informed Neural Networks for Depth-Averaged Avalanche Dynamics", "url": "https://arxiv.org/abs/2609.34916", "authors": "Pradyumn Singh Sikarwar ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr22", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "深さ平均の粒状流を表すSavage-Hutterモデルを物理情報ニューラルネット（PINN）で解く枠組みを、1次元の解析解での検証から2次元の実験での検証まで段階的に評価した（抄録）。", "p3": "1次元の3つの問題（速度既知で高さ、高さ既知で速度、両方の連成）を解析解と比べ、2次元では斜面上の円柱状の粒体の崩壊の室内実験とTITAN2Dの数値解と比べた（抄録）。", "p5": "1次元の連成では高さと速度の平均RMSEが無次元で0.043と0.079だった（抄録）。2次元では物理だけの学習は自明なゼロ解に収束したが、最終堆積形状の10点の疎なデータを損失に加えると学習できた（抄録）。", "fun": "雪崩や土石流のような「流れる砂」の動きを、物理の方程式を守るように学ぶAIで計算した。面白いのは、方程式だけで学ばせると「何も動かない」という答えに逃げてしまい、最後に積もった形の10か所の測定を教えるだけで正しく動き出した点だ。", "unverified": "本文が入手できず、2次元の検証の誤差の数値は確認できていない。"}}, {"rank": 23, "theme": "位相空間・土木三力学", "headline": "メッシュに依らない安定な縮約モデル", "title": "SMORE: Stability-Promoting Mesh-Agnostic Model Reduction for Time-Dependent PDEs", "url": "https://arxiv.org/abs/2609.33205", "authors": "Yangyuan Li ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr23", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "時間発展する偏微分方程式の縮約モデルを、メッシュに依らず作り、リャプノフ関数に導かれた安定化の正則化で長時間の予測を安定させる手法SMOREを提案した（抄録）。", "p3": "潜在空間の力学を線形または線形・二次の解釈しやすい形で学び、安定性の正則化を加える（抄録）。構造的な仮定のもとで理論保証を与え、初期条件の疎な観測から連続な解の場を予測できる（抄録）。", "p5": "波の伝播、ナビエ・ストークス方程式、浅水方程式で、長時間の予測の汎化と頑健性が改善し、同程度のパラメータ数でDINo、FNO、CNOなどと競合する精度だったと述べる（抄録）。", "fun": "天気や波のシミュレーションを速く近似するAIは、長く先まで計算すると値が爆発して壊れやすい。この研究は、エネルギーのように「減っていくもの」を手本に安定性を持たせて、長時間でも暴れないようにした。物理の安定の考え方をAIに持ち込んだ点が面白い。", "unverified": "本文が入手できず、誤差の具体的な数値は確認できていない。"}}, {"rank": 24, "theme": "位相空間・土木三力学", "headline": "道路工事が引き金の斜面崩壊を日単位で特定", "title": "Road Construction-Triggered Landslides: daily-resolution attribution and pre-construction suitability mapping in the Lali and Baku Gad watersheds of Himalaya, Far-Western Nepal", "url": "https://doi.org/10.5194/egusphere-2026-4364", "authors": "Bhuwan Awasthi ほか", "venue": "EGUsphere", "date": "2026-09-29", "id": "pr24", "explain": {"basis": "抄録", "basis_note": "EGUsphereの本文は取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": true, "short": true, "p1": "ネパール西部の2つの流域で、毎日の衛星画像と工事記録を使い、道路工事が引き金の斜面崩壊を雨による崩壊と区別して特定し、工事前の適地図を作った（抄録）。", "p3": "2017〜2025年のPlanetScopeの毎日の画像、雨量計とCHIRPSの雨量、毎日の道路工事記録、四半期の崩壊目録を組み合わせ、工事日の前後の画像で崩壊を工事と同時のもの（173件）とし、道路以前の自然崩壊（127件）と比べた（抄録）。", "p5": "工事と同時の崩壊の63.6%（雨量計）・78.6%（CHIRPS）は雨のない日に起き、87.3%は同じ日の工事の先端から50m以内だった（抄録）。3分の1は四半期の目録に載らず、載ったもののうち60%は乾いた日の崩壊で、四半期の記録ではモンスーンのせいにされる（抄録）。", "fun": "山の道路工事で起きた崖崩れも、年に数回しか記録しないと「雨季の豪雨のせい」にされてしまう。毎日の衛星写真で見ると、崩れた日の多くは晴れで、崩れた場所は工事の最前線のすぐ近くだった。記録の細かさが原因の見え方を変える好例として面白い。", "unverified": "本文が入手できず、適地図のモデルの精度は確認できていない。"}}, {"rank": 25, "theme": "位相空間・土木三力学", "headline": "不規則観測からGP-SDEを高速に学習", "title": "Simulation-Free Learning of GP-SDEs from Irregular Observations", "url": "https://arxiv.org/abs/2609.33112", "authors": "Zhidi Lin ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr25", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "観測が雑音つきで不規則なときでも、ガウス過程で未知のドリフトを表す確率微分方程式（GP-SDE）を、シミュレーションなしで学習し状態を平滑化する変分法を提案した（抄録）。", "p3": "疎なガウス過程の事後分布を解析的に周辺化して、ドリフトの平均と不確かさの両方を考慮する扱いやすい目的関数を導き、実際の観測時刻を取り込む状態の変分事後分布を導入した（抄録）。", "p5": "確率的なLorenz-63系で、不規則な観測のもとでドリフトの復元と状態の再構成が大きく改善し、5つの系同定のベンチマークで観測が疎になっても頑健な予測を示した（抄録）。", "fun": "カオスのように予測の難しい動きを、とびとびで雑音まじりの観測から学ぶのは難しい。この研究は、動きの法則そのものを「不確かさつき」で学び、しかも重いシミュレーションなしで計算できるようにした。分からないことを分からないまま扱う点が面白い。", "unverified": "本文が入手できず、改善幅の数値と比較手法は確認できていない。"}}, {"rank": 26, "theme": "LLM熟議・ペルソナ", "headline": "LLMのペルソナ表現は曲がった空間にある", "title": "PersonaManifold: Revealing and Exploiting Curved Geometry in LLM Persona Representations", "url": "https://arxiv.org/abs/2609.34571", "authors": "Rui Xu ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr26", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "LLMのペルソナの内部表現は平らな空間の直線上ではなく、曲がった低次元の多様体上にあるとみなし、測地線に沿ってペルソナを補間する操作を提案した（抄録）。", "p3": "活性化空間でペルソナの表現の局所計量、測地距離、Ollivier-Ricci曲率を推定し、ユークリッドの直線補間の代わりに測地線で操作する（抄録）。6つの心理的構成概念に基づく状況質問で、行動の類似からペルソナの近さを定義するベンチマークも作った（抄録）。", "p5": "3つのオープンLLMで、ペルソナの活性化は曲率の不均一な多様体をなし、測地距離はユークリッド距離より行動の類似をよく予測したと述べる（抄録）。", "fun": "AIに「明るい人」「慎重な人」を演じさせるとき、これまでは性格を矢印の足し算のように扱っていた。ところが実際のAIの頭の中では、性格の空間は地球の表面のように曲がっていて、まっすぐ進むより曲面に沿って進むほうが自然だった。性格を幾何学で扱う発想が面白い。", "unverified": "本文が入手できず、測地線の操作の効果の大きさは確認できていない。"}}, {"rank": 27, "theme": "LLM熟議・ペルソナ", "headline": "ペルソナ効果はどこまで一般化するか", "title": "How Far Do Persona Effects Generalize in Language Models?", "url": "https://arxiv.org/abs/2609.32758", "authors": "Yufan Zhou ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr27", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "ペルソナ・プロンプトの効果から学んだ関係が、新しい質問や別のモデル・言い回しにどこまで持ち運べるかを、57の属性・3領域・7組のオープンモデルで検証した（抄録）。", "p3": "属性ごと・課題ごとの効果（ゲイン）を推定し、別のモデルや言い回しに借りてくる場合と、対象で再推定する場合を比べた（抄録）。", "p5": "ペルソナの効果は予測はできても持ち運べないことが多く、他のモデルから借りた効果は多くの方向で共通の尺度合わせに劣った（抄録）。反応の大きいモデルを選ぶと人間の調査との一致がかえって悪くなることがあり、温度の較正でその損失はほぼ消えたが、集団の順序の誤りは残った（抄録）。", "fun": "AIに「高齢者として答えて」と頼んだときの効果を一度測っても、別のAIや別の頼み方ではその効果がそのまま使えない。しかも、役によく反応するAIほど人間の調査結果に近いとは限らない。AIを人の代わりに使う調査の難しさがよく分かる研究だ。", "unverified": "本文が入手できず、各比較の効果量と検定の詳細は確認できていない。"}}, {"rank": 28, "theme": "LLM熟議・ペルソナ", "headline": "LLM社会調査シミュレーションの資源配分", "title": "Adaptive Resource Allocation for Effective and Efficient LLM Social Survey Simulation", "url": "https://arxiv.org/abs/2609.35216", "authors": "Yuanzi Li ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr28", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "LLMによる社会調査の模擬で、回答者と質問ごとに使うモデルと回答履歴の量を同時に選ぶ適応的な資源配分の枠組みE2Simを提案した（抄録）。", "p3": "ペルソナ、順位づけした回答履歴、対象の質問から、軽量な方策が各構成の精度とコストを予測して選ぶ（抄録）。履歴の削除・入れ替えの拡張と、易しい判断から難しい判断へ進むカリキュラム学習で頑健性を高めた（抄録）。", "p5": "4つの実際の社会調査データ、複数のモデル群、履歴量の設定で、最良の固定構成（事後的に選んだもの）を上回ったと述べる（抄録）。", "fun": "AIで大勢のアンケート回答者を演じさせるとき、全員に一番高性能なAIと長い過去の回答を使うのは無駄が多い。強いAIほど本人の情報より自分の知識に頼ることもある。人ごと・質問ごとに道具を選び分ける発想は、限られた予算で良い調査をするコツに似ていて面白い。", "unverified": "抄録が途中までしか読めず、精度の改善幅とコスト削減の数値は確認できていない。"}}, {"rank": 29, "theme": "LLM熟議・ペルソナ", "headline": "LLMは自分と同じ系統の意見に同調する", "title": "LLMs Trust Their Own: Identity-Dependent Conformity in Multi-Agent Systems", "url": "https://arxiv.org/abs/2609.33495", "authors": "Liron Soffer ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr29", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "複数のLLMエージェントの場で、相手が自分と同じ集団（同じAI系統など）か違う集団かによって、誤った多数意見への同調が変わることを12のオープンモデル・9課題で示した（抄録）。", "p3": "正解が一つの判断課題で、他のエージェントの誤答を示し、その社会的な属性（AIか人間か、モデルの系統、恣意的な最小集団）を自分と同じか違うかで操作した（抄録）。", "p5": "内集団の合意は同調を増やし（内集団びいき）、外集団の合意は同調を減らした（抄録）。人間と違い、多数派と同じ集団の味方が一人いても同調は減らず、対立する集団の正しい味方はむしろ効果を強めた（抄録）。思考連鎖の推論はほとんどの効果を抑えたが、内集団の味方は外集団の誤った多数への同調を減らした（抄録）。", "fun": "人は「仲間」の意見には流されやすく、「よそ者」の意見には反発しがちだ。この研究は、AIどうしでも「同じ系統のAI」の間違った意見には従い、「違う系統」の意見には逆らう傾向があることを見つけた。AIにも仲間意識のようなものが現れるのが面白い。", "unverified": "本文が入手できず、効果の大きさと安全性ラベルの影響の詳細は確認できていない。"}}, {"rank": 30, "theme": "LLM熟議・ペルソナ", "headline": "複数エージェントのエコーチェンバーの内部回路", "title": "Social Circuits behind Multi-agent Echo Chambers", "url": "https://arxiv.org/abs/2609.34444", "authors": "Chuiyang Meng ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr30", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "LLMエージェント間のメッセージが受け手の内部の活性化をどう変えて判断に影響するかを追跡する枠組み「Social Circuits」と、それを使って有用なメッセージを選ぶ熟議法CGDを提案した（抄録）。", "p3": "メッセージを変えたときの受け手の答えの変化を比べ、元のメッセージのもとでの活性化の一部を復元して、その活性化がメッセージの効果をどれだけ再現するかを調べる（抄録）。受け手の活性化の変化を使ってメッセージの選択を学習する（抄録）。", "p5": "受け手の活性化の変化がメッセージの効果を説明し、3モデル・4データセットでCGDは主要な比較で最高または同率最高の平均正解率を、多エージェントの基準より少ないトークンで達成したと述べる（抄録）。", "fun": "AIどうしが話し合うと、同じ間違いを強め合う「エコーチェンバー」が起きることがある。この研究は、相手のメッセージがAIの頭の中のどこを動かしたかを追跡して、役に立つ発言だけを選んで聞かせる方法を作った。会議で誰の話を聞くべきかをAIの脳の中から決める発想が面白い。", "unverified": "本文が入手できず、正解率の数値と比較手法は確認できていない。"}}, {"rank": 31, "theme": "LLM熟議・ペルソナ", "headline": "LLM社会の集団現象と安全性", "title": "Population Physics, Population Problems: Safety and Emergence in LLM Societies", "url": "https://arxiv.org/abs/2609.33871", "authors": "Adrian de Wynter", "venue": "arXiv", "date": "2026-09-29", "id": "pr31", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "LLMのエージェントの集団（社会）で生じる自己組織化を測る枠組みを作り、シェリングの格子、SNS、偽情報の模擬の3つの系で統計的に有意な自己組織化を示した（抄録）。", "p3": "LLMの社会システムの自己組織化の指標を定義し、シェリングの分居モデルの格子、SNS（Moltbook）、Twitter風の偽情報の模擬（Rogue）に適用し、共有地の問題（GovSim）とLLM審査員の熟議（ChatEval）も比べた（抄録）。", "p5": "3つの系すべてで有意な自己組織化があり、開かれた系（Moltbook、Rogue）では相転移のような急な緩和の動きを示した（抄録）。安全調整や監視をしても、一部の集団の協調的な行動によって集団レベルの病理が生じうる（抄録）。GovSimとChatEvalでは自己組織化は現れなかった（抄録）。", "fun": "一人ひとりのAIは安全に作られていても、たくさん集まると、ばらばらの足し算では説明できない集団の現象が生まれる。水が突然氷になる「相転移」のような急な変化まで見られた。物理学の見方でAIの社会を調べる点が面白い。", "unverified": "本文が入手できず、自己組織化の指標の定義と統計量の値は確認できていない。"}}, {"rank": 32, "theme": "LLM熟議・ペルソナ", "headline": "合成ペルソナ100万件の潜在クラス分析", "title": "Latent Class Analysis of Digital Content Use Contexts in AI-Generated Synthetic Personas", "url": "https://arxiv.org/abs/2609.33525", "authors": "Eunjeong Song", "venue": "arXiv", "date": "2026-09-29", "id": "pr32", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "NVIDIAの韓国語の合成ペルソナ100万件の記述から、デジタルコンテンツの使い方（視聴、発見・共有、交流、読書、聴取）を符号化し、潜在クラス分析でペルソナの利用文脈の類型を示した（抄録）。", "p3": "公開した韓国語の符号化辞書で5つの利用様式の言及を数え、分類誤差を考慮した3段階法で潜在クラス分析を行った（抄録）。", "p5": "視聴中心20.8%、読書中心3.8%、聴取中心2.1%、言及の少ない群73.3%の4クラスが得られた（抄録）。年齢の関連が最も強く、10歳上がるごとに視聴中心のオッズは0.15倍になり、視聴以外の言及は30歳未満の49.4%から70歳以上の2.3%に下がった（抄録）。性差は1ポイント未満、地域差は最大5.0ポイントだった（抄録）。", "fun": "AIが作った100万人分の「架空の人物紹介」に、動画を見る・本を読むといった話がどれくらい出てくるかを数えると、4人に3人はほとんど触れておらず、高齢の人物ほど動画以外の話が消えていた。合成された人物像に偏りがないかを点検する大切さが分かる。", "unverified": "本文が入手できず、符号化辞書の妥当性の検証方法は確認できていない。"}}, {"rank": 33, "theme": "LLM熟議・ペルソナ", "headline": "一括生成が合成データの変数関係を歪める", "title": "Shared Autoregressive Context Can Distort Relationships in Synthetic Data", "url": "https://arxiv.org/abs/2609.32546", "authors": "Thomas S. Robinson", "venue": "arXiv", "date": "2026-09-29", "id": "pr33", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "LLMに1回の生成で複数の回答者を続けて作らせると、先に生成した答えが文脈になって、合成データの変数間の関係（相関）が歪むことを統制実験で示した（抄録）。", "p3": "欧州社会調査の2,000人のプロフィールで、1回に1人と10人を生成させる条件を、プロフィール・例・質問・生成設定を固定して比べた（抄録）。先行する値の組を入れ替える介入で、答えの履歴が因果的な経路であることを確かめた（抄録）。", "p5": "1回に10人生成すると、国内の相関の平均絶対誤差がQwen3.8-27Bで48〜58%、Llama-3.3-70Bで114〜127%増えた（3シード）（抄録）。歪みは主に関係の強さの誇張で、相関の順序はかなり保たれた（抄録）。先行の答えを隠すと相関の誤差は減ったが、周辺分布の正確さが悪化した（抄録）。", "fun": "AIに架空のアンケート回答者を10人まとめて作らせると、前に書いた人の答えにつられて、項目どうしの関係が本当より強く出てしまった。一人ずつ作ると関係は正しくなるが、今度は答えの分布がずれる。「まとめて作る」という手抜きの落とし穴が見えて面白い。", "unverified": "本文が入手できず、他の分野（健康・経済）での補正の結果の数値は確認できていない。"}}, {"rank": 34, "theme": "LLM熟議・ペルソナ", "headline": "LLMは学習者の評価を再現できるか", "title": "How Well Can LLMs Simulate Real Learner Evaluations of Educational Feedback?", "url": "https://arxiv.org/abs/2609.35376", "authors": "Momoka Furuhashi ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr34", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "高校生物の問題へのフィードバックに対する実際の学習者の評価を、LLMが集団と個人の両水準でどれだけ模擬できるかを6つのモデルで調べた（抄録）。", "p3": "学習者の性格特性や評価の例などの個人情報を与える場合と与えない場合で、模擬の精度を比べた（抄録）。", "p5": "LLMの学習者評価の模擬能力はまだ限られていた（抄録）。プロフィールと例を与えると得点の較正と個人水準の模擬は改善したが、集団水準の一貫性は改善しないことが多かった（抄録）。", "fun": "先生のコメントを生徒がどう受け取るかを、AIに生徒のふりをさせて予測できれば便利だ。ところが実際の生徒の評価と比べると、AIの予測はまだ粗かった。一人ひとりの情報を教えると個人の予測は良くなるが、クラス全体の傾向は逆に合わなくなることもある、という結果が面白い。", "unverified": "本文が入手できず、モデル名と一致度の数値は確認できていない。"}}, {"rank": 35, "theme": "LLM熟議・ペルソナ", "headline": "討論蒸留の信頼性をブラックボックスで監査", "title": "Black-Box Auditing of Epistemic Reliability in Multi-Agent Debate Distillation", "url": "https://arxiv.org/abs/2609.32361", "authors": "Derui Wang ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr35", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "多エージェント討論の記録で弱い検証役を学習させる「討論蒸留」で、監視している課題の性能は保ったまま隠れた課題の正答の支持が落ちる「認識的信頼性の劣化」を、ブラックボックスで監査する手法ER-Auditを提案した（抄録）。", "p3": "正しい答えを擁護しつつ議論を操作する敵対的な討論者を考え、適応の前後の検証役を比べる2段階の監査を行う（抄録）。意味の同じ言い換えで反例を探し、見つからなければ逐次検定で、劣化しない確率の常時有効な下側信頼限界を出す（抄録）。", "p5": "監視課題と隠れた課題を対にした2つのベンチマークを作り、劣化が単なる破滅的忘却かどうかと、標準の評価で見抜けるかを検証したと述べる（抄録）。結果の数値は抄録の読めた範囲にない。", "fun": "AIに議論の記録から学ばせて審判役を育てるとき、試験に出る問題では成績が良いのに、出ない問題では密かに判断が悪くなることがある。その見えない劣化を、質問の言い換えを使って確かめる監査の方法を作った。抜き打ち検査の数学的な保証をつけた点が面白い。", "unverified": "本文が入手できず、監査の検出力と実験結果の数値は確認できていない。"}}, {"rank": 36, "theme": "会計情報科学", "headline": "サプライヤー・ファイナンス開示の比較可能性", "title": "Supplier Finance Disclosures After the IAS 7 Amendments: Comparability and Analytical Limita-tions in Five European Consumer Groups", "url": "https://doi.org/10.20944/preprints202609.2463.v1", "authors": "Radosveta Krasteva-Hristova ほか", "venue": "Preprints.org", "date": "2026-09-29", "id": "pr36", "explain": {"basis": "抄録", "basis_note": "Preprints.orgの本文は取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": true, "short": true, "p1": "IAS 7の改正後のサプライヤー・ファイナンス（買掛金の支払を金融機関に肩代わりさせる取り決め）の開示を、欧州の消費財5社の報告書で比べ、比較可能性と分析上の限界を示した（抄録）。", "p3": "カールスバーグ、ヘイリオン、ハイネケン、ネスレ、ユニリーバの2024〜2025年の連結報告書を比べ、開示された取り決めの規模、支払済みの額、自社の支払条件を分けて読む（抄録）。支払済みの比率×対象額/買掛金＝金融化比率という恒等式に注意した（抄録）。", "p5": "2025年の対象負債のうち支払済みの割合はヘイリオン54.5%からカールスバーグ85.0%まで幅があり、買掛金で割るとハイネケンとユニリーバの順位が逆転した（抄録）。ネスレでは取り決め内の120日超の残高が取り決め外より約53ポイント多く、1社は比率の分子と分母が同じ会計上の母集団から取られていなかった（抄録）。", "fun": "会社が取引先への支払いを銀行に立て替えてもらう仕組みは、見かけの借金を小さく見せることがあるため、新しく開示が求められた。ところが同じ基準の開示でも、会社ごとに数字の取り方が違い、単純に比べると順位が逆転してしまう。数字を並べる前に中身をそろえる大切さが分かる。", "unverified": "本文が入手できず、提案された段階的な分析手順の詳細は確認できていない。"}}, {"rank": 37, "theme": "会計情報科学", "headline": "会計業務のエージェントAIと内部統制", "title": "Evidence-Grounded Agentic AI for Sensitive U.S. Accounting Workflows: Autonomy Boundaries, Escalation, and Internal Control", "url": "https://doi.org/10.2139/ssrn.7534458", "authors": "Datis Panahi", "venue": "SSRN", "date": "2026-09-29", "id": "pr37", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": true, "short": true, "p1": "米国の会計業務（買掛金、照合、仕訳、見積り）でAIエージェントが自動で処理してよい場合、人の確認が要る場合、専門的判断に委ねる場合、止まるべき場合を、権威ある基準に基づいて4つに振り分ける枠組みを作った（抄録）。", "p3": "取引のリスク、重要性、証拠の質、統制上の制約、判断の度合いを、FASB・SEC・PCAOB・COSOなどの資料に基づいてAUTO・REVIEW・JUDGMENT・STOPに対応させる多エージェント構成（EGAA）と枠組み（A3F）を作り、4業務96件の均衡したベンチマークで4つの構成を比べた（抄録）。", "p5": "根拠を持たない汎用のエージェントは判断の正解率27.1%で、すべての事例で存在しない基準を引用し、判断や停止が必要な項目の44.8%で自律的に処理してしまった（抄録）。", "fun": "会計の仕事にAIを入れるとき、「AIに任せてよい仕事」と「人が判断すべき仕事」の線引きが大事になる。根拠の資料を持たないAIは、存在しない会計基準を平気で引用し、止まるべき場面の4割以上で勝手に処理してしまった。線引きの仕組みがないAIの危うさがよく分かる。", "unverified": "抄録が途中までしか読めず、根拠つきの構成の正解率は確認できていない。"}}, {"rank": 38, "theme": "会計情報科学", "headline": "行動に基づく意味づけで金融不正を推論", "title": "Behavior-Grounded Semantic Enrichment for Financial Fraud Modeling and Reasoning", "url": "https://arxiv.org/abs/2609.34211", "authors": "Linbo Shao ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr38", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "プライバシーのため意味情報が乏しい実際の金融取引データに、取引の行動に基づく解釈可能な意味情報を多エージェントで付け加え、多モーダルな金融不正のデータセットMS-FFSDを作った（抄録）。", "p3": "役割の異なるエージェントと一貫性の精練で、取引の行動に根ざした構造化・文章の意味情報を生成し、実データの取引行動を保ったまま付加した（抄録）。", "p5": "統計的な忠実度と枠組みの汎用性が示され、豊かな意味情報は不正のモデル化と文脈を踏まえたLLMの推論に役立ったと述べる（抄録）。", "fun": "本物の金融取引のデータは個人情報のため中身の説明が消されていて、AIが「なぜ怪しいか」を考える材料が少ない。この研究は、取引の動きそのものに合うように説明文をAIに書き足させ、行動の本物らしさを保ったまま不正検知の練習台を作った。", "unverified": "本文が入手できず、不正検知の精度の改善幅は確認できていない。"}}, {"rank": 39, "theme": "会計情報科学", "headline": "差分プライバシーで作る財務監査ベンチマーク", "title": "FinancialAuditBench: Benchmark Construction under Differential Privacy Using Real-World Priors", "url": "https://arxiv.org/abs/2609.32835", "authors": "Jerry Huang ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr39", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "財務諸表監査の作業でAIエージェントを評価するベンチマークFinancialAuditBenchと、過去の監査の差分プライバシーつき集計統計から合成の監査案件を作る枠組みを示した（抄録）。", "p3": "過去の監査の差分プライバシーの集計値と、1,100時間超の専門家の作業で、6つの合成監査案件（平均179ファイル）と、調書の作成・査閲の90課題を作った（抄録）。", "p5": "11の最先端モデルの評価で、エージェントはスタッフ水準の監査作業のかなりの部分をこなすが、不適切な手続きを行ったり誤った文書を作ったりすることがあった（抄録）。", "fun": "監査の練習問題を作るには本物の会社のデータが要るが、秘密なので使えない。そこで過去の監査の統計を、個人や会社が特定できないよう「ぼかして」使い、本物らしい架空の監査案件を作った。秘密を守りながら現実的な試験を作る工夫が面白い。", "unverified": "本文が入手できず、モデル別の得点は確認できていない。"}}, {"rank": 40, "theme": "会計情報科学", "headline": "ESG開示の会計業績と市場評価への逆の効果", "title": "Cost-Benefit Paradox of Esg Disclosure: Diverging Effects on Accounting Performance, Market Valuation and the Role of Government Ownership", "url": "https://doi.org/10.2139/ssrn.7528878", "authors": "Dung Tran ほか", "venue": "SSRN", "date": "2026-09-29", "id": "pr40", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": true, "short": true, "p1": "ベトナムの上場300社（2018〜2023年）で、ESG開示が会計上の業績と市場評価に逆向きの関係を持ち、政府の持ち株がそれを調整するかを調べた（抄録）。", "p3": "企業・年の固定効果モデルで1年遅れのESG開示を説明変数とし、ラグ構造を変えた頑健性の検討と動学的GMMで補った（抄録）。", "p5": "ESG開示は会計業績と負に、市場評価（特にPBR）と正に関連した（抄録）。3つの柱に分けるとすべて会計業績と負に関連し、トービンのQとPBRの両方に正に関連したのは社会の開示だけだった（抄録）。", "fun": "環境や社会への取り組みを詳しく開示すると、手間とお金がかかって目先の利益は減るのに、株式市場ではかえって高く評価された。コストとごほうびが別の場所に現れる「逆説」を、新興国のデータで確かめた研究である。", "unverified": "抄録が途中までしか読めず、政府の持ち株の調整効果の結果は確認できていない。"}}, {"rank": 41, "theme": "会計情報科学", "headline": "多エージェントの記号回帰で企業価値を発見", "title": "Self-Evolving Multi-Agent Symbolic Discovery for Financial Fundamental Analysis", "url": "https://arxiv.org/abs/2609.32746", "authors": "Kelvin J. L. Koa ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr41", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "企業価値の評価式を記号回帰で探すため、評価の視点ごとの専門エージェント、市場の文脈を推論するメタ調整役、統計的成績の記憶を持つ階層的な多エージェントの枠組みMUFASAを提案した（抄録）。", "p3": "異なる評価の視点を持つエージェントが別々に式を探し、メタ調整役が市場の文脈で統合し、精度・安定性・裾のリスクなどの要約を記憶として雑音の多い評価のもとで学習を導く（抄録）。", "p5": "複数国のデータで、古典的な財務手法、金融特化のLLM、記号回帰の手法より良い評価性能を示し、解釈可能な式も得たと述べる（抄録）。", "fun": "物理なら正しい式は一つだが、会社の価値の測り方には、見る人の立場によっていくつもの正解がありうる。そこで、視点の違うAIの専門家チームに別々に式を探させ、まとめ役が市場の状況に合わせて組み合わせた。人間のアナリストの議論を模した仕組みが面白い。", "unverified": "本文が入手できず、使ったデータの国と性能の数値は確認できていない。"}}, {"rank": 42, "theme": "サービス・マーケティング", "headline": "共感が伝わるインフルエンサーは売れるか", "title": "When Perceived Empathy Sells: Multimodal Evidence from TikTok Influencers", "url": "https://doi.org/10.2139/ssrn.7530660", "authors": "Xueming Luo ほか", "venue": "SSRN", "date": "2026-09-29", "id": "pr42", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": true, "short": true, "p1": "TikTokのインフルエンサーのライブ配信約4,000本と、事前登録の実験（顧客6,000人の無作為化フィールド実験を含む）で、視聴者が感じる共感と売上の関係を調べた（抄録）。", "p3": "音声・言語・映像の相互作用を統合する解釈可能な多モーダルのグラフ深層学習で、知覚された共感を予測し、購入との関係を分析した（抄録）。因果を確かめるため事前登録の実験も行った（抄録）。", "p5": "一貫して逆U字の関係が見られ、ある程度の共感は売上を伸ばすが、多すぎると商品を売るための演技と受け取られて逆効果になった（抄録）。", "fun": "インフルエンサーは視聴者に寄り添うほど物が売れそうだが、共感を見せすぎると「売りたいから演じているだけ」と見抜かれて売上が落ちた。ほどほどが一番という逆U字の関係を、動画の声・言葉・表情をまとめて読むAIと実験の両方で確かめた点が面白い。", "unverified": "本文が入手できず、効果の大きさと逆U字の頂点の位置は確認できていない。"}}, {"rank": 43, "theme": "包摂的コミュニティ・社会", "headline": "都市の人種分離は一日のうちに変わる", "title": "Daily Dynamics of Urban Racial Segregation in the United States", "url": "https://doi.org/10.31235/osf.io/jyf9g_v1", "authors": "Cody Arlie Reed", "venue": "SocArXiv", "date": "2026-09-29", "id": "pr43", "explain": {"basis": "抄録", "basis_note": "SocArXivの本文は取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": true, "short": true, "p1": "携帯電話の位置データで、米国の18の大都市圏の人種的な分離が一日の時間帯と曜日でどう変わるかを測り、都市社会学の3つの見方（社会的孤立、強いられた移動、コスモポリタニズム）を比べた（抄録）。", "p3": "2020年1月の18日分の携帯の追跡データを2020年国勢調査の居住地区の人種構成と結びつけ、タイルの多集団分離指数で1時間ごとの分離を推定した（抄録）。", "p5": "分離は夜間に最も高く、平日の勤務時間に下がり、週末は平日より概して高かった（抄録）。これは、仕事などのために近隣を越えて移動すると分離が下がるという「強いられた移動」の見方に最も合い、金・土曜の夜は水曜の同じ時刻より分離が低く、コスモポリタニズムを部分的に支持した（抄録）。", "fun": "住む場所は人種ごとに分かれていても、昼間は仕事で人が混ざり、夜になると再び分かれる。スマホの位置データで街の「混ざり具合」を1時間ごとに測ると、分離は一日の中で波のように変わっていた。社会の分断を時間で見る発想が面白い。", "unverified": "本文が入手できず、各都市圏の分離指数の値は確認できていない。"}}, {"rank": 44, "theme": "包摂的コミュニティ・社会", "headline": "孤独と飲酒の日々の関係：8週間の追跡", "title": "Daily loneliness and alcohol use in Alcohol Use Disorder: an 8-week EMA study of within-person associations", "url": "https://doi.org/10.31234/osf.io/46ty8_v1", "authors": "Anja Kräplin ほか", "venue": "PsyArXiv", "date": "2026-09-29", "id": "pr44", "explain": {"basis": "抄録", "basis_note": "PsyArXivの本文は取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": true, "short": true, "p1": "アルコール使用障害の成人を8週間毎日追跡し、日々の孤独感と飲酒の個人内の双方向の関係、それが社会的接触・気分・年齢・性別で変わるかを調べた（抄録）。", "p3": "ドイツで2025年の冬から2026年の初夏まで（December 2025〜June 2026）に、DSM-5の基準を2つ以上満たす58人（男性74%、平均48.8歳）に、スマートフォンで毎日の飲酒の有無と量、孤独感、社会的接触、支援、気分を尋ね、固定効果パネル回帰と多層モデルで分析した（抄録）。", "p5": "結果の記述は抄録の読めた範囲に含まれていない。", "fun": "寂しいとお酒を飲み、飲むとさらに孤立して寂しくなる、という悪循環はよく語られる。この研究は、同じ人の中で「寂しい日は飲むのか」「飲んだ翌日は寂しいのか」を毎日の記録で確かめようとした。人と人を比べるのでなく、一人の日々の変化を見る方法が面白い。", "unverified": "抄録が途中までしか読めず、結果（関連の向きと大きさ）は確認できていない。"}}, {"rank": 45, "theme": "包摂的コミュニティ・社会", "headline": "包摂的なコミュニティ・ラボの方法と指針", "title": "Best practices, methods and guidelines for inclusive community labs", "url": "https://doi.org/10.5281/zenodo.23044490", "authors": "Woods, Mel", "venue": "Zenodo", "date": "2026-09-29", "id": "pr45", "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された報告書の説明文のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "欧州のUrban ReLeafプロジェクトで、環境データを市民が触れやすい文化・地域の体験に変える「コミュニティと文化のポップアップ・ラボ」の設計・実施と暫定的な適用をまとめた成果報告書である（抄録）。", "p3": "構造化されつつ柔軟な創造的委託の枠組みを示し、6都市での初期の実施から参加型の都市ガバナンスへの統合の知見をまとめた（抄録）。", "p5": "具体的な成果の数値は説明文にない。報告書は審査を経ていない成果物である。", "fun": "大気や緑のデータは、そのままでは市民にとって分かりにくい。そこで、アートや地域の催しを通して環境データを体験できる「期間限定の実験室」を街に作り、誰でも参加できる街づくりにつなげる方法を整理した。データと文化をつなぐ試みとして面白い。", "unverified": "本文が入手できず、6都市の事例の内容と評価は確認できていない。"}}, {"rank": 46, "theme": "都市・インフラ政策", "headline": "小さな町と農村のデジタルツイン", "title": "Digital Twins for Small Towns and Rural Regions: Data Integration, Simulation and Visualisation Across Three Use Cases in Lower Austria", "url": "https://arxiv.org/abs/2609.31623", "authors": "Thomas Delissen ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr46", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "大都市に偏ってきたデジタルツインを、データ・予算・デジタル人材の乏しい小さな町や農村向けに適応させ、オーストリア・ニーダーエスターライヒ州の3つの試作で実現可能性を示した（抄録）。", "p3": "自治体とのワークショップから、交通流の計画（データ統合）、人口増加（シミュレーション）、共有空間（可視化）の3つの用途を選び、デザインサイエンスの方法で試作し技術的に評価した（抄録）。", "p5": "資源の限られた環境でのデジタルツインの可能性と固有の限界を示し、非都市部の自治体・政策担当者向けの実務的な指針を述べる（抄録）。", "fun": "「スマートシティ」や街のデジタルの分身は大都市の話と思われがちだが、データも予算も少ない小さな町でこそ役立つ場面がある。交通、人口、広場の使い方の3つで試作し、できることとできないことを正直に整理した点が参考になる。", "unverified": "本文が入手できず、技術評価の具体的な指標は確認できていない。"}}, {"rank": 47, "theme": "都市・インフラ政策", "headline": "貨物OD行列を多解像度で推定", "title": "Bridging the freight data deficit: An integrated multi-resolution OD matrix inference architecture and survey shelf-life metric", "url": "https://doi.org/10.21203/rs.3.rs-10512032/v1", "authors": "Wei Sun ほか", "venue": "Research Square (In Review)", "date": "2026-09-29", "id": "pr47", "explain": {"basis": "抄録", "basis_note": "Research Squareの本文は取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": true, "short": true, "p1": "古い調査と起終点の分からない交通量しかないデータの乏しい環境で、道路貨物の起終点（OD）行列を多解像度で推定する枠組みと、調査の「賞味期限」を測る指標を提案した（抄録）。", "p3": "古い調査に直接合わせる代わりに、条件付きで投影した構造的な事前分布を単一段階の較正に組み込み、粗い集計区域と細かい道路網の間に中間の較正地理を置き、階層的な正則化で根拠のない局所的な再配分を抑えた（抄録）。", "p5": "閉じた道路網を持つオーストラリアのタスマニア州で、妥当性を保った2024年のOD推定を得たと述べる（抄録）。", "fun": "巨額の道路投資を判断するのに、トラックが「どこからどこへ」走っているかのデータは古い調査しかないことが多い。この研究は、古い調査を上手に「賞味期限」を見ながら使い、今の交通量と矛盾しない行き先の表を作る方法を考えた。島という閉じた道路網を実験場にした点が面白い。", "unverified": "抄録が途中までしか読めず、推定精度の数値と調査の賞味期限の指標の値は確認できていない。"}}, {"rank": 48, "theme": "都市・インフラ政策", "headline": "地図を編集して人の移動を生成", "title": "Editable Map-Conditioned Trajectory Generation for Human Mobility Simulation", "url": "https://arxiv.org/abs/2609.32360", "authors": "Takayuki Mizuno ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr48", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "道路の地図を編集すると、それに応じた人の移動軌跡を生成できる、地図を条件とする自己回帰の移動生成モデルを作り、石川県のスマートフォン由来の軌跡で検証した（抄録）。", "p3": "道路のラスタ画像を条件に、31.25mのメッシュのトークンを1分ごとに出力するデコーダを、ResNet-50の視覚接頭辞とViTの交差注意の2構成で、874メッシュの87,400軌跡から学習した（219メッシュは検証用）（抄録）。", "p5": "ResNet-50構成では、正しい地図での生成は110メッシュの60%で入れ替えた地図より実軌跡に近く（p=0.021）、実際の密度との相関は正しい地図で0.38、入れ替えた地図で0.01だった（抄録）。DTWでは方向は同じだが結論は出ず、ViT構成の感度は弱かった（抄録）。", "fun": "新しい道を作ったら人の動きはどう変わるかを、地図を描き換えるだけでAIに予測させたい。この研究は、スマホの移動データで学ばせ、地図に合わせて人の動きを生成させた。正しい地図を与えたときだけ実際の人の混み具合と合う、という確かめ方が分かりやすい。", "unverified": "本文が入手できず、ViT構成の詳細な結果と地図編集の実例は確認できていない。"}}, {"rank": 49, "theme": "職場AI・組織行動", "headline": "人とAIの協働を設計する枠組み", "title": "Working with AI: A Design Framework for Human-AI Collaboration", "url": "https://arxiv.org/abs/2609.31793", "authors": "Yuqian Lu ほか", "venue": "arXiv", "date": "2026-09-29", "id": "pr49", "explain": {"basis": "抄録", "basis_note": "arXivの抄録のみを読んだ（本文は取得できず）", "preprint": true, "short": true, "p1": "産業の現場で人とAIの協働をどう設計すべきかについて、人・AIシステム・課題・組織・社会の5つの観点を含む実務的な設計枠組みを示した白書である（抄録）。", "p3": "効果的な協働の姿、影響する条件、満たすべき要件、組織が検討すべき設計上の判断を整理し、協働ロボットを使った組立システムの事例で、要件を具体的な協働機能に落とし込み評価した（抄録）。", "p5": "事例研究で枠組みの適用例を示したと述べる（抄録）。定量的な結果は抄録にない。", "fun": "AIを職場に入れるとき、機械の性能だけでなく、人がどう感じ、どう一緒に働くかが成否を分ける。この白書は、人・AI・仕事・組織・社会の5つの目で協働を設計する手順をまとめ、ロボットと人が一緒に組み立てる現場で試した。設計図を作ってから導入する発想が参考になる。", "unverified": "本文が入手できず、事例の評価の方法と結果は確認できていない。"}}, {"rank": 50, "theme": "職場AI・組織行動", "headline": "変革型リーダーシップと従業員のAI採用", "title": "Influence of Transformational Leadership on Employees' AI Adoption in a Retail Company in Laguna, Philippines", "url": "https://doi.org/10.2139/ssrn.7534560", "authors": "Clariza Briones ほか", "venue": "SSRN", "date": "2026-09-29", "id": "pr50", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録のみを読んだ", "preprint": true, "short": true, "p1": "フィリピンの小売企業の従業員62人の全数調査で、変革型リーダーシップと従業員のAI採用（意欲、頻度、業務への統合）の関係を調べた（抄録）。", "p3": "検証済みの4件法の質問紙をGoogleフォームで配り、度数・割合・加重平均とピアソンの相関係数で分析した記述的・相関的な研究（抄録）。", "p5": "4つのリーダーシップの側面はいずれも強く認められ、従業員のAI採用の意欲も高かったが、利用頻度は3つの側面で最も低く、AIは業務に組み込まれず補助にとどまっていた（抄録）。リーダーシップと採用の3側面の間に有意な関係はなかった（抄録）。", "fun": "上司が「AIを使おう」と熱く語れば部下もAIを使うようになると思いがちだが、この小さな会社の調査では、上司の評価と部下のAIの使い方には関係が見られなかった。やる気はあっても毎日の仕事に入り込むには、別の条件が要るのかもしれない。", "unverified": "本文が入手できず、相関係数の値は確認できていない。標本が62人と小さい点に注意が要る。"}}], "pre_notable": [{"rank": 1, "field": "経済学", "headline": "AIによる難民の配置で就労が増えた二重盲検試験", "title": "AI-based matching improves refugee employment in a double-blind randomized trial", "url": "https://arxiv.org/abs/2609.35448", "authors": "Kirk Bansak ほか", "venue": "arXiv", "date": "2026-09-29", "why": "アルゴリズムによる難民の配置先選びを二重盲検のランダム化試験で評価し、就労が改善したことを示した大規模な政策実証。", "id": "pn01", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（主な処置効果と表1、考察、方法のうち推奨システムの節）を読んだ。分布分析・副次的結果・付録は読んでいない", "preprint": true, "p1": "スイス政府が難民の配置先の州を決める際に、就労の見込みが最も高くなる州を機械学習と制約つき最適化で推奨する仕組み（GeoMatch）を、担当官と難民に割り当てを伏せた二重盲検のランダム化試験で評価し、3年間の就労が約1割増えることを示した（抄録）。", "p2": "難民の最初の配置先は統合の道筋を左右するが、担当官は各ケースがどこで成功しやすいかの情報を十分に持たない（抄録）。アルゴリズムによる配置の提案は関心を集めていたが、過去データでの逆算の評価にとどまり、ランダム化試験での検証はなかった（考察）。", "p3": "州ごとに勾配ブースティング木で、性別・到着時の年齢・婚姻・ケースの人数・国籍・母語などから3年間の就労割合を予測し、州と出身集団の定員の制約のもとで就労の見込みが最大になる州を到着のたびに推奨する（方法）。最終決定は担当官が行う（抄録）。比較群は既存の手続きに近い推奨を受け、両群は同じだが別々の定員を持つので、効果は労働市場の強い州への偏りではなく組み合わせの改善を表す（抄録）。", "p4": "2020年1月〜2023年6月に約2,000ケースを無作為に割り付けた（抄録）。事前登録した主要結果は配置後3年間の就労月の割合で、意図した処置による効果（ITT）と、実際に推奨どおり配置された場合の効果（LATE）を推定した（表1）。推奨どおりの配置は無作為化で約88ポイント増え、第一段階は強かった（§主要な効果）。", "p5": "全コホートのITTは+2.2ポイント（対照群の平均22.3%に対し約10%増、95%CI +0.05〜+4.33、p=0.045）、LATEは+2.5ポイントだった（表1）。コロナ禍のピークを除く2021〜2023年では+2.71ポイント、コロナ後の2022〜2023年では+3.9ポイント（約17%）に上がった（表1、抄録）。効果は時間とともに増え、36か月時点の就労率は+5.2ポイント（約11%）で、数百時間の集中的な語学研修に匹敵すると著者は述べる（抄録）。", "p6": "著者は、試験がコロナ禍と重なったこと、予測に使う変数が少なく、均衡の制約と定員で最適化できたのが件数・枠の約半分だったことから、手法の制限された版の評価だとする（考察）。解釈：信頼区間の下限は0に近く、効果の大きさには不確かさが残る。未査読のプレプリントである。", "fun": "難民をどの州に住んでもらうかを、AIが「この人はこの州なら仕事が見つかりやすい」と予測して提案する。担当者も本人もどちらの提案かを知らないまま比べた結果、仕事をしている期間が1割ほど増えた。薬の効き目を確かめるのと同じ方法で、行政のAIの効果を確かめた点が画期的で面白い。", "unverified": "費用対効果の計算の詳細（付録S12）と、事前の逆算の予測との比較（付録S13）は確認していない。"}}, {"rank": 2, "field": "機械学習", "headline": "事後学習は無関係な判断にも痕跡を残す", "title": "Post-Training Leaves Behavioral Shadows on Unrelated Decisions", "url": "https://arxiv.org/abs/2609.29233", "authors": "Ziyang Zhang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-09-29", "why": "言語モデルの事後学習の効果が、課題と無関係な文章を通じて別のモデルに移ることを示し、学習データの安全性に関わる発見。", "id": "pn02", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、問題設定、手法、§5.1の主結果と表1、§5.5）を読んだ。§5.2〜5.4の頑健性・一般化の数値は読んでいない", "preprint": true, "p1": "公開モデルを非公開で事後学習した「教師」に、課題と無関係な文で2つの普通の単語のどちらを選ぶかを1語だけ答えさせ、その選択だけを同じ祖先から始めた「生徒」に学ばせると、教師のコーディング能力などの一部が移ることを示した（抄録、§1）。", "p2": "事後学習の効果は、対象課題の振る舞いの変化として理解されてきた（§1）。無関係な生成を通じて特性や好みが移る「潜在学習（subliminal learning）」は知られていたが、教師の長い出力を大量に使うものが中心で、能力そのものが少量の無関係な判断から移るかは分かっていなかった（抄録）。", "p3": "公開の祖先モデルM0が2語にほぼ同じ確率（差±0.02以内）を与える「ほぼ引き分け」の無関係な文を選ぶ（§4）。引き分けの近くでは、事後学習による小さな好みの変化でも選ぶ語が入れ替わるので、教師の1語の答えは更新の方向の1ビットの観測になる（式2〜4）。生徒はこの文と語の組だけで学び、対象課題の例、教師のロジット、パラメータは使わない（§3）。", "p4": "主実験はQwen2.5-1.5Bでコーディングの教師を作り、HumanEval+（実行で採点）で評価した（§5.1）。対照は、同じ文・同じ語の集合を使い文と語の対応だけを崩す「完全に撹乱を揃えた置換」、教師の答えの入れ替え、教師なし（祖先の答え）などで、4シードの区間を出した（表1）。", "p5": "生徒はHumanEval+で51.22%に達し、完全対照を+5.34ポイント（95%CI 1.22〜9.60）、入れ替え対照を+5.03、教師なしを+4.57上回った（§5.1、表1）。一方、HumanEval+の解答を暗記した教師（差+39.02ポイント）や暗号を注入した教師は、大きな差があっても能力が移らなかった（§5.5、表3b）。能動的に引き分けの文を選ぶと受動的な選び方より+4.27〜+5.03ポイント良かった（表3a）。", "p6": "解釈：同じ公開の祖先を共有する教師と生徒という前提が必要で、主な検証は小さなモデル（1.5B程度）である。移るのは生徒がすでに引き出せる能力に限られるようで、非公開モデルの能力の抽出や安全性への含意は今後の議論を要する。未査読のプレプリントである。", "fun": "コードが書けるように鍛えたAIに、物語の中の「どちらの単語を使う？」という、プログラムと全く関係ない質問にだけ答えさせる。その答えを数千個まねさせるだけで、別のAIのプログラミングの成績が上がった。鍛えたことの影が、無関係な言葉の好みにまで落ちている。見えない情報の漏れ方として、驚きと少しの怖さがある。", "unverified": "他のモデル世代・系統での一般化の数値（§5.3）と、5つの独立取得での頑健性の区間（§5.2）は確認していない。"}}, {"rank": 3, "field": "経済学", "headline": "少数の声高なコメントが百万人の意見を動かす", "title": "The Influence of the Vocal Few: Evidence from Social Media Comments", "url": "https://arxiv.org/abs/2609.32880", "authors": "Dante Donati ほか", "venue": "arXiv", "date": "2026-09-29", "why": "約100万人に届くFacebookの投稿でコメントの有無と立場をランダム化した大規模なフィールド実験。", "id": "pn03", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論で要約された2つの実験の設計と主結果）と抄録を読んだ。第5〜6節の表と付録は読んでいない", "preprint": true, "p1": "人種的公正の団体のFacebook投稿の下に表示されるコメントの有無と立場を、約100万人の米国ユーザーでランダム化した大規模なフィールド実験で、少数の声高なコメントが多くの人の反応・態度・寄付を動かすことを因果的に示した（抄録）。", "p2": "SNSのコメント欄は広く読まれるが（調査で86%が少なくとも時々読む）、書くのは偏った少数である（§1）。早くコメントがつく投稿はもともと魅力的で、アルゴリズムも注目の集まる投稿を広めるため、コメントの効果を投稿そのものの効果から切り分けるのは難しかった（§1）。", "p3": "まず約13.5万人に広告配信して実際のコメントを集め、次に同じ投稿を、見たことのない人に2件のコメントつきで再配信した（§1）。MetaのA/Bテスト機能で、18のZIPコード群ごとに、①コメントなし、②支持のみ、③反対のみ、④支持と反対1件ずつ、の4条件に割り付けた（§1）。新しいコメントは実時間で隠し、共有数や反応数を条件間でそろえ、予算均等・1人1回表示・到達最適化で配信の偏りを抑えた（§1）。態度と寄付はProlificの調査実験で補った（§1）。", "p4": "結果は、投稿の展開、反応・コメント・共有、団体サイトへのクリック（プラットフォーム上）と、団体や論点への認識、報酬つきの寄付額（調査実験）である（§1、§5.2、§6.2）。事前登録の分析計画に沿って推定した（抄録、付録B）。", "p5": "コメントがあると投稿への関与全体が0.065ポイント（基準比13%）増えた（§1）。反対コメントは、コメントなしに比べてコメント・反応・共有を約43%、クリック率を0.034ポイント（15%）増やし、支持コメントの効果は小さかった（§1、抄録）。効果は保守的な地域で大きかった（§1）。調査実験では、反対コメントは態度を進歩的でない方向へ動かし、寄付を7.2%減らした（§1）。", "p6": "解釈：論点は人種的公正の1団体に限られ、広告配信という形の露出で、通常の投稿の閲覧と同じとは限らない。広告単位のデータでは、立場の一致の効果と注意の差を分けられないと著者は述べる（§1）。未査読のプレプリントである。", "fun": "SNSの投稿の下に反対意見のコメントが2件あるだけで、「いいね」やコメントは4割も増えたのに、読んだ人の態度はその団体に冷たくなり、寄付は減った。盛り上がっているように見えても応援にはなっていない、というねじれが面白い。書き込むのはごく一部の人なのに、その声が大勢の行動を変えてしまう。", "unverified": "第5〜6節の回帰表の詳細（係数と標準誤差）と、地域の政治的傾向別の推定値は確認していない。"}}, {"rank": 4, "field": "統計学", "headline": "予測分布を使う予測強化推論", "title": "Beyond Point Predictions: Distribution-Informed Prediction-Powered Inference", "url": "https://arxiv.org/abs/2609.32006", "authors": "Maoyu Zhang ほか", "venue": "arXiv", "date": "2026-09-29", "why": "予測値だけでなく予測分布を使って、少数のラベルと大量の予測から効率的に推論する枠組み（LLMの予測にも適用）。", "id": "pn04", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、§2.1〜2.2の定理1と式5、§4の実データ実験）を読んだ。証明（付録B）と模擬実験の図の数値は読んでいない", "preprint": true, "p1": "少数のラベルつきデータと大量の予測を組み合わせて推論する「予測強化推論（PPI）」を、予測値（点）だけでなく予測分布（LLMが出す評点の確率分布など）を補助情報に使うよう拡張し（DiPPI）、信頼区間を短くできることを理論と実データで示した（抄録）。", "p2": "高価な測定やラベル付けのため、応答は小さな標本でしか観測されず、LLMなどの予測をそのまま使うと推定が偏る（§1）。PPIは予測をラベル標本で補正して妥当な推論を可能にしたが、予測分布を平均や最頻値の点に縮めるため、推定に役立つ情報を捨てている可能性があった（§1）。", "p3": "推定方程式の期待値を「ラベル標本でのU−h」と「全標本でのh」の和に分解し（式1）、hとして共変量Xと予測分布Qが与えられたときの推定関数の条件付き期待値E[U|X,Q]を使うと漸近分散が最小になる（定理1、式3〜4）。これを交差適合で勾配ブースティングにより推定する（§2.3）。例えば多項ロジットではスコアがクラス確率そのものに依存するので、分布を点に縮めると情報が失われる（§2.2）。", "p4": "模擬実験と3つの実データで、ラベルのみの推定、PPI++、RePPI（点予測を再較正する方法）と比べた（§3〜4）。ワインの評点（1万件、GPT-5.4 nanoが20段階の評点分布を出す）、森林被覆の種類（XGBoostのクラス確率）、依頼文の丁寧さ（25段階）で、ラベル比率を変えて200回繰り返し、相対RMSE、95%信頼区間の幅、被覆率を評価した（§4）。", "p5": "3つの実データのすべてのラベル比率で、DiPPIは相対RMSEが最も小さく、信頼区間が最も短く、被覆率は名目の95%に近かった（§4.1〜4.3、図2）。理論上、DiPPIはラベルのみの推定より悪くならず、条件付き期待値を一貫して推定できれば枠組み内で最小の漸近分散を達成する（§1、定理1）。", "p6": "著者によれば、改善は予測分布が点予測では失われるスコア関連の情報を持つときに限られ（抄録）、平均だけで条件付き期待値が決まる場合は利得がない（§2.2）。解釈：図の具体的な改善幅は本文の図2から読み取る必要があり、ここでは確認していない。未査読のプレプリントである。", "fun": "AIに「このワインの点数は？」と聞くと、ひとつの点数を答えるだけでなく、「この点数の可能性がこのくらい、あの点数がこのくらい」という自信の分布も出せる。これまでの統計の方法は一つの答えしか使わなかったが、分布ごと使うと、少ない正解データでもより確かな結論が出せた。AIの「迷い方」まで情報として使う発想が面白い。", "unverified": "図2の相対RMSE・区間幅の具体的な数値と、模擬実験（§3、付録A）の結果は確認していない。"}}, {"rank": 5, "field": "因果推論", "headline": "標的試験の模倣で時間を分割する", "title": "Partitioning Time in Target Trial Emulation", "url": "https://arxiv.org/abs/2609.34576", "authors": "Harold Tankpinou Zoumenou ほか", "venue": "arXiv", "date": "2026-09-29", "why": "観察データで試験を模倣する際の不死時間バイアスを、時間の分割で扱う方法を示した。", "id": "pn05", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、§3.2の臨床的妥当性、§4.4の模擬実験と図3、§4.5、§5.1）を読んだ。g公式の導出と補足資料の証明は読んでいない", "preprint": true, "p1": "観察データで仮想の臨床試験を模倣する「標的試験の模倣（target trial emulation）」で、追跡期間を短い区間に分けたときの区間内の因果の順序（共変量・治療・結果の前後）ごとにg公式を導き、広く使われるクローン・打ち切り・重み付け法（CCW）が「区間内で治療が結果に影響する」場合に偏ることを示し、修正版を提案した（抄録）。", "p2": "観察データでは、治療を始める前に亡くなった人が非治療群に分類されうる（不死時間バイアス）うえ、治療への反応の指標が次の治療判断に影響する（時間依存の交絡）（§1）。これを解くには追跡を短い区間に分けて有向非巡回グラフ（DAG）で表す必要があるが、区間内の順序の仮定は文献ごとに異なり、その妥当性と推定法との対応は検討されていなかった（§1）。", "p3": "区間内の順序として「共変量Z→結果Y→治療X」（治療の効果は区間より遅れて現れる）と「Z→X→Y」（治療が同じ区間内で結果に効く）の2つを基準にし、それぞれのg公式を導く（§3〜4）。祖先的多世界ネットワーク（AMWN）でCCWの交換可能性を点検し、Z→X→Yの場合に偏りを除く修正版CCWを作った（§4.3）。例えば、慢性疾患の予防薬（効果が数週〜数年後）は前者、待機手術（術後30日の死亡が約5%）は後者が妥当とする（§3.2）。", "p4": "2区間・1,000人のデータを1,000回模擬し、「常に治療」と「治療しない」の平均処置効果の偏りを、標準CCW、g計算、修正CCWで比べた（§4.4）。", "p5": "Z→Y→Xの順序（真の生存の増加12.5%）では、標準CCWの偏りは−0.008%、g計算も−0.008%でほぼ0だったが、修正CCWは−1.63%と偏った（§4.4、図3a）。Z→X→Yの順序（真の増加16.1%）では、標準CCWの偏りが−9.83%と大きく、g計算（0.03%）と修正CCW（0.12%）は偏らなかった（図3b）。区間を広げすぎて治療と結果・共変量の間に循環が生じると、効果は識別できなくなる（§5.1）。", "p6": "解釈：模擬実験は2区間の単純な設定で、実際の臨床データへの適用例は示されていない。区間の幅の選び方は臨床的な判断に依存し、その手引きは定性的である（§5）。未査読のプレプリントである。", "fun": "薬の効果を実験なしで調べるとき、「薬を飲む前に亡くなった人」をどう扱うかで結果が大きく変わる。時間を細かく区切って「何が先に起きたか」を決める必要があるが、その順番の仮定を一つ変えるだけで、よく使われる計算法が約10%もずれることが分かった。原因と結果の順番という当たり前のことが、統計では一番の急所になるのが面白い。", "unverified": "区間が狭すぎる場合の議論（§5.2）の結論と、補足資料の証明は確認していない。"}}, {"rank": 6, "field": "ヒューマンコンピュータインタラクション", "headline": "チャットボットの訂正は後に何を残すか", "title": "Chatbot Engagement Does Not Always Beget Metalearning: Evidence from Three Countries", "url": "https://arxiv.org/abs/2609.32739", "authors": "Kokil Jaidka ほか", "venue": "arXiv", "date": "2026-09-29", "why": "3か国約2,200人の事前登録ランダム化実験で、チャットボットのファクトチェックがメタ学習を生むかを検証した。", "id": "pn06", "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（冒頭の要旨、方法の§4.1、結果の第1波と持続性の節、限界）と図3〜4のキャプションを読んだ", "preprint": true, "p1": "米国・インド・シンガポールの約2,200人の事前登録ランダム化実験で、文脈を偽った画像のデマへの訂正をチャットボットで行うと、その場の見分ける力と共有意図は改善するが、1週間後に自力で判断させると効果は残らず、チャットボット群ではむしろ低下したことを示した（冒頭の要旨）。", "p2": "チャットボットは実時間でファクトチェックを届けられるが、チャットボットがいなくなった後に何かが残るか（個々の誤信念の訂正とは別の「メタ学習」）は検証されていなかった（冒頭の要旨）。", "p3": "本物の写真に偽のキャプションをつけた「文脈外」のデマを使い、訂正の媒体の特性（同期性・情報量）を4条件で変えた：対照、リンクのみ、静的な説明、検証済みの文脈外検出器にもとづくソクラテス式の対話チャットボット（§4.1）。1週間後に支援なしで再テストし、訂正していない主張への判断（メタ学習）も測った（§4）。", "p4": "Qualtricsのパネルで3か国から募集し、第1波は各国で各条件におよそ4分の1ずつ割り付けた（米国は2024年大統領選の直前）（§4.1）。主要結果は真偽の見分け（discernment）と偽の主張の共有意図で、第1波→第2波の差の差で持続を検定し、繰り返し提示の効果も切り分けた（§5）。", "p5": "第1波ではチャットボットだけが見分ける力を有意に改善した（d=0.097、p=.023）（§5.1、図3）。共有意図は3つの介入すべてで下がった（リンクd=−0.120、静的d=−0.109、チャットボットd=−0.122）（§5.1）。1週間後、持続効果が正の条件はなく、チャットボットは対照に比べて−0.100（p=.090）低下し、インドではd=−0.378（p<.001）、シンガポールでは繰り返し項目でd=−0.448（p=.015）の有意な低下だった（§5.2）。", "p6": "著者は、実施時期が国で異なり米国のみ選挙期間中だったこと、結果が自己申告で実際の共有行動ではないこと、チャットボットが規則で縛られ応答が遅く硬かったことを限界に挙げる（Limitations）。解釈：効果量はいずれも小さく、国による違いの解釈には慎重さが要る。未査読のプレプリントである。", "fun": "AIのチャットボットと対話しながらデマを見抜く練習をすると、その場では一番成績が上がった。ところが1週間後に一人で判断させると、その差は消え、国によってはかえって下がった。手取り足取り教えてもらうと、自分で考える力は育ちにくいのかもしれない。勉強のやり方にも通じる話で面白い。", "unverified": "第2波の標本数とつながり率（§5.2）、繰り返し効果の分析の詳細な数値は確認していない。"}}, {"rank": 7, "field": "組織行動・心理的安全性", "headline": "弱い立場の働き手ほど見えない仕事を負う", "title": "The Accommodation Trap: Survival Dependence, Communication, and the Allocation of Invisible Work", "url": "https://arxiv.org/abs/2609.33064", "authors": "Samiha Tariq", "venue": "arXiv", "date": "2026-09-29", "why": "外部の選択肢が乏しい働き手が従順な伝え方を選び、見えない仕事を負わされる仕組みを理論化した。", "id": "pn07", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（本文冒頭の要旨、序論、§6.2の是正策、§7の数値例）を読んだ。均衡の証明（第4〜5節）は命題の要約の範囲で確認した", "preprint": true, "p1": "外部の選択肢が乏しく仕事に依存する働き手ほど、関係を守るために従順な伝え方（遠慮、境界のゆるさ、柔軟さの誇示）をとり、それを見た上司が合理的に「断らない人」と読み取って昇進につながらない「見えない仕事」を割り当てる、という自己強化的な不平等の仕組み（順応の罠）を理論モデルで示した（本文冒頭の要旨）。", "p2": "昇進につながりにくい仕事が特定の人（女性や内発的に動機づけられた人）に偏ることは実証されてきたが（Babcockら2017など）、誰が予測可能な受け手になり、なぜそれが続くのかの仕組みは十分に説明されていなかった（§1）。", "p3": "依存度を私的に知る2人の働き手が、境界を保つか従順かの伝え方を選び、摩擦を最小化したい上司が目に見える（キャリアになる）仕事と見えない仕事を1つずつ割り当てるシグナリング・ゲーム（§3）。従順の関係上の利益ρDは依存度とともに増え、見えない仕事の不利Δ/2は依存度によらないので、閾値D*=Δ/2ρより依存度の高い人だけが従順になる分離均衡が生まれる（命題1〜3）。見える仕事が外部の選択肢を高め、見えない仕事が削ると、差は毎期広がり固定する（命題4〜5）。", "p4": "データは使わない理論研究で、数値例で条件が両立することと大きさを示した（§7）。例えばΔ=1、ρ=1、依存度0.3と0.8の2タイプとした（表1）。", "p5": "数値例では閾値D*=0.5で、依存度0.8の人は従順（Φ=0.3）、0.3の人は従順でなく（Φ=−0.2）、見えない仕事を割り当てられる確率は従順な人0.75、そうでない人0.25だった（§7）。割り当てを入れ替えると1期の厚生が約0.104増え、上司の摩擦費用0.03を上回るので、均衡は非効率である（§7）。上司の信念は均衡で正しいため、偏見の是正では解消せず、見えない仕事への評価の付与、規則によるローテーション、裁量の制限が罠を断つ（命題8〜9）。", "p6": "著者は、数値は推定値ではなく例示にすぎず、モデルはデータで検証していないとする（§7）。解釈：2人・2つの仕事という単純化した設定で、実証の設計は第9節で素描にとどまる。未査読のプレプリントである。", "fun": "仕事を失うと困る人ほど、上司に嫌われないよう「いいですよ」と言いやすい。上司はそれを見て、その人に誰もやりたがらない雑用を回す。すると昇進の機会が減り、ますます仕事に依存する…という悪循環が、誰も悪意を持たなくても起きることを数学で示した。当番制のような単純なルールがこの輪を断ち切るという結論も面白い。", "unverified": "動学的な罠の証明（命題4〜5）の詳細と、前向きな働き手の場合（§5.1）の条件は確認していない。"}}, {"rank": 8, "field": "経済学", "headline": "AIは仕事を奪うか補うか：特許と職業の結合", "title": "The Labor Market Effects of AI Automation and Augmentation", "url": "https://econpapers.repec.org/RePEc:zbw:glodps:1821", "authors": "Oleš ほか", "venue": "RePEc NEP", "date": "2026-09-28", "why": "特許と職業の課題・道具を結び、AIの自動化と拡張の二つの経路の雇用効果を分けて推定した。", "id": "pn08", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、題名検索で見つけたOpenAlexの記録の抄録を読んだ", "preprint": true, "p1": "米国の特許を職業の「課題」と「道具」に結びつけることで、AIの自動化（仕事の代替）と拡張（働き手の能力の増強）の効果を分けて測り、自動化は雇用を大きく減らし、拡張は賃金を上げるという逆向きの効果を示した（抄録）。", "p2": "AIが仕事を奪うのか働き手を助けるのかについて、従来の「AIへの露出」の指標は二つの経路を混ぜてしまい、効果が見えにくかった（抄録）。", "p3": "特許の文章と職業の課題が一致するものを自動化、職業で使う道具と一致するものを拡張とみなして、職業ごとの二つの露出を作った（抄録）。歴史的なAIの画期的発明の発祥地と普及を使って、現在の地域のAIへの露出を予測する（操作変数に近い考え方）ことで、因果的な効果を推定した（抄録）。", "p4": "結果は職業の雇用と賃金で、自動化と拡張の露出それぞれの効果と、各経路の中でのAIの比率による違いを調べた（抄録）。", "p5": "AIの自動化の露出が1標準偏差増えると職業の雇用は21%減り、賃金への影響は小さかった（抄録）。AIの拡張の露出は賃金を8%上げ、雇用もある程度増やした（抄録）。各経路の中でAIの比率が高いほど、自動化では雇用の置き換えが強まり、拡張では効果が雇用の増加から賃金の上昇へ移った（抄録）。", "p6": "解釈：特許と課題・道具の文章の一致で経路を分ける方法の妥当性と、歴史的な発明の地理を使う識別の仮定は、本文で確認する必要がある。査読の有無は未確認のワーキングペーパーである。", "fun": "AIは人の仕事を奪うのか、それとも人を有能にするのか。特許の中身を「仕事そのものをこなす技術」と「仕事の道具になる技術」に分けて数えると、前者は雇用を2割ほど減らし、後者は賃金を1割近く上げていた。同じAIでも、どちらの形で入ってくるかで働く人の運命が逆になる点が面白い。", "unverified": "本文が入手できず、データの期間、地域の単位、推定の頑健性は確認できていない。"}}, {"rank": 9, "field": "統計学", "headline": "表形式の基盤モデルで統計的推論を償却する", "title": "Can Tabular Foundation Models Amortize Statistical Inference?", "url": "https://arxiv.org/abs/2609.33114", "authors": "Kai Ye ほか", "venue": "arXiv", "date": "2026-09-29", "why": "問題ごとに推定量を設計する代わりに、表形式の基盤モデルに推論をまとめて学習させる方向を示した。", "id": "pn09", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、問題設定と構成、実験の設定・観察・アブレーション、考察）を読んだ。表1の個々の数値と学習の詳細（付録B〜C）は読んでいない", "preprint": true, "p1": "表形式データの基盤モデル（TabPFN-v3）の上に、推定誤差の分布を学ぶ頭部と強化学習による事後学習を組み合わせたTabConを作り、新しいデータセットの回帰関数の信頼区間を1回の順伝播で、名目に近い被覆率かつ短い幅で出せることを示した（抄録）。", "p2": "統計的推論は、処置効果や回帰係数など目的ごとに推定量と不確かさの評価法を設計してきた（抄録）。これらは新しいデータのたびに専用の手続きを走らせる「非償却型」で、強い仮定や大標本近似に頼るか、ブートストラップのような再標本化で計算が重いという限界があった（§1）。", "p3": "学習時はデータ生成過程が既知なので、点推定と真値の差（推定誤差）が計算できる。その誤差の分布を文脈内学習で学ばせ、分位点から信頼区間[f̂−Q(1−α/2), f̂−Q(α/2)]を作る（式2、命題1）。誤差の頭部は、全体用、過小被覆のデータに強い「拡張」専門家、過大被覆のデータに強い「縮小」専門家の3つで、ルーターが上位2つを疎に混ぜる（§3、図1）。ルーターは被覆率と区間長を報酬とする強化学習で調整する（§4、付録B.2）。", "p4": "64のデータ生成過程（学習に使った32と未使用の32）、意図的に難しくした「ストレステスト」、OpenML-CC18の13データの実際の共変量に既知の回帰関数を組み合わせた半合成データ
