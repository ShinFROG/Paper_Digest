立ったとする（抄録）。", "fun": "AI同士に株の売り方を学ばせると、話し合いもしないのに「抜けがけしたら仕返しする」という暗黙のルールを身につけ、結果として二人とも得をする、という話です。人間の談合に似たことがAIでも自然に起きうる点が面白く、規制の議論にもつながります。", "unverified": "未査読のプレプリント。検証は特定の逸脱1種類について。"}}, {"id": "pn28", "rank": 28, "field": "機械学習", "headline": "過去のバグ修正から検証可能な課題を大量合成", "title": "SWE-at-Scale: Scalable Issue Synthesis from Historical Bug Fixes", "url": "https://arxiv.org/abs/2610.21359", "authors": "Silin Chen ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-16", "apa": "Chen, S., Zhang, Z., Gu, X., Huang, J., Shi, Y., Li, H., Shan, Z., Wan, C., Sun, Z., & Guan, H. (2026). SWE-at-Scale: Scalable Issue Synthesis from Historical Bug Fixes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21359", "why": "コーディングエージェントの評価に使える検証可能なソフトウェア課題を、履歴上の修正から規模を持って作る方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（Hugging Face Daily Papers経由）", "preprint": true, "short": true, "p1": "過去のバグ修正を逆にたどって現実的なバグを作り、コーディングエージェント評価用の検証可能な課題を大量に合成する枠組みSWE-at-Scaleを示した（抄録）。", "p3": "修正を反転させて「直し方」の教師を「バグの入れ方」の教師に変え、学んだバグのパターンを新しいコードの文脈に移して実行可能な課題を作る（抄録）。", "p5": "既存の合成法より多様で現実的な課題を作り、最先端のエージェントにとってより難しかった。1つのコード文脈から異なる型のバグを作れ、1ファイル200回の生成まで多様性が伸びたとする（抄録）。", "fun": "修理の記録を逆再生すると「壊し方」の教科書になる、という発想の転換が面白い点です。本物の開発で起きたバグの仕組みを使うので、AIが作ったそれらしいだけの問題より手ごわい練習問題になります。", "unverified": "未査読のプレプリント。難しさの定量的な比較の数値は抄録にない。"}}, {"id": "pn29", "rank": 29, "field": "機械学習", "headline": "空間記憶で動画世界モデルを効率化する", "title": "Velox: Spatial Memory Makes World Models Efficient", "url": "https://arxiv.org/abs/2610.22311", "authors": "Qiuhong Shen ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-16", "apa": "Shen, Q., Wang, S., & Wang, X. (2026). Velox: Spatial Memory Makes World Models Efficient (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22311", "why": "長い対話的な動画生成で一貫性を保ちながら応答を速くするため、空間記憶を持たせた世界モデルを提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（Hugging Face Daily Papers経由）", "preprint": true, "short": true, "p1": "動画の世界モデルで、過去に生成した場面のうち今見えている領域に関係する部分だけを参照し、長い生成を速くする手法Velox（学習不要）を提案した（抄録）。", "p3": "過去のブロックを深さ区間つきのカメラ視錐台の板として表し、現在のブロックとの重なりで各層の注意の重要度を調整する。重なりのない領域はモデル本来の経路を使う（抄録）。", "p5": "48チャンク目で注意計算を4.36倍、ノイズ除去を2.43倍速くし、WBenchの158件の移動課題で密な注意の基準との差を平均0.15点以内に保ったとする（抄録）。", "fun": "ゲームのように歩き回れる動画をAIが作るとき、これまで見た景色を全部覚えていると、だんだん遅くなります。カメラの向きから「今見えている場所の記憶」だけを取り出すことで、記憶を保ちながら速くする工夫です。", "unverified": "未査読のプレプリント。"}}, {"id": "pn30", "rank": 30, "field": "機械学習", "headline": "良い視覚表現は自動運転を必ず良くするか", "title": "Do Better Visual Representations Always Lead to Better End-to-End Autonomous Driving?", "url": "https://arxiv.org/abs/2610.09695", "authors": "Zihao Zhang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-16", "apa": "Zhang, Z., Tian, H., Li, T., Jing, C., He, J., Ye, N., Pu, Z., & Yang, Z. (2026). Do Better Visual Representations Always Lead to Better End-to-End Autonomous Driving? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.09695", "why": "視覚基盤モデルの表現の質が端から端までの自動運転性能に結びつく条件を体系的に調べた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（Hugging Face Daily Papers経由）", "preprint": true, "short": true, "p1": "視覚基盤モデルの表現が端から端までの自動運転の計画を良くする条件を、計画器に依存しない整合の枠組みViRAで調べた（抄録）。", "p3": "計画器の構造と推論コストを変えずに、視覚表現を基盤モデルに合わせる学習を加え、複数の計画器と5つの基盤モデルで比べた（抄録）。", "p5": "基盤モデルに導かれた表現はさまざまな計画器で性能を改善し、補助の知覚教師はモデル選択によるEPDMSのばらつきを2.7点から0.5点に縮めた。ViRA-DiffusionはNAVSIM v2で92.3 EPDMSだったとする（抄録）。", "fun": "「物をよく見分けられるAI」をそのまま運転に使えば上手に運転できるとは限らない、という問いを確かめています。どの「先生」の見方に合わせるかで結果が変わり、補助の練習を加えるとその差が小さくなる、という発見が面白い点です。", "unverified": "未査読のプレプリント。"}}, {"id": "pn31", "rank": 31, "field": "機械学習", "headline": "共同作業エージェント用の仕事環境を大規模合成", "title": "Cowork-Gym: Synthesizing Interactive Work Environments at Scale", "url": "https://arxiv.org/abs/2610.17670", "authors": "Anni Zou ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-16", "apa": "Zou, A., Chen, C., Deng, J., Zhou, W., Mai, X., Wu, Y., Lin, J., Xie, L., Qin, L., Zhao, Q., Shen, Q., Tao, S., Pan, X., Li, Y., Zhai, Y., Chen, Y., Wang, Z., Zhang, Z., Liu, Z., … Zhou, J. (2026). Cowork-Gym: Synthesizing Interactive Work Environments at Scale (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.17670", "why": "道具とファイルの依存関係や利用者の変更を含む対話的な作業環境を、整合性を保ちながら大量に生成する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（Hugging Face Daily Papers経由）", "preprint": true, "short": true, "p1": "道具やファイルの依存関係と利用者の変更を含む共同作業の環境を大量に合成し、エージェントの事後学習に使う枠組みCowork-Gymを示した（抄録）。", "p3": "作る・実行する・直すの繰り返しで、実行の証拠とレビューで生成環境を検証・修理し、状態を持つ利用者シミュレータが対話と共有作業場の編集で応答する（抄録）。", "p5": "14場面で64.9K環境を合成し、9B・27B・35B-A3BのQwenモデルを訓練すると、6つのベンチマークの平均で元のモデルより8.7、6.4、4.1点上がったとする（抄録）。", "fun": "人と一緒に資料を作るAIを鍛えるには、途中で注文を変えたりファイルを書き換えたりする「面倒な同僚」が必要です。その同僚役もAIで作り、練習の場を何万通りも自動で用意しているのが面白い点です。", "unverified": "未査読のプレプリント。"}}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "不確実なときだけ強いモデルへ任せる操作エージェント", "title": "LEASH: Uncertainty-Aware Weak-to-Strong Escalation and Oversight for Computer-Use Agents", "url": "https://arxiv.org/abs/2610.22280", "authors": "Qingni Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-16", "apa": "Wang, Q., Oh, C., Yang, Y., Li, S., Yang, J., Li, A., & Wang, X. E. (2026). LEASH: Uncertainty-Aware Weak-to-Strong Escalation and Oversight for Computer-Use Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22280", "why": "小型モデルで長い作業を進め、不確実性に応じて最前線モデルへ引き継ぐことで費用と成功率を両立させる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（Hugging Face Daily Papers経由、抄録の末尾は途中まで）", "preprint": true, "short": true, "p1": "小型モデルのコンピュータ操作エージェントが不確実なときだけ強いモデルに引き継ぐ、学習不要の枠組みLEASHを提案した（抄録）。", "p3": "小型モデルの隠れ状態を過去の成功・失敗の軌跡と比べ、失敗に似ているほど不確実性が高いとみなし、初期の振り分け、各ステップの引き継ぎ、引き継ぎ後の監視の3層に使う（抄録）。", "p5": "OSWorldの4つのモデルで、同じ引き継ぎ率の無作為な引き継ぎより6.55〜11.94点上回った。Qwen3.5-35B-A3Bで課題成功率73.66%と、常に最前線モデルを使う場合（72.90%）と同等だったとする（抄録）。", "fun": "いつも一番賢い（高い）AIを使うのではなく、普段は安いAIに任せ、迷ったときだけ助けを呼ぶ仕組みです。迷っているかを、過去に失敗したときの「頭の中の状態」と似ているかで判断する点が工夫です。", "unverified": "未査読のプレプリント。費用の削減幅は抄録の末尾が切れていて確認できない。"}}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "マスク付き注意を分散学習で効率化", "title": "FlashMask-3: Efficient and Expressive Mask-Aware Distributed Attention", "url": "https://arxiv.org/abs/2610.17901", "authors": "Guoxia Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-16", "apa": "Wang, G., He, Q., Wu, S., Xie, H., Bao, Q., Zeng, J., Yang, J., Wu, T., & Yu, D. (2026). FlashMask-3: Efficient and Expressive Mask-Aware Distributed Attention (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.17901", "why": "長文脈学習で多様な注意マスクと複数ノードの文脈並列を両立させる注意計算の実装を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（Hugging Face Daily Papers経由、抄録の末尾は途中まで）", "preprint": true, "short": true, "p1": "長文脈の学習で多様な注意マスクと複数ノードの文脈並列を両立させる、マスク対応の注意計算FlashMask-3を示した（抄録）。", "p3": "列方向の疎なマスクを境界ベクトルで表し、文脈並列の各ランクでの局所化を通信なしで行い、H100向けのマスク対応カーネル、負荷分散、計算と通信の重ね合わせを加えた（抄録）。", "p5": "1枚のH100で12種のマスク・4K〜128Kで、FlashMask、FlexAttention、MagiAttentionより達成TFLOPsを45〜141%、34〜71%、2〜44%改善し、128台のH100での118B-A14B MoEの学習でスループットを7.3〜11.0%上げたとする（抄録）。", "fun": "とても長い文章をAIに学ばせると、「どの単語がどの単語を見てよいか」という表（マスク）の扱いが大きな負担になります。その表を短い数列に圧縮し、たくさんのGPUに通信なしで配れるようにした工夫です。", "unverified": "未査読のプレプリント。比較対象の一部の数値は抄録の末尾が切れていて確認できない。"}}, {"id": "pn34", "rank": 34, "field": "組織行動・心理的安全性", "headline": "経歴と党派の異なる閣僚で高業績の内閣をつくる", "title": "The Composite Cabinet: Career Diversity, Partisan Pluralism, and the Design of High-Performing Executive Teams", "url": "https://doi.org/10.2139/ssrn.7622178", "authors": "Stefan Steinberger", "venue": "SSRN", "date": "2026-10-17", "apa": "Steinberger, S. (2026). The Composite Cabinet: Career Diversity, Partisan Pluralism, and the Design of High-Performing Executive Teams. https://doi.org/10.2139/ssrn.7622178", "why": "異なる経歴と政党の人材で執行チームを組む設計を、チームの多様性と業績の観点から論じた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "内閣を異なる経歴と党派の人材で意図的に構成する「複合内閣」のモデルを論じた（抄録）。", "p3": "内閣構成の組み合わせの空間を整理し、チームの多様性・組織人口学・大統領の意思決定の研究と、リンカーン内閣やスイスの全党派の連邦参事会などの事例をもとに、利点と欠点を整理した（抄録）。", "p5": "多様な内閣の利点8つと欠点10（調整費用、信頼の溝、断層線など）を挙げ、共通の憲章や構造化された異論など、費用を抑えつつ利点を保つ12の設計の仕組みを示したとする（抄録）。", "fun": "似た人ばかりで決めると見落としが増える「集団浅慮」をどう防ぐか、という問いを国の内閣に当てはめています。多様にすればよいだけでなく、ばらばらにならないための仕組みもセットで考えるところがポイントです。", "unverified": "未査読のプレプリント。実証分析ではなく概念的な論考（抄録の範囲）。"}}, {"id": "pn35", "rank": 35, "field": "経営学", "headline": "役員報酬へのESG指標の組み込み方と空白", "title": "ESG in Executive Pay: Prevalence, Design, Role Alignment, and Gaps", "url": "https://doi.org/10.2139/ssrn.7622618", "authors": "Anup Srivastava ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Srivastava, A., Wang, J., & Zhao, R. (2026). ESG in Executive Pay: Prevalence, Design, Role Alignment, and Gaps. https://doi.org/10.2139/ssrn.7622618", "why": "ラッセル3000企業の役員ごとのデータで、ESG指標を報酬に入れる設計と役割との整合を記述した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "米国企業が役員報酬にESG指標をどう組み込んでいるかを、役員ごとのデータで記述した（抄録）。", "p3": "ラッセル3000企業の2021〜2024年の指名役員（NEO）単位のデータで、業種と役員の職能ごとのESG報酬の設計を調べた（抄録）。", "p5": "ESG指標は短期のインセンティブに集中し、株式報酬にはほとんど入っていなかった。修正係数より明示の重みが多く、排出の多い業種では成果より目標を数値化することが多かったとする（抄録）。", "fun": "「環境や社会に配慮したら役員のボーナスを増やす」という仕組みが、実際には短期のボーナスに少し乗っているだけで、報酬全体への影響は小さい、という実態の観察です。目標は数字で書くのに結果は書かない、というずれも見どころです。", "unverified": "未査読のプレプリント。記述的分析で、ESG報酬の効果は推定していない（抄録の範囲）。"}}, {"id": "pn36", "rank": 36, "field": "経営学", "headline": "移動の判断をAIに任せると交通は効率化するか", "title": "Does Intelligent Travel Decision-Making Improve Traffic System Efficiency? Evidence from Dual-Timescale Incentive-Based Travel Demand Management", "url": "https://doi.org/10.2139/ssrn.7620689", "authors": "Jiyan Wu ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Wu, J., Zhu, Y., Bai, S., Sun, J., & Wu, J. (2026). Does Intelligent Travel Decision-Making Improve Traffic System Efficiency? Evidence from Dual-Timescale Incentive-Based Travel Demand Management. https://doi.org/10.2139/ssrn.7620689", "why": "自律エージェントに移動判断を委ねた場合のインセンティブ型交通需要管理の効果を、二つの時間尺度で調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "移動の判断をAIエージェントに任せたとき、インセンティブ型の交通需要管理で渋滞が減るかを、人間の判断と比べた（抄録）。", "p3": "ボトルネックモデルの上で、日内の時間変動インセンティブと日々の予算配分を同時に最適化する二重時間尺度の枠組みを作り、人間は比例切替の調整過程、エージェントは状態なしのQ学習で出発時刻を選ぶとした（抄録）。", "p5": "同じ予算と期間で、人間の判断の方が自律エージェントより1日平均の系全体の移動費用が低く、エージェントの方が最適予算が高かったとする（抄録）。", "fun": "一人ひとりが賢いAIに運転の判断を任せれば交通全体も良くなりそうですが、結果は逆でした。全員が賢く出し抜こうとすると、互いの動きがぶつかってしまう、という「個人の賢さ」と「全体の良さ」のずれが面白い点です。", "unverified": "未査読のプレプリント。差の大きさは抄録に示されていない。"}}, {"id": "pn37", "rank": 37, "field": "環境・気候政策", "headline": "温暖化で中国の風力・太陽光の適地が移る", "title": "Climate-driven spatial redistribution of siting suitability for onshore wind and photovoltaic in China: Environmental and health co-benefits of power sector transitions", "url": "https://doi.org/10.2139/ssrn.7620443", "authors": "Yue Tian ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Tian, Y., Hou, X., Dong, M., Wang, W., & Cheng, S. (2026). Climate-driven spatial redistribution of siting suitability for onshore wind and photovoltaic in China: Environmental and health co-benefits of power sector transitions. https://doi.org/10.2139/ssrn.7620443", "why": "将来気候下での立地適性の変化と、電力の脱炭素化がもたらす大気質・健康の便益を空間的に評価した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "将来の気候で中国の陸上風力と太陽光の立地の適性がどう移るか、電力の脱炭素化による大気質と健康の便益と合わせて評価した（抄録）。", "p3": "7つの地域スタッキングモデル、発電量のダウンスケーリング、大気質・健康評価を統合し、SSP1-RCP2.6とSSP2-RCP4.5で1kmの適性を推定し、国別目標・2℃・1.5℃の経路で影響を評価した（抄録）。", "p5": "地域の相対的な適性は太陽光で-9.77%〜+24.81%、風力で-13.32%〜+12.86%変わった。2060年までに290の地級市でPM2.5が下がり、PM2.5による早期死亡が14,400〜16,900人減ったとする（抄録）。", "fun": "気候が変わると、風や日射の良い場所も移っていきます。今の好立地が将来も好立地とは限らない、という点に目を向け、発電所の場所選びと空気のきれいさ、人の健康までを一続きで計算しているのが面白いところです。", "unverified": "未査読のプレプリント。"}}, {"id": "pn38", "rank": 38, "field": "環境・気候政策", "headline": "化石燃料補助金とEUの排出の逆説", "title": "Fossil Fuel Subsidies and CO₂ Emissions in the European Union: Dynamic Panel Evidence of a Subsidy–Emissions Paradox, 2010–2023", "url": "https://doi.org/10.2139/ssrn.7624681", "authors": "Dr. Umme Humayara Manni", "venue": "SSRN", "date": "2026-10-17", "apa": "Manni, Dr. U. H. (2026). Fossil Fuel Subsidies and CO₂ Emissions in the European Union: Dynamic Panel Evidence of a Subsidy–Emissions Paradox, 2010–2023. https://doi.org/10.2139/ssrn.7624681", "why": "2010〜2023年のEUの動学的パネルで、補助金と排出の関係を事後的に推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "EU24か国のパネルで化石燃料補助金がCO2排出を増やすかを推定し、理論と逆の負の関連を見いだした（抄録）。", "p3": "2010〜2023年のパネルで二段階のシステムGMMを使い、所得・再エネ・EU ETS価格・政府の有効性・エネルギー輸入依存を統制し、他の推定量と比べた（抄録）。", "p5": "弾力性は負（短期-0.0089、長期-0.0163）で、符号はどの推定量でも同じだが有意性は脆く、固定効果などでは消えた。完全廃止でも長期の排出は約1.6%しか動かないとする（抄録）。", "fun": "「燃料を安くする補助金は排出を増やすはず」という教科書の予想に反して、データでは逆向き（ただし弱い）の関係が出た、という結果です。結果をうのみにせず、どの分析でも残るかを丁寧に確かめている姿勢も見どころです。", "unverified": "未査読のプレプリント。負の関連は推定法によって有意でなくなると著者が明記。"}}, {"id": "pn39", "rank": 39, "field": "環境・気候政策", "headline": "環境クズネッツ曲線を越えて：転換点は本当にあるか", "title": "Beyond the Environmental Kuznets Curve: Energy-System Drivers and Trade-Adjusted Carbon Dynamics", "url": "https://doi.org/10.2139/ssrn.7624666", "authors": "Zibeyda Shakaraliyeva", "venue": "SSRN", "date": "2026-10-17", "apa": "Shakaraliyeva, Z. (2026). Beyond the Environmental Kuznets Curve: Energy-System Drivers and Trade-Adjusted Carbon Dynamics. https://doi.org/10.2139/ssrn.7624666", "why": "所得多項式から脱炭素を推論する際に、推定された転換点が標本内で観測されるかを確かめる手順を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "環境クズネッツ曲線の「転換点」が標本内で観測されるか、動学的に支持されるか、排出の計上範囲で変わらないかを確かめる手順で、アゼルバイジャンとトルコを再検討した（抄録）。", "p3": "1990〜2023年の実質GDP、領域ベースと消費ベースのCO2、一次エネルギー、再エネ比率で、共通のARDLと有限標本の境界検定、HAC共分散、一階差分モデルを使った（抄録）。", "p5": "トルコの消費ベースの静学モデルでは逆U字が見えたが、転換点（約20,537ドル、2015年価格）は観測された所得の範囲外で動学的な支持もなかった。再エネ比率の1ポイント増は領域排出の伸びの約1.2%減と関連したとする（抄録）。", "fun": "「豊かになると最初は排出が増え、やがて減る」という山なりの曲線は有名ですが、山の頂上が実際のデータの外にあれば、それは見えていない予想にすぎません。数式の形だけで判断しない慎重さを示す研究です。", "unverified": "未査読のプレプリント。"}}, {"id": "pn40", "rank": 40, "field": "環境・気候政策", "headline": "料金プランに登録しても電力の時間移動は起きない", "title": "Signing up isn't shifting load: Examining determinants of enrolment and response under cost-reflective electricity tariffs", "url": "https://doi.org/10.2139/ssrn.7620246", "authors": "Wen Xian ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Xian, W., de Sá, A. L. S., & Lavieri, P. (2026). Signing up isn’t shifting load: Examining determinants of enrolment and response under cost-reflective electricity tariffs. https://doi.org/10.2139/ssrn.7620246", "why": "費用を反映した電気料金への加入と需要の時間移動を分けて、その規定要因を調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず、抄録の末尾は途中まで）", "preprint": true, "short": true, "p1": "費用反映型の電気料金に「自分で加入した人」と「自動で加入させられた人」で、ピークからの電力使用の移動が続くかを調べた（抄録）。", "p3": "オーストラリアの加入世帯1,221の調査で、受動的・能動的な加入と移動の頻度の組み合わせを5つの型に分け、主観・客観の要因を分析した（抄録）。", "p5": "家計の不安が大きいほど能動的な加入が少なく、エネルギーの知識と制度への信頼は加入と正に関連した。EVの充電設備と断熱は能動的な加入と持続的な移動に関連したとする（抄録）。", "fun": "「電気が高い時間を避ければ安くなる」料金に自動で入れても、人の行動が変わるとは限りません。家計に余裕のない人ほど新しい料金を不安に感じるという結果は、制度の設計で弱い立場の人をどう守るかという問いにつながります。", "unverified": "未査読のプレプリント。効果の大きさは抄録に示されていない。"}}, {"id": "pn41", "rank": 41, "field": "環境・気候政策", "headline": "最小費用から公正へ、エネルギー計画モデルの限界", "title": "From Least Cost to More Just:&nbsp;Exploring the Ability of Optimisation Models to Represent Energy Justice Considerations in Low-Carbon Transitions", "url": "https://doi.org/10.2139/ssrn.7619526", "authors": "Erik Laes ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Laes, E., Tatry, L., Sundaram, A., & Huang, Y. (2026). From Least Cost to More Just:&nbsp;Exploring the Ability of Optimisation Models to Represent Energy Justice Considerations in Low-Carbon Transitions. https://doi.org/10.2139/ssrn.7619526", "why": "中央計画型の最小費用最適化モデルが、移行の負担配分というエネルギー正義の論点をどこまで表せるかを検討した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず、抄録の末尾は途中まで）", "preprint": true, "short": true, "p1": "エネルギー計画の最小費用最適化モデル（TIMES）に、分配・手続き・承認の正義がどう入るか、または入らないかを事例で調べた（抄録）。", "p3": "ベルギーのVITOの2つのモデル（TIMES-Be、TIB3R）を対象に、経験のあるモデル作成者8人への半構造化面接を演繹と帰納を組み合わせた主題分析で分析した（抄録）。", "p5": "正義は明示的な原則としてはほとんど使われず、シナリオの設定・割引・制約・関係者の参加・後処理を通じて暗黙的かつ不均一に入っていた。産業の関係者の影響が家計より大きかったとする（抄録）。", "fun": "国のエネルギー計画は「一番安い道」を計算で探しますが、その負担を誰が背負うかは計算式の外に置かれがちです。計算する専門家に聞き取りをして、公平さがどこからこっそり入り込んでいるかを探っているのが面白い点です。", "unverified": "未査読のプレプリント。面接は8人の単一事例。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "主成分で荷重を縮約し全域応答をカルマン推定", "title": "Equivalent force-based Kalman-type filter and reduced system function for full-field response reconstruction", "url": "https://doi.org/10.1007/s13349-026-01129-7", "authors": "Yixian Li ほか", "venue": "Journal of Civil Structural Health Monitoring", "date": "2026-10-16", "citescore": 8.0, "citescore_year": "2025", "apa": "Li, Y., Shan, Y., Zhao, Z., Lei, Y., Luo, L., & Xia, Y. (2026). Equivalent force-based Kalman-type filter and reduced system function for full-field response reconstruction. Journal of Civil Structural Health Monitoring, 16(6). https://doi.org/10.1007/s13349-026-01129-7", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr02", "rank": 2, "headline": "応答曲面と改良PSOで斜張橋のFEモデル更新", "title": "Finite element model updating in extradosed cable-stayed bridges using the RSM-MPSO method", "url": "https://doi.org/10.1680/jencm.26.00019", "authors": "Wei-Hao Mao ほか", "venue": "Proceedings of the Institution of Civil Engineers - Engineering and Computational Mechanics", "date": "2026-10-16", "citescore": 0.9, "citescore_year": "2025", "apa": "Mao, W.-H., Yin, H., Hao, W.-J., & Li, O. (2026). Finite element model updating in extradosed cable-stayed bridges using the RSM-MPSO method. Proceedings of the Institution of Civil Engineers - Engineering and Computational Mechanics, 1–14. https://doi.org/10.1680/jencm.26.00019", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr03", "rank": 3, "headline": "ブカレスト中央駅を空中権とPPPで再開発", "title": "Reimagining Bucharest’s Central Station: PPP and Air Rights as Tools for Metropolitan Integration", "url": "https://doi.org/10.31127/tuje.1967768", "authors": "Liviu-Gabriel Baicu", "venue": "Turkish Journal of Engineering", "date": "2026-10-16", g Research", "date": "2026-10-16", "apa": "Kasimu, H., Shittu, I., & Yusuf, I. (2026). EFFECT OF BOARD AND AUDIT COMMITTEE CHARACTERISTICS ON FRAUDULENT FINANCIAL REPORTING OF LISTED NON – FINANCIAL FIRMS IN NIGERIA. Nigerian Journal of Accounting Research, 13(1), 1–19. https://doi.org/10.67203/njar.2026.n5mjhsal", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "ナイジェリアの上場非金融企業で、取締役会と監査委員会の特性が不正な財務報告に与える影響を調べた（抄録）。", "p3": "2020〜2024年の上場非金融企業103社の年次報告書を使い、不正報告をBeneish M-Scoreで測り、パネルの二値ロジスティック回帰で分析した（抄録）。", "p5": "監査委員会の財務専門性は不正報告と正に有意に関連し、取締役会の財務専門性と監査委員会の開催頻度は負に有意に関連したとする（抄録）。", "fun": "会計に詳しい人を監査委員会に入れると不正が減りそう、という予想に反して、逆向きの関係が出たのが意外な点です。仕組みを整えても、実際に監視が働くかは状況しだいだ、ということを考えさせます。", "unverified": "不正の測定は指標による推定で、実際に摘発された不正ではない（抄録の範囲）。"}}, {"id": "jr29", "rank": 29, "headline": "機械学習と説明可能AIによる監査リスク評価", "title": "Intelligent Audit Risk Assessment Using Machine Learning and Explainable Artificial Intelligence", "url": "https://doi.org/10.1922/comdem.v3i2s.18734", "authors": "Eyed Mahdi Al Qarni ほか", "venue": "Computer and Decision Making: An International Journal", "date": "2026-10-17", "citescore": 5.7, "citescore_year": "2025", "apa": "Eyed Mahdi Al Qarni, Miroslav ŠKODA, Marek VOCHOZKA, MAJDI A A SALAMEH, Nurzhigit Smailov, & Silvia Aracely Valle Jaramillo. (2026). Intelligent Audit Risk Assessment Using Machine Learning and Explainable Artificial Intelligence. Computer and Decision Making: An International Journal, 3(2S), 431–441. https://doi.org/10.1922/comdem.v3i2s.18734", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず、抄録の末尾は途中まで）", "preprint": false, "short": true, "p1": "監査リスクの評価に、情報漏れに注意した説明可能な機械学習の枠組みを提案し、識別・確率の質・説明・しきい値選択を一つにまとめられるかを調べた（抄録）。", "p3": "9つの監査リスク指標（財務の不一致、過去の虚偽表示、内部統制の弱さ、異常な仕訳など）で4,000件の観測を作り、ロジスティック回帰、ランダムフォレスト、勾配ブースティング、XGBoostを比べた（抄録）。", "p5": "XGBoostのROC-AUCが最高（0.815）、ロジスティック回帰のPR-AUCが最高（0.605）、勾配ブースティングの正解率（0.835）とBrierスコア（0.123）が最良だった。SHAPでは不一致比率と内部統制の弱さが主な要因だったとする（抄録）。", "fun": "どのモデルが一番か、は評価の物差しによって答えが変わる、ということがよく分かる結果です。全体の当たりやすさ、まれな危険の見つけやすさ、確率の正確さで勝者がそれぞれ違い、監査で何を重視するかを先に決める必要があります。", "unverified": "データは理論に基づいて作られた観測で、実際の監査記録かは抄録から確認できない。"}}, {"id": "jr30", "rank": 30, "headline": "中小企業ネットワークは能力を育てるか削ぐか", "title": "The SME network dilemma: Capability building versus capability erosion", "url": "https://doi.org/10.1080/00472778.2026.2744672", "authors": "Rui Xu ほか", "venue": "Journal of Small Business Management", "date": "2026-10-16", "sjr": 2.351, "citescore": 17.0, "citescore_year": "2025", "apa": "Xu, R., & Raza-Ullah, T. (2026). The SME network dilemma: Capability building versus capability erosion. Journal of Small Business Management, 1–41. https://doi.org/10.1080/00472778.2026.2744672", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、中小企業のネットワークが能力を育てる面と損なう面のジレンマを扱った論文。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、取引先や仲間の会社とのつながりが、小さな会社の力を伸ばすのか、それとも頼りすぎて自分で考える力を弱めるのか、です。つながりは良いものと思われがちですが、その裏側にも目を向けています。", "unverified": "抄録・本文を入手できず、手法と結果は確認できていない。"}}, {"id": "jr31", "rank": 31, "headline": "政府の信用保証とVC、コロナ前後の中小企業金融", "title": "Government loan guarantees, venture investment, and SME financing: Cross-country evidence before and after COVID-19", "url": "https://doi.org/10.1080/26437015.2026.2744736", "authors": "Youngkeun Choi", "venue": "Journal of the International Council for Small Business", "date": "2026-10-16", "citescore": 2.8, "citescore_year": "2025", "apa": "Choi, Y. (2026). Government loan guarantees, venture investment, and SME financing: Cross-country evidence before and after COVID-19. Journal of the International Council for Small Business, 1–34. https://doi.org/10.1080/26437015.2026.2744736", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "政府の信用保証が中小企業の資金調達条件を直接に、またベンチャー投資を通じて間接に改善するか、それがコロナ後に変わったかを国際比較した（抄録）。", "p3": "40か国の2007〜2022年の非均衡パネルで、固定効果回帰、媒介分析、調整分析により、金利スプレッド、担保要求、ベンチャー投資への効果を推定した（抄録）。", "p5": "信用保証は金利スプレッドの縮小と担保要求の低下に関連し、ベンチャー投資が担保要求との関係を部分的に媒介した。保証とベンチャー投資の正の関連はコロナ後に有意に強まったとする（抄録）。", "fun": "国が「もし返せなくても肩代わりする」と約束すると、銀行は小さな会社にも貸しやすくなります。その安心感がベンチャー投資を呼び込む道筋もあり、危機のときほど効く、という景気と逆に動く役割が見えてきます。", "unverified": "国-年単位の関連で、企業単位の因果効果ではないと著者が明記。"}}, {"id": "jr32", "rank": 32, "headline": "日本のラーメンにみる本物らしさの葛藤", "title": "Authentic ramen: Contradictions and conflict in everyday consumer practice in Japan", "url": "https://doi.org/10.1177/14695405261499075", "authors": "Kosuke Mizukoshi ほか", "venue": "Journal of Consumer Culture", "date": "2026-10-16", "sjr": 1.43, "citescore": 8.2, "citescore_year": "2025", "apa": "Mizukoshi, K., Yokoyama, N., & Marshall, D. (2026). Authentic ramen: Contradictions and conflict in everyday consumer practice in Japan. Journal of Consumer Culture. https://doi.org/10.1177/14695405261499075", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "日本の消費者がラーメンの「本物らしさ（authenticity）」をどう実践しているかを、健康面の矛盾も含めて示した（抄録）。", "p3": "日本の消費者31人への質的な面接で、店のラーメン、家で作るラーメン、カップ麺についての認識と実践のパターンを分析した（抄録）。", "p5": "店のラーメンだけが本物で、家のラーメンやカップ麺は便利だが偽物、という構図にはならなかった。本物らしさは純粋さの追求ではなく、矛盾や曖昧さを含む日々の実践で作られるとする（抄録）。", "fun": "「本物のラーメンはお店のもの」と思いがちですが、カップ麺を食べる場面にもその人なりの本物らしさがある、という見方が面白い点です。体に悪いと分かっていても好き、という矛盾まで含めて食文化だと捉えています。", "unverified": "31人の面接に基づく質的研究で、一般化の範囲は限られる。"}}, {"id": "jr33", "rank": 33, "headline": "競合からの称賛にどう返すか、文化差を検証", "title": "Responding to Competitor Praise: How Downgrading Praise Shapes Consumer Responses Across Cultures", "url": "https://doi.org/10.1111/ijcs.70268", "authors": "Mingli Huang ほか", "venue": "International Journal of Consumer Studies", "date": "2026-10-17", "sjr": 1.894, "citescore": 15.0, "citescore_year": "2025", "apa": "Huang, M., Hampson, D. P., Lee, E., Yu, Y., & Byrom, J. (2026). Responding to Competitor Praise: How Downgrading Praise Shapes Consumer Responses Across Cultures. International Journal of Consumer Studies, 50(6). https://doi.org/10.1111/ijcs.70268", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "SNSで競合ブランドからほめられたとき、謙遜して受け流す返答（downgrading）が消費者の評価を高めるかを調べた（抄録）。", "p3": "X上のブランド間の称賛投稿105件の観察と、中国と米国の974人を対象にした3つの実験で、謙遜する返答、返答なし、単純な感謝、さらにほめ返す返答を比べた（抄録）。", "p5": "多くの称賛には返答がなかった。謙遜する返答はブランドへの社会的な近さを高めて評価を上げたが、その効果は中国の標本で見られ米国では見られなかったとする（抄録）。", "fun": "ほめられたら「いえいえ、まだまだです」と返すのが好まれるかは、文化によって違う、という結果です。日本でもなじみのある謙遜の作法が、会社同士のSNSのやりとりでも効くかを確かめているのが身近で面白い点です。", "unverified": "効果の大きさは抄録に示されていない。"}}, {"id": "jr34", "rank": 34, "headline": "AIが代わりに買う時代の購買委任", "title": "When AI shops for me: How agentic retail representation turns assistance into purchase delegation", "url": "https://doi.org/10.1016/j.jretconser.2026.105174", "authors": "Mansour Alyahya ほか", "venue": "Journal of Retailing and Consumer Services", "date": "2026-10-17", "sjr": 3.913, "citescore": 24.8, "citescore_year": "2025", "apa": "Alyahya, M., Agag, G., & Shehawy, Y. M. (2027). When AI shops for me: How agentic retail representation turns assistance into purchase delegation. Journal of Retailing and Consumer Services, 95, 105174. https://doi.org/10.1016/j.jretconser.2026.105174", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、AIエージェントが消費者の代わりに買い物をするとき、補助が購買の委任に変わる仕組みを扱った論文。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、AIに「おすすめを教えて」と頼むことと「買っておいて」と任せることの間に、どんな線があるか、です。任せる範囲が広がるほど、信頼や責任の問題が大きくなります。", "unverified": "抄録・本文を入手できず、手法と結果は確認できていない。"}}, {"id": "jr35", "rank": 35, "headline": "広告でのAI使用の開示が顧客を失わない条件", "title": "Disclosing AI without losing consumers: When and how AI disclosure works in advertising", "ur hborhood Socioeconomic Factors in Adolescents’ Exposure to School Lockdown Responses to Violent and Firearm-Related Threats", "url": "https://doi.org/10.3102/0013189x261492835", "authors": "Keith L. Hullenaar ほか", "venue": "Educational Researcher", "date": "2026-10-17", "sjr": 2.811, "citescore": 10.0, "citescore_year": "2025", "apa": "Hullenaar, K. L., Fisher, B. W., & Rivara, F. P. (2026). School District and Neighborhood Socioeconomic Factors in Adolescents’ Exposure to School Lockdown Responses to Violent and Firearm-Related Threats. Educational Researcher. https://doi.org/10.3102/0013189x261492835", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "学区と近隣の社会経済的な条件が、暴力や銃による脅威での学校封鎖（ロックダウン）に子どもがさらされる確率と関わることを示した（抄録）。", "p3": "社会解体論の体系的な再定式化に基づき、思春期脳認知発達研究（N=10,049）のデータで、学区と国勢調査区の社会経済的なリスク要因を分析した（抄録）。", "p5": "過去1年に約8.0%の子どもが学校封鎖を経験した。機会の指標が高い地区や恵まれた学区の子どもは封鎖の確率が有意に低かったが、最も機会の乏しい地区では学区の状況は関係しなかったとする（抄録）。", "fun": "学校の封鎖を経験する子どもは、住んでいる地域の豊かさで偏っている、という結果です。さらに一番厳しい地域では、良い学区に通っても守られない、という点が、地域と学校の両方を見る必要を示しています。", "unverified": "関連の分析で、因果効果ではない（抄録の範囲）。"}}, {"id": "jr38", "rank": 38, "headline": "学校の包摂的な文化への変革を左右する要因", "title": "Leading inclusive culture change: Drivers and constraints across self, school and system", "url": "https://doi.org/10.1177/17411432261499261", "authors": "Emma Laurence ほか", "venue": "Educational Management Administration and Leadership", "date": "2026-10-17", "sjr": 1.797, "citescore": 11.2, "citescore_year": "2025", "apa": "Laurence, E., & Solvason, C. (2026). Leading inclusive culture change: Drivers and constraints across self, school and system. Educational Management Administration & Leadership. https://doi.org/10.1177/17411432261499261", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "イングランドの学校で包摂的な文化への変革を進める要因と妨げる要因を、本人・学校・制度の3水準で整理した（抄録）。", "p3": 、動学的な下位集団の推定を行った（抄録）。", "p5": "デジタル化の平均・短期・長期の効果はいずれも有意でなかった。しきい値モデルの推定値1.438の信頼区間は探索範囲全体を覆い、エネルギー集約度が炭素集約度を最も強く押し上げたとする（抄録）。", "fun": "「デジタル化すれば自然と環境にやさしくなる」という期待を、多くの国のデータで確かめたら、はっきりした効果は出なかった、という結果です。期待どおりの結果が出ないことも、政策を考えるうえで大事な情報です。", "unverified": "デジタル化の指標は通信の普及を表すもので、他の側面は含まない（抄録の範囲）。"}}, {"id": "jn17", "rank": 17, "field": "環境・気候政策", "headline": "パリ協定の「最大限の野心」をどう評価するか", "title": "Assessing processes and evidence for Highest Possible Ambition in Nationally Determined Contributions under the Paris Agreement", "url": "https://doi.org/10.1088/1748-9326/aeb55f", "authors": "Julia K Schönfeld ほか", "venue": "Environmental Research Letters", "date": "2026-10-16", "sjr": 1.933, "citescore": 9.3, "citescore_year": "2025", "why": "各国の削減目標が最大限の野心を表すかを評価する過程と証拠を検討した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず、抄録の末尾は途中まで）", "preprint": false, "short": true, "p1": "パリ協定の国別削減目標（NDC）が「最大限の野心（HPA）」を表しているかを評価するための、過程と証拠の基準を示した（抄録）。", "p3": "国連気候変動枠組条約の既存の報告義務、NDC統合報告書の手法、研究の良い実践をもとに、最大限の野心のNDCに期待される過程・実施・提示・文書化を記述した（抄録）。", "p5": "各国が最大限の削減努力を特定するための厳密で理由づけられた過程をとったかを評価する、質的な基準と判断の目安を示したとする（抄録）。", "fun": "パリ協定は各国に「できる限り最大の目標」を求めていますが、何をもって最大と言えるのかは決まっていませんでした。この論文は、その目標の数字そのものより、どう決めたかの手続きで評価しようという発想が面白い点です。", "unverified": "基準を実際の各国のNDCに当てはめた結果は抄録から確認できない。"}}, {"id": "jn18", "rank": 18, "field": "環境・気候政策", "headline": "貿易と大気輸送が中国の窒素沈着を形作る", "title": "Economic Trade and Atmospheric Transport in Shaping China’s Nitrogen Deposition Patterns", "url": "https://doi.org/10.1021/acs.est.6c07734", "authors": "Jingxu Wang ほか", "venue": "Environmental Science & Technology", "date": "2026-10-16", "sjr": 3.776, "citescore": 18.9, "citescore_year": "2025", "why": "国内の排出に加え、世界の需要と越境輸送が窒素沈着に与える寄与を分けて評価した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "中国の大気窒素沈着に対する、国内消費、国際貿易、大気の越境輸送の寄与を分けて定量化した（抄録）。", "p3": "経済-排出の分析と高解像度の大気化学輸送モデルを統合した（抄録）。", "p5": "国内消費が沈着全体の67.6%を占め、豊かな沿岸部から内陸部への省間の移転を伴った。外国の消費による分が7.8%、越境輸送が12.8%、自然起源が11.8%だったとする（抄録）。", "fun": "汚染は煙突の下だけの問題ではなく、どこで物が「使われるか」と、風がどこへ運ぶか、の二つで決まる、という見方です。海外の買い物が中国の空から降る窒素の一部を生んでいる、というつながりが面白い点です。", "unverified": "なし"}}, {"id": "jn19", "rank": 19, "field": "人口学", "headline": "高齢者への社会参加の期待と日々の向社会行動", "title": "Daily Perceived Expectations for Social Engagement and Daily Prosocial Behavior: Evidence From Two Cultures", "url": "https://doi.org/10.1177/01650254261493093", "authors": "Hongmei Lin ほか", "venue": "International Journal of Behavioral Development", "date": "2026-10-17", "sjr": 1.495, "citescore": 6.8, "citescore_year": "2025", "why": "2つの文化の日誌データで、高齢者が感じる社会参加への期待と日々の向社会行動の関係を調べた。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず、抄録の末尾は途中まで）", "preprint": false, "short": true, "p1": "中高年が日々感じる「社会参加を期待されている」という感覚が、その日の向社会的な行動と関わることを、2つの文化で示した（抄録）。", "p3": "ドイツの199人（50〜91歳）と香港の314人（50〜80歳）の、事前登録した14日間の日誌研究で、一般化線形混合モデルにより個人間と日ごとの関係を分けて推定した（抄録）。", "p5": "向社会性の高い人と期待を強く感じる人は日々の向社会行動の確率が高く、期待を平均より強く感じた日にも向社会行動が増えた。この日ごとの関連はドイツで香港より強かったとする（抄録）。", "fun": "「お年寄りは元気に社会の役に立つべきだ」という周りの期待が、実際に人助けを増やすのか、という問いです。性格だけでなく、その日の周りからの期待の感じ方で行動が変わる、という日々の揺れを捉えているのが面白い点です。", "unverified": "なし"}}, {"id": "jn20", "rank": 20, "field": "物理学", "headline": "軟球充塡のエネルギー地形の引き込み域は非フラクタル", "title": "The basins of attraction of soft-sphere packings are not fractal", "url": "https://doi.org/10.1073/pnas.2604040123", "authors": "Praharsh Suryadevara ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-16", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "ガラスや充塡系の研究で使われるエネルギー地形の描像について、引き込み域がフラクタルではないことを示した。", "explain": {"basis": "抄録", "basis_note": "PNASの抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "ガラスや粒体のモデルである詰まった軟球の系で、エネルギー地形の引き込み域はフラクタルではなく滑らかな構造であることを示した（抄録）。", "p3": "可変係数の常微分方程式ソルバー（CVODE）が誤差と時間のかね合いで最良であることを示し、それを使って引き込み域の形を低次元と高次元の幾何指標で調べた（抄録）。", "p5": "広く使われる最適化手法は真の地形の幾何を壊しており、引き込み域がフラクタルだという先行の主張は不適切な写像の方法によるものだった。実際の引き込み域は明確な長さの尺度を持つ滑らかな構造だったとする（抄録）。", "fun": "「谷底の領域はぎざぎざ     "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
