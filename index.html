niqueness and Wage Growth", "url": "https://arxiv.org/abs/2610.28133", "authors": "R. Vestrelli ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Vestrelli, R., & Colladon, A. F. (2026). Occupational Uniqueness and Wage Growth (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28133", "why": "タスクが職業間にどう分布するかという新しい次元で職業の変化を測る枠組みを提示した。"}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "ロボット審判で誰が得をしたか：韓国プロ野球", "title": "Who Gains When the Umpire Is a Machine? Evidence from the Automated Ball-Strike System (ABS)", "url": "https://arxiv.org/abs/2610.27576", "authors": "Seung Jin Cho ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Cho, S. J., & Lee, J. Y. (2026). Who Gains When the Umpire Is a Machine? Evidence from the Automated Ball-Strike System (ABS) (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27576", "why": "100万球超のデータで、人間の裁量の除去とゾーン形状の変化の効果を分けて測った自然実験。"}, {"id": "pn08", "rank": 8, "field": "経済学", "headline": "予測市場は参加者が偏っても価格は偏らない", "title": "Diversity, Efficiency, and Incentives in Political Prediction Markets", "url": "https://arxiv.org/abs/2610.28277", "authors": "Harry Crane ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Crane, H., & Strumpf, K. (2026). Diversity, Efficiency, and Incentives in Political Prediction Markets (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28277", "why": "100年超の政治賭博市場と規制取引所のデータで、参加者の非代表性と価格の偏りの関係を検証した。"}, {"id": "pn09", "rank": 9, "field": "統計学", "headline": "分位点しか公表されないデータで回帰を推定する", "title": "Quantile-Only Regression: Inference and Partial Identification under Quantile Disclosure", "url": "https://arxiv.org/abs/2610.27224", "authors": "Masamune Iwasawa ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Iwasawa, M., & Nakanishi, H. (2026). Quantile-Only Regression: Inference and Partial Identification under Quantile Disclosure (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27224", "why": "平均ではなく分位点だけが開示される状況での推定・推論と部分識別の方法を体系化した。"}, {"id": "pn10", "rank": 10, "field": "因果推論", "headline": "合成コントロール：シリアの所得差は閉じない", "title": "A Break That Does Not Close: Synthetic Control Evidence from Syria, 2000–2022", "url": "https://doi.org/10.2139/ssrn.7642962", "authors": "Mazen Diwani", "venue": "SSRN", "date": "2026-10-20", "apa": "Diwani, M. (2026). A Break That Does Not Close: Synthetic Control Evidence from Syria, 2000–2022. https://doi.org/10.2139/ssrn.7642962", "why": "標本を延長し対照国群を見直すと、内戦後の回復という先行研究の結論が覆ることを示した。"}, {"id": "pn11", "rank": 11, "field": "因果推論", "headline": "処置効果は項目ごとの異質性に頑健か検定する", "title": "Testing Whether Reported Treatment Effects are Robust to Item-Level Heterogeneity", "url": "https://doi.org/10.31234/osf.io/9ru45_v3", "authors": "Peter Francis Halpin ほか", "venue": "PsyArXiv", "date": "2026-10-20", "apa": "Halpin, P. F., & Gilbert, J. B. (2026). Testing Whether Reported Treatment Effects are Robust to Item-Level Heterogeneity. https://doi.org/10.31234/osf.io/9ru45_v3", "why": "多項目の尺度で報告される処置効果が、項目反応理論の潜在変数への効果と一致しない条件を示した。"}, {"id": "pn12", "rank": 12, "field": "計算社会科学・ネットワーク科学", "headline": "誤情報の特徴を分類する練習が騙されにくさを高める", "title": "Prebunking via Induction: Categorization Practice Reduces Misinformation Susceptibility", "url": "https://doi.org/10.31234/osf.io/w2bmp_v2", "authors": "Benjamin Motz ほか", "venue": "PsyArXiv", "date": "2026-10-20", "apa": "Motz, B., Moore, K., Gregg, K., & Roozenbeek, J. (2026). Prebunking via Induction: Categorization Practice Reduces Misinformation Susceptibility. https://doi.org/10.31234/osf.io/w2bmp_v2", "why": "高校の授業内で無作為割付し、カテゴリー帰納による誤情報対策を通常の指導と比較した。"}, {"id": "pn13", "rank": 13, "field": "計算社会科学・ネットワーク科学", "headline": "複数の話題をつなぐ多層ネットワークの意見形成", "title": "DeGroot Dynamics on Multiplex Networks with Directed and Acyclic Interlayer Connectivities", "url": "https://arxiv.org/abs/2610.27198", "authors": "Mia Zender ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Zender, M., Shi, K., Hickok, A., Chu, W., & Porter, M. A. (2026). DeGroot Dynamics on Multiplex Networks with Directed and Acyclic Interlayer Connectivities (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27198", "why": "話題間の影響を有向・非巡回の層間結合で表したDeGrootモデルの合意条件を解析した。"}, {"id": "pn14", "rank": 14, "field": "機械学習（Hugging Face）", "headline": "ロボット群が経験を共有して方策を改善する", "title": "Learning from Fleet Experience: A Collective Learning Paradigm for Robots", "url": "https://arxiv.org/abs/2610.25736", "authors": "Chao Yu, Shu&#39 ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-20", "apa": "Yu, C., Yu, S., Lin, H., Zang, H., Yan, Y., Jiang, C., Guo, Z., Li, C., Chen, Y., Xu, X., Fu, X., Zhou, J., Shi, L., Ren, H., Liu, Y., Wu, J., Wang, Y., Wu, C., Dai, B., … Wang, Y. (2026). Learning from Fleet Experience: A Collective Learning Paradigm for Robots (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.25736", "why": "人手の修正に頼らず、配備されたロボットの失敗と成功の経験を共有して共通方策を改善する学習法。"}, {"id": "pn15", "rank": 15, "field": "統計学", "headline": "最適輸送の汎関数に対する中心極限定理", "title": "Central Limit Theorems for Optimal Transport Functionals", "url": "https://arxiv.org/abs/2610.27857", "authors": "Haruki Kono", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Kono, H. (2026). Central Limit Theorems for Optimal Transport Functionals (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27857", "why": "二次最適輸送のスカラー汎関数の経験推定量について中心極限定理を確立した。"}, {"id": "pn16", "rank": 16, "field": "統計学", "headline": "データストリームでのオンライン適合予測の実用性", "title": "Practical Advantages of Online Conformal Prediction for Data Streams", "url": "https://arxiv.org/abs/2610.27740", "authors": "St\\'ephane Chr\\'etien ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Chrétien, S., Hoseini-Behbahani, M., & Metzler, G. (2026). Practical Advantages of Online Conformal Prediction for Data Streams (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27740", "why": "厳密な全適合予測の計算負担を避けるオンライン版の実用上の利点を整理した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "データストリームでの4種類の逐次的な適合予測（conformal prediction）を、重み付き全適合予測と被覆率・区間幅・計算量で比較した（抄録）。", "p3": "通常または忘却係数付きの最小二乗と、一様・指数重みの残差分位点、またはオンライン勾配による分位点追跡を組み合わせた手順を、独立同分布の対照、2つの合成分布シフト、4つの実データで評価した（抄録）。", "p5": "回帰モデルと適合予測の閾値の両方を適応させることの利点を示唆している（抄録の途中まで）。", "fun": "予測に「どのくらい外れうるか」の幅を付けるのが適合予測です。データの性質が時間とともに変わる流れの中では、昔のデータを少しずつ忘れていく工夫が効くかを、計算の手間も含めて比べた点が実用的で面白いところです。", "unverified": "抄録の結論部分が切れており、手順間の優劣は未確認。"}}, {"id": "pn17", "rank": 17, "field": "統計学", "headline": "事前データ適合ネットワークの偏りを除いた準パラメトリック推論", "title": "Debiased Prior-Data Fitted Networks for Amortized Bayesian Semi-Parametric Inference", "url": "https://arxiv.org/abs/2610.28314", "authors": "Valentyn Melnychuk ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Melnychuk, V., Javurek, E., & Feuerriegel, S. (2026). Debiased Prior-Data Fitted Networks for Amortized Bayesian Semi-Parametric Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28314", "why": "償却型ベイズ推論のPFNに偏り補正を加え、準パラメトリック推論に使えるようにした。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "事前データ適合ネットワーク（PFN）を、欠測下の平均や因果効果などの準パラメトリックな推論に使うための偏り除去の理論を与えた（抄録）。", "p3": "理想化したPFNでも、目標の事後分布の集中の速さが潜在的な撹乱関数の集中の速さに依存し、事前分布が多様になると遅くなることを示し、2つの一般的な偏り除去の戦略を導入した（抄録）。", "p5": "偏り除去により目標の事後集中の速さを改善するとしている。数値結果は抄録の範囲では未確認。", "fun": "PFNは「たくさんの模擬問題で練習したニューラルネットが、新しいデータを見るだけで推論する」仕組みです。そんな賢いネットでも、知りたい量以外の余計な部分の推定の粗さに引きずられることを示し、その補正法を考えた点が面白いところです。", "unverified": "偏り除去の具体的な手順と数値実験の結果は未確認。"}}, {"id": "pn18", "rank": 18, "field": "統計学", "headline": "測度で添字付けたカーネルリッジ回帰で文脈内学習", "title": "Nonparametric In-Context Learning and Inference via Measure-Indexed Kernel Ridge Regression", "url": "https://arxiv.org/abs/2610.28056", "authors": "Zuofeng Shang ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Shang, Z., Hu, T., Yang, F., & Li, Y. (2026). Nonparametric In-Context Learning and Inference via Measure-Indexed Kernel Ridge Regression (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28056", "why": "複数タスクから学ぶ文脈内学習を非パラメトリック推論として定式化した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "文脈内学習（in-context learning）を、測度で添字付けた再生核ヒルベルト空間の枠組みで非パラメトリックな推論として定式化した（抄録）。", "p3": "推定量の適応性を、文脈の経験測度に対する平均汎関数の依存として捉える測度添字付きRKHSを作り、文脈内学習推定量の分布的な振る舞いを扱う（抄録）。", "p5": "抄録が途中で切れており、収束や推論の具体的な結果は未確認。", "fun": "大規模言語モデルは、例をいくつか見せるだけで新しい課題に対応できます。この「例を見て学ぶ」能力を、統計学の言葉で推定量として扱い、どのくらい確かな答えが出るかを論じようとする点が面白いところです。", "unverified": "理論結果の詳細は未確認。"}}, {"id": "pn19", "rank": 19, "field": "統計学", "headline": "潜在変数を含む線形SEMの有向非巡回グラフを学習", "title": "Data-Driven Learning of Directed Acyclic Graphs in Gaussian Linear Structural Equation Models with Latent Variables", "url": "https://arxiv.org/abs/2610.27873", "authors": "Siliang Zhang ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Zhang, S., Chen, Y., & Moustaki, I. (2026). Data-Driven Learning of Directed Acyclic Graphs in Gaussian Linear Structural Equation Models with Latent Variables (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27873", "why": "確認的に使われがちな構造方程式モデルを、潜在変数込みでデータ駆動に構造学習する方法。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "潜在変数をもつガウス線形構造方程式モデルで、測定モデルは既知のまま、構造の経路図（DAG）をデータから学習する方法DAGGLEを提案した（抄録）。", "p3": "構造モデルの識別可能性を示した上で（DAGはマルコフ同値類まで識別可能）、学習アルゴリズムDAGGLEを提案した（抄録）。", "p5": "抄録が途中で切れており、性能評価の結果は未確認。", "fun": "構造方程式モデルは、研究者が「この要因がこれに効く」と矢印を先に決めて確かめるのが普通です。その矢印の向きをデータから探す半探索的なやり方を、潜在変数があっても成り立つように整えた点が面白いところです。", "unverified": "シミュレーションや実データでの結果は未確認。"}}, {"id": "pn20", "rank": 20, "field": "統計学", "headline": "LSTMで非反復g公式のプラグイン推定量", "title": "A plug-in estimator of the non-iterative conditional expectation g-formula using long short-term memory models", "url": "https://arxiv.org/abs/2610.27354", "authors": "Jing Li ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Li, J., Rein, S. M., Wang, Z., Wang, Z., McGrath, S., Robins, J. M., Kolokotrones, T., Mukherjee, R., & Hernán, M. A. (2026). A plug-in estimator of the non-iterative conditional expectation g-formula using long short-term memory models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27354", "why": "時間変化する交絡のある因果効果推定のg公式に、系列モデルを組み込んだ。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "時間とともに変わる交絡がある場合のg公式の非反復条件付き期待（NICE）プラグイン推定量を、LSTMで推定する方法を検討した（抄録）。", "p3": "交換可能性・正値性・一致性の仮定の下で、交絡・処置・結果の時系列の同時分布をパラメトリックモデルの代わりにLSTMで推定する（抄録）。", "p5": "抄録が途中で切れており、推論の妥当性の評価結果は未確認。", "fun": "治療を続けるかやめるかで結果がどう変わるかを観察データから推定するとき、途中の体調がその後の治療を左右し、さらに結果にも効くという「堂々巡り」が難所です。この堂々巡りを、系列データに強いLSTMで表そうとする点が面白いところです。", "unverified": "シミュレーションの設定と結果は未確認。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "相手ごとに反応が異なる社会的相互作用の離散選択", "title": "Discrete Choice with Generalized Social Interactions", "url": "https://arxiv.org/abs/2610.27324", "authors": "Oscar Volpe", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Volpe, O. (2026). Discrete Choice with Generalized Social Interactions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27324", "why": "ネットワーク内の相手によって影響の強さが異なる場合の離散選択モデルの識別を扱う。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ネットワーク内の相手によって同調したり差別化したりする一般化した社会的相互作用を、離散選択モデルで推定する方法を示した（抄録）。", "p3": "ネットワーク内の選択の変動を使って内生的相互作用効果の差を推論し、観察されない文脈効果を考慮し、測定誤差の偏りを補正する内部操作変数を構成する（抄録）。", "p5": "テネシー州の小学校の学級の仲間効果とケニアの駆虫治療の波及に適用し、いずれでも社会的相互作用の差を見いだした（抄録）。", "fun": "人は友だちの真似をすることもあれば、あえて違う行動を取ることもあります。誰に合わせ、誰と差をつけるかをデータから見分けるという、人間関係の微妙さを数理モデルに持ち込んだ点が面白いところです。", "unverified": "効果の大きさは未確認。"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "構造VARによる証拠に基づくマクロ政策選択", "title": "Evidence-Based Policy Choice in Macroeconomics", "url": "https://arxiv.org/abs/2610.27405", "authors": "Toru Kitagawa ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Kitagawa, T., & Martinalli, S. (2026). Evidence-Based Policy Choice in Macroeconomics (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27405", "why": "データ駆動のマクロ政策選択を構造VARの枠組みで定式化した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "構造VARの枠組みで、データにもとづくマクロ経済政策の選択を統計的意思決定問題として定式化した（抄録）。", "p3": "毎期の予期しないショックで政策経路を実行する体制と、予告して予期されたショックで実行するフォワードガイダンスの体制で、オラクル・ベイズ最適・頑健ベイズの決定ルールを導いた（抄録）。", "p5": "決定問題が構造回転行列に依存するのは政策ショックに対応する列の張る空間を通じてのみであることを示した（抄録）。", "fun": "金利をどう動かすかを決めるとき、経済の仕組みを完全には知らないまま決めなければなりません。分からない部分が残っていても、決定に必要な情報だけは取り出せる、という整理が面白いところです。", "unverified": "実データへの適用結果は未確認。"}}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "共通優先順位のない重複リザーブ：チリの学校選択", "title": "Overlapping Reserves without a Common Priority: Theory and an Application to School Choice in Chile", "url": "https://arxiv.org/abs/2610.28471", "authors": "Battal Do\\u{g}an ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Doğan, B., Imamura, K., & Yenmez, M. B. (2026). Overlapping Reserves without a Common Priority: Theory and an Application to School Choice in Chile (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28471", "why": "異なる優先順位をもつ重複リザーブのマッチング理論とその応用。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "優先順位が異なる重複リザーブ（優先枠）のあるマッチング市場で、枠を最大限使い優先順位を尊重する、耐戦略的な受入保留方式を設計した（抄録）。", "p3": "分類と順位付けによる選択ルールを導入し、受入の結果を公理的に特徴付け、2種類の枠でのリザーブの順序の基礎付けと分配上の含意を示した（抄録）。", "p5": "チリの学校入学の9回分のデータで、実際に使われた方式では枠の未使用が生じていたことを示した（抄録）。", "fun": "入試の優先枠に複数当てはまる生徒を、どの枠で合格させるかによって、枠が余ったり別の生徒が落ちたりします。この「割り振り方」の工夫だけで、より多くの生徒に枠を届けられるという点が面白いところです。", "unverified": "新方式で改善される人数などの数値は未確認。"}}, {"id": "pn24", "rank": 24, "field": "経済学", "headline": "昇進シグナルと肩書きインフレ", "title": "Promotion Signaling and Signal Jamming: An Analysis of Job Title Inflation", "url": "https://doi.org/10.2139/ssrn.7634938", "authors": "Yi Chen ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Chen, Y., Waldman, M., & Yin, Z. (2026). Promotion Signaling and Signal Jamming: An Analysis of Job Title Inflation. https://doi.org/10.2139/ssrn.7634938", "why": "昇進がシグナルになる労働市場で、肩書きのインフレが起きる仕組みを分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "肩書きのインフレが昇進のシグナル価値を弱める「シグナル撹乱」として働くことを理論的に示した（抄録）。", "p3": "2期間モデルで均衡としての肩書きインフレを導き、さらに若い労働者の人的資本投資の選択を加えた（抄録）。", "p5": "肩書きインフレは、労働者が立派な肩書きを直接好むことと、シグナリングによる配置の非効率を減らすことで厚生を高めうるが、人的資本投資を入れると厚生を下げうる（抄録）。", "fun": "「マネージャー」の肩書きを気前よく配ると、昇進が能力の証明として機能しにくくなります。それが社会にとって得にも損にもなりうる、という両面を数理モデルで示した点が面白いところです。", "unverified": "厚生が下がる条件の詳細は未確認。"}}, {"id": "pn25", "rank": 25, "field": "経済学", "headline": "離職できる労働者への業務量と賃金の保険", "title": "Workload and Wage Insurance When Workers Can Quit", "url": "https://doi.org/10.2139/ssrn.7632058", "authors": "Kyoung Jin Choi ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Choi, K. J., & Jeon, J. (2026). Workload and Wage Insurance When Workers Can Quit. https://doi.org/10.2139/ssrn.7632058", "why": "需要変動に対する業務量調整と賃金保険の同時設計を理論分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "企業は契約に縛られるが労働者はいつでも辞められる状況で、業務量と賃金の同時設計の最適政策を示した（抄録）。", "p3": "市場状態が高・低の業務量のもとでの収入を決め、切替えに双方向の費用がかかるモデルで、すべての再開費用について最適政策を特徴付けた（抄録）。", "p5": "各業務量のもとで賃金は事前に決まった経路をたどり、外部機会が拘束的になるときだけ上がる。業務量の切替えの閾値は賃金や業務量が変わるたびに改定すべきである（抄録）。", "fun": "景気が悪いと仕事を減らし、良くなると戻すとき、給料をどう保証すれば社員が辞めずにすむか、という問題です。辞められる自由がある相手との約束をどう設計するかは、身近な雇用の悩みそのものです。", "unverified": "数値例の有無は未確認。"}}, {"id": "pn26", "rank": 26, "field": "経済学", "headline": "最適停止ゲームで重なるデジタルナッジが打ち消し合う", "title": "Digital Nudge Effects in Optimal Stopping Games: Antagonistic Interactions in Layered Choice Architectures", "url": "https://arxiv.org/abs/2610.28154", "authors": "Batisse Manhardt ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Manhardt, B., & Duane, J.-N. (2026). Digital Nudge Effects in Optimal Stopping Games: Antagonistic Interactions in Layered Choice Architectures (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28154", "why": "複数の層からなる選択アーキテクチャでナッジ同士の拮抗的な相互作用を調べた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "アンカリング・顕著性・社会的証明のデジタルナッジを組み合わせると、互いに打ち消し合って意思決定の質が下がることを示した（抄録）。", "p3": "秘書問題にもとづく逐次意思決定課題で、2³の参加者間要因計画（N = 181）により個別と組合せの効果を調べた（抄録）。", "p5": "アンカーのナッジは探索を制約せず増やし（b = 1.207、p = .017）、顕著性のナッジの効果は最小で、アンカーと社会的証明の組合せは成果の質が最も悪かった（アンカーのみ192.21ドルに対し181.83ドル）（抄録）。", "fun": "良かれと思って「おすすめ」や「みんなが選んでいます」を重ねると、かえって判断が悪くなることがある、という結果です。効く薬を混ぜたら効かなくなる、という飲み合わせの問題に似ている点が面白いところです。", "unverified": "抄録の後半（単調な低下の詳細）は未確認。"}}, {"id": "pn27", "rank": 27, "field": "機械学習（Hugging Face）", "headline": "記憶を基盤モデルの内在能力にするMemT-1.0", "title": "MemT-1.0: Towards Memory-Native Evolution", "url": "https://arxiv.org/abs/2610.26825", "authors": "Zhiyu Li ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-20", "apa": "Li, Z., Zhang, Z., Liu, L., Bu, Y., Xi, C., Zhang, X., Yu, Y., Yu, Y., Liu, Z., Yi, Y., Li, C., Liu, H., Ding, Z., Zhou, L., Zhang, J., Chen, B., Lin, Z., Li, G., Fu, R., … Xiong, F. (2026). MemT-1.0: Towards Memory-Native Evolution (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2610.26825", "why": "外部記憶ではなくモデル自体に記憶を組み込んで進化させる方向を提示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv抄録を使用", "preprint": true, "short": true, "p1": "記憶をモデルの計算の一部として内在化する記憶基盤モデルMemT-1.0を提案した（抄録）。", "p3": "Metisを基に、各ターン内でトークン単位の安定な記憶更新を行うGated DeltaNet-2を使い、記憶容量を拡張するMixture-of-Storageを導入した。340億トークンのデータで継続事前学習と事後学習の2段階で訓練した（抄録）。", "p5": "MemT-1.0-NanoとMemT-1.0-Flashのモデル群を公開した（抄録）。性能評価の数値は抄録の範囲では未確認。", "fun": "今のAIは会話の記憶を外のメモ帳に書いて読み直すことが多いのですが、このモデルは記憶をモデルの中に溶け込ませようとしています。人間の記憶のように、使いながら覚えていくAIへの一歩という点が面白いところです。", "unverified": "ベンチマークでの性能は未確認。"}}, {"id": "pn28", "rank": 28, "field": "機械学習（Hugging Face）", "headline": "人の一人称映像から世界に根ざした表現を学習", "title": "EgoXperience: Learning World-Grounded Egocentric Representations from Human Experience", "url": "https://arxiv.org/abs/2610.26625", "authors": "Xinhao Ji ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-20", "apa": "Ji, X., Pang, H. E., Li, H., Hu, K., Wang, J., Sun, M., Cao, Z., Dai, Y., Luu, T., Ma, Q., Chen, H., Cao, Y., Hong, F., Chen, Z., & Liu, Z. (2026). EgoXperience: Learning World-Grounded Egocentric Representations from Human Experience (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.26625", "why": "一人称映像からの人間活動の再構成に向けた表現学習。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv抄録を使用", "preprint": true, "short": true, "p1": "一人称映像から、観察者の動き・周囲の形状・手と物体の相互作用を一つの整合した世界として再構成するための、データ収集から評価までの一式EgoXperienceを示した（抄録）。", "p3": "幾何学的に検証した物体追跡とSLAMによる世界座標の整合を組み合わせた自動注釈エンジンEgoX-Engineで、カメラ・シーン・手などの一貫した教師信号を作る（抄録）。", "p5": "抄録が途中で切れており、統一モデルとベンチマークの結果は未確認。", "fun": "頭に付けたカメラの映像から「自分がどう動き、手で何をつかんだか」を立体的に復元するには、部品ごとに推定するのではなく全体のつじつまを合わせる必要があります。その「つじつま合わせ」を自動で大量に作る工夫が面白いところです。", "unverified": "モデルの性能の数値は未確認。"}}, {"id": "pn29", "rank": 29, "field": "機械学習（Hugging Face）", "headline": "音声・画面を同時に扱う全モダリティGUIエージェント", "title": "Focused Omni-Modal GUI Agents", "url": "https://arxiv.org/abs/2610.26203", "authors": "Fuyao Zhang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-21", "apa": "Zhang, F., He, W., Zhang, J., Hao, Y., Wang, X., Guan, G., Wang, C., Huang, L., & Lim, W. Y. B. (2026). Focused Omni-Modal GUI Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.26203", "why": "スクリーンショットや音声などの流れる観測に注意を絞って操作するGUIエージェント。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv抄録を使用", "preprint": true, "short": true, "p1": "画面・音声・映像などを同時に受け取るGUIエージェントで、その都度関係する情報だけに注意を絞る軽量アダプタFocusGUIを提案した（抄録）。", "p3": "ある行動を決めた信号が次の行動では雑音になり、誤りが積み重なる「逐次的な注意散漫」を問題とし、段階適応的・行動に十分・非侵襲的な「焦点を絞った知覚」を要件として定式化した（抄録）。", "p5": "抄録が途中で切れており、性能評価の結果は未確認。", "fun": "パソコンを操作するAIに画面も音も履歴も全部見せると、かえって気が散って操作を誤り、その誤りが次の誤りを呼びます。人がスマホを操作するときのように、その場で必要なものだけを見る工夫が面白いところです。", "unverified": "改善の程度は未確認。"}}, {"id": "pn30", "rank": 30, "field": "機械学習（Hugging Face）", "headline": "進捗に合わせた再帰で状態追跡の長さ汎化", "title": "PAR: Progress-Aligned Recurrence for Length Generalization in State Tracking", "url": "https://arxiv.org/abs/2610.27628", "authors": "Pan Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-21", "apa": "Wang, P., Hu, Y., Dong, G., Lin, Y., Wang, H., Liu, Z., Wen, Z., Li, J., Yang, J.-M., Wu, W., & Tong, Y. (2026). PAR: Progress-Aligned Recurrence for Length Generalization in State Tracking (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27628", "why": "ループ型言語モデルが推論時に反復を増やしても長い系列に汎化できるようにする工夫。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv抄録を使用", "preprint": true, "short": true, "p1": "ループ型言語モデルで、反復ごとに進むべき量をそろえる学習法PARにより、学習長の16倍の状態追跡に汎化させた（抄録）。", "p3": "k回目の反復の予測が最初のk個の操作後の状態に一致するよう学習し、再帰状態のノルムを最初の反復の値に再スケールする（抄録）。", "p5": "swap-S5で、最大32手で学習したQwen2.5-0.5Bが512手（学習長の16倍）で平均の全状態正解率95.5%を達成し、同じ基盤でRLTの55.7%、明示的な思考の連鎖の0.8%を上回った（抄録）。", "fun": "5つの物の入れ替えを何百回も追いかける課題で、32回分しか練習していないのに512回分も正しく追えるようになりました。1回の反復で1手ずつ進む、と歩幅をそろえて教えるだけで大きく変わる点が面白いところです。", "unverified": "他の課題での結果は未確認。"}}, {"id": "pn31", "rank": 31, "field": "機械学習（Hugging Face）", "headline": "長期実行から科学探索へ：Sage-A1.5", "title": "Sage-A1.5: From Long-Horizon Execution to Scientific Exploration with Capability Composition", "url": "https://arxiv.org/abs/2610.28578", "authors": "Wenjie Lou ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-21", "apa": "Lou, W., Peng, T., Feng, S., Tang, S., Ma, R., Chen, R., Shi, J., Peng, H., Yu, F., Zhong, Z., Zhou, Y., Fan, Y., Chen, Y., Wu, Y., Wang, Y., Jiang, Y., Jiang, Y., Xie, Y., Guo, X., … Zhang, B. (2026). Sage-A1.5: From Long-Horizon Execution to Scientific Exploration with Capability Composition (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28578", "why": "能力の組合せで長期タスクと科学的探索をこなす35BのMoEモデルの技術報告。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv抄録を使用", "preprint": true, "short": true, "p1": "350億パラメータの専門家混合（MoE）エージェントモデルSage-A1.5で、能力を組み合わせて長期の問題解決と科学的探索を行う（抄録）。", "p3": "文脈を分けたサブエージェントへのタスク委任と並列協調によるエージェント的オーケストレーション、検証、開かれた科学的発見の3点を改善した（抄録）。", "p5": "抄録が途中で切れており、性能の数値は未確認。", "fun": "大きな仕事を小さく分けて部下に任せ、結果を確かめながら進めるという、人間のチームの働き方をAIの中に持ち込んでいます。一人の天才より、上手に分担する組織のほうが強いかという問いが面白いところです。", "unverified": "評価ベンチマークと結果は未確認。"}}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "エージェントのハーネス最適化の利得は引き出しか拡張か", "title": "Elicitation or Expansion? Demystifying Gains from Agent Harness Optimization", "url": "https://arxiv.org/abs/2610.27889", "authors": "Younghyun Kim ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "why": "重みを変えずにハーネスを最適化したときの性能向上の正体を分析した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "重みを変えないハーネス最適化による言語モデルエージェントの性能向上が、もともと解ける課題をより確実に解く「引き出し」か、解ける範囲を広げる「拡張」かを区別して分析した（抄録）。", "p3": "文脈・道具の使用・実行の流れを形作るハーネスの最適化について、単純な成功率では区別できない引き出しと拡張を分けて測る（抄録）。", "p5": "抄録が途中で切れており、結論は未確認。", "fun": "AIの成績が上がったとき、それは「できることを確実にできるようになった」のか「できなかったことができるようになった」のかで意味が違います。テストの点数が上がった理由を見分けるのと同じ発想が面白いところです。", "unverified": "どちらが主だったかの結果は未確認。"}}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "視覚言語モデルでの逆スケーリング", "title": "On the Limits of Scale: Inverse Scaling in Vision-Language Models", "url": "https://arxiv.org/abs/2610.27360", "authors": "Rohit Saxena ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "why": "モデルを大きくすると性能が下がる課題が視覚言語モデルにもあることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "視覚言語モデルでは、大きなモデルほど成績が下がる質問の種類（サブタスク単位の逆スケーリング）が系統的に存在することを示した（抄録）。", "p3": "4系統19モデルを8つのマルチモーダルベンチマーク（9評価分割）で評価し、1モデル当たり29,386問、計558,334のモデル・問題の評価で、系統内の全モデル対を問題ごとに比較した（抄録）。", "p5": "逆スケーリングを示すサブタスクとモデル対の組合せを375個特定した（抄録）。", "fun": "AIは大きくするほど賢くなると言われますが、問題の種類によっては大きいほうが間違えやすいことが分かりました。全体の平均点だけを見ていると見逃す「苦手科目」を、問題ごとの比較で掘り出した点が面白いところです。", "unverified": "逆スケーリングの原因の分析は未確認。"}}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "活性化空間の操作で検証可能報酬RLの探索を促す", "title": "Exploration via Activation-Space Steering for Reinforcement Learning with Verifiable Rewards", "url": "https://arxiv.org/abs/2610.27012", "authors": "Yunan Zeng ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "why": "検証可能な報酬による強化学習の探索不足を、内部表現の操作で補う方法。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "検証可能な報酬による強化学習（RLVR）で、内部の活性化を操作して訓練時の解答の多様性を高める方法ASEを提案した（抄録）。", "p3": "同じ問題への正答と誤答の活性化の差をクラスタリングして潜在的な探索ベクトルの集まりを作り、異なるベクトルを適用して解答を多様化する（抄録）。", "p5": "抄録が途中で切れており、性能評価の結果は未確認。", "fun": "同じAIに何度も答えさせても、似た考え方ばかりになりがちです。正解と不正解のときの「頭の中の違い」を取り出して、わざと違う考え方の方向へ押してやるという発想が面白いところです。", "unverified": "改善の数値は未確認。"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "相対表現でモデル間を移植できるホワイトボックス監視", "title": "Relative Representations Enable Portable White-Box Monitoring Across Language Models", "url": "https://arxiv.org/abs/2610.28366", "authors": "Tim Bakker ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "why": "別々に学習した言語モデル間で内部監視器を使い回せることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "別々に学習した言語モデルでも、内部表現が行動上重要な情報を似た形で整理しており、ある モデルで作った監視用プローブを別のモデルに使い回せることを示した（抄録）。", "p3": "活性化の座標の違いを乗り越えるため、各例を共有のアンカー集合への角度距離で表す相対表現を使い、全層の情報をまとめる大域アンカー構成を導入した（抄録）。", "p5": "対象のラベル付きデータなしで、モデルが変わってもプローブを再利用できるとしている。数値は抄録の範囲では未確認。", "fun": "AIの頭の中を覗く「探知機」は、モデルを替えるたびに作り直すのが普通でした。いくつかの目印との距離で表すという、地図の座標を相対位置に置き換えるような工夫で、別のAIにも使えるようにした点が面白いところです。", "unverified": "移植後の検出性能の数値は未確認。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "偏微分方程式を記号的に発見する生成基盤モデル", "title": "FoundPDE: A generative foundation model for data-driven symbolic discovery of partial differential equations", "url": "https://arxiv.org/abs/2610.26963", "authors": "Langchen Liu ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "why": "データから支配方程式を記号で発見する生成的な基盤モデルを提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "観測した時空間の軌跡から、偏微分方程式を記号の形で発見する事前学習済みの基盤モデルFoundPDEを提案した（抄録）。", "p3": "離散化した時空間の軌跡をトランスフォーマーで記号方程式に写像し、フーリエ特徴と一階の空間情報を用いる（抄録）。", "p5": "抄録が途中で切れており、性能評価の結果は未確認。", "fun": "データから「どんな法則が成り立っているか」を数式として取り出せれば、予測だけでなく理解や再利用ができます。たくさんの方程式で事前に練習したAIに、新しいデータの法則を一目で言い当てさせようという発想が面白いところです。", "unverified": "雑音や疎な観測への頑健性の数値は未確認。"}}, {"id": "pn37", "rank": 37, "field": "計算社会科学・ネットワーク科学", "headline": "人と生成AIの協働での交換記憶システム", "title": "The GenAI Who Knew Too Little: Revisiting Transactive Memory Systems in Human GenAI Collaboration", "url": "https://arxiv.org/abs/2610.28343", "authors": "Christian Meske ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "why": "知識労働者への面接から、人と生成AIの間の専門性の認識の非対称を描いた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "人と生成AIの協働で、交換記憶システム（TMS：誰が何を知っているかの共有）がどう現れるかを描いた（抄録）。", "p3": "知識労働者14人への質的な解釈的面接と主題分析（抄録）。", "p5": "専門性の認識は非対称で、人はAIの能力を把握するがAIは人の専門性を一時的にしか認識しない。信頼性については、人はAIに両義的な信頼を形成していた（抄録）。", "fun": "チームでは「あの件は○○さんが詳しい」と分かっていることが力になります。ところがAIは相手が誰で何に詳しいかをすぐ忘れてしまうため、人だけが一方的に相手を覚える関係になる、という指摘が面白いところです。", "unverified": "14人の面接にもとづく探索的な結果である（抄録）。"}}, {"id": "pn38", "rank": 38, "field": "計算社会科学・ネットワーク科学", "headline": "情報理論で社会ネットワークの進化を記述", "title": "An Information-Theoretic Model for the Evolution of a Social Network", "url": "https://arxiv.org/abs/2610.28016", "authors": "Johnathan Brink ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "why": "エコーチェンバーやフィルターバブルを情報理論的なネットワーク進化モデルで扱う。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "文章を生成するノード間の交差エントロピーに応じて辺を張り替える進化的ネットワークモデルで、エコーチェンバーの形成を調べた（抄録）。", "p3": "Quoterモデルを拡張し、ノードが新規性の高い隣人を求めるか低い隣人を求めるか（強化か探索か）をパラメータで表した（抄録）。", "p5": "シミュレーションで構造の出現を観察したとしている（抄録の途中まで）。", "fun": "SNSで似た意見の人とばかりつながるのは、新しい情報を嫌って「聞き慣れた話」を好むからかもしれません。会話の「意外さ」を情報理論で測り、それがつながり方をどう変えるかを模擬した点が面白いところです。", "unverified": "シミュレーションの具体的な結果は未確認。"}}, {"id": "pn39", "rank": 39, "field": "計算社会科学・ネットワーク科学", "headline": "技術能力の断続平衡と最先端の予測可能性", "title": "Punctuated Equilibrium in Technological Capabilities: Commercial Selection and the Predictability of Frontier Advances", "url": "https://arxiv.org/abs/2610.26971", "authors": "Kenzi M'Hamdi ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "why": "技術の最先端の進歩が断続的に起きるかを商業的選択の観点から検証した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "電子部品の製品記録約174万件で、技術能力の最先端の向上が断続的に一度に起きることを示した（抄録）。", "p3": "手作業で選んだ29の能力について、最先端の改善のテンポと商業的に提供される製品の多様性を分析した（抄録）。", "p5": "大きな進歩の局面の77.8%が単一の進歩年からなり、進歩で始まる3年間の改善のうち最初の年の向上が平均79.3%を占めた。最先端付近の製品記録の割合の中央値は1.46%だった（抄録）。", "fun": "技術はなだらかに進歩するように見えて、実際には「ある年にどんと進んで、あとは横ばい」が多いことが分かりました。生物の進化で言われる断続平衡のような進み方が技術にも見られる点が面白いところです。", "unverified": "後半の204の能力への拡張分析の結果は未確認。"}}, {"id": "pn40", "rank": 40, "field": "計算社会科学・ネットワーク科学", "headline": "STVでは選挙区の定数が比例性を左右する", "title": "District Size Matters: How Seats Per District Shapes Proportionality Under STV", "url": "https://arxiv.org/abs/2610.27297", "authors": "Daryl DeFord ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "why": "単記移譲式投票で選挙区当たりの議席数が比例性に与える影響を調べた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "複数定数の選挙区と単記移譲式投票（STV）を使うと、選挙区当たりの定数によって党派的な比例性がどう変わるかを調べた（抄録）。", "p3": "イリノイ・ニューハンプシャー・ニューメキシコの州上院を対象に、2・3・4人区を中心とする区割り案の集合を、選挙区の積み上げと既存小選挙区の統合の2方法で作り、修正Bradley-TerryモデルとPlackett-Luceモデルで投票を生成した（抄録）。", "p5": "抄録が途中で切れており、結論は未確認。", "fun": "1つの選挙区から何人選ぶかで、議席の配分が得票の割合にどれだけ近づくかが変わります。仮想の区割りを大量に作って比べることで、制度の設計の効果を「もしも」の世界で確かめる点が面白いところです。", "unverified": "定数ごとの比例性の結果は未確認。"}}, {"id": "pn41", "rank": 41, "field": "計算社会科学・ネットワーク科学", "headline": "AIと科学的コモンズの囲い込み", "title": "AI and The Enclosure of the Scientific Commons", "url": "https://arxiv.org/abs/2610.27251", "authors": "P. K. G. Williams (Center for Astrophysics | Harvard ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "why": "科学文献を情報コモンズとみなし、AIによる囲い込みの問題を論じた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "科学文献を「情報コモンズ」とみなし、AIによる囲い込みの問題を、歴史と経済・政治の枠組みから論じた入門的な論考（抄録）。", "p3": "産業革命前のイングランドの共有地の歴史とそれに関するコモンズの理論を紹介し、情報コモンズとかつての共有地の違いを検討する（抄録）。", "p5": "情報コモンズは頑健で非常に価値が高いのに対し、イングランドの農業の共有地はもはや実質的に存在しない、という対比から議論を進める（抄録）。", "fun": "昔のイギリスでは、みんなの牧草地が囲い込まれて私有地になりました。誰もが使える科学の論文の山も、AIによって同じように囲い込まれるかもしれない、という歴史のたとえが面白いところです。", "unverified": "論考の具体的な提言は未確認。"}}, {"id": "pn42", "rank": 42, "field": "社会学", "headline": "アルゴリズム差別は社会的不平等を再生産する", "title": "Algorithmic Discrimination and the Reproduction of Social Inequality: A Sociological Review with Evidence Relevant to Bangladesh", "url": "https://doi.org/10.2139/ssrn.7635778", "authors": "Mahade Hasan Kazi", "venue": "SSRN", "date": "2026-10-21", "why": "AIによる分類・推薦が不平等を再生産する仕組みを社会学的に整理した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "アルゴリズムによる差別を社会学的に整理し、バングラデシュに関する証拠も合わせて検討した叙述的レビュー（抄録）。", "p3": "雇用・医療・顔分析の記録された事例と、ベンガル語モデルやバングラデシュのデジタルアクセスの証拠をレビューし、AIモデルで測られた偏り、自動化された制度的決定による害、AIの恩恵を受ける人を左右する既存の不平等という3種類の証拠を区別した（抄録）。", "p5": "国際的な事例から、過去の採用データが偏りを再生産する仕組みなどを示す（抄録の途中まで）。", "fun": "AIの差別というと「モデルの精度の偏り」を思い浮かべがちですが、そもそも誰がAIを使えるかという社会の格差も含めて考える必要があります。3種類の証拠を混同しないように分けた点が面白いところです。", "unverified": "バングラデシュに関する具体的な結論は未確認。"}}, {"id": "pn43", "rank": 43, "field": "統計学", "headline": "Tobitモデルの特定化を乗数ブートストラップで検定", "title": "A multiplier bootstrap score test for Tobit specification", "url": "https://arxiv.org/abs/2610.28169", "authors": "Xuewen Li ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "why": "Tobit回帰の特定化を、計算の軽いスコア検定と乗数ブートストラップで検定する方法を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "Tobit回帰モデルの特定化を、計算の軽い乗数ブートストラップで行うスコア型の検定を提案した（抄録）。", "p3": "一般化Tobit残差の条件付き平均がゼロという条件付きモーメント制約を、推定したインデックスで条件付けた積分条件付きモーメント法で検定し、平滑化や調整パラメータを不要にした（抄録）。", "p5": "実行可能な過程の一次の一様表現を導き、構造パラメータの最尤推定がその極限挙動にどう影響するかを示した（抄録）。", "fun": "支出額のように「ゼロで止まる」データにはTobitモデルがよく使われますが、そのモデルが本当に合っているかを確かめる手軽な方法は意外と少ないのです。調整のつまみを使わずに検定できる点が実用的で面白いところです。", "unverified": "シミュレーションでの検出力は未確認。"}}, {"id": "pn44", "rank": 44, "field": "組織行動・心理的安全性", "headline": "進化する多エージェントチームで誰の技能を変えるか", "title": "Which Agent's Skill Should Change? Group-Relative Credit Assignment for Evolving Multi-Agent Teams", "url": "https://arxiv.org/abs/2610.27227", "authors": "Yanan Ma ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "why": "協調するLLMエージェントの改善でグループ相対の貢献配分を行う方法。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "協調するLLMエージェントのチームで、チーム報酬をどのエージェントのどの技能の責任かに帰属させて技能を改善する方法GRSEを提案した（抄録）。", "p3": "GRPOに着想を得て、同じ技能ライブラリで各質問を複数回実行し、実行同士を比較してエージェントと技能の組に貢献を割り当て、失敗を構造的に診断する（抄録）。", "p5": "HotpotQAとLoCoMoで評価した（抄録の途中まで）。数値は未確認。", "fun": "チームが成功したとき、その場にいただけのメンバーまで手柄を得ると、実は足を引っ張っていた人が見逃されます。同じ条件で何度もやらせて比べることで「誰のおかげか」を見極める点が、人間の組織の評価にも通じて面白いところです。", "unverified": "改善の数値は未確認。"}}, {"id": "pn45", "rank": 45, "field": "組織行動・心理的安全性", "headline": "リーダーのマインドフルネスはマインドフル・リーダーシップではない", "title": "Leader Mindfulness Is Not Mindful Leadership: A Conceptual Analysis of Construct Boundaries in Leadership Research", "url": "https://doi.org/10.31234/osf.io/a9hpc_v1", "authors": "Barry Tse", "venue": "PsyArXiv", "date": "2026-10-20", "why": "リーダーシップ研究での構成概念の境界を概念的に整理した。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "マインドフル・リーダーシップは、まだ独立したリーダーシップの構成概念として確立していないと論じた概念分析（抄録）。", "p3": "意図的に集めた58本の全文を対象に、構成概念の内容と位置、実証での表現、研究デザイン、推論の根拠を個々の主張の水準で検討した（抄録）。", "p5": "リーダーのマインドフルネスは個人水準の心理的構成概念であり、リーダー行動や集団成果との結び付きには別に特定された仕組みと証拠が必要だとする（抄録）。", "fun": "「リーダーが瞑想的に落ち着いている」ことと「チームを上手に導く」ことは別物です。個人の心の状態を、そのまま組織の指導力と呼んでよいのか、という言葉の使い方に厳しく切り込む点が面白いところです。", "unverified": "概念分析で新しいデータは用いていない（抄録）。"}}, {"id": "pn46", "rank": 46, "field": "組織行動・心理的安全性", "headline": "政治的つながりと融資：人脈かノウハウか", "title": "Loans, Links, and Leadership: Evidence on Know-Who and Know-How Mechanisms", "url": "https://doi.org/10.2139/ssrn.7642961", "authors": "Jeremie Bertrand ほか", "venue": "SSRN", "date": "2026-10-20", "why": "政治的つながりが企業の資金調達に効く経路を人脈とノウハウに分けて検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "企業の政治活動が借り手の資金調達のためらいを減らす効果を、人脈（know-who）とノウハウ（know-how）に分け、政権交代への頑健さを調べた（抄録）。", "p3": "複数国の企業レベルの調査データで、政権交代が企業の政治活動と借入をためらう傾向の関係をどう変えるかを分析した（抄録）。", "p5": "抄録が途中で切れており、結果は未確認。", "fun": "政治とのつながりがお金を借りやすくするとして、それが特定の政治家との縁なのか、役所との付き合い方のノウハウなのかで、政権が替わったときの強さが違うはずです。その違いを見分けようとする点が面白いところです。", "unverified": "人脈とノウハウのどちらが頑健だったかは未確認。"}}, {"id": "pn47", "rank": 47, "field": "経営学", "headline": "コネクテッド製品のロイヤリティと革新誘因", "title": "Digital Connected Products, Royalties, and Innovation Incentives", "url": "https://doi.org/10.2139/ssrn.7642418", "authors": "Carlo Cambini ほか", "venue": "SSRN", "date": "2026-10-21", "why": "データアクセスに使用料を課すメーカーの品質選択と革新誘因を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "コネクテッド製品のメーカーが第三者のデータアクセスに使用料を課しても、第三者の革新を促しうることを示した（抄録）。", "p3": "自社サービスの品質を選び、補完または代替のサービスを提供する第三者に利用量当たりの使用料を課すメーカーのモデルを分析した（抄録）。", "p5": "使用料が高いほど製品価格が下がり第三者の需要と品質への限界収益が増えるため、革新を促しうる。メーカーは使用料を排除ではなく地代の回収に使い、品質を戦略的に排除に使うこともない（抄録）。", "fun": "データを使わせる料金を上げると、ライバルの意欲をそぐと思いきや、かえって製品が安くなり利用が増えて、ライバルもやる気を出す、という逆説的な結果です。", "unverified": "モデルの前提の詳細は未確認。"}}, {"id": "pn48", "rank": 48, "field": "経営学", "headline": "レイク・ウォビゴン・ゲーム：参入と競争", "title": "The Lake Wobegon Game", "url": "https://doi.org/10.2139/ssrn.7639562", "authors": "John Duffy ほか", "venue": "SSRN", "date": "2026-10-21", "why": "能力を外生的に割り当てたN人の参入・コンテストゲームを導入した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "参加者の平均より能力が高い人だけが賞金を分ける参入型コンテスト「レイク・ウォビゴン・ゲーム」を導入し、基本形では誰も参入しないことを示した（抄録）。", "p3": "各プレイヤーは既知の有限集合から異なる能力を割り当てられ、参加料を払って参入するかを同時に決める。賞金は参加料の合計で、参入者の平均能力を超える人で等分する（抄録）。", "p5": "基本形は支配戦略で解け、誰も参入しない唯一のベイズ・ナッシュ均衡をもつ。変種も検討した（抄録）。", "fun": "「みんなが平均以上」の町の名前を冠したゲームです。能力の高い人が得をしそうに見えるのに、いちばん下の人から順に抜けていくと、最後には誰も参加しなくなる、という連鎖が面白いところです。", "unverified": "変種での均衡の結果は未確認。"}}, {"id": "pn49", "rank": 49, "field": "経営学", "headline": "高次の情報競争と適応的再配線でみる供給網の途絶", "title": "Supply chain disruption dynamics with higher-order information competition and adaptive rewiring", "url": "https://doi.org/10.2139/ssrn.7643827", "authors": "Xuemei You ほか", "venue": "SSRN", "date": "2026-10-20", "why": "リスク情報と取引関係の組み替えが供給網の途絶をどう形作るかをモデル化した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "リスク情報の高次の競争、防護戦略の進化、取引相手の付け替えを統合した2層ネットワークモデルで、供給網の途絶の動態を分析した（抄録）。", "p3": "3つの防護戦略（D/N/P）と制約付きの相手替えを組み込み、7状態のミクロなマルコフ連鎖近似で侵入条件を導いた（抄録）。", "p5": "情報は知覚されたリスクを通じて防護の選択に影響し、高次相互作用の効果は強化される情報の種類によって異なる。利得による戦略の進化は防護を支えうるが、防護の放棄を加速することもある（抄録）。", "fun": "取引先が止まるリスクの噂が広まると、会社は備えたり、相手を替えたりします。噂同士の競争と、備え方の流行と、つながりの付け替えが同時に起きる様子を、感染症のモデルのように描いた点が面白いところです。", "unverified": "数値実験の具体的な結果は未確認。"}}, {"id": "pn50", "rank": 50, "field": "経営学", "headline": "eBayオークションの戦略的な低価格スタート", "title": "Strategic Under-Pricing in Online Auctions: Testing the Moderating Roles of Seller Reputation and Bidder Competition on eBay", "url": "https://doi.org/10.2139/ssrn.7637918", "authors": "Karan Aggarwal ほか", "venue": "SSRN", "date": "2026-10-21", "why": "出品者の評判と入札競争が低い開始価格の効果をどう調整するかを検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "eBayのオークションで、低い開始価格が高い落札価格につながるか、出品者の評判と入札競争がそれを調整するかを検証した（抄録）。", "p3": "カルティエの時計、Palm Pilot M515、Xboxのオークションを対象に3つの分析を行った（抄録）。", "p5": "開始価格は落札価格と正の関係にあった（β = 0.862〜0.998、p < 0.001）が、カテゴリ内で下位25%や10%の低い開始価格は高い落札価格につながらなかった。出品者の評判（β = 247.69、p = .848）の調整効果は有意でなかった（抄録）。", "fun": "「安く始めれば競り上がって高く売れる」という作戦は、データで見るとうまくいっていませんでした。よく語られる商売のコツを、実際の取引記録で確かめると違う結果が出る点が面白いところです。", "unverified": "入札競争の調整効果のp値は抄録が切れており未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "分布型光ファイバのひずみ面補間でスラブのひび位置特定", "title": "Statistical strain-based surface interpolation method for crack localization in distributed-fiber-optic-monitored concrete slab structures", "url": "https://doi.org/10.1177/14759217261496391", "authors": "Kedi Peng ほか", "venue": "Structural Health Monitoring", "date": "2026-10-20", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr02", "rank": 2, "headline": "LLMペルソナ集団でHEXACO性格構造を再現できるか", "title" tive of stress cognitive appraisal", "url": "https://doi.org/10.1108/jkm-04-2026-0785", "authors": "Xueyan Zhang ほか", "venue": "Journal of Knowledge Management", "date": "2026-10-20", "sjr": 2.382, "citescore": 17.6, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "同僚との相対的な成績差が知識隠しにつながる経路に、妨害的評価と挑戦的評価という逆向きの2つがあることを示した（抄録）。", "p3": "従業員400人のオンライン調査で、確認的因子分析とブートストラップにより直接・媒介・調整媒介効果を検定した。手続き的公正の知覚を調整変数とした（抄録）。", "p5": "成績差は知識隠しと正に関連し、妨害的評価は知識隠しを増やし、挑戦的評価は減らした。手続き的公正は妨害経路を弱め、挑戦経路を強めた（抄録）。", "fun": "できる同僚との差を「脅威」と受け止めると知識を隠し、「成長の機会」と受け止めると隠さなくなります。同じ差でも受け止め方で行動が正反対になり、職場が公正だと感じられるほど良い方向に傾く点が面白いところです。", "unverified": "効果量は抄録になく未確認。横断調査である。"}}, {"id": "jr17", "rank": 17, "headline": "組織変革の特性が変革推進行動と心の健康を左右", "title": "An examination of serial mediators linking change characteristics with employee change championing behaviors and positive mental health", "url": "https://doi.org/10.1111/apps.70151", "authors": "Alannah E. Rafferty ほか", "venue": "Applied Psychology", "date": "2026-10-20", "sjr": 2.354, "citescore": 11.4, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "組織変革の6つの特性が、変革への信念・感情・準備性を順に介して、従業員の変革推進行動と心の健康に結び付くことを示した（抄録）。", "p3": "複数の組織のオーストラリアの従業員397人の3時点調査で、4つの直列媒介のモデルを検証した（抄録）。", "p5": "悪い変革の履歴と変革への参加は、肯定的感情と準備性を通じて推進行動と間接的に関連し、変革的な変化は否定的感情と準備性を通じて関連した。変革の履歴は肯定的感情・準備性・推進行動を通じて心の健康と関連した（抄録）。", "fun": "会社が何かを変えようとするとき、社員が前向きになれるかは「過去の変革がうまくいったか」や「自分が参加できたか」に左右されます。感情という中間地点を通って行動や心の健康に届く、という道筋を分けて描いた点が面白いところです。", "unverified": "各経路の効果量は未確認。"}}, {"id": "jr18", "rank": 18, "headline": "金融業での男性育休が職場規範と結束を変える", "title": "The Paternity Leave Ripple Effect in the Finance Industry: Shaping Norms and Social Cohesion", "url": "https://doi.org/10.1002/hrm.70104", "authors": "Almudena Cañibano ほか", "venue": "Human Resource Management (USA)", "date": "2026-10-20", "sjr": 4.598, "citescore": 15.0, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "男性中心のフランス金融業で、男性の長期育休が職場と家庭の社会的なつながりと結束にどう影響するかを理論化した（抄録）。", "p3": "長期の育休を取った父親と、職場（同僚・人事・経営層）と家庭（パートナー）の関係者への面接による解釈主義的な研究（抄録）。", "p5": "育休は社会的関係やつながり、集団のwell-beingへの関心の変化と結び付けられていた。性別規範を揺るがす変革的な循環と、規範が維持される循環という2つの経路を示し、その分かれ目を制度設計・経営層の関与・組織風土・上司と同僚の支援に求めた（抄録）。", "fun": "父親が育休を取ると、その本人だけでなく周りの同僚の考え方や職場のつながりまで変わることがあります。ただしそれは職場の条件次第で、何も変わらない循環もある、という両面を描いた点が面白いところです。", "unverified": "面接の人数は抄録になく未確認。"}}, {"id": "jr19", "rank": 19, "headline": "日本で初職が非正規だと長期的に出生が減る", "title": "Scarring the Life Course: Early Career Precarity and Long-Term Fertility Outcomes in Japan", "url": "https://doi.org/10.1177/09500170261462746", "authors": "Fumiya Uchikoshi ほか", "venue": "Work, Employment and Society", "date": "2026-10-21", "sjr": 2.204, "citescore": 9.0, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "日本で初職が非正規雇用だと、特に男性で長期的に結婚・出生が減ることを示した（抄録）。", "p3": "1970〜2015年の就職コホートを含む回顧的な職歴データを、多状態生命表モデルで分析した（抄録）。", "p5": "正規雇用に比べ、初職が非正規の男性は45歳までに結婚している確率が約18ポイント、子をもつ確率が約14ポイント低かった。差は景気後退後に就職したコホートで拡大し、結婚の遅れ・断念が男性の出生ペナルティの約3分の1を説明した（抄録）。", "fun": "最初の仕事が非正規かどうかで、40代半ばの家族の姿まで変わる、という長い時間をまたいだ「傷跡」の研究です。仕事の入口のつまずきが人生全体に響くという、日本の雇用の仕組みの重さが見えてくる点が面白いところです。", "unverified": "女性についての結果の詳細は未確認。"}}, {"id": "jr20", "rank": 20, "headline": "都市のデジタル化は企業の従業員福利を高める", "title": "City Digitalization and Employee Welfare: A Stakeholder Empowerment View", "url": "https://doi.org/10.1177/00076503261492087", "authors": "Liwen Wang ほか", "venue": "Business and Society", "date": "2026-10-20", "sjr": 2.832, "citescore": 14.9, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "中国で都市のデジタル化が、その都市の企業の従業員福利支出を増やすことを示した（抄録）。", "p3": "地方政府・市民・地元の労働者を力付けるというステークホルダーのエンパワーメントの視点から仮説を立て、2014〜2019年の中国上場企業のパネルで分析した（抄録）。", "p5": "都市のデジタル化は従業員福利支出に正の影響をもち、法制度の強い地域、世間の注目の高い企業、教育水準の高い従業員をもつ企業で効果が大きかった（抄録）。", "fun": "街がデジタル化すると、情報が行き渡り、市民や働く人の声が届きやすくなります。その結果、会社が社員の福利にお金をかけるようになる、という街と会社のつながりが面白いところです。", "unverified": "効果の大きさは未確認。"}}, {"id": "jr21", "rank": 21, "headline": "非法人地域の山火事対策に土地利用計画を組み込む", "title": "Land Use–Based Wildfire Planning for Unincorporated Communities", "url": "https://doi.org/10.1177/0739456x261494478", "authors": "Tasnim Isaba ほか", "venue": "Journal of Planning Education and Research", "date": "2026-10-20", "sjr": 1.054, "citescore": 7.3, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "米国西部の非法人地域の山火事対策で、土地利用計画の組み込みが植生管理や建築規制に比べて遅れていることを示した（抄録）。", "p3": "11州の郡レベルの地域山火事防護計画60件を内容分析し、重回帰で組み込みの要因を調べた（抄録）。", "p5": "用途地域規制や予防策に大きな欠落があり、州の義務付けと過去の山火事経験は組み込みを進め、人口増加と利害関係者の多様さは土地利用計画の成果に負に働いた（抄録）。", "fun": "山火事の対策というと木を切ったり燃えにくい家を建てたりを思い浮かべますが、そもそも危ない場所に家を建てない計画のほうが根本的です。それが一番遅れているという指摘が面白いところです。", "unverified": "係数の大きさは未確認。"}}, {"id": "jr22", "rank": 22, "headline": "従業員重視の姿勢が顧客の組織同一化を生む", "title": "EXPRESS: From Employee Orientation to Customer Identification: A Three-Level Study of Restaurant Service Encounters", "url": "https://doi.org/10.1177/10963480261500768", "authors": "Jie Cao ほか", "venue": "Journal of Hospitality and Tourism Research", "date": "2026-10-20", "sjr": 1.953, "citescore": 14.3, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "飲食店で、従業員を大切にする組織の価値観が、従業員の同一化と顧客志向を通じて顧客の組織への同一化につながることを示した（抄録）。", "p3": "中国の飲食店44店の従業員866人と顧客2,583人の対応付けたデータを、3水準のマルチレベル構造方程式モデルで分析した（抄録）。", "p5": "従業員志向は従業員の同一化と正に関連し、それが顧客志向と顧客の同一化に関連した。顧客志向は従業員と顧客の同一化の関係を媒介し、組織の公式化は過程全体を強めた（抄録）。", "fun": "社員を大事にする店は、社員が店を好きになり、その気持ちが接客を通じてお客さんにも伝わって、お客さんも店のファンになる、というリレーです。店・社員・客の三段をつないで確かめた点が面白いところです。", "unverified": "効果量は未確認。"}}, {"id": "jr23", "rank": 23, "headline": "救急外来でのサービス相互作用の脆弱性", "title": "The Fragile Encounter: Service Interaction Vulnerability in Emergency Department Care", "url": "https://doi.org/10.1177/10946705261474258", "authors": "Ania Izabela Rynarzewska ほか", "venue": "Journal of Service Research", "date": "2026-10-21", "sjr": 5.517, "citescore": 19.7, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "救急外来で患者と医療者の双方が脆弱になる「サービス相互作用の脆弱性」の理論枠組みを示した（抄録）。", "p3": "病院データの分析とネトノグラフィー（オンライン上の言説の民族誌）を組み合わせた混合研究法（抄録）。", "p5": "患者と医療者の相互作用が脆弱性を悪化させも緩和もし、それがサービスの失敗や成功の可能性を左右することを示した（抄録）。", "fun": "救急外来では、具合の悪い患者だけでなく、疲れ切った医療者も弱い立場にあります。どちらか一方ではなく「両方が弱っている出会い」としてサービスを捉え直した点が面白いところです。", "unverified": "病院データの規模は未確認。"}}, {"id": "jr24", "rank": 24, "headline": "直接購入の経験が越境EC規制への反対を生む", "title": "When Consumers Say no: Direct Purchase Experience and Opposition to Cross‐Border E‐Commerce Regulation in South Korea", "url": "https://doi.org/10.1111/ijcs.70260", "authors": "Byunggeor Moon", "venue": "International Journal of Consumer Studies", "date": "2026-10-21", "sjr": 1.894, "citescore": 15.0, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "韓国の2024年の越境EC規制案に対し、海外直接購入の経験がある消費者ほど反対していたことを示した（抄録）。", "p3": "20〜59歳の成人1,500人の調査を、プロビットモデルと傾向スコアマッチングを主な推定法とし、操作変数で確認した（抄録）。", "p5": "直接購入の経験は規制への反対を約9〜11ポイント高めることと関連し、規制の認知も反対と正に関連した（抄録）。", "fun": "消費者を守るための規制に、当の消費者が反対して数日で撤回された、という珍しい出来事を分析しています。使い慣れた人ほど「余計なお世話」と感じる、という利用経験と規制への態度の関係が面白いところです。", "unverified": "因果関係の主張の強さは未確認。"}}, {"id": "jr25", "rank": 25, "headline": "有給家族休暇の導入で企業の租税回避が減る", "title": "Social Safety Nets and Corporate Tax Avoidance: Evidence From Paid Family Leave Programs", "url": "https://doi.org/10.1111/rego.70218", "authors": "Yifei Chen ほか", "venue": "Regulation and Governance", "date": "2026-10-20", "sjr": 1.536, "citescore": 10.6, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "米国の州ごとの有給家族休暇（PFL）の導入後に、企業の租税回避が減ることを示した（抄録）。", "p3": "州ごとの段階的なPFL導入を準自然実験として使い、構造方程式モデルで媒介経路を調べた（抄録）。", "p5": "PFL導入後に租税回避が統計的・経済的に有意に減少し、効果は従業員の離職減少と生産性向上に媒介され、資金調達の摩擦が大きい企業や労働集約的な企業で強かった（抄録）。", "fun": "社員のための休暇制度が、なぜか会社の税金の払い方まで変えた、という意外なつながりです。社員が辞めにくくなり生産性が上がると、無理な節税に頼らなくてすむ、という説明が面白いところです。", "unverified": "減少の大きさは未確認。"}}, {"id": "jr26", "rank": 26, "headline": "社会面の開示の量・トーン・話題と時価総額", "title": "Disaggregating Social Disclosure: Volume, Sentiment, and Topic‐Specific Tone in Relation to Market Capitalization", "url": "https://doi.org/10.1002/csr.71104", "authors": "Chao Li ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-20", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "日本の上場企業で、社会面の開示を量・全体の感情・話題別のトーンに分解し、時価総額との関係を調べた（抄録）。", "p3": "2017〜2025年の3,455社・27,974企業年について、従業員の健康・顧客価値・人権・人的資本・DE&I・地域共生の6話題の開示を二元固定効果モデルで分析した（抄録）。", "p5": "全体の感情は6つの推定すべてで正に有意だった。話題の分量は従業員の健康・DE&I・地域共生で正、顧客価値で負に有意で、肯定的トーンは従業員の健康とDE&Iで正、顧客価値・人権・人的資本で負に有意だった（抄録）。", "fun": "同じ「良いことを書く」でも、どの話題について前向きに書くかで市場の評価が逆になる、という結果です。開示をひとまとめにせず話題ごとに分けると、投資家の受け止め方の違いが見えてくる点が面白いところです。", "unverified": "否定的トーンの残りの結果は抄録が途中で切れており未確認。"}}, {"id": "jr27", "rank": 27, "headline": "従業員の男女構成は信用格付けのシグナルになる", "title": "Beyond Board Diversity: Workforce Gender Composition as a Signal of Social Sustainability in Corporate Credit Ratings", "url": "https://doi.org/10.1002/csr.71094", "authors": "Catherine Heyjung Sonu", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-20", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "韓国の上場企業で、女性従業員の比率が高い企業ほど社債の信用格付けが良いことを示した（抄録）。", "p3": "2018〜2023年の韓国上場企業の社債1,837件を、シグナリング理論にもとづいて分析した（抄録）。", "p5": "女性従業員の比率が高いほど格付けが有利で、より広い社会的持続可能性の成果がその経路となりうる。情報環境が不透明な企業ほど関連が強かった（抄録）。", "fun": "格付け会社は財務の数字だけでなく、社員の男女構成のような「見える手がかり」からも会社の中身を推し量っているのかもしれません。情報が少ない会社ほどその手がかりが効く、という点が面白いところです。", "unverified": "効果の大きさは未確認。"}}, {"id": "jr28", "rank": 28, "headline": "生成AIを協調学習の司会役にして関与を促す", "title": "Generative AI as a team moderator in CSCL : Facilitating students' multidimensional engagement through adaptive scaffolding for socially shared regulation of learning", "url": "https://doi.org/10.1111/bjet.70096", "authors": "Dengkang Chen ほか", "venue": "British Journal of Educational Technology", "date": "2026-10-20", "sjr": 3.83, "citescore": 23.1, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "協調学習で生成AIを内容の家庭教師ではなく過程の司会役にすると、学生の参加の平等さや認知的・情緒的な関与が高まることを示した（抄録）。", "p3": "中国の大学生64人の16週間の準実験で、生成AIエージェントによる適応的な共有調整の足場かけと、構造化ワークシートによる固定的な足場かけを比べ、調査データと議論の記録を統計とエピステミック・ネットワーク分析で分析した（抄録）。", "p5": "適応条件では参加の平等さが有意に高く（参加の強さは差なし）、より進んだ認知的段階と統合的・解決志向の議論が見られ、全体の情緒的関与も有意に高かった（抄録）。", "fun": "AIを「答えを教える先生」ではなく「話し合いを回す司会者」として使うと、発言の偏りが減ったという結果です。AIの役割を変えるだけで、グループの話し合いの質が変わる点が面白いところです。", "unverified": "準実験で人数が64人と小さい。効果量は未確認。"}}, {"id": "jr29", "rank": 29, "headline": "幼少期の近隣資源が晩年の心の健康に影響", "title": "Early-Life Neighborhood Resources and Later-Life Mental Health", "url": "https://doi.org/10.1021/ehp.6c00793", "authors": "Justin G. Farmer ほか", "venue": "Environmental Health Perspectives", "date": "2026-10-20", "sjr": 2.746, "citescore": 17.7, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "子ども時代に住んでいた地域の歩きやすさや公園へのアクセスが、晩年の心の健康と関連するかを調べた（抄録）。", "p3": "1958〜1972年に乳歯を提供したセントルイスの人々を2020年以降に再接触したデータで、5〜13歳時の住所を1960年国勢調査と歴史的な街路地図に結び付け、歩きやすさと公園アクセスの指標を作り、抑うつ・不安の尺度との関連を一般化推定方程式で推定した（抄録）。", "p5": "抄録が途中で切れており、関連の有無と大きさは未確認。", "fun": "子どもの頃に抜けた乳歯の寄付が、60年後に「育った街と心の健康」を調べる手がかりになりました。古い地図と国勢調査で昔の街並みを再現する、時間をさかのぼる工夫が面白いところです。", "unverified": "結果（関連の方向と大きさ）は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "感謝は社会的支援を通じてwell-beingを高める", "title": "Social support processes link gratitude and well-being across cultures and over time", "url": "https://doi.org/10.1007/s10902-026-01126-z", "authors": "Carley Vornlocher ほか", "venue": "Journal of Happiness Studies", "date": "2026-10-20", "sjr": 1.378, "citescore": 7.1, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "感謝がwell-beingを高める仕組みの一部が、受けている支援への気付き（知覚された社会的支援）と支援の提供にあることを示した（抄録）。", "p3": "2つの研究の14万8千人超のデータで、横断と縦断の両方から社会的支援の媒介を検証した（抄録）。", "p5": "社会的支援の過程、特に知覚された社会的支援が感謝とwell-beingの関連を部分的に媒介した。集団主義的な国ほど感謝と支援提供の関連が弱かった（抄録）。", "fun": "「ありがとう」と感じる人は、周りが自分を支えてくれていることに気付きやすくなり、それが幸福感につながります。ただし助け合いが当たり前の文化では、感謝がさらに助ける行動を増やす効果は弱い、という文化差が面白いところです。", "unverified": "媒介の割合は未確認。"}}, {"id": "jr31", "rank": 31, "headline": "アジア系米国人の祖父母による孫育ての動向", "title": "Trends and patterns of Asian American grandparents living with and raising grandchildren", "url": "https://doi.org/10.1111/josi.70089", "authors": "Hongwei Xu ほか", "venue": "Journal of Social Issues", "date": "2026-10-20", "sjr": 1.309, "citescore": 9.6, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "2000〜2023年のアジア系米国人の6大民族集団で、孫と同居・孫を養育する祖父母の動向を示した（抄録）。", "p3": "国勢調査と米国コミュニティ調査の全国代表データを、多項ロジットと見かけ上無関係な回帰で分析した（抄録）。", "p5": "50歳以上の同居祖父母の割合は約3〜15%、養育する祖父母は約0.5〜3.5%で推移し、インド系・フィリピン系・ベトナム系が日系・ is_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名から、粒子破砕の有無を一つの熱力学的な枠組みで扱う粒状土の構成モデルの研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「砂粒が割れる場合と割れない場合を、エネルギーの出入りという共通の言葉で一つのモデルにまとめられるか」です。", "unverified": "モデルの形と検証結果は未確認。"}}, {"id": "jr37", "rank": 37, "headline": "地すべり情報を事前分布にした地盤定数の広域推定", "title": "Regional-scale geotechnical parameter inference with landslide-informed priors: a dual-constraint weakly supervised deep learning framework", "url": "https://doi.org/10.1016/j.enggeo.2026.109163", "authors": "Qiuyu Ruan ほか", "venue": "Engineering Geology", "date": "2026-10-20", "sjr": 2.913, "citescore": 14.0, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名から、地すべり情報を事前分布に使い、二重の制約をもつ弱教師あり深層学習で地域規模の地盤定数を推定する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「過去にどこで崩れたかという情報から、地面の中の見えない強さを広い範囲で推し量れるか」です。結果から原因をさかのぼる逆向きの推定が面白いところです。", "unverified": "対象地域・手法・精度は未確認。"}}, {"id": "jr38", "rank": 38, "headline": "粒状地すべりが起こす衝撃波の水面応答と波形復元", "title": "Free-surface response and waveform reconstruction of granular landslide-generated impulse waves in the generation zone under mainstream–tributary confluence conditions", "url": "https://doi.org/10.1063/5.0353316", "authors": "Lu Hua ほか", "venue": "Physics of Fluids", "date": "2026-10-20", "citescore": 5.4, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "本流と支流の合流部で粒状の地すべりが起こす衝撃波の、発生域での水面応答を3次元模型実験で明らかにした（抄録）。", "p3": "3次元の物理模型実験に、時間周波数解析・経験式・水面波形のモデル化を組み合わせ、波の型・空間応答・水面の変化を調べた（抄録）。", "p5": "衝撃波は非線形振動波と非線形遷移波が主で、卓越周波数は1〜2 Hz。振幅は地すべりの正面で最大、上流側、下流側の順で、合流角30°では流量比は振幅への影響が小さかった。第1波の振幅と波高の予測式を作った（抄録）。", "fun": "山あいのダム湖に土砂が滑り込むと、津波のような大きな波が起こります。川が合流する場所では流れが波の広がり方を変えるので、どちらの方向に高い波が向かうかを模型で確かめた点が面白いところです。", "unverified": "予測式の精度は未確認。"}}, {"id": "jr39", "rank": 39, "headline": "物理情報RNNで地すべりの時空間確率的早期警報", "title": "Spatiotemporal probabilistic analysis for landslide early warning using physics-informed recurrent neural network model: case study Mt. Umyeon, Korea", "url": "https://doi.org/10.1007/s11069-026-08478-y", "authors": "Ba-Quang-Vinh Nguyen ほか", "venue": "Natural Hazards", "date": "2026-10-20", "citescore": 7.6, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名から、物理情報を組み込んだ再帰型ニューラルネットで地すべりの時空間的な確率的早期警報を行い、韓国・牛眠山（ウミョン山）を事例とした研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「物理の法則と機械学習を組み合わせて、いつどこで崩れそうかを確率で示せるか」です。都市のすぐそばの山を対象にしている点も、問いの切実さを感じさせます。", "unverified": "手法の詳細と警報の精度は未確認。"}}, {"id": "jr40", "rank": 40, "headline": "デジタル化が利益の質を高める条件は監査保証", "title": "DIGITALIZATION, AUDIT ASSURANCE, AND EARNINGS MANAGEMENT: WHEN DOES TECHNOLOGY ENHANCE REPORTING QUALITY?", "url": "https://doi.org/10.62441/actainnovations.vi.2005", "authors": "Sekar Mayangsari ほか", "venue": "Acta Innovations", "date": "2026-10-18", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "インドネシアの上場企業で、デジタル化が進んだ企業ほど利益調整が少なく、監査の規律効果は事業が複雑な企業で弱まることを示した（抄録）。", "p3": "2020〜2024年の非金融137社・685企業年について、年次報告書のNVivoによるテキスト分析でデジタル化を、修正ジョーンズモデルの裁量的発生高の絶対値で利益の質を測り、ランダム効果パネル回帰で分析した（抄録）。", "p5": "デジタル化は利益調整の少なさと関連し、Big4監査も利益調整と負に関連した。事業の複雑さはデジタル化の効果は変えなかったが、監査の効果を弱めた（抄録）。", "fun": "会社の仕組みがデジタル化すると、数字をこっそりいじりにくくなるようです。一方、外部の監査人の目は、会社の組織が複雑になるほど届きにくくなる、という対比が面白いところです。", "unverified": "係数の大きさは未確認。"}}, {"id": "jr41", "rank": 41, "headline": "中小宿泊業の財務困窮予測：Zスコア対機械学習", "title": "Predictive Financial Distress Modelling for Small and Medium Hospitality Enterprises: Comparing Altman Z-Score, Logistic Regression and Ensemble Machine-Learning Classifiers under Seasonal Cash-Flow Constraints", "url": "https://doi.org/10.63468/jpsa.4.3.92", "authors": "Sara Anwar ほか", "venue": "Journal of Political Stability Archive", "date": "2026-10-20", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "季節性の強い中小の飲食・宿泊業で、翌年の財務困窮の予測を、AltmanのZスコア、ロジット、アンサンブル機械学習、深層学習で比較した（抄録）。", "p3": "SEC XBRLから作った米国の小規模な飲食・ホテル13社のパネル（145企業年、困窮54件）で、四半期売上から季節性と谷の四半期の現金余力を作り、企業単位の除外検証と時点外検証で評価した（抄録）。", "p5": "Altman Z″は識別が良い（AUC = 0.845）が慣例の閾値では特異度が低かった（0.56）。4比率のロジット再推定（AUC = 0.901）と木のアンサンブル（勾配ブースティング0.925、ランダムフォレスト0.911）が高次元ロジットを有意に上回った（抄録）。", "fun": "季節によって売上が大きく揺れるお店では、年に一度の決算だけ見ていると危険信号を見落とします。昔ながらのZスコアの材料をそのまま使い、重み付けだけ学び直すと大きく改善する点が面白いところです。", "unverified": "13社という小標本であり、時点外での詳細な結果は抄録が途中で切れており未確認。"}}, {"id": "jr42", "rank": 42, "headline": "財務困窮の継続期間依存と業種差：セルビア", "title": "Duration dependence and sectoral heterogeneity in financial distress: Evidence from Serbian enterprises, 2013-2023", "url": "https://doi.org/10.5937/ekopre2606285j", "authors": "Danko Jevtović ほか", "venue": "Economics of Enterprise", "date": "2026-10-20", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "セルビアの中・大企業で、財務困窮が長引くほど抜け出す確率が下がり、規制業種では困窮が長く続くことを示した（抄録）。", "p3": "2013〜2023年の困窮エピソード609件を離散時間ハザードモデルで分析した（抄録）。", "p5": "困窮から抜け出す推定確率は1年目の37.8%から6年目に10.4%まで下がり、強い負の期間依存があった。困窮期間の中央値は規制業種で4年、市場志向の業種で2年だった（抄録）。", "fun": "経営が苦しい状態は、長引くほど抜け出しにくくなる「沼」のような性質があります。だから立て直しは早いほどよく、規制の多い業種ではとくに沼が深い、という見方が面白いところです。", "unverified": "企業特性の効果の詳細は未確認。"}}, {"id": "jr43", "rank": 43, "headline": "韓国の地方公立病院の財務困窮の予測因子", "title": "Predictors of Financial Distress in Korean Regional Public Hospitals: Focusing on Cash Flow Indicators and Regional Conditions", "url": "https://doi.org/10.12811/kshsm.2026.20.3.001", "authors": "Geun-Chan Lee", "venue": "The Korean Journal of Health Service Management", "date": "2026-10-21", "theme": "会計情報科学", "theme_no": 2, "explain": {"basi  "対象が助産学生に限られる。数値の詳細は未確認。"}}, {"id": "jr46", "rank": 46, "headline": "第一線公務員の職務要求とwell-beingの関係", "title": "Balancing Workplace Demands Against Employee Wellbeing for Street Level Bureaucrats: The Intricate Interrelationships Between Psychological Capital, Burnout, Discretionary Power, Work Harassment and Wellbeing", "url": "https://doi.org/10.1177/07349149261491221", "authors": "Geremy Farr-Wharton ほか", "venue": "Public Administration Quarterly", "date": "2026-10-21", "citescore": 1.8, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "第一線の医療系公務員で、心理的資本とwell-beingの関係を、燃え尽きと組織的な職場ハラスメントが完全に媒介することを示した（抄録）。", "p3": "行動行政学と資源保存理論を統合し、オーストラリアの医療系の第一線公務員259人の4週間間隔の2時点パネルを構造方程式モデルで分析した（抄録）。", "p5": "燃え尽きと組織的な職場ハラスメントが心理的資本とwell-beingの関係を完全に媒介し、well-beingの分散の半分以上を説明した（抄録）。", "fun": "前向きな心の力（心理的資本）がある人でも、燃え尽きやハラスメントを経由しないと幸福感にはつながらない、という結果です。個人の心がけより、職場の負担を減らすことのほうが効く、という示唆が面白いところです。", "unverified": "裁量権の役割の結果の詳細は未確認。"}}, {"id": "jr47", "rank": 47, "headline": "義務的な環境サービスで信頼は部分的にしか回復しない", "title": "PARTIAL TRUST REPAIR IN A MANDATORY GREEN SERVICE: EVIDENCE ON THE SERVICE RECOVERY PARADOX FROM CHINA'S VEHICLE INSPECTION INDUSTRY", "url": "https://doi.org/10.35631/ijirev.826034", "authors": "Wang Xiugen ほか", "venue": "International Journal of Innovation and Industrial Revolution", "date": "2026-10-21", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "中国の車検のような義務的な環境サービスでは、サービス回復で信頼は部分的にしか戻らず、回復の逆説はほとんど起きないことを示した（抄録）。", "p3": "中国の車検の中小企業での事例研究で、苦情87件、顧客10人と従業員5人への面接、3サイクルの内部者アクションリサーチを組み合わせ、完全な40件で探索的回帰を行った（抄録）。", "p5": "想起による失敗前の信頼3.8は失敗後2.1に下がり、回復後3.3に戻った。回復後の満足が失敗前を上回ったのは3件（3.4%）だけで、相互作用的公正が回復後の信頼と最も強く関連した（β = 0.45、p < .001）（抄録）。", "fun": "失敗した店がうまく謝ると、前よりファンになってくれることがある（回復の逆説）と言われます。でも避けられない車検のような義務のサービスでは、そんな逆転はほとんど起きず、丁寧に対応しても「被害を抑える」のがせいぜいだった点が面白いところです。", "unv         card.appendChild(fun);
      }
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // three texts to hand on: a question for an AI, a note for another person, a reproduction request for an AI
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    HANDOFFS.forEach(function (h) {
      var b = el("button", "ask"); b.type = "button";
      h.label.forEach(function (part, i) {
        if (i) b.appendChild(document.createElement("wbr"));
        b.appendChild(document.createTextNode(part));
      });
      b.addEventListener("click", function () { copyText(h.make(it), askStatus, h.done); });
      askrow.appendChild(b);
    });
    card.appendChild(askrow); card.appendChild(askStatus);
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
