は「流れ」として方程式で扱います。この論文は、一つひとつの粒子の動きから平均をとって流れの方程式に至るまでの道のりを、省かずにたどり直しています。ミクロとマクロをつなぐ橋の架け方そのものを丁寧に見せている点が面白いところです。", "unverified": "導いたモデルの数値的な検証と、実在気体モデルの精度は抄録では未確認。"}}, {"id": "pr17", "rank": 17, "headline": "流体と梁の連成モードで微小梁の減衰を縮約する", "title": "Reduced-order modeling of squeeze-film damped electrostatically actuated microbeams using complex modes of the coupled problem", "url": "https://arxiv.org/abs/2611.07205", "authors": "Fehmi Najar", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Najar, F. (2026). Reduced-order modeling of squeeze-film damped electrostatically actuated microbeams using complex modes of the coupled problem (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07205", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "静電気で動かす微小な梁と周りの薄い空気膜の連成問題について、連成系の複素モードを基底にした縮約モデルで、全体を細かく離散化したモデルを1.5%以内の誤差で速く再現した（抄録）。", "p3": "中央面の伸びと静電の非線形を含むオイラー–ベルヌーイ梁と、圧縮性のレイノルズ方程式を微分求積法で離散化し、減衰を含む連成系の複素モードにペトロフ–ガラーキン射影する（抄録）。", "p5": "モードは連成挙動を表す複素共役の対と、流体の緩和を表す実モードに分かれ、流体モードを落とすと構造モードだけでは補えない場合があった。連成モード1組と流体モード1つで全離散化モデルを1.5%以内で再現した（抄録）。", "fun": "電気の力で動かすごく小さな梁がすき間の空気の上で振動すると、空気がクッションになって揺れが弱まります。この論文は、その空気のクッション自体にも独自の動き方（モード）があり、それを省くと計算が合わなくなる場合があることを示しました。振動を正しく縮めて計算するには、相手の流体の動きも主役として数える必要があるという点が面白いところです。", "unverified": "実験・既往の数値結果との比較の具体的な値と、対象とした圧力・寸法の範囲は抄録では未確認。"}}, {"id": "pr18", "rank": 18, "headline": "駆動系を組み込んだUKFで極低速の車速を推定", "title": "A Hybrid UKF with Explicit Drivetrain Modeling for Low-Velocity State Estimation of Electric Vehicles", "url": "https://arxiv.org/abs/2611.08117", "authors": "Hendrik Sch\\\"afke ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Schäfke, H., Weber, D. O. M., Seel, T., Vagapov, A., Iatropoulos, J., Schweers, C., Trabelsi, A., Henze, R., & Ehlers, S. F. G. (2026). A Hybrid UKF with Explicit Drivetrain Modeling for Low-Velocity State Estimation of Electric Vehicles (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08117", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "電気自動車の時速1km未満の極低速で、モーターの回転数を駆動系のねじれを考慮して取り込むカルマンフィルタにより、車速の推定誤差を大きく下げた（抄録）。", "p3": "低速向けの車両モデルに無香料カルマンフィルタ（UKF）を用い、モーター回転数を、ねじればね・ダンパの駆動系を状態に含める物理的な経路と、ニューラルネットの仮想車輪速センサを疑似観測とする経路の2通りで取り込み、量産EV2台の実走行で慣性基準と比べた（抄録）。", "p5": "時速1km未満で、2つの提案法は車両Aで基準の2手法に比べ二乗平均平方根誤差を少なくとも54%と45%下げ、再調整なしで移した車両Bでも少なくとも41%と51%下げた（抄録）。", "fun": "車の速さは普通タイヤの回転を数えて測りますが、歩くよりずっと遅いと回転の刻みが粗すぎて分かりません。そこでこの研究は、細かく回るモーターの回転を使い、モーターとタイヤの間の「ねじれ」をばねとして計算に入れました。調整し直さずに別の車でもそのまま効いたという点が、実用の面でも面白いところです。", "unverified": "停止付近の離散化の比較の詳細と、試験の走行条件は抄録では未確認。"}}, {"id": "pr19", "rank": 19, "headline": "ソフトプロンプトで小型LLM審査員を人の評価に合わせる", "title": "Adapting LLM Judges to Observed Human Annotation Policy through Soft Prompt Tuning", "url": "https://arxiv.org/abs/2611.07126", "authors": "Tam\\'as Janusko ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Janusko, T., Kleinkop, S., Bochnia, R., Hempel, G., Tomschke, S., Anke, J., & Thiele, M. (2026). Adapting LLM Judges to Observed Human Annotation Policy through Soft Prompt Tuning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07126", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "小型のオープンなLLMを評価者（審査員）として使うとき、学習した連続のプロンプト（ソフトプロンプト）を加えると人の注釈との一致が高まることを示した（抄録）。", "p3": "FairBotBenchでソフトプロンプトを学習し、偏り・有害性・個人化の3つの評価次元で、文章のプロンプトと学習した埋め込みを組み合わせた混合型を、調整前の基準と比べた（抄録）。", "p5": "混合型の調整は、調整前に比べて一貫して人の注釈との一致を高めた。Qwen 3.5 9Bでは、調整した審査員が3次元すべてで2つの商用の参照審査員を上回った（抄録）。", "fun": "AIの答えの良し悪しをAIに採点させる方法が広まっていますが、小さなAIは人間の採点と食い違いがちです。この研究は、指示文の前に学習で調整した「見えない合図」を付け足すだけで、小さなAIの採点を人間に近づけられることを示しました。大きなAIに頼らなくても採点の癖を人に合わせ込める点が面白いところです。", "unverified": "一致度の具体的な数値と、ほかの評価データへの汎化は抄録では未確認。"}}, {"id": "pr20", "rank": 20, "headline": "LLM審査員の評価のずれを反復的に再較正する", "title": "PromptOps: Iterative Prompt Optimization for LLM-as-a-Judge Systems", "url": "https://arxiv.org/abs/2611.07123", "authors": "Sven Kleinkop ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Kleinkop, S., Janusko, T., Bochnia, R., Hempel, G., Tomschke, S., Anke, J., & Thiele, M. (2026). PromptOps: Iterative Prompt Optimization for LLM-as-a-Judge Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07123", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "運用中のLLM評価者の採点が人の基準からずれていく「審査員のドリフト」を、監視と反復的なプロンプト最適化で直す枠組みPromptOpsを示した（抄録）。", "p3": "いつ最適化するか、どの手法を使うか、どの記録を使うか、プロンプトをどう更新するかの4つの判断を分け、GEPA、SIMBA、ルーブリック合成、焼きなまし法とTPEによる例示選択の5手法で実装した（抄録）。", "p5": "参照の得点分布を制御してずらした実験で、反復的な最適化により審査員を再較正し性能を回復できた。一方、最適化の手法や更新の時期の最善は設定ごとに異なり、普遍的な選び方はなかった（抄録）。", "fun": "AIに採点係をさせると、最初は人の採点とよく合っていても、扱う答えの傾向が変わるとだんだんずれていきます。この研究は、採点係への指示文を定期的に見直す「保守点検」の仕組みを作りました。どの直し方が一番よいかは場面ごとに違い、点検を続けること自体が大事だという結論が現場らしくて面白いところです。", "unverified": "回復の程度の数値と、使った評価データの詳細は抄録では未確認。"}}, {"id": "pr21", "rank": 21, "headline": "署名つきの要件の受け渡しでエージェント間の改変を防ぐ", "title": "Signed but Not Safe: Requirement Integrity in Multi-Agent LLM Handoffs", "url": "https://arxiv.org/abs/2611.07483", "authors": "Xiaobo Chen ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Chen, X., Zhu, G., Wang, Z., & Wang, C. (2026). Signed but Not Safe: Requirement Integrity in Multi-Agent LLM Handoffs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07483", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "AIエージェントの間で依頼の要件を受け渡すとき、要件を逐語の引用と検査できる条件に分けて署名した「要件マニフェスト」を使うと、攻撃下で安全でない確定が大きく減ることを、事前登録の研究で示した（抄録）。", "p3": "正確に採点できる合成課題で、自由文・構造化JSON・署名つきマニフェストの受け渡しを比べ、統合役の判断を決定的なコードで検証した。Qwen3-8Bで1,440の軌跡と5種の脅威を試した（抄録）。", "p5": "攻撃下の安全でない確定は69.4%から9.0%に減った（95%信頼区間[51.4, 69.4]の差）。ただし署名前の抽出への注入では違反が14.6%から37.5%に増え、署名は壊れた要件まで認証した（抄録）。", "fun": "伝言ゲームでは、途中の人が内容を縮めたり変えたりすると、最後に届く話が変わってしまいます。この研究はAI同士の伝言に「封印つきの要件リスト」を使い、途中の改ざんをほぼ防げることを示しました。ただし封をする前に紛れ込んだ嘘は、封印がかえって本物らしく見せてしまうという落とし穴を突き止めた点が面白いところです。", "unverified": "課題の具体的な内容と、ほかのモデルでの主効果の大きさは抄録では未確認。"}}, {"id": "pr22", "rank": 22, "headline": "長い役割演技の対話でペルソナの一貫性を保つ", "title": "Recursive Self-Improvement for Long-Horizon Role-Playing Dialogue", "url": "https://arxiv.org/abs/2611.07469", "authors": "Y. L. Li ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Li, Y. L., & Wu, Y. H. (2026). Recursive Self-Improvement for Long-Horizon Role-Playing Dialogue (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07469", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "長い役割演技の対話で、キャラクターの記憶・ペルソナの指示・各ターンのプロンプトの作り方を上限つきで自己改善させる枠組みを示し、不適切な応答を大きく減らした（抄録）。", "p3": "更新役を、入力・編集できる項目・受け入れの関門・停止条件を明示した版管理つきの方針として定め、修復の結果から診断規則なども改める。50のキャラクター×5モデルで100往復の会話を2本ずつ評価した（抄録）。", "p5": "不適切な応答の率は14.00%から4.94%に下がった（相対で64.71%減）。盲検の人による比較600件では294勝・187分け・119敗で、引き分けを除く勝率は71.19%だった（抄録）。", "fun": "AIに登場人物を演じさせると、話が長くなるにつれて性格や記憶がぶれていきます。この研究は、AIが自分の演技の失敗を見つけ、人物の設定メモや指示の書き方を少しずつ直していく仕組みを作りました。直し方のルール自体も改善の対象にしつつ、暴走しないよう止まる条件を決めてある点が面白いところです。", "unverified": "評価は内部のテスト分布に限られ、外部の評価データでの効果は抄録では未確認。"}}, {"id": "pr23", "rank": 23, "headline": "生成AIの費用を取引単位で配賦する二台帳モデル", "title": "The Two-Ledger Model: Transaction-Grain Cost Accounting for Multi-Agent AI Systems Across Clouds, Models, and Systems of Record", "url": "https://arxiv.org/abs/2611.06989", "authors": "Vivek Acharya", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Acharya, V. (2026). The Two-Ledger Model: Transaction-Grain Cost Accounting for Multi-Agent AI Systems Across Clouds, Models, and Systems of Record (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06989", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "複数のAIエージェントを使う業務で、AIの費用を注文・請求・案件といった取引の単位で把握するための二台帳モデルを提案した（抄録）。", "p3": "請求データの決済台帳と、OpenTelemetryの記録による呼び出し単位の帰属台帳を結び、トレース情報・エージェント間のメタデータ・業務キー・確率的な照合を重ねて各記録を取引に割り当て、期ごとに請求書と照合する（抄録）。", "p5": "正解の分かるシミュレーションで、トレースの伝播がなくなっても費用の捕捉率は99%を超え、計量されない支出を0.24ポイント以内で復元し、実行中の制御で上位1%の取引費用を最大61%下げた（抄録）。", "fun": "会社でAIを使うと、請求書には「今月AIにいくら払ったか」しか書かれず、どの仕事にいくらかかったかは分かりません。この研究は、AIの利用記録と請求書という2冊の帳簿を突き合わせて、仕事一件ごとの原価を出す方法を考えました。昔からある原価計算の考え方をAIの時代の新しい費用に当てはめた点が面白いところです。", "unverified": "実際の企業データでの検証は抄録では未確認（評価はシミュレーション）。"}}, {"id": "pr24", "rank": 24, "headline": "15年以上続ける無償の地域保健員の動機と困難", "title": "Lived experiences of long-serving (&gt;15 years) community health workers in South Western Uganda: a phenomenological study", "url": "https://doi.org/10.21203/rs.3.rs-11638367/v1", "authors": "Edison Byamugisha ほか", "venue": "Research Square (In Review)", "date": "2026-11-06", "apa": "Byamugisha, E., Kanyesigye, H., Kyomuhangi, T., Brenner, J., & Kabakyenga, J. (2026). Lived experiences of long-serving (&gt;15 years) community health workers in South Western Uganda: a phenomenological study. https://doi.org/10.21203/rs.3.rs-11638367/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ウガンダ南西部で15年以上、主に無償で活動を続ける地域保健員の動機・困難・対処を明らかにし、継続を支えるのは保健制度の支援より内発的・社会的な報酬と自前の対処だと示した（抄録）。", "p3": "2004〜2008年に選ばれ訓練を受けた地域保健員36人と教区の調整役18人に深層面接を行い、社会生態学的な枠組みの4つの水準で主題分析した（抄録）。", "p5": "動機は職業的な成長、地域の尊敬と信頼、仲間との友情、ささやかな誘因だった。困難は再研修の不足、高齢化による健康と安全の危険、家族・農業との両立、移動手段や資金の不足で、信仰や貯蓄グループ、家族の支えで対処していた（抄録）。", "fun": "アフリカの村々では、給料をほとんどもらわずに近所の人の健康を見守る地域保健員が医療を支えています。この研究は15年以上続けている人たちに理由を尋ね、尊敬や仲間、自分の成長が支えになる一方、交通費や道具は自分で工面していることを描きました。善意が長続きする理由と、その危うさが同時に見える点が面白いところです。", "unverified": "活動をやめた人との比較はなく、要因の効果の大きさは抄録では未確認。"}}, {"id": "pr25", "rank": 25, "headline": "ホームレス支援のボランティアが見る心の健康とケア", "title": "Volunteers’ Perspectives on Mental Health and Care Coordination for People Experiencing Homelessness: A Qualitative Focus Group Study", "url": "https://doi.org/10.20944/preprints202611.0365.v1", "authors": "Bárbara Santamarta-Fernández ほか", "venue": "Preprints.org", "date": "2026-11-06", "apa": "Santamarta-Fernández, B., Andina-Díaz, E., Vázquez-García, E., & Fernández-Martínez, E. (2026). Volunteers’ Perspectives on Mental Health and Care Coordination for People Experiencing Homelessness: A Qualitative Focus Group Study. https://doi.org/10.20944/preprints202611.0365.v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "スペイン・レオンでホームレスの人を支えるボランティアの視点から、心の健康の困りごと、医療・福祉への壁、ボランティアの役割の境界のあいまいさを明らかにした（抄録）。", "p3": "人道系NGOのボランティア9人による2回の半構造化フォーカスグループを逐語録にし、一般的な帰納的アプローチで分析した（抄録）。", "p5": "2つの主題と7つの下位主題が得られた。心の不調の悪化、偏見、断片的なサービス、退院後の支援の乏しさ、女性のホームレスの見えにくさが語られ、寄り添いは評価される一方、役割の境界、研修の不足、専門職の支援の少なさが課題とされた（抄録）。", "fun": "路上で暮らす人を支えるボランティアは、医療や福祉の窓口と本人の間をつなぐ大事な役目を担っています。この研究で彼らは、やりがいと同時に「どこまでが自分の役目か分からない」という迷いを語りました。研修を求めながら実際には参加しにくいという矛盾も浮かび、善意を支える仕組みの必要性が見える点が興味深いところです。", "unverified": "生活の質や燃え尽き、サービスの効果は測定していないと著者が記載（抄録）。参加者は9人に限られる。"}}, {"id": "pr26", "rank": 26, "headline": "高齢移民と福祉制度を結ぶ相談事業の歴史", "title": "NISBO Elderly Advisory Services as a Bridge between Older Migrants and Welfare Institutions: Historical Lessons from the Dutch Experience", "url": "https://doi.org/10.31235/osf.io/eyx4p", "authors": "Cemal YILMAZ", "venue": "SocArXiv", "date": "2026-11-06", "apa": "YILMAZ, C. (2026). NISBO Elderly Advisory Services as a Bridge between Older Migrants and Welfare Institutions: Historical Lessons from the Dutch Experience. https://doi.org/10.31235/osf.io/eyx4p", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "オランダで移民の高齢者のための相談事業（NISBOとその前身TISBO）の歴史を文書から再構成し、移民と福祉制度をつなぐ「制度の橋」の5つの機能を整理した（抄録）。", "p3": "1990年代半ばのTISBOの事業文書、1996年のNISBOの計画文、1999年と2001年のNISBOの報告書を、政府の記録と文献で補い、質的な歴史的事例研究として分析した（抄録）。", "p5": "相談事業は1994年に始まり1997年までに移行し、1998年1〜5月に収入・住宅・医療・福祉の697件の相談があった。情報への到達、伝達と仲介、信頼と個別支援、制度間の調整、代表と組織学習の5機能を示した（抄録）。", "fun": "外国から移り住んで年を重ねた人は、言葉や制度の違いから、年金や住まいの相談先にたどり着けないことがあります。この研究は、移民自身が作った相談窓口が本人と役所の間の「橋」として何をしていたかを、古い記録から読み解きました。橋の働きを5つに分けて示した点が、ほかの地域でも使える見取り図として面白いところです。", "unverified": "相談の結果や長期的な効果は資料から確かめられないと著者が記載（抄録）。"}}, {"id": "pr27", "rank": 27, "headline": "22か国9.8万人で現在と将来の幸福の規定要因を比較", "title": "Current and Expected Well-Being in a Global Sample: The Role of Past Experiences, Current Circumstances, and Identity and Personality", "url": "https://doi.org/10.31234/osf.io/cd2hn", "authors": "Anaelle Gackiere ほか", "venue": "PsyArXiv", "date": "2026-11-06", "apa": "Gackiere, A., Garrison, S. M., & Waugh, C. (2026). Current and Expected Well-Being in a Global Sample: The Role of Past Experiences, Current Circumstances, and Identity and Personality. https://doi.org/10.31234/osf.io/cd2hn", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "22か国約9.8万人の調査から、人が現在の幸福と5年後に予想する幸福を判断するとき、ほぼ同じ情報を異なる重みで使っていることを示した（抄録）。", "p3": "Global Flourishing Studyの第1波（N=98,412、22か国）で、過去の経験・現在の状況・アイデンティティと性格にわたる予測因子を、ベイズ的な変数選択で結果ごとに選んだ（抄録）。", "p5": "人は概して将来の幸福が現在を上回ると予想した。互いを調整すると、高齢ほど予想する幸福は低く、希望が強いほど高かった。過去の経験は現在の状況などを考慮すると独自の説明力をほとんど持たなかった（抄録）。", "fun": "「いま幸せか」と「5年後は幸せだと思うか」は似た質問ですが、答え方の中身は少し違うようです。世界22か国の約10万人のデータから、将来の見通しには年齢と希望の強さが反対向きに効き、過去の出来事は今の暮らしを通じてしか効いていないことが分かりました。幸福の見積もり方の癖が見える点が面白いところです。", "unverified": "各予測因子の効果の大きさと国ごとの違いは抄録では未確認。"}}, {"id": "pr28", "rank": 28, "headline": "高齢者の陰謀論的思考は孤独の結果ではなかった", "title": "Conspiratorial mentality among older people: The role of loneliness, depression, anxiety, and social media use", "url": "https://doi.org/10.31234/osf.io/27u8t", "authors": "Michal Mužík ほか", "venue": "PsyArXiv", "date": "2026-11-06", "apa": "Mužík, M., & Serek, J. (2026). Conspiratorial mentality among older people: The role of loneliness, depression, anxiety, and social media use. https://doi.org/10.31234/osf.io/27u8t", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "チェコの60歳以上の縦断調査で、孤独・抑うつ・不安は陰謀論的な考え方を予測せず、逆に陰謀論的な考え方が不安を高めることを示した（抄録）。", "p3": "60歳以上のチェコの成人の2時点の縦断データ（第1波4,133人、平均69.1歳）で、孤独・不安・抑うつと陰謀論的メンタリティの双方向の関係を線形・二次で検証し、SNS利用の調整効果も調べた（抄録）。", "p5": "陰謀論的メンタリティはほかの変数から予測されず、それ自体は不安だけを正に予測した。SNS利用の調整効果と二次の効果は支持されなかった（抄録）。", "fun": "「孤独な高齢者ほど陰謀論を信じやすい」と考えたくなりますが、この研究のデータはそれを支持しませんでした。むしろ陰謀論的な考え方を持つことが、のちの不安を強めていたのです。原因と結果の向きを2時点の調査で確かめると、思い込みとは逆の流れが見えてくるという点が面白いところです。", "unverified": "効果の大きさと2時点の間隔は抄録では未確認。"}}, {"id": "pr29", "rank": 29, "headline": "罰金による規制で自動運転配車の高値と地域格差を抑える", "title": "Regulating Autonomous Mobility-on-Demand Operators with Fixed and Adaptive Penalties: A Multi-Agent Reinforcement Learning Approach", "url": "https://arxiv.org/abs/2611.07122", "authors": "Korbinian K\\\"ugler ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Kügler, K., Schmidt, C., Dandl, F., & Rodrigues, F. (2026). Regulating Autonomous Mobility-on-Demand Operators with Fixed and Adaptive Penalties: A Multi-Agent Reinforcement Learning Approach (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07122", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "利益を追う自動運転の配車事業者に、罰金による規制を外側の制御として学習させ、過大な価格と地域のサービス不足を抑える方法を示した（抄録）。", "p3": "価格設定と車両の再配置を同時に行う事業者を、固定罰金ではマルコフ決定過程、地域別の罰金を定期的に調整する動的な規制では部分観測確率ゲームとして定式化し、グラフ型の多エージェント強化学習で学習した。マンハッタンの実データで実験した（抄録）。", "p5": "固定の割増料金への罰金で、過大な価格に直面する利用者は22%から1%に減った。動的な規制は同じ平均強度の固定罰金より規制者の報酬を最大15.6%改善したが、車両が逼迫するピーク時には不足が残った（抄録）。", "fun": "自動運転タクシーの会社がもうけを優先すると、混む時間に料金をつり上げたり、もうからない地域から車を引き上げたりしかねません。この研究は、規制する側もAIにして罰金の強さを地域ごとに調整させました。車が足りず守りようがない場所では罰金を下げることを、規制側のAIが自ら学んだ点が面白いところです。", "unverified": "事業者の利益と利用者の効用のトレードオフの具体的な値は抄録では未確認。"}}, {"id": "pr30", "rank": 30, "headline": "スマートシティの失敗を統治と公平性から整理", "title": "When Smart Cities Fail: Global Patterns of Digital Governance Breakdown, Algorithmic Opacity, and Equity Deficits in Urban Technology Deployment", "url": "https://doi.org/10.20944/preprints202611.0408.v1", "authors": "Mahlatse Given Sevhake ほか", "venue": "Preprints.org", "date": "2026-11-06", "apa": "Sevhake, M. G., & Hofisi, C. (2026). When Smart Cities Fail: Global Patterns of Digital Governance Breakdown, Algorithmic Opacity, and Equity Deficits in Urban Technology Deployment. https://doi.org/10.20944/preprints202611.0408.v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "スマートシティの技術導入で起きる統治の失敗を、アルゴリズムの不透明さ・説明責任の空白・社会空間的な不平等の重なりとして定義し、76文献から整理した（抄録）。", "p3": "2008〜2026年の査読付き・基礎的な文献76件を、都市研究・行政学・批判的データ研究にまたがって統合的に体系レビューし、アフリカなどグローバル・サウスの都市を意図して含めた（抄録）。", "p5": "不透明なアルゴリズムは正統性を損ない、官民連携は説明責任を薄め、デジタル基盤は既存の不平等を再生産し、害はもともと支援の乏しい地域に集中していた。予見的な統治、アルゴリズムの監査、公平性を組み込んだ設計の研究課題を提案した（抄録）。", "fun": "センサやAIで街を便利にする「スマートシティ」は、良い面ばかりが語られがちです。この論文は逆に「失敗」を研究の対象に据え、仕組みの見えないアルゴリズムや責任の所在のあいまいさが、もともと困っている地域にしわ寄せを生む様子を整理しました。成功例ではなく失敗例から学ぶ発想が面白いところです。", "unverified": "個々の事例の詳細と失敗の頻度は抄録では未確認。"}}, {"id": "pr31", "rank": 31, "headline": "地形の差分から土石流の摩擦と取り込みの係数を較正", "title": "Geomorphic calibration of friction and entrainment parameters for a snowmelt-induced muddy debris flow in the Longiarù Valley, Dolomites", "url": "https://doi.org/10.21203/rs.3.rs-11390146/v1", "authors": "Litan Dey ほか", "venue": "Research Square (In Review)", "date": "2026-11-06", "apa": "Dey, L., Comiti, F., Mergili, M., Macconi, P., Cavalli, M., Crema, S., Dallan, E., Mair, V., Patscheider, L., & Borga, M. (2026). Geomorphic calibration of friction and entrainment parameters for a snowmelt-induced muddy debris flow in the Longiarù Valley, Dolomites. https://doi.org/10.21203/rs.3.rs-11390146/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "雪どけで起きた泥流型の土石流について、事前・事後の地形の差分から、数値シミュレーションの摩擦と土砂の取り込みの係数を較正した（抄録）。", "p3": "イタリア・ドロミテのセレス川流域で2024年6月17〜18日に起きた事象を対象に、2010年の事前DEMと2024年のLiDARによる事後DEMの差分で侵食と堆積の分布を求め、r.avaflowの反復計算で摩擦と取り込みの係数を絞り込んだ（抄録）。", "p5": "較正した組み合わせは内部摩擦角17°、底面摩擦角9°、乱流摩擦パラメータ10 m/s²などで、上流の侵食から下流の堆積への遷移を再現した。乱流摩擦は到達距離などに、取り込みは運動量と堆積の位置に強く効いた（抄録）。", "fun": "土石流の計算には「どれくらい滑りやすいか」「川底の土をどれくらい巻き込むか」という係数が必要ですが、災害ごとに測るのは困難です。この研究は、災害の前後の地形の差から削られた所と積もった所を地図にし、それを再現できる係数を逆算しました。到達距離だけでなく地形の変化全体を手がかりにした点が面白いところです。", "unverified": "取り込み係数の値は抄録の記載が欠けており未確認。"}}, {"id": "pr32", "rank": 32, "headline": "低精度の解で縮約モデルの基底を安く作る", "title": "Efficient Projection-Based Reduced-Order Modeling for Computational Fluid Dynamics via Multifidelity Basis Construction", "url": "https://arxiv.org/abs/2611.07231", "authors": "Ashok Viswanathan ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Viswanathan, A., & Farhat, C. (2026). Efficient Projection-Based Reduced-Order Modeling for Computational Fluid Dynamics via Multifidelity Basis Construction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07231", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "計算の安い低精度の解で、射影型の縮約モデル（PROM）の基底を補い、学習用のスナップショットを作る費用を下げる方法を示した（抄録）。", "p3": "パラメータをそろえた高精度と低精度の解から補正基底を作り、新しいパラメータでは低精度の予測を高精度の残差の最小化で補正して、受け入れた解で基底を更新する。翼型NACA0012の定常流で、細かい格子のRANSと粗い格子のオイラー方程式を組み合わせた（抄録）。", "p5": "高精度4個と低精度由来36個の解で生成費用は7.8分の1になり、基底次元40での揚力・抗力・揚抗比の平均誤差は1.1%、3.6%、3.9%（高精度のみでは0.18%、2.9%、2.8%）だった（抄録）。", "fun": "精密なシミュレーションは時間がかかるので、代表的な結果から作った「縮めた模型」で計算を速める方法があります。ただ、その模型を作るのにも精密な計算がたくさん要ります。この研究は、粗い計算の結果を少数の精密な結果で補正して材料にし、準備の手間を約8分の1にしました。安い情報で高い情報を補う発想が面白いところです。", "unverified": "非定常流れやほかの形状での性能は抄録では未確認。"}}, {"id": "pr33", "rank": 33, "headline": "多孔質の非線形な非定常流れを表す新しいモデル式", "title": "A model equation for nonlinear unsteady flow through porous media", "url": "https://doi.org/10.21203/rs.3.rs-11442655/v1", "authors": "Lukas Unglehrt ほか", "venue": "Research Square (In Review)", "date": "2026-11-06", "apa": "Unglehrt, L., Sakai, Y., & Manhart, M. (2026). A model equation for nonlinear unsteady flow through porous media. https://doi.org/10.21203/rs.3.rs-11442655/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "多孔質の中の非線形な非定常流れについて、抵抗（抗力）を4つの成分に分けた新しいモデル式を提案し、中間の周波数での非線形な流れの予測を既存モデルより改善した（抄録）。", "p3": "体積平均の運動量式で、抗力を加速による圧力抗力（屈曲度と圧力勾配で表す）、粘性による圧力抗力、対流による圧力抗力（フォルヒハイマー型）、摩擦抗力に分け、粘性と摩擦の項を等価流体モデルと境界層のスケーリングを混ぜた履歴項で表した（抄録）。", "p5": "六方充填した球の層を通る振動流の直接数値計算と比べ、線形の流れを正確に表し、中間周波数の非線形流れの予測を大きく改善した。誤差は高周波の非線形流ほど大きくなった（抄録）。", "fun": "砂や小石のすき間を水が行ったり来たりするとき、水が受ける抵抗は流れの速さや揺れの速さで複雑に変わります。この研究は、その抵抗を4種類に分け、それぞれに合った式を当てはめました。分けて考えることで、難しかった中くらいの速さの揺れの予測が良くなった点が面白いところです。", "unverified": "誤差の具体的な数値と、球以外の多孔質への適用は抄録では未確認。"}}, {"id": "pr34", "rank": 34, "headline": "衛星レーダーでの見え方の変化から構造物の状態を追う", "title": "Observability Core Vector Trajectories for Structural Health Monitoring: From Stable States to Structural Change", "url": "https://doi.org/10.21203/rs.3.rs-11612080/v1", "authors": "Martin Hoffmann", "venue": "Research Square (In Review)", "date": "2026-11-06", "apa": "Hoffmann, M. (2026). Observability Core Vector Trajectories for Structural Health Monitoring: From Stable States to Structural Change. https://doi.org/10.21203/rs.3.rs-11612080/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "衛星レーダー（Sentinel-1）での構造物の見え方を6つの記述量で表した観測可能性コアベクトル（OCV）の時間変化を追い、構造物の監視を補う情報になるかを調べた（抄録）。", "p3": "取得間のエコーの一貫性とエコーのマスクの形状に関する6つの記述量によるOCVの軌跡を、安定運用、状態遷移、再建、補修、大きな構成変更、記録された破壊の各事例で調べた（抄録）。", "p5": "過程によってOCVの変化ははっきり出る場合も弱い場合も出ない場合もあり、共通の健全度の方向はなかった。移転できる寿命の軌跡や普遍的な破壊の兆候は支持されず、構造的な解釈には独立の計測か検証済みの物理モデルが必要とした（抄録）。", "fun": "人工衛星のレーダーは、雲があっても地上の建物や橋を定期的に見ることができます。この研究は、構造物が補修されたり壊れたりしたとき、レーダーでの見え方がどう変わるかを追いかけました。どの壊れ方にも共通する「危険のサイン」は見つからなかったと率直に報告している点が、かえって信頼できて面白いところです。", "unverified": "対象とした構造物の数と種類は抄録では未確認。"}}, {"id": "pr35", "rank": 35, "headline": "経年下での導波SHMの検出確率を評価する枠組み", "title": "Towards MAPoD and MAPoL Assessment of Guided-Wave SHM Systems under Aging Conditions: Application to a Composite Cryogenic Tank for Reusable Launch Vehicles", "url": "https://doi.org/10.58286/34024", "authors": "Lina El Guerjouma ほか", "venue": "HAL", "date": "2026-11-05", "apa": ", El Guerjouma, L., Eiras, J. N., Mechbal, N., Irisarri, F.-X., Gavérina, L., García-martínez, A., & Hascoët, N. (2026). Towards MAPoD and MAPoL Assessment of Guided-Wave SHM Systems under Aging Conditions: Application to a Composite Cryogenic Tank for Reusable Launch Vehicles. E-Journal of Nondestructive Testing, 31(8). https://doi.org/10.58286/34024", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "HALに登録された会議論文の抄録を使用", "preprint": true, "short": true, "p1": "再使用ロケットの複合材の極低温タンクを例に、超音波の導波を使う構造ヘルスモニタリング（SHM）のシステム自体が経年劣化すると、はく離の検出と位置特定の性能が大きく落ちることを有限要素モデルで示した（抄録）。", "p3": "長さ約1.2m・直径24cmのタンクと圧電素子を等価単層のシェル要素でモデル化し、レーザードップラー振動計による実物大の測定と比べたうえで、損傷指標とRAPID・DASの位置特定法をSHMの劣化状態ごとに試した（抄録）。", "p5": "SHMシステムの経年劣化が損傷の検出と位置特定の性能を大きく損なうことを示した（抄録）。劣化の程度ごとの検出確率の数値は抄録に記載がない。", "fun": "ロケットを再利用するには、飛ぶ前に傷がないかを確かめる必要があり、センサを貼り付けて常に見張る方法が考えられています。ところが、そのセンサ自体も厳しい温度や力で年を取ります。この研究は「見張り役の老化」で傷の見逃しが増えることを計算で示しました。点検する側の健康も点検が必要だという視点が面白いところです。", "unverified": "劣化の程度ごとの検出確率と位置特定の確率の数値は抄録では未確認。"}}, {"id": "pr36", "rank": 36, "headline": "構造試験では同定できないパラメータの組を示す", "title": "What a structural test cannot identify: degeneracy-aware Bayesian calibration of a multiscale material mode", "url": "https://doi.org/10.5281/zenodo.23990483", "authors": "ROMERO SUAREZ ほか", "venue": "Zenodo", "date": "2026-11-05", "apa": "ROMERO SUAREZ, G. E. R. M. A. N. O. R. L. A. N. D. O., VILLEGAS, D. I. E. G. O., & Pinto Hernández, W. (2026). What a structural test cannot identify: degeneracy-aware Bayesian calibration of a multiscale material mode. Zenodo. https://doi.org/10.5281/ZENODO.23990483", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された文書の抄録を使用（審査のない置き場）", "preprint": true, "short": true, "p1": "構造試験で多尺度の材料モデルを較正するとき、原理的に同定できないパラメータの組があることを命題として示し、ナノインデンテーションを組み合わせると同定できることを示した（抄録）。", "p3": "剛性が構成テンソルに線形で荷重がそうでない条件では、試験は1つの組み合わせしか同定できないことを示し、フィッシャー情報の零方向と25の初期値からの最適化で確かめた。圧縮試験とナノインデンテーションの情報行列を組み合わせた（抄録）。", "p5": "零方向は(0.7071, −0.7071)と復元され、2つの試験を合わせると情報行列はランク2（条件数196）になった。同定可能性に基づく座標の回転で、事後相関は0.98から0.13に下がった（抄録）。", "fun": "2つの量の積しか測れない実験では、片方を2倍、もう片方を半分にしても結果は同じなので、どれだけデータを集めても別々の値は決まりません。この研究は、材料の試験でもそうした「原理的に見分けられない組」が生じることを示し、別の種類の試験を組み合わせて解決しました。見分けられない方向を、計算を楽にする座標の取り方に生かした点が面白いところです。", "unverified": "審査のない置き場の文書で、対象の材料と試験の詳細は抄録では未確認。"}}, {"id": "pr37", "rank": 37, "headline": "分数階PINNでSNS投稿の拡散の記憶効果を学習", "title": "Fractional physics-informed neural networks to model social media virality", "url": "https://arxiv.org/abs/2611.07215", "authors": "Alex Koong ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Koong, A., & Karniadakis, G. E. (2026). Fractional physics-informed neural networks to model social media virality (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07215", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "SNS投稿への反応の増え方を、過去の影響の記憶を持つ分数階の微分方程式としてニューラルネットで学習し、記号回帰で解釈できる式に直す枠組みを示した（抄録）。", "p3": "分数階の物理情報ニューラルネット（PINN）で記憶と非線形の増加の法則を同時に学習し、観測ノイズには分数階の作用素を通してノイズを伝える白色化した残差で対処した。X（旧Twitter）の348投稿に適用した（抄録）。", "p5": "24時間を4区間に分けたモデルで、区間ごとの分数階の次数は0.23から0.99に増え、保留した軌跡の64%を平均二乗誤差0.01以内で再構成した（9つの古典的な基準で最良のものは44%）（抄録）。", "fun": "SNSの投稿が広がるとき、反応の増え方は過去にどれだけ反応があったかに引きずられます。この研究は、その引きずられ方の強さを示す数を学習で求め、投稿の直後と時間がたった後で記憶の効き方が大きく変わることを見つけました。拡散の勢いを、意味の読み取れる式の形で取り出した点が面白いところです。", "unverified": "投稿の選び方と分野の偏り、ほかのSNSへの一般化は抄録では未確認。"}}, {"id": "pr38", "rank": 38, "headline": "超複素数の表現で情報カスケードの拡散を予測", "title": "CasHyper: Modeling Multi-Factor Interactions and Asymmetric Influence in Cascade Prediction via Hypercomplex Algebra", "url": "https://arxiv.org/abs/2611.07585", "authors": "Yansong Wang ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Wang, Y., Chai, Q., Huang, J., & Jia, T. (2026). CasHyper: Modeling Multi-Factor Interactions and Asymmetric Influence in Cascade Prediction via Hypercomplex Algebra (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07585", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "情報の拡散（カスケード）に次に誰が参加するかを、利用者と拡散の埋め込みを超複素数で表して利用者間の非対称な影響を学習し、予測する枠組みCasHyperを提案した（抄録）。", "p3": "埋め込みを複数の超複素数の成分に分けて別々の潜在要因を表し、非可換な積で順序に依存する相互作用を表す。静的な異種グラフ、ニューラルODEによる動的な経路、超複素数のTransformerを組み合わせた（抄録）。", "p5": "4つの実データで比較手法と同等以上の性能を示し、Hits@50でAndroidのデータで最大43.24%、Christianityのデータで18.43%の相対改善を得た（抄録）。", "fun": "うわさや投稿が人から人へ広がるとき、「AさんがBさんに与える影響」と「BさんがAさんに与える影響」は同じとは限りません。この研究は、掛ける順番で答えが変わる「超複素数」という数を使って、この向きのある影響を表しました。高校で習う複素数をさらに広げた数学がSNSの分析に役立つ点が面白いところです。", "unverified": "データセットの規模と、比較手法との差の統計的な確かさは抄録では未確認。"}}, {"id": "pr39", "rank": 39, "headline": "LLM審査員は再現性が高くても妥当とは限らない", "title": "Reliability without Validity: A Systematic, Large-Scale Evaluation of LLM-as-a-Judge Models Across Agreement, Consistency, and Bias", "url": "https://doi.org/10.5281/zenodo.23988546", "authors": "Norman ほか", "venue": "Zenodo", "date": "2026-11-05", "apa": "Norman, J., Rivera, M., & Hughes, A. (2026). Reliability without Validity: A Systematic, Large-Scale Evaluation of LLM-as-a-Judge Models Across Agreement, Consistency, and Bias. Zenodo. https://doi.org/10.5281/ZENODO.23988546", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された文書の抄録を使用（審査のない置き場）", "preprint": true, "short": true, "p1": "21のLLM評価者を約54万件の判定で比べ、一致率が高くても偶然を補正すると識別力は大きく下がり、再現性が高くても位置の偏りが強い場合があることを示した（抄録）。", "p3": "9社の21の審査員を、MT-Bench、JudgeBench、RewardBenchで、一致・一貫性・偏りの監査の3手順により、118回の実行で評価した（抄録）。", "p5": "完全一致率とコーエンのκの差はMT-Benchで33〜41ポイントあり、審査員の順位はベンチマーク間で最大14位動いた。2つの実運用の審査員では再試験の信頼性（0.95超）と強い位置の偏り（0.10超）が共存した（抄録）。", "fun": "AIに採点させるとき「人と答えが一致した割合」で良し悪しを測ることが多いのですが、そこには偶然の一致も含まれます。この研究は、偶然を差し引くと採点の実力が大きく目減りすることや、何度採点しても同じ点を付ける安定したAIでも、選択肢の並び順に強く左右される場合があることを示しました。「安定」と「正しさ」は別物だという点が面白いところです。", "unverified": "撤回されたarXiv版の訂正版とされ、訂正の内容は抄録では未確認。"}}, {"id": "pr40", "rank": 40, "headline": "相互作用するLLM群の集団の偏りを平均場で記述", "title": "Stochastic Dynamics of Generative AI: From Autoregressive Models to Interacting LLM Networks and Neural SDEs", "url": "https://arxiv.org/abs/2611.07065", "authors": "Vikram Krishnamurthy ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Krishnamurthy, V., Zhang, Y., & Snow, L. (2026). Stochastic Dynamics of Generative AI: From Autoregressive Models to Interacting LLM Networks and Neural SDEs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07065", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "生成AIを確率的な力学系として捉え、LLMの自己回帰的な生成、相互作用するLLMの集団、ニューラル確率微分方程式の3つを一つの見方で整理した（抄録）。", "p3": "LLMを注意機構で依存を持つ高次元の非線形自己回帰モデルとして定式化し、相互作用するLLMのネットワークの振る舞いを平均場の常微分方程式で表し、ニューラルSDEの学習ではラフパスに基づくキュバチャー法を論じた（抄録）。", "p5": "平均場の力学から、優先的選択の出現や、タイプに依存する「ガラスの天井」効果などの持続的な構造の偏りを理解する枠組みを示した（抄録）。数値的な結果は抄録に記載がない。", "fun": "文章を作るAIは、次の単語をさいころを振るように確率で選んでいます。この論文は、そうしたAIが大勢集まって情報をやり取りすると、人気者がますます人気になったり、特定のタイプが上に行けなかったりする偏りが生まれうることを、物理の「平均場」の考え方で説明しようとしています。人間社会とAI社会の偏りが同じ数学で書ける点が面白いところです。", "unverified": "理論の数値的な検証の有無と範囲は抄録では未確認。"}}, {"id": "pr41", "rank": 41, "headline": "固定格子のLESで柔らかい薄肉シェルの流体連成を解く", "title": "An Immersed Boundary, Wall-Modeled Large-Eddy Simulation Approach for Fluid-Structure Interaction of Flexible Thin Shells", "url": "https://doi.org/10.20944/preprints202611.0357.v1", "authors": "Zihan Zhu ほか", "venue": "Preprints.org", "date": "2026-11-06", "apa": "Zhu, Z., & Zhou, C. (2026). An Immersed Boundary, Wall-Modeled Large-Eddy Simulation Approach for Fluid-Structure Interaction of Flexible Thin Shells. https://doi.org/10.20944/preprints202611.0357.v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "柔らかい薄肉シェルと乱流の流体-構造連成を、固定格子の埋め込み境界法、壁モデルつきのラージエディシミュレーション（LES）、大変形のシェル要素の組み合わせで計算する方法を示した（抄録）。", "p3": "鋭い界面の埋め込み境界・壁モデルLESと回転自由度のない大変形シェル要素を結合し、壁の速度境界条件として従来のノイマン条件と、壁面で渦粘性を増やしてせん断応力を課す新しい滑りなし条件を比べた（抄録）。", "p5": "シェルの標準問題、層流中の片持ち梁、乱流中で揺れる逆向きの弾性の旗で検証し、実験の参照データとよく一致した。新しい滑りなし条件の方が参照データに近かった（抄録）。", "fun": "風に揺れる旗のように、流れと物体が互いに押し合いながら動く現象は、計算がとても難しい問題です。この研究は、物体の形に合わせて網目を作り直さずに済む方法で、乱れた流れの中で揺れる薄い板を計算しました。壁際の流れの扱いを少し工夫するだけで実験に近づいた点が面白いところです。", "unverified": "計算コストの比較とレイノルズ数の範囲は抄録では未確認。"}}, {"id": "pr42", "rank": 42, "headline": "3D-CNNでCT画像から粒度分布を直接推定", "title": "AI-Based Particle Size Distribution Prediction from 3D Packed-Particle Tomographic Volumes: A Comparative Study with classical Watershed Segmentation", "url": "https://doi.org/10.21203/rs.3.rs-11634141/v1", "authors": "Ruhi Gupta ほか", "venue": "Research Square (In Review)", "date": "2026-11-06", "apa": "Gupta, R., & Goswami, M. (2026). AI-Based Particle Size Distribution Prediction from 3D Packed-Particle Tomographic Volumes: A Comparative Study with classical Watershed Segmentation. https://doi.org/10.21203/rs.3.rs-11634141/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "小型の3次元CNNで、粒子を切り分けずにCT画像から粒度分布を直接推定できるかを調べ、精度では従来の分水嶺法に及ばないが高速であることを示した（抄録）。", "p3": "粒度分布の正解が分かる多分散の球の充填体積60個（48³ボクセル）を合成し、パラメータ30万900個のCNNと3次元の距離変換・分水嶺法を、未使用の試験データ10個で比べた（抄録）。", "p5": "充填率15〜25%で、分水嶺法の平均のアースムーバー距離は0.0974ボクセル、CNNは0.3428ボクセルで分水嶺法が上回った。処理時間はCNNが1体積1.19ms、分水嶺法が33.71msだったが、計算機が異なり単純には比べられないとしている（抄録）。", "fun": "砂や粉の粒の大きさの分布は、CTで撮った立体画像から粒を一つずつ切り分けて数えるのが普通です。この研究は、AIに切り分けをさせずに分布を直接言い当てさせてみました。結果は昔ながらの方法の方が正確で、AIは速いだけでした。新しい方法が負けた結果も正直に示している点が、かえって面白いところです。", "unverified": "密に詰まった粒状体や実際のCT画像での性能は抄録では未確認。"}}, {"id": "pr43", "rank": 43, "headline": "複数受信機の監視で差動GNSSの完全性を確保", "title": "Fault-Free Protection Levels, Multi-Receiver Monitoring and Galileo Redundancy for GBAS-Type Differential GNSS at a Reference Station with Real Code Faults", "url": "https://doi.org/10.20944/preprints202611.0411.v1", "authors": "Osman Bağcı ほか", "venue": "Preprints.org", "date": "2026-11-06", "apa": "Bağcı, O., Ürgün, S., Fidan, S., & Bora, M. Ö. (2026). Fault-Free Protection Levels, Multi-Receiver Monitoring and Galileo Redundancy for GBAS-Type Differential GNSS at a Reference Station with Real Code Faults. https://doi.org/10.20944/preprints202611.0411.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "イスタンブールの基準局で実際に起きたGPSの符号の跳びを使い、GBAS型の差動GNSSの保護水準、複数受信機の監視、ガリレオ衛星の追加の効果を評価した（抄録）。", "p3": "23.8kmの局の対で60,269の平滑化した試験時刻を使い、ICAOの基準に基づく誤差モデルの保護水準、2〜4台の模擬の基準受信機による監視、ガリレオを加えた場合の衛星配置と故障の除外を調べた（抄録）。", "p5": "標準の誤差モデルでは20時刻で保護水準を超えたが、誤差は10mの警報限界を超えなかった。ガリレオの追加でVDOPの中央値は1.48から1.10に、2つの同時故障の正しい除外は59%から95%に改善した（抄録）。", "fun": "飛行機が衛星の電波を頼りに着陸するとき、電波にまれに混じる狂いを見逃すと大事故につながります。この研究は、実際に観測された狂いを使って、複数の受信機で互いを見張る仕組みや、欧州のガリレオ衛星を加えることがどれだけ安全を高めるかを確かめました。見張りと衛星を増やす効果を実データで数字にした点が面白いところです。", "unverified": "ほかの基準局や条件での再現性は抄録では未確認。"}}, {"id": "pr44", "rank": 44, "headline": "利用者の埋め込みは解釈できる行動モードの重ね合わせ", "title": "User Embeddings are Superpositions of Interpretable Behavioral Modes", "url": "https://arxiv.org/abs/2611.08487", "authors": "Jonathan Kozaczuk ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Kozaczuk, J., Dong, Z., Evirgen, N., Majidi, K., Ng, E. K. H., Porter, C., Zhao, Q., Geng, J., Li, C., & Feng, B. R. (2026). User Embeddings are Superpositions of Interpretable Behavioral Modes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08487", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "推薦などに使う利用者の埋め込みを、解釈できる行動モードの疎な重ね合わせとして捉え、疎な自己符号化器でモードを取り出して自然言語で名前を付ける方法を示した（抄録）。", "p3": "線形の埋め込みでは利用者行動の生成モデルからこの構造が導かれ、深層の表現にも重ね合わせ仮説で近似的に広がると論じ、正解の分かる合成データと2つの実データの埋め込みで検証した（抄録）。", "p5": "合成データでは、疎な自己符号化器が古典的な疎な手法よりモードをよく復元した。付けた自然言語のラベルで、文章で学習していない埋め込みからも顧客層の検索と特徴づけができた（抄録）。", "fun": "ネット通販のおすすめ機能は、一人ひとりの好みを人には意味の読めない数字の並びで表しています。この研究は、その並びがいくつかの分かりやすい行動の傾向の足し合わせとして分解でき、それぞれに言葉で名前を付けられることを示しました。ブラックボックスの中身に名札を付ける発想が面白いところです。", "unverified": "実データでの復元の精度と、取り出したモードの具体例は抄録では未確認。"}}, {"id": "pr45", "rank": 45, "headline": "8つの専門エージェントで論文の査読報告を作る", "title": "PeerLens as a Multi-Agent LLM Reviewer", "url": "https://doi.org/10.21203/rs.3.rs-11323645/v1", "authors": "Emre Dil ほか", "venue": "Research Square (In Review)", "date": "2026-11-06", "apa": "Dil, E., & Zafer, T. (2026). PeerLens as a Multi-Agent LLM Reviewer. https://doi.org/10.21203/rs.3.rs-11323645/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "分類、主張の抽出、次元解析、記号的な検証、新規性の探索、構成の査読、分野の専門家の査読、再現性の査読の8つの専門エージェントで、原稿のPDFから査読報告を作るシステムPeerLensを示した（抄録）。", "p3": "物理・生物・数学・化学の64論文（SciPost、eLife、F1000Research）で評価し、初回の人の査読報告がある51論文で人の査読と比べた（抄録）。", "p5": "人の査読と一致するか、より厳しい判断をし、その違いは統計の前提の破れや次元の誤った指標など具体的な技術的根拠に基づいていた。捏造された引用や作られた技術的な主張は観察されなかった（抄録）。", "fun": "論文の数が増えすぎて、審査をする研究者が足りなくなりつつあります。この研究は、計算の単位がそろっているかを確かめる係や新しさを調べる係など、8つの役割をAIに分けて担当させ、一つの審査報告にまとめました。人の審査より厳しめでも、その理由が具体的だったという点が面白いところです。", "unverified": "一致・不一致の件数の内訳と、厳しい判断が妥当だったかの第三者の評価は抄録では未確認。"}}, {"id": "pr46", "rank": 46, "headline": "多エージェントの指揮役を判断の相互作用込みで学習", "title": "Learning Multi-Agent Orchestration:Higher-Order Interactions in Policy Improvement", "url": "https://arxiv.org/abs/2611.07495", "authors": "Kaixuan Liu ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Liu, K., & Xiong, G. (2026). Learning Multi-Agent Orchestration:Higher-Order Interactions in Policy Improvement (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07495", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMの多エージェント系で、エージェントの選択と情報の配分を担う指揮役を学習するとき、判断どうしの相互作用を明示的に扱う方策最適化IAPOを提案した（抄録）。", "p3": "2つの方策の性能差を個々の判断の効果とその相互作用に正確に分解し（相互作用が得られる改善の半分を占めうることを証明）、標本の軌跡から両方を最適化しつつ各更新が改善であることを保証する（抄録）。", "p5": "長い入力版のGSM8K、MATH、DROP、MBPP、HumanEvalで、同じ7Bの実行モデルを使う15の既存システムと比べ、最強のシステムの精度により少ないトークンで達した。相互作用の項を除くとコードの課題で精度が7〜17ポイント下がった（抄録）。", "fun": "チームで仕事をするとき、誰に何を任せるかの判断は、前の判断の結果しだいで良し悪しが変わります。この研究は、AIの指揮役を鍛えるときに、判断を一つずつ別々に評価するのではなく、判断どうしの組み合わせの効果まで数えるようにしました。組み合わせを無視すると成績が大きく落ちた点が面白いところです。", "unverified": "学習に要する計算量と、ほかの実行モデルでの効果は抄録では未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "統計学", "headline": "ベーレンス–フィッシャー区間の保守性を証明", "title": "Validity of the Behrens--Fisher solution", "url": "https://arxiv.org/abs/2611.06987", "authors": "Gunnar Taraldsen", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Taraldsen, G. (2026). Validity of the Behrens--Fisher solution (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06987", "why": "2つの正規母集団の平均差のフィデューシャル区間が、未知の分散がどんな値でも名目の被覆確率を下回らないことを、k個の平均の線形結合まで含めて証明した。数値計算で知られていた性質に初めて証明を与えた。"}, {"id": "pn02", "rank": 2, "field": "開発経済学", "headline": "規模の経済が強いと水道の接続料はゼロが最適", "title": "Economies of scale and the equity-efficiency trade-off: Evidence from a piped water network in rural Bangladesh", "url": "https://arxiv.org/abs/2611.08031", "authors": "Md. Ahasan Habib ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Habib, M. A., & Tompsett, A. (2026). Economies of scale and the equity-efficiency trade-off: Evidence from a piped water network in rural Bangladesh (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08031", "why": "バングラデシュ農村で新設した水道網への接続の支払意思額を誘因つきで引き出し、事業費の規模の経済と組み合わせて、接続世帯あたりの費用を最小にする価格がゼロになることを示した。"}, {"id": "pn03", "rank": 3, "field": "機械学習", "headline": "同じデータで学習したLMでも破られる脱獄は違う", "title": "Identically Trained Language Models Break on Different Jailbreaks", "url": "https://arxiv.org/abs/2610.34074", "authors": "Chi-Wei Chang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-06", "apa": "Chang, C.-W., Kuo, M.-T., Lee, K.-W., & Tsai, M.-H. (2026). Identically Trained Language Models Break on Different Jailbreaks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34074", "why": "25のデータ配合ごとに事前学習3回・事後学習2回の計150モデルを作り、どの脱獄に弱いかが事前学習の実行ごとに変わることを示して、単一のチェックポイントでの安全性評価の限界を明らかにした。"}, {"id": "pn04", "rank": 4, "field": "因果推論", "headline": "潜在結果の同時期待値を識別し鋭い限界を導く", "title": "Identification and Bounding of Joint Expectation over Potential Outcomes", "url": "https://arxiv.org/abs/2611.07536", "authors": "Yuta Kawakami ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Kawakami, Y., & Tian, J. (2026). Identification and Bounding of Joint Expectation over Potential Outcomes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07536", "why": "処置あり・なしの潜在結果の関数の同時期待値について、共単調性・反共単調性による新しい識別条件と、仮定のない場合の鋭い限界を導き、個人の因果効果のばらつきの評価を可能にした。"}, {"id": "pn05", "rank": 5, "field": "経済学", "headline": "混雑する選択肢の離散選択で均衡と厚生を識別", "title": "Discrete Choice under Congestion: Equilibrium and Welfare", "url": "https://arxiv.org/abs/2611.07787", "authors": "Debopam Bhattacharya ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Bhattacharya, D., & Makiranta, M. (2026). Discrete Choice under Congestion: Equilibrium and Welfare (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07787", "why": "選ぶ人が増えると価値が下がる選択肢がある場合に、効用の関数形や異質性に制約を置かずに均衡の存在と一意性を示し、ミクロデータから厚生効果を半パラメトリックに識別する枠組みを作った。"}, {"id": "pn06", "rank": 6, "field": "機械学習", "headline": "ベンチマークの縮約は無作為抽出でほぼ足りる", "title": "Random Is Almost Enough? Stable and Low-Cost Benchmark Compression via BestRand", "url": "https://arxiv.org/abs/2611.00883", "authors": "George Ling ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-06", "apa": "Ling, G., Zhong, S., Yang, L., Yang, H., Li, N., & Huang, Z. (2026). Random Is Almost Enough? Stable and Low-Cost Benchmark Compression via BestRand (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00883", "why": "部分集合から全体の得点を推定する誤差の分布を解析的に近似し、無作為抽出でも多くは誤差が小さい一方、まれな大きな誤差が不安定さの原因になることを示して、安定で低コストの縮約法を提案した。"}, {"id": "pn07", "rank": 7, "field": "統計学", "headline": "変化点の位置に分布によらない信頼区間を付ける", "title": "Changepoint localization via nested exchangeability tests: from point estimates to confidence intervals", "url": "https://arxiv.org/abs/2611.07399", "authors": "Rohan Hore ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Hore, R., & Ramdas, A. (2026). Changepoint localization via nested exchangeability tests: from point estimates to confidence intervals (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07399", "why": "任意の推定量が示した変化点の位置に、入れ子の窓での交換可能性の検定で有限標本の被覆を保証する信頼区間を与え、並べ替え検定の回数も対数オーダーに抑えた。"}, {"id": "pn08", "rank": 8, "field": "因果推論", "headline": "連続時間の確率過程に操作変数法を拡張", "title": "Instrumental Variables in Continuous-Time Stochastic Processes", "url": "https://arxiv.org/abs/2611.07674", "authors": "Lars Pennig ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Pennig, L., Mogensen, S. W., & Kilbertus, N. (2026). Instrumental Variables in Continuous-Time Stochastic Processes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07674", "why": "確率微分方程式で表される定常過程に、過程そのものを操作変数とする枠組みを作り、ドリフトの水準で因果効果を定めて、経路を使ったモーメント条件を導いた。"}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "考慮集合が見えなくても厚生効果は識別できる", "title": "Unobserved Consideration and Consumer Welfare", "url": "https://arxiv.org/abs/2611.07774", "authors": "Debopam Bhattacharya ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Bhattacharya, D., & Martin, R. J. (2026). Unobserved Consideration and Consumer Welfare (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07774", "why": "消費者が一部の選択肢しか考慮しない場合でも、価格変化の厚生分布が完全に考慮する場合と同じ選択確率の汎関数で表せることを示し、考慮集合と選好が識別できなくても需要と厚生は識別できることを明らかにした。"}, {"id": "pn10", "rank": 10, "field": "社会学", "headline": "メキシコの性暴力警報に暴力を減らした証拠なし", "title": "Mexico’s Gender Violence Alert and Violence Against Women and Girls: Causal Evidence from a Difference-in-Differences Analysis", "url": "https://doi.org/10.31235/osf.io/8n6se", "authors": "Finja Mailin Schneider", "venue": "SocArXiv", "date": "2026-11-06", "apa": "Schneider, F. M. (2026). Mexico’s Gender Violence Alert and Violence Against Women and Girls: Causal Evidence from a Difference-in-Differences Analysis. https://doi.org/10.31235/osf.io/8n6se", "why": "自治体ごとに時期の異なる警報の発令を差の差法で評価し、女性の殺害、自己申告の暴力、通報、意識のいずれにも明確な効果がないことを示した。"}, {"id": "pn11", "rank": 11, "field": "機械学習", "headline": "大きなLMほど圧縮の損傷を補いにくい", "title": "When Bigger Becomes Brittle: Why Compression Hurts More as Language Models Scale", "url": "https://arxiv.org/abs/2611.07891", "authors": "Gautam Gupta ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Gupta, G., Kukreja, D., Kumar, U., Mittal, A., Dabas, D., Sah, K., Cambria, E., Shah, R. R., Wang, Z., & Anand, A. (2026). When Bigger Becomes Brittle: Why Compression Hurts More as Language Models Scale (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07891", "why": "文脈内検索を担う注意ヘッドの除去による損失を、損傷とネットワークの補償に正確に分解し、ベンチマークの得点では見えない補償の働きがモデルの規模でどう変わるかを示した。"}, {"id": "pn12", "rank": 12, "field": "統計学", "headline": "p値を選択用と推論用に分けて選択後の推論", "title": "Inference after selection on randomized p-values", "url": "https://arxiv.org/abs/2611.07459", "authors": "Ronan Perry ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Perry, R., & Witten, D. (2026). Inference after selection on randomized p-values (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07459", "why": "p値を帰無仮説の下で独立な2つの成分に分ける手順で、p値だけから選択後の条件付きの第1種過誤を制御する検定と信頼区間を作り、出版バイアスや勝者の呪いへの応用を示した。"}, {"id": "pn13", "rank": 13, "field": "開発経済学", "headline": "中国資本の排除はリチウムの供給を細らせる", "title": "Cross-Border Ownership and Input Access: Evidence from the Lithium Supply Chain", "url": "https://arxiv.org/abs/2611.08430", "authors": "Kei Irizawa", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Irizawa, K. (2026). Cross-Border Ownership and Input Access: Evidence from the Lithium Supply Chain (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08430", "why": "世界の鉱山と精錬所のデータで国境を越えた所有の効果を推定するモデルを作り、中国資本の売却や鉱石の輸出禁止といった安全保障上の政策の供給への影響を評価した。"}, {"id": "pn14", "rank": 14, "field": "因果推論", "headline": "パネルの二重機械学習の識別と仕様を検証", "title": "Double Machine Learning for Panel Data: Identification, Specification, and a Bank Regulation Effect", "url": "https://arxiv.org/abs/2611.07249", "authors": "Ali Habibnia ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Habibnia, A., Maasoumi, E., & Shah, G. (2026). Double Machine Learning for Panel Data: Identification, Specification, and a Bank Regulation Effect (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07249", "why": "2018年の米国の銀行規制を例に、パネルデータでの二重機械学習の識別条件と変換による仕様の偏りを整理し、推定値の頑健性を検討した。"}, {"id": "pn15", "rank": 15, "field": "機械学習", "headline": "視覚的な計画の座標を一括で生成して高速化", "title": "VFlash: Fast, Accurate Visual Planning via Flash Primitive Decoding", "url": "https://arxiv.org/abs/2611.08449", "authors": "Yu-Cheng Chou ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-06", "apa": "Chou, Y.-C., Wang, S., Huang, J., Huang, C.-P., Yang, C.-A., Fan, X., Wang, J., Li, Z., Kuang, Y., Zheng, R., Bjorck, J., Liu, S., Su, H., Badki, A., Zhang, L., Yuille, A., Fan, L. \"J., Kautz, J., & Yu, Z. (2026). VFlash: Fast, Accurate Visual Planning via Flash Primitive Decoding (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08449", "why": "視覚言語モデルが点や軌道などの視覚的な計画を座標のトークンごとに生成する遅さを、図形の構造を使って一度に予測する方法で解消した（Hugging Faceで投票75）。"}, {"id": "pn16", "rank": 16, "field": "機械学習", "headline": "再起動の監視の良し悪しは精度で決まらない", "title": "Monitor Accuracy Isn't the Answer: A Decision-Value Framework for Evaluating AI Agent Restart Monitors", "url": "https://arxiv.org/abs/2610.36544", "authors": "Siddharth Jain ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-05", "apa": "Jain, S., & Vedam, V. N. (2026). Monitor Accuracy Isn't the Answer: A Decision-Value Framework for Evaluating AI Agent Restart Monitors (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.36544", "why": "AIエージェントを再起動するかを決める監視器について、同じ90%の精度でも成功率が下がる場合も大きく上がる場合もあることを解析的に示し、意思決定の価値で評価する方法を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "AIエージェントを再起動するかを決める監視器は分類の精度だけでは良し悪しが決まらないことを解析的に示し、意思決定の価値と統計的な裏付けで評価する2つの方法を提案した（抄録）。", "p3": "精度90%の監視器でも、再試行の成功確率しだいで成功率が5ポイント下がる場合から35ポイント上がる場合まであることを示し、ブラックウェルの実験比較を二値行動に特化した基準と、既存の軌跡だけで再起動・継続・保留を判定する有限標本の監査を作った（抄録）。", "p5": "SWE-bench VerifiedのSymPyの19課題で194回の実行を調べ、見かけの2.29ポイントの改善は1件の失敗に由来し、別のモデルでは42.29ポイント悪化し、103件の比較のどれも認証の基準を満たさなかった（抄録）。", "fun": "作業がうまく進まないAIを途中でやり直させるか決める見張り役は、正解率が高ければ良いと思いがちです。ところがこの研究は、同じ90%の正解率でも、やり直した後の成功の見込みしだいで、全体の成績が上がることも下がることもあると数式で示しました。見張りの良し悪しはその後の判断の価値で測るべきだ、という点が面白いところです。", "unverified": "選んだ19課題以外への一般化は抄録では未確認。"}}, {"id": "pn17", "rank": 17, "field": "機械学習", "headline": "推論の履歴を書き直すと以後の推論が短くなる", "title": "Why Pay for Long Reasoning When Rewrite Do Trick? Causal Effects of Reasoning History Compaction on Future Generation and Agent Cost", "url": "https://arxiv.org/abs/2611.03852", "authors": "Anton Hristov", "venue": "Hugging Face Daily Papers", "date": "2026-11-05", "apa": "Hristov, A. (2026). Why Pay for Long Reasoning When Rewrite Do Trick? Causal Effects of Reasoning History Compaction on Future Generation and Agent Cost (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03852", "why": "オープンなモデルが自分の過去の推論を簡潔な記録に書き直すと、再学習なしに以後の推論が短くなるかを、元の履歴との比較という介入で調べた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "オープンなモデルが自分の過去の推論を簡潔な状態の記録に書き直すと、再学習なしに以後の推論が短くなるかを、介入として調べた（抄録）。", "p3": "ツールの結果が明かされる前に、それまでの推論を簡潔な記録に書き換え、元の履歴と簡潔な履歴からの続きを比べた。コーディングの事例研究とソフトウェアのエージェントへの導入でも評価した（抄録）。", "p5": "受け入れた簡潔な履歴は、試したモデルの多くで以後の推論を短くし、コーディングでは繰り返しの検証も減った。エージェントでは総費用を下げうるが、課題の質と書き換えを含む時間は対象と圧縮器しだいだった（抄録）。", "fun": "難しい問題を解くAIは、長々と考えを書き連ねるほど賢くなりますが、そのぶん計算代がかさみます。この研究は、それまでのメモを要点だけに書き直して渡すと、AIがその後の考えも短く済ませるようになることを示しました。過去のメモの書き方が、未来の自分の考え方を変えるという点が面白いところです。", "unverified": "短縮の程度と正答率への影響の具体的な数値は抄録では未確認。"}}, {"id": "pn18", "rank": 18, "field": "機械学習", "headline": "Transformerは文脈だけで不安定な系を制御できるか", "title": "How do Transformers Perform Low-Level Control In-Context?", "url": "https://arxiv.org/abs/2611.07291", "authors": "Ebonye Smith ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Smith, E., Andrews, A., Wilson, P., Frias, A., Pandey, A., & Ranade, G. (2026). How do Transformers Perform Low-Level Control In-Context? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07291", "why": "系の種類と自由な時間発展のデータだけを文脈として与え、Transformerが倒立振子などの不安定な非線形系をパラメータを知らずに制御できるかを調べた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "Transformerが、系の種類と外力のない時間発展のデータだけを文脈として与えられて、パラメータを知らない不安定な非線形系を制御できる（文脈内制御）ことを示した（抄録）。", "p3": "複数ヘッドのGPT-2型の構造を使い、倒立振子（カートポール）と2リンクのアクロボットで、学習時だけ専門家の制御の軌跡が使える設定で訓練し、低レベルの制御を学ばせるのに不可欠な訓練の技法を特定した（抄録）。", "p5": "文脈内での制御は可能で、文脈が長いほど学習した方策の性能はおおむね向上し、分布外の系も安定化できた（抄録）。性能の具体的な数値は抄録に記載がない。", "fun": "棒を手のひらに立ててバランスを取るのは、棒の長さや重さを知らなくても、少し揺らしてみれば何とかなります。この研究は、文章を作るAIと同じ仕組みのTransformerに、揺れ方の記録を少し見せるだけで、倒れやすい振り子を立たせ続けられるかを試しました。文脈から学ぶ能力が体を動かす制御にも通じる点が面白いところです。", "unverified": "制御の成功率などの具体的な数値と、学習に使った専門家データの量は抄録では未確認。"}}, {"id": "pn19", "rank": 19, "field": "機械学習", "headline": "表形式の基盤モデルで能動的に文脈を選ぶ", "title": "When, Where, How: Active In-Context Learning for Tabular Foundation Models", "url": "https://arxiv.org/abs/2611.07886", "authors": "Christian M. M. Frey", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Frey, C. M. M. (2026). When, Where, How: Active In-Context Learning for Tabular Foundation Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07886", "why": "ラベルの付いた行だけで適応する表形式の基盤モデルに、多様性・不確実性・情報利得による能動的な選択がどう効くかを、文脈が増えるにつれて比較した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "文脈に入れたラベル付きの行だけで新しい課題に適応する表形式の基盤モデルで、どの行にラベルを付けると効率がよいか（能動的な文脈学習）を、時期・場所・方法の3点から明らかにした（抄録）。", "p3": "目的の入力に近い行を選ぶTANNと、文脈での予測情報利得の期待値EPICを、多様性や不確実性による古典的な規則と、20のベンチマーク、2つの基盤モデルと勾配ブースティング木で比べた（抄録）。", "p5": "初期の反復では多様性に基づく選択が最良で、目的の入力に役立つ行を選ぶことが大きく効いた。EPICは大きな8つのベンチマークで、プールの5〜10%のラベルで全データの性能（偶然補正後）の平均80〜87%を保った（抄録）。", "fun": "データに正解のラベルを付ける作業は、専門家の手間がかかって高くつきます。この研究は、表の形のデータを扱うAIに、どの行から正解を教えれば一番効率よく賢くなるかを調べました。最初は多様な例を、その後は知りたい対象に近い例を選ぶのが良いなど、教える順番に作戦があるという点が面白いところです。", "unverified": "個々のベンチマークでの差と計算時間は抄録では未確認。"}}, {"id": "pn20", "rank": 20, "field": "機械学習", "headline": "疎自己符号化器でMoEの専門家の役割を読み解く", "title": "SAE Interprets MoE: Sparse AutoEncoders Reveal That MoE Experts Exhibit Human-Interpretable Fine-Grained Specialization", "url": "https://arxiv.org/abs/2611.08089", "authors": "Anyuan Zhuo ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-06", "apa": "Zhuo, A., Zhang, S., Lin, Y., & Lu, P. (2026). SAE Interprets MoE: Sparse AutoEncoders Reveal That MoE Experts Exhibit Human-Interpretable Fine-Grained Specialization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08089", "why": "MoE層の出力に疎自己符号化器を学習させ、潜在特徴の活性を専門家ごとに正確に分解して、各専門家が人に解釈できる細かな役割を持つことを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "Mixture-of-Experts（MoE）の各専門家の担当を、MoE層の出力で学習した疎な自己符号化器（SAE）の特徴を専門家ごとに正確に分解して調べ、細かく人に解釈できる分業があることを示した（抄録）。", "p3": "MoEの出力は専門家の出力の重み付き和で、SAEの符号化器はアフィンなので、各特徴の活性化前の値が専門家ごとに正確に分解できる。Qwen3-30B-A3Bの第4・30・46層でコーパス全体にわたり集計した（抄録）。", "p5": "寄与はゲートでの選択よりはるかに集中し、多くの特徴は1〜2個の専門家に支配されていた。Javaとフロントエンドのコード、幾何と算術・多項式のように粗い分野より細かい分業があった（抄録）。", "fun": "最近の大きなAIの中には多数の「専門家」の小さなネットワークがあり、入力ごとに数人だけが呼ばれます。でも、それぞれが本当は何の専門家なのかはよく分かっていませんでした。この研究は出力を細かい特徴に分解し、プログラミングの中でもJava担当とWeb画面担当が分かれているような細かな分業を見つけました。AIの中の役割分担が見える点が面白いところです。", "unverified": "ほかのモデルや層での一般性は抄録では未確認。"}}, {"id": "pn21", "rank": 21, "field": "機械学習", "headline": "LLMの重みの読解は推論より局所計算と記憶", "title": "Can an LLM Actually Reason and Program about Neural Network's Weights or is it just memorization on steroids? Exploring \"Weight-Space Programming\"", "url": "https://arxiv.org/abs/2611.08070", "authors": "Nazmus Sakib Ahmed", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Ahmed, N. S. (2026). Can an LLM Actually Reason and Program about Neural Network's Weights or is it just memorization on steroids? Exploring \"Weight-Space Programming\" (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08070", "why": "小さな畳み込みネットワークの重みを文字で与えたとき、LLMの読み取りが重みの流れについての推論なのか、局所的な計算と公開データの記憶なのかを検証した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMがニューラルネットの重みを直接読む能力が、重みの流れの推論なのか、局所的な計算と公開データの記憶なのかを、Claude Opus 5.5で探索的に検証した（抄録）。", "p3": "5つの画像データで学習した約12万5,000パラメータの畳み込みネットの全重みを、道具・順伝播・データ名なしの文字列で与えて読み取りと主張を検証した。多くは1回の実行による探索的な結果である（抄録）。", "p5": "バッチ正規化の統計から約3回の更新を推定するなど局所的な計算は正確だったが、意味の判断は既知のデータに頼り、ラベルの順番を入れ替えると解釈した組はすべて誤った（抄録）。", "fun": "AIが別のAIの中身（重みの数字）を読んで、何を学んだかを言い当てたという報告があります。この研究は、それが本当に中身の理解なのかを確かめるため、答えのラベルの順番をこっそり入れ替えてみました。すると説明はすべて外れ、有名なデータの並び順を覚えていただけだと分かりました。引っかけ問題で理解と暗記を見分けた点が面白いところです。", "unverified": "多くが1回の実行で、順伝播による直接の検証は行っていないと著者が記載（抄録）。"}}, {"id": "pn22", "rank": 22, "field": "機械学習", "headline": "トカマクの多様な計測を扱う生成的な基盤モデル", "title": "A Generative Foundation Model for Multimodal Tokamak Tasks", "url": "https://arxiv.org/abs/2611.08153", "authors": "Yingshuai Ji ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Ji, Y., Feng, H., Deng, G., Bian, G., & Wang, Y. (2026). A Generative Foundation Model for Multimodal Tokamak Tasks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08153", "why": "波形・分布・場などトカマク実験の多様な計測を、課題ごとの入出力の形に合わせて扱う生成的な基盤モデルを作り、再構成や予測など複数の課題を一つのモデルで行った。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "トカマク実験の波形・分布・場・スカラーなど多様な計測を、課題ごとの入出力の形に合わせて同時に生成する基盤モデルGenTokaを作り、複数の課題で既存のモデルを上回った（抄録）。", "p3": "TokaMarkベンチマークにアクチュエータ操作の逆推定とディスラプション予測を加えて6群20課題とし、共有の条件付き拡散Transformerと信号ごとの符号化器で目標を同時に生成した（抄録）。", "p5": "MASTの計測で、既存のTokaMindに比べ正規化誤差のマクロ平均を第1〜4群で4.7%、第5群で17.7%下げ、第6群のマクロ平均F1を8.4%改善した（抄録）。", "fun": "核融合を目指す装置トカマクでは、プラズマの状態をさまざまなセンサで同時に測っていますが、目的ごとに別々のAIを作るのが普通でした。この研究は、波形も分布も数値も一つのAIでまとめて扱い、状態の再現から崩壊の予告まで同じ土台でこなせるようにしました。何でも扱える土台のAIを実験物理に持ち込んだ点が面白いところです。", "unverified": "ほかの装置への転用の性能は抄録では未確認。"}}, {"id": "pn23", "rank": 23, "field": "機械学習", "headline": "内部の成分の整合性でLLMの回答の正誤を自己評価", "title": "Circe: Training-Free LLM Self-Evaluation via Component Interaction Consistency", "url": "https://arxiv.org/abs/2611.07948", "authors": "Shuyi Miao ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Miao, S., Li, Z., Xie, X., Xu, L., Shen, F., Du, X., & Chua, T.-S. (2026). Circe: Training-Free LLM Self-Evaluation via Component Interaction Consistency (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07948", "why": "注意機構と前向き層の相互作用の整合性という内部の信号から、参照解なしにLLMの回答の正しさを評価する訓練不要の方法を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "参照の答えも繰り返しの生成もなしに、LLMの回答が正しいかを、内部の成分の相互作用と出力の尤度から評価する訓練不要の方法Circeを提案した（抄録）。", "p3": "前の層の注意の更新と後の層の前向き層の出力変化の向きのそろい方（CIC）、層ごとの隠れ状態の軌跡の変位と角度（RG）、生成トークンの尤度による確信度（LC）を一つの得点に統合した（抄録）。", "p5": "4分野の6ベンチマークと5つのLLMで、既存の基準より正しい回答と誤った回答をよく区別し、多言語・マルチモーダル・開かれた設定にも一般化した（抄録）。差の数値は抄録に記載がない。", "fun": "AIの答えが合っているかを確かめるには、普通は正解と見比べる必要があります。この研究は、正解がなくても、AIの頭の中で部品どうしがどれだけ同じ向きに働いているかを見れば、正しい答えかどうかがある程度分かると考えました。答えの中身ではなく、考えている最中の足並みで正しさを測る点が面白いところです。", "unverified": "既存手法との差の大きさと計算の追加負担は抄録では未確認。"}}, {"id": "pn24", "rank": 24, "field": "統計学", "headline": "適応的な実験はモデルの誤りを隠しうる", "title": "Adaptive Experimentation Can Hide Model Error:Detection Limits and Falsification Budget", "url": "https://arxiv.org/abs/2611.07529", "authors": "Ramnarayan Choudhary", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Choudhary, R. (2026). Adaptive Experimentation Can Hide Model Error:Detection Limits and Falsification Budget (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07529", "why": "適応的な実験計画が誤ったモデルに合う設定を選び続けると、モデルの誤りが検出できなくなることを検定の検出力の上限として示し、反証のために計画の予算の一部を確保する規則を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "適応的な実験計画が誤ったモデルにうまく合う設定を選び続けると、モデルの誤りが検出できなくなることを、妥当な検定の検出力の上限として示した（抄録）。", "p3": "実験者自身の標本の分布で適合性検定の検出力を上から抑え、選んだデータにない情報と検出器が失う情報を区別し、未解決の誤差を測る診断と、計画の予算の一部を反証に回す規則を導いた（抄録）。", "p5": "実証の結果は混在し、事前に定めた主研究は検出の条件を満たさなかった。開示した修正版はT=240で誤った設定の35.8%を検出し（対照は31.7%）、T=480では差が定まらなかった（抄録）。", "fun": "実験を効率よく進めようと結果を見ながら次の条件を選んでいくと、知らないうちに自分のモデルがうまく当てはまる場所ばかり調べてしまうことがあります。この研究は、そうするとモデルの間違いが見つからなくなることを数式で示し、予算の一部を反証のために取っておく作戦を提案しました。うまくいかなかった検証も包み隠さず報告している点も面白いところです。", "unverified": "提案の規則の一般的な有効性は確立していないと著者が記載（抄録）。"}}, {"id": "pn25", "rank": 25, "field": "統計学", "headline": "ネットワークの部分グラフを結果とする非母数回帰", "title": "Nonparametric Subgraph Regression", "url": "https://arxiv.org/abs/2611.07240", "authors": "Wenxuan Ding", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Ding, W. (2026). Nonparametric Subgraph Regression (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07240", "why": "三角形の形成のように複数の主体の組で定まる結果について、観測の依存を考慮したカーネル回帰の収束速度と漸近正規性を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "三角形の形成のように、ネットワーク上の複数の主体の組で定まる結果の非母数回帰（部分グラフ回帰）を定式化し、カーネル回帰推定量の分散の上限、一様収束の速度、各点での漸近正規性を示した（抄録）。", "p3": "主体を共有する組の結果は依存しうるが、共通の主体がない組は独立という構造のもとで、ナダラヤ–ワトソン型のカーネル回帰の部分グラフ版を分析した。2者の組の回帰を特殊ケースとして含む（抄録）。", "p5": "観測の数はNのp乗の次数でも実効的な標本の大きさはNであり、収束の速さは1人の主体の共変量の次元で決まるため、次元の呪いが和らぐことを示した（抄録）。", "fun": "友人関係のネットワークで「3人が互いに友達になるか」を調べると、組み合わせの数は人数の3乗で増えます。でも同じ人が多くの組に入るので、データが本当に増えたわけではありません。この論文は、見かけの数に惑わされず、実際の情報量は人数程度だと正しく数え直しました。数え方一つで結論の確かさが変わる点が面白いところです。", "unverified": "シミュレーションや実データでの性能は抄録では未確認。"}}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "条件付き裾指数モデルの直交化した特定化検定", "title": "Neyman Orthogonalized Specification Tests for Conditional Tail Index Models", "url": "https://arxiv.org/abs/2611.07219", "authors": "Liuhua Peng ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Peng, L., Li, S., & Song, X. (2026). Neyman Orthogonalized Specification Tests for Conditional Tail Index Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07219", "why": "重い裾の分布の条件付き裾指数モデルについて、推定の影響とパレート近似の偏りを取り除いた検定を作り、より低い閾値でも正しい大きさを保てることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "重い裾の分布の条件付き裾指数モデルに対し、推定の影響を取り除いた射影経験過程による特定化検定を作り、より低い閾値でも検定の大きさを保てる条件を示した（抄録）。", "p3": "帰無仮説のパラメータ推定の一次の影響を除く射影を使い、条件付きHallクラスでパレート近似の偏りも消える条件を特定した。乗数ブートストラップで妥当性を示し、データ駆動の閾値選択規則も提案した（抄録）。", "p5": "対数線形モデルでは、閾値を超える観測の共変量が集中して情報行列の最小固有値がゼロに近づく場合にもブートストラップが妥当であることを示し、シミュレーションと実データで性能を調べた（抄録）。", "fun": "大地震や大暴落のような極端な出来事の起こりやすさは、分布の「裾」の重さで決まります。裾を調べるには大きな値だけを使いますが、使うデータを増やそうと基準を下げると誤差が混じります。この研究は、その誤差を打ち消す工夫で、より多くのデータを使って正しく検定できるようにしました。少ない極端な例を最大限に生かす工夫が面白いところです。", "unverified": "実データの内容と検出力の改善の大きさは抄録では未確認。"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "ガウス雲の要約で分散データの分位点回帰", "title": "Clouded Representatives and Score Matching for Distributed Quantile Regression", "url": "https://arxiv.org/abs/2611.07273", "authors": "Keren Li ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Li, K., & Wang, B. (2026). Clouded Representatives and Score Matching for Distributed Quantile Regression (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07273", "why": "各拠点のデータをスコアが一致する少数のガウス雲に要約して中央で分位点回帰を行う方法で、拠点の不均一や非同期の通信にも対応した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "個票を共有できない多数の拠点に分かれたデータで、各拠点の観測をスコアが一致する少数のガウス雲に要約し、中央で分位点回帰を行う方法cloudqrを提案した（抄録）。", "p3": "各拠点はいくつかのガウス雲（大きさ・中心・共分散）で観測を要約し、雲が元データのスコアに正確に一致するようにする。中央のサーバが全拠点の雲で分位点回帰を当てはめ、穏やかな条件で収束を示した（抄録）。", "p5": "シミュレーションと2つの実データの応用で、既存の分散型の方法より優れた性能を示した（抄録）。性能差の数値は抄録に記載がない。", "fun": "病院や会社ごとにデータを持っていても、個人の記録は外に出せないことがよくあります。この研究は、それぞれの場所でデータを「いくつかの雲の形」に要約して送るだけで、元のデータを集めたのと同じ分析ができるようにしました。中身を見せずに大事な性質だけを渡す工夫が面白いところです。", "unverified": "実データの内容と性能差の大きさは抄録では未確認。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "部分マッチングからネイマン–ピアソンの補題を導く", "title": "A Partial-Matching Proof of the Neyman--Pearson Lemma", "url": "https://arxiv.org/abs/2611.07368", "authors": "Rami V. Tabri", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Tabri, R. V. (2026). A Partial-Matching Proof of the Neyman--Pearson Lemma (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07368", "why": "対立分布と尺度を変えた帰無分布の最大の部分マッチングとその双対問題から最適な検定が導かれることを示し、補題の新しい証明を与えた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "対立分布と尺度を変えた帰無分布の最大の部分マッチングから、ネイマン–ピアソンの補題（尤度比検定が最強力であること）を直接に証明した（抄録）。", "p3": "最大の部分マッチングで2つの分布を共通の成分と互いに特異な2つの残差に分け、初等的な双対問題の相補性条件から、対立側の残差で棄却し、帰無側の残差で棄却しない規則を導く（抄録）。", "p5": "最適な検定はあらかじめ提案されるのではなく最大のマッチングから現れ、尤度比の閾値でのみランダム化の自由が残る。マッチングの輪郭が最適な検出力の包絡線も決める（抄録）。", "fun": "統計の検定は「2つの分布を見分ける」こと、マッチングは「2つの分布の共通部分を見つける」ことで、正反対の作業に見えます。この論文は、共通部分をできるだけ多く取り除くと、残った部分がそのまま最良の検定の答えになることを示しました。教科書に載る有名な定理に、まったく違う方向から新しい証明を与えた点が面白いところです。", "unverified": "多次元や複合仮説への拡張は抄録では未確認。"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "値の範囲が決まった時系列のための有界GARCH", "title": "Bounded GARCH Processes", "url": "https://arxiv.org/abs/2611.08158", "authors": "Wagner Barreto-Souza", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Barreto-Souza, W. (2026). Bounded GARCH Processes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08158", "why": "失業率や相関のように区間に収まる時系列のために、予測が境界を越えない有界GARCH過程を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "実現相関・失業率・支出の割合など区間に収まる時系列のために、予測が境界を越えない有界GARCH過程を提案し、性質と推定の理論を整えた（抄録）。", "p3": "条件付き分散の式にパラメータの制約を課して過程全体がほぼ確実に有界の範囲に収まるようにし、厳密な定常性とエルゴード性を証明し、条件付き最尤推定の一致性と漸近正規性を導いた（抄録）。", "p5": "シミュレーションで有限標本の性能を確かめ、不動産ETF（VNQ）と長期国債ETF（TLT）の月次の実現相関で、変動の集中をとらえつつ通常のGARCHで起きる境界の逸脱を完全になくした（抄録）。", "fun": "相関係数や失業率は、決まった範囲の中にしか値をとりません。ところが、株価の変動のような値を想定した普通のモデルで予測すると、ありえない範囲の値が出てしまうことがあります。この研究は、範囲を必ず守る変動のモデルを作りました。データの当たり前の決まりを数式にきちんと組み込んだ点が面白いところです。", "unverified": "ほかの有界な系列での比較の結果は抄録では未確認。"}}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "試合結果から競争均衡の時代をベイズで検出", "title": "When Do Sports Leagues Stop Being Competitive? Bayesian Detection of Competitive-Balance Eras from Match-Level Data", "url": "https://arxiv.org/abs/2611.07335", "authors": "Xinran Li ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Li, X., Xu, M., & Hu, G. (2026). When Do Sports Leagues Stop Being Competitive? Bayesian Detection of Competitive-Balance Eras from Match-Level Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07335", "why": "試合ごとの結果から構造的な戦力差をベイズ推定し、区別できないチームの階層と競争均衡の時代の切り替わりを検出する枠組みを作った。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "試合ごとの結果から、運と区別した構造的な戦力差（競争均衡）をベイズ推定し、区別できないチームの階層と、リーグの競争均衡の時代の切り替わりを検出する枠組みを作った（抄録）。", "p3": "ガウスの補助変数をグラフで融合したℓ1の多面体に射影してチームの能力を求め、その半径で全体の能力差を測る。同点に正の確率を置くので区別できないチームが同じ階層になり、時代が現れ消える適応的なレジームモデルと組み合わせた（抄録）。", "p5": "イングランド・プレミアリーグ25季では、2005/06季から階層化の進んだ状態へ持続的に移り、その後に圧縮した状態に戻ったのは2010/11季だけだった（抄録）。", "fun": "サッカーのリーグで強いチームと弱いチームの差が広がったかは、順位表だけでは運の良し悪しと区別できません。この研究は一試合ごとの結果から本当の実力差を推定し、イングランドのリーグが2005/06シーズンから格差の大きい時代に入ったことを見つけました。優勝争いが接戦でも、リーグ全体の格差は大きいことがありうる点が面白いところです。", "unverified": "ほかのリーグへの適用と、収入の分配など政策との関係の分析は抄録では未確認。"}}, {"id": "pn31", "rank": 31, "field": "統計学", "headline": "テンソルトレイン核機械のランクをデータから推論", "title": "Bayesian Tensor Train Kernel Machines with Automatic Model Complexity Inference", "url": "https://arxiv.org/abs/2611.07129", "authors": "Afra Kilic ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Kilic, A., & Batselier, K. (2026). Bayesian Tensor Train Kernel Machines with Automatic Model Complexity Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07129", "why": "テンソルトレイン型の核機械に階層的な事前分布を置き、ランクと特徴の次元をデータから推論するベイズ版を作った。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "テンソルトレイン（TT）型の核機械に階層的な事前分布を置き、TTのランクと特徴の次元をデータから推論するベイズ版（BTT-KM）を提案した（抄録）。", "p3": "各TTコアに自動関連度決定型の階層事前分布を置き、平均場の変分推論で、決定的な版と同じ計算量のベイズ交互最小二乗法と閉じた形の予測分布を導いた（抄録）。", "p5": "合成データの実験で、過大に設定した初期値から真のTTのランクと特徴の次元を復元できることを示した（抄録）。実データでの性能は抄録に記載がない。", "fun": "大きな表を小さな部品の掛け算で表す「テンソル分解」は計算を軽くする強力な道具ですが、部品の大きさ（ランク）を人が決める必要がありました。この研究は、ベイズ推定で必要な大きさをデータに決めさせ、大きめに始めても余分な部分が自然に消えるようにしました。手で決めていた設定を自動にした点が面白いところです。", "unverified": "実データでの予測性能と計算時間は抄録では未確認。"}}, {"id": "pn32", "rank": 32, "field": "統計学", "headline": "奇ガウス過程でシャープレイ値の推定を高速化", "title": "ShapleyOG: Fast Adaptive Shapley Value Estimation with Odd Gaussian Processes", "url": "https://arxiv.org/abs/2611.07173", "authors": "David Rundel ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Rundel, D., Witter, R. T., Thies, S. M. A. R., Feurer, M., Fumagalli, F., & Bischl, B. (2026). ShapleyOG: Fast Adaptive Shapley Value Estimation with Odd Gaussian Processes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07173", "why": "適応的にコアリションを選ぶシャープレイ値の推定を奇関数のガウス過程で効率化し、計算の負担を下げた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "機械学習の説明に使うシャープレイ値の適応的な推定を、ゲームの奇成分だけに置いたガウス過程で効率化し、精度を保ったまま計算の負担を最大3桁減らした（抄録）。", "p3": "シャープレイ値がゲームの奇成分だけに依存することを使い、対の抽出のもとで奇成分だけのガウス過程が半分の観測で同じ事後分布と選択基準を与えることを示した。代理モデルの再学習もまばらにした（抄録）。", "p5": "多様なゲームで既存のShaplEIGと同等の精度のまま負担を最大3桁減らし、1回の評価が0.1秒かかり数千回の評価で足りる場合には、同じ計算時間で非適応の推定量を上回った（抄録）。", "fun": "AIがなぜその答えを出したかを説明するとき、各入力の貢献度を公平に分ける「シャープレイ値」がよく使われます。ただ正確に計算するには、入力の組み合わせを膨大な数だけ試す必要があります。この研究は、計算に本当に必要なのは奇関数の部分だけだと気づき、必要な観測を半分にしました。高校で習う偶関数・奇関数の考え方が効いている点が面白いところです。", "unverified": "説明の対象とした具体的なモデルとゲームの種類は抄録では未確認。"}}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "支払意思額空間と選好空間は同じモデルの言い換え", "title": "Willingness-to-pay space and preference space: a unified treatment of equivalence, heterogeneity and interpretation", "url": "https://arxiv.org/abs/2611.07698", "authors": "Stephane Hess", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Hess, S. (2026). Willingness-to-pay space and preference space: a unified treatment of equivalence, heterogeneity and interpretation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07698", "why": "選択モデルを支払意思額の空間で推定することが選好の空間の再パラメータ化にすぎない条件を整理し、異質性の扱いによって両者が一致する場合としない場合を明確にした。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "選択モデルを支払意思額（WTP）の空間で推定することは選好の空間の再パラメータ化にすぎず、両者が同じモデルになる単一の条件を軸に、等価性・異質性・解釈を整理した（抄録）。", "p3": "係数が確率的でない場合、決定的な異質性や非線形性がある場合、確率的な異質性（潜在クラスや混合）の場合に分け、2つの空間の尤度・WTPの推定値・標準誤差の関係を明確にした（抄録）。", "p5": "係数が確率的でなければ両空間は同一の尤度・推定値・標準誤差を与える。潜在クラスモデルは両空間で等価だが、ほかの混合は含意される分布が一致する場合のみ等価で、独立の仮定は中立ではない（抄録）。", "fun": "「この商品にいくらまで払うか」を調べる選択モデルには2つの書き方があり、どちらが当てはまりが良いかがよく比べられてきました。この論文は、多くの場合それは同じモデルを別の書き方で表しただけで、違いが出るのは仮定の置き方が違うときだけだと整理しました。見た目の違いと中身の違いを切り分けた点が面白いところです。", "unverified": "実データでの例示の有無は抄録では未確認。"}}, {"id": "pn34", "rank": 34, "field": "経済学", "headline": "ロボタクシーの充電と回送の最適な閾値構造", "title": "Stay, Reposition, or Recharge: Battery-Aware Operation of Robotaxi Fleets", "url": "https://arxiv.org/abs/2611.07699", "authors": "Philipp Af\\`eche (Kamessi) ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Afèche, P., Benjaafar, S., Jiayu, & Zhao. (2026). Stay, Reposition, or Recharge: Battery-Aware Operation of Robotaxi Fleets (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07699", "why": "電動ロボタクシーの運行・回送・待機・充電を連続時間の流体モデルで最適化し、電池残量の閾値による早めの帰庫と回送の判断という単純な構造を導いた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "電動ロボタクシーの運行・空車の回送・待機・充電を、位置と充電量の状態を持つ連続時間の流体モデルで最適化し、充電量の閾値による単純な最適構造を導いた（抄録）。", "p3": "従来の回送モデルにない「早めの帰庫」と「充電を考えた回送」を定式化し、各地点の電池の閾値と、行き先の電池感度という新しい概念で回送先を決める構造を示した。2025年のニューヨーク市のタクシー記録で較正した数値事例で評価した（抄録）。", "p5": "充電を考えない方策との性能差は際限なく大きくなりうることを示し、数値事例で充電を考える制御が大きな利得を生み、単純な閾値型の経験則が完全な解の価値の大半を回復した（抄録）。", "fun": "無人で走るロボタクシーは、客を乗せるだけでなく、電池の残りを見ながら充電に戻るタイミングも決めなければなりません。この研究は、場所ごとに「電池がこれより少なければ戻る」という線を一本引くだけで、ほぼ最適な運行になることを示しました。複雑な問題の答えが意外なほど単純な決まりになる点が面白いところです。", "unverified": "利得の具体的な大きさは抄録では未確認。"}}, {"id": "pn35", "rank": 35, "field": "経済学", "headline": "専門家の証拠収集に払う最適な報酬の設計", "title": "Brave New Data: Pricing Expertise and Discovery", "url": "https://arxiv.org/abs/2611.07278", "authors": "Dihan Zou", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Zou, D. (2026). Brave New Data: Pricing Expertise and Discovery (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07278", "why": "検証可能な証拠を専門家から調達する契約で、開示された証拠にだけ支払う契約が最適であり、収集費用が高いと片方の状態の証拠だけに報酬を払うのが最適になることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "二値の状態を私的に評価し、証拠集めの方向と強さを選ぶ専門家から検証可能な証拠を買う契約で、開示された証拠にだけ支払う契約が最適であることを示した（抄録）。", "p3": "買い手が、発見を促す容易さと、専門家の当初の評価を超えた意思決定への価値とをはかりにかける契約理論のモデルを分析した（抄録）。", "p5": "収集が安いときはどちらの状態の証拠にも等しく報い、失敗も情報になる集中的な探索を促す。費用が上がると、環境が対称でも片方の状態の証拠だけに報いるのが最適になり、支払いは減るが判断の正確さが下がる（抄録）。", "fun": "専門家に調査を頼むとき、「どちらの結論でも証拠を見つけたら同じ額を払う」のが公平に思えます。ところがこの研究は、調査にお金がかかる場合には、片方の結論の証拠にだけ報酬を出すほうが依頼主にとって得になることを示しました。状況が左右対称でも、最適な約束は非対称になりうるという点が面白いところです。", "unverified": "応用例や実証の有無は抄録では未確認。"}}, {"id": "pn36", "rank": 36, "field": "経済学", "headline": "チーム契約では完全な透明性がほぼ最適になる場合", "title": "Transparency in Team Contracts", "url": "https://arxiv.org/abs/2611.07494", "authors": "Paul D\\\"utting ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Dütting, P., Li, Y., Talgam-Cohen, I., & Wu, J. (2026). Transparency in Team Contracts (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07494", "why": "プリンシパルが契約と情報開示を組み合わせる問題で、生産が劣モジュラなら完全な透明性で最適の4/3以内に収まり、優モジュラならいくらでも悪くなりうることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "プリンシパルが契約とベイズ的説得（選択的な情報開示）を組み合わせてチームの努力を引き出す問題で、完全な透明性が生産の性質によってほぼ最適にも、いくらでも悪くもなりうることを示した（抄録）。", "p3": "単純さと最適性の観点から契約と情報開示の同時の設計を分析し、劣モジュラな生産関数の場合の差を抑える技法を開発した（抄録）。", "p5": "生産が劣モジュラなら完全な透明性は最適の4/3以内の近似になり、優モジュラならいくらでも離れうる。技法から、多主体の契約設計の近似比2.311の多項式時間アルゴリズムと、同時問題の3.081近似も得た（抄録）。", "fun": "チームのリーダーは、仕事の成功見込みをメンバーより知っていることがあります。全部正直に伝えるべきか、伏せるべきか。この研究は、メンバーの頑張りが足し算以下にしか効かない仕事なら、正直に全部伝えてもほぼ最善になることを示しました。仕事の性質によって「正直が一番」が成り立つかが変わる点が面白いところです。", "unverified": "実証的な応用は抄録では未確認。"}}, {"id": "pn37", "rank": 37, "field": "経済学", "headline": "複雑さの費用が下がるとメニューは際限なく増える", "title": "Complex Menus in Discriminatory Pricing", "url": "https://arxiv.org/abs/2611.07128", "authors": "Patrick Lahr ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Lahr, P., Niemeyer, A., & Pycia, M. (2026). Complex Menus in Discriminatory Pricing (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07128", "why": "多製品・多属性の価格差別では、複雑さの費用がなければ最適なメニューは一般に無限になり、費用が下がるにつれてメニューが際限なく大きくなることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "多製品・多属性の価格差別では、メニューの複雑さの費用がなければ最適なメニューは一般に無限になり、費用が下がるにつれて際限なく大きくなることを示した（抄録）。", "p3": "独占企業が消費者を選別（スクリーニング）するためにメニューを設計するモデルに複雑さの費用を導入し、多次元の場合の最適なメニューの大きさを分析した（抄録）。", "p5": "複雑さの費用はメニューを小さくしうるが、費用が下がるとメニューは際限なく大きくなる。この結果は1次元のモデルには類例がなく、費用や選好の非線形性にも依存せず、選別の動機だけで多様な製品の差別化が生じる（抄録）。", "fun": "スマホの料金プランやコーヒーのサイズなど、商品の選択肢はどんどん増えているように感じます。この研究は、売り手が客を見分けて値段を変えたい場合、選択肢を作る手間がなくなれば品ぞろえは限りなく増えることを理論で示しました。技術の進歩がメニューの洪水を生む理由を数学で説明した点が面白いところです。", "unverified": "実データでの検証は抄録では未確認。"}}, {"id": "pn38", "rank": 38, "field": "経済学", "headline": "助言の前に公表する調査の最適な設計", "title": "Designing Public Information for Strategic Advice", "url": "https://arxiv.org/abs/2611.07744", "authors": "Vasudha Jain ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Jain, V., & Roy, J. (2026). Designing Public Information for Strategic Advice (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07744", "why": "専門家の助言を受ける前に公表する調査の最適な設計が、コミュニケーションの仕組み（仲介・行動ルールへのコミット・チープトーク）によって変わることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "現地の事情を知る専門家の助言を受ける前にプリンシパルが公表する調査（将来の需要の予測など）の最適な設計が、コミュニケーションの仕組みによって変わることを示した（抄録）。", "p3": "最適な仲介、行動ルールへのコミット、仲介なしのチープトークの3つの仕組みのもとで、利害の対立の期待値を変える公開の調査の価値を比べた（抄録）。", "p5": "最適な仲介では完全な公開が最適になり、行動ルールにコミットする場合は情報なしが好まれうる。チープトークでは最適な調査が中間の領域を飛ばし、完全公開も情報なしも上回りうる（抄録）。", "fun": "上司が部下の意見を聞く前に、会社として市場予測を公表するべきかどうか。この研究は、その答えが話し合いのやり方しだいで正反対になることを示しました。わざと中途半端な情報を出すほうが、全部出すより、まったく出さないより良くなる場合がある点が面白いところです。", "unverified": "財政予測などへの応用の具体的な分析は抄録では未確認。"}}, {"id": "pn39", "rank": 39, "field": "経済学", "headline": "損失回避の競争者への頑健な賞金の設計", "title": "Robust prizes in all-pay contests with loss aversion", "url": "https://arxiv.org/abs/2611.07419", "authors": "Dmitry Ryvkin ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Ryvkin, D., & Wu, Q. (2026). Robust prizes in all-pay contests with loss aversion (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07419", "why": "努力の費用が分からないときの全員支払いコンテストで、最下位以外に等しい賞金を与える構造が頑健に最適であり、損失回避が強いと最下位にも正の賞金を与えるのが最適になることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "努力の費用が分からないまま、損失回避的な参加者の全員支払いコンテスト（負けても努力の費用を払う競争）の賞金を頑健に設計する問題で、最下位以外に等しい賞金を与える構造が最適であることを示した（抄録）。", "p3": "参加者の凸の努力費用を知らないプリンシパルが、総生産性の制約のもとで最悪の場合を最良にする賞金の構造を分析した（抄録）。", "p5": "損失回避が中程度なら最下位の賞金はゼロが最適だが、十分に強いと最下位の賞金は正になり、損失回避とともに増える。強い損失回避のもとでは一部の参加者だけが参加する解になる（抄録）。", "fun": "コンテストの賞金は「1位に大きく」が普通に思えます。ところがこの研究は、負けて損をすることを強く嫌う人たちが相手なら、最下位以外の全員に同じ賞金を出すのが一番確実だと示しました。損失への恐れがとても強い場合は、最下位にも賞金を出すほうがよくなります。人の心理で最適なルールが大きく変わる点が面白いところです。", "unverified": "実験や実データでの検証は抄録では未確認。"}}, {"id": "pn40", "rank": 40, "field": "経済学", "headline": "凸性がわずかに崩れた協力ゲームのコアの条件", "title": "Cores of $3$-distant convex games", "url": "https://arxiv.org/abs/2611.07572", "authors": "Keisuke Bando ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Bando, K., Hirai, T., Imamura, K., & Mizutani, R. (2026). Cores of $3$-distant convex games (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07572", "why": "近い提携の間でだけ凸性が崩れる3-距離凸ゲームのコアが空でない必要十分条件を示し、コアの配分を多項式時間で求める組合せアルゴリズムを作った。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "近い提携の間でだけ凸性が崩れる3-距離凸ゲームについて、コアが空でないための単純な必要十分条件を示し、コアの配分を強多項式時間で求める組合せアルゴリズムを作った（抄録）。", "p3": "凸な協力ゲームではコアが空でなく配分も効率よく作れるが、経済的に自然な局所的な摩擦が凸性を壊しうるため、凸性の破れを近い提携の間に限ったクラスを分析した（抄録）。", "p5": "コアは空になりうるが、空でないための単純な必要十分条件を示し、存在するときは強多項式時間で配分を見つけられる。合併の相乗効果がある寡占や、補完的な投入を持つ共同生産の利益配分に適用した（抄録）。", "fun": "何社かで協力して得た利益を、誰も抜けたくならないように分ける方法を「コア」と呼びます。条件がそろえば必ず見つかりますが、現実の小さなひずみで見つからなくなることがあります。この研究は、ひずみが近い者どうしに限られるなら、分け方が存在するかを簡単に判定し、すばやく計算できることを示しました。公平な分け前の計算を現実に近づけた点が面白いところです。", "unverified": "応用例での数値的な結果は抄録では未確認。"}}, {"id": "pn41", "rank": 41, "field": "社会学", "headline": "500ドルの給付小切手と2026年中間選挙の投票", "title": "Rebates on the Ballot: Exposure to the $500 ACA Checks and Voting Behavior in the 2026 Midterm Elections", "url": "https://doi.org/10.31235/osf.io/kev7w", "authors": "Tejendra Pratap Singh", "venue": "SocArXiv", "date": "2026-11-06", "apa": "Singh, T. P. (2026). Rebates on the Ballot: Exposure to the $500 ACA Checks and Voting Behavior in the 2026 Midterm Elections. https://doi.org/10.31235/osf.io/kev7w", "why": "2026年の医療保険の補助縮小の中で配られた500ドルの小切手への郡ごとの接触度と、中間選挙の投票参加・得票の関係を、補助のない加入者数の内生性に対処して推定した。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "2026年の医療保険の補助縮小の中で配られた500ドルの小切手への郡ごとの接触度が、中間選挙の投票参加と共和党の得票率を高めたと推定した（抄録）。", "p3": "郡別の保険市場の加入・価格の記録、世帯調査の個票、経済指標、郡・選挙ごとの結果を結合し、補助のない加入者数の内生性に対して、税額表の法定の変更などの外生的な変動を使う模擬の操作変数で二段階最小二乗法を行い、ジャックナイフや無作為化推論で頑健性を確かめた（抄録）。", "p5": "小切手への接触は投票率と共和党の二大政党得票率を大きく高め、効果は低所得の郡と少数派の有権者の割合が高い地区で最も大きかった（抄録）。効果の大きさの数値は抄録に記載がない。", "fun": "選挙の直前に配られる給付金は、人々の投票にどれだけ影響するのでしょうか。この研究は、2026年に配られた500ドルの小切手が届いた度合いの地域差を利用し、投票率と共和党の得票が上がったと推定しました。制度の変更で偶然に生じた地域差を実験のように使う工夫で、お金と投票行動の関係に迫った点が面白いところです。", "unverified": "効果の具体的な大きさと地区ごとの違いの詳細は抄録では未確認。"}}, {"id": "pn42", "rank": 42, "field": "社会学", "headline": "被害を記録・集約する基盤で司法へのアクセスを広げる", "title": "The Moving Frontier: How the National Justice Project Is Using Digital Technology to Expand Access to Justice", "url": "https://arxiv.org/abs/2611.08052", "authors": "George Newhouse AM ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "AM, G. N., Ramesh, T., & de Silva, T. (2026). The Moving Frontier: How the National Justice Project Is Using Digital Technology to Expand Access to Justice (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08052", "why": "ナショナル・ジャスティス・プロジェクトを例に、被害の経験を記録し集約する無料のデジタル報告基盤が、司法へのアクセスをどう広げるかを論じた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ナショナル・ジャスティス・プロジェクトの取り組みを例に、人々が被害の経験を記録し、それを集約して権利擁護や制度の説明責任、法改正の証拠にする無料のデジタル報告基盤の可能性を論じた（抄録）。", "p3": "商業的な法務技術が生産性に向かう一方、採算の取れない無料の直接型の技術は見過ごされてきたとして、デジタル報告が周縁化された人々と法制度の間の知識と力の差を縮められるか、制度の責任を問う証拠を集められるかの2つの問いを立てた（抄録）。", "p5": "差別や行政による不当な扱いの経験は監督機関に個人の苦情として退けられがちであり、集約した記録がそれを変えうると論じた（抄録）。実証的な評価の結果は抄録に記載がない。", "fun": "一人が「不当な扱いを受けた」と訴えても、個人の不満として片づけられてしまうことがあります。ところが同じような体験を多くの人が記録して集めると、制度の問題を示す証拠になります。この論文は、そうした記録を集める無料のデジタルの仕組みが、弱い立場の人の声を力に変えうることを論じています。小さな声を束ねる発想が面白いところです。", "unverified": "報告基盤の利用状況や効果のデータは抄録では未確認。"}}, {"id": "pn43", "rank": 43, "field": "経営学", "headline": "似た精度のモデルの使い分けで監査をすり抜けうる", "title": "Adversarial Multiplicity: Cherry-Picked Models and the Limits of Disclosure", "url": "https://arxiv.org/abs/2611.07378", "authors": "Cassandra C. Chou ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Chou, C. C., Huynh, B. Q., Koenecke, A., & Chin, E. T. (2026). Adversarial Multiplicity: Cherry-Picked Models and the Limits of Disclosure (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07378", "why": "同程度の精度のモデルが個別の予測で食い違う性質を悪用すると、柔軟なモデルなら性能をほとんど落とさずに任意の個別予測を反転させ、外部からの監査も通過できることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "同程度の精度のモデルが個々の予測で食い違う「予測の多重性」を悪用すると、柔軟なモデルなら性能をほとんど落とさずに任意の個別の予測を反転させ、外からの監査も通過できることを示した（抄録）。", "p3": "ハイパーパラメータや特徴量の選択を最適化する柔らかい操作と、モデルのパラメータを直接いじる硬い操作を区別し、監査の種類ごとに通過できるかを調べた（抄録）。", "p5": "硬い操作はブラックボックスの監査を通り、柔らかい操作は効果が小さいがコードとデータを見る監査も通りうる。集計値も操作でき、気候変動が山火事に与える推定効果を完全に反転できた（抄録）。", "fun": "精度が同じくらいのAIモデルでも、個々の人への判定はモデルによって食い違うことがあります。この研究は、その食い違いを都合よく選べば、裁判や消費者との争いで特定の人への判定をひっくり返しつつ、監査もすり抜けられることを示しました。精度が同じなら公平とは限らないという警告が面白いところです。", "unverified": "現実の紛争での事例は抄録では未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "トラック走行試験を含む実橋の公開計測データ", "title": "Data Set of Load Tests and Structural Health Monitoring of a Con
