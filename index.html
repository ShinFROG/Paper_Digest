 1.622, "citescore": 9.7, "citescore_year": "2025", "apa": "Zhong, X., Li, J., Liao, F., Jiao, C., & Chen, X. (2026). Multivariate Seismic Fragility Analysis of Curved Rocking Bridges Using Active Learning‐Enhanced Surrogate Modeling. Earthquake Engineering & Structural Dynamics. https://doi.org/10.1002/eqe.70322", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "揺動（ロッキング）橋脚を持つ曲線橋の多変量の地震脆弱性を評価するため、能動学習と自然勾配ブースティングを組み合わせた代理モデル（AL-NGB）を作った（抄録）。", "p2": "ロッキング橋脚の曲線橋は耐震の回復力が高いが、水平方向の曲率、2方向の地震動、非線形のロッキングの相互作用が複雑で、従来の単変量の脆弱性モデルでは不十分である（抄録）。", "p3": "曲線ロッキング橋2000モデルと縮尺した地震動からなるデータで代理モデルを学習・検証し、特徴量の重要度と相関分析で、橋脚、支承、せん断キー、橋台の平均応答を予測する主な地震動の強さの指標（Sd,T1とFI）を選んだ（抄録）。", "p4": "これらの部材の応答を工学的な要求の指標として、部材と系全体の脆弱性を求め、地震動の方向の影響を調べた（抄録）。", "p5": "AL-NGBは学習サンプルの10%だけで全データのモデルと同等の精度に達し、計算費用を大きく減らした（抄録）。系全体の脆弱性は、せん断キーなどの重要な部材に強く支配され、地震動の方向に非常に敏感で、方向を考慮した設計が必要だと示した（抄録）。", "p6": "解釈：結果は数値モデルの集合と縮尺した地震動に基づき、実際の被害記録や実験での検証は抄録に示されていない。精度の具体的な指標値は抄録にない（未確認）。", "fun": "曲がった橋の橋脚をあえて少し「揺り動く」ようにすると、地震の力を逃がして壊れにくくなる。でも、どの向きから揺れが来るかで弱点が変わり、計算は膨大になる。この研究は、AIが計算すべき例を自分で選ぶ工夫で、全体の10%の計算だけで同じ精度を出し、最も弱い部品と揺れの向きの影響を明らかにした。", "unverified": "本文を読んでいないため、橋のモデルの構成、精度の指標値、脆弱性曲線の値は未確認。"}}, {"id": "jr11", "rank": 11, "headline": "会員の口コミは役に立つ度合いを下げる", "title": "The Dual Effects of Membership Programs on Online Review Helpfulness: Indirect Content Pathways and Direct Credibility Signals", "url": "https://doi.org/10.1002/cb.70265", "authors": "Lifeng He ほか", "venue": "Journal of Consumer Behaviour", "date": "2026-10-27", "sjr": 1.667, "citescore": 10.1, "citescore_year": "2025", "apa": "He, L., Li, Y., Liu, Y., Wang, Z., & Zhou, X. (2026). The Dual Effects of Membership Programs on Online Review Helpfulness: Indirect Content Pathways and Direct Credibility Signals. Journal of Consumer Behaviour. https://doi.org/10.1002/cb.70265", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "会員制度がオンラインの口コミの内容と役立ち度にどう影響するかを、JD.comの口コミ153,525件と2つの実験室実験で調べた（抄録）。", "p2": "競争が激しくなる中、ネット小売は顧客の維持と長期の関係のために会員制度に頼るようになっているが、研究は取引上の成果に集中し、消費者が作る内容への影響はあまり分かっていない（抄録）。", "p3": "現場のデータで会員と非会員の口コミの評価点、感情の強さ、言葉の具体性と役立ち度の関係を分析し、実験で経済的・心理的な仕組みと、会員バッジが信頼性の合図として働くかを検証した（抄録）。", "p4": "口コミの内容を通じた間接の経路と、内容を考慮した後に会員であることが持つ直接の経路を分けて推定した（抄録）。", "p5": "会員の口コミは評価点が高く、感情が強く、言葉が具体的で、これらはいずれも役立ち度と負に関連した（抄録）。内容を考慮すると会員の口コミは役立ち度と正に関連し、実験では会員バッジが投稿者の経験と専門性の知覚を高めた。全体では内容を通じた負の関連が上回り、会員の口コミは役立ち度と負に関連した（抄録）。", "p6": "解釈：現場のデータは観察的な関連で、会員になる人の選択による違いが残りうる。1つのプラットフォームでの結果であり、実験の参加者数と効果の大きさは抄録にない（未確認）。", "fun": "ネット通販の有料会員が書いた口コミは信頼できそうに見え、実際に会員のバッジは書き手を「経験豊富そう」に見せていた。ところが153,525件を調べると、会員の口コミは高評価で感情的になりやすく、その分だけ役に立たないと判断され、全体では役立ち度が下がっていた。信頼の印と中身がぶつかる面白い結果だ。", "unverified": "本文を読んでいないため、役立ち度の測り方、実験の設計と人数は未確認。"}}, {"id": "jr12", "rank": 12, "headline": "LLM評価者は採点基準をそれぞれ別様に解釈する", "title": "Systematic Scoring Differences in Large Language Model–Based Clinical Benchmarking Reveal Evaluator-Dependent Divergence: Controlled Evaluation Study", "url": "https://doi.org/10.2196/103962", "authors": "Rasit Dinc ほか", "venue": "JMIR AI", "date": "2026-10-26", "sjr": 1.189, "citescore": 5.0, "citescore_year": "2025", "apa": "Dinc, R., & Ardic, N. (2026). Systematic Scoring Differences in Large Language Model–Based Clinical Benchmarking Reveal Evaluator-Dependent Divergence: Controlled Evaluation Study. Jmir Ai, 5, e103962–e103962. https://doi.org/10.2196/103962", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "臨床医学のLLMベンチマークで、あるAIが別のAIの出力を採点する評価が前提とする「評価者の中立性」と「採点基準の一貫性」を、血管内治療の機器選択と臨床的な振り返りの推論を題材に検証した（抄録）。", "p2": "臨床分野のLLMの評価はLLMによる採点に頼るようになっているが、評価者の中立性と基準の一貫性という前提は臨床分野で実証的に確かめられていなかった（抄録）。", "p3": "PARM（計画・行動・振り返り・記憶）の枠組みに基づき、5つの血管内治療の分野（各8事例）の40の臨床事例と6つの基準（C1〜C6）からなる採点基準を作った。GPT-4o、Claude Sonnet 4.6、Gemini 1.5 Pro、Llama 3.3 70Bを臨床判断の支援として評価し、Claude Sonnet 4.6とGPT-4oが同じ基準で独立に採点した（抄録）。", "p4": "評価者間の信頼性を級内相関係数ICC(2,1)で測り、モデルごとの得点差と採点の振る舞いを分析した。人による評価は、問いが評価者の正確さに移るため意図的に含めなかった（抄録）。", "p5": "ICC(2,1)は0.153（95%信頼区間0.007〜0.295）と低く、得点差はモデルによって+5から−158点まで系統的に異なった（抄録）。評価者1は文脈と独立に臨床能力へ部分点を与える「推論の質」型、評価者2は事例を取り違えた回答にほぼ0点を与える「文脈への忠実さ」型の解釈と整合し、自己を優遇する仮説に反して、両者とも自分以外の高性能モデルを自分より上に置いた（抄録）。", "p6": "著者は、AIの評価者は交換可能な採点の道具ではなく、低い信頼性は無作為な不一致でなく文脈の追跡に失敗するモデルに集中した構造的な不一致だとし、探索的な研究と位置づける（抄録）。解釈：評価者は2つのLLMだけで、人の専門家との比較がないため、どちらの採点が臨床的に妥当かは分からない。", "fun": "AIの医療の知識を、別のAIに採点させる研究が増えている。でもこの研究で2つのAIに同じ答案を採点させると、点数の一致度はとても低かった。一方は「考え方が良ければ部分点」、もう一方は「設問を取り違えたら0点」と、採点の方針がまるで違っていたのだ。採点役のAI選びで順位が変わりうることに注意が要る。", "unverified": "本文を読んでいないため、各基準の定義と、モデルごとの得点の内訳は未確認。"}}, {"id": "jr13", "rank": 13, "headline": "遠隔の複合介入で地域高齢者の認知機能が改善", "title": "Remote multicomponent intervention for older adults with cognitive impairment in community settings: multisite randomised controlled trial", "url": "https://doi.org/10.1093/ageing/afag310", "authors": "Geon Young Jang ほか", "venue": "Age and Ageing", "date": "2026-10-27", "sjr": 2.152, "citescore": 11.2, "citescore_year": "2025", "apa": "Jang, G. Y., Jo, S., Baek, J. Y., Lee, E., Ji, S., Jang, I.-Y., & Park, C. M. (2026). Remote multicomponent intervention for older adults with cognitive impairment in community settings: multisite randomised controlled trial. Age and Ageing, 55(10). https://doi.org/10.1093/ageing/afag310", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "地域に住む認知機能の低下した高齢者に、ビデオ会議による運動と栄養支援を組み合わせた遠隔の介入を行い、その効果を韓国の多施設ランダム化比較試験で検証した（抄録）。", "p2": "地域に住む高齢者では認知機能の低下がよく見られ、地域レベルの介入の現実的な対象である。対面のケアを受けにくい場合に使える、規模を広げやすい介入が求められている（抄録）。", "p3": "2つの保健所で、機能的な自立を保った60〜80歳の認知機能低下のある成人を、ビデオ会議による運動と栄養支援の6か月のプログラムか、通常の健康増進サービスに1:1で無作為に割り付けた（抄録）。", "p4": "主要評価項目は6か月時点の韓国版MoCA（認知機能の検査）の得点の変化で、副次評価項目として6か月と12か月の認知、機能、身体能力、フレイル、抑うつを測った（抄録）。", "p5": "参加者140人（平均75.0歳、60%が女性）で、6か月時点のMoCA-Kの改善は介入群が対照群より2.3点大きく（95%信頼区間1.4〜3.1）、差は12か月時点でも1.1点（0.3〜2.0）続いた（抄録）。介入は両時点で機能状態とフレイルの改善とも関連し、介入に関係する有害事象はなかった（抄録）。", "p6": "著者は、対面のケアを受けにくい場合に、地域とプライマリケアに組み込んだ拡張性のある介入を支持する結果だとする（抄録）。解釈：2施設・140人の比較的小規模な試験で、対照が通常のサービスのため、ビデオ会議での接触の多さそのものの効果と区別しにくい。", "fun": "運動と食事の工夫が、もの忘れの進んだお年寄りの頭の働きを助けるかもしれない。この韓国の研究では、ビデオ通話で体操と栄養の指導を6か月続けると、認知機能の検査の点数が通常のサービスの人より2.3点多く上がり、1年後も差が残った。家から参加できるので、通うのが難しい人にも届けやすい。", "unverified": "本文を読んでいないため、プログラムの頻度と内容、脱落率、副次評価項目の数値は未確認。"}}, {"id": "jr14", "rank": 14, "headline": "キルギスの安全・スマートシティは監視の道具か", "title": "Safe and smart city in Kyrgyzstan: Exporting Chinese digital authoritarianism or enhancing people's safety and well-being?", "url": "https://doi.org/10.1177/20539517261476309", "authors": "Emilie Szwajnoch", "venue": "Big Data and Society", "date": "2026-10-27", "sjr": 2.026, "citescore": 9.7, "citescore_year": "2025", "apa": "Szwajnoch, E. (2026). Safe and smart city in Kyrgyzstan: Exporting Chinese digital authoritarianism or enhancing people’s safety and well-being? Big Data & Society, 13(4). https://doi.org/10.1177/20539517261476309", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "キルギスの首都ビシケクと国全体で進む「安全でスマートな都市（SSC）」の事業、特に監視カメラ網が、政府の監視能力を強め市民の自由を制限する脅威になるか、また中国のデジタル権威主義の輸出と見るべきかを検討した（抄録）。", "p2": "中国の技術輸出などが、その統治モデルを世界に広める動きとして警戒されている（抄録）。", "p3": "監視カメラ網を中心にSSC事業の実施状況を整理し、事業を中国の経済的な事業と見るべきか、中国政府が監視インフラの建設を通じてデジタル権威主義のモデルを広めうるかを検討した（抄録）。", "p4": "監視能力の強化、中国の関与の程度、非自由民主主義の文脈での技術の脅威の捉え方という3つの観点から議論した（抄録）。", "p5": "著者は、セーフシティ（とセーフカントリー）は当局の監視能力を支えうるがそれが中核ではないこと、中国の関与が直接的または大きいと結論づける証拠は不十分で、より柔らかく捉えにくいこと、研究の焦点を個々の事業から制度へ移すべきことを論じた（抄録）。", "p6": "解釈：結論は事業の整理に基づく議論で、どのような資料や聞き取りを使ったかは抄録からは分からない（未確認）。監視の実際の運用や市民への影響の測定は示されていない。", "fun": "街じゅうに監視カメラを置く「安全な街」の計画は、犯罪を減らすのか、それとも人々を見張る道具になるのか。中国の技術が使われたキルギスの事例を調べたこの研究は、「中国が独裁の仕組みを輸出している」という見方には十分な証拠がないと論じ、個々の事業より、カメラを動かす役所の仕組みに目を向けるべきだと提案した。", "unverified": "本文を読んでいないため、使った資料、事業の規模、検討した機関の範囲は未確認。"}}, {"id": "jr15", "rank": 15, "headline": "心理社会的安全風土が医療職の幸福を支える", "title": "Organisational Conditions for Healthcare Workers' Wellbeing: The Roles of Leadership, Social Climate and Psychosocial Safety Climate", "url": "https://doi.org/10.1111/jan.70804", "authors": "Huijuan Dong ほか", "venue": "Journal of Advanced Nursing", "date": "2026-10-27", "sjr": 1.314, "citescore": 7.0, "citescore_year": "2025", "apa": "Dong, H., Shang, S., Gifkins, J., Wilkinson, A., Chan, X. W., & Brough, P. (2026). Organisational Conditions for Healthcare Workers’ Wellbeing: The Roles of Leadership, Social Climate and Psychosocial Safety Climate. Journal of Advanced Nursing. https://doi.org/10.1111/jan.70804", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "サーバント・リーダーシップ、健康を促すリーダーシップ、職場の社会的な風土、心理社会的安全風土、労働条件、医療従事者の幸福を結ぶ包括的なモデルを検証した（抄録）。", "p2": "背景：心理社会的安全風土とは、働く人の心理的な健康と安全を組織がどれだけ重視しているかについての、職場で共有された認識を指す。", "p3": "2024〜2025年に調査に回答した医療従事者1563人の横断的なデータで、仮説の関係を構造方程式モデリングで検証し、STROBEのチェックリストに従って報告した（抄録）。", "p4": "リーダーシップと社会的な風土から心理社会的安全風土へ、そこから仕事の要求と資源（裁量、上司と同僚の支援）へ、さらに心理的な負担、離職の意向、職務満足、ワーク・エンゲージメントへの経路を推定した（抄録）。", "p5": "2つのリーダーシップと職場の社会的な風土は心理社会的安全風土の高さと正に関連し、安全風土が高いほど認知的な仕事の要求が低く仕事の資源が多く、これらは心理的な負担と離職の意向の低さ、満足とエンゲージメントの高さと関連した（抄録）。予想に反して、認知的な仕事の要求はエンゲージメントと正に関連した（抄録）。", "p6": "著者は、支援的なリーダーシップと良い社会的な風土が安全風土の重要な相関要因で、ある種の仕事の要求は医療現場で負担と同時に動機づけの役割も果たしうるとする（抄録）。解釈：横断的な調査のため因果の向きは特定できず、施設や職種の構成は抄録にない（未確認）。", "fun": "病院で働く人が元気に働き続けるには、何が大切なのだろうか。1563人の医療従事者を調べると、部下を支える上司や助け合う雰囲気のある職場ほど「心の健康を大事にする職場だ」という感覚が強く、働きやすさや満足度も高かった。頭を使う難しい仕事が、むしろやる気につながっていた点も面白い。", "unverified": "本文を読んでいないため、対象の国・施設・職種と、経路係数の値は未確認。"}}, {"id": "jr16", "rank": 16, "headline": "AIの誤答が接客品質を下げ人の回復が補う", "title": "The impact of AI hallucination on the chatbot service quality in e-commerce: the moderating role of human agent based service recovery", "url": "https://doi.org/10.3389/fpsyg.2026.1870991", "authors": "Xi Chen ほか", "venue": "Frontiers in Psychology", "date": "2026-10-27", "citescore": 7.0, "citescore_year": "2025", "apa": "Chen, X., Liu, J., Chen, Q., & Li, L. (2026). The impact of AI hallucination on the chatbot service quality in e-commerce: the moderating role of human agent based service recovery. Frontiers in Psychology, 17. https://doi.org/10.3389/fpsyg.2026.1870991", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefなどに登録された抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "ECのチャットボットでAIのハルシネーション（事実と異なる応答）が知覚されるサービス品質を下げる仕組みと、人間の担当者による回復策の効果を、2つのシナリオ実験で調べた（抄録）。", "p3": "事前に書いた応答を使う台本型のチャットボット（LLMの生成は使わない）で、模擬的なハルシネーションの程度と人間の担当者による回復の有無を2×2の参加者間計画で操作した。研究1は236人、研究2は364人だった（抄録）。", "p5": "ハルシネーションの知覚が高いほど、認知的不協和と技術的な苛立ちを通じてサービス品質の評価が下がった（抄録）。人間の担当者による回復は苛立ちを和らげたが、認知的不協和は元に戻しにくかった（抄録）。", "fun": "AIの店員がもっともらしい間違いを言うと、客はがっかりする。この研究は、AIの間違いのあとに人間の店員が対応すると、イライラは収まるが「話が違う」というもやもやは残りやすいことを、2つの実験で示した。人とAIの役割分担を考えるヒントになる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr17", "rank": 17, "headline": "不祥事後の報告書とSNSの開示は切り離される", "title": "Decoupling Sustainability Reporting and Social Media Communication After a Sustainability Scandal: Strategic Silence, Selective Disclosure and Legitimacy Stabilisation", "url": "https://doi.org/10.1002/bse.71775", "authors": "Alice Pennesi ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-27", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Pennesi, A., Guidi, M., & Giuliani, M. (2026). Decoupling Sustainability Reporting and Social Media Communication After a Sustainability Scandal: Strategic Silence, Selective Disclosure and Legitimacy Stabilisation. Business Strategy and the Environment. https://doi.org/10.1002/bse.71775", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "サステナビリティの不祥事の前後で、企業の正式なサステナビリティ報告とソーシャルメディアでの発信がどう分かれていくかを、イタリアの有機食肉メーカーの事例で調べた（抄録）。", "p3": "2021〜2024年について、サステナビリティ報告、Facebookの投稿と利害関係者の反応、規制・背景の文書、経済指標を、出来事を中心とした質的な縦断の単一事例として分析した（抄録）。", "p5": "正式な報告は続いて拡充された一方、Facebookでのサステナビリティの発信は、投稿全体は続いていたのに不祥事後に大きく減った（抄録）。利害関係者の反応は不祥事中に批判的になって2024年に落ち着き、著者らはこれを活発な発信の中で特定の話題を避ける「戦略的沈黙」として概念化した（抄録）。", "fun": "不祥事を起こした会社は、何を語り、何を語らなくなるのか。イタリアの食肉メーカーを調べると、分厚い報告書では環境への取り組みを書き続けたのに、SNSではその話題だけをぴたりと出さなくなっていた。黙ることも一つの戦略だという見方が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr18", "rank": 18, "headline": "現代奴隷を調べる社会監査人の労働条件", "title": "Accounting for the working conditions of social compliance auditors investigating modern slavery in supply chains", "url": "https://doi.org/10.1108/aaaj-07-2025-8130", "authors": "Pavel Castka ほか", "venue": "Accounting, Auditing and Accountability Journal", "date": "2026-10-27", "sjr": 1.574, "apa": "Castka, P., Michelson, G., Zhao, X., & Searcy, C. (2026). Accounting for the working conditions of social compliance auditors investigating modern slavery in supply chains. Accounting, Auditing & Accountability Journal, 1–30. https://doi.org/10.1108/aaaj-07-2025-8130", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "サプライチェーンの現代奴隷を調べる社会的コンプライアンス監査人の労働条件を、32件の面接から明らかにした（抄録）。", "p3": "監査人、認証機関、NGO、認定機関など監査に関わる人々への32件の面接を、労働過程論と複数の依頼主を持つ雇用ネットワークの観点から分析した（抄録）。", "p5": "監査は遠隔の、しばしば敵対的な現場での資源の乏しい激務で、監査人は身体的な危害や、不利な指摘を操作・抑圧しようとする威圧に直面していた（抄録）。それでも監査人は小さな抵抗、安全のための適応、非公式な道具や関係の活用（「責任の緩衝材」）で調査の誠実さを保とうとしていた（抄録）。", "fun": "外国の工場で強制労働がないかを調べる監査人は、企業の評判を守る最前線にいる。ところがこの研究によると、監査人自身が脅されたり、暴力を受けたり、都合の悪い報告を握りつぶされそうになったりしていた。監視する側の働く環境にも目を向ける必要があることが分かる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr19", "rank": 19, "headline": "監査委員会の特性と気候関連開示", "title": "Do Audit Committee Characteristics Influence Climate‐Related Disclosure? Evidence From Italian Listed Firms", "url": "https://doi.org/10.1002/bse.71788", "authors": "Giovanna Crocco ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-27", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Crocco, G., Ferraro, L., De Luca, E., & Napoli, F. (2026). Do Audit Committee Characteristics Influence Climate‐Related Disclosure? Evidence From Italian Listed Firms. Business Strategy and the Environment. https://doi.org/10.1002/bse.71788", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "監査委員会の特性が気候関連の開示の程度を説明するかを、イタリアの上場企業211社で調べた（抄録）。", "p3": "TCFDに沿った13項目の気候開示指数を2024年の非財務報告から手作業でコード化し、エージェンシー理論と利害関係者理論に基づいて階層的回帰で分析した（抄録）。", "p5": "監査委員会の女性比率と会議の頻度は開示の程度と正に有意に関連したが、規模と独立性は関連せず、環境に敏感な業種の企業は開示が多かった（抄録）。トービット回帰や地域の統制、エントロピー・バランシングでも結果は保たれた（抄録）。", "fun": "会社が気候変動への備えをどこまで公開するかは、取締役会だけでなく、帳簿をチェックする「監査委員会」のあり方でも変わるらしい。イタリアの211社を調べると、女性が多く、よく集まる委員会のある会社ほど詳しく開示していた。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr20", "rank": 20, "headline": "CSR報告は財務報告の質とどう関わるか", "title": "CSR Reporting as Strategic Communication: Financial Reporting Quality and Its Stakeholder Communication Implications", "url": "https://doi.org/10.1002/csr.71090", "authors": "Raziyeh Salehi ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-27", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "Salehi, R., Amanollahnejad, A., & Izadi, J. (2026). CSR Reporting as Strategic Communication: Financial Reporting Quality and Its Stakeholder Communication Implications. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71090", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "企業の社会的責任（CSR）と財務報告の質の関係と、報告の質の向上がコミュニケーションに持つ意味を、混合研究法で調べた（抄録）。", "p3": "第1段階でロンドン証券取引所の上場企業に勤める財務の専門家150人の調査をPLS-SEMで分析し、第2段階で上場企業32社の報告と開示を統合マーケティング・コミュニケーションの理論から内容分析した（抄録）。", "p5": "CSRは財務報告の目的適合性、忠実な表現、理解可能性、比較可能性と正に有意に関連した（抄録）。質的分析では透明性の合図、情報の簡素化、比較優位の伝達など5つのテーマが見いだされたが、コミュニケーション上の成果は直接測っていない探索的な示唆と位置づけた（抄録）。", "fun": "社会貢献に熱心な会社は、お金の報告も分かりやすく正確なのだろうか。この研究では、イギリスの上場企業の財務の専門家150人への調査で、両者がそろって高い傾向が見られた。報告の質そのものが、会社の信頼を伝える手段になるという見方だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr21", "rank": 21, "headline": "都市計画の生成AIと人の共創の枠組み", "title": "Generative AI in Urban Planning: A Systematic Review and Human–AI Co-Creation Framework for Responsible Urban Futures", "url": "https://doi.org/10.1177/08854122261488063", "authors": "Farshad Shariatpour ほか", "venue": "Journal of Planning Literature", "date": "2026-10-27", "sjr": 1.963, "citescore": 11.0, "citescore_year": "2025", "apa": "Shariatpour, F., Shakibamanesh, A., & Rahbar, M. (2026). Generative AI in Urban Planning: A Systematic Review and Human–AI Co-Creation Framework for Responsible Urban Futures. Journal of Planning Literature. https://doi.org/10.1177/08854122261488063", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "都市計画での生成AIの利用を体系的にレビューし、人間とAIの共創の枠組みを示した（抄録）。", "p3": "PRISMAに従い、2015〜2025年の査読論文と一部のプレプリント計63件を統合し、6つのモデル群、5つの応用分野、5つの人間の役割（起動、制約、共創、評価、実装）を整理した（抄録）。", "p5": "問題の設定と制約の設定には重点が置かれていたが、反復的な共創、人間中心の評価、ガバナンス、実装の証拠は限られていた（抄録）。この偏りを解釈するため、作業の全過程で人の判断と制度的な説明責任を保つ「役割を完備したAI都市論」を提案した（抄録）。", "fun": "AIは街の土地利用の案や交通の予測、まちの姿の絵を次々に作れる。でも63件の研究を調べると、AIに条件を与えるところまではよく研究されている一方、住民と一緒に案を練り直したり、実際の街づくりに使ったりする段階の研究はまだ少なかった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr22", "rank": 22, "headline": "人種・階級・空間が再ゾーニングの受け止めを分ける", "title": "Framing Struggles: How Race, Class, and Space Shape Perceptions of Rezonings among Residents and State Actors", "url": "https://doi.org/10.1177/15356841261496211", "authors": "Viktor Bensus", "venue": "City and Community", "date": "2026-10-27", "sjr": 1.181, "citescore": 6.3, "citescore_year": "2025", "apa": "Bensus, V. (2026). Framing Struggles: How Race, Class, and Space Shape Perceptions of Rezonings among Residents and State Actors. City & Community. https://doi.org/10.1177/15356841261496211", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "住宅の手頃さへの対策としてよく使われる用途地域の変更（リゾーニング）をめぐる政治的な対立を、ニューヨーク市の2つの地区で比べた（抄録）。", "p3": "2014〜2021年の参加型のリゾーニングの過程について、詳細な面接、資料調査、オンライン公聴会の観察を行い、階級と人種の構成が異なる地区の市職員、地域の活動家、住民の語りを分析した（抄録）。", "p5": "場所に根ざした政策は空間・社会・時間の3つの緊張を生み、推進派は技術官僚的な枠組み、反対派はポピュリスト的な枠組みでそれを解消しようとした（抄録）。正義と地域の変化の枠組みは両地区で使われたが、地区の社会空間的な特徴によって使われ方が大きく異なった（抄録）。", "fun": "「家賃を下げるため、もっと高い建物を建てられるようにしよう」という市の計画に、住民は賛成も反対もする。この研究はニューヨークの2つの地区を比べ、同じ種類の計画でも、立場や地区の性格によって「何のための計画か」の語られ方が大きく違うことを示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr23", "rank": 23, "headline": "米国の小都市の中心業務地区の境界データ", "title": "A national dataset of downtown business district boundaries for pre-automobile U.S. cities and towns", "url": "https://doi.org/10.1177/23998083261500874", "authors": "Andrew J. Van Leuven", "venue": "Environment and Planning B: Urban Analytics and City Science", "date": "2026-10-26", "sjr": 1.018, "citescore": 7.5, "citescore_year": "2025", "apa": "Van Leuven, A. J. (2026). A national dataset of downtown business district boundaries for pre-automobile U.S. cities and towns. Environment and Planning B: Urban Analytics and City Science. https://doi.org/10.1177/23998083261500874", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "米国の中小の市や町について、自動車時代以前からある中心商業地区の境界を全国で一貫した方法で定めた公開データを作った（抄録）。", "p3": "歴史的な国勢調査記録、現在の人口、都市圏の分類で対象地を選び、Overture Maps Foundationの施設データにカーネル密度推定を適用して商業施設が最も集中する地区を中心部とする、再現可能なRの手順で作った（抄録）。", "p5": "本土47州にわたる6,551の中心部のポリゴンを作り、検討した2州ではメインストリート事業の地区を高い割合で覆った（抄録）。データはHarvard DataverseにCC0 1.0で、Rのコードは全てGitHubで公開された（抄録）。", "fun": "「町の中心はどこまでか」には、意外にも決まった地図がない。この研究は、お店や施設が集まる場所をコンピュータで見つけ、アメリカの6,551の町の中心部の範囲を同じ方法で描き、誰でも使えるように公開した。古い町の商店街の再生を調べる土台になる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr24", "rank": 24, "headline": "低交通量時の救急拠点の配置と担当割当", "title": "Location-Allocation of Emergency Service Systems in Light Traffic", "url": "https://doi.org/10.1287/opre.2024.1272", "authors": "Xin Wang ほか", "venue": "Operations Research", "date": "2026-10-27", "sjr": 3.759, "citescore": 6.4, "citescore_year": "2025", "apa": "Wang, X., Liu, W., Tang, L. C., & Ye, Z. (2026). Location-Allocation of Emergency Service Systems in Light Traffic. Operations Research. https://doi.org/10.1287/opre.2024.1272", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "救助隊をどこに置き、どの地域を担当させるかを決める問題で、呼び出しの少ない状況（軽負荷）の漸近解析を使い、待ちによる損失を明示的に扱う最適化モデルを作った（抄録）。", "p3": "呼び出しの到着率が0に近づくときの待ち行列の極限の振る舞いを、待たされる呼び出しの損失の明示的な近似に変え、解の質の理論保証を持つ混合整数線形計画として定式化した（抄録）。", "p5": "シンガポールのエレベーター閉じ込め救助のデータを使ったシミュレーションで、最適化した計画は現行の配置に比べて年間の予測遅延救助を約70%減らした（抄録）。", "fun": "エレベーターに閉じ込められたとき、救助隊がすぐ来てくれるかは、隊がどこに待機しているかで決まる。この研究は、呼び出しが少ないときの数学的な性質を使って配置を計算し、シンガポールのデータで遅れる救助を約70%減らせることを示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr25", "rank": 25, "headline": "環境に配慮した仕事の特性が行動を促す", "title": "How Green Work Characteristics Drive Pro‐Environmental Behavior: The Mediating Role of Green Self‐Efficacy Among Hotel Employees", "url": "https://doi.org/10.1002/bse.71751", "authors": "Charoenchai Agmapisarn ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-26", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Agmapisarn, C., Nawakitphaitoon, K., & Khetjenkarn, S. (2026). How Green Work Characteristics Drive Pro‐Environmental Behavior: The Mediating Role of Green Self‐Efficacy Among Hotel Employees. Business Strategy and the Environment. https://doi.org/10.1002/bse.71751", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "ホテル従業員の環境配慮行動に仕事の環境面の特性がどう影響するかと、環境面の自己効力感の媒介の役割を調べた（抄録）。", "p3": "仕事の要求–資源モデルと社会的認知理論に基づき、環境面の仕事の要求、裁量、上司の支援、同僚の支援を特性とし、ホテル従業員374人から1か月の間隔で2回集めたデータを一貫したPLS-SEMで分析した（抄録）。", "p5": "環境面の裁量と同僚の支援は自己効力感を高めたが、要求と上司の支援は有意な効果がなかった（抄録）。自己効力感は環境配慮行動を強く予測し、裁量と同僚の支援の効果を媒介した（抄録）。", "fun": "ホテルで働く人が節電やごみの分別に熱心になるには、何が効くのか。374人を調べると、上司の応援や求められる仕事の量より、自分で工夫できる裁量と同僚の後押しが「自分にもできる」という自信を育て、行動につながっていた。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr26", "rank": 26, "headline": "職場で経験する持続可能性とwell-being", "title": "Work as a Lever for Sustainability Transitions: Measuring Experienced Workplace Sustainability and Its Link to Agency and Well‐Being", "url": "https://doi.org/10.1002/csr.71030", "authors": "Jorrit Holst ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-27", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "Holst, J., Schlieszus, A.-K., Brock, A., & Grund, J. (2026). Work as a Lever for Sustainability Transitions: Measuring Experienced Workplace Sustainability and Its Link to Agency and Well‐Being. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71030", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "職場で経験されるサステナビリティを測る尺度を検証し、ドイツの代表標本で、その経験と主観的な幸福や持続可能性に関わる主体性との関連を調べた（抄録）。", "p3": "全機関アプローチ（WIA）の検証済みの尺度を職場に移した6項目のWIA-Work-Scaleを作り、ドイツの代表標本1747人で検証・適用した（抄録）。", "p5": "職場でサステナビリティをより多く経験する人ほど主観的な幸福が高く、仕事以外の場でも持続可能性に関わる主体性の感覚が強かった（抄録）。著者らは職場環境と組織開発への示唆を論じた（抄録）。", "fun": "働く場所が環境や社会に配慮していると感じる人は、毎日の満足感も高いのだろうか。ドイツの1747人を調べると、そう感じる人ほど幸福度が高く、職場の外でも「自分も社会を変えられる」と感じていた。職場が社会を変える入口になるという見方だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr27", "rank": 27, "headline": "起業での生成AI利用の力づけと罠", "title": "Generative AI use in entrepreneurship: An integrative review and the Empowerment–Entrapment Framework", "url": "https://doi.org/10.1002/sej.70050", "authors": "Jackson G. Lu ほか", "venue": "Strategic Entrepreneurship Journal", "date": "2026-10-27", "sjr": 3.821, "citescore": 11.4, "citescore_year": "2025", "apa": "Lu, J. G., Zhao, G. G., & Zheng, A. M. (2026). Generative AI use in entrepreneurship: An integrative review and the Empowerment–Entrapment Framework. Strategic Entrepreneurship Journal. https://doi.org/10.1002/sej.70050", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "起業での生成AIの利用について、起業家を中心に据えた統合的なレビューを行い、生成AIの利点と代償を整理する「力づけと罠」の枠組みを提案した（抄録）。", "p3": "機会の認識と着想、評価と決断、資源の結集、事業の立ち上げと成長の4段階ごとに生成AIの影響をまとめ、効果の背後にある生成AIの特徴と、専門性や使い方、個人の特性などの境界条件を検討した（抄録）。", "p5": "生成AIは事業案の質を高めうる一方でハルシネーションや偏りを生み、自己効力感を高める一方で過信を強め、生産性を高める一方で認知的な関与や学習、記憶を損ないうるといったトレードオフを示した（抄録）。起業家は出力を検証し、重要な判断は人に残すべきだとした（抄録）。", "fun": "AIを使えば、起業のアイデア出しも資料作りも一人でこなせる。でもこの論文によると、AIに頼りすぎると自信過剰になったり、自分で考えて学ぶ力が落ちたりするおそれもある。使うかどうかより、どう使うかが大事だという結論だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr28", "rank": 28, "headline": "地方病院の予測AIの採用と評価", "title": "Rural Hospital AI Use and Evaluation", "url": "https://doi.org/10.1111/jrh.70237", "authors": "Josiah A. Cruikshank ほか", "venue": "Journal of Rural Health", "date": "2026-10-27", "sjr": 1.411, "citescore": 5.8, "citescore_year": "2025", "apa": "Cruikshank, J. A., Whitacre, B. E., & Davis, A. F. (2026). Rural Hospital AI Use and Evaluation. The Journal of Rural Health, 42(4). https://doi.org/10.1111/jrh.70237", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "2023年の米国の病院で、予測AIの導入・利用・評価に都市と農村の差があるかと、農村の病院で導入や評価に関連する特性を調べた（抄録）。", "p3": "予測モデルの利用を初めて尋ねた米国病院協会の2023年の情報技術補足調査を使い、調整済みWald検定で都市と農村を比べ、農村の病院だけで重み付きのロジスティック回帰を行った（抄録）。", "p5": "農村の病院の予測AIの導入率は都市より大幅に低く（51%対81%）、導入した病院でも正確さ（59%対65%）と偏り（39%対47%）を評価する割合が低く、電子カルテの業者が作ったAIに頼る傾向が強かった（抄録）。病院グループへの所属と良好な財務は導入と正に、重要アクセス病院と営利であることは負に関連した（抄録）。", "fun": "病院でAIが予測に使われるのは、もう珍しくない。でもアメリカの農村の病院でAIを使っている割合は51%で、都市の81%より大きく低かった。AIが正しく働いているかを確かめる余裕も少なく、地域による医療の差がAIでも生まれつつある。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr29", "rank": 29, "headline": "訪問看護ステーション選びと望む働き方の実現", "title": "Decision-making structure in selecting home-visit nursing stations and its association with achievement of preferred work style: a nationwide cross-sectional study in Japan", "url": "https://doi.org/10.1186/s12912-026-05585-w", "authors": "Keiko Ono-Ogawa ほか", "venue": "BMC Nursing", "date": "2026-10-27", "sjr": 1.368, "citescore": 5.3, "citescore_year": "2025", "apa": "Ono-Ogawa, K., Kobayashi, M., & Imamura, T. (2026). Decision-making structure in selecting home-visit nursing stations and its association with achievement of preferred work style: a nationwide cross-sectional study in Japan. BMC Nursing. https://doi.org/10.1186/s12912-026-05585-w", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "日本の訪問看護師が訪問看護ステーションを選ぶときの動機の構造と、希望する働き方の実現との関連を、全国オンライン調査で調べた（抄録）。", "p3": "2025年の全国横断調査に回答した看護師2,046人のうち、訪問看護ステーションで働く95人を分析し、職場選びの重視度を探索的因子分析にかけ、希望する働き方の実現との関連をロジスティック回帰で調べた（抄録）。", "p5": "「専門職としての成長と地域志向の実践」と「仕事と生活の統合」の2因子が得られ、内的一貫性は高かった（α=0.902と0.818）（抄録）。育児・介護休暇の取りやすさなどとの関連は18比較のボンフェローニ補正後は有意でなく、多変量の結果も不安定で、著者らは仮説を生む探索的な結果と位置づけた（抄録）。", "fun": "高齢化が進む日本では、家を訪ねてケアする訪問看護師が欠かせない。全国の看護師2,046人の回答から訪問看護で働く95人を調べると、職場選びの理由は「成長と地域」と「仕事と生活の両立」の2つにまとまった。人数が少ないため、結論はまだ仮のものだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "家族予防介入の家庭練習を促す要因", "title": "Caregiver-Reported Promoters of Home Practice in a Family-Based Preventive Intervention", "url": "https://doi.org/10.1007/s11121-026-01991-3", "authors": "Carlie J. Sloan ほか", "venue": "Prevention Science", "date": "2026-10-27", "sjr": 1.477, "citescore": 7.0, "citescore_year": "2025", "apa": "Sloan, C. J., Kim, J. J., Kuckertz, M., Rosenthal, L. H., & Gonzales, N. A. (2026). Caregiver-Reported Promoters of Home Practice in a Family-Based Preventive Intervention. Prevention Science. https://doi.org/10.1007/s11121-026-01991-3", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "子どもの心と行動の問題を予防する家族向けプログラムで、保護者が家で技能を練習する（家庭練習）のを助けるものは何かを、保護者の自由記述から調べた（抄録）。", "p3": "家族向け予防介入のランダム化比較試験に参加した母親225人と父親80人の記述をCOM-Bモデルに基づいて「促進要因」としてコード化し、以前の研究で報告された家庭練習の困難との対応を多水準ロジスティック回帰で調べた（抄録）。", "p5": "最も多い促進要因は、自分や子どもの行動・考え・感情への気づき、練習を増やすこと、計画に関する工夫だった（抄録）。日々のストレスを挙げた保護者は計画を、プログラムへの考えに関する困難を挙げた保護者は気づきを挙げやすく、スペイン語で受講した保護者は気づきを多く挙げた（抄録）。", "fun": "子育てのプログラムで学んだことも、家で続けられなければ効果は薄い。母親225人と父親80人に「何があれば家で練習できるか」を尋ねると、外からの助けより、自分や子どもの気持ちに気づくことや、前もって計画することが多く挙がった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr31", "rank": 31, "headline": "日常の対人過程と瞬間的な孤独", "title": "Interpersonal processes in daily life: Within-person dynamics of experiential avoidance, responsiveness, vulnerability, and momentary loneliness", "url": "https://doi.org/10.1521/jscp.2026.45.5.492", "authors": "Daniel W. M. Maitland ほか", "venue": "Journal of Social and Clinical Psychology", "date": "2026-10-27", "citescore": 1.4, "citescore_year": "2025", "apa": "Maitland, D. W. M., Walsh, B. E., & Malvini, W. (2026). Interpersonal processes in daily life: Within-person dynamics of experiential avoidance, responsiveness, vulnerability, and momentary loneliness. Journal of Social and Clinical Psychology, 45(5), 492–524. https://doi.org/10.1521/jscp.2026.45.5.492", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefなどに登録された抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "孤独感の瞬間ごとの決定要因を、体験の回避と親密さの対人過程モデルに基づいて、生態学的瞬間評価で調べた（抄録）。", "p3": "参加者31人が最長14日間、1日3回の調査（計1201回分）に答え、体験の回避、弱さの開示と応答性、つながりの感覚、孤独感、心の健康を測った（抄録）。", "p5": "交流の量と質の両方が瞬間の孤独感と関連し、つながりの感覚の方が交流の頻度より強く関連した（抄録）。つながりの感覚は弱さの開示より相手に応え・応えてもらう応答性で最もよく予測され、時間差の効果はほぼ有意でなく、心の健康がその後の孤独感を予測したが逆はなかった（抄録）。", "fun": "寂しさは、人と会う回数だけで決まるのだろうか。31人に1日3回、最長14日間気持ちを記録してもらうと、会った回数より「分かってもらえた」と感じるつながりの方が寂しさと強く関係していた。量より質という、身近な実感を裏づける結果だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr32", "rank": 32, "headline": "一人でいたい欲求の尺度開発と妥当性", "title": "Measuring the need for solitude in emerging adulthood: Development and validation of the Need for Solitude (NFS) scale", "url": "https://doi.org/10.1016/j.actpsy.2026.108029", "authors": "Liza Keessen ほか", "venue": "Acta Psychologica", "date": "2026-10-26", "sjr": 0.918, "citescore": 3.4, "citescore_year": "2025", "apa": "Keessen, L., Piotrowski, J. T., Sumter, S. R., & van Oosten, J. M. F. (2026). Measuring the need for solitude in emerging adulthood: Development and validation of the Need for Solitude (NFS) scale. Acta Psychologica, 271, 108029. https://doi.org/10.1016/j.actpsy.2026.108029", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": false, "short": true, "p1": "デジタル技術で常に人とつながれる時代に、成人形成期（18〜25歳）の一人になりたい欲求の強さを測る自己報告尺度NFSを開発・検証した（抄録）。", "p3": "事前登録した2つのオンライン調査で、研究1ではオランダの学生で14項目の1次元構造を定め（224人）、妥当性と信頼性を確かめた（303人）。研究2ではオランダと英国の一般の若者841人で性質を再現し、測定不変性を確かめた（抄録）。", "p5": "NFSは孤独感などの関連する特性と重なりつつも異なる、測定可能な特性であることが示された（抄録）。", "fun": "スマホでいつでも誰かとつながれる今、「一人になりたい」気持ちの強さは人によって違う。この研究は、その強さを14の質問で測る物差しを作り、オランダとイギリスの若者で確かめた。一人でいたい気持ちは寂しさとは別物だという点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr33", "rank": 33, "headline": "黒人の接客従業員の有能さ評価と逆境の推測", "title": "Inferring Struggle, Judging Strength: How Inferred Adversity and Sympathy Shape Competence Evaluations of Black Frontline Employees", "url": "https://doi.org/10.1177/01461672261494231", "authors": "Shahin Sharifi", "venue": "Personality and Social Psychology Bulletin", "date": "2026-10-27", "sjr": 2.086, "citescore": 9.9, "citescore_year": "2025", "apa": "Sharifi, S. (2026). Inferring Struggle, Judging Strength: How Inferred Adversity and Sympathy Shape Competence Evaluations of Black Frontline Employees. Personality and Social Psychology Bulletin. https://doi.org/10.1177/01461672261494231", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "人種に関する推測が第三者による従業員の有能さの評価にどう影響するかを、4つの実験で調べた（抄録）。", "p3": "黒人の客が関わるサービスの失敗場面で、白人の米国人観察者に黒人と白人の第一線の従業員を評価させ、推測される逆境と同情の役割を検証した（抄録）。", "p5": "観察者は黒人の従業員を、条件が同じ白人の従業員より有能と判断し、これは人種が逆境の推測を、逆境が同情を呼び、同情が有能さの判断を高める直列の過程と整合した（抄録）。ぎこちない振る舞いは差を弱め、構造的な機会の情報は白人の従業員への同情と有能さの判断を特に高めて差を縮めた（抄録）。", "fun": "失敗した店員を見て「この人は苦労してきたのだろう」と想像すると、評価が甘くなることがある。この研究は、アメリカの観察者が黒人の店員をより有能と判断する傾向を見つけ、その背景に苦労の想像と同情があることを4つの実験で示した。好意的に見えても人種に基づく判断だという点で複雑な結果だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr34", "rank": 34, "headline": "信頼の低い時代に実店舗の支店が安心を与える", "title": "The branch is strong when the tree is healthy: symbolic reassurance in retail banking in a post-trust economy", "url": "https://doi.org/10.1108/ijbm-08-2025-0678", "authors": "Lavy Khoushinsky ほか", "venue": "International Journal of Bank Marketing", "date": "2026-10-26", "citescore": 15.3, "citescore_year": "2025", "apa": "Khoushinsky, L., Margulis, A., Boeck, H., & Laroche, M. (2026). The branch is strong when the tree is healthy: symbolic reassurance in retail banking in a post-trust economy. International Journal of Bank Marketing, 1–23. https://doi.org/10.1108/ijbm-08-2025-0678", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": false, "short": true, "p1": "信頼が揺らいだ経済で実店舗の銀行支店が持つ戦略的な役割を「象徴的な安心」という概念で理論化し、どの顧客体験の次元が安心の合図を忠誠と口コミに変えるかを検証した（抄録）。", "p3": "3つの研究からなる混合研究法で、フォーカスグループ（20人）、シナリオ実験（298人）、Googleの口コミ363,184件のトピックモデルと機械学習を組み合わせた（抄録）。", "p5": "支店は費用がかかり目に見え長続きする合図として働き、周囲の環境（SURROUND）、人との交流（SOCIALIZE）、地域への根づき（SITUATE）が最も重要な次元だった（抄録）。革新的な体験は機能面の最低限を超える効果が小さく、口コミの評価を最もよく予測したのは人との交流だった（抄録）。", "fun": "スマホで何でもできる時代に、なぜ銀行は街に支店を構えるのか。363,184件の口コミなどを調べると、支店は「この銀行はしっかりしている」と伝える看板の役割を果たしていた。評価を最も左右したのは、最新の機械よりも行員とのやりとりだった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr35", "rank": 35, "headline": "高温・真三軸の砂岩をDEMで解析", "title": "Mechanical Behaviors of Reservoir Sandstone Under Coupled High Temperature and True Triaxial Stress Conditions: A Discrete Element Modeling Study", "url": "https://doi.org/10.1002/nag.70469", "authors": "Kaihui Li ほか", "venue": "International Journal for Numerical and Analytical Methods in Geomechanics", "date": "2026-10-27", "sjr": 0.995, "citescore": 5.9, "citescore_year": "2025", "apa": "Li, K., Yang, J., Han, D., Ren, Q., Zhao, Q., & Li, J. (2026). Mechanical Behaviors of Reservoir Sandstone Under Coupled High Temperature and True Triaxial Stress Conditions: A Discrete Element Modeling Study. International Journal for Numerical and Analytical Methods in Geomechanics. https://doi.org/10.1002/nag.70469", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "地熱開発で深部の貯留岩が受ける冷水注入による熱衝撃と真三軸応力の連成を、鉱物組成に基づく3次元の熱–力学連成の粒子モデル（3D TM-GBM）で調べた（抄録）。", "p3": "砂岩の鉱物の不均質性を考慮したモデルを通常の三軸試験で較正し、加熱・水冷の処理と真三軸圧縮の数値実験に拡張した（抄録）。", "p5": "ゆっくり加熱すると粒界の亀裂が主だが、水冷では粒内の亀裂が主になった（抄録）。最小主応力σ3の増加は強度を大きく高め、中間主応力σ2は強度を初めに高めのちに下げる非線形の効果を示し、温度の上昇は引張亀裂を、σ2とσ3の上昇は粒界のせん断すべりを増やして、引張主体から引張・せん断の混合の破壊に移った（抄録）。", "fun": "地下深くの熱を利用する地熱発電では、熱い岩に冷たい水を流し込む。この研究は、岩を小さな鉱物の粒の集まりとしてコンピュータで再現し、急に冷やすと粒の内部が割れやすくなることや、三方向からの押され方で壊れ方が変わることを示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr36", "rank": 36, "headline": "DEM–SPHで粒状地すべりの段波を予測", "title": "Research on the Optimized 3D DEM‒SPH Algorithm and Impact Parameters of Surge Wave Amplitude for Granular Landslides", "url": "https://doaj.org/article/0a05a3976daa408abf1efacacd110cd5", "authors": "LI Yang ほか", "venue": "DOAJ (DOAJ: Directory of Open Access Journals)", "date": "2026-11-01", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": false, "short": true, "p1": "粒状の地すべりが水域に突入して起こす大きな波（サージ）を、メッシュを使わない3次元の半解像のDEM–SPH連成法で再現し、最大振幅を支配するパラメータを調べた（抄録）。", "p3": "結合面の体積分率を多相流モデルで最適化し、浮力・抗力・反力を半解像の方式で計算した。3次元の造波水槽の実験で検証し、地すべりの長さ・幅・厚さ・突入速度・斜面の角度を変えて解析した（抄録）。", "p5": "波の振幅の相対誤差は5〜12%で、半解像の方式は完全解像の連成より計算時間を約30%減らした（抄録）。第1波は突入速度（感度係数0.583）、厚さ（0.391）、斜面の角度（0.338）の影響が大きく、地すべりが長いほど衝撃でできるくぼみへの埋め戻しが減って第2波が約40%小さくなった（抄録）。", "fun": "山の斜面が崩れて湖やダムに流れ込むと、大きな波が起きて岸を襲うことがある。この研究は、砂と水を小さな粒の集まりとしてコンピュータで再現し、実験との誤差を5〜12%に収めた。最初の波の大きさを最も左右したのは、崩れた土砂が水に入る速さだった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr37", "rank": 37, "headline": "LS-VOF-DEMで土砂を含むダム決壊流を解く", "title": "Modeling of dam-break flow with sediment particles over different riverbed forms by coupled level set and volume of fluid-discrete element method", "url": "https://doi.org/10.1063/5.0349683", "authors": "Jun Ouyang ほか", "venue": "Physics of Fluids", "date": "2026-10-27", "citescore": 5.4, "citescore_year": "2025", "apa": "Ouyang, J., Meng, W., Zuo, Z., Wang, L., Zhang, X., & Deng, B. (2026). Modeling of dam-break flow with sediment particles over different riverbed forms by coupled level set and volume of fluid-discrete element method. Physics of Fluids, 38(10). https://doi.org/10.1063/5.0349683", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefなどに登録された抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "土砂粒子を含むダム決壊流を、レベルセット法とVOF法を組み合わせた界面の捕獲と離散要素法（DEM）を連成したCLSVOF-DEMモデルで解析した（抄録）。", "p3": "CLSVOF法で空気と水の界面を再構成して正確に捉え、DEMで粒子の接触と衝突を解き、流体–粒子の相互作用力を支配方程式に直接組み込んだ。モデルを検証したうえで、異なる河床形状の上の土砂を含むダム決壊流に適用した（抄録）。", "p5": "土砂の材料特性が第一の要因で、動きやすいポリ塩化ビニルの粒子が大量に巻き込まれると流れの運動エネルギーを消費し、波の先端の伝播を約20%遅らせ、河床の変形の振幅を天然の砂の約3倍にした（抄録）。河床地形と下流の水位は第二の要因だった（抄録）。", "fun": "ダムが壊れると、水は川底の砂を巻き込みながら一気に流れ下る。この研究は、水と空気の境目と、砂粒一つ一つの動きを同時に計算するモデルを作った。軽くて動きやすい粒だと、粒を運ぶのにエネルギーが使われて、波の先端が約20%遅くなった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr38", "rank": 38, "headline": "重なりを保つ多ラベル分割で橋梁の損傷を検出", "title": "Study of Overlap-Preserving Multi-Label Semantic Segmentation for Visual Bridge Inspection", "url": "https://doi.org/10.3390/app162110630", "authors": "Shiji Ma ほか", "venue": "Applied Sciences", "date": "2026-10-27", "citescore": 6.1, "citescore_year": "2025", "apa": "Ma, S., Qiao, L., & Li, Q. (2026). Study of Overlap-Preserving Multi-Label Semantic Segmentation for Visual Bridge Inspection. Applied Sciences, 16(21), 10630. https://doi.org/10.3390/app162110630", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefなどに登録された抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "橋梁の目視点検の自動化に向け、損傷の種類と部材の注釈が重なるDACL10K v2の19クラスを独立した2値の目標として扱う、多ラベルのセマンティックセグメンテーションを検討した（抄録）。", "p3": "注釈の監査で学習画素の約15.8%が複数のラベルを持つことを確かめ、公式の学習画像6935枚を内部の学習・検証に分け、選んだ構成を公式の検証画像975枚で評価した。DeepLabV3+、SegFormer、Mask2Formerを共通の手順で比べ、損失の設定と特徴強化モジュールを検討した（抄録）。", "p5": "2分岐の局所–大域文脈の精緻化（LGCR）の構成を作ったが、公式の検証集合でのmIoUはSegFormerが37.38%、LGCRが37.44%で、3つの乱数シードでの差の平均は0.06ポイント、差の向きはシードで変わった（抄録）。著者らはLGCRの一貫した優位は示されないと結論した（抄録）。", "fun": "橋のひび割れやさびを写真からAIで見つける研究は多い。この研究は、新しく工夫したAIの部品が本当に効くかを3回の試行で丁寧に確かめ、差はわずか0.06ポイントで向きも試行ごとに変わったため、「効果があるとは言えない」と正直に報告した。うまくいかなかった結果を示すことも研究の大事な仕事だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr39", "rank": 39, "headline": "非接触モード試験で薄肉円筒のFEモデルを更新", "title": "Regularised Finite-Element Model Updating of a Thin-Walled Cylinder Based on Non-Contact Experimental Modal Analysis", "url": "https://doi.org/10.3390/s26216755", "authors": "Miaoshuo Li ほか", "venue": "Sensors", "date": "2026-10-27", "citescore": 9.4, "citescore_year": "2025", "apa": "Li, M., Ma, Y., Xia, Y., Lu, K., Xu, C., Gu, F., & Fan, Q. (2026). Regularised Finite-Element Model Updating of a Thin-Walled Cylinder Based on Non-Contact Experimental Modal Analysis. Sensors, 26(21), 6755. https://doi.org/10.3390/s26216755", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefなどに登録された抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "加工で材料を削ると薄肉部品の振動特性が変わるため、加工前の基準となる有限要素モデルを、非接触の計測と形状の再構成、材料特性の更新で作る手順を示した（抄録）。", "p3": "レーザー振動計で目標の固有振動数を、画像計測で端面の周方向の形状を求め、3次元スキャンを編集可能なCADに再構成した。形状とポアソン比を固定し、ヤング率と密度をTikhonov正則化つきの相対振動数誤差の最小化で更新し、重みはL曲線で選んだ（抄録）。", "p5": "薄肉の鋼製円筒の事例で、再構成モデルの半径方向の偏差の中央値は0.0362 mm（平均肉厚の約1%）で、目標の3つのモードの相対RMSEは1.71%から1.00%に、当てはめに使わないモードでは0.68%から0.65%に下がった（抄録）。自由状態の振動数はE/ρの比しか同定できず、正則化が代表的な組を選ぶと位置づけた（抄録）。", "fun": "薄い金属の筒を削ると、叩いたときの響き方が変わる。この研究は、筒に触れずにレーザーやカメラで響き方と形を測り、コンピュータの模型を本物に合わせ込んだ。振動数の誤差は1.71%から1.00%に下がった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr40", "rank": 40, "headline": "曲率モード情報エントロピーで節点の死角を解消", "title": "Generalized Local Curvature Modal Information Entropy (GLCME) for Mitigating Nodal Blindness in Beam Damage Assessment", "url": "https://doi.org/10.3311/ppci.43008", "authors": "Zi Yuan ほか", "venue": "Periodica Polytechnica Civil Engineering", "date": "2026-10-27", "citescore": 3.7, "citescore_year": "2025", "apa": "Yuan, Z., Ma, T., & Xiang, C. (2026). Generalized Local Curvature Modal Information Entropy (GLCME) for Mitigating Nodal Blindness in Beam Damage Assessment. Periodica Polytechnica Civil Engineering. https://doi.org/10.3311/ppci.43008", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefなどに登録された抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "曲率モード指標がモード形の節の近くの損傷に鈍感という限界に対し、一般化局所曲率モード情報エントロピー（GLCME）を導入して梁の損傷評価を改善した（抄録）。", "p3": "GLCMEを数学的に導き、高次モード形の性質を使って損傷指標を作った。単純支持梁と連続梁橋の数値モデルと単純支持の鋼梁の実験で動的データを得て、曲率モードとGLCMEをそれぞれ順伝播型ニューラルネットワークの入力にして比べた（抄録）。", "p5": "GLCMEを入力にすると損傷の位置と程度を信頼性高く同定でき、特に節の近くの損傷で従来の曲率モードより精度と感度が大きく高かった（抄録）。曲率モードは節から離れた損傷に向き、両者は補い合うとした。具体的な数値は抄録にない（未確認）。", "fun": "橋の揺れ方を測ると、傷んだ場所が分かることがある。でも揺れの「節」、つまりほとんど動かない点の近くの傷は見つけにくい。この研究は、揺れの形の乱れ具合を情報の量として測る指標を作り、節の近くの傷も見つけられるようにした。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr41", "rank": 41, "headline": "税と財務報告の整合残差で異常を検出", "title": "EXPLAINABLE IDENTIFICATION OF TAX-RELATED FINANCIAL REPORTING ANOMALIES IN U.S. PUBLIC COMPANIES: CROSS-FITTED TAX-CONSISTENCY RESIDUALS AND OWEN-VALUE SHAPLEY PROPAGATION", "url": "https://doi.org/10.61784/wjebr4125", "authors": "JiaYing Chen ほか", "venue": "World Journal of Economics and Business Research", "date": "2026-10-27", "apa": "Chen, J., Zhang, X., & Han, X. (2023). EXPLAINABLE IDENTIFICATION OF TAX-RELATED FINANCIAL REPORTING ANOMALIES IN U.S. PUBLIC COMPANIES: CROSS-FITTED TAX-CONSISTENCY RESIDUALS AND OWEN-VALUE SHAPLEY PROPAGATION. World Journal of Economics and Business Research, 1(1), 33–45. https://doi.org/10.61784/wjebr4125", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefなどに登録された抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "法人税の勘定と財務諸表の他の部分との整合性に注目し、米国上場企業の税関連の財務報告の異常を説明可能な形で見つける枠組みTRACEを提案した（抄録）。", "p3": "各年度で法人税費用と未払税金の同業に基づく期待値をラベルなしの交差適合モデルで推定して残差を作り、Compustatの28項目と組み合わせた勾配ブースティングで評価し、Shapley値の伝播で33の明細項目まで説明を届けた（抄録）。", "p5": "SECの執行通牒でラベル付けした146,045企業年を時間外（2003〜2008年）で評価し、上位1%の選別でのNDCGは0.0330と最も高く、RUSBoostより99%、LightGBMより89%改善した（抄録）。検出された虚偽表示は、同業より速い税費用の伸びと期待より少ない未払税金の組み合わせが多かった（抄録）。", "fun": "会社の決算書の不正は、税金の数字のつじつまに表れることがある。この研究は、同業他社と比べて税金の数字が不自然な会社をAIで探し、どの項目が怪しいかまで説明できるようにした。146,045件のデータで、既存の方法よりうまく不正を上位に挙げられた。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr42", "rank": 42, "headline": "車両–橋梁連成系の瞬時周波数応答の解析解", "title": "Instantaneous frequency response of vehicle–bridge interaction systems – Analytical formulation and parametric study", "url": "https://doi.org/10.1016/j.engstruct.2026.124034", "authors": "Xian-Zheng Hong ほか", "venue": "Engineering Structures", "date": "2026-10-27", "sjr": 1.922, "citescore": 12.0, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名から、車両と橋梁の相互作用系の瞬時周波数応答について、解析的な定式化とパラメータの検討を行ったEngineering Structuresの論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「車が橋を渡る間、車と橋が一緒に揺れる周波数は刻々とどう変わるのか」だ。その変化を数式で表し、条件を変えて調べた研究と読める。", "unverified": "手法・結果とも未確認。"}}, {"id": "jr43", "rank": 43, "headline": "速度と軸重が変わる列車での合成桁鉄道橋の監視", "title": "Structural health monitoring of composite girder railway bridge under variable speed and axle load—a case study and numerical modelling", "url": "https://doi.org/10.1007/s13349-026-01148-4", "authors": "Ashish Shukla ほか", "venue": "Journal of Civil Structural Health Monitoring", "date": "2026-10-26", "citescore": 8.0, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名から、速度と軸重が変わる列車の下での合成桁の鉄道橋の構造ヘルスモニタリングについて、事例研究と数値モデルを組み合わせた論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「列車の速さや重さが変わると、鉄道橋の揺れはどう変わるのか」だ。実際の橋の計測とコンピュータの模型を組み合わせて調べた研究と読める。", "unverified": "手法・結果とも未確認。"}}, {"id": "jr44", "rank": 44, "headline": "多様体メタ学習による簡約ニューラルシステム同定", "title": "Manifold meta-learning for reduced-complexity neural system identification", "url": "https://doi.org/10.1016/j.automatica.2026.113333", "authors": "Marco Forgione ほか", "venue": "Automatica", "date": "2026-10-27", "sjr": 3.36, "citescore": 12.4, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Semantic Scholarに登録された抄録を使用", "preprint": false, "short": true, "p1": "深層学習によるシステム同定が大量のデータと計算を要する問題に対し、過剰パラメータ化したニューラルネットのパラメータ空間内の低次元多様体を学習するメタ学習の枠組みを提案した（抄録）。", "p3": "関連する力学系の族から作った入出力系列のメタデータで多様体を学習し、補助のニューラルネットでデータセットを多様体上に直接写すことで、2階の勾配計算をなくし、推論時の1階の更新回数も減らした（抄録）。", "p5": "よく研究された非線形システム同定のベンチマークであるBouc-Wen振動子の族で検証し、少ないデータでも正確なモデルを学習できることを示した（抄録）。具体的な数値は抄録にない（未確認）。", "fun": "機械の揺れ方をAIに覚えさせるには、ふつう大量のデータが必要だ。この研究は、似た仲間の機械のデータから「揺れ方のパターンの地図」を先に学んでおき、新しい機械では少ないデータで地図上の位置を決めるだけで済むようにした。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jr45", "rank": 45, "headline": "縮小都市のTODと生活満足（東京圏）", "title": "Rethinking transit-oriented development in shrinking cities: Urban structure and life satisfaction in Tokyo metropolitan area", "url": "https://doi.org/10.1016/j.cities.2026.107693", "authors": "Kyoko Takahashi ほか", "v "title": "Corporate Pension Risk-Taking in a Low Interest Rate Environment", "url": "https://doi.org/10.1287/mnsc.2025.02928", "authors": "Vasso Ioannidou ほか", "venue": "Management Science", "date": "2026-10-26", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "2012年の割引率算定の見直しで積立不足の圧力が和らいだ確定給付年金ほど株式比率を下げたことを示し、的を絞った規制緩和の効果を明らかにした。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "積立不足の圧力が米国の企業の確定給付年金のリスクテイクにどう影響するかと、的を絞った規制の緩和がその誘因を抑えられるかを調べた（抄録）。", "p3": "割引率の計算を見直して積立の圧力を一時的に緩めた2012年のMAP-21法の改革を利用し、緩和の大きさの違いによる資産配分の変化を比べた（抄録）。", "p5": "緩和を大きく受けた年金ほど株式の配分を有意に減らし、より安全な資産に移した（抄録）。このリスク削減は現役加入者のいる年金と財務的な制約の強い企業の年金で最も顕著で、経済条件や会計基準を変えなくても規制の緩和でリスクテイクの誘因を抑えられることを示した（抄録）。", "fun": "お金が足りなくなった年金は、一発逆転をねらって危ない投資に走りやすい。この研究は、2012年にアメリカで年金の積立ルールが一時的に緩められたとき、緩和を多く受けた年金ほど株を減らして安全な資産に移したことを示した。追い詰めないことがリスクを減らすという話だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn19", "rank": 19, "field": "社会学", "headline": "自治体はクリスマスツリーで多様性を管理する", "title": "Simply a Sign of the Season? Christmas Trees as Cultural Ciphers in Local Government Management of Diversity", "url": "https://doi.org/10.1177/00031224261486015", "authors": "Gary J. Adler ほか", "venue": "American Sociological Review", "date": "2026-10-27", "sjr": 3.277, "citescore": 9.0, "citescore_year": "2025", "why": "自治体職員の代表標本への調査実験で、宗派的な要素を含む展示よりツリーだけの同化主義的な展示が好まれることを示し、多様性管理の象徴的な戦略を分析した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "地方政府が住民の宗教的な多様性を象徴的にどう扱うかを、地方政府の職員の代表標本に対する調査実験で調べた（抄録）。", "p3": "公共の場所に置く祝日の飾りの内容を無作為に変える調査実験と自由記述の回答で、多様性の扱い方の戦略への選好を測った（抄録）。", "p5": "職員は、宗派的な宗教の内容を含む多文化主義的・排他的な戦略より、クリスマスツリーだけを置く同化主義的な戦略を好み、ツリーを政府の宗教支持と最も受け取られにくい飾りと評価した（抄録）。著者らは、多様な意味を許しどの集団にも無害に響くツリーを「文化的な暗号」と捉えて説明した（抄録）。", "fun": "役所の前にクリスマスツリーを飾るのは、宗教的な行為だろうか。アメリカの地方の職員に尋ねると、ツリーだけなら宗教色が最も薄いと考えて好む人が多かった。誰にでも受け入れられやすい曖昧さが、多数派の文化を自然に保つ働きもするという見方が鋭い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn20", "rank": 20, "field": "人口学", "headline": "SSPに整合したNYCの長期人口投影と気候リスク", "title": "Equity dimensions of future vulnerabilities to climate hazards: Long-term spatial population projections for New York City consistent with Shared Socioeconomic Pathways", "url": "https://doi.org/10.1073/pnas.2407568122", "authors": "Deborah Balk ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-26", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "共有社会経済経路に整合したニューヨーク市の小地域の長期人口投影を作り、将来の気候ハザードへの脆弱性の公平性を評価した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "気候災害への将来の脆弱性を公平性の観点から評価するため、共有社会経済経路（SSP）と整合したニューヨーク市の長期の空間的な人口予測を作った（抄録）。", "p3": "州レベルのSSPに基づく予測を拡張し、多状態・多地域の人口予測と空間的なダウンスケーリングを組み合わせて、人種・民族、年齢、性別ごとの郡レベルの人口を2100年まで予測し、100 mの格子に落とし込んだ（抄録）。", "p5": "現在880万人が住むニューヨーク市について、5つのSSPのうち4つで、世紀末の人口は今より少なく、はるかに高齢になると予測された（抄録）。ただしこの将来は出生率と、特に移住に関する人口学的な仮定に左右される（抄録）。", "fun": "気候変動の被害は、どこに誰が住んでいるかで大きく変わる。この研究は、ニューヨーク市の人口を2100年まで、100 mごとの細かさで、人種や年齢別に予測した。多くの筋書きで、街は今より小さく、ずっと高齢になっていた。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn21", "rank": 21, "field": "経済学", "headline": "ネットワーク化した食料システムで衝撃が伝わる", "title": "Propagating shocks and transitions across networked food systems: Insights from multiplayer microeconomic modeling", "url": "https://doi.org/10.1073/pnas.2321155123", "authors": "Benjamin F. Zaitchik ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-26", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "エチオピアとマリで、食料・水・エネルギーを結ぶ多主体のミクロ経済モデルを用いて、ある地域や部門の衝撃が他へ波及する過程を整理した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "ある地域や部門の衝撃や変化が、つながった食料・水・エネルギーの系を通じて他の地域や部門にどう波及するかを、エチオピアとマリでの研究をまとめて論じた（抄録）。", "p3": "資源の産地と市場を結ぶ食料の生産・流通・消費の連鎖を通じて多様な目的を考慮する多主体のミクロ経済モデルを地方の単位で作り、エチオピアの3つとマリの1つの事例に適用した（抄録）。", "p5": "事例は地方の干ばつ、食料不足に対する輸出規制、太陽光発電による地下水灌漑、食料援助を扱い、最初の信号が市場、インフラ、経済主体の相互作用を通じて国内にどう広がるかを検討した（抄録）。具体的な数値は抄録にない（未確認）。", "fun": "ある地域の干ばつは、その地域だけの問題では終わらない。食べ物の値段や流れを通じて、遠くの町の暮らしにも影響する。この研究は、エチオピアとマリで、干ばつや輸出の制限、太陽光で動く井戸などの影響が国中にどう広がるかを経済のモデルで追った。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn22", "rank": 22, "field": "経営学", "headline": "寒色の多色ロゴは好奇心で消費者を覚醒させる", "title": "Color me aroused while keeping the cool", "url": "https://doi.org/10.1007/s11747-026-01215-8", "authors": "Nadeesha H. Bandara ほか", "venue": "Journal of the Academy of Marketing Science", "date": "2026-10-27", "sjr": 6.426, "citescore": 22.3, "citescore_year": "2025", "why": "8つの実験（うち7つは事前登録）で、寒色でも多色のロゴは単色より好奇心を通じて覚醒を高めることを、生体計測や実際の商品選択も含めて示した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "暖色や彩度の高い色だけが消費者の覚醒を高めるという通説に対し、寒色を使った多色のロゴが好奇心を通じて覚醒を高めるという経路を示した（抄録）。", "p3": "計8つの実験（うち7つは事前登録、募集した参加者は計1,724人）を行い、本文の6つには視線計測・皮膚電気反応・瞳孔径を使う行動実験と、実際の商品選択を使う3つの研究が含まれた（抄録）。", "p5": "寒色の多色ロゴは単色の寒色ロゴより一貫して覚醒を高め、好奇心による覚醒が支払意思額と選択に影響した（抄録）。", "fun": "赤やオレンジなどの暖かい色は人をわくわくさせ、青や緑の涼しい色は落ち着かせる、と言われる。ところがこの研究では、涼しい色でも何色も組み合わせたロゴにすると、「何だろう？」という好奇心が湧いて、見る人の気持ちが高ぶることが分かった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn23", "rank": 23, "field": "経営学", "headline": "プラットフォームの物流代行は小規模出店者に不利", "title": "Fulfillment by Platform: Competition and Upstream Market Power", "url": "https://doi.org/10.1287/opre.2022.0399", "authors": "Amandeep Singh ほか", "venue": "Operations Research", "date": "2026-10-27", "sjr": 3.759, "citescore": 6.4, "citescore_year": "2025", "why": "大手マーケットプレイスの取引データで、プラットフォームの物流代行は顧客の体験と厚生を高める一方、利幅の薄い小規模出店者の値上げを通じて上流の集中を高めることを示した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "ECの基盤企業が提供する配送代行（フルフィルメント）サービスが、消費者と売り手の競争に与える影響を、大手オンライン市場の取引データで調べた（抄録）。", "p3": "取引単位のデータを使い、基盤企業による配送代行が顧客体験、消費者の厚生、売り手の価格と市場シェアに与える影響を分析した（抄録）。", "p5": "配送代行は顧客体験と消費者の厚生を高めたが、売り手の費用を増やすため利幅の薄い小さな売り手ほど値上げを迫られ、大きな売り手がシェアを伸ばして上流の市場の集中が進んだ（抄録）。消費者に役立つサービスでも売り手側の競争を弱めうると指摘した（抄録）。", "fun": "ネット通販の会社が出店者の商品を代わりに保管・配送してくれると、届くのが速くなって客は喜ぶ。でもこの研究によると、その費用は小さな店ほど重くのしかかり、値上げを迫られて客を失い、大きな店がますます強くなっていた。便利さの裏の副作用だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn24", "rank": 24, "field": "経営学", "headline": "需要の振り分けで出品者の在庫を誘導する", "title": "Managing Newsvendors via Demand Shifting", "url": "https://doi.org/10.1287/opre.2024.1396", "authors": "Yilun Chen ほか", "venue": "Operations Research", "date": "2026-10-26", "sjr": 3.759, "citescore": 6.4, "citescore_year": "2025", "why": "代替的な商品間で需要を振り分ける規則を約束することで、プラットフォームが出品者の在庫水準を誘導できる最適規則を閉形式で導いた。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "独立した売り手の注文を代行する基盤企業が、在庫の費用を負担しながら売り手の在庫量を決められない状況で、代替できる商品の間で需要を振り分けて売り手の在庫の判断に影響を与える方法を調べた（抄録）。", "p3": "基盤企業は売り手が受け取る需要の分布を変える振り分けの規則に事前に約束するとし、その最適な規則を閉じた形で求めた（抄録）。", "p5": "最適な規則は目標の在庫量の周りの需要の変動を減らしてその量を売り手に魅力的にし、売り手間で需要のリスクを共有させた（抄録）。振り分けの費用が小さければ集中管理と同じ利益に達して売り手と客も得をするが、費用が大きく在庫が高価だと客へのサービス水準を下げうる（抄録）。", "fun": "ネット通販の会社は、どの店の商品を客に勧めるかを調整できる。この研究は、その勧め方を上手に設計すると、各店に「ちょうどよい量」の在庫を持たせられることを数学で示した。ただし調整の費用が高いと、客へのサービスが下がるおそれもある。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn25", "rank": 25, "field": "経営学", "headline": "探索コストが低いほど全額返金が有利になる", "title": "EXPRESS: Optimal Return Policies with Heterogeneous Search Rewards", "url": "https://doi.org/10.1177/10591478261504549", "authors": "Fangruo Chen ほか", "venue": "Production and Operations Management", "date": "2026-10-27", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "why": "購入前の探索の報酬が消費者で異なるとき、探索コストが十分低いと全額返金が返金なしより有利になることを示し、その背後のトレードオフを明らかにした。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "購入前に費用をかけて商品の合い具合を調べられる消費者を相手にするオンラインの売り手について、探索から得られる利益が消費者ごとに違うモデルで、返品の方針の最適な設計を調べた（抄録）。", "p3": "返品の方針が購入後の返品だけでなく、購入前の探索と購入の判断にも影響して消費者を内生的に分ける点に注目し、全額返金と返金なしを比べた（抄録）。", "p5": "探索の費用が十分に低いとき、直感に反して全額返金が返金なしより有利になった（抄録）。全額返金は探索の代わりになって売り手の価格決定力を取り戻す一方、探索せずに買って手元に残したはずの客の返品も誘うが、探索の費用が低いと前者が勝り、さらに下がると双方が得をする結果にもなった（抄録）。", "fun": "ネットで服を買う前に口コミや寸法をじっくり調べる人は多い。調べるのが簡単なら、店は返品を受け付けなくてもよさそうだ。ところがこの研究は、調べるのが簡単なときこそ全額返金が店にとって得になることを示した。「まず買って試して」の方が皆にとってよい場合もある。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn26", "rank": 26, "field": "経営学", "headline": "母国文化が起業家の認知を通じて国際化を左右", "title": "Unpacking the micro–macro transmission mechanism: how home-country culture selectively shapes cognitive orientations in entrepreneurial internationalization", "url": "https://doi.org/10.1057/s41267-026-00915-1", "authors": "Razieh Rosie Sadraei ほか", "venue": "Journal of International Business Studies", "date": "2026-10-27", "sjr": 4.454, "citescore": 17.6, "citescore_year": "2025", "why": "41か国40,529件の多層分析で、個人主義や危険回避の文化が起業家の自己効力感・機会認識・失敗への恐れを選択的に変えることを示した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "母国の文化が、起業家の輸出の判断に関わる3つの認知（自己効力感、機会があるという認識、失敗への恐れ）を選択的にどう調整するかを、社会的認知理論で調べた（抄録）。", "p3": "2010〜2019年の41か国の40,529件の観測を多水準分析し、個人主義と集団主義、リスク回避と許容という文化の次元の調整効果を検討した（抄録）。", "p5": "調整は一様でなく、個人主義は自己効力感と機会の認識を強め、リスク回避は機会の認識と失敗への恐れを抑えた（抄録）。失敗への恐れが国際化を妨げるかどうかは母国の文化が作る失敗の費用の予想に依存し、従来の枠組みが想定するように一様に抑制的ではなかった（抄録）。", "fun": "「失敗が怖い」気持ちは、海外に挑戦する起業家のブレーキになると考えられてきた。ところが41か国の40,529件のデータを調べると、その気持ちがブレーキになるかどうかは、失敗をどれだけ重く見るかという国の文化によって変わっていた。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn27", "rank": 27, "field": "経済学", "headline": "付加価値税の減税が地域の起業を促した", "title": "Do Tax Incentives Enhance Entrepreneurship? Evidence from Value‐Added Tax Reform in China", "url": "https://doi.org/10.1111/jmcb.70097", "authors": "DONGMIN KONG ほか", "venue": "Journal of Money, Credit and Banking", "date": "2026-10-27", "sjr": 1.999, "citescore": 3.7, "citescore_year": "2025", "why": "中国の段階的な付加価値税改革を外生的な変化として差の差法で分析し、減税が資金制約を和らげて地域の起業を増やしたことを示した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "税制上の優遇が起業を促すかを、中国で段階的に実施された付加価値税（VAT）改革を外生的なショックとして調べた（抄録）。", "p3": "改革の時期の違いを利用した差の差の推定で、減税が地域の起業に与えた因果効果を推定し、内生性と頑健性の検定を重ねた（抄録）。", "p5": "減税は地域の起業にかなりの正の効果を持ち、その仕組みとして資金制約の緩和が考えられた（抄録）。制度の質、信頼、商業文化の水準が高い地域ほど改革後の起業の増加が大きかった（抄録）。具体的な数値は抄録にない（未確認）。", "fun": "税金を安くすれば、新しく会社を始める人は増えるのだろうか。中国で地域ごとに時期をずらして行われた税制改革を使って調べると、減税は起業を大きく後押しし、お金を集めやすくなったことが理由と考えられた。信頼や商売の文化がある地域ほど効果が大きかった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn28", "rank": 28, "field": "経済学", "headline": "第一次大戦後の都市学区への投資が教育と賃金を高めた", "title": "The Impact of Early Investments in Urban School Systems in the United States", "url": "https://doi.org/10.1017/s0022050726101570", "authors": "Ethan Schmick ほか", "venue": "Journal of Economic History", "date": "2026-10-27", "sjr": 1.951, "citescore": 4.3, "citescore_year": "2025", "why": "反ドイツ感情による学校支出の増加を使い、学校資源が教育年数と後の賃金を高め、1895〜1913年生まれの教育の伸びの約4割を説明することを示した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "第一次世界大戦後に米国の都市が公教育への支出を大きく増やした投資の効果を、新しいデータで初めて評価した（抄録）。", "p3": "反ドイツ感情によって生じた、ほぼ外生的な学校支出の増加を利用し、学校の資源が後の学歴と賃金に与えた影響を推定した（抄録）。", "p5": "平均的な都市の学区は1924年までに生徒1人当たり支出を70%以上増やし、学校の資源は学歴と後の賃金を有意に高め、特に恵まれない子どもで効果が大きかった（抄録）。支出の増加は、1895〜1913年生まれの世代の学歴の大きな上昇の約40%を説明できた（抄録）。", "fun": "第一次世界大戦のあと、アメリカの都市は学校に使うお金を一気に増やした。この研究は、ドイツへの反感が思わぬ形で学校の予算を押し上げた事情を利用して効果を測り、学校への投資が子どもたちの将来の学歴と収入を高めたことを示した。歴史が天然の実験になった例だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn29", "rank": 29, "field": "情報システム", "headline": "ソーシャルボットの返信は人どうしの交流を変える", "title": "Social bots as companions: Boon or bane for mental health community engagement?", "url": "https://doi.org/10.1108/intr-10-2025-1770", "authors": "Shuang Geng ほか", "venue": "Internet Research", "date": "2026-10-27", "sjr": 2.207, "citescore": 14.8, "citescore_year": "2025", "why": "メンタルヘルスのコミュニティで、ボットの返信が投稿者や他の利用者のその後の関与にどう影響するかと、利用者がボットに伴走感を感じる心理的な仕組みを調べた。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "心の健康のオンライン・コミュニティで仲間として使われるAIのソーシャルボットの返信が人どうしのやりとりにどう影響するかと、仲間らしさの知覚の心理的な仕組みを調べた（抄録）。", "p3": "研究1でボットの返信を受けた投稿と人の返信だけを受けた投稿のその後の参加を比べ、研究2でオンライン実験により人とボットの返信の受け止め方を比べた（抄録）。", "p5": "ボットの返信を受けた投稿は返信が速い一方、投稿者のその後の返信の頻度が低く、人の返信者と返信の数も少なかった（抄録）。人の返信はボットより仲間らしさが高く感じられ、その差は心理的な近さ、本物らしさ、共感の知覚で説明された（抄録）。", "fun": "悩みを打ち明ける掲示板で、AIのボットがすぐ返事をくれるのは心強そうだ。でもこの研究では、ボットが返事をした投稿には、その後の人間からの返事がかえって少なかった。速さよりも、人の共感の深さが仲間らしさを生むことが分かる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn30", "rank": 30, "field": "情報システム", "headline": "Wikipediaの露出がInstagram投稿と連動", "title": "Wikipedia visibility and instagram hashtag intensity in urban tourism: an AI-based multilingual analysis of tourist attractions in Seville", "url": "https://doi.org/10.1007/s40558-026-00419-6", "authors": "Antonio Gavira-Narváez ほか", "venue": "Information Technology and Tourism", "date": "2026-10-27", "sjr": 1.876, "citescore": 13.9, "citescore_year": "2025", "why": "セビリアの観光地について12言語版のWikipediaから注目度の指標を作り、Instagramのハッシュタグ量との関係を混合効果モデルとランダムフォレストで分析した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "セビリアの観光名所について、多言語のWikipediaでの露出とInstagramのハッシュタグの多さの関係を調べた（抄録）。", "p3": "Wikipediaの12の言語版からAIで名所の知名度の指標を作って検証し、線形混合効果モデル、ランダムフォレスト回帰、クラスタ別の分析を組み合わせた（抄録）。", "p5": "Wikipedia由来の露出の指標はInstagramのハッシュタグの多さと有意に関連し、特にスペインから地理的・文化的に遠い言語の集団で関連が強かった（抄録）。検証の手順を踏めば、LLMで多言語の文章から比較可能な指標を取り出せることも示した（抄録）。", "fun": "旅行先の名所を調べるとき、自分の国の言葉のWikipediaを見る人は多い。スペインのセビリアの名所を12の言語版で調べると、Wikipediaでよく紹介されている名所ほどInstagramにもよく投稿されており、特に遠い国の言葉でその傾向が強かった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn31", "rank": 31, "field": "情報システム", "headline": "LLMの専門家混合でスマートコントラクト脆弱性検出", "title": "MOS: Towards Effective Smart Contract Vulnerability Detection through Mixture-of-Experts Tuning of Large Language Models", "url": "https://doi.org/10.1145/3859369", "authors": "Hang Yuan ほか", "venue": "ACM Transactions on Software Engineering and Methodology", "date": "2026-10-27", "sjr": 1.59, "citescore": 11.6, "citescore_year": "2025", "why": "スマートコントラクトのデータで継続事前学習したLLMを専門家混合で調整し、誤検知を抑えた説明つきの脆弱性検出の枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "スマートコントラクトの脆弱性を検出し説明するため、大規模言語モデルを専門家混合（MoE）で調整する枠組みMOSを提案した（抄録）。", "p3": "スマートコントラクトのデータで継続事前学習を行い、LLMの生成と専門家の検証で調整用のデータを作り、コードの特徴から関連する専門家ネットワークを選ぶ経路づけと、検出・説明と専門家の利用の均衡の2つを目的とする損失を設計した（抄録）。", "p5": "4つの基本的な脆弱性の種類で既存の最良の手法よりF1を平均6.38%、正解率を平均4.84%高め、説明は正しさ・完全さ・簡潔さで82.96%、85.21%、94.58%が肯定的に評価された（抄録）。新しい6種類の脆弱性でも平均F1は83.94%、平均正解率は87.82%だった（抄録）。", "fun": "ブロックチェーン上で自動的に動く契約のプログラムに穴があると、大金が盗まれることがある。この研究は、AIの中に脆弱性の種類ごとの「専門家」を何人も置き、コードの特徴に合わせて担当を呼び出す仕組みで、穴の発見と理由の説明の両方を上手にこなせるようにした。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn32", "rank": 32, "field": "情報システム", "headline": "異種データ源を実体関連モデルで統一するRAG", "title": "ER-RAG: Enhance RAG with ER-Based Unified Modeling of Heterogeneous Data Source", "url": "https://doi.org/10.1145/3860054", "authors": "Yikuan Xia ほか", "venue": "ACM Transactions on Knowledge Discovery from Data", "date": "2026-10-27", "sjr": 1.317, "citescore": 9.8, "citescore_year": "2025", "why": "ウェブ・データベース・知識グラフに散らばる根拠を実体関連モデルに基づく統一APIで扱い、検索拡張生成の効率と効果を高める枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、候補の収集時に得た抄録を使用", "preprint": false, "short": true, "p1": "証拠がウェブページ、データベース、知識グラフなどの異なる情報源に散らばるときの検索拡張生成（RAG）のため、実体–関連（ER）モデルに基づく統一的なAPIで情報源へのアクセスを標準化する枠組みER-RAGを提案した（抄録）。", "p3": "直接選好最適化で調整したモジュールがまず最適な情報源を選び、別のモジュールが選んだ情報源のスキーマに基づいてAPIの連鎖を生成する2段階の生成で証拠を探した（抄録）。", "p5": "8Bの言語モデルを基盤にしたER-RAGは、最先端のLLMを使う商用のRAGと同等の性能を示し、他の複数情報源の手法をLLMによる評価で3.1%上回り、検索を5.5倍速くした（抄録）。", "fun": "AIに質問に答えさせるとき、答えの手がかりがウェブやデータベースなど形の違う場所に散らばっていると、探すのが大変だ。この研究は、どこを探すにも同じ「問い合わせの型」を使えるようにして、小さめのAIでも大手の商用システムに並ぶ性能を出した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn33", "rank": 33, "field": "組織行動・心理的安全性", "headline": "戦争と平和の間のグレーゾーンを保つ戦略", "title": "Keeping the Greyzone: How Strategizing Preserves Liminality Between War and Peace", "url": "https://doi.org/10.5465/amd.2024.0371", "authors": "Joakim Netz ほか", "venue": "Academy of Management Discoveries", "date": "2026-10-26", "sjr": 3.416, "citescore": 8.7, "citescore_year": "2025", "why": "題名によると、戦略策定が戦争と平和の間の境界的な状態を保つ仕組みを扱う（抄録なし）。", "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名から、戦争と平和の間の「グレーゾーン」という境界的な状態が、戦略づくりによってどう保たれるかを論じたAcademy of Management Discoveriesの論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「戦争でも平和でもない曖昧な状態は、なぜ、どのように続いていくのか」だ。その曖昧さを関係者が戦略として保っているという視点の研究と読める。", "unverified": "手法・結果とも未確認。"}}, {"id": "jn34", "rank": 34, "field": "組織行動・心理的安全性", "headline": "仕事の有意味さの並び順が一日の熱意を変える", "title": "Designing fulfilling and productive workdays: Effects of task meaningfulness sequences on daily engagement and performance.", "url": "https://doi.org/10.1037/apl0001430", "authors": "Soohyun Yoon ほか", "venue": "Journal of Applied Psychology", "date": "2026-10-26", "sjr": 5.473, "citescore": 15.0, "citescore_year": "2025", "why": "題名によると、有意味な仕事をどの順で行うかが日々のエンゲージメントと成果に与える影響を調べた（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Europe PMCに登録された抄録を使用", "preprint": false, "short": true, "p1": "1日の中で意義の高い仕事をいつ行うかという順序が、その日の仕事への没頭（エンゲージメント）と成果にどう影響するかを調べた（抄録）。", "p3": "意義の高い仕事を早く集中して行うと没頭が続くという「エンゲージメントの連鎖」をエージェントベースモデルで定式化し、NASAとロシア宇宙機関の乗組員の縦断研究、従業員の経験サンプリングの現場実験、学部生の実験室実験で予測を検証した（抄録）。", "p5": "意義が次第に下がっていく順序は、次第に上がる順序、逆U字、U字の順序より、その日の没頭を高め、それを通じて成果も高めた（抄録）。具体的な数値は抄録にない（未確認）。", "fun": "やりがいのある仕事と退屈な仕事があるとき、どちらを先にやるべきだろうか。宇宙飛行士や会社員、大学生で調べると、やりがいのある仕事を一日の早いうちにまとめてやる方が、その日の集中が続き、成果も上がった。楽しみを後に取っておくより、先に勢いをつける方がよいらしい。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn35", "rank": 35, "field": "組織行動・心理的安全性", "headline": "AI時代の質的研究の考慮と批判と技法", "title": "Qualitative Research in the Age of AI: Considerations, Critiques, and Craft", "url": "https://doi.org/10.1287/orsc.2026.ed.v37.n6", "authors": "Andrew Nelson ほか", "venue": "Organization Science", "date": "2026-10-26", "sjr": 7.929, "citescore": 12.8, "citescore_year": "2025", "why": "題名によると、AI時代の質的研究の考慮点・批判・技法を論じる（抄録なし）。", "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名から、AIの時代の質的研究について、検討すべき点、批判、研究の技法を論じたOrganization Scienceの論考と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「インタビューや観察を丁寧に読み解く質的研究は、AIが使える時代にどう変わるべきか」だ。AIへの期待と批判の両方を、研究の技の観点から整理した論考と読める。", "unverified": "手法・結果とも未確認。"}}, {"id": "jn36", "rank": 36, "field": "経済学", "headline": "イノベーションブームと容易な資金調達と人的資本", "title": "Innovation booms, easy financing, and human capital accumulation", "url": "https://doi.org/10.1016/j.jfineco.2026.104381", "authors": "Johan Hombert ほか", "venue": "Journal of Financial Economics", "date": "2026-10-27", "sjr": 18.748, "citescore": 20.7, "citescore_year": "2025", "why": "題名によると、イノベーションのブームと緩い資金調達が人的資本の蓄積に与える影響を扱う（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、題名検索で見つかったNBERワーキングペーパー版（10.3386/w32012）の抄録（OpenAlex経由）を使用。掲載版との違いは未確認", "preprint": false, "short": true, "p1": "技術革新のブームを支える資金の出やすさが、熟練労働者の長期的な所得と経済全体の人的資本の蓄積に与える影響を、1990年代後半の情報通信技術（ICT）ブームを例に調べた（抄録）。", "p3": "ICTブームで新しい部門に移った熟練労働者のその後の所得の推移を分析し、労働者の選別、ICT部門全体の崩壊、技能の陳腐化という説明を比べた（抄録）。", "p5": "新しい部門に移った熟練労働者は長期にわたって大きな所得の損失を被り、それは選別や部門の崩壊ではなく技能のより速い陳腐化で説明された（抄録）。ブーム中は資金が、労働者の生産性が最も大きく下がる企業に多く流れ、労働の再配分が人的資本の蓄積に与える負の影響を強めた（抄録）。", "fun": "新しい技術がブームになると、高い給料に引かれて優秀な人が新しい会社に集まる。ところが1990年代後半のIT（情報技術）ブームで移った人たちは、その後長く収入が伸び悩んだ。急速に変わる技術で身につけた技能が、早く古くなってしまったためだった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn37", "rank": 37, "field": "経済学", "headline": "直接融資者は銀行に近いか市場投資家に近いか", "title": "Are direct lenders more like banks or arm’s-length investors?", "url": "https://doi.org/10.1016/j.jfineco.2026.104397", "authors": "Young Soo Jang", "venue": "Journal of Financial Economics", "date": "2026-10-27", "sjr": 18.748, "citescore": 20.7, "citescore_year": "2025", "why": "題名によると、ダイレクトレンダーが銀行と市場型の投資家のどちらに近いかを調べた（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、題名検索で見つかった同名の版（10.2139/ssrn.4529656）のCrossref登録の抄録を使用。掲載版との違いは未確認", "preprint": false, "short": true, "p1": "プライベート・エクイティ（PE）の買収で銀行に代わりつつあるダイレクトレンダー（直接融資を行う貸し手）が、銀行のように貸すのか、距離を置いた投資家のように貸すのかを調べた（抄録）。", "p3": "新しいデータで、ダイレクトレンディングの財務制限条項（コベナンツ）の数、違反の頻度、違反後の介入、COVID禍での対応、PEスポンサーとの過去の関係を銀行の融資と比べた（抄録）。", "p5": "借り手は銀行融資より多くの財務制限条項を課されてより頻繁に違反し、貸し手は違反後に積極的に介入して企業に保守的な方針をとらせた（抄録）。COVID禍では銀行より柔軟で、スポンサーとの過去の関係は苦境時の信用供給の多さを予測し、銀行と同様に監視と関係に基づく融資を行うと結論した（抄録）。", "fun": "会社を買収するときのお金は、昔は銀行が貸すのが普通だったが、今は投資ファンドのような「直接の貸し手」が増えている。この研究は、彼らが銀行と同じように、約束を守らない借り手にしっかり口を出し、困ったときには長い付き合いの相手を支えていることを示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn38", "rank": 38, "field": "経済学", "headline": "退役軍人向け調達優遇の効果", "title": "The impact of preference programs in public procurement: Evidence from veteran set-asides", "url": "https://doi.org/10.1016/j.jpubeco.2026.105805", "authors": "Rodrigo Carril ほか", "venue": "Journal of Public Economics", "date": "2026-10-27", "sjr": 3.601, "citescore": 5.6, "citescore_year": "2025", "why": "題名によると、公共調達での退役軍人向け優遇枠の影響を実証した（抄録なし）。", "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名から、公共調達での優遇制度の効果を、退役軍人が経営する企業向けの発注枠（セットアサイド）を例に調べたJournal of Public Economicsの論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「国の仕事の一部を退役軍人の会社に優先して回すと、値段や質、競争はどう変わるのか」だ。特定の事業者を優遇する制度の効果と代償を測る研究と読める。", "unverified": "手法・結果とも未確認。"}}, {"id": "jn39", "rank": 39, "field": "経済学", "headline": "国境を越える最低課税の最適な回避可能性", "title": "Optimal avoidability in cross-border minimum taxation", "url": "https://doi.org/10.1016/j.jpubeco.2026.105809", "authors": "Adam Kern", "venue": "Journal of Public Economics", "date": "2026-10-27", "sjr": 3.601, "citescore": 5.6, "citescore_year": "2025", "why": "題名によると、国際的な最低課税の回避可能性の最適設計を扱う（抄録なし）。", "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名から、国境を越え search impact", "url": "https://doi.org/10.1016/j.respol.2026.105645", "authors": "Guangyao Zhang ほか", "venue": "Research Policy", "date": "2026-10-26", "citescore": 17.6, "citescore_year": "2025", "why": "題名によると、投稿のタイミングが研究のインパクトに与える影響を扱う（抄録なし）。", "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名から、論文を投稿する時期と、その研究の影響力との関係を調べたResearch Policyの論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「論文をいつ投稿するかで、その後どれだけ引用されるかが変わるのか」だ。研究の中身とは別の、時期という要因に目を向けた研究と読める。", "unverified": "手法・結果とも未確認。"}}, {"id": "jn43", "rank": 43, "field": "統計学", "headline": "非同期と価格の陳腐化に頑健な高頻度共分散推定", "title": "When Asynchronicity Meets Price Staleness: Robust Estimation of High-Frequency Covariance", "url": "https://doi.org/10.1080/07350015.2026.2755404", "authors": "Wenhao Cui ほか", "venue": "Journal of Business & Economic Statistics", "date": "2026-10-26", "sjr": 3.508, "citescore": 5.9, "citescore_year": "2025", "why": "題名によると、取引の非同期と価格の陳腐化に頑健な高頻度共分散の推定法を示す（抄録なし）。", "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": false, "short": true, "p1": "題名から、取引の時刻のずれ（非同期性）と価格の更新の遅れが同時にある高頻度データで、資産間の共分散を頑健に推定する方法を論じたJournal of Business & Economic Statisticsの論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「銘柄ごとに取引の時刻がばらばらで、値段がしばらく更新されないこともある細かなデータから、株価どうしの連動をどう正しく測るか」だ。", "unverified": "手法・結果とも未確認。"}}, {"id": "jn44", "rank": 44, "field": "統計学", "headline": "局所情報で潜在空間ネットワークを推定", "title": "Local Information for Global Network Estimation in Latent Space Models", "url": "https://doi.org/10.1080/07350015.2026.2752982", "authors": "Lijia Wang ほか", "venue": "Journal of Business & Economic Statistics", "date": "2026-10-26", "sjr": 3.508, "citescore": 5.9, "citescore_year": "2025", "why": "題名によると、局所的な情報から全体の潜在空間ネットワークモデルを推定する（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": false, "short": true, "p1": "社会的ネットワークで個人が観測できるのは全体の一部だけという状況で、一人の局所的な視点から一般的な潜在空間モデルを推定する問題を扱った（抄録）。", "p3": "経路の長さに基づく部分グラフとして個人の観測をモデル化し、最尤推定のための射影勾配降下法を提案して、条件付き尤度と完全尤度の両方で収束の理論保証を示し、局所的な視点の偏りを測る不均衡の指標を導入した（抄録）。", "p5": "不均衡の指標が収束の速さと推定誤差の上界を決める中心的な量であることを示し、シミュレーションで一人の局所的な視点からでも満足な推定が可能なことを示した（抄録）。米国議会の法案共同提出のネットワークでは、議員の社会的関係の細かな構造を明らかにした（抄録）。", "fun": "自分の友達や、友達の友達までは分かっても、クラス全体の人間関係は見えない。この研究は、そうした一人の目に映る一部の関係だけから全体の関係の地図を推定する方法を作り、アメリカの議員が一緒に法案を出す関係のデータで試した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn45", "rank": 45, "field": "統計学", "headline": "低ランクテンソル分解で多変量ポアソン強度を推定", "title": "Multivariate Poisson intensity estimation via low-rank tensor decomposition", "url": "https://doi.org/10.1080/01621459.2026.2751234", "authors": "Haotian Xu ほか", "venue": "Journal of the American Statistical Association", "date": "2026-10-27", "sjr": 3.79, "citescore": 7.5, "citescore_year": "2025", "why": "題名によると、低ランクのテンソル分解による多変量ポアソン強度の推定法を示す（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Semantic Scholarに登録された抄録を使用", "preprint": false, "short": true, "p1": "非一様な点過程の多変量の強度関数を、関数空間の無限次元の行列やテンソルとみなし、低ランク分解で推定する方法を提案した（抄録）。", "p3": "行列やテンソルのランクでモデルの複雑さを制御して偏りと分散の最適な釣り合いを達成し、加法モデルや平均場モデルなど多くの多変量関数が有限ランクのテンソル表現を持つことを示した（抄録）。", "p5": "推定誤差は最適な収束率を達成し、精度を大きく高めつつ計算費用を減らした（抄録）。米国地質調査所の4次元の地震データ（緯度・経度・深さ・規模）に適用し、カリフォルニアやオクラホマなどの局所的な地震活動の模様を復元したが、カーネル法の基準は平滑化しすぎた（抄録）。", "fun": "地震がどこで、どの深さで、どの規模で起きやすいかを地図にするのは難しい。この研究は、多くの次元を持つデータを小さな部品の組み合わせに分解する数学を使い、カリフォルニアやオクラホマなどの地震の集まる場所を、従来の方法よりくっきりと描き出した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn46", "rank": 46, "field": "因果推論", "headline": "悲観的なモデルベース方策学習で動的治療方針", "title": "POLAR: A Pessimistic Model-based Policy Learning Algorithm for Dynamic Treatment Regimes", "url": "https://doi.org/10.1080/01621459.2026.2755097", "authors": "Ruijia Zhang ほか", "venue": "Journal of the American Statistical Association", "date": "2026-10-27", "sjr": 3.79, "citescore": 7.5, "citescore_year": "2025", "why": "題名によると、動的治療方針のための悲観的なモデルベース方策学習アルゴリズムを示す（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Semantic Scholarに登録された抄録を使用", "preprint": false, "short": true, "p1": "個人の経過に応じて処置を順に決める動的処置レジーム（DTR）を、既存のデータだけから最適化する悲観的なモデルベースの方策学習アルゴリズムPOLARを提案した（抄録）。", "p3": "オフラインのデータから遷移のダイナミクスを推定して各履歴と行動の組の不確かさを定量化し、不確かさの大きい行動を避けるよう報酬に悲観的な罰則を加え、学習した方策の準最適性を直接の目標にした（抄録）。", "p5": "方策の準最適性の有限標本の上界を含む統計的・計算的な保証を持つ初のモデルベースのDTR手法だとし、合成データとMIMIC-IIIで最先端の手法を上回り、ほぼ最適で履歴を考慮した治療方針を得た（抄録）。具体的な数値は抄録にない（未確認）。", "fun": "患者の状態の変化に合わせて次の治療を順に選ぶ方針を、過去の診療記録だけから学ぶのは危険も伴う。記録にほとんどない治療を「良さそう」と誤って選ぶおそれがあるからだ。この研究は、自信のない選択を控えめに扱う工夫で、安全で良い方針を学べるようにした。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn47", "rank": 47, "field": "因果推論", "headline": "テスト陰性デザインの感度分析", "title": "Sensitivity Analysis for the Test-Negative Design", "url": "https://doi.org/10.1080/01621459.2026.2754151", "authors": "Soumyabrata Kundu ほか", "venue": "Journal of the American Statistical Association", "date": "2026-10-27", "sjr": 3.79, "citescore": 7.5, "citescore_year": "2025", "why": "題名によると、テスト陰性デザインの感度分析の方法を示す（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Semantic Scholarに登録された抄録を使用", "preprint": false, "short": true, "p1": "ワクチンの効果を観察データで評価するテスト陰性デザインが、測定されない交絡を完全には制御できない場合に備え、さまざまな感度分析の方法を提案した（抄録）。", "p3": "受診行動の良い人々の部分集団での因果オッズ比について識別の仮定と推定対象を比べ、交絡の部分的な制御を調べる方法と、交絡がワクチン接種と感染の両方に与える影響を調べる方法の2つを作り、組み合わせてより狭い範囲を得た（抄録）。", "p5": "処置効果の異質性を制限して範囲をさらに絞り、テスト陰性デザインの観察データでCOVID-19ワクチンの効果の評価に適用した（抄録）。具体的な数値は抄録にない（未確認）。", "fun": "ワクチンの効果を調べるとき、病院で検査を受けた人だけを比べる方法がよく使われる。でも、検査を受けに行く人と行かない人では健康への気の配り方が違うかもしれない。この研究は、そのずれが結果をどこまで動かしうるかを確かめる方法を作り、新型コロナのワクチンに当てはめた。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn48", "rank": 48, "field": "機械学習", "headline": "スペクトル勾配フィルタで連合学習の異質性に対処", "title": "SpecGradFilter: A Spectral Gradient Filtering Framework for Taming Federated Heterogeneity", "url": "https://doi.org/10.1109/tpami.2026.3747377", "authors": "Liyang Yuan ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-26", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "題名によると、スペクトル領域の勾配フィルタで連合学習のデータの異質性に対処する（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": false, "short": true, "p1": "連合学習でクライアントごとにデータの分布が異なる（非IID）ときに起こるクライアントのずれを周波数領域から見直し、低周波の成分を抑える勾配のフィルタリングの枠組みSpecGradFilterを提案した（抄録）。", "p3": "クライアント間の勾配の食い違いが、クライアント固有の分布のずれを表す低周波の成分に集中し、細かな特徴を表す高周波の成分は比較的一致しているという「ずれのスペクトルの偏り」を見いだし、それに基づいて方法を作った（抄録）。", "p5": "FFTによる切り捨てだけでなくガウスのトレンド除去のような空間領域の近似でも有効な一般的な原理だとし、CIFAR-10/100やTiny-ImageNetの強い非IIDの設定で性能を高め、通信の負担はほとんど増えなかった（抄録）。具体的な数値は抄録にない（未確認）。", "fun": "スマホなど多くの端末が、データを手元に置いたまま協力してAIを学ぶ方法がある。ところが端末ごとにデータの偏りが違うと、学習がうまくまとまらない。この研究は、偏りの違いが「ゆっくりした大きな波」の成分に集まることを見つけ、その成分を抑えることで学習をそろえた。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn49", "rank": 49, "field": "機械学習", "headline": "最小の解釈可能部分集合で黒箱モデルの帰属を説明", "title": "Less Is More: Efficient Black-box Attribution via Minimal Interpretable Subset Selection", "url": "https://doi.org/10.1109/tpami.2026.3746930", "authors": "Ruoyu Chen ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-26", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "why": "題名によると、最小限の解釈可能な部分集合の選択で効率的な黒箱の帰属を行う（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": false, "short": true, "p1": "AIの判断に最も影響した入力の領域を特定する帰属（アトリビューション）を、順序付きの解釈可能な部分集合の選択問題として定式化し、少ない領域で忠実な説明を得る方法LiMAを提案した（抄録）。", "p3": "劣モジュラ最適化の限界利得の考え方に基づき、部分領域の間の冗長性、正の補完性、負の干渉を許す定式化をとり、意味の一貫性や予測の確信度などからなる複合目的と双方向の貪欲探索で重要な領域を順位づけた（抄録）。", "p5": "8つの基盤モデルと6つのデータセットで、InsertionとDeletionの指標をそれぞれ平均36.3%と39.6%改善し、単純な貪欲探索より1.6倍速く、誤った予測の原因の帰属では最高確信度の平均を86.1%高めた（抄録）。", "fun": "AIが写真を見て「これは鳥」と答えたとき、写真のどこを見て判断したのかを知りたい。この研究は、写真を小さな区画に分け、判断に効く区画を少しずつ選んで並べる方法で、より少ない区画で、より正確にAIの「着眼点」を示せるようにした。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "jn50", "rank": 50, "field": "機械学習", "headline": "最小分解距離でグラフをクラスタリング", "title": "Clustering Graphs Using Minimum Factori   var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
