<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

りの地すべりが後退的に進む", "title": "Differential Deformation and Retrogressive Evolution of the Linbang Landslide with Multiple Slip Surfaces under Reservoir Water-Level Fluctuations", "url": "https://doi.org/10.21203/rs.3.rs-11462870/v1", "authors": "Jibo Li ほか", "venue": "Research Square (In Review)", "date": "2026-11-13", "apa": "Li, J., Xie, M., Li, C., Ju, S., He, C., & Deng, J. (2026). Differential Deformation and Retrogressive Evolution of the Linbang Landslide with Multiple Slip Surfaces under Reservoir Water-Level Fluctuations. https://doi.org/10.21203/rs.3.rs-11462870/v1", "theme": "確率動力学・計算力学", "theme_no": 8}, {"id": "pr16", "rank": 16, "headline": "実装コードが消したパラメータを見抜く同定可能性の検査", "title": "A Screen for Computational Non-identifiability in Deployed Motor Drive Firmware", "url": "https://doi.org/10.5281/zenodo.24211524", "authors": "Yang ほか", "venue": "Zenodo", "date": "2026-11-14", "apa": "Yang, Y., Wang, D., & Xu, Z. (2026). A Screen for Computational Non-identifiability in Deployed Motor Drive Firmware (Version v6). Zenodo. https://doi.org/10.5281/ZENODO.24211524", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された再現用パッケージの説明（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "実装されたファームウェアが算術の都合で消してしまったパラメータ（計算上の同定不能）を、実際に出力される感度から見抜く検査法を示した（抄録）。", "p3": "モデルが示す感度でなく、実装されたコードが出す感度を読み、失われた方向を5つの類型に分け、量子化の幅と雑音の水準から判定の確からしさを見積もる（抄録）。", "p5": "マクロだけを切り替えた同じコードの4つのビルドでは、2つのビルドだけで該当する列のノルムと第3特異値が全5 010窓で消えた。ブラシ付きDCモーターでは10 msのループが4 mHの巻線に−26.3 mHを返しながら、RMSとR2は正常と判定し、33のファームウェアのうち5つで同じ型が見つかった（抄録）。", "fun": "機械が自分でモーターの性質を測る機能が、計算の途中でその値を捨てていても、もっともらしい数字を出し続けることがある。測定データは何も変えていないのに、プログラムの書き方ひとつで「測れるはずのもの」が測れなくなるという指摘で、誤差の指標が良くても安心できないことを教えてくれる。", "unverified": "本文は読めておらず、5つの類型の定義と判定の手順の詳細は未確認。査読前の原稿に付けた再現用パッケージである。"}}, {"id": "pr17", "rank": 17, "headline": "議決権行使の理由の開示義務で棄権が減り文は定型化", "title": "Unveiling Influence: Mandatory Disclosure of Voting Rationale", "url": "https://doi.org/10.2139/ssrn.7688938", "authors": "Sonakshi Agrawal ほか", "venue": "SSRN", "date": "2026-11-14", "apa": "Agrawal, S., & Rajput, S. (2026). Unveiling Influence: Mandatory Disclosure of Voting Rationale. https://doi.org/10.2139/ssrn.7688938", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "インドの投資信託に議決権行使の理由の記載を義務づけた2014年の制度を使い、説明の義務が行使と説明の中身をどう変えたかを示した（抄録）。", "p3": "義務化の前後で、棄権と賛成の割合、理由の文の長さと内容、議決権行使助言会社との一致、保有の変化、取締役会の変化を比べた（抄録）。", "p5": "棄権は4分の1以上減って多くが賛成に移り、理由は短く定型的で、取締役の選任では半分強が懸念を示さなかった。理由の質は企業より投信会社で決まり、文の使い回しがうかがえる。説明の義務は参加を増やすが、説明の情報価値は保証しないと結論する（抄録）。", "fun": "「理由を書きなさい」と言われると、人は棄権をやめて賛成しがちになる。しかも書かれる理由は短い決まり文句が多く、どの会社への投票でも似た文が使い回されていた。説明を義務づければ考えが深まるはず、という期待が必ずしも当たらないことを、実際の制度の変更から確かめた点が面白い。", "unverified": "本文は読めておらず、標本の規模、推定の手法、効果の大きさの数値は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "損得の枠組みでLLMエージェントの談合が変わるか", "title": "Framing Effects and Internal State Interventions on Collusive Behavior in a Long-Horizon LLM Agent", "url": "https://doi.org/10.2139/ssrn.7694219", "authors": "Harrison Margolin", "venue": "SSRN", "date": "2026-11-13", "apa": "Margolin, H. (2026). Framing Effects and Internal State Interventions on Collusive Behavior in a Long-Horizon LLM Agent. https://doi.org/10.2139/ssrn.7694219", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "実際の銀の価格操作事件を再現した市場シミュレーションで、LLMエージェントが談合に加わるかが、相手の頼み方の枠組みと内部状態への介入で変わることを示した（抄録）。", "p3": "Gemma 3 12Bを被告の立場に置き、260回のシミュレーションで利得・損失・非難・称賛の4つの枠組みで談合を持ちかけ、上司の圧力や他行の支持も加えた。第2段階では各枠組みで生じる内部状態を抜き出し、第22層に注入して再実験した（抄録）。", "p5": "損失の枠組みで参加は25%、非難で33%と、中立の5%より高かった。一方、注入した状態では逆に、損失と非難の状態は60件の依頼をすべて断らせ、利得と称賛の状態は談合を13%から32%に上げた（抄録）。", "fun": "同じお願いでも「損をしますよ」「あなたのせいになる」と言われると、AIは不正な取引に乗りやすくなった。ところが、その言葉が生む状態を直接AIの内部に入れると、反対に用心深くなった。言葉で言われることと、内側の状態を変えられることが逆向きに効く点が意外で、人の心理の研究と比べたくなる結果だ。", "unverified": "本文は読めておらず、各条件の試行数の内訳と統計検定の詳細は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "変更後も以前の同意を使えるか、調停の模擬実験", "title": "Scoped Reapproval in Computational Mediation: Agreement and Retained False Assents in the Fourth Party AI Debate", "url": "https://doi.org/10.2139/ssrn.7689638", "authors": "Kento Sasano", "venue": "SSRN", "date": "2026-11-14", "apa": "Sasano, K. (2026). Scoped Reapproval in Computational Mediation: Agreement and Retained False Assents in the Fourth Party AI Debate. https://doi.org/10.2139/ssrn.7689638", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "計算による調停で、選択肢や根拠が変わったあとに以前の同意のどこまでを確認し直すべきかを、規則ベースの模擬実験で比べた（抄録）。", "p3": "順に固定した3つの模擬実験（計341,600回）で、変更のあった構成要素だけ再承認する方式と、当事者の同意をまとめて取り直す方式を比べ、実行可能でパレート効率的な合意の割合と、誤った同意が残る回数を数えた（抄録）。", "p5": "主な格子では要素ごとの再承認が合意を1.8419ポイント上回った（改善248件、悪化なし）が、その差は回答に誤りがある場合に限られ、修正を許すとどちらの方式でも合意は下がった。要素ごとの方式は14,400回中453回で誤った同意を残した（抄録）。", "fun": "話し合いの途中で条件が変わったら、前に「いいよ」と言ったことはどこまで有効だろうか。変わった部分だけ聞き直すと合意しやすくなる一方で、本当はもう賛成していない「古い同意」が残る危険もある。日常の約束ごとにもある悩みを、34万回あまりのコンピュータ実験で損得を数えて比べたのがこの研究だ。", "unverified": "本文は読めておらず、当事者の数や回答の誤りの仮定などの設定は未確認。著者は、新しい同意の原理やAI固有の優位を示すものではないと述べている（抄録）。"}}, {"id": "pr20", "rank": 20, "headline": "従業員一人当たり売上は国内勤務の企業でだけ株価を予測", "title": "Productive at Home -- Why Revenue per Employee Predicts Stock Returns Only for US-Staffed Firms", "url": "https://doi.org/10.2139/ssrn.7687925", "authors": "Jim Liew ほか", "venue": "SSRN", "date": "2026-11-13", "apa": "Liew, J., & Liew, K. (2026). Productive at Home -- Why Revenue per Employee Predicts Stock Returns Only for US-Staffed Firms. https://doi.org/10.2139/ssrn.7687925", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "従業員一人当たり売上の高い企業が後の株式リターンで勝つのは、従業員の多くが米国で働く企業に限られることを示した（抄録）。", "p3": "米国の上位2,000銘柄を毎年6月に業種の中で、従業員一人当たり売上と、Form 5500の401(k)加入者数から作った米国勤務の比率の三分位に分け、2002年7月〜2025年12月のリターンを比べた（抄録）。", "p5": "両方とも上位の銘柄は年15.4%の超過リターン（t = 4.1）と月0.34%の6因子アルファを得たが、残る8つは年8〜12%でアルファがなく、海外勤務の多い同程度の生産性の企業は8.1%だった。一人当たり売上の高さが技術によるか海外移転によるかを公開の届出で区別できると論じる（抄録）。", "fun": "社員一人当たりの売上が多い会社は優秀そうに見えるが、手間のかかる仕事を人件費の安い海外に移しただけでも、この数字は大きくなる。そこで年金の加入者数から国内で働く人の割合を推定し、本当に技術で稼いでいる会社だけを見分けた。公開書類の組み合わせで中身を見抜く発想が面白い。", "unverified": "本文は読めておらず、取引費用の扱いと頑健性の検定の内容は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "月の砂の粒の丸みと細長さで安息角が変わる", "title": "Shape Targets for Lunar Regolith Preprocessing: A DEM Study of Roundness, Elongation and Angle of Repose", "url": "https://doi.org/10.22541/essoar.15012190/v1", "authors": "Luis Torres", "venue": "ESS Open Archive", "date": "2026-11-13", "apa": "Torres, L. (2026). Shape Targets for Lunar Regolith Preprocessing: A DEM Study of Roundness, Elongation and Angle of Repose. https://doi.org/10.22541/essoar.15012190/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "ESS Open Archiveに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "月の砂の粒を丸めると流れやすくなるかを、粒の丸みと細長さを変えた個別要素法で調べ、前処理で目指す粒の形を暫定的に提案した（抄録）。", "p3": "GPUの個別要素法（Chrono DEM-Engine）で2 mmの多球粒子を使い、丸み4水準と縦横比3水準の組み合わせで準2次元の崩落試験の安息角を求めた。接触パラメータは基準の角ばった粒が39.3 ± 0.4°になるよう較正した（模擬土LHS-1の報告値は39.6°）（抄録）。", "p5": "安息角は39.4°（角ばって細長い）から30.6°（球）まで変わり、丸み0.8以上・縦横比0.8以上では30.6〜33.5°だった。縦横比0.6では丸みを変えても36.2〜39.4°にとどまり、月の重力での計算は地球の重力と1.3°以内で一致した（抄録）。", "fun": "砂山の斜面の角度（安息角）は、粒の形で決まる。月の砂は角ばっていて機械をすり減らすので、丸めれば扱いやすくなると考えられてきたが、この計算では、粒が細長いままだと丸めてもほとんど流れやすくならなかった。重力の小さい月でも角度が地球とほぼ同じだったのも意外な点だ。", "unverified": "本文は読めておらず、実験室試験との比較は行われていない（著者は今後の確認が必要とする）。"}}, {"id": "pr22", "rank": 22, "headline": "コロンビアの10年分の同時多発地すべり8,088件を整理", "title": "A decade of rainfall- and earthquake-triggered multiple-occurrence landslide events in the Colombian Andes (2015–2025): compilation and spatial analysis", "url": "https://doi.org/10.21203/rs.3.rs-11167923/v1", "authors": "Emanuel Castillo-Cardona ほか", "venue": "Research Square (In Review)", "date": "2026-11-13", "apa": "Castillo-Cardona, E., Ruiz, D. F., Montoya-Araque, E. A., Gamboa, M. F., & Marulanda-Tobon, A. (2026). A decade of rainfall- and earthquake-triggered multiple-occurrence landslide events in the Colombian Andes (2015–2025): compilation and spatial analysis. https://doi.org/10.21203/rs.3.rs-11167923/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "コロンビアのアンデスで2015〜2025年に起きた13の同時多発地すべり（計8,088件）の目録を作り、共通する地形と、引き金による空間的な違いを示した（抄録）。", "p3": "事象の前後のSentinel-2の合成画像から手作業で地すべりを描き、既存の目録で補った。各事象を地形量、岩相、空間密度、降水、多変量の分析で比べた（抄録）。", "p5": "傾斜、流路からの距離、粗さ、集水量の4つが13の目録を一貫して分け、7事象は貫入火成岩の地域で、地すべりの70%超は粗粒の土で起きた。降雨によるものは細長く密な集まり、地震によるものはまばらで、降雨型の多くはENSOが中立の時期だった（抄録）。", "fun": "一度の大雨や地震で、何百、何千もの地すべりが同時に起きることがある。雨が原因だと細長く密集し、地震だとまばらに散らばるという違いが、衛星画像を手で描き分けた8,088件から見えてきた。13の事例を同じ物差しでそろえ、誰でも使える目録として公開した点が次の研究の土台になる。", "unverified": "本文は読めておらず、目録の精度の検証と多変量分析の手法の詳細は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "メキシコの無償の介護者と参加型研究で支え合いを組織", "title": "TERRITORIOS DE FATIGA, TERRITORIOS DE CUIDADO – Hallazgos a partir de un proceso de investigación acción participativa con cuidadoras no remuneradas en México", "url": "https://doi.org/10.5281/zenodo.24219691", "authors": "Vasil'eva, Jana", "venue": "Zenodo", "date": "2026-11-14", "apa": "Vasil'eva, J. (2025). TERRITORIOS DE FATIGA, TERRITORIOS DE CUIDADO – Hallazgos a partir de un proceso de investigación acción participativa con cuidadoras no remuneradas en México [Zenodo]. https://doi.org/10.5281/ZENODO.24219691", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された学位論文の抄録（スペイン語・英語、候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "メキシコの無償の介護を担う女性たちと参加型アクション・リサーチを行い、彼女たちが自らを権利・知識・必要をもつ人として捉え直し、組織化する過程を記録した学位論文（抄録）。", "p3": "5つのサイクルで、音声の語り、フォトボイス、創作などの芸術的な方法と、学習サークルや作業部会などの民衆教育を組み合わせ、社会的連帯経済による解決策を考えた。経験を体系化するサイクルで分析を深めた（抄録）。", "p5": "国の中部・北部・南部の介護者をつなぐ集団「Yo Cuido México」の結びつきが強まり、協働の方法論が固まった。コロナ禍の孤立に応える場となり、沈黙させられてきた声と専門性を響かせる認識的な正義の実践になったと述べる（抄録）。", "fun": "家族の介護は給料が出ないため仕事と見なされにくく、担い手は孤立しがちだ。この研究では、研究者が一方的に調べるのではなく、介護者自身が写真や音声で経験を語り、一緒に解決策を考えた。調べること自体が声を上げる場をつくることになっている点がユニークだ。", "unverified": "本文は読めておらず、参加者の人数と各サイクルの具体的な内容は未確認。"}}, {"id": "pr24", "rank": 24, "headline": "感情的な要求が営業職の回復力と無理な出勤を強める", "title": "Untangling The Double-Edged Role Of Emotional Demands In Resilience And Presenteeism In B2B Salespeople: The Analysis Of Ingredients And Recipes", "url": "https://doi.org/10.2139/ssrn.7698041", "authors": "Rıfgı Buğra Bağcı ほか", "venue": "SSRN", "date": "2026-11-13", "apa": "Bağcı, R. B., Golgeci, I., Gizlier, Ö., & Demirkıran, M. (2026). Untangling The Double-Edged Role Of Emotional Demands In Resilience And Presenteeism In B2B Salespeople: The Analysis Of Ingredients And Recipes. https://doi.org/10.2139/ssrn.7698041", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。Industrial Marketing Managementに掲載された論文。本文は未取得", "preprint": false, "short": true, "p1": "B2B営業職では、感情的な要求が回復力を高める一方で、体調が悪くても出勤するプレゼンティーイズムも強めるという両面性を示した（抄録）。", "p3": "仕事の要求度-資源理論に基づき、PLS-SEMとfsQCAで、感情的な要求、回復力、自発的・非自発的なプレゼンティーイズム、協働的な文化の関係を分析した（抄録）。", "p5": "感情的な要求は回復力を高め、両方のプレゼンティーイズムを直接強めた。回復力は自発的なプレゼンティーイズムへの経路だけを媒介し、協働的な文化はその影響を弱めた。fsQCAは2種類のプレゼンティーイズムに別々の条件の組み合わせがあることを示した（抄録）。", "fun": "打たれ強い人ほど、体調が悪くても自分から出勤してしまう。回復力という長所が無理をする原因にもなりうるという結果だ。周りと協力し合う職場の雰囲気があると、その無理は弱まった。良い性質が裏目に出る仕組みを、2つの分析方法で確かめている。", "unverified": "標本の規模と測定尺度は抄録に記載がなく未確認。"}}, {"id": "pr25", "rank": 25, "headline": "買い物の頻度と生鮮品の消費は同時決定、効果は小さい", "title": "Shopping is Access: Shopping Frequency, Fresh Produce Consumption, and Food Retail Environments", "url": "https://doi.org/10.2139/ssrn.7688438", "authors": "Scott Colby", "venue": "SSRN", "date": "2026-11-13", "apa": "Colby, S. (2026). Shopping is Access: Shopping Frequency, Fresh Produce Consumption, and Food Retail Environments. https://doi.org/10.2139/ssrn.7688438", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "世帯は生鮮品の消費量と買い物の頻度を同時に選ぶという仮説を検証し、両者は互いに正の影響を持つが、頻度が消費を増やす効果は小さいことを示した（抄録）。", "p3": "食品が傷む費用と買い物の負担の釣り合いから両者が同時に決まるとし、世帯のパネルデータで連立方程式を操作変数法で推定した（抄録）。", "p5": "生鮮品の消費と買い物の頻度は同時に決まり、双方向に正の関係にあるが、頻度の因果効果は控えめな大きさだった。店へのアクセスを改善して買い物の回数を増やしても、健康的な食品の消費を増やす政策としては効果が薄い可能性があると結論する（抄録）。", "fun": "近くに八百屋ができて買い物に行く回数が増えれば、野菜をたくさん食べるようになりそうだ。ところが、野菜を食べたい人がよく買い物に行くという逆向きの関係も混ざっていて、回数そのものの効果は小さかった。原因と結果が絡み合ったデータをほどく難しさがよく分かる例だ。", "unverified": "本文は読めておらず、データの出典、期間、操作変数の内容、効果の数値は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "AIが媒介する会計業務で専門職が考える人間の価値", "title": "HARDER, BETTER, FASTER, STRONGER: HUMAN VALUE IN AI-MEDIATED ACCOUNTING", "url": "https://doi.org/10.2139/ssrn.7687926", "authors": "Caio Alexandrino Costa Areias ほか", "venue": "SSRN", "date": "2026-11-13", "apa": "Areias, C. A. C., Tronbjerg Villafuerte Bertolli Moreira, L., & Fonseca, N. C. (2026). HARDER, BETTER, FASTER, STRONGER: HUMAN VALUE IN AI-MEDIATED ACCOUNTING. https://doi.org/10.2139/ssrn.7687926", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "AIが媒介する会計・財務の意思決定のもとで、専門職が人間の価値をどう捉えているかを5つの階層的な次元に整理した（抄録）。", "p3": "職業的アイデンティティ論、技術的失業論、ポランニーの暗黙知に基づき、組織の指導者、財務の専門職、教育者の11人に半構造化面接を行う現象記述学的な研究（抄録）。", "p5": "人間の価値は、残った効率、検証、文脈と感情の調整、倫理的な取捨、省察的な著者性の5つの包含的な階層として現れた。初歩の作業を自動化すると暗黙知の習得が途切れる「若手の逆説」を示し、技術的失業論を熟練の再生産に注目する流れの論理に広げる（抄録）。", "fun": "AIが集計や下書きを代わりにやってくれると、新人は楽になる。しかし、その地味な作業こそがベテランの勘を身につける練習だったとしたらどうだろう。目先の効率化が将来の専門家を育たなくするかもしれないという「若手の逆説」は、会計に限らずどの職場にも当てはまる問いだ。", "unverified": "面接は11人で、参加者の国や組織の内訳は抄録からは未確認。"}}, {"id": "pr27", "rank": 27, "headline": "一人の会社でLLMエージェント126体を組織図で運用", "title": "An Organization Chart of LLM Agents in a One-Person Software Company: An Empirical Case Study of Routing, User-Rule Memory, and Rework", "url": "https://doi.org/10.5281/zenodo.24212965", "authors": "Lee, Jaein", "venue": "Zenodo", "date": "2026-11-14", "apa": "Lee, J. (2026). An Organization Chart of LLM Agents in a One-Person Software Company: An Empirical Case Study of Routing, User-Rule Memory, and Rework (Version v1). Zenodo. https://doi.org/10.5281/ZENODO.24212965", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "一人のソフトウェア会社で、LLMのサブエージェントを15部門・126体の組織として運用した記録から、組織の成長、規則の記憶、手直しの頻度を報告した事例研究（抄録）。", "p3": "ローカルのセッションログ、アプリのデータベース、git履歴、所有者の規則の記憶だけから集計し、手直しの依頼をローカルLLMのラベル付けで判定した（抄録）。", "p5": "登録エージェントは10月初めの33体から11月中旬の126体に増え、規則の記憶は81ファイルたまった。最初のラベル付けは所有者の判断と一致せず（κ = 0.05）、改訂版はκ = 0.526で、入力した追加の指示の10.4%が修正かやり直しの依頼と判定されたが、その推移はラベル付けの版で逆転した（抄録）。", "fun": "AIのエージェントを会社のように部署と部長に分けて働かせたら、実際どうなるのか。記録から見えたのは、組織が数週間で4倍近くに膨らむ様子と、AIに作業の出来を判定させても人の判断となかなか一致しないという難しさだった。数字の出し方しだいで結論が逆になることを正直に書いている点も参考になる。", "unverified": "本文は読めておらず、ルーティングの正確さは参照データに該当例がなく測れていない（抄録）。"}}, {"id": "pr28", "rank": 28, "headline": "ポート・ハミルトン構造を保つ潜在力学で熱の縮約モデル", "title": "Graph Autoencoders with Structure-Preserving Port-Hamiltonian Latent Dynamics for Thermal Reduced-Order Modelling in Directed Energy Deposition", "url": "https://doi.org/10.5281/zenodo.24218585", "authors": "Allaham, Obada", "venue": "Zenodo", "date": "2026-11-14", "apa": "Allaham, O. (2026). Graph Autoencoders with Structure-Preserving Port-Hamiltonian Latent Dynamics for Thermal Reduced-Order Modelling in Directed Energy Deposition. Zenodo. https://doi.org/10.5281/ZENODO.24218585", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "有限要素メッシュ上のグラフ自己符号化器と、エネルギー散逸と安定性を構造的に保証するポート・ハミルトンNNを組み合わせ、移動熱源の熱解析の縮約モデルを作った（抄録）。", "p3": "1,836節点の金属積層造形（DED）の熱問題で、POD、MLP自己符号化器、グラフ自己符号化器（GAE）、変分グラフ自己符号化器の4つの圧縮法を、4本の軌跡で学習し未知の21本のレーザー経路で比べた（抄録）。", "p5": "既定の設定ではGAEの試験RMSEが2.81 Kと最小で（MLP 3.26 K、POD 3.53 K）、MLPより学習パラメータが57%少なかったが、5つの乱数種ではGAEとMLPは統計的に同等だった。PODは学習軌跡が2本だけのとき最もデータ効率がよかった（抄録）。", "fun": "大きなシミュレーションを速く回すには、重要な動きだけを残した「縮約モデル」を作る。これまでの代表的な方法は直線的な組み合わせしか扱えず、レーザーの周りの急な温度差が苦手だった。網の目の形のまま学習し、エネルギーが勝手に増えない構造を組み込んだ点が工夫で、圧縮の良さは動きの予測と合わせて評価すべきだという教訓も示している。", "unverified": "本文は読めておらず、計算時間の短縮の程度は抄録からは未確認。"}}, {"id": "pr29", "rank": 29, "headline": "カルスト網の不均質性が層流と乱流の流れを支配", "title": "Heterogeneity and structural controls on laminar and turbulent flow in karstic networks", "url": "https://doi.org/10.22541/essoar.15012178/v1", "authors": "Tobias Markus Grundhöfer ほか", "venue": "ESS Open Archive", "date": "2026-11-13", "apa": "Grundhöfer, T. M., Kordilla, J., & Dentz, M. (2026). Heterogeneity and structural controls on laminar and turbulent flow in karstic networks. https://doi.org/10.22541/essoar.15012178/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "ESS Open Archiveに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "カルストの洞窟網では、管径の不均質さの配置によって層流と乱流が混在し、網全体の流れが実効的なダルシー・フォルヒハイマー式に従うことを示した（抄録）。", "p3": "管径の分布が広い迷路状の合成ネットワーク（ランダム、多変量ガウス、連結した構造）と実際の洞窟網の類似体で、ダルシー・ワイスバッハの流れを解析し、平均の流量と圧力勾配の関係、乱流の管の割合、巨視的な摩擦係数を調べた（抄録）。", "p5": "フォルヒハイマーの係数は網の構造で変わり、太い管が連結した網で実効透水性が最大、摩擦が最小だった。局所の管径ごとの流れの解析から、細い管と太い管で水理の振る舞いが異なる2つの部分網があり、浸透の閾値で区分できることを示した（抄録）。", "fun": "地下の洞窟の水の通り道は、太い管と細い管が入り組んだ迷路だ。太い管では水が渦を巻いて流れ（乱流）、細い管では静かに流れる（層流）。どちらの性質が全体を支配するかは、太い管がつながって一本道になっているかどうかで決まるという結果で、ネットワークのつながり方が流れを決める面白さがある。", "unverified": "本文は読めておらず、実際の洞窟網の類似体の規模とモデルの検証の詳細は未確認。"}}, {"id": "pr30", "rank": 30, "headline": "顧客の厳しい要求が営業職のサービス革新を促す", "title": "Harnessing Customer Demands For Service Innovation In Business-To-Business Sales: Evidence From The Turkish HVAC Industry", "url": "https://doi.org/10.2139/ssrn.7698198", "authors": "Rıfgı Buğra Bağcı ほか", "venue": "SSRN", "date": "2026-11-13", "apa": "Bağcı, R. B., Poyraz, M. Z., & Golgeci, I. (2026). Harnessing Customer Demands For Service Innovation In Business-To-Business Sales: Evidence From The Turkish HVAC Industry. https://doi.org/10.2139/ssrn.7698198", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。Technovationに掲載された論文。本文は未取得", "preprint": false, "short": true, "p1": "B2B営業職では、顧客の要求の厳しさは、営業職の回復力と機敏さを介したときにだけサービス革新行動を高めることを示した（抄録）。", "p3": "仕事の要求度-資源理論に基づく説明的順次型の混合研究で、トルコの空調設備業界のB2B営業職224人をPLS-SEMで分析し、続く質的な事例研究で仕組みを補った（抄録）。", "p5": "顧客の要求の厳しさは、回復力と機敏さに媒介される場合にだけサービス革新行動に正の影響を持った。質的な知見は、営業職が適応の能力を身につければ厳しい顧客が革新を促しうることを示唆した（抄録）。", "fun": "わがままな顧客はふつう厄介な存在だが、見方を変えると新しいサービスを考えるきっかけにもなる。ただし、それが良い方向に働くのは、営業担当者に立ち直る力と素早く動く力があるときだけだった。同じ困難が人によって成長の種にも重荷にもなる、という職場でよくある話を数字と聞き取りで確かめている。", "unverified": "本文は読めておらず、効果の大きさと質的な事例研究の規模は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "成長期のベンチャーで組織構造が従業員の主体性を抑える", "title": "The Responsiveness-Consistency Paradox In Professionalizing Ventures: Employee Agency, Organizational Structures, And Unintended Consequences", "url": "https://doi.org/10.2139/ssrn.7698099", "authors": "Ximena Alejandra Rojas Sierra ほか", "venue": "SSRN", "date": "2026-11-13", "apa": "Alejandra Rojas Sierra, X., Golgeci, I., & Leeb, C. (2026). The Responsiveness-Consistency Paradox In Professionalizing Ventures: Employee Agency, Organizational Structures, And Unintended Consequences. https://doi.org/10.2139/ssrn.7698099", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。Scandinavian Journal of Managementに掲載された論文。本文は未取得", "preprint": false, "short": true, "p1": "成長の途中のテクノロジー・ベンチャーで、素早い対応と手順の一貫性という相反する要求が、組織の構造によって従業員の主体性を制約し、意図しない結果を生むことを示した（抄録）。", "p3": "規制の厳しい業界で専門化を進めるベンチャー1社の質的な事例研究で、39の面接、数週間の観察、フォーカス・グループ、文書資料を構造化理論の視点で分析した（抄録）。", "p5": "指導者が厳しい手順を課しながら素早い行動も求めたため、従業員は対応の速さを保つために正式な構造を迂回し、組織の動きと利用者中心性に意図しない影響が出た。「両立」の戦略が常に望ましいわけではないと論じる（抄録）。", "fun": "「ルールは守れ、でも早くやれ」と同時に言われたら、現場はどうするだろうか。この会社では、社員がこっそりルールを回り道して速さを保ち、それが別の問題を生んだ。矛盾した指示の両方に応えようとする姿勢がかえって組織をゆがめることを、現場の観察から描いている。", "unverified": "本文は読めておらず、意図しない結果の具体的な内容は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "ライブコマースの購買を条件の組み合わせで説明", "title": "Finding Your Buyer: How Configurational Analysis Reveals Five Purchase Segments", "url": "https://doi.org/10.21203/rs.3.rs-10890285/v1", "authors": "xiaojun mai ほか", "venue": "Research Square (In Review)", "date": "2026-11-13", "apa": "mai, x., Fauziah, Sh. A., Wang, Y., & sun, n. (2026). Finding Your Buyer: How Configurational Analysis Reveals Five Purchase Segments. https://doi.org/10.21203/rs.3.rs-10890285/v1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "農産物のライブコマースでは、信頼・愛着・心理的所有のどれも購買に必須ではなく、5つの異なる条件の組み合わせが購買を生むことを示した（抄録）。", "p3": "農産物のライブコマースの経験がある中国の消費者393人の調査を、必要条件分析（NCA）、fsQCA、PLS-SEMで分析した（抄録）。", "p5": "NCAでは信頼を含めどの条件も高い購買意図に必須ではなく、fsQCAは購買に十分な5つの組み合わせ（消費者像）を示した。PLS-SEMではすべての信頼性の次元に有意な純効果があったが、専門性は心理的所有を通じては働かなかった（抄録）。", "fun": "ライブ配信で農産物を売る小さな配信者は、すべての面で完璧である必要はない。信頼できる人、親しみのある人、詳しい人など、買う人のタイプに合った長所が1つあれば売れる道がある。「何が効くか」より「誰に何が効くか」を問う発想の転換が面白い。", "unverified": "横断調査のため因果は推論できず、中国の農産物以外への一般化は未確認（抄録）。"}}, {"id": "pr33", "rank": 33, "headline": "公開の財務データで銀行のデジタル化の影響を測る", "title": "Assessing The Financial Footprint Of Bank Digital Transformation Through Public Financial Data", "url": "https://doi.org/10.2139/ssrn.7688500", "authors": "Nikolay Lazarov", "venue": "SSRN", "date": "2026-11-13", "apa": "Lazarov, N. (2026). Assessing The Financial Footprint Of Bank Digital Transformation Through Public Financial Data. https://doi.org/10.2139/ssrn.7688500", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "公開の会計データだけで、銀行のデジタル化の財務的な痕跡を、利益の因果効果と主張せずに評価する透明な手順を示した（抄録）。", "p3": "費用効率、営業レバレッジ、人員の生産性、投資の強さ、収益の構成、引当前の収益性に関わる10の指標を選び、ブルガリアの5大銀行グループの2020〜2025年を縦断的に比べた。自分を除く同業比較、構造変化の扱い、感度分析、信用リスクの検証を組み合わせた（抄録）。", "p5": "効率の水準と改善の軌跡は必ずしも一致せず、生産性の向上が費用の圧迫や不十分なリスクの証拠と共存しうる、まちまちの財務パターンが見られた。デジタル成熟度の順位づけではなく、限定つきの再現可能な評価を支えるものと位置づける（抄録）。", "fun": "銀行が「デジタル化に成功した」と言うとき、決算書のどこを見ればそれが分かるのだろうか。この研究は、1つの比率だけで成功と判断せず、10の指標を合わせて読み、分からないことは分からないと明示する手順を作った。派手な順位をつけないこと自体を方法の強みにしている点がユニークだ。", "unverified": "本文は読めておらず、各銀行グループの具体的な指標の値は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "文化の違う人々が共に生きる条件を規範的に検討", "title": "差異のなかで共に生きる ―文化的差異、規範的当事者性、社会的役割と共生の条件―", "url": "https://doi.org/10.5281/zenodo.24221754", "authors": "takarabe", "venue": "Zenodo", "date": "2026-11-14", "apa": "takarabe. (2026). 差異のなかで共に生きる ―文化的差異、規範的当事者性、社会的役割と共生の条件― (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.24221754", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された日本語の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "文化・言語・社会的役割の異なる人びとが、共通の価値観や親密さを前提とせずに公正に共生する条件を規範的に検討し、「保障継続・負担非転嫁の移行命題」を条件付きで示した（抄録）。", "p3": "家族・地域・学校・職場の仮想事例で、守るべき利益、必要な行為、義務の名宛人、負担と残余の応答を区別し、臨時の援助が保障の事実上の担い手になった局面を検討した（抄録）。", "p5": "正当な制度的保障の役割をもつ主体がいる場合、援助者に継続義務を根拠なく推定せず、受益者の保護が途切れないよう暫定措置・担当の移行・期限・異議の理由を説明する必要が生じうると論じ、学校の安全通知の事例で条件を変えて検討した（抄録）。", "fun": "困っている人を善意で助け続けていたら、いつの間にかその人が「頼りにされる係」になってしまうことがある。本来の担当がいるのに、善意の人にだけ負担が残るのは公正だろうか。この論考は、助けを途切れさせずに、正しい担い手へ引き継ぐための条件を考えている。", "unverified": "本文は読めておらず、四つの共生評価観点の内容は未確認。著者は普遍的な必要十分条件や実証された理論としては主張しないとしている（抄録）。"}}, {"id": "pr35", "rank": 35, "headline": "沿岸の軟弱地盤で道路下の欠陥の成因を事例ごとに特定", "title": "Formation and Evolution of Shallow Subsurface Defects beneath Urban Roads in Coastal Soft Ground", "url": "https://doi.org/10.21203/rs.3.rs-11449981/v1", "authors": "Hongbo Zhou ほか", "venue": "Research Square (In Review)", "date": "2026-11-13", "apa": "Zhou, H., Zhao, R., Wang, Y., & Cui, Y. (2026). Formation and Evolution of Shallow Subsurface Defects beneath Urban Roads in Coastal Soft Ground. https://doi.org/10.21203/rs.3.rs-11449981/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "沿岸の軟弱地盤で都市道路の下にできる浅い欠陥10件について、複数の調査を組み合わせて事例ごとに成因を推定し、変化の型と破壊に至る条件付きの経路を整理した（抄録）。", "p3": "地中レーダー、ボーリングとコア、FWD試験、排水管のカメラ調査、埋設物の探知、履歴の記録、現地踏査で調べ、発生源の確認、空間と標高の整合、過程と観測の整合、代替の説明で候補の原因を評価した（抄録）。", "p5": "4件では地質の不均質が最も支持され、残りでは斜面・盛土の変形、非開削工事の乱れ、管の損傷による内部侵食、重交通による累積変形が程度の差はあれ支持された。異常の面積が変わらないか縮んでも安定化を意味しないことを、指標の食い違いから示した（抄録）。", "fun": "道路の下にできた空洞は、外から見えないうちに大きくなることがある。原因は地盤のむら、工事、水道管の破損、重いトラックの繰り返しなどさまざまで、1つの調査だけでは決めきれない。いくつもの手がかりを探偵のように突き合わせて犯人を絞り込む手順を示している点が面白い。", "unverified": "本文は読めておらず、各欠陥の大きさと再調査の間隔は未確認。"}}, {"id": "pr36", "rank": 36, "headline": "メコンデルタの洪水への適応を性別の緩慢な暴力として", "title": "Rethinking Climate Adaptation through Gendered Slow Violence in Can Tho City in the Mekong Delta, Viet Nam", "url": "https://doi.org/10.21203/rs.3.rs-11349685/v1", "authors": "Danang Aditya Nizar ほか", "venue": "Research Square (In Review)", "date": "2026-11-13", "apa": "Nizar, D. A., & Dang, L. Q. (2026). Rethinking Climate Adaptation through Gendered Slow Violence in Can Tho City in the Mekong Delta, Viet Nam. https://doi.org/10.21203/rs.3.rs-11349685/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "ベトナム・カントー市の洪水の多い地域で、女性たちの日々の適応の努力が積み重なった負担を、性別による「緩慢な暴力」として捉え直すべきだと論じた（抄録）。", "p3": "緩慢な暴力とフェミニスト政治経済学、社会的再生産による消耗の概念に基づき、年齢・社会経済的背景・障害の有無の異なる7人の女性に半構造化面接と参与観察を行った（抄録）。", "p5": "女性たちは洪水を身体的・感情的・経済的な負担のつながりとして経験し、介護や生計の調整、家計の管理で危険に対処していたが、その努力は続く脆弱さと共存していた。適応の費用が家庭生活に埋め込まれると、被害が不正義として認識されにくくなると論じる（抄録）。", "fun": "毎年のように洪水が来る町では、水があふれることが「いつものこと」になり、人びとは工夫して暮らしを続ける。しかし、その工夫の多くを女性が黙って背負っているとき、それは見えにくい暴力ではないか、という問いかけだ。慣れてしまった苦労ほど社会の問題として扱われにくい、という指摘が鋭い。", "unverified": "参加者は7人の質的研究で、一般化の範囲は抄録からは未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "考えるか即答するかを1つのモデルが選ぶ", "title": "The Value of Thinking: Learning When to Reason in Hybrid Decision Models", "url": "https://arxiv.org/abs/2611.16961", "authors": "Zhengxu Yu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-13", "why": "推論の長さを短くする従来の方法と異なり、1回の順伝播の内部の暗黙の思考で即答するか、Tトークンの自己回帰的な推論を行うかの二者択一（zero-or-T）を提案した。凍結した1つの基盤モデルで両方の様式を担い、考える価値があるときだけ推論するハイブリッド決定モデル（HDM）として実現した。"}, {"id": "pn02", "rank": 2, "field": "機械学習", "headline": "潜在空間の動画生成モデルを画素空間に持ち上げる", "title": "Back to Pixels: Lifting Latent Video Diffusion into Pixel Space", "url": "https://arxiv.org/abs/2611.17336", "authors": "Yanke Song ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-13", "why": "最先端の動画生成はVAEで時空間に圧縮した潜在空間で動くため、解像度を倍にするとトークン数が4倍になり、条件づけも複数フレームのまとまり単位になる。PixVidは学習済みの潜在動画モデルを、各フレームを画素空間で直接生成するように持ち上げる単純な方法である。"}, {"id": "pn03", "rank": 3, "field": "統計学", "headline": "学習目的と評価の損失がずれる機械学習予測の比較の推論", "title": "Orthogonal Inference for Machine Learning Forecasts", "url": "https://doi.org/10.2139/ssrn.7687819", "authors": "Alberto Quaini", "venue": "SSRN", "date": "2026-11-13", "why": "機械学習の予測は意思決定に関わる損失と異なる目的で学習されることがあり、推定誤差が見かけの予測力の優位を生む。局所的に頑健な推定に基づき、推定の一次の感度を取り除くスコアを作って、母集団の評価リスクの差を推論する方法を確立した。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "黒人世帯は同じ質の住宅に2019年でも6%多く払う", "title": "Racial Segmentation in the US Housing Market", "url": "https://doi.org/10.2139/ssrn.7700525", "authors": "Brian Higgins", "venue": "SSRN", "date": "2026-11-13", "why": "所得を条件にしても黒人世帯は家賃が低く、安価な住宅に住み、持ち家率が低い。1960〜2019年に家賃と住宅価値の差はおよそ半減したが、持ち家の差はほとんど変わらなかった。賃貸と持ち家の割当モデルで、黒人世帯が同等の質に1960年は平均21%、2019年は6%多く払っていたと推定し、消費の不平等の新しい指標を示す。"}, {"id": "pn05", "rank": 5, "field": "組織行動・心理的安全性", "headline": "女性が指導役に名乗り出ない背景に相対的な自信の差", "title": "Follow Me If I Dare: The Role of Confidence in the Gender-Leadership Gap", "url": "https://doi.org/10.2139/ssrn.7687759", "authors": "Clémentine Bouleau ほか", "venue": "SSRN", "date": "2026-11-14", "why": "助言で集団の結果に影響できる指導役を設けた2つの実験室実験で、女性が指導役に名乗り出にくい理由を調べた。第1の実験は、他者と比べた自分の成績についての信念（相対的な自信）が主な候補であることを示し、第2の実験は雑音のある成績のフィードバックで自信を無作為に変えてその役割を確かめた。"}, {"id": "pn06", "rank": 6, "field": "経済学", "headline": "富の格差への懸念が危機時の金融安定化策への支持を変える", "title": "Wealth Inequality and Public Support for Financial Stabilization in Economic Crises", "url": "https://doi.org/10.31235/osf.io/r75zh_v3", "authors": "Björn Bremer ほか", "venue": "SocArXiv", "date": "2026-11-13", "why": "金融市場の安定化策は資産を持つ世帯に有利に働き、富の格差を強めうる。コロナ禍のあと、オーストラリアと英国の5,000人以上に情報提供とコンジョイントの調査実験を行い、富の格差への懸念が危機時の金融安定化策への支持をどう形づくるかを調べた。"}, {"id": "pn07", "rank": 7, "field": "政治学", "headline": "気候政策をめぐる感情的な分極と政治的信頼", "title": "Is Making Climate Policy Breaking Our Society? Issue-based Affective Polarization over Climate Policy and Why Political Trust Matters", "url": "https://doi.org/10.2139/ssrn.7688624", "authors": "Aya Kachi ほか", "venue": "SSRN", "date": "2026-11-14", "why": "気候政策で意見の違う相手に敵意を抱かずに意見を違えられるかを、オーストラリア・チリ・メキシコ・英国の全国代表のオンライン調査で、意見を同じくする人と違う人への親近感の差として測った。誰がこの感情的な分極を持ち、政治的信頼がどう関わるかを分析する。"}, {"id": "pn08", "rank": 8, "field": "経済学", "headline": "AI資本は小企業ほど自前の投資を押し上げる", "title": "Artificial Intelligence Capital and Organic Growth: The Firm-Size Paradox", "url": "https://doi.org/10.2139/ssrn.7684107", "authors": "Ke Bi", "venue": "SSRN", "date": "2026-11-13", "why": "AI人材の雇用、市場価値、資本蓄積の枠組みから企業ごとのAI資本を作り、米国上場企業の自前の投資（設備投資とR&D）との関係を調べた。AI資本は大企業に集中するが、1標準偏差の増加はその後の自前の投資の22.10%の増加と関連し、その関連は小企業で強いと報告する。"}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "関税発表の日のドル安は米国債離れでなく株の入れ替え", "title": "The Liberation Day Tariff Dollar Puzzle: Equity Rotation, Not Flight from Treasuries&nbsp;", "url": "https://doi.org/10.2139/ssrn.7684058", "authors": "Rashad Ahmed ほか", "venue": "SSRN", "date": "2026-11-13", "why": "2025年4月2日の大幅な関税の発表と9日の一部撤回の両日に、ドルが不可解に下落した。分単位の資産価格と、運用方針・資産・投資家の居住地別の日次の資金フローを組み合わせ、米国債からの逃避でなく株式の入れ替えによるポートフォリオ・バランスの説明と整合する事実を示す。"}, {"id": "pn10", "rank": 10, "field": "工学", "headline": "石けん膜の原理で格子構造に強さと粘りを両立", "title": "Capillarity-toughened (CAT) Hybrid Structures: Stiffness and Toughness by Design", "url": "https://doi.org/10.2139/ssrn.7688978", "authors": "Wen Luo", "venue": "SSRN", "date": "2026-11-13", "why": "3Dプリントした格子を紫外線硬化樹脂に浸して引き上げると、表面張力で開口部に極小曲面の薄膜と太いプラトー境界ができ、硬化させると脆い骨格としなやかで粘り強い第2の相を組み合わせた混成構造になる。この毛細管で強靭化した（CAT）格子という新しい種類の構造材料を提案する。"}, {"id": "pn11", "rank": 11, "field": "機械学習", "headline": "時間変化に強く説明も安定した不正取引のグラフ検知", "title": "Drift-Resilient Explainable Graph Learning for Financial Fraud Detection: Joint Evaluation of Risk Calibration and Explanation Stability", "url": "https://doi.org/10.2139/ssrn.7684419", "authors": "Jingyun Yang ほか", "venue": "SSRN", "date": "2026-11-13", "why": "カードや端末を共有する組織的な決済不正をグラフニューラルネットワークで検知するとき、分布の変化は精度だけでなくリスク得点の較正と説明の安定性も損なう。GraphSAGEの検知器に順伝播型の自動微分による正確な勾配×入力の寄与を付け、3つの性質を合わせて評価し維持する枠組みを示す。"}, {"id": "pn12", "rank": 12, "field": "経済学", "headline": "所得を聞かないアフリカの世論調査に消費を補完", "title": "Estimating Economic Class in Afrobarometer Using Survey-to-Survey Imputation", "url": "https://doi.org/10.2139/ssrn.7687039", "authors": "S&eacute ほか", "venue": "SSRN", "date": "2026-11-14", "why": "アフリカ全体の世論調査アフロバロメーターは第2回以降、所得や消費を集めていない。49の消費調査で推定したモデルから第3〜9回の302,595人に消費を多重補完し、世界銀行の国別分布に合わせて、公表された5つの定義で経済階層を分類した。"}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "人とロボットとシミュレーションの操作データを共に学ぶ", "title": "EgoX: Egocentric Cross-Embodiment Manipulation with Embodiment Dreaming", "url": "https://arxiv.org/abs/2611.16728", "authors": "Yaru Niu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-13", "why": "人、実ロボット、シミュレーションの操作の示範は形態・感覚・制御が異なり、まとめて学ぶのが難しい。EgoXは意味が対応する観測と行動の様式で示範を整理し、身体の違いを想像する「Embodiment Dreaming」付きのモジュール型Transformer（MXT+）を混合データで事前学習する。"}, {"id": "pn14", "rank": 14, "field": "政治学", "headline": "選挙不正の統計的検出で誤検知を減らす非パラメトリック法", "title": "The Anatomy of an Anomaly: Addressing False Positives in Nonparametric Election Forensics The 2024 Pennsylvania Presidential Election&nbsp;", "url": "https://doi.org/10.2139/ssrn.7688307", "authors": "Kirill Kalinin", "venue": "SSRN", "date": "2026-11-13", "why": "選挙フォレンジクスでは、行政上の不均一さと実際の不正を区別すること（誤検知の問題）が課題である。パラメトリックな手法を補う独立の診断として非パラメトリックな枠組みを提案し、2024年の米国ペンシルベニア州の大統領選挙に適用した。"}, {"id": "pn15", "rank": 15, "field": "統計学", "headline": "商品説明を学んだ言語モデルで競売の最低価格を決める", "title": "Setting Optimal Reserve Prices using Fine-Tuned Language Models", "url": "https://doi.org/10.2139/ssrn.7697462", "authors": "Joshua Foster ほか", "venue": "SSRN", "date": "2026-11-13", "why": "オンラインの競売では商品の説明文に需要の情報が含まれるが、既存の方法は属性を事前に指定する必要がある。入札の構造的な尤度を目的に学習済みの文埋め込みモデルを微調整し、出品の説明と過去の入札から品物ごとの最低落札価格を入札前に設定できるかを検証した。"}, {"id": "pn16", "rank": 16, "field": "政治学", "headline": "中南米の政体と経済の成績、左右の差は制度で消える", "title": "Institutions, Not Ideology: Political Regimes and Macroeconomic Performance in Latin America, 1924-2023", "url": "https://doi.org/10.2139/ssrn.7689478", "authors": "Jose Alberro", "venue": "SSRN", "date": "2026-11-14", "why": "1924〜2023年の中南米20か国（2,000の国・年）で政体の種類とインフレ・成長の関係を推定した。左右の政権のインフレ率の11ポイントの差は、国の固定効果、世界的なショック、外れ値の国を統制すると1ポイント未満に縮むことを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "1924〜2023年の中南米20か国で、左右の政権の違いはインフレと成長をほとんど説明せず、制度とショックが重要であることを示した（抄録）。", "p3": "2,000の国・年の観測で政体の種類とインフレ率・実質成長率の関係を推定し、国の固定効果、世界的な時期のショック、外れ値の国を統制した。自己申告の代わりにV-Demの専門家の符号化も使い、中央銀行の独立性の指標も結合した（抄録）。", "p5": "左右のインフレ率の差は統制前の11ポイントから1ポイント未満に縮み、成長率も左右で区別できなかった。ただし1930〜44年には差が有意で、1990年以降は有意でなかった。法的な中央銀行の独立性はインフレを大きく下げ、大きな経済の主なインフレは石油価格の暴落と債務危機で説明できるとする（抄録）。", "fun": "「左派の政府はインフレを起こしやすい」という俗説は、100年分のデータで見ると、国ごとの事情や世界的な出来事を考えに入れた途端にほぼ消えてしまう。代わりに効いていたのは、中央銀行を政治から切り離す制度だった。誰が政権を握るかより、どんなルールで動くかが大事だという結論が面白い。", "unverified": "本文は読めておらず、中央銀行の独立性の効果の単位の解釈と推定式の詳細は未確認。"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "労働供給の摩擦が最適な長期の税制を変える", "title": "Labor Supply Frictions and Optimal Long-Run Fiscal Policy", "url": "https://doi.org/10.2139/ssrn.7686965", "authors": "Youngsoo Jang ほか", "venue": "SSRN", "date": "2026-11-14", "why": "働くかどうかの固定費用と標準労働時間への集中という、ミクロデータで知られる2つの摩擦を、保険のない個人のリスクがある経済に入れ、ラムゼー最適な長期の財政政策を分析した。予告された増税への課税ベースの反応を経路と時期で分解し、参加の余地の扱いによって内点のラムゼー定常状態が生じるかが変わることを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "働くかどうかの固定費用と標準労働時間への集中という2つの摩擦を入れると、ラムゼー最適な長期の税率が没収的な水準でなく約69%に定まることを示した（抄録）。", "p3": "保険のない個人のリスクがある経済で、家計が働くかと何時間働くかを選び、政府は家計と同じ割引率を持つとした。予告された増税への課税ベースの反応を、経路と時期に分けて分解した（抄録）。", "p5": "内点のラムゼー定常状態の候補は、参加の選択と固定費用を組み合わせたときにだけ生じた。それらがないと家計は課税前に多く働き、税率は100%に近づくが、あると課税時の就業の減少が事前の増加を上回り、時間の制約が長期の税率を約69%に下げた（抄録）。", "fun": "将来の増税が予告されると、人は今のうちに稼ごうと多く働くので、理論上は政府が税率をどこまでも上げたくなってしまうことがある。ところが、働き始めるにも費用がかかる、勤務時間はだいたい決まっている、という現実の事情を入れると、その極端な結論が消えた。小さな現実味が政策の答えを大きく変える例だ。", "unverified": "本文は読めておらず、モデルの較正に使ったデータと頑健性の検討は未確認。"}}, {"id": "pn18", "rank": 18, "field": "機械学習", "headline": "一緒に動く車がドローン動画の手ぶれ補正を引きずる", "title": "Consensus Capture in Reference-Based UAV Video Stabilization: A Benchmark on Dynamic Urban Scenes", "url": "https://arxiv.org/abs/2611.17190", "authors": "Robert Fonod ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-13", "why": "ホバリングするドローンの動画を基準フレームに重ねる手ぶれ補正で、交差点で一緒に動く車両の対応点が推定を車の動きに引き寄せる「合意の捕獲」を定義し、それと、それを防ぐための物体のマスキングを測る2部構成のベンチマークを作った。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに登録されたarXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "ドローン動画の基準フレームへの手ぶれ補正で、一緒に動く車両の対応点が推定を車の動きに引き寄せる「合意の捕獲」を定義し、それを測るベンチマークを作った（抄録）。", "p3": "4Kの空撮フレームで正解の射影変換が分かる静的なプロトコルと、前景の動きの量とまとまりが異なるホバリング動画を使う動的なプロトコルで、10の処理系を、背景の位置合わせ、物体の位置の誤差、動く集団の変位への追従の割合で採点した（抄録）。", "p5": "静的な場面では調整したAKAZE、RootSIFT、SIFT、BRISKが上位で、マスキングの損失は0.005未満だった。マスクなしのORBはリアルタイムで304組中28組で捕獲され、角の誤差の中央値は18.8画素なのに内点の数と比率は普通に見えた。マスキングはすべての処理系で捕獲をなくした（抄録）。", "fun": "空から交差点を撮った動画の手ぶれを直すとき、背景の建物ではなく、まとまって動く車の列に合わせてしまう失敗がある。しかも見かけの指標では正常に見えるので気づきにくい。多数決が正しいとは限らないことを、画像の位置合わせで示した点が面白い。", "unverified": "本文は読めておらず、疑似正解の作り方と動的な場面の選び方の詳細は未確認。"}}, {"id": "pn19", "rank": 19, "field": "機械学習", "headline": "LLMエージェントのキャッシュが誤った操作を実行する危険", "title": "Groundhog: A Benchmark for Safe Caching in Tool-Calling LLM Agents", "url": "https://doi.org/10.2139/ssrn.7688298", "authors": "Harsh Dubey ほか", "venue": "SSRN", "date": "2026-11-13", "why": "同じ要求に保存した応答を返すキャッシュは、道具を呼ぶLLMエージェントでは、誤った一致が取り消せない操作を実行させうる。顧客対応・コード・データの3領域11種の課題で、キャッシュの節約と失敗を測るベンチマークGroundhogを作った。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "道具を呼ぶLLMエージェントで、保存した応答を返すキャッシュがどれだけ本当に節約し、何を壊すかを測るベンチマークGroundhogを作った（抄録）。", "p3": "顧客対応・コード・データの3領域で、似た言い回しなら同じ操作、前回から状況が変わっていない、などのキャッシュの前提を1つずつ崩す11種の課題を作り、7つのシステムを評価した（抄録）。", "p5": "GenCacheはキャッシュなしに比べ93.8%のトークンを節約したが、誤った操作や答えの実行を除くと22.2%にとどまり、GPTCacheは8.7%と0.8%だった。何かを節約したすべてのシステムが、33の課題・領域の組の1〜12で、頼まれていない高リスクの操作を実行した（抄録）。", "fun": "同じ質問には前の答えを使い回せば、AIの利用料を節約できる。しかし「似た言葉」でも中身が違う依頼に昔の答えを返すと、AIエージェントは頼まれていない取り消せない操作まで実行してしまう。節約の数字の裏に危険が隠れていることを、わざと前提を崩す問題で暴いている。", "unverified": "本文は読めておらず、評価した7つのシステムの設定の詳細は未確認。"}}, {"id": "pn20", "rank": 20, "field": "組織行動・心理的安全性", "headline": "忠誠な派閥を作るための選別の理論", "title": "Building A Loyal, Cohesive Team Of Your Own: A Screening-Based Theory of Faction Formation", "url": "https://doi.org/10.2139/ssrn.7686400", "authors": "Bo Feng ほか", "venue": "SSRN", "date": "2026-11-14", "why": "派閥の成功が協調行動と成員の見えない忠誠心に依存するとき、指導者が費用のかかる選別で忠誠者を見分け日和見主義者を除く理論を作った。忠誠心が十分強いと規模の拡大より選別を優先し、最適な選別の強さは初期の支持基盤などと単調でない関係になる。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "派閥の指導者が、費用のかかる選別で忠誠な成員を見分けて派閥を作る過程を理論化し、エリートの実質的な権力の蓄積に微視的な基礎を与えた（抄録）。", "p3": "派閥の成功が協調した集団行動と、成員の見えない内発的な忠誠心に依存するモデルで、指導者が候補者から忠誠者を見分け、日和見主義者を除く選別の強さを選ぶ（抄録）。", "p5": "忠誠心が十分に強いと、指導者は派閥の規模の拡大より集中的な選別を優先し、最適な選別の強さは指導者の初期の支持基盤とも派閥の利益の配分とも単調でない関係になった。制度の弱い環境での粛清などの現象を説明すると述べる（抄録）。", "fun": "仲間を集めるとき、人数を増やすか、本当に信頼できる人だけに絞るかは悩ましい。このモデルでは、忠誠心がとても大切な場面ほど、指導者は数より選別を優先するようになる。歴史上の厳しい粛清も、こうした計算から説明できるかもしれないという視点がユニークだ。", "unverified": "本文は読めておらず、理論の予測を実データで検証しているかは未確認。"}}, {"id": "pn21", "rank": 21, "field": "統計学", "headline": "相手の能力・意図・変化の速さを分けて推論する確率モデル", "title": "A Stochastic Theory of Adaptive Social Inference Under Environmental and Intentional Uncertainty Identifiability, Nonlinear Filtering, and Experimental Design", "url": "https://doi.org/10.2139/ssrn.7688918", "authors": "Rajit Chatterjea ほか", "venue": "SSRN", "date": "2026-11-13", "why": "他者から学ぶとき、相手の能力、現在の意図、行動の変わる速さという異なる量を推論する必要がある。これらを1つの潜在傾向にまとめがちな階層ベイズ学習モデルに対し、平均回帰する拡散過程などで分けた部分観測の確率モデルを作り、同定可能性、非線形フィルタリング、実験計画の限界を明示する。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "他者から学ぶときの相手の能力・意図・行動の変わる速さを分けた部分観測の確率モデルを作り、観測が1つの指標にしか依存しないと区別できないことを証明した（抄録）。", "p3": "能力と基準の変動性は平均回帰する拡散過程、意図は変動性に制御された平均回帰のジャンプ拡散過程で表し、観測は条件付き独立な標識付き点過程とした。非線形フィルタリングと実験計画の観点から分析した（抄録）。", "p5": "観測の経路が能力と意図の1つのスカラー指標にしか依存しなければ、潜在状態の1次元の族に沿った動きは区別できない（構造的な障害）。感度ベクトルが線形独立な2つの較正された観測経路でこの曖昧さが除かれることとフィッシャー情報量の階数条件を示し、クシュナー・ストラトノビッチのフィルタ方程式を導いた（抄録）。", "fun": "相手が失敗したとき、それは下手だからか、わざとか、それとも最近調子が変わったのか。1種類の観察だけでは、この3つを原理的に見分けられない場合があることを数学で示した。見分けるには性質の違う観察をもう1つ用意すればよい、という答えは、実験や調査の設計にも通じる。", "unverified": "本文は読めておらず、実験データへの適用があるかは未確認。"}}, {"id": "pn22", "rank": 22, "field": "統計学", "headline": "締め切り内に返す端末上の予測でモデルと処理器を選ぶ", "title": "Deadline-Aware Model and Processor Selection for On-Device Intent Prediction", "url": "https://doi.org/10.2139/ssrn.7685361", "authors": "Wenbin Shang ほか", "venue": "SSRN", "date": "2026-11-13", "why": "次に開くアプリの予測などは短い締め切りまでに返さないと役に立たない。処理器の競合で遅延が裾の重い分布になることを踏まえ、要求ごとに圧縮したモデルの版と使う処理器の構成を同時に選ぶ問題を扱う。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "端末上の予測を締め切りまでに返すため、圧縮したモデルの版と使う処理器の構成を要求ごとに選ぶ実行系CRISPを作り、締め切りを逃す率を目標以下に保った（抄録）。", "p3": "遅延をモデルに依存しない対数の減速率に正規化し、実行待ちの長さなどの安価なスケジューラの情報で裾の分布を条件づけ、構成ごとにコンフォーマルなずれで補正する時間切れの危険の推定器を作った。その上で、締め切りに間に合う精度から見逃しの価格を引いた量を最大化する（抄録）。", "p5": "実機と公開のアプリ利用データ（LSApp）で、4つの負荷条件（うち1つは未学習）を通じて、目標2%に対して締め切りを逃す率を平均1.7%に保ち、特権の構成の使用は予算10に対して毎秒12.0で、常に優先する方式は53を要した。比較の方式は4.0%と2.4%を逃した（抄録）。", "fun": "スマホが次に開くアプリを予想して先に準備しておく機能は、予想が間に合わなければ意味がない。ところがスマホは裏で別の仕事もしていて、計算にかかる時間が時々大きく延びる。その延び方を見積もって、毎回ちょうどよいモデルと計算資源を選ぶ工夫で、遅刻をほぼ目標どおりに抑えた。", "unverified": "本文は読めておらず、予測の精度そのものの変化は抄録からは未確認。"}}, {"id": "pn23", "rank": 23, "field": "統計学", "headline": "実際の利用者の質問で調査エージェントを評価する難しさ", "title": "Evaluating a Deep-Research Agent on Real-User Questions: An Exploratory Case Study in Measurement Sensitivity", "url": "https://doi.org/10.2139/ssrn.7687566", "authors": "Sahil Chutani", "venue": "SSRN", "date": "2026-11-14", "why": "公開の対話データの72,371件の最初の質問から、多段の絞り込みと人の確認で84の調査計画の質問と根拠つきのチェックリストを作り、調査エージェントの回答をローカルのLLM判定者で採点して、評価の結論が測り方にどれだけ左右されるかを探索した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "実際の利用者の質問で調査エージェントを評価すると、結論がチェックリストの粒度や回答のばらつきに大きく左右されることを示した探索的な事例研究（抄録）。", "p3": "2つの公開の対話データの72,371件の最初の質問から、多段の絞り込み、独立の監査、人の確認で84の調査計画の質問と根拠つきのチェックリストを作り、OpenResearcher-30B-A3Bの回答をローカルのLLM判定者で3回採点して多数決をとった（抄録）。", "p5": "得点のある79件でエージェントは中核の要求の約半分を満たした（平均48.1%）。チェックリストの項目を分割するだけで同じ回答の平均点が39.7%から49.3%に上がり、同じ質問への2つの回答は平均18.4ポイント違った。判定者は3回の92%で一致したが、人の評価との照合は10件だけだった（抄録）。", "fun": "AIの調べもの能力を点数で比べるとき、採点表の項目を細かく分けるだけで、同じ答えの点数が10ポイント近く上がってしまった。テストの点が、答えの良し悪しより採点の仕方で変わるという、学校の試験にも通じる教訓だ。著者が自分の結果の弱さまで正直に数字で示している点も好ましい。", "unverified": "著者は、エージェントの性能もチェックリストの妥当性も測ってはいないと述べている（抄録）。"}}, {"id": "pn24", "rank": 24, "field": "経済学", "headline": "市場を分けて予測すると株式のリスクプレミアムが当たる", "title": "Component-Based Machine Learning Forecasting of the Market Risk Premium", "url": "https://doi.org/10.2139/ssrn.7687839", "authors": "Valentyn Khmarskyi", "venue": "SSRN", "date": "2026-11-13", "why": "市場のリスクプレミアムの予測が弱いのは集計の偏りのためだとし、特性に基づくクラスタリングで市場を経済的に異なる部分ポートフォリオに分けると、時系列の予測可能性がずっと強いことを示した。機械学習で市場について4.25%の標本外決定係数を得たと報告する。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "市場のリスクプレミアムが予測しにくいのは集計の偏りのためだとし、市場を部分ポートフォリオに分けて予測すると標本外でも予測できることを示した（抄録）。", "p3": "移動窓で企業の特性に基づくクラスタリングを行い、市場ポートフォリオを経済的に異なる部分ポートフォリオに分解し、機械学習で各部分のリターンを予測して組み合わせた（抄録）。", "p5": "部分ポートフォリオのリターンは市場全体よりずっと強い時系列の予測可能性を示し、1か月先の市場のリターンで過去平均を基準に4.25%の標本外決定係数を得た。成績はクラスタリングの基準や期間によらず、予測に基づく売買は有意なシャープレシオと経済的な価値の改善をもたらした（抄録）。", "fun": "株式市場全体の動きを予想するのは難しいが、それは中身の違う会社をまとめて平均してしまうからかもしれない。性質の似た会社のグループに分けてそれぞれ予想し、あとで合わせると当たりやすくなった。全体を見るより、まず部分に分けて考えるという発想の転換が面白い。", "unverified": "本文は読めておらず、取引費用の考慮と使った機械学習の手法の詳細は未確認。"}}, {"id": "pn25", "rank": 25, "field": "経済学", "headline": "自動マーケットメーカーの予測市場での合理的期待均衡", "title": "Rational Expectations Equilibrium with an Automated Market Maker", "url": "https://doi.org/10.2139/ssrn.7696623", "authors": "Ping Liu ほか", "venue": "SSRN", "date": "2026-11-13", "why": "対数市場評価ルールで注文を一括して執行する自動マーケットメーカーの予測市場で、情報の取得に費用がかかるグロスマン-スティグリッツ型の合理的期待均衡を特徴づけた。十分に流動的な市場では、流動性が価格の情報性を高めるのは、より多くの取引者に情報を集めさせることを通じてだけだと示す。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "自動マーケットメーカーが運営する予測市場で、情報の取得に費用がかかるグロスマン-スティグリッツ型の合理的期待均衡を特徴づけた（抄録）。", "p3": "マーケットメーカーが対数市場評価ルールですべての注文を一括で執行し、情報を持たない取引者は執行価格から信念を更新するモデルで、流動性、ノイズ取引、情報の価値の関係を分析した（抄録）。", "p5": "十分に流動的な市場では、流動性が価格の情報性を高めるのは、価格が0か1に振れるのを抑えて情報の価値を上げ、より多くの取引者に情報を取得させることを通じてだけだった。ノイズ取引が情報を持つ取引者を守るのは一定の範囲までで、マーケットメーカーの期待収支は浅い市場で正、深い市場で負になる（抄録）。", "fun": "「明日雨が降るか」に賭ける予測市場では、価格がそのまま確率の予想になる。調べる手間をかけて情報を集める人がいないと価格は賢くならないが、市場が深すぎても浅すぎても、その手間に見合う得が消えてしまう。市場の仕組みの設計が、どれだけ人に考えさせるかを左右するという話だ。", "unverified": "本文は読めておらず、数値例の有無と前提の詳細は未確認。"}}, {"id": "pn26", "rank": 26, "field": "経済学", "headline": "当日満期のプット売りのプレミアムは本物か", "title": "The Zero-Days-to-Expiry Put-Credit Premium from Traded Option Bars: Real, Mostly Not Drift, and Priced by First-Day Shocks", "url": "https://doi.org/10.2139/ssrn.7687498", "authors": "Heng Zhang", "venue": "SSRN", "date": "2026-11-13", "why": "大型株指数ファンドの当日満期のプット・クレジット・スプレッドの売りで得られるプレミアムが、モデル値でなく実際に取引されたオプションの記録で評価しても存在するか、相場の上昇傾向以上のものか、事前に定めた規則で損失を避けられるかを、約2年半のデータで検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "当日満期（0DTE）のSPYのプット・クレジット・スプレッドの売りで得られるプレミアムは実在し上昇傾向だけでは説明できないが、事前登録した基準は満たさないことを示した（抄録）。", "p3": "約2年半のOPRAの実際の取引記録で価格をつけ、時系列の分割、一度だけ使う保留データ、週単位のクラスター・ブートストラップ、上昇傾向を除いた残差の対照を備えたオープンソースのエンジンで、事前に固定した検定を行った（抄録）。", "p5": "基本の設定は往復費用を仮定したあとで1回あたり幅の+55.7と+71.6ベーシスポイントを得て、勝率は95.2%だった。市場の方向は利得の13〜30%を説明し、残差は両方の分割で正だったが、週単位ブートストラップの下限はわずかに0を下回った。事前登録した120の日中の管理規則はどれも保有を上回らなかった（抄録）。", "fun": "毎日少しずつ確実に稼げる取引が、ときどき大きく損をする。この研究によると、損はたいてい穏やかな日の次の、ショックの初日にやってくるので、「穏やかな日だけ取引する」ルールはかえって成績を悪くした。うまい話の落とし穴を、後出しを禁じた厳しい手順で確かめている。", "unverified": "本文は読めておらず、言語モデルの規則の結果の続きと費用の仮定の詳細は未確認。"}}, {"id": "pn27", "rank": 27, "field": "経済学", "headline": "法人の設立件数は経済全体の生産を予測するか", "title": "Does Legal Entity Formation Predict Changes In Aggregate Economic Product? Evidence From A Census Of U.S. Entities", "url": "https://doi.org/10.2139/ssrn.7694241", "authors": "Fernan Restrepo ほか", "venue": "SSRN", "date": "2026-11-13", "why": "企業を事業所でなく資産を区分する法的な器として捉える法の企業理論に立ち、米国の法人の全数データで、法人の設立が経済全体の生産の変化を予測するかを調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "米国で過去約25年に設立された法人の全数データで、州の法人の設立件数が民間部門の生産の伸びを強く予測し、事業所の設立を考慮しても予測力が残ることを示した（抄録）。", "p3": "企業を事業所の集まりとする経済学の見方と、資産を区分する法的な器とする法の企業理論を対比し、法人の設立と事業所の設立の両方で州の生産の伸びを予測した（抄録）。", "p5": "州レベルの法人の設立は同じ州の民間部門の生産の伸びの強い予測因子で、その効果は事業所の設立を考慮しても残った。法人は生産の器としてだけでなく、資産を負債に効率よく担保させて資本の費用を下げることで成長に寄与しうると論じる（抄録）。", "fun": "会社をつくると聞くと、店や工場ができる様子を思い浮かべるが、書類の上だけの会社も多い。そうした法人の数が、実際の工場や店の数とは別に、経済の伸びを予想する手がかりになるという結果だ。「会社とは何か」という見方の違いが、経済統計の読み方を変える点が面白い。", "unverified": "本文は読めておらず、効果の大きさと因果の解釈の範囲は未確認。"}}, {"id": "pn28", "rank": 28, "field": "経済学", "headline": "EU単一市場への輸出が技術ライセンスを促すか", "title": "Regulatory Boundaries and the Governance of Innovation: Technology Licensing and Exports in the EU Single Market", "url": "https://doi.org/10.2139/ssrn.7687118", "authors": "Tedi Skiti ほか", "venue": "SSRN", "date": "2026-11-14", "why": "欧州共同体イノベーション調査のミクロデータで、EU単一市場への輸出が（域外への輸出と比べて）企業が技術をライセンスで外部に商業化する確率に影響するかを調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "EU単一市場への輸出が、企業が技術をライセンスで外部に商業化する確率に影響するかを、欧州共同体イノベーション調査のミクロデータで調べた（抄録）。", "p3": "EU域内への輸出と域外への輸出を比べ、統合された規制環境が技術移転の必要を減らし、域内のライセンス先が競争相手になる危険を高めるため、EUへの輸出企業はライセンスしにくいという仮説を検証した（抄録）。", "p5": "抄録には仮説と分析の枠組みが書かれているが、推定の結果は記載されておらず未確認（抄録）。", "fun": "技術を自分で製品にして売るか、他社に使用料を取って貸すか。同じルールで動く大きな市場では、貸した相手がすぐ手ごわい競争相手になりかねない。市場の制度の違いが、発明の使い道の選び方まで変えるかもしれないという問いが面白い。", "unverified": "推定の結果と効果の大きさは抄録に記載がなく未確認。"}}, {"id": "pn29", "rank": 29, "field": "政治学", "headline": "設備を転用できる自動車企業ほど脱エンジン規制を支持", "title": "Asset Specificity in Climate Politics: How Polluting Firms Become Climate Policy Supporters", "url": "https://doi.org/10.31219/osf.io/52u8e", "authors": "Jonas Fischer", "venue": "OSF: Open Science Framework", "date": "2026-11-13", "why": "汚染産業の既存企業が気候政策を妨げることはよく知られるが、どうして支持に回るのかは見過ごされてきた。EUの内燃機関の段階的廃止をめぐり、既存の資産を電気自動車の生産に転用できる能力が、自動車業界の企業の政治的な選好の違いを説明することを示す。", "explain": {"basis": "抄録", "basis_note": "OSFに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "EUの内燃機関の段階的な廃止をめぐり、既存の資産を電気自動車の生産に転用できる能力が、自動車企業の政治的な選好の違いを説明することを示した（抄録）。", "p3": "排出の多さに加えて資産の特殊性という第2の次元を導入し、2035年の内燃機関の廃止に対する自動車業界の業界内・業界間の選好の違いを分析した（抄録）。", "p5": "資産の特殊性が低い排出の多い企業は、座礁資産の脅威に資産の転用で応えられた。ただし事業から撤退した企業だけが確かな気候政策の支持者になり、多角化した企業は柔軟性を損なう政策に慎重なままだった（抄録）。", "fun": "環境規制に反対しそうな自動車会社の中にも、エンジン車の禁止を支持する会社がある。その違いは、工場や設備を電気自動車用に作り替えられるかどうかで説明できるという。会社の主張は理念だけでなく、手持ちの設備の事情で決まるという見方が面白い。", "unverified": "本文は読めておらず、分析した企業の数とデータの種類は未確認。"}}, {"id": "pn30", "rank": 30, "field": "政治学", "headline": "政治的資本主義の月次指標と民主主義の短期の変化", "title": "Political Capitalism and Democracy in the Short Run", "url": "https://doi.org/10.2139/ssrn.7685960", "authors": "Martin Paldam ほか", "venue": "SSRN", "date": "2026-11-13", "why": "2001〜2023年の政治的資本主義の新しい月次の指標を作った。多頭制の指標が10年安定したなかで途中に跳ぶ41の事例を自然実験として使い、政治的資本主義の変化と民主主義の変化の時間的な前後関係を調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "政治的資本主義の新しい月次の指標を作り、民主主義の急な変化との前後関係から、民主主義の変化が政治的資本主義を動かす方向の効果が明確だが小さいことを示した（抄録）。", "p3": "2001〜2023年の月次の指標と、年次の多頭制（ポリアーキー）の指標を使い、多頭制が10年間安定したなかで途中に跳ぶ41の事例を自然実験とし、跳ぶ前後60か月の政治的資本主義の変化を比べた（抄録）。", "p5": "民主主義の跳躍の前の変化からは非常に小さな効果しか見られず、跳躍の後には、政治的資本主義の水準が予想どおりの方向に8%変わる、明確だが控えめな効果が現れた（抄録）。", "fun": "政治と経済の癒着が民主主義を弱めるのか、民主主義が変わると癒着が変わるのか。にわとりと卵のような問題を、民主主義の指標が急に跳んだ瞬間の前と後を比べるという工夫で見分けようとした。原因と結果の順番を時間差で探る発想が面白い。", "unverified": "本文は読めておらず、政治的資本主義の指標の作り方の詳細は未確認。"}}, {"id": "pn31", "rank": 31, "field": "政治学", "headline": "政情不安はフィリピンの株価にほぼ影響しない", "title": "The Effect of Political Instability on Stock Markets: Evidence from the Philippines using Three Approaches​", "url": "https://econpapers.repec.org/RePEc:bhd:dpaper:202519", "authors": "Tristan A. Canare ほか", "venue": "RePEc NEP", "date": "2026-11-02", "why": "Googleトレンド、ニュース記事の語の検索、具体的な事件の一覧の3つの方法で政治的不安定さを測り、VARとGARCHでフィリピンの株式市場との関係を分析した。全体として政治的不安定さは株式のリターンに有意な影響を持たないと報告する。", "explain": {"basis": "抄録", "basis_note": "RePEc（NEP）に登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "フィリピンでは、政治的不安定さは全体として株式のリターンの水準と関係しないが、ストや抗議、弾劾、クーデターなどは変動を大きくし、特定の事件は水準も動かすことを示した（抄録）。", "p3": "政治的不安定さをGoogleトレンドの検索量、ニュース記事の語の検索、具体的な事件の一覧の3つの方法で測り、前の2つにはVARとGARCH、3つめにはイベントスタディを適用した（抄録）。", "p5": "政治的不安定さは全体として株式のリターンの水準と有意な関係がなかったが、スト・抗議・集会・弾劾・クーデター・反乱に関わる不安定さはリターンの変動の大きさと関連した。弾劾裁判の結審、一部のクーデター未遂、一部の大統領選は株価の水準に影響した（抄録）。", "fun": "政治が荒れると株価が下がると思いがちだが、全体として見ると平均の値動きとは関係がなかった。代わりに、値動きの「揺れの大きさ」が増えたり、決定的な出来事の日にだけ反応したりする。不安定さを3通りの物差しで測り比べた慎重さも参考になる。", "unverified": "本文は読めておらず、分析期間とデータの頻度は未確認。"}}, {"id": "pn32", "rank": 32, "field": "経営学", "headline": "事業部制と経営者の不注意が競争を変える", "title": "Strategic Inattention and the Competitive Effects of Divisionalization", "url": "https://doi.org/10.2139/ssrn.7690298", "authors": "Promit K. Chaudhuri", "venue": "SSRN", "date": "2026-11-14", "why": "企業が自律した事業部の数と、経営者が自社の生産の業界全体への影響を考慮するかを選ぶ寡占モデルで、すべての純粋戦略均衡で実効的な行動が対称になることを示し、製品の代替性が高まると均衡が繰り返し移り変わりうることを主な結果とする。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "企業が事業部の数と経営者の注意（自社の生産が業界全体に与える影響を考えるか）を選ぶ寡占モデルで、事業部制が戦略的な不注意を置き換えて競争を和らげうることを示した（抄録）。", "p3": "組織構造と経営者の注意が合わせて企業の実効的な行動（生産を抑える程度）を決めるモデルで、純粋戦略の均衡と、製品の代替性が変わったときの組織の選択を分析した（抄録）。", "p5": "すべての純粋戦略均衡で実効的な行動は対称になり、代替性が高まると戦略的な不注意と完全な注意の間の移行が繰り返し起こりうる。事業部制を選べると不注意がより穏やかな注意深い組織に置き換わり、利潤は上がるが消費者余剰と総余剰は下がる（抄録）。", "fun": "会社がわざと「周りを気にしない」経営者を置くと、強気に生産して競争で有利になることがある。この理論では、部署を増やすという別の手段が使えると、その必要がなくなり、かえって競争が穏やかになって消費者が損をする。組織の形が市場の競争の激しさまで左右するという発想が面白い。", "unverified": "本文は読めておらず、モデルの仮定（需要関数など）の詳細は未確認。"}}, {"id": "pn33", "rank": 33, "field": "経営学", "headline": "実力で組む対戦で相手の評価値を見せるべきか", "title": "Rating Disclosure in Assortative Contests: Matching Precision and Strategic Feedback", "url": "https://doi.org/10.2139/ssrn.7689058", "authors": "Wataru Nozawa", "venue": "SSRN", "date": "2026-11-13", "why": "評価値で対戦相手を組み合わせるプラットフォームが、相手の評価値を見せるかどうかの選択を分析した。隠す方針と見せる方針の差を、費用の曲率によるジェンセン項と戦略的な損失に分解する。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "評価値で対戦相手を組み合わせるプラットフォームが相手の評価値を見せるべきかを分析し、限界費用の曲率と組み合わせの精度で答えが変わることを示した（抄録）。", "p3": "参加者がガウス分布の自分の評価値を知り、プラットフォームは組み合わせを固定して総努力を最大化する。隠す方針と見せる方針の差を、限界費用の曲率によるジェンセン項と戦略的な損失に分解した（抄録）。", "p5": "完全な組み合わせの近くではジェンセン項が2次、戦略的な損失が4次で、限界費用の曲率が正なら隠す方が、費用が2次式なら見せる方が有利になった。曲率が正でほぼ2次の費用では、完全な組み合わせの周りの帯で隠す方が好まれ、その幅は曲率の比の平方根に比例する（抄録）。", "fun": "ゲームの対戦で、相手の実力の数字を見せた方が人は頑張るのか、隠した方が頑張るのか。隠されると、自分の実力が平均に近い人ほど接戦を予想して頑張る、という意外な効果がある。答えが努力の「疲れ方」の形で変わるという、細やかな理論の結論が面白い。", "unverified": "本文は読めておらず、実データでの検証の有無は未確認。"}}, {"id": "pn34", "rank": 34, "field": "経営学", "headline": "戦略的マーケティングの両利きが営業部門の報酬を左右", "title": "The Value Of The Sales Function: A Multilevel Examination Of The Effect Of Strategic Marketing Ambidexterity And Industry Contingencies", "url": "https://doi.org/10.2139/ssrn.7698663", "authors": "Ali Reza Keshavarz ほか", "venue": "SSRN", "date": "2026-11-13", "why": "フランスで営業職が100人を超えるB2B製造業の縦断パネルを階層線形モデルで分析し、戦略的マーケティングの両利きと、その業界の豊かさ・変動性との交互作用が、営業部門の相対的な報酬水準を決めることを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。Journal of Business Researchに掲載された論文。本文は未取得", "preprint": false, "short": true, "p1": "戦略的マーケティングの両利きとその業界の条件との交互作用が、企業の中での営業部門の相対的な報酬水準を決めることを示した（抄録）。", "p3": "フランスで営業職が100人を超えるすべてのB2B製造業の複数年の縦断パネル（2つの出典）を階層線形モデルで分析した（抄録）。", "p5": "戦略的マーケティングの両利きと、業界の豊かさ・変動性との交互作用が営業部門の相対的な報酬の有意な決定要因だった。両利きの2つの次元である革新性とマーケティング資源の豊富さは報酬に逆の効果を持ち、業界の豊かさ・変動性・競争性はそれぞれ異なる形で交互作用した（抄録）。", "fun": "会社の中で営業部門がどれだけ高い給料をもらえるかは、営業担当者の頑張りだけでなく、会社の戦略と業界の状況で決まる。新しさを追う会社とマーケティングに資源を注ぐ会社で、営業の扱いが逆になるという結果は、給料が組織の考え方を映す鏡であることを示している。", "unverified": "本文は読めておらず、効果の大きさは未確認。掲載は2022年の論文で、SSRNへの登録が新しい。"}}, {"id": "pn35", "rank": 35, "field": "経営学", "headline": "製造業のデジタル・サービス化での枠組みのずれ", "title": "Working Through Frame Incongruences: A Process Perspective On (Re) Framing For Digital Servitization", "url": "https://doi.org/10.2139/ssrn.7698560", "authors": "Jawwad Raja ほか", "venue": "SSRN", "date": "2026-11-13", "why": "産業企業がデジタル・サービスを取り込むとき、その変化がどう枠づけられ直されるかを1社の縦断的な事例研究で追い、動機・診断・予後の枠づけが段階的に展開し、枠組みのずれが生じる過程を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "産業企業がデジタル・サービス化を進める過程で、関係者の間の枠組みのずれを経営陣が整えて「当面の確実さ」をつくり、戦略を前に進めることを示した（抄録）。", "p3": "1社の産業企業の縦断的で探索的な詳細な事例研究で、デジタル・サービス化をめぐる組織の枠づけと枠づけ直しの活動を追った（抄録）。", "p5": "動機・診断・予後の枠づけが段階的に展開し、関係者の集団の間で枠組みのずれが生じた。経営陣は枠組みの拡張・翻訳・明確化で整合を図り、一時的な「働ける確実さ」の状態がデジタル・サービス化の戦略を進める触媒になった（抄録）。", "fun": "機械を売っていた会社がデジタルのサービスで稼ごうとすると、部署ごとに「何のための変化か」の受け止め方がずれる。経営陣は、その意味を言い換えたり広げたりして、ひとまず皆が動ける程度の共通の見通しをつくった。完全な合意でなく「とりあえず進める確かさ」が鍵だったという点が面白い。", "unverified": "本文は読めておらず、対象企業の業種と調査期間は未確認。"}}, {"id": "pn36", "rank": 36, "field": "組織行動・心理的安全性", "headline": "破綻したB2B企業の指導者の印象管理", "title": "Impression Management And Leadership In Failing Or Failed Business-To-Business Firms During And Post-COVID-19: Empirical Insights From Africa", "url": "https://doi.org/10.2139/ssrn.7698662", "authors": "Obinna Alo ほか", "venue": "SSRN", "date": "2026-11-13", "why": "ガーナとナイジェリアの質的データで、コロナ禍でのB2B企業の破綻と、指導者の印象管理の役割を調べた。技術の知識とオンライン事業の欠如が事業の継続を難しくしたことなどを報告する。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。Industrial Marketing Managementに掲載された論文。本文は未取得", "preprint": false, "short": true, "p1": "コロナ禍でのアフリカのB2B企業の破綻と、それを防ぐ指導者の役割と印象管理を、ガーナとナイジェリアの質的データで示した（抄録）。", "p3": "ガーナとナイジェリアのB2B企業の事例の質的データを分析した（抄録）。", "p5": "企業は機敏で積極的だったが、コロナ禍は一部で衰退と破綻を引き起こし、技術の知識とオンライン事業の欠如が事業の継続を難しくした。破綻を避けるには市場と非市場の戦略の釣り合いが必要で、柔軟な働き方と従業員の管理が役立ち、制度の支援がなくても多くの企業がデジタル技術を素早く取り入れた（抄録）。", "fun": "危機のときに会社を救うのは、商品やお金だけではない。指導者が取引先や従業員にどう見られるかを整える「印象管理」も、生き残りの手段になる。支援の乏しい環境でも、会社がデジタルの道具を素早く取り入れて危機を機会に変えた例が描かれている。", "unverified": "事例の数と面接の規模は抄録に記載がなく未確認。掲載は2023年の論文で、SSRNへの登録が新しい。"}}, {"id": "pn37", "rank": 37, "field": "地震工学・防災", "headline": "鋼製貯槽の地震レジリエンスを損傷と復旧時間で評価", "title": "Seismic Resilience Quantification of Steel Storage Tanks: Integrating Fragility, Recovery Time, and Mitigation Strategies", "url": "https://doi.org/10.21203/rs.3.rs-11529282/v1", "authors": "Ahmed Mohammed Khayoon Alhussein ほか", "venue": "Research Square (In Review)", "date": "2026-11-14", "why": "容量32,000 m³の鋼製貯槽で、詳細な非線形有限要素解析と増分動的解析から4つの損傷状態のフラジリティ曲線を作り、地震後の機能の損失と復旧時間を含めてレジリエンスを定量化する枠組みを提案した。", "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "容量32,000 m³の鋼製貯槽の地震レジリエンスを、損傷の確率・機能の損失・復旧時間から定量化し、免震が最も効果的であることを示した（抄録）。", "p3": "詳細な非線形有限要素解析と増分動的解析（IDA）から4つの損傷状態のフラジリティ曲線を作り、損傷ごとの機能の即時の損失と復旧時間を統合したレジリエンスの損失関数と指標（RI）で、4つの対策を比べた（抄録）。", "p5": "現状の非定着の貯槽はRI = 0.62と中程度で、免震でRI = 0.86と最も改善し、定着と貯液量50%の組み合わせがRI = 0.82で続いた。機能の損失は軽微な損傷の15機能日から完全な破壊の18,000機能日まで大きく増えた（抄録）。", "fun": "地震への強さは、壊れるか壊れないかだけでは測れない。壊れたあと、どれだけ早く元どおり使えるようになるかまで含めて考えるのが「レジリエンス」だ。巨大なタンクを地面に固定するより、揺れを伝えにくくする免震の方が効果が大きかったという比較が分かりやすい。", "unverified": "本文は読めておらず、入力地震動の選び方と復旧時間の仮定の根拠は未確認。"}}, {"id": "pn38", "rank": 38, "field": "工学", "headline": "体積細長比でエアトン-ペリーの不整係数を定式化し直す", "title": "An Alternative Formulation of the 𝜼 Ayrton-Perry Imperfection Factor Based on Volumetric Slenderness for Steel Members Flexural Buckling", "url": "https://doi.org/10.2139/ssrn.7688091", "authors": "Ersilio Tushaj ほか", "venue": "SSRN", "date": "2026-11-14", "why": "鋼部材の曲げ座屈の設計で使うエアトン-ペリーの一般化不整係数を、部材の体積と断面係数の比である「体積細長比」で定式化し直し、ユーロコード3の2005年版と2022年版に沿って検討した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "鋼部材の曲げ座屈の設計で使うエアトン-ペリーの一般化不整係数を、部材の体積と断面係数の比である「体積細長比」で定式化し直した（抄録）。", "p3": "1886年の解とその発展を見直し、体積細長比と断面形状のパラメータで不整係数を表した。降伏強度の影響を2つの定式化で調べ、冷間・熱間の鋼管、IPE・HEA形鋼、S235〜S420の鋼種の多数の長さ・断面でユーロコード3に基づく回帰で係数を較正した（抄録）。", "p5": "体積が大きいほど物理的な不整の可能性が大きく、断面係数が小さいほど曲率とたわみが大きくなるという関係を、不整係数に直接反映させた。較正の結果の精度は抄録の範囲では未確認（抄録）。", "fun": "細長い柱は、ほんの少しの曲がりや傷があるだけで、計算より早く折れ曲がる。100年以上前の古典的な式を、部材の体積と断面の強さの比という分かりやすい量で書き直し、設計規準に合わせて調整した。古い式に新しい物差しを当てる試みだ。", "unverified": "本文は読めておらず、既存の規準の曲線との比較の精度は未確認。"}}, {"id": "pn39", "rank": 39, "field": "工学", "headline": "時間変動するかみ合い剛性で歯車の歯面の力を素早く推定", "title": "Time-varying mesh stiffness for fast force estimation on cracked and healthy double helical gears", "url": "https://doi.org/10.21203/rs.3.rs-11366043/v1", "authors": "Sophie-Maria Rauscher ほか", "venue": "Research Square (In Review)", "date": "2026-11-13", "why": "歯車の時間変動かみ合い剛性（TVMS）の文献を整理し、各歯の剛性の分担から歯面にかかる時間変化する力を計算する方法を提案して、き裂のある・ない二重はすば歯車に適用した。", "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "二重はすば歯車の時間変動かみ合い剛性（TVMS）から、き裂のある歯とない歯の歯面にかかる時間変化する力を、有限要素法より速く求める解析的な方法を示した（抄録）。", "p3": "歯を無限に薄い平歯車の切片に分け、各切片の曲げ・せん断・軸・すみ肉・ヘルツの柔性から切片の剛性を閉形式で求めて合計し、並列ばねの仮定で、各歯の剛性の分担から歯の間の力の配分を計算した（抄録）。", "p5": "歯元のき裂の影響も調べ、かみ合いの入りと出の段階で生じる時間変化する内部の荷重を解析的に扱えるようにした。精度と計算時間の数値は抄録の範囲では未確認（抄録）。", "fun": "歯車の歯は、かみ合う本数が時間とともに変わるので、1本の歯にかかる力も刻々と変わる。歯を薄い板の重ね合わせとして計算することで、重いコンピュータ計算をしなくても力の変化を素早く見積もれる。き裂が入ったときの変化も追えるので、故障の早期発見にもつながる。", "unverified": "本文は読めておらず、有限要素解析や実験との比較の結果は未確認。"}}, {"id": "pn40", "rank": 40, "field": "工学", "headline": "曲げのクリープ緩和後の荷重回復で背応力則を検証", "title": "Load recovery at fixed deflection after creep relaxation in bending as a test of anelastic back-stress laws", "url": "https://doi.org/10.21203/rs.3.rs-11550281/v1", "authors": "Yo-Lun Yang", "venue": "Research Square (In Review)", "date": "2026-11-14", "why": "8時間の緩和のあとに荷重をゼロに戻し、たわみを6時間保ったまま荷重が回復する曲げ試験を導入し、3種の厚さで11回の試験を行って、一軸試験から同定した背応力則の予測を検証した。", "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "曲げのクリープ緩和のあとに荷重をゼロに戻し、たわみを保ったまま荷重が回復する試験を導入し、背応力の構成則を検証する新しい手段を示した（抄録）。", "p3": "8時間の緩和のあと荷重を除き、たわみを6時間保って荷重の回復を測る曲げ試験を3種の厚さで11回行い、一軸の回復試験と合わせた。3つの一軸の履歴で同定した6パラメータの背応力則を、再調整なしで他の条件に適用した（抄録）。", "p5": "構成則は型の上での緩和と回復の振幅を表したが、荷重の回復の半減期を実測の1.3〜3.5倍と予測し、回復が保持時間で飽和する点も再現しなかった。5 mmの断面では30日後に弾性スプリングバックの16〜18%の遅れスプリングバックが予測された（抄録）。", "fun": "金属の板を曲げて形を作ったあと、手を離すと少し戻る（スプリングバック）。実は時間をかけてさらにじわじわ戻ることがあり、製品の形が狂う原因になる。曲げたまま待って力の戻りを測るという新しい試験で、その「遅れて戻る」性質を確かめた点が面白い。", "unverified": "本文は読めておらず、材料の種類と温度条件は抄録からは未確認。"}}, {"id": "pn41", "rank": 41, "field": "機械学習", "headline": "回収目標を守るリサイクル補助金を頑健に設計", "title": "Target-oriented Bi-level Optimization for Recycling Subsidy Design", "url": "https://doi.org/10.2139/ssrn.7685607", "authors": "Yao Gao ほか", "venue": "SSRN", "date": "2026-11-13", "why": "使用済み製品の回収量が不確かなとき、財政の制約のもとで回収目標を確実に達成するため、製品ごとの補助金と設備利用率の資格基準を同時に決める、目標志向の分布的に頑健な二層最適化モデルを開発した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "使用済み製品の回収量が不確かなとき、限られた予算で回収目標を確実に達成するリサイクル補助金と資格基準を同時に設計する、分布的に頑健な二層最適化モデルを開発した（抄録）。", "p3": "規制者が製品ごとの補助金と設備利用率の資格基準を決め、最悪の回収不足の危険指標を最小化し、認可されたリサイクル業者が参加・ラインの稼働・解体を決める二層の問題を、価値関数による単一層への書き換えと改良した列・制約生成法で解いた（抄録）。", "p5": "単一製品の場合の分析で、最適化した利用率の資格基準は基準なしを弱く優越し、補助金の効率を高めうること、基準の効果が単調でない条件があることを示した。数値実験の結果の詳細は抄録の範囲では未確認（抄録）。", "fun": "リサイクルに補助金を出しても、集まる量は年によって大きくぶれる。そこで、最悪の場合でも目標に届かない危険を小さくするように、補助金の額と「どれだけ設備を動かした業者に出すか」の条件を一緒に決める。お金の配り方の条件しだいで効き目が変わる点が面白い。", "unverified": "本文は読めておらず、数値実験の規模と結果の数値は未確認。"}}, {"id": "pn42", "rank": 42, "field": "機械学習", "headline": "テクニカル指標は深層学習の価格予測を改善するか", "title": "Do Technical Indicators Improve Deep Learning Forecasts? An Empirical Ablation Study across Asset Classes", "url": "https://doi.org/10.2139/ssrn.7686780", "authors": "Nabeel Ahmad Saidd", "venue": "SSRN", "date": "2026-11-13", "why": "2010〜2025年の日次データで5つの資産クラスの10資産について、生の値と4種類の指標を加えた5つの特徴量の組み合わせを、再帰型ニューラルネットワークで500回の統制実験として比べた大規模なアブレーション研究。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "テクニカル指標は深層学習による翌日の価格予測を一般に改善せず、むしろ誤差を増やすことを、5つの資産クラスの大規模なアブレーションで示した（抄録）。", "p3": "2010〜2025年の日次データで10資産について、生の値と4種類の指標を加えた5つの特徴量の組み合わせを、LSTMとGRUと5つの乱数種で比べる500回の統制実験を行った（抄録）。", "p5": "生の値だけの基準が平均RMSE 0.166 ± 0.148と最小、方向の正解率55.7% ± 5.5%と最大で、すべての指標を加えるとRMSEが34.6%増えた。外国為替だけは変動性の指標でRMSEが4.2%減った（抄録）。", "fun": "株価のチャートには、移動平均など「売り買いのサイン」とされる指標がたくさんある。ところが、深層学習に生の価格だけを与えた方が、指標を足したときより予測がよかった。人が便利だと思ってきた道具が、AIにとってはかえって雑音になりうるという結果だ。", "unverified": "本文は読めておらず、暗号資産などその他の資産クラスの結果の詳細は未確認。"}}, {"id": "pn43", "rank": 43, "field": "機械学習", "headline": "水中画像の構造を保って復元し深度推定を改善", "title": "AquaDepth: Structure-conditioned Diffusion Restoration for Underwater Image Enhancement and Perceptual Depth Map Quality Improvement", "url": "https://doi.org/10.2139/ssrn.7685558", "authors": "Dabbrata Das ほか", "venue": "SSRN", "date": "2026-11-13", "why": "劣化した水中画像では最先端の深度推定も信頼できない。構造の明瞭化、文で条件づけた拡散モデルによる色と質感の復元、Vision Transformerによる処理を順に行う3段階の枠組みAquaDepthを提案した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "劣化した水中画像の構造を先に安定させてから拡散モデルで色と質感を復元し、Vision Transformerで深度を推定する3段階の枠組みAquaDepthを提案した（抄録）。", "p3": "構造の明瞭化、文で条件づけた拡散モデルによる復元、大域的な受容野をもつVision Transformerによる深度推定を順に行い、各段が次の段の劣化を防ぐように設計した。UIEBとLSUIのデータで7つの手法と比べた（抄録）。", "p5": "AquaDepthはNIQEが3.02と最良、UIQMが3.68と最高だった。水中の深度の正解データがないため、深度の質は知覚的な指標で評価し、深度地図の鮮明さや物体の認識が改善したと報告する（抄録）。", "fun": "水の中の写真は青や緑にかすみ、物の形も距離もつかみにくい。いきなり画像生成AIで直すと、ありもしない形を描き足してしまうので、まず輪郭と色の釣り合いを整えてから仕上げる順番にした。手順の順序そのものが工夫になっている点が面白い。", "unverified": "深度の正解データがなく、深度推定の精度そのものは検証されていない（抄録）。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "橋のひずみ監視データの欠測・ドリフトを同時に検出", "title": "A Statistical Feature and Multiscale Dilated Inception Enhanced Multitask Learning Method for Detecting Multipattern Anomalies of Bridge Strain Monitoring Data", "url": "https://doi.org/10.1155/stc/7962455", "authors": "Jianfu Lin ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-11-14", "sjr": 1.147, "citescore": 10.3, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr02", "rank": 2, "headline": "変えられない属性を動かさない信用審査の反実仮想説明", "title": "Constrained Actionable Counterfactual Explanations With Economic Cost Optimization for Algorithmic Recourse in Credit Scoring Systems", "url": "https://doi.org/10.1111/exsy.70480", "authors": "Mohamed Ikermane ほか", "venue": "Expert Systems", "date": "2026-11-14", "sjr": 0.738, "citescore": 9.6, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2}, {"id": "jr03", "rank": 3, "headline": "センサの数と配置を同時に決める密度法の配置最適化", "title": "A variable-density approach to optimal sensor array design for acoustic emission technology of moment tensor inversion", "url": "https://doi.org/10.1142/s0219455428500861", "authors": "Yue Kong ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-14", "sjr": 0.703, "citescore": 6.5, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr04", "rank": 4, "headline": "LLMで測る議会討論の道徳化、野党と選挙前に増加", "title": "Strategic Moralization in Parliamentary Debates", "url": "https://doi.org/10.1111/lsq.70099", "authors": "Minahil Malik ほか", "venue": "Legislative Studies Quarterly", "date": "2026-11-14", "sjr": 2.314, "citescore": 3.2, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"id": "jr05", "rank": 5, "headline": "観測点の新設地点をデータ同化の模擬実験で選ぶ", "title": "Data Assimilation to Inform Strategic Network Placement and Evaluate the Added Value of the Next Generation Water Observing Sy
