cture Debate Right: Lessons in Moratoria, Evidence, and Cooperation", "url": "https://doi.org/10.2139/ssrn.7598618", "authors": "John Huber", "venue": "SSRN", "date": "2026-10-12", "apa": "Huber, J. (2026). From Cell Towers to Data Centers: How Long Island Can Get the Next Infrastructure Debate Right: Lessons in Moratoria, Evidence, and Cooperation. https://doi.org/10.2139/ssrn.7598618", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "データセンターの立地をめぐる一時的な開発停止（モラトリアム）が、いつ正当な計画手段になりうるかを、過去の携帯基地局の論争と比べて整理した（抄録）。", "p3": "ニューヨーク州の判例、連邦の電気通信の先例、州環境品質レビュー法（SEQRA）、近年の行政の枠組みを分析し、1990年代後半から2000年代のロングアイランドの無線通信施設の立地論争から比較的な教訓を引く。データセンターはインフラ・送配電網・水資源・土地利用への影響の点で従来の無線設備とは異なると位置づける（抄録）。", "p5": "著者は、一時的なモラトリアムが正当な計画上の目的を果たしうるのは、合理的な事実の基礎に支えられ、明確な規制上の帰結に向けられている場合に限られると論じる。そのうえで、地域の計算需要と地元の環境保護・地域の性格・料金負担者の保護を両立させる実務的な枠組みを、証拠の誠実さ、早期の意思疎通、誠意ある協力という柱で示す（抄録）。", "fun": "大規模なデータセンターの建設が各地で問題になっている。電気と水を大量に使い、しかも雇用はあまり生まれない。自治体がまず取るのは「しばらく建てさせない」という一時停止だが、これは安易に使えば違法になりうる。この論文が比較に持ち出すのは、20年前の携帯電話の基地局の論争。同じ構図が技術を変えて繰り返されている、という見立てである。", "unverified": "引用された判例の内容、提案された枠組みの具体的な運用手順。本文が入手できず確認できなかった。"}}, {"id": "pr48", "rank": 48, "headline": "上位政府の財政ルールは地方に及ぶか", "title": "Do Upper-Tier Fiscal Rules Affect Local Governments?", "url": "https://doi.org/10.2139/ssrn.7592758", "authors": "Maximilian J. Langer", "venue": "SSRN", "date": "2026-10-12", "apa": "Langer, M. J. (2026). Do Upper-Tier Fiscal Rules Affect Local Governments? https://doi.org/10.2139/ssrn.7592758", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "財政ルールの対象ではない下位の政府にも、上位政府のルールが波及するかを、ドイツの債務ブレーキで検証した（抄録）。", "p3": "債務ブレーキは連邦政府と将来的に州を制約したが、市町村には直接適用されなかった。波及を2つに分ける。追加の資源の使い方の変化と、直面する資源と負担の変化である。前者には、無条件の市町村交付金の算定式に基づく回帰キンク設計を使い、交付金への市町村の反応が時間とともにどう変わるかを推定する。後者には複数結果の合成統制を使う（抄録）。", "p5": "追加の交付金はフライペーパー効果に沿って支出を増やし、その内訳は時間とともに変わる。投資への反応は減り、経常的な物品・サービスへの反応は増え、これは発生主義会計への移行を示す。2011年以降の事業税への反応の小幅で一時的な低下は、市町村の予算監督の改革と重なる。いずれの変化も債務ブレーキの波及のタイミングと機構の両方には合致しない。限界的な財政健全化の反応は増えず、広い帯域幅では交付金1ユーロあたり0.09ユーロを超える増加は排除される（抄録）。", "fun": "国が「借金を増やすな」というルールを作ると、その対象でない市町村の財政行動も変わるだろうか。この研究は交付金の算定式の折れ目を使って、交付金が1ユーロ増えたとき市町村が何に使うかを時期ごとに推定した。結論は否定的で、変化は見つかるがそのタイミングと仕組みは債務ブレーキと合わない。むしろ会計制度の変更や予算監督の改革のほうが説明になる。似た時期の出来事を切り分けている。", "unverified": "標本の市町村数と期間、合成統制の結果の詳細。本文が入手できず確認できなかった。"}}, {"id": "pr49", "rank": 49, "headline": "AI導入の差は組織資本が説明する", "title": "More than just Plug and Play: Early Evidence on Organisational Capital and AI Adoption", "url": "https://econpapers.repec.org/RePEc:eoe:escoed:escoe-dp-2026-13", "authors": "Coyle ほか", "venue": "RePEc NEP", "date": "2026-10-12", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "RePEc経由の掲載ページから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "企業のAI導入が経営実践と結びついていることを、他の技術の導入とは異なる関係として示した（抄録）。", "p3": "英国のManagement and Expectations Survey（MES）のパネルデータを使い、基準時点の経営スコアが高い企業がAIを導入しやすいかを推定する。さらに同じ経営実践が、ロボティクス・専用設備・専用ソフトウェアといった他の技術の導入とも関係するかを比べる（抄録）。", "p5": "経営スコアが高い企業はAIを導入する確率が有意に高い。この関係はAIに固有で、同じ経営実践は他の技術の導入とは関係を示さない。また業績測定に関わる経営能力がAI導入と強く関係するように見える。著者はこれを、組織の補完性が技術ごとに異なることを示すものとし、AI導入を促す政策への含意があると述べる（抄録）。", "fun": "「AIを導入すれば生産性が上がる」という話の前に、そもそもどんな企業が導入するのかという問いがある。この研究の面白い点は、経営の質とAI導入の関係が、ロボットや専用ソフトの導入では見られないこと。つまりAIだけが経営の作り込みを要求している。しかも効いていたのは業績測定の能力。何をどう測っているかが分からない組織は、AIを入れても使いどころが分からないのかもしれない。", "unverified": "標本の企業数と期間、経営スコアの構成、推定された係数。本文が入手できず確認できなかった。"}}, {"id": "pr50", "rank": 50, "headline": "在宅勤務と幸福度を時間利用調査でみる", "title": "Working from Home and Employee Well-Being: Evidence from the 2021 American Time Use Survey", "url": "https://doi.org/10.2139/ssrn.7594658", "authors": "Peter Sarpong", "venue": "SSRN", "date": "2026-10-12", "apa": "Sarpong, P. (2026). Working from Home and Employee Well-Being: Evidence from the 2021 American Time Use Survey. https://doi.org/10.2139/ssrn.7594658", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "在宅勤務と職場勤務の間で、経験された幸福の各次元のうちどれに差が出るかを、時間利用調査で測り分けた（抄録）。", "p3": "2021年のAmerican Time Use Survey（ATUS）のWell-Being Moduleを使い、自宅で行った仕事と職場で行った仕事を比べる。分析標本は1,069人が報告した1,254の仕事の活動（自宅486、職場768）。活動単位で6つの成果（幸福、意味、ストレス、疲れ、悲しみ、痛み）を0〜6の尺度で調べ、人口統計と就業の特性で調整した重み付き線形回帰を当て、6つの主要な成果の多重検定にHolm補正を当てる（抄録）。", "p5": "調整後、自宅での仕事は職場での仕事に比べて経験された痛みが低いことと関連した（β=−0.328、SE=0.119、95%区間[−0.561, −0.095]、p=.006）。この関連はHolm補正後も有意である（調整済みp=.035）。他の成果については、調整後に統計的に有意な差は見られなかった（抄録）。", "fun": "在宅勤務は幸せか、という問いへの答えは研究によってばらばらだった。この研究は幸福を1つの塊として扱うのをやめ、幸福・意味・ストレス・疲れ・悲しみ・痛みの6つに分けた。すると差が出たのは「痛み」だけだった。通勤や職場の椅子による身体の負担が減るぶんが現れたのかもしれない。幸福度を一括で測っていたら見えなかった差である。", "unverified": "他の5つの成果の係数、調整に使った共変量の一覧。本文が入手できず確認できなかった。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "因果推論", "headline": "複雑な割付でも標準誤差は単純にできる", "title": "Simple Standard Errors for Complicated (Quasi-)Experimental Designs", "url": "https://arxiv.org/abs/2610.12674", "authors": "Sylvia Klosin ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Klosin, S., & Roth, J. (2026). Simple Standard Errors for Complicated (Quasi-)Experimental Designs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12674", "why": "波及や空間相関で処理の割付が複雑に依存する設計に対し、Neyman分散推定量の性質を一般の設計へ拡張した分散推定量を与えた。完全ランダム化ではNeyman型、クラスター化ではクラスター頑健型に帰着し、二次形式の分散推定量の中で許容的であることも示す。実例で既存法の2〜3分の1の長さの標準誤差が得られた。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。設定（§2）、推定量と性質（§3、命題3.1）、他の推定量との比較（§4）、シミュレーションと適用（§7、表1・表3）、結論（§8）を参照した", "preprint": true, "p1": "波及や空間相関で処理の割付が複雑に依存する設計でも、完全ランダム化のNeyman分散推定量の性質を受け継ぐ標準誤差を計算できるようになった（§3、§8）。", "p2": "割付の仕組みが分かっていても、ある単位の潜在結果どうしが同時に観測できないと分散に入る積の項が推定できない。従来は設計ごとに最適化問題を解く必要があり、計算も重かった（§1、§4）。", "p3": "着想は「同時に観測できない潜在結果」をグラフにすることである。潜在結果kとk'が同時に観測される確率π_kk'が0のとき辺を張ったグラフを作り、その連結成分で添字を分割する。成分が同じなら s=1、違えば s=−1/(C−1) と重みを調整し、π>0の組だけを足し上げて分散推定量 V_CC を作る（§3）。命題3.1によれば E[V_CC] = Var(τ̂) + (C/K²)Var_c(τ_c) で、上側のずれは成分ごとの処理効果の和のばらつきに比例し、効果が一様なら不偏になる。完全ランダム化ではNeyman推定量、クラスターランダム化ではクラスター頑健推定量に一致する（§4）。", "p4": "評価は実証に基づくシミュレーションと実データ適用。Paluck et al. (2016) の学校ネットワーク実験で2つの対比について、Aronow–Samii推定量とHarshaw et al. (2026) の2つの推定量と比べる。指標は偏り、精度、名目95%区間の被覆率、区間幅、計算時間である（§7.1）。", "p5": "表1・2では、鋭い帰無を課したパネルA・Bで提案推定量の比例偏りはVar(τ̂)の1%未満、異質性の大きい混合パネルCで64%と16%の上方偏り。被覆率は全設定で名目95%に対し93.5%以上で、偏りと区間幅はすべての設計で最小。Aronow–Samii推定量に対する区間幅の比は44〜84%。計算時間は最適化型が直接効果で31時間と2時間を要したのに対し提案法は1秒未満。実データ（表3）では直接対間接の対比でt値が2.4（トレース1.97、複合1.6）になり、空間処理の設定では標準誤差が約3分の1になった（§7.2）。", "p6": "著者は、二次形式の分散推定量に限ること、曝露が離散の場合に絞ること、正規近似の信頼区間を正当化する中心極限定理がこの設定のすべてでは得られていないこと、曝露写像が正しく特定されていると仮定することを限界に挙げる（§8）。", "fun": "実験で「効果があった」と言うには、推定値と一緒に誤差の幅が必要だ。ところが隣の人の処理が自分に影響する実験では、誰と誰の結果を同時に見られないかが複雑に絡み合い、誤差の計算が難しくなる。この論文の発想は、同時に観測できない組を線でつないだ地図を描き、その「島」ごとに重みを割り振るというもの。効果が島ごとに揃っていれば誤差の見積りはぴったりで、ばらつくほど安全側に外れる。計算は31時間から1秒未満になり、誤差の幅は3分の1まで縮んだ。", "unverified": "表1・表2の提案推定量の行の数値（偏り・精度・被覆率・幅の具体値）は本文の表が機械可読に崩れており、文章中で言及された値のみ引用した。"}}, {"id": "pn02", "rank": 2, "field": "機械学習（Hugging Face）", "headline": "マルチモーダルLLMの中に空間の作業場がある", "title": "S-Space: Exploring Spatial Workspace in Multimodal Language Models", "url": "https://arxiv.org/abs/2610.13527", "authors": "Zhiyuan Shi ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-12", "apa": "Shi, Z., Li, X., Guo, X., Miao, S., Chen, W., Dai, Q., Ren, J., Lyu, J., Liu, F., Long, M., & Wu, J. (2026). S-Space: Exploring Spatial Workspace in Multimodal Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13527", "why": "物体トークンの表現が水平・垂直・奥行きの連続座標を線形部分空間に符号化していることを見つけ、介入でその空間だけを操作すると空間判断だけが変わると示した。知覚は位置をここに書き込み、推論は視点変換のために変形するという役割分担まで記述し、視点変化に弱い原因を知覚と計算に分解した。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。定式化（§2.1–2.3）、内部作業場としての検証（§3.1–3.3）、創発の事例（§4）、失敗の診断（§5.1–5.3、表1）、考察（§6）を参照した", "preprint": true, "p1": "マルチモーダル言語モデルの内部に、物体の位置を水平・垂直・奥行きの連続座標として符号化する3次元の線形部分空間があることを見つけ、読み出し・書き換え・診断の道具にできるようになった（§2.1、§5）。", "p2": "マルチモーダルモデルは空間推論ができそうに見えるが、内部機構は分かっていなかった。失敗したときに、位置を知覚できていないのか、知覚した位置を変換する計算ができていないのかを切り分ける手段もなかった（§1、§5.1）。", "p3": "概念が内部表現で線形に符号化されるという仮説を空間座標に広げ、物体名トークンの隠れ表現に観察者中心の座標が線形に入っていると考える。相対的な空間を問う質問への応答を物体トークンの活性で微分して3つの軸（水平・垂直・奥行き）を特定し、中間層に3次元の線形部分空間（S-Space）を定義する（§2.1–2.2）。読み出しは隠れ表現をこの部分空間に射影するだけでよい（§2.3）。", "p4": "検証は3段構え。(1)正確さ：読み出した座標と真の位置の相関、および座標だけで空間関係に答えた正解率をモデルの言語応答と比べる。(2)因果性：座標を編集して書き戻し、空間判断が変わるか色の判断が保たれるかを見る。(3)持続性：プロンプトを非空間の質問に替えても座標が使えるかを見る。評価は3つのベンチマークで行う（§3.1–3.3）。", "p5": "座標の読み出しは個々の物体の座標と対の座標差の両方で真値と強く相関し、座標だけの読み出しがモデルの言語応答と同等の正解率に達する（図3）。座標の編集は空間判断を大きく変える一方、色の判断にはほとんど影響しない（図4）。視点変換（SpinBench）では知覚と計算を分けて座標に明示的な回転を施すと大きく改善し、表1では前提なしでMolmo2-ERが60.96%→94.52%（+33.56ポイント）、Qwen3.5-4Bが60.96%→91.10%（+30.14）、Qwen3.6-27Bが60.96%→95.21%（+34.25）で、思考連鎖による改善（+22.60）を上回る（§5.1）。", "p6": "著者は、水平・垂直の軸に画像平面の座標を使い奥行き依存の遠近効果を分離していないこと、参照枠が固定ではなく文脈で動きうることを述べる。また事前学習から受け継いだ偏りが見つかったとし、単一のモデルに全ての空間操作を担わせる必要はなく専用道具をつなぐ方向を示唆する（§2.2、§6）。", "fun": "AIの中をのぞくと、物の位置が「左から何番目」といった言葉ではなく、横・縦・奥行きの数値として、しかも足し算のできる形で入っていた。その数値を書き換えると空間の答えだけが変わり、色の答えは変わらない。つまり本当にそこを使っている。さらに面白いのは、視点を変える問題で正解率が6割しかないモデルでも、位置の読み取り自体は正しく、取り出した座標を外から回転させてやると9割以上になること。見えていないのではなく、頭の中で回せないのだった。", "unverified": "表4〜10（答えの向きごとの正解率や層ごとの介入結果）の個別の数値は、本文の表が機械可読に崩れており読み取れなかった。"}}, {"id": "pn03", "rank": 3, "field": "因果推論", "headline": "RCTは制度的な差別をどこまで測れるか", "title": "What Can (and Cannot) Be Learned about Systemic Racial Discrimination from Randomized Controlled Trials?", "url": "https://doi.org/10.3386/w35882", "authors": "Dania V. Francis ほか", "venue": "NBER Working Paper", "apa": "Francis, D. V., Gillezeau, R., Jones, D., & Viceisza, A. C. G. (2026). What Can (and Cannot) Be Learned about Systemic Racial Discrimination from Randomized Controlled Trials? (NBER Working Paper No. 35882). National Bureau of Economic Research. https://www.nber.org/papers/w35882", "why": "直接的な差別の検出に大きな役割を果たしてきたランダム化比較試験が、制度に埋め込まれた差別に対して同じ役割を果たせるかを7つの切り口で検討した。大規模な操作の実現可能性、顕在性の操作、情報の役割などを整理し、RCTが埋められない部分を他の手法が補う必要を論じている。", "explain": {"basis": "抄録", "basis_note": "本文はNBERの有料配布のため入手できず、候補収集時にNBERから取得した抄録を読んだ", "preprint": true, "p1": "ランダム化比較試験（RCT）が制度に埋め込まれた人種差別の解明にどこまで使えるかを、7つの切り口に分けて検討できるようになった（抄録）。", "p2": "RCTは、採用の書類審査のような直接的な差別の検出に大きな役割を果たしてきた。しかし制度的な人種差別は、個々の判断の集まりではなく制度の構造に埋め込まれているため、同じ道具が同じように使えるとは限らない（抄録）。", "p3": "抄録によれば、先行する制度的人種差別の定義をもとに概念モデルを立て、そのうえでRCTの可能性と限界を7つの切り口で検討する。(1)制度的な人種差別を大規模に操作する実現可能性、(2)より小規模な接近、(3)異なる構造的な環境にまたがるRCTの実施、(4)制度的な力の顕在性の操作、(5)差別を減らすうえでの情報の役割、(6)人種的アイデンティティの顕在性の操作、(7)制度的な人種差別への戦略的な反応の検討、である（抄録）。", "p4": "これはエッセイであり、新しいデータによる検証ではない。評価は、各切り口についてRCTで識別できる対象と識別できない対象を区別するという、概念的な整理によって行われる（抄録）。", "p5": "抄録は結果として、7つの切り口それぞれにRCTが寄与できる余地があることと、限界が残ることを示し、RCTが埋められない空白を他の手法で補う必要があると述べる。切り口ごとの具体的な結論は抄録に示されていないため未確認。", "p6": "著者自身が、RCTには限界があり、他の接近法が残された空白を埋めうると明記している（抄録）。どの手法がどの空白を埋めるかの具体は、抄録の範囲では確認できなかった。", "fun": "「同じ履歴書で名前だけ変えて送る」実験は、採用での差別をはっきり示してきた。では、特定の地域に学校の予算が回らない、そこに住む人の家の価値が上がらない、といった制度に組み込まれた差別はどう測ればよいのか。ひとつの判断を入れ替えることはできても、制度そのものをくじ引きで変えることはできない。この論文は、実験という最強の道具が届かない場所を7つに分けて丁寧に並べていく。道具の限界を知ることも研究の仕事だと分かる。", "unverified": "概念モデルの具体的な定式化、7つの切り口それぞれについての結論。本文が入手できず確認できなかった。"}}, {"id": "pn04", "rank": 4, "field": "統計学", "headline": "要約統計量の学習に有限標本の保証を付ける", "title": "Neural Estimation of Summary Statistics for Simulation-Based Inference with Non-Asymptotic Guarantees", "url": "https://arxiv.org/abs/2610.13031", "authors": "Rui Li ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Li, R., & Tang, R. (2026). Neural Estimation of Summary Statistics for Simulation-Based Inference with Non-Asymptotic Guarantees (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13031", "why": "尤度が扱えないシミュレーションベース推論で、要約統計量と事後推定器を同時に学習する枠組みを与え、ノンパラメトリック条件付き分布推定の観点から有限標本挙動を解析した。低次元の要約が次元の呪いをどう緩和するかを具体例で示し、観測ごとの局所的な微調整で償却誤差を縮める手続きも加えた。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。主要な貢献（§1.1）、枠組みと損失（§2–2.1）、局所的な微調整（§2.2）、数値実験（§4.1–4.3）、考察（§5）を参照した", "preprint": true, "p1": "尤度が扱えないシミュレーションベース推論で、要約統計量と事後推定器を同時に学習する枠組みを作り、有限標本の保証を与えた（§1.1）。", "p2": "シミュレーションベース推論（SBI）では観測の次元が上がると性能が急落するため、情報量の多い低次元の要約統計量が要になる。しかし既存研究の大半は推論ネットワーク側に集中し、要約の学習には有限標本の保証が与えられていなかった（§1.1、§5）。", "p3": "着想は、全データの事後分布と要約で条件づけた事後分布の食い違いを最小化するように符号器S(·)を学ぶことである。食い違いはKLダイバージェンス、最大平均差異（MMD）、スライス版MMDから選べる。推定できるよう補助的な復号器W(·)を同時に学習する（§2.1）。MMD系の目的は推論ネットワークの標本から直接推定できるため、密度が計算できない暗黙的な生成器でもよい。さらに償却誤差を縮める局所的な微調整を2つ用意する（§2.2）。", "p4": "理論は条件付き分布推定の観点からオラクル不等式を立て、十分統計量が存在する指数型分布族と、n→∞でBernstein–von Mises定理により近似的に十分な統計量を構成できる滑らかな密度の2つに適用する。数値実験は、多峰の事後分布を持つ例、学習予算が小さいSIRモデル、曖昧な事前分布のLotka–Volterraモデルで、校正・偏り・被覆率・計算時間を評価する（§1.1、§4）。", "p5": "理論の要点は、低次元の要約を通すことで条件付き分布推定の次元の呪いを避けられることで、期待MMDで測った目標精度（たとえば1/n）を得るのに必要なNはnに対して多項式的にしか増えない（§1.1）。SIRモデル（n=10から80、N=768）では微調整が偏りを下げ被覆率を名目に近づけるが、微調整後は保守的で過被覆の傾向があり、有限のABC許容幅による平滑化が原因と推測される（§4.2）。Lotka–Volterraでは同じ予算のもとRefine+が低い偏りを達成しSNPE-Cより速く、スライスMMDが最小の校正誤差を得た（§4.3）。", "p6": "著者は、大標本の系が i.i.d. データについて述べられていること、局所的な微調整の対象をABC事後分布に限ること、代替のベイズ合成尤度は要約がパラメータ条件付きで近似的にガウスである必要があり現在の目的関数はそれを保証しないことを挙げる（§5）。", "fun": "シミュレーションはできるが確率の計算式が書けないモデルは科学に多い。そこでデータを少数の「要約」に潰してから推論するのだが、どんな要約がよいかは職人技だった。この研究は要約そのものを学習し、しかも「データの点数が増えても必要な計算量は爆発しない」ことを証明した。面白いのは、学習予算が足りず全体の推論がうまくいかない場合でも、学習された要約だけは役に立つという結果。地図を描く力と、地図を読む力は別々に身につくらしい。", "unverified": "表1〜3の個別の数値（偏り・被覆率・校正誤差の具体値）は、本文の表が機械可読に崩れており読み取れなかった。"}}, {"id": "pn05", "rank": 5, "field": "経済学", "headline": "日銀のETF買いは金利次第で効き方が変わる", "title": "The Impact of Central Bank Stock Purchases: Evidence from Discontinuities in Policy Rules", "url": "https://doi.org/10.3386/w35886", "authors": "Masao Fukui ほか", "venue": "NBER Working Paper", "apa": "Fukui, M., & Yagasaki, M. (2026). The Impact of Central Bank Stock Purchases: Evidence from Discontinuities in Policy Rules (NBER Working Paper No. 35886). National Bureau of Economic Research. https://www.nber.org/papers/w35886", "why": "株価指数の動きが閾値を下回ると買入れが発動するという日銀の政策ルールの不連続性を使って識別した。平常時は長期金利が上がる一方で株価には検出可能な効果がなく、イールドカーブ・コントロール導入後は金利が反応せず株価が頑健に上がる。需給が価格を決めるという元の仮説とは整合しないと結論している。", "explain": {"basis": "抄録", "basis_note": "本文はNBERの有料配布のため入手できず、候補収集時にNBERから取得した抄録を主に読んだ。原文ファイルにはSemantic Scholar由来の別版の抄録も入っており、数値はそちらにのみ含まれる", "preprint": true, "p1": "中央銀行による株式の買入れが長期金利と株価に何をするかを、政策ルールの不連続性を使って識別できるようになった（抄録）。", "p2": "中央銀行が株式を買うと価格が上がるのかは、需給だけで価格が決まる（市場が非弾力的）という仮説の検証そのものだが、買入れは市場が下がったときに行われるため、素朴な相関では因果が取れない（抄録）。", "p3": "識別の鍵は、日本銀行の政策ルールが株価指数の動きが閾値を下回ったときに買入れを発動するという点である。閾値のすぐ上と下を比べれば、市場環境がほぼ同じで買入れの有無だけが変わる。出力は長期金利と株価の反応である（抄録）。", "p4": "比較の軸は時期で、平常時と、長期金利を0%に固定するイールドカーブ・コントロール（YCC）導入後に分ける。YCC下では金利が動けないため、同じ買入れの効果が別の経路に現れるかどうかが検証できるという設計である（抄録）。", "p5": "NBERの抄録によれば、平常時は買入れによって長期金利が上がる一方、株価には検出可能な効果が見られない。YCC導入後は金利が反応しなくなり、株価が頑健に上がる。原文ファイルに入っていた別版の抄録は、時価総額の0.01%の買入れが長期金利を持続的に1.5ベーシスポイント上げ、YCC下では株価が0.22%上がるという数値を挙げている。", "p6": "NBERの抄録は、これらの結果が元の形の非弾力的市場仮説とは整合しないとし、内生的な金利を含む一般均衡への拡張が説明を与えると述べる。一方で別版の抄録は株式と債券の両市場が実質的に非弾力的だという理論を支持すると述べており、版によって結論の言い方が異なる。どちらが最終版かは抄録の範囲では確認できなかった。", "fun": "中央銀行が株を買えば株価は上がりそうに思える。ところが日本銀行の買入れを、発動の閾値のすぐ上と下で比べると、平常時には株価がほとんど動かず、代わりに長期金利が上がった。お金が株に向かうぶん債券から抜けるので、金利が動いて効果が逃げていたらしい。そして金利を0%に固定した時期には金利が動けなくなり、そのとき初めて株価が上がる。逃げ道をふさぐと効果が現れるという、実験のような構図になっている。", "unverified": "NBERの抄録と原文ファイルに併載された別版の抄録で結論の述べ方が異なり、どちらが最終版か確認できなかった。数値（1.5ベーシスポイント、0.22%）は別版の抄録にのみ含まれる。標本期間と買入れの件数、推定手法の詳細は本文が入手できず確認できなかった。"}}, {"id": "pn06", "rank": 6, "field": "経済学", "headline": "低技能の子に早期投資が雪だるま式に効く", "title": "Early Investment Snowballs for Low-Skill Children: Average Marginal Returns and the Dynamics of Skill Formation", "url": "https://arxiv.org/abs/2610.12509", "authors": "Liam Puknys", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Puknys, L. (2026). Early Investment Snowballs for Low-Skill Children: Average Marginal Returns and the Dynamics of Skill Formation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12509", "why": "プログラム評価が低技能の子への投資で大きな効果を見出す一方、構造モデルは技能と投資が補完的だと推定してきた。この食い違いが別の量を測っているだけだと整理し、技能と投資は補完的でも低技能の子には投資が極端に少ないため幼児期の平均限界収益が高くなる、そしてそれが後の年齢で逆転すると示した。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。枠組み（§2.1–2.4）、データ（§3.1–3.2）、実証モデル（§4）、結果と考察（§6.1、表4）、結論（§8）を参照した", "preprint": true, "p1": "低技能の子に投資するほど収益が大きいという実験の知見と、技能と投資が補完的だという構造モデルの知見が矛盾しない理由を、2つの異なる量の区別として説明できるようになった（§2.3）。", "p2": "プログラム評価は低技能・不利な立場の子で効果が大きいと繰り返し見出すのに、技能形成の構造モデルは技能と投資が補完的だと推定してきた。この食い違いが長く残っていた（§1）。", "p3": "区別の核は2つの量である。Beckerian収益表（BSR）は、他の投入を固定したうえでの産出の投入に対する弾性値。平均限界収益（AMR）は、その弾性値を投入の同時分布の上で平均した値である。補完性はBSRの性質だが、現実には低技能の子が受ける投資が極端に少ないため、その位置での弾性値が大きくなり、平均するとAMRが高技能の子より大きくなりうる。本文は、交互作用項を含む対数線形モデルが両者を混同してどちらも正確に推定しないと示す（§2.1–2.4）。", "p4": "データはNLSY79の子ども世代を追うCNLSY（1986年から2020年まで隔年）。認知技能はPIATの数学・語彙・読解、非認知技能はBPIの下位尺度、親の投資はHOME目録の項目（蔵書数、読み聞かせの頻度、習い事など）で代理する。離散の代理変数が多いため順序プロビットの測定系を用いる。母の認知技能はASVAB、非認知技能はRosenberg自尊感情尺度で代理する（§3）。", "p5": "表4は各投入の平均限界収益（AMR）を期間別に報告する。主要な結果は、両方の技能生産関数のすべての期間で投入が強い補完（ρ<0）であり Cunha et al. (2010) と整合すること、そして低技能の子のAMRが幼児期では高く学齢期以降に逆転することである（§6.1）。方法面では、離散の代理変数を連続として扱うとAMRの推定に偏りが生じ、幼児期の逆転を検出できなくなる。また母の恒常所得を統制すると現在の世帯所得は親の投資を予測しない（§8）。", "p6": "著者は、弾性値が維持された関数形のもとでの記述にすぎず投資の因果効果とは解釈できないこと、推定された弾性値が小さく相関の高い親の投資と親の技能の影響を一貫して区別できないこと、幼児期にのみAMRが技能と逆向きになる理由を検証していないこと、CNLSYの学校の質の情報が乏しいことを挙げる（§6.1、§8）。", "fun": "「恵まれない子に投資するほど効果が大きい」と「投資は能力の高い子にこそ効く」は、正反対に聞こえる。この論文は、2つが違う問いに答えていると整理した。前者は実際の投資の配られ方を含めた平均、後者は条件を固定したときの効き目である。少ししか投資されていない子は、1単位増やしたときの伸びが大きい。収穫逓減という当たり前の性質が、平均の取り方しだいで結論を反転させる。数式の中では両立していた話である。", "unverified": "表4の個別の弾性値（期間別・投入別）は、本文の表が機械可読に崩れており読み取れなかったため引用していない。幼児期の逆転が現れる具体的な年齢区分も確認できなかった。"}}, {"id": "pn07", "rank": 7, "field": "機械学習", "headline": "ニューロン単位で見ないと見えない部品構造", "title": "Neural networks are more modular than single neurons suggest", "url": "https://arxiv.org/abs/2610.12842", "authors": "Shreya Saha ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Saha, S., Bergen, B., & Khosla, M. (2026). Neural networks are more modular than single neurons suggest (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12842", "why": "個々のニューロンが複数の機能に関わることを理由にニューラルネットは部品構造を持たないとされてきた。ユニット単位・直交・線形という入れ子の階層を定義し、選択的な破壊で因果的に評価すると、ユニット単位では部品的でない網でも部分空間のレベルでは明確に分離すると示した。視覚では内容と様式、言語では統語と意味が分離する。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。分解の階層（§2.1）、学習目的と評価（§2.2–2.3）、結果（§3.1–3.4、図2・図8）、考察と限界（§4）を参照した", "preprint": true, "p1": "個々のニューロンが複数の機能に関わる網でも、部分空間の水準では機能が明確に分離していることを、因果的な破壊実験で確かめられるようになった（§2.1、§3.1）。", "p2": "ニューラルネットでは1つのニューロンが複数の役割を担うため、網は部品構造（モジュール性）を持たないと広く考えられてきた。しかしそれはニューロンという座標軸に沿って見たときの話にすぎない（§1、§4）。", "p3": "着想は、モジュール性を入れ子の3段階として定義することである。層の表現h(x)に線形変換Qをかけ、z = Qh(x) を機能Aの部分空間、機能Bの部分空間、残差の3ブロックに分ける（式1）。Qに許す自由度で段階を作り、置換（座標の並べ替えのみ）、直交（剛体回転）、可逆（条件数に上限を置いた可逆行列）の順で制約が弱くなる。分離が成功する最も厳しい段階が、計算の幾何的な組織を教える。残差ブロックは必須で、捨てると圧縮と分解が混ざる（§2.1）。", "p4": "評価は選択的な破壊（ablation）による因果的な検証で、二重乖離指数（DDI）で測る。対象は、11の認知課題で学習した多課題RNN（Yang et al., 2019。計算要件を共有しないAnti課題とDM1課題の対）、視覚モデルの内容と様式の分離（同じ内容99枚・同じ様式99枚が必ず存在する検証集合で評価）、言語モデルの統語と意味の分離の3種である（§2.3、§3.1–3.3）。", "p5": "図2が中心の結果で、softplus活性の多課題RNNはどの段階でも選択的な破壊効果が出る（DDI 0.59〜0.73）。tanh活性の網はユニット水準のDDIが0.00、つまりニューロン単位では完全にモジュール性がないのに、直交で0.37、線形で0.47となり、ユニット水準では見えないモジュール性を回復する。視覚では内容と様式、言語では統語と意味が、ニューロン集団を共有したまま部分空間の破壊で乖離した。脳データでは初期視覚領野（V1、V2）は様式の部分空間、高次領野は内容の部分空間でよく予測される（図8B）。", "p6": "著者は、分解の学習が非凸最適化でハイパーパラメータに敏感なこと、視覚と言語では部分空間の質を検索ベースの選択性で評価しており行動的な評価で補うべきことを限界に挙げる。残差部分空間が課題に関わる情報を含むが共有・冗長な形で入っており選択的でないことも未解明としている（§4）。", "fun": "「1つのニューロンがいくつもの仕事を兼ねているから、脳や人工神経網に部品の区切りはない」と言われてきた。この研究は、見る向きを変えればよいと示す。ニューロンという軸ではなく、それらを混ぜた別の軸の組（部分空間）で切ると、きれいに機能が分かれる。実際、ニューロン単位では分離度0.00の網が、回転してみると0.47になった。さらにその分かれ目が脳の階層とも対応し、画風に反応する部分は初期視覚、意味に反応する部分は高次領野をよく予測する。", "unverified": "§3.2・§3.3の検索選択性の個別の数値（内容指標CM、様式指標SM、Top-k選択性）は、本文の表が機械可読に崩れており読み取れなかった。"}}, {"id": "pn08", "rank": 8, "field": "経営学", "headline": "戦略的補完性が総体の持続性を決める", "title": "Strategic Complementarity and Persistence in Linear-Quadratic Mean Field Games", "url": "https://doi.org/10.3386/w35892", "authors": "Fernando E. Alvarez ほか", "venue": "NBER Working Paper", "apa": "Alvarez, F. E., & Argente, D. (2026). Strategic Complementarity and Persistence in Linear-Quadratic Mean Field Games (NBER Working Paper No. 35892). National Bureau of Economic Research. https://www.nber.org/papers/w35892", "why": "線形二次の平均場ゲームで、均衡の総体動学が戦略的相互作用に応じて曲率を調整した単一主体の制御問題と一致することを示した。状態の補完性が強いほど持続性が増し、行動の補完性が強いほど減るという条件を、同時対角化できない多次元の場合まで与えている。", "explain": {"basis": "抄録", "basis_note": "本文はNBERの有料配布のため入手できず、候補収集時にNBERから取得した抄録を読んだ", "preprint": true, "p1": "多数の主体が互いの状態と行動を見ながら動く線形二次の平均場ゲームで、総体の動きが「相互作用で曲率を補正した単一主体の制御問題」と一致すると示せるようになった（抄録）。", "p2": "戦略的補完性（他者が増やすほど自分も増やしたくなる関係）が、集計された量の持続性にどう効くかは、多次元で行列が同時対角化できない場合には扱いが難しかった（抄録）。", "p3": "枠組みは線形二次の平均場ゲームで、状態（資本などの蓄積）と行動（価格設定などの選択）の両方に相互作用を入れる。核になる結果は、均衡の総体動学が、状態と行動の曲率を戦略的相互作用のぶんだけ補正した単一主体の線形二次制御問題の動学と一致するというものである。これにより均衡の存在条件と一意性が得られ、相互作用と総体の調整速度が結びつく（抄録）。", "p4": "枠組みは資本蓄積と複数財の価格設定というマクロの標準的な問題の局所近似を与えると位置づけられる。評価は、持続性が相互作用の強さとともにどちらに動くかという符号条件の導出と、功利主義的な社会計画者の配分との比較によって行われる（抄録）。", "p5": "抄録の報告では、状態の補完性が強いほど持続性が増し、行動の補完性が強いほど持続性が減る条件が、行列が同時対角化できない多次元の問題でも得られる。この条件のもとで、状態の補完性を内部化すると計画者の配分はより持続的になり、行動の補完性を内部化するとより持続性が下がる。さらに共通ショックがある場合に、個別の動学と総体の動学を組み合わせて相互作用とモデルのパラメータを識別できる条件も与えられる。最後に、状態分布の高次モーメントを通じた相互作用に拡張される（抄録）。", "p6": "著者が認める限界は抄録に明示されていない。線形二次という関数形と局所近似に依存するため、大きなショックや非線形性が本質的な場合にどこまで使えるかは残る疑問である。", "fun": "大勢の企業が「他社が値上げするなら自分も」と考えると、経済全体の動きは一社の問題より複雑になりそうだ。この論文が示すのは、ある形の問題なら、全体の動きは「他者の影響のぶんだけ目的関数の曲がり方を書き換えた一社の問題」とぴったり同じになるということ。しかも状態を通じた影響は変化を長引かせ、行動を通じた影響は短くするという向きの違いまで分かる。多数の相互作用が一人の問題に畳み込めるのは、ちょっと驚く。", "unverified": "均衡の存在・一意性の具体的な条件、持続性の符号条件の数式、識別に必要な観測量。本文が入手できず確認できなかった。"}}, {"id": "pn09", "rank": 9, "field": "組織行動・心理的安全性", "headline": "情報の多様性が新しさへの支持を減らす", "title": "Bias Against Novelty in Teams: How Informational Diversity Amplifies Uncertainty and Reduces Support for Novelty", "url": "https://doi.org/10.2139/ssrn.7602103", "authors": "Wen-Xin Xie ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Xie, W.-X., Zhang, H., Annath, P., Harvey, S. R., & Bottom, W. P. (2026). Bias Against Novelty in Teams: How Informational Diversity Amplifies Uncertainty and Reduces Support for Novelty. https://doi.org/10.2139/ssrn.7602103", "why": "多様な情報を持つチームはアイデア生成に強いとされてきたが、評価の段になると新規なアイデアほど不確実性が増幅され支持が下がると予測した。経験ある投資家282名と実際に相互作用する231チームの事前登録実験で確認し、効果が新規なアイデアに限られることも示した。多様性の負の側面を評価段階に特定している。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は入手できず、候補収集時にSSRNから取得した抄録を読んだ。抄録に標本数と設計が詳しく含まれている", "preprint": true, "p1": "情報の多様なチームでは、新規なアイデアほど不確実性が増幅されて支持が下がるという、チーム水準の新規性バイアスの源を特定できるようになった（抄録）。", "p2": "新規なアイデアが拒まれる理由は、成功するかどうかの不確実性に求められてきた。一方、情報の多様性はアイデアの生成に役立つとして長く評価されてきたが、評価の場面での作用は検討されていなかった（抄録）。", "p3": "着想は、不確実性の源をアイデア自体ではなくアイデアが評価される場に求めることである。多様な情報は、より広い範囲の懸念と評価の観点をチームにもたらす。新規なアイデアには確立した参照点や共有された判断基準が乏しいため、それらの観点を調整できず、知覚される不確実性が増し、支持が下がる（抄録）。入力は情報の多様性とアイデアの新規性、出力は知覚される不確実性とアイデアへの支持である。", "p4": "検証は2つの事前登録された実験。研究1は新規な製品を評価する経験ある投資家282名、研究2は実際に相互作用するチーム231組がアイデアを選ぶ場面である。研究2では新規性の低いアイデアも用意され、効果が新規なアイデアに特異かどうかを検証できる設計になっている（抄録）。", "p5": "抄録の報告では、両実験で情報の多様性が新規なアイデアについて知覚される不確実性を増幅し、それが支持を下げた。研究2ではこの効果が新規なアイデアに限られ、新規性の低いアイデアでは現れなかった。知覚される不確実性が媒介であることが示されている（抄録）。個別の係数や効果量は抄録に示されていないため未確認。", "p6": "著者が認める限界は抄録に明示されていない。実験室と投資家の評価課題という設定で、実務のチームが長期にわたって新規なアイデアを扱う場面に当てはまるかは残る疑問である。", "fun": "「いろいろな専門の人が集まったチームのほうが新しい発想が出る」とよく言われる。この研究が示したのは、その同じ多様性が、出てきた新しい案を選ぶ段では足を引っぱるということだ。多様な人は多様な心配をするので、前例のない案には判断の基準が足りず、不確実に見えてしまう。しかも新規性の低い案ではこの現象が起きない。アイデアを出す場面と選ぶ場面で、同じ条件が逆に働く。会議の設計を考え直したくなる結果である。", "unverified": "媒介分析の係数と効果量、情報の多様性の操作方法、研究2のチーム構成。本文が入手できず確認できなかった。"}}, {"id": "pn10", "rank": 10, "field": "教育", "headline": "アファーマティブ・アクションは誰を押し出すか", "title": "Affirmative Action in Centralized College Admissions Systems", "url": "https://doi.org/10.3386/w35893", "authors": "Nano Barahona ほか", "venue": "NBER Working Paper", "apa": "Barahona, N., Dobbin, C., & Otero, S. (2026). Affirmative Action in Centralized College Admissions Systems (NBER Working Paper No. 35893). National Bureau of Economic Research. https://www.nber.org/papers/w35893", "why": "ブラジルで連邦の全高等教育機関に定員の半分を留保させた大規模政策を、合格ラインの不連続性と学位選択モデルの両方で評価した。恩恵を受けた学生の卒業増は押し出された学生の損失の約2倍だが、均衡の再配置で恩恵より約3割多い学生が押し出され、非対象学生の損失が恩恵の約3分の2を打ち消す。", "explain": {"basis": "抄録", "basis_note": "本文はNBERの有料配布のため入手できず、候補収集時にNBERから取得した抄録を読んだ。抄録に主要な数値が含まれている", "preprint": true, "p1": "大学入試のアファーマティブ・アクションについて、直接に恩恵を受けた学生と押し出された学生の効果と、再配置を含む政策全体の効果を分けて評価できるようになった（抄録）。", "p2": "合格ラインの不連続性を使えば、ぎりぎりで恩恵を受けた学生とぎりぎりで押し出された学生の効果は測れる。しかし政策全体の効果には均衡の再配置が含まれる。恩恵を受けた学生が空けた席は別の誰かが埋め、押し出された学生は他校の席を取り、その先でまた誰かを押し出す（抄録）。", "p3": "実証の枠組みを2段に分ける。第1段は合格ラインの不連続性を使い、ぎりぎりの学生についての効果を推定する。第2段は学位選択と潜在結果のモデルを推定し、再配置の連鎖を含む全体の効果を評価する（抄録）。出力は進学先の質と卒業である。", "p4": "対象はブラジルの大規模な政策で、すべての連邦立の高等教育機関に、人種的・社会経済的に不利な出願者のために定員の半分を留保させたものである。評価は、恩恵を受けた学生の利得と押し出された学生の損失の比、押し出された学生と恩恵を受けた学生の人数の比、そして全学生にわたる純効果で行う（抄録）。", "p5": "抄録の報告では、ぎりぎりで恩恵を受けた対象学生はより質の高い課程に進学し卒業する。その卒業の利得は、ぎりぎりで押し出された非対象学生の損失の約2倍で、これは対象学生の外部選択肢が弱いことを反映する。再配置された全学生でみても恩恵を受けた学生の利得は押し出された学生の損失の約2倍だが、均衡の再配置によって政策が押し出す学生は恩恵を受ける学生より約30%多くなる。結果として非対象学生の損失が対象学生の卒業の利得の約3分の2を打ち消し、全学生にわたる純利得は小さいものにとどまる（抄録）。", "p6": "著者が認める限界は抄録に明示されていない。第2段が学位選択と潜在結果のモデルに依存するため、モデルの定式化への感度は残る疑問である。", "fun": "入試の定員の半分を不利な立場の出願者に留保する。ぎりぎりで入れた人の得は、ぎりぎりで落ちた人の損の2倍だった。ここで話が終われば単純に良い政策である。ところが席には連鎖がある。入れた人が空けた席に別の人が入り、落ちた人が他の大学で誰かを押し出す。数えてみると、得をした人より3割多い人が押し出されていた。1人あたりの得は大きいのに、人数が多いせいで全体の純益は小さい。個人の効果と全体の効果が違うという教科書的な話が、実際の数字で現れている。", "unverified": "標本期間と規模、学位選択モデルの定式化、推定された効果の信頼区間。本文が入手できず確認できなかった。"}}, {"id": "pn11", "rank": 11, "field": "機械学習（Hugging Face）", "headline": "拡散モデルの強化学習を12倍速くする", "title": "DiffusionART: Efficient, Stable and Scalable Reinforcement of Diffusion Models", "url": "https://arxiv.org/abs/2610.12572", "authors": "Zhenglin Wan ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-12", "apa": "Wan, Z., Chen, J., Zhang, Z., Zhou, P., Zhao, W., Kong, F., Wan, P., Gai, K., & You, Y. (2026). DiffusionART: Efficient, Stable and Scalable Reinforcement of Diffusion Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12572", "why": "逆過程型の手法は功績の割当が弱く、順過程型は指数移動平均の調整なしでは不安定という二分を、隠れた順逆整合力の存在として説明した。報酬をまとめて共通方向に変える設計でその力を構造的に消し、信頼領域マスクつきの 2回目の更新で復元を担わせる。動画生成で同等の報酬水準に約12倍少ないGPU時間で到達した。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。既存手法の分析（§3.1–3.2）、提案手法（§4.1–4.3、補題2、式5）、実験（§5.1–5.2、表1・3、図5・6）、結論（§6）を参照した", "preprint": true, "p1": "拡散モデルの強化学習で、不安定さの原因となる隠れた力を構成の段階で消し、指数移動平均の調整なしで安定かつ高速に報酬を上げられるようになった（§4）。", "p2": "逆過程を使う手法（Flow-GRPOなど）は功績の割当が弱く効率が悪い。順過程を使う手法（DiffusionNFTなど）は効率はよいが、指数移動平均（EMA）の調整を課題ごとに行わないと不安定になる（§1、§3）。", "p3": "本文はまず原因を特定する。NFT型の目的関数は回帰の目標を順方向の速度場から作るため、逆方向の場との差という隠れた順逆自己整合力が入り込み、正例と負例を同時に学ぶだけでは部分的にしか打ち消されない（命題1、§3.1）。提案手法は各プロンプトの終点と報酬だけを先に集約して配る。核は補題2で、高報酬の終点を重く見るよう分布を傾けると終点の平均は報酬と終点の共分散の方向に動く。これをK本のロールアウトから推定して誘導に使い（式5）、信頼領域マスク付きの2回目の更新で復元を担わせる（§4）。", "p4": "評価は画像と動画の生成。画像ではSD3.5-M（512×512、LoRAランク32）でGenEval、OCR、PickScoreの単一報酬と4指標の多報酬を比較し、Flow-GRPOやDiffusionNFT（EMAあり・なし）と並べ、FLUX.1-devにも広げる。動画はHunyuanVideo-13Bで視覚品質（VQ）と動きの品質（MQ）に等重みを置く（§5）。", "p5": "画像では、課題ごとのEMA調整なしでDiffusionNFT（方策内）の崩壊を避けつつDiffusionNFT（EMA）と同等の効率に達し、Flow-GRPOのステップ500時点の報酬にGenEvalで10.0倍、OCRで5.2倍、PickScoreで9.6倍少ない訓練ステップで到達する（図5）。動画ではVQ 5.5の到達が24ステップ・63.4 GPU時間で、DiffusionNFT（EMA）の273ステップ・1,401.4 GPU時間に対し22.1倍少ない。400ステップの評価VQとMQは8.970と4.224で、最良の既存手法に対し31.4%と57.4%の改善である（表3）。", "p6": "著者は結論で順過程の学習に対する理解を与えたと述べるが、限界を明示する節は置いていない。報酬モデルの選択に依存する点や、信頼領域の閾値と傾けの強さτの決め方は検討されておらず、残る疑問である。", "fun": "画像や動画を作るAIを「良い出来のものを増やす」方向に訓練すると、速いやり方は不安定で、安定なやり方は遅いという困った二択があった。この研究は不安定さの正体を、目的関数の中に紛れ込んだ余計な力として突き止め、報酬の情報を先にまとめてから配ることでその力を構造的に消した。結果、同じ品質に届くまでのGPU時間が20倍以上短くなった。原因を数式で特定すると、調整の職人技ではなく設計で直せるという好例である。", "unverified": "表1・表2の個別の数値（ステップ400時点の評価値とGPU時間の一覧）は本文の表が機械可読に崩れており、文章中で言及された値のみ引用した。"}}, {"id": "pn12", "rank": 12, "field": "経済学", "headline": "半導体の知識は市場を通って国境を越える", "title": "How Knowledge Crosses Borders: Evidence from Semiconductor Manufacturing", "url": "https://doi.org/10.3386/w35879", "authors": "Pinelopi K. Goldberg ほか", "venue": "NBER Working Paper", "apa": "Goldberg, P. K., Juhász, R., Forte, G. L., & Thurk, J. (2026). How Knowledge Crosses Borders: Evidence from Semiconductor Manufacturing (NBER Working Paper No. 35879). National Bureau of Economic Research. https://www.nber.org/papers/w35879", "why": "現代の半導体製造で国境を越える学習が重要であり、その経路がサプライチェーン上の知識共有、多国籍企業内の技術者の移動、対外直接投資といった意図的な経済関係であって、匿名の技術的波及ではないと示した。最先端の知識へのアクセスが自動的でないという政策含意を導いている。", "explain": {"basis": "本文", "basis_note": "機関リポジトリ経由のPDF本文を読んだ。実証枠組み（§3）、データ（§3.5）、学習率の推定（§3.5以降、付録A.3の表A.2の説明）、結論を参照した", "preprint": true, "p1": "半導体製造の学習が自国内の経験だけでなく国境を越えた経験からも進むことを、学習率の推定で分けて示せるようになった（§3.5、結論）。", "p2": "半導体の経験による学習（learning-by-doing）は古くから知られるが、議論は企業内の蓄積か同一国内の企業間の波及に偏ってきた。現代の製造が国際的な生産体制に埋め込まれていることが反映されていなかった（§1）。", "p3": "学習の源を3つに分ける。(a)あるファウンドリがある技術を作って積み上げた経験、(b)同じファウンドリが他の技術を作って積み上げた経験、(c)他国のファウンドリが同じ技術を作って積み上げた経験である。価格の推移に学習を織り込んだ需給モデルを立て、技術間・国間の費用差（賃金を含む）と供給者の品質差を統制したうえで寄与を分けて推定する（§3）。", "p4": "データは世界半導体アライアンス（GSA）のウェハ価格調査で、2004〜2019年の17,089件の四半期回答。ウェハの価格・数量・特性とファウンドリの所在国を含み、世界のファブレス向けウェハの約5分の1に当たるとされる。マイクロプロセッサ、SoC、汎用ICを対象としメモリは除く。標本期間の平均で米国7%、台湾56%、中国10%である（§3.5）。", "p5": "供給者と技術の組にだけ学習を認めると学習率は3.7%（95%区間2.9〜4.4%）で、Irwin and Klenow (1994) の20〜30%という先行値を大きく下回る。国境を越えた学習まで認めると17.3%（95%区間9.5〜24.4%）に上がる。90nm技術では後発の中国が既存の台湾・日本より低い価格で参入しており、これが他国の経験からの学習として現れる。基準の定式化ではγ、α、μが順に−0.27、0.14、0.12で、自社・自技術の累積生産1単位からの学習が他国からの1単位より約8倍大きい。ただし他国の累積生産は1社の8倍を超えることが多いため、合計では国境を越えた学習が上回ると見られる（§3.5）。", "p6": "著者は結論で、知識の伝達が市場関係を通じて内部化されているなら、波及が内部化されないことを根拠にする産業政策の正当化は弱くなる一方、各国政府は自国の技術進歩が海外に生む便益を内部化しないため緊張が生じると述べる。実証面では、各注文を満たした具体的なファウンドリを識別できず市場の寡占構造から推測していることが制約である（§3.5）。", "fun": "半導体は「作れば作るほど上手くなる」産業として知られる。ところが自社の経験だけで学習率を測ると3.7%にしかならず、業界の常識の20〜30%とまるで合わない。国境を越えた学習を認めると17%台まで上がり、謎が解ける。決定的なのは、後から参入した国の価格が先行国より低いところから始まるという事実。ゼロから学び直すなら高いはずなのに安い。知識は空気中に漂っているのではなく、取引先や転職する技術者という具体的な経路を通って運ばれていた。", "unverified": "表A.2の個別の推定値と標準誤差、§4の経路ごとの誘導形の推定結果は、本文の表が機械可読に崩れており読み取れなかった。"}}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "マスク拡散が潜在構造を学べる理由", "title": "Transformer-Based Masked Diffusion Models Provably Learn Distributions with Latent Structure", "url": "https://arxiv.org/abs/2610.12544", "authors": "Jingda Wu ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Wu, J., & Cai, C. (2026). Transformer-Based Masked Diffusion Models Provably Learn Distributions with Latent Structure (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12544", "why": "マスク拡散モデルの誤差を並列化誤差と推定誤差に分けて扱ってきた既存理論に対し、端から端までの統計的保証を与えた。隠れマルコフ木の混合として潜在構造を表すと、標本複雑度が語彙サイズの系列数ではなく潜在構造で決まり、木の構造や成分パラメータを知らなくても自動的に適応すると示した。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。主要な貢献（§1.1）、準備（§2.1–2.2）、問題設定（§3）、主結果（§4.1–4.2、定理1・2）を参照した", "preprint": true, "p1": "マスク拡散モデルの標本複雑度が、系列空間の大きさではなくデータの潜在構造で決まることを、マスク予測器の学習から生成分布のKL精度までつないで示せるようになった（§1.1、定理2）。", "p2": "マスク拡散モデル（MDM, masked diffusion model）は離散データを並列にマスク解除して生成する。その誤差は並列化によるものと有限標本でのマスク予測器の推定によるものに分かれるが、既存理論は両者を別に扱い、統計的な上界は語彙サイズVに対する長さLの系列の総数V^Lに比例して次元の呪いを受けていた（§1、§1.2）。", "p3": "着想は、低次元の構造を隠れマルコフ木の混合としてモデル化することである。各成分の内部では潜在変数が木構造の依存を持ち、成分の違いが異質性を表す。重要なのは、データ分布がこのクラスに厳密に属する必要はなく、近似されていればよい点である。そのうえで、トランスフォーマーのマスク予測器と並列のマスク解除手順が、木の形や成分のパラメータを事前に知らなくても、未知の潜在構造に適応することを示す（§1.1、§3）。", "p4": "評価は理論的な保証そのもので、定理1がマスク予測器の推定誤差（任意の木構造に適用できる）、定理2が端から端までの標本誤差を与える。良しとする基準は、生成分布と真の分布のKLダイバージェンスをεに抑えるのに必要な訓練標本数が、系列空間の大きさに依存しないことである（§4.1–4.2）。", "p5": "主結果は、データ分布がこの混合でよく近似され、並列化誤差が十分小さいとき、トランスフォーマーベースのMDMがKLダイバージェンスでε精度の標本生成を達成するのに Õ(L·K_par/ε) の訓練標本で足りるというものである（式1）。ここでLは系列長、構造複雑度K_parは系列長・語彙サイズV・隠れ状態数・成分数の多項式であり、系列空間の大きさV^Lには比例しない。これが次元の呪いを避ける要点である（§1.1）。", "p6": "著者が明示する限界は、結果が隠れマルコフ木の混合による近似の良さと並列化誤差の小ささという条件に依存することである（§1.1）。この条件が実データでどの程度満たされるか、並列化誤差を実際にどう抑えるかは本文の範囲外で、残る疑問である。", "fun": "長さLの文を語彙V語から作る場合、ありうる組み合わせはV^L通りで、すぐ天文学的な数になる。これだけ候補があるのに、実際の生成モデルは現実的なデータ量で学習できてしまう。なぜかを説明するのがこの論文で、答えは「本物のデータには隠れた木のような構造があるから」。必要なデータ量は、組み合わせの総数ではなくその木の複雑さで決まる。しかもモデルは木の形を教えられなくても自動的に合わせていく。", "unverified": "定理1・定理2の条件の具体的な形、並列化誤差の定量的な評価。長い数式を含む節は読み切れなかった。"}}, {"id": "pn14", "rank": 14, "field": "統計学", "headline": "尤度がなくても逐次監視に耐える信頼区間", "title": "SLICE: Sequential Likelihood-Free Inference via Conformal E-Values", "url": "https://arxiv.org/abs/2610.13855", "authors": "Stefano Cortinovis ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Cortinovis, S., Battaglia, L., & Caron, F. (2026). SLICE: Sequential Likelihood-Free Inference via Conformal E-Values (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13855", "why": "シミュレーションはできるが尤度が扱えないモデルに対し、厳密でいつ止めても有効な信頼列を構成した。各観測で候補の帰無仮説からシミュレーションし、予測可能なスコアを等角化して条件付きe値にし、その積が検定マルチンゲールになる。スコアの精度によらず妥当性が保たれる点が強い。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。準備（§3.1–3.2）、手法（§4.1–4.2、式6–10）、実験（§5）、考察と限界（§6）を参照した", "preprint": true, "p1": "シミュレーションはできるが尤度が計算できないモデルについて、いつ観測を止めても有効な厳密な信頼列を作れるようになった（§4.1、§6）。", "p2": "尤度が扱えないモデルでは頻度論的な不確実性の定量化が難しい。固定標本の方法は、観測を見ながら止めるかどうかを決めると被覆の保証が崩れる。逐次的に監視しながら妥当性を保つ枠組みが必要だった（§1）。", "p3": "構成は4段である。各時点で過去の情報だけから決まる正の予測可能なスコアT_iを選び（式6）、候補パラメータθのもとでK個の参照シミュレーションを生成し（式7）、観測と参照を合わせて等角化して条件付きのe値に変換し、その積が検定マルチンゲールになるのでパラメータについて反転させて信頼列を得る。要点は妥当性がスコアの精度に依存せず、スコアは信頼列が縮む速さだけを決めることである（§4.1）。最適なスコアは期待対数成長率（式10）を最大化するもので、これが尤度比に当たる。", "p4": "評価は3段。合成実験（ガウスモデルとg-and-kモデル）で等角化や尤度比の学習が効率に払う代償を測り、次にLLM APIのモデル置き換えの半合成的な監査、最後にOGLE-IVのマイクロレンズ観測から恒星の初期質量関数を推論する。α=0.1に固定し、真値が既知なら累積の非被覆を報告し、効率は信頼集合の幅と候補の残存確率で評価する（§5）。", "p5": "LLM APIの監査は、宣伝されたモデルPの代わりに安価なモデルRが使われる割合θを推定する設定で、監査者は両モデルから標本を取れるが尤度は評価できない。P=qwen3:8b、R=qwen3:1.7bとし、返答の確率質量は f_θ=(1−θ)p+θr となるため尤度比は比ρ=r/pだけで決まる。本文は、信頼列が逐次監視のもとで妥当なままである一方、固定標本の方法はそうならないこと、ニューラルスコアが厳密な尤度比や応用固有のスコアと競合する性能を保つことを報告する（§5、§6）。", "p6": "著者は、候補パラメータの格子に依存すること、参照シミュレーションが信頼列に余分なランダム性を加えること、最良の効率を得るには良い予測可能な対立仮説が必要なこと、そしてモデルベースの方法である以上シミュレータが正しく特定されている必要があることを限界として挙げる（§6）。前2つの拡張は付録Cで議論され、3つ目は事前情報の取り込みなどが今後の課題とされる。", "fun": "データを集めながら「もう結論を出していいか」を何度も確かめると、ふつうの統計の保証は壊れる。見るたびに偶然当たる機会が増えるからだ。この論文は、確率の計算式が書けないモデルでも、何回のぞいても壊れない区間の作り方を示した。仕掛けは、観測1つごとに新しくシミュレーションを走らせて比べ、その比の積を使うこと。しかも面白いのは、使うスコアがどれだけ下手でも区間の正しさは保たれ、上手なら区間が速く縮むだけという役割分担である。", "unverified": "図1の数値（累積非被覆や平均幅の具体値）、マイクロレンズ応用の推定結果は、本文の図表から読み取れなかった。"}}, {"id": "pn15", "rank": 15, "field": "経済学", "headline": "資金が凍ると延滞債権の買戻しが止まる", "title": "The Financing of Debt Relief: Intermediary Liquidity and the Value of Borrower Information", "url": "https://arxiv.org/abs/2610.12875", "authors": "Arka P. Bandyopadhyay", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Bandyopadhyay, A. P. (2026). The Financing of Debt Relief: Intermediary Liquidity and the Value of Borrower Information (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12875", "why": "2019〜2022年のGinnie Mae買戻しオプション190万件を使い、2020年に調達市場が凍結したときノンバンク発行者が同じプールの預金取扱金融機関より買戻しを大きく減らし、現金を最も要する大口債権から手を引いたと示した。約190億ドルの買戻しが遅れ、多くは後に実施された。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。制度（§2）、理論（§3–4、命題1・4・5）、実証（§5.1–5.2）、結論（§7）を参照した", "preprint": true, "p1": "仲介者の資金繰りが延滞債権のどれをいつ救済するかを決めることを、ランキングに沿った配分の縮小として示せるようになった（§5.2、§7）。", "p2": "介入の原資がどこから来るかは、介入の有無だけでなく「どの案件が選ばれるか」を変えうる。しかし借り手の情報の価値と資金枠の制約を一緒に評価する枠組みがなかった（§1）。", "p3": "理論の核は、仲介者が「現金1ドルあたりの価値」の高い順に資金を出し、価値がゼロになるところで止めるという配分（命題1）である。各介入に現金kが必要で枠がKなら資金を出せる割合はm=K/kになる。信号の配分価値ΔV(m)は、情報を使って上位から選んだ価値V_G(m)と情報なしで一律に選んだ価値V_0(m)=m(Rp−c)の差である（式4–5）。命題4はこれが中間の資金枠で最大になることを示す。枠が十分なら全部に出すので情報は選別にしか使われず、枠が極小なら使う余地がないためである（§4）。", "p4": "データはGinnie Maeの一戸建てプール向け公開ローン単位開示（2013年12月〜2022年12月）。2019年1月から2022年9月に権利が発生した1,922,668件の買戻しオプションを120の発行者について使う（ノンバンク1,298,771件、預金取扱623,897件）。ノンバンクは上限のある融資枠、預金取扱機関は預金で資金を出す。ランキングは観測できないため、2016〜2018年のノンバンク自身の298,723件の決定から推定した線形予測子を代理とする（§5.1）。", "p5": "2020年に調達市場が凍結したとき、ノンバンクは同じプールの預金取扱機関より買戻しを大きく減らし、同じ発行者・同じ月の中でも大口残高、つまり最も現金を要する債権から手を引いた。買戻しは基準から約190億ドル下回った。凍結コホートに衝撃前の残高加重の行使率を当てると3か月以内で188億ドルの不足だが、24か月でみると差は51億ドルに縮まる（§5.2）。ランキング自体は変わらず、資金が戻ると同じ順序を下に辿り直す形になっている。", "p6": "著者は、これらのパターンが現金制約と整合的だが、観測できない資金調達の条件、事前のトレンド、発行者ごとの評価の違いがあるため因果の解釈には限界があると明記する。また買戻し不足は行動のタイミングを表すもので厚生損失ではなく、流動性支援の評価には資金調達やその後の処理の証拠が必要だと述べる（§7）。", "fun": "延滞した住宅ローンを買い戻して処理する仕事では、どの案件を扱うかは価値の順に決まっていそうだ。2020年に資金が凍ったとき、その順序は崩れなかった。崩れたのは「どこまで下まで手を伸ばすか」で、現金を多く食う大口から先に手を引いた。順番を保ったまま打ち切り線が上がる、という予測が当たった形である。さらに面白いのは、情報の価値が資金枠が中くらいのときに最大になること。全部やれるなら選ぶ必要がなく、何もできないなら選んでも意味がない。", "unverified": "§5.3〜5.7の個別の推定値（資金枠ごとの反応、残高勾配、発行者類型内の資金圧力の指標）は、本文の表が機械可読に崩れており読み取れなかった。"}}, {"id": "pn16", "rank": 16, "field": "機械学習（Hugging Face）", "headline": "見て即座に反応するヒューマノイド制御", "title": "Reflex: Visually Grounded Reactive Humanoid Control", "url": "https://arxiv.org/abs/2610.12772", "authors": "Taoyang Jia ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-12", "apa": "Jia, T., Huang, W., Song, L., Darlington, J., Zhao, J., Wang, Y., Duan, J., Ren, Z., & Krishna, R. (2026). Reflex: Visually Grounded Reactive Humanoid Control (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12772", "why": "テニスの返球や落ちるコップを掴むような、視覚に基づく反射的な行動をヒューマノイドで実現する研究である。計画して動くのではなく、視覚的に接地した反応として制御を組む設計で、投票数も多く注目されている。", "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "投げられた箱をヒューマノイドが全身で受け止める、視覚に根ざした反射的な制御を実現した（抄録）。", "p3": "3段階の枠組みで、必要な能力を段ごとに学びながら、物体の運動の簡潔な表現で結ぶ。まず状態に基づく方策が強化学習で全身の捕球を学ぶ。次に、遅延した不完全な観測から動く箱の運動を推定することを学ぶ。最後に一人称視点のRGB-D符号器が（抄録の該当部分はここで切れている）。", "p5": "著者は、投げられた箱を受け止める課題を、全身の協調・物体の運動への実時間の反応・一人称視覚への知覚の接地という3つの能力をすべて要求する代表的な課題として選び、既存の系はその一部しか覆わず、エンドエフェクタ・モーションキャプチャ・マーカー付き物体に依存していると述べる。定量的な成功率は抄録の収まった範囲に示されていないため未確認（抄録）。", "fun": "落ちてくるコップを受け止める、投げられた箱を取る。人間が1秒ほどで無意識にやることが、ロボットには難しい。難しさは3つ重なっている。全身を一度に動かすこと、飛んでくる物の軌道を途中で読むこと、そして外から付けたマーカーではなく自分の目で見ること。この研究は3つを段階に分けて順に学ばせ、物の運動の表現で橋渡しした。", "unverified": "成功率などの定量的な結果、第3段階の内容。抄録が途中で切れており、本文も入手できず確認できなかった。"}}, {"id": "pn17", "rank": 17, "field": "機械学習", "headline": "LLMの強化学習をダイバージェンスで統一", "title": "Generalized Proximal Policy Optimization: Unifying LLM RL Algorithms from the Perspective of Divergence", "url": "https://arxiv.org/abs/2610.13015", "authors": "Zhicheng Cai ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Cai, Z., Guo, X., Wu, H., Dai, W., Zhou, Y., Ma, W.-Y., Zhang, Y.-Q., & Zhou, H. (2026). Generalized Proximal Policy Optimization: Unifying LLM RL Algorithms from the Perspective of Divergence (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13015", "why": "LLMの推論強化の主流であるPPOが幾何的に特定のダイバージェンスに依存している点を指摘し、一般化された近接方策最適化としてLLMの強化学習アルゴリズム群を統一的に捉える視点を与えた。アルゴリズム選択の根拠を整理する研究である。", "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "LLMの強化学習のアルゴリズム群を、ダイバージェンスの選び方という1つの観点から統一的に設計・理解できるようにした（抄録）。", "p3": "一般化されたf-ダイバージェンスの信頼領域の理論を立て、単調な性能改善の保証を与える。異なるf-ダイバージェンスが異なる幾何と方策更新の動きを引き起こすことを示す。さらに、従来の1標本モンテカルロ推定より忠実なダイバージェンス推定を与える新しい推定器の構成も導入する（抄録）。", "p5": "この枠組みのもとで、PPOと近年の変種（DAPO、DPPO、RIPO）が特殊な場合として現れる。著者は、主流のPPOが幾何的に退化したクリッピングの代理を使うため、方策の移動に対する抵抗を適応させられず、早すぎるクリッピングと探索の劣化を招くと指摘し、後続の変種はそれを断片的で経験則的な修正で緩和してきたと述べる（抄録）。", "fun": "LLMを強化学習で鍛える手法は毎月のように新作が出るが、どれも「方策を急に変えすぎないよう制限する」という同じ目的のための別の工夫である。この研究は、その制限の仕方が「2つの分布の違いをどう測るか」の選択に還元できることを示した。すると主要な既存手法が特殊な場合として並び、どれを選ぶべきかが幾何の問題になる。乱立する手法を1本の軸に並べ替える仕事である。", "unverified": "単調改善の保証の条件、実験での性能比較。本文が入手できず確認できなかった。"}}, {"id": "pn18", "rank": 18, "field": "機械学習", "headline": "トランジスタだけの物理学習器が文脈内学習する", "title": "An all-transistor physical-learning transformer can be trained to perform in-context learning", "url": "https://arxiv.org/abs/2610.12571", "authors": "Michael C. Abbott ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Abbott, M. C., & Machta, B. B. (2026). An all-transistor physical-learning transformer can be trained to perform in-context learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12571", "why": "平衡伝播や結合学習で訓練される系は多層パーセプトロンと同類で連想的な課題に弱かった。全てトランジスタで構成した物理的な学習トランスフォーマが、訓練によって文脈内学習を行えると示している。学習を物理系そのもので実現する方向の成果である。", "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "トランジスタだけで組んだ物理的な学習回路に注意機構を持たせ、文脈内学習をさせることに成功した（抄録）。", "p3": "平衡伝播や結合学習で訓練される系は、入力と出力の間を情報が双方向に流れることに依存する。ところが内積型の注意を表すのに必要な乗算のような複雑な非線形系では逆向きの流れが壊れる。そこで二重（dyadic）回路に専用の回路素子を追加して双方向の流れを明示的に回復し、サブスレッショルド領域のMOSFETの指数的な電流則を利用して注意機構を構成する（抄録）。", "p5": "シミュレーションで、近似的な勾配しか伝えない現実的な逆方向の素子を使いながら、簡単な文脈内学習の課題を学習できることを示した。この学習が成功するには、平均二乗誤差ではなく交差エントロピー損失が必要であると報告されている（抄録）。", "fun": "ニューラルネットの学習は通常、計算機の中で勾配を数値的に計算する。これを物理回路そのものにやらせようという研究があり、ただし乗算が入ると逆向きの情報の流れが壊れるので、注意機構が作れなかった。この論文はトランジスタの指数的な特性をそのまま使って注意を作った。おもしろいのは、学習が成功するかどうかが損失関数の選び方で決まった点である。", "unverified": "回路規模、課題の難易度、学習の精度。本文が入手できず確認できなかった。"}}, {"id": "pn19", "rank": 19, "field": "機械学習", "headline": "トランスフォーマをEMと確率伝播で読む", "title": "Neural expectation-maximization and meta-models", "url": "https://arxiv.org/abs/2610.12741", "authors": "Zhuolin Fu", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Fu, Z. (2026). Neural expectation-maximization and meta-models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12741", "why": "トランスフォーマを、max-product型のループ確率伝播とEM法を組み合わせた混成の確率推論手続きの学習された近似として解釈した。注意機構を確率的グラフィカルモデルの推論として位置づける見方を与えている。", "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "トランスフォーマーを、ループ確率伝播とEM法を組み合わせた確率推論手続きの学習された近似として解釈する枠組みを与えた（抄録）。", "p3": "この見方では、トランスフォーマーは構造とパラメータが事前に与えられず データから推定される、部分観測のマルコフ確率場（MRF）で推論を行っている。自己注意は、入力に条件づけられ動的に構造化されたMRF上のmax-productループ確率伝播（LBP）の微分可能な近似を実装し、注意の重みが学習された構造的な親和性を符号化する（抄録）。", "p5": "さらに深さの水準でEMとの対応を立てる。各層がEステップのような前向きの伝播で潜在表現を更新し、層をまたぐパラメータの遷移が暗黙のMステップとして働く。この解釈に基づいて「メタモデル」という設計の考え方を導入し、入力が事例固有のパラメータを生成する仕組みとして、自己注意・混合専門家・ゲート付きユニットを1つの枠組みに統一する（抄録）。", "fun": "トランスフォーマーがなぜうまく動くのかは、実は十分に説明されていない。この論文は、それが確率的グラフィカルモデルの推論アルゴリズムを学習で真似たものだと読む。注意の重みが「どの変数がどの変数と関係するか」の推定にあたり、層を重ねることがEM法の反復にあたる。統計学の古典的な道具で深層学習を言い直すと、混合専門家やゲートも同じ家族に見えてくる。", "unverified": "実験の内容と結果、メタモデルの具体的な実装。本文が入手できず確認できなかった。"}}, {"id": "pn20", "rank": 20, "field": "機械学習", "headline": "スコア作用素を文脈内で学ぶ拡散モデル", "title": "Transformer-based In-Context Score Operator Learning for Diffusion Models", "url": "https://arxiv.org/abs/2610.13690", "authors": "Wuzhe Xu ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Xu, W., Shen, Z., Lu, Y., Liao, W., & Lai, R. (2026). Transformer-based In-Context Score Operator Learning for Diffusion Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13690", "why": "拡散モデルは通常ひとつの目標分布か訓練時に固定された条件変数の族を学ぶが、スコア作用素自体を文脈内で学習することでその制約を外す方向を示した。生成モデルの汎用化に関わる定式化である。", "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "拡散モデルが、少数の例を文脈として渡すだけで未知の目標分布から標本を生成できるようにした（抄録）。", "p3": "各目標分布をメタ分布から引かれた課題として扱い、推論時に経験的な文脈集合で指定する。文脈の標本、雑音を含む問い合わせ点、拡散の時刻を課題依存のスコアに写す「文脈内スコア作用素」を学習し、再学習やパラメータ更新なしで未知の課題に対する逆拡散の標本化を可能にする（抄録）。", "p5": "鍵となる観察は、課題依存のスコアがガウスカーネルによる条件付き平均の表現を持つことである。その経験的なNadaraya–Watson近似は、構成したトランスフォーマーのクラスのモデルで厳密に表現できる。これが、提案する問い合わせ依存の注意構造の原理的な基礎を与えると述べられている（抄録）。", "fun": "画像生成などに使われる拡散モデルは、学習したときの分布しか作れない。新しい分布を扱うには再学習が必要になる。この研究は、少数の例を「文脈」として渡すだけで新しい分布を扱えるようにした。仕掛けとして面白いのは、必要なスコア関数が統計学の古典的なカーネル回帰（Nadaraya–Watson推定）の形に書けると見抜き、それを注意機構で厳密に表現できると示したところである。", "unverified": "実験の対象分布と精度、学習の規模。本文が入手できず確認できなかった。"}}, {"id": "pn21", "rank": 21, "field": "機械学習", "headline": "グラフで反実仮想予測を償却する", "title": "Amortized Counterfactual Prediction with Graph Neural Networks", "url": "https://arxiv.org/abs/2610.13724", "authors": "Hendrik Stumpf ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Stumpf, H., & Quinzan, F. (2026). Amortized Counterfactual Prediction with Graph Neural Networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13724", "why": "別の条件なら結果がどう違ったかという反実仮想の推論を、グラフニューラルネットで償却して予測する枠組みである。個別に推論を解き直す必要を減らす設計で、因果推論と表現学習の接点にある。", "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "因果グラフを先に推定せずに、観察データから直接、反実仮想の問いに答えられるようにした（抄録）。", "p3": "反実仮想の推論には通常、背後にある因果構造の知識が必要で、実務では得られないことが多い。そのため観察データから因果グラフを推定し、それから反実仮想の推論を行うのが一般的だが、推定したグラフの誤りが下流の予測に伝播する。提案するCounterfactual Graph Neural Process（CFGNP）は、グラフ推定を介さない端から端までの方法である（抄録）。", "p5": "CFGNPはグラフニューラルネットワークを使い、事実と反実仮想の対応する変数の間だけに世界をまたぐメッセージ伝達を制限することで、二重グラフの構造を活用する。合成データと画像ベースのベンチマークにまたがって評価されている。具体的な精度の数値は、抄録が途中で切れており未確認（抄録）。", "fun": "「あの患者に別の薬を出していたら治っていたか」という問いに答えるには、何が何に影響するかという因果の地図が必要になる。普通はデータから地図を描いてから計算するが、地図の間違いがそのまま答えの間違いになる。この研究は地図を描く段を飛ばし、事実と「もしも」の2つの世界を並べたグラフの上で、対応する変数の間だけ情報をやりとりさせる。", "unverified": "ベンチマークでの精度、比較した既存手法。抄録が途中で切れており確認できなかった。"}}, {"id": "pn22", "rank": 22, "field": "統計学", "headline": "選択が繰り返される場でも被覆を保つ", "title": "Sequential Conformal Calibration under Recursive Selection", "url": "https://arxiv.org/abs/2610.12937", "authors": "Yuning Yang (Georgia Institute of Technology) ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Yang, Y., Liu, Z., Wang, T., & Li, D. (2026). Sequential Conformal Calibration under Recursive Selection (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12937", "why": "等角予測の有限標本・分布非依存の被覆保証は、多段階で前段の決定が後段の母集団を決める問題では崩れる。再帰的な選択の下で逐次的に校正を行う手法を与えており、意思決定を含む予測の妥当性に関わる。", "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "前段の決定が後段の母集団を決める多段の問題で、各段の接頭辞すべてについて有限標本の被覆保証を持つ等角校正を構成した（抄録）。", "p3": "多段の問題では、後段のスコアを前段の校正結果で再適合させると、それらの事例を順位づけに再利用することが生き残った検証事例との交換可能性を保つとは限らない。そこで各段で新しい分割（fresh fold）を使う逐次的な等角校正を考える。前段の分割に条件づけると、選ばれた分割のスコアと生き残った検証スコアが交換可能になる（抄録）。", "p5": "これにより決定の列のあらゆる接頭辞について有限標本の被覆保証が得られる。生存者のスコア分布が原子を持たない場合、実現された被覆過程について二項間引きのベータ連鎖（Binomial-thinned Beta chain）を導く。その法則は分割の大きさと目標水準だけに依存し、予測可能な再適合のもとでも成り立ち、厳密な被覆の余裕・棄権確率・校正条件付きの保証を与える。新しさとデータ再利用のトレードオフも特徴づけられる（抄録）。", "fun": "予測に幅を付ける等角予測は、どんな分布でも決めた確率で当たる範囲を出せるという強い保証が売りである。ところが選抜を何段も重ねる場面、たとえば書類選考のあと面接という流れでは、前の段で絞った結果が次の段の対象を変えてしまい、保証の前提が崩れる。この研究は各段で手つかずのデータを使うという素朴な解き方に、どの段で止めても保証が成り立つという理論を与えた。", "unverified": "ベータ連鎖の具体的な形、トレードオフの定量的な評価。本文が入手できず確認できなかった。"}}, {"id": "pn23", "rank": 23, "field": "統計学", "headline": "研究の外的妥当性をカーネルで定式化する", "title": "Kernel-based External Validity of Experimental Studies", "url": "https://arxiv.org/abs/2610.13625", "authors": "Federico Matteucci ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Matteucci, F., & Neumann, G. (2026). Kernel-based External Validity of Experimental Studies (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13625", "why": "ある研究の知見が未観測の実験条件やデータセットにどこまで一般化するかを、研究の結果と研究設問を合わせて形式化し、カーネル法で扱えるようにした。追試や一般化可能性の議論に定量的な枠組みを与える。", "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "研究の外的妥当性を、独立な2回の追試の結果の差が許容範囲に収まる確率として定式化できるようにした（抄録）。", "p3": "研究の結果とその研究設問を合わせて形式化し、外的妥当性を「同じ規模の独立な2回の追試の結果の最大平均差異（MMD）が与えた許容値を下回る確率」と定義する。結果の空間と、MMDに使う適切な再生核をどう選ぶかが設計の中心で、多様な種類の結果と設問に適用できる柔軟さを持つ（抄録）。", "p5": "研究の規模とMMDの分位点の間に漸近的なべき法則の関係を立て、小規模な予備研究から外的妥当性のある研究に必要な規模を見積もるのに使う。枠組みを同順位のあるランキングに適用し、設問に応じた核を論じる。既存の事例研究と、新たに設計したシミュレーション研究での実験が適用可能性を示す。コードは公開されている（抄録）。", "fun": "「この研究の結果は他の状況でも成り立つか」という問いは、再現性の議論の中心にありながら、定義があいまいだった。この論文の答えは明快で、「同じ規模でもう2回やったら、結果がどれだけ近いか」の確率として定義する。しかも規模と結果のばらつきの関係がべき法則に従うので、小さな予備研究から必要な規模を逆算できる。概念を測れる量に直した仕事である。", "unverified": "べき法則の指数、事例研究の対象。本文が入手できず確認できなかった。"}}, {"id": "pn24", "rank": 24, "field": "統計学", "headline": "事前分布適合網はベイズ推論をどこまで再現するか", "title": "How Well Do Prior-Data Fitted Networks Amortize Bayesian Inference?", "url": "https://arxiv.org/abs/2610.13764", "authors": "Manuel H\\\"ulskamp ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Hülskamp, M., Kobialka, J., Sommer, E., Nagler, T., & Rügamer, D. (2026). How Well Do Prior-Data Fitted Networks Amortize Bayesian Inference? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13764", "why": "事前分布適合網は合成事前分布のベイズ事後予測分布を近似するよう訓練されるが、近似の質についての結果は意外に乏しい。その近似精度を正面から評価した研究で、償却推論の信頼性に関わる。", "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "事前分布適合網（PFN）がベイズの事後予測分布をどれだけ忠実に近似しているかを、誤差を3つに分解して測れるようにした（抄録）。", "p3": "経験リスク最小化の観点から、PFNの運用時の誤差を事前分布の誤差・文脈の誤差・償却の誤差に分解し、現実的な事前分布のもとで参照となる事後予測分布に対して償却の誤差を測る（抄録）。", "p5": "PFNは概して目標の事後予測分布をよく回復する。しかし償却の誤差の一部は、事前の事前学習分布のもとで稀な設定において、モデル規模を大きくしても残る。これは独立に事前学習したPFN同士の不一致として現れ、推論時に予測器についての不確実性を残す。対策として複数種類のベイズモデル平均を調べ、これらがこの不確実性を一貫して減らし、full-size TabICLv2モデルまで予測を改善できると報告する（抄録）。", "fun": "事前分布適合網は、ベイズ推論の答えをあらかじめ丸暗記させたような仕組みで、推論が一瞬で終わる。この研究が調べたのは、その暗記がどれだけ正確かである。概ね正確だが、学習時に稀だった状況では誤差が残り、しかもモデルを大きくしても消えない。その証拠として、別々に学習した2つのPFNの答えが食い違う。平均を取ると改善するという対策も、素直で分かりやすい。", "unverified": "誤差分解の定量的な内訳、ベイズモデル平均の種類。本文が入手できず確認できなかった。"}}, {"id": "pn25", "rank": 25, "field": "統計学", "headline": "不均衡でも効く深層ノンパラメトリック検定", "title": "From Imbalance to Evidence: Deep Nonparametric Testing for Complex Data under Severe Sample Imbalance", "url": "https://arxiv.org/abs/2610.12946", "authors": "Guanhao Zhou ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Zhou, G., & Yu, X. (2026). From Imbalance to Evidence: Deep Nonparametric Testing for Complex Data under Severe Sample Imbalance (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12946", "why": "標本数が極端に偏る状況で分布を比較する際、多数側の情報を活かしながら少数側の差に感度を保つことが難しい。深層ノンパラメトリック検定でこの両立を図る手法を提案している。", "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "標本数が極端に偏った状況での2標本検定で、多数側のデータを「繰り返し得られる検定の証拠」として使う枠組みを作った（抄録）。", "p3": "分類器2標本検定（C2ST）は柔軟だが、既存の手続きは主に均衡した、あるいは同程度の大きさの標本を想定している。本研究は極端に偏った領域でC2STを調べ、著しい標本の不均衡が検定性能を大きく損なうことを示す。そのうえで不均衡を単なる学習上の邪魔者ではなく、繰り返し使える検定の証拠の源に変える（抄録）。", "p5": "この着想に基づき、分類器に依存しない枠組みEIAD-C2STを提案する。データの構造に合わせて分類器を選べるため多様なデータ様式に対応し、グラフのような非ユークリッドの複雑なデータも扱える。具体的な検定力の比較は、抄録が途中で切れており未確認（抄録）。", "fun": "2つの集団の分布が違うかを調べるとき、片方のデータが極端に少ないと検定が効かなくなる。ふつうは少ない側に合わせて多い側を捨てるのだが、この研究は逆の発想をとる。多い側を何度も違う組み合わせで使い、そのたびに証拠を積み上げる。邪魔だった不均衡を、繰り返しの機会に読み替える。グラフのような複雑なデータでも使えるのが利点である。", "unverified": "検定力の比較結果、EIAD-C2STの具体的な手続き。抄録が途中で切れており確認できなかった。"}}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "非ガウス空間場に疎な自己回帰変分推論", "title": "Scalable Sparse Autoregressive Variational Inference for Non-Gaussian Spatial Fields", "url": "https://arxiv.org/abs/2610.13656", "authors": "Paul F. V. Wiemann ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Wiemann, P. F. V., & Katzfuss, M. (2026). Scalable Sparse Autoregressive Variational Inference for Non-Gaussian Spatial Fields (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13656", "why": "ガウス過程事前分布でも尤度が非ガウスだと潜在場の事後分布が解析的に扱えない。疎な自己回帰構造を使った変分推論でこれをスケールさせる手法で、空間統計の計算に関わる。", "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ。抄録が短く情報が限られる", "preprint": true, "short": true, "p1": "尤度が非ガウスの空間データについて、潜在場の事後分布の変分推論を大規模に実行できるようにした（抄録）。", "p3": "事前分布の疎な最近傍の自己回帰構造を、変分族の側にも写す。表現力のために正規化フローの条件付き分布を使い、すべての変分パラメータを1つの共有されたニューラル条件づけ器で償却する（抄録）。", "p5": "縮小した祖先集合を用いた二重確率的最適化により、1反復あたり多重対数（polylogarithmic）の計算量を達成する。既存の近似は大規模な非ガウスのデータに対して遅すぎるか制約が強すぎると位置づけられている。具体的な実験結果は抄録に示されていないため未確認（抄録）。", "fun": "地理的に分布するデータを扱う空間統計では、見えない場（潜在場）を推定する。ガウス過程を事前分布に置いても、観測が非ガウスだと計算が解析的に解けない。この研究の工夫は、事前分布が持つ「近くだけ見る」疎な構造を、近似に使う側の分布にもそのまま持ち込んだこと。構造を写すと計算量が対数の多項式程度に収まる。形を揃えると速くなるという話である。", "unverified": "実験の対象データと精度、比較した既存手法。本文が入手できず確認できなかった。"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "大次元標本共分散の固有ベクトル統計量", "title": "On Eigenvector Statistics of Large-Dimensional Sample Covariance Matrices with Applications", "url": "https://arxiv.org/abs/2610.12928", "authors": "Weiming Li ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Li, W., Li, Z., & Wang, Q. (2026). On Eigenvector Statistics of Large-Dimensional Sample Covariance Matrices with Applications (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12928", "why": "大次元の標本共分散行列について、固有ベクトルで重みづけたスペクトル統計量の挙動を解析し応用を示した。高次元統計の基礎にあたる結果である。", "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "大次元の標本共分散行列について、固有値の関数と固有ベクトルの重なりを組み合わせた統計量の分布を漸近的に与えた（抄録）。", "p3": "標本共分散行列S_nと母共分散Σについて、固有ベクトルで重みづけたスペクトル統計量 T_n(φ,g) = p^{-1}tr{φ(S_n)g(Σ)} を扱う。これは標本固有値の関数と、標本と母集団の固有ベクトルの重なりを組み合わせたもので、両方に依存する統計的な損失に現れる（抄録）。", "p5": "次元と標本数が比例して増えるとき、複数の解析的な検定関数と母集団の重みを持つ統計量の族について、有限次元の決定論的な等価物を中心とする結合中心極限定理を確立する。鍵となる中間段階は、重みづけたレゾルベントのトレースについての結合ガウス過程の極限である。極限の平均と共分散は母集団のスペクトル分布で表される。応用として最小ノルム予測のリスクの分散成分などを扱う（抄録）。", "fun": "データの次元が標本数と同じくらい大きいとき、標本から計算した共分散行列は母集団のものとかなり違う。固有値がずれるだけでなく、固有ベクトルの向きもずれる。この論文が扱うのは、その両方のずれが混ざって現れる統計量である。機械学習の予測誤差を分解するとこの形が出てくるので、高次元の予測がなぜ難しいかを数学的に押さえる道具になる。", "unverified": "極限の平均と共分散の具体的な形、応用の数値結果。本文が入手できず確認できなかった。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "未測定交絡への感度を図で示すRパッケージ", "title": "confoundvis for Visualizing and Reporting Sensitivity to Unmeasured Confounding in R", "url": "https://arxiv.org/abs/2610.13731", "authors": "Subir Hait", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Hait, S. (2026). confoundvis for Visualizing and Reporting Sensitivity to Unmeasured Confounding in R (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13731", "why": "観測研究の結論が覆るには未測定交絡がどれほど強くなければならないかを問う感度分析は、手法ごとに違う量で答えてきた。それらを可視化して報告するRパッケージで、感度分析の実務的な標準化に寄与する。", "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "未測定交絡への感度を、異なる手法の結果を共通の形に揃えて可視化・報告できるRパッケージを作った（抄録）。", "p3": "感度分析は、観察研究の結論が覆るには未測定の交絡がどれだけ強くなければならないかを問う。既存の手法は部分R²、相関の積、リスク比といった異なる量で答えてきた。confoundvisはこれらを共通のオブジェクト、描画関数、レポートで整理し、sensemakr・konfound・EValueの結果を取り込み、OLSの枠組みに測定済み共変量のベンチマークを与える（抄録）。", "p5": "右心カテーテル検査の研究の患者5,735名で作業の流れを示す。調整後の線形確率モデルの係数は0.0634、点帰無の頑健値は0.0608、条件付きの有意性の影響の閾値は0.0376である。測定済み共変量を1項ずつ外したときの最も不利な積は0.0090。ベンチマークと閾値は条件づける集合が異なるため、その比は記述的なものだと注意されている。別の修正ポアソンモデルはリスク比1.103を与える（抄録）。", "fun": "観察研究の「この要因が効いています」という結論は、測っていない何かのせいである可能性を消せない。感度分析はその「何か」がどれだけ強ければ結論が覆るかを計算するが、手法ごとに答えの単位が違って比べられなかった。このパッケージはそれらを同じ図の上に並べる。しかも「ベンチマークと閾値は条件が違うので比は記述的」とまで注意書きが付いている。", "unverified": "パッケージの機能の一覧、各指標の計算式。本文が入手できず確認できなかった。"}}, {"id": "pn29", "rank": 29, "field": "経済学", "headline": "局所射影をあえて過剰識別する", "title": "Intentionally Overidentifying Local Projections", "url": "https://arxiv.org/abs/2610.13269", "authors": "Junjie Guo ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Guo, J., Wang, E., & Xu, K.-L. (2026). Intentionally Overidentifying Local Projections (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13269", "why": "マクロの動的効果推定で標準となった局所射影は、ラグ次数を決めて最小二乗で推定するのが通例である。あえて過剰識別する推定を提案しており、既存の実務的な推定手続きの効率を問い直している。", "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "マクロの動的効果を推定する局所射影を、追加のラグを除外操作変数として使うことで、最小二乗より効率よく推定できるようにした（抄録）。", "p3": "局所射影（LP）は与えたラグ次数のもとで最小二乗（OLS）で実装されるのが通例である。提案する方法は追加のラグを除外操作変数（IV）として使う。有限次のモデルとマルチンゲール差分のショックのもとで、最適に重みづけたIV推定量はOLSより漸近的に非効率になることがなく、データが持続的なときには大きな効率の改善を与えうる（抄録）。", "p5": "単位根のAR(1)でi.i.d.の誤差の場合、1つの過剰識別制約を持つ基準のIV推定量の漸近分散は2−h^{-1}で、Montiel Olea and Plagborg-Møller (2021) のラグ拡張したOLS推定量の漸近分散hと比べられる（hは整数の伝播期間）。さらに未知の持続性と中程度の局所的なモデルの誤特定に頑健なIVベースのLP推論を開発する。再帰的なVARに基づく推論は後者には一般に頑健でないと述べられている（抄録）。", "fun": "「金利を上げたら1年後、2年後に経済はどう動くか」を推定する局所射影という手法は、マクロ経済学の標準になった。この研究が示したのは、使っていない過去のデータを操作変数として投入すると、推定の精度が上がるということ。しかもデータが持続的（昨日の値が今日に強く残る）なときに効く。単位根の場合に分散がhから2−1/hに下がるのは、期間が長いほど差が開く計算になる。", "unverified": "トレードオフの特徴づけの詳細、実証例。本文が入手できず確認できなかった。"}}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "現金給付で女性の就労は減るのか", "title": "Cash Transfers and Female Labour Supply: Evidence from Six Natural Experiments in India", "url": "https://doi.org/10.2139/ssrn.7598280", "authors": "Raghav Raghunathan", "venue": "SSRN", "date": "2026-10-12", "apa": "Raghunathan, R. (2026). Cash Transfers and Female Labour Supply: Evidence from Six Natural Experiments in India. https://doi.org/10.2139/ssrn.7598280", "why": "2018〜2023年にインドの6州で始まった無条件現金給付（4つは女性へ月次、2つは農家世帯へ）を自然実験として並べ、現金給付が女性の労働供給を減らすかを検証した。複数州の比較で頑健性を確保する設計である。", "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ。抄録に設計と結果が詳しく含まれている", "preprint": true, "short": true, "p1": "無条件の現金給付が女性の就労を減らすかを、インドの6つの州の制度を自然実験として検証した（抄録）。", "p3": "2018年から2023年に始まった6つの州の制度（4つは女性に月額、2つは農家世帯に支給）を使い、全国の労働力調査の個票で、実施した州と隣接する未実施の州を比べる。2つの事前期間の基準線のもとで、合成統制・境界地区・時差導入の3種類の推定量を用いる（抄録）。", "p5": "女性向けのどの制度でも女性の労働参加は下がらず、最小検出可能効果は1〜6ポイント、適格な女性の4分の1から5分の4という受給率がこの無効果を受給者にまで及ぼす。現金が農家世帯に届いたテランガーナ、オディシャ、アッサムの初年度では家族農業での労働が強まり、女性が無償の家族従業者として参入し、テランガーナでは男性が賃金労働を離れて自営の耕作に移った。プールした基準線では西ベンガルとマディヤ・プラデーシュで退出が見られるが、これらは全国的な上昇に対する州の導入前の趨勢であり、導入直前の調査回と比べると消える（抄録）。", "fun": "「現金を配ると人は働かなくなる」という懸念は、給付の議論でいつも出てくる。この研究はインドの6州の制度を使い、女性の就労が減ったかを調べた。結論は減っていない。面白いのは、農家世帯に配った場合だけ変化が出たこと。女性が家族の農作業に無償で加わり、男性は賃金労働をやめて自分の畑に移った。働く量ではなく、どこで働くかが変わっていた。", "unverified": "各推定量の係数、最小検出可能効果の計算方法、カルナータカの結果。本文が入手できず確認できなかった。"}}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "産業スパイで得た知識は企業成果に効いたか", "title": "Economic Espionage, Knowledge Flows, and Firm Performance", "url": "https://econpapers.repec.org/RePEc:crm:wpaper:26255", "authors": "Albrecht Glitz ほか", "venue": "RePEc NEP", "date": "2026-10-12", "why": "東ドイツの歴史的データを使い、諜報活動で獲得した知識が企業の経済成果にどう影響したかを検証した。知識流入の経路として通常扱われない活動を定量的に評価している。", "explain": {"basis": "抄録", "basis_note": "RePEc経由の掲載ページから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "産業スパイで得た知識が企業の生産性と生存をどう変えたかを、東ドイツの歴史データで測れるようにした（抄録）。", "p3": "西側の情報源から東側の受け手へ科学技術情報が流れた経路を追える東ドイツの歴史データを使う。どの企業がどれだけの諜報情報を受け取ったかを、生産性・生産構造・投入の選択と結びつける（抄録）。", "p5": "産業スパイは企業の生産性を高め、生産構造と投入の選択を組み替えた。もたらされた技術変化は労働を補完する（labor-augmenting）性質を持ち、生産性の利得は投入産出の連関を通じて生産ネットワークに波及した。長期では、諜報情報の流入が大きかった企業は、ドイツ再統一後の市場経済への移行を有意に生き延びやすかった（抄録）。", "fun": "東ドイツが西側の技術を盗んでいたことは知られているが、それが企業の経営にどう効いたかを測った研究は珍しい。残された記録から「どの企業がどれだけ受け取ったか」を追えるのが鍵である。結果は、生産性が上がり、投入の組み合わせが変わり、取引先にも波及した。しかも統一後の市場経済で生き残る確率まで上がっていた。盗んだ知識が組織に定着していたことになる。", "unverified": "標本の企業数と期間、生産性の上昇幅。本文が入手できず確認できなかった。"}}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "広く浅く会うか、深く長く会うか", "title": "Learning About Outgroups: The Impact of Broad Versus Deep Interactions", "url": "https://doi.org/10.3386/w35884", "authors": "Anujit Chakraborty ほか", "venue": "NBER Working Paper", "apa": "Chakraborty, A., Ghosh, A., Lowe, M., & Nellis, G. (2026). Learning About Outgroups: The Impact of Broad Versus Deep Interactions (NBER Working Paper No. 35884). National Bureau of Economic Research. https://www.nber.org/papers/w35884", "why": "外集団の複数の人と短く接する広い接触と、一人と長く接する深い接触が、態度形成で異なる役割を果たすという仮説を検証している。接触仮説を接触の形に分解する設計である。", "explain": {"basis": "抄録", "basis_note": "NBERから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "外集団の多くの人と短く接する「広い接触」と、一人と長く接する「深い接触」が、別の役割を果たすことを実験で切り分けた（抄録）。", "p3": "インドに工場を設け、ヒンドゥー教徒とムスリムの男性を募って2人組で共同の生産作業にあたらせる。参加者を、毎日同じ内集団または外集団の相手と働く条件（深い接触）、毎日違う外集団の相手と働く条件（広い接触）、統制群に無作為に割り当てる（抄録）。", "p5": "深い接触は、その外集団の相手との社会的・経済的な結びつきを強める。しかし多数派集団が外集団の見知らぬ人について持つ誤った認識を減らすのは、広い接触だけである。相手の事前の生産性の違いを使った分析では、どちらの条件でも参加者は相手について学ぶが、広い接触の参加者はその信念の更新を見知らぬ人にも一般化する。著者は、独立な標本抽出が1人との長い相互作用より外集団について学ばせるというモデルと整合すると述べる（抄録）。", "fun": "偏見を減らすには交流が効く、とよく言われる。この研究はその交流を2種類に分けた。毎日同じ相手と働くと、その人とは仲良くなるが、集団全体についての誤解は残る。毎日違う相手と働くと、仲良くはなりにくいが、集団についての思い込みが薄れる。統計で言えば1つの標本を深く見るか、多くの標本を浅く見るかの違い。偏見は後者でしか崩れないらしい。", "unverified": "参加者数、誤認識の測定方法、効果の大きさ。本文が入手できず確認できなかった。"}}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "Rollの問いに40年後に答える", "title": "Explaining Realized Returns: Roll’s R2 40 Years Later", "url": "https://doi.org/10.3386/w35885", "authors": "Bryan T. Kelly ほか", "venue": "NBER Working Paper", "apa": "Kelly, B. T., Su, Y., & Zhang, C. (2026). Explaining Realized Returns: Roll’s R2 40 Years Later (NBER Working Paper No. 35885). National Bureau of Economic Research. https://www.nber.org/papers/w35885", "why": "価格変動の要因を事後的に観測できても資産価格の動きを説明できるかというRoll(1988)の問いを、現代の実証として再構成した。資産価格研究の基礎的な問いを再検討している。", "explain": {"basis": "抄録", "basis_note": "NBERから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "株価の動きを事後的な情報で説明できるかというRoll (1988) の問いに、新聞記事から理由を抽出することで答えられるようにした（抄録）。", "p3": "従来のマクロ経済、キャッシュフロー、期待、資金フローの変数は、月次の米国株式リターンに対して標本外R²が多くの場合に負、そうでなくても10%未満で、日次では使えない。そこで生成AIを使い、Wall Street Journalの市場概況から「新聞が述べた理由」を抽出し、価格やリターンそのものを指す表現を除く（抄録）。", "p5": "これらの理由は、日次と月次のリターンの約30〜40%を標本外で説明する。その内容は解釈可能な主題（企業ニュース、マクロ経済の状況、金融政策、センチメント、地政学）に対応づけられる（抄録）。", "fun": "株価がなぜ動いたのかは、後から振り返っても説明がつかないことが多い。Rollの有名な指摘で、経済指標を全部後から入れても説明力は10%に届かない。この研究の着眼は、新聞が毎日書いている「なぜ動いたか」の文章そのものを変数にすることだった。すると30〜40%説明できる。ただし価格やリターンを指す言葉は除いている。人間の言葉が指標より情報を持っていた。", "unverified": "生成AIによる抽出の手順と検証、主題ごとの寄与。本文が入手できず確認できなかった。"}}, {"id": "pn34", "rank": 34, "field": "経営学", "headline": "規制回避が生む革新という類型", "title": "The Regulatory-avoidance Theory of Innovation", "url": "https://doi.org/10.2139/ssrn.7599498", "authors": "Jason Potts ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Potts, J., De Filippi, P., Lane, A. M., & Waters-Lynch, J. (2026). The Regulatory-avoidance Theory of Innovation. https://doi.org/10.2139/ssrn.7599498", "why": "ブロックチェーンのように、法の適用が定かでない条件で急速な技術革新が生じる現象を説明するため、規制回避を動機とする革新という新しい類型を提示している。", "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "法の適用が定かでない条件で急速な技術革新が生じる現象を、規制からの「逃避」として説明する理論を提示した（抄録）。", "p3": "生物学の類比を使い、急速な突然変異を捕食による強い選択圧への適応的な反応として理解する。技術を特定の種類の製品に分類してレント抽出の対象にする規制や、特定の応用を禁じる規制を、捕食の形態として特徴づける（抄録）。", "p5": "標準的なイノベーション理論は、持続的な規制の敵意が普及を遅らせ投資を抑えると予測する。ブロックチェーンは逆のパターンを示し、規制圧力が強まったまさにそのときに複数のニッチへ急速に多様化し、しかもイノベーション政策の支援なしにそれを行った。著者はこの軌跡を、規制の制約を避ける副作用として新しい技術的能力を生み出した適応的な「逃避」として理解するのが最も適切だと論じる（抄録）。", "fun": "規制を厳しくすれば技術の普及は遅れる、というのが常識的な予測である。ブロックチェーンはその逆で、規制が厳しくなるほど用途を増やして広がった。この論文はそれを生物の進化に例える。捕食者の圧力が強い環境では、突然変異が速くなる。規制を逃れようとする工夫が、副産物として新しい能力を生む。意図された革新ではなく、逃げた跡が技術になるという見立てである。", "unverified": "事例の分析方法、理論の検証可能な含意。本文が入手できず確認できなかった。"}}, {"id": "pn35", "rank": 35, "field": "経営学", "headline": "コンプライアンス改革は売りだけを抑える", "title": "Compliance management reform and asymmetric insider trading in Chinese state-owned enterprises", "url": "https://doi.org/10.2139/ssrn.7601267", "authors": "Xu Ting Xu Ting", "venue": "SSRN", "date": "2026-10-12", "apa": "Xu Ting, X. T. (2026). Compliance management reform and asymmetric insider trading in Chinese state-owned enterprises. https://doi.org/10.2139/ssrn.7601267", "why": "中国の国有企業でコンプライアンス管理改革が機会主義的なインサイダー取引を抑えるかを検証し、買いと売りで効果が異なるかまで分けて推定している。", "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "中国の国有企業でコンプライアンス管理改革が機会主義的なインサイダー取引を抑えるかを、売りと買いで分けて測れるようにした（抄録）。", "p3": "標本は2013年から2023年の上場企業1,378社・10,325の企業・年観測。政策の採用時期の行政上の差異を変動の源として、企業と年の固定効果を入れた時差のある差分の差分設計を使う（抄録）。", "p5": "完全に統制した改革の係数は、機会主義的な売却額の対数（1を加えたもの）で−0.705、売却頻度の対数で−0.049である。買いの係数は正だが統計的に有意でない。Wald検定は買いと売りの係数の等しさを棄却し、非対称性の直接の証拠を与える。売却についての負の関連は、別の処置効果推定量、マッチング、エントロピー均衡化、取引の分類の変更、追加の固定効果、同時期の他の改革の統制のもとでも残る。機構の回帰は資産回転率の上昇と管理費用の低下を示す（抄録）。", "fun": "内部者が自社株を売り買いするとき、公になっていない情報を使えば不公正になる。中国の国有企業でコンプライアンス改革を入れた効果を測ると、売りだけが減り、買いは変わらなかった。考えてみれば自然で、悪い情報を知って先に売り抜けるのは目立つが、良い情報で買うのは言い訳が立ちやすい。同じ規制が取引の向きによって違う効き方をする、という非対称性を統計的に示している。", "unverified": "機会主義的取引の定義、機構の回帰の係数。本文が入手できず確認できなかった。"}}, {"id": "pn36", "rank": 36, "field": "経営学", "headline": "学習しても取り付けは一方に固まらない", "title": "Selection Without Lock-In: Adaptive Learning, Residual Strategy Sets,and Incomplete Clearance in the 2008 and 2022–23 Crises", "url": "https://doi.org/10.2139/ssrn.7597444", "authors": "Philip Fellman", "venue": "SSRN", "date": "2026-10-11", "apa": "Fellman, P. (2026). Selection Without Lock-In: Adaptive Learning, Residual Strategy Sets,and Incomplete Clearance in the 2008 and 2022–23 Crises. https://doi.org/10.2139/ssrn.7597444", "why": "ファンダメンタルズの開示と観測可能な逐次的引き出しが、Diamond-Dybvig型の調整ゲームでどちらの均衡が選ばれるかを決めうると論じ、長期記憶をもつ強化学習の下で2008年と2022〜23年の危機を対照している。", "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "取り付け騒ぎが一度収まっても、残った「走れる請求権」がある限り再発の確率が正に留まることを、学習するエージェントのモデルで示した（抄録）。", "p3": "ファンダメンタルズの開示に続く観測可能な逐次的な引き出しが、Diamond–Dybvig型の調整ゲームで取り付けの均衡を選ぶ。長期記憶を持つ強化学習のもとでは、一時的な流動性の清算は、残余の戦略集合に行動が残っていれば固定（ロックイン）を生まない。残余の強度は、残った引き出し可能な請求権、印のついていない期間・レバレッジの暴露、残余の不透明性の加重和である（抄録）。", "p5": "2期間の再退出確率の下限は、残余の強度が正であるときに限り厳密に正となり、記憶の重みと残余の強度について増加する。全員が学習者のとき下限は緊密で、残余の項は取り付けの利得に加法的に入る。この比較静学は短い記憶や部分的な観測可能性のもとでも生き残る。Bear Stearns（2008）、Silicon Valley Bank（2023）、FTX（2022）の対比が示されている（抄録）。", "fun": "銀行の取り付け騒ぎは、資金を注入して一度収まれば終わりだと思いたい。この論文の主張は、客が「次もあるかもしれない」と学習している限り、まだ引き出せるお金と見えないリスクが残っているぶんだけ再発の確率が残る、というものである。しかもその下限が、記憶の重みと残余の量で増える。消火と鎮火は別だということを、形式的に言い切っている。", "unverified": "校正の数値、3つの事例の対比の詳細。本文が入手できず確認できなかった。"}}, {"id": "pn37", "rank": 37, "field": "経営学", "headline": "戦略的業績測定が競争優位に結ぶか", "title": "The association between strategic performance measurement systems, innovation and competitive advantage", "url": "https://doi.org/10.2139/ssrn.7601268", "authors": "Kevin Baird ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Baird, K., Su, S., & Nuhu, N. (2026). The association between strategic performance measurement systems, innovation and competitive advantage. https://doi.org/10.2139/ssrn.7601268", "why": "多次元の業績指標、価値ドライバーとの連結、戦略との連結という3類型の戦略的業績測定システムが、革新と競争優位にどう関係するかを検証している。", "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "戦略的業績測定システムの3類型が、探索型と活用型の革新を通じて競争優位にどうつながるかを測り分けた（抄録）。", "p3": "3類型は、多次元の業績指標の使用、価値ドライバーとの連結、戦略との連結である。これらと探索型（exploratory）・活用型（exploitative）の革新との関連、およびその2種類の革新と競争優位との関連を調べる。オーストラリアのサービス部門の組織で働く中間管理職418名からオンライン調査で収集したデータを使う（抄録）。", "p5": "価値ドライバーとの連結は、探索型と活用型の両方の革新と有意に正に関連した。多次元の業績指標の使用と戦略との連結は、探索型の革新と有意に正に関連した。両方の革新と競争優位の間にも有意な正の関連がある。さらに探索型の革新は3類型すべての関連を、活用型の革新は価値ドライバーとの連結の関連を媒介していた（抄録）。", "fun": "「測れないものは管理できない」と言われるが、何を測るかで組織の革新の方向が変わる。この研究が示したのは、価値を生む要因（価値ドライバー）に業績指標をつなぐと、新しい挑戦と既存の改善の両方が進むのに、戦略につなぐだけでは新しい挑戦のほうにしか効かないこと。指標の設計が、探索と活用のどちらを促すかを決めている。", "unverified": "標本の抽出方法、推定された係数、適合度。本文が入手できず確認できなかった。"}}, {"id": "pn38", "rank": 38, "field": "経営学", "headline": "レジーム情報は運用に残るのか", "title": "From Regimes to Portfolios: An Interpretable Machine-Learning Framework for Strategic and Tactical Cross-Asset Allocation", "url": "https://doi.org/10.2139/ssrn.7595598", "authors": "Chalam Raja Ankam", "venue": "SSRN", "date": "2026-10-12", "apa": "Ankam, C. R. (2026). From Regimes to Portfolios: An Interpretable Machine-Learning Framework for Strategic and Tactical Cross-Asset Allocation. https://doi.org/10.2139/ssrn.7595598", "why": "マクロのレジームモデルは資産配分に広く提案されてきたが、経済的に実装可能な形にしたときにその情報が価値を保つかはほとんど検証されていない。解釈可能な機械学習の枠組みでこれを検証している。", "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ。抄録に設計が詳しく含まれている", "preprint": true, "short": true, "p1": "マクロのレジーム情報が、解釈可能で標本外に推定でき取引費用を引いても価値を保つかを検証できるようにした（抄録）。", "p3": "統合的で解釈可能な機械学習の枠組みを、4段で組む。(i)成長・インフレ・ストレスのレジームの同定、(ii)勾配ブースティングによる校正済みの教師ありレジーム確率予測（マルコフ連鎖、多項ロジット、ガウス隠れマルコフモデル、k平均を基準として比較）、(iii)レジーム信号の特徴ブロックごとの寄与分解、(iv)CVaR最適化とBlack-Littermanによるレジーム条件付きのポートフォリオ構築で、戦略層と戦術層に取引停止帯を設ける（抄録）。", "p5": "10のETFの宇宙で、2010年5月からNovember 2025までの187か月のウォークフォワードで13の戦略を評価する。資産クラス別の取引費用を考慮し、スチューデント化したブロックブートストラップのシャープ検定と、デフレートしたシャープレシオで判定する。主要な戦略の成績は抄録が途中で切れており未確認（抄録）。", "fun": "「景気の局面を当てられれば資産配分で勝てる」という話は昔からある。この研究の厳しさは、評価の条件を全部重ねたところだ。解釈できること、標本外で推定すること、世界中の資産に適用すること、そして取引費用を引くこと。さらにシャープレシオを何度も試した分だけ割り引く（デフレート）検定まで使う。良い成績が偶然でないかを疑う手続きが丁寧である。", "unverified": "主要な戦略の成績、デフレートしたシャープレシオの値。抄録が途中で切れており確認できなかった。"}}, {"id": "pn39", "rank": 39, "field": "組織行動・心理的安全性", "headline": "痕跡からチームらしさを測る", "title": "Teams without teams: a trace-based method for measuring team-like organization", "url": "https://arxiv.org/abs/2610.13529", "authors": "Thomas Baillie-Dawe (Lab-STICC ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Baillie-Dawe, T., Bothorel, C., & Jullien, N. (2026). Teams without teams: a trace-based method for measuring team-like organization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13529", "why": "デジタルプラットフォームに残る協働の痕跡は、貢献が独立なままか構造化された組織になっているかを直接には示さない。痕跡からチームらしい組織化の度合いを測る方法を提案している。", "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "事前に「チーム」と定義されていない集団について、デジタルの痕跡からチームらしさの度合いを測る方法を作った（抄録）。", "p3": "チームワークの確立した次元を、デジタルの痕跡から復元できる行動指標に翻訳する。これらの指標は別々に検討できるほか、共同での表れ方を1つの合成指標にまとめられる。事前のチーム構成員の定義を要さず、さまざまな協働の場に適応できるよう設計されている（抄録）。", "p5": "方法は、英語版WikipediaのMedicine WikiProjectの52,437記事の改訂履歴（人間が書いた1,000万件を超える編集）で例示される。記事と月の組を単位として分析しており、それ以降の具体的な結果は抄録が途中で切れており未確認（抄録）。", "fun": "Wikipediaの記事は誰かが勝手に書き足していくだけに見えるが、よく見ると役割分担や調整が生まれていることがある。問題は、誰がチームなのかが決まっていないことだ。この研究はチームワークの研究で蓄積された次元を行動の痕跡に翻訳し、「チームらしさ」の度合いとして測る。1,000万件の編集履歴から組織の芽を見つけるという試みである。", "unverified": "行動指標の一覧、分析の結果。抄録が途中で切れており確認できなかった。"}}, {"id": "pn40", "rank": 40, "field": "組織行動・心理的安全性", "headline": "LLM時代に専門職の優位はどこに残るか", "title": "Recovering Professional Advantage in Human-AI Teams: Direction, Vigilance, Disambiguation, and Orchestration", "url": "https://doi.org/10.2139/ssrn.7590562", "authors": "William Ocasio ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Ocasio, W., & Love, E. G. (2026). Recovering Professional Advantage in Human-AI Teams: Direction, Vigilance, Disambiguation, and Orchestration. https://doi.org/10.2139/ssrn.7590562", "why": "LLMが成文化された知識を豊富にすることで注意が希少資源になると論じ、専門職の優位が曖味さの吸収を通じて組み替わるとして、方向づけ・警戒・曖味さの解消・編成という4つの機能を提示している。", "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "LLMとの協働で専門職の優位がどこに残るかを、曖昧さの吸収という機構から4つの機能として導いた（抄録）。", "p3": "LLMが成文化された知識を豊富にすることで、専門職の仕事では注意が希少資源になる。著者は「曖昧さの吸収」をLLMが注意を配分する機構と見る。モデルは依頼の曖昧さを学習データの最頻の読みに向けて決着させ、選択をしたという印を付けずに結果を渡すため、モデルも利用者も代替案に注意を向けない。吸収は最頻の読みが正しいときに注意を節約し、そうでないとき誤って配分する（抄録）。", "p5": "人とAIのチームにおける専門職の優位は、実質的な曖昧さへの注意を回復することにあり、4つの形を取る。方向づけ（仕事の目的に注意を集める）、警戒（標準的な読みが当該の事例に合わないときに気づく）、曖昧さの解消（事例の個別事情に注意を置く）、編成（人・エージェント・時間にわたって注意を配分する）である。著者はここからエージェント型の系の設計への含意を導く（抄録）。", "fun": "AIに「資料をまとめて」と頼むと、だいたい正しいものが返ってくる。問題は、依頼のあいまいな部分をAIが勝手に「ふつうはこうだろう」と決めて、決めたことを教えてくれない点である。この論文はそこを曖昧さの吸収と呼び、専門職の価値はそこに気づいて引き戻す力だと整理した。目的を定め、違和感に気づき、個別事情を持ち込み、仕事を配る。4つとも機械が苦手な部分である。", "unverified": "理論の実証的な裏づけ、設計への含意の具体。本文が入手できず確認できなかった。"}}, {"id": "pn41", "rank": 41, "field": "組織行動・心理的安全性", "headline": "組織の沈黙を統合的に捉え直す", "title": "Organizational Silence as a Schrödinger's cat: How to handle it", "url": "https://doi.org/10.2139/ssrn.7597572", "authors": "Patrice Cailleba", "venue": "SSRN", "date": "2026-10-11", "apa": "Cailleba, P. (2026). Organizational Silence as a Schrödinger’s cat: How to handle it. https://doi.org/10.2139/ssrn.7597572", "why": "組織の沈黙の研究を見直し、企業内の人間行動をより包括的に理解する統合的な接近を提唱している。概念の分散を整理する視点論文である。", "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ。視点論文であり実証ではない", "preprint": true, "short": true, "p1": "組織の沈黙が倫理的な遵守とも不正とも読めてしまう曖昧さを正面から扱い、発言を引き出す2つの枠組みを提案した（抄録）。", "p3": "基礎的な研究と最近の研究の双方を見直し、複数の視点の補完性を示して既存の実務の限界に触れる。中心的な主張は、組織の沈黙がシュレディンガーの猫の組織版に似ているということである。沈黙は倫理的な遵守と不正のどちらをも隠しうるが、その真の性質は沈黙が破られるまで未確定のままである（抄録）。", "p5": "一方では遵守や慎重さに見え、他方では離脱や抵抗に見えるものが、隠れた文脈要因と個人要因に依存する。専門家を助けるため、組織が遭遇する沈黙の諸形態を同定して分析し、沈黙に対処して従業員の発言を効果的に導くための2つの補完的な枠組み（チーム水準の発言管理と組織全体の発言管理）を提案する（抄録）。", "fun": "会議で誰も反対しないとき、それは納得しているのか、言っても無駄だと思っているのか。外からは区別できない。この論文はそれをシュレディンガーの猫に例える。箱を開けるまで、つまり沈黙が破られるまで、どちらだったか決まらない。だから「意見が出ないから大丈夫」とは言えない。喩えが正確に機能している珍しい例である。", "unverified": "2つの枠組みの具体的な手順、沈黙の形態の分類。本文が入手できず確認できなかった。"}}, {"id": "pn42", "rank": 42, "field": "組織行動・心理的安全性", "headline": "独立就業者は周縁化された集団である", "title": "The Hero-Hobbyist Dichotomy and Independent Work: A Conceptual Model", "url": "https://doi.org/10.2139/ssrn.7597571", "authors": "Taylor E. Morrison", "venue": "SSRN", "date": "2026-10-11", "apa": "Morrison, T. E. (2026). The Hero-Hobbyist Dichotomy and Independent Work: A Conceptual Model. https://doi.org/10.2139/ssrn.7597571", "why": "独立就業者を統計的・構造的・社会的に周縁化された集団として概念化し、社会的アイデンティティ論と英雄／趣味人という固定観念の例から概念モデルを組んでいる。", "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ。概念論文であり実証ではない", "preprint": true, "short": true, "p1": "独立就業者が「英雄」か「趣味人」のどちらかに分類されることで周縁化される機構を、概念モデルとして立てた（抄録）。", "p3": "独立就業者を、統計的・構造的・社会的に周縁化された集団として概念化する。社会的アイデンティティの接近法と、マドンナ／娼婦の二分法やMammy・Jezebel・Sapphireの固定観念といった具体例を踏まえ、「英雄／趣味人の二分法」を社会的な周縁化の一形態として導入する（抄録）。", "p5": "この分類は、独立就業者と伝統的な雇用者の双方の態度と行動に影響し、独立就業者の仕事とwell-beingに影響しうる。ただし社会的な創造性と社会的な競争という方略がこの影響を緩和し、独立就業者の包摂を促しうると述べられている（抄録）。", "fun": "フリーランスは「自由を手に入れた挑戦者」として持ち上げられるか、「趣味でやっている人」として軽く扱われるか、どちらかになりやすい。この論文はその2択自体が周縁化の形だと指摘する。褒められているほうも、実は普通の働き手として扱われていない。ジェンダーや人種の固定観念の研究で使われてきた枠組みを、働き方の分類に当てている。", "unverified": "概念モデルの図示、緩和方略の具体例。本文が入手できず確認できなかった。"}}, {"id": "pn43", "rank": 43, "field": "教育", "headline": "安定性の硬直さと上位取引周期の一意性", "title": "Stability Rigidity and Robust Minimal Instability&nbsp;of Top Trading Cycles with Mixed Capacities", "url": "https://doi.org/10.2139/ssrn.7599299", "authors": "Lizhong Chen", "venue": "SSRN", "date": "2026-10-12", "apa": "Chen, L. (2026). Stability Rigidity and Robust Minimal Instability&nbsp;of Top Trading Cycles with Mixed Capacities. https://doi.org/10.2139/ssrn.7599299", "why": "パレート効率的で耐戦略的な学校配分規則が、上位取引周期が安定なときに常に安定であるならば上位取引周期と一致しなければならないかを問うている。マッチング理論の特徴づけに関わる。", "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "パレート効率的で耐戦略的な学校配分規則が、上位取引周期が安定なときに常に安定なら上位取引周期と一致しなければならないかを特徴づけた（抄録）。", "p3": "この性質を初期安定性の硬直さ（initial-stability rigidity）と呼び、定員の残余による安定性の比較のもとでの頑健な最小不安定性と比べる（抄録）。", "p5": "定員が（Q, 1）の2校の場合、両方の性質はまったく同じ優先順位の条件のもとで成り立つ。すなわち相対的な優先順位の置換がパターン231と321を避け、長さ4以上の回転した区間ブロックがすべて順位Q+1までに終わることである。3校になると2つの性質は分離し、分離する最小の混合定員の構造は学生5名・総定員4である。n≥3の学生と定員（Q, 1, 1）（Q≥2）の族では、頑健な最小不安定性は常に成り立つが、硬直さが成り立つのはQ≥n−2のときに限る。すべての2校への射影が両方を満たすのに、全体の構造はどちらも満たさない例も示される（抄録）。", "fun": "学校の入学者選抜では、希望を書かせて機械的に割り当てる。効率的で、嘘をついても得しない方式として「上位取引周期」が知られているが、不満のない配分（安定性）とは両立しない。この論文が調べたのは、その両立の境界線である。驚くのは、2校ならぴったり一致する条件が、3校になると分かれること。しかも全体で成り立たないのに、2校ずつ切り出すと成り立つ例がある。", "unverified": "231・321というパターンの意味、証明の方法。本文が入手できず確認できなかった。"}}, {"id": "pn44", "rank": 44, "field": "教育", "headline": "授業づくりに生成AIはどこで噛むか", "title": "From Instructional Intent to Classroom-Ready Lessons: Investigating Teacher-AI Collaboration in Lesson Authoring for Secondary Computing Education", "url": "https://arxiv.org/abs/2610.12834", "authors": "Tahreem Yasir ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Yasir, T., Li, W., Ozturk, D., Rajapaksha, Y., Droujkov, D., Tian, X., & Barnes, T. (2026). From Instructional Intent to Classroom-Ready Lessons: Investigating Teacher-AI Collaboration in Lesson Authoring for Secondary Computing Education (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12834", "why": "生成AIが授業教材の作成と改変を支援しうるとして研究されてきたが、中等教育の情報科の授業づくりのどこに組み込むべきかはわかっていない。教員とAIの協働を具体的な工程として調べている。", "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "中等教育の情報科の教員が、生成AIと一緒に授業教材を作るとき、どこを任せどこを手放さないかを質的に記述した（抄録）。", "p3": "中等教育の情報科の教員8名を対象に、2つの補完的な質的研究を行う。既存の教材作成の実践を調べるフォーカスグループと、構造化されたAI支援の授業作成システムLessonBuilderを研究の探り針（probe）として使う発話思考法の研究である（抄録）。", "p5": "教員の教育的な意図は、教材を作り、点検し、適応させる過程で発達していた。教員は作業を選択的にAIに委ね、授業として使える状態かを判断する責任は自分で保持した。発話思考のセッションはさらに、AIが生成した教材を点検することが教員に自分の意図を明確化し洗練させるよう促し、教材作成が教員の意図とAIの出力の間の継続的な交渉になることを示した（抄録）。", "fun": "AIに授業案を作らせると楽になる、と言われる。この研究が観察したのは、教員がAIの出力を見ることで「自分が何を教えたかったのか」を初めて言葉にする場面だった。つまりAIは教材を作る道具であると同時に、自分の意図を映す鏡として働いている。しかも「これは教室で使える」という最終判断は、どの教員も手放さなかった。", "unverified": "8名の属性と学校の種類、LessonBuilderの仕様。本文が入手できず確認できなかった。"}}, {"id": "pn45", "rank": 45, "field": "教育", "headline": "留学修士は起業につながるのか", "title": "The Contribution of International Master Students to Entrepreneurship in the World", "url": "https://econpapers.repec.org/RePEc:ces:ceswps:_13014", "authors": "Michel Beine ほか", "venue": "RePEc NEP", "date": "2026-10-12", "why": "LinkedIn/Revelioの大規模縦断データを使い、国際的な修士教育と起業の関係について初の世界規模の実証を示している。教育と起業の関係を国際移動の文脈で測る設計である。", "explain": {"basis": "抄録", "basis_note": "RePEc経由の掲載ページから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "国際的な修士課程での教育と起業の関係について、初めての世界規模の実証を与えた（抄録）。", "p3": "LinkedIn/Revelioの大規模な縦断データを使い、留学生の修士課程修了者が国内の修了者より起業しやすいかを、世界の主要な留学先にわたって調べる（抄録）。", "p5": "留学生の修士課程修了者は、世界の主要な留学先において国内の修了者より体系的に企業を作りやすい。この起業の優位は専攻分野・性別・出身国と留学先によって変わる。さらに修了後の企業創出の地理を記述し、元留学生における起業活動の国際的な移動性を示す。著者はこれを、国際的な学生移動の経済的な影響についての新しい世界的な視点と位置づける（抄録）。", "fun": "留学生が帰国するか現地に残るかは移民政策の論点だが、起業という観点から見た研究は少なかった。LinkedInの職歴データを世界規模で使うと、留学した修士修了者のほうが会社を作りやすいと出る。しかも作る場所は留学先に限らない。人が国を越えて動くと、企業も国を越えて生まれる。職歴の公開データが研究のデータになるという点も時代を感じる。", "unverified": "標本の規模と期間、起業確率の差の大きさ。本文が入手できず確認できなかった。"}}, {"id": "pn46", "rank": 46, "field": "教育", "headline": "不登校の神経多様な生徒が挙げる学校のストレス", "title": "From the Inside Out: School Stressors Identified by Autistic and ADHD (AuDHD) Students Experiencing School Non-Attendance", "url": "https://doi.org/10.31234/osf.io/x4zge_v3", "authors": "Jia Ying Sarah Lee ほか", "venue": "PsyArXiv", "date": "2026-10-11", "apa": "Lee, J. Y. S., Adams, D., Paradisis, C., Smart, R., Westphal, T., Heale, L., & Simpson, K. (2026). From the Inside Out: School Stressors Identified by Autistic and ADHD (AuDHD) Students Experiencing School Non-Attendance. https://doi.org/10.31234/osf.io/x4zge_v3", "why": "不登校研究で当事者、特に神経多様な生徒の視点が手薄だった点に対し、カード分類という参加しやすい方法で生徒自身が挙げる学校のストレス要因を集めている。", "explain": {"basis": "抄録", "basis_note": "PsyArXivから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "自閉症とADHDを併せ持つ不登校の子どもが、学校の何をストレスと感じているかを本人の自己報告から取り出した（抄録）。", "p3": "Student Stress Investigation（SSI）という構造化したカード分類の手法を使う。参加者はまずストレッサーを関連あり・なしに分類し、次に関連ありの項目を小さいものから大きいものへ順位づける。カード分類は、こうした視点を捉えるのに適した利用しやすい方法として位置づけられる（抄録）。", "p5": "自閉症とADHDの両方の診断を受けた31名の子ども・青年（平均年齢12.16歳）が対象で、平均して月に3.46日欠席していた。最も頻繁に主要なストレッサーとして挙げられたのは、騒がしすぎるまたは静かすぎる教室環境（35.5%）、興味の持てない課題（32.2%）、予測できないこと（29.0%）、学校の1日が長すぎること（29.0%）である（抄録）。", "fun": "不登校の理由は、いじめや学業の遅れとして語られがちだ。この研究が本人に聞いて出てきたのは、教室の音量、課題のつまらなさ、見通しの立たなさ、そして1日の長さだった。どれも制度の設計で変えられる種類のものである。カードを選んで並べるという方法だから、言葉で説明するのが苦手な子からも答えが取れる。", "unverified": "SSIの項目一覧、順位づけの詳細な分布。本文が入手できず確認できなかった。"}}, {"id": "pn47", "rank": 47, "field": "心理学・認知科学", "headline": "偏り除去の研修で診断の正確さは上がるか", "title": "Effects of a Web-Based Debiasing Intervention on Brazilian Psychologists’ Accuracy on Major Depressive Disorder Diagnostic Tasks: A Randomized Training Intervention", "url": "https://doi.org/10.31234/osf.io/kzsmp_v1", "authors": "Kalil Maihub Manara ほか", "venue": "PsyArXiv", "date": "2026-10-12", "apa": "Manara, K. M., Youngstrom, E. A., Langfus, J. A., & Trentini, C. M. (2026). Effects of a Web-Based Debiasing Intervention on Brazilian Psychologists’ Accuracy on Major Depressive Disorder Diagnostic Tasks: A Randomized Training Intervention. https://doi.org/10.31234/osf.io/kzsmp_v1", "why": "ブラジルの心理士を対象に、成人の大うつ病性障害の評価における臨床判断を改善するウェブ型の偏り除去介入を、ランダム化実験で評価している。臨床判断の訓練効果を因果で測る設計である。", "explain": {"basis": "抄録", "basis_note": "PsyArXivから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "ウェブ型の偏り除去の研修が、成人のうつ病の診断課題での臨床判断を改善するかをランダム化実験で検証した（抄録）。", "p3": "介入は小児の双極性障害についての先行研究から適応され、ベイズ的な確率の見積りとその他の偏り除去の方略を教える。ブラジルの心理士535名を、介入条件と、短い教育動画を見る能動的な統制条件に割り当て、介入後に評価した（n=299）。成果は、認知的な偏りを引き出しうる診断上の難しさを描いた事例（ビネット）に対する意思決定の誤りと診断の正確さである（抄録）。", "p5": "介入条件への割り当ては、意思決定の誤りが有意に少なく、診断の正確さが高いことと関連した。介入の効果は、診断リスクの見積りを含むビネットでより強く、これは介入とビネットの交互作用によって支持された（抄録）。", "fun": "医療や心理の診断では、まれな病気を過大に見積もるといった認知の偏りが知られている。この研究は「確率の考え方を教える」という短い研修をウェブで行い、その後の診断の正確さを測った。効果が大きかったのは、リスクの見積りが問われる事例。つまり教えた内容が効いた場所に効いている。研修の効果が課題の種類で違うという対応が確認できている。", "unverified": "効果の大きさ、脱落の扱い、ビネットの内容。本文が入手できず確認できなかった。"}}, {"id": "pn48", "rank": 48, "field": "心理学・認知科学", "headline": "感情への信念が日常の調整を分ける", "title": "Associations Between Global Emotion Beliefs and Three Stages of Emotion Regulation in Everyday Life", "url": "https://doi.org/10.31234/osf.io/zgxfr_v1", "authors": "Valentina Bianchi ほか", "venue": "PsyArXiv", "date": "2026-10-12", "apa": "Bianchi, V., Smith, I., Semple, F., Lee, A. S. G., van Roekel, E., & Koval, P. (2026). Associations Between Global Emotion Beliefs and Three Stages of Emotion Regulation in Everyday Life. https://doi.org/10.31234/osf.io/zgxfr_v1", "why": "感情が制御可能か有用かという全般的な信念を、日常生活における感情調整の3段階と結びつけて検討している。信念と実際の調整行動の対応を段階ごとに分ける構成である。", "explain": {"basis": "抄録", "basis_note": "PsyArXivから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "感情についての全般的な信念が、日常生活での感情調整の3段階のどこに効くかを経験サンプリングで調べた（抄録）。", "p3": "Ford and Gross (2019) の枠組みに基づき、感情の制御可能性と有用性についての信念が、調整を始めるかどうか（識別）、どの方略を使うか（選択）、選んだ方略をどれだけうまく実行できるか（実行）の3段階に影響するという予測を検証する。7日間の経験サンプリング研究（2024年に募集したオーストラリアの地域標本、N=326、女性80%、平均年齢26.11歳、標準偏差8.52）で行う（抄録）。", "p5": "識別の段階では、（抄録がここで途中で切れており、どの信念が効いたかの結果は未確認である）。3段階のどこに効くかという結果の内訳は、抄録の収まった範囲には示されていない（抄録）。", "fun": "「感情はコントロールできる」と思っている人のほうが心の健康が良い、という関連は知られていた。ではどこで差がつくのか。気持ちを整えようと思い立つ段か、方法を選ぶ段か、実際にやってみる段か。この研究は7日間、1日に何度も尋ねることで、その3つを分けて測った。考え方の違いが行動のどの段で現れるかを特定しようという設計である。", "unverified": "3段階それぞれの結果。抄録が途中で切れており確認できなかった。"}}, {"id": "pn49", "rank": 49, "field": "因果推論", "headline": "貧しさが思春期の心に効く経路を洗い出す", "title": "Adolescents’ Economic Circumstances and their Mental Health: Identifying Candidate Causal Mechanisms through Review and Expert Consultation", "url": "https://doi.org/10.31234/osf.io/us2df_v1", "authors": "Thomas Steare ほか", "venue": "PsyArXiv", "date": "2026-10-12", "apa": "Steare, T., Rose-Clarke, K., Evans-Lacko, S., Lewis, G., & Patalay, P. (2026). Adolescents’ Economic Circumstances and their Mental Health: Identifying Candidate Causal Mechanisms through Review and Expert Consultation. https://doi.org/10.31234/osf.io/us2df_v1", "why": "経済的に困窮した状況が精神的健康の悪化と結びつくことは繰り返し示されてきたが、思春期についての説明理論は限られた役割に偏ってきた。文献レビューと専
