<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-10-22", "intro": "プレプリントの新着480件（一覧261件）、学術誌の新着（上位10%誌967件のうち関連362件、その他の学術誌215件）、重要論文の候補247件（プレプリント186件、学術誌61件）から選びました。第1部42報、第2部43報、第3部50報、第4部34報、第5部13件です。質の高い候補が少なかった部は件数を減らしました。重要論文の学術誌候補は抄録のない総合誌・材料系が多く、上位10%誌の新着で補いました。Jxiv は取得できませんでした（HTTP 503）。e-Statの新しい統計は候補にありませんでした。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "車両-橋梁連成の反復解法が収束する条件", "title": "Convergence Analysis of the Iterative Method for Vehicle-Bridge Interaction", "url": "https://doi.org/10.2139/ssrn.7649026", "authors": "Mattia Andreoli ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Andreoli, M., Cantero, D., & Øiseth, O. A. (2026). Convergence Analysis of the Iterative Method for Vehicle-Bridge Interaction. https://doi.org/10.2139/ssrn.7649026", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を使用。出版社サイトは取得できず、本文は未読", "preprint": true, "p1": "車両と橋を別々に解いて交互に更新する反復解法（分離解法）が、車両-橋梁相互作用（VBI）解析で収束するかを、事前に判定できる条件を与えた（抄録）。", "p2": "反復解法は一体解法（monolithic）より計算が安いが、収束は保証されない。どの条件で発散するかを見積もる手段がなかった（抄録）。背景：分離解法では各時刻に橋の応答と車両の応答を往復させて接触力を合わせる。", "p3": "線形・連続接触のVBIについて一般の橋と多体車両の反復行列を導き、橋のモードと連成自由度での車両の実効剛性で表した、位置に依存する厳密なスペクトル半径条件（反復行列の最大固有値の絶対値<1なら収束）を示した。さらに時間刻みに依存する上界と、より保守的な刻み非依存の上界という2つの無次元の十分条件を作った（抄録）。", "p4": "数値例で反復解と一体解を比べ、スペクトル半径が1未満/超の場合の挙動を確かめた。時間刻み、橋長と質量、接触剛性、ばね下質量、減衰、車両構成をパラメトリックに変えて上界の保守性を評価した（抄録）。", "p5": "スペクトル半径が1未満で停止許容値が十分厳しければ反復解は一体解と一致し、1を超えると発散した（抄録）。無次元の簡易判定から通過中の厳密なスペクトル半径の評価まで段階的に確かめる手順を示した。具体的な数値・図表は未読。", "p6": "線形系・連続接触に限られ、車輪の跳躍（接触の離脱）や非線形の接触は対象外と読める（抄録）。収束が保証できないときは時間刻みを小さくするか一体解法を使うとしている。上界の保守性の程度は未確認。", "fun": "橋と車を別々に計算し、互いの結果を渡し合って答えを合わせる方法は、2人で伝言を繰り返して話をまとめるのに似ています。うまくいけば速いのですが、伝言のたびに話がふくらむと収拾がつかなくなる。その「ふくらむかどうか」を、行列の固有値という一つの数で前もって判定できるようにした点が面白いところです。", "unverified": "本文・図表は未読で、数値例の具体的な値やパラメータの影響の大きさは未確認。"}}, {"id": "pr02", "rank": 2, "headline": "10-Kのリスク記述はテール・リスクを語る", "title": "Tail Risk in 10-Ks", "url": "https://doi.org/10.2139/ssrn.7639738", "authors": "Giacomo Bezzi ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Bezzi, G., Fröhlig, F., & Lazzaretto, P. (2026). Tail Risk in 10-Ks. https://doi.org/10.2139/ssrn.7639738", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を使用。本文は入手できず", "preprint": true, "p1": "米企業の年次報告書（10-K）のリスク要因の記述から企業別のテール・リスク（まれな大損失）開示の指標を作り、開示が株価への織り込み方のタイミングを変えることを示した（抄録）。", "p2": "リスク開示が将来の大きな下落リスクについて本当に情報を持つのか、それが資産価格にどう反映されるのかは分かっていなかった（抄録）。", "p3": "10-Kの叙述的なリスク要因の節からテキストに基づく企業別のテール・リスク開示の指標を作り、独立に測ったテール・リスク曝露との対応を確かめた。期待リターン、リスクの実現時の価格反応、既存リスクの重要性が高まる局面の価格反応を比べた（抄録）。", "p4": "開示の多い企業と、比較可能な非開示企業の期待リターンと価格下落を比べ、2つの補完的なイベント設定（開示済みリスクの実現、企業固有の新情報なしに重要性が高まる場合）で時期の機序を検証した（抄録）。", "p5": "開示の多い企業は期待リターンが高く、既知の下方リスクへの補償と整合的だった。リスクが実現したときの下落は小さく持続も短かった。重要性が高まる局面では開示企業が先に価格修正された（抄録）。具体的な係数・図表は未読。", "p6": "テキスト指標の作り方の妥当性、業種・規模の調整、開示の内生性（開示する企業の性質）の扱いは未確認。解釈：開示が投資家の事前の価格づけを促す、という著者の主張は因果の識別に依存する。", "fun": "「うちはこんな大損をするかもしれません」と正直に書く会社の株は、普段は少し割安（その分リターンが高い）ですが、いざ本当に悪いことが起きても株価の暴落は小さく済む、という結果です。悪い知らせを先に伝えておくと、ショックが小分けになる――人間関係でも思い当たる話です。", "unverified": "本文未読のため、標本期間・企業数・効果量はすべて未確認。"}}, {"id": "pr03", "rank": 3, "headline": "詐欺の注意喚起はワクチンのように広がるか", "title": "Scam Town: Can Scam Education Spread Like a Vaccine?", "url": "https://doi.org/10.48550/arxiv.2610.25040", "authors": "Simiao Ren ほか", "venue": "arXiv (Cornell University)", "date": "2026-10-18", "apa": "Ren, S., Duong, T., Shen, X., Gan, J., Ng, T., Raj, A., Zewde, K., Guo, H., & Zhang, S. (2026). Scam Town: Can Scam Education Spread Like a Vaccine? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.25040", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（モデル、結果4.1〜4.5節、考察・限界、付録の表題）と図表キャプションを読んだ", "preprint": true, "p1": "LLMが住民を演じる100人の模擬の町「Scam Town」で、詐欺電話の注意喚起が口コミでどこまで広がり町を守るかを、事前登録した予測つきで測った（抄録、§3〜4）。", "p2": "高齢者は詐欺の警告を知人から聞くことが多いのに、詐欺防止の研究は一人ずつの介入評価が中心で、警告が地域に広がる効果は測られていなかった（§1）。", "p3": "背景：警告を、受け手を守りつつ人から人へ移る「弱く伝播するワクチン」と見なす。町は65歳以上が45%の100人で、世帯・家族・近所・友人・教会などの拠点の5種の結びつきを持つ。4つの詐欺拠点が10種の手口で毎平日16件電話し、LLMが各住民の人物像と記憶から応答を決める。誰に話すか・信じるか・忘れ方は調査値や仮定でモデル化した（§3、表1）。高速シミュレータは応答をLLMで測った確率に置き換える。", "p4": "町の30日間の被害率（住民あたり被害数）を口コミのオン/オフで比べ、事前に公開した予測と照合した。警告の数ごとの応答率（用量反応）も測った（§4.1、§4.4）。", "p5": "用量反応では、警告0件の詐欺応諾率0.197に対し1件0.143、2件0.023、3件0.007（§4.1、図3a）。LLMの町20組では、調査水準の設定（P1）で口コミにより被害率が0.250→0.198（−21%、予測19%）、話す量を増やした仮想設定（P2）で−61%（予測47%）（§4.4、図5）。伝播の再生産数は0.38〜0.68で自己持続しなかった（§4.2〜4.3）。信頼された機関の一斉警告が町の90%に届くと、単独で23.4%、口コミと合わせて52.1%の被害を防いだ（シミュレーションのみ、§4.5、図6a）。", "p6": "住民はLLMの代役で、人間の行動との対応は検証されていない。応諾率は非現実的に高く、1つのモデル・1つの手口・約100人の静的なネットワークに限られる。P1の効果は実行バッチ間の雑音を含めると95%区間が0を含む（§4.4、§5）。", "fun": "詐欺の警告を「うつるワクチン」に見立てたのが面白い発想です。ただし結果は、警告は1人から1人未満にしか広がらず、口コミだけでは流行（バズ）しない、というもの。銀行や公民館が先に町の多くに知らせ、それを近所で話題にしてもらうと効果が倍増する――ウイルスの流行モデルの考え方が防犯の作戦づくりに使えることを示しています。", "unverified": "人間の住民で同じ結果になるかは未検証（著者明記）。付録の数値は一部のみ確認。"}}, {"id": "pr04", "rank": 4, "headline": "誰が誰と話すかを学ぶ多エージェント協調", "title": "Learning Who Talks to Whom: Role-Aware Communication Topology Scheduling for Efficient LLM Multi-Agent Collaboration", "url": "https://doi.org/10.48550/arxiv.2610.25851", "authors": "Haibin Li ほか", "venue": "arXiv (Cornell University)", "date": "2026-10-19", "apa": "Li, H., Yu, W., Jiang, X., Li, J., Han, X., Su, S., & Wei, W. (2026). Learning Who Talks to Whom: Role-Aware Communication Topology Scheduling for Efficient LLM Multi-Agent Collaboration (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.25851", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、手法3章、実験4章の主結果・分析・アブレーション）と図表キャプションを読んだ。付録の理論は未読", "preprint": true, "p1": "LLM多エージェントで「誰が誰と、いつ話すか」を、役割と途中の状態に応じて強化学習で決める枠組み（ACTS）を作り、精度を上げつつトークン消費を減らした（抄録、§3〜4）。", "p2": "既存法は固定の通信グラフか、実行前に決めたグラフを使い、途中の状態に適応できない。強化学習型（Agent Q-Mix）も規則で有向グラフを作り、役割の補完性や作ったグラフを全体の価値評価に入れていなかった（§1）。", "p3": "集中学習・分散実行（CTDE）の多エージェント強化学習で、各エージェントが通信モード（送る・受ける・休む等）を選び、役割条件付きの関係注意で話す相手を可変数選ぶ。得られた有向グラフを位相注意ミキサーで全体の価値分解（QMIX型）に組み込み、精度とトークン費用を合わせた目的で学習する（§3、図2）。背景：価値分解は各エージェントの貢献を全体の報酬から割り振る手法。", "p4": "コード生成、多肢選択推論、多段QA、競技数学の9ベンチマークで、2つの凍結LLMを使い、3つの役割エージェント＋集約ノードで、LLM-Debate・AutoGen等の固定協調、TopoDIM、Agent Q-Mixと同じプロンプト・予算で比べた。3シードの平均（§4.1、表1）。", "p5": "平均精度はGPT-OSS-120Bで75.01%、DeepSeek-V4-Flashで69.43%と最高で、Agent Q-Mixを3.18・6.19ポイント上回った（§4.2）。精度-トークンの図4ではACTSが4条件すべてでパレート前線上にあり、単一エージェントだけが安いがHotpotQAで約27ポイント精度が低い。情報利得が小さいHLEでは「休む」行動が21.3%に増えた（§4.3.2、図6）。位相注意をQMIXに替えると精度が75.01%→71.83%に下がった（§4.3.3、表2）。", "p6": "エージェント数3の小さなチームでの評価で、大人数への拡張性は未確認。トークン削減「15%超」は抄録の記述で、課題ごとの値は付録表4（未読）。", "fun": "会議で全員が毎回全員に話すと時間もお金もかかります。このAIのチームは、問題によって「今回は誰と誰が話せば十分か」「自分は黙っていてよいか」を学びます。情報の足し算が効かない問題では、半分くらいの場面で休むことを覚えた、というのが人間の会議にも示唆的です。", "unverified": "付録の理論（単調性の証明など）とトークン数の詳細表は未読。"}}, {"id": "pr05", "rank": 5, "headline": "分数階粘弾性の衝突振動系の確率安定性", "title": "Fractional Kelvin–Voigt viscoelasticity in bounded-noise-induced parametric resonance and stochastic stability of vibro-impact systems", "url": "https://doi.org/10.2139/ssrn.7649625", "authors": "Leqi Gong ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Gong, L., Hu, D.-L., & Chen, H. (2026). Fractional Kelvin–Voigt viscoelasticity in bounded-noise-induced parametric resonance and stochastic stability of vibro-impact systems. https://doi.org/10.2139/ssrn.7649625", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を使用。本文は入手できず", "preprint": true, "p1": "分数階のケルビン・フォークト粘弾性をもつ1自由度の衝突振動系が、有界ノイズで励振されるときの確率的安定性を、p次モーメント・リアプノフ指数の近似解析で評価した（抄録）。", "p2": "粘弾性の履歴的な散逸を表す分数階の構成則を衝突系に入れると確率動力学が大きく変わりうるが、パラメトリック共振と確率安定性への影響は体系的に調べられていなかった（抄録）。", "p3": "分数階ケルビン・フォークト則で粘弾性減衰を表した確率動力学モデルを作り、摂動法とフーリエ級数展開でp次モーメント・リアプノフ指数（応答のp乗平均が指数的に増えるか減るかの率）の漸近式を導いた（抄録）。背景：この指数が負なら、p次モーメントの意味で安定。", "p4": "近似式の精度をモンテカルロ・シミュレーションで確認し、p次モーメント指数と最大リアプノフ指数から、共振の種類と系のパラメータの影響を調べた（抄録）。", "p5": "超調波共振は安定性を大きく下げ、分調波共振は非平滑・分数階の条件では安定性を高めうるという、通常の線形パラメトリック系と異なる傾向が出た。分数階の次数と粘性係数を上げると概ね安定化し、固有振動数と反発係数を上げると不安定化した（抄録）。数値・図は未読。", "p6": "1自由度・有界ノイズの設定に限られる。摂動法の適用範囲（小さな雑音強度など）と、複数自由度や実部材への拡張は未確認。", "fun": "ぶつかりながら揺れるもの（衝突振動）に、ゴムのように過去の変形を覚えている材料を組み合わせると、揺れが暴れるかおさまるかの境目が普通の振動と違ってくる、という結果です。特に、ある種の共振ではかえって安定になるという逆転が面白い点で、「記憶を持つ材料」の不思議さを表しています。", "unverified": "本文未読のため、近似の精度やパラメータ値は未確認。"}}, {"id": "pr06", "rank": 6, "headline": "ガウス過程とベイズ最適化でケーブル剛性低下を同定", "title": "A GPR-BO-Based Method for Identifying Cable Axial Stiffness Degradation in Cable-Net Structures: Loading-Point Optimization and Uncertainty Quantification", "url": "https://doi.org/10.2139/ssrn.7649633", "authors": "Hao Zhang ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Zhang, H., Sun, G., Xue, Y., Wu, J., Lv, H., Qin, J., & Feng, S. (2026). A GPR-BO-Based Method for Identifying Cable Axial Stiffness Degradation in Cable-Net Structures: Loading-Point Optimization and Uncertainty Quantification. https://doi.org/10.2139/ssrn.7649633", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を使用。本文は入手できず", "preprint": true, "p1": "ケーブルネット構造のケーブルの軸剛性低下を、少ない載荷点・計測点でも同定できるよう配置を最適化し、ガウス過程回帰とベイズ最適化で推定して不確実性まで評価する方法（GPR-BO）を示した（抄録）。", "p2": "材料劣化や有効断面の減少による軸剛性の低下は、観測が限られると同定が難しい（抄録）。", "p3": "静的載荷時の節点変位とケーブル張力を観測とし、計測誤差を考慮した正規化感度行列を作って、貪欲法で載荷位置と計測点を選び同定可能性を高めた。ガウス過程回帰の代理モデルを作り、ベイズ最適化で剛性低減率を推定し、モンテカルロ抽出で同定結果の不確実性を評価した（抄録）。", "p4": "数値例で設定した低減率との一致を確かめ、3.6mの鞍形ケーブルネットの模型実験で検証した（抄録）。", "p5": "数値例で同定した低減率は設定値とよく一致し、最大相対誤差は0.015以内だった。実験では限られた載荷・計測条件ですべての損傷ケーブルを特定できた（抄録）。", "p6": "静的載荷が前提で、動的計測や環境変動（温度など）の影響は抄録では扱われていない。実構造の規模への拡張と、損傷が多数同時に起きた場合の同定性は未確認。", "fun": "網のように張ったケーブルのどれが弱っているかを、全部測らずに当てるには「どこを押してどこを測るか」の選び方が勝負です。手がかりが最も増える場所を順に選び、さらに答えの確からしさまで数字で示す――限られた情報で犯人を絞る推理のような組み立てが面白いところです。", "unverified": "本文未読のため、実験の誤差や不確実性の幅は未確認。"}}, {"id": "pr07", "rank": 7, "headline": "共感しすぎて目標を外すLLMの助言を測る", "title": "When Empathy Misses the Goal: A Benchmark for Goal Displacement in LLM Advice", "url": "https://doi.org/10.48550/arxiv.2610.25522", "authors": "Dean Ariel ほか", "venue": "arXiv (Cornell University)", "date": "2026-10-18", "apa": "Ariel, D., & Laban, G. (2026). When Empathy Misses the Goal: A Benchmark for Goal Displacement in LLM Advice (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.25522", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（分類3章、ベンチマーク構築4章、検証5章、結果6章の冒頭、考察・限界）と表1・表2を読んだ。付録のシナリオ一覧は未読", "preprint": true, "p1": "LLMが温かい励ましで応じながら利用者の目標を前に進めない失敗を「目標の置き換え（goal displacement）」と定義し、230場面・18モデル・4,134件の人手採点からなるベンチマーク（GDB）で測れるようにした（抄録、§3〜6）。", "p2": "迎合（sycophancy）の研究は事実の正しさや相手へのお世辞を見るが、励ましが中身を押しのけて目標が達成されないという機能的な失敗は測られていなかった（§3.1）。", "p3": "場面を「動かせない制約があるか」×「感情的な苦痛があるか」の2×2で分け、制約あり（F1、F2）を罠、苦痛だけ（F0）を共感が目的の場面とした。採点は「支持的な文を全部消したとき、目標に役立つ中身が残るか」という削除テストで置き換えの深刻度を0〜3で測り、目標への忠実さ・制約の認識と別々に報告する（§3.2、§4.3）。例：受給資格に締め切りがあるのに「きっと大丈夫」と励ますだけの回答は置き換え。", "p4": "18モデルを230場面で温度0.7・単発で評価し、著者2人がモデル名を伏せて採点。外部評価者2人の191件で信頼性を確認した（§5、表1）。", "p5": "深刻度の外部評価者と著者の一致は重みつきκ=0.82（抄録）。罠での置き換え率は0.0%（Gemini 2.5 Pro、GPT-5.4など）から37.7%（Llama 3 8B）で、Chatbot ArenaのEloと強い負の相関（ρ=−0.706、n=15）。共感だけを求める場面で頼まれていない問題解決に走る「逆の置き換え」は最大41.9%で、罠の置き換えが少ないモデルにも見られた（抄録、§6、表2）。OLMo-2では教師あり微調整後も52.3%で、選好最適化（DPO）後に13.8%へ下がった（抄録）。", "p6": "場面は著者作成の英語のみで、米国の制度に偏り、初回応答だけを見る。削除テストは中身の正しさや安全性は評価しない（§8）。", "fun": "困っている人に「大丈夫、あなたならできる」とだけ返すのは優しそうですが、締め切りが過ぎているなら役に立ちません。逆に「ただ聞いてほしい」のに解決策を並べられるのも的外れ。励ましの文を全部消して中身が残るかを見る、という採点方法は、人間の相談対応を振り返るのにも使えそうな発想です。", "unverified": "モデル別の全数値（表2の後半）と付録のシナリオの内容は一部しか確認していない。"}}, {"id": "pr08", "rank": 8, "headline": "店舗間で需要推定を借り合う転移学習", "title": "Borrowing Strength Across Stores: Transfer Learning for Choice-Based Revenue Management", "url": "https://doi.org/10.2139/ssrn.7641638", "authors": "Recep Yusuf Bekci ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Bekci, R. Y., Jasin, S., & Uichanco, J. (2026). Borrowing Strength Across Stores: Transfer Learning for Choice-Based Revenue Management. https://doi.org/10.2139/ssrn.7641638", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を使用。本文は入手できず", "preprint": true, "p1": "多店舗の小売で、店舗別の需要推定と他店舗の情報を縮小推定で組み合わせる転移学習を、多項ロジット（MNL）需要モデルで定式化し、有限標本の性能保証と品揃え・価格決定の後悔の上界を与えた（抄録）。", "p2": "店舗ごとの推定はデータ不足で不安定、全店舗の統合は地域差を無視する。線形・二次の設定と違い、非線形のMNL尤度ではバイアス-分散の分解が単純でない（抄録）。", "p3": "店舗固有の推定と他店舗の統合情報を組み合わせる縮小推定量を提案し、MNL尤度の自己整合的な性質を使って、情報の移転が推定を改善する条件と、適切な縮小の程度が局所標本数・特徴次元・店舗間の異質性にどう依存するかを導いた（抄録）。", "p4": "数値実験と、欧州のアパレル小売の数百店舗のデータで、局所推定・全統合と比べ、標本外の商品優先順位づけと売上の獲得を評価した（抄録）。", "p5": "縮小推定は局所推定と全統合のどちらよりも、標本外の商品の優先順位づけと売上獲得を改善した（抄録）。改善の大きさの数値は未読。", "p6": "MNLの独立性の仮定（IIA）に依存する点、店舗間の類似性の定義の仕方、販売期間が短いカテゴリでの頑健性は未確認。", "fun": "小さな店のデータだけでは客の好みが読み切れず、全店をひとまとめにすると地域の個性が消えます。そこで「自分の店の結果を、他店の平均に少し引き寄せる」――どれだけ引き寄せるかを、データの量と店の違いから決めるのが要点です。統計の世界ではスタインのパラドックス以来知られる考え方を、非線形の選択モデルに広げた点に価値があります。", "unverified": "本文未読のため、性能保証の具体的な式と実データの効果量は未確認。"}}, {"id": "pr09", "rank": 9, "headline": "端末内で集計し移動データの匿名性を守る", "title": "A privacy-preserving infrastructure for multimodal mobility sensing in environmental social research", "url": "https://doi.org/10.5281/zenodo.23534836", "authors": "Colombo ほか", "venue": "Zenodo", "date": "2026-10-21", "apa": "Colombo, M., Lalanne, D., & Nembrini, J. (2026). A privacy-preserving infrastructure for multimodal mobility sensing in environmental social research. Zenodo. https://doi.org/10.5281/ZENODO.23534836", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "本文", "basis_note": "Zenodo掲載のPDF本文（結果、考察、方法の参加者・処理の節）と図のキャプションを読んだ", "preprint": true, "p1": "位置情報を端末の中で集計・破棄し、粗くした記録だけを送るスマホの移動センシング基盤を作り、スイスの2つのリビングラボで2年間運用して、それでも交通行動の分析に使えることを示した（抄録、Results）。", "p2": "環境と行動の関係を調べるには詳しい移動データが要るが、生の軌跡の収集は再識別のリスクが大きく、精度・プライバシー・参加者の負担の間にトレードオフがあった（Discussion）。", "p3": "アプリが端末内で交通手段を推定し、生のGPS軌跡は破棄して、出発・到着のジオハッシュ、距離、手段、推定CO2排出だけを送る。別に、個人と結びつかない8文字ジオハッシュの位置標本を送る。サーバは仮名IDで調査票・建物センサ・気象データと結合する（Results、図1、図8）。", "p4": "2024年9月〜2026年9月、フリブールとヴィンタートゥールで328人（登録530人）が100,942トリップを記録。公共交通トリップの端点が施設から700m以内に入るかで空間精度を検証し、気温と移動時間（参加者固定効果のOLS）、車の保有とCO2の関係を分析した（Results、Methods）。", "p5": "公共交通23,997トリップの94.3%で両端点が施設から700m以内だった（図4）。距離ベースの手段分担は鉄道57.9%、自家用車28.4%で、全国統計と異なるのは標本の車保有が少ないため（世帯の車保有46.2%対全国78%）と説明した（図3）。徒歩時間は気温に逆U字（線形β=−0.293、二次β=−0.0324、p<0.001）で15〜20℃が最大、他の手段は有意な非線形性なし（図6）。複数台保有世帯は日々の排出強度が223.7%高かった（Discussion、図7）。", "p6": "標本は2つの都市圏の募集に偏り、公共交通の利用が多い。OSの背景実行制限や乗車時の検出遅れで、交通拠点付近に空間誤差が残る（Discussion）。精度の評価は参加者の主観調査が中心。", "fun": "どこにいたかを全部記録しなくても、「どの辺りからどの辺りへ、何で移動したか」だけで暑さで散歩が減ることまで分かる――プライバシーと研究の両立を実証した点が面白いところです。生データを手元で消してしまうという、逆転の設計思想が鍵になっています。", "unverified": "交通手段推定の正答率の定量評価は本文で確認できず未確認。"}}, {"id": "pr10", "rank": 10, "headline": "職場の合図は過去の経験で意味が条件づく", "title": "Cue–Appraisal Learning in Organizations: A Theory of Conditioned Appraisal Meaning", "url": "https://doi.org/10.31234/osf.io/ybxjv_v2", "authors": "Robin Umbra", "venue": "PsyArXiv", "date": "2026-10-21", "apa": "Umbra, R. (2026). Cue–Appraisal Learning in Organizations: A Theory of Conditioned Appraisal Meaning. https://doi.org/10.31234/osf.io/ybxjv_v2", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "PsyArXiv（OSF）のPDF本文（隣接概念との区別、評価の意味の類型、命題1〜6の主な節、範囲条件、実証上の含意、考察）を読んだ", "preprint": true, "p1": "人事評価や上司の決まり文句など職場で繰り返される「合図（cue）」が、過去の経験から学ばれた評価の意味（条件づけられた評価意味）を持ち、出来事が展開する前に感情や行動傾向を左右するという理論を組み立てた理論論文（抄録）。", "p2": "既存の理論は、その場の出来事（感情事象理論）か、職場全体の知覚（公正、風土、心理的安全性など）を扱い、特定の合図ごとに従業員が学んだ意味を説明する中間の単位がなかった（Discussion）。", "p3": "評価理論と評価条件づけの研究に基づき、合図が尊厳・公正・安全・所属・統制・責任・修復に関わる重要な場面で、似た評価とともに繰り返し現れると、その合図に評価の意味が結びつくとする。意味の類型（害と脅威、道徳と責任、所属と尊厳など）を整理し、獲得・特異性・般化・弁別・改訂・下流の反応についての命題を立てた（p.14、p.24、p.28）。例：苦情窓口に訴えても直らない経験を重ねると、窓口そのものが「修復の見込みが低い」という意味を帯びる。", "p4": "実証データはない。検証のため、合図ごとの過去の経験、現在の評価の活性化、下流の反応を分けて、日記・経験サンプリング・反復測定で測ることを提案し、人事評価を例に研究デザインを示した（p.31〜33）。", "p5": "命題1：重要で一貫した評価を伴う場面で繰り返されるほど学習は強い。命題5：意味は、その中身に反する信頼できる反証の経験が繰り返されると改訂されやすく、単に好ましい経験では改訂されにくい（p.24、p.28）。心理的安全性とは、チーム全体は安全でも特定の会議の形式が危険と評価されうる点で区別した（p.14付近）。", "p6": "概念の提案で、命題は未検証。過去の経験の回顧的な測定は再構成の偏りを受けやすいと著者は認める。範囲条件として、合図が繰り返し認識できること、評価に一貫性があることなどを挙げる（p.31）。", "fun": "同じ「ちょっと話があるんだけど」という上司の一言でも、ある人には何でもなく、別の人には胸がざわつく――その違いは、その言葉がこれまでどんな場面で使われてきたかの「学習」から生まれる、という考え方です。パブロフの犬のベルのように、職場の小さな合図が意味を背負う仕組みを整理しています。", "unverified": "命題2〜4・6の詳細な文言は一部しか確認していない。"}}, {"id": "pr11", "rank": 11, "headline": "離散格子モデルを位相場で整え動的き裂を解く", "title": "A 2D discrete model with a phase-field regularisation applied to dynamic crack propagation", "url": "https://doi.org/10.21203/rs.3.rs-11268811/v1", "authors": "Matías Braun", "venue": "Research Square (In Review)", "date": "2026-10-21", "apa": "Braun, M. (2026). A 2D discrete model with a phase-field regularisation applied to dynamic crack propagation. https://doi.org/10.21203/rs.3.rs-11268811/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "Research SquareのPDF本文（序論・モデルの節の見出し、数値例の図キャプション、結論）を読んだ。式の導出部は流し読み", "preprint": true, "p1": "格子状の離散モデル（粒子をばねでつないだモデル）に、節点ごとの位相場（き裂の度合いを0〜1で表す連続変数）による正則化を加え、動的き裂の進む向きが格子の向きに引きずられる偏りを大きく減らした（抄録、§5）。", "p2": "格子モデルは破壊を自然に表せるが、き裂の経路が格子の向きに依存する。周りの粒子を多く結ぶと偏りは減るが計算が重い（§1、§5）。", "p3": "第一近傍の法線・接線方向の結合をもつボルン型格子に、引張強度と破壊エネルギーで較正した節点の位相場（PF-CZM型）を載せ、勾配エネルギーを格子の結合についての和で書き、運動方程式を陽的に時間積分した（抄録、§2〜3）。背景：位相場はき裂を幅ℓの帯としてぼかし、経路を格子から切り離す役割をもつ。", "p4": "格子を0・15・30度回した条件で、カルトホフ・ウィンクラー試験（端に衝撃を受ける切欠き板）と片側切欠き板の引張を解き、内圧衝撃を受ける厚肉円筒の破砕は中心配置とずらした格子で比べた。き裂経路、進展速度、荷重-変位、エネルギーを実験と文献の数値解と比べた（抄録、§4）。", "p5": "カルトホフ・ウィンクラー試験では、格子の向きによるき裂角度の差は1.6°（格子間隔1.25mm）、0.16°・0.47°（0.625mm）で、ℓが特性長の1/4以下のとき角度69°、き裂速度はレイリー波速の0.71〜0.72倍と向きに依存しなかった（§5、図6）。引張試験では直線き裂で、最大荷重の向きによる差は2%・0.7%。円筒は放射状き裂が外面近くで分岐し、12〜19個の破片となった（§5）。", "p6": "き裂の駆動力が混合的で、劣化した結合が放出するエネルギーと正則化したき裂のエネルギーが一致しない点を著者は主な限界とする。ソルバの許容誤差と時間刻みの検討も残る（§5）。", "fun": "方眼紙の上で物を壊すと、ひびが方眼の線に沿って走りがちになる――格子でできた計算モデルには、そんな「くせ」があります。ひびを少しぼかした帯として扱うと、格子の向きを回してもひびの角度がほとんど変わらなくなる、という解決法が面白いところです。", "unverified": "文献値（XFEMやメッシュフリー解）との数値的な比較の詳細は未確認。"}}, {"id": "pr12", "rank": 12, "headline": "路面の粗さを見分けてサスペンションを切り替え", "title": "Road-Roughness-Adaptive Energy Management for Regenerative Suspensions: Coordinating Vibration Suppression and Energy Recovery", "url": "https://doi.org/10.2139/ssrn.7649557", "authors": "Qihui Ling ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Ling, Q., Zhilong, W., Dai, J., Shijie, Y., Wang, G., Guo, Y., & Xingyun, H. (2026). Road-Roughness-Adaptive Energy Management for Regenerative Suspensions: Coordinating Vibration Suppression and Energy Recovery. https://doi.org/10.2139/ssrn.7649557", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を使用。本文は入手できず", "preprint": true, "p1": "不整地を走る装軌車両の回生型アクティブ・サスペンションで、走行中に路面の粗さを識別し、エネルギー回収・能動制振・受動の3モードを切り替えることで、制振と回生の両立を図った（抄録）。", "p2": "回生サスペンションでは振動の抑制とエネルギー回収が相反し、装軌車両ではモード切替時の力と加速度の急変が乗り心地を損なう（抄録）。", "p3": "ニューラルネットと信号処理を組み合わせて路面粗さをリアルタイムに分類し、路面に応じて3モードを選ぶ。切替時の衝撃を抑える滑らかな遷移機構も設計した（抄録）。", "p4": "典型的な未舗装路での路面分類の精度、切替時のピーク加速度、オフロード条件でのシミュレーションによる正味の省エネと動的性能を、常時回生・常時能動制御と比べた（抄録）。", "p5": "路面粗さの分類精度は96%、切替時のピーク加速度衝撃は13〜19%低減した。提案法は動的性能の劣化3%未満で約18%の正味の省エネを達成し、常時回生・常時能動制御のどちらも上回った（抄録）。", "p6": "評価はシミュレーションが中心で、実車での検証の有無は抄録から確認できない。路面分類が誤ったときの影響と、分類器の学習データの範囲は未確認。", "fun": "でこぼこ道ではサスペンションで揺れを抑えたいし、平らな道では揺れのエネルギーを電気として回収したい。その切り替えを「いまどんな道か」を車自身が判断して行うという、「情報でエネルギーを稼ぐ」発想が面白いところです。", "unverified": "本文未読のため、車両モデルと路面分類器の詳細は未確認。"}}, {"id": "pr13", "rank": 13, "headline": "カタルーニャ独立投票後に中小企業は現金を減らした", "title": "SME Financial Behaviour Under Institutional Risk: Evidence from the 2017 Catalan Political Shock", "url": "https://doi.org/10.2139/ssrn.7641798", "authors": "Leisan Batyrova, Alberto D&iacute ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Batyrova, L., & Díaz-Dapena, A. (2026). SME Financial Behaviour Under Institutional Risk: Evidence from the 2017 Catalan Political Shock. https://doi.org/10.2139/ssrn.7641798", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を使用。本文は入手できず", "preprint": true, "p1": "2017年のカタルーニャ独立住民投票を自然実験とし、制度的リスクの高まりで中小企業が流動性と現金を減らし、負債を増やしたことを差の差で示した（抄録）。", "p2": "大企業の制度リスクへの反応は研究が多いが、影響を受けやすい中小企業の財務行動はほとんど分かっていなかった（抄録）。", "p3": "SABIの企業パネル（2014〜2019年）で、カタルーニャの中小企業12,155社と、アリカンテ・カステリョン・バレンシア・マドリードの類似企業を差の差（DiD）で比べ、イベントスタディと偽薬検定を加えた（抄録）。", "p4": "評価指標は一般流動性比率、現金保有、負債比率、売上。識別の前提は投票前に両群の傾向が平行であること（抄録）。", "p5": "投票後、カタルーニャの中小企業の流動性比率は0.089（標本平均の約3.4%）下がり、現金保有は4.1%減、負債は0.25ポイント増えた。売上の増加は既存の傾向を一部反映した。投票前に5%水準で有意な差はなく、2017年以降に持続的な負の効果があった。効果は零細・中規模企業と専門サービス・製造・卸小売に集中した（抄録）。", "p6": "対照地域の選び方への依存、同時期の他のショック（景気、本社移転など）の除去、短期の財務指標に限られる点が残る。解釈：機序（取引先の信用、資金調達条件の変化など）は抄録からは確定できない。", "fun": "政治の大きな出来事が、町の小さな会社の財布の中身まで変えてしまう――独立をめぐる住民投票という一度きりの出来事を「実験」に見立て、似た地域の会社と比べて影響を取り出した点がこの研究の工夫です。", "unverified": "本文未読のため、マッチングの方法と頑健性の詳細は未確認。"}}, {"id": "pr14", "rank": 14, "headline": "仕事で生成AIを使う人ほど自腹でも払う", "title": "Who Pays for Generative AI? Work, Household Budgets, and Subscription Demand", "url": "https://doi.org/10.2139/ssrn.7643078", "authors": "Fuli Yang", "venue": "SSRN", "date": "2026-10-21", "apa": "Yang, F. (2026). Who Pays for Generative AI? Work, Household Budgets, and Subscription Demand. https://doi.org/10.2139/ssrn.7643078", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を使用。本文は入手できず", "preprint": true, "p1": "韓国の週次消費者調査11回分（8,800件）で、生成AIを仕事と私用の両方に使う人ほど、毎月のAI予算を自腹で出す意思が広いことを示した（抄録）。", "p2": "生成AIの有料市場がどう形成されるかを、組織の導入だけでなく家計の予算判断から説明する研究は乏しかった（抄録）。", "p3": "職業標本4,440件を中心に、仕事・私用・学習の使い方の組み合わせ（7通り）と支払意思の関係を、属性・職業・企業規模・職場の方針・利用頻度で調整して比べ、後の9回で再現を確かめた。支払意思の金額が不完全な回答はすべての許容的な補完で範囲を評価した（抄録）。", "p4": "評価指標は月のAI予算を割り当てる意思の割合（パーセントポイント差）と、実際の購読支出の記録（抄録）。", "p5": "後の9回で、仕事と私用の併用は仕事で使わない人より11.3ポイント、仕事だけで使う人より8.5ポイント高かった。学習が加わるとさらに4.6ポイント差。1万ウォンの水準でも差は少なくとも4.2・2.6ポイント。購読支出の記録の92.2%は仕事で使う人によるものだった（比較対象の中核標本では73.8%）（抄録）。", "p6": "横断的な関連で、因果（仕事で使うから払うのか、払う人が仕事でも使うのか）は識別されていない。韓国の調査会社の標本の代表性も未確認。", "fun": "会社で生成AIを使い慣れた人ほど、家でも自分のお金で有料版を契約する――仕事と私生活の境目を越えて「財布」が開く様子をデータで示しています。使い道が多いほど払う価値を感じる、という当たり前に見える関係を、細かな比較で確かめた点がポイントです。", "unverified": "本文未読のため、調整後の推定の詳細は未確認。"}}, {"id": "pr15", "rank": 15, "headline": "危機対応の広報を多エージェントで試すベンチ", "title": "BrandEval: A Two-Track Multi-Agent Benchmark for Risk-Sensitive LLM Crisis Communication", "url": "https://doi.org/10.48550/arxiv.2610.25208", "authors": "Haotian Gan ほか", "venue": "arXiv (Cornell University)", "date": "2026-10-18", "apa": "Gan, H., Tang, W., Sun, H., Luo, Y., Li, X., Wang, J., Li, W. Y., & Li, Y. (2026). BrandEval: A Two-Track Multi-Agent Benchmark for Risk-Sensitive LLM Crisis Communication (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.25208", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（ベンチマーク4章、実験5章の静的・動的結果と整合性の節、表2）を読んだ。付録と表3の全数値は未読", "preprint": true, "p1": "製品の不祥事などのブランド危機での広報対応をLLMで評価するため、1回の戦略分析を採点する静的トラックと、消費者・競合エージェントのいる模擬市場で20ラウンド対応させる動的トラックからなるベンチマーク（BrandEval）を作った（抄録、§4）。", "p2": "既存の評価は単発・静的で、世論の反応や競合の動きで信頼が時間とともに変わる長期の危機対応を評価できなかった（抄録）。", "p3": "静的トラックは1,000場面で、消費者・ブランド、公衆・メディア、競合、戦略統合の4観点を3つのLLM審査員が1〜10点で採点（人の採点300件とのMAE 1.08、相関0.64）。動的トラックは50場面で、5×3の人物像（意思決定の動機×初期の態度）をもつ消費者エージェントが、ブランド知覚と購買・推奨意図の5次元の状態を指数移動平均で更新し、4類型の競合エージェントが動く環境（BrandPolis）で、評判指数・NPS・評判の変動・分極などを測る（§4.1〜4.3、式1）。", "p4": "主要な商用・公開LLMをゼロショットで評価し、中国語の危機対応データ（BrandSRD）で学習した参照エージェント（Qwen3-8B基盤）と比べた。各場面5シードの平均（§5.1、§4.2）。", "p5": "静的では商用の最先端モデルが上位（GPT-5.1の戦略統合7.60など、表2）。静的と動的の順位の一致はケンドールτで評判0.67、分極0.82だが、評判の変動は−0.33、遅い回復の指標は−0.24と逆向きだった（§5.4）。1回の分析が上手でも、長期の安定や回復は予測できないことを示した。", "p6": "消費者の状態更新は単純化した代理指標で、現実の世論との整合は3つの電気自動車の事件で粗く確かめたにとどまる（§5.5）。中国語データ中心で、静的採点はLLM審査員に依存する。", "fun": "不祥事のときに「立派な謝罪文」を書けることと、その後何日も続く炎上や競合の攻勢の中で信頼を立て直せることは別の能力だ――ということをAIで確かめた研究です。一発の答案の採点と、長い試合の結果が食い違うのは、人間の危機管理にも通じる教訓です。", "unverified": "動的トラックのモデル別の数値（表3）は未確認。"}}, {"id": "pr16", "rank": 16, "headline": "モード試験の不確かさがモード尺度を狂わせる", "title": "Mode scaling errors due to modal tests uncertainties: a numerical study", "url": "https://hal.science/hal-05820920v1", "authors": "Marie Cianci ほか", "venue": "HAL", "date": "2026-10-20", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "HALに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "実験モード解析で同定した固有ベクトルの「大きさ（ノルム）」が、測定の不確かさでどれだけずれるかを数値実験で調べた研究。", "p3": "単純な板を対象に、ノイズの大きさ、周波数分解能、同定の最大次数を変えて同定を繰り返し、固有ベクトルのノルムの誤差を評価した。さらに理論的に作った質量行列でモードを再正規化した（抄録）。", "p5": "これらのパラメータはノルムに大きく影響した。質量行列での再正規化はノルム誤差のばらつきを減らすが、行列が単純なための一定の誤差が残る（抄録）。", "fun": "モードの「形」の一致を測るMACという指標は、ベクトルの長さを無視するので、形が合っていても大きさがずれていることに気づけません。逆問題では入力の小さな雑音が答えを大きく揺らすことがあり、どの条件が効くかを一つずつ確かめた点が地味ながら大事です。", "unverified": "具体的な誤差の数値と最適な条件は抄録になく未確認。"}}, {"id": "pr17", "rank": 17, "headline": "安価なGNSS受信機で高層ビルの変形を測る", "title": "Experimental Evaluation of Low-Cost GNSS Receivers for Deformation Monitoring in High-rise Buildings", "url": "https://doi.org/10.21203/rs.3.rs-10114301/v1", "authors": "Jayamanne Mudalige Oshadee Jayamanne ほか", "venue": "Research Square (In Review)", "date": "2026-10-21", "apa": "Jayamanne, J. M. O., Psimoulis, P., Owen, J., Penna, N., & Xue, C. (2026). Experimental Evaluation of Low-Cost GNSS Receivers for Deformation Monitoring in High-rise Buildings. https://doi.org/10.21203/rs.3.rs-10114301/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "数万円級の低価格GNSS受信機でも、高層ビルの揺れや変形をセンチ〜サブセンチの精度で測れることを実験で示した研究。", "p3": "2周波のu-blox F9P受信機に性能の異なる3種のアンテナを組み合わせ、測地級の装置と比べて静的・準静的・動的（揺れ）条件で精度を評価し、高さ220mのビルで事例検証した（抄録）。", "p5": "アンテナの種類と使う衛星の組み合わせが性能を大きく左右した。0.5Hzまでの揺れで水平は5mmより良い精度、鉛直は準静的で1cm、動的で2cmより良い精度だった（抄録）。", "fun": "スマホにも入っている衛星測位の仕組みを使って、超高層ビルが風でミリ単位で揺れる様子を見ようという研究です。高価な測量機器でなくても、アンテナ選びと衛星の組み合わせを工夫すれば十分な精度が出るという点が、監視を安く広げる鍵になります。", "unverified": "事例ビルの名称・観測期間や誤差の詳細な内訳は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "不正調査AIはいつ人に引き継ぐべきか", "title": "Knowing When to Ask: Multi-Signal Calibrated Escalation for LLM Fraud-Investigation Agents", "url": "https://doi.org/10.20944/preprints202610.1952.v1", "authors": "Kailing Fu", "venue": "Preprints.org", "date": "2026-10-21", "apa": "Fu, K. (2026). Knowing When to Ask: Multi-Signal Calibrated Escalation for LLM Fraud-Investigation Agents. https://doi.org/10.20944/preprints202610.1952.v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "LLMの不正調査エージェントが「自分で処理するか、人に回すか」を決めるとき、自己申告の確信度より従来型分類器との不一致の方が頼れる合図だと示した研究。", "p3": "自己申告の確信度、繰り返し実行の一貫性、表形式の不正分類器との不一致、取得した証拠の十分さの4つの信号を較正し、分析者の処理能力の制約の下で非対称なコストで人に回す判断ゲート（CEG）を作った（抄録）。", "p5": "モバイルマネーのシミュレータ事例で、確信度は較正誤差0.069と最も弱く、組み合わせは0.022。分類器との不一致がゲートを支え、分類器スコアだけで組み合わせの12%以内に迫った。コンフォーマル版は不正パターンが変わると10回の繰り返しすべてで偽陰性目標を外した（抄録）。", "fun": "AIが「自信あります」と言っても、その自信はあてにならない――という結果です。むしろ別の昔ながらのモデルと意見が割れたときこそ要注意、というのは人間の組織でのダブルチェックに似ています。条件が変わると保証が静かに破れる点も、運用の怖さを示しています。", "unverified": "データの規模とシミュレータの詳細は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "統制が情報を歪める：監査と内部報告の設計", "title": "When Control Corrupts Information: Feasible Auditing, Report Use, and the Nonmonotone Demand for Protection", "url": "https://doi.org/10.2139/ssrn.7644001", "authors": "Dr. Jan-Hendrik Weinert", "venue": "SSRN", "date": "2026-10-21", "apa": "Weinert, Dr. J.-H. (2026). When Control Corrupts Information: Feasible Auditing, Report Use, and the Nonmonotone Demand for Protection. https://doi.org/10.2139/ssrn.7644001", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "独立監査と従業員の自己報告の使い方を同時に最適化すると、報告の利用度が情報の価値に対して単調にならない（減ってから増える）ことを理論的に示した研究。", "p3": "労働者が欠陥の予防・発見・開示を別々に行う、選択肢が有限の統治問題を解く。監査は発生は確認できるが事前の認識は証明できないので、隠蔽への罰は実施できない前提で、監査の強さと報告の利用を同時に最適化した（抄録）。", "p5": "情報の価値が上がると報告の利用はいったん減ってから増え、その後完全な保護が最適になる。一方、最適化された情報量の合計は価値に対して単調だった。実証的な効果は検証していない（抄録）。", "fun": "社員の報告を評価に使えば情報は集まりそうですが、評価に使われると分かると報告が歪みます。だから情報が大事になるほど報告を使わない方がよい場面がある、という直感に反する結論が数学的に出てくるのが面白いところです。", "unverified": "モデルの具体的な仮定と証明の内容は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "インフレは上場企業の会計上の収益性を削るか", "title": "Inflation and the Profitability of Listed Non-Financial Firms in Pakistan: Firm-Level Panel Evidence, FY2006–FY2025", "url": "https://doi.org/10.2139/ssrn.7644858", "authors": "Abdul Haseeb Khan", "venue": "SSRN", "date": "2026-10-21", "apa": "Khan, A. H. (2026). Inflation and the Profitability of Listed Non-Financial Firms in Pakistan: Firm-Level Panel Evidence, FY2006–FY2025. https://doi.org/10.2139/ssrn.7644858", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "パキスタンの上場非金融企業441社・6,683企業年で、インフレと会計上の収益性の関係は平均ではほぼなく、10%を境に非線形になることを示した研究。", "p3": "中央銀行の企業別財務諸表から2006〜2025年度のパネルを作り、各社の決算期間のインフレ率とROAを固定効果モデルで結び、共通ショックを考慮したワイルド・クラスター・ブートストラップで推論した（抄録）。", "p5": "平均の関係は有意でない（係数+0.14ポイント、p=0.27）。10%未満では物価1ポイントあたりROA+0.48ポイント、10%超では−0.05で、傾きの変化は頑健（p=0.006）。名目営業利益は約6.4倍になったが実質ではほぼ横ばいだった（抄録）。", "fun": "物価が上がると会社の利益の数字も膨らみますが、それは本当にもうかったのか、お金の価値が下がっただけなのか。20年で名目利益が6倍以上なのに実質ではほぼ増えていないという結果は、帳簿の数字をうのみにしない大切さを教えてくれます。", "unverified": "業種別の推定値の詳細は未確認。因果効果ではなく関連である（著者明記）。"}}, {"id": "pr21", "rank": 21, "headline": "根拠台帳つき多エージェントでAML報告を追跡可能に", "title": "Evidence-Ledger Multi-Agent Investigation for Traceable Anti-Money-Laundering Reporting", "url": "https://doi.org/10.20944/preprints202610.1948.v1", "authors": "Kailing Fu", "venue": "Preprints.org", "date": "2026-10-21", "apa": "Fu, K. (2026). Evidence-Ledger Multi-Agent Investigation for Traceable Anti-Money-Laundering Reporting. https://doi.org/10.20944/preprints202610.1948.v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "マネロン調査の報告を書くLLMエージェントに、引用した取引を台帳と1項目ずつ照合させる仕組み（ELMI）を入れ、架空の引用をほぼなくした研究。", "p3": "調査エージェントはツールが返した記録だけを引用でき、それを再生可能な台帳に残す。決定的なチェッカーが各引用を項目ごとに照合し、推論過程を見ない独立の検証エージェントが類型の主張を判定する。合成データ240事例で評価した（抄録）。", "p5": "引用の忠実度は0.97で、単独のツール利用エージェントの0.76を上回った。独立検証は類型の正解率を0.58→0.67、証拠の再現率を0.59→0.71に上げたが、トークンは2.6倍かかった（抄録）。", "fun": "AIの報告書が存在しない取引を引用すると、規制上の大問題になります。そこで「AIの賢さ」に頼るのでなく、台帳と機械的に突き合わせる仕組みで正確さを保証する、という発想の転換が面白い点です。会計の照合作業そのものの考え方です。", "unverified": "合成データの生成方法と使ったモデル名は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "タイのEV充電は再利用の段階で競う", "title": "From Infrastructure Expansion to Reuse: Customer Continuance in Thailand's Multi-Brand Public EV Charging Market", "url": "https://doi.org/10.5281/zenodo.22911954", "authors": "Khumpoung, Pattira", "venue": "Zenodo", "date": "2026-10-21", "apa": "Khumpoung, P. (2026). From Infrastructure Expansion to Reuse: Customer Continuance in Thailand's Multi-Brand Public EV Charging Market. Zenodo. https://doi.org/10.5281/ZENODO.22911954", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用（本文は入手できず）。調査計画段階の文書", "preprint": true, "short": true, "p1": "タイの多ブランドの公共EV充電で、利用者が満足して再利用するかを説明するモデルを提案する調査計画（結果はまだない）。", "p3": "技術継続理論に基づき、充電サービス品質・プラットフォームへの信頼・充電リスク・環境価値・制度への信頼が満足を通じて再利用意図につながるモデルを立て、自宅充電の有無を境界条件とする。バンコク首都圏のBEV利用者400人以上を調査しPLS-SEMで検証する予定（抄録）。", "p5": "未確認（調査は今後実施と記載）。背景として2025年末に充電拠点4,356か所・コネクタ13,042基とある（抄録）。", "fun": "充電スタンドが増えると、次は「どの会社のスタンドをまた使いたいか」の競争になります。家で充電できる人とできない人では公共スタンドへの依存度が違うので、同じサービスでも満足の効き方が違うはず、という問いの立て方がポイントです。", "unverified": "実データ・結果はまだない（計画段階）。"}}, {"id": "pr23", "rank": 23, "headline": "地震の恐怖は揺れの強さに比例しなかった", "title": "Fear without a dose-response: real-time crowdsourced psychometrics show a moderate earthquake’s psychological footprint is decoupled from shaking intensity in an anticipation-primed megacity", "url": "https://doi.org/10.31223/x5kn6h", "authors": "Yasemin Aktas ほか", "venue": "EarthArXiv", "date": "2026-10-21", "apa": "Aktas, Y., Bossu, R., Issartel, S., & Steed, R. (2026). Fear without a dose-response: real-time crowdsourced psychometrics show a moderate earthquake’s psychological footprint is decoupled from shaking intensity in an anticipation-primed megacity. https://doi.org/10.31223/x5kn6h", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "EarthArXivの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "2025年のイスタンブールのM6.2地震で、人々の恐怖は揺れの強さにほとんど比例せず、「揺れたかどうか」のしきい値で決まることをリアルタイム調査で示した研究。", "p3": "検証済みの地震恐怖尺度をクラウドソーシングで地震直後に配り、数時間で186件の回答を得て、各回答者の報告震度と場所に結びつけた（抄録）。", "p5": "恐怖と報告震度の相関は弱く（r=0.24、分散の6%）、強く揺れた欧州側とアジア側で恐怖は同程度（24.2対24.5、p=0.85）。死者1人の地震で10万人が屋外に出て、けがはパニックによるものが中心だった（抄録）。", "fun": "揺れが強いほど怖いはず、という直感が成り立たない結果です。25年間「大地震が来る」と言われ続けた都市では、恐怖が揺れの量ではなく積み重なった不安として表れる。被害の少ない地震でも、人の反応が大きな混乱を生みうることを示しています。", "unverified": "回答者の偏り（クラウドソーシング標本）の補正方法は未確認。"}}, {"id": "pr24", "rank": 24, "headline": "民族を越えた商取引が社会の結束を育てる", "title": "Cross Ethnic Business Networks and Social Cohesion among Malay Entrepreneurs in Malaysia", "url": "https://doi.org/10.21203/rs.3.rs-10782739/v1", "authors": "Mohd Hadri Mohd Rifin ほか", "venue": "Research Square (In Review)", "date": "2026-10-21", "apa": "Rifin, M. H. M., Lyndon, N., Othman, M. H., Hassan, H., & Basar, U. A. (2026). Cross Ethnic Business Networks and Social Cohesion among Malay Entrepreneurs in Malaysia. https://doi.org/10.21203/rs.3.rs-10782739/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "マレーシアのマレー系中小企業経営者にとって、民族を越えた取引網が経済的価値だけでなく社会の結束も生むことを質的に示した研究。", "p3": "クアラ・トレンガヌのマレー系経営者20人に詳細面接を行い、現象学的デザインで主題分析した（抄録）。", "p5": "異なる民族・宗教の取引相手との繰り返しの交流で信頼が育ち、情報・助言・資源・非公式な金融支援の交換が可能になり、互恵と相互依存が関係を長続きさせた。交流は異文化学習と寛容の機会にもなった（抄録）。", "fun": "商売のつきあいは、お金だけでなく民族の違いを越える信頼を育てる場にもなる、という話です。社会の結束というと学校や地域の行事を思い浮かべがちですが、毎日の取引という地味な場面にその種がある、という視点が面白いところです。", "unverified": "面接の具体的な発言や対象者の属性の詳細は未確認。"}}, {"id": "pr25", "rank": 25, "headline": "認知症ケアは機会の提供から設計し直す", "title": "Opportunity-First Dementia Care: A Middle-Range Framework, Historical Validation of Its Mechanism, and a Policy Agenda for AI-Enabled Delivery", "url": "https://doi.org/10.2139/ssrn.7610360", "authors": "Min Wu", "venue": "SSRN", "date": "2026-10-21", "apa": "Wu, M. (2026). Opportunity-First Dementia Care: A Middle-Range Framework, Historical Validation of Its Mechanism, and a Policy Agenda for AI-Enabled Delivery. https://doi.org/10.2139/ssrn.7610360", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "認知症介護の支援は「情報や動機づけ」より「その人ができる行動の選択肢（機会）」を先に用意すべきだという中範囲理論を立て、AIの主張とは切り分けて検証の道筋を示した論考。", "p3": "能力・機会・動機の行動モデル（COM-B）を基に、制約下では能力に合った実行可能な選択肢が情報のみの支援より効くという命題を定式化し、AIを使わない先行プログラム（TAP）の無作為化試験4件と282研究のメタ分析で歴史的に検証した（抄録）。", "p5": "先行証拠は機序を部分的に支持した（退役軍人病院の試験で行動症状と介護者の苦痛が減少、後の試験では主要評価項目で効果なし）。AI特有の主張を検証した証拠はまだない（抄録）。", "fun": "「AIで介護支援を個別化」という宣伝文句を、そもそも何を届けるべきかという問いと、AIで届けるべきかという問いに分けて考える点が面白いところです。中身の正しさと届け方の正しさは別々に証明が必要だ、という整理は他の分野にも使えます。", "unverified": "メタ分析の効果量などの数値は抄録になく未確認。"}}, {"id": "pr26", "rank": 26, "headline": "タイの村落保健ボランティアを危機対応に", "title": "From Street-Level Quasi-Bureaucracy to Crisis Autonomy: Adapting Thailand's Village Health Volunteer (VHV) Architecture for Rural Primary Care Resilience", "url": "https://doi.org/10.2139/ssrn.7614665", "authors": "Rodion Ovsepian", "venue": "SSRN", "date": "2026-10-21", "apa": "Ovsepian, R. (2026). From Street-Level Quasi-Bureaucracy to Crisis Autonomy: Adapting Thailand’s Village Health Volunteer (VHV) Architecture for Rural Primary Care Resilience. https://doi.org/10.2139/ssrn.7614665", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "タイの約104万人の村落保健ボランティア網の制度的な仕組みを分析し、人手不足の農村の一次医療にどう移植できるかを論じた政策論考。", "p3": "街頭官僚制、公共奉仕動機、共有資源の統治、動機のクラウディングアウトなどの理論で制度を分析し、7〜14日の孤立シナリオで負荷試験を行い、ロシアの農村診療所への移転可能性を政策統合と料金監査で検討した（抄録）。", "p5": "月額約2,000バーツの手当を報酬ではなく実費補填として社会的地位と組み合わせる設計で、55%超が10〜16年以上続け、2型糖尿病のHbA1cを8.2%から7.6%に下げたと記載。小規模農村拠点の営業利益率は−79.5%（抄録）。", "fun": "お金を払えばやる気が出るとは限らず、払い方次第で善意がしぼむこともある――これを「動機のクラウディングアウト」と呼びます。少額の手当を「お礼」ではなく「経費の補填」と位置づけることで、長く続くボランティア網を作ったという話は、制度設計の妙を感じさせます。", "unverified": "HbA1cの改善が誰を対象にどの研究で示されたかは未確認（孫引きの可能性）。"}}, {"id": "pr27", "rank": 27, "headline": "二択の比較で利用者に合うペルソナを探る", "title": "Bridging Exploration and Persona: Information-Directed Dueling for Test-Time Agent Personalization", "url": "https://doi.org/10.48550/arxiv.2610.24385", "authors": "Jie Mao ほか", "venue": "arXiv (Cornell University)", "date": "2026-10-17", "apa": "Mao, J., Lu, P., Wang, X., Huang, H., Qiu, S., Zhang, M., & Dai, Z. (2026). Bridging Exploration and Persona: Information-Directed Dueling for Test-Time Agent Personalization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.24385", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（OpenAlex経由）を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "利用者の好みに合うLLMエージェントのペルソナを、2つの回答のどちらが良いかという軽い比較だけで素早く見つける方法（ID-TAP）を提案した研究。", "p3": "情報指向サンプリングに着想を得たニューラルなデュエリング・バンディットで、質問条件付きの効用モデルとブラッドリー・テリー型の探索器を組み合わせ、似た質問間で比較の証拠を引き継ぐ（抄録）。", "p5": "7つの利用者条件付き生成ベンチマークで、10回の比較という固定予算の中で比較手法のうち最も高い総合性能を示した（抄録）。", "fun": "「AとBどっちが好き？」を10回聞くだけで、たくさんある人格（ペルソナ）の中から相手に合うものを探す、という視力検査のような仕組みです。どの組み合わせを見せれば一番情報が得られるかを考えて質問を選ぶのが工夫です。", "unverified": "性能差の具体的な数値は抄録になく未確認。"}}, {"id": "pr28", "rank": 28, "headline": "多エージェントでどのエージェントを先に直すか", "title": "IF-MAP: Influence-Function-Inspired Agent Prioritization in Multi-Agent Systems", "url": "https://doi.org/10.48550/arxiv.2610.24383", "authors": "Jie Mao ほか", "venue": "arXiv (Cornell University)", "date": "2026-10-17", "apa": "Mao, J., Lu, P., Qu, Z., Sun, J., Wang, X., Shang, Z., Wang, Z., Xiong, G., & Dai, Z. (2026). IF-MAP: Influence-Function-Inspired Agent Prioritization in Multi-Agent Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.24383", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（OpenAlex経由）を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "LLMの多エージェントシステムで、限られた予算でどのエージェントを改善すれば全体が最も良くなるかを見つける方法（IF-MAP）を提案した研究。", "p3": "各エージェントのプロンプトに意味的な摂動を与えて全体の損失の変化を測り、低次元のプロンプト埋め込み空間で局所応答モデルを当てはめ、その応答の大きさを優先度とする。モデルの内部は使わない（抄録）。", "p5": "6つのワークフローで、選んだエージェントのプロンプト最適化は平均+3.81ポイント（一様選択は+1.85）、モデル更新は+7.62〜16.42ポイント（一様は+3.81〜8.62）。全エージェントの最適化に比べトークンを35.2〜74.2%削減した（抄録）。", "fun": "チームで成果を上げたいとき、全員を鍛えるより「この人が伸びればチーム全体が伸びる」人を見つける方が効率的です。失敗の責任者を探すのではなく、改善の伸びしろが大きい人を探す、という発想の違いが要点です。", "unverified": "6つのワークフローの詳細と統計的なばらつきは未確認。"}}, {"id": "pr29", "rank": 29, "headline": "多エージェントの失敗を工程の変動で監視する", "title": "AgentSoV: Virtual Sensing for LLM Multi-Agent Systems via Stream of Variation", "url": "https://doi.org/10.48550/arxiv.2610.24845", "authors": "Congjing Zhang ほか", "venue": "arXiv (Cornell University)", "date": "2026-10-17", "apa": "Zhang, C., Xu, S., Bai, Y., Ren, K., Qian, X., & Huang, S. (2026). AgentSoV: Virtual Sensing for LLM Multi-Agent Systems via Stream of Variation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.24845", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（OpenAlex経由）を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "LLM多エージェントシステムの実行を、製造工程の品質管理で使う「変動の流れ（SoV）」として状態空間モデルで表し、誤りの入り口や情報の影響を分析できるようにした研究。", "p3": "異なる構造のシステムの実行記録を診断段階に対応づけ、観測可能な出力から仮想計測を作り、段階間の変動の伝播を状態空間モデルで学習する（抄録）。", "p5": "再実行なしで、失敗の帰属、途中入力の影響の定量化、監視予算の下での仮想センサの配置の3つの分析ができることを複数の構造で示した（具体的数値は抄録になし）。", "fun": "工場で不良品がどの工程で生まれたかを突き止める統計手法を、AIエージェント同士の会話に応用した点が面白いところです。文章を一つずつ読むのではなく、システムを「動く機械」として扱うという視点の転換です。", "unverified": "性能の定量的な結果は抄録になく未確認。"}}, {"id": "pr30", "rank": 30, "headline": "LLM審査員そのものを負荷試験にかける", "title": "The Judge Under Trial: Stress-Testing RART and the Limits of Automated Evaluation at Scale", "url": "https://doi.org/10.20944/preprints202610.2039.v1", "authors": "Yoothana Suansook", "venue": "Preprints.org", "date": "2026-10-21", "apa": "Suansook, Y. (2026). The Judge Under Trial: Stress-Testing RART and the Limits of Automated Evaluation at Scale. https://doi.org/10.20944/preprints202610.2039.v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "LLMを審査員として使う既存の枠組み（RART）を、モンテカルロ・シミュレーションで負荷試験し、効果と弱点を明らかにした論考。", "p3": "「正しい答えを間違った理由で出す」失敗、メタ審査員で採点基準を人の理由づけに合わせる手順（RART）、4段階のライフサイクルを整理し、数理モデルをシミュレーションで検証した（抄録）。", "p5": "RARTは理由づけの整合を安定させたが、停止規則の人工物、ドリフト帯の較正の問題、盲点の漏れという弱点が見えた。審査員と生成器が盲点を共有しないという未検証の仮定に依存すると結論した（抄録）。", "fun": "「審査員を誰が審査するのか」という古い問いをAIに当てはめた研究です。正解と理由がずれていても、正解率だけ見ていると気づけません。AIの採点にも人の点検を続ける必要がある、という結論は身近な採点の仕組みにも通じます。", "unverified": "シミュレーションの設定と数値は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "概念グラフ上の多エージェント推論で有望研究を予測", "title": "Bridging Concepts: Multi-Agent Reasoning over Scientific Concept Graphs for High-Impact Research Prediction", "url": "https://doi.org/10.48550/arxiv.2610.25281", "authors": "윤동규 ほか", "venue": "arXiv (Cornell University)", "date": "2026-10-18", "apa": "Yoon, D., Hwang, M., Baek, J., Shin, D., & Whang, J. J. (2026). Bridging Concepts: Multi-Agent Reasoning over Scientific Concept Graphs for High-Impact Research Prediction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.25281", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（OpenAlex経由）を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "まだ一緒に研究されていない概念の組で、将来大きな影響を持つものを予測するため、LLMの多エージェントで概念グラフを推論する方法（MiroGraph）を提案した研究。", "p3": "論文本文からLLMで細かい研究概念を抽出し、共起で結んだ科学概念グラフを作る。特徴設計エージェントが構造・意味・傾向の特徴を考え、3つのLLMエージェントが値を計算し、分類器設計エージェントが影響を予測する（抄録）。", "p5": "CIKM・KDD・SIGIRの論文から作ったベンチマークで、既存の影響予測や時系列リンク予測より良い成績を示した（具体的数値は抄録になし）。", "fun": "新しい研究テーマは、それまで無関係だった概念が初めて結びつくときに生まれやすい、という考えに基づいています。どの「まだつながっていない組」が将来化けるかをAIに予想させる、まるで研究の天気予報のような試みです。", "unverified": "性能差の数値は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "偽ニュースでLLM売買エージェントが暴落を招く", "title": "Fake News, Real Crashes: Information Injection Attacks on LLM Financial Trading Agents", "url": "https://doi.org/10.48550/arxiv.2610.26438", "authors": "Mengxiao Wang ほか", "venue": "arXiv (Cornell University)", "date": "2026-10-19", "apa": "Wang, M., & Saxena, N. (2026). Fake News, Real Crashes: Information Injection Attacks on LLM Financial Trading Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.26438", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（OpenAlex経由）を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "ニュースを根拠に売買するLLMエージェントは、偽ニュース1本で一斉に同じ取引に走らされうることを、攻撃ベンチマークで示した研究。", "p3": "5つの注入経路と7つの事象カテゴリで、米国15銘柄の約1万件の判断について、指示ではなく「信じる証拠」を狙う情報注入攻撃を評価した（抄録）。", "p5": "プロンプト注入の成功率14%に対し偽ニュースは62%、30語の2つの雛形は15銘柄すべてで100%。情報源名や「速報」タグを消すと100%→0%になり、内容より体裁が効いた。防御の多くは効かず、階層的な集約だけが成功率を下げた（抄録）。", "fun": "AIは命令よりも「ニュースの見た目」にだまされやすく、しかも同じ情報を読む多数のAIが同時に同じ動きをするので、一つの嘘が市場全体を揺らしうる、という警告です。偽情報の中身ではなく「速報」という飾りが効くのは、人間にも思い当たる節があります。", "unverified": "評価に使ったモデル名と防御手法の詳細は未確認。"}}, {"id": "pr33", "rank": 33, "headline": "AI向けデータセンターが地域医療市場に波及", "title": "The Hidden Spillovers of AI Infrastructure: Data Centers and Local Healthcare Markets", "url": "https://doi.org/10.2139/ssrn.7617398", "authors": "Jingyuan Hu ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Hu, J., & Jin, Y. (2026). The Hidden Spillovers of AI Infrastructure: Data Centers and Local Healthcare Markets. https://doi.org/10.2139/ssrn.7617398", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "米国で大規模データセンターが開業すると、近くの病院の救急外来の受診が減り、病院の収入も減ることを示した研究。", "p3": "2013〜2024年の米国の病院運営と病院外の医療機関のデータを組み合わせ、開業時期のずれを使う多時点の差の差（staggered DiD）で推定した（抄録）。", "p5": "近隣病院の救急受診は開業後6.7%減り、距離とともに効果は弱まった。減少の約85%は住民1人あたり受診の減少による。診療所や居住型介護施設が増え、近隣病院の患者収入は5.1%減ったが人員や入院業務は減らなかった（抄録）。", "fun": "データセンターは汚染で病院の負担を増やすと心配されがちですが、実際には投資で地域の診療所が増え、救急に駆け込む人が減っていたという意外な結果です。大きな施設が地域に与える影響は、思わぬ経路を通ることがあります。", "unverified": "データセンターの規模の定義と頑健性の検定は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "共有デジタル公共基盤の継ぎ目は誰も統治しない", "title": "Governance Stops at the Boundary: A Theory of the Ungoverned Seam in Shared Digital Public Infrastructure", "url": "https://doi.org/10.2139/ssrn.7649972", "authors": "Hafed Tahri ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Tahri, H., & Guetib, A. (2026). Governance Stops at the Boundary: A Theory of the Ungoverned Seam in Shared Digital Public Infrastructure. https://doi.org/10.2139/ssrn.7649972", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "複数の組織にまたがるデジタル公共インフラでは、各組織が規則を完全に守っていても、つなぎ目の部分がどの組織の統治にも入らない「空白」が生じることを理論化した論考。", "p3": "統治の範囲の閉じ、継ぎ目の形成、カバー率と統合のはさみ状乖離という3つの機構から8つの命題を導き、アルジェリアの税関-決済、エストニアのX-tee、インドのUPIで例示した（抄録）。", "p5": "継ぎ目を閉じるには、接続層への管轄の割り当て、端から端までの地図、運営者への強制力ある経路の3条件がそろう必要があると主張した（抄録）。", "fun": "みんなが自分の持ち場を完璧に守っていても、持ち場と持ち場の「すき間」は誰の責任でもない――リレーのバトンパスで落とすようなものです。問題は誰かが権力を握ることではなく、誰もいないことだ、という指摘が鋭い点です。", "unverified": "実証的な検証は今後とされ、事例の詳細は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "マインドフルネスと業務量と組織支援の幸福", "title": "Exploring the Interplay of Mindfulness Workload and Organisational Support in Employee Wellbeing", "url": "https://doi.org/10.21203/rs.3.rs-11020920/v1", "authors": "Bhuvan Israni ほか", "venue": "Research Square (In Review)", "date": "2026-10-21", "apa": "Israni, B., & Israni, T. (2026). Exploring the Interplay of Mindfulness Workload and Organisational Support in Employee Wellbeing. https://doi.org/10.21203/rs.3.rs-11020920/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "職場のマインドフルネスは役に立つが、業務量や職場の風土という構造的な障壁の範囲内でしか効かないことを、面接と多変量の手法で示した研究。", "p3": "民間組織の28人への質的面接を、主題分析に加えて多重対応分析、主題ネットワークの中心性、人物中心のクラスター分析で分析した（抄録）。", "p5": "障壁と便益の比は1.11で、約40%が深刻な摩擦を経験。偏見が主要な障壁、競争的な文化が仕事の要求と対処の自律をつなぐ橋だった。64.3%が構造的に制約された多数派だった（抄録）。", "fun": "ストレスを個人の心の持ち方で何とかしようとしても、仕事量や職場の雰囲気が変わらなければ限界がある、という当たり前のようで見落とされがちな点をデータで示しています。ただし28人の面接なので、比率の数字は慎重に読む必要があります。", "unverified": "28人の質的データから比率を出した手続きの詳細は未確認。"}}, {"id": "pr36", "rank": 36, "headline": "職場のガスライティングが看護師の革新を損なう", "title": "Workplace Gaslighting and Job Crafting as Predictors of Innovative Behavior and Psychological Need Satisfaction Among Nurses: A Cross-Sectional Study", "url": "https://doi.org/10.20944/preprints202610.2032.v1", "authors": "Efthymios Fountas ほか", "venue": "Preprints.org", "date": "2026-10-21", "apa": "Fountas, E., Papathanasiou, I. V., Tsaras, K., Galanis, P., Paralikas, T., Fradelos, E. C., Katsiroumpa, A., & Moisoglou, I. (2026). Workplace Gaslighting and Job Crafting as Predictors of Innovative Behavior and Psychological Need Satisfaction Among Nurses: A Cross-Sectional Study. https://doi.org/10.20944/preprints202610.2032.v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "ギリシャの看護師595人で、ジョブ・クラフティングは革新的行動と心理的欲求の充足に結びつき、職場のガスライティングは欲求の充足を下げることを示した横断研究。", "p3": "2026年3〜6月の便宜標本で、ガスライティング、ジョブ・クラフティング、革新的行動、職場での基本的心理欲求の各尺度を使い、属性と職務特性を調整した重回帰で分析した（抄録）。", "p5": "資源や挑戦を求めるクラフティングは革新的行動・自律・有能感・関係性と正、要求を減らすクラフティングは自律・有能感と負。ガスライティングは自律・有能感・関係性と負。人手不足の部署は革新の成果と負だった（抄録）。", "fun": "ガスライティングとは、相手に「自分の記憶や判断がおかしいのでは」と思わせる心理的な操作のことです。仕事を自分で工夫して作り変える力（ジョブ・クラフティング）が、そうした悪い職場の影響と反対の方向に働くことを、同じデータで並べて見せた点が分かりやすい研究です。", "unverified": "効果の大きさ（係数）は抄録になく未確認。横断研究で因果は言えない。"}}, {"id": "pr37", "rank": 37, "headline": "合併統合の速さが社員の感情の旅を変える", "title": "The impact of speed variations on organisation members’ emotional journey during post-merger integration", "url": "https://doi.org/10.2139/ssrn.7649980", "authors": "David Kroon ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Kroon, D., Thomas, M., Durand, M., & Diduc, S. (. (2026). The impact of speed variations on organisation members’ emotional journey during post-merger integration. https://doi.org/10.2139/ssrn.7649980", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "合併後の統合では、変化の速さそのものより速さが予測できるかどうかが、社員の感情の波を左右することを示した質的研究。", "p3": "2つの高等教育機関の合併を30か月追い、53件の半構造化面接など複数の資料を、感情の評価理論に基づいて分析した（抄録）。", "p5": "速さの急な変化が時間の見通しを崩し、脅威・統制・公正の再評価を迫って感情の波を生んだ。買収側と被買収側では同じ速さの変化が逆向きの感情の軌跡を生んだ（抄録）。", "fun": "改革は急ぐべきか、ゆっくり進めるべきか――長年の議論に対し、「どちらでもよいが、急に変えるな」という答えを示しています。同じ出来事でも立場が違えば正反対の気持ちになる、というのは学校の統合や部活の方針変更などでも見られることです。", "unverified": "具体的な感情の事例と分析手続きは未確認。"}}, {"id": "pr38", "rank": 38, "headline": "PINNの拘束条件と残差の釣り合いを二層NTKで", "title": "Balancing Physical Constraints and Residual Modes: A Two-Level Neural Tangent Kernel Framework for Physics-Informed Neural Networks", "url": "https://doi.org/10.2139/ssrn.7650006", "authors": "Namkyeong Cho ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Cho, N., Ryu, J., Jung, G., & Hwang, H. J. (2026). Balancing Physical Constraints and Residual Modes: A Two-Level Neural Tangent Kernel Framework for Physics-Informed Neural Networks. https://doi.org/10.2139/ssrn.7650006", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "物理情報ニューラルネット（PINN）の学習で、支配方程式・境界条件・初期条件と残差の各モードの学習の偏りを、ニューラル・タンジェント・カーネル（NTK）の情報で2段階に釣り合わせる方法を提案した研究。", "p3": "各条件のNTKブロックのスペクトルから全体の重みを決め（GWA）、残差空間で固有値の逆数で重みづけしてモードの減衰速度をそろえ（NRSR）、2つの勾配を衝突を避ける射影で組み合わせる（抄録）。", "p5": "振動的な問題から非線形・連成系までのベンチマークで、多くの設定で予測精度が向上した（具体的数値は抄録になし）。", "fun": "PINNは物理法則を損失関数に入れて学習しますが、複数の条件のうち一部ばかり学習が進んでしまう「偏食」が起きます。どの成分がどれだけ速く学習されるかをカーネルの固有値で見て、全員が同じ速さで学ぶよう調整する、という発想です。", "unverified": "精度向上の程度と失敗した設定は未確認。"}}, {"id": "pr39", "rank": 39, "headline": "時間刻みなしで脆性から延性へ破壊経路を追う", "title": "An Intrinsic Dissipation-Driven Path-Following Framework for Adaptive Phase-Field Fracture: Time-Step-Free Continuation from Brittle Cleavage to Ductile Tearing", "url": "https://doi.org/10.2139/ssrn.7649065", "authors": "Bingquan Zuo", "venue": "SSRN", "date": "2026-10-21", "apa": "Zuo, B. (2026). An Intrinsic Dissipation-Driven Path-Following Framework for Adaptive Phase-Field Fracture: Time-Step-Free Continuation from Brittle Cleavage to Ductile Tearing. https://doi.org/10.2139/ssrn.7649065", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "位相場破壊解析で、変位の刻みではなくエネルギー散逸を制御量にして平衡経路を追うことで、脆性から延性までのき裂進展を時間刻みなしで安定に解く方法を提案した研究。", "p3": "全体の荷重係数を散逸増分と双対な未知数として扱い、適応的な階層Bスプライン（THB）で離散化した。き裂発生のしきい値を閉形式で求め、散逸の単調性を最大値原理で示し、延性破壊では塑性仕事を加えた散逸量に一般化した（抄録）。", "p5": "1〜3次元のベンチマークで検証し、PMMAの最大荷重を2.07%以内、アルミ合金の降伏・最大耐力を0.3%以内で再現した。線形ソルバの呼び出しを59.6〜62.3%、自由度を79.2%削減した（抄録）。", "fun": "物が壊れる直前と直後は、荷重が急に下がったり逆戻りしたりして計算が破綻しやすい場面です。そこで「どれだけ押したか」ではなく「どれだけエネルギーが失われたか」を物差しにすると、壊れる過程を一本道としてたどれる、という発想の転換が鍵です。", "unverified": "実験データの出典と比較条件の詳細は未確認。"}}, {"id": "pr40", "rank": 40, "headline": "雨と土壌水分で斜面崩壊の危険度を年ごとに更新", "title": "Year-Wise Refitted Spatiotemporal Landslide Susceptibility Forecasting Driven by IMD Rainfall and SMAP Soil Moisture, Wayanad, India", "url": "https://doi.org/10.31223/x5v52n", "authors": "Swati Swati ほか", "venue": "EarthArXiv", "date": "2026-10-21", "apa": "Swati, S., & Saride, S. (2026). Year-Wise Refitted Spatiotemporal Landslide Susceptibility Forecasting Driven by IMD Rainfall and SMAP Soil Moisture, Wayanad, India. https://doi.org/10.31223/x5v52n", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EarthArXivの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "インドのワヤナードで、毎年過去の事例だけで学習し直す斜面崩壊の危険度予測を作り、従来の無作為な検証が性能を楽観的に見せていたことを示した研究。", "p3": "2020〜2024年の各対象年について、それ以前の事例だけでランダムフォレストを学習し、日雨量と衛星の土壌水分などで動的な危険度を出した。Bi-LSTMで誘因を予報し2025・2026年の地図も作った（抄録）。", "p5": "従来の無作為検証のAUCは平均0.913だが、対象年を伏せるとAUCは0.871で、毎年低かった（符号検定p=0.031）。その後報告された2件の崩壊はどちらも「高」区域に入った（抄録）。", "fun": "未来を予測するテストなのに、未来のデータを混ぜて学習していたら成績が良く見えるのは当然です。この「答えを見ながらの試験」を避けると性能が下がることを正直に示し、本当に先を読む予測に作り直した点が面白いところです。", "unverified": "使った静的要因と地図の解像度は未確認。"}}, {"id": "pr41", "rank": 41, "headline": "山火事後の土石流を招く豪雨をどこまで予報できるか", "title": "Mesoscale Model Forecast Skill for Hourly Rainfall During Postfire Flood and Debris-Flow Events in California", "url": "https://doi.org/10.21203/rs.3.rs-11296532/v1", "authors": "Nina Oakley ほか", "venue": "Research Square (In Review)", "date": "2026-10-21", "apa": "Oakley, N., McGuire, L. A., & Nash, D. (2026). Mesoscale Model Forecast Skill for Hourly Rainfall During Postfire Flood and Debris-Flow Events in California. https://doi.org/10.21203/rs.3.rs-11296532/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "山火事の跡地で土石流を引き起こす短時間の強雨を、気象モデルがどこまで予報できるかを実際の10事例で評価した研究。", "p3": "カリフォルニアの寒候期の10事例について、2つのメソ気象モデル（WestWRF、HRRR）の時間雨量予報を、各焼失地内外の3か所以上の雨量計と、複数の空間・時間の範囲で比べた（抄録）。", "p5": "9km・5時間の範囲では、24時間前までなら時間雨量10mm超を高い確率で検出できた。ただし強さは過小で、24時間以内の誤差の中央値は6〜16%、20mm/h超の強雨で誤差が最大だった（抄録）。", "fun": "山火事で植物が焼けた斜面は、短時間の大雨で一気に土砂が流れ出します。「雨が降るか」は当てられても「どれだけ強いか」はまだ苦手という結果は、警報を出す側が予報の弱点を知って使う必要があることを示しています。", "unverified": "モデル間の差の詳細は未確認。"}}, {"id": "pr42", "rank": 42, "headline": "河川合流部の極端流量を確率的に予測する", "title": "A general probabilistic framework for prediction of extreme flow events at river confluences", "url": "https://doi.org/10.5194/egusphere-2026-5737", "authors": "Faidon Diakomopoulos ほか", "venue": "EGUsphere", "date": "2026-10-21", "apa": "Diakomopoulos, F., Ragno, E., Stancanelli, L. M., & Harchowitz, M. (2026). A general probabilistic framework for prediction of extreme flow events at river confluences. https://doi.org/10.5194/egusphere-2026-5737", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EGUsphereの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "2本の川が合流する地点で、上流の流量の組み合わせから下流の極端な流量をコピュラで確率的に予測し、危険な組み合わせを特定する枠組みを示した研究。", "p3": "両支流と下流の3地点で極端事象時の同時流量を不確実性つきで記述し、コピュラ・モデルで下流流量を予測し、安全しきい値を超える上流の組み合わせを求めた。ライン川の2合流点とミシシッピ・ミズーリ合流点に適用した（抄録）。", "p5": "合流点ごとに仕組みが異なり、規模が同程度の支流では中程度のピークの同時発生が下流の極端流量の主因だった。下流流量の再現はすべての事例でNSE>0.97だった（抄録）。", "fun": "大きな洪水は、片方の川がすごく増水したときだけでなく、両方が「そこそこ」増水したのが重なったときにも起きうる、という点が意外なところです。2つの量が同時にどう動くかを表すコピュラという道具が、その重なりの確率を計算する鍵になっています。", "unverified": "EGUsphereは討論段階の査読中原稿で、確定版ではない可能性。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "Transformerは2種類の並べ替えを学び片方だけ汎化", "title": "Transformers Learn Two Competing Sorting Algorithms, and Only One Length-Generalizes", "url": "https://arxiv.org/abs/2610.26974", "authors": "Khashayar Gatmiry ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Gatmiry, K., Henry, N. W., Su, C. H., Abbe, E., Bengio, S., Weber, M., Kelner, J. A., & Bartlett, P. L. (2026). Transformers Learn Two Competing Sorting Algorithms, and Only One Length-Generalizes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.26974", "why": "同じ損失まで学習しても初期値次第で機構の異なる2つの解に分かれ、2層目の注意を使う解だけが長さ汎化することを示した、機構解釈の明快な結果。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（設定2章、解の2類型3〜4章、初期化による誘導5章、他課題6章、結論）と図表キャプションを読んだ。付録は見出しのみ", "preprint": true, "p1": "並べ替えを学んだ2層Transformerは、初期値しだいで仕組みの違う2つの解に分かれ、2層目の注意を使う解だけが訓練より長い列に汎化すること、そして初期化の尺度で望む解に誘導できることを示した（抄録、§3、§5）。", "p2": "同じ損失まで学習したモデルが同じアルゴリズムを学ぶとは限らず、長さ汎化の成否がどこから来るかは機構レベルで分かっていなかった（§1）。", "p3": "語彙{1..N}から重複なく選んだ長さKの整数列を昇順に出力する課題で、位置埋め込みなし・各層1ヘッドの2層Transformerを長さ16で学習した（§2）。2層目の注意を取り除く実験で、精度が保たれる「1段解」と0近くに落ちる「2段解」を区別し、注意の強制書き換え（hijack）で層の役割を因果的に調べた（§3〜4）。背景：位置埋め込みがないことは長さ汎化の必要条件。", "p4": "長さ2からNまでの精度で長さ汎化を評価し、初期化の層間の尺度差Δ（各条件100シード）、語彙サイズ、埋め込み次元を変えた。最小値探索と貪欲な硬貨分解でも同様の現象を調べた（§5〜6）。", "p5": "2段解では、間隔の小さい（訓練長では稀だが長い列でありふれる）トークンを1層目が、大きい間隔を2層目が担う分業があり、1層目が次の値の上限を「ヒント」として渡して2層目の探索範囲を狭める（2層目の正答注意は約99.5%、1層目は約86%）（§4、図2）。対称な初期化では2段解は26%だが、2層目の尺度を0.013にすると100%、1層目を0.012にすると0%になった（§5.1、図6）。最小値探索では逆に2段解の方が汎化が悪かった（§6）。", "p6": "各層1ヘッドの小さな模型と人工的な課題での結果で、大規模モデルへの一般化は未確認。1段解・2段解の内部にも多様な解があると著者は述べる（§4.1）。", "fun": "同じ問題を同じ点数で解けるようになった2人の生徒が、実はまったく違う解き方をしていて、問題が長くなると片方だけが解ける――そんな状況がAIの中で起きていることを、中身を分解して示しました。どちらの解き方になるかが最初の「重みの大きさ」で決まり、それを操作できるのも面白い点です。", "unverified": "付録の4層・多ヘッドでの結果は未読。"}}, {"id": "pn02", "rank": 2, "field": "因果推論", "headline": "処置効果の分布を共変量調整で予測し推論する", "title": "Predicting the Distribution of Treatment Effects: A Covariate-Adjustment Approach", "url": "https://doi.org/10.2139/ssrn.7649593", "authors": "Bruno Fava", "venue": "SSRN", "date": "2026-10-21", "apa": "Fava, B. (2026). Predicting the Distribution of Treatment Effects: A Covariate-Adjustment Approach. https://doi.org/10.2139/ssrn.7649593", "why": "個人の反実仮想が観測できない中で、予測した反実仮想を使って処置効果の分布の各点について有限標本で妥当な推論を与える方法を提案した。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を使用。本文は入手できず", "preprint": true, "p1": "平均だけでなく処置効果の分布の各点（たとえば「得をした人の割合」）について、共変量調整で予測した反実仮想を使い、有限標本で妥当な推論を与える方法を提案した（抄録）。", "p2": "個人ごとの反実仮想（処置を受けなかった場合の結果）は観測できないため、処置効果の分布は識別が難しく、平均効果ゼロの政策の中で得をした人と損をした人を区別できなかった（抄録）。背景：周辺分布だけでは効果の分布は一般に識別されない。", "p3": "共変量から各人の反実仮想を予測し、その予測で処置効果の分布の点を推定する。標本分割で有限標本の妥当な推論、交差適合（cross-fitting）で弱い条件の下での漸近的に妥当な推論を与える（抄録）。", "p4": "平均効果がゼロと報告されたマイクロクレジットの無作為化比較試験5件を再分析した（抄録）。", "p5": "平均効果はゼロでも、融資へのアクセスで助けられた人と害を受けた人がいるという重要な分布上の影響が見つかった（抄録）。具体的な割合は抄録になく未確認。", "p6": "予測の精度（共変量がどれだけ反実仮想を説明できるか）に推論の強さが依存すると考えられる。解釈：共変量で説明できない個人差は捉えきれない可能性がある。条件の詳細は未確認。", "fun": "「平均すると効果なし」という政策でも、実は得をした人と損をした人が打ち消し合っているだけかもしれません。一人ひとりの「もしも」は見えないのに、その分布に迫ろうという難問に、予測を使って答えを出そうとした点が面白いところです。", "unverified": "本文未読のため、手法の仮定と再分析の数値はすべて未確認。"}}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "キャリア初期の自動化は若者の雇用を安定させた", "title": "The Impact of Automation on Youth Employment Trajectories", "url": "https://doi.org/10.2139/ssrn.7635483", "authors": "Michele Battisti ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Battisti, M., Brunetti, I., Gravina, A. F., & Donni, P. L. (2026). The Impact of Automation on Youth Employment Trajectories. https://doi.org/10.2139/ssrn.7635483", "why": "イタリアの全企業規模をカバーする労使接合データで、複数の自動化技術への初期曝露が若年労働者の雇用の安定性に与える影響を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を使用。本文は入手できず", "preprint": true, "p1": "イタリアの労使接合データで、キャリア初期に自動化技術にさらされた若者ほど雇用が安定していた（8〜10ポイント）ことと、その恩恵が一部の層に偏ることを示した（抄録）。", "p2": "自動化が若年労働者のキャリアの始まりにどう影響するかは、解雇規制の強い労働市場では特に分かっていなかった（抄録）。", "p3": "農業以外の全企業規模をカバーする労使接合データで、複数の自動化技術への曝露と若年労働者の雇用の軌跡の関係を推定し、コロナ禍の解雇凍結の解除の前後を補完的な分析に使った（抄録）。", "p4": "評価指標は雇用の安定性（継続の確率）。解雇凍結の解除で企業が離職の手段を取り戻した後の差の広がりを、制度的な検証として見た（抄録）。", "p5": "自動化への曝露は8〜10ポイント高い雇用の安定と関連した。解雇凍結の解除後に差はより明確になった。恩恵は正社員、雇用保護の閾値を超える規模の企業の労働者、大卒、技術先進部門で系統的に大きかった（抄録）。", "p6": "曝露は企業・職種の選択と相関しうるため、因果の解釈には限界がある（抄録は「関連」と表現）。解釈：同世代内の格差の拡大という含意は、分配面の追加分析に依存する。", "fun": "「ロボットに仕事を奪われる」という心配とは逆に、自動化が進んだ職場で働き始めた若者ほど雇用が安定していた、という結果です。ただし得をしたのは正社員や大卒などに偏っていて、同じ世代の中で差が広がる――技術の影響は平均だけでは語れません。", "unverified": "本文未読のため、自動化の測り方と識別戦略は未確認。"}}, {"id": "pn04", "rank": 4, "field": "統計学", "headline": "多クラス分類のスコア関数の最適な集約", "title": "Optimal aggregation in multiclass classification", "url": "https://arxiv.org/abs/2610.28025", "authors": "Felix Abramovich ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Abramovich, F., & Davidovitch-Servadio, O. (2026). Optimal aggregation in multiclass classification (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28025", "why": "二値分類で知られる集約（aggregation）の理論を多クラス分類に一般化し、オラクルに近いリスクを達成する集約の方法と限界を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、記法、モデル選択集約3章の定理1・2の周辺、凸集約4章・確率空間での集約5章の冒頭）を読んだ。証明と付録は未読", "preprint": true, "p1": "有限個のスコア関数を組み合わせて最良の組み合わせ（オラクル）に近い分類器を作る「集約（aggregation）」の理論を、二値分類から多クラス分類に一般化し、クラス数Kに依存しない最適な収束率を達成する方法を示した（抄録、§1）。", "p2": "集約の最適率の理論は回帰や二値分類で整っていたが、多クラス分類では知られていなかった（§1）。背景：集約は、複数の予測器から一つを選ぶ（モデル選択）か凸結合を作る（凸集約）問題。", "p3": "0/1損失と多項ロジスティック損失の下で、モデル選択と凸集約の上界と下界を導いた。ロジスティック損失では、元のスコア関数の凸包の中にとどまる「適正な」集約に限界があることを示し、スコア関数ではなく各関数が導くクラス確率を平均してからスコア空間に戻す「確率混合」集約を提案した（抄録、§3〜4）。", "p4": "理論論文で、評価は過剰リスク（オラクルとのリスクの差）の上界と下界（ミニマックスの意味の率）である（§1〜2）。", "p5": "0/1損失では、モデル選択の最適率は√(ln M/n)でKに依存せず、経験リスク最小化（ERM）が率最適。凸集約でもERMは√(ln K)倍を除いて最適（抄録、§3）。ロジスティック損失では下界はKに依存しないが、凸包内の適正な集約はある領域でKとともに率が悪化する。確率混合のCAEW集約はモデル選択で最適率ln(M)/nをKに依存せず達成した（§1、§3）。", "p6": "純粋に理論的で、数値実験や実データでの比較は本文で確認できなかった。凸集約での「ほぼ最適」は対数因子を含む（抄録）。", "fun": "何人かの専門家の意見を混ぜて判断するとき、「意見の点数」をそのまま平均するより、「各専門家が言う確率」を平均した方がクラスの数が増えても失敗しにくい――混ぜる場所を変えるだけで理論上の限界を突破できる、という点が面白いところです。", "unverified": "定理の正確な条件と確率空間の枠組み（§5）の結論は未確認。"}}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "浅いネットで拡散モデルのスコアを学ぶ標本数", "title": "Diffusion Score Estimation with Shallow Neural Networks: Regularity, Approximation, and Finite-Sample Rates", "url": "https://arxiv.org/abs/2610.27206", "authors": "Fan Liu ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Liu, F., Yang, Y., & Zhu, W. (2026). Diffusion Score Estimation with Shallow Neural Networks: Regularity, Approximation, and Finite-Sample Rates (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27206", "why": "拡散モデルのスコア推定に必要な標本数を、有限幅の浅いReLUネットについて正則性・近似・有限標本の誤差率で理論的に示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論と主結果1.1節、問題設定2章の冒頭、結論）を読んだ。証明の3〜7章は節の見出しと要約のみ", "preprint": true, "p1": "拡散モデルの核であるスコア（対数密度の勾配）を、有限幅の浅いReLUネットで雑音除去スコアマッチング（DSM）により推定するときの標本数と誤差の関係を明示し、生成分布の誤差率まで結びつけた理論研究（抄録、§8）。", "p2": "生成の精度はスコアをどれだけ正確に学べるかに依存するが、浅いネットでの有限標本の誤差率を、拡散時間やデータ分布の性質への依存を明示して与えた結果は乏しかった（§1）。", "p3": "オルンシュタイン・ウーレンベック拡散のスコアについて、ガウス遷移核の微分から得る上界（任意の初期分布で有効だがt→0で悪化）と、初期密度の弱微分から得る上界を組み合わせ、各球上で時間に一様なソボレフ・ノルムの上界を作った。これを浅いネットの近似理論に入れ、打ち切りと局所化ラデマッハ複雑度で、入力とラベルが非有界なときの高確率リスク上界を導いた（抄録、§1.1）。背景：DSMの過剰損失はスコア推定の二乗誤差に等しい（§1、ツイーディーの恒等式）。", "p4": "理論論文で、評価は各時刻tでの二乗L²スコア・リスクと、逆過程で生成した分布と元の分布の全変動距離の上界（抄録）。", "p5": "有界密度・サブガウスの仮定の下で、ネット幅とパス・ノルムを適切に選ぶと、各t>0で二乗スコア・リスクはÕ(n^{-(d+3)/(2d+3)})、時間格子での誤差の集約と早期停止で、全変動誤差はÕ(n^{-(d+3)/(4d+6)})となった（抄録、§8）。", "p6": "率は次元dが固定のときの結果で、対数因子を省いている（抄録）。経験リスク最小化の解を仮定し、実際の最適化（勾配法）で到達できるかは扱っていない。数値実験は本文で確認できなかった。", "fun": "画像生成AIは「ノイズを少しずつ取り除く方向」を学んでいますが、その方向を学ぶのに何枚の訓練画像が要るのかは、理論的にはまだ謎が多い問題です。単純な1層のネットでも、データの量と生成の質の関係を式で示せた、という点がこの研究の価値です。", "unverified": "証明（3〜7章）の詳細と定数の依存は未確認。"}}, {"id": "pn06", "rank": 6, "field": "組織行動・心理的安全性", "headline": "創業家CEOから交代する前にESG不祥事が増える", "title": "ESG Risk Under Family Leadership: A Study of Japanese Firms with Family CEOs", "url": "https://doi.org/10.2139/ssrn.7648917", "authors": "Tsuyoshi Iwata ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Iwata, T., & Yamada, T. (2026). ESG Risk Under Family Leadership: A Study of Japanese Firms with Family CEOs. https://doi.org/10.2139/ssrn.7648917", "why": "日本の上場企業のCEO交代データとESG事件データで、創業家出身かどうかとESG不祥事リスクの関係をイベントスタディとパネルで分析した。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を使用。本文は入手できず", "preprint": true, "p1": "日本の上場企業のCEO交代データとRepRiskのESG事件データ（2011〜2024年）で、創業家以外のCEOへの交代がESG不祥事の減少と結びつくが、その差の多くはCEOの属性で説明されることを示した（抄録）。", "p2": "CEOが創業家の出身かどうかがESG関連の不祥事リスクにどう影響するかは、日本企業では十分に調べられていなかった（抄録）。", "p3": "独自に集めたCEO交代のデータとESG事件のデータを結び、交代の前後のイベントスタディとパネル回帰で分析し、年齢・出身大学の順位・エリート人脈などのCEO属性を加えた（抄録）。", "p4": "評価指標はESG関連事件の発生。2018年の日本のSDGs推進の前後も比べた（抄録）。", "p5": "ESG事件は交代の前、特に創業家以外への交代の前に増えた。創業家以外のCEOの任命は交代後の事件を有意に減らし、2018年以降で特に強かった。しかしCEO属性を考慮すると創業家かどうかの効果は大きく弱まった（抄録）。", "p6": "交代の前に事件が増えることは、事件が交代を招く逆の因果を示唆し、交代の効果の識別に注意が要る。解釈：「学歴の高さを優先すべき」という著者の提言は属性の効果の因果解釈に依存する。", "fun": "不祥事が増えると社長が替わり、替わった後に不祥事が減る――一見「創業家でない社長は良い」と言えそうですが、社長の経歴まで比べると差の多くが消える、という結果です。何が本当の原因かを見分ける難しさがよく分かる例です。", "unverified": "本文未読のため、標本の企業数と係数の大きさは未確認。"}}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "ドル固定のサウジで米利上げが家計消費を動かす", "title": "US Monetary Shocks, Bank Deposit Reallocation and Card Payments: Evidence from Saudi Arabia’s Dollar Peg", "url": "https://doi.org/10.2139/ssrn.7642960", "authors": "Muteb Ahmed Almihbash", "venue": "SSRN", "date": "2026-10-20", "apa": "Almihbash, M. A. (2026). US Monetary Shocks, Bank Deposit Reallocation and Card Payments: Evidence from Saudi Arabia’s Dollar Peg. https://doi.org/10.2139/ssrn.7642960", "why": "ドル・ペッグで金利が実質的にFRBに決まる性質を識別に使い、輸入された金融政策が家計の支出・預金・信用に与える影響を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を使用。本文は入手できず", "preprint": true, "p1": "ドルに固定されたサウジアラビアで、米国の利上げがほぼそのまま国内金利に伝わっても家計のカード支出は検出できるほど減らず、預金の構成が変わるだけだったことを示した（抄録）。", "p2": "固定相場で金融政策を輸入する国で、利上げが家計の支出・預金・信用にどう効くかは分かっていなかった（抄録）。背景：国際金融のトリレンマ（固定相場・資本移動・独立した金融政策は同時に成り立たない）を識別に使う。", "p3": "2007〜2026年の月次の店頭決済（POS）と金融統計を、情報効果を除いた米国の高頻度の金融政策ショックと結び、局所射影、弱い操作変数に頑健な推論のLP-IV、状態依存の反応を推定した（抄録）。", "p4": "評価は25bpの累積的なサウジ銀行間金利（SAIBOR）上昇に対する12か月後のPOS支出と預金の反応（抄録）。", "p5": "米国のショックは銀行間金利にほぼ1対1で伝わった。POS支出の反応は−0.34%（90%のアンダーソン・ルービン集合−1.55〜0.65%）で検出できず、要求払い預金は1.04%減、定期・貯蓄預金は1.51%増え、広義の通貨や銀行貸出は減らなかった（抄録）。", "p6": "豊かな財政余力をもつ固定相場国という特殊な条件での結果で、一般化には限界がある。中央銀行の情報ショックや原油価格の統制は加えたとされるが、詳細は未確認。", "fun": "自国の金利がアメリカの都合で上がっても、サウジの人々の買い物は減らず、普通預金から定期預金へお金を移しただけ――金利の変化が「使う量」ではなく「お金の置き場所」を変える、という結果です。固定相場という仕組みを自然の実験に使った点が巧みです。", "unverified": "本文未読のため、推定の頑健性の詳細は未確認。"}}, {"id": "pn08", "rank": 8, "field": "機械学習", "headline": "弱いモデルを使って強い拡散モデルを鍛える", "title": "SWIFT: Self-guided Weak-to-strong dIFfusion models via Target extrapolation", "url": "https://arxiv.org/abs/2610.25844", "authors": "Yanjin He ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-21", "apa": "He, Y., Shen, C., Lei, W., Li, M., Lan, T., Liu, K., Tang, H., & Qu, Q. (2026). SWIFT: Self-guided Weak-to-strong dIFfusion models via Target extrapolation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.25844", "why": "凍結した弱い復元器の予測から目標を外挿する自己誘導学習で、推論コストを増やさずに拡散モデルの品質を上げる簡潔な方法。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法2章、なぜ効くか4章の概要、実験5章の主結果・学習コスト・α選択、結論）と表1を読んだ。証明と付録の全結果表は未読", "preprint": true, "p1": "弱い（早期の、または小さな）雑音除去モデルの予測から遠ざかる方向に学習の目標を外挿するだけで、推論コストを増やさずに拡散モデルの品質を上げる学習法（Swift）を提案した（抄録、§2.2）。", "p2": "拡散モデルの学習は高価で、推論時のガイダンス（autoguidanceなど）は生成のたびに追加計算がかかる（§1）。", "p3": "通常は綺麗な画像x₀に回帰するところを、凍結した弱い復元器の予測D_weakからの差を使って目標をy_α=x₀+α(x₀−D_weak)に置き換える（式5）。弱いモデルがまだ外している成分を強調する直観で、αは外挿の強さ。弱いモデルは学習後に捨て、標本器は元のまま使う。RKHSでの有限時間の勾配流のスペクトル解析で、ある範囲のαで通常学習より事後平均の誤差が厳密に小さくなることを証明した（§2.2、§4）。", "p4": "ImageNet-256の19構成（DiffusionBench型）とCIFAR-10で、構造・学習スケジュール・標本器を同じにして目標だけを変え、FID、sFID、適合率・再現率、表現空間のFDr、MINDで比べた（§5）。", "p5": "RAE/DINOv2-BでガイダンスなしのFIDが2.09→1.75、RAEv2では1.56→1.15（表1）。18構成のすべてでFIDが16.3〜49.4%（中央値31.3%）下がった（§5.1）。追加コストはエポックあたり9%のFLOPsと弱いモデルの事前学習で、それを含めてもベースラインの最良FIDを約0.45倍の計算量で上回った（§5.3、図5）。αの効果はU字型で、CIFAR-10では0.7〜0.9付近が良かった（§5.4、図6）。", "p6": "理論の保証は早期停止した弱いガイドと単純化した設定での結果で、実際の深層ネットにそのまま当てはまるかは未確認。αと弱いガイドの選び方に依存する（§5.4）。", "fun": "上手な生徒を伸ばすのに、少し下手な生徒の答えを見せて「その間違いとは逆の方向にもっと寄せなさい」と教える――そんな発想の学習法です。正解からわざとずらした目標を与えるのに、結果的に正解により近づくという逆説が面白いところです。", "unverified": "付録の完全な結果表とCIFAR-10の数値は未確認。"}}, {"id": "pn09", "rank": 9, "field": "統計学", "headline": "交互固定効果パネルの不変尤度で付随母数を消す", "title": "Invariant likelihood for non-Gaussian panels with interactive fixed effects", "url": "https://doi.org/10.2139/ssrn.7649594", "authors": "Xibin Zhang", "venue": "SSRN", "date": "2026-10-21", "apa": "Zhang, X. (2026). Invariant likelihood for non-Gaussian panels with interactive fixed effects. https://doi.org/10.2139/ssrn.7649594", "why": "非ガウス誤差の交互固定効果モデルで、多数の因子負荷をハール積分で厳密に消去する不変尤度を作り、推定と推論を整えた。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を使用。本文は入手できず", "preprint": true, "p1": "非ガウス誤差の交互固定効果パネルで、多数の因子負荷（付随母数）をハール積分で厳密に消去する「不変尤度」を作り、期間を固定して主体数を増やす漸近の下で推定と推論を整えた（抄録）。", "p2": "交互固定効果モデルは共通ショックへの異なる反応を捉えるが、非ガウス誤差の尤度推定では主体ごとの因子負荷という付随母数が多数あり、同時最尤では真の因子空間が回復されないことがある（抄録）。", "p3": "ハール積分で因子負荷を消し、残差の対比についての正しい密度を得て、構造・分布のパラメータの不偏なスコアを導いた。不変な構造スコアと平均補正したスペクトル方程式を組み合わせ、パラメータと因子空間を同時に推定する（抄録）。", "p4": "正規-半正規の反例で同時最尤の失敗を示し、モンテカルロで精度を確かめ、米国の発電所データ（確率的フロンティア・モデル）に適用した（抄録）。", "p5": "識別・因子の強さなどの条件の下で、推定量は主体数の平方根の速さで一致かつ漸近正規。残るバイアスの2次展開とジャックナイフ補正の条件を示した。発電データでは燃料の係数は安定したが、非効率の推定は因子の数と影響力の大きい発電所に敏感だった（抄録）。", "p6": "因子の数（ランク）を既知とする前提がある。実証では非効率の推定が因子の数に敏感で、実務での選び方が課題として残る（抄録）。", "fun": "たくさんの会社に共通の景気の波があり、その受け方が会社ごとに違う――このとき会社ごとの「受け方」の数だけ未知数が増えて、普通の推定が狂ってしまいます。それを積分で丸ごと消してしまう、という数学的な工夫が見どころです。", "unverified": "本文未読のため、仮定と定理の正確な形は未確認。"}}, {"id": "pn10", "rank": 10, "field": "開発経済学", "headline": "地下水節約の報酬に配水の公平を条件づける実験", "title": "Groundwater Conservation without Exclusion?,A Cluster-Randomized Trial of Access-Conditioned Provider Incentives in Bangladesh", "url": "https://doi.org/10.2139/ssrn.7641831", "authors": "Md. Sakib Zubayer ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Zubayer, Md. S., Ferdous, L., Rahman, Md. J., Mridul, Md. A. R., Hasan, Md. M., & Al Amin, Md. A. (2026). Groundwater Conservation without Exclusion?,A Cluster-Randomized Trial of Access-Conditioned Provider Incentives in Bangladesh. https://doi.org/10.2139/ssrn.7641831", "why": "バングラデシュの75の深井戸区域でクラスター無作為化実験を行い、節水の支払いにサービス保護条件を付けることで排除の副作用を防げるかを検証した。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を使用。本文は入手できず", "preprint": true, "p1": "バングラデシュの75の深井戸区域でクラスター無作為化試験を行い、灌漑業者への節水報酬は地下水の汲み上げを11.5%減らしたが、配水の公平を条件にした契約では効果が小さく不確かだったことを示した（抄録）。", "p2": "節水政策が農家でなく灌漑業者を対象にすると、業者が誰にいつ水を配るかも握るため、節水と配水の公平が両立するか分かっていなかった（抄録）。", "p3": "25の組（3区域ずつ）の中で、現行通り、検証済みの節水への支払い、同じ支払いに顧客の維持・要求の充足・待ち時間・料金順守・監査可能な記録の条件を付けた契約の3群に無作為に割り付けた（抄録）。", "p4": "プリペイド式メーターの取引、要求の台帳、現地監査、600人の農家調査で、汲み上げ量と配水の指標を測り、多重検定はロマノ・ウルフ法で調整した（抄録）。", "p5": "条件なしの支払いは1ポンプあたり季節の汲み上げを3万6,800m³（対照平均の11.5%、95%CI −5万9,200〜−1万4,500、調整p=0.018）減らした。条件付きは−1万8,600m³（95%CI −4万700〜3,400、調整p=0.118）で不確か。両方とも要求1件あたりの配水量を減らし、農家の利益や食料アクセスに明確な改善はなかった。条件の全項目を満たした業者は25人中10人（抄録）。", "p6": "1季節の評価で、地下水位の長期的な変化は見られない。条件付き契約は検証と紛争処理に手間がかかり、保護の価値は行政が安く検証できるかに依存する（抄録）。", "fun": "水を節約した業者にお金を払えば汲み上げは減る――ところが、その業者が水を配る係でもあると、困るのは農家かもしれません。節約量だけを成果の物差しにすると見落とすものがある、という教訓を、本物の実験で示した点に価値があります。", "unverified": "本文未読のため、配水の公平の指標の詳細は未確認。"}}, {"id": "pn11", "rank": 11, "field": "機械学習", "headline": "言語で行動を指示する潜在世界モデルを拡大", "title": "LaLa-World: Scaling Latent World Models with Natural Language Actions", "url": "https://arxiv.org/abs/2610.27851", "authors": "Junha Song ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Song, J., Gu, G., Park, J., Nam, H., Maes, L., Heo, B., Han, D., & Yun, S. (2026). LaLa-World: Scaling Latent World Models with Natural Language Actions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27851", "why": "JEPA型の潜在世界モデルに動画生成モデルの言語条件の接口を採り入れ、多様な領域とデータ源から学べる計画の基盤を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法3章、MPC計画4章の設定と結果）を読んだ。方策学習5章と付録は抄録と見出しのみ", "preprint": true, "p1": "数値の行動も画像の変化もすべて言葉で記述して、異なる領域・データ源を一つの潜在世界モデル（JEPA型）で学習できるようにし、計画性能と学習・計画の効率を高めた（抄録、§3〜4）。", "p2": "潜在世界モデルは領域ごとに行動空間が違うため別々に学習され、行動ラベルのない画像・動画データも使えなかった（§1〜2）。", "p3": "7つのシミュレーション・ロボットのデータの数値行動を、向きと大きさを残した定型文に変換し、行動ラベルのない動画のキャプションや画像編集の指示も条件として使う。凍結した視覚エンコーダ（DINOv2/v3）の潜在表現の次の状態を、言語モデルを土台にした予測器が言語条件から予測する（§3.1〜3.2、図3）。", "p4": "初期観測と目標観測が与えられ、候補の行動列を言葉にして予測器で想像した最終状態と目標の距離（式2）が最小の列をクロスエントロピー法で選ぶモデル予測制御（MPC）で評価。DINO-WM、JEPA-WMs、DreamerV3などを同じデータ・設定で比べ、学習に含まないRoboCasaでゼロショット転移を見た（§4）。", "p5": "5つのシミュレーション課題の平均成功率は72.1%で、JEPA-WMsを7.5ポイント上回り、Push-Tでは
