<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">

<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>

<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>

    </div>

    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>

    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

変えてもLLMの行動バイアスは残る", "title": "Does Deliberation Debias? Exogenous Reasoning Effort and Behavioural Finance Bias in Large Language Model Portfolio Advisors", "url": "https://doi.org/10.2139/ssrn.7691604", "authors": "Vinay Batra", "venue": "SSRN", "date": "2026-11-17", "apa": "Batra, V. (2026). Does Deliberation Debias? Exogenous Reasoning Effort and Behavioural Finance Bias in Large Language Model Portfolio Advisors. https://doi.org/10.2139/ssrn.7691604", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "LLMの投資助言で、推論の予算をAPIで外から3段階に変えると、9種類の無関係な手がかりによるバイアスの大きさのばらつきは縮むが、平均はほぼ変わらないことを示した（抄録）。未査読。", "p3": "推論の予算をモデルが項目を見る前に設定し、手がかりだけが異なる対の項目で3つのモデルの9,720の回答を集め、第2波で再測定した（抄録）。", "p5": "処分効果は人と逆向きで、利益より損失で売りやすかった（カテゴリ尺度で+0.239）。推論努力は確認的な9事例すべてで絶対効果を下げた（ラベルを入れ替えた帰無で0.0125）。出力トークン数で観察的に測ると、推論が多いほどバイアスが大きく見えた（抄録）。", "fun": "人は値上がりした株を早く売り、値下がりした株を持ち続けがちだ（処分効果）。AIに投資の相談をすると、この癖が逆向きに現れたという。さらに「よく考えさせる」量を外から決めて比べると、癖の平均は減らず、癖の強さのばらつきが縮んだ。考える量をAIの自己申告ではなく外から操作するという実験の作り方が要になっている。", "unverified": "3つのモデルの名前と、バイアスの各系統の詳細は抄録からは確認できない。"}}, {"id": "pr18", "rank": 18, "headline": "介護の質問への答え方が仲間・医師・LLMで異なる", "title": "One Question, Four Voices: How Advice for Alzheimer's Caregiving Differs Between Caregivers, Clinicians, and Large Language Models", "url": "https://arxiv.org/abs/2611.18604", "authors": "Congning Ni ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Ni, C., Park, J. K., Li, Y., Qadir, S., Huang, S. S., Powers, J. S., Hiner, J. A., Leung, V., Commiskey, P., Song, L., Chen, Q., Wisniewski, P. J., Malin, B. A., & Yin, Z. (2026). One Question, Four Voices: How Advice for Alzheimer's Caregiving Differs Between Caregivers, Clinicians, and Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18604", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "認知症の介護者の質問85件への答えを、仲間の介護者・医師・ChatGPT・RAGのCareGPTで比べ、LLMは丁寧で情報は多いが語りや文脈に乏しいことを示した（抄録）。未査読。", "p3": "ALZConnectedの実際の質問に4群が答えた内容を、言語形式・情緒的支援・情報的支援・話題の範囲の28の指標とトピックモデルで比べた（抄録）。", "p5": "LLMは丁寧さと情緒的支援の指標で仲間を上回り、情報量は医師並みだったが、物語性と文脈性が低かった。CareGPTはChatGPTとほとんど区別できず、仲間は感情の整理や法律・お金の問題まで幅広く扱った（抄録）。", "fun": "同じ介護の悩みに、経験者・医師・AIが答えると何が違うのか。AIは礼儀正しく情報も多いが、「うちもそうだった」という経験の語りがない。仲間の答えはお金や法律、気持ちの整理まで広がっていた。掲示板の会話を検索して渡してもAIの口調は変わらなかったという点も、AIの答え方の癖を示していて興味深い。", "unverified": "28の指標の個別の数値と統計的な検定の詳細は抄録からは確認できない。"}}, {"id": "pr19", "rank": 19, "headline": "LLMエージェント市場の能力を2段階で評価", "title": "Macro Control and Capability Evaluation of Black-Box World Models: A Two-Regime Framework for LLM-Agent Markets", "url": "https://arxiv.org/abs/2611.19311", "authors": "Zhiyang Niu ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Niu, Z., Li, C., Shen, H., Zhao, M., & Zhang, J. (2026). Macro Control and Capability Evaluation of Black-Box World Models: A Two-Regime Framework for LLM-Agent Markets (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19311", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "LLMエージェントが売買する市場を「世界モデル」とみなし、マクロの入出力だけから能力を情報の模擬とマクロの創発の2段階に分けて評価する枠組みを示した（抄録）。未査読。", "p3": "個々の注文や約定には手を触れず、目標となる価格の参照経路を毎日公表する「緩いマクロ制御」を導入し、参照のみの条件と外部情報を注入する条件で、実現度R・構造的偏りB・真と反転の差Δを測った（抄録）。", "p5": "5つの単一指数の市場で、参照経路の公表は実現の経路を目標側に動かし、追跡の得点は参照なしよりニュースなしで0.306と0.415高かった。構造的偏りは株と現金70/30で最小（B=0.042）、実現はテクニカル3割で最大（R=0.894）だった（抄録）。", "fun": "AIの投資家をたくさん集めて市場を作ると、その市場は本物の経済のまねになるのか。中をのぞかずに外から確かめるため、「明日の目標値」を毎日発表するだけで市場がそちらへ動くかを見る。目標を逆さにした場合と比べることで、AIの市場がもともと持つ偏りも測れる。外側の数字だけで中の仕組みを推し量る工夫が面白い。", "unverified": "使ったLLMと市場の設定の詳細は抄録からは確認できない。"}}, {"id": "pr20", "rank": 20, "headline": "LLMの模擬クライアントと人の発話を同じ文脈で比較", "title": "Language of AI-Simulated and Human Clients in Behavioral Health Counseling: Comparative Pilot Study of Motivational Interviewing (Preprint)", "url": "https://doi.org/10.2196/preprints.117123", "authors": "Xi Chen", "venue": "JMIR Preprints", "date": "2026-11-17", "apa": "Chen, X. (2026). Language of AI-Simulated and Human Clients in Behavioral Health Counseling: Comparative Pilot Study of Motivational Interviewing (Preprint). https://doi.org/10.2196/preprints.117123", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "動機づけ面接の同じ文脈でLLMの模擬クライアントと人の返答を比べ、LLMは変化への同意を言い過ぎるのではなく、現状維持の発言を人より多く出すことを示した（抄録）。未査読。", "p3": "AnnoMIの133の会話から4,669の文脈を取り、Claude Opus 5.5とGPT-6 Astraに単発の返答と8往復の続きを作らせ、分類器と盲検の評価者が変化・維持・中立の発話を判定し、発話の種類の遷移確率を比べた（抄録）。", "p5": "単発では変化から維持への逆戻りがLLMで多かった（OR 10.0）が、返答を人並みに短くさせると差の信頼区間は0を含んだ。8往復の全条件でLLMは維持の発話が多かった（差0.16〜0.31）（抄録）。", "fun": "AIに患者役をさせてカウンセリングの練習台にするとき、「AIは素直すぎてすぐ説得される」と心配されてきた。調べてみると逆で、AIの患者役は「今のままでいい」という発言を人より多くした。しかもその差は返答の長さや相手のカウンセラー次第で変わった。練習台の性格が設定の細部で変わることを数字で示した点が面白い。", "unverified": "分類器の判定の誤りが結果に与える影響の大きさは抄録からは確認できない。臨床的な効果ではなく会話の振る舞いの比較である。"}}, {"id": "pr21", "rank": 21, "headline": "米保険会社の10-KでAIの言及が急増", "title": "Artificial Intelligence Disclosure in US Insurers' Annual Reports, 2019–2025: Descriptive Evidence from Form 10-K Filings", "url": "https://doi.org/10.2139/ssrn.7692738", "authors": "Yeshwanth Vepachadu", "venue": "SSRN", "date": "2026-11-16", "apa": "Vepachadu, Y. (2026). Artificial Intelligence Disclosure in US Insurers’ Annual Reports, 2019–2025: Descriptive Evidence from Form 10-K Filings. https://doi.org/10.2139/ssrn.7692738", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "米国の上場保険会社の年次報告書（10-K）でのAIの言及を2019〜2025年度の企業・年パネルで測り、言及の急増と、統治・規制の語の共起の増加を示した記述研究（抄録）。未査読。", "p3": "EDGARから187社の1,009件の10-Kを集め、透明なキーワード辞書でAIの言及を数え、年固定効果と企業クラスタ誤差の線形確率モデルで企業の特性との関係を見た（抄録）。", "p5": "AIか機械学習に触れる報告書は2019年度の9.8%から2025年度の92.9%に増え、生成AIは2025年度に43.6%。大きな保険会社ほど生成AIに触れやすかった（総資産の対数1単位で3.9ポイント）。ROAとの関連は有意でなかった（抄録）。", "fun": "会社の年次報告書に「AI」という言葉が出てくるかを数えるだけで、時代の変化が見える。保険会社では6年で1割から9割超に増えた。ただし著者は、言葉が増えたのが規制のせいか世の中の流行のせいかは区別できず、中身のある記述か決まり文句かも調べていないと明記している。数えることの強さと限界の両方がよく分かる。", "unverified": "辞書の語の一覧と、決まり文句かどうかの判定は抄録からは確認できない（著者も未検証と記す）。"}}, {"id": "pr22", "rank": 22, "headline": "月次決算を2日に短縮した製造工場の事例", "title": "The Two-day Close: Shop-floor Discipline and AI Estimation in Two Iranian Manufacturing Plants", "url": "https://doi.org/10.2139/ssrn.7691201", "authors": "Aliasghar Hakimian", "venue": "SSRN", "date": "2026-11-17", "apa": "Hakimian, A. (2026). The Two-day Close: Shop-floor Discipline and AI Estimation in Two Iranian Manufacturing Plants. https://doi.org/10.2139/ssrn.7691201", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "イランの製造2工場で、月次の財務諸表を月末の約15日後ではなく2日後に出せるようにした実務の事例を報告した（抄録）。未査読。", "p3": "現場の記録の再設計、逆勘定科目表や自律的な補助元帳などの勘定構造、検証ゲート付きの13段階の自動の締め、遅れて届くエネルギー・水・残業などの原価のAI推定を組み合わせ、前後の比較とAPQCの基準値で評価した（抄録）。", "p5": "2工場とも7か月連続で月末2日後に財務諸表を出し、APQCの上位4分の1の4.8日より58%短い。自動の締めは約5分で、残りの時間は例外の処理に使われる。AI推定の精度はまだ測っていない（抄録）。", "fun": "会社の1か月の成績表を作るのに、ふつうは2週間ほどかかる。材料費や電気代の請求書が遅れて届くからだ。この工場では、遅れる分をAIで見積もって先に締め、届いたら翌月に直すことで2日にした。待つ代わりに推定して後で補正するという発想は、天気予報や測量の考え方にも通じる。", "unverified": "AIによる原価の推定の精度は未測定（著者が明記）。著者は両工場とソフトウェア会社の利害関係者で、2工場の前後比較のため一般化には限界がある。"}}, {"id": "pr23", "rank": 23, "headline": "自然言語からDEMを実行・後処理するLLMエージェント", "title": "GranularGPT: Natural-Language-Driven End-to-End Discrete Element Method Simulations", "url": "https://arxiv.org/abs/2611.20551", "authors": "Erlei Li ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Li, E., Tang, S., Wang, A., Hu, M., Dai, Y., & Wang, G. (2026). GranularGPT: Natural-Language-Driven End-to-End Discrete Element Method Simulations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.20551", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "自然言語の指示から個別要素法（DEM）の計算の作成・実行・監視・後処理までを、LLMエージェントで自動化する枠組みを示した（抄録）。未査読。", "p3": "利用者の言葉から計算条件を作り、計算を実行・監視し、粒度分布・充填密度・速度分布・排出率・混合指数・接触力・熱量などを自動で抽出・報告する。12の場面の60件の通常条件と、誤りの処理で評価した（抄録）。", "p5": "60件の計算の成功率は91.7%。修復可能な10件の誤りはすべて検出して9件を解決し、修復できない5件はすべて正しく報告した（抄録）。", "fun": "砂や粉の動きを1粒ずつ計算する方法（個別要素法）は便利だが、設定が難しく専門家しか使えなかった。この研究は「この容器から砂を流して」と言葉で頼むだけで、計算の準備から結果のまとめまでAIが行う仕組みを作った。失敗したときに直せるかどうかまで調べている点が、実用を意識していて面白い。", "unverified": "使ったDEMのソフトウェアとLLM、結果の物理的な正しさの検証方法は抄録からは確認できない。"}}, {"id": "pr24", "rank": 24, "headline": "MDから学ぶ非局所構成則で破壊を大規模に予測", "title": "Mesoscale Neural Operators: Learning Nonlinear Constitutive Laws from Molecular Dynamics for Scalable Fracture Predictions", "url": "https://arxiv.org/abs/2611.19658", "authors": "Yue Yu ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Yu, Y., Wang, J., Silling, S., & Yang, Z. (2026). Mesoscale Neural Operators: Learning Nonlinear Constitutive Laws from Molecular Dynamics for Scalable Fracture Predictions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19658", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "分子動力学（MD）の載荷・変位のデータから非局所の構成則を学び、大きな領域の連続体の破壊計算に使える「メソスケール・ニューラル演算子」（MNO）を提案した（抄録）。未査読。", "p3": "非局所モデルの特性長さ（ホライズン）を使ってスケールを移り、ホライズンを変えてもひずみエネルギー密度が変わらない正規化した核と、エネルギー解放率を保つ臨界伸びの再尺度化を組み込んだ（抄録）。", "p5": "粗視化MDのデータで、学習したモデルはMDのひずみエネルギー密度と臨界エネルギー解放率に3%以内で一致し、分布外の引張試験で最大伝達力を6%以内で予測した。訓練片の4,000倍の面積の板で動的な脆性破壊の分岐を再現した（抄録）。", "fun": "原子1個ずつの計算は割れ方を正確に表せるが、大きな板には重すぎて使えない。この研究は原子の計算から「割れの規則」を学び、それを大きな板の計算に持ち込んだ。大きさを変えても割れるのに必要なエネルギーが変わらないよう式の形を工夫している。小さな世界の知識を大きな世界に運ぶ方法として面白い。", "unverified": "対象とした材料と、学習データの規模の詳細は抄録からは確認できない。"}}, {"id": "pr25", "rank": 25, "headline": "物理制約つき代理モデルで地すべりの流下を高速予測", "title": "A physics-constrained emulator for time-discretised landslide runout modelling", "url": "https://arxiv.org/abs/2611.21015", "authors": "Ye Chen ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Chen, Y., Nava, L., de Vries, M. V. W., & Wang, F. (2026). A physics-constrained emulator for time-discretised landslide runout modelling (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21015", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "地すべりの流下を、地形（数値標高モデル）上の厚さと速度を一定の時間刻みで次へ進める物理制約つきの神経代理モデルで再現し、数値計算より50倍以上速くした（抄録）。未査読。", "p3": "一定の時間間隔の厚さと速度の対20万超の標本で学習し、質量保存と運動エネルギーの損失に基づく物理的な損失関数で整合性を保たせた。1ステップの予測と、出力を次の入力に戻す自己回帰の連続予測で評価した（抄録）。", "p5": "1ステップの予測誤差（RMSE）は厚さ約0.06 m・速度約0.11 m/sで、110回の連続予測の後も約0.21 m・0.09 m/sにとどまった（抄録）。", "fun": "山崩れがどこまで流れるかを計算するには、時間のかかる物理シミュレーションを何度も回す必要がある。この研究は、短い時間ごとの「次の瞬間」を予測するAIを作り、それをつなげて全体の流れを再現した。AIに質量やエネルギーの法則を守らせることで、何度つないでも大きく崩れないようにした点が工夫だ。", "unverified": "学習に使った地すべりの数と地形、未知の地形での性能は抄録からは確認できない。"}}, {"id": "pr26", "rank": 26, "headline": "光ファイバの分布音響計測で土石流の活動を捉える", "title": "Distributed Acoustic Sensing of debris-flow activity in the Öschibach torrent (Swiss Alps)", "url": "https://doi.org/10.5194/egusphere-gc14-fibreoptic-18", "authors": "Juan Sebastian Osorno Bolivar ほか", "venue": "HAL", "date": "2026-11-16", "apa": "Osorno Bolivar, J. S., Chmiel, M., Walter, F., Blumenschein, F., Friedli, K., & Sladen, A. (2026). Distributed Acoustic Sensing of debris-flow activity in the Öschibach torrent (Swiss Alps). https://doi.org/10.5194/egusphere-gc14-fibreoptic-18", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "HALに登録された学会発表の要旨を使用。本文はない", "preprint": true, "short": true, "p1": "スイスの渓流沿いの約4 kmの既設の光ファイバを分布音響センシング（DAS）に使い、土石流の活動を高い空間分解能で捉え、整合場処理で発生位置を推定する試みを示した学会発表の要旨（抄録）。未査読。", "p3": "2025年夏に岩盤斜面に地震計の高密度アレイを置き、光ファイバを約850チャンネル（間隔約5 m、ゲージ長約10 m、約600 Hz）で計測した。水位の閾値で事象を抽出し、周波数ごとの位相情報を使う整合場処理（MFP）で源の位置を推定した（抄録）。", "p5": "事象中は渓流近くのチャンネルで20〜30 Hzのエネルギーが増え、落石や地震も記録された。合成データの試験で、隣り合う2つの支流の源を区別できることを示した。結果は予備的である（抄録）。", "fun": "通信用に埋めてある光ファイバは、全長にわたる「耳」として使える。ファイバのわずかな伸び縮みから、数メートルごとに振動を聞き分けられるからだ。この研究では、山の斜面から落ちる石と谷を下る土石流の動きを結びつけようとしている。既にある設備を防災の見張りに変える発想が面白い。", "unverified": "学会の要旨で、土石流の速度の追跡などの結果は予備的。本文はない。"}}, {"id": "pr27", "rank": 27, "headline": "Sobol指数で改良土のSCCパラメータの同定性を診断", "title": "Global sensitivity and identifiability of Structured Cam Clay parameters for cement-treated clays: a variance-based analysis with a staged calibration protocol", "url": "https://doi.org/10.21203/rs.3.rs-11595166/v1", "authors": "Alhassan Ahmed Igbeneghu ほか", "venue": "Research Square (In Review)", "date": "2026-11-16", "apa": "Igbeneghu, A. A., Kayode-Ojo, N., & Adegbemileke, S. A. (2026). Global sensitivity and identifiability of Structured Cam Clay parameters for cement-treated clays: a variance-based analysis with a staged calibration protocol. https://doi.org/10.21203/rs.3.rs-11595166/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "セメント改良粘土のStructured Cam Clayモデルの7パラメータについて、大域感度と同定可能性を分散に基づいて調べ、段階的な較正の手順を提案した（抄録）。未査読。", "p3": "排水・非排水の三軸圧縮のひずみ制御の積分器を作り（Modified Cam Clayの閉形式解と0.12%以内で一致）、応力経路ごとに18,432回の計算から1次と全次のSobol指数を求め、20万組の棄却サンプリングで同定可能性を調べた（抄録）。", "p5": "非排水の最大強度は粘着力と限界状態応力比でほぼ決まり（全次指数0.73と0.26）、1回の非排水試験では両者がほぼ完全に交換可能だった。膨潤指数は排水・非排水を組み合わせても三軸の曲線から同定できなかった。ナイジェリア南西部の5つの改良土に適用した（抄録）。", "fun": "土の性質を表す式には調整用の数字（パラメータ）がいくつもあるが、実験から全部を決められるとは限らない。この研究は、ある2つの数字が、一方を増やし他方を減らすと同じ結果になる「すり替え」の関係にあり、1回の試験では区別できないことを示した。どの試験でどの数字を決めるかの順番を設計し直した点が面白い。", "unverified": "提案した較正手順の詳細と、5つの土での較正結果の数値は抄録からは確認できない。"}}, {"id": "pr28", "rank": 28, "headline": "圧電センサとFEM・機械学習でき裂の位置を推定", "title": "AI powered Structural Health Monitoring via Piezoelectric Sensors", "url": "https://doi.org/10.21203/rs.3.rs-11734968/v1", "authors": "Akash M A", "venue": "Research Square (In Review)", "date": "2026-11-17", "apa": "A, A. M. (2026). AI powered Structural Health Monitoring via Piezoelectric Sensors. https://doi.org/10.21203/rs.3.rs-11734968/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "アルミ梁の表面の圧電アクチュエータ・センサの過渡応答を有限要素で多数作り、機械学習でき裂の有無と位置を推定する概念実証を示した（抄録）。未査読。", "p3": "COMSOLで長方形のき裂を20〜180 mmに5 mm刻みで動かし、4点の電位の時系列500超から1点あたり6つの特徴（RMS、尖度、包絡線の到達時刻、卓越周波数など）を取り、SVMで健全・損傷を分類し、Matérn核のガウス過程回帰で位置を推定した（抄録）。", "p5": "位置推定の平均絶対誤差は25.09 mmで、95%予測区間を出した。ただし健全な状態のデータは1つの損傷梁の計算を加工して作っており、著者は検証済みの精度ではなく概念実証と位置づけている（抄録）。", "fun": "金属の梁に小さな「声を出す板」と「聞く板」を貼り、ひびがあると振動の伝わり方が変わることを利用して、ひびの場所を当てる。この研究は実物ではなく計算で多数のひびの例を作り、AIに学ばせた。著者自身が、健全な場合のデータの作り方に限界があると正直に書いている点も、結果を読むうえで大事だ。", "unverified": "健全な状態のデータが独立した計算でないため、分類の精度は検証されていない（著者が明記）。実験での確認もない。"}}, {"id": "pr29", "rank": 29, "headline": "LLMの有限要素コード生成はまだ一貫性に欠ける", "title": "Scientific Coding with Large Language Models: Evidence from Finite Element Analysis", "url": "https://arxiv.org/abs/2611.21176", "authors": "Erfan Hamdi ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Hamdi, E., Shor, J., & Lejeune, E. (2026). Scientific Coding with Large Language Models: Evidence from Finite Element Analysis (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21176", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "非線形・履歴依存の力学と構造動力学を含む17の有限要素の課題で15のLLMのコード生成を評価し、一度は成功しても毎回成功するとは限らないことを示した（抄録）。未査読。", "p3": "FEM-Benchを拡張し、実行のフィードバックなしの実装とテスト生成の2部門で評価し、6モデルではコードの実行と修正を許すエージェントの枠組みとも比べた。失敗した249のエージェントの軌跡を分析した（抄録）。", "p5": "単発の実装の最高は87.1%。Claude Opus 5とSimpleAgentは3回中1回以上の成功が96.5%だが、3回とも成功は77.1%だった。自己検証の失敗はテストの網羅不足（73.1%）が最も多く、実装役とテスト役を分けた構成で3回とも成功が88.8%に上がった（抄録）。", "fun": "AIにプログラムを書かせると、3回試せばほぼ1回は正解するが、3回とも正解する率はぐっと下がる。しかもAIは自分で書いたテストに合格して安心してしまう。テストとプログラムが同じ間違いを共有していることもあった。書く役と確かめる役を別々のAIにすると良くなったという結果は、人の仕事の分担にも通じる。", "unverified": "17の課題の内訳と、モデルごとの詳細な成績は抄録からは確認できない。"}}, {"id": "pr30", "rank": 30, "headline": "LLMの抽出を決定的な検査で止める振動試験の解析", "title": "Language Models Meet Vibration Testing for LEO Constellation Satellites with Calibrated Response Prediction from Few-show Sweeps", "url": "https://arxiv.org/abs/2611.20579", "authors": "Jun Wu ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Wu, J., Li, D., Zheng, Z., Yue, H., Yang, F., & Sun, H. (2026). Language Models Meet Vibration Testing for LEO Constellation Satellites with Calibrated Response Prediction from Few-show Sweeps (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.20579", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "LLMが試験記録から解析の設定を抽出する際に、単位・物理的整合・原文の引用・モデル間の一致などの決定的な検査を通ったものだけを使う「検証ゲート」を提案し、衛星の振動試験で示した（抄録）。未査読。", "p3": "低軌道の衛星の正弦波振動の受入試験で、DeepSeek V4.1 FlashとQwen-plusが中国語の試験記録から76項目の設定を抽出し、ゲートを通した設定で応答の制限（ノッチング）を計算した。曲線の予測では、LLMの直接予測と小さな物理構造のネットワークを比べた（抄録）。", "p5": "事実単位のF1は0.98〜1.0で、全ゲートを通した20の設定すべてで正解と同一のノッチング結果になり、使われた項目の17の誤りはすべて止められた。LLMの直接の曲線予測は線形外挿並みで、物理構造のネットワークは過剰なノッチ帯域を86〜89%減らした（抄録）。", "fun": "AIが書類を読んで計算の設定を作ると、もっともらしいが間違った数字が紛れ込むことがある。この研究は、単位が合うか、原文に本当に書いてあるか、別のAIと答えが一致するかを機械的に確かめる関所を設けた。さらに、AIに曲線を直接予想させるより小さな物理モデルの方が良いという「負の結果」も報告していて誠実だ。", "unverified": "試験記録の数と、止めた誤りのうち人工的に注入したものの内訳は抄録からは確認できない。"}}, {"id": "pr31", "rank": 31, "headline": "分数階の記憶を持つポート・ハミルトンNNで粘弾性構造", "title": "Port-Hamiltonian Neural Networks with Diffusive Fractional Memory and Tensor-Train Operators: Passivity-Preserving Surrogates for Digital Twins of Viscoelastic Structures", "url": "https://doi.org/10.20944/preprints202611.1680.v1", "authors": "Luis Rojas Valdivia ほか", "venue": "Preprints.org", "date": "2026-11-17", "apa": "Rojas Valdivia, L., & García, J. (2026). Port-Hamiltonian Neural Networks with Diffusive Fractional Memory and Tensor-Train Operators: Passivity-Preserving Surrogates for Digital Twins of Viscoelastic Structures. https://doi.org/10.20944/preprints202611.1680.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "分数階の粘弾性減衰を持つ構造の代理モデルで、カプート微分の記憶を有限のポート・ハミルトン系として表し、エネルギーを生まない（受動性を保つ）神経ネットTT-fpHNNを提案した（抄録）。未査読。", "p3": "カプート微分の拡散表現を正の重みの求積で離散化し、裾の補正、エネルギー収支を厳密に保つ離散勾配の積分、正定値のテンソル・トレイン分解の演算子を組み合わせた（抄録）。", "p5": "24節点の核の誤差は6.4%から0.09%に下がった。450自由度でランク8のモデルは200周期を誤差0.66%・11,106パラメータで再現し、制約なしのモデルは発散した。2,160自由度で1万ステップ受動性を保ち、分数階は雑音1%で±0.05以内で推定できた（抄録）。", "fun": "ゴムのように「過去の変形を覚えている」材料を含む構造をAIでまねると、長く計算するうちにエネルギーが勝手に増えて暴走しがちだ。この研究は、エネルギーの出入りの帳簿が必ず合う形（ポート・ハミルトン系）にAIを閉じ込め、記憶も有限個の部品で表した。物理の約束をAIの形そのものに組み込む発想が面白い。", "unverified": "実構造の計測データでの検証はなく、合成のトラスでの結果である（抄録の範囲）。"}}, {"id": "pr32", "rank": 32, "headline": "AIによる人事に従業員は条件付きで信頼を寄せる", "title": "“The System Says So”: Making Sense of AI-Driven HRM, Conditional Trust and Employee Well-Being in Saudi Arabian Organisations", "url": "https://doi.org/10.21203/rs.3.rs-11330157/v1", "authors": "Faris Alsaedi", "venue": "Research Square (In Review)", "date": "2026-11-17", "apa": "Alsaedi, F. (2026). “The System Says So”: Making Sense of AI-Driven HRM, Conditional Trust and Employee Well-Being in Saudi Arabian Organisations. https://doi.org/10.21203/rs.3.rs-11330157/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "サウジアラビアの組織の従業員が、AIによる人事管理をどう解釈し、それが人事システムへの信頼とウェルビーイングをどう形づくるかを質的に示した（抄録）。未査読。", "p3": "35人への半構造化面接を再帰的主題分析で分析した（抄録）。", "p5": "AIによる人事の受け止め方は、透明性・人の関与・文脈への配慮で決まった。事務作業のAIには条件付きの信頼が寄せられたが、人事評価のような重要な決定には信頼しにくく、尊厳・自律・心の健康への懸念が、AIが文脈を見ず単純化しすぎるという認識と結びついていた（抄録）。", "fun": "「システムがそう言っているから」と人事の判断を告げられたら、納得できるだろうか。従業員は、勤怠の処理のような事務ならAIに任せてもよいが、自分の評価となると話は別だと感じていた。AIへの信頼が「何を任せるか」で変わるという結果は、機械に任せる線引きを考える手がかりになる。", "unverified": "対象の組織・職種の構成と、引用された語りの詳細は抄録からは確認できない。"}}, {"id": "pr33", "rank": 33, "headline": "職場AIによる専門知の取り込みと退職時の帰属", "title": "Expertise capture in workplace AI", "url": "https://arxiv.org/abs/2611.21456", "authors": "Andreas Ekelhart ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Ekelhart, A., Mohsin, A., Sarker, I. H., & Janicke, H. (2026). Expertise capture in workplace AI (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21456", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "職場のAIアシスタントに蓄積されるプロンプト・事例・記憶・対話履歴に労働者の専門的判断が取り込まれる過程を「専門知の取り込み」と名づけ、帰属・分離・撤回の可能性を整理する枠組みを示した（抄録）。未査読。", "p3": "貢献の形態、技術的な保存場所、変換の種類の3つの軸で整理し、貢献がどこに置かれどう変換されたかで、帰属・分離・撤回の可否がシステムの設計の段階で決まることを論じた（抄録）。", "p5": "労働者が去ると、組織はその判断で形づくられた能力を保持し、労働者は使えなくなる。この非対称は、貢献が派生物・学習済みの部品・後継システムへ移るほど強まる。書き込み時の出所記録、分離可能な貢献の抽出、実行可能な退出の手続きの3つの方策を示した（抄録）。", "fun": "仕事でAIに頼み方の工夫や判断のコツを教え込むと、そのノウハウは会社のAIの中に残る。退職したら自分は使えなくなるのに、会社は使い続けられる。これを「専門知の取り込み」と名づけ、どこまでなら後から取り出せるかを技術の仕組みから考えた。働き方とAIをめぐる新しい権利の問題として面白い。", "unverified": "実証データはなく、概念的な枠組みの提案である（抄録の範囲）。"}}, {"id": "pr34", "rank": 34, "headline": "認知症介護者の報酬感の軌跡と心身の健康", "title": "Caregiving reward trajectories and outcomes among family caregivers of persons living with dementia: A two-year longitudinal study", "url": "https://doi.org/10.21203/rs.3.rs-11228226/v1", "authors": "Ya-Hui Chou ほか", "venue": "Research Square (In Review)", "date": "2026-11-16", "apa": "Chou, Y.-H., Shyu, Y.-I. L., Lin, Y.-K., & Hsu, W. C. (2026). Caregiving reward trajectories and outcomes among family caregivers of persons living with dementia: A two-year longitudinal study. https://doi.org/10.21203/rs.3.rs-11228226/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "台湾の認知症の家族介護者200人を2年追跡し、介護の報酬感（そばにいる・意味・学び）の軌跡が3群に分かれ、報酬感の高い群ほど役割負担と抑うつが少ないことを示した（抄録）。未査読。", "p3": "神経内科の外来から集めた介護者を、開始時・1年後・2年後に報酬感、役割負担、健康関連QOL、抑うつ症状で測り、集団に基づく軌跡モデルと一般化推定方程式で分析した（抄録）。", "p5": "報酬感はおおむね安定していたが、学びの報酬感だけは直線的に増えた（p=.01）。高い軌跡ほど役割負担が低く（β=−0.52〜−0.27）、抑うつ症状が少なく（β=−10.10〜−4.90）、意味の報酬感は身体的健康とも関連した。便宜標本と未調整のモデルである（抄録）。", "fun": "介護は「大変なこと」として語られがちだが、そばにいられる喜び、意味を感じること、新しく学ぶことといった「報酬」もある。2年間追うと、多くの報酬感は変わらないのに、学びの報酬感だけは経験とともに伸びていた。負担を減らすだけでなく、報酬を育てるという支援の考え方につながる点が面白い。", "unverified": "交絡要因を調整していないため（著者が明記）、報酬感が健康を改善するという因果は確認できない。"}}, {"id": "pr35", "rank": 35, "headline": "5,100万件のレシートで食の組み合わせと健康格差", "title": "Food co-purchasing networks encode geographic disparities in cardiometabolic health", "url": "https://arxiv.org/abs/2611.19420", "authors": "Antonio Desiderio ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Desiderio, A., Rodovero, L., & Lehmann, S. (2026). Food co-purchasing networks encode geographic disparities in cardiometabolic health (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19420", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "デンマーク95自治体の5,100万件のレシートから食品の共購買ネットワークを作り、何を買うかより、どう組み合わせて買うかが地域の心代謝系の健康の差を映すことを示した（抄録）。未査読。", "p3": "人気だけでは説明できない共購買を、統計的に検証した二部ネットワークで取り出し、ネットワークの骨格を食のコミュニティに分け、その地域での結束度で心代謝系の処方を予測した（抄録）。", "p5": "自治体は同じ商品を買っていても、組み合わせ方は都市から周縁への連続的な勾配に沿って変わり、コミュニティの結束度は社会人口学的な調整の後に残る分散の4分の1から半分を説明した。超加工食品は地理的な勾配がなく、ネットワークの周縁にあった（抄録）。", "fun": "同じスーパーで同じ商品が売られていても、何と何を一緒にかごに入れるかは地域で違う。この研究は5千万枚のレシートから「一緒に買われる組み合わせ」の網を作り、その形が地域の糖尿病や心臓病の薬の多さを予測することを示した。買い物かごの中の組み合わせが健康の地図になる、という見方が面白い。", "unverified": "処方データの種類と、自治体単位の分析であることによる生態学的な誤りの扱いは抄録からは確認できない。"}}, {"id": "pr36", "rank": 36, "headline": "歩道の通行可否の判断を少数の回答で個人に合わせる", "title": "Passable for Whom? Few-Shot Personal Calibration of Sidewalk Accessibility Perception", "url": "https://arxiv.org/abs/2611.19839", "authors": "Wesley Maia ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Maia, W., Martinez-Sanchez, A., Keskar, M., & Greer, R. (2026). Passable for Whom? Few-Shot Personal Calibration of Sidewalk Accessibility Perception (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19839", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "歩道を通れるかの判断は人によって違うという前提で、初めての人の少数の回答から、その人の未見の歩道の判断を予測する「少数ショットの個人の較正」を提案した（抄録）。未査読。", "p3": "凍結した視覚言語モデルの内部状態と、1.49万件の公開監査で学んだ検出器による障害物の種類・深刻度・文脈を「場面の記述」とし、回答の傾向と属性の重みを「個人の解釈」として回答から当てはめる。135人の利用者が同じ50場面を評価した8,883の判断で、人と場面の両方を検証用に分けて評価した（抄録）。", "p5": "8つの回答でブライアスコアは0.550から0.479に下がり、同じ回答をVLMにプロンプトで渡す方法は0.562だった。等角リスク制御で「通れる・通れない・あなた次第」を誤りの率5%で出すと、言い切れる場面の割合は27%から42%に増えた（抄録）。", "fun": "車いすの人にとって「通れる歩道」は一つに決まらない。同じ補助具を使う人どうしでも、同じ写真の判断が分かれるからだ。この研究は、その人に8枚ほど答えてもらうだけで判断の癖をつかみ、見たことのない歩道を予測した。自信がないときは「あなた次第」と正直に言う仕組みも面白い。", "unverified": "補助具の種類別の結果と、対象の都市は抄録からは確認できない。"}}, {"id": "pr37", "rank": 37, "headline": "ペルソナ付きLLMエージェントの暗黙の偏りの地図", "title": "A Crowd-Audited Atlas of Implicit Bias in LLM-Powered Agents", "url": "https://arxiv.org/abs/2611.21376", "authors": "Jason Alexander ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Alexander, J., Li, Y., Licamele, M., Deng, W. H., & Das, S. (2026). A Crowd-Audited Atlas of Implicit Bias in LLM-Powered Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21376", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "人種・性自認・政治志向のペルソナを持たせたLLMエージェントの日常的な判断に現れる暗黙の偏りを506の場面の「地図」にまとめ、どの偏りを優先して見直すべきかを群衆監査で調べた（抄録）。未査読。", "p3": "米国生活時間調査（ATUS）の17の生活領域から判断場面を作り、ペルソナ間で有意な偏りが出た506場面を集め、500人の参加者が8,010回の二者択一で見直すべき場面を選び、その理由を分析した（抄録）。", "p5": "参加者は、関係する人が多い場面（食事など）、重大な場面（健康など）、模擬した集団の全員が同じ判断をした場面を優先し、格差の大きさや生活領域にはあまり左右されなかった。参加者は格差を集団の特性と解釈し、自分の内なる固定観念でもっともらしさを判断しがちだった（抄録）。", "fun": "AIに「ある属性の人」を演じさせると、日々の小さな選択にも偏りが出る。では、どの偏りから直すべきか。人に選んでもらうと、偏りの大きさより「全員が同じ答えをした」かどうかを重視した。ところがその判断自体が、選ぶ人の固定観念に左右されていた。偏りを人が監査することの難しさが見える点が面白い。", "unverified": "使ったLLMの種類と、偏りの有意性の判定方法は抄録からは確認できない。"}}, {"id": "pr38", "rank": 38, "headline": "方程式フリーの多スケール計算の自己随伴境界条件", "title": "Self-adjoint boundary conditions for equation-free multiscale modelling", "url": "https://arxiv.org/abs/2611.18788", "authors": "J. E. Bunder", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Bunder, J. E. (2026). Self-adjoint boundary conditions for equation-free multiscale modelling (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18788", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "ミクロのモデルを時空間に散らばる小さなパッチで解いてマクロの挙動を求める方程式フリーの多スケール計算で、自己随伴の対称性を保つパッチの結合条件を作った（抄録）。未査読。", "p3": "有界な領域で固定の境界条件を持つ、コンパクトな自己随伴作用素で定まるミクロのモデルを対象に、パッチ間の結合がミクロの方程式の対称性を保つように設計した（抄録）。", "p5": "対称性を保たない結合ではマクロの計算が保存則を満たさず非物理的になりうることを指摘し、新しい設計で方程式フリー法を適用できる系の範囲が大きく広がると述べる（抄録）。", "fun": "細かい世界の計算を全域で行うのは重すぎるので、ところどころの小窓（パッチ）だけを計算し、その間をつないで大きな世界の動きを推定する。ただ、つなぎ方を誤ると、エネルギーが保存されないなど物理的にありえない結果になる。もとの方程式が持つ「対称性」をつなぎ目でも守る工夫が要になっている。", "unverified": "数値例と、保存則の誤差の大きさは抄録からは確認できない。"}}, {"id": "pr39", "rank": 39, "headline": "位相空間の適応格子でプラズマ中の球を解く", "title": "A spherical body in plasma simulated with adaptive mesh and algorithm refinement", "url": "https://arxiv.org/abs/2611.21466", "authors": "Vladimir I. Kolobov ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Kolobov, V. I., & Arslanbekov, R. R. (2026). A spherical body in plasma simulated with adaptive mesh and algorithm refinement (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21466", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "弱電離プラズマ中の吸収球という探針理論の古典的な運動論の問題で、位相空間の適応格子とアルゴリズムの細分化（PAMAR）の枠組みを示し、厳密解と照合した（抄録）。未査読。", "p3": "電子とイオンを、それぞれの適応的な（r, v, μ）の八分木、または角度モーメントの縮約位相空間（Fokker–Planck、2流モデル）で解き、半径方向のポアソン場で結合した。衝突なしは特性曲線法、弾性散乱は軌道に沿う積分の厳密解で検証した（抄録）。", "p5": "探針の電流-電圧特性と電位・各粒子種のモーメントの分布は厳密解と一致した。遠方の電位は衝突なしでr⁻²で落ち、イオンの平均自由行程より外でのみr⁻¹になった。弾性散乱では収集電流の平均自由行程への依存を1%で追った（抄録）。", "fun": "プラズマの中に小さな球を入れると、まわりの電子やイオンの速さの分布がどう乱れるか。位置と速度を合わせた「位相空間」を細かく区切って解くと計算が重いので、必要なところだけ細かくする方法を作り、正確な解と照らし合わせた。どこで粒子の詳しい計算から流体の粗い計算に切り替えるかを自動で判断する点が面白い。", "unverified": "計算コストの削減の程度は抄録からは確認できない。"}}, {"id": "pr40", "rank": 40, "headline": "高次の非線形を二次の縮約モデルで表す", "title": "Reduced-Order Quadratic Representation of Higher-Order Nonlinear Dynamical Systems for Phononic Frequency Comb Generation", "url": "https://doi.org/10.21203/rs.3.rs-11747824/v1", "authors": "Madhurendra Mishra ほか", "venue": "Research Square (In Review)", "date": "2026-11-17", "apa": "Mishra, M., & Ganesan, A. (2026). Reduced-Order Quadratic Representation of Higher-Order Nonlinear Dynamical Systems for Phononic Frequency Comb Generation. https://doi.org/10.21203/rs.3.rs-11747824/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "2:1の内部共振近くで駆動される2モード系で、6次までの多項式の非線形が二次の縮約モデルで表せることを解析的に示し、フォノン周波数コムの発生への影響を調べた（抄録）。未査読。", "p3": "共振近くの縮約モデルで、奇数次の非線形項は実効のモード振動数を、偶数次の項は二次の結合係数を変えることを導き、MoS2共振子を想定したパラメータの数値計算で精度を確かめた（抄録）。", "p5": "数値計算で周波数コムが生じる力と振動数の領域を特定し、駆動周波数と分数調波のまわりの側帯波を示した。長い方程式と短い方程式は多くの傾向で一致したが、スペクトルの分布と一部の発生境界には差が残った（抄録）。", "fun": "二つの振動が互いに影響しあうと、くし（コム）の歯のように等間隔に並んだ周波数の振動が生まれることがある。この研究は、高次の複雑な非線形があっても「二次の結合」だけの簡単な式にまとめ直せることを示した。奇数次は振動数をずらし、偶数次は結合の強さを変えるという役割分担が分かりやすい。", "unverified": "縮約モデルが使える範囲の定量的な境界は抄録からは確認できない。"}}, {"id": "pr41", "rank": 41, "headline": "XBRLグラフ上のLLMの偽の監査可能性を測る計画", "title": "Right Number, Forged Pedigree: A Preregistered Minimal Study of False Auditability in LLM Answers over XBRL Knowledge Graphs", "url": "https://doi.org/10.5281/zenodo.24311557", "authors": "Chahed, Oussama", "venue": "Zenodo", "date": "2026-11-17", "apa": "Chahed, O. (2026). Right Number, Forged Pedigree: A Preregistered Minimal Study of False Auditability in LLM Answers over XBRL Knowledge Graphs. Zenodo. https://doi.org/10.5281/ZENODO.24311557", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された分析計画の説明（DataCiteから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "XBRLの知識グラフに基づくLLMの回答で、数値は正しいが引用が無効な「偽の監査可能性」と、偽造された出典を監査役のLLMが受け入れるかを測る、事前登録した分析計画（抄録）。結果はまだない。未査読。", "p3": "30社年・240項目・6つのオープンウェイトのモデルで、研究Aは正しい数値に無効な引用が付く頻度を、研究Bは出典を偽造した正しい回答を監査役のモデルが受け入れるかを測る。完全なシステムと何も見ないシステムの得点をオフラインの対照で固定した（抄録）。", "p5": "公開されたのは計画、設定、凍結したコーパス（ハッシュ付き）、試行の費用の記録、オフラインの検査の結果で、実際の言語モデルによる結果は含まれない（抄録）。", "fun": "AIが「この数字は財務データのこの箇所から取りました」と出典を示すと、確かめられるように見える。だが出典が実在し、そこから本当に数字を計算し直せなければ意味がない。この研究は、答えは合っているのに出典がでたらめという危うい状態がどれくらいあるかを測る計画を、結果を見る前に固定して公開した。", "unverified": "結果はまだ出ていない（分析計画の公開のみ）。"}}, {"id": "pr42", "rank": 42, "headline": "財務エージェントの数値の主張を5種の誤りで検証", "title": "FinVerify: A Verification Framework for Financial Agents", "url": "https://arxiv.org/abs/2611.20423", "authors": "Mao Guan ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Guan, M., Chen, Q., Meng, G., & Liu, X.-Y. (2026). FinVerify: A Verification Framework for Financial Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.20423", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "財務エージェントの数値の主張を、期間の整合・出典の忠実さ・比較可能性・会計の整合・財務モデルの忠実さの5種の誤りに基づいて検証し、合格・却下・保留を返す枠組みFinVerifyを示した（抄録）。未査読。", "p3": "Agent Finance Reasoningの190の誤った軌跡から誤りを5分類し、LLMが主張と証拠を構造化し、決定的な検証器が財務の要件を調べ、正式な式があるときはZ3で入力との整合を確かめる。5つのベンチマークでLLMの採点者などと比べた（抄録）。", "p5": "Agent Finance Reasoningで、受理した主張の適合率はLLM採点者の56.4%から76.7%に上がった（被覆率81.2%）。XBRLFilingでは適合率99.8%・判定精度97.0%、FinanceBench-67では87.9%（採点者69.7%）。FinQAとTAT-QAでは改善が小さかった（抄録）。", "fun": "AIに財務の質問をすると、計算は合っているのに違う年度の数字を使ったり単位を取り違えたりする。この研究は、そうした間違いを5種類に分け、それぞれを機械的に検査する仕組みを作った。証拠が足りないときは無理に判定せず「保留」する点が、会計の監査の考え方に近くて面白い。", "unverified": "保留の割合が高い場合の実務上の扱いは抄録からは確認できない。"}}, {"id": "pr43", "rank": 43, "headline": "業績の数字に隠れる事業の失敗要因を探る診断法", "title": "Diagnostic Root Audit (DRA): An Analytical Methodology for Business Failure Identification", "url": "https://doi.org/10.2139/ssrn.7694962", "authors": "Ahmad Rahmatkhah", "venue": "SSRN", "date": "2026-11-17", "apa": "Rahmatkhah, A. (2026). Diagnostic Root Audit (DRA): An Analytical Methodology for Business Failure Identification. https://doi.org/10.2139/ssrn.7694962", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "利益や受注が出ているのに回収の遅れや利益率の低下が進むB2B企業で、収益の漏れの運用上の原因をたどる部門横断の診断の手順（DRA）を提案した（抄録）。未査読。", "p3": "財務記録、CRMと見積りの履歴、契約、納品の記録、時間・原価の記録、回収を突き合わせ、過去の取引の再構成から、待ち時間の分析、利益率と値引きの分解、段階ごとの関門の統治、経営への是正計画までの5段階で進める。分析の単位は営業担当者ではなく商取引の約束とその後の結果である（抄録）。", "p5": "漏れの仕組みの特定、段階を抜ける証拠の明確化、価格と契約の統制、計上した収益と回収した現金の区別、販売能力と納品能力の照合を行う。著者は管理の設計の枠組みで、効果は文脈で検証すべきだとしている（抄録）。", "fun": "会社の決算では売上も利益も出ているのに、なぜか手元のお金が足りなくなることがある。売上を計上する時点と、実際にお金が入る時点がずれるからだ。この研究は、見積りから納品、入金までを1件ずつたどり直して、どこで利益が漏れているかを探す手順を示した。数字の合計の陰に隠れた原因を探る発想が面白い。", "unverified": "実際の企業への適用例と効果の検証は示されていない（著者が明記）。"}}, {"id": "pr44", "rank": 44, "headline": "AUCが最良の貸倒予測が損失最小とは限らない", "title": "The Model That Wins on AUC Is Not the Model That Saves the Bank Money: A Cost-Sensitive Re-Evaluation of Credit Default Prediction Classifiers", "url": "https://doi.org/10.5281/zenodo.24304545", "authors": "Prakasa, Nezar Abdilah", "venue": "Zenodo", "date": "2026-11-17", "apa": "Prakasa, N. A. (2026). The Model That Wins on AUC Is Not the Model That Saves the Bank Money: A Cost-Sensitive Re-Evaluation of Credit Default Prediction Classifiers. Zenodo. https://doi.org/10.5281/ZENODO.24304545", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された論文の説明（DataCiteから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "クレジットカードの債務不履行の予測で、AUCで最良のモデルと銀行の期待損失を最小にするモデルは一致せず、判定の閾値を費用に合わせる方が効果が大きいことを示した（抄録）。未査読。", "p3": "台湾の3万口座のUCIのデータで、4つの分類器を対にした反復の層化交差検証（5分割×6回）で比べ、通常の0.5の閾値とAUC等の指標、各口座の与信枠に基づく費用行列で入れ子に最適化した閾値の両方で評価した（抄録）。", "p5": "AUCではLightGBMが有意に最良だったが、期待費用はランダムフォレストが最小（与信総額の1.24%）で、木のアンサンブル3つの間の費用差は有意でなかった。費用に最適化した閾値に変えると、どのモデルでも期待費用が86〜88%減った（抄録）。", "fun": "お金を返さない人を見逃す損と、返せる人を断ってしまう損は、銀行にとって桁違いに違う。それなのに多くの研究は二つの間違いを同じ重さで数えてきた。この研究は、どのAIが一番かという競争より、「どこで線を引くか」を損の大きさに合わせる方がずっと効くことを示した。評価の物差しが答えを変える好例だ。", "unverified": "費用行列の仮定（損失率など）の詳細は抄録からは確認できない。"}}, {"id": "pr45", "rank": 45, "headline": "都市の暑熱適応策の費用便益を空間的に評価", "title": "URBADAPT-HEAT v1.0: a scalable geospatial framework for city-level public-private adaptation infrastructure cost-benefit analysis and its urban heat risk implementation", "url": "https://doi.org/10.5194/egusphere-2026-5357", "authors": "Armande Aboudrar-Méda ほか", "venue": "EGUsphere", "date": "2026-11-16", "apa": "Aboudrar-Méda, A., & Falchetta, G. (2026). URBADAPT-HEAT v1.0: a scalable geospatial framework for city-level public-private adaptation infrastructure cost-benefit analysis and its urban heat risk implementation. https://doi.org/10.5194/egusphere-2026-5357", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "EGUsphereの討論用原稿の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "都市内の空間解像度で暑熱による死亡のリスクを評価し、公共・民間の適応策の効果・費用・相互作用・公平性を費用便益で比べる地理空間の枠組みURBADAPT-HEAT v1.0を示した（抄録）。未査読。", "p3": "危険・暴露・脆弱性・影響の4要素を、高解像度の気温場、2050年までの気候と人口の予測、社会的脆弱性の指標、年齢別の暑熱死亡の影響関数で結び、冷房・街路樹・早期警報の3つの政策を、冷房による熱の島の強化などのフィードバックを含めて評価する。25年の割引費用と便益、予算制約下の組み合わせの最適化、PAWNの大域感度分析を備える（抄録）。", "p5": "ローマ・アテネ・リスボン・コペンハーゲンの4都市で実装して枠組みの振る舞いを示し、欧州40都市にも実装したが、その比較は別の研究に回すとしている（抄録）。", "fun": "暑さ対策にエアコンを増やすと、室外機の熱で街はさらに暑くなる。街路樹を植えれば冷房の需要が減る。この研究は、こうした対策どうしの影響まで含めて、どこに何を配ればお金に見合って命を守れるかを地図の上で計算する仕組みを作った。誰が得をし誰が取り残されるかまで示す点が政策の道具として面白い。", "unverified": "4都市での具体的な費用便益の数値は抄録からは確認できない。"}}, {"id": "pr46", "rank": 46, "headline": "開発者の性格がAIコーディング支援の使い方を左右", "title": "How Developer Personality Shapes the Use of AI Coding Assistants", "url": "https://arxiv.org/abs/2611.21240", "authors": "Annemarie Wittig ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Wittig, A., Mailach, A., & Siegmund, N. (2026). How Developer Personality Shapes the Use of AI Coding Assistants (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21240", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "利用者の性格とLLMツールの受け止め方の関係を12研究のスコーピングレビューで整理し、開発者の小規模な2波の調査で、性格がAIコーディング支援の経験と関連する最初の兆候を示した（抄録）。未査読。", "p3": "一般の検索、ソフトウェア工学の主要な場、AIツール、雪だるま式の探索で12研究を特定した。続いて開発者に2波の探索的な調査（29人と11人）を行い、ビッグファイブで測った性格とAIコーディング支援の受け止め方の関係を見た（抄録）。", "p5": "12研究はいずれも性格と受け止め方（特に有用性）の関連を報告したが、ソフトウェア工学の文脈のものはなかった。調査では外向性が高いほど私的な利用の経験が良く、協調性は第1波で職業上の経験の悪さと、第2波で良さと関連した（抄録）。", "fun": "同じAIのプログラミング助手でも、使う人の性格によって「役に立つ」と感じる度合いが違うかもしれない。この研究は先行研究を集め、さらに少人数の開発者に尋ねて、外向的な人ほど個人で使う体験を好意的に感じる傾向を見つけた。人に合わせてAIの振る舞いを変える理由づけを探る、最初の一歩として面白い。", "unverified": "調査は29人と11人と小規模で、結果は予備的（著者が明記）。"}}, {"id": "pr47", "rank": 47, "headline": "家族介護者の回想法を模擬AIエージェントで支援", "title": "MemoryLane: Supporting Reminiscence Conversations Between Older Adults with Mild Dementia and Lay Caregivers Using a Simulated AI Agent", "url": "https://arxiv.org/abs/2611.19013", "authors": "Soumay Agarwal ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Agarwal, S., Gajula, A., Li, L., Ma, R., Martin, J., Madan, K., Brown, E., & Chen, C. (2026). MemoryLane: Supporting Reminiscence Conversations Between Older Adults with Mild Dementia and Lay Caregivers Using a Simulated AI Agent (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19013", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "軽度の認知症の高齢者と家族などの介護者の回想の会話を、写真をそろえなくても支えられるAIツールMemoryLaneを作り、関係者のフォーカスグループで評価した（抄録）。未査読。", "p3": "患者・介護者・患者の仲間役の模擬AIエージェントの三者で会話し、共有画面にエージェントと話題の思い出のAI生成画像を出す。介護者は手元のスマートフォンでエージェントの振る舞いを操作し、生成画像を調整できる（抄録）。", "p5": "認知症ケアの関係者5人の予備的なフォーカスグループで、仲間役のAIエージェントとAI生成画像の価値、介護者が画像とエージェントを調整することの実現可能性が示唆された（抄録）。", "fun": "昔の思い出を語ることは、認知症の人の心を落ち着かせる助けになる。ただ、昔の写真をそろえるのは大変で、思い出を共有していない家族は話を広げにくい。この研究では、AIが同世代の友人役として会話に加わり、話題の情景を絵にして見せる。主役はあくまで家族で、AIの動きは家族が手元で操る点が面白い。", "unverified": "評価は5人のフォーカスグループのみで、患者を交えた試用の結果は抄録からは確認できない。"}}, {"id": "pr48", "rank": 48, "headline": "テンニースの本質意志と選択意志を二重過程論に結ぶ", "title": "Ferdinand Tönnies and the Sociological Roots of Dual-Process Theories of Thinking: Cognition, Social Relations, and Modernity", "url": "https://doi.org/10.31235/osf.io/32pqx", "authors": "Jean-Sébastien Vayre", "venue": "SocArXiv", "date": "2026-11-17", "apa": "Vayre, J.-S. (2026). Ferdinand Tönnies and the Sociological Roots of Dual-Process Theories of Thinking: Cognition, Social Relations, and Modernity. https://doi.org/10.31235/osf.io/32pqx", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SocArXivの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "テンニースの本質意志と選択意志の区別を、現代の思考の二重過程論と対応づけ、心理と社会の形を合わせて説明する視点が現代の研究を豊かにすると論じた理論研究（抄録）。未査読。", "p3": "テンニースが二つの意志を共同社会（ゲマインシャフト）と利益社会（ゲゼルシャフト）の関係に結びつけた理論を再読し、性差の自然化、内省と近代の結びつけ、計算と市場関係の結びつけという3つの限界を検討した（抄録）。", "p5": "近代を、直観的・内省的な活動が育ち使われる社会的条件の変化と捉え直し、認知活動の育成・動員・社会的配分・社会技術的な委任の4つの次元からなる枠組みを提案した（抄録）。", "fun": "人には、さっと直感で決める考え方と、じっくり計算して決める考え方があるという「二重過程論」は、今の心理学や経済学でよく使われる。実は100年以上前に社会学者テンニースが、似た区別を村の共同体と都会の利益社会に結びつけていた。古典を読み直すと、現代の理論の盲点が見えるという点が面白い。", "unverified": "理論的な論考で、実証的な検証は含まない（抄録の範囲）。"}}, {"id": "pr49", "rank": 49, "headline": "職場の縄張りの喪失を測る尺度の開発", "title": "Development and Structural Validation of the Perceived Deterritorialization Scale (PDS) in Workplace Settings", "url": "https://doi.org/10.31234/osf.io/s8xjy", "authors": "Jean Frantz Bruny", "venue": "PsyArXiv", "date": "2026-11-17", "apa": "Bruny, J. F. (2026). Development and Structural Validation of the Perceived Deterritorialization Scale (PDS) in Workplace Settings. https://doi.org/10.31234/osf.io/s8xjy", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "PsyArXivの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "職場の空間を自分らしくし、状態を予測し、出入りを制御する力が弱まる「縄張りの喪失感」を測るフランス語の尺度（PDS）を開発し、3因子の構造を確かめた（抄録）。未査読。", "p3": "研究1でフランスの事務職340人に26項目を実施し、主因子法とオブリミン回転で3因子（空間的なアイデンティティの喪失、環境の不安定さ、縄張りへの侵入）を得て15項目を残した。研究2の独立した225人で確認的因子分析を行った（抄録）。", "p5": "相関する3因子のモデルが他のモデルより良く適合し（CFI=.982、RMSEA=.034）、内的一貫性はα=.818〜.840だった。個室・オープン・フリーアドレスの間で部分的なスカラー不変性の暫定的な証拠を得た。外部の妥当性と時間的安定性は今後の課題（抄録）。", "fun": "フリーアドレスの職場では、自分の机がなく、毎日どこに座れるか分からない。この研究は、そうした「自分の居場所がなくなる感覚」を、自分らしさの喪失、環境の不安定さ、縄張りへの侵入の3つに分けて測る物差しを作った。動物の縄張りの考えを人の職場に当てはめる発想が面白い。", "unverified": "収束・弁別・基準関連の妥当性と時間的な安定性は未確立（著者が明記）。"}}, {"id": "pr50", "rank": 50, "headline": "環境への取り組みと企業の財務困窮", "title": "Environmental initiatives and corporate financial distress", "url": "https://hal.science/hal-05867585v1", "authors": "Nicolae Stef ほか", "venue": "HAL", "date": "2026-11-16", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "HALの登録は題名のみで、抄録・本文とも入手できず", "preprint": true, "short": true, "p1": "題名から、企業の環境への取り組みと財務困窮の関係を調べる研究と読める。未査読。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "環境に配慮する取り組みは、会社にとってお金のかかる負担なのか、それとも将来の危機を防ぐ備えなのか。題名からは、環境への取り組みが会社の経営の行き詰まりとどう関係するかを問う研究と読める。良いことをする会社は倒れにくいのか、という素朴で大事な問いが面白い。", "unverified": "抄録・本文がなく、データ・手法・結果はすべて未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "中国の訪日自粛で日本のスポットワーク時給が低下", "title": "Trade Tensions Meet the Gig Economy: Evidence from the 2025 Halving of Chinese Travel to Japan", "url": "https://arxiv.org/abs/2611.21070", "authors": "Suguru Otani ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Otani, S., & Yang, C. (2026). Trade Tensions Meet the Gig Economy: Evidence from the 2025 Halving of Chinese Travel to Japan (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21070", "why": "2025年11月の中国の渡航自粛勧告を外生的なショックとし、日本最大のスポットワーク・プラットフォームの求人で、中国人客への依存が大きい都道府県ほど掲載時給がすぐに持続的に下がった一方、求人数・時間・雇用には頑健な変化がなかったと報告する。サービス輸出への地政学的ショックがギグ経済の労働の価格に及ぶ初めての証拠とする。"}, {"id": "pn02", "rank": 2, "field": "因果推論", "headline": "パチンコ店の開店は窃盗を増やさない", "title": "Opening a Gambling Venue Is as Harmless as Opening a Restaurant in Terms of Theft Causal Effects of Electronic Gaming Machine Venue Openings on Theft in Japan", "url": "https://doi.org/10.31235/osf.io/bnyfh", "authors": "Yuhei Yamaguchi", "venue": "SocArXiv", "date": "2026-11-17", "apa": "Yamaguchi, Y. (2026). Opening a Gambling Venue Is as Harmless as Opening a Restaurant in Terms of Theft Causal Effects of Electronic Gaming Machine Venue Openings on Theft in Japan. https://doi.org/10.31235/osf.io/bnyfh", "why": "日本のパチンコ店の開店前後の窃盗件数を、二重/脱バイアス機械学習の差の差法で分析し、窃盗の変化は見られず、効果は飲食店の開店と同等だったと報告する。賭博施設と犯罪の関係が地域や社会の文脈に依存するという議論に、これまで研究の少なかった日本の事例を加える。"}, {"id": "pn03", "rank": 3, "field": "工学", "headline": "熊本・福島県沖地震の被害から部材のベイズ脆弱性曲線", "title": "Bayesian seismic fragility curves for building components based on questionnaire damage data from the 2016 Kumamoto and 2022 Fukushima-ken Oki earthquakes", "url": "https://doi.org/10.21203/rs.3.rs-11550932/v1", "authors": "Takahiro Matsui ほか", "venue": "Research Square (In Review)", "date": "2026-11-16", "apa": "Matsui, T., Morii, T., Okazawa, R., Nishino, T., Notake, H., & Hada, A. (2026). Bayesian seismic fragility curves for building components based on questionnaire damage data from the 2016 Kumamoto and 2022 Fukushima-ken Oki earthquakes. https://doi.org/10.21203/rs.3.rs-11550932/v1", "why": "2016年熊本地震と2022年福島県沖地震で被災した24棟の質問紙調査の被害データと多質点せん断モデルの応答から、FEMA P-58の脆弱性曲線を事前情報とするベイズ推定で、日本の建物の13種類の部材について18本の経験的脆弱性曲線を作った。設計基準の異なる日本の建物に米国の曲線をそのまま当てはめる問題に答える。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "AIにさらされた職で雇用減はなく若年層だけ減少", "title": "AI and the Labor Market: Productivity Driver or Job Killer?", "url": "https://econpapers.repec.org/RePEc:ces:econpr:_61", "authors": "Oliver Falck ほか", "venue": "RePEc NEP", "date": "2026-11-16", "why": "ドイツの行政データとEU労働力調査で生成AI登場後の職業別の雇用を追い、AIにさらされた職業で広範な雇用減は見られない一方、ドイツでは20〜24歳の雇用が相対的に減り、EU全体でも自動化されやすい職で新卒採用が減る兆しがあると報告する。米国の最近の証拠と一致し、労働市場への入口の監視を勧める。"}, {"id": "pn05", "rank": 5, "field": "統計学", "headline": "パネルの反実仮想の推論を単位間の交換可能性で", "title": "Unit-Level Conformal Inference for Panel Counterfactuals", "url": "https://arxiv.org/abs/2611.19209", "authors": "Ziyi Liu ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Liu, Z., & Xu, Y. (2026). Unit-Level Conformal Inference for Panel Counterfactuals (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19209", "why": "処置単位が少ないパネルの反実仮想推定（差の差法、合成統制、行列補完など）について、時間方向ではなく単位間の予測誤差の交換可能性に基づく等角推論を提案し、非定常性などの強い時間的異質性があっても有限標本で時点ごとの信頼集合を与える。"}, {"id": "pn06", "rank": 6, "field": "機械学習", "headline": "組織で働くコーディングAIの課題完遂は8%未満", "title": "SWE-CoWork: Benchmarking Coding Agents as Digital Employees in Organizations", "url": "https://arxiv.org/abs/2611.20218", "authors": "Xinping Lei ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-17", "apa": "Lei, X., Liu, M., Zhu, R., Hu, X., Li, X., Zhang, A., Chai, W., Li, H., Wang, T., Zhang, J., Zhao, E., Shi, Y., Liang, Y., Yang, Z., Wang, X., Yao, Y., Ma, X., Li, Y., Yang, T., … Xuan, W. (2026). SWE-CoWork: Benchmarking Coding Agents as Digital Employees in Organizations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.20218", "why": "101のリポジトリで、26人の同僚がいる模擬的な開発組織にエージェントを置き、同僚と記録に分散した要件の回収と矛盾の解消を求めるベンチマークを作った。11のモデルの上位2つでも失敗していたテストの約63%は通すが課題の完遂は8%未満で、部分的な実装と完遂の大きな差を示した。"}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "地震は人を性急にし消費を増やす", "title": "Identifying Time Preference Shocks: Stated and Revealed Preferences after an Italian Earthquake", "url": "https://arxiv.org/abs/2611.19662", "authors": "Krisztina Molnar ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Molnar, K., Rondinelli, C., & Wong, P. Y. (2026). Identifying Time Preference Shocks: Stated and Revealed Preferences after an Italian Earthquake (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19662", "why": "表明された性急さと顕示された選好（消費）を同時に見ることで、時間選好のショックと資金制約を識別する枠組みを作り、2009年ラクイラ地震で被害を受けなかった家計で、性急さの表明が増え非耐久財の消費が11%増えたと報告する。心理的ストレスの経路と整合的で、ストレスに弱い人に集中する。"}, {"id": "pn08", "rank": 8, "field": "統計学", "headline": "重み付き等角p値でBH法のFDR制御は破れる", "title": "Almost Controlled: The FDR of Benjamini-Hochberg on Weighted Conformal p-Values", "url": "https://arxiv.org/abs/2611.21509", "authors": "Ryan Lim (Albert Einstein College of Medicine)", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Lim, R. (2026). Almost Controlled: The FDR of Benjamini-Hochberg on Weighted Conformal p-Values (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21509", "why": "共変量シフトに対応する重み付き等角p値をBenjamini–Hochberg法に渡すと有限標本でFDRが制御されるかという問いに、厳密な有理数計算で確かめた2つの反例で否定的に答え、目標値からの超過の上限を校正点の数・検定単位の数・重みの比で与えた。"}, {"id": "pn09", "rank": 9, "field": "心理学・認知科学", "headline": "生成AIに頼った後は自力の推論で努力を調整しにくい", "title": "Thinking With AI, Reasoning Without It: Cognitive Offloading to Generative AI Weakens Effort Regulation", "url": "https://doi.org/10.31234/osf.io/83jum", "authors": "Dawid Ratajczyk ほか", "venue": "PsyArXiv", "date": "2026-11-17", "apa": "Ratajczyk, D., Dymarska, A., Matłoka, A., Tomczyk, M., & Wiącek, M. (2026). Thinking With AI, Reasoning Without It: Cognitive Offloading to Generative AI Weakens Effort Regulation. https://doi.org/10.31234/osf.io/83jum", "why": "事前登録した実験室実験（193人）で、関係推論の課題をChatGPTの有無と成果報酬の有無で解かせ、その後AIなしでより複雑な課題と記憶テストを課した。AIの支援は最初の正答率を上げたが、後の自力の推論がやや劣る証拠があり、報酬や難しさに応じた努力の調整が弱かった。記憶への明確な影響はなかった。"}, {"id": "pn10", "rank": 10, "field": "組織行動・心理的安全性", "headline": "自発的なチーム形成を安定性の制約で説明", "title": "Team Stability: Theory and Evidence", "url": "https://arxiv.org/abs/2611.19476", "authors": "Anton Badev", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Badev, A. (2026). Team Stability: Theory and Evidence (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19476", "why": "個人が自ら協働相手を選んでチームができる過程を、合意による形成・外部性・混雑を含む理論で表し、メンバーが離脱や単独作業を望まないという安定性の制約を課した。連邦準備制度理事会のエコノミストの共同研究で、制約が観測されたチームを説明し、経験者に業務を移すと新人の研究成果と協働が増えると報告する。"}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "米大企業の社会問題への立場表明は4倍に", "title": "Corporate Stances on Societal Issues in the US", "url": "https://arxiv.org/abs/2611.19068", "authors": "Jacob Conway ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Conway, J., Hall, A., Larreboure, M., Pennec, C. L., Pons, V., & Sun, A. (2026). Corporate Stances on Societal Issues in the US (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19068", "why": "S&P500の836社について2008〜2025年の約5万2千件の記事・プレスリリースをLLMで読み、9つの党派的な争点で9,917件の立場表明を特定した。表明は2008年以降4倍に増えて2021年に最多、大半がリベラル寄りで大企業に集中し、ロビー活動や献金とは弱くしか関係せず、報道と関心の高まりに合わせて行われると報告する。"}, {"id": "pn12", "rank": 12, "field": "経営学", "headline": "規制当局の名指し公表でアプリの更新が減る", "title": "Regulatory Naming and Shaming and Product Innovation: Evidence from App Portfolios", "url": "https://doi.org/10.2139/ssrn.7694358", "authors": "Chenze Wang ほか", "venue": "SSRN", "date": "2026-11-17", "apa": "Wang, C., Xu, S., Wang, J., & Liu, S. (2026). Regulatory Naming and Shaming and Product Innovation: Evidence from App Portfolios. https://doi.org/10.2139/ssrn.7694358", "why": "利用者の権利を侵害したアプリを中国政府が公表する政策を準自然実験とし、iOSアプリのパネルで傾向スコアと差の差法を組み合わせ、名指しされたアプリの大型更新が約27.5%減る一方、同じ開発者の名指しされていないアプリでは約16.7%増えたと報告する。"}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "0.9Bから375Bまで開発履歴ごと公開したLLM群", "title": "K2-Horizon: A Frontier Fleet of Open Source Language Models", "url": "https://arxiv.org/abs/2611.21003", "authors": "K2 Team ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-17", "apa": "K2 Team, Liu, Z., Li, H., Ma, X., Moreno, A., Sahoo, S. S., Srivastava, R. K., Yurochkin, M., Abdine, H., Akhauri, Y., Babu, A., Bellamy, D., Bhandari, J., Bouch, D., Bouhedja, W., Cao, W., Chamma, A., Chang, P.-C., Chen, J., … Xing, E. P. (2026). K2-Horizon: A Frontier Fleet of Open Source Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21003", "why": "0.9Bの密モデルから375B-A23BのMoEまで6つのモデルを、中間チェックポイントを含む開発履歴ごと公開した。注意の値射影にMoEを使うMoVAなどを導入し、36B-A4Bのモデルは同じデータの32B密モデルに活性パラメータ7分の1でほぼ並ぶと報告する。"}, {"id": "pn14", "rank": 14, "field": "因果推論", "headline": "LATEの仮定が含む制約を使う条件付き尤度比検定", "title": "Never too LATE: Exploiting restrictions for inference on the Local Average Treatment Effect", "url": "https://arxiv.org/abs/2611.21496", "authors": "Xavier D'Haultf{\\oe}uille ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "D'Haultfœuille, X., Hazard, Y., & Ketz, P. (2026). Never too LATE: Exploiting restrictions for inference on the Local Average Treatment Effect (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21496", "why": "除外制約・独立性・単調性の仮定が含意する追加の制約を使い、局所平均処置効果（LATE）について、広いデータ生成過程で漸近的にサイズを一様に制御する条件付き尤度比検定を提案した。計算は軽く、弱い操作変数でもWald検定やAnderson–Rubin検定より検出力が高い。"}, {"id": "pn15", "rank": 15, "field": "工学", "headline": "地区別の被害集計からヒマラヤの組積造の脆弱性", "title": "What district damage statistics can identify: joint Bayesian inference of intensity and masonry vulnerability after the 2005 Kashmir earthquake", "url": "https://doi.org/10.21203/rs.3.rs-11509792/v1", "authors": "Syed Sajid Hussain", "venue": "Research Square (In Review)", "date": "2026-11-17", "apa": "Hussain, S. S. (2026). What district damage statistics can identify: joint Bayesian inference of intensity and masonry vulnerability after the 2005 Kashmir earthquake. https://doi.org/10.21203/rs.3.rs-11509792/v1", "why": "2005年カシミール地震の8地区・約79万戸の被害集計を、センサスの壁材とShakeMapの震度と組み合わせ、震度場を不確実とする階層ベイズで組積造の脆弱性関数を推定した。地区を除いた予測とインド側の公式統計で検証し、粗石造の脆弱性指数は欧州の基準と同程度かやや上と報告する。"}, {"id": "pn16", "rank": 16, "field": "組織行動・心理的安全性", "headline": "チーム募集では上位者に返信と成功が集中", "title": "Who Shows Up, Who Benefits, and Who Wins? Expert-Novice Disparities in Team-Seeking Forums and Competition Performance on Kaggle", "url": "https://arxiv.org/abs/2611.18983", "authors": "Ran Bi ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Bi, R., & Wei, S. (2026). Who Shows Up, Who Benefits, and Who Wins? Expert-Novice Disparities in Team-Seeking Forums and Competition Performance on Kaggle (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18983", "why": "Kaggleの「チームを探す」スレッドの2023年の18のコンペで、参加者671人の89.3%は下位層だが、上位層ほど返信を多く受け、チーム形成に成功しやすい（52.9%対32.6%）ことを示し、公開のチーム形成が既存の階層を再生産しうると報告する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "Kaggleの「チームを探す」スレッドで、公開のチーム募集が参加の機会を広げるのか既存の階層を再生産するのかを調べ、上位の利用者に返信とチーム形成の成功が集中することを示した（抄録）。未査読。", "p3": "2023年の18のコンペで、実践共同体の理論に基づき、研究1でスレッドの参加者671人の返信ネットワークを、研究2で219人の参加の痕跡と非公開の順位表の成績の関係を分析した（抄録）。", "p5": "参加者の89.3%は下位層だが、上位層は返信が多く（Kruskal–Wallis H=16.46）、チーム形成の成功率も高かった（52.9%対32.6%）。成績は提出回数（ρ=.435）と正に関連したが、スレッドでの議論とは関連しなかった（ρ=−.021）（抄録）。", "fun": "誰でも参加できる「仲間募集」の掲示板は平等に見える。ところが実際には、腕が知られた人に声がかかり、初心者は取り残されやすかった。しかも勝敗を分けたのは掲示板でのおしゃべりではなく、何度も答えを出して試す実践だった。開かれた場が自動的に公平になるわけではないという点が面白い。", "unverified": "初心者層での提出と成績の関係の推定は不精確（著者が明記）。"}}, {"id": "pn17", "rank": 17, "field": "組織行動・心理的安全性", "headline": "チームの動きを52変数のポート・ハミルトン系で予測", "title": "ANCHOR: A Port-Hamiltonian Model for Forecasting Team Dynamics in Human-in-the-Loop Systems", "url": "https://arxiv.org/abs/2611.19124", "authors": "Diana Romero ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Romero, D., & Elmalaki, S. (2026). ANCHOR: A Port-Hamiltonian Model for Forecasting Team Dynamics in Human-in-the-Loop Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19124", "why": "複合現実のヘッドセットで計測した発話・視線・位置からチームの協働を予測するため、チームを「エネルギーの器の中の球」とみなす52パラメータのスイッチ型ポート・ハミルトン系を提案し、各部分をチーム心理学の検証可能な主張に対応させた。約4万パラメータのブラックボックスと同等の精度で、会話の崩壊をAUROC 0.85で予測する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "複合現実のヘッドセットで測ったチームの協働を予測するため、チームを「エネルギーの器の中の球」とみなす52パラメータのスイッチ型ポート・ハミルトン系ANCHORを提案した（抄録）。未査読。", "p3": "誰が話し、どこを見て、誰と立っているかを入力に、器の底（チームの安定点）を最近の行動・自身の履歴・他チームの3つの源から決める。各部分をチーム心理学の検証可能な主張に対応させ、促し（プロンプト）の影響が有界になる構造を持たせた（抄録）。", "p5": "訓練に使っていない4人チームで、普段の行動からずれたチームは30秒以内に大部分戻り、32秒後のずれの残り約24%をANCHORは30%と予測した。約4万パラメータのブラックボックスと同等の精度で、会話の崩壊をAUROC 0.85で予測した（抄録）。", "fun": "チームの雰囲気が崩れかけたとき、すぐ元に戻るのか、そのまま崩れるのか。この研究は、チームを「お椀の底に向かって転がる球」にたとえた物理の式で表した。わずか52個の数字で4万個の数字を使うAIと同じくらい当てられ、しかも各数字の意味が読める。物理の考え方を人の集団に使う発想が面白い。", "unverified": "チームの数は抄録では記号のままで確認できない。促しの効果は仮定に基づくシミュレーションである。"}}, {"id": "pn18", "rank": 18, "field": "心理学・認知科学", "headline": "再現失敗後の再挑戦で再現したのは17件中5件", "title": "Estimating the replicability of psychology experiments after an initial failure to replicate", "url": "https://doi.org/10.31234/osf.io/an3yb_v2", "authors": "Veronica Boyce ほか", "venue": "PsyArXiv", "date": "2026-11-17", "apa": "Boyce, V., Prystawski, B., Abutto, A. B., Chen, E. M., Chen, Z., Chiu, H., Ergin, I., Gupta, A., Hu, C., Kemmann, B., Klevak, N., Lua, V. Y. Q., Mazzaferro, M., Mon, K., Ogunbamowo, D., Pereira, A., Troutman, J., Tung, S., Uricher, R., & Frank, M. C. (2026). Estimating the replicability of psychology experiments after an initial failure to replicate. https://doi.org/10.31234/osf.io/an3yb_v2", "why": "最初の追試で再現できなかった心理学の17の実験を再び追試し、5件（29%）で元の結果がおおむね再現されたが効果量は小さく、12件は再び失敗したと報告する。明らかな弱点のない失敗の後は、その効果の追究をやめるのが効率的かもしれないと論じる。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "最初の追試で再現できなかった心理学の17の実験を再び追試し、5件（29%）で元の結果がおおむね再現されたが、12件は再び失敗したことを報告した（抄録）。未査読。", "p3": "一度再現に失敗した実験について、「救出」のための2度目の追試を17件行い、元の結果の再現の程度を判定した（抄録）。", "p5": "再現した5件でも効果量は小さかった。成功は標本の大きさや注意確認などの方法の変更によるかもしれないと推測し、失敗した追試に明らかな弱点がなければ、1回の失敗で追究をやめるのが効率的かもしれないと論じる（抄録）。", "fun": "心理学の有名な実験を追試すると、再現できないことが少なくない。では一度失敗したら、もう一度試すべきか。17件で再挑戦すると成功は3割弱で、それも効果は小さかった。科学の限られた時間とお金をどこに使うかという、研究の進め方そのものに答えようとしている点が面白い。", "unverified": "17件の実験の内訳と、成功と判定した基準の詳細は抄録からは確認できない。"}}, {"id": "pn19", "rank": 19, "field": "心理学・認知科学", "headline": "臨床心理の力学系研究に高次元の呪い", "title": "The Curse of Dimensionality: How Does it Affect Dynamical Systems Research in Clinical Psychology?", "url": "https://doi.org/10.31234/osf.io/8uyv7", "authors": "Jingmeng Cui", "venue": "PsyArXiv", "date": "2026-11-17", "apa": "Cui, J. (2026). The Curse of Dimensionality: How Does it Affect Dynamical Systems Research in Clinical Psychology? https://doi.org/10.31234/osf.io/8uyv7", "why": "臨床心理学で広がる力学系アプローチが低次元の安定性の地形に頼っていることを指摘し、高次元の地形が直観と食い違う可能性と、安定性と遷移の情報を保つ低次元の記述という解決策、次元縮約を中心とする研究課題を提案する。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "臨床心理学の力学系アプローチが多変数を想定しながら低次元の安定性の地形に頼っているずれを指摘し、高次元の問題と次元縮約による解決策を論じた（抄録）。未査読。", "p3": "高次元の安定性の地形が低次元から得た直観とどう食い違いうるかを議論し、安定性と遷移の情報を保つ「十分な低次元の記述」を解決策として示した（抄録）。", "p5": "安定性と遷移の情報を保つ次元縮約の手法を中心とする、今後の研究課題を提案した（抄録）。", "fun": "心の状態を「谷と山のある地形を転がる球」にたとえ、うつ状態は深い谷に落ちた状態だ、と説明することがある。ところが心は何十もの要素からなり、高次元の地形は2次元の絵とは性質が大きく違う。直観に頼りすぎず、大事な情報を残したまま次元を減らす必要がある、という指摘が面白い。", "unverified": "理論的な論考で、具体的な数値例は抄録からは確認できない。"}}, {"id": "pn20", "rank": 20, "field": "経営学", "headline": "運用者の大学の授業内容が運用成績を左右", "title": "Education and Investment Skill: Evidence from Mutual Fund Managers&nbsp;", "url": "https://doi.org/10.2139/ssrn.7694303", "authors": "Vasudha Nair", "venue": "SSRN", "date": "2026-11-16", "apa": "Nair, V. (2026). Education and Investment Skill: Evidence from Mutual Fund Managers&nbsp; https://doi.org/10.2139/ssrn.7694303", "why": "約7万5千のシラバスから大学の教育の「運用実務への関連性」と「研究への適時性」を測り、どちらも1標準偏差高いと年率約0.5ポイント高いリターンと関連し、高校に最も近い大学の値を操作変数にしても結果が保たれると報告する。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "投資信託の運用者が卒業した大学の授業内容が運用成績を説明するかを約7万5千のシラバスで調べ、実務への関連性と研究への適時性がともに高いリターンと関連することを示した（抄録）。未査読。", "p3": "シラバスから「運用実務への関連性」と「同時代の研究への適時性」を測って運用成績との関係を推定し、運用者の高校に最も近い大学の値を操作変数に使った（抄録）。", "p5": "どちらの指標も1標準偏差高いと年率約0.5ポイント高いリターンと関連し、操作変数でも結果が保たれた。関連性の高い教育はアナリストの多い銘柄で、適時性の高い教育はアナリストの少ない銘柄で高いリターンと関連した（抄録）。", "fun": "大学で何を習ったかが、何年も後の仕事の成績に表れるのか。この研究は大学の授業の計画書（シラバス）を7万枚以上読み、実務に役立つ内容と、最新の研究を取り入れた内容の両方が、運用成績の高さと結びつくことを示した。授業の中身を数値にして職業の成果と結ぶ発想が面白い。", "unverified": "シラバスの内容を測る方法（テキスト分析の手順）は抄録からは確認できない。"}}, {"id": "pn21", "rank": 21, "field": "経営学", "headline": "誰も読まない開示が投資信託の行動を律する", "title": "The Hidden Work of Disclosures", "url": "https://doi.org/10.2139/ssrn.7709199", "authors": "Timothy D. Lytton ほか", "venue": "SSRN", "date": "2026-11-16", "apa": "Lytton, T. D., & Tucker, A. M. (2026). The Hidden Work of Disclosures. https://doi.org/10.2139/ssrn.7709199", "why": "投資顧問・運用者・コンプライアンス担当・弁護士への面接から、投資信託の開示は投資家に読まれる前の作成・審査の過程で専門職の規範と法的監督を働かせ、商品設計や運用を律していると論じ、開示は無効だという通説に反論する。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "投資家のほとんどが読まない投資信託の開示にも、作成・審査の過程で運用会社の行動を律する効果があると、関係者への面接から論じた法学の論文（抄録）。未査読。", "p3": "投資顧問、運用者、コンプライアンス担当、ファンドの弁護士への独自の面接を行い、開示の作成・審査・改訂の過程で何が起きているかを調べた（抄録）。", "p5": "開示の作成過程が専門職の規範・法的な監督・組織の手順を働かせ、商品設計・販売・運用・法令遵守を形づくると示した。「言う通りにやり、やる通りに言う」という規範による共同規制と捉え直し、公的な監督が弱まっても事前に投資家を守りうると論じる（抄録）。", "fun": "取扱説明書や約款のように、誰も読まない書類に意味はあるのか。この研究は、読まれるかどうかではなく「書く過程」に効果があると主張する。会社の中で弁護士や担当者が「本当にこの通りにやっているか」を確かめ合う過程そのものが、行動を正しているというのだ。書類の価値を書き手の側から見る点が面白い。", "unverified": "面接の人数と分析の方法は抄録からは確認できない。"}}, {"id": "pn22", "rank": 22, "field": "経営学", "headline": "インフルエンサーの「役立つ嘘」が厚生を上げる", "title": "Truths, Half-truths and Helpful Lies: Crafting Influencer Strategy using Information Design", "url": "https://doi.org/10.2139/ssrn.7691622", "authors": "Sridhar Balasubramanian", "venue": "SSRN", "date": "2026-11-17", "apa": "Balasubramanian, S. (2026). Truths, Half-truths and Helpful Lies: Crafting Influencer Strategy using Information Design. https://doi.org/10.2139/ssrn.7691622", "why": "ベイズ説得の情報設計で、第三者の口コミサイトが良い組み合わせを悪いと判定する誤りがある市場での最適なインフルエンサー戦略を導き、その誤りが小さいときは消費者厚生を最大にするインフルエンサーが悪い組み合わせを良いと伝える「役立つ嘘」で普及不足を補うと示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "独立した口コミサイトが誤る市場での最適なインフルエンサー戦略を、ベイズ説得に基づく情報設計で導き、口コミサイトの誤りの大きさで最適な戦略が切り替わることを示した（抄録）。未査読。", "p3": "評判を気にする口コミサイトは良い組み合わせの商品を悪いと判定する誤り（第2種の誤り）をし、インフルエンサーは手数料と消費者厚生の兼ね合いで偏った評価を投稿するとして、企業の起用・契約・価格の選択を内生化したモデルを解いた（抄録）。", "p5": "誤りが小さいときは消費者厚生を最大にするインフルエンサーを使うのが最適で、その人は悪い組み合わせを良いと伝える「役立つ嘘」で普及不足を補う。誤りが中程度なら販売志向のインフルエンサーを手数料で動かし、大きいとインフルエンサーを使わない（抄録）。", "fun": "口コミサイトは、合う人には良い商品を「合わない」と言ってしまうことがある。それを補うために、インフルエンサーがときに「合わない人にも合う」と言う小さな嘘が、全体ではみんなを得させる場合がある。正直が常に最善とは限らないという結論を数式で示した点が意外で面白い。", "unverified": "モデルの数値例や実データでの検証の有無は抄録からは確認できない。"}}, {"id": "pn23", "rank": 23, "field": "因果推論", "headline": "話題のゲームの効果を経路別に分解", "title": "From Viral Exposure to Engagement: A Causal Mediation Framework for Digital Platforms", "url": "https://arxiv.org/abs/2611.18945", "authors": "Bolun Liu ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Liu, B., Manthena, V., Toh, W., & Zheng, W. (2026). From Viral Exposure to Engagement: A Causal Mediation Framework for Digital Platforms (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18945", "why": "Robloxで、話題のゲームのプレイ時間がその後の利用に与える効果を、交流や発見の行動を介する間接効果と直接効果に分ける因果媒介の枠組みを作った。交差適合のR-learnerで経路ごとの効果を共変量の関数として推定し、平均する前に個人ごとの偏りの補正を加える。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "Robloxで、話題のゲームのプレイ時間がその後の利用に与える効果を、交流と発見の行動を介する間接効果と直接効果に分ける因果媒介の枠組みを作り、2つのゲームに適用した（抄録）。未査読。", "p3": "因果DAGで仮定を明示し、共変量・曝露・媒介・結果を重ならない時間窓で測る設計で、交差適合のR-learnerで各経路の効果を共変量の関数として推定し、平均の前に個人ごとの偏り補正（Chernozhukovら2018）を加えた（抄録）。", "p5": "シミュレーションで補正は被覆率を90〜95%に戻した（曲面を平均するだけでは最大39%）。実データでは、その後の利用は話題作への曝露だけでは説明できず、話題作内の利用の46%を交流行動が、他のゲームの利用の52%を新しいゲームの発見が媒介した（抄録）。", "fun": "大ヒットしたゲームで遊んだ人は、その後もたくさん遊ぶようになるのか。それはヒット作そのものの力か、友達と遊ぶようになったからか、別のゲームを見つけたからか。この研究は効果の通り道を分けて測った。データが増えるとかえって信頼区間が外れやすくなる場合があるという発見も意外で面白い。", "unverified": "2つのゲームの名前と、識別の仮定が満たされるかの検証の詳細は抄録からは確認できない。"}}, {"id": "pn24", "rank": 24, "field": "因果推論", "headline": "事実と反事実を同時に学ぶ因果PFN", "title": "Joint Learning of Factual and Counterfactual Worlds for Causal Prior-data Fitted Networks", "url": "https://arxiv.org/abs/2611.19710", "authors": "Furkan Danisman ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Danisman, F., Zhang, L., Jin, Z., & Kong, D. (2026). Joint Learning of Factual and Counterfactual Worlds for Causal Prior-data Fitted Networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.19710", "why": "合成データで事前学習する因果のPFN（事前データ適合ネットワーク）は両方の世界の結果を生成できるのに、学習目標が単位ごとに一方の結果しか使っていなかったと指摘し、事実と反事実の世界を同時に学習して、処置効果の分布の依存構造を捉える方法を提案する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "合成データで事前学習する因果のPFN（事前データ適合ネットワーク）を、単位ごとの事実と反事実の結果の同時分布を学ぶ「同時学習」で訓練し、応答・個別処置効果・平均処置効果の3つの密度を世界間の依存を考慮して得られるようにした（抄録）。未査読。", "p3": "既存の因果PFNは合成データでも単位ごとに一方の世界の結果しか学ばず、両世界の依存が失われ独立が仮定されていたと指摘し、同時分布を学習させ、推論時には単位間の最適輸送で平均処置効果の密度を近似した（抄録）。", "p5": "既存の因果PFNに同時学習と最適輸送を加え、半合成・合成・実データのベンチマークで評価し、多くの設定で点推定と不確実性の定量化が基準より有意に改善した（抄録）。", "fun": "薬を飲んだ人が、飲まなかったらどうなっていたかは、現実には決して観察できない。ところが計算機の中で作った架空の世界なら、両方の結果を同時に作れる。この研究は、その「両方が見える」利点を学習に生かし切っていなかった既存の方法を改めた。現実ではできないことを訓練の段階で活用する発想が面白い。", "unverified": "ベンチマークごとの改善の大きさは抄録からは確認できない。"}}, {"id": "pn25", "rank": 25, "field": "因果推論", "headline": "二つの環境の差で予測を頑健にする因果正則化", "title": "Causal Regularization for Robust Prediction", "url": "https://arxiv.org/abs/2611.18814", "authors": "Alessia Berarducci ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Berarducci, A., Lembo, M., Vinciotti, V., & Wit, E. C. (2026). Causal Regularization for Robust Prediction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18814", "why": "学習データに2次モーメントの有限性だけを仮定し、2つの環境の共変量と応答の2次モーメントの違いで定めた一般化リスク差から、分布の変化に頑健な予測を得る因果正則化を一般化した。OLSと正則化の極限を補間する閉じた形の推定量を導く。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "学習データに2次モーメントの有限性だけを仮定し、2つの環境の差を使って分布の変化に頑健な予測を得る因果正則化を一般化した（抄録）。未査読。", "p3": "共変量と応答の2次モーメントの変化から定めた一般化リスク差で2つの環境の違いを測り、環境外の分布の篩を定めて最悪リスクを分解し、OLSと正則化の極限解の間を補間する閉じた形の推定量を導いた（抄録）。", "p5": "提案した推定量は限られた環境で学習しても広い摂動環境で予測を安定させうる。内積の不変性と、原因となる変数を与えたときの条件付き平均の不変性のもとで、因果的な解釈が回復する（抄録）。", "fun": "ある病院のデータで作った予測を別の病院で使うと、うまくいかないことがある。環境が変わっても崩れにくい予測を作るのが頑健な予測だ。この研究は、二つの環境のずれ方から「ずれに強い方向」を学び、ふつうの回帰と強い正則化の中間を選ぶ式を作った。頑健さと因果を別の目標として分けて考える点が面白い。", "unverified": "数値実験やデータでの検証の結果は抄録からは確認できない。"}}, {"id": "pn26", "rank": 26, "field": "因果推論", "headline": "為替介入は識別の良い研究ほど効果が明確", "title": "Does Foreign Exchange Intervention Move Exchange Rates? Evidence Ranked by Identification Strategy", "url": "https://doi.org/10.31235/osf.io/wp7bg", "authors": "Alain Naef", "venue": "SocArXiv", "date": "2026-11-16", "apa": "Naef, A. (2026). Does Foreign Exchange Intervention Move Exchange Rates? Evidence Ranked by Identification Strategy. https://doi.org/10.31235/osf.io/wp7bg", "why": "中央銀行は通貨が圧力を受けているときに介入するため単純な推定は効果を0に近づけると論じ、9つの実証デザインを識別の信頼性で順位づけて50年分の証拠を読み直し、信頼性の高いデザインほど介入が意図した方向に数分から数週間効くという結果が明確になると示した。", "explain": {"basis": "抄録", "basis_note": "SocArXivの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "為替介入が為替相場を動かすかという長年の論争で、証拠が食い違って見えるのは識別の問題だと論じ、識別の信頼性で研究デザインを順位づけて50年分の証拠を読み直した（抄録）。未査読。", "p3": "中央銀行は通貨が既に圧力を受けているときに介入するため単純な推定は効果を0に近づけ、符号を反転させることもあると指摘し、日次のイベントスタディから高頻度データ、回帰不連続、合成統制までの9つのデザインを、この偏りへの対処の良さで順位づけた（抄録）。", "p5": "信頼性の高いデザインほど結果が明確で、介入は数分から数週間、意図した方向に相場を動かす。効果の持続、秘密介入の役割、介入の費用は未解決で、政策の組み合わせ・外貨準備・ドルの支配に依存する（抄録）。", "fun": "中央銀行は円安が進んで困ったときに介入する。だから介入の直後も円安が続いていると、「介入は効かない」ように見えてしまう。この研究は、こうした見かけのからくりにどれだけ対処できているかで過去の研究を並べ直し、信頼できる研究ほど「効く」と示した。結論より、証拠の読み方を変えた点が面白い。", "unverified": "9つのデザインの具体的な順位と、読み直した研究の数は抄録からは確認できない。"}}, {"id": "pn27", "rank": 27, "field": "経済学", "headline": "農業債務の免除で家計は出稼ぎから地元の起業へ", "title": "Business Debt Relief and the Reallocation of Household Labor", "url": "https://doi.org/10.2139/ssrn.7694858", "authors": "Naman Nishesh", "venue": "SSRN", "date": "2026-11-16", "apa": "Nishesh, N. (2026). Business Debt Relief and the Reallocation of Household Labor . https://doi.org/10.2139/ssrn.7694858", "why": "インドの大規模な農業債務免除の適格基準の準無作為性を使い、銀行の行政記録と事業登録を結びつけ、免除対象の家計が都市への出稼ぎ労働を減らし、地元での小規模事業の借入と非農業の起業を増やしたと報告する。農場単位の評価では見えない便益を示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "インドの大規模な農業債務の免除で、家計が都市への出稼ぎを減らして地元での非農業の起業を増やし、農場単位の評価では見えない便益があることを示した（抄録）。未査読。", "p3": "2つの大規模な債務免除の適格基準による準無作為な差を利用し、銀行の行政記録を事業登録と結びつけ、免除対象の家計と比較可能な非対象の家計を比べた（抄録）。", "p5": "免除対象の家計は都市の賃金労働への依存を減らし、出稼ぎしていた人は戻る傾向があった。同じ家計は小規模事業の借入を増やし、地元で非農業の事業をより多く始めた。影響の大きい地区では事業の創出と経済活動も増えた（抄録）。", "fun": "借金を帳消しにしても農業の生産性は上がらない、という謎があった。この研究は、家族が借金から解放されると、都会への出稼ぎをやめて地元で小さな商売を始めることを見つけた。効果は畑の中ではなく家族の働き方の変化に表れていたのだ。評価する場所を変えると見えるものが変わる好例として面白い。", "unverified": "効果の大きさの数値は抄録からは確認できない。"}}, {"id": "pn28", "rank": 28, "field": "経済学", "headline": "犯罪組織からの領域奪還で零細事業の所得が13%増", "title": "The Economic Returns to Restoring State Control: Informal Businesses and Security Policy in El Salvador", "url": "https://doi.org/10.2139/ssrn.7691958", "authors": "Johann Caro-Burnett ほか", "venue": "SSRN", "date": "2026-11-17", "apa": "Caro-Burnett, J., & Ayala, R. (2026). The Economic Returns to Restoring State Control: Informal Businesses and Security Policy in El Salvador. https://doi.org/10.2139/ssrn.7691958", "why": "エルサルバドルの地理的に絞った治安計画の段階的な導入と2015〜2025年の家計調査から、インフォーマルな自営業の実質月収が約13%増え、時間当たり所得も増えたと推定した。2022年以降も約15%の増加が続き、治安の認識も改善したと報告する。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "エルサルバドルで犯罪組織の支配地域を国家の管理下に戻す治安計画（PCT）が、インフォーマルな自営業の所得を約13%増やしたと推定した（抄録）。未査読。", "p3": "地理的に絞った治安計画の段階的な導入と、2015〜2025年の家計調査を用いて、優先された自治体と比較対象の自治体を比べた（抄録）。", "p5": "自営業の実質月収は約13%増え、事業の収入と時間当たり所得も増えたが、労働時間に有意な変化はなかった。2022〜2025年も約15%の増加が続いたが差はそれ以上広がらず、強盗・暴行の減少と治安の認識の改善は優先自治体で大きかった（抄録）。", "fun": "ギャングが地域を支配していると、店を出しても客が来られず、みかじめ料も取られる。治安が戻ると小さな商売の稼ぎはどれだけ増えるのか。この研究は、警察の計画が地域ごとに順に始まったことを利用して、その効果を約13%と見積もった。治安を経済の視点から測る点が面白い。", "unverified": "推定に使った具体的な手法（差の差の種類）は抄録からは確認できない。"}}, {"id": "pn29", "rank": 29, "field": "経済学", "headline": "ドラマの聖地化で観光は急増したが雇用は増えず", "title": "A Game of Throngs: How Spotlight Tourism Reshapes Local Economies", "url": "https://arxiv.org/abs/2611.21364", "authors": "Mafalda Batalha ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Batalha, M., & Viviens, J. (2026). A Game of Throngs: How Spotlight Tourism Reshapes Local Economies (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21364", "why": "2017年に『ゲーム・オブ・スローンズ』の舞台になったバスクの礼拝堂を外生的なショックとし、行政データと合成統制法で、観光は急増したが観光関連の雇用増は他部門の減少で相殺され総雇用は変わらず、住宅市場の過熱の兆候があったと報告する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "ドラマの撮影地になって観光客が急増したスペインの小さな礼拝堂の地域で、観光は急増したが総雇用は増えず、住宅市場の過熱の兆しがあったことを示した（抄録）。未査読。", "p3": "2017年7月に『ゲーム・オブ・スローンズ』に登場したバスクのサン・フアン・デ・ガステルガチェを外生的なショックとし、新しい行政データと合成統制法で地域経済への因果効果を推定した（抄録）。", "p5": "観光活動は先行研究を大きく上回るほど急増したが、観光関連の雇用の増加は他部門の減少でほぼ相殺され、総雇用への効果はなかった。不動産の取引件数と価格が上がり、住民の流出は見られず、外国からの転入が約2倍になった（抄録）。", "fun": "ある日突然、テレビドラマのおかげで小さな村が世界的な観光地になる。地元は豊かになったのだろうか。調べると、観光の仕事は増えたが他の仕事が減り、全体の働き口は変わらなかった。代わりに家の値段が上がった。観光ブームが必ずしも地元の暮らしを広く良くするわけではないことを示した点が面白い。", "unverified": "対象地域の範囲と合成統制の比較地域は抄録からは確認できない。"}}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "AIの高度化は価格の情報効率を下げうる", "title": "The opposing informational effects of AI trading", "url": "https://arxiv.org/abs/2611.18872", "authors": "Hajime Shimao", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "apa": "Shimao, H. (2026). The opposing informational effects of AI trading (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18872", "why": "資源の限られた予測を行う競争市場で、高性能なアルゴリズムが私的観察を公開記録の分析で代替し、価格に集約される私的情報が減る効果と、高度な分析を他の投資家に伝える効果が共存する条件を示した。神経ネットによる市場実験では、普及が進むと性能向上の利得が44%下がった。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "AIの性能向上が個々の予測を良くしても、価格が新しい情報を伝える力を高めるとは限らず、私的情報の集約を減らす効果と高度な分析を伝える効果が共存することを示した（抄録）。未査読。", "p3": "資源の限られた予測を行う競争市場のモデルで、2つの効果が共存し、さらなる計算の私的な便益が下がる条件を示し、数値的な均衡計算、有限データの神経ネットの市場実験、利益予想と言語モデルの統制課題で確かめた（抄録）。", "p5": "神経ネットの実験では、普及が進むと限られた観察者にとって価格の予測力は上がるが高度な観察者には下がり、性能向上の便益は44%下がった。性能向上しなかった投資家の再学習は私的情報の精度の低下を増幅しうる（抄録）。", "fun": "株の売買にAIを使う人が増えると、みんなが公開データの分析に頼り、自分だけが知る現場の情報を集めなくなるかもしれない。すると株価は、隠れた情報を映す鏡としての力を失う。一方で、分析の結果は株価を通じてAIを持たない人にも伝わる。AIの普及が市場の「知恵」を増やすとは限らないという指摘が面白い。", "unverified": "モデルの具体的な仮定と実証の詳細は抄録からは確認できない。"}}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "学習データへの対価支払いがAIによる代替を進める", "title": "Paying Creators for Training Data Can Increase AI Displacement", "url": "https://arxiv.org/abs/2611.20204", "authors": "Lijuan Luo ほか", "venue": "arXiv", "date"
