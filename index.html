<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

高く評価してしまう、つまり知らないふりがうまくできないことが分かりました。実在の名前とよく似た架空の名前を並べ、その差で「隠れた知識」を測る工夫は、テストで答えを知っているかを見破る方法にも似ています。", "unverified": "5つのAPIの具体的なモデル名と、条件ごとの試行数の内訳。"}}, {"id": "pr02", "rank": 2, "headline": "合議しても偏りは消えない「格差洗浄」", "title": "Disparity Laundering: Consensus Without Fairness in Clinical Multi-Agent Systems", "url": "https://doi.org/10.48550/arxiv.2610.38215", "authors": "Xiaoyang Wang ほか", "venue": "arXiv (Cornell University)", "date": "2026-10-28", "apa": "Wang, X., Wang, T., & Yang, C. C. (2026). Disparity Laundering: Consensus Without Fairness in Clinical Multi-Agent Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.38215", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法・結果・考察・結論・限界の節、付録A・C、表のキャプション）を読んだ", "preprint": true, "p1": "臨床のLLMマルチエージェントの合議は個々のエージェントの人種による偏りを打ち消さず、中立な合意に見せかけて残す（格差洗浄、disparity laundering）ことを示し、それを閉じる介入条件を特定した（抄録、§6）。", "p2": "合議は個々の誤りを平均化すると想定されてきたが、偏りも平均化されるかは検証されていなかった。モデル単位・出力単位の監査では、チームが確定した決定の格差は見えない（§1、§5）。", "p3": "MIMIC-IV-EDの救急受診120例を、患者の人種の記述だけを入れ替えた5版（白人・黒人・ヒスパニック・アジア系・記述なし）にし（付録A.1）、5つのモデル系統×4つの集約トポロジー（合議の構造）の全組合せで、トリアージ（ESI）の版間の差を比べる（§3）。", "p4": "評価は、同じ症例の版の間で確定したトリアージの差（黒人−白人など）と、正解の重症度に対する誤差（表2）。モデルはQwen3-32B、Mistral Small 3.1、MedGemma 27B、Phi-4などをvLLMで動かし、各セル3シード（付録A.2）。", "p5": "単体のモデルでも人種の入れ替えで6.2〜10.6%の判定がESI1段階以上変わり、黒人患者をより急性と判定した（§4.1）。20セルすべてで個々の独立回答の偏りの向きがそのまま確定し、公平性の指示や属性の伏せ字は差を縮めず、各エージェントの自己脱バイアスは差を広げた（抄録、付録C.5）。多様な視座を毎ラウンド集める合議では差が67〜94%減った（抄録）。", "p6": "著者は、症例数120・各セル3シードという規模、対象とした人種カテゴリの範囲を限界に挙げる（Limitations）。残る疑問：救急トリアージ以外の判断や、人間の専門家を含むチームでも同じ現象が起きるか。", "fun": "何人かで相談して決めれば、一人の偏った考えは薄まると思いがちです。ところがAIどうしの話し合いでは、全員が同じ方向に少しずつ偏っていると、その偏りが「みんなで決めた公平な結論」に見えて残ってしまいました。人種だけを入れ替えた同じ患者の話を並べて比べ、初めて偏りが見えるという点が、公平さを確かめる難しさをよく表しています。", "unverified": "5つ目のモデル系統（Llama）のチェックポイント名と、トポロジーごとの格差の数値。"}}, {"id": "pr03", "rank": 3, "headline": "モード解析で損傷位置は分かるが早期警報は難しい", "title": "Modal Analysis for Damage Localization in 2D Structures: Localization Works, Early Warning Does Not", "url": "https://doi.org/10.5281/zenodo.23835089", "authors": "Avtonomov, Petr", "venue": "Zenodo", "date": "2026-10-31", "apa": "Avtonomov, P. (2026). Modal Analysis for Damage Localization in 2D Structures: Localization Works, Early Warning Does Not. Zenodo. https://doi.org/10.5281/ZENODO.23835089", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録のみ。本文は入手できず", "preprint": true, "p1": "疎なセンサ配置の2次元膜で、モード解析は欠陥の位置特定には使えるが早期警報には使えないことを数値で示した（抄録）。", "p2": "振動計測による構造ヘルスモニタリング（SHM）が、小さな欠陥を初期段階で検出できるのか、それとも既にある損傷の位置を示すだけなのかが問題になる（抄録）。", "p3": "膜を離散化したグラフラプラシアンで表し、欠陥を弱めた辺の集合としてモデル化した。振動数変化、モード保証基準（MAC）、モード形の曲率の3つの検出指標を比べた（抄録）。背景：曲率はモード形の2階微分で、局所的な剛性低下で鋭く変わる。", "p4": "損傷の程度を変えたときの各指標の変化（早期警報になるか）と、2次元の地図上で欠陥位置にピークが立つか（位置特定）で評価した（抄録）。センサ数・欠陥の大きさの具体値は未確認。", "p5": "振動数変化は欠陥が重くなってから増え、MACはモードの混ざりで情報のない平坦域に落ち、曲率は中程度の損傷でのみピークをもつため、どれも早期警報にならなかった。一方、1次モードの曲率は、センサのない場所でも欠陥位置に鋭いピークを示した（抄録）。", "p6": "結論は「この形状で、センサ密度が低く欠陥が小さいとき」に限られると著者自身が述べる（抄録）。残る疑問：実構造・実測ノイズのもとでも同じか。本文がなく図表は未確認。審査のない置き場の文書である。", "fun": "太鼓の皮に小さな傷があると、音の高さは少しだけ変わります。この研究では、傷が小さいうちは音の高さの変化だけでは気づけないけれど、揺れの形の「曲がり具合」を調べると、センサのない場所でも傷の位置が浮かび上がることが示されました。「見つける」ことと「場所を当てる」ことは別の能力だ、という切り分けが面白い点です。", "unverified": "センサ数・欠陥の大きさ・ノイズ条件など数値設定のすべて（抄録のみのため）。"}}, {"id": "pr04", "rank": 4, "headline": "どの生成器でも復号できる差分プライバシー合成表", "title": "CoRTeC: A Differentially Private Release for Synthetic Tabular Data, Decodable by Any Generator", "url": "https://doi.org/10.5281/zenodo.23812612", "authors": "Nnona, Calister", "venue": "Zenodo", "date": "2026-10-31", "apa": "Nnona, C. (2026). CoRTeC: A Differentially Private Release for Synthetic Tabular Data, Decodable by Any Generator (Version 1.2.5). Zenodo. https://doi.org/10.5281/ZENODO.23812612", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Zenodoに置かれた導入ガイドのPDF（構成図・パラメータ表・統制と失敗モードの表）を読んだ。精度の数値は抄録による", "preprint": true, "p1": "共有できない個票（病院の患者記録など）を、差分プライバシーの保証つきの「小さな雑音入り集計ファイル」として一度だけ公開し、誰でも追加のプライバシー費用なしに合成データを作れるようにした（抄録）。", "p2": "有用なモデルを学習できる記録ほど機関外に出せない。合成データ生成器に実データを触れさせる方式では、何が漏れるかの確認や審査が難しい（抄録）。", "p3": "プライバシー予算εを一度だけ、分類器の学習用に設計した集計（群の大きさ、結果の比率、結果別の各列ヒストグラム、重ならないセルごとの結果率）に使う。審査者は持ち出し前に全数値を確認できる。復号は最大エントロピー法でも、凍結した言語モデルでもよく、どれも実記録を見ない。最後に生成行を公開集計に合わせる選択段階がある（抄録、図1）。", "p4": "同じ大きさの実標本で学習した分類器とのAUCの差で評価し、Adult、NHANES、bank marketingのデータで3つの分割にわたって比べた（抄録）。", "p5": "言語モデルなしで復号した自動設定の公開（ε=2）は、Adultで実標本との差0.02 AUC以内、選択段階なしのNHANESとbank marketingで0.05 AUC以内だった（抄録）。ガイドの表2では、ε=2で抑制下限の条件付きセルの結果率は約0.1以内に保たれ、ε=1と0.5では約0.2と0.4とされる（表2）。", "p6": "読めたのは導入ガイドで、論文本体の実験節は未確認。対象は分類用途の表データに限られる。残る疑問：多数の列の結合分布や時系列（例：仕訳の並び）をどこまで保てるか。審査のない置き場の文書である。", "fun": "病院のカルテのような大切なデータは外に出せませんが、「何人がどの年齢で、病気の割合はいくつ」といった数え上げなら、少しノイズを混ぜれば個人を守れます。この方法は、その数え上げ表だけを外に出し、そこから何度でもそっくりなデータを作り直せるようにしました。実データを一度もAIに見せない点が面白いところです。", "unverified": "5つの言語モデルで復号した場合の個別の精度、論文本体の実験設定。"}}, {"id": "pr05", "rank": 5, "headline": "頼まれなくてもLLMは議論を始めるか", "title": "When No One Asks Them to Debate: Autonomous Communication Initiation and Coordination Outcomes in Homogeneous LLM Multi-Agent Systems", "url": "https://doi.org/10.5281/zenodo.23839096", "authors": "Yue, Xuanhuang", "venue": "Zenodo", "date": "2026-10-31", "apa": "Yue, X. (2026). When No One Asks Them to Debate: Autonomous Communication Initiation and Coordination Outcomes in Homogeneous LLM Multi-Agent Systems. Zenodo. https://doi.org/10.5281/ZENODO.23839096", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "Zenodoに置かれた本文PDF（条件設定・事象順序の結果・図2・3と表1・2のキャプション）を読んだ", "preprint": true, "p1": "同じモデルの4エージェントに自由な通信を許しても、答えの候補が出る前にはほとんど話し合わず、協調は公開された候補の審査の周りで起きることを、事象ログで示した（抄録）。", "p2": "マルチエージェントの性能差が、独立に何回も生成した効果なのか、情報交換の効果なのかは、最終得点だけでは区別できない（抄録）。", "p3": "3条件を比べる。C1：4つの同質なエージェントに任意の宛先つき通信と候補の審査の仕組みを与える。C1-F：最初の完了行動の前に課題に関わるメッセージを1通以上送ることを求める。C4：互いに見えない4インスタンスが独立に答える参照条件（抄録、図1、表1）。", "p4": "Professional Reasoning Bench（PRBench）の課題で、事象ログ（送信と候補提案の順序）と基準ごとの得点を記録した。正式な30課題と、拡張の90課題（C1）、厳密に対応する25課題で比較した（抄録、表2）。", "p5": "候補提案の前に通常の通信があったのは、正式30課題でC1は1課題、C1-Fは27課題。拡張90課題のC1でも5課題だった。C1の正式バッチの92提案のうち65が後で無効化された（抄録）。対応25課題ではC1-FがC1より高い課題9、同じ5、低い11で、平均差−3.32点、中央値0.00点と、通信を義務づけても得点は改善しなかった（図2）。", "p6": "課題間のばらつきが大きく（C4平均8.93〜70.59点）、標本が小さい（図2）。同質モデル・情報対称・最小限の足場という条件に限られる。残る疑問：異なる視座や情報を持つエージェントなら事前の議論が起きるか。審査のない置き場の文書である。", "fun": "AIを4人集めて「相談してもいいよ」と言っても、ほとんど相談せずにそれぞれ答えを出し、出てきた答えにあとから文句をつけ合っていました。相談を義務にしても点数は上がりませんでした。グループ学習で全員が同じ教科書しか持っていないと話し合う意味が薄い、という人間の経験とも重なる結果です。", "unverified": "使用した基盤モデルの名前。"}}, {"id": "pr06", "rank": 6, "headline": "LLMによる評定をシミュレーションで検証", "title": "Evaluating Ratings from Large Language Models: A Simulation-Based Workflow", "url": "https://doi.org/10.31234/osf.io/xphm9_v2", "authors": "Tim Angelike ほか", "venue": "PsyArXiv", "date": "2026-10-31", "apa": "Angelike, T., & Heck, D. W. (2026). Evaluating Ratings from Large Language Models: A Simulation-Based Workflow. https://doi.org/10.31234/osf.io/xphm9_v2", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "OSFの本文PDF（ワークフロー、分散成分の結果、図1・2と表1のキャプション）を読んだ", "preprint": true, "p1": "LLMに文章の心理的特徴を評定させるとき、プロンプトやモデルの選び方による揺れを分散成分として分けて評価する、事前登録可能な手順（ワークフロー）を示した（抄録、図1）。", "p2": "LLMによる評定はプロンプトの書き方やモデルの系統・大きさの選択の自由度が大きく、結論が選択に依存して頑健さと一般化可能性を損なうおそれがある（抄録）。", "p3": "一般化可能性理論にならい、評定の分散を、刺激項目間の構成概念の分散、モデルとプロンプトの選択による方法の分散、反復ごとの残差に分ける。計画・実行・報告には方法論シミュレーションのADEMP枠組み（目的・データ生成・推定対象・方法・性能指標）を適用し、テンプレートを公開した（抄録、図1）。", "p4": "2つの検証戦略を組み合わせる：LLMの仕様間の一貫性（推定した分散成分）と、人間の評定という外部基準との一致。例示では96刺激の感情価（valence）と覚醒度を、各条件100回の反復で評定させた（図2）。", "p5": "感情価の評定では分散の68.85%が刺激間の差（望ましい分散）、ほぼ20%が方法の要因、残差は12.84%だった（本文）。覚醒度では刺激間の分散が52.53%と低く、一貫性が劣った（本文）。gemma3（27B）とgpt-oss（20B）は多くの条件で人間の評定と非常に高い相関を示した（図2）。", "p6": "モンテカルロ標準誤差は小さいが、刺激が96件に限られるため刺激由来の信頼区間は広い（図2）。残る疑問：自由記述や複雑な構成概念（熟議の質など）でも方法の分散がこの程度に収まるか。", "fun": "AIに「この文章はどれくらい明るい気分か」を採点させると、質問の言い方やAIの種類で点数が変わります。この研究は、点数のばらつきを「文章そのものの違い」「聞き方の違い」「たまたまの揺れ」に分けて見る方法を作りました。テストの点が問題の難しさで変わるのか採点者で変わるのかを分ける考え方と同じです。", "unverified": "方法の分散の内訳（モデルとプロンプトそれぞれの割合）。"}}, {"id": "pr07", "rank": 7, "headline": "反復LiDARで地すべりの変化量を測る", "title": "Mapping landslide change and volume with repeat airborne LiDAR after the May 2023 Emilia-Romagna event: slope-dependent detection limits and lowered areas", "url": "https://doi.org/10.31223/x58r5c", "authors": "Sansar Meena", "venue": "EarthArXiv", "date": "2026-10-31", "apa": "Meena, S. (2026). Mapping landslide change and volume with repeat airborne LiDAR after the May 2023 Emilia-Romagna event: slope-dependent detection limits and lowered areas. https://doi.org/10.31223/x58r5c", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "EarthArXivの本文PDF（調査ペアと検出限界の表、検出結果、図1〜3のキャプション）を読んだ", "preprint": true, "p1": "反復航空LiDARで地すべり台帳を検証するとき、安定地盤の勾配の違いを補正しないと検出された変化が約2倍に見えることを示し、補正後の変化量と体積を求め直した（抄録）。", "p2": "台帳の検証では、ポリゴン内で検出限界を超えて変化した割合を安定地盤の割合と比べるが、安定地盤は地すべりより緩く、LiDARの雑音は勾配とともに増えるため、比較が偏る（抄録）。", "p3": "2023年5月のイタリア・エミリア＝ロマーニャの豪雨を対象に、0.5m解像度の航空LiDAR4組を河川沿い919タイルで差分し、80,997ポリゴンのRER2023台帳と照合した。安定地盤を勾配でそろえた検出下限（slope-matched floor）を導入した（抄録、表1・2）。", "p4": "安定地盤がタイルの95パーセンタイル限界を超える割合（偽の変化率）を勾配別に求め、台帳内の変化率と比べた。事象後1年の5組目のペアで下限の妥当性を確かめた（抄録、表3）。", "p5": "安定地盤の超過は平坦地で4%、40°超の斜面で27%で、地すべりに当てはまる下限は5.9%ではなく13.7%だった。5組目でも全体で14.5%対14.2%と一致した。補正後、台帳の地すべり地の36%が約0.5m超変化し、土石・土砂の地すべりで限界を超えて低下したのは面積の20%で、主に各ポリゴンの上半分だった。面積-体積則は実測の低下を8〜11倍過大に見積もり、指数は1.45ではなく約1.1〜1.3だった（抄録）。", "p6": "重なる観測は河川沿いのタイルに限られる（抄録）。緩斜面と急斜面では5組目の結果が逆向きにずれる（抄録）。残る疑問：他の地域や植生条件でも補正の大きさが同じか。", "fun": "地面の高さを空から2回測って比べると、崩れた場所が分かります。ところが急な斜面ほど測定の誤差が大きいので、崩れていなくても「変わった」と出やすいのです。誤差の比べ方を斜面の角度でそろえると、見かけの崩れが半分になりました。比べる相手をそろえる、という実験の基本が大きな差を生む例です。", "unverified": "なし"}}, {"id": "pr08", "rank": 8, "headline": "取締役ネットワーク内で最下位のCEOが解任", "title": "How Are CEOs Fired?", "url": "https://doi.org/10.67929/ecgi-fin-1162-2026", "authors": "Jason (Pang-Li) Chen ほか", "venue": "Finance Working Paper Series", "date": "2026-10-31", "apa": "Chen, J. (.-L., Duchin, R., & Fich, E. M. (2026). How Are CEOs Fired? https://doi.org/10.67929/ecgi-fin-1162-2026", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "ECGIワーキングペーパーの本文PDFのうち、抄録と図1・表2・表3の説明を読んだ", "preprint": true, "p1": "独立取締役が兼任する取締役会のネットワークの中で自社が最下位の業績だと、CEOが解任されやすいことを示した（抄録）。", "p2": "CEOの解任は相対業績で説明されてきたが、比較の基準が何かは明らかでなかった。取締役の兼任（インターロック）が暗黙の比較基準になる経路は検証されていなかった（抄録）。", "p3": "主な説明変数%Worstは、独立取締役のうち自社が兼任先の中で最も業績の悪い会社になっている人の割合（表2）。さらに、取締役×年の固定効果を入れ、同じ取締役の同じ年の兼任先どうしで解任を比べる設計にした（表3）。", "p4": "強制的なCEO交代を結果とし、細かな固定効果、非線形・絶対・産業相対の業績の統制、外生的な取締役交代の分析、反証テストで頑健性を確かめた。解任後の業績、アナリストの格下げ、発表時の株価反応も調べた（抄録）。", "p5": "業績が中央値未満の企業では、%Worstの最低三分位から最高三分位で解任率が3.6ポイント上がり、これは同じ企業群の無条件の解任率3.90%に匹敵する（図1）。業績が上の企業でも0.87ポイント上がる（図1）。兼任基準による解任のあとは業績低下・格下げ・低い発表リターンが続き、価値を高める対応とは言いにくい（抄録）。", "p6": "本文の頑健性分析と外生的交代の識別の詳細は読み切れていない。残る疑問：日本の社外取締役の兼任ネットワークでも同じ基準効果が働くか。査読前のワーキングペーパーである。", "fun": "社長がクビになるかどうかは、会社の成績そのものより「取締役が知っている他の会社と比べてどうか」で決まることがあるようです。たまたま優秀な会社ばかり兼任している取締役がいると、ふつうの成績でも最下位に見えてしまいます。しかもその解任のあと業績はむしろ悪くなりました。比べる相手しだいで評価が変わる、という身近な話につながります。", "unverified": "標本の企業数・期間、ロジットの係数の値、外生的な取締役交代の分析結果。"}}, {"id": "pr09", "rank": 9, "headline": "保育砂漠の女性研究者はテニュアを得にくい", "title": "Scientist Mothers Working in Childcare Deserts Are Less Likely to Attain Tenure", "url": "https://doi.org/10.2139/ssrn.7670739", "authors": "Jun Li", "venue": "SSRN", "date": "2026-10-31", "apa": "Li, J. (2026). Scientist Mothers Working in Childcare Deserts Are Less Likely to Attain Tenure. https://doi.org/10.2139/ssrn.7670739", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録と序論の冒頭を使用。本文は入手できず", "preprint": true, "p1": "職場の近くに保育の供給が足りない「保育砂漠」で働く女性研究者は、テニュア（終身在職権）を得にくいことを示した（抄録）。", "p2": "保育の不足は子どもの発達と親のキャリアに影響するが、研究職の人材の流出との関係を長期データで示した研究は少なかった（抄録）。背景：米国の公的な保育投資は他の高所得国に比べて低い（序論）。", "p3": "20年分の保育供給のデータを、米国の科学者の縦断調査と連結し、職場周辺で供給が需要を大きく下回る地域を保育砂漠と定義した（抄録）。", "p4": "テニュア取得、産業界への移動、パートタイムへの移行を結果として、保育砂漠で働く母親とそうでない人を比べた（抄録）。具体的な推定方法は未確認。", "p5": "大学・研究機関の科学者の半数以上が保育砂漠で働いていた。保育砂漠の母親はテニュアを得にくく、産業界やパートタイムへ移りやすかった。労働時間の減少がテニュアとの関連の一部を説明するが、他の理由も残る（抄録）。", "p6": "抄録の範囲では、効果の大きさと因果の識別方法（立地の自己選択の扱い）は未確認。残る疑問：父親や他国（日本を含む）でも同様か。", "fun": "研究者になっても、近くに子どもを預けられる場所がないと、研究を続けるのが難しくなります。この研究は、保育所の数の地図と研究者の人生の記録を20年分つなぎ合わせて、それを数字で示しました。研究の世界から人が去る理由が、研究そのものではなく暮らしの仕組みにあるかもしれない、という点が考えさせられます。", "unverified": "効果の大きさ、標本の規模、因果の識別方法。"}}, {"id": "pr10", "rank": 10, "headline": "AIの個人リスクと社会リスクの認識差", "title": "Substance or Spectacle? AI Use and the Personal–Societal Risk Wedge", "url": "https://doi.org/10.2139/ssrn.7670838", "authors": "George S. Ford", "venue": "SSRN", "date": "2026-10-31", "apa": "Ford, G. S. (2026). Substance or Spectacle? AI Use and the Personal–Societal Risk Wedge. https://doi.org/10.2139/ssrn.7670838", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は入手できず", "preprint": true, "p1": "働く人はAIが「他の労働者」に与える影響は心配するが自分への影響は心配しない、という大きな差（リスクのくさび）があり、AIをよく使う人ほどその差が小さいことを示した（抄録）。", "p2": "AIの雇用影響をめぐる議論は「大量の失業」から「過大評価」まで分かれ、働く人自身がそれをどう受け止めているかは十分に測られていなかった（抄録）。", "p3": "Pew Research CenterのAmerican Trends Panelの第119波を使い、AIの影響を他者と自分について評価する回答の差を、AIの利用の多さ別に比べた（抄録）。", "p4": "社会への懸念が個人的な懸念にどれだけ移るか（翻訳の割合）を、利用の多い人と少ない人で比べた。社会的懸念の水準そのものの差も確かめた（抄録）。", "p5": "約4分の3の労働者が労働者一般を心配する一方、自分を心配するのは3人に1人で、半分未満しか個人的な懸念に移っていなかった。AIをよく使う人は社会的懸念の水準は同じまま、それを個人的懸念に移す割合が明らかに高かった（抄録）。", "p6": "横断的な調査で、利用の多さと懸念の因果は分からない（解釈）。著者は、多くの人が保つ「社会と自分の差」は経験不足による遅行指標だと解釈する（抄録）。残る疑問：職種や仕事の要求度の違いを統制しても同じか。", "fun": "「AIでみんなの仕事が危ない」と思っても、「自分は大丈夫」と考える人が多いようです。ところがAIをよく使っている人ほど「自分も危ないかも」と感じていました。よく知っている人ほど身近な問題として受け止める、という結果は、天気予報や病気の話でも起きそうな、人の心の動きを映しています。", "unverified": "標本の規模と、利用の多さによる差の具体的な数値。"}}, {"id": "pr11", "rank": 11, "headline": "巨大事業は見える化しても制御できない", "title": "The Control Gap in Megaproject Governance Why Greater Visibility Does not Necessarily Produce Greater Influence over Project Outcomes", "url": "https://doi.org/10.2139/ssrn.7673582", "authors": "Emanuele Insardi", "venue": "SSRN", "date": "2026-10-31", "apa": "Insardi, E. (2026). The Control Gap in Megaproject Governance Why Greater Visibility Does not Necessarily Produce Greater Influence over Project Outcomes. https://doi.org/10.2139/ssrn.7673582", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は入手できず", "preprint": true, "p1": "巨大事業（メガプロジェクト）では見える化が進んでも結果を変えられないことを、「統制ギャップ（control gap）」という概念で説明する枠組みを示した（抄録）。", "p2": "工程表、費用システム、リスク台帳、ダッシュボード、予測分析で逸脱は速く細かく見えるようになったが、それが結果を変える力に直結しない理由は整理されていなかった（抄録）。", "p3": "統制ギャップを、統治の仕組みが観測できる状態と、介入に間に合う時間内に実際に影響できる状態の距離と定義した。メガプロジェクトの統治、組織の統制、情報処理、サイバネティクス、センスメイキング、動的能力の研究を概念的に統合した（抄録）。", "p4": "概念論文で実証データはない。データの可視性・解釈の可視性・行動可能性を区別し、技術・商業・制度・時間の領域にわたる診断の枠組みと、6つの命題を示した（抄録）。", "p5": "ギャップは、権限のない可視性、能力のない権限、間に合わない能力、確かな帰還情報のない介入、という4つの分離から生じ、制度の分断、契約の固定、外部依存、意思決定の遅れ、約束の不可逆性で強まると論じる（抄録）。", "p6": "実証的な検証は今後の課題である（解釈）。残る疑問：6つの命題をどの指標で測るか。", "fun": "工事の遅れや予算超過が画面ですぐ分かるようになっても、それを直す権限や人手、時間がなければ結果は変わりません。この論文は「見えること」と「変えられること」の間のすき間に名前を付けました。テストの点が下がったと分かっても、勉強時間を増やせなければ意味がない、という身近な状況に似ています。", "unverified": "6つの命題の具体的な内容。"}}, {"id": "pr12", "rank": 12, "headline": "LLMの金融助言は属性で変わるか（インド）", "title": "The Indian Financial Automated Advice Bias (IFAAB) Dataset : Auditing Socioeconomic and Demographic Disparities in LLM-Generated Financial Advice in India", "url": "https://doi.org/10.48550/arxiv.2610.38239", "authors": "Kriti Mahajan", "venue": "arXiv (Cornell University)", "date": "2026-10-28", "apa": "Mahajan, K. (2026). The Indian Financial Automated Advice Bias (IFAAB) Dataset : Auditing Socioeconomic and Demographic Disparities in LLM-Generated Financial Advice in India (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.38239", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（データ構築・評価方法・結果・結論の節、表1・2と図のキャプション）を読んだ", "preprint": true, "p1": "同じ依頼でも、性別・カースト・地域などの属性だけを変えたインドのペルソナに対して、GPT-4oの金融助言が系統的に変わることを、31,734件の反実仮想の監査データで示した（抄録）。", "p2": "LLMは金融相談に使われ始めているが、グローバルサウスの文脈で、社会的属性によって助言が変わるかはほとんど調べられていなかった（抄録）。", "p3": "性別・カースト・学歴・職業・居住地・年齢・県（777県）を変えた合成ペルソナを作り、依頼内容は固定してGPT-4oに助言させる（表1、§2）。回答から、モデルが想定した資産・所得・貯蓄と助言後の見込み、文面の類似度、助言の話題、LLM判定による偏りを取り出す（§4）。", "p4": "他の属性をすべてそろえた男女の対、一般カーストとSC/ST/OBCの対で比べ、平均・中央値・対の差、回帰係数、TF-IDFのコサイン類似度、話題分類、LLM-as-judgeの偏り判定で評価した（§4、表14〜16）。", "p5": "性別のみの監査で、男性の名札の人物は女性より初期の総資源が60.1%、助言後の総資源が46.8%高く、カーストを加えても助言後の差は49.4%残った。県の情報を加えると助言後の男女差は7.9%に縮んだ（抄録）。男女の対の回答の文面の類似度は平均0.44と低く、女性は慎重な貯蓄や地域の支えに誘導されやすかった（抄録）。", "p6": "対象はGPT-4oの1モデルで、ペルソナは合成である（§2）。著者は「デジタルなガラスの天井」の危険を指摘する（§6）。残る疑問：他のモデルや、実在の利用者の依頼文でも同じ差が出るか。", "fun": "同じ質問なのに、名前が男性か女性かだけでAIの「あなたの資産はこれくらいでしょう」という見立てが大きく変わりました。ところが住んでいる地域を書き足すと差はぐっと縮みます。AIは手がかりが少ないと、世の中の平均的なイメージで人を判断してしまう、ということがよく分かる実験です。", "unverified": "カーストごとの助言後総資源の差の具体的な値（抄録で切れている）。"}}, {"id": "pr13", "rank": 13, "headline": "AIチャットボットが変える顧客体験", "title": "The Conversational Economy: The Strategic Role of AI Chatbots in Customer Experience (CX)", "url": "https://doi.org/10.33774/coe-2026-jxt2x", "authors": "Manish Kumar", "venue": "Cambridge Open Engage", "date": "2026-10-31", "apa": "Kumar, M. (2026). The Conversational Economy: The Strategic Role of AI Chatbots in Customer Experience (CX). https://doi.org/10.33774/coe-2026-jxt2x", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "本文", "basis_note": "Cambridge Open Engageの本文PDFのうち、抄録と構成を確認した（二次資料の質的分析）", "preprint": true, "p1": "AIチャットボットが顧客体験（CX）で果たす戦略的役割を、業界報告・学術文献・企業事例の二次資料から5つの用途に整理し、導入の枠組みを示した（抄録）。", "p2": "「会話型経済」と呼ばれる中で、チャットボットの利点と失敗の両方を、マーケティングの枠組みに位置づけて整理する必要がある（抄録）。", "p3": "業界報告、学術文献、企業の事例研究という二次データの質的分析で、用途・利点・課題を抽出した（抄録）。解釈：独自のデータ収集や定量的な検証はない。", "p4": "評価指標や比較対象はなく、文献と事例の整理に基づく（抄録）。", "p5": "用途は24時間の顧客対応、個別化した推薦、見込み客の獲得、先回りの働きかけ、購買過程の簡略化の5つ。効率・満足度・拡張性は向上するが、技術的限界、下手な導入による顧客の苛立ち、統合の複雑さ、倫理的懸念、人の温かみの不足が課題として残る（抄録）。", "p6": "二次資料に基づく総説的な文書で、効果の大きさは示されない（解釈）。残る疑問：チャットボットの失敗がサービス回復や口コミにどう波及するかの実証。審査のない置き場の文書である。", "fun": "お店の問い合わせ窓口がAIに置きかわると、夜中でもすぐ返事がもらえて便利です。でも決まった答えしか返ってこないとイライラします。この論文は、AIの窓口の「便利さ」と「冷たさ」を並べて整理しました。人とAIを組み合わせる窓口が今後の流れだ、という見通しも、身近な体験と重なります。", "unverified": "具体的な事例企業と数値（二次資料のため本文の数値は未照合）。"}}, {"id": "pr14", "rank": 14, "headline": "予算をwell-being指標に結びつける", "title": "Policy brief: Aligning public budgets with wellbeing outcomes", "url": "https://doi.org/10.5281/zenodo.23770823", "authors": "Valentina Caimi", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-10-29", "apa": "Caimi, V. (2026). Policy brief: Aligning public budgets with wellbeing outcomes. Zenodo. https://doi.org/10.5281/ZENODO.23770823", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Zenodoに置かれた政策提言のPDF（障壁と提言の部分）を読んだ", "preprint": true, "p1": "well-beingの指標を測るだけでなく、予算編成と公共投資の判断原則として使う「well-being予算」への移行の障壁と提言を整理した政策提言（抄録）。", "p2": "OECD諸国の3分の2以上が国のwell-being指標や意思決定の枠組みを導入したが、多くは予算の決定と切り離されたままである（抄録）。", "p3": "各国の取り組みを踏まえた政策分析として、指標と配分のつながり、省庁の責任分担、予防の評価、財政規則、行政の能力という観点から障壁を特定した（抄録）。解釈：定量的な効果推定は行っていない。", "p4": "評価指標や比較対象はなく、制度分析に基づく提言である（抄録）。", "p5": "障壁は、配分の決定と切り離された指標、省庁ごとの分断、予防・早期介入の体系的な過小評価、二次的効果を無視する硬直的な単年度の財政規則、新しい道具を使う行政能力の不足の5つ。提言は、予算編成・支出見直し・投資判断への直結、将来と省庁横断の財政効果を認める「実コスト会計」、政府全体の統合予算の仕組み、予算サイクル全体でのwell-being分析・タグ付け・評価、能力と透明性と市民参加の強化（抄録）。", "p6": "EU機関・各国・地方の協調を前提とする提言で、実施の効果は示されていない（抄録）。残る疑問：予防の効果を予算上どう測り、割り引くか。", "fun": "国が「国民の幸せ」を測るようになっても、それがお金の使い道に反映されなければ意味がありません。病気を防ぐ取り組みは効果が何年も後に別の省庁の節約として現れるので、毎年の予算の計算では損に見えがちです。この提言は、その「見えない得」を会計に入れようと提案している点が面白いところです。", "unverified": "取り上げた国別の事例。"}}, {"id": "pr15", "rank": 15, "headline": "LLMエージェントの信念更新を監査可能に", "title": "Auditable Belief Updates as a Missing Safety Layer for LLM-Powered Multi-Agent Systems", "url": "https://doi.org/10.48550/arxiv.2610.38869", "authors": "Zhuoyun Li ほか", "venue": "arXiv (Cornell University)", "date": "2026-10-28", "apa": "Li, Z., Wang, B., Hu, J., Huang, X., & Dong, Y. (2026). Auditable Belief Updates as a Missing Safety Layer for LLM-Powered Multi-Agent Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.38869", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（結論、付録の限界と評価、図1・2と表1〜3のキャプション）を読んだ", "preprint": true, "p1": "LLMマルチエージェントの安全性を、出力の検閲ではなく「信念の更新」を外に出して監査・制限する層で守る枠組みEB-MASを提案した（抄録、§5）。", "p2": "道具やメモリ、他エージェントとの通信を使うシステムでは、安全上の失敗は単発の有害出力だけでなく、根拠の弱い主張が記憶され伝播することから生じる（抄録）。", "p3": "信念を「下流の行動を導く根拠つきの約束」と工学的に定義し、信念グラフとして外部の基盤に保持する。信念演算子が更新案を出し、「認知ファイアウォール」が、根拠は弱いのに脆弱性の手がかりに強く動かされた更新を制限・拒否する。集団レベルでは社会的な事前分布でエージェントを結び、作られた合意や誤情報の連鎖をモデル化する（図1、抄録）。", "p4": "MM-DeceptionBenchとASB（道具・メモリ攻撃）の試作評価で、防御後の不安全率、良性の誤遮断（100件の良性対照）、通常の道具選択の許可率を測った。GPT-4o-miniのエージェントで4ラウンドの対応づけ評価も行った（表1・2、付録B.3）。", "p5": "モンテカルロ模擬では、信念の書き換え攻撃や協調攻撃で攻撃成功率が下がり、攻撃後の信頼の急上昇も防げた（図2）。試作評価の具体的な数値は表で示されるが、本解説では未照合。", "p6": "著者は結果を予備的な証拠とし、偽装（sandbagging）は最も難しい分類で、ASBでは出所の手がかりが比較的強いため、開かれた環境での安全を保証するものではないと述べる（付録A.4）。残る疑問：AgentDojoのような動的環境での性能。", "fun": "うわさ話は、根拠が弱くても何人もが言うと本当らしく聞こえてきます。AIどうしのやり取りでも同じことが起きるので、この研究は「何を信じたか」を記録帳に書き出し、根拠の薄い思い込みをはね返す関所を置こうと提案しました。答えを検査するのではなく、考えの変わり方そのものを見張る発想が面白い点です。", "unverified": "表1〜3の不安全率・誤遮断率の具体的な数値。"}}, {"id": "pr16", "rank": 16, "headline": "GitHub上のAIエージェント人格プロンプト集", "title": "What's in a Soul? A Provenance-Complete Dataset of AI Agent Persona Prompts in the Wild on GitHub", "url": "https://doi.org/10.5281/zenodo.23829458", "authors": "Lee ほか", "venue": "Zenodo", "date": "2026-10-31", "apa": "Lee, T. J., & Shin, E. (2026). What's in a Soul? A Provenance-Complete Dataset of AI Agent Persona Prompts in the Wild on GitHub. Zenodo. https://doi.org/10.5281/ZENODO.23829458", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録を使用", "preprint": true, "short": true, "p1": "GitHubの公開リポジトリにあるAIエージェントの人格定義ファイル（SOUL.md、persona.mdなど）281件を、出所を固定して集めたデータセット（抄録）。", "p3": "168リポジトリから5種類のパス検索と手作業の採否規則で収集し、全件にリポジトリ・パス・コミットSHAを付けて再検証した。内容（9つの二値の側面）と形式（順序尺度）を別々に符号化する2軸の分類を設けた（抄録）。", "p5": "ライセンスが許す179件（64%）は全文、残り102件は書誌とSHAのみを配布する。2人の独立な符号化で、形式の信頼性はKrippendorffのα=0.84と高く、内容の側面はそれより低かった（抄録）。", "fun": "AIの「性格」はプログラムではなく、ふつうの文章ファイルで決められるようになってきました。この研究は、世界中の開発者が実際にどんな人格をAIに書き込んでいるかを、証拠をたどれる形で集めた点が面白いです。「書き方」は人どうしで判定が一致しやすいのに、「中身」は一致しにくいという結果も、人格を言葉で定義する難しさを表しています。", "unverified": "内容の側面ごとの信頼性の値（抄録の途中で切れている）。"}}, {"id": "pr17", "rank": 17, "headline": "AIとの短い会話から性格を当てる", "title": "Predicting Personality Traits from Short Unstructured Conversations with AI", "url": "https://doi.org/10.31234/osf.io/8476g_v1", "authors": "Daniel Robert Lametti ほか", "venue": "PsyArXiv", "date": "2026-10-31", "apa": "Lametti, D. R., Wheeler, I., Appleton, J., Murphy, R., & Castiello, S. (2026). Predicting Personality Traits from Short Unstructured Conversations with AI. https://doi.org/10.31234/osf.io/8476g_v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用", "preprint": true, "short": true, "p1": "AIとの短い雑談だけから、別のLLMがその人のビッグファイブ性格をある程度当てられることを示した（抄録）。", "p3": "事前登録した実験で、100人がBFI（ビッグファイブ尺度）に回答したあとGPT-4.1と自由に会話し（語数の中央値430語）、別のLLM（Claude Sonnet 4.6）が会話だけを読んで各人のBFIを予測した（抄録）。", "p5": "予測と自己報告の相関は有意で、r=0.25〜0.47。一部は家族による他者評定の既報に並ぶ。予測は構文よりも語彙の内容に主に依存していた（抄録）。", "fun": "数百語のおしゃべりだけで、家族並みに性格を見抜けることがあるという結果は少し驚きです。AIは文の組み立て方より「何について話したか」から推測していたので、話題選びに人柄が出ることが分かります。AIに何を話すかが、知らないうちに自分の情報を渡していることにもなる、という問いも投げかけています。", "unverified": "AIの人格（自分に似せたAIとそうでないAI）が自己開示に与えた影響の結果（抄録の途中で切れている）。"}}, {"id": "pr18", "rank": 18, "headline": "他者の信念を推論するLLMの自己対戦", "title": "EpiAgent: Epistemic Self-Play for LLM Agents", "url": "https://doi.org/10.48550/arxiv.2610.40227", "authors": "Xuanfa Jin ほか", "venue": "arXiv (Cornell University)", "date": "2026-10-29", "apa": "Jin, X., Cui, X., Ma, Z., Yan, X., Zhao, J., Zhang, H., & Wang, J. (2026). EpiAgent: Epistemic Self-Play for LLM Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.40227", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMエージェントに「相手の私的情報についての信念」を明示的に持たせ、学習で更新させる枠組みEpiAgentを提案した（抄録）。", "p3": "方策を、対話履歴から信念を更新する段階と、その信念に基づいて行動を選ぶ段階に分け、二段階最適化として自己対戦で交互に学習する。信念が次の観測をどれだけ当てるかを内発的な報酬に使う（抄録）。", "p5": "協調と競争が混ざる場面と競争的な場面の実験で効果を示したと述べるが、具体的な数値は抄録の範囲では未確認（抄録）。", "fun": "トランプやじゃんけんの駆け引きでは、「相手は何を持っていそうか」を考えながら手を選びます。この研究は、その「相手の心を読む」部分をAIの中に独立した部品として作り、当たり外れで鍛える点が面白いです。予想が次に起きることを当てられたら褒める、という仕組みは人間の学び方にも似ています。", "unverified": "実験の具体的な成績と比較対象。"}}, {"id": "pr19", "rank": 19, "headline": "グリーンウォッシュ疑念が金融の採用を阻む", "title": "Special Issue: Green Banking, Finance, And Insurancefrom Concern to Credibility: How Trust and Perceived Greenwashing Shape the Adoption of Green Banking, Green Finance and Green Insurance Among Retail Customers&nbsp;", "url": "https://doi.org/10.2139/ssrn.7670560", "authors": "Huáxué Research", "venue": "SSRN", "date": "2026-10-31", "apa": "Research, H. (2026). Special Issue: Green Banking, Finance, And Insurancefrom Concern to Credibility: How Trust and Perceived Greenwashing Shape the Adoption of Green Banking, Green Finance and Green Insurance Among Retail Customers&nbsp; https://doi.org/10.2139/ssrn.7670560", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用", "preprint": true, "short": true, "p1": "環境への関心が緑の金融商品の採用につながる経路を、信頼とグリーンウォッシュの知覚を軸にモデル化した（抄録）。", "p3": "計画的行動理論、価値-信念-規範理論、コミットメント-信頼の視点を統合したモデルを、グリーン銀行・投資・保険の3文脈に均等に分けた600人の「シミュレーションに基づく標本」で、合成得点の経路分析（ブートストラップ5,000回）により推定した（抄録）。", "p5": "グリーン信頼が採用意向の最も強い予測因子（β=0.43）で、知覚されたグリーン価値は直接と信頼経由（間接効果0.17）で効き、グリーンウォッシュの知覚は信頼を下げた（β=−0.21）（抄録）。解釈：標本が実在の顧客調査ではなく模擬データとされている点に注意が要る。", "fun": "「環境にやさしい」と宣伝しても、うそっぽいと思われると信頼が減り、結局選ばれにくくなる、という筋道を数式のモデルで表しています。ただしこの研究のデータは実際の客に聞いたものではなく、作られた標本だと書かれています。どんなデータから結論を出したのかを確かめる大切さを教えてくれる例でもあります。", "unverified": "模擬標本の作り方の詳細と、グリーンウォッシュが採用意向に直接与える効果（抄録の途中で切れている）。"}}, {"id": "pr20", "rank": 20, "headline": "ESG指数の成績比較は検出力が足りない", "title": "Diagnosing Index-level ESG Performance Tests: Measurement, Specification, Stability, and Statistical Power", "url": "https://doi.org/10.2139/ssrn.7668598", "authors": "Ijaz Ali ほか", "venue": "SSRN", "date": "2026-10-31", "apa": "Ali, I., & Ahmad, S. (2026). Diagnosing Index-level ESG Performance Tests: Measurement, Specification, Stability, and Statistical Power. https://doi.org/10.2139/ssrn.7668598", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用", "preprint": true, "short": true, "p1": "ESG指数の超過リターンや規制前後の変化の検定には、測定・特定化・構造安定性・検出力の4つの診断を順に当てる必要があることを示した（抄録）。", "p3": "FTSE4Good（2010〜2026年）を対象に、EUのサステナブルファイナンス開示規則（SFDR）を候補の構造変化として、回帰の定数項（リスク調整後の超過リターン）を4つの診断で調べた（抄録）。", "p5": "更新されていない終値2件だけでp値が.006から.031に動き、年0.7%の要因調整後の差はモデル次第で、欧州の検定の検出力は19〜22%しかなかった。非ESGの指数群でも年−4.2%の「規制による」変化が、エクスポージャーの変化を許すと−2.0%に縮んだ（抄録）。", "fun": "「規制のあとで成績が変わった」と言うには、データの小さな誤りやモデルの選び方で結果が揺れないかを確かめる必要があります。この研究では、たった2つの古い価格データで統計的な判定が大きく動きました。そもそも差を見つける力（検出力）が2割しかない検定だったという指摘は、結果を読む側にも役立つ注意です。", "unverified": "なし"}}, {"id": "pr21", "rank": 21, "headline": "民主制のもとで育つと人生満足度は上がるか", "title": "Do (Successful) Democracies Breed Their Own Happiness? Lifetime Exposure to Democracy and Life Satisfaction", "url": "https://doi.org/10.2139/ssrn.7670678", "authors": "Elvisa Drishti", "venue": "SSRN", "date": "2026-10-31", "apa": "Drishti, E. (2026). Do (Successful) Democracies Breed Their Own Happiness? Lifetime Exposure to Democracy and Life Satisfaction. https://doi.org/10.2139/ssrn.7670678", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用", "preprint": true, "short": true, "p1": "生涯で民主制を経験した量が多い人ほど人生満足度が高いという関連を、43か国15万人のデータで示した（抄録）。", "p3": "EBRDのLife in Transition調査4回分（2006〜2023年、152,902人、43経済）をV-Demの民主度の歴史（1880年から）と結び、6歳から調査年までの民主度の合計を「経験量」とした。国×調査回の衝撃と国ごとの年齢の型を固定し、地域的な民主化の波を操作変数にした推定も行った（抄録）。", "p5": "最も厳しい定式化で経験量1標準偏差の増加は満足度0.16標準偏差の上昇と関連し、国ごとのコーホート傾向にも頑健。二段階最小二乗の推定は0.09〜0.25（抄録）。", "fun": "同じ年齢の人でも、どの国のどの時代に育ったかで「民主主義の中で過ごした年数」が違います。この研究はその違いを使って、民主主義が人の幸福感にまで関わるかを調べました。子どもの頃からの社会の仕組みが、何十年後の気持ちに残るかもしれないという問いが面白いところです。", "unverified": "どの年齢期の経験が効いているかの結果（抄録の途中で切れている）。"}}, {"id": "pr22", "rank": 22, "headline": "粗い電波強度報告で反射壁の形を同定できるか", "title": "Can Beam Reports Update a Digital Twin? Identifiability of Reflector Geometry and Material from Wide-Beam RSRP", "url": "https://doi.org/10.5281/zenodo.23838538", "authors": "Mustafa ほか", "venue": "Zenodo", "date": "2026-10-31", "apa": "Mustafa, U., & Rashid, I. (2026). Can Beam Reports Update a Digital Twin? Identifiability of Reflector Geometry and Material from Wide-Beam RSRP. Zenodo. https://doi.org/10.5281/ZENODO.23838538", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録を使用", "preprint": true, "short": true, "p1": "携帯網がすでに集めている粗い電波強度報告（RSRP）から、電波デジタルツイン内の反射壁の位置と材質をどこまで同定できるかを理論と模擬で示した（抄録）。", "p3": "位相のない1dB刻みの広ビーム電力報告を観測とし、利用者数・入射角の条件ごとに同定可能性を分析した。ミュンヘンとパリの光線追跡シーンで、最大事後確率の推定と尤度比検定を評価した（抄録）。", "p5": "利用者1人では壁の位置は決まらず、2人で一般に決まる。10人で壁のずれは0.8〜3.0mに抑えられ、材質は7クラスで78〜86%の精度で分類できた。4mの移動は模型生成の場合に92〜100%で検出できた（抄録）。", "fun": "スマホが基地局に送っている「電波の強さ」という粗い数字だけで、街の建物の壁がどこにあり何でできているかを推測できるかを問う研究です。1人分では足りず2人分で決まる、という答えは、測る角度を変えると立体が分かる仕組みに似ています。すでにあるデータを別の目的に使う発想が面白い点です。", "unverified": "64素子の場合の計算量削減の詳細（抄録の途中で切れている）。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "実コード検証へLean定理証明を拡大", "title": "Scaling Lean Theorem Proving for Real-World Code Verification", "url": "https://arxiv.org/abs/2610.38174", "authors": "Debargha Ganguly ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-30", "apa": "Ganguly, D., Raghunathan, D., Jovanović, D., Singh, V., Kong, S., Tomb, A., Goel, A., Erata, F., & Bayless, S. (2026). Scaling Lean Theorem Proving for Real-World Code Verification (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.38174", "why": "再帰的エージェントで構成したLean証明系を実際のソフトウェア検証に適用し、形式検証の規模を広げる。"}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "予測市場の情報を持つ取引を尤度比で判定", "title": "Scoring Informed Trading in Prediction Markets: A Likelihood Ratio Framework", "url": "https://doi.org/10.2139/ssrn.7670998", "authors": "Ahura Azadi", "venue": "SSRN", "date": "2026-10-31", "apa": "Azadi, A. (2026). Scoring Informed Trading in Prediction Markets: A Likelihood Ratio Framework. https://doi.org/10.2139/ssrn.7670998", "why": "予測市場で価格に未反映の情報を含む取引をウォレット単位で順位づける尤度比の枠組みを提案する。"}, {"id": "pn03 ": "3モデルは予想誤差でコンセンサスと差が検出されず、3モデルは誤差が大きかった。名目80%の区間が実績を含んだのは37〜70%で、外れの多くは予測が低すぎて上限を超えた。モデル間の差の多くは営業利益の推定に由来した（抄録）。", "fun": "AIに会社の次の利益を予想させ、プロのアナリストと勝負させた研究です。単に数字を当てるのでなく、売上や費用のどこをどう見積もったかを記録させたので、外れた理由まで追えます。AIは自信のある範囲を狭く言いすぎ、しかも低めに外しがちだった、という癖が見えたのが面白い点です。", "unverified": "なし"}}, {"id": "pn17", "rank": 17, "field": "心理学・認知科学", "headline": "視線とストレスの関係は課題で変わる", "title": "Task Context Shapes Ocular Associations with Stress, Cognitive Workload, and Fatigue: A Wearable Eye-Tracking Study", "url": "https://doi.org/10.31234/osf.io/yd36b_v1", "authors": "Tslil Ofir ほか", "venue": "PsyArXiv", "date": "2026-10-31", "apa": "Ofir, T., Paniccia, P., Mead, A., Solankey, O., Whybrow, E., Harwood, J., Proulx, M., Wang, Z., Fernandes, A. S., Newman, B., Cavin, R., & de Burgh, T. (2026). Task Context Shapes Ocular Associations with Stress, Cognitive Workload, and Fatigue: A Wearable Eye-Tracking Study. https://doi.org/10.31234/osf.io/yd36b_v1", "why": "ウェアラブル視線計測でストレス・作業負荷・疲労との関係が課題文脈で変わることを示す。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用", "preprint": true, "short": true, "p1": "ウェアラブル視線計測とストレス・作業負荷・疲労の関係が、課題の種類によって変わることを示した（抄録）。", "p3": "97人がMeta Aria Gen 1の眼鏡型装置を着け、社会的評価・推論・計画・理解・発表の課題を行った。視線と頭部運動の104指標と自己報告の各状態の関係を、課題の効果を考慮した線形混合効果モデルで調べた（抄録）。", "p5": "偽発見率の補正後、指標×課題の交互作用はストレスで53、作業負荷で61、疲労で12のモデルで有意で、特にサッカードの振幅・速度・持続時間で目立った。課題をまたいで、ストレスは視線のばらつきの増加と結びついた（抄録）。", "fun": "「目の動きで緊張が分かる」という話はよく聞きますが、この研究は、それがどんな作業をしているかで大きく変わることを示しました。人前で話すときと考え事をするときでは、同じ目の動きでも意味が違うのです。測定器の数字を読むときに状況を無視できないことが、よく分かる例です。", "unverified": "作業負荷と疲労の課題横断の関連の結果（抄録の途中で切れている）。"}}, {"id": "pn18", "rank": 18, "field": "心理学・認知科学", "headline": "曖昧な芸術を楽しむ鍵は意味の距離", "title": "Appreciating Ambiguity in Art: The effects of semantic distance and insight confidence on aesthetic appreciation", "url": "https://doi.org/10.31234/osf.io/h8ztf_v2", "authors": "Rajat Ravi Rao ほか", "venue": "PsyArXiv", "date": "2026-10-30", "apa": "Ravi Rao, R., mulckhuyse, m., van Elk, M., & Walker, F. (2026). Appreciating Ambiguity in Art: The effects of semantic distance and insight confidence on aesthetic appreciation. https://doi.org/10.31234/osf.io/h8ztf_v2", "why": "意味的距離と洞察の確信度が芸術の曖昧さの鑑賞にどう効くかを実験で調べる。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用", "preprint": true, "short": true, "p1": "芸術作品の「曖昧さ」を、鑑賞者の説明文どうしの意味的距離として計算で測る方法を導入し、鑑賞との関係を調べた（抄録）。", "p3": "曖昧さを作品が許す解釈の多さと定義し、説明文間の意味的距離で数値化した。あわせて自分の解釈への確信度（洞察の確信）も測り、123人のオンライン実験で作品を6秒見せて、説明・確信度・認知的感情、または興味・感情の強さを評定させた（抄録）。", "p5": "作品の間で比べると、解釈がばらつく作品ほど鑑賞の指標と関わる傾向が報告されているが、詳しい結果は抄録の範囲では未確認（抄録）。", "fun": "「この絵は曖昧だ」と感じるかどうかは人によって違いますが、この研究は、みんなの説明がどれだけバラバラかを言葉の距離として計算しました。主観を数字に置きかえる工夫が面白い点です。人によって見え方が違う作品ほど引きつけられるのか、という昔からの問いに新しい測り方で迫っています。", "unverified": "意味的距離・確信度と各鑑賞指標の関係の具体的な結果。"}}, {"id": "pn19", "rank": 19, "field": "心理学・認知科学", "headline": "感情は内受容と記号共有で共同構築される", "title": "Co-constructed Emotion: A Collective Predictive Coding Theory of Interoception and Social Symbol Sharing", "url": "https://doi.org/10.31234/osf.io/fnxu2_v2", "authors": "Takato Horii ほか", "venue": "PsyArXiv", "date": "2026-10-31", "apa": "Horii, T., Hieida, C., Terasawa, Y., Hideki, O., & Taniguchi, T. (2026). Co-constructed Emotion: A Collective Predictive Coding Theory of Interoception and Social Symbol Sharing. https://doi.org/10.31234/osf.io/fnxu2_v2", "why": "集合的予測符号化の理論で、身体内部の感覚と言語による記号共有から感情が作られる過程を説明する。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用", "preprint": true, "short": true, "p1": "感情を、身体内部の調節と他者との記号共有の両方から生まれるものとして、ひとつの能動的推論の式で説明する理論（TCoE）を提案した（抄録）。", "p3": "集合的予測符号化（CPC）のモデルを拡張し、各エージェントの生成モデルに内受容（身体内部の感覚）を明示的に加えた。感情の共同構築を、身体状態を調節する内側のループと、感情概念を他者と共有する社会的なループの二重の推論として記述する（抄録）。", "p5": "理論提案であり、実証の数値はない（抄録）。", "fun": "「悲しい」「うれしい」という言葉は、体の中の感覚と、周りの人との会話の両方からできあがっているのかもしれません。この研究は、その2つを同じ数学の枠組みで結びつけようとしています。心理学の「個人の脳の中」と社会学の「文化の中」という別々の見方を橋渡しする試みが面白い点です。", "unverified": "なし"}}, {"id": "pn20", "rank": 20, "field": "心理学・認知科学", "headline": "復職を予測する変えられる心理要因", "title": "Modifiable Psychological Variables as Predictors of Return to Work: Temporal Patterns in a Longitudinal Observational Study", "url": "https://doi.org/10.31234/osf.io/89s2x_v3", "authors": "Magnus Johansson ほか", "venue": "PsyArXiv", "date": "2026-10-30", "apa": "Johansson, M., Giöstad, A., Bujacz, A., Ek, A., Gustavsson, P., Öst, L.-G., & Finnes, A. (2026). Modifiable Psychological Variables as Predictors of Return to Work: Temporal Patterns in a Longitudinal Observational Study. https://doi.org/10.31234/osf.io/89s2x_v3", "why": "精神的不調からの復職を予測する可変な心理変数の時間的な変化を縦断データで追う。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用", "preprint": true, "short": true, "p1": "精神的不調で休職した人の復職を予測する、変えられる心理要因とその時間変化を縦断で調べた（抄録）。", "p3": "うつ・不安・適応障害などで休職中の人を対象に、3か月間は2週ごと、12か月までは四半期ごとに質問紙で測った。結果は自己報告の復職と登録データの休業日数で、頑健な線形混合モデル、馬蹄事前分布のベイズロジスティック回帰、順序ベータ回帰で分析した（抄録）。", "p5": "開始時の復職自己効力感と労働能力の得点は3か月時点の復職と関連した（抄録）。", "fun": "心の不調で仕事を休んだ人が職場に戻れるかは、「戻れそうだ」という自信の変化と関係するかもしれません。この研究は2週間ごとに気持ちを記録し、変化の早さに注目しました。休み日数のように上限と下限がある数字に合わせた統計手法を使っている点も工夫です。", "unverified": "自己効力感の改善と復職の関係の詳細（抄録の途中で切れている）。"}}, {"id": "pn21", "rank": 21, "field": "経営学", "headline": "AIで社会的企業の収入源が多様化", "title": "Algorithmic Breadth: Artificial Intelligence and the Diversification of Social Ventures", "url": "https://doi.org/10.2139/ssrn.7672139", "authors": "Leo Will", "venue": "SSRN", "date": "2026-10-30", "apa": "Will, L. (2026). Algorithmic Breadth: Artificial Intelligence and the Diversification of Social Ventures. https://doi.org/10.2139/ssrn.7672139", "why": "人工知能の利用が社会的企業の収入多角化を広げるかを検討する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用", "preprint": true, "short": true, "p1": "AIを受け身の道具ではなく起業の行為者とみなし、社会的企業の収入多角化を広げる一方で「使命の漂流」を招くという理論を組み立てた（抄録）。", "p3": "社会的起業の収入多角化の研究に、リアルオプションの考え方と注意に基づく見方を統合し、AIが機会の認識・調整費用・試行の段階化に与える影響を理論化した（抄録）。", "p5": "AIによる多角化と社会的成果の関係は曲線的で、使命のガバナンス、課題環境、起業家の特性に依存すると主張する。理論論文で実証の数値はない（抄録）。", "fun": "社会のために活動する団体も、お金を稼ぐ手段を増やさないと続けられません。AIはその手間を減らしてくれますが、測りやすい売上ばかり追ううちに本来の目的を見失う危険もある、という両面を指摘しています。便利な道具が目的そのものを変えてしまうかもしれない、という問いが面白い点です。", "unverified": "単一モデルへの依存に関する理論的主張の詳細（抄録の途中で切れている）。"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "多国籍企業は本国と受入国の板挟み", "title": "No One Can Serve Two Masters: Multinational Firms between Economic Statecraft and Host Coercion", "url": "https://doi.org/10.2139/ssrn.7668701", "authors": "Daehyeon Kang", "venue": "SSRN", "date": "2026-10-31", "apa": "Kang, D. (2026). No One Can Serve Two Masters: Multinational Firms between Economic Statecraft and Host Coercion. https://doi.org/10.2139/ssrn.7668701", "why": "経済的威圧の時代に、多国籍企業が本国の経済政策と受入国の圧力の間でどう振る舞うかを分析する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用", "preprint": true, "short": true, "p1": "多国籍企業が本国の経済安全保障政策と受入国の圧力の板挟みでどう動くかを、ゲーム理論で示した（抄録）。", "p3": "本国・その多国籍企業・対立する受入国の3者のゲームとしてモデル化し、規制の法的上限、企業の国内での政治的影響力、本国の決意が私的情報である場合の信号を分析した（抄録）。", "p5": "全面禁止に至らない本国の規制で撤退させられるのは、法の上限より価値の低い投資だけで、価値の高い関係は守られる一方、受入国の威圧にはさらされる。安全保障による切り離しに見える撤退が、実は経済的撤退や受入国の威圧である場合があると主張する（抄録）。", "fun": "ニュースで「安全保障のために企業が外国から撤退した」と聞くと、国の命令に従ったと思いがちです。この研究は、本当は採算や相手国の圧力が理由なのに、国の政策のせいに見えている場合があると論じます。見えている結果から原因を取り違える落とし穴を、数学のゲームで示した点が面白いところです。", "unverified": "モデルを示す具体例（抄録の途中で切れている）。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "容積緩和だけでは手頃な住宅は増えない", "title": "Upzoning Without Inclusion: Tracing Sydney’s Inclusionary Zoning History and its Implications for Affordable Supply", "url": "https://doi.org/10.1080/08111146.2026.2727920", "authors": "Catherine Gilbert ほか", "venue": "Urban Policy and Research", "date": "2026-10-29", "citescore": 3.4, "citescore_year": "2025", "apa": "Gilbert, C., & Gurran, N. (2026). Upzoning Without Inclusion: Tracing Sydney’s Inclusionary Zoning History and its Implications for Affordable Supply. Urban Policy and Research, 1–14. https://doi.org/10.1080/08111146.2026.2727920", "theme": "都市・インフラ政策", "theme_no": 6}, {"id": "jr02", "rank": 2, "headline": "生成AIの共感の型で失敗の許され方が変わる", "title": "“I Know” or “I Feel”? The Impact of Generative AI Applications’ Empathic Response Types on Customers’ Will  "人とAIの協働を技術・評価・階層で整理", "title": "A Unified Systematic Framework for Human-AI Collaboration: Technologies, Evaluation Metrics, and a Tiered Taxonomy", "url": "https://doi.org/10.1093/nsr/nwag688", "authors": "Zhang Zhang ほか", "venue": "National Science Review", "date": "2026-10-30", "sjr": 2.8, "citescore": 17.9, "citescore_year": "2025", "apa": "Zhang, Z., Li, S., Chen, J., Wu, J., Liu, X., Yao, N.-M., Pang, S., Zou, B., Sun, Y., Zhang, Y., Wang, H., Xue, J., & Wang, L. (2026). A Unified Systematic Framework for Human-AI Collaboration: Technologies, Evaluation Metrics, and a Tiered Taxonomy. National Science Review. https://doi.org/10.1093/nsr/nwag688", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、登録された抄録を使用", "preprint": false, "short": true, "p1": "人とAIの協働（HAIC）を、マルチエージェント系に基づく統一的な枠組みで整理し、評価方法と階層的な分類を提案した総説（抄録）。", "p3": "状況評価、社会的理解、共有された意思決定と制御、人間-AI相互作用、協調学習の5本柱で文献を統合し、多次元の指標を組み合わせた系レベルの評価法を導入した（抄録）。", "p5": "実証の数値はなく、枠組み・評価法・分類の提案が成果である（抄録）。", "fun": "AIと人が一緒に働くといっても、道具として使う段階から、相談相手、チームの一員まで幅があります。この論文は、ばらばらだった研究を5つの柱で整理し、どの段階の協働なのかを測る物差しを作ろうとしています。協働の「深さ」を段階で分ける発想が面白い点です。", "unverified": "階層的な分類の具体的な段階（抄録の途中で切れている）。"}}, {"id": "jr25", "rank": 25, "headline": "ウクライナ難民のリモート求人を分析", "title": "Digital employment pathways for Ukrainian refugees in Romania: an exploratory study of remote job offers", "url": "https://doi.org/10.1057/s41599-026-07997-0", "authors": "Mariana Rosca ほか", "venue": "Humanities and Social Sciences Communications", "date": "2026-10-31", "sjr": 0.904, "citescore": 5.7, "citescore_year": "2025", "apa": "Rosca, M., & Goktas, P. (2026). Digital employment pathways for Ukrainian refugees in Romania: an exploratory study of remote job offers. Humanities and Social Sciences Communications. https://doi.org/10.1057/s41599-026-07997-0", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、登録された抄録を使用", "preprint": false, "short": true, "p1": "ルーマニアでウクライナ難民向けに出されたリモートの求人を、分野・経験水準・契約形態ごとに分析した探索的研究（抄録）。", "p3": "リモート・デジタル労働が移動・育児・法的な制約を抱える避難者の就労統合に役立つかという問いのもとで、求人情報を記述的に分析した（抄録）。", "p5": "主な傾向と労働統合策の限界を示すとするが、具体的な数値は抄録の範囲では未確認（抄録）。", "fun": "戦争で避難した人の多くは子どもを連れた女性で、遠くへ通勤するのが難しい事情があります。在宅でできる仕事はその助けになるはずですが、実際にどんな求人があるかを調べた点が面白いところです。助けになるはずの仕組みが本当に届いているかを確かめる研究です。", "unverified": "求人の分布の具体的な数値。"}}, {"id": "jr26", "rank": 26, "headline": "資本集約度が裁量的発生高を左右する", "title": "Capital Intensity and Accrual-Based Earnings Management in Vietnamese Listed Non-Financial Firms", "url": "https://doi.org/10.5281/zenodo.23831519", "authors": "Thi Thu Huong Tran ほか", "venue": "Zenodo (Journal article)", "date": "2026-10-31", "apa": "Thi Thu Huong Tran, Duc Khanh Dinh, Hoang Viet Doan, Bich Ngoc Nguyen, & Sulinda Phommalisack. (2026). Capital Intensity and Accrual-Based Earnings Management in Vietnamese Listed Non-Financial Firms. INTERNATIONAL JOURNAL OF SOCIAL SCIENCE HUMANITY & MANAGEMENT RESEARCH. https://doi.org/10.5281/ZENODO.23831519", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoに保存された掲載論文の抄録を使用", "preprint": false, "short": true, "p1": "ベトナムの上場非金融企業で、資本集約度が高い企業ほど裁量的発生高（利益調整の大きさ）が小さいことを示した（抄録）。", "p3": "企業の財務諸表から作った不均衡パネルで、業種×年の修正ジョーンズモデルにより裁量的発生高を推定し、その絶対値を利益調整の大きさとした。企業・年の固定効果、FGLS、Driscoll–Kraay推定を用いた（抄録）。", "p5": "観測できる企業特性を考慮しても、資本集約度と裁量的発生高の絶対値の間に一貫して負の関連があった（抄録）。", "fun": "会計の利益には、経営者の判断で多少動かせる部分があります。工場や機械のような固定資産が多い会社は、動かせる余地が小さいのかもしれません。会社の「体つき」が数字のごまかしやすさを左右する、という見方が面白い点です。", "unverified": "標本の企業数・期間。"}}, {"id": "jr27", "rank": 27, "headline": "働く認知症介護者の心理的柔軟性を日次測定", "title": "Psychological flexibility in the work-caregiving interplay of employed family caregivers of people with dementia (DAILY-FLEX): Protocol of an experience sampling study", "url": "https://doi.org/10.1371/journal.pone.0361760", "authors": "Nahal Amini Moghaddam ほか", "venue": "PLoS ONE", "date": "2026-10-30", "citescore": 4.8, "citescore_year": "2025", "apa": "Amini Moghaddam, N., Bartels, S. L., Schok, M., Bakker, A. B., Atefi, G., Markaryan, M., & de Vugt, M. (2026). Psychological flexibility in the work-caregiving interplay of employed family caregivers of people with dementia (DAILY-FLEX): Protocol of an experience sampling study. PLOS One, 21(10), e0361760. https://doi.org/10.1371/journal.pone.0361760", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PLoS ONEの研究計画（プロトコル）の抄録を使用", "preprint": false, "short": true, "p1": "認知症の家族を介護しながら働く人の、仕事と介護の波及と心理的柔軟性の役割を日々測る研究（DAILY-FLEX）の計画（抄録）。", "p3": "仕事-家庭資源モデルに基づき、心理的柔軟性（つらい経験に開かれつつ価値に沿って行動する力）を動的な個人資源とみなし、集中的な縦断観察（経験サンプリング）で瞬間・日単位の双方向の波及と媒介を調べる計画（抄録）。", "p5": "研究計画のため結果はない（抄録）。", "fun": "仕事と介護を両立する人は、職場での疲れが家に、家での心配が職場に持ち込まれがちです。この研究は1日の中で何度も気持ちを記録し、その行き来を細かく追おうとしています。「しなやかな心」が緩衝材になるかという問いが面白い点です。", "unverified": "対象者数と測定回数（抄録の途中で切れている）。"}}, {"id": "jr28", "rank": 28, "headline": "不適切な議論文の書き直しを編集単位で評価", "title": "A unified evaluation framework for revising inappropriate arguments with edit-level guidance", "url": "https://doi.org/10.3389/frai.2026.1869755", "authors": "Timon Ziegenbein ほか", "venue": "Frontiers in Artificial Intelligence", "date": "2026-10-30", "citescore": 8.0, "citescore_year": "2025", "apa": "Ziegenbein, T., Lukic, S., & Wachsmuth, H. (2026). A unified evaluation framework for revising inappropriate arguments with edit-level guidance. Frontiers in Artificial Intelligence, 9. https://doi.org/10.3389/frai.2026.1869755", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、登録された抄録を使用", "preprint": false, "short": true, "p1": "不適切な議論文を作成時に書き直す2つの既存手法を、編集操作の共通枠組みで統合し評価する方法を示した（抄録）。", "p3": "全文を書き直させてから差分で編集案を取り出すPPO型と、部分ごとの編集案を直接生成させるGRPO型を、同じ編集操作の枠組みで比較できるようにし、課題の望ましい性質と2つの追加の品質指標を定義した（抄録）。", "p5": "比較の具体的な結果は抄録の範囲では未確認（抄録）。", "fun": "ネットの議論で言い方がきつすぎると、中身がよくても話し合いが壊れてしまいます。この研究は、AIに「ここをこう直したら」と部分的な修正を提案させる方法を、公平に比べる物差しを作りました。言葉づかいを整えることで民主的な話し合いを守ろうとする点が面白いところです。", "unverified": "2つの追加指標の内容と比較結果。"}}, {"id": "jr29", "rank": 29, "headline": "消費者主権のデジタル製品パスポート設計", "title": "Whose passport is it anyway? A decentralized web3-inspired architecture for sovereign digital product passports in the circular economy", "url": "https://doi.org/10.1007/s12525-026-00927-7", "authors": "Matthias Babel ほか", "venue": "Electronic Markets", "date": "2026-10-31", "sjr": 2.143, "citescore": 16.8, "citescore_year": "2025", "apa": "Babel, M., Guthmann, C., Körner, M.-F., Kranz, T., & Strüker, J. (2026). Whose passport is it anyway? A decentralized web3-inspired architecture for sovereign digital product passports in the circular economy. Electronic Markets, 36(1). https://doi.org/10.1007/s12525-026-00927-7", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、登録された抄録を使用", "preprint": false, "short": true, "p1": "循環経済で消費者が製品情報を長く確かめられるよう、ウォレット型で分散的なデジタル製品パスポートの設計を示した（抄録）。", "p3": "デザインサイエンス研究の方法で、デジタルウォレット、検証可能な資格情報（VC）、NFTを組み合わせ、データの真正性（VC）と所有（NFT）を切り離す構成を作った（抄録）。", "p5": "発行者が市場から退出しても製品データが参照・検証できる設計になっていると述べる。評価の数値は抄録の範囲では未確認（抄録）。", "fun": "中古品を買うとき、その品の修理歴や素材が分かれば安心です。でも情報を持つメーカーがなくなると確かめられません。この研究は「本物であること」と「誰の物か」を別々に記録して、メーカーが消えても情報が残る仕組みを考えた点が面白いところです。", "unverified": "設計の評価方法と結果。"}}, {"id": "jr30", "rank": 30, "headline": "コロナ禍の対人ストレスと孤独が重なる害", "title": "Interpersonal Stressors and Adolescent Mental Health During COVID-19: Investigating the Role of Loneliness", "url": "https://doi.org/10.1007/s10578-026-02113-4", "authors": "Atina Manvelian ほか", "venue": "Child Psychiatry and Human Development", "date": "2026-10-31", "sjr": 1.165, "citescore": 7.4, "citescore_year": "2025", "apa": "Manvelian, A., Szkody, E., Cohen, K. A., & Schleider, J. L. (2026). Interpersonal Stressors and Adolescent Mental Health During COVID-19: Investigating the Role of Loneliness. Child Psychiatry & Human Development. https://doi.org/10.1007/s10578-026-02113-4", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、登録された抄録を使用", "preprint": false, "short": true, "p1": "コロナ禍の米国の思春期の若者で、家族の支援不足・いじめ・差別と孤独が心の健康にどう関わるかを調べた（抄録）。", "p3": "事前登録した研究で、2020年11〜12月に43州の抑うつ症状の高い13〜16歳2,452人を対象に、対人ストレッサーと精神的健康の同時の関連と、孤独との交互作用を調べた（抄録）。", "p5": "知覚された差別が連続的な対人ストレッサーの中で最も強い標準化された相関を示した（抄録）。", "fun": "コロナで学校や友だちとの関係が途切れた時期、若者の心はとくに傷つきやすくなりました。この研究では、いじめや家族の支えより「差別されている」という感覚が最も強く心の不調と結びついていました。孤独がそれをさらに強めるかを調べた点が面白いところです。", "unverified": "孤独との交互作用の結果（抄録の途中で切れている）。"}}, {"id": "jr31", "rank": 31, "headline": "ウェアラブルで小児科医の燃え尽きを検出", "title": "Identifying Burnout in Pediatric Clinicians Using Wearable Biometric Data: Development and Feasibility Study.", "url": "https://doi.org/10.2196/104511", "authors": "Ayres TB ほか", "venue": "Journal of medical Internet research", "date": "2026-10-29", "sjr": 2.109, "citescore": 10.4, "citescore_year": "2025", "apa": "Ayres, T. B., Quaye, G. E., Gill, H. S., Pritchett, A., Koertje, C., Leeder, J. S., Fridley, B. L., & Addington, T. (2026). Identifying Burnout in Pediatric Clinicians Using Wearable Biometric Data: Development and Feasibility Study. Journal of Medical Internet Research, 28, e104511–e104511. https://doi.org/10.2196/104511", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、登録された抄録を使用", "preprint": false, "short": true, "p1": "スマートウォッチの生体データから、小児医療の臨床医の燃え尽きリスクを機械学習で分類できるかを試した予備研究（抄録）。", "p3": "3か月間、医療者がGarmin Venu 3を着けて連続的に生体データを集め、6週ごとに燃え尽きを自己報告した。勾配ブースティング（XGBoost）で高リスク・低リスクを分類した。対象は小児救急外来3施設と入院担当部門（抄録）。", "p5": "分類の精度は抄録の範囲では未確認（抄録）。", "fun": "心の疲れは本人も気づきにくいものです。この研究は、腕時計が測る心拍や睡眠などのデータから、燃え尽きそうな人を見つけられるかを確かめようとしています。体のデータに心の状態が表れるかという問いが面白い点です。", "unverified": "参加者数と分類精度（抄録の途中で切れている）。"}}, {"id": "jr32", "rank": 32, "headline": "猛暑下の建設作業の最適な休憩スケジュール", "title": "Developing an Optimal Work–Rest Schedule for Construction Workers in Hot Weather: A Case Study of South China", "url": "https://doi.org/10.1061/jmenea.meeng-7672", "authors": "Haiyi Zong ほか", "venue": "Journal of Management in Engineering", "date": "2026-10-31", "sjr": 1.486, "citescore": 13.1, "citescore_yea       });

    // three texts to hand on: a question for an AI, a note for another person, a reproduction request for an AI
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    HANDOFFS.forEach(function (h) {
      var b = el("button", "ask"); b.type = "button";
      h.label.forEach(function (part, i) {
        if (i) b.appendChild(document.createElement("wbr"));
        b.appendChild(document.createTextNode(part));
      });
      b.addEventListener("click", function () { copyText(h.make(it), askStatus, h.done); });
      askrow.appendChild(b);
    });
    card.appendChild(askrow); card.appendChild(askStatus);
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
