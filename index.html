ク構造と観測間隔にどう依存するかを示した研究。", "p3": "観測されたノード状態、ネットワーク構造、観測時刻を使うグラフ系列トランスフォーマー（GTA）を作り、要約統計のXGBoost、1次元CNN、最尤推定と、4種の合成ネットワークと5つの実データ構造で比べた（抄録）。", "p5": "GTAは疎で不均一なネットワークで感染の推定が最も正確なことが多く、密で均一なら要約法が同等以上。観測の間隔を広げると最初は改善するが、途中の遷移を見逃すと誤差が増えた。ノード状態の情報の欠落は辺の欠落より性能を損なった（抄録）。", "fun": "誰が誰と会ったかも、誰が感染しているかも一部しか分からない状態で、感染の広がり方を推定する問題です。観測を間引くと全体は見渡せるが途中を見逃す、というトレードオフは、限られた予算で何をいつ測るかという計測設計全般に通じます。", "unverified": "誤差の数値は抄録になく未確認。"}}, {"id": "jr33", "rank": 33, "headline": "利益調整とAI技術の開示は印象操作か", "title": "Earnings Management and Artificial Intelligence Technology Disclosure: Empirical Evidence from a Corporate Impression Management Perspective", "url": "https://doi.org/10.54254/2754-1169/2026.37844", "authors": "Yuehao Gao", "venue": "Advances in Economics Management and Political Sciences", "date": "2026-10-20", "apa": "Gao, Y. (2026). Earnings Management and Artificial Intelligence Technology Disclosure: Empirical Evidence from a Corporate Impression Management Perspective. Advances in Economics, Management and Political Sciences, 309(1), None–None. https://doi.org/10.54254/2754-1169/2026.37844", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "中国A株企業（2013〜2023年）で、年次報告のAI技術の開示が利益調整の水準と関連し、AIの記述が業績を飾る「物語」として使われうることを示した研究。", "p3": "上海・深圳の上場企業のパネルで、AI関連技術の開示と利益調整の関係を、上方・下方の利益調整に分けて推定し、所有構造による違いを調べた（抄録）。", "p5": "AI技術の開示は利益調整の水準と関連し、上方・下方を分けても頑健だった。関係は非国有企業でより強かった（抄録）。", "fun": "「AIを活用しています」という年次報告の一文は、本当の取り組みの説明かもしれないし、会社をかっこよく見せる化粧かもしれない。数字をいじる会社ほどAIを語りがちだとすれば、流行の言葉ほど疑ってかかる必要がある、という話です。", "unverified": "開示の測り方と係数の大きさは未確認。"}}, {"id": "jr34", "rank": 34, "headline": "眼科看護師は生成AIへの信頼を交渉する", "title": "Navigating the unknown: a qualitative descriptive study of ophthalmic nurses’ trust negotiation with generative artificial intelligence in China", "url": "https://doi.org/10.1186/s12912-026-05437-7", "authors": "Menglan Zhu ほか", "venue": "BMC Nursing", "date": "2026-10-21", "sjr": 1.368, "citescore": 5.3, "citescore_year": "2025", "apa": "Zhu, M., Zhang, X., Zhu, Y., Zhang, L., Li, R., Li, A., & Qu, L. (2026). Navigating the unknown: a qualitative descriptive study of ophthalmic nurses’ trust negotiation with generative artificial intelligence in China. BMC Nursing. https://doi.org/10.1186/s12912-026-05437-7", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "中国の眼科看護師26人への面接で、生成AIへの信頼は受け入れか拒否かではなく、業務ごとに段階的に調整される動的な交渉だと示した質的研究。", "p3": "東部・中部・西部の三次〜一次の眼科医療機関から最大変動抽出した26人に、重要事象法で半構造化面接を行い、再帰的主題分析を行った（抄録）。", "p5": "(1)好奇心から条件付きの信頼へ、(2)倫理的緊張の中で専門職の境界を守る、(3)組織の生態系の中での信頼交渉、の3主題を見いだし、業務ごとの段階的な調整を「勾配較正」と名づけた（抄録）。", "fun": "視力は一度失うと戻らず、目薬の量にも厳密さが求められる――そんな現場で看護師は、AIを「この作業なら任せる、これは任せない」と細かく使い分けている、という姿が描かれています。信頼は0か1かではない、という点が要点です。", "unverified": "他の診療科への一般化は未確認（著者明記）。"}}, {"id": "jr35", "rank": 35, "headline": "医療圏をまたぐ紹介と補助金で待ち時間を減らす", "title": "Cross-Cluster Referrals and Subsidy Schemes in Multi-Cluster Healthcare Systems", "url": "https://doi.org/10.1287/msom.2018.0526", "authors": "Liming Liu ほか", "venue": "Manufacturing and Service Operations Management", "date": "2026-10-21", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "apa": "Liu, L., Shang, W., Chao, X., & Zheng, S. (2026). Cross-Cluster Referrals and Subsidy Schemes in Multi-Cluster Healthcare Systems. Manufacturing & Service Operations Management. https://doi.org/10.1287/msom.2018.0526", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "公的医療の専門診療の待ち時間を減らす「医療圏をまたぐ紹介」と「民間への離脱補助」を、多圏域のサービス網モデルで分析し、効く条件と逆効果の条件を示した研究。", "p3": "個人最適と全体最適の下での最適な振り分けを、多圏域のサービスネットワーク・モデルで分析し、ネットワークでの外部性を定義してその性質を導いた（抄録）。", "p5": "切り替えの費用を下げると全体の性能が悪化しうる。固定の補助金は圏域間の外部性のため全体を完全には調整できないが、広い範囲で費用を下げる。状態に応じた動的補助金は個人と全体の最適を完全に一致させる（抄録）。", "fun": "空いている病院に患者を回せば待ち時間は減りそう――ところが、行き来を簡単にしすぎると全体がかえって悪くなることがある、という直感に反する結果です。一人ひとりの合理的な選択が全体の混雑を生む仕組みは、渋滞と同じ構図です。", "unverified": "モデルの数値例は抄録になく未確認。"}}, {"id": "jr36", "rank": 36, "headline": "法律相談AIは事実の組み立てから評価せよ", "title": "Fact construction as a missing layer in legal AI: a practice-grounded framework for evaluating multi-agent legal consultation", "url": "https://doi.org/10.3389/frai.2026.1896166", "authors": "Hsuan-Lei Shao ほか", "venue": "Frontiers in Artificial Intelligence", "date": "2026-10-20", "citescore": 8.0, "citescore_year": "2025", "apa": "Shao, H.-L., Yu, Y.-C., & Huang, S.-C. (2026). Fact construction as a missing layer in legal AI: a practice-grounded framework for evaluating multi-agent legal consultation. Frontiers in Artificial Intelligence, 9. https://doi.org/10.3389/frai.2026.1896166", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "法律相談のAIを評価するとき、法的推論の前段階である「事実の組み立て」を独立の評価層とし、役割を分けた多エージェントで評価する枠組みを示した研究。", "p3": "事実に縛られた相談者の分身、構造化した質問をする相談役、事実を物語にまとめる係、照合する評価係の4エージェントで、匿名化した100件の法律相談記録について複数のLLMを採点基準で評価した（抄録）。", "p5": "事例が内部的に一貫し、紛争が1つで、登場人物の役割が明確なときは使える事実の物語を生成できた。評価者のモデル間一致は中程度で、匿名化による指示の曖昧さ、第三者の伝聞、複数の出来事、数値の多い事実が失敗の原因だった（抄録）。", "fun": "法律の問題を解く前に、断片的な相談者の話から「何が起きたのか」を組み立てる必要があります。AIの評価では整った事実を最初から渡しがちですが、本当に難しいのはこの組み立ての部分だ、という指摘がポイントです。", "unverified": "モデルごとの成績は抄録になく未確認。"}}, {"id": "jr37", "rank": 37, "headline": "国境を越えてデジタルで親を介護する家族", "title": "Caring across borders: ageing and digital technology in transnational families", "url": "https://doi.org/10.1093/geront/gnag240", "authors": "Yan Wen ほか", "venue": "Gerontologist", "date": "2026-10-20", "sjr": 1.552, "citescore": 7.0, "citescore_year": "2025", "apa": "Wen, Y., Zhang, N., Vlachantoni, A., & Stanaway, F. (2026). Caring across borders: ageing and digital technology in transnational families. The Gerontologist. https://doi.org/10.1093/geront/gnag240", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "国外に住む子がデジタル技術で高齢の親を支える国境を越えた介護について、14研究を統合し、技術がつながりを生む一方で分断と不平等も強めることを示したレビュー。", "p3": "8つの電子資料を体系的に検索し、2020〜2025年の研究から14件を選んで主題分析した（抄録）。", "p5": "(1)導入と課題、(2)デジタルな親密さへの両価的な感情、(3)感情労働と戦略的な隠し事、(4)デジタル介護の文化規範と道徳の序列、(5)構造的な不平等の5主題を見いだした。技術は南北・性別・階層の不平等を再生産しがちだった（抄録）。", "fun": "ビデオ通話で毎日顔を見られても、心配をかけまいと体調の悪さを隠したり、逆に子が状況を隠したりする――技術がつなぐのは画面だけで、気持ちのすれ違いは残る、という点が人間らしいところです。", "unverified": "個々の研究の地域分布は未確認。"}}, {"id": "jr38", "rank": 38, "headline": "撤去した橋の部材をどこまで再利用できるか", "title": "Quantitative Framework for Assessing Bridge Component Reusability: Case Studies of Florida Bridges", "url": "https://doi.org/10.1061/jmenea.meeng-7625", "authors": "Maral Nazemi ほか", "venue": "Journal of Management in Engineering", "date": "2026-10-21", "sjr": 1.486, "citescore": 13.1, "citescore_year": "2025", "apa": "Nazemi, M., Zhang, Q., & Choi, J. (2027). Quantitative Framework for Assessing Bridge Component Reusability: Case Studies of Florida Bridges. Journal of Management in Engineering, 43(1). https://doi.org/10.1061/jmenea.meeng-7625", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "解体する橋の部材ごとに再利用の可否を数値で判定する「再利用性指数」を作り、フロリダの3橋に適用した研究。", "p3": "既存の定量評価法を整理して橋に特有の指標を作り、分解のしやすさ、独自性、運搬のしやすさなどを統合した指数を定義し、3橋の事例と費用分析、州交通局の技術者への面接で検証した（抄録）。", "p5": "再利用できる部分はコンクリート橋で0%、鋼桁橋で約9%と大きく異なったが、すべての橋は全面的にリサイクル可能だった。鋼桁の再利用で49.10%、リサイクルで17.75〜84.93%の費用節減を示した（抄録）。", "fun": "橋を壊したあと、部品をそのまま別の橋に使い回せるか――答えは「ほとんど無理、でも素材としては全部使える」でした。標準化された部品で橋を作っておけば将来の再利用が進む、という逆算の発想が面白いところです。", "unverified": "指数の重みづけの詳細は未確認。"}}, {"id": "jr39", "rank": 39, "headline": "精度だけでなく説明性と統治でモデルを選ぶ", "title": "Beyond Predictive Performance: An Explainability–Governance Score Framework for Multidimensional Machine Learning Model Selection", "url": "https://doi.org/10.3390/make8100343", "authors": "Fhulufhelo Ramphabana ほか", "venue": "Machine Learning and Knowledge Extraction", "date": "2026-10-21", "sjr": 1.548, "citescore": 12.7, "citescore_year": "2025", "apa": "Ramphabana, F., Swana, E. F., & Paepae, T. (2026). Beyond Predictive Performance: An Explainability–Governance Score Framework for Multidimensional Machine Learning Model Selection. Machine Learning and Knowledge Extraction, 8(10), 343. https://doi.org/10.3390/make8100343", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "機械学習モデルを予測精度だけでなく、説明の忠実さ・局所的な安定性・反実仮想の実行可能性・ガバナンスとの整合の4軸で評価して選ぶ枠組み（EGS）を提案した研究。", "p3": "既存のXAI手法、実行可能な救済策、ガバナンスの基準を統合した総合指標を作り、ドイツの信用、ピマ糖尿病、COMPASの3つの高リスク領域のデータで5つのモデルを評価した（抄録）。", "p5": "予測精度ではXGBoost・決定木・ランダムフォレストが各領域で首位だったが、EGSではロジスティック回帰が信用と医療で最高（0.915）、決定木が刑事司法で最高（0.886）。6つの重みづけで首位は変わらなかった（抄録）。", "fun": "テストの点数が一番のモデルが、社会で使うのに一番ふさわしいとは限らない――説明しやすさや、「どうすれば結果が変わるか」を示せるかまで含めると、昔ながらの単純なモデルが勝つ、という結果が示唆的です。", "unverified": "4軸の具体的な算出法は未確認。"}}, {"id": "jr40", "rank": 40, "headline": "POD-Galerkin縮約モデルを残差で補正", "title": "Residual correction for POD-Galerkin reduced-order models in hypersonic flow-field prediction", "url": "https://doi.org/10.1088/1742-6596/3337/1/012019", "authors": "Jingchao Zhang ほか", "venue": "Journal of Physics: Conference Series", "date": "2026-10-21", "citescore": 1.1, "citescore_year": "2025", "apa": "Zhang, J., Chen, S., & Hong, G. (2026). Residual correction for POD-Galerkin reduced-order models in hypersonic flow-field prediction. Journal of Physics: Conference Series, 3337(1), 12019. https://doi.org/10.1088/1742-6596/3337/1/012019", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "極超音速流の衝撃波のような不連続を、POD縮約モデルで予測するとき、ニュートン反復中に残差で補正した解をモードに加えていく方法（RCG-POD）で精度を上げた研究。", "p3": "POD基底への射影とガラーキン法による縮約モデルを、残差を補正した流れ場の解で反復的に拡充する方法を作り、高度・マッハ数・迎角を変えた極超音速の円柱周り流れで検証した（抄録）。", "p5": "300回の残差補正で残差は1桁下がり、平均絶対誤差率の最大は1.3%。衝撃波の領域で、補間型やガラーキン型のPODより誤差が小さく、圧力と熱流束はCFDと実験に良く一致した（抄録）。", "fun": "たくさんの計算結果から「主要な形（モード）」だけを取り出して高速に予測するのが縮約モデルですが、動く衝撃波のような急な変化は少数の形の重ね合わせでは表しにくい。そこで、間違いを見つけるたびにその分を形に加えていく、という学習的な発想が鍵です。", "unverified": "計算時間の削減効果は抄録になく未確認。"}}, {"id": "jr41", "rank": 41, "headline": "スマートシティのバス到着予測をAIで総覧", "title": "Artificial Intelligent Public Bus Arrivals for Smart Cities: A Survey", "url": "https://doi.org/10.1145/3859870", "authors": "Song-Kyoo Kim ほか", "venue": "ACM Computing Surveys", "date": "2026-10-21", "sjr": 5.985, "citescore": 65.2, "citescore_year": "2025", "apa": "Kim, S.-K., & Chen, Y. (2026). Artificial Intelligent Public Bus Arrivals for Smart Cities: A Survey. ACM Computing Surveys. https://doi.org/10.1145/3859870", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "スマートシティのバス到着予測に機械学習を使う研究120本を整理したサーベイ。", "p3": "IEEE Xplore・Google Scholar・arXivから選んだ120本の論文を、4つの研究領域に分類し、2002〜2025年の出版傾向を分析した（抄録）。", "p5": "初期のGPSに基づく方法からデータ統合型の方法への発展をたどり、予測精度・都市の効率・乗客体験の改善と課題を整理した。出版数は2017年に16本で最多だった（抄録）。", "fun": "「バスがあと何分で来るか」という身近な表示の裏には、GPS、渋滞、乗降の時間など多くの要素を読む予測技術があります。20年余りの研究の流れを一望できるのがサーベイの価値です。", "unverified": "4つの研究領域の具体名は抄録から確定できず未確認。"}}, {"id": "jr42", "rank": 42, "headline": "屋台の口コミと店の返信が忠誠心を生む", "title": "The Authenticity Effect: How Digital Word-of-Mouth and Management Response Shape Customer Loyalty in Street Food", "url": "https://doi.org/10.3390/jtaer21100383", "authors": "Ahmed K. Elnagar ほか", "venue": "Journal of Theoretical and Applied Electronic Commerce Research", "date": "2026-10-21", "citescore": 7.1, "citescore_year": "2025", "apa": "Elnagar, A. K., Verdejo, E. Á., Salama, W. M. E., & Suliman, M. A. (2026). The Authenticity Effect: How Digital Word-of-Mouth and Management Response Shape Customer Loyalty in Street Food. Journal of Theoretical and Applied Electronic Commerce Research, 21(10), 383. https://doi.org/10.3390/jtaer21100383", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "カイロとギザの屋台の客437人の調査で、電子口コミが「本物らしさ」の知覚を通じて顧客の忠誠心を高め、店の返信の仕方がその効果を強めることを示した研究。", "p3": "精緻化見込みモデルやシグナリング理論などを統合した枠組みで、本物らしさの媒介と経営者の返信戦略の調整効果をPLS-SEMで検定した（抄録）。", "p5": "電子口コミは本物らしさと忠誠心の両方に正の効果を持ち、本物らしさは部分的な媒介だった。素早く、個人的で、文化的価値に沿った返信は、口コミ→本物らしさ、本物らしさ→忠誠心の両方の関係を強めた（抄録）。", "fun": "屋台のような小さな店でも、ネットの口コミへの返し方ひとつで常連客が増える――しかも決め手は「本物の味」と感じてもらえるかどうか。デジタルの時代でも、伝統らしさが売りになるという点が面白いところです。", "unverified": "効果の大きさは抄録になく未確認。"}}, {"id": "jr43", "rank": 43, "headline": "退役軍人家族の介護が家計と健康に及ぶ", "title": "Informal Caregiving in Australian Veteran Families: Economic Costs, Caregiver Burden, and Health-Related Quality of Life Spillover Effects.", "url": "https://doi.org/10.1093/milmed/usag461", "authors": "Dang TTH ほか", "venue": "Military medicine", "date": "2026-10-20", "citescore": 2.3, "citescore_year": "2025", "apa": "Dang, T. T. H., Hu, J., Tabinga, A., Mellor, R., Tuffaha, H., Guindalini, C., Nghiem, S. H., & Van Hooff, M. (2026). Informal Caregiving in Australian Veteran Families: Economic Costs, Caregiver Burden, and Health-Related Quality of Life Spillover Effects. Military Medicine. https://doi.org/10.1093/milmed/usag461", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Europe PMCに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "オーストラリアで負傷・病気の退役軍人を介護する家族245人の調査で、介護の経済的価値と、介護者の生活の質の損失を推計した研究。", "p3": "全国横断調査で負担尺度と生活の質（AQoL-8D）などを測り、介護の費用を代替費用法で推計し、一般の介護者とのマッチングで生活の質の波及を評価した（抄録）。", "p5": "介護時間の中央値は週30時間、期間は10年。週の代替費用の中央値は1,052豪ドル、介護期間全体で544,895豪ドル。一般の介護者に比べ年0.135 QALYの損失（95%CI −0.17〜−0.10）だった（抄録）。", "fun": "家族による介護は給料が払われないので、経済の統計には表れにくい「見えない労働」です。もしヘルパーを雇ったらいくらかかるかで換算すると、一人あたり数千万円規模になる――数字にすることで初めて負担の大きさが見えてきます。", "unverified": "便宜標本の代表性は未確認。"}}, {"id": "jr44", "rank": 44, "headline": "仕事の要求と資源がデジタル幸福感を左右", "title": "From Strain to Sustainability: Impact of Job Demands and Job Resources on Employee Digital Wellbeing in Service Sector of Pakistan", "url": "https://doi.org/10.29145/jmr.131.02", "authors": "Mahnoor Maqbool ほか", "venue": "Journal of Management and Research", "date": "2026-10-21", "apa": "Maqbool, M., & Ahmad, A. (2026). From Strain to Sustainability: Impact of Job Demands and Job Resources on Employee Digital Wellbeing in Service Sector of Pakistan. Journal of Management and Research, 13(1), 22–47. https://doi.org/10.29145/jmr.131.02", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "パキスタンの銀行・ITの従業員166人の2時点調査で、仕事の要求はテクノストレスを通じてデジタル・ウェルビーイングを下げ、仕事の資源はエンゲージメントを通じて上げることを示した研究。", "p3": "仕事の要求-資源（JD-R）モデルに基づき、時間差をおいた2回の質問紙調査で166の回答を得て、PROCESSマクロで媒介分析を行った（抄録）。", "p5": "仕事の要求はデジタル・ウェルビーイングを下げ、テクノストレスが部分的に媒介した。仕事の資源は上げ、エンゲージメントが部分的に媒介した（抄録）。", "fun": "デジタル化した職場では、通知や画面の多さが新しい「疲れ」を生みます。負担は心の消耗の道を、支えはやる気の道を通って幸福感に効く、という2本の道筋を同時に見せたのがこのモデルの分かりやすさです。", "unverified": "標本が小さく効果量は未確認。"}}, {"id": "jr45", "rank": 45, "headline": "既存RC道路橋の耐震補強をどう優先するか", "title": "Seismic Retrofit Strategy Selection and Prioritisation for Existing RC Road Bridges", "url": "https://doi.org/10.3390/infrastructures11100384", "authors": "Marco Vona ほか", "venue": "Infrastructures", "date": "2026-10-21", "citescore": 5.7, "citescore_year": "2025", "apa": "Vona, M., Diomedi, G., Parisi, S., & Cardone, D. (2026). Seismic Retrofit Strategy Selection and Prioritisation for Existing RC Road Bridges. Infrastructures, 11(10), 384. https://doi.org/10.3390/infrastructures11100384", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "耐震性の低い既存のRC道路橋について、安全指標・ライフサイクル費用・迂回路のGIS分析・多基準分析を組み合わせて補強策を選ぶ手順を示し、事例では架け替えが最適だった研究。", "p3": "(i)検証済み安全指標、(ii)100年の割引ライフサイクル費用、(iii)代替交通路のGIS分析、(iv)2段階の単純加重和の多基準分析を組み合わせ、3径間ゲルバー式RC橋（L=78m、初期安全指標0.06）で3案を比べた（抄録）。", "p5": "全面架け替え（C案）が基本ケースで首位、5つの重みシナリオのうち4つと、無作為な重み20,000通りの約99%で首位だった。割引率2%の100年費用はC案398万、補強A案445万、部分撤去B案584万ユーロ（抄録）。", "fun": "古い橋は直して使うのが安上がり、と思いがちですが、100年の維持費まで含めると建て替えの方が安くて安全な場合もある、という結果です。重みのつけ方を2万通り試して結論が揺るがないことを確かめた点に説得力があります。", "unverified": "他の橋への一般化は未確認。"}}, {"id": "jr46", "rank": 46, "headline": "人は対話AIの「キャラクター」をどう読むか", "title": "Social chatbots and character: Mind-modelling, mimetics, and postdigital misperception", "url": "https://doi.org/10.1177/09639470261493289", "authors": "Alice Bell", "venue": "Language and Literature", "date": "2026-10-21", "sjr": 0.413, "citescore": 2.1, "citescore_year": "2025", "apa": "Bell, A. (2026). Social chatbots and character: Mind-modelling, mimetics, and postdigital misperception. Language and Literature: International Journal of Stylistics. https://doi.org/10.1177/09639470261493289", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "対話AI（character.ai）の利用者がAIの出力を「キャラクター」としてどう読み取るかを実証的に調べ、認知文体論・物語論の概念を拡張した研究。", "p3": "character.aiの利用者の反応の実証研究をもとに、他者の心を推測する心的モデル化の概念で擬人化を分析し、物語論の受け手の反応の類型を拡張した（抄録）。", "p5": "他の媒体のキャラクターの知識と照らす「トランスミメティック」、人間らしすぎて存在のあり方を疑う「ハイパーミメティック」の2つの反応型と、LLMの出力の出所を取り違える「ポストデジタル誤認」の概念を提案した（抄録）。", "fun": "小説の登場人物は作者が書きますが、対話AIのキャラクターは利用者との会話の中で一緒に作られていきます。あまりに人間らしいと「中に人がいるのでは」と疑ってしまう――作り物と本物の境目が揺らぐ体験を言葉にしようとした研究です。", "unverified": "調査の規模と方法は抄録になく未確認。"}}, {"id": "jr47", "rank": 47, "headline": "インドの高齢者の孤立と孤独を質的に統合", "title": "Social isolation and loneliness among older persons in India: A qualitative evidence synthesis", "url": "https://doi.org/10.25259/ijmr_1017_2026", "authors": "Vijayaprasad Gopichandran ほか", "venue": "Indian Journal of Medical Research", "date": "2026-10-21", "citescore": 3.5, "citescore_year": "2025", "apa": "Gopichandran, V., Thiagesan, R., & Muralidharan, N. (2026). Social isolation and loneliness among older persons in India: A qualitative evidence synthesis. Indian Journal of Medical Research, 0, 1–12. https://doi.org/10.25259/ijmr_1017_2026", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "インドの高齢者の社会的孤立と孤独についての質的研究21件を統合し、個人・対人・地域・構造の各次元の要因を整理した研究。", "p3": "PubMed・Scopus・CINAHL・Google Scholarで2015〜2025年の質的・混合研究を検索し、1,265件から21件を選んで主題統合した（PROSPERO登録あり）（抄録）。", "p5": "身体の不調と孤独は互いに悪化させ合い、宗教的な営みや前向きな姿勢は緩衝になった。家族構造の変化や移住、世代間の対立、子どもの過保護、家族の中で軽んじられる感覚は孤独を強め、性別・カースト・貧困・差別などの構造要因も寄与した（抄録）。", "fun": "孤独は一人暮らしかどうかだけで決まるわけではなく、家族と住んでいても「大事にされていない」と感じれば孤独になる――そんな心の側面と、カーストや貧困のような社会の仕組みの側面を同時に描いている点が特徴です。", "unverified": "個別研究の地域や対象の偏りは未確認。"}}, {"id": "jr48", "rank": 48, "headline": "インドネシアとシンガポールの財務困窮を比較", "title": "Fenomena Financial Distress Pada Perusahaan Non-Keuangan Di Indonesia Dan Singapura The Phenomenon of Financial Distress in Non-Financial Companies in Indonesia and Singapore", "url": "https://doi.org/10.36490/jmdb.v3i3.1684", "authors": "Octaviana Anandya Jasmine ほか", "venue": "JURNAL MANAJEMEN DAN BISNIS", "date": "2026-10-21", "apa": "Jasmine, O. A., Giovanni, A., & Ratnawati, S. (2025). The Phenomenon of Financial Distress in Non-Financial Companies in Indonesia and Singapore. Jurnal Manajemen Dan Bisnis, 3(3), 297–314. https://doi.org/10.36490/jmdb.v3i3.1684", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "2014〜2023年のインドネシアとシンガポールの非金融企業4,280社について、アルトマンZスコアで業種別の財務困窮を記述した研究。", "p3": "目的的抽出で選んだ企業に記述統計とアルトマンZスコア・モデルを適用し、業種ごとに困窮・グレー・健全に分類した（抄録）。", "p5": "インドネシアではインフラと運輸・物流が困窮、一般消費財がグレー。シンガポールでは宿泊・飲食、管理支援、農漁業、電気・ガス供給などが困窮、鉱業と卸小売がグレーだった（抄録）。", "fun": "倒産の危険度を財務比率の組み合わせで点数化するZスコアは、50年以上前に作られた古典的な道具です。それを2つの国の業種別に当てはめると、国ごとに苦しい業種がまったく違うことが見えてくる、という比較の面白さがあります。", "unverified": "因果的な要因分析はしていない。"}}, {"id": "jr49", "rank": 49, "headline": "気候適応都市の試行は都市を広げたか", "title": "Does the climate-adaptive city pilot policy exacerbate urban sprawl? Evidence from a quasi-natural experiment in China", "url": "https://doi.org/10.1016/j.apgeog.2026.104222", "authors": "Peixian Liu ほか", "venue": "Applied Geography", "date": "2026-10-21", "sjr": 1.597, "citescore": 10.0, "citescore_year": "2025", "apa": "Liu, P., Wang, L., Han, N., Zhong, F., Zhang, X., & Jiao, Y. (2027). Does the climate-adaptive city pilot policy exacerbate urban sprawl? Evidence from a quasi-natural experiment in China. Applied Geography, 198, 104222. https://doi.org/10.1016/j.apgeog.2026.104222", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、中国の「気候適応都市」の試行政策が都市の無秩序な拡大（スプロール）を悪化させたかを、準自然実験で検証した研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "気候変動に強い街づくりを進めると、かえって郊外への広がりを促してしまうのか――よかれと思った政策が別の問題を生まないかを問う点が面白いところです。政策を試した都市と試さない都市を比べる「自然の実験」で確かめようとしています。", "unverified": "手法・結果・データはすべて未確認。"}}, {"id": "jr50", "rank": 50, "headline": "GNSSが途切れても5GとIMUで位置を保つ", "title": "Tightly coupled GNSS/IMU/5G positioning with bidirectional IMU–5G constraints for intermittent GNSS environments", "url": "https://doi.org/10.1016/j.measurement.2026.123649", "authors": "Fangxin Li ほか", "venue": "Measurement: Journal of the International Measurement Confederation", "date": "2026-10-21", "sjr": 1.145, "citescore": 10.2, "citescore_year": "2025", "apa": "Li, F., Tu, R., Zhang, X., Hong, J., Zhang, P., & Wang, J. (2026). Tightly coupled GNSS/IMU/5G positioning with bidirectional IMU–5G constraints for intermittent GNSS environments. Measurement, 123649. https://doi.org/10.1016/j.measurement.2026.123649", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、GNSSが途切れる環境で、IMUと5Gの測位を双方向の拘束で密に結合して位置推定を保つ方法を提案した研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "トンネルやビルの谷間では衛星の電波が届かず、位置が分からなくなります。そこで車の揺れを測るセンサ（IMU）と携帯電話の基地局の電波（5G）でお互いを補い合う、という発想が題名から読み取れる問いです。", "unverified": "手法・結果・精度はすべて未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "因果推論", "headline": "線形IVをLATEと読んでよい条件・いけない条件", "title": "When Should We (Not) In ank": 15, "field": "経営学", "headline": "ファッション企業が認証を重ねる戦略の混乱", "title": "Strategic Adaptation or Strategic Confusion? Fashion Organisations' Engagement With Sustainability Certifications", "url": "https://doi.org/10.1002/bse.71693", "authors": "Josephine Alice Mckenzie ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-21", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Mckenzie, J. A., Sandhu, S., & Kulik, C. T. (2026). Strategic Adaptation or Strategic Confusion? Fashion Organisations’ Engagement With Sustainability Certifications. Business Strategy and the Environment. https://doi.org/10.1002/bse.71693", "why": "費用がかかるのに複数の環境認証を重ねて採用する現象を、普及と効果の逆説として分析したサステナビリティ・ガバナンスの研究。"}, {"id": "jn16", "rank": 16, "field": "開発経済学", "headline": "世界の農地は効率とストレスの二極に分かれる", "title": "Global Cropland Efficiency-Stress Divide: Typological Diagnosis and Reconciling Pathways", "url": "https://doi.org/10.1021/acs.est.6c07911", "authors": "Tingyu Hu ほか", "venue": "Environmental Science & Technology", "date": "2026-10-21", "sjr": 3.776, "citescore": 18.9, "citescore_year": "2025", "apa": "Hu, T., Song, J., Yang, W., & Wang, X. (2026). Global Cropland Efficiency-Stress Divide: Typological Diagnosis and Reconciling Pathways. Environmental Science & Technology. https://doi.org/10.1021/acs.est.6c07911", "why": "世界の農地の土地利用効率と環境負荷を類型化し、両立の道筋を診断した食料安全保障の研究。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "世界の農地を「土地利用の効率」と「土地の生態的ストレス」の2軸で類型化し、効率は高いが生態的に赤字の地域などを特定した研究。", "p3": "超効率のスラック・ベース測度（SBM）と土地のエコロジカル・フットプリント会計を組み合わせた診断枠組みで、2011・2015・2019・2022年の各地域を類型化し、改善の優先点を診断した（抄録）。", "p5": "2022年に62.5%の地域で効率が1未満。中国（1.90）とブラジル（1.81）は効率が高いが生態的赤字が大きい。インドネシアとオーストラリアは生産由来のフットプリントの55.9%、68.0%を輸出していた。灌漑水とエネルギーが非効率の主因で、赤字地域ではフットプリントが生物生産力を約5〜35%上回った（抄録）。", "fun": "たくさん収穫できる「効率の良い」農地が、実は土地に無理をさせている場合がある――効率と持続性は別物だという点を地図で示しています。しかも作物の輸出を通じて、その負担が他国の食卓のために生じていることも見えてきます。", "unverified": "地域区分の単位は抄録から確定できず未確認。"}}, {"id": "jn17", "rank": 17, "field": "政治学", "headline": "フロリダの大学で学問の自由と自己検閲", "title": "From the Authoritarian Playbook: Academic Freedom and the Politics of Self-Censorship in Florida", "url": "https://doi.org/10.1017/s1537592726106422", "authors": "Janika Spannagel", "venue": "Perspectives on Politics", "date": "2026-10-21", "sjr": 2.923, "citescore": 9.4, "citescore_year": "2025", "apa": "Spannagel, J. (2026). From the Authoritarian Playbook: Academic Freedom and the Politics of Self-Censorship in Florida. Perspectives on Politics, 1–19. https://doi.org/10.1017/s1537592726106422", "why": "州政府による大学自治への介入の下で、研究者の自己検閲がどう生じるかを実証した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "2021〜2023年のフロリダ州の大学への政治介入の下で、法が求めていない形で研究者が教育・研究を自己検閲していることを、60件の面接で示した研究。", "p3": "民主主義下の「萎縮効果」の理論を、司法審査を回避する穏やかな抑圧の手段として拡張し、2024年初めに州内6大学で60件の質的面接を行った（抄録）。", "p5": "広がる不確実性と非公式な威圧により、研究者は法の規定を超えて授業と研究で自己検閲していた。行動は個人差があり大学の対応にも左右されるが、孤立した事例ではないとした（抄録）。", "fun": "法律で禁止されていなくても、「何をしたら問題になるか分からない」という空気だけで人は口をつぐむ――検閲が目に見えないまま広がる仕組みを描いています。何も禁止していないのに効果がある点こそが怖さだ、という指摘です。", "unverified": "面接対象者の分野の内訳は未確認。"}}, {"id": "jn18", "rank": 18, "field": "政治学", "headline": "民主主義の満足を決めるのは政策の一致だった", "title": "The effect of mass–elite congruence in representational style on citizens’ democratic satisfaction", "url": "https://doi.org/10.1017/s175577392610071x", "authors": "Philippe Mongrain ほか", "venue": "European Political Science Review", "date": "2026-10-21", "sjr": 1.743, "citescore": 5.4, "citescore_year": "2025", "apa": "Mongrain, P., & Junius, N. (2026). The effect of mass–elite congruence in representational style on citizens’ democratic satisfaction. European Political Science Review, 1–25. https://doi.org/10.1017/s175577392610071x", "why": "ポルトガルの3回の選挙データで、代表のあり方についての市民と議員の考えの一致（過程の一致）は、政策の一致を考慮すると民主主義への満足と頑健には関連しないことを示した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "代表のあり方についての市民と議員の考えの一致（過程の一致）は、政策の一致を考慮すると、民主主義への満足と頑健には関連しないことを示した研究。", "p3": "ポルトガルの3回の選挙（2005・2011・2015年）のデータで、過程の一致と満足の関係と、政治的関心・学歴による調整を分析した（抄録）。", "p5": "政策の一致が満足の最も強い相関要因で、過程の一致の独立の関連は小さく頑健でなかった。代理人型より受託者型の代表を好む人の方が満足が高かった。関心・学歴による調整は予想と異なり、学歴の弱い調整は逆向きだった（抄録）。", "fun": "「政治家が自分の考えどおりに動くべきか、任せて判断してもらうべきか」という好みが政治家と合っていても、満足度はほとんど変わらない――結局は政策の中身が大事、という結果です。予想が外れたことを率直に報告している点も誠実です。", "unverified": "効果の大きさは抄録になく未確認。"}}, {"id": "jn19", "rank": 19, "field": "政治学", "headline": "デジタル通信で都市周縁を支配する武装勢力", "title": "Digitally Networked Territorial Control: Digital Communication and Hybrid Order in the Urban Periphery", "url": "https://doi.org/10.1017/s1537592726106288", "authors": "Daniel Rincón Machón", "venue": "Perspectives on Politics", "date": "2026-10-21", "sjr": 2.923, "citescore": 9.4, "citescore_year": "2025", "apa": "Rincón Machón, D. (2026). Digitally Networked Territorial Control: Digital Communication and Hybrid Order in the Urban Periphery. Perspectives on Politics, 1–25. https://doi.org/10.1017/s1537592726106288", "why": "武装勢力がデジタル通信を使って都市周縁の領域支配を行う仕組みを分析した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "ブラジル・フォルタレザの都市周縁で、犯罪組織と軍事化した警察がスマホ検査、情報共有網、SNS監視というデジタル手段で領域支配を行う仕組みを示した研究。", "p3": "比較エスノグラフィーと公開情報の調査法で、3つのデジタルな情報収集の実践を分析した（抄録）。", "p5": "デジタル通信の構造的な特徴が戦略的な情報の入手と拡散を容易にし、領域支配の効果・柔軟性・効率を高めていた（抄録）。", "fun": "スマホは市民の道具であると同時に、地域を支配しようとする集団にとっての「監視の目」にもなる――誰が地域の住民で誰がよそ者かを見分けるのに使われている、という現実を描いています。技術の中立性を考えさせる研究です。", "unverified": "調査期間などの詳細は未確認。"}}, {"id": "jn20", "rank": 20, "field": "化学", "headline": "電気濡れの非対称性は電気二重層の再構成で消える", "title": "Crossover from Asymmetric to Symmetric Electrowetting Linked to Double-Layer Restructuring", "url": "https://doi.org/10.1021/jacs.6c12396", "authors": "Hannah O. Wood ほか", "venue": "Journal of the American Chemical Society", "date": "2026-10-21", "sjr": 5.491, "citescore": 22.0, "citescore_year": "2025", "apa": "Wood, H. O., Kaewmorakot, S., Dočkal, J., Lísal, M., Dryfe, R. A. W., & Carbone, P. (2026). Crossover from Asymmetric to Symmetric Electrowetting Linked to Double-Layer Restructuring. Journal of the American Chemical Society. https://doi.org/10.1021/jacs.6c12396", "why": "電圧で濡れを制御する現象の極性依存性の分子的な起源を、電気二重層の再構成と結びつけた。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "電圧で濡れ方を変える現象（エレクトロウェッティング）の正負の非対称性が、電気二重層の分子構造の再編成から生じ、電解質の濃度で対称に戻ることを示した研究。", "p3": "グラファイト界面でKFとLiCl水溶液の電気濡れ測定と原子レベルのシミュレーションを組み合わせ、低濃度から「塩中水」の高濃度まで調べた（抄録）。", "p5": "KFでは低濃度の強い非対称から高濃度で対称な応答に移り、LiClは非対称のままだった。この変化は固液界面張力の変化を伴い、第1吸着層の分子間相互作用の網目（界面の連結性）が二重層構造と巨視的な濡れを結ぶ指標になった（抄録）。", "fun": "水滴に電圧をかけると広がる（濡れる）現象は、教科書ではプラスでもマイナスでも同じように起きるはずです。ところが実際は向きで違う――その理由が電極表面に並ぶ水とイオンの並び方にあると突き止めた点が面白いところです。", "unverified": "シミュレーションの手法の詳細は未確認。"}}, {"id": "jn21", "rank": 21, "field": "材料科学", "headline": "ハロゲンなし溶媒で有機太陽電池21.05%", "title": "Erosion Sequential Deposition with Halogen‐Free Solvent Enables Organic Solar Cells With 21.05% Efficiency and 83.19% Fill Factor", "url": "https://doi.org/10.1002/adfm.79185", "authors": "Xinkang Wang ほか", "venue": "Advanced Functional Materials", "date": "2026-10-21", "sjr": 5.022, "citescore": 28.7, "citescore_year": "2025", "apa": "Wang, X., Zhang, J., Wu, J., Zhang, L., Feng, C., Wu, L., Liu, S., Fu, Y., Zhang, L., Xie, X., Bai, Q., Jia, T., Fan, B., Chen, Y., & Chen, J. (2026). Erosion Sequential Deposition with Halogen‐Free Solvent Enables Organic Solar Cells With 21.05% Efficiency and 83.19% Fill Factor. Advanced Functional Materials. https://doi.org/10.1002/adfm.79185", "why": "ハロゲンを含まない溶媒の逐次成膜で有機太陽電池の変換効率21.05%を達成した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "ハロゲンを含まない溶媒で層を順に積む有機太陽電池の作製に「侵食」材料を挟む工夫を加え、変換効率21.05%（認証20.71%）を達成した研究。", "p3": "ドナー（D18）の下層に一部除去できる高分子アクセプター（PYDT）を予め入れ、トルエン系の溶媒でアクセプター（L8-BO）を積むと下層が膨潤しやすくなり、アクセプターが深く入り込んで縦方向の相分離が最適化される（抄録）。", "p5": "効率21.05%（認証20.71%）で、クロロホルム系の20.53%を上回った。300nm・500nmの厚い活性層でも19.64%、18.75%だった（抄録）。", "fun": "有害なハロゲン系溶媒を使わない方が環境には良いのに、性能が落ちるのが悩みでした。下の層にわざと「溶けやすい材料」を混ぜておき、上から塗る液が染み込みやすくするという発想で、むしろ性能を上回った点がこの研究の見どころです。", "unverified": "安定性の評価は抄録になく未確認。"}}, {"id": "jn22", "rank": 22, "field": "物理学", "headline": "量子状態の平滑化で純度とスクイーズを回復", "title": "Quantum state smoothing for tracking optical quantum dynamics and recovering purity and squeezing", "url": "https://doi.org/10.1038/s41534-026-01390-0", "authors": "Shota Yokoyama ほか", "venue": "npj Quantum Information", "date": "2026-10-21", "sjr": 2.697, "citescore": 13.7, "citescore_year": "2025", "apa": "Yokoyama, S., Laverick, K. T., McManus, D., Yu, Q., Chantasri, A., Asavanant, W., Dong, D., Wiseman, H. M., & Yonezawa, H. (2026). Quantum state smoothing for tracking optical quantum dynamics and recovering purity and squeezing. Npj Quantum Information. https://doi.org/10.1038/s41534-026-01390-0", "why": "未来の測定記録も使う量子状態の平滑化で、光の量子ダイナミクスの追跡精度を上げた。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "過去と未来の測定記録をともに使う量子状態の「平滑化」を光で実験的に実証し、通常のフィルタより状態の純度とスクイーズを回復できることを示した研究。", "p3": "光パラメトリック発振器の出力を2つの独立なホモダイン検出器に分け、「観測される」経路と「観測されない」経路を作って、平滑化の各シナリオを実験した（抄録）。", "p5": "状態の純度を10.3%±1.6%、スクイーズを7.6%±2.6%改善し、平滑化した状態は通常のフィルタより隠れた真の状態の良い推定になった（抄録）。", "fun": "天気予報は過去のデータしか使えませんが、昨日の天気を後から振り返るなら今日のデータも使えます。量子の世界でも、リアルタイムでなくてよければ「後から見直す」ことで失われた情報をより多く取り戻せる、ということを光で示しています。", "unverified": "実験条件の詳細は未確認。"}}, {"id": "jn23", "rank": 23, "field": "経営学", "headline": "境界をつなぐ人がデジタル技術の導入を進める", "title": "Spanning boundaries to boost network engagement along implementation processes of digital technologies: evidence from a multiple case study in hospitals", "url": "https://doi.org/10.1108/ijopm-12-2025-1213", "authors": "Vincent Peters ほか", "venue": "International Journal of Operations and Production Management", "date": "2026-10-21", "sjr": 2.983, "citescore": 15.1, "citescore_year": "2025", "apa": "Peters, V., Henkens, B., Aben, T. A. E., & De Regge, M. (2026). Spanning boundaries to boost network engagement along implementation processes of digital technologies: evidence from a multiple case study in hospitals. International Journal of Operations & Production Management, 46(13), 368–394. https://doi.org/10.1108/ijopm-12-2025-1213", "why": "病院のデジタル技術導入で、境界連結者がネットワークの関与をどう実現するかを複数事例で示した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "同じデジタル技術を導入して結果が分かれた2つの病院の事例から、組織・職能・専門職の境界をつなぐ役割が「星座」のように組み合わさって導入を支えることを示した研究。", "p3": "2病院の複数事例研究で、記録文書と2回の半構造化面接を帰納的に分析し、境界連結の役割とネットワークの関与への貢献を特定した（抄録）。", "p5": "境界連結の役割は単独ではなく組み合わせとして働き、多様な関係者を活性化し、組み込み、正当化していた（抄録）。", "fun": "新しいシステムがうまく根づくかどうかは、技術の良し悪しよりも、医師・看護師・事務・業者の間を取り持つ人がいるかどうかで決まる――しかも一人のヒーローではなく、役割の違う何人かの連携が鍵だ、という点が面白いところです。", "unverified": "面接の人数は抄録になく未確認。"}}, {"id": "jn24", "rank": 24, "field": "機械学習", "headline": "10m解像度で世界の森林タイプを地図化", "title": "Global forest typology at 10-meter resolution for forest and land-use monitoring", "url": "https://doi.org/10.1038/s41597-026-08299-5", "authors": "Maxim Neumann ほか", "venue": "Scientific Data", "date": "2026-10-21", "sjr": 1.907, "citescore": 9.6, "citescore_year": "2025", "apa": "Neumann, M., Raichuk, A., Potapov, P., Lesiv, M., Overlan, M., Rey, M., Rajakumar, R., Conserva, M., Stanimirova, R., Sims, M. J., Carter, S., Goldman, E., Jiang, Y., Scheibenreif, L., Georgieva, I., Shchepashchenko, M., Fritz, S., Clinton, N., Stanton, C., et al. (2026). Global forest typology at 10-meter resolution for forest and land-use monitoring. Scientific Data, 13(1). https://doi.org/10.1038/s41597-026-08299-5", "why": "原生林・植林・農業樹木などを10m解像度で区別する世界の森林類型図を作成した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "原生林・天然更新林・植林・プランテーション・樹木作物などを区別する、世界初の10m解像度の森林類型図（2020年）を深層学習で作った研究。", "p3": "FAOとEU森林破壊防止規則の定義に合わせた6分類を、衛星の地理空間埋め込みから、170万の標本で学習した多段の深層学習（弱教師あり学習と能動学習の組み合わせ）で推定した（抄録）。", "p5": "専門家が判定した8,190地点での独立検証で、6分類の全体精度90.2%、天然林の分類94.8%、森林/非森林95.5%だった（抄録）。", "fun": "上空から見ると、手つかずの森も、植えた森も、ヤシ農園も同じ「緑」に見えます。それを10mのマス目で見分けられるようになると、輸入品が森林破壊につながっていないかを確かめる国際的なルールの運用に使える、という実用の面白さがあります。", "unverified": "地域別の精度の差は未確認。"}}, {"id": "jn25", "rank": 25, "field": "組織行動・心理的安全性", "headline": "持ち物が少ない人は有能に見える", "title": "Less Is More: Why and When Having Less Signals Competence", "url": "https://doi.org/10.1177/01461672261494236", "authors": "Ruobing Fu ほか", "venue": "Personality and Social Psychology Bulletin", "date": "2026-10-21", "sjr": 2.086, "citescore": 9.9, "citescore_year": "2025", "apa": "Fu, R., & Lu, J. (2026). Less Is More: Why and When Having Less Signals Competence. Personality and Social Psychology Bulletin. https://doi.org/10.1177/01461672261494236", "why": "持ち物の少なさが他者から有能さのシグナルとして受け取られる対人効果を示した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "持ち物が少ない人は多い人より有能だと見なされることを示し、その理由と成り立つ条件を整理した研究。", "p3": "観察者が持ち物の少ない人を、感情より理性で意思決定する人だと推論するという機序を検証し、効果が現れる3つの条件の記述モデルを作った（研究数・標本は抄録になし）。", "p5": "効果は、持ち物の少なさが自発的に見えるとき、持ち物が主に快楽的でないとき、量が最低限の必要を満たすときに現れた（抄録）。", "fun": "ミニマリストは本人がすっきりするだけでなく、周りから「この人はよく考えて選んでいる」と見られる、という対人的な効果があるそうです。ただしお金がなくて物が少ない場合は当てはまらない、という条件づけが鋭いところです。", "unverified": "実験の数と効果量は未確認。"}}, {"id": "jn26", "rank": 26, "field": "開発経済学", "headline": "親が決める結婚は女性の就労を制約するか", "title": "“Made in heaven, matched by parents”: Can arranged marriage restrict labour market autonomy and participation of women?", "url": "https://doi.org/10.1016/j.worlddev.2026.107589", "authors": "Sugata Bag ほか", "venue": "World Development", "date": "2026-10-21", "sjr": 2.027, "citescore": 9.3, "citescore_year": "2025", "apa": "Bag, S., & Kar, A. (2027). “Made in heaven, matched by parents”: Can arranged marriage restrict labour market autonomy and participation of women? World Development, 210, 107589. https://doi.org/10.1016/j.worlddev.2026.107589", "why": "見合い結婚が女性の労働市場への参加と自律を制限するかを検証した開発経済学の研究（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": fa     var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
