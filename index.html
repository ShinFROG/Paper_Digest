dline": "ハイデラバード都市圏の地価を成長分析で可視化", "title": "Spatial Data Visualization for Urban Land Value Assessment Using Growth Analysis: A Case Study of Morphological Transformations in Hyderabad Metropolitan Region, India", "url": "https://doi.org/10.1061/jupddm.upeng-6450", "authors": "D. Shivaram Reddy ほか", "venue": "Journal of Urban Planning and Development", "date": "2026-11-11", "citescore": 3.9, "citescore_year": "2025", "apa": "Shivaram Reddy, D., & Onkar, P. S. (2027). Spatial Data Visualization for Urban Land Value Assessment Using Growth Analysis: A Case Study of Morphological Transformations in Hyderabad Metropolitan Region, India. Journal of Urban Planning and Development, 153(1). https://doi.org/10.1061/jupddm.upeng-6450", "theme": "都市・インフラ政策", "theme_no": 6}, {"id": "jr47", "rank": 47, "headline": "スマートシティの包摂的イノベーションを116報で整理", "title": "Inclusive innovation in smart cities: a systematic literature review of conceptual fragmentation, dominant themes, and research gaps", "url": "https://doi.org/10.3389/frsc.2026.1983822", "authors": "Seyedeh Sedigheh Ghorashi ほか", "venue": "Frontiers in Sustainable Cities", "date": "2026-11-09", "citescore": 5.1, "citescore_year": "2025", "apa": "Ghorashi, S. S., Karvonen, A., Mobini Dehkordi, A., & Yadollahi Farsi, J. (2026). Inclusive innovation in smart cities: a systematic literature review of conceptual fragmentation, dominant themes, and research gaps. Frontiers in Sustainable Cities, 8. https://doi.org/10.3389/frsc.2026.1983822", "theme": "都市・インフラ政策", "theme_no": 6}, {"id": "jr48", "rank": 48, "headline": "循環型の都市代謝に向けた技能と空間の転換", "title": "Planning for circular urban metabolism: Intertwining skills and spatial transformation for manufacturing transition in Padua and Venice, Italy", "url": "https://doi.org/10.1177/00420980261499471", "authors": "Claudia Faraone ほか", "venue": "Urban Studies", "date": "2026-11-11", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "apa": "Faraone, C., Gambarotto, F., Nicoletto, L., & Pedrini, G. (2026). Planning for circular urban metabolism: Intertwining skills and spatial transformation for manufacturing transition in Padua and Venice, Italy. Urban Studies. https://doi.org/10.1177/00420980261499471", "theme": "都市・インフラ政策", "theme_no": 6}, {"id": "jr49", "rank": 49, "headline": "据置充電と電化道路の回廊単位のインフラ費用", "title": "Corridor-level infrastructure costs of static charging versus electric road systems in Germany", "url": "https://doi.org/10.1016/j.trd.2026.105725", "authors": "Mathias Schmidt ほか", "venue": "Transportation Research, Part D: Transport and Environment", "date": "2026-11-10", "sjr": 2.032, "citescore": 13.6, "citescore_year": "2025", "apa": "Schmidt, M., & Walther, G. (2027). Corridor-level infrastructure costs of static charging versus electric road systems in Germany. Transportation Research Part D: Transport and Environment, 163, 105725. https://doi.org/10.1016/j.trd.2026.105725", "theme": "都市・インフラ政策", "theme_no": 6}, {"id": "jr50", "rank": 50, "headline": "都市の土地資本化が農村産業の発展を縛る", "title": "Urban land capitalization and rural industrial development: How spatial fix theory explains constraints on urban-rural integration in China", "url": "https://doi.org/10.1016/j.jrurstud.2026.104508", "authors": "Zhenzhen Chen ほか", "venue": "Journal of Rural Studies", "date": "2026-11-11", "sjr": 1.731, "citescore": 10.9, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "脆弱な保険会社が住宅ローンの気候リスクを隠す", "title": "When Insurers Exit: Climate Losses, Fragile Insurers, and Mortgage Markets", "url": "https://doi.org/10.1093/qje/qjag053", "authors": "Parinitha Sastry ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-11-07", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "apa": "Sastry, P., Sen, I., & Tenekedjieva, A.-M. (2026). When Insurers Exit: Climate Losses, Fragile Insurers, and Mortgage Markets. The Quarterly Journal of Economics. https://doi.org/10.1093/qje/qjag053", "why": "フロリダ州の2009〜2018年の住宅ローンと保険の新しいデータで、資本と分散の乏しい保険会社が市場を占め、その破綻が災害後のローン不履行を因果的に増やすことを示した。政府支援機関（GSE）は第三者の格付けに頼って破綻リスクの高い保険を値づけせずに受け入れており、フロリダでのGSEの期待損失の推定25%が保険の脆弱さに由来する。貸し手は自ら保有するジャンボ融資でだけ保険の質に反応する。"}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "誤った信念が大量のデータのもとでも残る理由", "title": "Channeled Attention and Stable Errors", "url": "https://doi.org/10.1093/qje/qjag055", "authors": "Tristan Gagnon-Bartsch ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-11-09", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "apa": "Gagnon-Bartsch, T., Rabin, M., & Schwartzstein, J. (2026). Channeled Attention and Stable Errors. The Quarterly Journal of Economics. https://doi.org/10.1093/qje/qjag055", "why": "人は自分の（誤っているかもしれない）モデルを通して注意を向けるため、データに触れてもモデルの誤りを示す統計を追わない、という注意に基づく枠組みを示した。「関係ない」「区別はない」と何かを誤って除外するモデルは、反証するデータから注意をそらすので安定しやすい。誤りが見つかるかは損害の大きさと結びつかず、新しい目が誤りに気づく理由などを説明する。"}, {"id": "jn03", "rank": 3, "field": "経営学", "headline": "A/Bテストの因果信号で言語モデルを調整", "title": "EXPRESS: Causal Alignment: Augmenting Language Models with A/B Tests", "url": "https://doi.org/10.1177/00222437261510017", "authors": "Panagiotis Angelopoulos ほか", "venue": "Journal of Marketing Research", "date": "2026-11-11", "sjr": 7.363, "citescore": 11.0, "citescore_year": "2025", "apa": "Angelopoulos, P., Lee, K., & Misra, S. (2026). EXPRESS: Causal Alignment: Augmenting Language Models with A/B Tests. Journal of Marketing Research. https://doi.org/10.1177/00222437261510017", "why": "無作為化実験が示す「どの方向に直せば良くなるか」を教師信号として言語モデルを微調整し、成果の低い文面を高い文面に変える改善器を作る枠組みを示した。36キャンペーン・2億8,300万インプレッションのメール配信の実地実験で、改善した件名のクリック率は専門家だけの場合より32%高く、パラメータ数が30倍の汎用モデルは改善しなかった。"}, {"id": "jn04", "rank": 4, "field": "天文学", "headline": "M87*のブラックホールの影を独立の手法で確認", "title": "Independent interferometric observable confirms black hole shadow in M87*", "url": "https://doi.org/10.1038/s41586-026-11241-9", "authors": "Samuel Lai ほか", "venue": "Nature", "date": "2026-11-11", "sjr": 19.713, "citescore": 77.7, "citescore_year": "2025", "why": "超長基線電波干渉計の観測は疎で、画像の再構成は校正や事前の仮定に左右されるため、M87*のリング状の構造には異論もあった。形の事前仮定を置かず、装置の校正誤差に影響されない観測量に基づく独立の画像化アルゴリズムを同じデータに適用し、角直径42.2±1.5マイクロ秒角のリング（質量は太陽の65±5億倍に相当）を再現した。"}, {"id": "jn05", "rank": 5, "field": "経営学", "headline": "エボラの恐怖が黒人の住宅ローン否決率を上げた", "title": "Deadly Disease, Fear, and Ostracism in the Credit Market", "url": "https://doi.org/10.1287/mnsc.2025.01919", "authors": "Sumit Agarwal ほか", "venue": "Management Science", "date": "2026-11-10", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Agarwal, S., Lin, P., Lin, Y., Lu, R., & Zhang, X. (2026). Deadly Disease, Fear, and Ostracism in the Credit Market. Management Science. https://doi.org/10.1287/mnsc.2025.01919", "why": "2014年の米国のエボラ流行を自然実験として、感染リスクがほぼないのに黒人申請者の住宅ローン否決率が3.8ポイント上がったことを示した。承認された借り手は信用力が高く不履行も少なく、アルゴリズムによるフィンテック融資では効果がなく、流行後すぐ戻ることから、統計的差別では説明できないと論じる。"}, {"id": "jn06", "rank": 6, "field": "経営学", "headline": "非上場企業の開示が上場企業の銀行依存を下げる", "title": "Private Firm Disclosures and Public Firms' Debt Choice", "url": "https://doi.org/10.2308/tar-2024-0646", "authors": "Fengqin Chen ほか", "venue": "The Accounting Review", "date": "2026-11-10", "sjr": 4.403, "citescore": 7.5, "citescore_year": "2025", "apa": "Chen, F., Pittman, J., & Saffar, W. (2026). Private Firm Disclosures and Public Firms’ Debt Choice. The Accounting Review, 1–30. https://doi.org/10.2308/tar-2024-0646", "why": "複数国の標本で、非上場企業の開示の透明性が情報の非対称性を狭め、上場企業の銀行借入への依存を下げることを示した。電子的な商業登記の段階的な導入を外生的なショックとして用い、監視需要の低下・借入費用の低下・格付けの質の向上という経路を確かめた。"}, {"id": "jn07", "rank": 7, "field": "工学", "headline": "しなるゴム翼で潮流タービンの疲労荷重を3分の1減", "title": "Flexible rubber blades for tidal turbines", "url": "https://doi.org/10.1038/s41586-026-11278-w", "authors": "Zhehong Zhang ほか", "venue": "Nature", "date": "2026-11-11", "sjr": 19.713, "citescore": 77.7, "citescore_year": "2025", "why": "潮流発電のタービンは非定常な流体荷重を受け、大型機は複雑で高価な能動ピッチ制御に頼っている。翼弦方向に後縁が変形する柔らかいゴム製の翼が、模擬した潮汐周期で能動ピッチ制御つきの剛な翼と同等の総発電量を保ちつつ、疲労の原因となる高周波の荷重変動を最大3分の1抑えることを実験で示した。"}, {"id": "jn08", "rank": 8, "field": "経済学", "headline": "洪水域からの買い上げ移転の便益は裕福な地区に偏る", "title": "Does government-assisted relocation help households", "url": "https://doi.org/10.1126/sciadv.aef4602", "authors": "Rachel Young", "venue": "Science Advances", "date": "2026-11-11", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "why": "米国FEMAの住宅買い上げプログラムを、全国の世帯の縦断記録で評価した。参加世帯は洪水危険区域の外へ移りやすく、短期的に負債が減り近隣の社会経済条件が改善するが、便益は裕福で白人が多い地区の参加者に集中する。便益費用比は3つのシナリオで0.84〜1.28だった。"}, {"id": "jn09", "rank": 9, "field": "計算社会科学・ネットワーク科学", "headline": "150年分の独議会の移民論戦をLLMで注釈", "title": "LLM Analysis of 150+ Years of German Parliamentary Debates on Migration Reveals a Shift from Post-War Solidarity to Anti-Solidarity in the Last Decade", "url": "https://doi.org/10.1162/coli.a.666", "authors": "Aida Kostikova ほか", "venue": "Computational Linguistics", "date": "2026-11-10", "sjr": 1.837, "citescore": 28.8, "citescore_year": "2025", "apa": "Kostikova, A., Pütz, O., Eger, S., Sabelfeld, O., & Paassen, B. (2026). LLM Analysis of 150+ Years of German Parliamentary Debates on Migration Reveals a Shift from Post-War Solidarity to Anti-Solidarity in the Last Decade. Computational Linguistics, 1–94. https://doi.org/10.1162/coli.a.666", "why": "ドイツ議会（1867〜2025年）の移民をめぐる発言の連帯・反連帯をLLMで注釈し、最良のモデルは人間同士の一致に近いmacro-F1に達するが系統誤差が下流の推定を偏らせうることを示した。設計に基づく教師あり学習（DSL）で補正した長期の傾向では、戦後に連帯が高く、2015年以降に反連帯が目立って増えた。"}, {"id": "jn10", "rank": 10, "field": "人口学", "headline": "共同名義の土地権利証は夫婦の絆の証になる", "title": "Joint Land Titling and the Marital Bond in Southwestern Uganda", "url": "https://doi.org/10.1111/padr.70103", "authors": "Michelle Poulin ほか", "venue": "Population and Development Review", "date": "2026-11-11", "sjr": 1.616, "citescore": 7.9, "citescore_year": "2025", "apa": "Poulin, M., & Pierotti, R. S. (2026). Joint Land Titling and the Marital Bond in Southwestern Uganda. Population and Development Review. https://doi.org/10.1111/padr.70103", "why": "ウガンダ南西部で土地権利証を全額補助した無作為化介入では、夫の多くが妻の名を加えた。その意味を観察と面接で調べ、共同名義が妻の交渉力を高めるだけでなく、夫の結婚への関与の象徴として働き、結婚への投資を促す「協力的な力」を生むことを示した。"}, {"id": "jn11", "rank": 11, "field": "工学", "headline": "アンカー定着部の接触応力を超音波の非線形で推定", "title": "A non-destructive stress evaluation model for anchorage interfaces integrating contact mechanics and ultrasonic nonlinearity", "url": "https://doi.org/10.1177/14759217261501265", "authors": "Linqiang Zhou ほか", "venue": "Structural Health Monitoring", "date": "2026-11-11", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Zhou, L., Qian, J., & Guo, C. (2026). A non-destructive stress evaluation model for anchorage interfaces integrating contact mechanics and ultrasonic nonlinearity. Structural Health Monitoring. https://doi.org/10.1177/14759217261501265", "why": "橋梁のアンカー定着部の接触面の応力を非破壊で評価するため、接触力学と非線形音響を統合した理論モデルを作り、反射の非線形係数を界面剛性から導いた。表面の粗さと材料定数から剛性と応力の関係を導くので経験的な当てはめが減り、現場の多数より線の定着部で予測と実測の接触応力の相対誤差は8.49%だった。"}, {"id": "jn12", "rank": 12, "field": "経営学", "headline": "リスク・曖昧さへの態度と主観的信念を同時に測る", "title": "Uncertainty Attitudes, Subjective Beliefs, and Decisions Under Uncertainty", "url": "https://doi.org/10.1287/mnsc.2024.06232", "authors": "Adeline Delavande ほか", "venue": "Management Science", "date": "2026-11-10", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Delavande, A., Ganguli, J., & Mengel, F. (2026). Uncertainty Attitudes, Subjective Beliefs, and Decisions Under Uncertainty. Management Science. https://doi.org/10.1287/mnsc.2024.06232", "why": "一般の人々を対象に、健康と金融の意思決定について、リスクと曖昧さへの態度（個人別の確率加重と損失回避）と事象の主観確率を同時に集めた。選好も信念も大きくばらつき、源泉依存の確率加重を持つプロスペクト理論は主観的期待効用より一部の文脈で厳密に良く当てはまる。"}, {"id": "jn13", "rank": 13, "field": "心理学", "headline": "夏時間への切替え直後は詐欺メールを13%多く踏む", "title": "Modest loss of sleep increases susceptibility to cybersecurity threats", "url": "https://doi.org/10.1073/pnas.2622467123", "authors": "Eitan Schechtman", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-11", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "夏時間への移行（睡眠が短くなる）の直後の月曜朝か1週間前に、大学の職員11,218人へ模擬のフィッシングメールを無作為に送った。移行後は不審なリンクをクリックする確率が約13%高く、メールを開く確率や迷惑メールとして報告する確率は変わらなかった。"}, {"id": "jn14", "rank": 14, "field": "組織行動・心理的安全性", "headline": "単一項目尺度で示せる性質と示せない性質", "title": "A Psychometric Evaluation of Single‐Item Measures", "url": "https://doi.org/10.1111/1748-8583.70071", "authors": "Justin A. DeSimone", "venue": "Human Resource Management Journal (UK)", "date": "2026-11-10", "sjr": 3.013, "citescore": 14.9, "citescore_year": "2025", "apa": "DeSimone, J. A. (2026). A Psychometric Evaluation of Single‐Item Measures. Human Resource Management Journal. https://doi.org/10.1111/1748-8583.70071", "why": "人的資源管理の研究で増えている単一項目の尺度について、古典的テスト理論・項目反応理論・一般化可能性理論から、因子構造と内的一貫性は実証的に示せず、時間的な安定性・評定者間信頼性・基準関連妥当性は評価に適することを整理し、使用を判断するチェックリストを示した。"}, {"id": "jn15", "rank": 15, "field": "工学", "headline": "橋の吊材ワイヤのフレッティング疲労の進み方", "title": "Fretting Wear and Fatigue Interaction Evolution of Bridge Suspender Wires under Various Contact Conditions and Cyclic Load Characteristics", "url": "https://doi.org/10.1061/jbenf2.beeng-8091", "authors": "Yafei Ma ほか", "venue": "Journal of Bridge Engineering", "date": "2026-11-11", "citescore": 7.2, "citescore_year": "2025", "why": "接触条件と繰返し応力を精密に制御できる新しい試験装置で、吊材ワイヤのフレッティング疲労を光学顕微鏡・走査電子顕微鏡・3次元レーザー走査で多段階に観察した。き裂は応力集中の大きい摩耗痕の縁から生じ、疲労寿命は接触角に対して単調でなく、接触角と応力比の交互作用に強く左右される。"}, {"id": "jn16", "rank": 16, "field": "経営学", "headline": "プライバシー保護が推薦を歪め双方を害しうる", "title": "Recommender Systems Under Privacy Protection", "url": "https://doi.org/10.1287/mnsc.2024.05007", "authors": "Can Küçükgül ほか", "venue": "Management Science", "date": "2026-11-10", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Küçükgül, C., Özer, Ö., & Wang, S. (2026). Recommender Systems Under Privacy Protection. Management Science. https://doi.org/10.1287/mnsc.2024.05007", "why": "利益を追うプラットフォームの推薦の設計を、プライバシー保護の制度ごとに分析した。オプトアウト型の保護は無保護と機能的に同じで、消費者が個人データを偽れると推薦が歪んで双方が損をし、推薦が商品の割当ても担う場合は不利な少数者を機会から締め出す差別が生じうる。"}, {"id": "jn17", "rank": 17, "field": "経営学", "headline": "環境に熱心な企業ほどCEOは説明会で語らない", "title": "CEO environmental communication, speech acts, and firm value", "url": "https://doi.org/10.1007/s11747-026-01221-w", "authors": "Hai-Anh Tran ほか", "venue": "Journal of the Academy of Marketing Science", "date": "2026-11-11", "sjr": 6.426, "citescore": 22.3, "citescore_year": "2025", "apa": "Tran, H.-A., Ludwig, S., Nguyen, B., Noble, C. H., & Grewal, D. (2026). CEO environmental communication, speech acts, and firm value. Journal of the Academy of Marketing Science. https://doi.org/10.1007/s11747-026-01221-w", "why": "364社・14,523件の決算説明会の質疑を微調整したDeBERTaで分析し、環境への取り組みが強い企業ほどCEOがそれを語らないこと、語る場合は断定・指示の言い方が企業価値と正に、感情表明・約束の言い方が負に関連することを示した。"}, {"id": "jn18", "rank": 18, "field": "経営学", "headline": "サービス生態系の設計で意見の対立をどう扱うか", "title": "Connected Friction—Collectively Designing Service Ecosystems Through Reflexive Relations", "url": "https://doi.org/10.1177/10946705261492132", "authors": "Audun Formo Hay ほか", "venue": "Journal of Service Research", "date": "2026-11-11", "sjr": 5.517, "citescore": 19.7, "citescore_year": "2025", "apa": "Hay, A. F., Vink, J., Thøgersen, D. M., Ness, O., von Heimburg, D., & Sangiorgi, D. (2026). Connected Friction—Collectively Designing Service Ecosystems Through Reflexive Relations. Journal of Service Research. https://doi.org/10.1177/10946705261492132", "why": "相互依存する関係者がサービス生態系の仕組みを作り替えるとき、構造の受け止め方の違いから対立が起きる。省察を個人の能力でなく関係の性質として捉え、その育て方を調べた研究。"}, {"id": "jn19", "rank": 19, "field": "機械学習", "headline": "LLMの幻覚と関連する7つの変数を回帰で特定", "title": "Uncovering the Correlates of Hallucination in Large Language Models: A Regression Analysis Perspective", "url": "https://doi.org/10.1162/coli.a.665", "authors": "Vicente Ivan Sanchez Carmona ほか", "venue": "Computational Linguistics", "date": "2026-11-10", "sjr": 1.837, "citescore": 28.8, "citescore_year": "2025", "apa": "Carmona, V. I. S., Jiang, S., & Dong, B. (2026). Uncovering the Correlates of Hallucination in Large Language Model <script>
(function () {

  var REPORT = JSON.parse(document.getElementById("report-data").textContent);
  var ARCHIVE = JSON.parse(document.getElementById("archive-data").textContent);
  var META = JSON.parse(document.getElementById("page-meta").textContent);

  if (REPORT.part2 && !REPORT.notable) REPORT.notable = REPORT.part2;
  // two sources (preprints, journals), each with papers related to the owner's research and important papers;
  // the last two groups are the layout of the reports of 2026-09-26
  var GROUPS = [
    { key: "pre", label: "プレプリント", parts: [["pre_related", "関連", "プレプリント：研究に関連する論文"], ["pre_notable", "注目", "プレプリント：注目分野の最先端"]] },
    { key: "jnl", label: "論文誌", parts: [["jnl_related", "関連", "論文誌：研究に関連する論文"], ["jnl_notable", "注目", "論文誌：注目分野の最先端"]] },
    { key: "data", label: "データ", parts: [["data_related", "関連", "オープンデータ：研究に関連する新着データセット"]] },
    { key: "latest", label: "最新", parts: [["related", "関連", "最新：研究に関連する論文"], ["notable", "重要", "最新：分野を問わない重要論文"]] },

  var BASIS_PILL = { "本文": "本文を読んだ解説", "抄録": "抄録の範囲の解説", "題名": "題名だけの情報" };
  // a theme comes with its colour number (theme_no 1-8 -> --t1 ... --t8); the page holds no theme names of its own
  function themeColor(it) { return it.theme_no ? "--t" + it.theme_no : "--accent-soft"; }

    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },

  var views = parts.map(function (p) { return p[0]; }).concat(["marks", "list"]);
  function groupOf(view) {
    for (var i = 0; i < groups.length; i++) {
      for (var j = 0; j < groups[i].parts.length; j++) { if (groups[i].parts[j][0] === view) return groups[i]; }
    }
    return null;
  }
  var lastInGroup = store.get("pd-sub-v1", {});
  var marks = store.get("pd-marks-v1", {});
  var saved = store.get("pd-pos-" + REPORT.date, { view: views[0], index: 0 });
  var start = { part1: "related", part2: "notable" }[saved.view] || saved.view;
  var state = { view: views.indexOf(start) >= 0 ? start : views[0], index: saved.index || 0 };
  var stage = document.getElementById("stage");
  var el = function (tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

  document.getElementById("daylabel").textContent = " " + REPORT.date;
  var sel = document.getElementById("datesel");
  function fillDates(list) {

    list.forEach(function (d, i) {
      var o = el("option", null, d + (i === 0 ? "（最新）" : ""));

      .catch(function () {});

  function addTab(key, text, label, onClick) {
    var b = el("button", "tab", text); b.type = "button"; b.dataset.view = key;
    if (label) { b.setAttribute("aria-label", label); b.title = label; }
    b.addEventListener("click", onClick);
    tabs.appendChild(b);
  }
  groups.forEach(function (g) {
    var n = g.parts.reduce(function (s, p) { return s + REPORT[p[0]].length; }, 0);
    addTab("group:" + g.key, g.label + " " + n, null, function () {
      var v = lastInGroup[g.key];
      if (!g.parts.some(function (p) { return p[0] === v; })) v = g.parts[0][0];
      select(v);
    });
  });
  addTab("marks", "★", "あとで読む（★を付けた論文）", function () { select("marks"); });
  addTab("list", "一覧", null, function () { select("list"); });

  function items(view) {
    if (view === "marks") return Object.keys(marks).map(function (k) { return marks[k]; }).sort(function (a, b) { return (b.markedAt || "").localeCompare(a.markedAt || ""); });
    return REPORT[view] || [];
  }
  function current() { var list = items(state.view); return list[Math.max(0, Math.min(state.index, list.length - 1))]; }
  function save() { store.set("pd-pos-" + REPORT.date, { view: state.view, index: state.index }); }

  function renderTabs() {
    var g = groupOf(state.view);
    Array.prototype.forEach.call(tabs.children, function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.view === state.view || (!!g && b.dataset.view === "group:" + g.key)));
    });
    subtabs.innerHTML = "";
    subtabs.hidden = !g || g.parts.length < 2;
    if (g) g.parts.forEach(function (p) {
      var b = el("button", "tab subtab", p[1] + " " + REPORT[p[0]].length); b.type = "button";
      b.setAttribute("aria-pressed", String(p[0] === state.view));
      b.addEventListener("click", function () { select(p[0]); });
      subtabs.appendChild(b);
    });
  }

  function labelled(cls, label, text) {
    var p = el("p", cls); p.appendChild(el("span", "label", label)); p.appendChild(document.createTextNode(text)); return p;
  }

  function renderCard() {
    var list = items(state.view);
    stage.innerHTML = "";
    var card = el("article", "card");
    if (!list.length) {
      card.appendChild(el("p", "empty", state.view === "marks"
        ? "まだ★がありません。気になった論文で ☆ を押すと、ここにまとまります（この端末に保存）。"
        : state.view === "data_related" ? "この日の新着データセットはありません。" : "この日の論文はありません。"));
      stage.appendChild(card); updateControls(); return;
    }
    state.index = Math.max(0, Math.min(state.index, list.length - 1));
    var it = list[state.index];
    var head = el("div", "cardhead");
    head.appendChild(el("span", "pos", (state.index + 1) + " / " + list.length + (it.rank ? "　" + it.rank + "位" : "")));
    var chipText = it.theme || it.field || "";
    if (chipText) {
      var chip = el("span", "chip", chipText);
      chip.style.background = "var(" + themeColor(it) + ")";
      head.appendChild(chip);
    }
    card.appendChild(head);
    card.appendChild(el("h1", "headline", it.headline || it.title));
    var ex = it.explain;
    if (ex) {
      var basis = el("p", "basis");
      basis.appendChild(el("span", "pill", (ex.short ? "短い解説・" : "") + (BASIS_PILL[ex.basis] || ex.basis || "")));
      if (ex.preprint) basis.appendChild(el("span", "badge", "未査読プレプリント"));
      if (ex.basis_note) basis.appendChild(el("span", null, ex.basis_note));
      card.appendChild(basis);
      LABELS.forEach(function (l, i) {
        if (!ex[l[0]]) return;
        var sec = el("section", "ex" + (i === 0 ? " first" : ""));
        sec.appendChild(el("h2", null, l[1]));
        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });
      if (ex.fun) {
        var fun = el("section", "ex fun");
        fun.appendChild(el("h2", null, "面白いポイント"));
        fun.appendChild(el("p", null, ex.fun));
        card.appendChild(fun);
      }
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // three texts to hand on: a question for an AI, a note for another person, a reproduction request for an AI
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    HANDOFFS.forEach(function (h) {
      var b = el("button", "ask"); b.type = "button";
      h.label.forEach(function (part, i) {
        if (i) b.appendChild(document.createElement("wbr"));
        b.appendChild(document.createTextNode(part));
      });
      b.addEventListener("click", function () { copyText(h.make(it), askStatus, h.done); });
      askrow.appendChild(b);
    });
    card.appendChild(askrow); card.appendChild(askStatus);
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");

    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");

        wrap.appendChild(row);

  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
