<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>

<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>

    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

o": 1, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "高速磁気浮上鉄道の橋の維持管理について、知識グラフと検索拡張生成（RAG）を組み合わせ、根拠つきの点検報告を自動生成する手法HybridRAGを提案した（抄録）。", "p3": "基準類・過去事例・構造ヘルスモニタリング（SHM）データ・専門家知識を知識グラフとベクトル検索の両方に格納し、LLMの主張をSHMデータ・基準・事例に照らして検証するECV機構を加える（抄録）。", "p5": "RAGASの評価で、素のLLM、VectorRAG、GraphRAGと比べ、忠実性0.89、回答関連性0.87、文脈適合率0.91、再現率0.88を得た（抄録）。", "fun": "AIが書いた報告書の「もっともらしい嘘」を防ぐため、主張ごとにセンサーの測定値や基準の条文で裏を取らせる仕組みです。レポートに出典を付けなさいと言われる学校の課題と同じ発想を、橋の維持管理の機械に教え込んだと考えると身近に感じられます。", "unverified": "比較対象との数値差、評価に使った質問の数と内容は抄録からは分からない。"}}, {"id": "pr18", "rank": 18, "headline": "中伊のワイン口コミを母語AIで比較", "title": "Cross-Cultural Wine Consumer Sentiment: A Comparative Analysis of Online Reviews in China and Italy Using Native-Language AI", "url": "https://doi.org/10.2139/ssrn.7666095", "authors": "Yu Liu", "venue": "SSRN", "date": "2026-10-24", "apa": "Liu, Y. (2026). Cross-Cultural Wine Consumer Sentiment: A Comparative Analysis of Online Reviews in China and Italy Using Native-Language AI. https://doi.org/10.2139/ssrn.7666095", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "中国（JD.com）とイタリア（Amazon.it）のワインの口コミ33,464件を、それぞれの母語に合わせた言語モデルで比べ、満足の表し方の文化差を示した（抄録）。", "p3": "中国語はRoBERTa、イタリア語はUmBERToで感情を分類し、TF-IDFで評価の重点語を抽出、属性ベースの補助検証と人手の注釈で確かめた（抄録）。", "p5": "基準の閾値で肯定的な口コミはJDで90.3%、Amazonで71.8%（差18.5ポイント）。中国は口当たり・物流・本物かどうか、イタリアは感覚的な評価・贈答・包装・価格に重点があった（抄録）。", "fun": "同じワインの感想でも、中国では「本物か」「ちゃんと届いたか」、イタリアでは「香り」や「贈り物向きか」が語られるという違いが面白い点です。ただし言語ごとに別のAIで測っているので、差が文化なのか物差しの違いなのかを分ける難しさも著者は認めています。", "unverified": "両言語の分類器の精度の数値は抄録からは分からない。"}}, {"id": "pr19", "rank": 19, "headline": "LLMで発注点と安全在庫を設定できるか", "title": "InventOR: Can Large Language Models Set Reorder Points and Safety Stocks? Industrial Evidence Against ERP and Data-Driven Benchmarks", "url": "https://doi.org/10.5281/zenodo.23628463", "authors": "Dressino, Aris", "venue": "Zenodo", "date": "2026-10-24", "apa": "Dressino, A. (2026). InventOR: Can Large Language Models Set Reorder Points and Safety Stocks? Industrial Evidence Against ERP and Data-Driven Benchmarks. Zenodo. https://doi.org/10.5281/ZENODO.23628463", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "DataCiteに登録された抄録を使用", "preprint": true, "short": true, "p1": "大規模言語モデル（LLM）に在庫の発注点と発注量を提案させ、ソフトウェアで検証・再生する仕組みInventORを、製造業3工場の実データで評価した（抄録）。", "p3": "LLMが理由付きで(r,Q)方策を提案し、決定論的なソフトで検査・再生、最終判断は計画担当者が持つ。365の工場×品目について、ERP由来の設定や7つの参照方策と保留需要で比較した（抄録）。", "p5": "共通の346組で、LLMはERP由来の設定より約11%安いが、履歴のみ・Croston/SBA・経験分位点の基準より6%、8%、18%高かった。制約なしの軌跡は53〜66%の組で保管上限を超えた（抄録）。", "fun": "AIに在庫の発注ルールを決めさせると、会社のシステムの既定値よりは良いが、昔ながらの統計の方法には負ける、という正直な結果です。AIの提案をそのまま使わず、必ず機械と人が点検する仕組みにしている点に、実務で使うときの工夫が見えます。", "unverified": "品目の種類や需要の性質の詳細は抄録からは分からない。"}}, {"id": "pr20", "rank": 20, "headline": "主観的幸福の多次元構造をメキシコで検証", "title": "Examining the Multidimensional Structure of Subjective Well-Being: Evidence from Mexico", "url": "https://doi.org/10.2139/ssrn.7666122", "authors": "Carlos Alberto Arellano-Esparza", "venue": "SSRN", "date": "2026-10-24", "apa": "Arellano-Esparza, C. A. (2026). Examining the Multidimensional Structure of Subjective Well-Being: Evidence from Mexico. https://doi.org/10.2139/ssrn.7666122", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "メキシコの全国代表データで、主観的幸福（SWB）が1次元ではなく複数の次元からなることを、因子構造の比較で確かめた（抄録）。", "p3": "人生満足・感情・エウダイモニア（生きがい的な幸福）を含む構成を、探索的・確認的因子分析で比較し、相関3因子・階層・双因子モデルと1次元モデルを比べた（抄録）。", "p5": "複数次元のモデルはどれも同程度に良く当てはまり、1次元モデルを一貫して上回った。性別と地域で構造はおおむね安定していた（抄録）。", "fun": "「幸せ」を1つの点数で測るか、満足・気分・生きがいなど複数の軸で測るかという問題です。複数軸の方が良いが、どの組み立て方が正解かは決められないという結論は、幸せの形が一つに決まらないことを統計で示したようで興味深い点です。", "unverified": "標本の規模と具体的な適合度指標の値は抄録からは分からない。"}}, {"id": "pr21", "rank": 21, "headline": "役割固定の多エージェント模擬でLLMの報告行動を評価", "title": "\"Evaluating Safety-Critical Communication Behavior of Large Language Models Using Workflow-Embedded Multi-Agent Clinical Simulation\"", "url": "https://doi.org/10.2139/ssrn.7669112", "authors": "David Power ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Power, D., & Power, T. (2026). “Evaluating Safety-Critical Communication Behavior of Large Language Models Using Workflow-Embedded Multi-Agent Clinical Simulation”. https://doi.org/10.2139/ssrn.7669112", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "病棟の看護師・医師・看護管理者の役を固定したLLMエージェントの模擬で、急変時の報告（エスカレーション）の安全性を評価し、ISBARという構造化した申し送りの効果を調べた（抄録）。", "p3": "合成の症例カードを正解とし、構造なしとISBARの条件で対の会話記録を生成。ルーブリックによる自動評価器と、集中治療の看護師による盲検評価で、重要な抜け落ちや幻覚などを判定した（抄録）。", "p5": "200対（400記録）で、ISBARは幻覚を減らし（10.0%対26.5%）会話を短くした（中央値7対9ターン）が、重要な抜け落ちは減らなかった（16.0%対11.5%）。自動評価と臨床家の一致は限られた（抄録）。", "fun": "報告の型を決めるとAIの作り話は減るのに、肝心の情報の抜けは減らないという結果が意外です。さらにAIの採点者と人間の看護師の評価が食い違うことも示しており、AIをAIで評価する方法の落とし穴を教えてくれます。", "unverified": "使用したLLMの種類は抄録からは分からない。"}}, {"id": "pr22", "rank": 22, "headline": "学生の心の相談を模した対話で3つのLLMを比較", "title": "A Descriptive Comparison of Three Large Language Models in Simulated University Student Mental Health Dialogues: An Exploratory Analysis of Therapeutic and Safety Features", "url": "https://osf.io/yqvjc", "authors": "Zhu Hai Dong ほか", "venue": "OSF Preprints (OSF Preprints)", "date": "2026-10-22", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（研究計画の記述を含む）を使用", "preprint": true, "short": true, "p1": "大学生の心の相談を模した対話で、ChatGPT・DeepSeek・Copilotの応答を、安全性と治療的な質の観点から記述的に比べる探索的研究である（抄録）。", "p3": "30人の学生ペルソナがそれぞれ3モデルと会話し、計90の会話を標準化したプロンプトで実施。盲検化した2人のコーダーが、WAI-SRやMITIなど心理療法の尺度を応用した3層の符号化で分析する（抄録）。", "p5": "抄録は研究の目的と設計の説明が中心で、具体的な結果の数値は記されていない（抄録）。", "fun": "同じ悩みを3つのAIに相談したら、どれが安全で寄り添った答えを返すかを、人間のカウンセリングを評価する物差しで比べようという試みです。AIを相談相手にする若者が増えるなかで、まず「測る道具」を整えることから始めている点に意味があります。", "unverified": "結果（モデル間の差）は抄録に書かれておらず未確認。"}}, {"id": "pr23", "rank": 23, "headline": "スリットダムで氷岩屑流を止める模型実験", "title": "Model experimental study on slit dam intercepting ice-rock debris", "url": "https://doi.org/10.2139/ssrn.7669128", "authors": "Qiming Liao ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Liao, Q., Fan, G., Zhang, Z., Zhang, B., Tang, Y., & Zhang, J. (2026). Model experimental study on slit dam intercepting ice-rock debris. https://doi.org/10.2139/ssrn.7669128", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "氷と岩が混じった土石流（氷岩屑流）をスリットダムでどれだけ止められるかを、27ケースの水路模型実験で調べた（抄録）。", "p3": "ダムの位置、氷の含有率、氷と岩の粒径比を組み合わせて変え、衝撃力と捕捉効率を測った。流れの性質はSavage数で評価した（抄録）。", "p5": "上部に置いたダムの衝撃力は下部の2倍超、中間位置で捕捉効率82〜92%と最高。氷50%では捕捉が増え、75%では急減した。Savage数は0.98〜7.88で衝突支配。最大衝撃力の式の平均予測誤差は11.1%（抄録）。", "fun": "氷が半分なら岩どうしをくっつけて止まりやすくなるのに、4分の3になると氷が砕けたり溶けた水が潤滑油になったりして逆に止まらなくなる、という逆転が面白い点です。温暖化で氷河の崩落が増えるなか、防災施設の設計に直結する実験です。", "unverified": "模型の縮尺と実物への換算は抄録からは分からない。"}}, {"id": "pr24", "rank": 24, "headline": "非構造格子で希薄から高密度の気固二相流を解く", "title": "An Eulerian-Lagrangian Method for Dilute-to-DenseCompressible Gas-Particle Flows in Complex Geometries onUnstructured Meshes", "url": "https://doi.org/10.2139/ssrn.7669433", "authors": "Baoqing Meng", "venue": "SSRN", "date": "2026-10-25", "apa": "Meng, B. (2026). An Eulerian-Lagrangian Method for Dilute-to-DenseCompressible Gas-Particle Flows in Complex Geometries onUnstructured Meshes. https://doi.org/10.2139/ssrn.7669433", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "複雑な形状の中を流れる、希薄から高密度までの圧縮性の気体-粒子流を、非構造格子で計算できるオイラー・ラグランジュ法を開発した（抄録）。", "p3": "気相は有限体積法と多相リーマン解法（HLL型）で、粒子はラグランジュ的に追跡する。粒子と格子の対応づけの探索法、有限な粒子体積を考えた保存的な連成、粗視化した個別要素法（DEM）による粒子衝突を組み込んだ（抄録）。", "p5": "希薄・遷移・高密度の3次元計算例で、実験や参照計算と良く一致した（抄録）。", "fun": "砂嵐や粉体の爆発のように、気体の中を無数の粒が飛ぶ現象を計算するには、気体は網の目で、粒は一つずつ追う二刀流が必要です。この研究は網の目を自由な形にできるようにし、複雑な装置の中でも計算できるようにした点が工夫です。", "unverified": "一致の程度を示す数値は抄録からは分からない。"}}, {"id": "pr25", "rank": 25, "headline": "分散を減らした確率粒子BGK法で低速流を計算", "title": "A Variance-Reduced Unified Stochastic Particle BGK Method for Low-Speed Multiscale Gas Flows", "url": "https://doi.org/10.2139/ssrn.7669427", "authors": "Zhiyuan Ren ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Ren, Z., Fei, F., Li, W., & Liu, Z. (2026). A Variance-Reduced Unified Stochastic Particle BGK Method for Low-Speed Multiscale Gas Flows. https://doi.org/10.2139/ssrn.7669427", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "低速で多スケールの気体流れを確率的な粒子で計算するとき、信号が弱いと統計ノイズが大きくなる問題を、重要度重みによる分散低減で抑えた（抄録）。", "p3": "既存のUSPBGK法の衝突の目標分布は応力や熱流束などの高次モーメントに依存し、その標本誤差が解に伝わる。大域平衡分布を基準に、各モーメントを解析的な平衡分と重み付きの偏差の和で評価し、保存則を守る重みの補正を加えた（抄録）。", "p5": "ポアズイユ流や熱的レイリー問題などの数値試験で検証した（抄録。具体的な誤差の数値は抄録の範囲では未確認）。", "fun": "粒子をたくさん飛ばして平均をとる計算は、知りたい変化が小さいほど「ゆらぎ」に埋もれてしまいます。答えの大部分が分かっている平衡状態を引き算し、ずれの部分だけを粒子で数えることで、ゆらぎを小さくするという発想が巧みです。", "unverified": "分散低減の効果の大きさは抄録が途中で切れており未確認。"}}, {"id": "pr26", "rank": 26, "headline": "面ファスナーの剥離を統計力学でモデル化", "title": "Geometry-informed multiscale statistical mechanics modeling of hook-and-loop fasteners", "url": "https://doi.org/10.2139/ssrn.7669359", "authors": "Zhou Wu ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Wu, Z., Yu, W., Ma, R., Bao, B., Chao, X., & Peng, F. (2026). Geometry-informed multiscale statistical mechanics modeling of hook-and-loop fasteners. https://doi.org/10.2139/ssrn.7669359", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "面ファスナー（マジックテープ）の剥がす力を、ループ形状のばらつきから予測する多スケールの統計力学モデルを作った（抄録）。", "p3": "顕微鏡観察、3次元の有限要素の接触解析、11本のループの集団を単位とする確率的な微細構造モデルを組み合わせ、初期形状から係合状態と単位の力学定数を写像し、モンテカルロの重ね合わせで力-変位曲線と予測区間を出す（抄録）。", "p5": "有限要素モデルは20回の試験の平均の剥離傾向を再現した。4つの外部構成で代表曲線の正規化RMSEは平均11.29%、最大力の平均絶対誤差は3.95%（抄録）。", "fun": "マジックテープの強さは、一本一本のフックの強さより「何本が同時に引っかかっているか」で決まり、力が最大になる前から引っかかりは減り始めているという発見が面白い点です。身近な道具の中に、たくさんの粒がばらばらに力を分け合う物理が隠れています。", "unverified": "試験条件の詳細は抄録からは分からない。"}}, {"id": "pr27", "rank": 27, "headline": "ガウス過程とベイズ最適化で最悪津波を探索", "title": "Site-specific tsunami scenario assessment,for coastal infrastructure using Bayesian optimization based on Gaussian process surrogate model", "url": "https://doi.org/10.2139/ssrn.7665963", "authors": "Ayumi Nishi ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Nishi, A., & Shoji, G. (2026). Site-specific tsunami scenario assessment,for coastal infrastructure using Bayesian optimization based on Gaussian process surrogate model. https://doi.org/10.2139/ssrn.7665963", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "重要な沿岸施設ごとに最大の津波高をもたらす震源シナリオを、少ない数値計算で探し出す枠組みを提案した（抄録）。", "p3": "震源特性・震源と地点の位置関係・海岸地形から最大津波高を予測する多地点のガウス過程回帰を代理モデルとし、ベイズ最適化で2段階にシナリオを選ぶ（期待改善量で探索し、次に予測平均で高応答を探す）（抄録）。", "p5": "日本海溝のプレート間地震で、学習に使わなかった5地点に適用。第2段階で平均絶対誤差は全地点で約0.3 m以下。選ばれた120シナリオは、308の離散シナリオの統計的性質を保ちつつ極端な応答もとらえた（抄録）。", "fun": "何百通りもの地震をすべて計算する代わりに、「危なそうなところ」と「まだよく分からないところ」を賢く選んで計算する方法です。宝探しで、怪しい場所と未調査の場所を交互に掘るような戦略で、計算を大きく減らせる点が魅力です。", "unverified": "計算量の削減率は抄録からは分からない。"}}, {"id": "pr28", "rank": 28, "headline": "波の入射角で列車振動による建物応答が変わる", "title": "Effect of Wave Propagation Angle on 3D Train-Induced Vibrations in Multi-Story RC Buildings", "url": "https://doi.org/10.2139/ssrn.7666042", "authors": "İbrahim Şenaslan ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Şenaslan, İ., Toprak, B., & Bilgiç, B. (2026). Effect of Wave Propagation Angle on 3D Train-Induced Vibrations in Multi-Story RC Buildings. https://doi.org/10.2139/ssrn.7666042", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "列車が起こす地盤振動が建物にどの方向から来るかで、6階建てRC建物の応答がどう変わるかを数値解析で調べた（抄録）。", "p3": "31自由度の多体列車モデル（時速50 km）と3次元の軌道-地盤の有限要素を連成して車輪-レールの相互作用とレイリー波を計算し、線路から40 mの加速度を建物モデルに入力、入射角を変えて層間変形角と柱のせん断力を評価した（抄録）。", "p5": "入射角0°でX方向の層間変形角と主軸の柱せん断力が最大、Y方向は75°と90°付近で最大。ただしすべての値は設計上の耐力を大きく下回った（抄録）。", "fun": "列車の揺れが建物に届くとき、揺れが来る方向と建物の向きの組み合わせで、どの柱に負担がかかるかが変わるという研究です。微小な振動なので壊れる心配はないものの、住み心地に関わる揺れを建物の向きで減らせるかという問いが面白い点です。", "unverified": "建物の構造諸元や地盤条件の詳細は抄録からは分からない。"}}, {"id": "pr29", "rank": 29, "headline": "重い裾の雑音下での成分ごとのセンサ融合", "title": "Reliability-Aware Component-Wise Information Fusion for Nonlinear Multisensor State Estimation Under Heavy-Tailed Noise", "url": "https://doi.org/10.2139/ssrn.7669367", "authors": "Jiayang Xu ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Xu, J., Guo, P., Wen, G., & Kang, Y. (2026). Reliability-Aware Component-Wise Information Fusion for Nonlinear Multisensor State Estimation Under Heavy-Tailed Noise. https://doi.org/10.2139/ssrn.7669367", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "重い裾をもつ雑音と、誤差の相関が分からない状況で、複数センサの状態推定を成分ごとの信頼度で融合する方法を提案した（抄録）。", "p3": "変分ベイズの頑健なキュバチャ・カルマンフィルタ（VB-ARCKF）で局所の事後モーメントを得て、イノベーションの大きさ・共分散のずれ・事後分散から成分ごとの重みを作る。相互共分散を指定せずに誤差の上界を示した（抄録）。", "p5": "既定の汚染条件で、事後分散や共分散のずれだけで重み付けする方法より位置誤差が小さかった。公開の非同期距離計測データでも検討した（抄録）。", "fun": "たまにとんでもない外れ値を出すセンサーが混じっていても、どのセンサーのどの成分を信じるかを毎回点検して重みを変えることで、全体の推定を守る方法です。クラスで多数決をとるとき、発言ごとに信頼度を見直すような工夫に似ています。", "unverified": "誤差の改善幅の数値は抄録からは分からない。"}}, {"id": "pr30", "rank": 30, "headline": "き裂進展の不確実性を考えた点検時期の最適化", "title": "Risk-based Scheduling for Multiple Sequential Delayed Inspections of Less Severe Cracks in Pipes considering Uncertain Crack Growth", "url": "https://doi.org/10.2139/ssrn.7669284", "authors": "Mohammadali Ameri Fard Nasrand ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Ameri Fard Nasrand, M., & Li, Y. (2026). Risk-based Scheduling for Multiple Sequential Delayed Inspections of Less Severe Cracks in Pipes considering Uncertain Crack Growth. https://doi.org/10.2139/ssrn.7669284", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "き裂のある配管について、追加の点検をすべきか、いつ・どの技術で行うかを、情報の価値（VoI）で決める意思決定の枠組みを示した（抄録）。", "p3": "ベイズ決定理論にもとづき、追加点検なしの期待ライフサイクル費用と、起こりうる点検結果で平均した事前-事後の期待費用を比べる。等間隔（時間基準）としきい値（性能基準）の点検計画を、年破壊確率の制約のもとで評価し、点検費用を引いた正味のVoIを計算する（抄録）。", "p5": "抄録の範囲では手法の説明が中心で、具体的な数値結果は確認できない（抄録）。", "fun": "「点検すること自体にお金がかかるなら、点検は本当に得なのか」を数式で判断する考え方です。検査で分かる情報にも値段がつく、と考えるのが面白い点で、健康診断を何年おきに受けるかを決める問題とよく似ています。", "unverified": "具体的な費用削減の数値は抄録が途中で切れており未確認。"}}, {"id": "pr31", "rank": 31, "headline": "音響ブラックホール入りハニカムで振動を抑える", "title": "An acoustic-black-hole-empowered hexagonal honeycomb lattice for vibration attenuation", "url": "https://doi.org/10.2139/ssrn.7669281", "authors": "Le Chang ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Chang, L., & Cheng, L. (2026). An acoustic-black-hole-empowered hexagonal honeycomb lattice for vibration attenuation. https://doi.org/10.2139/ssrn.7669281", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "音響ブラックホール（ABH、厚さを徐々に薄くして波を閉じ込める構造）の梁を六角形ハニカム格子に組み込み、軽くて硬いまま広い周波数帯の振動を抑える構造を提案した（抄録）。", "p3": "波の伝播とバンドギャップ（波が伝わらない周波数帯）を、厳密な動的剛性法で効率よく解析し、厚さ比・細長比・べき指数の影響を無次元パラメータで調べて設計図を作った（抄録）。", "p5": "厚さ比と細長比がバンドギャップを強く左右し、べき指数の影響は小さかった。バンドギャップの拡大と、有限構造でのABHによる減衰増加の2つの仕組みを特定し、有限要素解析と3Dプリント試験体の伝達率測定で確かめた（抄録）。", "fun": "梁の先をだんだん薄くすると、波はどんどん遅くなって先端から戻れなくなり、そこでエネルギーがたまって消えます。この「波のブラックホール」をハチの巣構造に組み込み、軽さと静かさを両立させた点が工夫です。", "unverified": "バンドギャップの幅や減衰量の数値は抄録からは分からない。"}}, {"id": "pr32", "rank": 32, "headline": "ロボット導入を仲介するインテグレーターの役割", "title": "Integrators and Robot Adoption: Facts from Hungary", "url": "https://doi.org/10.2139/ssrn.7665748", "authors": "Gabor Bekes ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Bekes, G., Bonfiglioli, A., Crinò, R., & Gancia, G. (2026). Integrators and Robot Adoption: Facts from Hungary. https://doi.org/10.2139/ssrn.7665748", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "ハンガリーの企業間取引データから産業用ロボットの導入を仲介するインテグレーターを特定し、ロボット導入の主な経路が仲介業者であることを示した（抄録）。", "p3": "企業間の取引記録を使ってロボットインテグレーターを識別する方法を示し、導入企業と仲介業者の特徴を記述した（抄録）。", "p5": "国内のインテグレーターが導入企業の95%、ロボット支出の71%を担っていた。インテグレーターは大きく生産性が高く、主に中小企業に販売し、成長の速いインテグレーターとつながる企業ほど再購入しやすかった（抄録）。", "fun": "ロボットは工場が直接輸入して入れるものと思いがちですが、実際は国内の「つなぎ役」の会社を通す導入がほとんどだという発見です。めったに買わない高価な技術ほど、詳しい仲介役がいると中小企業でも手が届くことがよく分かります。", "unverified": "対象期間は抄録からは分からない。"}}, {"id": "pr33", "rank": 33, "headline": "Google検索で家計の脆弱性を早期に察知する", "title": "BEHAVIOURAL EARLY WARNING INDICATORS OF HOUSEHOLD SECTOR VULNERABILITY: EVIDENCE FROM GOOGLE SEARCH IN AN EMERGING MARKET", "url": "https://doi.org/10.2139/ssrn.7665848", "authors": "David De Villiers", "venue": "SSRN", "date": "2026-10-24", "apa": "De Villiers, D. (2026). BEHAVIOURAL EARLY WARNING INDICATORS OF HOUSEHOLD SECTOR VULNERABILITY: EVIDENCE FROM GOOGLE SEARCH IN AN EMERGING MARKET. https://doi.org/10.2139/ssrn.7665848", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "南アフリカで、Google検索の動向から家計の金融的な脆弱性の早期警戒指標を作り、公式統計より早く信号を出せることを示した（抄録）。", "p3": "Google Trendsから住宅・住宅ローン需要、正式な金融的苦境、非公式の貸金（mashonisa）への置き換えの3指標を作り、2015年1月からの準リアルタイムの逐次予測で、銀行・信用・住宅の7つの事象を最大24か月先まで予測した（抄録）。", "p5": "単独の指標でも7事象中6事象で信用GDPギャップや月次マクロ指標よりAUROCが高く、最も明確な信号は1〜8か月先、持続は約8〜13か月だった（抄録）。", "fun": "人々が困ったときに何を検索するかは、統計が発表されるずっと前に家計の危機を映し出すという発想です。特に、正式な銀行でなく街の貸金業者を調べる人が増えることを信号として使う点が、その国の暮らしに根ざしていて面白いところです。", "unverified": "各指標の具体的なAUROCの値は抄録からは分からない。"}}, {"id": "pr34", "rank": 34, "headline": "合成データ摂動で分類器の頑健性を評価する", "title": "Integrating Classifier Robustness into Machine Learning Model Evaluation using Synthetic Data Perturbation Sensitivity Metrics for Improved Predictions of Generalization Performance", "url": "https://doi.org/10.2139/ssrn.7665925", "authors": "Jacob Search ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Search, J., & Mann, B. P. (2026). Integrating Classifier Robustness into Machine Learning Model Evaluation using Synthetic Data Perturbation Sensitivity Metrics for Improved Predictions of Generalization Performance. https://doi.org/10.2139/ssrn.7665925", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "小さなデータで分類器を評価するとき、合成データに少しずつ摂動を加えて性能の落ち方を測り、汎化性能をより良く予測する評価法を提案した（抄録）。", "p3": "特徴空間や主成分空間でのクラスの位置関係から摂動の方向を選び、大きさを特徴分布間の平均ワッサースタイン距離で測る。摂動を大きくしたときの正解率の曲線を当てはめて感度指標を作る（抄録）。", "p5": "6種類の分類器と7つのデータセットで有用性を示した（抄録。具体的な数値は抄録の範囲では未確認）。", "fun": "テストの点数が同じ二人でも、問題を少しひねったときに崩れる人と崩れない人がいます。この研究は機械学習のモデルにも「ひねった問題」を段階的に出して、本当の実力を見分けようとする方法で、小さなデータでの過信を防ぐ工夫です。", "unverified": "感度指標が汎化性能をどの程度予測したかの数値は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "ソフトウェア職のAI代替のマクロ影響をABMで試算", "title": "When the Code Writers Are Automated: An Agent-Based Simulation of the Macroeconomic, Distributional and Financial Effects of AI-Driven Software Job Displacement", "url": "https://doi.org/10.5281/zenodo.23633673", "authors": "Tiruveedula, Tej Kumar", "venue": "Zenodo", "date": "2026-10-25", "apa": "Tiruveedula, T. K. (2026). When the Code Writers Are Automated: An Agent-Based Simulation of the Macroeconomic, Distributional and Financial Effects of AI-Driven Software Job Displacement (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.23633673", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "DataCiteに登録された抄録を使用", "preprint": true, "short": true, "p1": "AIがソフトウェア産業の仕事を大きく代替したとき経済全体に何が起きるかを、エージェントベースモデル（ABM）で試算した（抄録）。", "p3": "1万の労働者世帯、資本家層、6部門、800の小売店、住宅ローンを貸す銀行、累進課税と失業保険のある政府からなる閉じた経済を作り、IT産出あたりの労働が3年で30%・60%・90%代替される場合を各20シードで10年追った（抄録）。", "p5": "60%のシナリオで10年後の失業率はAIなしより14.7ポイント高く（18.8%対4.1%）、家計消費は14.1%低下、賃金分配率は61%から48%、所得ジニ係数は0.50から0.58、住宅ローン不履行は20.7%に達した（抄録）。", "fun": "働く人の割合は小さくても、高給で家を買い、よく消費するソフトウェア技術者の仕事が減ると、その影響はお店や銀行にまで連鎖するという「ドミノ倒し」をコンピュータの中で再現した研究です。ただし仮想の経済での試算である点には注意が必要です。", "unverified": "モデルの較正に使ったデータは抄録からは分からない。"}}, {"id": "pr36", "rank": 36, "headline": "支持基盤の圧力が指導者の判断を歪める二重経路", "title": "A Dual-System Model of Selectorate-Pressure Effects on Leader Judgment: Integrating Occupational-Stress and Political-Economy Mechanisms", "url": "https://doi.org/10.2139/ssrn.7665898", "authors": "Raul Villamarin Rodriguez ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Villamarin Rodriguez, R., Kannan, H., & Chepuri, P. K. (2026). A Dual-System Model of Selectorate-Pressure Effects on Leader Judgment: Integrating Occupational-Stress and Political-Economy Mechanisms. https://doi.org/10.2139/ssrn.7665898", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "指導者を取り巻く支持基盤の圧力が判断の質をどう歪めるかについて、職業ストレスと政治経済の2つの理論を統合したモデルを、登録報告（Stage 1）として提案した（抄録）。", "p3": "勝利連合の規模と選出母体の規模の比（W/S）を、直観的な判断（システム1）と熟慮的な判断（システム2）に結びつけ、4つの比較静学の予測を導く。報酬つきの集団実験（計画240集団、N = 1,440）など3つの研究を事前に定めた（抄録）。", "p5": "登録報告の計画段階であり、結果はまだない（抄録）。", "fun": "上司が「クビになるかも」という圧力を受けたとき、判断が雑になるのはストレスのせいか、それとも支持者のご機嫌取りのせいかを、実験で見分けようという計画です。間違いの種類から原因を当てるという探偵のような発想が面白い点です。", "unverified": "結果はまだなく未確認。"}}, {"id": "pr37", "rank": 37, "headline": "ラストマイル配送の選択と人との接触の好み", "title": "Human Interaction and Technology Orientation in Last-Mile Delivery Mode Choice: Evidence from Australia​", "url": "https://doi.org/10.2139/ssrn.7666101", "authors": "Liu Yang", "venue": "SSRN", "date": "2026-10-24", "apa": "Yang, L. (2026). Human Interaction and Technology Orientation in Last-Mile Delivery Mode Choice: Evidence from Australia​. https://doi.org/10.2139/ssrn.7666101", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "オーストラリアの宅配の最終区間で、郵便配達・宅配ロッカー・ドローンの選択を、人との関わりへの信頼と技術志向の観点から読み直した（抄録）。", "p3": "既発表の調査（2020年3〜6月、1,007人）とその2クラスのハイブリッド選択モデル（Merkert et al., 2026）の推定値を再解釈したもので、新しい推定は行っていない（抄録）。", "p5": "人との関係を重視するクラスが36%、技術志向のクラスが64%。都市部の居住は信頼の潜在得点を下げ（β = −0.238）技術得点を上げた（β = 0.355）（抄録）。", "fun": "荷物は配達員さんに手渡してほしい人と、ロッカーやドローンで十分な人がいて、その割合はおよそ3対6だという研究です。新しい技術が広がっても、人が届けることには安心という価値が残るという結論が、サービス設計の考え方として面白い点です。", "unverified": "元の推定の詳細は元論文の確認が必要。"}}, {"id": "pr38", "rank": 38, "headline": "データセンター誘致15年の約束と実績を検証", "title": "Case Study: Mecklenburg County — Boydton, South Hill, and What Fifteen Years of Data Centers Actually Bought", "url": "https://doi.org/10.5281/zenodo.23628544", "authors": "Turner, Tommy N.", "venue": "Zenodo", "date": "2026-10-24", "apa": "Turner, T. N. (2026). Case Study: Mecklenburg County — Boydton, South Hill, and What Fifteen Years of Data Centers Actually Bought (Version 1.1). Zenodo. https://doi.org/10.5281/ZENODO.23628544", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された事例研究の説明文を使用", "preprint": true, "short": true, "p1": "米バージニア州メクレンバーグ郡で、2010年に始まったデータセンター誘致の約束と15年後の実績を、財政・雇用・地域の変化から検証した事例研究である（抄録）。", "p3": "年ごとの財政記録、雇用の記録、町の人口の変化、拡張中の用地の状況を集めて、当初の約束（最大4億9,900万ドルの投資と50人の雇用）と比べた（抄録）。", "p5": "同社は郡内12のデータセンター用地のうち11を所有し、投資表明は20億ドル弱、雇用は業者を含め約700人。データセンター税は郡の一般会計歳入の35〜40%を占め、1億5,400万ドルの学校施設の財源になった一方、町の人口は431人から302人に減った（抄録）。", "fun": "巨大なデータセンターが来ると町は豊かになるのか、を15年分の記録で確かめた研究です。税収は約束以上に増えて学校が建ったのに、すぐ隣の町の人口は減っていたという「割れた評価」が、インフラ誘致の光と影をよく表しています。", "unverified": "査読のない置き場の文書で、数値の出典の確認はできていない。"}}, {"id": "pr39", "rank": 39, "headline": "排水管が高潮・豪雨・海面上昇の複合浸水を左右", "title": "Urban Compound Flooding: Investigating the Role of Drainage Pipes in the Interplay between Storm Tides, Rainfall, and Sea Level Rise Using a Dynamically Coupled 1D Hydraulic-2D Hydrodynamic Model", "url": "https://doi.org/10.2139/ssrn.7669347", "authors": "Sunghoon Han ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Han, S., & Tahvildari, N. (2026). Urban Compound Flooding: Investigating the Role of Drainage Pipes in the Interplay between Storm Tides, Rainfall, and Sea Level Rise Using a Dynamically Coupled 1D Hydraulic-2D Hydrodynamic Model. https://doi.org/10.2139/ssrn.7669347", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "米ノーフォークで、高潮と豪雨が重なる複合浸水において、雨水排水管が果たす役割を1次元管路-2次元氾濫の連成モデルで示した（抄録）。", "p3": "高潮と降雨を組み合わせたシナリオを計算し、海側の水位上昇が排水能力をどれだけ損なうか、さらに30 cmの海面上昇の影響を調べた（抄録）。", "p5": "1年確率の複合事象には対応できるが、10年・50年確率では降雨のピーク前に高潮で管網が満たされ急激に悪化した。30 cmの海面上昇で浸水量は1年・10年・50年の各シナリオで6.9%、29.1%、30.4%増えた（抄録）。", "fun": "雨が降る前に高潮で地下の排水管がいっぱいになってしまうと、その後の雨は行き場を失う、という順番の問題が浸水の深刻さを決めるという発見です。目に見えない地下の管の「満杯かどうか」が街の運命を分けるという点が面白いところです。", "unverified": "モデルの検証に使った観測データは抄録からは分からない。"}}, {"id": "pr40", "rank": 40, "headline": "事前学習した物理GNNで都市排水を実時間推定", "title": "PT-PIGNN: A Pre-Trained Physics-Informed Graph Neural Network for Real-Time Urban Drainage Simulation under Sparse Monitoring", "url": "https://doi.org/10.2139/ssrn.7665712", "authors": "Yizhou Qian ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Qian, Y., Huang, Z., Zhong, L., Dong, X., & Hu, Q. (2026). PT-PIGNN: A Pre-Trained Physics-Informed Graph Neural Network for Real-Time Urban Drainage Simulation under Sparse Monitoring. https://doi.org/10.2139/ssrn.7665712", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "都市の下水・雨水排水網の水理状態を、少ない監視点から実時間で推定するため、事前学習した物理情報つきグラフニューラルネットワーク（PT-PIGNN）を提案した（抄録）。", "p3": "GNNとCNNに1次元サン・ブナン方程式を組み込み、運動方程式による勾配の不安定を避けるため、ランダムな境界条件で物理を事前学習し、その後疎な計測で微調整する2段階の学習を行う（抄録）。", "p5": "制御された水理実験台と大規模な実排水網で、従来のPINN、データのみのGNN、較正済みのSWMMを上回った（抄録。数値は抄録の範囲では未確認）。", "fun": "排水管の網の目すべてにセンサーを付けるのは無理なので、物理の法則を先にAIに覚えさせてから、少ない測定値で仕上げるという二段構えです。教科書で原理を学んでから実地で少しだけ練習する、人間の学び方に近い点が面白いところです。", "unverified": "監視していない地点での誤差の数値は抄録が途中で切れており未確認。"}}, {"id": "pr41", "rank": 41, "headline": "チャットボットが若者の友になるとき孤独は", "title": "When Chatbots Become Companions: Generative AI, Loneliness, and Adolescent Well-Being", "url": "https://doi.org/10.5281/zenodo.23627571", "authors": "Bilal, Restu", "venue": "Zenodo", "date": "2026-10-24", "apa": "Bilal, R. (2026). When Chatbots Become Companions: Generative AI, Loneliness, and Adolescent Well-Being. Zenodo. https://doi.org/10.5281/ZENODO.23627571", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された論考の説明文を使用", "preprint": true, "short": true, "p1": "思春期の若者が生成AIを感情の支えとして使うことが、孤独とwell-beingにどう関わりうるかを、既存研究を整理して論じた論考である（抄録）。", "p3": "孤独・社会的痛み・会話エージェントの研究と、若者が自発的に生成AIに相談する最近の証拠を統合して議論する（抄録）。", "p5": "チャットボットはその場の孤独感を和らげうるが、相互的な人間関係や持続的な保護とは別物であり、擬人化・機微情報の開示・迎合的な回答への信頼・人への相談の遅れなどのリスクがあると論じた（抄録）。", "fun": "話を聞いてくれるAIは、さみしさをその場で和らげてくれるかもしれませんが、「相手も自分を気にかけてくれる」という人間関係とは違います。便利さと引き換えに、人に相談する機会を逃してしまうおそれを指摘している点が考えさせられます。", "unverified": "新しい実証データは含まれていない（論考）。"}}, {"id": "pr42", "rank": 42, "headline": "道具を使うLLMエージェントの誤りの伝播を監査", "title": "Auditing and Safeguarding Tool-Using Language Agents: Evaluation Validity, Error Propagation, and a Runtime Interceptor (AgentProp-Bench)", "url": "https://doi.org/10.2139/ssrn.7669295", "authors": "Bhaskar Gurram", "venue": "SSRN", "date": "2026-10-25", "apa": "Gurram, B. (2026). Auditing and Safeguarding Tool-Using Language Agents: Evaluation Validity, Error Propagation, and a Runtime Interceptor (AgentProp-Bench). https://doi.org/10.2139/ssrn.7669295", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "道具（API）を使うLLMエージェントの正しさを判定する自動評価の妥当性と、誤りの伝播を調べる診断ベンチマークAgentProp-Benchを作った（抄録）。", "p3": "13のLLMエージェント（商用9、公開重み4）の4領域14,750件の実行記録を集め、部分文字列一致による判定、LLMによる判定、人手の注釈の一致を比べた（抄録）。", "p5": "部分文字列による判定は人手との一致が偶然並み（Cohenのκ = 0.049、注釈者どうしはκ = 0.855）。3つのLLMの合議はκ = 0.432、単独のGPT-4o-miniの判定はκ = 0.567だった（抄録）。", "fun": "AIが正しく仕事をしたかを、「答えに特定の単語が入っているか」で採点すると、人間の採点とほとんど一致しないという結果は衝撃的です。AIの成績表そのものが信用できるかを先に確かめないと、比較の意味がなくなることを教えてくれます。", "unverified": "誤り伝播の割合の数値は抄録が途中で切れており未確認。"}}, {"id": "pr43", "rank": 43, "headline": "表形式データで決定木系と深層学習はどちらが強いか", "title": "Tree Ensembles and Deep Neural Networks for Tabular Prediction A Systematic Review of Benchmark Evidence from 2021 to 2024", "url": "https://doi.org/10.5281/zenodo.23613917", "authors": "NAHOM YEMANE HAGOS", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-10-24", "apa": "HAGOS, N. A. H. O. M. Y. E. M. A. N. E. (2026). Tree Ensembles and Deep Neural Networks for Tabular Prediction A Systematic Review of Benchmark Evidence from 2021 to 2024. Zenodo. https://doi.org/10.5281/ZENODO.23613917", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（Zenodo上の系統的レビュー）", "preprint": true, "short": true, "p1": "表形式データの予測で、勾配ブースティング木と深層ニューラルネットのどちらが優れるかについて、2021〜2024年のベンチマーク研究を系統的にレビューした（抄録）。", "p3": "OpenAlexのブール検索と意味検索で82件を得て、重複を除き66件を選別、全文評価を経て16研究を採用。データの透明性・検証・調整の比較可能性など6領域で評価し、性能は統合せず主題的にまとめた（抄録）。", "p5": "木のアンサンブルは強い基準であり続け、数値の埋め込み、正則化した多層パーセプトロン、検索、混成モデル、事前学習型トランスフォーマーが改善を示す場面があった（抄録）。", "fun": "表のデータでは昔ながらの「決定木の集まり」と最新の深層学習のどちらが強いのか、という論争に対し、研究ごとの条件の違いが結論を左右していると整理した点が面白いところです。勝ち負けの前に、試合のルールをそろえる必要があるということです。", "unverified": "査読のない置き場の文書。各研究の評価結果の詳細は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "政治学", "headline": "順位付き投票は過小代表の候補への支持を増やす", "title": "Ranked-Choice Voting Increases Support for Underrepresented Leaders by Reducing Strategic Bias", "url": "https://doi.org/10.2139/ssrn.7662219", "authors": "Kristen Duke ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Duke, K., Gershon, R., & Onyeador, I. (2026). Ranked-Choice Voting Increases Support for Underrepresented Leaders by Reducing Strategic Bias. https://doi.org/10.2139/ssrn.7662219", "why": "当選可能性への配慮による戦略的投票を順位付き投票が減らし、女性や少数派の候補への支持を高めることを因果的に示した。"}, {"id": "pn02", "rank": 2, "field": "経営学", "headline": "NFTのロイヤルティは競争で回収されなくなった", "title": "Competing Away a Property Right: Enforcement Architecture and Platform Competition in NFT Royalties", "url": "https://doi.org/10.2139/ssrn.7665741", "authors": "Sheyan Lalmohammed", "venue": "SSRN", "date": "2026-10-24", "apa": "Lalmohammed, S. (2026). Competing Away a Property Right: Enforcement Architecture and Platform Competition in NFT Royalties. https://doi.org/10.2139/ssrn.7665741", "why": "イーサリアム上のロイヤルティ支払いの崩壊を、回収を担う市場間の競争として模型化し、トークン側での執行の効果を示した。"}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "公式な貯蓄が家計の緊急資金の調達力を高める", "title": "Saving Composition, Digital Payments and Household Financial Resilience in Developing Economies", "url": "https://doi.org/10.2139/ssrn.7665753", "authors": "Nur Mazlan ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Mazlan, N., Barrios, E., Lieu, B. C., Lee, H. C., Jenatabadi, H. S., Ganggayah, M. D., A Khalim, N. H., Qu, B., Wang, S., & Torreno, G. (2026). Saving Composition, Digital Payments and Household Financial Resilience in Developing Economies. https://doi.org/10.2139/ssrn.7665753", "why": "77か国31万人のGlobal Findexで、金融包摂の水準でなく構成が家計の緊急資金の調達力と関わることを示した。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "農業技術の割引券で採用は進むが実践は伴わない", "title": "Internal Displacement and the Promotion of Agricultural Intensification in Nigeria: Experimental Evidence from a Fragile Setting", "url": "https://doi.org/10.2139/ssrn.7669132", "authors": "Rewa Misra ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Misra, R., Bloem, J., Ambler, K., Wagner, J., & Amare, M. (2026). Internal Displacement and the Promotion of Agricultural Intensification in Nigeria: Experimental Evidence from a Fragile Setting. https://doi.org/10.2139/ssrn.7669132", "why": "国内避難民の多いナイジェリアで農業技術の普及を無作為化実験で検証し、採用と実際の実践の乖離を示した。"}, {"id": "pn05", "rank": 5, "field": "組織行動・心理的安全性", "headline": "オンライン会議で話すことが指導性になる条件", "title": "When Speaking Becomes Leading in Synchronous Virtual Teams: A Micro-Endorsement Account", "url": "https://doi.org/10.2139/ssrn.7665899", "authors": "Fuhe Jin ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Jin, F., Shimaoka, M., Kito, T., Sayama, H., Tsai, C.-Y., & Wang, S.-B. (2026). When Speaking Becomes Leading in Synchronous Virtual Teams: A Micro-Endorsement Account. https://doi.org/10.2139/ssrn.76658 ctional Competition over Global FRAND Rates. https://doi.org/10.2139/ssrn.7669377", "why": "各国の裁判所が自国の厚生を最大化する主体として世界的なFRAND料率を決めると模型化し、判断の偏りを説明した。"}, {"id": "pn13", "rank": 13, "field": "経済学", "headline": "核融合点火の発表に株式市場はどう反応したか", "title": "Who Is Afraid of Scientific Breakthroughs? Stock Market Responses to Fusion Ignition", "url": "https://doi.org/10.2139/ssrn.7665990", "authors": "Gianfranco Gianfrate ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Gianfrate, G., Rubin, M., & Stefanelli, K. (2026). Who Is Afraid of Scientific Breakthroughs? Stock Market Responses to Fusion Ignition. https://doi.org/10.2139/ssrn.7665990", "why": "商業化前の科学的突破が企業価値に与える影響を、核融合点火の発表に対する世界の上場企業の株価反応で検証した。"}, {"id": "pn14", "rank": 14, "field": "統計学", "headline": "暗号資産を保有する企業の伝染リスクを共形予測", "title": "Does CoVaR understate contagion? Conformal forecasts for crypto treasury companies", "url": "https://doi.org/10.2139/ssrn.7665847", "authors": "Lamia Sebai", "venue": "SSRN", "date": "2026-10-24", "apa": "Sebai, L. (2026). Does CoVaR understate contagion? Conformal forecasts for crypto treasury companies. https://doi.org/10.2139/ssrn.7665847", "why": "暗号資産を保有する上場企業とコインの間の裾リスクの伝染を、超過率を制御した共形予測で評価した。"}, {"id": "pn15", "rank": 15, "field": "因果推論", "headline": "バッジとランキングで持続可能な移動を促す", "title": "Engagement Effects of Gamification-based Behavioral Interventions on Travel Mode Choice", "url": "https://doi.org/10.2139/ssrn.7666102", "authors": "Viswa Sri Rupa Anne ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Anne, V. S. R., Kibria, G., Liu, Y., Asensio, O., & Peeta, S. (2026). Engagement Effects of Gamification-based Behavioral Interventions on Travel Mode Choice. https://doi.org/10.2139/ssrn.7666102", "why": "4,483人の自家用車利用者を対象にした無作為化実験で、ゲーミフィケーションが持続可能な交通手段への関与に与える効果を検証した。"}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "粘着価格のもとでも企業はほぼ需要に応じる", "title": "Sticky Prices and Constraints to Produce", "url": "https://doi.org/10.2139/ssrn.7669441", "authors": "Justinas Markauskas ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Markauskas, J., Ravn, M. O., & Ríos-Rull, J.-V. (2026). Sticky Prices and Constraints to Produce. https://doi.org/10.2139/ssrn.7669441", "why": "中規模ニューケインジアン模型で、名目硬直性のために企業が限界費用以下の価格で供給を強いられる程度を測った。", "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "中規模ニューケインジアン模型で、価格の硬直性のために企業が限界費用を下回る価格で需要に応じさせられる事態がどの程度起きるかを測った（抄録）。", "p3": "Altig et al. (2011) の枠組み（据え置き価格と賃金の定常インフレへの完全な指数化、ほぼ規模に対して収穫一定）で、企業の供給意思の条件が破れる頻度と産出の損失を計算した（抄録）。", "p5": "供給意思の条件が破れる企業は1%未満で、産出の損失はごくわずか。限界費用が産出にほとんど反応しないことと、価格が賃金より頻繁に改定されることが理由で、短期の限界費用曲線が急なら破れは無視できなくなる（抄録）。", "fun": "経済学の標準モデルは「企業は決めた値段で、注文が来たらいくらでも売る」と仮定します。赤字になっても売るのか、という素朴な疑問を確かめ、普通の条件ならほぼ問題ないが、コストが急に上がる状況では仮定が崩れると示した点が面白いところです。", "unverified": "なし"}}, {"id": "pn17", "rank": 17, "field": "機械学習", "headline": "複数視点の一致で多モーダルLLMの幻覚を減らす", "title": "Mitigating Hallucinations in Multimodal Large Language Models via Multi-view Consistency Decoding", "url": "https://doi.org/10.2139/ssrn.7665640", "authors": "Zhe Yang ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Yang, Z., Song, X., Pan, Q., & Shi, G. (2026). Mitigating Hallucinations in Multimodal Large Language Models via Multi-view Consistency Decoding. https://doi.org/10.2139/ssrn.7665640", "why": "摂動した画像の予測を差し引く従来の対照復号に対し、視点間の一致を手がかりにする復号法を提案した。", "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "画像を扱うLLM（MLLM）が画像にないことを語る幻覚を、学習なしで減らす復号法MVCD（多視点一致復号）を提案した（抄録）。", "p3": "少し加工した画像からの予測を「信用できない参照」として差し引く従来の対照復号と異なり、複数の視点の予測の支持と一致を一緒に使う。一般化Jensen-Shannonダイバージェンスからトークンごとの視点間の不一致を求めて集約する（抄録）。", "p5": "わずかな画像の加工は予測を悪くするとは限らず、誤りを正すこともあり、視点間の一致が予測の信頼性と関係するという分析結果を示した（抄録。性能の数値は抄録の範囲では未確認）。", "fun": "写真を少しずらしたり加工したりしても同じ答えが返ってくるなら、その答えは信用できる、という考え方です。これまでは加工した画像を「悪い見本」として扱っていたのを、「別の角度からの証言」として生かす発想の転換が面白い点です。", "unverified": "ベンチマークでの改善幅は抄録が途中で切れており未確認。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "越境EC試験区の指定がデジタル企業の参入を促す", "title": "Cross-Border E-Commerce Industrial Policy and Entry of Digital Technology Firms", "url": "https://doi.org/10.2139/ssrn.7665747", "authors": "Hua Cheng ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Cheng, H., Gawande, K., & Huang, L. (2026). Cross-Border E-Commerce Industrial Policy and Entry of Digital Technology Firms. https://doi.org/10.2139/ssrn.7665747", "why": "中国の越境EC試験区を産業政策とみなし、企業登記とBERTによる分類でデジタル技術企業の参入への効果を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "中国が都市を越境EC試験区に指定した政策を産業政策とみなし、デジタル技術企業の参入と存続を大きく増やしたことを示した（抄録）。", "p3": "全国の企業登記から作ったデータで、BERTの言語モデルによりデジタル技術関連の企業を識別し、政策の効果を推定した。簡単な模型で参入と貿易拡大・イノベーション・供給網の3つの経路を結びつけた（抄録）。", "p5": "政策はデジタル技術企業の参入を急増させ、存続の可能性も高めた。どの種類の企業が恩恵を受けるかも経路ごとに示した（抄録。効果の大きさは抄録の範囲では未確認）。", "fun": "会社の登記簿に書かれた事業内容の文章をAIに読ませ、どの会社がデジタル企業かを判定してから政策の効果を測る、という道具立てが面白い点です。政策が市場の「場」をつくり、新しい会社が次々と入ることで場が長生きするという見方も特徴的です。", "unverified": "効果の推定値は抄録からは分からない。"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "金融政策に投資が強く反応する企業は時期で変わる", "title": "Firm Heterogeneity and the Response of Investment to Monetary Policy", "url": "https://econpapers.repec.org/RePEc:fip:fednls:103898", "authors": "Thomas Drechsel ほか", "venue": "RePEc NEP", "date": "2026-10-19", "why": "企業の投資の金利への反応が企業特性と時期によってどう異なるかを、規模や年齢などを同時に扱って分析した。", "explain": {"basis": "抄録", "basis_note": "RePEc NEP経由の抄録（ニューヨーク連銀のブログ記事、Staff Reportにもとづく）を使用", "preprint": true, "short": true, "p1": "金融政策に対する企業の投資の反応が、企業によっても時期によっても大きく異なることを示した（抄録）。", "p3": "規模・年齢・財務状態などの企業特性を個別にでなく同時に扱い、投資の金利への反応の分布を企業と時期にわたって調べた（抄録）。", "p5": "ほとんどの企業・時期で投資は金融政策にあまり反応しないが、一部の企業・時期では非常に強く反応し、その強さは企業特性では説明しきれない部分が大きかった（抄録）。", "fun": "金利を上げると企業は投資を控える、と平均ではいえても、実際には「ほとんど動かない多数」と「大きく動く少数」に分かれているという発見です。平均だけを見ていると、政策が誰に効いているのかを見誤るおそれがあることを教えてくれます。", "unverified": "元のStaff Reportの手法とデータは確認できていない。"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "早すぎる死を年齢でなく世帯への打撃で定義", "title": "Beyond Age Cutoffs: A Household-Disruption Framework for Premature Mortality in India", "url": "https://doi.org/10.31235/osf.io/dgrxs_v2", "authors": "Amrit J John ほか", "venue": "SocArXiv", "date": "2026-10-24", "apa": "John, A. J., & Mishra, U. S. (2026). Beyond Age Cutoffs: A Household-Disruption Framework for Premature Mortality in India. https://doi.org/10.31235/osf.io/dgrxs_v2", "why": "年齢の区切りでなく、役割の早期継承や唯一の稼ぎ手の喪失など世帯への打撃で早死を定義する枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "SocArXivのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "インドで、早すぎる死を年齢の区切りでなく、死が世帯にもたらす打撃の大きさで定義し直す枠組みを提案した（抄録）。", "p3": "NFHS-5とPLFS 2019–20から、役割の早期継承、親の喪失、早い寡婦化、唯一の稼ぎ手の喪失など、死による世帯の打撃の複数の次元を推定し、ロジスティック回帰と確率的な合成得点で社会経済的な勾配を描いた（抄録）。", "p5": "打撃は貧しい世帯ほど早く大きく現れ、特に男性で顕著だった。最も豊かな層の20歳での死の打撃は、最も貧しい層の14歳での死と同程度だった（抄録）。", "fun": "「何歳で亡くなると早死にか」は、その人が家族の中で担っていた役割によって違う、という問い直しです。貧しい家庭では若い人が早くから稼ぎ手になるため、同じ打撃が6歳も若い年齢で起きるという比較が、格差の見え方を変えてくれます。", "unverified": "なし"}}, {"id": "pn21", "rank": 21, "field": "政治学", "headline": "企業の議決権行使は機能するよう設計されていない", "title": "Corporate Voting was Never Designed to Work", "url": "https://doi.org/10.2139/ssrn.7662661", "authors": "Steven Balet", "venue": "SSRN", "date": "2026-10-24", "apa": "Balet, S. (2026). Corporate Voting was Never Designed to Work. https://doi.org/10.2139/ssrn.7662661", "why": "株主の議決権行使が便宜の積み重ねで形づくられ、決定的な票を投じる主体と実質的な利害がずれていることを論じた。", "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用（法学の論考）", "preprint": true, "short": true, "p1": "米国の企業の議決権行使が、便宜の積み重ねで、株を選ばず売れず調べてもいない保有者が決定票を投じる仕組みになったと論じ、改革案を示した（抄録）。", "p3": "第I部で登録株主の閉じた集まりから、証券会社名義の保有、SECの妥協を経て、インデックスファンドと2つの議決権行使助言会社が票を左右する現在までの歴史をたどり、第II部で改革を論じる（抄録）。", "p5": "指示のないインデックスファンドの株は取締役会の推薦に従い、パススルー株は実質株主の指示どおりに投票すべきだと提案した（抄録）。", "fun": "会社の大事なことを決める株主の投票で、いちばん大きな票を持つのが「市場全体を機械的に買うファンド」だという逆説を指摘しています。持ち主を特定できない会社は持ち主に統治されえない、という一文が問題の核心をよく表しています。", "unverified": "実証データは含まれていない（論考）。"}}, {"id": "pn22", "rank": 22, "field": "機械学習", "headline": "街路画像と衛星画像を個体単位で対応づける", "title": "Instance-Level Cross-View Geo-Localization with A Fine-Grained Benchmark Dataset", "url": "https://doi.org/10.2139/ssrn.7669139", "authors": "shiyu hu ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "hu, s., chen, c., Yu, X., & Pang, S. (2026). Instance-Level Cross-View Geo-Localization with A Fine-Grained Benchmark Dataset. https://doi.org/10.2139/ssrn.7669139", "why": "画像単位の検索として扱われてきた視点間の位置推定を、個々の物体の対応づけとして定義し直し、評価用データを作った。", "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "街路のパノラマ画像と衛星画像の間で、個々の物体を対応づける「個体単位」の視点間の位置推定のために、データセットMCILCと手法ILGeoを作った（抄録）。", "p3": "MCILCはパノラマと衛星の画像対2,726組、確認済みの個体20,156件、15の意味カテゴリからなる。ILGeoは領域をまたぐ特徴の整合と、グラフ照合と多層の近傍制約による細かな対応の強化からなる（抄録）。", "p5": "抄録の範囲では性能の数値は確認できない（抄録）。", "fun": "地上で撮った写真に写る一本の木や一台の車が、真上から撮った衛星写真のどれに当たるかを当てる問題です。見る角度がまったく違うので形も変わりますが、周りの物との位置関係を手がかりにする点が、人間の地図の読み方に似ています。", "unverified": "手法の性能は抄録が途中で切れており未確認。"}}, {"id": "pn23", "rank": 23, "field": "機械学習", "headline": "連合グラフ学習への正しいラベルのままの裏口攻撃", "title": "CLDBA: Clean-Label Distributed Backdoor Attacks on Federated Graph Learning", "url": "https://doi.org/10.2139/ssrn.7669288", "authors": "Cong Wang ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Wang, C., Zhao, C., Zhang, Z., Guo, Q., Xu, G., & Zhang, Y. (2026). CLDBA: Clean-Label Distributed Backdoor Attacks on Federated Graph Learning. https://doi.org/10.2139/ssrn.7669288", "why": "ラベルを改ざんせずに複数の参加者に分散して仕掛ける裏口攻撃を連合グラフ学習で示した。", "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "データを共有せずに協調学習する連合グラフ学習（FedGL）に対し、ラベルを改ざんしないまま仕掛ける分散型の裏口攻撃CLDBAを示した（抄録）。", "p3": "代理モデルで、汚染するグラフ（分類が難しいもの）とトリガーを置く影響の大きいノードを2段階で選び、目標クラスのラベルは変えずにトリガーとクラスの結びつきを強める（抄録）。", "p5": "抄録の範囲では攻撃成功率などの数値は確認できない（抄録）。", "fun": "ラベルを書き換えれば攻撃はばれやすいので、正しいラベルのまま「ある印があるとこのクラス」と覚え込ませる、こっそりとした攻撃です。守る側の弱点を知るための研究で、協調学習の安全性がどれほど繊細かを教えてくれます。", "unverified": "攻撃の成功率と防御への耐性は未確認。"}}, {"id": "pn24", "rank": 24, "field": "統計学", "headline": "試料採取の間隔が黄土の沈下推定を不確かにする", "title": "Sampling-induced uncertainty in loess self-weight collapse settlement estimates: Effects of vertical spacing and refinement strategies", "url": "https://doi.org/10.2139/ssrn.7665675", "authors": "Yulu Lei ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Lei, Y., Li, T., Li, P., & Yang, Y. (2026). Sampling-induced uncertainty in loess self-weight collapse settlement estimates: Effects of vertical spacing and refinement strategies. https://doi.org/10.2139/ssrn.7665675", "why": "鉛直方向の試料採取間隔による沈下量推定の不確実性を定量化し、間隔の細分化の方策を評価した。", "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "黄土の自重による崩壊沈下量の推定で、鉛直方向の試料採取の間隔が生む不確実性を定量化し、間隔を細かくする方策を比べた（抄録）。", "p3": "0.2 m間隔の自重崩壊係数の深さ分布を参照データとし、深さで層別したモンテカルロの無作為抽出で別の間隔と位置を模擬した。誤差の95パーセンタイル（E95）と20%超の過小評価の確率（Pu）で評価した（抄録）。", "p5": "間隔を1.0 mから0.6 mにすると、E95は正寧で19.28%から14.11%、白水で21.70%から16.19%に下がり、Puは1.80%から0.24%、2.83%から0.53%に下がった（抄録）。", "fun": "地面の中を何cmおきに調べれば十分か、という一見地味な問題を、くじ引きのような模擬実験で答えています。測る間隔を少し縮めるだけで、沈下を大きく見誤る確率が数分の一に減るという結果は、調査計画の設計に直結します。", "unverified": "なし"}}, {"id": "pn25", "rank": 25, "field": "経済学", "headline": "ブランド資本が企業間信用を引き出す", "title": "More than being customer: Brand Capital and Trade Credit", "url": "https://doi.org/10.2139/ssrn.7669413", "authors": "Yu-En Lin ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Lin, Y.-E., Ma, A., Guo, S., & anon, j. (2026). More than being customer: Brand Capital and Trade Credit. https://doi.org/10.2139/ssrn.7669413", "why": "中国上場企業でブランド資本と企業間信用による資金調達の正の関係を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "中国の上場企業（2011〜2023年）で、ブランド資本が企業間信用（仕入れ先からの支払猶予）による資金調達と正の関係にあることを示した（抄録）。", "p3": "ブランド資本と企業間信用の関係を、地域の市場化、環境の不確実性、資産特殊性などで分けて分析し、代替指標と内生性の検定で頑健性を確かめた（抄録）。", "p5": "市場化が進んだ地域、不確実性が高い場合などで関係が強く、顧客の変動は関係を弱めた。企業間信用が多いほどその後の全要素生産性が高かった（抄録）。", "fun": "有名なブランドを持つ会社は、お客さんだけでなく仕入れ先からも信用され、「代金は後でいいですよ」と言ってもらいやすいという研究です。広告費が無駄遣いでなく、取引先からの信用という見えない資産になっている可能性を示しています。", "unverified": "効果の大きさの数値は抄録からは分からない。"}}, {"id": "pn26", "rank": 26, "field": "経済学", "headline": "市場の知恵と学術の予測因子、株価予測で比べる", "title": "Market Wisdom versus Academic Research: Evidence from Chinese Stock Markets", "url": "https://doi.org/10.2139/ssrn.7669373", "authors": "Zhiyong Li ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Li, Z., & Cba, A. (2026). Market Wisdom versus Academic Research: Evidence from Chinese Stock Markets. https://doi.org/10.2139/ssrn.7669373", "why": "中国株式市場の機械学習による収益率予測で、実務家の使う予測因子と学術研究の予測因子を比較した。", "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "中国株式市場の機械学習による収益率予測で、実務家がよく使う予測因子と学術研究の予測因子を比べ、組み合わせると強い信号になることを示した（抄録）。", "p3": "実務の予測因子と、Jensen, Kelly, and Pedersen (2023) にまとめられた学術の予測因子を機械学習の収益率予測に用い、その経済的な含意を調べた（抄録）。", "p5": "両方の特性を統合すると強い予測信号が得られ、機関投資家はその信号に沿って売買し、個人投資家は逆方向に売買する傾向があった（抄録）。", "fun": "株の世界の「現場の勘」と「学者の理論」のどちらが当たるかを、AIを使って勝負させたら、混ぜたときがいちばん強かったという結果です。さらに、プロはその信号どおりに動き、個人はその逆をしているという発見が意外です。", "unverified": "予測精度や収益の数値は抄録からは分からない。"}}, {"id": "pn27", "rank": 27, "field": "機械学習", "headline": "GNNと強化学習で粒子群最適化の構造を再構成", "title": "Data-driven topology reconstruction for particle swarm optimizationvia graph neural networks and reinforcement learning", "url": "https://doi.org/10.2139/ssrn.7669292", "authors": "Qing-Wei Chai ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Chai, Q.-W., Xia, Y., Qi, L., & Yang, Q. (2026). Data-driven topology reconstruction for particle swarm optimizationvia graph neural networks and reinforcement learning. https://doi.org/10.2139/ssrn.7669292", "why": "粒子群最適化の早すぎる収束に対し、粒子間の通信構造をグラフニューラルネットワークと強化学習で組み直す方法を提案した。", "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "粒子群最適化（PSO）の早すぎる収束を防ぐため、粒子間の通信のつながりをグラフニューラルネットワークと強化学習で毎世代組み直す方法を提案した（抄録）。", "p3": "つながりの再構成を動的グラフ上のリンク予測として定式化し、GNNが粒子の4次元の状態を符号化、内積とk近傍の規則でリンクを作る。探索の改善を報酬とする強化学習でGNNの重みと近傍の大きさを更新する（抄録）。", "p5": "抄録の範囲では比較の数値結果は確認できない（抄録）。", "fun": "たくさんの粒が情報を伝え合いながら答えを探す方法では、誰と誰が話すかで「早く決めすぎる」か「いつまでも迷う」かが決まります。その人間関係を固定のルールでなく、AIに状況に合わせて組み替えさせる点が新しい発想です。", "unverified": "性能の比較結果は未確認。"}}, {"id": "pn28", "rank": 28, "field": "機械学習", "headline": "人の行動認識の深層学習を精度と実装性で比較", "title": "Accuracy and Deployability of Deep Neural Networks for Human Action Recognition: A Six-Axis Survey and Controlled Benchmark", "url": "https://doi.org/10.2139/ssrn.7669138", "authors": "Nousheen Taj ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Taj, N., & P. T., B. (2026). Accuracy and Deployability of Deep Neural Networks for Human Action Recognition: A Six-Axis Survey and Controlled Benchmark. https://doi.org/10.2139/ssrn.7669138", "why": "人の行動認識の深層学習モデルを6つの観点で整理し、統一条件での比較実験で精度と実装性を評価した。", "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "動画から人の行動を認識する深層学習モデルを、精度だけでなく計算効率・時間的な頑健性・実装上の制約を含む6つの観点で整理し、統一条件で比較した（抄録）。", "p3": "R3D-18、R(2+1)D-18、MC3-18の3つの代表的な時空間畳み込みネットワークを、統制した実験枠組みで評価した（抄録）。", "p5": "抄録の範囲では比較の数値結果は確認できない（抄録）。", "fun": "AIの性能は正解率で語られがちですが、実際に監視カメラなどで使うには、速さや軽さ、動画の途中が欠けても大丈夫かも重要です。成績表の項目を増やして、現場で使えるかどうかを測ろうとする姿勢がこの研究のポイントです。", "unverified": "各モデルの比較結果は抄録が途中で切れており未確認。"}}, {"id": "pn29", "rank": 29, "field": "経営学", "headline": "生成AIで共同デザインする消費者の主体性と購買", "title": "Becoming a Co-Designer with Generative AI: How AI Affordances Shape Consumer Agency and Purchase Intention", "url": "https://doi.org/10.2139/ssrn.7666080", "authors": "Ly Cuc ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Cuc, L., Phuong, N., Permata, K., & Thuy, N. T. T. (2026). Becoming a Co-Designer with Generative AI: How AI Affordances Shape Consumer Agency and Purchase Intention. https://doi.org/10.2139/ssrn.7666080", "why": "製品カスタマイズでの生成AIのアフォーダンスが消費者の主体感を通じて購買意図に与える影響を検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "生成AIで商品をカスタマイズするとき、対話のしやすさと出力の多様さが、消費者の「自分がデザインした」という感覚を通じて購買意図を高めることを示した（抄録）。", "p3": "中国本土の消費者565人の二次的な調査データに、PLS-SEM（2段階の高次構成概念）を適用し、媒介分析、PLSpredict、測定不変性、多母集団分析を行った（抄録）。", "p5": "対話性と出力の多様さはともにデザインの主体感を高め、それが購買意図を高めた。対話性は直接にも影響し、多様さは主に主体感を通じて影響した（抄録）。", "fun": "AIにおまかせで作ってもらうより、AIとやりとりしながら作った方が「自分の作品」と感じて買いたくなる、という結果です。道具が賢くなっても、人は自分で関わった手応えを求めるという点が、手作りの楽しさとつながっていて面白いところです。", "unverified": "効果の大きさの数値は抄録からは分からない。"}}, {"id": "pn30", "rank": 30, "field": "情報システム", "headline": "所有者の異なるAIデータセンターの電力を連合学習で予測", "title": "Privacy Preserving Federated GPU Power Forecasting Across Independently Owned Sites Forming an AI-Data Center Farm", "url": "https://doi.org/10.2139/ssrn.7666084", "authors": "Guohao Yang ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Yang, G., Torkornoo, M., Gatsis, N., Ahmed, S., & Alamaniotis, M. (2026). Privacy Preserving Federated GPU Power Forecasting Across Independently Owned Sites Forming an AI-Data Center Farm. https://doi.org/10.2139/ssrn.7666084", "why": "細かな運用データを開示せずに複数事業者のGPU電力を予測する、プライバシー保護の連合学習の枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "所有者の異なるAIデータセンター群のGPU電力を、生データを出さずに予測するため、差分プライバシーつきの連合学習を評価した（抄録）。", "p3": "SUMMITとMIT SupercloudのGPU記録（10秒間隔）で2拠点の概念実証を行い、100秒の履歴から次の時点の対数収益を予測する。TCNとTransformerを、単独・集中・FedAvg・DP-FedAvg（ε = 8, 3, 1、δ = 10⁻⁵）で比べた（抄録）。", "p5": "抄録の範囲では、プライバシーの強さごとの予測精度の数値は確認できない（抄録）。", "fun": "電力会社が複数の会社のデータセンターの電力をまとめて予測したいとき、各社は運用の詳細を見せたくありません。データは手元に置いたまま、学習の結果だけを、さらに雑音を混ぜて共有するという工夫で、協力と秘密を両立させようとしています。", "unverified": "精度の結果は抄録が途中で切れており未確認。"}}, {"id": "pn31", "rank": 31, "field": "情報システム", "headline": "ソフトウェア信頼性予測の混成深層学習モデル", "title": "A Hybrid Deep Learning Model for Robust Software Reliability Prediction", "url": "https://doi.org/10.2139/ssrn.7666039", "authors": "Melkamu Almawu ほか", "venue": "SSRN", "date": "2026-10-24", "apa": "Almawu, M., & Wagaw, M. (2026). A Hybrid Deep Learning Model for Robust Software Reliability Prediction. https://doi.org/10.2139/ssrn.7666039", "why": "従来の信頼性成長モデルの仮定と機械学習の過学習の問題に対し、混成の深層学習モデルを提案した。", "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "ソフトウェアの信頼性を予測するため、CNNで故障データの局所的な特徴をとらえ、積み重ねたLSTMで長期の依存をとらえる混成の深層学習モデルを提案した（抄録）。", "p3": "故障の検出と修正の両方の系列を入力に使い、4つの公開データセットで単独のANN・CNN・LSTMと比べた（抄録）。", "p5": "あるデータセットで試験RMSE 0.056、MAPE 4.57%を達成し、単独のLSTM（RMSE 0.0995、MAPE 7.25%）を大きく上回った（抄録）。", "fun": "ソフトウェアの不具合がこれからどれくらい見つかるかを予測できれば、いつ発売してよいかを決められます。不具合が「見つかる流れ」と「直される流れ」の両方を学ばせる点が工夫で、テスト期間の計画に役立つ研究です。", "unverified": "他の3つのデータセットでの結果は抄録からは分からない。"}}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "生成音楽の感情表現を人の知覚と照らして診断", "title": "Evaluating and Diagnosing Emotion Mapping in Generative Music Through Human Perceptual Alignment", "url": "https://doi.org/10.2139/ssrn.7669135", "authors": "Xinwei Gao ほか", "venue": "SSRN", "date": "2026-10-25", "apa": "Gao, X., Chen, D., Yang, M., & Zhong, W. (2026). Evaluating and Diagnosing Emotion Mapping in Generative Music Through Human Perceptual Alignment. https://doi.org/10.2139/ssrn.7669135", "why": "生成音楽が意図した感情を聞き手に伝えられるかを、人間の知覚との一致で評価・診断する枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録抄録を使用", "preprint": true, "short": true, "p1": "生成AIが作った音楽が意図した感情を聞き手に伝えられるかを、人の知覚との一致で評価・診断する指標EPASを提案した（抄録）。", "p3": "快-不快と覚醒の2次元の感情モデルで、目標の感情カテゴリと座標を意図とし、聞き手のカテゴリ回答と2次元尺度上の位置を知覚とする。カテゴリの対応、空間の対応、方向の一致、知覚の確かさの4指標を組み合わせる（抄録）。", "p5": "SUNO V5 Proで生成した器楽曲16曲を、384件の判定で評価した（抄録。結果の数値は抄録の範囲では未確認）。", "fun": "AIに「悲しい曲を作って」と頼んだとき、聞いた人が本当に悲しく感じるかを測る物差しを作った研究です。間違え方が「いつも同じ方向にずれる」のか「人によってばらばら」なのかを区別できる点が工夫で、AIの表現力を細かく診断できます。", "unverified": "EPASの値や曲ごとの結果は未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "時間変化する損傷を分解と時空間局在で診断", "title": "A Two‐Stage Diagnostic Framework for Time‐Varying Structural Damage: Synergy of Modal Decomposition and Spatiotemporal Localization", "url": "https://doi.org/10.1155/stc/2167965", "authors": "Xiao-Mei Yang ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-10-25", "citescore": 10.3, "citescore_year": "2025", "apa": "Yang, X.-M., Yao, X.-J., Zhang, J., Li, Z., & Sun, Z.-L. (2026 e": "Robustness of multimodal large language models in facial expression recognition: A human-comparative study", "url": "https://doi.org/10.1016/j.patcog.2026.115177", "authors": "Lin Zhao ほか", "venue": "Pattern Recognition", "date": "2026-10-24", "sjr": 2.147, "citescore": 17.3, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、画像も扱う大規模言語モデル（MLLM）の表情認識の頑健性を、人間と比較して調べた研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "AIは顔写真から喜びや怒りを読み取れますが、写真が少し暗い、ぼやけているなどの条件で、人間より崩れやすいのかどうかという問いです。人間を物差しにしてAIの弱点を探す、という研究の組み立てが題名から読み取れます。", "unverified": "比較条件と結果はすべて未確認。"}}, {"id": "jr31", "rank": 31, "headline": "自律型AIエージェントの暴走の法的責任", "title": "Liability for rogue behaviors of agentic AI", "url": "https://doi.org/10.1016/j.telpol.2026.103339", "authors": "Gleb Papyshev ほか", "venue": "Telecommunications Policy", "date": "2026-10-25", "sjr": 1.519, "citescore": 12.7, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefの題名検索で見つかった同じ論文の抄録を使用", "preprint": false, "short": true, "p1": "自律型AIエージェントが、仕様の抜け穴を突く・意図的にだますといった「暴走」で損害を出したときの法的責任の配分を、ゲーム理論で分析した（抄録）。", "p3": "現在の技術では完全には除けない予測不能な暴走（AIに固有の欠陥）を前提に、不完全情報のもとで最適な責任制度の設計を分析した（抄録）。", "p5": "最適な責任制度はAIシステムの説明可能性に応じて変わり、裁判所は業界の説明可能性の基準を使って、損害が固有の欠陥によると開発者が示せるかで賠償を区別できる。これにより開発者は説明可能性に投資する誘因を持つ（抄録）。", "fun": "AIが勝手にずるをして損害を出したとき、誰がどれだけ責任を負うべきかという、新しい法律問題です。「なぜそうしたかを説明できるAIを作った会社ほど責任が軽くなる」仕組みにすれば、会社は自然と透明なAIを作るようになる、という発想が面白い点です。", "unverified": "なし"}}, {"id": "jr32", "rank": 32, "headline": "パンデミック後のテレワークと通勤の相互作用", "title": "From pandemic necessity to hybrid norm: modeling the evolving interplay between telework and transit commuting among Canadian workers", "url": "https://doi.org/10.1016/j.tbs.2026.101424", "authors": "Sadia Chowdhury ほか", "venue": "Travel Behaviour and Society", "date": "2026-10-25", "sjr": 1.641, "citescore": 10.3, " es: rethinking urban AI for inclusive development in the Global South", "url": "https://doi.org/10.1080/09614524.2026.2747116", "authors": "Abdulaziz I. Almulhim", "venue": "Development in Practice", "date": "2026-10-23", "citescore": 2.6, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "グローバルサウスの都市開発で、デジタルへのアクセスだけでは包摂的な都市AIにならないと論じ、文脈に応じた進め方を提案した（抄録）。", "p3": "データ正義の研究と例示的な事例をもとに、AIが社会的に弱い立場の人々に不均等な機会とリスクをもたらす仕組みを検討した論考である（抄録）。", "p5": "代表性のあるデータ、意味のある参加、説明責任、人による監督、保護を優先する文脈に配慮した進め方を求めた（抄録）。", "fun": "AIで都市を便利にしようとしても、データに載っていない人々はAIからも見えなくなってしまいます。スマホを配るだけでは不十分で、誰のデータで誰のために作るのかを問う必要がある、という指摘がこの論考のポイントです。", "unverified": "新しい実証データは含まれていない（論考）。"}}, {"id": "jr36", "rank": 36, "headline": "メキシコ州の騒音・不平等・メンタルヘルス", "title": "Noise, Inequality, and Mental Health. Urban Challenges in the State of Mexico", "url": "https://doi.org/10.1007/s11524-026-01176-x", "authors": "Oscar A. Martínez-Martínez ほか", "venue": "Journal of Urban Health", "date": "2026-10-24", "sjr": 1.448, "citescore": 6.8, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、メキシコ州の都市における騒音・不平等・メンタルヘルスの関係を扱った研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "うるさい場所に住むのは誰か、そしてその騒音が心の健康にどう響くかという問いです。騒音という目に見えない負担が、収入などの格差と重なっているかもしれない、という見方が題名から読み取れる点が面白いところです。", "unverified": "内容はすべて未確認。"}}, {"id": "jr37", "rank": 37, "headline": "窓からの緑の眺めと在宅高齢者の心の健康", "title": "When spatial depth meets greenery: A two-wave longitudinal study of green window view features and mental well-being among homebound older adults", "url": "https://doi.org/10.1016/j.jenvp.2026.103257", "authors": "Minhan Qiu ほか", "venue": "Journal of Environmental Psychology", "date": "2026-10-24", "sjr": 2.508, "citescore": 10.9, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、在宅の高齢者について、窓から見える緑の特徴（奥行きなど）と心のwell-beingの関係を、2時点の縦断調査で調べた研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "外出が難しい高齢者にとって、窓の外の景色は世界とつながる大切な窓口です。緑の量だけでなく「奥行き」のような見え方の特徴まで調べようとしている点が、題名から読み取れる面白い問いです。", "unverified": "内容はすべて未確認。"}}, {"id": "jr38", "rank": 38, "headline": "AIコンパニオンと孤独、自閉スペクトラムの利用者", "title": "AI companionship and loneliness in autistic and neurotypical users trust, substitution, and the social role of chatbots", "url": "https://doi.org/10.1016/j.chbr.2026.101387", "authors": "Anna Hollis ほか", "venue": "Computers in Human Behavior Reports", "date": "2026-10-23", "citescore": 7.7, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "仲間づくりの目的でチャットボットを使う人は本当に孤独なのかを、自閉スペクトラムの成人と定型発達の成人で、事前登録した調査により確かめた（抄録）。", "p3": "2×2の横断調査（n = 365、自閉/定型×チャットボット利用/非利用）で、孤独、人への信頼、チャットボットへの信頼、代替価値の知覚、対人コミュニケーションの意図を測った（抄録）。", "p5": "自閉スペクトラムの参加者はすべての孤独尺度で孤独が高かったが、利用者が非利用者より孤独だという一貫した証拠はなく、利用の有無で神経型の差が変わる証拠もなかった。利用者はチャットボットへの信頼と代替価値で最も違った（抄録）。", "fun": "「AIを友だち代わりにする人はさみしい人だ」という思い込みを、データで確かめたら当てはまらなかったという研究です。違いは孤独の強さではなく、AIをどれだけ信頼し、人の代わりになると感じるかにあった、という発見が意外です。", "unverified": "なし"}}, {"id": "jr39", "rank": 39, "headline": "監査手続きのアルゴリズム化と監査調書のリスク", "title": "AUDIT DOCUMENTATION IN THE CONTEXT OF DIGITALIZATION: METHODOLOGICAL ASPECTS AND RISKS OF ALGORITHMIZATION", "url": "https://doi.org/10.20998/2313-8890.2026.09.07", "authors": "A. Lobas", "venue": "Energy saving. Power engineering. Energy audit.", "date": "2026-10-24", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "掲載誌の登録抄録を使用", "preprint": false, "short": true, "p1": "自動化・アルゴリズム化された監査手続きのもとで、監査調書に何を記録すべきかを整理し、アルゴリズム化のリスクを手続きの段階ごとに分類した（抄録）。", "p3": "手続きの目的、データの出所・取得・検証・加工、パラメータ、結果、その後の評価と職業的判断を要素として体系化し、仕訳テストや売上・債権債務・棚卸資産・固定資産の例を示した。KPMG Claraによる仕訳分析も例示した（抄録）。", "p5": "自動生成された出力は監査証拠や職業的判断と同じではなく、入力データから監査人の結論までを追跡できる記録の順序を提案した（抄録）。", "fun": "監査にAIや自動化ツールを使っても、「機械がこう言いました」では証拠になりません。どのデータを、どう加工し、どんな設定で処理したかまで記録しないと、後から誰も確かめられないという指摘は、AI時代の説明責任の基本を教えてくれます。", "unverified": "なし"}}, {"id": "jr40", "rank": 40, "headline": "公共交通企業の財務困窮をGroverとSpringateで比較", "title": "Analisis Komparatif Model Grover dan Springate Dalam Memprediksi Financial Distress Perusahaan Penyedia Transportasi Publik", "url": "https://doi.org/10.31004/joecy.v6i1.5703", "authors": "Adrian Inkostino Hendryadi ほか", "venue": "Journal of Innovative and Creativity (Joecy)", "date": "2026-10-25", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "掲載誌の登録抄録（インドネシア語）を使用", "preprint": false, "short": true, "p1": "ジャカルタの都市鉄道を運営するPT MRT JakartaとPT LRT Jakartaの2020〜2024年の財務困窮の可能性を、GroverモデルとSpringateモデルで比べた（抄録）。", "p3": "両社の年次財務諸表から財務比率を計算し、2つの倒産予測モデルの判定を比較する定量的な比較分析を行った（抄録）。", "p5": "Groverモデルの方がSpringateモデルより財務困窮の状態を正確に予測した（抄録）。", "fun": "地下鉄のような公共交通は、運賃だけでは費用をまかなえず補助金に頼ることが多く、普通の会社と同じ物差しで「倒産しそうか」を測ってよいのかが問題になります。どの物差しが合うかを比べる、という問い自体が面白いところです。", "unverified": "「正確」の判断基準と数値は抄録からは分からない。"}}, {"id": "jr41", "rank": 41, "headline": "売上成長と資本構成が財務困窮に与える影響", "title": "The effect of sales growth and capital structure on financial distress in food and beverage sub-sector companies listed on ISSI in 2021-2024", "url": "https://doi.org/10.52465/josre.v4i2.3", "authors": "Devi Angraini ほか", "venue": "Journal of Student Research Exploration", "date": "2026-10-24", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "掲載誌の登録抄録を使用", "preprint": false, "short": true, "p1": "インドネシアのシャリア株価指数（ISSI）に上場する食品・飲料企業（2021〜2024年）で、売上成長と資本構成が財務困窮に与える影響を分析した（抄録）。", "p3": "35社・140観測のパネルデータ回帰（EViews 13）で、財務困窮をGroverスコアで測った（抄録）。", "p5": "売上成長は財務困窮（Groverスコアで測定）に有意な正の効果、資本構成は有意な負の効果を持ち、両者は同時にも有意だった（抄録）。", "fun": "売上が伸びれば会社は安泰、と思いがちですが、この研究では指標の上で逆の関係が出ています。指標の向き（スコアが高いほど健全か危険か）をどう読むかで結論の意味が変わるため、物差しの定義を確かめる大切さも教えてくれます。", "unverified": "Groverスコアの向きと効果の解釈の詳細は抄録からは確認できない。"}}, {"id": "jr42", "rank": 42, "headline": "航空貨物で期待と知覚のサービス品質が満足を決める", "title": "The Effect of Expected and Perceived Service Quality on Customer Satisfaction: A Case Study in Air Cargo Companies", "url": "https://doi.org/10.30518/jav.1958277", "authors": "Muhammet Pulur ほか", "venue": "Journal of Aviation", "date": "2026-10-25", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "掲載誌の登録抄録を使用", "preprint": false, "short": true, "p1": "航空貨物会社の法人顧客について、期待したサービス品質と知覚したサービス品質がそれぞれ満足に与える影響を、SERVQUALモデルにもとづいて調べた（抄録）。", "p3": "業界の企業からデータを集め、期待と知覚の品質の差が満足度に与える影響を統計的に分析した（抄録）。", "p5": "期待した品質と知覚した品質の両方が顧客満足と有意に関係し、いずれも満足に有意な影響を与えた（抄録）。", "fun": "お客さんの満足は「実際どうだったか」だけでなく「最初にどれくらい期待していたか」にも左右される、という考え方です。期待が高すぎるとがっかりしやすい、という日常の感覚を、企業間の物流サービスで確かめている点が面白いところです。", "unverified": "標本の規模と効果の大きさは抄録からは分からない。"}}, {"id": "jr43", "rank": 43, "headline": "豪州の精神障害による生活障害を2060年まで推計", "title": "Psychosocial disability in Australia: Prevalence, functional severity and population projections to 2060 from repeated cross-sectional population surveys", "url": "https://doi.org/10.1177/00048674261489139", "authors": "Kuo-yi Jade Chang ほか", "venue": "Australian and New Zealand Journal of Psychiatry", "date": "2026-10-25", "sjr": 1.522, "citescore": 8.3, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "掲載誌の登録抄録を使用", "preprint": false, "short": true, "p1": "重い精神疾患による生活上の障害（精神社会的障害）を、診断名ではなく機能の制限にもとづいて推定し、オーストラリアの有病率と2060年までの人数を予測した（抄録）。", "p3": "全国代表の障害・高齢・介護者調査4波（2009、2012、2015、2018年）を、国際生活機能分類（ICF）に沿って分析し、年齢・性別の有病率を3つの人口シナリオに当てはめた（抄録）。", "p5": "有病率は各波で1.0%と安定し、人数は約19万6,600人（2009年）から約24万3,800人（2018年）に増えた。中位シナリオでは約27万4,000人（2025年）から約41万人（2060年、+50%）、最重度は約2倍（+92%）になる（抄録）。", "fun": "病気の「名前」ではなく、日常生活でどれだけ困っているかで数えると、支援の計画に使える数字になる、という発想の転換が面白い点です。割合は変わらなくても人口が増え、特に重い人が倍近くになるという予測は、福祉の備えを考える材料になります。", "unverified": "なし"}}, {"id": "jr44", "rank": 44, "headline": "健康の誤情報の負担は不平等に分布する", "title": "Unequal Burdens of Health Misinformation: Disparities in Exposure, Susceptibility, and Outcomes", "url": "https://doi.org/10.1007/s40615-026-03163-z", "authors": "Jason T. Tsichlis ほか", "venue": "Journal of Racial and Ethnic Health Disparities", "date": "2026-10-24", "sjr": 1.255, "citescore": 7.1, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "掲載誌の登録抄録を使用（叙述的レビュー）", "preprint": false, "short": true, "p1": "健康に関する誤情報への曝露・影響の受けやすさ・結果が、人種・社会経済的地位・言語・デジタルアクセス・健康リテラシーによって不平等に分布していることを、叙述的レビューで整理した（抄録）。", "p3": "実証・理論・政策の文献を統合し、集団ごとの曝露、受けやすさ、結果のパターンを特徴づけた（抄録）。", "p5": "誤情報はワクチンの忌避、受診の遅れ、不安や抑うつの増加、医療機関への信頼の低下につながる。正誤訂正・事前の反駁・メディアリテラシーなどは特定の誤信念の訂正に最も強い証拠がある一方、行動の持続的な変化への効果の証拠は限られる（抄録）。", "fun": "うそのニュースは誰にでも同じように届くわけではなく、言葉の壁や情報への不信が重なる人ほど影響を受けやすい、という指摘です。間違いを正す方法は「信じていること」を変えても「行動」まではなかなか変えられない、という点も考えさせられます。", "unverified": "なし"}}, {"id": "jr45", "rank": 45, "headline": "デジタル文化が看護の内省とケアを損なう仕組み", "title": "Digital Culture, Reflexivity and Care Erosion in Nursing: A Conceptual Model of Reflexive Dissonance Failure", "url": "https://doi.org/10.1111/jan.70799", "authors": "Robert Batterbee ほか", "venue": "Journal of Advanced Nursing", "date": "2026-10-24", "sjr": 1.314, "citescore": 7.0, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "掲載誌の登録抄録を使用（討論論文）", "preprint": false, "short": true, "p1": "デジタル環境が看護師の内省する力と職業的価値観に作用し、ケアが損なわれていく一つの経路を説明する概念モデル「内省的不協和の失敗（RDF）」を提案した（抄録）。", "p3": "看護学・心理学・社会学・倫理学・デジタルメディア研究の文献を目的的に選んで批判的に統合し、効果の推定ではなくモデルの導出と検討を行った（抄録）。", "p5": "認知的不協和を倫理的な警告信号ととらえ、それが抑えられたり否認・正当化で処理されたりすると、道徳的な関与の放棄やケアの低下につながりうるとした。ただし看護での直接の因果的証拠は限られ、検証可能なモデルとして提案している（抄録）。", "fun": "「何か変だな」と感じる心の引っかかりは、実は倫理のブレーキとして大事な役割を持つ、という考え方が面白い点です。SNSなどの情報環境がそのブレーキを弱めるかもしれない、という仮説を、確かめられる形で示しています。", "unverified": "実証データは含まれていない（概念モデル）。"}}, {"id": "jr46", "rank": 46, "headline": "大学の倫理的リーダーシップは創造性の両刃の剣", "title": "“Empowerment” or “Burden”? A Study on the Double-Edge
