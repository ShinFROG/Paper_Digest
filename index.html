<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

lliance Rupture and Repair in Simulating Cognitive Behavioral Therapy Dialogues", "url": "https://arxiv.org/abs/2611.27544", "authors": "Jian Chai ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"id": "pr45", "rank": 45, "headline": "汎用LLMのキャリア助言は本人の主体性を損ねやすい", "title": "Gender and Agency in AI Career Guidance for Women: A Socio-Technical Audit of General-Purpose Language Models", "url": "https://doi.org/10.31234/osf.io/2hbe4", "authors": "Sara Portell Fonolla ほか", "venue": "PsyArXiv", "date": "2026-11-23", "theme": "LLM熟議・ペルソナ", "theme_no": 5}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "エージェント型AIへの曝露が高い企業ほど求人が減る", "title": "The Rise of Agents and the Human Labor Market", "url": "https://arxiv.org/abs/2611.27210", "authors": "Nicola Borri ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "why": "OpenRouterの約2,000兆トークンの利用実績（うちエージェント用途1,100兆）と米国上場企業の求人3,480万件を結び、株価とエージェント型AIの利用量の連動から企業の曝露を測った。曝露が1標準偏差高い企業は、求人の伸びが半年で2.11%、9か月で3.20%低い。Claude Code 2.0の公開を使ったイベント分析でも同じ向きの結果で、減少は上級職以外に集中する。"}, {"id": "pn02", "rank": 2, "field": "機械学習", "headline": "多流の残差接続の混ざり具合を幾何学的な収縮で調整", "title": "cmHC: Balancing Stream Mixing in Hyper-Connections via Geometric Contraction", "url": "https://arxiv.org/abs/2611.27193", "authors": "Haowei He ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-23", "why": "残差接続を複数の流れに広げるmHCで、流れを混ぜる行列が二重確率行列の多面体の頂点に寄ると流れが独立に、中心に寄ると区別がつかなくなるというトレードオフを理論的に示した。多面体を内側へ幾何学的に縮めるcmHCを提案し、新しいパラメータ化なしで混合の下限を保証する。Hugging Faceの注目論文で今日最も票を集めた。"}, {"id": "pn03", "rank": 3, "field": "統計学", "headline": "事前学習済みモデル1回の計算で効率的な統計的推論", "title": "Can pretrained Transformers deliver semiparametrically efficient inference?", "url": "https://arxiv.org/abs/2611.27666", "authors": "Han Yan ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "why": "セミパラメトリックモデルの推定では、推定対象ごとの影響関数の補正と局外母数の推定が必要だった。真の母数だけをラベルに模擬データで事前学習したTransformerが事後平均と共分散を学び、1回の順伝播で推定値とワルド型の信頼領域を返すことを示し、効率性と被覆の漸近的な正確さを証明した。因果推論・部分線形回帰・生存時間解析で実験している。"}, {"id": "pn04", "rank": 4, "field": "因果推論", "headline": "段階導入の差の差法の推論は有効クラスター数しだい", "title": "How Reliable is Inference in Staggered Difference-in-Differences?", "url": "https://doi.org/10.2139/ssrn.7723858", "authors": "Xing Hu ほか", "venue": "SSRN", "date": "2026-11-23", "why": "ファイナンスの上位3誌の2010〜2025年の論文を全数調査し、異質性に頑健な推定量の利用は増えたが有限標本の補正はほとんど使われていないことを示した。推論の信頼性は標本の特徴と推定量の選択で決まる「有効クラスター数」の範囲で評価でき、それに応じて推論方法を変えると誤った棄却が減り、公刊された結果の結論が変わる例もある。"}, {"id": "pn05", "rank": 5, "field": "経済学", "headline": "自動化の成長加速は人が担う「弱い環」に抑えられる", "title": "Past Automation and Future AI: How Weak Links Tame the Growth Explosion", "url": "https://doi.org/10.3386/w36050", "authors": "Charles I. Jones ほか", "venue": "NBER Working Paper", "why": "タスクベースの成長会計で、米国では資本が担うタスクの生産性が労働のそれより年約5ポイント速く伸びてきたことを示した。この歴史的な値で、財とアイデアの生産が内生的に自動化される成長モデルを較正すると、成長は加速し発散もしうるが、労働に残るタスク（弱い環）が加速を遅らせる。AIによる成長の見通しを過去の自動化の実績から規律づける。"}, {"id": "pn06", "rank": 6, "field": "組織行動・心理的安全性", "headline": "AIの相棒を2体に増やすと人のアイデア投稿が減る", "title": "Adding One More Agent: How AI Team Size and Formation Shape Productivity and Diversity in Human-AI Brainstorming Teams", "url": "https://arxiv.org/abs/2611.26663", "authors": "Rong-Ching Chang ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "why": "ブレインストーミング実験（168人）で、AIの相棒の数（1体か2体）と振る舞いの作り方（平均的な人に合わせるか、参加者が調整するか）を組み合わせ、人どうしの組と比べた。AIが2体の部屋は共有ボードへの投稿総数が増えたが、人が書いたアイデアは大きく減った。AIの雑談は人の投稿を増やし、AIの投稿量は減らす関連があり、1体での結果は複数体のチームに一般化できない。"}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "事前登録した仮説の58%は8〜9年後も結果が非公開", "title": "Beyond Publication Bias: Characterizing and Understanding Missing Results in Economics", "url": "https://doi.org/10.3386/w36044", "authors": "Fernando Hoces de la Guardia ほか", "venue": "NBER Working Paper", "why": "AEAのRCT登録簿に2015〜2017年に登録された317研究・5,057仮説を追跡し、結果が公開されているのは42%にとどまること、公開された結果の64%は帰無で、帰無の結果がとくに欠けている証拠は乏しいことを示した。著者への直接の働きかけを無作為に割り当てる実験では、公開の割合が6.2ポイント上がった。出版バイアスとは別の「未報告」の大きさを仮説単位で測った。"}, {"id": "pn08", "rank": 8, "field": "機械学習", "headline": "重みの直接書き換えで文脈内学習を再現し微調整に並ぶ", "title": "Weight-Space Programming Writes In-Context Learning and Matches Fine-Tuning in Language Models", "url": "https://arxiv.org/abs/2611.26841", "authors": "Konstantinos Skianis ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "why": "最先端の言語モデルが別のモデルの重みを勾配降下なしで読み書きする「重み空間プログラミング」で、例示から重みの更新を作り、プロンプトに例がなくても課題を解かせられるかを6課題・4つの編集モデル・3系統の弱いモデルで調べた。多くの場合、文脈内学習の課題ベクトルに当たる残差が重みに書き込まれ、精度は文脈内学習やLoRAを含む微調整に並んだが、言い回しの変化には弱い。"}, {"id": "pn09", "rank": 9, "field": "統計学", "headline": "高次元のガウス近似に越えられない次元の壁を証明", "title": "A sharp dimension barrier for uniform Gaussian approximations", "url": "https://arxiv.org/abs/2611.27777", "authors": "Anders Bredahl Kock", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "why": "n個の独立同分布のd次元ベクトルに基づくガウス近似が、座標ごとのm次モーメントが有界な分布族と全ての超直方体に一様に成り立つには、log d = o(n^((m−2)/(3m−2))) が必要であることを示した。乱択を含むどんな統計量にも当てはまり、座標の最大値だけでも成り立つ。2<m≤4では分位点でウィンザー化した平均がこの条件で近似を達成するので、壁は最良である。"}, {"id": "pn10", "rank": 10, "field": "因果推論", "headline": "部分識別のもとでデータに条件づけてよい条件を特定", "title": "Partially Identified Ambiguity", "url": "https://arxiv.org/abs/2602.07634", "authors": "Cheaheon Lim", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "why": "部分識別のもとの頑健ベイズ分析で、データに条件づけたガンマ・ミニマックス基準を使ってよいかという規範的な問いを扱う。この基準が、合理的期待の性質を集合値に拡張した「オーマン妥当性」を破りうることを示し、妥当性が成り立つのは事前分布の集合が「部分識別された曖昧さ」を持つとき、かつそのときに限ることを証明した。"}, {"id": "pn11", "rank": 11, "field": "機械学習", "headline": "誤りだらけの教師データでも強化学習が推論を立て直す", "title": "Reinforcement Learning Unlearns Corrupted SFT Reasoning", "url": "https://arxiv.org/abs/2611.26756", "authors": "Anika Misra ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "why": "算数の推論データ（GSM8K）の教師データを361通りに壊し（誤りの種類・位置・割合を最大100%まで変化）、教師あり微調整だけでは精度が43.61%から13.80%に落ちるのに、GRPOによる強化学習が約60%まで戻すことを示した。3行の形だけの誤った解答8件で初期化すると69.30%に達し、正しい教師データでの初期化（60.71%）を上回る。"}, {"id": "pn12", "rank": 12, "field": "ヒューマンコンピュータインタラクション", "headline": "人とAIの協働は「協調の連続性」の維持が鍵", "title": "Shared Understanding in Human-AI Teams: Coordination Continuity in Evolving Work", "url": "https://arxiv.org/abs/2611.27746", "authors": "Si\\^an Lindley ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "why": "人がAIエージェントと長く非同期に働く場面では、情報を共有していても行動の前提が共有されているとは限らない。協働者が相互依存的な行動の土台を保てている度合いを「協調の連続性」と名づけ、2つの質的なチーム研究と自らの事例から、持続する表現・協調の性質・相互作用の仕組みの3要素の枠組みと、協働AIの基盤に向けた8つの設計上の示唆をまとめた。"}, {"id": "pn13", "rank": 13, "field": "政治学", "headline": "政権100日で民主主義の規範への期待が低下", "title": "Democratic Norm Erosion in the Wake of the 2024 US Election", "url": "https://doi.org/10.2139/ssrn.7722698", "authors": "William Brown ほか", "venue": "SSRN", "date": "2026-11-23", "why": "民主主義の安定は個人の価値観だけでなく、他の人も民主主義を守るはずだという相互の期待（規範）に支えられる。報酬つきの協調ゲームをパネル調査に組み込み、トランプ政権2期目の最初の100日で、共和党支持者は仲間が非民主的な慣行に反対しなくなると、民主党支持者は仲間が無礼に反対しなくなると予想するようになったことを示した。本人の民主主義への支持には変化が見られなかった。"}, {"id": "pn14", "rank": 14, "field": "工学", "headline": "40の探索エージェントの群れで力学クロークを設計", "title": "A Metamaterial Agentic Swarm: Coordinated Search for Discrete Mechanical Design", "url": "https://arxiv.org/abs/2611.26743", "authors": "Achuth Chandrasekhar ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "why": "単位セルの選び方が全体の弾性応答を決める離散メタマテリアルの設計に、大域サンプリング・変異・学習・組み換えなど役割の違う40の数値探索エージェントを5つの島に分けて協調させる方法を提案した。画素単位の力学クロークで外部の変位の不一致を有限要素計算で評価し、最小の損失0.100590（比較のしきい値0.1102を8.72%下回る）を得たが、3回のうち2回はしきい値に届かなかった。"}, {"id": "pn15", "rank": 15, "field": "経営学", "headline": "オープンバンキングはフィンテックの利用を押し上げる", "title": "Open Banking and Competition in Banks and Fintech: Evidence from Mobile Apps *", "url": "https://doi.org/10.2139/ssrn.7727160", "authors": "Xinchen Ma", "venue": "SSRN", "date": "2026-11-23", "why": "フィンテックアプリのソースコードから独自のデータを作り、同じアプリの中で国ごとにオープンバンキングの利用可否が違うことを使って効果を識別した。オープンバンキングはアプリの利用と成績を有意に高め、効果はデータ集約的なアプリ、新興企業、コロナ禍で大きい。影響を強く受けた既存銀行は貸出と収益が減り、手数料の強化と効率化で応じた。"}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "財政調整の予想は人々の「メンタルモデル」で分かれる", "title": "Mental Models of Fiscal Policy", "url": "https://doi.org/10.3386/w36043", "authors": "Francesco Bianchi ほか", "venue": "NBER Working Paper", "why": "13か国・27,000人超の調査で、財政状況の認識、増税・歳出削減の予想、その理由の自由記述を同時に集め、理由を経済的なメンタルモデル・政治的な物語・経験則に分類した。同じ財政状況を報告する人でも、経済的なモデルで考える人は調整を強く予想し、経験則の人は弱く予想する。無作為化実験では、財政情報が経済的な推論を増やした。"}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "低排出ゾーンは「最大か、やらないか」が最適", "title": "Designing Low Emission Zones: Theory and Evidence", "url": "https://doi.org/10.3386/w36037", "authors": "Nano Barahona ほか", "venue": "NBER Working Paper", "why": "汚染車を締め出す低排出ゾーンは価格手段と違い利用を非効率に割り当てるため、厚生がゾーンの広さについて準凸になり、できるだけ広くするか導入しないかのどちらかが最適になることを理論で示した。マドリードの新車購入データでは、買い手はクリーンな車に移ったが、乗り換えた人と規制車の利用者の余剰の損失が排出削減の便益を上回った。"}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "住宅と保険の価格は気候リスクを十分に伝えていない", "title": "Climate Risk, Real Estate, and Property Insurance", "url": "https://doi.org/10.3386/w36051", "authors": "Benjamin L. Collier ほか", "venue": "NBER Working Paper", "why": "気候リスクが不動産価格と保険料に正しく反映され、家計がその信号に反応しているかを、急速に増える研究から検討したレビュー。気候リスクから価格に至る各段階に大きな摩擦があり、適応と復旧に影響していると結論する。"}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "OPECの市場支配力の厚生損失を他の歪みと分けて測る", "title": "Beyond the First Best: Welfare and OPEC Market Power", "url": "https://doi.org/10.3386/w36058", "authors": "John Asker ほか", "venue": "NBER Working Paper", "why": "カルテルの市場支配力による厚生損失を、他の歪みの存在を認めたうえで測る枠組み（限界と限界内の損失）を提案した。費用と生産のミクロデータによると、単純な計算では1970年以降のOPECによる損失は2.2兆ドルだが、カルテル外の費用最小化の違反を除くと約0.7兆ドルに縮む。"}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "明代の官僚的な補給制度が戦闘の勝率を下げた", "title": "Bureaucratic Rigidity and Battle Outcomes: Evidence from Military Logistics in the Ming Dynasty", "url": "https://doi.org/10.3386/w36049", "authors": "Jingjing Chen ほか", "venue": "NBER Working Paper", "why": "1492年の明朝の改革で、軍の穀物輸送が塩商人から府ごとに引き継ぐ国営の中継制に移った。改革後、商人が補給していた駐屯地で補給不足が増え、406の防衛戦の分析でその近くの勝率が下がった。影響は長期戦や城郭の防衛、経路が多くの府をまたぐ場合に大きく、説明責任のための規則が国家の実効性を損なう例を示す。"}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "組合の交渉力強化は競合企業の賃金も引き上げる", "title": "Outside Options and Collective Bargaining Spillovers", "url": "https://doi.org/10.2139/ssrn.7321918", "authors": "Luis de Azevedo Gomes ほか", "venue": "SSRN", "date": "2026-11-23", "why": "ブラジルで一部の企業の組合交渉を強めた改革を使い、労働者の転職ネットワークから競合する雇用主を特定した。直接影響を受けた企業は賃金と組合交渉による福利を上げ、競合企業も賃金をその4分の1ほど上げた。波及は組合の働きかけではなく、採用競争への雇用主の反応による。"}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "米国の資本市場は1890年までにほぼ全国統合", "title": "The Emergence of a National Capital Market,1870–1940", "url": "https://doi.org/10.3386/w36040", "authors": "Pawel Janas", "venue": "NBER Working Paper", "why": "1870〜1940年の生命保険会社の10万件超の保有資産を地理情報つきで記録した長期データを作った。1880〜1890年に債券の投資先までの平均距離は2倍以上になり、本拠州の比率は半分超から4分の1未満に下がった。統合は1890年までにほぼ終わっていた。"}, {"id": "pn23", "rank": 23, "field": "機械学習", "headline": "動画の世界モデルが物体をすり抜けないようにする", "title": "Non-penetrating World Models", "url": "https://arxiv.org/abs/2611.27963", "authors": "Yuhang Dai ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-23", "why": "対話型の動画世界モデルが障害物をすり抜けてしまう問題を評価するベンチマークNoPeBenchを作り、公開モデルはどれも確実には防げないことを示した。一方、拡散Transformerの隠れ状態はすり抜けを予測できる情報を持っており、小さな予測ヘッドで危険な操作を安全な操作に置き換えると、違反率が6モデル平均で74%から16%に下がった。"}, {"id": "pn24", "rank": 24, "field": "機械学習", "headline": "拡散言語モデルCloverがエージェント評価で首位", "title": "Clover-35B-A3B-Preview Technical Report", "url": "https://arxiv.org/abs/2611.24636", "authors": "DiffuSpace Technical Team", "venue": "Hugging Face Daily Papers", "date": "2026-11-23", "why": "総パラメータ350億・稼働30億の混合エキスパート型の拡散言語モデルClover-35B-A3B-Previewの技術報告。過去の文脈の再帰的な記憶と、現在のブロック内の双方向注意を組み合わせる。評価した7つのエージェント指標で首位（SWE-bench Verified 73.6など）で、生成速度は1 GPUで毎秒680トークンと報告している。"}, {"id": "pn25", "rank": 25, "field": "機械学習", "headline": "注釈なしの動画から先読みの推論を自己蒸留で学ぶ", "title": "Learning Video Foresight Reasoning from Unlabeled Videos via On-Policy Self-Distillation", "url": "https://arxiv.org/abs/2611.26954", "authors": "Jingchen Sun ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-23", "why": "動画の続きや次の行動を予測する推論を、注釈や外部の大規模モデルなしで、過去と未来の動画の組を自己教師の信号にして学ぶ枠組みFuture-OPSDを提案した。未来の情報のうち意思決定に効く部分を選ぶ「先読みスコア」を定義し、その扱える下界を最適化する。"}, {"id": "pn26", "rank": 26, "field": "機械学習", "headline": "記憶を圧縮し必要時に復元する言語モデルの新構造", "title": "MemOnce: A Scalable Memory Architecture for Large Language Models", "url": "https://arxiv.org/abs/2611.27973", "authors": "Chang Nie ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-23", "why": "長い対話で過去の状態を再利用するために、最終層の隠れ状態の一部だけを小さな記憶として保持し、必要なときに注意層のKVキャッシュへ復元する構造MemOnceを提案した。関連する記憶だけを疎に検索し、GPUメモリを大きく減らして線形時間の計算量を達成する。"}, {"id": "pn27", "rank": 27, "field": "機械学習", "headline": "検索を事前学習の段階から教える言語モデル", "title": "Search From the Start: Search-Native Pretraining for Language Models", "url": "https://arxiv.org/abs/2611.26809", "authors": "Kaustubh Ponkshe ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-23", "why": "検索の能力を後段の調整ではなく事前学習で教えるため、事前学習コーパスに検索クエリと検索結果を大規模に差し込む方法を提案した。3.6億〜33億パラメータの規模で、知識を要する課題の成績と、検索された証拠への従いやすさが向上し、その優位は教師あり微調整の後も残った。"}, {"id": "pn28", "rank": 28, "field": "機械学習", "headline": "LLMの座標軸は完全に任意ではなく部分的に共通", "title": "Partially canonical axes in large language model representations", "url": "https://arxiv.org/abs/2611.26920", "authors": "Andrea Gregor de Varda ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "why": "LLMの内部表現の個々の座標軸は任意だという通念を検証した。6系統12モデルで、元の座標軸は、同じ幾何を保ってランダムに回転した軸よりも、他のモデルの表現、言語に対する人の脳の応答、解釈可能な言語特徴とよく揃っていた。ただし最良の整合には届かず、軸は「部分的に正準」である。"}, {"id": "pn29", "rank": 29, "field": "機械学習", "headline": "言語モデルは推論を左右した語を自覚していない", "title": "Do Language Models Know Which Words Steer Their Reasoning?", "url": "https://arxiv.org/abs/2611.27317", "authors": "Yanbei Jiang ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "why": "文脈から1語ずつ除いて次の語の分布の変化を測る方法で、意味上は無関係な語が思考の連鎖を強く動かす現象を見つけ、同じモデルに尋ねるとその語の関連を否定することを4モデル・3ベンチマークで示した。影響が大きいのにモデル自身が無関係と判定した語のKVキャッシュを消して解き直す対策も提案する。"}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "分散が無限でも最適な線形回帰の誤差率を達成", "title": "Optimal Linear Regression Without a Variance", "url": "https://arxiv.org/abs/2611.27983", "authors": "Artin Tajdini ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "why": "回帰の雑音が1<α<2のα次モーメントしか持たない（分散が無限の）場合の線形回帰で、有限分散用の手法を弱いモーメント用に変換するブラックボックスの還元を与えた。αや雑音の大きさを知らなくても、高い確率で ((d+log(1/δ))/n)^((α−1)/α) の速さの誤差を達成し、対応するミニマックス下界も示した。"}, {"id": "pn31", "rank": 31, "field": "統計学", "headline": "過去の実験を縮小推定で借りて処置効果の精度を上げる", "title": "Combining Past Experimental Data for Efficient Estimation: A Shrinkage Approach", "url": "https://arxiv.org/abs/2611.27655", "authors": "Qianxi Zhang ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "why": "企業に蓄積された過去の無作為化実験は、介入が少しずつ違うため偏りがある。偏りと分散が既知なら、偏った実験を1つ借りるだけでも平均二乗誤差が必ず下がることを示し、実際に使える3つの縮小推定量と、補助実験の数が増えるときの漸近的な性質を導いた。偏りのばらつきが推定量に有利にも不利にも働くことを示す。"}, {"id": "pn32", "rank": 32, "field": "統計学", "headline": "較正データが少ないときの共形検定の乱択を整理", "title": "Smoothed Conformal Testing with Small Calibration Sets", "url": "https://arxiv.org/abs/2611.27315", "authors": "Mingzhou Deng ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "why": "較正標本が小さいと分割共形法のp値は粗い格子の値しか取れない。同順位のブロックごとの独立な乱択は交換可能性のもとで厳密に妥当で、BH法による偽発見率の制御も成り立つことを証明した。一方、並べ替えた乱数をスコアの順に割り当てる方法は、単一のp値の妥当性さえ壊しうることを示した。"}, {"id": "pn33", "rank": 33, "field": "統計学", "headline": "構造の情報が最適輸送の推定をいつ改善するかを特定", "title": "Semiparametric Efficiency for Entropic Optimal Transport under Structured Distribution Shift", "url": "https://arxiv.org/abs/2611.27261", "authors": "Yiming Ma ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "why": "指数型の密度比モデルのもとでのエントロピー正則化つき最適輸送の推定について、構造の制約による分散の利得を射影の恒等式で厳密に求めた。プールした経験尤度推定量が制約つきの効率限界を達成するが、モデルが正しくても利得がゼロになる場合があることを示した。"}, {"id": "pn34", "rank": 34, "field": "統計学", "headline": "補助変数も欠測する場合の条件付き平均の識別条件", "title": "Estimating conditional means under missingness-not-at-random with incomplete auxiliary variables", "url": "https://arxiv.org/abs/2611.26891", "authors": "Maya B. Mathur ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "why": "欠測が無作為でない（MNAR）場合に、補助変数自体が不完全だとMARの仮定は回復しない。MARに基づく汎関数が正しくなるための、MARより弱い必要十分条件を導き、不完全な補助変数について周辺化する別の識別汎関数とその十分条件を提案した。"}, {"id": "pn35", "rank": 35, "field": "経営学", "headline": "東独からの発明者の流入が西独の特許を長期に押し上げた", "title": "Migration and innovation: the impact of East German investors on West Germany's technological development", "url": "https://econpapers.repec.org/RePEc:ehl:lserod:141605", "authors": "Bergeaud ほか", "venue": "RePEc NEP", "date": "2026-11-23", "why": "第二次大戦後からベルリンの壁の建設（1961年）までの東から西ドイツへの大規模な移住について、1世紀分の特許と発明者のデータと、姓の近さに基づく識別戦略で発明者の移動を追跡した。東独の発明者が多く流入した地域では特許が有意かつ持続的に増え、化学と物理が中心だった。"}, {"id": "pn36", "rank": 36, "field": "経営学", "headline": "大作の参入に無料ゲームは保守的な更新で応じる", "title": "Competition and Innovation in Digital Markets: Empirical Evidence from the Steam Platform", "url": "https://doi.org/10.2139/ssrn.7726238", "authors": "Evyatar Ben Zion Segal", "venue": "SSRN", "date": "2026-11-23", "why": "Steamの17,290タイトルの週次パネル（2016〜2026年）と全更新記録で、上位10%の大作の参入が既存の開発者の更新を増やすかを積み上げ型の差の差法で調べた。頑健な結果は量ではなく構成の変化で、無料ゲームは有料ゲームに比べて定常的な技術保守の更新に有意に寄った。"}, {"id": "pn37", "rank": 37, "field": "経営学", "headline": "AI動画の生成料金と広告分配の最適な組み合わせ", "title": "Generation Pricing and Creator Incentives on AI Video Platforms", "url": "https://doi.org/10.2139/ssrn.7727001", "authors": "Guoming Lai", "venue": "SSRN", "date": "2026-11-23", "why": "AI動画の場は、生成そのもので利益を取るか、完成した動画の広告で支えるかを決める必要がある。トークン価格・クリエイターへの広告分配・計算資源を選ぶモデルで、品質を上げるのに要するトークンの増え方が閾値を決め、条件によっては生成を赤字で提供するのが最適になることを示した。"}, {"id": "pn38", "rank": 38, "field": "経営学", "headline": "調査の参加者プールの働き手は弱い立場に置かれている", "title": "The Other Side of Prolific: Ethical Research Guidelines Based on a Mixed Methods Investigation of Prolific Platform Workers’ Experiences", "url": "https://doi.org/10.31234/osf.io/t5j8w", "authors": "Louis Bachaud ほか", "venue": "PsyArXiv", "date": "2026-11-23", "why": "研究参加者の募集サイトProlificの働き手について、掲示板の質的分析と455人の調査から労働条件を調べた事前登録の混合研究。働き手どうしの競争、社会的保護の欠如、組織化の難しさにより、研究者に対して不利な力関係にあることを示し、働き手側の不正の証拠も報告して、倫理的な研究の指針を提案する。"}, {"id": "pn39", "rank": 39, "field": "組織行動・心理的安全性", "headline": "初回の資金調達の年に経営陣の新任が12ポイント増える", "title": "Who Joins When Investors Arrive? Team Changes around Every Funding Round", "url": "https://doi.org/10.2139/ssrn.7721318", "authors": "Raffaele Mancuso", "venue": "SSRN", "date": "2026-11-23", "why": "欧州の新興企業25,766社・65,941回の資金調達を会社登記の役員記録と結び、同じ時期に株式調達のない同世代の企業と比べた。初回の株式調達の年に、新しい取締役か経営者を任命する確率は32%から12.2ポイント上がり、他社で経営経験のある幹部の採用も増えた。加わる人の多くは投資家の関係者ではなかった。"}, {"id": "pn40", "rank": 40, "field": "組織行動・心理的安全性", "headline": "所属感には「条件つき」と「信頼できる」の2種類がある", "title": "From Contingent to Trustworthy Belonging: A Neurobiological Account of Professional Identity Formation", "url": "https://doi.org/10.35542/osf.io/qjh7m", "authors": "Kevin McMains", "venue": "EdArXiv", "date": "2026-11-23", "why": "医師の職業的アイデンティティの形成で、所属感を1つの量として扱ってきた従来の見方に対し、成果で稼ぎ続けなければならない「条件つきの所属」と、当てにできる「信頼できる所属」を区別する理論的な論考。愛着の神経科学などをもとに、両者は脅威の処理と調整の負担が違うと論じる。"}, {"id": "pn41", "rank": 41, "field": "組織行動・心理的安全性", "headline": "技術・管理・対話の適合でリーダー候補を順位づけ", "title": "Leader Finding: A New Variation of Expert Finding in Community Question Answering", "url": "https://arxiv.org/abs/2611.26921", "authors": "Sepideh Entezari Maleki ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "why": "専門家探索を拡張し、プロジェクトとチームを与えるとリーダー候補の順位を返す問題を定式化した。技術的な適合、管理の知識、チームとの対話を確率的な枠組みで組み合わせ、Stack Overflowから作った2つの大きなデータで、最良の構成は最強のベースラインのNDCG@10を2倍以上にした。"}, {"id": "pn42", "rank": 42, "field": "因果推論", "headline": "街灯のLED化は睡眠の困難をすぐに減らす", "title": "Light Pollution: Effects on Sleep, Work, and Mental Health", "url": "https://doi.org/10.3386/w36060", "authors": "Joan Costa-i-Font ほか", "venue": "NBER Working Paper", "why": "カナダのバーナビー市でナトリウム灯をLEDに替えたことを使い、替えなかったバンクーバーとの市境での不連続、市内の段階的な導入、対応させた地区の差の差法の3つの設計で効果を推定した。睡眠の困難はすぐに減り、精神的健康・欠勤・身体活動の改善は2〜3年遅れて現れ、暖色のLEDで効果が最大だった。"}, {"id": "pn43", "rank": 43, "field": "工学", "headline": "剛性と感度を同時に予測し位相最適化を高速化", "title": "Physically Constrained Problem-Independent Machine Learning (PIML) for Joint Prediction of Condensed Stiffness and Compliance Sensitivities in Topology Optimization", "url": "https://doi.org/10.20944/preprints202611.2091.v1", "authors": "Lijie Liu ほか", "venue": "Preprints.org", "date": "2026-11-23", "why": "部分構造の縮約剛性を機械学習で予測するだけでは、コンプライアンスの更新に必要な単調な感度が保証されない。剛性と要素感度を同時に予測し、非負のエネルギー配分で両者を結ぶ方法を提案した。100万要素超の2次元の4例で最大10.57倍、3次元の2例で192〜261倍の高速化を得て、最終コンプライアンスの差は0.56%未満だった。"}, {"id": "pn44", "rank": 44, "field": "工学", "headline": "観測が足りない条件で浮上式車両の電磁石の異常を特定", "title": "A Study on Time-Varying Gain Inversion and Fault Detection Methods for Suspension Electromagnets in Maglev Trains under Under-determined Observation Conditions", "url": "https://doi.org/10.21203/rs.3.rs-11647133/v1", "authors": "Haining Liu ほか", "venue": "Research Square (In Review)", "date": "2026-11-23", "why": "磁気浮上車両の浮上系で、パワーアンプのゲイン異常を、雑音が多く観測が不足する多チャンネルの条件で見つける方法。電磁力の単調性を課した疎な記号回帰、スチューデントのt尤度による頑健なベイズ逆解析、低ランクと疎の分解を組み合わせ、16チャンネルの模擬でF1スコア0.922、偽陽性率1.46%を得た。"}, {"id": "pn45", "rank": 45, "field": "工学", "headline": "舗装試験の土圧計が応力を低く示す原因を有限要素で検討", "title": "Why Do Embedded Earth Pressure Cells Under-Register Subgrade Stresses in Accelerated Pavement Tests? A Finite Element Study of Cell–Soil–Box Interaction at the ALT-LIRA Facility", "url": "https://doi.org/10.20944/preprints202611.1966.v1", "authors": "Silviu-Cristian Iriciuc ほか", "venue": "Preprints.org", "date": "2026-11-23", "why": "円形の促進舗装試験施設で、路床の土圧計が計算値の10〜65%しか示さなかった原因を、土圧計・鋼製の箱・周囲の土の相互作用の軸対称有限要素モデル（489ケース）で調べた。硬い土圧計はむしろ高めに出るため、低い読みは柔らかい土圧計、箱の周りの緩い埋め戻し、受圧面の前の軟らかい層がある場合に限って再現された。"}, {"id": "pn46", "rank": 46, "field": "政治学", "headline": "新聞がAIを遮断すると有権者には党派の文章が届く", "title": "When Newspapers Block AI, Who Speaks to Voters? A Game-Theoretic Model of a Business Standoff with Political Externalities", "url": "https://econpapers.repec.org/RePEc:osf:socarx:8m6he_v1", "authors": "Miyazaki, Sho", "venue": "RePEc NEP", "date": "2026-11-23", "why": "大手新聞がAIのクローラーを遮断し、政党や党派的なサイトが文章を開放している状況をゲーム理論で分析した。情報源を選別できないAIは読める文章を混ぜ合わせ、説得者は安い文章を大量に流す。新聞の遮断が長いほどその読者は偏った回答を長く聞くことになり、政治的な意図のない事業上の判断がAIの回答の傾きを決めることを示す。"}, {"id": "pn47", "rank": 47, "field": "政治学", "headline": "固定資産税の不服申立てに党派の差はほとんどない", "title": "Are Republicans and Democrats Different Taxpayers? Evidence From Property Tax Appeals", "url": "https://doi.org/10.3386/w36055", "authors": "Brad C. Nathan ほか", "venue": "NBER Working Paper", "why": "米国人は共和党支持の住宅所有者のほうが固定資産税の不服申立てをしやすいと考えているが、ダラス郡の課税記録と投票記録を結ぶと、申立て率の党派差は0.29ポイントと小さかった。準実験と現場実験でも申立ての動機は似ており、税政策への意見の違いは納税者としての行動の違いに表れていない。"}, {"id": "pn48", "rank": 48, "field": "ヒューマンコンピュータインタラクション", "headline": "会話中の表情と声を気づかれずに変える実験基盤", "title": "Covert control over the real-time dynamics of human interactions with Ducksoup", "url": "https://doi.org/10.31234/osf.io/5jbs2", "authors": "Pablo Arias Sarah ほか", "venue": "PsyArXiv", "date": "2026-11-23", "why": "ビデオ会議の参加者の顔と声を会話の途中でAIのフィルターで実時間に変換し、同期した記録から多モーダルの時系列を取り出せる研究用の基盤Ducksoupを紹介する。事前登録した実験（64人）で、参加者の笑顔を人工的に揃えると互いの楽しさが増し、操作は気づかれなかったという実験室の知見をオンラインで再現した。"}, {"id": "pn49", "rank": 49, "field": "ヒューマンコンピュータインタラクション", "headline": "教師は外部の基準で確かめられる作業だけAIに任せる", "title": "Standard-Anchored Delegation in Teachers' Use of Generative AI", "url": "https://arxiv.org/abs/2611.27533", "authors": "Muhammad Saleh Farooq ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "why": "パキスタン・パンジャブ州の教師13人らへの面接から、授業計画の下書きはAIに任せても学習目標の作成は誰も任せず、採点を任せるにはルーブリックを条件とするという型を見いだした。教科書や採点基準のようにモデルの外にある基準で結果を確かめられる部分だけを委ねる「基準に結びつけた委任」と名づけた。"}, {"id": "pn50", "rank": 50, "field": "ヒューマンコンピュータインタラクション", "headline": "心の支援AIの振る舞いを8つの役割状態で分類", "title": "AROMA: Understanding AI Support For Mental Well-being through Role Theory", "url": "https://arxiv.org/abs/2611.26843", "authors": "Issac Ting ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "why": "心の健康を支えるAIが期待された役割を越えて振る舞うと、関係上の害が生じる。13のデータセットの7,515件超の会話を理論に基づいて注釈し、観察された振る舞いから8つの「役割状態」の分類（AROMA）を作った。役割状態は支援の文脈で変わり、AIと人で構造と時間的な特徴が違うことを示した。"}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "独立した健全データでは実橋の損傷検知が偶然並みに", "title": "Independent‐Baseline Collapse in Full‐Scale Bridge Damage Detection: A Leakage‐Resistant Multimodal Graph Benchmark", "url": "https://doi.org/10.1155/stc/7325180", "authors": "Amr Munshi ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-11-23", "sjr": 1.147, "citescore": 10.3, "citescore_year": "2025", "theme": "VBI・橋梁SHM" eadline": "駅に近くても住みよさにつながらない地区の再生", "title": "Transit Proximity Without Livability: A Performance-Based Urban Regeneration Framework for Inner-City Districts in Hot-Arid Gulf Cities", "url": "https://doi.org/10.3390/urbansci10120681", "authors": "Jalal Hoblos ほか", "venue": "Urban Science", "date": "2026-11-23", "sjr": 0.673, "citescore": 3.7, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6}, {"id": "jr49", "rank": 49, "headline": "現場従業員は超自動化に不安と職務設計の機会をみる", "title": "Human-Centric Hyperautomation Using Supply Chain 5.0 Principles: A Front-Line Perspective", "url": "https://doi.org/10.1177/10596011261509184", "authors": "Andrew Birkbeck ほか", "venue": "Group and Organization Management", "date": "2026-11-23", "sjr": 2.543, "citescore": 11.3, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7}, {"id": "jr50", "rank": 50, "headline": "地震による斜面崩壊の年発生確率を推定", "title": "Estimation of annual earthquake-induced landslide occurrence probabilities from calibrated machine learning predictions and seismic hazard curves", "url": "https://doi.org/10.1016/j.ijdrr.2026.106592", "authors": "Hiroki Ishibashi ほか", "venue": "International Journal of Disaster Risk Reduction", "date": "2026-11-23", "sjr": 1.243, "citescore": 9.1, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "出稼ぎは収入を倍にするが幸福感は下がる", "title": "The Costs and Benefits of Guest Worker Programs: Experimental Evidence from the India-UAE Migration Corridor,", "url": "https://doi.org/10.1093/jeea/jvag075", "authors": "Suresh Naidu ほか", "venue": "Journal of the European Economic Association", "date": "2026-11-23", "sjr": 7.259, "citescore": 6.7, "citescore_year": "2025", "why": "インドからUAEの建設の仕事に応募した人を対象にした無作為化実験で、一時的な合法移民の収益を推定した。移住した人の収入は2倍になったが、仲介業者に多額の前払い費用を払い、幸福感は大きく下がった。申し出を断った人に外挿すると、金銭的な収益は同程度でも幸福感の低下はより大きく、幸福感と仲介費用を考慮すると厚生の利得は金銭的な利得の半分になる。"}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "競争が激しくても情報開示は部分的にとどまる", "title": "Limits of Disclosure in Search Markets", "url": "https://doi.org/10.1093/restud/rdag129", "authors": "Raphael Boleslavsky ほか", "venue": "Review of Economic Studies", "date": "2026-11-20", "sjr": 23.622, "citescore": 15.7, "citescore_year": "2025", "why": "探索費用のかからない目利きの消費者と、費用のかかる一般の消費者が混在する探索市場での企業の情報開示を分析した。前者は正直な開示を、後者は隠蔽を促すため、均衡では競争が激しくても部分的な開示が残る。競争の激化は目利きの消費者を利するが一般の消費者を害しうること、探索費用の変化が開示に非単調な効果を持つことを示した。"}, {"id": "jn03", "rank": 3, "field": "政治学", "headline": "政治投稿が人かAIかを人はほとんど見分けられない", "title": "Humans show limited ability to distinguish human-authored from AI-generated political content on social media", "url": "https://doi.org/10.1073/pnas.2534309123", "authors": "Sejin Paik ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-23", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "2024年の米大統領選討論会に関するSNS投稿について、人が書いたものとLLMが生成したものを対にして、どちらがAIかを判定させる行動実験を行った。人の投稿は6つのうち5つのLLMの出力より人間らしいと評価されたが、判別の精度は偶然をわずかに上回る程度で、新しいLLMほど難しく、プラットフォームや党派で変わった。"}, {"id": "jn04", "rank": 4, "field": "経営学", "headline": "日本の投信は設定9か月で資産のピークを迎える", "title": "Short-horizon capital in a bank-centered financial system: Japanese mutual fund launches relative to the U.S.", "url": "https://doi.org/10.1057/s41267-026-00916-0", "authors": "Toshiki Honda ほか", "venue": "Journal of International Business Studies", "date": "2026-11-23", "sjr": 4.454, "citescore": 17.6, "citescore_year": "2025", "why": "日本の国内株式アクティブ投信は、設定から運用資産のピークまでの中央値が9か月で、米国の4.6年と大きく違う。設定時の強い資金流入がすぐに継続的な流出に変わるためで、銀行中心の集中した販売網と販売時に偏った手数料体系に結びついていることを示した。設定規模と販売手数料が大きいほどピークが早いのは日本だけで、同じ金融商品でも仲介と報酬の制度で寿命が変わる。"}, {"id": "jn05", "rank": 5, "field": "機械学習", "headline": "標本の偏りに上限を置いて頑健な決定規則を学習", "title": "Learning from a Biased Sample", "url": "https://doi.org/10.1287/mnsc.2024.08073", "authors": "Roshni Sahoo ほか", "venue": "Management Science", "date": "2026-11-23", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "経験リスク最小化は、訓練データが運用時と同じ条件で得られていることを前提とする。観測される共変量は標本に選ばれる確率をいくらでも変えうるが、説明されない変動は定数倍までに限られるという偏りのモデルを提案し、その範囲で最悪の場合のリスクを最小にする決定規則を分布頑健最適化で学習する方法を示した。"}, {"id": "jn06", "rank": 6, "field": "統計学", "headline": "小さな採用集団の不利益影響はベイズ法で検出力が上がる", "title": "Small N, High Stakes: Simulating Adverse Impact With Bayesian Logistic Regression Analysis and Permutation Tests", "url": "https://doi.org/10.1177/10944281261491767", "authors": "Patrick J. Rolwes ほか", "venue": "Organizational Research Methods", "date": "2026-11-23", "sjr": 14.268, "citescore": 48.0, "citescore_year": "2025", "why": "採用での集団間の不利益影響（adverse impact）の判定に使われる経験則や検定は、採用人数が少ないと性能が悪い。効果量・選抜率・集団の大きさを現実的な範囲で変えたモンテカルロ実験で、ベイズのロジスティック回帰と並べ替え検定を評価した。弱情報事前分布などのベイズのオッズ比の規則は小標本で頻度論の方法より検出力が高いが、平均で0.80には届かなかった。"}, {"id": "jn07", "rank": 7, "field": "組織行動・心理的安全性", "headline": "苦しくても組織が求める自己像にしがみつく仕組み", "title": "The unconscious relational binds of identity regulation: Social defenses and structuring fantasies", "url": "https://doi.org/10.1177/00187267261500376", "authors": "Louise Colling ほか", "venue": "Human Relations", "date": "2026-11-23", "sjr": 4.141, "citescore": 16.1, "citescore_year": "2025", "why": "従業員は、苦しみを伴っても組織が勧めるアイデンティティになぜ固執するのか。職員に「熱心なスカウト」であることを暗に求めるベルギーの医療組織の事例から、熱意の要求による負担を、年長者と若手が対照的な自己像を採り互いを責めるという世代間の分断で無意識に処理していることを示した。この防衛と空想の働きが、アイデンティティ統制の拘束をさらに強める。"}, {"id": "jn08", "rank": 8, "field": "経済学", "headline": "担保の需要がレポ市場と金融政策の波及を弱める", "title": "Collateral Demand in Wholesale Funding Markets", "url": "https://doi.org/10.1093/rfs/hhag099", "authors": "Jamie Coen ほか", "venue": "The Review of Financial Studies", "date": "2026-11-23", "sjr": 17.406, "citescore": 13.2, "citescore_year": "2025", "why": "レポ市場は資金調達の場であると同時に、担保の資産を手に入れる場でもある。英国債レポ市場での異質な企業間の取引のモデルを構造推定し、この担保需要が市場の活動を押し下げ、金融政策の波及を妨げうることを示した。量的緩和で中央銀行が抱えた資産を貸し出せば、波及は20%、企業の余剰は38%改善すると試算する。"}, {"id": "jn09", "rank": 9, "field": "工学", "headline": "ガス田の誘発地震が暴走破壊になる条件を理論化", "title": "Conditions for runaway ruptures during reservoir operations: Magnitude–frequency distribution implications and application to Groningen", "url": "https://doi.org/10.1073/pnas.2625955123", "authors": "Qian Shi ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-23", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "ガス貯留層から下位の地層へ伝わる誘発地震の破壊が、自然に止まるか暴走するかの条件を線形破壊力学で導き、貯留層の厚さ・圧力低下・背景応力・破壊エネルギーを2つの無次元量にまとめた相図を示した。オランダのフローニンゲンガス田に当てはめると、暴走は原理的にはありえたが条件は満たされていなかった可能性が高く、M3.0超の地震が統計則の予想より少ないことも再現した。"}, {"id": "jn10", "rank": 10, "field": "オペレーションズ・リサーチ", "headline": "「大きすぎて潰せない」が安全の過信を強める", "title": "EXPRESS: Supercharging the Confidence Trap: Too-Big-to-Fail and Man-Made Disasters", "url": "https://doi.org/10.1177/10591478261510216", "authors": "Akhil Bhardwaj ほか", "venue": "Production and Operations Management", "date": "2026-11-23", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "why": "ボーイングのように規制の厳しい組織で人為的な大事故が起きる仕組みを、システムダイナミクスの枠組みの中のエージェントベースモデルで調べた。過去にリスクを取って成功したことが今後のリスクも正当化するという「過信の罠」に規制者と事業者の双方が陥り、組織が大きすぎて潰せないと見なされると市場の淘汰が働かず悪化する。役員報酬の返還などの政策手段を提案する。"}, {"id": "jn11", "rank": 11, "field": "機械学習", "headline": "生成された科学画像の忠実さを形の持続性で検証", "title": "Topological validation of generated scientific images", "url": "https://doi.org/10.1073/pnas.2622414123", "authors": "Asim K. Dey ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-23", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "自動運転・遠隔探査・デジタルツインなどで使われる合成の科学画像について、品質と不確実性の厳密な評価は難しい。合成電力網の検証で発展した位相的・幾何学的な方法をもとに、画像の多重スケールの形のパターンの「持続性」を生存時間解析の統計的な枠組みで比べる体系的な方法を提案した。"}, {"id": "jn12", "rank": 12, "field": "経営学", "headline": "既存品の欠品は新商品の試し買いを促す", "title": "Stockouts and the Success of New Products", "url": "https://doi.org/10.1287/mnsc.2023.02602", "authors": "Diego Aparicio ほか", "venue": "Management Science", "date": "2026-11-23", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "新商品の発売時に既存品が欠品していると、新商品の売上が少なくとも6か月高いことを示した。過去の欠品と他店の同時期の欠品を操作変数に使って因果を確かめ、個人の取引データから、欠品が新商品の試し買いを促し、その後の反復購入につながる仕組みを裏づけた。在庫が商品の試用を左右するという、在庫政策の新しいトレードオフを示す。"}, {"id": "jn13", "rank": 13, "field": "経営学", "headline": "公務員制度改革で米国債の利回りが下がった", "title": "Corruption Perceptions, the Pendleton Act, and Sovereign Borrowing Costs", "url": "https://doi.org/10.1111/puar.70236", "authors": "John A. Dove ほか", "venue": "Public Administration Review", "date": "2026-11-23", "sjr": 3.305, "citescore": 11.3, "citescore_year": "2025", "why": "官職の猟官制は汚職と非効率を生むとされるが、市場がその改革をどう評価したかは調べられてこなかった。ペンドルトン公務員制度改革法の成立を中断時系列分析で評価し、連邦政府の借入費用が仕様により63〜84ベーシスポイント下がったことを示した。"}, {"id": "jn14", "rank": 14, "field": "経済学", "headline": "収入の不安が高まると宗教への寄付が増える", "title": "Hedging by Giving: Spiritual Insurance and Religious Donations", "url": "https://doi.org/10.1017/s0022109026103482", "authors": "Yu-Jane Liu ほか", "venue": "Journal of Financial and Quantitative Analysis", "date": "2026-11-23", "sjr": 4.404, "citescore": 7.1, "citescore_year": "2025", "why": "善行と引き換えに加護を期待してリスクに備える「精神的な保険」を、銀行の取引データで調べた。所得の不確実性と健康のショックは寄付、とくに宗教団体への寄付を増やし、宗教団体に寄付する人は保険への支出を減らす傾向がある。数百万人を対象にしたオンラインの現場実験でも、精神的な保険の語りが寄付を増やした。"}, {"id": "jn15", "rank": 15, "field": "経営学", "headline": "多国籍企業は気候変動に強い国に子会社を置く", "title": "Adapting to the new abnormal: multinational corporations’ foreign subsidiary investment and country resilience to climate change", "url": "https://doi.org/10.1057/s41267-026-00912-4", "authors": "Chang Hoon Oh ほか", "venue": "Journal of International Business Studies", "date": "2026-11-23", "sjr": 4.454, "citescore": 17.6, "citescore_year": "2025", "why": "Global Fortune 500の企業の155か国への投資（2003〜2017年）を分析し、気候変動へのレジリエンスが高い国ほど完全所有の子会社が多く設立されることを示した。この関係はESGの能力が高い企業や、レジリエンスの高い国での経験がある企業で強く、財務的な余裕が大きい企業では弱い。"}, {"id": "jn16", "rank": 16, "field": "経営学", "headline": "情報を増やすと投資の誘因を損ねる場合がある", "title": "Information Design with Supplemental Investment", "url": "https://doi.org/10.1287/mnsc.2025.00524", "authors": "Lin Nan ほか", "venue": "Management Science", "date": "2026-11-23", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "企業の基礎的な質と、追加投資の性質（上振れを伸ばすか、下振れを抑えるか）の2次元の情報の非対称があるとき、基礎的な質についての情報を増やしても効率は必ずしも上がらず、害になりうることを示した。最適な情報システムは信用リスクの水準によって、情報を出さないか、楽観的に偏ったものになる。"}, {"id": "jn17", "rank": 17, "field": "経営学", "headline": "分権的な動的マッチングで全件提出を促す仕組み", "title": "Optimal Incentive Design for Decentralized Dynamic Matching Markets", "url": "https://doi.org/10.1287/mnsc.2025.01346", "authors": "Chen Chen ほか", "venue": "Management Science", "date": "2026-11-23", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "複数病院の腎臓交換のように、各主体が自分の案件を抱え込める分権的な動的マッチング市場で、到着した案件をすべて提出させる金銭的・非金銭的な仕組みを設計した。提出した案件の限界価値に応じて報いる仕組みは、確率的に選んだ主体にマッチングを任せる形で金銭なしでも実装できる。"}, {"id": "jn18", "rank": 18, "field": "経営学", "headline": "近い客を優先する配達は遅延を減らすが公平を損なう", "title": "Proximity-Based Delivery Policies: Efficiency, Coverage, and Fairness", "url": "https://doi.org/10.1287/mnsc.2025.02206", "authors": "Zhongbin Wang ほか", "venue": "Management Science", "date": "2026-11-23", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "即時配達で、先着順ではなく店に近い客の注文を優先する方針は、配達員を増やさずに平均の遅延を大きく減らすが、遠い客の待ち時間が延びる。近い客が優先のために払い、遠い客が補償を受ける誘因両立的な仕組みで、効率を保ったまま先着順並みの公平さを取り戻せることを示した。"}, {"id": "jn19", "rank": 19, "field": "機械学習", "headline": "深層学習で接点ポートフォリオの重みを直接推定", "title": "Deep Tangency Portfolio", "url": "https://doi.org/10.1287/mnsc.2023.03136", "authors": "Guanhao Feng ほか", "venue": "Management Science", "date": "2026-11-23", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "高次元の企業特性から作るロング・ショートの「深層ファクター」を基準ファクターに加え、シャープレシオの最大化を目的に接点ポートフォリオの重みを直接推定する枠組み。米国社債と132の特性への適用で、深層ファクターの標本外シャープレシオは1を超え、市場ファクターを基準にした接点ポートフォリオでは2を超えた。"}, {"id": "jn20", "rank": 20, "field": "オペレーションズ・リサーチ", "headline": "消費者が公平さを求めると両方の販路で価格が上がりうる", "title": "EXPRESS: The Role of Consumer Fairness Seeking in Live-Stream E-Commerce", "url": "https://doi.org/10.1177/10591478261512635", "authors": "Baozhuang Niu ほか", "venue": "Production and Operations Management", "date": "2026-11-23", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "why": id": "jn28", "rank": 28, "field": "経営学", "headline": "組織を会員とする「メタ組織」の競争を5つの場で整理", "title": "Competition Within and Across Meta-Organizations: Loci of Competition in Multi-Level Organizational Architectures", "url": "https://doi.org/10.1177/26317877261504463", "authors": "Pierre Garaudel", "venue": "Organization Theory", "date": "2026-11-23", "sjr": 4.852, "citescore": 13.2, "citescore_year": "2025", "why": "会員自体が組織である「メタ組織」が広がっているが、そこでの競争はほとんど分析されてこなかった。誰と誰がどの水準で競争相手になるかを表す「競争の場」の概念を使い、メタ組織どうし、メタ組織と会員、会員どうしなど5つの場を区別する概念枠組みを示した。"}, {"id": "jn29", "rank": 29, "field": "工学", "headline": "有限要素法の手順とAMOREを機械学習で強化", "title": "Enhancing finite element procedures and AMORE with machine learning", "url": "https://doi.org/10.1016/j.compstruc.2026.108510", "authors": "Klaus-Jürgen Bathe", "venue": "Computers & Structures", "date": "2026-11-23", "sjr": 1.243, "citescore": 7.5, "citescore_year": "2025", "why": "題名から、有限要素法の解析手順と解析手法AMOREを機械学習で強化する研究と読める。Computers & Structures掲載。抄録は取得できていない。"}, {"id": "jn30", "rank": 30, "field": "工学", "headline": "材料の結合則から断面の破壊へ：薄肉構造の位相場定式化", "title": "From material cohesive laws to sectional fracture: A generalized cohesive phase-field formulation for thin structures", "url": "https://doi.org/10.1016/j.compstruc.2026.108548", "authors": "Jian-Ying Wu ほか", "venue": "Computers & Structures", "date": "2026-11-23", "sjr": 1.243, "citescore": 7.5, "citescore_year": "2025", "why": "題名から、材料の結合力則から断面レベルの破壊までを扱う、薄肉構造のための一般化した結合力型の位相場（フェーズフィールド）定式化と読める。Computers & Structures掲載。抄録は取得できていない。"}, {"id": "jn31", "rank": 31, "field": "工学", "headline": "1対1内部共振の非線形減衰を導出し振動実験で検証", "title": "Nonlinear damping for one-to-one internal resonance: derivation and nonlinear vibration experiments", "url": "https://doi.org/10.1016/j.ymssp.2026.115226", "authors": "Marco Amabili", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-23", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "why": "題名から、1対1の内部共振における非線形減衰を導出し、非線形振動の実験を行った研究と読める。Mechanical Systems and Signal Processing掲載。抄録は取得できていない。"}, {"id": "jn32", "rank": 32, "field": "工学", "headline": "整合場処理で圧力管路のパラメータを逆推定", "title": "Parameter inversion in pressurized pipelines using matched-field processing", "url": "https://doi.org/10.1016/j.ymssp.2026.115238", "authors": "Can Xu ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-23", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "why": "題名から、整合場処理（matched-field processing）を使って圧力管路のパラメータを逆推定する研究と読める。Mechanical Systems and Signal Processing掲載。抄録は取得できていない。"}, {"id": "jn33", "rank": 33, "field": "工学", "headline": "鉄筋コンクリートの腐食とひび割れを20年の暴露で追跡", "title": "Variability of corrosion and corrosion-induced cracking in reinforced concrete: A 20-year natural exposure study", "url": "https://doi.org/10.1016/j.cemconres.2026.108464", "authors": "Filipe Pedrosa ほか", "venue": "Cement and Concrete Research", "date": "2026-11-23", "sjr": 6.233, "citescore": 25.9, "citescore_year": "2025", "why": "題名から、自然環境に20年間暴露した鉄筋コンクリートの腐食と、腐食によるひび割れのばらつきを調べた研究と読める。Cement and Concrete Research掲載。抄録は取得できていない。"}, {"id": "jn34", "rank": 34, "field": "工学", "headline": "ポー川の堤防4 kmを地震探査と電気探査で同時に計測", "title": "Dataset of a 4 km combined seismic and electric streamer survey along the embankment of the Po river in Crescentino", "url": "https://doi.org/10.5194/essd-18-8783-2026", "authors": "Cesare Comina ほか", "venue": "Earth System Science Data", "date": "2026-11-23", "sjr": 7.199, "citescore": 19.2, "citescore_year": "2025", "why": "河川堤防の調査で、土の骨格の性質を示す地震探査と、間隙の流体の性質を示す電気探査を、牽引式のストリーマーで同時に行ったイタリア・クレシェンティーノのポー川堤防4 kmのデータセット。長い区間の調査への適用を示し、大量のデータに合わせた処理法の開発に使える。"}, {"id": "jn35", "rank": 35, "field": "工学", "headline": "送電線の風による微振動で発電しながら振動も抑える", "title": "Broadband Aeolian Vibration Harvesting and Electrical‐Damping‐Induced Suppression via Triboelectric‐Electromagnetic Coupling Mechanism", "url": "https://doi.org/10.1002/aenm.71861", "authors": "Baichuan Leng ほか", "venue": "Advanced Energy Materials", "date": "2026-11-23", "sjr": 7.677, "citescore": 39.9, "citescore_year": "2025", "why": "架空送電線では、センサの電源不足と風による微振動（エオリアン振動）の疲労が課題である。摩擦帯電型と電磁型の発電機を組み合わせた装置で、5〜50 Hzの全域で47 µFのコンデンサを5.2 Vまで充電でき（最大出力287.28 mW）、発電に伴う電気的な減衰が振動も抑えることを実験で示した。"}, {"id": "jn36", "rank": 36, "field": "機械学習", "headline": "LLMとロボットの閉ループで高エントロピー触媒を設計", "title": "Autonomous AI-Robotics Design of High-Entropy Catalysts for the Urea Oxidation Reaction", "url": "https://doi.org/10.1021/jacs.6c19432", "authors": "Yan Huang ほか", "venue": "Journal of the American Chemical Society", "date": "2026-11-23", "sjr": 5.491, "citescore": 22.0, "citescore_year": "2025", "why": "文献の検索に基づく知識の抽出、理論を取り入れた機械学習、信頼性を考慮した組成の絞り込み、ロボットによる高速実験をつないだ自律的な閉ループで、尿素酸化反応の高エントロピー触媒を探索した。LLMは候補の生成と証拠の評価に使い、人の判断は問題設定などに組み込む。ロボットで検証した40組成から最良の組成を特定した。"}, {"id": "jn37", "rank": 37, "field": "機械学習", "headline": "時系列を記号に変えて小型言語モデルで予測", "title": "From Numbers to Prompts: A Cognitive Symbolic Transition Mechanism for Lightweight Time-Series Forecasting", "url": "https://doi.org/10.1145/3871069", "authors": "Namkyung Yoon ほか", "venue": "ACM Transactions on Intelligent Systems and Technology", "date": "2026-11-24", "sjr": 2.065, "citescore": 17.6, "citescore_year": "2025", "why": "LLMによる時系列予測は計算資源が大きい。連続値を量子化して記号の列に変え、記号の遷移で時間的な動きを表してプロンプトに入れる仕組み（STM）を提案した。言語モデル本体は変えず、4つの小型モデルと6つのデータセットで、評価した方法の中で最小の平均NMAE 0.540を得た。"}, {"id": "jn38", "rank": 38, "field": "政治学", "headline": "デリーの水道補助金の受給資格の改革への市民の選好", "title": "Assessing public preferences for reforming water subsidy eligibility rules in Delhi", "url": "https://doi.org/10.1038/s44284-026-00546-5", "authors": "Saumitra Sinha ほか", "venue": "Nature Cities", "date": "2026-11-23", "why": "題名から、インド・デリーの水道補助金の受給資格のルールを改める案に対する市民の選好を調べた研究と読める。Nature Cities掲載。抄録は取得できていない。"}, {"id": "jn39", "rank": 39, "field": "ヒューマンコンピュータインタラクション", "headline": "人はChatGPTを心の健康の自己管理に転用している", "title": "Leveraging ChatGPT as a tool to self-manage psychological well-being: an affordance perspective", "url": "https://doi.org/10.1108/     if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
