<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

値段」は同じではない。この研究は架空の会社の1年分の帳簿に誤りを仕込み、AIの監査の結果をお金で採点した。最新のAIでも、昔ながらの決まりきったルールの検査には勝てなかった。", "unverified": "使われたモデル名、罰金の計算の詳細、欠陥の15分類の中身は抄録になく未確認。査読前で、30の世界・1つの課題形式に限られると著者が述べている。"}}, {"id": "pr17", "rank": 17, "headline": "小型モデルはSEC書類の数値を根拠つきで読めるか", "title": "Show Your Work: Can Small Open Models Read SEC Filings with Evidence a Machine Can Check?", "url": "https://arxiv.org/abs/2611.24990", "authors": "Krishna Nandula", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Nandula, K. (2026). Show Your Work: Can Small Open Models Read SEC Filings with Evidence a Machine Can Check? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24990", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "手元のGPU1枚で動く小型の公開モデルが、米国企業の決算書類から数値を、機械で検査できる根拠（ページと原文の引用）つきで抜き出せるかを測るベンチマークを作った。", "p3": "45社の10-K・10-Qの90書類に対する1,000問を作り、正解は提出者のインラインXBRLのタグから取った。7〜21Bパラメータの10モデルを、素のまま・検査して再試行・推論モードの3条件で評価した（抄録）。", "p5": "根拠つきの正答率は素の条件で17.1〜82.7%、最良は84.5%だった。自動検査を通ってしまう誤答が1,000問あたり16〜167件あり、素の条件ではその57%が桁や単位の誤りだった。再試行で正答率は最大3.9ポイント上がった（抄録）。", "fun": "AIがすらすら答えても、それが正しいとは限らない。そこでこの研究は「答えの数字が書類の何ページのどの文にあるか」まで示させ、機械が照合できるようにした。それでも検査をすり抜ける誤答が残り、その半分以上は桁や単位の取り違えだった。人間の経理でも起きそうな間違いをAIもする、というのが面白い。", "unverified": "各モデルの個別の成績、検査の具体的な規則、推論モードで誤りが減る幅は抄録の範囲では未確認。"}}, {"id": "pr18", "rank": 18, "headline": "AI投資の簿外債務を入れるとレバレッジは2倍超", "title": "Financing the AI Buildout: Leverage, Opacity, and Credit Risk", "url": "https://doi.org/10.2139/ssrn.7727801", "authors": "Susan Cherry ほか", "venue": "SSRN", "date": "2026-11-25", "apa": "Cherry, S., Purnanandam, A., & Singla, S. (2026). Financing the AI Buildout: Leverage, Opacity, and Credit Risk. https://doi.org/10.2139/ssrn.7727801", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "AI向けの設備投資を進める上場企業の負債を、貸借対照表に載らないリースと発注残まで含めて測り、見かけよりレバレッジがずっと高いことを示した。", "p3": "上場63社のSEC提出書類から、簿外のリースと購入契約による固定的な支払義務を集計し、現在価値に直してレバレッジを計算した。社債スプレッドと格付けとの関係も調べた（抄録）。", "p5": "額面では簿外の債務が固定債務のほぼ4分の3を占め、現在価値で数えるとレバレッジは2026年6月時点で0.22から0.48に上がった。簿外債務の多い企業は同じ格付けの中でも社債スプレッドが広いが、格付けは低くない（抄録）。", "fun": "会社の借金は貸借対照表を見れば分かる、と思いがちだ。ところがAIのデータセンターに巨額を投じる企業では、将来払う約束の大半が帳簿の外にあった。面白いのは、社債を買う投資家はこの隠れた負担を金利に織り込んでいるのに、格付けには表れていない点で、誰がリスクを見ているかのずれが分かる。", "unverified": "レバレッジの定義（分母）、対象63社の選び方、割引率は抄録になく未確認。"}}, {"id": "pr19", "rank": 19, "headline": "流体と不連続変形法の連成で防波堤の安定を解く", "title": "CFD/NDDA coupling strategy for fluid-structure interactions with applications to wave impact on breakwater", "url": "https://doi.org/10.70675/0a56be82z8348z40d9zbfd7z835044be67b9", "authors": "Xinyu Wang", "venue": "HAL", "date": "2026-11-25", "apa": "Wang, X. CFD/NDDA coupling strategy for fluid-structure interactions with applications to wave impact on breakwater. https://doi.org/10.70675/0a56be82z8348z40d9zbfd7z835044be67b9", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "HALに登録された博士論文の抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "波が防波堤に激しく当たるときの、水の流れ・透水層・ブロック状の固体の動きを一緒に解く2次元の連成モデルを作り、混成防波堤の安定性を調べた博士論文。", "p3": "固体側は有限要素法と不連続変形法を組み合わせた節点ベースの不連続変形法（NDDA）、流体側は体積平均したレイノルズ平均ナビエ・ストークス方程式に多孔質層のフォルヒハイマー項を加えたモデルで、両者を連成した（抄録）。", "p5": "透水層の空隙率が高いと乱流エネルギーが散逸し、衝突する波の最大の高さが下がる。ただし層を厚くしても単調には下がらず、最適な厚さがあった。ケーソンの形と被覆ブロックの種類も越波と安定性を左右した（抄録）。", "fun": "防波堤は巨大なコンクリートの箱と、その前に積まれた消波ブロックの集まりだ。波が当たると水は隙間を流れ、ブロックは一つひとつ動く。水とばらばらの固体を同時に計算するのは難しいが、この研究は両方をつないだ模型で試した。隙間の多い層は波の勢いを弱めるが、厚くすればするほど良いわけではなく、ちょうどよい厚さがあるという結果が面白い。", "unverified": "抄録に数値がなく、モデルの検証方法と精度、試した空隙率・厚さの値は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "海洋循環の3次元状態を作用素推論の縮約モデルで模擬", "title": "Data-Driven Emulation of a Double Gyre Ocean Circulation Using Operator Inference", "url": "https://doi.org/10.22541/essoar.15012546/v2", "authors": "Shoshi Reich ほか", "venue": "ESS Open Archive", "date": "2026-11-25", "apa": "Reich, S., Aretz, N., Willcox, K., & Heimbach, P. (2026). Data-Driven Emulation of a Double Gyre Ocean Circulation Using Operator Inference. https://doi.org/10.22541/essoar.15012546/v2", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "ESS Open Archiveの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "計算の重い海洋大循環モデルの3次元の状態を、データから学習した縮約モデルで十年規模にわたり高速に時間発展させた。", "p3": "季節変動する風と浮力で駆動される理想化した二重循環の海盆で、学習した2次の力学と既知の海面強制から作る強制項を組み合わせる作用素推論（Operator Inference）の縮約モデルを作り、海盆全体の熱と塩の収支が閉じるよう線形の制約を課した（抄録）。", "p5": "学習に使わなかった風応力の強さでも、十年平均の表層と内部の状態、鉛直の構造、循環の輸送量の強制への依存を再現した。中規模渦の高周波の変動は弱まるが、計算は五桁以上速くなった（抄録）。", "fun": "海の流れを計算機で再現するには膨大な計算が要るので、「風が少し強かったら」と何百通りも試すのは難しい。この研究は、詳しい計算の結果から海の動きの「あらすじ」だけを取り出した小さなモデルを作った。細かい渦は表せなくなる代わりに、計算が桁違いに速くなる。熱と塩の総量が勝手に増減しないよう縛りを入れた点が工夫だ。", "unverified": "縮約モデルの次元、学習データの量、誤差の数値は抄録になく未確認。現実の海洋ではなく理想化した海盆での検証である。"}}, {"id": "pr21", "rank": 21, "headline": "災害は地域の結びつきを強める方向に働く", "title": "How do climate-fuelled disasters affect social cohesion? Evidence from a new(s) high frequency approach", "url": "https://econpapers.repec.org/RePEc:ajr:sodwps:paper_1793762534474_668", "authors": "Noah Star ほか", "venue": "RePEc NEP", "date": "2026-11-09", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "RePEc（NEP）に掲載された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "地方紙の記事から組織どうしのつながりを抜き出して地域の社会的結束を週ごとに測る指標を作り、山火事や洪水のあとに結束がどう変わるかを調べた。", "p3": "豪州ビクトリア州の地方紙を自然言語処理で分析し、報道された組織間の結びつきから「社会的結束ネットワーク指数」を統計地域（SA4）・週単位で作成した。極端な山火事・洪水を処置とする積み上げ型のイベントスタディで推定した（抄録）。", "p5": "自然災害はこの指標を高め、効果は災害の種類で異なった。山火事のあとは地域の組織のネットワークが構造的に結束を強め、洪水の効果は推定の精度が低かった（抄録）。", "fun": "「地域のきずな」はふつうアンケートで測るが、それでは変化をこまめに追えない。この研究は地方新聞の記事に出てくる団体どうしの関わりを数え、きずなを毎週測るものさしを作った。山火事のあとには団体どうしのつながりが密になっていた。災害は地域を壊すだけでなく、人々を結びつけもするらしいことを、新聞という身近な資料から示した点が面白い。", "unverified": "効果の大きさ、対象期間、新聞の数は抄録になく未確認。指標が住民の実際の結束をどこまで表すかの検証も抄録の範囲では不明。"}}, {"id": "pr22", "rank": 22, "headline": "診療支援AIの利用と医師の燃え尽きを2年間追跡", "title": "Relationship between AI decision support tool and clinician wellbeing and burnout over time: A longitudinal study (Preprint)", "url": "https://doi.org/10.2196/preprints.117830", "authors": "Ammarah Mahmud ほか", "venue": "JMIR Preprints", "date": "2026-11-26", "apa": "Mahmud, A., Simanonok, M., Bensley, K., Dale, C. R., & Dix, R. (2026). Relationship between AI decision support tool and clinician wellbeing and burnout over time: A longitudinal study (Preprint). https://doi.org/10.2196/preprints.117830", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "診療を支援するAIツールを使う医師とそうでない医師で、2年間のwell-beingと燃え尽きに関わる項目の変化を比べた。", "p3": "米国の医療機関Providence St. Joseph Healthで、2024年と2025年の調査の両方に答えた臨床医を対象に、AIの診療支援ツールMedPearlの利用と9つの調査項目の変化の関係を、医師と診療所の特性を調整した順序回帰で調べた（抄録）。", "p5": "利用者は非利用者に比べ、チームへの帰属感（調整オッズ比1.37、95%信頼区間1.13〜1.67）と仕事の裁量（1.21、1.01〜1.45）の改善を報告しやすかった。利用が多いほど、組織との価値の一致と妥当な業務量の改善も報告されやすかった（抄録）。", "fun": "AIの道具は「仕事が速くなるか」で語られがちだが、この研究は医師の気持ちの変化を2年にわたって追った。AIの診療支援を使う医師は、使わない医師より「チームの一員だと感じる」「仕事を自分で決められる」という感覚が良くなりやすかった。道具の導入が、職場での居場所の感覚に関係するかもしれないというのが意外だ。", "unverified": "対象者の人数、9項目のうち他の項目の結果は抄録になく未確認。無作為化ではない観察研究で、利用者と非利用者のもともとの違いがどこまで調整されているかは不明。"}}, {"id": "pr23", "rank": 23, "headline": "LLMのチームは計算量をそろえても個より賢いか", "title": "Recursive Collective Intelligence: Emergence on an Equal-Budget Ladder in Multi-Agent LLM Systems", "url": "https://doi.org/10.48550/arxiv.2611.32606", "authors": "Lixuan He ほか", "venue": "arXiv", "date": "2026-11-24", "apa": "He, L., Cai, S., Wu, F., Zheng, S., Jiang, L., Li, M., Ma, Y., Fei-Fei, L., Guibas, L., Wetzstein, G., Choi, Y., & Hong, Y. (2026). Recursive Collective Intelligence: Emergence on an Equal-Budget Ladder in Multi-Agent LLM Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.32606", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（OpenAlexに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "LLMのエージェントの集団が、計算量をそろえても個々より賢くなるのはどんなときかを段階的に判定する基準を作り、集団が自分の成果から次の世代を賢くできることを示した。", "p3": "集団を、単独のエージェント、計算量をそろえた多数決、計算量をそろえたpass@nの3段階で比べる「等予算のはしご」を定義した。集団自身の出力だけで次世代が同じ費用で賢くなることを再帰的集合知と呼ぶ（抄録）。", "p5": "分割された事実を転送するやり取りは、3つのモデル規模で集団をpass@nより上に押し上げた。同一の27Bのエージェントは自発的に中心役を作り、正答率が18ポイント上がった。教師なしの世代交代で成績が上がり続けた（抄録）。", "fun": "「三人寄れば文殊の知恵」というが、AIを何体も集めれば賢くなるのは当たり前で、単に計算をたくさん使っただけかもしれない。この研究は「同じだけ計算を使った多数決」と比べても勝てるかという厳しい物差しを作った。話し合いが本当に効くのは、ばらばらに持っている情報を互いに渡し合うときだった。同じAIどうしなのに、自然とまとめ役が生まれたというのも面白い。", "unverified": "使われた課題と評価データの詳細、統計的な有意性は抄録の範囲では未確認。"}}, {"id": "pr24", "rank": 24, "headline": "合成消費者は「いつもの答え」を超えられていない", "title": "When the Average Looks Right: Evaluating Behavioural Fidelity in Synthetic Consumers", "url": "https://doi.org/10.5281/zenodo.24559152", "authors": "Bajaj, Puneet", "venue": "Zenodo", "date": "2026-11-26", "apa": "Bajaj, P. (2026). When the Average Looks Right: Evaluating Behavioural Fidelity in Synthetic Consumers (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.24559152", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "LLMで作る「合成消費者」が、全員に同じ「いつもの答え」を返すだけの基準をどれだけ上回るかを調べ、ほとんど上回れていないことを示した。", "p3": "公開データTwin-2K-500で、人口統計のLLMペルソナ、文章に基づくデジタルツイン、行動で学習したモデル、最近傍の統計的な双子を比べた。同じ質問を繰り返した2つのパネル（2,058人と200人）で評価した（抄録）。", "p5": "中央値を答えるだけの基準が75.5%と74.0%で、統計的な双子は75.7%と74.7%とわずかに高いが、人による違いの29〜30%しか保てなかった。個人の情報を加えても、LLMの得点は73.1%から73.8%に上がるだけだった（抄録）。", "fun": "アンケートの答えをAIに予想させてよく当たったら、すごいと思うだろうか。実は「みんなが選びそうな答え」を全員に当てはめるだけで、かなり当たってしまう。この研究は、手の込んだAIの「分身」もその単純なやり方とほぼ同じ成績で、人ごとの違いは29〜30%しか再現できていないことを示した。平均が合っていることと、一人ひとりを当てられることは別物だと分かる。", "unverified": "各手法の実装の詳細、得点の定義は抄録になく未確認。著者は、結果は試した実装に限られると述べている。"}}, {"id": "pr25", "rank": 25, "headline": "意見の一致を測るLLM審査は言い換えと順序で揺れる", "title": "Measuring Stability and Biases of LLM-as-a-Judge for Opinion Alignment", "url": "https://doi.org/10.21203/rs.3.rs-11510348/v1", "authors": "Samuele D'Avenia ほか", "venue": "Research Square (In Review)", "date": "2026-11-25", "apa": "D’Avenia, S., Madeddu, M., Casola, S., Basile, V., & Patti, V. (2026). Measuring Stability and Biases of LLM-as-a-Judge for Opinion Alignment. https://doi.org/10.21203/rs.3.rs-11510348/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "2つの意見がどれだけ一致しているかをLLMに採点させる方法は、どのLLMを審査役にしても不安定で、長い文章と審査役自身の好む見解に点が偏ることを示した。", "p3": "一致度の得点が満たすべき2つの不変性、すなわち審査の指示を言い換えても変わらないことと、2つの意見の役割（候補と参照）を入れ替えても変わらないことを、11の審査モデルと3つのデータセットで検査した（抄録）。", "p5": "すべての審査役が不安定で、順序を入れ替えると10%超の組で得点が尺度の30%超動いた。不安定さは長さの違う組と、審査役がどちらかを好む組に集中し、候補が長いとき、候補が審査役の好む見解のときに得点が高かった（抄録）。", "fun": "作文の採点を先生に頼むとき、2枚の答案を出す順番を入れ替えただけで点が変わったら困る。ところがAIを採点役にすると、まさにそれが起きた。しかもAIは長い文章と、自分が賛成する意見に甘かった。この採点をご褒美にしてAIを訓練すると、人の多様な意見ではなく「長くて採点役好みの意見」を書くAIが育ってしまう、という警告になっている。", "unverified": "11の審査モデルの名前、3つのデータセットの内容、言い換えによる変動の大きさは抄録になく未確認。"}}, {"id": "pr26", "rank": 26, "headline": "道徳心理の指示でLLMは人の意見の割れに近づくか", "title": "Do moral-psychology prompts make LLM verdicts more human-like? Two pre-registered studies of LLM verdicts versus human disagreement", "url": "https://doi.org/10.5281/zenodo.24517372", "authors": "Tunjay Seyidali", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-11-24", "apa": "Seyidali, T. (2026). Do moral-psychology prompts make LLM verdicts more human-like? Two pre-registered studies of LLM verdicts versus human disagreement (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.24517372", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録（OpenAlexに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "日常の対人トラブルについてのLLMの判定の分布を人々の判定の分布に近づけようと、道徳心理学にもとづく推論の指示やペルソナを与えても、近づかないことを事前登録の2研究で示した。", "p3": "Scruplesコーパスの投票つきの60話について、gpt-oss-20bに話・条件ごとに10回判定させ、人の投票の分布とのずれをJensen–Shannonダイバージェンスで測った。視点取得・認知的共感・公正感受性に沿う指示やペルソナを、統制条件と比べた（抄録）。", "p5": "研究1では、判定の前に構造化した評価を書かせると人の分布からのずれが直接の判定より17%増え、道徳心理の内容に差し替えても差は検出されなかった。研究2では、3特性のペルソナは無関係な好みのペルソナと変わらなかった（抄録）。", "fun": "「悪いのはどっち？」という身近なもめごとは、人によって答えが割れる。AIに尋ねるときも、多数派の答えだけでなく「どのくらい意見が割れるか」まで再現できるかが問われる。そこで人の心理に沿って「相手の立場で考えて」と指示してみたが、かえって人の分布から離れた。答えがばらつくようになることと、人に似ることは別だった、というのが発見だ。", "unverified": "ずれの絶対的な大きさ、検定の詳細、他のモデルでも同じかは抄録の範囲では未確認。1つのモデル・60話での結果である。"}}, {"id": "pr27", "rank": 27, "headline": "74万の合成ペルソナで利用者の書き方を再現", "title": "PersonaFactory: Stylistic User Prompt Augmentation with Synthetic Persona Bank", "url": "https://arxiv.org/abs/2611.34785", "authors": "Bich Ngoc Doan ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Doan, B. N., Yukhymenko, H., & Schlag, I. (2026). PersonaFactory: Stylistic User Prompt Augmentation with Synthetic Persona Bank (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34785", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "属性を細かく定めた合成ペルソナを大量に作り、既存の利用者の入力文をそのペルソナの書き方に書き換えることで、多言語で文体の多様な対話データを生成する仕組みを示した。", "p3": "背景と話し方の特徴を構造化したペルソナを生成し、その視点で既存の入力文を書き換える。74万超のペルソナと、85言語・約124万件の会話を作り、文体の再現と意図の保持をLLMの審査と経験則の指標で評価した（抄録）。", "p5": "属性にもとづく構造化した文体の表現は、自由記述のペルソナより軸ごとの制御がしやすく、同程度の文体の再現度で意図をよく保った。専門家の評価でも会話はもっともらしいとされた（抄録）。", "fun": "AIを育てるには大量の「利用者の質問」が要るが、AIに質問文を作らせると、みな同じような平板な文になってしまう。実際の人は言語も口調もばらばらだ。この研究は、背景や話し方の癖を細かく決めた架空の人物を74万人以上用意し、同じ質問を「その人ならどう書くか」に書き換えた。質問の中身は変えずに書き方だけを変える、という分け方が工夫だ。", "unverified": "評価の具体的な数値、ペルソナの属性の項目、専門家評価の人数は抄録になく未確認。"}}, {"id": "pr28", "rank": 28, "headline": "電話型の音声AIで独居高齢者の孤独感が下がる", "title": "Knocking on Minds Door; A Mixed-Methods Field Study of a Voice LLM Companion in Older Adults Daily Lives", "url": "https://arxiv.org/abs/2611.33727", "authors": "Inhee Cho ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Cho, I., Jeong, J., Kim, B. J., Baek, J., Lee, J., Park, J., & Yoo, Y. (2026). Knocking on Minds Door; A Mixed-Methods Field Study of a Voice LLM Companion in Older Adults Daily Lives (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33727", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "電話のように向こうからかけてくる音声のLLMの話し相手を、地域で暮らす高齢者が2週間使った実地研究で、孤独感と抑うつの得点が下がった。", "p3": "ペルソナ、会話の規則、過去の通話の記憶（事実・気づき・関係の背景）で通話を組み立てる話し相手を開発し、韓国の地域在住の高齢者33人（女性29人、67〜91歳）で、通話記録・前後の質問紙・面接を集めた（抄録）。", "p5": "参加者は608回通話し、25人は期間後も使い続けた。孤独感と抑うつの得点は有意に下がり、孤独感の下位因子では孤立（情緒的孤独）だけが有意に下がった。家族に言わない心配事を話した参加者もいた（抄録）。", "fun": "スマホの画面操作が苦手なお年寄りでも、電話なら話せる。この研究は、AIのほうから電話をかけてくる話し相手を作った。2週間で孤独感がやわらぎ、家族には言えない心配事を打ち明ける人もいた。参加者が大事だと感じたのは、名前で呼ばれること、前の話を覚えていてくれることだったという。人づきあいの基本がそのまま効いているのが面白い。", "unverified": "得点の変化の大きさ、対照群の有無（抄録からは前後比較と読める）、使ったLLMは抄録になく未確認。"}}, {"id": "pr29", "rank": 29, "headline": "離脱の評価を現行の委託先に頼ると依存が続く", "title": "日本におけるSIer媒介型ベンダーロックイン：離脱評価がいかにエンタープライズITにおける依存を持続させうるか", "url": "https://doi.org/10.51094/jxiv.7259", "authors": "武田, 紘一", "venue": "Jxiv", "date": "2026-11-18", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Jxivに登録された抄録（日本語・英語）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "日本の大企業のIT調達で、特定の製品から離れられない状態が続く仕組みを、製品のベンダー・SIer・ユーザー企業の三者関係から「SIer媒介型ベンダーロックイン」として概念化した。", "p3": "公開資料にもとづく探索的な概念研究。離脱を評価する能力が現任のSIerに蓄積すること、そのSIerの能力と収益が当該ベンダーとの関係に結びついていることという2つの依存が、離脱評価の経路でつながる構図を整理した（抄録）。", "p5": "知識の移転が不十分なまま、離脱を検討するたびに現任SIerへの評価の依存が再生産され、結果としてベンダーへの依存が続くと論じる。離脱が難しい理由は費用だけではなく、この機構は日本に固有でもないとする（抄録）。", "fun": "「今の業者をやめるべきか」を、やめられると困る当の業者に相談する。そんな構図が企業のITで起きやすい、というのがこの論文の指摘だ。乗り換えが難しいのは費用が高いからだと考えがちだが、ここでは「乗り換えを判断する力」そのものが相手側にたまっていくことが問題になる。二者の関係では見えず、三者を並べて初めて見える仕組みである点が面白い。", "unverified": "実証データによる検証は行われていない（概念研究）。根拠にした公開資料の範囲と事例は抄録からは分からない。"}}, {"id": "pr30", "rank": 30, "headline": "住宅価格とSNSの痕跡で近隣の変化を多面的に測る", "title": "Beyond Gentrification: quantifying the economic, social and cultural dimensions of neighbourhood change through housing markets and digital traces", "url": "https://arxiv.org/abs/2611.34214", "authors": "Alexis Comber ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Comber, A., Asher, M., Wang, Y., Kieu, M., Quang, B. T., Thuy, H. N. T., Huu, P. H., & Malleson, N. (2026). Beyond Gentrification: quantifying the economic, social and cultural dimensions of neighbourhood change through housing markets and digital traces (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34214", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "住宅価格・人口構成・SNSの投稿を組み合わせ、地域の変化を1つの指標にまとめずに、経済・社会・文化の側面の組み合わせとして6つの型に分けた。", "p3": "英国のリーズとブラッドフォードで、2014〜2019年の住宅価格（近隣250地区との相対）、居住移動、民族構成、失業、専門職の変化率を小地域ごとに求め、約160万件の位置つき投稿をトピックモデルやLLMで特徴づけて、モデルにもとづくクラスタ分析に入れた（抄録）。", "p5": "構造的な指標と投稿の語りが食い違う地域が繰り返し見つかった。住民の入れ替わりが速いのに投稿には現れない地域や、安定しているのに停滞・衰退と誤って特徴づけられかねない地域があった。投稿の少なさは変化がないことを意味しないとも述べる（抄録）。", "fun": "街が変わるとき、家の値段が上がる、住む人が入れ替わる、話題が変わる、といったことは同時に起きるとは限らない。この研究は不動産の数字とSNSの投稿を別々のものさしとして使い、両者が食い違う場所を探した。数字の上では住民が大きく入れ替わっているのに、投稿には何も現れない地域があった。ネットに声が出ないことと、何も起きていないことは違う、という指摘が大事だ。", "unverified": "6つの型それぞれの定義と地区数、モデルの適合度は抄録になく未確認。"}}, {"id": "pr31", "rank": 31, "headline": "豪州の自治体はインフラ資産をほぼ4〜5年で再評価", "title": "How Often Do Australian Councils Revalue Their Assets? Evidence from 100 Audited Financial Statements, 2024–25 and 2025–26", "url": "https://doi.org/10.5281/zenodo.24518915", "authors": "Landmark Valuations Research", "venue": "Zenodo", "date": "2026-11-25", "apa": "Landmark Valuations Research. (2026). How Often Do Australian Councils Revalue Their Assets? Evidence from 100 Audited Financial Statements, 2024–25 and 2025–26. Landmark Valuations. https://doi.org/10.5281/ZENODO.24518915", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された作業論文の抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "オーストラリアの自治体が土地・建物・道路などの資産をどのくらいの間隔で再評価しているかを、監査済みの財務諸表100件から実際に数えた。", "p3": "各州・準州が会計基準に上乗せしている規則を読み、各法域の公式の一覧から無作為の順に取り出した自治体（131に当たり100件を入手）の最新の監査済み財務諸表から、最後の包括的な評価の時期を読み取った（抄録）。", "p5": "評価の間隔を定めるのは西オーストラリア州（5年）だけだった。決算日時点で、最後の包括的な評価からの経過年数の中央値は2年だった。間隔を定めない5つの州では72自治体中67が当年に再評価差額を計上し、西オーストラリア州では20中2だった（抄録）。", "fun": "市役所は道路や建物をいくらの価値として帳簿に載せているのだろう。会計のルールは「十分な頻度で評価し直すこと」としか言っていない。そこでこの研究は、100の自治体の決算書を1件ずつ読んで実態を数えた。あいまいな決まりのもとでも、評価し直す周期には自然と相場ができていた。決まりの文面ではなく、実際の書類から実務を確かめる地道さが面白い。", "unverified": "作業論文で査読を経ていない。入手できなかった自治体が結果に与える影響、資産の種類ごとの内訳は抄録の範囲では未確認。"}}, {"id": "pr32", "rank": 32, "headline": "不正検知の表形式トランスフォーマを損得で直接調整", "title": "From Prediction to Decision: Decision-Focused Fine-Tuning of Autoregressive Tabular Transformers for Cost-Sensitive Financial Events", "url": "https://arxiv.org/abs/2611.34858", "authors": "Ashkan Golgoon ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Golgoon, A., Domeniconi, G., Atkins, S., Servantez, S., & Khandwala, Z. (2026). From Prediction to Decision: Decision-Focused Fine-Tuning of Autoregressive Tabular Transformers for Cost-Sensitive Financial Events (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34858", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "不正などの金融の出来事を予測する表形式のトランスフォーマを、確率の当てやすさではなく、金額に応じた損得（期待効用）が最大になるように直接微調整する方法を示した。", "p3": "取引の列をトークン化して事前学習した自己回帰モデルの、ラベルのトークンに限ったソフトマックスを業務上の行動の分布とみなす。報酬は行動・結果・金額の既知の関数なので、期待効用とその勾配が閉じた形で得られる。事前学習モデルへのKLの錨と補助の言語モデル項で較正を保つ（抄録）。", "p5": "抄録は方法の構成を述べており、数値の結果は示していない。標本抽出や批評器、アドバンテージの推定が要らない、例ごとに費用が異なる費用考慮型の学習になると説明する（抄録）。", "fun": "不正な取引を見つけるAIは、ふつう「不正である確率」を当てるように訓練する。でも金融機関にとって、高額の不正を見逃す損と、少額の正しい買い物を誤って止める損は釣り合わない。この研究は、確率ではなく「金額で測った損得」が良くなるようにAIを直接鍛える方法を提案した。何を良い答えとみなすかを変えると、同じAIでも鍛え方が変わる、という発想が面白い。", "unverified": "抄録に実験結果の数値がなく、従来のしきい値による方法に比べてどれだけ改善するかは未確認。使ったデータも抄録からは分からない。"}}, {"id": "pr33", "rank": 33, "headline": "因果グラフが定まらなくても通用する改善策を探す", "title": "Robust Recourse under Causal Graph Ambiguity", "url": "https://arxiv.org/abs/2611.34723", "authors": "Muyan Anna Li ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Li, M. A., Sinnott, J., Kohandel, M., & Karimi, A.-H. (2026). Robust Recourse under Causal Graph Ambiguity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34723", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "不利な判定を覆すための行動を勧める「リコース」で、データに合う因果グラフが複数あって決められないときにも通用する、低費用の行動を探す方法を示した。", "p3": "候補のグラフすべてで成功する行動を探す最悪ケース型と、グラフの重みの一定割合で成功すればよいとする重みつき型を提案した。グラフごとにガウス過程の構造方程式を当てはめ、勾配にもとづく探索で最小費用の行動を求める（抄録）。", "p5": "20ノードのベンチマークでは、頑健性の条件をゆるめると、行動を提示できる事例が1,000件中341件から436件に増える一方、生成モデルのもとで本当に判定が覆る件数は251件から184件に減り、提示できる範囲と有効性の交換関係が示された（抄録）。", "fun": "審査に落ちた人に「ここをこれだけ変えれば通ります」と助言するには、何を変えると何が変わるかという因果の地図が要る。ところがその地図は、同じデータから何通りも描けてしまう。この研究は「どの地図でも通用する助言」を探した。安全を重視すると助言できる人が減り、ゆるめると助言は増えるが外れも増える。親切さと確かさの板ばさみが数字で見える。", "unverified": "合成・半合成のベンチマークでの結果で、実データでの検証は抄録の範囲では未確認。候補グラフの集合をどう用意するかも不明。"}}, {"id": "pr34", "rank": 34, "headline": "頑健な改善提案は多数派に偏るという副作用", "title": "Beyond Robust Algorithmic Recourse: Sharing the Burden of Validity through Model Multiplicity", "url": "https://doi.org/10.48550/arxiv.2611.32543", "authors": "Prakhar Ganesh ほか", "venue": "arXiv", "date": "2026-11-24", "apa": "Ganesh, P., Taïk, A., & Farnadi, G. (2026). Beyond Robust Algorithmic Recourse: Sharing the Burden of Validity through Model Multiplicity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.32543", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（OpenAlexに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "モデルが更新されても有効な「頑健な」改善提案は、多数派の振る舞いに近い方向へ提案を偏らせて格差を広げることを示し、有効性を保つ負担を個人だけに負わせない方法を提案した。", "p3": "不利な判定を覆すための行動の提案（リコース）で、頑健性の要請が実行可能な提案をデータの高密度な領域に制約することを分析した。同程度に良いモデルが複数あること（多重性）を使い、運用者がモデルを戦略的に選んで有効性を保つ（抄録）。", "p5": "頑健でない提案は将来無効になる危険があり、頑健な提案は不公平を生むという交換関係は、個人だけが有効性の負担を負うという暗黙の前提から生じると論じ、モデル選択で負担を分け合えばこの緊張を解けると主張する（抄録）。", "fun": "「こう直せば次は審査に通ります」と助言しても、審査のしくみが後で変われば無駄になる。だから「しくみが変わっても通用する助言」が良いとされてきた。ところがその安全な助言は、多数派と同じような姿を目指させるものになり、少数派に不利だという。この研究は、努力を個人だけに求めず、審査する側がしくみの選び方で歩み寄るという逆転の発想を示した。", "unverified": "抄録に実験の数値がなく、不公平がどの程度生じ、提案法でどれだけ減るかは未確認。"}}, {"id": "pr35", "rank": 35, "headline": "軌道データが一致しても大域的な性質は決まらない", "title": "Structural Non-Identifiability and Quantitative Certification of Nonlinear Dynamics from Trajectory Data", "url": "https://doi.org/10.20944/preprints202611.2701.v1", "authors": "Robert Vrabel", "venue": "Preprints.org", "date": "2026-11-26", "apa": "Vrabel, R. (2026). Structural Non-Identifiability and Quantitative Certification of Nonlinear Dynamics from Trajectory Data. https://doi.org/10.20944/preprints202611.2701.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "有限個の観測された軌道とぴったり一致するモデルを作っても、大域的な安定性や平衡点の一意性といった長期の性質は原理的に保証できないことを証明し、保証に必要な追加の情報を示した。", "p3": "2次元以上の滑らかなモデルでは、観測の近傍のベクトル場を保ったまま、離れた場所の力学を任意に差し替えられることを示す。逆に、空間のδ網の上でヤコビアンの推定を保証できれば、α>ε+Lδのとき領域的な縮小性が言えることも示す（抄録）。", "p5": "大域的な漸近安定性、大域的な縮小性、局所安定な平衡点の一意性は、記録からは証明できない。粘性減衰のある機械系でも、同一の実験結果・復元力・エネルギー・散逸則が、安定なポテンシャルの井戸の数の異なる系と両立する（抄録）。", "fun": "ボールの転がり方を何回か完全に記録できたとしても、まだ転がっていない場所にくぼみがいくつあるかは分からない。この論文はそれを数学として証明した。データとぴったり合うモデルでも、観測していない場所ではいくらでも違う振る舞いを仕込めるからだ。「データに合う」ことと「先々まで保証できる」ことの間には、埋められない溝があると分かる。", "unverified": "定理の証明と前提条件の詳細、数値例の有無は抄録の範囲では未確認。査読前の原稿である。"}}, {"id": "pr36", "rank": 36, "headline": "ノイズの分布を知らずに効率的にFIR系を同定", "title": "Asymptotically Efficient Finite Impulse Response System Identification without Noise Knowledge", "url": "https://arxiv.org/abs/2611.34039", "authors": "Zichen Liu ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Liu, Z., & Mu, B. (2026). Asymptotically Efficient Finite Impulse Response System Identification without Noise Knowledge (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34039", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "ノイズの分布を知らなくても、また裾の重いノイズでも、理論上最良の精度に達する有限インパルス応答（FIR）システムの同定法を示した。", "p3": "一致性のある初期推定の残差から核密度推定でノイズの分布を見積もり、それで尤度を近似する2つの推定量（eMLEとepMLE）を作る。1ステップのニュートン・ラフソン法で計算する（抄録）。", "p5": "緩い正則条件のもとで、どちらの推定量も一致性と漸近正規性をもち、クラメール・ラオの下限に達することを示した。さまざまなノイズ分布のシミュレーションで、最小二乗法と最小絶対偏差法より頑健で正確だった（抄録）。", "fun": "測定にはノイズがつきものだが、そのノイズがどんな形で散らばるかは事前には分からない。ふつうは形を仮定して計算する。この研究は、まずざっくり推定し、残った誤差からノイズの形そのものをデータに教えてもらう。そうすると、ノイズの形を最初から知っていた場合と同じ精度に届くことが多いという。知らないことをデータから補う発想が面白い。", "unverified": "シミュレーションの具体的な条件と数値、実データでの検証の有無は抄録になく未確認。"}}, {"id": "pr37", "rank": 37, "headline": "同定用の入力を引数空間を埋めるように設計", "title": "Gaussian Processes for Optimal Space-Filling Input Design", "url": "https://arxiv.org/abs/2611.34712", "authors": "M\\'at\\'e Kiss ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Kiss, M., Liu, Y., Schoukens, M., & Tóth, R. (2026). Gaussian Processes for Optimal Space-Filling Input Design (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34712", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "非線形システムの同定に使う実験の入力信号を、モデルの引数の空間を満遍なく埋めるようにガウス過程で設計する方法を示した。", "p3": "非線形の近似器が受け取る引数の空間で、データが空間を埋める分布になるよう入力を設計する。V最適・D最適といった実験計画の最適性の理論と結びつけ、実験の目的に対する情報量を最大にするよう調整できる（抄録）。", "p5": "シミュレーションの例で、空間を埋める信号で学習したモデルは、そうでない実験から得たモデルより、関心のある領域で良く一般化した（抄録）。", "fun": "機械のふるまいをデータから学ぶとき、同じような条件ばかり試したデータでは、試していない条件で大きく外す。だから「どんな入力で実験するか」が大事になる。この研究は、起こりうる状態の地図をまんべんなく塗りつぶすような入力の作り方を示した。テスト勉強で、得意な分野ばかりでなく全範囲を一通りやるのに似ている。", "unverified": "抄録に数値がなく、対象にした系、改善の大きさ、計算量は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "打撃ハンマの質量と先端でFRFの帯域が変わる", "title": "Impact Hammer Selection for Resonance Testing of Bituminous Mixture Slabs: Experimental and Numerical Investigation", "url": "https://doi.org/10.21203/rs.3.rs-11394150/v1", "authors": "Ana Karoliny Lemos Bezerra ほか", "venue": "Research Square (In Review)", "date": "2026-11-25", "apa": "Bezerra, A. K. L., Carret, J.-C., Mangiafico, S., & Sauzéat, C. (2026). Impact Hammer Selection for Resonance Testing of Bituminous Mixture Slabs: Experimental and Numerical Investigation. https://doi.org/10.21203/rs.3.rs-11394150/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "アスファルト混合物の板を叩いて共振を測る試験で、ハンマの質量と先端の硬さが、励起できる周波数の帯域と見つかる振動モードを左右することを実験と解析で示した。", "p3": "厚さの違う2枚の長方形の板で、小型の鋼ハンマと、鋼・樹脂・軟質樹脂・超軟質樹脂の先端を交換できる通常のハンマを使い、力と加速度から周波数応答関数を求めた。線形粘弾性モデルの3次元解析でモードを同定し、実験と照合した（抄録）。", "p5": "通常のハンマに樹脂または鋼の先端を付けると0〜3000Hzに適切な周波数成分が得られ、最初の2つの曲げモードを同定できた。小型の鋼ハンマは低周波の加振が弱く、超軟質の先端はごく低い周波数にエネルギーが集中した（抄録）。", "fun": "ものを叩いて音や揺れを調べる検査は、スイカを叩いて中身をみるのと同じ発想だ。ただ、何で叩くかで結果が変わる。この研究は道路の舗装材の板で、ハンマの重さと先端の硬さを変えて確かめた。小さな鋼のハンマでは低い揺れが十分に起きず、とても柔らかい先端ではごく低い揺れしか起きなかった。測りたい揺れに合わせて道具を選ぶ必要がある、という基本を実証している。", "unverified": "板の寸法と厚さ、固有振動数の値、実験と解析の一致の程度（数値）は抄録になく未確認。"}}, {"id": "pr39", "rank": 39, "headline": "濃いエマルションも粒状体の流動則に従う", "title": "Soft Matter, Hard Rules: Emulsions Follow the Laws of Granular Suspension Rheology", "url": "https://arxiv.org/abs/2611.33526", "authors": "Wenjun Chen ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Chen, W., De Giuli, E., Wyart, M., Forterre, Y., Brujić, J., & Metzger, B. (2026). Soft Matter, Hard Rules: Emulsions Follow the Laws of Granular Suspension Rheology (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33526", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "濃いエマルション（混ざり合わない液滴の集まり）の流れ方が、粒の集まりの流れ方と同じ法則で整理できることを実験で示した。", "p3": "従来の体積を固定する測り方ではなく、最近開発された装置Capillarytronで浸透圧を制御変数にした。浸透圧が液滴の変形を通じて、圧力に依存するジャミング（詰まり）の体積分率を決めるとみなす（抄録）。", "p5": "ジャミング点からの距離で表すと、浸透圧を課した測定と体積分率を課した測定のすべてのデータが1つのべき乗則の発散に重なった。得られた構成則は調整パラメータなしで、ニュートン流動・降伏・ずり流動化の領域を説明する（抄録）。", "fun": "食品や薬に使われる濃い乳液と、砂や粉のような粒の集まりは、まったく別物に見える。ところが「詰まって動けなくなる点までどれだけ余裕があるか」で整理すると、乳液の流れやすさは粒の集まりと同じ法則に乗った。液滴は柔らかいので、押す力によって詰まる点が動くだけだという。柔らかい物も硬い粒と同じ決まりに従う、という統一の見方が面白い。", "unverified": "べき指数の値、使った試料、測定範囲は抄録になく未確認。"}}, {"id": "pr40", "rank": 40, "headline": "AIエージェントが実行中のDEM計算を読み書きする", "title": "Connecting AI Agents to Live Discrete Element Simulations via the Model Context Protocol", "url": "https://arxiv.org/abs/2611.33926", "authors": "Yusong Han ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Han, Y., Uzuoka, R., & Ueda, K. (2026). Connecting AI Agents to Live Discrete Element Simulations via the Model Context Protocol (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33926", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "汎用のAIエージェントが、計算の進行中に個別要素法（DEM）のシミュレーションを読み、変更し、止められるようにする接続の仕組み（MCPサーバ）を作り、公開した。", "p3": "マニュアルを検索・閲覧する2つの道具と、コードの実行、長い計算の投入、状況の確認、実行中のモデルの読み取り、停止の5つの道具を、商用のPFCと公開のYADEの両方で提供する。人は従来どおりエンジンの画面で作業を続けられる（抄録）。", "p5": "密な豊浦砂の排水三軸試験のモデルを実験データに合わせる較正を、エージェントが両方のエンジンで行った。YADEでの同じ較正を7つの言語モデルに人の介入なしで各3回させると、21回中20回が目標に達し、19組のパラメータが許容範囲の中の小さな1領域に集まった（抄録）。", "fun": "砂粒を一つひとつ計算する模擬実験は、条件を少し変えては何時間も待つ、根気のいる作業だ。この研究は、AIが計算の途中経過をのぞき、設定を直し、必要なら止められる「つなぎ役」を作った。砂の実験結果に計算を合わせる作業を7種類のAIに任せると、21回のうち20回で目標に届いた。しかも人が同じ画面で作業していると、AIがそれに気づいて対応したという。", "unverified": "較正の目標値と誤差、各言語モデルの名前、所要時間は抄録になく未確認。"}}, {"id": "pr41", "rank": 41, "headline": "大規模な斜面崩壊が起こす地盤振動を物質点法で予測", "title": "Simulating Ground Vibrations Induced by Hypothetical Large Scale Slope Collapse Using Unified Geomechanical and Seismic Methods", "url": "https://doi.org/10.21203/rs.3.rs-11448330/v1", "authors": "João Pedro Delveaux ほか", "venue": "Research Square (In Review)", "date": "2026-11-26", "apa": "Delveaux, J. P., Figueiredo, R. P., Eikmeier, C. N., & Afanasiev, M. (2026). Simulating Ground Vibrations Induced by Hypothetical Large Scale Slope Collapse Using Unified Geomechanical and Seismic Methods. https://doi.org/10.21203/rs.3.rs-11448330/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "鉱山の大規模な斜面崩壊が起きた場合に周囲の地盤がどう揺れるかを、崩壊の力学計算と地震波の伝播計算をつないで予測する手法を示した。", "p3": "地上の干渉レーダーの監視と変形のデータから3次元の応力・ひずみ解析で崩壊面を定め、物質点法（MPM）で土塊の移動による動的な接触力を計算し、それを震源としてスペクトル要素法（SEM）で実際の地質構造の中の波動伝播を解く（抄録）。", "p5": "露天掘り鉱山での1千万トン級の急な崩壊を想定し、3次元の地形・多層の地質境界・岩質の不均質を弾性モデルに入れて、表面波の増幅や幾何学的な広がりなどを15Hzまで捉え、最大速度・最大加速度・波形の場所による違いを定量化した（抄録）。", "fun": "斜面が一気に崩れると、落ちた土砂が地面を叩いて、地震のような揺れが周りに伝わる。この研究は、まだ起きていない崩壊について、土砂の動きの計算と揺れの伝わり方の計算をつなぎ、近くの施設がどれだけ揺れるかを前もって見積もる。従来の研究は「地震が地すべりを起こす」向きの計算が中心だが、ここでは逆に「崩壊が揺れを起こす」向きに計算をつないだ点が新しい。", "unverified": "予測された揺れの大きさの具体的な値、対象の鉱山、内部減衰を除いたことの影響は抄録の範囲では未確認。実測との照合の有無も不明。"}}, {"id": "pr42", "rank": 42, "headline": "施設の復旧と住民のサービス回復は別々に進む", "title": "Resilient Cities Through Services and Relationships: Infrastructure, Social Inclusion and Decisions Under Uncertainty", "url": "https://doi.org/10.17613/vxz8q-zjn58", "authors": "HUANG, Wanhong", "venue": "Zenodo", "date": "2026-11-25", "apa": "HUANG, W. (2026). Resilient Cities Through Services and Relationships: Infrastructure, Social Inclusion and Decisions Under Uncertainty. Knowledge Commons. https://doi.org/10.17613/VXZ8Q-ZJN58", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された報告書の抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "災害後の都市の回復を、施設の修理が終わることと、住民がそのサービスを再び使えるようになることの2つに分けて捉え、平均的な損失を減らす復旧策が弱い立場の人に不利に働きうることを示した。", "p3": "災害の記録、都市のアクセスの地理的な分析、エージェントベースモデルを組み合わせた。モデルでは進化的な探索で修理と支援の組み合わせを選び、同じ予算の技術的な組み合わせと比べた（抄録）。", "p5": "援助から排除される条件では、平均の損失を減らすよう選んだ組み合わせは都市全体のサービスを改善する一方、100回の模擬のうち78回で脆弱な層の無サービスの世帯・日数の割合を増やした。脆弱な層の損失で選ぶと24回に減った。洪水が重なると46回と45回だった（抄録）。", "fun": "施設が直ったと発表されても、支援を受けにくい人の家でサービスが実際に使えるようになるのは、もっと後かもしれない。この報告は、「施設が直った日」と「住民が実際に使えるようになった日」を分けて数えることを提案する。街全体の平均を良くする復旧の進め方が、弱い立場の人の取り分をかえって悪くする場合が、模擬実験100回中78回で起きた。平均だけを見る危うさが分かる。", "unverified": "報告書で査読を経ていない。モデルの設定、対象にした都市と災害記録、結果の頑健性は抄録の範囲では未確認。"}}, {"id": "pr43", "rank": 43, "headline": "日中韓1.5万件の投稿から観光の混雑への見方を比較", "title": "Geopolitical Tensions, Chinese Tourism to South Korea, and Perceptions of Tourism Overcrowding: A Multilingual Text-Mining Study of 15, 000 Chinese, Japanese, and Korean Online Comments", "url": "https://econpapers.repec.org/RePEc:zbw:esrepo:344261", "authors": "Chae, Jinwoo", "venue": "RePEc NEP", "date": "2026-11-09", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "RePEc（NEP）に掲載された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "訪韓する中国人観光と観光地の混雑についてのネット上の書き込みを、中国語・日本語・韓国語で同じ手順で分析し、言語圏ごとに関心の向きが違うことを示した。", "p3": "中国語・日本語・韓国語の書き込みを各五千件、計一万五千件集め、多言語の前処理、頻度分析、キーワードの共起ネットワーク、感情分析、トピックモデル、内容の符号化（混雑、インフラへの負荷、住民の不便、経済的な便益など）を組み合わせた（抄録）。", "p5": "中国語の書き込みは旅行の機会と行きやすさを、日本語は地域の政治関係と行き先の比較を、韓国語は都市の混雑、住民の不便、訪問客の経済的な影響を多く論じていた。個々の書き込みを国民全体の見解と同一視しないよう注意を促している（抄録）。", "fun": "同じ「韓国への中国人観光」という話題でも、どの言語で書かれた書き込みを読むかで見える景色が変わる。中国語では「行きやすさ」、日本語では「国どうしの関係」、韓国語では「混雑と住民の迷惑、そして経済への影響」が中心だった。旅行する側、横で見ている側、迎える側で関心が違うことを、三つの言語の書き込みを同じ手順で比べて確かめた点が面白い。", "unverified": "書き込みの収集元と期間、感情分析やトピックの具体的な結果の数値は抄録になく未確認。"}}, {"id": "pr44", "rank": 44, "headline": "全人口ネットワークでつながりと信頼の関係を調べる", "title": "Cross-domain network embeddedness and generalised trust: Evidence from a whole-population network in the Netherlands", "url": "https://doi.org/10.5281/zenodo.24466229", "authors": "Milena Costa", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-11-24", "apa": "Costa, M. (2026). Cross-domain network embeddedness and generalised trust: Evidence from a whole-population network in the Netherlands. Zenodo. https://doi.org/10.5281/ZENODO.24466229", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoの発表資料の抄録（OpenAlexに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "オランダの全住民をつなぐ行政データのネットワークを使い、人のつながりが家族・職場・近隣など複数の領域にどうまたがっているかと、他者一般への信頼との関係を調べる研究の発表資料。", "p3": "オランダ統計局が構築した約1,700万人の多層ネットワーク（家族・世帯・近隣・職場・教育）から個人ごとの指標を作り、社会的結束と幸福の調査（2020〜2023年、28,483人）の一般的信頼と結びつけた。領域をまたぐ埋め込みを、多重性と参加の均等さの2つで測る（抄録）。", "p5": "抄録は結果の数値を示していない。方法上の貢献として、家族と世帯の登録簿の行政上の重なりを考慮した、調整済みの多重性の指標を開発したと述べる（抄録）。", "fun": "人のつながりと他人への信頼の関係を調べるには、ふつう本人に友人の数などを尋ねる。この研究はそうではなく、国の登録簿から作った全住民約1,700万人分のつながりの地図を使う。家族、同じ世帯、近所、職場、学校という別々の場で、同じ相手と重なってつながっているか、どの場にもまんべんなくつながっているかを測るという発想が面白い。", "unverified": "修士論文の研究の発表資料の要約で、信頼との関係の結果（向きや大きさ）は抄録になく未確認。"}}, {"id": "pr45", "rank": 45, "headline": "孤独と前向きな独りは別の心理特性と結びつく", "title": "Distinct Personality and Motivational Profiles of Loneliness and Positive Solitude", "url": "https://doi.org/10.21203/rs.3.rs-11871867/v1", "authors": "Veronika Juríčková ほか", "venue": "Research Square (In Review)", "date": "2026-11-26", "apa": "Juríčková, V., Doubková, N., Heissler, R., Knížková, K., Mohr, P., & Preiss, M. (2026). Distinct Personality and Motivational Profiles of Loneliness and Positive Solitude. https://doi.org/10.21203/rs.3.rs-11871867/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "望まない「孤独」と自分で選ぶ「前向きな独り」は、結びつく性格の特徴と動機がはっきり異なることを示した。", "p3": "チェコの成人1,725人を対象に、パーソナリティ機能、不適応的なパーソナリティ特性、独りでいる動機の向きが、孤独感と前向きな独りのそれぞれにどれだけ独自に寄与するかを階層的回帰分析で調べた（抄録）。", "p5": "孤独感は、パーソナリティ機能の障害、離脱、否定的感情、自己決定的でない動機と最も強く関連した。前向きな独りは主に自己決定的な動機と関連し、パーソナリティ機能や不適応的な特性との関連は比較的小さかった（抄録）。", "fun": "一人でいることは、寂しいこととは限らない。好きで一人の時間を過ごす人もいる。この研究は1,725人の調査から、寂しさは性格面のつまずきや「自分で選んだのではない独り」と結びつき、心地よい独りは「自分で選んだ独り」と結びつくことを示した。同じ「一人」でも、理由が自分の意思かどうかで意味が変わる、という点が大事だ。", "unverified": "関連の強さの数値、使った尺度の名前、標本の集め方は抄録になく未確認。横断調査のため因果の向きは分からない。"}}, {"id": "pr46", "rank": 46, "headline": "ナイジェリア大手の財務諸表に気候リスクは未反映", "title": "Climate Risk in the Numbers: Do Nigerian Financial Statements Reflect the IASB's 2025 Climate Uncertainty Examples Ahead of IFRS S2?", "url": "https://doi.org/10.5281/zenodo.24557802", "authors": "Davies, Joseph", "venue": "Zenodo", "date": "2026-11-26", "apa": "Davies, J. (2026). Climate Risk in the Numbers: Do Nigerian Financial Statements Reflect the IASB's 2025 Climate Uncertainty Examples Ahead of IFRS S2? (Version 4.0). Zenodo. https://doi.org/10.5281/ZENODO.24557802", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された作業論文の抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "ナイジェリアの大手上場企業14社の監査済み財務諸表と監査報告書に、気候リスクが実際に反映されているかを採点し、ほとんど反映されていないことを示した。", "p3": "監査済みの注記の中にある気候関連の記載だけを数える7指標の「連結性指数」を作り、銀行・石油ガス・セメント・通信の14社の2025年度の書類に当てはめた。公開したコードブックにもとづきAIが符号化し、著者が確認した（抄録）。", "p5": "14社中9社は無記載で、会計とつながっていると判定された企業はなかった。貸出の気候ストレステストを行う銀行は、その結果を監査済みの財務諸表の外で報告していた。監査報告書で気候に触れたのは2件で、監査上の主要な検討事項とした例はなかった（抄録）。", "fun": "企業は気候変動のリスクを報告書で語るようになった。では、その話は決算の数字や注記にまで届いているのか。この研究は、監査を受けた部分だけに絞って調べた。すると14社のうち9社では、監査済みの部分に気候の話がなかった。報告書の言葉と、監査を受ける決算書の中身との間に境目があることが見えてくる。", "unverified": "作業論文で査読を経ていない。7つの指標の内容と採点基準、AIによる符号化の一致度は抄録になく未確認。"}}, {"id": "pr47", "rank": 47, "headline": "公立大病院の15年の診療実績と財務を年報から追う", "title": "Service Disruption, Recovery, and Financial-Operational Context in a Public Tertiary Hospital: A Longitudinal Study of AIIMS New Delhi, 2010-2025", "url": "https://doi.org/10.21203/rs.3.rs-11663476/v1", "authors": "KOTESWARA RAO VEGINATI ほか", "venue": "Research Square (In Review)", "date": "2026-11-25", "apa": "VEGINATI, K. R., KAFILA, & KUDALI, P. (2026). Service Disruption, Recovery, and Financial-Operational Context in a Public Tertiary Hospital: A Longitudinal Study of AIIMS New Delhi, 2010-2025. https://doi.org/10.21203/rs.3.rs-11663476/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "インドの大規模な公立病院の長年の年報から、診療の量と財務の推移を1つの時系列にまとめ、2020〜2021年の診療の落ち込みとその後の回復の大きさを見積もった。", "p3": "AIIMSニューデリーの2010–2011年度から2024–2025年度の公開の年報から、外来・入院・処置・病床・稼働率・在院日数と財務指標の系列を作り、長期のトレンドモデル、区分したパルスと傾きのモデル、センター固定効果モデルを推定した（抄録）。", "p5": "2020–2021年度の外来・入院・処置は、それ以前の傾向から61.0%、44.5%、62.1%低かったと推定された。2024–2025年度には外来が2019–2020年度より9.7%、入院が34.7%、処置が27.6%多く、名目の収入と支出は70.1%と68.4%増えた（抄録）。", "fun": "大きな病院は、毎年どれだけの患者を診て、いくら使ったかを年報で公表している。この研究はその年報を長年分つなぎ合わせ、2020〜2021年に外来が大きく落ち込んだこと、その後どこまで戻ったかを数字で追った。面白いのは「戻った」の基準が2つあることで、落ち込む前の実績と比べるのか、それまでの伸びが続いていれば届いたはずの水準と比べるのかで評価が変わる。", "unverified": "財務指標の内訳と定義、欠測や定義変更のある年の扱いの詳細は抄録の範囲では未確認。著者は推定値が因果効果ではないと明記している。"}}, {"id": "pr48", "rank": 48, "headline": "動く波源の軌道はどこまで復元できるか", "title": "From causal kernel to spectral gap: sensitivity and identifiability of a moving Gaussian source in the wave equation (1D and 2D)", "url": "https://doi.org/10.5281/zenodo.24527729", "authors": "Sapelyuk, Yaroslav", "venue": "Zenodo", "date": "2026-11-25", "apa": "Sapelyuk, Y. (2026). From causal kernel to spectral gap: sensitivity and identifiability of a moving Gaussian source in the wave equation (1D and 2D). Zenodo. https://doi.org/10.5281/ZENODO.24527729", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "波動方程式の中を動く波源の軌道を観測から逆算する問題で、どの部分が復元でき、どの部分が原理的に復元できないかを数値と解析の両面から整理した。", "p3": "1次元と2次元で、ガウス型の波源の軌道をBスプラインで表し、チホノフの正則化つきの最小化で逆推定する。順問題は1次元ではダランベールの積分、2次元ではポアソン積分と差分で解き、ヤコビアンの階数と特異値を診断した（抄録）。", "p5": "観測の初期の窓でヤコビアンの有効な階数が構造的に落ちることと、観測の終わり近くに「見えない区間」ができることを数値で見いだし、後者は波の有限の伝播速度によると説明した。軌道の末尾が同定できないことの定理と、見える部分の局所的な同定可能性の命題を示す（抄録）。", "fun": "動きながら波を出す物の位置を、波の記録から逆算したい。ところが波は有限の速さでしか伝わらないので、観測を打ち切る直前に出た波はまだ観測点に届いていない。だから軌道の最後の部分は、どんなに工夫しても分からない。この研究は、その「見えない区間」ができる仕組みを式で示した。分からないことの範囲をきちんと決めるのも科学の仕事だと分かる。", "unverified": "数値実験の誤差やノイズの条件の詳細、定理の前提は抄録の範囲では未確認。査読を経ていないZenodo上の文書で、コードは請求に応じて提供とある。"}}, {"id": "pr49", "rank": 49, "headline": "高い製品は耐久性の試験でも少しだけ良い", "title": "What a Price Premium Buys: Product-Level Evidence on Price, Tested Quality, and Durability from 743 Consumer-Test Groups in Four European Markets", "url": "https://doi.org/10.21203/rs.3.rs-11774817/v1", "authors": "Pavel Kopczyk", "venue": "Research Square (In Review)", "date": "2026-11-26", "apa": "Kopczyk, P. (2026). What a Price Premium Buys: Product-Level Evidence on Price, Tested Quality, and Durability from 743 Consumer-Test Groups in Four European Markets. https://doi.org/10.21203/rs.3.rs-11774817/v1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "値段の高い製品は長持ちするのかを、欧州の消費者テストの実測データで確かめ、価格と耐久性の間に弱いながらも正の関係があることを示した。", "p3": "チェコ・ドイツ・英国・スペインの消費者テスト機関の743の試験群・11,943件の製品（2005〜2026年）で、同じ試験の中での価格と総合評価・耐久性の実測を比べた。試験群の約40%で仮説を作り、事前登録のうえ残りで検証した（抄録）。", "p5": "検証用の標本で、価格と総合評価の試験内の順位相関は.45だった。品質全般を考慮したあとの耐久性との関連は.26（95%信頼区間.15〜.37）だった。平均の価格順位が高いブランドは、所有者が報告した故障が少なかった（−.37、122のブランド・品目の組）（抄録）。", "fun": "「高いものは長持ちする」と言われるが、本当だろうか。買う前に値段は比べられても、何年もつかは分からない。この研究は、消費者団体などが実験室で行った試験の結果を11,943件集めて確かめた。高い製品はたしかに少し長持ちする傾向があったが、その結びつきは強くない。値段だけでは耐久性の手がかりとして十分でないことが、数字で見える。", "unverified": "製品の品目の内訳、耐久性の測定方法、相関の種類の詳細は抄録の範囲では未確認。"}}, {"id": "pr50", "rank": 50, "headline": "授業の乱れは生徒対応のストレスを介して教員の負担に", "title": "Classroom Disruption and Teacher Workplace Well-Being in Uzbekistan: The Mediating Role of Behaviour-Related Stress in TALIS 2024", "url": "https://doi.org/10.21203/rs.3.rs-10734945/v1", "authors": "Feruza Shakirova ほか", "venue": "Research Square (In Review)", "date": "2026-11-26", "apa": "Shakirova, F., & Shorustamboyeva, S. (2026). Classroom Disruption and Teacher Workplace Well-Being in Uzbekistan: The Mediating Role of Behaviour-Related Stress in TALIS 2024. https://doi.org/10.21203/rs.3.rs-10734945/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "授業が乱されることと教員の職場でのwell-beingの関係の一部が、生徒の行動に関するストレスを経由していることを、国際調査のウズベキスタンのデータで示した。", "p3": "仕事の要求度-資源モデルと資源保存理論にもとづき、OECDのTALIS 2024の前期中等教育の教員（全標本4,431人、変数がそろう1,466人）で、調査の重みと反復複製法（100組の重み）の標準誤差を使った回帰による媒介分析を行った（抄録）。", "p5": "生徒の行動に関するストレスを通る間接的な経路は有意で（間接効果0.082、95%信頼区間0.057〜0.106）、推定された全体の関連の22.5%を占めた。直接の経路も有意で、媒介は部分的だった。自己効力感や経験年数による調整は検出されなかった（抄録）。", "fun": "授業中に騒ぐ生徒がいると先生は疲れる。それは当たり前に思えるが、どういう道筋で負担になるのかは別の問いだ。この研究は、授業の乱れが「生徒への対応のストレス」を通じて先生の負担感につながる分が、全体の22.5%だと見積もった。残りは別の道筋ということになる。当たり前に見える関係を、経路ごとに分けて大きさを測るところが研究らしい。", "unverified": "横断データのため因果の順序は示されていない（著者も明記）。尺度の項目内容、他国との比較は抄録の範囲では未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "複雑な仕事ほど若手をAIに置き換えにくい", "title": "Will AI Replace Juniors? How Task Complexity Reduces Automation Risk", "url": "https://arxiv.org/abs/2611.34099", "authors": "Vincent Rost ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Rost, V., & Stephany, F. (2026). Will AI Replace Juniors? How Task Complexity Reduces Automation Risk (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34099", "why": "ドイツの情報経済と製造業の1,435社の管理職を対象にした事前登録の調査実験。追加の人手が必要な業務を、定型的な業務か、専門的な判断と文脈の知識が要る複雑な業務かに無作為に割り当てた。複雑な業務では、新人を雇う代わりにAIを使う意向が5段階で0.54点下がり、人による監督の重要度が0.15点上がった。AIが若手の仕事を奪うかどうかは業務の複雑さに左右されることを、企業の判断の側から示した。"}, {"id": "pn02", "rank": 2, "field": "機械学習", "headline": "回路をトークンごとに組み替える注意機構", "title": "Rewirable Circuits in Transformers with Loom Attention", "url": "https://arxiv.org/abs/2611.30634", "authors": "Da Xiao ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-25", "apa": "Xiao, D., Meng, Q., Li, S., & Yuan, X. (2026). Rewirable Circuits in Transformers with Loom Attention (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2611.30634", "why": "ヘッドが先行するヘッドの出力に向ける縦の注意と、トークンに向ける横の注意を織り合わせる「ルーム注意」を提案した。圧縮したヘッド出力を持つ行列の記憶を第2の残差流として使う。言語モデルの学習と下流課題で、3倍超の計算量で学習したTransformerに並び、同じ3,000億トークン・FLOPs2%増の条件で既存の残差流の改良より高い下流性能を得たと報告する。Hugging Faceで投票数92。"}, {"id": "pn03", "rank": 3, "field": "統計学", "headline": "模擬課題から推論の規則そのものを学習する", "title": "Learning to Infer: Statistical Inference through Meta Learning", "url": "https://arxiv.org/abs/2611.33742", "authors": "Xiaolu Li ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Li, X., & Yang, Y. (2026). Learning to Infer: Statistical Inference through Meta Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33742", "why": "ニューラルネットワークが模擬データの課題から統計的推論の規則を学び、新しいデータにパラメータ更新なしで適用するメタ学習を、統計的決定理論で定式化した。学習目的の最小解がベイズ規則になるよう設計し、推定の漸近有効性、モデル選択の一致性、高次元回帰の変数選択の保証を示す。順序に依存しない集約と残差更新を繰り返す構造を提案する。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "企業間取引網での位置が衝撃の伝わり方を決める", "title": "Beyond Firm Size: Network Position and Shock Transmission in Firm-to-Firm Production Networks Across Five Economies", "url": "https://doi.org/10.2139/ssrn.7749842", "authors": "Glenn Magerman ほか", "venue": "SSRN", "date": "2026-11-25", "apa": "Magerman, G., Palazzolo, A., Dhyne, E., Borsos, A., Kulikov, D., Linarello, A., Paulus, A., Romanini, G., & Saldias, M. (2026). Beyond Firm Size: Network Position and Shock Transmission in Firm-to-Firm Production Networks Across Five Economies. https://doi.org/10.2139/ssrn.7749842", "why": "ベルギー・エストニア・ハンガリー・イタリア・ポルトガルの付加価値税の行政記録から、企業間の生産ネットワークを同じ基準で構築した。企業規模と中心性は集計への一次の影響を要約するが、生産連鎖の上下の位置は規模と直交し、衝撃の伝わり方を左右する。産業内の規模のばらつきの約半分は、生産性ではなく顧客数を反映するという。"}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "証拠が足りないのに答えるAIの「怠け」を矯正", "title": "Lazy Agents Answer Against Their Own Beliefs: Reinforcement Learning with Verifiable Beliefs Teaches Them to Act on What They Believe", "url": "https://arxiv.org/abs/2611.32884", "authors": "Richmond Sin Jing Xuan ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-25", "apa": "Xuan, R. S. J., Feng, P., Wang, W., & Poria, S. (2026). Lazy Agents Answer Against Their Own Beliefs: Reinforcement Learning with Verifiable Beliefs Teaches Them to Act on What They Believe (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.32884", "why": "長い課題でエージェントが、自分の表明した信念がまだ複数の答えを残している段階で回答を確定してしまう現象を示した。学習時にシミュレータが答えの正確な事後分布を計算できることを使い、事後分布がまだ複数の答えを許す間は調査を続け、証拠が足りたら確定することに報酬を与える強化学習を提案する。審査用のモデルや報酬モデルは要らない。Hugging Faceで投票数98。"}, {"id": "pn06", "rank": 6, "field": "因果推論", "headline": "分布やネットワークが結果でも効果の異質性を推定", "title": "Geodesic Causal Forests: Learning Heterogeneous Treatment Effects for Random Objects", "url": "https://arxiv.org/abs/2611.33350", "authors": "Yidong Zhou", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Zhou, Y. (2026). Geodesic Causal Forests: Learning Heterogeneous Treatment Effects for Random Objects (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33350", "why": "結果が構成比・共分散行列・分布・ネットワークのように線形構造のない距離空間の対象であるときの、条件つきの処置効果を推定する因果フォレストを提案した。測地線に沿う輸送で個人間の効果を比較可能にし、足し引きができない代わりに二乗距離の損失を補正する。ユークリッド空間では二重頑健な学習に一致し、一致性と収束率を示す。"}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "賃金交渉が採用で不利になる水準は女性で低い", "title": "When Does Negotiation Backfire? Gender, Job Levels, and Wage Demand Levels", "url": "https://doi.org/10.31235/osf.io/wn8p9", "authors": "Yuriko Morikawa ほか", "venue": "SocArXiv", "date": "2026-11-25", "apa": "Morikawa, Y., & Takikawa, H. (2026). When Does Negotiation Backfire? Gender, Job Levels, and Wage Demand Levels. https://doi.org/10.31235/osf.io/wn8p9", "why": "日本企業の採用担当者967人への要因配置型の調査実験で、応募者の性別、応募する職位、自社の賃金水準に対する要求額を変え、交渉しない場合と採用の見込みを比べた。要求額が上がると交渉は不利に働き、その不利は管理職で非管理職より低い要求水準から現れ、同じ職位では女性で男性より低い水準から現れた。"}, {"id": "pn08", "rank": 8, "field": "経済学", "headline": "FOMCの議論の不一致が成長リスクの予測を改善", "title": "Reading the Room with AI: FOMC Deliberation and Growth-at-Risk", "url": "https://arxiv.org/abs/2611.34423", "authors": "Alvaro Ortiz (BBVA Research) ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Ortiz, A., & Rodrigo, T. (2026). Reading the Room with AI: FOMC Deliberation and Growth-at-Risk (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34423", "why": "会合の3週間後に公開されるFOMCの議事要旨から熟議の特徴を取り出し、FRED-MDの123系列による成長率の分位点モデルに加えた。投票には現れないが議論の中にある不一致だけが、標本外の損失を4〜6%下げ、専門家・スタッフ・委員会の予測を超える情報を持っていた。委員会が明示するリスク評価より、記録された議論そのものに情報があることを示す。"}, {"id": "pn09", "rank": 9, "field": "統計学", "headline": "登録簿だけの国勢調査は照合誤りが大きな壁", "title": "The Illusion of an Automated German Census: Assessing the Feasibility of the 2031 Register-Based Census via Simulation", "url": "https://arxiv.org/abs/2611.33949", "authors": "R. Schnell (University of Duisburg-Essen) ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Schnell, R., & Weiand, S. V. (2026). The Illusion of an Automated German Census: Assessing the Feasibility of the 2031 Register-Based Census via Simulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33949", "why": "ドイツが2031年に予定する、行政の登録簿だけによる初の国勢調査の実現可能性を、約8,021万人の合成人口で検証した。氏名や生年月日などの準識別子で登録簿を照合する際の品質を1,458の条件で変えると結果は大きく振れ、現実的な想定でも登録簿1つにつき50万〜100万件の照合漏れが生じうる。自動化だけでは難しく、手作業の後処理が要ると示唆する。"}, {"id": "pn10", "rank": 10, "field": "工学", "headline": "粗い予報と疎な観測から高解像度の解析場を生成", "title": "BridgeSRDA: Efficient Probabilistic Super-Resolution Data Assimilation with Forecast-Informed Stochastic Interpolants", "url": "https://arxiv.org/abs/2611.33720", "authors": "Aditya Sai Pranith Ayapilla ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Ayapilla, A. S. P., Yasuda, Y., & Onishi, R. (2026). BridgeSRDA: Efficient Probabilistic Super-Resolution Data Assimilation with Forecast-Informed Stochastic Interpolants (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33720", "why": "低解像度の数値予報と、疎でノイズのある観測を組み合わせて高解像度の解析場を生成する、確率的な超解像データ同化の枠組みを示した。予報の情報を取り込んだ確率的な輸送をニューラルネットワークが学び、アンサンブルを生成する。学習時と異なる3次元準地衡流で評価し、高解像度の局所アンサンブル変換カルマンフィルタに近い精度を得たと報告する。"}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "負債の重い企業は排出枠の引き締めに反応しない", "title": "Leverage and the Low-Carbon Transition in Europe", "url": "https://doi.org/10.2139/ssrn.7753344", "authors": "Katia Vozian ほか", "venue": "SSRN", "date": "2026-11-25", "apa": "Vozian, K., Giuzio, M., Kapadia, S., & Salakhova, D. (2026). Leverage and the Low-Carbon Transition in Europe. https://doi.org/10.2139/ssrn.7753344", "why": "EU排出量取引制度の2,421社の検証済み排出量を使い、2015年の制度の引き締めを利用して企業のレバレッジと排出削減の関係を調べた。排出枠が不足する企業は余剰のある企業より排出効率を10〜15%改善したが、それは負債比率が約40%未満の企業に限られ、負債の重い企業は反応しなかった。排出量取引の効果が企業の財務状態に依存することを示す。"}, {"id": "pn12", "rank": 12, "field": "統計学", "headline": "RI-CLPMが識別できる条件を厳密に導く", "title": "The Random Intercept Cross-Lagged Panel Model as a Statistical Model: Identification, Estimation, and Model Comparison", "url": "https://arxiv.org/abs/2611.34663", "authors": "Zihao Cao", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "個人間の安定した差と個人内の時間差の関連を分けるランダム切片交差遅延パネルモデルの統計的な性質を、行列表現で調べた。遷移行列と誤差共分散が時点ごとに変わる場合の大域的な識別の必要十分条件を導き、遷移が一定なら3時点で足りる条件を示す。従来の交差遅延モデルの係数がどれだけずれるかの式も与える。"}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "現実から模擬環境を作る手法を共通の土台で評価", "title": "Real2SimLab: A Unified Platform for Real-to-Simulation Transfer", "url": "https://arxiv.org/abs/2611.34849", "authors": "Yongchang Zhang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-26", "why": "映像などの実世界の観測からシミュレーションのプログラムを生成する研究で、ベンチマークごとに入力・成果物・採点が異なる問題に対し、手法が書いたプログラムを実行して各ベンチマーク本来の採点器で評価する統一基盤を示した。学習データと報酬の注釈を作るパイプラインも提供し、評価用の映像との重複を除く。Hugging Faceで投票数100。"}, {"id": "pn14", "rank": 14, "field": "組織行動・心理的安全性", "headline": "長時間働くCEOほど部下の評価を受けたがらない", "title": "The CEOs Who Won't Be Measured: Access, Self-Other Gaps and Working Hours in a Preregistered CEO-Team Study", "url": "https://doi.org/10.31234/osf.io/3jwg6", "authors": "Bill Gallagher", "venue": "PsyArXiv", "date": "2026-11-25", "why": "CEOの労働時間とリーダーシップの関係を部下の評価で調べる事前登録研究。推定6万人以上に依頼して回答したCEOは90人、条件を満たす49人のうち必要な3人以上の部下評価が得られたのは15人だった。部下の名簿を出さなかったCEOは週に約8時間長く働いていた（p=.09）。CEOは自分の強みと弱みの順位を部下と同じように認識するが、自己評価は高めだった。"}, {"id": "pn15", "rank": 15, "field": "環境・気候政策", "headline": "陸面モデルCLM5を微分可能にしてGPUで動かす", "title": "CLM-JAX v3.2.46: a differentiable, GPU-accelerated land surface model numerically indistinguishable from the Community Land Model 5.0", "url": "https://arxiv.org/abs/2611.34574", "authors": "Shijin Yuan ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "FortranのCommunity Land Model 5.0をPython（JAX）で実装し直し、エネルギー・水・炭素・窒素・作物の過程の結合を保ったままGPUで動き、多段階の時間積分を通して勾配を逆伝播できるようにした。2019〜2023年の全球5年間・32変数で、元のモデル自身の微小な摂動によるばらつき以内に誤差が収まることを確かめた。"}, {"id": "pn16", "rank": 16, "field": "因果推論", "headline": "主層の無視可能性が破れたときの鋭い感度分析", "title": "Sharp sensitivity bounds and maximin policy learning under violations of principal ignorability", "url": "https://arxiv.org/abs/2611.33585", "authors": "Sihyung Park ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "遵守者での割り当て効果の識別に使う主層の無視可能性は検証できない。平均と範囲だけに基づく従来の感度分析は観測データと両立しない分布を許してしまうため、観測された結果の分布と遵守者の割合を保つ分布的な感度モデルを作り、効果と方策の価値の鋭い境界を導いた。二重頑健な推定と、最悪の場合に備える方策学習も示す。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "無作為化実験で割り当てに従った人たち（遵守者）での効果を調べるときの検証できない仮定が破れた場合に、効果がどの範囲に収まるかを、観測データと矛盾しない最も狭い形で求める方法を示した。", "p3": "主層の無視可能性からのずれを表す感度モデルを、観測された結果の分布全体と遵守者の割合を保つ形で作る。観測された混合分布の中の遵守者の分布のうち、割り当ての両群で両立するものを厳密に特徴づけ、鋭い境界を得る（抄録）。", "p5": "遵守者の割合がずれの大きさを制約するため、感度のパラメータを有限に制限しなくても情報のある境界が残ることを示した。二重頑健な一致性と半パラメトリック効率の条件、最悪の場合に備える決定木の方策も与え、オレゴン医療保険実験に適用した（抄録）。", "fun": "くじ引きで制度の対象者を決めても、当たったのに利用しない人がいる。すると「くじに従った人」にとっての効果を知るには、確かめようのない仮定が要る。この研究は、その仮定が外れていた場合に結論がどこまで動くかを、データと矛盾しない範囲でぎりぎりまで絞り込む方法を作った。仮定を信じ切るのではなく、外れた場合の幅を示すという姿勢が面白い。", "unverified": "境界の具体的な幅、数値実験の条件、オレゴンの実験への適用結果の数値は抄録になく未確認。"}}, {"id": "pn17", "rank": 17, "field": "機械学習", "headline": "言語モデルと画像モデルの内部は回転でほぼ重なる", "title": "The Platonic Representation Hypothesis in Jacobian-Space: Language and Vision Models Agree Approximately Up to a Rotation", "url": "https://arxiv.org/abs/2611.33304", "authors": "Ross Murphy ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "異なる種類のデータで学習したモデルが共通の表現に収束するという仮説を、活性化ではなく、内部表現が出力に与える影響を表すヤコビアンの空間で調べた。語彙や分類クラスごとのベクトルが作る空間が言語モデルと画像モデルの間で対応し、その対応はほぼ1つの回転で表せるという証拠を示す。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "言語モデルと画像モデルは、世界の表し方だけでなく、内部表現が出力をどう動かすかという働きかけ方でも、ほぼ1つの回転で互いに写せるほど似ていることを示した。", "p3": "Transformerのある層で、語彙の各語（または分類のクラス）について、その語を出す傾向を最も高める隠れ状態のベクトルをヤコビアンから求め、その集まり（J空間）をモデル間で比べた。一部の語で当てはめた1つの回転を、残りの語に適用する（抄録）。", "p5": "一部の語で当てはめた回転は、当てはめに使っていない語やクラスにも通用した。文章だけで学習した言語モデルの語のベクトルを回転して画像言語モデルの画像パッチに加えると、そのモデルが画像にあると答える物体が、加えた領域でだけ変わった（抄録）。", "fun": "文章だけを読んで育ったAIと、画像を見て育ったAIは、まったく別の「頭の中」を持っていそうに思える。ところが、ある言葉を出したくなる方向を表す矢印を集めて比べると、片方の矢印の束をぐるっと回すだけで、もう片方にほぼ重なった。回した矢印を画像のAIに足すと、そこにその物があると答えるようになる。学び方が違っても似た地図に行き着くらしい。", "unverified": "調べたモデルの名前と数、一致の度合いの数値は抄録になく未確認。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "自動化は労働課税に頼る国の財政を圧迫する", "title": "AI, Automation, and Fiscal Pressure", "url": "https://arxiv.org/abs/2611.34234", "authors": "Spencer Bastani ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "労働を資本より重く課税し、医療や教育を税で賄う国で自動化が財政に与える影響を、タスク単位の自動化を入れた2部門の一般均衡モデルで調べた。自動化は所得を課税の軽い資本へ移す。EU27か国に合わせた基準シナリオでは、自動化で経済が12%成長する一方、財政赤字が付加価値の約1ポイント増える。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "自動化が進むと、労働に重く課税し公共サービスを税で賄う国では、経済が成長しても財政赤字が広がりうることを、一般均衡モデルで示した。", "p3": "タスク単位の自動化を、2部門からなる一般均衡モデルに組み込み、EU諸国のデータに合わせて較正した。自動化は所得を、課税の軽い資本の側へ移す（抄録）。", "p5": "公共サービスが消費者の需要に従うなら、税率を変えない限り赤字は悪化し、公共サービス部門の自動化が民間と同じ速さでも変わらない。市場部門の自動化が速いEU-27の基準シナリオでは、自動化で経済が12%成長する一方、赤字が付加価値の約1ポイント増える（抄録）。", "fun": "ロボットやAIで仕事が自動化されれば経済は成長する。それなら国の財政も楽になりそうだが、この研究は逆になりうると言う。対象の国々は、働く人の所得に重く税をかけ、資本のもうけには軽くかけている。自動化で所得が労働から資本へ移ると、税収が伸びにくくなるからだ。成長と財政が食い違う、という意外な指摘である。", "unverified": "モデルの詳細な仮定、国別の結果、税制を変えた場合の試算は抄録の範囲では未確認。"}}, {"id": "pn19", "rank": 19, "field": "統計学", "headline": "模擬器の誤りによる系統誤差を影響マップで測る", "title": "When precision exceeds fidelity: systematic error quantification for inference with misspecified simulators", "url": "https://arxiv.org/abs/2611.33282", "authors": "M. J. Yantovski-Barth ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "データの精度が上がると、パラメータ推論の不確かさは測定ノイズよりシミュレータ自体の系統誤差で決まる。誤特定のもとではベイズの証拠が最も近いモデルに集中し、モデル平均が系統誤差を過小評価しうる。データの摂動に対する推定値の局所的な応答（影響マップ）を既存の事後標本から推定し、食い違いの残差を伝播させて系統誤差の源を切り分ける方法を示す。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "データが精密になると、推定の誤差は測定のノイズよりシミュレータ自体の不完全さで決まる。そのような系統誤差の出どころを、既存の事後標本から効率よく切り分ける方法を示した。", "p3": "推定したパラメータがデータの摂動にどう応答するかを表す「影響マップ」を、既存の事後標本でのシミュレータの順方向の評価から推定する。シミュレータとデータの食い違いの残差をこのマップに通し、偏りの源を個別に分ける（抄録）。", "p5": "超大質量ブラックホールの質量を推定する独立な観測に適用すると、誤差はモデルの系統誤差が支配していた。全モデルに共通する単純化を特定して一次の補正をかけると、各モデル内での観測間の整合が大きく改善し、モデル間のばらつきは残った（抄録）。", "fun": "ものさしの目盛りがどんどん細かくなると、最後に残る誤差は「読み取りのぶれ」ではなく「ものさし自体の狂い」になる。科学の計算モデルも同じで、観測が精密になるほど、モデルの単純化による偏りが目立つ。この研究は、データが少しずれたら答えがどれだけ動くかという地図を作り、どの単純化が答えを狂わせているかを突き止めた。ブラックホールの質量の推定で試している。", "unverified": "補正の前後の数値、対象の天体、使ったモデルの数は抄録になく未確認。"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "気候への関心が高い地域ほど保険料がリスクを反映", "title": "Who Pays for Climate Risk? Household Attention, Insurance Markets, and Regulation", "url": "https://doi.org/10.2139/ssrn.7727383", "authors": "Lin Peng ほか", "venue": "SSRN", "date": "2026-11-25", "why": "米国の郡単位のデータで、住民の気候への関心が災害リスクと住宅保険料・住宅価格の関係をどう変えるかを調べた。関心が1標準偏差高いと、保険料のリスクへの反応が16.7%強まる。操作変数と不動産サイトの気候リスク表示の導入も因果的な解釈を支持する。保険料の規制が厳しい州では保険料の反応が弱く、住宅価格の割引が大きい。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "住民が気候変動に関心を持っている地域ほど、住宅保険料と住宅価格が災害リスクを強く反映することを、米国の郡のデータで示した。", "p3": "郡単位のデータで、災害リスクと年間の平均保険料・住宅価格の関係が、住民の気候への関心によってどう変わるかを調べた。操作変数による推定と、不動産サイトRedfinの2021年の気候リスク情報という情報の衝撃を使った（抄録）。", "p5": "関心が1標準偏差高いと、保険料の災害リスクへの反応が16.7%強まる。保険料率の規制が厳しい州では関心に伴う保険料の反応が弱く、住宅価格の割引が大きい。規制の緩い州では、規制の厳しい州からの保険料の波及が関心の高い郡で9.1%強い（抄録）。", "fun": "災害の危険が高い土地なら、保険料は高く、家は安くなるはずだ。でも実際にそうなるかは、住民がその危険を気にしているかどうかに左右される。気候に関心の高い地域ほど、保険料も家の値段も危険を強く映していた。さらに、保険料を規制で抑えた州があると、その費用がよその州の世帯に回る可能性があるという。リスクの費用は消えずに誰かが払う。", "unverified": "気候への関心の測り方、対象の年と郡の数、操作変数の中身は抄録になく未確認。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "低賃金企業は離職先が失業であることが多い", "title": "The Churn Ladder", "url": "https://doi.org/10.2139/ssrn.7753820", "authors": "Lawrence Warren ほか", "venue": "SSRN", "date": "2026-11-25", "why": "労働者が低賃金・高離職の企業から高賃金・低離職の企業へ移る「離職のはしご」を実測した。標準的なジョブラダーモデルは引き抜きだけでは企業間の離職率の差を再現できず、低賃金企業ほど非就業への離職が多いことが差を広げている。企業と労働者の両方の離職率の異質性を入れ、賃金と離職の同時分布を再現する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "労働者が低賃金で離職の多い企業から高賃金で離職の少ない企業へ移っていく「離職のはしご」を実測し、標準的な理論ではその傾きを説明できないことを示して、モデルを拡張した。", "p3": "標準的なジョブラダーモデルでは、引き抜きだけでは企業間の離職率のばらつきが小さすぎる。企業と労働者の両方に離職率の異質性を入れ、内生的な選別を生じさせて、賃金と離職の同時分布を再現した（抄録）。", "p5": "低賃金の企業ほど非就業への離職も多く、これがはしごの上下での離職の差を大きくしていた。労働者の異質性だけで、非就業への離職の企業間のばらつきの半分を説明する。賃金に依存する非就業への離職を無視すると、企業の労働市場での力を過大に見積もる（抄録）。", "fun": "給料の安い会社は人がよく辞める。それは社員が給料のいい会社に引き抜かれるからだ、とこれまでの理論は説明してきた。ところがデータを見ると、引き抜きだけでは辞める人の多さを説明しきれず、安い会社では「辞めて仕事のない状態になる」人も多かった。これを無視すると、会社が賃金を抑える力を大きく見積もりすぎるという。", "unverified": "使ったデータの国と期間、推定された数値の詳細は抄録になく未確認。"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "AIで失う知識職の雇用は総需要しだいで補われる", "title": "When AI Automates Knowledge Work: Aggregate Demand and Occupational Adjustment", "url": "https://doi.org/10.2139/ssrn.7727199", "authors": "Baris Soybilgen", "venue": "SSRN", "date": "2026-11-25", "why": "AIが担える知識労働のタスクの割合が6年で5%から35%に上がるとき、知識職の人が手作業の職で補える雇用の割合を米国の労働市場モデルで調べた。雇用を左右するのは職の適性より、AIが生む所得がどれだけ支出されるかだった。資本所有者が増えた所得の半分を支出する基本ケースでは、20年で知識職の雇用減の40%が手作業の職で補われる。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "生成AIが知識労働のタスクを担うようになったとき、職を失う人がどれだけ別の仕事に就けるかは、資格よりも、AIが生む所得がどれだけ使われるかで決まることをモデルで示した。", "p3": "米国の労働市場のモデルで、AIが担える知識タスクの割合が6年で5%から35%に上がる場合に、当初知識職に就いていた、または探していた人々を追う。基本の実験では、資本所有者は増えた所得の半分を支出し、金利は下がらない（抄録）。", "p5": "支出と生産は減り、知識職でも手作業の職でも仕事が見つけにくくなる。20年で、手作業の雇用の増加は知識職の雇用減の40%を埋め、さらに2.4ポイントが無職になり、手作業の賃金は22%下がる。全員が手作業の職に就く資格を持っても、無職の割合は最大0.1ポイントしか変わらない（抄録）。", "fun": "AIに知識を使う仕事を取られたら、体を使う仕事に移ればよい、と考えたくなる。この研究のモデルでは、それがうまくいくかは「移る資格があるか」より「世の中でお金が使われるか」で決まった。AIでもうけた人がそのお金をあまり使わなければ、物やサービスが売れず、移る先の仕事も減ってしまう。問題は技能よりも需要だ、という見立てが面白い。", "unverified": "モデルの較正の詳細と前提の根拠は抄録の範囲では未確認。数値はモデルの試算で、実際の観測ではない。"}}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "遠隔交渉は合意しやすいが分け前が不平等になる", "title": "Does Physical Presence Matter? Efficiency and Inequality in Remote Negotiations&nbsp;", "url": "https://doi.org/10.2139/ssrn.7727184", "authors": "Faeze Heydari ほか", "venue": "SSRN", "date": "2026-11-25", "why": "事前登録の実験室実験で、対面とビデオ通話の交渉を最後通牒ゲームで比べた。遠隔では全組が合意し、対面は92%だった。資源が乏しいとき、対面では均等な分配に収束するが、遠隔でははるかに不平等になる。虚偽の申告や疑いの多さでは説明できず、会話と表情の分析は、対面でないと均等分配が共通の基準点として働きにくいことを示唆する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "対面とビデオ通話の交渉を実験で比べ、遠隔では合意はしやすいが、資源が乏しいときに分け前が大きく不平等になることを示した。", "p3": "事前登録の実験室実験で、2人組が対面またはビデオで、乏しい資源か豊富な資源をめぐる最後通牒型の交渉をした。資源の量は提案する側だけが知る。会話をLLMで分類し、表情を自動の感情認識で測った（抄録）。", "p5": "遠隔の組はすべて合意し、対面は92%だった。資源が乏しいとき、対面の組は均等な分配に収束するが、遠隔でははるかに不平等だった。虚偽の申告や疑いが増えたためではない。戦略的で不信のある交渉は、対面では均等に収束するが、遠隔ではそこから外れやすい（抄録）。", "fun": "交渉をオンラインに切り替えると何が変わるのか。この実験では、ビデオ通話のほうが話はまとまりやすかった。ところが分けるものが少ないとき、対面では自然と均等な分け方に落ち着くのに、ビデオでは片方が大きく取る結果になりやすかった。目の前に相手がいると「均等が当たり前」という共通の基準が働くが、画面越しではそれが弱まるらしい。", "unverified": "参加者の数、不平等の大きさの数値、検定の結果は抄録になく未確認。表情と会話の分析は探索的とされている。"}}, {"id": "pn24", "rank": 24, "field": "経済学", "headline": "予測市場に載った言葉が政治家の発言に増える", "title": "How Prediction Markets Affect Political Speech", "url": "https://doi.org/10.31235/osf.io/n6zxw", "authors": "Jonathan Elkobi ほか", "venue": "SocArXiv", "date": "2026-11-25", "why": "政治家が特定の言葉を口にするかに賭ける予測市場が、政治的な発言そのものに影響する可能性を調べた。市場に載った言葉は、開設後の数日間にトランプ氏の発言に現れやすくなり、取引量が多い市場ほど効果が大きい。連邦準備制度理事会議長の記者会見では同様の効果は見られなかった。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "政治家が特定の言葉を口にするかどうかに賭ける予測市場が開設されると、その言葉が実際の発言に現れやすくなることを示した。", "p3": "政治エリートの発言に含まれる特定の語に賭ける「言及市場」と、トランプ氏および連邦準備制度理事会議長の公の発言の関係を分析した。操作、自己成就、正当化という3つの経路を理論的に整理した（抄録）。", "p5": "市場に導入された語は、開設後の数日間、トランプ氏の発言に有意に現れやすくなり、取引量が多い市場ほど効果が大きかった。連邦準備制度理事会議長の記者会見では同様の効果は検出されなかった（抄録）。", "fun": "「政治家が次にこの言葉を言うか」に賭ける市場がある。予測市場は未来を当てる道具のはずだが、この研究によれば、賭けの対象になった言葉は、そのあと実際に発言に出てきやすくなった。取引が多いほどその傾向が強い。未来を「予測する」しくみが、未来そのものを動かしているかもしれないという、少しこわい話だ。", "unverified": "効果の大きさの数値、対象期間と市場の数、因果の識別の方法は抄録になく未確認。どの経路が働いているかは今後の課題とされている。"}}, {"id": "pn25", "rank": 25, "field": "経済学", "headline": "実験の偽陽性が成果連動の報酬をゆがめる", "title": "False Positives and Innovation Incentives: Contracting for Noisy Experimentation", "url": "https://arxiv.org/abs/2611.33916", "authors": "Chang Liu ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "製品の変更がノイズのあるオンライン実験を通過して初めて採用され、報酬が採用に連動する組織を、プリンシパル・エージェントモデルで分析した。価値の低い機能も偶然通過するため、採用連動の賞与は余剰を減らす実験を促す。採用時の賞与と長期の価値の分配を組み合わせた契約を、情報の非対称性のもとで保証できる利得の割合で評価する。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "新機能の採用が誤差のあるオンライン実験の合否で決まり、報酬がその採用に連動する組織で、どんな報酬の契約が望ましいかを理論的に示した。", "p3": "機能の質について私的な知識を持つ担当者が、費用のかかる実験を行うかを選ぶプリンシパル・エージェントモデル。報酬は、採用時の賞与と長期の価値の分配からなる一次式の契約で、有限責任の制約がある。契約は、情報が完全な場合の利得のうち保証できる最大の割合で評価する（抄録）。", "p5": "採用時の賞与は偶然うまくいった機能に報いるため、偽陽性をねらう実験を促す。一方、有限責任のもとでは価値の分配だけでは効率的な実験を引き出せない。最適な契約は、機能の質の標準的な水準、分布の不確かさ、有限責任の厳しさに応じて両者の釣り合いをとる（抄録）。", "fun": "新機能は、試験で成績が良ければ採用される。担当者のボーナスが「採用されたかどうか」で決まるなら、何が起きるか。試験には運の要素があるので、価値の低い案でも偶然通ることがある。すると担当者は、通りそうにない案でも試してみる方向に動いてしまう。この論文は、その困った誘惑を数式で表し、ボーナスの決め方をどう設計すればよいかを考えた。", "unverified": "理論モデルの結果で、実際の企業データでの検証は抄録の範囲では行われていない。最適な契約の具体的な式は未確認。"}}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "無作為化実験のROC曲線をモデルなしで推測", "title": "Design-based causal inference for ROC curves", "url": "https://arxiv.org/abs/2611.34057", "authors": "Bufan Li ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "無作為化実験で処置群と対照群の結果の分布を比べるROC曲線について、結果のモデルを置かない設計に基づく推測を示した。順位だけに依存する推定量の漸近正規性と保守的な分散推定を導き、共変量調整で分散が増えないことを示す。同時信頼帯と上側の裾での推測も扱う。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "無作為化実験で、処置を受けた人の結果が対照群の分布の上位の各水準を超える割合を表すROC曲線について、結果のモデルを仮定せずに推定と信頼区間を作る方法を示した。", "p3": "完全無作為化のもとで、設計に基づく枠組みを採る。両群を合わせた結果の順位だけに依存する推定量を提案し、漸近正規性を示して保守的な分散推定量を構成する。共変量による調整をROCの推定量に直接組み込む（抄録）。", "p5": "共変量調整は推定の対象を変えずに、漸近分散を調整なしの場合以下にする。分位点の内側の範囲での同時信頼帯と、対照群の分布の極端な上側の裾での点ごとの推測にも拡張した。シミュレーションと大規模なオンライン学習の実験で例示した（抄録）。", "fun": "新しいやり方の効果を調べるとき、ふつうは平均の差を見る。でも「新しいやり方を受けた人のうち、従来のやり方の上位の人たちを超えた人はどのくらいいるか」も知りたい。それを全ての水準について描いたのがROC曲線だ。この研究は、結果がどんな分布に従うかを仮定せず、くじ引きで分けたという事実だけを頼りに、この曲線の確かさを評価する方法を作った。", "unverified": "シミュレーションと応用の具体的な数値、実験の規模は抄録になく未確認。"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "学習した重みつきFDR制御の妥当性を事前に認証", "title": "Certifying a Sufficient Gaussian Dependence Regime for Learned Weighted FDR Control", "url": "https://arxiv.org/abs/2611.33892", "authors": "Soyeong Oh", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "補助データから仮説の重みを学習する多重検定で、重みつきBH法の妥当性は検定間の依存の形に左右される。参照データで片側ガウス検定の十分な依存条件を認証し、認証できなければ調整した水準の代替手順に切り替えることでFDRを制御する方法を示した。一様な認証の障害と、必要な標本数のミニマックスの限界も導く。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "補助データから学習した重みを使う多重検定で、偽発見率（FDR）の制御が保たれる条件を参照データで事前に確かめ、確かめられなければ安全な代替手順に切り替える方法を示した。", "p3": "片側のガウス検定について、相関の符号が不確かな組を交差合併検定で調べ、重みつきBenjamini-Hochberg法を使うか、水準を調整した事前指定の代替手順を使うかを決める。認証と検定を条件つきで分離する（抄録）。", "p5": "この手順は、仮定を満たすすべてのガウス相関行列でFDRを制御する。必要な標本数のミニマックスの限界は、調べる組の数の対数と、正の余裕の逆数の2乗で増える。最大4,950組のシミュレーションで、認証と検出力の交換関係を示した（抄録）。", "fun": "たくさんの仮説を一度に調べると、偶然の「当たり」が混じる。それを抑える定番の方法に、別の情報を使って有望そうな仮説に重みを付ける工夫があるが、検定どうしの関係しだいでは誤りの抑えが利かなくなる。この研究は、本番の前に参照用のデータで「この方法を使って大丈夫か」を確かめ、だめなら安全な方法に切り替える仕組みを作った。保険つきの近道である。", "unverified": "シミュレーションの数値結果、Healthy Brain Networkにもとづく設計での結果の詳細は抄録の範囲では未確認。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "低次数の困難性は固有ベクトル検定までは排除しない", "title": "Low-degree hardness rules out eigenvalue tests but not eigenvector tests", "url": "https://arxiv.org/abs/2611.34728", "authors": "Xuan Chen ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "低次数多項式による検出の困難性が、固有値や固有ベクトルに基づく検定に何を意味するかを調べた。一定量のガウスノイズを加えると、低次数の優位が消える問題では固有値に基づくどの検定も働かない。一方、固有値の分布は帰無仮説と完全に同じなのに固有ベクトルで区別できる分布を構成し、固有ベクトル検定は排除されないことを示す。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "低次数多項式では検出できないという「低次数の困難性」が成り立つ問題でも、固有値にもとづく検定は使えなくなる一方、固有ベクトルにもとづく検定は使える場合があることを示した。", "p3": "ガウス直交アンサンブル（GOE）を帰無分布とし、一定量のガウスノイズを加える設定を考える。固有値の結果は、ノイズを3段階に分け、固有値の剛性、ダイソン・ブラウン運動による結合、ガウス平滑化を順に使って証明する（抄録）。", "p5": "低次数の優位が対数次数で消えるなら、ノイズを加えた固有値の同時分布はGOEのそれに全変動距離で収束する。一方、固有値がどのノイズ水準でもGOEと完全に同じ分布なのに、固有ベクトルで区別できる分布を構成した。1本の固有ベクトルで足りる場合もある（抄録）。", "fun": "雑音だらけの大きな表の中に、仕込まれた規則があるかを見分けたい。計算の難しさの目安として「低い次数の多項式で見分けられなければ難しい」という考え方がある。この論文は、その目安が成り立つとき、表の固有値を見る方法は確かに使えなくなるが、固有ベクトルを見る方法は生き残ることがあると示した。同じ行列でも、見る場所で難しさが変わる。", "unverified": "定理の正確な仮定、構成された分布の詳細は抄録の範囲では未確認。"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "カウントのネットワーク回帰に使える並べ替え検定", "title": "Permutation tests for Poisson network regression: Double semi-partialling, studentized statistics and actor effects", "url": "https://arxiv.org/abs/2611.34219", "authors": "David Dekker ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "二者間データの推測に使われるMRQAPを、結果がカウントのポアソン回帰に拡張した。二重の部分残差化が必要とするフリッシュ・ウォー・ロベルの定理の不変性が、対数リンクのもとでも成り立つことを証明し、並べ替えの方法と基準化した統計量が検定の水準をどう保つかを示す。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "人と人の間のやり取りの回数のようなカウントのネットワークデータに対する回帰で、並べ替え検定を正しく使う条件を理論と模擬実験で明らかにした。", "p3": "二者間データの標準的な推測の枠組みMRQAPを、対数リンクのポアソン回帰に拡張した。二重の部分残差化（DSP）が必要とするフリッシュ・ウォー・ロベルの定理の不変性が、非線形のリンクでも成り立つことを証明した（抄録）。", "p5": "共変量の相関が0.9まで、20〜100の行為者のネットワークで、並べ替え検定は名目の水準を保った。正規分布を基準にすると、真の帰無仮説を最大0.96の率で棄却した。送り手と受け手の効果を入れると棄却率は0.035〜0.070になり、0.10の効果への検出力は最大32%から99.9%以上に上がった（抄録）。", "fun": "誰が誰に何通メッセージを送ったか、というデータでは、一人の人が何度も登場するので、普通の統計の検定は当てにならない。実際、この研究では、ふつうのやり方だと「関係がないのに関係ありと判定する」誤りが最大0.96の率で起きた。そこで行為者の番号を入れ替えて何度も計算し直す並べ替え検定を、回数のデータ向けに整えた。つながったデータには、それに合った検定が要る。", "unverified": "模擬実験の条件の全体、EIESのネットワークへの適用結果は抄録の範囲では未確認。"}}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "LLM評価の精度は問題数より出典の数で決まる", "title": "How Many Sources, Not Just How Many Problems: Planning the Precision of LLM Evaluations from Earlier Results", "url": "https://arxiv.org/abs/2611.33622", "authors": "Guang Qiu", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "ベンチマークの問題が同じ雛形やリポジトリに由来するとき、評価の予算は問題数だけでなく出典の数も決める必要がある。級内相関による設計効果を使い、出典を減らしたときの得点の標準偏差の増え方を事前のデータから予測できることを示した。GSM-Symbolicでは10雛形×10変種の標準偏差が9.2ポイント、100雛形では2.7ポイントだった。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "同じ雛形やリポジトリから作った問題を含むベンチマークでLLMを評価するとき、得点のばらつきが問題数だけでなく出典の数で決まることを、事前のデータから予測できると示した。", "p3": "古典的な設計効果と級内相関を使い、同じ予算を少ない出典に集中させたとき得点の標準偏差がどれだけ増えるかを、予測の検証に使うデータとは別のデータから見積もった（抄録）。", "p5": "GSM-Symbolicでは、10雛形×10変種の100問の標準偏差が9.2ポイント、100雛形からの100問では2.7ポイントだった。別の15問の予備データは、その比を3.49と予測し、実測は3.52だった。SWE-bench Verifiedでは10件の提出から119件の中央値の比を3%以内で予測した（抄録）。", "fun": "100問のテストでも、10種類の問題を少しずつ変えた100問と、100種類の別々の問題100問とでは、成績の安定のしかたが違う。前者は同じ型が解けるか解けないかで点がまとまって動くからだ。この研究では、前者の成績のぶれは後者の3倍以上あった。AIの成績表を読むときは、問題の数だけでなく「元になった出典の数」も見ないといけない、と教えてくれる。", "unverified": "方法自体は新しくないと著者が述べている。他のベンチマークでの成績、pass@16で被覆が下がる理由は抄録の範囲では未確認。"}}, {"id": "pn31", "rank": 31, "field": "機械学習", "headline": "微調整による忘却は挙動が先で表現は後から変わる", "title": "Two Timescales of Forgetting in Fine-tuning of Language Models: Fast Behavioral Suppression and Slow Representational Drift", "url": "https://arxiv.org/abs/2611.33302", "authors": "Yilin Luo ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "why": "階層的な潜在構造をもつ人工の文法で事前学習したTransformerを、規則の一部だけで微調整して忘却の過程を調べた。表面の挙動の抑制と、それを支える潜在表現の消去が同時に起きるのかを問い、事前学習とは異なる経過をたどることを示す。題名は、挙動の速い抑制と表現の遅い変化という2つの時間スケールを挙げている。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "言語モデルを限られたデータで微調整するとき、表に出る挙動はすぐに抑えられるが、それを支える内部表現はずっと遅れて失われるという、忘却の2つの時間スケールを示した。", "p3": "階層的な潜在構造をもつ人工の文脈自由文法（Random Hierarchy Model）でTransformerを事前学習し、生成規則の一部だけを使って教師ありの微調整を行い、削除された規則の生成と内部表現の変化を追った（抄録）。", "p5": "削除された規則の生成は、トークンと潜在変数の相関の大きさに反比例する速い時間スケールで変わり、その間、対応する表現は保たれる。表現が忘れられるのははるかに長い時間スケールで、ネットワークのパラメータのゆっくりした漂流に伴う。自然言語の設定でも類似の結果を観察した（抄録）。", "fun": "AIを追加の学習で特定の振る舞いに寄せると、使わなくなった規則はすぐに出力に現れなくなる。では内部からも消えたのか。この研究は、出力に出なくなるのは早いが、内部に持っている表現そのものが消えるのはずっと後だと示した。人が「言わないだけで覚えている」のに少し似ている。表に見える変化と内側の変化は別の速さで進む、という発見だ。", "unverified": "時間スケールの具体的な比、自然言語での実験の設定と数値は抄録になく未確認。"}}, {"id": "pn32", "rank": 32, "field": "機械学習"
