headline": "信用情報の削除は信用を再分配するだけ", "title": "The Equilibrium Effect of Information in Consumer Credit Markets: Public Records and Credit Redistribution", "url": "https://doi.org/10.1162/rest.a.1880", "authors": "Scott L. Fulford ほか", "venue": "Review of Economics and Statistics", "date": "2026-10-22", "sjr": 8.83, "citescore": 10.0, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2}, {"id": "jr16", "rank": 16, "headline": "市場シェア競争の圧力が企業不正を誘う", "title": "EXPRESS: The Dark Side of Competition for Market Share: Competitive Pressure May Trigger Corporate Misconduct", "url": "https://doi.org/10.1177/00222429261503585", "authors": "Lars Kaiser ほか", "venue": "Journal of Marketing", "date": "2026-10-23", "sjr": 12.226, "citescore": 29.5, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Journal of Marketingの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "市場シェアを巡る競争圧力が企業不正を誘い、その不正が圧力の源の市場地位をかえって弱めることを示した（抄録）。", "p3": "実務の理論化から市場シェアに基づく競争圧力の理論（TMCP）と、圧力の異なる面を表す4つの新しい構成概念を提案。254産業の2,145社・11年の世界標本で検証した（抄録）。", "p5": "首位に近く、競合に僅差で追われる企業ほど不正を起こしやすく、不正はその後の市場シェアを系統的に弱めた。環境とガバナンスの不正で罰が特に大きかった（抄録）。", "fun": "トップまであと少し、後ろからも追われている、という状況の会社ほど不正に手を出しやすいという結果です。しかも不正をすると、まさにその焦りの原因だった市場での地位を失ってしまうという、皮肉な循環が描かれています。", "unverified": "4つの構成概念の定義の詳細は未確認。"}}, {"id": "jr17", "rank": 17, "headline": "私的なAI利用がサービス革新に波及", "title": "Understanding the spillover effect of personal AI use on service innovation: the role of psychological capital and conscientiousness", "url": "https://doi.org/10.1108/josm-11-2025-0622", "authors": "Dustin Maneethai ほか", "venue": "Journal of Service Management", "date": "2026-10-23", "sjr": 3.759, "citescore": 24.1, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Journal of Service Managementの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "私生活でのAI利用が仕事でのAI利用を増やし、心理的資本を通じてサービス革新の成果を高めるという波及の過程を示した（抄録）。", "p3": "研究1はサービス従業員438人の3時点調査で、構造方程式モデルにより系列媒介を検証。研究2は日次の経験サンプリングで個人内の動きを調べ、誠実性を境界条件として検討した（抄録）。", "p5": "私的なAI利用 → 仕事のAI利用 → 心理的資本 → サービス革新という系列の過程と、誠実性による調整が仮説として検証された（係数は抄録の取得範囲外）（抄録）。", "fun": "休日にAIで旅行の計画を立てるような経験が、職場でAIを使いこなす自信につながり、新しいサービスのアイデアを生む、という生活と仕事のつながりを追った研究です。AIの職場導入を考えるとき、私生活での慣れも無視できないことを示唆しています。", "unverified": "研究2の標本規模と効果の大きさは未確認。"}}, {"id": "jr18", "rank": 18, "headline": "フードデリバリーの会員制は外食行動も変える", "title": "From Bytes to Bites: Examining the Online and Offline Spillover Impacts of Online Food Delivery Platform Subscriptions", "url": "https://doi.org/10.1287/mnsc.2025.00954", "authors": "Jaeho Myeong ほか", "venue": "Management Science", "date": "2026-10-22", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Management Scienceの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "フードデリバリーの会員制の導入は、競合からの乗り換えを生みつつ市場全体の消費を増やし、近所の外食や他の業種にも波及したことを示した（抄録）。", "p3": "大規模な個人単位の取引データで差の差分析を行い、地理空間の分析でオフラインへの波及を調べた（抄録）。", "p5": "会員制の導入後、競合から注目の基盤への消費の移動が起きたが共食いはなく、市場内の食の消費全体が増えた。会員は近くの外食や競合しない業種での活動も増やした（抄録）。", "fun": "宅配の会員になると家でばかり食べるようになると思いきや、近所のお店にも出かけるようになっていました。ネットの囲い込みが、街の実店舗にまで良い影響を広げうるという、意外な結果です。", "unverified": "効果の大きさの数値は未確認。"}}, {"id": "jr19", "rank": 19, "headline": "農村の認知症の人ほど在宅サービスが不足", "title": "People Living With Dementia in Rural Areas are Most Likely to Report Unmet Service Needs in Home‐ and Community‐Based Services in the United States", "url": "https://doi.org/10.1111/jrh.70230", "authors": "Romil R. Parikh ほか", "venue": "Journal of Rural Health", "date": "2026-10-23", "sjr": 1.411, "citescore": 5.8, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Journal of Rural Healthの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "認知症のある高齢者では、都市部より小都市・農村部で在宅・地域ケア（HCBS）の未充足ニーズが多いことを示した（抄録）。", "p3": "米国23州の地域在住の65歳以上14,645人（2016〜2019年）の調査で、都市農村の連続分類（RUCA）と未充足ニーズの関連を、認知症の有無で層別したロジスティック回帰で分析した（抄録）。", "p5": "認知症のある人（2,438人）では、大都市圏に比べ小都市圏で未充足ニーズの割合が高かった（35.4%対30.7%、オッズ比1.32）（抄録）。", "fun": "住み慣れた家で年を重ねたいという願いを支えるのが在宅ケアですが、その届き方には地域差があります。とくに認知症の人で農村ほど支援が足りないことを示し、支援の届け方を地域ごとに変える必要を数字で裏づけています。", "unverified": "農村部（rural）の数値は抄録が途中で未確認。"}}, {"id": "jr20", "rank": 20, "headline": "密な粒子懸濁流のμ(J)則を単純せん断外へ", "title": "Continuum modelling of dense granular suspensions in a duct: bold italic mu bold left parenthesis bold italic upper J bold right parenthesis μ ( J ) $\\boldsymbol{\\mu} \\boldsymbol{(}\\boldsymbol{J}\\boldsymbol{)}$ beyond simple shear", "url": "https://doi.org/10.1017/jfm.2026.12101", "authors": "Jonathan G.Y. Watts ほか", "venue": "Journal of Fluid Mechanics", "date": "2026-10-23", "sjr": 1.283, "citescore": 6.8, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Journal of Fluid Mechanicsの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "沈降する非ブラウン粒子の濃い懸濁液がダクトを圧力駆動で流れる場合を、μ(J)則の連続体モデルで理論と実験から調べた（抄録）。", "p3": "滑らかな側壁（応力なし）と粗い側壁（すべりなし）の2極限を扱い、解を無次元の圧力勾配と平均固相率で分類する。滑らかな場合は半解析解と漸近式を求め、側壁のクーロン摩擦条件の影響も調べた（抄録）。", "p5": "滑らかな側壁では流れが水平方向に一様になり、粗い側壁ではダクト横断方向と鉛直方向の両方に依存する流れになった（抄録）。", "fun": "砂粒の混じった泥水のような「濃い粒子の流れ」は、水のように流れたり砂山のように止まったりします。単純なずれ流れでしか確かめられていなかった法則を、壁のある管の中に広げて実験と比べた点が、この分野の一歩になっています。", "unverified": "実験と理論の一致度の数値は未確認。"}}, {"id": "jr21", "rank": 21, "headline": "粗い表面での粒子の跳ね返りを制御する", "title": "Regulating particle rebound through rough surfaces", "url": "https://doi.org/10.26599/frict.2026.9441324", "authors": "Haiyang Yao ほか", "venue": "Friction", "date": "2026-10-23", "sjr": 1.344, "citescore": 14.2, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Frictionの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "高速の粒子が粗い表面に衝突して跳ね返る挙動を分子動力学で調べ、反発係数の半解析モデルを示した（抄録）。", "p3": "表面粗さと衝突角を変えた分子動力学シミュレーションを行い、正面衝突の法線方向の反発係数の半解析モデルを作る（抄録）。", "p5": "反発係数は無次元速度に反比例的にスケールし、表面粗さの反発係数への効果は速度に依存した（抄録）。", "fun": "ボールを壁に当てると、壁がでこぼこかどうかで跳ね返り方が変わります。金属の粉を吹き付けて固める技術などで大事なこの現象を、原子の動きから調べ、速さによって粗さの効き方が変わることを示しています。", "unverified": "粗さの効果の向き（増減）の詳細は抄録が途中で未確認。"}}, {"id": "jr22", "rank": 22, "headline": "AIへの意識が先回りのキャリア行動を促す", "title": "How and When Artificial Intelligence Awareness Fosters Proactive Career Behaviors: The Role of Workplace Impostor Thoughts and Future Work Self Salience", "url": "https://doi.org/10.1177/10690727261499377", "authors": "Bowen Li ほか", "venue": "Journal of Career Assessment", "date": "2026-10-23", "sjr": 1.413, "citescore": 7.0, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Journal of Career Assessmentの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "AIへの意識（AIが仕事を変えるという認識）が、職場での「インポスター思考」を介して先回りのキャリア行動を促すことを示した（抄録）。", "p3": "自己不一致理論に基づき、英国のフルタイム従業員329人の3時点の時間差データで検証した（抄録）。", "p5": "AIへの意識は先回りのキャリア行動と正に関連した。インポスター思考を介した間接効果は、将来の仕事の自己像が際立つときにだけ有意だった（抄録）。", "fun": "「AIに仕事を取られるかも」という不安は普通は悪いものと考えられますが、この研究では、自分は力不足かもと感じることが逆にキャリアの準備を促していました。脅威がやる気に変わる条件を示している点が面白いところです。", "unverified": "効果の大きさの数値は未確認。"}}, {"id": "jr23", "rank": 23, "headline": "通勤中の業務ICT利用は没入の速さを高める", "title": "Does work‐related information and communication technology use during daily commutes promote the speed of work engagement? A role transition perspective", "url": "https://doi.org/10.1111/apps.70150", "authors": "Mengge Gan ほか", "venue": "Applied Psychology", "date": "2026-10-23", "sjr": 2.354, "citescore": 11.4, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Applied Psychologyの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "通勤中の業務用ICT利用は、行きでは家庭からの心理的な切り離しを通じて仕事への没入を早め、帰りでは仕事と家庭の葛藤を通じて翌日の没入を遅らせることを示した（抄録）。", "p3": "役割移行の観点から仮説を立て、従業員149人の10営業日の経験サンプリングをマルチレベル分析した（抄録）。", "p5": "行きの通勤中の業務ICT利用は家庭からの心理的離脱と正に関連し、朝の仕事への没入を早めた（帰りの結果は抄録の取得範囲外）（抄録）。", "fun": "通勤電車でメールを読むことは、朝なら「仕事モード」への切り替えを助け、夜なら家に仕事を持ち帰ることになります。同じ行動でも時間帯によって良し悪しが逆になる、という分かりやすい対比を示した研究です。", "unverified": "帰りの通勤の効果と課題重要性の調整効果は未確認（抄録が途中まで）。"}}, {"id": "jr24", "rank": 24, "headline": "話し手なき主張：LLMの証言は信頼できるか", "title": "Assertion without a Speaker: Testimony, Tracking, and Large Language Models", "url": "https://doi.org/10.1017/epi.2026.10160", "authors": "Abhinav Saxena", "venue": "Episteme", "date": "2026-10-23", "sjr": 1.016, "citescore": 3.3, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Epistemeの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "LLMの出力は利用者に真の信念をもたらすことが多いが、現時点では証言による知識を伝えていないと論じる哲学論文（抄録）。", "p3": "Burge、Williamson、Goldberg、Faulkner、Lackeyの議論から「追跡の最小条件」を導く。情報源がpを伝えるのは、pの真理や証拠が、その情報源自身の産出過程によって主張の産出を説明するときだけ、という条件である（抄録）。", "p5": "5つの説が共有するのは様相的な性質ではなくこの内生性の要件であり、現在のシステムはそれを満たさないと結論する（抄録）。", "fun": "AIの答えが正しくても、それは「AIが知っていて教えてくれた」ことになるのでしょうか。人から話を聞いて知るという営みの条件を哲学的に分析し、今のAIはまだその条件を満たしていない、と論じています。", "unverified": "なし"}}, {"id": "jr25", "rank": 25, "headline": "州法人税の変化が融資コストを動かす", "title": "Corporate Tax Changes and Credit Costs", "url": "https://doi.org/10.1111/jmcb.70092", "authors": "Yota D. Deli ほか", "venue": "Journal of Money, Credit and Banking", "date": "2026-10-23", "sjr": 1.999, "citescore": 3.7, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Journal of Money, Credit and Bankingの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "米国の州法人税率の変化が融資の価格と量に与える影響を調べ、減税で信用コストが約10ベーシスポイント下がることを示した（抄録）。", "p3": "州ごとの法人税率の変化を使い、融資スプレッドと融資額への影響を推定した（抄録）。", "p5": "1ポイントの減税（増税）は融資スプレッドの10.5（9.2）ベーシスポイントの低下（上昇）と関連した。効果は主に需要側から生じ、均衡の融資額への効果は有意でなかった（抄録）。", "fun": "法人税が下がると会社の手元にお金が残り、倒産しにくく見えるため、銀行は金利を下げてくれます。税金と借入金利という一見別々の話が、企業の信用リスクを通じてつながっていることを示した研究です。", "unverified": "なし"}}, {"id": "jr26", "rank": 26, "headline": "敏感産業でのガバナンスと持続可能性開示", "title": "Corporate Governance and Sustainability Disclosure in Environmentally and Socially Sensitive Industries", "url": "https://doi.org/10.1002/bse.71752", "authors": "Asad Mehmood ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-23", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Business Strategy and the Environmentの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "EU上場企業で、取締役会の規模と女性比率が環境・社会の持続可能性開示と正に関連し、その多くは産業の敏感さで変わらないことを示した（抄録）。", "p3": "EU上場503社の3,276企業年（2011〜2021年）を、OLS、操作変数法、2段階システムGMMで分析し、965社6,097観測で補足分析した（抄録）。", "p5": "取締役会の規模と女性比率は両方の開示と正に関連し、独立性は社会開示と正、CEOの兼任は社会開示と負に関連した。CEO兼任の負の関連は敏感な産業でより強かった（抄録）。", "fun": "環境に負荷の大きい業界ほど、ガバナンスが開示を左右するはずだと考えられがちです。ところが多くの関係は業界によって変わらず、社長と会長の兼任だけが敏感な業界でより悪く効いていた、という結果が興味深いところです。", "unverified": "係数の大きさは未確認。"}}, {"id": "jr27", "rank": 27, "headline": "CEOのポピュリズムが生物多様性開示を減らす", "title": "Silent Strategies: CEO Populism, Supply Chain Opacity, and Biodiversity Disclosure", "url": "https://doi.org/10.1002/bse.71725", "authors": "Hamzeh Al Amosh", "venue": "Business Strategy and the Environment", "date": "2026-10-23", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Business Strategy and the Environmentの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "CEOのポピュリズム的な言説が、生物多様性の開示の少なさとサプライチェーンの不透明さに関連することを、欧州企業で示した（抄録）。", "p3": "欧州12か国の非金融上場1,828社（2014〜2022年、15,842企業年）の非平衡パネルで、企業固定効果、2段階最小二乗法、2段階システムGMMを用いた（抄録）。", "p5": "CEOのポピュリズム的言説は生物多様性の開示と負、サプライチェーンの不透明さと正に関連した。前期の不透明さが負の関連を強めるという限定的な証拠もあった（抄録）。", "fun": "経営者の話し方から会社の情報の出し方が読み取れる、という研究です。分かりやすく大衆に訴える語り口の社長ほど、検証できる具体的な情報を出さない傾向があり、言葉の調子と透明性の関係を考えさせられます。", "unverified": "ポピュリズム的言説の測定方法は未確認。"}}, {"id": "jr28", "rank": 28, "headline": "統治の構成が主観的幸福を左右する", "title": "How governance configurations shape subjective well-being: Evidence from cross-national data", "url": "https://doi.org/10.1177/00208523261492453", "authors": "Wei Huang ほか", "venue": "International Review of Administrative Sciences", "date": "2026-10-23", "sjr": 1.163, "citescore": 7.9, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "International Review of Administrative Sciencesの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "163か国（2011〜2024年）のパネルで、政府の有効性と発言・説明責任の組合せによる統治の構成が主観的幸福の予測に関わることを示した（抄録）。", "p3": "統治を多次元の体系とみなして国を4つの制度構成に分類し、アンサンブルモデルとSHAPによる寄与の分解で主観的幸福を予測した（抄録）。", "p5": "主観的幸福は高い精度で予測でき、経済条件は基本的な予測因子のままだった（統治の寄与の詳細は抄録の取得範囲外）（抄録）。", "fun": "同じくらい豊かな国でも、人々の幸福感には大きな差があります。政府がきちんと仕事をするか、国民が声を上げられるか、という統治の「組合せ」で国を分けると、その差の一部が説明できるかもしれない、という問いを機械学習で探っています。", "unverified": "構成ごとの統治の効果は未確認（抄録が途中まで）。"}}, {"id": "jr29", "rank": 29, "headline": "持続性うつ病での高い孤独状態の持続", "title": "Sustained High‐Loneliness States in Persistent Depressive Disorder: An Ecological Momentary Assessment Study", "url": "https://doi.org/10.1111/nyas.70436", "authors": "Johannes Wolf ほか", "venue": "Annals of the New York Academy of Sciences", "date": "2026-10-23", "sjr": 1.35, "citescore": 7.9, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Annals of the New York Academy of Sciencesの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "持続性うつ病の入院患者では、孤独感の強い状態が健康な人より長く続き、抜け出しにくいことを生態学的瞬間評価（EMA）で示した（抄録）。", "p3": "持続性うつ病の入院患者58人と健康な対照42人で、EMAにより状態としての孤独感の平均水準と高孤独状態の持続時間を求め、特性孤独感と幼少期の逆境も測った（抄録）。", "p5": "患者は平均の状態孤独感が高く、高孤独状態が平均3.5回の連続した回答の間続いた。高孤独状態から抜け出す確率も低かった（抄録）。", "fun": "寂しさはもともと「人とつながれ」という合図として役に立つ感情ですが、それが長く続くと害になります。一日に何度も気持ちを記録してもらうことで、寂しさの強さだけでなく「どれだけ長く続くか」を測った点が新しいところです。", "unverified": "幼少期の逆境との関連の結果は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "スマホで木造床の振動を素早く評価", "title": "Application of a Fast Vibration Assessment Protocol for Joisted Timber Floors via Smartphone Devices", "url": "https://doi.org/10.1155/stc/6442165", "authors": "Alessandro Mazelli ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-10-23", "citescore": 10.3, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Structural Control and Health Monitoringの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "木造根太床の歩行振動による快適性を、市販スマートフォンで素早く評価する手順を提案し、実験室と現場で検証した（抄録）。", "p3": "試作の床で従来のフォースバランス型加速度計とスマートフォンの記録を比べて較正・補正係数を作り、統計シミュレーションで必要な最小の歩行回数を求めた。2つの実際の床で頑健性を試した（抄録）。", "p5": "較正と補正係数、最小歩行回数を定め、現場の2つの床で方法の頑健性と可能性を確認した（数値は抄録の取得範囲外）（抄録）。", "fun": "木の床は軽くて硬いぶん、人が歩くだけで揺れが気になりやすい構造です。高価な計測器の代わりにスマホで手早く揺れを評価できれば、点検の手間が大きく減ります。何回歩けば十分かまで統計で決めている点が実用的です。", "unverified": "スマートフォンと加速度計の誤差の大きさは未確認。"}}, {"id": "jr31", "rank": 31, "headline": "説明可能AIで仕訳の異常を検知", "title": "Explainable Artificial Intelligence for Journal Entry Anomaly Detection and Continuous Financial Auditing", "url": "https://doi.org/10.15680/irjie.2024.0804003", "authors": "R. Sugumar", "venue": "International Research Journal of Innovative Engineering", "date": "2026-10-23", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "International Research Journal of Innovative Engineeringの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "仕訳の異常検知と継続的監査のための説明可能AI（XAI）の構成を提案した（抄録）。", "p3": "前処理、特徴量設計、異常検知、説明、リスク評価、継続的監査の監視を一つの構成にまとめ、記帳時刻、勘定と利用者の関係、金額、伝票、過去の傾向から疑わしい仕訳を特定する。各モデルがリスク得点を出し、説明の仕組みで理由を示す（抄録）。", "p5": "抄録の取得範囲では、検証データや精度の数値は確認できなかった（抄録）。", "fun": "会計監査では、膨大な仕訳の中から怪しいものを見つけるだけでなく、「なぜ怪しいか」を説明できることが大切です。AIの判断理由を見える形にする仕組みを監査の流れに組み込もうとする提案です。", "unverified": "検証の方法と結果は抄録に記載がなく未確認。掲載誌の査読水準も未確認。"}}, {"id": "jr32", "rank": 32, "headline": "時系列分割で不正予測の楽観を避ける", "title": "An Explainable Temporal Machine Learning Framework for Financial Fraud Risk Prediction in Listed Institutions", "url": "https://doi.org/10.54097/hkcxmt18", "authors": "Huijie Fan ほか", "venue": "Highlights in Business, Economics and Management", "date": "2026-10-23", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Highlights in Business, Economics and Managementの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "財務諸表不正の選別で、情報の漏れの監査と過去のみの時系列特徴量を組み込んだ説明可能なアンサンブルESGEを提案した（抄録）。", "p3": "ロジスティック回帰・LightGBM・CatBoostを検証のPR-AUCで重み付けし、モデル間の不一致のゲートと交差検証で安定なTreeSHAPを組み合わせる。米上場企業の10,159四半期（不正511件、5.03%）で、企業が訓練と試験にまたがらない分割を用いた（抄録）。", "p5": "5分割でROC-AUC 0.9032±0.0198、PR-AUC 0.6344±0.0648。順位の上位10%の報告に不正の72.22%±5.07%が含まれた（抄録）。", "fun": "不正はまれな出来事なので、データの分け方を誤ると、未来の情報が混ざって実力以上に当たるように見えてしまいます。この研究は同じ会社を訓練と試験に混ぜないなど、ずるのない評価を徹底している点に価値があります。", "unverified": "最強の単一モデルとの差の信頼区間は抄録が途中で未確認。"}}, {"id": "jr33", "rank": 33, "headline": "LLMの異時点選択はペルソナ文脈で変わる", "title": "CONTEXT OVER LANGUAGE: PERSONA-DRIVEN INTERTEMPORAL CHOICE IN LARGE LANGUAGE MODELS", "url": "https://doi.org/10.54688/ayd.1932565", "authors": "Ali Kemal Başbuğ", "venue": "Akademik Yaklaşımlar Dergisi", "date": "2026-10-22", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Akademik Yaklaşımlar Dergisiの抄録（OpenAlex）を使用", "preprint": false, "short": true, "p1": "LLMの異時点間の選択は安定した選好ではなく、与えたペルソナの文脈に主に左右されることを示した（抄録）。", "p3": "4つのモデル（ChatGPT、Gemini、Copilot、Claude）で、ペルソナ（金銭的に苦しい／規律がある）、遅延（1・6か月）、報酬額（650〜900ドル）、プロンプトの枠組み（直接／人らしく）を完全要因計画で変え、繰り返して応答分布を近似した（抄録）。", "p5": "決定はペルソナに主に左右され、規律あるペルソナは遅い報酬をより多く選んだ。遅延と報酬額は時間割引と整合的に効き、プロンプトの枠組みの効果は無視できる程度だった（抄録）。", "fun": "「お金に困っている人として答えて」と頼むとAIは今すぐのお金を選び、「計画的な人として」と頼むと待つほうを選びます。AIを実験の被験者として使うとき、その答えがAI自身の好みなのか、与えた役柄なのかを見分ける必要があることを示しています。", "unverified": "モデル間の差の詳細は未確認。"}}, {"id": "jr34", "rank": 34, "headline": "持続可能性は財務困窮リスクを和らげるか", "title": "Corporate Sustainability as a Mitigator of Financial Distress Risk: Panel and Quantile Evidence from an Emerging Economy", "url": "https://doi.org/10.3390/jrfm19110842", "authors": "Kishan Kumar Goel ほか", "venue": "Journal of Risk and Financial Management", "date": "2026-10-23", "citescore": 5.5, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Journal of Risk and Financial Managementの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "インドの上場企業で、持続可能性（ESG）の成績が財務困窮のリスクを企業の分布全体で和らげることを示した（抄録）。", "p3": "上場566社（2012〜2024年）のパネルを、モーメント法の分位点回帰で分析し、シミュレーションに基づく媒介分析で経路を調べた（抄録）。", "p5": "持続可能性の成績は分布全体で困窮リスクを一貫して下げ、効果はCOVID-19危機の時期にも安定し、産業によって異なった。負債比率が主な伝達経路だった（抄録）。", "fun": "環境や社会への配慮にお金を使う会社は、余裕があるからできるのか、それとも配慮が会社を守るのか。この研究は、苦しい会社から元気な会社まで、どの層でもESGの成績が良いほど倒産の危険が低いという関係を示しています。", "unverified": "効果の大きさの数値は未確認。"}}, {"id": "jr35", "rank": 35, "headline": "動的メッシュ流れの位相を考慮した縮約", "title": "Spatially Consistent and Phase-Aware Reduced-Order Modeling for Dynamic-Mesh Unsteady Flow Simulation", "url": "https://doi.org/10.3390/fluids11110267", "authors": "Longfeng Hou ほか", "venue": "Fluids", "date": "2026-10-23", "citescore": 4.1, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Fluidsの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "格子が時間とともに動く非定常流れのスナップショットを共通の参照格子に写像し、位相を考慮したPOD–RBFの縮約モデルで周期流れを高速に計算する（抄録）。", "p3": "KD木の最近傍探索と逆距離重み付けで動的格子のスナップショットを参照格子に揃え、POD打ち切り、RBF係数回帰、外部パラメータ表現、位相局所の部分空間モデルを、1周期内と周期をまたぐ予測で調べた（抄録）。", "p5": "キャビティ流れと円柱後流で基本実装を確かめ、振動翼で全体の手順を評価した。動的格子のデータのPODでは空間的な一貫性が不可欠であることを示した（抄録）。", "fun": "羽ばたく翼のまわりの流れを計算すると、計算の格子そのものが動くので、時刻ごとのデータが同じ場所を指さなくなります。まず全部を同じ地図に写してから要約する、という当たり前の手順が実は欠かせないことを確かめた研究です。", "unverified": "誤差の数値は未確認。"}}, {"id": "jr36", "rank": 36, "headline": "最大粒径が粗粒土のせん断に与える影響", "title": "Effects of Maximum Particle Size on the Shear Behavior of Coarse-Grained Soil: Direct Shear Tests and Discrete Element Simulations", "url": "https://doi.org/10.3390/eng7110578", "authors": "Rui Zhang ほか", "venue": "Eng", "date": "2026-10-23", "citescore": 4.1, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Engの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "粗粒土の最大粒径がせん断強度と粒子間の力の鎖に与える寸法効果を、大型直接せん断試験とPFC3Dの個別要素法で調べた（抄録）。", "p3": "最大粒径10・20・40・60mmの4群を垂直応力100〜400kPaで試験し、3次元DEMモデルをせん断応力−変位曲線と強度定数で評価してから、粒子変位、力の鎖、配位数、接触ファブリック、せん断応力場を調べた（抄録）。", "p5": "16のピークせん断応力の比較で平均相対誤差4.09%、最大7.27%。最大粒径が10mmから60mmになると、ピークせん断応力は100kPaで61.82%、400kPaで39.23%増えた（抄録）。", "fun": "大きな石が混ざった土ほど強くなるのは、石同士が押し合う「力の鎖」が太く長くなるからかもしれません。実験とコンピュータ上の粒の模型を突き合わせ、目に見えない土の中の力の流れを見えるようにしています。", "unverified": "見かけの粘着力の変化の結果は抄録が途中で未確認。"}}, {"id": "jr37", "rank": 37, "headline": "火山灰斜面の土石流流域の水収支モデル", "title": "Hydrological Dynamics of Debris Flow-Prone Pyroclastic Catchments: A Budyko-Based Modeling Approach", "url": "https://doi.org/10.3390/w18212640", "authors": "Muhammad Aleem ほか", "venue": "Water", "date": "2026-10-23", "citescore": 6.7, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Waterの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "イタリア・カンパニア州の火砕堆積物の斜面をもつ8流域で、Budyko枠組みの動的水収支モデルにより土石流の起きやすい流域の水文挙動を表した（抄録）。", "p3": "2003〜2023年の月雨量・衛星・再解析データを使い、保水、蒸発散の効率、最大土壌貯留、基底流、地下水損失のパラメータを、7つの未観測流域では再解析の流出量、1つの観測流域では水位流量関係の流量に合わせて較正した（抄録）。", "p5": "未観測流域の水文モデル構築に再解析の流出量が使えるかを評価した（較正結果の数値は抄録の取得範囲外）（抄録）。", "fun": "大雨のときに斜面が崩れるかどうかは、その前に土がどれだけ湿っていたかに左右されます。流域全体の水の出入りの帳簿から土の湿り具合を見積もるという、地道だけれど警報に役立つ発想の研究です。", "unverified": "モデルの再現精度の数値は未確認。"}}, {"id": "jr38", "rank": 38, "headline": "月面模擬土でのコーン貫入と重力の影響", "title": "Gravity Effect on Cone Penetration in Lunar Regolith Simulant", "url": "https://doi.org/10.1139/cgj-2026-0009", "authors": "Mengmeng Wu ほか", "venue": "Canadian Geotechnical Journal", "date": "2026-10-22", "sjr": 1.282, "citescore": 5.8, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Canadian Geotechnical Journalの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "月面の模擬土でのコーン貫入試験を、地球重力と月重力（1/6g）の両方で行い、DEMで粒子の再配列と応力伝達を調べた（抄録）。", "p3": "磁気相似重力の模型試験法（GMMT）で1gと1/6gのCPTを行い、測ったコーン抵抗の深さ分布で検証した3次元DEMで、粒子の再配列、応力経路、3次元の応力伝達を解析した（抄録）。", "p5": "重力を1gから1/6gにすると、深さ100〜300mmでのシミュレーションのコーン抵抗が約24〜33%下がった。拘束の低下で粒子の回転・再配列が起きやすくなり、応力を支える網目が弱まった（抄録）。", "fun": "月の上に建物を建てるには、月の砂がどれくらい踏ん張るかを知る必要があります。地球上で月の重力を磁力で再現する工夫をして実験し、重力が6分の1になると砂の抵抗は6分の1ではなく3割ほど下がるだけだと分かったのが面白い点です。", "unverified": "応力の減衰指数の結果は抄録が途中で未確認。"}}, {"id": "jr39", "rank": 39, "headline": "LLMに加速度窓を入       });
      b.addEventListener("click", function () { copyText(h.make(it), askStatus, h.done); });
      askrow.appendChild(b);
    });
    card.appendChild(askrow); card.appendChild(askStatus);
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
