, "p1": "題名から、財務諸表不正の検出を、「不正と確認された企業（正例）」と「ラベルのない企業」だけから学ぶ問題として扱い、複数の種類のデータを使うグラフ自己符号化器で解く研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「この会社は不正をしていない」と証明することはできない、という事情をどう扱うかである。不正が見つかった会社は確かに不正だが、見つかっていない会社が潔白とは限らない。そのため確かな「白」のお手本がないまま学習しなければならない、という難しさが題名に表れている。結果は未確認。", "unverified": "抄録・本文を入手できず、使用データ、グラフの作り方、検出精度はすべて未確認。"}}, {"id": "jr28", "rank": 28, "headline": "監査完了前の決算発表は監査報酬を約1割上げる", "title": "Does Releasing Earnings When the Audit Is Less Complete Increase Audit Costs?", "url": "https://doi.org/10.2308/ajpt-2024-102", "authors": "Ashleigh Bakke ほか", "venue": "Auditing", "date": "2026-11-10", "sjr": 2.32, "citescore": 5.3, "citescore_year": "2025", "apa": "Bakke, A., Bronson, S. N., Masli, A. N. S., & Schroeder, J. H. (2026). Does Releasing Earnings When the Audit Is Less Complete Increase Audit Costs? Auditing: A Journal of Practice & Theory, 1–28. https://doi.org/10.2308/ajpt-2024-102", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "監査が終わる前に年次の利益を発表する企業は、監査報酬が高くなることを示した（抄録）。", "p3": "利益発表は早いほど価値があるため、多くの企業が監査の完了前に発表する。この早期の発表と監査報酬の関連を調べ、発表日と監査報告書の日付の間隔による違いや、早期発表に切り替えた企業の変化の分析も行った（抄録）。", "p5": "監査完了前に発表する企業は平均で10.8%高い報酬を払っていた。この上乗せは発表から監査報告までの日数が長いほど大きく、早期発表に切り替えたあと少なくとも2年続いた（抄録）。", "fun": "会社は決算の数字を一日でも早く知らせたい。しかし監査人の確認がまだ終わっていないうちに発表すると、あとで数字が違っていたときの危険を監査人も背負うことになる。その分が監査の料金に上乗せされていた。早く知らせることの便利さには、目に見える値段が付いていることを示した研究である。", "unverified": "本文未読のため、標本の国・期間・規模と、因果関係の識別の程度は未確認。"}}, {"id": "jr29", "rank": 29, "headline": "表形式データ合成の手法と評価を整理した総説", "title": "A Survey on Tabular Data Synthesis: Generation, Evaluation, and Benchmarking", "url": "https://doi.org/10.1002/wics.70078", "authors": "Suyeong Kim ほか", "venue": "Wiley Interdisciplinary Reviews: Computational Statistics", "date": "2026-11-11", "sjr": 1.486, "citescore": 9.0, "citescore_year": "2025", "apa": "Kim, S., Jeong, D., Lee, H., Kim, J. H. T., Kim, Y. M., & Im, J. (2026). A Survey on Tabular Data Synthesis: Generation, Evaluation, and Benchmarking. WIREs Computational Statistics, 18(4). https://doi.org/10.1002/wics.70078", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "表形式データの合成について、古典的な統計手法、深層生成モデル、大規模言語モデルを使う手法をまとめ、評価の考え方を整理した総説である（抄録）。", "p3": "各手法の生成の仕組み、モデルの仮定、限界を検討し、評価を分布の類似性、下流の課題での有用性、プライバシーの3つの観点から論じた。12の生成器の構成を6つのデータセットで比べる例示的なベンチマークを添えた（抄録）。", "p5": "結果はデータセットと指標に依存し、類似性と有用性の得点は、プライバシーの診断と計算上の要求とあわせて解釈する必要がある。型の混在、まれな観測、再現性などの課題と、LLMを直接の生成器として使うべき場面という未解決の問いを挙げた（抄録）。", "fun": "本物のデータは個人情報を含むので外に出せない。そこで、本物そっくりの統計的な性質を持つ「偽のデータ」を作って配る方法が研究されている。難しいのは、良い偽物の条件が一つではないことだ。本物に似ているほど役に立つが、似すぎると元の人が分かってしまう。この総説は、その綱引きを三つの物差しで整理している。", "unverified": "本文未読のため、ベンチマークで比べた手法の名称と結果の数値は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "外国の税務当局によるEDGAR閲覧と利益移転", "title": "The Effect of Non‐US Tax Authority Monitoring on Income Shifting by Affiliates of US Multinationals: Evidence From EDGAR Search Activity", "url": "https://doi.org/10.1111/1911-3846.70101", "authors": "Sabrina Chi ほか", "venue": "Contemporary Accounting Research", "date": "2026-11-11", "sjr": 3.686, "citescore": 7.3, "citescore_year": "2025", "apa": "Chi, S., Persson, A. V., Shevlin, T., & Urcan, O. (2026). The Effect of Non‐US Tax Authority Monitoring on Income Shifting by Affiliates of US Multinationals: Evidence From EDGAR Search Activity. Contemporary Accounting Research. https://doi.org/10.1111/1911-3846.70101", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得（抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "外国の税務当局が米国の多国籍企業の年次報告書をダウンロードする記録を監視の指標として使い、その監視が企業の利益移転を抑えるかを調べた（抄録）。", "p3": "米国証券取引委員会に提出された年次報告書への外国税務当局からのアクセスを測り、子会社の所在国の当局による監視と、企業グループ全体で受けた監視の合計のそれぞれと、子会社の利益移転との関連を分析した（抄録）。", "p5": "子会社の現地当局の監視だけでは利益移転は系統的に減らないが、グループ全体での監視の合計は、現地当局が監視していない子会社にも効いていた。この関連は、情報交換条約がある場合、開示が詳しい場合、執行能力が高い場合に強い（抄録）。", "fun": "税務署が会社の公開資料を見ているかどうかは、ふつう外からは分からない。この研究は、米国の開示サイトのアクセス記録から「どの国の税務署が、どの会社の資料を落としたか」を拾い出した。すると、一つの国が見ているだけでは効かず、多くの国に見られている会社ほど利益の付け替えを控えていた。見張りの目は数が効く。", "unverified": "抄録の末尾が切れており、政策への含意の後半は未確認。標本の期間と規模も未確認。"}}, {"id": "jr31", "rank": 31, "headline": "監査の試験問題でLLMと学習者を比較", "title": "Large Language Models In Auditing Assessments: Comparisons Between Human Learners, Model Scale, and Enhancement Techniques", "url": "https://doi.org/10.22146/abis.v14i4.125774", "authors": "Arizona Mustikarini", "venue": "ABIS: Accounting and Business Information Systems Journal", "date": "2026-11-11", "apa": "Mustikarini, A. (2026). Large Language Models In Auditing Assessments: Comparisons Between Human Learners, Model Scale, and Enhancement Techniques. ABIS: Accounting and Business Information Systems Journal, 14(4), 301. https://doi.org/10.22146/abis.v14i4.125774", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "言語モデルは監査の知識を問う試験では学生を上回るが、データを使って監査手続を実行する課題では得点が低いという、知識と実行の隔たりを示した（抄録）。", "p3": "公開されている7つの言語モデルに、会計の学生352人が受けた学部の監査論の試験4回分と、SQLで実証手続を計画・実行して収益の実在性と費用の網羅性を確かめる事例課題を解かせ、自己省察とエージェント型の手順という二つの強化手法も試した（抄録）。", "p5": "知識の試験では、大きいモデルは学生の78〜98パーセンタイルに位置した。事例課題ではどのモデルも採点基準の満点の50%を超えず、モデルの大小で有意な差はなく、二つの強化手法も成績を上げなかった（抄録）。", "fun": "監査の教科書の内容を問うと、AIは優秀な学生並みに答えられる。ところが、実際のデータを渡して「売上が本当にあったか確かめよ」と作業をさせると、半分も点が取れなかった。知っていることと、できることは別である。しかも自分で見直させても間違いは直らなかった。外から誤りを指摘される仕組みの大切さが分かる。", "unverified": "抄録の末尾が切れており、含意の議論は未確認。事例課題の採点方法の詳細も未確認。"}}, {"id": "jr32", "rank": 32, "headline": "脆弱な消費者を支えるサービスが害を再生産する", "title": "The Rose and Its Hidden Thorn: Patterning and Evolution of Consumer Vulnerability in Transformative Service Initiatives", "url": "https://doi.org/10.1177/10946705261502647", "authors": "Shuai Qin ほか", "venue": "Journal of Service Research", "date": "2026-11-11", "sjr": 5.517, "citescore": 19.7, "citescore_year": "2025", "apa": "Qin, S., & Chen, X. (2026). The Rose and Its Hidden Thorn: Patterning and Evolution of Consumer Vulnerability in Transformative Service Initiatives. Journal of Service Research. https://doi.org/10.1177/10946705261502647", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得（抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "消費者の脆弱さを減らすはずの変革的なサービスが、サービスの組み立て方しだいで脆弱さを繰り返し生み出してしまう仕組みを、難民の起業支援を例に示した（抄録）。", "p3": "研究1では33の支援組織の管理者42人に面接し、資源へのアクセスと使い方の統制の組み合わせから3つのサービスモデルを見いだした。研究2では一つの支援組織を3年間観察し（面接70件、観察144回）、利用者が与えられた立場に異議を唱える過程を追った（抄録）。", "p5": "各モデルは利用者を受け身の受給者、条件つきの行為者、自律的な努力者として位置づけ、それぞれに特有の脆弱さの型を生みやすい。利用者は、参加の負担を見えるようにする、資源があれば何ができるかを示すという二つのやり方で立場を変えようとした（抄録）。", "fun": "困っている人を助けるサービスが、かえってその人を弱い立場に固定してしまうことがある。たとえば支援する側が何でも決めてしまうと、利用者は「受け取るだけの人」になる。この研究は、助け方の型ごとに、どんな弱さが生まれやすいかを整理した。善意の仕組みにも副作用があり、利用者の側からそれを変える動きがあることが分かる。", "unverified": "抄録の末尾が切れており、理論的な含意の後半は未確認。"}}, {"id": "jr33", "rank": 33, "headline": "消費者が感じるAIの人工共感の6次元尺度", "title": "Measuring Consumer‐Perceived Artificial Empathy: Development and Validation of a Six‐Dimensional Scale", "url": "https://doi.org/10.1111/ijcs.70280", "authors": "Heng Chu ほか", "venue": "International Journal of Consumer Studies", "date": "2026-11-11", "sjr": 1.894, "citescore": 15.0, "citescore_year": "2025", "apa": "Chu, H., Ji, C., Li, M., & Prentice, C. (2026). Measuring Consumer‐Perceived Artificial Empathy: Development and Validation of a Six‐Dimensional Scale. International Journal of Consumer Studies, 50(6). https://doi.org/10.1111/ijcs.70280", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得（抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "サービスの場面でAIが示す「人工共感」を消費者がどう知覚するかを測る、6次元・24項目の尺度を開発し、妥当性を確かめた（抄録）。", "p3": "文献の検討と質的な面接で項目を作り、専門家の評価で表面・内容妥当性を確かめたうえで、3つの独立した標本を使い、探索的因子分析（413人）、確認的因子分析（476人）、PLS-SEMによる予測妥当性の検討（537人）を行った（抄録）。", "p5": "察知、注意深さ、包括性、適応性、真正さ、敬意の6次元からなる24項目の尺度が支持された（抄録）。信頼性係数などの数値は抄録に記載なし。", "fun": "AIの窓口が「お困りですね」と言うとき、客はそれを思いやりと感じるだろうか。AIには心がないのに、共感されたと感じることはある。この研究は、その「共感された感じ」を六つの面に分け、質問紙で測れるようにした。気づいてくれるか、合わせてくれるか、うわべでないか、など、人が相手に求めるものがそのまま並んでいる。", "unverified": "抄録の末尾が切れており、予測妥当性の対象とした結果変数と係数は未確認。"}}, {"id": "jr34", "rank": 34, "headline": "動画配信の乗り換え意図と切替障壁", "title": "Platform Dissatisfaction to Switching Intention: The Roles of Trust, Switching Barriers, and Alternative Attractiveness in Video Streaming Services", "url": "https://doi.org/10.12688/f1000research.189722.1", "authors": "Rafael Latif ほか", "venue": "F1000Research", "date": "2026-11-11", "citescore": 2.9, "citescore_year": "2025", "apa": "Latif, R., Ferrencya, F., Amalia, A., Silvia, D., & Arianto, R. (2026). Platform Dissatisfaction to Switching Intention: The Roles of Trust, Switching Barriers, and Alternative Attractiveness in Video Streaming Services. F1000Research, 15, 1767. https://doi.org/10.12688/f1000research.189722.1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は未取得。抄録の結果の部分は取得時に切れている）", "preprint": false, "short": true, "p1": "定額制の動画配信サービスで、利用者が他のサービスへ乗り換えようとする意図を、不満・信頼・切替の障壁・代替の魅力から説明するモデルを検証した（抄録）。", "p3": "押し出し・引き寄せ・係留（Push–Pull–Mooring）の枠組みを使い、複数の動画配信サービスの利用経験があるインドネシアの利用者417人の横断調査を、PLS-SEM（5,000回のブートストラップ）で分析した（抄録）。", "p5": "13の仮説のうち11が支持され、乗り換え意図の有意な予測変数の中では、サービス品質への不満の正の効果が最も強かった（β = 0.183）（抄録）。他の係数は抄録が切れており未確認。", "fun": "今のサービスに不満があっても、すぐ乗り換える人ばかりではない。乗り換えには、押し出す力（不満）、引き寄せる力（他社の魅力）、引き止める力（手続きの面倒さや信頼）の三つが働く。この研究は、引っ越しを説明するために作られたこの考え方を、動画配信の契約に当てはめた。人の移動とサービスの乗り換えが同じ型で語れる点が面白い。", "unverified": "抄録の結果の部分が切れており、切替の障壁と信頼の効果の大きさは未確認。有意抽出の横断調査である。"}}, {"id": "jr35", "rank": 35, "headline": "世代で違う口コミの動機と場所", "title": "Why, where, and how generations from Baby Boomers to GenZ share eWOM: fresh insights from generational cohort theory", "url": "https://doi.org/10.1080/02508281.2025.2528225", "authors": "Kristína Pompurová ほか", "venue": "HAL (ART) Tourism Recreation Research", "date": "2026-11-09", "citescore": 11.3, "citescore_year": "2025", "apa": "Pompurová, K., Filieri, R., & Medeková, K. (2025). Why, where, and how generations from Baby Boomers to GenZ share eWOM: fresh insights from generational cohort theory. Tourism Recreation Research, 51(5), 2014–2038. https://doi.org/10.1080/02508281.2025.2528225", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "HALに登録された抄録を使用（掲載誌 Tourism Recreation Research の本文は未取得）", "preprint": false, "short": true, "p1": "ベビーブーム世代からZ世代までの4つの世代が、観光地についての電子的な口コミを、なぜ・どこで・どのように共有するかの違いを明らかにした（抄録）。", "p3": "世代コホート理論に基づき、チェコとスロバキアの代表標本のデータで、口コミへの関与、動機、媒体の好みを世代間で比べた。幅広い種類の口コミの場を対象にした（抄録）。", "p5": "Z世代とY世代は視覚的な媒体を好み、自己高揚と外的な報酬に動かされる。年長の世代は利他的な動機が強く、公式性の高い場を好む。どの世代でも肯定的な口コミが優勢だった（抄録）。数値は抄録に記載なし。", "fun": "旅行の感想をネットに書くとき、若い人は写真や動画の場で「自分をよく見せたい」「ごほうびがほしい」気持ちから書き、年長の人は公式の評価サイトで「他の人の役に立ちたい」気持ちから書く傾向があった。同じ口コミでも、書く理由と場所が世代で違う。ただし著者は、世代の線引きを固く考えすぎないようにとも述べている。", "unverified": "本文未読のため、標本の大きさ、調査の時期、差の統計的な検定の結果は未確認。"}}, {"id": "jr36", "rank": 36, "headline": "市場の公正感は仕組みは同じで基準が変わった", "title": "Evolving Norms of Market Fairness: Stable Mechanisms and Shifting Standards in a Contemporary Replication of Kahneman et al. (1986)", "url": "https://doi.org/10.1177/01461672261495988", "authors": "William Rose ほか", "venue": "Personality and Social Psychology Bulletin", "date": "2026-11-11", "sjr": 2.086, "citescore": 9.9, "citescore_year": "2025", "apa": "Rose, W., & Gladstone, J. J. (2026). Evolving Norms of Market Fairness: Stable Mechanisms and Shifting Standards in a Contemporary Replication of Kahneman et al. (1986). Personality and Social Psychology Bulletin. https://doi.org/10.1177/01461672261495988", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "市場での公正さの判断についての1986年の古典研究を追試し、判断の仕組みは変わっていないが、何を不公正とみなすかの基準は変わったことを示した（抄録）。", "p3": "Kahnemanらの1986年の研究を、元の場面設定と現代風に直した設定で、クラウドワーカーと一般人口の標本を使って4回追試した（計1,016人）（抄録）。", "p5": "参加者は今も、既存の価格と賃金を権利とみなし、賃下げを昇給の見送りより厳しく評価し、市場支配力を利用する企業を非難した。一方、値上げに反対する割合は1986年よりどの標本でもおよそ40〜55%低く、雇用主の行為への反対が強まったのは若いクラウドワーカーの標本だけだった（抄録）。", "fun": "四十年前の人も今の人も、「いつもの値段」を当然の権利と感じ、給料を下げられると強く怒る。この心の仕組みは変わっていなかった。ところが「値上げは不公正だ」と感じる人は大きく減っていた。値段が動くことに慣れたためかもしれない。公正さの感じ方は、変わらない型と、時代に合わせて動く基準の二つでできているらしい。", "unverified": "本文未読のため、個々の場面設定ごとの結果と、基準が変わった理由の検討は未確認。"}}, {"id": "jr37", "rank": 37, "headline": "地域の仲介的な場の利用が瞬間のストレスを下げる", "title": "Activity spaces, community resource brokers, and real-time stress and affect: Evidence from the Boston Activity Space and Health Study", "url": "https://doi.org/10.1177/00420980261500260", "authors": "Gregory Sharp ほか", "venue": "Urban Studies", "date": "2026-11-11", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "apa": "Sharp, G., & Walton, E. (2026). Activity spaces, community resource brokers, and real-time stress and affect: Evidence from the Boston Activity Space and Health Study. Urban Studies. https://doi.org/10.1177/00420980261500260", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "日常の行動範囲にある地域の施設や組織（資源の仲介役）を実際に利用することが、その場のストレスと気分の苦しさを和らげることを示した（抄録）。", "p3": "ボストンの成人を対象に、スマートフォンでGPSの位置と、その時々の気分を尋ねる調査を7日間集めたデータを使い、変量効果モデルで、仲介役へのアクセスと利用が、その場のストレスと感情にどう関連するかを推定した（抄録）。", "p5": "仲介役となる施設にふだんから行ける範囲にいることに加えて、それを日常的に利用していることが、その場の情緒的・生理的な苦しさの軽減と関連していた（抄録）。効果の大きさは抄録に記載なし。", "fun": "健康には「どこに住んでいるか」が効くと言われるが、人は一日の大半を、職場や店や礼拝所など、家の外で過ごす。この研究は、スマートフォンで人の足どりとその瞬間の気分を一緒に記録した。すると、地域の施設が近くにあるだけでなく、実際に通っている人ほど、その時々の苦しさが軽かった。場所は、使われて初めて支えになる。", "unverified": "本文未読のため、標本の大きさ、仲介役の定義、推定値は未確認。"}}, {"id": "jr38", "rank": 38, "headline": "退職後の孤独を防ぐ短い介入を日本の正社員で検証", "title": "Testing a WOOP-SET intervention to promote loneliness-prevention intentions and examine ageism among middle-aged Japanese regular employees", "url": "https://doi.org/10.3389/frsps.2026.1978965", "authors": "Yuho Shimizu", "venue": "Frontiers in Social Psychology", "date": "2026-11-11", "citescore": 1.6, "citescore_year": "2025", "apa": "Shimizu, Y. (2026). Testing a WOOP-SET intervention to promote loneliness-prevention intentions and examine ageism among middle-aged Japanese regular employees. Frontiers in Social Psychology, 4. https://doi.org/10.3389/frsps.2026.1978965", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は未取得）", "preprint": false, "short": true, "p1": "退職後の孤独に備える意図を高める短いオンラインの介入を、日本の中年の正規雇用者で試し、意図は高まるが、年齢への偏見を減らす効果ははっきりしないことを示した（抄録）。", "p3": "願い・成果・障害・計画を書き出す演習（WOOP）と、今の自分と将来の高齢の自分の連続性を強調するメッセージを組み合わせた。40〜64歳を対象に、研究1は一群の事前事後の設計（200人）、研究2は無関係な課題と比べる準無作為化の設計（759人）で行った（抄録）。", "p5": "研究1では孤独予防の行動意図が上がり年齢への偏見が下がった。研究2では、介入群の孤独予防の意図の上昇が対照群より有意に大きかったが、偏見には群間の有意な効果がなかった（抄録）。", "fun": "会社勤めの人は、仕事のつながりが退職で一気になくなりやすい。そこで働き盛りのうちに「退職後に誰とつながるか」を考えてもらう短い課題を試した。効果があったのは「やってみよう」という気持ちまでで、年を取ることへの思い込みは変わらなかった。気持ちを動かすことと、考え方を変えることは別物だと分かる。", "unverified": "本文未読のため、効果量と、意図が実際の行動に結びついたかどうかは未確認。測定は介入の直後である。"}}, {"id": "jr39", "rank": 39, "headline": "独居の高齢保健ボランティアは支える側で支えられない", "title": "When the Caregiver Needs Care: Mental Health Experiences of Elderly Health Cadres with Hypertension Living Alone in Rural Indonesia", "url": "https://jurnal.unitri.ac.id/index.php/care/article/view/8776", "authors": "Retno Lestari ほか", "venue": "Care Jurnal Ilmiah Ilmu Kesehatan", "date": "2026-11-08", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "地域の人の健康を支える高齢の保健ボランティア自身が、高血圧を抱え、一人暮らしで、十分な支えを受けていない実態を、インドネシアの農村で聞き取った（抄録）。", "p3": "東ジャワの農村に住む60〜67歳の女性の保健ボランティア7人（全員が独居で高血圧）に、半構造化の深い面接をオンラインで行い、主題分析の6段階の手順で分析した（抄録）。", "p5": "高血圧への心理社会的な反応、対処と回復力、独居、医療サービスへの障壁、仲間の支え、複数の病気という6つの主題が得られた。恐れ・不安・孤独が多く語られ、信仰と世話をする役割が支えになっていた（抄録）。", "fun": "村で近所の人の血圧を測り、健康の相談に乗っている人たち自身が、高齢で、病気を持ち、一人で暮らしている。支える側の人を、誰が支えるのか。この研究は、ふだん表に出ないその人たちの声を聞いた。寂しくても人の世話を続けることが、本人の生きる力にもなっているという点が、聞き取りならではの発見である。", "unverified": "抄録の末尾が切れており、提言の後半は未確認。対象は7人で、結果を一般化する設計ではない。"}}, {"id": "jr40", "rank": 40, "headline": "互恵的なケアを地域のwell-beingにつなぐモデル", "title": "Reciprocal care as a psychosocial practice: a relational model of interdependence, agency, and community well-being", "url": "https://doi.org/10.3389/fpsyg.2026.2020169", "authors": "José Antonio Younis Hernández ほか", "venue": "Frontiers in Psychology", "date": "2026-11-11", "citescore": 7.0, "citescore_year": "2025", "apa": "Younis Hernández, J. A., Etopa Bitata, M. d. P., Morales Almeida, P., & Morata Sampaio, L. (2026). Reciprocal care as a psychosocial practice: a relational model of interdependence, agency, and community well-being. Frontiers in Psychology, 17. https://doi.org/10.3389/fpsyg.2026.2020169", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "ケアを「依存する人への作業」や規範としてではなく、互いに支え合う関係が人の主体性と地域のwell-beingを生み出す心理社会的な過程として捉える概念モデルを提案した（抄録）。", "p3": "社会心理学、承認論、フェミニストのケアの倫理、社会問題の社会学を踏まえ、脆弱さを人間の基本的な条件、相互依存をその社会的な表れと位置づけ、承認を、共有された脆弱さを関係的な主体性に変える中心の仕組みとして概念化した（抄録）。", "p5": "互恵的なケアは、依存への応答にとどまらず、信頼・互恵・責任・社会参加を育てる生成的な過程だと論じる（抄録）。概念的な論文で、データによる検証は示されていない。", "fun": "「世話をする人」と「世話をされる人」は、はっきり分かれているように見える。しかしこの論文は、誰もが弱さを持ち、誰もが誰かに頼って生きているという点から出発する。弱さを認め合うことが、かえって「自分も人の役に立てる」という力になり、それが地域全体の暮らしやすさにつながる、という見方を示している。", "unverified": "抄録の末尾が切れており、モデルの構成要素の全体と政策への含意は未確認。実証データはない。"}}, {"id": "jr41", "rank": 41, "headline": "人格のないAIの「性格」は再検査で安定する", "title": "Personality without a person: measuring personality in generative AI", "url": "https://doi.org/10.3389/fcomp.2026.1940035", "authors": "Jason L. Harman ほか", "venue": "Frontiers in Computer Science", "date": "2026-11-10", "citescore": 6.2, "citescore_year": "2025", "apa": "Harman, J. L., Scheuerman, J., & Loganathan, N. R. K. (2026). Personality without a person: measuring personality in generative AI. Frontiers in Computer Science, 8. https://doi.org/10.3389/fcomp.2026.1940035", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は未取得）", "preprint": false, "short": true, "p1": "生成AI（LLM）に「性格」と呼べる安定した傾向があるか、指示でペルソナを与えると測定値がどう変わるかを、自己報告と行動課題の両方で調べた（抄録）。", "p3": "4つのLLMを、指示を与えない初期状態と、指示による3種のペルソナの条件で、自己報告式の性格検査と、ゲーム形式の新しい行動的な測定で評価した（抄録）。", "p5": "先行研究と異なり、LLMは非常に高い再検査信頼性を示した。性格の得点はペルソナの指示に沿って予測どおりに変わったが、二つの測定法の一致は、モデルとペルソナの条件によって異なった（抄録）。数値は抄録に記載なし。", "fun": "人の性格は、今日と来週で大きくは変わらない。ではAIはどうか。同じ性格テストを繰り返すと、AIは意外にもほぼ同じ結果を返した。さらに「こういう人物として答えて」と頼むと、その通りに得点が動いた。ただし、質問に答えさせる方法と、ゲームでの行動を見る方法では結果が食い違うこともあり、何を測っているのかはまだ問いが残る。", "unverified": "本文未読のため、モデルの名称、検査の種類、信頼性係数の値は未確認。"}}, {"id": "jr42", "rank": 42, "headline": "多エージェントLLMで都市排水モデルを校正", "title": "Call my agents – multi-agent LLM-based calibration of urban drainage models: performance and reliability across model scales", "url": "https://doi.org/10.2166/wst.2026.365", "authors": "Katharina Teuber", "venue": "Water Science & Technology", "date": "2026-11-11", "citescore": 6.1, "citescore_year": "2025", "apa": "Teuber, K. (2026). Call my agents – multi-agent LLM-based calibration of urban drainage models: performance and reliability across model scales. Water Science & Technology. https://doi.org/10.2166/wst.2026.365", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（図解抄録の説明文を含む）を使用。本文は未取得（抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "都市排水モデルの校正を、複数のLLMエージェントが分担して自動で進める、手元の計算機で動かせる枠組みを作り、性能と信頼性を調べた（抄録）。", "p3": "監督役のエージェントの下に、モデル担当・校正担当・分析担当の3つのエージェントを置き、モデルの準備、校正、評価を反復して実行させる。調整池の例と、より大きい実流域のモデルで、複数のLLMを比べた（抄録）。", "p5": "調整池の校正では最良の当てはまりがNSE = 0.97で、自動校正（NSE ≈ 0.97〜0.98）と同程度だった。ただし作業の完了とLLMが選ぶ校正の設定はモデルと繰り返しで大きくばらつき、大きいLLMは正確だが計算費用が高く、小さいLLMは速いが不安定だった（抄録）。", "fun": "雨水が下水道をどう流れるかを計算する模型は、実測に合うように多くの数値を調整する必要があり、専門家でも手間がかかる。この研究は、監督役と三人の担当役のAIに会話で作業を進めさせた。結果は専門の自動手法に並ぶこともあったが、同じ指示でも毎回うまくいくとは限らなかった。腕はあるが、まだ安定しない新人のようである。", "unverified": "抄録の末尾が切れており、大きい実流域モデルでの結果の数値は未確認。比べたLLMの名称も未確認。"}}, {"id": "jr43", "rank": 43, "headline": "エージェント型AIの知識統合で厄介な問題を支援", "title": "Decision support through agentic AI: Knowledge-integration mechanisms for wicked-problem solving and the design-maturity paradox", "url": "https://doi.org/10.1016/j.dss.2026.114799", "authors": "Shaofeng Wang ほか", "venue": "Decision Support Systems", "date": "2026-11-12", "sjr": 2.079, "citescore": 13.5, "citescore_year": "2025", "apa": "Wang, S., & Zhang, H. (2026). Decision support through agentic AI: Knowledge-integration mechanisms for wicked-problem solving and the design-maturity paradox. Decision Support Systems, 114799. https://doi.org/10.1016/j.dss.2026.114799", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、エージェント型のAIによる意思決定支援について、解き方も正解も定まらない「厄介な問題」を解くための知識統合の仕組みと、設計の成熟度に関する逆説を扱う研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、関係者ごとに何が問題かの見方さえ違うような難題に対して、自分で段取りを立てて動くAIが、ばらばらの知識をどうまとめれば助けになるか、というものである。題名にある「設計の成熟度の逆説」は、作り込むほど良くなるとは限らないことを示唆するが、内容は未確認である。", "unverified": "抄録・本文を入手できず、研究の方法（設計研究か実証か）、対象の問題、結果はすべて未確認。"}}, {"id": "jr44", "rank": 44, "headline": "AI導入がwell-being経由で成績に効く仮説は不支持", "title": "AI Adoption, Employee Well-being and Job Performance", "url": "https://doi.org/10.68379/sbzf3x83", "authors": "Mehreen Aslam", "venue": "Dyal Singh Journal of Humanities & Social Sciences", "date": "2026-11-11", "apa": "Aslam, M. (2026). AI Adoption, Employee Well-being and Job Performance. Dyal Singh Journal of Humanities & Social Sciences, 4(1), 117–149. https://doi.org/10.68379/sbzf3x83", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "AI導入が従業員のwell-beingを通じて職務成績を高め、AI不安がその関係を弱めるという仮説を検証したが、媒介も調整も支持されなかった（抄録）。", "p3": "仕事の要求度-資源モデルと資源保存理論に基づき、3時点の時間差のある調査で、従業員の回答と上司が評価した職務成績を組にした400件を、回帰とブートストラップによる条件付き間接効果で分析した（抄録）。", "p5": "well-beingはその後の成績と正に関連した（b = 0.24）が、AI導入とwell-beingの関連は有意でなく（b = 0.03）、条件付き間接効果も交互作用も有意でなかった。AI導入は成績と直接に正の関連を持ち（b = 0.23）、AI不安はwell-beingと成績の両方と負に関連した（抄録）。", "fun": "「AIを入れると働く人が元気になり、だから成績が上がる」という筋書きは、もっともらしい。しかしこの研究で実際に測ると、AI導入と元気さの間にはっきりした関係は見つからなかった。成績は上がっていたが、元気さを通る道ではなかったのである。予想が外れた結果をそのまま報告している点に価値がある。", "unverified": "抄録の末尾が切れており、結論の後半は未確認。掲載誌は小規模で、標本の国と業種も未確認。"}}, {"id": "jr45", "rank": 45, "headline": "AIは高齢化による労働力不足を埋められるか", "title": "AI and the Peak Retirement Wave in the U.S.: Can AI Bridge the Coming Labor Gap?", "url": "https://doi.org/10.1093/workar/waag018", "authors": "Mo Wang ほか", "venue": "Work, Aging and Retirement", "date": "2026-11-09", "sjr": 1.396, "citescore": 6.5, "citescore_year": "2025", "apa": "Wang, M., & Fang, Y. (2026). AI and the Peak Retirement Wave in the U.S.: Can AI Bridge the Coming Labor Gap? Work, Aging and Retirement. https://doi.org/10.1093/workar/waag018", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "米国で退職が集中する時期に、AIが労働力の不足をどこまで埋められるかを論じ、部分的には補えるが、政策と組織の設計しだいだと結論した（抄録）。", "p3": "2024年に65歳になった人は過去最多で、2035年までに約1,600万人が退職すると見込まれる。この状況で、AIの可能性を、作業の自動化だけでなく、残る従業員の仕事の拡張と、長く働けるようにする役割の再設計の面から検討した論考である（抄録）。", "p5": "AIは、判断、暗黙知、対人のケア、手先の器用さに頼る職業の代替には明確な限界がある。急速な導入は、若手と中堅の働き手の育成の道筋を乱す危険も生む（抄録）。データによる推定は抄録に記載なし。", "fun": "働き手が一斉に退職していくなら、足りない分をAIに任せればよい、と考えたくなる。しかし、長年の経験でしか身につかない勘や、人の世話、細かい手作業は、AIが苦手とするところである。この論考は、AIを「人の代わり」でなく「年を重ねても働き続けられるようにする道具」として設計することを提案している。", "unverified": "抄録の末尾が切れており、提言の全体は未確認。実証分析ではなく論考と読める。"}}, {"id": "jr46", "rank": 46, "headline": "ハイデラバード都市圏の地価を成長分析で可視化", "title": "Spatial Data Visualization for Urban Land Value Assessment Using Growth Analysis: A Case Study of Morphological Transformations in Hyderabad Metropolitan Region, India", "url": "https://doi.org/10.1061/jupddm.upeng-6450", "authors": "D. Shivaram Reddy ほか", "venue": "Journal of Urban Planning and Development", "date": "2026-11-11", "citescore": 3.9, "citescore_year": "2025", "apa": "Shivaram Reddy, D., & Onkar, P. S. (2027). Spatial Data Visualization for Urban Land Value Assessment Using Growth Analysis: A Case Study of Morphological Transformations in Hyderabad Metropolitan Region, India. Journal of Urban Planning and Development, 153(1). https://doi.org/10.1061/jupddm.upeng-6450", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は未取得）", "preprint": false, "short": true, "p1": "インドのハイデラバード都市圏を例に、都市の成長の広がり方と地価の変動を空間データの可視化で結びつけ、土地の需要が高い区域を把握しようとした（抄録）。", "p3": "都市の物理的な成長の型を分析し、成長と地価の変化を対応づけて、地価から見た土地需要の区域を空間的に可視化した（抄録）。手法の詳細は抄録に記載なし。", "p5": "都市の成長の型を使って土地需要の区域を理解できるとする（抄録）。抄録は背景の説明が中心で、得られた区域の内容や数値は記載されていない。", "fun": "街が広がると、どこの土地の値段が上がるのか。地図の上に、街の広がり方と地価の動きを重ねてみると、需要が集まる場所が浮かび上がる。土地は増やせない資源なので、どこが求められているかを早くつかむことが、計画の出発点になる。この研究は、その見える化を急成長する大都市で試みている。", "unverified": "抄録に手法と結果の具体的な記述がなく、使用データ、期間、区域の内容はすべて未確認。"}}, {"id": "jr47", "rank": 47, "headline": "スマートシティの包摂的イノベーションを116報で整理", "title": "Inclusive innovation in smart cities: a systematic literature review of conceptual fragmentation, dominant themes, and research gaps", "url": "https://doi.org/10.3389/frsc.2026.1983822", "authors": "Seyedeh Sedigheh Ghorashi ほか", "venue": "Frontiers in Sustainable Cities", "date": "2026-11-09", "citescore": 5.1, "citescore_year": "2025", "apa": "Ghorashi, S. S., Karvonen, A., Mobini Dehkordi, A., & Yadollahi Farsi, J. (2026). Inclusive innovation in smart cities: a systematic literature review of conceptual fragmentation, dominant themes, and research gaps. Frontiers in Sustainable Cities, 8. https://doi.org/10.3389/frsc.2026.1983822", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "スマートシティ研究で使われる「包摂的イノベーション」という概念が、ばらばらに定義・運用されている現状を、系統的な文献レビューで整理した（抄録）。", "p3": "ScopusとWeb of Scienceの検索で特定した査読つき文献116件を、PRISMAの手順に従い、語の共起の計量書誌分析と、主題の統合によって分析した（抄録）。", "p5": "スマートな統治と市民参加、デジタル包摂と基盤、公平・正義と社会イノベーション、環境の持続可能性と都市の回復力、知識の共同生産と都市の実験の場という5つの主題群が得られた。包摂的イノベーションは技術へのアクセスを超え、市民の主体性や手続きの正義を含む多次元の概念だとした（抄録）。", "fun": "スマートシティは、便利な技術で街を良くする計画である。しかし「誰にとって良いのか」は別の問題で、技術を使いこなせる人だけが得をする街になるおそれもある。そこで「みんなを取り残さない」という言葉が掲げられるが、その中身は研究ごとにばらばらだった。この研究は多数の論文を読み比べ、言葉の中身を五つの束に整理した。", "unverified": "抄録の末尾が切れており、指摘された研究の空白の内容は未確認。"}}, {"id": "jr48", "rank": 48, "headline": "循環型の都市代謝に向けた技能と空間の転換", "title": "Planning for circular urban metabolism: Intertwining skills and spatial transformation for manufacturing transition in Padua and Venice, Italy", "url": "https://doi.org/10.1177/00420980261499471", "authors": "Claudia Faraone ほか", "venue": "Urban Studies", "date": "2026-11-11", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "apa": "Faraone, C., Gambarotto, F., Nicoletto, L., & Pedrini, G. (2026). Planning for circular urban metabolism: Intertwining skills and spatial transformation for manufacturing transition in Padua and Venice, Italy. Urban Studies. https://doi.org/10.1177/00420980261499471", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得（抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "循環型の経済へ移るうえで、都市の製造業の立地と技能がどう働き、都市計画がそれを助けているか妨げているかを、イタリアの二つの工業地域で調べた（抄録）。", "p3": "パドヴァとヴェネツィアについて、製造業の空間分布の最近の変化を、形態・空間の分析、都市計画の評価、雇用と廃棄物の定量データを組み合わせた混合手法で調べた（抄録）。", "p5": "技術系の製造業が、技術的な技能と環境関連の雇用に支えられ、廃棄物の発生抑制と再資源化を通じて循環の実績を引っ張っていた。一方、両都市とも、新しい循環の動きと既存の用途地域の枠組みがかみ合っておらず、計画は断片的で受け身だった（抄録）。", "fun": "ごみを出さず、資源を回して使う経済に変えるには、工場どうしが近くにあって、ある工場の廃棄物を別の工場の材料にできると都合がよい。ところが、街の用途の区分けは昔の考えで決められていて、そうした近さを生かしにくい。この研究は、技能を持つ人と工場の近さを「街の資源」と見て、区分けの決め方を変えるよう求めている。", "unverified": "抄録の末尾が切れており、提言の後半は未確認。定量データの数値も抄録に記載なし。"}}, {"id": "jr49", "rank": 49, "headline": "据置充電と電化道路の回廊単位のインフラ費用", "title": "Corridor-level infrastructure costs of static charging versus electric road systems in Germany", "url": "https://doi.org/10.1016/j.trd.2026.105725", "authors": "Mathias Schmidt ほか", "venue": "Transportation Research, Part D: Transport and Environment", "date": "2026-11-10", "sjr": 2.032, "citescore": 13.6, "citescore_year": "2025", "apa": "Schmidt, M., & Walther, G. (2027). Corridor-level infrastructure costs of static charging versus electric road systems in Germany. Transportation Research Part D: Transport and Environment, 163, 105725. https://doi.org/10.1016/j.trd.2026.105725", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（出版社サイトの本文は未取得）", "preprint": false, "short": true, "p1": "ドイツの高速道路網で、電気トラックのための据置型の充電設備と、走りながら給電する電化道路（Electric Road Systems）の費用を、同じ単位で比べられるようにした（抄録）。", "p3": "電気トラックの需要が必要とする据置の設備（荷さばき場の充電、公共の充電拠点、変電所、蓄電、系統接続）を積み上げ式に設計・積算し、費用を区間の長さで割って、電化道路の基準と比べられる1kmあたりの指標にした（抄録）。", "p5": "据置型は、対象とした回廊の長さの37.6%で電化道路より高く、最も混む区間では1kmあたり400万ユーロという基準の2.6〜3.2倍に達した。区間ごとに安いほうを割り当てると、理想的には投資を21%節約できる（抄録）。", "fun": "電気トラックを走らせるには、止まって充電する場所を増やすか、道路に架線などを付けて走りながら電気を送るかの二つの道がある。後者は工事費が高すぎると見られてきた。しかし交通量の多い区間では、充電場所を大量に作るほうがかえって高くつくことが分かった。どちらか一方でなく、区間ごとに使い分けるのが得になる。", "unverified": "本文未読のため、需要の想定年次、費用の前提、電化道路の基準値の出どころは未確認。"}}, {"id": "jr50", "rank": 50, "headline": "都市の土地資本化が農村産業の発展を縛る", "title": "Urban land capitalization and rural industrial development: How spatial fix theory explains constraints on urban-rural integration in China", "url": "https://doi.org/10.1016/j.jrurstud.2026.104508", "authors": "Zhenzhen Chen ほか", "venue": "Journal of Rural Studies", "date": "2026-11-11", "sjr": 1.731, "citescore": 10.9, "citescore_year": "2025", "apa": "Chen, Z., & Lei, P. (2027). Urban land capitalization and rural industrial development: How spatial fix theory explains constraints on urban-rural integration in China. Journal of Rural Studies, 129, 104508. https://doi.org/10.1016/j.jrurstud.2026.104508", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、中国で都市の土地が資本として扱われること（土地の資本化）と農村の産業発展の関係を取り上げ、都市と農村の統合を妨げる制約を「空間的回避（spatial fix）」の理論で説明する研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、都市の土地の値上がりで資金を生み出す仕組みが、なぜ農村の産業を育てる妨げになるのか、というものである。資本が行き場を求めて場所を移していくという地理学の理論で、都市と農村の関係を読み解こうとしている点が題名からうかがえる。結果は未確認。", "unverified": "抄録・本文を入手できず、研究の方法、対象地域、結論はすべて未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "脆弱な保険会社が住宅ローンの気候リスクを隠す", "title": "When Insurers Exit: Climate Losses, Fragile Insurers, and Mortgage Markets", "url": "https://doi.org/10.1093/qje/qjag053", "authors": "Parinitha Sastry ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-11-07", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "apa": "Sastry, P., Sen, I., & Tenekedjieva, A.-M. (2026). When Insurers Exit: Climate Losses, Fragile Insurers, and Mortgage Markets. The Quarterly Journal of Economics. https://doi.org/10.1093/qje/qjag053", "why": "フロリダ州の2009〜2018年の住宅ローンと保険の新しいデータで、資本と分散の乏しい保険会社が市場を占め、その破綻が災害後のローン不履行を因果的に増やすことを示した。政府支援機関（GSE）は第三者の格付けに頼って破綻リスクの高い保険を値づけせずに受け入れており、フロリダでのGSEの期待損失の推定25%が保険の脆弱さに由来する。貸し手は自ら保有するジャンボ融資でだけ保険の質に反応する。"}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "誤った信念が大量のデータのもとでも残る理由", "title": "Channeled Attention and Stable Errors", "url": "https://doi.org/10.1093/qje/qjag055", "authors": "Tristan Gagnon-Bartsch ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-11-09", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "apa": "Gagnon-Bartsch, T., Rabin, M., & Schwartzstein, J. (2026). Channeled Attention and Stable Errors. The Quarterly Journal of Economics. https://doi.org/10.1093/qje/qjag055", "why": "人は自分の（誤っているかもしれない）モデルを通して注意を向けるため、データに触れてもモデルの誤りを示す統計を追わない、という注意に基づく枠組みを示した。「関係ない」「区別はない」と何かを誤って除外するモデルは、反証するデータから注意をそらすので安定しやすい。誤りが見つかるかは損害の大きさと結びつかず、新しい目が誤りに気づく理由などを説明する。"}, {"id": "jn03", "rank": 3, "field": "経営学", "headline": "A/Bテストの因果信号で言語モデルを調整", "title": "EXPRESS: Causal Alignment: Augmenting Language Models with A/B Tests", "url": "https://doi.org/10.1177/00222437261510017", "authors": "Panagiotis Angelopoulos ほか", "venue": "Journal of Marketing Research", "date": "2026-11-11", "sjr": 7.363, "citescore": 11.0, "citescore_year": "2025", "apa": "Angelopoulos, P., Lee, K., & Misra, S. (2026). EXPRESS: Causal Alignment: Augmenting Language Models with A/B Tests. Journal of Marketing Research. https://doi.org/10.1177/00222437261510017", "why": "無作為化実験が示す「どの方向に直せば良くなるか」を教師信号として言語モデルを微調整し、成果の低い文面を高い文面に変える改善器を作る枠組みを示した。36キャンペーン・2億8,300万インプレッションのメール配信の実地実験で、改善した件名のクリック率は専門家だけの場合より32%高く、パラメータ数が30倍の汎用モデルは改善しなかった。"}, {"id": "jn04", "rank": 4, "field": "天文学", "headline": "M87*のブラックホールの影を独立の手法で確認", "title": "Independent interferometric observable confirms black hole shadow in M87*", "url": "https://doi.org/10.1038/s41586-026-11241-9", "authors": "Samuel Lai ほか", "venue": "Nature", "date": "2026-11-11", "sjr": 19.713, "citescore": 77.7, "citescore_year": "2025", "apa": "Lai, S., Thyagarajan, N., Wong, O. I., & Diakogiannis, F. (2026). Independent interferometric observable confirms black hole shadow in M87*. Nature, 659(8140), 317–323. https://doi.org/10.1038/s41586-026-11241-9", "why": "超長基線電波干渉計の観測は疎で、画像の再構成は校正や事前の仮定に左右されるため、M87*のリング状の構造には異論もあった。形の事前仮定を置かず、装置の校正誤差に影響されない観測量に基づく独立の画像化アルゴリズムを同じデータに適用し、角直径42.2±1.5マイクロ秒角のリング（質量は太陽の65±5億倍に相当）を再現した。"}, {"id": "jn05", "rank": 5, "field": "経営学", "headline": "エボラの恐怖が黒人の住宅ローン否決率を上げた", "title": "Deadly Disease, Fear, and Ostracism in the Credit Market", "url": "https://doi.org/10.1287/mnsc.2025.01919", "authors": "Sumit Agarwal ほか", "venue": "Management Science", "date": "2026-11-10", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Agarwal, S., Lin, P., Lin, Y., Lu, R., & Zhang, X. (2026). Deadly Disease, Fear, and Ostracism in the Credit Market. Management Science. https://doi.org/10.1287/mnsc.2025.01919", "why": "2014年の米国のエボラ流行を自然実験として、感染リスクがほぼないのに黒人申請者の住宅ローン否決率が3.8ポイント上がったことを示した。承認された借り手は信用力が高く不履行も少なく、アルゴリズムによるフィンテック融資では効果がなく、流行後すぐ戻ることから、統計的差別では説明できないと論じる。"}, {"id": "jn06", "rank": 6, "field": "経営学", "headline": "非上場企業の開示が上場企業の銀行依存を下げる", "title": "Private Firm Disclosures and Public Firms' Debt Choice", "url": "https://doi.org/10.2308/tar-2024-0646", "authors": "Fengqin Chen ほか", "venue": "The Accounting Review", "date": "2026-11-10", "sjr": 4.403, "citescore": 7.5, "citescore_year": "2025", "apa": "Chen, F., Pittman, J., & Saffar, W. (2026). Private Firm Disclosures and Public Firms’ Debt Choice. The Accounting Review, 1–30. https://doi.org/10.2308/tar-2024-0646", "why": "複数国の標本で、非上場企業の開示の透明性が情報の非対称性を狭め、上場企業の銀行借入への依存を下げることを示した。電子的な商業登記の段階的な導入を外生的なショックとして用い、監視需要の低下・借入費用の低下・格付けの質の向上という経路を確かめた。"}, {"id": "jn07", "rank": 7, "field": "工学", "headline": "しなるゴム翼で潮流タービンの疲労荷重を3分の1減", "title": "Flexible rubber blades for tidal turbines", "url": "https://doi.org/10.1038/s41586-026-11278-w", "authors": "Zhehong Zhang ほか", "venue": "Nature", "date": "2026-11-11", "sjr": 19.713, "citescore": 77.7, "citescore_year": "2025", "apa": "Zhang, Z., Tan, J., Neba, E.-C., Morival, S., Frankowski, K., Daval, B., & Viola, I. M. (2026). Flexible rubber blades for tidal turbines. Nature. https://doi.org/10.1038/s41586-026-11278-w", "why": "潮流発電のタービンは非定常な流体荷重を受け、大型機は複雑で高価な能動ピッチ制御に頼っている。翼弦方向に後縁が変形する柔らかいゴム製の翼が、模擬した潮汐周期で能動ピッチ制御つきの剛な翼と同等の総発電量を保ちつつ、疲労の原因となる高周波の荷重変動を最大3分の1抑えることを実験で示した。"}, {"id": "jn08", "rank": 8, "field": "経済学", "headline": "洪水域からの買い上げ移転の便益は裕福な地区に偏る", "title": "Does government-assisted relocation help households", "url": "https://doi.org/10.1126/sciadv.aef4602", "authors": "Rachel Young", "venue": "Science Advances", "date": "2026-11-11", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "apa": "Young, R. (2026). Does government-assisted relocation help households. Science Advances, 12(46). https://doi.org/10.1126/sciadv.aef4602", "why": "米国FEMAの住宅買い上げプログラムを、全国の世帯の縦断記録で評価した。参加世帯は洪水危険区域の外へ移りやすく、短期的に負債が減り近隣の社会経済条件が改善するが、便益は裕福で白人が多い地区の参加者に集中する。便益費用比は3つのシナリオで0.84〜1.28だった。"}, {"id": "jn09", "rank": 9, "field": "計算社会科学・ネットワーク科学", "headline": "150年分の独議会の移民論戦をLLMで注釈", "title": "LLM Analysis of 150+ Years of German Parliamentary Debates on Migration Reveals a Shift from Post-War Solidarity to Anti-Solidarity in the Last Decade", "url": "https://doi.org/10.1162/coli.a.666", "authors": "Aida Kostikova ほか", "venue": "Computational Linguistics", "date": "2026-11-10", "sjr": 1.837, "citescore": 28.8, "citescore_year": "2025", "apa": "Kostikova, A., Pütz, O., Eger, S., Sabelfeld, O., & Paassen, B. (2026). LLM Analysis of 150+ Years of German Parliamentary Debates on Migration Reveals a Shift from Post-War Solidarity to Anti-Solidarity in the Last Decade. Computational Linguistics, 1–94. https://doi.org/10.1162/coli.a.666", "why": "ドイツ議会（1867〜2025年）の移民をめぐる発言の連帯・反連帯をLLMで注釈し、最良のモデルは人間同士の一致に近いmacro-F1に達するが系統誤差が下流の推定を偏らせうることを示した。設計に基づく教師あり学習（DSL）で補正した長期の傾向では、戦後に連帯が高く、2015年以降に反連帯が目立って増えた。"}, {"id": "jn10", "rank": 10, "field": "人口学", "headline": "共同名義の土地権利証は夫婦の絆の証になる", "title": "Joint Land Titling and the Marital Bond in Southwestern Uganda", "url": "https://doi.org/10.1111/padr.70103", "authors": "Michelle Poulin ほか", "venue": "Population and Development Review", "date": "2026-11-11", "sjr": 1.616, "citescore": 7.9, "citescore_year": "2025", "apa": "Poulin, M., & Pierotti, R. S. (2026). Joint Land Titling and the Marital Bond in Southwestern Uganda. Population and Development Review. https://doi.org/10.1111/padr.70103", "why": "ウガンダ南西部で土地権利証を全額補助した無作為化介入では、夫の多くが妻の名を加えた。その意味を観察と面接で調べ、共同名義が妻の交渉力を高めるだけでなく、夫の結婚への関与の象徴として働き、結婚への投資を促す「協力的な力」を生むことを示した。"}, {"id": "jn11", "rank": 11, "field": "工学", "headline": "アンカー定着部の接触応力を超音波の非線形で推定", "title": "A non-destructive stress evaluation model for anchorage interfaces integrating contact mechanics and ultrasonic nonlinearity", "url": "https://doi.org/10.1177/14759217261501265", "authors": "Linqiang Zhou ほか", "venue": "Structural Health Monitoring", "date": "2026-11-11", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Zhou, L., Qian, J., & Guo, C. (2026). A non-destructive stress evaluation model for anchorage interfaces integrating contact mechanics and ultrasonic nonlinearity. Structural Health Monitoring. https://doi.org/10.1177/14759217261501265", "why": "橋梁のアンカー定着部の接触面の応力を非破壊で評価するため、接触力学と非線形音響を統合した理論モデルを作り、反射の非線形係数を界面剛性から導いた。表面の粗さと材料定数から剛性と応力の関係を導くので経験的な当てはめが減り、現場の多数より線の定着部で予測と実測の接触応力の相対誤差は8.49%だった。"}, {"id": "jn12", "rank": 12, "field": "経営学", "headline": "リスク・曖昧さへの態度と主観的信念を同時に測る", "title": "Uncertainty Attitudes, Subjective Beliefs, and Decisions Under Uncertainty", "url": "https://doi.org/10.1287/mnsc.2024.06232", "authors": "Adeline Delavande ほか", "venue": "Management Science", "date": "2026-11-10", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Delavande, A., Ganguli, J., & Mengel, F. (2026). Uncertainty Attitudes, Subjective Beliefs, and Decisions Under Uncertainty. Management Science. https://doi.org/10.1287/mnsc.2024.06232", "why": "一般の人々を対象に、健康と金融の意思決定について、リスクと曖昧さへの態度（個人別の確率加重と損失回避）と事象の主観確率を同時に集めた。選好も信念も大きくばらつき、源泉依存の確率加重を持つプロスペクト理論は主観的期待効用より一部の文脈で厳密に良く当てはまる。"}, {"id": "jn13", "rank": 13, "field": "心理学", "headline": "夏時間への切替え直後は詐欺メールを13%多く踏む", "title": "Modest loss of sleep increases susceptibility to cybersecurity threats", "url": "https://doi.org/10.1073/pnas.2622467123", "authors": "Eitan Schechtman", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-11", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Schechtman, E. (2026). Modest loss of sleep increases susceptibility to cybersecurity threats. Proceedings of the National Academy of Sciences, 123(46). https://doi.org/10.1073/pnas.2622467123", "why": "夏時間への移行（睡眠が短くなる）の直後の月曜朝か1週間前に、大学の職員11,218人へ模擬のフィッシングメールを無作為に送った。移行後は不審なリンクをクリックする確率が約13%高く、メールを開く確率や迷惑メールとして報告する確率は変わらなかった。"}, {"id": "jn14", "rank": 14, "field": "組織行動・心理的安全性", "headline": "単一項目尺度で示せる性質と示せない性質", "title": "A Psychometric Evaluation of Single‐Item Measures", "url": "https://doi.org/10.1111/1748-8583.70071", "authors": "Justin A. DeSimone", "venue": "Human Resource Management Journal (UK)", "date": "2026-11-10", "sjr": 3.013, "citescore": 14.9, "citescore_year": "2025", "apa": "DeSimone, J. A. (2026). A Psychometric Evaluation of Single‐Item Measures. Human Resource Management Journal. https://doi.org/10.1111/1748-8583.70071", "why": "人的資源管理の研究で増えている単一項目の尺度について、古典的テスト理論・項目反応理論・一般化可能性理論から、因子構造と内的一貫性は実証的に示せず、時間的な安定性・評定者間信頼性・基準関連妥当性は評価に適することを整理し、使用を判断するチェックリストを示した。"}, {"id": "jn15", "rank": 15, "field": "工学", "headline": "橋の吊材ワイヤのフレッティング疲労の進み方", "title": "Fretting Wear and Fatigue Interaction Evolution of Bridge Suspender Wires under Various Contact Conditions and Cyclic Load Characteristics", "url": "https://doi.org/10.1061/jbenf2.beeng-8091", "authors": "Yafei Ma ほか", "venue": "Journal of Bridge Engineering", "date": "2026-11-11", "citescore": 7.2, "citescore_year": "2025", "apa": "Ma, Y., Fu, Z., Wang, G., Liu, H., & Wang, L. (2027). Fretting Wear and Fatigue Interaction Evolution of Bridge Suspender Wires under Various Contact Conditions and Cyclic Load Characteristics. Journal of Bridge Engineering, 32(1). https://doi.org/10.1061/jbenf2.beeng-8091", "why": "接触条件と繰返し応力を精密に制御できる新しい試験装置で、吊材ワイヤのフレッティング疲労を光学顕微鏡・走査電子顕微鏡・3次元レーザー走査で多段階に観察した。き裂は応力集中の大きい摩耗痕の縁から生じ、疲労寿命は接触角に対して単調でなく、接触角と応力比の交互作用に強く左右される。"}, {"id": "jn16", "rank": 16, "field": "経営学", "headline": "プライバシー保護が推薦を歪め双方を害しうる", "title": "Recommender Systems Under Privacy Protection", "url": "https://doi.org/10.1287/mnsc.2024.05007", "authors": "Can Küçükgül ほか", "venue": "Management Science", "date": "2026-11-10", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Küçükgül, C., Özer, Ö., & Wang, S. (2026). Recommender Systems Under Privacy Protection. Management Science. https://doi.org/10.1287/mnsc.2024.05007", "why": "利益を追うプラットフォームの推薦の設計を、プライバシー保護の制度ごとに分析した。オプトアウト型の保護は無保護と機能的に同じで、消費者が個人データを偽れると推薦が歪んで双方が損をし、推薦が商品の割当ても担う場合は不利な少数者を機会から締め出す差別が生じうる。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "利益を追うプラットフォームが、プライバシー保護の制度の違いに応じて推薦の方針をどう設計するかを理論的に分析し、保護がかえって双方を害する場合があることを示した（抄録）。", "p3": "オプトアウト型の保護、消費者が個人データを偽れる保護などの制度のもとで、推薦が情報提供だけを担う場合と、商品へのアクセスの割当ても担う場合を比べた（抄録）。", "p5": "オプトアウト型の保護は無保護と機能的に同じになる。消費者がデータを偽れると推薦が歪み、双方が損をしうる。推薦が情報提供だけなら個別化そのものが行われなくなりうるが、割当ても担う場合は、不利な少数者が価値ある機会から締め出されるアルゴリズム上の差別が生じうる（抄録）。", "fun": "「自分の情報を隠したり、うそを書いたりできる権利」は、利用者を守るように見える。ところが、店の側は「この情報はうそかもしれない」と考えて推薦の出し方を変えるので、結局は利用者も店も損をすることがある。良かれと思って作った決まりが、相手の出方まで考えると裏目に出る。ゲーム理論らしい結論である。", "unverified": "本文未読のため、モデルの仮定の詳細と、結果が成り立つ条件の範囲は未確認。理論研究で実証データは使っていないと読める。"}}, {"id": "jn17", "rank": 17, "field": "経営学", "headline": "環境に熱心な企業ほどCEOは説明会で語らない", "title": "CEO environmental communication, speech acts, and firm value", "url": "https://doi.org/10.1007/s11747-026-01221-w", "authors": "Hai-Anh Tran ほか", "venue": "Journal of the Academy of Marketing Science", "date": "2026-11-11", "sjr": 6.426, "citescore": 22.3, "citescore_year": "2025", "apa": "Tran, H.-A., Ludwig, S., Nguyen, B., Noble, C. H., & Grewal, D. (2026). CEO environmental communication, speech acts, and firm value. Journal of the Academy of Marketing Science. https://doi.org/10.1007/s11747-026-01221-w", "why": "364社・14,523件の決算説明会の質疑を微調整したDeBERTaで分析し、環境への取り組みが強い企業ほどCEOがそれを語らないこと、語る場合は断定・指示の言い方が企業価値と正に、感情表明・約束の言い方が負に関連することを示した。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "環境への取り組みが強い企業ほど、CEOが決算説明会でそれをあまり語らないこと、語り方しだいで企業価値との関連が正にも負にもなることを示した（抄録）。", "p3": "2007〜2022年の上場364社・14,523件の決算説明会の質疑応答について、環境評価の得点と財務データを組み合わせ、微調整したDeBERTaモデルで、CEOの環境に関する発言と、その発話の意図（言語行為の種類）を測った（抄録）。", "p5": "取り組みの強い企業のCEOは、多くではなく少なく語っていた。語る場合、断定と指示の言い方は企業価値との正の関連を保ち、感情の表明と約束の言い方は負に関連した（抄録）。効果の大きさは抄録に記載なし。", "fun": "環境に熱心な会社の社長ほど、その話をたくさんすると思いきや、実際は逆に口数が少なかった。さらに、話すときの言い方が大事だった。「こうしています」「こうします」と言い切る話し方は評価され、「心を痛めています」「約束します」という話し方は、かえって株式市場の評価と負に結びついていた。何を言うかより、どう言うかが効く。", "unverified": "本文未読のため、言語行為の分類の精度と、企業価値の指標の定義は未確認。"}}, {"id": "jn18", "rank": 18, "field": "経営学", "headline": "サービス生態系の設計で意見の対立をどう扱うか", "title": "Connected Friction—Collectively Designing Service Ecosystems Through Reflexive Relations", "url": "https://doi.org/10.1177/10946705261492132", "authors": "Audun Formo Hay ほか", "venue": "Journal of Service Research", "date": "2026-11-11", "sjr": 5.517, "citescore": 19.7, "citescore_year": "2025", "apa": "Hay, A. F., Vink, J., Thøgersen, D. M., Ness, O., von Heimburg, D., & Sangiorgi, D. (2026). Connected Friction—Collectively Designing Service Ecosystems Through Reflexive Relations. Journal of Service Research. https://doi.org/10.1177/10946705261492132", "why": "相互依存する関係者がサービス生態系の仕組みを作り替えるとき、構造の受け止め方の違いから対立が起きる。省察を個人の能力でなく関係の性質として捉え、その育て方を調べた研究。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得（抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "立場の違う関係者が、サービスの仕組みを支える社会的な構造を一緒に見えるようにし、問い直し、作り替えられる状態にする「省察的な関係」の育て方を明らかにした（抄録）。", "p3": "省察を個人の能力でなく関係の性質として定義し、ノルウェーの児童福祉を対象にした2年間の協同的な探究で、その関係が生まれる過程を調べた（抄録）。", "p5": "省察的な関係は「つながった摩擦」という弁証法的な動きを通じて生まれ、画一化と断絶はそれを妨げる。この動きを支える状況の条件を4つ特定した（抄録）。条件の一部は抄録が切れており未確認。", "fun": "多くの人が関わる仕組みを変えようとすると、意見がぶつかる。ぶつかりを避けて皆が同じ考えになれば楽だが、それでは見落としが出る。逆に、ぶつかって関係が切れてしまえば何も進まない。この研究は、切れずにぶつかり続ける「つながった摩擦」こそが、仕組みを良い方向へ作り替える力になると論じている。", "unverified": "抄録の末尾が切れており、4つの条件の全体と実践への含意は未確認。"}}, {"id": "jn19", "rank": 19, "field": "機械学習", "headline": "LLMの幻覚と関連する7つの変数を回帰で特定", "title": "Uncovering the Correlates of Hallucination in Large Language Models: A Regression Analysis Perspective", "url": "https://doi.org/10.1162/coli.a.665", "authors": "Vicente Ivan Sanchez Carmona ほか", "venue": "Computational Linguistics", "date": "2026-11-10", "sjr": 1.837, "citescore": 28.8, "citescore_year": "2025", "apa": "Carmona, V. I. S., Jiang, S., & Dong, B. (2026). Uncovering the Correlates of Hallucination in Large Language Models: A Regression Analysis Perspective. Computational Linguistics, 1–12. https://doi.org/10.1162/coli.a.665", "why": "30のLLMと9つの幻覚データセットの質問を使い、15の変数と幻覚の関連を回帰分析で調べた。7つの変数が関連し、その効果はモデルや質問によって異なり、2変数の交互作用もあることを示した。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "言語モデルの幻覚（事実と違う、または入力に忠実でない出力）がどんな変数と関連するかを、多数のモデルにまたがる回帰分析で調べた（抄録）。", "p3": "9つの幻覚のデータセットの質問を使い、30のLLMについて15の変数と幻覚の関連を調べた（抄録）。変数の内容は抄録に記載なし。", "p5": "7つの変数が幻覚と関連していた。一部の変数は、モデル全体に共通する系統的な効果だけでなく、モデルや入力の質問ごとに異なる効果を持ち、2変数の交互作用もあって、幻覚の生じ方はこれまで考えられていたより複雑だった（抄録）。", "fun": "AIがもっともらしいうそを言ってしまう「幻覚」は、何が原因で起きるのか。この研究は、たくさんのAIとたくさんの質問を集めて、統計の方法で関係を探した。分かったのは、「これが原因」と一つに言える単純な話ではない、ということだった。同じ要因でも、AIや質問によって効き方が違い、要因どうしが組み合わさって働いていた。", "unverified": "本文未読のため、15の変数と関連のあった7つの変数の具体的な内容は未確認。"}}, {"id": "jn20", "rank": 20, "field": "機械学習", "headline": "5トンの建機が2輪で立つ曲芸を強化学習で", "title": "Heavy metal acrobatics: Learning dynamic control for skid-steer loaders", "url": "https://doi.org/10.1126/scirobotics.aef0894", "authors": "Pierre-Jean Lorentz ほか", "venue": "Science Robotics", "date": "2026-11-11", "sjr": 5.883, "citescore": 32.1, "citescore_year": "2025", "apa": "Lorentz, P.-J., Egli, P., Jelavic, E., Li, C., Sundar, R., Suresh, H., Montgomery, P., Redden, L., Müller, M., Sener, O., Koltun, V., & Hutter, M. (2026). Heavy metal acrobatics: Learning dynamic control for skid-steer loaders. Science Robotics, 11(120). https://doi.org/10.1126/scirobotics.aef0894", "why": "油圧駆動で動特性が複雑な5トンのスキッドステアローダーについて、シミュレーションでの強化学習と実機への転移で、2輪に立ち上がって不整地を走り、軌道を描き、旋回して安全に着地する曲芸的な操作を自律で実現した。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得（抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "油圧で動く5トンの建設機械に、片側の2輪だけで立って走るような曲芸的な操作を、強化学習で自律的に行わせることに成功した（抄録）。", "p3": "実機での試行は危険なため、シミュレーションの中で強化学習の方策を訓練し、それを実際のスキッドステアローダー（John Deere 332G）に移した（抄録）。", "p5": "方策は、機械を2輪の上に振り上げ、その姿勢を保ったまま不整地を走り、指定された軌道を描き、旋回し、バケットを前後に振ってから、安全に4輪へ戻すことを自律で行った。こうした操作は、これまでごく少数の熟練の操縦者だけが成し遂げていた（抄録）。", "fun": "重さ5トンのショベルカーのような機械が、片輪走行をする。油圧は液体で力を伝えるので、反応が遅れたり、ぐにゃりとしたりして、数式どおりには動かない。しかも失敗すれば大事故になる。この研究は、コンピュータの中で何度も転ばせて学ばせ、その技を本物に移した。危ない練習を仮想の世界で済ませる方法の、迫力ある実例である。", "unverified": "抄録の末尾が切れており、成功率などの数値と、シミュレーションと実機の差を埋めた方法の詳細は未確認。"}}, {"id": "jn21", "rank": 21, "field": "機械学習", "headline": "電解液を自動で探索する自律実験室", "title": "A Self-Driving Laboratory for Accelerated Electrolyte Discovery", "url": "https://doi.org/10.1021/acsenergylett.6c01693", "authors": "Kai-Jui Pan ほか", "venue": "ACS Energy Letters", "date": "2026-11-10", "sjr": 5.783, "citescore": 27.9, "citescore_year": "2025", "apa": "Pan, K.-J., Lin, D.-Z., Rajesh, A., Yau, A., Li, T., Jayarapu, K. N., McDaniel, G., Powell, N., Tran, J. V., Langevin, S. A., McHale, C. A., Ko, J. S., & Liu, Y. (2026). A Self-Driving Laboratory for Accelerated Electrolyte Discovery. ACS Energy Letters. https://doi.org/10.1021/acsenergylett.6c01693", "why": "分注ロボット、オンラインの電気化学測定、ベイズ最適化を統合し、96ウェルの形式で電解液の調合・測定・代替モデルの更新を自動で繰り返す実験室を報告した。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "電解液の配合の探索を、分注ロボット・測定・最適化をつないだ自律実験室で自動化し、低温用の亜鉛金属電池の電解液を見つけた（抄録）。", "p3": "96ウェルの形式で、候補の電解液の調合、温度を制御した電気化学測定、代替モデルの更新を自動で繰り返し、ベイズ最適化で高次元の配合の空間を探索する。高エントロピーの水系電解液の開発に適用した（抄録）。", "p5": "数百の配合を調べ、多目的最適化で、導電率134.1 mS/cm、電気化学的な安定窓2.50 Vの電解液を得た。対称セルでは−20 °Cで約2019時間のサイクル安定性を示した（抄録）。", "fun": "電池の中の液体は、何種類もの成分をどんな割合で混ぜるかで性能が決まる。組合せは膨大で、人が一つずつ試していては終わらない。この研究では、ロボットが混ぜて、測って、その結果から「次はこの配合を試そう」と自分で決める。実験する手と考える頭をつないで、休まず回り続ける実験室を作ったのである。", "unverified": "本文未読のため、探索した成分の種類、人手による探索との比較、得られた電解液の組成は未確認。"}}, {"id": "jn22", "rank": 22, "field": "工学", "headline": "8つの安定形を持つ構造を4Dプリントで設計", "title": "Programmable multistable structures via bioinspired, mechanically guided 4D printing", "url": "https://doi.org/10.1073/pnas.2614289123", "authors": "Yan Zhao ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-10", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Zhao, Y., Zhu, H., He, Y., Zhang, Y., Ye, X., Lv, R., Tian, Y., Wang, Z., Xiang, J., Zhao, S., Zhou, K., & Jiang, C. (2026). Programmable multistable structures via bioinspired, mechanically guided 4D printing. Proceedings of the National Academy of Sciences, 123(46). https://doi.org/10.1073/pnas.2614289123", "why": "植物の葉や果実の成長による変形にならい、力学的に誘導する4Dプリントで8安定・双安定の単位構造を設計・製作した。無次元の形状パラメータで安定性を調整でき、単位を連ねた10cm規模の帯で10億超の安定状態を持つ構成空間を示した。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得（抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "植物の葉や果実が成長しながら形を変える仕組みにならい、力学的に誘導する4Dプリントで、多数の安定な形を持つ構造を設計・製作する方法を示した（抄録）。", "p3": "8つの安定状態を持つ単位構造と、さまざまな双安定の単位を作り、無次元の形状パラメータを変えることで安定性の地形を調整し、座屈解析で確かめた（抄録）。", "p5": "8安定の単位を複数つなぐと、10cm規模の帯で十億を超える数の安定状態を持つ構成空間が得られた。形状パラメータを変えると曲げから折りへの転移が現れ、双安定のヒンジを作れる。液滴の誘導、電気の切替え、不規則な物体の把持などの装置で実演した（抄録）。", "fun": "髪留めのパッチン留めは、反った形と逆に反った形の二つで安定する。このような「手を離してもその形のまま」の状態を、一つの部品にたくさん持たせられれば、電気を使わずに形を覚えておける。この研究は、葉が育つときの縮み方の違いをまねて印刷することで、小さな帯に途方もない数の安定な形を作り込んだ。", "unverified": "抄録の末尾が切れており、材料と印刷の方法の詳細、実演の定量的な結果は未確認。"}}, {"id": "jn23", "rank": 23, "field": "組織行動・心理的安全性", "headline": "新興産業の熱狂の波の中での人材マネジメント", "title": "How Can Talent Managers Create Organizational Value Throughout the Hype Cycles of Emerging and Innovative Industries?", "url": "https://doi.org/10.1111/1748-8583.70076", "authors": "Francine Schlosser ほか", "venue": "Human Resource Management Journal (UK)", "date": "2026-11-10", "sjr": 3.013, "citescore": 14.9, "citescore_year": "2025", "apa": "Schlosser, F., de Azevedo, M. C., & McPhee, D. (2026). How Can Talent Managers Create Organizational Value Throughout the Hype Cycles of Emerging and Innovative Industries? Human Resource Management Journal. https://doi.org/10.1111/1748-8583.70076", "why": "カナダの嗜好用大麻産業と太陽光産業の経営幹部14人への面接などから、期待・正統性・規制・資金が揺れ動く「ハイプ・サイクル」の局面ごとに、人材マネジメントの課題と対応がどう変わるかを調べた。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得（抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "期待が急に膨らんではしぼむ新興産業で、人材マネジメントの重点が、産業の熱狂の波（ハイプ・サイクル）の局面ごとにどう移るかを理論化した（抄録）。", "p3": "カナダの嗜好用大麻産業と太陽光産業の経験豊かな経営幹部14人への面接と、報道・業界研究を使い、既存の人材価値の枠組みを、変化する産業の文脈へ拡張した（抄録）。", "p5": "人材の価値を生む過程の重みは、技術の引き金、膨らんだ期待、幻滅、安定化へと産業が進むにつれて時間的に付け替えられる。新興産業の人材の構成は、決まった最良の慣行の束ではなく、外部の期待・正統性・規制・資源に応じて組み直すべき配置だとした（抄録）。", "fun": "新しい産業は、最初は「これからはこれだ」と期待が集まり、人もお金も流れ込む。しばらくすると期待がしぼみ、冷たい目で見られる。この波の中で、会社はいつ人を集め、いつ守り、いつ育てるべきか。この研究は、良い人事のやり方は一つではなく、世間の熱の上がり下がりに合わせて変えるものだと論じている。", "unverified": "抄録の末尾が切れており、局面ごとの具体的な対応の内容は未確認。面接は14人と少数である。"}}, {"id": "jn24", "rank": 24, "field": "組織行動・心理的安全性", "headline": "女性経営者の企業は女性を多く雇い支援も手厚い", "title": "Female Managers, Women's Employment, and Gendered Laws", "url": "https://doi.org/10.1111/gwao.70276", "authors": "Hiep Manh Nguyen ほか", "venue": "Gender, Work and Organization", "date": "2026-11-10", "sjr": 1.769, "citescore": 7.4, "citescore_year": "2025", "apa": "Nguyen, H. M., & Nguyen, H. T. (2026). Female Managers, Women’s Employment, and Gendered Laws. Gender, Work & Organization. https://doi.org/10.1111/gwao.70276", "why": "世界銀行の企業調査の多国データで、女性が経営トップの企業は女性の雇用が多く、訓練・保育支援・出産給付を提供しやすいこと、その効果は法的な男女平等が弱い国で強いことを示した。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "経営トップが女性の企業は女性を多く雇い、女性向けの支援も手厚いことを、多くの国の企業データで示した（抄録）。", "p3": "世界銀行の企業調査の大規模な多国データを使い、経営トップの性別と、女性の雇用、訓練・保育支援・出産給付の提供、企業の生産性との関連を、国の法制度や産業による違いとあわせて分析した（抄録）。", "p5": "女性トップの効果は、法的な男女平等が弱く、女性の事業への制度的な支えが限られる国で強く、男性が多い産業では弱い。女性従業員の割合は、女性トップと生産性の負の関連を媒介するが、女性従業員の割合が同程度の男性トップの企業と比べても、成績は下回っていた（抄録）。", "fun": "社長が女性だと、その会社で働く女性が増え、子育ての支援も整いやすい。しかも、法律が女性を十分に守っていない国ほど、その効果が大きかった。法律が弱いところでは、トップの人柄や考えが、制度の代わりを果たしているのかもしれない。一方で、女性トップの会社の成績が低く出る理由は、まだ説明しきれていない。", "unverified": "本文未読のため、国と企業の数、効果の大きさ、因果関係の識別の程度は未確認。"}}, {"id": "jn25", "rank": 25, "field": "組織行動・心理的安全性", "headline": "文化戦争から利益を得る資源動員", "title": "Benefiting from Culture Wars: Resource Mobilization in Polarized Issue Domains", "url": "https://doi.org/10.5465/amj.2024.0699", "authors": "Ludovica Castiglia ほか", "venue": "Academy of Management Journal", "date": "2026-11-10", "sjr": 10.781, "citescore": 19.8, "citescore_year": "2025", "apa": "Castiglia, L., & Ferraro, F. (2026). Benefiting from Culture Wars: Resource Mobilization in Polarized Issue Domains. Academy of Management Journal. https://doi.org/10.5465/amj.2024.0699", "why": "題名から、意見が分極した争点の領域で組織がどのように資源を動員するかを扱う研究（Academy of Management Journal、SJR 10.781）。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、意見が鋭く分かれる争点の領域（いわゆる文化戦争）で、組織がその対立からどのように利益を得て資源を集めるかを扱う研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、世の中の意見が真っ二つに割れているとき、その対立は組織にとって損なのか、それとも資金や支持を集める機会になるのか、というものである。対立を避けるのが得策だという常識に対して、対立から「利益を得る」という見方を題名が示している点が目を引く。結果は未確認。", "unverified": "抄録・本文を入手できず、対象の組織、データ、結論はすべて未確認。"}}, {"id": "jn26", "rank": 26, "field": "人口学", "headline": "一人っ子政策の効果は官僚の誘因に左右された", "title": "Bureaucratic incentives shaped effectiveness of the one-child policy in China", "url": "https://doi.org/10.1038/s41586-026-11232-w", "authors": "Lingsheng Meng ほか", "venue": "Nature", "date": "2026-11-11", "sjr": 19.713, "citescore": 77.7, "citescore_year": "2025", "apa": "Meng, L., Yang, H., Miller, G., & Li, H. (2026). Bureaucratic incentives shaped effectiveness of the one-child policy in China. Nature. https://doi.org/10.1038/s41586-026-11232-w", "why": "題名から、中国の一人っ子政策の効果が官僚の誘因によって形づくられたことを示す研究（Nature、SJR 19.713）。抄録は取得できていない。", "explain": {"basis": "抄録", "basis_note": "OpenAlexの題名検索で得た同名の記録の抄録を使用。Nature掲載版の本文は未取得", "preprint": false, "short": true, "p1": "中国の一人っ子政策が出生率を下げたのは、政策の導入そのものより、守れなかった役人の昇進を禁じる「一票否決」の制度で官僚の誘因が強められてからだったことを示した（抄録）。", "p3": "合計特殊出生率は1979〜1980年の政策実施後にはあまり下がらず、1990年代初めに3分の1以上急落した。省ごとに「一票否決」の実施時期が違うことを使って、その効果を推定した（抄録）。", "p5": "「一票否決」は1990年代の中国の合計特殊出生率の低下のほぼ半分を説明し、出生率を人口置換水準より下に押し下げた。地方の役人が「推奨」した子宮内避妊具の使用の増加がとくに目立った（抄録）。", "fun": "決まりを作っても、それを現場で実行する人が本気にならなければ効果は出ない。中国の一人っ子政策は、導入からしばらくは出生率をあまり下げなかった。大きく下がったのは、「目標を守れなかった役人は昇進させない」という仕組みが加わってからだった。政策の中身より、実行する人の損得の設計が結果を決めた、という発見である。", "unverified": "使用した抄録は掲載版そのものではなく、同名の関連記録のもので、掲載版との差は未確認。推定の方法の詳細も未確認。"}}, {"id": "jn27", "rank": 27, "field": "計算社会科学・ネットワーク科学", "headline": "2,000万件の論文と特許で探索と産業化を比較", "title": "Scientific exploration outlasts industrial momentum and sustains innovation in genetic research: survey of 20 million papers and patents", "url": "https://doi.org/10.1140/epjds/s13688-026-00715-5", "authors": "Junghun Chae ほか", "venue": "EPJ Data Science", "date": "2026-11-11", "citescore": 5.3, "citescore_year": "2025", "apa": "Chae, J., Kim, W., Jung, W., Jeong, D., Lim, R., Chamlagain, M., Jung, G., Jang, J., Lee, J. W., Kang, N. K., Baek, K., Shin, J., Lee, Y.-G., Koh, H. G., Kim, C., Yook, S., Cheung, A. K. L., Jin, Y.-S., Youn, H., et al. (2026). Scientific exploration outlasts industrial momentum and sustains innovation in genetic research: survey of 20 million papers and patents. EPJ Data Science. https://doi.org/10.1140/epjds/s13688-026-00715-5", "why": "題名から、遺伝学研究の論文と特許2,000万件を調べ、科学的な探索が産業の勢いより長く続いてイノベーションを支えることを示す研究（EPJ Data Science）。抄録は取得できていない。", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "遺伝学の研究で、産業界の研究開発が下火になったあとも、科学的な探索が新しい遺伝子の組合せを試し続け、イノベーションの機会を支えていることを示した（抄録）。", "p3": "約2,000万件の論文と、米国・中国・欧州の特許を分析し、遺伝子ごとに科学研究と産業の活動の経過を比べた（抄録）。", "p5": "新しい遺伝子そのものの研究は2000年代初めから減ったが、新しい遺伝子の組合せの探索は活発なままだった。実用・商業志向の強い分野は新しい組合せを試しにくく、産業の研究開発は各遺伝子への科学的な関心より早く減る傾向があった（抄録）。", "fun": "新しい発明は、まったく新しい部品の発見だけでなく、すでにある部品の新しい組合せからも生まれる。企業は、もうかる見込みが薄れるとその研究から早く手を引く。しかし大学などの研究は、その後も「この二つを組み合わせたらどうなるか」を試し続けていた。すぐには役に立たない探索が、あとの発明の種を残していることが分かる。", "unverified": "抄録の末尾が切れており、仮想のシナリオによる分析の結果は未確認。"}}, {"id": "jn28", "rank": 28, "field": "計算社会科学・ネットワーク科学", "headline": "FDA承認薬の背後にある研究チームの構造", "title": "Scientific team structures behind FDA-approved drugs", "url": "https://doi.org/10.1038/s41587-026-03366-z", "authors": "Alex J. Yang ほか", "venue": "Nature Biotechnology", "date": "2026-11-10", "sjr": 23.109, "citescore": 66.4, "citescore_year": "2025", "apa": "Y らず、利得の分かれ方が変わった。", "unverified": "本文未読のため、実験の参加者数、設定の詳細、効果の大きさは未確認。"}}, {"id": "jn30", "rank": 30, "field": "経済学", "headline": "優先入学枠の誘因効果を実験と構造モデルで", "title": "Beliefs and the Incentive Effects of Preferential College Admissions: Evidence from an Experiment and a Structural Model", "url": "https://doi.org/10.1086/744916", "authors": "Michela Maria Tincani ほか", "venue": "Journal of Political Economy", "date": "2026-11-11", "sjr": 16.25, "citescore": 11.0, "citescore_year": "2025", "apa": "Tincani, M. M., Kosse, F., & Miglino, E. (2026). Beliefs and the Incentive Effects of Preferential College Admissions: Evidence from an Experiment and a Structural Model. Journal of Political Economy. https://doi.org/10.1086/744916", "why": "題名から、大学の優先的な入学制度が生徒の信念を通じて努力の誘因に与える効果を、実験と構造モデルで調べる研究（Journal of Political Economy、SJR 16.25）。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、大学の優先的な入学制度（特定の集団に枠や加点を与える制度）が、生徒の信念を通じて努力の誘因に与える効果を、実験と構造モデルで調べる研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、入試で優先枠を設けると、対象の生徒は「がんばれば届く」と思って勉強を増やすのか、それとも「枠があるから大丈夫」と思って減らすのか、というものである。答えは、生徒が自分の合格の見込みをどう信じているかに左右される、という見方が題名からうかがえる。結果は未確認。", "unverified": "抄録・本文を入手できず、実験の対象と国、モデルの内容、結論はすべて未確認。"}}, {"id": "jn31", "rank": 31, "field": "経済学", "headline": "途上国の現金給付の地域乗数と集計効果", "title": "Cash transfers in developing countries: Local multipliers, aggregate effects, and external adjustment", "url": "https://doi.org/10.1016/j.jmoneco.2026.104022", "authors": "Arthur Mendes ほか", "venue": "Journal of Monetary Economics", "date": "2026-11-10", "sjr": 6.262, "citescore": 6.2, "citescore_year": "2025", "apa": "Mendes, A., Miyamoto, W., Nguyen, T. L., & Pennings, S. (2026). Cash transfers in developing countries: Local multipliers, aggregate effects, and external adjustment. Journal of Monetary Economics, 104022. https://doi.org/10.1016/j.jmoneco.2026.104022", "why": "題名から、途上国の現金給付について地域の乗数、経済全体への効果、対外調整を扱 .2026.3752490", "why": "題名から、視覚の基盤モデルを使って物体検出のデータ由来の不確実性を調べる研究（IEEE TPAMI、SJR 4.829）。抄録は取得できていない。", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録を使用（本文は未取得。抄録は途中で切れている）", "preprint": false, "short": true, "p1": "物体検出のデータに含まれる偶然的な不確実性（aleatoric uncertainty、データ自体のばらつきや雑音）を、視覚の基盤モデルの特徴空間を使って物体ごとに見積もり、学習に生かす方法を示した（抄録）。", "p3": "超大規模なデータで学習した視覚基盤モデルの特徴空間で、物体の特徴がガウス分布の混合に従うと仮定し、マハラノビス距離に基づく指標で各物体のデータ不確実性を数値化する（抄録）。", "p5": "見積もった不確実性の使い道として、雑音の多い事例や冗長な事例を除く標本フィルタなど二つを提案した（抄録）。取得できた抄録は二つ目の使い道の説明の途中で切れており、性能の数値は未確認。", "fun": "写真の中の物を見つけるAIを育てるとき、お手本の写真には、物が半分隠れていたり、ぼやけていたり、名前の札が間違っていたりするものが混じる。そうした「もともと判断が難しい例」を無理に覚えさせると、かえって下手になる。この研究は、大量の画像を見てきた別のAIの目を借りて、どの例があやしいかを数字で見分けようとした。", "unverified": "抄録が途中で切れており、二つ目の使い道、実験のデータセット、精度の改善は未確認。"}}, {"id": "jn35", "rank": 35, "field": "機械学習", "headline": "連合学習の汎化と遅延端末への耐性を高める", "title": "SplitKD: Enhancing Generalization and Straggler Resistance of Federated Learning via Parameter Split and Distillation", "url": "https://doi.org/10.1109/tpami.2026.3752851", "authors": "Qiantao Yang ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-11-11", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "apa": "Yang, Q., Chen, L., Si, W., Xu, Z., Li, S., Gui, J., & Yu, S. (2026). SplitKD: Enhancing Generalization and Straggler Resistance of Federated Learning via Parameter Split and Distillation. IEEE Transactions on Pattern Analysis and Machine Intelligence, 1–15. https://doi.org/10.1109/tpami.2026.3752851", "why": "題名から、パラメータの分割と蒸留で連合学習の汎化性能と遅い端末への耐性を高める研究（IEEE TPAMI、SJR 4.829）。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、連合学習（データを各端末に置いたまま協調して学習する方法）で、モデルのパラメータの分割と知識蒸留を使い、汎化性能と、計算の遅い端末（ストラグラー）への耐性を高める手法SplitKDの研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、たくさんの端末が力を合わせて一つのAIを育てるとき、足の遅い端末を待つと全体が遅れ、置いていくとその端末のデータが生かされない、という板ばさみをどう解くか、というものである。モデルを分けて持たせ、知識だけを受 reprint": false, "short": true, "p1": "強い背景雑音、不規則な外部の衝撃、高エネルギーの高調波に埋もれた複素数値の信号から、微弱な故障の特徴を取り出せる頑健なテンソル分解の方法を提案した（抄録）。", "p3": "振動信号をヒルベルト変換で複素数値の信号に変えると、微弱な故障の特徴を高周波の搬送波から切り離せる。そこに、スチューデントのt分布に基づく新しい頑健な類似度の指標を導入し、複素領域の半二次最適化と共役勾配法でその指標を最大化する（抄録）。", "p5": "シミュレーションと実験で、提案法が高周波の搬送波から微弱な故障の特徴を取り出せることを示した（抄録）。比較の数値は抄録に記載なし。", "fun": "機械の軸受に小さな傷ができると、ごく弱い周期的な衝撃が出る。しかしその合図は、機械自体の大きな振動や、たまたま起きる外からの衝撃に埋もれてしまう。この研究は、外れ値に強い統計の考え方を使って、目立つ邪魔者の影響を抑えながら信号を分解する。大きな声にかき消された小さな声を聞き分ける工夫である。", "unverified": "抄録はプレプリント版のもので、出版版との差は未確認。対象の機械と検出性能の数値も未確認。"}}, {"id": "jn44", "rank": 44, "field": "工学", "headline": "渦電流式同調粘性マスダンパーの閉形式の最適設計", "title": "Closed-form optimal design for eddy-current-based tuned viscous mass damper (EC-TVMD) under harmonic excitation and its seismic application", "url": "https://doi.org/10.1016/j.istruc.2026.113458", "authors": "Ziyuan Zhang ほか", "venue": "Structures", "date": "2026-11-11", "sjr": 1.108, "citescore": 7.1, "citescore_year": "2025", "apa": "Zhang, Z., Tan, P., Li, Y., Chen, H., & Xiang, Y. (2026). Closed-form optimal design for eddy-current-based tuned viscous mass damper (EC-TVMD) under harmonic excitation and its seismic application. Structures, 94, 113458. https://doi.org/10.1016/j.istruc.2026.113458", "why": "題名から、渦電流を使う同調粘性マスダンパーの調和加振下の最適設計を閉形式で導き、地震応答に適用する研究（Structures、SJR 1.108）。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、渦電流を使う同調粘性マスダンパー（EC-TVMD）について、調和加振のもとでの最適な設計値を閉じた式で導き、地震応答の低減に適用する研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、建物の揺れを吸い取る装置の調整値を、何度も計算を繰り返して探すのでなく、紙の上の式一本で求められるか、というものである。磁石と金属板の間に生じる渦電流のブレーキを減衰に使う装置を対象にしている点が題名からうかがえる。結果は未確認。", "unverified": "抄録・本文を入手できず、最適化の基準、式の形、地震応答での効果はすべて未確認。"}}, {"id": "jn45", "rank": 45, "field": "工学", "headline": "少ないデータと表形式基盤モデルで浸水深を予測", "title": "Data-efficient flood depth prediction through domain-aware coreset selection and tabular foundation models", "url": "https://doi.org/10.1016/j.cacaie.2026.100268", "authors": "Lipai Huang ほか", "venue": "Computer-Aided Civil and Infrastructure Engineering", "date": "2026-11-09", "citescore": 14.7, "citescore_year": "2025", "apa": "Huang, L., Srinath, A., Singh, M., Ma, J., & Mostafavi, A. (2026). Data-efficient flood depth prediction through domain-aware coreset selection and tabular foundation models. Computer-Aided Civil and Infrastructure Engineering, 100268. https://doi.org/10.1016/j.cacaie.2026.100268", "why": "題名から、領域知識に基づく代表点（コアセット）の選択と表形式基盤モデルで、少ないデータから浸水深を予測する研究（Computer-Aided Civil and Infrastructure Engineering）。抄録は取得できていない。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（出版社サイトの本文は未取得。抄録中の数値は取得時に欠けている）", "preprint": false, "short": true, "p1": "表形式の基盤モデルに、領域知識に基づいて選んだ少数の代表データ（コアセット）を推論時に与えることで、流域ごとの学習なしに浸水深を予測する方法を示した（抄録）。", "p3": "降雨を再現期間と最も影響を受ける流域で層別し、目標を意識した空間の選び方で六角形の区画を抽出して、コアセットを作る。物理シミュレータ並みの精度を得るのに流域ごとに数百万行の学習データを要する教師あり学習と比べた（抄録）。", "p5": "ヒューストン周辺の9流域で、教師ありの基準と統計的に区別できない精度を得て、同じ都市圏の未学習の流域にも再学習なしで移せた。実際の降雨では、分布から大きく外れた事例で基準を上回り、中程度に外れた混合の事例では下回った（抄録）。精度の数値は抄録から欠けている。", "fun": "洪水でどこが何センチ浸かるかを素早く予測したい。物理の計算は正確だが遅く、AIに覚えさせるには流域ごとに膨大なデータが要る。この研究は、あらかじめ大量の表データで鍛えた汎用のAIに、「この流域の代表的な例」を少しだけ見せて答えさせた。全部を覚え直させるのでなく、見本を上手に選んで見せる、という発想である。", "unverified": "取得した抄録では数値が欠けており、使用したデータの割合、精度の指標の値は未確認。"}}, {"id": "jn46", "rank": 46, "field": "工学", "headline": "らせん形の音響ブラックホールで薄板の広帯域制振", "title": "Broadband vibration attenuation of stiffened thin-walled plates using an add-on quasi-three-dimensional spiral acoustic-black-hole attachment", "url": "https://doi.org/10.1016/j.tws.2026.115972", "authors": "Qikai Wang ほか", "venue": "Thin-Walled Structures", "date": "2026-11-11", "sjr": 1.734, "citescore": 12.0, "citescore_year": "2025", "apa": "Wang, Q., Kong, W., Lin, Y., Wang, W., & Wu, W. (2026). Broadband vibration attenuation of stiffened thin-walled plates using an add-on quasi-three-dimensional spiral acoustic-black-hole attachment. Thin-Walled Structures, 115972. https://doi.org/10.1016/j.tws.2026.115972", "why": "題名から、後付けの準3次元のらせん形音響ブラックホールで補剛薄板の振動を広帯域に減衰させる研究（Thin-Walled Structures、SJR 1.734）。抄録は取得できていない。", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも取得できず）", "preprint": false, "short": true, "p1": "題名から、補剛された薄板の振動を、後付けできる準三次元のらせん形の音響ブラックホール（先細りの形で振動エネルギーを集めて消す構造）で、広い周波数帯にわたって減らす研究とみられる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、板の厚みをだんだん薄くしていくと波が先端に吸い込まれて戻ってこなくなる、という現象を利用した部品を、らせん状に巻いて小さくまとめ、既存の板にあとから取り付けるだけで振動を抑えられるか、というものである。場所を取らずに広い音域に効かせる工夫が題名からうかがえる。結果は未確認。", "unverified": "抄録・本文を入手できず、形状の設計、減衰の大きさ、実験の有無はすべて未確認。"}}, {"id": "jn47", "rank": 47, "field": "物理学", "headline": "3次元の探索ではコーシー歩行がほぼ最適", "title": "Intermittent Cauchy walks enable optimal 3D search across target shapes and sizes", "url": "https://doi.org/10.1073/pnas.2614625123", "authors": "Matteo Stromieri ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-11", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Stromieri, M., Natale, E., & Korman, A. (2026). Intermittent Cauchy walks enable optimal 3D search across target shapes and sizes. Proceedings of the National Academy of Sciences, 123(46). https://doi.org/10.1073/pnas.2614625123", "why": "3次元での間欠的なレヴィ歩行による探索の効率が、標的の体積・表面積・細長さに強く依存することを解析し、その中でコーシー歩行（指数μ=2）が幅広い標的の形と大きさにわたってほぼ最適な頑健な戦略になることを示した。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "三次元の空間でまれな標的を探すとき、標的の形や大きさが違っても、コーシー歩行と呼ばれる動き方がほぼ最適になることを証明した（抄録）。", "p3": "短い移動とときどきの長い移動を混ぜる間欠的なレヴィ歩行を三次元で解析し、標的の体積・表面積・細長さが探索効率をどう左右するかを、レヴィ歩行の指数全体にわたって調べた（抄録）。", "p5": "体積nの領域にある表面積Δの凸な標的について、最適な検出時間の期待値はn/Δに比例する。指数μ = 2のコーシー歩行は対数の多項式の因子を除いてこの比例関係を達成し、他のレヴィ歩行は標的の形によって最適でなくなる（抄録）。", "fun": "海でえさを探すサメや、体の中で病原体を探す免疫細胞は、近くを細かく探すことと、遠くへ一気に移ることを混ぜている。どのくらいの割合で混ぜるのが良いかは、探す相手の形しだいで変わりそうに思える。ところが数学的に調べると、ある決まった混ぜ方が、相手が丸くても細長くても、ほぼ最良だった。万能の探し方があったのである。", "unverified": "本文未読のため、証明の前提（探索者の検出の規則など）と数値実験の有無は未確認。"}}, {"id": "jn48", "rank": 48, "field": "数学", "headline": "希薄フェルミ気体のHuang–Yang予想を証明", "title": "The Huang–Yang conjecture for the low-density Fermi gas", "url": "https://doi.org/10.1007/s00222-026-01459-9", "authors": "Emanuela L. Giacomelli ほか", "venue": "Inventiones Mathematicae", "date": "2026-11-11", "sjr": 5.202, "citescore": 6.6, "citescore_year": "2025", "apa": "Giacomelli, E. L., Hainzl, C., Nam, P. T., & Seiringer, R. (2026). The Huang–Yang conjecture for the low-density Fermi gas. Inventiones Mathematicae. https://doi.org/10.1007/s00222-026-01459-9", "why": "斥力の短距離相互作用を持つスピン1/2の希薄なフェルミ気体の基底エネルギーについて、1957年にHuangとYangが予言した3項の漸近展開を、対応する下界を証明することで確立した。式は相互作用の詳細によらず散乱長だけに依存する。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": false, "short": true, "p1": "斥力の短距離相互作用を持つ希薄なフェルミ気体の基底エネルギーについて、1957年にHuangとYangが予言した公式を数学的に証明した（抄録）。", "p3": "スピン1/2のフェルミ粒子の希薄な気体の基底エネルギーの、3項からなる漸近展開を扱う。著者らは先に望む形の上界を証明しており、本論文では対応する下界を証明して証明を完成させた（抄録）。", "p5": "展開は幅広い種類の相互作用ポテンシャルについて成り立ち、ポテンシャルの詳細にはよらず散乱長だけを通じて決まるという意味で普遍的である（抄録）。", "fun": "まばらに飛び回る粒子の集まりが、いちばん低いエネルギーの状態でどれだけのエネルギーを持つか。物理学者は七十年近く前に答えの式を予想し、実験や計算に使ってきた。しかしそれが数学的に厳密に正しいとは証明されていなかった。この論文は、上からと下からの両側ではさみ込むことで、その式が正しいことを確かめた。", "unverified": "本文未読のため、証明の手法と、必要な仮定の正確な範囲は未確認。"}}, {"id": "jn49", "rank": 49, "field": "電子工学", "headline": "単結晶の高誘電率絶縁膜で低電力の2次元CFET", "title": "Low-power 2D CFETs using single-crystal high-κ dielectrics", "url": "https://doi.org/10.1038/s41586-026-11272-2", "authors": "Ni Yang ほか", "venue": "Nature", "date": "2026-11-11", "sjr": 19.713, "citescore": 77.7, "citescore_year": "2025", "apa": "Yang, N., Zhang, J., Lu, Y.-C., Wang, Z., Chang, Y.-M., Zheng, F., Yang, Z.-L., Li, L., Chou, A.-S., Yang, Z., Liu, H., Huang, L.-Y., Li, C., Yao, C., Yang, P., Li, W., Meng, W., Li, M.-Y., Cheng, C.-C., et al. (2026). Low-power 2D CFETs using single-crystal high-κ dielectrics. Nature. https://doi.org/10.1038/s41586-026-11272-2", "why": "シリコンの微細化では消費電力の低減が難しくなっており、2次元半導体は原子層の薄さでゲート制御に優れるが、チャネルとゲート絶縁膜の界面の不完全さが障害だった。題名と抄録の冒頭から、単結晶の高誘電率（high-κ）絶縁膜を使った相補型の積層トランジスタ（CFET）で低電力動作を示す研究（Nature）。", "explain": {"basis": "抄録", "basis_note": "掲載誌の抄録（候補の収集時に取得）を使用。本文は未取得（抄録の末尾は取得時に切れている）", "preprint": false, "short": true, "p1": "二次元半導体とゲート絶縁膜の界面の不完全さという障害を、ウエハー規模で転写できる単結晶のアナターゼ型酸化チタンの絶縁膜で克服し、低消費電力の相補型トランジスタを実証した（抄録）。", "p3": "単結晶の酸化チタンの絶縁膜を、二次元の遷移金属ダイカルコゲナイドとファンデルワールス力で積層し、きれいな界面を作る（抄録）。", "p5": "熱的な限界に近いサブスレッショルド・スイング、記録的に小さいヒステリシス、n型とp型でよくそろった特性が得られた。これを使った相補型トランジスタのインバータは、高い電圧利得と大きな雑音余裕を、ピコワット未満の静的な消費電力で実現した（抄録）。数値は抄録に記載なし。", "fun": "半導体の部品は小さくするほど電気がもれやすくなり、電力の節約が難しくなっている。原子数個分の厚さしかない新しい半導体は有望だが、その上に重ねる絶縁膜との境目が荒れると性能が出ない。この研究は、結晶がきれいにそろった絶縁膜を別に作ってそっと載せるという方法で、境目の問題を解いた。貼り合わせの丁寧さが性能を決める。", "unverified": "抄録の末尾が切れており、具体的な数値（スイング、利得、消費電力）と素子の寸法は未確認。"}}], "data_related": [{"rank": 1, "headline": "インドネシア上場324社の財務困窮パネルと同定コード", "title": "Replication data and code for \"Financial distress dynamics in emerging markets by using a sparse system identification approach\"", "url": "https://doi.org/10.5281/zenodo.24128239", "authors": "Ihsan ほか", "venue": "Zenodo", "date": "2026-11-11", "apa": "Ihsan, A. F., & Titik Kristanti, F. (2026). Replication data and code for \"Financial distress dynamics in emerging markets by using a sparse system identification approach\" (Version 1.0.0) [Dataset]. Zenodo. https://doi.org/10.5281/ZENODO.24128239", "summary": "インドネシアの非金融上場企業324社を2013〜2023年に観測した修正済みパネルと、財務困窮の動態をスパースなシステム同定（panel-SINDy）で推定する解析コード一式。データ修正の台帳、変数辞書、イベント台帳、検証用の分割、シミュレーション設定と乱数種、論文の全数値の元になる表・ログ・図を含む。元の財務諸表は再配布されない。ライセンスCC BY 4.0。関連論文は査読中（Discover Sustainability）。", "kind": "data", "theme": "会計情報科学", "theme_no": 2}, {"rank": 2, "headline": "車載カメラの路面・街路の未注釈動画", "title": "Municipal Vehicle-Camera Video Dataset for Multi-Class Urban Infrastructure Monitoring and Adaptive Keyframe Selection", "url": "https://doi.org/10.21227/a7nj-0m33", "authors": "Jaideep Gundarapu ほか", "venue": "IEEE DataPort", "date": "2026-11-11", "apa": "Gundarapu, J., Govind, S. R., & T.K, M. K. (2026). Municipal Vehicl   function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
