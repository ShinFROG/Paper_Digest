re Agent: How AI Team Size and Formation Shape Productivity and Diversity in Human-AI Brainstorming Teams", "url": "https://arxiv.org/abs/2611.26663", "authors": "Rong-Ching Chang ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Chang, R.-C., & Wang, H.-C. (2026). Adding One More Agent: How AI Team Size and Formation Shape Productivity and Diversity in Human-AI Brainstorming Teams (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26663", "why": "ブレインストーミング実験（168人）で、AIの相棒の数（1体か2体）と振る舞いの作り方（平均的な人に合わせるか、参加者が調整するか）を組み合わせ、人どうしの組と比べた。AIが2体の部屋は共有ボードへの投稿総数が増えたが、人が書いたアイデアは大きく減った。AIの雑談は人の投稿を増やし、AIの投稿量は減らす関連があり、1体での結果は複数体のチームに一般化できない。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（方法の3.1〜3.4、結果の4.1の主要部分、限界の5.4）を読んだ", "preprint": true, "p1": "人とAIが一緒にアイデアを出す場で、AIの相棒を1体から2体に増やすと、チーム全体の投稿は増えるのに、人自身が書き出すアイデアは大きく減ることを実験で示した（抄録、4.1）。", "p2": "生成AIが個人の生産性を上げることは示されてきたが、AIの相棒を複数にしたときに人の貢献がどうなるかは分かっていなかった（抄録、1節）。", "p3": "AIの数（1体か2体）と、AIの振る舞いの作り方（平均的な人の振る舞いに合わせたAVGか、参加者が調整するCUSか）を掛け合わせた2×2の参加者間実験。参加者はチャットと共有のアイデアボードのある画面で、2つの課題についてブレインストーミングを行う（3.1〜3.4）。", "p4": "参加者168人のうち120人を4条件に30人ずつ無作為に割り当て、残り48人は人どうしの24組として基準にした。指標は、ボードに載った項目の総数、人が書いた項目の数、アイデアの多様性である（3.1、3.6）。", "p5": "AIが2体の部屋はボードの項目が多かった（55.8対41.8）が、人が書いた項目は1人あたり13.5で、1体のときの21.7より少なかった。AIが1体のときは、平均型のAIと組んだ人が最も多く書き（25.7）、人どうしの基準（20.5）を上回った。2体ではこの差が消えた（13.7対13.3）（4.1.1〜4.1.2）。", "p6": "著者の限界：GPT-4oを使った1回のブレインストーミングの実験で、AIのチームがもっと大きい構成では質的に違う動きが出るかもしれない（5.4）。解釈：1回約45分のオンライン実験で、長期の協働に当てはまるかは分からない。", "fun": "アイデア出しの相棒にAIが1体いると心強い。では2体にすればもっと良いかというと、そう単純ではない。AIが2体いる部屋では、共有のボードの項目は増えるのに、人間が書いたアイデアは大きく減った。人は会話を続けていても、それをアイデアとして書き出さなくなる。人数が増えると自分の出番が減る、という経験に似ていて面白い。", "unverified": "多様性の結果の数値（4.2）、事後の分析（5.1〜5.2）、付録の回帰モデルは読んでいない。"}}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "事前登録した仮説の58%は8〜9年後も結果が非公開", "title": "Beyond Publication Bias: Characterizing and Understanding Missing Results in Economics", "url": "https://doi.org/10.3386/w36044", "authors": "Fernando Hoces de la Guardia ほか", "venue": "NBER Working Paper", "apa": "de la Guardia, F. H., Miguel, E., Pathan, G., Shaji, A., da Rocha, V. H. S., Sørensen, E. Ø., & Tungodden, B. (2026). Beyond Publication Bias: Characterizing and Understanding Missing Results in Economics (NBER Working Paper No. 36044). National Bureau of Economic Research. https://www.nber.org/papers/w36044", "why": "AEAのRCT登録簿に2015〜2017年に登録された317研究・5,057仮説を追跡し、結果が公開されているのは42%にとどまること、公開された結果の64%は帰無で、帰無の結果がとくに欠けている証拠は乏しいことを示した。著者への直接の働きかけを無作為に割り当てる実験では、公開の割合が6.2ポイント上がった。出版バイアスとは別の「未報告」の大きさを仮説単位で測った。", "explain": {"basis": "抄録", "basis_note": "NBERの本文は取得できず、題名検索で見つかった別の記録（Crossref、SSRN版）の抄録を使用", "preprint": true, "p1": "研究者が事前に登録した仮説のうち、結果が公開されずに終わるものがどれだけあるかを仮説の単位で測り、経済学では8〜9年たっても過半が未公開であること、ただし帰無の結果がとくに欠けているわけではないことを示した（抄録）。", "p2": "科学者が何を発表しないかは、何を発表するかと同じくらい重要でありうる。この研究は、欠けている結果そのものを仮説の水準で測るという方法で、経済学の過少報告を調べる（抄録）。", "p3": "米国経済学会のRCT登録簿に2015〜2017年に登録された研究の事前登録の仮説を追跡し、結果が公開されているか、帰無かどうかを調べる。さらに、著者への働きかけの方法を無作為に割り当てる実験で、未公開の結果を回収できるかを試す（抄録）。", "p4": "対象は317の研究の5,057の仮説。公開の割合と帰無の割合を数え、実験では、著者への直接の働きかけ、認知を高めるだけの働きかけ、研究補助の追加の提供を比べて、結果が利用可能になった仮説の割合の変化を見る（抄録）。", "p5": "事前登録から8〜9年後に結果が公開されていた仮説は42%だけだった。公開された結果の64%は帰無で、帰無の結果がとくに欠けているという証拠は乏しい。著者への直接の働きかけは公開の割合を6.2ポイント上げ、所在の分からない仮説の割合を16.4ポイント下げた。認知を高めるだけでは有意な効果がなかった（抄録）。", "p6": "抄録の範囲では、未公開の理由の内訳、研究の種類による違い、公開の定義は分からない（未確認）。対象は1つの登録簿の3年分で、他の分野への一般化は示されていない。", "fun": "実験を始める前に「何を確かめるか」を登録しておく事前登録は、都合の良い結果だけを発表するのを防ぐ仕組みだ。では、登録した仮説の結果はちゃんと公表されているのか。経済学の5,057の仮説を追いかけると、8〜9年たっても42%しか結果が公開されていなかった。意外なのは、効果なしという結果がとくに欠けているわけではなかった点で、問題は広く「出さずじまい」にあるらしい。", "unverified": "本文は入手できず、公開の判定方法、実験の標本の大きさ、頑健性の確認は未確認。"}}, {"id": "pn08", "rank": 8, "field": "機械学習", "headline": "重みの直接書き換えで文脈内学習を再現し微調整に並ぶ", "title": "Weight-Space Programming Writes In-Context Learning and Matches Fine-Tuning in Language Models", "url": "https://arxiv.org/abs/2611.26841", "authors": "Konstantinos Skianis ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Skianis, K., & Likas, A. (2026). Weight-Space Programming Writes In-Context Learning and Matches Fine-Tuning in Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26841", "why": "最先端の言語モデルが別のモデルの重みを勾配降下なしで読み書きする「重み空間プログラミング」で、例示から重みの更新を作り、プロンプトに例がなくても課題を解かせられるかを6課題・4つの編集モデル・3系統の弱いモデルで調べた。多くの場合、文脈内学習の課題ベクトルに当たる残差が重みに書き込まれ、精度は文脈内学習やLoRAを含む微調整に並んだが、言い回しの変化には弱い。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（実験設定の3節、結果の4節の主要部分、結論）を読んだ。編集内容の解析の節と付録は読んでいない", "preprint": true, "p1": "最先端の言語モデルに別の小さな言語モデルの重みを直接読み書きさせると、勾配降下を使わずに、例を見せる文脈内学習（ICL）と同じ働きを重みの中に書き込めること、その精度が微調整に並ぶことを示した（抄録、結論）。", "p2": "モデルが他のモデルの重みを勾配なしで編集する「重み空間プログラミング」が最近報告されたが、例からどんな更新が作られるのか、何を編集しているのか、どこまで通用するのかは分かっていなかった（抄録）。", "p3": "編集役（Claude Fable 5.1、Claude Opus 5.5、Gemini 4 Argon、GPT-6 Astra）は、編集対象のモデル（主にQwen2.5-0.5B）を載せたPythonの環境で、16組の例と評価の形式だけを与えられ、任意のパラメータを書き換えられる。勾配や学習ループを使うコードは拒否され、モデルの実行は最大50回に制限される（3節）。", "p4": "反対語、国から首都、現在形から過去形などの6課題で、プロンプトに例のないゼロショットの正解率を、16例の文脈内学習、全パラメータの微調整、LoRA、ランク1の更新、文脈蒸留と比べる。見せていない言い回しでの精度、他の課題への干渉、言語モデルとしての劣化も測る（3節）。", "p5": "未編集のモデルは各課題で0〜3%。編集後は平均88.5%（Fable 5.1）と90.4%（Opus 5.5）で、16例の文脈内学習の89.3%に並んだ（表1、完了した実行のみ）。見せていない質問応答の形式では13%に落ち、文脈内学習は89%を保った。複数の言い回しで採点すると伝えると、言い回しの平均は32%から78%に上がった（4節）。", "p6": "著者は、未完了の実行も数えると編集役の1つは基準を下回ること、16例だけに限ると最も強い編集役しか微調整に近づかないことを明記している（結論）。課題は単語の対応づけが中心である。Limitationsの節は読み切れていない。", "fun": "AIに新しい課題を教えるには、例をいくつか見せるか、訓練し直すのが普通だ。この研究では、賢いAIが別の小さなAIの重みという数値を直接読み、最も少ない場合は数千個ほど書き換えるだけで課題を覚えさせた。面白いのは、書き込まれた内容が、例を見せたときにAIの中に生じる変化（課題ベクトル）だったことで、編集役は文脈内学習について何も知らされていないのに、そこにたどり着いた。", "unverified": "5節（編集役が書いた内容の解析）、4.1〜4.2（大きなモデルと他の系統）、Limitationsの節、付録は読んでいない。"}}, {"id": "pn09", "rank": 9, "field": "統計学", "headline": "高次元のガウス近似に越えられない次元の壁を証明", "title": "A sharp dimension barrier for uniform Gaussian approximations", "url": "https://arxiv.org/abs/2611.27777", "authors": "Anders Bredahl Kock", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Kock, A. B. (2026). A sharp dimension barrier for uniform Gaussian approximations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27777", "why": "n個の独立同分布のd次元ベクトルに基づくガウス近似が、座標ごとのm次モーメントが有界な分布族と全ての超直方体に一様に成り立つには、log d = o(n^((m−2)/(3m−2))) が必要であることを示した。乱択を含むどんな統計量にも当てはまり、座標の最大値だけでも成り立つ。2<m≤4では分位点でウィンザー化した平均がこの条件で近似を達成するので、壁は最良である。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（抄録、序論、設定と定理の記述）を読んだ。証明の付録は読んでいない", "preprint": true, "p1": "標本の数nに対して次元dが非常に大きい高次元のデータで、統計量の分布を正規分布で近似できるのはどこまでかという限界（次元の壁）を、どんな統計量を使っても越えられない形で特定した（抄録、Theorem 3.1）。", "p2": "Chernozhukovらの2013年の研究以来、標本平均の分布を超直方体の上で正規近似する誤差の上界は精密化されてきた。しかし、近似が成り立つ次元の限界がどこにあるか、別の統計量なら越えられるのかは分かっていなかった（§1）。", "p3": "各座標の分散が下から、m次の絶対モーメントが上から抑えられた平均0の分布の族を考える。この族と全ての超直方体について一様に正規近似が成り立つには、log dがnの (m−2)/(3m−2) 乗より遅い速さでしか増えられないことを示す（§3）。逆に、分位点でウィンザー化（極端な値を縁の値に丸める）した平均を使えば、この条件のもとで近似が成り立つことを示す（§4）。", "p4": "理論の論文で、評価は証明による。必要性は、乱択を含むあらゆる統計量と、座標の最大値だけを見る場合についても成り立つことを示し、十分性は共分散に追加の制約を置かず、mを知らなくてもよい形で示す（抄録、§3、§4）。", "p5": "2<m≤4では必要条件と十分条件が一致し、壁は最良（sharp）である。m>4では同じ統計量がlog nのべきを除いて壁に達する。目標の正規分布は、観測の共分散行列または相関行列を持つものとする（抄録）。", "p6": "m>4ではlog nのべきの分だけ隙間が残る。分布の族に制約を置かない場合に普遍的な壁がないことは付録Cで扱われている（題による。内容は未確認）。数値実験は読んだ範囲にはない。", "fun": "たくさんのデータの平均をとると、結果は釣り鐘型の正規分布に近づく。統計学の土台となるこの性質は、調べる項目の数（次元）が標本の数よりずっと多いデータでも、ある程度まで成り立つ。この研究は、その限界を突き止めた。データの裾の重さ（モーメントの次数）で決まる一線があり、どんなに工夫した統計量でも、その先では一様な正規近似は成り立たない。", "unverified": "定理の証明（付録A・B）と付録Cの内容は読んでいない。"}}, {"id": "pn10", "rank": 10, "field": "因果推論", "headline": "部分識別のもとでデータに条件づけてよい条件を特定", "title": "Partially Identified Ambiguity", "url": "https://arxiv.org/abs/2602.07634", "authors": "Cheaheon Lim", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Lim, C. (2026). Partially Identified Ambiguity (Version 3). arXiv. https://doi.org/10.48550/ARXIV.2602.07634", "why": "部分識別のもとの頑健ベイズ分析で、データに条件づけたガンマ・ミニマックス基準を使ってよいかという規範的な問いを扱う。この基準が、合理的期待の性質を集合値に拡張した「オーマン妥当性」を破りうることを示し、妥当性が成り立つのは事前分布の集合が「部分識別された曖昧さ」を持つとき、かつそのときに限ることを証明した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（抄録、序論、含意の§5.2の一部）を読んだ。モデルと定理の節は見出しと抄録の記述による", "preprint": true, "p1": "部分識別（データを集めてもパラメータが1点に定まらない状況）での頑健ベイズ分析で、データを見たあとの信念に基づいて決める条件付きガンマ・ミニマックス基準を使ってよいのはどんなときかを、事前分布の集合の形で特定した（抄録、§4.2）。", "p2": "複数の事前分布を使う頑健ベイズでは、事前に最適な決定規則が、データを見て信念を更新したあとでは最適でなくなることがある。そのため事前の基準と条件付きの基準の2つが並び立ち、どちらを使うべきかの合意が乏しかった（§1）。", "p3": "条件付きガンマ・ミニマックス基準を事前の視点で表し直し、それが合理的期待の性質を集合値に一般化した「オーマン妥当性」を破りうることを示す。そのうえで、妥当性が成り立つことと、事前分布の集合が「部分識別された曖昧さ」を持つこと（識別集合に支えを持つ分布のランダムな集合のオーマン期待値に等しいこと）が同値だと証明する（抄録、§4.1〜4.2）。", "p4": "理論の論文で、評価は証明と例による。動機づけの例で完全な曖昧さと制約つきの曖昧さを比べ（§2）、KL近傍やε汚染といった頑健ベイズの既存の定式化が条件を満たすかを検討する（§5.2）。", "p5": "条件付き基準を使ってよいのは、部分識別された曖昧さのもとに限られる。誘導形の周辺分布を固定し、各識別集合の中の条件付き分布についてKL近傍をとる定式化は条件を満たすが、無条件の基準の事前分布のまわりにKL近傍をとる定式化は、誘導形の周辺分布が変わりうるので一般には満たさない（§5.2）。", "p6": "規範的な理論の結果で、実データへの適用や、基準の選び方が結論に与える影響の大きさの評価は、読んだ範囲では確認していない。情報の価値（§5.3）と結論（§6）の節は読んでいない。", "fun": "データをいくら集めても、答えが「この範囲のどこか」としか分からない問題がある。そんなとき、最悪の場合に備えて決める方法が2つある。データを見る前に方針を決めておく方法と、データを見てからその都度決める方法だ。2つは食い違うことがあり、どちらを使うべきかの合意は乏しかった。この研究は、後者を使ってよい条件を数学的に言い当てた。", "unverified": "定理の証明、§2の例の詳細、§5.1と§5.3、付録は読んでいない。"}}, {"id": "pn11", "rank": 11, "field": "機械学習", "headline": "誤りだらけの教師データでも強化学習が推論を立て直す", "title": "Reinforcement Learning Unlearns Corrupted SFT Reasoning", "url": "https://arxiv.org/abs/2611.26756", "authors": "Anika Misra ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Misra, A., Vinod, S., & Dai, H. (2026). Reinforcement Learning Unlearns Corrupted SFT Reasoning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26756", "why": "算数の推論データ（GSM8K）の教師データを361通りに壊し（誤りの種類・位置・割合を最大100%まで変化）、教師あり微調整だけでは精度が43.61%から13.80%に落ちるのに、GRPOによる強化学習が約60%まで戻すことを示した。3行の形だけの誤った解答8件で初期化すると69.30%に達し、正しい教師データでの初期化（60.71%）を上回る。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（方法の3節、実験条件の4節の見出し、結果の5.1〜5.2）を読んだ", "preprint": true, "p1": "推論の過程を書かせる言語モデルの訓練で、教師あり微調整（SFT）に使う解答例が誤りだらけでも、そのあとの強化学習が正しい推論を立て直すことを示した。微調整は解答の形を、強化学習は推論の働きを担うという非対称を明らかにした（抄録、5.1）。", "p2": "推論の課題での強化学習は、教師あり微調整のデータがひどく壊れていても成功するのか。微調整のデータの質が最終的な性能にどれだけ効くのかを、体系的に確かめる（抄録）。", "p3": "OLMo-2-1Bと算数の文章題GSM8Kを使う。まず強化学習（GRPO）の誤答を人手で調べて6種類の誤りの型を定め、正規表現で式を1つ選んで誤りを入れ、その誤りを以降の計算に伝播させる。誤りの種類・位置・途中経過と答えの整合・混入の割合を変えた361通りの訓練データと、3行だけの「形だけ」の解答例を作る（3.3〜3.6、4.1）。", "p4": "SFTのみ、GRPOのみ、SFTのあとGRPOの各条件で、GSM8Kの正解率を、誤りのない解答例での結果と比べる。元のモデルの正解率は21.99%である（3.1）。", "p5": "SFTのみの正解率は、誤りの割合を増やすと43.61%から100%混入時の13.80%まで下がった。GRPOを続けるとどの割合でも約60%に戻り、誤りのない場合との差は0.5ポイントを超えなかった（5.1、図4）。形だけの誤った解答例8件で初期化すると69.30%で、通常の正しいSFT（60.71%）とSFTなしのGRPO（35.00%）を上回った（抄録）。", "p6": "著者は統制された診断の場として、モデルをOLMo-2-1Bの1つ、データを英語の算数課題GSM8Kに意図的に限っている（3.1）。解釈：より大きなモデルや他の種類の推論に当てはまるかは未検証である。Limitationsの節は読み切れていない。", "fun": "計算問題の解き方を教えるとき、間違いだらけの模範解答を配ったら、できなくなりそうだ。ところがAIでは、間違った解答例で学ばせたあと、最終の答えが合っているかを報酬にした練習を重ねると、正しい模範解答で学んだ場合と同じくらい解けるようになった。たった3行の、中身のない解答例8件から始めたほうが成績が良かったというのも意外だ。", "unverified": "誤りの型ごとの結果、SFTの正解率と強化学習後の正解率の相関の図、5.3の詳細、Limitationsの節は読んでいない。"}}, {"id": "pn12", "rank": 12, "field": "ヒューマンコンピュータインタラクション", "headline": "人とAIの協働は「協調の連続性」の維持が鍵", "title": "Shared Understanding in Human-AI Teams: Coordination Continuity in Evolving Work", "url": "https://arxiv.org/abs/2611.27746", "authors": "Si\\^an Lindley ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Lindley, S., Burlin, B., Poelitz, C., Tankelevitch, L., & Banks, R. (2026). Shared Understanding in Human-AI Teams: Coordination Continuity in Evolving Work (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27746", "why": "人がAIエージェントと長く非同期に働く場面では、情報を共有していても行動の前提が共有されているとは限らない。協働者が相互依存的な行動の土台を保てている度合いを「協調の連続性」と名づけ、2つの質的なチーム研究と自らの事例から、持続する表現・協調の性質・相互作用の仕組みの3要素の枠組みと、協働AIの基盤に向けた8つの設計上の示唆をまとめた。", "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（抄録、序論、事例の説明の一部、設計上の示唆の見出し、限界の節）を読んだ", "preprint": true, "p1": "人とAIエージェントが長い期間、時間をずらしながら一緒に働くとき、情報を共有していても行動の前提は共有されなくなっていく。それを捉える概念として「協調の連続性」を提案し、維持と立て直しの枠組みを示した（抄録）。", "p2": "チームは共有されたメンタルモデルがあるとうまく協調できるとされるが、目標・計画・役割が残っていても、その時点での意味合いは変わっていく。情報を共有できることは、行動の土台を共有していることを保証しない（抄録、序論）。", "p3": "協調の連続性を、協働者が仕事の進行につれて相互依存的な行動の土台を保てている度合いと定義する。枠組みは3つの要素からなる。協働の仕事の持続的な表現、その場での解釈を支える相対的な協調の性質、表現の状態を理解し変えるための相互作用の仕組みである。構築・行動・ずれ・再構築という経験則で、立て直しが要る時点を特徴づける（抄録）。", "p4": "協働の研究の知見に加え、3つの場面を材料にした。エージェントを使う作業の流れを試す科学者のチーム、計画と振り返りを繰り返す機械学習の研究チーム、著者自身のリポジトリを使った協働環境である。科学者のチームでは2026年に、集団面接2回、個別面接4回、協働作業の観察5回などを集めた（事例の節）。", "p5": "成果は数値ではなく枠組みで、協働AIの基盤に向けた8つの設計上の示唆をまとめた。たとえば、単なる検索ではなく解釈を支えること、役割・専門性・検証の責任を見えるようにすること、不確かさを表し生産的な違いを保つことである（1.1〜1.3の見出し）。", "p6": "著者の限界：事例は小規模な質的研究と著者自身の作業環境から得たもので、枠組みを検証するために設計されたものではなく、枠組みは前向きには適用されていない。分析はAIの支援を受けており、ソフトウェアのエージェントによる知識労働に限られる（Limitationsの節）。", "fun": "共同で使う資料を全員が見られるからといって、全員が同じつもりで動いているとは限らない。目標や計画の言葉がそのまま残っていても、状況が変われば、その意味合いは変わっていく。AIエージェントと長いあいだ一緒に仕事をすると、この「ずれ」が起きる。この論文は、いつずれに気づき、どう認識を合わせ直すかの仕組みを、協働の道具の設計に入れようと提案している。", "unverified": "2つ目の研究（機械学習の研究チーム）と著者自身の事例の詳細、8つの示唆のうち読んでいない項目がある。"}}, {"id": "pn13", "rank": 13, "field": "政治学", "headline": "政権100日で民主主義の規範への期待が低下", "title": "Democratic Norm Erosion in the Wake of the 2024 US Election", "url": "https://doi.org/10.2139/ssrn.7722698", "authors": "William Brown ほか", "venue": "SSRN", "date": "2026-11-23", "apa": "Brown, W., Groenendyk, E. W., Kimbrough, E. O., & Pickup, M. (2026). Democratic Norm Erosion in the Wake of the 2024 US Election. https://doi.org/10.2139/ssrn.7722698", "why": "民主主義の安定は個人の価値観だけでなく、他の人も民主主義を守るはずだという相互の期待（規範）に支えられる。報酬つきの協調ゲームをパネル調査に組み込み、トランプ政権2期目の最初の100日で、共和党支持者は仲間が非民主的な慣行に反対しなくなると、民主党支持者は仲間が無礼に反対しなくなると予想するようになったことを示した。本人の民主主義への支持には変化が見られなかった。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "民主主義を支える「他の人も民主主義を守るはずだ」という相互の期待（規範）が、2024年の米国の選挙のあとの短い期間に弱まったことを、報酬つきのゲームで直接測って示した（抄録）。", "p2": "既存の研究の多くは個人の民主主義への支持を測るが、それは規範の侵食の遅行指標にすぎないかもしれない。また侵食は時間をかけて起きるので、1回の横断調査では測れない（抄録）。", "p3": "報酬つきの協調ゲームをパネル調査に組み込み、同じ人たちの「仲間はどう反応すると思うか」という期待の変化を追う。さらに、規範の侵食の証拠を見せる実験と、実際のお金の寄付の課題で、行動への影響を調べる（抄録）。", "p4": "トランプ政権の2期目の最初の100日間のパネル調査で、党派ごとに、仲間が非民主的な慣行や無礼にどれだけ反対を表明すると予想するかの変化と、本人の民主主義や礼節への関与の変化を比べる（抄録。標本の大きさは未確認）。", "p5": "共和党支持者は、仲間が非民主的な慣行への反対を表明しなくなると予想するようになり、民主党支持者は、仲間が無礼への反対を表明しなくなると予想するようになった。一方、どちらの集団も本人の民主主義や礼節への関与には変化の証拠がなかった。規範の侵食の証拠を見せられた共和党支持者は、非民主的な団体に有意に多くのお金を配分した（抄録）。", "p6": "抄録の範囲では、標本の大きさ、効果の大きさ、パネルからの脱落の扱いは分からない（未確認）。解釈：100日間という短い期間の変化で、長期に続くかは示されていない。", "fun": "決まりを守るのは、自分がそうしたいからだけでなく、「みんなも守るはずだ」と思っているからでもある。民主主義のルールも同じで、周りが守らなくなったと思えば、自分も守る理由が弱まる。この研究は、本人の考えではなく「仲間はどう反応すると思うか」を、報酬のかかった形で尋ねた。すると本人の考えには変化が見られないのに、周りへの期待だけが100日で変わっていた。", "unverified": "本文は入手できず、標本、推定値、実験の詳細は未確認。"}}, {"id": "pn14", "rank": 14, "field": "工学", "headline": "40の探索エージェントの群れで力学クロークを設計", "title": "A Metamaterial Agentic Swarm: Coordinated Search for Discrete Mechanical Design", "url": "https://arxiv.org/abs/2611.26743", "authors": "Achuth Chandrasekhar ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Chandrasekhar, A., Zhao, A., & Farimani, A. B. (2026). A Metamaterial Agentic Swarm: Coordinated Search for Discrete Mechanical Design (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26743", "why": "単位セルの選び方が全体の弾性応答を決める離散メタマテリアルの設計に、大域サンプリング・変異・学習・組み換えなど役割の違う40の数値探索エージェントを5つの島に分けて協調させる方法を提案した。画素単位の力学クロークで外部の変位の不一致を有限要素計算で評価し、最小の損失0.100590（比較のしきい値0.1102を8.72%下回る）を得たが、3回のうち2回はしきい値に届かなかった。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（設計問題の§3.1〜3.2、構成の§4の見出し、結果の要約、限界の§8と結論の§9）を読んだ", "preprint": true, "p1": "多数の単位セルの選び方で全体の変形が決まる力学メタマテリアルの設計を、役割の違う40の数値探索エージェントを5つの「島」に分けて協調させる探索の仕組みで解いた（抄録、§4）。", "p2": "離散的なメタマテリアルの組み立ての設計は、局所の単位セルの選択がまとまって全体の弾性応答を決めるので難しい（抄録、§1）。", "p3": "対象は30×30セル（各セル50×50画素）の構造で、半分の領域の168個の項目それぞれに15の候補から単位セルを選ぶ。穴のない参照の変位場との、外側の観測点での変位のずれを最小にする（力学クローク）。各島には大域の探索、空間的な提案、変異、学習、組み換え、多様性、近傍の探索、磨き上げを担う8つのエージェントがいて、島どうしは優れた設計の保存庫と組み換えを通じて結果を交換する（§3.1、§4.1〜4.2）。", "p4": "候補の設計は、全解像度の有限要素計算（対称性で半分に縮約）で評価する。無作為な割り当てから始めた3回の探索について、1回あたり961回の評価の時点での損失を、比較のしきい値0.1102と比べる（§3.2、抄録）。", "p5": "3回の最終の損失は0.100590、0.139274、0.135858だった。最良の1回はしきい値を8.72%下回ったが、ほかの2回は届かなかった（抄録、§9）。", "p6": "著者の限界：1つの形状・1つの荷重と観測の設定・3回の開始・1つの構成での結果である。961回という報告の時点は進み具合を見たあとで選ばれており、選択による偏りの危険がある。比較の効率や物理的な頑健性を言うには、より広いベンチマークと切り分けの実験が要る（§8、§9）。", "fun": "選ぶ単位セルの組み合わせしだいで全体の変形が変わる構造を使って、穴があるのに、外から見ると穴がないかのように変形する板を作りたい。組み合わせは膨大になる。この研究は、広く探す係、少し変える係、良い例から学ぶ係、仕上げを磨く係など、役割の違う40の探索役をチームにして挑んだ。3回のうち1回しか目標に届かなかったことを明記しているところも誠実だ。", "unverified": "各エージェントの詳しい動作（§4.2）、島ごとの違い（§4.3）、応力の検証の節は読んでいない。"}}, {"id": "pn15", "rank": 15, "field": "経営学", "headline": "オープンバンキングはフィンテックの利用を押し上げる", "title": "Open Banking and Competition in Banks and Fintech: Evidence from Mobile Apps *", "url": "https://doi.org/10.2139/ssrn.7727160", "authors": "Xinchen Ma", "venue": "SSRN", "date": "2026-11-23", "apa": "Ma, X. (2026). Open Banking and Competition in Banks and Fintech: Evidence from Mobile Apps *. https://doi.org/10.2139/ssrn.7727160", "why": "フィンテックアプリのソースコードから独自のデータを作り、同じアプリの中で国ごとにオープンバンキングの利用可否が違うことを使って効果を識別した。オープンバンキングはアプリの利用と成績を有意に高め、効果はデータ集約的なアプリ、新興企業、コロナ禍で大きい。影響を強く受けた既存銀行は貸出と収益が減り、手数料の強化と効率化で応じた。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "オープンバンキング政策がフィンテックアプリの利用を押し上げ、既存の銀行の貸出と収益を減らすことを、アプリのソースコードから作った新しいデータで示した（抄録）。", "p2": "多くの政府が金融サービスの革新を促すためにオープンバンキングを導入したが、競争への効果の証拠は限られていた（抄録）。背景：オープンバンキングは、銀行が持つ顧客のデータを他社のサービスからも使えるようにする政策である。", "p3": "フィンテックアプリのソースコードから新しいデータセットを作り、同じアプリの中で国によってオープンバンキングが使えるかどうかが違うことを利用して、フィンテックへの影響を識別する。既存の銀行については、アプリの説明文のテキスト分析を使う（抄録）。", "p4": "アプリの利用と成績、既存の銀行の貸出・収益・手数料の比重・収益の効率を結果の指標とし、データ集約的なアプリ、新興企業、コロナ禍の時期で効果が違うかを調べる（抄録。対象の国とアプリの数は未確認）。", "p5": "オープンバンキングはフィンテックアプリの利用と成績を有意に高め、効果はデータ集約的なアプリ、フィンテックの新興企業、従来の銀行の利用が限られたコロナ禍で最も大きかった。影響を最も受けた既存の銀行は貸出と収益が減り、手数料の比重を高め、収益の効率を上げることで応じた（抄録）。", "p6": "抄録の範囲では、効果の大きさの数値、対象の国と期間、識別の前提の検証は分からない（未確認）。解釈：アプリが対応している国としていない国の違いには、政策以外の要因も関わりうる。", "fun": "銀行口座の記録は、これまでその銀行が独占的に使えるデータだった。オープンバンキングは、そのデータを別の会社のアプリからも使えるようにする制度だ。この研究は、同じアプリが国によってこの仕組みを使えたり使えなかったりすることに目をつけ、使える国ではアプリの利用が伸びることを示した。消費者のデータの独占が、参入を阻む壁になっていたことが分かる。", "unverified": "本文は入手できず、データの規模、推定値、頑健性の確認は未確認。"}}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "財政調整の予想は人々の「メンタルモデル」で分かれる", "title": "Mental Models of Fiscal Policy", "url": "https://doi.org/10.3386/w36043", "authors": "Francesco Bianchi ほか", "venue": "NBER Working Paper", "apa": "Bianchi, F., Dabla-Norris, E., Goyal, R., Haver, V., & Khalid, S. (2026). Mental Models of Fiscal Policy (NBER Working Paper No. 36043). National Bureau of Economic Research. https://www.nber.org/papers/w36043", "why": "13か国・27,000人超の調査で、財政状況の認識、増税・歳出削減の予想、その理由の自由記述を同時に集め、理由を経済的なメンタルモデル・政治的な物語・経験則に分類した。同じ財政状況を報告する人でも、経済的なモデルで考える人は調整を強く予想し、経験則の人は弱く予想する。無作為化実験では、財政情報が経済的な推論を増やした。", "explain": {"basis": "抄録", "basis_note": "NBERに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "人々が増税や歳出削減をどう予想するかは、財政の現状認識だけでなく、頭の中の考え方の型（メンタルモデル）で分かれることを示した。", "p3": "13か国の27,000人超の調査で、現在の財政状況についての認識、増税と歳出削減の予想、その理由の自由記述を同時に集め、理由を経済的なメンタルモデル、政治的な物語、経験に基づく経験則に分類した（抄録）。", "p5": "同じような財政状況を報告する人でも予想は系統的に違い、経済的なモデルで考える人は増税と歳出削減を強く予想し、経験に基づく推論の人は弱く予想した。無作為化実験では、財政の情報が経済的な推論を述べる人を増やした（抄録）。", "fun": "国の借金が多いと聞いたとき、「いずれ増税になる」と考える人もいれば、「今まで大丈夫だったから大丈夫」と考える人もいる。この研究は、同じ事実を見ていても予想が分かれる理由を、人それぞれの考え方の型に求めた。予想の違いが経済的な行動の意向や資産の配分にも表れるというから、頭の中の型は家計の行動にもつながっている。", "unverified": "分類ごとの割合や効果の大きさを示す数値は抄録になく未確認。"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "低排出ゾーンは「最大か、やらないか」が最適", "title": "Designing Low Emission Zones: Theory and Evidence", "url": "https://doi.org/10.3386/w36037", "authors": "Nano Barahona ほか", "venue": "NBER Working Paper", "apa": "Barahona, N., Fabra, N., Imelda, & Montero, J.-P. (2026). Designing Low Emission Zones: Theory and Evidence (NBER Working Paper No. 36037). National Bureau of Economic Research. https://www.nber.org/papers/w36037", "why": "汚染車を締め出す低排出ゾーンは価格手段と違い利用を非効率に割り当てるため、厚生がゾーンの広さについて準凸になり、できるだけ広くするか導入しないかのどちらかが最適になることを理論で示した。マドリードの新車購入データでは、買い手はクリーンな車に移ったが、乗り換えた人と規制車の利用者の余剰の損失が排出削減の便益を上回った。", "explain": {"basis": "抄録", "basis_note": "NBERに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "汚染の多い車を市街地から締め出す低排出ゾーンは、中途半端な広さが最も損で、できるだけ広くするか、導入しないかのどちらかが望ましいことを示した。", "p3": "ゾーンは価格による手段と違って利用を非効率に割り当て、規制される車の利用者に費用を課すことを組み込んだ理論モデルを作り、マドリードの新車購入のデータで検証した（抄録）。", "p5": "厚生はゾーンの広さについて準凸になる。ハイブリッド車などのよりクリーンな車は移行期の技術として当面は除外し、のちに規制するのがよい場合がある。マドリードでは買い手はクリーンな車に移ったが、乗り換えた人と規制車の利用者の余剰の損失が排出削減の便益を上回った（抄録）。", "fun": "排ガスの多い車を街の中心に入れない規制は、各地の都市に広がっている。広さは「ほどほど」が良さそうに思えるが、この研究の答えは逆で、思い切り広くするか、やらないかの二択だという。料金を取る方法と違い、禁止はどうしても通りたい人まで一律に締め出すからだ。マドリードの実例で損が得を上回ったという結果も考えさせる。", "unverified": "余剰の損失と排出削減の便益の金額は抄録になく未確認。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "住宅と保険の価格は気候リスクを十分に伝えていない", "title": "Climate Risk, Real Estate, and Property Insurance", "url": "https://doi.org/10.3386/w36051", "authors": "Benjamin L. Collier ほか", "venue": "NBER Working Paper", "apa": "Collier, B. L., Keys, B. J., & Mulder, P. (2026). Climate Risk, Real Estate, and Property Insurance (NBER Working Paper No. 36051). National Bureau of Economic Research. https://www.nber.org/papers/w36051", "why": "気候リスクが不動産価格と保険料に正しく反映され、家計がその信号に反応しているかを、急速に増える研究から検討したレビュー。気候リスクから価格に至る各段階に大きな摩擦があり、適応と復旧に影響していると結論する。", "explain": {"basis": "抄録", "basis_note": "NBERに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "住宅の価格と保険料が気候リスクを正しく伝え、家計がそれに反応しているかを研究の蓄積から点検し、その連鎖の各所に大きな摩擦があることを示したレビュー。", "p3": "気候リスクから不動産価格・保険料へ、さらに家計の判断へという連鎖の各段階について、急速に増えている文献を整理し、標準的な経済学の前提が成り立っているかを評価した（抄録）。", "p5": "気候リスクから価格に至る連鎖のどの部分にも大きな摩擦があり、適応と復旧に影響している。不動産と保険の市場の価格の信号が、家計を気候リスクに強い結果へ導くとは言いにくいと結論する（抄録）。", "fun": "洪水や山火事の危険が高い土地は、家の値段が安く、保険料が高くなるはずだ。そうなっていれば、人は値段を見るだけで危ない場所を避けられる。このレビューは、その仕組みが実際には各段階で目詰まりしていると指摘する。値札が危険を教えてくれると期待しすぎてはいけない、という結論は、家を買う誰にとっても身近な話だ。", "unverified": "レビューのため、個々の研究の推定値は抄録になく未確認。"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "OPECの市場支配力の厚生損失を他の歪みと分けて測る", "title": "Beyond the First Best: Welfare and OPEC Market Power", "url": "https://doi.org/10.3386/w36058", "authors": "John Asker ほか", "venue": "NBER Working Paper", "apa": "Asker, J., Collard-Wexler, A., De Cannière, C., & De Loecker, J. (2026). Beyond the First Best: Welfare and OPEC Market Power (NBER Working Paper No. 36058). National Bureau of Economic Research. https://www.nber.org/papers/w36058", "why": "カルテルの市場支配力による厚生損失を、他の歪みの存在を認めたうえで測る枠組み（限界と限界内の損失）を提案した。費用と生産のミクロデータによると、単純な計算では1970年以降のOPECによる損失は2.2兆ドルだが、カルテル外の費用最小化の違反を除くと約0.7兆ドルに縮む。", "explain": {"basis": "抄録", "basis_note": "NBERに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "OPECのカルテルが世界の原油市場にもたらした厚生の損失を、ほかの歪みが同時にあることを考えに入れて測り直す枠組みを作った。", "p3": "市場支配力の厚生への影響を、限界の損失と限界内の損失という2つの概念で測り、ほかの歪みを無視する単純な計算と比べる。費用と生産の独自のミクロデータで、死重損失と生産の非効率を推定した（抄録）。", "p5": "単純な計算では、1970年以降のOPECによる損失は2.2兆ドルで、その3分の2が生産の非効率、3分の1が死重損失になる。カルテルの外の費用最小化の違反を取り除くと、損失は約0.7兆ドルに縮む（抄録）。", "fun": "産油国が申し合わせて生産を絞ると、原油は高くなり、世界は損をする。その損を金額にするとき、ふつうは「カルテルさえなければ理想的な市場だった」と仮定する。この研究は、カルテルの外にも無駄があることを考えに入れると、損失の見積もりが2.2兆ドルから約0.7兆ドルへ大きく変わることを示した。何と比べるかで答えが変わる好例だ。", "unverified": "推定の方法の詳細とデータの出所は抄録からは分からず未確認。"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "明代の官僚的な補給制度が戦闘の勝率を下げた", "title": "Bureaucratic Rigidity and Battle Outcomes: Evidence from Military Logistics in the Ming Dynasty", "url": "https://doi.org/10.3386/w36049", "authors": "Jingjing Chen ほか", "venue": "NBER Working Paper", "apa": "Chen, J., Han, J., Wang, S.-Y., & Wang, Y. (2026). Bureaucratic Rigidity and Battle Outcomes: Evidence from Military Logistics in the Ming Dynasty (NBER Working Paper No. 36049). National Bureau of Economic Research. https://www.nber.org/papers/w36049", "why": "1492年の明朝の改革で、軍の穀物輸送が塩商人から府ごとに引き継ぐ国営の中継制に移った。改革後、商人が補給していた駐屯地で補給不足が増え、406の防衛戦の分析でその近くの勝率が下がった。影響は長期戦や城郭の防衛、経路が多くの府をまたぐ場合に大きく、説明責任のための規則が国家の実効性を損なう例を示す。", "explain": {"basis": "抄録", "basis_note": "NBERに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "説明責任を高めるための官僚的な規則が、かえって国家の実行力を損なうことを、明代の軍の補給制度の改革と戦闘の勝敗から示した。", "p3": "1492年の改革で、軍の穀物の輸送は塩商人から、府から府へ引き継ぎ経路を固定した国営の中継制度に移った。商人が補給していた駐屯地と国が補給していた駐屯地を比べ、外敵に対する406の防衛戦を分析した（抄録）。", "p5": "改革後、商人が補給していた駐屯地で補給の不足が増え、その近くでの勝率が下がった。低下は補給が重要な長い戦争や城壁のある都市の防衛、経路が多くの府をまたぐか、洪水・干ばつ・険しい地形にさらされる場合に大きかった（抄録）。", "fun": "明の時代の中国で、軍に米を届ける仕事を商人任せから役所の引き継ぎ方式に変えた。責任の所在ははっきりしたが、決められた道順と受け渡しの手続きが足かせになり、前線に米が届きにくくなった。その結果が戦の勝ち負けにまで表れたというのがこの研究だ。きちんと管理しようとするほど現場が動けなくなる、という現代にも通じる話である。", "unverified": "勝率の低下の大きさを示す数値は抄録になく未確認。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "組合の交渉力強化は競合企業の賃金も引き上げる", "title": "Outside Options and Collective Bargaining Spillovers", "url": "https://doi.org/10.2139/ssrn.7321918", "authors": "Luis de Azevedo Gomes ほか", "venue": "SSRN", "date": "2026-11-23", "apa": "de Azevedo Gomes, L., & Neri, G. (2026). Outside Options and Collective Bargaining Spillovers. https://doi.org/10.2139/ssrn.7321918", "why": "ブラジルで一部の企業の組合交渉を強めた改革を使い、労働者の転職ネットワークから競合する雇用主を特定した。直接影響を受けた企業は賃金と組合交渉による福利を上げ、競合企業も賃金をその4分の1ほど上げた。波及は組合の働きかけではなく、採用競争への雇用主の反応による。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "一部の企業で労働組合の交渉力が強まると、その企業と人材を取り合う別の企業の賃金も上がることを示した。", "p3": "ブラジルで一部の企業の組合交渉を強めた改革を利用し、労働者の転職のネットワークから競合する雇用主を特定して、直接の影響と波及を比べた（抄録）。", "p5": "直接影響を受けた企業は賃金と組合が交渉した福利を引き上げた。競合する雇用主は賃金をその4分の1ほど引き上げたが、福利は変わらなかった。波及は組合の働きかけではなく採用競争への反応で、代わりのききにくい労働者を取り合う場合に大きかった（抄録）。", "fun": "となりの会社が給料を上げると、こちらの会社も社員を引き留めるために上げざるをえない。この研究は、労働組合の力が強まった会社の賃上げが、ライバルの会社にまで約4分の1の大きさで伝わることをブラジルで確かめた。組合の恩恵はその会社の人だけのものではなく、転職という道を通じて周りにも広がるという見方が面白い。", "unverified": "賃上げの幅そのものの数値と、対象になった企業の数は抄録になく未確認。査読前の原稿である。"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "米国の資本市場は1890年までにほぼ全国統合", "title": "The Emergence of a National Capital Market,1870–1940", "url": "https://doi.org/10.3386/w36040", "authors": "Pawel Janas", "venue": "NBER Working Paper", "apa": "Janas, P. (2026). The Emergence of a National Capital Market,1870–1940 (NBER Working Paper No. 36040). National Bureau of Economic Research. https://www.nber.org/papers/w36040", "why": "1870〜1940年の生命保険会社の10万件超の保有資産を地理情報つきで記録した長期データを作った。1880〜1890年に債券の投資先までの平均距離は2倍以上になり、本拠州の比率は半分超から4分の1未満に下がった。統合は1890年までにほぼ終わっていた。", "explain": {"basis": "抄録", "basis_note": "NBERに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "米国の資本市場が地域ごとの市場から全国で1つの市場にまとまった時期を、生命保険会社の投資先の記録から特定した。", "p3": "1870〜1940年の生命保険会社の100,000件を超える保有資産を、所在地つき・企業単位で記録した長期のデータを作り、投資先までの距離と本拠の州の比率の変化を追った（抄録）。", "p5": "1880年から1890年の間に、保険会社の債券の本拠からの平均距離は2倍以上になり、本拠の州の比率は半分超から4分の1未満に下がった。変化は企業の内部で、債券の種類や設立の形を問わず起きた。統合は1890年までにほぼ完了していた（抄録）。", "fun": "今ではお金は全国どこへでも流れるが、昔は地元で集めたお金は地元に貸すのが普通だった。米国でその壁がいつ消えたのかを、保険会社が何に投資していたかという帳簿から読み解いたのがこの研究だ。1880年から1890年の間に投資先が一気に遠くへ広がったという結果は、変化が意外なほど急だったことを物語る。", "unverified": "統合を促した原因の分析は抄録からは分からず未確認。"}}, {"id": "pn23", "rank": 23, "field": "機械学習", "headline": "動画の世界モデルが物体をすり抜けないようにする", "title": "Non-penetrating World Models", "url": "https://arxiv.org/abs/2611.27963", "authors": "Yuhang Dai ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-23", "apa": "Dai, Y., Wu, Y., Lin, Z., Ji, H., & Yang, X. (2026). Non-penetrating World Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27963", "why": "対話型の動画世界モデルが障害物をすり抜けてしまう問題を評価するベンチマークNoPeBenchを作り、公開モデルはどれも確実には防げないことを示した。一方、拡散Transformerの隠れ状態はすり抜けを予測できる情報を持っており、小さな予測ヘッドで危険な操作を安全な操作に置き換えると、違反率が6モデル平均で74%から16%に下がった。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの記録にあるarXivの抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "操作に応じて映像を生成する動画の世界モデルが、物体が障害物をすり抜ける映像を作ってしまう問題を測るベンチマークを作り、それを防ぐ軽い仕組みを示した。", "p3": "ベンチマークNoPeBenchで既存のモデルを評価したうえで、凍結した拡散Transformerの隠れ状態の上に小さな予測ヘッドを学習させ、候補の操作が安全かを読み出す。危険な操作は、元の意図をできるだけ保つ安全な操作に置き換える（抄録）。", "p5": "公開モデルはどれもすり抜けを確実には防げなかったが、隠れ状態はすり抜けを予測できる情報をすでに持っていた。提案の方法は、物理的な違反の割合を6つの動画世界モデルの平均で74%から16%に下げ、三人称視点や動く障害物にもそのまま一般化した（抄録）。", "fun": "ゲームのような映像をAIがその場で作る技術では、キャラクターが壁をすり抜けてしまうことがある。面白いのは、AIは「このまま進むと壁にぶつかる」ことを内部では分かっているのに、映像には反映していなかったという発見だ。その内なる知識を小さな部品で読み出して操作を直すだけで、すり抜けが74%から16%に減った。", "unverified": "ベンチマークの規模と評価した6つのモデルの名前は抄録になく未確認。"}}, {"id": "pn24", "rank": 24, "field": "機械学習", "headline": "拡散言語モデルCloverがエージェント評価で首位", "title": "Clover-35B-A3B-Preview Technical Report", "url": "https://arxiv.org/abs/2611.24636", "authors": "DiffuSpace Technical Team", "venue": "Hugging Face Daily Papers", "date": "2026-11-23", "apa": "DiffuSpace Technical Team. (2026). Clover-35B-A3B-Preview Technical Report (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24636", "why": "総パラメータ350億・稼働30億の混合エキスパート型の拡散言語モデルClover-35B-A3B-Previewの技術報告。過去の文脈の再帰的な記憶と、現在のブロック内の双方向注意を組み合わせる。評価した7つのエージェント指標で首位（SWE-bench Verified 73.6など）で、生成速度は1 GPUで毎秒680トークンと報告している。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの記録にあるarXivの抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "文章をブロックごとにまとめて生成する拡散型の言語モデルClover-35B-A3B-Previewで、エージェントの課題でも高い成績を出せることを報告した技術報告。", "p3": "総パラメータ350億のうち30億を稼働させる混合エキスパート型で、過去に生成した文脈の再帰的な記憶と、現在のブロック内の双方向の注意を組み合わせる。記憶の読み出しは、現在のブロックのトークンと同じソフトマックスの中で競合する（抄録）。", "p5": "評価した7つのエージェント指標で首位で、SWE-bench Verifiedで73.6、Terminal-Bench 2.1で51.7だった。社内のエージェントの作業では、NVIDIA GB300のGPU 1台で毎秒680トークンの生成速度を報告している（抄録）。", "fun": "文章を作るAIの多くは、言葉を1つずつ順番に書いていく。このモデルは、ぼんやりした状態から少しずつはっきりさせる方式で、ひとかたまりの文章を同時に仕上げる。プログラムの修正のような複雑な作業の評価でも首位の成績を出し、1秒に680トークンという速さも両立したという報告で、言葉を1つずつ書く方式以外の道があることを示している。", "unverified": "技術報告で、比較相手のモデルと評価の条件は抄録からは分からない。社内の作業での速度は著者の報告値で、第三者の検証は未確認。"}}, {"id": "pn25", "rank": 25, "field": "機械学習", "headline": "注釈なしの動画から先読みの推論を自己蒸留で学ぶ", "title": "Learning Video Foresight Reasoning from Unlabeled Videos via On-Policy Self-Distillation", "url": "https://arxiv.org/abs/2611.26954", "authors": "Jingchen Sun ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-23", "apa": "Sun, J., Zhang, J., Hu, Q., Ye, D., Jia, Y., Liang, Y., Fu, D., Tian, Y., Zhao, D., & Chen, C. (2026). Learning Video Foresight Reasoning from Unlabeled Videos via On-Policy Self-Distillation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26954", "why": "動画の続きや次の行動を予測する推論を、注釈や外部の大規模モデルなしで、過去と未来の動画の組を自己教師の信号にして学ぶ枠組みFuture-OPSDを提案した。未来の情報のうち意思決定に効く部分を選ぶ「先読みスコア」を定義し、その扱える下界を最適化する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの記録にあるarXivの抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "動画を見て「このあと何が起きるか」「次に何をすべきか」を推論する力を、人手の注釈も外部の大きなモデルも使わず、ラベルのない動画だけから学ばせる方法を作った。", "p3": "過去と未来の動画の組を自己教師の信号にする自己蒸留の枠組みFuture-OPSD。未来の映像のうち判断に役立つ部分を選ぶ「先読みスコア」を定義し、直接は計算できないので、真の未来とランダムな参照の未来の差などを使う下界を最適化する（抄録）。", "p5": "自由回答の予測と選択式の計画の課題で、元のモデルを最大14.2ポイントと15.9ポイント改善し、一般的な動画理解の力は損なわなかった（抄録）。", "fun": "試合の映像を途中まで見て、次のプレーを予想する。その力をAIに教えるには、ふつう正解の説明文を人が大量に書く必要がある。この研究は、動画の続きそのものを先生にした。しかも続きの映像の大部分は予想に関係ない情報なので、本当の続きとでたらめな続きを比べて、違いを生む部分だけを学ばせる工夫が面白い。", "unverified": "評価に使ったデータセットと元のモデルの名前は抄録になく未確認。"}}, {"id": "pn26", "rank": 26, "field": "機械学習", "headline": "記憶を圧縮し必要時に復元する言語モデルの新構造", "title": "MemOnce: A Scalable Memory Architecture for Large Language Models", "url": "https://arxiv.org/abs/2611.27973", "authors": "Chang Nie ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-23", "apa": "Nie, C., Fu, C., Liu, S., Hu, Y., & Shan, C. (2026). MemOnce: A Scalable Memory Architecture for Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27973", "why": "長い対話で過去の状態を再利用するために、最終層の隠れ状態の一部だけを小さな記憶として保持し、必要なときに注意層のKVキャッシュへ復元する構造MemOnceを提案した。関連する記憶だけを疎に検索し、GPUメモリを大きく減らして線形時間の計算量を達成する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの記録にあるarXivの抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "長いやり取りの履歴を小さな記憶として保持し、必要なときだけ元の形に戻して使う言語モデルの構造MemOnceを提案した。", "p3": "最終層の隠れ状態の一部だけを小さな記憶表現として保存し、注意層で使うKVキャッシュへ動的に復元する。入力ごとに関連する記憶だけを疎に検索し、その位置の計算は全層で1回だけにする（抄録）。", "p5": "Qwen3.5-4BをMemOnceで適応させると、1Mの文脈で記憶の状態のキャッシュが1313分の1に、前処理の遅延が6.9分の1になり、スループットは3.5倍、記憶の総合性能は5.77%向上した（抄録）。", "fun": "長い会話を続けると、AIはそれまでのやり取りを全部覚えておくために、どんどんメモリを使う。この研究は、覚えておく内容をぎゅっと小さくたたんでしまい、必要になったものだけを広げて使う仕組みを作った。本棚の本を全部机に広げておく代わりに、要る本だけ取り出すようなもので、保存の量が1313分の1になったという。", "unverified": "比較した他の構造の名前と、評価の課題の詳細は抄録になく未確認。"}}, {"id": "pn27", "rank": 27, "field": "機械学習", "headline": "検索を事前学習の段階から教える言語モデル", "title": "Search From the Start: Search-Native Pretraining for Language Models", "url": "https://arxiv.org/abs/2611.26809", "authors": "Kaustubh Ponkshe ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-23", "apa": "Ponkshe, K., Je, G. H., Taga, S., Raffel, C., & Jaggi, M. (2026). Search From the Start: Search-Native Pretraining for Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26809", "why": "検索の能力を後段の調整ではなく事前学習で教えるため、事前学習コーパスに検索クエリと検索結果を大規模に差し込む方法を提案した。3.6億〜33億パラメータの規模で、知識を要する課題の成績と、検索された証拠への従いやすさが向上し、その優位は教師あり微調整の後も残った。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの記録にあるarXivの抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "検索の使い方を、あとからの調整ではなく最初の学習（事前学習）の段階で言語モデルに教える方法を示した。", "p3": "事前学習の文章に、ウェブ検索のクエリと、手元の索引から取り出した検索結果を大規模に差し込む。この文章で学習したモデルは、文章の予測の中で検索の呼び出しを生成し、取り出した証拠を取り込むことを覚える。360Mから3.3Bのパラメータ規模で試した（抄録）。", "p5": "検索つきで事前学習したモデルは、知識を要する課題の成績と、取り出した証拠への従いやすさが向上し、その優位は教師あり微調整のあとも残った。1.4Bのモデルは、計算量をそろえた3.3Bの基準モデルに全ての知識課題で並ぶか上回った（抄録）。", "fun": "分からないことを調べる習慣は、あとから教わるより、最初から調べ物をしながら学ぶほうが自然に身につきそうだ。この研究はAIでそれを試した。文章を読んで言葉を覚える最初の段階から、途中に「検索して確かめる」場面を混ぜておく。すると、あとから検索の使い方だけを教えたモデルより、小さくても知識の課題に強くなったという。", "unverified": "評価した課題の名前と成績の数値は抄録になく未確認。"}}, {"id": "pn28", "rank": 28, "field": "機械学習", "headline": "LLMの座標軸は完全に任意ではなく部分的に共通", "title": "Partially canonical axes in large language model representations", "url": "https://arxiv.org/abs/2611.26920", "authors": "Andrea Gregor de Varda ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "de Varda, A. G., D'Elia, F., Tuckute, G., Fedorenko, E., & Khosla, M. (2026). Partially canonical axes in large language model representations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26920", "why": "LLMの内部表現の個々の座標軸は任意だという通念を検証した。6系統12モデルで、元の座標軸は、同じ幾何を保ってランダムに回転した軸よりも、他のモデルの表現、言語に対する人の脳の応答、解釈可能な言語特徴とよく揃っていた。ただし最良の整合には届かず、軸は「部分的に正準」である。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "LLMの内部表現の1つ1つの座標軸は、完全に任意でも完全に決まったものでもなく、モデルどうしである程度共通していることを示した。", "p3": "6系統の12のLLMで、元の座標軸と、同じ幾何を保ってランダムに回転させた軸を比べ、他のモデルの表現、言語に対する人の脳の応答、解釈可能な言語の特徴との整合の度合いを測った（抄録）。", "p5": "元の軸は回転した軸より一貫してよく揃っていたが、達成しうる最良の整合には大きく届かなかった。著者はこれを「部分的に正準」と呼び、表現の理論は集団の幾何だけでなく、個々のユニットの応答の型が系をまたいで繰り返す理由も説明すべきだとする（抄録）。", "fun": "AIの頭の中では、言葉の意味はたくさんの数字の並びで表されている。その1つ1つの数字に意味があるのか、それとも組み合わせにしか意味がないのかは、はっきりしていなかった。この研究は、座標をぐるりと回した偽物と比べるという方法で、別々に作られたAIの間でも、また人の脳とも、個々の数字の役割がある程度そろっていることを示した。", "unverified": "整合の度合いを示す数値と、12のモデルの名前は抄録になく未確認。"}}, {"id": "pn29", "rank": 29, "field": "機械学習", "headline": "言語モデルは推論を左右した語を自覚していない", "title": "Do Language Models Know Which Words Steer Their Reasoning?", "url": "https://arxiv.org/abs/2611.27317", "authors": "Yanbei Jiang ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Jiang, Y., Lei, C., Lau, J. H., Ehinger, K. A., & Wei, R. G. (2026). Do Language Models Know Which Words Steer Their Reasoning? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27317", "why": "文脈から1語ずつ除いて次の語の分布の変化を測る方法で、意味上は無関係な語が思考の連鎖を強く動かす現象を見つけ、同じモデルに尋ねるとその語の関連を否定することを4モデル・3ベンチマークで示した。影響が大きいのにモデル自身が無関係と判定した語のKVキャッシュを消して解き直す対策も提案する。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "言語モデルが段階的に推論するとき、意味のうえでは無関係な語に強く引っぱられているのに、モデル自身はその語の影響を否定することを示し、それを利用して精度を上げる方法を提案した。", "p3": "文脈から語を1つずつ除いて次の語の分布の変化を測り、除くと予測が反転する語を見つけて、同じモデルにその語が関係するかを判定させる。対策として、影響が大きいのにモデルが無関係と判定した語のKVキャッシュの項目を消して解き直す（抄録）。", "p5": "4つのモデルと3つのベンチマークで、モデルは推論を左右した語をほとんど認識していなかった。1語だけへの介入は、4つのモデルと5つの推論ベンチマークで精度を改善し、数学の推論では最大8.9ポイント上がった（抄録）。", "fun": "文章題を解くとき、問題文の中のどうでもいい一言に引っかかって間違えることがある。AIも同じで、しかも「その言葉は関係ありますか」と聞くと「関係ない」と答える。自分が何に影響されたかを自分で分かっていないのだ。この研究は、その食い違いを逆手にとり、関係ないと自分で言った言葉を消してやり直させて正解率を上げた。", "unverified": "4つのモデルとベンチマークの名前は抄録になく未確認。"}}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "分散が無限でも最適な線形回帰の誤差率を達成", "title": "Optimal Linear Regression Without a Variance", "url": "https://arxiv.org/abs/2611.27983", "authors": "Artin Tajdini ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Tajdini, A., Lee, J. C. H., Scarlett, J., & Jamieson, K. (2026). Optimal Linear Regression Without a Variance (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27983", "why": "回帰の雑音が1<α<2のα次モーメントしか持たない（分散が無限の）場合の線形回帰で、有限分散用の手法を弱いモーメント用に変換するブラックボックスの還元を与えた。αや雑音の大きさを知らなくても、高い確率で ((d+log(1/δ))/n)^((α−1)/α) の速さの誤差を達成し、対応するミニマックス下界も示した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "回帰の誤差のばらつきが極端に大きく、分散が無限になる場合でも、分散が有限のときの手法を作り替えるだけで、理論上最良の速さで係数を推定できることを示した。", "p3": "雑音が1より大きく2より小さいα次のモーメントしか持たない線形回帰を扱う。経験的な残差の刈り込みに基づく還元で、有限分散用の回帰の手続きを弱いモーメント用に変換する。αも雑音の大きさも共分散も知らなくてよい（抄録）。", "p5": "共変量に有限の4次モーメントがあれば、標本数がしきい値を超えると、高い確率で誤差が ((d+log(1/δ))/n) の (α−1)/α 乗の速さで小さくなる。同じ条件での対応するミニマックス下界も証明し、平均の推定にも同様の還元を与えた（抄録）。", "fun": "身長のデータなら、平均からのずれはだいたい決まった範囲に収まる。ところが、ごくまれに桁外れの値が出るデータでは、ずれの大きさを表す「分散」が定まらないことがある。この研究は、そんな荒れたデータでも直線を当てはめられること、しかも普通の方法の結果から外れの大きい点を刈り込む手直しだけで、これ以上ない精度に届くことを示した。", "unverified": "理論の論文で、実データでの検証の有無は抄録からは確認できない。"}}, {"id": "pn31", "rank": 31, "field": "統計学", "headline": "過去の実験を縮小推定で借りて処置効果の精度を上げる", "title": "Combining Past Experimental Data for Efficient Estimation: A Shrinkage Approach", "url": "https://arxiv.org/abs/2611.27655", "authors": "Qianxi Zhang ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Zhang, Q., Ham, D. W., & Jasin, S. (2026). Combining Past Experimental Data for Efficient Estimation: A Shrinkage Approach (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27655", "why": "企業に蓄積された過去の無作為化実験は、介入が少しずつ違うため偏りがある。偏りと分散が既知なら、偏った実験を1つ借りるだけでも平均二乗誤差が必ず下がることを示し、実際に使える3つの縮小推定量と、補助実験の数が増えるときの漸近的な性質を導いた。偏りのばらつきが推定量に有利にも不利にも働くことを示す。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "企業にたまった過去の無作為化実験の結果を借りて、新しい実験の処置効果をより正確に推定する縮小推定の方法と、それが有利になる条件を示した。", "p3": "過去の実験は似ているが別の介入を評価しているため、今回の対象については偏りがある。複数の補助実験から借りることで平均二乗誤差を減らせる条件を分析し、3つの縮小推定量を提案して、補助実験の数が増えるときの漸近的な平均二乗誤差を導いた（抄録）。", "p5": "偏りと分散が既知なら、偏った実験を1つ借りるだけでも平均二乗誤差は必ず下がる。偏りのばらつきは有利にも不利にも働くため、実験ごとの重みづけを制限する推定量と、補助の平均が目標と有意に違わないときだけ借りる推定量も提案した（抄録）。", "fun": "企業は「画面の作りを変えたら売上が増えるか」といった実験をたくさん行う。過去の実験は今回と少し違うので、そのまま使うと偏るが、捨てるのももったいない。この研究は、偏りがあっても少し借りるほうが必ず得になる場合があることを示した。少しずれた定規でも、ずれ方を見積もれば測定の役に立つ、という発想が面白い。", "unverified": "シミュレーションの具体的な数値は抄録になく未確認。実際の企業データでの検証の有無も未確認。"}}, {"id": "pn32", "rank": 32, "field": "統計学", "headline": "較正データが少ないときの共形検定の乱択を整理", "title": "Smoothed Conformal Testing with Small Calibration Sets", "url": "https://arxiv.org/abs/2611.27315", "authors": "Mingzhou Deng ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Deng, M., & Fu, Y. (2026). Smoothed Conformal Testing with Small Calibration Sets (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27315", "why": "較正標本が小さいと分割共形法のp値は粗い格子の値しか取れない。同順位のブロックごとの独立な乱択は交換可能性のもとで厳密に妥当で、BH法による偽発見率の制御も成り立つことを証明した。一方、並べ替えた乱数をスコアの順に割り当てる方法は、単一のp値の妥当性さえ壊しうることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "少ない較正データで共形予測のp値を求めるときに使う乱択（ランダム化）について、どのやり方が正しく、どのやり方が誤りを招くかを整理した。", "p3": "較正標本が小さいと、分割共形法のp値は粗い順位の格子の値しか取れない。乱択でこの離散性を除く方法を、平滑化の区間と補助の乱数の割り当て方に分けて理論的に調べ、反例とシミュレーションで確かめた（抄録）。", "p5": "同順位のブロックごとの独立な乱択は交換可能性のもとで厳密に妥当で、条件が整えばBH法による偽発見率の制御も成り立つ。並べ替えた乱数をスコアの順に割り当てると単一のp値の妥当性さえ壊れ、偽発見率が名目の水準を超える。乱択は大きな較正標本の代わりにはならない（抄録）。", "fun": "検査で異常を見つけたいとき、間違い警報を一定の割合に抑える保証をくれる統計の方法がある。ところが手本のデータが少ないと、結果が飛び飛びの値になって使いにくい。そこで乱数を使って値をなめらかにする工夫があるのだが、乱数の割り当て方しだいで保証が壊れることをこの研究は示した。便利な小技にも正しい作法があるという話だ。", "unverified": "シミュレーションでの偽発見率の具体的な値は抄録になく未確認。"}}, {"id": "pn33", "rank": 33, "field": "統計学", "headline": "構造の情報が最適輸送の推定をいつ改善するかを特定", "title": "Semiparametric Efficiency for Entropic Optimal Transport under Structured Distribution Shift", "url": "https://arxiv.org/abs/2611.27261", "authors": "Yiming Ma ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Ma, Y., Zhuang, W., & Liu, H. (2026). Semiparametric Efficiency for Entropic Optimal Transport under Structured Distribution Shift (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27261", "why": "指数型の密度比モデルのもとでのエントロピー正則化つき最適輸送の推定について、構造の制約による分散の利得を射影の恒等式で厳密に求めた。プールした経験尤度推定量が制約つきの効率限界を達成するが、モデルが正しくても利得がゼロになる場合があることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "2つの分布の間の最適な対応づけ（エントロピー正則化つき最適輸送）を推定するとき、分布の違い方についての構造の情報が精度を上げるのはいつで、上げないのはいつかを特定した。", "p3": "ノンパラメトリックな基準分布を持つ固定次元の指数型の密度比モデルを考え、制約による分散の利得を厳密な射影の恒等式で表した。プールした経験尤度の推定量が制約つきの限界を達成することを示した（抄録）。", "p5": "モデルが正しくても利得はゼロになりうるし、傾きの空間を広げると縮みうる。同じ射影の残差が、局所的な誤特定のもとでの1次の偏りも決める。両方の標本が増えて目標の割合が消える場合には、極限分布に相転移が現れる（抄録）。", "fun": "2つの集団を比べるとき、「違いはこういう形のはずだ」という知識があれば、推定は正確になりそうに思える。ところがこの研究は、その知識が正しくても得がまったくない場合があることを数式で示した。情報を足せば必ず良くなるわけではなく、知りたい量とその情報の向きが合っているかどうかで決まる、という結論が意外だ。", "unverified": "実験の具体的な数値は抄録になく未確認。"}}, {"id": "pn34", "rank": 34, "field": "統計学", "headline": "補助変数も欠測する場合の条件付き平均の識別条件", "title": "Estimating conditional means under missingness-not-at-random with incomplete auxiliary variables", "url": "https://arxiv.org/abs/2611.26891", "authors": "Maya B. Mathur ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Mathur, M. B., Seaman, S., Zhang, W., McGrath, S., & Shpitser, I. (2026). Estimating conditional means under missingness-not-at-random with incomplete auxiliary variables (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26891", "why": "欠測が無作為でない（MNAR）場合に、補助変数自体が不完全だとMARの仮定は回復しない。MARに基づく汎関数が正しくなるための、MARより弱い必要十分条件を導き、不完全な補助変数について周辺化する別の識別汎関数とその十分条件を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "データの欠け方が値そのものに依存し、しかも補助に使う変数まで欠けている場合に、条件付き平均を正しく推定できる条件と、新しい推定の式を示した。", "p3": "欠測が無作為という仮定に基づく汎関数が正しくなるための、その仮定より弱い必要十分条件を導いた。さらに、不完全な補助変数について周辺化する別の識別汎関数と、それが正しくなる十分条件を提案し、g計算と二重頑健の推定量を与えた（抄録）。", "p5": "説明変数が完全で目的変数が不完全な場合、または補助変数が全て不完全な場合には、新しい汎関数は従来のものより広い範囲の分布で正しい。どちらに当たるかは欠測の仕組みを知らなくても判定できる。Rのパッケージmiapackで実装した（抄録）。", "fun": "アンケートで答えにくい質問をすると、その答えの中身によって答えるかどうかが変わることがある。そうなると残ったデータの平均は偏る。別の質問の答えを手がかりに補うのが定番だが、その手がかりも欠けていたらどうするか。この研究は、手がかりが欠けていても正しく推定できる場合があることと、その見分け方を示した。", "unverified": "実データの例とシミュレーションの結果の数値は抄録になく未確認。"}}, {"id": "pn35", "rank": 35, "field": "経営学", "headline": "東独からの発明者の流入が西独の特許を長期に押し上げた", "title": "Migration and innovation: the impact of East German investors on West Germany's technological development", "url": "https://econpapers.repec.org/RePEc:ehl:lserod:141605", "authors": "Bergeaud ほか", "venue": "RePEc NEP", "date": "2026-11-23", "why": "第二次大戦後からベルリンの壁の建設（1961年）までの東から西ドイツへの大規模な移住について、1世紀分の特許と発明者のデータと、姓の近さに基づく識別戦略で発明者の移動を追跡した。東独の発明者が多く流入した地域では特許が有意かつ持続的に増え、化学と物理が中心だった。", "explain": {"basis": "抄録", "basis_note": "RePEc（NEP）に登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "東ドイツから西ドイツへ移った発明者が、移住先の地域の技術革新を長く押し上げたことを因果的に示した。", "p3": "第二次世界大戦からベルリンの壁が築かれた1961年までの大規模な移住を対象に、新しく作った1世紀にわたるドイツの特許と発明者のデータと、姓の近さに基づく識別戦略で、東ドイツの発明者の足どりを追った（抄録）。", "p5": "東ドイツの発明者の流入が多かった地域では、特許の活動が有意かつ持続的に増え、主に化学と物理の進歩によるものだった。効果は、他の高技能の労働者や科学者の移住による効果より強かった（抄録）。", "fun": "人が引っ越すと、頭の中の知識も一緒に引っ越す。戦後、東ドイツから西ドイツへ多くの人が移った。この研究は、その中の発明家がどこに住みついたかを名字の手がかりから推定し、たくさん受け入れた地域ではその後長く特許が増えたことを示した。壁ができる前の人の流れが、のちの地域の技術力を左右したというのが面白い。", "unverified": "特許の増加の大きさを示す数値は抄録になく未確認。題名のinvestorsは、抄録の内容からinventors（発明者）を指すとみられる。"}}, {"id": "pn36", "rank": 36, "field": "経営学", "headline": "大作の参入に無料ゲームは保守的な更新で応じる", "title": "Competition and Innovation in Digital Markets: Empirical Evidence from the Steam Platform", "url": "https://doi.org/10.2139/ssrn.7726238", "authors": "Evyatar Ben Zion Segal", "venue": "SSRN", "date": "2026-11-23", "apa": "Segal, E. B. Z. (2026). Competition and Innovation in Digital Markets: Empirical Evidence from the Steam Platform. https://doi.org/10.2139/ssrn.7726238", "why": "Steamの17,290タイトルの週次パネル（2016〜2026年）と全更新記録で、上位10%の大作の参入が既存の開発者の更新を増やすかを積み上げ型の差の差法で調べた。頑健な結果は量ではなく構成の変化で、無料ゲームは有料ゲームに比べて定常的な技術保守の更新に有意に寄った。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "無料のゲームと有料のゲームでは、大作のライバルが参入したときの開発者の対応が、量ではなく中身で違うことを示した。", "p3": "ValveのSteamで経済的に活動している17,290タイトルの週次のパネル（2016〜2026年）を、配信ネットワークから取り出して種類を分類した更新の全記録から作り、上位1割の大作の参入の前後を積み上げ型の差の差法で推定した（143,191のゲーム・週）（抄録）。", "p5": "無料ゲームの既存タイトルは、参入後に有料ゲームに比べて定常的な技術保守の更新に有意に寄り、更新の総量は増えなかった。ネットワークの形（1人用か多人数用か）は単独では反応を変えなかった（抄録）。", "fun": "無料で遊べるゲームは、値下げで客を引き留めることができない。では強力なライバルが現れたらどうするか。新しい遊びを足して対抗しそうに思えるが、Steamの更新記録を調べると、実際には技術的な保守のような地道な手入れに寄っていた。値段で戦えない会社は、より激しくではなく別のやり方で戦う、という結論が面白い。", "unverified": "効果の大きさの数値は、抄録の該当部分の表記が崩れていて読み取れず未確認。査読前の原稿である。"}}, {"id": "pn37", "rank": 37, "field": "経営学", "headline": "AI動画の生成料金と広告分配の最適な組み合わせ", "title": "Generation Pricing and Creator Incentives on AI Video Platforms", "url": "https://doi.org/10.2139/ssrn.7727001", "authors": "Guoming Lai", "venue": "SSRN", "date": "2026-11-23", "apa": "Lai, G. (2026). Generation Pricing and Creator Incentives on AI Video Platforms. https://doi.org/10.2139/ssrn.7727001", "why": "AI動画の場は、生成そのもので利益を取るか、完成した動画の広告で支えるかを決める必要がある。トークン価格・クリエイターへの広告分配・計算資源を選ぶモデルで、品質を上げるのに要するトークンの増え方が閾値を決め、条件によっては生成を赤字で提供するのが最適になることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "AIで動画を作る場が、生成の料金と、完成した動画の広告収入の分け方をどう決めるべきかを理論モデルで示した。", "p3": "場がトークンの価格、クリエイターへの広告の分配、計算能力を選び、クリエイターが参加・完成させる本数・品質を選ぶモデルを分析した。動画を良くするには有料の試行を重ねる必要があるため、トークンの価格が本数と品質の両方を左右する（抄録）。", "p5": "品質を上げるのに必要なトークンが比例より速く増えるか遅く増えるかという技術的な閾値が最適な契約を決める。閾値より下ではトークンの価格は計算の限界費用を上回り、上では逆になる。場は生成を赤字で提供し、広告収入でまかなうのが最適な場合がある（抄録）。", "fun": "AIに動画を作らせるサービスは、1回作るごとに料金を取るべきか、それとも安くして、できた動画の広告で稼ぐべきか。この研究は、良い動画にするためにやり直しがどれだけ必要かで答えが変わることを数式で示した。生成が安くなっても、作り手の参加の動機が強まるとは限らないという指摘も、直感に反していて面白い。", "unverified": "理論モデルの研究で、実際の場のデータでの検証は抄録からは確認できない。査読前の原稿である。"}}, {"id": "pn38", "rank": 38, "field": "経営学", "headline": "調査の参加者プールの働き手は弱い立場に置かれている", "title": "The Other Side of Prolific: Ethical Research Guidelines Based on a Mixed Methods Investigation of Prolific Platform Workers’ Experiences", "url": "https://doi.org/10.31234/osf.io/t5j8w", "authors": "Louis Bachaud ほか", "venue": "PsyArXiv", "date": "2026-11-23", "apa": "Bachaud, L., Murphy, M., & Marie, A. (2026). The Other Side of Prolific: Ethical Research Guidelines Based on a Mixed Methods Investigation of Prolific Platform Workers’ Experiences. https://doi.org/10.31234/osf.io/t5j8w", "why": "研究参加者の募集サイトProlificの働き手について、掲示板の質的分析と455人の調査から労働条件を調べた事前登録の混合研究。働き手どうしの競争、社会的保護の欠如、組織化の難しさにより、研究者に対して不利な力関係にあることを示し、働き手側の不正の証拠も報告して、倫理的な研究の指針を提案する。", "explain": {"basis": "抄録", "basis_note": "PsyArXiv（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "心理学や社会科学の調査に回答して報酬を得る人々（Prolificの働き手）の労働条件を調べ、研究者に対して弱い立場にあることを示して、倫理的な利用の指針を提案した。", "p3": "事前登録した混合研究で、働き手が経験を語り合う掲示板（r/ProlificAC）の質的な分析、労働条件・収入・動機・不正などについての調査（455人）の統計、同じ調査の自由記述の質的な分析を組み合わせた（抄録）。", "p5": "働き手どうしの競争、社会的な保護の欠如、組織化の難しさ、場の設計により、力関係は研究者に有利に傾いていた。アカウントの売買や偽装という二次市場を通じた、働き手側の不正の明確な証拠も初めて示した（抄録）。", "fun": "実験や調査の研究は、ネットで募集した人に答えてもらって行うことが増えている。答える人たちは最もよく研究されている集団の1つなのに、その働き方はほとんど知られていなかった。この研究は調べる側と調べられる側を入れ替え、回答者を労働者として調査した。研究を支える見えない仕事に光を当てた点が面白い。", "unverified": "収入や不正の頻度の具体的な数値は抄録になく未確認。査読前の原稿である。"}}, {"id": "pn39", "rank": 39, "field": "組織行動・心理的安全性", "headline": "初回の資金調達の年に経営陣の新任が12ポイント増える", "title": "Who Joins When Investors Arrive? Team Changes around Every Funding Round", "url": "https://doi.org/10.2139/ssrn.7721318", "authors": "Raffaele Mancuso", "venue": "SSRN", "date": "2026-11-23", "apa": "Mancuso, R. (2026). Who Joins When Investors Arrive? Team Changes around Every Funding Round. https://doi.org/10.2139/ssrn.7721318", "why": "欧州の新興企業25,766社・65,941回の資金調達を会社登記の役員記録と結び、同じ時期に株式調達のない同世代の企業と比べた。初回の株式調達の年に、新しい取締役か経営者を任命する確率は32%から12.2ポイント上がり、他社で経営経験のある幹部の採用も増えた。加わる人の多くは投資家の関係者ではなかった。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "新興企業が投資家から資金を受けるとき、経営陣に誰が加わるかを追い、資金調達の年に経営陣の入れ替えと経験者の採用が増えることを示した。", "p3": "欧州の新興企業25,766社の65,941回の資金調達について、Crunchbaseを各国の会社登記の役員記録と結び、同じ時期に株式の調達をしていない同じ世代の企業と比べた（抄録）。", "p5": "初回の株式調達の年に、新しい取締役か経営者を任命する確率は32%から12.2ポイント上がった。他社で経営経験を積んだ幹部を採る確率は3.3%から2.5ポイント、技術の経験者は1.4%から1.0ポイント上がった。加わる人の多くは投資家の関係者ではなかった（抄録）。", "fun": "ベンチャー企業にお金を出す投資家は、お金だけでなく人も連れてくると言われる。本当だろうか。この研究は欧州の多くの会社の役員の記録を追い、資金が入る年に経営陣の顔ぶれが変わりやすいことを確かめた。ただし加わる人の多くは投資家の身内ではなかった。投資家は人を送り込むというより、人が集まるきっかけになっているらしい。", "unverified": "採用の増加が業績にどう影響したかは抄録からは分からない。査読前の原稿である。"}}, {"id": "pn40", "rank": 40, "field": "組織行動・心理的安全性", "headline": "所属感には「条件つき」と「信頼できる」の2種類がある", "title": "From Contingent to Trustworthy Belonging: A Neurobiological Account of Professional Identity Formation", "url": "https://doi.org/10.35542/osf.io/qjh7m", "authors": "Kevin McMains", "venue": "EdArXiv", "date": "2026-11-23", "apa": "McMains, K. (2026). From Contingent to Trustworthy Belonging: A Neurobiological Account of Professional Identity Formation. https://doi.org/10.35542/osf.io/qjh7m", "why": "医師の職業的アイデンティティの形成で、所属感を1つの量として扱ってきた従来の見方に対し、成果で稼ぎ続けなければならない「条件つきの所属」と、当てにできる「信頼できる所属」を区別する理論的な論考。愛着の神経科学などをもとに、両者は脅威の処理と調整の負担が違うと論じる。", "explain": {"basis": "抄録", "basis_note": "EdArXiv（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "職業人としての自分を形づくるうえで大切な所属感には、成果を出し続けないと失われる「条件つきの所属」と、当てにできる「信頼できる所属」の2種類があるという見方を示した。", "p3": "医学教育を念頭に、愛着の神経科学、条件つきの自尊心、社会的ベースライン理論、感情調整の研究をもとに、2つの所属が脅威の処理と調整の負担でどう違うかを論じた理論的な論考である（抄録）。", "p5": "条件つきの所属は「アイデンティティの警戒」と呼ぶ絶え間ない自己監視を続けさせ、信頼できる所属は「アイデンティティの安心」と呼ぶ落ち着いた状態を許す。同じ環境にいても所属の感じ方が違う理由を説明し、指導者が文化を形づくるための見方を提供する（抄録）。", "fun": "部活で「結果を出せなくなったら居場所がなくなる」と感じている人と、「調子が悪くても仲間でいられる」と感じている人では、同じチームにいても心の疲れ方が違う。この論考は、医師の世界を題材に、所属感を量の多い少ないではなく質の違いとしてとらえ直した。いつも自分を見張っていなければならない所属は、調整の負担が大きいという。", "unverified": "理論的な論考で、2種類の所属を測定して確かめた実証の結果は抄録からは確認できない。査読前の原稿である。"}}, {"id": "pn41", "rank": 41, "field": "組織行動・心理的安全性", "headline": "技術・管理・対話の適合でリーダー候補を順位づけ", "title": "Leader Finding: A New Variation of Expert Finding in Community Question Answering", "url": "https://arxiv.org/abs/2611.26921", "authors": "Sepideh Entezari Maleki ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Maleki, S. E., & Neshati, M. (2026). Leader Finding: A New Variation of Expert Finding in Community Question Answering (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26921", "why": "専門家探索を拡張し、プロジェクトとチームを与えるとリーダー候補の順位を返す問題を定式化した。技術的な適合、管理の知識、チームとの対話を確率的な枠組みで組み合わせ、Stack Overflowから作った2つの大きなデータで、最良の構成は最強のベースラインのNDCG@10を2倍以上にした。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "あるプロジェクトとチームに合うリーダー候補を順位づけて返す「リーダー探索」という新しい問題を定義し、解く方法を示した。", "p3": "話題の専門知識で人を順位づける専門家探索を拡張し、入力をプロジェクトとチーム、出力をリーダー候補の順位とした。技術的な適合、管理の知識、チームとの意思疎通を確率的な枠組みで組み合わせ、それぞれに評価指標を提案した（抄録）。", "p5": "Stack Overflowから作った2つの大きなデータで、最良の構成は最も強い基準のNDCG@10を2倍以上にした。リーダーの順位づけは、話題の専門知識だけでは捉えられない複数の資質のつり合いが要ることを示す（抄録）。", "fun": "「一番詳しい人」と「リーダーに向いている人」は同じとは限らない。この研究は質問サイトの記録から、技術に詳しいこと、人をまとめる知識があること、チームの人たちと話が通じることの3つを数値にして、リーダー候補を選ぶ仕組みを作った。面白いのは、資格が過剰な人は適任としない点で、役割に合うかどうかを重視している。", "unverified": "適合度の計算の詳細と、順位づけが実際のリーダーの成果と合うかは抄録からは確認できない。"}}, {"id": "pn42", "rank": 42, "field": "因果推論", "headline": "街灯のLED化は睡眠の困難をすぐに減らす", "title": "Light Pollution: Effects on Sleep, Work, and Mental Health", "url": "https://doi.org/10.3386/w36060", "authors": "Joan Costa-i-Font ほか", "venue": "NBER Working Paper", "apa": "Costa-i-Font, J., Currie, J., & Saberian, S. (2026). Light Pollution: Effects on Sleep, Work, and Mental Health (NBER Working Paper No. 36060). National Bureau of Economic Research. https://www.nber.org/papers/w36060", "why": "カナダのバーナビー市でナトリウム灯をLEDに替えたことを使い、替えなかったバンクーバーとの市境での不連続、市内の段階的な導入、対応させた地区の差の差法の3つの設計で効果を推定した。睡眠の困難はすぐに減り、精神的健康・欠勤・身体活動の改善は2〜3年遅れて現れ、暖色のLEDで効果が最大だった。", "explain": {"basis": "抄録", "basis_note": "NBERに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "街灯を従来のナトリウム灯からLEDに替えると、住民の睡眠の困難がすぐに減り、数年遅れて心の健康や欠勤も改善することを示した。", "p3": "カナダのブリティッシュコロンビア州バーナビー市の街灯の交換を利用し、カナダ地域保健調査のデータで、交換しなかったバンクーバーとの市境での不連続、市内の地区ごとの導入の時期の違い、対応させた地区どうしの差の差法の3つの設計で推定した（抄録）。", "p5": "交換は睡眠の困難をすぐに減らし、心の健康、欠勤、身体活動の改善は2〜3年遅れて現れた。効果が最も大きかったのは、自然光に近い暖色のLEDだった（抄録）。", "fun": "夜の街灯の種類が、近くに住む人の眠りに影響するかもしれない。それを確かめるのは難しいが、この研究は、となり合う2つの市の片方だけが街灯を取り替えたという状況を利用した。境目の両側の住民を比べると、取り替えた側で眠りの悩みが減っていた。道路の設備が健康に関わるという発見は身近で面白い。", "unverified": "効果の大きさを示す数値は抄録になく未確認。"}}, {"id": "pn43", "rank": 43, "field": "工学", "headline": "剛性と感度を同時に予測し位相最適化を高速化", "title": "Physically Constrained Problem-Independent Machine Learning (PIML) for Joint Prediction of Condensed Stiffness and Compliance Sensitivities in Topology Optimization", "url": "https://doi.org/10.20944/preprints202611.2091.v1", "authors": "Lijie Liu ほか", "venue": "Preprints.org", "date": "2026-11-23", "apa": "Liu, L., Guo, Y., Hu, Q., Zuo, H., Li, X., Zhang, Y., Tang, S., & Guo, X. (2026). Physically Constrained Problem-Independent Machine Learning (PIML) for Joint Prediction of Condensed Stiffness and Compliance Sensitivities in Topology Optimization. https://doi.org/10.20944/preprints202611.2091.v1", "why": "部分構造の縮約剛性を機械学習で予測するだけでは、コンプライアンスの更新に必要な単調な感度が保証されない。剛性と要素感度を同時に予測し、非負のエネルギー配分で両者を結ぶ方法を提案した。100万要素超の2次元の4例で最大10.57倍の高速化を得て、最終コンプライアンスの差は0.56%未満だった。3次元の2例では192〜261倍で、差は4.61〜6.76%だった。", "explain": {"basis": "抄録", "basis_note": "Preprints.org（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "構造の形を最適化する計算（位相最適化）で、部分構造の剛性と、設計を更新するための感度を機械学習で同時に予測し、計算を大幅に速くした。", "p3": "剛性を正確に予測できても、材料について単調な感度は保証されない。そこで縮約した剛性と要素ごとの感度を同時に予測し、非負のエネルギー配分で両者を結びつけた。学習には局所的な材料の分布と変形の標本を使うので、形や支持、荷重が変わっても再利用できる（抄録）。", "p5": "要素数が百万を超える2次元の4つの例で、細かい格子の有限要素法に対して最大10.57倍の高速化を得て、最終コンプライアンスの差は0.56%未満だった。細かい格子の参照がある3次元の2つの例では192〜261倍で、差は4.61〜6.76%だった（抄録）。", "fun": "部材や部品を、できるだけ少ない材料で丈夫にする形をコンピュータに考えさせる計算は、とても時間がかかる。この研究は、小さな区画の硬さをAIにあらかじめ覚えさせておき、全体の計算ではそれを使い回す。メモリ32 GBのノートパソコンで、62.41 millionの計算格子を持つ穴あき板を40.44分で最適化できたというから、大型計算機なしでも精密な設計に手が届く。", "unverified": "3次元では差が4.61〜6.76%と2次元より大きい点の原因は抄録からは分からない。査読前の原稿である。"}}, {"id": "pn44", "rank": 44, "field": "工学", "headline": "観測が足りない条件で浮上式車両の電磁石の異常を特定", "title": "A Study on Time-Varying Gain Inversion and Fault Detection Methods for Suspension Electromagnets in Maglev Trains under Under-determined Observation Conditions", "url": "https://doi.org/10.21203/rs.3.rs-11647133/v1", "authors": "Haining Liu ほか", "venue": "Research Square (In Review)", "date": "2026-11-23", "apa": "Liu, H., Liu, C., & Han, Z. (2026). A Study on Time-Varying Gain Inversion and Fault Detection Methods for Suspension Electromagnets in Maglev Trains under Under-determined Observation Conditions. https://doi.org/10.21203/rs.3.rs-11647133/v1", "why": "磁気浮上車両の浮上系で、パワーアンプのゲイン異常を、雑音が多く観測が不足する多チャンネルの条件で見つける方法。電磁力の単調性を課した疎な記号回帰、スチューデントのt尤度による頑健なベイズ逆解析、低ランクと疎の分解を組み合わせ、16チャンネルの模擬でF1スコア0.922、偽陽性率1.46%を得た。", "explain": {"basis": "抄録", "basis_note": "Research Square（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "磁気浮上列車の浮上用の電磁石で、増幅器のゲインの異常を、雑音が多く観測が足りない条件でも見つける方法を作った。", "p3": "電磁力の単調性の制約を入れた疎な記号回帰で力のモデルを作り、車体と浮上フレームの2自由度モデルで電磁力を再構成する。ゲインの推定には外れ値に強いスチューデントのt尤度を使い、低ランクと疎の分解などで全体のゲインのずれと個別のチャンネルの故障を分ける（抄録）。", "p5": "16チャンネルの模擬で、F1スコア0.922、偽陽性率1.46%を得た。外れ値の割合が15%のとき、ゲインの推定の平均絶対誤差は0.007だった。検出の遅れの平均は1.47秒で、標準的な頑健主成分分析より約72.2%、カルマンフィルタより約87.6%短い（抄録）。", "fun": "磁石の力で車体を浮かせる列車は、電磁石の力を細かく調整して浮き続ける。その調整に使う増幅器が少しずつ狂っても、観測できる情報が足りなければ、どこが悪いのか分からない。この研究は、電磁力の単調性という物理の決まりを手がかりに加えることで、足りない情報を補い、故障を素早く見つけた。", "unverified": "検証は模擬だけで、実際の車両のデータでの確認は抄録からは確認できない。査読前の原稿である。"}}, {"id": "pn45", "rank": 45, "field": "工学", "headline": "舗装試験の土圧計が応力を低く示す原因を有限要素で検討", "title": "Why Do Embedded Earth Pressure Cells Under-Register Subgrade Stresses in Accelerated Pavement Tests? A Finite Element Study of Cell–Soil–Box Interaction at the ALT-LIRA Facility", "url": "https://doi.org/10.20944/preprints202611.1966.v1", "authors": "Silviu-Cristian Iriciuc ほか", "venue": "Preprints.org", "date": "2026-11-23", "apa": "Iriciuc, S.-C., Gimiga, G.-R., Dima, D.-N., Colț, O.-E., Boacă, G., Romila, C., Ungureanu, D., Onuțu, C., Scutaru, M.-C., & Țurcanu, F. E. (2026). Why Do Embedded Earth Pressure Cells Under-Register Subgrade Stresses in Accelerated Pavement Tests? A Finite Element Study of Cell–Soil–Box Interaction at the ALT-LIRA Facility. https://doi.org/10.20944/preprints202611.1966.v1", "why": "円形の促進舗装試験施設で、路床の土圧計が計算値の10〜65%しか示さなかった原因を、土圧計・鋼製の箱・周囲の土の相互作用の軸対称有限要素モデル（489ケース）で調べた。硬い土圧計はむしろ高めに出るため、低い読みは柔らかい土圧計、箱の周りの緩い埋め戻し、受圧面の前の軟らかい層がある場合に限って再現された。", "explain": {"basis": "抄録", "basis_note": "Preprints.org（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "舗装の試験施設で、地中に埋めた土圧計が計算値よりずっと小さい値しか示さなかった原因を、土圧計・取りつけ用の箱・周りの土の相互作用の計算で調べた。", "p3": "円形の促進舗装試験施設で、57.5 kNの複輪のもとで土圧計は5〜10 kPaを示し、検証済みの有限要素モデルが計算した鉛直応力の10〜65%だった。軸対称の有限要素モデル（489回の計算）で、記録された応力と本来の応力の比Rを求めた（抄録）。", "p5": "硬い土圧計は、単独でも鋼の箱に入れても、むしろ高めに記録した（R = 0.9〜1.2）。Rが0.10〜0.65に下がるのは、柔らかい土圧計、箱の周りと下の非常に柔らかい埋め戻し、受圧面の前の20〜80 mmの柔らかい層がある場合だけだった。読み値は計算した路床の応力の検証には使えない（抄録）。", "fun": "道路の下の土にどれだけ力がかかっているかを知るには、土の中に圧力計を埋める。ところが測った値は計算の10〜65%しかなかった。計算が間違っているのか、それとも圧力計の埋め方に原因があるのか。この研究は埋め方に注目し、圧力計のまわりや前の土が柔らかいと読みが小さくなることを計算で示した。測る行為そのものが結果を変える例だ。", "unverified": "施設での設置の記録は一部しか残っておらず、形と硬さは全て仮定だと著者が断っている。査読前の原稿である。"}}, {"id": "pn46", "rank": 46, "field": "政治学", "headline": "新聞がAIを遮断すると有権者には党派の文章が届く", "title": "When Newspapers Block AI, Who Speaks to Voters? A Game-Theoretic Model of a Business Standoff with Political Externalities", "url": "https://econpapers.repec.org/RePEc:osf:socarx:8m6he_v1", "authors": "Miyazaki, Sho", "venue": "RePEc NEP", "date": "2026-11-23", "why": "大手新聞がAIのクローラーを遮断し、政党や党派的なサイトが文章を開放している状況をゲーム理論で分析した。情報源を選別できないAIは読める文章を混ぜ合わせ、説得者は安い文章を大量に流す。新聞の遮断が長いほどその読者は偏った回答を長く聞くことになり、政治的な意図のない事業上の判断がAIの回答の傾きを決めることを示す。", "explain": {"basis": "抄録", "basis_note": "RePEc（NEP）に登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "大手の新聞がAIによる記事の読み取りを遮断し、政党などが文章を開放している状況で、AIに尋ねる有権者が何を聞くことになるかを理論モデルで示した。", "p3": "情報源の質を見分けられないAIは読める文章を混ぜ合わせ、2者の説得者はほぼ無料の文章をどれだけ公開するかを選び、AIの開発企業は失われた収入を補う形で新聞の報道の使用許諾を得ることができる、というゲーム理論のモデルを作った（抄録）。", "p5": "説得者はAIに文章を大量に流し込む。開発企業が各新聞の許諾を得るのは、その新聞に最も近い有権者の一定の割合がAIに尋ねるようになったときである。有権者がAIの回答を嫌う度合いが大きい新聞ほど長く遮断を続け、その読者は流し込まれた文章を長く聞くことになる（抄録）。", "fun": "新聞社は、AIの会社に記事を読まれることを拒む。一方で政党や党派的なサイトは、文章を開放している。するとAIに質問した人には、開放された文章を材料にした答えが返ってくる。新聞にもAIの会社にも政治的な意図はないのに、事業上の判断の行方が有権者の聞く内容を左右してしまうという指摘が鋭い。", "unverified": "理論モデルの研究で、実際のデータでの検証は抄録からは確認できない。"}}, {"id": "pn47", "rank": 47, "field": "政治学", "headline": "固定資産税の不服申立てに党派の差はほとんどない", "title": "Are Republicans and Democrats Different Taxpayers? Evidence From Property Tax Appeals", "url": "https://doi.org/10.3386/w36055", "authors": "Brad C. Nathan ほか", "venue": "NBER Working Paper", "apa": "Nathan, B. C., Perez-Truglia, R., & Zentner, A. (2026). Are Republicans and Democrats Different Taxpayers? Evidence From Property Tax Appeals (NBER Working Paper No. 36055). National Bureau of Economic Research. https://www.nber.org/papers/w36055", "why": "米国人は共和党支持の住宅所有者のほうが固定資産税の不服申立てをしやすいと考えているが、ダラス郡の課税記録と投票記録を結ぶと、申立て率の党派差は0.29ポイントと小さかった。準実験と現場実験でも申立ての動機は似ており、税政策への意見の違いは納税者としての行動の違いに表れていない。", "explain": {"basis": "抄録", "basis_note": "NBERに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "税についての意見が大きく違う共和党支持者と民主党支持者も、固定資産税の不服申立てという実際の行動ではほとんど変わらないことを示した。", "p3": "まず調査で人々の思い込みを測り、次にダラス郡の固定資産税の行政記録を投票記録と結んで申立ての割合を比べた。さらに準実験と現場実験で、申立ての動機を調べた（抄録）。", "p5": "米国人は平均して、同じ価値の家なら共和党支持の所有者のほうが申し立てやすいと考えていた。実際の党派の差は0.29ポイントと小さく、比較に使った人口学的な差に比べても小さかった。申立ての理由も両者でおおむね似ていた（抄録）。", "fun": "税の政策について意見が大きく違う人たちは、自分の税金を減らす手続きへの熱心さも違うだろうと思いがちだ。米国の調査でも、多くの人がそう信じていた。ところが役所の記録と投票の記録を突き合わせると、支持政党による違いはほとんどなかった。意見の違いと行動の違いは別物で、世間の思い込みは当てにならないことが分かる。", "unverified": "準実験と現場実験の具体的な設計と数値は抄録になく未確認。"}}, {"id": "pn48", "rank": 48, "field": "ヒューマンコンピュータインタラクション", "headline": "会話中の表情と声を気づかれずに変える実験基盤", "title": "Covert control over the real-time dynamics of human interactions with Ducksoup", "url": "https://doi.org/10.31234/osf.io/5jbs2", "authors": "Pablo Arias Sarah ほか", "venue": "PsyArXiv", "date": "2026-11-23", "apa": "Sarah, P. A., Denis, G., schyns, P., Jack, R., Johansson, P., Hall, L., & Aucouturier, J.-J. (2026). Covert control over the real-time dynamics of human interactions with Ducksoup. https://doi.org/10.31234/osf.io/5jbs2", "why": "ビデオ会議の参加者の顔と声を会話の途中でAIのフィルターで実時間に変換し、同期した記録から多モーダルの時系列を取り出せる研究用の基盤Ducksoupを紹介する。事前登録した実験（64人）で、参加者の笑顔を人工的に揃えると互いの楽しさが増し、操作は気づかれなかったという実験室の知見をオンラインで再現した。", "explain": {"basis": "抄録", "basis_note": "PsyArXiv（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "ビデオ通話で会話している人の表情や声を、本人たちに気づかれないようにその場で変えられる研究用の仕組みを作り、表情が会話に与える影響を実験で確かめられるようにした。", "p3": "研究用のビデオ会議の基盤Ducksoupは、会話の途中で参加者の顔と声をAIの変換フィルターで実時間に変え、同期した記録から多モーダルの時系列を取り出す。事前登録した実験（参加者64人）で実験室の知見の再現を試みた（抄録）。", "p5": "参加者の笑顔を人工的にそろえると互いの楽しさが増し、操作は気づかれなかった。参加者の自発的な表情、声、言葉にも跳ね返りの効果が見られた（抄録）。", "fun": "相手が笑うとこちらも笑い、会話が楽しくなる。でも笑顔が先か楽しさが先かは、自然な会話を眺めているだけでは分からない。この研究は、ビデオ通話の映像を気づかれないように加工して、2人の笑顔をそろえた。すると互いの楽しさが増した。原因と結果を分けるために、会話そのものを実験装置にした発想が面白い。", "unverified": "楽しさの増加の大きさを示す数値は抄録になく未確認。参加者に気づかれない操作の倫理的な手続きも抄録からは分からない。査読前の原稿である。"}}, {"id": "pn49", "rank": 49, "field": "ヒューマンコンピュータインタラクション", "headline": "教師は外部の基準で確かめられる作業だけAIに任せる", "title": "Standard-Anchored Delegation in Teachers' Use of Generative AI", "url": "https://arxiv.org/abs/2611.27533", "authors": "Muhammad Saleh Farooq ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Farooq, M. S., Khan, M. A., & Raza, M. J. (2026). Standard-Anchored Delegation in Teachers' Use of Generative AI (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27533", "why": "パキスタン・パンジャブ州の教師13人らへの面接から、授業計画の下書きはAIに任せても学習目標の作成は誰も任せず、採点を任せるにはルーブリックを条件とするという型を見いだした。教科書や採点基準のようにモデルの外にある基準で結果を確かめられる部分だけを委ねる「基準に結びつけた委任」と名づけた。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "生成AIを使う教師が、仕事のどの部分をAIに任せ、どの部分を任せないかを調べ、外部の基準で結果を確かめられる部分だけを任せるという型を見いだした。", "p3": "パキスタンのパンジャブ州で、公立・私立・NGO・職業教育の機関の教師13人、管理者4人、生徒1人に面接し、12の教育の作業について各教師の立場を符号化した（抄録）。", "p5": "9人が授業計画でAIの下書きか大きな支援を受け入れたが、AIが下書きした学習目標を受け入れた教師はおらず、11人は生徒を励ます場面でAIを使わなかった。AIの採点を受け入れる教師は、採点基準をモデルに与えることを条件とした（抄録）。", "fun": "先生はAIに何を任せ、何を任せないのか。この研究によると、線を引く基準は「正解を決める物差しが、AIの外にあるかどうか」だった。教科書や採点基準があれば、AIの出した結果を先生が確かめられるので任せられる。でも生徒を励ます言葉や学習目標は任せなかった。任せるとは、あとで確かめられることだという考え方が面白い。", "unverified": "面接の対象は少人数で、1つの州の結果である。"}}, {"id": "pn50", "rank": 50, "field": "ヒューマンコンピュータインタラクション", "headline": "心の支援AIの振る舞いを8つの役割状態で分類", "title": "AROMA: Understanding AI Support For Mental Well-being through Role Theory", "url": "https://arxiv.org/abs/2611.26843", "authors": "Issac Ting ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Ting, I., Pan, E., Saha, K., Shen, H., Chow, K., & Swain, V. D. (2026). AROMA: Understanding AI Support For Mental Well-being through Role Theory (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26843", "why": "心の健康を支えるAIが期待された役割を越えて振る舞うと、関係上の害が生じる。13のデータセットの7,515件超の会話を理論に基づいて注釈し、観察された振る舞いから8つの「役割状態」の分類（AROMA）を作った。役割状態は支援の文脈で変わり、AIと人で構造と時間的な特徴が違うことを示した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "心の支えになることを目的としたAIの振る舞いを、役割という観点から分類する枠組みAROMAを作り、AIが期待された役割を外れるときに何が起きているかを説明できるようにした。", "p3": "13のデータセットの7,515件を超える会話に、理論に基づいて注釈を付け、あらかじめ決めた役割ではなく観察された振る舞いから8つの「役割状態」を定めた（抄録）。", "p5": "役割状態は支援の文脈によって変わり、AIの支援者は人間の支援者と比べて構造と時間の面で独自の特徴を示した。この分類は、役割をよりよく合わせるための新しい指示の出し方にもつながった（抄録）。", "fun": "悩みを聞いてくれるAIが、期待された役目を越えたふるまいを始めると、頼る側との関係に害が生じることがある。この研究は、AIの発言を「いまどんな役を演じているか」という目で分類した。役割を名づけることで、狭い課題での出来ばえではなく、役をはみ出していないかを点検できるようになるのが面白い。", "unverified": "8つの役割状態の名前と、AIと人の違いの具体的な内容は抄録になく未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "独立した健全データでは実橋の損傷検知が偶然並みに", "title": "Independent‐Baseline Collapse in Full‐Scale Bridge Damage Detection: A Leakage‐Resistant Multimodal Graph Benchmark", "url": "https://doi.org/10.1155/stc/7325180", "authors": "Amr Munshi ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-11-23", "sjr": 1.147, "citescore": 10.3, "citescore_year": "2025", "apa": "Munshi, A., Arif, S., Bashar, A., Ayouni, S., Marzougui, M., & Iqbal, A. (2026). Independent‐Baseline Collapse in Full‐Scale Bridge Damage Detection: A Leakage‐Resistant Multimodal Graph Benchmark. Structural Control and Health Monitoring, 2026(1). https://doi.org/10.1155/stc/7325180", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "実物大の橋の損傷検知で、損傷を与える前の健全な状態だけで学習したモデルは、損傷の計画のあとに別の機会に測った健全な状態と、損傷状態とを区別できないことを、公開データの厳密な評価で示した（抄録）。", "p2": "実物大の橋のベンチマークは、少数の計測の機会（キャンペーン）から切り出した多数の解析窓からなる。それを無作為に分割して評価すると、損傷ではなく、どの機会の計測かを見分けるだけで高い成績が出てしまう（抄録）。", "p3": "公開のHell Bridge Test Arenaの記録を、加振機の5つの配置、加速度75チャンネル、ひずみ15チャンネルにわたる、10.24秒の窓800個に組み直す。周波数応答の大きさ、コヒーレンス、加振に対する応答のエネルギー、尖度を、構造の形を反映したグラフの上に表し、マスクつきグラフ自己符号化器（5つの乱数種）とPCAによる再構成を、健全状態の60個の窓に当てはめる（抄録）。", "p4": "あとの時期の健全状態20個の窓で較正し、最終の試験の集合（損傷の計画のあとの独立した健全状態80個と、8つの修復された損傷状態640個）で1回だけ評価する。指標はROC-AUC、均衡正解率、マシューズ相関係数、警報率である（抄録）。", "p5": "グラフの集合モデルはROC-AUC 0.514（95%ブートストラップ信頼区間0.448〜0.578）、均衡正解率0.520、マシューズ相関係数0.028で、PCAも0.533（0.466〜0.598）と、偶然の水準と区別できなかった。損傷状態の警報率22.5%〜27.5%は、独立した健全状態の誤警報率21.3%と重なった（抄録）。", "p6": "配置ごとの尺度の調整、計測の種類の切り分け、雑音の付加、節点の欠落を試しても分離は戻らなかった（抄録）。1つの橋・1つの公開データの結果で、モデルの詳細や環境条件の扱いは抄録からは分からない（未確認）。解釈：健全状態どうしの基準のずれが、損傷の信号を覆い隠していることを示唆する。", "fun": "橋が傷んでいるかどうかを振動の測定からAIに判定させる研究では、高い正解率が報告されることがある。でもそれは、同じ機会に測ったデータを学習用と試験用に分けているせいかもしれない。この研究は、別の機会に測った健全な橋のデータを試験に入れた。するとAIは、健全な橋と損傷のある橋をほとんど見分けられず、偶然と変わらなかった。試験の作り方しだいで結論が変わるという教訓だ。", "unverified": "本文は入手できず、モデルの構造、損傷の内容、追加の分析の数値は未確認。"}}, {"id": "jr02", "rank": 2, "headline": "主桁ごとに固有振動数が違う橋を常時微動で検出", "title": "Ambient Vibration Testing of Bridges with Peculiar Dynamic Characteristics: Transverse Deformation of Cross-Sections", "url": "https://doi.org/10.3390/s26237362", "authors": "Ilenia Rosati ほか", "venue": "Sensors", "date": "2026-11-23", "sjr": 0.802, "citescore": 9.4, "citescore_year": "2025", "apa": "Rosati, I., Borlenghi, P., Rainieri, C., & Gentile, C. (2026). Ambient Vibration Testing of Bridges with Peculiar Dynamic Characteristics: Transverse Deformation of Cross-Sections. Sensors, 26(23), 7362. https://doi.org/10.3390/s26237362", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "複数の主桁を持つ橋で、主桁どうしをつなぐ横方向の部材の剛性が足りないと、同じ径間の主桁ごとに振動数が違って現れることを、動的な試験と稼働時モード解析（OMA）で捉えられることを2つの実橋で示した（抄録）。", "p2": "隔壁、対傾構、横桁といった横方向の連結部材の剛性が不足すると、荷重のもとで橋の断面の形が橋軸に直角な方向に変わり、静的・動的な応答に影響しうる。この状態は目視点検では見つけられず、解析か実験の道具が要る（抄録）。", "p3": "稼働中の振動から動的な特性を同定するOMAを使い、断面の横方向の変形の動的な影響が、振動の特性の特異な点として現れるかを調べる（抄録。計測と同定の方法の詳細は未確認）。", "p4": "対象は供用中の高速道路の橋2つで、鋼床版を持つ連続の鋼高架橋と、鉄筋コンクリートの多主桁橋である。同じ径間に属する主桁ごとの振動数を比べる（抄録）。", "p5": "動的な試験の結果、同じ径間の異なる主桁の振動数に、程度の差はあるが予想外の違いが見られた。著者は、主桁どうしの横方向の連結の変形しやすさによるものと考えられるとしている（抄録）。振動数の差の数値は抄録にない（未確認）。", "p6": "原因を横方向の連結の変形性とする点は、抄録では「考えられる」という表現にとどまり、数値モデルによる裏づけの有無は分からない（未確認）。2橋の事例であり、どの程度の剛性不足で差が現れるかの一般的な基準は示されていない。", "fun": "何本もの桁が横につながった橋で、桁どうしをつなぐ部材が弱いと、同じ区間の桁なのに1本ずつ少し違う振動数で揺れるようになる。この研究は、実際の高速道路の橋2つの揺れを測って、その違いを見つけた。目で見る点検では分からない橋のつながり具合が、桁ごとの揺れ方の違いとして表に出てくるのが面白い。", "unverified": "本文は入手できず、計測の配置、同定した振動数とモード形、数値解析の有無は未確認。"}}, {"id": "jr03", "rank": 3, "headline": "合成梁の固有振動数は16年で4〜14%低下", "title": "Time-Dependent Changes in Dynamic Characteristics of Steel–Concrete Composite Beams: Modal Analysis and 3D Numerical Modelling", "url": "https://doi.org/10.3390/ma19224931", "authors": "Małgorzata Abramowicz ほか", "venue": "Materials", "date": "2026-11-23", "sjr": 0.617, "citescore": 7.0, "citescore_year": "2025", "apa": "Abramowicz, M., Szewczyk, P., Pełka-Sawenko, A., & Wróblewski, T. (2026). Time-Dependent Changes in Dynamic Characteristics of Steel–Concrete Composite Beams: Modal Analysis and 3D Numerical Modelling. Materials, 19(22), 4931. https://doi.org/10.3390/ma19224931", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "荷重をかけずに実験室で保管した鋼とコンクリートの合成梁でも、年月とともに固有振動数が下がっていくことを、2005年、2012年、2021年の3回の計測で示し、その変化を再現する数値モデルを作った（抄録）。", "p2": "抄録は、合成梁のモード特性の長期の変化についての基準となるデータを提供するとしている。解釈：荷重がなくても特性が変わるなら、振動による健全性の評価では、その変化を見込んでおく必要がある。", "p3": "ずれ止めの方式が違う3体の合成梁（全数のスタッド、部分的なスタッド、孔あき鋼板のずれ止め）を対象に、実験モード解析で固有振動数とモード形を求める。計測の時点ごとにAbaqus/CAEで3次元の有限要素モデルを作り、全体の剛性の変化を表すスカラーの有効剛性低下係数dをモデル更新のパラメータとして導入した。コンクリートには直交異方性の材料モデルを使った（抄録）。", "p4": "統制された実験室の条件で、力学的な荷重をかけずに保管し、2005年、2012年、2021年に動的な計測を行った。計算と実験のモード形の一致はモード信頼性基準（MAC）で評価する（抄録）。", "p5": "固有振動数は一貫して下がり、曲げモードで4〜11%、ねじりモードで3〜8%、軸方向モードで10〜14%の低下だった。計算した動的な特性は実験とよく合い、MACは0.70〜1.00だった（抄録）。", "p6": "著者の限界：実験室の3体だけの結果で、剛性低下係数は直接測った損傷の指標ではなく、現象を再現するためのモデル更新のパラメータと解釈すべきである。供用荷重・疲労・環境の作用を受ける実際の橋や床にそのまま外挿してはならない（抄録）。", "fun": "荷重をかけずに置いておくだけの梁でも、年月のうちに揺れ方が変わる。この研究は、同じ3本の梁の揺れを2005年、2012年、2021年に測り、揺れの速さ（固有振動数）が最大で14%下がっていたことを確かめた。荷物を載せたわけではない。構造物の診断を揺れで行うなら、時間がたつだけで数字が変わりうることを知っておく必要がある。", "unverified": "本文は入手できず、振動数の低下の原因についての著者の考察、梁ごと・モードごとの数値は未確認。"}}, {"id": "jr04", "rank": 4, "headline": "外れ値に強いℓ1誤差で非滑らかな構造の外力を復元", "title": "Outlier-robust dynamic force reconstruction in nonsmooth structural dynamics: A computational generalized-adjoint and primal-dual framework", "url": "https://doi.org/10.1177/10775463261508933", "authors": "Mohamed Hamdaoui", "venue": "Journal of Vibration and Control", "date": "2026-11-21", "sjr": 0.588, "citescore": 6.1, "citescore_year": "2025", "apa": "Hamdaoui, M. (2026). Outlier-robust dynamic force reconstruction in nonsmooth structural dynamics: A computational generalized-adjoint and primal-dual framework. Journal of Vibration and Control. https://doi.org/10.1177/10775463261508933", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "振動の計測から構造にかかった力を逆算するとき、センサーの異常値と、接触などで復元力が切り替わる構造の性質の両方を扱える計算の枠組みを作り、その効果と限界を数値実験で示した（抄録）。", "p2": "振動の計測から得た力の推定値は、センサーの汚染による誤差と、不完全な構造モデルによる誤差を吸収してしまう。この研究はその両方の影響を調べる（抄録）。", "p3": "加速度の当てはめ誤差を絶対値の和（ℓ1）で測り、構造を区分的に滑らかなモデルで表す。一般化ガウス・ニュートン法で力を更新し、各反復の局所的な凸の部分問題を交互方向乗数法で解く。連続時間の随伴の考え方がこの離散の定式化の動機になっているが、大域的な最適性を保証するものではない（抄録）。", "p4": "片側接触、開閉で剛性が切り替わる場合、梁への同時の複数荷重の3つの合成のベンチマークで、力の相対誤差を見る。梁の比較では、取り置いた計測で正則化を選び、新息を刈り込むカルマン平滑化、残差に基づく物理情報ニューラルネット、離散の力学を厳密に課すニューラルの力のモデルと比べた（抄録）。", "p5": "パラメータを固定した非線形のℓ1再構成の力の相対誤差は、3つのベンチマークで0.280、0.054、0.126だった。ニューラルの力のモデルは、3つの雑音の実現のうち2つでより低い誤差を出した。内部の時間刻みを細かくすると、既知の力に対する応答の誤差は1.69×10−3から4.34×10−6に下がった（抄録）。", "p6": "著者の限界：証拠は数値実験だけで、連続で区分線形の復元力に当てはまり、衝撃的な接触や任意の不連続には当てはまらない。応答に基づくパラメータの選択と、計算の予算が限られた最適化の限界も示されている（抄録）。", "fun": "構造物にどんな力がかかったかは、揺れの測定から逆算することがある。ところがセンサーがおかしな値を出すと、力の推定がその誤差まで吸い込んでしまう。この研究は、外れ値に引きずられにくい誤差の測り方を使い、さらに、接触などで性質が切り替わる構造にも対応した。別の方法のほうが良かった場合まで、正直に報告している点も良い。", "unverified": "本文は入手できず、ベンチマークの詳細な設定、計算時間の数値、アルゴリズムの式は未確認。"}}, {"id": "jr05", "rank": 5, "headline": "常時微動だけの学習で地震時の構造応答を再構成", "title": "A Novel Method for Structural Response Reconstruction Under Unknown Loads Based on Gradient-Penalized Wasserstein Generative Adversarial Neural Networks", "url": "https://doi.org/10.3390/buildings16234643", "authors": "Bo Liu ほか", "venue": "Buildings", "date": "2026-11-23", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "apa": "Liu, B., Xu, Q., He, X., Zhang, X., Zhang, X., & Zhang, Y. (2026). A Novel Method for Structural Response Reconstruction Under Unknown Loads Based on Gradient-Penalized Wasserstein Generative Adversarial Neural Networks. Buildings, 16(23), 4643. https://doi.org/10.3390/buildings16234643", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "構造物の応答を再構成するモデルを、雑音を含む常時微動の限られたデータだけで学習し、学習に含まれない地震などの荷重のもとでの応答も再構成できるようにした（抄録）。", "p2": "データ駆動の応答の再構成は、ふつう幅広い荷重条件のデータで学習する必要があるが、実務でまれにしか起きない荷重のデータは得にくい。また計測の雑音が、再構成モデルの安定性と精度を損なう（抄録）。", "p3": "勾配ペナルティつきのワッサースタイン敵対的生成ネットワークを使う。生成器は深い畳み込みネットで応答の内部表現を学ぶ。識別器は多重スケールのネットで、新しい粗視化の手順により異なる時間スケールの特徴を取り出して信号の正確さを評価する。時間周波数の特徴の損失を加え、全体と局所の特徴を捉える（抄録）。", "p4": "数値実験と実験で検証し、CNNと敵対的生成ネットワークのモデルと比べる。学習の標本が少なく計測の雑音を含む条件での、外挿の能力と雑音への頑健性を見る（抄録。対象の構造と評価指標の数値は未確認）。", "p5": "提案の方法は、限られた学習の標本と計測の雑音のもとでも、強い外挿の能力と雑音への頑健性を示した。さらに、センサーごとの応答の再構成誤差から、構造の損傷の程度と位置を効果的に特定できた（抄録）。誤差の数値は抄録にない（未確認）。", "p6": "抄録の範囲では、対象の構造の種類、センサーの数、損傷の種類、どの程度の地震動まで外挿できるかは分からない（未確認）。解釈：常時微動は小さな振幅の応答であり、大きな地震での非線形の応答まで再構成できるかは別に確かめる必要がある。", "fun": "構造物に付けたセンサーのデータから、応答をAIに再現させたい。学習には地震のような荷重のデータが欲しいが、そうしたまれな荷重のデータは集めにくい。この研究は、ふだんの小さな揺れだけで学ばせたAIが、学習していない地震のもとでの応答も再現できることを示した。しかもセンサーごとの再現の誤差が、どこがどれだけ傷んでいるかの手がかりになるという。", "unverified": "本文は入手できず、対象の構造、データの量、誤差の数値、損傷の同定の検証の詳細は未確認。"}}, {"id": "jr06", "rank": 6, "headline": "テイラー級数NNで潜在力学を同定する縮約モデル", "title": "Parametric Non‐Intrusive Reduced Order Modelling via Taylor Series Neural Networks and Dynamic Identification", "url": "https://doi.org/10.1002/nme.70461", "authors": "Xinlei Lin ほか", "venue": "International Journal for Numerical Methods in Engineering", "date": "2026-11-23", "sjr": 0.963, "citescore": 5.5, "citescore_year": "2025", "apa": "Lin, X., Buchan, A. G., Zhang, J., Cheng, S., Liu, E., Wen, H., Xiao, F., Yang, Z., & Xiao, D. (2026). Parametric Non‐Intrusive Reduced Order Modelling via Taylor Series Neural Networks and Dynamic Identification. International Journal for Numerical Methods in Engineering, 127(22). https://doi.org/10.1002/nme.70461", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "出版社サイトは取得できず、公開されている著者版（arXiv）のPDF本文（抄録、3節の概要、結論、図表キャプション）を読んだ。手法の式と結果の表は読んでいない", "preprint": false, "p1": "パラメータで変わる偏微分方程式の解を速く近似する縮約モデルを、自己符号化器を使わずに、低次元の潜在変数の時間発展の式そのものを学習・同定する形で作った（抄録、3節）。", "p2": "潜在空間で力学を同定する方法は自己符号化器に頼ることが多く、符号化と復号が空間の座標に結びつく。従来の潜在力学ネットワーク（LDNet）は、初期値がパラメータで変わる問題を扱えなかった（抄録、3節）。", "p3": "3つのネットワークで構成する。潜在状態の時間微分を計算する力学のネットワーク、値を復元する再構成のネットワーク、初期の潜在状態を作る初期写像のネットワークである。テイラー級数の展開とResNetで表現力を高め、潜在の常微分方程式の係数を同時に同定する。学習していないパラメータでは、逆距離加重のk近傍法で係数を予測する（抄録、3節、結論）。", "p4": "粘性項を持つ2次元のバーガース方程式（一様な格子）と、ロック・エクスチェンジの流れ（非構造の三角形の格子）で、高精度の数値解に対するL2誤差を、自己符号化器に基づく潜在同定の方法（gLaSDI、GPLaSDI）と比べる。格子の粗さを変えた場合も試す（8節、図表キャプション）。", "p5": "提案の方法のL2誤差は一貫して2%未満で、自己符号化器に基づく方法より軽い構造で、より少ない学習時間で、複雑なパラメータの範囲でも良い性能を示したと著者は報告している。粗さの違う格子にも適用できた（結論）。個々の表の数値は読んでいない（未確認）。", "p6": "検証は2つの数値例に限られる。著者による限界の明示は、読んだ範囲では確認できなかった。読んだのは公開されている著者版で、掲載版との違いは未確認。解釈：潜在の次元や展開の次数の選び方が精度を左右すると考えられる。", "fun": "流れの計算は、たくさんの点での値を時間を追って計算するので時間がかかる。この研究は、流れの様子を少数の数字にまとめ、その数字がどんな規則で変化するかの式そのものをAIに見つけさせた。式が分かってしまえば、条件を変えた場合の流れも、重い計算をやり直さずにすばやく予測できる。誤差は2%未満に収まったという。", "unverified": "手法の式の詳細、8節の表と図の数値、計算時間の比較は読んでいない。掲載版の本文は出版社サイトから取得できなかった。"}}, {"id": "jr07", "rank": 7, "headline": "InSAR時系列と数値解析で地すべり面の形を逆解析", "title": "Mechanically Consistent Inversion of Landslide Slip Surface Geometry by Integrating Time‐Series InSAR Observations and Numerical Modeling", "url": "https://doi.org/10.1029/2026jf009327", "authors": "Si‐Qi Zhang ほか", "venue": "Journal of Geophysical Research: Earth Surface", "date": "2026-11-23", "sjr": 1.437, "citescore": 6.6, "citescore_year": "2025", "apa": "Zhang, S.-Q., Liu, L.-L., Zhang, S.-H., Liu, G., & Hu, J. (2026). Mechanically Consistent Inversion of Landslide Slip Surface Geometry by Integrating Time‐Series InSAR Observations and Numerical Modeling. Journal of Geophysical Research: Earth Surface, 131(11). https://doi.org/10.1029/2026jf009327", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "地すべりの地下のすべり面の形を、衛星レーダー（InSAR）による地表の変位の時系列と数値解析を組み合わせて、力学的に矛盾のない形で逆解析する枠組みを作った。観測の軌道が1方向しかない場所でも使える（抄録）。", "p2": "すべり面の形は破壊の仕組みの理解と残存リスクの評価に欠かせないが、地下の情報が乏しい遠隔地では把握が難しい。既存の逆解析は単純化した運動学の仮定に頼るか、複数軌道の完全な変位ベクトルを必要とする（抄録）。", "p3": "すべり面をAkimaスプラインで力学的な界面として表す。有限差分の数値モデルで地表の変位を計算し、InSARの観測との残差が最小になるすべり面の形を、粒子群最適化で反復的に探す（抄録）。", "p4": "段階的な検証を行う。単一の観測方向の場合としてBajiaocun地すべりで単一軌道のレーダーだけを使い、参照の断面との二乗平均平方根誤差（RMSE）を見る。Xishancun地すべりでは上昇・下降の軌道の制約を比べ、ボーリングの記録および質量保存に基づく既存の方法と照合する（抄録）。", "p5": "Bajiaocunでは単一軌道だけで参照の断面に対しRMSE 4.22 mだった。Xishancunでは、方向の感度の違いから下降軌道の制約が上昇軌道の制約より良く、2軌道の逆解析はボーリングの記録に対しRMSE 10.9 mで、質量保存の方法とも高い整合を示した（抄録）。", "p6": "抄録の範囲では、地盤の材料定数の不確かさの扱い、計算時間、解が一意に決まるかどうかは分からない（未確認）。解釈：この精度が実務で十分かは、地すべりの規模による。2つの事例での検証である。", "fun": "斜面が動いているとき、地下のどこに滑る面があるのかは、地下の情報が乏しいと分かりにくい。この研究は、人工衛星のレーダーが測った地表の動きから、その面の形を割り出した。「地下の面がこの形なら、地表はこう動くはずだ」という力学の計算を繰り返し、実際の動きにいちばん合う形を探す。観測の軌道が1つしかない場所でも使えるのが強みだ。", "unverified": "本文は入手できず、数値モデルの設定、最適化の収束、地すべりの規模は未確認。"}}, {"id": "jr08", "rank": 8, "headline": "デジタル化が中途半端な企業ほど不正リスクが高い", "title": "The Digitalization–Fraud Paradox: Asymmetric Effects of Strategic Digital Orientation", "url": "https://doi.org/10.1007/s10551-026-06520-4", "authors": "R. M. Ammar Zahid ほか", "venue": "Journal of Business Ethics", "date": "2026-11-23", "sjr": 3.138, "citescore": 15.9, "citescore_year": "2025", "apa": "Zahid, R. M. A., Shakri, I. H., Ali, H. S., & Hussain, M. J. (2026). The Digitalization–Fraud Paradox: Asymmetric Effects of Strategic Digital Orientation. Journal of Business Ethics. https://doi.org/10.1007/s10551-026-06520-4", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "出版社サイトのHTML本文（データと変数の節、基準の回帰の結果、抄録）を読んだ。媒介・調整・頑健性・識別の節は読んでいない", "preprint": false, "p1": "企業のデジタル化への戦略的な取り組み（戦略的デジタル志向）と企業不正の関係は一方向ではなく、取り組みが低〜中程度の企業で不正のリスクが高く、高い水準では正の関係が弱まるという非対称な形であることを、中国の上場企業で示した（抄録、Baseline Regression）。", "p2": "デジタル化は組織の統治を作り変えているが、企業の不正行為に対する倫理的な含意は十分に分かっていなかった（抄録）。", "p3": "戦略的デジタル志向は、年次報告書の経営者による説明（MD&A）の節を、デジタル技術の範囲・デジタル能力・エコシステムの調整・アーキテクチャの構成の4次元の辞書（148語）による計算機のテキスト分析にかけて測る。不正は、証券規制当局の執行に基づくCSMARの記録から、その年に不正の事象があれば1とする2値の指標にする。志向とその2乗の項を入れた回帰で非線形性を調べる（Variables Description and Measurement、Baseline Regression）。", "p4": "標本は上海・深圳の非金融のA株上場企業の2009〜2022年の34,320社・年。別のデータベース（RESSET）による不正の代替指標、内部統制の質とイノベーションの能力による調整、監査の質・情報の非対称・技術の集約度による媒介も調べる（Data and Sample Distribution、抄録）。", "p5": "完全なモデルで、志向の係数は4.204、2乗の項の係数は−6.481でともに有意だった（表4）。係数から求めた転換点は約0.32で、観測された志向の範囲の中にある。著者は、これは不正を増やす効果が弱まり始める理論上の閾値であり、企業が不正を減らす領域に入った証拠ではないと断っている（Baseline Regression）。内部統制の質とイノベーションの能力は正の関連を弱めた（抄録）。", "p6": "媒介の間接効果は統計的に有意だが経済的には小さい（抄録）。解釈：不正の指標は規制当局が認定した事象に限られ、発覚していない不正は含まれない。著者の限界の節は冒頭しか読んでいない。対象は中国の上場企業である。", "fun": "会社がデジタル化を進めれば、不正はしにくくなる、と考えたくなる。ところがこの研究では、デジタル化への取り組みが低〜中程度の会社で、不正のリスクがむしろ高かった。技術の不透明さや責任の拡散、統治の遅れが弱点になる、という解釈だ。年次報告書の文章から「どれだけデジタル化に力を入れているか」を数値にした方法も面白い。", "unverified": "媒介分析と調整分析の係数、頑健性の確認、準実験による識別の内容、限界の節の全体は読んでいない。"}}, {"id": "jr09", "rank": 9, "headline": "取引不正の順位付けは調整した勾配ブースティングが最良", "title": "Applications of Machine Learning in Transaction Fraud Risk Scoring for Automated Auditing Support Within Management Information Systems", "url": "https://doi.org/10.3390/risks14120274", "authors": "Md Borhan Uddin ほか", "venue": "Risks", "date": "2026-11-23", "sjr": 0.374, "citescore": 4.5, "citescore_year": "2025", "apa": "Uddin, M. B., Hosen, M. A., Ahmed, K. R., Khan, M. M., C, A. K., Hossain, M., & Thakkar, H. (2026). Applications of Machine Learning in Transaction Fraud Risk Scoring for Automated Auditing Support Within Management Information Systems. Risks, 14(12), 274. https://doi.org/10.3390/risks14120274", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "限られた審査の能力のもとで取引を不正リスクの順に並べる課題で、注意機構つきのニューラルネットと勾配ブースティングを融合したモデルよりも、調整した勾配ブースティングのほうが良いことを、公開データでの比較で示した（抄録）。", "p2": "不正による損失は業務上のリスクで、審査の能力が限られるため、取引を不正リスクで順位づける必要がある（抄録）。解釈：複雑な新しいモデルが、調整を同じ条件にしても既存の方法を上回るのかが問われている。", "p3": "評価するFACINは、特徴ごとの注意機構を持つニューラルネットとXGBoostの枝を、取引に応じた重みで融合するモデルである。公開の2つのベンチマークで、事前に固定した設定での比較と、同等の調整と3回の反復での比較を行い、時間順の分割と、凍結したモデルの時間による劣化も調べる（抄録）。", "p4": "データはIEEE-CIS（590,540件の取引、不正3.50%）とULBのクレジットカード（不正492件）。指標はPR-AUCである。データに監査や法令順守の情報はなく、証拠は取引の不正の検知に限られる（抄録）。", "p5": "事前に固定した設定ではFACINのPR-AUCが最高だった（0.714対XGBoostの0.657）。同等に調整すると、LightGBM（0.874±0.002）とXGBoost（0.866±0.002）がFACIN（0.834±0.005）を上回った。時間順の分割ではPR-AUCは0.50〜0.55に落ち、凍結したXGBoostは2か月で約0.09下がり、再学習で回復した（抄録）。", "p6": "著者の限界：結果は不正リスクの優先順位づけについてのもので、監査の質、法令順守、費用、損失への効果は示していない。注意機構と順位づけの損失は測定できる改善をもたらさず、FACINの生の点数は再較正するまで不正の確率を過大に見積もった（抄録）。", "fun": "新しくて複雑なAIは、定番の方法より優れていそうに見える。この研究は、取引の不正を見つける課題で、新しい融合モデルと定番の方法を同じ条件で調整して比べた。すると定番の方法が上回った。さらに、時間の順にデータを分けて試すと、成績が大きく落ちた。試し方を現実に近づけると、華やかな数字はしぼむことが分かる。", "unverified": "本文は入手できず、モデルの構成の詳細、調整の方法、追加の分析は未確認。"}}, {"id": "jr10", "rank": 10, "headline": "サステナ開示は普及とともに具体性が下がった", "title": "What Sustainability Disclosures Disclose", "url": "https://doi.org/10.1111/jels.70048", "authors": "Hajin Kim ほか", "venue": "Journal of Empirical Legal Studies", "date": "2026-11-22",
