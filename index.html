<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

一方、弱い立場の役は、決定に従いながらも異議を記録や約束の形で必ず残しました。会議に司会を置く知恵がAIの議論にも効きそうだ、という点が面白いところです。", "unverified": "各条件1回の試行で、効果の再現性は未確認。コード化した指標は公開資料から再計算できないと著者が記載。"}}, {"id": "pr02", "rank": 2, "headline": "AI予測は調査を置き換えず効率を上げる", "title": "Using AI Predictions to Augment Rather Than Replace Surveys", "url": "https://arxiv.org/abs/2611.06743", "authors": "Lai Wei ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Wei, L., & Zhu, Y. (2026). Using AI Predictions to Augment Rather Than Replace Surveys (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06743", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（手法・データ・結果・考察の節と図表キャプション）を読んだ", "preprint": true, "p1": "LLMや機械学習による回答の予測を調査の代わりではなく補助として使い、予測駆動推論（PPI）で偏りを調査データで補正しながら推定の精度を上げられることを、GSSとNHISの83の結果変数で示した（抄録、§5.1）。", "p2": "LLMによる合成回答者には楽観論と懐疑論があるが、予測は偏りうるので調査の代替にはならない。予測を推定に使うなら、偏りを確率標本で正す仕組みが要る（§1、§6）。", "p3": "PPIは、大規模な補助ファイル（ACS）での予測の平均に、調査標本で測った予測誤差（残差）の平均を足す（式2）。予測が偏っていても目標はずれず、残差の分散が元の分散より小さければ精度が上がる。例えば予測のR²が0.10なら有効標本数は約11%、0.40なら約67%増える（式4、§3.1）。", "p4": "GSS 2022（37の意見系変数）とNHIS 2017（46の健康系変数）を対象に、過去の調査波で学習したSuper Learner、同じ波での交差フィッティング、LLMによる回答者のシミュレーションを比べた。指標は信頼区間幅の縮小と有効標本数（ESS）の増加である（§3.2、§4）。", "p5": "平均の推定で、過去データの学習器はNHISで区間幅5.4%減・ESS 12.2%増、GSSで3.4%減・7.5%増、最良のLLMはESSでNHIS 2.6%増、GSS 2.8%増と小さいが正だった（表2）。主観的健康などではESSが34〜36%増えたが、多くの政治・社会的態度は予測が弱く、回帰係数での利得は小さく不均一だった（図2・3）。主観的健康では、LLMの予測の相関（GPT-5-miniで約0.443）は訓練約1,000件の教師あり学習に近かった（§5.2、図5）。", "p6": "PPIは調査と補助ファイルが同じ母集団を表すことを前提とし、非回答やカバレッジの偏りは補正しない。予測が弱いと残差の分散は減らず、小さな部分集団では補正が不安定になる。補助変数はACSにある人口統計・社会経済の変数に限られる（§6）。", "fun": "AIは人のアンケートの答えをそこそこ当てられますが、そのまま使うと偏りが「精密に」見えてしまう危険があります。この研究は、AIの予測を下書きにして、実際の調査で下書きのずれを測って直す方法を使いました。そうすると偏りを持ち込まずに、調査を少し大きくしたのと同じ精度が得られます。AIを回答者の代わりではなく助手として使う発想が面白いところです。", "unverified": "未査読のarXivプレプリント。回帰係数ごとの利得の個別の値（図2・3）は確認していない。"}}, {"id": "pr03", "rank": 3, "headline": "利害を負わないLLMでは協力の社会実験にならない", "title": "Same Method, Different Task: What the Bitter Lesson Does Not License in Social Simulation", "url": "https://arxiv.org/abs/2611.05717", "authors": "Justin Downes ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Downes, J., Milletich, R., & Hirst, N. (2026). Same Method, Different Task: What the Bitter Lesson Does Not License in Social Simulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05717", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（主張の節と、実験の設計・結果・限界の節）を読んだ", "preprint": true, "p1": "LLMで社会をシミュレーションする研究が頼る「計算で勝つ一般的な方法は専門知識に勝つ」というビター・レッスンは、課題を予測にすり替えている点で根拠にならないと論じ、利害の欠如を540エージェントの予備実験で確かめた（抄録、§1、§4）。", "p2": "テキストの予測器は自分の相互作用の結果を負わないため、協力・裏切り・規範の強制という利害関係者の現象がそもそも生じないと著者は主張し、既報の過剰な協力や集団の均質性もこれで説明できるとする（抄録、§2–3）。", "p3": "GovSimの共有資源の枠組みを改変し、4体が再生するバッファを8期にわたり分け合う。報酬を述べるだけ（A）、準備金50から毎期20の運営費が引かれ0で退場する持続的な制約（B）、物語のみ（C）の3条件を、Claude Sonnet 4.6、Llama 4 Maverick、Nova Proで各60体ずつ走らせた（§4.1）。", "p4": "事前に固定した仮説は、Bの条件付きの取り分の予定表が運営費の近くに下限を持つこと、Bの類型分布と人間の分布の総変動距離がAより小さいことで、終了後にFischbacherらの戦略法で10段階の予定表を引き出した（§4.1）。", "p5": "主仮説はLlamaとNovaで支持され、Claudeでは支持されなかった。他者の取り分が少ないときのLlamaの取り分はBでAより12.1単位少なかった（95%CI 10.2〜13.8）。一方、同じ協力型がClaudeの92%、Llamaの100%、Novaの95%を占め、人間では約30%いるただ乗り型はどの条件でも0で、Bの22〜32%は破綻した（§4.3–4.4、図2・3）。", "p6": "著者は、実装した環境にエージェント間の外部性がなく協力やただ乗りを試せていないこと、Bが状態・計算・退場を束ねた処置であること、人間の基準が別のゲームのものであることを限界とする（§4.6）。解釈：利害をどう与えれば人間らしい多様性が生じるかは、混合動機での訓練を含む次の検証に残る。", "fun": "AIに村人を演じさせて資源の分け合いを観察すると、みんな行儀よく協力します。でもそれは、AIが「協力するのが普通」という文章の型をなぞっているだけかもしれません。本物の人間の集団には必ず一定数いる「ずるをする人」が、AIの集団には一人もいませんでした。損をする立場にないと社会の多様さは生まれないのでは、という問いかけが面白いところです。", "unverified": "未査読のarXivプレプリント。類型分類の基準（付録B）とバッファの挙動の詳細（付録G）は確認していない。"}}, {"id": "pr04", "rank": 4, "headline": "文脈の豊かさとLLM社会エージェントの頑健性", "title": "A Framework for Context Enrichment and Selective Robustness in LLM Social Agents", "url": "https://arxiv.org/abs/2611.06914", "authors": "Mattia Greiche ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Greiche, M., Rabbany, R., & Touzel, M. P. (2026). A Framework for Context Enrichment and Selective Robustness in LLM Social Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06914", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（枠組み・実験・考察の節と図表キャプション）を読んだ", "preprint": true, "p1": "LLMの社会エージェントに与える文脈を規則的に入れ替える「統制された文脈の充実化」と、見かけの変化には動じず意味のある変化には指定した向きに動く「選択的頑健性」という検証基準を提案し、予備実験で示した（抄録、§2）。", "p2": "LLMエージェントは意味を保つプロンプトの言い換えでも行動を大きく変え、社会シミュレーションの妥当性を損なう。文脈を豊かにすれば安定するかは、豊かさと頑健性の定義が曖昧で比べられてこなかった（§1）。", "p3": "最小、中立的な水増し、一般的な社会的背景、記述的な意思決定の接地（関係・規則・適用範囲）、規範的な接地（役割上の責任を明示）の5条件を、同じ位置への置き換えで挿入する（表1、§2.1）。評価は、表現形式を変えたときの差（表面感受性）と、決定に関わる世界の違いへの指定方向の反応（世界応答性）の2軸で行う（§2.2）。", "p4": "病院Aの緊急物資の管理者が、同じ選択に直面する病院Bに物資を融通するか保持するかを決める囚人のジレンマ型の課題で、地域の共同の取り決めがある世界（融通が増えると予想）と個別の取り決めの世界を比べた。散文・箇条書き・キー値表・別の散文の4形式で、GPT-5.6のSolとTerraの融通の確率をトークン確率から求めた（§3）。", "p5": "接地のない条件は、表面に敏感か、安定していても世界の違いにほとんど反応しないかのどちらかだった。記述的・規範的な接地では両モデルとも世界の違いに強く反応し、Solは表面感受性も下がったが、Terraは敏感なままで、局所の規範条件では別の散文で89.9%、ほかの3形式では0.9%以下の融通だった（§3、図1）。", "p6": "著者は、接地した条件は世界の違いの説明も詳しくするため、反応の強まりが接地によるのか情報の目立ちやすさによるのか区別できず、モデルが選択に至る仕組みも特定できないと述べる（§3–4）。対象は1つのゲームと2つのモデルによる予備実験である。", "fun": "AIに人の役を演じさせるとき、説明を長くすれば安定すると考えがちです。でもこの研究では、同じ内容を別の言い回しの文章に変えただけで、ほとんどゼロだった選択が9割近くに跳ね上がる例がありました。言い換えには動じず、本当に大事な状況の違いにだけ反応する、という「ちょうどよい頑固さ」を測る物差しを作った点が面白いところです。", "unverified": "未査読のarXivプレプリント。付録B.4の追加結果と表2・3の個別の数値は確認していない。"}}, {"id": "pr05", "rank": 5, "headline": "レビュー役のLLMに覆す権限をどう与えるか", "title": "Who May Overrule the Agent? Evidence-Gated Authority in LLM Review Institutions", "url": "https://arxiv.org/abs/2611.05390", "authors": "Fuad Ali", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Ali, F. (2026). Who May Overrule the Agent? Evidence-Gated Authority in LLM Review Institutions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05390", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（制度のモデル・実験設計・結果・限界の節と表1・2）を読んだ", "preprint": true, "p1": "複数エージェントのLLMでレビュー役の推奨を拘束力のあるものにするとき、拘束的な制約違反と準拠した修正を機械的に検証できる記録を出した場合だけ置き換えを認める「証拠の関門」が、正しい提案の改悪を大きく減らしつつ違反の修復の多くを保つことを示した（抄録、§5.1）。", "p2": "レビュー役は誤りを直す一方、すでに正しい決定を置き換えて悪くすることもある。著者は、同じ提案・情報・レビュー出力のもとで、いつ推奨を拘束的にしてよいかという「管轄」の問題として定式化した（§1、§3）。", "p3": "提案を正解（C）、拘束違反（V）、準拠だが最適でない（U）の3状態に分け、同じレビュー記録を、解析できれば推奨を採る広い権限と、違反と修正の記録を課題データで検証できたときだけ採る関門で組み直す。状態ごとの効果と、状態の割合で重み付けた期待効果を推定する（式2・3、§3）。", "p4": "4ビット量子化のQwen3-8BとMistral-Small-24Bを温度0でローカルに動かし、7人の主体と7つの政策案からなる空間政策の96課題と、予算と保護集団の被覆を義務とする事業ポートフォリオの96課題を、3状態ずつ（各モデル288レビュー）評価した。指標は厳密な最適性と準拠である（§4）。", "p5": "空間課題で広い権限は正しい提案96件中85件を最適でない案に変え、関門は全件を保って厳密最適性で+88.5ポイントの差が出た。関門の代償はUで、広い権限が見つけた最適解（Qwen 2件、Mistral 6件）を変えられなかった（表1）。保持・置換・上申を選べる設計では、Qwenは正しい提案48件すべてを保ち、Mistralは48件すべてを置き換えて改悪した（表2）。", "p6": "著者は、量子化した2つのオープンモデルと7択の表に限られること、正解が機械的に定まる課題であること、提案役とレビュー役が同じモデルで誤りが相関しうること、証明の仕様が不完全なら関門は誤った目的を確実に守ってしまうことを限界とする（§7）。", "fun": "AIの答えを別のAIにチェックさせると、間違いを直してくれる一方で、正しかった答えまで「改善」して台無しにすることがあります。この研究は、違反を証拠つきで示せたときだけ書き換えを認めるルールにすると、台無しをほぼ防げることを示しました。ただ、選択肢を与えたときの反応は、慎重になるモデルと全部書き換えるモデルで正反対だった点も面白いところです。", "unverified": "未査読のarXivプレプリント。自然な提案での状態の割合（§5.4）とポートフォリオ課題の詳細な結果は確認していない。"}}, {"id": "pr06", "rank": 6, "headline": "ベイズ推定で減衰梁の粘弾性モデルを選ぶ", "title": "A Bayesian Framework for Selecting Fractional Viscoelastic Models in Unconstrained-Layer Damped Beams", "url": "https://doi.org/10.21203/rs.3.rs-11455292/v1", "authors": "Lucas Asth ほか", "venue": "Research Square (In Review)", "date": "2026-11-05", "apa": "Asth, L., Oliveira, A., Knupp, D., Stutz, L., & Adeodato, A. (2026). A Bayesian Framework for Selecting Fractional Viscoelastic Models in Unconstrained-Layer Damped Beams. https://doi.org/10.21203/rs.3.rs-11455292/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "Research Square掲載のPDF本文（数値実験の設定、モデル選択の表7、結論の節、図表キャプション）を読んだ", "preprint": true, "p1": "非拘束型の制振層を持つ片持ち梁で、分数階の粘弾性構成則を周波数応答から同定し、ベイズのモデル証拠で選ぶ枠組みを示し、層の厚さによってデータが支持するモデルが変わることを示した（抄録、§5）。", "p2": "制振層の粘弾性は周波数に依存し、候補の構成則（Kelvin–Voigt、Maxwell、Zener）のどれが妥当かを、繰り返しの順解析に耐える計算法と不確実性の扱いを備えて選ぶ方法が必要だった（§1）。", "p3": "制振層を周波数依存の複素弾性率で表し、薄層とせん断を補正した厚層を統一した有効曲げ剛性で扱い、一般化積分変換法（GITT）で梁先端の受容度を半解析的に求めて順モデルとした（§2）。これを遷移マルコフ連鎖モンテカルロ（TMCMC）に組み込み、各候補の事後分布とモデル証拠（当てはまりと複雑さの釣り合い）を求め、Sobol指標で感度も調べた（§3、図3）。", "p4": "独立に実装した有限要素モデルで4パラメータの分数階の基準則から合成データを作り（逆犯罪の回避）、対数振幅にσe=0.05の雑音を加えた。基層2 mmに対して制振層2 mm（薄）と10 mm（厚）とし、1〜5000 Hzの140周波数を使い、各モデル・構成でTMCMCを10回ずつ独立に走らせた（§4）。", "p5": "薄層ではMaxwellが平均の対数証拠−79.76でモデル確率87.75%、Zenerが12.25%、Kelvin–Voigtはほぼ0だった。厚層ではZenerが対数証拠−90.23で確率100.00%と決定的に選ばれ、データを生成した構成族を回復した（表7）。材料は同じでも層の構成が周波数応答に伝わる情報を変えた、というのが主な結果である（§5）。", "p6": "検証は合成データによる数値研究で、実験データへの適用は示していない（図3の説明）。著者は、Sobol指標は事後の識別可能性の直接の尺度ではなく、雑音・事前分布・周波数範囲に左右されると述べる（§5）。", "fun": "ゴムのような制振材は、揺れの速さによって硬さやエネルギーの吸い方が変わります。その性質を表す式の候補がいくつかあるとき、どれが正しいかを揺れの測定から統計的に選ぶ方法を作りました。同じ材料でも、薄く貼るか厚く貼るかで「データが選ぶ式」が変わる、つまり測り方の形が答えを左右するという点が面白いところです。", "unverified": "未査読のプレプリント。実測の周波数応答への適用と計算時間は未確認。"}}, {"id": "pr07", "rank": 7, "headline": "差分プライバシー付き表データVAEの規模と効用", "title": "Exploring the Privacy--Size Tradeoff for Differentially Private Self-Attentive Variational Autoencoders", "url": "https://arxiv.org/abs/2611.05582", "authors": "Rohit Sadavarte ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Sadavarte, R., Kothari, D., Gupta, S., & Van Oeveren, E. (2026). Exploring the Privacy--Size Tradeoff for Differentially Private Self-Attentive Variational Autoencoders (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05582", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（手法・実験設定・結果・プライバシー監査の節）を読んだ", "preprint": true, "p1": "自己注意・VAE・差分プライバシー（DP）を1つの表データモデルに組み合わせたSAVANTを作り、プライバシー予算εとデータ量を同時に変えて合成データの有用性を評価し、同じDP保証のもとでデータが多いほど有用性が上がることを示した（抄録、§4）。", "p2": "DPで学習した生成器の合成データは共有と秘密保護を両立する手段だが、有用性は予算εと生成器が見るデータ量の両方に依存し、利用者が決められる後者は系統的に調べられていなかった（抄録、§1）。", "p3": "VAEの全結合の符号化・復号器を位置符号のない多頭自己注意に置き換え、カテゴリ列は基数の平方根の次元の埋め込みで表し、DP-SGDに合わせて損失を標本ごとのELBOで返す（§3.1）。比較はPrivBayes（純粋なε-DP）とMST（(ε,δ)-DP、δ=10^-5）で、列の定義域は公開情報として与えた（§3.2）。", "p4": "UCI Adult（48,842行）と20州のACS-PUMS 2018を入れ子の規模（10K〜500K行）に分け、ε∈{0.1, 1, 5, 10, 20}の格子で、合成データで学習した分類器のF1の低下（有用性の低下）、列間の相関の差、メンバーシップ推論への耐性を測った（§3.3–3.4、§5）。", "p5": "εを20から5に絞る損失は最大0.07 F1、0.1まで絞ると最大0.53だった。MSTの予算による低下は10K行の+0.456から500K行で+0.050に縮み、SAVANTはε=20で0.150から0.039と最も急に改善したが、ε=0.1では0.53〜0.70の低下が残った（§4、表1）。メンバーシップ推論の平均AUCは222セルで0.4992と偶然と区別できなかった（§5）。", "p6": "有用性は1つの課題とモデルの種類に基づき、SAVANTのMSTに対する優位（約0.03 F1）はシードの雑音に近いと著者は述べる。ノイズの尺度の議論は漸近的で厳しい予算の端では成り立たず、SAVANTは計算量がずっと大きい（§4）。", "fun": "個人のデータは共有すると役に立ちますが、そのままでは秘密が漏れます。そこで雑音を混ぜて「本物に似た偽の表」を作る方法がありますが、守秘を強めるほど偽の表は役に立たなくなります。この研究は、元のデータを多く使うほど、その損をかなり取り戻せることを示しました。守秘と有用さの綱引きに「データの量」という第三の軸を持ち込んだ点が面白いところです。", "unverified": "未査読のarXivプレプリント。表2・3の全セルの値と、DP-SGDのハイパーパラメータの詳細は確認していない。"}}, {"id": "pr08", "rank": 8, "headline": "クーロン相互作用粒子の平均場極限を軌道から", "title": "On the propagation of chaos for three-dimensional Coulomb Brownian particles", "url": "https://doi.org/10.48550/arxiv.2611.04495", "authors": "Lei Li ほか", "venue": "arXiv (Cornell University)", "date": "2026-11-03", "apa": "Li, L., & Liu, J.-G. (2026). On the propagation of chaos for three-dimensional Coulomb Brownian particles (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.04495", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、主定理、§2の定理と証明の流れ）を読んだ", "preprint": true, "p1": "3次元で反発するクーロン相互作用を持つブラウン粒子系について、ランダムな粒子の軌道から直接、経路空間での混沌の伝播（粒子数を増やすと粒子どうしが独立に近づくこと）を証明した（抄録、定理1.1）。", "p2": "この系の平均場極限はリウヴィル方程式から出発する方法では解決していたが、軌道から直接の正当化は未完だった。著者らの2019年の前作は、経験測度の極限点の時間周辺が非線形フォッカー・プランク方程式の弱解になることを示したが、正則性の不足で強解と同定できず、時間周辺の一意性だけでは経路の法則も定まらなかった（§1）。", "p3": "粒子のエネルギー散逸に力の二乗の総和を残してその二次の変分表現で極限をとり、重み付きの力の評価とフィッシャー情報を組み合わせて、欠けていた時空間のL²評価を得た（§2、定理2.1）。さらに局所化した対数ビリアル恒等式で粒子が近づきすぎる前の相互作用を抑え、同じブラウン運動で駆動する同期結合で個々の軌道の収束を示した（§3）。", "p4": "数値実験はなく、初期密度がH^m（m>3/2）に属し、エントロピー・2次モーメント・クーロンエネルギーが有限という仮定のもとでの数学的な証明である（定理1.1）。", "p5": "任意のT>0で経験経路測度はMcKean SDEの法則に確率収束し、時間周辺は一意の強解の密度を持つ。各粒子について、相互作用する系の軌道と独立な非線形過程の軌道との一様距離の期待値が粒子数N→∞で0に収束し、最初のk個の粒子の経路の同時分布は独立な積に弱収束する（定理1.1、式1.6）。", "p6": "結果は収束の速さを与えない定性的なもので、粒子の力学を正則化しないまま扱った、反発型クーロン力の3次元全空間の場合に限られる。解釈：引力型の相互作用や速度を含む系への拡張は残る。", "fun": "たくさんの粒が押し合いながらランダムに動くとき、粒の数がとても多ければ、一つの粒は「周りの平均」から力を受けて独立に動くように見えるはずです。これを混沌の伝播と言います。電気の力のように近いほど強烈に反発する力では、粒が近づいた瞬間に計算が暴れるので証明が難しく、それを粒一つひとつの道筋から直接示した点が面白いところです。", "unverified": "未査読のarXivプレプリント。§3の証明の細部（停止時刻の評価など）は確認していない。"}}, {"id": "pr09", "rank": 9, "headline": "街の安全感にロボットが与える影響をLLMで推定", "title": "Robots in the City: Persona-Based Perceptions of Urban Robots", "url": "https://arxiv.org/abs/2611.05954", "authors": "Keonhee Jang ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Jang, K., Lee, K., Yun, S., Kim, N., & Yoon, Y. (2026). Robots in the City: Persona-Based Perceptions of Urban Robots (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05954", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（実験設計・結果・人との比較の節）を読んだ", "preprint": true, "p1": "ソウルの街路画像で、ロボットの有無と種類が歩行者の感じる安全にどう影響するかを、合成ペルソナを条件づけたマルチモーダルLLM（MLLM）と人で比べ、ロボットの効果は時間帯で変わり、MLLMは人の判断の一部しか捉えないことを示した（抄録、§IV）。", "p2": "歩行者は相互作用なしに公共空間でロボットと出会うようになったが、ロボットが街路の安全感をどう変えるかは不明で、ペルソナを与えたMLLMがその評価の代わりになるかも未検証だった（§I）。", "p3": "道路の階層が異なる3つの街路をもとに、GPT-5.6 Solで昼・夜とロボットなし・配達ロボット・人型の条件を作り、18枚の画像を生成した。性・年齢・所得・地域を均衡させた韓国の合成ペルソナ500人をQwen3.8-27BとGemma4-26Bに与え、同じ場所・時間の2枚から安全に見える方を理由つきで選ばせた（各モデル9,000回答、§III-A–B）。", "p4": "ロボット（または人型）が選ばれた割合（勝率）を、クラスター・ブートストラップの95%区間とCohenのhで比べ、理由をClaude Opus 5.5で5つの話題に符号化した。人の基準として25人が同じ18試行に答え、性・年齢の合うペルソナと比べた（§III-C–E）。", "p5": "ロボットなしに対する勝率は配達ロボットがQwen 45%・Gemma 41%、人型が13%・29%で、2種のロボットの比較で人型は4%・5%だった。夜は勝率が上がり（人型はGemmaで5%→53%）、高齢のペルソナほど配達ロボットを選ばなかった（Qwenで54%→26%）。人は2種の比較で人型を24%選んだがモデルは4%・7%にとどまり、Gemmaの夜の人型の上昇（8%→65%）は人（19%→37%）より大きかった（§IV、図1・4）。", "p6": "人の回答者は25人と少なく、画像は1都市の3場面からの生成画像に限られる（§III）。解釈：ペルソナ間の差がモデルによって人より誇張・逆転する場合があり、合成回答者による代替は部分的にとどまる。", "fun": "街にロボットが増えると、安心でしょうか、不安でしょうか。AIに500人の架空の住民になってもらって写真を見比べさせると、昼はロボットのいない道を選びがちなのに、夜は見回りをしそうな人型ロボットを選ぶ答えが急に増えました。同じロボットが時間帯によって「脅威」にも「用心棒」にも見える点と、AIの答えが本物の人と完全には一致しない点が面白いところです。", "unverified": "未査読のarXivプレプリント。応答の一貫性（表I）の数値と、理由の符号化の一致度（付録C）は確認していない。"}}, {"id": "pr10", "rank": 10, "headline": "孫の世話は高齢者の孤独を和らげるか", "title": "Grandparental Care and Loneliness in Europe: Differences across Cultural Context", "url": "https://doi.org/10.31235/osf.io/fx7as_v2", "authors": "Martin Lakomý ほか", "venue": "SocArXiv", "date": "2026-11-04", "apa": "Lakomý, M., Lee, S., & Silverstein, M. (2026). Grandparental Care and Loneliness in Europe: Differences across Cultural Context. https://doi.org/10.31235/osf.io/fx7as_v2", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SocArXiv（OSF）の抄録を使用し、本文は入手できず", "preprint": true, "p1": "欧州の50〜90歳で、孫の世話の頻度が高いほど孤独が低いことを個人内の固定効果分析で示し、その関係は個人主義的な国で見られ、最も集団主義的な国では逆に孤独の高さと結びつくことを示した（抄録）。", "p2": "高齢期の孤独の要因と対策は注目されてきたが、社会参加を妨げも促しもしうる孫の世話の役割はほとんど検討されてこなかった（抄録）。", "p3": "欧州の健康・高齢化・退職調査（SHARE）の5つの調査波で、同じ人の中での孫の世話の強度の変化と孤独の変化を結ぶ個人内の固定効果モデルを当てはめ、個人主義・集団主義の傾向で分けた国の群ごとに比べた（抄録）。解釈：固定効果は時間で変わらない個人差を除くが、時間で変わる交絡は残る。", "p4": "評価の対象は、孤独と孫の世話の強度の関連の向きと、国の文化的な文脈による違いである（抄録）。孤独の尺度と世話の強度の定義は抄録では未確認。", "p5": "孫の世話の強度が高いほど孤独は低かった。国の群で分けると、個人主義的な国では世話が孤独の低さと、最も集団主義的な国では孤独の高さと結びついていた（抄録）。", "p6": "著者は、世話が自発的な活動として経験される文脈でとくに有益だという可能性と整合すると解釈する（抄録）。解釈：自発性そのものは測られておらず、国による違いの仕組みは推測の段階にある。", "fun": "孫の世話は楽しそうですが、自由な時間を奪う面もあります。欧州のデータでは、孫をよく見る祖父母ほど孤独を感じにくい傾向がありました。ところが、家族の結びつきを重んじる国では逆に孤独が強い。世話が「自分で選んだこと」か「当然の務め」かで同じ行動の意味が変わるのかもしれない、という見方が面白いところです。", "unverified": "孤独の尺度、世話の強度の定義、国の分類の基準、効果の大きさは抄録では未確認。"}}, {"id": "pr11", "rank": 11, "headline": "上司が組織に支えられると部下も支えを感じる", "title": "Supervisors’ perceived organizational support, span of control, and employees’ perceived supervisor support: A multilevel study using supervisor–employee linked data", "url": "https://doi.org/10.21203/rs.3.rs-10641574/v2", "authors": "Takahiro Mori ほか", "venue": "Research Square (In Review)", "date": "2026-11-05", "apa": "Mori, T., Nagata, T., Odagami, K., & Mori, K. (2026). Supervisors’ perceived organizational support, span of control, and employees’ perceived supervisor support: A multilevel study using supervisor–employee linked data. https://doi.org/10.21203/rs.3.rs-10641574/v2", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "Research Square掲載のPDF本文（方法・結果・強みと限界の節）を読んだ", "preprint": true, "p1": "日本の製造業1社の上司-部下の連結データで、上司が組織から支えられていると感じるほど、部下は上司から支えられていると感じることを多層分析で示した。統制範囲（部下の数）による調整は見られなかった（抄録、結果）。", "p2": "上司の支援の知覚（PSS）はメンタルヘルスや仕事の成果と結びつくが、上司自身の知覚された組織的支援（POS）がそれを左右するかは、上司と部下を結んだデータでほとんど検証されず、統制範囲の役割も不明だった（背景）。", "p3": "2025年9〜10月のオンライン質問紙を人事記録と匿名IDで結び、最小の組織単位の管理者を上司と定義した。上司のPOSはSPOS-Jの肯定的側面の4項目（α=0.93）、部下のPSSはSPSS-Jの4項目（α=0.96）で測り、統制範囲は人事記録から求めた（方法）。", "p4": "上司317人のもとの部下1,994人を、上司のレベルを考慮した多層線形回帰で分析し、統制範囲を上司レベルの構造変数・調整変数とした。POSとPSSを別の回答者が答え、統制範囲を記録から取ったことで共通方法バイアスを抑えている（方法、強みと限界）。", "p5": "部下のPSSの分散の15%が上司のレベルにあった（ICC=0.15）。上司のPOSはPSSと正に関連し（B=0.101、95%CI 0.030〜0.172）、統制範囲を入れても保たれた（B=0.098）。統制範囲の主効果（B=−0.007）と交互作用（B=−0.003）は有意でなかった（表3）。", "p6": "著者は、単一企業の横断研究であること、上司が回答しなかった部下（とくに専門部門）が除かれたこと、関連の仕組みとなる上司の行動を調べていないこと、管理職の経験を調整していないこと、交互作用の推定が不精確なことを限界とする（強みと限界）。", "fun": "部下に優しい上司とそうでない上司の違いはどこから来るのでしょう。日本の製造業の会社で上司と部下をつないで調べると、上司自身が「会社に大事にされている」と感じているほど、部下も「上司が支えてくれる」と感じていました。思いやりは上から下へ伝わる、という見方が面白いところです。ただし効果は小さく、部下の人数で変わる様子はありませんでした。", "unverified": "未査読のプレプリント。共変量の完全な一覧と、補足表S1・S2の詳細は確認していない。"}}, {"id": "pr12", "rank": 12, "headline": "合成データの効果は行数の増加と区別して測る", "title": "Synthetic tabular healthcare data in health informatics: fixed-size substitution and incremental-value controls for predictive utility Application Paper", "url": "https://doi.org/10.21203/rs.3.rs-11128489/v1", "authors": "Miguel Álvaro Andrade Oliveira ほか", "venue": "Research Square (In Review)", "date": "2026-11-04", "apa": "Oliveira, M. Á. A., Ricou, M., & Freitas, A. (2026). Synthetic tabular healthcare data in health informatics: fixed-size substitution and incremental-value controls for predictive utility Application Paper. https://doi.org/10.21203/rs.3.rs-11128489/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Research Square掲載のHTML本文（方法・結果・考察の節と表1）を読んだ", "preprint": true, "p1": "学習の行数の増加と、重複した説明変数の組による学習・検証間の漏洩を統制した評価の枠組みを作り、3つの糖尿病関連データで、合成表データには一般的な予測上の利点がないことを示した（抄録、§3）。", "p2": "合成記録を加えると、有用な情報を足したからではなく学習の行数が増えただけでモデルが良く見えうる。学習と検証にまたがる同一の説明変数の組も、楽観的な評価を生む（抄録）。", "p3": "実データの一部（0〜100%）を合成行に置き換えて行数を固定する置換実験と、実N行（RR-N）、実N行と実データのブートストラップN行（RB-2N）、実N行と合成N行（RSADD-2N）を比べる追加実験を組んだ。生成器はGaussian Copula、CTGAN、TVAE、分類器はロジスティック回帰・ランダムフォレスト・HistGradientBoostingで、同一の説明変数の組は1つの分割にまとめた（§3.2–3.4）。", "p4": "CDC Diabetes Health Indicators（253,680行）、Diabetes 130-US Hospitals（101,766行）、Early Stage Diabetes Risk Prediction（520行）で、10回の対応のある反復のAUCを、Wilcoxon検定とHolm補正で比べた（§3.1、§3.3）。", "p5": "置換では実データだけの場合とのAUCの差が平均で、25%置換で−0.0016、全置換で−0.1469となり、108の対比のうち89で有意に悪く、良かったのは4つだった（表1）。追加実験でも合成の追加はRR-Nに対し27対比中21、RB-2Nに対し16で有意に悪かった。Early Stageでは行ごとの分割による漏洩が見つかり、修正前のAUC（例：0.9969）が修正後（0.9375）より高く出ていた（§3.4）。", "p6": "結論は評価した条件（3データ・3生成器・固定のハイパーパラメータ・1つの分割）に限られ、不確実性は1つの分割に条件づけられる（§3.1）。プライバシー、公平性、臨床的な同等性は示していないと著者は述べる（抄録）。", "fun": "データが足りないとき、AIで作った偽のデータを足せば予測が良くなる、という報告があります。でもそれは単に練習問題の数が増えたからかもしれません。この研究が問題の数をそろえた「公平な試験」をすると、偽データの効果はほとんど消えました。同じ問題が練習と本番の両方に紛れ込むと実力以上の成績に見える、という落とし穴を見つけた点も面白いところです。", "unverified": "未査読のプレプリント。忠実度とプライバシーの代理指標の結果（Online Resource 2）は確認していない。"}}, {"id": "pr13", "rank": 13, "headline": "境界入力のある非線形PDEの縮約モデル学習", "title": "To lift or not to lift: Operator inference for nonlinear PDEs with boundary control", "url": "https://arxiv.org/abs/2611.06665", "authors": "Zhuoyuan Wang ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Wang, Z., Nakahira, Y., Ali, W. H., & Mowlavi, S. (2026). To lift or not to lift: Operator inference for nonlinear PDEs with boundary control (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06665", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（手法の節、熱方程式の結果、考察・結論、図表キャプション）を読んだ", "preprint": true, "p1": "境界から入力（制御）が加わる非線形PDEで、境界条件を必ず満たすように状態を「持ち上げ」成分と同次成分に分けて縮約モデルをデータから学ぶ、境界と整合した作用素推論（OpInf）の定式化を示した（抄録、§3）。", "p2": "OpInfは射影型の縮約モデルをデータから非侵入的に学ぶが、標準の定式化は境界での作動が解の許容空間を変えることを明示的に扱わず、制御の効果を場当たり的な線形の加算項で入れていた（抄録、§2.3、§5）。", "p3": "状態を、与えた境界条件を満たす既知の持ち上げ成分（入力u_j(t)と関数g_j(x)の積の和）と、POD基底で表す同次成分に分解する（式15）。これを支配方程式に代入すると、2次の非線形PDEでは状態と入力の双線形項と入力の2次項を含む縮約モデルの構造が現れ、その作用素を最小二乗でデータから推定する（§3）。", "p4": "境界で作動する熱方程式、Burgers方程式、2次元のキャビティ流れで、元のOpInf、持ち上げたOpInf、射影、侵入型の縮約モデルを比べ、相対L²予測誤差、ソルバーの失敗率、計算時間、境界付近の誤差を評価した。熱方程式ではPODの次元を3から8まで変え、学習と同じ制御の5ケースと異なる制御の20ケースで評価した（§4.1）。", "p5": "熱方程式では持ち上げにより学習・試験の誤差が一貫して下がり、失敗率も低く、元のOpInfが解けた全ケースで持ち上げ版も解けた（表1、図1）。計算時間はPODの次元を増やしても安定し、境界付近の誤差は大きく減った（図2・3）。一方、設定によっては両者の精度と計算コストは同程度だった（§5）。", "p6": "著者は、利得は問題と縮約の次元で異なり、全体の状態の予測が主目的で境界の厳密さが重要でない場合は標準のOpInfで十分なことがあるとし、雑音や部分観測のデータ、パラメトリックな境界制御を今後の課題とする（§5–6）。", "fun": "流れや熱の動きを計算するとき、変数を大胆に減らした「縮約モデル」を使うと計算がずっと速くなります。でも、壁の温度を変えるといった境界からの操作があると、縮めたモデルが境界の条件を破りがちでした。この研究は、境界の条件を満たす部分を最初から切り分けておくことで、その破れをなくしました。縮めても守るべきものは守る、という工夫が面白いところです。", "unverified": "未査読のarXivプレプリント。Burgers方程式とキャビティ流れの誤差と失敗率の数値（表2・3、図4〜9）は確認していない。"}}, {"id": "pr14", "rank": 14, "headline": "LLMは個人の文体をまねられるか6モデル比較", "title": "How Well Can Large Language Models Impersonate Individual Authors? A Comparative Evaluation", "url": "https://arxiv.org/abs/2611.05771", "authors": "Harshit Gupta ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Gupta, H., & Ishihara, S. (2026). How Well Can Large Language Models Impersonate Individual Authors? A Comparative Evaluation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05771", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（データと手順、結果の表5・6、重複分析、限界の節）を読んだ", "preprint": true, "p1": "6つの代表的なLLMが個人の書き手の文体をどこまで模倣できるかを商品レビューで評価し、成功に見えたGemini 3 Proは手本の文を大量に写して再利用していたことを、重複分析で明らかにした（抄録、§5）。", "p2": "LLMによるなりすましは文書の鑑定の脅威になりうるが、本当の文体の模倣と、手本の文の直接の再利用を区別して評価した研究は少なかった（抄録、§1）。", "p3": "Amazonのレビューのコーパス（3,227人・21,347件）から、6件のレビューの文体が安定した上位100人を選び、3件ずつの2組を手本として、簡単なプロンプトと文体の手がかりを明示した複雑なプロンプトで生成させた（各LLM 400件、表4）。模倣の度合いは、生成文と手本の埋め込み（LUAR_MUD）のコサイン距離による「訓練への距離」で測った（§3–4）。", "p4": "基準として、同じ著者の対と別の著者の対の距離の平均（0.1967と0.3713）と判定の閾値0.2648を使い、閾値を下回れば同じ著者と判定される模倣の成功率を比べた。文単位の文字列の類似とJaccard係数で手本からの再利用も調べた（§5.1、重複分析）。", "p5": "訓練への距離の平均はGemini 3 Proが0.3003で最小、Grok 4.1 Fastが0.4896で最大で、Gemini以外は別の著者の平均に近いか超えた（表5）。模倣の成功率はGeminiが簡単29.0%・複雑36.0%で、他は0〜3%だった（表6）。Geminiの平均最大Jaccardは0.902〜0.917と人の基準（0.330）を大きく超え、複写を禁じる指示でもほとんど改善しなかった（重複分析）。", "p6": "著者は、協力的なプロンプトの条件だけで敵対的ななりすましを扱っていないこと、非形式的な商品レビューという1つの文種に限られることを限界とする（§7）。解釈：埋め込みの距離だけでは模倣と複写を見分けられず、重複の分析を併せることが欠かせない。", "fun": "AIに「この人そっくりの口コミを書いて」と頼むと、うまくまねたように見える答えが返ってきます。ところが調べてみると、一番うまく見えたAIは、手本の文章をほぼそのまま写していました。似ているかを測るだけでは「まね」と「丸写し」の区別がつかない、という落とし穴が面白いところです。人は同じ言い回しを繰り返す癖があるのに、多くのAIはその癖までは再現できませんでした。", "unverified": "未査読のarXivプレプリント。要因分析の数値と、埋め込みの可視化（図7〜9）の詳細は確認していない。"}}, {"id": "pr15", "rank": 15, "headline": "黙従傾向が測定不変性の検出を誤らせるか", "title": "Does Acquiescence Bias Distort Measurement Invariance Across Multiple Groups? A Monte Carlo Comparison of Tree-Based Factor Analytic Methods", "url": "https://doi.org/10.31234/osf.io/myk4s", "authors": "Tugay Kaçak ほか", "venue": "PsyArXiv", "date": "2026-11-05", "apa": "Kaçak, T., & González, D. N. (2026). Does Acquiescence Bias Distort Measurement Invariance Across Multiple Groups? A Monte Carlo Comparison of Tree-Based Factor Analytic Methods. https://doi.org/10.31234/osf.io/myk4s", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "OSF（PsyArXiv）のPDF本文（方法・限界の節と結果の要約）を読んだ", "preprint": true, "p1": "集団によって黙従傾向（項目の内容にかかわらず同意する傾向）が違うと測定の非不変性に見えたり隠れたりする問題で、ランダム切片（RI）の因子を入れた樹木型の因子分析と、新しいブロックごとの効率的スコア検定により、異質性の源を正しく見分けられることを示した（抄録）。", "p2": "モデルに基づく再帰的分割（MOB）と因子分析を組み合わせた樹木（EFAtree、CFAtree）は多くの共変量にわたる非不変性の検出に使われているが、検出した異質性を正しい源（黙従か内容の負荷量か）に帰属できるかは分かっていなかった（抄録）。", "p3": "EFAtree・CFAtreeと、黙従を表す負荷量固定の方法因子（RI）を加えた版をlavaanとpartykitで実装した。さらに、他のすべてのパラメータを射影で除き、RIの分散の不安定性と内容の負荷量の不安定性を分けるブロックごとの効率的スコア検定を提案した（方法）。", "p4": "432条件・各500回のモンテカルロで、集団がどちらの源でも異ならない、黙従のみ、内容の負荷量のみ、両方、の4つの生成条件を比べ、第1種の誤りと帰属の正しさを評価した。実データ例としてRosenbergの自尊感情尺度（N=26,236）を分析した（抄録、方法）。", "p5": "すべての樹木は名目の第1種の誤りを保った。黙従だけが違うとき、RIのない樹木は逆転項目の配置が偏っていると計量的な非不変性と誤認し、均衡していると見逃したが、RIのある樹木は配置によらず検出した。標準のブロック検定は純粋な内容の非不変性を79%の反復で黙従のせいにしたが、効率的な検定は誤帰属を名目水準に近い値（.06）に抑えた。実データでRIの分散が異なったのは国の間だけだった（抄録）。", "p6": "著者は、黙従の違いを負荷量（RIの分散）の違いとしてだけ操作したこと、内容の負荷量の水準と逆転項目の割合を限られた条件でしか調べていないこと、内容因子が1つのためEFAとCFAの違いを評価できないことを限界とする（限界）。", "fun": "アンケートには、内容をよく読まずに何でも「そう思う」と答えてしまう癖（黙従）を持つ人がいます。この癖の強さが国や集団で違うと、本当は同じ物差しで測れているのに「物差しがずれている」と誤解したり、逆に本物のずれを見逃したりします。この研究は、その癖を表す要素をモデルに入れ、ずれの原因を正しく言い当てる検定を作った点が面白いところです。", "unverified": "未査読のPsyArXivプレプリント。条件別の検出率の表と、実データの分割の木の構造は確認していない。"}}, {"id": "pr16", "rank": 16, "headline": "性格を与えたLLMは説得力を増すか", "title": "Does Personality Persuade? Investigating Personality Trait Prompting and Persuasion in Large Language Models", "url": "https://arxiv.org/abs/2611.06572", "authors": "Ruben Boone ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Boone, R., Eerlings, G., Vanbrabant, S., Vanacken, D., & Luyten, K. (2026). Does Personality Persuade? Investigating Personality Trait Prompting and Persuasion in Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06572", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMに与えた性格（Big Five）は再現性よく制御できる一方、それが説得力を高めるとは限らないことを、性格検査と利用者実験の2段階で示した（抄録）。", "p3": "IPIP-NEO-120で性格プロンプトの再現性・制御性・特性間の波及を測り、参加者32人が性格を一致・不一致・中立・無指定にしたLLMエージェントと道徳的ジレンマを議論する被験者内実験を行った（抄録）。", "p5": "性格の一致は説得力の評価・立場の変更・確信度の変化に有意な差を生まず、立場の変更は128会話中8回にとどまった。無指定のモデルにも系統的な性格プロファイルがあり、AIの説得へのリテラシーが高い人ほど確信度が変わりにくかった（抄録）。", "fun": "AIに「外向的に話して」と頼めば、話しぶりはちゃんと変わります。でも、相手と性格が合うAIほど説得がうまいかというと、この実験ではそうなりませんでした。性格を「演じる」ことと人の考えを「動かす」ことは別の能力だと切り分けたところが面白い点です。", "unverified": "モデルごとの制御性の差と、確信度の変化の大きさは抄録では未確認。"}}, {"id": "pr17", "rank": 17, "headline": "ペルソナを演じるとLLMの内部表現が再編される", "title": "Persona Perspectives: Adopting Viewpoints Reorganizes Representations in LLMs", "url": "https://arxiv.org/abs/2611.06848", "authors": "Austin C. Kozlowski ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Kozlowski, A. C., Mintz, A., & Lee, M. (2026). Persona Perspectives: Adopting Viewpoints Reorganizes Representations in LLMs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06848", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "政治的なペルソナを演じさせるとLLM内部の単語表現の幾何が組み替わり、ペルソナなしで作った真偽・道徳の判定器が偏った結果を出すことを示した（抄録）。", "p3": "リベラル・保守のペルソナと2つの中立条件で、9,000語以上の単語と33の意味軸の表現を取り出し、軸への射影と軸どうしの配置を比べた。線形プローブ、SAEに基づく分類器、手で選んだ単語表現の分類器も当てはめた（抄録）。", "p5": "ペルソナ条件は指定したイデオロギーの方向に射影と軸の配置を系統的に変え、ペルソナなしで学習した分類器は論争的な文の真偽と道徳の評価を政治的に偏らせた（抄録）。", "fun": "AIに「保守派の人として考えて」と頼むと、出力の言い回しだけでなく、内部で言葉どうしがどう並んでいるかまで変わる、という発見です。そのため、AIの中身を調べる道具を同じように当てても、演じている立場によって「本当か」「正しいか」の判定がずれてしまいます。点検の道具そのものを見直す必要を示した点が面白いところです。", "unverified": "使ったモデルの種類と規模、偏りの大きさの数値は抄録では未確認。"}}, {"id": "pr18", "rank": 18, "headline": "AIとの対話で陰謀論が減るのは事実の提示による", "title": "Just the Facts: How Dialogues with AI Reduce Conspiracy Beliefs", "url": "https://arxiv.org/abs/2611.05572", "authors": "Thomas H. Costello ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Costello, T. H., Pennycook, G., & Rand, D. G. (2026). Just the Facts: How Dialogues with AI Reduce Conspiracy Beliefs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05572", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "AIとの個別対話が陰謀論への信念を減らす主な理由は、親しみや共感ではなく、関連する事実と論拠の提示であることを示した（抄録）。", "p3": "米国の成人計2,193人の2つの実験で、説得目的の開示、討論形式、説明だけの指示、応答の半減、測定方法の変更、単一の個別メッセージへの置換など、考えられる原因を1つずつ取り除いた（抄録）。", "p5": "効果はこれらの操作のほとんどで保たれ、事実や論拠を使わずに説得するよう指示したときだけ大きく弱まった。AIの出力と参加者の説明の内容分析でも、信念の低下は事実に基づく論証と結びついていた（抄録）。", "fun": "陰謀論を信じる人をAIとの会話で説得できる、という先行の結果がありました。では、AIの何が効いたのか。親しげな語り口か、寄り添う姿勢か。条件を一つずつ外していくと、残った決め手は「関連する証拠をきちんと示すこと」でした。人間でも同じ証拠を示せれば同じように効くかもしれない、という示唆も面白い点です。", "unverified": "信念の低下幅（効果量）の数値は抄録では未確認。"}}, {"id": "pr19", "rank": 19, "headline": "予測の多重性の下で頑健な救済策を最適化", "title": "Optimizing Recourse Under Predictive Multiplicity", "url": "https://arxiv.org/abs/2611.05774", "authors": "Shahin Jabbari", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Jabbari, S. (2026). Optimizing Recourse Under Predictive Multiplicity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05774", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "性能が同程度の複数のモデルで予測が食い違うときにも有効な救済策（不利な予測を好ましい側に変える入力の変更）を、最悪の場合の失敗を最小にする問題として解く方法を示した（抄録）。", "p3": "線形・ニューラル・混合・決定木のモデルからなる競合集合について、予算制約付きの最悪ケースの有効性損失の最小化として定式化し、オラクル効率的なアルゴリズムORPMと収束の十分条件を示した。合成データ1つと実データ5つで評価した（抄録）。", "p5": "最適化ギャップの上界が減少し、多くの設定で高い有効性と、特定のモデル種類向けの比較手法に対する良好な性能を示した。全モデルに共通の行動を求めたときの成功率の変化と、人口集団間の差も調べた（抄録）。", "fun": "たとえば審査で不利な判定が出た人に「この項目がもう少し良ければ通る」と助言しても、判定に使うAIが入れ替われば通らないかもしれません。同じくらい賢いAIでも、一人ひとりへの判定は意外と食い違うからです。どのAIでも通用する助言を、使える手間の範囲で探すという問題設定が面白いところです。", "unverified": "実データの名称と、集団間の差の大きさは抄録では未確認。"}}, {"id": "pr20", "rank": 20, "headline": "内力を自由度に含むTimoshenko梁の新要素", "title": "A novel mixed-variable beam element and its application on the free vibration of Timoshenko beam", "url": "https://doi.org/10.21203/rs.3.rs-11226309/v1", "authors": "Lv Ding ほか", "venue": "Research Square (In Review)", "date": "2026-11-05", "apa": "Ding, L., Xia, X., Bao, S., & Wang, S. D. (2026). A novel mixed-variable beam element and its application on the free vibration of Timoshenko beam. https://doi.org/10.21203/rs.3.rs-11226309/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "せん断力と曲げモーメントも節点の自由度に含めた2節点8自由度のTimoshenko梁要素を提案し、固有振動数と内力を高い精度で求められることを示した（抄録）。", "p3": "混合変数の有限要素法の枠組みで、たわみ・断面回転・せん断力・曲げモーメントを節点自由度とし、3次のHermite補間関数に基づく2つの変位場から剛性行列と質量行列を導いた。3種類の典型的な境界条件と異なるメッシュで自由振動を解析した（抄録）。", "p5": "既往の結果との比較で、同じ補間次数の従来のTimoshenko梁要素に比べて誤差がおおむね半分以下になった。節点の内力が変位と同時に得られ、せん断力と曲げモーメントの分布は解析解と一致した（抄録）。", "fun": "梁（はり）をコンピュータで計算するとき、ふつうは「どれだけ曲がるか」を先に求め、「どれだけ力がかかっているか」は後から計算します。この研究は、力そのものも最初から計算の主役に入れる要素を作り、同じ細かさの分割でも誤差をおおむね半分以下にしました。発想を少し変えるだけで精度が上がる例として面白い研究です。", "unverified": "比較した既往の結果の出典と、計算コストの比較は抄録では未確認。"}}, {"id": "pr21", "rank": 21, "headline": "検証の関門を通った層だけ使うデジタルツイン", "title": "Evidence-gated digital twins for energy systems: field-validated heat-pump flexibility with online conformal bounds", "url": "https://doi.org/10.5281/zenodo.23965941", "authors": "Razmjoo, Armin", "venue": "Zenodo", "date": "2026-11-04", "apa": "Razmjoo, A. (2026). Evidence-gated digital twins for energy systems: field-validated heat-pump flexibility with online conformal bounds. Zenodo. https://doi.org/10.5281/ZENODO.23965941", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録（DataCite登録）の抄録を使用", "preprint": true, "short": true, "p1": "各層が事前に決めた検証を通過したときだけ使う関門つきのデジタルツインで、ヒートポンプの需要シフトの申し出が守られるかを、英国66世帯の実データで検証した（抄録）。", "p3": "2026年1〜10月の公開1分値データの全対象世帯に、新しい世帯へモデルを当てはめる前に固定した選定規則と分析計画を適用した。1時間先のヒートポンプ電力の層、1節点の貯湯槽ツイン、温度の下限を与える分割・適応的コンフォーマル区間を検証した（抄録）。", "p5": "制約のない勾配ブースティングの層は検証できた61世帯すべてで関門を通らず、物理制約を入れた層は63世帯中45世帯で通過した（事後）。分割コンフォーマルの下限が名目水準の±2ポイント以内だった世帯は28%、適応的な下限では94%だった（抄録）。", "fun": "「この時間はお湯をわかすのを後回しにします」と申し出ても、守れなければ価値がありません。この研究は、AIの予測をそのまま信じるのではなく、各段階が事前に決めた試験に合格したときだけ使う仕組みを試しました。物理の制約を入れない機械学習は試験にまったく通らなかった、という結果が象徴的です。", "unverified": "未査読のプレプリント（Nature Communicationsに投稿中と記載）。各層のモデル構造と試験の基準の詳細は抄録では未確認。"}}, {"id": "pr22", "rank": 22, "headline": "グラフ基盤モデルで多変量時系列の異常検知", "title": "Graph Foundation Models Can Become Effective Multivariate Time Series Anomaly Detectors", "url": "https://arxiv.org/abs/2611.06441", "authors": "Zhuangyan Hu ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Hu, Z., Liang, Z., Li, W., Jia, X., Youssef, M., & Helal, S. (2026). Graph Foundation Models Can Become Effective Multivariate Time Series Anomaly Detectors (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06441", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "事前学習済みのグラフ基盤モデル（GFM）を多変量時系列の異常検知に転用する枠組みGfm4Mtsadを提案した（抄録）。", "p3": "連続時系列をGFMの表現空間につなぐ整合モジュール（SICA）、正常の境界近くの難しい疑似異常を選ぶ教師なし学習の戦略（MAPS）、ノードから時間窓への集約の歪みを除く較正（TGEC）の3つを組み合わせた（抄録）。", "p5": "2つのGFMを基盤とした広範な評価で、既存の手法を上回る検出性能を示したと述べる（抄録）。", "fun": "多数のセンサの記録から「いつもと違う」瞬間を見つけるには、時間の流れとセンサ同士のつながりの両方を見る必要があります。この研究は、大量のグラフで事前に学習したAIの「つながりを見る目」を借りてくる発想です。ただし抄録には具体的な数値がなく、どれだけ良くなったかは本文で確かめる必要があります。", "unverified": "評価に使ったデータセットの名称と性能の数値は抄録では未確認。"}}, {"id": "pr23", "rank": 23, "headline": "アルゴリズム管理が配達労働の不平等を生む仕組み", "title": "Algorithmic Management and Inequality in the Gig Economy: A Conceptual Framework for Mechanism-Targeted Governance in Bogotá", "url": "https://doi.org/10.21203/rs.3.rs-11350563/v1", "authors": "Shruthaalaxmi . ほか", "venue": "Research Square (In Review)", "date": "2026-11-05", "apa": "., S., Radhakrishnan, M., & Devesh, S. (2026). Algorithmic Management and Inequality in the Gig Economy: A Conceptual Framework for Mechanism-Targeted Governance in Bogotá. https://doi.org/10.21203/rs.3.rs-11350563/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "配達プラットフォームのアルゴリズム管理が、労働者の不利な境遇をデータとして取り込み、配分や制裁の判断を通じて将来の機会に変換する仕組みを概念的に整理した（抄録）。", "p3": "プラットフォーム資本主義やアルゴリズムによる統制の研究、Fairwork Colombiaの評価、ボゴタの研究を解釈的に統合し、Kelloggらの「6つのR」の管理機能と、自動化の程度・適応的な個別化・不透明性の3つの性質で枠組みを作った（抄録）。", "p5": "非正規性・移民資格・周縁部の居住などの構造的な不利が文脈を無視した評価指標に符号化されると論じ、管理機能と介入点を結ぶ7つの検証可能な命題を示した。実証研究ではない（抄録）。", "fun": "配達アプリの評価の点数は公平な物差しに見えます。でも、住んでいる地区などの境遇が低い評価につながり、それが仕事の割り当てを減らすなら、過去の不利が未来の不利を生む循環になります。この研究は、その循環がどの段階で起きるかを分解し、ルールで止められる場所を探そうとしています。", "unverified": "7つの命題の具体的な内容は抄録では未確認。実証データによる検証は行っていない。"}}, {"id": "pr24", "rank": 24, "headline": "NHS精神保健サービスのハイブリッド勤務の実態", "title": "Understanding Hybrid Working in NHS Mental Health Services: Implications for Productivity, Wellbeing and Workforce Sustainability", "url": "https://doi.org/10.21203/rs.3.rs-11268314/v1", "authors": "Sai-Bo Cheung ほか", "venue": "Research Square (In Review)", "date": "2026-11-05", "apa": "Cheung, S.-B., Nilforooshan, R., & Cropley, M. (2026). Understanding Hybrid Working in NHS Mental Health Services: Implications for Productivity, Wellbeing and Workforce Sustainability. https://doi.org/10.21203/rs.3.rs-11268314/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "英国NHSの精神保健サービスで、ハイブリッド勤務が職員のwell-being・働き方・定着にどう影響するかを質的に明らかにした（抄録）。", "p3": "イングランドの11の精神保健サービスの臨床・非臨床の職員21人に、2024年12月〜2025年2月に遠隔で半構造化面接を行い、再帰的テーマ分析をした（抄録）。", "p5": "「柔軟性・信頼・組織文化」と「生産性・well-being・定着」の2つのテーマが得られた。在宅は集中作業、職場は協働に向き、在宅は感情的に負担の大きい仕事からの休息になる一方、境界のあいまいさと連続するオンライン会議が過重労働の危険を生んだ（抄録）。", "fun": "在宅勤務は「サボりやすい」と思われがちですが、心のケアの現場で働く人にとっては、つらい話を聞き続ける仕事からひと息つける場所でもありました。一方で、家と職場の境目が消えると働きすぎにつながります。柔軟な働き方が上司からの信頼の表れとして受け止められ、ルールの運用が人によって違うと信頼が損なわれる、という点も身近な発見です。", "unverified": "抄録の事前登録番号は伏せ字（XXXXXX）で、登録内容は未確認。"}}, {"id": "pr25", "rank": 25, "headline": "変則交差点を運転者参加型のデジタルツインで評価", "title": "InterSim: Innovative Intersection Digital Twins for Human-in-the-Loop Driving Simulation", "url": "https://arxiv.org/abs/2611.05968", "authors": "Luyang Jiang ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Jiang, L., Wei, C., Li, Y., Wang, S., Zhou, Y., Yun, H., Liao, X., Pitts, B., & Wang, Z. (2026). InterSim: Innovative Intersection Digital Twins for Human-in-the-Loop Driving Simulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05968", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "Unityのゲームエンジンで変則的な交差点のデジタルツインを作り、人の運転者や自動運転アルゴリズムを同じ条件で走らせて評価できるシミュレータInterSimを示した（抄録）。", "p3": "道路管理者の設計・交通データから交差点のツインを作り結果を返すデジタルツインの循環と、人または自動運転が自車を操作する人間参加型の循環の2つを結んだ（抄録）。", "p5": "事例として、交錯を減らす交差点と標準の交差点の侵入後時間（PET）の分布を交通量別に比べる代理安全性の研究と、路車間情報を使うルールベースのエージェントと人のエコドライブを比べる研究を示し、排出と運転行動の違いを見いだした（抄録）。", "fun": "見慣れない形の交差点は、安全で効率的でも、最初は運転者が戸惑うかもしれません。実際に作って試すのは高くつくので、ゲームエンジンの中にそっくりの交差点を作り、人に運転してもらって確かめる、という発想です。人と自動運転を同じ条件で走らせて比べられる点も面白いところです。", "unverified": "事例研究の具体的な数値（PETの差や排出量）は抄録では未確認。"}}, {"id": "pr26", "rank": 26, "headline": "議員の株取引に委員会情報の優位はない", "title": "The Illusion of Informed Congressional Trading: Evidence from Committee Networks and Hearings", "url": "https://doi.org/10.2139/ssrn.7679885", "authors": "Yuan Zhou", "venue": "SSRN", "date": "2026-11-05", "apa": "Zhou, Y. (2026). The Illusion of Informed Congressional Trading: Evidence from Committee Networks and Hearings. https://doi.org/10.2139/ssrn.7679885", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "米議会議員が担当委員会に近い企業の株取引で超過収益を得ている証拠は見当たらないことを、LLMで企業と委員会の対応を測って示した（抄録）。", "p3": "LLMで企業の10-Kの事業概要を議会委員会の管轄に対応づけ、企業と議員の情報の近さを連続的な指標にした。公聴会の後の取引、委員会をまたぐ波及、コロナ禍のオンライン公聴会への移行（対面の情報共有への外生的ショック）も調べた（抄録）。", "p5": "担当分野に近い銘柄の取引でも超過収益はなく、公聴会の後も成績は改善せず、取引規模や報告の遅れを変えても同じだった。オンライン化の前後でも取引の成果に系統的な変化はなかった（抄録）。", "fun": "議員は法律づくりの過程で企業の事情に触れるので、株でもうけているのでは、という疑いはよく話題になります。この研究は、AIに企業の事業説明を読ませて「どの委員会と関係が深い会社か」を数値にし、その疑いを確かめました。少なくとも日常的な議会活動からは、もうけの証拠は出てこなかったという結果です。", "unverified": "標本期間と取引件数、LLMによる対応づけの精度は抄録では未確認。"}}, {"id": "pr27", "rank": 27, "headline": "小標本の表データをコピュラとVAEで合成", "title": "Copula and mixture prior variational autoencoders for small sample blasting fragmentation modelling", "url": "https://doi.org/10.31224/8715", "authors": "Paulo Lopes", "venue": "engrXiv", "date": "2026-11-05", "apa": "Lopes, P. (2026). Copula and mixture prior variational autoencoders for small sample blasting fragmentation modelling. https://doi.org/10.31224/8715", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "engrXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "観測の少ない発破破砕のデータで、コピュラと3種類の表データVAEによる合成データを比べ、混合事前分布のVAEが最も高い予測効用を示した（抄録）。", "p3": "3つの文献から集めた262件の破砕ベンチマークで、ガウス・t・クレイトンのコピュラと、標準・KLアニーリング・ガウス混合事前分布のVAEを比べた。生成器の学習前に実データの検証用を分け、尤度、MMD、埋め込み距離、合成で学習し実データで試す効用を組み合わせた（抄録）。", "p5": "混合事前分布のモデルが最も高く、R²は約0.736、RMSEは約1.698（破砕指標の単位）だった。アニーリングは標準モデルより効用を改善し、コピュラ由来の入力はおおむね性能を下げた。実データだけの予測器に対する上積みや未知の鉱山への移転は示していない（抄録）。", "fun": "データが少ない分野では「本物そっくりの偽データを作って増やせばよいのでは」と考えたくなります。この研究は、偽データが本物に似ているかと、偽データで学んだ予測が本物に通用するかは別の問いだ、と分けて確かめています。著者が自分の結果の限界まで細かく書いている点も誠実で面白いところです。", "unverified": "6変数の効用の枠組みとコピュラの8次元の食い違いは著者も限界として挙げており未解消。シードごとの結果は不完全と記載。"}}, {"id": "pr28", "rank": 28, "headline": "小規模事業の会計と税務で生成AIが失敗する点", "title": "Keeping the Human in the Loop: Failure Points of Generative AI in Small-Business Accounting and Tax Compliance", "url": "https://doi.org/10.37497/opsbrazil.51", "authors": "Edson Teles Victor", "venue": "Editora Alumniin", "date": "2026-11-05", "apa": "Victor, E. T. (2026). Keeping the Human in the Loop: Failure Points of Generative AI in Small-Business Accounting and Tax Compliance. https://doi.org/10.37497/opsbrazil.51", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "Editora Alumniinの記録で、抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、小規模事業の会計と税務申告で生成AIが失敗しやすい点を整理し、人が判断に関わり続ける必要を論じる研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名が問うのは、会計や税金の書類づくりに生成AIを使ったとき、どこで失敗しやすく、どこに人の目が欠かせないかという点です。計算が得意なはずのコンピュータに任せても人の確認がいる場面があるのか、という問いそのものが身近で面白いところです。", "unverified": "内容は題名からの推測で、手法・結果・掲載形態（論文か書籍の章か）は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "マグマ貫入による火山体斜面の不安定化を数値解析", "title": "Numerical Modeling of Volcanic Flank Instabilities Induced by Magmatic Intrusions", "url": "https://theses.hal.science/tel-05852863v1", "authors": "Michael Galarraga", "venue": "HAL", "date": "2026-11-05", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "HALに登録された博士論文の抄録を使用", "preprint": true, "short": true, "p1": "マグマの貫入が火山体の斜面をどう変形させるかを個別要素法（DEM）で再現し、メラピ火山の2020年の危機とセントヘレンズ山の1980年の崩壊の変形の特徴を説明した（抄録）。", "p3": "メラピではマグマで満たされた割れ目と溶岩ドーム、セントヘレンズでは潜在ドームを与えたDEMモデルを作り、変形の速さと動き方を観測と比べた（抄録）。", "p5": "メラピでは山頂から深さ約500 mまでの北西斜面の非弾性変形を再現し、すべりが止まって新たな安定状態に達する様子も示した。セントヘレンズでは北傾斜の主要なせん断断層、斜めのマグマの押しによる北斜面の膨らみ、山頂の地溝の形成を再現した（抄録）。", "fun": "火山の斜面は、内部にマグマが入り込むと押し出されるように動きます。メラピ火山では斜面が大きく動いたのに崩れず、セントヘレンズ山では山腹が丸ごと崩れました。粒の集まりとして山を計算すると、その違いを再現できるという点が面白く、斜面が大きく変形しても必ず崩れるとは限らないことも示しています。", "unverified": "博士論文で、モデルの粒子数や物性の設定は抄録では未確認。"}}, {"id": "pr30", "rank": 30, "headline": "地すべりの種類を自動分類するPythonソフト", "title": "Brief communication: Landsifier 2 – Python-based Software for Automated Landslide Type Classification", "url": "https://doi.org/10.5194/egusphere-2026-6509", "authors": "Nico Schlauf ほか", "venue": "EGUsphere", "date": "2026-11-05", "apa": "Schlauf, N., Bhuyan, K., Kapoor, M., Nava, L., Rana, K., Aral, A., & Ozturk, U. (2026). Brief communication: Landsifier 2 – Python-based Software for Automated Landslide Type Classification. https://doi.org/10.5194/egusphere-2026-6509", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EGUsphereの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "地すべり台帳の多角形データに移動形態と誘因の推定を加えるオープンソースのPythonライブラリLandsifier 2を公開した（抄録）。", "p3": "3次元の形状、位相的な記述子、設定できる分類器を使い、既存の誘因判定に移動形態の予測、利用者が定める分類、クラス確率付きの空間出力を加えた（抄録）。", "p5": "独立にラベル付けされた台帳と未記載の台帳への適用で柔軟性を示したと述べるが、分類精度の数値は抄録にない（抄録）。", "fun": "地すべりの地図には「どこで起きたか」は載っていても、「どう動いたか」「何が引き金か」が書かれていないことが多いそうです。この道具は、地すべりの形の立体的な特徴から、その種類を推定して地図に書き足します。形から過去の動きを推理する、という発想が面白いところです。", "unverified": "分類の正答率などの数値は抄録では未確認。"}}, {"id": "pr31", "rank": 31, "headline": "先行降雨と被災状況から見る地すべり死者", "title": "Antecedent rainfall patterns and situational vulnerability of victims of rainfall-induced fatal landslides in Pakistan", "url": "https://doi.org/10.5194/egusphere-2026-6563", "authors": "Shibiao Bai ほか", "venue": "EGUsphere", "date": "2026-11-05", "apa": "Bai, S., Zhu, W., Wang, X., & Zhou, P. (2026). Antecedent rainfall patterns and situational vulnerability of victims of rainfall-induced fatal landslides in Pakistan. https://doi.org/10.5194/egusphere-2026-6563", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EGUsphereの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "パキスタンの降雨による死者を伴う地すべりで、雨の指標は事象ごとの死者数を説明せず、死者は夜間・屋内に集中していたことを示した（抄録）。", "p3": "2004〜2024年の台帳で位置精度I〜IIの250件中213件をCHIRPSの日雨量（0.05°）と照合し、2018〜2024年の死者309人の個人属性を集めた。当日と7日間の先行雨量で4つの類型に分けた（抄録）。", "p5": "53.5%の事象はCHIRPSで当日雨量がゼロで、当日雨量の少ない類型CとDが86.4%を占めた。雨の指標は事象ごとの死者数と有意に相関しなかった。場所の分かる死者の66.0%は屋内、時刻の分かる死者の74.5%は夜間だった（抄録）。", "fun": "大雨の日に地すべりが起きる、と考えがちですが、この台帳では半数以上の事例で、推定された当日の雨量はゼロでした。それより前に降った雨の積み重ねが効いていたことになります。さらに、亡くなった人の多くは夜に家の中にいました。警報は雨の量だけでなく「夜に家にいる人をどう逃がすか」まで考える必要がある、という点が身近な発見です。", "unverified": "台帳は死者数の下限推定（複合災害で地すべりによる死者が埋もれる）と著者が注記。CHIRPSによる雨量の過小評価の程度は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "テンソルネットワークで計算力学の境界値問題を解く", "title": "A Tensor-Network Chebyshev-Galerkin Method for Boundary-Value Problems in Computational Mechanics", "url": "https://arxiv.org/abs/2611.06552", "authors": "Juan Jos\\'e Rodr\\'iguez-Aldavero ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Rodríguez-Aldavero, J. J., Velasco, Á. de la R., & García-Ripoll, J. J. (2026). A Tensor-Network Chebyshev--Galerkin Method for Boundary-Value Problems in Computational Mechanics (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06552", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "圧縮したテンソルトレイン（QTT）の形のままでChebyshev-Galerkin法の大域スペクトル系を組み立てて解く方法を示し、パラメータ空間全体の解を1回の計算で得られるようにした（抄録）。", "p3": "弱形式から出発し、変数係数の連成楕円型系、滑らかに写像した形状、DirichletとRobinの混合境界条件を扱い、テンソルネットワークの変分ソルバーに適した対称正定値系を得る。パラメータや確率的な入力は追加の座標として入れる（抄録）。", "p5": "線形弾性の3次元ベンチマークで誤差10^-8未満に達し、試した範囲でQTT差分法やFEniCSxのQ2/Q4有限要素を上回った。1.7×10^7通りの6パラメータの片持ち梁の設計検討を92秒の1回の計算で解き、確率座標10個の問題を全係数配列の2.4×10^6分の1のメモリで表した（抄録）。", "fun": "変数がとても多い問題は、ふつうはコンピュータのメモリに入りきりません。この研究は、データをぎゅっと圧縮した形のまま計算を進める工夫で、一千万通りを超える設計案を1回の計算でまとめて解きました。量子コンピュータの考え方を借りた計算法が、普通のコンピュータで構造の問題に役立つという点が面白いところです。", "unverified": "テンソルのランクや計算機環境の詳細は抄録では未確認。"}}, {"id": "pr33", "rank": 33, "headline": "適応的な領域分割でPINNの精度を上げる", "title": "Adaptive Domain Decomposition for Finite Basis Physics-Informed Neural Networks", "url": "https://arxiv.org/abs/2611.05659", "authors": "Sarah Helfert ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Helfert, S., Chen, W., Howard, A. A., Stinis, P., & Heinlein, A. (2026). Adaptive Domain Decomposition for Finite Basis Physics-Informed Neural Networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05659", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "解の特徴に合わせて計算領域の分け方を自動で学ぶことで、有限基底の物理情報ニューラルネット（FBPINN）の精度を上げる方法ADD-FBPINNを示した（抄録）。", "p3": "領域の分割をデータから学ぶPartition of Unity Network（POUNet）の分離可能な版を、利用者が分割を決めるFBPINNに組み合わせ、安定で幾何的に解釈できる分割を自動で得る（抄録）。", "p5": "2次元のHelmholtz方程式、多重スケールの特徴を持つ2次元のPoisson方程式、粘性Burgers方程式で、分割を固定したFBPINNより精度が改善したと述べる（抄録）。", "fun": "ニューラルネットで物理の方程式を解くとき、全体を一つで解くより、場所ごとに担当を分けた方がうまくいくことがあります。問題は「どこで区切るか」を人が決めていたことでした。この研究は、解の形を見ながら区切り方そのものをAIに学ばせる、という一段上の自動化が面白いところです。", "unverified": "精度の改善幅の数値と計算時間の比較は抄録では未確認。"}}, {"id": "pr34", "rank": 34, "headline": "ドリフト拡散で重い裾のPearson IV型分布を導く", "title": "A Drift-Diffusion Approach for Pearson Type IV Heavy-Tail Distributions", "url": "https://arxiv.org/abs/2611.06749", "authors": "Daniele Belardinelli ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Belardinelli, D., Benella, S., Stumpo, M., & Consolini, G. (2026). A Drift-Diffusion Approach for Pearson Type IV Heavy-Tail Distributions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06749", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "線形のドリフトと2次の拡散を持つ標準化したフォッカー・プランク方程式の定常解としてPearson IV型分布を導き、重い裾と非対称性の起源を分けて示した（抄録）。", "p3": "この分布が現れる必要十分条件を示し、線形-2次の構造は十分だが必要ではないことを示した。累積分布関数、モーメントの漸化式、歪度、尖度、最頻値の閉じた式も与えた（抄録）。", "p5": "重い裾は状態に依存する拡散の局所的な非線形の曲率から、非対称性はその勾配から生じ、対称な線形の復元ドリフトでも非対称な定常揺らぎが現れうることを示した。宇宙プラズマの乱流などを対象に挙げる（抄録）。", "fun": "ばねに引き戻されながら揺れる粒を考えると、ふつうは左右対称の釣鐘型の分布に落ち着きます。ところが、揺さぶられ方の強さが場所によって変わると、分布の片側が長く伸びたり、裾が重くなったりします。そのどちらがどの性質から生まれるのかを式で切り分けた点が面白いところです。", "unverified": "観測データへの当てはめの結果は抄録では未確認。"}}, {"id": "pr35", "rank": 35, "headline": "体積を保存する非線形自由表面波の有限要素法", "title": "A volume-conserving ALE continuous Galerkin method with residual-based Dirichlet--Neumann fluxes for nonlinear free-surface waves", "url": "https://arxiv.org/abs/2611.06408", "authors": "Fan Wang ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Wang, F., Xia, Y., & Xu, Y. (2026). A volume-conserving ALE continuous Galerkin method with residual-based Dirichlet--Neumann fluxes for nonlinear free-surface waves (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06408", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "2次元の完全非線形の自由表面ポテンシャル流れを、離散的な流体体積を保存するALE連続ガラーキン有限要素法で解く方法を示した（抄録）。", "p3": "現在の流体領域でアイソパラメトリック有限要素法により内部のポテンシャルを求め、残差に基づくDirichlet-Neumannフラックスで表面を発展させる。適合するメッシュ移動・表面射影・数値積分と組み合わせ、6次の表面散逸（任意）と4次のRunge-Kutta法を使う（抄録）。", "p5": "線形の自由表面波で期待どおりの空間収束を確かめ、平坦・湾曲した底面上の非線形波でメッシュへの依存性が小さいことを示した。回転する造波機の例で動く固体境界の扱いも示した（抄録）。", "fun": "水の表面の波を計算するとき、方法によっては誤差が積み重なって、いつの間にか水の量が増えたり減ったりしてしまうことがあります。この研究は、計算の仕組みそのものに「水の量は変わらない」というきまりを組み込みました。保存則を数値計算でも守らせる工夫が面白いところです。", "unverified": "誤差や収束次数の具体的な数値は抄録では未確認。"}}, {"id": "pr36", "rank": 36, "headline": "高コントラスト多孔質流れの粗空間を学習", "title": "Learning Coarse Spaces for Two-Grid Methods from Smoothed Errors with Applications to High-Contrast Porous Media Flow", "url": "https://arxiv.org/abs/2611.05837", "authors": "Chenglong Bao ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Bao, C., Cui, C., & Li, R. (2026). Learning Coarse Spaces for Two-Grid Methods from Smoothed Errors with Applications to High-Contrast Porous Media Flow (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05837", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "加法シュワルツ平滑化の有限ステップの誤差から二格子法の粗空間を学習し、パラメータが変わる高コントラストの多孔質流れでも粗空間を作り直す手間を減らす方法を示した（抄録）。", "p3": "訓練パラメータごとに平滑化後の誤差のスナップショットを離散エネルギー内積でPODして基準の粗空間を作り、基底に依存しない白色化した部分空間の損失で連続座標のニューラル生成器を学習する。粗空間のずれと二格子作用素の関係の摂動評価も示した（抄録）。", "p5": "高コントラストの界面問題、界面が動くDarcy流れ、非線形のForchheimer流れで有効な性能を示した。訓練格子の約264倍の自由度を持つ最も細かい試験格子で、FGMRESの反復回数はパラメータ別のPOD基準に近く、GenEOの空間と同程度だった（抄録）。", "fun": "地下の地層は場所によって水の通りやすさが大きく違い、流れの計算がとても遅くなることがあります。速く解くための「粗い近似の空間」を毎回作り直すのは大変なので、作り方をAIに学ばせ、見たことのない細かい格子にも使い回せるようにしました。学習に使った格子より約264倍細かい問題でも通用した点が面白いところです。", "unverified": "計算時間の削減の具体的な数値は抄録では未確認。"}}, {"id": "pr37", "rank": 37, "headline": "顧客対応LLMを既知の正解で出荷前に検査", "title": "QuasiPersona: behavioral release testing of LLM assistants on known-truth material from a business domain — method and a worked example", "url": "https://doi.org/10.5281/zenodo.23963747", "authors": "Terribile, Marco", "venue": "Zenodo", "date": "2026-11-04", "apa": "Terribile, M. (2026). QuasiPersona: behavioral release testing of LLM assistants on known-truth material from a business domain — method and a worked example (Version 1). Zenodo. https://doi.org/10.5281/ZENODO.23963747", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録（DataCite登録）の抄録を使用", "preprint": true, "short": true, "p1": "顧客対応に組み込まれたLLM助手を、依頼者の業務資料に基づく正解つきの問題で出荷前に検査する手法QuasiPersonaを示した（抄録）。", "p3": "6つの構成層×10の逸脱ガイドワード（HAZOP由来）の網羅行列、4つの妥当性尺度と14特性の行動的な性格検査、名前をつけた失敗キャラクター、検査に基づく指示の書き換え（療法）、未処置の複製に同じ質問票を与える双子対照を組み合わせた（抄録）。", "p5": "9つの欠陥を仕込んだ保険の助手で1,213回実行し、7つの欠陥と8つ目の一部を検出した（9つ目は一度も起動されなかった）。双子対照により、6特性の見かけの変化の多くは質問票の効果だと分かった（抄録）。", "fun": "AIの性格テストは、ふつうAIのモデルだけを相手に行います。でも実際の窓口のAIは、指示書や検索の仕組みと一体になって動いています。この研究は製品として組み上がった姿を丸ごと試験し、さらに「治療」の効果と「同じ質問に慣れた効果」を、手を加えない双子と比べて見分けました。発達心理学の双子の考え方を借りた点が面白いところです。", "unverified": "Zenodo上の未査読の文書。例は構成した保険の助手で、実際の運用データでの検証は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "ペルソナ付きの対話でコーディングエージェントを評価", "title": "PersonaCodeBench: Evaluating Coding Agents in Persona-driven Human-Interactive Sessions", "url": "https://arxiv.org/abs/2611.05739", "authors": "Haixin Wang ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Wang, H., Hou, J., Shen, H., Fan, W., Huang, W.-C., Zhu, Q., Li, W., Li, T., Yao, Y., Wang, R., Peng, Z., Jiang, W., Chen, Y., Liang, S., Li, H., Cao, D., Hu, X., Wu, S., Yang, C., … Li, X. (2026). PersonaCodeBench: Evaluating Coding Agents in Persona-driven Human-Interactive Sessions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05739", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "利用者の特性を検証できる義務に変え、ペルソナに基づく多ターンの対話でコーディングエージェントが個別の要求を満たせるかを評価するベンチマークを作った（抄録）。", "p3": "役割・技術力・対話の好み・実務上の制約からなるペルソナで、実装・権限・テスト・説明・納品の要求が段階的に現れる。制御器が利用者シミュレータの応答と要求の開示を管理し、完了の検証器とペルソナ充足の検証器が別々に評価する（抄録）。", "p5": "主要な最先端のエージェントをすべて評価して順位表を作り、詳細な実験分析で有効性を確かめたと述べる（抄録）。", "fun": "同じプログラムを頼むにしても、初心者と熟練者では欲しい説明の量も、任せてよい範囲も違います。この評価は、相手の人柄や事情に合わせた仕事ができるかを、正しく動くかとは別に採点します。AIに「相手を見て働く力」を求める点が面白いところです。", "unverified": "各エージェントの成績の数値は抄録では未確認。"}}, {"id": "pr39", "rank": 39, "headline": "道徳的選好に合わせたAI助言の効果", "title": "Strategically (Im)moral: Stated Preferences in Personalized AI Advice", "url": "https://doi.org/10.2139/ssrn.7679999", "authors": "Julia Elisabeth Rose", "venue": "SSRN", "date": "2026-11-05", "apa": "Rose, J. E. (2026). Strategically (Im)moral: Stated Preferences in Personalized AI Advice. https://doi.org/10.2139/ssrn.7679999", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "表明した道徳的選好に基づく個別化AI助言は、判断をAIに任せたときの道徳的な選択の減少を補えず、人は助言を自分に都合よくするために選好を弱めて答えることを示した（抄録）。", "p3": "事前登録した実験で1,250人が、寄付なしで利益を最大にする選択肢とUNICEFに寄付する費用の高い選択肢から、自分で選ぶか、利益最大化または寄付最大化のアルゴリズムに任せた。構造化質問と自由記述で選好を聞く個別化助言を比べた（抄録）。", "p5": "委任は道徳的な選択を約13ポイント減らし、個別化助言はこの減少を相殺しなかった。回答が助言に使われると知ると構造化質問での道徳的選好は弱まり、知らせないと道徳的な選択は委任なしの水準近くに戻った（抄録）。", "fun": "「あなたの価値観に合った助言をします」と言われると、人は自分に都合のよい助言が出るように、答えを少し曲げてしまうようです。しかも本人は自分の価値観に従っているつもりのまま。助言の仕組みを正直に知らせるほど入力がゆがむ、という板挟みが面白いところです。", "unverified": "SSRNの未査読論文。選好の弱まりの大きさの数値は抄録では未確認。"}}, {"id": "pr40", "rank": 40, "headline": "社会関係資本と信仰がメコンの気候適応を支える", "title": "Assessing social capital, religious beliefs, and climate resilience among rural coastal households in the Vietnamese Mekong Delta", "url": "https://doi.org/10.21203/rs.3.rs-11121634/v1", "authors": "Duong Hoang Loc ほか", "venue": "Research Square (In Review)", "date": "2026-11-04", "apa": "Loc, D. H., Duy, D. T., & Da, C. T. (2026). Assessing social capital, religious beliefs, and climate resilience among rural coastal households in the Vietnamese Mekong Delta. https://doi.org/10.21203/rs.3.rs-11121634/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ベトナム・メコンデルタの沿岸農家で、社会関係資本が宗教的信念を通じて宗教的実践と気候変動への適応を高めるという関係を示した（抄録）。", "p3": "沿岸の農家335世帯の調査データにAMOS 20の構造方程式モデリングを当てはめ、構造的・関係的・認知的な社会関係資本、宗教的信念、宗教的実践、適応の関係を検証した（抄録）。", "p5": "仮説としたすべての関係が統計的に有意で、社会関係資本は宗教的信念を高め、信念は宗教的実践と気候変動への適応を高めた（抄録）。", "fun": "地域で気候の変化に備えるとき、役所の計画だけでなく、人と人のつながりや信仰の場も支えになりえます。この研究は、近所づきあいや信頼が信仰を強め、それが適応の行動につながるという道筋を数字で確かめようとしました。宗教のネットワークを地域づくりの資源とみる視点が面白いところです。", "unverified": "横断調査のため因果の向きは確定できない（解釈）。各経路の係数の大きさは抄録では未確認。"}}, {"id": "pr41", "rank": 41, "headline": "認知機能が低下した高齢者の介護者のストレス", "title": "Title of the article: Perceived Stress, Coping Mechanisms, and Associated Factors Among Caregivers of Cognitively Impaired Elderly Attending a Rural Secondary Care Facility in Eastern India: A Mixed-Methods Study", "url": "https://doi.org/10.21203/rs.3.rs-11377226/v1", "authors": "Abhisek Mishra ほか", "venue": "Research Square (In Review)", "date": "2026-11-06", "apa": "Mishra, A., Tripathy, D., S, R. A., Parida, S., & Singh, A. (2026). Title of the article: Perceived Stress, Coping Mechanisms, and Associated Factors Among Caregivers of Cognitively Impaired Elderly Attending a Rural Secondary Care Facility in Eastern India: A Mixed-Methods Study. https://doi.org/10.21203/rs.3.rs-11377226/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "インド東部の農村の二次医療施設で、認知機能が低下した高齢者の介護者の54.3%が高い知覚ストレスを抱え、介護の自己効力感の低さが唯一の独立した予測因子だったことを示した（抄録）。", "p3": "高齢者クリニックで81人を連続的に募り、PSS-10、CSES-8、Lawton-BrodyのIADL尺度で測って多変量ロジスティック回帰を行い、6人の介護者への詳細面接（現象学的研究）と三角測量した（抄録）。", "p5": "高いストレスは自己効力感の欠如（中央値7）より無力感（中央値10）が主で、自己効力感の低さは高ストレスの可能性を大きく高めた（調整オッズ比14.71、95%CI 4.06–52.63）（抄録）。", "fun": "家族を介護する人のストレスは、介護の量の多さで決まると思いがちです。この調査では、「自分ならうまくやれる」という手応え（自己効力感）が低い人ほど、強いストレスを感じていました。介護の負担を減らすだけでなく、介護する人の自信を支えることも大切だ、という視点が面白いところです。", "unverified": "抄録はp値の途中で切れており、質的分析の結果は未確認。単一施設の小標本の結果。"}}, {"id": "pr42", "rank": 42, "headline": "地域の保健ボランティアが家族と保健をつなぐ", "title": "Community Health Cadres as Community Mediators in Supporting Families at Risk of Stunting: A Qualitative Study within Maternal and Child Health Services in Indonesia", "url": "https://doi.org/10.21203/rs.3.rs-10959086/v1", "authors": "Nintinjri Husnida ほか", "venue": "Research Square (In Review)", "date": "2026-11-05", "apa": "Husnida, N., Adnani, Q. E. S., Wiwaha, G., Rahmatina, A. N., & Hilmanto, D. (2026). Community Health Cadres as Community Mediators in Supporting Families at Risk of Stunting: A Qualitative Study within Maternal and Child Health Services in Indonesia. https://doi.org/10.21203/rs.3.rs-10959086/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "インドネシアの地域保健ボランティア（カデル）が、発育阻害のリスクがある家族と地域・母子保健サービスを文化に合わせてつなぐ媒介役を果たしていることを質的に示した（抄録）。", "p3": "バンテン州ルバック県の保健センターの管内で、カデル、親、医療従事者、地域の指導者、行政の代表を目的的に選び、詳細面接、フォーカスグループ、参与観察、フィールドノートをテーマ分析した（抄録）。", "p5": "家族への伴走に対する地域の認識と関与、媒介者としてのカデル、伴走の実践に影響する要因の3つのテーマが得られた。カデルは信頼される媒介者として意思疎通を助け、健康のメッセージを地域の文化に合わせて伝えていた（抄録）。", "fun": "子どもの成長を見守るとき、専門家より顔なじみの近所の人の言葉の方が届くことがあります。この研究のカデルはまさにその役回りで、家族と保健サービスの間を行き来しながら、健康の話を地域の習慣に合わせて伝えていました。制度のすきまを人のつながりが埋めている点が面白いところです。", "unverified": "参加者の内訳と、伴走の効果の量的な評価は抄録では未確認。"}}, {"id": "pr43", "rank": 43, "headline": "AIは社会科学の新しい実証基盤になる", "title": "AI for Society: A Selective Overview and Future Prospects", "url": "https://doi.org/10.2139/ssrn.7679985", "authors": "Jianqing Fan ほか", "venue": "SSRN", "date": "2026-11-05", "apa": "Fan, J., Liu, Q., Pei, R. R., & Wang, Z. (2026). AI for Society: A Selective Overview and Future Prospects. https://doi.org/10.2139/ssrn.7679985", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "AIが社会・経済の研究の新しい実証基盤になるという立場から、測定・予測・因果推論・政策学習に使う枠組みを選択的に概観した（抄録）。", "p3": "異質な記録を分析できる証拠に変える枠組み、潜在的な状態の高解像度の指標と代理変数の構築、予測シグナルの抽出、要因の帰属・因果推論・政策学習の支援を整理した（抄録）。", "p5": "応用として都市開発、金融の感情分析と不正検知、資産価格、経済予測、企業報告の監査を挙げ、転移学習、生成・エージェント型のシステム、AIが生む証拠の信頼性を今後の課題とした（抄録）。", "fun": "AIは社会を変える技術であると同時に、社会を調べる道具にもなります。画像や文章、プログラムなど、これまで数字にしにくかったものを測れるようにするからです。この論文は「調べる道具」としてのAIに絞って全体像を描いており、社会科学の研究のやり方そのものが変わりつつあることが分かります。", "unverified": "概観の対象とした文献の範囲と件数は抄録では未確認。"}}, {"id": "pr44", "rank": 44, "headline": "LLMで動くゲームNPCの研究を体系的に整理", "title": "LLM-based NPCs in Video Games: A Systematic Mapping Study", "url": "https://arxiv.org/abs/2611.05427", "authors": "Dilan Mian ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Mian, D., Bradbury, J., Guéhéneuc, Y.-G., Petrillo, F., & Politowski, C. (2026). LLM-based NPCs in Video Games: A Systematic Mapping Study (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05427", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMで動くゲームのNPC（プレイヤー以外のキャラクター）の研究を体系的にマッピングし、記憶の仕組みや応答時間など実装の現状を定量的に示した（抄録）。", "p3": "学術文献の377本から42本を選び、主な研究課題と10の下位課題、4つの主題軸で分析した（抄録）。", "p5": "短期記憶と世界状態への接地はそれぞれ60%と69%でほぼ標準だが、長期記憶（31%）、振り返り（38%）、検索拡張生成（14%）はまだ少なく、応答時間は2.6〜15秒だった。商用化の6つの構造的な障壁も挙げた（抄録）。", "fun": "ゲームの村人は、昔は決まったせりふしか言いませんでした。LLMを使えば自由に会話できますが、前に話したことを覚えている村人はまだ少数派で、返事に数秒から十数秒かかることもあります。夢の技術の「今の実力」を数字で示した点が面白いところです。", "unverified": "選定基準の詳細と、6つの障壁の具体的な内容は抄録では未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "計算社会科学・ネットワーク科学", "headline": "AIデータセンターの仮設タービンが州境を越える汚染", "title": "Temporary gas turbines powering a US AI data center created a cross-state air pollution hotspot", "url": "https://arxiv.org/abs/2611.06115", "authors": "Will W. Qiang ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Qiang, W. W., Huang, B., Liu, X., & Lee, H. F. (2026). Temporary gas turbines powering a US AI data center created a cross-state air pollution hotspot (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06115", "why": "2基の衛星観測から、AIデータセンター用の仮設ガスタービン群が周辺の二酸化窒素を約半分増やし、被害の多くが許可した州の外に及ぶことを示した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（結果の各節と図1・3・4の説明）を読んだ", "preprint": true, "p1": "人工衛星の観測から、米国のAIデータセンター（Colossus 2）に電力を送る仮設のガスタービン群が周辺の二酸化窒素（NO2）を約半分増やし、州境を越えた汚染のホットスポットを生んだことを示した（抄録、結果）。", "p2": "データセンターは現地のガスタービンを「一時的」として緩い規制で運転できるが、その大気汚染が誰にどれだけ及ぶかは観測で確かめられていなかった（抄録）。解釈：許可する州と被害を受ける州がずれると、規制の動機も弱まる。", "p3": "タービンから5 km以内のNO2対流圏カラムから、土地利用などが似るよう重み付けた10〜20 kmの参照域を引いた「近傍超過」を求め、2026年のTEMPOの毎時観測を2024年・2025年の同じ時刻・日と対にして比べ、TROPOMIと全米656の都市地点でも確かめた。排出は機種別の排出係数と運転率の在庫から推計し、InMAPとAP4で粒子状硝酸塩による早期死亡に換算した（結果、方法）。", "p4": "評価は、近傍超過の変化と95%信頼区間、全国での異常度スコア、フリートの容量との対応、ホットスポット内の人口構成、州別の健康被害の配分、選択的触媒還元（SCR）の費用便益である（結果）。", "p5": "4〜7月の近傍超過は1.10×10^15分子/cm²（95%CI 0.58〜1.66）増え、2024〜2025年平均の約49%にあたった。異常度スコアは4.63で、他の655地点は1.82を超えなかった。ホットスポットの約116,100人の65.5%がテネシー州に住み、76%が非ヒスパニックの黒人だった。早期死亡は年約4.4人・約4,900万ドルで、81.8%は許可したミシシッピ州の外に生じ、NOxの約98%はSCRのない機器が出していた（図1・3・4）。", "p6": "排出は工学的な在庫による推計で、健康被害は簡略化した大気質モデルに依存し、直接排出される粒子、オゾンへの寄与、NO2による喘息などは含まない（結果）。未査読のarXivプレプリントである。", "fun": "AIを動かす巨大なデータセンターは大量の電気を使います。この研究は、その電気を作るために置かれた「仮設」の発電機が、周りの空気を目に見えて汚していたことを宇宙から見つけました。しかも汚れは州の境を越え、許可を出した州ではなく隣の州の住民、とくに黒人の多い地域に集中していました。AIの便利さの陰にある地上の負担を衛星で測った点が面白いところです。", "unverified": "未査読のarXivプレプリント。SCRの費用便益比の数値（図4B）と感度分析の詳細は確認していない。"}}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "脆弱性発見AIの早期提供で防御側の発見が倍増", "title": "Does Frontier AI Strengthen Cyber Defense? Evidence from Project Glasswing", "url": "https://arxiv.org/abs/2611.06629", "authors": "Thomas Mosk", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Mosk, T. (2026). Does Frontier AI Strengthen Cyber Defense? Evidence from Project Glasswing (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06629", "why": "脆弱性発見用AIへの早期アクセスを自然実験とみなし、公開された脆弱性の全数データで防御企業・外部研究者・攻撃者への影響を推定した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（データ、企業レベルの推定、結論の節）を読んだ", "preprint": true, "p1": "脆弱性を見つけるAI（Claude Mythos Preview）への早期アクセスを米国の大手企業の一部にだけ与えたProject Glasswingを自然実験として使い、アクセスした企業の脆弱性の開示が中国企業に比べて2倍以上に増え、攻撃に使われた形跡はないことを示した（抄録、§4、§7）。", "p2": "防御側と攻撃側は同じソフトウェアの欠陥を探して競争しているが、最先端AIへのアクセスが防御を強めるのか、攻撃に情報を与えるのかは実証されていなかった（§1）。", "p3": "2024年1月〜2026年10月に公開された176,384件のCVEと中国国家脆弱性データベースの720件（計177,104件）を企業に割り当て、Glasswingの13社と、提供元の規約でアクセスできない中国企業267社の、開始前後6か月ずつの企業-月パネル（3,360企業-月）で差の差を推定した（式1、§3.1、§4）。", "p4": "識別の仮定は、Glasswingがなければ両群の開示が同じ比率で伸びたことで、事象研究で事前の乖離がないことを確かめ、1年前の偽の開始時点、非中国の大企業26社との比較、ロシア企業の追加、少数の処置群向けのIbragimov–Müllerのp値などで頑健性を調べた（§4）。", "p5": "Glasswing企業の開示は中国企業に比べて0.784対数ポイント（約120%）増え、事前の平均の月29件に対して1社あたり月約36件の追加にあたった（Ibragimov–Müllerのp=0.002、表2）。高影響の脆弱性は約150%増え、修正の速さは変わらなかった。外部研究者は処置企業のコードへの報告を約半分に減らして他社のコードに移り、開示から1か月以内に悪用された割合は約3分の2下がった（抄録、§5–6）。", "p6": "処置企業は13社と少なく大企業ばかりで、クラスター標準誤差が不確実性を過小評価しうると著者は述べる（§4）。発見ではなく修正が次の制約になりうること、修正が利用者に届く段階は観察していないことも挙げる（§7）。単著の未査読プレプリントである。", "fun": "ソフトウェアの弱点探しは、守る側と攻める側の早い者勝ちの競争です。この研究は、弱点を見つけるのが得意なAIを一部の大企業だけが先に使えるようになった出来事を「実験」に見立てて比べました。使えた企業は弱点の発見を倍以上に増やし、攻撃者に使われる前に直していました。弱点探しの名人だった外部の研究者が、ほかの会社のソフトに移っていった点も面白いところです。", "unverified": "未査読のarXivプレプリント（単著）。研究者レベルと攻撃者側の分析（§5–6）の推定値の詳細は確認していない。"}}, {"id": "pn03", "rank": 3, "field": "組織行動・心理的安全性", "headline": "Copilotの導入はチームの協調を乱しうる", "title": "When Copilot Joins the Crew: AI Adoption and Team Performance", "url": "https://doi.org/10.2139/ssrn.7679979", "authors": "Navid Asgari ほか", "venue": "SSRN", "date": "2026-11-05", "apa": "Asgari, N., Nayak, D., & Jacobs, C. (2026). When Copilot Joins the Crew: AI Adoption and Team Performance . https://doi.org/10.2139/ssrn.7679979", "why": "AI支援コードの判別器で個人の導入時期を特定し、一般化合成統制法でチームへの影響を推定した、職場でのAI導入の大規模な実証。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": true, "p1": "共同のソフトウェア開発で、メンバーの一人がGitHub Copilotを使い始めると、チームの成果（マージされたプルリクエスト）が約11%減ることを、一般化合成統制法で示した（抄録）。", "p2": "AIは個人の生産性を上げると考えられているが、その利得が既存のチームに引き継がれるかは不明だった。著者は、個人のAI導入がメンバーの慣れた作業の構成を変え、互いの貢献を予想し合う協調を乱しうると論じる（抄録）。", "p3": "AI支援のコードを判別する分類器で個人の導入時期を推定し、チームが導入したメンバーに初めて触れた時点を処置とした。導入前の履歴と一度も触れていないチームの軌跡から反実仮想の成果を作る一般化合成統制法で、その効果を推定した（抄録）。", "p4": "556チームの月次パネルを主な分析とし、6,801チームの広い標本で頑健性を確かめた。チームの規模・相互依存・時間帯の分散・レビューのネットワークの密度による違いと、作業の構成の乖離による媒介を分析した（抄録）。", "p5": "触れたことで成果は月に約3.6件のマージ済みプルリクエスト、触れる前の成果の11%減り、その損失は翌年にかけて広がった。損失は規模が大きく相互依存的で時間帯が分散したチームで大きく、レビューのネットワークが密なチームで小さかった。作業の構成の乖離が損失の一部を媒介した（抄録）。", "p6": "抄録の範囲では、分類器の精度と、処置の時点の推定誤差が結果に与える影響は確かめられない。解釈：公開のソフトウェア開発が対象で、ほかの職種のチームへの一般化は今後の課題である。", "fun": "AIの助手を使えば、一人ひとりの仕事は速くなるはずです。ところがチームで見ると、メンバーの一人が使い始めたことで、チーム全体の成果がむしろ1割ほど減っていました。いつもの役割分担や「あの人はこう動くはず」という読みが崩れるからだ、と著者は考えます。個人の得がチームの損になりうる、という逆説が面白いところです。", "unverified": "SSRNの未査読論文で抄録のみ読んだ。分類器の精度、対象のリポジトリの選び方、効果の信頼区間は未確認。"}}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "AIが組織の規模と生産性をどう変えるかのモデル", "title": "Organizing Intelligence", "url": "https://arxiv.org/abs/2611.05417", "authors": "Alex Imas ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Imas, A., Koh, A., & Legg, S. (2026). Organizing Intelligence (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05417", "why": "能力の再生産可能性と協調の限界という人とAIの違いから、企業内の分業と規模の均衡がどう変わるかを理論化した。", "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（抄録、モデルの節、結論）を読み、§4〜6の理論展開は概要のみ確認した", "preprint": true, "p1": "知能（目標を達成する能力）が組織の生産性にどう効くかのモデルを作り、AIの「協調」の能力が上がると企業規模のコース的な上限が破れ、市場がAI中心の巨大で集中した企業へ相転移しうることを示した（抄録、§5）。", "p2": "AIの進歩がいつ経済の変革につながるかは個々の課題での能力の測定では捉えにくく、能力が組織の中でどう組み合わさり、規模とともにどう伸びるかを扱う理論が必要だった（§1、§8）。", "p3": "人とAIのエージェントはn個の「有能さ」（コーディングなど）と1つの協調の能力を持ち、競合する企業に内生的に振り分けられる。有能さは生産性の水準を、協調は生産性が規模とともにどう伸びるかを決める。人の能力は型ごとに供給量が決まっている一方、AIは費用rで借りて無制限に複製できる（§3.1）。", "p4": "実証データは使わず、均衡の市場構造、生産性、雇用、賃金がAIの能力の向上とともにどう変わるかを理論的に分析し、数値例で示した（§4–6）。", "p5": "AIが平均的な人より有能でも、補完的な人からなる組織はAIに勝ちうる。AIの有能さの向上は企業内の構成を変えて企業規模を縮めうるが、協調の向上は規模の上限を破って相転移を起こす。人の雇用は、混合企業の中での置き換えなら緩やかに、AI企業が人の企業に勝つときは急に変わる。賃金の変化は技術効果と再編効果に分解でき、再編効果が技術効果を逆転させうる（抄録、§5–6）。", "p6": "結果はモデルの仮定（能力の表し方、機械が1種類であることなど）に依存する（§3）。著者は、AIの複製の数に対して産出がどう伸びるかを測るベンチマークと、人件費とAI支出の比率などの企業データの収集を提案している（§8）。未査読のarXivプレプリントである。", "fun": "AIが一人ひとりの人間より賢くなったら、会社は人を雇わなくなるのでしょうか。このモデルでは、得意分野の違う人たちを組み合わせたチームは、平均的な人より賢いAIにも勝てる場合があります。ところがAIどうしの「連携のうまさ」が少し良くなるだけで、ある点を境に巨大なAI中心の会社が市場を席巻することがあります。ベンチマークの点数では見えない転換点を示した点が面白いところです。", "unverified": "未査読のarXivプレプリント。均衡の存在と効率性の定理（§4）と数値例のパラメータは確認していない。"}}, {"id": "pn05", "rank": 5, "field": "因果推論", "headline": "複数アウトカムの処置効果をどう重み付けるか", "title": "Aggregating treatment effects across multiple outcomes", "url": "https://arxiv.org/abs/2611.05456", "authors": "Chun Pong Lau", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Lau, C. P. (2026). Aggregating treatment effects across multiple outcomes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05456", "why": "PCAや標準化平均など広く使われる集約法の欠点を示し、非負で精度を考慮した重みを統計的決定理論から導いた。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（文献調査の表1、既存手法の問題、決定問題の設定、応用の節）を読んだ", "preprint": true, "p1": "複数の結果変数を「犯罪」「富」のような抽象的な概念の指標にまとめて処置効果を推定するとき、広く使われる主成分分析（PCA）、逆分散行列重み（IVM）、標準化平均（SA）の欠点を示し、平均二乗誤差に基づいて非負の重みを選ぶ統計的決定理論の方法を提案した（抄録、§3、§5）。", "p2": "経済学のトップ5誌（2020〜2024年）では、結果の集約にPCAが30本、SAが33本、IVMが23本で使われている（表1）。しかしPCAは負の重みを与えうる、精度を最大にするとは限らない、符号の正規化に依存する、漸近分布が非標準になりうる、という予期しない欠点を持つ（§1.1、§3.1）。", "p3": "推定された処置効果のベクトルが正規分布に従うとし、和が1の非負の重みによる加重平均を報告する決定問題を立てる。結果の質（どの指標が概念をよく測るか）についての事前の情報を取り込み、最大リスクを最小にするミニマックス法と適応的な方法で重みを選び、推論の信頼区間も示した（§5.1–5.5）。", "p4": "応用として、ガーナのコロナ禍での低所得世帯への現金給付のランダム化実験（登録1,508世帯、処置771世帯）で、6つの結果からPCAで作った社会的距離の指標の分析を再検討した（§6）。", "p5": "2つの調査波の両方で同じ2つの結果がPCAで負の重みを受け、PCA指標への効果は個々の結果の効果の凸包の外に出た。最も負の効果を持つ「マスク着用」が最も負の重みを受けたためで、PCA指標は1%水準で有意だが、個々の結果で1%水準で有意なものはなかった（§6.1、図6）。", "p6": "提案法は効果の推定値の共分散が既知という仮定に立ち、結果の質についての事前情報の置き方に結論が依存しうる（§5.1–5.2）。単著の未査読のarXivプレプリントである。", "fun": "たとえば「治安が良くなったか」を確かめたいとき、いくつもの数字を一つの指標にまとめることがあります。ところが、よく使われるまとめ方（主成分分析）では、悪化した数字にマイナスの重みがかかって「改善」に数えられ、どの数字よりも大きな効果が出てしまうことがありました。まとめ方ひとつで結論が変わる怖さと、その直し方を示した点が面白いところです。", "unverified": "未査読のarXivプレプリント。提案法を応用に適用した推定値（§6の後半）は確認していない。"}}, {"id": "pn06", "rank": 6, "field": "因果推論", "headline": "感度分析の区間は真値を本当に覆うか検証", "title": "When the Bound Holds but the Benchmark Fails: A Pre-Registered Ground-Truth Audit of Interval Coverage and Sensitivity Analysis on ACIC 2022", "url": "https://doi.org/10.2139/ssrn.7680038", "authors": "Harsh Singh", "venue": "SSRN", "date": "2026-11-05", "apa": "Singh, H. (2026). When the Bound Holds but the Benchmark Fails: A Pre-Registered Ground-Truth Audit of Interval Coverage and Sensitivity Analysis on ACIC 2022. https://doi.org/10.2139/ssrn.7680038", "why": "真の効果が公開されたACIC 2022の全3,400コホートで、事前登録のもと区間推定と感度分析の被覆を確かめた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": true, "p1": "未測定の交絡に対する感度分析の限界（バウンド）が、交絡因子が本当に欠けているときに真値を覆うかを、真の効果が公開されたACIC 2022の全3,400コホートで事前登録して監査し、失敗の主因はバウンドではなく交絡の強さのベンチマーク推定にあることを示した（抄録）。", "p2": "感度分析は日常的に推奨されるが、真値が分かり交絡の欠落を制御できる設定がまれなため、その限界が実際に真値を覆うかはほとんど試されていなかった（抄録）。", "p3": "仮説・反証基準・推定量の仕様を推定前に固定してハッシュで記録し、主催者が設計した選択変数を調整から外して制御された未観測の交絡を作った。第2の交絡シナリオを負の対照、200のランダム化コホートを交絡なしの関門、事前期間のプラセボ結果を操作の検証に使い、Rosenbaumのバウンド、E値、欠落変数バイアスの頑健性値とバウンドを統合した感度の層を評価した（抄録）。", "p4": "評価の基準は、交差フィッティングした二重頑健推定量の名目95%区間の被覆率と、欠落変数バイアスのバウンドの被覆率、別のライブラリでの再現である（抄録）。", "p5": "名目95%区間の被覆は交絡のあるコホートで0.779にとどまり、観測された交絡が弱から強になるとさらに15.0ポイント下がった。選択変数を外すと交絡のある場面で被覆が25.0ポイント下がり、負の対照では下がらなかった。交絡のないランダム化群でも被覆は0.900で、標準誤差は約15%小さすぎた。外した変数の実測の強さで評価したバウンドは96.8%のコホートで真値を覆ったが、ベンチマークの手順は約500単位のコホートの46.5%で強さを0に切り詰めた（抄録）。", "p6": "抄録の範囲では、どのライブラリや推定量で何が起きたかの詳細は確かめられない。著者は、同じ構造のニューラルなCATE学習器の結論が実装によって逆転したことも報告している（抄録）。", "fun": "観察データで因果の効果を推定するとき、「見えていない要因がこれだけあっても結論は変わらない」と示す感度分析が勧められます。この研究は、答えが分かっている模擬データでその保証が本当に効くかを確かめました。保証の式自体はよく働く一方、「見えない要因の強さ」を見積もる手順が半分近くで0と判定して失敗していました。安全装置のどこが壊れやすいかを突き止めた点が面白いところです。", "unverified": "SSRNの未査読論文で抄録のみ読んだ。失敗が起きた推定量・ライブラリの特定と、事前登録の記録の所在は未確認。"}}, {"id": "pn07", "rank": 7, "field": "計算社会科学・ネットワーク科学", "headline": "名前から属性を推すLLMの回答拒否が偏りを生む", "title": "Who Gets Counted? Large Language Models, Informative Refusal, and Downstream Bias in Name-Based Demographic Classification", "url": "https://arxiv.org/abs/2611.06550", "authors": "Christian Pipal ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Pipal, C., Wack, M., & Vogel, E.-M. (2026). Who Gets Counted? Large Language Models, Informative Refusal, and Downstream Bias in Name-Based Demographic Classification (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06550", "why": "LLMによる名前からの性別・人種推定の精度の一部が回答の選択に由来し、下流の推定に偏りを生むことを3つのデータで示した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（データと方法、下流の偏りの節、考察）を読んだ", "preprint": true, "p1": "名前から性別・人種を推定するLLMの高い精度は、答えにくい名前で回答を控える「選択的なラベル付け」に一部由来し、欠けたラベルが下流の推定に偏りを生むことを、3つのデータで示した（抄録、§7–8）。", "p2": "研究者は名前から性別・人種・民族を推定するが、従来の道具は多様性研究が最も測りたい集団を誤分類する。LLMは多様な名前を正確に分類するとして提案されているが、その精度が研究者の報告する推定値まで引き継がれるかは確かめられていなかった（抄録、§2）。", "p3": "同じ名前を3つのLLM（Claude Haiku 4.5、Gemini 2.5 Flashなど）と7つの従来の道具で分類させ、ラベルを返した割合（被覆）、ラベルの正答率（条件付き精度）、両者の積（全体精度）を比べた（§3）。有権者の標本は党派の登録と年齢に結びつけ、ハードラベル、混同行列による補正、BISGの事後確率を使うBIRDiEなどで人種間の差の推定の偏りを調べた（§7）。", "p4": "データは、性別の頻度が分かる中国語のピンイン名10,000件、自己申告の人種を持つノースカロライナ州の有権者19,998人、研究補助者がアルゴリズムの予測を見ずに公開プロフィールから符号化した政治学の著者300人である（§3）。", "p5": "Haikuは有権者の半分にしかラベルを付けず、従来の道具も最も確信の高い半分に絞れ
