g/10.2139/ssrn.7556862", "authors": "Mário João Coutinho dos Santos ほか", "venue": "SSRN", "date": "2026-10-03", "why": "EUの非金融企業12万社超の動的部分調整モデルで、地経学的な分断リスクの高まりが目標レバレッジへの調整速度の低下と結びつくことを示した。"}, {"id": "pn10", "rank": 10, "field": "経済学", "headline": "19世紀末の中東株式市場を月次データで再構築", "title": "Beyond the Core: Stock-Market Development and Performance in the Middle East, 1872–1914", "url": "https://doi.org/10.2139/ssrn.7557354", "authors": "Ali Tuncer", "venue": "SSRN", "date": "2026-10-03", "why": "アレクサンドリア・カイロ・イスタンブールの株式市場の規模・構成・収益率を新しい月次の証券データで再構築し、外国資本に関する法制度が周辺市場と世界市場の連動を形作ったことを示した。"}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "米中関税の激化と国家の株価下支えの効果", "title": "State backstops and the episodic repricing of tariff exposure: Evidence from Chinese equities across sequential U.S.–China trade-war escalations", "url": "https://doi.org/10.2139/ssrn.7560586", "authors": "Ling Yang", "venue": "SSRN", "date": "2026-10-04", "why": "3度の関税の激化をイベントスタディで比べ、標的企業への価格付けの変化と、国家による株価の下支えが損失を数日で圧縮したこと、民間企業への割引が現れたことを示した。"}, {"id": "pn12", "rank": 12, "field": "機械学習", "headline": "摂食の乱れを『状態の誤り』と『学習の誤り』に分ける", "title": "Faulty States, Faulty Learning: Distinct Routes to Dysregulated Feeding in Homeostatic Reinforcement Learning", "url": "https://doi.org/10.2139/ssrn.7560808", "authors": "Charitha Palika ほか", "venue": "SSRN", "date": "2026-10-04", "why": "恒常性の強化学習モデルで、教師なしに空腹・満腹に当たる内部表現が生じ、表現の歪みとTD誤差の偏りという別々の原因が似た摂食の乱れを生むことを示した。"}, {"id": "pn13", "rank": 13, "field": "統計学", "headline": "情報量で次の測定位置を選ぶベイズ逐次推定", "title": "An Adaptive Bayesian Framework for Gamma Characterization of Radioactive Waste Drums Using OpenMC Response Modeling and Information-Guided Detector Positioning", "url": "https://doi.org/10.2139/ssrn.7560243", "authors": "Ayman Abu Ghazal ほか", "venue": "SSRN", "date": "2026-10-04", "why": "モンテカルロで作った検出器の応答とベイズ逐次推定を組み合わせ、期待情報利得で次の検出角度を選ぶことで、測定点を減らしつつ放射性廃棄物ドラム内の線源の位置と放射能を推定した。"}, {"id": "pn14", "rank": 14, "field": "統計学", "headline": "極端な気象が野生集団の生存の遺伝分散を変える", "title": "Extreme climatic events shape adaptive potential by altering genetic variance for adult survival in a wild population", "url": "https://doi.org/10.64898/2026.10.02.755590", "authors": "Paul Acker ほか", "venue": "bioRxiv", "date": "2026-10-04", "why": "ヨーロッパヒメウの25年分の生存と家系のデータで、環境の厳しさによって生存の相加遺伝分散が変わることを定式化して推定し、進化的な応答への含意を示した。"}, {"id": "pn15", "rank": 15, "field": "統計学", "headline": "βサラセミア保因者の分布を地理統計で高解像度推定", "title": "Large-scale modelling of β-thalassaemia carrier prevalence: geostatistical predictions and population estimates from a global evidence base", "url": "https://doi.org/10.64898/2026.10.01.26363283", "authors": "Mikaella Kontopoulou ほか", "venue": "medRxiv", "date": "2026-10-04", "why": "25か国の保因率の記録をベイズ地理統計モデルで統合し、保因率が高い地域と保因者が多い地域が一致しないことと、追加調査を優先すべき医療機関を示した。"}, {"id": "pn16", "rank": 16, "field": "交通・都市計画", "headline": "ソウルの脱炭素投資の効果は大半が市外に及ぶ", "title": "Assessing Inter-regional Spillovers and Budget Optimization in Urban Energy Planning: A Case Study of Seoul's Green Transition", "url": "https://doi.org/10.2139/ssrn.7560860", "authors": "Jiwoo Shin ほか", "venue": "SSRN", "date": "2026-10-04", "why": "多地域産業連関表と制約付き最適化でソウルのエネルギー計画を評価し、財政中立の予算再配分で全国の生産は増えるが、ソウル市内では生産と雇用が減ることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "ソウル市の第6次地域エネルギー計画（2025〜2045年）を財政中立の予算再配分で賄った場合の全国的な経済効果と、その地域的な偏りを示した（未査読）。", "p3": "2020年の多地域産業連関表（MRIO）で韓国17地域への波及を分析し、財政中立と部門ごとの再配分の上限を課した優先度つき制約付き最適化で、マクロ経済効果を最大にする予算の組み替えを求めた（抄録）。", "p5": "外部借入なしの再配分で計画期間の累積の純生産は5,388百万ドル増えたが、その大部分はソウル市外に生じ、ソウル市内は純減となった。雇用は70,286人年の純減で、主にソウル市内の建設・土木など労働集約的な部門の予算削減による（抄録）。", "fun": "ある都市が自分のお金で脱炭素を進めると、国全体ではプラスになるのに、その都市自身は生産と雇用が減ってしまう、という皮肉な結果です。投資の効果は他の工業地域の製造業に波及し、削られた建設工事は地元の雇用を多く生んでいたためです。お金の流れが地域をまたいでどう回るかを、産業のつながりの表で追った点が面白いところです。", "unverified": "最適化で選ばれた具体的な予算配分と、部門ごとの上限の値は未確認（本文を入手できず）。"}}, {"id": "pn17", "rank": 17, "field": "交通・都市計画", "headline": "新駅周辺の新住民ほど公共交通を使う（バンコク）", "title": "Travel Behavior Differences and Determinants of Public Transport Adoption Among Newcomers and Long-Term Residents Surrounding Newly Expanded BTS Stations in Bangkok", "url": "https://doi.org/10.2139/ssrn.7556991", "authors": "Cheunnapa Cheausuwantavee ほか", "venue": "SSRN", "date": "2026-10-03", "why": "バンコクの延伸駅周辺で新住民と長期居住者の移動行動を比べ、新住民の方が公共交通を使いやすく、利便性・歩きやすさ・駐車・費用が両者の利用に効くことを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "バンコクのBTSグリーンラインの延伸駅周辺で、新しく転入した住民と長く住む住民の移動行動と公共交通の利用要因を比べた（未査読）。", "p3": "4つの駅周辺の住民への質問紙調査を、記述統計、二項ロジスティック回帰、交互作用の分析で分析した（抄録）。", "p5": "新住民は若く、学歴・所得がやや高く、駅近くのコンドミニアムに住む傾向があり、長期居住者より公共交通を使いやすかった。利便性・歩きやすさ・駐車の可否・費用の手頃さは両者の利用に効き、長期居住者は運行情報、新住民はフィーダー（支線）サービスを重視した（抄録）。", "fun": "新しい駅ができても、昔から住む人と新しく引っ越してきた人では使い方が違います。新住民は駅の近さを選んで住むのに対し、昔からの住民は家族が多く車も持っていて、駅を使う理由が少ないのです。同じ駅でも「誰のための駅か」で必要な工夫が変わることを示した点が面白いところです。", "unverified": "回答者数と回帰係数の大きさは未確認（本文を入手できず）。"}}, {"id": "pn18", "rank": 18, "field": "交通・都市計画", "headline": "蟻コロニー最適化で電気バスの充電所を配置", "title": "Enhancing Urban Transportation in Intermediate Cities: Optimal Sizing of Electric Bus Charging Stations using Ant Colony Optimization", "url": "https://doi.org/10.2139/ssrn.7556688", "authors": "Xavier Serrano-Guerrero ほか", "venue": "SSRN", "date": "2026-10-03", "why": "エクアドル・クエンカの運行データ、変電所の容量制約、時間帯別の料金を一つの最適化にまとめ、電気バスの充電所の配置と規模を決めた。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "エクアドル・クエンカの電気バスについて、実際の運行データ・変電所の容量制約・時間帯別の料金を一つの最適化にまとめ、充電所の配置と規模を決めた（未査読）。", "p3": "蟻コロニー最適化（ACO、蟻の採餌をまねた探索法）を複数の群れの大きさで試し、年換算費用が最小になる配置を探した（抄録）。", "p5": "5,000匹の構成が最も安定に収束し年換算費用も最小だった。最適解は45か所の充電所で公共交通の日々の充電需要を満たし、すべての変電所の負荷を定格の55%未満（最大52.8%）に保った。規制料金の下で充電料金0.15ドル/kWhのとき便益費用比は2.32だった（抄録）。", "fun": "電気バスの充電所をどこにいくつ置くかは、組み合わせが膨大で、全部を試すことはできません。そこで、蟻が匂いを頼りに近道を見つけるしくみをまねた計算法で答えを探しました。変電所に無理をさせない条件まで入れて、中規模都市の現実の計画に落とし込んだ点が面白いところです。", "unverified": "比較した他の最適化手法と、需要データの期間は未確認（本文を入手できず）。"}}, {"id": "pn19", "rank": 19, "field": "機械学習", "headline": "係数のエネルギーに応じて拡散モデルの雑音を配分", "title": "Energy-Conditioned Noise Schedule and Whitening for Spectral Diffusion", "url": "https://doi.org/10.2139/ssrn.7557215", "authors": "Bata Vasic ほか", "venue": "SSRN", "date": "2026-10-03", "why": "変換領域の拡散モデルで、係数のエネルギーに応じた雑音スケジュールと白色化を導入し、DDPM・DDIMの手順を変えずに生成画像の品質指標を改善した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "変換領域で画像を生成する拡散モデルで、加える雑音の量を係数ごとのエネルギーに応じて配分し、白色化と組み合わせることで生成品質を上げた（未査読）。", "p3": "全体のスペクトル白色化と、変換係数ごとのエネルギーと画像ごとのエネルギーの時間経路に応じて雑音を調整するスケジュールを組み合わせた。前向き過程はガウス遷移と閉形式の周辺分布を保ち、標準のDDPM・DDIMの手順と構造を変えずに使える（抄録）。", "p5": "CIFAR-10で、小型のDCTdiff U-Netの変種のFréchet Inception Distance（FID）を142.48から100.45に下げた（抄録）。", "fun": "拡散モデルは、画像にだんだん雑音を足して壊す過程を逆にたどって絵を作ります。普通の写真は、なだらかな成分にエネルギーが多く、細かい模様の成分は弱いという偏りがあります。この偏りに合わせて「どの成分をどの順で壊すか」を調整したのが工夫で、音の低音と高音を別々に扱うイコライザーに似た発想が面白い点です。", "unverified": "比較対象が小型の変種に限られ、大型モデルや他のデータセットでの結果は未確認（本文を入手できず）。"}}, {"id": "pn20", "rank": 20, "field": "機械学習", "headline": "脳の高次トポロジーが自然な情動の動きを捉える", "title": "Higher-order topology uncovers the multidimensional dynamics of naturalistic emotion", "url": "https://doi.org/10.64898/2026.09.26.754452", "authors": "Lorenzo Zaffina ほか", "venue": "bioRxiv", "date": "2026-10-04", "why": "映画視聴中のfMRIを時間分解した高次トポロジーで解析し、領域群の相互作用が細かな情動を、ペアの結合が覚醒度をよく予測することを3つのデータセットで示した。", "explain": {"basis": "抄録", "basis_note": "bioRxivに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "映画視聴中の脳活動を、2領域間の結合ではなく領域群の「高次トポロジー」で捉えると、細かな情動の状態をよりよく追えることを示した（未査読）。", "p3": "計2.5時間を超える14本の映画を見ている間のfMRIを、50の情動特徴で連続的に注釈し、時間分解した高次トポロジー（群レベルの相互作用を表すホモロジーの骨格）と2領域間の結合を比べ、3つの独立したデータセットで予測の移り具合を調べた（抄録）。", "p5": "ホモロジーの骨格は繰り返す情動状態を最もよく追い、細かな情動の構成を最もよく予測した。情動を快・覚醒・支配の次元に圧縮すると、覚醒の信号は2領域間の結合でよく捉えられ、データセット間でも最も安定に移った（抄録）。", "fun": "感情は脳のどこか1か所ではなく、多くの領域が同時に関わって生まれると考えられています。この研究は、2つの領域のつながりだけを見るのをやめ、3つ以上の領域がまとまって作る「形」を数学の道具（トポロジー）で捉えました。細やかな気持ちの違いは集団の形に、興奮の度合いは2つのつながりに表れるという役割分担が面白い点です。", "unverified": "参加者数と予測精度の数値は未確認（本文を入手できず）。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "大学から実務へ移った研究者は共著者が大きく入れ替わる", "title": "Crossing sectors, reconfiguring ties: Academic mobility and collaboration networks", "url": "https://doi.org/10.2139/ssrn.7560836", "authors": "Junyi Xiang ほか", "venue": "SSRN", "date": "2026-10-04", "why": "経済学・政策分野の約20万本の論文から大学外へ移った研究者を特定し、大学間の移動者と比べて、移動後に大学外の共著者の割合が大きく増えることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "経済学・政策分野で大学から大学外へ移った研究者の共著関係がどう組み替わるかを、大学間の移動者と比べて示した（未査読）。", "p3": "2000〜2025年の経済学・政策の論文202,002本から大学から大学外への移動1,045件を特定し、大学を移った研究者とマッチングして比べた。相手の構成の変化、つながりの置き換え、移動者の知人同士の協働を区別した（抄録）。", "p5": "大学外の共著者の割合の変化は、マッチングした全標本で0.176、雇用が確認された31人で0.215と推定された。移動者の変化のおよそ39%は移動先の組織の外の共著者によるもので、大学に戻った人では大学外の共著者の割合が下がった（抄録）。", "fun": "研究者が大学から政府や企業へ移ると、大学と実社会をつなぐ橋になると期待されます。しかしこの研究では、移った人の共著相手が大きく入れ替わり、大学に戻ると大学外の相手が減ることが分かりました。橋になれるかは、新しい人脈を作るだけでなく古い人脈を保てるかにかかっている、という見方が面白い点です。", "unverified": "マッチングの方法と推定の不確かさ（信頼区間）は未確認（本文を入手できず）。"}}, {"id": "pn22", "rank": 22, "field": "経営学", "headline": "環境イノベーション企業ほどデジタル効率が高い", "title": "When green interacts with digital: Eco-innovation adoption, technological gaps, and sectoral heterogeneity", "url": "https://doi.org/10.2139/ssrn.7560382", "authors": "Consuelo Calafat-Marzal ほか", "venue": "SSRN", "date": "2026-10-04", "why": "スペイン企業247社でDEAのメタフロンティアを使い、環境イノベーションを行う企業ほどデジタル効率が高く技術ギャップが小さいこと、改善の経路が異なることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "スペイン企業247社で、環境イノベーションを行う企業ほどデジタル化の効率が高く、効率の改善に必要な手立ても異なることを示した（未査読）。", "p3": "3部門の企業に、非凸のメタフロンティアを持つデータ包絡分析（DEA、投入と産出から効率を測るノンパラメトリック法）を適用し、効率、技術ギャップ、効率的フロンティアへの改善経路を、環境イノベーションの有無と部門で比べた（抄録）。", "p5": "環境イノベーション企業はデジタル効率が高く技術ギャップが小さかった。その企業はデジタルの産出（導入と便益の実現）を増やす必要があり、そうでない企業は態度・経営の支援・能力などの組織的な投入の不整合に非効率があった。差は技術の複雑な部門、特に農業食品で大きかった（抄録）。", "fun": "環境に力を入れる会社は、デジタル技術もうまく使いこなしている、という「グリーン」と「デジタル」の相乗効果を示した研究です。効率の悪さの原因が、環境に積極的な会社では「デジタルの成果をもっと出すこと」、そうでない会社では「組織の土台づくり」と違うのが面白い点です。同じ遅れでも処方箋が違うことを示しています。", "unverified": "効率値の具体的な水準と、投入・産出の変数の測り方は未確認（本文を入手できず）。"}}, {"id": "pn23", "rank": 23, "field": "組織行動・心理的安全性", "headline": "グラミン銀行の再成長は預金中心の事業モデル革新", "title": "FROM MICROCREDIT TO FINANCIAL INCLUSION: LESSONS FROM GRAMEEN BANK’S SECOND-STAGE BUSINESS MODEL INNOVATION", "url": "https://doi.org/10.2139/ssrn.7560834", "authors": "Andrew Spicer ほか", "venue": "SSRN", "date": "2026-10-04", "why": "内部の証言と40年分の財務・業務データから、グラミン銀行の再成長を、地元の小口預金を融資と支店拡大の原資に据えた事業モデルの構造的な革新で説明した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "グラミン銀行の過去20年の再成長を、創業時のモデルの継続、商業化への使命の逸脱、事業モデルの構造的な革新の3つの説明で比べ、構造的な革新が最もよく当てはまることを示した（未査読）。", "p3": "事業モデル革新の進化論的な視点に立ち、内部関係者の証言と40年分の財務・業務データを組み合わせて3つの説明を評価した（抄録）。", "p5": "指導者たちは小口預金に予想外に深い市場があることを見いだし、地元の預金を少額融資と支店拡大の原資の中心に据えて外部資本への依存を減らした。預金と融資を補い合う要素とみる包摂的な銀行モデルとして説明した（抄録）。", "fun": "貧しい人への少額融資で知られるグラミン銀行が、なぜ多くの模倣者が失敗した中で生き残ったのかを問う研究です。答えは「貸す」ことより、貧しい人の小さな「預金」を集めて資金源にしたことでした。創業者が当初想定しなかった仕組みが後の成長を支えたという点は、成功例をまねるときの落とし穴を示していて面白いところです。", "unverified": "預金の伸びの具体的な数値と、比較した他の機関の事例は未確認（本文を入手できず）。"}}, {"id": "pn24", "rank": 24, "field": "機械学習", "headline": "DNA配列だけからG4構造の占有を予測", "title": "G4SCOPE identifies sequence features and epigenetic contexts of chromatin G-quadruplexes", "url": "https://doi.org/10.64898/2026.09.28.748631", "authors": "Armaghan Sarvar ほか", "venue": "bioRxiv", "date": "2026-10-04", "why": "畳み込みと自己注意を組み合わせた深層学習で、DNA配列からクロマチン上のG4（グアニン四重鎖）の占有を予測し、別の細胞系統へも移せることを示した。", "explain": {"basis": "抄録", "basis_note": "bioRxivに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "DNA配列だけから、細胞内のクロマチン上で実際に形成されるG4（グアニン四重鎖）の占有とCUT&Tagの高解像度のプロファイルを予測する深層学習の枠組みを作った（未査読）。", "p3": "同じ遺伝的背景でTP53・BRCA1・BRCA2を欠損させたヒト乳腺上皮細胞の系列のG4のCUT&Tagデータで、畳み込みによるモチーフ学習とトランスフォーマーの自己注意を組み合わせたマルチタスクのモデルを学習させた（抄録）。", "p5": "モデルは、試験管内で折りたたむ可能性があるだけのGC含量の合う領域とクロマチン上のG4を区別し、別の乳腺系統やK562細胞へも移せた。BRCA1欠損ではクロマチン上のG4密度が全体に増え、BRCA2欠損では染色体全体で減ることを示した（抄録）。", "fun": "DNAは二重らせんだけでなく、Gが多い場所では4本鎖の結び目のような構造（G4）を作ることがあります。どこに実際にできるかは配列だけでは決まらないと考えられてきましたが、この研究は配列の「文法」からかなり予測できることを示しました。がんに関わる遺伝子の違いで、この結び目が増えたり減ったりするのも面白い点です。", "unverified": "予測精度の数値と、学習データの規模は未確認（本文を入手できず）。"}}, {"id": "pn25", "rank": 25, "field": "機械学習", "headline": "3つの視点の対照学習で薬と微生物の関連を予測", "title": "Drug-microbe association prediction using graph neural network with triple-view contrastive learning", "url": "https://doi.org/10.2139/ssrn.7560374", "authors": "Zahra Mohammadi ほか", "venue": "SSRN", "date": "2026-10-04", "why": "薬と微生物をそれぞれ3つの視点で表すグラフニューラルネットと対照学習で関連を予測し、関連行列から作る類似度特徴が評価を歪めうる点にも注意を促した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "薬と微生物をそれぞれ3つの視点で表すグラフニューラルネットと対照学習で両者の関連を予測し、関連行列から作った類似度を特徴に使うと評価が甘くなりうる点も示した（未査読）。", "p3": "薬を3種類の化学的な表現、微生物を3種類の生物学的な表現で表し、組み合わせごとの3つの分岐でグラフ畳み込みを行い、射影ヘッドで分岐間の表現をそろえた。MDAD・aBiofilm・DrugVirusで5分割交差検証、独立の保留検証、外部データベースで評価した（抄録）。", "p5": "AUC/AUPRはMDADで0.940/0.948、aBiofilmで0.926/0.931、DrugVirusで0.878/0.870だった。予測対象の関連から作るGIP類似度を加えると精度は上がるが、それは評価手順への感度によるもので性能の向上ではないと注意した（抄録）。", "fun": "薬と腸内細菌などの微生物の相性を、実験の代わりにAIで予測する研究です。面白いのは、成績を上げる近道として使われてきた特徴が、実は答えの一部をこっそり見ているようなもので、見かけの成績を良くしているだけだと指摘した点です。答えを知っていればテストの点が上がるのと同じで、評価の仕方の大切さを示しています。", "unverified": "既存手法との比較の詳細は未確認（本文を入手できず）。"}}, {"id": "pn26", "rank": 26, "field": "経済学", "headline": "マーコウィッツ理論を一般の二次リスクへ拡張", "title": "Generalizing Markowitz Portfolio Optimization by a Quadratic Risk Measure", "url": "https://econpapers.repec.org/RePEc:arx:papers:2608.24449", "authors": "Ignas Gasparavi\\v{c}ius ほか", "venue": "RePEc NEP", "date": "2026-09-07", "why": "分散を任意の正定値の二次リスクに置き換えても効率的フロンティアや最適ポートフォリオが閉形式で得られ、接点ポートフォリオと最大シャープ比ポートフォリオが一致しない新しい現象を示した。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに掲載された抄録を使用", "preprint": true, "short": true, "p1": "マーコウィッツの平均・分散ポートフォリオ理論の主要な結果が、分散を一般の厳密に凸な二次のリスク尺度に置き換えても閉じた式で得られることを示した（未査読のワーキングペーパー）。", "p3": "共分散行列を任意の対称正定値行列に置き換え、一次と定数の項も加えた枠組みで、取引費用の最適化、ベンチマーク相対の最適化、共分散の正則化、ファクターモデルなどを含むようにした（抄録）。", "p5": "効率的フロンティア、最小リスク、最大シャープ比、資本市場曲線、接点、最大効用の各ポートフォリオの閉形式を得た。古典的な理論と違い、接点ポートフォリオと最大シャープ比ポートフォリオが一致しない新しい幾何的な現象を示し、数値例で式を確かめた（抄録）。", "fun": "資産をどう組み合わせると、同じリスクで最も儲かるかを答えるのがマーコウィッツの理論です。この研究は、リスクの測り方を少し一般化しても答えが式で書けることを示しましたが、そのとき古典理論では同じだった2つの「最適な組み合わせ」がずれるという意外な現象が現れました。前提を少し広げると当たり前だった一致が崩れるのが面白い点です。", "unverified": "数値例の内容と、2つのポートフォリオのずれの大きさは未確認（本文を入手できず）。"}}, {"id": "pn27", "rank": 27, "field": "機械学習", "headline": "転移学習で少ない飛行データから性能モデルを同定", "title": "A Transfer Learning Neural Network–Based Method for Aircraft Specific Excess Power Model Identification", "url": "https://doi.org/10.2139/ssrn.7560478", "authors": "Shiyun Wang ほか", "venue": "SSRN", "date": "2026-10-04", "why": "理論データで学習したモデルを少数の目標データで微調整し、目標データだけで学習したモデルより誤差を大きく減らした。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "機体ごとの比余剰パワー（エネルギーを増やす余裕）のモデルを、理論データで事前学習して少数の飛行シミュレーションデータで微調整することで、少ないデータから精度よく同定できるようにした（未査読）。", "p3": "広い理論データから5入力の比余剰パワーのモデルを作り、目標機体の限られたデータで微調整した。同じ構造と学習設定で、目標データだけで学習したモデルと比べ、600点のラテン超方格標本で誤差を測った（抄録）。", "p5": "微調整はRMSEを27.18m/sから3.00m/s（MAE 2.24m/s、R² = 0.64、RMSEの88.95%減）に下げ、目標データだけのモデルの5.27m/s（R² = −0.11）を上回った。上昇と加速の課題でも同じ方向の優位を確かめた（抄録）。", "fun": "新しい飛行機の性能モデルを作りたくても、実際の飛行データは少なく、しかも実際に飛べる範囲に偏っています。そこで、理論で作った大量の「教科書」で先に学ばせ、少ない実データで仕上げるという、人の学び方に似た手順をとりました。教科書だけでも実データだけでもだめで、組み合わせると誤差が大きく減ったのが面白い点です。", "unverified": "対象とした機体の種類と、理論データの作り方は未確認（本文を入手できず）。"}}, {"id": "pn28", "rank": 28, "field": "機械学習", "headline": "強化学習で集中流動性の提供戦略を学ぶ", "title": "Concentrated Liquidity Provision: a Reinforcement Learning Perspective", "url": "https://econpapers.repec.org/RePEc:arx:papers:2608.19389", "authors": "Georgios Chionas ほか", "venue": "RePEc NEP", "date": "2026-09-07", "why": "分散型取引所での集中流動性の提供を確率インパルス制御として定式化し、解釈可能な強化学習の方策が損益分布の左裾を縮めることを示した。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに掲載された抄録を使用", "preprint": true, "short": true, "p1": "分散型取引所の集中流動性（価格帯を指定した流動性の提供）で、いつ持ち高を組み替えどの価格帯に資金を置くかを確率インパルス制御として定式化し、解釈可能な強化学習で解いた（未査読のワーキングペーパー）。", "p3": "UniswapV3のような集中流動性を持つ定積型市場で、流動性提供者の逐次的な意思決定を強化学習で解き、得られた方策を基準のエージェントや市場構造の文献の高度なエージェントと比べた（抄録）。", "p5": "学習した方策は、価格のずれ、組み替えの費用、不確実性、在庫の偏り、リスク選好の違いに応じて流動性を配分し、損益分布の左裾を縮め、不確実性が高いときの大損を避けた（抄録）。", "fun": "暗号資産の取引所では、個人が「この価格の範囲なら取引に応じます」と資金を預けて手数料を稼ぎます。範囲を狭くすると稼ぎは増えますが、価格が外れると損をしやすくなります。この研究は、範囲の動かし方をAIに学ばせ、しかもその判断の理由が読み取れるようにしました。大損を避ける慎重さが学ばれた点が面白いところです。", "unverified": "比較対象との具体的な損益の差は未確認（本文を入手できず）。"}}, {"id": "pn29", "rank": 29, "field": "機械学習", "headline": "物理誘導NNで地盤の地震増幅を高速に予測", "title": "Physics-Guided Neural Networks (PgNN) for Seismic Site Amplification: A Scalable Framework for Seismic Microzonation", "url": "https://doi.org/10.2139/ssrn.7560921", "authors": "ZAHAFI Amina ほか", "venue": "SSRN", "date": "2026-10-04", "why": "20万の確率的な地盤モデルで学習した物理誘導ニューラルネットで、1次元の地震波伝播による地盤増幅を高速に再現する代理モデルを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "1次元の地震波伝播による地盤の増幅を高速に予測する物理誘導ニューラルネット（PgNN）の代理モデルを作り、地盤の分類と都市計画向けの評価ツールにまとめた（未査読）。", "p3": "基盤の動的性質を地盤モデルごとに確率的に与える手法を導入し、改良した薄層法で作った20万の確率的な地盤モデルで、なめらかな活性化関数Swishを使う深いネットを学習させた（抄録）。", "p5": "全体の決定係数R²は0.9915で、スペクトルの偏りなく増幅曲線全体を再現したとする。基本共振周波数と最大増幅をほぼ即座に評価するGUIと、Vs30（深さ30mまでの平均S波速度）の弱点を補う2基準の地盤分類を示した（抄録）。", "fun": "同じ地震でも、柔らかい地盤の上では揺れが何倍にも増幅されます。その計算は重く、街全体の何千地点で行うのは大変でした。この研究は物理の知識を取り入れたAIで、それを一瞬で計算できるようにしました。地盤ごとに「揺れやすい周波数」が分かれば、建物と地盤の共振を避ける計画に使えるという点が面白いところです。", "unverified": "実際の観測記録での検証の有無は未確認（本文を入手できず）。"}}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "重要鉱物の採掘郡、賃金の差は固定効果で消える", "title": "Critical Minerals Mining and County-Level Economic Outcomes in the United States: A Fixed-Effects Panel Analysis", "url": "https://doi.org/10.2139/ssrn.7560740", "authors": "Herbert Adu-Gyamfi ほか", "venue": "SSRN", "date": "2026-10-04", "why": "米国3,213郡の2006〜2025年のパネルで、州・年の固定効果を入れると鉱物採掘郡の賃金プレミアムは消え、雇用規模の差だけが残ることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "米国で重要鉱物の採掘地を持つ郡が他の郡と経済的に違うかを、2006〜2025年の3,213郡のパネルで検証し、素朴な比較の多くが州の違いを反映していたことを示した（未査読）。", "p3": "USGSの鉱物採掘地の記録と労働統計局の郡別の雇用・失業・賃金のデータで、時間で変わらない採掘地の有無について、素朴なプールした推定と州・年の固定効果の推定を比べた。二重機械学習と保留郡での予測でも確かめた（抄録）。", "p5": "素朴な比較では全鉱物で賃金が高かったが、州・年の固定効果で賃金プレミアムは消えた。残ったのは、金や重要鉱物の採掘地を持つ郡の雇用規模の大きさと、ウラン採掘郡の失業率の高さ（州を1つずつ除く検定とボンフェローニ補正でも残る）の2つだった（抄録）。", "fun": "「鉱山のある町は賃金が高い」という見かけの関係が、実は「鉱山の多い州は賃金が高い」というだけだった、という結果です。同じ州の中で比べると賃金の差は消え、代わりに冷戦期のウラン採掘地の失業の多さが浮かび上がりました。比べる相手を正しく選ぶと見える景色が変わる、という統計の基本を示す例として面白い点です。", "unverified": "雇用規模と失業率の差の大きさの数値は未確認（本文を入手できず）。"}}, {"id": "pn31", "rank": 31, "field": "機械学習", "headline": "地球観測の基盤モデルで地中海の樹種を分類", "title": "Earth Observation foundation models in mapping dominant tree species in heterogenous Mediterranean forests", "url": "https://doi.org/10.2139/ssrn.7557268", "authors": "Shirong Cai ほか", "venue": "SSRN", "date": "2026-10-03", "why": "3種類の地球観測の埋め込みとSentinel-2の特徴を5,176の森林調査区で比べ、TESSERAの埋め込みが最も高い分類性能を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "地球観測の基盤モデルの埋め込み3種類と従来のSentinel-2の特徴を、スペイン・カタルーニャの15の樹種・属の分類で比べ、埋め込みの種類で効果が大きく違うことを示した（未査読）。", "p3": "TESSERA・AlphaEarth・EarthIndexの埋め込みとSentinel-2の合成特徴を、5,176の位置つき森林調査区を正解として、ランダムフォレスト・XGBoost・SVMで層化10分割交差検証により評価した（抄録）。", "p5": "TESSERAとXGBoostの組み合わせが最も良く（マクロF1 0.647）、Sentinel-2よりマクロF1が0.088高かった。AlphaEarthが2位（0.607）、EarthIndexはSentinel-2を下回った（0.516）。誤りの多くはマツ属とナラ属の近縁・共存種の間で起きた（抄録）。", "fun": "衛星画像を大量に学習したAIは、地表を数字の列（埋め込み）に要約してくれます。それを使えば森の木の種類も見分けやすくなるはずですが、この研究では、どの基盤モデルを使うかで従来の方法より良くも悪くもなりました。似た仲間の木ほど見分けにくいのは人間と同じで、面白い点です。", "unverified": "地図化した結果の検証方法は未確認（本文を入手できず）。"}}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "裾の重い分布でEVaR最小ポートフォリオを構築", "title": "Entropic Value-at-Risk portfolio optimization for tempered stable L\\'evy processes", "url": "https://econpapers.repec.org/RePEc:arx:papers:2608.18022", "authors": "Jaehyung Choi", "venue": "RePEc NEP", "date": "2026-09-07", "why": "テンパード安定レヴィ過程の下でEVaR（エントロピー的VaR）を評価する式を導き、2000〜2026年の米国セクターETFの検証で一部の配分がCVaR配分よりシャープ比で上回った。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに掲載された抄録を使用", "preprint": true, "short": true, "p1": "裾の重いテンパード安定レヴィ過程に従う資産収益について、EVaR（エントロピー的VaR、裾のリスクの上限を与える指標）を最小にするポートフォリオを、資産ごとの当てはめから直接計算できるようにした（未査読のワーキングペーパー）。", "p3": "多変量正規テンパード安定の構成と独立成分への分解の2つで、ポートフォリオのキュムラント母関数と重みに依存する積率母関数の定義域を導き、最小EVaRと2つのエントロピー型の収益・リスク比のポートフォリオを作った（抄録）。", "p5": "2000〜2026年の米国セクターETFの配分をローリングで標本外検証し、いくつかのエントロピー型のポートフォリオが、対応するCVaRポートフォリオや標準的な配分より高い実現シャープ比を示した（抄録）。", "fun": "株価は時々、正規分布では考えにくいほど大きく動きます。この研究は、そうした「まれな大暴落」を表す裾の重い分布の下で、損失の裾を抑える指標を、銘柄ごとの性質から組み合わせ全体まで式で計算できるようにしました。毎回全体の分布を当てはめ直さなくてよい計算の近道が面白い点です。", "unverified": "シャープ比の差の大きさと、取引費用の扱いは未確認（本文を入手できず）。"}}, {"id": "pn33", "rank": 33, "field": "組織行動・心理的安全性", "headline": "不確実な中で明快さを求められるリーダーの葛藤", "title": "The Certainty Paradox in Leadership: Adaptive Thinking and Demands for Clarity Under Uncertainty", "url": "https://doi.org/10.2139/ssrn.7560747", "authors": "Dr. Stavroula Kalogeras", "venue": "SSRN", "date": "2026-10-04", "why": "管理職61人を含む調査で、多くが複数の視点を検討している一方、曖昧な状況で明快な答えを求められていると答えたことを示し、「早すぎる認識の閉鎖」という概念を提起した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "不確実な状況でリーダーが複数の解釈に開かれていることと、明快な答えを求められることの緊張を「確実性の逆説」として理論化し、問題は明快さの要求そのものより早すぎる認識の閉鎖だと論じた（未査読）。", "p3": "逆説理論、組織のセンスメイキング、認識的動機づけと認知的閉鎖の研究に基づいて概念を作り、専門職102人のうち管理職・役員・創業者61人の調査データを分析した（抄録）。", "p5": "93.4%が単純な二者択一を見抜き、91.8%が決定前に競合する見方を検討すると答えた一方、78.7%が曖昧な状況で明快な答えを求められ、考える時間を支える環境があると感じたのは41.0%だった。適応的な思考は細やかな思考を重んじる環境と正の相関（r = .50）を示し、明快さの期待とは有意な関係がなかった（抄録）。", "fun": "リーダーには「早く決めろ」と「よく考えろ」が同時に求められます。この研究は、問題は決断を求められること自体ではなく、考えるのをやめるのが早すぎることだ、と整理しました。調査では多くの管理職がじっくり考えたいのに、その時間を許す職場は半分に届きませんでした。考える余裕を職場が認めるかどうかが鍵だという点が面白いところです。", "unverified": "調査の抽出方法と、相関の分析に使った尺度の詳細は未確認（本文を入手できず）。"}}, {"id": "pn34", "rank": 34, "field": "組織行動・心理的安全性", "headline": "教員の集団的創造性を育てる多層の支援枠組み", "title": "A framework for fostering teacher collective creativity and innovation", "url": "https://doi.org/10.2139/ssrn.7560835", "authors": "Weijing Han", "venue": "SSRN", "date": "2026-10-04", "why": "文書分析から、国の政策・組織の構造・チームの実践を統合した、教員の集団的な創造性と革新を支える枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "教員の集団的な創造性と革新を育てる仕組みを、国の政策・組織の構造・チームの実践を統合した多層的な枠組みとして示した（未査読）。", "p3": "文書分析の手法で、教員の集団的な創造性と革新がどの領域に現れ、どのような支援で育つかを整理した（抄録）。", "p5": "集団的な創造性と革新は、教育課程の開発、教授法の革新、研究力の育成、社会貢献の領域に現れ、それを育てるには国の政策・組織の構造・チームの実践を統合したトップダウンの多層的な支援が必要だとした（抄録）。", "fun": "創造性というと個人のひらめきを思い浮かべがちですが、この研究は先生たちが「チームとして」新しいことを生み出す力に注目しました。国の方針から学校の組織、日々のチーム活動までが噛み合ってはじめてその力が育つ、という見取り図を描いた点が面白いところです。", "unverified": "分析した文書の種類・国・件数は未確認（本文を入手できず）。"}}, {"id": "pn35", "rank": 35, "field": "経済学", "headline": "強化学習で多段の指値を出すマーケットメイク", "title": "Multi-Level Market Making with Reinforcement Learning", "url": "https://econpapers.repec.org/RePEc:arx:papers:2608.18195", "authors": "Patrick Cheridito ほか", "venue": "RePEc NEP", "date": "2026-09-07", "why": "指値板でのマーケットメイクを、注文量の配分をロジスティック正規分布で表す強化学習として定式化し、3種類の模擬市場で性能を示した。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに掲載された抄録を使用", "preprint": true, "short": true, "p1": "指値板でのマーケットメイクについて、複数の価格段に大きさの異なる成行・指値注文を出しながら在庫を管理する強化学習の枠組みを提案した（未査読のワーキングペーパー）。", "p3": "注文の配分を多変量ロジスティック正規分布で表し、長さの変わる注文の集合の特徴をディープセットの符号化器で固定長の表現にまとめ、最適方策を変えないポテンシャル型の報酬整形で学習を速めた（抄録）。", "p5": "無作為に取引するノイズトレーダー、瞬間的な出来高の偏りに反応する戦術的トレーダー、指数加重した偏りの方向に取引する戦略的トレーダーからなる3つの模擬市場で性能を示した。数値は抄録にない（抄録）。", "fun": "マーケットメイカーは、売りたい人と買いたい人の間に立って、いつでも売買に応じることで利ざやを稼ぎます。この研究は、どの値段にどれだけ注文を置くかという組み合わせの多い判断を、注文の束をまとめて扱える仕組みでAIに学ばせました。相手のタイプによって市場の振る舞いが変わる中で戦略を学ぶ点が面白いところです。", "unverified": "収益や在庫の指標の具体的な結果と比較対象は未確認（本文を入手できず）。"}}, {"id": "pn36", "rank": 36, "field": "経営学", "headline": "戦略の『美しさ』を相互作用が生む形として理論化", "title": "Strategic Aesthetics: The Aesthetics of Strategic Form Emerging from Strategic Interaction", "url": "https://doi.org/10.2139/ssrn.7553760", "authors": "Takashi Oyama", "venue": "SSRN", "date": "2026-10-04", "why": "自律的な主体の相互作用から生じる「戦略の形」を美的分析の対象とする理論枠組みを提案し、統合と関係の変容という2つの生成原理を区別した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "戦略や戦術が「美しい」と評されるとき、その対象は何かを理論化し、自律的な主体の相互作用から生じる「戦略の形」とその美的知覚を分析する枠組みを提案した（未査読）。", "p3": "戦略の形を、主体・行動・制約・環境条件の相互作用から時間をかけて実現する関係の秩序あるパターンと定義し、生成原理として「統合」と「関係の変容」を区別した。カンナエ、レウクトラ、ガウガメラ、アウステルリッツ、ハメル、対馬沖の6つの歴史的事例に比較適用した（抄録）。", "p5": "多くの複雑な出来事が少数の関係で理解できるようになる「認知的圧縮」が美的知覚に寄与しうる一方、偶然・摩擦・失敗を歴史理解から消し、実際以上のまとまりの印象を生みうると論じ、意図された形・実現した形・知覚された形を区別した（抄録）。", "fun": "名勝負の作戦を「美しい」と感じるのはなぜかを考えた研究です。複雑な出来事が少ない関係で説明できるとき人は美しさを感じるが、その分、後から見ると偶然や失敗が消えて実際以上に筋書き通りに見えてしまう、という指摘が面白い点です。数学の証明やスポーツの名場面を美しいと感じる理由にも通じます。", "unverified": "6事例それぞれの分析の詳細は未確認（本文を入手できず）。"}}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "NURBS曲面の当てはめを学習で洗練し表現を選ぶ", "title": "GeoDeep-NURBS: Geometry-Aware Neural Refinement and Adaptive Rational NURBS Fitting for Freeform Surface Reconstruction", "url": "https://doi.org/10.2139/ssrn.7560354", "authors": "Deepika Saini", "venue": "SSRN", "date": "2026-10-04", "why": "有理NURBSの当てはめに学習による局所修正と検証に基づく表現選択を組み合わせ、合成データと実計測で誤差を減らした。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "自由曲面の再構成で、有理NURBSの当てはめに学習による制御点の局所修正と検証に基づく表現の選択を組み合わせ、CADで編集できる形を保ったまま誤差を減らす枠組みを示した（未査読）。", "p3": "12入力のニューラル方策で制御点を範囲内で更新し、目的関数に基づく決定的な採否で最適化を安定させた。合成データ6,048件・適応実験360件・スタンフォードの2形状の距離計測480件で、複数の乱数とブートストラップで不確かさを評価した（抄録）。", "p5": "学習による修正は利得順の修正と同程度の精度で、曲率情報の寄与が確かめられた。検証に基づく表現の適応が最も効き、平均RMSEを合成実験で15.23%、Stanford Bunnyの一部で9.9%減らした。最適な表現は形状によって異なった（抄録）。", "fun": "工業製品の滑らかな曲面は、NURBSという「制御点」で形を決める数式で表されます。この研究は、点群から曲面を作るとき、制御点の動かし方をAIに手伝わせ、どれくらいの細かさで表すかも検証データで選ばせました。AIを使いつつ、人が後から編集できる数式の形を保った点が面白いところです。", "unverified": "既存の曲面再構成手法との比較の詳細は未確認（本文を入手できず）。"}}, {"id": "pn38", "rank": 38, "field": "組織行動・心理的安全性", "headline": "供給網での立場が変わると信頼の優先順位も変わる", "title": "A Staged Model for Trust in Agri-Food Blockchain Ecosystems: Extending Value-Sensitive Design with Contingency Theory", "url": "https://doi.org/10.2139/ssrn.7560442", "authors": "Pouyan Jahanbin ほか", "venue": "SSRN", "date": "2026-10-04", "why": "Qメソドロジーで農産物の供給網の専門家の優先順位を4つの場面で調べ、同じ人でも供給網での立場によって重視する価値が変わることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "農産物の供給網でブロックチェーンによる信頼に関係者が何を重視するかは、組織の役割で固定されたものではなく、供給網のどの段階にいるかで変わることを示した（未査読）。", "p3": "Qメソドロジー（主観的な優先順位の構造を捉える方法）で、生産、加工・包装、流通・保管、小売の4つの場面について業界の専門家の優先順位を調べ、因子分析で類型を抽出し、サンキー図で同じ人の場面間の移り変わりを追った（抄録）。", "p5": "4段階で12の実務家の類型が見つかり、同じ参加者が供給網での立場によって頻繁に類型を移っていた。価値は役割に固定された特性ではなく文脈で活性化されるとし、価値感応設計を段階に応じたモデルへ拡張した（抄録）。", "fun": "同じ人でも、農家として話すときと、お店の立場で話すときでは、大事にすることが変わります。この研究は、新しい技術を受け入れてもらうには「誰か」だけでなく「どの場面か」に合わせた設計が必要だと示しました。人の価値観を固定した性格のように扱わない点が面白いところです。", "unverified": "参加した専門家の人数と国・地域は未確認（本文を入手できず）。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "GANと領域適応で橋梁監視データの異常を判別", "title": "Bridge data anomaly detection based on improved WGAN-GP and CBAM-Dense-DANN", "url": "https://doi.org/10.1088/1361-665x/aeaf92", "authors": "Xu-Lei Zhao ほか", "venue": "Smart Materials and Structures", "date": "2026-10-02", "citescore": 6.1, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr02", "rank": 2, "headline": "対話型AIの導入企業ほど10-Kが読みやすい", "title": "How conversational AI shapes the readability of 10-K reports", "url": "https://doi.org/10.1108/imds-11-2025-1599", "authors": "Junru Zhang ほか", "venue": "Industrial Management & Data Systems", "date": "2026-10-03", "citescore": 10.1, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2}, {"id": "jr03", "rank": 3, "headline": "データ取引所の設立が実体的利益調整を抑える", "title": "Can data factor marketization curb real earnings management? Evidence from the establishment of data asset trading platforms", "url": "https://doi.org/10.1016/j.iref.2026.105916", "authors": "Ningzhi Wang ほか", "venue": "International Review of Economics & Finance", "date": "2026-09-29", "citescore": 8.3, "ci モード形の同定）と有限要素モデルの更新で推定した研究とみられる。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「梁が荷重で傷んでいく様子を、揺らして測る振動から見抜けるか」です。コンクリートの内部の傷みは外から見えませんが、硬さが落ちると揺れの周波数がわずかに変わります。その小さな変化を計算模型と照らし合わせて傷みの度合いを逆算する、という発想が面白い点です。", "unverified": "載荷の段階、計測した振動特性の変化、モデル更新の手法はすべて未確認（題名のみ）。"}}, {"id": "jr17", "rank": 17, "headline": "高級ホテルの口コミは体験後の評価が大半", "title": "Post-consumption evaluations in luxury hospitality: a qualitative analysis of online customer reviews", "url": "https://doi.org/10.1108/ihr-07-2026-0076", "authors": "Özden ÖZLÜ", "venue": "International Hospitality Review", "date": "2026-10-03", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "イスタンブールの高級ホテル5軒のTripAdvisorの口コミ250件を質的に分析し、口コミのほとんどが体験後の評価（SMOT）で、事前の期待は体験後の評価の中でしか語られないことを示した。", "p3": "口コミを「最初の真実の瞬間（FMOT）」と「二番目の真実の瞬間（SMOT）」の枠組みでコード化し、主題分析で各口コミを一つの主要な主題に割り当てた（抄録）。", "p5": "250件中238件がSMOT、12件がFMOTとSMOTの両方で、FMOTだけの口コミはなかった。13の主題のうち、サービス品質、個別化されたサービスと従業員への評価、再訪意図と愛着、推奨と電子口コミが目立ち、形ある豪華さより人の対応が語られた（抄録）。", "fun": "高級ホテルの口コミで語られるのは、豪華な部屋や設備より「スタッフがどう接してくれたか」でした。さらに、体験後に書かれた感想が次にそのホテルを選ぶ人の最初の印象になるという、口コミがバトンのように客から客へ渡る仕組みを提案した点が面白いところです。この仕組み自体は今後の検証が必要だと著者は述べています。", "unverified": "主題ごとの口コミ数の内訳は未確認（本文を入手できず）。"}}, {"id": "jr18", "rank": 18, "headline": "検査の所要時間超過を待ち行列理論で損失換算", "title": "B-019 Operational and Economic Impact of Turnaround Time Target Exceedance in a High-Volume Automated Clinical Laboratory", "url": "https://doi.org/10.1093/clinchem/hvag086.352", "authors": "KyungYi Kim ほか", "venue": "Clinical Chemistry", "date": "2026-10-04", "sjr": 1.721, "citescore": 9.8, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Clinical Chemistry誌の学会抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "月118万件超の検査を扱う大病院の自動化検査室で、所要時間（TAT）の目標超過を、救急外来の処理能力と在院日数の損失に換算し、年間の機会費用を推計した（学会抄録）。", "p3": "リトルの法則（滞留量＝到着率×滞在時間）に基づく業務管理の枠組みで、カーネル密度推定でTATの分布を求め、救急検査は60分、通常検査は120分を目標に超過分を救急外来・入院・外来の経路ごとに配分し、救急受診1件・入院1日あたりの貢献利益で損失を評価した（抄録）。", "p5": "救急検査の42.1%が60分を超え（平均8.4分の超過）、通常検査は35.6%が120分を超えた。救急検査の超過は年に約255,500時間の遅れ（10,646患者日）に当たり、救急外来の能力の損失と在院日数の延長による年間の機会費用は基本ケースで2,000万ドルを超えると推計された（抄録）。", "fun": "1件あたり数分の検査の遅れでも、病院全体で毎月100万件以上が積み重なると、年間で大勢の人の働きに相当する時間になります。この研究は、工場の在庫管理に使う公式を病院に当てはめ、患者を「在庫」、待ち時間を「流れの時間」とみなして損失をお金に換算しました。平均ではなく「目標を超えた割合」に注目した点が面白いところです。", "unverified": "推計の前提（在院日数の延長の仮定など）の感度分析は未確認（学会抄録のみ）。"}}, {"id": "jr19", "rank": 19, "headline": "能動学習キュバチャでベイズモデル更新を効率化", "title": "Bayesian model updating via streamlined Bayesian active learning cubature", "url": "https://doi.org/10.1016/j.ymssp.2026.114995", "authors": "Pei-Pei Li ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-10-04", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（出版社の本文は取得できず）", "preprint": false, "short": true, "p1": "ベイズモデル更新で、対数尤度関数をガウス過程で近似する能動学習の手順を簡素化し、モデルの評価回数と計算時間を精度を落とさずに大きく減らす方法（SBALC）を提案した。", "p3": "モデルエビデンスの推定をベイズ・キュバチャの問題とみなし、対数尤度にガウス過程の事前分布を置く。事後のガウス過程の平均と分散だけを使い、プラグイン推定量、その期待絶対誤差の上界、停止基準と学習関数を導いた。事後分布の標本も副産物として得る（抄録）。", "p5": "4つの数値例で既存の方法と比べ、精度を落とさずにモデルの評価回数と計算時間を大幅に減らせたとする。具体的な削減率は抄録にない（抄録）。", "fun": "観測データから模型のパラメータを確率的に推定する「ベイズ更新」は、重い計算を何万回も繰り返すのが難点です。この研究は、計算結果の地図を少ない試行で賢く作り、次にどこを計算すべきか、いつやめてよいかを、地図の平均と不確かさだけから決めるようにしました。計算をやめる判断に誤差の上限という根拠を持たせた点が面白いところです。", "unverified": "削減率の数値と、4つの数値例の内容は未確認（本文を入手できず）。"}}, {"id": "jr20", "rank": 20, "headline": "AI顧客対応の失敗がブランド関係を損なう", "title": "The dark side of AI customer service: How service failures damage consumer-brand relationships", "url": "https://doi.org/10.1016/j.jretconser.2026.105143", "authors": "Zhucheng Shao", "venue": "Journal of Retailing and Consumer Services", "date": "2026-10-04", "sjr": 3.913, "citescore": 24.8, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、AIによるカスタマーサービスの失敗が、消費者とブランドの関係をどのように損なうかを検証した研究とみられる。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「人間の店員の失敗とAIの窓口の失敗では、お客さんの受け止め方が違うのか」です。AIの対応で困ったとき、不満がAIではなくブランドそのものに向かうとしたら、企業にとって見過ごせません。機械の失敗が誰の責任と感じられるかという、身近で新しい問題が面白い点です。", "unverified": "研究の方法・対象・結果はすべて未確認（題名のみ）。"}}, {"id": "jr21", "rank": 21, "headline": "生成AIとの協働：局所的な増強と隠れた労働", "title": "GenAI-enabled human–AI collaboration: An integrative review of local augmentation, hidden work, and governable synergy", "url": "https://doi.org/10.1016/j.ijinfomgt.2026.103140", "authors": "Jian Liu ほか", "venue": "International Journal of Information Management", "date": "2026-10-04", "sjr": 5.899, "citescore": 54.4, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、生成AIを使った人とAIの協働について、局所的な能力の増強、見えにくい追加の労働（hidden work）、統治できる相乗効果という観点から文献を統合的にレビューした論文とみられる。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「生成AIで仕事が楽になる一方で、AIの出力を確かめたり直したりする見えない手間が増えていないか」です。便利さの陰で増える仕事を正面から扱い、それをどう管理すれば本当の相乗効果になるのかを問う点が面白いところです。", "unverified": "レビューの対象文献と結論はすべて未確認（題名のみ）。"}}, {"id": "jr22", "rank": 22, "headline": "マーケティングの貢献は管理会計で示すべき", "title": "Looking for love in the wrong place: why marketers should focus on management accounting", "url": "https://doi.org/10.1108/mip-12-2025-0940", "authors": "Jonathan Knowles ほか", "venue": "Marketing Intelligence & Planning", "date": "2026-10-03", "citescore": 9.6, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "マーケティングの事業への貢献が財務諸表に表れないという不満に対し、財務会計の規則を変える努力より管理会計に焦点を移すべきだと論じた概念的な論文。", "p3": "外部の財務報告がマーケティングの投資的な側面を無視する理由と、それが変わりにくい理由を、マーケティングと財務会計の目的のずれから概念的に検討した（抄録）。", "p5": "当面、財務会計の規則の変更でマーケティングの価値が広く認められる見込みは低いと結論し、マーケティングが業績の主な原動力である業界では管理会計に力を注ぐべきだとして、その方法を提案した（抄録）。", "fun": "広告やブランドづくりは将来の売上を生む「投資」のはずなのに、決算書では費用として消えてしまいます。この論文は、決算書のルールを変えてもらう努力は報われにくく、社内向けの管理会計で価値を示す方が近道だと主張しました。「間違った場所で愛を探している」という題名のたとえが面白い点です。", "unverified": "提案する管理会計の具体的な指標は未確認（本文を入手できず）。"}}, {"id": "jr23", "rank": 23, "headline": "地域ラジオの気候情報で女性や大家族が取り残される", "title": "Patterns of inclusion and exclusion in climate information access through community radio among smallholder farmers in Northern Ghana", "url": "https://doi.org/10.1007/s44279-026-00792-0", "authors": "Enoch Kwame Tham-Agyekum ほか", "venue": "Discover Agriculture", "date": "2026-10-03", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "ガーナ北部の小規模農家1,200人で、地域ラジオによる気候情報へのアクセスの包摂と排除を次元ごとに測り、女性や大家族の世帯が取り残されやすいことを示した。", "p3": "農家への調査と主要な情報提供者への面接を組み合わせた混合研究で、物理的・経済的・制度/政策的などの次元ごとにアクセスの要因を分析した（抄録）。", "p5": "58.08%が気候関連の放送を毎日聞き、個人のラジオ（44.25%）や携帯電話（37.83%）で聞いていた。女性は物理的・経済的・制度/政策的なアクセスが低く、大家族も同様だった。信用の利用は4次元すべてと負の関係、普及指導の利用と高い所得は正の関係があった（抄録）。", "fun": "ラジオは誰でも聞けるので、情報を平等に届ける道具に思えます。しかしこの研究では、女性や大家族の農家ほど、聞く手段や内容を生かす条件で不利になっていました。「情報が流れている」ことと「情報が届いている」ことは違う、という点が面白いところです。", "unverified": "4つ目の次元の名称と、各要因の効果の大きさは未確認（本文を入手できず）。"}}, {"id": "jr24", "rank": 24, "headline": "保育施設長の包摂的リーダーシップを3因子で測る", "title": "Inclusive leadership in Finnish early childhood education centres – leading pedagogy, professional development and the community", "url": "https://doi.org/10.1108/ijem-03-2026-0311", "authors": "Lauri Heikonen ほか", "venue": "International Journal of Educational Management", "date": "2026-10-03", "citescore": 6.0, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "フィンランドの保育施設長116人に翻訳・適応した包摂的リーダーシップ尺度を実施し、3つの次元からなる短縮版の尺度を作った。", "p3": "公立・私立の保育施設長への調査データで探索的因子分析を行い、尺度の構造を確かめて項目を絞り、施設の種類や規模などで群間比較した（抄録）。", "p5": "教育的過程の主導、包摂的な共同体の構築、職員の専門的成長の主導の3次元が得られた。施設長は教育実践と職員の力量形成の支援に最も力を入れ、地域レベルの協働は少なかった。公立と小規模施設では地域志向の実践が多く、私立では職員の成長支援が多かった（抄録）。", "fun": "「誰も取り残さない保育」を進めるリーダーが、実際に何に力を注いでいるかを測る物差しを作った研究です。施設の中の保育や職員育成には熱心でも、地域とのつながりづくりは後回しになりがち、という結果は、学校や職場にも通じる課題として面白い点です。", "unverified": "尺度の項目数と因子分析の適合の指標は未確認（本文を入手できず）。"}}, {"id": "jr25", "rank": 25, "headline": "流動層の粒子温度分布を誤差基準で縮約予測", "title": "Error-based state resolution for reduced-order prediction of particle-temperature distributions in a gas–solid fluidized bed", "url": "https://doi.org/10.1016/j.ijheatmasstransfer.2026.129680", "authors": "Yan Zhou ほか", "venue": "International Journal of Heat and Mass Transfer", "date": "2026-10-04", "sjr": 1.224, "citescore": 11.6, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、気体と固体粒子が混ざる流動層で、粒子の温度分布を縮約モデル（次元を減らした近似模型）で予測する際に、誤差に基づいて状態の解像度を決める方法を提案した研究とみられる。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「無数の粒子の温度の散らばりを、少ない変数でどこまで正確に予測できるか」です。全粒子を追うと計算が重すぎるため、どこを細かく、どこを粗く表すかを誤差の大きさで決めるという発想が面白い点です。", "unverified": "縮約の方法、検証の対象と精度はすべて未確認（題名のみ）。"}}, {"id": "jr26", "rank": 26, "headline": "UAV写真測量と数値解析で巨大地すべりを評価", "title": "Stability Assessment of a Large-Scale Landslide in the Minjiang River Basin Based on UAV Oblique Photogrammetry and Numerical Simulation", "url": "https://doi.org/10.3390/su181910071", "authors": "Mingdong Zang ほか", "venue": "Sustainability", "date": "2026-10-02", "citescore": 8.9, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "中国・岷江上流の巨大な既存地すべりで、UAV斜め写真測量・3次元地質モデル・FLAC3Dの数値解析を組み合わせ、短期の降雨浸透と深部すべり面の水圧による再活動の関係を調べた。", "p3": "強度低減法で安全率を求め、1次元の浸透解析で24時間降雨の湿潤深さを見積もり、すべり面に水頭を与えるシナリオで安定性の変化を調べた（抄録）。", "p5": "自然状態の安全率は1.656だった。24時間降雨の影響深さは20mm/dで約0.43m、150mm/dで1.00mにとどまった。水頭1.0〜2.25mでは安全率は約1.64のままだがせん断変位が大きく増え、2.5m以上で継続的なすべりが生じ、遷移域は約2.25〜2.50mとされた（抄録）。", "fun": "大雨が降ると地すべりが動く、と単純に考えがちですが、この研究では1日の雨がしみ込むのは地表から1m程度までで、深いすべり面には直接届きませんでした。深い地すべりを動かすのは、すべり面にかかる水圧がある値を超えることだという結果で、雨量より地下の水の圧力を見るべきだという点が面白いところです。", "unverified": "観測による検証の有無と、モデルの物性値の設定根拠は未確認（本文を入手できず）。"}}, {"id": "jr27", "rank": 27, "headline": "医師・看護師の満足調査に必要な最小標本数", "title": "A-264 Identifying the minimum absolute sample size to estimate indicators of patient experience, mitigating variability and improving the statistical reliability of physicians’ and nurses’ experience surveys in Brazilian hospitals", "url": "https://doi.org/10.1093/clinchem/hvag086.214", "authors": "Rafael Jacomo ほか", "venue": "Clinical Chemistry", "date": "2026-10-04", "sjr": 1.721, "citescore": 9.8, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Clinical Chemistry誌の学会抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "ブラジルの21病院で、検体採取・検査サービスを使う医師・看護師の満足度（NPSとCSAT）が安定するのに必要な最小の回答数を、折れ線回帰で求めた（学会抄録）。", "p3": "2021〜2025年の1,660件の回答を病棟・月ごとに集計し、標本数の15〜85パーセンタイルの範囲の候補の折れ点で、標本数の逆数で重み付けした最小二乗の折れ線回帰を当てはめ、重み付き残差平方和が最小の折れ点を選んだ（抄録）。", "p5": "折れ点はCSATで月20件、NPSで月12件で、月12〜20件（年144〜240件）が運用上の目標とされた。医師と看護職がほぼ半々なら月に各6〜10人が必要で、半年ごとの調査を毎月の収集に替えるよう勧めた（抄録）。", "fun": "アンケートの満足度は、答えた人数が少ないと月ごとに大きくぶれます。では何人に聞けば安定するのか。この研究は、人数とぶれの関係のグラフが「曲がる点」を統計的に見つけ、月12〜20件という目安を出しました。調査の頻度を毎月に変えるべきだという、数字に基づく提案が面白い点です。", "unverified": "折れ点の推定の不確かさ（信頼区間）は未確認（学会抄録のみ）。"}}, {"id": "jr28", "rank": 28, "headline": "ヒヤリ報告の表彰制度が改善提案を増やした4年間", "title": "A-283 From idea to impact: A recognition program to encourage laboratory staff to report “good catches” and strengthen the culture of continuous improvement in the clinical laboratory", "url": "https://doi.org/10.1093/clinchem/hvag086.231", "authors": "Lisa Rossini", "venue": "Clinical Chemistry", "date": "2026-10-04", "sjr": 1.721, "citescore": 9.8, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Clinical Chemistry誌の学会抄録（候補の収集時に取得）を使用", "preprint": false, "short": true, "p1": "米国メイヨー・クリニックの中央検査室で、誤りの事前発見（good catch）と改善提案を表彰する制度を4年間運用した効果を報告した（学会抄録）。", "p3": "2022年1月〜2025年12月のすべての提出を追跡し、年ごとの提出数と受賞者数、提案の分類、実施状況、提出から審査・表彰・完了までの日数を集計した（抄録）。", "p5": "4年間で219件の提出に236件の賞が48人に贈られ、good catchは75件、改善提案は140件だった。改善提案の54%（78件）が実施・完了し、完了したものの69%が業務の効率化に効いた。提出から最初の審査まで平均18日、実施・完了まで平均113日だった（抄録）。", "fun": "ミスを見つけた人や改善案を出した人を表彰すると、職場は変わるのか。この検査室では4年間で48人のスタッフが参加し、改善案の半分以上が実際に実行されました。ミスの報告を「告げ口」ではなく「お手柄」として扱う仕組みが、安全と効率を同時に高めた点が面白いところです。", "unverified": "制度の導入前との比較や対照群はなく、効果の因果的な評価は未確認（学会抄録のみ）。"}}, {"id": "jr29", "rank": 29, "headline": "指針を参照させるとLLMの回答の一貫性が向上", "title": "Guideline‐augmented prompting improves comparative preference and response consistency of large language model outputs for orthopaedic anaesthesia questions: A controlled prompting study", "url": "https://doi.org/10.1002/jeo2.70922", "authors": "Anita Széll ほか", "venue": "Journal of Experimental Orthopaedics", "date": "2026-10-03", "citescore": 3.0, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "整形外科麻酔の34問に3世代のGPTと麻酔科専門医3人が答え、指針を与えたプロンプトで回答の質と一貫性がどう変わるかを、指針を参照するLLM審判の盲検の対比較で評価した。", "p3": "GPT-3.5-turbo、GPT-4o、GPT-5.2と専門医の回答を匿名化し、指針を参照するGPT-5.2の審判が対比較で好み・一貫性・確信度を記録した。GPT-4oとGPT-5.2は指針の有無の両条件で回答し、同じ質問の反復生成で一貫性も測った（抄録）。", "p5": "指針なしでも全LLMが専門医より好まれ、勝率はGPT-3.5-turbo 67.6%、GPT-4o 79.4%、GPT-5.2 95.1%だった。指針を与えるとGPT-4oは91.2%（11.8ポイント増）、GPT-5.2は97.1%になり、GPT-5.2の一貫性は66.7%から80.4%に上がった（抄録）。", "fun": "医師向けの質問にAIがどれだけうまく答えられるかを、別のAIに採点させた研究です。新しい世代ほど成績が上がり、診療指針を手元に置かせると中くらいの性能のAIが大きく伸びました。ただし採点役もAIなので、人の専門家の評価との一致を確かめる必要があると著者自身が述べている点も含めて、考えさせられる結果です。", "unverified": "審判の評価と人の専門家の評価の一致度は未確認（著者もさらなる検証が必要と述べる）。"}}, {"id": "jr30", "rank": 30, "headline": "4つのLLMの健康助言を採点、正確さに大差", "title": "Evaluating Harm Reduction Advice From Large Language Models", "url": "https://doi.org/10.1111/dar.70272", "authors": "Khy Choo ほか", "venue": "Drug and Alcohol Review", "date": rea Real Estate Society", "date": "2026-10-02", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "ソウル首都圏の成人470人で、地域への共同体意識が住宅そのものの満足度に、直接と住環境の満足を通じて間接に結びつく経路が、年齢層でどう違うかを調べた。", "p3": "若年（19〜39歳）・中年（40〜59歳）・高齢（60歳以上）に分け、測定の不変性を確かめたうえで多母集団の構造方程式モデルで分析した（抄録）。", "p5": "若年では間接効果だけ、中年では直接・間接効果の両方が有意で、高齢では総合効果だけが有意だった（標本が小さく慎重に解釈）。群間の直接比較では、住環境の満足から住宅の満足への経路だけが若年で中年より有意に強かった（抄録）。", "fun": "家の満足度は、部屋の広さや設備だけで決まるのではなく、ご近所とのつながりや周りの環境の感じ方にも左右される、という研究です。さらに、そのつながり方が年齢で違い、若い人ほど「周りの環境が良いから家にも満足」という回り道の経路が強いのが面白い点です。", "unverified": "共同体意識の尺度と各経路の係数の大きさは未確認（本文を入手できず）。"}}, {"id": "jr37", "rank": 37, "headline": "反論できない論者としてのLLMと議論上の不正義", "title": "The Unanswerable Arguer: Large Language Models, Argumentative Injustice, and the Structural Displacement of Epistemic Standing", "url": "https://doi.org/10.1007/s11245-026-10504-4", "authors": "Yu Zhang", "venue": "Topoi", "date": "2026-10-04", "sjr": 0.63, "citescore": 3.1, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、LLMを「反論しても応えない論者」として捉え、議論における不正義と、人の認識上の立場（知識を持つ者として扱われること）が構造的に押しのけられる問題を論じた哲学の論文とみられる。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、「いくら反論しても受け止めてくれない相手と議論すると、人の『知る者』としての立場はどうなるか」です。AIは流暢に答えますが、こちらの反論で考えを改める責任を負うわけではありません。議論の公平さという古い問題を、AIの時代に新しく問い直している点が面白いところです。", "unverified": "論証の内容と結論はすべて未確認（題名のみ）。"}}, {"id": "jr38", "rank": 38, "headline": "CBTに基づく多エージェントの心理相談システム", "title": "DHCBT: a digital human psychological counseling system with a CBT multi-agent framework", "url": "https://doi.org/10.1038/s41598-026-73798-9", "authors": "Litun Tan ほか", "venue": "Scientific Reports", "date": "2026-10-04", "citescore": 6.4, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "pr     { key: "data", label: "データ", parts: [["data_related", "関連", "オープンデータ：研究に関連する新着データセット"]] },
    { key: "latest", label: "最新", parts: [["related", "関連", "最新：研究に関連する論文"], ["notable", "重要", "最新：分野を問わない重要論文"]] },
    { key: "topj", label: "Top誌", parts: [["top", "関連", "Top誌（SJR上位10%）：研究に関連する論文"], ["top_notable", "重要", "Top誌（SJR上位10%）：分野を問わない重要論文"]] }
  ];
  var LABELS = [["p1", "(1) 一言で"], ["p2", "(2) 問い"], ["p3", "(3) 手法"], ["p4", "(4) 検証"], ["p5", "(5) 結果"], ["p6", "(6) 限界"]];
  var BASIS_PILL = { "本文": "本文を読んだ解説", "抄録": "抄録の範囲の解説", "題名": "題名だけの情報" };
  // a theme comes with its colour number (theme_no 1-8 -> --t1 ... --t8); the page holds no theme names of its own
  function themeColor(it) { return it.theme_no ? "--t" + it.theme_no : "--accent-soft"; }
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var groups = GROUPS.map(function (g) {
    return { key: g.key, label: g.label, parts: g.parts.filter(function (p) { return (REPORT[p[0]] || []).length > 0; }) };
  }).filter(function (g) { return g.parts.length > 0; });
  var parts = [].concat.apply([], groups.map(function (g) { return g.parts; }));
  var views = parts.map(function (p) { return p[0]; }).concat(["marks", "list"]);
  function groupOf(view) {
    for (var i = 0; i < groups.length; i++) {
      for (var j = 0; j < groups[i].parts.length; j++) { if (groups[i].parts[j][0] === view) return groups[i]; }
    }
    return null;
  }
  var lastInGroup = store.get("pd-sub-v1", {});
  var marks = store.get("pd-marks-v1", {});
  var saved = store.get("pd-pos-" + REPORT.date, { view: views[0], index: 0 });
  var start = { part1: "related", part2: "notable" }[saved.view] || saved.view;
  var state = { view: views.indexOf(start) >= 0 ? start : views[0], index: saved.index || 0 };
  var stage = document.getElementById("stage");
  var el = function (tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

  // date selector
  document.getElementById("daylabel").textContent = " " + REPORT.date;
  var sel = document.getElementById("datesel");
  function fillDates(list) {
    ARCHIVE = list;
    while (sel.firstChild) sel.removeChild(sel.firstChild);
    list.forEach(function (d, i) {
      var o = el("option", null, d + (i === 0 ? "（最新）" : ""));
      o.value = d; if (d === REPORT.date) o.selected = true; sel.appendChild(o);
    });
  }
  fillDates(ARCHIVE);
  // the current date list (older pages are not rebuilt every day); the list embedded in the page is the fallback
  try {
    fetch((META.kind === "archive" ? "../" : "") + "dates.json", { cache: "no-cache" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (list) { if (Array.isArray(list) && list.length) fillDates(list); })
      .catch(function () {});
  } catch (e) {}
  sel.addEventListener("change", function () {
    var d = sel.value, latest = ARCHIVE[0];
    var href = META.kind === "archive" ? (d === latest ? "../index.html" : d + ".html") : (d === latest ? "index.html" : "archive/" + d + ".html");
    location.href = href;
  });

  // tabs: 最新 / Top誌 / ★ / 一覧, and under a source the 関連 / 注目 sub-tabs
  var tabs = document.getElementById("tabs"), subtabs = document.getElementById("subtabs");
  function select(view) {
    stopSpeech(false);
    state.view = view; if (view !== "list") { state.index = 0; }
    var g = groupOf(view);
    if (g) { lastInGroup[g.key] = view; store.set("pd-sub-v1", lastInGroup); }
    render(); window.scrollTo(0, 0);
  }
  function addTab(key, text, label, onClick) {
    var b = el("button", "tab", text); b.type = "button"; b.dataset.view = key;
    if (label) { b.setAttribute("aria-label", label); b.title = label; }
    b.addEventListener("click", onClick);
    tabs.appendChild(b);
  }
  groups.forEach(function (g) {
    var n = g.parts.reduce(function (s, p) { return s + REPORT[p[0]].length; }, 0);
    addTab("group:" + g.key, g.label + " " + n, null, function () {
      var v = lastInGroup[g.key];
      if (!g.parts.some(function (p) { return p[0] === v; })) v = g.parts[0][0];
      select(v);
    });
  });
  addTab("marks", "★", "あとで読む（★を付けた論文）", function () { select("marks"); });
  addTab("list", "一覧", null, function () { select("list"); });

  function items(view) {
    if (view === "marks") return Object.keys(marks).map(function (k) { return marks[k]; }).sort(function (a, b) { return (b.markedAt || "").localeCompare(a.markedAt || ""); });
    return REPORT[view] || [];
  }
  function current() { var list = items(state.view); return list[Math.max(0, Math.min(state.index, list.length - 1))]; }
  function save() { store.set("pd-pos-" + REPORT.date, { view: state.view, index: state.index }); }

  function renderTabs() {
    var g = groupOf(state.view);
    Array.prototype.forEach.call(tabs.children, function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.view === state.view || (!!g && b.dataset.view === "group:" + g.key)));
    });
    subtabs.innerHTML = "";
    subtabs.hidden = !g || g.parts.length < 2;
    if (g) g.parts.forEach(function (p) {
      var b = el("button", "tab subtab", p[1] + " " + REPORT[p[0]].length); b.type = "button";
      b.setAttribute("aria-pressed", String(p[0] === state.view));
      b.addEventListener("click", function () { select(p[0]); });
      subtabs.appendChild(b);
    });
  }

  function labelled(cls, label, text) {
    var p = el("p", cls); p.appendChild(el("span", "label", label)); p.appendChild(document.createTextNode(text)); return p;
  }

  function renderCard() {
    var list = items(state.view);
    stage.innerHTML = "";
    var card = el("article", "card");
    if (!list.length) {
      card.appendChild(el("p", "empty", state.view === "marks"
        ? "まだ★がありません。気になった論文で ☆ を押すと、ここにまとまります（この端末に保存）。"
        : state.view === "data_related" ? "この日の新着データセットはありません。" : "この日の論文はありません。"));
      stage.appendChild(card); updateControls(); return;
    }
    state.index = Math.max(0, Math.min(state.index, list.length - 1));
    var it = list[state.index];
    var head = el("div", "cardhead");
    head.appendChild(el("span", "pos", (state.index + 1) + " / " + list.length + (it.rank ? "　" + it.rank + "位" : "")));
    var chipText = it.theme || it.field || "";
    if (chipText) {
      var chip = el("span", "chip", chipText);
      chip.style.background = "var(" + themeColor(it) + ")";
      head.appendChild(chip);
    }
    card.appendChild(head);
    card.appendChild(el("h1", "headline", it.headline || it.title));
    var ex = it.explain;
    if (ex) {
      var basis = el("p", "basis");
      basis.appendChild(el("span", "pill", (ex.short ? "短い解説・" : "") + (BASIS_PILL[ex.basis] || ex.basis || "")));
      if (ex.preprint) basis.appendChild(el("span", "badge", "未査読プレプリント"));
      if (ex.basis_note) basis.appendChild(el("span", null, ex.basis_note));
      card.appendChild(basis);
      LABELS.forEach(function (l, i) {
        if (!ex[l[0]]) return;
        var sec = el("section", "ex" + (i === 0 ? " first" : ""));
        sec.appendChild(el("h2", null, l[1]));
        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });
      if (ex.fun) {
        var fun = el("section", "ex fun");
        fun.appendChild(el("h2", null, "面白いポイント"));
        fun.appendChild(el("p", null, ex.fun));
        card.appendChild(fun);
      }
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // one tap hands the request to an AI app through the share menu (Claude, ChatGPT, Gemini, ...)
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    var ask = el("button", "ask main", "AIに聞く"); ask.type = "button";
    ask.addEventListener("click", function () { if (CAN_SHARE) askAI(it, "節ごとに詳しく", askStatus); else openSheet(it); });
    askrow.appendChild(ask);
    if (CAN_SHARE) {
      var more = el("button", "ask", "ほかの聞き方"); more.type = "button";
      more.addEventListener("click", function () { openSheet(it); });
      askrow.appendChild(more);
    }
    if (it.kind !== "data") { card.appendChild(askrow); card.appendChild(askStatus); }
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // request for a longer explanation, written to be pasted into an AI chat app on a phone (Claude, ChatGPT, Gemini):
  // self-contained, with no skills, local files or PC tools; it follows the owner's paper-review rules
  var REQUEST = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "- 詳しさ：{depth}",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。「要点だけ」のときは (1) と主要な数点に絞る。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  function requestText(it, depth) {
    return REQUEST.replace("{paper}", it.title + "（" + it.url + "）").replace("{depth}", depth);
  }
  // phones and tablets have a share menu listing the installed AI apps; elsewhere the request is copied
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  function askAI(it, depth, status) {
    status.textContent = "";
    navigator.share({ text: requestText(it, depth) }).then(function () {
      if (!sheet.hidden) closeSheet();
    }, function (e) {
      if (e && e.name === "AbortError") return;  // the share menu was closed
      if (sheet.hidden) openSheet(it);
      copyRequest(depth);
    });
  }
  var sheet = document.getElementById("sheet"), sheetItem = null;
  var sheetText = document.getElementById("sheet-text"), sheetStatus = document.getElementById("sheet-status");
  [].forEach.call(document.querySelectorAll("#sheet .share"), function (b) { b.hidden = !CAN_SHARE; });
  document.getElementById("copy-full").className = CAN_SHARE ? "btn" : "btn primary";
  document.getElementById("sheet-note").textContent = CAN_SHARE
    ? "共有メニューで、Claude・ChatGPT・Gemini など使いたいAIアプリを選ぶと、依頼文が渡ります。渡らないアプリでは、依頼文をコピーしてチャットに貼り付けます。"
    : "依頼文をコピーして、AIのチャットに貼り付けます。";
  function openSheet(it) {
    sheetItem = it;
    document.getElementById("sheet-paper").textContent = it.headline || it.title;
    sheetStatus.textContent = ""; sheetText.hidden = true;
    sheet.hidden = false;
    document.getElementById(CAN_SHARE ? "share-full" : "copy-full").focus();
  }
  function closeSheet() { sheet.hidden = true; sheetItem = null; }
  function copyRequest(depth) {
    if (!sheetItem) return;
    var text = requestText(sheetItem, depth);
    var fallback = function () {
      sheetText.value = text; sheetText.hidden = false; sheetText.focus(); sheetText.select();
      sheetStatus.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        sheetStatus.textContent = "コピーしました（" + depth + "）。AIアプリのチャットに貼り付けてください。";
      }, fallback);
    } else { fallback(); }
  }
  document.getElementById("share-full").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "節ごとに詳しく", sheetStatus); });
  document.getElementById("share-brief").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "要点だけ", sheetStatus); });
  document.getElementById("copy-brief").addEventListener("click", function () { copyRequest("要点だけ"); });
  document.getElementById("copy-full").addEventListener("click", function () { copyRequest("節ごとに詳しく"); });
  document.getElementById("sheet-close").addEventListener("click", closeSheet);
  sheet.addEventListener("click", function (e) { if (e.target === sheet) closeSheet(); });

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (!sheet.hidden) { if (e.key === "Escape") closeSheet(); return; }
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
