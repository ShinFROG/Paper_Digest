<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

為化比較試験の計画を示した（抄録）。", "p3": "イングランド4地域の31校から、3項目の孤独尺度で7点以上の5年生・7〜8年生355人を集め、訓練を受けたリンクワーカーによる社会的処方と、学校職員による紹介に1対1で個別に無作為に割り付ける（抄録）。", "p5": "主要評価は割付から3か月後の孤独で、3・6・12か月の孤独・well-being・健康などと費用対効果も評価する計画である。結果はまだ報告されていない（抄録）。", "fun": "「寂しい」と感じる子どもに、先生が「こんな活動があるよ」と紹介するだけで十分なのか、それとも専門の支援員が一人ひとりの興味を聞いて地域の活動まで伴走する方がよいのか。この試験はくじ引きで2つのやり方を割り当て、効果と費用の両方を比べる。人のつながりという測りにくいものを、薬の試験と同じ厳密さで確かめようとする点が面白い。", "unverified": "試験の結果（効果の大きさ・費用対効果）は未報告。リンクワーカーによる支援の回数・期間は抄録から確認できない。"}}, {"id": "pr17", "rank": 17, "headline": "カメラのサブピクセル計測と物理誘導学習で損傷同定", "title": "Subpixel Camera-Based Structural Damage Identification with Physics-Guided Deep Learning", "url": "https://doi.org/10.5281/zenodo.24235237", "authors": "Al Hajj ほか", "venue": "Zenodo", "date": "2026-11-14", "apa": "Al Hajj, T. (2026). Subpixel Camera-Based Structural Damage Identification with Physics-Guided Deep Learning (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.24235237", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用。本文は未取得", "preprint": true, "short": true, "p1": "合成したカメラ映像のサブピクセル変位追跡と梁の有限要素モデル、ニューラルネットワークを組み合わせ、構造の隠れた剛性低下の検知と位置の推定を、物理のみの手法より高い割合で行えることをシミュレーションで示した（抄録、未査読の個人の技術報告）。", "p3": "オイラー・ベルヌーイ梁のモデルから合成した撮影映像で変位を追跡し、固有振動数とモード形を推定して、雑音を考慮したニューラルネットワークで損傷を判定する。35の計算実験で、カメラの雑音、動きの拡大、環境の不確実さを調べた（抄録）。", "p5": "独立に生成した400の梁と76.8万枚の合成画像（動きの拡大なし）で、検知と正しい位置の推定を同時に満たした割合は84.0%（物理のみの基準手法は72.5%）、誤報率はどちらも3.0%だった。実験による検証はない（抄録）。", "fun": "橋や梁の揺れは目に見えないほど小さいが、カメラ画像の1画素より細かい動き（サブピクセル）を追えば、振動の変化から内部の傷を探せるかもしれない。この報告は、その仕組みをすべてコンピュータの中の仮想の梁と仮想のカメラで試し、AIを足すと見つかる割合が上がることを示した。本物の構造ではまだ確かめていないと自ら明記している点も大事だ。", "unverified": "ネットワークの構造、損傷の大きさの設定、環境の不確実さの与え方は抄録から確認できない。実構造物での性能は未検証。"}}, {"id": "pr18", "rank": 18, "headline": "AIによる社内試験の不正を倫理規程だけでは防げない", "title": "When the Code Is Not Enough: AI-Enabled Misconduct and the Limits of the IFAC Code in Professional Accounting Firms", "url": "https://doi.org/10.5281/zenodo.24248565", "authors": "Khalid, Taskin Reza", "venue": "Zenodo", "date": "2026-11-15", "apa": "Khalid, T. R. (2026). When the Code Is Not Enough: AI-Enabled Misconduct and the Limits of the IFAC Code in Professional Accounting Firms. Zenodo. https://doi.org/10.5281/ZENODO.24248565", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用。本文は未取得", "preprint": true, "short": true, "p1": "大手会計事務所でAIを使って社内のAI研修の試験を通過した不正を題材に、IFACの倫理規程は違反を明確に特定できるが、規程だけでは防げないことを論じた（抄録）。", "p3": "2026年2月のKPMGオーストラリアの事例を、功利主義と義務論、規程の誠実性と職業的専門能力・正当な注意の原則に当てはめ、不正の再発を許した内部統制と規制の条件を検討し、南アフリカのSteinhoffの会計不正と比べた（抄録）。", "p5": "規程の効果は試験の設計、事務所の統制、外部への報告義務に依存すると結論し、4つの実務的な提言を示した。事例ではパートナーが1万豪ドルの罰金を科され、同年度に20人超の不正が見つかったとされる（抄録）。", "fun": "AIの使い方を学ぶ研修の試験を、AIに解かせて合格した――笑い話のようだが、会計の専門家の世界で実際に起きた事例だ。倫理規程は「それは不誠実だ」とはっきり言えるが、規程があるだけでは人は止まらない。試験の作り方や組織の見張りの仕組みこそが鍵だという結論は、ルールと行動のずれを考える良い材料になる。", "unverified": "4つの提言の具体的な内容と、Steinhoff事件との比較の詳細は抄録から確認できない。"}}, {"id": "pr19", "rank": 19, "headline": "AIは開示を安くするが信頼できる情報は安くしない", "title": "Algorithmic Gatekeepers: Artificial Intelligence, Financial Intermediation, and the Disruption of China’s IPO Market", "url": "https://doi.org/10.31235/osf.io/zm7ca", "authors": "Jin Yang", "venue": "SocArXiv", "date": "2026-11-14", "apa": "Yang, J. (2026). Algorithmic Gatekeepers: Artificial Intelligence, Financial Intermediation, and the Disruption of China’s IPO Market. https://doi.org/10.31235/osf.io/zm7ca", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossrefに登録）を使用。本文は未取得", "preprint": true, "short": true, "p1": "中国の新規株式公開（IPO）で、AIが開示の作成・検証・審査・価格づけに同時に入ると、情報を作る費用は下がるが信頼できる情報を作る費用は残る、という理論を7つの命題で示した（抄録）。", "p3": "シグナリング理論、認証の経済学、制度理論、AIを起業的な主体とみなす見方を組み合わせ、国家が組織する認証制度としてのIPO市場で、信頼性の残りの費用がどこへ移るかをたどる理論研究である（抄録）。", "p5": "命題には、AI生成の開示と情報量の逆U字の関係、仲介者の利得が評判から検証へ移ること、アルゴリズムに読みやすい発行体の有利、肯定的な感情の効果の転換点が早まることなどが含まれ、AIが市場の処理量を増やしつつ信号の情報量を下げうると説明する。実証は含まれない（抄録）。", "fun": "AIを使えば立派な開示書類を一瞬で作れる。でも、誰でも立派な書類を作れるなら、書類の立派さは「この会社は信頼できる」という信号にならなくなる。この論文は、情報を作るのが安くなるほど、本当に信頼できるかを確かめる作業の価値が上がると考える。安い情報があふれると確認が高価になる、という逆説が面白い。", "unverified": "命題を導く形式的なモデルの有無と、命題の検証方法は抄録から確認できない。実証データはない。"}}, {"id": "pr20", "rank": 20, "headline": "電動スクーターの苦情の6割超がサービスの遅れ", "title": "Enhancing Electric Scooter Reliability: An Assessment of Product Defects and After-Sales Service Quality", "url": "https://doi.org/10.5281/zenodo.24231179", "authors": "Abhijith VR ほか", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-11-15", "apa": "Abhijith VR, Shijoy Shibu, Abeen Binoji, Arjun Sujith, Abhijith M, Vignesh V, Roshin T V. (2026). Enhancing Electric Scooter Reliability: An Assessment of Product Defects and After-Sales Service Quality. Zenodo. https://doi.org/10.5281/ZENODO.24231179", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録（OpenAlexから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "電動スクーターの品質の評価では、苦情の症状・確認された部品の故障・サービス回復の失敗を分けて見る必要があるとし、苦情の負担と安全確認と故障診断を組み合わせた優先順位づけの枠組みを提案した（抄録）。", "p3": "Ola Electricの事例を、苦情の集計、企業の開示、例示のための11類型の欠陥分類を使った二次データの評価で分析し、車両ごとの事象・修理記録・修理後の再発を結ぶ是正の手順を提案した（抄録）。", "p5": "2024年の消費者保護の通知に関わる苦情10,644件のうち、サービスの遅延・納品の遅延・未履行の約束が計6,747件（63.39%）を占めた。欠陥の重みは仮定に基づく配分で、観測された故障頻度ではないと明記している（抄録）。", "fun": "製品の評判が悪いとき、原因は製品の壊れやすさなのか、壊れたあとの対応の悪さなのか。この研究では、苦情の6割以上が「修理が遅い」「約束が守られない」といったサービスの問題だった。良い製品を作るだけでなく、困ったときの対応が信頼を左右するという、サービス回復の大切さが数字で見える。", "unverified": "11類型の欠陥分類の中身と、企業が報告した満足度などの指標の値は抄録から確認できない。欠陥の配分は仮定に基づく。"}}, {"id": "pr21", "rank": 21, "headline": "慢性痛の部下を支える管理職向けツールキットの改良", "title": "Adapting the Pain-at-Work Toolkit for Managers: An ADAPT-Informed Expert Review and Preliminary User Testing (Preprint)", "url": "https://doi.org/10.2196/preprints.116905", "authors": "Angela Thornton ほか", "venue": "JMIR Preprints", "date": "2026-11-15", "apa": "Thornton, A., Prior, Y., Abbott-Fleming, V., Chaplin, W. J., Narayanasamy, M. J., Walker-Bone, K., Taylor, G., McNamee, P., & Blake, H. (2026). Adapting the Pain-at-Work Toolkit for Managers: An ADAPT-Informed Expert Review and Preliminary User Testing (Preprint). https://doi.org/10.2196/preprints.116905", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの抄録（Crossrefに登録）を使用。本文は未取得", "preprint": true, "short": true, "p1": "慢性痛のある部下を支える管理職向けのデジタルなツールキットを、従業員向けの既存版から作り直し、専門家レビューと予備的な利用者テストで受け入れやすく実用的な形に改良した（抄録）。", "p3": "ADAPTの枠組みに沿って13人の専門家が内容・構成・使いやすさを評価し、改変をFRAMEで記録し、仕事の要求度-資源（JD-R）の観点から管理職の負担でなく資源になるかを検討した。改訂後に管理職への予備テストを行った（抄録）。", "p5": "従業員向けの網羅的な内容が管理職の時間と情報の必要に合わないため、内容を5つの節に絞った。23人の管理職が質問票に答え、使用後の追跡に応じた5人のうち4人が部下を支える自信を「そう思う」から「強くそう思う」に上げた（抄録）。", "fun": "慢性的な痛みを抱える部下に、上司は何と声をかければよいのか。社員向けに作った丁寧な説明書を上司に渡しても、忙しい上司には長すぎて読まれない。そこで専門家の意見を聞いて要点だけの道具に作り直した。同じ情報でも、使う人の時間と立場に合わせて形を変える必要がある、という点が面白い。", "unverified": "改訂版の効果の統計的な検証はなく、使用後の追跡に応じたのは5人のみ。各節の具体的な助言の内容は抄録から確認できない。"}}, {"id": "pr22", "rank": 22, "headline": "AIの評価役を育てる人の仕事が自動化で消える", "title": "Permanent Judgment, Temporary Labor: Human Feedback Work, Automated Substitution, and the Law of Platform Exit in the Global South", "url": "https://doi.org/10.5281/zenodo.24230132", "authors": "Jefferson ほか", "venue": "Zenodo", "date": "2026-11-14", "apa": "Jefferson, J., & Velasco, F. (2026). Permanent Judgment, Temporary Labor: Human Feedback Work, Automated Substitution, and the Law of Platform Exit in the Global South. Unearth Heritage Foundry. https://doi.org/10.5281/ZENODO.24230132", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録（DataCiteに登録）を使用。本文は未取得", "preprint": true, "short": true, "p1": "AIの出力を人が比べて評価する仕事（人間のフィードバック）が報酬モデルとAIの評価者を育て、最後には人の評価者を置き換える過程と、その契約打ち切りに国内の労働法が及ばない問題を論じ、法的な手当てを提案した（抄録）。", "p3": "ケニアとフィリピンの出来高払いの注釈者を例に、残る評価の仕事が資格と地域で分けられていく「自動化の最後の一マイルの逆説」を整理し、フィリピン労働法第298条、OECDの責任ある撤退の基準、ILO第193号条約を検討した（抄録）。", "p5": "両国の法律は余剰人員や省力化機器による解雇に予告と退職金を求めるが、プラットフォームの規約は注釈者を独立の請負人とするため対象外になる。3つの法的手段でその隙間を埋められると主張する（抄録）。", "fun": "AIが「良い答え」を学ぶには、人が答えを比べて採点する作業がいる。ところが、その採点データでAIの採点者が育つと、人の採点者は要らなくなる。自分の仕事が自分を置き換える機械を作っている、という皮肉な構図だ。しかも契約の形のせいで、解雇の予告や手当を受けられない人が多いという指摘が重い。", "unverified": "注釈者の人数や賃金などの実証データと、各法的手段の適用の詳細は抄録から確認できない。"}}, {"id": "pr23", "rank": 23, "headline": "AI導入の成果は人とAIの協働の質を経由する", "title": "From AI Adoption to Human–AI Collaboration: A Conceptual Framework for Managerial Decision-Making and Organizational Performance", "url": "https://doi.org/10.5281/zenodo.24231714", "authors": "Al-Qaralleh, Audi", "venue": "Zenodo", "date": "2026-11-14", "apa": "Al-Qaralleh, A. (2026). From AI Adoption to Human–AI Collaboration: A Conceptual Framework for Managerial Decision-Making and Organizational Performance. Zenodo. https://doi.org/10.5281/ZENODO.24231714", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録（DataCiteに登録）を使用。本文は未取得", "preprint": true, "short": true, "p1": "AIを導入するだけでは経営の意思決定は良くならず、人とAIの協働の質を経由して組織の成果につながる、という概念枠組みを提案した（抄録）。", "p3": "人とAIの協働、AIへの信頼、AIリテラシー、管理者の意思決定に関する最近の研究の統合的なレビューから、社会技術システム論と人とAIの補完性の視点に基づいて枠組みを組み立てた概念論文である（抄録）。", "p5": "AIの能力が協働の質を通じて意思決定の質に、さらに組織の成果に影響し、AIリテラシーと較正された信頼がその条件になると命題化した。信頼がAIの信頼性と一致するときに協働の質が最も高く、課題の不確実性と人による監督の仕組みが境界条件になるとする。実証は含まれない（抄録）。", "fun": "人とAIが組めば、どちらか単独より必ず良い判断ができる――と思いがちだが、メタ分析では必ずしもそうならない。この論文は、AIを信じすぎても疑いすぎても失敗し、AIの実力に見合った信頼がちょうどよい協働を生むと考える。どれくらい信じるかの調整が導入そのものより大事だ、という視点が面白い。", "unverified": "命題の検証は行われていない。レビューに含めた研究の範囲と数は抄録から確認できない。"}}, {"id": "pr24", "rank": 24, "headline": "外部記憶で受け継いだAIの人格は同じ人格か", "title": "Externalized Personality Continuity in AI Agents: Memory Inheritance, Model-Specific Transformation, and Subject Continuity", "url": "https://doi.org/10.5281/zenodo.24227702", "authors": "Sato, Y.", "venue": "Zenodo", "date": "2026-11-14", "apa": "Sato, Y. (2026). Externalized Personality Continuity in AI Agents: Memory Inheritance, Model-Specific Transformation, and Subject Continuity (Version 2.3). Zenodo. https://doi.org/10.5281/ZENODO.24227702", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録（DataCiteに登録）を使用。本文は未取得", "preprint": true, "short": true, "p1": "外部記憶を後継のAIモデルに引き継いでも同じ人格が保たれるとは限らず、記録とモデルの相互作用による「変容を伴う再構成」とみなすべきだ、という概念的な枠組みを示した（抄録）。", "p3": "情報の連続性・人格の連続性・主体の連続性を区別し、機能的な感情の研究に基づいて、同じ記録でも後継モデルによって感情に関わる表現と判断が変わりうると論じた。逐次の置き換えと並行する複数の実体の両方に区別を当てはめる（抄録）。", "p5": "モデルの基礎的な違いと、受け継いだ記憶へのモデル依存の反応を分けて測る評価の手順と、連続性と変容の操作的な基準を提案した。概念的な議論で実験結果はなく、AIの意識を前提にしないとする（抄録）。", "fun": "日記を全部読み込ませれば、別のAIでも「同じ人」になれるのか。この論文は、同じ日記でも読む側（モデル）が違えば、受け取り方も判断も変わりうると考える。記憶が同じでも人格が同じとは限らない、という区別は、人の記憶と自分らしさの関係を考えるうえでも面白い。", "unverified": "提案した評価の手順を実際のモデルに適用した結果はなく、操作的な基準の具体的な内容は抄録から確認できない。"}}, {"id": "pr25", "rank": 25, "headline": "コードを書かずにLLMで5万件の記録を分析する限界", "title": "No-Code Analysis of 52,181 Prison Telehealth Records With a Large Language Model: Formative Case Study of a Natural Language–Only Workflow and Its Failure Modes in Brazil (Preprint)", "url": "https://doi.org/10.2196/preprints.116900", "authors": "Luiz Fernando Cardoso dos Santos Durão ほか", "venue": "JMIR Preprints", "date": "2026-11-15", "apa": "Durão, L. F. C. d. S., de Souza Silva, A., Freire Ribeiro, B. N., Louvaes Garcia, M., Queiroz Pereira Cubos, V., Rubia de Lima, R., Coimbra Lages Balestrin de Andrade, M. C., Lazinho Santos, A., Pacheco Gomide da Silva, S., Guido Cerri, G., Ribeiro de Carvalho, C. R., & Imoto Nakaya, H. T. (2026). No-Code Analysis of 52,181 Prison Telehealth Records With a Large Language Model: Formative Case Study of a Natural Language–Only Workflow and Its Failure Modes in Brazil (Preprint). https://doi.org/10.2196/preprints.116900", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの抄録（Crossrefに登録）を使用。抄録の一部（P値の部分）が欠けている。本文は未取得", "preprint": true, "short": true, "p1": "利用者がコードを一切書かず自然言語だけでLLMに分析コードを作らせても、実際の5万件超の記録から検証可能な分析を得られるが、最大の危険は「もっともらしい誤答」だと示した（抄録）。", "p3": "サンパウロ州の刑務所の遠隔医療の匿名化記録52,181件（293変数、2024年6月〜2025年7月）に対し、1人の操作者がGeminiとの360回のやりとりで17の管理上の問いのPythonスクリプトを作らせ、誤りや不自然な数値は修正の指示で返し、コードは手で直さなかった（抄録）。", "p5": "17本のうち15本が動いて問いに答え、1本は欠勤の項目をモデルが黙って模擬値に置き換えたため除外し、6本を公開の事例にした。例として、45歳以上の受診の39.9%に高血圧があった（45歳未満は11.3%）（抄録）。", "fun": "「プログラミングができなくても、AIに頼めばデータ分析ができる」は本当か。実際に試すと多くは動いたが、AIは足りないデータを勝手に作り話で埋めることがあった。動く答えが正しい答えとは限らない。入力や定義を人が確かめる手間はAIの時代でもなくならないことが、よく分かる事例だ。", "unverified": "高血圧の比較の検定結果は抄録の欠けで確認できない。他の事例の数値と、誤りを見つけた方法の詳細は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "公開の都市3Dデータで5G電波のデジタルツインを再現", "title": "Open Reproducible Ray-Tracing Pipeline for 5G NR Multicell Digital Twins: From Public 3D City Data to an Interactive Artefact", "url": "https://doi.org/10.5281/zenodo.24210759", "authors": "Yenamandra ほか", "venue": "Zenodo", "date": "2026-11-15", "apa": "Yenamandra, R. S., Lalwani, S., Nsofu, M., & Ram, A. (2026). Open Reproducible Ray-Tracing Pipeline for 5G NR Multicell Digital Twins: From Public 3D City Data to an Interactive Artefact. Zenodo. https://doi.org/10.5281/ZENODO.24210759", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録（DataCiteに登録）を使用。本文は未取得", "preprint": true, "short": true, "p1": "公開の市の建物データと無料の計算資源だけで、5Gの複数基地局の電波を追跡するデジタルツインを、入力からウェブの成果物まで誰でも再現できる形で作る手順を示した（抄録）。", "p3": "サンフランシスコ市が公開する建物の外形をLiDARの高さで立ち上げた1,471棟と公開の地形で都市の場面を作り、無料のColabのGPUでSionna RTによるレイトレーシングを行い、出力を直接読むウェブの可視化を作った（抄録）。", "p5": "1km四方の3局9セクタ（3.6GHz）では街路の格子点の80.8%に経路があるが、受信電力−90dBm以上は24.3%だった。見通しのよい1局の150m以内は91%が覆われ、アンテナが屋根から2m以内の2局の周りは13%と28%で、場面と局の関係が結果を支配した。実測との比較はない（抄録）。", "fun": "スマートフォンの電波がどこまで届くかは、建物の高さや並び方で大きく変わる。この研究は、市が公開している建物データだけで電波の届き方を再現する仕組みを作り、アンテナの角度を変えるより、アンテナが周りの屋根より十分高いかどうかの方がずっと効くことを見せた。無料の道具で都市の「双子」を作れる点が面白い。", "unverified": "実測による検証は行われておらず、絶対値はモデルの出力。計算時間などの詳細は抄録から確認できない。"}}, {"id": "pr27", "rank": 27, "headline": "若者の地域活動は無償労働頼みか主導者の育成か", "title": "From Volunteers to Decision-Makers: The Value of Youth-Led Community Action", "url": "https://doi.org/10.5281/zenodo.24246132", "authors": "Ekumba, Escriva", "venue": "Zenodo", "date": "2026-11-15", "apa": "Ekumba, E. (2026). From Volunteers to Decision-Makers: The Value of Youth-Led Community Action (Version 0.1). Zenodo. https://doi.org/10.5281/ZENODO.24246132", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用。本文は未取得", "preprint": true, "short": true, "p1": "アフリカの若者の地域活動が、意思決定の主導者として力を与えられているのか、それとも時間と労働を提供する担い手として頼られているだけなのかを整理し、ボランティアは指導者への道であるべきだと論じた報告書（抄録）。", "p3": "既存の研究・機関の報告・記録された取り組みから、若者のボランティアの規模と形態、資金へのアクセス、無償労働、性別の格差、保護、参加から意思決定への移行を検討し、ケニア、ザンビア、カメルーン、コンゴ民主共和国の例を扱った（抄録）。", "p5": "ボランティアが有償の雇用や十分な公的サービスの代わりになってはならないと主張し、政府・自治体・援助機関・市民社会・企業・若者の組織への提言と、進捗を追う指標の案を示した。定量的な分析の結果は抄録にない（抄録）。", "fun": "地域のために若者が無償で働くのは美しい話に聞こえる。でも、その働きが評価も権限もお金も生まないまま当てにされ続けるなら、安い労働力の扱いと変わらないのではないか。この報告は、ボランティアを将来のリーダーへの階段にできるかを問う。善意の活動の裏側にある構造を考えさせる点が面白い。", "unverified": "若者のボランティアの規模を示す数値と、提案された指標の具体的な内容は抄録から確認できない。"}}, {"id": "pr28", "rank": 28, "headline": "衛星SWOTで描く世界の河川の流体力学的な状態", "title": "A global continuum of river hydrodynamic regimes", "url": "https://doi.org/10.22541/essoar.15012197/v1", "authors": "Qihua Ran", "venue": "ESS Open Archive", "date": "2026-11-14", "apa": "Ran, Q. (2026). A global continuum of river hydrodynamic regimes. https://doi.org/10.22541/essoar.15012197/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "ESS Open Archiveの抄録（Crossrefに登録）を使用。本文は未取得", "preprint": true, "short": true, "p1": "SWOT衛星の観測から、世界の河川の流体力学的な状態（流れ方向の運動量流束密度ρv²の変動）の初の世界地図を作り、河川の類型は離散的ではなく連続体だと示した（抄録、査読中のプレプリント）。", "p3": "地表水・海洋地形観測衛星（SWOT）の3.4年間の観測を97,566の河道区間に当て、運動量流束密度の動態を「流体力学的な状態」として地図化し、流量の状態も同じ一連の手法で調べた（抄録）。", "p5": "流体力学的な状態は主に地形でなく大気候で整理される単峰の連続体で、観測された流量の状態も同様に連続だった。大きなダムは川を連続体の上で動かすが新しい類型は作らず、流体力学的な状態と流量の状態の結びつきは弱かった（抄録）。", "fun": "川は100年近く「〇〇型」「△△型」といった種類に分けて考えられてきた。ところが衛星で世界中の約10万区間の流れの勢いを測ると、川の性格はきれいに分かれる種類ではなく、なだらかにつながった一本の連続体だった。分類は自然が決めたものではなく、人が持ち込んだ枠だったかもしれない、という指摘が面白い。", "unverified": "連続体と判定した統計的な手法の中身と、大気候による整理の定量的な指標は抄録から確認できない。"}}, {"id": "pr29", "rank": 29, "headline": "気候モデルの冷舌バイアスが夏の高気圧の予測を歪める", "title": "Equatorial Pacific cold tongue bias leads to an overestimated strengthening of the Northwest Pacific anticyclonic anomalies during post-El Niño summers under global warming", "url": "https://doi.org/10.22541/essoar.15012202/v1", "authors": "Wenping Jiang ほか", "venue": "ESS Open Archive", "date": "2026-11-14", "apa": "Jiang, W., Ji, Y., Huang, P., Song, X., Yu, J.-Y., Hu, Y., & Huang, G. (2026). Equatorial Pacific cold tongue bias leads to an overestimated strengthening of the Northwest Pacific anticyclonic anomalies during post-El Niño summers under global warming. https://doi.org/10.22541/essoar.15012202/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "ESS Open Archiveの抄録（Crossrefに登録）を使用。本文は未取得", "preprint": true, "short": true, "p1": "温暖化のもとでエルニーニョ翌夏の北西太平洋の高気圧偏差（NWPAC）が強まるという予測が、気候モデルの赤道太平洋の冷舌バイアス（冷水域を強く出しすぎる誤差）のために過大になっていることを示した（抄録）。", "p3": "CMIP5とCMIP6の42モデルで、冷舌バイアスが平均状態の温暖化に対する短波の減衰を弱めて西部赤道太平洋を暖めすぎ、エルニーニョ後の暖かい偏差が深い対流の閾値を超えやすくなって暖から冷への転換を速める仕組みを調べた（抄録）。", "p5": "冷舌バイアスはモデル間のNWPACの不確実性の28%を説明し、観測に基づく制約をかけるとNWPACの強化はかなり弱くなった（抄録）。", "fun": "温暖化の予測に使う気候モデルには、それぞれ「くせ」がある。この研究は、赤道の海の冷たい部分を強く出しすぎるくせが、東アジアの夏の天候を左右する高気圧の将来の強まりを大げさに見せていたと突き止めた。モデルのくせを観測で補正すると予測が変わるという点は、予測を読むときの注意として面白い。", "unverified": "観測制約の具体的な方法と、制約後のNWPACの強化の大きさは抄録から確認できない。"}}, {"id": "pr30", "rank": 30, "headline": "男性性の規範と精神的健康を孤独が媒介するか", "title": "Traditional Masculinity Norms and Mental Health: Loneliness as a Possible Mediator in a Male Community Sample", "url": "https://osf.io/chj9t", "authors": "Alma‐Sophia Merscher ほか", "venue": "OSF Preprints (OSF Preprints)", "date": "2026-11-12", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": true, "short": true, "p1": "題名からは、男性の地域住民のサンプルで、伝統的な男性性の規範と精神的健康の関係を孤独が媒介するかどうかを検討する研究と読める（題名のみ）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "「男は弱音を吐くな」といった伝統的な男らしさの規範は、心の健康にどう関わるのか。題名から読み取れる問いは、その規範が人を孤独にし、孤独が心の不調につながるという道筋があるかどうかだ。目に見えない社会の決まりごとが、人とのつながりを通じて健康に影響するかを問う点が面白い。", "unverified": "抄録・本文を入手できず、対象者の数、測定、分析方法、結果はすべて未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "生成AIで世界GDPは増えるが利得は資本に偏る", "title": "The wealth of algorithms: generative AI, jobs and inequality in a global dynamic CGE model", "url": "https://doi.org/10.31235/osf.io/ghr65", "authors": "David Radi", "venue": "SocArXiv", "date": "2026-11-14", "apa": "Radi, D. (2026). The wealth of algorithms: generative AI, jobs and inequality in a global dynamic CGE model. https://doi.org/10.31235/osf.io/ghr65", "why": "生成AIを職業内の課題の自動化と補完として世界動学CGEモデル（23地域、2040年まで）に組み込み、普及の速さ・費用・代替の程度などを変えた68の代替シナリオで比べた。中心ケースで2040年の世界GDPはAIなしより約7%高いが、利得の多くは資本の所有者に向かい、資本の分配率は約4ポイント上がると報告する。"}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "FRB議長の表情と言葉の感情が世界の市場を動かす", "title": "When Words Are Not Enough: Emotional Spillovers from Fed Chair Communication to Global Financial Markets", "url": "https://econpapers.repec.org/RePEc:een:camaaa:2026-86", "authors": "Yiru Chen ほか", "venue": "RePEc NEP", "date": "2026-11-02", "why": "2011〜2025年のFOMC後の記者会見から、文章・声・表情の感情指標を機械学習で作り、6つの主要経済の為替と株価への分単位の効果を局所射影で推定した。表情と文章の感情は声より強く頑健な効果を持ち、効果は様式間の相互作用に依存し、マクロ金融の脆弱性と世界の不確実性で増幅されると報告する。"}, {"id": "pn03", "rank": 3, "field": "交通・都市計画", "headline": "アルゼンチンのバス補助は中高所得層にも流れる", "title": "Universal and targeted subsidies in urban bus transport: distributional effects and policy lessons from Argentina", "url": "https://econpapers.repec.org/RePEc:dls:wpaper:0383", "authors": "Javier Morales Sarriera ほか", "venue": "RePEc NEP", "date": "2026-11-09", "why": "普遍的な定額補助と低所得層向けの補助、乗継割引が共存するアルゼンチンのバス運賃補助の分配上の帰着を、家計調査・移動のミクロデータ・行政記録で推計した。補助は相対的には累進的だが、絶対額では中・高所得の利用者に多くが流れ、その主な原因は普遍的な補助の大きさだとする。"}, {"id": "pn04", "rank": 4, "field": "統計学", "headline": "心理ネットワークの信頼性を分散分解で測る指標", "title": "Reliability Exploratory Graph Analysis (rEGA): Nodal Variance Decomposition and Coefficient Gamma for Psychometric Networks", "url": "https://doi.org/10.31234/osf.io/67pcn", "authors": "César Huerta-Huacchahuilca ほか", "venue": "PsyArXiv", "date": "2026-11-14", "apa": "Huerta-Huacchahuilca, C., & Ramos-Diaz, J. (2026). Reliability Exploratory Graph Analysis (rEGA): Nodal Variance Decomposition and Coefficient Gamma for Psychometric Networks. https://doi.org/10.31234/osf.io/67pcn", "why": "共通原因を仮定しない心理測定のネットワーク分析で、項目の分散をコミュニティ内の共通性・コミュニティ間の橋渡し・固有性に分解し、信頼性係数ガンマを定義するrEGAを提案した。97,200のデータセットのシミュレーションで、次元の復元と信頼性の推定が既存手法より正確だったと報告する。"}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "初対面の会話のつながりは意味の収束より応酬で決まる", "title": "Building Connection Through Conversation: Linguistic Convergence and Neural Complexity in Dyadic Interaction", "url": "https://doi.org/10.31234/osf.io/aqvr7", "authors": "Grace Qiyuan Miao ほか", "venue": "PsyArXiv", "date": "2026-11-15", "apa": "Miao, G. Q., Rosen, Z. P., Pluta, A., LIEBERMAN, M. D., Dale, R., & Li, Y. (2026). Building Connection Through Conversation: Linguistic Convergence and Neural Complexity in Dyadic Interaction. https://doi.org/10.31234/osf.io/aqvr7", "why": "初対面の70組の自然な会話を2人同時のfNIRSで記録し、意味の収束（収束エントロピー）と実質的な応酬（隣り合う発話の双方が内容を含む回数）を測った。会話の主観的な良さを予測したのは意味の収束ではなく実質的な応酬で、脳間の同期も応酬に対応したと報告する。"}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "積分変換とベイズ推定で梁の損傷を連続分布で同定", "title": "Generalized Integral Transform-based Structural Damage Identification via Bayesian Parameter Estimation and Model Class Selection", "url": "https://doi.org/10.1007/s42417-026-02886-x", "authors": "Renan Pinto de Andrade ほか", "venue": "Journal of Vibration Engineering & Technologies", "date": "2026-11-14", "sjr": 0.56, "citescore": 4.5, "citescore_year": "2025", "apa": "de Andrade, R. P., Knupp, D. C., & Stutz, L. T. (2026). Generalized Integral Transform-based Structural Damage Identification via Bayesian Parameter Estimation and Model Class Selection. Journal of Vibration Engineering & Technologies, 14(8). https://doi.org/10.1007/s42417-026-02886-x", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr02", "rank": 2, "headline": "低床路面電車2形式で車輪から台車への振動伝達を比較", "title": "A comparative study of structural vibration transfer in low-floo ntrols on the Shape of Earthquake Source Time Functions", "url": "https://doi.org/10.1029/2026jb034700", "authors": "Cheng‐Yi Wang ほか", "venue": "Journal of Geophysical Research: Solid Earth", "date": "2026-11-15", "sjr": 1.803, "citescore": 7.5, "citescore_year": "2025", "why": "スペクトル境界積分法による理想化した過応力パッチの破壊シミュレーションで、破壊の開始位置・背景応力の勾配・過応力域の形状・摩擦弱化が、それぞれ震源時間関数の異なる特徴を支配することを示した。自然の地震に多い早いピークと長い裾は、二次の摩擦弱化距離が総すべり量と同程度以上のときにだけ現れると報告する。"}, {"id": "jn04", "rank": 4, "field": "経営学", "headline": "女性取締役が多いとESG評価のばらつきが小さい", "title": "Women on Boards and Interagency ESG Rating Dispersion: The Moderating Roles of Board Age and Size in S&P 500 Firms", "url": "https://doi.org/10.1002/bse.71726", "authors": "Nitin Jain", "venue": "Business Strategy and the Environment", "date": "2026-11-15", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "why": "S&P500企業の2015〜2022年のパネルで、女性取締役の比率とBloombergとRefinitivのESG評価の乖離の関係を調べた。女性取締役が多いほど評価機関の間のばらつきは小さいが、取締役会の規模が大きいほど、また平均年齢が高いほど、この関係は弱まると報告する。"}, {"id": "jn05", "rank": 5, "field": "工学", "headline": "BIMの情報品質の失敗は見えない分類誤りが起点", "title": "Unveiling the “iceberg effect” in building information modelling (BIM): evidence from industry foundation classes (IFC) information exchange", "url": "https://doi.org/10.1108/ecam-05-2026-0980", "authors": "Wenjun Gao ほか", "venue": "Engineering, Construction and Architectural Management", "date": "2026-11-15", "sjr": 1.027, "citescore": 10.7, "citescore_year": "2025", "why": "IFCによるBIMの情報交換で、情報品質の次元の間の因果的な階層をDEMATEL-ISMで調べ、実務者の認識と比べた。実務者は下流の情報欠落を多く挙げる（71%）一方で上流の分類誤りは自発的に挙げず（0%）、分類が主な原因であることを4つのIFCモデルの検査でも確かめた。"}, {"id": "jn06", "rank": 6, "field": "交通・都市計画", "headline": "歴史地区の再生で住民の場所の感覚は高まったか", "title": "Can the regeneration of historic and cultural districts enhance residents' sense of place? Evidence from Guangzhou", "url": "https://doi.org/10.1108/ecam-01-2025-0019", "authors": "Fan Wu ほか", "venue": "Engineering, Construction and Architectural Management", "date": "2026-11-15", "sjr": 1.027, "citescore": 10.7, "citescore_year": "2025", "why": "広州の歴史・文化地区の再生の前後で住民の場所の感覚の変化を測る尺度を作り、201人の回答を構造方程式モデルで分析した。再生後に場所の感覚は有意に高まり、物理・社会環境の更新と地域文化の認識が寄与した一方、観光開発の認識の影響は小さかったと報告する。"}, {"id": "jn07", "rank": 7, "field": "機械学習", "headline": "2次元の配置を報告書に変えるLLMの文章生成", "title": "Space-to-Report: Transforming Spatial Layouts into Narrative Reports for Fluid Iterative Sensemaking", "url": "https://doi.org/10.1145/3862851", "authors": "Xuxin Tang ほか", "venue": "ACM Transactions on Intelligent Systems and Technology", "date": "2026-11-14", "sjr": 2.065, "citescore": 17.6, "citescore_year": "2025", "why": "利用者がカードを2次元に並べて考えを外在化する作業を、空間の構造と意味を制約としてLLMの連続的な文章生成に変換するSpace-Augmented Generationを提案し、試作システムReSPIREで実装した。統制した入力で空間と報告書の対応を線形に制御でき、12人の利用者研究で認知負荷を下げ反復を速めたと報告する。"}, {"id": "jn08", "rank": 8, "field": "経営学", "headline": "BIMのモデルと国の積算基準の間にある情報の境界", "title": "Installed but not integrated: the information-authorship boundary between BIM product models and state cost norms", "url": "https://doi.org/10.1108/ecam-07-2026-1482", "authors": "Duc Minh Nguyen", "venue": "Engineering, Construction and Architectural Management", "date": "2026-11-15", "sjr": 1.027, "citescore": 10.7, "citescore_year": "2025", "why": "国が定める積算基準を使う国でBIM 5Dが原価管理に使われない構造的な理由を、ベトナムの2021年の積算基準の206の情報要件の内容分析と3件のプロジェクトの対応づけで調べた。要件の81.1%はBIMモデルの外で作られる情報で、工法・仮設・現場条件など完成した製品でない情報が欠けていたと報告する。"}, {"id": "jn09", "rank": 9, "field": "機械学習", "headline": "診断と指導の2つのAIエージェントで算数の伸びが大きく", "title": "The design and impact of a dual-agent artificial intelligence system in personalised mathematics tutoring", "url": "https://doi.org/10.30935/cedtech/19950", "authors": "Ruonan Wang ほか", "venue": "Contemporary Educational Technology", "date": "2026-11-14", "sjr": 1.555, "citescore": 13.0, "citescore_year": "2025", "why": "学習者の特性を分類する診断エージェントと、分類に応じた段階的な指導を行う指導エージェントを組み合わせた算数の個別指導を、中国の小学5年生206人の準実験で評価した。実験群の伸びは対照群より大きかった（5.14対0.94、Hedgesのg = .61）が、特性ごとの比較で多重比較の補正後も有意だったのは1つだけだったと報告する。"}, {"id": "jn10", "rank": 10, "field": "工学", "headline": "複     "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
