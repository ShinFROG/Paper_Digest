 "sjr": 0.466, "citescore": 2.4, "citescore_year": "2025", "apa": "Kim, H., Li, N., Feldman, R., Liu, Y., & Feldman, Y. (2026). What Sustainability Disclosures Disclose. Journal of Empirical Legal Studies. https://doi.org/10.1111/jels.70048", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "企業のサステナビリティ開示に実際に何が書かれているのかを、大規模言語モデルを使って15,000件超の文書から測り、開示が主流になるにつれて記述の具体性と定量性が下がったことを示した（抄録）。", "p2": "サステナビリティ開示は信頼性と比較可能性に欠けると批判され、任意の報告の枠組みが広く採用されて規制にも影響してきた。しかし開示が標準化されていないため、何が書かれているのか、任意の道具が役に立っているのかという基本的な事実が分かっていなかった（抄録）。", "p3": "大規模言語モデルを使い、利害関係者が重要とみなす特徴を測定可能な指標にする。具体性、定量的な証拠、中身のなさ（誇張）、悪いニュース、データの表と図の数である（抄録）。", "p4": "ラッセル3000の2,100社超が1998〜2023年に出した15,000件超のサステナビリティ開示の文書を評価し、時期、報告の年数、外部保証と任意の枠組み（GRI、SASB、TCFD、CDP、SBTi）の採用との関係を見る（抄録）。", "p5": "5つの型が見つかった。報告と外部保証・枠組みの採用は2015年以降に急増した。企業は複数の枠組みを同時に採用し、採用は固定的だった。報告が主流になるにつれ、記述は具体性と定量性が下がり、中身のなさが増えた。長く報告している企業の報告はより具体的だが、それは主に早く始めた企業の違いと時代の傾向を反映する。枠組みの採用が改善につながるという一貫した証拠はなかった（抄録）。", "p6": "抄録の範囲では、言語モデルによる測定の正確さの検証は分からない（未確認）。解釈：関係は観察データの関連で、枠組みの採用の因果効果を識別したものではないと読める。対象は米国の企業である。", "fun": "会社が出す、環境や社会への取り組みの報告は増え続けている。では中身は良くなったのか。この研究は15,000件を超える文書を言語モデルに読ませ、具体的な記述や数字がどれだけあるかを測った。結果は逆で、報告が当たり前になるほど、内容は具体性を欠き、飾りの多いものになっていた。報告するかどうかは守らせやすいが、中身の質は評価しにくい、という指摘が鋭い。", "unverified": "本文は入手できず、指標の定義の詳細、言語モデルの検証、推定値は未確認。"}}, {"id": "jr11", "rank": 11, "headline": "LLMエージェント集団の誤情報拡散をSEIRで記述", "title": "Investigating the misinformation propagation process in multi-agent systems based on large language models", "url": "https://doi.org/10.20517/ir.2026.43", "authors": "Yixian Li ほか", "venue": "Intelligence & Robotics", "date": "2026-11-23", "sjr": 0.67, "citescore": 5.8, "citescore_year": "2025", "apa": "Li, Y., Wu, W., Wang, Q., Hu, S., & Zhao, Y. (2026). Investigating the misinformation propagation process in multi-agent systems based on large language models. Intelligence & Robotics, 6(4), 1015–1029. https://doi.org/10.20517/ir.2026.43", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "出版社サイトのHTML本文（方法の2節、実験設定の3.1、結果の3.2の一部、考察の4.1）を読んだ", "preprint": false, "p1": "LLMで動くエージェントの集団の中で、一部のエージェントが流した誤情報がどう広がるかを、感染症の流行のモデル（SEIRモデル）で記述する枠組みを示した（Abstract、2.2）。", "p2": "分散型のマルチエージェント系では、一部の節点の異常が連鎖して系全体の失敗につながりうる。従来の研究は主に従来型のエージェントを対象とし、LLMで動くエージェントの集団での波及は十分に分かっていなかった（1節）。", "p3": "エージェントの状態を、誤情報にまだ触れていない（S）、触れたがまだ広めていない（E）、影響を受けて広めている（I）、推論の中で影響を取り除いた（R）の4つに対応させる。各エージェントは毎回、近隣の答えを考慮して質問に答え、その答えを近隣に送る。接触率・潜伏の率・回復率は外から与えず、状態の遷移の回数から推定する（2.1〜2.3、3.2）。", "p4": "一部のエージェントを最初から誤情報を広める状態にして開始する。正解が明確な複数の種類の質問を使い、ワッツ・ストロガッツのスモールワールド型とバラバシ・アルバートのスケールフリー型のネットワーク、初期の割合20%と40%で、状態ごとのエージェント数の推移と推定した率を比べる（3.1、図2）。", "p5": "スケールフリー型では、推定した接触率がスモールワールド型よりおおむね高く、差は初期の割合20%の単純な二択の問題で最も目立った。次数の大きいハブに初期の拡散役がいると、数回のやり取りで大半に広がりうるためである。潜伏の率と回復率はネットワークの型にあまり左右されなかった（4.1）。", "p6": "模擬実験による枠組みの提示で、率の推定値の一覧、使ったLLMとエージェントの数は読んだ範囲では確認できなかった（未確認）。解釈：質問は正解が明確なものに限られ、意見が分かれる話題での広がり方は扱っていない。", "fun": "AIどうしが答えをやり取りしながら問題を解く集団で、一部のAIが間違った情報を流すと、周りのAIがそれに影響され、間違いがうつっていく。この研究は、感染症の広がりを表すモデルをそのままAIの集団に当てはめた。つながりの多いAIが最初の発信源だと、数回のやり取りで大半に広がる。一方で、推論の中で影響を取り除いて回復するAIもいるのが面白い。", "unverified": "初期の割合の影響（4.2）、質問の種類の影響（4.3）、回復率の安定性（4.4）の内容と、表の数値は読んでいない。"}}, {"id": "jr12", "rank": 12, "headline": "店が似るほど習慣の慣性で客は他社に移らない", "title": "Moving within or moving away? Customer mobility under retail format homogenisation in omnichannel retailing", "url": "https://doi.org/10.1108/ijrdm-06-2026-0429", "authors": "Yi-Mu Chen", "venue": "International Journal of Retail & Distribution Management", "date": "2026-11-23", "sjr": 1.484, "citescore": 11.9, "citescore_year": "2025", "apa": "Chen, Y.-M. (2026). Moving within or moving away? Customer mobility under retail format homogenisation in omnichannel retailing. International Journal of Retail & Distribution Management, 1–15. https://doi.org/10.1108/ijrdm-06-2026-0429", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "同質化したオムニチャネル小売で、店の類似性と切り替えのリスクの知覚が習慣による慣性を強め、客を競合へ移らせず、同じ小売業者のオンラインの販路へ移らせることを示した（抄録）。", "p2": "小売の業態が同質化した環境で、類似性とリスクの手がかりが客の移動をどう形づくるのか。抄録は、小売業者をまたぐ移動と、同じ小売業者の中でのオンラインへの移行を区別する「二重の移動」の見方を新しさとして示す（抄録）。", "p3": "外部の切り替え（競合の小売業者へ）と、内部のオンライン移行（同じ小売業者のオンラインの販路へ）を区別する枠組みを立てる。同化・対比の理論を業態の同質化に広げ、習慣による慣性と技術への準備度を組み込む（抄録）。", "p4": "2つの研究からなる。研究1は外部の切り替えと内部のオンライン移行の区別に最初の裏づけを与え、研究2は大型スーパーとスーパーマーケットの両方を利用した経験のある消費者293人の調査データで枠組みを検証した（抄録）。", "p5": "オムニチャネル小売の類似性の知覚と切り替えのリスクの知覚は、どちらも習慣による慣性を強めた。慣性は競合の小売業者への外部の切り替えを減らし、同じ小売業者のオンラインの販路への移行を増やした。技術への準備度は、内部のオンライン移行については正の調整の型を示したが、外部の切り替えについては示さなかった（抄録）。", "p6": "抄録の範囲では、研究1の方法、測定の尺度、係数の大きさ、調査の国は分からない（未確認）。解釈：調査データによる関連であり、実際の購買行動で確かめたものではない。", "fun": "どの店も似てくると、客はもっと自由に店を変えそうに思える。ところがこの研究によると、似ていると感じるほど習慣の力が強まり、客は競合へ移らなくなる。動くとしたら、同じ会社のオンラインの販路へという移り方だった。客の移動を「他社へ」と「同じ会社の中で」に分けて見る発想が面白い。", "unverified": "本文は入手できず、尺度、標本の属性、推定値は未確認。"}}, {"id": "jr13", "rank": 13, "headline": "所得の高い地域の家族介護者ほど否定的感情が強い", "title": "Neighborhood Income and Negative Emotions among Family Caregivers of Older Adults in Hong Kong: Role of Unmet Service Needs.", "url": "https://doi.org/10.1093/geront/gnag265", "authors": "Cheung ESL ほか", "venue": "The Gerontologist", "date": "2026-11-21", "sjr": 1.552, "citescore": 7.0, "citescore_year": "2025", "apa": "Cheung, E. S. L., Lou, V. W., Tang, V. M. Y., Tsoi, T. C. W., & Lin, W. W. (2026). Neighborhood Income and Negative Emotions among Family Caregivers of Older Adults in Hong Kong: Role of Unmet Service Needs. The Gerontologist. https://doi.org/10.1093/geront/gnag265", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "高齢者を自宅で世話する家族介護者の抑うつ・不安・ストレスが、住んでいる地域の所得の水準と関連し、その関連が、身近なサービスの数ではなく、介護者の「満たされていないサービスのニーズ」で説明されることを示した（抄録）。", "p2": "介護者の心の健康を支えることは、介護者と介護を受ける人の両方の生活の質を高めうる。しかし、地域の経済的な資源が家族介護者の心の健康に果たす役割を調べた研究は限られていた（抄録）。", "p3": "香港の介護者の住民調査の個人のデータを、2021年の国勢調査と空間のデータ（地域の水準）に結びつける。多水準の線形回帰で、地域の所得の中央値と3つの否定的な感情（抑うつ・不安・ストレスの尺度で測定）の関連を調べ、媒介分析で、地域のサービスの地理的な提供と未充足のサービスのニーズが関連を説明するかを調べる（抄録）。", "p4": "分析の標本は2,254人。媒介の候補は、地域のコミュニティサービスの数で測った地理的な提供と、介護者の未充足のサービスのニーズである（抄録）。", "p5": "地域の所得の中央値が高いほど、家族介護者の全ての否定的な感情の水準が高かった。未充足のサービスのニーズは、地域の所得と抑うつ・ストレスの関連を統計的に説明したが、サービスの地理的な提供はどの関連も媒介しなかった（抄録）。", "p6": "解釈：横断的なデータの関連で、因果の向きは確かめられていない。所得の高い地域でなぜ未充足のニーズが多いのかの説明と、係数の大きさは抄録にない（未確認）。香港の事例である。", "fun": "所得の高い地域に住む介護者のほうが、気持ちが楽だろうと思いがちだ。この研究の結果は逆で、所得の高い地域の家族介護者ほど、否定的な感情が強かった。手がかりは、近くにサービスがいくつあるかではなく、介護者が感じている「必要なサービスが足りていない」というニーズだった。サービスの数だけでは測れない困りごとがあることを示している。", "unverified": "本文は入手できず、係数、媒介の割合、調査の詳細は未確認。"}}, {"id": "jr14", "rank": 14, "headline": "ハイテクとハイタッチの両立が従業員の幸福を左右", "title": "High-tech vs. high-touch in hospitality: finding the balance of well-being for human assets", "url": "https://doi.org/10.1108/ijchm-02-2026-0270", "authors": "Wen Chang ほか", "venue": "International Journal of Contemporary Hospitality Management", "date": "2026-11-23", "sjr": 3.116, "citescore": 22.1, "citescore_year": "2025", "apa": "Chang, W., Mistry, T. G., Kim, K., Shulga, L. V., Cain, L. N., & Baker, M. A. (2026). High-tech vs. high-touch in hospitality: finding the balance of well-being for human assets. International Journal of Contemporary Hospitality Management, 38(13), 411–430. https://doi.org/10.1108/ijchm-02-2026-0270", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ホスピタリティ産業で、技術の活用（ハイテク）と人による接客（ハイタッチ）の両方を同時に求められる従業員の幸福について、技術を外からの影響ではなく職場の社会的な構成要素として捉える見方を示し、今後の研究課題を整理した（抄録）。", "p2": "技術の導入の研究は顧客の成果と業務の効率に注目しており、ハイテクとハイタッチの要求を同時にこなす従業員の経験は、理論的に十分に扱われていなかった（抄録）。", "p3": "社会技術システム理論を分析のレンズにして、関連する文献を批判的に統合する。技術システムと社会システムを同時に最適化することが、従業員の幸福、仕事の生活の質、行動の成果にどう影響するかを検討する（抄録）。", "p4": "新しいデータによる検証ではなく、文献の統合と比較による概念的な論文である。ハイテクとハイタッチの環境での幸福について、批判的な比較と考慮点を示す（抄録）。", "p5": "文献の統合から、技術は単なる外部の影響ではなく、ホスピタリティの労働力の中の不可欠な社会的な構成要素として見るべきだとする。技術は接客の環境と深く絡み合っており、ハイテクとハイタッチのつり合いは動的で変わり続ける関係で、従業員の幸福を目立たないが大きく形づくる（抄録）。", "p6": "著者は、この研究の目的を、ハイテクとハイタッチの両方を求める仕事の要求が、すでに働きすぎの従業員にどう影響するかについての批判的な考察と今後の研究を促すことだとしている（抄録）。解釈：実証的な検証は含まれず、主張の強さは取り上げた文献に依存する。", "fun": "ホテルやレストランで働く人は、技術を使いこなしながら、同時に人による接客もしなければならない。技術の導入の研究は客の側や効率に注目してきたが、この論文は働く人の側に目を向けた。技術を外から来る道具ではなく、職場の一部として見ることを提案する。技術と人のどちらかではなく、そのつり合いが働く人の幸福を形づくるという見方が面白い。", "unverified": "本文は入手できず、取り上げた文献、示された研究課題の具体的な内容は未確認。"}}, {"id": "jr15", "rank": 15, "headline": "石造の塔の固有振動数を2年間、温湿度とともに計測", "title": "Long-term dynamic monitoring of a masonry tower: a case study of Arnolfo Tower within Palazzo Vecchio in Florence, Italy", "url": "https://doi.org/10.1186/s43238-026-00322-3", "authors": "Marco Tanganelli ほか", "venue": "Built Heritage", "date": "2026-11-23", "sjr": 0.532, "citescore": 3.0, "citescore_year": "2025", "apa": "Tanganelli, M., Azzara, R. M., Trovatelli, F., & Viti, S. (2026). Long-term dynamic monitoring of a masonry tower: a case study of Arnolfo Tower within Palazzo Vecchio in Florence, Italy. Built Heritage, 10(1). https://doi.org/10.1186/s43238-026-00322-3", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "出版社サイトのHTML本文（計測の§3、結果の§4.1・§4.3・§4.4の要所、結論の冒頭）を読んだ", "preprint": false, "p1": "フィレンツェのヴェッキオ宮殿にある石造のアルノルフォの塔で、2年間にわたり振動と温度・湿度を同時に測り、主要な2つの固有振動数がどれだけ変わるか、その変動が推定される材料の硬さ（ヤング率）にどう響くかを示した（抄録、§5）。", "p2": "歴史的な石造の建物は形も材料も複雑で、破壊的な調査ができないため、振動の計測による同定が向いている。しかし計測値は偶発的な出来事や気象の影響を受け、温度と湿度が動的な性質を変えるので、信頼できる評価には長期の計測が要る（抄録）。", "p3": "塔に6か所の観測点（2.0 Hzの3成分の速度計）を置き、基部の基準点と頂部の点は2年間固定した。主要な2つのモードの振動数を追い、温度・相対湿度・風の記録と比べる。さらに、観測された振動数の変動の幅を考慮した数値解析で、仮定するヤング率への影響を調べる（§3、§4.4）。", "p4": "評価は、2年間の振動数の変動の幅、温度・湿度との相関、文献で報告された歴史的な石造建造物の振動数の変動（2.6%〜19.3%）との比較による（§4.1、§4.3）。", "p5": "第1の振動数は0.45〜0.53 Hz（平均0.49 Hz）、第2は0.75〜0.83 Hz（平均0.79 Hz）で、変動はそれぞれ16.3%と10.1%だった（§4.1、表1）。全期間では振動数と温度に相関はないが、最も寒い月・最も暑い月・中間の月に分けると相関は60%近くに上がった（§4.3）。第1の振動数の16%の変動は、ヤング率の32%の変動に相当する（§4.4、表2）。", "p6": "1つの塔の事例である。解釈：温度と振動数の関係は温度の範囲によって傾向が変わり、単純な補正の式は示されていない。ヤング率の変動は数値モデルを通じた推定で、直接測ったものではない（§4.4）。著者による限界の明示は読んだ範囲では確認できなかった。", "fun": "石でできた古い塔も、温度や湿度が変わると揺れ方が変わる。フィレンツェの塔を2年間測ると、塔の主な振動数は16.3%も変動していた。面白いのは、全期間を通して見ると温度との関係がはっきりしないのに、寒い月と暑い月に分けると関係が現れる点だ。建物の状態を揺れから評価するには、こうした環境による変化をまず知っておく必要がある。", "unverified": "風との関係、2022年7月の短期間の詳しい分析、数値モデルの詳細（§2.2）は読んでいない。"}}, {"id": "jr16", "rank": 16, "headline": "地盤材料の連続から不連続への破壊の数値解法を総覧", "title": "Research Progress on Numerical Analysis Methods for Continuous–Discontinuous Progressive Deformation of Geomaterials", "url": "https://doi.org/10.3390/app162311581", "authors": "Yonghui Li ほか", "venue": "Applied Sciences (Switzerland)", "date": "2026-11-23", "sjr": 0.555, "citescore": 6.1, "citescore_year": "2025", "apa": "Li, Y., Xu, G., Tang, H., Zhang, Z., Wu, A., & Sun, A. (2026). Research Progress on Numerical Analysis Methods for Continuous–Discontinuous Progressive Deformation of Geomaterials. Applied Sciences, 16(23), 11581. https://doi.org/10.3390/app162311581", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "地盤材料が連続的な変形から割れ・すべり・崩壊といった不連続な破壊へ移る過程を計算する数値解法を、連続体の方法、離散体の方法、両者の連成に分けて整理した総説。", "p3": "遷移の仕組みを、連続、弱い不連続、強い不連続の3段階と分岐理論・ひずみ局所化の基準から整理し、損傷有限要素、拡張有限要素、位相場、ペリダイナミクス、MPM、個別要素法、不連続変形法、FDEMやDEM–MPMなどの連成の枠組みを、定式化・能力・限界で比べた（抄録）。", "p5": "残る課題として、計算効率、パラメータの較正、連成の界面の整合性、多物理の連成、機械学習との統合、適応的な多重スケールのモデル化、実時間に近い計算を挙げる（抄録）。", "fun": "土や岩は、力を受けるとまず全体がじわじわ変形し、やがてひびが入り、最後は塊に分かれて滑り落ちる。前半は「つながった物体」として、後半は「ばらばらの塊」として計算する方法がそれぞれあるが、途中で切り替わる現象を1つの計算で追うのが難しい。この総説は、その橋渡しの方法を見取り図にまとめている。", "unverified": "総説のため新しい計算結果はなく、各手法の精度の比較の数値は抄録になく未確認。"}}, {"id": "jr17", "rank": 17, "headline": "配偶者の有無と関係の緊張が施設入所を左右する", "title": "Social conditions, family solidarity, and gendered pathways to long-term care", "url": "https://doi.org/10.1093/geronb/gbag223", "authors": "Brian Joseph Gillespie ほか", "venue": "Journals of Gerontology - Series B Psychological Sciences and Social Sciences", "date": "2026-11-23", "sjr": 1.503, "citescore": 6.8, "citescore_year": "2025", "apa": "Gillespie, B. J., & Artamonova, A. (2026). Social conditions, family solidarity, and gendered pathways to long-term care. The Journals of Gerontology, Series B: Psychological Sciences and Social Sciences. https://doi.org/10.1093/geronb/gbag223", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "高齢者が介護施設への入所を予想したり実際に入所したりするかどうかに、配偶者・子ども・親族・友人との関係がどう関わるか、男女でどう違うかを示した。", "p3": "米国の健康と退職に関する調査（2010〜2022年）の70歳以上の全国代表の標本で、入所の予想は変量効果の順序ロジスティック回帰、実際の移行は死亡を競合リスクとするFine-Grayの部分分布ハザードモデルで分析した（抄録）。", "p5": "配偶者がいると予想も実際の入所も少なく、その効果は男性で大きかった。女性の入所は、気持ちの近い子どもがいると抑えられた。関係の中の対立や緊張が最も一貫した相関要因で、どの関係の緊張も実際の入所の多さと関連した（抄録）。", "fun": "年を取って施設に入るかどうかは、体の具合だけで決まるわけではない。この研究は、家族や友人との関係に注目し、とくに関係の中の対立や気疲れが入所と強く結びついていることを示した。孤独を感じているかどうかよりも、関係がぎくしゃくしているかどうかのほうが一貫して関連していた、という点が意外で面白い。", "unverified": "効果の大きさを示す数値は抄録になく未確認。標本の人数も抄録には書かれていない。"}}, {"id": "jr18", "rank": 18, "headline": "LLM複数エージェントの診断力は規則の検証に由来", "title": "Bearing Fault Diagnosis with Tool-Augmented LLM Agents: A Rule-Verified Multi-Agent System for Collaborative Manufacturing", "url": "https://doi.org/10.3390/info17121197", "authors": "Md Mohsin Uddin Fahim ほか", "venue": "Information", "date": "2026-11-23", "sjr": 0.805, "citescore": 8.2, "citescore_year": "2025", "apa": "Fahim, M. M. U., Siddique, M. A., Pol, S. M., & Lopes, A. J. (2026). Bearing Fault Diagnosis with Tool-Augmented LLM Agents: A Rule-Verified Multi-Agent System for Collaborative Manufacturing. Information, 17(12), 1197. https://doi.org/10.3390/info17121197", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Europe PMCに登録された抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "機械の軸受の故障診断にLLMの複数エージェントを使うと何が良くなるのかを確かめ、診断の力は固定の規則から来ていて、エージェントを増やした効果ではないことを示した。", "p3": "ツールを使うマルチエージェントのLLMで、規則で決められる判断は必ず規則が上書きする。訓練データで較正した周波数の規則が故障の主張を検証し、矛盾する事例は技術者に回す。PaderbornとXJTU-SYの33個の軸受の360件の試験事例で比べた（抄録）。", "p5": "故障位置の正解率は0.673で、ピーク照合・規則だけの方法（どちらも0.664）や同じ規則のもとの単一エージェント（0.655）と同等だった。規則のないLLMは30ポイント以上上回ったが、報告の79%にツールの出力と矛盾する記述があり、自己申告の確信度は誤りを示さなかった（AUROC 0.53）（抄録）。", "fun": "AIを何体も協力させれば、1体より賢くなりそうに思える。この研究は機械の故障診断でそれを確かめ、診断の力の源は、複数のAIではなく決まった規則だったことを突き止めた。しかもAIが書いた報告の79%には、道具が出した結果と食い違う文がまじっていた。数字の引用は正しくても、説明が正しいとは限らないという指摘が鋭い。", "unverified": "使ったLLMの名前と規則の中身は抄録からは分からず未確認。"}}, {"id": "jr19", "rank": 19, "headline": "AI導入は組織支援の知覚を通じて従業員の幸福と関連", "title": "AI Adoption and Employee Well-Being in Pakistan’s Banking Sector: A Moderated-Mediation Model", "url": "https://doi.org/10.1177/21582440261507307", "authors": "Qamaruddin Maitlo ほか", "venue": "Sage Open", "date": "2026-11-23", "sjr": 0.541, "citescore": 3.5, "citescore_year": "2025", "apa": "Maitlo, Q., Sohu, J. M., Meharunisa, S., Gul, M., & Ahamad, R. (2026). AI Adoption and Employee Well-Being in Pakistan’s Banking Sector: A Moderated-Mediation Model. Sage Open, 16(4). https://doi.org/10.1177/21582440261507307", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "職場へのAIの導入が、会社に支えられているという従業員の感覚を通じて、幸福感や仕事の自律性と結びつくことを、パキスタンの銀行員の調査で示した。", "p3": "社会的交換理論と仕事の要求度-資源理論に基づき、AI導入が知覚された組織支援を介して従業員の幸福と仕事の自律性に関連し、アルゴリズムの透明性の知覚がその経路を調整するというモデルを立てた。銀行員383人の3時点の時間差つき調査をPLS-SEMで分析した（抄録）。", "p5": "AI導入は組織支援、幸福、自律性と正に関連し、組織支援は両方の結果への効果を部分的に媒介した。アルゴリズムの透明性は、AI導入から組織支援への経路を有意に強めた（抄録）。", "fun": "職場にAIが入ると、気持ちが沈みそうに思える。この調査では逆に、AIの導入が進んでいると答えた人ほど幸福感が高かった。鍵は「会社が自分を支えてくれている」という受け止め方で、AIがどう判断しているかが見えると感じる人ほど、その受け止めが強まった。同じ道具でも、見え方しだいで受け止められ方が変わる。", "unverified": "係数の大きさは抄録になく未確認。自己申告の調査で、因果関係を確かめたものではない。"}}, {"id": "jr20", "rank": 20, "headline": "大学事務のAI導入は技術ストレスを介し幸福を下げる", "title": "Artificial intelligence adoption and occupational well-being in higher education management: evidence from universities in Guangzhou", "url": "https://doi.org/10.3389/fpsyg.2026.1931597", "authors": "Chunlong Zeng ほか", "venue": "Frontiers in Psychology", "date": "2026-11-23", "sjr": 0.941, "citescore": 7.0, "citescore_year": "2025", "apa": "Zeng, C., & Kasim, R. S. R. (2026). Artificial intelligence adoption and occupational well-being in higher education management: evidence from universities in Guangzhou. Frontiers in Psychology, 17. https://doi.org/10.3389/fpsyg.2026.1931597", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用。本文は読んでいない", "preprint": false, "short": true, "p1": "大学の事務・管理の仕事へのAI導入は、技術によるストレス（テクノストレス）を通じて職業上の幸福感の低さと結びつき、直接の利益は確認できないことを示した。", "p3": "仕事の要求度-資源モデルとテクノストレスの研究に基づき、広州の大学の管理部門の320件の横断的な質問紙データを、交互作用を2段階で指定したPLS-SEMと5,000回のブートストラップで分析した（抄録）。", "p5": "AI導入はテクノストレスと正に、テクノストレスは幸福感と負に関連した。AI導入と幸福感の直接の関連は有意でなく、テクノストレスを通じた負の間接の関連が有意だった。モデルはテクノストレスの分散の23.04%、幸福感の分散の10.69%を説明した（抄録）。", "fun": "AIが事務仕事を手伝ってくれれば楽になるはずだが、新しい道具は別のストレスを生むことがある。この調査では、AIの導入と幸福感の間に直接の関係は見つからず、見つかったのは「AI→技術のストレス→幸福感の低さ」という回り道の関連だけだった。便利さが自動的に働きやすさにつながるわけではないことを示している。", "unverified": "横断調査で、著者自身が因果の仕組みは確立できないと断っている。"}}, {"id": "jr21", "rank": 21, "headline": "高速列車通過時の土-鋼複合橋の動的解析", "title": "Dynamic analysis of closed-shape soil-steel composite bridges subjected to high-speed train passage", "url": "https://doi.org/10.1016/j.istruc.2026.113562", "authors": "Seyed Amin Hosseini Tehrani ほか", "venue": "Structures", "date": "2026-11-23", "sjr": 1.108, "citescore": 7.1, "citescore_year": "2025", "apa": "Hosseini Tehrani, S. A., Andersson, A., Zangeneh Kamali, A., & Battini, J.-M. (2026). Dynamic analysis of closed-shape soil-steel composite bridges subjected to high-speed train passage. Structures, 94, 113562. https://doi.org/10.1016/j.istruc.2026.113562", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ。出版社サイトから抄録・本文を取得できなかった", "preprint": false, "short": true, "p1": "題名から、閉じた形状の土-鋼複合橋を高速列車が通過するときの動的な挙動を解析した研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "土と鋼が一緒になって荷重を支える橋の上を、高速列車が走り抜ける。列車が通るとき、この種の橋はどう揺れるのだろうか。題名からは、その揺れを解析で調べた研究と読み取れる。", "unverified": "抄録・本文を入手できず、解析の方法、対象の橋、結果は 26.115184", "authors": "Nicholas Pomianek ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-23", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "apa": "Pomianek, N., Jerome, T., Gutierrez-Wing, E., & McDaniel, J. G. (2027). Observations of internal slapping and stick–slip behavior in a bolted joint using 4-camera stereo DIC. Mechanical Systems and Signal Processing, 263, 115184. https://doi.org/10.1016/j.ymssp.2026.115184", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、題名検索で見つかった別の記録（Crossref、プレプリント版とみられる）の抄録を使用", "preprint": false, "short": true, "p1": "ボルトで締めた接合部の内側で起きている相対的な動き（接線方向の離れや、固着とすべりのくり返し）を、接合部の性質を変えずに近似的に測る新しい方法を示した。", "p3": "4台の高速度カメラによるステレオ撮影の映像にデジタル画像相関法（DIC）を適用する。接合部の両側を同時に3次元で撮影し、得られた2つの表面を比べて界面の相対運動を近似する。加振機で共振させた、DIC用に改造したベンチマーク構造を対象にした（抄録）。", "p5": "時間領域の結果に加え、全体の相対変位、過渡的なスティックスリップの計測、複数のステレオDICでベクトル化した変位を計算する方法、新しい非線形性のパラメータの開発を報告している。抄録には具体的な数値は示されていない（抄録）。", "fun": "ボルトで留めた部材は、揺らすと合わせ目がわずかにすべったり、くっついたりを繰り返す。合わせ目は外から見えず、センサーを入れると性質が変わってしまうのが難しいところだ。この研究は、接合部の両側を4台の高速度カメラで同時に撮り、両面の動きの差から内側の動きを推し量った。見えないものを外側から挟んで測る発想が面白い。", "unverified": "抄録は題名検索で見つかった別の記録のもので、掲載版と同じ内容かは未確認。計測の精度を示す数値は抄録にない。"}}, {"id": "jr28", "rank": 28, "headline": "EKFに着想を得た軽量NNでIMUから車速を推定", "title": "EKFNet: A Lightweight EKF-Inspired Neural Network for IMU-Based Vehicle Speed Estimation", "url": "https://doi.org/10.1109/jiot.2026.3756512", "authors": "Dongpeng Xie ほか", "venue": "IEEE Internet of Things Journal", "date": "2026-11-23", "sjr": 2.144, "citescore": 14.7, "citescore_year": "2025", "apa": "Xie, D., Jiang, J., Yan, P., Li, Y., Wang, Y., Wang, Q., & Liu, J. (2026). EKFNet: A Lightweight EKF-Inspired Neural Network for IMU-Based Vehicle Speed Estimation. IEEE Internet of Things Journal, 1. https://doi.org/10.1109/jiot.2026.3756512", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ。出版社サイトから抄録・本文を取得できなかった", "preprint": false, "short": true, "p1": "題名から
