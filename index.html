0.21203/rs.3.rs-11774817/v1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "値段の高い製品は長持ちするのかを、欧州の消費者テストの実測データで確かめ、価格と耐久性の間に弱いながらも正の関係があることを示した。", "p3": "チェコ・ドイツ・英国・スペインの消費者テスト機関の743の試験群・11,943件の製品（2005〜2026年）で、同じ試験の中での価格と総合評価・耐久性の実測を比べた。試験群の約40%で仮説を作り、事前登録のうえ残りで検証した（抄録）。", "p5": "検証用の標本で、価格と総合評価の試験内の順位相関は.45だった。品質全般を考慮したあとの耐久性との関連は.26（95%信頼区間.15〜.37）だった。平均の価格順位が高いブランドは、所有者が報告した故障が少なかった（−.37、122のブランド・品目の組）（抄録）。", "fun": "「高いものは長持ちする」と言われるが、本当だろうか。買う前に値段は比べられても、何年もつかは分からない。この研究は、消費者団体などが実験室で行った試験の結果を11,943件集めて確かめた。高い製品はたしかに少し長持ちする傾向があったが、その結びつきは強くない。値段だけでは耐久性の手がかりとして十分でないことが、数字で見える。", "unverified": "製品の品目の内訳、耐久性の測定方法、相関の種類の詳細は抄録の範囲では未確認。"}}, {"id": "pr50", "rank": 50, "headline": "授業の乱れは生徒対応のストレスを介して教員の負担に", "title": "Classroom Disruption and Teacher Workplace Well-Being in Uzbekistan: The Mediating Role of Behaviour-Related Stress in TALIS 2024", "url": "https://doi.org/10.21203/rs.3.rs-10734945/v1", "authors": "Feruza Shakirova ほか", "venue": "Research Square (In Review)", "date": "2026-11-26", "apa": "Shakirova, F., & Shorustamboyeva, S. (2026). Classroom Disruption and Teacher Workplace Well-Being in Uzbekistan: The Mediating Role of Behaviour-Related Stress in TALIS 2024. https://doi.org/10.21203/rs.3.rs-10734945/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "授業が乱されることと教員の職場でのwell-beingの関係の一部が、生徒の行動に関するストレスを経由していることを、国際調査のウズベキスタンのデータで示した。", "p3": "仕事の要求度-資源モデルと資源保存理論にもとづき、OECDのTALIS 2024の前期中等教育の教員（全標本4,431人、変数がそろう1,466人）で、調査の重みと反復複製法（100組の重み）の標準誤差を使った回帰による媒介分析を行った（抄録）。", "p5": "生徒の行動に関するストレスを通る間接的な経路は有意で（間接効果0.082、95%信頼区間0.057〜0.106）、推定された全体の関連の22.5%を占めた。直接の経路も有意で、媒介は部分的だった。自己効力感や経験年数による調整は検出されなかった（抄録）。", "fun": "授業中に騒ぐ生徒がいると先生は疲れる。それは当たり前に思えるが、どういう道筋で負担になるのかは別の問いだ。この研究は、授業の乱れが「生徒への対応のストレス」を通じて先生の負担感につながる分が、全体の22.5%だと見積もった。残りは別の道筋ということになる。当たり前に見える関係を、経路ごとに分けて大きさを測るところが研究らしい。", "unverified": "横断データのため因果の順序は示されていない（著者も明記）。尺度の項目内容、他国との比較は抄録の範囲では未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "複雑な仕事ほど若手をAIに置き換えにくい", "title": "Will AI Replace Juniors? How Task Complexity Reduces Automation Risk", "url": "https://arxiv.org/abs/2611.34099", "authors": "Vincent Rost ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Rost, V., & Stephany, F. (2026). Will AI Replace Juniors? How Task Complexity Reduces Automation Risk (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34099", "why": "ドイツの情報経済と製造業の1,435社の管理職を対象にした事前登録の調査実験。追加の人手が必要な業務を、定型的な業務か、専門的な判断と文脈の知識が要る複雑な業務かに無作為に割り当てた。複雑な業務では、新人を雇う代わりにAIを使う意向が5段階で0.54点下がり、人による監督の重要度が0.15点上がった。AIが若手の仕事を奪うかどうかは業務の複雑さに左右されることを、企業の判断の側から示した。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文のうち、§3.1冒頭・§3.2・§3.3.1・§3.3.2・§4.1・§5.1・§5.2・§5.3・§6.1・§7.2を読んだ。", "preprint": true, "p1": "ドイツの1,435社の経営層に事前登録した調査実験を行い、追加の人手が要る業務が複雑だと、若手を雇う代わりにAIを使う意向が5段階で0.54点下がることを示した（抄録）。", "p2": "業務の複雑さが、若手の労働をAIで置き換えようとする企業の意向をどう変えるかを問う（抄録）。仮説は、複雑な業務では代替の意向が下がり（H1）、人による点検の重要度が上がり（H2）、AIが使えることで若手の採用が減ると見込まれる（H3）というものである（§4.1、§5.3）。", "p3": "ZEWが四半期ごとに行う情報経済・製造業の企業調査（従業員5人以上、質問紙はCEO宛て）に実験を組み込んだ（§3.1）。長く続く追加の人手需要という同じ場面で、業務を「専門的判断・文脈知識・自力の問題解決が要る」（705社）か「標準化され構造が明確」（730社）かに無作為に割り当て、AIで代替する見込みと、AIの出力を人が点検する重要度を各5段階で尋ねた（§3.2、§3.3.1、§3.3.2）。", "p4": "処置ダミーへのOLS（HC3の頑健標準誤差）を、統制変数を順に加えた4つの入れ子の式で推定した（§4.1、表5.1）。企業規模・業種・AI利用・過去の若手採用・採用難による効果の違いを交互作用の検定で確かめた（§6.1）。", "p5": "全ての統制を入れても、複雑な業務は代替の得点を0.54点下げ、効果はどの部分集団でも負で、交互作用は有意でない（§5.1、§6.1）。人による点検の重要度は約0.15点上がるが、単純な業務でも平均4.32と高い（§5.2、表5.2）。処置前の質問では、今後2年の若手採用が減ると見る企業が31.3%、増えるが5.5%、経験者では24.9%と10.1%で、影響なしが63%と65%で最多だった（§5.3、図5.3）。", "p6": "測ったのは仮想の場面での経営者の表明であり、実際の採用行動ではない（§7.2）。「AIアプリケーション」が何を指すかは回答者に任されている（§7.2）。対象はドイツの情報経済と製造業に限られ、他の業種や国では異なりうる（§7.2）。", "fun": "「AIは新人の仕事を奪う」とよく言われるが、どの仕事でも同じではないらしい。ドイツの1,435社の経営層に、同じ「人手が足りない」場面を仕事の中身だけ変えて見せたところ、判断や文脈の理解が要る仕事では、AIで済ませるという答えがはっきり減った。一方で、AIが使えることで採用が減ると見込む企業は、経験者より若手について多かった。若手の仕事の中身が分かれ目になる。", "unverified": "§1、§2、§3.3.3〜§3.3.4、§5.4、§6.2、§7.1、§8、付録は読んでいない。表5.1・表5.2の標準誤差と有意水準の詳細、事前登録の登録先は確認していない。"}}, {"id": "pn02", "rank": 2, "field": "機械学習", "headline": "回路をトークンごとに組み替える注意機構", "title": "Rewirable Circuits in Transformers with Loom Attention", "url": "https://arxiv.org/abs/2611.30634", "authors": "Da Xiao ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-25", "apa": "Xiao, D., Meng, Q., Li, S., & Yuan, X. (2026). Rewirable Circuits in Transformers with Loom Attention (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2611.30634", "why": "ヘッドが先行するヘッドの出力に向ける縦の注意と、トークンに向ける横の注意を織り合わせる「ルーム注意」を提案した。圧縮したヘッド出力を持つ行列の記憶を第2の残差流として使う。言語モデルの学習と下流課題で、3倍超の計算量で学習したTransformerに並び、同じ3,000億トークン・FLOPs2%増の条件で既存の残差流の改良より高い下流性能を得たと報告する。Hugging Faceで投票数92。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文のうち、§2冒頭・§3.1・§3.2冒頭・§5冒頭・§5.1・§5.2・§5.3・§5.5冒頭（表4の一部）・§6を読んだ。", "preprint": true, "p1": "Transformerの各ヘッドが、トークンごとに「前のどのヘッドの出力を読むか」を選び直せるloom attentionを提案した。これを組み込んだLoomFormerは、3倍超の計算量で学習したTransformerに並ぶ（抄録）。", "p2": "ヘッド同士は残差ストリームを介して固定の重みでつながり、課題がトークンごとに違う回路を必要としても配線を変えにくい（§2）。標準のTransformerや層単位の残差機構では配線の動的な部分が低ランクのゲートに限られるとし、トークンごとの配線替えを安価に実現できるかを問う（§6）。", "p3": "各トークンについて、ヘッドの出力を深さ方向にまとめた行列メモリを持たせ、書き手はキーで書き込み、読み手はクエリで読む線形注意とする（§3.1、式4）。この行列メモリを第2の残差ストリームとし、もとのベクトルの流れを「どこを読むか」の制御に、行列の流れを内容に使い分ける（§3.1、§3.2）。読むコストは深さによらない（§3.1）。", "p4": "Pileで3規模（432M、778M、1.4B）を学習し、DHC・mHC・AttnRes・MUDDFormerと検証損失の伸び方を比べた（§5.1、図5）。さらに300BトークンでLoomPythia-2.8Bを学習し、Pythiaの各規模やmHC版と10種のベンチマークで比べ、配線のランクやヘッドの稼働率の分析と除去実験も行った（§5.2、§5.3、§5.5）。", "p5": "中・大規模では、3.19〜3.25倍の計算量で学習したTransformer++、1.73〜2.76倍の残差系の比較手法と並んだ（§5.1）。LoomPythia-2.8Bの平均正解率は0-shotで59.9とPythia-12Bに並び、5-shotは61.6で60.8を上回った（§5.2、表2）。層17〜32で働いているヘッドはPythia-2.8Bの22.9%に対し74.4%だった（§5.3、図6）。読み書きの口を固定すると利得は56.0%に減る（§5.5、表4）。", "p6": "著者による限界の節は読んだ範囲にない。追加の順伝播FLOPsは2.0%〜3.7%とされるが（§6）、実測の処理速度（表3）の値は読めていない。実験はPileでの言語モデルの事前学習に限られる（§5）。解釈：性能向上が配線替えによるものかは、除去実験と稼働ヘッドの増加からの推論にとどまる。", "fun": "Transformerの中では、たくさんの小さな部品（ヘッド）が前の部品の出力を読んで仕事をする。ふつうは誰が誰の出力を読むかという配線が固定で、入力が要らない場面では部品が自分を休ませている。この研究は、単語ごとに配線を選び直せる仕組みを足した。すると深い層で働いている部品の割合が22.9%から74.4%に増え、2.8Bのモデルが12Bのモデルと並ぶ成績を出した。", "unverified": "§1、§3.2の詳細、§3.3、§4、§5.4の本文、付録（定理の証明、設定、スループット）は読んでいない。表3の実測スループットの値、定理2.4と命題3.1の内容は確認していない。公開コードは確認していない。"}}, {"id": "pn03", "rank": 3, "field": "統計学", "headline": "模擬課題から推論の規則そのものを学習する", "title": "Learning to Infer: Statistical Inference through Meta Learning", "url": "https://arxiv.org/abs/2611.33742", "authors": "Xiaolu Li ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Li, X., & Yang, Y. (2026). Learning to Infer: Statistical Inference through Meta Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33742", "why": "ニューラルネットワークが模擬データの課題から統計的推論の規則を学び、新しいデータにパラメータ更新なしで適用するメタ学習を、統計的決定理論で定式化した。学習目的の最小解がベイズ規則になるよう設計し、推定の漸近有効性、モデル選択の一致性、高次元回帰の変数選択の保証を示す。順序に依存しない集約と残差更新を繰り返す構造を提案する。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文（付録を含め非常に長い）のうち、§2.1冒頭・§2.2冒頭・§2.4・§3.1（定理2の前後）・§3.2冒頭・§3.3冒頭・§4.1.1〜§4.1.3・§4.2・§5を読んだ。", "preprint": true, "p1": "シミュレーションで作った多数の課題からニューラルネットに「推論の規則」を学ばせ、新しいデータにはパラメータ更新なしで適用するメタ学習の枠組みを、統計的決定理論にもとづいて設計し、頻度論的な保証を与えた（抄録）。", "p2": "データ集合全体を入力とする一般のネットワーク近似は、標本サイズとともに難しくなる（抄録）。学習された推論規則が、推定の漸近有効性、モデル選択の一致性、高次元回帰の変数選択といった古典的な保証を持てるか、そのためのネットワークの大きさと訓練課題数を問う。", "p3": "訓練の目的関数は、母集団での最小化解がベイズ規則になるように選ぶ（§2.1、抄録）。ネットワークRRDSは、観測ごとの符号化を平均するDeep Setsを拡張し、推定値を更新しながら同じ観測を繰り返し読み直す構造で、初期値を反復で改良する古典的な推定をまねる（§2.2、図1）。訓練より大きいデータにはブロックごとの推定の平均を使う（§2.4）。", "p4": "理論では、RRDSが制約つき最尤推定量を近似できること（定理1）と、有限個の課題で訓練したネットワークと最尤推定量の距離の上界（定理2）を示し、モデル選択と変数選択にも同様の結果を与える（§3.1〜§3.3）。実験は線形・ロジスティック回帰（係数5個、nは250〜8000）、入れ子の混合モデルの選択、疎な回帰の変数選択、パルサーのHTRU2データで行った（§4.1、§4.2）。", "p5": "固定次元のモデルでは、ネットワークの大きさと訓練課題数は標本サイズの多項式で増やせば足りる（抄録）。ロジスティック回帰のn=250では、RRDSの平均二乗誤差は最尤推定より約32%小さく、事後平均を学ぶことによる正則化の効果と著者は説明する（§4.1.1）。nが大きくなると利点は消え、誤差比は1を超える（§4.1.1、図2）。HTRU2では最尤推定・LASSO・リッジより誤差が小さかった（§4.2）。", "p6": "保証は、コンパクトな観測空間や滑らかさなどの正則性と訓練条件の下でのものである（§3.1）。解析は固定の標本サイズでの訓練を扱い、従属データ、仮説検定、事後分布の学習は今後の課題とされる（§5）。実験は低次元で、ネットワークを大きくしないとnの増加につれて最尤推定との差が相対的に広がる（§4.1.1）。", "fun": "「最尤法で当てはめる」といった統計の手順は、ふつう人間が数式から導く。この研究は、答えの分かっている模擬データを大量にニューラルネットに解かせて、手順そのものを覚えさせる。面白いのは、覚えた手順が教科書の最良の方法に近づくことを数学的に示した点である。標本が少ないときは、訓練で見た「ありそうな答え」の知識が効いて、教科書の方法より誤差が小さくなった。", "unverified": "各定理の正確な仮定と証明（付録C・E・F）、付録D（実装と追加実験）は読んでいない。モデル選択・変数選択の率の具体形、分割統治とブートストラップの数値結果、解析性の条件の下での改善の中身は確認していない。"}}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "企業間取引網での位置が衝撃の伝わり方を決める", "title": "Beyond Firm Size: Network Position and Shock Transmission in Firm-to-Firm Production Networks Across Five Economies", "url": "https://doi.org/10.2139/ssrn.7749842", "authors": "Glenn Magerman ほか", "venue": "SSRN", "date": "2026-11-25", "apa": "Magerman, G., Palazzolo, A., Dhyne, E., Borsos, A., Kulikov, D., Linarello, A., Paulus, A., Romanini, G., & Saldias, M. (2026). Beyond Firm Size: Network Position and Shock Transmission in Firm-to-Firm Production Networks Across Five Economies. https://doi.org/10.2139/ssrn.7749842", "why": "ベルギー・エストニア・ハンガリー・イタリア・ポルトガルの付加価値税の行政記録から、企業間の生産ネットワークを同じ基準で構築した。企業規模と中心性は集計への一次の影響を要約するが、生産連鎖の上下の位置は規模と直交し、衝撃の伝わり方を左右する。産業内の規模のばらつきの約半分は、生産性ではなく顧客数を反映するという。", "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Crossrefの抄録だけを読んだ。", "preprint": true, "p1": "ベルギー、エストニア、ハンガリー、イタリア、ポルトガルの5か国について、付加価値税の記録と税務申告から企業間取引のネットワークをそろえた形で作り、企業の位置を直接測って5つの事実を示した（抄録）。", "p2": "ある企業のショックが全体をどれだけ動かし、他社へどう伝わるかは取引ネットワーク上の位置で決まるが、企業レベルのネットワークが使える国は少なく、定量研究は企業規模や産業連関表を代理に使ってきた（抄録）。その代理がどこまで妥当かを問う。", "p3": "行政の付加価値税の記録と税務申告から5か国の生産ネットワークを調和させて構築し、規模、中心性、生産の連鎖に沿った垂直的な位置、顧客数、取引額などを企業ごとに測る（抄録）。構築の手順、対象年、記録に載る取引の範囲は抄録に記載がない。", "p4": "パターンが5か国の間でも、狭く定義した産業の中でも保たれるかを確かめた。さらに、金融政策への企業レベルの反応が垂直的な位置によって系統的に異なるかを調べた（抄録）。推定の方法と識別の詳細は抄録からは分からない。", "p5": "規模と中心性は企業の一次の集計的影響を要約するが、垂直的な位置は規模と直交し、ショックの伝わり方を決める。産業内の規模のばらつきのおよそ半分は顧客数を反映する。企業間ネットワークは産業連関表より桁違いに疎で、「迂回」生産は消え、狭い産業の組の中でも投入比率は大きくばらつく（いずれも抄録）。", "p6": "本文を入手できず、数値の大きさ、標本、頑健性は確認できない。対象は欧州の5か国に限られる。解釈：産業連関表で足りる場面と企業レベルの詳細が要る場面の線引きは、著者が提供するという較正用のモーメントを本文で見ないと判断できない。", "fun": "大企業がつまずくと経済全体が揺れる、というのは想像しやすい。この研究は5か国の税の記録から「どの会社がどの会社に売っているか」の網を作り、会社の大きさだけでは分からない性質があることを示した。生産の流れの上流にいるか下流にいるかという縦の位置は、大きさとは無関係で、ショックの伝わり方を左右する。会社の大きさの違いのおよそ半分は、顧客の数の違いを映していた。", "unverified": "本文、図表、5つの事実の数値、金融政策の分析の方法は確認できなかった（抄録のみ）。発行元と版の情報も確認していない。"}}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "証拠が足りないのに答えるAIの「怠け」を矯正", "title": "Lazy Agents Answer Against Their Own Beliefs: Reinforcement Learning with Verifiable Beliefs Teaches Them to Act on What They Believe", "url": "https://arxiv.org/abs/2611.32884", "authors": "Richmond Sin Jing Xuan ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-25", "apa": "Xuan, R. S. J., Feng, P., Wang, W., & Poria, S. (2026). Lazy Agents Answer Against Their Own Beliefs: Reinforcement Learning with Verifiable Beliefs Teaches Them to Act on What They Believe (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.32884", "why": "長い課題でエージェントが、自分の表明した信念がまだ複数の答えを残している段階で回答を確定してしまう現象を示した。学習時にシミュレータが答えの正確な事後分布を計算できることを使い、事後分布がまだ複数の答えを許す間は調査を続け、証拠が足りたら確定することに報酬を与える強化学習を提案する。審査用のモデルや報酬モデルは要らない。Hugging Faceで投票数98。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文のうち、§3.1・§3.2冒頭・§3.3冒頭・§4.1・§4.2・§4.3の比較の段落・§4.5の一部・§4.6冒頭と「Limits」・§5を読んだ。", "preprint": true, "p1": "長い課題でAIエージェントが証拠不足のまま答えてしまう「怠け」を、シミュレータが計算できる厳密な事後分布を報酬に使う強化学習RLVBで減らした。3モデル×3ベンチマークの9設定すべてで基のモデルを平均17.1%上回った（抄録）。", "p2": "エピソード末の結果報酬は最終回答しか採点しないので、当てずっぽうの正解と証拠に裏づけられた正解を区別できず、いつ答えるべきかを教えられない（抄録）。証拠が足りているかどうかを直接報酬にすれば、早すぎる回答を減らせるかを問う。", "p3": "課題には隠れた正解があり、シミュレータは各ステップで、観測と矛盾しない候補に事前分布を制限した厳密な事後分布を計算する（§3.1、式1）。この事後分布の上で先読みして行動の価値を決める「教師」方策を作り、エージェントの行動が教師の下で持つ対数確率を各ターンの報酬の主な項とする（§3.2、§3.3、式5）。証拠不足での回答は大きく減点し、十分になった後の余分な1歩は小さな時間割引だけで済ませる（§3.3）。", "p4": "Qwenの視覚言語モデル3種を、既存の7課題からなるHiddenGamesで学習し、未見の756ゲームと、学習に使わないPro-Worlds（小さな窓で広い世界を見る新しいベンチマーク）とRoboQuestで評価した（§4.1、§4.2）。比較は、教師あり微調整、結果報酬のGRPOとPPO、LLM審査員が信念を採点するPPOである（§4.2）。", "p5": "RLVBは9設定すべてで基のモデルを改善し、結果報酬のGRPOは平均1.0%、PPOは5.1%下がった（§4.3）。証拠が十分でない段階での回答は、基のモデルがターンの11〜20%、RLVBは3%だった（§4.5）。審査員つきPPOより平均9.3%高く、GPU時間は1.6倍少ない（抄録）。", "p6": "規則が既知で事後分布を厳密に計算できる課題に限られ、未知の規則では推定が要る（§5）。学習後は証拠が十分なのに誤答するエピソードが2〜4%から10〜15%に増え、より情報の多い手を選ぶようにはなっていない（§5）。HiddenGamesで回答せずに終わる割合は19%で基のモデルの7%より多い（§4.6）。", "fun": "伏せたコップのどれに赤い円柱が隠れているかを当てる課題で、まだ候補がいくつも残っているのに答えてしまうAIがいる。たまたま当たれば満点がもらえる採点では、この癖は直らない。この研究は、シミュレータが「今の証拠で候補がいくつ残っているか」を正確に計算できることを使い、候補が絞れる前に答えたら当たっていても低い点にした。すると、証拠がそろってから答える回が増えた。", "unverified": "§1、§2、§3.4（方策の更新）、§4.4（除去実験）、§4.6のRQ1〜RQ3の詳細、付録は読んでいない。表1の設定ごとの値、RLVB（EM）との違いの中身、信念の行を採点する項の扱い、GPU時間の内訳は確認していない。"}}, {"id": "pn06", "rank": 6, "field": "因果推論", "headline": "分布やネットワークが結果でも効果の異質性を推定", "title": "Geodesic Causal Forests: Learning Heterogeneous Treatment Effects for Random Objects", "url": "https://arxiv.org/abs/2611.33350", "authors": "Yidong Zhou", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Zhou, Y. (2026). Geodesic Causal Forests: Learning Heterogeneous Treatment Effects for Random Objects (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33350", "why": "結果が構成比・共分散行列・分布・ネットワークのように線形構造のない距離空間の対象であるときの、条件つきの処置効果を推定する因果フォレストを提案した。測地線に沿う輸送で個人間の効果を比較可能にし、足し引きができない代わりに二乗距離の損失を補正する。ユークリッド空間では二重頑健な学習に一致し、一致性と収束率を示す。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文のうち、§3.1・§3.2冒頭・§4.1冒頭・§4.2冒頭・§5.3冒頭・§6.1冒頭・§6.3冒頭・§7.1・§7.2・§8を読んだ。", "preprint": true, "p1": "結果が組成・共分散行列・分布・ネットワークのように足し引きできない「ランダムオブジェクト」であるときに、人によって異なる処置効果を推定する測地線因果フォレスト（GCF）を提案した（抄録）。", "p2": "因果フォレストや直交化学習はスカラーやユークリッド空間の結果を前提とし、線形構造のない距離空間の結果には使えない（抄録）。出発点が人ごとに違う「変化」をどう比べるか、残差が定義できないのに局外母数の誤差の一次の影響をどう消すかを問う。", "p3": "効果を、処置なし・ありの条件つきフレシェ平均を結ぶ測地線として定義し、測地線輸送で共通の基準点にそろえて比べる（§3.1、§3.2）。フォレストは効果を二乗距離の損失を通じてしか使わないので、結果ではなく損失のほうを補正する（§4.1、§8）。補正にはフレシェ平均だけが要り、局外母数の誤差は二次にとどまり、ユークリッドの場合は二重頑健な学習に一致する（§8）。", "p4": "理論では一致性、収束率、分割選択の保証を示した（抄録）。シミュレーションは2次の正定値行列を結果とし、標本600〜2,400で、補正なし・プラグイン・共通効果と比べた（§6.1、§6.3、表1）。実データはバングラデシュのBRACの無作為化された貧困対策（40支所を20組、女性6,732人）で、6区分の生計の組成を結果とした（§7.1）。", "p5": "非可換の設定でGCFの積分二乗測地誤差は0.068から0.030に下がり、共通効果は0.42付近にとどまった（§6.3）。BRACでは、家畜の仕事の割合が42.7ポイント増え、家事の賃労働が18.3、農業の賃労働が10.0ポイント減って、増加の3分の2を臨時の賃労働の減少が埋めた（§7.2）。家畜の割合はどの群でも40〜45ポイント増え、減る活動は2007年の主な活動によって異なった（§7.2、図3）。", "p6": "速い収束率は、フォレストの近傍が効果を左右する共変量の方向だけで縮むことを仮定しており、補正した損失で選んだ分割がそうなるかは未解決である（§8）。信頼領域の被覆を名目値に近づける工夫も今後の課題とされる（§8）。BRACの解析は公開データのコホートに限られ、追跡時の選択が無作為化の比較を保つことを仮定している（§7.1）。", "fun": "1日の時間の使い方は、家畜の世話が何割、賃仕事が何割という割合の組で、合計が必ず全体になる。こういうデータは普通の数のように足したり引いたりできないので、「支援の効果は人によってどう違うか」を調べる定番の方法が使えない。この研究は距離だけを頼りにする方法を作り、バングラデシュの女性への支援では、増えた家畜の仕事が主に臨時の賃仕事と入れ替わったことを示した。", "unverified": "§1、§2、§4.3、§5.1〜§5.2の条件、§6.2、補足資料（S.1〜S.6）は読んでいない。収束率の具体形、表1の全体、元家事労働者や年長の女性で効果が大きいという抄録の記述の根拠は確認していない。"}}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "賃金交渉が採用で不利になる水準は女性で低い", "title": "When Does Negotiation Backfire? Gender, Job Levels, and Wage Demand Levels", "url": "https://doi.org/10.31235/osf.io/wn8p9", "authors": "Yuriko Morikawa ほか", "venue": "SocArXiv", "date": "2026-11-25", "apa": "Morikawa, Y., & Takikawa, H. (2026). When Does Negotiation Backfire? Gender, Job Levels, and Wage Demand Levels. https://doi.org/10.31235/osf.io/wn8p9", "why": "日本企業の採用担当者967人への要因配置型の調査実験で、応募者の性別、応募する職位、自社の賃金水準に対する要求額を変え、交渉しない場合と採用の見込みを比べた。要求額が上がると交渉は不利に働き、その不利は管理職で非管理職より低い要求水準から現れ、同じ職位では女性で男性より低い水準から現れた。", "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Crossrefの抄録だけを読んだ。", "preprint": true, "p1": "賃金交渉をすると採用されにくくなるのはどんなときかを、日本企業の採用担当者967人への要因配置型の調査実験で調べた。要求水準が上がるほど不利になり、不利が現れる水準は管理職で低く、同じ職位では女性のほうが男性より低い（抄録）。", "p2": "賃金交渉は交渉しない場合と比べて採用の見込みを下げるのか、どの要求水準から不利が現れるのか、それが応募する職位と応募者の性別でどう違うのかを問う（抄録）。著者は、賃金要求の正当性は組織内の賃金基準に照らして判断されると論じる。", "p3": "応募者の性別、応募する職位、要求水準を変えた応募者を提示する要因配置型の調査実験である。要求水準は、回答者自身の組織でその職位に適用される賃金基準に対する相対的な高さとして与えた（抄録）。各条件の採用の見込みを、交渉なしの条件と混合効果モデルで比べた。", "p4": "対象は日本企業で採用に責任を持つ967人で、条件ごとに交渉なしとの差を推定している（抄録）。提示した要求水準の段階、1人あたりの提示数、回答者の集め方は抄録に記載がない。", "p5": "要求水準が上がると交渉は不利に転じた。不利が現れる相対的な要求水準は、非管理職より管理職で低く、各職位の中では男性より女性で低かった（抄録）。交渉の効果は、交渉するか否かではなく、組織の賃金基準に対してどれだけ求めるかで決まると著者は結論する（抄録）。", "p6": "本文を入手できず、効果の大きさと不利が現れる具体的な水準は確認できない。解釈：測っているのは提示された応募者への採用の見込みであり、実際の採用決定ではない。対象は日本企業の採用担当者で、他国への一般化は抄録からは判断できない。", "fun": "給料を交渉すると損をするかどうかは、交渉するかしないかではなく、いくら求めるかで決まるらしい。日本企業の採用担当者967人に応募者を評価してもらうと、会社の賃金基準に対する要求が高くなるほど採用されにくくなり、不利になり始める水準は、同じ職位でも女性のほうが男性より低かった。交渉の機会や見返りの差とは別の、求めてよい額の差という不平等である。", "unverified": "本文、効果量、要求水準の段階、モデルの詳細は確認できなかった（抄録のみ）。掲載先と版の情報も確認していない。"}}, {"id": "pn08", "rank": 8, "field": "経済学", "headline": "FOMCの議論の不一致が成長リスクの予測を改善", "title": "Reading the Room with AI: FOMC Deliberation and Growth-at-Risk", "url": "https://arxiv.org/abs/2611.34423", "authors": "Alvaro Ortiz (BBVA Research) ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Ortiz, A., & Rodrigo, T. (2026). Reading the Room with AI: FOMC Deliberation and Growth-at-Risk (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34423", "why": "会合の3週間後に公開されるFOMCの議事要旨から熟議の特徴を取り出し、FRED-MDの123系列による成長率の分位点モデルに加えた。投票には現れないが議論の中にある不一致だけが、標本外の損失を4〜6%下げ、専門家・スタッフ・委員会の予測を超える情報を持っていた。委員会が明示するリスク評価より、記録された議論そのものに情報があることを示す。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文のうち、§2.2・§2.3・§3.1〜§3.3・§4.1冒頭（表2の一部）・§4.5冒頭（表6）・§5.1・§6冒頭・§7を読んだ。", "preprint": true, "p1": "FOMCの議事要旨から読み取った「採決には表れないが議論には存在する意見の不一致」を、123系列の公開データによる成長率の分位点予測に加えると、4四半期先の成長分布の標本外損失が約4〜6%下がることを示した（抄録、§7）。", "p2": "成長リスクのモデルは公開データから成長率の分布を予測するが、政策はそのデータの意味を議論する委員会が決める（抄録）。議論の記録には、広い公開データの基準モデルが取り出せない情報があるのか、あるならそれは何かを問う。", "p3": "目的変数は予測時点の後4四半期の実質GDP成長率の平均で、基準モデルは現在の成長率、金融環境指数、FRED-MDの123系列を説明変数とするリッジ分位点回帰である（§2.3、§3.1）。会合の3週間後に公開される議事要旨から7つの熟議の指標を作り、1つずつ罰則なしで加える（§2.2、§4.1）。中心のHidden Dissentは、反対意見の言葉づかいを学習した既存モデルによる潜在的な不一致の指標である（§2.2）。", "p4": "2007Q4〜2025Q1の70時点で逐次の標本外予測を行い、19の分位点のピンボール損失の減少率を、HAC分散による対の検定と移動ブロック・ブートストラップで評価した（§2.3、§3.3）。罰則は検定の前に基準モデルだけで決め、危機の7期間と2つの頑健性の検討も事前に定めた（§3.2、§4.5、§5.1）。", "p5": "Hidden Dissentを加えると全分位点の損失が4.066%下がり（§4.1、表2）、公開データの履歴を1986年からにしても5.8%の改善が残った（§5.1）。事前に定めた危機の期間での改善は3.657%で、それ以外の5.257%より小さく、転換点で効くという予測は支持されなかった（§4.5、表6）。委員会が公表する見通しのばらつきは、どの領域も改善しなかった（§6）。", "p6": "信号に123系列と同じ強さの罰則をかけると改善は0.03%に消える。著者は、単一の説明変数にゼロへの強い事前分布を課すための機械的な結果と説明するが、内容がないことと区別はできないと認める（§5.1）。下側の領域への寄与は条件つきで、強い縮小と専門家予測の合意に敏感である（§7）。評価は70時点に限られる。", "fun": "中央銀行の会合では、採決の結果だけ見ると分からなくても、途中の議論では見方が割れていることがある。この研究は、会合の3週間後に公開される議事要旨からその「隠れた不一致」を数値にして、景気の先行きの予測に加えた。すると、123本の経済データを使った予測がさらに4〜6%ほど良くなった。委員会が公式に述べるリスク判断より、議論の割れ方そのものに情報があるという結果である。", "unverified": "§1、§2.1、§4.2〜§4.4の表の値、§4.6、§5.2〜§5.6、付録は読んでいない。Hidden Dissentの元のモデルの作り方、言語モデルによる抽出指示の妥当性は確認していない。"}}, {"id": "pn09", "rank": 9, "field": "統計学", "headline": "登録簿だけの国勢調査は照合誤りが大きな壁", "title": "The Illusion of an Automated German Census: Assessing the Feasibility of the 2031 Register-Based Census via Simulation", "url": "https://arxiv.org/abs/2611.33949", "authors": "R. Schnell (University of Duisburg-Essen) ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Schnell, R., & Weiand, S. V. (2026). The Illusion of an Automated German Census: Assessing the Feasibility of the 2031 Register-Based Census via Simulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33949", "why": "ドイツが2031年に予定する、行政の登録簿だけによる初の国勢調査の実現可能性を、約8,021万人の合成人口で検証した。氏名や生年月日などの準識別子で登録簿を照合する際の品質を1,458の条件で変えると結果は大きく振れ、現実的な想定でも登録簿1つにつき50万〜100万件の照合漏れが生じうる。自動化だけでは難しく、手作業の後処理が要ると示唆する。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文のうち、§2.2・§3.1冒頭・§3.2・§3.3冒頭・§3.4・§4冒頭（表3）・§5冒頭・§6を読んだ。", "preprint": true, "p1": "ドイツが2031年に予定する初の完全な登録簿ベースの国勢調査を、80,206,770人の合成人口で模擬した。氏名や生年月日などの準識別子で登録簿を連結すると、もっともらしい条件でも1つの登録簿あたり50万〜100万件の連結もれが出うる（抄録）。", "p2": "住民登録の過不足を見つけるために、住民登録を運転免許や農業社会保険など10の行政登録簿と連結する方式が計画されている（§2.2、抄録）。これらの登録簿のデータ品質についての公表資料は乏しく、準識別子による連結がどの程度の質になるかを模擬で見積もる。", "p3": "2011年の国勢調査とマイクロセンサスの公開結果から、世帯構成と100 mメッシュの地理分布を保った個人単位の合成人口を作る（§3.1）。比較する登録簿の側で、使える識別子の組、住所が古い確率、重複、更新済みの割合、基礎データとの重なり、共通番号つきの割合、誤りの係数を変え、1,458通りの条件を作った（§3.3、表2、§3.4）。連結にはFellegi–Sunterモデルの実装Splinkを使い、偽陽性を抑える設計とした（§3.4）。", "p4": "連結の質は適合率と再現率、および偽陽性・偽陰性の絶対数で評価した（§4）。大きなデータでは率が高くても件数が大きくなるため、最良と最悪の登録簿の条件で絶対数を示している（§4）。", "p5": "共通番号なし・重複なしの条件の平均で、適合率は99.93〜99.99%と高いが、再現率は識別子が中核の4項目だけで誤りの係数が16のとき90.82%まで下がる（§4、表3）。偽陰性に最も効くのは誤りの係数で、出生地を足すと全項目を使う場合に近い質になる（§5）。共通番号が9割に付いていても、偽陰性が10万件を下回るのは最も楽観的な条件だけだった（§5）。", "p6": "結果は仮定した誤りの分布に依存し、比較する登録簿の網羅もれと識別子の欠損は模擬に入っていない（§6）。氏名は商用データベースにもとづき、標準化と清掃が済んだものとして扱っているため、質を過大に、困難を過小に見積もっている可能性があると著者は述べる（§6）。", "fun": "国勢調査を、調査票を集める代わりに役所の名簿どうしを突き合わせるだけで済ませる計画がドイツにある。難しいのは、名簿ごとに同じ人を名前と生年月日などで照合しなければならない点だ。この研究は80,206,770人分の架空の人口を作って照合を試し、取りこぼしの率が数%でも、件数では1つの名簿につき50万〜100万件になりうることを示した。率が小さくても、人口が大きいと件数は巨大になる。", "unverified": "§1、§2.1、§2.3、§2.4、§4の図と表4の値、§5の後半、§7は読んでいない。50万〜100万件という範囲がどの条件に対応するかは抄録の記述のみで、表4では確認していない。"}}, {"id": "pn10", "rank": 10, "field": "工学", "headline": "粗い予報と疎な観測から高解像度の解析場を生成", "title": "BridgeSRDA: Efficient Probabilistic Super-Resolution Data Assimilation with Forecast-Informed Stochastic Interpolants", "url": "https://arxiv.org/abs/2611.33720", "authors": "Aditya Sai Pranith Ayapilla ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Ayapilla, A. S. P., Yasuda, Y., & Onishi, R. (2026). BridgeSRDA: Efficient Probabilistic Super-Resolution Data Assimilation with Forecast-Informed Stochastic Interpolants (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33720", "why": "低解像度の数値予報と、疎でノイズのある観測を組み合わせて高解像度の解析場を生成する、確率的な超解像データ同化の枠組みを示した。予報の情報を取り込んだ確率的な輸送をニューラルネットワークが学び、アンサンブルを生成する。学習時と異なる3次元準地衡流で評価し、高解像度の局所アンサンブル変換カルマンフィルタに近い精度を得たと報告する。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文のうち、§2.1・§2.2冒頭・§2.3.2・§3.1冒頭・§3.5・§4.1・§4.3・§4.4・§4.6・§6.1冒頭を読んだ。", "preprint": true, "p1": "粗い格子の数値予報と疎で雑音のある観測から、高解像度の解析場のアンサンブルを生成する確率的な超解像データ同化BridgeSRDAを提案した。学習時と同じ観測間隔では、高解像度のLETKFに近い精度をより短い時間で出した（抄録）。", "p2": "高解像度のアンサンブルデータ同化は、多数の流れの状態の予報と更新を繰り返すので計算が重い（抄録）。粗い格子で予報を進めて生成モデルで高解像度に復元することで、精度と不確かさの推定を保ったまま費用を下げられるかを問う（§6.1）。", "p3": "拡散モデルがガウス雑音から出発して雑音を除くのに対し、BridgeSRDAは粗い予報を持ち上げた窓を出発点とし、観測で条件づけたドリフトを学習して高解像度の分布へ輸送する（§2.2、図1）。1つの窓は9フレームで、過去の再構成、現在の解析、短時間の予報を兼ね、各メンバーの現在の解析を粗くして次の予報の初期値にする（§2.1、§2.3.2）。", "p4": "多層の準地衡流の傾圧ジェットの観測システム模擬実験で、学習時と異なる細いジェットの10軌道を評価した（§3.1、抄録）。比較は、高解像度格子のLETKF（30メンバー）、粗い格子のLETKF、決定論的な4D-SRDA、超解像と同化を分けたSR-LETKFで、MAER、CRPS、被覆率、1解析あたりの時間を見た（§3.5、§4.1、§4.3）。", "p5": "MAERは0.04319で、高解像度LETKFの0.03951に近く、4D-SRDAの0.06399より約32.5%小さい（§4.1、表3）。1解析あたり16.97秒で、LETKFの30.64秒より短く、10メンバーにすると6.57秒になる（§4.4、表5）。CRPSは0.01250とLETKFの0.01174に近いが、名目90%の区間に入る参照値は62.3%で、広がりが足りない（§4.3、表4）。", "p6": "観測の間隔を8格子点から16格子点に広げると、再学習なしではMAERが0.04319から0.39832に悪化し、LETKFはほぼ精度を保った（§4.6、表7）。アンサンブルは過小分散で、境界付近の広がりの乱れも残る（§4.3、抄録）。検証は理想化した準地衡流モデルの模擬実験に限られる（§3.1）。", "fun": "天気予報の土台になるデータ同化では、たくさんの「ありうる今の状態」を細かい格子で計算し直す作業が重い。この研究は、粗い格子で安く計算した予報とまばらな観測をAIに渡し、細かい状態を何通りも描かせる。精度は本格的な方法に近く、記録された条件では約1.81倍速かった。ただしAIの描く答えは互いに似すぎていて、90%は入るはずの幅に実際は62.3%しか入らなかった。", "unverified": "§1、§2.3.1、§2.3.3、§3.2〜§3.4、§4.2、§4.5、§5、付録は読んでいない。計算時間の測定条件、境界の広がりの乱れの詳細、3次元の条件つき拡散の実験は確認していない。"}}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "負債の重い企業は排出枠の引き締めに反応しない", "title": "Leverage and the Low-Carbon Transition in Europe", "url": "https://doi.org/10.2139/ssrn.7753344", "authors": "Katia Vozian ほか", "venue": "SSRN", "date": "2026-11-25", "apa": "Vozian, K., Giuzio, M., Kapadia, S., & Salakhova, D. (2026). Leverage and the Low-Carbon Transition in Europe. https://doi.org/10.2139/ssrn.7753344", "why": "EU排出量取引制度の2,421社の検証済み排出量を使い、2015年の制度の引き締めを利用して企業のレバレッジと排出削減の関係を調べた。排出枠が不足する企業は余剰のある企業より排出効率を10〜15%改善したが、それは負債比率が約40%未満の企業に限られ、負債の重い企業は反応しなかった。排出量取引の効果が企業の財務状態に依存することを示す。", "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Crossrefの抄録だけを読んだ。", "preprint": true, "p1": "EU排出量取引制度の2,421社の検証済み排出量を使い、2015年の制度の引き締めへの反応が企業の負債の重さで分かれることを示した。排出枠が不足する企業は余剰のある企業に比べ排出効率を10〜15%改善したが、負債資産比率が約40%未満の場合に限られた（抄録）。", "p2": "企業のレバレッジは、キャップ・アンド・トレード制度への反応を左右するかを問う（抄録）。背景：排出削減には設備などへの投資が要るため、借入の多い企業は価格のシグナルに応じにくい可能性がある。", "p3": "2015年の引き締めを利用する。市場安定化リザーブの設立決定と京都クレジットの交換の終了により、排出枠の不足の期待費用が上がった時点である（抄録）。排出枠が不足する企業と余剰のある企業の排出効率の変化を比べ、負債資産比率による違いを見る。推定式と排出効率の定義は抄録に記載がない。", "p4": "データは制度の対象である2,421社の検証済み排出量である（抄録）。標本期間、比較する企業群の事前の動きの確認、頑健性の検討は抄録からは分からない。", "p5": "不足企業は余剰企業に比べ排出効率を10〜15%改善したが、負債資産比率が約40%未満のときだけだった。この水準は、そこまではレバレッジが高い企業ほど排出効率が高く、超えると低くなる境目でもある。負債の多い企業は反応せず、資金調達の摩擦と整合する（いずれも抄録）。", "p6": "本文を入手できず、識別の前提と推定の詳細は確認できない。解釈：排出枠の不足や負債の多さは企業の他の属性とも結びつくため、資金制約以外の違いをどこまで除けているかは本文の確認が要る。著者は無償割当と支援策の設計への含意を述べる（抄録）。", "fun": "排出枠の値段が上がれば企業は排出を減らすはず、というのが排出量取引の考え方である。ところがこの研究によると、欧州の2,421社のうち制度の引き締めに反応したのは、借金が資産の約40%より少ない企業だけだった。借金の多い企業は、減らすための資金を調達しにくいのかもしれない。環境の制度がうまく働くかどうかが、企業の財務の事情に左右されるという指摘である。", "unverified": "本文、推定式、標本期間、排出効率の定義、頑健性の検討は確認できなかった（抄録のみ）。発行元と版の情報も確認していない。"}}, {"id": "pn12", "rank": 12, "field": "統計学", "headline": "RI-CLPMが識別できる条件を厳密に導く", "title": "The Random Intercept Cross-Lagged Panel Model as a Statistical Model: Identification, Estimation, and Model Comparison", "url": "https://arxiv.org/abs/2611.34663", "authors": "Zihao Cao", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Cao, Z. (2026). The Random Intercept Cross-Lagged Panel Model as a Statistical Model: Identification, Estimation, and Model Comparison (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34663", "why": "個人間の安定した差と個人内の時間差の関連を分けるランダム切片交差遅延パネルモデルの統計的な性質を、行列表現で調べた。遷移行列と誤差共分散が時点ごとに変わる場合の大域的な識別の必要十分条件を導き、遷移が一定なら3時点で足りる条件を示す。従来の交差遅延モデルの係数がどれだけずれるかの式も与える。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文のうち、§1・§2.1・§3冒頭・§3.3（定理1と証明）・§3.4・§4冒頭・§5冒頭・§5.3冒頭・§5.4・§6を読んだ。", "preprint": true, "p1": "個人間の安定した差と個人内の遅れた関連を分けるRI-CLPMを、p変数・T時点の行列表現で統計モデルとして扱い、大域的な識別の必要十分条件、最尤推定のスコア、従来のCLPMとの母集団レベルの関係を導いた（抄録）。", "p2": "RI-CLPMは心理学の縦断研究で使われるが、統計モデルとしての性質を解析的に導いた研究は比較的少ない（§1）。何時点あれば識別できるのか、RI-CLPMが真のときに従来のCLPMの係数は何を表すのかを問う。", "p3": "観測を「時点の平均＋個人のランダム切片＋個人内偏差」に分け、個人内偏差が遷移行列による1次の自己回帰に従うとする（§2.1、式1〜3）。個人内の精度行列がブロック三重対角になることを使い、ランダム切片の共分散をずらしても観測の共分散が変わらない摂動があるかを、隣り合わないブロックが0であるという制約の行列の階数で判定する（§3、§3.3）。", "p4": "証明による理論研究で、データ解析や数値実験は読んだ範囲にない。定理1は、遷移行列と革新の共分散が時点ごとに変わる場合に、階数条件が大域的識別の必要十分条件であり、満たされなければ同じ共分散を与えるパラメータが連続的に存在することを示す（§3.3）。推定では、完全なガウス軌跡の輪郭尤度のスコアを閉じた形で導く（§4）。", "p5": "遷移行列が時点によらない場合、3時点以上で、単位行列から遷移行列を引いた行列が正則であることが識別の必要十分条件になる（§3.4）。2変数の場合、真の個人内の交差遅延効果が0でも、個人間と個人内の回帰の傾きが異なればCLPMには見かけの経路が現れる（§5.4、式74）。同じ例で、経路の打ち消し、符号の反転、大小関係の逆転も起こる（§5.4、式76）。", "p6": "結果は母集団レベルの式であり、有限標本での推定量の振る舞いは扱っていない（§5）。推定の式は完全データとガウス分布を仮定する（§4）。著者は、制約が識別に与える影響や他の推定量の振る舞いを今後の検討の出発点と位置づける（§6）。", "fun": "人を何度も調査して「Xが高い人は次の回のYも高い」という関係を見つけても、それが「もともとそういう人がいる」だけなのか、「同じ人の中でXが上がるとYが上がる」のかは別の話である。この2つを分けるモデルが正しいとき、分けない従来のモデルは、本当は効果が0なのに効果があるように見せたり、符号を逆にしたりしうる。この論文は、それがいつ起こるかを数式で正確に示した。", "unverified": "§2.2〜§2.3、§3.1〜§3.2、§4.1〜§4.6の式、§5.1〜§5.3の導出、§5.5は読んでいない。証明の正しさは確認していない。時点ごとに遷移行列が変わる場合に必要な時点数の具体的な条件は確認していない。"}}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "現実から模擬環境を作る手法を共通の土台で評価", "title": "Real2SimLab: A Unified Platform for Real-to-Simulation Transfer", "url": "https://arxiv.org/abs/2611.34849", "authors": "Yongchang Zhang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-26", "apa": "Zhang, Y., Huang, J., Ni, Y., Zhou, N., Zhao, G., Liu, R., Huang, R., Wu, Y., Zhang, T. Z., Jiang, Z., Li, X., Shen, K., & Zhong, Y. (2026). Real2SimLab: A Unified Platform for Real-to-Simulation Transfer (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34849", "why": "映像などの実世界の観測からシミュレーションのプログラムを生成する研究で、ベンチマークごとに入力・成果物・採点が異なる問題に対し、手法が書いたプログラムを実行して各ベンチマーク本来の採点器で評価する統一基盤を示した。学習データと報酬の注釈を作るパイプラインも提供し、評価用の映像との重複を除く。Hugging Faceで投票数100。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文のうち、§3・§3.1〜§3.4・§4の「Benchmarks」・§5冒頭（図6）・§6を読んだ。", "preprint": true, "p1": "実世界の映像からシミュレーションのプログラムを作る手法とベンチマークを、プログラムを共通の受け渡し形式としてつなぐ評価基盤Real2SimLabを提示した。47のコーディングエージェントと5つの非エージェント手法、6つのベンチマークに対応する（抄録）。", "p2": "コーディングエージェントが映像からシミュレーションのプログラムを書けるようになり、ベンチマークがいくつも提案されたが、入力・提出物・採点の手順がそれぞれ違い、N個の手法をM個のベンチマークで評価するにはN×M通りの接続が要る（抄録）。これをN+Mで済ませ、公正に比べられるかを問う（§6）。", "p3": "手法側とベンチマーク側にそれぞれアダプタを置き、間の課題の形式を1つに固定する（§3、図4）。課題は見える部分と隠す部分に分け、採点用の参照は手法のサンドボックスにマウントしない（§3.1）。提出物は凍結して指紋を取り、隠しデータなし・オフライン・読み取り専用で再実行し、その出力を採点する（§3.3）。採点は各ベンチマークの公式の採点器を固定したコミットで動かす（§3.4）。", "p4": "6つのうち5つのベンチマークは公式の採点器をそのまま使い、それが当てはまらないデータでは、再実行の物体軌跡を隠した参照と比べる「再現スキル」を使う（§3.4、§4）。厳密な正解を持つ5現象の合成課題群を、再現の採点手順の確認と訓練課題の供給源として用意した（§4）。", "p5": "成果は基盤そのもので、手法間の比較の数値は読んだ範囲にない。再実行により、セッション中の出力と一致するか、同じ乱数種で再現するかを提出物ごとに確かめられる（§3.3）。訓練データの作成では、評価課題の録画と重なる映像を、動きのあるフレームのサムネイル比較で除く（§5、図6）。約300本の関連論文の地図も公開した（抄録）。", "p6": "訓練の手順は提供するが、著者らはまだそれでモデルを訓練していない（§5、図6）。IRISへの対応は8クラスのうち球を落とす1クラスだけで、アダプタは元のベンチマークの一部を省くことがある（§4）。解釈：元の公開値との照合結果を読んでおらず、採点の再現の程度は判断できない。", "fun": "動画を見せて「この現象を再現するシミュレーションのプログラムを書いて」とAIに頼む研究が増えている。ところが採点方法が研究ごとにばらばらで、成績を横に比べられなかった。この研究は、AIが書いたプログラムを封印し、正解を見せない環境でもう一度動かしてから採点する共通の土台を作った。書いている最中に出た結果ではなく、プログラムそのものを採点するためである。", "unverified": "§1、§2、§4の「元の公開値との照合」と「手法」の項、付録は読んでいない。対応する6つのベンチマークの名前すべて、照合の結果、公開リポジトリの所在は確認していない。"}}, {"id": "pn14", "rank": 14, "field": "組織行動・心理的安全性", "headline": "長時間働くCEOほど部下の評価を受けたがらない", "title": "The CEOs Who Won't Be Measured: Access, Self-Other Gaps and Working Hours in a Preregistered CEO-Team Study", "url": "https://doi.org/10.31234/osf.io/3jwg6", "authors": "Bill Gallagher", "venue": "PsyArXiv", "date": "2026-11-25", "apa": "Gallagher, B. (2026). The CEOs Who Won’t Be Measured: Access, Self-Other Gaps and Working Hours in a Preregistered CEO-Team Study. https://doi.org/10.31234/osf.io/3jwg6", "why": "CEOの労働時間とリーダーシップの関係を部下の評価で調べる事前登録研究。推定6万人以上に依頼して回答したCEOは90人、条件を満たす49人のうち必要な3人以上の部下評価が得られたのは15人だった。部下の名簿を出さなかったCEOは週に約8時間長く働いていた（p=.09）。CEOは自分の強みと弱みの順位を部下と同じように認識するが、自己評価は高めだった。", "explain": {"basis": "抄録", "basis_note": "本文は入手できず、Europe PMCの抄録だけを読んだ。", "preprint": true, "p1": "CEOの長時間労働とリーダーシップの関係を、部下のチームによる評価で確かめようとした事前登録研究である。最大の壁は、CEOが測定を受け入れないことだった。目標の300人に対し、必要な3人以上のチーム評価がそろったのは15人にとどまった（抄録）。", "p2": "CEOの労働時間はリーダーシップとどう関係するかを、CEOのチームにCEOを評価してもらうという最も直接的な方法で検証する（抄録）。あわせて、CEOの自己評価とチームの評価のずれを調べる。", "p3": "推定6万人以上に届いた招待から90人のCEOが回答し、10人以上の企業の適格なCEO49人が、24時間の時間割と12項目のリーダーシップ行動の質問紙に答えた（抄録）。CEOからチームの名簿を受け取り、チームがCEOを評価する設計である。", "p4": "事前登録した設計は300人を目標とし、CEOごとに3人以上のチーム評価を求めた（抄録）。自己評価と他者評価の差が弱みに集中するように見えた点は、平均への回帰を調べる折半法で確かめた。事前登録した圧縮の検定については、その差を検出できなかったはずだと著者は述べる（抄録）。", "p5": "適格なCEOの43%は使えるチーム名簿を渡さず、渡さなかったCEOは週の労働時間が約8時間長く（p=.09）、58時間を超える10人は誰も分析に至らなかった。CEOとチームの強み・弱みの順位は似ていたが（順位相関の中央値.60）、CEOは4つの行動のうち3つで自分を高く評価した（合成で+0.28、5段階）。チーム評価の有効性は30〜58時間の範囲で労働時間とともに下がった（p=.037）（いずれも抄録）。", "p6": "標本は小さく、中小規模の企業が中心で、フィードバックに開かれたCEOに偏っている可能性が高い。労働時間と有効性の関係は単一のクラスタに左右され、弱みへの集中は折半法の確認で残らなかった。著者自身が、確認された効果ではなく兆候と位置づけている（いずれも抄録）。", "fun": "社長が長く働くほど良いリーダーなのかを確かめるには、部下に社長を評価してもらうのが一番早い。ところが、それに応じない社長が多かった。推定6万人以上に声をかけて分析まで進めたのは15人だけで、週58時間を超えて働く社長10人は1人も残らなかった。いちばん知りたい人たちほど測らせてくれない、というのがこの研究の最初の発見である。", "unverified": "本文、時間割と質問紙の内容、検定の詳細、事前登録の登録先は確認できなかった（抄録のみ）。掲載先と版の情報も確認していない。"}}, {"id": "pn15", "rank": 15, "field": "環境・気候政策", "headline": "陸面モデルCLM5を微分可能にしてGPUで動かす", "title": "CLM-JAX v3.2.46: a differentiable, GPU-accelerated land surface model numerically indistinguishable from the Community Land Model 5.0", "url": "https://arxiv.org/abs/2611.34574", "authors": "Shijin Yuan ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Yuan, S., Wei, Z., Shen, T., Mu, B., Qin, B., & Dai, G. (2026). CLM-JAX v3.2.46: a differentiable, GPU-accelerated land surface model numerically indistinguishable from the Community Land Model 5.0 (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34574", "why": "FortranのCommunity Land Model 5.0をPython（JAX）で実装し直し、エネルギー・水・炭素・窒素・作物の過程の結合を保ったままGPUで動き、多段階の時間積分を通して勾配を逆伝播できるようにした。2019〜2023年の全球5年間・32変数で、元のモデル自身の微小な摂動によるばらつき以内に誤差が収まることを確かめた。", "explain": {"basis": "本文", "basis_note": "arXivのHTML本文のうち、§1.2（図1）・§1.2.3・§1.3・§1.4.1・§2.1・§2.2冒頭・§2.3冒頭・§3.2〜§3.4を読んだ。", "preprint": true, "p1": "Fortranで書かれた陸面モデルCLM5.0を、GPUで動き自動微分ができるPython（JAX）の実装CLM-JAXに書き直した。数値的に元のモデルと区別できないこと、GPU1枚で64コアのCPU実行より速いこと、100ステップを通した勾配が有限差分と合うことを示した（抄録）。", "p2": "元のFortran実装はCPU向けで、GPU計算も自動微分も使えない（抄録）。背景：勾配が得られないと、観測を使ったパラメータ最適化や4次元変分データ同化を行いにくい。過程をすべて保ったまま微分可能な実装にできるかを問う。", "p3": "1つの時間ステップの状態遷移を過程ごとの演算子の合成として書き、すべてをJAXの配列演算と制御フローで実装して、初期値・強制力・パラメータへの依存を時間ステップをまたいで保つ（§1.2.3、式2）。目的関数の勾配は時間方向の逆伝播で求める（§1.2、図1）。設定はCESM2.1.3のBGC-Crop構成で、約0.9°×1.25°の全球格子、WFDE5の大気強制を使う（§1.3）。", "p4": "初期の土壌温度に10の−14乗程度の摂動を加えたCLM自身の10メンバーの相互差を基準線とし、2019〜2023年の連続積分で32変数の誤差がそれを下回るかを見た（§1.4.1、§2.1、§3.2）。速度は同じサーバの64コアのCPUとGPU1枚で比べ、勾配はステップ100の第1層土壌温度の初期土壌温度に対する勾配を、収束した中心差分と比べた（§2.2、§2.3）。", "p5": "CLM-JAXとCLMの誤差は、ほぼ常にCLM自身の差の基準線を下回った（§2.1、§3.2）。GPUでは1モデル時間あたり0.7692秒で、64コアのCLM（gfortranで3.1095秒、ifortで1.9805秒）の4.04倍と2.57倍の速さだった（§2.2、表1）。勾配は、0でない参照値84,254のうち95.79%が相対誤差1%以内で、98.22%で符号が一致した（抄録）。", "p6": "有限差分が収束せず参照値が得られない組合せが122,216のうち34,741あり、著者はパラメタリゼーションの分岐の切り替わりによる勾配の不連続が原因とする（§2.3）。勾配の検証は100ステップと1つの目的関数に限られ、より長い積分での検証は今後の課題である（§3.4）。速度向上の倍率はCPU側のコンパイラに依存する（§2.2）。", "fun": "地面と植物が大気とやり取りする熱や水や炭素を計算する陸面モデルを、GPUで動く形に書き直した研究である。答えが元と同じかを確かめる基準が面白い。元のモデルの初期値を計算機の丸め誤差ほどだけ変えて10回走らせ、その10本のばらつきより新旧の差が小さければ「区別できない」とみなす。書き直しの正しさを、モデル自身のゆらぎを物差しにして測ったわけである。", "unverified": "§1.1、§1.2.1、§1.2.2、§1.2.4、§1.4.2、§1.4.3、§3.1、補足資料（残り24変数の図）は読んでいない。独自の微分規則の内容、有限差分が収束しない組合せでの勾配の妥当性は確認していない。"}}, {"id": "pn16", "rank": 16, "field": "因果推論", "headline": "主層の無視可能性が破れたときの鋭い感度分析", "title": "Sharp sensitivity bounds and maximin policy learning under violations of principal ignorability", "url": "https://arxiv.org/abs/2611.33585", "authors": "Sihyung Park ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Park, S., Lu, W., & Yang, S. (2026). Sharp sensitivity bounds and maximin policy learning under violations of principal ignorability (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33585", "why": "遵守者での割り当て効果の識別に使う主層の無視可能性は検証できない。平均と範囲だけに基づく従来の感度分析は観測データと両立しない分布を許してしまうため、観測された結果の分布と遵守者の割合を保つ分布的な感度モデルを作り、効果と方策の価値の鋭い境界を導いた。二重頑健な推定と、最悪の場合に備える方策学習も示す。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "無作為化実験で割り当てに従った人たち（遵守者）での効果を調べるときの検証できない仮定が破れた場合に、効果がどの範囲に収まるかを、観測データと矛盾しない最も狭い形で求める方法を示した。", "p3": "主層の無視可能性からのずれを表す感度モデルを、観測された結果の分布全体と遵守者の割合を保つ形で作る。観測された混合分布の中の遵守者の分布のうち、割り当ての両群で両立するものを厳密に特徴づけ、鋭い境界を得る（抄録）。", "p5": "遵守者の割合がずれの大きさを制約するため、感度のパラメータを有限に制限しなくても情報のある境界が残ることを示した。二重頑健な一致性と半パラメトリック効率の条件、最悪の場合に備える決定木の方策も与え、オレゴン医療保険実験に適用した（抄録）。", "fun": "くじ引きで制度の対象者を決めても、当たったのに利用しない人がいる。すると「くじに従った人」にとっての効果を知るには、確かめようのない仮定が要る。この研究は、その仮定が外れていた場合に結論がどこまで動くかを、データと矛盾しない範囲でぎりぎりまで絞り込む方法を作った。仮定を信じ切るのではなく、外れた場合の幅を示すという姿勢が面白い。", "unverified": "境界の具体的な幅、数値実験の条件、オレゴンの実験への適用結果の数値は抄録になく未確認。"}}, {"id": "pn17", "rank": 17, "field": "機械学習", "headline": "言語モデルと画像モデルの内部は回転でほぼ重なる", "title": "The Platonic Representation Hypothesis in Jacobian-Space: Language and Vision Models Agree Approximately Up to a Rotation", "url": "https://arxiv.org/abs/2611.33304", "authors": "Ross Murphy ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Murphy, R., & Brostow, G. (2026). The Platonic Representation Hypothesis in Jacobian-Space: Language and Vision Models Agree Approximately Up to a Rotation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33304", "why": "異なる種類のデータで学習したモデルが共通の表現に収束するという仮説を、活性化ではなく、内部表現が出力に与える影響を表すヤコビアンの空間で調べた。語彙や分類クラスごとのベクトルが作る空間が言語モデルと画像モデルの間で対応し、その対応はほぼ1つの回転で表せるという証拠を示す。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "言語モデルと画像モデルは、世界の表し方だけでなく、内部表現が出力をどう動かすかという働きかけ方でも、ほぼ1つの回転で互いに写せるほど似ていることを示した。", "p3": "Transformerのある層で、語彙の各語（または分類のクラス）について、その語を出す傾向を最も高める隠れ状態のベクトルをヤコビアンから求め、その集まり（J空間）をモデル間で比べた。一部の語で当てはめた1つの回転を、残りの語に適用する（抄録）。", "p5": "一部の語で当てはめた回転は、当てはめに使っていない語やクラスにも通用した。文章だけで学習した言語モデルの語のベクトルを回転して画像言語モデルの画像パッチに加えると、そのモデルが画像にあると答える物体が、加えた領域でだけ変わった（抄録）。", "fun": "文章だけを読んで育ったAIと、画像を見て育ったAIは、まったく別の「頭の中」を持っていそうに思える。ところが、ある言葉を出したくなる方向を表す矢印を集めて比べると、片方の矢印の束をぐるっと回すだけで、もう片方にほぼ重なった。回した矢印を画像のAIに足すと、そこにその物があると答えるようになる。学び方が違っても似た地図に行き着くらしい。", "unverified": "調べたモデルの名前と数、一致の度合いの数値は抄録になく未確認。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "自動化は労働課税に頼る国の財政を圧迫する", "title": "AI, Automation, and Fiscal Pressure", "url": "https://arxiv.org/abs/2611.34234", "authors": "Spencer Bastani ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Bastani, S., Graetz, G., Pla, B., & Skans, O. N. (2026). AI, Automation, and Fiscal Pressure (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34234", "why": "労働を資本より重く課税し、医療や教育を税で賄う国で自動化が財政に与える影響を、タスク単位の自動化を入れた2部門の一般均衡モデルで調べた。自動化は所得を課税の軽い資本へ移す。EU27か国に合わせた基準シナリオでは、自動化で経済が12%成長する一方、財政赤字が付加価値の約1ポイント増える。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "自動化が進むと、労働に重く課税し公共サービスを税で賄う国では、経済が成長しても財政赤字が広がりうることを、一般均衡モデルで示した。", "p3": "タスク単位の自動化を、2部門からなる一般均衡モデルに組み込み、EU諸国のデータに合わせて較正した。自動化は所得を、課税の軽い資本の側へ移す（抄録）。", "p5": "公共サービスが消費者の需要に従うなら、税率を変えない限り赤字は悪化し、公共サービス部門の自動化が民間と同じ速さでも変わらない。市場部門の自動化が速いEU-27の基準シナリオでは、自動化で経済が12%成長する一方、赤字が付加価値の約1ポイント増える（抄録）。", "fun": "ロボットやAIで仕事が自動化されれば経済は成長する。それなら国の財政も楽になりそうだが、この研究は逆になりうると言う。対象の国々は、働く人の所得に重く税をかけ、資本のもうけには軽くかけている。自動化で所得が労働から資本へ移ると、税収が伸びにくくなるからだ。成長と財政が食い違う、という意外な指摘である。", "unverified": "モデルの詳細な仮定、国別の結果、税制を変えた場合の試算は抄録の範囲では未確認。"}}, {"id": "pn19", "rank": 19, "field": "統計学", "headline": "模擬器の誤りによる系統誤差を影響マップで測る", "title": "When precision exceeds fidelity: systematic error quantification for inference with misspecified simulators", "url": "https://arxiv.org/abs/2611.33282", "authors": "M. J. Yantovski-Barth ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Yantovski-Barth, M. J., Zhang, H., Smyth, N., Amvrosiadis, A., Bureau, M., Hezaveh, Y., & Perreault-Levasseur, L. (2026). When precision exceeds fidelity: systematic error quantification for inference with misspecified simulators (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33282", "why": "データの精度が上がると、パラメータ推論の不確かさは測定ノイズよりシミュレータ自体の系統誤差で決まる。誤特定のもとではベイズの証拠が最も近いモデルに集中し、モデル平均が系統誤差を過小評価しうる。データの摂動に対する推定値の局所的な応答（影響マップ）を既存の事後標本から推定し、食い違いの残差を伝播させて系統誤差の源を切り分ける方法を示す。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "データが精密になると、推定の誤差は測定のノイズよりシミュレータ自体の不完全さで決まる。そのような系統誤差の出どころを、既存の事後標本から効率よく切り分ける方法を示した。", "p3": "推定したパラメータがデータの摂動にどう応答するかを表す「影響マップ」を、既存の事後標本でのシミュレータの順方向の評価から推定する。シミュレータとデータの食い違いの残差をこのマップに通し、偏りの源を個別に分ける（抄録）。", "p5": "超大質量ブラックホールの質量を推定する独立な観測に適用すると、誤差はモデルの系統誤差が支配していた。全モデルに共通する単純化を特定して一次の補正をかけると、各モデル内での観測間の整合が大きく改善し、モデル間のばらつきは残った（抄録）。", "fun": "ものさしの目盛りがどんどん細かくなると、最後に残る誤差は「読み取りのぶれ」ではなく「ものさし自体の狂い」になる。科学の計算モデルも同じで、観測が精密になるほど、モデルの単純化による偏りが目立つ。この研究は、データが少しずれたら答えがどれだけ動くかという地図を作り、どの単純化が答えを狂わせているかを突き止めた。ブラックホールの質量の推定で試している。", "unverified": "補正の前後の数値、対象の天体、使ったモデルの数は抄録になく未確認。"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "気候への関心が高い地域ほど保険料がリスクを反映", "title": "Who Pays for Climate Risk? Household Attention, Insurance Markets, and Regulation", "url": "https://doi.org/10.2139/ssrn.7727383", "authors": "Lin Peng ほか", "venue": "SSRN", "date": "2026-11-25", "apa": "Peng, L., & Wang, Y. (2026). Who Pays for Climate Risk? Household Attention, Insurance Markets, and Regulation. https://doi.org/10.2139/ssrn.7727383", "why": "米国の郡単位のデータで、住民の気候への関心が災害リスクと住宅保険料・住宅価格の関係をどう変えるかを調べた。関心が1標準偏差高いと、保険料のリスクへの反応が16.7%強まる。操作変数と不動産サイトの気候リスク表示の導入も因果的な解釈を支持する。保険料の規制が厳しい州では保険料の反応が弱く、住宅価格の割引が大きい。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "住民が気候変動に関心を持っている地域ほど、住宅保険料と住宅価格が災害リスクを強く反映することを、米国の郡のデータで示した。", "p3": "郡単位のデータで、災害リスクと年間の平均保険料・住宅価格の関係が、住民の気候への関心によってどう変わるかを調べた。操作変数による推定と、不動産サイトRedfinの2021年の気候リスク情報という情報の衝撃を使った（抄録）。", "p5": "関心が1標準偏差高いと、保険料の災害リスクへの反応が16.7%強まる。保険料率の規制が厳しい州では関心に伴う保険料の反応が弱く、住宅価格の割引が大きい。規制の緩い州では、規制の厳しい州からの保険料の波及が関心の高い郡で9.1%強い（抄録）。", "fun": "災害の危険が高い土地なら、保険料は高く、家は安くなるはずだ。でも実際にそうなるかは、住民がその危険を気にしているかどうかに左右される。気候に関心の高い地域ほど、保険料も家の値段も危険を強く映していた。さらに、保険料を規制で抑えた州があると、その費用がよその州の世帯に回る可能性があるという。リスクの費用は消えずに誰かが払う。", "unverified": "気候への関心の測り方、対象の年と郡の数、操作変数の中身は抄録になく未確認。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "低賃金企業は離職先が失業であることが多い", "title": "The Churn Ladder", "url": "https://doi.org/10.2139/ssrn.7753820", "authors": "Lawrence Warren ほか", "venue": "SSRN", "date": "2026-11-25", "apa": "Warren, L., & Wiczer, D. G. (2026). The Churn Ladder. https://doi.org/10.2139/ssrn.7753820", "why": "労働者が低賃金・高離職の企業から高賃金・低離職の企業へ移る「離職のはしご」を実測した。標準的なジョブラダーモデルは引き抜きだけでは企業間の離職率の差を再現できず、低賃金企業ほど非就業への離職が多いことが差を広げている。企業と労働者の両方の離職率の異質性を入れ、賃金と離職の同時分布を再現する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "労働者が低賃金で離職の多い企業から高賃金で離職の少ない企業へ移っていく「離職のはしご」を実測し、標準的な理論ではその傾きを説明できないことを示して、モデルを拡張した。", "p3": "標準的なジョブラダーモデルでは、引き抜きだけでは企業間の離職率のばらつきが小さすぎる。企業と労働者の両方に離職率の異質性を入れ、内生的な選別を生じさせて、賃金と離職の同時分布を再現した（抄録）。", "p5": "低賃金の企業ほど非就業への離職も多く、これがはしごの上下での離職の差を大きくしていた。労働者の異質性だけで、非就業への離職の企業間のばらつきの半分を説明する。賃金に依存する非就業への離職を無視すると、企業の労働市場での力を過大に見積もる（抄録）。", "fun": "給料の安い会社は人がよく辞める。それは社員が給料のいい会社に引き抜かれるからだ、とこれまでの理論は説明してきた。ところがデータを見ると、引き抜きだけでは辞める人の多さを説明しきれず、安い会社では「辞めて仕事のない状態になる」人も多かった。これを無視すると、会社が賃金を抑える力を大きく見積もりすぎるという。", "unverified": "使ったデータの国と期間、推定された数値の詳細は抄録になく未確認。"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "AIで失う知識職の雇用は総需要しだいで補われる", "title": "When AI Automates Knowledge Work: Aggregate Demand and Occupational Adjustment", "url": "https://doi.org/10.2139/ssrn.7727199", "authors": "Baris Soybilgen", "venue": "SSRN", "date": "2026-11-25", "apa": "Soybilgen, B. (2026). When AI Automates Knowledge Work: Aggregate Demand and Occupational Adjustment. https://doi.org/10.2139/ssrn.7727199", "why": "AIが担える知識労働のタスクの割合が6年で5%から35%に上がるとき、知識職の人が手作業の職で補える雇用の割合を米国の労働市場モデルで調べた。雇用を左右するのは職の適性より、AIが生む所得がどれだけ支出されるかだった。資本所有者が増えた所得の半分を支出する基本ケースでは、20年で知識職の雇用減の40%が手作業の職で補われる。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "生成AIが知識労働のタスクを担うようになったとき、職を失う人がどれだけ別の仕事に就けるかは、資格よりも、AIが生む所得がどれだけ使われるかで決まることをモデルで示した。", "p3": "米国の労働市場のモデルで、AIが担える知識タスクの割合が6年で5%から35%に上がる場合に、当初知識職に就いていた、または探していた人々を追う。基本の実験では、資本所有者は増えた所得の半分を支出し、金利は下がらない（抄録）。", "p5": "支出と生産は減り、知識職でも手作業の職でも仕事が見つけにくくなる。20年で、手作業の雇用の増加は知識職の雇用減の40%を埋め、さらに2.4ポイントが無職になり、手作業の賃金は22%下がる。全員が手作業の職に就く資格を持っても、無職の割合は最大0.1ポイントしか変わらない（抄録）。", "fun": "AIに知識を使う仕事を取られたら、体を使う仕事に移ればよい、と考えたくなる。この研究のモデルでは、それがうまくいくかは「移る資格があるか」より「世の中でお金が使われるか」で決まった。AIでもうけた人がそのお金をあまり使わなければ、物やサービスが売れず、移る先の仕事も減ってしまう。問題は技能よりも需要だ、という見立てが面白い。", "unverified": "モデルの較正の詳細と前提の根拠は抄録の範囲では未確認。数値はモデルの試算で、実際の観測ではない。"}}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "遠隔交渉は合意しやすいが分け前が不平等になる", "title": "Does Physical Presence Matter? Efficiency and Inequality in Remote Negotiations&nbsp;", "url": "https://doi.org/10.2139/ssrn.7727184", "authors": "Faeze Heydari ほか", "venue": "SSRN", "date": "2026-11-25", "apa": "Heydari, F., Keser, C., Schacht, A., & Rau, H. A. (2026). Does Physical Presence Matter? Efficiency and Inequality in Remote Negotiations&nbsp; https://doi.org/10.2139/ssrn.7727184", "why": "事前登録の実験室実験で、対面とビデオ通話の交渉を最後通牒ゲームで比べた。遠隔では全組が合意し、対面は92%だった。資源が乏しいとき、対面では均等な分配に収束するが、遠隔でははるかに不平等になる。虚偽の申告や疑いの多さでは説明できず、会話と表情の分析は、対面でないと均等分配が共通の基準点として働きにくいことを示唆する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "対面とビデオ通話の交渉を実験で比べ、遠隔では合意はしやすいが、資源が乏しいときに分け前が大きく不平等になることを示した。", "p3": "事前登録の実験室実験で、2人組が対面またはビデオで、乏しい資源か豊富な資源をめぐる最後通牒型の交渉をした。資源の量は提案する側だけが知る。会話をLLMで分類し、表情を自動の感情認識で測った（抄録）。", "p5": "遠隔の組はすべて合意し、対面は92%だった。資源が乏しいとき、対面の組は均等な分配に収束するが、遠隔でははるかに不平等だった。虚偽の申告や疑いが増えたためではない。戦略的で不信のある交渉は、対面では均等に収束するが、遠隔ではそこから外れやすい（抄録）。", "fun": "交渉をオンラインに切り替えると何が変わるのか。この実験では、ビデオ通話のほうが話はまとまりやすかった。ところが分けるものが少ないとき、対面では自然と均等な分け方に落ち着くのに、ビデオでは片方が大きく取る結果になりやすかった。目の前に相手がいると「均等が当たり前」という共通の基準が働くが、画面越しではそれが弱まるらしい。", "unverified": "参加者の数、不平等の大きさの数値、検定の結果は抄録になく未確認。表情と会話の分析は探索的とされている。"}}, {"id": "pn24", "rank": 24, "field": "経済学", "headline": "予測市場に載った言葉が政治家の発言に増える", "title": "How Prediction Markets Affect Political Speech", "url": "https://doi.org/10.31235/osf.io/n6zxw", "authors": "Jonathan Elkobi ほか", "venue": "SocArXiv", "date": "2026-11-25", "apa": "Elkobi, J., & Karell, D. (2026). How Prediction Markets Affect Political Speech. https://doi.org/10.31235/osf.io/n6zxw", "why": "政治家が特定の言葉を口にするかに賭ける予測市場が、政治的な発言そのものに影響する可能性を調べた。市場に載った言葉は、開設後の数日間にトランプ氏の発言に現れやすくなり、取引量が多い市場ほど効果が大きい。連邦準備制度理事会議長の記者会見では同様の効果は見られなかった。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "政治家が特定の言葉を口にするかどうかに賭ける予測市場が開設されると、その言葉が実際の発言に現れやすくなることを示した。", "p3": "政治エリートの発言に含まれる特定の語に賭ける「言及市場」と、トランプ氏および連邦準備制度理事会議長の公の発言の関係を分析した。操作、自己成就、正当化という3つの経路を理論的に整理した（抄録）。", "p5": "市場に導入された語は、開設後の数日間、トランプ氏の発言に有意に現れやすくなり、取引量が多い市場ほど効果が大きかった。連邦準備制度理事会議長の記者会見では同様の効果は検出されなかった（抄録）。", "fun": "「政治家が次にこの言葉を言うか」に賭ける市場がある。予測市場は未来を当てる道具のはずだが、この研究によれば、賭けの対象になった言葉は、そのあと実際に発言に出てきやすくなった。取引が多いほどその傾向が強い。未来を「予測する」しくみが、未来そのものを動かしているかもしれないという、少しこわい話だ。", "unverified": "効果の大きさの数値、対象期間と市場の数、因果の識別の方法は抄録になく未確認。どの経路が働いているかは今後の課題とされている。"}}, {"id": "pn25", "rank": 25, "field": "経済学", "headline": "実験の偽陽性が成果連動の報酬をゆがめる", "title": "False Positives and Innovation Incentives: Contracting for Noisy Experimentation", "url": "https://arxiv.org/abs/2611.33916", "authors": "Chang Liu ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Liu, C., Liu, H., Si, N., & Zheng, Z. (2026). False Positives and Innovation Incentives: Contracting for Noisy Experimentation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33916", "why": "製品の変更がノイズのあるオンライン実験を通過して初めて採用され、報酬が採用に連動する組織を、プリンシパル・エージェントモデルで分析した。価値の低い機能も偶然通過するため、採用連動の賞与は余剰を減らす実験を促す。採用時の賞与と長期の価値の分配を組み合わせた契約を、情報の非対称性のもとで保証できる利得の割合で評価する。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "新機能の採用が誤差のあるオンライン実験の合否で決まり、報酬がその採用に連動する組織で、どんな報酬の契約が望ましいかを理論的に示した。", "p3": "機能の質について私的な知識を持つ担当者が、費用のかかる実験を行うかを選ぶプリンシパル・エージェントモデル。報酬は、採用時の賞与と長期の価値の分配からなる一次式の契約で、有限責任の制約がある。契約は、情報が完全な場合の利得のうち保証できる最大の割合で評価する（抄録）。", "p5": "採用時の賞与は偶然うまくいった機能に報いるため、偽陽性をねらう実験を促す。一方、有限責任のもとでは価値の分配だけでは効率的な実験を引き出せない。最適な契約は、機能の質の標準的な水準、分布の不確かさ、有限責任の厳しさに応じて両者の釣り合いをとる（抄録）。", "fun": "新機能は、試験で成績が良ければ採用される。担当者のボーナスが「採用されたかどうか」で決まるなら、何が起きるか。試験には運の要素があるので、価値の低い案でも偶然通ることがある。すると担当者は、通りそうにない案でも試してみる方向に動いてしまう。この論文は、その困った誘惑を数式で表し、ボーナスの決め方をどう設計すればよいかを考えた。", "unverified": "理論モデルの結果で、実際の企業データでの検証は抄録の範囲では行われていない。最適な契約の具体的な式は未確認。"}}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "無作為化実験のROC曲線をモデルなしで推測", "title": "Design-based causal inference for ROC curves", "url": "https://arxiv.org/abs/2611.34057", "authors": "Bufan Li ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Li, B., & Yu, H. (2026). Design-based causal inference for ROC curves (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34057", "why": "無作為化実験で処置群と対照群の結果の分布を比べるROC曲線について、結果のモデルを置かない設計に基づく推測を示した。順位だけに依存する推定量の漸近正規性と保守的な分散推定を導き、共変量調整で分散が増えないことを示す。同時信頼帯と上側の裾での推測も扱う。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "無作為化実験で、処置を受けた人の結果が対照群の分布の上位の各水準を超える割合を表すROC曲線について、結果のモデルを仮定せずに推定と信頼区間を作る方法を示した。", "p3": "完全無作為化のもとで、設計に基づく枠組みを採る。両群を合わせた結果の順位だけに依存する推定量を提案し、漸近正規性を示して保守的な分散推定量を構成する。共変量による調整をROCの推定量に直接組み込む（抄録）。", "p5": "共変量調整は推定の対象を変えずに、漸近分散を調整なしの場合以下にする。分位点の内側の範囲での同時信頼帯と、対照群の分布の極端な上側の裾での点ごとの推測にも拡張した。シミュレーションと大規模なオンライン学習の実験で例示した（抄録）。", "fun": "新しいやり方の効果を調べるとき、ふつうは平均の差を見る。でも「新しいやり方を受けた人のうち、従来のやり方の上位の人たちを超えた人はどのくらいいるか」も知りたい。それを全ての水準について描いたのがROC曲線だ。この研究は、結果がどんな分布に従うかを仮定せず、くじ引きで分けたという事実だけを頼りに、この曲線の確かさを評価する方法を作った。", "unverified": "シミュレーションと応用の具体的な数値、実験の規模は抄録になく未確認。"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "学習した重みつきFDR制御の妥当性を事前に認証", "title": "Certifying a Sufficient Gaussian Dependence Regime for Learned Weighted FDR Control", "url": "https://arxiv.org/abs/2611.33892", "authors": "Soyeong Oh", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Oh, S. (2026). Certifying a Sufficient Gaussian Dependence Regime for Learned Weighted FDR Control (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33892", "why": "補助データから仮説の重みを学習する多重検定で、重みつきBH法の妥当性は検定間の依存の形に左右される。参照データで片側ガウス検定の十分な依存条件を認証し、認証できなければ調整した水準の代替手順に切り替えることでFDRを制御する方法を示した。一様な認証の障害と、必要な標本数のミニマックスの限界も導く。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "補助データから学習した重みを使う多重検定で、偽発見率（FDR）の制御が保たれる条件を参照データで事前に確かめ、確かめられなければ安全な代替手順に切り替える方法を示した。", "p3": "片側のガウス検定について、相関の符号が不確かな組を交差合併検定で調べ、重みつきBenjamini-Hochberg法を使うか、水準を調整した事前指定の代替手順を使うかを決める。認証と検定を条件つきで分離する（抄録）。", "p5": "この手順は、仮定を満たすすべてのガウス相関行列でFDRを制御する。必要な標本数のミニマックスの限界は、調べる組の数の対数と、正の余裕の逆数の2乗で増える。最大4,950組のシミュレーションで、認証と検出力の交換関係を示した（抄録）。", "fun": "たくさんの仮説を一度に調べると、偶然の「当たり」が混じる。それを抑える定番の方法に、別の情報を使って有望そうな仮説に重みを付ける工夫があるが、検定どうしの関係しだいでは誤りの抑えが利かなくなる。この研究は、本番の前に参照用のデータで「この方法を使って大丈夫か」を確かめ、だめなら安全な方法に切り替える仕組みを作った。保険つきの近道である。", "unverified": "シミュレーションの数値結果、Healthy Brain Networkにもとづく設計での結果の詳細は抄録の範囲では未確認。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "低次数の困難性は固有ベクトル検定までは排除しない", "title": "Low-degree hardness rules out eigenvalue tests but not eigenvector tests", "url": "https://arxiv.org/abs/2611.34728", "authors": "Xuan Chen ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Chen, X., & Li, S. (2026). Low-degree hardness rules out eigenvalue tests but not eigenvector tests (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34728", "why": "低次数多項式による検出の困難性が、固有値や固有ベクトルに基づく検定に何を意味するかを調べた。一定量のガウスノイズを加えると、低次数の優位が消える問題では固有値に基づくどの検定も働かない。一方、固有値の分布は帰無仮説と完全に同じなのに固有ベクトルで区別できる分布を構成し、固有ベクトル検定は排除されないことを示す。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "低次数多項式では検出できないという「低次数の困難性」が成り立つ問題でも、固有値にもとづく検定は使えなくなる一方、固有ベクトルにもとづく検定は使える場合があることを示した。", "p3": "ガウス直交アンサンブル（GOE）を帰無分布とし、一定量のガウスノイズを加える設定を考える。固有値の結果は、ノイズを3段階に分け、固有値の剛性、ダイソン・ブラウン運動による結合、ガウス平滑化を順に使って証明する（抄録）。", "p5": "低次数の優位が対数次数で消えるなら、ノイズを加えた固有値の同時分布はGOEのそれに全変動距離で収束する。一方、固有値がどのノイズ水準でもGOEと完全に同じ分布なのに、固有ベクトルで区別できる分布を構成した。1本の固有ベクトルで足りる場合もある（抄録）。", "fun": "雑音だらけの大きな表の中に、仕込まれた規則があるかを見分けたい。計算の難しさの目安として「低い次数の多項式で見分けられなければ難しい」という考え方がある。この論文は、その目安が成り立つとき、表の固有値を見る方法は確かに使えなくなるが、固有ベクトルを見る方法は生き残ることがあると示した。同じ行列でも、見る場所で難しさが変わる。", "unverified": "定理の正確な仮定、構成された分布の詳細は抄録の範囲では未確認。"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "カウントのネットワーク回帰に使える並べ替え検定", "title": "Permutation tests for Poisson network regression: Double semi-partialling, studentized statistics and actor effects", "url": "https://arxiv.org/abs/2611.34219", "authors": "David Dekker ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Dekker, D., & Krause, R. W. (2026). Permutation tests for Poisson network regression: Double semi-partialling, studentized statistics and actor effects (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34219", "why": "二者間データの推測に使われるMRQAPを、結果がカウントのポアソン回帰に拡張した。二重の部分残差化が必要とするフリッシュ・ウォー・ロベルの定理の不変性が、対数リンクのもとでも成り立つことを証明し、並べ替えの方法と基準化した統計量が検定の水準をどう保つかを示す。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "人と人の間のやり取りの回数のようなカウントのネットワークデータに対する回帰で、並べ替え検定を正しく使う条件を理論と模擬実験で明らかにした。", "p3": "二者間データの標準的な推測の枠組みMRQAPを、対数リンクのポアソン回帰に拡張した。二重の部分残差化（DSP）が必要とするフリッシュ・ウォー・ロベルの定理の不変性が、非線形のリンクでも成り立つことを証明した（抄録）。", "p5": "共変量の相関が0.9まで、20〜100の行為者のネットワークで、並べ替え検定は名目の水準を保った。正規分布を基準にすると、真の帰無仮説を最大0.96の率で棄却した。送り手と受け手の効果を入れると棄却率は0.035〜0.070になり、0.10の効果への検出力は最大32%から99.9%以上に上がった（抄録）。", "fun": "誰が誰に何通メッセージを送ったか、というデータでは、一人の人が何度も登場するので、普通の統計の検定は当てにならない。実際、この研究では、ふつうのやり方だと「関係がないのに関係ありと判定する」誤りが最大0.96の率で起きた。そこで行為者の番号を入れ替えて何度も計算し直す並べ替え検定を、回数のデータ向けに整えた。つながったデータには、それに合った検定が要る。", "unverified": "模擬実験の条件の全体、EIESのネットワークへの適用結果は抄録の範囲では未確認。"}}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "LLM評価の精度は問題数より出典の数で決まる", "title": "How Many Sources, Not Just How Many Problems: Planning the Precision of LLM Evaluations from Earlier Results", "url": "https://arxiv.org/abs/2611.33622", "authors": "Guang Qiu", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Qiu, G. (2026). How Many Sources, Not Just How Many Problems: Planning the Precision of LLM Evaluations from Earlier Results (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33622", "why": "ベンチマークの問題が同じ雛形やリポジトリに由来するとき、評価の予算は問題数だけでなく出典の数も決める必要がある。級内相関による設計効果を使い、出典を減らしたときの得点の標準偏差の増え方を事前のデータから予測できることを示した。GSM-Symbolicでは10雛形×10変種の標準偏差が9.2ポイント、100雛形では2.7ポイントだった。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "同じ雛形やリポジトリから作った問題を含むベンチマークでLLMを評価するとき、得点のばらつきが問題数だけでなく出典の数で決まることを、事前のデータから予測できると示した。", "p3": "古典的な設計効果と級内相関を使い、同じ予算を少ない出典に集中させたとき得点の標準偏差がどれだけ増えるかを、予測の検証に使うデータとは別のデータから見積もった（抄録）。", "p5": "GSM-Symbolicでは、10雛形×10変種の100問の標準偏差が9.2ポイント、100雛形からの100問では2.7ポイントだった。別の15問の予備データは、その比を3.49と予測し、実測は3.52だった。SWE-bench Verifiedでは10件の提出から119件の中央値の比を3%以内で予測した（抄録）。", "fun": "100問のテストでも、10種類の問題を少しずつ変えた100問と、100種類の別々の問題100問とでは、成績の安定のしかたが違う。前者は同じ型が解けるか解けないかで点がまとまって動くからだ。この研究では、前者の成績のぶれは後者の3倍以上あった。AIの成績表を読むときは、問題の数だけでなく「元になった出典の数」も見ないといけない、と教えてくれる。", "unverified": "方法自体は新しくないと著者が述べている。他のベンチマークでの成績、pass@16で被覆が下がる理由は抄録の範囲では未確認。"}}, {"id": "pn31", "rank": 31, "field": "機械学習", "headline": "微調整による忘却は挙動が先で表現は後から変わる", "title": "Two Timescales of Forgetting in Fine-tuning of Language Models: Fast Behavioral Suppression and Slow Representational Drift", "url": "https://arxiv.org/abs/2611.33302", "authors": "Yilin Luo ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Luo, Y., Lee, J. H., Saxe, A. M., & Sclocchi, A. (2026). Two Timescales of Forgetting in Fine-tuning of Language Models: Fast Behavioral Suppression and Slow Representational Drift (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33302", "why": "階層的な潜在構造をもつ人工の文法で事前学習したTransformerを、規則の一部だけで微調整して忘却の過程を調べた。表面の挙動の抑制と、それを支える潜在表現の消去が同時に起きるのかを問い、事前学習とは異なる経過をたどることを示す。題名は、挙動の速い抑制と表現の遅い変化という2つの時間スケールを挙げている。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "言語モデルを限られたデータで微調整するとき、表に出る挙動はすぐに抑えられるが、それを支える内部表現はずっと遅れて失われるという、忘却の2つの時間スケールを示した。", "p3": "階層的な潜在構造をもつ人工の文脈自由文法（Random Hierarchy Model）でTransformerを事前学習し、生成規則の一部だけを使って教師ありの微調整を行い、削除された規則の生成と内部表現の変化を追った（抄録）。", "p5": "削除された規則の生成は、トークンと潜在変数の相関の大きさに反比例する速い時間スケールで変わり、その間、対応する表現は保たれる。表現が忘れられるのははるかに長い時間スケールで、ネットワークのパラメータのゆっくりした漂流に伴う。自然言語の設定でも類似の結果を観察した（抄録）。", "fun": "AIを追加の学習で特定の振る舞いに寄せると、使わなくなった規則はすぐに出力に現れなくなる。では内部からも消えたのか。この研究は、出力に出なくなるのは早いが、内部に持っている表現そのものが消えるのはずっと後だと示した。人が「言わないだけで覚えている」のに少し似ている。表に見える変化と内側の変化は別の速さで進む、という発見だ。", "unverified": "時間スケールの具体的な比、自然言語での実験の設定と数値は抄録になく未確認。"}}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "ループ間の受け渡しを再設計したTransformer", "title": "Mixture-of-Loops Transformer", "url": "https://arxiv.org/abs/2611.34923", "authors": "Lianghui Zhu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-26", "apa": "Zhu, L., Wang, S., Wang, X., Bai, J., Wang, B., & Bai, X. (2026). Mixture-of-Loops Transformer (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34923", "why": "同じ層を繰り返し使うループ型Transformerで、ループ間に何を渡すかを見直した。キーと値を記憶として深さとループをまたいで選択的に再利用する注意機構を導入し、残差流を保つ型と、埋め込みからやり直して前のループの記憶を読む型を示す。後者は並列学習と、学習時より長いループでの1回の走査の復号を可能にする。Hugging Faceで投票数56。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papersに掲載されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "同じ層を何周も使うループ型のTransformerで、周回の間に何を受け渡すかを設計し直し、表現力と計算効率の両方を高めた。", "p3": "キーと値を記憶として、深さと周回をまたいで選択的に再利用する注意機構を導入した。残差流を保つ型と、埋め込みからやり直して前の周回の記憶を読む型があり、記憶の構築と予測の読み出しを分けるU字型の構成で、使わない復号の通過を省く（抄録）。", "p5": "400Bトークンの事前学習で、提案法は700M・1.5Bの密なモデルと3BのMoEモデルで比較対象のOLMo3を上回り、700Mでは検証の交差エントロピーで1.7倍のトークン効率を得た。3BのMoEでは10課題の正答率が2.1ポイント上がった（抄録）。", "fun": "AIの文章モデルは、多くの層を順に通して計算する。同じ層を何周も使い回せば、部品を増やさずに計算の回数を増やせるが、そのぶん遅くなる。この研究は、前の周で作った記憶を次の周で選んで読み返せるようにし、通らなくてよい部分は飛ばす工夫をした。同じ量の文章で学ばせても、より効率よく性能が上がったという。使い回しと近道の組み合わせが面白い。", "unverified": "比較の詳細な条件、推論の速度の全体像は抄録の範囲では未確認。査読前の原稿である。"}}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "PC操作エージェントの評価環境を自動で進化させる", "title": "Self-Evolving Evaluation Environments for Computer-Use Agents", "url": "https://arxiv.org/abs/2611.30962", "authors": "Wenhao Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-25", "apa": "Wang, W., Tong, P., Kong, Q., Li, P., Yang, H., Cai, chenglin, Chen, S., & Wang, Y. (2026). Self-Evolving Evaluation Environments for Computer-Use Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.30962", "why": "コンピュータ操作エージェントの評価が固定的で、難度の上限と粗い総合点が識別力を弱めている問題に対し、実行の記録から課題と実行可能な検証器を一緒に進化させる閉ループの評価環境を示した。評価範囲の拡大、エージェントごとの能力の境界の診断、検証器の精度の向上という3つの目的を分けて扱う。Hugging Faceで投票数51。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papersに掲載されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "パソコンを操作するAIエージェントの評価を、固定の問題集ではなく、エージェントの実行記録をもとに課題と検証器が一緒に進化していく環境に置き換えた。", "p3": "評価の範囲を広げる「ベンチマークの進化」、エージェントごとに能力の境界を探る「診断の進化」、変わる要件を状態にもとづくチェックポイントに落として敵対的に確かめる「検証器の進化」という3つの目的を分けた閉ループの環境CUA-SEEを作った（抄録）。", "p5": "複数のエージェント、アプリケーション、ラウンドにわたって、過程の証拠を保ちながら、難しく測定可能な課題を生成できたと報告する。抄録に数値の結果は示されていない（抄録）。", "fun": "テストの問題がいつも同じだと、受ける側が強くなるにつれて差が分からなくなる。パソコンを操作するAIの評価でも同じことが起きている。この研究は、AIの実行の記録を見て、問題集のほうが自動で難しく、細かくなっていく仕組みを作った。採点係にあたる検証器も一緒に作り直す点が工夫で、測るものさし自体を育てるという発想だ。", "unverified": "抄録に数値がなく、生成された課題の数、難度の伸び、検証器の正確さは未確認。"}}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "鏡を置くだけでロボットの方策は大きく崩れる", "title": "Embodied AI Fails the Mirror Test: How a Simple Mirror Breaks Robot Policies", "url": "https://arxiv.org/abs/2611.33010", "authors": "Xuanchen Liu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-25", "apa": "Liu, X., Zhang, H., Dong, B., Wu, Y., Li, H., Gao, W., Tian, Y., & Yu, W. (2026). Embodied AI Fails the Mirror Test: How a Simple Mirror Breaks Robot Policies (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33010", "why": "場面に鏡を置いたときにロボットの操作方策が正しく働くかを調べるベンチマークを作った。課題と成功基準を保ったまま、鏡1枚・2枚・鏡面の卓の条件を比べると、5つの方策すべてで成功率が下がり、低下は平均で10.8〜56.7ポイント、鏡面の卓では最大62.5ポイントだった。同じ形の反射しない板と比べ、鏡に固有の失敗を切り分けている。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papersに掲載されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "場面に鏡を置くだけで、最新のロボットの操作方策の成功率が大きく下がることを、条件をそろえたベンチマークで示した。", "p3": "既存の評価基盤RoboDojoの上に、課題と成功基準と方策を変えずに、鏡なしと、鏡1枚・鏡2枚・鏡面の卓の条件を比べるRoboDojo-Mirrorを作った。鏡は障害物でもあるため、同じ形の反射しない板とも比べた（抄録）。", "p5": "5つの方策すべてで、どの鏡の条件でも成功率が下がった。3条件の平均で低下は10.8〜56.7ポイント、鏡面の卓では62.5ポイントに達した。鏡に固有の失敗の50〜88%は板との接触の記録なしに起きており、映った物体を狙う動きや実物の位置の誤認と整合した（抄録）。", "fun": "動物が鏡に映った自分を自分だと分かるかを調べる「鏡のテスト」がある。それにならって、ロボットの前に鏡を置いてみた研究だ。すると、鏡に映った物を狙うような動きが出て、作業の成功率が大きく落ちた。人間なら鏡だとすぐ分かるが、カメラの画像から動きを決めるAIには、画像の中の物が本物か映り込みかの区別がまだ難しいことが分かる。", "unverified": "各方策の個別の成績、実機実験の数値は抄録の範囲では未確認。"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "物理現象の無次元数をAIエージェントが見つける", "title": "AI Buckingham: Agentic Discovery of Dimensionless Scaling Laws Across Physical Regimes", "url": "https://arxiv.org/abs/2611.33961", "authors": "Ao Cheng ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Cheng, A., Zhang, L., & He, G. (2026). AI Buckingham: Agentic Discovery of Dimensionless Scaling Laws Across Physical Regimes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33961", "why": "次元解析は許される無次元数を定めるが、どの組み合わせが支配的かは決めない。物理問題の記述と観測データから、言語モデルの推論と記号・数値のツールを組み合わせて支配的な無次元数を自律的に見つける枠組みを示した。勾配に基づくクラスタリングで物理領域を分け、相互情報量で支配的な群を選ぶ。流体や熱対流など10の系を扱う。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "物理の問題の説明文と観測データから、現象を支配する無次元数の組み合わせをAIエージェントが自律的に見つけ、条件によって変わるスケーリング則まで切り分ける枠組みを作った。", "p3": "大規模言語モデルの推論と計画に、あらかじめ用意した記号計算・数値計算のツールを組み合わせる。文献にもとづく知識の検索で次元を確認し、勾配にもとづくクラスタリングで物理的な領域を分け、相互情報量で支配的な無次元数の群を選ぶ（抄録）。", "p5": "流体力学、電磁流体力学、熱対流、積層造形にわたる10の物理系で、既知の相似の表現を復元し、領域に依存するスケーリングを解き明かした。粗い面の乱流抵抗の予測では、表面の統計量の有用な表し直しを見つけ、等価砂粒粗さの推定を改善した（抄録）。", "fun": "物理では、長さや速さなどをうまく組み合わせて単位のない数（無次元数）を作ると、大きさの違う現象を同じ式で扱える。ただ、どの組み合わせが大事かは次元の計算だけでは決まらない。この研究は、その「大事な組み合わせ探し」をAIのエージェントにやらせ、10の物理の系で既に知られている答えを再発見できることを確かめた。", "unverified": "10の系の内訳、再現の精度、粗さの推定の改善幅は抄録になく未確認。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "世界モデルが読めるなら強化学習は要らないか", "title": "Do We Still Need Reinforcement Learning When We Can Read the World Model?", "url": "https://arxiv.org/abs/2611.34656", "authors": "Mingchao Zhang ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Zhang, M., Cui, M., He, K., Li, Y., Li, D., Zhang, C., Luo, C., Yan, X., Xing, M., Chen, Z., Mao, H., Zhang, B., & Xu, Z. (2026). Do We Still Need Reinforcement Learning When We Can Read the World Model? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34656", "why": "環境のソースコードとして読める世界モデルがあるとき、言語モデルのコーディングエージェントがそれを読んで制御の方策を直接書く方法を調べた。方策はオンラインの結果やオフラインのデータで反復的に改良し、課題ごとの強化学習は行わない。複数のベンチマークで、従来の強化学習と同等以上の成績をはるかに少ない経験で得たと報告する。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "環境のソースコードという「読める世界モデル」があれば、LLMのコーディングエージェントがそれを読んで制御の方策を直接書け、課題ごとの強化学習をしなくても同等以上の成績が出ることを示した。", "p3": "エージェントは環境のソースコードを調べて、環境の知識を実行可能な判断の規則に翻訳し、オンラインの結果やオフラインのデータで方策を繰り返し改良する。ソースコードを見せない場合とも比べた（抄録）。", "p5": "多様な意思決定のベンチマークで、書き出された方策は従来の強化学習の方法に並ぶか上回り、必要な経験はずっと少なかった。得られた判断の規則は解釈でき、結果を受けた改良の過程も追えた（抄録）。", "fun": "ゲームの上手なやり方をAIに覚えさせるには、ふつう膨大な回数の試行錯誤をさせる。でも、もしゲームのルールが書かれたプログラムそのものを読めるなら、やってみる前に考えれば済むかもしれない。この研究は、AIにルールのプログラムを読ませて「こう動けばよい」という手順を書かせた。試行錯誤で鍛える従来の方法と同じかそれ以上の成績が、はるかに少ない経験で出たという。", "unverified": "使ったベンチマークの名前、成績と経験量の具体的な数値は抄録になく未確認。"}}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "分類器なし誘導で生成が偏る仕組みを解析的に説明", "title": "Understanding Mode Collapse in Diffusion Models under Classifier-Free Guidance", "url": "https://arxiv.org/abs/2611.33719", "authors": "Daniel Pfrommer ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Pfrommer, D., Yuan, C., Permenter, F., & Jadbabaie, A. (2026). Understanding Mode Collapse in Diffusion Models under Classifier-Free Guidance (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33719", "why": "拡散モデルの分類器なし誘導の効果が、条件つき分布と無条件分布の表現力の食い違いから生じると捉えた。条件つき分布を楕円体上に平均をもつガウス混合、無条件分布をその混合を近似する単一のガウス分布とする解析モデルを提案し、誘導のもとでの流れを解析的に扱えるようにして、モード崩壊の理解を目指す。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "画像生成の拡散モデルで広く使われる「分類器なし誘導」が、なぜ生成結果を一部に集中させるのかを、解析的に解けるモデルで説明した。", "p3": "誘導の効果は、条件つき分布のほうが無条件分布より複雑で忠実だという表現力の食い違いから生じると捉える。条件つき分布を楕円体上に平均をもつガウス混合、無条件分布をそれを近似する単一のガウス分布とし、すべてのノイズ水準と誘導の強さで閉じた形の解を導いた（抄録）。", "p5": "解析解は、誘導が（a）平均の軸の方向へのずれと、（b）ノイズなしから始めた条件つきの標本に対応する特異な点への持続的な偏りと集中を引き起こすことを示す。この理論的な予測を、事前学習済みの大規模な画像拡散モデルで検証した（抄録）。", "fun": "画像生成AIには、指示への従い方を強める調整がある。強くすると絵は忠実になるが、似たような絵ばかり出るようになる。なぜそうなるのかは、式が複雑でよく分かっていなかった。この研究は、式で解ける簡単な模型を作り、調整を強めると生成が特定の一点に引き寄せられて集まっていくことを示した。経験的に使われてきた技に理屈を与えた研究だ。", "unverified": "検証に使ったモデルと定量的な一致の程度は抄録になく未確認。"}}, {"id": "pn38", "rank": 38, "field": "機械学習", "headline": "時系列基盤モデルは未知の施策の予測に弱いか", "title": "CovNovBench: A Benchmark for Evaluating Time Series Foundation Models under Covariate Novelty", "url": "https://arxiv.org/abs/2611.33732", "authors": "Wenhao Pan ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Pan, W., Selvam, R. K., Mahoney, M. W., Jauhari, M., Cao, M., Efimov, D., & Oreshkin, B. N. (2026). CovNovBench: A Benchmark for Evaluating Time Series Foundation Models under Covariate Novelty (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33732", "why": "共変量を入力できる時系列の基盤モデルは、価格政策や治療計画のような計画された行動のもとでの予測に使われる。将来の共変量が過去の範囲を外れる状況を「共変量の新規性」と定義し、これを体系的に含むベンチマークを作って、既存モデルの挙動を評価する。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "時系列の基盤モデルが、過去に例のない施策（共変量の値）のもとでの予測をどれだけ信頼できるかを調べるベンチマークを作り、どのモデルも一貫しては信頼できないことを示した。", "p3": "将来の共変量が履歴の範囲を外れる状況を「共変量の新規性」と定義し、シミュレータにもとづくデータと実データの4つから、88,476系列の評価用データを生成・抽出した。共変量を扱える6つの基盤モデルを、追加学習なしで点予測と方向の精度で評価した（抄録）。", "p5": "共変量の新規性のもとでは点予測の誤差がほぼ常に増え、方向の精度の変化は一様でなく、最良のモデルはデータと指標によって変わった。一貫して信頼できるモデルはなかった（抄録）。", "fun": "「値段をこれまでにない水準に変えたら売上はどうなるか」を予測したい。大量の時系列で鍛えたAIは、過去に似た状況の予測は得意でも、試したことのない手を打った場合は苦手かもしれない。この研究は、まさにその「前例のない条件」を集めた88,476本の試験を作った。結果、どのAIも安定しては当てられなかった。やったことのない事の結果は、過去のデータだけからは読みにくい。", "unverified": "6つのモデルの名前、誤差の増え方の数値は抄録になく未確認。"}}, {"id": "pn39", "rank": 39, "field": "因果推論", "headline": "連続処置の効果曲線に形状制約つきの信頼帯", "title": "Adaptive confidence bands for a continuous treatment effect curve under shape constraints", "url": "https://arxiv.org/abs/2611.33440", "authors": "Charles R. Doss ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Doss, C. R., & VandenBerg, R. O. (2026). Adaptive confidence bands for a continuous treatment effect curve under shape constraints (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33440", "why": "観測データで処置が連続のとき、効果の曲線全体に対する同時信頼帯を、単調性または凹性の形状制約のもとで構成した。2つの局外関数の誤差の積が十分小さければ漸近的に妥当で、曲線の平坦さや滑らかさが未知でも最適な収束率を達成する適応性をもつ。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "処置が連続的な値をとるとき、処置の水準ごとの効果を表す曲線全体に対する信頼帯を、単調または凹という形の仮定を使って作る方法を示した。", "p3": "未測定の交絡がないという仮定のもとで、効果の曲線が単調性または凹性を満たすとして同時信頼帯を構成する。2つの局外関数が現れ、その誤差の率の積が十分小さければ漸近的に妥当になる（抄録）。", "p5": "信頼帯は、真の曲線の平坦さや滑らかさの水準が分からなくても、それを知っている場合と同じ最適な収束率を上限ノルムで達成する適応性をもつ。シミュレーションと、看護師の配置が病院の成績に与える効果への適用で示した（抄録）。", "fun": "看護師を増やすと病院の成績はどれだけ良くなるか。もっと増やしたらどうか。こうした「量と効果の関係」は1本の曲線になるが、データから描いた曲線にはぶれがある。この研究は「増やすほど良くなる」「伸びがだんだん鈍る」といった自然な形の仮定を使って、曲線全体が入る帯を、確かさを保ちながら描く方法を作った。形についての常識を統計に生かす工夫が面白い。", "unverified": "シミュレーションの数値、看護師配置の応用での結果は抄録になく未確認。"}}, {"id": "pn40", "rank": 40, "field": "因果推論", "headline": "因果効果の境界が線形計画1つで求まる条件", "title": "A Graphical Criterion for Linear Causal Bounds", "url": "https://arxiv.org/abs/2611.33950", "authors": "Alexis Bellot", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Bellot, A. (2026). A Graphical Criterion for Linear Causal Bounds (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33950", "why": "未観測の交絡があると因果効果や反実仮想の値は部分的にしか識別できない。離散変数で、交絡を受ける成分ごとの隠れた原因が2つ以下の因果図について、鋭い境界が1つの線形計画の最適値に一致するための必要十分条件をグラフの基準として与えた。仮定・問い・データを組み合わせて境界を計算するPythonパッケージも公開する。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "未観測の交絡があって因果効果が一点に決まらないとき、効果の取りうる範囲の最も狭い境界が線形計画1つで求まるのはどんな因果図の場合かを、必要十分条件として示した。", "p3": "離散値の変数を対象に、交絡を受ける各成分の隠れた原因が2つ以下であるすべての因果図について、鋭い境界が、あらゆる（正の）確率表に対して1つの線形計画の最適値に一致するための条件を与えた（抄録）。", "p5": "この条件にもとづく算法を、仮定・問い・データを組み合わせて鋭い境界を計算できるPythonパッケージ「partialid」として実装した。抄録に数値の結果は示されていない（抄録）。", "fun": "データから原因と結果の関係を知りたくても、測っていない要因が混じると、効果はぴったり一つの値には決まらない。それでも「少なくともこれ以上、多くてもこれ以下」という範囲なら言える。その範囲を最も狭く求める計算は、因果の図がある形をしていれば、線形計画という扱いやすい計算1回で済む。この論文は、その「ある形」を図から判定できる条件として示した。", "unverified": "条件の具体的な内容と証明、計算時間は抄録の範囲では未確認。"}}, {"id": "pn41", "rank": 41, "field": "工学", "headline": "建物台帳の違いが地域の地震リスク評価を左右する", "title": "Exposure Uncertainty and its Impact on Regional Seismic Risk Assessment", "url": "https://doi.org/10.21203/rs.3.rs-11865927/v1", "authors": "AnnaElisa Huynh ほか", "venue": "Research Square (In Review)", "date": "2026-11-25", "apa": "Huynh, A., Lochhead, M., Zsarnóczay, A., & Deierlein, G. (2026). Exposure Uncertainty and its Impact on Regional Seismic Risk Assessment. https://doi.org/10.21203/rs.3.rs-11865927/v1", "why": "地域の地震リスク評価の土台になる建物の台帳（曝露モデル）は、属性の欠損や情報源の食い違いを含む。妥当な複数の候補の台帳の間で生じる不確かさが、想定地震のもとでのリスク指標にどれだけ影響するかを調べる原稿である（抄録の冒頭の範囲）。", "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "地域の地震リスクを見積もる土台となる建物台帳の作り方の違いが、リスクの推定値にどれだけ不確かさをもたらすかを、ロジックツリーで定量化した。", "p3": "全国で入手できるデータから作る建物台帳について、資産単位の曝露モデルの不確かさの源を体系的に洗い出し、既知の偏りを取り除く方法を検討したうえで、ありうる台帳の組を生成して想定地震のもとで評価した（抄録）。", "p5": "大きな偏りは頑健な曝露モデルの方法で対処できる。残る曝露モデルの不確かさは、地震動モデルの選択など他の要素と比べて無視できない大きさで、建物の特性、リスクの指標、用途の区分、場所によって一様ではなかった（抄録）。", "fun": "「この地域で大地震が起きたら被害はどのくらいか」を計算するには、どこにどんな建物があるかの台帳が要る。ところがその台帳は、資料によって情報が欠けていたり食い違っていたりする。この研究は、もっともらしい台帳を何通りも作って計算をやり直し、台帳の違いだけで被害の見積もりがどれだけ動くかを測った。揺れの予測式の選び方と比べても、無視できない差があった。", "unverified": "対象地域、不確かさの大きさの数値は抄録になく未確認。査読前の原稿である。"}}, {"id": "pn42", "rank": 42, "field": "工学", "headline": "連続地震で損傷が積み重なる過程を実建物で追う", "title": "Impact of Successive Earthquakes on Incremental Structural Damage during the 2025 Sındırgı, Türkiye Earthquake Doublets", "url": "https://doi.org/10.21203/rs.3.rs-11609916/v1", "authors": "Hasan Hüseyin Aydogdu ほか", "venue": "Research Square (In Review)", "date": "2026-11-26", "apa": "Aydogdu, H. H., Yavas, M. S., Demir, U., & Ilki, A. (2026). Impact of Successive Earthquakes on Incremental Structural Damage during the 2025 Sındırgı, Türkiye Earthquake Doublets. https://doi.org/10.21203/rs.3.rs-11609916/v1", "why": "2025年8月と10月にトルコのスンドゥルグで続けて起きた同程度の強さの2つの地震について、1回目で大きく損傷した隣り合う2棟の鉄筋コンクリート建物を、現地調査・材料試験・数値解析で比べた。既存の損傷が次の揺れへの脆弱性をどう高めるかを実例で追っている。", "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "短い間隔で2度の強い地震に襲われた地域で、最初の地震で傷んだ建物が2度目でどうなったかを、隣り合う2棟の比較から明らかにした。", "p3": "2025年8月10日のMw6.1の本震と、10月27日の同程度の強さの地震に見舞われたトルコのスンドゥルグ地区で、構造形式の似た隣接する鉄筋コンクリート建物2棟を、詳細な現地調査、材料試験、数値解析で調べた（抄録）。", "p5": "2棟はどちらも1度目の地震で大破と分類されていたが、2度目で1棟は完全に倒壊し、もう1棟は立ったままだった。1度目のあとの調査で見つかっていた両者の違いが結果を分けた。既存の損傷に配筋の細部の不備が重なると、繰り返しの揺れで耐力が次第に失われる（抄録）。", "fun": "大きな地震のあと、傷んだ建物にもう一度同じくらいの地震が来たらどうなるか。実験では確かめにくいこの問いに、トルコで実際に起きた2度の地震が手がかりを与えた。隣に並ぶよく似た2棟のうち、1棟は2度目で完全に崩れ、もう1棟は残った。見た目は似ていても、1度目のあとに見つかる違いが、次の地震での結果を分けることが分かる。", "unverified": "2棟の違いの具体的な内容、材料試験と解析の数値は抄録になく未確認。"}}, {"id": "pn43", "rank": 43, "field": "工学", "headline": "衛星重力でカムチャツカ地震の断層モデルを採点", "title": "Assessment of Published Finite-Fault Models for the 2025 Kamchatka Earthquake by Comparison with Satellite Gravity Observations", "url": "https://doi.org/10.21203/rs.3.rs-11655298/v1", "authors": "Yusaku Tanaka", "venue": "Research Square (In Review)", "date": "2026-11-26", "apa": "Tanaka, Y. (2026). Assessment of Published Finite-Fault Models for the 2025 Kamchatka Earthquake by Comparison with Satellite Gravity Observations. https://doi.org/10.21203/rs.3.rs-11655298/v1", "why": "2025年のMw8.8カムチャツカ地震について、GRACE-FOの観測から地震時の重力変化（最大+3.2、最小−4.3マイクロガル）を推定し、公表されている8つの有限断層モデルの予測と、パラメータを調整せずに比べた。観測との空間相関はモデルにより大きく異なり、上位は0.93、0.91、0.89だった。", "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "2025年のカムチャツカ地震（Mw 8.8）について、衛星で測った重力の変化を、公表されている8つの断層モデルの予測と突き合わせ、モデルの出来を従来の地震・測地の観測とは独立に評価した。", "p3": "GRACE Follow-Onの観測から地震時の重力変化を推定し、公表済みの8つの有限断層モデルが予測する重力変化と、震源のパラメータを調整せずに比べた。陸と海にまたがるため、海水の再配分の効果も含む（抄録）。", "p5": "観測された重力場は最大+3.2マイクロガル、最小−4.3マイクロガルだった。観測と予測の空間相関はモデルで大きく異なり、上位2つは0.93と0.91、次が0.89だった。重力変化の大きい領域に限ると、上位2つの相関は約0.98に達した（抄録）。", "fun": "巨大地震で地下の岩盤がずれると、質量の配置が変わり、重力がほんのわずかに変わる。その変化を人工衛星が上空から捉える。この研究は、地震計などのデータから作られた8つの「断層のずれ方の説明」を、まったく別の物差しである重力で採点した。同じ地震の説明でも、重力との合い方にははっきり差が出た。別の種類のデータで答え合わせをする面白さがある。", "unverified": "重力変化の推定方法の詳細、各モデルの個別の数値、観測の分解能の限界の影響は抄録の範囲では未確認。"}}, {"id": "pn44", "rank": 44, "field": "工学", "headline": "かんらん石の破壊を高速X線と音響で捉える", "title": "High-spatiotemporal-resolution stress and acoustic emission monitoring across the brittle–plastic transition in olivine under true triaxial compression", "url": "https://doi.org/10.21203/rs.3.rs-11479232/v1", "authors": "Rikuto Honda ほか", "venue": "Research Square (In Review)", "date": "2026-11-25", "apa": "Honda, R., Kubo, T., Tsujino, N., Higo, Y., Kakizawa, S., Goto, Y., Koizumi, S., Ohuchi, T., Yumoto, H., Koyama, T., Yamazaki, H., Senba, Y., Ohashi, H., Inoue, I., Hayashi, Y., & Yabashi, M. (2026). High-spatiotemporal-resolution stress and acoustic emission monitoring across the brittle–plastic transition in olivine under true triaxial compression. https://doi.org/10.21203/rs.3.rs-11479232/v1", "why": "SPring-8の高フラックスの100keVのX線を使い、最大5GPaの真三軸圧縮下のかんらん石で、応力と変形を高い時間・空間分解能で測る手法を開発した。アコースティックエミッションの計測と組み合わせ、0.3〜0.6秒の間に起きる応力降下を、脆性から塑性への遷移をまたいで検出した。", "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "高圧下のかんらん石が、割れる脆い変形から流れる塑性変形へ移る過程で、応力の急な変化と微小な破壊音を、高い時間・空間分解能で同時に捉える実験手法を開発した。", "p3": "SPring-8の高フラックスの100keVのピンクビームを使う測定法を開発し、マルチアンビル型の装置で最大5GPaの真三軸の冷間圧縮をかけたかんらん石に適用した。アコースティックエミッション（AE）の測定と組み合わせた（抄録）。", "p5": "AEを伴う応力降下を0.3〜0.6秒以内の現象として検出した。破壊時の応力と断層の形は中間主応力の影響を示唆した。脆性・半脆性の破壊に伴う応力の空間的な不均一と、塑性変形中の応力の均質化も分解できた（抄録）。", "fun": "地下深くでは岩が高い圧力を受けていて、パキッと割れるか、じわりと変形するかの境目がある。沈み込み帯の地震の理解に関わるこの境目を、大型放射光施設SPring-8の強いX線で調べた。1秒にも満たない間に起きる力の急な抜けを、破壊の音と一緒に捉えられるようになった点が新しい。速くて場所ごとに違う現象を、高い圧力の中で見る技術の進歩が面白い。", "unverified": "時間・空間分解能の具体的な値、試料の数は抄録になく未確認。"}}, {"id": "pn45", "rank": 45, "field": "環境・気候政策", "headline": "海洋の熱塩循環の急変を輸送の収支で統一的に説明", "title": "Basin-Scale Nonlinear Dynamics of Thermohaline Ocean Circulation. Part I: Theory", "url": "https://arxiv.org/abs/2611.33383", "authors": "Conner W. Lester ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Lester, C. W., McNamara, D. E., & Wagner, T. J. W. (2026). Basin-Scale Nonlinear Dynamics of Thermohaline Ocean Circulation. Part I: Theory (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33383", "why": "熱塩循環が複数の平衡と急な遷移をもつことを、トレーサーの保存から導く枠組みで説明した。表面のフラックスを散逸と移流による輸送とつり合わせ、大規模な勾配と輸送効率で表す。3次元の海盆モデルでは、循環の崩壊のしきい値を非線形の塩分移流が、回復のしきい値を線形の散逸が支配する。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "海洋の熱塩循環が急に崩れたり戻ったりする仕組みを、熱や塩の輸送の収支という1つの枠組みで説明し、簡単な箱モデルの知見と3次元モデルをつないだ。", "p3": "トレーサー（熱・塩）の保存から出発し、海面でのフラックスを、散逸による輸送と移流による輸送でつり合わせる。このつり合いを、大規模なトレーサーの勾配と、循環が流れのない状態からトレーサーの場をどれだけずらすかを表す輸送効率で表す（抄録）。", "p5": "3次元の海盆モデルでは、循環の崩壊のしきい値は非線形の塩分移流が、回復のしきい値は線形の散逸が支配した。輸送は弱い流れでは循環の強さのほぼ2乗、強い流れでは1乗に比例する領域に分かれ、単純な閉じ方をすると従来の箱モデルの分岐の結果に帰着した（抄録）。", "fun": "海には、温度と塩分の違いで動く大きな流れがある。この流れは複数の安定な状態をもち、急に切り替わることがあると考えられている。この研究は、流れが運ぶ熱と塩の出入りの帳尻という見方で、流れが崩れる限度と戻る限度を説明した。崩れるときは塩の運ばれ方の非線形性が、戻るときは別の線形の仕組みが効くという、行きと帰りの非対称が面白い。", "unverified": "モデルの設定としきい値の具体的な値、現実の海洋への適用は抄録の範囲では未確認（転換点の予測は続編で扱うとある）。"}}, {"id": "pn46", "rank": 46, "field": "環境・気候政策", "headline": "排出量取引のもとでの企業の信用リスクを構造モデルで", "title": "Modelling and Calibration of Climate-Related Credit Risk Under the Emissions Trading System", "url": "https://arxiv.org/abs/2611.34771", "authors": "Ying Liao ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Liao, Y., & Agarwal, A. (2026). Modelling and Calibration of Climate-Related Credit Risk Under the Emissions Trading System (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34771", "why": "排出枠の上限が社債の満期内にゼロへ向かう状況で、企業が予想される炭素価格のもとで排出を選び、炭素価格が市場の需給で決まる構造モデルを作った。均衡価格の存在と上限が拘束する条件、各企業の最適な排出を導き、線形化した場合には倒産確率が明示的に得られる。EU排出量取引制度のもとの欧州の発電35社に合わせて較正した。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "排出量取引制度のもとで、炭素価格と企業の排出の選択を同時に決める構造モデルを作り、企業の倒産確率を気候政策のシナリオと結びつけて計算できるようにした。", "p3": "企業は予想される炭素価格のもとで複数のエネルギー源からの排出を選び、実現する炭素価格は部門・地域ごとの炭素市場の需給で決まる。シナリオに依存する需要の衝撃と、適応で和らげられる物理的な損失を入れる（抄録）。", "p5": "均衡の炭素価格が存在すること、排出の上限が拘束する条件、各企業の最適な排出を示した。線形化した場合、炭素価格は決定論的になり倒産確率が明示的に得られる。EU排出量取引制度のもとの欧州の発電35社に合わせると、2018〜2024年の排出枠価格の平均水準を再現した（抄録）。", "fun": "二酸化炭素を出す権利に値段がつく制度では、出せる総量の上限が決められている。その上限が、会社の借金の返済期限より前にゼロになる場合もあるという。それなら、その会社にお金を貸す危険も変わるはずだ。この研究は、権利の値段と会社の排出の決め方を1つの模型にまとめ、会社が債務を返せなくなる確率を式で出せるようにした。環境の制度が、貸し倒れの計算に直結するのが面白い。", "unverified": "倒産確率の具体的な数値、モデルの較正の詳細は抄録になく未確認。"}}, {"id": "pn47", "rank": 47, "field": "環境・気候政策", "headline": "風のずれから仕事を取り出して気球の高度を操る", "title": "Skysail: Altitude Control of Long-Duration Weather Balloons by Extracting Work from Wind Shear", "url": "https://arxiv.org/abs/2611.33882", "authors": "Michal Adamkiewicz ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Adamkiewicz, M., & Sushko, A. (2026). Skysail: Altitude Control of Long-Duration Weather Balloons by Extracting Work from Wind Shear (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33882", "why": "長時間飛ぶ気象観測気球は、ガスの放出とバラストの投下で高度を変えるため観測回数に限りがある。気球の450m下に吊るした小さな翼が、2つの高度の風速差から空気力を得て上昇・下降する方式を開発した。43時間でガスもバラストも使わずに11回の鉛直観測（計53kmの上下動）を行い、別の8日間の飛行では24回の観測を行った。", "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "気象観測の気球が、ガスの放出やおもりの投下に頼らず、上空と下の風の差から力を得て上下できる高度制御の仕組みを作り、実際の飛行で確かめた。", "p3": "ゼロ圧気球の450m下に小さな翼を吊るす。2つの高度の風速の差で翼に相対的な気流が当たり、翼の迎え角を制御すると上昇・下降の空気力が生じる。設計のモデル、係留索を繰り出す軽量の調速機構、高度保持と反復観測の制御を開発した（抄録）。", "p5": "43時間の区間で、おもりもガスも使わずに11回の鉛直観測を行い、上下の移動は計53kmに達した。別の8日間の飛行では、1kmを超える鉛直観測を24回行い、計159km上下した。制御の効きは得られる風のずれに依存する（抄録）。", "fun": "空の気温や風を測る気球は、上がるにはおもりを捨て、下がるにはガスを抜く。どちらも使い切ったら終わりだ。この研究は、気球の下に長いひもで小さな翼を吊るした。上と下で風の速さが違うので、翼には風が当たる。その風で力を作れば、何も捨てずに上がり下がりできる。風の「ずれ」そのものを動力にするという発想で、43時間に11回の観測をしてみせた。", "unverified": "翼の大きさ、必要な風のずれの大きさ、制御の精度の数値は抄録になく未確認。"}}, {"id": "pn48", "rank": 48, "field": "環境・気候政策", "headline": "暑さの影響はインドの製造業企業の規模で異なる", "title": "Limits to adaptation: distributional impacts of climate change on manufacturing firms in India", "url": "https://econpapers.repec.org/RePEc:unu:wpaper:wp-2026-124", "authors": "Garima Jasuja", "venue": "RePEc NEP", "date": "2026-11-23", "why": "インドの製造業の年次調査の大規模な企業パネルを使い、気温が企業の生産の分布全体に与える影響を、再中心化影響関数（RIF）回帰で推定した。平均ではなく分布の各位置での影響を見ることで、暑さへの適応の限界が企業によって異なることを調べている（抄録の範囲）。", "explain": {"basis": "抄録", "basis_note": "RePEc（NEP）に掲載された短い抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "暑さがインドの製造業の企業に与える影響を、平均ではなく企業の生産の分布全体にわたって推定する研究である（入手できた抄録は方法の説明にとどまる）。", "p3": "インドの年次工業調査（Annual Survey of Industries）の正規部門の製造業企業の大規模なパネルに、再中心化影響関数（RIF）回帰を適用し、気温が生産の分布の各位置に与える無条件の部分的な影響を推定する（抄録）。", "p5": "入手できた抄録には結果が書かれておらず、影響の大きさや、分布のどの位置の企業で影響が大きいかは未確認。", "fun": "暑さは工場の生産にとって逆風になる。では、その打撃は生産の多い会社にも少ない会社にも同じように及ぶのだろうか。平均だけを見ていると、この違いは分からない。この研究は、生産の少ない企業から多い企業までの分布の各位置で、暑さの影響がどう違うかを測る方法を使っている。題名は「適応の限界」を掲げており、暑さへの備えにも限りがあるのかという問いが面白い。", "unverified": "結果の数値、対象期間、企業数は抄録になく未確認。"}}, {"id": "pn49", "rank": 49, "field": "経営学", "headline": "オープンバンキングはフィンテックの利用を押し上げる", "title": "Open Banking and Competition in Banks and Fintech: Evidence from Mobile Apps&nbsp;", "url": "https://doi.org/10.2139/ssrn.7727118", "authors": "Xinchen Ma", "venue": "SSRN", "date": "2026-11-25", "apa": "Ma, X. (2026). Open Banking and Competition in Banks and Fintech: Evidence from Mobile Apps&nbsp; https://doi.org/10.2139/ssrn.7727118", "why": "フィンテックのアプリのソースコードから独自のデータを作り、同じアプリの中で国によってオープンバンキングが使えるかどうかの違いを利用して効果を調べた。オープンバンキングはアプリの利用と成績を高め、データを多く使うアプリと新興企業で効果が大きい。影響を受けた既存銀行は貸出と収入が減る一方、手数料の比重を高めて対応する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "銀行が握る顧客データへのアクセスを開く「オープンバンキング」が、フィンテックのアプリの利用を伸ばし、既存の銀行の貸出と収入を減らすことを示した。", "p3": "フィンテックのアプリのソースコードから独自のデータを作り、同じアプリの中で国によってオープンバンキングが使えるかどうかが違うことを利用して効果を識別した。アプリの説明文のテキスト分析も使った（抄録）。", "p5": "オープンバンキングはアプリの利用と成績を有意に高め、効果はデータを多く使うアプリ、新興のフィンテック企業、従来の銀行を利用しにくかったパンデミック期で大きかった。影響を強く受ける既存の銀行は貸出と収入が減るが、手数料の比重を高め収益の効率を上げて対応した（抄録）。", "fun": "銀行は、客の取引の記録をよく知っている。そのデータを銀行だけが握っていると、新しい金融アプリの会社は不利だ。この研究は、データを開放する政策が実際に競争を変えたかを、同じアプリでも国によって政策があるかないかが違うことを使って調べた。開放された国ではアプリの利用が伸び、銀行は貸出が減るぶん手数料の比重を高めた。データの独占が力の源だったと分かる。", "unverified": "効果の大きさの数値、対象の国とアプリの数は抄録になく未確認。"}}, {"id": "pn50", "rank": 50, "field": "経営学", "headline": "労組が弱まると従業員持株制度も減る", "title": "When Strikes Meet Stocks: Organized Labor and the Politics of Employee Ownership", "url": "https://doi.org/10.31235/osf.io/mbj96", "authors": "Lydia Camp", "venue": "SocArXiv", "date": "2026-11-25", "apa": "Camp, L. (2026). When Strikes Meet Stocks: Organized Labor and the Politics of Employee Ownership. https://doi.org/10.31235/osf.io/mbj96", "why": "米国の従業員持株制度（ESOP）の採用が労働組合の力に左右されるかを、2000〜2024年の年金報告書と、州ごとに時期の異なる労働権法の導入を使って調べた。労働権法は組合の組織率を下げ、その後に稼働中のESOPが減る。この効果は組織率を考慮すると弱まり、従業員持株が労使の対立への経営側の対応でもあることを示唆する。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "米国で、労働組合の力が弱まると従業員持株制度（ESOP）も減ることを示し、従業員持株が労使の対立への経営側の対応という面をもつことを示唆した。", "p3": "2000〜2024年の年金制度の報告書（Form 5500）を使い、州ごとに導入時期の異なる労働権法を組合の力への衝撃として、差分の差分とイベントスタディで分析した（抄録）。", "p5": "労働権法は組合の組織率を下げ、その後に稼働中のESOPが減った。この効果は組織率を考慮すると弱まり有意でなくなるため、組合が労働権法と従業員持株の形成をつなぐ主な経路だと考えられる（抄録）。", "fun": "社員が自分の会社の株を持つ制度は、会社と社員が協力する仕組みだと説明されることが多い。ところがこの研究では、労働組合を弱める法律ができた州で、この制度がむしろ減っていた。組合の圧力への経営側の戦略的な対応という面があるなら、圧力が弱まれば要らなくなる、というわけだ。協調の印に見える制度の裏に、力関係があることが見えてくる。", "unverified": "減少の大きさの数値、対象の州と企業の数は抄録になく未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "車両通過の振動から橋の「指紋」を見分ける", "title": "Wavelet-Augmented Feature-Based Machine Learning: Application to the Fingerprinting of Civil Engineering Structures from Vibration Signatures", "url": "https://doi.org/10.3390/infrastructures11120440", "authors": "Mohamed Jaouad Lahgazi ほか", "venue": "Infrastructures", "date": "2026-11-25", "sjr": 0.671, "citescore": 5.7, "citescore_year": "2025", "apa": "Lahgazi, M. J., Argoul, F., & Argoul, P. (2026). Wavelet-Augmented Feature-Based Machine Learning: Application to the Fingerprinting of Civil Engineering Stru
