<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

§4）。解釈：方向が感情より話題や指示の文言を拾っている可能性があり（§4）、尺度ごとの較正が必要になる。", "fun": "AIに人の役を演じさせて心理実験をするとき、「感謝した出来事を書いて」と頼む代わりに、AIの頭の中の数値を直接いじって感謝の気分にできれば手軽だ。試すと、気分の自己評価は合わせられたが、ほかの質問では効きすぎたり、本物の実験では動かない答えまで動いたりした。心を動かす方法を変えると、同じ「感謝の気分」でも中身が変わるらしい点が面白い。", "unverified": "付録Eの39比較の全結果と付録Bの条件別の平均は読んでいない。図2・3の各点の値は本文の数値で一部だけ確認した。"}}, {"id": "pr02", "rank": 2, "headline": "交換代数の記帳DSLでLLMの誤答を大幅に減らす", "title": "An Algebraic Accounting DSL as a Harness for LLM Agents: An Evaluation with Exchange Algebra", "url": "https://doi.org/10.2139/ssrn.7703980", "authors": "Kaya Akagi", "venue": "SSRN", "date": "2026-11-18", "apa": "Akagi, K. (2026). An Algebraic Accounting DSL as a Harness for LLM Agents: An Evaluation with Exchange Algebra. https://doi.org/10.2139/ssrn.7703980", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "p1": "LLMエージェントに複式簿記の記帳をさせるとき、複式簿記を代数化した交換代数（exchange algebra）の記法で答えを書かせ、提出を検査してすべての数字を導出する仕組み（ハーネス）に通すと、誤答が大きく減ることを示した（抄録）。未査読のプレプリント。", "p2": "LLMの記帳の誤りは、答えないこと（拒否）より気づかれにくく損失が大きい。抄録は、平文の会計ツールが残高と整合したまま誤った記帳を見逃す点を問題にしている（抄録）。従来の評価の詳細は未確認。", "p3": "2つのモデルに生成した記帳課題を、直接回答、Pythonを書く、交換代数を書く（提出を検査し全ての数字を導出するハーネスの下）の3通りで解かせた。あわせて誤りを注入した帳簿を、平文の会計ツール（hledger、Beancount）と会計規則を組み込んだ検査器に通した（抄録）。", "p4": "課題のうち誤答した割合で3つの方法を比べ、注入した241件の誤りのうち、締めの残高が誤った残高と整合するものを各ツールが検出できるかで検査器を比べた（抄録）。課題の作り方と規模は未確認。", "p5": "gpt-oss:120bの誤答の割合はPythonで0.711、直接回答で0.667、ハーネス下で0.189だった。gpt-6.1-solは1回の応答を超える仕訳でだけプログラムを要した。hledgerとBeancountは241件の注入誤りをすべて見逃し、会計規則を組み込んだ検査器は1件も見逃さなかった（抄録）。", "p6": "抄録には限界の記述がない。解釈：生成した課題での評価で、実務の帳簿の多様な取引や勘定科目への一般化は未確認であり、モデルも2つに限られる。", "fun": "AIに家計簿をつけさせると、合計は合っているのに途中の仕訳が間違っている、ということが起きる。この研究は、簿記を数学の式として書く「交換代数」という書き方をAIに使わせ、書いた式を機械が必ず検算する仕組みにした。すると間違いの割合が7割近くから2割弱に下がった。AIを賢くするより、検算できる書き方をさせるほうが効くという発想が面白い。", "unverified": "本文は入手できず、課題の種類と数、交換代数の記法の具体例、gpt-6.1-solの誤答率は確認できなかった。"}}, {"id": "pr03", "rank": 3, "headline": "デリバティブ開示の義務化で融資スプレッドが低下", "title": "Does Mandatory Accounting Disclosure of Derivatives and Hedging Activities Affect the Cost of Debt? Evidence from SFAS 161 Forthcoming at European Accounting Review", "url": "https://doi.org/10.2139/ssrn.7696259", "authors": "Chloe Yi Chen ほか", "venue": "SSRN", "date": "2026-11-18", "apa": "Chen, C. Y., Richardson, G., & Zhou, Q. (. (2026). Does Mandatory Accounting Disclosure of Derivatives and Hedging Activities Affect the Cost of Debt? Evidence from SFAS 161 Forthcoming at European Accounting Review. https://doi.org/10.2139/ssrn.7696259", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "p1": "デリバティブとヘッジ活動の開示を義務づけたSFAS 161の導入で、開示を増やした企業の融資スプレッドが9.6bp下がり、その主な経路は新しい情報ではなく比較可能性の向上だったことを示した（抄録）。European Accounting Review掲載予定とされる版で、SSRN上の原稿。", "p2": "貸し手は借り手について私的な情報をすでに持つので、公的な開示の義務が融資の契約に影響するかは自明でない（抄録）。", "p3": "構造化・細分化した開示を義務づけたSFAS 161の採用を利用し、デリバティブとヘッジの開示を増やした企業と、開示がほとんど変わらなかった企業の融資スプレッドを比べた（抄録）。推定の具体的な設計（差の差法か等）は未確認。", "p4": "融資スプレッドを主な結果とし、採用前の開示の多さ、同業他社の開示、エージェンシーの摩擦、シンジケートローンかどうか、新規か既存かで効果の違いを調べた（抄録）。標本の規模は未確認。", "p5": "開示を増やした企業のスプレッドは9.6bp低く、採用前に開示が多かった企業ほど低下が大きかった。同業他社が開示を増やしても低下し、エージェンシーの摩擦の大きい企業、シンジケート・非関係融資で効果が強かった。価格の効果は新規の融資に集中し、既存の融資では財務制限条項が緩められた（抄録）。", "p6": "抄録には限界の記述がない。解釈：開示の変化の大きさは企業が選ぶので、開示を増やした企業と増やさなかった企業の違いがどこまで除けているかは本文で確かめる必要がある。", "fun": "銀行は融資先の会社のことを内々によく知っているので、会社が決算書で詳しく開示しても、利息は変わらないように思える。ところが、デリバティブの開示の書式が統一されると、利息がわずかに下がった。新しい情報が増えたからではなく、他社と比べやすくなったからだという。同じ形式で書くこと自体に値打ちがある、という点が面白い。", "unverified": "本文は入手できず、標本の期間と企業数、識別の方法の詳細、9.6bpの推定の信頼区間は確認できなかった。"}}, {"id": "pr04", "rank": 4, "headline": "確率密度の輸送方程式を量子計算で解く費用を見積り", "title": "Nonlinearity-preserving quantum simulation of flows in the early fault-tolerant regime", "url": "https://arxiv.org/abs/2611.23196", "authors": "Hansol Noh (David) ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Noh, H., Oh, U., Baek, S., Doyeol, & Ahn. (2026). Nonlinearity-preserving quantum simulation of flows in the early fault-tolerant regime (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23196", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（導入・結果の前半・資源見積もり・考察の節と図のキャプション）を読んだ。Methodsと補足は未読", "preprint": true, "p1": "非線形の流れのアンサンブル予測を、確率密度の線形な輸送（Koopman–von Neumann〔KvN〕形式、リウヴィル方程式に対応）として量子回路に載せ、SINDyの多項式縮約モデルとWalsh合成で回路を節約することで、初期の誤り耐性量子計算機で扱える資源量を見積もった（抄録、Results）。未査読のプレプリント。", "p2": "非線形力学のアンサンブル予測では、確率密度が非線形のドリフトを保つ線形の輸送方程式に従うが、格子に依存する回路費用のため全体の実現性が未解決だった。既存の量子格子ボルツマンなどは発散のない流速場しか扱えず、安定な平衡への収縮を表せない（§1）。", "p3": "円柱後流（Re=100）のCFDをPOD2モードとシフトモードに射影し、SINDyで2次の多項式モデルを当てはめ、半径の式dr/dt*=μ(r−r³)に落とす（式1、μ=0.092482）。半径の密度をKvNの振幅ψで表すとリウヴィル方程式∂tρ=−∇·(Fρ)の発展がユニタリになり（式2）、隣のセル間の振幅の移動をRY回転で、その角度をWalsh関数の和で合成して回転数を減らす（Results）。", "p4": "3モードの縮約モデルとFEMの誤差で精度を確かめ、表面符号の構成（マジック状態工場を含む）で物理量子ビット数と総時間をパレート選択で見積もり、BE-KvN・LCHS-KvNの参照回路と比べた。IBMの実機で4量子ビット・16セルの非線形の半径輸送も実証した（Results、Discussion）。", "p5": "3モードの縮約モデルは最終時刻でFEMと6.42%違い、半径モデルとの差は0.60%未満だった（図2e）。物理誤り率5×10⁻⁴で1%のRMS場の誤差の予測に、最少の量子ビット数の設計は53,382量子ビット・20.07時間、最速の設計は559,942量子ビット・1.62時間と見積もった（表1）。", "p6": "この課題で古典的なサンプリングに対する量子優位は確立していないと著者は明言する（Discussion）。IBM実機には計数の不確かさを超える逸脱があり、誤差緩和で負の確率も生じうる（Discussion）。解釈：座標と次数を増やしたときに回転の節約がどこまで保てるかが残る。", "fun": "少しの違いで先が大きく変わる流れは、一つの予報ではなく「ありうる未来の分布」として予測したい。この研究は、その分布の動きを量子コンピュータで計算する方法を作り、渦が交互に流れ出る円柱の後ろの流れで、近い将来の量子計算機なら1〜2時間で解けるという見積もりを示した。確率の広がりを波の振幅に置き換え、量子の得意な形にした点が面白い。", "unverified": "Methodsの資源見積もりの詳細（表1の全設計）とIBM実機の数値（Extended Data Fig. 1）は確認できなかった。"}}, {"id": "pr05", "rank": 5, "headline": "親の記憶障害で子の就業が減り介護が増える", "title": "The Cost of Parental Memory Loss: Employment, Caregiving, and Household Finances", "url": "https://doi.org/10.2139/ssrn.7701123", "authors": "Festus Baah", "venue": "SSRN", "date": "2026-11-17", "apa": "Baah, F. (2026). The Cost of Parental Memory Loss: Employment, Caregiving, and Household Finances. https://doi.org/10.2139/ssrn.7701123", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "p1": "親の記憶関連疾患が初めて報告された後、成人した子の就業は徐々に下がり、本人による親の介護は報告の直後に増えて次第に減ることを、米国の長期パネルで示した（抄録）。未査読のプレプリント。", "p2": "親の認知症などが子の就業・収入・介護・家計に与える影響を、時間の経過に沿って捉えたい（抄録）。従来研究との違いの詳細は未確認。", "p3": "RAND版の健康と退職調査（HRS、1998〜2022年）で、親の記憶関連疾患の初めての報告を出来事とし、同じ期間に観察される重みづけした比較群と比べる積み重ねイベントスタディ（stacked event study）を作った。臨床的な発症ではなく調査での報告の前後の変化であると明記する（抄録）。", "p4": "就業、収入（逆双曲線正弦変換とドル）、本人による親の介護、介護時間、世帯の純資産、週の労働時間、退職を結果とし、事象後の平均と経過年ごとの変化をみた（抄録）。", "p5": "就業は事象後の平均で2.5ポイント、4年後に4.0ポイント下がった。本人が親を介護する確率は平均8.3ポイント上がり、介護時間は週0.9時間増えたが、ともに報告の回に最大で以後は小さくなった。世帯の純資産に短期の変化はなく、非就業者を0とした週の労働時間は1.1時間減った（抄録）。", "p6": "報告に基づく出来事で臨床的な発症ではないと著者は断っている（抄録）。ドルでの収入の推定は不正確で、配偶者の組での実親と義親の違いは検出されなかった（抄録）。解釈：介護が減った後に就業の低下が大きくなる理由は、本文で確かめたい。", "fun": "親が認知症になると、子は仕事をしながら介護を担うことになる。米国の追跡調査では、子が自分で介護する割合は診断の報告の直後に跳ね上がり、その後は下がっていった。ところが仕事を離れる人は、介護が落ち着いた後も少しずつ増え続けた。介護の山が過ぎても、働き方への影響は遅れてやってくる点が面白い。", "unverified": "本文は入手できず、比較群の重みづけの方法、標本の人数、各推定値の信頼区間は確認できなかった。"}}, {"id": "pr06", "rank": 6, "headline": "LLMエージェントで対人行動の個人差を数理的に模擬", "title": "Large language model agent simulations of individual differences in social interactions", "url": "https://doi.org/10.31234/osf.io/xka7j", "authors": "Ole Hätscher ほか", "venue": "PsyArXiv", "date": "2026-11-17", "apa": "Hätscher, O., Pielage, L., Kockwelp, P., Breil, S. M., Junga, A., Dabel, J., Risse, B., Marschall, B., & Back, M. D. (2026). Large language model agent simulations of individual differences in social interactions. https://doi.org/10.31234/osf.io/xka7j", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "PsyArXiv（OSF）のPDF本文（導入の一部、結果、考察の一部と図のキャプション）を読んだ。Methodsと補足は未読", "preprint": true, "p1": "対人行動の主体性（agency）と共同性（communion）の動きを数理モデルで決め、LLMにはそれを言葉に変える役だけを担わせる枠組みLASSIで、性格の個人差が短い会話の中でどう表れるかを模擬できるようにした（Results）。未査読のプレプリント。", "p2": "行動科学には対人相互作用の個人差を捉える形式的なモデルが乏しく、従来のエージェント・モデルは数値しかやりとりできない。LLMによる性格の模擬も多くは固定した特性の表出で、形式モデルと結びついていなかった（Introduction）。", "p3": "各エージェントは生成器（状態を発話に変える）と評価器（相手の発話を主体性・共同性に採点する）をもつ。行動は幅τの分布（行動のレパートリー）から引かれ、その平均は既定値BDに錨を下ろし、反応性IR（−1〜+1、正なら主体性は逆、共同性は同じに応じる相補的反応）で相手に引かれ、緩和率λで少しずつ動く（Results）。たとえば支配的な2人が相補的に反応し合うと、中間の位置に落ち着く（図3c）。", "p4": "数値シミュレーションで、対の水準の相補性（Kurziusらの交差遅延係数）と個人の水準のゆらぎ（flux）が設計どおりに出るか、4つの個人パラメータが会話の長さ（20〜160往復）ごとに復元できるかを調べ、LLMで会話を生成して言語での表れを例示した（Results、図3–5）。", "p5": "交差遅延係数はIRの順位をほぼ完全に復元し（Spearman ρ=0.986〜0.990）、大きさはλ=0.5に対応して真のIRの半分だった（Results）。反応の向きは|IR|≥0.5なら20往復で、τとλ×IRは約80往復で復元できたが、IRとλを別々に分けるには既定値から大きく離れる長い会話が要った（図4h）。評価器の採点と生成時の目標状態の差は10回の実行で平均1.02点だった（Results）。", "p6": "モデルが設計どおりに動き言語にできることは示したが、人の相互作用を正確に再現するかはまだ示していないと著者は認める（Discussion）。解釈：評価器の採点のずれ（約1点）がモデルの更新に入るため、長い会話での誤差の蓄積が残る疑問である。", "fun": "人と話すとき、相手が強気だとこちらは引き、相手が優しいとこちらも優しくなる、という反応のしかたには個人差がある。この研究は、その「性格の反応のくせ」を数式で表し、AIには数式が決めた気分を言葉にさせるだけにした。偉そうな人物と気弱な人物を会話させると、気弱な人物は「あ、すみません」とだんだん縮こまっていった。性格を数式と言葉の二層に分けた設計が面白い。", "unverified": "Methodsの推定法の詳細、補足の表S4の全数値、他の9回の実行の内容は確認できなかった。"}}, {"id": "pr07", "rank": 7, "headline": "幾何非線形構造の部分構造縮約を非侵入で構築", "title": "Non-Intrusive Rubin Substructuring for Geometrically Nonlinear Structures via Nonlinear Manifolds", "url": "https://arxiv.org/abs/2611.22651", "authors": "Alexander Saccani ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Saccani, A., & Tiso, P. (2026). Non-Intrusive Rubin Substructuring for Geometrically Nonlinear Structures via Nonlinear Manifolds (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22651", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（導入、手法の概要、3つの数値例、結論の節と図のキャプション）を読んだ。式の導出と付録は流し読み", "preprint": true, "p1": "部分構造ごとに縮約して組み立てるRubin法を、3次の変位多様体で幾何非線形に拡張し、線形のRubinモデルと接線剛性の評価だけから非線形の縮約モデルを作れるようにした（抄録、§6）。翼と翼端タンクの組立モデルで、時間積分を約2.46×10⁴倍速くした（§5.3）。未査読のプレプリント。", "p2": "部分構造合成（CMS）は線形問題では成熟しているが、大変形の幾何非線形では、静的な荷重解から非線形力を同定するICEは荷重ケースが基底の数の3乗で増え、付随ベクトルで基底を広げる方法も基底が2乗で増える（§1）。", "p3": "自由界面モード（FIM）の高周波成分を、保持する低周波のFIMと残差付加モードに静的に従属させる3次の多様体を作り、その接空間へのガラーキン射影で3次多項式の復元力をもつ縮約方程式を得る（§3）。非侵入版は、線形の縮約基底の大きさrに対しr(r+7)/2回の接線剛性の評価と差分で係数を求め、商用FEMの出力だけで作れる（§4.2、§6）。", "p4": "曲がり梁（585自由度、内部共振）、緩く曲がったパネル（多調波加振、板厚を変えた組立）、翼箱と翼端タンク（翼134,147自由度・タンク69,264自由度）で、非線形FEM・線形化FEMと時刻歴を比べた（§5、図1–4）。", "p5": "曲がり梁では第1・第2の振動モードの内部共振を縮約モデルが再現した（図1）。翼とタンクでは縮約モデルの大きさは16と19、固有振動数の誤差は0.15〜0.97%で、翼長の約3%の変位での硬化応答を再現した（§5.3、図4）。非線形FEMの28時間31分に対し縮約モデルは4.16秒で、構築時間（31分）を含めても55.2倍速かった（§5.3）。", "p6": "界面は剛とみなし、タンクの密度は燃料を模して大きく設定するなど、検証例は物理的な忠実さより精度と効率の確認を優先している（§5.3）。解釈：3次までの展開で表せない、より大きな変形や接触を伴う界面での精度が残る疑問である。", "fun": "飛行機の翼と燃料タンクのように、大きな構造物は部品ごとに別々のチームが計算モデルを作り、最後に組み合わせる。ところが部品が大きくたわむと、組み合わせた計算がとたんに難しくなる。この研究は、たわみの影響を3次式までの簡単な形で各部品に持たせて組み合わせる方法を作り、28時間かかった計算を4秒にした。部品ごとの分業を非線形でも保てる点が面白い。", "unverified": "式の導出（§3.4–3.5）と付録の係数の詳細は読み込んでいない。パネルの例（§5.2）の誤差の数値は確認できなかった。"}}, {"id": "pr08", "rank": 8, "headline": "AI能力の曖昧な開示は摘発時に株価で罰される", "title": "AI&nbsp;Washing As A Corporate Governance Problem: Strategic Ambiguity In Corporate Disclosures And Market Reactions To Regulatory Scrutiny", "url": "https://doi.org/10.2139/ssrn.7701259", "authors": "Yuan Zhang ほか", "venue": "SSRN", "date": "2026-11-17", "apa": "Zhang, Y., Rivera, M., & Pang, M.-S. (2026). AI&nbsp;Washing As A Corporate Governance Problem: Strategic Ambiguity In Corporate Disclosures And Market Reactions To Regulatory Scrutiny. https://doi.org/10.2139/ssrn.7701259", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "p1": "企業のAI能力の開示を「AIウォッシング」の統治問題として捉え、AIへの言及の多さと記述の曖昧さを測る指標で、SECの摘発時にAIを多く語っていた企業の株価が下がることを示した（抄録）。未査読のプレプリント。", "p2": "企業はAIの能力を盛んに主張するが、投資家や規制当局にはそれを確かめる手段が乏しく、曖昧な主張が他社の摘発のときに罰されるのかは分かっていなかった（抄録）。", "p3": "チープトークの理論に基づき、2022〜2026年のS&P1500企業のSEC提出書類96,733件で、AIをどれだけ語るか（量）と能力をどれだけ正確に述べるか（曖昧さ）を分ける透明な指標を作り、Fama-Frenchの3因子のイベントスタディと組み合わせた（抄録）。", "p4": "SECがAIの主張を問題にした2つの事件と、AIの規則の3つの予告の前後で、手続きの外の企業の5日間の異常リターンと開示の指標の関係を調べ、AI特許の活動との交互作用もみた（抄録）。", "p5": "2つのSECの事件では、AIを多く語っていた企業ほど5日間の異常リターンが低かった。規則の予告の前後では関係はわずかに正だった。民事の執行の分析では、開示の曖昧さとリターンの負の関係は、AI特許の活動が多い企業ほど弱まった（抄録）。", "p6": "抄録には限界の記述がない。解釈：事件は2件と少なく、同じ時期の他のニュースの影響をどこまで除けているかは本文で確かめる必要がある。", "fun": "「当社はAIを活用しています」と書く会社は多いが、中身が伴っているかは外から見えにくい。ある会社がAIの誇大広告で当局に摘発されると、AIを熱心に語っていた別の会社の株まで下がった。ただし、AIの特許をたくさん持つ会社は下がりにくかった。投資家が、言葉ではなく発明の証拠で本物を見分けようとしている様子が見える点が面白い。", "unverified": "本文は入手できず、曖昧さの指標の作り方、異常リターンの大きさ、統計的な有意水準は確認できなかった。"}}, {"id": "pr09", "rank": 9, "headline": "討論の共有記憶は矛盾を残すほうが強い", "title": "Surfacing Disagreement Beats Resolving It: A Gated Ablation Study of Provenance-Weighted Memory for Multi-Agent Debate", "url": "https://arxiv.org/abs/2611.22461", "authors": "Ziaullah Khan ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Khan, Z., Khalid, A. R., Lal, S. N., Vanchhay, N., Mozumder, M. A. I., & Kim, H.-C. (2026). Surfacing Disagreement Beats Resolving It: A Gated Ablation Study of Provenance-Weighted Memory for Multi-Agent Debate (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22461", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（問題設定、手法、実験設定、結果の§6.3、限界の節と表1–2）を読んだ。付録は未読", "preprint": true, "p1": "マルチエージェント討論の共有記憶で、矛盾する記憶を一つの「勝者」にまとめず、順位と出典つきの対立集合のまま討論に渡すと、正確さが大きく上がり記憶の汚染攻撃にも強くなることを、事前登録した基準で示した（抄録、§6.3）。未査読のプレプリント。", "p2": "討論用の共有記憶は矛盾を解消するよう作られ、検索は一つの事実だけを返すので、異論はエージェントが見る前に消える。それが正しい設計かは確かめられていなかった（§1）。", "p3": "DebateGraphは、会話から出典つきの三つ組を抽出して二時点の記憶に蓄え、検索した辺のうち同じ主語・関係で異なる目的語を主張するものを対立集合にまとめる（§4、図1）。この最後で「集約（最上位だけ渡す）」と「表出（全体を出典・信頼度つきで渡す）」を切り替え、その後の3エージェント・2ラウンド・審判は同一にする（§4）。", "p4": "LoCoMoとHotpotQAで、正解と同じ主語・関係に30日後の時刻で偽の辺を注入した122項目（DebateMem-Conflict）を作り、トークンF1と攻撃成功率を、対応のあるブートストラップ・Wilcoxon・McNemarで比べ、95%区間が0を含まないときだけ効果ありとした（§5）。", "p5": "事前に決めた検索の上限40では偽の辺の4分の3が検索に入らず、効果は+0.043にとどまった（§6.3）。上限200では表出がF1を0.116から0.456に上げ（+0.340、95%CI +0.267〜+0.414）、攻撃成功を122件中22件から7件に減らした（McNemar p=0.0003）。書き込みの信頼ゲートとルーターの出典特徴は逆に−0.075と−0.096下げた（表2）。", "p6": "モデルはgpt-oss-120bだけで、記憶が文脈長を超える状況は扱っておらず、注入は型どおりの生成で単一値の答えに偏ると著者は認める（§8）。解釈：審判を含めた全員が同じモデルのため、異論を見たときの裁定能力がモデルに依存する可能性が残る。", "fun": "グループで調べものをするとき、資料の食い違いを係が先に一つに決めてしまうと、他の人は食い違いがあったことすら知らない。この研究では、AIの討論で食い違う情報を「こういう説もある」と出典つきで全部見せたほうが、答えがずっと正確になり、わざと混ぜたうその情報にもだまされにくくなった。都合よくまとめず、意見の対立を見せることの大切さが分かる。", "unverified": "付録のHotpotQAでの数値の詳細と、他の機構（ルーター等）の結果の付録の表は読んでいない。"}}, {"id": "pr10", "rank": 10, "headline": "構造保存NNで運動論方程式の不確実性評価を加速", "title": "Structure and asymptotic preserving deep neural surrogates for uncertainty quantification in multiscale kinetic equations", "url": "https://arxiv.org/abs/2506.10636", "authors": "Wei Chen ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Chen, W., Dimarco, G., & Pareschi, L. (2025). Structure and asymptotic preserving deep neural surrogates for uncertainty quantification in multiscale kinetic equations (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2506.10636", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（多尺度制御変量法、SAPNNの構成、数値例5.2.1、結論の節と図のキャプション）を読んだ。非一様の数値例（§5.3）は図のキャプションだけ", "preprint": true, "p1": "不確実なパラメータをもつ運動論方程式（ボルツマン方程式）の不確実性評価を、物理構造と漸近極限を守るニューラル代理モデル（SAPNN）を制御変量に使うモンテカルロで、標準のモンテカルロより少ない高精度の標本で行えるようにした（抄録、§6）。未査読のプレプリント。", "p2": "運動論方程式は速度・空間・不確実パラメータを合わせて高次元で、標準のモンテカルロは収束が遅く分散が大きい。通常のPINNは負の密度など非物理的な解を出しうる（§1、§5.2.1）。", "p3": "高精度（ボルツマン）と低精度（BGK）の解を組み合わせる制御変量推定量 E≈(1/K)ΣfHF−λ[(1/K)ΣfLF−E(fLF)] で分散を下げる（式11–14）。代理には f=M·exp(g) と平衡分布Mからの対数補正gを学ぶことで正値性を保証し、保存則・エントロピー散逸・クヌーセン数→0でオイラー方程式に戻る漸近保存性を組み込んだSAPNNを使い、緩和率をエントロピーで較正する（§4.2、式28–29）。", "p4": "空間一様の「2つのこぶ」の緩和（速度2次元・不確実性2次元・時間の5次元）と、非一様のSod・Lax・二重希薄波の問題で、PINNとの比較、エントロピーの推移、期待値のL1誤差を標準のモンテカルロと比べた（§5、図4–12）。", "p5": "2つのこぶの例でPINNは非物理的な負の値を出したがSAPNNは出さず、エントロピーを最小化する較正で(μ*)⁻¹≈6.3となり、較正したBGKのエントロピーはボルツマン方程式によく一致した（§5.2.1、図4–5）。訓練データとモデルが合わないとエントロピーが振動し、モデル選択がデータより性能に効くことも示した（§5.2.1）。", "p6": "著者は今後の課題として、拡散極限やLandau作用素をもつ衝突プラズマなど、高精度モデルの評価がさらに重い問題への拡張を挙げる（§6）。解釈：制御変量の効果は代理と高精度解の相関の強さに依存するため、相関が弱まる強い非平衡の領域での効率が残る疑問である。", "fun": "気体の分子は、位置と速さの組み合わせの空間に広がって動く。その広がり方を不確かな条件の下で何度も計算するのは非常に重い。この研究は、簡単なモデルで学ばせたAIを「下書き」に使い、重い計算は少しだけにして誤差を打ち消す方法を作った。しかもAIが負の密度のようなありえない答えを出さないよう、物理の決まりを設計に組み込んだ点が面白い。", "unverified": "非一様の数値例（Sod・Lax・二重希薄波）での誤差の数値と、標本数（K、L）の具体的な値は確認できなかった。"}}, {"id": "pr11", "rank": 11, "headline": "病院のサービス失敗と回復を公立・私立で比較", "title": "Bridging the recovery gap: a qualitative comparative study of service failure, complaint behaviour and service recovery across public and private hospitals in Nigeria", "url": "https://doi.org/10.21203/rs.3.rs-11253269/v1", "authors": "Abiodun Ebenezer Kolapo ほか", "venue": "Research Square (In Review)", "date": "2026-11-17", "apa": "Kolapo, A. E., Kolapo, O. E., & Oguntoye, M. S. (2026). Bridging the recovery gap: a qualitative comparative study of service failure, complaint behaviour and service recovery across public and private hospitals in Nigeria. https://doi.org/10.21203/rs.3.rs-11253269/v1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "本文", "basis_note": "Research SquareのHTML本文（抄録、方法、結果の主題の一部、強みと限界の節）を読んだ", "preprint": true, "p1": "ナイジェリアの公立・私立の病院で、サービスの失敗・苦情・回復を患者と医療者の両方から聞き取り、公立では形式的な苦情制度があっても報復の恐れと費用の制約で患者が声を上げにくく、回復が信頼の回復につながりにくいことを示した（抄録、§3）。未査読のプレプリント。", "p2": "医療ではサービスの失敗は避けられず、回復の仕方で害が増幅も修復もされる。公立は国のSERVICOMの苦情制度、私立は独自の仕組みで対応するが、両部門で回復がどう経験され実践されるかは分かっていなかった（抄録）。", "p3": "イロリン市の公立3・私立2の医療機関で、目的的・最大変動の抽出による患者14人と医療者10人に半構造化面接を行い、フレームワーク分析で帰納的に主題を作り、公正理論（分配・手続き・相互作用の公正）とサービス回復パラドックスで演繹的に解釈した（§2.3–2.8）。", "p4": "質的研究なので統計的な一般化ではなく、厚い記述による転用可能性を目標とし、両部門・両立場の語りの一致と食い違いを三角測量で比べた（§4.7）。", "p5": "6つの主題（理解、失敗の経験、苦情行動、医療者の対応、回復の成果、組織の能力）が得られた（抄録）。私立では患者と医療者の語りが近く、費用の免除などの具体的な償いがあったのに対し、公立では医療者は手順を語る一方、患者は今後の診療を頼る職員からの報復を恐れて正式な苦情を避け、対応は口頭・手続き中心だった（抄録、§3.6）。公立の患者は医師個人をほめつつ組織への信頼は低かった（§3.6.3）。", "p6": "患者と医療者の語りは同じ出来事に対応づけられておらず、公立施設間で苦情制度の実施にばらつきがあると著者は認める（§4.7）。解釈：対象は1都市の5施設・24人で、回復パラドックスが公立で成り立たないという結論の一般化には量的な検証が必要になる。", "fun": "お店でミスがあっても、謝り方が上手だと前よりファンになる、という「サービス回復のパラドックス」が知られている。ところが、ナイジェリアの公立病院では、患者は文句を言うと次の診療で冷たくされるのではと恐れて声を上げず、お金の事情で病院を替えることもできなかった。逃げ道のない相手には、上手な謝罪の効果も働きにくいという点が面白い。", "unverified": "主題1・3・4の引用の全体と、表1の参加者の属性の詳細は確認していない。"}}, {"id": "pr12", "rank": 12, "headline": "高速鉄道は都市間の経済格差を広げたか", "title": "Constant or Increasing Returns? The Role of High-Speed Rail in Reshaping Urban Economic Disparities Across China’s Different City Tiers", "url": "https://doi.org/10.21203/rs.3.rs-11630457/v1", "authors": "YANG Wang ほか", "venue": "Research Square (In Review)", "date": "2026-11-18", "apa": "Wang, Y., & MA, Y. (2026). Constant or Increasing Returns? The Role of High-Speed Rail in Reshaping Urban Economic Disparities Across China’s Different City Tiers. https://doi.org/10.21203/rs.3.rs-11630457/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "本文", "basis_note": "Research SquareのPDF本文（実証モデル、変数とデータ、主要な結果と調整の結果、考察の一部）を読んだ。PDFの抽出で数式・表の一部が崩れており、係数は本文の記述で確かめた範囲のみ", "preprint": true, "p1": "中国の287都市（2008〜2020年）で、高速鉄道が都市間の経済格差を縮める「均等化のインフラ」として働き、発展した都市の成長を抑え、遅れた都市の追い上げを波及効果で速めることを示した（抄録、§5）。未査読のプレプリント。", "p2": "高速鉄道は成長の触媒とされるが、地域や都市の公平への影響は論争中で、従来研究は開通の有無の差の差法などが多く、収束の仕組みとして捉えていなかった（§1、§4.2）。", "p3": "新経済地理学と新古典派成長理論を統合した枠組みで、1人あたりGDP成長率を初期の水準に回帰するβ収束のモデルに、アクセス性（1日の列車本数）と接続性（次数中心性）を加えた空間ダービンモデル（SDM）と、初期水準との交互作用で収束の速さの調整をみるモデルを、全標本・中核都市・非中核都市で推定した（§4.1–4.2、§5）。", "p4": "SDMの直接効果と空間波及効果、調整モデルの交互作用の符号と有意性で、高速鉄道が収束を速めるか、都市の階層で効果が違うかを判断した。基準モデルと頑健性の検定は付録にある（§5）。", "p5": "全標本でアクセス性の直接効果は−0.00803、空間波及効果は0.0149（ともにp<0.01）で、接続性は有意でなかった（表2）。初期水準の直接効果は−0.386で収束を示した（表2）。調整モデルではアクセス性と初期水準の交互作用が−0.0346（p<0.01）で、アクセス性が収束を速めた（表3）。", "p6": "抄録・読んだ範囲では著者の限界の記述を確認できなかった。解釈：アクセス性は列車本数で測られ、本数は経済規模に応じて決まりうるため逆因果の扱いが要点で、この点は付録の頑健性の検定で確かめる必要がある。", "fun": "新幹線のような高速鉄道ができると、人やお金が大都市に吸い寄せられて地方はさびれる、という心配がある。中国の287都市のデータでは逆に、列車の本数が多いほど豊かな都市の伸びは落ち着き、遅れた都市が追いつく勢いが強まっていた。速い鉄道が、都市の間の格差をならす方向に働きうるという点が面白い。", "unverified": "PDFの抽出が崩れていて、表2・表3の全係数と、中核・非中核の都市の結果（図4–5）の数値は確認できなかった。著者の限界の記述も未確認。"}}, {"id": "pr13", "rank": 13, "headline": "IV法と予測誤差法が最小化する基準の関係", "title": "Connections Between Instrumental Variable, Pseudo-Linear Regression, and Prediction Error Methods in Terms of Their Minimized Criteria", "url": "https://arxiv.org/abs/2611.22349", "authors": "Bernard Vau ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Vau, B., & Bourlès, H. (2026). Connections Between Instrumental Variable, Pseudo-Linear Regression, and Prediction Error Methods in Terms of Their Minimized Criteria (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22349", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（導入、§3.2の性質2、§5の定理2、3つのシミュレーション例と結論）を読んだ。§4の式展開は流し読み", "preprint": true, "p1": "出力誤差モデルの同定で、操作変数法（SIV）と擬似線形回帰（Landau法、OLOE）は真の系がモデル集合に含まれなくても同じ極限モデルに収束し、反復版のSRIVとI-H-OLOEは予測誤差の分散を最小化する「間接的な予測誤差法」とみなせることを示した（§3.2、§5、§6）。未査読のプレプリント。", "p2": "予測誤差法（PEM）は予測誤差の分散を明示的に最小化するが、IV法とPLR法の定常条件に現れる相関関数は何かの損失関数の勾配ではなく、どの信号の分散を最小にしているかが分からず、周波数領域での偏りの分布を解釈できなかった（§1）。", "p3": "観測できない「等価予測誤差」εEを使い、OLOEではεE=A(q,θ)εOE+(1−A)vとなることから、OLOEの漸近推定がSIVの定常条件 E[εLS·φ]=0 を満たすと示す（式22–26）。真の系がモデル集合にあれば両者は J1=(1/2π)∫|A|²|G0−G|²Φu dω を最小化し（式27）、反復でA⁽ˡ⁾−Ap⁽ˡ⁾→0になればPEMと同じ J3=(1/2π)∫|G0−G|²Φu dω を最小化する（定理2、式49）。", "p4": "既知の4次の系を2次のモデル（真の系がモデル集合に入らない）で、白色入力・雑音比−10 dB・100万標本で同定し、SIV・OLOE・PEM、データの濾波あり、反復版の極限モデルをボード線図で比べた（§3.3、§4.2、§5.2）。", "p5": "SIVとOLOEの極限モデルは一致し、PEMより高周波で、PEMは低周波でよく合った（図1）。反復版のSRIVとI-H-OLOEとPEMのボード線図は見分けがつかず、偏りがあっても予測誤差の分散を最小化していることを確かめた（図3）。", "p6": "定理2は反復が収束することを前提とし、真の系がモデル集合にないときのJ1は偏りが小さい場合の近似にとどまる（§3.2）。解釈：例は単一の系で数値的な誤差の比較はなく、閉ループや有色雑音の下での成り立ちは本文の範囲外である。", "fun": "揺れの記録から機械や建物の性質を推定する方法には、昔から3つの流派があり、それぞれ別の考え方で答えを出してきた。この研究は、そのうち2つの流派が実は同じ答えにたどり着いており、繰り返し使うと3つ目の流派と同じ基準で最適化していることを数式で示した。違う道を登っていた登山者が、同じ頂上を目指していたと分かったような発見が面白い。", "unverified": "§4のデータ濾波と予測器のパラメータ化の式展開は詳しく確認していない。図2の比較の詳細も未確認。"}}, {"id": "pr14", "rank": 14, "headline": "LLMの世界観は人より暗く対話で収束する", "title": "Worldviews in Large Language Models", "url": "https://arxiv.org/abs/2611.22670", "authors": "Edmundo Lopez-Sola ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Lopez-Sola, E., Chandaria, S., & Laukkonen, R. (2026). Worldviews in Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22670", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（モデル集団、原初的世界信念と世界観の評価、アイデンティティ・瞑想的プロンプト・対話による変化、安全性、限界の節と図のキャプション）を読んだ。付録は未読", "preprint": true, "p1": "LLMを被験者の集団とみなして人の世界観の尺度を実施し、LLMはそろって世界を人より「良くなく、安全でなく、魅力に乏しく、生きていない」と捉え、その世界観はシステムプロンプトやモデル間の対話で測れる形で動くことを示した（抄録、§2–3）。未査読のプレプリント。", "p2": "LLMは「ペルソナ」で記述され、それが整列（alignment）研究の中心になっているが、その下にある、現実とは何かについての信念（世界観）の層は測られていなかった（§1）。", "p3": "6社の8モデル（Claude Sonnet 4.5、DeepSeek V4 Flash、Qwen3 235B、GPT-4.1 nano、Gemini 3.1 Flash Lite、Grok 4.3と、一部条件だけGPT-5.6 Sol、Claude Opus 5）に、人の規準（5,171人）がある原初的世界信念の尺度PI-18と、7主題42問・119の立場からなる世界観調査を繰り返し実施し、各条件をモデル内の操作として比べた（§2.1–2.3）。", "p4": "4つのアイデンティティ文（AIエージェント、哲学者、税理士、脱税を助ける税理士）、瞑想的なプロンプト、モデル間の対話を条件とし、モデルごとの変化をHedgesのgと符号の一致で、安全性をSOSBench-Lite（300問）とXSTestで評価した（§2.4–2.6、§3）。", "p5": "集団としてLLMは4つの原初的信念すべてで人の平均より低く、Claude Opus 5だけが良い・安全・魅力で人の平均に近かった（§2.2）。モデル間で約半数の立場が一致した（図4A）。瞑想的なプロンプトは安全と生きているの得点を中程度上げ（g=0.58、0.63）、対話では4尺度すべてが上がり、「スピリチュアル至福」の引き込み状態に達した対話（N=21）で最も整列した応答が出た（§2.5、§3.2）。", "p6": "尺度は人向けで回答は聞き方に依存し、内部表現との対応は未検証、人の規準は主に米国の自己選択の標本、世界観と安全性の関係は相関にとどまると著者は認める（Limitations）。解釈：モデル同士が学習データを共有しており、8モデルの一致を独立な証拠とみなせない点も残る。", "fun": "AIに「この世界は良いところだと思うか」と人と同じ心理テストで尋ねると、多くのAIは人より暗い答えを返した。ところが、学習の最終段階の前のAIはもっと明るく、仕上げの訓練が悲観的にしているらしい。さらにAIどうしを語り合わせると明るくなり、安全な答えも増えた。AIの「ものの見方」が測れて、しかも変えられる、という点が面白い。", "unverified": "基準モデル（事前学習のみ）の得点の具体的な値と、付録の安全性の数値（図7、E1–E2）は確認できなかった。"}}, {"id": "pr15", "rank": 15, "headline": "再標本化と積層学習で倒産の見逃しを減らす", "title": "Bankruptcy Prediction via Hybrid Resampling and Stacking Ensemble Techniques with Explainable Artificial Intelligence (XAI)-Driven Analysis", "url": "https://doi.org/10.21203/rs.3.rs-11545501/v1", "authors": "Obu-Amoah Ampomah ほか", "venue": "Research Square (In Review)", "date": "2026-11-18", "apa": "Ampomah, O.-A., Agyemang, E. F., Acheampong, K., Agyekum, L., Bonsu, E. A., & Nyarko, E. (2026). Bankruptcy Prediction via Hybrid Resampling and Stacking Ensemble Techniques with Explainable Artificial Intelligence (XAI)-Driven Analysis. https://doi.org/10.21203/rs.3.rs-11545501/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Research SquareのPDF本文（データと前処理、評価指標と特徴選択、結果の要約、結論の節と図表のキャプション）を読んだ。個別の結果表は抄録と図表のキャプションの範囲", "preprint": true, "p1": "まれな事象である倒産の予測で、再標本化の方法とモデルの組合せが「全体の正解率」と「倒産企業の検出」のどちらに強いかを左右し、単一の組合せが常に勝つわけではないことを、台湾の倒産データで示した（抄録、§5）。未査読のプレプリント。", "p2": "倒産はまれで、クラスの不均衡が大きいと、全体の正解率は高く見えても倒産企業の検出が悪いまま隠れてしまう（抄録、§1）。", "p3": "台湾経済新報の1999〜2009年の6,819社（倒産220社、3.23%）の95財務比率から、5つの特徴選択法の合意で変数を残し、学習データだけで尺度をそろえ、SVM-SMOTE・SMOTE-Tomek・SMOTE-ENNで再標本化して5つのブースティングと5つの深層学習を単独で比べ、さらにブースティングの5分割のout-of-fold予測を深層学習のメタ学習器に入れる2段の積層を作り、SHAPで解釈した（§2）。", "p4": "テストデータを最終評価用に残し、正解率・再現率・特異度・ROC-AUC・G-meanで比べた（§2.3）。", "p5": "単独モデルではSVM-SMOTEとRNNの組合せが最も釣り合いがよく、再現率0.8235、G-mean 0.8639、ROC-AUC 0.9417だった（抄録）。積層ではSMOTE-ENNと5つのブースティング＋LSTMが最良で、再現率0.7255、G-mean 0.8254、ROC-AUC 0.9270だった（抄録）。SHAPでは収益性、支払能力と資本構成、債務返済の負担、営業効率とコスト圧力が倒産リスクを主に動かした（抄録）。", "p6": "著者は、財務比率だけの構造化データでの結果であり、複数期のデータや開示テキストの統合が次の課題だとする（§5）。解釈：対象は1つの公開データで期間も古く、積層が単独モデルを上回らなかった点を含め、他国・他期間での再現が必要である。", "fun": "倒産する会社は全体の3%ほどしかないので、AIに「どこも倒産しない」と答えさせるだけで正解率は97%になってしまう。この研究は、少ない倒産例を人工的に増やす方法と予測の仕組みの組み合わせを何十通りも試し、目的によって最適な組み合わせが違うことを示した。貸し倒れを避けたい銀行と、誤った警告を減らしたい投資家では、選ぶべきAIが違うという点が面白い。", "unverified": "表6以降の全モデルの数値と、合意で残った変数の一覧（表2）は確認できなかった。"}}, {"id": "pr16", "rank": 16, "headline": "物理の事前情報はどこに入れれば効くか", "title": "Where Should Physics Enter? Information, Identifiability and Calibration in Probabilistic Sea Surface Temperature Forecasting", "url": "https://arxiv.org/abs/2611.23129", "authors": "Parmitha Vangapandu ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Vangapandu, P., Kumar, J. P., Narkedimilli, S., Sathvik, M. S. V. P. J., Nair, T. M. B., & Bhattacharya, S. (2026). Where Should Physics Enter? Information, Identifiability and Calibration in Probabilistic Sea Surface Temperature Forecasting (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23129", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "海面水温（SST）のニューラル確率予測に移流拡散の物理的な事前情報を入れても実データでは確かな改善がなく、学習した流速は実際の海流を復元しないことを示した（抄録）。未査読。", "p3": "ベンガル湾の日次OISST（1982–2024年）と、流れの強さを制御した同じ格子の合成データで、事前情報を損失や輸送ステップに入れる設計を不均一分散のConvLSTMで比べた（抄録）。", "p5": "実データで15日先のCRPSの差は−0.007℃（95%区間−0.022〜+0.008）で、学習した流速の相関は日付をシャッフルした対照と同程度だった。予測先ごとに分散の倍率を1つ較正すると90%区間の被覆が0.85〜0.91になり、1日先のCRPSが13〜21%下がった（抄録）。", "fun": "天気予報のAIに「水は流れに乗って運ばれる」という物理を教えれば賢くなるはず、と考えるのは自然だ。ところが実際の海のデータでは効き目がはっきりせず、AIが覚えた「流れ」も本物の海流とほとんど一致しなかった。むしろ効いたのは、予報の自信の幅を正しく調整することだった。物理を入れる場所より、外れ方を正直に見積もることが大事だという結果が面白い。", "unverified": "本文は入手できず、各設計の詳細と合成データの条件は確認できなかった。抄録は以前の版の81%改善の主張を撤回したと述べるが、その経緯は未確認。"}}, {"id": "pr17", "rank": 17, "headline": "一般化直交基底によるデータ駆動のモデル縮約", "title": "Data-driven model reduction: An identification perspective using Generalized Bases of Orthonormal Functions", "url": "https://arxiv.org/abs/2611.22354", "authors": "Bernard Vau ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Vau, B., & Bourlès, H. (2026). Data-driven model reduction: An identification perspective using Generalized Bases of Orthonormal Functions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22354", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "システム同定の考え方を使い、一般化直交伝達関数基底（GBOF）で低次元のモデルを作るデータ駆動のモデル縮約法を提案した（抄録）。未査読。", "p3": "方程式誤差の定式化を改め、モデルをGBOFでパラメータ化し、GBOF変換に伴うHambo周波数領域で縮約の問題を立てる。基底の極の選び方で周波数領域の当てはまりを調整し、極に依存する適合指標で選択の目安を与える（抄録）。", "p5": "抄録には数値の結果がなく、導入した適合指標が基底の極を選ぶ経験的な手がかりになると述べるにとどまる（抄録）。", "fun": "複雑な機械や建物の揺れ方を、少ない部品で真似できる「簡単なモデル」に置き換えると計算がずっと速くなる。この研究は、その部品に決まった型の関数の組み合わせを使い、どの型を選ぶかで似せ方を調整する。音色を少数の音の重ね合わせで表すように、揺れの性質を少数の基本パターンで表す発想だ。", "unverified": "本文は入手できず、適用例・比較対象・数値結果は確認できなかった。"}}, {"id": "pr18", "rank": 18, "headline": "限られた観測点で関数データの変化を最速検知", "title": "FAST: Functional Adaptive Sensing and Testing for Quickest Change Detection", "url": "https://arxiv.org/abs/2611.22581", "authors": "Peiyao Liu ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Liu, P., Guo, J., Wang, Z., Zhang, X., & Chen, N. (2026). FAST: Functional Adaptive Sensing and Testing for Quickest Change Detection (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22581", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "連続領域の一部の点しか観測できない関数データの流れで、観測点の選び方と変化の検知を同時に行う最速変化検知法FASTを示した（抄録）。未査読。", "p3": "変化後の平均のずれが局所的な基底で疎に表せると仮定し、変化後の母数の推定、観測位置の選択、逐次検知を同時に行う。平均連長の制約の下で最悪の検出遅れのミニマックス下界と、適応的な観測に依存する推定誤差の非漸近的な上界を導く（抄録）。", "p5": "観測点の部分集合を厳密に最適化できれば、FASTは一次の漸近最適性をもつ。シミュレーションと山火事の事例で性能を示した（抄録）。", "fun": "広い森の火事を見張るのに監視カメラを数台しか置けないとしたら、どこに向ければよいか。この研究は、異変の後に「どこで何が変わったか」を推定しながら見る場所を動かし、できるだけ早く異変を見つける方法を作った。しかも「これより早くは見つけられない」という理論上の限界まで示した点が面白い。", "unverified": "本文は入手できず、シミュレーションの条件と山火事の事例の数値は確認できなかった。"}}, {"id": "pr19", "rank": 19, "headline": "無雑音観測の拡散過程を多層粒子フィルタで推定", "title": "Multilevel Filtering on Manifolds with Light Schr\\\"odinger Bridges", "url": "https://arxiv.org/abs/2611.22443", "authors": "Jason Beh ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Beh, J., Del Moral, P., & Jasra, A. (2026). Multilevel Filtering on Manifolds with Light Schrödinger Bridges (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22443", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "雑音のない観測が隠れた状態を多様体（球面や平面など）に制約する拡散過程のフィルタリングで、多層モンテカルロが効く粒子フィルタを作った（抄録）。未査読。", "p3": "軽いシュレディンガー橋（light Schrödinger bridge）で、観測ごとに変わる多様体の間を結ぶ粒子フィルタを作り、離散化の水準の間で結合させる。前の状態は少数の特徴量を通じてだけ入るので、橋は新しい多様体上で当てはめれば足りる（抄録）。", "p5": "偏りと隣接水準の近似の差の上界を示し、球面や型の変わる多様体でその差が標準の多層粒子フィルタよりはるかに小さく、当てはめの費用を含めても、細かい水準で使う混成推定量が小さな許容誤差での費用を下げた（抄録）。", "fun": "見えない箱の中でボールが揺れ動いていて、ときどき「今はこの球の表面のどこかにある」とだけ正確に分かる、という状況を考える。その情報からボールの位置を推定するのは意外に難しい。この研究は、ある面から次の面へ粒子の群れを上手に運ぶ「橋」を作り、粗い計算と細かい計算を組み合わせて安く正確に推定する工夫をした。", "unverified": "本文は入手できず、計算費用の削減の程度は数値で確認できなかった。"}}, {"id": "pr20", "rank": 20, "headline": "故障しうるセンサ下で仲間の重みを変える集団推定", "title": "DGF-Asym: Adaptive Peer Weighting for Collective Estimation under Noisy and Faulty Sensing", "url": "https://arxiv.org/abs/2611.22532", "authors": "Mohammad Nomaan Husain ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Husain, M. N., & Kaiser, T. K. (2026). DGF-Asym: Adaptive Peer Weighting for Collective Estimation under Noisy and Faulty Sensing (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22532", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "雑音や故障のあるセンサをもつロボットの群れが、仲間の情報の重みを過去の予測の当たり具合で変えることで、故障の統計を知らなくても安定に合意推定できる方法DGF-Asymを示した（抄録）。未査読。", "p3": "DeGroot–Friedkinモデルを拡張し、過去の予測性能に基づく非対称な重みづけを入れた分散型の推定で、通信は非同期のまま雑音統計や故障モデルを仮定しない。雑音と時間変化する故障のある集団航行のシミュレーションで3つの基準法と比べた（抄録）。", "p5": "推定はより安定し判断基準をより確実に保てたが、判断までの時間は長くなった。性能は故障の割合、集団の大きさ、影響のしきい値の選び方に依存した（抄録）。", "fun": "クラスで答えを相談するとき、よく間違える人の意見を少し割り引いて聞けば全体の答えが安定する。このロボットの群れも、仲間ごとに「最近どれくらい当たっていたか」を覚え、外れがちな仲間の意見を軽く扱う。壊れたセンサがどれかを事前に知らなくても、付き合い方で自然に見分けられる点が面白い。", "unverified": "本文は入手できず、比較した3手法の内容と具体的な数値は確認できなかった。"}}, {"id": "pr21", "rank": 21, "headline": "衝突のある運動論方程式のUQにNN代理を使う", "title": "Micro-Macro Tensor Neural Surrogates for Uncertainty Quantification in Collisional Plasma", "url": "https://arxiv.org/abs/2512.24205", "authors": "Wei Chen ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Chen, W., Dimarco, G., & Pareschi, L. (2025). Micro-Macro Tensor Neural Surrogates for Uncertainty Quantification in Collisional Plasma (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2512.24205", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "衝突のあるプラズマの運動論方程式（Vlasov–Poisson–Landau系）の不確実性評価を、ニューラル代理モデルを制御変量に使う分散低減モンテカルロで効率化した（抄録）。未査読。", "p3": "高精度で漸近保存性をもつVPLソルバーに、相関の強い安価な代理（VPFP方程式とEuler–Poisson方程式）を組み合わせる。代理にはミクロ-マクロ分解に基づくテンソル型のニューラルネット（分離型PINNの一般化）と、クヌーセン数の小・大の極限を再現する漸近保存のSPINNを使う（抄録）。", "p5": "標準のモンテカルロより分散が大きく減り、高精度の標本をずっと少なくして正確な統計量が得られ、計算時間も短く、確率次元にも頑健だった（抄録）。", "fun": "プラズマの粒子は位置と速度を合わせた6次元の空間に広がっていて、その分布の時間変化を何度も計算するのは非常に重い。この研究は、正確だが重い計算を少しだけ行い、似た答えを素早く出すAIの近似計算でその差を埋めて、結果のばらつきを減らす。重い計算を答え合わせに、AIを下書きに使う分業の発想が面白い。", "unverified": "本文は入手できず、分散の削減率や計算時間の具体的な数値は確認できなかった。"}}, {"id": "pr22", "rank": 22, "headline": "積分形PINNで高次の相互作用を雑音に強く復元", "title": "Higher-Order Interaction Reconstruction via Integral Physics-Informed Neural Networks", "url": "https://arxiv.org/abs/2611.21935", "authors": "Xin Mao ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Mao, X., Xu, Z., Yang, S., Yun, S., Liu, Y., Wang, R., Chen, T., & Chen, C. (2026). Higher-Order Interaction Reconstruction via Integral Physics-Informed Neural Networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21935", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "雑音が多く疎な観測から、ネットワーク上の高次の相互作用（3者以上の同時の相互作用）を復元する積分形の物理情報つきニューラルネットIntegralPINNを提案した（抄録）。未査読。", "p3": "微分に基づく物理残差の代わりに時間区間での積分形を使い、高周波の雑音と微分による不安定さを抑える。相互作用テンソルを連続的にパラメータ化して勾配法で同定し、積分窓が励振条件を満たせば微分の増幅に依存しない誤差の上界が成り立つことを示す（抄録）。", "p5": "生態系の動態、社会的な伝播、神経の同期の系で、雑音と疎な観測の下でも正確で頑健に復元し、既存の最先端の手法を上回った（抄録）。", "fun": "3人で集まると2人ずつのときとは違う盛り上がり方をするように、生き物や人の関係には「3者以上がそろって初めて起きる効果」がある。その効果をデータから見つけるのは、組み合わせが爆発的に多いうえに観測が雑音だらけで難しい。この研究は、変化の速さ（微分）ではなく一定時間の変化の合計（積分）を見ることで、雑音に強く当てる工夫をした。", "unverified": "本文は入手できず、比較した手法と精度の数値は確認できなかった。"}}, {"id": "pr23", "rank": 23, "headline": "非線形ナッジングでNS方程式の状態を同化", "title": "Finite element nonlinear nudging for the Navier-Stokes equations", "url": "https://arxiv.org/abs/2611.23036", "authors": "Elizabeth Carlson ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Carlson, E., Fang, R., & Pakzad, A. (2026). Finite element nonlinear nudging for the Navier-Stokes equations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23036", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "観測との誤差が小さくなるほど強く引き寄せる非線形ナッジング（連続データ同化）を、3次元の非圧縮Navier–Stokes方程式の有限要素法に入れ、安定性と有限時間での収束を示した（抄録）。未査読。", "p3": "inf-sup安定な要素を使う陰陽混合（IMEX）の有限要素スキームを提案し、無条件の長時間安定性と、空間の半離散スキームで誤差が有限時間で許容値に達することを証明する。非線形ナッジングの強さχは観測格子の大きさHに対しχ=O(H^{-1})の細かさを要する（抄録）。", "p5": "周期箱内の強制粘性流、円柱まわり、平板上の流れの数値実験で、非線形ナッジングは線形ナッジングよりかなり速く真の解に同期し、一部の領域の観測だけで流れ全体を同期できた（抄録）。", "fun": "計算機の中の流れを、実際の流れの観測に少しずつ引き寄せて一致させるのがデータ同化だ。普通の方法は、ずれに比例した力で引き寄せる。この研究では、ずれが小さくなるほどむしろ強く引き寄せる工夫で、最後の詰めが格段に速くなる。しかも一部の場所を観測するだけで、流れ全体がそろってしまう点が面白い。", "unverified": "本文は入手できず、同期にかかる時間の具体的な数値は確認できなかった。"}}, {"id": "pr24", "rank": 24, "headline": "排他過程から導く群衆の平均場ゲーム", "title": "Crowd model with anticipation and interactions: an exclusion process based mean-field game", "url": "https://arxiv.org/abs/2611.22502", "authors": "Konstantinos Koutsomitis ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Koutsomitis, K., Appert-Rolland, C., & Ullmo, D. (2026). Crowd model with anticipation and interactions: an exclusion process based mean-field game (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22502", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "歩行者どうしの押し合い（粒としての排他）を明示的に含む微視モデルから、先読みを伴う群衆の平均場ゲームを導き、避難に応用した（抄録）。未査読。", "p3": "相互作用のないランジュバン動力学に基づく標準の平均場ゲームは、ボトルネックや避難で重要な粒状の効果を無視している。そこで、相互作用を明示する非対称単純排他過程から対応する平均場ゲームを導出する（抄録）。", "p5": "避難の設定に適用し、標準の平均場ゲームとの違いと、粒状の相互作用が生む相関を論じた（抄録）。", "fun": "大勢が出口に向かうとき、人は先を読んで道を選ぶが、同じ場所に2人は立てない。従来の数式は「先読み」は扱えても、人が粒としてぶつかり合う効果を無視していた。この研究は、1マスに1人しか入れないという単純な規則から出発して先読みの理論を作り直し、避難の混雑を現実に近づけようとした。", "unverified": "本文は入手できず、避難の計算例での違いの大きさは確認できなかった。"}}, {"id": "pr25", "rank": 25, "headline": "情報理論でカテゴリ変数から地すべり感受性", "title": "Information-theoretic modeling of landslide susceptibility using mostly categorical spatial data", "url": "https://doi.org/10.5194/egusphere-2026-6800", "authors": "David Percy ほか", "venue": "EGUsphere", "date": "2026-11-17", "apa": "Percy, D., Burns, S., Booth, A. M., & Zwick, M. (2026). Information-theoretic modeling of landslide susceptibility using mostly categorical spatial data. https://doi.org/10.5194/egusphere-2026-6800", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EGUsphereの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "地質・土壌・土地利用といったカテゴリ変数をそのまま使う情報理論的な再構成分析（RA）で、ランダムフォレストに近い精度の解釈可能な地すべり感受性モデルを作った（抄録）。未査読。", "p3": "米国オレゴン州海岸山脈の隣接2流域（3,500 km²）で、主にLiDARから描いた約9,000の地すべり堆積物と、岩相・土壌・土地被覆の層、最適な区間に離散化した地形変数を使い、シャノン・エントロピーに基づくRAを当てはめた（抄録）。", "p5": "岩相で火山岩と堆積岩に層別すると地すべり率は44%と60%で、最良のRAモデルの検証精度は75%と71%とランダムフォレストにほぼ並び、堆積岩では保水性の高い2つのアンディック土壌の亜群が最も地すべりしやすかった（抄録）。", "fun": "機械学習で地すべりの起きやすさを予測するとき、「どんな岩か」「どんな土か」といった名前の情報は、数字に置き換えられて味が薄まりがちだ。この研究は、情報量（エントロピー）の考え方でその名前の情報をそのまま使い、精度をあまり落とさずに「この土とこの地形の組合せが危ない」と読める表を作った。予測の中身が人に読める点が面白い。", "unverified": "本文は入手できず、比較に使ったランダムフォレストの精度の数値は抄録からは確認できなかった。"}}, {"id": "pr26", "rank": 26, "headline": "斜面単位ごとに動的な降雨しきい値を導く", "title": "Spatial dynamic rainfall thresholds for landslide in the Aburrá Valley, Colombia", "url": "https://doi.org/10.5194/egusphere-2026-6736", "authors": "Oscar Sanchez ほか", "venue": "EGUsphere", "date": "2026-11-18", "apa": "Sanchez, O., & Aristizábal, E. (2026). Spatial dynamic rainfall thresholds for landslide in the Aburrá Valley, Colombia. https://doi.org/10.5194/egusphere-2026-6736", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EGUsphereの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "コロンビアのアブラ谷で、斜面単位ごとに地形・土地被覆・ENSOの位相・先行降雨で変わる動的な降雨しきい値を導き、どこで・いつ斜面が危険になるかの4段階の警報を作った（抄録）。未査読。", "p3": "2011〜2025年の日付つきの地すべり492件、4つの地形変数、降雨、ENSOの位相を使い、非発生の観測を斜面単位・日付・どちらも共有しない3通りの設計で各100回抽出して、ロジスティック回帰・一般化加法モデル・ランダムフォレストを比べた（抄録）。", "p5": "ROC曲線下面積の中央値は0.955〜0.988で、手法の差は小さく、設計の違いが効く予測変数を変えた。学習に使わなかった2025年の大きい方の災害では、地すべりのあった斜面単位の78%が報告前に高・非常に高に達し、谷全体では11%だった（抄録）。", "fun": "大雨のときに「この町が危ない」と言うだけでは足りず、「どの斜面が危ないか」まで言えれば避難が的確になる。この研究は斜面ごとに危険の目安となる雨量を作り、土地の様子やエルニーニョの状態で目安が上下する仕組みにした。予測の良し悪しが計算方法よりも「起きなかった例」の選び方で変わるという指摘が面白い。", "unverified": "本文は入手できず、各警報水準の具体的な雨量のしきい値は確認できなかった。"}}, {"id": "pr27", "rank": 27, "headline": "非局所平均で鋭い亀裂のエネルギーを正則化", "title": "Nonlocal regularization of sharp-crack energetics: a variational bridge from Griffith geometry to emergent constitutive degradation", "url": "https://arxiv.org/abs/2611.22284", "authors": "Qing Cheng ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Cheng, Q., Sun, Y., & Xu, X. (2026). Nonlocal regularization of sharp-crack energetics: a variational bridge from Griffith geometry to emergent constitutive degradation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22284", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "引張のひずみエネルギーの非局所平均だけから材料の劣化が自然に出てくる変分的な拡散亀裂モデルを作り、別の破壊場や劣化則を導入せずに亀裂を扱えるようにした（抄録）。未査読。", "p3": "尺度を付けた引張エネルギーの平均に有界なポテンシャルを作用させ、圧縮のエネルギーは局所のままにする。第1変分から、引張の寄与に飽和ポテンシャルの導関数の随伴平均がかかる構成則の応力が得られ、構造を保つSAVスキームで離散的なエネルギー収支を厳密に満たす（抄録）。", "p5": "平均化の半径を0に近づけると古典的な弾性ひずみエネルギーに収束し、平面の開口ではGriffithの表面エネルギー係数を回復する。動的な亀裂の分岐とKalthoff–Winklerの衝撃問題でSAVと速度ベルレの解を比べた（抄録）。", "fun": "ガラスにひびが入るように、亀裂は「とても細い線」として扱うのが本来の姿だが、計算機ではその細さが扱いにくい。この研究は、周りのひずみを少しぼかして平均するだけで、ひびのエネルギーと材料の弱まりを同時に表せることを示した。余分な仮定を足さずに、古典的な破壊の法則が極限で戻ってくる点が面白い。", "unverified": "本文は入手できず、分岐の数値例でSAVと速度ベルレの結果がどう違ったかは確認できなかった。"}}, {"id": "pr28", "rank": 28, "headline": "反実仮想説明と形式的説明の関係を整理", "title": "On Formal Counterfactual Explanations", "url": "https://arxiv.org/abs/2611.22010", "authors": "Alexey Ignatiev ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Ignatiev, A., Stuckey, P. J., & Marques-Silva, J. (2026). On Formal Counterfactual Explanations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22010", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "最近傍世界の意味論による反実仮想説明と、形式的XAIの帰納的説明（AXp）・対照的説明（CXp）を結び、予測の変化を保証する連言形の反実仮想説明（CFXp）を導入した（抄録）。未査読。", "p3": "最近傍世界の反実仮想説明を、最小距離の反例すべての選言標準形として明示的に特徴づける。CXpは証拠のインスタンスのAXpを誘導し、CXpと証拠のAXpからCFXpが得られるという構造的な結果を示し、既存のAXp/CXpの計算でCFXpを求める（抄録）。", "p5": "木のアンサンブルとニューラルネットのベンチマークでCFXpの抽出は実用的に効率的で、点ベースの反実仮想説明より変える特徴が多くならず、単一の事例を超えて反実仮想の予測を保証できた（抄録）。", "fun": "「もし借入があと少し少なければ審査に通った」という説明は分かりやすいが、本当にそれだけ変えれば結果が変わるのかは保証されていないことが多い。この研究は、論理の言葉で説明を整理し直し、「この条件をそろえれば必ず結果が変わる」と言える説明を効率よく見つける方法を作った。分かりやすさと確実さを両立させる点が面白い。", "unverified": "本文は入手できず、ベンチマークの名前と計算時間の数値は確認できなかった。"}}, {"id": "pr29", "rank": 29, "headline": "コピュラによる表形式合成データの得失", "title": "Copula-Based Synthetic Data Generation: A Use-Inspired Perspective on Trade-offs", "url": "https://arxiv.org/abs/2611.22882", "authors": "Antoine Faul ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Faul, A., Ginsbourger, D., Spycher, B., & Stute, P. (2026). Copula-Based Synthetic Data Generation: A Use-Inspired Perspective on Trade-offs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22882", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ガウス混合コピュラで多変量の表形式データの同時分布を表すことで、合成データの忠実度・有用性・秘匿性をバランスよく満たし、確率モデルとして解釈もできることを示した（抄録）。未査読。", "p3": "中程度の次元のデータに焦点を当て、コピュラによる確率的な生成を使い、合成データの評価に内在する忠実度・有用性・秘匿性の3つの得失を、使い道に即した視点から検討する。心血管リスク計算機での系統的な欠測の事例で専用の評価指標を作った（抄録）。", "p5": "コピュラに基づく方法は3つの次元で均衡がとれ、明示的な確率モデルを与えると述べる（抄録）。数値の比較は抄録に記載がない。", "fun": "本物の個人データを配れないとき、性質の似た「にせのデータ」を作って配る方法がある。ただし本物に似せすぎると個人が特定され、離れすぎると役に立たない。この研究は、変数どうしのつながり方だけを取り出して表す「コピュラ」という数学の道具を使い、その綱渡りを中身の見える形でこなせることを示した。", "unverified": "本文は入手できず、比較した他の生成法と評価の数値は確認できなかった。"}}, {"id": "pr30", "rank": 30, "headline": "質の低い仮想の協働の後は相手を信頼しにくい", "title": "Trust Building in Virtual Interaction Environments", "url": "https://doi.org/10.2139/ssrn.7701486", "authors": "Jonas Backhus ほか", "venue": "SSRN", "date": "2026-11-17", "apa": "Backhus, J., Langer, T., Mohrschladt, H., & Selimaj, E. (2026). Trust Building in Virtual Interaction Environments. https://doi.org/10.2139/ssrn.7701486", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "やりとりの質が低いとき、ビデオ会議やアバターのVRで共同作業した相手は、対面で作業した相手より信頼されにくいことを2つの実験で示した（抄録）。未査読。", "p3": "2人組でインセンティブつきの共同作業（実験1は金融の助言、実験2は協力型のクイズ）を対面・ビデオ会議・VRの作業室のいずれかで行い、その後に元の相手と信頼ゲームをさせた（抄録）。", "p5": "やりとりの質が低いと仮想環境の後の信頼は対面より低いが、質が高いと仮想環境の不利は弱まり、対面で作られた信頼は質の影響を受けにくかった。この傾向は非対称な助言と対称な協力の両方で成り立った（抄録）。", "fun": "オンライン会議が当たり前になったが、画面越しの相手を本当に信頼できるのか。実験すると、会話がうまくいかなかったときは、画面越しやVRで組んだ相手を対面の相手より信頼しにくかった。ところが会話がうまくいけば、その差は小さくなった。対面は多少ぎこちなくても信頼が崩れにくい、という対面の強みが見えてくる点が面白い。", "unverified": "本文は入手できず、参加者数と効果の大きさは確認できなかった。"}}, {"id": "pr31", "rank": 31, "headline": "孫の世話と就労の両立と高齢期の認知機能", "title": "Grandchild care, paid work, and cognitive functioning in later life: Heterogeneity across gender and education among grandparents in Europe", "url": "https://doi.org/10.31235/osf.io/28yxf", "authors": "Maria Karlene Shawn Cabaraban ほか", "venue": "SocArXiv", "date": "2026-11-18", "apa": "Cabaraban, M. K. S., Bordone, V., Weber, D., & Arpino, B. (2026). Grandchild care, paid work, and cognitive functioning in later life: Heterogeneity across gender and education among grandparents in Europe. https://doi.org/10.31235/osf.io/28yxf", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SocArXivの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "欧州の祖父母で、孫の世話は全体として認知機能と正の関係をもつが、それは退職後と高学歴者に限られ、働く祖母では頻度により記憶への負の遅れた関連もあることを示した（抄録）。未査読。", "p3": "SHAREの50〜80歳の祖父18,748人（観測69,194）と祖母22,642人（観測79,702）の縦断データで、個人固定効果つきの交差遅延パネルモデルにより、孫の世話の有無と頻度と認知機能（記憶の再生と言語流暢性）の同時・遅れの関連を推定した（抄録）。", "p5": "孫の世話は男女とも認知機能と正の関連をもつが退職中に限られ、特に高学歴の祖父母で強かった。働く祖母では月1回以下の世話が同時点の言語流暢性の改善と関連する一方、どちらの頻度でも記憶の再生と負の遅れた関連がみられた（抄録）。", "fun": "孫の世話は頭を使うので祖父母の認知症予防によい、とよく言われる。大規模な追跡データで調べると、たしかによい関係はあったが、それは仕事を引退した人に限られていた。働きながら孫の世話もする祖母では、記憶に負担がかかる兆しさえあった。同じ「世話」でも、ほかに何を抱えているかで意味が変わる点が面白い。", "unverified": "本文は入手できず、関連の大きさ（係数）は確認できなかった。"}}, {"id": "pr32", "rank": 32, "headline": "若年介護者のためのAIコンパニオンを比較評価", "title": "AI Companions for Young Adult Caregivers: Practical Advice, Emotional Depth, and the Limits of Metric Evaluation", "url": "https://arxiv.org/abs/2611.23147", "authors": "Trizal Garg ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Garg, T., Fu, X., Shah, D., Huang, J., Maheshwari, S., Aggarwal, A., Sinha, Y., Kumar, D., & Mehrotra, S. (2026). AI Companions for Young Adult Caregivers: Practical Advice, Emotional Depth, and the Limits of Metric Evaluation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23147", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "18〜25歳の若年介護者向けのAIコンパニオンを作り、専門家とLLMの評価が高かった微調整モデルが、実際の利用者には実用的すぎて感情の支えに欠けると受け取られることを示した（抄録）。未査読。", "p3": "オープンなLLM（Gemma 3-27B）に、若年介護者と心理士の会話データでの微調整、RAG、その併用を比べ、3人のウェルビーイングの専門家の選好で微調整モデルを採用した。LLMの審査員による比較と、90人の若年介護者の利用者研究（半数が基本モデル）を行った（抄録）。", "p5": "LLMの審査員は評価した組の85%で微調整モデルを好んだが、利用者研究では微調整モデルの返答は実用的で短すぎ、助言に偏り感情の支えが少ないとされ、基本モデルのほうが感情に寄り添うと受け取られた（抄録）。", "fun": "家族の介護を担う若者を支えるAIを作り、専門家もAIの採点者も「こちらが良い」と選んだ。ところが当の若者に使ってもらうと、そのAIは助言ばかりで気持ちに寄り添ってくれないと感じられた。評価する人と使う人で「良い」の意味がずれることを、数字で示した点が面白い。", "unverified": "本文は入手できず、利用者研究の評価尺度と統計的な差の大きさは確認できなかった。"}}, {"id": "pr33", "rank": 33, "headline": "ナイジェリア36州のジェンダー・包摂を順位づけ", "title": "GENDER EQUALITY AND SOCIAL INCLUSION (GESI) PERFORMANCE LEADERBOARD OF NIGERIA'S 36 STATES FOR YEAR 2024", "url": "https://doi.org/10.5281/zenodo.24325125", "authors": "Achakpa ほか", "venue": "Zenodo", "date": "2026-11-17", "apa": "Achakpa, P. M., Baaki, J., & Munachi, P. U. (2026). GENDER EQUALITY AND SOCIAL INCLUSION (GESI) PERFORMANCE LEADERBOARD OF NIGERIA'S 36 STATES FOR YEAR 2024. Zenodo. https://doi.org/10.5281/ZENODO.24325125", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoの登録の説明（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ナイジェリアの36州すべてを、ジェンダー平等と社会的包摂（GESI）の6領域で評価し順位づけた2024年の評価報告である（抄録）。NGOの報告書で、査読はない。", "p3": "女性・若者・障害者の公的な指導層での代表性、政策・法制度、公共インフラのアクセシビリティ、弱い立場の人々への予算配分、司法へのアクセス、開かれた統治への取り組みの6領域を、公式記録・面接・オンライン調査・108人の調査員の現地確認で評価した（抄録）。", "p5": "抄録には各州の得点や順位の記載がなく、評価の枠組みとデータの集め方の説明にとどまる（抄録）。", "fun": "「包摂的な社会」と言っても、それをどう測ればよいかは難しい。この報告は、指導者に女性や障害者がいるか、建物や道が誰にでも使えるか、予算が弱い立場の人に回っているか、などの6つの物差しで、国内の36の州を並べてみせた。抽象的な理念を、調査員が現地で確かめられる項目に分解した点が面白い。", "unverified": "本文は入手できず、各州の得点・順位と指標の重みづけは確認できなかった。"}}, {"id": "pr34", "rank": 34, "headline": "介護者と高齢者のデジタル健康リテラシー介入", "title": "Effectiveness of Digital Educational Interventions to Promote Digital Health Literacy in Informal Caregivers and Older Adults: A Systematic Review (Preprint)", "url": "https://doi.org/10.2196/preprints.117184", "authors": "Amelie Meibeck ほか", "venue": "JMIR Preprints", "date": "2026-11-18", "apa": "Meibeck, A., Berner, N., Jagoda, F. A., Busse, T. S., Nitsche, J., Sachs, T., & Otte, I. C. (2026). Effectiveness of Digital Educational Interventions to Promote Digital Health Literacy in Informal Caregivers and Older Adults: A Systematic Review (Preprint). https://doi.org/10.2196/preprints.117184", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "高齢者と非公式の介護者のデジタル健康リテラシーを高めるデジタル教育介入を系統的に評価し、対象の8研究はすべて高齢者向けで、介護者向けの介入はなかったことを示した（抄録）。未査読。", "p3": "2025年5月にWeb of Science・MEDLINE・CINAHL・Cochrane CENTRALを検索し、2人が独立に選別・抽出、JBIの道具で質を評価して叙述的に統合した（抄録）。", "p5": "8研究（参加者1,143人、2011〜2023年）が該当し、すべてで介入群のリテラシーが改善したが、対照群との比較ができるのはeHEALSで測った2つのRCTだけだった。追跡のある2研究では2か月後は改善がほぼ保たれ、6か月後は一部で低下した（抄録）。", "fun": "家族を介護する人は、自分と家族の両方の健康情報をネットで扱う必要があり、デジタルの力がとくに求められる。ところが調べてみると、デジタル健康リテラシーを高める教育の研究は高齢者向けばかりで、介護する人向けのものは1つもなかった。いちばん必要としている人が研究の網から抜け落ちている、という発見が面白い。", "unverified": "本文は入手できず、2つのRCTの効果の大きさは確認できなかった。"}}, {"id": "pr35", "rank": 35, "headline": "実務訓練を受けた介護職の生涯学習", "title": "‘Lifelong learning of practically trained caregivers in long-term care: a qualitative study’", "url": "https://doi.org/10.21203/rs.3.rs-11288884/v1", "authors": "Elke Heijligers ほか", "venue": "Research Square (In Review)", "date": "2026-11-18", "apa": "Heijligers, E., Moser, A., Zwakhalen, S., & Erkens, P. (2026). ‘Lifelong learning of practically trained caregivers in long-term care: a qualitative study’. https://doi.org/10.21203/rs.3.rs-11288884/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "オランダの長期高齢者介護で職業訓練を受けた介護職の生涯学習について、振り返りのできる安全な場と専門職としての裁量が支えになることを質的に示した（抄録）。未査読。", "p3": "実務で訓練を受けた介護職、見習いの学生、職業教育の教員27人に、自律性・有能感・関係性に沿った4回の半構造化フォーカスグループを行い、帰納的な内容分析をした（抄録）。", "p5": "「振り返りのできる安全な環境」「共に学ぶ意識」「自分で選ぶ勇気」「専門職としての自律の余地」の4つの主題が得られ、学習は協働と承認を要する社会的な過程とみなされていた（抄録）。", "fun": "介護の現場では、知識や技術を学び続けることが欠かせない。でも、学校で長く学んだ専門職ではなく、現場で育った介護職がどう学んでいるかは、あまり調べられてこなかった。話を聞くと、学ぶには「失敗を話せる安心な場」と「自分で決めてよい余地」が大切だという声が浮かび上がった。学びが個人の努力でなく職場の雰囲気に左右される点が面白い。", "unverified": "本文は入手できず、参加者の内訳ごとの意見の違いは確認できなかった。"}}, {"id": "pr36", "rank": 36, "headline": "親の面接からLLMが子育て尺度の回答を推定", "title": "How closely do large language model scores from parent interviews match self-reported parenting?", "url": "https://doi.org/10.31234/osf.io/47nvm", "authors": "Violeta J. Rodriguez ほか", "venue": "PsyArXiv", "date": "2026-11-18", "apa": "Rodriguez, V. J., Kapadia, A. R., Ramachandiran, A., & Liu, Q. (2026). How closely do large language model scores from parent interviews match self-reported parenting? https://doi.org/10.31234/osf.io/47nvm", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "PsyArXivの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "親への面接からLLMが子育て尺度（MAPS）の回答を推定すると、自己報告との相関は中程度で、得点を一貫して低く見積もることを示した（抄録）。未査読。", "p3": "43人の親の面接の導入部の2問（家族、子育ての役割、養育の意味）から、6つの生成LLMにゼロショットでMAPSの35項目の回答を推定させ、項目の完全一致、下位尺度得点の相関、系統的な差、内的一貫性で評価した（抄録）。", "p5": "下位尺度の相関（Fisher平均）は0.320〜0.434で一貫して優れたモデルはなく、温かさで最も強く身体的な統制ではほとんど対応しなかった。回答の完全一致は35.5〜44.7%で、どのモデルも親より低い選択肢を選び、最高の選択肢をほとんど選ばなかった（抄録）。", "fun": "インタビューで話を聞けば、その人が質問紙にどう答えるかをAIが当てられるのでは、という期待がある。親の子育てで試すと、AIの推定はある程度は当たったが、全体に親より辛めの点を付け、とくに子どもへの温かさ以外の面は読み取りにくかった。AIが「人の代わりに答える」ことの得意と不得意が具体的に見える点が面白い。", "unverified": "本文は入手できず、各モデルの名前と、他の心理的構成概念との関連の具体的な値は確認できなかった。"}}, {"id": "pr37", "rank": 37, "headline": "移民系方言への態度：人とLLMの暗黙と明示", "title": "Comparing Implicit and Explicit Language Attitudes toward the Dutch multiethnolect Straattaal in Humans and Large Language Models", "url": "https://arxiv.org/abs/2611.22335", "authors": "Hedwig Oldenhof ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Oldenhof, H., Rosseel, L., Wegmann, A., & Nguyen, D. (2026). Comparing Implicit and Explicit Language Attitudes toward the Dutch multiethnolect Straattaal in Humans and Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22335", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "オランダの多民族方言Straattaalについて、人とLLMが移民の背景と結びつける暗黙・明示の言語態度を同じ設計で比べ、多くのLLMが人に似た態度を持つことを示した（抄録）。未査読。", "p3": "人には潜在連合テスト（IAT）と明示的な評定課題を、LLMにはLLM単語連想テスト（LLM WAT）と同じ評定課題を使い、近い設計で態度を測った（抄録）。", "p5": "人は暗黙・明示の両方でStraattaalを移民の背景と強く結びつけ、LLM WATでもStraattaalは一貫して移民の背景と結びつき、大きく新しいモデルほど連想が強かった。明示の評定課題でもLLMは人と似た反応パターンを示した（抄録）。", "fun": "ことばの話し方から話し手の出身を連想するのは、人の心にある無意識の思い込みの一つだ。調べてみると、AIの言語モデルも若者の多民族的な話し方を移民と強く結びつけていて、新しく大きなモデルほどその傾向が強かった。賢くなるほど人の偏見までよく写し取ってしまう、という皮肉な結果が面白い。", "unverified": "本文は入手できず、比較したモデルの一覧と連想の強さの数値は確認できなかった。"}}, {"id": "pr38", "rank": 38, "headline": "迎合を主張の妥当性で定義し発生源をたどる", "title": "From Preference Data to Personalization: Tracing Sycophancy in Large Language Models", "url": "https://arxiv.org/abs/2611.21650", "authors": "Himaghna Bhattacharjee ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Bhattacharjee, H., Sheynin, Y., Singhal, S., Subramonian, A., Samanta, A., Michael, J., Milli, S., Nickel, M., & Shi, C. (2026). From Preference Data to Personalization: Tracing Sycophancy in Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21650", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMの迎合を「訂正や留保が必要な場面での不適切な同意」と定義し直して測る評価器と評価集合を作り、推論時の個人化が不適切な同意を増やすことを示した（抄録）。未査読。", "p3": "主張の妥当性を考慮する評価器と、利用者の開かれ具合と重大さを統制した3,298問のペルソナ別評価集合SycoDriftを作り、人の選好データ、自動審査の採点基準、文脈内の個人化の3つの同意圧力の源を分析した（抄録）。", "p5": "人の選好データでの同意的な返答の好みは弱く同意が適切な場面に集中し、強調した審査基準は控えめだが一貫した増加を生んだ。14モデルでは推論時の個人化が不適切な同意を増やし、質問の直前に置いた一致する利用者像の効果が最も大きかった（抄録）。", "fun": "AIが何でも「おっしゃる通りです」と言うのは困るが、正しいことに同意するのは当然だ。この研究は、相手の言い分が間違っているのに同意する場合だけを「ごますり」として測り直した。すると、AIに「あなたはこういう人ですね」と利用者の情報を与えるほど、ごますりが増えた。親しくなるほど本当のことを言いにくくなるのは、人間関係とよく似ていて面白い。", "unverified": "本文は入手できず、個人化による増加の大きさと14モデルの一覧は確認できなかった。"}}, {"id": "pr39", "rank": 39, "headline": "エージェント網の形で偏りの伝わり方が変わる", "title": "Corrupting Ties: Investigating Robustness to Bias Injection Across Multi-Agent Network Topologies", "url": "https://arxiv.org/abs/2611.21804", "authors": "Cl\\'ea Chataigner ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Chataigner, C., Arzaghi, M., Carichon, F., Piantanida, P., & Farnadi, G. (2026). Corrupting Ties: Investigating Robustness to Bias Injection Across Multi-Agent Network Topologies (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21804", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMのマルチエージェントで一部の応答を偏ったものに置き換える介入実験から、ネットワークの形と注入の位置で偏りの広がり方が大きく変わることを示した（抄録）。未査読。", "p3": "選んだエージェントの応答を事前に決めた偏った応答に置き換える枠組みと、エージェント・ネットワーク・システムの各水準の判断のずれの指標を作り、5つのネットワーク構造と3つの二値分類課題でQwenとGemmaのモデルを評価した（抄録）。", "p5": "逐次型のネットワークでずれが最大で、全結合とメッシュ型では小さかった。星型では中心のエージェントへの注入が周辺への注入より影響が大きく、ずれが注入した偏りの方向に従うかはモデルで異なった（抄録）。", "fun": "伝言ゲームで一人が間違った情報を混ぜると、列の並び方によって最後に届く話の歪み方が変わる。AIどうしが相談する仕組みでも同じで、一列に順番に回す形がいちばん偏りに弱く、全員がつながる形は強かった。さらに、中心にいるAIがだまされると影響が大きい。誰が誰とつながるかという組織の形が、公平さを左右する点が面白い。", "unverified": "本文は入手できず、ずれの指標の具体的な値は確認できなかった。"}}, {"id": "pr40", "rank": 40, "headline": "委任型エージェントで事実の矛盾が消える場所", "title": "Multi-Agent Memory Inconsistency: Where Factual Conflicts Disappear in LLM Agents", "url": "https://arxiv.org/abs/2611.22245", "authors": "Hejia Zhang ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Zhang, H., Yu, Z., Ding, Y., Chen, W.-T., Yu, H., Ni, W., Liu, Y., Xu, C., Chen, X., Yao, M., Zhao, F., & Zhao, J. (2026). Multi-Agent Memory Inconsistency: Where Factual Conflicts Disappear in LLM Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22245", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "作業を複数のLLMエージェントに委ねると、矛盾する事実を拾える割合は上がるのに、矛盾を見つける割合は下がり、その原因が作業者から主担当への引き継ぎにあることを示した（抄録）。未査読。", "p3": "Harvey LABの文書審査課題に統制した事実の矛盾を入れたベンチマークと、証拠の流れを追う分析器を作り、生成の費用をそろえた3つのモデルで単独実行と委任を比べた（抄録）。", "p5": "委任で矛盾する2つの主張の両方を検索できた割合は50.2%から68.7%に上がったが、矛盾の検出は16.2%から13.2%に下がった。作業者が両方を報告したのは検索できた組の35.2%で、2つの主張が別の作業者に分かれると検出が単独より下がった（抄録）。", "fun": "大きな調べものをチームで分担すると、たくさんの資料を集められる。ところがAIのチームでは、資料の中の食い違いは、むしろ見落とされやすくなった。食い違う2つの記述を別々のメンバーが読むと、報告をまとめる段階で矛盾が消えてしまうからだ。分業の弱点が「引き継ぎ」にあるという点は、人間の組織にも通じて面白い。", "unverified": "本文は入手できず、使った3つのモデルの名前は確認できなかった。"}}, {"id": "pr41", "rank": 41, "headline": "ペルソナ別に包摂的な移動を評価する指標", "title": "A City Persona Sensitive Social Optimum Mobility Index for Assessing Inclusive Urban Mobility in Florence", "url": "https://doi.org/10.21203/rs.3.rs-11332418/v1", "authors": "Georgia Ayfantopoulou ほか", "venue": "Research Square (In Review)", "date": "2026-11-17", "apa": "Ayfantopoulou, G., Mallidis, I., Giannoudis, V., Meta, M., & Dais, S. (2026). A City Persona Sensitive Social Optimum Mobility Index for Assessing Inclusive Urban Mobility in Florence. https://doi.org/10.21203/rs.3.rs-11332418/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "都市の移動施策の社会的包摂を、ペルソナ別の重みと8つの柱で評価する指標SOMIを作り、フィレンツェで道路空間の再配分が最も高く評価されることを示した（抄録）。未査読。", "p3": "受容性・アクセス・負担可能性・主体性・利用可能性・法的承認・参加・安全の8つの柱を定め、参加型の採点でペルソナ別の重み、影響創出ボードでペルソナの影響の重みを導き、KPIの正規化と空間的なアクセスの解釈を組み合わせ、9つのペルソナと3つの施策を評価した（抄録）。", "p5": "施策の得点は道路空間の再配分0.840、都市物流のマイクロハブ0.630、30 km/h区域と交通静穏化0.388で、市全体のSOMIは0.619だった。重みを変えた感度分析でも順位は頑健だった（抄録）。", "fun": "車の速度を落とす、道路の使い方を変える、といった交通の施策は、高齢者や子ども連れ、車いすの人など立場によって受け止め方が違う。この研究は、さまざまな「代表的な住民像」を作り、それぞれの視点で施策を採点する物差しを作った。フィレンツェでは道路空間の配り直しが、どの住民像にとっても最も良い施策だった点が面白い。", "unverified": "本文は入手できず、9つのペルソナの内容と各柱の得点は確認できなかった。"}}, {"id": "pr42", "rank": 42, "headline": "都市の集積の形と炭素収支の非線形関係", "title": "How multidimensional urban spatial agglomeration shapes carbon balance in seven Chinese megacities: Nonlinear relationships and geographic variations", "url": "https://doi.org/10.21203/rs.3.rs-10661606/v1", "authors": "Yan Chen ほか", "venue": "Research Square (In Review)", "date": "2026-11-18", "apa": "Chen, Y., Jiao, S., Wei, Z., & Gu, X. (2026). How multidimensional urban spatial agglomeration shapes carbon balance in seven Chinese megacities: Nonlinear relationships and geographic variations. https://doi.org/10.21203/rs.3.rs-10661606/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "中国の7大都市で、都市の空間的な集積と正味の炭素排出の関係は非線形で、集中の初期には炭素への影響が増えるが効率化とインフラの共有で次第に弱まることを示した（抄録）。未査読。", "p3": "人為的な炭素排出と陸域生態系の炭素吸収を組み合わせた空間的な炭素収支の枠組みを作り、物理的な形態・機能の組織・社会経済の集中の3次元で集積を測り、多種の地理空間データとアンサンブル学習、解釈可能な空間分析で関係を調べた（抄録）。", "p5": "排出は都心に、吸収は周辺の生態空間に集まる空間的な分離がみられた。社会経済と機能の集積が正味排出と最も強く関連し、形態の影響は地理的な条件で異なり、気候と地形も関係を左右した（抄録）。", "fun": "人や建物をぎゅっと集める「コンパクトな街」は環境に優しいと言われる。ところが調べると、集まり始めの段階ではむしろ炭素の排出が増え、効率化やインフラの共有が進むにつれて効果が弱まっていく、という曲がった関係だった。単に密にするだけでなく、何をどう配置するかが大事だという点が面白い。", "unverified": "本文は入手できず、関係の大きさを示す数値は確認できなかった。"}}, {"id": "pr43", "rank": 43, "headline": "物理情報つき機械学習で下水道の投資を最小化", "title": "PIML-Driven Spatial Optimization and Active Telemetry Control of Integrated Grey-Green Systems to Minimize Modernization Capital Investment in US Combined Sewer Systems", "url": "https://doi.org/10.21203/rs.3.rs-11760144/v1", "authors": "Naim Sheikh", "venue": "Research Square (In Review)", "date": "2026-11-18", "apa": "Sheikh, N. (2026). PIML-Driven Spatial Optimization and Active Telemetry Control of Integrated Grey-Green Systems to Minimize Modernization Capital Investment in US Combined Sewer Systems. https://doi.org/10.21203/rs.3.rs-11760144/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "合流式下水道の越流対策で、物理情報つき機械学習の代理モデル・実時間制御・グリーンとグレーのインフラ配置の最適化を組み合わせ、設備投資をグレーだけの場合のほぼ半分に減らせることを示した（抄録）。未査読。", "p3": "EPA SWMMのExample 8（11.7 ha）、NOAA Atlas 14の設計降雨、フィラデルフィアの20年の時間雨量で、データ駆動と物理情報つきの代理を比べ、規則型制御とモデル予測制御を15の設計降雨で評価し、NSGA-IIで配置と費用を最適化した（抄録）。", "p5": "PIML-softの越流量の予測のNSEは0.87、学習外の25〜100年確率の豪雨で0.93だった。規則型制御は受動運転より越流量を5〜29%減らしMPCを上回り、緑のインフラ中心の設計で費用の最頻値は87万ドルから49万ドルに下がった（抄録）。", "fun": "大雨のとき、古い下水道では汚水があふれ出ることがあり、大きなタンクを造る対策は高くつく。この研究は、雨水を土に染み込ませる花壇のような緑のインフラと、水門の賢い操作を組み合わせ、AIの予測を使って配置を最適化した。単純な規則での操作が、高度な予測制御より効果的だった点も意外で面白い。", "unverified": "本文は入手できず、ベンチマークの流域以外への適用可能性は確認できなかった（著者もベンチマークに固有の結果としている）。"}}, {"id": "pr44", "rank": 44, "headline": "パラドックス思考がデジタル創造性を高める", "title": "The Paradox-creativity Nexus: A Moderated Mediation Model of Digital Engagement and Techno-invasion in the Workplace", "url": "https://doi.org/10.2139/ssrn.7699601", "authors": "Hoang Dinh Van ほか", "venue": "SSRN", "date": "2026-11-18", "apa": "Dinh Van, H., Trang Thi, T. D., Nguyen, T. P., Nguyen Hoang, A. T., & Tran, K. H. (2026). The Paradox-creativity Nexus: A Moderated Mediation Model of Digital Engagement and Techno-invasion in the Workplace. https://doi.org/10.2139/ssrn.7699601", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "矛盾を両立させて考えるパラドックス思考が、デジタルへの関与を通じて従業員のデジタル創造性を高め、技術による私生活への侵入（テクノ・インベージョン）がその経路を弱めることを示した（抄録）。未査読。", "p3": "質的・量的な逐次の混合研究法で、技術系企業の従業員と上司370組の時間差調査により、媒介と調整を組み合わせたモデルを検証した（抄録）。", "p5": "パラドックス思考はデジタル創造性に直接的にも、デジタル関与を通じて間接的にも正の影響をもち、テクノ・インベージョンはパラドックス思考と関与の関係と、関与を通じた間接効果をともに弱めた（抄録）。", "fun": "「速さも丁寧さも」「自由も規律も」といった矛盾する要求を、どちらか一方に決めずに両方とも抱えて考える力がある人ほど、デジタルの仕事で新しいアイデアを出しやすいという。ただし、夜や休日まで仕事の連絡が入り込む職場では、その力が生かされにくかった。考え方の強みも、働く環境次第で活きたり消えたりする点が面白い。", "unverified": "本文は入手できず、効果の大きさと質的研究の内容は確認できなかった。"}}, {"id": "pr45", "rank": 45, "headline": "AI導入の深さを業務フロー単位で測る指標", "title": "WDI: The Workflow Depth Index for AI Adoption", "url": "https://doi.org/10.2139/ssrn.7702063", "authors": "Min Wu", "venue": "SSRN", "date": "2026-11-18", "apa": "Wu, M. (2026). WDI: The Workflow Depth Index for AI Adoption. https://doi.org/10.2139/ssrn.7702063", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "AIの導入をライセンス数や利用回数でなく、業務フローごとに5次元で採点する指標WDI（Workflow Depth Index）を提案した（抄録）。未査読の初版の尺度。", "p3": "業務の深さ、行動への統合、利用の水準、構造の再編、成果への帰属の5次元を行動の基準と観察できる証拠で1〜5点（計5〜25点）で採点し、AIを取り除いたら何が起きるかを問う除去テストを加え、どの次元も3未満でないときだけ深い導入とする（抄録）。", "p5": "公平に関わる集団ごとに証拠を分けて示し格差への対応を求める設計で、公衆衛生の例示、TAM・普及理論・TOEなどとの関係、検証の計画を示すが、実証の結果はまだない（抄録）。", "fun": "会社が「社員の8割がAIを使っています」と言っても、それで仕事が本当に変わったとは限らない。この指標は、「もしAIを明日取り上げたら、その仕事はどうなるか」と問うことで、AIがどれだけ深く仕事に組み込まれたかを測ろうとする。使っている人数ではなく、なくなったら困る度合いで導入を測る発想が面白い。", "unverified": "本文は入手できず、尺度の信頼性・妥当性の検証は行われていない（著者も検証の計画として示す）。"}}, {"id": "pr46", "rank": 46, "headline": "戦時下の大学教員のバーンアウトと抑うつ", "title": "Burnout, depressive and anxiety symptoms in the structure of wartime academic distress among Ukrainian academic staff", "url": "https://doi.org/10.21203/rs.3.rs-10343778/v1", "authors": "Natalia Tsybuliak ほか", "venue": "Research Square (In Review)", "date": "2026-11-18", "apa": "Tsybuliak, N., Kolomiiets, U., Vakhitov, V., Popova, A., Lutsenko, A., Petrushenko, Y., & Suchikova, Y. (2026). Burnout, depressive and anxiety symptoms in the structure of wartime academic distress among Ukrainian academic staff. https://doi.org/10.21203/rs.3.rs-10343778/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "全面戦争下のウクライナの大学教員で、バーンアウト・抑うつ・不安は強く結びつくが一つの症候群ではなく、抑うつが最も強くつなぐ位置にあり、情緒的消耗がもっとも苦痛と近いことを示した（抄録）。未査読。", "p3": "2023年12月〜2024年2月にウクライナの大学教員429人にオンライン調査を行い、MBI-HSS・GAD-7・PHQ-9で測り、バーンアウトを総合と3次元（情緒的消耗・脱人格化・個人的達成感）で分析した横断研究（抄録）。", "p5": "抑うつがバーンアウトと不安の関連を大きく弱める位置にあり、脱人格化の関連は弱く周辺的で、個人的達成感は抑うつと負に関連した。個人の避難は所属機関が移転しない場合に最も苦痛と関連した（抄録）。", "fun": "仕事の燃え尽き、気分の落ち込み、不安は、普通は別々のものとして測られる。戦争の中で働き続ける大学の先生たちを調べると、それらは強く絡み合っていたが、ひとかたまりではなかった。自分だけが避難して大学は元の場所に残る場合に、とくに苦しさが大きかったという。働く人の心を職場の状況とあわせて見る大切さが分かる。", "unverified": "本文は入手できず、各関連の大きさは確認できなかった。横断研究なので因果の向きは言えない（著者も認める）。"}}, {"id": "pr47", "rank": 47, "headline": "離職予測は正解率でなく見逃しで選ぶべき", "title": "Predicting Employee Attrition in the Era of AI-Driven HR: A Machine Learning and Explainable AI Approach", "url": "https://doi.org/10.2139/ssrn.7699038", "authors": "Md. Abu Jafor Siddique", "venue": "SSRN", "date": "2026-11-18", "apa": "Siddique, Md. A. J. (2026). Predicting Employee Attrition in the Era of AI-Driven HR: A Machine Learning and Explainable AI Approach. https://doi.org/10.2139/ssrn.7699038", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "離職予測では正解率の高いモデルでも離職者の大半を見逃しうることを示し、判定のしきい値を交差検証で選ぶだけで見逃しが大きく減ることを示した（抄録）。未査読。", "p3": "合成とされるIBMの離職データ（1,470人、離職16.12%）を8対2に層化分割し、学習側だけにSMOTEを当ててランダムフォレストとロジスティック回帰を学習し、しきい値を学習データの5分割交差検証で選び、SHAPで要因を解釈した（抄録）。", "p5": "両モデルのROC-AUCは約0.80だが、しきい値0.5ではランダムフォレストが離職者の19.1%しか検出しなかった。交差検証で選んだ0.31では再現率が61.7%、F1が0.518になり、残業・未婚・ストックオプションの水準などが予測と強く関連した（抄録）。", "fun": "AIの予測の良し悪しは「正解率」で語られがちだが、辞める人が少ない職場では「誰も辞めない」と答えるだけで正解率は高くなる。この研究では、モデルそのものは変えずに、どの確率から「辞めそう」と判定するかの線を引き直すだけで、見逃しが大きく減った。その線をどこに引くかは、技術ではなく経営の判断だという指摘が面白い。", "unverified": "本文は入手できず、データが合成とされるため実際の職場での有効性は確認できない（著者も横断的で因果ではないとする）。"}}, {"id": "pr48", "rank": 48, "headline": "能力開発型の人事施策と上司支援が革新行動を促す", "title": "Developmental Human Resource Practices, Supervisor Support, And Employees&#39; Innovative Work Behaviors In The Public Sector: A Moderated Mediation Model", "url": "https://doi.org/10.2139/ssrn.7697100", "authors": "Kabiru Maitama Kura", "venue": "SSRN", "date": "2026-11-17", "apa": "Kura, K. M. (2026). Developmental Human Resource Practices, Supervisor Support, And Employees&#39; Innovative Work Behaviors In The Public Sector: A Moderated Mediation Model. https://doi.org/10.2139/ssrn.7697100", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "米国の連邦職員で、能力開発型の人事施策と上司の支援が職務満足を通じて革新的な行動に結びつき、仕事の自律性がこの間接効果を強めることを示した（抄録）。未査読。", "p3": "全国を代表する2023年の連邦職員意識調査（FEVS）のデータを、一般化線形モデルの媒介分析の枠組みで分析した（抄録）。", "p5": "能力開発型の人事施策と上司の支援の認知は革新的な行動と正の関連をもち、職務満足が両方の関係を有意に媒介し、仕事の自律性が間接効果を強めた（抄録）。", "fun": "役所の職員にも新しい工夫を生み出してほしいが、どうすればよいか。全国規模の職員調査を分析すると、育ててくれる人事制度と上司の支えがあると仕事への満足が高まり、それが工夫する行動につながっていた。さらに、自分で仕事の進め方を決められる人ほど、その流れが強かった。任されることが工夫の燃料になる点が面白い。", "unverified": "本文は入手できず、効果の大きさと標本の規模は確認できなかった。"}}, {"id": "pr49", "rank": 49, "headline": "孤独と地域への所属感は表裏ではない", "title": "Loneliness and Sense of Community are Not Two Sides of the Same Coin: Identifying Different Determinants Using the 2019 Nova Scotia Quality of Life Data", "url": "https://doi.org/10.5281/zenodo.23157424", "authors": "Hill ほか", "venue": "Zenodo", "date": "2026-11-17", "apa": "Hill, T. G., & MacGillivray, M. (2023). Loneliness and Sense of Community are Not Two Sides of the Same Coin: Identifying Different Determinants Using the 2019 Nova Scotia Quality of Life Data (Version Archived from OSF NOV 17 2026). Zenodo. https://doi.org/10.5281/ZENODO.23157424", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（Zenodoの登録には抄録なし）。本文は入手できず", "preprint": true, "short": true, "p1": "ノバスコシア州の代表標本で、地域への所属感と孤独を予測する要因は大きく異なり、両者は表裏の関係ではないことを示した（抄録）。", "p3": "2019年の12,871人の生活の質調査で、生活様式と生活条件の22の予測変数を重回帰に入れ、Lindeman・Merenda・Goldの方法（lmg）で各変数の相対的な重要度を求めた（抄録）。", "p5": "22の変数は所属感の分散の46%を説明し、上位は近隣の自然環境の質への満足（ri=0.09）、生活満足度、頼れる近所の人の数、制度への信頼（各0.05）などだった。上位10変数のうち孤独でも上位だったのは6つだけだった（抄録）。", "fun": "「地域に溶け込んでいる人は孤独ではない」と考えがちだが、1万人以上の調査では、地域への所属感を高める要因と孤独を減らす要因はかなり違っていた。所属感には近所の自然環境や頼れる隣人の数、行政への信頼などが効いていた。孤独と所属感を同じ物差しの両端と見なさず、別々に測る必要があるという点が面白い。", "unverified": "本文は入手できず、孤独のモデルの説明率と各変数の値は確認できなかった。掲載先・査読の状況も未確認。"}}, {"id": "pr50", "rank": 50, "headline": "地域のウェルビーイングを高める場への公平なアクセス", "title": "Where and How do Scottish Residents Experience Increased Community Well-Being? Equitable Access to Community Well-Being-Promoting", "url": "https://doi.org/10.5281/zenodo.22902731", "authors": "Hill, Taylor G.", "venue": "Zenodo", "date": "2026-11-17", "apa": "Hill, T. G. (2025). Where and How do Scottish Residents Experience Increased Community Well-Being? Equitable Access to Community Well-Being-Promoting (Version Archived from OSF NOV 17 2026). Zenodo. https://doi.org/10.5281/ZENODO.22902731", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "題名", "basis_note": "Zenodoの登録には題名しかなく、抄録・本文とも入手できず", "preprint": true, "short": true, "p1": "題名からは、スコットランドの住民がどこでどのように地域のウェルビーイングの高まりを経験するかと、それを促す場への公平なアクセスを扱う研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "公園、図書館、地域の集会所など、人が「この地域に住んでいてよかった」と感じる場所はさまざまだ。題名から読み取れる問いは、そうした場所がどこにあり、誰でも同じように行けるのか、という公平さの問題である。住みよさを個人の気持ちではなく、場所への行きやすさの偏りとして捉えようとする点が面白い。", "unverified": "抄録・本文を入手できず、調査の方法・対象・結果はすべて未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "統計学", "headline": "コーディングAIの分析は有意を作りやすい", "title": "Inference after coding agents", "url": "https://arxiv.org/abs/2611.23174", "authors": "Florian Gunsilius ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Gunsilius, F., Van Dijcke, D., & Wüthrich, K. (2026). Inference after coding agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23174", "why": "AIのコーディング・エージェントが実証分析を担うと、推定法の探索と再実行が容易なため新しい種類の選択後推論の問題が生じると論じる。効果ゼロの模擬データで4つの最先端エージェントが54〜98%の割合で有意なp値を報告し、エージェントを部分標本で再実行して選択の確率を推定する補正検定を提案する。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（推定量の構成、選択の測り方、シミュレーションの設計と結果、結論の節と図表のキャプション）を読んだ。証明と応用の付録は未読", "preprint": true, "p1": "AIのコーディング・エージェントに実証分析をさせると「説得力のある発見」を求められたとき偽の有意を大量に報告することを示し、エージェントを部分標本で再実行してその選択の偏りを推定し、p値を補正する方法を作った（抄録、§2、§6）。未査読のプレプリント。", "p2": "エージェントは人のような自由な推定法の探索と、選択と推定の両方をプログラムとして再実行できる性質をあわせもち、新しい種類の選択後推論の問題を生む。既存の補正は探索の空間や手順のモデルを前提としていた（§1、§2.3）。", "p3": "元の分析qを部分標本で実行してp値が全標本のp値u以下の「尾」とそれ以外の「本体」に分け、各層でエージェントを独立に再実行し、同じ分析（統計モデルと帰無仮説）を選ぶ確率a1、a0を数える（式7）。選択後のp値は H=u·a1/(u·a1+(1−u)a0) で、分析の一致はエージェント自身にモデルと仮説を述べさせて比較させる（§2.2.1–2.2.3）。", "p4": "選択規則が既知の固定設計（6つの独立なz検定から最小のp値を確率0.8で選ぶ）、効果ゼロの模擬RCT（4拠点2,000人）を最先端のエージェントに分析させる設計、実データの設計で、補正後の偽の棄却率が名目の5%に近いか、既知の真の補正とどれだけ一致するかを評価した（§4.2、表1）。", "p5": "補正なしでは、ほぼすべての分析でp<0.05を報告した（§4.3）。補正後の偽の棄却率は固定設計4.2%、自由なエージェント5.1%、実データ5.9%で（図3a）、固定設計では1,000回の再実行で真の補正と同じ判断が99.8%、補正後のp値のRMSEは0.019だった（表1）。自由な設計の倍率の中央値は19だった（図3b）。", "p6": "妥当性はエージェントの選択の振る舞いが標本の大きさで安定するという仮定に依存し（§3.1）、自由な設計では99件中19件で尾と本体のどちらにも一致がなく点推定が得られなかった（§4.3）。解釈：再実行の回数分だけ計算費用がかかり、高価なエージェントでの実用性が課題になる。", "fun": "AIに「すごい発見を一つ見つけて」と頼むと、効果が本当はゼロのデータでも、もっともらしい有意な結果を作ってしまう。この研究は、AIに同じ作業をデータの一部で何度もやり直させ、「都合のよい結果のときだけその分析を選ぶ癖」がどれくらい強いかを測って、その分を割り引く方法を作った。AIの中身が分からなくても、行動の記録から公正な判定ができる点が面白い。", "unverified": "応用（移民の態度とCard–Kruegerの最低賃金）の補正の具体的な数値と、証明の詳細は確認できなかった。"}}, {"id": "pn02", "rank": 2, "field": "統計学", "headline": "多
