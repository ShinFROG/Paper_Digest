 Economic Studies", "date": "2026-11-10", "sjr": 23.622, "citescore": 15.7, "citescore_year": "2025", "why": "デンマークの登録データで、男性管理職に第一子の娘が（息子でなく）生まれたことを性別観の外生的な変化とみなし、同じ企業の中で女性の労働条件の変化を比べた。娘の誕生後、女性の相対的な賃金は4.4%、雇用は2.9%増え、男性の採用を学歴や労働時間の同等な女性で置き換える行動がその原因で、企業の業績への有意な影響は見られなかったと報告する。"}, {"id": "jn02", "rank": 2, "field": "経営学", "headline": "社名を変えた銀行は第一次大戦の反独感情を免れた", "title": "Banking on a Corporate Rebrand", "url": "https://doi.org/10.1287/mnsc.2025.03635", "authors": "Matthew Jaremski ほか", "venue": "Management Science", "date": "2026-11-13", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "1917年の米国参戦で起きた反ドイツ感情を、銀行の基礎的な条件と無関係な負のショックとする歴史的な自然実験で、名前の似た同じ業界の銀行の大標本を比べた。ドイツ風の名前を残した銀行は資産・預金・市場シェアを大きく失い、改名した銀行は負の影響の多くを避けたと報告する。"}, {"id": "jn03", "rank": 3, "field": "組織行動・心理的安全性", "headline": "採掘企業の自主的な透明性支持で地域の汚職が減るか", "title": "Can Voluntary Corporate Transparency Curb Corruption? Community-Level Evidence from Oil and Gas Fields in Africa", "url": "https://doi.org/10.1287/orsc.2025.20487", "authors": "Shirley Tang ほか", "venue": "Organization Science", "date": "2026-11-13", "sjr": 7.929, "citescore": 12.8, "citescore_year": "2025", "why": "公的な監視の弱い地域で企業の自主規制が汚職を抑えるかを、採掘産業透明性イニシアティブ（EITI）への企業の支持で調べた。アフリカの油田・ガス田の位置と操業企業を、アフロバロメーターの調査と衛星の夜間光に結びつけ、操業企業がEITIを支持する前後の同じ油田周辺の変化を差の差分析で追う。"}, {"id": "jn04", "rank": 4, "field": "経営学", "headline": "表形式データの分布シフトは条件付きの変化が主", "title": "Rethinking Distribution Shifts: Empirical Analysis and Modeling for Tabular Data", "url": "https://doi.org/10.1287/mnsc.2024.08298", "authors": "Tianyu Wang ほか", "venue": "Management Science", "date": "2026-11-13", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "8つの表形式データの172の分布の組、45の手法、9万の設定からなる実証の試験台を作り、自然に起きる分布シフトを調べた。機械学習の研究が重視してきた入力（X）のシフトでなく、Y|Xのシフトが最も多いことを示し、頑健化の手法は対象とするシフトの種類に基づいて開発・評価すべきだと主張する。"}, {"id": "jn05", "rank": 5, "field": "経営学", "headline": "持ち家の自己資本が減ると洪水保険を更新しなくなる", "title": "What’s at Stake? Understanding the Role of Home Equity in Flood Insurance Demand", "url": "https://doi.org/10.1287/mnsc.2025.01302", "authors": "Yanjun (Penny) Liao ほか", "venue": "Management Science", "date": "2026-11-13", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "住宅価格の上昇と下落に伴う持ち家の自己資本の変化と洪水保険の需要の関係を、住宅不況期の保険更新で、購入時期の違いから生じる損失負担の差を使って因果的に調べた。洪水損失への自己資本のさらされ方が小さいと更新しにくくなり、政府系機関に住宅ローンを売れる貸し手には保険を求める誘因が乏しいことも示す。"}, {"id": "jn06", "rank": 6, "field": "地震工学・防災", "headline": "物理ベースの地震動計算と代理モデルを組み合わせたPSHA", "title": "Combining Direct Simulation and Surrogate Modelling for Simulation‐Consistent Probabilistic Seismic Hazard Analysis", "url": "https://doi.org/10.1002/esp4.70142", "authors": "Claudio Schill ほか", "venue": "Earthquake Spectra", "date": "2026-11-14", "citescore": 7.7, "citescore_year": "2025", "why": "確率論的地震ハザード解析で、膨大な数の断層破壊をすべて物理ベースで計算する負担を、寄与の大きい破壊は直接シミュレーションし、個々の寄与は小さいが合計では無視できない多数の破壊は物理シミュレーションで学習した代理モデルで表す枠組みで解決した。ニュージーランドのCyberShake（約1万6千の破壊）に適用した。"}, {"id": "jn07", "rank": 7, "field": "機械学習", "headline": "観測から直接予報する機械学習の全球海洋予報システム", "title": "An end-to-end machine-learning system for global eddy-resolving ocean forecast", "url": "https://doi.org/10.1126/sciadv.aeh9058", "authors": "Xiang Zhang ほか", "venue": "Science Advances", "date": "2026-11-13", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "why": "これまでの機械学習による海洋予報は、数値予報システムが作る初期値に頼っていた。WenHai-E2Eは多様な海洋観測から直接、渦を解像する全球の海洋予報を行い、運用時には数値予報の流れ全体を置き換える。最先端の数値予報システムより予報精度が高いと報告する。"}, {"id": "jn08", "rank": 8, "field": "組織行動・心理的安全性", "headline": "チームの心理的安全性を資源保存理論で育てるモデル", "title": "Cultivating Team Psychological Safety: A Model Rooted in Conservation of Resources Theory", "url": "https://doi.org/10.1111/1748-8583.70079", "authors": "Nico Schaefer ほか", "venue": "Human Resource Management Journal", "date": "2026-11-14", "sjr": 3.013, "citescore": 14.9, "citescore_year": "2025", "why": "チームの心理的安全性を資源が行き来する通り道と捉え、資源保存（COR）理論から多水準の過程モデルを示した。安全性が築かれる「育成」、参加と成果を支える「開花」、各水準で資源の獲得につながる「収穫」の3段階で、個人の主体性、チームの相互作用、組織の条件の役割を整理する。"}, {"id": "jn09", "rank": 9, "field": "気候科学", "headline": "北半球の冬の大気の蛇行の増加は海の数十年変動が半分", "title": "Increases in Northern Hemisphere winter circulation waviness over 1989 to 2011 driven by decadal oceanic variability", "url": "https://doi.org/10.1126/sciadv.aeg2637", "authors": "Weiming Ma ほか", "venue": "Science Advances", "date": "2026-11-13", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "why": "1989〜2011年に北半球中緯度の冬の大気の蛇行が強まったが、北極の温暖化による説明は支持されていなかった。大規模アンサンブル実験と統計・力学の解析で、海面水温と海氷の変動が観測された増加の約半分（48.7〜63.3%）を説明し、大西洋数十年規模振動（AMO）の正の位相への移行が主な要因だと示す。"}, {"id": "jn10", "rank": 10, "field": "地震工学・防災", "headline": "浅水方程式を組み込んだ機械学習で台風の高潮を予報", "title": "Physics-informed and data-efficient machine learning for storm surge forecasting during typhoons", "url": "https://doi.org/10.1126/sciadv.aeh5673", "authors": "Huarong Xie ほか", "venue": "Science Advances", "date": "2026-11-13", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "why": "浅水方程式を学習に組み込み、区分的な損失関数で物理の制約を入れた高潮ニューラルネットワーク（SSNN）を開発した。少ない学習データでも純粋なデータ駆動のモデルより正確で、風の強弱が大きく変わる沿岸と16時間を超える予報で改善が目立つと報告する。"}, {"id": "jn11", "rank": 11, "field": "組織行動・心理的安全性", "headline": "商業化前の新技術では既存企業の提携が適応を生まない", "title": "Incumbents’ Alliances and (Non-)Adaptation During the Pre-Commercialization Stage of a New Technology", "url": "https://doi.org/10.1287/orsc.2024.18899", "authors": "Jung-Hyun Suh ほか", "venue": "Organization Science", "date": "2026-11-13", "sjr": 7.929, "citescore": 12.8, "citescore_year": "2025", "why": "既存企業は補完的な資産を差し出して新技術の知識を得られるという通説は、商業化の段階には合うが、補完資産をまだ使えない商業化前の段階では成り立たない可能性がある。段階によって知識と補完資産の価値が変わり、既存企業と知識を持つ企業の交渉力が移ることで、提携が適応につながらない仕組みの枠組みを示す。"}, {"id": "jn12", "rank": 12, "field": "経営学", "headline": "保険広告の物語と商品ページの一致で購入率が上がる", "title": "The Digital Journey of Health Insurance Marketing: Narrative Ads and Product Page Design", "url": "https://doi.org/10.1287/mksc.2025.0168", "authors": "Yin Bai ほか", "venue": "Marketing Science", "date": "2026-11-13", "sjr": 8.324, "citescore": 9.3, "citescore_year": "2025", "why": "健康保険は広告の場から保険会社の商品ページに移らないと契約できない。中国の大手保険会社とDouyinで行った無作為化フィールド実験で、335本の広告（約1,700万回の表示、77万回あまりのクリック）からの利用者を、事実中心のページか顧客体験の事例を含むページに無作為に振り分け、広告の物語とページの設計の組み合わせが購入に与える影響を調べた。"}, {"id": "jn13", "rank": 13, "field": "量子計算", "headline": "高い符号化率の量子符号に誤り耐性のある符号化器", "title": "Fault-tolerant quantum computing with high-rate symplectic double codes", "url": "https://doi.org/10.1126/sciadv.aec4142", "authors": "Naoyuki Kanomata ほか", "venue": "Science Advances", "date": "2026-11-13", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "why": "符号化率が高く距離の大きい量子符号は誤り耐性量子計算を効率化するが、多くは符号化した状態を誤り耐性をもって準備する方法がなかった。2つのシンプレクティック・ダブル符号（[[30,6,5]]と[[36,12,5]]）について、少ない補助量子ビットで重大な誤りを検出する符号化器を提案し、資源の負担を減らしつつ論理誤り率を低く保てることを示す。"}, {"id": "jn14", "rank": 14, "field": "地震工学・防災", "headline": "上盤の地質構造がカスケード沈み込み帯の挙動を左右", "title": "Upper plate structure controls nearshore subduction mechanics in Cascadia", "url": "https://doi.org/10.1126/sciadv.aej7552", "authors": "Asif Ashraf ほか", "venue": "Science Advances", "date": "2026-11-13", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "why": "米国オレゴン州の陸と海をまたぐ高解像度の3次元地震波トモグラフィーで、付加した地塊による速度の急な違いをとらえた。硬いSiletz地塊の下では沈み込む板が深く、断層化した地塊の下では浅いことを示し、トモグラフィーで制約した数値計算で、上盤の流動特性の違いがこれを生むと報告する。"}, {"id": "jn15", "rank": 15, "field": "工学", "headline": "人と橋の相互作用を考えた歩道橋のTMD配置の最適化", "title": "Vibration Mitigation of Footbridges Considering Human-Structure Interaction and Optimization of MTMD Placement and Properties", "url": "https://doi.org/10.1007/s42417-026-02895-w", "authors": "Leonardo D. A. Rocha ほか", "venue": "Journal of Vibration Engineering & Technologies", "date": "2026-11-11", "citescore": 4.5, "citescore_year": "2025", "why": "実在の歩道橋の3次元有限要素モデルで、歩行者と構造物の相互作用を生体力学的な連成モデルで表し、1〜3個の同調質量ダンパー（TMD）の位置と特性を2段階の最適化で決めた。共振と非共振の歩行の条件で振動を抑える効果を評価する。"}, {"id": "jn16", "rank": 16, "field": "組織行動・心理的安全性", "headline": "CEOの社会的発言は保守系で悪名、リベラル系で名声に", "title": "Wrongdoers or Saviors? CEO Activism, Media Partisanship, and the Media’s Construction of CEO Infamy and Celebrity", "url": "https://doi.org/10.1287/orsc.2024.19062", "authors": "G. Alessandra Alessandra Rizzi ほか", "venue": "Organization Science", "date": "2026-11-13", "sjr": 7.929, "citescore": 12.8, "citescore_year": "2025", "why": "リベラルな社会政治的発言をしたCEOが党派的なメディアでどう描かれるかを理論化した。悪名は「悪者」とする単純な物語、名声は「救世主」とする複雑な物語から生まれ、保守系のメディアでは悪名、リベラル系では名声が作られ、発言は名声より悪名を生みやすいと論じる。"}, {"id": "jn17", "rank": 17, "field": "経営学", "headline": "保険会社は安定資金の流動性プレミアムを保険料で還元", "title": "Insurers’ Investments and Insurance Prices", "url": "https://doi.org/10.1287/mnsc.2024.09038", "authors": "Benjamin Knox ほか", "venue": "Management Science", "date": "2026-11-13", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "保険の引受けによる安定した資金で保険会社が非流動資産の流動性プレミアムを得て、その一部を低い保険料で契約者に還元するという理論を示した。流動性プレミアムが高いときに生命保険と損害保険の価格が低いこと、資金の安定した保険会社ほど期待収益が高く価格が低いことを実証する。"}, {"id": "jn18", "rank": 18, "field": "経営学", "headline": "打ち切られた販売データだけで学ぶ発注量の決定", "title": "The Data-Driven Censored Newsvendor Problem", "url": "https://doi.org/10.1287/mnsc.2024.09021", "authors": "Chamsi Hssaine ほか", "venue": "Management Science", "date": "2026-11-13", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "需要そのものでなく在庫切れで打ち切られた販売データしかないときの新聞売り子問題（発注量の決定）を、分布的に頑健な最適化の枠組みで分析し、需要の打ち切りの程度が学習アルゴリズムの性能をどう制約するかを最悪の後悔で評価する。"}, {"id": "jn19", "rank": 19, "field": "経営学", "headline": "相場の局面が変わる下での資産価格のファクターモデル比較", "title": "Comparing Factor Models Under Regime Switching", "url": "https://doi.org/10.1287/mnsc.2025.04942", "authors": "Shamim Ahmed ほか", "venue": "Management Science", "date": "2026-11-13", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "リターンに局面の切り替わりがあると、無条件の二乗シャープレシオでのモデルの比較は適切でなく、局面ごとの条件付きの指標を使うべきだと示した。強気の局面では複数の6因子・4因子モデルが最も良く、弱気の局面ではどのモデルも有意には優れないと報告する。"}, {"id": "jn20", "rank": 20, "field": "経営学", "headline": "廃棄物の価値化は率を上げても常に得ではない", "title": "The Economics of Waste Valorization", "url": "https://doi.org/10.1287/mnsc.2024.08500", "authors": "Yuefeng Li ほか", "venue": "Management Science", "date": "2026-11-13", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "生産の副産物を別の製品に変える廃棄物の価値化について、2段階の確率的な生産決定モデルで最適な生産量を分析した。価値化の率が高いほど製造業者に有利とは限らず、とくに廃棄物の処分に費用がかかる場合にそうなることを示す。"}, {"id": "jn21", "rank": 21, "field": "オペレーションズ・リサーチ", "headline": "客が離脱する待ち行列のサービス速度を契約で調整", "title": "EXPRESS: Dynamic Principal-Agent Problem in Queueing Systems with Customer Abandonment", "url": "https://doi.org/10.1177/10591478261510178", "authors": "Tan Yu ほか", "venue": "Production and Operations Management", "date": "2026-11-14", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "why": "依頼人が価格で到着を制御し、代理人が費用のかかるサービス速度を私的に選ぶ、顧客が離脱する待ち行列の動的なプリンシパル・エージェント問題を、反射拡散とHJB方程式で分析した。利用料と完了報酬からなる二部契約で、移転に制約がなければ最善の結果を達成できることを示す。"}, {"id": "jn22", "rank": 22, "field": "オペレーションズ・リサーチ", "headline": "調達先の国の政情不安と企業業績はU字の関係", "title": "EXPRESS: Benefits of Extreme Political Stability and Instability of Supplier Countries for Firms: The U-Shaped Relationship", "url": "https://doi.org/10.1177/10591478261510189", "authors": "Jafar Namdar ほか", "venue": "Production and Operations Management", "date": "2026-11-14", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "why": "2010〜2020年の米国の買い手企業と世界の調達網のパネルで、調達先の国の政治的不安定さへの加重したさらされ方と企業業績の関係を調べ、非常に安定した国と非常に不安定な国に寄せた企業で業績が高いU字の関係を見いだした。"}, {"id": "jn23", "rank": 23, "field": "オペレーションズ・リサーチ", "headline": "排出削減投資の回収期間は少しずつ長くなっている", "title": "EXPRESS: An Exploratory Analysis of Variation in Payback Periods of Emissions Reduction Projects Using CDP Disclosures", "url": "https://doi.org/10.1177/10591478261510190", "authors": "Christian C. Blanco ほか", "venue": "Production and Operations Management", "date": "2026-11-14", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "why": "企業がCDPに開示した排出削減プロジェクトの回収期間を2010〜2024年に延ばして分析し、回収期間は2〜3年と短いものの、平均で年に約2週間ずつ、ゆっくりと有意に長くなっていることを示した。"}, {"id": "jn24", "rank": 24, "field": "組織行動・心理的安全性", "headline": "小企業の競争的協調で意図しない知識流出が衰退を招く", "title": "Exploring the Dark Side of the Coopetition Paradox: Unintentional K     card.appendChild(el("h1", "headline", it.headline || it.title));
    var ex = it.explain;
    if (ex) {
      var basis = el("p", "basis");
      basis.appendChild(el("span", "pill", (ex.short ? "短い解説・" : "") + (BASIS_PILL[ex.basis] || ex.basis || "")));
      if (ex.preprint) basis.appendChild(el("span", "badge", "未査読プレプリント"));
      if (ex.basis_note) basis.appendChild(el("span", null, ex.basis_note));
      card.appendChild(basis);
      LABELS.forEach(function (l, i) {
        if (!ex[l[0]]) return;
        var sec = el("section", "ex" + (i === 0 ? " first" : ""));
        sec.appendChild(el("h2", null, l[1]));
        sec.appendChild(el("p", null, ex[l[0]]));
        card.appendChild(sec);
      });
      if (ex.fun) {
        var fun = el("section", "ex fun");
        fun.appendChild(el("h2", null, "面白いポイント"));
        fun.appendChild(el("p", null, ex.fun));
        card.appendChild(fun);
      }
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // three texts to hand on: a question for an AI, a note for another person, a reproduction request for an AI
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    HANDOFFS.forEach(function (h) {
      var b = el("button", "ask"); b.type = "button";
      h.label.forEach(function (part, i) {
        if (i) b.appendChild(document.createElement("wbr"));
        b.appendChild(document.createTextNode(part));
      });
      b.addEventListener("click", function () { copyText(h.make(it), askStatus, h.done); });
      askrow.appendChild(b);
    });
    card.appendChild(askrow); card.appendChild(askStatus);
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
