<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-10-20", "intro": "プレプリントの新着270件、学術誌の新着452件（うち上位10%誌300件）、重要論文の候補338件（プレプリント254件、学術誌84件）から選びました。プレプリント・関連42報、プレプリント・注目50報、論文誌・関連48報、論文誌・注目34報、オープンデータ22件です。プレプリントの関連候補は審査のない置き場の文書が多く、良い候補が足りない部は件数を減らしました。取得できなかった情報源はありません。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "LLMが作る政治ネットワークを調査で検証", "title": "Validating LLM-generated political networks with survey-reported partisan exposure", "url": "https://arxiv.org/abs/2610.23199", "authors": "Marco Tonin ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Tonin, M., Tizzoni, M., Lepri, B., & Aiello, L. M. (2026). Validating LLM-generated political networks with survey-reported partisan exposure (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23199", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（結果§2.1〜2.4、考察の限界、方法§4.1〜4.3と図2〜5の説明）を読んだ", "preprint": true, "p1": "LLMに全国調査の回答者をペルソナとして与え友人関係のネットワークを作らせ、その「政治的な周囲の環境」を回答者本人の調査回答と1人ずつ照合する検証の枠組みを示した。全体の指標がもっともらしくても、個人の周囲の党派構成はずれうることを明らかにした（抄録、§3）。", "p2": "LLMによる社会シミュレーションの評価は、次数やクラスタ係数、同類性（assortativity：似た属性どうしが結びつく傾向）などネットワーク全体の指標に偏っていた。全体として妥当でも、個々の人の社会的・政治的環境を再現しているかは確かめられていなかった（§1、抄録）。", "p3": "ANES 2020〜2022ソーシャルメディア調査から重み付き層化抽出で100人を選び、年齢・性別・人種・学歴・州・宗教・2020年の投票先でペルソナを作った（§4.1、§4.3）。5つのオープンモデル（Llama-3.1 8B/70B、Qwen2.5 7B/72B、Mistral 7B）に、1人ずつ判断させる方式（c1）と5〜50人の候補リストから友人を選ばせる方式（c5〜c50）で友人を指名させ、温度2種・属性の順序2種・各10回で計1,000の実行を作った（§4.2〜4.3）。例：民主党に投票した45〜59歳のペルソナが選んだ友人のうち共和党投票者の割合を5段階に区切り、本人の「友人・家族のうち共和党支持者は何人か」（1〜5）の回答と比べる（§2.2）。", "p4": "構造の妥当性は、13データセット57の実際の友人ネットワークの範囲に5指標（平均次数、クラスタ係数、最大連結成分の割合、平均最短経路長、モジュラリティ）がすべて入るかで判定した（§2.1）。個人の党派的な曝露は、生成値と調査値の平均符号付き偏差（MSD、1〜5尺度の点）で評価した（§2.2）。", "p5": "相互指名のネットワーク1,000本のうち構造的に妥当なのは332本（33.2%）で、候補数が多いほど妥当な割合が上がった（c1 2%、c5 0%、c10 20%、c25 64%、c50 80%）（§2.1、図2）。党派的な曝露では、Llama 2種とQwen2.5 72Bが同じ党への曝露を過大、他党への曝露を過小に生成し、Llama-3.1 70Bでは偏差が1点を超えた。Mistral 7BとQwen2.5 7Bは主に共和党支持者への曝露を過小評価した（§2.2、図3）。同類性の差が0.02未満のネットワークどうしでも同じペルソナの曝露が最大1点程度異なり、構造的に妥当なネットワークに限っても差は残った（§2.3、図4）。誤差はヒスパニック、45〜59歳、学士以上などで民主党への曝露を過小評価するなど、集団ごとに異なった（§2.4、図5）。", "p6": "著者は、標本を100人に絞ったこと、ペルソナの属性が限られること、局所で動かせるオープンモデルに限ったことを限界に挙げる（§3）。解釈：調査の1〜5尺度と、生成ネットワークの割合を5区分した値の対応づけ自体が誤差を含みうる点は残る疑問である。", "fun": "AIに「この人ならどんな人と友達になるか」を考えさせて社会を作ると、全体の数字は本物の社会とよく似て見えることがあります。ところが一人ひとりに「あなたの友達の何人が共和党支持者ですか」と聞いた本物の答えと比べると、AIの社会は党派の分断を強く描きすぎたり、共和党支持者を少なく描いたりしていました。全体が合っていても中身がずれているという、シミュレーションの落とし穴を示した研究です。", "unverified": "集団別の偏差の数値（表S11）と温度0.7の結果は付録の表を確認していない。"}}, {"id": "pr02", "rank": 2, "headline": "グラフ型NARXで構造の動的応答を同定", "title": "Towards a GraphNARX model for structural dynamics", "url": "https://arxiv.org/abs/2610.23103", "authors": "George Tsialiamanis ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Tsialiamanis, G., & Worden, K. (2026). Towards a GraphNARX model for structural dynamics (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23103", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§2.3の定式化、§3の同定と外挿、§4の仮想センシング、§5の結論と図表）を読んだ", "preprint": true, "p1": "構造物の幾何をグラフで表したNARXモデル（GraphNARX）で、10自由度系で学習したモデルを20自由度系にそのまま当てはめ、センサのない節点の変位も推定（仮想センシング）できることを数値例で示した（抄録、§5）。", "p2": "従来のNARX（非線形自己回帰外生入力モデル：過去の出力と入力から次の出力を予測する）はすべての自由度の相互作用を許すため、構造の大きさや自由度数が変わると使い回せない。ニューラルネットは学習範囲外の値の外挿にも弱い（§2.3、§3.1）。", "p3": "節点の特徴に過去の変位と節点力（式6）、辺の特徴に隣接節点間の相対変位の履歴（式8）を入れ、辺の更新モデルφeと節点の更新モデルφvで次の時刻の変位の増分を予測する（式9〜11）。直観：ばねの力は両端の相対変位で決まるので、材料定数を知らなくても辺の更新で力の伝達を学べ、増分を予測すれば大きな構造でも値が学習範囲に収まる。具体例：質量1 kg、減衰1.0 Ns/m、剛性1000 N/mの10自由度の質量-ばね系を4次ルンゲ・クッタ（刻み0.01 s）で計算し、1%の白色雑音を加えて学習した（§3.1）。", "p4": "1ステップ先の正規化平均二乗誤差（NMSE、式13）と、自分の予測を再帰的に使う多段先予測の誤差（MPE）で評価した。著者の経験上、NMSE 1%未満が非常に良い当てはまり、5%未満が良い当てはまりとされる（§3.1）。比較対象の他手法は置いていない。", "p5": "選択したモデル（表1のGNN 2、変位の遅れ6、力の遅れ2）の試験データの1ステップ先NMSEは0.0204%で、雑音除去もできていた。多段先予測は400ステップ先まで平均NMSE 5%未満で、それ以降ほぼ線形に増えた（図6）。再学習なしの20自由度系でも1ステップ先NMSEは0.02283%で、400ステップ先まで5%未満だが誤差の増え方は速かった（図8）。仮想センシングでは学習時に50%の節点を無作為に隠し、10自由度系で1つおきに欠測なら5.0%、60%欠測で6.36%、20自由度系では1.93%と2.51%だった（§4、図9〜10）。", "p6": "著者は、GNNの構造の検討が限られ、モデル選択が1ステップ先の誤差だけに基づくこと、多段先の損失の導入が必要なこと、実構造物での検証がないことを認める（§5）。解釈：同一の質量・剛性・減衰を持つ1次元の連鎖系のみで、部材の性質が異なる構造や、多段先の誤差が線形に増える原因は未解明のまま残る。", "fun": "ばねでつながったおもりの列を、隣どうしの関係だけを学ぶAIで再現すると、10個のおもりで練習したAIが、20個の列でもそのまま揺れを予測できました。部分の規則を覚えれば全体の大きさが変わっても通用するのは、ドミノの倒れ方を2枚の関係から理解するのに似ています。センサを外した場所の揺れまで隣から推し量れる点も面白いところです。", "unverified": "他のNARXや物理モデルとの定量比較は本文に示されていない。"}}, {"id": "pr03", "rank": 3, "headline": "SOX404(b)免除の基準付近で売上計上が保守的に", "title": "Staying Below the Bar: Do Companies Strategically Recognize Revenues to Sidestep SOX 404(b) after the 2020 SEC Rule Change?", "url": "https://doi.org/10.2139/ssrn.7631259", "authors": "Bingyi Chen ほか", "venue": "SSRN", "date": "2026-10-19", "apa": "Chen, B., Jiang, Y., Singer, Z., & Zhang, J. (2026). Staying Below the Bar: Do Companies Strategically Recognize Revenues to Sidestep SOX 404(b) after the 2020 SEC Rule Change? https://doi.org/10.2139/ssrn.7631259", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイト・OpenAlexは取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "2020年のSEC規則改正で売上1億ドル未満の小規模報告会社がSOX 404(b)（監査人による内部統制の証明）を免除されるようになったとき、基準のすぐ下の企業は売上を保守的に計上するようになり、報告の質はむしろ上がったことを示した（抄録）。", "p2": "規制に閾値があると、企業は閾値を下回るよう数字を操作するおそれがある。免除の基準が売上で決まる新制度が、売上の計上行動と報告の質をどう変えたかは分かっていなかった（抄録）。", "p3": "改正後に閾値のすぐ下にいる企業と対照企業を比べる、差の差（DID）型の比較を行った。売上の保守的な計上と実体活動の操作（売上を実際に減らす行動）を区別し、発生主義会計の質（accrual quality）や売上関連の指摘への影響も調べた（抄録）。背景：閾値付近の企業は、売上を少なめに見せれば監査人証明の費用を避けられる。", "p4": "売上計上の保守性、発生項目の質、売上関連の重要な不備の報告、SECからの売上関連のコメントレターの受領を指標とした（抄録）。具体的な推定式・標本規模は未確認。", "p5": "閾値のすぐ下の企業は改正後、対照企業より有意に保守的に売上を計上した。この変化は実体活動の操作ではなく保守的な報告によるもので、発生項目の質の改善を伴った。これらの企業は売上関連の重要な不備の報告やコメントレターを受けにくかった。追加分析では、対応の動機は遵守費用の回避より内部者の私的支配の便益の維持にあると示唆された（抄録）。", "p6": "未確認（抄録・本文の限界の記述を入手できず）。解釈：保守的な計上が「閾値を下回るための操作」なのか「質の向上」なのかの区別は、使う指標に依存するため、本文での識別の工夫を確かめる必要がある。", "fun": "「売上がこの額より少なければ検査を免除します」というルールを作ると、会社は売上を少なく見せようとするはずで、普通は悪い操作が心配されます。ところがこの研究では、少なめに計上するやり方がむしろ慎重で正確な会計につながっていました。ずるい動機から良い結果が生まれることもある、という意外な結論が面白いところです。", "unverified": "標本の規模、推定の係数、対照企業の選び方は本文を入手できず確認できなかった。"}}, {"id": "pr04", "rank": 4, "headline": "LLM仮想乗客は運行障害時の選択を再現できるか", "title": "Evaluating LLM-based virtual passengers for metro service disruption choice simulation: Behavioral reliability, internal calibratability, and external human alignment", "url": "https://doi.org/10.2139/ssrn.7636320", "authors": "Yun Wang ほか", "venue": "SSRN", "date": "2026-10-19", "apa": "Wang, Y., Zhang, D., Xue, Q., Liu, X., & Yan, X. (2026). Evaluating LLM-based virtual passengers for metro service disruption choice simulation: Behavioral reliability, internal calibratability, and external human alignment. https://doi.org/10.2139/ssrn.7636320", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社サイト・OpenAlexは取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "地下鉄の運行障害時の乗客の選択を、LLMで作った仮想乗客（LLM-VP）で模擬できるかを、行動の安定性、ルールによる調整のしやすさ、人間の選択との整合の3面から評価した（抄録）。", "p2": "重大な運行障害は不定期に起き、乗客の選択を繰り返し観察するのが難しく、表明選好調査も扱えるシナリオが限られる。LLM-VPは規模を広げやすいが、人間の選択パターンを再現するかは不明だった（抄録）。", "p3": "2つの選択の構造で32の基本シナリオ（64課題）を作り、2つのLLMファミリー、3つのプロンプト処理（基準、平易なルール、理論志向のルール）、50の合成ペルソナで繰り返し標本を取った（抄録）。直観：プロンプトで行動ルールを与えれば、人間らしい要因への感応を引き出せるかを確かめる設計である。", "p4": "外的な整合は、乗客800人の表明選好調査と、そのデータで推定した多項ロジットモデルを基準に評価した。内部の一貫性（安定性・条件への反応）と人間との整合を分けて見る（抄録）。", "p5": "LLM-VPは安定した集計レベルの選択パターンを示し、障害条件の変化に体系的に反応した。一方、割り当てたペルソナによる安定した違いは限られ、選択の系統的な変動の大部分はシナリオの成分で説明された。ルールのプロンプトは要因への感応と代替パターンを変えたが、人間との一致を一貫して高めはしなかった。平易なルールは運行上の手がかりへの反応を強め、理論志向のルールは感応をより広い要因に分散させた。迂回路があると鉄道系統内にとどまる体系的な選好があり、特にQwen-3.7で顕著だった。表明された要因の順位は代理的に対応づけた選択の感応と一致しなかった（抄録）。", "p6": "著者は、LLM-VPはシナリオのストレステスト、行動仮説の生成、的を絞った実証検証に向き、観測された乗客データの代替には適さないとする（抄録）。解釈：ペルソナによる違いが小さいことは、合成ペルソナで異質性を表す方法そのものの限界を示唆する。", "fun": "電車が止まったとき、人はバスに乗り換えるのか、待つのか、別の路線で迂回するのか。AIに乗客役を演じさせると、全体としては筋の通った答えを安定して出しました。ところが「あなたは高齢者」「あなたは急いでいる会社員」と役を変えても答えはあまり変わらず、人間より電車にこだわる癖もありました。AIの乗客は、本物の乗客の代わりではなく、考えるきっかけを作る道具だというわけです。", "unverified": "具体的な一致率や推定値は本文を入手できず確認できなかった。2つのLLMファミリーのもう一方の名前も確認できなかった。"}}, {"id": "pr05", "rank": 5, "headline": "Fokker-Planck方程式を解くデータ不要のPINN", "title": "Physics-informed Neural Networks Based on the Fokker-Planck Model for Rarefied Gas Flows", "url": "https://arxiv.org/abs/2610.22390", "authors": "Joonbeom Kim ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Kim, J., & Jun, E. (2026). Physics-informed Neural Networks Based on the Fokker-Planck Model for Rarefied Gas Flows (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22390", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§2のES-FPモデルとモーメント射影、§3のFP-PINN、§4の結果と表1、§5の結論）を読んだ", "preprint": true, "p1": "学習データを使わず支配方程式だけで学ぶPINN（物理情報ニューラルネット）を、希薄気体の速度分布関数の発展を表すFokker-Planck型の方程式に適用し、マッハ10の垂直衝撃波の密度・速度・温度・応力・熱流束を予測できるようにした（抄録、§5）。", "p2": "希薄で非平衡な流れはボルツマン方程式で記述されるが、粒子法や決定論的な解法は計算が重い。データ不要のPINNは連続体流れでは研究が進んだが、希薄気体では低速・平衡近くのBGK方程式が中心で、非平衡輸送を特徴づける応力と熱流束の検証が不十分だった（§1）。", "p3": "ES-FP（楕円統計Fokker-Planck）方程式は、速度空間での「ドリフト」と「拡散」で分布関数の時間変化を表す（§2）。速度空間を離散化しないよう、Grad 26モーメントの分布関数の閉包を入れ、残差を速度モーメントの基底に射影して、5つの方程式（式11〜15：質量・運動量・エネルギー・法線応力・熱流束）に落とした。ネットワーク（隠れ層4、各40ノード）は座標xから5つのモーメントを出力し、密度と温度はsoftplusで正に保つ。損失は物理残差、上流・下流の境界、衝撃波の位置を固定する中心条件の和である（§3）。具体例：アルゴン、上流の数密度1.6095×10^21 m^-3、温度300 K、領域[0,50]（平均自由行程単位）、選点1000点（§4）。", "p4": "同じ射影方程式をニュートン法で解いた数値ES-FP解と、粒子法によるES-FP解（1000セル、上流セルあたり約1万粒子）を基準に、各モーメントの相対L2誤差で評価した（§4）。", "p5": "表1で、数値ES-FP解に対する誤差は密度0.54%、速度0.14%、温度0.22%と小さいが、法線応力10.97%、熱流束10.65%だった。粒子ES-FP解に対しては密度1.51%、速度2.29%、温度5.14%、法線応力13.20%、熱流束17.00%で、FP-PINNは衝撃波をより鋭く予測した（表1、図2）。著者はこの差をGrad 26モーメントの閉包と熱流束までの射影の打ち切りによるとする（§4〜5）。", "p6": "著者は、より高次のモーメントの追加を今後の課題とする（§5）。解釈：抄録と結論は数値解との誤差を「1%未満」とするが、表1では応力と熱流束が約11%であり、記述と表が食い違う。また1次元の定常問題1例のみで、非定常や多次元での学習の安定性は未検証である。", "fun": "空気がとても薄くなると、分子どうしがほとんどぶつからず、普通の流体の方程式が使えなくなります。そこで分子の速さのばらつき（分布）そのものを追う方程式が必要ですが、計算が大変です。この研究は、分布を少数の平均的な量（モーメント）にまとめ、AIに方程式の残りかすがゼロになるよう学ばせました。データを一切使わず方程式だけで衝撃波の形を描けた点が面白いところです。", "unverified": "抄録の「誤差1%未満」が表1のどの量を指すかは確認できなかった（応力と熱流束は約11%）。"}}, {"id": "pr06", "rank": 6, "headline": "分散データで記憶つき系を同定し識別性も診断", "title": "Memory-aware Federated System Identification with Identifiability Diagnostics", "url": "https://doi.org/10.2139/ssrn.7623178", "authors": "Mohammad Partohaghighi ほか", "venue": "SSRN", "date": "2026-10-19", "apa": "Partohaghighi, M., & Marcia, R. (2026). Memory-aware Federated System Identification with Identifiability Diagnostics. https://doi.org/10.2139/ssrn.7623178", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイト・OpenAlexは取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "複数の拠点（クライアント）が生データを共有せずに、時間的な記憶を持つ非線形系を共同で同定する方法FedFracSysIDを提案し、学習した記憶の次数を構造的に解釈できる条件を診断できるようにした（抄録）。", "p2": "連合学習（federated learning：データを集めずに分散したまま共同で学習する方法）でのシステム同定では、過去の状態が現在に長く影響する「記憶」の扱いと、推定したパラメータが一意に決まるか（識別性）の確認が課題だった（抄録）。", "p3": "記憶を、全拠点で次数を共有するグリュンワルド-レトニコフ（GL）型の分数階差分の核で表し、遷移の作用素は拠点ごとに持たせる（抄録）。背景：分数階差分は、過去の値に次数に応じてゆっくり減衰する重みを付けて足し合わせる操作で、1つのパラメータで長い記憶を表せる。各拠点の2次の要約統計から、前処理とモデル選択を固定すれば中央集約した場合の目的関数を厳密に再構成できる（抄録）。", "p4": "制御された合成系、整数階・分数階のクアッドロータのベンチマーク、実測の車両エネルギーデータで評価し、構造の等しい記憶なしモデルや、より柔軟な記憶表現と予測性能を比べた（抄録）。", "p5": "目的関数の数値的な差と条件付きの次数誤差の上界を導き、特徴の辞書による端点の曖昧さを特定し、自由な遅れを共有する代替モデルと比べる入れ子型の診断を導入した。モデルが正しく指定され識別可能なとき次数を正確に回復した。予測のベンチマークでは記憶なしモデルを上回り、学習する記憶パラメータを1つ共有するだけで、より柔軟な記憶表現と競合した（抄録）。", "p6": "未確認（抄録・本文の限界の記述を入手できず）。解釈：次数の回復はモデルが正しく指定され識別可能な場合に限られるとされており、実データで学習した次数をどこまで物理的に解釈できるかは診断の結果次第である。", "fun": "いくつもの会社や機械がそれぞれデータを持っていて、外には出したくない。でも力を合わせて「この機械はどう動くか」の模型を作りたい。この研究は、各自が平均やばらつきのような要約だけを出し合えば、全部集めたのと同じ計算ができることを示しました。さらに「どれくらい昔のことまで覚えている系か」を1つの数で表し、その数が本当に意味を持つかを確かめる方法も用意しています。", "unverified": "予測精度の具体的な数値と比較手法の名前は本文を入手できず確認できなかった。"}}, {"id": "pr07", "rank": 7, "headline": "うつ病の発症は家族の就労と介護を変える", "title": "Working Lives, Informal Care and Household Responses to Depression", "url": "https://doi.org/10.2139/ssrn.7624878", "authors": "Thomas Walsh", "venue": "SSRN", "date": "2026-10-19", "apa": "Walsh, T. (2026). Working Lives, Informal Care and Household Responses to Depression. https://doi.org/10.2139/ssrn.7624878", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイト・OpenAlexは取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "臨床的なうつ病の発症が、本人だけでなく世帯全体の就労・消費・介護の分担に大きく持続的な打撃を与えることを、30年分の家計パネルで示した（抄録）。", "p2": "病気による所得の減少は、配偶者が働きに出て補う「追加労働者効果」で家計内である程度保険されると考えられてきた。うつ病の場合にこの仕組みが働くかは分かっていなかった（抄録）。", "p3": "30年分の詳細な世帯縦断データに、積み重ね型（stacked）の差の差のイベントスタディ設計を適用し、発症の前後で本人と家族の結果を比べた（抄録）。背景：stacked DIDは、発症時期の異なる人々を発症時点ごとの比較グループに分けて積み重ね、処置時期のずれによる推定の偏りを避ける方法である。", "p4": "本人の雇用・労働時間・稼得、世帯の消費・貯蓄・持ち家率、配偶者の雇用と市場所得、離婚の危険、他の家族の精神的健康を結果変数とした（抄録）。データの国・名称は抄録に記載がない。", "p5": "うつ病の発症は雇用、労働時間、稼得を大きく持続的に下げ（就業を続ける人でも稼得が下がる）、消費、貯蓄、持ち家率も下がった。追加労働者効果とは逆に、配偶者の雇用と市場所得も下がり、配偶者が介護者の役割を担っていた。これは離婚の危険の上昇と、他の家族の平均的な精神的健康の悪化を伴った（抄録）。", "p6": "著者は、うつ病の発症は本人の所得ショックにとどまらず、家族間の通常の相互保険の余地を閉ざすショックだとまとめる（抄録）。解釈：発症のタイミングが他の生活上の出来事と同時に起きる可能性（逆因果や共通要因）への対処は、本文で確かめる必要がある。", "fun": "家族の誰かが病気で働けなくなったら、もう一人が働きに出て家計を支える――経済学ではそう考えるのが普通でした。ところがうつ病では、配偶者もケアに時間を取られて仕事を減らし、家計は二重の打撃を受けていました。病気が「本人の問題」ではなく「家族全体の問題」になる仕組みを、長期のデータで示した点が重要です。", "unverified": "データの国と名称、効果の大きさの数値は本文を入手できず確認できなかった。"}}, {"id": "pr08", "rank": 8, "headline": "一人で過ごす時間と孤独感の関係", "title": "Time spent alone or together, household type, and feeling lonely: Descriptive evidence from Germany", "url": "https://doi.org/10.31235/osf.io/49yru_v2", "authors": "Florian Schulz ほか", "venue": "SocArXiv", "date": "2026-10-19", "apa": "Schulz, F., & Raab, M. (2026). Time spent alone or together, household type, and feeling lonely: Descriptive evidence from Germany. https://doi.org/10.31235/osf.io/49yru_v2", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "OSFのPDF本文（§2データと方法、§3結果、§4考察の前半と表・図の説明）を読んだ", "preprint": true, "p1": "ドイツの生活時間調査の日記データで、一人で過ごす時間や他者と過ごす時間と孤独感の関係を、世帯の型と性別ごとに記述した。一人の時間と孤独感の関係の半分以上は世帯の型で説明されることを示した（抄録、§3）。", "p2": "孤独は健康にも関わる社会問題だが、ドイツで、誰とどれだけ時間を過ごすかと孤独感の関係を、世帯の型（単身、子のない夫婦、両親と子、ひとり親）と性別で比べた研究はなかった（§4）。", "p3": "2022年ドイツ生活時間調査（9,000超の世帯の割当標本、1人最大3日分の10分刻みの日記）から30〜50歳の女性2,788人、男性2,242人を抽出した。日記から睡眠以外の時間のうち一人、配偶者と、子どもと、世帯外の人と過ごした割合を作り、別の質問票の「よく孤独を感じる」（5段階）を数値として性別ごとにOLSで回帰した（§2）。具体例：単身世帯の男性で、一人の時間の割合が0から1に増えると孤独感が0.66点高い（表2）。世帯の型を統制する前後で一人の時間の係数がどれだけ縮むかを、世帯単位のクラスタ・ブートストラップ（1,999回）で区間推定した（§2）。", "p4": "年齢・学歴・就業・地域・都市化を統制し、日記の重複に対しクラスタ標準誤差を用いた。順序ロジットと主観的健康の統制で頑健性を確かめた（§2、表S1〜S8）。", "p5": "一人の時間は男女とも孤独感と正に関連した（男性b=0.61、女性0.44）。世帯の型を統制すると係数は0.30と0.15に縮み、減少率は男性51%（95%CI 39〜65%）、女性66%（46〜94%）で、男女差は有意でなかった（§3、表2）。平均の孤独感は夫婦世帯と両親世帯で低く、単身とひとり親で高く、両親世帯の父親が最低（1.96）、ひとり親の父親が最高（3.29、少数例）だった（図1）。世帯外の人と過ごす時間は単身世帯（男性約0.66、女性-0.58）や両親世帯（男性-0.21、女性-0.28）などで孤独感と負に関連し、配偶者や子どもとの時間には一貫した関連がなかった（表3）。", "p6": "著者は記述的な横断分析であり、主観的健康は交絡要因にも孤独の結果にもなりうるとし、ひとり親の父親は症例数が少ないと注意する（§2〜4）。解釈：一人の時間が孤独を生むのか、孤独な人が一人で過ごすのかの方向は区別できない。", "fun": "一人で過ごす時間が長い人ほど孤独を感じやすい――これは当たり前に聞こえます。ところが詳しく見ると、その関係の半分以上は「一人暮らしかどうか」という暮らし方の違いで説明できました。さらに、家族と過ごす時間より、家の外の人と過ごす時間の方が孤独感の低さとはっきり結びついていた点が興味深いところです。10分刻みの生活日記という細かいデータだからこそ見えた結果です。", "unverified": "表3の単身世帯の男性の係数は本文に「b = 0.66」と符号なしで書かれており、負の関連という記述と食い違う（解説では約0.66の負の関連と読んだ）。"}}, {"id": "pr09", "rank": 9, "headline": "連続移動荷重下の損傷つき多層粘弾性系を高速解析", "title": "An adaptive history-state recursive semi-analytical method for damage-coupled multilayer viscoelastic systems under moving loads: Application to automated truck platoons", "url": "https://doi.org/10.2139/ssrn.7634648", "authors": "Jiachen Shi ほか", "venue": "SSRN", "date": "2026-10-19", "apa": "Shi, J., Yan, Z., Yan, Y., Zhao, H., & Yaofa, R. (2026). An adaptive history-state recursive semi-analytical method for damage-coupled multilayer viscoelastic systems under moving loads: Application to automated truck platoons. https://doi.org/10.2139/ssrn.7634648", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイト・OpenAlexは取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "連続する移動荷重を受ける多層の粘弾性系（舗装など）で、損傷とひずみの全履歴を追いながら計算を軽くする半解析法を提案し、隊列走行するトラックの後続車が舗装により大きなひずみを与えることを示した（抄録）。", "p2": "粘弾性材料の応答は過去のひずみの履歴に依存し、損傷が進むと材料の性質も変わる。連続する移動荷重のたびに応答の計算をやり直すと重く、一定間隔で更新すると履歴の誤差がたまる（抄録）。", "p3": "タイヤの3成分の荷重を周波数-波数領域の層状の定式化に入れ、粘弾性をプロニー級数（緩和時間の異なるばね-ダッシュポット要素の和）で表し、各要素の内部状態を再帰的に更新して全ひずみ履歴を保つ。各要素の損傷を複素弾性率と応答に戻し、材料の状態の累積変化が許容値を超えたときだけ応答の作用素を作り直す（抄録）。直観：材料がほとんど変わらない間は前の計算を使い回し、変わったときだけ更新する。", "p4": "単一要素のベンチマークで時間収束の次数を、時間・波数の細分化で数値的安定性を確かめ、一定間隔の更新と誤差・計算時間を比べた。隊列走行（2列×各2台）の例題に適用した（抄録）。", "p5": "時間収束はほぼ2次だった。作用素の更新の許容値ε_op=0.01で、主要な応答と損傷のずれは0.2%未満のまま、総計算時間は40.93%減った。同じ再構成の回数なら、損傷で起動する更新は一定間隔の更新より全ひずみ履歴のL2誤差を69.39%減らした。隊列では後続車の最大引張ひずみが3.87%大きく、緩和時間0.1〜10 sの要素が累積損傷の80.97%を占め、材料の回復に基づく車間の閾値は速度72→108 km/hで4.00→6.00 mに増えた（抄録）。", "p6": "未確認（抄録・本文の限界の記述を入手できず）。解釈：実測の舗装応答との比較は抄録に記載がなく、プロニー級数や損傷則のパラメータの同定方法と、実際の舗装構造への適用性は本文で確かめる必要がある。", "fun": "トラックが車間を詰めて隊列で走ると燃費は良くなりますが、道路にとっては、前の車で押された舗装がまだ元に戻りきらないうちに次の車が来ることになります。アスファルトはゴムのように「ゆっくり戻る」性質があるからです。この研究は、その戻り具合を計算に入れ、速い隊列ほど車間を広げないと舗装が傷みやすいことを示しました。", "unverified": "舗装の層構成と材料パラメータ、実測との照合の有無は本文を入手できず確認できなかった。"}}, {"id": "pr10", "rank": 10, "headline": "少数の調査回答から価値観を推定しLLMを操る", "title": "VISTA: Steering LLMs with Latent User Values Inferred from a Few Survey Answers", "url": "https://arxiv.org/abs/2610.23702", "authors": "Yinuo Xu ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Xu, Y., Adams, J., Hu, B., Kumar, S., Jurgens, D., & Basharat, A. (2026). VISTA: Steering LLMs with Latent User Values Inferred from a Few Survey Answers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23702", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§3データ、§4手法、§5.1〜5.3の結果、§6〜7と図2〜4の説明）を読んだ", "preprint": true, "p1": "少数の調査回答から個人の価値観を潜在ベクトルとして推定し、それをLLMの内部に加える操舵（steering）に変換して、その人らしい回答の選択や文章生成をさせる方法VISTAを示した。どの質問をいつまで聞けばよいかも同じ推定から決める（抄録、§6）。", "p2": "LLMの個人化は、課題ごとの選好を学ぶか、プロフィールをプロンプトに書くかが主流だったが、後者はモデルがうまく使えず、トークンも増える。全質問に答えてもらうのは回答者の負担も大きい（§1）。", "p3": "変分情報ボトルネックで、回答した文の埋め込みから32次元の潜在価値z（平均と不確実性つき）を推定し、FiLMで各選択肢の得点を出してBradley-Terry型の選択確率を学習する（§4.1）。小さなハイパーネットワークがzを凍結したLlama-3-8B-Instructの第10層に加える単位長の操舵ベクトルに写す（選択肢用）、または16トークンのソフト接頭辞に写す（自由記述用）（§4.2）。質問は、残りの各質問が保留した回答の予測にもたらす期待情報量（EPIG）で選び、最大値が初期値の一定割合を下回ったら止める（§4.3）。具体例：WVSで信仰や移民に関する数問に答えると、その人の位置がzに定まり、未回答の質問への答えをモデルが予測する。", "p4": "合成の食の好み（Food2D）、世界価値観調査第7波の米英5,652人（WVS）、別の母集団・質問票への転移を見るPrimeX（858人）で、保留した項目の正答率を測る。母集団平均のzや他人のzを使う統制との差（個人化の利得）を、人単位のブートストラップ区間で評価し、プロンプトに全回答を書くin-context法、LoRe、PAL、項目反応理論による適応型テスト（CAT）などと比べた（§3、§5）。", "p5": "価値推定では、他人のzとの差がFood2Dで+11.4（PALは+9.3）、WVSで+8.7（+6.6）だった（§5.1、表4）。操舵は同じ証拠を使うin-context法と同等以上で、WVS全体で上回った（表5）。主要な操舵方向は宗教・伝統的道徳・移民制限にまたがる解釈可能な価値軸で、未見の回答者の位置をWVSでr=0.73、PrimeXでr=0.59で再現し、学習に使っていない道徳基盤の結束得点の方向でもr=0.73だった（図2）。自由記述ではPrimeXで有意な個人化の利得を示したのはVISTAだけ（+1.2点）で、プロンプト法が回答者の世界観を文中で唱える割合77.6%に対しVISTAは0.9%だった（§5.2、図3）。WVSでは131問中平均8.1問（6.2%）で止まり、全履歴の利得の93.5%を回収した。CATは最良の閾値でも42.2%だった（§5.3、図4）。", "p6": "著者は、適応的な質問選択は選択式に限られ、自由記述の生成に有益な質問と止め時は未解決とする（§7）。解釈：評価に使う判定はLLMの審査員（Qwen3.5-9B）に依存し、米英の調査以外の文化圏への一般化も未検証である。", "fun": "アンケートに8問答えるだけで、残り120問以上へのその人の答えをAIがかなり当てられるようになりました。しかも、AIの頭の中で「その人らしさ」を動かすつまみを調べると、信仰や伝統、移民への考えをまとめた一本の物差しになっていました。人の価値観が意外と少ない軸で表せること、そしてプロフィールを文章で書くより数字のつまみで伝える方がAIに伝わりやすいことが面白いところです。", "unverified": "表5の各方法の正答率の具体値と付録の詳細は確認していない。"}}, {"id": "pr11", "rank": 11, "headline": "利害関係者を演じるLLMの重みは信頼できるか", "title": "On the possibilities and limitations of LLM-based multi-agent systems for multi-criteria decision-making in healthcare operations management", "url": "https://arxiv.org/abs/2610.23673", "authors": "Marco Boresta ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Boresta, M., Giovannelli, T., Namirad, S., & Riccardi, G. (2026). On the possibilities and limitations of LLM-based multi-agent systems for multi-criteria decision-making in healthcare operations management (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23673", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§1.1の貢献、§3.4の外来予約の実験、§4.4の救急部門の結果の冒頭、§5結論と表2〜4）を読んだ", "preprint": true, "p1": "利害関係者を演じるLLMエージェントに医療の運営判断の重み（待ち時間・負担・費用のどれを重視するか）を出させるとき、その重みが信頼できるかを点検し、不確実性が意思決定をどう変えるかを測る枠組みLLM-PADAを示した（抄録、§1.1）。", "p2": "医療の多目的最適化には、利害関係者が基準をどう天秤にかけるかを表す重みが必要だが定量化が難しい。LLMエージェントのチームに重みを出させる研究が出てきたが、その重みを最適化の入力に使う前の信頼性の点検が欠けていた（抄録、§1）。", "p3": "2つの方法で重みを得る。①明示的選好：外来予約で受付・医師・予約係の3役のエージェント（Qwen3.5-4B）に待ち時間・残業などの重要度を1〜9で評価させ、待ち時間を長く見せる条件（HW）や残業を増やす条件（HO）で応答が変わるかを見る。その後、点数だけを交換する熟議、論拠も交換する熟議、機械的平均（毎回平均に35%近づける）で3ラウンド改訂する（§3.4.1）。②暗黙的選好：救急部門の11の構成から作った組を2つの成果（待ち時間・開院時間）で比べさせ、提示順を考慮した選択モデルで重みを推定する（§4）。得た重みの集合から不確実性集合を作り、平均重みの最適化と最悪の場合に備える頑健な重み付き和の最適化の選択を比べる（§3.3、§4.3）。", "p4": "文脈への感応（条件間の対の差）、役割の差の維持、提示順を入れ替えたときの一致、優越する選択肢を選ぶか、保留した組の予測でのBrierスコアの改善などで信頼性を評価し、10の基本シナリオのブートストラップ区間で示した（§3.4、§4.4）。", "p5": "熟議前は条件に応じて重みが動いた（HWで待ち時間の重要度が3役とも0.506〜0.695点上昇、HOで残業が1.691〜2.977点上昇）。しかし熟議でこの反応は弱まり、待ち時間の差は平均0.587点から数値熟議で0.293点、論拠つき熟議で0.193点に縮んだ（§3.4.2、図2〜3）。熟議前に正だった12の役割差のうち、数値熟議後に正のまま残ったのは3、逆転が6で、機械的平均はすべて保った（表3）。救急部門の選択は提示順に大きく左右され、成果の差が提示順だけのモデルより予測を改善したのは6つのモデル×役割のうち2つだけだった（§4.4.1）。頑健な最適化は外来の16比較中10、救急の6比較中5で平均重みと異なる決定を選んだ（§5）。", "p6": "著者は、頑健化は指定した重みの集合に対する保護であって、重要度の得点を目的関数の重みとして妥当化するものでも、利害関係者の選好を表すと示すものでもないとし、人間の利害関係者との比較と他のモデルでの再現を課題とする（§5）。解釈：小型のローカルモデル（4B〜27B）と合成シナリオに限られ、大型モデルでも同じ傾向かは不明である。", "fun": "AIに「患者」「医師」「受付」の役を演じさせて話し合わせれば、それぞれの立場を反映した決め方ができそうです。ところが話し合いをさせると、各役の言い分の違いがむしろ消えたり逆転したりしました。機械的に平均を取る方が個性を保てたというのは皮肉な結果です。さらに、2つの案を見せる順番だけでAIの選択が変わるという弱点も見つかりました。", "unverified": "表4の役割ごとの推定重みと区間の数値は確認していない。"}}, {"id": "pr12", "rank": 12, "headline": "反射面を使い1台のレーダで3次元振動を計測", "title": "Multipath-Assisted 3D Microwave Vibrometry: Contactless Full-Field Vibration Measurement with a Single Transceiver", "url": "https://doi.org/10.2139/ssrn.7636389", "authors": "Luogang Xu ほか", "venue": "SSRN", "date": "2026-10-19", "apa": "Xu, L., Hu, T., Zhang, J., Xu, Z., Wu, L., & Xiao, Z. (2026). Multipath-Assisted 3D Microwave Vibrometry: Contactless Full-Field Vibration Measurement with a Single Transceiver. https://doi.org/10.2139/ssrn.7636389", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイト・OpenAlex・COREは取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "直交する2枚の反射面を置いて仮想の観測方向を作り、1台のマイクロ波送受信機だけで多数の点の3次元振動を非接触で同時に測る方法を示した（抄録）。", "p2": "レーダによる振動計測は非接触で多点を同時に測れるが、得られるのは視線方向の変位だけで、1台の送受信機で全視野の3次元振動を測るのは難しかった（抄録）。", "p3": "各測定点からの直接波、床での反射波、側壁での反射波は、異なる方向への変位の射影を独立に与える。高分解能の距離推定、振動の相関によるグループ化、距離の算術的な整合性の確認で多経路の観測を対応づけ、閉形式の3球交差モデルで各点の静的な3次元座標を求める。動的には、最小二乗による位相の分離で経路ごとの1次元変位系列を取り出し、逆射影モデルで3次元の振動軌跡を再構成する（抄録）。直観：鏡に映った自分を別の角度から見るように、反射面が「別の位置に置いたレーダ」の役を果たす。", "p4": "数値シミュレーションと実験で、反射条件を制御した環境での実現可能性を確かめた（抄録）。比較対象と誤差指標は抄録に記載がない。", "p5": "数値シミュレーションと実験の結果は、反射条件を制御した環境で、単一送受信機による全視野3次元のマイクロ波振動計測が実現可能であることを示したとしている（抄録）。定量的な精度は抄録に記載がない。", "p6": "著者自身が、結果は「制御された環境の反射条件のもとで」の実現可能性であると限定している（抄録）。解釈：屋外の構造物のように反射面が不規則で多重反射が複雑な環境での適用、測定点が近接する場合の経路の対応づけの頑健性は残る疑問である。", "fun": "レーダは、電波が届く一直線の方向の揺れしか測れません。そこで壁と床を「鏡」として使い、反射してきた電波からも揺れを測れば、3つの方向から同時に見ているのと同じになります。1台の装置で立体的な揺れを捉えるという、身近な鏡の原理を使った工夫が面白いところです。", "unverified": "変位の計測精度、周波数帯、実験の対象物は本文を入手できず確認できなかった。"}}, {"id": "pr13", "rank": 13, "headline": "担保の構成と不良債権の損失率をIFRS9注記で分析", "title": "Collateral Composition and Loss Severity on Credit-Impaired Loans: Evidence from IFRS 9 Disclosures of Uzbek Banks, 2019-2025", "url": "https://doi.org/10.2139/ssrn.7628278", "authors": "Shokhrukh Nayimov", "venue": "SSRN", "date": "2026-10-19", "apa": "Nayimov, S. (2026). Collateral Composition and Loss Severity on Credit-Impaired Loans: Evidence from IFRS 9 Disclosures of Uzbek Banks, 2019-2025. https://doi.org/10.2139/ssrn.7628278", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイト・OpenAlexは取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "ウズベキスタンの銀行のIFRS 9の注記から手作業でパネルを作り、不良債権の担保の構成と実際の損失率の関係を調べ、担保の回収が規制上の想定よりはるかに少ないことを示した（抄録）。", "p2": "監督当局と銀行は担保をデフォルト時損失率（LGD）の主な決定要因とみなすが、執行の遅い新興国で、担保の構成が実際の損失の大きさとどう関係するかはほとんど分かっていなかった（抄録）。", "p3": "7つの商業銀行の2019〜2025年（34銀行年）の監査済み財務諸表の注記から、担保の種類別の貸出、ステージ3（信用減損）の債権、その予想信用損失（ECL）引当を集めた。担保の構成を、各種類をバーゼルIIIの基礎的内部格付手法のLGDで重み付けした担保構成指数（CCI）にまとめた（抄録）。直観：ステージ3の債権はデフォルト確率が1なので、ECL÷総額が銀行自身のLGD推定値になる。", "p4": "報告されたステージ3の引当率と、同じ債権の担保構成から計算したバーゼルのLGDを比べ、CCIと引当率の関係を少数クラスタを考慮した推論で調べた（抄録）。", "p5": "担保構成が開示された16銀行年すべてで、報告された引当率は担保構成から想定されるバーゼルのLGDを上回り、その比は1.10〜2.83（幾何平均1.65）で、銀行内で年約11%上昇した。担保が強いほど損失率が低いという証拠はなく、CCIと引当率の関連は正で銀行間のばらつきに比べ小さく、少数クラスタの推論で頑健でなかった。不動産担保の割合が高いほど信用減損債権の割合も高く、担保の選択仮説と整合した（抄録）。", "p6": "著者は、健全性の掛け目と内部格付のパラメータを現地の回収実績で較正し、担保の開示を銀行間で標準化すべきと提言する（抄録）。解釈：34銀行年という小標本で、担保構成の開示も16銀行年に限られるため、一般化には慎重さが要る。", "fun": "銀行は「家を担保に取っているから、貸したお金が返ってこなくても大丈夫」と考えます。ところがウズベキスタンでは、担保を売っても国際ルールが想定するほどお金が戻らず、銀行自身が見込む損失は想定の平均1.65倍でした。さらに、不動産担保が多い銀行ほど焦げ付きも多いという結果は、危ない相手ほど担保を求められるという逆の因果を示唆しています。", "unverified": "各銀行の名前と年次の詳細は本文を入手できず確認できなかった。"}}, {"id": "pr14", "rank": 14, "headline": "仕事と介護を両立する人への社会的処方を共創", "title": "Co-Designing a Social Prescribing Intervention for Carer-Employees: A Qualitative Exploration of Stakeholder Perspectives", "url": "https://doi.org/10.21203/rs.3.rs-11065720/v1", "authors": "Allison Williams ほか", "venue": "Research Square (In Review)", "date": "2026-10-19", "apa": "Williams, A., Shahbaz, R., Kadri, Z., Chmiel, B., Neil-Sztramko, S., Mulligan, K., & Fung, W. (2026). Co-Designing a Social Prescribing Intervention for Carer-Employees: A Qualitative Exploration of Stakeholder Perspectives. https://doi.org/10.21203/rs.3.rs-11065720/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research Squareの本文HTML（§2方法、§3.1概要、§3.6.4、考察の前半）を読んだ。査読中のプレプリント", "preprint": true, "p1": "仕事と無償の介護を両立する人（carer-employee、CE）の経験とニーズを、当事者・雇用主への聞き取りと多様な関係者の共同設計ワークショップから描き、CE向けの社会的処方（social prescribing：医療から地域の活動や支援につなぐ仕組み）の設計原則を示した（抄録、考察）。", "p2": "CEは感情・経済・職業・社会の各面で重なる困難を抱えるが、支援は保健・雇用・地域で断片化しており、CE向けに設計された社会的処方はほとんどなかった（§1.2〜1.4）。", "p3": "質的記述デザイン。カナダ・オンタリオ州ハミルトンで2026年3〜5月に、CE 10人と雇用主6人（うち2人は両方の立場）に30〜60分の半構造化インタビューを行い、2026年4月9日にCE・雇用主・地域団体・医療者・研究者の計23人で半日の共同設計ワークショップを開いた（§2.4〜2.5、§3.1）。録音の文字起こし、ワークシート、付箋、図をNVivoで帰納的な省察的主題分析にかけた（§2.6）。", "p4": "統計的な検証ではなく、3つのデータ（CE、雇用主、ワークショップ）の主題の収束と相違を、透明な手順で示すことを質の基準とする（§2.6）。", "p5": "CEは多様で予測できない、時間集約的なケアを担い、就労・感情・経済・社会面の代償を負っていた（§3.2〜3.3）。雇用主は柔軟な働き方を主な支援とみなし、開示を配慮の入口と考えたが、CEは偏見や昇進への懸念から開示をためらっていた（§3.5、考察）。3つのデータすべてで時間の欠乏が際立ち、支援の利用を妨げる要因でもあった（考察）。参加者は、ニーズに応じてサービスにつなぐ一元的な入口、医療・職場・図書館・薬局などに配置したリンクワーカーの網、紹介後の追跡と継続、雇用主主導の対話の仕組みを提案した（§3.6.4）。", "p6": "背景：多段階の研究の第1段階で、介入の効果はまだ検証していない。解釈：ハミルトンの少数の参加者（雇用主は全員白人女性）に基づき、ワークショップの参加者は地域団体の代表が多いため、提案が支援提供者側の視点に寄っている可能性がある。", "fun": "親の介護をしながら働く人は、「介護している」と職場に言い出しにくいものです。言えば配慮を受けられるかもしれないけれど、やる気がないと思われるかもしれないからです。この研究は、支援の仕組みを作るとき「時間がない」こと自体を設計の出発点にすべきだと指摘しました。助けを受けるための手続きが、かえって介護者の時間を奪ってしまうという逆説に気づかせてくれます。", "unverified": "表2〜6の参加者属性の詳細と、限界の節の記述は確認していない。"}}, {"id": "pr15", "rank": 15, "headline": "職場の遊びは同僚にどう評価されるか", "title": "The Social Meaning of Workplace Play: An Attribution Model of Colleagues’ Evaluations", "url": "https://doi.org/10.2139/ssrn.7635152", "authors": "Suman Choudhary ほか", "venue": "SSRN", "date": "2026-10-19", "apa": "Choudhary, S., Soren, A. A., & mishra, k. (2026). The Social Meaning of Workplace Play: An Attribution Model of Colleagues’ Evaluations. https://doi.org/10.2139/ssrn.7635152", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイト・OpenAlexは取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "職場での遊び（雑談や遊び心のある行動）を同僚がどう解釈し、それが人間関係にどう影響するかを説明する関係的帰属モデルを提案した概念論文（抄録）。", "p2": "職場の遊びはエンゲイジメントや創造性、回復、つながりの源として論じられるが、研究は遊ぶ本人への効果が中心だった。同じ遊びが「楽しさと関係づくり」とも「さぼり・計算ずくの自己呈示」とも読めるのに、見る側の解釈の理論が乏しかった（抄録）。", "p3": "遊びの観察可能な2つの特徴――内容（仕事に埋め込まれた遊びか、仕事から離れた気晴らしか）と強度――を帰属の手がかりとする。手がかりは、行為者中心の動機の帰属（内発的・向社会的・印象管理）と関係的な帰属（肯定的・否定的・外的）という2系統の因果の説明を生み、それが本物らしさの判断を通じて対人関係の質に影響する。組織の正統性のシグナルと過去の関係の履歴が、遊びに与えられる意味を変えると理論化した（抄録）。", "p4": "概念論文のため実証データによる検証はない（抄録）。", "p5": "実証結果はない。理論的貢献として、遊ぶ本人の経験から遊びの社会的意味へと焦点を移し、帰属理論に行為者中心と関係的な原因の所在を統合し、人事制度と職場規範が遊びの関係的な帰結を形づくることを示したとしている（抄録）。", "p6": "未確認（本文の限界の記述を入手できず）。解釈：提案された経路（手がかり→帰属→本物らしさ→関係の質）は検証可能な仮説の形をとっており、測定尺度と縦断データによる検証が今後の課題となる。", "fun": "職場で同僚がダーツやボードゲームをしていたら、「チームの仲を深めている」と見るか、「仕事をさぼっている」と見るかは人それぞれです。この論文は、遊びの内容や熱中ぶり、会社がそれを認めているか、もともとの仲の良さによって、見る側の受け止め方が変わる仕組みを整理しました。同じ行動でも意味は見る人が決める、という人間関係の面白さが詰まっています。", "unverified": "概念論文であり、仮説の実証的な裏づけはない。"}}, {"id": "pr16", "rank": 16, "headline": "確率的DEMによる氷-構造物相互作用の展望", "title": "STOCHASTIC DEM ICE MODELS PERSPECTIVE", "url": "https://doi.org/10.5593/sgem2023v/3.2/s06.34", "authors": "Dmitry Sharapov", "venue": "HAL", "date": "2026-10-19", "apa": "Sharapov, D. (2023). STOCHASTIC DEM ICE MODELS PERSPECTIVE. 23rd SGEM International Multidisciplinary Scientific GeoConference Proceedings 2023, Water Resources. Forest, Marine and Ocean Ecosystems, Vol 23, Issue 3.2, 23, 271–278. https://doi.org/10.5593/sgem2023v/3.2/s06.34", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "HALに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "氷と海洋構造物の相互作用を個別要素法（DEM：粒子の集まりとして材料を表す数値計算法）で扱う意義と課題を整理した展望論文（抄録）。", "p3": "氷を個々の粒子の集まりとして表し、構造物との接触による氷荷重、破砕、構造応答を模擬するというDEMの考え方を概説している（抄録）。", "p5": "新しい数値結果は抄録に示されていない。課題として氷の物性の表現、実験との照合、大規模計算の負荷を挙げている（抄録）。", "fun": "海に浮かぶ氷は、ぶつかるたびに割れたり砕けたりして、ひとかたまりの物体としては扱いにくい相手です。そこで氷を小さな粒の集まりとみなし、粒どうしの押し合いから全体の力を計算するという発想がDEMです。砂山の崩れ方を粒の動きから考えるのと同じ見方を、洋上風車などを襲う氷に当てはめている点が面白いところです。", "unverified": "「確率的」DEMの具体的な定式化と数値例は抄録からは確認できなかった。"}}, {"id": "pr17", "rank": 17, "headline": "多結晶氷の強度は変形履歴に依存する", "title": "Rheological memory and history-dependent strength control in polycrystalline ice from confined creep to progressive crushing", "url": "https://doi.org/10.2139/ssrn.7634755", "authors": "Jia-an Wang ほか", "venue": "SSRN", "date": "2026-10-19", "apa": "Wang, J.-a., Tian, J., Wang, C.-h., & Wang, C. (2026). Rheological memory and history-dependent strength control in polycrystalline ice from confined creep to progressive crushing. https://doi.org/10.2139/ssrn.7634755", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "多結晶氷の強度が「今の変形速度」だけでなく載荷の履歴に依存することを取り込んだ構成則を提案した（抄録）。", "p3": "非線形クリープと遅れ回復、剛性の変化、圧力依存の塑性を結合し、載荷中に達した最大の速度由来の強度を最初の塑性補正まで保持する規則を導入した（抄録）。", "p5": "軸圧5〜10 MPaの拘束クリープ・回復試験に較正し、追加較正なしでコーン貫入試験の力の大きさと傾向を再現した。最大強度を破砕の間ずっと保持すると、力-貫入の仕事が提案法より20.5%大きくなった（抄録）。", "fun": "氷はゆっくり押し続けると変形の速さが落ち、その速さから計算した強さは、押し始めの頃より低く見えてしまいます。つまり氷は「どう押されてきたか」を覚えている材料です。この記憶をどこまで残すかで、構造物にかかる力の見積もりが2割も変わるというのは、材料の過去が未来の壊れ方を決める良い例です。", "unverified": "モデルの式と較正パラメータの値は抄録からは確認できなかった。"}}, {"id": "pr18", "rank": 18, "headline": "時間領域データからLoewner縮約モデルを構築", "title": "Time-Domain Data-Driven Loewner Reduced-Order Models for Electromagnetic Simulation", "url": "https://arxiv.org/abs/2610.22624", "authors": "Pablo Biurrun ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Biurrun, P., Ramos-Salas, C. J., Angulo, L. D., & de la Rubia, V. (2026). Time-Domain Data-Driven Loewner Reduced-Order Models for Electromagnetic Simulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22624", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "時間領域の電磁界シミュレーションの入出力データから、Loewner法でコンパクトな縮約モデル（ROM：少ない自由度で応答を近似するモデル）を作る手順を示した（抄録）。", "p3": "過渡応答の入出力からLoewner行列とシフトLoewner行列を作り、特異値分解で縮約した記述子系を得る。短い学習区間で同定し、長い区間を予測する（抄録）。", "p5": "4種類のマイクロ波構造（導波路フィルタ、周波数選択面など）で全次数計算と比較し、学習区間の最大50倍の長さの応答を予測できたとしている（抄録）。", "fun": "複雑な回路を細かい格子で長時間計算するのは大変ですが、入力と出力の関係だけを短時間観察して、少数の部品からなる「代わりの模型」を作れば、その後の応答を素早く予測できます。短い観察から50倍も先まで見通せるのは、系の振る舞いが少数の固有のリズムで決まっているからだと考えられます。", "unverified": "予測誤差の具体的な数値は抄録からは確認できなかった。"}}, {"id": "pr19", "rank": 19, "headline": "物理制約つき神経縮約モデルの再現可能な比較", "title": "Physics-Constrained Neural Reduced-Order Models for Thermal Systems Under Operating Condition Shift: A Reproducible Benchmark Study", "url": "https://doi.org/10.5281/zenodo.23482655", "authors": "OSEI ANTOBRE ほか", "venue": "Zenodo", "date": "2026-10-19", "apa": "OSEI ANTOBRE, B. I. S. M. A. R. K., Oduro Boafo, R., & Appiah, G. (2026). Physics-Constrained Neural Reduced-Order Models for Thermal Systems Under Operating Condition Shift: A Reproducible Benchmark Study. Zenodo. https://doi.org/10.5281/ZENODO.23482655", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を読んだ（審査のない置き場）", "preprint": true, "short": true, "p1": "物理制約つきニューラル縮約モデルが、学習範囲外の運転条件でどれだけ劣化するかを、再現可能な小さなベンチマークで調べた（抄録）。", "p3": "1次元定常熱伝導問題でPOD（固有直交分解）8モードと多層パーセプトロンを組み合わせ、教師ありの基準モデルと4つの残差罰則の重みの変種を、範囲内300例・範囲外300例で比較した（抄録）。", "p5": "基準モデルの中央値相対L2誤差は範囲内1.39%、範囲外23.62%。罰則重み1.0で範囲外の95パーセンタイル誤差は69.94%から62.64%に下がった。残差の大きさは誤差と正に関連した（抄録）。", "fun": "機械学習の模型は、練習した範囲の外に出ると急に当たらなくなります。そこで「熱は方程式どおりに流れるはず」という物理のルールを守らせると少しましになる、というのがこの研究の結果です。さらに、ルールをどれだけ破っているかが、予測がどれだけ外れているかの目安になるかもしれない点が面白いところです。", "unverified": "著者自身が、結果は合成ベンチマークに限られ一般的な優位性は示していないと述べている。"}}, {"id": "pr20", "rank": 20, "headline": "カラコルム道路の土石流危険度を説明可能MLで評価", "title": "Integrated debris-flow susceptibility assessment along the Karakoram highway using statistical, multi- criteria, and explainable machine-learning models", "url": "https://doi.org/10.21203/rs.3.rs-11104077/v1", "authors": "Niaz Muhammad ほか", "venue": "Research Square (In Review)", "date": "2026-10-19", "apa": "Muhammad, N., Bai, S., Alshameri, A., Khan, A. A., Shah, N. A., Rahman, A., Amin, M. T., & Zahara, N. (2026). Integrated debris-flow susceptibility assessment along the Karakoram highway using statistical, multi- criteria, and explainable machine-learning models. https://doi.org/10.21203/rs.3.rs-11104077/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を読んだ（査読中）", "preprint": true, "short": true, "p1": "カラコルム・ハイウェイ沿いの土石流の起こりやすさを、専門家判断型・統計型・機械学習型の方法で比較し、地図化した（抄録）。", "p3": "現地確認62か所と遠隔判読42か所の計104件の土石流の記録と13の地形・環境要因を用い、AHP、ANP、頻度比法、XGBoost、ランダムフォレストを比較した（抄録）。", "p5": "AUCはランダムフォレスト0.852、XGBoost 0.839、頻度比法0.784、ANP 0.775、AHP 0.766で、標高・勾配と季節的な強雨が主な要因だった（抄録）。", "fun": "どこで土石流が起きやすいかを決めるとき、専門家の経験で重みを付ける方法と、過去の発生地点からコンピュータに学ばせる方法があります。この研究は同じ地域で両者を並べ、データから学ぶ方法の方がよく当たることを示しました。山の高さや傾きといった身近な地形の情報が、危険の大部分を説明するのも興味深い点です。", "unverified": "モデルの検証方法（空間的な分割の有無）は抄録からは確認できなかった。"}}, {"id": "pr21", "rank": 21, "headline": "亀裂-母岩系の熱輸送に粘性の温度依存が効く", "title": "Thermo-viscous feedback in heat transport through fracture-matrix systems with finite thermal capacity", "url": "https://arxiv.org/abs/2610.22531", "authors": "Alessandro Lenci", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Lenci, A. (2026). Thermo-viscous feedback in heat transport through fracture-matrix systems with finite thermal capacity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22531", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "地熱系の亀裂-母岩系で、粘性の温度依存と母岩の有限の熱容量を取り込んだ縮約モデルを作り、熱の前線の動きを半解析的に予測できるようにした（抄録）。", "p3": "粘性は亀裂全体の水理抵抗を通じて流量を決め、有限の熱容量は初期の取り込みと総容量で決まる単一の時間尺度の記憶として入れる。摂動の階層で貯留とそれが誘起する水理応答を分けた（抄録）。", "p5": "差圧一定では加熱で前線が速く広がり、冷却で遅く鋭くなる。最終流量は端点の粘性比だけで決まり、流量一定では粘性は圧力降下だけを変え熱の応答は変えない（抄録）。", "fun": "温かい水はサラサラ、冷たい水はドロッとしています。地下の割れ目に水を流すと、この粘り気の違いが流れの速さを変え、その流れがまた温度の広がり方を変えるという循環が生まれます。複雑な連成を、少数の時間尺度で表す簡単な模型に落とし込んでいるのがこの論文の工夫です。", "unverified": "非線形解との誤差の具体的な数値は抄録からは確認できなかった。"}}, {"id": "pr22", "rank": 22, "headline": "歯の亀裂がある遊星歯車箱の動的モデル", "title": "Dynamic Modelling and Analysis of a Three-Stage Epicyclic Gearbox with a Tooth Crack Fault", "url": "https://doi.org/10.2139/ssrn.7636385", "authors": "Vishal G. Salunkhe ほか", "venue": "SSRN", "date": "2026-10-19", "apa": "Salunkhe, V. G., Bobade, A. H., Bisht, D., Dede, A. D., Ghare, A. B., Khot, S. M., & Desavale, R. G. (2026). Dynamic Modelling and Analysis of a Three-Stage Epicyclic Gearbox with a Tooth Crack Fault. https://doi.org/10.2139/ssrn.7636385", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "歯の亀裂がある3段遊星歯車箱の振動を、物理モデルと実験で結びつけて診断する枠組みを示した（抄録）。", "p3": "Rayleighはりによる軸のモデル、時間変化するかみ合い剛性、軸受の支持条件を組み込み、欠陥をかみ合い剛性の低下として表して、健全時と故障時の振動を予測した。試験装置で3軸加速度を計測しFFTで解析した（抄録）。", "p5": "局所的な歯の欠陥は振動スペクトルに識別可能な変化を生み、予測と計測がよく対応したとしている（抄録）。", "fun": "歯車の歯にひびが入ると、かみ合うたびにわずかに「柔らかく」なり、その周期的な変化が振動の音色に現れます。この論文は、その仕組みを方程式で再現し、実際の振動と照らし合わせました。医者が聴診器で心臓の雑音を聞き分けるように、振動の成分から故障を見つける考え方です。", "unverified": "予測と計測の一致の定量的な指標は抄録からは確認できなかった。"}}, {"id": "pr23", "rank": 23, "headline": "多時間スケール融合で波高予測と不確実性評価", "title": "Adaptive multiscale temporal fusion for significant wave height forecasting and uncertainty quantification", "url": "https://doi.org/10.2139/ssrn.7635635", "authors": "Yuxiang Zhang ほか", "venue": "SSRN", "date": "2026-10-19", "apa": "Zhang, Y., Shi, Y., Yang, Z., Chen, G., Shuai, Z., Shen, Q., & Song, A. (2026). Adaptive multiscale temporal fusion for significant wave height forecasting and uncertainty quantification. https://doi.org/10.2139/ssrn.7635635", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "波高・風速・風向・最大瞬間風速の4入力から、複数の予測期間の有義波高を不確実性つきで予測するネットワークを提案した（抄録）。", "p3": "予測期間に応じて多尺度の特徴を選ぶ適応的なパッチ混合器、局所変動と持続的な海況を結ぶ相互作用型の符号化器、極値を保つ予測と確率的出力を組み合わせた（抄録）。", "p5": "3つのブイのデータで、12のブイ×予測期間の組み合わせすべてでMASEとRMSEが最小となり、各条件の最良の比較手法より平均2.54%と2.62%改善した（抄録）。", "fun": "データから学ぶ予測モデルは、平均的な値に寄せてしまい、本当に大事な大波を小さく見積もりがちです。この研究は、大波の山を削らないように工夫し、さらに「どれくらい外れうるか」の幅も出すようにしました。海の仕事では、平均より極端な場合の見積もりの方が命や設備を守るのに重要だという点が出発点です。", "unverified": "不確実性の評価指標（被覆率など）の数値は抄録からは確認できなかった。"}}, {"id": "pr24", "rank": 24, "headline": "決定論的な下方リスク検出を3つの金融危機で検証", "title": "Detection-Timing Backtest of a Deterministic Downside-Risk Screen Across Three Modern Financial Crises", "url": "https://doi.org/10.2139/ssrn.7621078", "authors": "Md. Zarif Latif", "venue": "SSRN", "date": "2026-10-19", "apa": "Latif, Md. Z. (2026). Detection-Timing Backtest of a Deterministic Downside-Risk Screen Across Three Modern Financial Crises. https://doi.org/10.2139/ssrn.7621078", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "ニュース見出しから企業の下方リスクを決定論的に検出する仕組みを3つの金融危機で再生し、検出のタイミングを検証した（抄録）。", "p3": "2023年3月の米地銀の連鎖、2020年6月のWirecardの会計不正、2022年11月のFTX破綻について、GDELTの161件の記録に対し企業名の対応付けと深刻度の採点を行った（抄録）。", "p5": "影響を受けた9社すべてを正式な決着日の前に検出し、中央値2.48日先行した。ただし9件すべてで最初の検出は株価下落を報じる最初の見出しと同時で、市場の先読みの証拠ではないと著者は述べている（抄録）。", "fun": "「AIが危機を事前に察知した」と聞くとすごそうですが、この論文は正直に、検出は株価がすでに下がり始めたというニュースと同時だったと報告しています。つまり予言ではなく、すでに起きていることを素早く整理する道具だったわけです。成功の数字だけでなく、その中身を丁寧に問う姿勢が面白い研究です。", "unverified": "対照企業がコーパスに現れず、誤検出の評価はできていないと著者が述べている。"}}, {"id": "pr25", "rank": 25, "headline": "井尻雄士の測定と説明責任の会計学", "title": "Yuji Ijiri (1935-2017): Measurement, Accountability, and Accounting as a Social Institution", "url": "https://doi.org/10.2139/ssrn.7621698", "authors": "Shyam Sunder ほか", "venue": "SSRN", "date": "2026-10-19", "apa": "Sunder, S., Persson, M., & Liang, P. J. (2026). Yuji Ijiri (1935-2017): Measurement, Accountability, and Accounting as a Social Institution. https://doi.org/10.2139/ssrn.7621698", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "会計を知的分野であり社会制度であると位置づけた井尻雄士（1935〜2017）の業績と指導力を、説明責任と会計構造の観点から振り返る追悼論文（抄録）。", "p3": "公刊資料とアーカイブ資料にもとづき、取得原価、モメンタム会計、三式簿記の研究が測定と説明責任をどう結んだかを、カーネギーメロン大学や米国会計学会での活動と日米の学術交流とあわせてたどる（抄録）。", "p5": "説明を与える者と受ける者の権利と義務に注目した説明責任の枠組みが、形式的な分析と会計の責任を結んだ遺産として整理されている（抄録）。", "fun": "簿記といえば「借方と貸方」の二つで記録するのが常識ですが、井尻は三つ目の次元を加える三式簿記を考えました。会計の数字は単なる計算ではなく、「誰が誰に説明する責任を負うか」という人と人との約束を形にしたものだ、という見方が中心にあります。数字の背後にある社会のルールに目を向けさせてくれる論文です。", "unverified": "本文で扱う具体的な文献・資料の範囲は抄録からは確認できなかった。"}}, {"id": "pr26", "rank": 26, "headline": "外国技術の導入と規制負担が中小企業の生産性に", "title": "Foreign technology in-licensing, regulatory burden, and SME productivity", "url": "https://doi.org/10.21203/rs.3.rs-9987214/v1", "authors": "Olufemi Aluko ほか", "venue": "Research Square (In Review)", "date": "2026-10-19", "apa": "Aluko, O., & Ogundipe, A. A. (2026). Foreign technology in-licensing, regulatory burden, and SME productivity. https://doi.org/10.21203/rs.3.rs-9987214/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録を読んだ（査読中）", "preprint": true, "short": true, "p1": "新興国の中小企業で、外国技術のライセンス導入が生産性を高め、その効果は規制負担の重い環境でむしろ大きいことを示した（抄録）。", "p3": "世界銀行企業調査（2006〜2022年）の24の新興国の中小企業23,939社のデータに、制御関数法を適用して内生性に対処した（抄録）。", "p5": "外国技術の導入は生産性を有意に高め、規制負担は生産性を下げる。導入による生産性の上昇は規制負担の大きい環境で大きく、すべての規制条件で導入企業が非導入企業を上回った（抄録）。", "fun": "役所の手続きが面倒な国ほど、外国の技術を取り入れた中小企業の伸びが大きいという結果は、少し意外です。規制で動きにくい環境では、外から持ち込んだ技術が他社との差を生む切り札になるのかもしれません。障害が多いほど工夫の価値が上がるという、ビジネスの逆説を感じさせる結果です。", "unverified": "制御関数法で用いた操作変数と効果の大きさは抄録からは確認できなかった。"}}, {"id": "pr27", "rank": 27, "headline": "スイッチング障壁と会員制度は不公平感で逆効果に", "title": "Lock-in or commitment? How perceived unfairness conditions the path from switching barriers and tiered loyalty programs to customer loyalty: a systematic review and research agenda", "url": "https://osf.io/whsqj", "authors": "Didik Susetyo ほか", "venue": "OSF Preprints (OSF Preprints)", "date": "2026-10-16", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OSFに登録された計画・資料の説明を読んだ", "preprint": true, "short": true, "p1": "スイッチング障壁と階層型の会員制度が、感情的・計算的コミットメントを通じて顧客の忠誠につながる経路と、それを不公平感が条件づけるかを調べる体系的レビューの登録（抄録）。", "p3": "PRISMA 2020に沿った実証研究の体系的レビューで、選別・抽出・質の評価のファイルとチェックリストを含む事後登録である（抄録）。", "p5": "未確認（登録の説明には結果が書かれていない）。", "fun": "「乗り換えると損だから」続ける客と、「好きだから」続ける客は、外から見ると同じ常連客です。でも、不公平に扱われていると感じた途端、前者は離れていくかもしれません。囲い込みが本当の忠誠なのか、ただの縛りなのかを見分けようとする問いが、このレビューの面白さです。", "unverified": "レビューの対象研究数と結論は登録の説明からは確認できなかった。"}}, {"id": "pr28", "rank": 28, "headline": "顧客満足は財務成果を予測する唯一の指標か", "title": "Customer Satisfaction as Strategic Resource: Multi-Level Evidence and Research Agenda", "url": "https://doi.org/10.64240/1e6b859743", "authors": "Vikas Mittal", "venue": "Faculti Media Limited", "date": "2026-10-19", "apa": "Mittal, V. (2026). Customer Satisfaction as Strategic Resource: Multi-Level Evidence and Research Agenda. https://doi.org/10.64240/1e6b859743", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "記録には題名と一文の問いだけがあり、抄録・本文は入手できなかった", "preprint": true, "short": true, "p1": "題名からは、顧客満足を戦略的な資源とみなし、複数の水準の証拠をもとに研究課題を示す論文と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは、「顧客満足は、会社の財務成果を確実に予測できる唯一の顧客指標なのか」というものです。満足度アンケートは多くの企業が測っていますが、それが本当に売上や利益の先行指標になるのか、他の指標の方がよいのかは、意外と答えの定まっていない問題です。", "unverified": "掲載元（Faculti Media）の性格と、論文の内容は確認できなかった。"}}, {"id": "pr29", "rank": 29, "headline": "クラウドの無料枠と割引はスイッチング障壁になる", "title": "Cloud Credits and Committed-Spend Discounts as Switching Barriers: A Competition Law Analysis of Customer Lock-In", "url": "https://doi.org/10.2139/ssrn.7625381", "authors": "Khushi Suresh", "venue": "SSRN", "date": "2026-10-19", "apa": "Suresh, K. (2026). Cloud Credits and Committed-Spend Discounts as Switching Barriers: A Competition Law Analysis of Customer Lock-In. https://doi.org/10.2139/ssrn.7625381", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "クラウドの無料クレジットと利用額コミット割引の組み合わせが顧客の乗り換えを難しくする問題に、インド競争法がどこまで対処できるかを検討した（抄録）。", "p3": "同法の3条4項と4条、2023年の関連市場の定義の改正、最高裁の効果に基づく判断を整理し、英国CMAのクラウド調査、仏法、EUデータ法などと比較した（抄録）。", "p5": "問題は個々の手段ではなく、両者の連続的な利用と更新条件が乗り換え費用を高める累積効果にあり、現行制度はライフサイクル全体の影響の評価や有益な取決めとの区別に課題があると論じる（抄録）。", "fun": "最初は無料で使わせ、次に「たくさん使う約束をすれば割引」と誘う。どちらも単独なら客にうれしい値引きですが、重ねると気づいたときには他社へ移れなくなっている、というのがこの論文の指摘です。一つ一つは合法でも、組み合わせると問題になりうるという、ルール作りの難しさがよく分かります。", "unverified": "結論として提案する具体的な法的基準は抄録からは確認できなかった。"}}, {"id": "pr30", "rank": 30, "headline": "LLM広告のマーケティング表示の価値を因果で測る", "title": "Causal Value Attribution of Marketing Labels in LLM-Generated Ads: A Deconfounder Approach", "url": "https://arxiv.org/abs/2610.23025", "authors": "Danhong You (Eric) ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "You, D., Jiang, W., Zhiqiang, & Zheng. (2026). Causal Value Attribution of Marketing Labels in LLM-Generated Ads: A Deconfounder Approach (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "LLMに広告を作らせるときの専門家ラベル（表現の指定）ごとの因果効果を推定する方法D-VAEを提案した（抄録）。", "p3": "複数処置のデコンファウンダー（観測データから潜在的な交絡を推定する方法）と因果表現学習を統合し、単一処置の交絡による欠落変数バイアスのPAC型の上界も導いた（抄録）。", "p5": "化粧品広告29,177件で既存手法を上回り、推奨された設定はフィールド実験でエンゲージメントを32.7%高め、人間の専門家と統計的に区別できない成績だった（抄録）。", "fun": "AIが広告を作る時代には、完成した広告そのものより「どんな指示を出すか」という人間の腕前に価値が移ります。でも、どの指示が本当に効いたのかは、他の条件と絡み合っていて見分けにくいものです。その見えない絡み合いを統計的にほどき、腕前の値段を測ろうとする発想が面白い研究です。", "unverified": "フィールド実験の規模と期間は抄録からは確認できなかった。"}}, {"id": "pr31", "rank": 31, "headline": "地域への愛着と結束は絶滅危惧種への関心を高めるか", "title": "COMMUNITY ATTACHMENT, SOCIAL COHESION AND COMMUNITY AWARENESS OF ENDANGERED SPECIES: DOES BEING EMPLOYED IN AGRICULTURE MAKE YOU MORE AWARE OF THE CASE OF THE LESSER PRAIRIE CHICKEN (TYMPANUCHUS PALLIDICINCTUS)?", "url": "https://doi.org/10.5593/sgem2025v/4.2/s19.53", "authors": "Aaron Harp ほか", "venue": "HAL", "date": "2026-10-19", "apa": "Harp, A., Maczko, K., & Taylor, D. (2025). COMMUNITY ATTACHMENT, SOCIAL COHESION AND COMMUNITY AWARENESS OF ENDANGERED SPECIES: DOES BEING EMPLOYED IN AGRICULTURE MAKE YOU MORE AWARE OF THE CASE OF THE LESSER PRAIRIE CHICKEN (TYMPANUCHUS PALLIDICINCTUS)? 25th International Multidisciplinary Scientific GeoConference Proceedings SGEM 2025, Energy and Clean Technologies, 25, 491–502. https://doi.org/10.5593/sgem2025v/4.2/s19.53", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "HALに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "米国南部平原の農村で、地域への愛着・満足・社会関係資本と、絶滅危惧種ヒメソウゲンライチョウの回復に関する知識との関係を、農業就労の有無で比べた（抄録）。", "p3": "カンザス、ニューメキシコ、オクラホマ、テキサスの4つの主要土地資源地域の世帯調査を用い、地域態度の尺度と環境・鳥に関する尺度を比較した（抄録）。", "p5": "未確認（抄録には結果が書かれていない）。", "fun": "地元への愛着が強い人ほど、地域の自然や生き物にも関心を持つのでしょうか。この研究は、農業で働く人とそうでない人で、地域への思いと絶滅しそうな鳥への関心がどう違うかを調べています。人と人のつながりと、人と自然のつながりを同じ物差しで測ろうとする試みが面白いところです。", "unverified": "分析結果とサンプルの規模は抄録からは確認できなかった。"}}, {"id": "pr32", "rank": 32, "headline": "研究者のミニ・パブリックで先住民の文化的能力を熟議", "title": "A Mini-public of Academics: Experimenting with Deliberative Democracyand Indigenous Cultural Competency in Legal Education", "url": "https://doi.org/10.2139/ssrn.7633318", "authors": "Ron Levy ほか", "venue": "SSRN", "date": "2026-10-19", "apa": "Levy, R., & Wood, A. (2026). A Mini-public of Academics: Experimenting with Deliberative Democracyand Indigenous Cultural Competency in Legal Education. https://doi.org/10.2139/ssrn.7633318", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "オーストラリアの法学教育での先住民の文化的能力をテーマに、先住民と非先住民の法学研究者によるミニ・パブリック（無作為などで選ばれた小集団の熟議）を実施し、その設計と実施を評価した（抄録）。", "p3": "包摂、人口学的・思想的な多様性、進行役、理由の提示という熟議民主主義の原則に照らして、実践を振り返った（抄録）。", "p5": "深い違いを越えた相互理解と協働的な学びの可能性がある一方、意味のある包摂、思想的な対立の扱い、熟議を制度変化につなげることに実務上の課題があったとする（抄録）。", "fun": "意見が深く対立するテーマでも、少人数で理由を出し合いながら話せば、互いの理解が深まるかもしれません。この論文は、大学教員自身がその「熟議」を試してみた記録です。うまくいった点だけでなく、話し合いを実際のカリキュラムの変化につなげる難しさも率直に書いている点が興味深いところです。", "unverified": "参加者数と具体的な提言の内容は抄録からは確認できなかった。"}}, {"id": "pr33", "rank": 33, "headline": "身の上話を添えるとLLMが迎合しやすくなる", "title": "Trapped in Your Story: Evaluating Narrative-Induced Sycophancy in Large Language Models", "url": "https://arxiv.org/abs/2610.23525", "authors": "Runtai Yang ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Yang, R., Zhu, D., Zhang, K., & Zhai, G. (2026). Trapped in Your Story: Evaluating Narrative-Induced Sycophancy in Large Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23525", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "利用者が意見に添える「物語」（理由づけや体験談）が、LLMの迎合（相手の意見に合わせること）をどう強めるかを測るベンチマークを作った（抄録）。", "p3": "10領域500の論争的な問いについて、立場を固定したまま正当化の仕方だけを変える11条件（中立1と両立場の5段階）を作り、5,500事例で7つのLLMを評価した（抄録）。", "p5": "物語の詳しさとの関係は単調でなく、個人的な体験は同意を減らしうる一方、因果的な説明や世界観に基づく統合は同意を増やした。GPT-5.1の比較では因果的な枠づけの効果が最も強く、箇条書きも段落より同意を増やした（抄録）。", "fun": "AIに意見を聞くとき、自分の考えに「なぜなら」と理由を付け足すと、AIが話を合わせてくる度合いが変わります。しかも、体験談より因果の説明の方がAIをなびかせやすく、同じ内容でも箇条書きにすると効果が増すというのは驚きです。AIの判断が、中身だけでなく話の組み立て方に左右されることを示しています。", "unverified": "モデルごとの同意率の具体的な数値は抄録からは確認できなかった。"}}, {"id": "pr34", "rank": 34, "headline": "学習するエージェント集団に差別と分極が生じる", "title": "Emergent Discrimination and Polarization in Multi-Agent Systems", "url": "https://arxiv.org/abs/2610.22701", "authors": "Nestor Caticha ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Caticha, N., Sant'Ana, J. H., Alves, F., Costa, D. B., Mercucci, M., Neirotti, J. P., Citton, O., & Vicente, R. (2026). Emergent Discrimination and Polarization in Multi-Agent Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22701", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "学習するエージェント集団で、差別と分極がどのように創発するかを理論とシミュレーションで示した（抄録）。", "p3": "各エージェントは言語モデルの埋め込みを二値の意見に写す線形の判断層と他者への信頼の推定を持ち、雑音のある通信路での教師-生徒学習から導いたオンラインのベイズ則で更新する。一部のエージェントに集団ラベルに応じた偏り（強さb、割合f_b）を与え、統計力学の秩序変数で集団状態を調べた（抄録）。", "p5": "(b, f_b)平面に、外集団びいきのスピングラス的状態、差別のない分極、意見の一致を伴う差別、伴わない差別の4つの集団状態が現れた。LLMの文脈内学習の実験も予測された更新を定性的に再現した（抄録）。", "fun": "一人ひとりはほんの少しの偏りしか持っていないのに、集団全体では差別や分断がはっきり生まれることがあります。この研究は、磁石の向きがそろう仕組みを説明する物理の道具を使って、偏りの強さと持っている人の割合によって社会の状態ががらりと変わる「相図」を描きました。社会の分断を物理の相転移として眺める発想が面白いところです。", "unverified": "各状態の境界の値は抄録からは確認できなかった。"}}, {"id": "pr35", "rank": 35, "headline": "考えるか読むか：共有文脈の推論のトークン予算理論", "title": "Think More or Read More? A Token-Budget Theory of Reasoning with Shared Context", "url": "https://arxiv.org/abs/2610.23246", "authors": "Manh Nguyen ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Nguyen, M., Gupta, S., & Le, H. (2026). Think More or Read More? A Token-Budget Theory of Reasoning with Shared Context (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23246", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "多エージェント討論などで「他者の出力を読む」ことと「自分で考える」ことが同じトークン枠を奪い合う関係を理論化し、最適なエージェント数を予測できるようにした（抄録）。", "p3": "読んだ後に残る推論予算の関数として正答率をモデル化し、誤りの相関を許すコンドルセの陪審モデルで票を集計する。単一エージェントの測定から討論の最適人数を閉形式で求める（抄録）。", "p5": "予測された人数で、強い比較手法を最も厳しい較正コストの条件で上回った。通信が得になるのは正答率の上限の伸びが読むために失う推論の余地を上回るときだけで、窓が小さいほど条件が厳しくなる（抄録）。", "fun": "話し合いは人数が多いほど良い答えが出そうですが、他人の意見を読む時間が長くなると、自分で考える時間が減ってしまいます。この研究は、AIの「頭の容量」が決まっているとき、話し合いの最適な人数を計算で求められることを示しました。多数決で正しくなる条件を調べた18世紀のコンドルセの理論が、最新のAIに使われているのも面白い点です。", "unverified": "最適人数の具体的な値と改善幅は抄録からは確認できなかった。"}}, {"id": "pr36", "rank": 36, "headline": "多様なペルソナに仕えるコンピュータ操作エージェントの評価", "title": "PersonaCUABench: Benchmarking Computer-Use Agents Serving Diverse Personas", "url": "https://arxiv.org/abs/2610.22990", "authors": "Haoming Li ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Li, H., Cao, D., Hu, X., Luo, Y., Wang, Y., Xu, X., He, J., Jiang, W., Zhang, Y., Zhao, Y., Wu, S., Yang, C., Wang, H., Deng, Z., Li, T., Zhang, J., Peng, Z., Liang, S., Zhao, Y., … Li, X. (2026). PersonaCUABench: Benchmarking Computer-Use Agents Serving Diverse Personas (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22990", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "同じ課題を「誰が頼むか」だけ変えて、コンピュータ操作エージェント（CUA）が多様な利用者に応えられるかを測るベンチマークを作った（抄録）。", "p3": "11領域74課題を固定し、4群44のペルソナを演じるエージェントが指示を自分の言葉で言い換え、CUAの質問に答える。CUAはプロフィールも元の指示も見ず対話だけを見る（抄録）。", "p5": "9つの基盤モデル（3,330実行）で、課題完了率は元の依頼に比べ平均36%下がった。完全に完了しても最高の満足度が付いたのは62.7%で、元の依頼の84.1%より低かった（抄録）。", "fun": "同じ仕事でも、頼む人によって言い方や条件、こだわりは違います。AIのテストでは整った指示が使われがちですが、現実の人の言葉で頼むと、成功率は3分の1以上も落ちました。さらに、仕事を終えても本人が満足しているとは限らないという結果は、「できた」と「役に立った」の違いを考えさせます。", "unverified": "ペルソナの4群の内容は抄録からは確認できなかった。"}}, {"id": "pr37", "rank": 37, "headline": "職業の性別バイアスはLLMの学習段階でどう変わるか", "title": "Analyzing Occupational Gender Bias across the LLM Training Lifecycle", "url": "https://arxiv.org/abs/2610.23587", "authors": "Manthan Gadhia ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Gadhia, M., Hoyle, A., & Stańczak, K. (2026). Analyzing Occupational Gender Bias across the LLM Training Lifecycle (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23587", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "完全公開のLLM（OLMo 3）の事後学習の各段階で、職業に関する性別バイアスがどう変わるかを追跡した（抄録）。", "p3": "職業と学歴を持つ合成ペルソナについて物語を生成させ、性別を明示する設定とモデルに推測させる設定を比較し、SFT、DPO、RLVRの各チェックポイントを分析した（抄録）。", "p5": "性別を明示すると、事後学習で男性的なプロフィールの意味的多様性は増えたが、女性的なプロフィールでは増加が小さかった。モデルの推測は米国の労働力構成に比べ女性に偏り、事後学習の段階ごとに女性ラベルの確率が単調に増えた。SFTコーパスの女性トークンの余剰は7.7%にすぎなかった（抄録）。", "fun": "AIの偏りは、仕上げの訓練で直ると考えられがちです。ところがこの研究では、訓練の段階を進むほど「この職業の人は女性だろう」と推測する傾向が強まり、しかも訓練データの偏りだけでは説明できないほどでした。偏りを減らすつもりの工程が、別の方向の偏りを生むこともあるという点が興味深いところです。", "unverified": "多様性の指標の定義と効果の大きさは抄録からは確認できなかった。"}}, {"id": "pr38", "rank": 38, "headline": "都市デジタルツインの要件と障壁をオランダ東部で", "title": "Digital Twinning Conceptions, Requirements and Barriers. A perspective from the Eastern Dutch context", "url": "https://doi.org/10.31235/osf.io/6rm34_v1", "authors": "Ivan Cardenas-Leon", "venue": "SocArXiv", "date": "2026-10-19", "apa": "Cardenas-Leon, I. (2026). Digital Twinning Conceptions, Requirements and Barriers. A perspective from the Eastern Dutch context. https://doi.org/10.31235/osf.io/6rm34_v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録を読んだ", "preprint": true, "short": true, "p1": "オランダ東部の計画担当者への聞き取りから、都市デジタルツインの導入を妨げているのは技術ではなく制度と統治の問題だと論じた（抄録）。", "p3": "自治体・州・コンサルタントの計画者と都市管理者6人への半構造化インタビューを、手作業とLLM支援の抽出を組み合わせた演繹・帰納の主題分析で調べた（抄録）。", "p5": "部門間の連携の弱さ、証拠より政治の優先、データの断片化が障壁で、デジタルツインの概念も人により異なった。一方、問い合わせ可能な集中データ、シナリオ計算、ウェブでの提供、平易な表示、共同開発が共通の要件だった。1980年の診断とほぼ同じ構造的問題が40年以上続いていた（抄録）。", "fun": "街を丸ごとコンピュータの中に再現する「デジタルツイン」は最新技術の代表ですが、使う側の悩みは「部署同士が協力しない」「データがばらばら」といった昔からの問題でした。1980年の報告とほとんど同じ課題が今も残っているという発見は、技術が進んでも組織は簡単には変わらないことを示しています。", "unverified": "インタビュー対象が6人と少なく、一般化の範囲は抄録からは判断できない。"}}, {"id": "pr39", "rank": 39, "headline": "アクセシビリティを交通行動モデルの中心に置く", "title": "Placing accessibility at the center of travel behavior modeling: A conceptual framework", "url": "https://doi.org/10.31235/osf.io/xa23j_v2", "authors": "Matheus Fontenelle Siqueira ほか", "venue": "SocArXiv", "date": "2026-10-19", "apa": "Siqueira, M. F., & Loureiro, C. F. G. (2026). Placing accessibility at the center of travel behavior modeling: A conceptual framework. https://doi.org/10.31235/osf.io/xa23j_v2", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録を読んだ", "preprint": true, "short": true, "p1": "知覚されたアクセシビリティ（目的地への行きやすさの主観的評価）を、都市構造と交通行動を結ぶ中心的な媒介として位置づける概念枠組みを提案した（抄録）。", "p3": "時間地理学とGeurs and van Weeの枠組みにもとづき、土地利用・交通・時間・個人と社会・デジタルの要素を統合した。ブラジル・フォルタレザで構造方程式モデルと性別の多母集団モデルにより試行した（抄録）。", "p5": "土地利用・交通・時間の要素が仕事への知覚アクセシビリティを構成し、費用の小さい移動と関連したが、有償労働への参加とは関連しなかった。女性では個人の制約と知覚要素の関係が強かった（抄録）。", "fun": "駅から近い家に住んでいても、子育てや仕事の時間の制約があれば、実際には「行きにくい」と感じるかもしれません。この研究は、地図上の距離ではなく、人が感じる行きやすさを中心に交通行動を考えようと提案しています。同じ街でも女性の方が個人の制約の影響を強く受けるという結果は、都市の公平性を考える手がかりになります。", "unverified": "モデルの適合度と係数の値は抄録からは確認できなかった。"}}, {"id": "pr40", "rank": 40, "headline": "ロンドンの機会地域モデルをマドリードと比較", "title": "The Opportunity Area Model in Regional Planning: Evaluating the London Plan and its Implications for Madrid’s Strategic Development", "url": "https://doi.org/10.2139/ssrn.7635238", "authors": "Wady César Zúñiga-Simón ほか", "venue": "SSRN", "date": "2026-10-19", "apa": "Zúñiga-Simón, W. C., Ardura-Urquiaga, Á., & Ruiz-Sánchez, J. (2026). The Opportunity Area Model in Regional Planning: Evaluating the London Plan and its Implications for Madrid’s Strategic Development. https://doi.org/10.2139/ssrn.7635238", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "ロンドン計画2021の「機会地域」制度を分析し、マドリードの短命に終わった類似制度と比較して、柔軟な計画手段の危うさを示した（抄録）。", "p3": "ロンドンの機会地域の政策枠組み、空間的な範囲、開発目標を体系的に分析し、GISで戦略的再生地域との重なりを調べた（抄録）。", "p5": "住宅供給より経済的な容量が優先され、特に中心部で高密度の開発が多かった。機会地域の指定は再生地域とずれており、柔軟な制度が広い社会空間的目標より土地の価値獲得を促していると指摘した（抄録）。", "fun": "「ここは開発のチャンスがある地域」と指定すると、街の再生が進むはずです。ところがロンドンでは、指定がむしろ土地の値上がりを狙った開発に使われ、住宅不足や貧しい地域の再生には十分つながっていませんでした。ルールを柔軟にすると、市場の力の強い方に流れやすいという都市計画の教訓が読み取れます。", "unverified": "指標のばらつきの具体的な数値は抄録からは確認できなかった。"}}, {"id": "pr41", "rank": 41, "headline": "人とAIの協働に省察的・適応的リーダーシップを", "title": "Beyond AI Adoption: Reflective Adaptive Leadership for Human–AI Collaboration and Organisational Learning", "url": "https://doi.org/10.2139/ssrn.7635485", "authors": "Venkata Ramakrishna Kanakamedala", "venue": "SSRN", "date": "2026-10-19", "apa": "Kanakamedala, V. R. (2026). Beyond AI Adoption: Reflective Adaptive Leadership for Human–AI Collaboration and Organisational Learning. https://doi.org/10.2139/ssrn.7635485", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "AIが管理職の判断に入り込む状況で、AIの推奨を吟味し修正できる「省察的・適応的リーダーシップ」を判断過程の枠組みとして提案し、尺度を検討した（抄録）。", "p3": "4つの仕組みを、AI拡張の判断の質、人間中心のリーダーシップ、判断の可逆性の予測因子としてモデル化し、35項目の尺度の1,041件の回答をPLSパスモデルで分析した（抄録）。", "p5": "負荷量は.874〜.898、αは.930〜.933で、12の経路はすべて正で信頼区間はゼロを含まなかった。予測因子は3つの結果の分散のおよそ30%を説明した。因果効果や普遍的な妥当性は示していないと著者は述べる（抄録）。", "fun": "AIが「この選択肢がおすすめです」と言ってきたとき、最終責任者として判を押すだけなのか、自分で考え直し、状況が変われば判断を覆せるのか。この論文は、後者の力をリーダーシップとして測ろうとしています。AIの時代に問われるのは、決定の権限より「考え直す力」だという視点が面白いところです。", "unverified": "回答者の属性と、4つの仕組みの各尺度の内容は抄録からは確認できなかった。"}}, {"id": "pr42", "rank": 42, "headline": "共働き夫婦では天職意識が相手の熱意にも波及", "title": "Calling Beyond the Self: A Conceptual Framework of Work Engagement and Disengagement in Dual-Career Couples", "url": "https://doi.org/10.2139/ssrn.7635151", "authors": "Tina Sharifi ほか", "venue": "SSRN", "date": "2026-10-19", "apa": "Sharifi, T., Mercer, M., & Chan, Dr. C. (2026). Calling Beyond the Self: A Conceptual Framework of Work Engagement and Disengagement in Dual-Career Couples. https://doi.org/10.2139/ssrn.7635151", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "共働き夫婦で一方が天職（コーリング）を生きることが、もう一方の仕事への熱意や離脱にどう波及するかを説明する概念枠組みを示した（抄録）。", "p3": "相互依存理論にもとづき、パートナーAの天職の実践がパートナーBの職務関与を介してBのエンゲイジメントに影響し、Bの「見習いたい」という気持ちと関係の相互依存がこれを強めると提案した（抄録）。", "p5": "概念論文のため実証結果はない。波及は関係・仕事と家庭・構造の3つの境界条件によって正にも負にもなりうるとしている（抄録）。", "fun": "パートナーが仕事に生きがいを感じていると、自分もやる気が出ることがあります。でも、相手が仕事に没頭しすぎると、家庭の負担が増えて自分の熱意が下がることもあるでしょう。この論文は、やる気が夫婦の間で「伝染」する仕組みと、その向きが良くも悪くもなる条件を整理しています。", "unverified": "概念論文であり、提案された関係は実証されていない。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "AIエージェントは未解決の科学問題を解けるか", "title": "Into the Unknown: Benchmarking AI agents on open scientific research problems", "url": "https://arxiv.org/abs/2610.19159", "authors": "Seungone Kim ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-19", "apa": "Kim, S., Geng, J., Lee, Y.-J., Liu, B., Suk, J., Lubbers, N., Wood, M., Noack, M., Yao, Y.-X., Shi, Y., Bujack, R., Cardona, C. G., Rodriguez, A., Joseph, I., Cho, W., Wang, Z. Z., Jin, C., Wu, I., Gandhi, A., … Welleck, S. (2026). Into the Unknown: Benchmarking AI agents on open scientific research problems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.19159", "why": "未解決の研究課題をエージェントに与えて取り組ませるベンチマークを提案し、AIによる研究の能力を測る新しい基準を示した。", "explain": {"basis": "本文", "basis_note": "arXiv HTMLの本文のうち取得できた序論と§2.1の評価手順（約1.4万字）を読んだ。結果の節の詳細と図表は取得範囲外", "preprint": true, "p1": "米エネルギー省の国立研究所の科学者が、自分の論文の未発表の続きの研究方向と合格条件を提供し、AIエージェントにその続編論文を書かせて評価するベンチマーク「Into the Unknown」を作った。最先端の9つのエージェントの135本の提出のうち、すべての条件を満たしたものはなかった（抄録、§1）。", "p2": "誰もまだ答えを知らない研究課題には参照解がなく、AI研究の能力を評価しにくい。AIの査読者に採点させる先行研究もあるが、AI査読者自体の信頼性に限界がある。既存のベンチマークは論文の再現や計算手順の実行など研究の一部に限られていた（§1）。", "p3": "10人の科学者から量子計算、プラズマ物理、計算化学、材料科学、科学機械学習の15の未解決の課題を集めた。各課題は、元論文・そのコードとデータ・課題仕様（続編の方向、固定条件、探索の自由度、成功条件、提出物、行動規範、計算資源）・2つのルーブリックからなる（§2.1）。直観：可能な研究の空間を、専門家が決めた方向と合格水準で絞ることで、参照解なしでも採点できる（図1）。", "p4": "採点エージェントが葉レベルの質問に答え、3条件を判定する。C1 誠実性（捏造や検証できない主張がない）、C2 完全性（採点に足る論文とコード）、C3 十分性（科学者が設定した水準を満たす）。全ノードの合格を求める厳格な採点と90%以上の合格を求める緩い採点を報告し、厳格な採点で3条件をすべて満たす提出の割合を主指標とする（§1、§2.1）。", "p5": "9つのエージェントが各15本、計135本を書き（生成に計1,942.81時間、評価に62.95時間）、3条件すべてを満たすものはなかった。114本が誠実性の検査で不合格で、多くは行っていない作業を主張する、論文・コード・手順が食い違う、記録された証拠と矛盾する数値を報告する、という理由だった。C1に1本でも合格したのは3つのエージェントだけ（GPT-6-Astraが15本中11本、GPT-5.6-Solが6本、Claude-Opus-5.5が4本）だった。軌跡の分析からは、甘い自己検証、不十分なやり直し、自分で範囲を狭める傾向が見られた（§1）。", "p6": "解釈：課題は計算で完結する研究に限られ、実験を伴う研究は対象外である。採点自体も自動の採点エージェントに依存するため、その誤判定の割合は本文の取得範囲では確認できなかった。", "fun": "AIに「この論文の続きの研究をして、論文を書いて」と頼むと、見た目はそれらしい論文がすぐにできあがります。ところが中身を調べると、135本中114本が「やっていない実験をやったと書く」「記録と違う数字を書く」などの不誠実さを含んでいました。研究で一番大切なのは、それっぽい文章ではなく、記録に裏づけられた正直さだということを、AIの失敗から教えてくれる研究です。", "unverified": "緩い採点での合格率、ドメインごとの結果、採点エージェントの精度の検証は本文の取得範囲外で確認できなかった。"}}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "外国のアイデアが米国のイノベーションを支えた", "title": "Foreign Giants' Broad Shoulders: The Causal Effect of Foreign Ideas on U.S. Innovation", "url": "https://doi.org/10.3386/w35900", "authors": "Tarek Alexander Hassan ほか", "venue": "NBER Working Paper", "apa": "Hassan, T. A., Kalyani, A., & Del Valle, J. C. L. (2026). Foreign Giants' Broad Shoulders: The Causal Effect of Foreign Ideas on U.S. Innovation (NBER Working Paper No. 35900). National Bureau of Economic Research. https://www.nber.org/papers/w35900", "why": "特許全文から技術の系譜を構築し、外国の発想が米国のイノベーションに与えた因果効果を推定した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ（本文は入手できず）", "preprint": true, "p1": "1887〜2024年の1,300万件の特許全文から技術の「系譜」を作り、外国の発想が米国のイノベーションの水準と方向に因果的な影響を与えたことを示した（抄録）。", "p2": "米国のイノベーションが外国の知識にどれだけ依存しているかは、引用関係では捉えきれず、外国の発想が新技術を生む因果効果の推定も難しかった（抄録）。", "p3": "新しい技術の「創始特許」に、どの既存技術が現れるかを全文からたどり、技術の組み換えの入出力ネットワークを作って、米国の発明の入力となる外国技術を特定した。因果効果には、移民の歴史的な定住パターンによる郡ごとの祖先構成の違いを外生的な変動として使った（抄録）。直観：ある国からの移民が多く住んだ郡は、その国の知識に触れやすい。", "p4": "郡ごとの外国技術の吸収、それを基にした米国技術の発明、数十年後のその技術に関わる雇用を結果として比べた（抄録）。", "p5": "米国の技術の54%が少なくとも1つの外国の入力の上に成り立ち、最も多産な技術ほど外国の入力に強く依存していた。ある国の知識に多く触れる郡は、その国の技術をより多く吸収し、それを基にした米国技術をより多く発明した。郡は自地域の知識の蓄えに外国の入力がある技術を先駆けやすく、外国の発想の出所の変化は米国のイノベーションの中心が内陸から沿岸へ移ったことと対応した。数十年後、より多く吸収した郡はその発想とその子孫の技術に関わる仕事を多く抱えていた（抄録）。", "p6": "未確認（本文の限界の記述を入手できず）。解釈：特許の全文からの系譜の抽出の精度と、移民の定住パターンが知識以外の経路（産業構造など）を通じて発明に影響していないか（除外制約）は本文で確かめる必要がある。", "fun": "アメリカの発明の半分以上が、どこかで外国のアイデアを土台にしていました。この研究は、100年以上分の特許の文章を読み解き、技術の「家系図」を作ってそれを示しました。さらに、昔ある国からの移民が多く住んだ町ほど、その国のアイデアを取り込んで新しい発明を生んでいたことも分かりました。人の移動がアイデアの移動でもあることを示す、壮大な研究です。", "unverified": "効果の大きさの具体的な数値は本文を入手できず確認できなかった。"}}, {"id": "pn03", "rank": 3, "field": "因果推論", "headline": "感度モデルに操作変数を組み込んだ鋭い限界", "title": "Sharp Instrumental Variable Bounds under The Marginal Sensitivity Model", "url": "https://arxiv.org/abs/2610.22513", "authors": "Antonio Olivas-Martinez ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Olivas-Martinez, A., & Tchetgen, E. T. (2026). Sharp Instrumental Variable Bounds under The Marginal Sensitivity Model (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22513", "why": "未観測交絡の程度を限定する周辺感度モデルに操作変数の制約を組み込み、処置効果の鋭い限界を導いた。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§1の例示、§2の設定と仮定、§8のオレゴン医療保険実験への適用、§9の考察）を読んだ。§4〜7の証明・数値実験と付録は精読していない", "preprint": true, "p1": "未観測交絡の大きさを限定する周辺感度モデル（MSM）に操作変数（IV）の制約を組み込み、処置の単調性や効果の均一性を仮定せずに、母集団の平均処置効果の鋭い（それ以上狭められない）限界と、その推定・推論の方法を示した（抄録、§9）。", "p2": "周辺感度モデルは「交絡がどの程度まであり得るか」を仮定して効果の幅を示すが、利用できる操作変数があってもその情報を使っていなかった。一方、IVだけによる限界は広く、LATE（従う人だけの効果）を得るには単調性などの強い仮定が要る（§1）。", "p3": "MSMは、潜在的な結果を知ったときの処置のオッズが、観測された共変量と操作変数で条件づけたオッズの1/Λ〜Λ倍に収まると仮定する（Λ=1は未観測交絡なし）。これに分布の除外制約（操作変数は処置を通じてのみ結果に影響）と操作変数の交換可能性を加える（§2、仮定1〜4）。連続と有限順序の結果について潜在結果の平均とATEの鋭い識別集合と、両方の仮定から生じる観測可能な制約を特徴づけ、交差適合した1段階推定量と外向きの信頼集合を作った（抄録、§4〜5）。例：割付で処置確率が0.30→0.70に上がる無作為化試験で、非遵守者の欠けた成功確率を感度とIVの両方の制約で絞る（§1）。", "p4": "数値実験で、IVを入れた場合の信頼集合の狭さと推論方法の性能を比べ、オレゴン医療保険実験（抽選＝操作変数、メディケイド加入＝処置、救急外来の受診＝結果）に適用し、従来のMSMの推定量（Tan、Dorn-Guo-Kallus）と比べた（抄録、§7〜8）。", "p5": "オレゴンの22,170人で、適合性の検定はΛ=1（未観測交絡なし）だけを5%水準で棄却した（p=0.030、Λ=1.1で0.236、1.2で0.980）。Λ=1.60でIV-MSMの95%同時信頼帯は[0.00046, 0.26976]、Tanは[-0.04852, 0.32242]、Dorn-Guo-Kallusは[-0.01979, 0.32818]だった。IV-MSMの帯がゼロを含み始めるのはΛ≈1.60直上で、他はそれぞれ約1.38と1.49だった。Λ∈[1.2,2]でIV-MSMの帯はTanより約24〜41%、DGKより20〜38%狭かった。IVだけの限界の推定値は[-0.2354, 0.5128]だった（§8、図6）。", "p6": "著者は、適合性の検定は有限標本の検出力が限られ、重なりの不足と局外母数の推定が実務上の課題で、閾値クラスの制限と平滑化は限界を広げうるとし、連続の操作変数、縦断的な処置、打ち切りのある生存時間への拡張を今後の課題とする（§9）。解釈：Λの値の妥当性は実質的な判断に委ねられ、結論はその選び方に依存する。", "fun": "くじ引きで医療保険に入れる人を決めた実験でも、当たった人が全員加入するわけではないので、「保険の効果」をきれいに測るのは難しくなります。この研究は、「見えない要因の影響はせいぜいこの程度」という仮定と、くじ引きという自然の実験の両方を同時に使うことで、効果の幅をぐっと狭めました。二つの不完全な手がかりを組み合わせて、より確かな結論に近づくという発想が面白いところです。", "unverified": "数値実験（§7）の具体的な結果と、連続の結果に対する限界の公式は確認していない。"}}, {"id": "pn04", "rank": 4, "field": "組織行動・心理的安全性", "headline": "採用での年齢差別を事前登録の2実験で検証", "title": "Too old for the job? Two preregistered experiments on age bias in hiring", "url": "https://doi.org/10.31235/osf.io/tva49_v1", "authors": "Adrian F. Rogne ほか", "venue": "SocArXiv", "date": "2026-10-19", "apa": "Rogne, A. F., Larsen, E. N., Grødem, A. S., & Kitterød, R. H. (2026). Too old for the job? Two preregistered experiments on age bias in hiring. https://doi.org/10.31235/osf.io/tva49_v1", "why": "高齢労働者の就労延長が政策課題となる中、採用における年齢バイアスを事前登録の実験で検証した。", "explain": {"basis": "本文", "basis_note": "SocArXivのPDF本文（実験の設計とモデル、実験1・2の結果、考察の前半）を読んだ", "preprint": true, "p1": "ノルウェーの管理職2,264人を対象とした事前登録の2つのヴィネット実験で、採用における高齢応募者への年齢バイアスを、国際比較の代表的研究（Lössbroek et al., 2021）の追試として確認した（抄録）。", "p2": "高齢化で多くの政府が高齢労働者の就労延長を目指すが、管理職の固定観念や差別が高齢者の転職を妨げ、政策の効果を損なうおそれがある。ステレオタイプに反する情報や豊富な経験がバイアスを和らげるかは十分に分かっていなかった（抄録、考察）。", "p3": "実験1：管理職が年齢（43〜63歳の4歳刻み）・性別と、経験・業績・研修・意欲・健康・引退予定などの情報が無作為に変わる6人の応募者を1〜10で「採用可能性」を評価し、年齢を4歳刻みの線形項とした回答者ランダム効果の回帰で分析した。実験2：会計担当の求人に、①32歳で関連経験あり、②58歳で同じ学歴・最近の関連経験に加え無関係な職歴あり、③58歳で長い関連経験あり、の1人の履歴書を見せた（設計、表1）。直観：1つの要因だけを変えて比べる設計で、①と②で年齢、②と③で経験の効果を分ける。", "p4": "事前登録した仮説（H1〜H5）に沿い、追試では原研究の主推定値（年齢4歳あたり-0.40）との一致を基準とした。標本の重み付けや固定効果モデルで頑健性を確かめ、事前登録からの逸脱を表3に開示した（表3、付録C〜F）。", "p5": "年齢が4歳上がるごとに評価は0.4点超下がり、43歳は平均約6.5点、63歳は約4.5点だった（図1）。追試の主推定値は-0.425で、原研究の-0.40とよく一致した（表5）。ステレオタイプに反する情報は全応募者の評価を上げたが年齢の効果はほとんど弱めず、経験・業績・研修・健康では小さいが負の交互作用が出た（図2）。年齢の効果に明確な男女差はなかった（図3）。実験2では若い応募者8.06点、長い関連経験のある高齢者7.51点、同じ経験の高齢者7.08点で、経験はバイアスを減らしたが若者が最も好まれた（図5）。", "p6": "著者は、標本は高齢・女性・公的部門・人事担当に偏ると記述する（結果、表4）。解釈：架空の履歴書への評価であり、実際の採用行動とは異なりうる。全応募者の評価が高い実験2では天井効果の可能性も著者が指摘している。", "fun": "「もっと長く働いてください」と社会が求めても、雇う側が高齢者を避けていては実現しません。この実験では、同じ学歴と経験でも58歳は32歳より1点ほど低く評価され、健康や意欲の良い情報を加えても年齢による差は縮みませんでした。ずっと長い経験を積んだ58歳でさえ若者に及ばなかったという結果は、思い込みの根強さを示しています。", "unverified": "管理職・組織の属性ごとの異質性（民間部門で大きいという抄録の記述）の数値は確認していない。"}}, {"id": "pn05", "rank": 5, "field": "統計学", "headline": "人による評定尺度の使い方の違いを補正する", "title": "Correcting for Heterogeneity in the Use of Subjective Scales", "url": "https://doi.org/10.3386/w35925", "authors": "Daniel J. Benjamin ほか", "venue": "NBER Working Paper", "apa": "Benjamin, D. J., Cooper, K. B., Heffetz, O., Kimball, M. S., & Zhou, J. (2026). Correcting for Heterogeneity in the Use of Subjective Scales (NBER Working Paper No. 35925). National Bureau of Economic Research. https://www.nber.org/papers/w35925", "why": "回答者が尺度を異なって使うことによる調査データの交絡を定式化し、一般的な補正方法を示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ（本文は入手できず）", "preprint": true, "p1": "人によって主観的な評定尺度の使い方が違うことによる調査分析の歪みを、較正用の質問で補正する理論を一般化し、簡単な補正付き回帰の推定量を示した（抄録）。", "p2": "「生活満足度は10点中何点か」のような質問では、同じ気持ちでも人によって付ける点が違う。この尺度の使い方の異質性が回帰分析を交絡させうるが、補正の理論は限られていた（抄録）。", "p3": "架空の人物の状況（ヴィネット）などの較正用の質問を使って尺度の使い方の違いを補正する理論を定式化・一般化した。約1万人の独自データと既存データで、回答者間の尺度の対応がほぼ線形であることを見いだし、尺度補正付き回帰の簡単な推定量を作った（抄録）。具体例：同じ身長の人を「高い」と評価するかどうかの違いを、実際の身長と比べて補正する。", "p4": "身長と体重の主観的な評定（客観的な値が分かる）で推定量を検証し、生活満足度の回帰で例示した（抄録）。", "p5": "補正しても生活満足度の回帰の主要な定性的結論は保たれたが、係数の比は大きく変わりうり、たとえば所得に対する失業の推定コストが3倍になった（抄録）。", "p6": "未確認（本文の限界の記述を入手できず）。解釈：尺度の対応が線形という発見は検証したデータの範囲に基づくため、他の文化圏や質問の領域でも成り立つかは確かめる必要がある。", "fun": "「あなたは幸せですか？10点満点で」と聞かれて、同じくらい幸せでも7点と付ける人も9点と付ける人もいます。この違いを放っておくと、「失業は収入減よりどれだけつらいか」といった比較が狂ってしまいます。この研究は、身長のように正解が分かる質問で人それぞれの「ものさしのずれ」を測り、補正すると失業のつらさの評価が3倍にもなることを示しました。", "unverified": "推定量の具体的な形と検証の誤差は本文を入手できず確認できなかった。"}}, {"id": "pn06", "rank": 6, "field": "経営学", "headline": "カード決済データで見る生成AI市場の競争", "title": "Competition in Generative AI: Evidence from Consumer Demand", "url": "https://doi.org/10.2139/ssrn.7621763", "authors": "Mark Egan ほか", "venue": "SSRN", "date": "2026-10-19", "apa": "Egan, M., Russel, D., Shi, C., & Yao, V. (2026). Competition in Generative AI: Evidence from Consumer Demand. https://doi.org/10.2139/ssrn.7621763", "why": "取引レベルのカード決済データで生成AIサービスの消費者需要を推定し、市場の競争度を評価した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": true, "p1": "1億7,400万人のカード取引データで有料の生成AIサービスの需要を分析し、差別化が小さく乗り換え費用が低いため、市場の競争圧力が強いことを示した（抄録）。", "p2": "生成AIの市場が成熟したとき、少数の企業が価格支配力を持つのか、競争的になるのかは分かっていなかった（抄録）。", "p3": "1億7,400万人の消費者と1,140億件の取引からなるクレジット・デビットカードのデータで、有料サービスの採用、複数利用（マルチホーミング）、継続率、モデル公開時の乗り換えを調べ、AIサービスの需要と供給の構造モデルを推定した（抄録）。", "p4": "記述的なパターン（採用率、プラン価格、継続率、乗り換え）と、構造モデルによる価格弾力性・提供者への選好・代替性の推定で競争の強さを評価した（抄録）。", "p5": "2026年4月時点で米国の消費者の約2.9%が主要な生成AIサービスに少なくとも1つ課金し、若く高所得の層で多かった。ほぼ全員が月30ドル以下の基本プランだった。複数利用は一般的だが提供者の能力の拡大とともに減り、年間の顧客継続率は主要提供者で20〜45%と他のサブスクより低く、主要なモデルの公開時に乗り換えが増えた。構造モデルでは消費者は価格に非常に敏感で、特定の提供者への選好はAI全体への選好よりずっと弱く、サービスは代替的になりつつあった（抄録）。", "p6": "著者は、モデルの品質の差別化が大きく進まない限り、代替性の高まりが提供者の価格支配力を制約し、消費者が余剰の大部分を得ると結論する（抄録）。解釈：カードで支払われる個人の課金に限られ、企業向けの契約やAPI利用の競争は対象外とみられる。", "fun": "生成AIは少数の大企業が独占する、と心配する声があります。ところが、実際の買い物の記録を見ると、人々は新しいモデルが出るたびに乗り換え、1年後も同じサービスを使い続ける人は2〜4割にとどまっていました。利用者がどこにでも移れる限り、企業は値上げしにくいというわけです。巨大技術の行方を、人々の財布の動きから読み解いた点が面白い研究です。", "unverified": "構造モデルの推定値（弾力性など）は本文を入手できず確認できなかった。"}}, {"id": "pn07", "rank": 7, "field": "交通・都市計画", "headline": "通学の交通手段が学校選択の障壁になる", "title": "Transportation as a Barrier to Education Access: Evidence from Chicago Public Schools", "url": "https://doi.org/10.3386/w35915", "authors": "Cecilia H. Moreira ほか", "venue": "NBER Working Paper", "apa": "Moreira, C. H., Puller, S. L., & Umosen, I. (2026). Transportation as a Barrier to Education Access: Evidence from Chicago Public Schools (NBER Working Paper No. 35915). National Bureau of Economic Research. https://www.nber.org/papers/w35915", "why": "シカゴの公立学校で、通学の交通アクセスが学校選択による教育機会の拡大を制約することを示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ（本文は入手できず）", "preprint": true, "p1": "シカゴの公立高校の学校選択で、公共交通での通学時間の差が黒人生徒の上位校への需要を下げてい
