<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-11-27", "intro": "プレプリントの新着1,506件（一覧の候補281件）、学術誌の新着（上位10%誌・重点誌・VBIの監視誌1,703件・うち一覧の候補343件、その他のQ1・Q2誌の候補151件）、重要論文の候補494件（プレプリント200件・学術誌294件）、新着オープンデータ136件から選びました。プレプリント・関連50報、プレプリント・注目50報、論文誌・関連50報、論文誌・注目50報、オープンデータ31件です。プレプリント・注目は、組織行動と経営学で内容の合う候補が少なく、それぞれ1報と2報でした。論文誌・注目は、統計学と因果推論の主要誌の新着が候補になく、機械学習の主要誌の新着は1報を除いて抄録がないため、題名のみの3報を16位以下に置きました。今日のおすすめ分野（環境・気候政策、交通・都市計画）は、プレプリントで5報（交通・都市計画は内容の合う候補がありませんでした）、論文誌で8報を入れ、うち4報は上位10%誌の新着から補いました。抄録のない新着は各部の16位以下に置きました。e-Statからは労働災害動向調査の年次の統計表1件を入れました。取得できなかった情報源はありません。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "橋の加速度計の時刻ずれを損傷に左右されず補正", "title": "Direction-Aware Physics-Informed Autoencoder for Damage-Insensitive Synchronization of Bridge Acceleration Signals", "url": "https://doi.org/10.58286/33878", "authors": "Ghasemlou ほか", "venue": "Zenodo", "date": "2026-11-26", "apa": ", Ghasemlou, A., Mammeri, S., Dadras eslamlou, A., Martínez sánchez, J., & Riveiro, B. (2026). Direction-Aware Physics-Informed Autoencoder for Damage-Insensitive Synchronization of Bridge Acceleration Signals. E-Journal of Nondestructive Testing, 31(8). https://doi.org/10.58286/33878", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "国際会議EWSHM 2026の論文集（e-Journal of Nondestructive Testing）の掲載ページにある抄録と書誌情報を読んだ。本文のPDFは取得できていない", "preprint": false, "p1": "無線の加速度センサで測った橋の振動記録に、時計を合わせた後も残る時刻のずれを、記録そのものから推定して補正する後処理の方法を示した。損傷で橋の特性が変わっていても働くことを狙っている（抄録）。", "p2": "無線センサでは、時計のドリフト、トリガのゆらぎ、通信の遅延、機器に依存する取得の遅れにより、時計レベルの同期のあとにも時刻の誤差が残る。この誤差は位相をゆがめ、モード同定と損傷に敏感な解析の信頼性を下げる（抄録）。", "p3": "入力は常時微動のもとでの多点・3軸の加速度、出力は各センサの時刻のずれ（オフセット）。共有の畳み込みエンコーダがセンサごとの特徴を取り出し、全センサを結ぶ完全グラフ上のメッセージ伝播でセンサ間の依存を表す。並行して、相関と位相にもとづく辺の特徴が各センサ対の遅延の手がかりを与える。対ごとの遅延の推定値を、グラフにもとづく最小二乗で閉路の整合がとれたオフセットに射影する。推定したオフセットで一度同期し直してからもう一度推定する2段階の推論を使う（抄録）。", "p4": "健全な状態と質量を変えた状態の有限要素シミュレーションに人工の時刻ずれを与えて学習し、損傷のある状態は学習に使わず評価用に残して、未知の構造状態への一般化を調べた。比較対象は、1回だけの推論と、古典的な遅延推定法のGCC-PHATである（抄録）。", "p5": "2段階の枠組みは、1回の推論とGCC-PHATより正確で頑健な同期を与えたと報告する。抄録には誤差の数値や図表は示されていない（抄録）。", "p6": "シミュレーションでの評価であり、実橋の計測データでの検証は抄録からは確認できない。解釈：学習に使った構造と大きく異なる橋や、外乱の強い計測条件でも通用するかは、抄録の範囲では分からない。", "fun": "橋の何か所かに取り付けたセンサで揺れを測るとき、それぞれの時計がほんの少しずれていると、揺れの位相が狂ってしまう。この研究は、記録された揺れの波形どうしを見比べて、ずれを後から割り出す。センサの組ごとに求めたずれが、全体として辻褄の合う1組のずれになるよう整える、という条件を計算に組み込んでいるのが工夫だ。", "unverified": "論文本文のPDFは取得できず、同期の誤差の数値、センサの数、橋のモデルの諸元、損傷の与え方は未確認。題名にある「方向を考慮する」仕組みの中身と、査読の程度も掲載ページからは分からない。"}}, {"id": "pr02", "rank": 2, "headline": "監査の仕訳テストでLLMの選定は指示の書き方に左右", "title": "Human–artificial intelligence collaboration in professional judgment: large language model-assisted journal entry testing in financial audit", "url": "https://doi.org/10.21203/rs.3.rs-11486222/v1", "authors": "László Péter Lakatos ほか", "venue": "Research Square (In Review)", "date": "2026-11-25", "apa": "Lakatos, L. P., & Szabó, M. L. (2026). Human–artificial intelligence collaboration in professional judgment: large language model-assisted journal entry testing in financial audit. https://doi.org/10.21203/rs.3.rs-11486222/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Research Square版の本文（§3の研究設計・データ・手順、§4.1の初回の実行、§4.2の再現実験と表5、限界の段落）を読んだ。§2の文献レビューと補足資料は読んでいない", "preprint": true, "p1": "監査の仕訳テストでLLMに疑わしい仕訳を選ばせると、同じ指示の繰り返しならほぼ同じ選定になるが、言い換えや「確信のあるものだけ」という指示で選定が大きく変わることを、選ばれた仕訳の単位で測って示した（§4.2、表5）。", "p2": "専門的な判断の一部をAIに委ねるとき、どの部分を任せられ、説明責任をどう保つかが問われる。仕訳テストは大量のデータの選別と専門的判断を組み合わせる手続きで、LLMの出力が指示の書き方にどれだけ依存するかは分かっていなかった（§2.5、§3.1）。", "p3": "監査の仕訳データに似せた合成の取引1,000件（週末・祝日の記帳、未承認、しきい値の回避、期末の記帳などのリスク指標を埋め込み）を、定義やしきい値を示さない基本の指示でLLMに選別させ、続けて「100%確かなものだけ」と「少しでも疑わしいもの」の指示を出す。再現実験では基本の指示を独立した6回の会話で繰り返し、言い換えた指示を4回試して、会話間の一致をジャッカード係数で測った（§3.2〜§3.6）。", "p4": "評価は記述的で、独立した正解ラベルがないため精度や再現率は報告しない。条件ごとの選定件数と、取引単位の対ごとの一致率の平均と範囲を比べ、条件間の差を正確な並べ替え検定（片側、ボンフェローニ補正後のしきい値0.0167）で確かめる（§3.5）。", "p5": "基本の指示の6回は455〜503件を選び、一致率は平均94.6%で、453件は毎回選ばれた。確信の指示は48〜148件で一致率は平均51.9%にとどまった。言い換えた指示と元の指示の一致率は平均87.1%で、元の指示どうしより低かった（P=0.010）（§4.2、表5）。初回の実行では、未承認の145件が「承認済み以外」の件数と一致し、指示が開いたままにした定義をモデルが自分で補っていた（§4.1）。", "p6": "著者は、合成データであること、独立した正解ラベルがなく検出の正確さを評価できないこと、データの生成と評価に同種の技術を使った循環の危険、1つのモデルと少ない会話数を限界に挙げる（限界の段落）。同じ基準について指定の細かさを変える実験は、今後の設計に残されている（§3.3）。", "fun": "会計の監査では、たくさんの仕訳の中から疑わしいものを選んで調べる。その選び出しをAIに頼んだらどうなるか。同じ頼み方を6回繰り返すと、ほぼ同じ仕訳が選ばれた。ところが同じ意味の別の言い方で頼むと選ばれる顔ぶれが変わり、「100%確かなものだけ」と頼むと、48件のときもあれば148件のときもあった。AIの答えは、頼み方のあいまいな部分をAIがどう埋めるかに左右される。", "unverified": "§2の文献レビュー、表2・表6の全体、補足資料（データ辞書と各会話の出力）は読んでいない。初回の実行（2026年5月）で使われたモデルは確認していない。"}}, {"id": "pr03", "rank": 3, "headline": "議論にAIが加わると人の応答と意見の幅が広がる", "title": "AI-human hybrid conversations: Can AI Agents Improve Discourse Quality?", "url": "https://arxiv.org/abs/2611.33459", "authors": "Ishita Chakraborty ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Chakraborty, I., You, X., & Banerjee, S. (2026). AI-human hybrid conversations: Can AI Agents Improve Discourse Quality? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33459", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（データ、シミュレーションの設計、人とAIの実験の設計と結果、限界の節）を読んだ。シミュレーション結果の各表の数値と付録は読んでいない", "preprint": true, "p1": "ネット上の議論にAIの参加者を混ぜると、人の投稿に返信が付きやすくなり、人が書く内容の幅も広がることを、シミュレーションと221人の事前登録実験で示した（実験結果の節）。", "p2": "オンラインの議論では、参加の偏り、返信のない投稿、視点の狭さが問題になる。AIが書く内容そのものの質だけでなく、AIの参加が人どうしのやり取りをどう変えるかは分かっていなかった（Introduction、Empirical Setting）。", "p3": "第1段階はシミュレーションで、Redditの利用者データ（PANDORA）から人物像（ペルソナ）を作り、120の実際のスレッドの続きを、ペルソナなしのAI、ペルソナつきのAI、参加の少ない集団のペルソナを80%の確率で選ぶAIの3条件でGPT-5.2に書かせた（計21,600件）。第2段階は実験で、独自の掲示板で人のみ・汎用AI入り・ペルソナAI入りの3条件に学生を割り当て、人のコメント2件ごとにAIが1回応答する（Data、Matched Conversation Simulation、Human-AI hybrid experiments）。", "p4": "シミュレーションでは、人の議論と比べた感情・毒性と、文の埋め込みの対ごとのコサイン類似度で測る意味の幅を見る。実験では、返信を受けなかった参加者の割合、人どうしの返信数、人の投稿の意味の幅、事後の質問紙の評価を条件間で比べる（Semantic breadth、実験結果の節）。", "p5": "AIだけの議論は人の議論より肯定的で毒性が低いが、意味の多様性はかなり低かった（Summary）。実験では、返信を受けなかった参加者が人のみで63%、汎用AIで27%、ペルソナAIで21%だった。人の投稿どうしの平均類似度は0.40から0.30と0.31に下がり、内容の幅が広がった（図15）。AIがいたと思った回答者は3条件とも61〜66%で、AIのいない条件でも61%だった（表12）。", "p6": "著者は、学部生が無難な話題（感謝祭の思い出）を4日間話した実験であり、意見の対立が強い話題や多様な集団では効果が異なりうること、実験では参加の少ない集団のペルソナを試していないこと、特定の言語モデルに依存することを限界に挙げる（Limitations and Future Research）。", "fun": "ネットの掲示板では、書き込んでも誰からも返事がないことが多い。この実験でも、人だけの場では書き込んだ人の63%に返事が付かなかった。そこにAIの参加者を混ぜると、その割合は21〜27%に下がり、人が書く話題の幅も広がった。面白いのは、AIだけで書かせた議論は人の議論より似通っていたことだ。AIは良い意見を出すというより、人が話し続けるきっかけを作る役で効いていた。", "unverified": "シミュレーションの検証の表（表5〜表10）の数値、類似度の差の統計的な検定の結果、付録の頑健性の確認は読んでいない。"}}, {"id": "pr04", "rank": 4, "headline": "軌道更新工事中の鉄道橋を1年間リアルタイム監視", "title": "Real-Time Structural Health Monitoring of the Bolueta Railway Bridge During Track Renewal Works: A Case Study", "url": "https://doi.org/10.20944/preprints202611.2675.v1", "authors": "Diego Zamora-Sánchez ほか", "venue": "Preprints.org", "date": "2026-11-26", "apa": "Zamora-Sánchez, D., Jiménez, J. C., Armijo, A., Lucena, J., & Ezquerro, M. (2026). Real-Time Structural Health Monitoring of the Bolueta Railway Bridge During Track Renewal Works: A Case Study. https://doi.org/10.20944/preprints202611.2675.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Preprints.orgのページは取得できず、Crossrefに登録された抄録を使用。本文は読んでいない", "preprint": true, "p1": "ビルバオのボルエタ鉄道橋で、軌道の更新工事が続く約1年間、列車の運行を続けながら橋の状態を見張るリアルタイムの監視システムを運用し、その構成と結果を報告した（抄録）。", "p2": "多径間の二重箱桁、V字形の橋脚、2本のリブのアーチからなる特殊な連続橋で、スラブ軌道のコンクリートのはつり作業を伴う工事を、夜間の作業と通常の列車運行の両方のもとで監視する必要があった（抄録）。", "p3": "入力は加速度・ひずみ・相対変位・傾斜の計測値。4G回線上のMQTTでデータを常時送り、保存・可視化・処理するモジュール型の構成をとる。しきい値による警報に加え、同定した固有振動数を使う全結合ニューラルネットワークの分類器と、加速度の時刻歴を使う畳み込み自己符号化器による異常検知、データの文脈づけの道具を備える。全体の有限要素モデルは、計測と比べるオフラインの基準の確認に使う（抄録）。", "p4": "計測値と有限要素モデルの予測の一致、および監視期間を通じた基準状態からの持続的なずれの有無で評価している。比較した他の手法や定量的な指標は抄録に示されていない（抄録）。", "p5": "計測と数値予測はよく一致し、監視期間中に基準状態からの持続的なずれは確認されなかったと報告する。抄録に数値や図表の記載はない（抄録）。", "p6": "1つの橋での事例であり、損傷が起きなかったため、異常検知が実際の損傷をどの程度捉えられるかは示されていない（解釈）。警報のしきい値の決め方や誤警報の頻度も抄録からは分からない。", "fun": "線路の工事をしている橋の上を、列車はふだんどおり走り続ける。工事で橋に異常が出ていないかを確かめたいが、列車を止めるわけにはいかない。この事例では、橋に付けたセンサの値を通信回線で送り続け、揺れ方の特徴が基準の状態と違わないかを機械学習で見張った。約1年の工事の間、基準からの持続的なずれがないことを確かめ続けたという、地道な見守りの記録だ。", "unverified": "本文は入手できず、センサの数と配置、サンプリング、警報のしきい値、異常検知の性能の数値は未確認。査読前の原稿である。"}}, {"id": "pr05", "rank": 5, "headline": "多入力多出力のFRFから物理的なモードモデルを同定", "title": "MIMOS: A Toolbox for Multivariable Modal Identification", "url": "https://arxiv.org/abs/2611.34390", "authors": "M. van der Hulst ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "van der Hulst, M., González, R. A., Classens, K., Tacx, P., Dirkx, N., van de Wijdeven, J., & Oomen, T. (2026). MIMOS: A Toolbox for Multivariable Modal Identification (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34390", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§2の定式化、§3の2段階法、§5の2つの実験と表1、§6の結論）を読んだ。§4のワークフローの細部は読んでいない", "preprint": true, "p1": "多入力多出力の周波数応答関数（FRF）の測定から、物理的に解釈できる最小次数のモードモデルを同定する公開のMATLABツールボックスMIMOSを示した（§1、§6）。", "p2": "モードモデルはモード形状の低ランク構造をもつため簡潔だが、その構造を課した同定は非凸で、入出力が多く数千のパラメータになると直接解くのは重い。比例減衰では表しきれない系もある（§1、§2.1、§3.3）。", "p3": "入力は測定したFRFと重み、出力は固有振動数・減衰比・モード形状からなる状態空間モデル。第1段階で、分子行列に構造を課さない加法モデル（剛体項、モードごとの2次の項、残差項の和）を重みつき最小二乗で当てはめる。第2段階で、その推定値を情報行列で重みづけて物理的なモード構造へ射影する。第1段階の留数行列の特異値からモードごとの成分の数を選べ、一般粘性減衰も扱える（§3.1〜§3.3、図3）。", "p4": "公開データのある能動除振装置のベンチマーク（6×8の系）と、試作のウェハステージ（入力17・位置計測7の7×17の系）で、FRFの適合率、状態数、独立なパラメータの数、計算時間を、第1段階と第2段階、比例減衰と一般粘性減衰で比べた（§5、表1）。", "p5": "除振装置では121の弾性モードを同定し、一般粘性減衰の第1段階は11,906個のパラメータで適合率94.10%、第2段階は状態数を1452から834に、パラメータを7892に減らしても93.45%を保った。比例減衰では67.35%にとどまった。ウェハステージでは状態数が288から84と90に減り、適合率の低下は0.09と0.16ポイントだった（§5.1、§5.2、表1）。", "p6": "著者は限界を明示していない。検証は2つのメカトロニクス装置に限られる。第2段階は非凸の最適化で、対話的な初期化とやり直しを前提にした作業の流れになっている点は、自動化の程度を見るうえで留意がいる（§3.3、図2）。", "fun": "機械や構造物をいろいろな周波数で揺すって反応を測ると、たくさんの曲線が得られる。そこから「どの高さで、どんな形に揺れるか」という固有の揺れ方の一覧を取り出すのがモード同定だ。入力と出力が多いほど計算は難しくなる。この道具は、まず曲線に素直に合う式を作り、次にそれを物理的に意味のある形に整えるという2段階で、11,906個のパラメータをもつ問題を扱ってみせた。", "unverified": "§4の前処理と重みづけの細部、図5・図6の周波数ごとの適合の様子は確認していない。除振装置での計算時間の読み取りは行っていない。"}}, {"id": "pr06", "rank": 6, "headline": "LLMエージェント社会の創発は繰り返しても再現する", "title": "Reproducible Social Structure Emerges From Free-Form Interaction Among LLM Agents", "url": "https://doi.org/10.48550/arxiv.2611.31543", "authors": "Tom Alisch ほか", "venue": "arXiv", "date": "2026-11-23", "apa": "Alisch, T., Murthy, S., Hawkins, R., Sosa, F., & Park, C. F. (2026). Reproducible Social Structure Emerges From Free-Form Interaction Among LLM Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.31543", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§2の枠組み、§3.1〜§3.4の結果、§4の考察と限界、図1・図2・図4の説明）を読んだ。付録の補足図と補足手法は読んでいない", "preprint": true, "p1": "LLMエージェントの社会シミュレーションを同じ初期条件で10回繰り返すことで、どの現象が偶然でなく再現するのかを統計的に確かめる枠組みを作り、ネットワークと行動の指標の大半が安定して再現することを示した（§2、§3.3）。", "p2": "複数エージェントのLLMシミュレーションは社会システムのモデルとして使われるが、公表された知見の多くは1回の実行にもとづく逸話で、どの現象がその系の頑健な性質で、どれが1回きりの偶然なのかが分からなかった（§1、§4）。", "p3": "固定のペルソナと、自分で書き足す記憶をもつ50体のエージェントが、公開の投稿・個別メッセージ・グループの3つの場で、目標を与えられずに自由に交流する。予定した時点で各エージェントの状態を複製し、世界の外で評価するので、測定が進行中の世界を乱さない。同じ世界を10回走らせ、回の間のばらつきを統計的な推定に使う（§2、図1）。", "p4": "接触ネットワークの指標、対の状態の遷移確率、同じ対が複数の世界で再形成される回数を、二項分布の基準と次数を保つ帰無モデルと比べる。ペルソナの集合やモデルを変えた条件とも比べる（§3.1、§3.3、図2、図4）。", "p5": "最初は広く接触するが、多くの対は連絡を絶ち（0.565±0.037）、少数の対だけが持続する二者関係になって強く続いた（0.814±0.053）。同じ二者関係が複数の世界で再形成される頻度は帰無モデルより有意に高かった（図2）。37の世界単位の指標のうち32が安定の基準を満たした（図4a）。静的な性格の類似ではなく、初対面での感情と特性の表出の一致が、持続する関係を予測した（§3.2、図3）。", "p6": "著者は、二者関係への収縮は目標のない世界の性質である可能性が高く、共通の課題や資源の競争がある世界では違うだろうと述べる（§4）。初対面の効果は別のモデル（Llama 4 Scout）の10世界では見られず、対の再形成が帰無モデルを超えたのは基準の構成だけだった（§3.3）。", "fun": "AIの「住人」50体に、目的を与えずSNSのような場で自由に交流させると何が起きるか。面白い出来事が1回起きても、たまたまかもしれない。そこでこの研究は、まったく同じ世界を10回やり直した。すると、最初は広く話すが、やがて特定の相手との二者関係に落ち着くという流れが毎回現れた。誰と誰が続くかを予測したのは、設定された性格の近さではなく、初めて接したときに表した感情の合い方だった。", "unverified": "付録の補足手法（しきい値の感度、帰無モデルの詳細）、記憶とペルソナの入れ替え実験の数値の全体、図5以降は詳しく確認していない。"}}, {"id": "pr07", "rank": 7, "headline": "生成AIで浮いた時間は検証と仕事の拡大に吸収される", "title": "When AI Saves Time but Creates More Work: Digital Task Expansion and Employee Well-Being", "url": "https://doi.org/10.21203/rs.3.rs-11818440/v1", "authors": "Sarfaraz Abu Abdullah", "venue": "Research Square (In Review)", "date": "2026-11-25", "apa": "Abdullah, S. A. (2026). When AI Saves Time but Creates More Work: Digital Task Expansion and Employee Well-Being. https://doi.org/10.21203/rs.3.rs-11818440/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "Research SquareのPDF本文（§2.4の枠組みと仮説、§3の方法、§4.2・§4.6・§4.7の結果、§7の限界）を読んだ。§4.1、§4.3〜§4.5の詳細と§5〜§6は読んでいない", "preprint": true, "p1": "生成AIは時間を節約するはずなのに仕事が増えるという矛盾を、「デジタルなタスクの膨張」（確認と手直し、学習、職務範囲の拡大、成果への期待の上昇）として整理し、公表済みの実験と調査の数値を組み合わせて検討した（§1、§2.4、図1）。", "p2": "統制された実験では大きな時間短縮が報告される一方、働く人全体を対象にした調査では短縮が小さい。節約された時間がなぜ自由な時間にならないのか、その差を埋める仕組みが整理されていなかった（§1.1、§2.2）。", "p3": "新しいデータは集めない二次的な統合で、3つの分析を行う。公表された時間短縮の推定値を共通の尺度に並べて研究デザイン別に比べる。Gallupの従業員パネル（21,648人）の公表表を設計効果で補正して再分析する。総短縮時間G、確認などの間接作業の比率ρ、再吸収の比率αから、残る自由時間F=G(1−ρ)(1−α)を求める（§3.1、§3.3、§3.5、表7）。", "p4": "6つの仮説（実験と調査の差、時間の再配分、期待の上昇、隠れた労働の用量反応、損益分岐、組織の資源と疲弊）を、割合の差・オッズ比・相対リスクと近似の信頼区間で記述的に確かめる。因果効果は推定しない（§2.4、§3.1）。", "p5": "肯定的な結果の3つの統制研究の時間短縮は40%、25.1%、12.3%（中央値25.1%）、2つの集団調査は5.4%と2.8%（中央値4.1%）で、実験の短縮は調査のおよそ5倍だった（§4.2、表2）。損益分岐の分析では、中央値の利用者の短縮は週0.94時間で、ρは確認作業だけで0.58と見積もられた（§4.6、表7）。AIに必要な文脈とデータを得られない労働者は50%が疲弊を報告し、得られる人は18%だった（相対リスク2.78）（§4.7、表8）。", "p6": "著者は、証拠の大半が自己報告の横断データであること、部分集団の人数を公表値から近似したこと、情報源の一部がベンダー関連であること、損益分岐の分析が様式化されていることを限界に挙げる（§7）。well-beingへの害は、もっともらしいが部分的にしか裏づけられていない経路として扱われている（抄録、§4.7）。", "fun": "AIを使えば仕事が早く終わるはずなのに、なぜか忙しさは変わらない。この論文はその謎を、公表された数字を突き合わせて調べた。実験では作業時間が大きく減るのに、働く人全体の調査ではわずかしか減っていない。差を生むものとして挙げられたのは、AIの出力を確かめて直す手間、道具の使い方を覚える時間、そして成果への期待の上昇だ。浮いた時間は、新しい仕事に吸い込まれていく。", "unverified": "§4.3〜§4.5の各表（Gallupの12の活動別の結果、用量反応の検定）の数値は抄録にある値以外は確認していない。元になった各研究の原論文には当たっていない。"}}, {"id": "pr08", "rank": 8, "headline": "選択データの学習で合成回答者の偏りを減らす", "title": "Training decision models for simulating human respondents", "url": "https://doi.org/10.48550/arxiv.2611.31613", "authors": "Davood Wadi ほか", "venue": "arXiv", "date": "2026-11-23", "apa": "Wadi, D., & Ma, Y. (2026). Training decision models for simulating human respondents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.31613", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§3の方法、§4の実験設定、§5.1の結果、§6の結論と限界）を読んだ。§2の文献レビュー、§5.2、付録は読んでいない", "preprint": true, "p1": "LLMを調査の「合成回答者」に使うとき、過去の人の選択データで事前に学習させた小型の決定モデルが、未知の調査での処置効果を既製のモデルよりずっと正確に再現することを示した（§5.1、§6）。", "p2": "既製の生成LLMから得た合成の選択データは、その後の計量経済的な推定（処置効果）を歪める。モデルを大きくしても、推論の深さを上げても、この歪みは確実には減らない。対象の調査の人のデータで事後に較正する方法は、その人のデータを必要とする（§1、§6、図1）。", "p3": "入力は回答者の属性と課題の文脈と選択肢、出力は各選択肢を選ぶ確率。語彙を出力する部分をポインタ型の頭部に替え、全選択肢の得点を1回の順伝播で出してソフトマックスで確率にする（多項ロジットの形）。過去の回答者単位の選択データで交差エントロピーを最小化する「選択学習」を、推論の前に行う（§3、式1・式2、図2）。", "p4": "電力プランとドローン配送の2つの選択実験で学習し、航空便で検証し、ワクチン、食品表示、消費者の権利、AIと海外委託の4つの未知の調査で評価する。指標は、人のデータから推定したOLSの処置効果との二乗誤差（MSEβ）と交差エントロピーで、3つのモデル規模を比べる（§4.1、§4.2、表1）。", "p5": "2つのデータを合わせた学習は、12の評価の組み合わせすべてで両指標を下げ、MSEβを22〜89%減らした。学習は2択だけなのに、3択や5段階評定にも転移した。1つのデータだけの学習は、交差エントロピーは下げたのに、5段階評定の調査では6つ中4つで処置効果の誤差を増やした。学習済みのKEV-0.8Bは、既製のKEV-9Bを4調査中3つで上回った（§5.1、表2、図3）。", "p6": "著者は、交差エントロピーだけの学習では処置効果の精度が保証されないこと、合わせた学習の効果がデータの多様性によるのか量によるのかを分ける追加実験が必要なこと、生成LLMに同じ学習をして比べないと構造の利点を切り分けられないことを挙げる（§6）。", "fun": "商品の条件を変えたら人の選び方はどう変わるか。それを人に尋ねる代わりに、AIに回答者の役をさせて調べる試みが広がっている。ところが既製のAIに答えさせると、条件への反応の強さが実際の人とずれてしまう。この研究は、選択肢に確率を付けるだけの小さなモデルを、過去の2つの調査の人の選択で鍛えた。すると、題材も答え方も違う別の調査でも、人の反応に近い答えが出るようになった。", "unverified": "表2の各セルの数値、属性ごとの処置効果の図（図4・図5）、付録のハイパーパラメータと既製の生成LLMとの比較の詳細は確認していない。"}}, {"id": "pr09", "rank": 9, "headline": "企業のAI開示は増えたが実際の利用の記述は薄まった", "title": "The AI Disclosure Paradox: Operational Disclosure and the Rise of Corporate AI Narratives", "url": "https://arxiv.org/abs/2611.33201", "authors": "Abdullah Karasan", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Karasan, A. (2026). The AI Disclosure Paradox: Operational Disclosure and the Rise of Corporate AI Narratives (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33201", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§3のデータと方法、§4の結果、§5の限界、§6の結論）を読んだ。§2の文献レビューと付録は読んでいない", "preprint": true, "p1": "企業のAIに関する開示は量が大きく増えたが、実際に使っていることを述べる記述の割合は半分近くに下がったことを、米国の大企業の提出書類の記述単位の分類と人手の監査で示した（§4、表2）。", "p2": "開示の量の増加を、そのままAIの利用の増加と読んでよいかが問題になる。関心の表明や一般的な言及と、現に運用している利用の記述を区別し、分類の誤りを補正して量と割合の両方を測る必要があった（§1、§5）。", "p3": "2017〜2025年にS&P 500に属した企業の提出書類33,064件を文に分け、キーワード検索でAI関連の26,279の記述を取り出す。自社が主体で、AI技術と用途を示し、現在の利用か実装の完了を明示する記述を「運用」として、ローカルの言語モデル（Qwen2.5-7B-Instruct）に分類させ、人が注釈した1,000件の監査でモデルの誤りを補正する（§3）。", "p4": "書類100件あたりのAI関連の記述数（関心の強さ）、運用の記述数（運用の強さ）、その比（運用の割合）を、2017〜2022年と2023〜2025年で比べる。部門と書類の種類の構成を固定した比較と、10-Kだけの分析で頑健性を確かめる（§4、表3、表4）。", "p5": "関心の強さは29.31から185.38へ6.3倍、運用の強さは7.55から24.94へ3.3倍になり、運用の割合は25.76%から13.45%へ12.31ポイント下がった。増加分の約88.9%は運用以外で、一般的または不確かな記述の割合が66.36%から80.58%に増えた（§4、表2）。モデル単独の適合率は80.6%、再現率は56.6%で、補正後の運用の割合は全体で16.53%だった（表1）。", "p6": "著者は、開示されない利用やキーワードにかからない記述は捉えられないこと、同じ用途を複数の記述が述べうるので導入率は測れていないこと、希薄化は集計での結果で企業内の変化は示唆にとどまること、監査用の注釈が分類手順の調整にも使われたため精度の値は楽観的でありうることを挙げる（§5）。", "fun": "会社の報告書に「AI」という言葉が増えたら、その会社はAIをたくさん使うようになったと思うだろうか。この研究は、報告書の中でAIに触れた記述を「今実際に使っている話か、そうでないか」に分けた。AIの話は6.3倍に増えたが、実際に使っている話は3.3倍にとどまり、割合ではおよそ4つに1つから7つに1つ程度に減っていた。言葉の量と中身は別だということが、数字ではっきり見える。", "unverified": "表3の分解の全体、部門別・書類種別の数値（表4）、付録の頑健性の確認（安定した語彙での再計算、企業・年の指標）は確認していない。"}}, {"id": "pr10", "rank": 10, "headline": "平均場SDEの期待値を確率流ODEで計算する", "title": "Computing expectations associated with McKean--Vlasov stochastic differential equations via probability-flow ordinary differential equations", "url": "https://doi.org/10.48550/arxiv.2611.32434", "authors": "Mathias Horres ほか", "venue": "arXiv", "date": "2026-11-24", "apa": "Horres, M., Pillai, S. M. S., & Tempone, R. (2026). Computing expectations associated with McKean--Vlasov stochastic differential equations via probability-flow ordinary differential equations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.32434", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§1の導入、§2.2の平均場ODEの定式化、§5の数値実験の設定、§6の結論）を読んだ。§3〜§4の解析と付録の証明は読んでいない", "preprint": true, "p1": "多数の粒子が互いの分布を通じて影響し合う系（McKean–Vlasov型の確率微分方程式）について、解の関数の期待値を、確率的な経路ではなく決定論的な常微分方程式の粒子系で計算し、必要な計算量を大きく減らす方法を示した（§1、§6）。", "p2": "こうした方程式は、分布そのものを解く非線形フォッカー・プランク方程式が高次元では扱えないため、P個の粒子の連立した確率微分方程式で近似する。オイラー・丸山法とモンテカルロ法では、誤差の許容値TOLに対して計算量がO(TOL⁻⁴)になる（§1）。", "p3": "フォッカー・プランク方程式を、同じ周辺分布をもつ決定論的な平均場の常微分方程式の法則が従うリウヴィル方程式（密度の移流の式）に書き換える。速度はドリフトから拡散の項とスコア（密度の対数の勾配）の項を引いた形になる（式8〜10）。ランダムさは初期値だけに残るので、伊藤積分を近似する必要がなく、時間方向には高次のルンゲ・クッタ法、初期値には乱択準モンテカルロ法が使える。スコアは粒子系から核にもとづく推定量で求める（§2.2〜§2.4）。", "p4": "解析解のあるガウス型のモデルで収束の次数を確かめ、蔵本モデル（振動子の集団のモデル）でスコアの推定・時間積分・準モンテカルロの全体を試す。許容誤差に対する計算量の指数を、理論の見積もりと数値実験で比べる（§3、§5）。", "p5": "理論上の計算量はO(TOL^−(max{β/α,2}+1/γ))で、αとβは粒子数に対する弱誤差と分散の収束次数、γは時間積分の次数である（抄録、§3）。試した中程度の次元の例では、実効的な指数はα≈1、β≈2、γ≈4、δ≈2に近く、経験的な計算量はO(TOL^−2.25)に近かった（§6）。", "p6": "著者は、平均場の常微分方程式の解の存在と一意性は仮定にとどまること、スコアの推定が偏りを生み分布の裾を変えうること、核の正則化のパラメータが歪んだ分布では結果を左右することを述べる（§2.2の注意、§5、§6）。検証は2つのモデルと中程度の次元に限られる。", "fun": "たくさんの粒がランダムに揺れながら互いに影響し合う系を計算するとき、ふつうは粒ごとに乱数を使い続ける。この研究は発想を変え、「揺れながら広がる」のと同じ分布の変化を生む、乱数なしの流れの式に置き換えた。ランダムさは最初の配置にだけ残るので、流れは滑らかになり、精度の高い計算法が使える。偶然の積み重ねを、密度が流れに乗って運ばれる話に言い換える発想が面白い。", "unverified": "定理1〜3の証明（付録B〜D）、適応アルゴリズム（§4）の詳細、図表の個々の数値は確認していない。"}}, {"id": "pr11", "rank": 11, "headline": "崩積土の厚さから崩壊と土石流の到達を一貫評価", "title": "Coupling modeled colluvium depth, landslide initiation, and debris-flow runout to map regional-scale inundation susceptibility", "url": "https://doi.org/10.5194/egusphere-2026-6672", "authors": "Nicolas W. Mathews ほか", "venue": "EGUsphere", "date": "2026-11-25", "apa": "Mathews, N. W., Roering, J. J., Johnson, A. C., Silva, L., McKay, S., & Bell, L. E. (2026). Coupling modeled colluvium depth, landslide initiation, and debris-flow runout to map regional-scale inundation susceptibility. https://doi.org/10.5194/egusphere-2026-6672", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "EGUsphereのPDF本文のうち、§3.1・§3.2冒頭・§3.5・§3.6・§4.1・§4.3・§4.4・§5.5・§6を読んだ。", "preprint": true, "p1": "アラスカ州プリンスオブウェールズ島で、地形発達モデルで求めた崩積土の厚さを斜面安定解析に入れ、崩壊の発生点から土石流の氾濫範囲までを一続きで地図にした。発生点の識別はAUC 0.86（抄録）。", "p2": "広域の危険度図は傾斜や起伏などの地形量に頼り、局所の地形による発生の違いを分けにくく、流下モデルとも連成されないことが多い（抄録）。崩積土の厚さと地下水の空間分布を入れると発生点をどこまで絞れるかを問う。", "p3": "0.5 mのライダー地形を5 mに直し、土壌の生成と輸送の地形発達モデルで崩積土の厚さを、地形湿潤指数で飽和度を求め、無限長斜面の安全率FSを各セルで計算する（§3.1、§3.5、式5）。FS≤1のセルの連なりを1つの崩壊とし、体積をUSGSのGrfin Toolsに渡して、河道での体積増加を含む氾濫範囲を求める（§3.6）。", "p4": "発生は、崩壊目録（TNFLI）の発生点と無作為な非崩壊点を見分けるROC解析で評価し、厚さと飽和度を一様とした場合と比べた（§3.5、図7）。流下は120のHUC-14流域ごとに、遷移勾配15〜25°と体積増加係数5〜30 m³/mから、目録との類似度指数が最大の組を選んだ（§4.4）。", "p5": "AUCは0.855で、一様なモデルより0.059〜0.097高い（§4.3、図7）。傾斜35〜45°では完全飽和だけではFS≤1にならず、安全率は主に崩積土の厚さで下がった（§4.3、図6）。目録の体積に0.07を掛けるとモデルの発生体積と最もよく合い（決定係数0.97）、発生時の体積は最終的な体積の約7%にあたる（§4.4）。", "p6": "飽和度はスイスの亜高山流域の経験式に頼り、降雨への間隙水圧の過渡応答は扱わない（§5.5）。目録の崩壊がある87流域の類似度指数は平均-0.38で、流域内の土石流の動きやすさがばらつくほど下がった（§4.4）。解釈：流域に1組の係数では、動きやすさの違う土石流をまとめて再現しにくい。", "fun": "急な斜面ならどこでも崩れる、というわけではない。この研究では、傾斜35〜45°の斜面は水で完全に満たされただけでは崩れる計算にならず、崩れるかどうかは主に土（崩積土）の厚さで決まった。土は谷状にくぼんだ場所にたまる。材料の土がたまることと、引き金になる水が集まることの両方がそろう場所を探すのが、危険度図づくりの要点になる。", "unverified": "§3.3〜§3.4（地下水と土質定数）、§3.7（較正の詳細）、§5.1〜§5.4、補足資料は読んでいない。類似度指数の定義式は補足資料にあり確認していない。部族政府との協働の進め方は抄録の記述のみ。"}}, {"id": "pr12", "rank": 12, "headline": "調査報告から独居高齢者のペルソナ対話を作る", "title": "AI Persona Dialogue Pipeline; From Survey Report to Conversational Personas, Evaluated by LLMs and Experts", "url": "https://arxiv.org/abs/2611.33736", "authors": "Jinyoung Jeong ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Jeong, J., Cho, I., Kim, B., Baek, J., & Yoo, Y. (2026). AI Persona Dialogue Pipeline; From Survey Report to Conversational Personas, Evaluated by LLMs and Experts (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33736", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXivのHTML本文のうち、§3（図1）・§3.1・§3.3・§4.1.1・§4.1.2・§4.2.2・§5.1・§5.2・§5.4・§5.5冒頭・§6.1・§7を読んだ。", "preprint": true, "p1": "全国調査の報告書から独居高齢者のペルソナの背景文をLLMに書かせ、微調整なしのLLMに演じさせ、LLM審査員と専門家30人が評価するまでを一続きの手順として示した。専門家は概ね現実的としたが、背景より能力が高すぎる点を最も多く指摘した（抄録）。", "p2": "ペルソナ対話の手順は課題ごとに作られ、課題が替わるたびに作成・演技・評価を作り直すことになる（抄録）。別の集団へ丸ごと移せる手順を作り、その出来を現場の専門家の目で確かめられるかを問う。", "p3": "種条件は2020年の全国高齢者調査（独居の3,137人）の潜在クラス分析から抽出し、3クラス各10人の30ペルソナを作る（§3.1、表1）。背景文は網羅性や一貫性など6つの基準で書かせ、対話では各ターンで内面の状態と5つの発話候補を確率つきで書き、下位2つを捨てて残りから1つを話す（§3、図1）。", "p4": "研究1は8つのシミュレータLLMを30の背景と5場面で対話させ（計1,200対話、各15ターン）、3つのLLM審査員が18項目を7段階で採点し、背景文と対話系の寄与を除去実験で見た（§4.1.1、§4.2.2）。研究2は高齢者に関わる専門家30人が、選ばれたGPT-5.5のペルソナと自分で対話して採点し、面接で理由を述べた（§5.1、§5.2）。", "p5": "審査員の平均はどれも6.2を超えて差が小さいが、GPT-5.5、Sonnet 4.6、Gemini 3.5 Flashが上位だった（§4.1.2、図2）。PPSは種条件のみの6.087から背景文つきで6.432に上がり、対話系を足しても6.417で変わらない（§4.2.2、図6）。専門家は26人が背景を見覚えのある人物と読み、24人が何らかの問題を挙げた（§5.5）。LLM審査員は専門家よりPPSで0.53、Character-LLMで1.05高く採点した（§6.1）。", "p6": "除去実験は背景作成と対話系をそれぞれ丸ごとでしか試しておらず、個々の基準の寄与は未検証で、採点もLLM審査員だけである（§7）。1つの集団・1言語・1回の実行で、背景を書いたLLMも1つに固定している（§7）。専門家に見せるシミュレータをLLM審査員が先に選んだため、8つ全部の専門家評価はない（§7）。", "fun": "AIの審査員と、高齢者と日々接する専門家30人が同じ作り方のペルソナを採点すると、AIのほうが一貫して甘かった。専門家が最もよく見つけたのは、背景に書かれた限界より多くのことができてしまうというずれである。著者らは一因として、採点項目が「その人物が何を持っているか」を問い、「何ができないはずか」を問わないことを挙げる。人物らしさは、できないことにも表れるという指摘である。", "unverified": "§2（関連研究）、§4.1.3、§4.3、§5.6、§6.2、付録は読んでいない。専門家の指摘の種類ごとの人数は一部しか確認していない。公開された手順・ペルソナ・対話の所在は確認していない。"}}, {"id": "pr13", "rank": 13, "headline": "制動時のタイヤと舗装の接触ひずみを4ミリ秒で予測", "title": "Surrogate Modelling of Tyre-Pavement Interaction Under Tractive Loading", "url": "https://doi.org/10.21203/rs.3.rs-11384777/v1", "authors": "Débora Cardoso da Silva ほか", "venue": "Research Square (In Review)", "date": "2026-11-25", "apa": "Silva, D. C. d., Ravahatra, N. R., Yotte, S., Picoux, B., Reynaud, P., & Petit, C. (2026). Surrogate Modelling of Tyre-Pavement Interaction Under Tractive Loading. https://doi.org/10.21203/rs.3.rs-11384777/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "Research SquareのPDF本文のうち、§2・§2.1・§2.2・§2.2.4・§3.2・§3.3・§3.4・§4.1・§4.2.1・§4.3冒頭・§5を読んだ。PDFは段組みが乱れて抽出されている。", "preprint": true, "p1": "制動時のタイヤと舗装の接触で生じる舗装表面のひずみ場を、多項式の応答曲面で約4 msで再現する代理モデルを作り、入力の不確かさが臨界ひずみに与える影響を調べた（抄録）。効くのは主に輪荷重と表層の弾性係数だった。", "p2": "接触を解く数値計算は応力を正確に見積もれるが、実務や不確かさの伝播に使うには計算が重い（抄録）。表面から始まる舗装損傷に関わるひずみ場を解析に使える速さで予測できるか、どの入力が臨界ひずみを決めるかを問う。", "p3": "参照解は、弾性半空間の接触を相補エネルギーの最小化として解く半解析モデルで、制動の強さは摩擦限界に対する比0.75に固定する（§2、§2.1、§2.2.4）。摩擦係数・輪荷重・層厚・弾性係数・ポアソン比の10入力を、面心の中心複合計画1,045点に完全実施計画を足した計2,069点で標本化し、路面の13,335要素ごとに2次（輪荷重のみ3次）の多項式67項を最小二乗で当てはめる（§3.2、§3.3、§4.1）。", "p4": "中心複合計画の点は常に学習に使い、完全実施計画の点を5分割して交差検証し、要素ごとの決定係数と標準化RMSEの分布で精度を見た（§3.4、図6、図7）。その後、全標本で当てはめ直したモデルを感度解析と不確かさの伝播に使った（§4.1）。", "p5": "試験データの決定係数は平均0.96で、最も散らばった分割でも要素の95%が0.83を超え、標準化RMSEは75%の要素で0.030以下だった（§4.1）。1回の評価は約4 msで、半解析モデルより少なくとも75,000倍速い（§4.1、§5）。相対感度の中央値は輪荷重が0.68で最も大きく、表層の弾性係数が続き、摩擦係数と表層のポアソン比は約0.03だった（§4.2.1、図10）。", "p6": "事例は1つの舗装構成で、材料は15°C・10 Hzの線形弾性、タイヤ特性と制動の強さは固定し、直進を仮定して横力と旋回モーメントを無視している（§2.2、§2.2.4、§5）。参照解は半解析モデルで、実測ひずみとの比較は読んだ範囲にない。元データは公開されていない（データ公開の記載）。", "fun": "トラックがブレーキをかけると、タイヤの下の舗装表面は押されるだけでなく前後にも引っぱられる。この研究は、時間のかかる接触計算を2,069回だけ走らせて多項式に覚えさせ、同じ答えを約4ミリ秒で出せるようにした。速くなったおかげで条件を大量に振れるようになり、表面のひずみを決めるのは主に車の重さと表層の硬さで、摩擦係数の寄与はそれよりずっと小さいと分かった。", "unverified": "§1、§3.1、§3.5、§4.2.2、§4.3の後半は読んでいない。表2の入力分布と変動係数の値は抽出が乱れて読み取れなかった。条件つき分布の数値（§4.3）は確認していない。"}}, {"id": "pr14", "rank": 14, "headline": "時系列データだけから遅い多様体と縮約モデルを同定", "title": "Data-driven framework for invariant manifold identification in multiscale systems", "url": "https://arxiv.org/abs/2611.33849", "authors": "Dimitris M. Manias ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Manias, D. M., Muhammed, I., Goussis, D. A., & Hatzikirou, H. (2026). Data-driven framework for invariant manifold identification in multiscale systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33849", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXivのHTML本文のうち、§2.1〜§2.4・§3冒頭・§4.4.2・§5.1.1・§5.2.1・§6を読んだ。", "preprint": true, "p1": "時系列データだけから、速い変数と遅い変数の分かれ方を診断し、遅い不変多様体（SIM）の代数式と縮約モデルを得る手順を提案した。線形確率系では、この回帰が森–ツヴァンツィヒ射影と時間スケール比の最低次で一致する（抄録）。", "p2": "多スケール系は速い過渡のあと低次元の多様体上をゆっくり動くが、支配方程式もヤコビアンも速い・遅いの分け方も分からないとき、この構造をデータから取り出すのは難しい（抄録）。事前知識なしに、解釈できる形で縮約できるかを問う。", "p3": "手順は6段階で、DMDによる時間方向のデータ補完、スパース回帰によるベクトル場の再構成、Krylov–Arnoldi法による行列を作らないヤコビアン推定、CSP診断、回帰によるSIMの同定、SIM上への制限による縮約モデルの構成からなる（§2.4、図1）。速いモードの振幅が許容値以下の時点だけを多様体近傍の標本とし、速い変数を遅い変数の関数として回帰する（§2.3、式8〜10）。", "p4": "解析解のある2次元の線形確率系で、回帰によるSIMが定常測度の下での条件つき期待値（森射影）になることを示した（§3）。数値実験は2次元線形系、ミカエリス–メンテン、バイオフィルム、5次元のTMDDの4モデルで、解析的なSIMや準定常近似の縮約モデルと比べた（§4.4.2、表7）。500点の軌道を30・40・100点に間引き、標準偏差の5%の雑音を加えた場合も調べた（§5.1.1、§5.2.1）。", "p5": "バイオフィルムでは学習した係数0.06354が、最低次の準定常近似の0.0667ではなく高次のSIMの0.06350に合った（§6）。間引きと雑音の下でも3モデルでは時間スケールの順序が保たれたが、TMDDでは診断が乱れ、速い・遅いの分離を確実には同定できなかった（§6）。", "p6": "著者は限界を4つ挙げる。全状態の観測を仮定すること、精度がスペクトルの隙間で決まり多様体近傍のデータが要ること、遅い変数の観測雑音が回帰を偏らせること、ベクトル場の再構成の誤差が後段すべてに伝わることである（§6）。実験データには未適用で、Krylov法の大規模系での利点も試していない（§6）。", "fun": "反応がいくつも絡む系には、あっという間に落ち着く変数と、ゆっくり変わる変数がある。速いほうが落ち着いたあとは、速い変数を遅い変数の「関数」として書けてしまう。この研究は、その関数をデータへの当てはめで求める手順を作り、単純な確率モデルでは、当てはめの答えが統計物理の射影の理論と同じものになることを示した。素朴な回帰が、理論の言う縮約と一致するという話である。", "unverified": "§1、§2.1の後半、§4.1〜§4.3の各節、付録（解析的証明、数値設定、CSP診断）は読んでいない。表10・表12の誤差の値は確認していない。スパース回帰の設定の詳細は未確認。"}}, {"id": "pr15", "rank": 15, "headline": "モデルが誤っていても発散しにくい粒子フィルタ", "title": "PrO Filtering via Kernel Mean Embedding Dynamics", "url": "https://arxiv.org/abs/2611.34809", "authors": "Linfeng Wang ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Wang, L., Nüsken, N., & Oates, C. J. (2026). PrO Filtering via Kernel Mean Embedding Dynamics (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34809", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXivのHTML本文のうち、§2.2・§2.3（命題2.1、注意2.2、命題2.3）・§2.4・§2.5冒頭・§3.1・§3.2・§5を読んだ。", "preprint": true, "p1": "モデルが誤っているときに頑健な「予測志向（PrO）フィルタ」を、ガウス近似に頼らず粒子で実装する初めての方法KMED-PrOを提案した。予測分布からPrOの更新分布へ向かう経路の変化率を閉じた形で求め、カーネル平均埋め込みの動力学で粒子を運ぶ（抄録）。", "p2": "モデルが誤っているとベイズフィルタは発散し過信しやすい。PrOフィルタは観測と予報が食い違うと両方の近くに確率を置くが、既存の実装は単峰のガウス近似で、この性質を十分に表せない（抄録）。陰にしか定義されないPrOの更新分布を粒子で近似できるかを問う。", "p3": "更新を「損失＋予測分布からのKL」の最小化と見て、PrOでは損失を予測分布の対数スコアにする（§2.2、式4〜5）。損失にtを掛けたホモトピーを考えると、経路の変化率が尤度と予測尤度の比で閉じた形に書け（§2.3、命題2.1）、これをカーネル平均埋め込みの時間変化と等置して粒子の速度場を決める（§2.4）。粒子は等重みのままで、遷移密度も再標本化も尤度の勾配も要らない（§2.4）。", "p4": "理論では、PrO経路のフィッシャー–ラオ長が1以下で、必要な擬似時間ステップ数が観測の外れ具合によらないことを示した（命題2.3、抄録）。実験は、二重井戸のランジュバン拡散をエネルギーだけ観測する例と、持続する力を落とした誤ったモデルでの距離追跡（500ステップ、10シード）で、EKF-BayesとEKF-PrOと比べた（§3.1、§3.2）。", "p5": "ランジュバンの例では、EKFの2手法は1つの枝に集中して真の状態を外すことがあり、KMED-PrOの95%領域は示した4時点すべてで真の状態を含んだ（§3.1、図2）。距離追跡では粒子数128で、次の観測の負の対数予測密度が2次元のとき0.759となり、EKF-Bayesの0.880、EKF-PrOの0.933より低く、25次元と50次元でも約0.12の改善が続いた（§3.2、表2）。", "p6": "擬似時間1ステップの計算量は粒子数の3乗に比例し、粒子数が次元より多い必要がある（§5）。命題2.3はステップ数を抑えるが近似誤差は抑えず、収束と安定性の解析は残る（§5）。比較は実装同士のもので、PrOという目的関数の効果と近似族の効果は分離していない（§5）。", "fun": "モデルが間違っていると、普通のベイズ更新は外れた方向に自信を持ちすぎることがある。PrOフィルタは、予想と違う観測が来たとき、予想の近くと観測の近くの両方に可能性を残す。ただしそれには山が2つある分布を表す必要があり、山が1つのガウス分布では無理がある。この研究は点の集まり（粒子）を流して分布を作ることで、その「両にらみ」を実際に表せるようにした。", "unverified": "§1、§2.1、§2.5の時間刻みと計算量の項、§4（関連研究）、付録（証明と実験設定）は読んでいない。命題2.1と命題2.3の証明は確認していない。図3の感度の個々の値は確認していない。"}}, {"id": "pr16", "rank": 16, "headline": "会計エージェントの監査の誤りを罰金の額で採点", "title": "Priced, not passed: what accounting agents actually lose in a SPED-native audit environment", "url": "https://doi.org/10.5281/zenodo.24542418", "authors": "Theodoro, Caio", "venue": "Zenodo", "date": "2026-11-25", "apa": "Theodoro, C. (2026). Priced, not passed: what accounting agents actually lose in a SPED-native audit environment (Version paper-v1.0). Zenodo. https://doi.org/10.5281/ZENODO.24542418", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "会計の監査をAIエージェントに任せたときの誤りを、合否ではなく法定の罰金額という金額の損失で採点する評価環境を作った。", "p3": "合成企業の1会計年度分の電子請求書・複式簿記の仕訳・試算表・法定申告を生成し、15種類の欠陥を埋め込む。検証器は成果物から計算し直し、正解表を読まない。2つのエージェントを30の世界・各3回で測った（抄録）。", "p5": "どちらも単純な下限には勝ったが、決定論的なルールエンジンには勝てず、一方は1回あたり4,815レアル悪かった。ルールエンジンと良い方のエージェントを併用すると平均損失は5,073レアルに下がった（抄録）。", "fun": "テストはふつう正解か不正解かで採点する。でも会計の監査では、見逃した誤りには罰金がかかり、間違った指摘には調べ直す手間がかかるので、誤りの「値段」は同じではない。この研究は架空の会社の1年分の帳簿に誤りを仕込み、AIの監査の結果をお金で採点した。最新のAIでも、昔ながらの決まりきったルールの検査には勝てなかった。", "unverified": "使われたモデル名、罰金の計算の詳細、欠陥の15分類の中身は抄録になく未確認。査読前で、30の世界・1つの課題形式に限られると著者が述べている。"}}, {"id": "pr17", "rank": 17, "headline": "小型モデルはSEC書類の数値を根拠つきで読めるか", "title": "Show Your Work: Can Small Open Models Read SEC Filings with Evidence a Machine Can Check?", "url": "https://arxiv.org/abs/2611.24990", "authors": "Krishna Nandula", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Nandula, K. (2026). Show Your Work: Can Small Open Models Read SEC Filings with Evidence a Machine Can Check? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24990", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "手元のGPU1枚で動く小型の公開モデルが、米国企業の決算書類から数値を、機械で検査できる根拠（ページと原文の引用）つきで抜き出せるかを測るベンチマークを作った。", "p3": "45社の10-K・10-Qの90書類に対する1,000問を作り、正解は提出者のインラインXBRLのタグから取った。7〜21Bパラメータの10モデルを、素のまま・検査して再試行・推論モードの3条件で評価した（抄録）。", "p5": "根拠つきの正答率は素の条件で17.1〜82.7%、最良は84.5%だった。自動検査を通ってしまう誤答が1,000問あたり16〜167件あり、素の条件ではその57%が桁や単位の誤りだった。再試行で正答率は最大3.9ポイント上がった（抄録）。", "fun": "AIがすらすら答えても、それが正しいとは限らない。そこでこの研究は「答えの数字が書類の何ページのどの文にあるか」まで示させ、機械が照合できるようにした。それでも検査をすり抜ける誤答が残り、その半分以上は桁や単位の取り違えだった。人間の経理でも起きそうな間違いをAIもする、というのが面白い。", "unverified": "各モデルの個別の成績、検査の具体的な規則、推論モードで誤りが減る幅は抄録の範囲では未確認。"}}, {"id": "pr18", "rank": 18, "headline": "AI投資の簿外債務を入れるとレバレッジは2倍超", "title": "Financing the AI Buildout: Leverage, Opacity, and Credit Risk", "url": "https://doi.org/10.2139/ssrn.7727801", "authors": "Susan Cherry ほか", "venue": "SSRN", "date": "2026-11-25", "apa": "Cherry, S., Purnanandam, A., & Singla, S. (2026). Financing the AI Buildout: Leverage, Opacity, and Credit Risk. https://doi.org/10.2139/ssrn.7727801", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "AI向けの設備投資を進める上場企業の負債を、貸借対照表に載らないリースと発注残まで含めて測り、見かけよりレバレッジがずっと高いことを示した。", "p3": "上場63社のSEC提出書類から、簿外のリースと購入契約による固定的な支払義務を集計し、現在価値に直してレバレッジを計算した。社債スプレッドと格付けとの関係も調べた（抄録）。", "p5": "額面では簿外の債務が固定債務のほぼ4分の3を占め、現在価値で数えるとレバレッジは2026年6月時点で0.22から0.48に上がった。簿外債務の多い企業は同じ格付けの中でも社債スプレッドが広いが、格付けは低くない（抄録）。", "fun": "会社の借金は貸借対照表を見れば分かる、と思いがちだ。ところがAIのデータセンターに巨額を投じる企業では、将来払う約束の大半が帳簿の外にあった。面白いのは、社債を買う投資家はこの隠れた負担を金利に織り込んでいるのに、格付けには表れていない点で、誰がリスクを見ているかのずれが分かる。", "unverified": "レバレッジの定義（分母）、対象63社の選び方、割引率は抄録になく未確認。"}}, {"id": "pr19", "rank": 19, "headline": "流体と不連続変形法の連成で防波堤の安定を解く", "title": "CFD/NDDA coupling strategy for fluid-structure interactions with applications to wave impact on breakwater", "url": "https://doi.org/10.70675/0a56be82z8348z40d9zbfd7z835044be67b9", "authors": "Xinyu Wang", "venue": "HAL", "date": "2026-11-25", "apa": "Wang, X. CFD/NDDA coupling strategy for fluid-structure interactions with applications to wave impact on breakwater. https://doi.org/10.70675/0a56be82z8348z40d9zbfd7z835044be67b9", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "HALに登録された博士論文の抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "波が防波堤に激しく当たるときの、水の流れ・透水層・ブロック状の固体の動きを一緒に解く2次元の連成モデルを作り、混成防波堤の安定性を調べた博士論文。", "p3": "固体側は有限要素法と不連続変形法を組み合わせた節点ベースの不連続変形法（NDDA）、流体側は体積平均したレイノルズ平均ナビエ・ストークス方程式に多孔質層のフォルヒハイマー項を加えたモデルで、両者を連成した（抄録）。", "p5": "透水層の空隙率が高いと乱流エネルギーが散逸し、衝突する波の最大の高さが下がる。ただし層を厚くしても単調には下がらず、最適な厚さがあった。ケーソンの形と被覆ブロックの種類も越波と安定性を左右した（抄録）。", "fun": "防波堤は巨大なコンクリートの箱と、その前に積まれた消波ブロックの集まりだ。波が当たると水は隙間を流れ、ブロックは一つひとつ動く。水とばらばらの固体を同時に計算するのは難しいが、この研究は両方をつないだ模型で試した。隙間の多い層は波の勢いを弱めるが、厚くすればするほど良いわけではなく、ちょうどよい厚さがあるという結果が面白い。", "unverified": "抄録に数値がなく、モデルの検証方法と精度、試した空隙率・厚さの値は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "海洋循環の3次元状態を作用素推論の縮約モデルで模擬", "title": "Data-Driven Emulation of a Double Gyre Ocean Circulation Using Operator Inference", "url": "https://doi.org/10.22541/essoar.15012546/v2", "authors": "Shoshi Reich ほか", "venue": "ESS Open Archive", "date": "2026-11-25", "apa": "Reich, S., Aretz, N., Willcox, K., & Heimbach, P. (2026). Data-Driven Emulation of a Double Gyre Ocean Circulation Using Operator Inference. https://doi.org/10.22541/essoar.15012546/v2", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "ESS Open Archiveの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "計算の重い海洋大循環モデルの3次元の状態を、データから学習した縮約モデルで十年規模にわたり高速に時間発展させた。", "p3": "季節変動する風と浮力で駆動される理想化した二重循環の海盆で、学習した2次の力学と既知の海面強制から作る強制項を組み合わせる作用素推論（Operator Inference）の縮約モデルを作り、海盆全体の熱と塩の収支が閉じるよう線形の制約を課した（抄録）。", "p5": "学習に使わなかった風応力の強さでも、十年平均の表層と内部の状態、鉛直の構造、循環の輸送量の強制への依存を再現した。中規模渦の高周波の変動は弱まるが、計算は五桁以上速くなった（抄録）。", "fun": "海の流れを計算機で再現するには膨大な計算が要るので、「風が少し強かったら」と何百通りも試すのは難しい。この研究は、詳しい計算の結果から海の動きの「あらすじ」だけを取り出した小さなモデルを作った。細かい渦は表せなくなる代わりに、計算が桁違いに速くなる。熱と塩の総量が勝手に増減しないよう縛りを入れた点が工夫だ。", "unverified": "縮約モデルの次元、学習データの量、誤差の数値は抄録になく未確認。現実の海洋ではなく理想化した海盆での検証である。"}}, {"id": "pr21", "rank": 21, "headline": "災害は地域の結びつきを強める方向に働く", "title": "How do climate-fuelled disasters affect social cohesion? Evidence from a new(s) high frequency approach", "url": "https://econpapers.repec.org/RePEc:ajr:sodwps:paper_1793762534474_668", "authors": "Noah Star ほか", "venue": "RePEc NEP", "date": "2026-11-09", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "RePEc（NEP）に掲載された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "地方紙の記事から組織どうしのつながりを抜き出して地域の社会的結束を週ごとに測る指標を作り、山火事や洪水のあとに結束がどう変わるかを調べた。", "p3": "豪州ビクトリア州の地方紙を自然言語処理で分析し、報道された組織間の結びつきから「社会的結束ネットワーク指数」を統計地域（SA4）・週単位で作成した。極端な山火事・洪水を処置とする積み上げ型のイベントスタディで推定した（抄録）。", "p5": "自然災害はこの指標を高め、効果は災害の種類で異なった。山火事のあとは地域の組織のネットワークが構造的に結束を強め、洪水の効果は推定の精度が低かった（抄録）。", "fun": "「地域のきずな」はふつうアンケートで測るが、それでは変化をこまめに追えない。この研究は地方新聞の記事に出てくる団体どうしの関わりを数え、きずなを毎週測るものさしを作った。山火事のあとには団体どうしのつながりが密になっていた。災害は地域を壊すだけでなく、人々を結びつけもするらしいことを、新聞という身近な資料から示した点が面白い。", "unverified": "効果の大きさ、対象期間、新聞の数は抄録になく未確認。指標が住民の実際の結束をどこまで表すかの検証も抄録の範囲では不明。"}}, {"id": "pr22", "rank": 22, "headline": "診療支援AIの利用と医師の燃え尽きを2年間追跡", "title": "Relationship between AI decision support tool and clinician wellbeing and burnout over time: A longitudinal study (Preprint)", "url": "https://doi.org/10.2196/preprints.117830", "authors": "Ammarah Mahmud ほか", "venue": "JMIR Preprints", "date": "2026-11-26", "apa": "Mahmud, A., Simanonok, M., Bensley, K., Dale, C. R., & Dix, R. (2026). Relationship between AI decision support tool and clinician wellbeing and burnout over time: A longitudinal study (Preprint). https://doi.org/10.2196/preprints.117830", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "診療を支援するAIツールを使う医師とそうでない医師で、2年間のwell-beingと燃え尽きに関わる項目の変化を比べた。", "p3": "米国の医療機関Providence St. Joseph Healthで、2024年と2025年の調査の両方に答えた臨床医を対象に、AIの診療支援ツールMedPearlの利用と9つの調査項目の変化の関係を、医師と診療所の特性を調整した順序回帰で調べた（抄録）。", "p5": "利用者は非利用者に比べ、チームへの帰属感（調整オッズ比1.37、95%信頼区間1.13〜1.67）と仕事の裁量（1.21、1.01〜1.45）の改善を報告しやすかった。利用が多いほど、組織との価値の一致と妥当な業務量の改善も報告されやすかった（抄録）。", "fun": "AIの道具は「仕事が速くなるか」で語られがちだが、この研究は医師の気持ちの変化を2年にわたって追った。AIの診療支援を使う医師は、使わない医師より「チームの一員だと感じる」「仕事を自分で決められる」という感覚が良くなりやすかった。道具の導入が、職場での居場所の感覚に関係するかもしれないというのが意外だ。", "unverified": "対象者の人数、9項目のうち他の項目の結果は抄録になく未確認。無作為化ではない観察研究で、利用者と非利用者のもともとの違いがどこまで調整されているかは不明。"}}, {"id": "pr23", "rank": 23, "headline": "LLMのチームは計算量をそろえても個より賢いか", "title": "Recursive Collective Intelligence: Emergence on an Equal-Budget Ladder in Multi-Agent LLM Systems", "url": "https://doi.org/10.48550/arxiv.2611.32606", "authors": "Lixuan He ほか", "venue": "arXiv", "date": "2026-11-24", "apa": "He, L., Cai, S., Wu, F., Zheng, S., Jiang, L., Li, M., Ma, Y., Fei-Fei, L., Guibas, L., Wetzstein, G., Choi, Y., & Hong, Y. (2026). Recursive Collective Intelligence: Emergence on an Equal-Budget Ladder in Multi-Agent LLM Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.32606", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（OpenAlexに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "LLMのエージェントの集団が、計算量をそろえても個々より賢くなるのはどんなときかを段階的に判定する基準を作り、集団が自分の成果から次の世代を賢くできることを示した。", "p3": "集団を、単独のエージェント、計算量をそろえた多数決、計算量をそろえたpass@nの3段階で比べる「等予算のはしご」を定義した。集団自身の出力だけで次世代が同じ費用で賢くなることを再帰的集合知と呼ぶ（抄録）。", "p5": "分割された事実を転送するやり取りは、3つのモデル規模で集団をpass@nより上に押し上げた。同一の27Bのエージェントは自発的に中心役を作り、正答率が18ポイント上がった。教師なしの世代交代で成績が上がり続けた（抄録）。", "fun": "「三人寄れば文殊の知恵」というが、AIを何体も集めれば賢くなるのは当たり前で、単に計算をたくさん使っただけかもしれない。この研究は「同じだけ計算を使った多数決」と比べても勝てるかという厳しい物差しを作った。話し合いが本当に効くのは、ばらばらに持っている情報を互いに渡し合うときだった。同じAIどうしなのに、自然とまとめ役が生まれたというのも面白い。", "unverified": "使われた課題と評価データの詳細、統計的な有意性は抄録の範囲では未確認。"}}, {"id": "pr24", "rank": 24, "headline": "合成消費者は「いつもの答え」を超えられていない", "title": "When the Average Looks Right: Evaluating Behavioural Fidelity in Synthetic Consumers", "url": "https://doi.org/10.5281/zenodo.24559152", "authors": "Bajaj, Puneet", "venue": "Zenodo", "date": "2026-11-26", "apa": "Bajaj, P. (2026). When the Average Looks Right: Evaluating Behavioural Fidelity in Synthetic Consumers (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.24559152", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "LLMで作る「合成消費者」が、全員に同じ「いつもの答え」を返すだけの基準をどれだけ上回るかを調べ、ほとんど上回れていないことを示した。", "p3": "公開データTwin-2K-500で、人口統計のLLMペルソナ、文章に基づくデジタルツイン、行動で学習したモデル、最近傍の統計的な双子を比べた。同じ質問を繰り返した2つのパネル（2,058人と200人）で評価した（抄録）。", "p5": "中央値を答えるだけの基準が75.5%と74.0%で、統計的な双子は75.7%と74.7%とわずかに高いが、人による違いの29〜30%しか保てなかった。個人の情報を加えても、LLMの得点は73.1%から73.8%に上がるだけだった（抄録）。", "fun": "アンケートの答えをAIに予想させてよく当たったら、すごいと思うだろうか。実は「みんなが選びそうな答え」を全員に当てはめるだけで、かなり当たってしまう。この研究は、手の込んだAIの「分身」もその単純なやり方とほぼ同じ成績で、人ごとの違いは29〜30%しか再現できていないことを示した。平均が合っていることと、一人ひとりを当てられることは別物だと分かる。", "unverified": "各手法の実装の詳細、得点の定義は抄録になく未確認。著者は、結果は試した実装に限られると述べている。"}}, {"id": "pr25", "rank": 25, "headline": "意見の一致を測るLLM審査は言い換えと順序で揺れる", "title": "Measuring Stability and Biases of LLM-as-a-Judge for Opinion Alignment", "url": "https://doi.org/10.21203/rs.3.rs-11510348/v1", "authors": "Samuele D'Avenia ほか", "venue": "Research Square (In Review)", "date": "2026-11-25", "apa": "D’Avenia, S., Madeddu, M., Casola, S., Basile, V., & Patti, V. (2026). Measuring Stability and Biases of LLM-as-a-Judge for Opinion Alignment. https://doi.org/10.21203/rs.3.rs-11510348/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "2つの意見がどれだけ一致しているかをLLMに採点させる方法は、どのLLMを審査役にしても不安定で、長い文章と審査役自身の好む見解に点が偏ることを示した。", "p3": "一致度の得点が満たすべき2つの不変性、すなわち審査の指示を言い換えても変わらないことと、2つの意見の役割（候補と参照）を入れ替えても変わらないことを、11の審査モデルと3つのデータセットで検査した（抄録）。", "p5": "すべての審査役が不安定で、順序を入れ替えると10%超の組で得点が尺度の30%超動いた。不安定さは長さの違う組と、審査役がどちらかを好む組に集中し、候補が長いとき、候補が審査役の好む見解のときに得点が高かった（抄録）。", "fun": "作文の採点を先生に頼むとき、2枚の答案を出す順番を入れ替えただけで点が変わったら困る。ところがAIを採点役にすると、まさにそれが起きた。しかもAIは長い文章と、自分が賛成する意見に甘かった。この採点をご褒美にしてAIを訓練すると、人の多様な意見ではなく「長くて採点役好みの意見」を書くAIが育ってしまう、という警告になっている。", "unverified": "11の審査モデルの名前、3つのデータセットの内容、言い換えによる変動の大きさは抄録になく未確認。"}}, {"id": "pr26", "rank": 26, "headline": "道徳心理の指示でLLMは人の意見の割れに近づくか", "title": "Do moral-psychology prompts make LLM verdicts more human-like? Two pre-registered studies of LLM verdicts versus human disagreement", "url": "https://doi.org/10.5281/zenodo.24517372", "authors": "Tunjay Seyidali", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-11-24", "apa": "Seyidali, T. (2026). Do moral-psychology prompts make LLM verdicts more human-like? Two pre-registered studies of LLM verdicts versus human disagreement (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.24517372", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録（OpenAlexに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "日常の対人トラブルについてのLLMの判定の分布を人々の判定の分布に近づけようと、道徳心理学にもとづく推論の指示やペルソナを与えても、近づかないことを事前登録の2研究で示した。", "p3": "Scruplesコーパスの投票つきの60話について、gpt-oss-20bに話・条件ごとに10回判定させ、人の投票の分布とのずれをJensen–Shannonダイバージェンスで測った。視点取得・認知的共感・公正感受性に沿う指示やペルソナを、統制条件と比べた（抄録）。", "p5": "研究1では、判定の前に構造化した評価を書かせると人の分布からのずれが直接の判定より17%増え、道徳心理の内容に差し替えても差は検出されなかった。研究2では、3特性のペルソナは無関係な好みのペルソナと変わらなかった（抄録）。", "fun": "「悪いのはどっち？」という身近なもめごとは、人によって答えが割れる。AIに尋ねるときも、多数派の答えだけでなく「どのくらい意見が割れるか」まで再現できるかが問われる。そこで人の心理に沿って「相手の立場で考えて」と指示してみたが、かえって人の分布から離れた。答えがばらつくようになることと、人に似ることは別だった、というのが発見だ。", "unverified": "ずれの絶対的な大きさ、検定の詳細、他のモデルでも同じかは抄録の範囲では未確認。1つのモデル・60話での結果である。"}}, {"id": "pr27", "rank": 27, "headline": "74万の合成ペルソナで利用者の書き方を再現", "title": "PersonaFactory: Stylistic User Prompt Augmentation with Synthetic Persona Bank", "url": "https://arxiv.org/abs/2611.34785", "authors": "Bich Ngoc Doan ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Doan, B. N., Yukhymenko, H., & Schlag, I. (2026). PersonaFactory: Stylistic User Prompt Augmentation with Synthetic Persona Bank (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34785", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "属性を細かく定めた合成ペルソナを大量に作り、既存の利用者の入力文をそのペルソナの書き方に書き換えることで、多言語で文体の多様な対話データを生成する仕組みを示した。", "p3": "背景と話し方の特徴を構造化したペルソナを生成し、その視点で既存の入力文を書き換える。74万超のペルソナと、85言語・約124万件の会話を作り、文体の再現と意図の保持をLLMの審査と経験則の指標で評価した（抄録）。", "p5": "属性にもとづく構造化した文体の表現は、自由記述のペルソナより軸ごとの制御がしやすく、同程度の文体の再現度で意図をよく保った。専門家の評価でも会話はもっともらしいとされた（抄録）。", "fun": "AIを育てるには大量の「利用者の質問」が要るが、AIに質問文を作らせると、みな同じような平板な文になってしまう。実際の人は言語も口調もばらばらだ。この研究は、背景や話し方の癖を細かく決めた架空の人物を74万人以上用意し、同じ質問を「その人ならどう書くか」に書き換えた。質問の中身は変えずに書き方だけを変える、という分け方が工夫だ。", "unverified": "評価の具体的な数値、ペルソナの属性の項目、専門家評価の人数は抄録になく未確認。"}}, {"id": "pr28", "rank": 28, "headline": "電話型の音声AIで独居高齢者の孤独感が下がる", "title": "Knocking on Minds Door; A Mixed-Methods Field Study of a Voice LLM Companion in Older Adults Daily Lives", "url": "https://arxiv.org/abs/2611.33727", "authors": "Inhee Cho ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Cho, I., Jeong, J., Kim, B. J., Baek, J., Lee, J., Park, J., & Yoo, Y. (2026). Knocking on Minds Door; A Mixed-Methods Field Study of a Voice LLM Companion in Older Adults Daily Lives (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33727", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "電話のように向こうからかけてくる音声のLLMの話し相手を、地域で暮らす高齢者が2週間使った実地研究で、孤独感と抑うつの得点が下がった。", "p3": "ペルソナ、会話の規則、過去の通話の記憶（事実・気づき・関係の背景）で通話を組み立てる話し相手を開発し、韓国の地域在住の高齢者33人（女性29人、67〜91歳）で、通話記録・前後の質問紙・面接を集めた（抄録）。", "p5": "参加者は608回通話し、25人は期間後も使い続けた。孤独感と抑うつの得点は有意に下がり、孤独感の下位因子では孤立（情緒的孤独）だけが有意に下がった。家族に言わない心配事を話した参加者もいた（抄録）。", "fun": "スマホの画面操作が苦手なお年寄りでも、電話なら話せる。この研究は、AIのほうから電話をかけてくる話し相手を作った。2週間で孤独感がやわらぎ、家族には言えない心配事を打ち明ける人もいた。参加者が大事だと感じたのは、名前で呼ばれること、前の話を覚えていてくれることだったという。人づきあいの基本がそのまま効いているのが面白い。", "unverified": "得点の変化の大きさ、対照群の有無（抄録からは前後比較と読める）、使ったLLMは抄録になく未確認。"}}, {"id": "pr29", "rank": 29, "headline": "離脱の評価を現行の委託先に頼ると依存が続く", "title": "日本におけるSIer媒介型ベンダーロックイン：離脱評価がいかにエンタープライズITにおける依存を持続させうるか", "url": "https://doi.org/10.51094/jxiv.7259", "authors": "武田, 紘一", "venue": "Jxiv", "date": "2026-11-18", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Jxivに登録された抄録（日本語・英語）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "日本の大企業のIT調達で、特定の製品から離れられない状態が続く仕組みを、製品のベンダー・SIer・ユーザー企業の三者関係から「SIer媒介型ベンダーロックイン」として概念化した。", "p3": "公開資料にもとづく探索的な概念研究。離脱を評価する能力が現任のSIerに蓄積すること、そのSIerの能力と収益が当該ベンダーとの関係に結びついていることという2つの依存が、離脱評価の経路でつながる構図を整理した（抄録）。", "p5": "知識の移転が不十分なまま、離脱を検討するたびに現任SIerへの評価の依存が再生産され、結果としてベンダーへの依存が続くと論じる。離脱が難しい理由は費用だけではなく、この機構は日本に固有でもないとする（抄録）。", "fun": "「今の業者をやめるべきか」を、やめられると困る当の業者に相談する。そんな構図が企業のITで起きやすい、というのがこの論文の指摘だ。乗り換えが難しいのは費用が高いからだと考えがちだが、ここでは「乗り換えを判断する力」そのものが相手側にたまっていくことが問題になる。二者の関係では見えず、三者を並べて初めて見える仕組みである点が面白い。", "unverified": "実証データによる検証は行われていない（概念研究）。根拠にした公開資料の範囲と事例は抄録からは分からない。"}}, {"id": "pr30", "rank": 30, "headline": "住宅価格とSNSの痕跡で近隣の変化を多面的に測る", "title": "Beyond Gentrification: quantifying the economic, social and cultural dimensions of neighbourhood change through housing markets and digital traces", "url": "https://arxiv.org/abs/2611.34214", "authors": "Alexis Comber ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Comber, A., Asher, M., Wang, Y., Kieu, M., Quang, B. T., Thuy, H. N. T., Huu, P. H., & Malleson, N. (2026). Beyond Gentrification: quantifying the economic, social and cultural dimensions of neighbourhood change through housing markets and digital traces (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34214", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "住宅価格・人口構成・SNSの投稿を組み合わせ、地域の変化を1つの指標にまとめずに、経済・社会・文化の側面の組み合わせとして6つの型に分けた。", "p3": "英国のリーズとブラッドフォードで、2014〜2019年の住宅価格（近隣250地区との相対）、居住移動、民族構成、失業、専門職の変化率を小地域ごとに求め、約160万件の位置つき投稿をトピックモデルやLLMで特徴づけて、モデルにもとづくクラスタ分析に入れた（抄録）。", "p5": "構造的な指標と投稿の語りが食い違う地域が繰り返し見つかった。住民の入れ替わりが速いのに投稿には現れない地域や、安定しているのに停滞・衰退と誤って特徴づけられかねない地域があった。投稿の少なさは変化がないことを意味しないとも述べる（抄録）。", "fun": "街が変わるとき、家の値段が上がる、住む人が入れ替わる、話題が変わる、といったことは同時に起きるとは限らない。この研究は不動産の数字とSNSの投稿を別々のものさしとして使い、両者が食い違う場所を探した。数字の上では住民が大きく入れ替わっているのに、投稿には何も現れない地域があった。ネットに声が出ないことと、何も起きていないことは違う、という指摘が大事だ。", "unverified": "6つの型それぞれの定義と地区数、モデルの適合度は抄録になく未確認。"}}, {"id": "pr31", "rank": 31, "headline": "豪州の自治体はインフラ資産をほぼ4〜5年で再評価", "title": "How Often Do Australian Councils Revalue Their Assets? Evidence from 100 Audited Financial Statements, 2024–25 and 2025–26", "url": "https://doi.org/10.5281/zenodo.24518915", "authors": "Landmark Valuations Research", "venue": "Zenodo", "date": "2026-11-25", "apa": "Landmark Valuations Research. (2026). How Often Do Australian Councils Revalue Their Assets? Evidence from 100 Audited Financial Statements, 2024–25 and 2025–26. Landmark Valuations. https://doi.org/10.5281/ZENODO.24518915", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された作業論文の抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "オーストラリアの自治体が土地・建物・道路などの資産をどのくらいの間隔で再評価しているかを、監査済みの財務諸表100件から実際に数えた。", "p3": "各州・準州が会計基準に上乗せしている規則を読み、各法域の公式の一覧から無作為の順に取り出した自治体（131に当たり100件を入手）の最新の監査済み財務諸表から、最後の包括的な評価の時期を読み取った（抄録）。", "p5": "評価の間隔を定めるのは西オーストラリア州（5年）だけだった。決算日時点で、最後の包括的な評価からの経過年数の中央値は2年だった。間隔を定めない5つの州では72自治体中67が当年に再評価差額を計上し、西オーストラリア州では20中2だった（抄録）。", "fun": "市役所は道路や建物をいくらの価値として帳簿に載せているのだろう。会計のルールは「十分な頻度で評価し直すこと」としか言っていない。そこでこの研究は、100の自治体の決算書を1件ずつ読んで実態を数えた。あいまいな決まりのもとでも、評価し直す周期には自然と相場ができていた。決まりの文面ではなく、実際の書類から実務を確かめる地道さが面白い。", "unverified": "作業論文で査読を経ていない。入手できなかった自治体が結果に与える影響、資産の種類ごとの内訳は抄録の範囲では未確認。"}}, {"id": "pr32", "rank": 32, "headline": "不正検知の表形式トランスフォーマを損得で直接調整", "title": "From Prediction to Decision: Decision-Focused Fine-Tuning of Autoregressive Tabular Transformers for Cost-Sensitive Financial Events", "url": "https://arxiv.org/abs/2611.34858", "authors": "Ashkan Golgoon ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Golgoon, A., Domeniconi, G., Atkins, S., Servantez, S., & Khandwala, Z. (2026). From Prediction to Decision: Decision-Focused Fine-Tuning of Autoregressive Tabular Transformers for Cost-Sensitive Financial Events (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34858", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "不正などの金融の出来事を予測する表形式のトランスフォーマを、確率の当てやすさではなく、金額に応じた損得（期待効用）が最大になるように直接微調整する方法を示した。", "p3": "取引の列をトークン化して事前学習した自己回帰モデルの、ラベルのトークンに限ったソフトマックスを業務上の行動の分布とみなす。報酬は行動・結果・金額の既知の関数なので、期待効用とその勾配が閉じた形で得られる。事前学習モデルへのKLの錨と補助の言語モデル項で較正を保つ（抄録）。", "p5": "抄録は方法の構成を述べており、数値の結果は示していない。標本抽出や批評器、アドバンテージの推定が要らない、例ごとに費用が異なる費用考慮型の学習になると説明する（抄録）。", "fun": "不正な取引を見つけるAIは、ふつう「不正である確率」を当てるように訓練する。でも金融機関にとって、高額の不正を見逃す損と、少額の正しい買い物を誤って止める損は釣り合わない。この研究は、確率ではなく「金額で測った損得」が良くなるようにAIを直接鍛える方法を提案した。何を良い答えとみなすかを変えると、同じAIでも鍛え方が変わる、という発想が面白い。", "unverified": "抄録に実験結果の数値がなく、従来のしきい値による方法に比べてどれだけ改善するかは未確認。使ったデータも抄録からは分からない。"}}, {"id": "pr33", "rank": 33, "headline": "因果グラフが定まらなくても通用する改善策を探す", "title": "Robust Recourse under Causal Graph Ambiguity", "url": "https://arxiv.org/abs/2611.34723", "authors": "Muyan Anna Li ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Li, M. A., Sinnott, J., Kohandel, M., & Karimi, A.-H. (2026). Robust Recourse under Causal Graph Ambiguity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34723", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "不利な判定を覆すための行動を勧める「リコース」で、データに合う因果グラフが複数あって決められないときにも通用する、低費用の行動を探す方法を示した。", "p3": "候補のグラフすべてで成功する行動を探す最悪ケース型と、グラフの重みの一定割合で成功すればよいとする重みつき型を提案した。グラフごとにガウス過程の構造方程式を当てはめ、勾配にもとづく探索で最小費用の行動を求める（抄録）。", "p5": "20ノードのベンチマークでは、頑健性の条件をゆるめると、行動を提示できる事例が1,000件中341件から436件に増える一方、生成モデルのもとで本当に判定が覆る件数は251件から184件に減り、提示できる範囲と有効性の交換関係が示された（抄録）。", "fun": "審査に落ちた人に「ここをこれだけ変えれば通ります」と助言するには、何を変えると何が変わるかという因果の地図が要る。ところがその地図は、同じデータから何通りも描けてしまう。この研究は「どの地図でも通用する助言」を探した。安全を重視すると助言できる人が減り、ゆるめると助言は増えるが外れも増える。親切さと確かさの板ばさみが数字で見える。", "unverified": "合成・半合成のベンチマークでの結果で、実データでの検証は抄録の範囲では未確認。候補グラフの集合をどう用意するかも不明。"}}, {"id": "pr34", "rank": 34, "headline": "頑健な改善提案は多数派に偏るという副作用", "title": "Beyond Robust Algorithmic Recourse: Sharing the Burden of Validity through Model Multiplicity", "url": "https://doi.org/10.48550/arxiv.2611.32543", "authors": "Prakhar Ganesh ほか", "venue": "arXiv", "date": "2026-11-24", "apa": "Ganesh, P., Taïk, A., & Farnadi, G. (2026). Beyond Robust Algorithmic Recourse: Sharing the Burden of Validity through Model Multiplicity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.32543", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（OpenAlexに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "モデルが更新されても有効な「頑健な」改善提案は、多数派の振る舞いに近い方向へ提案を偏らせて格差を広げることを示し、有効性を保つ負担を個人だけに負わせない方法を提案した。", "p3": "不利な判定を覆すための行動の提案（リコース）で、頑健性の要請が実行可能な提案をデータの高密度な領域に制約することを分析した。同程度に良いモデルが複数あること（多重性）を使い、運用者がモデルを戦略的に選んで有効性を保つ（抄録）。", "p5": "頑健でない提案は将来無効になる危険があり、頑健な提案は不公平を生むという交換関係は、個人だけが有効性の負担を負うという暗黙の前提から生じると論じ、モデル選択で負担を分け合えばこの緊張を解けると主張する（抄録）。", "fun": "「こう直せば次は審査に通ります」と助言しても、審査のしくみが後で変われば無駄になる。だから「しくみが変わっても通用する助言」が良いとされてきた。ところがその安全な助言は、多数派と同じような姿を目指させるものになり、少数派に不利だという。この研究は、努力を個人だけに求めず、審査する側がしくみの選び方で歩み寄るという逆転の発想を示した。", "unverified": "抄録に実験の数値がなく、不公平がどの程度生じ、提案法でどれだけ減るかは未確認。"}}, {"id": "pr35", "rank": 35, "headline": "軌道データが一致しても大域的な性質は決まらない", "title": "Structural Non-Identifiability and Quantitative Certification of Nonlinear Dynamics from Trajectory Data", "url": "https://doi.org/10.20944/preprints202611.2701.v1", "authors": "Robert Vrabel", "venue": "Preprints.org", "date": "2026-11-26", "apa": "Vrabel, R. (2026). Structural Non-Identifiability and Quantitative Certification of Nonlinear Dynamics from Trajectory Data. https://doi.org/10.20944/preprints202611.2701.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "有限個の観測された軌道とぴったり一致するモデルを作っても、大域的な安定性や平衡点の一意性といった長期の性質は原理的に保証できないことを証明し、保証に必要な追加の情報を示した。", "p3": "2次元以上の滑らかなモデルでは、観測の近傍のベクトル場を保ったまま、離れた場所の力学を任意に差し替えられることを示す。逆に、空間のδ網の上でヤコビアンの推定を保証できれば、α>ε+Lδのとき領域的な縮小性が言えることも示す（抄録）。", "p5": "大域的な漸近安定性、大域的な縮小性、局所安定な平衡点の一意性は、記録からは証明できない。粘性減衰のある機械系でも、同一の実験結果・復元力・エネルギー・散逸則が、安定なポテンシャルの井戸の数の異なる系と両立する（抄録）。", "fun": "ボールの転がり方を何回か完全に記録できたとしても、まだ転がっていない場所にくぼみがいくつあるかは分からない。この論文はそれを数学として証明した。データとぴったり合うモデルでも、観測していない場所ではいくらでも違う振る舞いを仕込めるからだ。「データに合う」ことと「先々まで保証できる」ことの間には、埋められない溝があると分かる。", "unverified": "定理の証明と前提条件の詳細、数値例の有無は抄録の範囲では未確認。査読前の原稿である。"}}, {"id": "pr36", "rank": 36, "headline": "ノイズの分布を知らずに効率的にFIR系を同定", "title": "Asymptotically Efficient Finite Impulse Response System Identification without Noise Knowledge", "url": "https://arxiv.org/abs/2611.34039", "authors": "Zichen Liu ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Liu, Z., & Mu, B. (2026). Asymptotically Efficient Finite Impulse Response System Identification without Noise Knowledge (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34039", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "ノイズの分布を知らなくても、また裾の重いノイズでも、理論上最良の精度に達する有限インパルス応答（FIR）システムの同定法を示した。", "p3": "一致性のある初期推定の残差から核密度推定でノイズの分布を見積もり、それで尤度を近似する2つの推定量（eMLEとepMLE）を作る。1ステップのニュートン・ラフソン法で計算する（抄録）。", "p5": "緩い正則条件のもとで、どちらの推定量も一致性と漸近正規性をもち、クラメール・ラオの下限に達することを示した。さまざまなノイズ分布のシミュレーションで、最小二乗法と最小絶対偏差法より頑健で正確だった（抄録）。", "fun": "測定にはノイズがつきものだが、そのノイズがどんな形で散らばるかは事前には分からない。ふつうは形を仮定して計算する。この研究は、まずざっくり推定し、残った誤差からノイズの形そのものをデータに教えてもらう。そうすると、ノイズの形を最初から知っていた場合と同じ精度に届くことが多いという。知らないことをデータから補う発想が面白い。", "unverified": "シミュレーションの具体的な条件と数値、実データでの検証の有無は抄録になく未確認。"}}, {"id": "pr37", "rank": 37, "headline": "同定用の入力を引数空間を埋めるように設計", "title": "Gaussian Processes for Optimal Space-Filling Input Design", "url": "https://arxiv.org/abs/2611.34712", "authors": "M\\'at\\'e Kiss ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Kiss, M., Liu, Y., Schoukens, M., & Tóth, R. (2026). Gaussian Processes for Optimal Space-Filling Input Design (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.34712", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "非線形システムの同定に使う実験の入力信号を、モデルの引数の空間を満遍なく埋めるようにガウス過程で設計する方法を示した。", "p3": "非線形の近似器が受け取る引数の空間で、データが空間を埋める分布になるよう入力を設計する。V最適・D最適といった実験計画の最適性の理論と結びつけ、実験の目的に対する情報量を最大にするよう調整できる（抄録）。", "p5": "シミュレーションの例で、空間を埋める信号で学習したモデルは、そうでない実験から得たモデルより、関心のある領域で良く一般化した（抄録）。", "fun": "機械のふるまいをデータから学ぶとき、同じような条件ばかり試したデータでは、試していない条件で大きく外す。だから「どんな入力で実験するか」が大事になる。この研究は、起こりうる状態の地図をまんべんなく塗りつぶすような入力の作り方を示した。テスト勉強で、得意な分野ばかりでなく全範囲を一通りやるのに似ている。", "unverified": "抄録に数値がなく、対象にした系、改善の大きさ、計算量は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "打撃ハンマの質量と先端でFRFの帯域が変わる", "title": "Impact Hammer Selection for Resonance Testing of Bituminous Mixture Slabs: Experimental and Numerical Investigation", "url": "https://doi.org/10.21203/rs.3.rs-11394150/v1", "authors": "Ana Karoliny Lemos Bezerra ほか", "venue": "Research Square (In Review)", "date": "2026-11-25", "apa": "Bezerra, A. K. L., Carret, J.-C., Mangiafico, S., & Sauzéat, C. (2026). Impact Hammer Selection for Resonance Testing of Bituminous Mixture Slabs: Experimental and Numerical Investigation. https://doi.org/10.21203/rs.3.rs-11394150/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "アスファルト混合物の板を叩いて共振を測る試験で、ハンマの質量と先端の硬さが、励起できる周波数の帯域と見つかる振動モードを左右することを実験と解析で示した。", "p3": "厚さの違う2枚の長方形の板で、小型の鋼ハンマと、鋼・樹脂・軟質樹脂・超軟質樹脂の先端を交換できる通常のハンマを使い、力と加速度から周波数応答関数を求めた。線形粘弾性モデルの3次元解析でモードを同定し、実験と照合した（抄録）。", "p5": "通常のハンマに樹脂または鋼の先端を付けると0〜3000Hzに適切な周波数成分が得られ、最初の2つの曲げモードを同定できた。小型の鋼ハンマは低周波の加振が弱く、超軟質の先端はごく低い周波数にエネルギーが集中した（抄録）。", "fun": "ものを叩いて音や揺れを調べる検査は、スイカを叩いて中身をみるのと同じ発想だ。ただ、何で叩くかで結果が変わる。この研究は道路の舗装材の板で、ハンマの重さと先端の硬さを変えて確かめた。小さな鋼のハンマでは低い揺れが十分に起きず、とても柔らかい先端ではごく低い揺れしか起きなかった。測りたい揺れに合わせて道具を選ぶ必要がある、という基本を実証している。", "unverified": "板の寸法と厚さ、固有振動数の値、実験と解析の一致の程度（数値）は抄録になく未確認。"}}, {"id": "pr39", "rank": 39, "headline": "濃いエマルションも粒状体の流動則に従う", "title": "Soft Matter, Hard Rules: Emulsions Follow the Laws of Granular Suspension Rheology", "url": "https://arxiv.org/abs/2611.33526", "authors": "Wenjun Chen ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Chen, W., De Giuli, E., Wyart, M., Forterre, Y., Brujić, J., & Metzger, B. (2026). Soft Matter, Hard Rules: Emulsions Follow the Laws of Granular Suspension Rheology (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33526", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "濃いエマルション（混ざり合わない液滴の集まり）の流れ方が、粒の集まりの流れ方と同じ法則で整理できることを実験で示した。", "p3": "従来の体積を固定する測り方ではなく、最近開発された装置Capillarytronで浸透圧を制御変数にした。浸透圧が液滴の変形を通じて、圧力に依存するジャミング（詰まり）の体積分率を決めるとみなす（抄録）。", "p5": "ジャミング点からの距離で表すと、浸透圧を課した測定と体積分率を課した測定のすべてのデータが1つのべき乗則の発散に重なった。得られた構成則は調整パラメータなしで、ニュートン流動・降伏・ずり流動化の領域を説明する（抄録）。", "fun": "食品や薬に使われる濃い乳液と、砂や粉のような粒の集まりは、まったく別物に見える。ところが「詰まって動けなくなる点までどれだけ余裕があるか」で整理すると、乳液の流れやすさは粒の集まりと同じ法則に乗った。液滴は柔らかいので、押す力によって詰まる点が動くだけだという。柔らかい物も硬い粒と同じ決まりに従う、という統一の見方が面白い。", "unverified": "べき指数の値、使った試料、測定範囲は抄録になく未確認。"}}, {"id": "pr40", "rank": 40, "headline": "AIエージェントが実行中のDEM計算を読み書きする", "title": "Connecting AI Agents to Live Discrete Element Simulations via the Model Context Protocol", "url": "https://arxiv.org/abs/2611.33926", "authors": "Yusong Han ほか", "venue": "arXiv", "date": "Thu, 26 Nov 2026", "apa": "Han, Y., Uzuoka, R., & Ueda, K. (2026). Connecting AI Agents to Live Discrete Element Simulations via the Model Context Protocol (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.33926", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "汎用のAIエージェントが、計算の進行中に個別要素法（DEM）のシミュレーションを読み、変更し、止められるようにする接続の仕組み（MCPサーバ）を作り、公開した。", "p3": "マニュアルを検索・閲覧する2つの道具と、コードの実行、長い計算の投入、状況の確認、実行中のモデルの読み取り、停止の5つの道具を、商用のPFCと公開のYADEの両方で提供する。人は従来どおりエンジンの画面で作業を続けられる（抄録）。", "p5": "密な豊浦砂の排水三軸試験のモデルを実験データに合わせる較正を、エージェントが両方のエンジンで行った。YADEでの同じ較正を7つの言語モデルに人の介入なしで各3回させると、21回中20回が目標に達し、19組のパラメータが許容範囲の中の小さな1領域に集まった（抄録）。", "fun": "砂粒を一つひとつ計算する模擬実験は、条件を少し変えては何時間も待つ、根気のいる作業だ。この研究は、AIが計算の途中経過をのぞき、設定を直し、必要なら止められる「つなぎ役」を作った。砂の実験結果に計算を合わせる作業を7種類のAIに任せると、21回のうち20回で目標に届いた。しかも人が同じ画面で作業していると、AIがそれに気づいて対応したという。", "unverified": "較正の目標値と誤差、各言語モデルの名前、所要時間は抄録になく未確認。"}}, {"id": "pr41", "rank": 41, "headline": "大規模な斜面崩壊が起こす地盤振動を物質点法で予測", "title": "Simulating Ground Vibrations Induced by Hypothetical Large Scale Slope Collapse Using Unified Geomechanical and Seismic Methods", "url": "https://doi.org/10.21203/rs.3.rs-11448330/v1", "authors": "João Pedro Delveaux ほか", "venue": "Research Square (In Review)", "date": "2026-11-26", "apa": "Delveaux, J. P., Figueiredo, R. P., Eikmeier, C. N., & Afanasiev, M. (2026). Simulating Ground Vibrations Induced by Hypothetical Large Scale Slope Collapse Using Unified Geomechanical and Seismic Methods. https://doi.org/10.21203/rs.3.rs-11448330/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "鉱山の大規模な斜面崩壊が起きた場合に周囲の地盤がどう揺れるかを、崩壊の力学計算と地震波の伝播計算をつないで予測する手法を示した。", "p3": "地上の干渉レーダーの監視と変形のデータから3次元の応力・ひずみ解析で崩壊面を定め、物質点法（MPM）で土塊の移動による動的な接触力を計算し、それを震源としてスペクトル要素法（SEM）で実際の地質構造の中の波動伝播を解く（抄録）。", "p5": "露天掘り鉱山での1千万トン級の急な崩壊を想定し、3次元の地形・多層の地質境界・岩質の不均質を弾性モデルに入れて、表面波の増幅や幾何学的な広がりなどを15Hzまで捉え、最大速度・最大加速度・波形の場所による違いを定量化した（抄録）。", "fun": "斜面が一気に崩れると、落ちた土砂が地面を叩いて、地震のような揺れが周りに伝わる。この研究は、まだ起きていない崩壊について、土砂の動きの計算と揺れの伝わり方の計算をつなぎ、近くの施設がどれだけ揺れるかを前もって見積もる。従来の研究は「地震が地すべりを起こす」向きの計算が中心だが、ここでは逆に「崩壊が揺れを起こす」向きに計算をつないだ点が新しい。", "unverified": "予測された揺れの大きさの具体的な値、対象の鉱山、内部減衰を除いたことの影響は抄録の範囲では未確認。実測との照合の有無も不明。"}}, {"id": "pr42", "rank": 42, "headline": "施設の復旧と住民のサービス回復は別々に進む", "title": "Resilient Cities Through Services and Relationships: Infrastructure, Social Inclusion and Decisions Under Uncertainty", "url": "https://doi.org/10.17613/vxz8q-zjn58", "authors": "HUANG, Wanhong", "venue": "Zenodo", "date": "2026-11-25", "apa": "HUANG, W. (2026). Resilient Cities Through Services and Relationships: Infrastructure, Social Inclusion and Decisions Under Uncertainty. Knowledge Commons. https://doi.org/10.17613/VXZ8Q-ZJN58", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された報告書の抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "災害後の都市の回復を、施設の修理が終わることと、住民がそのサービスを再び使えるようになることの2つに分けて捉え、平均的な損失を減らす復旧策が弱い立場の人に不利に働きうることを示した。", "p3": "災害の記録、都市のアクセスの地理的な分析、エージェントベースモデルを組み合わせた。モデルでは進化的な探索で修理と支援の組み合わせを選び、同じ予算の技術的な組み合わせと比べた（抄録）。", "p5": "援助から排除される条件では、平均の損失を減らすよう選んだ組み合わせは都市全体のサービスを改善する一方、100回の模擬のうち78回で脆弱な層の無サービスの世帯・日数の割合を増やした。脆弱な層の損失で選ぶと24回に減った。洪水が重なると46回と45回だった（抄録）。", "fun": "施設が直ったと発表されても、支援を受けにくい人の家でサービスが実際に使えるようになるのは、もっと後かもしれない。この報告は、「施設が直った日」と「住民が実際に使えるようになった日」を分けて数えることを提案する。街全体の平均を良くする復旧の進め方が、弱い立場の人の取り分をかえって悪くする場合が、模擬実験100回中78回で起きた。平均だけを見る危うさが分かる。", "unverified": "報告書で査読を経ていない。モデルの設定、対象にした都市と災害記録、結果の頑健性は抄録の範囲では未確認。"}}, {"id": "pr43", "rank": 43, "headline": "日中韓1.5万件の投稿から観光の混雑への見方を比較", "title": "Geopolitical Tensions, Chinese Tourism to South Korea, and Perceptions of Tourism Overcrowding: A Multilingual Text-Mining Study of 15, 000 Chinese, Japanese, and Korean Online Comments", "url": "https://econpapers.repec.org/RePEc:zbw:esrepo:344261", "authors": "Chae, Jinwoo", "venue": "RePEc NEP", "date": "2026-11-09", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "RePEc（NEP）に掲載された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "訪韓する中国人観光と観光地の混雑についてのネット上の書き込みを、中国語・日本語・韓国語で同じ手順で分析し、言語圏ごとに関心の向きが違うことを示した。", "p3": "中国語・日本語・韓国語の書き込みを各五千件、計一万五千件集め、多言語の前処理、頻度分析、キーワードの共起ネットワーク、感情分析、トピックモデル、内容の符号化（混雑、インフラへの負荷、住民の不便、経済的な便益など）を組み合わせた（抄録）。", "p5": "中国語の書き込みは旅行の機会と行きやすさを、日本語は地域の政治関係と行き先の比較を、韓国語は都市の混雑、住民の不便、訪問客の経済的な影響を多く論じていた。個々の書き込みを国民全体の見解と同一視しないよう注意を促している（抄録）。", "fun": "同じ「韓国への中国人観光」という話題でも、どの言語で書かれた書き込みを読むかで見える景色が変わる。中国語では「行きやすさ」、日本語では「国どうしの関係」、韓国語では「混雑と住民の迷惑、そして経済への影響」が中心だった。旅行する側、横で見ている側、迎える側で関心が違うことを、三つの言語の書き込みを同じ手順で比べて確かめた点が面白い。", "unverified": "書き込みの収集元と期間、感情分析やトピックの具体的な結果の数値は抄録になく未確認。"}}, {"id": "pr44", "rank": 44, "headline": "全人口ネットワークでつながりと信頼の関係を調べる", "title": "Cross-domain network embeddedness and generalised trust: Evidence from a whole-population network in the Netherlands", "url": "https://doi.org/10.5281/zenodo.24466229", "authors": "Milena Costa", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-11-24", "apa": "Costa, M. (2026). Cross-domain network embeddedness and generalised trust: Evidence from a whole-population network in the Netherlands. Zenodo. https://doi.org/10.5281/ZENODO.24466229", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoの発表資料の抄録（OpenAlexに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "オランダの全住民をつなぐ行政データのネットワークを使い、人のつながりが家族・職場・近隣など複数の領域にどうまたがっているかと、他者一般への信頼との関係を調べる研究の発表資料。", "p3": "オランダ統計局が構築した約1,700万人の多層ネットワーク（家族・世帯・近隣・職場・教育）から個人ごとの指標を作り、社会的結束と幸福の調査（2020〜2023年、28,483人）の一般的信頼と結びつけた。領域をまたぐ埋め込みを、多重性と参加の均等さの2つで測る（抄録）。", "p5": "抄録は結果の数値を示していない。方法上の貢献として、家族と世帯の登録簿の行政上の重なりを考慮した、調整済みの多重性の指標を開発したと述べる（抄録）。", "fun": "人のつながりと他人への信頼の関係を調べるには、ふつう本人に友人の数などを尋ねる。この研究はそうではなく、国の登録簿から作った全住民約1,700万人分のつながりの地図を使う。家族、同じ世帯、近所、職場、学校という別々の場で、同じ相手と重なってつながっているか、どの場にもまんべんなくつながっているかを測るという発想が面白い。", "unverified": "修士論文の研究の発表資料の要約で、信頼との関係の結果（向きや大きさ）は抄録になく未確認。"}}, {"id": "pr45", "rank": 45, "headline": "孤独と前向きな独りは別の心理特性と結びつく", "title": "Distinct Personality and Motivational Profiles of Loneliness and Positive Solitude", "url": "https://doi.org/10.21203/rs.3.rs-11871867/v1", "authors": "Veronika Juríčková ほか", "venue": "Research Square (In Review)", "date": "2026-11-26", "apa": "Juríčková, V., Doubková, N., Heissler, R., Knížková, K., Mohr, P., & Preiss, M. (2026). Distinct Personality and Motivational Profiles of Loneliness and Positive Solitude. https://doi.org/10.21203/rs.3.rs-11871867/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "望まない「孤独」と自分で選ぶ「前向きな独り」は、結びつく性格の特徴と動機がはっきり異なることを示した。", "p3": "チェコの成人1,725人を対象に、パーソナリティ機能、不適応的なパーソナリティ特性、独りでいる動機の向きが、孤独感と前向きな独りのそれぞれにどれだけ独自に寄与するかを階層的回帰分析で調べた（抄録）。", "p5": "孤独感は、パーソナリティ機能の障害、離脱、否定的感情、自己決定的でない動機と最も強く関連した。前向きな独りは主に自己決定的な動機と関連し、パーソナリティ機能や不適応的な特性との関連は比較的小さかった（抄録）。", "fun": "一人でいることは、寂しいこととは限らない。好きで一人の時間を過ごす人もいる。この研究は1,725人の調査から、寂しさは性格面のつまずきや「自分で選んだのではない独り」と結びつき、心地よい独りは「自分で選んだ独り」と結びつくことを示した。同じ「一人」でも、理由が自分の意思かどうかで意味が変わる、という点が大事だ。", "unverified": "関連の強さの数値、使った尺度の名前、標本の集め方は抄録になく未確認。横断調査のため因果の向きは分からない。"}}, {"id": "pr46", "rank": 46, "headline": "ナイジェリア大手の財務諸表に気候リスクは未反映", "title": "Climate Risk in the Numbers: Do Nigerian Financial Statements Reflect the IASB's 2025 Climate Uncertainty Examples Ahead of IFRS S2?", "url": "https://doi.org/10.5281/zenodo.24557802", "authors": "Davies, Joseph", "venue": "Zenodo", "date": "2026-11-26", "apa": "Davies, J. (2026). Climate Risk in the Numbers: Do Nigerian Financial Statements Reflect the IASB's 2025 Climate Uncertainty Examples Ahead of IFRS S2? (Version 4.0). Zenodo. https://doi.org/10.5281/ZENODO.24557802", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された作業論文の抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "ナイジェリアの大手上場企業14社の監査済み財務諸表と監査報告書に、気候リスクが実際に反映されているかを採点し、ほとんど反映されていないことを示した。", "p3": "監査済みの注記の中にある気候関連の記載だけを数える7指標の「連結性指数」を作り、銀行・石油ガス・セメント・通信の14社の2025年度の書類に当てはめた。公開したコードブックにもとづきAIが符号化し、著者が確認した（抄録）。", "p5": "14社中9社は無記載で、会計とつながっていると判定された企業はなかった。貸出の気候ストレステストを行う銀行は、その結果を監査済みの財務諸表の外で報告していた。監査報告書で気候に触れたのは2件で、監査上の主要な検討事項とした例はなかった（抄録）。", "fun": "企業は気候変動のリスクを報告書で語るようになった。では、その話は決算の数字や注記にまで届いているのか。この研究は、監査を受けた部分だけに絞って調べた。すると14社のうち9社では、監査済みの部分に気候の話がなかった。報告書の言葉と、監査を受ける決算書の中身との間に境目があることが見えてくる。", "unverified": "作業論文で査読を経ていない。7つの指標の内容と採点基準、AIによる符号化の一致度は抄録になく未確認。"}}, {"id": "pr47", "rank": 47, "headline": "公立大病院の15年の診療実績と財務を年報から追う", "title": "Service Disruption, Recovery, and Financial-Operational Context in a Public Tertiary Hospital: A Longitudinal Study of AIIMS New Delhi, 2010-2025", "url": "https://doi.org/10.21203/rs.3.rs-11663476/v1", "authors": "KOTESWARA RAO VEGINATI ほか", "venue": "Research Square (In Review)", "date": "2026-11-25", "apa": "VEGINATI, K. R., KAFILA, & KUDALI, P. (2026). Service Disruption, Recovery, and Financial-Operational Context in a Public Tertiary Hospital: A Longitudinal Study of AIIMS New Delhi, 2010-2025. https://doi.org/10.21203/rs.3.rs-11663476/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "インドの大規模な公立病院の長年の年報から、診療の量と財務の推移を1つの時系列にまとめ、2020〜2021年の診療の落ち込みとその後の回復の大きさを見積もった。", "p3": "AIIMSニューデリーの2010–2011年度から2024–2025年度の公開の年報から、外来・入院・処置・病床・稼働率・在院日数と財務指標の系列を作り、長期のトレンドモデル、区分したパルスと傾きのモデル、センター固定効果モデルを推定した（抄録）。", "p5": "2020–2021年度の外来・入院・処置は、それ以前の傾向から61.0%、44.5%、62.1%低かったと推定された。2024–2025年度には外来が2019–2020年度より9.7%、入院が34.7%、処置が27.6%多く、名目の収入と支出は70.1%と68.4%増えた（抄録）。", "fun": "大きな病院は、毎年どれだけの患者を診て、いくら使ったかを年報で公表している。この研究はその年報を長年分つなぎ合わせ、2020〜2021年に外来が大きく落ち込んだこと、その後どこまで戻ったかを数字で追った。面白いのは「戻った」の基準が2つあることで、落ち込む前の実績と比べるのか、それまでの伸びが続いていれば届いたはずの水準と比べるのかで評価が変わる。", "unverified": "財務指標の内訳と定義、欠測や定義変更のある年の扱いの詳細は抄録の範囲では未確認。著者は推定値が因果効果ではないと明記している。"}}, {"id": "pr48", "rank": 48, "headline": "動く波源の軌道はどこまで復元できるか", "title": "From causal kernel to spectral gap: sensitivity and identifiability of a moving Gaussian source in the wave equation (1D and 2D)", "url": "https://doi.org/10.5281/zenodo.24527729", "authors": "Sapelyuk, Yaroslav", "venue": "Zenodo", "date": "2026-11-25", "apa": "Sapelyuk, Y. (2026). From causal kernel to spectral gap: sensitivity and identifiability of a moving Gaussian source in the wave equation (1D and 2D). Zenodo. https://doi.org/10.5281/ZENODO.24527729", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "波動方程式の中を動く波源の軌道を観測から逆算する問題で、どの部分が復元でき、どの部分が原理的に復元できないかを数値と解析の両面から整理した。", "p3": "1次元と2次元で、ガウス型の波源の軌道をBスプラインで表し、チホノフの正則化つきの最小化で逆推定する。順問題は1次元ではダランベールの積分、2次元ではポアソン積分と差分で解き、ヤコビアンの階数と特異値を診断した（抄録）。", "p5": "観測の初期の窓でヤコビアンの有効な階数が構造的に落ちることと、観測の終わり近くに「見えない区間」ができることを数値で見いだし、後者は波の有限の伝播速度によると説明した。軌道の末尾が同定できないことの定理と、見える部分の局所的な同定可能性の命題を示す（抄録）。", "fun": "動きながら波を出す物の位置を、波の記録から逆算したい。ところが波は有限の速さでしか伝わらないので、観測を打ち切る直前に出た波はまだ観測点に届いていない。だから軌道の最後の部分は、どんなに工夫しても分からない。この研究は、その「見えない区間」ができる仕組みを式で示した。分からないことの範囲をきちんと決めるのも科学の仕事だと分かる。", "unverified": "数値実験の誤差やノイズの条件の詳細、定理の前提は抄録の範囲では未確認。査読を経ていないZenodo上の文書で、コードは請求に応じて提供とある。"}}, {"id": "pr49", "rank": 49, "headline": "高い製品は耐久性の試験でも少しだけ良い", "title": "What a Price Premium Buys: Product-Level Evidence on Price, Tested Quality, and Durability from 743 Consumer-Test Groups in Four European Markets", "url": "https://doi.org/10.21203/rs.3.rs-11774817/v1", "authors": "Pavel Kopczyk", "venue": "Research Square (In Review)", "date": "2026-11-26", "apa": "Kopczyk, P. (2026). What a Price Premium Buys: Product-Level Evidence on Price, Tested Quality, and Durability from 743 Consumer-Test Groups in Four European Markets. https://doi.org/1
