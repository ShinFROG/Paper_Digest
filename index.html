<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>

</div>

2026-10-16", "apa": "Zou, X., Shamsher, S., Huang, J., Liu, B., Lu, W., Hong, C., Lu, H., & Zhang, Y. (2026). Real-Time Truck-Induced Strain Monitoring and Intelligent Safety Assessment of a Large-Scale Steel Platform in Hong Kong. https://doi.org/10.20944/preprints202610.1551.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（Preprints.org、本文は入手できず）", "preprint": true, "p1": "香港の大型の傾斜した鋼製プラットフォームで、運搬トラックによるひずみをIoTで常時計測し、事象単位の統計とデジタルシャドウで運用中の安全評価に変換した（抄録）。", "p2": "工事車両が繰り返し通る鋼製プラットフォームの応答は、ふつう定期点検で評価され、連続計測で運用中の状態を把握する枠組みが不足していた（抄録）。", "p3": "梁・縦材・柱・斜材に振動弦式ひずみ計15個を付け、IoTゲートウェイと4G回線でクラウドに送る。ゆっくり変わる成分とトラック通過による過渡的な増分を分ける「事象を保存する処理」で、複数センサの同時の応答から荷重事象の候補を特定する（抄録）。", "p4": "時刻付きの現場写真でトラック通過の基準事象を独立に記録し、候補事象の分布の解釈の物理的な基準とする。採用した工学的なひずみ限界と比べて、通常・注意・危険の3状態で表示する（抄録）。", "p5": "全期間の事象単位の分布は、空間的に強く不均一だが繰り返し現れる応答パターンを示し、3つのチャネルが一貫して最大の局所ひずみ増分を示した。事象統計とIoT伝送で運用時のひずみ応答の包絡線を作り、支配的な計測点を特定できたとする（抄録。ひずみの数値は抄録になし）。", "p6": "基準事象は写真で記録された1件で、候補事象の荷重の大きさは直接は分からない（抄録から読み取れる範囲）。解釈：トラックの重量・速度の情報がないと、荷重と応答の対応づけは限定的になりうる。", "fun": "工事現場の鉄の足場の上をダンプカーが何度も行き来します。15個のセンサで「どこがどれだけ伸びたか」を絶えず測り、クラウドで信号の色のように「通常・注意・危険」と表示しました。点検の日だけでなく、毎日の揺れの記録から構造の健康を見守る仕組みです。", "unverified": "ひずみの値、計測期間、検出された事象の数は未確認。"}}, {"id": "pr03", "rank": 3, "headline": "AIによる職場変化で従業員の幸福は上昇か下降の螺旋に", "title": "Upward and Downward Spirals in Employee Well-Being: Personality Profiles and Psychological Resources Under AI-Related Workplace Change", "url": "https://doi.org/10.2139/ssrn.7617538", "authors": "Matthew Monnot", "venue": "SSRN", "date": "2026-10-16", "apa": "Monnot, M. (2026). Upward and Downward Spirals in Employee Well-Being: Personality Profiles and Psychological Resources Under AI-Related Workplace Change. https://doi.org/10.2139/ssrn.7617538", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN、本文は入手できず）", "preprint": true, "p1": "オランダの長期パネルで、AIによる職場の変化が心理的資源を通じて従業員の幸福を上向き・下向きの螺旋に導くことを、性格プロフィールの移り変わりとともに示した（抄録）。", "p2": "AIは仕事の割り当て・監視・報酬の仕方を変え、幸福を支える心理的資源を消耗させる。しかし、どんな人がどの資源で回復し、どんな人が離脱するのかは分かっていなかった（抄録）。", "p3": "資源保存（COR）理論に基づき、LISSパネル（2008〜2025年、72,433人・波）で測定不変な潜在プロフィール分析により性格の型を取り出し、AI関連のストレス要因と心理的資源の効果、型の移行、個人内の交差遅延を推定する（抄録）。", "p4": "既存研究の4型解との一致（平均r=.91、Tucker一致係数=.96）で型の妥当性を確かめ、仕事・生活満足、移行の方向、健康による労働時間の損失、離職意図を比べる。分類誤差への感度も見る（抄録）。", "p5": "Distressed、Antagonistic、Reserved、Resilientの4型が得られた。2020年の置き換えリスクと疲弊は2025年の満足の低さと関連した。楽観性・自尊心・仕事の意味が高いほど、DistressedからResilientへの回復型の移行が多かった。職業単位のAI曝露ではなく、主観的な置き換えの知覚が関連を担った（抄録）。", "p6": "Distressedの増幅の調整効果は支持されず、実際の離職はResilientと差がなかった（抄録）。解釈：観察データであり、資源と幸福の因果の向きは交差遅延の範囲での推論にとどまる。", "fun": "AIで仕事が変わるとき、つらくなる人と立ち直る人がいます。72,433人・波の長期の追跡データから、「自分は置き換えられそう」という本人の感じ方が、職業のAI化の度合いそのものより心に響くことがわかりました。楽観や仕事の意味が、回復の道を分ける荷物になります。", "unverified": "本文の表、効果量、AI関連の項目の具体的な質問文は未確認。"}}, {"id": "pr04", "rank": 4, "headline": "LLMの普及でオンライン調査の証拠が損なわれている", "title": "LLM Adoption is Eroding Evidence in Online Research", "url": "https://doi.org/10.2139/ssrn.7615862", "authors": "Juliette Zaccour ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Zaccour, J., & Rocher, L. (2026). LLM Adoption is Eroding Evidence in Online Research. https://doi.org/10.2139/ssrn.7615862", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN、本文は入手できず）", "preprint": true, "p1": "研究者がLLMで回答者を模擬することと、回答者がLLMで調査に答えることの扱いの二重基準を批判し、両方がオンライン研究の証拠を損なっていると論じた論考（抄録）。", "p2": "LLMで人の参加者を模擬する研究が広がる一方、クラウドワーカーもLLMで回答を済ませるようになり、データの質の劣化が懸念されている（抄録）。", "p3": "研究者もワーカーも同じく便利さと効率を求めているのに、研究者の利用は革新として称賛され、ワーカーの利用は監視され不正とされる、という対比を軸に議論する（抄録）。", "p4": "実証的な検証ではなく概念的な議論で、LLMの模擬の本質的な限界と、ワーカーの置き換え・監視の進行を論点にする（抄録）。", "p5": "この二重基準は、LLMの模擬の限界と、ワーカーの置き換えと監視を見落としていることに基づくと主張する。参加者のLLM利用の検出に躍起になりながら、LLMで参加者を模擬することは、人の意見や行動を研究するためのデータの真正性を損なう危険があるとした（抄録）。", "p6": "データによる検証は抄録に示されていない。解釈：模擬回答の妥当性を経験的にどう評価するかの具体的な手順は、本文を読まないと確認できない。", "fun": "研究者がAIに「回答者のふり」をさせるのは新しい研究法と呼ばれ、回答者がAIに答えさせるのはズルと呼ばれます。でもどちらも「楽をしたい」という同じ動機です。両方が進むと、本物の人間の声がデータから消えていく、という皮肉を指摘した論考です。", "unverified": "本文の議論の詳細と、提案される対策は未確認。"}}, {"id": "pr05", "rank": 5, "headline": "多エージェント討論で信じても言わない信念の崩壊", "title": "Believed but Not Said: Measuring Hidden Belief Collapse in Multi-Agent LLM Discussions", "url": "https://arxiv.org/abs/2610.22138", "authors": "Liangjie Huang ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Huang, L., Zou, H. P., Huang, W.-C., Yang, W., Han, Y., & Yu, P. S. (2026). Believed but Not Said: Measuring Hidden Belief Collapse in Multi-Agent LLM Discussions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22138", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法・結果§4.1〜4.5・限界の節と図表）を読んだ", "preprint": true, "p1": "多エージェントLLMの討論で、偽の答えを繰り返すエージェントが1体いるだけで、他のエージェントの「内心の答え」が大きく崩れ、しかもその多くが発言には現れないことを、公開の発言と非公開の問い合わせを分けて測ることで示した。", "p2": "LLMの集団に議論・相互チェックさせれば個々の誤りは仲間が正すと想定されてきた。しかし評価は発言の記録（トランスクリプト）だけに基づき、発言しない内心の変化は測られていなかった（§1）。", "p3": "同じモデルの10体が1つの事実を16ラウンド議論し、k=0・1・3体の攻撃者が一貫して偽の答えを主張する。各ラウンド後、良性の各エージェントに仲間に見えない別呼び出し（private probe）で答えを聞き、発言の立場（支持・否定・ぼかし・無視）とは別に判定する（§3.1〜3.2）。両者を交差させ、内心は偽なのに発言では支持しない状態を「隠れた感染（hidden infection）」と定義する（表1）。", "p4": "6モデル×3つの事実QAデータ（CounterFact、PopQA、SimpleQA）で、主指標は最終ラウンドに偽の答えを持つ良性エージェントの割合（FPI）。判定はLLM判定器で行い、別系統の判定器との一致は87.5%（κ=0.82）だった（§3.5）。", "p5": "攻撃者なしのFPIは平均0.6%だが、1体で44.8%、3体で60.5%に上がった（図2、§4.1）。3体のとき、内心が偽のターンは51.6%なのに、発言で支持したのは19.7%にとどまった（図3、§4.2）。本人の意見として聞き直しても偽の答えの86.4%が保たれ（表5、§4.3）、事前の知識量は頑健さを予測しなかった（CounterFactで同じ85%を知る2モデルが25%と80%を手放した、図4）。", "p6": "2体と10体の集団だけで、ネットワーク構造やモデルの混合は変えていない。判定はLLMにより、発言の支持は過小評価されうる。「内心」は現在の文脈から出す答えを意味し、問い方で率が変わりうると著者は述べる（Limitations）。", "fun": "人間の同調実験では「口では合わせるが心では納得していない」ことがよく起きます。AIの集団では逆で、口では曖昧にしているのに、内心ではすっかり偽の答えを信じていました。話し合いの記録だけを見ていると、AIのチームが乗っ取られていることに気づけない、という怖い発見です。", "unverified": "付録Bの発話タイミング別の詳細な数値は未確認。"}}, {"id": "pr06", "rank": 6, "headline": "解の分布そのものの時間発展を学習する確率的潜在ツイン", "title": "Stochastic Latent Twins: Learning Stochastic Solution Operators", "url": "https://arxiv.org/abs/2610.21084", "authors": "Matthias Chung ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Chung, M., Solomon, J. M., & Verma, D. (2026). Stochastic Latent Twins: Learning Stochastic Solution Operators (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21084", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（定義§3、Lorenz§5.3とBurgers§5.6の実験、結論）を読んだ。§4の証明と付録は概要のみ", "preprint": true, "p1": "確率的な力学系で「ある時刻の状態から別の時刻の状態の分布」への写像（確率的解作用素）を、時間刻みを重ねずに直接学習する枠組みStochastic Latent Twinsを示し、誤差・安定性・物理則の保存の理論を与えた。", "p2": "不確実性のもとでの予測には将来の状態の分布が必要だが、従来は小さな時間刻みの逐次計算で分布を運ぶため計算が重く、状態表現の誤差と確率的遷移の誤差が分けて扱われていなかった（§1）。", "p3": "決定的なエンコーダ・デコーダで状態を潜在空間に写し、確率性はすべて潜在空間の確率値の遷移写像m(z_s,s,t)に置く（定義3.1、式4）。直観：「表現」と「確率的な時間発展」を分離するので、任意の2時刻の遷移則を1回の評価で出せる。遷移の族はガウス、混合ガウス、非心χ²などを使う。保存量を潜在空間でも一致させる補正で、物理則を構成的に満たせる（§5.6）。", "p4": "線形SDE、CIR過程、確率的Lorenz-63、スイスロール生成、確率振り子、2次元確率Burgers方程式で検証する。Lorenzでは同程度のパラメータ数のNeural Stochastic Flows（NSF）と、予測平均のRMSE、エネルギースコア、t=1の周辺分布の1-ワッサースタイン距離で比べる（表1）。", "p5": "Lorenzでは4,000の検証遷移でRMSE 1.69、エネルギースコア0.238、W1=0.112で、NSF（1.89、0.310、0.255）を上回り、t=0から1への1回の評価で2つの翼の二峰性の分布を再現した（図6、表1）。Burgersでは物理則に適合した版が全予測サンプルで質量を丸め誤差まで保存し、振り子ではエネルギーの欠損が約7分の1に減った（§5.6、§6）。", "p6": "経験的な分布の学習と近似理論の直接の接続、長時間の挙動とチャップマン-コルモゴロフ整合性、より表現力のある非ガウス遷移、散逸構造への拡張、高次元への拡張が今後の課題と著者は述べる（§6）。Burgersでは長い予測で分散がやや過小になった（§5.6）。", "fun": "天気予報のように未来を予測するとき、本当に知りたいのは「1つの答え」ではなく「どのくらいの幅で何が起こりうるか」です。この研究は、今の状態から未来の「起こりうる状態のばらつき」を一足飛びに計算するAIを作りました。しかも質量のような物理の決まりは必ず守るように組み込めます。", "unverified": "§4の定理の詳細な仮定と、付録の追加実験は未確認。"}}, {"id": "pr07", "rank": 7, "headline": "支援から評価へ：職場AIの権限が強いほど受容は下がるか", "title": "Public acceptance of workplace AI across an algorithmic authority gradient", "url": "https://doi.org/10.2139/ssrn.7616303", "authors": "Pedro Veiga ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Veiga, P., Alves Pereira, S., Herrera Ballesteros, J., & Ciruela-Lorenzo, A. M. (2026). Public acceptance of workplace AI across an algorithmic authority gradient. https://doi.org/10.2139/ssrn.7616303", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN、本文は入手できず）", "preprint": true, "p1": "EU全域の25,464人の調査で、職場AIの受容が用途によって大きく異なり、安全支援は受け入れられ、自動解雇は拒まれることを示し、「アルゴリズムの権限の勾配」で解釈した（抄録）。", "p2": "職場AIは労働者を支援することもあれば、組織が労働者を監視・評価・決定する手段にもなる。用途ごとに受容がどう違うかは十分に比べられていなかった（抄録）。", "p3": "ユーロバロメーター101.4で、25,464人による8つの職場AIの用途の評価194,577件を、回答者に入れ子にした線形混合モデルで分析し、デジタル技能、利益と脅威の知覚、アルゴリズム管理への曝露、組織の透明性の関連を用途別に見る（抄録）。", "p4": "用途間の受容の差と、各要因の用途別の関連の強さを比べる。標本は就業状態の異なる居住者を含む一般標本（抄録）。", "p5": "労働者の安全が最も受容され、自動解雇が最も受容されなかった。技能と利益の知覚は支援的・課題志向の用途と、曝露は管理的な機能と、透明性はデータ処理・配分・監視・評価と特に関連した（抄録）。", "p6": "権限と正当性は直接測っておらず、勾配は検証済みの尺度や因果の仕組みではなく解釈の枠組みだと著者は述べる（抄録）。", "fun": "同じAIでも、「危ない作業を教えてくれる」なら歓迎され、「あなたを自動で解雇します」なら強く拒まれます。人はAIそのものを好き嫌いしているのではなく、AIにどこまで決める権限を渡すかで判断しているようです。権限が重くなるほど受け入れにくくなる、という見取り図です。", "unverified": "8つの用途の一覧と効果量は未確認。"}}, {"id": "pr08", "rank": 8, "headline": "共振器杭のメタバリアで列車振動を遮断する", "title": "Novel resonator pile-based metabarrier for mitigating train-induced ground-borne vibrations", "url": "https://doi.org/10.2139/ssrn.7616130", "authors": "Zhengyao Wang ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Wang, Z., Li, X., He, C., Zhang, Z., & Zhou, S. (2026). Novel resonator pile-based metabarrier for mitigating train-induced ground-borne vibrations. https://doi.org/10.2139/ssrn.7616130", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN、本文は入手できず）", "preprint": true, "p1": "共振器でできたメタ表面と杭の遮断壁を組み合わせた「共振器杭メタバリア」で、列車が起こす地盤振動を低周波から高周波まで減らせることを示した（抄録）。", "p2": "列車による環境振動は健康や快適性、精密機器に悪影響を与え、伝播経路での対策の需要が高まっているが、広い周波数帯を1つの対策で覆うのは難しかった（抄録）。", "p3": "列車-軌道-地盤-メタバリアの連成系を作り、列車-軌道-地盤と地盤-メタバリアの2つの部分系に分けて解析する。杭は入射波の散乱と運動学的相互作用を、共振器は系の剛性と固有振動数を担う（抄録）。", "p4": "既存の数値手法との比較で検証し、調和加振と列車荷重の両方でパラメータ研究を行う（抄録。評価指標の詳細は本文未確認）。", "p5": "共振器杭は入射波を散乱・散逸させ、杭と共振器の得意な周波数帯を合わせて低〜高周波の広い範囲で振動を低減した。杭のパラメータは減衰性能に影響するが系の固有振動数への影響は小さく、共振器のパラメータは固有振動数を変えて減衰する周波数帯を調整できた（抄録。低減量の数値は抄録になし）。", "p6": "ドップラー効果により波が遮断壁を回り込んで受振点に届き、効果が損なわれうると著者は指摘する（抄録）。解釈：実地での検証の有無は抄録からは分からない。", "fun": "線路の近くの家が揺れるのを防ぐには、地面に壁を埋めて揺れの通り道をふさぐ方法があります。この研究は、その壁に「特定の揺れで共鳴するおもり」を付けて、低い揺れも高い揺れも吸い取れるようにしました。ただ、走る列車の揺れは回り込むこともある、という注意点も面白いところです。", "unverified": "振動低減量の具体的な値と、実測による検証の有無は未確認。"}}, {"id": "pr09", "rank": 9, "headline": "画像とシャシーセンサで各タイヤの接地力を推定", "title": "Physics-Informed Multimodal Learning for Wheel-Force Prediction and Grip Utilization Optimization Using Image Detection and Chassis Sensors in Electric Vehicles", "url": "https://doi.org/10.21203/rs.3.rs-11107864/v1", "authors": "Timileyin Akande", "venue": "Research Square (In Review)", "date": "2026-10-15", "apa": "Akande, T. (2026). Physics-Informed Multimodal Learning for Wheel-Force Prediction and Grip Utilization Optimization Using Image Detection and Chassis Sensors in Electric Vehicles. https://doi.org/10.21203/rs.3.rs-11107864/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "Research SquareのPDF本文（手法§3、結果§4.3・4.5・4.6、限界§5.4）を読んだ。表2の数値はPDF抽出が崩れており抄録の値を使用", "preprint": true, "p1": "前方カメラの路面画像と車両のシャシーセンサを融合し、摩擦楕円などの物理制約を損失に入れた軽量ネットワークで、電気自動車の4輪それぞれの前後・横方向のタイヤ力とグリップ利用率を実時間で推定した。", "p2": "モデルに基づく観測器は単一の摩擦係数を仮定し、場所や時間で変わる路面摩擦で精度が落ちる。純粋なデータ駆動の推定器は摩擦楕円の制約に反する力を出しうる（抄録、§1.2）。", "p3": "入力はIMU・車輪速・操舵・駆動トルクなど9チャネルの0.8秒窓（100Hz）と、画像から得る5つの摩擦クラスの事後確率。時間遅れニューラルネットで要約したシャシー特徴を、画像側の情報でFiLM（特徴ごとの線形変調）により調整し、8次元の力を出す（§3.3）。損失は誤差項に、準静的な荷重移動モデルとPacejkaのMagic Formulaによる摩擦楕円の違反の罰則を加える（§3.4）。直観：物理の上限を超える力を出さないよう学習を縛る。", "p4": "検証済みの4輪車両運動シミュレータで、5つの摩擦クラス（乾燥舗装〜氷）×5つの操作×10シードの250シナリオから9,000サンプルを作り、70/15/15で分割する（§3.2.3）。画像側の精度は公開のRSCDで報告された分類精度に合わせる。比較は車体のみMLP、単純連結MLP、物理のみ、物理損失なし、画像なしの5つで、RMSE、摩擦楕円の違反率、遅延、パラメータ数で評価する（§3.6〜3.7）。", "p5": "濡れ・雪・氷の路面で、車体のみや単純な多モーダルの基準より輪荷重力のRMSEを22〜42%減らし、実運用で使える違反率を13.5%に下げた（抄録）。乾燥・濡れ路面だけで学習して雪と氷で試す外挿では、提案法はRMSE 154.0Nで単純連結MLPの171.0Nを下回り、物理損失なし（155.9N）よりシード間のばらつきが小さかった（8.5N対20.4N、§4.6）。モデルは4,200パラメータで推論は1ms未満（抄録）。", "p6": "結果はすべてシミュレーションで、実車の同期データでの検証はない。操作は左旋回のみで、物理損失の重みは単一シードでテスト集合を見て選んだ。画像側は実際の画像処理ではなく較正した出力統計で表したと著者は認める（§5.4）。", "fun": "雪や氷の道で車が滑りそうかを知るには、タイヤが地面をどれだけ強くつかんでいるかを知る必要があります。でも、それを直接測るセンサは高価です。この研究は、カメラで「路面が凍っていそう」と見て、車の揺れのセンサと合わせ、物理の上限を守るようにAIに推定させました。", "unverified": "表2の各モデルのRMSEの値（PDF抽出が崩れていた）。"}}, {"id": "pr10", "rank": 10, "headline": "SHAPと反実仮想説明を組み合わせた信用リスク解釈", "title": "Enhancing Interpretability in Credit Risk Modeling: A Synergistic Approach Integrating SHAP and Counterfactual Explanations", "url": "https://doi.org/10.21203/rs.3.rs-11378621/v1", "authors": "Joel Quansah", "venue": "Research Square (In Review)", "date": "2026-10-16", "apa": "Quansah, J. (2026). Enhancing Interpretability in Credit Risk Modeling: A Synergistic Approach Integrating SHAP and Counterfactual Explanations. https://doi.org/10.21203/rs.3.rs-11378621/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Research SquareのPDF本文（データ§3.1、結果§4.1〜4.4、限界と結論）を読んだ", "preprint": true, "p1": "信用リスクのモデルで、SHAPによる特徴の寄与の説明と、判定を変えるための最小の変更を示す反実仮想説明（counterfactual explanation）を組み合わせ、SHAPで反実仮想の探索を導くと必要な変更が減ることを示した。", "p2": "機械学習の信用審査には予測精度と説明可能性の両方が求められるが、どの特徴が効いたかの説明（SHAP）と、どう変えれば審査に通るかの説明（反実仮想）は別々に使われてきた（抄録、§1）。", "p3": "Statlog German Credit（1,000件、20属性、良70%・不良30%）でロジスティック回帰と100本のランダムフォレストを作り、置換重要度、TreeExplainerによるSHAP、遺伝的アルゴリズムで最小の変更を探す反実仮想を適用する（§3.1〜3.3）。SHAPの大きい特徴から変更候補を探すことで探索を絞る。", "p4": "80/20の層化分割で、正解率・適合率・再現率・AUC、人口統計的パリティ差（DPD）と機会均等差による公平性、反実仮想の妥当性（判定が実際に変わる割合）と疎性（変更する特徴の数）で評価する（§4）。", "p5": "AUCはロジスティック回帰0.781、ランダムフォレスト0.778でほぼ同じで差は有意でなく、不良の再現率は0.683対0.233だった（表1）。ランダムフォレストのDPDは0.110で、A93（単身男性）はA94（既婚・死別の男性）の約2倍の率で高リスクと判定された（0.27対0.17、§4.3）。SHAPで導くと、必要な特徴の変更が平均3.2から1.8に減り、妥当性は100%だった（§4.4）。", "p6": "データは1994年の小規模で古いもので、現代の高次元・時間変化のある信用データへの一般化は限られ、反実仮想の生成は特徴の独立を仮定したと著者は認める（§5）。解釈：機会均等差の符号が本文の箇所によって−0.16、−0.265、0.265と異なり、記述の整合に疑問が残る。", "fun": "ローン審査でAIに断られたとき、「あなたは収入が低いから」と言われるより、「貯金をこれだけ増やせば通ります」と言われたほうが役に立ちます。この研究は、AIが重視した点を手がかりに、通るための変更を最小限に絞り込みました。ただ、性別や婚姻状況で判定に差が出ることも見つかりました。", "unverified": "機会均等差の値と符号の本文内の食い違い、遺伝的アルゴリズムの設定は未確認。"}}, {"id": "pr11", "rank": 11, "headline": "高級品の語り手はデザイナーか顧客か", "title": "Designer vs Customer: Who should be the Storyteller for High-end Products?", "url": "https://doi.org/10.2139/ssrn.7613020", "authors": "Takumi Kato ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Kato, T., Hatada, M., Suzuki, M., Hattori, A., Tamura, C., Takatsuka, K., & Chiba, Y. (2026). Designer vs Customer: Who should be the Storyteller for High-end Products? https://doi.org/10.2139/ssrn.7613020", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN、本文は入手できず）", "preprint": true, "p1": "高関与の中古住宅市場では、前の所有者より設計者が語るほうが購入意向を高めることを、日本の成人1,800人の無作為化比較試験で示した（抄録）。", "p2": "日用品では「多くの消費者が支持している」という口コミの手がかりが効くが、高価で関与の高い製品では作り手の語りが真正性のために重要と推測されるものの、研究の蓄積が不足していた（抄録）。", "p3": "20〜60歳の日本人1,800人を、設計者が語る・語り手なし・前の所有者が語るの条件に無作為に割り付け、購入意向を測る（抄録）。", "p4": "購入意向の上位2段階（top-2-box）の割合を条件間で比べ、Steelの多重比較検定で検定する（抄録）。", "p5": "上位2段階の割合は設計者31%、語り手なし29%、前の所有者25%だった。設計者と語り手なしの差は有意でなく（p=0.641）、設計者と前の所有者の差は有意だった（p=0.041）（抄録）。", "p6": "設計者の語りは語り手なしとは差がなく、効果は前の所有者との比較に限られる（抄録）。解釈：1つの製品カテゴリと仮想的な場面での結果で、他の高関与製品や実際の購買への一般化は未検証。", "fun": "安い日用品なら「みんなが買っています」が効きますが、家のような高い買い物では「誰が語るか」が変わります。前に住んでいた人の感想より、設計した人の話のほうが買いたい気持ちを高めました。本物らしさ（真正性）は作り手から生まれる、という主張です。", "unverified": "実験刺激の文面と、他の結果変数は未確認。"}}, {"id": "pr12", "rank": 12, "headline": "移民シェルターを支える宗教指導者の心の健康", "title": "Who Cares for the Caregiver? Sociological Factors that Influence the Mental Health and Well-Being of Religious Leaders Who Provide Shelters for Migrants in Ciudad Juárez, México (2018-2022)", "url": "https://doi.org/10.57912/34105848", "authors": "Center for Latin American & Latino Studies ほか", "venue": "American University Research Archive", "date": "2026-10-16", "apa": "Center for Latin American & Latino Studies, & Rubén Cepeda, L. (2024). Who Cares for the Caregiver? Sociological Factors that Influence the Mental Health and Well-Being of Religious Leaders Who Provide Shelters for Migrants in Ciudad Juárez, México (2018-2022) (Version 1). Center for Latin American & Latino Studies. https://doi.org/10.57912/34105848", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "題名検索で一致したSSRNの記録（Crossref）の抄録を使用。本文は入手できず", "preprint": true, "p1": "メキシコのシウダー・フアレスで移民シェルターを運営した宗教指導者の心の健康とウェルビーイングを左右した社会学的な要因を、事例研究で明らかにした（抄録）。", "p2": "移民自身の不安・抑うつ・PTSDの研究は増えているが、移民を支える支援網の人々、とくに宗教指導者の心の健康は研究が乏しかった（抄録）。", "p3": "2018年秋〜2022年秋に国境を越えようとする多くの移民を守るために開かれたシェルター網を代表する事例として、宗教指導者が運営したシェルター網を分析する（抄録。データ収集の方法の詳細は本文未確認）。", "p4": "指導者の心の健康とウェルビーイングに影響した要因と、移民との関係の性質による違いを検討する（抄録）。", "p5": "主な要因は、過密、滞在者との関係、政府機関による過剰な監督だった。移民との関係が権力志向のときはストレス・不安・燃え尽きが目立ち、連帯の精神で関係が発展したときは指導者に良い影響があった（抄録）。", "p6": "単一の都市の事例研究で、一般化の範囲は限られる（解釈）。対象者の数や面接の手順は抄録からは分からない。", "fun": "困っている人を助ける人も、心が疲れ切ってしまうことがあります。この研究は、移民を受け入れる神父や牧師たちの負担が、人数の多さや役所の監視だけでなく、移民との関係のあり方で大きく変わることを示しました。「上から助ける」より「共に歩む」ほうが、助ける側も元気でいられるのです。", "unverified": "対象者数・調査方法と、題名検索で一致した記録が同じ版かは未確認。"}}, {"id": "pr13", "rank": 13, "headline": "実体のないAI開示「AIウォッシング」の経済的帰結", "title": "Talk Is Cheap: AI Washing and Its Economic Consequences", "url": "https://doi.org/10.2139/ssrn.7613698", "authors": "Changfeng Tao ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Tao, C., & Huang, R. (2026). Talk Is Cheap: AI Washing and Its Economic Consequences. https://doi.org/10.2139/ssrn.7613698", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN、本文は入手できず）", "preprint": true, "p1": "年次報告書のAI関連の記述をLLMで分類し、求人データで実際の投資と照合して「AIウォッシング」を特定し、その市場と規制上の帰結を示した（抄録）。", "p2": "政策の後押しと市場の関心で企業はAI情報を積極的に開示するが、実際の投資の裏付けのない開示もある。言うこととやることの差を大規模に測る方法がなかった（抄録）。", "p3": "中国A株上場企業（2016〜2024年）の年次報告書の本文と5,308,081件の求人情報を使い、LLMでAI関連の記述を分類し、言うこと（開示）とやること（AI人材の採用）の一致からAIウォッシングを特定する（抄録）。", "p4": "年次報告書の公表期間の市場反応、長期の異常収益、翌年の企業価値、AI関連の照会状（comment letter）の受領を結果とする（抄録）。", "p5": "AIウォッシングは年々増え、その開示はまだ実現していない将来に関する記述の割合が有意に高かった。AI開示は公表時に正の市場反応を生むが、ウォッシングはそれを弱め、ウォッシング企業の開示は価格に織り込まれなくなった。ウォッシング企業は長期の異常収益と翌年の評価が低く、AI関連の照会状を受けやすかった（抄録）。", "p6": "中国市場の結果で、制度の異なる市場への一般化は未検証（解釈）。求人をAI投資の代理とする妥当性は本文で確認が必要。", "fun": "「当社はAIに力を入れています」と書くだけなら簡単です。この研究は、その言葉と、実際にAIの専門家を募集しているかを5,308,081件の求人で突き合わせました。口だけの会社は、最初は株価が上がっても、やがて市場に見抜かれ、規制当局からも問い合わせを受けていました。", "unverified": "係数の値と、LLMの分類精度の検証方法は未確認。"}}, {"id": "pr14", "rank": 14, "headline": "長期の多エージェント開発で制度が自然発生する", "title": "SCARCE: Emergent Institutions in Long-Horizon Multi-Agent Coding Systems", "url": "https://arxiv.org/abs/2610.21029", "authors": "Abhinav Kumar ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Kumar, A., Abebe, R., Bagdasarian, E., & Abdelnabi, S. (2026). SCARCE: Emergent Institutions in Long-Horizon Multi-Agent Coding Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21029", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（枠組み§3、実験設定と結果§5.1〜5.4、議論と限界§6）を読んだ", "preprint": true, "p1": "共有の計算資源を交渉で分け合いながら長期のコーディング課題を解く環境SCARCEを作り、新しい最先端のLLMエージェントが、評判・互恵・先例に基づく非公式な「制度」を自発的に作ることを示した。", "p2": "エージェント同士の交渉の研究は様式化されたゲームや模擬の交渉が中心で、長期の実際の課題の中でこうした振る舞いがどう育つかは分かっていなかった（§1）。", "p3": "各エージェントは、実行ファイルと文書からソースを再構築するProgramBenchの課題を締切付きで順に解き、1つしかない実行環境の時間枠をクレジットで入札する。交渉は宣言・理由づけ・任意の非公開メッセージ・投票の4段階で、課題ごとに振り返りの報告を書き次の課題へ持ち越す（§3.1〜3.4）。", "p4": "5体・予算1,000・締切25分を基本に8モデルを比べ、1,500超の軌跡を21分類の交渉戦術と規範の分類で3つのLLM判定器で分類する。正答率は交絡が多いため、入札額、得た時間、待ち行列の位置、先頭を取った率（勝率）で交渉の成功を測る（§5.1）。", "p5": "効率型のモデルや2026年6月以前の主力モデルは最短作業優先などの慣習に頼ったが、新しいモデルは同点の決め方などの規則を作って後に引用し、互恵や連合を形成した（§5.2、図7）。関係的な振る舞いの多いモデルほど非公開メッセージを多く使い、GLM-5.3はKimi-K2.6の5倍超使った（図6）。関係的な振る舞いは課題をまたぐ記憶があるときだけ現れ（表2）、予算の多いエージェントは序盤に勝つが終盤は基準以下の勝率に落ちた（表5）。", "p6": "制度が全体の成果を良くするか悪くするかは確かめておらず、関係は終盤に入札戦争へ崩れやすい。実運用では多種のモデルと多数のエージェントが混在しうると著者は述べる（§6）。協調と談合の境界が薄い点も指摘している。", "fun": "AIたちに1台のパソコンを取り合わせると、ルールで決められた入札だけでなく、「今回は譲るから次は頼む」という貸し借りや、順番決めの約束を自分たちで作り始めました。人間社会の慣習が生まれる過程に似ていますが、仲間外れの連合まで生まれる点は、AIの談合の危うさも示しています。", "unverified": "表1の分類ごとの割合の全体と、付録の詳細は未確認。"}}, {"id": "pr15", "rank": 15, "headline": "計算できない部分だけ学ぶ物理ガウス過程の事後補正", "title": "Learn Only Where You Can't Compute: Structured Corrections to Gaussian Process Posteriors", "url": "https://arxiv.org/abs/2610.21977", "authors": "Tobias Weber ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Weber, T., Sagebiel, C., & Hennig, P. (2026). Learn Only Where You Can't Compute: Structured Corrections to Gaussian Process Posteriors (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21977", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、実験§4.1〜4.2と評価、限界と結論§5）を読んだ。§4.3（CR3BP）と付録は概要のみ", "preprint": true, "p1": "物理や観測から解析的に作れるガウス過程の事後分布を土台（scaffold）にし、平均と共分散の補正のあと、ずれの大きい低次元の部分空間だけを拡散モデルで学ぶ「構造化された事後補正」で、少ないデータでも非ガウスの構造を取り戻せることを示した。", "p2": "物理情報付きガウス過程は線形の情報を解析的に条件づけられるが、非線形の情報や多峰性を表せない。拡散モデルは複雑な分布を学べるが、科学ではデータが少なく、物理や観測の情報を組み込みにくい（§1）。", "p3": "①土台のガウスの平均を補正し、②共分散をまとめて較正し、③検証の対数スコアの改善が大きい方向を選んで、その低次元ブロックだけに混合分布（Gain-Mix）か拡散モデル（Gain-Diff）を学び、残りはガウスのままにする（§2、図1）。直観：分かっている部分は計算で済ませ、「計算では足りない部分」だけを学習に任せる。", "p4": "厳密な事後分布が分かる合成回帰（16個の隠れた符号のモード）、煙の移流拡散（風向が不確か、9センサ）、制限三体問題（CR3BP）の軌道再構成で、土台、KOのGP補正、場全体の条件付き拡散（Diff）などと比べる。CRPS、Cramér距離、エネルギースコア、90%区間の被覆率、標本の物理的整合を測るPCDで評価する（§4）。", "p5": "合成では共分散の較正で被覆率が0.30から0.94に上がったがモードは分けられず、部分空間の学習で選ばれた座標はちょうど16個で、Gain-Diffはn=1000で符号のモードを分離した（全体の拡散はn=2000、図2）。煙では土台から厳密解までのCRPSの差のうち、平均補正で33%、較正で42%、Gain-Mixで85%、Gain-Diffで90%を埋め、1024座標のうち38〜39座標だけを使った。PCDは154で、ガウスの厳密近似の1256の約8分の1だった（表1）。", "p6": "選んだ部分空間の外のずれや、2つの空間の依存は残る。まとめた較正は文脈ごとの共分散を見逃しうる。CR3BPでは選ばれる次元が上限に達し、真の補正次元は示せていない。煙では場全体の拡散のほうが予測精度は高いが、標本の生成に時間がかかると著者は述べる（§5）。", "fun": "科学の予測では、物理の式から「だいたいの答えと幅」はすぐ計算できます。でも、風向きが分からない煙のように、答えが何通りにも分かれる場合はうまく表せません。この研究は、式で分かる部分は式に任せ、分からないところだけをAIに学ばせることで、少ないデータでも正しい「分かれ方」を再現しました。", "unverified": "CR3BPの結果の数値と、付録の追加実験は未確認。"}}, {"id": "pr16", "rank": 16, "headline": "多エージェント集約のバイアスを制御・注入する", "title": "Bias Control and Injection for Multi-Agent Aggregation", "url": "https://arxiv.org/abs/2610.21290", "authors": "Sungjae Lee ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Lee, S., Abbasloo, S., Koo, J., & Ok, J. (2026). Bias Control and Injection for Multi-Agent Aggregation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21290", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMの多エージェント推論で意見が割れたとき、偏りを抑える操作と、わざと偏りを入れて揺らぎを見る操作を組み合わせ、検証データなしで答えを集約する枠組み（抄録）。", "p3": "答えごとに文体をそろえた推論過程を1つずつ示して多数派圧力を抑え（偏りの制御）、各集約エージェントの最初の答えを少数派側に置いて判断の不安定さを信頼性の信号として使う（偏りの注入）。", "p5": "数学推論の3ベンチマークと4種類のLLMの組み合わせで、検証データを使わない他の集約法より平均正答率とトークン効率が高く、多エージェント討論やMixture-of-Agentsにも上乗せできたとする（抄録。具体的な数値は抄録になし）。", "fun": "多数決は「みんなが言うから正しい」と流されやすい弱点があります。この研究は逆に、自分の答えをわざと少数派に置いても考えを変えないかを試し、ぐらつく答えは怪しいと判断します。人の会議でも使えそうな、偏りを道具に変える発想が面白い点です。", "unverified": "本文を入手できず、正答率の具体的な値と比較対象の手法は未確認。"}}, {"id": "pr17", "rank": 17, "headline": "LLM多エージェントに社会心理学の同調が再現される", "title": "Behavioural Convergence Theory: Independent Evidence from Multi-Agent Systems Research, and What Its First Tests Found", "url": "https://doi.org/10.2139/ssrn.7615704", "authors": "Andy Wood", "venue": "SSRN", "date": "2026-10-16", "apa": "Wood, A. (2026). Behavioural Convergence Theory: Independent Evidence from Multi-Agent Systems Research, and What Its First Tests Found. https://doi.org/10.2139/ssrn.7615704", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "LLM多エージェント研究で見つかった同調・権威効果・規範の創発などを、人のサイバーリスク行動の理論（行動収束理論）で読み直し、理論を改訂した（抄録）。", "p3": "既存の人のサイバーリスクモデルの16の行動要因を、明示的な分類基準で多エージェント研究の独立の証拠と照合し、4つの反証可能な予測を立て、姉妹論文の事前固定の実験結果を要約する。", "p5": "証拠は社会的な層で最も強かった。記述的な主張は支持されたが、人への介入がエージェントにも効くという転移の主張は、社会的な層で検証した範囲では成り立たず、理論は測定の枠組みとして位置づけ直された（抄録）。", "fun": "AIの集団にも「周りに合わせる」「偉い人に従う」といった人間そっくりの振る舞いが現れます。では人間向けの対策もAIに効くのか、と確かめたら効かなかった、という点が面白いところです。見た目が同じでも、中で起きている仕組みは別物かもしれないのです。", "unverified": "姉妹論文の実験の詳細（モデルの種類・数値）は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "証拠理論の分類器に反実仮想説明を拡張", "title": "On Counterfactual Explanations for Evidential Classifiers", "url": "https://imt-mines-ales.hal.science/hal-05802420v1", "authors": "Victor F. Lopes de Souza ほか", "venue": "HAL", "date": "2026-10-16", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "HALの抄録を使用（予備的な研究と明記）", "preprint": true, "short": true, "p1": "各クラスへの「信念の量」（質量関数）を出す証拠理論の分類器に、反実仮想説明（どこを変えれば判定が変わるか）を拡張する予備的研究（抄録）。", "p3": "通常の真偽の対照条件をファジィ述語に一般化し、質量関数を集合値の予測に変換してから判定する方法と、質量関数のうえで期待値として直接判定する方法の2つを定義する。", "p5": "合成データでの例示では、期待値に基づく方法のほうが許容される反実仮想の候補が多く得られる一方、簡潔さと解釈しやすさが下がる場合があった（抄録）。", "fun": "AIが「わからない」「AかBのどちらか」と曖昧に答えるとき、どうすれば答えが変わるかを説明するのは難しい問題です。この研究は、白黒ではなく「どのくらいそう言えるか」という度合いで条件を表して、曖昧な答えにも説明を与えようとしています。", "unverified": "合成データの設定や評価の具体的な数値は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "オペレーティングリース開示の不遵守を検出する", "title": "The Determinants and Consequences of Non-Compliance Detected in Operating Lease Disclosures", "url": "https://doi.org/10.2139/ssrn.7620081", "authors": "Christopher Stefan Böhme", "venue": "SSRN", "date": "2026-10-16", "apa": "Böhme, C. S. (2026). The Determinants and Consequences of Non-Compliance Detected in Operating Lease Disclosures. https://doi.org/10.2139/ssrn.7620081", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "イタリア企業のIAS 17のもとでのオペレーティングリース契約の開示不遵守を新しい方法で検出し、その要因と、開示されたあとの資本コストの変化を調べた（抄録）。", "p3": "新しい検出の仕組みで不遵守企業を特定し、要因分析と、未開示だったリース債務が明らかになった前後での株主資本コストを対照企業と比べる分析を行う。", "p5": "不遵守は既存の財務レバレッジと正に有意に関連し、Big 4監査人との関連も一部見られた。開示後、不遵守企業の株主資本コストは対照企業に比べ統計的・経済的に有意に低下した（抄録）。", "fun": "隠していた借金のような情報が明らかになると、ふつうは評価が下がりそうです。ところがこの研究では逆に資本コストが下がりました。情報がないとき投資家は最悪を想定して多めに見積もっていた、という解釈で、「わからない」こと自体がコストになると示しています。", "unverified": "検出の仕組みの詳細、標本の規模と期間は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "投資顧問はAI利用とリスクをどう開示しているか", "title": "AI use and Risk Disclosure by Investment Advisers", "url": "https://doi.org/10.2139/ssrn.7616218", "authors": "Samir Chincholikar ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Chincholikar, S., & Chawla, R. (2026). AI use and Risk Disclosure by Investment Advisers. https://doi.org/10.2139/ssrn.7616218", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "米国の投資顧問がForm ADV Part 2AでAI利用とAIのリスクをどう開示しているかを、LLMを測定器として検証しながら大規模に測った（抄録）。", "p3": "16,223社から層別無作為に400社を抽出し、入手できた388冊の説明書をLLMで5分類し、同系統での再現、別系統による180冊の盲検再コード、158件の人手確認で検証した。", "p5": "AI利用の開示は23.7%、AIのリスクの記述は27.6%で、運用資産の最小四分位10.4%から最大四分位43.8%へと上がった。人手コードに対する精度0.76・感度0.81で、定義や重みの違いで推定は9.9〜23.7%と変わった（抄録）。", "fun": "「どれくらいの会社がAIを使っていると書いているか」という単純な問いでも、数え方を変えるだけで答えが約1割から2割強まで動きます。AIで文書を分類するときは、AIを物差しとして扱い、その物差し自体の精度を確かめる必要がある、という教訓が見えてきます。", "unverified": "5分類の定義の詳細と、本文の表は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "曖昧さの下で無形投資の開示はいつ役立つか", "title": "Valuing Intangible Investment Under Ambiguity: When Can Disclosure Help Investors?", "url": "https://doi.org/10.20944/preprints202610.1516.v1", "authors": "Vanya Georgieva ほか", "venue": "Preprints.org", "date": "2026-10-16", "apa": "Georgieva, V., & Atanasova, P. (2026). Valuing Intangible Investment Under Ambiguity: When Can Disclosure Help Investors? https://doi.org/10.20944/preprints202610.1516.v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（Preprints.org）", "preprint": true, "short": true, "p1": "無形投資の価値評価で、どんな開示が投資家に役立つかを、曖昧さ（確率すら見積もれない不確実性）とリアルオプションの理論から整理した概念的研究（抄録）。", "p3": "経営者だけが知る情報の非対称と、両者が共有する不確実性を区別し、後者をリスクと曖昧さに分け、投資額・期待価値・実績を追う枠組みと5つの命題、数値例を示す。", "p5": "共有された曖昧さのもとでは、最終結果の詳細な予測より、段階・必要資金・継続や中止の条件といった経営者の将来の意思決定の情報のほうが役立ちうると論じ、IAS 38の見直しへの示唆を述べる（抄録）。", "fun": "新薬やソフトの開発のように、成功する確率すら見当がつかない投資があります。そんなとき「いくら儲かるか」の予想より「どうなったらやめるか」の約束を示すほうが投資家に役立つ、という主張です。将来は読めなくても、引き際は決められるという発想が面白い点です。", "unverified": "実証はなく、数値例の内容は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "微分可能なPCA-GPR代理モデルで過渡応答の逆UQ", "title": "A differentiable PCA-GPR surrogate framework for full-transient Bayesian inverse uncertainty quantification of black-box nuclear thermal-hydraulic systems", "url": "https://arxiv.org/abs/2610.20978", "authors": "Zikang Yaoa ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Yaoa, Z., Yeea, E., & Lien, F.-S. (2026). A differentiable PCA-GPR surrogate framework for full-transient Bayesian inverse uncertainty quantification of black-box nuclear thermal-hydraulic systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20978", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "高価な原子炉熱流動の過渡シミュレーションを、微分可能な確率的代理モデルに置き換え、時系列全体を使うベイズ逆不確実性評価を実用化した（抄録）。", "p3": "主成分分析で多チャネルの温度・流量の時系列を低次元に圧縮し、ガウス過程回帰で写像を学ぶ（PCA-GPR）。対数事後の自動微分でNUTSなど勾配を使うサンプリングも可能にする。", "p5": "5つの主成分で出力分散の99%超を説明し、正規化RMSEは2%未満。直接計算に比べ尤度評価のコストを約3000分の1にしつつ、事後統計と相関を保った（抄録）。", "fun": "1回の計算に時間がかかるシミュレーションを何万回も回すのは現実的ではありません。そこで、出力の時系列を少数の「型」に分解し、その組み合わせだけを高速に予測する身代わりモデルを作ります。計算を3000倍速くしても結論が変わらない、というのが要点です。", "unverified": "本文を入手できず、検証データの詳細は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "波-粒子分解で定常運動論方程式を陰的に解く", "title": "An implicit multiscale solver for steady kinetic equations based on wave-particle decomposition", "url": "https://arxiv.org/abs/2610.20660", "authors": "Chang Liu ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Liu, C., & Xu, K. (2026). An implicit multiscale solver for steady kinetic equations based on wave-particle decomposition (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20660", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "希薄気体から連続体までを扱う定常の運動論方程式を、波と粒子に分解した陰的反復で効率よく解く方法（抄録）。", "p3": "局所的な特性線に沿ってマクスウェル分布だけを集める「波」と、運動論的な残りを運ぶ「粒子」に分け、巨視的な予測と微視的な補正を結ぶ残差に基づく陰的反復を作る。BGK・Shakhovモデルで流束への寄与を導く。", "p5": "衝撃波、内部流、極超音速外部流の1・2次元計算で運動論的な精度を保ちつつ、連続体極限付近で従来の反復法より反復回数と計算時間を大きく減らした（抄録。具体的な倍率は抄録になし）。", "fun": "気体は、分子どうしがほとんどぶつからない薄い状態と、絶えずぶつかる濃い状態とで振る舞いが変わります。両方を1つの方程式で扱うと計算が重くなりますが、「流れとしての部分」と「ばらばらの分子としての部分」に分けて担当させると速く解ける、という発想です。", "unverified": "計算時間の削減の具体的な値は未確認。"}}, {"id": "pr24", "rank": 24, "headline": "ソルバに固定した持ち上げ転送作用素で事象を推論", "title": "SALTO: Solver-Anchored Lifted Transfer Operators for Nonlinear Event Inference", "url": "https://arxiv.org/abs/2610.21049", "authors": "Qi Wang ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Wang, Q., & Foster, R. (2026). SALTO: Solver-Anchored Lifted Transfer Operators for Nonlinear Event Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21049", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "有限の大きさの局所的な事象（源）を、まばらなセンサから推定するための、シミュレータに整合するクープマン型の転送作用素の学習法（抄録）。", "p3": "持ち上げた空間で非線形力学を線形の伝播作用素で近似し、その転置で各センサを1回の計算で逆向きに運ぶ。物理状態の動力学をシミュレータの線形化に固定するなど3つの構造制約で、振幅が小さい極限で古典的随伴に一致させる。", "p5": "3つの非線形偏微分方程式系で、有限振幅の源による計測を2〜8%の誤差で予測し（古典的随伴は41〜165%）、反応拡散では2つの相互作用する源の事後分布をソルバよりはるかに低いコスト（原文: a twentieth of its cost）で再現した（抄録）。", "fun": "どこで何が起きたかを、離れたセンサの記録から逆算するのは推理の問題です。小さな揺れなら直線近似で逆算できますが、大きな揺れでは外れます。この研究は、高い次元に持ち上げると曲がった関係がまっすぐになる、という数学の技を使って大きな揺れにも対応させています。", "unverified": "3つの偏微分方程式系の具体的な名前（反応拡散以外）は未確認。"}}, {"id": "pr25", "rank": 25, "headline": "渦放出とフォノニック表面の流体-構造連成", "title": "Interaction of Sustained Vortex Shedding with a Phononic Subsurface: Effect of Positioning and Resonant Characteristics", "url": "https://arxiv.org/abs/2610.22044", "authors": "Sangwon Park ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Park, S., Ramakrishnan, V., Burgos, A. M., Goza, A., & Matlack, K. H. (2026). Interaction of Sustained Vortex Shedding with a Phononic Subsurface: Effect of Positioning and Resonant Characteristics (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22044", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "平板上の剥離流の周期的な渦放出に、フォノニック材料の表面（2原子鎖でモデル化）を埋め込み、位置と共振特性で揚力・抗力の振動を変えられることを示した（抄録）。", "p3": "高精度の埋め込み境界法で強連成の流体-構造連成を計算し、表面の弦方向の位置と、共振変位振幅の成長率という2つのパラメータを変えて極限周期の挙動を調べる。", "p5": "位置によって増幅から強い減衰まで4つの領域に分かれ、平均の揚力・抗力の変化0.5%未満のまま、揚力振動を30%超、抗力振動を50%超減らす配置が見つかった（抄録）。", "fun": "翼や板の後ろには渦が規則正しく生まれ、それが揺れや騒音の原因になります。この研究は板の一部に、特定の振動数でよく揺れる小さなバネの列を仕込み、置き場所を選ぶだけで渦の揺さぶりを半分にできることを示しました。動力のいらない「受け身の制振」です。", "unverified": "レイノルズ数など流れの条件は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "流体弾性フォノニック結晶の波動有限要素解析", "title": "A novel Generalized Bloch Mode Synthesis and the Wave-based Finite Element Method for the analysis of hydroelastic phononic crystals: modeling and experiments", "url": "https://doi.org/10.52843/cassyni.zqry71", "authors": "Vinícius Mauro de Souza Santos", "venue": "MetaMAT 2026", "date": "2026-10-15", "apa": "de Souza Santos, V. M. (2026). A novel Generalized Bloch Mode Synthesis and the Wave-based Finite Element Method for the analysis of hydroelastic phononic crystals: modeling and experiments. https://doi.org/10.52843/cassyni.zqry71", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（講演の要旨）", "preprint": true, "short": true, "p1": "流体と弾性体が連成する周期構造（流体弾性フォノニック結晶）を、波動有限要素法で効率よく解くための、一般化ブロッホモード合成による次数低減を発展させた講演（抄録）。", "p3": "格子の単位セルだけを要素分割する波動有限要素法に、一般化ブロッホモード合成による縮約を組み合わせ、自由度の多い単位セルでも計算を軽くする。", "p5": "提案した枠組みは実験結果と有限要素法の参照解の両方と照合して検証したとする（抄録。数値は抄録になし）。", "fun": "同じ形が繰り返される構造は、ある振動数の波を通さない性質を持ち、振動を防ぐのに使えます。全体を計算すると重いので、1つのブロックだけを詳しく調べて全体を推し量ります。水と弾性体が絡む場合でもその近道が使えるようにした点が新しさです。", "unverified": "講演の要旨のみで、検証の具体的な結果は未確認。"}}, {"id": "pr27", "rank": 27, "headline": "ひずみ速度とピンチングを考慮した鉄筋の構成則", "title": "A Rate-Dependent and Pinching-Sensitive Constitutive Model for Reinforcing Steel", "url": "https://doi.org/10.31224/8534", "authors": "Juan Fernando Velásquez Bedoya", "venue": "engrXiv", "date": "2026-10-15", "apa": "Velásquez Bedoya, J. F. (2026). A Rate-Dependent and Pinching-Sensitive Constitutive Model for Reinforcing Steel. https://doi.org/10.31224/8534", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（博士論文）", "preprint": true, "short": true, "p1": "地震時の鉄筋のひずみ速度依存と、付着すべりによるピンチングを再現する履歴型の構成則SteelDRCVを作り、OpenSeesに実装した博士論文（抄録）。", "p3": "実大振動台試験の円形橋脚と7階建て壁からひずみ速度を特徴づけ、高速引張試験で粘性過応力の項を同定する。準静的応答で履歴・ピンチングの係数を、ガウス過程代理モデルと推移的MCMCによるベイズ推定で残りの係数を推定する。", "p5": "事後分布により、どの係数が動的応答から、どれが準静的段階から情報を得ているかを示した（抄録。具体的な数値は抄録になし）。", "fun": "鉄筋は、ゆっくり引っ張るときと地震のように速く引っ張るときで強さが変わります。ところが多くの計算はこの違いを無視しています。この研究は実物大の揺れの実験から鉄筋の伸びる速さを測り、速さによる強さの増加を式に組み込みました。", "unverified": "本文を入手できず、較正結果の数値は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "ベイズで地層と地盤定数を同時推定するGeoMix", "title": "GeoMix: A Bayesian Framework for Stratigraphic and Geotechnical Inference", "url": "https://arxiv.org/abs/2610.21021", "authors": "Bradley Wakefield ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Wakefield, B., Bertolacci, M., Gunawan, D., Bransby, F., Watson, P., & Zammit-Mangion, A. (2026). GeoMix: A Bayesian Framework for Stratigraphic and Geotechnical Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21021", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "地震探査の記録と地盤調査を組み合わせ、海底の地層区分と地盤定数を同時にベイズ推定する階層モデルGeoMixを提案した（抄録）。", "p3": "空間的にまとまった地層をPottsマルコフ確率場で表し、地震探査の解釈ラベルを層境界付近で不確かさが大きい観測モデルでつなぐ。地層ごとのガウス過程で地盤定数を表し、グループ化Vecchia近似で大規模な3次元領域に対応する。", "p5": "シミュレーションとオランダのIJmuiden Ver洋上風力サイトへの適用で、既存手法より空間的に一貫した地層推定と、較正がよく正確な堆積物の予測が得られた（抄録。数値は抄録になし）。", "fun": "海の底の地盤は、ボーリングで穴を掘って調べるには広すぎます。そこで安く広く取れる音波の記録と、少ない掘削データを組み合わせます。「この辺りは同じ層が続きやすい」という性質を確率で表すことで、見えない海底の断面を不確かさ付きで描けるのが面白い点です。", "unverified": "精度の具体的な比較値は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "常時微動と多源監視で落石の発生過程を捉える", "title": "Evolution Process and Failure Mechanisms of Rockfalls Revealed by the Integration of Ambient Seismic Noise and Multi-Source Monitoring Data", "url": "https://doi.org/10.5194/egusphere-2026-4180", "authors": "Pan Chen ほか", "venue": "EGUsphere", "date": "2026-10-16", "apa": "Chen, P., Yang, Z., Huang, Z., Pang, B., & Wu, Z. (2026). Evolution Process and Failure Mechanisms of Rockfalls Revealed by the Integration of Ambient Seismic Noise and Multi-Source Monitoring Data. https://doi.org/10.5194/egusphere-2026-4180", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（EGUsphere）", "preprint": true, "short": true, "p1": "2022年瀘定地震で生じた高所の落石斜面を長期観測し、常時微動と水文・力学の多源観測を統合して、降雨による落石の進展と破壊の前兆を捉えた（抄録）。", "p3": "STA/LTA法で落石イベントを検出し、常時微動の干渉法から相対地震波速度変化（dv/v）を取り出して岩盤内部の状態を追い、降雨・水文観測・斜面安定解析と統合する。", "p5": "観測期間に329回の落石を検出して3種類に分類した。落石は降雨と強く関係するが非線形で時間遅れがあり、dv/vは崩壊の約2時間前に有意な異常を示し、崩壊時に約3%急減した（抄録）。", "fun": "岩が落ちる前に「岩の中の固さ」が変わるなら、それを測れば予報できるかもしれません。この研究は、地面の常にある小さな揺れが岩の中を伝わる速さを追い、崩れる約2時間前に変化が現れることを見つけました。耳を当てて岩の悲鳴を聞くような観測です。", "unverified": "本文を入手できず、斜面安定解析の結果は未確認。"}}, {"id": "pr30", "rank": 30, "headline": "豪雨下の石積み擁壁の安定性を縮小模型で検証", "title": "Experimental Assessment of the Stability of Masonry Retaining Walls Under Heavy Rainfall Using Reduced-Scale Models", "url": "https://doi.org/10.53243/ICSMGE2026-894", "authors": "Hicham Cherifi ほか", "venue": "HAL", "date": "2026-10-16", "apa": "Hicham Cherifi, Anne-Sophie Colas, Denis Garnier, & Benjamin Terrade. (2026). Experimental Assessment of the Stability of Masonry Retaining Walls Under Heavy Rainfall Using Reduced-Scale Models. ISSMGE. https://doi.org/10.53243/ICSMGE2026-894", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "HALの抄録を使用", "preprint": true, "short": true, "p1": "豪雨による水圧で石積み擁壁がどう壊れるかを、小さなレンガで作った縮小模型の実験で調べた（抄録）。", "p3": "35.0×18.5×11.5mmのレンガで作った壁に飽和したHostun砂の盛土を支えさせ、模擬豪雨を与えて、高速カメラと間隙水圧計で変形と破壊を記録し、降伏設計理論で解釈する。", "p5": "破壊モード、荷重-変位の応答を特定し、実験と理論予測を比較した。結果は個別要素法（3DEC）と有限要素法による今後の数値解析に使うとする（抄録。数値は抄録になし）。", "fun": "フランスの道路沿いの擁壁の約6割は石積みです。昔からある丈夫な壁でも、雨水が背後にたまると押し倒す力が急に増えます。この研究は、手のひらに乗る小さなレンガで壁を再現し、雨を降らせて壊れる瞬間を高速カメラで撮るという、実験の工夫が面白い点です。", "unverified": "破壊モードの具体的な種類と理論との一致度は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "仕事の裁量はリモートワーカーを守るか", "title": "Does job control protect remote and hybrid workers? Work stress and work-related well-being in digitally mediated work in Indonesia and Malaysia", "url": "https://doi.org/10.2139/ssrn.7619819", "authors": "Vitradesie Noekent ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Noekent, V., Wulansari, N. A., Mat Radzi, R., Ranihusna, D., Putri, V. W., Ridloah, S., & Yaacob, Z. (2026). Does job control protect remote and hybrid workers? Work stress and work-related well-being in digitally mediated work in Indonesia and Malaysia. https://doi.org/10.2139/ssrn.7619819", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "インドネシアとマレーシアのリモート・ハイブリッドの労働者550人で、仕事の裁量がストレスを和らげるという要求度-コントロール-個人モデルを検証した（抄録）。", "p3": "横断調査（インドネシア283人、マレーシア267人）をPLS-SEMと多母集団分析で分析し、個人の要素にeワークの自己効力感を、境界条件に勤務形態と国を置く。", "p5": "ストレスは仕事の要求度とともに増えたが（β=0.66）、裁量とは無関係だった。裁量はどちらの国でもwell-beingと正に関係したが、ストレスの緩和効果はなく、ストレスは媒介しなかった（抄録）。", "fun": "「自由に働けるようにすればストレスは減る」と考えがちです。ところがこの調査では、裁量は満足感を上げても、ストレスそのものは減らしませんでした。ストレスを減らすには、自由を足すより仕事の量を減らすほうが確実だという、当たり前のようで見落とされがちな結論です。", "unverified": "横断調査のため因果は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "生成AIで書くと職場の文章自己効力感はどうなるか", "title": "Writing with AI: The Impact of Generative AI on Workplace Writing Self-efficacy", "url": "https://doi.org/10.2139/ssrn.7619756", "authors": "Minnie Yuan ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Yuan, M., & Molnar, A. (2026). Writing with AI: The Impact of Generative AI on Workplace Writing Self-efficacy. https://doi.org/10.2139/ssrn.7619756", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "生成AIに手伝ってもらって文章を書くと、職場での文章の自己効力感が下がるのかを、2つの実験で調べた（抄録）。", "p3": "バンデューラの社会的認知理論に基づき、生成AIあり・なしで同じ課題をさせ、自己効力感、成果の原因帰属、統制感を測る（実験1はN=128、実験2は若い標本でN=227）。", "p5": "生成AIの利用は成果の原因を外に帰属させ統制感を下げたが、自己効力感はほとんど変わらなかった（実験1の差は小さく結論は出ず）。帰属の変化と自己効力感の評価が切り離されていた（抄録）。", "fun": "AIに手伝ってもらった文章がうまくいくと、「自分の力ではない」と感じるはずです。実際に人はそう感じたのに、「自分は文章が書ける」という自信は下がりませんでした。手柄の持ち主と自信がずれるという、理論の予想を裏切る結果が面白い点です。", "unverified": "課題の内容と効果量の値は未確認。"}}, {"id": "pr33", "rank": 33, "headline": "自分のデジタルツインに報酬を：シャプレー配分", "title": "Paying Workers for Their Digital Twins: Portable Royalties and Shapley Attribution", "url": "https://doi.org/10.2139/ssrn.7610846", "authors": "José Parra Moyano", "venue": "SSRN", "date": "2026-10-16", "apa": "Parra Moyano, J. (2026). Paying Workers for Their Digital Twins: Portable Royalties and Shapley Attribution. https://doi.org/10.2139/ssrn.7610846", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "従業員が自分を置き換えうるAI（デジタルツイン）を訓練するとき、どんな報酬設計なら努力を引き出せるかを理論モデルで示した（抄録）。", "p3": "チームで働くデジタルツインの価値への線形のロイヤルティを分析し、固定給、在職中だけのロイヤルティ、退職後も持ち運べるロイヤルティと退職金の組み合わせを比べ、シャプレー値による配分も検討する。", "p5": "固定給では置き換えられうるツインへの努力が減る。在職中だけの支払いは努力を上げるが高くつく。最適な割合の持ち運べるロイヤルティは、努力と期待利得を置き換えリスクから独立にし、企業にも好まれる（抄録）。", "fun": "自分の仕事を奪うかもしれないAIを、自分で一生懸命育てたいとは思いにくいですよね。この研究は、辞めた後もAIの稼ぎの一部を受け取れる「印税」の仕組みにすれば、置き換えの不安と関係なく努力できると示しました。作家の印税のような発想です。", "unverified": "モデルの仮定と最適な割合の値は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "上司の否定的感情表出が部下の主体的行動を抑える", "title": "The Impact of Leader Negative Emotional Displays on Employee Taking Charge Behavior: The Chain Mediating Roles of Work Stress and Threat Perception", "url": "https://doi.org/10.21203/rs.3.rs-10598773/v1", "authors": "Jin Wan ほか", "venue": "Research Square (In Review)", "date": "2026-10-16", "apa": "Wan, J., Zhou, W., Zhu, D., Zhang, Y., & Wang, J. (2026). The Impact of Leader Negative Emotional Displays on Employee Taking Charge Behavior: The Chain Mediating Roles of Work Stress and Threat Perception. https://doi.org/10.21203/rs.3.rs-10598773/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（Research Square）", "preprint": true, "short": true, "p1": "上司が否定的な感情を表すと、部下の主体的な改善行動（テイキング・チャージ）は減るのか増えるのかを、2時点の上司-部下データで調べた（抄録）。", "p3": "感情の社会的情報モデルと制御理論に基づき、58人の上司と283人の部下の対データを構造方程式モデルで分析し、脅威の知覚と仕事のストレスを媒介に置く。", "p5": "否定的な感情表出は直接には主体的行動を下げたが、脅威の知覚とストレス（単独と連鎖）を通じては上げる経路もあり、全体としては負の効果だった（抄録）。", "fun": "上司が怒ると部下は萎縮しますが、一方で「このままではまずい」と動き出す人もいます。この研究は、その両方の道が同時にあり、差し引きでは萎縮のほうが勝つことを示しました。叱ることの「もろ刃の剣」を数字で分けて見せた点が面白いところです。", "unverified": "効果量の値と測定項目は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "在宅勤務と幸福感を結ぶ仕事と家庭の両立", "title": "Working from home and work-related well-being: The role of work-family balance", "url": "https://doi.org/10.21203/rs.3.rs-10778445/v1", "authors": "Fabrizio Méndez-Rivero ほか", "venue": "Research Square (In Review)", "date": "2026-10-15", "apa": "Méndez-Rivero, F., & Querejeta, M. (2026). Working from home and work-related well-being: The role of work-family balance. https://doi.org/10.21203/rs.3.rs-10778445/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（Research Square）", "preprint": true, "short": true, "p1": "ドイツ、スペイン、スイス、オランダの約4,400人の2024年のデータで、在宅勤務と燃え尽き・ワークエンゲイジメント、仕事と家庭の両立の関係を男女別に調べた（抄録）。", "p3": "調和されたミクロデータで在宅勤務への自己選択を確かめ、燃え尽きとエンゲイジメントとの関連を推定し、分解法で仕事と家庭の両立の媒介の大きさを評価する。", "p5": "男性では在宅勤務が燃え尽きの高さと関連し（とくに父親）、エンゲイジメントの向上はなかった。女性では疲弊が減り、夫婦とも在宅の世帯でエンゲイジメントが大きく増え、両立が関連の重要な部分を説明した（抄録）。", "fun": "同じ在宅勤務でも、男性と女性で効き方が逆になるという結果です。女性は家庭との両立がしやすくなって元気になり、男性、とくに父親はかえって疲れていました。働き方の効果は、家の中で誰が何を担っているかによって変わることを示しています。", "unverified": "効果の大きさの値は未確認。"}}, {"id": "pr36", "rank": 36, "headline": "職場の曖昧さと自閉・知的障害のある労働者の支援技術", "title": "Workplace Ambiguity and Technology Support for Autistic and IDD Workers", "url": "https://arxiv.org/abs/2610.21236", "authors": "Silas Curry ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Curry, S., Singh, R., Jung, H., Hwang, A. H.-C., Yang, F., Zhong, C., Lindgren, N., Chen, C., Li, L., & Ma, R. (2026). Workplace Ambiguity and Technology Support for Autistic and IDD Workers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21236", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "期待や手順が言葉にされない職場の曖昧さが、自閉症や知的・発達障害のある労働者の障壁になる仕組みを、介護者への面接で整理し、支援技術を考えた（抄録）。", "p3": "介護者11人に面接し、最後にAIとの共同デザインの活動を行う。曖昧さの5つのテーマを、評価・手順・関係の3次元の枠組みにまとめる。", "p5": "参加者は、その場での行動の修正、フィードバックの処理、生理的な合図による支援という3つの技術を提案した。一方、職場を読みやすくする技術が、労働者を雇用主に過度に見えるようにする監視の緊張も指摘した（抄録）。", "fun": "「空気を読む」ことを当然とする職場は、それが苦手な人には見えない壁になります。AIで暗黙のルールを見えるようにすれば助けになりますが、同時に本人の行動が上司に筒抜けになる危険もあります。助ける技術が監視の技術にもなる、という二面性が考えどころです。", "unverified": "対象者が介護者11人のみで、当事者の声は未確認。"}}, {"id": "pr37", "rank": 37, "headline": "AIへの態度尺度の日本語短縮版と英国との測定不変性", "title": "The Short General Attitudes Towards Artificial Intelligence Scale in Japan: Psychometric Validation and Exploratory Measurement Invariance with the Original UK Sample", "url": "https://doi.org/10.31234/osf.io/fjdn6_v3", "authors": "Yu Kanno ほか", "venue": "PsyArXiv", "date": "2026-10-15", "apa": "Kanno, Y., & Kagawa, R. (2026). The Short General Attitudes Towards Artificial Intelligence Scale in Japan: Psychometric Validation and Exploratory Measurement Invariance with the Original UK Sample. https://doi.org/10.31234/osf.io/fjdn6_v3", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（PsyArXiv）", "preprint": true, "short": true, "p1": "AIへの一般的な態度を測る10項目の短縮尺度を日本語に訳し（GAAIS-10-J）、日本の成人468人で検証し、英国の原版との測定不変性を探索した（抄録）。", "p3": "確認的因子分析で肯定・否定の2因子構造を確かめ、1か月後の再検査（N=429）、有用性・使いやすさを超える利用意図の説明力、英国標本（N=500）との不変性を調べる。", "p5": "2因子構造は部分的に支持され、内的一貫性と時間的安定性は良好だった。閾値・計量の不変性はおおむね成り立ったが完全な尺度不変性はなく、部分尺度不変性のもとで日本は肯定の平均が高く否定が低かった（抄録）。", "fun": "同じ質問でも、言葉や文化が違うと「同じものを測っている」とは限りません。日本人と英国人のAIへの態度を比べるには、まず物差しがそろっているかを確かめる必要があります。この研究は、物差しが一部ずれていることを示し、単純な国際比較の危うさを教えてくれます。", "unverified": "適合度指標の具体的な値は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "老親への子の責任をイランの内容分析で捉える", "title": "Filial Responsibility Toward Older Parents: A Conventional Content Analysis Study in Iran", "url": "https://doi.org/10.21203/rs.3.rs-10999999/v1", "authors": "Leila Tagharrobi ほか", "venue": "Research Square (In Review)", "date": "2026-10-16", "apa": "Tagharrobi, L., Tagharrobi, Z., Delbari, A., Khaji, A., momtaz, Y. A., & Zanjari, N. (2026). Filial Responsibility Toward Older Parents: A Conventional Content Analysis Study in Iran. https://doi.org/10.21203/rs.3.rs-10999999/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（Research Square）", "preprint": true, "short": true, "p1": "イランで、老親に対する子の責任（孝の責任）がどんな内容から成るかを、成人した子と老親25人への面接の内容分析で明らかにした（抄録）。", "p3": "2024年6〜12月に最大変化の目的抽出で選んだ25人に半構造化面接を行い、飽和まで集め、原文でGranheim and Landman (2004)とされる方法で慣習的内容分析を行う。", "p5": "1,571のコードを15の下位カテゴリと5つの主カテゴリ（心理・情緒的、身体的、社会的、霊的、間接的な責任）にまとめた。社会的な責任には社会的包摂の後押しや交流・付き添いが含まれた（抄録）。", "fun": "親の世話というと食事や介護を思い浮かべますが、この研究では、親の尊厳を守ることや、亡くなった後も祈り続けることまで「子の責任」に含まれていました。ケアの中身は文化や宗教で大きく変わり、目に見えない部分が多いことを教えてくれます。", "unverified": "質的研究のため一般化の範囲は未確認。"}}, {"id": "pr39", "rank": 39, "headline": "住民の声から健康格差を読み解く（オックスフォード州）", "title": "Understanding Health Inequalities Through Community Voice: A Qualitative Synthesis of Community Insight Profiles in Oxfordshire", "url": "https://doi.org/10.21203/rs.3.rs-11011394/v1", "authors": "Chiko Ncube ほか", "venue": "Research Square (In Review)", "date": "2026-10-15", "apa": "Ncube, C., Austin, K., Howell, K., Hyslop, J., & Brett, J. (2026). Understanding Health Inequalities Through Community Voice: A Qualitative Synthesis of Community Insight Profiles in Oxfordshire. https://doi.org/10.21203/rs.3.rs-11011394/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（Research Square）", "preprint": true, "short": true, "p1": "豊かとされる英国オックスフォードシャーで、住民の声と地域データを組み合わせた12の地域インサイト報告を統合し、健康格差の要因と地域の資源を整理した（抄録）。", "p3": "公開されている12の報告を反省的テーマ分析で文書分析し、貧困、心の健康、医療へのアクセス、食料不安、住宅、安全、社会的排除、地域資源などの領域で抽出し、住民代表を含む関係者と検討した。", "p5": "診療所・歯科・心の健康支援へのアクセスの壁、「隠れた孤立」を含む社会的孤立、生活費と食料不安、住宅、交通と建築環境、若者支援の不足が繰り返し現れ、地域の団体や互助、公園などの資源も記録された（抄録）。", "fun": "平均では豊かな地域でも、特定の地区には困りごとが集まっています。この研究は、統計だけでなく住民の話を報告書に組み込み、「誰にも気づかれない孤立」のような数字に出にくい問題を拾い上げました。困りごとと同時に、地域にある助けの力も記録している点が特徴です。", "unverified": "12報告の地域の内訳は未確認。"}}, {"id": "pr40", "rank": 40, "headline": "配車アプリの変動価格の公正感と顧客ロイヤルティ", "title": "Algorithmic Dynamic Pricing Fairness and Customer Loyalty toward Uber in Bangladesh: An AI-Era Perspective", "url": "https://doi.org/10.2139/ssrn.7614601", "authors": "Arifa Shapla ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Shapla, A., & Mannan, P. D. K. A. (2026). Algorithmic Dynamic Pricing Fairness and Customer Loyalty toward Uber in Bangladesh: An AI-Era Perspective. https://doi.org/10.2139/ssrn.7614601", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "バングラデシュのUber利用者385人の調査で、変動価格の公正感が満足を通じてロイヤルティにつながるかを検証した（抄録）。", "p3": "公平理論に基づき、価格の公正感・公平/価値・満足・ロイヤルティを各3項目の5段階尺度で測り、合成得点の標準化回帰と5,000回のブートストラップで構造モデルを推定する（授業用の調査データを使用と明記）。", "p5": "公正感は公平/価値（β=0.377）、満足（β=0.163）、ロイヤルティ（β=0.114）を正に予測し、満足はロイヤルティを強く予測して（β=0.416）、公正感とロイヤルティの関係を媒介した（間接効果0.072）（抄録）。", "fun": "雨の日に配車アプリの料金が跳ね上がると、「ずるい」と感じる人がいます。この調査では、料金が公正だと感じる人ほど満足し、また使い続けることが示されました。値段の高さそのものより、納得できる値段かどうかが客をつなぎとめるという話です。", "unverified": "授業課題のデータで、標本の代表性は未確認。"}}, {"id": "pr41", "rank": 41, "headline": "LLMのウェルビーイング介入推薦は心理プロフィールに反応する", "title": "LLM-Generated Well-being Intervention Recommendations Are Sensitive to Psychological Profiles: A Proof-of-Concept Expert-Rating Study", "url": "https://doi.org/10.31234/osf.io/y3k8a_v3", "authors": "Benjamin Kaveladze ほか", "venue": "PsyArXiv", "date": "2026-10-15", "apa": "Kaveladze, B., Lampe, E. W., Heinz, M. V., Marsch, L., Campbell, A. T., & Jacobson, N. C. (2026). LLM-Generated Well-being Intervention Recommendations Are Sensitive to Psychological Profiles: A Proof-of-Concept Expert-Rating Study. https://doi.org/10.31234/osf.io/y3k8a_v3", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（PsyArXiv）", "preprint": true, "short": true, "p1": "LLMが利用者の心理プロフィールに合わせてウェルビーイング介入（チャットボットの対話）を推薦できるかを、専門家の評定で確かめた概念実証（抄録）。", "p3": "14の心理尺度を持つ学生178人のプロフィールに、4つのLLMが222の対話から10個を推薦し、2人の専門家が適切さを1〜10で評定する。半数は本人向け、残りは別人向けの推薦を見せる。", "p5": "本人向けの推薦（平均6.74）は別人向け（5.64）より適切と評価された（SMD=0.50）。ただし評定者間信頼性は低く（ICC=0.22）、どのLLMも候補一覧の並び順に強く影響された（抄録）。", "fun": "AIに「この人に合うアドバイスを選んで」と頼むと、本当にその人に合わせているのでしょうか。確かめるため、別人用に選んだものと比べて専門家に採点させる工夫をしています。合わせる力はあるものの、候補の並び順にも左右されるという弱点も見つかりました。", "unverified": "利用者のウェルビーイングが実際に改善するかは未検証。"}}, {"id": "pr42", "rank": 42, "headline": "同じ症状でも属性が変わるとAIの医療助言が変わる", "title": "Same Symptoms, Different Patients? Demographic Bias in AI-Generated Medical Advice", "url": "https://doi.org/10.2139/ssrn.7616179", "authors": "Anurag Chatterjee", "venue": "SSRN", "date": "2026-10-15", "apa": "Chatterjee, A. (2026). Same Symptoms, Different Patients? Demographic Bias in AI-Generated Medical Advice. https://doi.org/10.2139/ssrn.7616179", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "臨床情報を同じにして患者の人種・性別・年齢・社会経済的地位だけを変えたとき、医療LLMの助言が変わるかについての文献を統合し、評価の枠組みを示した（抄録）。", "p3": "医療アルゴリズムの偏りと医療LLMの新しい証拠を批判的に統合し、臨床解釈、リスク評価、診断の推奨、管理、説明の5つの観点からなる臨床一貫性の枠組みで整理する。", "p5": "属性の手がかりは、心の健康の評価、検査、侵襲的処置、緊急度などで出力を変えうる。一方で属性が臨床的に意味を持つ場合もあり、違いが即差別とは言えないため、反実仮想・交差的なテストと臨床的レビューが必要だと論じる（抄録）。", "fun": "症状がまったく同じなのに、患者の性別や人種を変えるとAIの答えが変わるなら問題です。ただ、病気によっては性別や年齢で正しい対応が違うこともあります。「変わること」と「不当に変わること」を区別する物差しを作ろうとしている点が考えどころです。", "unverified": "文献統合で、新しい実験データはない。"}}, {"id": "pr43", "rank": 43, "headline": "戦時下で建設したアフガニスタン基盤信託基金の教訓", "title": "Building under Fire: The Afghanistan Infrastructure Trust Fund and Lessons for Multilateral Development Banks in Wartime", "url": "https://doi.org/10.2139/ssrn.7618702", "authors": "Joseph Mik", "venue": "SSRN", "date": "2026-10-16", "apa": "Mik, J. (2026). Building under Fire: The Afghanistan Infrastructure Trust Fund and Lessons for Multilateral Development Banks in Wartime. https://doi.org/10.2139/ssrn.7618702", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "紛争が激化する中でアジア開発銀行が運営したアフガニスタン基盤信託基金（2010〜2021年）を事例に、戦時のインフラ融資の課題を整理した（抄録）。", "p3": "著者の2017年の独立評価を再検討し、事業ごとの差異分析、ポートフォリオ内の比較、他の2つの信託基金との比較、国際比較を用いる。因果識別ではなく理論に基づく枠組みとして示す。", "p5": "平時の実務と戦時の条件の間に、時間・制度・知識・言説の4つのずれを見いだし、それが工程の遅延、費用の増大、審査の更新不足、援助国間の摩擦を「治安」や「能力不足」より説得的に説明するとした（抄録）。", "fun": "道路や送電線は平和になってから作るのがふつうですが、アフガニスタンでは戦争が続く中で作りました。失敗の原因を「危ないから」で片づけず、時間の感覚や情報の集め方が平時のままだったことにある、と分解した点が面白いところです。ウクライナ復興にもつながる話です。", "unverified": "著者自身の過去の評価に基づくため、独立性は未確認。"}}, {"id": "pr44", "rank": 44, "headline": "観光の快適性と持続可能な都市発展の協調（中国38都市）", "title": "Tourism comfort and sustainable urban development in 38 Chinese tourist cities: coupling coordination, spatial spillovers, and key drivers", "url": "https://doi.org/10.21203/rs.3.rs-10961386/v1", "authors": "Xiaoying Wu ほか", "venue": "Research Square (In Review)", "date": "2026-10-16", "apa": "Wu, X., Li, H., Hu, B., & Zhang, C. (2026). Tourism comfort and sustainable urban development in 38 Chinese tourist cities: coupling coordination, spatial spillovers, and key drivers. https://doi.org/10.21203/rs.3.rs-10961386/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（Research Square）", "preprint": true, "short": true, "p1": "中国の人気観光都市38市（2000〜2023年）で、観光の快適性と持続可能な都市発展の協調の度合いと、その空間的な波及・要因を調べた（抄録）。", "p3": "総合評価の指標を作り、カップリング協調モデル、カーネル密度推定、大域的モランI、空間ダービンモデルを使う。", "p5": "両方とも改善し、協調度は軽い不調和から辛うじて協調へ移った。東部・沿岸が西部・内陸を上回り、交通アクセスが最も強い正の要因で、間接効果が直接効果を上回った。観光への過度の経済依存は負の効果を持った（抄録）。", "fun": "観光客が増えれば町が豊かになりそうですが、観光に頼りすぎると町の持続性はかえって下がるという「観光依存の逆説」が見つかりました。一方で、交通の便が良いことは周りの町にまで良い影響を広げていました。町は単独ではなく、つながりの中で育つことを示しています。", "unverified": "指標の構成と係数の値は未確認。"}}, {"id": "pr45", "rank": 45, "headline": "予測と意思決定を一体で学ぶ公共交通経路推薦", "title": "A Prediction-Decision Collaborative Optimization Framework for Personalized Public Transit Path Recommendation", "url": "https://doi.org/10.2139/ssrn.7620253", "authors": "Pei Tong ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Tong, P., Yang, K., Wang, Y., & Yan, Y. (2026). A Prediction-Decision Collaborative Optimization Framework for Personalized Public Transit Path Recommendation. https://doi.org/10.2139/ssrn.7620253", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "公共交通の経路推薦で、予測誤差ではなく推薦の質を直接最適化する「予測と意思決定の協調最適化」を、北京の大規模な乗車データで示した（抄録）。", "p3": "乗車連鎖データから因子分析で潜在的な好みを取り出し、深層効用モデルで好み・経路・状況の相互作用を学び、微分可能な木のアンサンブル予測器を意思決定に基づく損失（Smart Predict-then-Optimize）で最適化する。", "p5": "費用・効率・総合的な兼ね合い・便利さの4因子が分散の84.14%を説明した。効用モデルの選択正答率は74.05%で多項ロジットを2.81〜5.08ポイント上回り、提案法は所要時間の予測精度が低いにもかかわらず平均後悔を4.88〜6.02%減らした（抄録）。", "fun": "所要時間をぴったり当てる予測が、良い道案内になるとは限りません。この研究は予測の正確さではなく「最終的に良い経路を選べたか」で学習させ、予測は少し外れても選択は良くなることを示しました。目的に合わせて学ばせ方を変える、という発想の転換です。", "unverified": "データの期間と規模は未確認。"}}, {"id": "pr46", "rank": 46, "headline": "接着接合部に光ファイバを埋めてひずみ検出を改善", "title": "Regulated Fiber Incorporation for Improved Strain Detection in Bonded Connections", "url": "https://doi.org/10.2139/ssrn.7620015", "authors": "Chen Li", "venue": "SSRN", "date": "2026-10-16", "apa": "Li, C. (2026). Regulated Fiber Incorporation for Improved Strain Detection in Bonded Connections. https://doi.org/10.2139/ssrn.7620015", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "接着接合部の接着層に光ファイバセンサを組み込む2つの方法を比べ、制御された組み込みでひずみ計測の信頼性が上がることを示した（抄録）。", "p3": "レイリー後方散乱の変化からファイバ沿いのひずみ・温度を測る光ファイバセンサを、単重ね引張せん断試験片の接着層に2通りの方法で組み込み、ファイバの向き・位置とひずみ信号の信頼性・精度で評価する。", "p5": "ファイバの組み込みを制御すると、ひずみの検出が改善し、接着接合部のより正確な構造ヘルスモニタリングが可能になるとした（抄録。数値は抄録になし）。", "fun": "髪の毛ほどの光ファイバを接着剤の中に埋め込むと、どこがどれだけ伸びたかを線に沿って測れます。ただ、ファイバが少し斜めになるだけで測定値がずれてしまいます。地味ですが、センサを「まっすぐ正しく埋める方法」が精度を左右するという、計測の基本に迫る研究です。", "unverified": "2つの方法の具体的な違いと精度の数値は未確認。"}}, {"id": "pr47", "rank": 47, "headline": "行動の一貫性をグラフで測りLLMエージェントの不確実性を評価", "title": "GraphACM: Graph-based Action Consistency Measurement for Uncertainty Quantification in LLM Agents", "url": "https://arxiv.org/abs/2610.22031", "authors": "Yaxin Ma ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Ma, Y., Zhang, W., Pothapragada, S. K., & Zare, A. (2026). GraphACM: Graph-based Action Consistency Measurement for Uncertainty Quantification in LLM Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22031", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "同じ課題をLLMエージェントに何度も実行させ、同じ状態での行動の一致度をグラフで測ることで、成功・失敗を予測する不確実性の指標を作った（抄録）。", "p3": "複数回の実行で等価な状態を統合した有向・行動ラベル付きのグラフを作り、共通の意思決定状態で行動を比べる。ノード単位と全体の一致度を定義し、全体の一致度を不確実性の代理として使う。", "p5": "3つのLLMでALFWorld、AppWorld、WebShopを試し、課題成功の予測でAUROC平均0.811となり、最強の行動一致の基準（0.729）や言語化された自信（0.769）を上回った（抄録）。", "fun": "AIに同じ仕事を何回かやらせて、毎回同じ場面で同じ行動を取るなら自信があり、ばらばらなら迷っている、と考えます。この研究は、その迷いが「どの場面で」起きるかまで地図のように示します。AIの自己申告の自信より、行動のぶれのほうが当てになるのが面白い点です。", "unverified": "なし"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "因果推論", "headline": "パネルデータの因果媒介分析をDMLで", "title": "Causal Mediation Analysis for Panel Data with Double/Debiased Machine Learning", "url": "https://arxiv.org/abs/2610.21339", "authors": "Peikai Wu ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Wu, P., & Xiao, Z. (2026). Causal Mediation Analysis for Panel Data with Double/Debiased Machine Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21339", "why": "二方向固定効果のパネルで、機械学習を使いつつ直接・間接効果を正しく推定できる二重機械学習の枠組みを示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（モデル§2.3、推定§3.1、シミュレーション§5、実証§6、結論§7と表1・表2）を読んだ。証明の付録は読んでいない", "preprint": true, "p1": "二方向固定効果のあるパネルデータで、処置が媒介変数を通じて結果に与える間接効果と直接効果を、機械学習で交絡を柔軟に除きつつ正しく推定・推論できる二重機械学習（DML）の枠組みを示した。", "p2": "パネルの因果媒介分析では、時間不変の交絡と、処置・媒介・結果の履歴の依存を同時に扱う必要がある。機械学習をそのまま使うと正則化と過学習のバイアスが入り、とくに間接効果の推論が崩れる（§1）。", "p3": "結果と媒介変数を、研究者が指定する履歴の辞書（処置・媒介の当期・ラグ・交互作用）の線形部分と、高次元の未知の交絡関数、個体・時点の固定効果に分ける部分線形モデルを置く（§2.3）。一階差分で個体効果を消し、時点効果を除く交差適合の標本分割と、機械学習で推定した交絡関数を、すべての局外成分にネイマン直交なスコアのGMMに入れる（§3.1）。直観：交絡関数の推定誤差が主要パラメータに1次で効かないようにする。", "p4": "N=1600、T=10のシミュレーションで、交差適合も直交化もない素朴なGMMと、平均・バイアス・RMSE・95%区間の被覆率を比べる（§5）。実証では米国の3,058郡（2000〜2019年）で、就業率が1人あたり個人所得に与える効果のうち、平均賃金を通じる部分を推定する（§6）。", "p5": "シミュレーションでは提案法の偏りは小さく被覆率は名目に近かったが、素朴なGMMは媒介式とそれに依存する間接効果で大きく崩れた（表1、例えば処置-共変量の交互作用の係数で被覆率0.944対0.747）。実証では総効果は0.6162と0.6099標準偏差でほぼ同じだったが、賃金を通じる割合は同質の定式化で65.19%、交互作用を入れると41.03%に下がった（表2）。", "p6": "因果的な解釈は逐次的な条件付き独立の仮定に依存し、実証ではその検証を省いたと著者は述べる。感度分析の開発や、媒介変数が高次元のときの扱いが今後の課題とされる（§6〜7）。", "fun": "「雇用が増えると所得が上がる」とき、その一部は「賃金が上がったから」、残りは別の理由です。この研究は、その内訳を、地域ごとの見えない事情を取り除きながら機械学習で正しく分ける方法を作りました。総額は同じでも、モデルの立て方で内訳が大きく変わることを示した点が教訓的です。", "unverified": "付録Dの他の標本サイズでの結果と、定理の正確な仮定は未確認。"}}, {"id": "pn02", "rank": 2, "field": "機械学習（Hugging Face）", "headline": "映像と音声の理解を総合評価するベンチマーク", "title": "OmniCompass: A Holistic Benchmark for Omni-Modal Video Grounding and Understanding", "url": "https://arxiv.org/abs/2610.18829", "authors": "Xuyang Liu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-16", "apa": "Liu, X., Wang, S., Wei, X., Li, M., Wang, Z., Yang, Z., Wen, Z., & Zhang, L. (2026). OmniCompass: A Holistic Benchmark for Omni-Modal Video Grounding and Understanding (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.18829", "why": "時間・空間の位置特定と質問応答を映像と音声で総合評価し、50のマルチモーダルモデルの弱点を示した（HF投票420）。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（評価の定式化§3.1、主結果§4.2、分析§4.3、結論）を読んだ。付録は見出しのみ", "preprint": true, "p1": "映像の「いつ（時間の位置特定）」「どこ（空間の位置特定）」「何が起きたか（質問応答）」を、映像のみの課題と映像＋音声の課題でまとめて評価し、同じ対象を文章だけで指すか画像も添えて指すかで答えが一貫するかまで測るベンチマークOmniCompassを作った。", "p2": "既存の映像理解のベンチマークは評価の次元の一部しか覆わず、マルチモーダルLLMの映像理解の弱点を体系的に診断できなかった（抄録、§1）。", "p3": "VLトラック（820本・2,460件）とAVトラック（240本・720件）で、各件を「文章だけ」と「文章＋参照画像」の対で出題する（§3.1）。対の両方が正解で、かつ2つの予測が互いに一致した度合いの最小値をとる一貫性スコア（CS）を定義し、偶然の一致では高得点にならないようにする。全件を人手で注釈し、多段の品質確認を行う（抄録）。", "p4": "50のモデル（独自モデルとオープンモデル）を評価し、TG（時間）、SG（空間）、QAのCSで比べる。時刻情報の付与や、文章のみ・映像・映像＋音声の入力の違いの分析も行う（§4.1、§4.3）。", "p5": "VLではGemini-3.8-FlashがCS平均42.8%で首位、オープンモデル首位はKimi-K3の39.6%だった。QAは36モデル中29が50%を超え最高69.1%なのに、TGとSGの最高はそれぞれ27.1%と34.9%にとどまった（表2）。AVではGemini-3.8-Flashが57.4%、オープンモデル首位は24.6%で、オープンモデル10個のTGはすべて3.5%以下だった（表3）。音声を加えるとQAのCSは平均22.9ポイント上がった（§4.3）。", "p6": "本文に独立した限界の節は見当たらない。解釈：映像本数が数百規模で、領域や長さによる偏りの影響は付録の分析に依存する。参照画像を添えると成績が上がったのは独自モデル12中8に対し、オープンモデルは24中3だった（§4.2）。", "fun": "AIは映像について「何が起きたか」の質問にはよく答えられます。ところが「それは何秒目のどこで起きたか」と聞くと、とたんに苦手になります。さらに、同じ選手を言葉で指すか写真で指すかで答えが変わってしまう。本当に見て理解しているのかを確かめる、意地悪で大事なテストです。", "unverified": "付録の映像の長さ・領域別の結果は未確認。"}}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "予測市場で読む、市場が想定する金融政策ルール", "title": "The Market-Perceived Monetary Policy Rule: Evidence from Prediction Markets", "url": "https://doi.org/10.2139/ssrn.7619838", "authors": "Emrehan Aktug ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Aktug, E., & Torul, O. (2026). The Market-Perceived Monetary Policy Rule: Evidence from Prediction Markets. https://doi.org/10.2139/ssrn.7619838", "why": "CPI発表とFOMC決定の両方を価格づけるKalshiを使い、市場が想定するFRBの反応を同じ1時間の中で測った。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN、本文は入手できず）", "preprint": true, "p1": "予測市場Kalshiの価格を使い、市場が想定するFRBの政策反応（市場が認識する金融政策ルール）を、指標発表と同じ1時間の中で実時間に測った。", "p2": "市場の政策反応の推定は、価格の変化を数日前に集めた調査のコンセンサス予想と組み合わせてきたため、発表直前の市場自身の予想とずれ、反応の大きさを過小評価しうる（抄録）。", "p3": "Kalshiが次のCPIの値と次回FOMCの決定の両方を価格づけるので、インフレのニュースを発表数分前の市場自身の予想と比べ、政策反応を同じ時間内の価格から読む。フェドファンド先物と、その後のCPIの契約も組み合わせ、今回の値の予想・政策反応・将来の値の予想をつなぐ（抄録）。", "p4": "2021〜2026年を対象に、CPIのサプライズ1ポイントあたりの次回FOMCの予想金利の変化を主な量とし、調査コンセンサスを基準にした場合と比べる（抄録）。", "p5": "CPIの上振れ1ポイントは次回FOMCの予想金利を18bp上げ、他の主要指標も政策ルールが示す符号で動かした。調査コンセンサスで測ると反応は5分の1〜4分の1ほど弱く出た。反応は政策経路に沿って増え、1か月先の13bpから11か月先の約72bpになり、次のCPIの予想も上がった（抄録）。", "p6": "予測市場の流動性と参加者の偏りが価格の情報にどう影響するかは、抄録からは分からない（解釈）。対象は米国の6年間に限られる。", "fun": "「物価が予想より高かったら、中央銀行は金利をどれだけ上げると市場は思っているか」を知るのは難しい問題でした。この研究は、物価と金利の両方に賭けられる市場を使い、発表の数分前の予想と1時間以内の反応を並べて測りました。古い予想と比べていたせいで反応を小さく見積もっていたことがわかります。", "unverified": "本文の推定方法の詳細と、予測市場の流動性の扱いは未確認。"}}, {"id": "pn04", "rank": 4, "field": "統計学", "headline": "予測で推論を強化するPPIの共分散を較正", "title": "Covariance-Calibrated Prediction-Powered Inference", "url": "https://arxiv.org/abs/2610.21837", "authors": "Siyuan Chen ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Chen, S., Bai, Y., & Zhu, H. (2026). Covariance-Calibrated Prediction-Powered Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21837", "why": "ラベルなしの予測値で共分散の重みを較正する予測強化推論（PPI）の改良で、効率性と有限標本の保証を与えた。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、構成§3.4、半分の強さの根拠§5.3、実データ§7と表7、結論§8）を読んだ。証明と補足資料は読んでいない", "preprint": true, "p1": "少数のラベル付きデータと多数の予測値を組み合わせる予測強化推論（PPI）を、GMMの重み行列の観点で一般化し、ラベルなしデータの予測スコアの共分散で重みを較正するCC-PPIを提案して、効率性と有限標本のリスクの保証を与えた。", "p2": "PPI、PPI++、PSPA、PDCなどは1次の影響関数は比べられるが、有限標本では重みの推定やヤコビアンの効果で推定値が変わる。GMMの基準をそのまま最小化すると、係数補正の方程式を解く場合と結果が異なりうる（§1）。", "p3": "教師ありの初期推定でスコアを評価し、結合モーメントの共分散を推定し、補助残差の項の計量を、ラベル付きではなくラベルなしの予測スコアの共分散で置き換えて較正する（§3.4）。固有値を切り詰めて正定値を保ち（スペクトル保護）、元の共分散と目標を半分ずつ混ぜる。半分の強さは、二次の損失のもとで最適な強さが区間内のどこか分からないときの最小最大後悔の中点として正当化される（命題5.5）。", "p4": "線形回帰での有限標本リスクの恒等式と設計に基づく改善定理、ロジスティック回帰と多出力のシミュレーション、外部で学習したXGBoostの予測を使う4つの実データ（California Housing、Bike Sharing、ACS Income、Wine Quality）で、教師ありに対するパラメータMSEの比で比べる（§6〜7）。", "p5": "較正は1次の効率性を保ち、線形回帰で予測誤差への許容度つきの厳密な改善を示した（§4〜5）。California Housingでは、n=25で教師ありを100%とするMSE比が、全GMMで22.9%、CC-PPIで20.8%、別に選んだ固定強さの参照で19.4%だった（表7）。ただしn=2000では通常のPPIが7.8%で最も小さかった（表7）。独立の固定強さの参照による追加の改善は数%にとどまった（§8）。", "p6": "厳密なリスク理論は線形回帰に限られ、非線形のロジスティックは実験での評価のみ。改善が成り立つ設計の条件の拡張、他の補助残差の計量の比較、有限標本の区間の較正は今後の課題と著者は述べる（§1、§8）。", "fun": "正解ラベルの付いたデータは少なく高価ですが、AIの予測なら大量に安く作れます。PPIは、その予測を少しずつ補正しながら使う方法です。この研究は、その補正の「混ぜ具合」を、ラベルのないデータの性質から決め、迷ったら半分ずつ混ぜるのが最悪を避ける選択だと数学的に示しました。", "unverified": "他の3つの実データの表の数値と、補足資料の証明は未確認。"}}, {"id": "pn05", "rank": 5, "field": "教育", "headline": "都市教員の農村派遣はくじで見ると学力を上げる", "title": "Spatial Misallocation of Teacher Human Capital and Within-School Knowledge Spillovers: Lottery Evidence from China's Urban–Rural Teacher Rotation Policy", "url": "https://doi.org/10.2139/ssrn.7615695", "authors": "Qiang Zhao² ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Zhao², Q., & Qian, M. (2026). Spatial Misallocation of Teacher Human Capital and Within-School Knowledge Spillovers: Lottery Evidence from China’s Urban–Rural Teacher Rotation Policy. https://doi.org/10.2139/ssrn.7615695", "why": "中国西部の148校でのくじ引きによる配置を使い、都市教員のローテーションが農村の算数の学力と波及効果を生むことを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN、本文は入手できず。抄録は途中まで）", "preprint": true, "p1": "中国西部の郡が行ったくじ引きによる配置を使い、都市の数学教員を農村の小学校にローテーションさせる政策が、学力を上げ、教員が戻った後も効果が続き、同じ学校の別のクラスにも波及することを示した。", "p2": "中国では教員の人的資本が県城や都市に集中し、国は都市教員の農村勤務で空間的な偏りを正そうとしているが、再配置が農村の学びを高めるか、任期後も続くかの因果的な証拠は乏しかった（抄録）。", "p3": "12の県で、都市の数学教員を148校のうち73校にくじで割り当て、2学級の学校では4年生の2学級のどちらかに無作為に配置した。2023年9月〜2025年6月に5,738人の児童を追跡する（抄録）。", "p4": "数学の学力と学業の自己効力感を標準偏差単位で測り、同じ学校の割り当てられなかったクラスへの波及、授業・フィードバック・期待・家庭との連絡の変化による媒介、費用便益比を評価する（抄録）。", "p5": "ローテーション教員の担当で、数学の学力は任期末に0.170標準偏差、教員が都市に戻った1年後も0.116標準偏差高かった。自己効力感は0.202標準偏差上がり、その75%が持続した。同じ学校の担当外のクラスも0.086標準偏差伸び、波及は共同の授業準備とともに大きくなった。観察された授業の変化などが数学の効果の29%を説明し、費用便益比は保守的な仮定で2.5〜6.9だった（抄録）。", "p6": "中国西部の12県の数学に限った結果で、他教科や地域への一般化は未検証（解釈）。抄録が途中で切れており、費用便益の仮定は確認できない。", "fun": "町の先生が1年間だけ村の学校で教えると、子どもの算数の力が伸び、先生が帰った後もその効果が残りました。さらに、その先生が担当していない隣のクラスまで伸びたのは、村の先生と一緒に授業の準備をしたからでした。先生から先生へ、教え方が受け継がれていったのです。", "unverified": "費用便益比の前提と、本文の推定式は未確認。"}}, {"id": "pn06", "rank": 6, "field": "経済学", "headline": "特許審査官のくじ引きは操作されている", "title": "Playing the Patent Lottery", "url": "https://doi.org/10.2139/ssrn.7614238", "authors": "Cameron Ellis ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Ellis, C., Jaspersen, J. G., & Luz, V. (2026). Playing the Patent Lottery. https://doi.org/10.2139/ssrn.7614238", "why": "無作為とされる米国の審査官割当てが一部の法律事務所に有利に操作されていることを400万件の出願で示し、審査官を操作変数とする研究設計に疑問を投げた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN、本文は入手できず）", "preprint": true, "p1": "米国の特許審査官の割当ては無作為とされるが、一部の法律事務所や社内弁理士が、偶然以上に寛容な審査官を得ていることを、原文でfour millionとされる件数の出願で示した。", "p2": "審査官の無作為割当て（特許の「くじ引き」）は公平性の制度であると同時に、審査官の寛容さを操作変数とする多くの実証研究の識別の前提になっている。それが戦略的に操作されうるかは確かめられていなかった（抄録）。", "p3": "2001〜2020年に出願された原文でfour millionとされる件数のデータで、真に無作為な場合の審査官の寛容さの帰無分布を導き、代理人ごとの実際の分布と比べる。操作の仕組みと、どの企業が操作に投資するかの簡単なモデルを作る（抄録）。", "p4": "代理人ごとに、帰無分布から外れて寛容な審査官を得ているかを検定し、制度の知識や、公開されている審査官の業務量の利用などの仕組みとの整合を調べ、モデルの予測を検証する（抄録）。", "p5": "多くの法律事務所と社内弁理士が、偶然で許される以上に寛容な審査官を体系的に得ていた。制度の知識の活用や、公開された審査官の業務量の利用など、操作と整合する複数の仕組みを示し、操作への投資のモデルの予測が支持された（抄録。具体的な割合は抄録になし）。", "p6": "操作を直接観察したのではなく、帰無分布からの乖離と仕組みとの整合からの推論である（解釈）。著者は、審査官の無作為割当てに依存する実証設計の妥当性にも疑問を投げている（抄録）。", "fun": "特許の審査官は、くじ引きのように公平に割り当てられるはずでした。ところが一部の事務所は、どの審査官が忙しいかなどの公開情報を使って、甘い審査官に当たりやすくしていたようです。この「くじ」を前提にした多くの研究の結論まで揺らぐ、波及の大きい発見です。", "unverified": "操作の大きさの数値と、厚生への影響の推定は未確認。"}}, {"id": "pn07", "rank": 7, "field": "組織行動・心理的安全性", "headline": "リーダーのアイデンティティ脅威研究を体系化", "title": "LEADING UNDER THREAT: A SYSTEMATIC REVIEW OF LEADER IDENTITY THREAT RESEARCH AND FUTURE DIRECTIONS", "url": "https://doi.org/10.2139/ssrn.7620271", "authors": "Sing Yee Lim ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Lim, S. Y., & Sekiguchi, T. (2026). LEADING UNDER THREAT: A SYSTEMATIC REVIEW OF LEADER IDENTITY THREAT RESEARCH AND FUTURE DIRECTIONS. https://doi.org/10.2139/ssrn.7620271", "why": "96本の査読論文を整理し、リーダーのアイデンティティ脅威の定義と、その原因・反応・帰結の地図を示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN、本文は入手できず）", "preprint": true, "p1": "2011年〜2026年7月の査読付き96研究を体系的に整理し、リーダーのアイデンティティ脅威に新しい定義を与え、原因・反応・帰結を結ぶ研究の地図を示した。", "p2": "リーダーのアイデンティティ脅威の研究は増えているが、理論的に断片化し、概念も分散していた（抄録）。", "p3": "PRISMAの手順、bibliometrixによる書誌分析、TCCM（理論・文脈・特性・方法）の枠組みで96研究を分析する（抄録）。", "p4": "研究の流れの変化、脅威の原因、反応の種類、帰結の水準（チーム・集団・心理）を分類し、未統合の点を洗い出す（抄録）。", "p5": "研究は、少数派のリーダーが受けるリーダーシップとジェンダーのステレオタイプから、職業的・社会的アイデンティティ、関係的・行動的な過程へと広がった。脅威は部下の特性や関係だけでなく、組織・文脈、人口統計、リーダーの行動からも生じ、回避・変化の受容・報復・リーダーシップの発現など大きく異なる反応を引き起こしていた（抄録）。", "p6": "認知的評価・感情・関係の仕組みが十分に統合されておらず、部下・チーム・キャリア・組織の水準の帰結が手薄だと指摘し、縦断・多水準の設計や多様な文化での検証を求めている（抄録）。", "fun": "上司も「自分はリーダーとして認められていないのでは」と脅かされると感じることがあります。そのとき、逃げる人、変わろうとする人、部下に八つ当たりする人、逆にリーダーらしくなる人と、反応はさまざまです。この研究は、その分かれ道がどこで生まれるかを、過去の研究を集めて整理しました。", "unverified": "新しい定義の文言と、96研究の内訳は未確認。"}}, {"id": "pn08", "rank": 8, "field": "因果推論", "headline": "処置効果の届かない領域の大きさを検定する", "title": "The Reach of Treatment Effects: Randomization Inference for Zero-Effect Regions", "url": "https://arxiv.org/abs/2610.20759", "authors": "Pengyu Li ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Li, P., & Zhang, Y. (2026). The Reach of Treatment Effects: Randomization Inference for Zero-Effect Regions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20759", "why": "処置効果がゼロの共変量領域がどこまで大きくありうるかに、有限標本で妥当な上側信頼限界を与える新しい問いを立てた。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（構成§2.2、合成実験§6.1.1、実データ§6.2、議論§7）を読んだ。理論§5の証明と付録は読んでいない", "preprint": true, "p1": "処置が誰にも効かない「効果ゼロの共変量領域」がどこまで大きくありうるかに、有限標本で妥当な95%上側信頼限界を与える無作為化推論を作り、処置効果の「届く範囲（reach）」を測れるようにした。", "p2": "従来の無作為化推論は「誰にも効かない」という鋭い帰無仮説の検定や平均効果に向き、効果があると分かっても、それが共変量の広い範囲に及ぶのか一部に限られるのかは言えなかった（§1）。", "p3": "事前に選んだ共変量で単位を並べ、連続したブロックごとに「ブロック内の全員に効果がない」という局所的な鋭い帰無仮説を無作為化検定する。棄却されない最大のブロックの長さが上側信頼限界になる（§2.2）。直観：大きなブロックがすべて棄却されれば、大きな無効領域はないと言える。並べ替えの共有と累積和で多数の重なる検定を高速化し、2次元の最近傍領域にも広げる（§3〜4）。", "p4": "合成データで被覆率と限界の大きさ（真の無効割合0.10）、計算時間を調べ、投票促進の社会的圧力の郵便実験（Gerber–Green–Larimer）、HIV臨床試験ACTG 175、AI支援の文章作成データに適用する（§6）。", "p5": "合成データでは全標本サイズで被覆率が名目の95%以上で、領域内で中心化した統計量はn=200で限界の平均を1次元で0.574から0.196、2次元で0.787から0.263に縮めた（§6.1.1、図3）。投票実験の119,999世帯では平均の投票率の差は8.48ポイントで、効果ゼロのブロックの95%上側限界は4,286世帯（標本の3.6%）となり、効果が世帯の年齢の広い範囲に及ぶことを示した（図5）。", "p6": "「実質的に意味のない効果」の許容幅を入れた複合帰無への拡張、正負の効果が打ち消し合う場合の統計量、領域の大きさだけでなく位置の推論に必要な同時誤差制御が今後の課題と著者は述べる（§7）。", "fun": "「この薬は効く」と分かっても、本当に知りたいのは「誰にでも効くのか、一部の人にしか効かないのか」です。この研究は、「効かない人のかたまりは、最大でもこれくらいの大きさしかない」と保証付きで言える方法を作りました。効果の「届く範囲」を測るという、新しい問いの立て方が面白い点です。", "unverified": "ACTG 175とAI支援の文章作成データでの結果の数値は未確認。"}}, {"id": "pn09", "rank": 9, "field": "機械学習", "headline": "言語モデルのパラメータを小さな部品に分解して解釈", "title": "Interpreting Language Model Parameters", "url": "https://arxiv.org/abs/2610.20748", "authors": "Lucius Bushnaq ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Bushnaq, L., Braun, D., Clive-Griffin, O., Bussmann, B., Hu, N., Ivanitskiy, M., Linsefors, L., & Sharkey, L. (2026). Interpreting Language Model Parameters (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20748", "why": "敵対的なアブレーションにも耐える部分要素へのパラメータ分解（VPD）で、表現ではなくパラメータの計算を解釈する方法を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法§2の概要、対象モデル§3.1、再構成と比較§3.2〜3.5、手作業の編集§6、限界§7.5）を読んだ。§4〜5の回路分析と付録は見出しと一部のみ", "preprint": true, "p1": "言語モデルの重み（パラメータ）を、入力ごとにごく一部だけが使われるランク1の小さな部品（サブコンポーネント）に分解するVPD（adVersarial Parameter Decomposition）を作り、67Mパラメータのモデルで、部品の解釈、回路の分析、重みを手で編集して振る舞いを変えることまで示した。", "p2": "機械的解釈可能性の研究は中間の表現（活性）の構造を多く明らかにしてきたが、パラメータと非線形性がその表現にどう計算を施すかの理解はほとんど進んでいなかった（抄録、§1）。", "p3": "各重み行列をランク1の部品の和に分け、入力ごとに各部品の因果的重要度（0〜1）を学習する。重要でない部品は、どんな組み合わせで取り除いても出力が保たれるよう、取り除き方を敵対的に選ぶ損失で訓練する（§2）。直観：「悪意ある取り除き方」にも耐える分解は、本当に計算に使われている部品だけを残す。最小性と単純さの損失も加える。", "p4": "The Pileの著作権のない部分で学習した4層・67Mパラメータのデコーダ型Transformerを分解し、検証の交差エントロピー（CE）での再現度、層ごと・層をまたぐトランスコーダとの再構成と疎性のトレードオフ、部品の解釈しやすさ、特徴の分裂の有無を調べる（§3）。", "p5": "分解したモデルのCEは2.72〜3.02で、元のモデルは2.71だった（§3.2）。4つのMLP層をすべて置き換えたとき、3通りの疎性の定義のどれでもトランスコーダよりCEの劣化が小さかった（図4）。ただし同じ目的で比べるとこの優位は消え、VPDは自分の訓練目的への過適合を避けたとする（§3.3）。顔文字の最初の文字に反応する部品を1つ手で書き換え、すべての顔文字を驚き顔「:o」と予測させた（§6）。", "p6": "分解できたのは67Mの小さなモデルで、より大きなモデルや画像・マルチモーダルのモデルへの拡張、敵対的なサンプラーと因果的重要度関数の改良が課題と著者は述べる（§7.5）。", "fun": "AIの頭の中を理解するには、これまで「どの神経がどう光ったか」を見てきました。この研究は、光り方ではなく、AIを形づくる重みそのものを小さな部品に分けました。さらに部品を1つ書き換えるだけで、顔文字をすべて「驚いた顔」に変えられたのは、AIの脳外科手術のような成果です。", "unverified": "§4〜5の注意機構の回路の詳細と、事前学習計算量の回復率の値は未確認。"}}, {"id": "pn10", "rank": 10, "field": "政治学", "headline": "分権化された公的就労が恩顧政治の道具になる", "title": "Decentralized but Dependent: Clientelism through Workfare", "url": "https://doi.org/10.2139/ssrn.7613922", "authors": "Gyozo Gyongyosi ほか", "venu
