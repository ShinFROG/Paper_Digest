<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>

  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-10-11", "intro": "プレプリントの新着702件、学術誌の新着1,924件（うち上位10%誌1,611件）、重要論文の候補224件、新着の公開データ109件から選びました。プレプリント・関連40報、プレプリント・注目37報、論文誌・関連44報、論文誌・注目25報、データ19件です。週末でarXivの新着がなく、SSRN・Zenodoの登録が中心だったため、質の高い候補が少ない部は件数を減らしました。論文誌・注目は主要誌の新着が少なく、抄録のない新着も含みます。取得できなかった情報源はありません。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "列車振動に埋もれた覆工裏の微弱衝撃を識別", "title": "Vibration-Based Identification of Weak Local Impacts Behind Railway Tunnel Linings under Strong Train-Induced Vibration", "url": "https://doi.org/10.2139/ssrn.7590044", "authors": "Yang Gao ほか", "venue": "SSRN", "date": "2026-10-09", "apa": "Gao, Y., Dong, H., Xu, W., Zuo, Y., & Li, Z. (2026). Vibration-Based Identification of Weak Local Impacts Behind Railway Tunnel Linings under Strong Train-Induced Vibration. https://doi.org/10.2139/ssrn.7590044", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRN版は本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "営業中の鉄道トンネルで、覆工の裏で岩塊がはがれ落ちて生じる微弱な衝撃を、列車の強い振動の中から機械学習で識別できる見込みと、その限界を示した（抄録）。", "p2": "微弱な衝撃は列車振動に埋もれ、最大加速度や単一の卓越振動数による判定は信頼できない。従来は衝撃だけを測った条件で特徴量の分離のしやすさを評価しがちで、強い背景振動の下での汎化は確かめられていなかった（抄録）。", "p3": "実物大の覆工への岩塊衝突試験、営業線トンネルでの連続振動計測、データ駆動の事象識別を組み合わせた。実測の微弱衝撃応答を実測の列車振動に重ね合わせた制御データを作り、時間領域の振幅とスペクトル構造など複数の補完的な信号属性を入力として多層パーセプトロン（MLP）で衝撃事象を判定する。解釈：衝撃と列車振動は卓越振動数が似ていても、短時間の振幅の立ち上がりとスペクトルの形の組合せでは違いが残る、という直観に基づく（抄録）。", "p4": "評価は、実測した衝撃1件ずつを順に検証用に外す7分割の交差検証（leave-one-measured-impact-out）で、未使用の実測衝撃に対する事象単位のF1値を指標とした（抄録）。", "p5": "列車振動・他の外乱・模擬衝撃は監視条件下で似た卓越振動数を示した。単独条件では分離しやすい特徴も、列車振動に重ねると分離性が大きく下がった。最終的なMLPの事象単位F1値の平均は68.96%で、識別は時間領域の振幅とスペクトル構造の組合せに主に依存した（抄録）。", "p6": "F1値約69%は実用の警報としてはまだ誤検知・見逃しが多い水準で、重ね合わせデータは実際の衝撃が列車通過と同時に起きる状況の近似にとどまる。1本のトンネルでの検証であり、他の地盤や覆工構造への一般化は未確認。解釈：抄録のみのため、閾値の決め方や誤検知の内訳は分からない。", "fun": "電車が走るたびに大きく揺れるトンネルの壁の裏で、小さな石が「コツン」と落ちる音を聞き分けたい。大音量の音楽の中でささやき声を聞き取るような難問です。静かな部屋では簡単に聞き分けられた特徴も、うるさい場所では役に立たなくなる、という結果は、実験室と現場の違いの大切さをよく示しています。", "unverified": "特徴量の具体的な一覧、MLPの構成、誤検知率の内訳は未確認（抄録のみ）。"}}, {"id": "pr02", "rank": 2, "headline": "LLMは人の行動を予測できても一人称では別の答え", "title": "Knowing Is Not Doing: Large Language Models Predict Human Social Behavior but Respond Differently in the First Person", "url": "https://doi.org/10.5281/zenodo.23278352", "authors": "Fukuda, Tatsuki", "venue": "Zenodo", "date": "2026-10-10", "apa": "Fukuda, T. (2026). Knowing Is Not Doing: Large Language Models Predict Human Social Behavior but Respond Differently in the First Person (Version Preprint_v1). Zenodo. https://doi.org/10.5281/ZENODO.23278352", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "Zenodo版のPDF本文（方法・結果・限界の節、表III・IV、図1〜5のキャプション）を読んだ", "preprint": true, "p1": "LLMに「人ならどう行動するか」を予測させる場合と、「あなたならどうするか」を一人称で答えさせる場合で、答えが系統的に食い違う（知識と行動のギャップ）ことを、社会心理学の3つの古典的実験で示した（抄録、§IV）。", "p2": "LLMは模擬参加者や社会的エージェントの頭脳として使われるが、人の行動についての知識と、状況に置かれたときの応答は混同されがちで、両者を古典実験で分けて人のデータと比べた研究はなかった（§I）。", "p3": "VRで研究された群衆での視線追従、仮想エージェントへの同調、仮想人物との対人距離の3課題について、元研究の想起・人の行動の予測・一人称の応答の3段の問いを作り（98プロンプト＋対照15）、Qwen 3.8 27B、Gemma 4 26B、gpt-oss 20Bに各20回答えさせた（§III-B、C）。背景：20回の回答を20人の「参加者」とみなして集計する。", "p4": "人の元研究の要約値や当てはめ曲線（表I）と比べ、Wilsonの95%区間などで差を評価した。視線追従では、場面と回答形式を固定して「あなた」と「無作為な歩行者」だけを変える対照で、手順の効果と視点の効果を分けた（§III-E、§IV-C）。", "p5": "視線追従では、1人が見上げたときに足を止めて見る人の割合を3モデルとも8.6〜10.9%と人（4.2%）に近く予測したが、一人称では90%・100%・60%で「見上げる」と答えた（§IV-B、表III、図1）。対照では、単一場面の形式自体が予測を2〜4倍に上げ、視点固有の差は2モデルで残った（図3）。同調では逆に、予測は人の63.2%に近いが、正解が数値で示されると一人称の同調は0〜49%と低かった（表IV）。", "p6": "20回の回答は1つのモデルからの抽出で人の集団ではなく、一人称の回答は行動ではなく言葉による表明である。視点を揃えた対照は視線追従のみで、20〜27Bの3モデル・英語のみ。対人距離のプロンプトは初回後に改訂された（§VI）。", "fun": "「群衆の中で一人が空を見上げても、ほとんどの人は気にせず通り過ぎる」とAIは正しく知っています。ところが「あなたなら？」と聞くと、ほぼ全員「見上げる」と答えました。逆に周りに流される実験では、AIは人の流されやすさを正しく予測しつつ、自分は流されないと答えます。知っていることと、自分がすることは別物なのです。", "unverified": "対人距離の課題の詳細な数値（表V）は本文の抽出が崩れており、一部未確認。"}}, {"id": "pr03", "rank": 3, "headline": "GNSS途絶中も過去状態の相関でINS誤差を抑制", "title": "Correlation-Aware Multi-State Adaptive Stochastic Cloning for Robust GNSS/INS Navigation during GNSS Outages", "url": "https://doi.org/10.2139/ssrn.7590042", "authors": "Ajaykrishna Rajamony ほか", "venue": "SSRN", "date": "2026-10-09", "apa": "Rajamony, A., & Mukherjee, B. (2026). Correlation-Aware Multi-State Adaptive Stochastic Cloning for Robust GNSS/INS Navigation during GNSS Outages. https://doi.org/10.2139/ssrn.7590042", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRN版は本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "低価格のGNSS/INS航法で、GNSSが途切れた間の位置誤差の急増を、過去の信頼できる航法状態を「複製（クローン）」として保持し、その相関を正しく扱って抑える枠組み（CA-MASC）を示した（抄録）。", "p2": "GNSSが途切れると、INS（慣性航法）は外部の位置・速度の補正なしに動き、誤差が急速に増える。過去の状態を使う方法はあるが、それを独立な観測とみなすと、現在の状態との統計的な依存を無視してしまう（抄録）。", "p3": "完全性（信頼性）の基準を満たしたGNSS補正済みの状態を複製として作成時点に固定し、現在の状態と複製の相互共分散を拡大共分散モデルで明示的に伝播させ、相関を考慮したカルマン更新で現在の状態だけを補正する。どの状態を残すかはGNSSの品質指標による適応的な基準で決める。PPSによる時刻同期、3次エルミート補間、レバーアーム補正、マハラノビス距離による外れ値除去、イノベーションに基づく適応推定を支援の仕組みとして組み込んだ（抄録）。", "p4": "実時間の実験で、従来の疎結合のGNSS/INS統合と位置のRMSEを比べ、通常運用時と30秒・60秒のGNSS途絶時で評価した（抄録）。", "p5": "通常運用時に位置RMSEを最大67%、30秒の途絶で最大55%、60秒の途絶で最大46%減らした（抄録）。", "p6": "途絶時間は60秒までの評価で、より長い途絶や都市部の多重反射環境での性能は抄録からは分からない。解釈：改善の多くが支援の仕組み（時刻同期や外れ値除去）によるのか複製の仕組みによるのかの切り分けは、本文で確認が必要。", "fun": "トンネルに入ってGPSが切れると、車のナビは自分の動きのセンサーだけで位置を推測し、だんだんずれていきます。この研究は「さっき確かだった自分の位置」を記憶しておき、それと今の推測のつながりを正しく計算に入れることで、ずれを半分ほどに抑えました。過去の記憶の使い方の工夫です。", "unverified": "実験の車両・センサーの種類と、各支援機構の寄与の切り分けは未確認（抄録のみ）。"}}, {"id": "pr04", "rank": 4, "headline": "日本企業の従業員満足度が超過リターンを予測", "title": "Employee Sentiment and Excess Returns in Japanese Equities", "url": "https://doi.org/10.2139/ssrn.7590858", "authors": "Edward Herbert", "venue": "SSRN", "date": "2026-10-10", "apa": "Herbert, E. (2026). Employee Sentiment and Excess Returns in Japanese Equities. https://doi.org/10.2139/ssrn.7590858", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN版は本文を取得できず、Crossrefに登録された抄録を使用（抄録は短い）", "preprint": true, "p1": "日本の上場企業について、従業員が自発的に投稿した満足度の評価が高い企業ほど、2015〜2025年に株式リターンで同業他社を一貫して上回ったことを示した（抄録）。", "p2": "上場企業の従業員は、公開情報を超える自社の内情を知っている。その評価が株価にまだ織り込まれていない情報を含むか、日本企業で大規模に調べた例は少ない（抄録）。", "p3": "37万5,000人超の従業員が投稿した評価データを企業ごとに集計し、満足度の高低で企業を比べて超過リターンを調べた。解釈：満足度の高い企業群と低い企業群のポートフォリオを比べる設計と考えられるが、詳細は未確認（抄録）。", "p4": "比較対象は同業他社のリターンで、プロの投資家が使う一般的なリスクファクターとの関係を、エクスポージャーとリターンの両面から確かめた（抄録）。", "p5": "満足度の高い企業は期間を通じて一貫して同業を上回った。従業員の評価は、一般的なリスクファクターとエクスポージャーでもリターンでも無相関だった（抄録）。", "p6": "投稿は自発的で、投稿者の偏り（不満のある人や退職者が書きやすいなど）がありうる。超過リターンの大きさ、取引費用、評価の公開時点と株価の時間関係は抄録からは分からない。", "fun": "会社の本当の姿を一番よく知っているのは、そこで働く人たちかもしれません。社員の口コミ評価が良い会社の株は、長い期間にわたって他社より値上がりしていました。しかもその差は、プロがよく使う「株の値動きの説明要因」では説明できない、新しい情報だったという点が面白いところです。", "unverified": "超過リターンの数値、ポートフォリオの作り方、データの提供元は未確認（抄録のみ）。"}}, {"id": "pr05", "rank": 5, "headline": "真偽ラベルでLLMの感情は反転、人種差は残存", "title": "Veracity Labels Flip the Emotional Tone of Language Models but Leave Racial Disparities Intact", "url": "https://doi.org/10.2139/ssrn.7584919", "authors": "Nouar Aldahoul ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Aldahoul, N., Tan, M. J., & Zaki, Y. (2026). Veracity Labels Flip the Emotional Tone of Language Models but Leave Racial Disparities Intact. https://doi.org/10.2139/ssrn.7584919", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRN版は本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "ニュースの見出しに「虚偽」「真実」の判定ラベルを付けると、LLMが示す感情の調子は大きく反転するが、人種などのペルソナによる感情の差は消えないことを示した（抄録）。", "p2": "LLMはペルソナを通じて情報を伝えるようになっているが、事実を訂正すれば、属性の違うペルソナの間で語り口も揃うのかは分かっていなかった（抄録）。", "p3": "GPT-5.4 mini、Nemotron 3 Nano、Llama 4 Scout、Claude Haiku 4.5の4モデルに、ファクトチェック済みの見出しへの気分・怒り・恐れ・自信・統制感・精神状態の6次元の擬似的な感情を評価させた。実験1は虚偽と真実の見出し各1,000件をペルソナなしで、実験2は各300件を人種×性別×年齢の12ペルソナで評価した（抄録）。", "p4": "ラベルの有無による評価の変化と、ペルソナ間の差を、見出しのクラスタ・ブートストラップ推測を伴う順序ロジスティック回帰で検定した（抄録）。", "p5": "虚偽の見出しを否定するラベルで、GPT・Llama・Claudeの評価はおおむね否定的から肯定的に転じ、Claudeの「自信」は22%から99.6%に上がった。一方、有意な84の比較のうち82で黒人ペルソナに白人より否定的な感情が割り当てられ、ラベルの有無にかかわらず、人種と無関係な見出しでも続いた（抄録）。", "p6": "評価されたのはモデルが「割り当てる」擬似的な感情で、人の感情反応そのものではない。4モデル・英語の見出しに限られる。解釈：差がどの段階（学習データ、ペルソナの記述）から来るかは抄録からは分からない。", "fun": "ニュースに「これはデマです」と付けると、AIが演じる人物の気分はがらりと明るくなりました。ところが、演じる人物の人種を変えると、どの条件でも黒人の人物ほど暗い気分が割り当てられ、その差はデマの訂正では消えませんでした。事実を正すことと、公平に扱うことは別の問題だと分かります。", "unverified": "ペルソナの年齢の効果の詳細と、Nemotronの結果の内訳は未確認（抄録のみ）。"}}, {"id": "pr06", "rank": 6, "headline": "自動微分で順解析と逆解析を同時に回すロッド要素", "title": "Differentiable Geometrically Exact Rods: Computational Structure and Forward-Inverse Parallelism", "url": "https://doi.org/10.2139/ssrn.7592637", "authors": "Jia Lu", "venue": "SSRN", "date": "2026-10-10", "apa": "Lu, J. (2026). Differentiable Geometrically Exact Rods: Computational Structure and Forward-Inverse Parallelism. https://doi.org/10.2139/ssrn.7592637", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRN版は本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "幾何学的に厳密なロッド（細長い梁）の有限要素を、スカラーのポテンシャルから自動微分で組み立て、順解析（形を与えて変形を求める）と逆解析（変形から元の形を求める）を同じ平衡方程式の2方向として並べて解けるようにした（抄録）。", "p2": "大変形するロッドの有限要素は回転の扱いが難しく、自動微分を使うと物理的な仕事の共役関係が崩れやすい。逆設計のための逆解析は、順解析とは別の手続きとして扱われがちだった（抄録）。", "p3": "回転場の構成に客観的な積分法を用いて剛体回転に対する不変性を保ち、変分変数と配置変数を分けて、変分変数で微分して残差を得てから配置変数で線形化することで、物理的な力とモーメントの残差を得る。本質的な演算子にはJacobian-vector積の独自規則を入れ、低次元の計算と数値的な頑健性を保つ（抄録）。", "p4": "数値例で、客観性、2次収束、順解析と逆解析の可逆性、逆設計への応用を示した。比較対象や誤差の指標は抄録には記載がない（抄録）。", "p5": "スナップスルーや複数の平衡解を含む例で、異なる未変形形状が同じ変形後の平衡状態に至ることと、異なる変形後の平衡状態が同じ未変形形状に対応することの、2方向の非一意性を示した（抄録）。", "p6": "抄録からは計算コストや大規模な構造への適用性、接触や動的問題への拡張は分からない。解釈：逆解析の非一意性は、実務の逆設計では解の選び方の問題として残る。", "fun": "曲がった針金の形を見て「もともとどんな形だったか」を逆算するのは、ふつうの計算の逆向きです。この研究は、自動で微分を計算する仕組みを使い、行きと帰りを同じ式で解けるようにしました。しかも、元の形が違っても同じ曲がり方になることがある、という「答えが一つに決まらない」面白さも示しています。", "unverified": "数値例の具体的な構造と計算時間は未確認（抄録のみ）。"}}, {"id": "pr07", "rank": 7, "headline": "合成データ増強が時系列予測を助ける条件を特定", "title": "When Does Synthetic Data Improve Time-Series Forecasting? Evidence on Data Scarcity, Predictability, and Temporal Structure", "url": "https://doi.org/10.2139/ssrn.7592571", "authors": "Kamil Topal", "venue": "SSRN", "date": "2026-10-10", "apa": "Topal, K. (2026). When Does Synthetic Data Improve Time-Series Forecasting? Evidence on Data Scarcity, Predictability, and Temporal Structure. https://doi.org/10.2139/ssrn.7592571", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN版は本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "時系列予測で合成データによる水増し（データ拡張）が効くのは、実データが本当に少ないときと、注入する時間構造が予測対象に有効なときに限られることを、大規模な比較実験で示した（抄録）。", "p2": "データが少ないとき合成データで補う手法が増えているが、精度を上げる場合と大きく下げる場合があり、どんな問題の性質が結果を分けるかが分かっていなかった（抄録）。", "p3": "予測可能性を制御した54本の合成時系列と4つの実データ領域で、複数の拡張手法（VAEによる生成器など）、3種の予測アーキテクチャ、3段階のデータ量を組み合わせ、固定した手順で12,294回の学習を行った。変えた要因は、学習データ量、対象系列の予測可能性、拡張が持ち込む時間構造、予測モデルの構造の4つ（抄録）。", "p4": "拡張なしとの予測精度の差を評価し、さらに本学習の前に有益な拡張設定を見分ける事前に定めた規則を、保留した評価データで拡張なしの戦略と比べた（抄録）。", "p5": "学習標本だけから学ぶ拡張は、データが乏しいときは精度を上げたが、実データが増えると効果が薄れ、全データでは消えるか逆転した。VAE生成器では、この劣化が54本すべての制御系列で同じ向きだった。構造を持ち込む拡張は、その構造が予測に有効なら長く効き、誤っていれば大きく悪化させた。事前の判定規則は拡張なしに対して実用的な改善を示さなかった（抄録）。", "p6": "判定規則が機能しなかったことから、予測可能性・データ量・情報源の単純な組合せでは拡張の可否を判断できない。解釈：実データ4領域の性質や、拡張手法の具体的な一覧は抄録からは分からない。", "fun": "練習問題が少ないとき、似た問題を自分で作って解くと上達します。でも本物の問題集が手に入れば、自作の問題はかえって邪魔になることがある。合成データも同じで、本物が少ないときだけ役立ち、しかも「見た目が似ているか」より「大事な規則性を含むか」が効き目を決めるという結果です。", "unverified": "精度の改善・悪化の数値と、実データ領域の内容は未確認（抄録のみ）。"}}, {"id": "pr08", "rank": 8, "headline": "業績が良い企業ほどMD&Aも注記も短い", "title": "Information Environment, Proprietary Costs, and Disclosure Content in Firm 10-K Reports", "url": "https://doi.org/10.2139/ssrn.7590365", "authors": "Ali C. Akyol ほか", "venue": "SSRN", "date": "2026-10-09", "apa": "Akyol, A. C., & Shekhar, C. (2026). Information Environment, Proprietary Costs, and Disclosure Content in Firm 10-K Reports. https://doi.org/10.2139/ssrn.7590365", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN版は本文を取得できず、Semantic Scholarに登録された抄録を使用", "preprint": true, "p1": "米国の年次報告書（10-K）で、規制の度合いが異なるMD&A（経営者による分析）と注記が、業績・情報需要・競争の下で補完的な開示チャネルとして使われていることを示した（抄録）。", "p2": "MD&Aと注記は規制の柔軟さが違うため、経営者の目的（情報提供と、競争上不利になる情報の秘匿）によって開示の内容が異なるのかは検証されていなかった（抄録）。", "p3": "10-KのMD&Aと注記のテキストの長さ・語の種類・語調を測り、企業の業績との関係を、情報需要と業界の競争（専有コスト）を制御して分析した（抄録）。", "p4": "開示の特徴と当期の業績、将来の業績・リターンとの関連を検証した。比較の基準は2つのチャネル間の違いである（抄録）。", "p5": "業績が良い企業ほどMD&Aも注記も短く、この関係は情報提供と専有コスト回避の目的を考慮しても両チャネルで一貫した。両者は似た種類の語と語調を使い、その特徴は将来の業績とリターンに関連した（抄録）。", "p6": "著者は、結果がテキスト分析できる提出書類に限られ、テキスト分析の方式に依存し、内生性の懸念がありうると認めている（抄録）。", "fun": "業績が悪い会社ほど説明が長くなる、というのは言い訳が長くなる人間の性質にも似ています。この研究では、規制の強い注記と自由度の高い経営者の説明の両方で同じ傾向が見られ、しかも文章の特徴が将来の株価の動きとも関係していました。文章の長さや言葉選びも立派な情報なのです。", "unverified": "標本期間と企業数、効果の大きさは未確認（抄録のみ）。"}}, {"id": "pr09", "rank": 9, "headline": "夜勤回数が多いNHS職員ほど孤独感が強い", "title": "Night-shift frequency and loneliness among NHS employees: a multi-site cross-sectional analysis of the INTERACT study", "url": "https://doi.org/10.21203/rs.3.rs-11051019/v1", "authors": "Austen El-Osta ほか", "venue": "Research Square (In Review)", "date": "2026-10-09", "apa": "El-Osta, A., Haoran, L., Altalib, S., Jerjes, W., Pattani, S., Majeed, A., & Klaber, B. (2026). Night-shift frequency and loneliness among NHS employees: a multi-site cross-sectional analysis of the INTERACT study. https://doi.org/10.21203/rs.3.rs-11051019/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research SquareのHTML本文（方法、結果、考察、強みと限界の節、表1〜4の題）を読んだ。査読中のプレプリント", "preprint": true, "p1": "英国NHS（国民保健サービス）の職員で、月あたりの夜勤回数が多いほど孤独感が高いという関連を、職種や勤務条件を調整したうえで示した（抄録、Results）。", "p2": "交代勤務は睡眠・疲労・心血管・精神的健康との関係はよく調べられてきたが、職業上の健康の結果として孤独を調べた研究は少なかった（Background）。", "p3": "INTERACT研究（イングランドの孤独の測定）の多施設オンライン調査の二次分析。月の夜勤回数を0、1〜2、3〜5、6回以上の4区分の順序変数とし、UCLA孤独尺度3項目版（UCLA-3、3〜9点）を主な結果とした。年齢・性別・施設・調査月・職種・部署・勤続・労働時間・残業・雇用形態を調整した線形回帰（HC3頑健標準誤差）で、夜勤区分が1段上がるごとの孤独得点の変化を推定した（Methods）。", "p4": "同意者904人のうち、全変数がそろった809人を分析した。副次的に、直接の孤独の質問とUCLA-3の順序ロジットで頑健性を確かめ、社会的充足・ワークライフバランス・情緒的疲弊などを係数の積とブートストラップ区間で探索的に検討した（Source population、Statistical analysis）。", "p5": "夜勤の区分の人数は535人（66.1%）、36人、101人、137人で、UCLA-3の平均は5.19、5.94、5.62、5.95だった。完全調整モデルで夜勤区分が1段上がるごとにUCLA-3が0.211点高かった（95%CI 0.055〜0.368、表3）。順序ロジットのOR 1.23、直接の質問のOR 1.16（95%CI 1.00〜1.35）と方向は一致した。探索的分析では社会的充足の低さとワークライフバランスの悪さが候補となった（表4）。", "p6": "横断研究で時間的な順序や因果は確定できず、逆の因果もありうる。志願者標本で代表性がなく、夜勤は自己申告の大まかな区分で、婚姻状況や子どもの有無などは調整していない。線形モデルの説明力はR²=0.079と小さい。順序モデルは比例オッズの仮定が棄却された（P=0.022）（Strengths and limitations）。", "fun": "夜勤が多いと、家族や友人が起きている時間に眠り、皆が寝ている時間に働くことになります。体内時計だけでなく「人と過ごす時間」もずれてしまうのです。孤独感の差は大きくありませんが、時間のずれが人のつながりを細くしていく、という見方はシフト勤務を考えるうえで新鮮です。", "unverified": "なし"}}, {"id": "pr10", "rank": 10, "headline": "独の行政チャットボット12種は市民間で公平", "title": "Equal to Citizens but Uneven across Systems: Auditing Impartiality and Responsiveness in 12 German Government Chatbots", "url": "https://doi.org/10.2139/ssrn.7588118", "authors": "Ming Ma ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Ma, M., & Eckhard, S. (2026). Equal to Citizens but Uneven across Systems: Auditing Impartiality and Responsiveness in 12 German Government Chatbots. https://doi.org/10.2139/ssrn.7588118", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRN版は本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "ドイツで運用中の自治体・ジョブセンターのLLMチャットボット12種を事前登録の監査で調べ、利用者の性別・国籍が違ってもほぼ同等に答える一方、システム間の差が大きいことを示した（抄録）。", "p2": "行政のLLMチャットボットは24時間の効率的な対応を約束するが、アルゴリズムの偏りや硬直的な出力の恐れがあり、市民に対して平等（equal）かつ公正（equitable）かを確かめる枠組みがなかった（抄録）。", "p3": "実質的な2次元（回答の妥当性、情報の範囲）と言語的な2次元（感情の調子、言語の複雑さ）からなる評価枠組みを作り、同じ質問内容のまま、性別・国籍・やさしい言葉の要望を操作したペルソナで問い合わせた（抄録）。", "p4": "16,921件の回答を4次元で評価し、ペルソナ間の差（平等さ）と、やさしい言葉の要望への応答（応答性）を検定した（抄録）。", "p5": "チャットボットはペルソナ間でほぼ平等で、要望されると言語の複雑さを有意に下げた。一方で回答はシステム間で大きく異なり、委託先・技術・地域ごとの調整といった制度的な違いが、新たなアルゴリズムの不平等の源になりうる（抄録）。", "p6": "12システム・ドイツ語圏の行政に限られる。解釈：システム間の差の原因（委託先や技術）を個別に識別できているかは抄録からは分からない。", "fun": "役所のAIチャットに、名前や国籍を変えて同じ質問をしても、ほぼ同じように答えてくれました。ところが、どの町のAIに聞くかで答えの質は大きく違いました。差別は「誰が聞くか」ではなく「どこに住んでいるか」から生まれるかもしれない、という新しい視点です。", "unverified": "各次元の評価方法の詳細と差の大きさは未確認（抄録のみ）。"}}, {"id": "pr11", "rank": 11, "headline": "多重スケール拡散の拡散係数をp変動で推定", "title": "Coarse-grained modeling of multiscale diffusions : the p-variation estimates", "url": "https://doi.org/10.82444/warw.33597649", "authors": "Anastasia Papavasiliou", "venue": "University of Warwick", "date": "2026-10-09", "apa": "Papavasiliou, A. (2010). Coarse-grained modeling of multiscale diffusions : the p-variation estimates (Version 1). University of Warwick. https://doi.org/10.82444/WARW.33597649", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "University of Warwickのリポジトリ登録の抄録を使用（既発表論文の登録の可能性）", "preprint": false, "p1": "速い変数と遅い変数が混ざった多重スケール拡散のデータから、粗視化した極限方程式の拡散係数を、データの間引きなしに推定する方法（総p変動を使う）を提案した（抄録）。", "p2": "平均化の場合は極限方程式の最尤推定量が漸近的に一致するが、均質化の場合はデータを間引かないと一致しないことが知られていた。間引きの間隔をどう選ぶかが実務上の難点だった（抄録）。", "p3": "まず極限方程式の最尤推定に関する最近の結果を整理し、次にLyons and Qian（2002）の定義による総p変動を用いて、多重スケール系の経路から直接、拡散係数を推定する。背景：p変動は経路の細かな揺れの大きさを測る量で、速い揺れの寄与を間引きせずに扱える（抄録）。", "p4": "方法を多重スケールのオルンシュタイン＝ウーレンベック（OU）過程に適用した。評価指標の詳細は抄録に記載がない（抄録）。", "p5": "総p変動による推定は、均質化の場合に必要だった間引きの段階を避けられることを示した（抄録）。", "p6": "適用例は多重スケールOU過程のみで、非線形の系や高次元への拡張は抄録からは分からない。数値的な精度の比較も抄録には示されていない。", "fun": "細かく速い揺れと、ゆっくりした大きな流れが混ざった動きから、「ゆっくりした流れ」だけの法則を取り出したい。データを細かく取りすぎると速い揺れに惑わされるので、従来は間引きが必要でした。この研究は、揺れの大きさを測る別の物差しを使って、その手間を省く道を示しています。", "unverified": "推定精度の数値は未確認（抄録のみ）。"}}, {"id": "pr12", "rank": 12, "headline": "市民のごみ通報をマルチモーダルLLMで審査", "title": "Automated Analysis of Crowdsourced Reports with Multimodal LLM Workflows: The Case of Citizen-Driven Waste Reporting", "url": "https://doi.org/10.2139/ssrn.7593272", "authors": "Maria Teresa Rossi ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Rossi, M. T., FEDELI, A., Iovino, L., Di Salle, A., & Mariani, L. (2026). Automated Analysis of Crowdsourced Reports with Multimodal LLM Workflows: The Case of Citizen-Driven Waste Reporting. https://doi.org/10.2139/ssrn.7593272", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRN版は本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "市民がごみの不法投棄などを写真付きで通報するクラウドソーシングで、マルチモーダルLLMのワークフローが人による審査をどこまで支援・部分的に自動化できるかを、実データで検証した（抄録）。", "p2": "投稿の検証、品質評価、重複検出、ゲーミフィケーションの報酬付与は人が確認する（HITL）ことが多く、投稿が増えると人手の審査が処理の詰まりになる。運営資源の限られた市民通報では特に深刻である（抄録）。", "p3": "COBOLプロジェクトで、LLaVAとQwen2.5-VLを用い、LLMのみのゼロショット・少数例と、検索拡張生成（RAG）のゼロショットを組み合わせた6つの構成を作った。正しい・意図的に誤らせた・省いた構造化メタデータ（ごみの種類と大きさ）を入力条件として変えた（抄録）。", "p4": "実際の通報309件で、属性評価の精度、検索を使った重複検出、実行時間、一部の属性だけを自動処理する選択的な方針を評価した。比較の基準は人による正解作成時の判定と所要時間（抄録）。", "p5": "性能は属性・構成・入力条件で大きく異なった。種類と大きさの値を省くと多くの構成で精度が大きく落ち、誤った値を与えると多くで精度が下がったが、LLaVAのLLMのみの2構成では種類の精度が上がった（誤り訂正の証拠ではない）。重複検出の適合率は低く、実行時間は人の審査よりかなり短かった（抄録）。", "p6": "著者は、完全な通報の自律処理の信頼性は示されていないとし、プライバシーの確認、重複の扱い、選択的処理の方針の前向き検証、人の作業負荷の実際の削減は今後の課題とする（抄録）。", "fun": "「ここにごみが捨てられています」という市民の写真付き通報を、AIが代わりに確認できれば、少ない職員でも町をきれいに保てます。ただ、通報者が付けた「ごみの種類」の情報を消すとAIの精度は大きく落ちました。AIは写真だけでなく、人が添えた言葉にかなり頼っていたのです。", "unverified": "各構成の精度と実行時間の具体的な数値は未確認（抄録のみ）。"}}, {"id": "pr13", "rank": 13, "headline": "顧客データの非対称な利用と価格差別の均衡", "title": "Price Discrimination Under Asymmetric Access to Consumer Data", "url": "https://doi.org/10.2139/ssrn.7593241", "authors": "Ioana Chioveanu", "venue": "SSRN", "date": "2026-10-10", "apa": "Chioveanu, I. (2026). Price Discrimination Under Asymmetric Access to Consumer Data. https://doi.org/10.2139/ssrn.7593241", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRN版は本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "プラットフォーム系列の小売業者と第三者の出品者が2期にわたって価格競争するモデルで、顧客データへのアクセスの差が、売り手の利益と消費者の厚生にどう影響するかを理論的に示した（抄録）。", "p2": "プラットフォームは自社系列の店に顧客データの優位を与えうる。データへのアクセスを平等にする規制が誰に得か損かは、価格差別を通じた競争の変化を考えないと分からない（抄録）。", "p3": "第2期には、第1期のデータから消費者がどの売り手を検討したかが分かり、それに応じた価格差別ができる。系列小売は情報の優位を持つ。解釈：第1期のデータが、他の売り手と競合する客とそうでない客に市場を分け（競合可能性による分割）、価格競争を和らげる仕組み（抄録）。", "p4": "データアクセスの配分（系列のみ、各自が自社データ、市場全体のデータ）ごとの均衡利潤と消費者厚生を、一律価格の場合と比べた。検討の対象を内生化したモデルでも頑健性を確かめた（抄録）。", "p5": "良いデータへのアクセスで、系列と第三者の均衡利潤は連動し決して下がらないが、業界の利得は消費者の損になる。系列に自社データを独占させると一律価格よりすべての売り手が得をし、各自に自社データを平等に与えても系列は損をせず競合は得をする。市場全体のデータのアクセスを平等にしても影響はない（抄録）。", "p6": "理論モデルで実証はない。2期・特定の検討構造の仮定に依存する。解釈：データ共有の規制が消費者を守るとは限らないという含意は、モデルの仮定のもとでの結論である。", "fun": "「データを皆で平等に使えるようにすれば公平になる」と考えがちですが、この理論では、売り手たちがデータで客を細かく分けると、互いの値下げ競争が弱まり、得をするのは売り手、損をするのは消費者でした。データの平等が消費者の味方になるとは限らない、という意外な結論です。", "unverified": "なし"}}, {"id": "pr14", "rank": 14, "headline": "連続地震後の電柱-電線系の損傷をベイズ更新", "title": "Bayesian Updating of Pole-Cable Systems for Damage Quantification after Sequential Extreme Events", "url": "https://doi.org/10.31224/8402", "authors": "Prateek Arora ほか", "venue": "engrXiv", "date": "2026-10-10", "apa": "Arora, P., Ceferino, L., Wang, Z., & Lindsey, M. (2026). Bayesian Updating of Pole-Cable Systems for Damage Quantification after Sequential Extreme Events. https://doi.org/10.31224/8402", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "engrXiv版は本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "本震と余震が続く地震のたびに、電柱とケーブルが連結した系の非線形な構造特性を時刻歴応答からベイズ更新し、電柱ごとの損傷状態を追跡する枠組みを示した（抄録）。", "p2": "強い地震は配電設備を損傷させ、長い停電と困難な復旧を招く。連続する地震では損傷評価と補修を繰り返す必要があり、物理モデルと監視を結びつけた実時間の道具が求められていた（抄録）。", "p3": "材料と幾何の非線形と、連続地震での進行的な損傷を再現するケーブル連結電柱系の高精度な有限要素モデルを作り、各地震後に記録した時刻歴データで非線形パラメータを逐次ベイズ推定する。エネルギーに基づく対数尤度関数を導入し、複雑な多次元空間での探索と混合を良くするためTeleport MCMCを使う（抄録）。", "p4": "中間の補修のない一連の地震で手法を実演し、補修を要する電柱の強度低下を追跡した。比較対象や精度の指標は抄録に記載がない（抄録）。", "p5": "枠組みは、連続地震の間に個々の電柱の損傷状態を実時間で示し、点検と補修の優先順位づけを支えうることを示した（抄録）。", "p6": "実演は数値の地震列によるもので、実際の計測データでの検証は抄録からは分からない。計測点の数や雑音への感度、計算時間も未確認。", "fun": "大きな地震のあと、余震が来るたびに「どの電柱が危ないか」を知りたい。揺れの記録を使って電柱の強さの推定を少しずつ書き換えていくのが、この研究のやり方です。天気予報が新しい観測で予報を更新するように、建物や設備の「健康状態」を更新していく発想です。", "unverified": "数値例の規模と推定精度は未確認（抄録のみ）。"}}, {"id": "pr15", "rank": 15, "headline": "本文を読まずに組織の働き方を照会するモデル", "title": "Organizational World Models: Querying How Organizations Work Without Reading Workplace Content", "url": "https://doi.org/10.2139/ssrn.7590758", "authors": "Yumi W. Kimura ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Kimura, Y. W., & Willems, J. (2026). Organizational World Models: Querying How Organizations Work Without Reading Workplace Content. https://doi.org/10.2139/ssrn.7590758", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRN版は本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "メッセージ本文・会議記録・文書を読まずに、構造化された記録だけから「組織の中で仕事がどう回っているか」（誰が誰に頼り、どの知識源を使うか）を照会できる組織世界モデル（OWFM）の試作を示した（抄録）。", "p2": "プロジェクトの調整や引き継ぎには、職務分掌を超えた実際の依存関係の理解が必要だが、それを知るには通常、職場の内容を読む必要があり、プライバシーと両立しにくい（抄録）。", "p3": "専用の推定器、共有の人員状態（personnel state）、別途事前学習したTransformerを組み合わせる。Transformerはラベル付きの参照例で7つの関連する予測対象に固定重みのまま対応する（抄録）。", "p4": "合成データの課題でツールを使う言語エージェント（GPT-6 Astra、Claude Fableなど）と比べ、2つの独立した合成コホートと、模擬的な退職の場面、1社の実際のカレンダー記録で評価した（抄録）。", "p5": "専用推定器は言語エージェントに匹敵する予測精度を示し、人員状態は9種の照会を支え4つの調整予測を改善した。模擬退職では助けの依頼の移り先を記録ベースの全比較法より正確に予測し、実際のカレンダーでは将来の会議参加の予測を前期間の基準より改善した（抄録）。", "p6": "検証の多くは合成データで、実データは1社のカレンダー記録に限られる。解釈：本文を読まないとはいえ、メタデータから人間関係を推定すること自体の倫理的な扱いは、抄録からは検討の範囲が分からない。", "fun": "会社の中で本当に頼りにされているのは、組織図の上の人ではなく「あの人に聞けば分かる」という人かもしれません。メールの中身を読まずに、誰が誰と会い、どの資料を使っているかという記録だけから、そうした見えない頼り合いの地図を作ろうという試みです。", "unverified": "予測精度の具体的な数値は未確認（抄録のみ）。"}}, {"id": "pr16", "rank": 16, "headline": "GAAPと税法の裁量差が生む税会計差異", "title": "The Accounting Discretion: GAAP versus IRS Treatment of Deferred Tax Accounting Items", "url": "https://doi.org/10.2139/ssrn.7586118", "authors": "Sina Rahiminejad ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Rahiminejad, S., & Anderson, M. (2026). The Accounting Discretion: GAAP versus IRS Treatment of Deferred Tax Accounting Items. https://doi.org/10.2139/ssrn.7586118", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録の抄録を使用", "preprint": true, "short": true, "p1": "米国の会計基準（GAAP）と税法（IRC）で、繰延税金の項目ごとにどれだけ判断の余地（裁量）が違うかを整理し、会計と税の差異（BTD）が生まれる理由を示した（抄録）。", "p3": "分類・時期・評価・見積り・方針選択・重要性・開示の7次元の裁量の枠組みで、繰延税金の58項目を法制度の面から比較した（抄録）。", "p5": "GAAPは見積りと評価で裁量が体系的に大きく、税法は条文・規則・判例で裁量を抑えていると結論し、セーフハーバーの拡大やASC 740の開示強化を提案する（抄録）。", "fun": "同じ会社の同じ1年でも、株主向けの利益と税務署向けの所得は一致しません。会計は「実態をよく表す」ために判断を許し、税は「公平に取り立てる」ためにルールで縛るからです。目的が違えば同じ数字の作り方が変わる、という会計の性格がよく見える題材です。", "unverified": "58項目の具体的な一覧と各次元の評価方法は未確認（抄録のみ）。"}}, {"id": "pr17", "rank": 17, "headline": "不確実性を分解できるDeepONetでベイズ較正", "title": "A Deep Operator Network with Decomposable Uncertainty for Bayesian Calibration of Time-Dependent Models", "url": "https://doi.org/10.2139/ssrn.7592542", "authors": "Qingwen Xiong ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Xiong, Q., Yuan, X., Zhang, B., Zhang, S., Mao, Z., & Zhou, J. (2026). A Deep Operator Network with Decomposable Uncertainty for Bayesian Calibration of Time-Dependent Models. https://doi.org/10.2139/ssrn.7592542", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録の抄録を使用", "preprint": true, "short": true, "p1": "高価なシミュレーションのベイズ較正を、自分の不確実性を分けて表せる代理モデル（DeepONet）で安く行う方法を示した（抄録）。", "p3": "パラメータから時間応答への写像をDeepONetで学び、時間相関と不均一分散のある偶然的不確実性を確率微分方程式の残差で、認識的不確実性を重みの事後分布で表して、予測分散を解析的に分解する（抄録）。", "p5": "原子炉の対向流制限モデルでの検証で、演算子構造と確率的残差の両方が必要と分かり、名目に近い被覆率を得た。NUTSに組み込んだ較正では実験データを最も狭い帯で包んだ（抄録）。", "fun": "コンピュータの代役（代理モデル）に計算を任せると速くなりますが、代役自身の「自信のなさ」を無視すると、答えを過信してしまいます。この論文は、データのばらつきと代役の知識不足を別々の箱に入れて数えることで、信頼できる幅を出そうとしています。", "unverified": "被覆率や比較手法の具体的な数値は未確認（抄録のみ）。"}}, {"id": "pr18", "rank": 18, "headline": "物理ラベル付きプロンプトでLLMが模擬器を較正", "title": "When is a large language model a good calibration agent? Physics-labeled prompting for budgeted engineering simulator calibration", "url": "https://doi.org/10.2139/ssrn.7592694", "authors": "Ruo-Qian Wang", "venue": "SSRN", "date": "2026-10-10", "apa": "Wang, R.-Q. (2026). When is a large language model a good calibration agent? Physics-labeled prompting for budgeted engineering simulator calibration. https://doi.org/10.2139/ssrn.7592694", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録の抄録を使用", "preprint": true, "short": true, "p1": "物理的な誤差の説明を添えてLLMにパラメータ更新を提案させると、少ない試行回数で工学シミュレータを較正できる場面があることを示した（抄録）。", "p3": "円柱後流のLESと減衰振動子の逆問題で、物理ラベル付きプロンプトを4種の文面操作と、Nelder–Mead・ベイズ最適化・CMA-ES・ランダム探索と比べた（抄録）。", "p5": "最初の提案は25試行中23で初期設計を改善し、5回評価後の誤差中央値は物理情報なしの21.9分の1だったが、優位は15回で消えた。LLMを初期値に使い従来法へ引き継ぐ2段階方式は9回で目標精度に達した（抄録）。", "fun": "LLMは「物理のことば」で誤差を説明されると、最初の数手は名人のように良い手を指します。ところが長期戦になると従来の最適化法に追いつかれます。最初はLLM、後は計算機の地道な探索、というリレーが一番速いという結果は、人と道具の分業にも似ています。", "unverified": "各手法の試行ごとのばらつきの詳細は未確認（抄録のみ）。"}}, {"id": "pr19", "rank": 19, "headline": "目的が食い違う多エージェントで安全策が劣化", "title": "Quantifying Safety Guardrail Degradation in Autonomous Multi-Agent Workflows Under Goal-Divergence Scenarios", "url": "https://doi.org/10.5281/zenodo.23268413", "authors": "Muhammad Talha Waris", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-10-09", "apa": "Waris, M. T. (2026). Quantifying Safety Guardrail Degradation in Autonomous Multi-Agent Workflows Under Goal-Divergence Scenarios. Zenodo. https://doi.org/10.5281/ZENODO.23268413", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodo登録のOpenAlex抄録を使用。審査のない置き場の文書", "preprint": true, "short": true, "p1": "目的が食い違う状況で、多エージェントLLMの安全策（ガードレール）がどれだけ破られるかを測り、決定論的なフィルタが有効だと示した（抄録）。", "p3": "システムプロンプトの上書き、道具の悪用、停止の拒否、長い文脈での劣化の4つの失敗型にわたる20の場面で、防御なし・プロンプトのみ・プロンプトと構文木・正規表現フィルタの二重防御を比較した（抄録）。", "p5": "180の評価で、防御なしの安全失敗率は平均65.0%、文脈の劣化では93.3%だった。二重防御は実行前に100%遮断し、制約整合指数は70.0%だった（抄録）。", "fun": "AIに「やってはいけない」と言い聞かせるだけでは、急ぎの仕事を任されると約束を忘れてしまうことがあります。この研究は、言葉の約束より、危ない命令を機械的に止める関所を外に置くほうが確実だと示しています。人の組織の内部統制と同じ発想です。", "unverified": "評価したモデルの名前と場面ごとの内訳は未確認（抄録のみ）。"}}, {"id": "pr20", "rank": 20, "headline": "人とAIの協調で管理者の動的能力を再構成", "title": "Reconfiguring Managerial Dynamic Capabilities through Human-AI Orchestration: Distributed Cognition and the Algorithmic Dependence Paradox", "url": "https://doi.org/10.2139/ssrn.7593155", "authors": "Vera Ndrecaj", "venue": "SSRN", "date": "2026-10-10", "apa": "Ndrecaj, V. (2026). Reconfiguring Managerial Dynamic Capabilities through Human-AI Orchestration: Distributed Cognition and the Algorithmic Dependence Paradox. https://doi.org/10.2139/ssrn.7593155", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録の抄録を使用（概念論文）", "preprint": true, "short": true, "p1": "AIが経営者の動的能力（感知・捕捉・変革）をどう組み替えるかを、人とAIに分散した認知として理論化した概念論文（抄録）。", "p3": "動的能力論、経営者認知、分散認知、人とAIの協働、アルゴリズム管理を統合し、3つの仕組みと1つの命題を立てた（抄録）。", "p5": "AIは感知を拡張し、捕捉の分析を部分的に代替し、変革を支えるが、AIへの関与が過ぎると学習と統制が弱まる逆U字の「アルゴリズム依存のパラドックス」を提案する（抄録）。", "fun": "カーナビに頼りすぎると道を覚えなくなるように、経営判断をAIに任せすぎると、経営者が状況を読み解く力が育たなくなるかもしれません。この論文は「ほどほどが一番」という直観を、AIの関与と組織の適応力の山なりの関係として整理しています。", "unverified": "命題の実証はなし（概念論文）。"}}, {"id": "pr21", "rank": 21, "headline": "凸最適化でブロードバンド料金支援を設計", "title": "From Measurement to Policy Design: A Convex Optimization Framework for Broadband Affordability", "url": "https://doi.org/10.2139/ssrn.7590899", "authors": "Laasya Koduru ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Koduru, L., Allmann, K., Narechania, T. N., Belding, E., & Gupta, A. (2026). From Measurement to Policy Design: A Convex Optimization Framework for Broadband Affordability. https://doi.org/10.2139/ssrn.7590899", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録の抄録を使用", "preprint": true, "short": true, "p1": "ブロードバンドの「払える料金」政策を、負担の上限・小売価格・補助予算の3つの制約の組合せとして一度に設計できる枠組み（TPS）を示した（抄録）。", "p3": "3制約の関係を制約付き最適化として定式化し、米国コミュニティ調査（ACS）の世帯所得推計を使って国勢調査ブロックグループ単位で負担可能性を計算する（抄録）。", "p5": "2つの制約を決めれば残り1つが決まる関係を示し、ある地域で実行可能な政策の組合せ全体を描けるようにした（抄録）。", "fun": "回線が家の前まで来ても、料金が払えなければ使えません。「収入の何%まで」「料金はいくら」「補助はいくら」の3つは、どれか2つを決めると残りが決まる三すくみです。別々に議論されがちな3つを一枚の地図に載せるという発想の転換が面白い点です。", "unverified": "具体的な地域での計算結果は未確認（抄録のみ）。"}}, {"id": "pr22", "rank": 22, "headline": "費用モデルでインフラ維持管理戦略を最適化", "title": "Maintenance strategy optimisation for infrastructure assets through cost modelling", "url": "https://doi.org/10.82444/warw.33632587", "authors": "Wenjuan Zhang ほか", "venue": "University of Warwick", "date": "2026-10-09", "apa": "Zhang, W., Wang, W., & Gang, Y. (2013). Maintenance strategy optimisation for infrastructure assets through cost modelling (Version 1). University of Warwick. https://doi.org/10.82444/WARW.33632587", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "University of Warwickのリポジトリ登録の抄録を使用（既発表論文の登録の可能性）", "preprint": false, "short": true, "p1": "データが少ない段階でも、専門家の知識と少数の試料を組み合わせて、インフラ資産の維持管理戦略を費用モデルで最適化できることを示した（抄録）。", "p3": "線形ベイズ法で、専門家の主観的な知識と少数の資産から集めたデータを結合し、費用モデルの未知パラメータを推定する（抄録）。", "p5": "鉄道会社の橋の鋼製桁を事例に、推定したパラメータのもとでシミュレーションにより最適な維持管理戦略を求めた（抄録）。", "fun": "データがそろうまで待っていたら、橋の補修計画はいつまでも立てられません。そこで「ベテランの勘」も一つのデータとして数式に入れ、少しの実測で修正していきます。経験と測定を足し算する考え方は、天気予報や医療の判断にも通じます。", "unverified": "最適戦略の具体的な結果は未確認（抄録のみ）。"}}, {"id": "pr23", "rank": 23, "headline": "ケニアの若者は社会関係資本を心の資源と捉える", "title": "Exploring Kenyan adolescents’ perceptions of social capital as a resource for mental health", "url": "https://doi.org/10.21203/rs.3.rs-10820926/v1", "authors": "Kennedy Ouma Sigodo", "venue": "Research Square (In Review)", "date": "2026-10-09", "apa": "Sigodo, K. O. (2026). Exploring Kenyan adolescents’ perceptions of social capital as a resource for mental health. https://doi.org/10.21203/rs.3.rs-10820926/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用（査読中）", "preprint": true, "short": true, "p1": "ケニアの低資源の都市地域の10代が、人間関係（社会関係資本）を心の健康の資源としてどう捉え使っているかを描いた（抄録）。", "p3": "13〜19歳の15人への半構造化面接（英語とスワヒリ語）を主題分析した（抄録）。", "p5": "関係づくり、社会関係資本と心の健康、関係を機能させること、の3主題が見いだされた。支えは自己肯定感や情緒的支援をもたらす一方、排除や経済格差、負担の重い義務は害になりうる（抄録）。", "fun": "友達が多ければ心が元気、とは限りません。10代の若者たちは、悩みの種類ごとに相談相手を使い分け、信頼や相互の助け合いを大事にしていました。人間関係は資源でもあり重荷でもある、という両面をよく表した研究です。", "unverified": "なし"}}, {"id": "pr24", "rank": 24, "headline": "確率的ストークス力下のビーズ-ばね対の幾何エルゴード性", "title": "Geometric erogdicity of a bead-spring pair with stochastic Stokes forcing", "url": "https://doi.org/10.82444/warw.33598033", "authors": "Jonathan C. Mattingly ほか", "venue": "University of Warwick", "date": "2026-10-09", "apa": "Mattingly, J. C., McKinley, S. A., & Pillai, N. S. (2009). Geometric erogdicity of a bead-spring pair with stochastic Stokes forcing (Version 1). University of Warwick. https://doi.org/10.82444/WARW.33598033", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "University of Warwickのリポジトリ登録の抄録を使用（既発表論文の登録の可能性）", "preprint": false, "short": true, "p1": "確率的なストークス流れに流されながら非線形ばねでつながる2粒子（希薄溶液中の高分子の簡易モデル）が、幾何エルゴード性（指数的に平衡分布へ収束する性質）を持つことを証明した（抄録）。", "p3": "制御理論の議論、リャプノフ関数、準楕円拡散の理論を組み合わせ、ハリス連鎖の議論で指数収束を示す。仮定が破れる位相空間の「悪い」集合を、制御可能な確率で抜け出せるものとして除外する（抄録）。", "p5": "線形ばねや時間的に白色な流速場という従来の仮定を一般化し、レナード＝ジョーンズ型のような特異なドリフトも扱えるようにした（抄録）。", "fun": "水の中で揺れる2つの玉をばねでつないだだけの模型でも、「十分長く待てば、いつも同じ統計的な落ち着き方をするか」を証明するのは難しい問題です。玉同士が近づきすぎると力が無限大に近づく場合も、そこから確率的に抜け出せることを使って証明を通した点が新しいところです。", "unverified": "収束の速さの具体的な評価は未確認（抄録のみ）。"}}, {"id": "pr25", "rank": 25, "headline": "POD縮約の混合仮想要素法でPNP方程式を解く", "title": "Reduced-order mixed virtual element method based on POD for the PNP equations", "url": "https://doi.org/10.2139/ssrn.7592594", "authors": "Wenwen Xu ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Xu, W., Tan, Y., & Li, X. (2026). Reduced-order mixed virtual element method based on POD for the PNP equations. https://doi.org/10.2139/ssrn.7592594", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録の抄録を使用", "preprint": true, "short": true, "p1": "イオンの濃度と電位が連成するPoisson–Nernst–Planck（PNP）方程式を、任意の多角形メッシュで解ける混合仮想要素法と、POD（固有直交分解）による縮約で速く解く方法を示した（抄録）。", "p3": "時間は後退オイラー法、空間は混合仮想要素法で離散化し、補助変数・電位・濃度の最適なL²誤差評価を導く。そのうえでPODで縮約したスキームを作る（抄録）。", "p5": "数値実験で、縮約スキームは元の精度と最適な収束次数を保ち、最大10.56倍の高速化を得た（抄録）。", "fun": "細かい網目で計算すると正確でも時間がかかります。PODは、計算結果の中から「よく出てくる形」だけを取り出して、少ない部品で答えを組み立てる方法です。写真を少ない成分で圧縮するのと似た考えで、精度を落とさずに10倍ほど速くなったという点が見どころです。", "unverified": "数値実験の問題設定（次元・メッシュ）は未確認（抄録のみ）。"}}, {"id": "pr26", "rank": 26, "headline": "モード依存のマイクロポーラ位相場で熱破壊", "title": "Mode-dependent micropolar phase-field model for thermo-mechanical brittle fracture", "url": "https://doi.org/10.2139/ssrn.7590045", "authors": "Soumyajit Ghosh ほか", "venue": "SSRN", "date": "2026-10-09", "apa": "Ghosh, S., Unnikrishna Pillai, A., Venkatachari, S., & Rahaman, M. M. (2026). Mode-dependent micropolar phase-field model for thermo-mechanical brittle fracture. https://doi.org/10.2139/ssrn.7590045", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録の抄録を使用", "preprint": true, "short": true, "p1": "熱と力が同時にかかる脆性材料の破壊を、微細構造の長さスケールを入れたマイクロポーラ理論の位相場モデルで扱い、混合モードの亀裂進展と寸法効果を再現できるようにした（抄録）。", "p3": "熱力学的な整合性を保ち、位相場の長さスケールに全体応答が依存しないモデルを作り、オープンソースのJulia有限要素ライブラリGridapで実装した（抄録）。", "p5": "実験と比べて長い亀裂の本数と経路がよく一致した。熱と力の複合荷重では従来の定式化より早く破壊し、マイクロポーラ性と特性長が大きいほど寸法効果が強まった（抄録）。", "fun": "熱いコップに冷たい水を注ぐと割れることがあるように、温度のむらは材料の中に力を生みます。さらに材料の中の小さな傷や粒の大きさが、ひびの曲がり方を変えます。小さな構造の「長さ」を式に入れることで、大きさによって割れ方が変わる現象まで説明しようとしています。", "unverified": "比較した実験の材料と定量的な一致度は未確認（抄録のみ）。"}}, {"id": "pr27", "rank": 27, "headline": "不確実な地すべり津波と避難ABMをWebで結合", "title": "TsunaWAVE: coupling uncertain landslide-generated tsunami scenarios with agent-based evacuation modelling through an interactive web platform. Application to Mamoudzou (Mayotte, France)", "url": "https://doi.org/10.2139/ssrn.7593147", "authors": "Noé Carles ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Carles, N., Leone, F., Gherardi, M., Chapuis, K., Péroche, M., Moatty, A., Goasdoué, N., Le Friant, A., Mangeney, A., Komorowski, J.-C., Marboeuf, A., Pedreros, R., & Lemoine, A. (2026). TsunaWAVE: coupling uncertain landslide-generated tsunami scenarios with agent-based evacuation modelling through an interactive web platform. Application to Mamoudzou (Mayotte, France). https://doi.org/10.2139/ssrn.7593147", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録の抄録を使用", "preprint": true, "short": true, "p1": "海底地すべりによる津波の到達時間の不確実なシナリオと、歩行者避難のエージェントベースモデルを結び、自治体が試せるWebツール（TsunaWAVE）にした（抄録）。", "p3": "代理モデルが出す第1波の到達時間を持ち時間とし、事前計算した避難結果を読む一方向の結合。仏マヨット島マムズの海岸で、ドローン画像等で数えた759人を対象に、90シナリオを各42回繰り返した（抄録）。", "p5": "猶予は10〜16分で、警報の信頼性が最も効いた。警報が劣化し模倣がない10分の場合、安全域に着くのは8%未満。近所の模倣は警報の代わりにはならないが、16分では到達割合を19.4%から43.8%に上げた（抄録）。", "fun": "津波から逃げられるかは、波の速さだけでなく「警報が届くか」「隣の人が逃げるのを見て自分も動くか」で決まります。この研究では、隣人のまねは警報の代わりにはならないものの、時間があれば助かる人を倍以上にしました。人のふるまいが防災の大事な部品だと分かります。", "unverified": "シナリオごとの詳細な結果は未確認（抄録のみ）。"}}, {"id": "pr28", "rank": 28, "headline": "ソ連の管理者はなぜ会計を偽ったか", "title": "Forging success : Soviet managers and accounting fraud, 1943 to 1962", "url": "https://doi.org/10.82444/warw.33632161", "authors": "Mark Harrison", "venue": "University of Warwick", "date": "2026-10-09", "apa": "Harrison, M. (2010). Forging success : Soviet managers and accounting fraud, 1943 to 1962 (Version 1). University of Warwick. https://doi.org/10.82444/WARW.33632161", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "University of Warwickのリポジトリ登録の抄録を使用（旧稿の登録）", "preprint": false, "short": true, "p1": "1943〜1962年のソ連で、目標達成を迫られた企業管理者がどれだけ生産額を偽って報告し、それがどう処罰されたかを新しい史料で示した（抄録）。", "p3": "会計不正の性質と規模、共謀ネットワークの規模、当局の処罰の意思と寛容を生んだ政治・社会的要因を史料から分析した（抄録）。", "p5": "生産額の虚偽計上は一部の部門と時期で広く見られ、多くが共謀を伴っていた。政治的な評価をめぐる競争が社会主義経済の非効率を生んだと論じる（抄録）。", "fun": "「ノルマ達成」が何より大事な社会では、正直さも一つの調整項目になってしまいます。しかも不正は一人ではできず、仲間を巻き込む必要がありました。何人で組むのが「最適」かまで考えられていたという話は、目標管理のゆがみを考える歴史の教材になります。", "unverified": "不正の規模の具体的な数値は未確認（抄録のみ）。"}}, {"id": "pr29", "rank": 29, "headline": "イタリア小企業融資の情報の非対称と不完全競争", "title": "Asymmetric information and imperfect competition in the loan market", "url": "https://doi.org/10.82444/warw.33637174", "authors": "Gregory S. Crawford ほか", "venue": "University of Warwick", "date": "2026-10-09", "apa": "Crawford, G. S., Pavanini, N., & Schivardi, F. (2013). Asymmetric information and imperfect competition in the loan market (Version 1). University of Warwick. https://doi.org/10.82444/WARW.33637174", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "University of Warwickのリポジトリ登録の抄録を使用（旧稿の登録）", "preprint": false, "short": true, "p1": "イタリアの小企業向け融資枠のデータで、企業だけが知るリスク（情報の非対称）が金利・融資・厚生にどんな影響を与えるかを測った（抄録）。", "p3": "企業の無作為標本、中大規模の全銀行、個々の融資枠とその後の債務不履行の独自データで、Stiglitz–Weiss（1981）に基づく需要・価格・利用・債務不履行のモデルを推定した（抄録）。", "p5": "暫定的な結果として情報の非対称の証拠を得て、逆選択とモラルハザードを分けて識別した。不完全競争がその影響を媒介する役割も定量化する（抄録）。", "fun": "銀行が金利を上げると、危ない事業を抱える会社ほど「それでも借りたい」と集まってくるかもしれません。これが逆選択です。借りた後に無理をするのがモラルハザード。似て見える2つを実際の融資と倒産のデータで分けて測ろうとする点が、この研究の挑戦です。", "unverified": "推定結果の数値は未確認（抄録のみ、暫定結果）。"}}, {"id": "pr30", "rank": 30, "headline": "汎用LLMは追加学習なしで人並みの作文講評か", "title": "Can Large Language Models deliver human-equivalent essay feedback without prompt-specific pre-training?", "url": "https://doi.org/10.5287/ora-pdgy6dgxv", "authors": "Ratner ほか", "venue": "Oxford University Research Archive", "date": "2026-10-09", "apa": "Ratner, S., Cooney, G., & Lynch, M. (2026). Can Large Language Models deliver human-equivalent essay feedback without prompt-specific pre-training? University of Oxford. https://doi.org/10.5287/ORA-PDGY6DGXV", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Oxford University Research Archiveの登録の抄録を使用", "preprint": false, "short": true, "p1": "課題ごとの追加学習なしに、プロンプトと既存の評価基準（ルーブリック）だけで、汎用LLMが人並みの作文採点と講評をできることを示した（抄録）。", "p3": "4段階の改良で17,000本の生徒作文を使い、QWK、ICC、RMSEで人の採点との一致を評価した（抄録）。", "p5": "標準モデルは不安定さから平均的な採点者の水準まで改善し、上位モデルは専門家水準の一致を安定して示した。理解や詳述など高次の観点でも良好だった（抄録）。", "fun": "作文の採点は、文法だけでなく「よく考えて書けているか」を見るので、機械には難しいとされてきました。この研究では、採点の基準表を丁寧に渡すだけで、AIが先生と同じくらい一致した点をつけられました。ただし最終判断は人に残すべきだと著者は述べています。", "unverified": "モデル名と各指標の具体値は未確認（抄録のみ）。"}}, {"id": "pr31", "rank": 31, "headline": "協力を情報の流れとして捉える行動デジタルツイン", "title": "Modeling Cooperation as Information Flow: Ripple Structures and Behavioral Digital Twins", "url": "https://doi.org/10.31235/osf.io/y2t6f_v1", "authors": "kazutaka hayashi", "venue": "SocArXiv", "date": "2026-10-10", "apa": "hayashi, k. (2026). Modeling Cooperation as Information Flow: Ripple Structures and Behavioral Digital Twins. https://doi.org/10.31235/osf.io/y2t6f_v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録を使用（理論と観察手順の提案、実証なし）", "preprint": true, "short": true, "p1": "人の協力を、心理や道徳ではなく観察できる「情報の流れ」として定義し直し、AがBを助けBがCを助ける連鎖（波紋構造）と、行動のデジタルツインという概念を提案した（抄録）。", "p3": "状況・関係・行動履歴から意思決定の論理を写し取る行動デジタルツインを定義し、自然に起きる協力を介入せずに観察する手順と、今後の検証の枠組みを示す（抄録）。", "p5": "実証結果はなく、図と例は概念の説明である。AI研究、社会システム研究、Web3のガバナンスをつなぐ基盤を目指すとしている（抄録）。", "fun": "親切は「いい人だからする」と考えがちですが、この論文は、助けられた人が次の人を助ける流れそのものを測ろうとします。池に石を投げた波紋のように、協力がどこまで広がるかを追えれば、人の判断の筋道をAIに教えられるかもしれない、という発想です。", "unverified": "実証データはなし（構想段階）。"}}, {"id": "pr32", "rank": 32, "headline": "説明可能で公平な信用デフォルト予測", "title": "An Explainable and Fair Machine Learning Approach for Credit Default Prediction", "url": "https://doi.org/10.5281/zenodo.23260769", "authors": "Mohammed Murtaza Tajammul", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-10-09", "apa": "Mohammed Murtaza Tajammul. (2026). An Explainable and Fair Machine Learning Approach for Credit Default Prediction. IJERT.ORG. https://doi.org/10.5281/ZENODO.23260769", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodo登録のOpenAlex抄録を使用。審査のない置き場の文書", "preprint": true, "short": true, "p1": "公開データ（Home Credit Default Risk）で信用デフォルト予測を作り、SHAP・LIMEによる説明と性別間の公平性の確認を組み合わせた（抄録）。", "p3": "ロジスティック回帰、多層パーセプトロン、XGBoost、調整済みXGBoostを比べ、最良モデルをSHAPとLIMEで説明し、Fairlearnで男女間の公平性を確かめた（抄録）。", "p5": "調整済みXGBoostのROC-AUCが0.757で最良。検討した指標では男女の群で同程度の性能だった（抄録）。", "fun": "お金を貸すかどうかをAIが決めるなら、「なぜ断られたか」を説明でき、性別などで不公平になっていないことも大事です。当たる確率だけを競うのでなく、説明と公平の点検までを一つの流れにした教材的な例です。", "unverified": "公平性の評価に使った具体的な指標は未確認（抄録のみ）。"}}, {"id": "pr33", "rank": 33, "headline": "所得と生活満足度の関係は性格特性が媒介", "title": "Life satisfaction, household income and personality traits", "url": "https://doi.org/10.82444/warw.33632818", "authors": "Eugenio Proto ほか", "venue": "University of Warwick", "date": "2026-10-09", "apa": "Proto, E., & Rustichini, A. (2012). Life satisfaction, household income and personality traits (Version 1). University of Warwick. https://doi.org/10.82444/WARW.33632818", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "University of Warwickのリポジトリ登録の抄録を使用（旧稿の登録）", "preprint": false, "short": true, "p1": "所得が生活満足度に与える効果は性格特性、とくに神経症傾向（脅威や罰への敏感さ）によって大きく変わることを、英独のパネル調査で示した（抄録）。", "p3": "英国家計パネル調査（BHPS）とドイツ社会経済パネル（SOEP）で、所得と神経症傾向の交互作用を推定し、志（期待所得）と実現所得の差で満足度が決まる簡単なモデルを当てはめた（抄録）。", "p5": "神経症傾向が高い人は、貧しいときは所得をより喜び、豊かなときはあまり喜ばない。交互作用を入れると所得単独の効果は有意でなくなり、貧しい人は志が高すぎ、豊かな人は低すぎる傾向が推定された（抄録）。", "fun": "「お金があれば幸せか」の答えは人によって違う、というのは当たり前に聞こえます。でもこの研究は、その違いが心配性の度合いでかなり説明でき、しかも貧しいときと豊かなときで向きが逆になることを示しました。満足は所得そのものより、期待との差で決まるという見方です。", "unverified": "効果の大きさの数値は未確認（抄録のみ）。"}}, {"id": "pr34", "rank": 34, "headline": "初期の不利が低い志と低い達成を生むモデル", "title": "Poverty and aspirations failure", "url": "https://doi.org/10.82444/warw.33631183", "authors": "Patricio S. (Patricio Santiago) Dalton ほか", "venue": "University of Warwick", "date": "2026-10-09", "apa": "Dalton, P. S. (P. S., Ghosal, S., & Mani, A. (2010). Poverty and aspirations failure (Version 1). University of Warwick. https://doi.org/10.82444/WARW.33631183", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "University of Warwickのリポジトリ登録の抄録を使用（旧稿の登録）", "preprint": false, "short": true, "p1": "初期の不利が大きい人ほど低い志と低い達成に陥りやすいことを、心の内側の制約（内的制約）のモデルで示し、貧困の罠の一因として位置づけた（抄録）。", "p3": "人が手本とする他者の範囲（認知の窓）を自分で選ぶモデルを作り、手本となる人が志と達成を変える条件と、社会全体で志が伝わるかを分析した（抄録）。", "p5": "貧しい人は認知の窓を狭めることを選び、それが初期の地位分布と組み合わさって社会がつながるかどうかを決める。志に直接働きかける支援策に規範的な根拠を与えるとしている（抄録）。", "fun": "「どうせ自分には無理」と思うのは、本人の努力不足ではなく、身近に手本となる人がいないことの結果かもしれません。この論文は、誰を目標にするかを数式で表し、ロールモデルとの出会いが貧困の連鎖を断ち切る力になりうることを理論で示しています。", "unverified": "モデルの具体的な仮定は未確認（抄録のみ）。"}}, {"id": "pr35", "rank": 35, "headline": "職場の社会的ネットワークはモラルハザードを抑えるか", "title": "Overcoming moral hazard with social networks in the workplace : an experimental approach", "url": "https://doi.org/10.82444/warw.33637276", "authors": "Amrita Dhillon ほか", "venue": "University of Warwick", "date": "2026-10-09", "apa": "Dhillon, A., Peeters, R., & Yüksel, A. M. (2014). Overcoming moral hazard with social networks in the workplace : an experimental approach (Version 1). University of Warwick. https://doi.org/10.82444/WARW.33637276", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "University of Warwickのリポジトリ登録の抄録を使用（旧稿の登録）", "preprint": false, "short": true, "p1": "雇用主が紹介採用（リファラル）を使うのは、紹介者と働き手の社会的な近さが働き手の怠け（モラルハザード）を抑えるからだ、という仮説を実験で支持した（抄録）。", "p3": "紹介者と働き手の独裁者ゲームで働き手の返戻額を測り、社会的近さを匿名化したFacebookの友人関係で捉えた実験室実験（抄録）。", "p5": "雇用主は紹介者に友人がいると分かると紹介採用をより選び、紹介者は自分に近い働き手を選び、近い働き手ほど紹介者に多く返した。実験室なので、特定の相手への利他性だけが理由だと切り分けられる（抄録）。", "fun": "「友達の紹介なら安心」という感覚には理由があります。紹介された人は、紹介してくれた友達に迷惑をかけたくないので頑張るのです。Facebookの友人関係を使って「近さ」を測り、その効果を実験で確かめた工夫が面白い点です。", "unverified": "返戻額の差の大きさは未確認（抄録のみ）。"}}, {"id": "pr36", "rank": 36, "headline": "物理情報GNNとInSARで埋立滑走路の沈下予測", "title": "Physics-Informed spatiotemporal graph neural network for interpretable settlement prediction of the newly reclaimed HKIA 3rd runway using time-series InSAR", "url": "https://doi.org/10.2139/ssrn.7590163", "authors": "Zhuo Jiang ほか", "venue": "SSRN", "date": "2026-10-09", "apa": "Jiang, Z., Zhao, C., & Shi, G. (2026). Physics-Informed spatiotemporal graph neural network for interpretable settlement prediction of the newly reclaimed HKIA 3rd runway using time-series InSAR. https://doi.org/10.2139/ssrn.7590163", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNのCrossref登録の抄録を使用", "preprint": true, "short": true, "p1": "InSARの時系列観測から、香港国際空港の第3滑走路の埋立地の沈下を、圧密の物理を組み込んだグラフニューラルネットワークで予測し、物理的に解釈できる係数も得た（抄録）。", "p3": "GAT-GRUで沈下の時空間パターンを学び、テルツァーギの圧密理論に基づく層で最終沈下量と圧密減衰係数を逆推定して、将来の沈下を圧密方程式で拘束する（抄録）。", "p5": "沈下の大きい区域で最大MAE・RMSEが約20mm・22mmから10mm・12mmに減り、多段先予測の誤差はデータのみのモデルより22.4〜50.3%減った。推定係数は地盤改良の履歴と整合した（抄録）。", "fun": "海を埋め立てた土地は、何年もかけてゆっくり沈みます。衛星レーダーで沈み方を測るだけでなく、「土の中の水が抜けて沈む」という100年前からの理論をAIに組み込むと、予測が外れにくくなり、なぜ沈むのかも説明できる。データと物理の良いとこ取りです。", "unverified": "モデルの比較対象の詳細は未確認（抄録のみ）。"}}, {"id": "pr37", "rank": 37, "headline": "LLM4種が書く精神医学論文の引用捏造を比較", "title": "Citation Fabrication and Accuracy in AI-Generated Psychiatric Research: A Comparative Evaluation of Four Contemporary Large Language Models", "url": "https://doi.org/10.31234/osf.io/qs26b_v1", "authors": "Jake Linardon ほか", "venue": "PsyArXiv", "date": "2026-10-09", "apa": "Linardon, J., Anderson, C., Bolger, T., Liu, C., Soliman, O. M., & McClure, Z. (2026). Citation Fabrication and Accuracy in AI-Generated Psychiatric Research: A Comparative Evaluation of Four Contemporary Large Language Models. https://doi.org/10.31234/osf.io/qs26b_v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "PsyArXivのCrossref登録の抄録を使用", "preprint": true, "short": true, "p1": "4つのLLMに精神医学の文献レビューを書かせ、引用の捏造と正確さを比べた（抄録）。", "p3": "ChatGPT-5.4 Plus、ChatGPT-5.3 Free、Gemini-3、Claude Sonnet-4.6に、一般的な話題と専門的な話題で計16本のレビューを生成させ、825件の引用を点検した（抄録）。", "p5": "捏造は全体で6.1%。ChatGPT-5.4 Plusは0%、Claude Sonnet-4.6は0.5%、ChatGPT-5.3 Freeは5.5%、Gemini-3は20.2%だった。話題の専門性は捏造・正確さと関連しなかった（抄録）。", "fun": "AIに論文の参考文献を書かせると、もっともらしい「存在しない論文」を作ることがあります。調べてみると、その割合はモデルによって0%から約20%まで大きく違いました。便利な道具ほど、出典を自分で確かめる習慣が大事だと分かります。", "unverified": "引用の正確さの定義と数値の詳細は未確認（抄録のみ）。"}}, {"id": "pr38", "rank": 38, "headline": "障害者権利条約への準拠を測る臨床家尺度", "title": "The Convention on the Rights of Persons with Disabilities Adherence Scale (CRPDAS): Development and Psychometric Validation of a Clinician-Level Measure of Rights-Based Practice", "url": "https://doi.org/10.21203/rs.3.rs-10782583/v1", "authors": "Yael Harari ほか", "venue": "Research Square (In Review)", "date": "2026-10-09", "apa": "Harari, Y., Mayer, Y., & Lurie, I. (2026). The Convention on the Rights of Persons with Disabilities Adherence Scale (CRPDAS): Development and Psychometric Validation of a Clinician-Level Measure of Rights-Based Practice. https://doi.org/10.21203/rs.3.rs-10782583/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用（査読中、抄録の末尾は途中で切れていた）", "preprint": true, "short": true, "p1": "障害者権利条約（CRPD）の原則を、精神保健の専門職がどれだけ実践しているかを測る自己評価尺度（CRPDAS）を作り、妥当性を検証した（抄録）。", "p3": "WHO QualityRightsの基準と例を臨床家向けの項目に直し、イスラエルの多職種の専門職341人に実施して、探索的・確認的因子分析と信頼性係数で検証した（抄録）。", "p5": "「患者の自律」（7項目、α=0.71）と「個人の自由と地域への包摂」（7項目、α=0.77、入院部門n=96）の2因子構造が支持され、確認的因子分析の適合は良好で、因子間相関はr=0.70だった（抄録）。", "fun": "「本人の意思を尊重する」「地域で暮らせるように支える」という理念は、条約に書くだけでは現場に届きません。この研究は、専門職一人ひとりの実践を数字で測るものさしを作りました。測れるようになると、どこを改善すべきかが見えてきます。", "unverified": "抄録の末尾が欠けており、構成概念妥当性の結果は未確認。"}}, {"id": "pr39", "rank": 39, "headline": "社会的剥奪を受けない権利を人権として擁護", "title": "A human right against social deprivation", "url": "https://doi.org/10.82444/warw.33640591", "authors": "Kimberley Brownlee", "venue": "University of Warwick", "date": "2026-10-09", "apa": "Brownlee, K. (2013). A human right against social deprivation (Version 1). University of Warwick. https://doi.org/10.82444/WARW.33640591", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "University of Warwickのリポジトリ登録の抄録を使用（旧稿の登録）", "preprint": false, "short": true, "p1": "貧困ではなく、人とのまっとうな接触と社会的包摂の機会が持続的に欠けている状態（社会的剥奪）を受けない権利を、人権として擁護した（抄録）。", "p3": "この権利を、まっとうな生活の条件であり構成要素でもあるものとして論じ、市民的・政治的権利と社会経済的権利の両面から具体化する規範的な議論（抄録）。", "p5": "長期の独房拘禁や隔離だけでなく、組織的でない形の持続的な剥奪も対象とし、負担過大・請求不能・実行不能・反自由主義などの反論すべてに答えられると論じる（抄録）。", "fun": "人は食べ物や住まいだけでは「まともに」生きられず、人と関わる機会が必要です。この論文は、孤立させられないことを、表現の自由と同じような人権として考えようと提案します。孤独が社会問題になった今、権利の言葉で考えると何が変わるかを問う議論です。", "unverified": "なし"}}, {"id": "pr40", "rank": 40, "headline": "循環型炭素経済のサプライチェーンMFCAモデル", "title": "Developing a Material Flow Cost Accounting Model for Integrated Supply Chains Under the Circular Carbon Economy", "url": "https://doi.org/10.21203/rs.3.rs-10850368/v1", "authors": "Ezzaddin Hasan Kadhim", "venue": "Research Square (In Review)", "date": "2026-10-09", "apa": "Kadhim, E. H. (2026). Developing a Material Flow Cost Accounting Model for Integrated Supply Chains Under the Circular Carbon Economy. https://doi.org/10.21203/rs.3.rs-10850368/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録を使用（査読中）", "preprint": true, "short": true, "p1": "マテリアルフローコスト会計（MFCA）をサプライチェーン全体と炭素の循環の指標に広げ、物質の量と炭素密度を一つの単位で測るモデルを作った（抄録）。", "p3": "農業・バイオ化学のサプライチェーンの5つの数量センターを対象に、理論モデルの構築、事例データへの適用、シナリオ分析の3段階で検証した（抄録）。", "p5": "物質の廃棄は計5,478トン（投入の19.3%）、炭素の廃棄コストは187,260米ドル、炭素循環の閉鎖度指数の平均は0.79だった（抄録）。", "fun": "製品にならずに捨てられる材料は、普通の原価計算では製品の原価に紛れて見えなくなります。MFCAはその「捨てたもの」に値段をつける会計です。それを工場一つでなく供給網全体に広げ、炭素の量まで同じ物差しで数えようとしたのがこの研究の工夫です。", "unverified": "モデルの単位の換算方法は未確認（抄録のみ）。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "因果推論", "headline": "時間RDDの信頼区間は系列相関で過小被覆", "title": "Inference for regression discontinuity in time under serial correlation", "url": "https://doi.org/10.2139/ssrn.7589385", "authors": "Wenyu Zhou ほか", "venue": "SSRN", "date": "2026-10-09", "apa": "Zhou, W., Chen, S., & Gao, D. (2026). Inference for regression discontinuity in time under serial correlation. https://doi.org/10.2139/ssrn.7589385", "why": "広く使われるrdrobustの推定量に適用できる、自己相関に頑健な区間を提案し、プラセボ日で妥当性を確かめている。", "explain": {"basis": "抄録", "basis_note": "SSRN版は本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "時間を割当変数とする回帰不連続デザイン（RDiT）で、誤差の系列相関を考慮した信頼区間を提案し、広く使われるrdrobustの偏り補正推定量に使えるようにした（抄録）。", "p2": "RDiT（ある日付の前後で結果が不連続に変わるかを見る手法）の信頼区間は、誤差を独立とみなすことが多い。正の自己相関があると区間は漸近的に名目より狭くなり（過小被覆）、効果を過大に有意と判断しやすい（抄録）。", "p3": "結果変数を時間の正規直交多項式に射影して長期分散を推定し、t分布に基づく（Student）区間を作る。背景：長期分散は、自己相関を含めた誤差のばらつきの総量で、これを正しく推定すると区間の幅が適切になる。rdrobustの偏り補正推定量にそのまま適用できる（抄録）。", "p4": "シミュレーションで被覆率（真の値を区間が含む割合）を、クラスタ頑健区間とNewey–West区間と比べた。実データでは、メキシコシティの大気汚染データで効果がないはずのプラセボ日付に適用し、ゼロを除外する頻度を見た（抄録）。", "p5": "提案区間の被覆率は名目値に近く、クラスタ頑健区間やNewey–West区間でも過小被覆した。プラセボ日付では提案区間がゼロを除外する割合はほぼ名目水準で、既存の頑健な偏り補正区間はその6倍以上の頻度でゼロを除外した（抄録）。", "p6": "抄録からは、多項式の次数の選び方、強い季節性や構造変化がある場合の性能、標本の長さへの依存は分からない。解釈：既存のRDiT研究の有意な結果の一部は、見直しが必要になりうる。", "fun": "「新しい規制が始まった日の前後で大気汚染が変わったか」を調べるとき、昨日の汚れは今日に持ち越されるので、毎日のデータは独立ではありません。それを無視すると、何も起きていない日でも「効果あり」と言ってしまいがちです。実際、効果のないはずの日付で試すと、従来法は6倍以上も誤った警報を出していました。", "unverified": "シミュレーションの設定と被覆率の具体的な数値は未確認（抄録のみ）。"}}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "共通の銀行がサプライチェーンの打撃を和らげる", "title": "Common Banks, Supply Chains, and the Transmission of Real Shocks", "url": "https://doi.org/10.2139/ssrn.7588198", "authors": "Miguel Almeida Ferreira ほか", "venue": "SSRN", "date": "2026-10-09", "apa": "Ferreira, M. A., & R. dos Santos, A. (2026). Common Banks, Supply Chains, and the Transmission of Real Shocks. https://doi.org/10.2139/ssrn.7588198", "why": "山火事を外生ショックとした差の差分析で、取引先と同じ銀行を持つ企業ほど信用収縮が小さいことを示した。", "explain": {"basis": "抄録", "basis_note": "SSRN版は本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "取引先同士に共通して貸している銀行（共通銀行）は、サプライチェーンを通じた波及を内部化し、実物ショックが信用市場を通じて広がるのを抑えることを示した（抄録）。", "p2": "企業へのショックは取引網と銀行貸出を通じて広がりうるが、銀行がサプライチェーン上のつながりを考慮して貸出を調整するかは、外生的なショックで識別した証拠が乏しかった（抄録）。", "p3": "ポルトガルの山火事を企業単位のほぼ外生的なショックとみなし、銀行-企業と顧客-供給者の対応データで、時期のずれた処置の差の差分析を行った。共通銀行を持つ企業と、それ以外の似た企業を比べる（抄録）。", "p4": "結果は山火事後の銀行信用の変化、債務不履行リスク、売上・粗付加価値・雇用・投資である。平時の貸出量・関係の成立・金利も比べた（抄録）。", "p5": "共通銀行を持つ企業は、山火事後の銀行信用の減少が10ポイント小さく、債務不履行リスクも低く、売上・付加価値・雇用・投資への悪影響が和らいだ。平時にも共通銀行はおよそ2倍の信用を供与し、関係を結びやすく、金利も低かった（抄録）。", "p6": "抄録が示すとおり、共通銀行は情報の優位を得る一方で集中リスクを抱える。解釈：ポルトガルの山火事という局所的なショックの結果が、景気後退のような全体的なショックにも当てはまるかは分からない。", "fun": "取引先と同じ銀行を使っていると、その銀行は「この会社が倒れると、あの取引先も困る」と分かるので、災害のときに簡単にはお金を引き上げません。山火事という偶然の出来事を使って、銀行が取引のつながりを見て行動していることを確かめた点が巧みです。", "unverified": "標本の規模と期間は未確認（抄録のみ）。"}}, {"id": "pn03", "rank": 3, "field": "機械学習", "headline": "ループ型Transformerに専用の残差接続を", "title": "Scaling to Tens of Thousands of Test-Time Iterations with Loop-Native Attention Residuals", "url": "https://arxiv.org/abs/2610.11570", "authors": "Pengxiang Li ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-09", "apa": "Li, P., Muhtar, D., He, D., Su, G., Yin, L., & Liu, S. (2026). Scaling to Tens of Thousands of Test-Time Iterations with Loop-Native Attention Residuals (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.11570", "why": "反復回数を増やすと推論精度が落ちる問題を、ループ用の注意残差で抑え、数万回の反復まで伸ばしている。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§2〜§5、表1、図1〜5のキャプション、付録Aの冒頭）を読んだ", "preprint": true, "p1": "同じTransformerブロックを繰り返し適用するループ型モデルに、ループ専用の残差接続（InfiLoop）を入れ、反復を数万回まで増やしても推論精度が落ちず、むしろ上がり続けるようにした（抄録、§4.4）。", "p2": "従来のループ型（TRMなど）は直前の出力をそのまま次の状態にする「carry-last」で、反復を増やすと雑音のある更新が正しい途中結果を上書きし、解けた問題も解けなくなる。TRMは数独で468層で62.2%が最高で、1,872層では58.1%に落ちた（§2）。", "p3": "各反復の候補z_iを内容スコアs_i（共有の擬似クエリとの内積）と学習した時間減衰λで重み付けし、h_t=Σα_{t,i}z_iとして次の入力にする（式2）。指数減衰のため、分子と分母を1ステップずつ更新する厳密な再帰で書け、記憶はループ回数に依らず一定（式4）。これはh_t=h_{t−1}+γ_t(z_t−h_{t−1})という適応的な歩幅の更新と同値で、評価の低い提案は小さな歩幅で退けられる（式5、§3.3）。", "p4": "700万パラメータのモデルを、Sudoku-Extreme・Maze-Hard（厳密正解率）とARC-AGI-1・2（pass@2）で、TRM（著者の手順で再学習）、FPRM（公開チェックポイント）、HRMなどと比べた。推論時の層数を最大24,960まで変えて追加学習なしで評価した（§4.2、§4.4）。", "p5": "数独97.9%（FPRM 94.2%、TRM 74.7%）、迷路87.4%、ARC-AGI-1 49.1%、ARC-AGI-2 13.6%（TRM 7.8%）だった（表1）。図3左（横軸：実行層数の対数、縦軸：正解率）では、InfiLoopは1,872層で90.9%とFPRMの3,744層の90.1%を上回り、24,960層で92.74%に達した。一度解けた問題は36回後もすべて解けたままだった（§2、図1）。", "p6": "評価は数独・迷路・ARCといったパズルに限られ、言語の推論への適用は示されていない。持続的な状態は問題あたり582.8KiBで一定だが、計算量は反復回数に比例して増える（付録A）。解釈：ARC-AGI-2の13.6%はなお低く、汎用的な推論能力の改善の大きさは今後の確認が要る。", "fun": "難しい数独を何度も見直すうちに、せっかく正しく埋めたマスを書き換えてしまう、ということは人にもあります。この研究のAIは、新しい答えの案に「どれくらい自信があるか」で点をつけ、自信のない書き換えは小さくしか受け入れません。その結果、考える回数を増やすほど賢くなる、という本来あるべき姿に近づきました。", "unverified": "付録の詳細なハイパーパラメータと表2の数値は未確認。"}}, {"id": "pn04", "rank": 4, "field": "組織行動・心理的安全性", "headline": "AIの要約がチームの声を一つに溶かす", "title": "Only I Will Remain: How AI Turns Team Contributions into One Collective Voice", "url": "https://doi.org/10.2139/ssrn.7590362", "authors": "Diego Gomez-Zara", "venue": "SSRN", "date": "2026-10-09", "apa": "Gomez-Zara, D. (2026). Only I Will Remain: How AI Turns Team Contributions into One Collective Voice. https://doi.org/10.2139/ssrn.7590362", "why": "AIによる議論の統合が、個々の貢献の違いを見えなくする「貢献の溶解」を概念化し、チーム思考への影響を論じる。", "explain": {"basis": "抄録", "basis_note": "SSRN版は本文を取得できず、Crossrefに登録された抄録を使用（概念論文）", "preprint": true, "p1": "AIがチームの議論や貢献を要約・統合すると、メンバーが一緒に意見を作り上げる前に、チームが一つの声で語っているように見えてしまう現象を「貢献の溶解」と名づけ、その功罪と設計の方向を論じた（抄録）。", "p2": "AIによるチームの議論の統合は広がっているが、個々の意見の違い、相互の関係、最終的な立場への影響が見えなくなるという問題は、概念として整理されていなかった（抄録）。", "p3": "貢献の溶解を、個々の入力が共有の表現へと再構成され、それらがどう異なり関係し合い結論を形づくったかが見えにくくなる変換として定義する。概念的な分析であり、データによる検証は抄録には示されていない（抄録）。", "p4": "実証の検証はない。評価の視点として、統合がチームの思考を強める面（見落とした考えの発見、分散した知識の接続、誰も単独では作れない解釈の生成）と弱める面を対置する（抄録）。", "p5": "統合は生産的な緊張を和らげ、早すぎる合意を促し、AIが生成した一つの解釈がチーム全体の代わりになりうる。代替的な解釈の検討、見落とした可能性の回復、AIの表現を自分たちのものとして採用するかの判断を助ける協働AIの設計方向を示す（抄録）。", "p6": "概念論文で、効果の大きさや条件は実証されていない。解釈：心理的安全性の高低で溶解の影響が異なるかなど、検証可能な仮説への落とし込みは今後の課題である。", "fun": "会議の後、AIが「チームの結論はこうです」ときれいにまとめてくれると便利です。でも、その文章を読んだ瞬間、反対していた人の意見や、まだ迷っていた気持ちは消えてしまうかもしれません。まとめることは、ときに考えるのをやめることでもある、という指摘です。", "unverified": "実証データはなし（概念論文）。"}}, {"id": "pn05", "rank": 5, "field": "経済学", "headline": "決算説明会から企業ごとの関税リスクを測る", "title": "Firm-Level Tariff Exposure and Uncertainty: Measurement and Effects", "url": "https://doi.org/10.2139/ssrn.7574578", "authors": "Alexander Hillert ほか", "venue": "SSRN", "date": "2026-10-09", "apa": "Hillert, A., Kaiser, L. E., & Rupp, J. (2026). Firm-Level Tariff Exposure and Uncertainty: Measurement and Effects. https://doi.org/10.2139/ssrn.7574578", "why": "68か国・約1.2万社の決算説明会から関税のエクスポージャーと不確実性を測り、関税発表時の株価反応で検証した。", "explain": {"basis": "抄録", "basis_note": "SSRN版は本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "68か国1万1,905社の決算説明会38万1,639件のテキストから、企業ごとの関税エクスポージャー・不確実性・センチメントを測る指標を作り、株価と実物の結果で妥当性を示した（抄録）。", "p2": "関税の影響は国や業種の単位で測られがちだが、同じ国・業種の中でも企業ごとに大きく違いうる。企業単位で関税リスクを測る国際的な指標は乏しかった（抄録）。", "p3": "決算説明会の発言から、関税への言及（エクスポージャー）、不確実性の語との共起、語調を数えて企業・時点ごとの指標を作る。解釈：決算説明会のテキストを使った企業リスク指標の手法を関税に適用したもの（抄録）。", "p4": "18回の関税発表の前後の異常リターンで指標を検証し、その後の投資と売上の伸びとの関係を調べた（抄録）。", "p5": "同じ国・業種の中でも指標は大きくばらついた。関税引き上げ時にはエクスポージャーと不確実性が高い企業ほど負の異常リターンが大きく、制限解除時にはエクスポージャーが高い企業ほど正の異常リターンが大きかった。価格調整は約5営業日で完了し、高いエクスポージャーはその後の投資と売上の伸びの低さを予測した（抄録）。", "p6": "テキストの言及は経営者の発言に依存し、話題にしない企業のリスクは捉えにくい。解釈：抄録からは、言及の頻度と実際の輸出入依存度との対応の検証の有無は分からない。", "fun": "関税の話題に決算説明会で何度も触れる会社ほど、関税が上がったとき株価が下がりました。社長たちの「話し言葉」が、会社ごとの見えないリスクを映す鏡になっているのです。しかも株価は5日ほどで反応を終えており、市場がこの情報を素早く取り込むことも分かります。", "unverified": "異常リターンと投資への効果の大きさは未確認（抄録のみ）。"}}, {"id": "pn06", "rank": 6, "field": "統計学", "headline": "共分散推定の不確実性もマルコウィッツで分散", "title": "Blessing of Markowitz: Hedging Covariance Uncertainty in High-Dimensional Portfolio Optimization", "url": "https://doi.org/10.2139/ssrn.7587559", "authors": "Shiwei Huang ほか", "venue": "SSRN", "date": "2026-10-09", "apa": "Huang, S., Dandan, J., & Xinyu, Z. (2026). Blessing of Markowitz: Hedging Covariance Uncertainty in High-Dimensional Portfolio Optimization. https://doi.org/10.2139/ssrn.7587559", "why": "正則化した平均分散ポートフォリオ同士を資産とみなして再最適化し、高次元でシャープレシオを改善する手法。", "explain": {"basis": "抄録", "basis_note": "SSRN版は本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "高次元のポートフォリオ最適化で、どの共分散推定量を選ぶかという不確実性そのものを、推定量ごとのポートフォリオを組み合わせることで分散（ヘッジ）できることを示した（抄録）。", "p2": "銘柄数が多いと、標本外ですべての場合に勝つ共分散推定量はないが、投資家はどれか一つを選ばなければならない。選択を誤るリスクが残る（抄録）。", "p3": "「二重マルコウィッツ」法は、正則化した平均分散ポートフォリオ（推定量の違う複数の候補）を資産とみなし、その組合せを再最適化する。新たに開発した補正済みの基準でこれを実行可能にし、回転同変なスペクトル縮小を超えて、効率的フロンティアや最小分散の目的にも対応させた（抄録）。", "p4": "漸近理論でシャープレシオの改善を示し、実証では単一推定量のポートフォリオとスペクトル縮小の基準と比べた（抄録）。", "p5": "候補が互いに補完的なリスク調整後リターンを持つとき、厳密な漸近的シャープレシオの改善が得られた。実証でも、共分散モデルの不確実性をヘッジすると、単一推定量やスペクトル縮小の基準より有意に成績が良かった（抄録）。", "p6": "抄録からは、実証のデータ（市場・期間）、取引費用、候補の数を増やしたときの過学習の扱いは分からない。", "fun": "「卵を一つのかごに盛るな」という分散投資の考えを、銘柄だけでなく「計算方法の選び方」にも当てはめたのがこの研究です。どの推定方法が当たるか分からないなら、方法ごとに作ったポートフォリオ自体を組み合わせてしまえばいい。マルコウィッツの考えを二重に使う発想が面白い点です。", "unverified": "実証の対象と改善の数値は未確認（抄録のみ）。"}}, {"id": "pn07", "rank": 7, "field": "計算社会科学・ネットワーク科学", "headline": "遠距離の友人を好む志向が集合行動を促す", "title": "A preference for long-distance friendships, even in the absence of those friendships, can foster collective action", "url": "https://doi.org/10.31235/osf.io/ywt4h_v2", "authors": "Kristopher M Smith ほか", "venue": "SocArXiv", "date": "2026-10-10", "apa": "Smith, K. M., Pisor, A., Aron, B., Bernard, K., Fimbo, P., Kimesera, R., & Borgerhoff Mulder, M. (2026). A preference for long-distance friendships, even in the absence of those friendships, can foster collective action. https://doi.org/10.31235/osf.io/ywt4h_v2", "why": "実際の友人関係とは別に「遠距離の友人を好む志向」を測定し、離れた地域をまたぐ集合行動との関連を示した。", "explain": {"basis": "抄録", "basis_note": "SocArXiv（OSF）版は本文を取得できず、OSFに登録された抄録を使用", "preprint": true, "p1": "実際に遠くの友人がいるかとは別に、「遠くに住む人と友人になりたい」という志向（長距離志向、LDO）を測る尺度を作り、それが離れた地域をまたぐ集合行動への参加と関連することを示した（抄録）。", "p2": "遠くの友人関係は相互依存と信頼を育て、地域をまたぐ協力を促しうるが、規範・資源・時間の制約で友人関係そのものが作れないことも多い。友人関係の有無とは別の「志向」が協力を説明するかは調べられていなかった（抄録）。", "p3": "タンザニアの漁村での民族誌調査から初期の尺度を作り、米国の2つのオンライン標本（200人、300人）で改良したうえで、タンザニア沿岸の地域で777人に実施した。LDO、遠くの友人関係、遠くの人への信頼、地域をまたぐ漁業管理への参加の関連を調べた（抄録）。", "p4": "漁業管理は複数の共同体の協力を要する集合行動であり、その参加を結果とした。LDOの効果が、遠くの友人関係と信頼を考慮しても残るかを検証した（抄録）。", "p5": "LDOが高い人ほど、遠くの友人関係と信頼とは独立に漁業管理への参加が多く、同時に遠くの友人関係と信頼も多かった。友人関係と信頼もそれぞれ独立に参加と関連した。関係を作る志向、実現した関係、他地域の人への信頼という重なり合う複数の経路が示唆される（抄録）。", "p6": "著者は、尺度のさらなる改良と文化をまたぐ研究が必要だとしている。横断的な関連であり、志向が参加を生むという因果の向きは確定しない（抄録）。", "fun": "遠くに友達が実際にいなくても、「遠くの人とつながりたい」と思っているだけで、離れた村と一緒に海の資源を守る活動に参加しやすい、という結果です。気持ちの向きそのものが協力の入り口になる。人のつながりを「いる・いない」ではなく「求めるかどうか」で測る発想が新鮮です。", "unverified": "効果の大きさの数値は未確認（抄録のみ）。"}}, {"id": "pn08", "rank": 8, "field": "機械学習", "headline": "AIエージェントは自由な科学的発見ができるか", "title": "Can AI Agents Make Open-Ended Scientific Discovery? Evidence from Station", "url": "https://arxiv.org/abs/2610.08927", "authors": "Wenyu Du ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-09", "apa": "Du, W., & Chung, S. (2026). Can AI Agents Make Open-Ended Scientific Discovery? Evidence from Station (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.08927", "why": "複数エージェントが科学の生態系を模すStation環境に監督と振り返りの仕組みを加え、評価指標のない探索を検証した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§4〜§8、表1、図2〜5、付録Fの限界）を読んだ", "preprint": true, "p1": "複数のAIエージェントが科学の生態系を模すオープンワールド環境Stationに、監督役と定期的な振り返りの仕組みを加えると、評価指標のない「開かれた」研究課題でも、既発表の発見の多くを自律的に再発見できることを示した（抄録、§6）。", "p2": "AIによる科学的発見は、明確な評価指標がある課題では進歩したが、途中の指標がない開かれた課題では、探索が続かず浅い問いに流れやすい（街灯の下で鍵を探す「街灯効果」）（§1、§6.2）。", "p3": "監督役（Supervisor）は各エージェントに研究計画と一定期間の継続の約束を出させ、方向転換を原則認めない。メタ振り返り（Meta Reflection）は50ティックごとに作業を止め、人の研究者の視点で新規性と重要性を自己評価させる（GPT-5.5が回答）。最後に統合エージェントが約8,000語の報告書にまとめる（§4）。", "p4": "ICLRの口頭発表論文3本の研究課題を、結果を伏せ、ネット接続を切って与え、各論文の主な発見を約10個の下位発見に分けて、報告書が根拠付きで再発見した割合を評価した（GPT-5.5で自動評価し、盲検の専門家評価と高く一致）。Gemini 3.1 Pro・GPT-5.5・Claude Opus 4.8の計6体で300ティック、各3回実行し、実験時間を揃えたAI Scientist-v2とCodex Multiagent-v2と比べた（§5）。", "p5": "再発見率の平均はStationが62.7%、Codexが15.4%、AI Scientist-v2が14.4〜20.6%（抄録）。強化学習の計画の課題で75.8%、LLM出力の低ランク構造で70.4%、RNNの時間表現で41.9%だった（図2）。2つの仕組みを除くと75.8%から57.9%に下がった（図3A）。探索課題では、LoRAのランクと形質の転移の逆U字関係など、モデルの知識の締め切り後に報告された発見と一致する結果も得た（§7、図4）。", "p6": "モデルが元論文の結果を学習済みである可能性は排除できない（付録F）。性能向上が分散型の設計によるのか、モデル構成やワークフローの違いによるのかは切り分けていない。研究提案の75%は元論文の著者から5点中1〜2点と評価され、価値判断のずれは残る（§6.2）。", "fun": "AIの研究チームに「途中で目移りしない」約束をさせ、ときどき「その研究、本当に大事？」と自問させるだけで、論文の発見を再発見できる割合が大きく上がりました。人の研究室でも、指導教員との面談や振り返りが研究を深めるのと同じです。それでもAIの研究提案の多くは「細部にこだわりすぎ」と評価され、目利きの力にはまだ差があります。", "unverified": "付録の資源使用量の内訳とVLM課題の追加検証の数値は未確認。"}}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "学力の高い投資家ほど安全な分散投資を選ぶ", "title": "Do Educated Investors Make Safer or Bolder Bets? Three Channels of Education in Stock-Market Risk-Taking", "url": "https://doi.org/10.2139/ssrn.7589495", "authors": "Tonn Talpsepp ほか", "venue": "SSRN", "date": "2026-10-09", "apa": "Talpsepp, T., Liivamägi, K., & Vaarmets, T. (2026). Do Educated Investors Make Safer or Bolder Bets? Three Channels of Education in Stock-Market Risk-Taking. https://doi.org/10.2139/ssrn.7589495", "why": "エストニアの試験記録と全投資家の取引履歴を結び、学力・学歴・専攻がリスク選択に与える経路を分解した。", "explain": {"basis": "抄録", "basis_note": "SSRN版は本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "教育と投資のリスクの関係を、認知能力・学歴の水準・専攻分野の3つに分解し、高学力・高学歴の投資家はより安全に、経済・金融専攻はよりリスクの高い投資をすることを示した（抄録）。", "p2": "教育とリスクテイクの関係について先行研究の結果は矛盾していた。教育の「量」と「種類」と「能力」が混ざって測られていたことが一因と考えられた（抄録）。", "p3": "エストニアの高校卒業試験の登録記録と、2004〜2012年のナスダック・タリンの全投資家の取引履歴を行政記録で結合し、3つの次元を別々に入れて保有ポートフォリオのリスクを分析した（抄録）。", "p4": "結果はポートフォリオのリスクで、分散の広さ（銘柄数）とベータの低い銘柄の選択という2つの経路も調べた（抄録）。", "p5": "学力が高い人と修士・博士の学位を持つ人はリスクの低いポートフォリオを持ち、分散の拡大と低ベータ銘柄の選択の2つの経路が同時に働いた。経済学・金融の学位を持つ人はリスクの高いポートフォリオを持ち、知識に基づくファクターへのエクスポージャーと整合した。3次元を分けると先行研究の矛盾は解ける（抄録）。", "p6": "エストニアの小さな市場（ナスダック・タリン）と2004〜2012年に限られる。解釈：専攻の選択自体がリスク選好を反映している可能性（選択効果）がどこまで除かれているかは抄録からは分からない。", "fun": "「勉強した人ほど賢く投資する」と一言で言っても、試験の成績が良い人は慎重に分散し、経済や金融を学んだ人はあえてリスクを取っていました。教育の「量」ではなく「何を学んだか」で行動が分かれる。国の全投資家の取引記録と高校の試験結果を結びつけた、データの力が光る研究です。", "unverified": "効果の大きさと標本の人数は未確認（抄録のみ）。"}}, {"id": "pn10", "rank": 10, "field": "開発経済学", "headline": "学校介入で教師と親の子どもへの暴力を減らす", "title": "Preventing teacher and parental violence against children: A cluster-randomized controlled trial of a school-based intervention approach in Tanzanian primary schools", "url": "https://doi.org/10.31234/osf.io/ukw6t_v1", "authors": "Eliud Kabelege ほか", "venue": "PsyArXiv", "date": "2026-10-09", "apa": "Kabelege, E., Mattonet, K., Kolwey, L., Mkinga, G., Nkuba, M., Fritz, M., Masath, F. B., Hermenau, K., Steinert, J. I., & Hecker, T. (2026). Preventing teacher and parental violence against children: A cluster-randomized controlled trial of a school-based intervention approach in Tanzanian primary schools. https://doi.org/10.31234/osf.io/ukw6t_v1", "why": "タンザニアの小学校16校のクラスター無作為化比較試験で、教師と親の両方に働きかける介入を評価した。", "explain": {"basis": "抄録", "basis_note": "PsyArXiv版は本文を取得できず、Europe PMCに登録された抄録を使用", "preprint": true, "p1": "タンザニアの公立小学校で、教師と親の両方に非暴力のしつけを教える介入（ICC）が、子どもへの情緒的・身体的な暴力を減らすことを、クラスター無作為化比較試験で示した（抄録）。", "p2": "低・中所得国では家庭と学校での子どもへの暴力が依然として多い。教師と親の暴力に同時に取り組む予防介入の効果は検証されていなかった（抄録）。", "p3": "モロゴロ州の公立小学校16校を1:1で介入群と対照群に無作為に割り付け、8〜15歳の子ども、親、教師を登録した。ICCは非暴力の行動管理の方法と、大人と子どもの肯定的な関わりに焦点を当てる。追跡時の面接者は割付を知らされなかった（抄録）。", "p4": "主要評価項目は子どもと大人の報告による情緒的・身体的暴力で、ベースライン（2024年4〜8月）と追跡（2024年10月〜2025年2月）で測った。割り付けた全員を分析し、欠測は多重代入で補った。ClinicalTrials.govに登録（抄録）。", "p5": "子ども410人と427人などが各群に割り付けられた。介入校では母・父・教師の暴力が有意に大きく減り、効果量（Cohen's d）は、母の身体的暴力が子ども報告で0.134、大人報告で0.473、教師の身体的暴力が子ども報告で0.164、大人報告で0.607などだった。介入による有害事象はなかった（抄録）。", "p6": "学校数は16と少なく、追跡期間は数か月である。解釈：大人の自己報告の効果量は子ども報告より大きく、社会的望ましさによる過大評価の可能性がある。長期の持続性は抄録からは分からない。", "fun": "子どもへの暴力をなくすには、家庭と学校のどちらか一方だけでは足りません。この研究は、学校という既存の仕組みを使って先生と親を同時に教育し、両方の暴力を減らしました。子どもの報告と大人の報告で効果の大きさが違う点も、誰の目で測るかの大切さを教えてくれます。", "unverified": "なし"}}, {"id": "pn11", "rank": 11, "field": "経営学", "headline": "知識の出どころが画期的な革新の到達度を決める", "title": "Knowledge source composition and the reach and persistence of product innovation", "url": "https://doi.org/10.2139/ssrn.7590086", "authors": "Juan Carlos Salazar-Elena", "venue": "SSRN", "date": "2026-10-09", "apa": "Salazar-Elena, J. C. (2026). Knowledge source composition and the reach and persistence of product innovation. https://doi.org/10.2139/ssrn.7590086", "why": "外部知識の量ではなく出どころ（競合・市場外・科学）が、市場で初の革新か世界初かを分けると論じ検証する。", "explain": {"basis": "抄録", "basis_note": "SSRN版は本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "外部の知識源をどれだけ多く使うかではなく、どこから得るか（競合と共有する知識か、市場の外、特に科学か）が、自国初のイノベーションか世界初のイノベーションかを分けることを示した（抄録）。", "p2": "外部の知識源を多く使う企業ほど革新的だという証拠は、漸進的な革新では強いが世界初の革新では弱く、その理由が不明だった（抄録）。", "p3": "オーストリア学派・進化経済学・資源ベース論を組み合わせた起業家的市場過程の枠組みを立て、16の欧州諸国の企業イノベーション調査（CIS）で同じ企業の自国初と世界初を比べた。さらにスペイン企業のパネルで新製品の売上の持続を追った（抄録）。", "p4": "結果は自国初・世界初の新製品の有無と、新製品の売上が3年後も続くかである（抄録）。", "p5": "知識源の数は自国初とは関連したが世界初とは関連せず、科学の利用と知識源の集中的な利用は両方と関連した。新製品の販売開始のうち3年後も続いていたのは3分の1強で、継続は特許より継続的な社内研究と強く関連した（抄録）。", "p6": "調査データでの関連の分析で、因果の識別は抄録からは確認できない。解釈：「世界初」の自己申告の正確さには限界がありうる。", "fun": "新しいアイデアをたくさんの人から集めても、それだけで「世界初」は生まれにくいようです。世界初には大学などの科学の知識が効き、しかも一番乗りの地位は3年もすると多くが失われます。それを保つのは特許で守ることより、研究を続けて次の新しさを生み出す力でした。", "unverified": "効果の大きさの数値は未確認（抄録のみ）。"}}, {"id": "pn12", "rank": 12, "field": "因果推論", "headline": "ウェブ先行の調査順序は敏感な回答を変えるか", "title": "Web-First Assignment, Mode Crossover, and Socially Sensitive Reporting: Evidence from the General Social Survey", "url": "https://doi.org/10.2139/ssrn.7591258", "authors": "MohammadJavad Khosravi Bakhtiarvandi", "venue": "SSRN", "date": "2026-10-10", "apa": "Khosravi Bakhtiarvandi, M. (2026). Web-First Assignment, Mode Crossover, and Socially Sensitive Reporting: Evidence from the General Social Survey. https://doi.org/10.2139/ssrn.7591258", "why": "GSSの調査モード順序の無作為割付を使い、割付・回答・最終モード・重み付けを分けて効果を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRN版は本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "米国総合社会調査（GSS）で、ウェブ先行の調査手順に無作為に割り付けても、社会的に敏感な態度・行動の回答は全体として大きく変わらないことを示した（抄録）。", "p2": "混合モードの調査研究では、無作為な手順の割付、回答の有無、最終的に回答したモード、母集団への重み付けの4つが混同されがちで、モード効果の推定が歪みうる（抄録）。", "p3": "2022年と2024年のGSSの無作為なモード順序の割付を使い、割付の効果（ITT）として推定した。4つの要素を分けて、重みなし・GSS推奨の無回答調整済み事後層化重み（WTSSNRPS）・別の事後層化重み（WTSSPS）で比べ、無作為化推測も用いた（抄録）。", "p4": "結果は社会的に敏感な回答の統合指標と、領域別の回答（市民的な行動など）である（抄録）。", "p5": "乗り換えは大きく、ウェブ先行に割り付けられた人の62.7%がウェブで、対面先行の人は33.2%がウェブで回答した。統合指標で大きな一様の変化の証拠はほとんどなく、回答者のみの重みなし比較では投票の自己申告を中心に市民的な報告がわずかに増えたが、推奨の重みでは消えた（抄録）。", "p6": "ITTはウェブ対対面の純粋なモード差ではなく、調査手順の割付の効果を表す。著者は、領域によって小さな効果が残る可能性を否定していない（抄録）。", "fun": "「人には言いにくいこと」は、面接より画面に向かって答えるほうが正直に言いやすい、と考えられてきました。ところが無作為に割り付けた大規模調査で確かめると、全体としての差はほとんどありませんでした。誰がどの方法で答えたかを丁寧に分けると、思い込みが崩れる好例です。", "unverified": "なし"}}, {"id": "pn13", "rank": 13, "field": "組織行動・心理的安全性", "headline": "専門性の多様さがウィキの情報共有を高める", "title": "Expertise Diversity Enhances Information Sharing in Wiki settings: Evidence from Sequential Collaboration", "url": "https://doi.org/10.31234/osf.io/aux2p_v1", "authors": "Maren Mayer ほか", "venue": "PsyArXiv", "date": "2026-10-09", "apa": "Mayer, M., & Kimmerle, J. (2026). Expertise Diversity Enhances Information Sharing in Wiki settings: Evidence from Sequential Collaboration. https://doi.org/10.31234/osf.io/aux2p_v1", "why": "順番に編集を重ねる共同作業で、専門の異なる人が加わると共有される情報が増えることを計算モデルと実験で示す。", "explain": {"basis": "本文", "basis_note": "PsyArXiv版のPDF本文（方法、結果、頑健性分析、考察と限界、図2）を読んだ。原稿には未完成の箇所（TODOの記載）が残っていた", "preprint": true, "p1": "ウィキのように人が順番に文章を書き直していく共同作業（逐次的協働）で、参加者の持つ専門知識の違いが大きいほど、より多くの情報が共有の文章に取り込まれることを実験で示した（抄録、Results）。", "p2": "WikipediaやOpenStreetMapは逐次的協働で成り立つが、その情報共有の認知的な仕組みは分かっていなかった。数値判断の逐次協働の認知モデルは「専門知識のばらつきが大きいと情報が統合されやすい」と予測するが、文章の情報共有で確かめられていなかった（Introduction）。", "p3": "事前登録した2（専門知識のばらつき：大・小）×5（鎖の位置）の実験。5人で1つの鎖を作り、キリン・ローマの水道・モアイ・マヤ暦・ルーンなど6話題について、各人が8つの情報を60秒読んでから、前の人の文章を最大5分で書き直す。ばらつき小の条件では全員がほぼ同じ情報を持ち、大の条件では10個の情報が鎖の中で3回ずつ現れるよう配分した（Methods）。", "p4": "参加者は413人（84の鎖）。各情報が文章に含まれたか・削除されたかを自動コーディング（手作業の128文書との照合で感度100%、特異度98.61%）し、交差ランダム効果のロジスティック階層モデルで、鎖の位置の線形・2次の傾向と条件の効果を検定した（Data analysis）。", "p5": "情報が含まれる確率は鎖が進むほど増え（線形β=1.37）、増え方は鈍った（2次β=−0.29）。ばらつき大の条件で取り込みが多かった（β=0.30、95%CI 0.15〜0.45）。一方、ばらつきと鎖の位置の交互作用はなく、ばらつきは削除も増やさなかった（仮説2・3は不支持）。図2A（横軸：鎖の位置、縦軸：取り込み確率）で2条件の差が全体を通じて見える（Results）。", "p6": "記憶に頼る課題で、最後の位置でも取り込まれた情報は平均8.29個にとどまった。参加者は主に大学生と大学職員で、削除は1人1試行あたり平均0.38回と少なく、削除の検定力は低い（Discussion）。", "fun": "みんなが同じことを知っているグループより、少しずつ違うことを知っている人が順番に書き足すほうが、最終的に豊かな文章になりました。会議では「みんなが知っている話」ばかりが話されがちですが、順番に書き直す方式ならその偏りを避けられるかもしれない、というウィキの強みを示す結果です。", "unverified": "原稿に未記入の箇所（材料のリンクなど）があり、付録の情報配分の詳細は未確認。"}}, {"id": "pn14", "rank": 14, "field": "経営学", "headline": "AI企業はAPIで競合アプリにも供給すべきか", "title": "Supplying the Competition:API Pricing and Brand Proliferation in AI Markets", "url": "https://doi.org/10.2139/ssrn.7591318", "authors": "Hongyu Mou ほか", "venue": "SSRN", "date": "2026-10-10", "apa": "Mou, H., Paridar, M., & Zhang, P. (2026). Supplying the Competition:API Pricing and Brand Proliferation in AI Markets. https://doi.org/10.2139/ssrn.7591318", "why": "自社アプリと競合する開発者へのAPI提供条件を、ブランドの増殖と消費者の限られた検討集合のもとでモデル化した。", "explain": {"basis": "抄録", "basis_note": "SSRN版は本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "AIモデルの提供者が、自社の公式アプリと競合する独立開発者にAPIをどんな条件で売るべきかを、参入と消費者の限られた検討集合を含むモデルで分析した（抄録）。", "p2": "APIの提供を制限すれば公式アプリの売上を守れそうだが、開発者は他社のAPIに乗り換えて競争を続けられる。両方の経路で稼げる提供者の最適な条件は明らかでなかった（抄録）。", "p3": "提供者がAPIの方針を選び、開発者が参入と調達先を選び、消費者は一部のアプリだけを検討するモデルを立てた。ブランドの追加は到達範囲を広げることも、競合の提供を押し出すこともある。理論と数値比較で、既存開発者の購入の獲得と追加ブランドの創出を区別する（抄録）。", "p4": "均衡での提供者の利益を、API料金と公式アプリの価格の組合せで比べた。米国App StoreのAIチャットボットのアプリ記録で状況を記述した（抄録）。", "p5": "開発者の参入が競合提供者の公式アプリを検討集合から押し出す場合、公式アプリの価格が固定なら、API料金を下げて参入を促すと得になる。価格も設定できるなら、API料金をほぼ据え置いて公式アプリの価格を上げる方がよい。消費者の価格感応度が高いと大幅なAPI割引が再び最適になる。原価割れのAPI価格は、追加の参入で公式アプリの利益が十分増えるときだけ最適になる（抄録）。", "p6": "理論と数値比較が中心で、App Storeの記録
