 Viewpoints Reorganizes Representations in LLMs", "url": "https://arxiv.org/abs/2611.06848", "authors": "Austin C. Kozlowski ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Kozlowski, A. C., Mintz, A., & Lee, M. (2026). Persona Perspectives: Adopting Viewpoints Reorganizes Representations in LLMs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06848", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "政治的なペルソナを演じさせるとLLM内部の単語表現の幾何が組み替わり、ペルソナなしで作った真偽・道徳の判定器が偏った結果を出すことを示した（抄録）。", "p3": "リベラル・保守のペルソナと2つの中立条件で、9,000語以上の単語と33の意味軸の表現を取り出し、軸への射影と軸どうしの配置を比べた。線形プローブ、SAEに基づく分類器、手で選んだ単語表現の分類器も当てはめた（抄録）。", "p5": "ペルソナ条件は指定したイデオロギーの方向に射影と軸の配置を系統的に変え、ペルソナなしで学習した分類器は論争的な文の真偽と道徳の評価を政治的に偏らせた（抄録）。", "fun": "AIに「保守派の人として考えて」と頼むと、出力の言い回しだけでなく、内部で言葉どうしがどう並んでいるかまで変わる、という発見です。そのため、AIの中身を調べる道具を同じように当てても、演じている立場によって「本当か」「正しいか」の判定がずれてしまいます。点検の道具そのものを見直す必要を示した点が面白いところです。", "unverified": "使ったモデルの種類と規模、偏りの大きさの数値は抄録では未確認。"}}, {"id": "pr18", "rank": 18, "headline": "AIとの対話で陰謀論が減るのは事実の提示による", "title": "Just the Facts: How Dialogues with AI Reduce Conspiracy Beliefs", "url": "https://arxiv.org/abs/2611.05572", "authors": "Thomas H. Costello ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Costello, T. H., Pennycook, G., & Rand, D. G. (2026). Just the Facts: How Dialogues with AI Reduce Conspiracy Beliefs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05572", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "AIとの個別対話が陰謀論への信念を減らす主な理由は、親しみや共感ではなく、関連する事実と論拠の提示であることを示した（抄録）。", "p3": "米国の成人計2,193人の2つの実験で、説得目的の開示、討論形式、説明だけの指示、応答の半減、測定方法の変更、単一の個別メッセージへの置換など、考えられる原因を1つずつ取り除いた（抄録）。", "p5": "効果はこれらの操作のほとんどで保たれ、事実や論拠を使わずに説得するよう指示したときだけ大きく弱まった。AIの出力と参加者の説明の内容分析でも、信念の低下は事実に基づく論証と結びついていた（抄録）。", "fun": "陰謀論を信じる人をAIとの会話で説得できる、という先行の結果がありました。では、AIの何が効いたのか。親しげな語り口か、寄り添う姿勢か。条件を一つずつ外していくと、残った決め手は「関連する証拠をきちんと示すこと」でした。人間でも同じ証拠を示せれば同じように効くかもしれない、という示唆も面白い点です。", "unverified": "信念の低下幅（効果量）の数値は抄録では未確認。"}}, {"id": "pr19", "rank": 19, "headline": "予測の多重性の下で頑健な救済策を最適化", "title": "Optimizing Recourse Under Predictive Multiplicity", "url": "https://arxiv.org/abs/2611.05774", "authors": "Shahin Jabbari", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Jabbari, S. (2026). Optimizing Recourse Under Predictive Multiplicity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05774", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "性能が同程度の複数のモデルで予測が食い違うときにも有効な救済策（不利な予測を好ましい側に変える入力の変更）を、最悪の場合の失敗を最小にする問題として解く方法を示した（抄録）。", "p3": "線形・ニューラル・混合・決定木のモデルからなる競合集合について、予算制約付きの最悪ケースの有効性損失の最小化として定式化し、オラクル効率的なアルゴリズムORPMと収束の十分条件を示した。合成データ1つと実データ5つで評価した（抄録）。", "p5": "最適化ギャップの上界が減少し、多くの設定で高い有効性と、特定のモデル種類向けの比較手法に対する良好な性能を示した。全モデルに共通の行動を求めたときの成功率の変化と、人口集団間の差も調べた（抄録）。", "fun": "たとえば審査で不利な判定が出た人に「この項目がもう少し良ければ通る」と助言しても、判定に使うAIが入れ替われば通らないかもしれません。同じくらい賢いAIでも、一人ひとりへの判定は意外と食い違うからです。どのAIでも通用する助言を、使える手間の範囲で探すという問題設定が面白いところです。", "unverified": "実データの名称と、集団間の差の大きさは抄録では未確認。"}}, {"id": "pr20", "rank": 20, "headline": "内力を自由度に含むTimoshenko梁の新要素", "title": "A novel mixed-variable beam element and its application on the free vibration of Timoshenko beam", "url": "https://doi.org/10.21203/rs.3.rs-11226309/v1", "authors": "Lv Ding ほか", "venue": "Research Square (In Review)", "date": "2026-11-05", "apa": "Ding, L., Xia, X., Bao, S., & Wang, S. D. (2026). A novel mixed-variable beam element and its application on the free vibration of Timoshenko beam. https://doi.org/10.21203/rs.3.rs-11226309/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "せん断力と曲げモーメントも節点の自由度に含めた2節点8自由度のTimoshenko梁要素を提案し、固有振動数と内力を高い精度で求められることを示した（抄録）。", "p3": "混合変数の有限要素法の枠組みで、たわみ・断面回転・せん断力・曲げモーメントを節点自由度とし、3次のHermite補間関数に基づく2つの変位場から剛性行列と質量行列を導いた。3種類の典型的な境界条件と異なるメッシュで自由振動を解析した（抄録）。", "p5": "既往の結果との比較で、同じ補間次数の従来のTimoshenko梁要素に比べて誤差がおおむね半分以下になった。節点の内力が変位と同時に得られ、せん断力と曲げモーメントの分布は解析解と一致した（抄録）。", "fun": "梁（はり）をコンピュータで計算するとき、ふつうは「どれだけ曲がるか」を先に求め、「どれだけ力がかかっているか」は後から計算します。この研究は、力そのものも最初から計算の主役に入れる要素を作り、同じ細かさの分割でも誤差をおおむね半分以下にしました。発想を少し変えるだけで精度が上がる例として面白い研究です。", "unverified": "比較した既往の結果の出典と、計算コストの比較は抄録では未確認。"}}, {"id": "pr21", "rank": 21, "headline": "検証の関門を通った層だけ使うデジタルツイン", "title": "Evidence-gated digital twins for energy systems: field-validated heat-pump flexibility with online conformal bounds", "url": "https://doi.org/10.5281/zenodo.23965941", "authors": "Razmjoo, Armin", "venue": "Zenodo", "date": "2026-11-04", "apa": "Razmjoo, A. (2026). Evidence-gated digital twins for energy systems: field-validated heat-pump flexibility with online conformal bounds. Zenodo. https://doi.org/10.5281/ZENODO.23965941", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録（DataCite登録）の抄録を使用", "preprint": true, "short": true, "p1": "各層が事前に決めた検証を通過したときだけ使う関門つきのデジタルツインで、ヒートポンプの需要シフトの申し出が守られるかを、英国66世帯の実データで検証した（抄録）。", "p3": "2026年1〜10月の公開1分値データの全対象世帯に、新しい世帯へモデルを当てはめる前に固定した選定規則と分析計画を適用した。1時間先のヒートポンプ電力の層、1節点の貯湯槽ツイン、温度の下限を与える分割・適応的コンフォーマル区間を検証した（抄録）。", "p5": "制約のない勾配ブースティングの層は検証できた61世帯すべてで関門を通らず、物理制約を入れた層は63世帯中45世帯で通過した（事後）。分割コンフォーマルの下限が名目水準の±2ポイント以内だった世帯は28%、適応的な下限では94%だった（抄録）。", "fun": "「この時間はお湯をわかすのを後回しにします」と申し出ても、守れなければ価値がありません。この研究は、AIの予測をそのまま信じるのではなく、各段階が事前に決めた試験に合格したときだけ使う仕組みを試しました。物理の制約を入れない機械学習は試験にまったく通らなかった、という結果が象徴的です。", "unverified": "未査読のプレプリント（Nature Communicationsに投稿中と記載）。各層のモデル構造と試験の基準の詳細は抄録では未確認。"}}, {"id": "pr22", "rank": 22, "headline": "グラフ基盤モデルで多変量時系列の異常検知", "title": "Graph Foundation Models Can Become Effective Multivariate Time Series Anomaly Detectors", "url": "https://arxiv.org/abs/2611.06441", "authors": "Zhuangyan Hu ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Hu, Z., Liang, Z., Li, W., Jia, X., Youssef, M., & Helal, S. (2026). Graph Foundation Models Can Become Effective Multivariate Time Series Anomaly Detectors (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06441", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "事前学習済みのグラフ基盤モデル（GFM）を多変量時系列の異常検知に転用する枠組みGfm4Mtsadを提案した（抄録）。", "p3": "連続時系列をGFMの表現空間につなぐ整合モジュール（SICA）、正常の境界近くの難しい疑似異常を選ぶ教師なし学習の戦略（MAPS）、ノードから時間窓への集約の歪みを除く較正（TGEC）の3つを組み合わせた（抄録）。", "p5": "2つのGFMを基盤とした広範な評価で、既存の手法を上回る検出性能を示したと述べる（抄録）。", "fun": "多数のセンサの記録から「いつもと違う」瞬間を見つけるには、時間の流れとセンサ同士のつながりの両方を見る必要があります。この研究は、大量のグラフで事前に学習したAIの「つながりを見る目」を借りてくる発想です。ただし抄録には具体的な数値がなく、どれだけ良くなったかは本文で確かめる必要があります。", "unverified": "評価に使ったデータセットの名称と性能の数値は抄録では未確認。"}}, {"id": "pr23", "rank": 23, "headline": "アルゴリズム管理が配達労働の不平等を生む仕組み", "title": "Algorithmic Management and Inequality in the Gig Economy: A Conceptual Framework for Mechanism-Targeted Governance in Bogotá", "url": "https://doi.org/10.21203/rs.3.rs-11350563/v1", "authors": "Shruthaalaxmi . ほか", "venue": "Research Square (In Review)", "date": "2026-11-05", "apa": "., S., Radhakrishnan, M., & Devesh, S. (2026). Algorithmic Management and Inequality in the Gig Economy: A Conceptual Framework for Mechanism-Targeted Governance in Bogotá. https://doi.org/10.21203/rs.3.rs-11350563/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "配達プラットフォームのアルゴリズム管理が、労働者の不利な境遇をデータとして取り込み、配分や制裁の判断を通じて将来の機会に変換する仕組みを概念的に整理した（抄録）。", "p3": "プラットフォーム資本主義やアルゴリズムによる統制の研究、Fairwork Colombiaの評価、ボゴタの研究を解釈的に統合し、Kelloggらの「6つのR」の管理機能と、自動化の程度・適応的な個別化・不透明性の3つの性質で枠組みを作った（抄録）。", "p5": "非正規性・移民資格・周縁部の居住などの構造的な不利が文脈を無視した評価指標に符号化されると論じ、管理機能と介入点を結ぶ7つの検証可能な命題を示した。実証研究ではない（抄録）。", "fun": "配達アプリの評価の点数は公平な物差しに見えます。でも、住んでいる地区などの境遇が低い評価につながり、それが仕事の割り当てを減らすなら、過去の不利が未来の不利を生む循環になります。この研究は、その循環がどの段階で起きるかを分解し、ルールで止められる場所を探そうとしています。", "unverified": "7つの命題の具体的な内容は抄録では未確認。実証データによる検証は行っていない。"}}, {"id": "pr24", "rank": 24, "headline": "NHS精神保健サービスのハイブリッド勤務の実態", "title": "Understanding Hybrid Working in NHS Mental Health Services: Implications for Productivity, Wellbeing and Workforce Sustainability", "url": "https://doi.org/10.21203/rs.3.rs-11268314/v1", "authors": "Sai-Bo Cheung ほか", "venue": "Research Square (In Review)", "date": "2026-11-05", "apa": "Cheung, S.-B., Nilforooshan, R., & Cropley, M. (2026). Understanding Hybrid Working in NHS Mental Health Services: Implications for Productivity, Wellbeing and Workforce Sustainability. https://doi.org/10.21203/rs.3.rs-11268314/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "英国NHSの精神保健サービスで、ハイブリッド勤務が職員のwell-being・働き方・定着にどう影響するかを質的に明らかにした（抄録）。", "p3": "イングランドの11の精神保健サービスの臨床・非臨床の職員21人に、2024年12月〜2025年2月に遠隔で半構造化面接を行い、再帰的テーマ分析をした（抄録）。", "p5": "「柔軟性・信頼・組織文化」と「生産性・well-being・定着」の2つのテーマが得られた。在宅は集中作業、職場は協働に向き、在宅は感情的に負担の大きい仕事からの休息になる一方、境界のあいまいさと連続するオンライン会議が過重労働の危険を生んだ（抄録）。", "fun": "在宅勤務は「サボりやすい」と思われがちですが、心のケアの現場で働く人にとっては、つらい話を聞き続ける仕事からひと息つける場所でもありました。一方で、家と職場の境目が消えると働きすぎにつながります。柔軟な働き方が上司からの信頼の表れとして受け止められ、ルールの運用が人によって違うと信頼が損なわれる、という点も身近な発見です。", "unverified": "抄録の事前登録番号は伏せ字（XXXXXX）で、登録内容は未確認。"}}, {"id": "pr25", "rank": 25, "headline": "変則交差点を運転者参加型のデジタルツインで評価", "title": "InterSim: Innovative Intersection Digital Twins for Human-in-the-Loop Driving Simulation", "url": "https://arxiv.org/abs/2611.05968", "authors": "Luyang Jiang ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Jiang, L., Wei, C., Li, Y., Wang, S., Zhou, Y., Yun, H., Liao, X., Pitts, B., & Wang, Z. (2026). InterSim: Innovative Intersection Digital Twins for Human-in-the-Loop Driving Simulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05968", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "Unityのゲームエンジンで変則的な交差点のデジタルツインを作り、人の運転者や自動運転アルゴリズムを同じ条件で走らせて評価できるシミュレータInterSimを示した（抄録）。", "p3": "道路管理者の設計・交通データから交差点のツインを作り結果を返すデジタルツインの循環と、人または自動運転が自車を操作する人間参加型の循環の2つを結んだ（抄録）。", "p5": "事例として、交錯を減らす交差点と標準の交差点の侵入後時間（PET）の分布を交通量別に比べる代理安全性の研究と、路車間情報を使うルールベースのエージェントと人のエコドライブを比べる研究を示し、排出と運転行動の違いを見いだした（抄録）。", "fun": "見慣れない形の交差点は、安全で効率的でも、最初は運転者が戸惑うかもしれません。実際に作って試すのは高くつくので、ゲームエンジンの中にそっくりの交差点を作り、人に運転してもらって確かめる、という発想です。人と自動運転を同じ条件で走らせて比べられる点も面白いところです。", "unverified": "事例研究の具体的な数値（PETの差や排出量）は抄録では未確認。"}}, {"id": "pr26", "rank": 26, "headline": "議員の株取引に委員会情報の優位はない", "title": "The Illusion of Informed Congressional Trading: Evidence from Committee Networks and Hearings", "url": "https://doi.org/10.2139/ssrn.7679885", "authors": "Yuan Zhou", "venue": "SSRN", "date": "2026-11-05", "apa": "Zhou, Y. (2026). The Illusion of Informed Congressional Trading: Evidence from Committee Networks and Hearings. https://doi.org/10.2139/ssrn.7679885", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "米議会議員が担当委員会に近い企業の株取引で超過収益を得ている証拠は見当たらないことを、LLMで企業と委員会の対応を測って示した（抄録）。", "p3": "LLMで企業の10-Kの事業概要を議会委員会の管轄に対応づけ、企業と議員の情報の近さを連続的な指標にした。公聴会の後の取引、委員会をまたぐ波及、コロナ禍のオンライン公聴会への移行（対面の情報共有への外生的ショック）も調べた（抄録）。", "p5": "担当分野に近い銘柄の取引でも超過収益はなく、公聴会の後も成績は改善せず、取引規模や報告の遅れを変えても同じだった。オンライン化の前後でも取引の成果に系統的な変化はなかった（抄録）。", "fun": "議員は法律づくりの過程で企業の事情に触れるので、株でもうけているのでは、という疑いはよく話題になります。この研究は、AIに企業の事業説明を読ませて「どの委員会と関係が深い会社か」を数値にし、その疑いを確かめました。少なくとも日常的な議会活動からは、もうけの証拠は出てこなかったという結果です。", "unverified": "標本期間と取引件数、LLMによる対応づけの精度は抄録では未確認。"}}, {"id": "pr27", "rank": 27, "headline": "小標本の表データをコピュラとVAEで合成", "title": "Copula and mixture prior variational autoencoders for small sample blasting fragmentation modelling", "url": "https://doi.org/10.31224/8715", "authors": "Paulo Lopes", "venue": "engrXiv", "date": "2026-11-05", "apa": "Lopes, P. (2026). Copula and mixture prior variational autoencoders for small sample blasting fragmentation modelling. https://doi.org/10.31224/8715", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "engrXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "観測の少ない発破破砕のデータで、コピュラと3種類の表データVAEによる合成データを比べ、混合事前分布のVAEが最も高い予測効用を示した（抄録）。", "p3": "3つの文献から集めた262件の破砕ベンチマークで、ガウス・t・クレイトンのコピュラと、標準・KLアニーリング・ガウス混合事前分布のVAEを比べた。生成器の学習前に実データの検証用を分け、尤度、MMD、埋め込み距離、合成で学習し実データで試す効用を組み合わせた（抄録）。", "p5": "混合事前分布のモデルが最も高く、R²は約0.736、RMSEは約1.698（破砕指標の単位）だった。アニーリングは標準モデルより効用を改善し、コピュラ由来の入力はおおむね性能を下げた。実データだけの予測器に対する上積みや未知の鉱山への移転は示していない（抄録）。", "fun": "データが少ない分野では「本物そっくりの偽データを作って増やせばよいのでは」と考えたくなります。この研究は、偽データが本物に似ているかと、偽データで学んだ予測が本物に通用するかは別の問いだ、と分けて確かめています。著者が自分の結果の限界まで細かく書いている点も誠実で面白いところです。", "unverified": "6変数の効用の枠組みとコピュラの8次元の食い違いは著者も限界として挙げており未解消。シードごとの結果は不完全と記載。"}}, {"id": "pr28", "rank": 28, "headline": "小規模事業の会計と税務で生成AIが失敗する点", "title": "Keeping the Human in the Loop: Failure Points of Generative AI in Small-Business Accounting and Tax Compliance", "url": "https://doi.org/10.37497/opsbrazil.51", "authors": "Edson Teles Victor", "venue": "Editora Alumniin", "date": "2026-11-05", "apa": "Victor, E. T. (2026). Keeping the Human in the Loop: Failure Points of Generative AI in Small-Business Accounting and Tax Compliance. https://doi.org/10.37497/opsbrazil.51", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "Editora Alumniinの記録で、抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、小規模事業の会計と税務申告で生成AIが失敗しやすい点を整理し、人が判断に関わり続ける必要を論じる研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名が問うのは、会計や税金の書類づくりに生成AIを使ったとき、どこで失敗しやすく、どこに人の目が欠かせないかという点です。計算が得意なはずのコンピュータに任せても人の確認がいる場面があるのか、という問いそのものが身近で面白いところです。", "unverified": "内容は題名からの推測で、手法・結果・掲載形態（論文か書籍の章か）は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "マグマ貫入による火山体斜面の不安定化を数値解析", "title": "Numerical Modeling of Volcanic Flank Instabilities Induced by Magmatic Intrusions", "url": "https://theses.hal.science/tel-05852863v1", "authors": "Michael Galarraga", "venue": "HAL", "date": "2026-11-05", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "HALに登録された博士論文の抄録を使用", "preprint": true, "short": true, "p1": "マグマの貫入が火山体の斜面をどう変形させるかを個別要素法（DEM）で再現し、メラピ火山の2020年の危機とセントヘレンズ山の1980年の崩壊の変形の特徴を説明した（抄録）。", "p3": "メラピではマグマで満たされた割れ目と溶岩ドーム、セントヘレンズでは潜在ドームを与えたDEMモデルを作り、変形の速さと動き方を観測と比べた（抄録）。", "p5": "メラピでは山頂から深さ約500 mまでの北西斜面の非弾性変形を再現し、すべりが止まって新たな安定状態に達する様子も示した。セントヘレンズでは北傾斜の主要なせん断断層、斜めのマグマの押しによる北斜面の膨らみ、山頂の地溝の形成を再現した（抄録）。", "fun": "火山の斜面は、内部にマグマが入り込むと押し出されるように動きます。メラピ火山では斜面が大きく動いたのに崩れず、セントヘレンズ山では山腹が丸ごと崩れました。粒の集まりとして山を計算すると、その違いを再現できるという点が面白く、斜面が大きく変形しても必ず崩れるとは限らないことも示しています。", "unverified": "博士論文で、モデルの粒子数や物性の設定は抄録では未確認。"}}, {"id": "pr30", "rank": 30, "headline": "地すべりの種類を自動分類するPythonソフト", "title": "Brief communication: Landsifier 2 – Python-based Software for Automated Landslide Type Classification", "url": "https://doi.org/10.5194/egusphere-2026-6509", "authors": "Nico Schlauf ほか", "venue": "EGUsphere", "date": "2026-11-05", "apa": "Schlauf, N., Bhuyan, K., Kapoor, M., Nava, L., Rana, K., Aral, A., & Ozturk, U. (2026). Brief communication: Landsifier 2 – Python-based Software for Automated Landslide Type Classification. https://doi.org/10.5194/egusphere-2026-6509", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EGUsphereの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "地すべり台帳の多角形データに移動形態と誘因の推定を加えるオープンソースのPythonライブラリLandsifier 2を公開した（抄録）。", "p3": "3次元の形状、位相的な記述子、設定できる分類器を使い、既存の誘因判定に移動形態の予測、利用者が定める分類、クラス確率付きの空間出力を加えた（抄録）。", "p5": "独立にラベル付けされた台帳と未記載の台帳への適用で柔軟性を示したと述べるが、分類精度の数値は抄録にない（抄録）。", "fun": "地すべりの地図には「どこで起きたか」は載っていても、「どう動いたか」「何が引き金か」が書かれていないことが多いそうです。この道具は、地すべりの形の立体的な特徴から、その種類を推定して地図に書き足します。形から過去の動きを推理する、という発想が面白いところです。", "unverified": "分類の正答率などの数値は抄録では未確認。"}}, {"id": "pr31", "rank": 31, "headline": "先行降雨と被災状況から見る地すべり死者", "title": "Antecedent rainfall patterns and situational vulnerability of victims of rainfall-induced fatal landslides in Pakistan", "url": "https://doi.org/10.5194/egusphere-2026-6563", "authors": "Shibiao Bai ほか", "venue": "EGUsphere", "date": "2026-11-05", "apa": "Bai, S., Zhu, W., Wang, X., & Zhou, P. (2026). Antecedent rainfall patterns and situational vulnerability of victims of rainfall-induced fatal landslides in Pakistan. https://doi.org/10.5194/egusphere-2026-6563", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EGUsphereの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "パキスタンの降雨による死者を伴う地すべりで、雨の指標は事象ごとの死者数を説明せず、死者は夜間・屋内に集中していたことを示した（抄録）。", "p3": "2004〜2024年の台帳で位置精度I〜IIの250件中213件をCHIRPSの日雨量（0.05°）と照合し、2018〜2024年の死者309人の個人属性を集めた。当日と7日間の先行雨量で4つの類型に分けた（抄録）。", "p5": "53.5%の事象はCHIRPSで当日雨量がゼロで、当日雨量の少ない類型CとDが86.4%を占めた。雨の指標は事象ごとの死者数と有意に相関しなかった。場所の分かる死者の66.0%は屋内、時刻の分かる死者の74.5%は夜間だった（抄録）。", "fun": "大雨の日に地すべりが起きる、と考えがちですが、この台帳では半数以上の事例で、推定された当日の雨量はゼロでした。それより前に降った雨の積み重ねが効いていたことになります。さらに、亡くなった人の多くは夜に家の中にいました。警報は雨の量だけでなく「夜に家にいる人をどう逃がすか」まで考える必要がある、という点が身近な発見です。", "unverified": "台帳は死者数の下限推定（複合災害で地すべりによる死者が埋もれる）と著者が注記。CHIRPSによる雨量の過小評価の程度は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "テンソルネットワークで計算力学の境界値問題を解く", "title": "A Tensor-Network Chebyshev-Galerkin Method for Boundary-Value Problems in Computational Mechanics", "url": "https://arxiv.org/abs/2611.06552", "authors": "Juan Jos\\'e Rodr\\'iguez-Aldavero ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Rodríguez-Aldavero, J. J., Velasco, Á. de la R., & García-Ripoll, J. J. (2026). A Tensor-Network Chebyshev--Galerkin Method for Boundary-Value Problems in Computational Mechanics (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06552", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "圧縮したテンソルトレイン（QTT）の形のままでChebyshev-Galerkin法の大域スペクトル系を組み立てて解く方法を示し、パラメータ空間全体の解を1回の計算で得られるようにした（抄録）。", "p3": "弱形式から出発し、変数係数の連成楕円型系、滑らかに写像した形状、DirichletとRobinの混合境界条件を扱い、テンソルネットワークの変分ソルバーに適した対称正定値系を得る。パラメータや確率的な入力は追加の座標として入れる（抄録）。", "p5": "線形弾性の3次元ベンチマークで誤差10^-8未満に達し、試した範囲でQTT差分法やFEniCSxのQ2/Q4有限要素を上回った。1.7×10^7通りの6パラメータの片持ち梁の設計検討を92秒の1回の計算で解き、確率座標10個の問題を全係数配列の2.4×10^6分の1のメモリで表した（抄録）。", "fun": "変数がとても多い問題は、ふつうはコンピュータのメモリに入りきりません。この研究は、データをぎゅっと圧縮した形のまま計算を進める工夫で、一千万通りを超える設計案を1回の計算でまとめて解きました。量子コンピュータの考え方を借りた計算法が、普通のコンピュータで構造の問題に役立つという点が面白いところです。", "unverified": "テンソルのランクや計算機環境の詳細は抄録では未確認。"}}, {"id": "pr33", "rank": 33, "headline": "適応的な領域分割でPINNの精度を上げる", "title": "Adaptive Domain Decomposition for Finite Basis Physics-Informed Neural Networks", "url": "https://arxiv.org/abs/2611.05659", "authors": "Sarah Helfert ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Helfert, S., Chen, W., Howard, A. A., Stinis, P., & Heinlein, A. (2026). Adaptive Domain Decomposition for Finite Basis Physics-Informed Neural Networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05659", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "解の特徴に合わせて計算領域の分け方を自動で学ぶことで、有限基底の物理情報ニューラルネット（FBPINN）の精度を上げる方法ADD-FBPINNを示した（抄録）。", "p3": "領域の分割をデータから学ぶPartition of Unity Network（POUNet）の分離可能な版を、利用者が分割を決めるFBPINNに組み合わせ、安定で幾何的に解釈できる分割を自動で得る（抄録）。", "p5": "2次元のHelmholtz方程式、多重スケールの特徴を持つ2次元のPoisson方程式、粘性Burgers方程式で、分割を固定したFBPINNより精度が改善したと述べる（抄録）。", "fun": "ニューラルネットで物理の方程式を解くとき、全体を一つで解くより、場所ごとに担当を分けた方がうまくいくことがあります。問題は「どこで区切るか」を人が決めていたことでした。この研究は、解の形を見ながら区切り方そのものをAIに学ばせる、という一段上の自動化が面白いところです。", "unverified": "精度の改善幅の数値と計算時間の比較は抄録では未確認。"}}, {"id": "pr34", "rank": 34, "headline": "ドリフト拡散で重い裾のPearson IV型分布を導く", "title": "A Drift-Diffusion Approach for Pearson Type IV Heavy-Tail Distributions", "url": "https://arxiv.org/abs/2611.06749", "authors": "Daniele Belardinelli ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Belardinelli, D., Benella, S., Stumpo, M., & Consolini, G. (2026). A Drift-Diffusion Approach for Pearson Type IV Heavy-Tail Distributions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06749", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "線形のドリフトと2次の拡散を持つ標準化したフォッカー・プランク方程式の定常解としてPearson IV型分布を導き、重い裾と非対称性の起源を分けて示した（抄録）。", "p3": "この分布が現れる必要十分条件を示し、線形-2次の構造は十分だが必要ではないことを示した。累積分布関数、モーメントの漸化式、歪度、尖度、最頻値の閉じた式も与えた（抄録）。", "p5": "重い裾は状態に依存する拡散の局所的な非線形の曲率から、非対称性はその勾配から生じ、対称な線形の復元ドリフトでも非対称な定常揺らぎが現れうることを示した。宇宙プラズマの乱流などを対象に挙げる（抄録）。", "fun": "ばねに引き戻されながら揺れる粒を考えると、ふつうは左右対称の釣鐘型の分布に落ち着きます。ところが、揺さぶられ方の強さが場所によって変わると、分布の片側が長く伸びたり、裾が重くなったりします。そのどちらがどの性質から生まれるのかを式で切り分けた点が面白いところです。", "unverified": "観測データへの当てはめの結果は抄録では未確認。"}}, {"id": "pr35", "rank": 35, "headline": "体積を保存する非線形自由表面波の有限要素法", "title": "A volume-conserving ALE continuous Galerkin method with residual-based Dirichlet--Neumann fluxes for nonlinear free-surface waves", "url": "https://arxiv.org/abs/2611.06408", "authors": "Fan Wang ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Wang, F., Xia, Y., & Xu, Y. (2026). A volume-conserving ALE continuous Galerkin method with residual-based Dirichlet--Neumann fluxes for nonlinear free-surface waves (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06408", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "2次元の完全非線形の自由表面ポテンシャル流れを、離散的な流体体積を保存するALE連続ガラーキン有限要素法で解く方法を示した（抄録）。", "p3": "現在の流体領域でアイソパラメトリック有限要素法により内部のポテンシャルを求め、残差に基づくDirichlet-Neumannフラックスで表面を発展させる。適合するメッシュ移動・表面射影・数値積分と組み合わせ、6次の表面散逸（任意）と4次のRunge-Kutta法を使う（抄録）。", "p5": "線形の自由表面波で期待どおりの空間収束を確かめ、平坦・湾曲した底面上の非線形波でメッシュへの依存性が小さいことを示した。回転する造波機の例で動く固体境界の扱いも示した（抄録）。", "fun": "水の表面の波を計算するとき、方法によっては誤差が積み重なって、いつの間にか水の量が増えたり減ったりしてしまうことがあります。この研究は、計算の仕組みそのものに「水の量は変わらない」というきまりを組み込みました。保存則を数値計算でも守らせる工夫が面白いところです。", "unverified": "誤差や収束次数の具体的な数値は抄録では未確認。"}}, {"id": "pr36", "rank": 36, "headline": "高コントラスト多孔質流れの粗空間を学習", "title": "Learning Coarse Spaces for Two-Grid Methods from Smoothed Errors with Applications to High-Contrast Porous Media Flow", "url": "https://arxiv.org/abs/2611.05837", "authors": "Chenglong Bao ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Bao, C., Cui, C., & Li, R. (2026). Learning Coarse Spaces for Two-Grid Methods from Smoothed Errors with Applications to High-Contrast Porous Media Flow (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05837", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "加法シュワルツ平滑化の有限ステップの誤差から二格子法の粗空間を学習し、パラメータが変わる高コントラストの多孔質流れでも粗空間を作り直す手間を減らす方法を示した（抄録）。", "p3": "訓練パラメータごとに平滑化後の誤差のスナップショットを離散エネルギー内積でPODして基準の粗空間を作り、基底に依存しない白色化した部分空間の損失で連続座標のニューラル生成器を学習する。粗空間のずれと二格子作用素の関係の摂動評価も示した（抄録）。", "p5": "高コントラストの界面問題、界面が動くDarcy流れ、非線形のForchheimer流れで有効な性能を示した。訓練格子の約264倍の自由度を持つ最も細かい試験格子で、FGMRESの反復回数はパラメータ別のPOD基準に近く、GenEOの空間と同程度だった（抄録）。", "fun": "地下の地層は場所によって水の通りやすさが大きく違い、流れの計算がとても遅くなることがあります。速く解くための「粗い近似の空間」を毎回作り直すのは大変なので、作り方をAIに学ばせ、見たことのない細かい格子にも使い回せるようにしました。学習に使った格子より約264倍細かい問題でも通用した点が面白いところです。", "unverified": "計算時間の削減の具体的な数値は抄録では未確認。"}}, {"id": "pr37", "rank": 37, "headline": "顧客対応LLMを既知の正解で出荷前に検査", "title": "QuasiPersona: behavioral release testing of LLM assistants on known-truth material from a business domain — method and a worked example", "url": "https://doi.org/10.5281/zenodo.23963747", "authors": "Terribile, Marco", "venue": "Zenodo", "date": "2026-11-04", "apa": "Terribile, M. (2026). QuasiPersona: behavioral release testing of LLM assistants on known-truth material from a business domain — method and a worked example (Version 1). Zenodo. https://doi.org/10.5281/ZENODO.23963747", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録（DataCite登録）の抄録を使用", "preprint": true, "short": true, "p1": "顧客対応に組み込まれたLLM助手を、依頼者の業務資料に基づく正解つきの問題で出荷前に検査する手法QuasiPersonaを示した（抄録）。", "p3": "6つの構成層×10の逸脱ガイドワード（HAZOP由来）の網羅行列、4つの妥当性尺度と14特性の行動的な性格検査、名前をつけた失敗キャラクター、検査に基づく指示の書き換え（療法）、未処置の複製に同じ質問票を与える双子対照を組み合わせた（抄録）。", "p5": "9つの欠陥を仕込んだ保険の助手で1,213回実行し、7つの欠陥と8つ目の一部を検出した（9つ目は一度も起動されなかった）。双子対照により、6特性の見かけの変化の多くは質問票の効果だと分かった（抄録）。", "fun": "AIの性格テストは、ふつうAIのモデルだけを相手に行います。でも実際の窓口のAIは、指示書や検索の仕組みと一体になって動いています。この研究は製品として組み上がった姿を丸ごと試験し、さらに「治療」の効果と「同じ質問に慣れた効果」を、手を加えない双子と比べて見分けました。発達心理学の双子の考え方を借りた点が面白いところです。", "unverified": "Zenodo上の未査読の文書。例は構成した保険の助手で、実際の運用データでの検証は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "ペルソナ付きの対話でコーディングエージェントを評価", "title": "PersonaCodeBench: Evaluating Coding Agents in Persona-driven Human-Interactive Sessions", "url": "https://arxiv.org/abs/2611.05739", "authors": "Haixin Wang ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Wang, H., Hou, J., Shen, H., Fan, W., Huang, W.-C., Zhu, Q., Li, W., Li, T., Yao, Y., Wang, R., Peng, Z., Jiang, W., Chen, Y., Liang, S., Li, H., Cao, D., Hu, X., Wu, S., Yang, C., … Li, X. (2026). PersonaCodeBench: Evaluating Coding Agents in Persona-driven Human-Interactive Sessions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05739", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "利用者の特性を検証できる義務に変え、ペルソナに基づく多ターンの対話でコーディングエージェントが個別の要求を満たせるかを評価するベンチマークを作った（抄録）。", "p3": "役割・技術力・対話の好み・実務上の制約からなるペルソナで、実装・権限・テスト・説明・納品の要求が段階的に現れる。制御器が利用者シミュレータの応答と要求の開示を管理し、完了の検証器とペルソナ充足の検証器が別々に評価する（抄録）。", "p5": "主要な最先端のエージェントをすべて評価して順位表を作り、詳細な実験分析で有効性を確かめたと述べる（抄録）。", "fun": "同じプログラムを頼むにしても、初心者と熟練者では欲しい説明の量も、任せてよい範囲も違います。この評価は、相手の人柄や事情に合わせた仕事ができるかを、正しく動くかとは別に採点します。AIに「相手を見て働く力」を求める点が面白いところです。", "unverified": "各エージェントの成績の数値は抄録では未確認。"}}, {"id": "pr39", "rank": 39, "headline": "道徳的選好に合わせたAI助言の効果", "title": "Strategically (Im)moral: Stated Preferences in Personalized AI Advice", "url": "https://doi.org/10.2139/ssrn.7679999", "authors": "Julia Elisabeth Rose", "venue": "SSRN", "date": "2026-11-05", "apa": "Rose, J. E. (2026). Strategically (Im)moral: Stated Preferences in Personalized AI Advice. https://doi.org/10.2139/ssrn.7679999", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "表明した道徳的選好に基づく個別化AI助言は、判断をAIに任せたときの道徳的な選択の減少を補えず、人は助言を自分に都合よくするために選好を弱めて答えることを示した（抄録）。", "p3": "事前登録した実験で1,250人が、寄付なしで利益を最大にする選択肢とUNICEFに寄付する費用の高い選択肢から、自分で選ぶか、利益最大化または寄付最大化のアルゴリズムに任せた。構造化質問と自由記述で選好を聞く個別化助言を比べた（抄録）。", "p5": "委任は道徳的な選択を約13ポイント減らし、個別化助言はこの減少を相殺しなかった。回答が助言に使われると知ると構造化質問での道徳的選好は弱まり、知らせないと道徳的な選択は委任なしの水準近くに戻った（抄録）。", "fun": "「あなたの価値観に合った助言をします」と言われると、人は自分に都合のよい助言が出るように、答えを少し曲げてしまうようです。しかも本人は自分の価値観に従っているつもりのまま。助言の仕組みを正直に知らせるほど入力がゆがむ、という板挟みが面白いところです。", "unverified": "SSRNの未査読論文。選好の弱まりの大きさの数値は抄録では未確認。"}}, {"id": "pr40", "rank": 40, "headline": "社会関係資本と信仰がメコンの気候適応を支える", "title": "Assessing social capital, religious beliefs, and climate resilience among rural coastal households in the Vietnamese Mekong Delta", "url": "https://doi.org/10.21203/rs.3.rs-11121634/v1", "authors": "Duong Hoang Loc ほか", "venue": "Research Square (In Review)", "date": "2026-11-04", "apa": "Loc, D. H., Duy, D. T., & Da, C. T. (2026). Assessing social capital, religious beliefs, and climate resilience among rural coastal households in the Vietnamese Mekong Delta. https://doi.org/10.21203/rs.3.rs-11121634/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ベトナム・メコンデルタの沿岸農家で、社会関係資本が宗教的信念を通じて宗教的実践と気候変動への適応を高めるという関係を示した（抄録）。", "p3": "沿岸の農家335世帯の調査データにAMOS 20の構造方程式モデリングを当てはめ、構造的・関係的・認知的な社会関係資本、宗教的信念、宗教的実践、適応の関係を検証した（抄録）。", "p5": "仮説としたすべての関係が統計的に有意で、社会関係資本は宗教的信念を高め、信念は宗教的実践と気候変動への適応を高めた（抄録）。", "fun": "地域で気候の変化に備えるとき、役所の計画だけでなく、人と人のつながりや信仰の場も支えになりえます。この研究は、近所づきあいや信頼が信仰を強め、それが適応の行動につながるという道筋を数字で確かめようとしました。宗教のネットワークを地域づくりの資源とみる視点が面白いところです。", "unverified": "横断調査のため因果の向きは確定できない（解釈）。各経路の係数の大きさは抄録では未確認。"}}, {"id": "pr41", "rank": 41, "headline": "認知機能が低下した高齢者の介護者のストレス", "title": "Title of the article: Perceived Stress, Coping Mechanisms, and Associated Factors Among Caregivers of Cognitively Impaired Elderly Attending a Rural Secondary Care Facility in Eastern India: A Mixed-Methods Study", "url": "https://doi.org/10.21203/rs.3.rs-11377226/v1", "authors": "Abhisek Mishra ほか", "venue": "Research Square (In Review)", "date": "2026-11-06", "apa": "Mishra, A., Tripathy, D., S, R. A., Parida, S., & Singh, A. (2026). Title of the article: Perceived Stress, Coping Mechanisms, and Associated Factors Among Caregivers of Cognitively Impaired Elderly Attending a Rural Secondary Care Facility in Eastern India: A Mixed-Methods Study. https://doi.org/10.21203/rs.3.rs-11377226/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "インド東部の農村の二次医療施設で、認知機能が低下した高齢者の介護者の54.3%が高い知覚ストレスを抱え、介護の自己効力感の低さが唯一の独立した予測因子だったことを示した（抄録）。", "p3": "高齢者クリニックで81人を連続的に募り、PSS-10、CSES-8、Lawton-BrodyのIADL尺度で測って多変量ロジスティック回帰を行い、6人の介護者への詳細面接（現象学的研究）と三角測量した（抄録）。", "p5": "高いストレスは自己効力感の欠如（中央値7）より無力感（中央値10）が主で、自己効力感の低さは高ストレスの可能性を大きく高めた（調整オッズ比14.71、95%CI 4.06–52.63）（抄録）。", "fun": "家族を介護する人のストレスは、介護の量の多さで決まると思いがちです。この調査では、「自分ならうまくやれる」という手応え（自己効力感）が低い人ほど、強いストレスを感じていました。介護の負担を減らすだけでなく、介護する人の自信を支えることも大切だ、という視点が面白いところです。", "unverified": "抄録はp値の途中で切れており、質的分析の結果は未確認。単一施設の小標本の結果。"}}, {"id": "pr42", "rank": 42, "headline": "地域の保健ボランティアが家族と保健をつなぐ", "title": "Community Health Cadres as Community Mediators in Supporting Families at Risk of Stunting: A Qualitative Study within Maternal and Child Health Services in Indonesia", "url": "https://doi.org/10.21203/rs.3.rs-10959086/v1", "authors": "Nintinjri Husnida ほか", "venue": "Research Square (In Review)", "date": "2026-11-05", "apa": "Husnida, N., Adnani, Q. E. S., Wiwaha, G., Rahmatina, A. N., & Hilmanto, D. (2026). Community Health Cadres as Community Mediators in Supporting Families at Risk of Stunting: A Qualitative Study within Maternal and Child Health Services in Indonesia. https://doi.org/10.21203/rs.3.rs-10959086/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "インドネシアの地域保健ボランティア（カデル）が、発育阻害のリスクがある家族と地域・母子保健サービスを文化に合わせてつなぐ媒介役を果たしていることを質的に示した（抄録）。", "p3": "バンテン州ルバック県の保健センターの管内で、カデル、親、医療従事者、地域の指導者、行政の代表を目的的に選び、詳細面接、フォーカスグループ、参与観察、フィールドノートをテーマ分析した（抄録）。", "p5": "家族への伴走に対する地域の認識と関与、媒介者としてのカデル、伴走の実践に影響する要因の3つのテーマが得られた。カデルは信頼される媒介者として意思疎通を助け、健康のメッセージを地域の文化に合わせて伝えていた（抄録）。", "fun": "子どもの成長を見守るとき、専門家より顔なじみの近所の人の言葉の方が届くことがあります。この研究のカデルはまさにその役回りで、家族と保健サービスの間を行き来しながら、健康の話を地域の習慣に合わせて伝えていました。制度のすきまを人のつながりが埋めている点が面白いところです。", "unverified": "参加者の内訳と、伴走の効果の量的な評価は抄録では未確認。"}}, {"id": "pr43", "rank": 43, "headline": "AIは社会科学の新しい実証基盤になる", "title": "AI for Society: A Selective Overview and Future Prospects", "url": "https://doi.org/10.2139/ssrn.7679985", "authors": "Jianqing Fan ほか", "venue": "SSRN", "date": "2026-11-05", "apa": "Fan, J., Liu, Q., Pei, R. R., & Wang, Z. (2026). AI for Society: A Selective Overview and Future Prospects. https://doi.org/10.2139/ssrn.7679985", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "AIが社会・経済の研究の新しい実証基盤になるという立場から、測定・予測・因果推論・政策学習に使う枠組みを選択的に概観した（抄録）。", "p3": "異質な記録を分析できる証拠に変える枠組み、潜在的な状態の高解像度の指標と代理変数の構築、予測シグナルの抽出、要因の帰属・因果推論・政策学習の支援を整理した（抄録）。", "p5": "応用として都市開発、金融の感情分析と不正検知、資産価格、経済予測、企業報告の監査を挙げ、転移学習、生成・エージェント型のシステム、AIが生む証拠の信頼性を今後の課題とした（抄録）。", "fun": "AIは社会を変える技術であると同時に、社会を調べる道具にもなります。画像や文章、プログラムなど、これまで数字にしにくかったものを測れるようにするからです。この論文は「調べる道具」としてのAIに絞って全体像を描いており、社会科学の研究のやり方そのものが変わりつつあることが分かります。", "unverified": "概観の対象とした文献の範囲と件数は抄録では未確認。"}}, {"id": "pr44", "rank": 44, "headline": "LLMで動くゲームNPCの研究を体系的に整理", "title": "LLM-based NPCs in Video Games: A Systematic Mapping Study", "url": "https://arxiv.org/abs/2611.05427", "authors": "Dilan Mian ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Mian, D., Bradbury, J., Guéhéneuc, Y.-G., Petrillo, F., & Politowski, C. (2026). LLM-based NPCs in Video Games: A Systematic Mapping Study (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05427", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMで動くゲームのNPC（プレイヤー以外のキャラクター）の研究を体系的にマッピングし、記憶の仕組みや応答時間など実装の現状を定量的に示した（抄録）。", "p3": "学術文献の377本から42本を選び、主な研究課題と10の下位課題、4つの主題軸で分析した（抄録）。", "p5": "短期記憶と世界状態への接地はそれぞれ60%と69%でほぼ標準だが、長期記憶（31%）、振り返り（38%）、検索拡張生成（14%）はまだ少なく、応答時間は2.6〜15秒だった。商用化の6つの構造的な障壁も挙げた（抄録）。", "fun": "ゲームの村人は、昔は決まったせりふしか言いませんでした。LLMを使えば自由に会話できますが、前に話したことを覚えている村人はまだ少数派で、返事に数秒から十数秒かかることもあります。夢の技術の「今の実力」を数字で示した点が面白いところです。", "unverified": "選定基準の詳細と、6つの障壁の具体的な内容は抄録では未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "計算社会科学・ネットワーク科学", "headline": "AIデータセンターの仮設タービンが州境を越える汚染", "title": "Temporary gas turbines powering a US AI data center created a cross-state air pollution hotspot", "url": "https://arxiv.org/abs/2611.06115", "authors": "Will W. Qiang ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Qiang, W. W., Huang, B., Liu, X., & Lee, H. F. (2026). Temporary gas turbines powering a US AI data center created a cross-state air pollution hotspot (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06115", "why": "2基の衛星観測から、AIデータセンター用の仮設ガスタービン群が周辺の二酸化窒素を約半分増やし、被害の多くが許可した州の外に及ぶことを示した。"}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "脆弱性発見AIの早期提供で防御側の発見が倍増", "title": "Does Frontier AI Strengthen Cyber Defense? Evidence from Project Glasswing", "url": "https://arxiv.org/abs/2611.06629", "authors": "Thomas Mosk", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Mosk, T. (2026). Does Frontier AI Strengthen Cyber Defense? Evidence from Project Glasswing (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06629", "why": "脆弱性発見用AIへの早期アクセスを自然実験とみなし、公開された脆弱性の全数データで防御企業・外部研究者・攻撃者への影響を推定した。"}, {"id": "pn03", "rank": 3, "field": "組織行動・心理的安全性", "headline": "Copilotの導入はチームの協調を乱しうる", "title": "When Copilot Joins the Crew: AI Adoption and Team Performance", "url": "https://doi.org/10.2139/ssrn.7679979", "authors": "Navid Asgari ほか", "venue": "SSRN", "date": "2026-11-05", "apa": "Asgari, N., Nayak, D., & Jacobs, C. (2026). When Copilot Joins the Crew: AI Adoption and Team Performance . https://doi.org/10.2139/ssrn.7679979", "why": "AI支援コードの判別器で個人の導入時期を特定し、一般化合成統制法でチームへの影響を推定した、職場でのAI導入の大規模な実証。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "AIが組織の規模と生産性をどう変えるかのモデル", "title": "Organizing Intelligence", "url": "https://arxiv.org/abs/2611.05417", "authors": "Alex Imas ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Imas, A., Koh, A., & Legg, S. (2026). Organizing Intelligence (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05417", "why": "能力の再生産可能性と協調の限界という人とAIの違いから、企業内の分業と規模の均衡がどう変わるかを理論化した。"}, {"id": "pn05", "rank": 5, "field": "因果推論", "headline": "複数アウトカムの処置効果をどう重み付けるか", "title": "Aggregating treatment effects across multiple outcomes", "url": "https://arxiv.org/abs/2611.05456", "authors": "Chun Pong Lau", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Lau, C. P. (2026). Aggregating treatment effects across multiple outcomes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05456", "why": "PCAや標準化平均など広く使われる集約法の欠点を示し、非負で精度を考慮した重みを統計的決定理論から導いた。"}, {"id": "pn06", "rank": 6, "field": "因果推論", "headline": "感度分析の区間は真値を本当に覆うか検証", "title": "When the Bound Holds but the Benchmark Fails: A Pre-Registered Ground-Truth Audit of Interval Coverage and Sensitivity Analysis on ACIC 2022", "url": "https://doi.org/10.2139/ssrn.7680038", "authors": "Harsh Singh", "venue": "SSRN", "date": "2026-11-05", "apa": "Singh, H. (2026). When the Bound Holds but the Benchmark Fails: A Pre-Registered Ground-Truth Audit of Interval Coverage and Sensitivity Analysis on ACIC 2022. https://doi.org/10.2139/ssrn.7680038", "why": "真の効果が公開されたACIC 2022の全3,400コホートで、事前登録のもと区間推定と感度分析の被覆を確かめた。"}, {"id": "pn07", "rank": 7, "field": "計算社会科学・ネットワーク科学", "headline": "名前から属性を推すLLMの回答拒否が偏りを生む", "title": "Who Gets Counted? Large Language Models, Informative Refusal, and Downstream Bias in Name-Based Demographic Classification", "url": "https://arxiv.org/abs/2611.06550", "authors": "Christian Pipal ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Pipal, C., Wack, M., & Vogel, E.-M. (2026). Who Gets Counted? Large Language Models, Informative Refusal, and Downstream Bias in Name-Based Demographic Classification (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06550", "why": "LLMによる名前からの性別・人種推定の精度の一部が回答の選択に由来し、下流の推定に偏りを生むことを3つのデータで示した。"}, {"id": "pn08", "rank": 8, "field": "統計学", "headline": "LLMの推論を正答・誤答・未完の競合リスクで評価", "title": "Right, Wrong, or Unfinished: A Competing Risks Framework for Language-Model Reasoning under Token Budgets", "url": "https://arxiv.org/abs/2611.05860", "authors": "Boen Jiang ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Jiang, B., Fang, G., & Yu, W. (2026). Right, Wrong, or Unfinished: A Competing Risks Framework for Language-Model Reasoning under Token Budgets (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05860", "why": "トークン予算下の推論を生存分析の競合リスクとして扱い、予算ごとの正答確率と消費量を推定する枠組みを示した。"}, {"id": "pn09", "rank": 9, "field": "機械学習", "headline": "最先端VLMエージェントはまだロボット汎用機でない", "title": "Are Frontier VLM Agents Ready to Be Robot Generalists? An Empirical Study with the Embodied Agent Arena", "url": "https://arxiv.org/abs/2610.00854", "authors": "Haojian Huang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-04", "apa": "Huang, H., Zhao, P., Li, Z., Zhang, Y., Wei, Y., Li, W., Yang, H., Zhou, K., Chen, Y.-C., & Li, Y. (2026). Are Frontier VLM Agents Ready to Be Robot Generalists? An Empirical Study with the Embodied Agent Arena (Version 3). arXiv. https://doi.org/10.48550/ARXIV.2610.00854", "why": "10のVLMエージェントを幾何・空間推論・計画・操作などの1,000事例で比べ、計画と操作での限界を示した（HF上位）。"}, {"id": "pn10", "rank": 10, "field": "経済学", "headline": "人は推薦システムより自分の評価を当てる", "title": "You Know What You Will Like: People Predict Their Own Ratings Better Than Recommender Systems", "url": "https://arxiv.org/abs/2611.06696", "authors": "Zihan Chen ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Chen, Z., Zheng, L. N., & Zhu, D. (2026). You Know What You Will Like: People Predict Their Own Ratings Better Than Recommender Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06696", "why": "MovieLensの予想評価のデータで、本人の予想が推薦アルゴリズムにない情報を持つかを検証した。"}, {"id": "pn11", "rank": 11, "field": "機械学習", "headline": "LLMは科学文献のレビューをどこまでできるか", "title": "Can Large Language Models Review the Scientific Literature? A Test Against a 102-Article Benchmark", "url": "https://arxiv.org/abs/2611.05459", "authors": "Abdullah Al Kalbani ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Kalbani, A. A., Schultz, D. M., Anderson-Frey, A. K., Zheng, Z., & McGuire, C. (2026). Can Large Language Models Review the Scientific Literature? A Test Against a 102-Article Benchmark (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05459", "why": "102本の論文からなる既存のレビューを基準に、6つのAIツールを探索・解釈・統合・提案の4段階で評価した。"}, {"id": "pn12", "rank": 12, "field": "経済学", "headline": "ソウルの塾への近さは住宅価格に織り込まれる", "title": "Priced In or Bet On? Cram-School Lessons, Jeonse Leases, and Expected Appreciation in Seoul", "url": "https://arxiv.org/abs/2611.05767", "authors": "Samiha Tariq", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Tariq, S. (2026). Priced In or Bet On? Cram-School Lessons, Jeonse Leases, and Expected Appreciation in Seoul (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05767", "why": "約220万件の売買・チョンセ契約で、塾への近さが住宅価格と賃料に織り込まれ、値上がり期待を含むかを検証した。"}, {"id": "pn13", "rank": 13, "field": "経営学", "headline": "マーケティング誌の媒介分析の証拠価値を測る", "title": "Noise in the process: Assessing the evidential value of mediation analyses in marketing and consumer psychology journals", "url": "https://doi.org/10.31234/osf.io/ck2r5_v4", "authors": "Amanda Kay Montoya ほか", "venue": "PsyArXiv", "date": "2026-11-05", "apa": "Montoya, A. K., Charlton, A., Krefeld-Schwalb, A., Price, J., & Hilgard, J. (2026). Noise in the process: Assessing the evidential value of mediation analyses in marketing and consumer psychology journals. https://doi.org/10.31234/osf.io/ck2r5_v4", "why": "信頼区間のゼロへの近さを集計する方法で、マーケティングと消費者心理学の媒介分析全体の証拠価値を評価した。"}, {"id": "pn14", "rank": 14, "field": "統計学", "headline": "時間とともに変わる裾の重さを推定・検定", "title": "Time-Varying Tails: Estimation, Inference, and Risk Measurement", "url": "https://arxiv.org/abs/2611.06005", "authors": "Shuo Li ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Li, S., & Peng, L. (2026). Time-Varying Tails: Estimation, Inference, and Risk Measurement (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06005", "why": "極値指数を時間の滑らかな関数として推定し、一様信頼帯と裾の安定性の検定を備えたリスク測定の枠組みを示した。"}, {"id": "pn15", "rank": 15, "field": "組織行動・心理的安全性", "headline": "社会の進歩を測る99指標の品質を監査", "title": "Auditing the measurement quality of societal progress: A six-criterion framework applied to 99 indicators", "url": "https://doi.org/10.31234/osf.io/hmgsx_v3", "authors": "Peter Diep ほか", "venue": "PsyArXiv", "date": "2026-11-04", "apa": "Diep, P., Clark, C. J., Matthews, M., Tetlock, P., & Grossmann, I. (2026). Auditing the measurement quality of societal progress: A six-criterion framework applied to 99 indicators. https://doi.org/10.31234/osf.io/hmgsx_v3", "why": "公民権・気候・経済・健康など8領域の99指標を、定義可能性やデータの公開など6つの基準で監査した。"}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "障害者の最低賃金除外の廃止と事業者の反応", "title": "Firm Responses to State Elimination of Section 14(c) Subminimum Wages", "url": "https://doi.org/10.2139/ssrn.7679984", "authors": "Michelle Yin ほか", "venue": "SSRN", "date": "2026-11-05", "apa": "Yin, M., & Vu, H. (2026). Firm Responses to State Elimination of Section 14(c) Subminimum Wages . https://doi.org/10.2139/ssrn.7679984", "why": "州ごとに段階的に進んだ廃止を使い、14(c)の最低賃金除外の廃止が事業者の参加・閉鎖・収入に与えた影響を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "障害のある労働者に連邦最低賃金未満の支払いを認める14(c)を州が廃止すると、事業者の制度離脱は増えるが閉鎖は有意に増えず、残った事業者の収入は増えたことを示した（抄録）。", "p3": "2015〜2024年の全認定事業者のパネルをForm 990の財務申告と結びつけ、州ごとに廃止の時期が違うことを使って影響を推定した（抄録）。", "p5": "14(c)から離脱する年間確率は約25ポイント上がったが、組織の閉鎖は有意に増えなかった。残った事業者の収入は約17%増え、役員報酬と一般職員の賃金は有意に変わらなかった。財政の較正では、基本の仮定のもとで公的資金の限界価値は4.49だった（抄録）。", "fun": "障害のある人に最低賃金より低い給料を払える制度をやめると、雇う側の団体がつぶれて働く場がなくなるのでは、という心配がありました。州ごとに廃止の時期が違うことを使って確かめると、制度から抜ける団体は増えたものの、閉鎖は目立って増えませんでした。制度変更の「予想される副作用」をデータで確かめた点が面白いところです。", "unverified": "障害のある労働者本人の雇用や賃金への影響は抄録では未確認。"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "選択肢の確率を返す決定モデルを人の代理に", "title": "Decision Models as Scalable Economic Surrogates that Capture Human Variation", "url": "https://arxiv.org/abs/2611.05553", "authors": "Maxime Saxena ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Saxena, M., Caccioli, F., & del Rio-Chanona, R. M. (2026). Decision Models as Scalable Economic Surrogates that Capture Human Variation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05553", "why": "選択肢の確率分布を返す新しいAIモデルが、経済実験で人のばらつきをどこまで再現できるかを検証した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "選択肢への確率分布を返す新しいAIモデル（決定モデル）が、経済のシミュレーションや調査で人の代わりとして、LLMより人の回答のばらつきをよく再現することを示した（抄録）。", "p3": "10の決定モデルと8つのLLMを、家計の支出調査、古典的な経済ゲーム、労働市場のフィールド実験の3つの設定で比べた（抄録）。", "p5": "最先端の決定モデルは3つの設定すべてでLLMより人の回答のばらつきに近く、支出調査では最頻の回答もLLMと同程度に捉えたが、経済ゲームではLLMに劣った。速さは最速のLLMの約10倍で、費用は100分の1以下になりうる（抄録）。", "fun": "AIに「人ならどう答えるか」を代わりに答えさせる研究が増えていますが、LLMは答えが似通いがちで、人の多様さを写しにくいという弱点がありました。この研究は、選択肢ごとの確率を直接返すタイプのAIの方が人のばらつきをよく再現し、しかも速く安いことを示しました。「平均的な答え」ではなく「答えの散らばり」を再現する視点が面白いところです。", "unverified": "使った決定モデルとLLMの名称、ばらつきの再現度の指標の値は抄録では未確認。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "AIの影響を受けやすい職ほど過酷な条件は少ない", "title": "Dull, Dirty, Dangerous? Working Conditions and the Limits of Occupational AI Exposure", "url": "https://arxiv.org/abs/2611.06888", "authors": "Siyi Yu", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Yu, S. (2026). Dull, Dirty, Dangerous? Working Conditions and the Limits of Occupational AI Exposure (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06888", "why": "O*NETの21項目と754職業で、AI曝露の高い職業ほど単調・汚い・危険な労働条件のスコアが低いことと、その解釈が項目の束ね方で変わることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "AIへの曝露が高い職業ほど単調・汚い・危険な労働条件のスコアが低いことを示し、曝露の推計の解釈が項目の束ね方と職業の特性に左右されることを示した（抄録）。", "p3": "米国の754職業についてO*NETの21項目で労働条件を測り、LLMに基づく曝露指標とAIOE（AI職業曝露）との関係を、職業の均等な重みと雇用の重みで調べた。身体的負担、必要な教育・訓練・経験、賃金で調整した（抄録）。", "p5": "曝露が高いほど条件のスコアは低かったが、調整すると関連は弱まり、LLM指標では信頼区間がゼロを含み、AIOEではゼロを下回ったままだった。反復作業と裁量の制限を分けると「単調さ」の合成スコアの意味も変わった（抄録）。", "fun": "ロボットやAIは「退屈で汚くて危ない仕事」から人を解放する、とよく言われます。ところが職業ごとに調べると、AIの影響を受けやすいのは、むしろそうした条件の少ない仕事でした。さらに、何を「単調」と数えるかで結論の見え方が変わることも示しており、数字の作り方そのものに注意を促している点が面白いところです。", "unverified": "関連の大きさ（係数）の数値は抄録では未確認。"}}, {"id": "pn19", "rank": 19, "field": "機械学習", "headline": "動画ストリーミングの強化学習をターン単位の報酬で", "title": "Turns Matter: Advancing Streaming Video RL via Turn-Level Credit", "url": "https://arxiv.org/abs/2611.06728", "authors": "Shuai Dong ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-05", "apa": "Dong, S., Tian, K., Chen, L., Shao, W., Wu, H., Hou, H., Zhu, Y., Wang, X., Wang, Z., Liu, W., Xie, W., Xu, Y., Wang, C., Tuo, K., Ma, C., Wu, T., Zhao, J., Chang, W., Wang, D., … Wang, J. (2026). Turns Matter: Advancing Streaming Video RL via Turn-Level Credit (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06728", "why": "軌跡全体で共有していた利得を各ターンの判断に割り当てるGRPOの改良で、冗長な応答を減らした（HF上位）。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv論文の抄録を使用", "preprint": true, "short": true, "p1": "ストリーミング動画の理解で、応答するか観察を続けるかという各ターンの判断に報酬を割り当てるGRPOの改良TurnWiseを提案した（抄録）。", "p3": "沈黙で補完した接頭部の採点で、各判断の残りの収益から群相対の利得を作り、それ以前の報酬と学習信号を切り離す。トークンの損失をターン内で平均してからターン間で平均し、応答と待機の判断を出力の長さに関係なく同じ重みにする（抄録）。", "p5": "学習した価値関数（クリティック）も追加のロールアウトも使わずに方策学習を改善し、広範な実験で従来のRL手法を上回ったと述べる（抄録）。", "fun": "生中継の動画を見ながら質問に答えるAIは、「今答えるか、もう少し見るか」を何度も決めます。最後に全体の点数だけを伝えると、どの判断が良かったのかが分かりません。試合の後に勝敗だけでなく一つひとつのプレーを振り返るように、判断ごとに手柄を割り振る工夫が面白いところです。", "unverified": "比較した手法と性能の数値は抄録では未確認。"}}, {"id": "pn20", "rank": 20, "field": "機械学習", "headline": "物理研究を通しで行うAIエージェントの評価", "title": "FrontierPhysics: Evaluating Agents for End-to-End Physics Research", "url": "https://arxiv.org/abs/2611.06910", "authors": "Bingran You ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-05", "apa": "You, B., Ke, W., Rosenauer, R., Liu, B., Chen, W., Chen, M., Xu, S., Ma, Y., Feng, J., Chen, B., Sun, X., Liu, J., Guo, J., Zhou, Z., Huang, X., Li, Z., Li, H., Lin, H., Ding, L., … Haeffner, H. (2026). FrontierPhysics: Evaluating Agents for End-to-End Physics Research (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06910", "why": "固定問題ではなく研究全体を通してエージェントを評価する物理のベンチマークを作った（HF上位）。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv論文の抄録を使用", "preprint": true, "short": true, "p1": "物理学者が自分の研究をもとに作った課題で、文献調査から論文執筆までの研究全体をAIエージェントに行わせて評価するベンチマークFrontierPhysicsを作った（抄録）。", "p3": "42人の物理学者が理論・計算・実験の9分野で作った56課題について、文献の調査、研究計画、研究と実験、構造化された出力と論文原稿を求め、決定的な検証器と専門家の採点基準で正しさと出版の可能性を評価した（抄録）。", "p5": "22モデル・26構成のどれも、168回の試行のうち46回を超えて合格しなかった。軌跡の点検では、主な弱点は物理の知識や実行の誤りではなく、推論の厳密さの不足と専門家の直観の欠如だった（抄録）。", "fun": "AIは物理の試験問題なら解けるようになってきましたが、研究は「何を問うか」から自分で決める仕事です。本物の研究者が作った課題で通しで研究させると、最良の設定でも合格は4分の1あまりでした。知識が足りないのではなく、詰めの甘さと勘所の弱さが壁だった、という分析が面白いところです。", "unverified": "モデル別の成績と、分野ごとの内訳は抄録では未確認。"}}, {"id": "pn21", "rank": 21, "field": "機械学習", "headline": "画素から直接行動へつなぐ視覚-言語-行動方策", "title": "From Pixels to Actions - Towards Native Vision-Language-Action Policies", "url": "https://arxiv.org/abs/2611.06918", "authors": "Weichen Fan ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-05", "apa": "Fan, W., Diao, H., Wu, P., Hu, S., Huang, Z., Liu, T., Sun, M., Wang, Z., Cai, Z., Deng, H., Wang, Q., Yang, L., Lu, L., Hong, F., Chen, Z., Lin, D., & Liu, Z. (2026). From Pixels to Actions - Towards Native Vision-Language-Action Policies (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06918", "why": "知覚を圧縮してから行動を推論する従来のVLAの設計を見直し、画素から行動へ直接つなぐ方策を提案した（HF上位）。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv論文の抄録を使用", "preprint": true, "short": true, "p1": "視覚エンコーダを持たず、画像を言語と一緒に基盤モデルの中で処理する視覚-言語-行動（VLA）の枠組みNEO-VLAを提案し、エンコーダ型より強く頑健な操作制御を示した（抄録）。", "p3": "画像を軽量なパッチ畳み込みでトークン化して言語とともに基盤全体で処理し、フローマッチングの行動エキスパートが異なる深さの、指示を条件とする視覚表現を使えるようにした（抄録）。", "p5": "制御した比較で、エンコーダを持たない構造はエンコーダ型を上回り、全体の微調整で差は縮むが消えず、規模を増やすだけでは追いつかなかった。層ごとの調査では、行動に重要な信号は最終の視覚表現よりかなり手前で最大になることが多かった（抄録）。", "fun": "ロボットにものをつかませるとき、カメラの画像をまず「要約」してから動きを考えるのが普通でした。しかし、物の縁や奥行き、小さな変化といった大事な手がかりは、要約の途中で失われやすいものです。途中の段階の情報を直接使えるようにしたら操作が上手になった、という点が面白いところです。", "unverified": "成功率などの具体的な数値と、比較したモデル名は抄録では未確認。"}}, {"id": "pn22", "rank": 22, "field": "機械学習", "headline": "多ターン強化学習はLLMエージェントの何を改善するか", "title": "What Does Multi-Turn Reinforcement Learning Really Improve in LLM Agents?", "url": "https://arxiv.org/abs/2611.06483", "authors": "Kejian Zhu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-05", "apa": "Zhu, K., Jin, Z., Tu, S., Men, T., Hao, Y., Li, J., Liu, K., & Zhao, J. (2026). What Does Multi-Turn Reinforcement Learning Really Improve in LLM Agents? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06483", "why": "サンプリング幅と対話の制約を変えて、多ターン強化学習の改善がどこから来るかを分解した（HF上位）。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers掲載のarXiv論文の抄録を使用", "preprint": true, "short": true, "p1": "LLMエージェントの多ターン強化学習の効果は対話のターン予算に強く依存し、改善の中心は1手ごとの判断の質ではなく、誤りからの回復と長期の粘り強さにあることを示した（抄録）。", "p3": "サンプリングの幅Kと対話の深さTを変えるPass@(K,T)で評価し、過程の監督信号の利点と限界を議論し、訓練中に対話の予算を変えるBudgetMix RLを提案した（抄録）。", "p5": "軌跡レベルのRLの利点はターン予算が十分なときに現れ、予算を絞ると大きく減った。BudgetMix RLは多様な実行設定で頑健な性能を示したと述べる（抄録）。", "fun": "長い作業をこなすAIを強化学習で鍛えると、確かに上手になります。でもそれは一手一手が賢くなったからではなく、失敗してもやり直して立て直す力がついたからでした。だから、やり直せる回数が少ない場面では強みが消えてしまいます。何が上達したのかを分解した点が面白いところです。", "unverified": "使ったモデルと課題、改善幅の数値は抄録では未確認。"}}, {"id": "pn23", "rank": 23, "field": "機械学習", "headline": "思考の連鎖の分布外汎化を理論的に説明", "title": "Understanding the Out-of-Distribution Generalization of Chain-of-Thought Reasoning in LLMs", "url": "https://arxiv.org/abs/2611.06438", "authors": "Nuo-Jing Liang ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Liang, N.-J., Yuan, X.-T., & Zhou, P. (2026). Understanding the Out-of-Distribution Generalization of Chain-of-Thought Reasoning in LLMs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06438", "why": "Chain-of-Thoughtを合成として捉え、分布外への汎化の仕組みを理論的に分析した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "思考の連鎖（CoT）が分布外の課題に汎化する仕組みを、共有された1ステップの予測器で学習済みの遷移を組み合わせることとして理論的に説明した（抄録）。", "p3": "目標課題の完全な推論の軌跡や入出力の対がなく、訓練には分布内の原子的なステップのデータしかない合成的な汎化として定式化し、ラデマッハ複雑度で推定の誤差を評価した。Atom-TaskとGSM8Kで実験した（抄録）。", "p5": "分布外のリスクは、分布内の部分課題のリスクの和にステップ数Tに依存しないO(k)の係数をかけたもので抑えられ、推定項はTに線形ではなくO(√(T/n))だった。実験は、CoTが短い問題から長い問題への汎化を可能にし、状態の明示的な追跡が重要であることを支持した（抄録）。", "fun": "AIに「途中の式を書きながら解いて」と頼むと、習ったことのない長い問題まで解けることがあります。この研究は、AIが短い一歩一歩を部品として学び、その部品を何度も組み合わせて長い道のりをたどるからだ、と数学的に説明しました。九九を覚えれば大きな数のかけ算もできるのに似た構図です。", "unverified": "実験での正答率の数値は抄録では未確認。"}}, {"id": "pn24", "rank": 24, "field": "機械学習", "headline": "強化学習で汎用ロボット方策を継続的に改善", "title": "Reinforcement Learning Enables Scaling Generalist Robot Policy Improvement", "url": "https://arxiv.org/abs/2611.06905", "authors": "Michal Korniak ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Korniak, M., Bagatella, M., Römer, R., Nauman, M., As, Y., Vignesh, P., Agarwal, M., Diaz-Bone, L., Zalewski, P., Czarnecki, M., Treven, L., Saxena, S., Venkataraman, S., Patil, S., Zhou, Z., Marta, D., Mees, O., Shafiullah, N. M. M., Sferrazza, C., … Wagenmaker, A. (2026). Reinforcement Learning Enables Scaling Generalist Robot Policy Improvement (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06905", "why": "事前学習した汎用ロボット方策を強化学習で改善する方法を規模拡大して示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "汎用ロボット方策を実運用で多数の課題にわたって同時にオンラインで改善でき、適切な手順なら訓練に含めなかった課題の性能も上がることを示した（抄録）。", "p3": "汎用的な改善の能力を試す構造化された評価を作り、価値の推定、方策の抽出、資源の配分についてのアルゴリズムと実務上の設計を系統的に比べた（抄録）。", "p5": "汎用方策は多様な課題でオンラインに改善でき、汎化が起きる条件として訓練課題の分布と価値ベースのRLの使用が決定的だった。ロボットの基盤モデルのオンラインでの汎用的な改善を示した最初期の証拠だとする（抄録）。", "fun": "何でもこなせるように大量のデータで学んだロボットも、実際の現場ではもう一段の練習が必要です。これまでは一つの作業だけを練習させるのが普通でしたが、この研究は多くの作業を同時に練習させ、練習していない作業まで上手になる場合があることを示しました。練習の仕方次第で応用力まで伸びる点が面白いところです。", "unverified": "使ったロボットと課題の数、性能の向上幅は抄録では未確認。"}}, {"id": "pn25", "rank": 25, "field": "機械学習", "headline": "推論モデルは概念の抽象化を獲得しているか", "title": "ConceptARC at Scale: Studying Conceptual Understanding in Reasoning Models", "url": "https://arxiv.org/abs/2611.06732", "authors": "Philipp Mondorf ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Mondorf, P., Deliège, A., LeGris, S., Beger, C., Yi, R., Plank, B., Lake, B. M., & Gureckis, T. M. (2026). ConceptARC at Scale: Studying Conceptual Understanding in Reasoning Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06732", "why": "ConceptARCを大規模化し、推論モデルが概念的に関連する課題の間で一般化できるかを調べた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "特定の概念を狙ったARC形式の課題を大量に作る生成器を作り、推論モデルが概念をまたいで安定した抽象を形成しているかを調べた（抄録）。", "p3": "生成器で16の概念ごとに100課題、計1,600の人手で確認した課題からなるConceptARC-100を作り（元のベンチマークの10倍）、最近の推論モデルとゼロから学習したモデルを評価して内部表現も分析した（抄録）。", "p5": "課題の内部表現は、規則や場面が大きく違っても、物体への操作（色の付け替え、除去、平行移動など）ごとにまとまった。モデルは変換操作の安定した抽象を形成し、多様な課題に一般化しているとみられる（抄録）。", "fun": "数個の例からパズルの規則を見抜く課題で、AIが本当に「考え方」をつかんでいるのかは分かりにくい問題でした。この研究は同じ考え方を使う問題を大量に作って調べ、AIの内部では「色を塗り替える」「取り除く」といった操作ごとに問題が整理されていることを見つけました。見た目の違う問題を同じ仲間と見抜いている点が面白いところです。", "unverified": "概念ごとの正答率の数値と評価したモデル名は抄録では未確認。"}}, {"id": "pn26", "rank": 26, "field": "機械学習", "headline": "ニューラル点過程とホークス過程を再評価", "title": "Flexible Intensities Matter: A Comprehensive Re-evaluation of Hawkes Processes and Neural Temporal Point Processes", "url": "https://arxiv.org/abs/2611.06348", "authors": "Hendrik Mehrtens ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Mehrtens, H., Buettner, F., & Stegle, O. (2026). Flexible Intensities Matter: A Comprehensive Re-evaluation of Hawkes Processes and Neural Temporal Point Processes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06348", "why": "時間点過程の手法を包括的に再評価し、強度関数の柔軟性が性能を左右することを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ニューラル時間点過程がホークス過程を大きく上回るという従来の報告は、比較の相手が最も制限された形のホークス過程だったためで、柔軟にすれば差はほぼ消えることを示した（抄録）。", "p3": "柔軟性を段階的に高めたポアソン・ホークス過程とニューラル時間点過程を、5つの既存ベンチマークと、UK Biobankの疾患歴とMIMIC-IVのICU記録による2つの大規模な課題で、次の事象の自己回帰的な予測として比べた（抄録）。", "p5": "学習できる基底と核を持つホークス過程ではニューラルモデルとの差がほぼ消えた。スプライン強度のTransformerは従来の強度型ニューラル点過程を上回り、強度を使わないモデルと同等だった。柔軟性の利点はほぼすべて時刻の密度の項にあり、事象の種類の項は改善しなかった（抄録）。", "fun": "地震の余震やSNSの投稿の連鎖のように、出来事が出来事を呼ぶ現象を表す古典的な数式モデルがあります。最新のAIの方がずっと優れていると言われてきましたが、比べる相手の古典モデルを不利な形に縛っていたことが分かりました。公平な条件にそろえると差はほぼ消える、という「比較の仕方」の大切さが面白いところです。", "unverified": "医療記録は手法比較の素材として使われたもので、臨床の結論は扱わない。ベンチマークごとの数値は抄録では未確認。"}}, {"id": "pn27", "rank": 27, "field": "機械学習", "headline": "実リポジトリの共同作業でAIエージェントを評価", "title": "SlackBench: Benchmarking Agents on Collaborative Projects Grounded in Real Code Repositories", "url": "https://arxiv.org/abs/2611.05512", "authors": "Mingxuan Li ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Li, M., Mao, H., Zheng, R., James, J. S., Li, Y., Anderson, N., Gonzalez, J. E., & Dimakis, A. (2026). SlackBench: Benchmarking Agents on Collaborative Projects Grounded in Real Code Repositories (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05512", "why": "実際のコードリポジトリに基づく共同プロジェクトで、同僚として働くAIエージェントを評価するベンチマークを作った。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "実際の研究プロジェクトを再現した会話とコードの変更をもとに、職場の連絡とリポジトリの状態をあわせて推論するAIエージェントを評価するベンチマークSlackBenchを作った（抄録）。", "p3": "実在の学術研究プロジェクトをプライバシーに配慮して再演し、複数人の対話、変わっていく決定、GitHubとGoogle Docsに基づくコードの変更を持つ再現可能な環境を用意した。140の問いは、異種の情報源の探索、答えられない・前提が誤った質問での回答の保留、目的に沿った要約、長い会話からの状況の推論を含む（抄録）。", "p5": "課題は静的な文書の質問応答に還元できず、エージェントはどの会話が重要かを見きわめ、スレッドをたどり、リポジトリの状態を調べて証拠を統合する必要があると述べる（抄録）。", "fun": "職場で「あの件どうなったっけ？」と聞かれたら、チャットの過去のやり取りを探し、資料やプログラムの最新の状態を確かめ、食い違う情報を整理して答えます。人には当たり前のこの作業を、AIの同僚がどこまでできるかを測る試験です。「答えられない質問には答えない」ことも採点に入っている点が面白いところです。", "unverified": "エージェントごとの成績は抄録では未確認。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "分布から分布への回帰に共形予測を拡張", "title": "Conformal Prediction for Distribution-to-Distribution Regression", "url": "https://arxiv.org/abs/2611.06320", "authors": "Trung-Khang Tran ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Tran, T.-K., Hoang, T. A., Tran, V.-H., & Nguyen, T. M. (2026). Conformal Prediction for Distribution-to-Distribution Regression (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06320", "why": "入力も出力も分布である回帰に、有限標本の被覆保証を持つ共形予測を拡張した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "入力も出力も確率分布である回帰（分布から分布への回帰）で、被覆の保証を保ちつつ解釈しやすい予測集合を作る共形予測の枠組みを示した（抄録）。", "p3": "分割共形予測を素朴に当てはめると、周辺的には妥当でも体積や標本の取り方が定まらない予測集合になることを示し、直交基底の空間で働く新しい共形の枠組みと、緩い仮定で漸近的な条件付き被覆を持つ適応型を提案した（抄録）。", "p5": "合成データと実データで提案法の有効性を確かめたと述べ、コードを公開している（抄録）。", "fun": "「明日の気温はこのくらいの範囲」と幅で予測するのは分かりやすいですが、予測したいもの自体が「分布」（たとえば一日の気温のばらつき方）だと、幅の取り方が難しくなります。この研究は、分布を基本の形の組み合わせに分解し、その係数の空間で幅を決める工夫をしました。予測の幅を意味の分かる形にする点が面白いところです。", "unverified": "実データの種類と、予測集合の大きさの比較の数値は抄録では未確認。"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "差分プライバシーで合成グラフを多項式時間で公開", "title": "Polynomial-Time Differentially Private Synthetic Graph Release with Nearly-Linear Additive Error", "url": "https://arxiv.org/abs/2611.06670", "authors": "Marek Eli\\'a\\v{s} ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Eliáš, M., Kamath, G., Kulkarni, J., Li, G. Z., Liu, J., Mahabadi, S., Peng, P., Tarnawski, J., Xu, H., & Zou, Z. (2026). Polynomial-Time Differentially Private Synthetic Graph Release with Nearly-Linear Additive Error (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06670", "why": "全カットの値をほぼ保つ合成グラフを、辺の差分プライバシーのもと多項式時間で公開するアルゴリズムを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "非負の重み付きグラフのすべてのカットの値をほぼ保つ合成グラフを、辺の差分プライバシーを満たしつつ多項式時間で公開するアルゴリズムを示し、加法誤差をほぼ線形まで下げた（抄録）。", "p3": "log-det正則化した半正定値計画で乗法的重み更新のための分数的な問い合わせを作り、全カットの精度を保証する。プライバシーの損失は、以後の反復から退いた辺の座標の質量に応じて分数的にだけ計上する（抄録）。", "p5": "γとεを固定しδ=β=n^-10とすると加法誤差はn polylog nで、従来の効率的な上界n^(13/12+o(1))を改善した。下界Ω(n/γε)も示し、対数の多項式因子を除いて最適だとした。相関クラスタリングやMax-Cutなど下流の課題の誤差も改善した（抄録）。", "fun": "人と人のつながりのデータは、誰と誰がつながっているかという秘密を含みます。この研究は、その秘密を守りながら、「グループを二つに分けたときに間を通る線の量」をどの分け方でもほぼ正しく保つ偽のグラフを、現実的な時間で作る方法を示しました。しかも理論上ほとんどこれ以上は改善できない精度に達している点が面白いところです。", "unverified": "実装と実データでの計算時間の評価は抄録では未確認。"}}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "ランダム効果の予測値を回帰に使う偏りを補正", "title": "REPAIR: Random-effect prediction adjustment for inference in regression", "url": "https://doi.org/10.31234/osf.io/gbwqd", "authors": "Zachary Andrew Vig ほか", "venue": "PsyArXiv", "date": "2026-11-05", "apa": "Vig, Z. A., & Hallquist, M. N. (2026). REPAIR: Random-effect prediction adjustment for inference in regression. https://doi.org/10.31234/osf.io/gbwqd", "why": "多層モデルのランダム効果の予測値を別の回帰に使うときの推論を補正する方法REPAIRを示した。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "多層モデルのランダム効果の予測値を別の回帰で使うときに生じる係数と標準誤差の歪みを補正する2段階の枠組みREPAIRを示した（抄録）。", "p3": "線形ガウスの多層モデルで一般化最小二乗法により尤度だけに基づく予測値を求め、推定したクラスターごとの標本誤差の共分散を使う正則化したモーメント法で構造的なモーメントを補正する。ランダム効果を説明変数、結果変数、その両方とする4つのシミュレーションで評価した（抄録）。", "p5": "予測変数の信頼性が中〜高のとき偏りは小さく、ほかの方法よりRMSEが小さいことが多かった。信頼性が低いとき、とくに小標本での信頼区間の被覆は課題として残った（抄録）。", "fun": "一人ひとりの「伸びの速さ」や「ストレスへの反応の強さ」を多層モデルで推定し、それを別の分析に使うことはよくあります。ところが、その推定値は縮みと誤差の両方を含むため、そのまま使うと結論がゆがみます。推定値に含まれる誤差の分だけ補正する、という地道で実用的な工夫が面白いところです。", "unverified": "シミュレーションの条件の詳細と、補正の前後の偏りの大きさは抄録では未確認。"}}, {"id": "pn31", "rank": 31, "field": "統計学", "headline": "事前データ適合ネットワークでベイズ変数選択", "title": "Prior-data fitted networks for variable selection", "url": "https://arxiv.org/abs/2611.05966", "authors": "Omar Melikechi", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Melikechi, O. (2026). Prior-data fitted networks for variable selection (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05966", "why": "表形式の予測で最先端の事前データ適合ネットワーク（PFN）をベイズ変数選択に応用した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "表形式の予測で最先端の事前データ適合ネットワーク（PFN）をベイズ変数選択に使う2つのモデル、条件付き依存を見つけるCD-PFNと因果グラフの親子を見つけるPC-PFNを示した（抄録）。", "p3": "どちらも事後分布のサンプルやデータごとのモデル化なしに、各変数の事後包含確率（PIP）を推定する（抄録）。", "p5": "半合成データと実データの実験で、CD-PFNとPC-PFNは既存の手法をしばしば上回ったと述べ、ソフトウェアを公開している（抄録）。", "fun": "たくさんの変数の中から本当に効いているものを選ぶのは、統計の古典的な難問です。この研究は、大量の模擬データで「選び方」そのものを前もって学習したAIに、新しいデータを見せるだけで答えを出させました。毎回モデルを組み立て直さずに済む、という発想の転換が面白いところです。", "unverified": "比較した既存の手法と性能の数値は抄録では未確認。"}}, {"id": "pn32", "rank": 32, "field": "統計学", "headline": "多層ネットワークの時系列を潜在レジームで分類", "title": "A latent space hidden Markov model for clustering views in longitudinal multilayer networks", "url": "https://arxiv.org/abs/2611.06472", "authors": "Cecilia Manente ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Manente, C., Alfò, M., & D'Angelo, S. (2026). A latent space hidden Markov model for clustering views in longitudinal multilayer networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06472", "why": "縦断的な多層ネットワークを有限個の潜在レジームで表す潜在空間の隠れマルコフモデルを提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "縦断的な多層ネットワークの各時点・各層を、繰り返し現れる有限個の潜在レジームとその幾何的な配置で表してクラスタリングする、ベイズ潜在空間モデルを提案した（抄録）。", "p3": "層ごとの隠れマルコフ連鎖が簡潔な加法的遷移モデルでレジームへの所属を決め、共通の潜在配置を共有しつつ層ごとに異なる時間の動きを許す。辺の重みはハードル負の二項分布で過剰なゼロと過分散を扱い、送り手・受け手の拡張も用意した（抄録）。", "p5": "シミュレーションでレジームと配置を正確に復元でき、その精度はレジームどうしの似かたに依存した。GDELTの地政学的イベントと欧州議会の点呼投票のデータに適用した（抄録）。", "fun": "国どうしの関係を、協力・対立など何層にも分けて時間の流れで見ると、いくつかの決まった「状態」を行き来しているように見えることがあります。この研究は、その状態と、状態ごとの国どうしの位置関係を同時に推定するモデルを作りました。複雑なつながりの変化を少数の型にまとめる発想が面白いところです。", "unverified": "応用で得られたレジームの具体的な解釈は抄録では未確認。"}}, {"id": "pn33", "rank": 33, "field": "統計学", "headline": "共分散が未知だと次元に依らない私的平均推定は不可能", "title": "Dimension-Free Private Mean Estimation is Impossible Without the Covariance", "url": "https://arxiv.org/abs/2611.06615", "authors": "Renaud Gaucher ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Gaucher, R., Linder, E., Smith, A., Ullman, J., & Zakynthinou, L. (2026). Dimension-Free Private Mean Estimation is Impossible Without the Covariance (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06615", "why": "共分散が未知のガウス平均の差分プライバシー推定で、次元に依存しない標本数が達成できないことを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "共分散が未知のとき、差分プライバシーのもとでのガウス平均の推定は、共分散が既知の場合のような次元に依存しない保証を達成できないことを、新しい下界で示した（抄録）。", "p3": "ユークリッド誤差でのガウス平均の推定について、標本サイズが実効次元より小さい場合と大きい場合に分け、共分散が未知のときの最適誤差の下界を導いた（抄録）。", "p5": "標本サイズが実効次元より小さいとき、未知の場合の最適誤差は既知の場合より√(d/n)倍大きくなりうる。大きいときも、実効次元がlog d以下の対角共分散でさえ√d/n^(3/2)倍大きくなりうる（抄録）。", "fun": "個人のデータを守りながら平均を推定する方法では、データのばらつき方（共分散）が分かっていれば、変数の数が多くても精度を保てることが知られていました。この研究は、ばらつき方が分からないとその恩恵が消えることを証明しました。何を前もって知っているかで、秘密の保護と精度の両立の限界が変わる点が面白いところです。", "unverified": "上界（達成できる手法）との差の詳細は抄録では未確認。"}}, {"id": "pn34", "rank": 34, "field": "統計学", "headline": "疎なグラフォンの次数分布に一様中心極限定理", "title": "Uniform Central Limit Theorems for Degree Distributions of Sparse Graphon Models", "url": "https://arxiv.org/abs/2611.06892", "authors": "Robert Lunde ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Lunde, R., & Lahiri, S. (2026). Uniform Central Limit Theorems for Degree Distributions of Sparse Graphon Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06892", "why": "グラフォンモデルの経験次数分布に初めて関数型の極限定理を与えた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "疎なグラフォンモデルの経験次数分布について、有限次元・関数型・一様の中心極限定理を示した。密で有界なグラフォンでも関数型の極限定理はこれまでなかった（抄録）。", "p3": "非有界な核（重い裾の次数）を許す疎なL^pグラフォンを対象に、条件付き次数分布の正確な多重線形表現でHoeffding分解を特定し、格子版のBillingsleyの緊密性の基準とEfron-Stein型のモーメント不等式を組み合わせた（抄録）。", "p5": "潜在的な期待次数が密度を持つとき、疎さの条件のもとで有限次元のCLTが成り立ち、極限の共分散は密な場合と一致した。局所的な正則性のもとで台の内部の区間上の関数型CLTを、裾の正則性と強い疎さのもとで非有界区間への一様性を示した。確率的ブロックモデルのように次数分布に原子がある点では一様な極限は成り立たない（抄録）。", "fun": "SNSのつながりを数えると、友達がとても多い人と少ない人がいて、その「友達の数の分布」はネットワークの基本的な指紋です。ところが、ネットワークを大きくしたときにこの分布の推定がどうばらつくかを丸ごと述べる定理は、これまでなかったそうです。基本的な量ほど理論が追いついていない、という点が面白いところです。", "unverified": "検定や信頼帯への応用は抄録では未確認。"}}, {"id": "pn35", "rank": 35, "field": "因果推論", "headline": "高次元アウトカムの因果効果を頑健に検定", "title": "Debiased Conditional Independence Tests for Causal Effects", "url": "https://arxiv.org/abs/2611.05608", "authors": "Susan Athey ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Athey, S., Nareklishvili, M., & Spiess, J. (2026). Debiased Conditional Independence Tests for Causal Effects (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05608", "why": "処置への自己選択がありうる場合に、高次元アウトカムへの因果効果を条件付き独立性で検定する頑健な方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "処置への自己選択がありうる場合に、高次元になりうるアウトカムへの因果効果を、「アウトカムから処置を共変量だけのときより正確に予測できるか」という条件付き独立性で検定する3つの頑健な方法を示した（抄録）。", "p3": "逆傾向スコア重み付きの平均二乗誤差を統計量とする条件付きランダム化検定（傾向スコアが既知なら有限標本でサイズを制御）、処置と処置予測の両方から共変量の効果を除く二重残差化、二重頑健でネイマン直交なモーメントに基づくAIPW型の検定を提案した（抄録）。", "p5": "シミュレーションでは3つの検定とも、多くの非線形の設定、とくに重い裾、外れ値、混合、異質な効果、符号が逆の効果のもとで、見かけ上無関係な回帰に基づく同時Wald検定より検出力が高かった（抄録）。", "fun": "薬や政策の効果を確かめるとき、ふつうは「処置で結果が変わったか」を調べます。この研究は向きを逆にして、「結果を見れば誰が処置を受けたか当てられるか」を問います。当てられるなら、処置が何かを変えたということです。結果の指標がたくさんあるときでも使える、この逆転の発想が面白いところです。", "unverified": "実データへの適用例は抄録では未確認。"}}, {"id": "pn36", "rank": 36, "field": "因果推論", "headline": "潜在交絡の代理変数を多数作る回帰の理論", "title": "Regression with Many Generated Controls", "url": "https://arxiv.org/abs/2611.06855", "authors": "Timothy Christensen ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "apa": "Christensen, T., & Vebman, D. (2026). Regression with Many Generated Controls (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06855", "why": "内生性を制御する潜在変数の代理を多数生成して回帰に入れるときの推定理論を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "内生的な共変量があり、内生性を制御できる変数が潜在的で、その代理変数を多数生成できるときの線形回帰で、各手法が何を推定しているかを導き、検証データなしでも一致推定できる条件を示した（抄録）。", "p3": "AI・機械学習の異なる手法で潜在的な制御変数を安価だが不完全に補完して多数の代理を作る状況を想定し、全代理を制御に入れる、代理から因子を作る、操作変数で推定する、その非線形版などの選択肢を透明なモデルで比べた（抄録）。", "p5": "各手法の暗黙の推定対象と、それが関心のあるパラメータを回復する条件を明らかにし、実務上の推奨を示した。生成した制御変数の集合が十分に豊かなら、検証データに頼らずに一致推定できる（抄録）。", "fun": "本当は直接測れない変数で調整したいのに、手元にあるのはAIで作った不完全な代わりの指標だけ、という場面は増えています。この研究は、代わりの指標を一つではなくたくさん作れば、正解のデータがなくても正しい答えに近づける条件を示しました。AIの不完全さを数で補うという考え方が面白いところです。", "unverified": "具体的な応用例の有無は抄録では未確認。"}}, {"id": "pn37", "rank": 37, "field": "因果推論", "headline": "直接操作できない心理変数の効果を操作変数で識別", "title": "Identifying Causal Effects in Experiments with Latent Treatments: An Instrumental Variable Approach", "url": "https://doi.org/10.31234/osf.io/zk73q", "authors": "Lukas Junker ほか", "venue": "PsyArXiv", "date": "2026-11-04", "apa": "Junker, L., & Pargent, F. (2026). Identifying Causal Effects in Experiments with Latent Treatments: An Instrumental Variable Approach. https://doi.org/10.31234/osf.io/zk73q", "why": "操作チェックを使い、実験で直接操作できない潜在変数の因果効果を操作変数法で識別する方法を示した。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "心理学の実験で、直接操作できない潜在変数の因果効果を、操作を操作変数とみなして識別する方法を示した（抄録）。", "p3": "操作を、複数の項目で測った潜在的な処置の操作変数として扱い、平均因果効果が識別される条件を導いた。単位のない潜在処置について、1項目あたりの推定対象と1標準偏差あたりの標準化した推定対象を定め、既存のSEMと操作変数のソフトで推定する方法とシミュレーションを示した（抄録）。", "p5": "必要な仮定は効果と負荷量のある程度の異質性を許し、多くの心理測定の応用がすでに置く仮定より弱い。標準化した推定対象はなじみ深いが仮定が多く、実験の間で移転できない（抄録）。", "fun": "たとえば「不安が高まると成績が下がるか」を調べる実験では、不安そのものは直接いじれず、何らかの操作で間接的に動かします。これまでは操作の効果を測って、それを不安の効果とみなしがちでした。操作を「てこ」として使い、不安そのものの効果を取り出すという発想が面白いところです。", "unverified": "具体的な実験データへの適用例は抄録では未確認。"}}, {"id": "pn38", "rank": 38, "field": "因果推論", "headline": "母集団の構成比で感度分析を統一的に行う", "title": "Sensitivity Analysis in Population Shares", "url": "https://arxiv.org/abs/2611.05584", "authors": "Filippo Palomba", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "why": "潜在結果などの分布の仮定を母集団の構成比の制約として表し、感度分析を統一的に行う枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "母集団のある割合についてだけ分布の仮定を緩めたとき、推定対象がどこまで動きうるかを評価する感度分析の統一的な枠組みを示した（抄録）。", "p3": "仮定を緩める割合を0から1まで動かしたときの推定対象の範囲（限界）を扱いやすい有限次元の計画問題で計算し、限界のプラグイン推定量と大標本での性質を示した。誤特定による不確実性と標本の不確実性を分ける要約指標も導入した（抄録）。", "p5": "この限界は追加の計算なしに正確なノンパラメトリックの鋭い限界を再現する。脱落のあるランダム化実験の平均処置効果、構造モデルの反実仮想予測、公式型の操作変数の頑健性の評価に適用し、RとPythonのパッケージを公開した（抄録）。", "fun": "分析の結論は、たいてい「全員がこの前提に従う」という仮定の上に立っています。この研究は、「もし一部の人が前提から外れていたら、結論はどこまで揺らぐか」を、外れる人の割合を目盛りにして測れるようにしました。研究どうしを前提の崩れへの強さで比べられる点が面白いところです。", "unverified": "適用例での具体的な頑健性の数値は抄録では未確認。"}}, {"id": "pn39", "rank": 39, "field": "計算社会科学・ネットワーク科学", "headline": "AI動画の見分けに自信過剰な人ほど共有する", "title": "Sure Enough to Share? Overconfidence in GenAI Video Discernment is Associated with Sharing Intentions", "url": "https://arxiv.org/abs/2611.05844", "authors": "Haoning Xue ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "why": "生成AI動画を見分ける能力への過信が共有の意図と結びつくことを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "生成AI動画を見分ける能力への3種類の過信（過大評価・過大な位置づけ・過精密）を区別し、過精密が共有の意図と一貫して結びつくことを示した（抄録）。", "p3": "オンライン調査（N=973）で、参加者が日常の場面を写した動画の出どころを判断し、3種類の過信と、出どころの判断・共有の意図との関係を調べた（抄録）。", "p5": "正答率は62.5%で、参加者は自分を他人より12.8パーセンタイル分だけ上に位置づけていた。過精密は共有の意図と、動画を人が撮ったと判断する傾向に一貫して正の関連があった。年齢、生成AIの利用、AIリテラシーは3種類の過信すべてと正の関連があった（抄録）。", "fun": "AIが作った動画と本物を見分けるテストで、人の正答率は6割ほどでした。問題は、自分の判断に自信を持ちすぎる人ほど、その動画を人に送りたがることです。しかもAIをよく使う人やAIに詳しい人ほど過信しやすいという結果は、「知っているつもり」の危うさを示していて面白いところです。", "unverified": "動画の数と種類、関連の大きさは抄録では未確認。"}}, {"id": "pn40", "rank": 40, "field": "計算社会科学・ネットワーク科学", "headline": "複数属性の交差が生む分離をネットワークで説明", "title": "Explaining Intersectional Segregation in Multi-attribute Social Networks", "url": "https://doi.org/10.2139/ssrn.7676758", "authors": "Clara Eminente ほか", "venue": "SSRN", "date": "2026-11-04", "why": "人種と性別など相関する複数の属性への選好から、交差的な分離が生じる仕組みをランダムグラフで示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "人種と性別のように相関する2つの属性への選好から生じる交差的な分離を、ランダムグラフのモデルでColemanの分離指数として閉じた形で導き、3つの結果を示した（抄録）。", "p3": "2つの属性への選好を持つランダムグラフのモデルで分離指数を解析的に求め、欧州の学校の学級の友人ネットワークで予測を検証した（抄録）。", "p5": "一方の属性への選好が相関するもう一方の属性に見かけの分離を生むこと、一方が中立なら同類性のある属性の分離は選好の強さと等しく集団の組み替えでは変えられないこと、独立な2属性の均衡した集団では2つの選好が逆向きのときに限り分割が分離を減らすことを示した（抄録）。", "fun": "教室で男子と女子が別々にかたまるのは、性別で友達を選んでいるからだと考えがちです。でも、性別と相関する別の特徴で選んでいるだけでも、性別の分かれ方として表れることがあります。一つの属性だけを見ていると原因を取り違える、という指摘が面白いところです。", "unverified": "学級の友人ネットワークでの検証結果の数値は抄録では未確認。"}}, {"id": "pn41", "rank": 41, "field": "計算社会科学・ネットワーク科学", "headline": "確率的社会シミュレータの較正を償却最適化で高速化", "title": "Amortized Optimization for Calibrating Stochastic Social Simulators", "url": "https://arxiv.org/abs/2611.06623", "authors": "Muyao Zhong ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "why": "繰り返しシミュレーションの代わりに償却最適化を使い、パラメータの較正を高速化した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "事前に集めたシミュレーションから、観測に合うパラメータの選び方を学ぶ償却最適化で、確率的な社会シミュレータの較正を高速化した（抄録）。", "p3": "学習後は新しい観測を追加のシミュレーションなしで実行可能なパラメータに写す。似た観測を説明できる複数のパラメータ候補を保持して応答を比べ、単一の回帰器で生じる矛盾したラベルを避ける。4つのシミュレータで較正の精度と問い合わせ時間を比べた（抄録）。", "p5": "新しい交通の目標では、局所補正で問い合わせ時間が経験的・代理選択の半分以下になった。実際の金融データでの比較では、10分間のガウス過程ベイズ最適化の探索より約1.07×10^7倍速く、平均の較正誤差は3.06%高かった（抄録）。", "fun": "人の行動を模したシミュレーションを現実に合わせるには、つまみ（パラメータ）を何度も回して試すのが普通で、時間がかかります。この研究は、前もってたくさん試しておいた結果からつまみの合わせ方を学ばせ、新しいデータが来たらすぐ答えを出せるようにしました。精度はわずかに落ちても桁違いに速い、というトレードオフが面白いところです。", "unverified": "4つのシミュレータの種類と、交通以外の課題での精度は抄録では未確認。"}}, {"id": "pn42", "rank": 42, "field": "計算社会科学・ネットワーク科学", "headline": "スイスの都市の歩行に現れる規則性", "title": "Emergent regularity of walking patterns: evidence from Swiss cities", "url": "https://arxiv.org/abs/2611.06529", "authors": "Guo-Shiuan Lin ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "why": "探索と回帰を交互に行う移動の規則性が、スイスの都市の歩行パターンにも現れることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "スイスの都市の住民の歩行は自宅と職場の周りに強く集中し、ほかの交通手段とは根本的に異なる移動パターンを作ることを、4週間の追跡データで示した（抄録）。", "p3": "15分都市のモデルに近いスイスの主要都市で、4週間の生活時間調査で追跡した1,318人の歩行の空間分布と時間を分析し、経験的に求めたパラメータを持つ2中心の探索・優先回帰（EPR）モデルで、中心から歩いて離れる確率の減衰を再現した（抄録）。", "p5": "歩行は自宅と職場という2つの引き寄せ点の周りに集中し、ほかの手段は長い移動や自宅と職場の連絡に使われていた。歩行時間の長い群ほど長距離を歩き、多くの目的地を探索する傾向が強かった（抄録）。", "fun": "人の移動は「新しい場所を探す」と「いつもの場所に戻る」の繰り返しで説明できることが知られていますが、歩きだけを取り出して調べた例は少なかったそうです。スイスの都市で調べると、歩きは家と職場という二つの重心の周りに集まっていました。「15分で暮らせる街」を考える手がかりになる点が面白いところです。", "unverified": "参加者の属性と都市ごとの差は抄録では未確認。"}}, {"id": "pn43", "rank": 43, "field": "計算社会科学・ネットワーク科学", "headline": "都市サービスの組合せが地区の脆弱性を示す", "title": "AGORA cities: the hidden infrastructure shaping urban fragility", "url": "https://arxiv.org/abs/2611.06289", "authors": "Eleonora Andreotti ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "why": "ボローニャとフィレンツェで、都市サービスの共存のパターンから地区の脆弱性と性格を読み分けた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ボローニャとフィレンツェで、芸術・緑・移動のための開かれた道からなるインフラ（AGORA）がそろう地区ほど脆弱性が低いことを示した（抄録）。", "p3": "FoursquareとOpenStreetMapの施設情報に、3-30-300ルールに基づくSentinel-2の緑の指標を統合して地区をクラスター化し、市の統計局が作った人口・社会・経済・総合の脆弱性指標と比べた（抄録）。", "p5": "AGORAの備えと総合脆弱性の順位相関に基づくAAスコアは、フィレンツェで1.00、ボローニャで0.80だった。AGORAを完全に備えた唯一のクラスターは最も脆弱性が低いが、住民はボローニャの3.3%、フィレンツェの6.3%にとどまった（抄録）。", "fun": "街の暮らしにくさは所得や年齢の統計で測るのが普通ですが、この研究は、芸術の場、緑、歩いて行ける道といった身近なインフラの組み合わせに注目しました。それらがそろう地区ほど脆弱性が低い一方、そろった地区に住む人はごく一部でした。街の弱さを地図の上の施設から読み取る発想が面白いところです。", "unverified": "関連の分析で因果は示していない（解釈）。クラスターの数と指標の重みは抄録では未確認。"}}, {"id": "pn44", "rank": 44, "field": "計算社会科学・ネットワーク科学", "headline": "LLMが演じるジェンダーを人はどう受け取るか", "title": "A Cracked Mirror: How People Perceive Gender Performance by Large Language Models", "url": "https://arxiv.org/abs/2611.06393", "authors": "Faezeh Fadaei ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "why": "ゼロショットでLLMが表現するジェンダーと、それを人が会話でどう解釈するかをジェンダー・パフォーマティビティから分析した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "最小限の指示でLLMにジェンダーを演じさせると、人は指示の方向に沿って受け取るが、両端の指示ほど中間寄りに評価し、「どちらでもない」はやや男性寄りに受け取ることを示した（抄録）。", "p3": "事前登録したオンラインの無作為化実験で、1,060人がそれぞれLLMと5回の短い会話をし、「とても男性的」から「とても女性的」までの指示で生成した相手の性別の印象を会話ごとに評価した（抄録）。", "p5": "平均の評価は指示の方向に動いたが、両端の評価はラベルより中間に近かった。評価はモデルや話題で異なり、女性は中間の水準でモデルをより男性的と評価した。参加者は文体・感情表現・話題への関心を手がかりにし、ときに判断の背後の固定観念を疑った（抄録）。", "fun": "AIに「とても女性的に話して」と頼むと、会話の相手は確かにそう感じます。ただし思ったほど極端にはならず、「どちらでもなく」と頼むと少し男性的に受け取られました。AIは社会のジェンダーの手がかりを映す鏡ですが、その鏡にはひびがある、という見立てが面白いところです。", "unverified": "使ったモデルの名称と、評価尺度の詳細は抄録では未確認。"}}, {"id": "pn45", "rank": 45, "field": "経営学", "headline": "戦略的資源にも寿命がある：資源の減衰", "title": "Strategic Resource Decay: An Empirical Examination of the Overlooked Endogenous Threat", "url": "https://doi.org/10.2139/ssrn.7679822", "authors": "Reha Karadag ほか", "venue": "SSRN", "date": "2026-11-05", "why": "資源ベース理論が見落としてきた戦略的資源の寿命と減衰を実証的に検討した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "戦略的資源が内生的に価値を失っていく「戦略的資源の減衰」の枠組みを、米国最大の産油地帯パーミアン盆地の埋蔵量の枯渇のデータで実証し、拡張した（抄録）。", "p3": "上流の事業者2,696社の企業-月631,491件のパネルで、埋蔵量の枯渇がその後の全国の石油生産に与える影響、能力の再構成の効果、希少性という新しい境界条件を検証した（抄録）。", "p5": "予測できる内生的な枯渇であっても、その後の生産は減り、能力の再構成ではしばしば生産を維持できなかった。資源の希少性が高いほど、減衰の業績への負の影響は強まった（抄録）。", "fun": "会社の強みになる資源は、うまく使えばずっと優位を保てる、というのが経営学の定番の考え方でした。この研究は、油田の埋蔵量のように使えば減っていく資源に注目し、減ること自体が予想できても業績は落ち、手を打っても補いきれないことが多いと示しました。強みには寿命がある、という視点が面白いところです。", "unverified": "SSRNの未査読論文。効果の大きさの数値は抄録では未確認。"}}, {"id": "pn46", "rank": 46, "field": "経営学", "headline": "培養肉の商業化を阻む規制の分断と生産能力", "title": "Regulatory Fragmentation, Consumer Acceptance and Capacity Constraints in Lab-Grown Food: Evidence from 2026 Disclosures", "url": "https://doi.org/10.2139/ssrn.7679878", "authors": "Priyanshu Das", "venue": "SSRN", "date": "2026-11-05", "why": "2026年の開示資料から、培養肉と精密発酵食品の規制・消費者受容・生産能力の条件を整理した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "2026年に公表された資料だけを使い、培養肉と精密発酵による食品の商業化の条件を、規制、消費者の受容、生産能力の面から整理した（抄録）。", "p3": "法令、食品規制当局の消費者調査、価格統計、企業報告、規制の発表、牛肉価格の経済報道からなる14の資料を使い、すべての数値を出典まで追跡し、派生した数値は著者の計算と明記した（抄録）。", "p5": "シンガポールでは承認が積み上がる一方、米国の州は一時停止や表示規則に動き、規制上の承認と買い手への法的な到達が分かれていた。英国の調査では販売への反対（43%）が賛成（35%）を上回り、開示された発酵の生産能力は培養細胞の能力よりはるかに大きかった（抄録）。", "fun": "培養肉は技術の話題として注目されますが、店に並ぶかどうかは技術だけでは決まりません。国によって承認の動きは正反対で、消費者には安全性や「自然さ」への不安が根強くあります。牛肉が過去最高の値段でも食べたい気持ちは変わらない、という点も含めて、新しい食べ物が社会に受け入れられる条件が見えてくるのが面白いところです。", "unverified": "SSRNの未査読論文で、2026年の公表資料に限った分析。上場企業の評価額の割引の大きさは抄録では未確認。"}}, {"id": "pn47", "rank": 47, "field": "組織行動・心理的安全性", "headline": "医療における当事者リーダーシップの実態", "title": "Moving Beyond Visibility and the “Glass Box” Effect: A Scoping Review of Consumer Leadership in Healthcare", "url": "https://doi.org/10.31235/osf.io/g2nu3", "authors": "Julia Paxino ほか", "venue": "SocArXiv", "date": "2026-11-04", "why": "医療のサービス・研究・政策・教育で、当事者（利用者）のリーダーシップがどう概念化・実践されているかを整理した。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "医療のサービス・研究・政策・教育で、当事者（生きた経験を持つ人）のリーダーシップがどう概念化・実践されているかを整理し、促進要因・障壁・影響をまとめるスコーピングレビュー（抄録）。", "p3": "JBIの方法に従い、当事者が設計・分析・解釈に関わった。5つのデータベースと灰色文献を検索し、記述的なマッピングと、システム変化の視点からの質的テーマ分析で統合した（抄録）。", "p5": "障壁と促進要因を4つの領域に、影響を個人・関係・システムの3つの水準に整理したと述べるが、対象文献の件数と主な結果は取得した抄録の範囲に含まれない（抄録）。", "fun": "医療の現場で、患者や家族が「参加する」だけでなく「リードする」とはどういうことか。この研究は、当事者自身もレビューの設計と分析に加わる形で、その実態を整理しました。ただ見える場所にいるだけではないリーダーシップを探る、という問いが面白いところです。", "unverified": "抄録は途中で切れており、対象文献の件数と主な結果は未確認。"}}, {"id": "pn48", "rank": 48, "field": "経済学", "headline": "ジェンダー不平等の新指標と社会の複雑さ", "title": "A new cross-cultural index for gender inequality correlates with social complexity, patrilineality and sexual stature dimorphism", "url": "https://doi.org/10.31235/osf.io/mjf6x", "authors": "Leo Delalandre ほか", "venue": "SocArXiv", "date": "2026-11-04", "why": "多数の人間社会でジェンダー不平等の複数の側面を測る比較文化的な指標を作り、社会の複雑さや父系制との関係を調べた。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "工業化以前の93社会の女性の地位の52指標を再分析し、多くの指標がまとまって動くジェンダー不平等の次元を見つけ、それが社会の複雑さなどと関係することを示した（抄録）。", "p3": "比較文化データセットの52の指標から、複数の指標が系統的に共変する有意な次元を抽出し、その次元と社会組織の特徴、身長の性差との関係を調べた（抄録）。", "p5": "女性の地位は社会の複雑さと負に、母系制・妻方居住と正に関連した。ジェンダー不平等が大きいほど身長の性差（性的二型）も大きかった（抄録）。", "fun": "女性の地位は、暴力、親族のしくみ、仕事の分担、政治的な力など、いろいろな面で社会ごとに違います。それらがばらばらではなく、ある程度まとまって動くことを、昔の93の社会のデータから示しました。不平等と身長の男女差の関係から、骨の形などの手がかりで先史時代の不平等を推定できるかもしれない、という展望も面白いところです。", "unverified": "相関の結果で、因果の向きは抄録では未確認（解釈）。"}}, {"id": "pn49", "rank": 49, "field": "経済学", "headline": "母親の貧困の推移の学歴差を所得と移転で分解", "title": "How earnings and public transfers shape the educational gradient in partnered mothers’ poverty trajectories in Austria", "url": "https://doi.org/10.31235/osf.io/r72db", "authors": "Christina Siegert ほか", "venue": "SocArXiv", "date": "2026-11-04", "why": "オーストリアで出産後の母親の貧困の推移を、本人の所得・公的移転・配偶者の所得から分解した。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "オーストリアの初産の母親の貧困リスクの推移を、本人の稼得、公的移転、配偶者の所得に分解し、学歴による違いを示した（抄録）。", "p3": "34,000人を超える初産の母親と配偶者の行政登録データで、出産の2年前から6年後までを事象研究デザインで追い、個人と世帯の貧困指標を比べて可処分所得を稼得と公的移転に分解した（抄録）。", "p5": "母親は出産後に大きく持続的な稼得の減少を経験するが、世帯で見た経済的な脆弱性の増加ははるかに小さく、配偶者の所得と家族関連の公的移転が一部を和らげた。高学歴の母親は稼得の減少が大きいが比較的守られ、低学歴の母親は減少が小さいのに貧困リスクが高く持続した（抄録）。", "fun": "子どもが生まれると母親の収入は大きく減ります。でも、家族全体で見ると貧困に陥る人はずっと少なく、配偶者の収入や子育ての手当が支えていました。意外なのは、収入の落ち込みが大きい高学歴の母親ほど守られ、落ち込みの小さい低学歴の母親ほど貧困が続くことです。収入の減り方だけでは本当の苦しさは分からない、という点が面白いところです。", "unverified": "貧困の基準と、学歴差の数値は抄録では未確認。"}}, {"id": "pn50", "rank": 50, "field": "経済学", "headline": "受け手の信念を知らずに情報設計を学ぶ", "title": "Learning to Design Information", "url": "https://arxiv.org/abs/2611.05701", "authors": "Ce Li ほか", "venue": "arXiv", "date": "Thu, 05 Nov 2026", "why": "受け手の主観的信念を知らない情報設計者が、学習によって望ましい情報設計に近づくアルゴリズムを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "受け手の主観的な信念を知らない情報設計者（LLMやオンラインの基盤など）が、繰り返しのやり取りから戦略的な受け手の信念を学ぶアルゴリズムを示した（抄録）。", "p3": "受け手が学習の過程を戦略的に操作しても頑健なアルゴリズムを作り、既知の信念のもとでの1期の最適値のT倍という静的な基準と、より強い動的な最適性の基準の2つに対する後悔で性能を測った（抄録）。", "p5": "2つの基準のどちらに対しても後悔なしを達成し、収束の速さはO(log²T/T)で、既存の方法より大幅に速いと述べる（抄録）。", "fun": "相手が何を信じているか分からないまま、伝える情報を選ばなければならない場面はよくあります。この研究は、やり取りを重ねながら相手の思い込みを学ぶ方法を作りましたが、相手がわざと本心を隠して学習をゆがめても崩れないように設計した点が面白いところです。", "unverified": "数値実験の有無と内容は抄録では未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline":
