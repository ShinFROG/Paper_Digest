<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-10-21", "intro": "プレプリントの新着287件、学術誌の新着458件（うち上位10%誌300件）、重要論文の候補317件（プレプリント243件・学術誌74件）、公開データの候補120件から選びました。プレプリント・関連50報、プレプリント・注目50報、論文誌・関連49報、論文誌・注目44報、オープンデータ28件です。論文誌は関連の強い候補と主要誌の新着が少なく（主要誌は抄録のない論文も多い）、件数を減らしています。Jxiv は取得できませんでした（HTTP 503）。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "5億世帯ペルソナで社会規模の家計シミュレーション", "title": "S$^2$-MAS: A Society-Scale Multi-Agent Simulation Framework with 500 Million Household Persona Agents", "url": "https://arxiv.org/abs/2610.27746", "authors": "Yang Li ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Li, Y., Wan, D., Wang, Y., He, C., Xu, Z., Chen, X., Zhong, S., Binjie, D., Guo, Z., Jun, H., Guo, K., Lin, W., Zhou, T., Liu, H., & Luo, Y. (2026). S$^2$-MAS: A Society-Scale Multi-Agent Simulation Framework with 500 Million Household Persona Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27746", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、データ・ペルソナ構成§4.1、評価§5.1、考察§7・結論§8）を読んだ。付録の詳細表は一部のみ", "preprint": true, "p1": "調査データにもとづく5億件の合成世帯ペルソナと、学習済みの意思決定モデル、家計の会計台帳を組み合わせ、1,200万世帯規模で購買・借入・返済の反応を模擬できる枠組みS2-MASを作った（抄録、§1）。未査読のプレプリントである。", "p2": "LLMを使う社会シミュレーションでは、①判断が個々の家計の事情に応じること、②行動が資源と債務の整合的な変化を生むこと、③条件を変えて何度も回せる効率、が同時に要る。既存の大規模エージェント基盤（OneSim、OASIS）やペルソナ生成（MatrAIx）はこれらを個別にしか満たさない（§1）。", "p3": "実調査を36項目の共通表現に整え、条件付き生成で属性間の依存を保って合成世帯を作る（§4.1）。判断モデルFinLは292万5,263例でSFT＋RLCD（強化学習の一種）により訓練し、実行エンジンGeneseは「判断の提案」と「状態の更新」を分け、別の台帳で消費・現金・債務返済・不足を計算する（§1、§4）。例：同じ世帯で購入目標と与信枠を上げた条件と上げない条件を対にして比べる。", "p4": "①消費者の金融選択の質問で記録された人間の回答を当てる精度とマクロF1、②レンダリングしたペルソナ100件の人手評価（6人、5段階）、③1,000エージェントでの実行速度（OneSim・OASISと比較）で部品を評価した（§5）。", "p5": "FinL-mlxは正解率74.55%、質問マクロF1 38.37%で、Jev 1.13を9.30ポイント、GLM-5.3-Flashを5.68ポイント上回った（§1）。ペルソナの人手評価は平均4.570/5で、既知の欠落の検出はGLMが24/24、DeepSeekが2/24だった（§5.1、図4）。1,200万世帯の対比較では、目標と与信枠を上げると消費が増え、反応は年齢・所得で異なり、差の多くは購入の先送りから購入への移行によった（§7）。", "p6": "著者は、65歳以上の意思決定者の世帯236万4,307件（19.70%）が両条件ですべて先送りを選び、実際のライフサイクル需要との対応は未検証だと認める（§7）。月次の経路は判断モデルと設定した金融ルールの両方を反映し、家計簿や契約履歴での検証は今後の課題とする（§7）。解釈：合成ペルソナ自体の妥当性は人手評価で確かめているが、集計された行動が実際の家計の反応と一致するかの外部検証は限られる。", "fun": "実際の調査に答えた人たちをもとに、5億世帯の「デジタルな家族」を作り、お金の使い方を一斉に試せるようにした研究です。面白いのは、AIに決めさせるのは「買うか、待つか」だけで、残ったお金や借金の計算は帳簿の規則で厳密に行う点です。その結果、65歳以上の世帯がすべて「待つ」を選ぶという偏りも見えてきました。", "unverified": "5億件の合成ペルソナの元になった調査の名称と規模は本文の該当箇所で確認できなかった。付録の多くの表は読んでいない。"}}, {"id": "pr02", "rank": 2, "headline": "LLMエージェントが決算整理仕訳をどこまでこなせるか", "title": "Can AI Close the Books? Designing an Agent for Accrual Adjustments", "url": "https://doi.org/10.2139/ssrn.7641078", "authors": "Stefan Wittwer ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Wittwer, S., Knust, L., & Chardonnens, P. (2026). Can AI Close the Books? Designing an Agent for Accrual Adjustments. https://doi.org/10.2139/ssrn.7641078", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "LLMを台帳に沿って一件ずつ進ませ、証拠を集め、外部に置いた会計規則を当てはめ、計算と記帳を決定的なツールで行わせる「エージェント・ハーネス」で、決算整理（発生主義の調整仕訳）を自動化できるかを試した（抄録）。未査読のプレプリントである。", "p2": "決算整理では、どの取引に調整が必要かを見抜き、規則どおりに金額を計算して記帳する必要がある。LLMは文章理解は得意でも、計算や規則の一貫した適用、監査証跡の記録が弱い（背景：抄録の設計方針から推測される課題）。", "p3": "デザインサイエンス研究の手順で、LLMの判断部分（調整が要るかの認識と規則の選択）と、計算・記帳という決定的な部分を分け、構造化した監査証跡を残す制御構造を作った（抄録）。解釈：LLMには判断させ、数値処理は道具に任せることで計算の誤りを減らす設計である。", "p4": "市販のLLM 7種を、300件の仕訳からなる合成データセットでベンチマークした（抄録）。評価指標は正解率で、誤りの内訳（調整の必要性の見落としか記帳の不正確さか）も分析した（抄録）。", "p5": "正解率はモデルによって59.3%から93.3%まで大きく異なった。弱いモデルは主に必要な調整を認識できず、多くは記帳の正確さも低かった。エージェントの実行費用は同等の手作業のごく一部だった（抄録）。", "p6": "データが合成の300件に限られ、実際の企業の台帳での検証ではない（抄録から読み取れる限界）。著者は、最も性能の高いモデルを人間のレビュー付きの決算補助として使うことを支持するにとどめている（抄録）。どの規則・どの勘定で誤りが多いかは抄録の範囲では未確認。", "fun": "会社の決算では、まだお金が動いていない費用や収益を帳簿に正しく載せる「調整」が欠かせません。AIに全部任せるのではなく、判断はAI、計算と記入は確実なプログラム、という役割分担にした点が面白いところです。それでもAIによって正解率が約6割から9割超まで違ったのは、AI選びの大切さを示しています。", "unverified": "使用した7モデルの名称、合成データの作り方、費用の具体的な比較は抄録になく未確認。"}}, {"id": "pr03", "rank": 3, "headline": "社会的孤立の地域分布は空間的に強く集積する", "title": "Accounting for Spatial Dependence in Neighborhood Perceived Social Isolation: An Analysis of Florida Census Tracts", "url": "https://doi.org/10.21203/rs.3.rs-11415407/v1", "authors": "Andre Antonio Alexander Williams", "venue": "Research Square (In Review)", "date": "2026-10-20", "apa": "Williams, A. A. A. (2026). Accounting for Spatial Dependence in Neighborhood Perceived Social Isolation: An Analysis of Florida Census Tracts. https://doi.org/10.21203/rs.3.rs-11415407/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research Square版のPDF本文（方法、結果、考察、強みと限界）を読んだ", "preprint": true, "p1": "フロリダ州5,122の国勢調査区で、知覚された社会的孤立の有病率は強く空間的に集積しており、空間依存を考慮すると都市・郊外・農村の差は統計的に区別できなくなることを示した（抄録、結果）。未査読のプレプリントである。", "p2": "国勢調査区単位の健康指標は隣り合う地区が似る空間自己相関をもち、誤差の独立を仮定する通常の回帰では信頼区間が狭くなりすぎる。孤立の地理的な差を論じる研究でこの点が十分に扱われていない（抄録、序論）。", "p3": "2024年CDC PLACESの粗有病率を用い、大域的モランI（地域全体の集積度）とAnselinのLISA（局所的なホットスポット）で空間構造を調べ、人口密度で都市・郊外・農村に分類した。人口加重OLS（モデルA）と、距離に応じた相関を許すConley空間HAC標準誤差（モデルB）で同じ係数の推論を比べた（抄録、方法）。", "p4": "評価の焦点は、点推定ではなく標準誤差と信頼区間の変化である。帯域幅（40・60・70マイル）を変えた感度分析と、残差のモランIで、都市区分が空間的集積を説明しきれているかを確かめた（結果）。", "p5": "人口加重平均の有病率は31.1%で、モランI = 0.67（z = 82.29、p < 0.001）。モデルAでは郊外が−1.37ポイント、農村が−1.28ポイントで有意だったが、モデルBでは標準誤差が約6倍になり、郊外（95%CI −2.8〜0.06）・農村（−2.92〜0.36）とも0を含んだ。残差のモランIは0.66で、ほとんど下がらなかった（結果）。", "p6": "著者は、地区の値が直接観測ではなくマルチレベル回帰と事後層化による小地域推定であること、横断的な生態学的デザインで個人や因果の推論はできないこと、帯域幅や地域単位の取り方（MAUP）への感度、単一州・単年であることを限界に挙げる（強みと限界）。解釈：元データ自体がモデル推定なので、観察された空間構造の一部は推定モデルに由来しうる。", "fun": "5千以上の地区のデータがあっても、隣同士が似ていると、実際の情報量は独立な約130〜145地区分しかない、と著者は見積もっています。たくさんデータがあるように見えて実は「同じ話を繰り返し聞いている」状態だと、差があるように見えても偶然かもしれません。地図データを扱うときの落とし穴を分かりやすく示した点が面白いところです。", "unverified": "70マイルの帯域幅で郊外の差が有意になった点の数値詳細は本文の記述以上は未確認。"}}, {"id": "pr04", "rank": 4, "headline": "LLMで熟議の質指標DQIのコードブックを自動生成", "title": "From DQI to C-DQI: Automatic Codebook Generation and Evaluation for Measuring Computational Discourse Quality Index", "url": "https://arxiv.org/abs/2610.27937", "authors": "Esther Shizgal ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Shizgal, E., Keinan, R., Shtauber, D., Esquira, R. T., Aronson, O., Toledano, M., Rappel-Kroyzer, O., Lavi, L., Keydar, R., Bar-Siman-Tov, I., & Tsarfaty, R. (2026). From DQI to C-DQI: Automatic Codebook Generation and Evaluation for Measuring Computational Discourse Quality Index (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27937", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（評価法§4.3、データ§5、実験設定§6、結果§7、限界§9と表2・3）を読んだ", "preprint": true, "p1": "熟議の質の指標DQI（Discourse Quality Index）のコードブックをLLMで生成し、複数LLMの一致度と外部の代理指標で評価する一連の手順を示し、データから帰納的に作ったコードブックが最も安定することを示した（抄録、§7）。未査読のプレプリントである。", "p2": "議会討論の質の評価は、専門家が理論にもとづくコードブック（CB）で採点するのが標準だが、硬直的で手間がかかり偏りもある。LLMで採点を自動化しても、コードブック自体の質とモデルの偏りをどう確かめるかが課題だった（抄録）。", "p3": "元のDQI（基準）に加え、理論主導（トップダウン）、データ主導（ボトムアップ、ヘブライ語・英語・修正版）、両者の混合の各CBをLLMで作る（§4.2）。信頼性はモデル間一致（IMA：開発元の異なる6つのLLMの採点の一致、Krippendorffのα）で測る。直観は、偏りの異なるモデル同士が一致するなら定義が明確だというもの（§4.3）。", "p4": "イスラエル国会（クネセト）の委員会の議事録100件（700区間）を、Claude Sonnet 5.5を含む6モデルで採点した。妥当性は、人手注釈（162件、α = 0.79）で検証した別モデル（GPT-6-luna、正解率82%）の3発話ごとの採点を代理指標とし、Spearman相関で測った（§5、§6）。", "p5": "IMA（Krippendorffのα）はボトムアップ3種が0.57〜0.58で、トップダウン0.49、混合0.46、元のDQI 0.40を上回った（表2）。代理指標との相関は全CBで0.55超（p < 10⁻⁹）で、トップダウンが最も高かった（ρ = 0.66、表3）。項目別では礼儀・敬意の一致が高く、正当化の水準は低かった（§7.1）。", "p6": "著者は、LLMの偏りが実際の採点にどう現れるかは調べていないこと、1,500語の区間の長さによる雑音、トップダウンのプロンプトがDQIに誘導した可能性、妥当性を相関だけで評価し正確さではないことを限界に挙げる（§9）。解釈：一致度が高いことは信頼性の証拠だが、モデルが共通にもつ偏りがあれば一致しても正しいとは限らない。", "fun": "人間の採点者は似た背景をもちがちですが、別々の会社が作ったAIは癖がばらばらです。そのばらばらのAIたちが同じ点を付けるなら、採点の基準がはっきりしている証拠になる、という逆転の発想が面白いところです。しかも理論から作った基準より、実際の議事録から作った基準のほうがAI同士の意見がそろいました。", "unverified": "付録の項目別の全表（表4・5）は一部のみ確認。"}}, {"id": "pr05", "rank": 5, "headline": "LLMに「自己」を与えるには：性格と物語的自己", "title": "Synthetic Selves for AI Agents? Lessons from Psychology for Agent-Based Modeling", "url": "https://doi.org/10.31234/osf.io/67dhz_v1", "authors": "Astghik Altunyan ほか", "venue": "PsyArXiv", "date": "2026-10-20", "apa": "Altunyan, A., & Edelman, S. (2026). Synthetic Selves for AI Agents? Lessons from Psychology for Agent-Based Modeling. https://doi.org/10.31234/osf.io/67dhz_v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "PsyArXiv版のPDF本文（人間代替としてのLLM§2、性格と物語的自己§3、結論と含意§4）を読んだ", "preprint": true, "p1": "LLMを人間の代わりや生成エージェントベースモデル（GABM）の構成要素に使う研究を総覧し、性格質問紙のような構造化した「自己」はかなり再現できるが、物語として展開する自己は再現が不安定であることを整理した（抄録、§4.1）。未査読のプレプリントである。", "p2": "LLMで人を模擬するとき、「人をモデル化するとはどういうことか」という前提が暗黙のままになっている。プロンプトへの敏感さ、属性集団の内部の多様性の欠如、学習データの偏りといった問題も報告されてきた（§2.1）。", "p3": "新しい実験ではなく文献の総覧である。①LLMで社会心理学の実験結果を再現する研究と緩和策（指示調整、プロンプト設計、Centaurのような行動データでの微調整）（§2）、②心理学の自己の2つの見方、特性としての性格（Big Five、HEXACO）と物語的アイデンティティ（§3）を並べて検討した。", "p4": "判断の基準は、構造化された課題での一致（質問紙の因子構造など）と、文脈・時間・文化に埋め込まれた語りの再現性の対比である。Crockett and MesseriのDEAD（脱文脈化・人工的設計・匿名化・脱身体化）という批判を当てはめた（§4.1）。", "p5": "LLMは実験の集計的な傾向を再現するが効果量を過大に出しがちで（§2.1、先行研究の引用）、生成する人生の物語は「救済」型に偏る（§3.3）。GABMへの教訓として、①特性で初期化しても行動が区別できない恐れ、②物語での初期化は楽観的な軌跡を生む恐れ、③温度設定による出力の揺れで再現性が損なわれること、を挙げる（§4.2）。", "p6": "著者は、シミュレーションを現実の仕組みの証拠とみなす「makeist」な使い方では上記の問題をすべて引き継ぐが、仮定から現象が生じうることを示す「non-makeist」な使い方なら不完全なエージェントでも価値があると区別する（§4.3）。限界として、総覧は短く網羅的ではなく、機械の意識の問題は扱わない（§1、§4.2脚注）。", "fun": "AIに「あなたは几帳面な人です」と性格を与えると質問紙ではそれらしく答えますが、人生の物語を語らせると、なぜか「苦労の末に立ち直る」話ばかりになるそうです。人らしさのうち、AIで一番まねしやすい部分と、人を理解するのに一番大事な部分がずれている、という指摘が面白いところです。", "unverified": "引用されている各先行研究の数値は原典で確認していない（本論文の記述のみ）。"}}, {"id": "pr06", "rank": 6, "headline": "米国橋梁の健全度区分に州単位の測定断絶", "title": "Measurement Breaks in Bridge Condition Classifications:State-level Evidence from FHWA Good, Fair and Poor Counts, 2015-2025", "url": "https://doi.org/10.2139/ssrn.7629959", "authors": "Nenad S. Dorafshan", "venue": "SSRN", "date": "2026-10-20", "apa": "S. Dorafshan, N. (2026). Measurement Breaks in Bridge Condition Classifications:State-level Evidence from FHWA Good, Fair and Poor Counts, 2015-2025. https://doi.org/10.2139/ssrn.7629959", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "米国の橋梁の健全度区分（良・可・不良）の州別集計に、全国共通の断絶はないが州単位では大きな不連続が頻繁にあり、特に「良/可」の境界が不安定であることを示した（抄録）。未査読のプレプリントである。", "p2": "橋梁の状態の割合は連邦の業績指標、配分公式、劣化モデルの基礎になっているが、良・可・不良の分類が時間的に安定かどうかはほとんど調べられていない（抄録）。", "p3": "FHWAが公表した2015〜2025年の51地域の良・可・不良の橋梁数を、各年の列が全国の公表合計と一致するように検証して集めた。州別トレンド付きのプールした段差検定で、分類方式の変更日（2018年・2022年）に断絶があるかを偽の日付（プラセボ）と比べ、州単位の不連続を頑健な標準偏差で測った（抄録）。", "p4": "判断の基準は、①変更日の段差がプラセボ日より際立つか、②州・年の変化が州横断の基準から頑健な標準偏差の4倍を超えるか、③年々の雑音の大きさ、である（抄録）。", "p5": "2018・2022年の共通の段差はプラセボ日と区別できなかった。州・年の変化のうち4標準偏差超は不良の割合で3.5%、良で5.7%、可で7.3%で、年々の雑音は良・可が0.84・0.71ポイントと不良の0.31ポイントの2〜3倍だった。最大はジョージア州の良の割合の16.5ポイントの跳躍（2019→2020）とカリフォルニア州の13.4ポイント（2015→2016）で、断絶は橋梁公式プログラムが用いる2020年12月31日の時点の直前の2019〜2020年に多かった（抄録）。", "p6": "著者は、オハイオ州の一時的な件数の急増（2016年 +1,180橋、2017年 −939橋）を挙げ、それを除けば記録の入れ替わりの系列的な痕跡はないとする（抄録）。抄録の範囲では、不連続の原因（点検方法の変更か実際の補修か）は特定されていない（未確認）。", "fun": "国の予算配分にも使われる「良い橋が何%」という数字が、ある州では1年で16.5ポイントも跳ね上がっていました。橋が一斉に直ったとは考えにくく、測り方や分類の仕方が変わった可能性があります。しかもその跳躍が予算の基準日の直前に集中していた点が、数字の裏を考えさせて面白いところです。", "unverified": "不連続の原因の分析、劣化モデルへの影響の推計は抄録になく未確認。"}}, {"id": "pr07", "rank": 7, "headline": "4千人RCTで支援職のストレスと離職意図を予測", "title": "Stress and Turnover in Helping Professions: A Randomized Controlled Longitudinal Study of Head Start Employees", "url": "https://doi.org/10.2139/ssrn.7637538", "authors": "Matthew Monnot", "venue": "SSRN", "date": "2026-10-20", "apa": "Monnot, M. (2026). Stress and Turnover in Helping Professions: A Randomized Controlled Longitudinal Study of Head Start Employees. https://doi.org/10.2139/ssrn.7637538", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "米国Head Startの職員4,054人の無作為化試験データで、短い初回調査から6か月後のストレスの高まりと低い定着意向を予測でき、短い再評価（リアプレイザル）演習の上積みはほとんどないことを示した（抄録）。未査読のプレプリントである。", "p2": "支援職の職員は心理的な負担が大きいが、誰が後でストレスを強め離職を考えるかを前もって見分け、支援を届ける方法は確立していない（抄録）。資源保存理論（COR）の枠組みで検討した。", "p3": "初回のストレス・燃え尽き・不安・抑うつ・職務満足・希望・再評価の信念・人口統計の11の予測因子によるロジスティック回帰を作り、データを学習・開発・検証用（2,429・811・814人）に分けて評価した（抄録）。", "p4": "基準率（全員に平均の確率を当てる予測）と比べた対数損失の差、AUC、較正の傾き、Brierスコアで評価し、割付条件と演習後の回答を加えたときの改善も測った（抄録）。", "p5": "6か月後の高ストレスは対数損失0.532（基準率0.596、差 −0.064、95%CI [−0.099, −0.029]）、AUC .72、較正の傾き0.92だった。低い定着意向は対数損失0.386（基準率0.417）、AUC .70だが、Brierの差は0を含んだ。割付条件と演習後の回答を加えた改善は −0.002 [−0.006, 0.001] にとどまった（抄録）。", "p6": "結果は追跡調査を完了した職員に限られ（抄録）、脱落による偏りの可能性がある（解釈）。著者は地域での検証を経てから使うべきだとしている（抄録）。抄録の範囲では、演習の効果そのもの（ストレスの低下）の大きさは未確認。", "fun": "4千人の大規模な試験で分かったのは、ちょっとした心の持ち方の練習よりも、最初に聞いた11の質問のほうが、半年後にストレスを抱える人をよく見分けられるということでした。「効く介入」を探すだけでなく、「早めに気付く仕組み」も支援になる、という発想の切り替えが面白いところです。", "unverified": "再評価演習がストレス自体を下げたかどうかの主効果は抄録に明記がなく未確認。"}}, {"id": "pr08", "rank": 8, "headline": "討論で人は判断を改めるが弱いAIは改めない", "title": "Humans Correct Their Judgments Through Debate, but Weaker AI Models Do Not", "url": "https://arxiv.org/abs/2610.28539", "authors": "Maria Victoria Carro ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Carro, M. V., Mester, D. A., Nieto, F., Stanchi, O. A., Bergman, G. E., Marrafini, G. F. G., Borrell, T., Freire, G., Machulsky, J. S., Leiva, M. A., Lopez, A., Spinelli, N., Gangi, L. N. F., Sprejer, E., Lemarchand, F. B., Simari, G., & Martinez, M. V. (2026). Humans Correct Their Judgments Through Debate, but Weaker AI Models Do Not (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28539", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（方法§3、人間の判定者§4、LLMの判定者§5の結果、考察§6、限界§7）を読んだ。付録は未読", "preprint": true, "p1": "人間を超えるAIを監督する「討論による安全性（AI Safety via Debate）」について、非専門家の人間は討論で誤った事前の信念を修正できるが、能力の低いLLMの判定者はほとんど修正できず、時に精度が下がることを示した（抄録、§4.2、§5.2）。未査読のプレプリントである。", "p2": "討論方式は、強いAI同士に反対の立場を論じさせ、人間や弱いモデルが判定する監督法である。しかし判定者は先入観をもち、強いAIはそれを利用しうる。先入観があるときに討論が真実に導くか、群衆の知恵（人数・多様性・投票や熟議）が助けになるかは未検証だった（§1、抄録）。", "p3": "一般に知られていない科学技術の10話題×10下位話題の計100項目を作り、各項目に真と偽の一般的立場と具体的な主張を用意した（§3.1）。討論者はClaude Opus 4.5で、真と偽の主張を同時に3往復論じる。比較対象は一人の専門家が一方を説得するコンサルタンシー方式（§3.2〜3.3）。判定者には事前の信念を測る（人間）か与える（LLM、GPBプロンプト）。", "p4": "人間の判定507件とLLMの判定75,000件超を分析し、討論前後の正解率をMcNemar検定などで比べ、Holm–Bonferroniで多重比較を補正した（§3.1、§4.2）。複数判定者では投票・重み付き投票・合意を求める熟議などを比べた（§3.4）。", "p5": "人間では同じ下位話題の討論で正解率が41.3%→57.61%（p = .028）に上がり、コンサルタンシーは51.25%→48.75%と改善しなかった。重み付き投票は45.83%→65.28%で最も高かった（§4.2、図2）。LLM（Claude Sonnet 4）では討論もコンサルタンシーも改善せず、合意を求める熟議は48.96%→44.04%と有意に下げた（§5.2、図4）。同質な審査団では少数派の正しい判定者のほうが多数派に屈しやすかったが、多様な7人の審査団では熟議で58.26%→64.29%に改善した（§5.2、図5）。", "p6": "著者は、商用モデルでは討論者との能力差が小さいこと、課題が構造的に単純で主張は専門家の検証を経ていないこと、LLMへの信念の与え方が指示の矛盾を含みうること、多様性の条件でモデルとペルソナが交絡していることを限界に挙げる（§7）。", "fun": "人は賛否両論を聞くと思い込みを直せるのに、弱いAIは直せず、AI同士で話し合わせると正しい少数派が多数派に流されてしまいました。人間の会議でも起きる「同調」がAIの集団にも現れ、しかもメンバーが多様だと逆に正しい答えが勝つ、という結果が面白いところです。", "unverified": "付録の詳細な結果（各モデル・各条件の全表）は読んでいない。"}}, {"id": "pr09", "rank": 9, "headline": "縮約モデル埋め込みGNNで連結構造の地震応答予測", "title": "Topology-Adaptive Seismic Response Prediction of Interconnected Structural Systems Using Reduced Order Model Embedded Graph Neural Network", "url": "https://arxiv.org/abs/2610.28378", "authors": "Huangbin Liang ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Liang, H., Moya, B., Chinesta, F., & Chatzi, E. (2026). Topology-Adaptive Seismic Response Prediction of Interconnected Structural Systems Using Reduced Order Model Embedded Graph Neural Network (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28378", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法§2、数値実験の設定§3、結果§4、結論§5と図表キャプション）を読んだ", "preprint": true, "p1": "変電設備のように導体でつながった機器群の地震応答を、機器ごとの縮約モデル（ROM）をグラフニューラルネット（GNN）に埋め込んだROMeGNNで予測し、学習時より大きな未知の構成にも追従できることを示した（抄録、§4.3）。未査読のプレプリントである。", "p2": "連結した構造系の応答は、各機器の性質、機械的な結合、系の構成（トポロジー）、入力地震動に左右される。高精度の有限要素モデル（FOM）は遅く、純粋なデータ駆動モデルは構成が変わるたびに再学習が要る（抄録、§1）。", "p3": "機器を節点、結合を辺とするグラフで表す。各機器の有限要素モデルをモード縮約して微分可能な動力学演算子にし、GNNは応答そのものではなく、構成に依存する機器間の相互作用力だけを推定してROMに入力する（§2）。例：辺には公称の結合剛性・減衰だけを与え、参照解に含めた隠れた剛性（線形で公称の30%、または3次の非線形項）はGNNが応答の誤差から間接的に学ぶ（§3.2、式22・23）。", "p4": "IEEE 693型の目標スペクトルに合わせた乱数の地震動を与え、機器3〜8台の直列系100件で学習し、6〜8台（既知の規模）と9〜12台（未知の規模）で検証した（§3.3、表1）。指標は頂部の変位・速度、断面モーメント、相互作用力の相対RMSEで、比較対象は公称値だけの物理ROMと純粋なGNN（§3.5、§3.6）。", "p5": "予測は既知・未知の規模とも参照解によく追従し、未知の規模で誤差が単調に増えることはなかった（§4.3、図10）。ROMeGNNは2つの比較対象より誤差が小さく、物理ROMの誤差が最大だった（§4.4、図11）。計算はFOMに比べ線形で約55倍、非線形で約648倍速かった（§4.6、§5）。", "p6": "著者は、対象が直列（ライングラフ）構成と数値参照解で作った制御された隠れ相互作用に限られ、一般的な変電所の配置、多方向の地震動、損傷に依存する相互作用、実験・現場データでの検証、不確実性の定量化とオンライン更新が今後の課題だと認める（§5）。解釈：誤差の数値は図で示され本文に表の値が少ないため、精度の絶対水準は図の読み取りに依存する。", "fun": "機械学習に揺れ方を丸ごと覚えさせるのではなく、各機器の揺れ方は物理の式に任せ、機械学習には「機器同士がどれだけ押し引きし合うか」だけを学ばせました。分担を決めたおかげで、練習した台数より多い装置の並びにも対応できた点が面白いところです。", "unverified": "相対RMSEの具体的な数値（図10・11の値）は本文中に明記がなく未確認。"}}, {"id": "pr10", "rank": 10, "headline": "公立医療の口コミ4.7万件から不満の集中先を特定", "title": "What Citizens Talk About: Lexical Entity Detection and Negative Review Burden in Online Reviews of a Public Healthcare System (Preprint)", "url": "https://doi.org/10.2196/preprints.114843", "authors": "Javier Gazquez-Garcia ほか", "venue": "JMIR Preprints", "date": "2026-10-20", "apa": "Gazquez-Garcia, J., Martinez-Lentisco, M. d. M., Martinez-Castro, S., Sánchez-Laguna, F. J., & Sánchez-Bocanegra, C. L. (2026). What Citizens Talk About: Lexical Entity Detection and Negative Review Burden in Online Reviews of a Public Healthcare System (Preprint). https://doi.org/10.2196/preprints.114843", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの構造化抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "スペイン・アンダルシアの公立医療機関812施設のGoogleマップの口コミ47,589件を、規則ベースの語彙でサービス要素ごとに分解し、否定的な評価が「制度・運営」に最も集中することを示した（抄録）。未査読のプレプリントである。", "p2": "オンラインの口コミは患者体験調査を補いうるが、全体の感情だけを見るとどのサービス領域の話かが埋もれる。要素単位の分析では「要素に言及したこと」と「その要素に感情を向けたこと」を区別する必要がある（抄録）。", "p3": "事前に定めた規則ベースの語彙で6つのサービス要素と7つの苦情・称賛の語彙標識を検出し、感情は星の数で与えた。「否定的口コミ負担」を、全口コミのうち要素に言及しかつ否定的評価のものの割合と定義した（抄録）。例：「予約が取れない」は制度・運営の要素とアクセス障壁の標識に当たる。", "p4": "施設でクラスタリングしたロジスティック回帰で、感情の層ごとに一次医療と病院の語彙標識の差を推定した。語彙は400件の手作業注釈で検証した（抄録）。", "p5": "制度・運営が最も多く検出され（42.6%）、否定的口コミ負担も最大だった（37.3%、95%CI 35.1〜39.5%、全9施設種別で最大）。否定的な口コミでは、アクセス障壁の表現が一次医療で病院より多く（12.5%対2.2%、OR 6.47）、待ち・遅れの表現は少なかった（5.6%対12.0%、OR 0.43）。制度・運営の負担は外来診療センター（52.5%）で最も高かった。6要素中5要素の精度は0.91〜1.00だった（抄録）。", "p6": "著者は、結果は投稿者の言説を記述するもので、患者全体を代表する体験や要素別の感情ではないと明記する（抄録）。語彙標識は精度が高いが再現率が限られ、「施設」の要素は検証性能が不十分で解釈から除いた（抄録）。", "fun": "病院の口コミで一番多い不満は、医師や看護師の腕ではなく「予約や手続きの仕組み」でした。しかも診療所では「予約が取れない」、大病院では「待たされる」と、不満の言い方が場所で変わります。星の数だけでは見えない不満の中身を、言葉の分類で掘り出した点が面白いところです。", "unverified": "語彙の具体的な内容と、施設種別ごとの全結果は抄録の範囲でのみ確認。"}}, {"id": "pr11", "rank": 11, "headline": "グリーンウォッシュ対策は情報開示か罰金か：人工市場実験", "title": "Information Versus Enforcement Against Greenwashing: Pre-Registered Experiments in a Multi-Agent Artificial Market", "url": "https://doi.org/10.2139/ssrn.7640081", "authors": "Ellis Lin", "venue": "SSRN", "date": "2026-10-20", "apa": "Lin, E. (2026). Information Versus Enforcement Against Greenwashing: Pre-Registered Experiments in a Multi-Agent Artificial Market. https://doi.org/10.2139/ssrn.7640081", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "投資家1,000人・企業200社のエージェントベースの人工市場で、グリーンウォッシュ（ESG報告の水増し）対策として、情報の透明性を高めるほうが罰金を4倍にするより真のESG水準を上げることを、事前登録の実験で示した（抄録）。未査読のプレプリントである。", "p2": "規制当局は、水増しした開示を見抜きやすくする（情報）か、監査で見つけて罰する（執行）かでグリーンウォッシュに対処できるが、どちらが効くかの比較は難しい（抄録）。", "p3": "各期に企業は、費用のかかる実質的改善、監査で見つかりうる安い水増し、何もしない、から選び、インパクト投資家は報告ESGを評価し、投資家は模倣で型を変える。市場はCSI 300構成銘柄で初期化し、ESGの資本コストの傾きを約28bp/標準偏差に較正し、基準の罰金を中国の法定上限1,000万元にした（抄録）。", "p4": "59のシナリオ×30の対応付けた乱数シードの事前登録実験で、真のESG水準を標準偏差（SD）単位で比べた。事後に設計した補足分析と、監査件数を固定した第2の事前登録実験も行った（抄録）。", "p5": "政策は投資家の選好を通じてのみ効いた。透明性を0.1→0.6に上げると罰金4倍より真のESGが上がり、基準に対する効果は2つの減衰率で+0.04 SDと+0.33 SDだった。固定の罰金は抑止力がすぐ衰え、1,000万元が小さい大企業は判断の66%で水増しを続けた。時価総額に比例した監査や報告の急変後の監査は、企業が規則を知っていると無作為監査より悪かった（−0.19、−0.14 SD）（抄録）。", "p6": "著者は、すべての結果がモデルに条件付きだと明記する。平均回帰を入れると透明性の優位は+0.003〜+0.006 SDに縮み、虚偽報告ごとに罰金を科すと差は+0.205から+0.058 SDに縮む（抄録）。表形式Q学習の政策は使えるものにならなかった（抄録）。", "fun": "罰金を重くするより、うそを見抜きやすくするほうが効く、という結果です。理由は、大企業には上限1千万元の罰金が小さすぎることと、一度ばれなかった水増しは二度と罰せられないこと。規則を公開した監査は企業にすり抜けられる、という指摘も人間社会らしくて面白いところです。", "unverified": "結果は模擬市場の設定に依存し、実際の市場での検証はない（抄録）。"}}, {"id": "pr12", "rank": 12, "headline": "点群3D-MLLMで箱桁内部の点検行動を推論", "title": "Inspection action reasoning for robotic inspection of precast segmental box girder interiors using a 3D point cloud-based multimodal large language model", "url": "https://doi.org/10.2139/ssrn.7641925", "authors": "Sungwoo Cho ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Cho, S., Im, S., Chung, D., Kim, T., Shim, W., & Kim, H. (2026). Inspection action reasoning for robotic inspection of precast segmental box girder interiors using a 3D point cloud-based multimodal large language model. https://doi.org/10.2139/ssrn.7641925", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "プレキャストセグメント工法の箱桁の内部点検で、3次元点群を入力とするマルチモーダルLLM（3D-MLLM）を微調整し、ロボットが場面に応じて次の点検行動を推論できるようにした（抄録）。未査読のプレプリントである。", "p2": "点検ロボットは決められた経路や間隔でデータを集めることが多く、観察した場面に応じて行動を変えられない。箱桁の内部は似たコンクリート面が続き見た目の変化が乏しい一方、部材の形や配置は異なるため、画像だけでは状況判断が難しい（抄録）。", "p3": "ロボット点検のデータで点群ベースの3D-MLLMを微調整し、状況の認識と点検行動を出力させる（抄録）。解釈：見た目が単調でも、点群なら部材の立体的な形と位置関係から状況を区別できる、という直観である。", "p4": "制御実験で、状況の正解率と点検行動の正解率を、2次元画像ベースのMLLMと比べた。構造部材の識別の事実的な根拠付けの正確さと、関連性（5段階）も評価した（抄録）。", "p5": "3D-MLLMは状況の正解率92.3%、点検行動の正解率94.9%で、2D-MLLMの46.3%・62.8%を大きく上回った。構造部材の識別の根拠付けの正確さは95.8%、平均関連性は4.20/5.0だった（抄録）。", "p6": "抄録の範囲では、実験は制御された条件で、実際の橋での長時間の自律運用や、損傷の検出精度そのものは示されていない（解釈）。対象の橋の数やデータ量も抄録にない（未確認）。", "fun": "箱形の橋の中は、同じようなコンクリートの壁が延々と続く迷路のような場所です。写真では見分けにくくても、立体の形を測った点群なら「今どこにいて次に何を調べるか」が分かる、という違いが、正解率の大差（約46%対92%）になって表れた点が面白いところです。", "unverified": "学習データの規模、対象橋梁、比較モデルの詳細は抄録になく未確認。"}}, {"id": "pr13", "rank": 13, "headline": "逆問題PINNは最適化成功でもパラメータ非同定", "title": "Identifiability and experimental design for inverse physics-informed engineering models", "url": "https://doi.org/10.31224/8564", "authors": "Luis Torres", "venue": "engrXiv", "date": "2026-10-21", "apa": "Torres, L. (2026). Identifiability and experimental design for inverse physics-informed engineering models. https://doi.org/10.31224/8564", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "engrXivの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "逆問題の物理情報ニューラルネット（PINN）が目的関数を正確に最小化しても、材料や運転のパラメータが一意に決まらないことがある、という同定可能性の問題を整理し、センサ配置と載荷の選び方を目的のパラメータに結び付ける実験計画の手順を提案したレビュー（抄録）。未査読のプレプリントである。", "p2": "逆解析で「最適化がうまくいった」ことと「パラメータが同定できた」ことは別物だが、PINNの研究では混同されがちである（抄録）。", "p3": "熱伝導、圧力駆動流、軸方向変形の厳密な例で、観測がパラメータの組合せだけを決め、個々の成分を決めない状況を示す。局所感度行列、無次元化、撹乱パラメータ、プロファイル目的関数で実用的な診断を整理した（抄録）。例：変形からは剛性と断面積の積しか決まらない、という形の非同定（解釈：抄録の「組合せ」の具体化）。", "p4": "新しい実験ではなくレビューで、公表された流れと粘塑性のPINN研究を表現と構成則モデル化の文脈として参照し、逆問題の解析から条件付きの安定性の結果を引いた（抄録）。", "p5": "抄録には定量的な結果はない。成果は、同定可能性の診断の整理と、センサ配置・載荷の選択を目的の工学パラメータに結び付ける実験計画のワークフローである（抄録）。", "p6": "抄録の範囲では、提案ワークフローを実データで検証した結果は示されていない（未確認）。解釈：レビューの性格上、個別の問題での有効性は読者が確かめる必要がある。", "fun": "答え合わせで誤差がゼロになっても、正しい答えにたどり着いたとは限りません。たとえば「縦×横」の面積しか分からなければ、縦と横を別々には決められないのと同じです。機械学習の逆解析でも、測り方を工夫しないと答えが一つに決まらない、という基本を思い出させてくれる点が面白いところです。", "unverified": "例の具体的な式と、提案ワークフローの適用例は抄録になく未確認。"}}, {"id": "pr14", "rank": 14, "headline": "PGDと合成前処理で位相空間のボルツマン輸送を低ランク解法", "title": "Proper generalized decomposition with synthetic preconditioning for multiscale parametric phonon transport", "url": "https://arxiv.org/abs/2610.27880", "authors": "Jia Liu ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Liu, J., & Su, W. (2026). Proper generalized decomposition with synthetic preconditioning for multiscale parametric phonon transport (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27880", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（抄録、目次、図表キャプション、結論§7）を中心に読んだ。理論解析§3〜§5と付録の式展開は読んでいない", "preprint": true, "p1": "位相空間に広がるフォノン（格子振動の量子）のボルツマン輸送方程式を、分布を「空間・方位角の因子×極角の因子」の和に分ける固有一般化分解（PGD）と、巨視的なモーメント方程式で収束を加速するGSISを組み合わせ、ランク3〜14で全次元解を再現できるようにした（抄録、§7）。未査読のプレプリントである。", "p2": "決定論的な解法は、①分布関数が高次元の位相空間（位置と運動方向）に依存すること、②散乱が頻繁なとき反復（ソース反復）の収束が極端に遅いこと、の2点で高価だった（抄録）。", "p3": "2次元の定常・線形化灰色Callawayモデルで、分布を空間・方位角の因子と極角の因子の積の和で表す。特性線に沿うと極角は面内の光学的厚さを引き伸ばすだけなので、ランクは核 exp(−τ/sinφ) の数値ランクでクヌーセン数によらず抑えられる（抄録、§7）。PGD–GSISは交互更新の各段で巨視的な源を固定し、GSISのモーメント方程式で更新する（抄録）。", "p4": "等温キャビティ、面直方向の熱伝導、フォノンのポアズイユ流の3問題で、拡散から弾道までの6組のクヌーセン数について、全次元GSISの解に対する熱流束の誤差、必要ランク、計算時間とメモリを比べた（§7、図5・8・9）。純粋なPGDも比較対象とした。", "p5": "フーリエ解析では、純粋なPGDは巨視的な情報を遅れた空間掃引でしか伝えずソース反復のように停滞するが、合成更新は表現誤差の3次モーメントしか見ない（抄録）。PGD–GSISはランク3〜14で熱流束誤差6×10⁻³未満を全3問題で達成し、メモリは極角の解像度にほとんど依存しなかった。計算時間は全次元GSISと同程度だった（§7）。クヌーセン数をパラメータとする版では、ランク30で温度約1%、熱流束約4%の精度だった（§7）。", "p6": "著者は、非灰色の散乱（周波数を座標に加える）と3次元形状への拡張、固定のランクと反復回数での漸近保存性の条件の一様な達成、運動論的な層を含む完全離散の解析が未解決だと認める（§7）。大きなクヌーセン数では全極角因子の同時更新が必要で、それなしでは発散した（抄録、§7）。", "fun": "熱を運ぶ「音の粒」の動きは、場所と向きの両方を考える必要があり、計算量が爆発します。ところが向きのうち上下の角度は、実は「通り道の長さを引き伸ばすだけ」なので、わずか数個から十数個の部品の掛け算で表せることが分かりました。物理の性質を見抜くと高次元の計算がぐっと軽くなる、という点が面白いところです。", "unverified": "§3〜§6の理論解析と数値表の詳細（表1・2の値）は読んでいない。"}}, {"id": "pr15", "rank": 15, "headline": "生波形Transformerで土石流の地震動を早期警報", "title": "Debris Flow Early Warning Using the Patch Fourier Transformer", "url": "https://doi.org/10.2139/ssrn.7642738", "authors": "Yanling Liu ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Liu, Y., Li, S., Turowski, J. M., Tang, H., Ouyang, C., Xu, Q., Zhang, B., Yang, J., An, B., & Zhou, Q. (2026). Debris Flow Early Warning Using the Patch Fourier Transformer. https://doi.org/10.2139/ssrn.7642738", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "土石流が発生させる地震動の生波形を短時間フーリエ変換のパッチに分け、注意機構で時間変化を学ぶPatch Fourier Transformer（PFT）で、土石流を検知し下流到達の24〜170分前に警報を出せることを示した（抄録）。未査読のプレプリントである。", "p2": "土石流の事象単位の警報には地震計の信号の素早い識別が要るが、多くの機械学習の手順は手作りの特徴量に頼り、学習前に有用な情報を捨てている可能性がある（抄録）。", "p3": "3成分の地震波形を局所的なSTFTのパッチに変換し、注意機構に基づく系列モデルで流れが生む地震エネルギーの時間的な発達を学ぶ（抄録）。解釈：土石流は近づくにつれて周波数帯ごとのエネルギーが特徴的に増えるため、その時間的な形を直接学ばせる発想である。", "p4": "スイス・イルグラーベン流域の地震記録で学習・評価し、2020年の事象は連続運用の模擬警報のために取り置いた。比較対象は特徴量ベースの機械学習モデルとSTA/LTA（短時間平均/長時間平均比）法である（抄録）。", "p5": "PFTは3観測点すべてでF1スコア0.96超を達成し、ネットワーク単位の警報を土石流の先端が下流の砂防堰堤CD29に到達する24〜170分前に出した。2020年の模擬では事象単位の見逃しも誤報もなかった。連続した現場条件で比較手法より安定していた（抄録）。", "p6": "著者は、未知の5流域での予備的な試験は転用可能性を示唆するが、地点ごとの検証が必要だとする（抄録）。解釈：2020年の模擬の事象数は抄録になく、見逃し・誤報ゼロの統計的な確かさは事象数に依存する。", "fun": "土石流は流れながら地面を揺らすので、遠くの地震計に「足音」が届きます。その足音の録音を、人が選んだ特徴にまとめずにそのままAIに聞かせたところ、最大で約3時間前に警報を出せました。耳で聞き分けるような学び方に任せた点が面白いところです。", "unverified": "2020年の模擬に含まれる事象数、比較手法の具体的な数値は抄録になく未確認。"}}, {"id": "pr16", "rank": 16, "headline": "外国企業説明責任法は監査品質を高めたか", "title": "The Holding Foreign Companies Accountable Act and Audit Quality", "url": "https://doi.org/10.2139/ssrn.7624918", "authors": "Parker Lam", "venue": "SSRN", "date": "2026-10-20", "apa": "Lam, P. (2026). The Holding Foreign Companies Accountable Act and Audit Quality. https://doi.org/10.2139/ssrn.7624918", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "米国の外国企業説明責任法（HFCAA）の成立が、米国上場の中国・香港企業の監査品質を高めたかを調べる研究計画（抄録）。", "p3": "監査品質を監査報酬、継続企業の前提に関する意見、異常裁量的発生高で測り、国有企業と非国有企業の違いや監査人の交代（特にBig4への交代）も分析する（抄録）。", "p5": "抄録は分析の計画を述べる形で、結果は書かれていない（未確認）。", "fun": "監査人を外から検査できない国の企業を「上場廃止にするぞ」と迫る法律ができたら、会社の帳簿のチェックは本当に厳しくなるのか、という問いです。法律という外からの圧力が、目に見えない監査の質を変えるかを、報酬や会計数字の不自然さから間接的に測ろうとする点が面白いところです。", "unverified": "結果（効果の有無と大きさ）は抄録に記載がなく未確認。"}}, {"id": "pr17", "rank": 17, "headline": "PE傘下の会計事務所でスタッフ監査人の士気低下", "title": "(Pay)check Please. Staff Auditor Apathy in PE-Backed Accounting Firms", "url": "https://doi.org/10.2139/ssrn.7635558", "authors": "Joshua Khavis ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Khavis, J., Landy, C., Li, M., & Tighe, A. (2026). (Pay)check Please. Staff Auditor Apathy in PE-Backed Accounting Firms. https://doi.org/10.2139/ssrn.7635558", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "プライベート・エクイティ（PE）が出資した会計事務所で、若手のスタッフ監査人の職場経験がどう変わったかを示した（抄録）。", "p3": "アーカイバルデータの比較と、PE傘下の事務所のスタッフ監査人17人への面接を組み合わせた混合研究法（抄録）。", "p5": "PE傘下ではPE出資後に労働時間が減ったが、報酬と全体の職務満足は変わらず、キャリア機会・組織文化・上級経営陣への評価が下がった。面接ではAI依存、オフショア化、コスト削減、パートナー制度の変化が将来性を損なうと受け止められていた（抄録）。", "fun": "投資ファンドが会計事務所を買うと、働く時間は減ったのに若手の気持ちは冷めていった、という一見逆向きの結果です。給料や満足度の数字だけでは見えない「この職業に将来はあるのか」という不安を、面接で掘り起こしたところが面白い点です。", "unverified": "労働時間の減少幅などの具体的な数値は抄録になく未確認。"}}, {"id": "pr18", "rank": 18, "headline": "インドのESG開示と実績の乖離を検証", "title": "The Gap between ESG Disclosure and Actual Performance: Evidence from India’s BRSR Core Reporting", "url": "https://doi.org/10.21203/rs.3.rs-11408132/v1", "authors": "Kanika Jindal", "venue": "Research Square (In Review)", "date": "2026-10-20", "apa": "Jindal, K. (2026). The Gap between ESG Disclosure and Actual Performance: Evidence from India’s BRSR Core Reporting. https://doi.org/10.21203/rs.3.rs-11408132/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "インドの保証付き必須ESG開示（BRSR Core）で、開示の質が実際のESG成果を反映していないことを示した（抄録）。", "p3": "NIFTY 50企業の2期分（99企業年）のXBRL開示について、55項目で開示の質を、23指標で業種調整した成果を測り、相関と合成指標の構造モデル、ブートストラップと並べ替え検定で乖離を評価した（抄録）。", "p5": "開示の質は高く収束していた（0〜1で平均0.92）が成果とは無関係で、9属性中8属性で乖離は無作為な組合せと同程度、全体では開示の質と成果が逆相関（β = −0.38、並べ替えp = 0.002）だった（抄録）。", "fun": "報告書がきちんと書けている会社ほど、実際の環境・社会の成績は良くない、という逆の関係が出ました。「書類が完璧」と「中身が良い」は別物だということを、数字で確かめた点が面白いところです。", "unverified": "対象は2年・50社で因果関係は主張していない（抄録）。各属性の個別の数値は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "アルバニア企業の倒産パターンの傾向", "title": "Insolvency Pattern Trends in Albanian Enterprises: An in-depth Investigation", "url": "https://doi.org/10.2139/ssrn.7626499", "authors": "Erjole Barbullushi ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Barbullushi, E., Kastrati, A., & Kinka, A. (2026). Insolvency Pattern Trends in Albanian Enterprises: An in-depth Investigation. https://doi.org/10.2139/ssrn.7626499", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "アルバニア企業向けの倒産予測モデル（段階的Zスコア）を作った（抄録）。", "p3": "70社の財務データから25の財務比率を計算し、多変量判別分析で段階的にZスコアモデルを構築した（抄録）。", "p5": "流動性・回転率・財務構造・収益性の比率が有意な予測因子で、全体の分類精度は84.3%、倒産企業の予測精度は91.4%だった（抄録）。", "fun": "会社がつぶれる前には、お金の回り方や借金の割合に兆しが出ます。それをいくつかの比率の重み付き合計（Zスコア）にまとめ、国ごとの事情に合わせて作り直すと、どこまで当たるかを試した研究です。", "unverified": "70社という小標本で検証用標本の扱いは抄録から未確認。"}}, {"id": "pr20", "rank": 20, "headline": "IFRS強制・任意適用企業の利益水準の違い", "title": "Switching Standards or Changing Standards? Reported Profitability of Mandatory and Voluntary IFRS Adopters in Europe", "url": "https://doi.org/10.2139/ssrn.7630519", "authors": "Sidhartha Sharma", "venue": "SSRN", "date": "2026-10-20", "apa": "Sharma, S. (2026). Switching Standards or Changing Standards? Reported Profitability of Mandatory and Voluntary IFRS Adopters in Europe. https://doi.org/10.2139/ssrn.7630519", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "2005年の欧州のIFRS強制適用で報告利益が上がった理由が、基準の切替えだけでなく基準自体の改訂にもあることを示した（抄録）。", "p3": "欧州17か国1,399社の適用企業と、IFRSが強制されない8か国6,335社の対照企業を比べ、ROAの変化と、その内訳（発生高、減価償却、営業キャッシュフロー）を分解した（抄録）。", "p5": "適用企業のROAは2006〜07年に対照より2.5%上昇（0.19標準偏差）し、増加の約75%は新たな発生高に関係し、減価償却の減少は総資産比1.1ポイント、営業キャッシュフローの変化はゼロと区別できなかった（抄録）。", "fun": "会計のルールを変えると、会社の中身は同じでも利益の数字が変わります。その変化が「ルールを乗り換えたから」なのか「ルール自体が書き換わったから」なのかを、乗り換えなかった会社と比べて切り分けたところが面白い点です。", "unverified": "抄録の「2.5 percent」と「0.19標準偏差」の対応関係の詳細は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "LLMは内部監査人試験に通るか", "title": "Evaluating LLMs on the Certified Internal Auditor Exam", "url": "https://doi.org/10.32545/ev202610001907.v1", "authors": "Malgorzata Pankowska ほか", "venue": "MDPI AG", "date": "2026-10-20", "apa": "Pankowska, M., & Żytniewski, M. (2026). Evaluating LLMs on the Certified Internal Auditor Exam. https://doi.org/10.32545/ev202610001907.v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": true, "short": true, "p1": "題名から、大規模言語モデルを公認内部監査人（CIA）試験で評価した研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「AIは監査の専門資格試験に受かるほど監査を理解しているか」です。試験の点数が実務の力をどこまで表すのか、という問いそのものも面白いところです。", "unverified": "対象モデル・評価方法・結果はすべて未確認。"}}, {"id": "pr22", "rank": 22, "headline": "LLMはエージェントベースモデルの各段階で使える", "title": "Large Language Models for Agent-Based Modelling: Current and possible uses across the modelling cycle", "url": "https://arxiv.org/abs/2507.05723", "authors": "Lo\\\"is Vanh\\'ee ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Vanhée, L., Borit, M., Siebers, P.-O., Cremades, R., Frantz, C., Gürcan, Ö., Kalvas, F., Kera, D. R., Nallur, V., Narasimhan, K., & Neumann, M. (2025). Large Language Models for Agent-Based Modelling: Current and possible uses across the modelling cycle (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2507.05723", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "エージェントベースモデル（ABM）の作成サイクルの各段階で、LLMがどう使えるかを批判的に整理した（抄録）。", "p3": "ABMでのLLMの現在の利用をレビューし、問題設定から結果の文書化・伝達までのモデリングサイクルに沿って機会と課題を検討した（抄録）。", "p5": "抄録は整理の枠組みを述べるにとどまり、具体的な結論の内容は書かれていない（未確認）。", "fun": "たくさんの「小さな人」をコンピュータの中で動かして社会を再現するのがABMです。LLMはその「人」役にも、モデルを作る助手役にもなれますが、どの段階で使うと得で、どこが危ないのかを順を追って考えた点が役に立ちます。", "unverified": "各段階についての具体的な提言の内容は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "財務文書レビューで単一LLMと複数エージェントを比較", "title": "The More the Better? A Comparison of Single- and Multi-Agent LLM Setups on a Financial Review Task", "url": "https://arxiv.org/abs/2610.27488", "authors": "Pei Liu", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Liu, P. (2026). The More the Better? A Comparison of Single- and Multi-Agent LLM Setups on a Financial Review Task (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27488", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "文書レビューを複数エージェントに分担させると欠陥は少し多く見つかるが、誤警報が増え、総合精度はほぼ変わらないことを示した（抄録）。", "p3": "与信審査メモ300件（合成）を6要件で点検する課題で、1エージェントが6要件を見る場合と3エージェントが2要件ずつ見る場合を4モデルで比較し、見逃しと誤警報を別々に測った（抄録）。", "p5": "チームは説明付きの欠陥を0.08〜0.10多く検出したが誤警報は4モデルすべてで増え、バランス精度の変化は0.02以下、トークンは2.2〜2.4倍だった。単一エージェントを3回試行していずれかで指摘する方式の方が高いバランス精度だった（抄録）。", "fun": "「みんなで分担すれば見落としが減る」という常識を厳密に試すと、確かに見つける数は増えるけれど、空振りの警報も増えて差し引きほぼ同じでした。同じ人に3回見直させる方が良い、という結果は人間の仕事の分け方にも通じる面白さがあります。", "unverified": "モデル別の詳細な数値は抄録の範囲でのみ確認。"}}, {"id": "pr24", "rank": 24, "headline": "利用者と対話する場面で多エージェント協調は得か", "title": "Does Multi-Agent Collaboration Pay When Agents Serve Users? Testing Agent Scaling in Dual-Control Settings", "url": "https://arxiv.org/abs/2610.27655", "authors": "Ethan Yang ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Yang, E., & Shi, X. (2026). Does Multi-Agent Collaboration Pay When Agents Serve Users? Testing Agent Scaling in Dual-Control Settings (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27655", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "利用者と対話しながら働く場面では、多エージェント構成が単一エージェントに勝たないことを事前登録の実験で示した（抄録）。", "p3": "τ2-benchの航空・小売・通信の3領域で、標準の単一エージェントと同じモデルの集中型多エージェントを、3系統6モデル・約7,950の模擬会話で、エピソードごとのトークン台帳をそろえて比較した（抄録）。", "p5": "有効な13セル中12で多エージェントが劣り、1つは同等で、能力の範囲全体で利得は負（加重平均 −28ポイント、95%CI [−44, −12]）。先行研究の規則が利得を予測する2セルでも13・22ポイント負けた（抄録）。", "fun": "AIをチームにすれば強くなると思われがちですが、人と会話しながら規則を守って動く仕事では、かえって成績が下がりました。相談役が増えるほど話がこじれる、という人間の会議でもよくある現象と重なって見える点が面白いところです。", "unverified": "多エージェントの計画役が道具の仕様を見ていなかったという妥当性の限界がある（抄録）。"}}, {"id": "pr25", "rank": 25, "headline": "LLMによる議論グラフ生成の検証方法", "title": "On the LLM Verification for Argument Graph Generation", "url": "https://arxiv.org/abs/2610.27361", "authors": "Jakub B\\k{a}ba ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Bąba, J., & Chudziak, J. A. (2026). On the LLM Verification for Argument Graph Generation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27361", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMが作る議論グラフの検証は、決定的な検査を先に置き、LLMの審査は不確実な部分に限るべきだと示した（抄録）。", "p3": "決定的検査→ソルバーとLLMの審査→不確実なときだけ討論→最後に人間、という層状の検証を提案し、構造的な欠陥を注入した人手注釈グラフで検証した（抄録）。", "p5": "LLMの審査役は欠陥をほぼ上限の再現率で見つけたが、正しいグラフの約10件に1件に異議を唱え、同じ入力で判定が揺れ、同等の厳密検査より大幅に遅かった（抄録）。", "fun": "AIの答えをAIにチェックさせるのが流行していますが、「矛盾した循環があるか」のように機械的に確かめられることは、普通のプログラムで確かめた方が確実で速い、という指摘です。道具ごとに保証できることが違う、という当たり前を思い出させてくれます。", "unverified": "欠陥の種類別の検出率などの数値は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "LLMエージェントの意思決定ルールを推定する", "title": "Estimating Decision Rules from Large Language Model Agents: An Application to Bank Balance-Sheet Management", "url": "https://doi.org/10.21203/rs.3.rs-11429290/v1", "authors": "Zlatin Sarastov", "venue": "Research Square (In Review)", "date": "2026-10-20", "apa": "Sarastov, Z. (2026). Estimating Decision Rules from Large Language Model Agents: An Application to Bank Balance-Sheet Management. https://doi.org/10.21203/rs.3.rs-11429290/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "LLMエージェントが生成した銀行の資産負債管理の判断を、簡単な方程式で近似できることを示した（抄録）。", "p3": "ユーロ圏の預金中心の銀行が預金金利・貸出利ざや・債券再投資を決める月次のリーダー・フォロワー型ABMで、LLMの判断を方程式で近似し、推定に使わないシミュレーションで評価した（抄録）。", "p5": "10の検証シミュレーションでROEを0.31ポイント以内で再現し、7つですべての適合基準を満たしたが、預金流出シナリオでは満たさなかった。別系統のLLMではROE差0.71ポイント以内、全基準を満たしたのは18中6だった（抄録）。", "fun": "AIの判断はブラックボックスですが、それを「金利がこう動けばこう決める」という簡単な式に置き換えられれば、中身を説明できるようになります。経済学者が人間の行動を式で表してきたやり方を、AIの行動に当てはめた点が面白いところです。", "unverified": "方程式の具体的な形は抄録になく未確認。"}}, {"id": "pr27", "rank": 27, "headline": "FBG受信器でガイド波SHMの感度と環境ドリフトを補償", "title": "FBG acoustic receivers for Guided Waves Structural Health Monitoring: sensitivity optimization and environmental drift compensation", "url": "https://cea.hal.science/cea-05820852v1", "authors": "Arnaud Recoquillay ほか", "venue": "HAL", "date": "2026-10-20", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "HALの抄録（3文のみ）を使用", "preprint": true, "short": true, "p1": "ファイバブラッググレーティング（FBG）で、環境条件が変わる中で構造のガイド波（超音波）を測る仕組みを作った（抄録）。", "p3": "FBGで超音波を測る装置を設計し、曲げ試験中に試験した。FBGの長さも最適化した（抄録）。", "p5": "抄録には結果の記載がない（未確認）。", "fun": "光ファイバの中に刻んだ細かい縞（FBG）は、伸び縮みすると反射する光の色が変わります。この仕組みで構造物を伝わる超音波を聞き取り、温度などの変化による「ずれ」を補正しようという発想です。", "unverified": "感度や補償の効果の数値は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "振動診断はランダム分割で性能を過大評価する", "title": "Beyond Random Splits: Domain-Shift Evaluation of Fiber BraggGrating Accelerometer-Based Electric Motor Fault Diagnosis AcrossUnseen Operating Conditions", "url": "https://doi.org/10.2139/ssrn.7643321", "authors": "Douglas Soprani ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Soprani, D., Santos, K. F. d. O., Macedo, L., Villani, L. G., Leal-Junior, A., & Frizera-Neto, A. (2026). Beyond Random Splits: Domain-Shift Evaluation of Fiber BraggGrating Accelerometer-Based Electric Motor Fault Diagnosis AcrossUnseen Operating Conditions. https://doi.org/10.2139/ssrn.7643321", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "同じ計測から切り出した窓を学習と評価に混ぜると、振動による故障診断の性能が過大に見積もられることを示した（抄録）。", "p3": "FBG加速度計2台による電動機の5クラス故障診断を、計測ごとに学習・評価を分けるグループ分割と、回転速度条件をまたぐ転移で再評価し、手作り特徴量と1次元CNN、MMDによる教師なし領域適応、少数ショット適応を比べた（抄録）。", "p5": "同じ実験の先行研究の混合条件評価では平均精度が約99%だったのに対し、グループを考慮した評価では約79%で、CNN–Spectrumが最良だった（抄録）。", "fun": "テストの問題が練習問題とほとんど同じなら満点が取れて当然です。振動データでも同じ測定から切り出した断片を学習とテストに混ぜると「カンニング」に近くなり、本当の実力は約99%ではなく約79%だった、という指摘が面白いところです。", "unverified": "CNN–SpectrumのマクロF1の値は抄録が途中で切れており未確認。"}}, {"id": "pr29", "rank": 29, "headline": "CLT床の衝撃加振源ごとの振動音響特性", "title": "Vibroacoustic Characterisation of Cross-Laminated Timber Floor Assemblies under Different Impact Excitation Sources", "url": "https://doi.org/10.2139/ssrn.7641837", "authors": "Mohammad Hossein Asadi Jafari ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Asadi Jafari, M. H., Zhou, J., Lee, J., & Schoenwald, S. (2026). Vibroacoustic Characterisation of Cross-Laminated Timber Floor Assemblies under Different Impact Excitation Sources. https://doi.org/10.2139/ssrn.7641837", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "CLT（直交集成板）床の低周波の衝撃音を、加振源・モード・放射音響パワーを結び付けて評価した（抄録）。", "p3": "4種類の床構成を20〜315 Hzで歩行・ゴムボール・ISOタッピングマシンで加振し、運用モード解析（OMA）で固有振動数・減衰・モード形を、波数領域の積分変換法で放射音響パワーを求めた（抄録）。", "p5": "タッピングマシンは70 Hz以下で減衰比を歩行・ゴムボールより5〜29倍低く与え、16.8 Hzの基本モードを励起できず、低周波の応答を過小評価した（抄録）。", "fun": "木造の床の「ドスン」という響きを評価するとき、規格の打撃装置ではいちばん低い揺れ（16.8 Hz）がそもそも起きない、という結果です。測る道具によって見える現象が変わることを、振動の測り方から示した点が面白いところです。", "unverified": "波数領域解析の結論部分は抄録が途中で切れており未確認。"}}, {"id": "pr30", "rank": 30, "headline": "フラクタル次元をもつ自己相似梁の減衰自由振動", "title": "Fractal-dimensional structural dynamics of self-similar beams: A matrix-based formulation", "url": "https://doi.org/10.2139/ssrn.7643647", "authors": "Gelasio Velázquez ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Velázquez, G., Jacobo Armendáriz, V. H., Ortiz Prado, A., Damián Adame, L., & Gutiérrez-Torres, C. d. C. (2026). Fractal-dimensional structural dynamics of self-similar beams: A matrix-based formulation. https://doi.org/10.2139/ssrn.7643647", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "フラクタル次元をもつ自己相似梁の減衰自由振動を、行列形式で解析する定式化を示した（抄録）。", "p3": "フラクタル効果を質量・剛性行列に組み込み、それから減衰行列と多自由度の運動方程式を作り、フラクタル座標からデカルト座標に書き直した。空間と時間のフラクタル性を表す2つのパラメータが加わる（抄録）。", "p5": "フラクタル次元の異なる2種類の梁で数値解を求め、フラクタルパラメータが減衰振動に与える影響を図で示した（抄録）。具体的な数値は抄録にない。", "fun": "雪の結晶のように、拡大しても同じ形が現れる図形をフラクタルといいます。そんな複雑な形の梁の揺れを、普通の構造力学と同じ行列の形で扱えるように書き直した点が面白いところです。", "unverified": "応答の具体的な数値や検証の有無は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "GNSS観測点速度場の不確実性の記述を改善", "title": "Improved description of GNSS station velocity field uncertainty for high-precision applications", "url": "https://doi.org/10.22541/essoar.15010725/v1", "authors": "K. Gobron ほか", "venue": "ESS Open Archive", "date": "2026-10-20", "apa": "Gobron, K., Rebischung, P., Chanard, K., & Altamimi, Z. (2026). Improved description of GNSS station velocity field uncertainty for high-precision applications. https://doi.org/10.22541/essoar.15010725/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossref登録の抄録を使用", "preprint": true, "short": true, "p1": "GNSS観測点の位置時系列の雑音の空間相関を考慮して、全球の観測点速度場の誤差共分散を導いた（抄録）。", "p3": "GNSS位置時系列の雑音の時空間相関の最近の特徴付けをもとに、多尺度の時空間雑音相関モデルを作り、速度場の誤差の完全な共分散行列を導いた（抄録）。", "p5": "抄録の結果の部分が途中で切れており、具体的な結論は未確認。", "fun": "GNSSの観測点は地面の動きを年に数ミリの精度で追いますが、遠く離れた観測点の誤差が似た動きをすると、速度の不確かさを小さく見積もりすぎます。誤差同士のつながりまで数えて「本当の不確かさ」を出し直す試みです。", "unverified": "不確実性がどれだけ変わるかの数値は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "高層コンクリート煙突のGNSS構造モニタリング", "title": "GNSS BASED STRUCTURAL HEALTH MONITORING SYSTEM FOR HIGH-RISE CONCRETE CHIMNEYS", "url": "https://doi.org/10.5593/sgem2014/b22/s9.037", "authors": "Maciej Wrona", "venue": "HAL", "date": "2026-10-20", "apa": "Wrona, M. (2014). GNSS BASED STRUCTURAL HEALTH MONITORING SYSTEM FOR HIGH-RISE CONCRETE CHIMNEYS. 14th SGEM GeoConference on INFORMATICS, GEOINFORMATICS AND REMOTE SENSING, 2. https://doi.org/10.5593/sgem2014/b22/s9.037", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": true, "short": true, "p1": "題名から、高層コンクリート煙突の構造ヘルスモニタリングをGNSSで行うシステムの研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「衛星測位で背の高い煙突の揺れや傾きを見張れるか」です。カーナビと同じ仕組みを、構造物の健康診断に使うという発想が面白いところです。", "unverified": "システム構成・精度・結果はすべて未確認。"}}, {"id": "pr33", "rank": 33, "headline": "再生核ヒルベルト空間でのノルム最適な縮約", "title": "Norm-optimal model order reduction in reproducing kernel Hilbert spaces", "url": "https://arxiv.org/abs/2610.28224", "authors": "Tam\\'as D\\'ozsa ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Dózsa, T., Angino, A., Krause, R., & Voigt, M. (2026). Norm-optimal model order reduction in reproducing kernel Hilbert spaces (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28224", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "再生核ヒルベルト空間（RKHS）でのモデル次数縮約（MOR）について、ノルム最適な縮約モデルの条件とアルゴリズムを与えた（抄録）。", "p3": "H2空間の有理関数で知られる補間型の必要条件をRKHSに一般化し、微分可能な核向けにIRKAの代替を作った。さらに一般化マルムクィスト・タケナカ関数で正規直交基底を作り、微分不可能な核にも拡張した（抄録）。", "p5": "サポートベクターマシンや深いReLUネットワークなど機械学習モデルのノルム最適な縮約を数値実験で示した（抄録）。", "fun": "複雑なモデルを、性能をなるべく落とさずに小さなモデルで置き換えるのが縮約です。制御工学で使われてきた「最適な縮め方」の理論を、機械学習のモデルにまで広げた点が面白いところです。", "unverified": "数値実験での誤差の大きさは未確認。"}}, {"id": "pr34", "rank": 34, "headline": "周波数依存境界をもつ振動音響系のモデル縮約", "title": "Model Order Reduction of Broadband Vibroacoustic Systems with Frequency-dependent Boundary Conditions", "url": "https://doi.org/10.2139/ssrn.7642155", "authors": "Laurits Bachmann Theil ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Theil, L. B., Andersen, P. R., Engsig-Karup, A. P., & Aage, N. (2026). Model Order Reduction of Broadband Vibroacoustic Systems with Frequency-dependent Boundary Conditions. https://doi.org/10.2139/ssrn.7642155", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "周波数に依存する境界条件（完全整合層など）をもつ振動音響系でも、射影型のモデル縮約ができる定式化を示した（抄録）。", "p3": "微分が容易に得られる関数のクラスを使って安定なテイラー級数近似を作り、完全整合層などの有限要素行列への寄与を導いた（抄録）。", "p5": "抄録の後半が途中で切れており、計算時間の削減などの結果は未確認。", "fun": "音や振動が遠くへ逃げていく様子を計算するには、計算領域の端で波を吸い込む特殊な境界が必要です。その境界が周波数ごとに性質を変えるため、従来の縮約が使えなかったところを工夫で解決した研究です。", "unverified": "縮約による高速化の程度は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "年次衛星データの事後情報が地すべり感受性を水増し", "title": "Post-event information in calendar-year satellite products inflates landslide susceptibility assessments", "url": "https://doi.org/10.31223/x5rb93", "authors": "Yifan Du ほか", "venue": "EarthArXiv", "date": "2026-10-20", "apa": "Du, Y., Zheng, T., Yang, P., Li, Y., Zhou, J., & Yang, K. (2026). Post-event information in calendar-year satellite products inflates landslide susceptibility assessments. https://doi.org/10.31223/x5rb93", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossref登録の抄録を使用", "preprint": true, "short": true, "p1": "年単位の衛星データ製品を使うと、発生後の情報が混入して地すべり感受性の評価が水増しされることを示した（抄録）。", "p3": "地震7件・豪雨11件の計18事象（61,402か所の地すべり）で、点・空間分割・モデル・ブートストラップを固定したまま入力の年だけを変えて比較した（抄録）。", "p5": "発生前年のAlphaEarth製品を発生年のものに替えると、点モデルの交差検証AUCが0.087（95%CI 0.065–0.110、18事象すべて）上がり、パッチCNNでは0.071上がった。水増しは地すべり跡など事象の地表変化を学習することによる（抄録）。", "fun": "「ここは崩れやすい」と予測するつもりが、実は崩れた跡を見て当てていた、という落とし穴です。答えを見てから解いたテストの点数が上がるのと同じで、データの時間の順序を守ることの大切さを示した点が面白いところです。", "unverified": "予測時だけ発生年を使う場合の詳細は抄録の範囲でのみ確認。"}}, {"id": "pr36", "rank": 36, "headline": "等価剛性を辺属性にしたGAT-LSTMで地すべり変位予測", "title": "Topographic and Equivalent-Stiffness Edge-Attribute-Enhanced GAT-LSTM for Multi-Point Displacement Prediction of Rainfall-Induced Soil Landslides: A Case Study", "url": "https://doi.org/10.2139/ssrn.7642449", "authors": "Faquan Wu ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Wu, F., Wang, S., Zhang, F., Zhou, Y., Jin, L., Wen, S., Wu, J., Hu, Y., & Saroglou, C. (2026). Topographic and Equivalent-Stiffness Edge-Attribute-Enhanced GAT-LSTM for Multi-Point Displacement Prediction of Rainfall-Induced Soil Landslides: A Case Study. https://doi.org/10.2139/ssrn.7642449", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "地形と等価剛性を辺の属性にしたグラフ注意ネットワークとLSTMで、降雨による地すべりの多点変位を予測した（抄録）。", "p3": "地表の監視点6か所をグラフの節点とし、過去変位・気象・地形・地盤定数を節点入力、斜面頂部からの距離差・方位・傾斜・等価剛性の差を辺属性にした。過去24時間から72時間先の鉛直変位増分を予測する（抄録）。", "p5": "中国浙江省新昌県の並進型地すべりで、時間分割の評価でRMSEは1.9409 mmだった（抄録）。", "fun": "斜面の何か所かの動きは、互いの位置関係や地盤の硬さでつながっています。その「つながり」をネットワークとして機械学習に教え込むと、崩れる前の動きをより正確に予測できるかを試した研究です。", "unverified": "比較手法との差は抄録が途中で切れており未確認。"}}, {"id": "pr37", "rank": 37, "headline": "設計向けの無次元地盤-構造物相互作用モデル", "title": "A Simplified Dimensionless Analytical Model For Design-Oriented Soil-Structure Interaction Analysis", "url": "https://doi.org/10.2139/ssrn.7633939", "authors": "Javier Sánchez-Haro ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Sánchez-Haro, J., Costa, A. d., & Gil, A. (2026). A Simplified Dimensionless Analytical Model For Design-Oriented Soil-Structure Interaction Analysis. https://doi.org/10.2139/ssrn.7633939", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "地盤-構造物相互作用（SSI）を、3つの無次元パラメータだけで表す設計向けの閉じた解析解で評価できるようにした（抄録）。", "p3": "地盤と構造の連成挙動を等価な2自由度系で表し、地盤の有効慣性を明示的に入れた無次元の閉形式解から、地盤と構造の変位と連成系の固有振動数を直接求める（抄録）。", "p5": "SSIが応答を大きく変える領域や共振条件を示す無次元の設計図表を作れるとしている。具体的な数値は抄録にない。", "fun": "建物は地面の上に立っているので、地震のときは地面と建物が一緒に揺れ合います。その複雑な関係を、たった3つの比率で読み取れる地図にまとめた点が、設計で使いやすく面白いところです。", "unverified": "有限要素解析との比較結果などは未確認。"}}, {"id": "pr38", "rank": 38, "headline": "長さゲージ時間依存リウヴィル方程式の一般化", "title": "Generalized length-gauge time-dependent Liouville equation", "url": "https://doi.org/10.48550/arxiv.2610.22799", "authors": "G. P. Zhang ほか", "venue": "arXiv (Cornell University)", "date": "2026-10-16", "apa": "Zhang, G. P., & Si, M. S. (2026). Generalized length-gauge time-dependent Liouville equation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22799", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（OpenAlex登録）を使用", "preprint": true, "short": true, "p1": "超高速の電子ダイナミクスに使う長さゲージの時間依存リウヴィル方程式で、長年食い違っていた交換子の2つの形の正しい一般形を示した（抄録）。", "p3": "密度演算子と位置演算子の交換子について、Kohn–Luttingerの形（k微分2つ）とAversa–Sipeの形（微分1つとデルタ関数）を比較し、一般化した方程式を導いた（抄録）。", "p5": "一般化した方程式は微分を2つもち、デルタ関数をもたないことを示した。位置演算子のk非対角成分が、電場によって密度演算子のk非対角成分を生む経路になる（抄録）。", "fun": "同じ物理を表すはずの式に、数十年間2つの食い違う書き方が併存していたという話です。どちらが正しいかを詰めると、電場が電子の状態を思わぬ形で混ぜる経路が見えてくる点が面白いところです。", "unverified": "数値計算での違いの大きさは未確認。"}}, {"id": "pr39", "rank": 39, "headline": "バングラデシュのUber利用者の品質と満足", "title": "Service Quality and Customer Satisfaction with AI-Enabled App-Based Ride-Sharing: Evidence from Uber Users in Bangladesh", "url": "https://doi.org/10.21203/rs.3.rs-11431268/v1", "authors": "Mashrafi ahmed ほか", "venue": "Research Square (In Review)", "date": "2026-10-20", "apa": "ahmed, M., & Mannan, Prof. D. K. A. (2026). Service Quality and Customer Satisfaction with AI-Enabled App-Based Ride-Sharing: Evidence from Uber Users in Bangladesh. https://doi.org/10.21203/rs.3.rs-11431268/v1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "バングラデシュのUber利用者で、確実性・信頼性・応答性がサービス満足の最も強い予測因子であることを示した（抄録）。", "p3": "注意確認を通過した385件の5点リッカート尺度の横断調査を、階層回帰、多変量回帰、探索的なブートストラップ間接効果分析で分析した（抄録）。", "p5": "確実性・信頼性・応答性が満足の最も強い同時予測因子で、知覚された安全は小さいが有意な寄与をもった（抄録）。", "fun": "配車アプリの満足を決めるのは、値段よりも「約束どおり来るか」「安心して任せられるか」だった、という結果です。新しい技術のサービスでも、昔ながらのサービス品質の要素が効いている点が面白いところです。", "unverified": "係数の大きさや継続利用意図への効果は未確認。"}}, {"id": "pr40", "rank": 40, "headline": "ブランド嫌悪・過去の不満と否定的口コミ", "title": "An Examination on The Relationship Among Brand Hate, Negative Past Experience and Negative Word-of-Mouth: Empirical Evidences from The Cargo Sector", "url": "https://doi.org/10.5281/zenodo.23516874", "authors": "Burucuoğlu, Murat", "venue": "Zenodo", "date": "2026-10-20", "apa": "Burucuoğlu, M. (2021). An Examination on The Relationship Among Brand Hate, Negative Past Experience and Negative Word-of-Mouth: Empirical Evidences from The Cargo Sector. IJOPEC Publication. https://doi.org/10.5281/ZENODO.23516874", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録を使用", "preprint": true, "short": true, "p1": "貨物輸送サービスで、過去の否定的経験がブランド嫌悪を介して否定的な口コミにつながることを示した（抄録）。", "p3": "貨物輸送ブランドの顧客を便宜的抽出で調査し、有効な408件で構造方程式モデルにより仮説を検証した（抄録）。", "p5": "過去の否定的経験と否定的口コミ、否定的経験とブランド嫌悪、ブランド嫌悪と否定的口コミの間に正の有意な関係があった（抄録）。", "fun": "嫌な思いをした客は悪い評判を広めますが、その間に「このブランドが嫌い」という感情が挟まっているかを確かめた研究です。不満がただの不満で終わらず、嫌悪という強い感情に育つと口コミの力が増す、という見方が面白いところです。", "unverified": "媒介効果の大きさは抄録が途中で切れており未確認。"}}, {"id": "pr41", "rank": 41, "headline": "推薦アルゴリズムが消費者の信頼と購買を左右", "title": "Personalised by Algorithm: How AI-driven Recommendation Systems Shape Consumer Trust and Purchase Behaviour in Indian E-commerce", "url": "https://doi.org/10.2139/ssrn.7630521", "authors": "Sidra Siddiqui", "venue": "SSRN", "date": "2026-10-20", "apa": "Siddiqui, S. (2026). Personalised by Algorithm: How AI-driven Recommendation Systems Shape Consumer Trust and Purchase Behaviour in Indian E-commerce. https://doi.org/10.2139/ssrn.7630521", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "AIによる推薦・パーソナライズがインドの消費者の信頼と購買に与える影響を、既存研究から整理した（抄録）。", "p3": "近年の実証研究、業界調査、インドの新しいデータ保護制度を素材とする二次研究（抄録）。", "p5": "関連性の高い推薦は購買・再購買意図を高めるが、主に知覚された関連性・満足・信頼を介しており、経路については研究間で一致しない。インドの消費者はAIの提案を受け入れやすい一方で、データ漏洩や個人情報の悪用を心配している（抄録）。", "fun": "買い物サイトが「あなたへのおすすめ」を出すとき、それが効くのは単に便利だからではなく「この店は自分を分かってくれる」という信頼を通じてだ、という整理です。便利さと気味悪さが同居する点が面白いところです。", "unverified": "新しいデータを用いた実証ではない（抄録）。"}}, {"id": "pr42", "rank": 42, "headline": "孤独の概念を理論的に整理する", "title": "Theoretical View to The Concept of Loneliness", "url": "https://doi.org/10.5281/zenodo.23516949", "authors": "Köse ほか", "venue": "Zenodo", "date": "2026-10-20", "apa": "Köse, S., & Özmen, A. Ö. (2021). Theoretical View to The Concept of Loneliness. IJOPEC Publication. https://doi.org/10.5281/ZENODO.23516949", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録を使用", "preprint": true, "short": true, "p1": "現代社会の大きな社会的・心理的問題である孤独を、理論的な観点から整理した（抄録）。", "p3": "産業革命による社会秩序の変化と家族の解体、個人主義の高まり、競争的な労働条件といった孤独の背景を文献にもとづいて論じる（抄録）。", "p5": "孤独は社会学的・心理学的な帰結をもつ多次元・学際的な概念であり、孤独から離れることが個人の心理的well-beingと組織への統合に寄与すると述べる（抄録）。", "fun": "孤独は個人の気持ちの問題に見えますが、産業や家族の形、働き方の変化といった社会の仕組みから生まれる面もあります。身近な感情を社会の歴史の流れの中に置いて考える点が面白いところです。", "unverified": "会議論文で実証データは用いていない（抄録）。"}}, {"id": "pr43", "rank": 43, "headline": "包摂的インフラのジェンダー平等・社会包摂の論拠", "title": "Inclusive infrastructure under pressure: The business case for Gender Equality and Social Inclusion (GESI)", "url": "https://doi.org/10.5281/zenodo.22046389", "authors": "GESI Unit: Climate Compatible Growth", "venue": "Zenodo", "date": "2026-10-20", "apa": "GESI Unit: Climate Compatible Growth. (2026). Inclusive infrastructure under pressure: The business case for Gender Equality and Social Inclusion (GESI). Climate Compatible Growth (CCG). https://doi.org/10.5281/ZENODO.22046389", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録（報告書の概要）を使用", "preprint": true, "short": true, "p1": "インフラ開発にジェンダー平等・社会包摂（GESI）を組み込む「事業上の論拠」をどう示すかを検討するワークショップの報告（抄録）。", "p3": "2025年3月の第1回会合（政策担当者・実務家・研究者30人）を受けた第2回会合で、問題の把握から解決策の設計へ進めることを目指す（抄録）。", "p5": "抄録は会合の目的を述べるにとどまり、結論は書かれていない（未確認）。", "fun": "道路や電力などのインフラは、誰にとっても同じように役立つとは限りません。女性や弱い立場の人も恩恵を受けられるように作ることが、投資として見ても得だと示せるか、という問いが面白いところです。", "unverified": "会合で得られた具体的な提言は未確認。"}}, {"id": "pr44", "rank": 44, "headline": "スマートシティ革新エコシステムの2都市比較", "title": "A Case Study on Smart City Innovation Ecosystems: Florianópolis (Brazil) vs. Bangalore (India)", "url": "https://doi.org/10.2139/ssrn.7633998", "authors": "Dr. Shyam Shukla", "venue": "SSRN", "date": "2026-10-20", "apa": "Shukla, Dr. S. (2026). A Case Study on Smart City Innovation Ecosystems: Florianópolis (Brazil) vs. Bangalore (India). https://doi.org/10.2139/ssrn.7633998", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "フロリアノポリス（ブラジル）とバンガロール（インド）のスマートシティ革新エコシステムを、ライフサイクルモデルで比較した（抄録）。", "p3": "両都市が技術拠点から社会技術的なエコシステムへ移る過程を、ライフサイクルモデルの観点から事例比較した（抄録）。", "p5": "両都市とも「成長段階」に分類されたが、フロリアノポリスは自治体の統治の分断、バンガロールは過剰な都市開発と実施上の欠陥という異なる理由による（抄録）。", "fun": "どちらもスマートシティの上位に入る2都市が、同じ「成長途中」の段階にとどまっている理由は正反対でした。ボランティア中心と大企業・政府中心という対照的な二都市を比べることで、技術より統治のあり方が問われることが見えてくる点が面白いところです。", "unverified": "評価の具体的な指標は未確認。"}}, {"id": "pr45", "rank": 45, "headline": "グラフDEMATELで鉄道の価値ベース維持管理を優先付け", "title": "Graph-based DEMATEL extension framework to support value-based maintenance and Asset Management decisions prioritization for railways infrastructure managers", "url": "https://doi.org/10.2139/ssrn.7644116", "authors": "Irene Roda ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Roda, I., Polenghi, A., Zappa, S., Fochesato, D., & Kopsalidou, K. (2026). Graph-based DEMATEL extension framework to support value-based maintenance and Asset Management decisions prioritization for railways infrastructure managers. https://doi.org/10.2139/ssrn.7644116", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "鉄道インフラ管理者が価値ベースの維持管理・アセットマネジメントの判断を優先付けるための、グラフ型の意思決定支援の枠組みを提案した（抄録）。", "p3": "組織の価値要素間の因果的影響をDEMATELでモデル化し、その総影響行列を重み付き有向グラフとして解釈して、意思決定案の価値への影響を評価する（抄録）。", "p5": "抄録が途中で切れており、適用事例の結果は未確認。", "fun": "線路の補修を「どれから先にやるか」は、安全・費用・サービス・環境など、互いに影響し合う多くの価値の綱引きです。価値同士の影響関係をネットワーク図にして、優先順位に反映させようとした点が面白いところです。", "unverified": "事例での検証結果は未確認。"}}, {"id": "pr46", "rank": 46, "headline": "移動計測で都市交通回廊のPM2.5を転移予測", "title": "Transferable Mobile Sensing-Based PM2.5 Prediction along Urban-Transport Corridors using Low-Rank-Adapted Spatially-Attentive-Graph-Neural-Network Framework", "url": "https://doi.org/10.2139/ssrn.7644117", "authors": "Om Chiddarwar ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Chiddarwar, O., Mandal, P., Chandaliya, P. K., & Arkatkar, S. S. (2026). Transferable Mobile Sensing-Based PM2.5 Prediction along Urban-Transport Corridors using Low-Rank-Adapted Spatially-Attentive-Graph-Neural-Network Framework. https://doi.org/10.2139/ssrn.7644117", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "都市の幹線道路沿いの移動計測データで、交通由来PM2.5の高解像度予測モデルを作り、別の路線への転移を評価した（抄録）。", "p3": "PM2.5・気象・土地利用の移動計測データを作り、クラスター別GRU・グラフ注意ネットワーク・低ランク適応（LoRA）を組み合わせたSA-GNN-LoRAで予測した（抄録）。", "p5": "元の路線（Route A）ではR² = 0.95（RMSE 6.84 μg/m³、MAE 4.19 μg/m³）。別路線（Route B）では、少量データでの微調整によりR²が0.724に上がり、ゼロショットに比べMAEが57.8%、RMSEが49.7%減った（抄録）。", "fun": "同じ通勤路でも、渋滞する交差点のそばでは空気の汚れ方が急に変わります。ある道で学んだ予測モデルを、少しのデータで別の道に「引っ越し」させられるかを試した点が面白いところです。", "unverified": "予測の時間幅ごとの結果は未確認。"}}, {"id": "pr47", "rank": 47, "headline": "仕事は変えられるという手がかりと組織の士気喪失", "title": "Learning Whether Work Can Still Move: Repairability Cues, Hope, and Organizational Demoralization", "url": "https://doi.org/10.31234/osf.io/ubhst_v2", "authors": "Robin Umbra", "venue": "PsyArXiv", "date": "2026-10-20", "apa": "Umbra, R. (2026). Learning Whether Work Can Still Move: Repairability Cues, Hope, and Organizational Demoralization. https://doi.org/10.31234/osf.io/ubhst_v2", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "職場の望ましくない状態が「まだ動かせるか」を従業員が手がかりから学ぶ過程を、修復可能性の手がかりという概念で理論化した（抄録）。", "p3": "手がかり-評価の学習理論をもとに、繰り返し現れる組織の手がかりが、望ましくない仕事の状態について動き・停滞・変化可能性の増大・閉鎖のどれを意味するようになるかを説明する（抄録）。", "p5": "理論的な論文で、実証結果はない（抄録）。", "fun": "上司に意見を言っても毎回無視されると、人は「この職場は何をしても変わらない」と学んでしまいます。つらさそのものではなく「変わる見込みがあるか」の学習が士気を左右する、という見方が面白いところです。", "unverified": "命題の実証的な検証は行われていない（抄録）。"}}, {"id": "pr48", "rank": 48, "headline": "DEI施策と組織文化・従業員成果", "title": "Diversity, Equity, and Inclusion Practices and Their Influence on Organizational Culture and Employee Performance", "url": "https://doi.org/10.2139/ssrn.7637818", "authors": "Hardik Shah", "venue": "SSRN", "date": "2026-10-20", "apa": "Shah, H. (2026). Diversity, Equity, and Inclusion Practices and Their Influence on Organizational Culture and Employee Performance. https://doi.org/10.2139/ssrn.7637818", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "DEI（多様性・公平性・包摂）施策と組織文化・従業員成果の関係を、理論と実証研究から整理した叙述的レビュー（抄録）。", "p3": "職場の包摂、組織文化、多様性マネジメントの理論と、メタ分析・実証研究、企業のDEIへの反発に関する近年の研究を統合した（抄録）。", "p5": "包摂的リーダーシップと心理的安全性は、人員構成の多様さだけよりも、発言・エンゲージメント・革新と直接結び付いていた。単純な事業上の論拠を支持する証拠は限られる（抄録）。", "fun": "いろいろな人を雇うだけでは成果に直結せず、その人たちが安心して意見を言える雰囲気があって初めて効果が出る、という整理です。「数をそろえる」より「声を出せる場を作る」ことの大切さを示す点が面白いところです。", "unverified": "叙述的レビューで系統的な選定基準は未確認。"}}, {"id": "pr49", "rank": 49, "headline": "高等教育での教員と生成AIの共同主体性", "title": "Beyond AI Adoption: Teacher-AI Entanglement and Co-Agency in Higher Education", "url": "https://doi.org/10.2139/ssrn.7644057", "authors": "David Sulistiawan Aditya ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Aditya, D. S., Herczegh, J., & Febrianto, D. (2026). Beyond AI Adoption: Teacher-AI Entanglement and Co-Agency in Higher Education. https://doi.org/10.2139/ssrn.7644057", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "教員の考えと生成AIの貢献の境目が曖昧になる「教員-AIのもつれ」を定義し、それが授業と学習成果に影響するかを検証した（抄録）。", "p3": "バラッドの行為的実在論にもとづき、AI方針・基盤・文化・研修という制度的装置が教員-AIのもつれと授業でのAIとの共同主体性を予測し、それらが学生の学習成果の認知を予測する構造モデルをPLSで検証した（抄録）。", "p5": "抄録が途中で切れており、推定結果は未確認。", "fun": "AIの導入研究は「使うかどうか」を測るものが多いのですが、使い込むうちに「どこまでが自分の考えか分からなくなる」状態こそが重要だ、という問いの立て方が面白いところです。", "unverified": "標本の規模と推定結果は未確認。"}}, {"id": "pr50", "rank": 50, "headline": "労働時間短縮の因果的証拠と制度設計", "title": "Working-Time Reduction: Causal Evidence, Distributional Incidence, and Institutional Design", "url": "https://doi.org/10.2139/ssrn.7630859", "authors": "Ricardo Alonzo Fernandez Salguero", "venue": "SSRN", "date": "2026-10-20", "apa": "Fernandez Salguero, R. A. (2026). Working-Time Reduction: Causal Evidence, Distributional Incidence, and Institutional Design. https://doi.org/10.2139/ssrn.7630859", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "週労働時間の短縮政策について、因果的証拠・分配上の帰着・制度設計を整理した構造化された批判的統合（抄録）。", "p3": "35の研究・制度資料と40の数値記録を証拠の性質で区別し、準実験的な改革の推定、実験的な職場介入、観察研究、対照のない組織の試行を明示的に分けて評価した（抄録）。", "p5": "最も一般化できる知見は非常な長時間労働の害に関するものだと述べる（抄録の途中まで）。", "fun": "週4日勤務はよく話題になりますが、「法律上の上限」と「実際の労働時間」、「給料を保つか減らすか」などで効果は大きく変わります。証拠の強さごとに仕分けて、どこまで本当に分かっているかを見極めようとする点が面白いところです。", "unverified": "抄録の後半が切れており、他の結論は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "組織行動・心理的安全性", "headline": "大規模チームは科学を発展させ小規模は破壊する", "title": "Large Teams Consistently Develop Science", "url": "https://arxiv.org/abs/2610.27649", "authors": "Yiling Lin ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Lin, Y., Yang, L., & Wu, L. (2026). Large Teams Consistently Develop Science (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27649", "why": "チーム規模と科学の破壊性をめぐる論争に対し、代替指標の欠陥を数学的分析と大規模データで示した再反論。", "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（全文：ノーベル賞論文の事例、数理解析、大規模データ分析、結論と図1〜3）を読んだ", "preprint": true, "p1": "「大きなチームは科学を発展させ、小さなチームは破壊する」という先行研究の結論に対し、反対の結論を出した代替指標oneDが発展的な貢献を破壊的と誤分類すること、参考文献数を揃えても大きなチームほど強く発展的な研究を生むことを示した再反論（抄録、結論）。未査読のプレプリントである。", "p2": "破壊性指数D（disruption index）は、後続論文がその論文だけを引用するか参考文献も一緒に引用するかで、論文が既存知識を置き換える（破壊）か固める（発展）かを測る。最近の研究はDが参考文献リストの長さに機械的に依存すると批判し、参考文献を無作為に選んで対ごとの得点を平均するoneDで「大きなチームの方が破壊的」と主張した（抄録）。", "p3": "対ごとの破壊性 d_r = (N − 2a_r)/(N + b_r)（式1）は、負になるには a_r > N/2 が必要で、引用数が焦点論文の半分未満の参考文献は負になれない（式2）。参考文献の引用数は偏ったZipf型に従うので（式3）、引用の少ない長い裾の参考文献は d_r が+1近くに押し上げられ、均等に平均するoneDは参考文献が多いほど+1に近づく（式4〜6）。例：ノーベル賞のDavisら（1995）はD = −0.55（発展的）だがoneDは+0.61（破壊的）になる（図1）。", "p4": "ノーベル賞論文511本と無作為な5万本で指標の分布とノーベル賞論文の識別（ROCのAUC）を比べ（図2）、OpenAlexの1900〜2015年の学術誌論文9,394,828本で、チーム規模を固定して参考文献数との関係、参考文献数を固定してDの下位5%に入る割合を調べた（図3）。", "p5": "Dで負の値をとるノーベル賞論文107本のうち106本がoneDでは正になった。AUCはoneD 0.97、D 0.78だが、Dの絶対値をとるだけで0.89に上がり、oneDの優位の一部は符号を捨てたことによる（図2）。同じチーム規模ではoneDは参考文献数とともに系統的に増えたが、Dには一貫した傾向はなかった。参考文献数を揃えても、複数著者のチームは単独著者よりDの下位5%（強く発展的）に入りやすく、10人以上で顕著だった（図3）。", "p6": "著者自身による限界の節はない。解釈：本論文は元の結論を出した著者らによる再反論であり、代替指標側の再応答は今後ありうる。発展と破壊のどちらが重要かは指標の外の判断で、著者は両方が大きな進歩になりうると述べる（結論）。", "fun": "ノーベル賞級の発見には、古い常識をひっくり返すものと、先行研究を大きく固めて広げるものの2種類があります。引用の少ない文献が多いほど「破壊的」と判定されやすくなる数学的なクセを、簡単な不等式で見抜いた点が面白いところです。物差しの作り方ひとつで、科学の見え方が正反対になるのです。", "unverified": "批判対象の論文（Huang and Xie, 2026）の原文は確認していない。"}}, {"id": "pn02", "rank": 2, "field": "機械学習（Hugging Face）", "headline": "LLMエージェントは実務のOR案件をこなせるか", "title": "OR-License: Evaluating LLM Agents as Real-World Operations Research Practitioners", "url": "https://arxiv.org/abs/2610.24087", "authors": "Peisong Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-20", "apa": "Wang, P., Liu, F., Meng, Y., Liu, B., Chen, R., Dai, G., He, X., Li, A., Yuan, F., Chen, A., Zi, C., Li, Y., Zeng, H., Yan, Y., Chen, N., Fu, J., Shen, Z.-J. M., KUO, Y.-H., & Li, J. (2026). OR-License: Evaluating LLM Agents as Real-World Operations Research Practitioners (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.24087", "why": "有償コンサル案件をもとにした業務資料から最適化解を作る、実務に近いベンチマークを提示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（ベンチマーク構築§3、評価§4.1・4.3、結論§5）を読んだ。付録は未読", "preprint": true, "p1": "実際に有償で受注されたオペレーションズ・リサーチ（OR）案件の元資料から、LLMエージェントが専門家並みの最適化解を納品できるかを測るベンチマークOR-Licenseを作り、品質では専門家を上回る場合もあるが、実行可能な納品の確実さで専門家に届かないことを示した（抄録、§4.1）。未査読のプレプリントである。", "p2": "既存のORベンチマークは、問題が自己完結的に記述されたり最適化問題として定式化済みだったりして、顧客の業務資料を専門家が検証した解に翻訳する部分を測れていない（抄録、§1）。", "p3": "総額368万ドルの受注案件から10の産業シナリオ・31事例を、3年以上の実務経験をもつ専門家が匿名化して作った（§3.2）。顧客役のシミュレータORSimは業務上の事実だけを1問につき最大3件まで開示し、OR の専門知識は与えない（§3.3）。核の指標DAQ（展開調整品質）は、実行不可能な納品を0点とし、可能な納品は専門家解との目的関数の比で採点して平均する（式3：DAQ = 実行可能率 × 条件付き品質）。", "p4": "コーディング・エージェントの枠組みで最先端のLLM 11種を評価し、隠れた検証器で全テストケースの制約充足（厳格な実行可能性）を判定し、顧客に受け入れられた元の専門家解（DAQ = 1）と比べた（§3.4、§4）。軌跡を注釈して失敗の型も分類した（§3.5）。", "p5": "実行可能率はHy3の45.16%からGrok 4.6の88.39%まで43.23ポイント開いたが、条件付き品質は96.92〜101.01%の4.09ポイントの差にとどまった。最高のDAQはGrok 4.6の86.55%で、専門家との差13.45ポイントのうち11.61ポイントは実行不可能な納品による（§4.1、表1）。失敗の多くは実装ではなく、制約や目的・状態遷移の定式化の誤りだった（§4.3、図5）。", "p6": "事例は31件と少なく、評価はシミュレータ経由の顧客応答に依存する（§3、解釈）。著者は、研究の連鎖を完遂する割合が24〜45%にとどまることなどから、情報の欠落を継続的に埋めること、忠実な定式化、証拠にもとづく自己改善が必要だと結論する（抄録、§5）。", "fun": "AIに実際の企業の物流や生産計画の仕事を任せると、解けたときの答えの良さは専門家並みかそれ以上でした。ところが「そもそも規則を守った答えを毎回きちんと出せるか」で差がつき、差の約86%はそこから来ていました。仕事の評価は満点の回数より「落とさない確実さ」で決まる、という点が面白いところです。", "unverified": "抄録では最強構成をClaude Codeの構成と記すが、本文表1ではGrok 4.6が最高と記載されており、両者の対応（枠組みとモデルの組合せ）は付録で確認していない。"}}, {"id": "pn03", "rank": 3, "field": "機械学習（Hugging Face）", "headline": "少数パラメータの微調整で脳活動予測を大規模化", "title": "Scaling Parameter-Efficient Fine-Tuning for Brain Encoding", "url": "https://arxiv.org/abs/2610.26802", "authors": "Zhuofan Josh Ying ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-20", "apa": "Ying, Z. J., Sun, G., Ho, N., Liu, K., Yang, R., Chen, A., Kriegeskorte, N., Ma, P., & Adeli, H. (2026). Scaling Parameter-Efficient Fine-Tuning for Brain Encoding (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.26802", "why": "高価で少ない神経データでも巨大な事前学習モデルを効率よく適応できることを示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（定式化§3、手法§4、実験§5.1〜5.2、考察と限界§6）を読んだ。付録は未読", "preprint": true, "p1": "脳の反応（fMRI）を刺激から予測する脳エンコーディングで、巨大な事前学習モデルを少数パラメータの低ランク適応（LoRA）で微調整する方法BrainLoRAにより、Algonauts 2025チャレンジで公表最高の成績を出した（抄録、§5.2）。未査読のプレプリントである。", "p2": "標準的な手法は、事前学習モデル（バックボーン）を固定して読み出し層だけを学習する。神経データは高価で少ないため、大きなモデルをゼロから学習したり全体を微調整したりするのは難しかった（抄録、§3）。", "p3": "バックボーンの重みθ₀に低次元の変化Δ(ψ)だけを加えて神経データで学習する（式2、k ≪ d）。計算の工夫として、因果マスクをもつバックボーンでは149秒の窓を1回の順伝播で全時点の特徴に変換でき、従来のスライド窓（1クリップ2,800回）に比べ特徴抽出の費用を約350分の1（A800で約700→2 GPU時間）にした（§4）。主手法ではQwen3-Omniにランク16のLoRAを入れ、学習パラメータは891万個（§4）。", "p4": "『フレンズ』7シーズンを視聴した被験者の全脳fMRI（1,000領域）で、4人で学習し、シーズン6で検証、シーズン7（ID）と別の映画（OOD）で評価した。指標は被験者平均のPearson相関で、比較対象は従来最高のMIRAGE（固定バックボーン＋11億パラメータの読み出し）と全体微調整（§4、§5）。", "p5": "47億〜1,040億パラメータの9つのバックボーンすべてで、LoRAは線形読み出しの相関を0.032〜0.066改善した（§5.1、図3）。LoRA＋線形はMIRAGEの約5%の学習パラメータで上回り、BrainLoRAは単一モデルでID 0.327、OOD 0.228、200超のモデルのアンサンブルでID 0.343、OOD 0.248に達した（§5.2、表1）。全体微調整は330倍のパラメータでもLoRAを上回らなかった（§5.2）。", "p6": "著者は、学習が1つのベンチマークの4人の被験者、すべて視聴覚の物語映像に限られ、別の被験者・別のデータセットへの転移も物語映画の範囲を出ないことを限界に挙げる（§6）。脳の基盤モデルには至っていないとも明記する（§6）。", "fun": "ドラマを見ている人の脳の反応を予測するのに、1千億を超える部品をもつAIのごく一部（数百万個）だけを調整すれば十分でした。むしろ全部を調整するより良いこともある、という結果は「少ないデータでは手を加えすぎない方がよい」という学びの原則を思い出させてくれます。", "unverified": "モダリティ寄与の解析（§5.4）とアンサンブルの詳細（§5.5）は読んでいない。"}}, {"id": "pn04", "rank": 4, "field": "統計学", "headline": "ネットワーク干渉下の再ランダム化と高次元調整", "title": "Rerandomization and high-dimensional adjustment with assignment-dependent auxiliary variables under network interference", "url": "https://arxiv.org/abs/2610.27741", "authors": "Honghao Zhang ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Zhang, H., Wei, Y., & Liu, H. (2026). Rerandomization and high-dimensional adjustment with assignment-dependent auxiliary variables under network interference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27741", "why": "割付に依存する補助変数を使って、干渉のあるネットワーク実験の推定精度を高める理論を与えた。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（再ランダム化の設計§3.1、シミュレーション§6、応用§7、考察§8）を読んだ。§3.2〜§5の証明は読んでいない", "preprint": true, "p1": "干渉（ある人の処置が隣人の結果にも影響すること）のあるネットワーク実験で、割付に依存する補助変数を使った再ランダム化と共変量調整、高次元の場合のLasso調整を提案し、直接効果と波及効果の推定精度を高められることを示した（抄録、§6〜7）。未査読のプレプリントである。", "p2": "ワクチン試験やSNSの実験では干渉があり、「処置された隣人の割合」のような予測に役立つ補助変数は割付自体に依存する。古典的な再ランダム化は処置群と対照群の共変量の差を0に近づけるが、割付依存の変数では設計上0でない差（露出効果）が生じるため、0に近づけると構造の一部を壊してしまう（§3.1）。", "p3": "補助変数の効果の推定値と、設計から分かる目標値の差（推定誤差）のマハラノビス距離 M = (τ̂_G − τ_G)ᵀCov(τ̂_G)⁻¹(τ̂_G − τ_G) が閾値a以下の割付だけを採用する（§3.1）。解析段階では同じ推定誤差に直接働く線形調整を使い、閾値a→0で再ランダム化と調整が漸近的に等価になることを示した（抄録）。補助変数が多いときは行ごとのLassoで調整する（§5）。", "p4": "753ノードのランダム幾何ネットワークで、補助変数の次元1,806（標本数を超える）のシミュレーションを1,000回行い、偏り・標準偏差・RMSE・信頼区間長・被覆率を、無調整のHT・Hájek推定量と既存の調整法（Gao and Ding、Luら）と比べた（§6）。応用は米国ニュージャージー州の中学校の対立抑止介入の実験（196人）と、それにもとづく半合成実験（§7）。", "p5": "シミュレーションでは、無調整Hájekに対し低次元調整は直接・波及効果の標準偏差を13.0%・11.9%、Lassoは51.7%・42.8%減らし、再ランダム化＋LassoがRMSEと区間長で最良だった。被覆率はおおむね名目水準に近かった（§6、表1）。半合成実験では再ランダム化＋Lassoが標準偏差を11.0%・10.7%減らした（§7、表3）。", "p6": "著者は、まれな露出条件では露出ベースの逆確率重み付けが非効率なこと、厳密なスパース性が破れるとLassoの罰則による偏りで推論が無効になりうるため偏り除去が必要なこと、独立なベルヌーイ割付以外（層別・クラスター）への理論の拡張が今後の課題だと述べる（§8）。", "fun": "友だちが薬を飲んだかどうかで自分の結果も変わる世界では、「処置した人としなかった人の条件を揃える」という実験の基本が、そのままでは使えません。ずれが「偶然のずれ」か「設計上当然のずれ」かを見分けて、偶然の分だけを揃える、という発想の転換が面白いところです。", "unverified": "漸近分布の定理の具体的な条件（§3.2、§5.2）と応用の表2の全数値は確認していない。"}}, {"id": "pn0
