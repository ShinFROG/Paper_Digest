<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-10-31", "intro": "前回以降の新着から選びました。プレプリントの新着263件、学術誌の新着455件（うち上位10%誌300件）、重要論文の候補250件（プレプリント123件・学術誌127件）、オープンデータの候補122件から選びました。プレプリント・関連22報、プレプリント・注目30報、論文誌・関連44報、論文誌・注目39報、オープンデータ18件です。arXivの新着一覧が取得できなかったため、arXivの論文はHugging Faceなど別の経路で得たものに限られ、プレプリントの両部は件数を減らしました。論文誌・注目は注目分野の候補の多くが材料科学・化学だったため39報にとどめました。上位10%誌の一覧の更新は取得できず、9月27日の一覧を使いました。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "橋梁点検の測定誤差が補助金配分を歪める", "title": "Measurement Error and the Design of Funding Rules: Evidence from Bridge Inspections", "url": "https://doi.org/10.2139/ssrn.7667958", "authors": "Xiting Zhuang", "venue": "SSRN", "date": "2026-10-30", "apa": "Zhuang, X. (2026). Measurement Error and the Design of Funding Rules: Evidence from Bridge Inspections. https://doi.org/10.2139/ssrn.7667958", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "橋梁点検の評点に含まれる測定誤差が、米国の橋梁補助金（Bridge Formula Program）の配分と支出制限をどれだけ誤らせているかを定量化し、誤りを減らす制度設計を示した（抄録）。", "p2": "連邦の資金配分は行政上の測定値をそのまま金額に変えるが、点検員の評点には誤差があり、閾値の近くでは誤った配分や制限が生じうる。その大きさはこれまで測られていなかった（抄録）。", "p3": "2つの州が別々に評点した同じ橋（州境の橋など）を使い、評点の測定誤差を識別した。さらに、誤配分が支払額の変化の大きさ、変化点付近の受給者の密度、誤差の大きさに比例するという枠組みを作った（抄録）。解釈：同一対象の二重測定から誤差を識別する考え方である。", "p4": "年53億ドルを州に配分し支出制限を課す制度を対象に、2回目の点検をした場合の再配分額と、誤って課された制限の割合を評価指標とした（抄録）。", "p5": "2回目の点検で年2億3,300万ドルが再配分され、誤って課された制限は制限された支出の10.5%に当たった。閾値を中程度に滑らかにすると誤配分は増え、対象を絞った再点検は全数の再点検に比べて橋1本あたり6倍の誤配分を除いた（抄録）。", "p6": "抄録の範囲では、二重評点の橋が全体を代表するか、誤差が橋の種類や状態でどう違うかは未確認。未査読のプレプリントである。", "fun": "橋の点検員がつける点数は、補助金の配分を決める「お金の物差し」として使われています。ところが同じ橋を2つの州が点検すると点数が違うことがあり、この研究はその食い違いから物差しの誤差を測りました。全部をもう一度点検するより、点数が境目に近い橋だけを点検し直すほうが6倍効率的だという結論が面白い点です。", "unverified": "二重評点の橋の数と、推定の頑健性の検討は抄録からは未確認。"}}, {"id": "pr02", "rank": 2, "headline": "正規化フローとVAEでSHMのベイズ逆解析", "title": "Neural Markov chain Monte Carlo for structural health monitoring: Bayesian inversion via normalizing flows and variational autoencoders", "url": "https://doi.org/10.5281/zenodo.23806965", "authors": "Bottaccini ほか", "venue": "Zenodo", "date": "2026-10-30", "apa": "Bottaccini, G., Torzoni, M., & Manzoni, A. (2026). Neural Markov chain Monte Carlo for structural health monitoring: Bayesian inversion via normalizing flows and variational autoencoders. Zenodo. https://doi.org/10.5281/ZENODO.23806965", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "ZenodoのPDF本文（手法・2つの事例・結論の節と表）を読んだ", "preprint": true, "p1": "高次元の振動応答から構造の損傷パラメータを、尤度を陽に書けなくても何度も素早くベイズ推定できる「ニューラルMCMC」を示した（抄録、§4）。", "p2": "SHMの逆問題は観測が高次元で、尤度が計算できないか利用できず、しかも繰り返し解く必要がある。毎回順解析を回すMCMCは重すぎる（§1）。", "p3": "入力は加速度などの時系列、出力は損傷の位置と大きさの事後分布。教師ありVAE（潜在空間に予測の枝を付けた変分オートエンコーダ）で観測を不確実性つきの低次元特徴に圧縮し、その特徴の尤度を損傷パラメータで条件づけた正規化フロー（RealNVP）で近似して、差分進化メトロポリス法で事後分布を標本化する（§2、図1〜3）。直観：重い順解析の代わりに「潜在特徴がこの損傷でどれくらいありそうか」を学習済みのフローが即座に答える。", "p4": "合成データによる2事例、L字形片持ち梁とHörnefors鉄道橋で、損傷クラスの分類正解率と損傷の大きさの平均絶対誤差、事後標準偏差で評価した（§3、表2〜4）。", "p5": "L字梁では損傷クラスの平均正解率が事後平均で91%、MAPで90%、損傷の大きさの平均絶対誤差は許容範囲0.8に対して約0.055だった。雑音を強めた条件（SNR = 10）でも正解率は85%と84%、誤差は0.059と0.057だった（§3.1、表3）。鉄道橋でも精度よく推定できたと報告する（§3.2、§4）。", "p6": "どちらの事例も合成の観測で、実測データでの検証はない。著者は時間依存の設定、適応的学習、デジタルツインへの統合を今後の課題とする（§4）。未査読のプレプリントである。", "fun": "橋の揺れのデータから「どこがどれくらい傷んでいるか」を、確率の幅つきで推定するのがこの研究です。普通はシミュレーションを何万回も回す必要がありますが、ここでは揺れのデータを小さな特徴に縮めて、その特徴が出てくる確率をAIに覚えさせました。雑音を強くしても正解率が85%程度を保った点が面白いです。", "unverified": "鉄道橋の事例の具体的な数値（正解率・誤差）は読み切れず未確認。計算時間の短縮の程度も未確認。"}}, {"id": "pr03", "rank": 3, "headline": "AIによる橋梁SHMの方法論（博士論文）", "title": "Artificial Intelligence-based methodology for Structural Health Monitoring. Application to bridges.", "url": "https://theses.hal.science/tel-05845662v1", "authors": "Douaa Benhaddouche", "venue": "HAL", "date": "2026-10-30", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "HALの本文は取得できず、Crossrefに登録された抄録（仏語）を使用", "preprint": true, "p1": "橋梁の振動応答から、教師なし深層学習で損傷を頑健に検出し構造全体の健全性を評価する一連の方法をまとめた博士論文である（抄録）。", "p2": "ひび割れ・疲労・腐食の検出に目視点検は経済的・実務的に不十分で、振動ベースの機械学習にも学習の枠組み、特徴抽出での情報の損失、雑音と運用条件の変動の下での小さな損傷の検出精度の低下という課題がある（抄録）。", "p3": "第1の方法は深層オートエンコーダ（DAE）と離散フーリエ変換を組み合わせ、再構成誤差をマハラノビス距離に統合して全体の健全性指標を作る。第2の方法はグラフ畳み込みとLSTMの混成モデル（GCN-LSTM）で加速度の時空間特徴を捉え、予測誤差の分布をカルバック・ライブラー情報量で評価する（抄録）。", "p4": "未確認（抄録が途中で切れており、検証に使った橋と評価指標は読めなかった）。", "p5": "未確認（抄録・本文を入手できず）。", "p6": "抄録の範囲では、実橋での検証の有無と、温度など環境変動の扱いは未確認。博士論文であり、査読付き論文としての公表状況は未確認。", "fun": "橋が健康なときの揺れ方だけをAIに覚えさせ、覚えた揺れ方からずれたら「どこかおかしい」と判断するのがこの論文の基本の考え方です。壊れた橋のデータはほとんど手に入らないので、健康なデータだけで学ぶ教師なし学習が役に立ちます。センサ同士のつながりをグラフとして扱う工夫も面白い点です。", "unverified": "検証の対象と結果の数値は未確認。抄録の後半は読めていない。"}}, {"id": "pr04", "rank": 4, "headline": "表面粗さを解像する個別要素法をNNで高速化", "title": "A neural accelerated roughness-resolved Discrete Element Method (Rough-DEM) for modeling granular systems", "url": "https://arxiv.org/abs/2610.33363", "authors": "Xiwei Pan ほか", "venue": "arXiv (Cornell University)", "date": "2026-10-23", "apa": "Pan, X., & Li, L. (2026). A neural accelerated surface-roughness-based Discrete Element Method (SR-DEM) for modeling granular systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33363", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版HTMLの本文（手法の節、2体・多体の検証、結論の節）を読んだ", "preprint": true, "p1": "粒子表面の凹凸を明示的に解像し、摩擦則を仮定せずに摩擦のような振る舞いを凹凸同士の摩擦なしの接触から生じさせる個別要素法（Rough-DEM）を、ニューラルネット代理モデルで計算可能にした（抄録、§5）。", "p2": "従来のDEMはアモントン・クーロン型の現象論的な摩擦則に頼り、接線剛性や摩擦係数を経験的に決める必要がある。粒子のかみ合いを表すために摩擦係数を1以上の不自然な値にすることもある（§1、§5）。", "p3": "各粒子を粗い形状と表面の凹凸の2尺度で表し（§2.1、図1）、階層的な接触探索で凹凸の接触点を求める（図2、図3）。正弦波の凹凸では振幅hと波長λが、接線剛性と摩擦係数に代わる物理的に解釈できるパラメータになる（§5）。計算負荷はFE2型の接触計算とFiLMに基づく符号付き距離関数の代理ネットワークをGPUで並列化して下げる（抄録、§5）。直観：摩擦を「法則」として与えるのではなく、表面のでこぼこが引っかかる幾何として計算する。", "p4": "4粒子系の重力落下で従来DEMと軌跡・速度を比べ（図4、図5）、2体と多体のシミュレーション、フーリエ級数で表した任意の凹凸による柱崩壊の安息角で、有効な巨視的摩擦係数への対応を確かめた（§5）。", "p5": "4粒子系で従来DEMと軌跡・速度がよく一致した（図5）。単純な正弦波の凹凸でも接線方向の大きな抵抗が法線接触だけから生じ、摩擦係数を大きくせずに強い幾何学的かみ合いを表せた。任意の凹凸の設計も安息角を通じて有効摩擦係数に写せた（§5）。", "p6": "検証は2次元に限られる（抄録）。凹凸を解像する計算負荷は依然大きい（§5）。3次元への拡張と実際の粒状材料との定量的な比較は今後の課題と読める（解釈）。未査読のプレプリントである。", "fun": "砂の粒どうしの摩擦は、ふつう「押す力×摩擦係数」という法則で計算します。この研究はその法則を使わず、粒の表面の小さなでこぼこを形として描き、でこぼこが引っかかることで摩擦が自然に生まれるようにしました。法則を与える代わりに形から法則を生み出す、という発想の転換が面白い点です。", "unverified": "GPU並列化と代理モデルによる高速化の倍率は読み切れず未確認。"}}, {"id": "pr05", "rank": 5, "headline": "衛星の生態系指標で農業企業の財務困窮を予測", "title": "Predicting Financial Distress in UK Agricultural Firms Using Satellite-Derived Ecosystem-Condition Indicators: An Exploratory Machine Learning Study", "url": "https://doi.org/10.2139/ssrn.7672759", "authors": "Cristiano Saldanha", "venue": "SSRN", "date": "2026-10-30", "apa": "Saldanha, C. (2026). Predicting Financial Distress in UK Agricultural Firms Using Satellite-Derived Ecosystem-Condition Indicators: An Exploratory Machine Learning Study. https://doi.org/10.2139/ssrn.7672759", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "衛星から得た生態系の状態指標が、英国の農業企業の財務困窮の判別に財務データ以上の情報を加えるかを探索的に検証した（抄録）。", "p2": "農業企業の信用評価は年次の決算書に頼るが、決算書は過去を向いており提出も遅れる。農業の産出は生態系の状態に直接依存するため、衛星指標が補えるのではないかという問い（抄録）。", "p3": "英国の単一拠点の農業企業17社・169企業年（2015〜2024年）について、FAMEの財務諸表と、Google Earth Engineで農場単位に抽出したSentinel-2の植生・土壌・水の指数（NDVI、NDWI、BSI、RECI）を結合した。困窮は非上場企業向けのアルトマンZ′スコアでラベルづけし、ランダムフォレストとXGBoostを5分割層化交差検証で比べた（抄録）。", "p4": "財務のみのモデルと、衛星指標を加えたモデルのAUC-ROCとF1スコアを、同時点・1年遅れ・2年遅れで比べた（抄録）。", "p5": "財務のみのXGBoostはAUC-ROC 0.941だった。衛星指標を加えるとF1が同時点で1.8ポイント、1年遅れで3.5ポイント（相対で約4%）上がったが、2年遅れでは改善せず、AUC-ROCも改善しなかった。SHAPでは夏のNDVIの傾向が最も重要（平均|SHAP| 1.075）で、総資産（0.927）を上回った（抄録）。", "p6": "著者自身が、標本が小さいこと、改善が分割間のばらつきより小さいこと、ラベルが同じ決算書から作られること、交差検証が企業でグループ化されていないこと、衛星の傾向指標が全期間の情報を使っていることを挙げ、時間外の早期警戒信号は示せていないとする（抄録）。未査読のプレプリントである。", "fun": "農場の会社がお金に困るかどうかを、決算書だけでなく宇宙から見た畑の緑の濃さで予測できるか、という研究です。緑の変化は予測に効いているように見えますが、著者自身が「会社の見分けに使われているだけかもしれない」と限界を丁寧に書いている点も、データ分析の注意点として面白いところです。", "unverified": "なし"}}, {"id": "pr06", "rank": 6, "headline": "職場の緑とワークエンゲージメントの追試", "title": "Workplace Greenery and Work Engagement Among Live-In Shiftworkers: A Conceptual Replication of Popov et al. (2023)", "url": "https://doi.org/10.31234/osf.io/b9uhq_v1", "authors": "Caroline Isabelle Ekeberg ほか", "venue": "PsyArXiv", "date": "2026-10-30", "apa": "Ekeberg, C. I., Kloster, K., & Isager, P. M. (2026). Workplace Greenery and Work Engagement Among Live-In Shiftworkers: A Conceptual Replication of Popov et al. (2023). https://doi.org/10.31234/osf.io/b9uhq_v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "PsyArXiv（OSF）のPDF本文（抄録・方法・結果の冒頭・考察の限界の節）を読んだ", "preprint": true, "p1": "職場の緑とワークエンゲージメントの関連を示したPopov et al.（2023）研究2を、ノルウェーの住み込み交代勤務者と秋という新しい文脈で概念的に追試し、屋外の自然へのアクセスの効果が再現された（抄録）。", "p2": "職場の緑の効果の研究は特定の職種・季節に偏っており、効果が別の職業と季節にも及ぶかは確かめられていなかった（抄録、Introduction）。", "p3": "知的障害・自閉スペクトラム症の成人の支援付き住居で働く住み込み交代勤務者94人（女性55.3%）に2024年秋にオンライン調査を行い、ユトレヒト・ワークエンゲージメント尺度と、窓からの自然の眺め、屋外の自然へのアクセス（休憩中と利用者の付き添い中）、室内の植物の3つの緑を測った。仕事の要求度と自然の美の評価を統制した共分散分析で比べた（抄録、Methods）。背景：仕事の要求度-資源モデルでは、緑は仕事の資源の一つとみなせる。", "p4": "元研究の結果のパターン（どの種類の緑がエンゲージメントと関連するか）が再現されるかを基準とした（抄録）。", "p5": "エンゲージメントの平均は高く（M = 5.28、SD = 1.21）、男女差はなかった（Results）。休憩中と付き添い中の屋外の自然へのアクセスは有意に高いエンゲージメントと関連したが、窓の眺めと室内の植物は信頼できる効果を示さず、性別による調整も一貫しなかった（抄録）。", "p6": "著者は、横断的な自己報告の設計のため因果的な解釈ができず、回答の偏りの影響もありうること、窓の眺めの効果を検出する力が限られることを認め、実験・縦断の設計を求める（Discussion、p.1434–1450付近）。標本94人は小さい（解釈）。未査読のプレプリントである。", "fun": "職場に観葉植物を置くより、休憩中に外の自然の中を歩けることのほうが、仕事への熱意と結びついていたという結果です。それも、利用者と一緒に過ごす住み込みの仕事という、休みと仕事の境目があいまいな職場で確かめられました。他人の研究を別の場所でやり直す「追試」の大切さを示す例でもあります。", "unverified": "共分散分析の効果量の具体的な数値は読み切れず未確認。"}}, {"id": "pr07", "rank": 7, "headline": "「弱い紐帯の強さ」は貧困層でも成り立つか", "title": "The Weakness of Weak Ties Revisited: Social Capital under Constraint", "url": "https://doi.org/10.31235/osf.io/jz9nk_v2", "authors": "Floris Noordhoff", "venue": "SocArXiv", "date": "2026-10-30", "apa": "Noordhoff, F. (2026). The Weakness of Weak Ties Revisited: Social Capital under Constraint. https://doi.org/10.31235/osf.io/jz9nk_v2", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "SocArXiv（OSF）のPDF本文（抄録・方法・限界の記述）を読んだ", "preprint": true, "p1": "グラノヴェッターの「弱い紐帯の強さ」が長期的な貧困の下ではなぜ働きにくいのかを、オランダの低所得層の面接から3つの仕組みとして示した（抄録）。", "p2": "弱く橋渡し的なつながりは新しい機会をもたらすとされるが、貧困の文脈ではそうしたつながりが役に立たないことが多い。その社会的な過程は十分に説明されていなかった（抄録）。", "p3": "1997〜1999年にアムステルダム北部、ロッテルダムのデルフスハーフェン、アムステルダム南東部で集めた216件の回答者記録（繰り返しの訪問や配偶者同席を含む）を、弱い紐帯がいつどのように支援や機会を与え、何がその利益を制限したかという問いで再分析した（Methods）。背景：社会関係資本は、つながりを通じて得られる資源をいう。", "p4": "質的な研究で、つながりが提供した支援とその使われ方の条件を、強い紐帯との比較も含めて追跡できるかを重視した（Methods、Traceability and limitations）。", "p5": "第1に名誉と地位のジレンマから、人々は体面と互酬の規範を優先してつながりを物質的な利得に使うことを避けた。第2に互酬の期待と時間のずれで、果たされない義務が信頼を損ないつながりがしぼんだ。第3にリスクの評価とつながりの費用から、不確実性と過去の悪い経験が新しい遠いつながりを警戒させた（抄録）。", "p6": "著者は、この分析が頻度、理論的飽和、ネットワークの完全な構造、強い紐帯と弱い紐帯の因果的な順位、貧困からの持続的な脱出を示すものではないと述べる（Traceability and limitations）。データが1990年代末のものである点も現在への一般化を限る（解釈）。未査読のプレプリントである。", "fun": "「ちょっとした知り合い」が新しい仕事の情報を運んでくれる、という有名な理論があります。ところが貧しい地域では、知り合いに頼ることが恥ずかしかったり、お返しができないと関係が気まずくなったりして、そのつながりが使われにくいのです。つながりがあることと使えることは違う、という点が面白いです。", "unverified": "3つの仕組みそれぞれの事例数などの量的な情報は未確認。"}}, {"id": "pr08", "rank": 8, "headline": "予想信用損失モデルに潜む見えない判断", "title": "Invisible Judgment in Model-Based Accounting: Expected Credit Losses, Model Risk and Governance", "url": "https://doi.org/10.2139/ssrn.7665504", "authors": "Adriano Lima e Silva", "venue": "SSRN", "date": "2026-10-30", "apa": "Lima e Silva, A. (2026). Invisible Judgment in Model-Based Accounting: Expected Credit Losses, Model Risk and Governance. https://doi.org/10.2139/ssrn.7665504", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "モデルに基づく会計見積もりで、重要な専門的判断が見積もりの過程に埋め込まれ、外部の利用者が再構成できなくなる性質を「見えない判断（Invisible Judgment）」として概念化した（抄録）。", "p2": "会計基準は判断をなくすのではなく別の場所に移すことがある。会計方針が変わらなくても、区分、予測、平均への回帰、モデルの変更、経営者による調整で報告額が大きく変わりうるが、その過程は外から見えにくい（抄録）。", "p3": "会計方針の可視性と見積もりの構造の可視性を区別し、経営者の裁量、見積もりの不確実性、モデルリスク、開示の質、監査上の主要な検討事項（CAM）などの既存の概念・道具と位置づけを比べた。米国の予想信用損失会計（CECL、ASC Topic 326）を主な舞台とし、IFRS第9号と構造を比較した（抄録）。", "p4": "同じ引当金額と同程度の開示量を持つ2つの銀行で、外部の人が判断を報告額までたどれる程度が異なることを仮想例で示し、比較可能性、ガバナンス、的を絞った開示、マクロ経済のストレス、モデルの高度さに関わる5つの検証可能な命題を示した（抄録）。", "p5": "開示に基づく可視性の尺度を作り、既存の尺度に対して検証する方法の道筋を示した（抄録）。実証の結果はない。", "p6": "著者自身が、概念的な論文であり、見えない判断を測定も因果効果の確立もしていないと述べる（抄録）。未査読のプレプリントである。", "fun": "銀行が「将来どれくらい貸したお金が返ってこないか」を見積もるとき、複雑な計算モデルの中にたくさんの判断が隠れています。2つの銀行が同じ金額を報告していても、その数字に至った判断の道筋を外からたどれるかどうかは違う、という指摘です。数字の正しさだけでなく、数字の「透明さ」を問う点が面白いです。", "unverified": "なし"}}, {"id": "pr09", "rank": 9, "headline": "同系列のLLM同士はコーディングで一致しやすい", "title": "All in the Family? Lineage, Size, and Agreement in LLM Content Coding", "url": "https://doi.org/10.5281/zenodo.23823154", "authors": "Singleton, Craig", "venue": "Zenodo", "date": "2026-10-30", "apa": "Singleton, C. (2026). All in the Family? Lineage, Size, and Agreement in LLM Content Coding. Zenodo. https://doi.org/10.5281/ZENODO.23823154", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "ZenodoのPDF本文（抄録・データと設計・信頼性の結果・限界・結論の節）を読んだ", "preprint": true, "p1": "LLMを「独立した」内容コーダーとして使うとき、同じベンダーのモデル同士は異なるベンダーより一致しやすく、独立な追試とみなせないことを、再テストを基準に示した（抄録、§8）。", "p2": "研究でLLMを複数のコーダーとして使う例が増えているが、モデルの系統や大きさが一致度にどう影響するか、同じモデルの再テストでどれだけ揺れるかはほとんど報告されていない（§1、§2）。", "p3": "凍結した65の機関文書と91コードの評定票を、6ベンダーの16モデルにコーディングさせ、15モデルで再テストした。各モデルの自分自身との一致を基準とし、ペアの一致を2つの再テストの一致の幾何平均で割った比を記述的に求め、文書単位のブートストラップで区間を付けた（抄録、§3）。直観：自分自身とさえ完全には一致しないので、その揺れを差し引いてモデル間の近さを見る。", "p4": "再テストの一致、同ベンダー・異ベンダーのペアの一致、プロンプトの保存の有無、API経由とツール経由の違い、出力の指示順守を比べた（抄録、§4、§5）。", "p5": "再テストの一致は.90〜.71だった。生の一致は同ベンダーで平均.783、異ベンダーで.694、再テストで割った比は同ベンダー.926（95%区間.911–.940）、異ベンダー.842（.822–.860）だった。プロンプトを保存しなかった初期のHaikuの実行は後の2回と約.59しか一致せず、後の2回同士は.826だった。指示の順守はモデルの階層と単調に対応しなかった（抄録）。", "p6": "著者は、この比が検証された減衰補正ではないこと、測ったのは一致であって正確さではないこと、系統・経路・記録の不完全な設定が部分的に交絡していること、系統の因果的な仕組みは示せないことを認める（抄録、§7）。未査読のプレプリントである。", "fun": "AIに文章の分類を何台分も頼めば、人間の評定者を何人も集めたのと同じになる、と考えたくなります。でも同じ会社のAI同士は「兄弟」のように考え方が似ていて、意見が合いやすいのです。さらに同じAIに2回頼んでも答えが少し変わります。AIを独立な判定者として数える前に確かめるべきことを示した点が面白いです。", "unverified": "なし"}}, {"id": "pr10", "rank": 10, "headline": "未知加振下の地下鉄振動を不確実性考慮で制御", "title": "Uncertainty-Aware Adaptive Control of Metro-Induced Environmental Vibration Under Unknown Excitation", "url": "https://doi.org/10.20944/preprints202610.2989.v1", "authors": "Yingwei Kou ほか", "venue": "Preprints.org", "date": "2026-10-30", "apa": "Kou, Y., Ding, Y., & Tang, H. (2026). Uncertainty-Aware Adaptive Control of Metro-Induced Environmental Vibration Under Unknown Excitation. https://doi.org/10.20944/preprints202610.2989.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Europe PMCに登録された抄録を使用", "preprint": true, "p1": "地下鉄による環境振動を受ける建物で、構造モデルの不確実性と未知の非定常な加振の下でも、同定と能動制御を組み合わせて振動を抑える方法を示した（抄録）。", "p2": "地下鉄の振動は近くの振動に敏感な建物の使用性と長期の耐久性を損なうが、構造モデルが不確かで加振源も未知かつ非定常なため、振動制御は難しい（抄録）。", "p3": "時間変化する構造パラメータを状態ベクトルに加え、未知入力つきの一般化拡張カルマンフィルタで状態・パラメータ・基礎の加振を同時に同定する。加振の復元は事後共分散に基づく適応的な重みで雑音の増幅を抑え、同定した状態をLQG（線形二次ガウス）制御にフィードバックし、パラメータは事後の確からしさに比例してゲインの設計に入れる。雑音の共分散と制御の重み行列は2段階のサルプ群探索で決める（抄録）。", "p4": "未知の地下鉄加振、モデルの不一致、測定雑音を与えた9階建てのフレーム構造で有効性を確かめた（抄録）。", "p5": "未確認（抄録には定量的な結果がない）。", "p6": "抄録の範囲では数値の検証のみで、実建物での検証は未確認。最適化に群知能を使うことの計算負荷と再現性も未確認。未査読のプレプリントである。", "fun": "建物を揺らす地下鉄の振動は、どこからどれくらいの力で来ているのか直接は測れません。この研究は、揺れを測りながら「建物の性質」と「入ってくる力」を同時に推定し、その推定の自信の度合いに応じて制御の強さを変えています。分からないことを分からないまま上手に扱う工夫が面白い点です。", "unverified": "制御による振動低減の大きさは未確認。"}}, {"id": "pr11", "rank": 11, "headline": "液状化を考慮した一体橋台橋の杭への地震動影響", "title": "Effects of Near-Fault and Far-Fault Ground Motions on Pile Sections of Integral Abutment Bridges Considering Soil Liquefaction", "url": "https://doi.org/10.21203/rs.3.rs-11367032/v1", "authors": "Abdul Hakim Hotak ほか", "venue": "Research Square (In Review)", "date": "2026-10-30", "apa": "Hotak, A. H., Zhao, Q., & Nasiry, M. K. (2026). Effects of Near-Fault and Far-Fault Ground Motions on Pile Sections of Integral Abutment Bridges Considering Soil Liquefaction. https://doi.org/10.21203/rs.3.rs-11367032/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社サイトのPDF本文は取得できたが、読めたのは抄録の範囲で、本文の数値は照合していない", "preprint": true, "p1": "液状化地盤に支えられた一体橋台橋（IAB）の杭について、近断層と遠断層の地震動で杭の種類ごとの応答がどう違うかを数値解析で示した（抄録）。", "p2": "一体橋台橋は伸縮継手のないフレーム状の構造で、柔らかい杭で支えることが勧められるが、液状化が杭の地震応答に与える影響は十分に調べられていなかった（抄録）。", "p3": "OpenSeesでPyLiq1材料モデルとゼロ長要素を使って杭周りの液状化を表し、遠心模型実験で数値結果を裏づけたうえで、杭の断面の種類を変えたパラメトリック解析を近断層・遠断層の地震動で行った（抄録）。", "p4": "鉄筋コンクリート（RCC）杭、鋼杭、コンクリート充填鋼管（CFST）杭の応答を地震動の種類ごとに比べた（抄録）。", "p5": "RCC杭は近断層の地震動で、鋼杭は遠断層の地震動で応答が大きく、CFST杭は柔軟さによって優れた耐震性を示した。液状化地盤ではCFST杭の使用、H形鋼杭を使う場合は高応力部の補強を勧める（抄録）。", "p6": "抄録の範囲では、使った地震動の数と地盤条件の幅、応答の差の大きさは未確認。未査読のプレプリントである。", "fun": "継ぎ目のない橋は維持管理が楽ですが、地震で地盤が液状化すると、橋を支える杭に大きな力がかかります。この研究は、断層の近くの鋭い揺れと遠くからのゆっくりした揺れで、どんな素材の杭が強いかが入れ替わることを示しました。揺れの種類で「強い杭」が変わる点が面白いです。", "unverified": "応答の差の数値と、遠心模型実験との一致の程度は未確認。"}}, {"id": "pr12", "rank": 12, "headline": "英国燃料価格の非対称な伝達とレジーム転換", "title": "Regime-Dependent Asymmetric Price Transmission in UK Road Fuel Markets: Evidence from an Endogenous Structural Break", "url": "https://doi.org/10.33774/coe-2026-r5tqf", "authors": "Ivi Theodoulou", "venue": "Cambridge Open Engage", "date": "2026-10-30", "apa": "Theodoulou, I. (2026). Regime-Dependent Asymmetric Price Transmission in UK Road Fuel Markets: Evidence from an Endogenous Structural Break. https://doi.org/10.33774/coe-2026-r5tqf", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイトのPDF本文は取得できたが、抄録の範囲で書いた", "preprint": true, "p1": "英国の卸売と小売のガソリン価格の伝達の非対称性が時期によって向きを変えることを、データから内生的に求めた構造変化点で示した（抄録）。", "p2": "燃料価格の非対称な伝達（ロケットと羽根：上がるのは速く下がるのは遅い）は広く調べられているが、その関係が時間を通じて安定かは検討が少なかった（抄録）。", "p3": "2000〜2021年の月次のスーパー・プレミアム無鉛ガソリンの価格に、Karavias（2021）の未知の構造変化の検定を当てはめて変化点を求め、その前後で2段階の非線形自己回帰分布ラグ（NARDL）モデルを推定した。NARDLは卸売価格の上昇と下落を別々の変数として扱い、短期・長期の非対称な転嫁を推定できる（抄録）。", "p4": "変化点の前後で、卸売価格の上昇と下落のどちらが小売価格に強く伝わるかを比べた（抄録）。", "p5": "2010年11月に統計的に有意な構造変化が見つかった。2010年より前は卸売価格の下落のほうが強く伝わる負の非対称、後は上昇のほうが強く伝わる正の非対称で、非対称の向きは変わったが全体の大きさは変わらなかった（抄録）。", "p6": "2015年・2017年など他の変化点も存在すると著者は述べる（抄録）。2010年の変化の原因は特定されておらず、制度・経済の変化との一致にとどまる（解釈）。未査読のプレプリントである。", "fun": "ガソリンの値段は「上がるのは早いのに下がるのは遅い」とよく言われます。この研究は英国で、2010年を境にその傾向が逆転していたことを見つけました。同じ市場でも時期によってルールが変わるので、全期間をまとめて分析すると見落としが生じる、という点が面白いです。", "unverified": "短期・長期それぞれの係数の数値は未確認。"}}, {"id": "pr13", "rank": 13, "headline": "人員削減が回復とAI導入を難しくする仕組み", "title": "Crossing the Crisis&nbsp;Cost Reduction, Capability Rebuilding, and AI Adoption", "url": "https://doi.org/10.2139/ssrn.7668918", "authors": "Shahriar Shahir Barzegar", "venue": "SSRN", "date": "2026-10-31", "apa": "Shahir Barzegar, S. (2026). Crossing the Crisis&nbsp;Cost Reduction, Capability Rebuilding, and AI Adoption. https://doi.org/10.2139/ssrn.7668918", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "危機の企業が現金を守るために人員を削ると、立て直しに必要な専門人材まで失い、かえって回復までの総資金需要が増える条件を解析モデルで示した（抄録）。", "p2": "人員削減は月々の支出を減らすが、削られた人が事業の再建に必要な人でもある場合、その影響はこれまで定式化されていなかった（抄録）。", "p3": "回復までの時間が、残した専門人材の能力に依存する部分と、外部条件が整うまでの時間に分かれる解析モデルを作り、資金需要が残す人数に対して単調でない条件を導いた。AIの将来の運用上の利益と、導入時の作業負担を分ける拡張も行った（抄録）。", "p4": "閉形式の解で最小の資金需要と支払える残留人数の範囲を示し、明示的に仮想の数値例で例示した（抄録）。", "p5": "条件つきの残留の閾値より下では、さらに削ると月々の支出は減るが回復までの総資金は増え、閾値より上では人を残しても回復は進まない。AIの拡張では、最終的に魅力的な利益を持つプロジェクトでも、危機の間はより大きな人間の中核を残す必要がありうることを示した（抄録）。", "p6": "数値例は仮想で、実データでの検証はない。安い外部の再建能力があると人員の結果が逆転し、利益が徐々に現れると閾値が変わることを著者自身が示している（抄録）。未査読のプレプリントである。", "fun": "会社が苦しいとき、人を減らせば毎月の出費は減ります。でも減らしたのが「会社を立て直せる人」だったら、回復までの時間が延びて、結局は多くのお金が必要になるかもしれません。さらにAIを導入するにも、それを使いこなす人を残す必要があるという指摘が、今の時代らしくて面白い点です。", "unverified": "なし"}}, {"id": "pr14", "rank": 14, "headline": "能動的推論で動く多エージェントのデジタルツイン", "title": "Multi-Agent Digital Twins for Strategic Decision-Making using Active Inference", "url": "https://doi.org/10.5281/zenodo.23804080", "authors": "Mancinelli ほか", "venue": "Zenodo", "date": "2026-10-30", "apa": "Mancinelli, F. M., Torzoni, M., Maisto, D., Donnarumma, F., Corigliano, A., Pezzulo, G., & Manzoni, A. (2026). Multi-Agent Digital Twins for Strategic Decision-Making using Active Inference. Zenodo. https://doi.org/10.5281/ZENODO.23804080", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "ZenodoのPDF本文は取得できたが、抄録の範囲で書いた", "preprint": true, "p1": "能動的推論（Active Inference）を、共有の環境の中で分散した生成モデルを持つ複数のエージェントが相互作用する多エージェントのデジタルツインへ拡張した（抄録）。", "p2": "能動的推論は不確実性の下での意思決定に原理的な説明を与え、探索と活用のトレードオフにも対処できるが、デジタルツインへの応用は単一エージェントにとどまっていた（抄録）。", "p3": "動的な環境への適応性を高める文脈推論と、エージェントの生成モデルにストリーミング機械学習を組み込むことで、効率を保ちながら目標志向の振る舞いを調整できる枠組みにした（抄録）。背景：能動的推論は、予測と観測のずれ（自由エネルギー）を小さくするように行動と信念を更新する考え方である。", "p4": "社会経済システムのデジタルツインの例として、クールノー競争（企業が生産量で競う寡占モデル）で枠組みを示した（抄録）。", "p5": "多エージェントの文脈での協調的な意思決定への可能性を示した（抄録）。定量的な結果は抄録にない。", "p6": "例示は単純な寡占モデルに限られ、実際のシステムでの検証は未確認。未査読のプレプリントである。", "fun": "脳は「予想と違った」という驚きを減らすように考え、行動しているという理論があります。この研究はその理論を、市場で競い合う複数の会社のAIに当てはめ、それぞれが自分の頭の中の予想を持ちながら相手と関わる仮想の経済をつくっています。脳の理論で市場を動かすという組み合わせが面白い点です。", "unverified": "クールノー競争の例での具体的な結果は未確認。"}}, {"id": "pr15", "rank": 15, "headline": "辞書とLLMの併用で顧客の複雑な感情を解析", "title": "Hybrid Lexicon-LLM Arbitration for Nuanced Sentiment and Dual-Affect Parsing in Customer Experience Analytics", "url": "https://doi.org/10.5281/zenodo.23795956", "authors": "Shankar, Spoorti", "venue": "Zenodo", "date": "2026-10-30", "apa": "Shankar, S. (2026). Hybrid Lexicon-LLM Arbitration for Nuanced Sentiment and Dual-Affect Parsing in Customer Experience Analytics. Zenodo. https://doi.org/10.5281/ZENODO.23795956", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "ZenodoのPDF本文は取得できたが、抄録の範囲で書いた", "preprint": true, "p1": "顧客の声の感情を正・負・中立の1つに縮めず、皮肉や絵文字、相反する感情の同居まで読み取るために、辞書型の感情解析とLLMを仲裁で組み合わせた仕組みSentimentDetectorを示した（抄録）。", "p2": "企業の顧客体験（CX）の分析の多くは感情を1つの値に縮めるため、皮肉、絵文字の連続、製品への期待と価格への不安のような同時に起こる相反する感情を捉えられない（抄録）。", "p3": "拡張したVADERとカナダ国立研究評議会（NRC）の感情辞書という規則ベースの辞書エンジンと、Claude Sonnet 4.5による高推論のLLMの窓口を組み合わせ、運用モードの選択器が文章を振り分け、辞書とモデルの食い違いを裁定し、主・副の複数の感情ラベルと理由を出力する（抄録）。", "p4": "4種類の言語的に難しい層にわたる単盲検の人間による検証（N = 30、240の評価対）で、評定者間の一致と5段階の整合度で評価した（抄録）。", "p5": "極性でκ = 0.74、二重感情でκ = 0.69の実質的な一致、5段階で平均4.41 ± 0.68の整合度を示し、辞書のみより仲裁型が優れたと報告した（抄録）。", "p6": "人間の検証は30人・240対と小さく、比較対象の手法と統計的な差の検定は抄録の範囲で未確認。中規模のB2B SaaS向けの製品的な記述でもある（解釈）。未査読のプレプリントである。", "fun": "「新商品はすごく楽しみ、でも値段がちょっと怖い」のように、1つのコメントに正反対の気持ちが同時に入っていることはよくあります。この研究は、昔ながらの感情の辞書とAIに同じ文を読ませ、意見が割れたときにどちらを信じるかを決める仕組みを作りました。2つの方法の得意不得意を組み合わせる点が面白いです。", "unverified": "辞書のみの手法との比較の数値は未確認。"}}, {"id": "pr16", "rank": 16, "headline": "MEMS加速度計そのものを計算資源に使う", "title": "A biaxial resonant MEMS accelerometer used as physical reservoir computing system with true acceleration input", "url": "https://doi.org/10.5281/zenodo.23807753", "authors": "Galli ほか", "venue": "Zenodo", "date": "2026-10-30", "apa": "Galli, A., Mondello Malvestiti, G., Frigerio, P., Langfelder, G., & Corigliano, A. (2026). A biaxial resonant MEMS accelerometer used as physical reservoir computing system with true acceleration input. Zenodo. https://doi.org/10.5281/ZENODO.23807753", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録を使用", "preprint": true, "short": true, "p1": "周波数変調型のMEMS加速度計そのものを、物理リザバー計算（物理系の動きを計算資源に使う方式）の素子として使い、実際の加速度入力で動かした（抄録）。", "p3": "素子の電気機械パラメータを測り、雑音・寄生容量・温度による共振周波数のずれを含む挙動モデルを作り、専用の基板で全体を実装した（抄録）。", "p5": "回転台で与えた±1 gの加速度入力でパリティ課題を解き、2次でMSE 0.11、3次以降でMSE 0.27などの結果を得た（抄録）。", "fun": "スマホにも入っている加速度センサは、ふつうは揺れを「測るだけ」の部品です。この研究はセンサ内部の小さな振動子の動きそのものに、過去の入力の記憶と非線形な計算をさせています。測ることと計算することを同じ部品で行えるかもしれない、という発想の転換が面白い点です。", "unverified": "抄録が途中で切れており、3次以降のパリティの結果の内訳は未確認。"}}, {"id": "pr17", "rank": 17, "headline": "機械的デュフィング振動子で物理リザバー計算", "title": "From Vibrations to Computation: Numerical and Experimental Investigation of a Mechanical Duffing Oscillator for Physical Reservoir Computing", "url": "https://doi.org/10.5281/zenodo.23807533", "authors": "Mondello Malvestiti ほか", "venue": "Zenodo", "date": "2026-10-30", "apa": "Mondello Malvestiti, G., Galli, A., Messina, I., Torzoni, M., & Corigliano, A. (2026). From Vibrations to Computation: Numerical and Experimental Investigation of a Mechanical Duffing Oscillator for Physical Reservoir Computing. Zenodo. https://doi.org/10.5281/ZENODO.23807533", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録を使用", "preprint": true, "short": true, "p1": "両端固定のアルミ梁の幾何学的非線形（デュフィング振動子）を、物理リザバー計算の計算資源として使えることを実験で示した（抄録）。", "p3": "梁を適切な条件で加振し、パリティ計算とMNIST手書き数字認識の2つのベンチマークで計算能力を評価した（抄録）。", "p5": "外部フィードバックなしでも、系の非線形性だけで現在と過去の入力の相関が保たれ、記憶の仕組みが運転条件と直接結びつくことを示した（抄録）。", "fun": "1本の金属の梁を揺らすだけで、手書き数字の認識に使える計算ができるという研究です。梁が大きく揺れると「ばね」が硬くなる非線形性が、過去の入力を少し覚えておく働きをします。物理の振動と計算の記憶が同じ現象として説明できる点が面白いです。", "unverified": "認識精度などの具体的な数値は抄録から確認できず未確認。"}}, {"id": "pr18", "rank": 18, "headline": "合成データを学習に使ってよいか少量の実データで判定", "title": "Should I Use This Synthetic Dataset for Training? How to Test with Minimal Real Data", "url": "https://doi.org/10.5281/zenodo.23800972", "authors": "Tao ほか", "venue": "Zenodo", "date": "2026-10-30", "apa": "Tao, Z., Xu, W., You, X., Popovski, P., & Simeone, O. (2026). Should I Use This Synthetic Dataset for Training? How to Test with Minimal Real Data. Zenodo. https://doi.org/10.5281/ZENODO.23800972", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録を使用", "preprint": true, "short": true, "p1": "デジタルツインなどで作った合成データを学習に加えると本当に性能が上がるかを、できるだけ少ない実データで判定する検定を示した（抄録）。", "p3": "2つの学習済みモデルの平均損失差を直接検定する方法と、対になった損失差の対称性を使う方法を考え、後者にモンテカルロの回数と実データの量の両方を適応的に決めるe過程の符号反転検定（aeSFT）を導入した（抄録）。", "p5": "抄録の範囲では検定の構成が中心で、実験での必要データ数などの数値は抄録の切れた部分にあり未確認。", "fun": "シミュレーションで作ったデータは安く大量に作れますが、現実とのずれがあると、混ぜたせいでかえって性能が落ちることがあります。この研究は「混ぜてよいか」を、現実のデータを少しずつ使いながら途中で判定する方法を考えています。データを使い切らずに結論を出す、という統計の工夫が面白い点です。", "unverified": "実験の結果と必要な実データ数は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "LLMが書いた研究上の主張を決定的に監査する", "title": "Deterministic Audit of LLM-Generated Research Claims", "url": "https://doi.org/10.5281/zenodo.23817684", "authors": "Borovikov, Vladimir V.", "venue": "Zenodo", "date": "2026-10-30", "apa": "Borovikov, V. V. (2026). Deterministic Audit of LLM-Generated Research Claims (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.23817684", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録を使用", "preprint": true, "short": true, "p1": "LLMが書いた研究の文章の「もっともらしい言い過ぎ」を機械的に検出する監査手順を示し、自分たちの研究に適用した（抄録）。", "p3": "事前登録の凍結、文脈の記憶ではなく外部記録の参照、生成役と監査役の分離、報告された数値の決定的な照合、主張の誤りの3段階の分類、複数モデルによる敵対的な査読の6要件からなる手順を作った（抄録）。", "p5": "10の実験系列・1,416件のプローブに適用し、12項目のチェックリストのうち6項目が合格、1項目が修正、1項目が不合格、2項目が部分的、2項目が人の判断を要すると報告した（抄録）。", "fun": "AIが書く文章で怖いのは、まったくの嘘よりも「数字は合っているのに解釈が大げさ」な文です。この研究は、その種の言い過ぎを人の勘ではなく手続きで見つける方法を作り、自分たちの研究にも当てはめて不合格の項目まで正直に報告しています。", "unverified": "監査の対象とした10個のp値と21個の比率の具体的内容は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "条件付き生成モデルでボーリング観測から亀裂網を再構成", "title": "A Three-Tier Evidence Hierarchy with Conditioned Generative Models for Discrete Fracture Network Reconstruction from Borehole Scanline Observations", "url": "https://doi.org/10.5281/zenodo.23795631", "authors": "Paudyal ほか", "venue": "Zenodo", "date": "2026-10-30", "apa": "Paudyal, E., Tang, Y., Lamei Ramandi, H., Zhai, H., Yang, S.-Q., & Si, G. (2026). A Three-Tier Evidence Hierarchy with Conditioned Generative Models for Discrete Fracture Network Reconstruction from Borehole Scanline Observations. Zenodo. https://doi.org/10.5281/ZENODO.23795631", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録を使用", "preprint": true, "short": true, "p1": "ボーリングの走査線のまばらな観測から、2次元の岩盤の亀裂網（離散亀裂ネットワーク）を、観測の確からしさに応じた3段階で再構成する枠組みを示した（抄録）。", "p3": "実測の亀裂は第1段階として残し、示唆される亀裂は改良型VAEによる長さ予測で延長し、観測のない領域の亀裂は系列型トランスフォーマーで生成し、7つの地質学的な制約を課す多目的の評価で選ぶ（抄録）。", "p5": "露天掘り鉱山の完全に図化された9つのベンチ面で検証した（抄録）。性能の数値は抄録の切れた部分にあり未確認。", "fun": "岩盤の中の割れ目は、穴を掘って見える一部分しか観測できません。この研究は「確実に見えた割れ目」「たぶん続いている割れ目」「見えないけれど推定する割れ目」を分けて扱い、生成AIで足りない部分を描きます。分からない部分の確からしさを区別して描くという考え方が面白いです。", "unverified": "検証での再現精度などの数値は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "基盤の地震動の与え方がマイクロゾーニングを変える", "title": "Influence of Bedrock Seismic Action Modelling on Microzonation", "url": "https://doi.org/10.20944/preprints202610.2967.v1", "authors": "Piero Colajanni ほか", "venue": "Preprints.org", "date": "2026-10-30", "apa": "Colajanni, P., Cucchiara, C., Granata, M. F., & Sberna, A. P. (2026). Influence of Bedrock Seismic Action Modelling on Microzonation. https://doi.org/10.20944/preprints202610.2967.v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録を使用", "preprint": true, "short": true, "p1": "地震マイクロゾーニング（地域の揺れやすさの区分）の結果が、基盤に与える入力地震動の作り方でどれだけ変わるかを調べた（抄録）。", "p3": "目標の応答スペクトルと近隣の観測記録から完全非定常の人工地震動を作り、1次元の等価線形の地盤応答解析で、従来の自然記録の選択による結果と比べた（抄録）。", "p5": "抄録の範囲では比較の設計が示され、結果の数値は抄録の切れた部分にあり未確認。", "fun": "同じ地盤でも、地下深くの「基盤」にどんな揺れを入れて計算するかで、地表の揺れやすさの地図が変わることがあります。この研究は、スペクトル（揺れの周波数の成分）が同じでも時間の中での揺れ方が違う地震動を比べています。答えが入力の選び方に左右されるという問題そのものが面白い点です。", "unverified": "入力の違いによる地表応答の差の大きさは未確認。"}}, {"id": "pr22", "rank": 22, "headline": "信頼性制約つきベイズ・デジタルツインで保全判断", "title": "Reliability-Constrained Bayesian Digital Twin for Sustainable Life-Cycle Decision-Making in Liquid-Hydrogen Storage", "url": "https://doi.org/10.2139/ssrn.7669238", "authors": "Kenneth Bisgaard Christensen", "venue": "SSRN", "date": "2026-10-31", "apa": "Bisgaard Christensen, K. (2026). Reliability-Constrained Bayesian Digital Twin for Sustainable Life-Cycle Decision-Making in Liquid-Hydrogen Storage. https://doi.org/10.2139/ssrn.7669238", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用", "preprint": true, "short": true, "p1": "液体水素の貯蔵容器について、劣化と不確実性を含むベイズ型のデジタルツインで、信頼性の制約の下で保全とライフサイクルの判断を行う枠組みを示した（抄録）。", "p3": "熱・疲労・破壊の確率的な劣化モデルに、点検による逐次更新、時間依存の信頼性解析、残存寿命の予測、ライフサイクルの持続可能性評価を組み合わせ、代表的な真空断熱容器で合成の観測を使って示した（抄録）。", "p5": "基準の応答では熱劣化が支配的で、系の超過確率は20年目まで0、25年目に0.391、30年目までに1.000となった（抄録）。", "fun": "決まった間隔で点検するのではなく、点検で分かった状態をそのつど計算に取り込んで「いつ手を入れるべきか」を決めるのがこの研究の考え方です。液体水素はとても冷たく扱いが難しいので、壊れる確率を年ごとに見積もることが安全と環境負荷の両方に関わります。", "unverified": "合成の観測による例示であり、実機での検証は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "内在的な分布合わせで少ステップ画像生成", "title": "Intrinsic Distribution Matching", "url": "https://arxiv.org/abs/2610.39633", "authors": "Deyuan Liu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-30", "apa": "Liu, D., Han, Y., Zheng, K., Xie, J., Liu, J., Cheng, Z., Sun, P., Zhang, J., Li, J., & Lin, T. (2026). Intrinsic Distribution Matching (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.39633", "why": "1〜数ステップの文生成画像モデルを、分布を内側から合わせる新しい蒸留の考え方で学習する。Hugging Faceで最多の票を集めた。", "explain": {"basis": "抄録", "basis_note": "arXiv版HTMLの本文は取得できたが、抄録の範囲で書いた", "preprint": true, "p1": "1〜数ステップで画像を生成する蒸留で、分布合わせの補正に特徴の平均と標準偏差を明示的に合わせる制約を加え、長文の文字の描画を改善する方法IDMを示した（抄録）。", "p2": "少ステップの文生成画像モデルは修正の機会が少ないのに、プロンプトの細部まで正確に描く必要がある。分布合わせ蒸留（DMD）は学習したスコアの差で生成分布を参照分布に近づけるが、明示的なモーメントの制約が役立つかは分かっていなかった（抄録）。", "p3": "逆KLの場を、ガウス的なモーメントの成分と非ガウスの残差に分解し、明示的に制約できる統計量を特定した。IDMはDMDの補正を全部残したまま、生成器の指数移動平均（EMA）のコピーを使って特徴の平均と座標ごとの標準偏差を合わせ、外部の特徴エンコーダを必要としない（抄録）。背景：EMAコピーは学習中の重みをゆっくり平均したモデルで、安定した基準として使われる。", "p4": "Z-Image-Turbo 6BとQwen-Image 20Bで全パラメータ調整とLoRA調整を行い、中国語・英語のLongText-Bench（長い文字列の描画）などで比べた（抄録）。", "p5": "2回のネットワーク評価で、LongText-Benchの中国語94.25%、英語90.20%を達成し、同じ計算量の比較手法で最高だった。制御した除去実験でモーメントの損失を加えた効果が示された（抄録）。", "p6": "抄録の範囲では、画質・多様性の指標とのトレードオフは未確認。未査読のプレプリントである。", "fun": "画像を作るAIは、ふつう何十回も少しずつ絵を直して仕上げます。それを1〜2回で済ませる「早描き」のAIを作るとき、この研究は、絵の特徴の平均やばらつきといった簡単な統計を手本に合わせる制約を足しました。単純な統計を合わせるだけで、看板の長い文字まで正確に描けるようになった点が面白いです。", "unverified": "画質や多様性の評価の数値は未確認。"}}, {"id": "pn02", "rank": 2, "field": "機械学習", "headline": "JEPAで「プラトン的表現仮説」を証明し改良", "title": "Proving and Improving the Platonic Representation Hypothesis with JEPAs", "url": "https://arxiv.org/abs/2610.39302", "authors": "Randall Balestriero ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-30", "apa": "Balestriero, R., & LeCun, Y. (2026). Proving and Improving the Platonic Representation Hypothesis with JEPAs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.39302", "why": "異なるモデルの表現が同じ表現に収束するという仮説を、JEPAの枠組みで理論的に示し、学習の改善につなげる。", "explain": {"basis": "抄録", "basis_note": "arXiv版HTMLの本文は取得できたが、抄録の範囲で書いた", "preprint": true, "p1": "異なるモダリティで学習したモデルが同じ表現に収束するという「プラトン的表現仮説」を、JEPAについての定理として証明し、表現をそろえるための具体的な処方を示した（抄録）。", "p2": "仮説は規模を大きくすれば表現が収束すると予想するが、証明がないため保証にも処方にもならなかった（抄録）。", "p3": "結合埋め込み予測アーキテクチャ（JEPA）を各モダリティで別々に学習したとき、正例の対が1つの場面の2つの観測（良い視点）であれば、学習される表現は1つの回転を除いて同じになり、そうでなければずれが有界になることを証明した。次トークン予測は1つの文書の部分同士という「悪い視点」のJEPAであり、言語モデルが規模によってしか視覚と揃わない理由を説明する（抄録）。", "p4": "14万5千のキャプションから9億4千万のウェブ画像のテキストまでで理論を検証し、整合の度合いをDINOv2とCLIPの画像エンコーダとの一致で測った（抄録）。", "p5": "整合のスケーリング則を見つけ、未実施の実行をシードの雑音の範囲で予測した。良い視点は同じコーパスの次トークン予測より42分の1の学習サンプルで同じ整合に達し、1億900万パラメータのテキストJEPAは、評価した最大720億パラメータまでのすべての言語モデルよりDINOv2・CLIPとよく揃った（抄録）。", "p6": "抄録の範囲では、定理の仮定（良い視点の条件）が実データでどこまで満たされるかは未確認。未査読のプレプリントである。", "fun": "写真で学んだAIと文章で学んだAIが、別々に育っても似た「世界の見方」を持つようになる、という不思議な仮説があります。この研究は、同じ場面を2つの見方で見せて学ばせれば、見方が回転を除いて一致することを数学で証明しました。小さなモデルでも学ばせ方しだいで巨大な言語モデルより揃う、という結果が面白い点です。", "unverified": "定理の証明の仮定の詳細は未確認。"}}, {"id": "pn03", "rank": 3, "field": "機械学習", "headline": "多トークン予測を正しく行う", "title": "Multi-Token Prediction Done Right", "url": "https://arxiv.org/abs/2610.38331", "authors": "Jayden Teoh", "venue": "Hugging Face Daily Papers", "date": "2026-10-30", "apa": "Teoh, J. (2026). Multi-Token Prediction Done Right (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.38331", "why": "LLMで一般的になった多トークン予測の設計を見直し、より正しい学習の仕方を示す。", "explain": {"basis": "抄録", "basis_note": "arXiv版HTMLの本文は取得できたが、抄録の範囲で書いた", "preprint": true, "p1": "言語モデルの事前学習で使われる多トークン予測（MTP）の勾配に含まれる雑音の成分を取り除く1行の変更Soft-MTPを示した（抄録）。", "p2": "MTPは下流性能を上げ投機的デコーディングで推論を速くするが、標準のMTPの学習では勾配の残差成分が次トークン学習と多トークン学習の両方を妨げ、規模とともに悪化する（抄録）。", "p3": "MTPの交差エントロピーの勾配を、各MTPヘッドをモデル自身の次トークン予測の分布へ引き寄せるKL自己蒸留の項と、信号対雑音比の低い残差に厳密に分解した。2つの分布が線形の出力ヘッドを共有するとき、交差エントロピーの勾配をストレートスルーの経路で組み合わせればKLの勾配を厳密に復元できる（KL勾配復元のトリック）ことを示し、語彙サイズのロジット行列なしに標準の融合カーネルで計算できるようにした（抄録）。", "p4": "未確認（抄録の切れた部分に評価の設定がある）。", "p5": "未確認（抄録の切れた部分に結果の数値がある）。", "p6": "抄録の範囲では、どの規模まで効果が確かめられたかは未確認。未査読のプレプリントである。", "fun": "言語AIに「次の1語」だけでなく「その先の数語」も予測させると賢く速くなる、という工夫が広く使われています。ところがこの研究は、そのときの学習の信号の中に、役に立たない雑音が混ざっていることを数式で見つけました。式を分解して雑音だけを取り除くと、コードの変更は1行で済むという点が面白いです。", "unverified": "性能改善と推論の高速化の数値は未確認。"}}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "隠れたAI利用と若手の技能形成", "title": "Racing the Machine: Hidden AI Use, Employer Learning and the Skills of Junior Workers", "url": "https://doi.org/10.2139/ssrn.7672458", "authors": "Teng Ge", "venue": "SSRN", "date": "2026-10-30", "apa": "Ge, T. (2026). Racing the Machine: Hidden AI Use, Employer Learning and the Skills of Junior Workers. https://doi.org/10.2139/ssrn.7672458", "why": "生成AIが若手の今日の成果を上げる一方で技能の習得と雇用主の学習を妨げる仕組みを分析する。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "生成AIが若手の今日の成果を上げる一方で、自分で作業することによる学習を減らし、雇用主による技能の推測を歪めることで、学習の課題でAIが過剰に使われる仕組みを理論で示した（抄録）。", "p2": "雇用主は技能を直接見られず成果から推測するが、AIは技能を上げずに成果を上げる。探索の摩擦、離職、成果報酬、雇用主の学習がある労働市場で、どれだけの仕事がAIに任されるかは分析されていなかった（抄録）。", "p3": "市場が技能を見られるとき、技能は社会的価値で価格づけされ、成果と学習のトレードオフは効率的に解かれる。技能を推測する必要があるとき、非効率は1つの量Ω（労働者が転職すると現在の雇用関係から漏れ出す市場の信念の価値）で決まる（抄録）。", "p4": "理論モデルの均衡を、技能が観測できる場合と推測する場合で比べた（抄録）。", "p5": "隠れた学習はちょうどΩだけ過小評価され、AIによる成果はΩに比例した重みで技能と読まれる。Ωはまだ出会っていない雇用主に帰属するため、労働者と現在の雇用主の協調では取り戻せず、市場は効率的な水準より低いAIの能力の段階で学習の課題にAIを採用する。過剰使用は離職とともに増え、AIで代替できない評価、成果報酬などで減る（抄録）。", "p6": "理論的な分析であり、実証の検証はない（抄録）。未査読のプレプリントである。", "fun": "新人がAIに仕事を任せると、今日の成果は上がりますが、自分で手を動かして覚える機会は減ります。しかも上司には成果しか見えないので、AIのおかげの成果を本人の実力と勘違いしてしまいます。この研究は、将来の転職先の評価まで含めて考えると、AIが「使われすぎる」方向にずれることを示した点が面白いです。", "unverified": "なし"}}, {"id": "pn05", "rank": 5, "field": "因果推論", "headline": "電子カルテの学習表現は交絡情報を捨てるか", "title": "Do Learned Representations of Electronic Health Records Discard Confounding Information? A Plasmode Evaluation and Diagnostics in the All of Us Research Program", "url": "https://doi.org/10.2139/ssrn.7671948", "authors": "Cong Cao", "venue": "SSRN", "date": "2026-10-30", "apa": "Cao, C. (2026). Do Learned Representations of Electronic Health Records Discard Confounding Information? A Plasmode Evaluation and Diagnostics in the All of Us Research Program. https://doi.org/10.2139/ssrn.7671948", "why": "学習された表現を使った因果推論で交絡が残るかを、プラズモード評価と診断で調べる。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "電子カルテ（EHR）の学習済み表現で交絡を調整すると、再構成の損失を増やさずに交絡の情報が捨てられうることを実データで示し、事前に定めた診断で検出できるかを確かめた（抄録）。", "p2": "EHRの学習表現は交絡の調整に使われ始めているが、圧縮によってまれな交絡因子の情報が失われても、再構成の誤差には表れない（抄録）。", "p3": "診断・薬剤・検査・バイタル・調査票の各モダリティごとに変分オートエンコーダを外部のAll of Us参照標本で学習し、GLP-1受容体作動薬（セマグルチドまたはチルゼパチド）を始めた成人6,728人を符号化した。実際の共変量を固定し、曝露・媒介変数・結果を既知の介入的間接効果で模擬するプラズモード設計で、学習表現がほとんど捉えないまれな診断群による交絡の有無を変えた（抄録）。背景：プラズモードは実データの共変量に、真の効果が分かる結果を人工的に乗せる検証法である。", "p4": "6か月の体重変化を媒介とする媒介分析で、学習表現、主成分、生の特徴による調整を比べ、偏りと95%信頼区間の被覆率、診断D1〜D4の検出率で評価した（抄録）。", "p5": "真の効果−0.725に対し、学習表現はまれな診断の交絡がないとき偏り−0.012・被覆率92%、あるとき偏り0.026・被覆率84%だった。診断D1は学習表現を、交絡がないときに複製の5%、あるときに95%で警告した（抄録）。", "p6": "抄録の範囲では、実際の応用での間接効果の結果と、他の診断（D2〜D4）の性能は未確認。未査読のプレプリントである。", "fun": "大量のカルテの情報をAIで小さくまとめてから因果の分析に使うと便利ですが、まれな病気の情報のように数は少なくても大事な情報が、まとめる途中で消えてしまうことがあります。この研究は、正解の分かる人工の結果を本物のデータに乗せて、その消え方と、それを見つける検査が働くかを確かめました。", "unverified": "実データへの適用結果は未確認。"}}, {"id": "pn06", "rank": 6, "field": "人口学", "headline": "人口高齢化は総貯蓄を下げるか（メタ分析）", "title": "Does Population Aging Lower Aggregate Saving? A Systematic Review and Meta-Analysis", "url": "https://doi.org/10.2139/ssrn.7672762", "authors": "James Wabenga Yango", "venue": "SSRN", "date": "2026-10-30", "apa": "Wabenga Yango, J. (2026). Does Population Aging Lower Aggregate Saving? A Systematic Review and Meta-Analysis. https://doi.org/10.2139/ssrn.7672762", "why": "高齢化と総貯蓄の関係の推定を系統的レビューとメタ分析でまとめ、通説の頑健さを検証する。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "人口高齢化が総貯蓄率を下げるかについて、パネル回帰とカリブレートしたライフサイクルモデルの推定を1つのプロトコルでまとめた系統的レビューとメタ分析を行い、方向は支持されるが大きさは定まらないことを示した（抄録）。", "p2": "2つの研究の流れは一部重なる標本で別々に進められ、統合した評価がなかった（抄録）。", "p3": "5つの文献データベースを検索して36の研究を選び、そのうち共通の尺度に置ける33の推定を各1回ずつ数え、ランダム効果で統合した。出版バイアスを考慮する頑健なベイズモデル平均と精度重みづけの補正も行った（抄録）。", "p4": "従属人口比率1ポイントあたりの貯蓄率の変化を共通の尺度とし、予測区間、出版バイアスの補正、誘導形と構造推定の比較、高齢者比率と老年従属人口比率の違いを調べた（抄録）。", "p5": "ランダム効果の統合では1ポイントあたり0.56ポイントの低下（95%信頼区間0.33〜0.80）だったが異質性が高く、新しい研究の予測区間は0を含んだ。頑健なベイズモデル平均では0.09ポイントに縮み信用区間は0をまたぎ、精度重みの補正は1つの極めて精度の高い研究を除くと符号が逆転した。高齢者比率による推定は老年従属人口比率による推定の約2倍だった（抄録）。", "p6": "著者自身が、証拠は効果の方向を支持するが大きさは支持しないと結論する（抄録）。誘導形と構造推定は似ているが一致を確かめるには不精確である（抄録）。未査読のプレプリントである。", "fun": "「高齢化が進むと国全体の貯金が減る」という話は経済学の教科書にも載っています。ところが36本の研究をまとめ直すと、減る方向はおおむね正しいものの、どれくらい減るかは研究の選び方で0近くまで小さくなりました。たった1本の研究を外すと結論が逆転するという脆さが面白い点です。", "unverified": "なし"}}, {"id": "pn07", "rank": 7, "field": "因果推論", "headline": "性格変化介入の効果の個人差", "title": "Interindividual Differences in Treatment Effects of a Personality Change Intervention on Life and Domain Satisfaction", "url": "https://doi.org/10.31234/osf.io/6esfm_v2", "authors": "Lara Kroencke ほか", "venue": "PsyArXiv", "date": "2026-10-29", "apa": "Kroencke, L., Zimmermann, J., Baumgardt, S., Brüggmann, L., Harzer, C., Mayer, A., Stieger, M., & Puhlmann, L. (2026). Interindividual Differences in Treatment Effects of a Personality Change Intervention on Life and Domain Satisfaction. https://doi.org/10.31234/osf.io/6esfm_v2", "why": "性格変化介入が生活満足度に与える効果が人によってどれだけ違うかを推定する。", "explain": {"basis": "抄録", "basis_note": "PsyArXiv（OSF）のPDF本文は取得できたが、抄録の範囲で書いた", "preprint": true, "p1": "スマートフォンを使う性格変化介入PEACHの生活満足度への効果が、平均だけでなく個人によってどれだけ違うかを因果推論の枠組みで推定した（抄録）。", "p2": "性格変化介入は性格特性とwell-beingに平均で効果を示してきたが、効果の個人差と、それを予測する開始時の特徴は分かっていなかった（抄録）。", "p3": "10週間のPEACH介入（N = 873、待機群と比較）のデータに、EffectLiteRの枠組みを使って平均処置効果と個人処置効果を推定し、人口学的特徴、開始時の性格特性とwell-being、動機、関与の好みで個人差を予測できるかを検討した（抄録）。背景：EffectLiteRは共変量で条件づけた処置効果を構造方程式モデルで推定する方法である。", "p4": "生活満足度、生活領域の満足度の平均、各領域の満足度を結果とした（抄録）。", "p5": "領域満足度の平均に有意な平均処置効果（d = 0.20）があり、仕事と感情に関わる領域に集中したが、生活満足度には効果がなかった。効果には有意な個人差があり、参加者の約27%で領域満足度の平均に正の効果が見られた（抄録）。", "p6": "抄録の範囲では、個人差を予測した要因の結果と、負の効果を示した人の割合は未確認。未査読のプレプリントである。", "fun": "「性格は変えられるか」という問いに、スマホのアプリで10週間練習するという研究です。平均すると満足度は少し上がっただけですが、約4人に1人ははっきり効果があったことが分かりました。平均の小ささの裏に、よく効く人と効かない人がいるという見方が面白い点です。", "unverified": "個人差を予測できた要因と、負の効果の有無は未確認。"}}, {"id": "pn08", "rank": 8, "field": "統計学", "headline": "SHAPの重要度と調整済み関連は食い違う", "title": "Global SHAP Importance and Adjusted Association Diverge for Constructed Survey Indicators: Child Labour and Foundational Learning in Bangladesh", "url": "https://doi.org/10.2139/ssrn.7665858", "authors": "Ishtiaq Mahmud Fahim ほか", "venue": "SSRN", "date": "2026-10-30", "apa": "Fahim, I. M., Reti, S. S., & Raiyan, S. (2026). Global SHAP Importance and Adjusted Association Diverge for Constructed Survey Indicators: Child Labour and Foundational Learning in Bangladesh. https://doi.org/10.2139/ssrn.7665858", "why": "構成された調査指標で、機械学習のSHAP重要度と回帰で調整した関連が異なる結論を導くことを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "機械学習のSHAP重要度の順位を「どの変数が重要か」の証拠として読むと、共変量で調整した関連と大きく食い違うことを、バングラデシュの児童労働と基礎学力のデータで示した（抄録）。", "p2": "大域的なSHAP値は、当てはめたモデルが予測の手柄をどう配分したかを表すだけで、共変量で調整した関連ではないが、両者は混同されがちである（抄録）。", "p3": "全国代表の2025年バングラデシュ複数指標クラスター調査の7〜14歳の19,995人で、調査の重みと設計に基づく分散を使ったロジスティック回帰（週の労働時間の用量反応を含む）で関連を推定し、3つの勾配ブースティングモデルのクラスター単位の交差検証と分割外のSHAP値と比べた。損失ベースの重要度、特徴集合の除去、係数が既知のシミュレーションでも確かめた（抄録）。", "p4": "児童労働の関連の大きさ（オッズ比）と、14の特徴の中でのSHAP重要度の順位を比べた（抄録）。", "p5": "児童労働（有病率11.4%）は算数の習熟の低いオッズ（オッズ比0.79、95%信頼区間0.70〜0.90）と読みの習熟の低いオッズ（0.74、0.65〜0.84）に関連し、経済的な労働時間とともに強まったが、家事サービスでは弱かった。それでも児童労働はすべてのブースティングモデルで14特徴の最下位だった（抄録）。", "p6": "横断研究であり因果は示せない（抄録）。抄録の範囲では、シミュレーションの詳細な結果は未確認。未査読のプレプリントである。", "fun": "AIに「学力を予測するのにどの情報が大事だったか」を聞くと、子どもが働いているかどうかは14項目中の最下位でした。ところが統計で他の条件をそろえて比べると、働いている子は学力がはっきり低いのです。AIの「重要度」は予測の役に立ったかを表すだけで、原因の強さではない、という教訓が面白い点です。", "unverified": "シミュレーションの結果の詳細は未確認。"}}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "決算予測市場は何を知っているか", "title": "What do Earnings Prediction Markets Know?", "url": "https://doi.org/10.2139/ssrn.7667338", "authors": "Tengfei Zhang", "venue": "SSRN", "date": "2026-10-30", "apa": "Zhang, T. (2026). What do Earnings Prediction Markets Know? https://doi.org/10.2139/ssrn.7667338", "why": "決算の予測市場がアナリスト予想など既存の情報を超えて予測を改善する条件を調べる。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "Polymarketの決算予測市場の価格が、企業の決算の履歴とアナリスト予想を超える情報を持つのはいつかを、前向きの評価で示した（抄録）。", "p2": "決算がアナリスト予想を上回れば1ドルを払う契約の価格は、発表直前にはアナリスト予想より正確とされてきたが、既存の情報を超える付加的な情報がいつ現れるかは分かっていなかった（抄録）。", "p3": "ある決算期で予測の組み合わせの重みを当てはめ、次の決算期で評価する前向きの設計で、契約価格、企業の過去の上回り率、過去に較正した予想コンセンサスの確率を比べ・組み合わせた（抄録）。", "p4": "保留した期の予測精度を基準に、発表までの日数ごとに比べた（抄録）。", "p5": "発表の約5日前から、価格と過去の上回り率と較正したコンセンサス確率を組み合わせると保留した予測が有意に改善したが、価格だけではまだ有意に正確ではなく、最終日になって初めて価格だけで両方の基準より正確になった。価格はアナリストを共有する企業の決算サプライズに反応したがコンセンサスは反応せず、ただしその情報の取り込みは不完全だった。付加的な情報は活発に取引される契約に集中し、ニュースのない取引の急増は精度を上げずに反転した（抄録）。", "p6": "抄録の範囲では、対象企業数と期間は未確認。未査読のプレプリントである。", "fun": "「この会社の決算は予想を上回るか」に賭ける市場の値段は、プロのアナリストの予想より当たるのでしょうか。この研究によると、値段だけで勝てるのは発表の前日になってからで、それまでは過去の実績などと組み合わせて初めて役に立ちます。賭けの値段に含まれる「みんなの知恵」がいつ現れるかを測った点が面白いです。", "unverified": "対象企業数と期間は未確認。"}}, {"id": "pn10", "rank": 10, "field": "経済学", "headline": "人はAIにどう仕事を任せ、市場はそれを織り込んだか", "title": "Delegating to the Machine: How People Hand Work to AI, and Whether Equity Markets Priced it", "url": "https://doi.org/10.2139/ssrn.7667658", "authors": "Ajai Upadhyaya", "venue": "SSRN", "date": "2026-10-30", "apa": "Upadhyaya, A. (2026). Delegating to the Machine: How People Hand Work to AI, and Whether Equity Markets Priced it. https://doi.org/10.2139/ssrn.7667658", "why": "人が言語モデルに仕事を委ねる仕方を測り、株式市場がその影響を価格に反映したかを調べる。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "人が言語モデルに仕事をどう委ねているか、そして産業の株式リターンがそれを反映したかを、事前登録したプロトコルで検証し、多くの仮説が支持されないことを報告した（抄録）。", "p2": "AIへの仕事の委任の実態と、それが職業・国・産業でどう違い、市場で価格づけされたかは、事前に定めた検定で調べられていなかった（抄録）。", "p3": "2025年2月10日〜2026年6月26日のAnthropic Economic Indexの公開データ（O*NETの課題に対応づけた会話）を職業・国・49のFama–French産業に集計し、事前登録したプロトコル（pap-v1）で5つの仮説を検定した（抄録）。", "p4": "高学歴・高賃金の職業で委任が少ないか（H1）、課題内で委任が増えているか（H2）、誤りの費用が高い所で確認が多いか（H3）、課題構成を超える国の差（H4）、市場の反応（H5）を、事前に定めた有意水準で評価した（抄録）。", "p5": "H1は支持されず、H2もリリース単位の条件が満たされず支持されなかった（ただし課題でクラスター化した傾向は年4.98ポイント［2.71, 7.25］）。H3は支持されず、H4は支持された。産業の委任と人が評価した理論的な曝露のスピアマン相関はρ = 0.716［0.527, 0.839］だった。市場の検定は最小検出効果が閾値の5ポイントを上回り、H5は棄却されなかった（抄録）。", "p6": "著者は、市場の証拠が言えることと言えないことを分けて報告し、検出力の不足を明示している（抄録）。分類された会話の母集団の変更が時系列に段差を生んでいる（抄録）。未査読のプレプリントである。", "fun": "人はAIにどんな仕事を任せているのか、そしてそれを株式市場は見抜いていたのか、という問いを、あらかじめ検定の方法を決めてから調べた研究です。5つの予想のうち、はっきり支持されたのは国による違いだけでした。思ったとおりにならなかった結果も正直に報告する事前登録の姿勢が面白い点です。", "unverified": "なし"}}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "中国の出産保険と採用差別・母親ペナルティ", "title": "Maternity Insurance, Hiring Discrimination, and the Motherhood Penalty under China's Two-Child Policy", "url": "https://doi.org/10.2139/ssrn.7672518", "authors": "Teng Ge", "venue": "SSRN", "date": "2026-10-30", "apa": "Ge, T. (2026). Maternity Insurance, Hiring Discrimination, and the Motherhood Penalty under China’s Two-Child Policy. https://doi.org/10.2139/ssrn.7672518", "why": "二人っ子政策後の出産保険の変化が、女性の採用差別と母親ペナルティに与えた影響を推定する。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "中国の2016年の二人っ子政策の後に女性の雇用と所得が下がった理由を、就業を条件とする出産給付と雇用主の反応を入れた探索モデルで分解し、政策のトレードオフを示した（抄録）。", "p2": "二人っ子政策の後、出生は一時的にしか増えず、女性の雇用と所得は下がった。その仕組みは母親側の行動と雇用主側の行動のどちらによるのか分かっていなかった（抄録）。", "p3": "更新可能で就業を条件とする出産給付が、子ども1人の母親に就業のオプション価値を与え、留保賃金を下げて質の低い仕事を受け入れさせる探索モデルを作り、準実験的な書類選考の返信の証拠に基づく雇用主の反応と組み合わせてカリブレートした（抄録）。", "p4": "改革後の結果を目標にせずにモデルが再現できるかで評価し、雇用低下と賃金ペナルティを2つの経路に分解した（抄録）。", "p5": "モデルは改革後の結果の方向と大きさの多くを再現した。雇用の低下の大部分は雇用主の反応、賃金ペナルティの大部分は母親の仕事の選び直しによる。2つの経路は母親の就職ハザードに逆向きの効果を持ち、パネルデータで検証できる予測を与える。反実仮想では、家計への給付は出生を増やすが雇用と仕事の質をやや下げ、雇用主の出産費用を補填すると両方が回復し出生はやや減る（抄録）。", "p6": "カリブレートした構造モデルによる分解であり、2つの経路の識別はモデルの仮定に依存する（解釈）。著者が示す検証可能な予測はまだ検証されていない（抄録）。未査読のプレプリントである。", "fun": "子どもを2人まで持てるようにした政策のあと、女性の働き方が悪くなったのはなぜか。この研究は、会社が出産の費用を嫌って女性を採りにくくなったことと、母親が給付を受けるために条件の悪い仕事でも受け入れたことの2つに分けて考えました。給付の出し方を変えるだけで結果が変わるという政策の示唆が面白い点です。", "unverified": "2つの経路の寄与の具体的な割合は未確認。"}}, {"id": "pn12", "rank": 12, "field": "機械学習", "headline": "一つのアルゴリズムで基盤モデルを学習する", "title": "Training Foundation Models with a Single Algorithm", "url": "https://arxiv.org/abs/2610.40564", "authors": "Yuda Song ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-30", "apa": "Song, Y., Zhang, A., Tajwar, F., Arora, D., Schneider, J., Khashabi, D., Salakhutdinov, R., Bagnell, J. A., Singh, A., & Zanette, A. (2026). Training Foundation Models with a Single Algorithm (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.40564", "why": "事前学習・微調整などで別々の手法を使う基盤モデルの学習を、単一のアルゴリズムで行う。", "explain": {"basis": "抄録", "basis_note": "arXiv版HTMLの本文は取得できたが、抄録の範囲で書いた", "preprint": true, "p1": "事前学習・中間学習・教師あり微調整・強化学習という基盤モデルの段階的な学習を、単一の尤度に基づく学習アルゴリズムで統一した（抄録）。", "p2": "基盤モデルはデータと学習アルゴリズムの両方を変えながら段階的に学習されるが、このアルゴリズムの分離が本質的かは問われていなかった（抄録）。", "p3": "強化学習の目的を、モデルが生成した目標分布への最尤当てはめとして導くことで、すべての段階を1つの尤度ベースの学習（unified training）の下に置いた。学習の全体は「どのデータを、どの割合で、いつ学習するか」を選ぶ問題になり、従来の段階的学習はその特殊な場合になる（抄録）。", "p4": "静的なデータと強化学習の生成を1つの学習器で混ぜる統一学習のシステムを作り、制御した実験と実世界の実験で、精度と計算量のトレードオフ、課題の網羅、広い能力の保持、継続学習の出発点としての良さを比べた（抄録）。", "p5": "統一学習は精度と計算量のトレードオフと課題の網羅を改善し、広い能力を保ち、継続学習のより強い出発点を与えた（抄録）。数値は抄録にない。", "p6": "抄録の範囲では、モデルの規模と改善の大きさは未確認。未査読のプレプリントである。", "fun": "大きなAIは、まず大量の文章を読み、次にお手本で練習し、最後にほめられたり叱られたりして学ぶ、という段階を踏んで育てられます。この研究は、その全部が実は「ある目標の分布に近づく」という1つの学び方で書けることを示しました。学び方を変えるのではなく、何をいつ学ぶかを選ぶ問題に変わる、という見方が面白いです。", "unverified": "改善の具体的な数値は未確認。"}}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "未来を見ずにAIエージェントは株式投資できるか", "title": "Investor's Last Exam: Can AI Agents Do Equity Investment Without Seeing the Future?", "url": "https://arxiv.org/abs/2610.38342", "authors": "Huangfei Jiang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-30", "apa": "Jiang, H., Hu, A., Sheng, K., Cai, Y., Ge, R., Kong, X., Lin, J., Chen, S., Weng, J., & Yan, J. (2026). Investor's Last Exam: Can AI Agents Do Equity Investment Without Seeing the Future? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.38342", "why": "情報漏れを防いだ評価で、AIエージェントの株式投資の能力を検証するベンチマークを示す。", "explain": {"basis": "抄録", "basis_note": "arXiv版HTMLの本文は取得できたが、抄録の範囲で書いた", "preprint": true, "p1": "未来の情報が漏れないよう情報集合を厳密に凍結し、プロの投資家の基準で株式調査の全過程を評価するベンチマークInvestor's Last Exam（ILE）を作った（抄録）。", "p2": "既存のベンチマークは金融知識、調査の手順、予測を個別に評価するもので、調査の全過程を評価するには厳密に凍結した情報集合と専門的な評価基準が必要である（抄録）。", "p3": "9種類の情報源にわたる343万の文書の版と構造化された市場データを持ち、検証済みのタイムスタンプで検索と計算を制御する版管理された金融データベース、アナリストの成果物に基づく課題の分類、財務の依存関係グラフで採点基準を情報源・計算・仮定に結びつける専門家主導の評価枠組みからなる。経験のあるバイサイドの投資家とファンドマネジャーが主導した（抄録）。", "p4": "86の課題で、調査の質、予測の精度、模擬的な投資成績を合わせて評価した（抄録）。", "p5": "総合ではGPT-6 Astraが100点中68.1、Claude Opus 5.5が66.9で首位を争ったが、Astraでも予測とモデルの項目は52.5にとどまり、最先端のモデルでも調査全体の能力を予測に結びつけられていないことを示した（抄録）。", "p6": "抄録の範囲では、課題数86が十分か、採点者間の一致はどうかは未確認。未査読のプレプリントである。", "fun": "AIに株の調査をさせるテストで一番難しいのは、AIが「未来の答え」をうっかり知らないようにすることです。この研究は、どの資料がいつ公開されたかを細かく管理して、判断した日までの情報だけでAIを試しました。最新のAIでも、きれいな調査報告は書けるのに、将来の予測になると点数が大きく下がる点が面白いです。", "unverified": "採点者間の一致の程度は未確認。"}}, {"id": "pn14", "rank": 14, "field": "機械学習", "headline": "「人間らしさ」はAIの評価基準として誤り", "title": "Human likeness is a misplaced benchmark for artificial intelligence", "url": "https://doi.org/10.31234/osf.io/zn5u9_v1", "authors": "Valerio Capraro ほか", "venue": "PsyArXiv", "date": "2026-10-30", "apa": "Capraro, V., Marcus, G., & Quattrociocchi, W. (2026). Human likeness is a misplaced benchmark for artificial intelligence. https://doi.org/10.31234/osf.io/zn5u9_v1", "why": "LLMがチューリングテストに合格したという主張の手続きの違いを整理し、人間らしさを基準にする問題を論じる。", "explain": {"basis": "抄録", "basis_note": "PsyArXiv（OSF）のPDF本文は取得できたが、抄録の範囲で書いた", "preprint": true, "p1": "LLMがチューリングテストに合格したという主張から知能を推論することに異を唱え、人間らしさをAI開発の指針にすること自体を問い直して、人間のwell-beingを基準にする3つの変更を提案した（抄録）。", "p2": "最近の合格の主張は手続きこそ違うが、出力に至る過程ではなく人間に似た出力に注目している点で共通している（抄録）。", "p3": "似た出力は異なる過程から生じうるため、推論・汎化・適応の違いを隠しうると論じた。さらに、模倣を優先すると人間の偏りを再生産し、操作を容易にし、人の能力を拡張するより人を置き換える方向に向かうと論じた（抄録）。", "p4": "概念的な論考であり、実証の評価はない（抄録）。", "p5": "人の能力と独立した判断を強めるシステムの設計、資金を受けるプロジェクトに便益・費用とその分配の評価を求めること、AIの人間のwell-beingへの効果の証拠で組織の調達と更新を導くこと、の3つを勧めた（抄録）。", "p6": "規範的な主張であり、提案の効果は検証されていない（解釈）。未査読のプレプリントである。", "fun": "「AIが人間と見分けがつかないほど自然に話せたら、それは知能の証拠だ」という考え方に、この論文は待ったをかけます。答えが似ていても、そこに至る考え方は違うかもしれないからです。さらに、人間そっくりを目指すこと自体が、だましやすさや人の置き換えにつながると指摘している点が面白いです。", "unverified": "なし"}}, {"id": "pn15", "rank": 15, "field": "組織行動・心理的安全性", "headline": "チーム科学：共同研究の規模と被引用", "title": "Team Science: An Examination of Factors Associated with Citation Metrics", "url": "https://doi.org/10.31234/osf.io/37mcg_v1", "authors": "Kelly Cuccolo ほか", "venue": "PsyArXiv", "date": "2026-10-29", "apa": "Cuccolo, K., Wagge, J. R., Edlund, J., & Buchanan, E. M. (2026). Team Science: An Examination of Factors Associated with Citation Metrics. https://doi.org/10.31234/osf.io/37mcg_v1", "why": "科学の共同研究の特徴と被引用指標の関係を調べる。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Europe PMCに登録された抄録を使用", "preprint": true, "p1": "共同研究のチームの大きさと構成（h指数、性別、機関・地理の多様性）が論文の被引用とどう関係し、分野ごとにどう違うかを大規模なメタデータで調べた（抄録）。", "p2": "共著による共同研究は多くの分野で増え被引用の増加と結びつけられてきたが、どの分野で最も増えたか、チームの属性と大きさが影響とどう関わるかは分かっていなかった（抄録）。", "p3": "ElsevierのInternational Center for the Study of Research（ICSR）Labのメタデータを使い、分野ごとの共同研究の傾向と被引用の関連を分析した（抄録）。", "p4": "被引用数を結果とし、チームの大きさ、著者順ごとの性別、機関・地理の多様性、最終著者のh指数（自己引用の除外の有無）との関連を比べた（抄録）。", "p5": "チームの大きさは時間とともに増え、分野で差があり、被引用数と正に関連した。性別と被引用の関係は著者順と分野で異なった。機関と地理の多様性は高い被引用と結びつき、最終著者のh指数はとくに自己引用を除くと影響と強く関連した（抄録）。", "p6": "抄録の範囲では効果量が小さいと述べられているようだが（抄録の末尾が切れている）、具体的な大きさは未確認。観察研究であり因果は示せない（解釈）。未査読のプレプリントである。", "fun": "大人数のチームで書いた論文ほどよく引用される、という傾向はよく知られています。この研究はさらに、チームの中で誰が最後の著者か、どれだけ多くの国や機関の人がいるかまで調べました。最後の著者の実績が引用と特に強く結びつくという結果は、科学の世界の「信用」の仕組みを考えさせる点で面白いです。", "unverified": "効果量の具体的な大きさと、対象の論文数・分野数は未確認。"}}, {"id": "pn16", "rank": 16, "field": "機械学習", "headline": "データなしで多モーダルモデルが自己改善", "title": "A-RSI: Adaptive Task Refresh for Zero-Data Multimodal Self-Improvement", "url": "https://arxiv.org/abs/2610.38568", "authors": "Yu Liu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-30", "apa": "Liu, Y., Li, Y., Tan, Y., Yang, Z., Su, Z., Feng, H., Zhang, S., Liao, L., Wan, Z., Wu, C., Cao, C., Yuan, F., Liu, Y., Chen, Z., Fu, P., Timofte, R., Wu, Z., Sebe, N., Poczos, B., & Luan, J. (2026). A-RSI: Adaptive Task Refresh for Zero-Data Multimodal Self-Improvement (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.38568", "why": "課題を適応的に作り直すことで、外部データなしに多モーダルモデルを再帰的に改善する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXiv抄録を使用", "preprint": true, "short": true, "p1": "外部データなしで多モーダルモデルを再帰的に自己改善させる際に、「いつ新しい課題を入れるか」を学習の動きから決める方法A-RSIを示した（抄録）。", "p3": "学習ログの報酬の変動と正解率を監視し、学習信号が弱まったら課題の集まりを入れ替える。検証・テストの得点は使わず、モデルが書いたプログラムの集まりから答えを独立に確かめられる多モーダル課題を作る（抄録）。", "p5": "性能の数値は抄録の切れた部分にあり未確認。", "fun": "AIが自分で問題を作って自分で練習するとき、同じ問題ばかり解いていても伸びなくなります。この研究は「もう伸びなくなった」タイミングを学習の記録から見つけて問題を入れ替えます。さらに答え合わせを多数決ではなくプログラムで確かめ、自分の思い込みで学ばないようにしている点が面白いです。", "unverified": "ベンチマークでの改善幅は未確認。"}}, {"id": "pn17", "rank": 17, "field": "機械学習", "headline": "専門職の意図を実行可能な仕事に変えてエージェント学習", "title": "WorkFactory: Turning Professional Intents into Executable Work for Scalable Agent Training", "url": "https://arxiv.org/abs/2610.37161", "authors": "Ziyang Zeng ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-30", "apa": "Zeng, Z., Chen, T., Deng, J., Wang, Q., Tang, S., Yang, Y., Ren, T., Zhao, W. X., Chang, F., He, J., Hao, C., Tao, R., & Dai, B. (2026). WorkFactory: Turning Professional Intents into Executable Work for Scalable Agent Training (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.37161", "why": "専門職の意図を実行可能な作業に変換し、エージェントの学習データを大規模に作る。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXiv抄録を使用", "preprint": true, "short": true, "p1": "専門職の意図から一貫して実行できる業務課題を大量に作り、仕事をするAIエージェントの教師あり学習を拡大する枠組みWorkFactoryを示した（抄録）。", "p3": "意図から必要な情報の依存関係と所在を表す情報支援グラフを作って課題を具体化し、試行の実行で情報の欠けを見つけて意図を保ったまま修復する（抄録）。", "p5": "612職種にわたる112,686の課題を作り、教師の軌跡でQwenの4B・27B・35B-A3Bを微調整した（抄録）。改善の数値は未確認。", "fun": "AIに「仕事」を教えるには、実際にやり遂げられるだけの情報がそろった練習問題が必要です。この研究は、仕事の目的から逆算して必要な資料や依存関係を地図のように描き、足りない情報を補ってから問題にします。600以上の職種の課題を自動で作れる点が面白いです。", "unverified": "微調整後の性能の数値は未確認。"}}, {"id": "pn18", "rank": 18, "field": "機械学習", "headline": "実際のウェブから大規模なエージェント環境を作る", "title": "WebAnything: From the Wild Web to Scalable Agent Environments", "url": "https://arxiv.org/abs/2610.37786", "authors": "Tianci Xie ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-30", "apa": "Xie, T., Cai, Z., Zhang, C., Guo, P., Li, B., Zheng, R., & Yan, H. (2026). WebAnything: From the Wild Web to Scalable Agent Environments (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.37786", "why": "実際のウェブサイトから、ウェブエージェントを学習・評価するための環境を大規模に作る。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXiv抄録を使用", "preprint": true, "short": true, "p1": "実在のURLから、ウェブエージェントの学習・評価に使える再利用可能なウェブサイト環境を、サイトごとの手作業なしに自動で再構成する枠組みWebAnythingを示した（抄録）。", "p3": "探索・構築役がブラウザで観測できる構造・資源・操作の結果を集め、独立の検証役が凍結した候補を確かめて局所的な修復や再取得を指示する（抄録）。", "p5": "14の応用領域で244のウェブサイトの環境を作った（抄録）。エージェントの性能の数値は未確認。", "fun": "ウェブ上で作業するAIを練習させるには、何度でも元に戻せる「練習用のウェブサイト」が必要です。本物のサイトは毎日変わるので、この研究は本物を観察して動く複製を自動で作ります。作る役とチェックする役を分けて品質を保つ工夫が面白い点です。", "unverified": "再構成の忠実度の評価結果は未確認。"}}, {"id": "pn19", "rank": 19, "field": "機械学習", "headline": "生成型板情報モデルの市場インパクトを評価", "title": "LOB-Impact Benchmark: Emergent Market Impact in Generative Limit Order Book Models", "url": "https://arxiv.org/abs/2610.27100", "authors": "George Nigmatulin ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-29", "apa": "Nigmatulin, G., Mohl, V., Frey, S., Li, K., Marti-Shahandeh, A., Cucuringu, M., Calinescu, A., Foerster, J., & Zohren, S. (2026). LOB-Impact Benchmark: Emergent Market Impact in Generative Limit Order Book Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27100", "why": "生成型の板情報（LOB）モデルに現れる市場インパクトを評価するベンチマークを示す。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXiv抄録を使用", "preprint": true, "short": true, "p1": "次のトークン予測だけで学習した生成型の板情報（LOB）モデルに、現実的な市場インパクトが自然に現れることを示し、それを測るベンチマークを作った（抄録）。", "p3": "5つの自己回帰モデルが生成する注文の流れに執行型の大口注文を差し込み、NASDAQの5銘柄で、実証研究の推定量を使って価格の反応を測る。推定量は性質が分かっている基準モデルで検証した（抄録）。", "p5": "数値の結果は抄録の切れた部分にあり未確認。", "fun": "株の売買を練習するAIのための「仮想の市場」では、自分が大量に買うと値段が上がるという反応が正しく再現されていないと、仮想市場でしか通用しない戦略を覚えてしまいます。この研究は、次の注文を予測するだけのAIがこの反応を自然に身につけているかを確かめる物差しを作りました。", "unverified": "モデル間の市場インパクトの比較結果は未確認。"}}, {"id": "pn20", "rank": 20, "field": "機械学習", "headline": "最新LLMの制御喪失・操作のリスク評価", "title": "Evaluating DeepSeek V4.1 Flash-1017 for loss of control and harmful manipulation risks", "url": "https://arxiv.org/abs/2610.35671", "authors": "Yao Huang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-29", "apa": "Huang, Y., Zeng, Z., Wang, Y., Zhu, Z., Duan, D., Li, H., Xu, S., Wang, Y., Tu, J., Xiong, S., Zang, Y., Yan, H., Yang, H., Gu, F., Xu, W., Dong, Y., & Li, X. (2026). Evaluating DeepSeek V4.1 Flash-1017 for loss of control and harmful manipulation risks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35671", "why": "最新のLLMについて、制御喪失と有害な操作のリスクを評価する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXiv抄録を使用", "preprint": true, "short": true, "p1": "オープンウェイトのLLMであるDeepSeek V4.1 Flash-1017について、制御喪失と有害な操作のリスクを第三者として評価した（抄録）。", "p3": "EUの汎用AI行動規範に沿って、自社開発の5つを含む34のベンチマークで評価の健全性・制御喪失・有害な操作を調べ、AEF-1の基準に従って以前のV4系モデルなどと比べた（抄録）。", "p5": "比較の結果は抄録の切れた部分にあり未確認。", "fun": "大企業の非公開のAIには安全性の報告書が付くことが多いのに対し、誰でも重みを使えるオープンなAIは、危険な能力の点検が手薄になりがちです。この研究は、外部の立場から34種類のテストで最新モデルを点検しています。AIの安全性を誰がどう確かめるのかという問いが面白い点です。", "unverified": "各リスク指標での具体的な結果は未確認。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "グローバル化の地域的な損得とトランプ1期目", "title": "Global Trade, Local Jobs, and the Rise of Trump 1.0", "url": "https://doi.org/10.2139/ssrn.7665202", "authors": "Jiatao Liu ほか", "venue": "SSRN", "date": "2026-10-30", "apa": "Liu, J., Pan, J., & Ye, Y. (2026). Global Trade, Local Jobs, and the Rise of Trump 1.0. https://doi.org/10.2139/ssrn.7665202", "why": "グローバル化の利益と費用の地域差が、トランプの台頭にどうつながったかを分析する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用", "preprint": true, "short": true, "p1": "グローバル化の利益と費用の地域的な偏りが、2016年のトランプの台頭にどう寄与したかを郡単位で分析した（抄録）。", "p3": "海外調達による効率の利益（輸入/GDP、IM）と製造業雇用の喪失（製造業の雇用比率、L-Share）の2つの地域経験を取り上げ、共和党の二大政党得票率の変化との関係を調べた（抄録）。", "p5": "海外調達への参加が少ない郡と製造業への依存が高い郡で、2016年にトランプへの大きな移動があった。中国ショック以前の1970〜80年代に測ったL-Shareもこの移動を予測した（抄録）。", "fun": "グローバル化は国全体では得になっても、得をする地域と損をする地域が分かれます。この研究は、40年以上前の製造業の多さが2016年の投票を予測することを示しました。経済の変化が長い時間をかけて政治に影を落とす、という点が面白いです。", "unverified": "効果の大きさの具体的な数値は抄録の切れた部分にあり未確認。"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "企業補助金と市場構造", "title": "Corporate Subsidies and Market Structure", "url": "https://doi.org/10.2139/ssrn.7666538", "authors": "Filippo Belloc ほか", "venue": "SSRN", "date": "2026-10-30", "apa": "Belloc, F., & Lofaro, A. (2026). Corporate Subsidies and Market Structure. https://doi.org/10.2139/ssrn.7666538", "why": "企業ごとの補助金が製造業の市場構造に与える影響を調べる。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用", "preprint": true, "short": true, "p1": "企業ごとの補助金が製造業の市場構造（集中度）に与える影響を、理論と国際データで調べた（抄録）。", "p3": "補助金が費用の非対称と参入・需要の波及という逆向きの力を生むクールノー型のモデルを作り、Global Trade Alertの企業別補助金とOrbisの財務データ（2012〜2019年）を結合して、実施時期の違いを使った差の差の推定を行った（抄録）。", "p5": "補助金は平均ではハーフィンダール・ハーシュマン指数で測った集中度に影響しなかった（抄録）。", "fun": "政府が特定の企業に補助金を出すと、その企業が強くなって市場が独占に近づくのか、それとも市場全体が広がって新しい企業が入ってくるのか。この研究は両方の力が働くことを理論で示し、データでは平均すると集中度が変わらないことを見つけました。", "unverified": "異質性の分析など平均以外の結果は未確認。"}}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "輸出規制はどこで効くか：半導体供給網2018–2026", "title": "Where Export Controls Bind: Law and Lead in the Semiconductor Supply Chain, 2018–2026", "url": "https://doi.org/10.2139/ssrn.7668219", "authors": "Heekwon Kyung ほか", "venue": "SSRN", "date": "2026-10-30", "apa": "Kyung, H., & Kim, S. (2026). Where Export Controls Bind: Law and Lead in the Semiconductor Supply Chain, 2018–2026. https://doi.org/10.2139/ssrn.7668219", "why": "技術の輸出規制が半導体供給網のどこで効き、どこで効かなかったかを調べる。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用", "preprint": true, "short": true, "p1": "半導体の輸出規制が効いたかどうかの評価が割れるのは、規制が製品・工程・最終利用者の単位で書かれるのに、国・産業・年の単位で評価されるからだと論じ、2017〜2026年の中国の記録を公開資料から再構成した（抄録）。", "p3": "63社の地域別売上の注記、8桁の品目別の通関記録、メモリ2社の2026年の目論見書、制裁リストを使った（抄録）。", "p5": "同じ規制が4種類の反応を生み、それぞれは規制が及んだ投入物を代替できたかで説明できた。最先端の受託製造から切り離されたファーウェイは同業他社比で売上の42%を失った（抄録）。", "fun": "「技術の輸出を止めれば相手は困るのか」という昔からの問いに、この研究は「止めた部品を別のもので代わりにできるかどうか次第」と答えます。国全体の数字を見ると効いていないように見えても、企業や部品の単位で見ると大きな打撃がある、という見る単位の違いが面白い点です。", "unverified": "4種類の反応の内訳は抄録の範囲で未確認。"}}, {"id": "pn24", "rank": 24, "field": "統計学", "headline": "多層媒介分析の区間推定をRで効率化（追試）", "title": "Computationally efficient interval estimation for the 1-1-1 multilevel mediation analysis model in R: A replication of Bauer, Preacher, and Gil (2006)", "url": "https://doi.org/10.31234/osf.io/ms39n_v2", "authors": "Carl F. Falk ほか", "venue": "PsyArXiv", "date": "2026-10-29", "apa": "Falk, C. F., & Savchenko, E. (2026). Computationally efficient interval estimation for the 1-1-1 multilevel mediation analysis model in R: A replication of Bauer, Preacher, and Gil (2006). https://doi.org/10.31234/osf.io/ms39n_v2", "why": "1-1-1多層媒介モデルの区間推定を計算効率よく行う方法を、先行研究の追試として示す。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用", "preprint": true, "short": true, "p1": "1-1-1型の多層媒介分析モデルで、間接効果の区間を計算効率よく求める元の方法（Bauer, Preacher, & Gil, 2006）をRで実装し、その性能を追試した（抄録）。", "p3": "元の研究は商用ソフトで示されており、Rでは計算負荷の高い方法しか示されていなかったため、効率的な方法の実装とモンテカルロ・シミュレーションの追試を行った（抄録）。", "p5": "追試の結果の数値は抄録の切れた部分にあり未確認。", "fun": "「AがBを通じてCに効く」という間接的な効果を、学校や会社のように人がグループに分かれたデータで調べるのが多層媒介分析です。この研究は、有名な方法を無料のソフトで使えるようにし、昔のシミュレーションの結果が本当に再現するかを確かめています。統計手法の追試という地味だが大切な作業です。", "unverified": "元の研究と結果が一致したかは未確認。"}}, {"id": "pn25", "rank": 25, "field": "統計学", "headline": "1本の経路から長期の資産成長を推論する", "title": "One-Path Inference for Long-Run Portfolio Growth in Stochastic Factor Markets", "url": "https://doi.org/10.2139/ssrn.7666678", "authors": "Xinrui Dong", "venue": "SSRN", "date": "2026-10-30", "apa": "Dong, X. (2026). One-Path Inference for Long-Run Portfolio Growth in Stochastic Factor Markets. https://doi.org/10.2139/ssrn.7666678", "why": "有限の資産記録から長期のポートフォリオ順位を推論する方法を示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用", "preprint": true, "short": true, "p1": "有限の資産の記録1本から、拡散型の因子市場での長期のポートフォリオ成長率を推論する方法を示した（抄録）。", "p3": "ポアソン方程式による補正で長期成長の分散と有限ブロックの偏りを結びつけ、バッチ平均法が平均二乗で一致することと初期状態の偏りの上界を示した（抄録）。", "p5": "線形ガウスの基準例では、共通の雑音が成長率を変えずに分散を2.3倍に変え、既知のケリー・マートン則の弱い信号の検出に必要な期間は予測力の2乗に反比例して伸びた（抄録）。", "fun": "投資の成績表は1本の歴史しかなく、やり直しがききません。その1本だけから「長い目で見てどちらの戦略が勝つか」をどこまで言えるかを数学的に示したのがこの研究です。予測の力が半分になると、見分けるのに必要な期間が4倍になるという関係が面白い点です。", "unverified": "実データへの適用は未確認。"}}, {"id": "pn26", "rank": 26, "field": "因果推論", "headline": "回復の訓練が仕事の成果を高めるか", "title": "Active Recovery Is Not Just for Athletes: Employees Need to Train for Recovery to Enhance Work", "url": "https://doi.org/10.31235/osf.io/cz5g4_v1", "authors": "Matthew J Monnot", "venue": "SocArXiv", "date": "2026-10-30", "apa": "Monnot, M. J. (2026). Active Recovery Is Not Just for Athletes: Employees Need to Train for Recovery to Enhance Work. https://doi.org/10.31235/osf.io/cz5g4_v1", "why": "従業員の回復訓練の試験の効果を検討し、訓練としての回復を論じる。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録を使用", "preprint": true, "short": true, "p1": "回復訓練が、もともと仕事から心理的に離れにくい人と離れやすい人のどちらに効くかを、ランダム化試験の事前に定めた再分析で検証した（抄録）。", "p3": "ドイツの従業員393人（事後測定あり247人）で、待機対照・6週間の認知行動的な回復訓練・6週間のマインドフルネス訓練を比べた試験を、基準値×群の交互作用、分位処置効果などで分析した（抄録）。", "p5": "結果の数値は抄録の切れた部分にあり未確認。", "fun": "スポーツ選手が休み方を練習するように、会社員も「仕事から頭を切り離す」練習が必要だという研究です。平均で効果があっても、苦手な人ほど伸びるのか、得意な人がさらに伸びるのかで意味が変わります。平均の裏にある個人差を問うている点が面白いです。", "unverified": "補償か蓄積かのどちらが支持されたかは未確認。"}}, {"id": "pn27", "rank": 27, "field": "機械学習", "headline": "因果経路の保護で文脈内学習を選択的に保持", "title": "Selective retention of in-context learning through causal pathway protection", "url": "https://doi.org/10.2139/ssrn.7668358", "authors": "Jiateng Cui ほか", "venue": "SSRN", "date": "2026-10-30", "apa": "Cui, J., Wang, L., Li, Y., Wang, X., Xing, Y., & Shen, C. (2026). Selective retention of in-context learning through causal pathway protection. https://doi.org/10.2139/ssrn.7668358", "why": "微調整後も文脈内学習の能力を、因果経路を保護することで選択的に保つ。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用", "preprint": true, "short": true, "p1": "学習が進むと消えていく文脈内学習（ICL）を、すでにできた例とラベルの対応づけの経路を保護することで、学習データを変えずに保てることを示した（抄録）。", "p3": "チェックポイント間のパラメータ置換で経路を特定し、例の入れ替え介入でラベル位置の注意のキーを通じて情報が流れることを示し、その経路の保護損失を定めてAdamの更新を最小限に補正した（抄録）。", "p5": "2層トランスフォーマーで、通常の継続学習に比べて標準的なICLの正解率を36.38ポイント改善した（抄録）。", "fun": "AIは、例を見せるだけでその場で新しい課題を解ける「文脈内学習」の能力を持ちますが、さらに学習を続けるとこの能力が消えてしまうことがあります。この研究は、その能力を担う内部の通り道を突き止めて守ることで、能力を残せることを示しました。", "unverified": "大規模モデルでも同様に効くかは未確認。"}}, {"id": "pn28", "rank": 28, "field": "組織行動・心理的安全性", "headline": "マッキンゼーの多様性研究への批判", "title": "The Business Case for Diversity – A Critique of McKinsey’s ‘Research’", "url": "https://doi.org/10.2139/ssrn.4500116", "authors": "Ian W Gardner", "venue": "SSRN", "date": "2026-10-30", "apa": "Gardner, I. W. (2026). The Business Case for Diversity – A Critique of McKinsey’s ‘Research’. https://doi.org/10.2139/ssrn.4500116", "why": "多様性が業績を高めるとする影響力のある一連の報告の方法を批判的に検討する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用", "preprint": true, "short": true, "p1": "指導層の多様性が企業業績を高めるという主張の根拠として広く引用されるマッキンゼーの3つの報告（2015・2018・2020年）を批判的に検討した（抄録）。", "p3": "報告のうち、コンサルタントが作ったデータセットの代表性を分析した（抄録）。", "p5": "データセットは報告が言及する国の上場企業全体を十分に代表しておらず、結論は信頼できず一般化できないと論じた（抄録）。", "fun": "「多様な経営陣の会社ほどもうかる」という話は、よく引用される調査報告に支えられてきました。この研究は、その報告が使った会社の選び方が偏っていたのではないかと指摘します。主張が正しいかどうかとは別に、根拠のデータが何を代表しているかを問う姿勢が面白い点です。", "unverified": "代表性の欠如の具体的な程度は未確認。"}}, {"id": "pn29", "rank": 29, "field": "経営学", "headline": "司法競売での免責表示の禁止と戦略的沈黙", "title": "Banning the Disclaimer: Strategic Silence in Judicial Housing Auctions", "url": "https://doi.org/10.2139/ssrn.7670079", "authors": "Maggie Hu ほか", "venue": "SSRN", "date": "2026-10-31", "apa": "Hu, M., Jin, G. Z., & Zhao, Y. (2026). Banning the Disclaimer: Strategic Silence in Judicial Housing Auctions. https://doi.org/10.2139/ssrn.7670079", "why": "責任の免責表示を禁じた規制が、売り手の情報開示をどう変えたかを調べる。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用", "preprint": true, "short": true, "p1": "責任の免責表示を禁じる規制が、表示が安い口約束なら積極的な表示へ、費用のかかる約束なら沈黙へ送り手を向かわせることを理論で示し、中国の司法競売で検証した（抄録）。", "p3": "2019年に裁判所が競売物件の明け渡しの責任を免責すると表示することを禁じた規則を使い、139万件の住宅の司法競売の掲載で、規則前の免責表示の使用度に基づく連続的な差の差を推定した（抄録）。", "p5": "禁止で消えた免責表示10件ごとに沈黙の告知が増えた（抄録）。増加の件数は抄録の切れた部分にあり未確認。", "fun": "「責任を負いません」と書くことを禁じれば、責任を持つようになるはずだ、というのが規制の狙いです。ところが実際には、何も書かない「沈黙」が増えたというのがこの研究の発見です。言わせないことと約束させることは違う、という点が面白いです。", "unverified": "沈黙の増加の大きさと価格への影響は未確認。"}}, {"id": "pn30", "rank": 30, "field": "人口学", "headline": "人口学における「クィア」の使われ方", "title": "On the Uses of “Queer” in Demography", "url": "https://doi.org/10.31235/osf.io/uspe8_v1", "authors": "Christopher Julian ほか", "venue": "SocArXiv", "date": "2026-10-30", "apa": "Julian, C., Pao, C., & Compton, D. (2026). On the Uses of “Queer” in Demography. https://doi.org/10.31235/osf.io/uspe8_v1", "why": "人口学で「クィア」という語がどう使われているかを整理する。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録を使用", "preprint": true, "short": true, "p1": "人口学で「クィア」という語がどう使われているかを、定義を固めるのではなく地図のように整理した（抄録）。", "p3": "家族研究の先例にならい、名詞（クィアな人々の人口学）、形容詞（クィアの認識論と結びついた人口学）、動詞（人口学をクィア化する）の3つの用法に分けて検討した（抄録）。", "p5": "数え上げと分類の伝統を持つ人口学に照らして各用法を読み、何が得られ何が失われるかを考えるよう呼びかけた（抄録）。", "fun": "人口学は、人を数えて分類することで発展してきた学問です。一方「クィア」という考え方は、決まった分類そのものを疑います。この2つが出会うと何が起きるのかを、言葉の使われ方から整理しているのがこの研究の面白い点です。", "unverified": "実証的な分析は含まれない（概念的な論考）。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "LLMの回答を少数の人間データで人に近づける", "title": "Frontiers: Reducing Disparity Between LLMs and Humans: Optimal LLM Sample Calibration", "url": "https://doi.org/10.1287/mksc.2024.0983", "authors": "Yan Leng ほか", "venue": "Marketing Science", "date": "2026-10-30", "sjr": 8.324, "citescore": 9.3, "citescore_year": "2025", "apa": "Leng, Y., Sang, Y., & Agarwal, A. (2026). Frontiers: Reducing Disparity Between LLMs and Humans: Optimal LLM Sample Calibration. Ma
