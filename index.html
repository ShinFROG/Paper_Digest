<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-10-28", "intro": "プレプリントの新着281件、学術誌の新着451件（うち上位10%誌300件）、重要論文の候補344件（プレプリント224件・学術誌120件）、オープンデータの候補116件から選びました。プレプリント・関連50報、プレプリント・注目50報、論文誌・関連50報、論文誌・注目50報、オープンデータ30件です。論文誌・注目は、注目誌の新着に材料科学・化学の論文が多かったため、上位10%誌の新着から注目分野に当たる論文で補いました。論文誌の両部には抄録のない論文が多く、16位以下に題名だけの論文が入っています。取得できなかった情報源はありません（上位10%誌の一覧の更新だけは取得できず、9月27日の一覧を使いました）。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "表面の凹凸から摩擦が生まれるDEMをNNで高速化", "title": "A neural accelerated surface-roughness-based Discrete Element Method (SR-DEM) for modeling granular systems", "url": "https://arxiv.org/abs/2610.33363", "authors": "Xiwei Pan ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Pan, X., & Li, L. (2026). A neural accelerated surface-roughness-based Discrete Element Method (SR-DEM) for modeling granular systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33363", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論§1、摩擦の回復§3.2–3.4、加速の評価§4.3–4.4、結論§5）と図のキャプションを読んだ。§2の接触計算の数式と§4.2のネットワーク構成は概略のみ", "preprint": true, "p1": "粒状体の離散要素法（DEM）で、クーロン型の摩擦則を与える代わりに粒子表面の凹凸（粗さ）を明示的に解像し、摩擦のない法線方向の接触の集まりから摩擦を生じさせる枠組みSR-DEMを2次元で提案した（抄録、§1）。未査読のプレプリントである。", "p2": "現在のDEMは接線剛性と摩擦係数を含む現象論的な摩擦則に依存し、粗い粒子からなる系では不十分なことがある。著者らは転がり摩擦などのパラメータを足すのでなく、摩擦を微小な接触の集団的な現象とみるトライボロジーの考え方を取り入れた（§1）。", "p3": "Level Set-DEMを基礎に、粒子の基本形状と表面の凹凸を2つの尺度で表し、凹凸は正弦波かフーリエ級数で振幅hと波長λを与える。パラメータは{kn, kt, μp}から{kn, h, λ}に替わり、単一の正弦波なら数は変わらない（§1、図1）。増える計算はFE²に似た2段階の接触計算、FiLMによる符号付き距離のニューラル代理モデル、GPUの並列化で抑えた（§4）。", "p4": "①斜面上のブロックの滑り試験で、滑り出しと実効摩擦係数を粗さと法線方向の減衰の有無の4通りで調べた（§3.2）。②1000粒子の柱の崩壊試験で安息角を従来のDEMと比べた（§3.3–3.4）。③200〜1600粒子で代理モデルの有無による計算時間を比べた（§4.4）。", "p5": "ブロックは勾配0.36と0.38の間で滑り出し、滑走時の実効摩擦係数は約0.24で、持続的な摩擦は粗さによる法線方向の運動と法線方向の減衰の組み合わせから生じた（§3.2、図7–8）。安息角はSR-DEMの17.61°が摩擦係数0.3の従来法の17.37°とよく一致し、従来法は摩擦係数を5.0まで上げても最大23.38°で頭打ちだったが、SR-DEMは28.00°に達した（§3.3–3.4、図11）。代理モデルの高速化は200粒子で約1.2倍、1600粒子で約1.6倍だった（§4.4）。", "p6": "検証は2次元に限られ、3次元への拡張が最も近い課題とされる。凹凸の弾性・塑性変形や付着・摩耗などの機構は扱っていない（§5）。著者は、凹凸がどこまで小さければ形状ではなく粗さとみなせるかは未解決だと述べる（§3.4）。解釈：粗さのパラメータと実在の粒子表面との対応は未検証で、安息角の一致も特定の設定での比較にとどまる。", "fun": "砂粒どうしの「すべりにくさ」は、コンピュータでは普通、摩擦係数という1つの数で与える。この研究はその数を使わず、粒の表面の細かなでこぼこを形として描き込み、でこぼこがぶつかり合うだけで摩擦が生まれることを示した。従来の方法では摩擦をいくら強くしても届かなかった28.00°の急な砂山まで再現できたのが面白い。", "unverified": "非円形粒子での結果、代理モデル単体の誤差の数値、§2の接触検出の詳細は読んでいない。"}}, {"id": "pr02", "rank": 2, "headline": "振動床で駆動される粒状単層のEnskog運動論", "title": "Synchronization-controlled transport near an absorbing transition: Effective Enskog kinetic theory of a driven granular monolayer", "url": "https://arxiv.org/abs/2610.35270", "authors": "David Gonz\\'alez M\\'endez ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Méndez, D. G., González, R. G., Maire, R., Garzó, V., & Pagonabarraga, I. (2026). Synchronization-controlled transport near an absorbing transition: Effective Enskog kinetic theory of a driven granular monolayer (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35270", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論§I、モデル§II、一様状態§III、輸送係数の例§V.4、考察§VI）と図のキャプションを読んだ。§IVと付録の導出は読んでいない", "preprint": true, "p1": "上下に振動する2枚の板の間に閉じ込めた粒子の単層について、板との同期が衝突によるエネルギーの注入を止める効果を取り入れたEnskog運動論を作り、粘性などの輸送係数を導いた理論論文（抄録、§I）。未査読のプレプリントである。", "p2": "振動板に挟まれた粒子は縦の運動のエネルギーを斜めの衝突で横の運動に移し、これを衝突ごとの速度の増分Δで表すΔモデルが使われてきた。衝突のない時間が長く板と同期した粒子では注入が止まり、不連続な吸収転移（運動が止まる状態への転移）が起こるため、この同期を輸送の理論に入れることが課題だった（§I、図1）。", "p3": "局所的な衝突頻度と同期時間の兼ね合いで決まる状態依存の実効的な衝突規則と、板との相互作用による粘性抵抗を入れたEnskog方程式を立て、一様な活動状態を基準にChapman–Enskog展開をナビエ–ストークスの次数まで行い、主要なSonine近似で輸送係数を求めた（抄録、§II–V）。", "p4": "理論を事象駆動の分子動力学（EDMD）シミュレーションと比べ、充填率を変える経路（反発係数0.95）と反発係数を変える経路（充填率0.10）で、定常温度、ずり粘性、体積粘性、熱伝導率などを評価した（§V.4、付録C）。", "p5": "同期がないと輸送係数は滑らかに変わるが、同期があると温度がゼロに落ちる不連続な転移で係数が急に跳んだ（§V.4）。理論は活動相の広い範囲で定常温度とずり・体積粘性をよく再現し、転移近くのずれは理論の温度をシミュレーションの温度に置き換えると大きく減った（§I、§V.4、図2）。", "p6": "転移の近くでは、注入の揺らぎや同期と衝突前の速度の相関を平均場で無視したことが主なずれの原因とされ、活動粒子の割合が徐々に減る連続的な吸収転移は理論の範囲外である（抄録、§VI）。解釈：結果は2次元の簡略化モデルとシミュレーションの比較に基づき、実験との直接の比較はまだない。", "fun": "振動する2枚の板に挟んだビーズは、縦に跳ねる勢いをぶつかり合いで横の動きに変え、気体のように動き回る。ところが、しばらく誰ともぶつからずに板の揺れとリズムがそろうと、ビーズは勢いをもらえなくなり、全体が急に止まってしまう。この研究は、その「リズムがそろう」効果を流れやすさの理論に組み込んだ。", "unverified": "輸送係数の式の具体形と、付録Bの平均場の評価の数値は確認していない。"}}, {"id": "pr03", "rank": 3, "headline": "人間由来の文脈効果はLLMで再現しなかった", "title": "Prospective tests find no robust human-inspired context effects in a large language model", "url": "https://doi.org/10.2139/ssrn.7664760", "authors": "Kento Sasano", "venue": "SSRN", "date": "2026-10-26", "apa": "Sasano, K. (2026). Prospective tests find no robust human-inspired context effects in a large language model. https://doi.org/10.2139/ssrn.7664760", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "人間の心理実験をまねた文脈の操作（偽の能力の主張、架空の服装、安全ベスト、承認ラベル、信頼できないと明示した誤答）がLLMの振る舞いを変えるかを、探索と事前に定めた確認を分けて検証し、頑健な効果は見つからなかったと報告した（抄録）。未査読のプレプリントである。", "p2": "人間の実験に着想を得た試験はLLMの規則性を示しうるが、印象的な探索的発見は新しい項目では再現しないことがある（抄録）。", "p3": "5つの仮説を6つの中核実験、計956回のAPI呼び出しで、1つのモデル識別子（gpt-5.6-terra、推論の努力は中に固定）について調べた。手順、課題の集合、分析規則、次の段階に進む基準は各実行の前にハッシュで固定し、4つの実験を探索、2つを新しい項目による事前指定の確認に使った（抄録）。", "p4": "各候補効果が、研究ごとに事前に定めた生き残りの基準（効果の閾値）を新しい項目で満たすかで判定した。課題の種類と言い回しによる分析も行った（抄録）。", "p5": "5つの候補の大きな効果は、いずれも事前の基準を満たさなかった（抄録）。探索的な予備実験での画家の上着の9.375ポイントの優位は、より大きな新しい試験で−3.333ポイントに逆転し、事後に見つけた候補の有無による23.333ポイントの正答率の差は、正しい候補の対照を加えた新しい設計では5ポイントの差にとどまった（後者は操作化が変わったため記述的な比較）（抄録）。", "p6": "著者は、失敗は効果がゼロであることを示さず、いくつかの区間は広く、検証は1つの商用APIの設定での狭いプロンプトの類推に限られると述べる（抄録）。脆い効果がLLM全般に多いことも、人間に着想を得た文脈効果が一般に存在しないことも示さないとする（抄録）。", "fun": "「安全ベストを着ている」とAIに伝えると、AIの答え方は変わるのだろうか。この研究は、人間の心理実験をまねた試験で一度見つかった面白い効果が、新しい問題で確かめ直すと消えたり逆転したりすることを示した。9.375ポイントの差が、確かめ直すと−3.333ポイントになった。", "unverified": "本文を読んでいないため、各実験の項目数、区間の幅、課題の種類ごとの結果は未確認。"}}, {"id": "pr04", "rank": 4, "headline": "LLMの意味的事前分布で少数回答のCFAを補う", "title": "When Respondents Are Scarce: LLM-Derived Semantic Priors for Bayesian Confirmatory Factor Analysis", "url": "https://arxiv.org/abs/2610.34843", "authors": "Shaohuai Feng ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Feng, S., Shafiei, M. W. M., Shafie, M. S., & Tian, S. (2026). When Respondents Are Scarce: LLM-Derived Semantic Priors for Bayesian Confirmatory Factor Analysis (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34843", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、事前分布の作り方§3.3–3.5、結果§4.2.4–4.2.7、結論§5）を読んだ。PDFからの抽出のため数式の一部は読めなかった", "preprint": true, "p1": "回答者が少ない調査で質問紙の因子構造を推定するため、LLMによる項目の言い換えと埋め込みから得た意味の構造を、ベイズ確証的因子分析（CFA）の事前分布に変える枠組みSEUFを提案した（抄録、§1）。未査読のプレプリントである。", "p2": "対象の集団が小さく接触しにくいと回答者を増やせず、因子構造の推定に使えるデータが限られる。項目の文言はデータを集める前から構造の手がかりを含むが、それが経験的な検証に代わることなく小標本の推定を改善できるかは不明だった（抄録、§1）。", "p3": "言い換えで文言の影響を抑えた項目間の類似度行列に主軸因子法を当て、研究者が仮定した項目と因子の対応にプロクラステス回転でそろえ、データを使わない固定の較正で負荷量の事前分布（標準偏差0.15）に変えた。事前分布は推定前にハッシュで固定した（§3.3–3.4）。", "p4": "工業団地の利害関係者617人の38項目の調査（CRAEIP）と公開調査のFEVS、RIASECで、50〜617人の部分標本を各20回引き、意味の事前分布を使うモデルと弱い事前分布の従来のCFAを、負荷量の事後標準偏差（精度）、全標本の推定値との誤差、信用区間の被覆率で比べた（抄録、§3.5）。", "p5": "文言の影響を統制しても3つの調査すべてで意味の構造が残った（抄録、§5）。50人のときSEUFは従来のCFAの約72人（CRAEIP）、70人（FEVS）、82人（RIASEC）に相当する精度に達し、回答者の約31%、29%、39%の節約に当たった（§4.2.7）。公開調査では負荷量の誤差も小さく、改善は回答が少ないほど大きかった（抄録、§4.2.7）。", "p6": "著者は、言い換えと埋め込みのモデルが各1つで較正の定数も経験的に固定したこと、信頼性の改善は負荷量より小さいこと、区間の被覆率が両モデルとも名目の95%を下回ったこと、正解を全標本の推定値で代用し効率の分析が事後的なことを限界に挙げる（§4.2.7、§5）。LLMや意味の類似度は回答データと構成概念の検証に代わらないとする（§5）。", "fun": "アンケートの質問文には、答えを集める前から「どの質問が同じことを聞いているか」のヒントが含まれている。この研究は、AIに質問文を読ませてそのヒントを取り出し、統計の計算の出発点に使った。すると50人の回答で、ふつうなら70〜82人分が必要な精度が得られた。", "unverified": "意味の整合の寄与を切り分けた分析（§4.2.6）と項目レベルの更新（§3.6）の結果は読んでいない。"}}, {"id": "pr05", "rank": 5, "headline": "エネルギー型PINNで杭式桟橋の損傷を逆解析", "title": "A Physics-Informed Neural Network Framework for Forward and Inverse Analysis of Pile-Supported Wharves", "url": "https://doi.org/10.2139/ssrn.7675404", "authors": "Liu Xiaoyu ほか", "venue": "SSRN", "date": "2026-10-27", "apa": "Xiaoyu, L., Tianping, L., Xinxing, Z., Jun, X., & Jingjing, L. (2026). A Physics-Informed Neural Network Framework for Forward and Inverse Analysis of Pile-Supported Wharves. https://doi.org/10.2139/ssrn.7675404", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "桟橋（杭で支えた岸壁）の構造デジタルツインに向け、領域分割したエネルギー型の物理情報ニューラルネットワーク（PINN）で、順解析と損傷の逆同定を行う枠組みを提案した（抄録）。未査読のプレプリントである。", "p2": "海の厳しい環境で劣化しやすい桟橋では、従来の有限要素解析はデータ同化を伴う実時間の計算に向かず、大規模な構造へのPINNはスペクトルバイアス、強形式の滑らかさの要求、自動微分の負担に制約される（抄録）。", "p3": "隠れ層1層のネットワーク、解析的に微分できる3次エルミート補間、弱形式のポテンシャルエネルギーの損失関数を使い、特定の設定では離散解の空間がRitz–Galerkinの有限要素と一致するが、全体剛性行列の組み立ては不要とした（抄録）。逆問題はTikhonov正則化の2層最適化で1段階の逆解析を行い、2つのネットワークの時間結合で増分の計測から損傷の進展を追った（抄録）。", "p4": "8本杭の桟橋の3つの損傷状態（D=0、0.25、0.50）でANSYSと比べて順解析を検証し、逆同定は3つの計測の構成について、ノイズなしと5%のピークノイズのもとで調べた（抄録）。", "p5": "順解析の最大相対誤差は2.3%未満だった（抄録）。全域のひずみ計測ではピーク誤差が5%未満で、まばらなたわみ計測は損傷の位置は特定できたが程度を過小評価し、たわみとひずみを組み合わせた粗から細への2段階の計測は、たわみだけの場合よりピーク誤差を半減させた（抄録）。", "p6": "検証は8本杭の数値モデルでの比較で、実構造の計測データでの検証は抄録にない（未確認）。解釈：損傷は数値モデル上の劣化として与えられており、実際の腐食などとの対応や、ほかの構造形式への適用性は本文で確認が必要である。", "fun": "海に立つ桟橋の杭は、塩水で少しずつ傷んでいく。この研究は、構造の力学の法則を組み込んだAIで桟橋の変形を計算し、逆に測ったひずみから傷んだ場所と程度を推定できるようにした。ひずみを構造全体で測れば、推定の誤差は5%未満に収まった。", "unverified": "本文を読んでいないため、損傷の表し方、計算時間、ノイズありの場合の個別の誤差は未確認。"}}, {"id": "pr06", "rank": 6, "headline": "多エージェントLLMの系全体の不確実性を推定", "title": "UMAS: System-Level Uncertainty Quantification for Multi-Agent LLM Systems", "url": "https://arxiv.org/abs/2610.33013", "authors": "Hanwen Li ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Li, H., Duan, J., Shi, X., Zhang, Y., Chen, T., Xu, K., & Yuan, C. (2026). UMAS: System-Level Uncertainty Quantification for Multi-Agent LLM Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33013", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、方法§4、実験§5、結論§6、限界の付録A）と図表のキャプションを読んだ", "preprint": true, "p1": "複数のLLMエージェントが議論して答えを出すマルチエージェントシステム（MAS）で、答えの不確かさを、やりとり全体の構造を使って追加の推論なしに見積もる枠組みUMASを提案した（抄録、§1）。未査読のプレプリントである。", "p2": "MASは単独のLLMより正答率を上げることが多いが、最終出力だけに通常の不確かさの定量化（UQ）を当てると信頼性がかえって下がる。また多くのUQは複数回の生成を要し、すでに推論の費用が大きいMASには高価である（§1、図1）。", "p3": "各ラウンドの各エージェントの応答に生成確率からノードの確信度を与え、仲間の応答の確信度から影響の信頼性を見積もって、信頼できない仲間に引きずられないよう確信度の更新を調整し、やりとりのグラフ全体でシステムの不確かさに集約した（§1、§4）。追加のパラメータも推論も要らない（抄録）。", "p4": "Debate（討論）とDyLANの2つの方式、GPT-4o miniとLlama 4 Scoutの2つのモデル、MMLU-ProやAQUA-RATなど5つの課題（各200問）で既存のUQとAUROCを比べ、誤答の検出と、5本の応答から不確かさが最小のものを選ぶ選択も評価した（§1、§5）。", "p5": "各設定の最良の既存手法に比べ、AUROCは平均10.54ポイント高かった（抄録、§1）。Llama 4 Scoutでは最良の既存手法の63.00に対し、集約だけの版が70.32、信頼性による更新を加えた版が74.93で、改善の主因は集約だった（§5.2、表1）。応答の選択では正答率が5.5〜12.6ポイント上がった（§5.3、表2）。", "p6": "著者は、トークンの確率が必要で文字だけを返すAPIには使いにくいこと、協調的な方式だけを評価し敵対的な方式は未検討なこと、全員が自信を持って同じ誤りをすると仲間の信頼性の信号では捉えられないことを限界に挙げる（付録A）。", "fun": "AIたちが話し合って答えを出すと、一人で考えるより正解は増える。でも「その答えをどれだけ信じてよいか」は、かえって分かりにくくなる。この研究は、話し合いの途中で誰の自信に引っ張られたかまでたどって答えの危うさを見積もり、最も危うくない答えを選ぶと正答率が最大12.6ポイント上がった。", "unverified": "信頼性の重みの具体的な式と、計算時間の比較（表4）の数値は確認していない。"}}, {"id": "pr07", "rank": 7, "headline": "LLMエージェント社会で金融詐欺経済を再現", "title": "FraudSociety: A Generative Agent-Based Society for the Financial-Fraud Economy", "url": "https://arxiv.org/abs/2610.33536", "authors": "Keyang Chen ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Chen, K., Jiang, M., Li, Z., Zhao, Y., Wang, Y., Zhang, Q., Qi, S., Liu, Y., Li, Z., Liu, S., Jing, Y., Ye, G., & Chai, H. (2026). FraudSociety: A Generative Agent-Based Society for the Financial-Fraud Economy (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33536", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、設計§3、実験§4.1–4.3、結論§5）と図表のキャプションを読んだ。付録の詳細は読んでいない", "preprint": true, "p1": "金融詐欺の被害を、情報の流れ（接触・会話）とお金の流れ（支払い・損失）を結びつけて模擬するLLMエージェントの社会シミュレータFraudSocietyを作った（抄録、§1）。未査読のプレプリントである。", "p2": "米国の金融詐欺の損失は2025年に159億ドルを超えた（FTCの統計）が、既存のシミュレータは情報と金融の片方しか扱わず、詐欺が実際にどう進むかを捉えられていない（抄録）。", "p3": "市民は欲求–意図–行動（NIA）の循環でプロフィールや社会的な履歴、金融の記録に基づいて判断し、詐欺師はやりとりと台帳の状態に合わせて連絡と金銭の行動を変え、社会の世界と金融の世界を1時間ごとに更新する閉じたループにした（抄録、§3.1）。市民112人、詐欺師8人、詐欺の企て8件を480時間分、すべてQwen3-14Bで動かした（§4）。", "p4": "①FTCの4つの定型的な事実（損失の裾の重さ、年齢別の損失など）との距離QDで既存の2つのシミュレータと比べ、②被害に至る経路と損失の集中を調べ、③5つの警告策を警告なしと比べた（§4）。", "p5": "QDは既存のシミュレータより小さく、損失のある被害者63人は全員、最初の送金の前に企てとの接触と私信を経ており、上位10%の記録が損失の81.1%を占めた（カナダの統計では75.2%）（§4.1–4.2）。NIAや台帳を外すとQDが悪化した（§4.2）。最初の支払いの直後にLLMで個別化した警告を出すと、支払いは623件から117件に、繰り返しの支払いの割合は49.4%から10.9%に減った（§4.3）。", "p6": "規模は市民112人・単一のモデル・単一の乱数の種で、最も効いた個別化の警告は、詐欺を正確に知っている前提の理想化された条件である（§4、§4.3）。解釈：統計の形が合うことは個々の判断の現実性を保証せず、実際の介入の効果を予測するには現実のデータでの検証が必要である。", "fun": "SNSで知らない人から甘い話が届き、少しずつお金を送ってしまう。この研究は、そんな詐欺の流れを、AIが演じる市民と詐欺師の小さな社会で再現した。被害は一部の人に集中し、上位10%の記録が損失の81.1%を占めた。最初の送金の直後に一人ひとりに合わせた警告を出すと、繰り返しの送金が大きく減った。", "unverified": "QDの各成分の値と既存シミュレータとの差、警告策C1〜C4の詳しい比較は一部しか確認していない。"}}, {"id": "pr08", "rank": 8, "headline": "LLMによる内容分析は高得点でも不安定", "title": "High Scores, Hidden Failures: Evaluating Codebook-Based LLM Content Analysis", "url": "https://arxiv.org/abs/2610.35179", "authors": "Elena Senger ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Senger, E., Campbell, Y., van der Goot, R., & Plank, B. (2026). High Scores, Hidden Failures: Evaluating Codebook-Based LLM Content Analysis (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35179", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、データと設定§3、推論時の失敗§4、最適化の失敗§5、結論§7、限界）を読んだ。付録は読んでいない", "preprint": true, "p1": "社会科学の内容分析で、コードブック（概念をラベルの規則に落とした手引き）に従ってLLMに文章を分類させる手順を4つのデータと5つのモデルで体系的に検査し、標準の指標では見えない失敗を明らかにした（抄録、§1）。未査読のプレプリントである。", "p2": "先行研究はLLMによるコーディングの高い予測性能を報告してきたが、信頼でき頑健な注釈を生むかは不明で、プロンプト設計の指針も食い違っていた（抄録、§4.2）。", "p3": "米国の抗議行動（CCC）、最低賃金、新たに公開した価値創造（科学論文とニュース）の4つのデータで、主にMistral-7B（温度0.3）を使い、ラベル名の置き換え、コードブックの簡略化、10回の繰り返し実行、分野の移転、コードブックの自動最適化（FULL、APO、SCALE）の影響を調べ、GPT-4o-miniやDeepSeek-V3など5モデルも比べた（§3–5）。", "p4": "正解率やmicro-F1に加え、最も悪いラベルのF1、macro-F1、適合率、実行間のばらつき、最適化したコードブックへの専門家2人の評価、API呼び出しの回数で評価した（§4–5）。", "p5": "最悪のラベルのF1はmicro-F1より26〜30ポイント低く、ラベルを擬似的な名前に替えると性能が大きく落ち、モデルが定義よりラベル名に頼ることが示された（§4.1–4.2）。ニュースへの移転ではmicro-F1が44.89から62.22に上がったのに、全ラベルを当てた例は0件だった（§4.2、表3）。例を加える最適化は全体の指標を上げつつ最悪のラベルのF1を5.67と11.32に下げ、APOは113,200回の呼び出しを要しても一貫して勝らなかった（§5）。", "p6": "著者は、データ・コードブック・モデルの構成が少なく他の分野や言語に一般化できない可能性があることと、最適化の評価が専門家2人だけであることを限界に挙げる（Limitations）。解釈：結論は、高い全体スコアだけでLLMのコーディングを測定の道具として信頼してはならないということで、ラベルごとの検証が欠かせない。", "fun": "AIに大量の文章を分類させると、全体の正解率は高く見える。でもこの研究では、数の少ない種類ほど見落とされ、その成績は全体の点数より26〜30ポイントも低かった。さらに、ラベルの名前を「ラベル1」などに替えるだけで成績が大きく落ち、AIが説明書の定義より名前の印象で判断していることも分かった。", "unverified": "第6節の最小限の検証手順の具体的な項目と、5モデルの比較の数値は確認していない。"}}, {"id": "pr09", "rank": 9, "headline": "配達アプリの約束が満足を下げる期待の罠", "title": "The Expectation Trap in Errand Delivery: How Pre-usage Value Anticipation Shapes the Service Experience and Customer Satisfaction", "url": "https://doi.org/10.21203/rs.3.rs-10842436/v1", "authors": "Yanfeng Liu ほか", "venue": "Research Square (In Review)", "date": "2026-10-27", "apa": "Liu, Y., Gao, X., Qi, G., & Lee, J. (2026). The Expectation Trap in Errand Delivery: How Pre-usage Value Anticipation Shapes the Service Experience and Customer Satisfaction. https://doi.org/10.21203/rs.3.rs-10842436/v1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "本文", "basis_note": "Research Squareの本文（理論§2、方法§3、結果§4.2–4.4、考察§5、限界§6.4）を読んだ", "preprint": true, "p1": "オンデマンドの代行配達で、アルゴリズムが示す到着の見込みなどの約束が作る事前の期待が、見えないサービスの体験と満足をどう形づくるかを、期待確認理論を拡張して調べた（抄録）。Research Squareに掲載された未査読のプレプリントである。", "p2": "代行配達はサービスの過程が見えにくく、顧客は実際の働きぶりを観察して期待と比べることができない。従来の期待確認理論は1次元の構成概念で、外から与えられた期待の基準が満足に与える影響を十分に説明していなかった（抄録、§2）。", "p3": "期待と成果を、予期した消費価値（ACV）と実現した体験価値（REV）に置き換え、自己決定理論の内発的動機と技術受容性（革新性・楽観性）を調整変数に加えたモデルを、構造方程式モデリングと潜在調整（LMS）で推定した（抄録、§3.1）。広州の利用者に2時点の調査を行い、1,176人を分析した（§3.2）。", "p4": "利用前（第1波）に予期した価値と期待の基準を、利用後（第2波）に体験価値と満足を7段階で測り、媒介の分解と、内発的動機×革新性・楽観性の3次の交互作用を検定した（§3.1–3.2、§4.3–4.4）。", "p5": "過程が見えないとき、顧客は観察した成果と比べるのでなく、予期した価値を投影して体験価値を作っていた（抄録）。期待の基準から満足への直接効果は負（標準化係数−0.20）で、正の間接効果の合計0.049を上回り、総効果は−0.152と負になった（「期待の罠」）（§4.2–4.3）。内発的動機は体験価値の予期への固定を弱め、その効果を革新性と楽観性が異なる経路で強めた（抄録）。", "p6": "著者は、広州1都市の調査で一般化に限りがあること、2時点の調査が特定の1回の配達に結びついておらず予期から体験への経路は一般的な価値の枠組みとして解釈すべきこと、価値の5次元のうち3つだけを扱ったことなどを限界に挙げる（§6.4）。解釈：時刻を幅で示せば罠を和らげられるという提案は調査結果からの示唆で、表示を変える実験では確かめていない。", "fun": "配達アプリがぴったりの到着時刻を約束すると、客の期待は高くなる。この研究では、そうした厳密な約束が、ほかの良い効果を打ち消すほど満足を下げていた。中身が見えないサービスでは、客は実際の働きより「期待していた姿」で体験を判断してしまうらしい。著者らは、時刻を1点でなく幅で示す方が良いと提案している。", "unverified": "各仮説の係数の多く（表3）と、頑健性の検討（§4.5）の詳細は確認していない。"}}, {"id": "pr10", "rank": 10, "headline": "移転後の孤独がつながりとwell-beingを媒介", "title": "When Loneliness Costs More: Life Course, Community Ties and Wellbeing after Managed Retreat", "url": "https://doi.org/10.21203/rs.3.rs-11423990/v1", "authors": "Thoa Hoang", "venue": "Research Square (In Review)", "date": "2026-10-27", "apa": "Hoang, T. (2026). When Loneliness Costs More: Life Course, Community Ties and Wellbeing after Managed Retreat. https://doi.org/10.21203/rs.3.rs-11423990/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research SquareのPDF本文（データ§3.2、分析§3.4、結果§4、限界§5.5）を読んだ", "preprint": true, "p1": "自然災害の危険がある土地から住民を移す「計画的撤退」の後、地域のつながりの弱まりが孤独を通じて情緒的な幸福を下げるかと、その影響を強く受ける人を、ニュージーランド・クライストチャーチの調査で調べた（抄録、§1）。Research Squareに掲載された未査読のプレプリントである。", "p2": "計画的撤退は人々を危険な場所から遠ざけるが、幸福への影響は一様でなく、その仕組みはよく分かっていない（抄録）。", "p3": "2010〜2011年の地震の後、住宅用レッドゾーンの制度で移転した元所有者2,230人（受諾者7,724人の29%）への2015年の政府調査を使い、20組の多重代入と因果媒介分析で、つながり→孤独→WHO-5（幸福の指標）の経路と、年齢・18歳未満の子育てによる調整を推定した（§3.2–3.4）。", "p4": "つながりが16パーセンタイルから84パーセンタイルに強まったときの幸福の差のうち孤独を通る割合を測り、経路の前半（つながり→孤独）と後半（孤独→幸福）のどちらで人による差が出るかを、年齢と子育ての両方を入れたモデルで切り分けた（§3.4、§4）。", "p5": "孤独はつながりと幸福の関連の約5分の2（41.3%、95%信頼区間27.9〜58.0%）を媒介した（§4.1）。つながりが弱いと孤独が強まるのは全員で同程度だったが、孤独による幸福の低下は18歳未満の子を育てていない人に集中し（傾き−0.192、子育て中は−0.031）、年齢差に見えたものは主に子育ての段階の差だった（§4.2–4.3）。緩衝は主に12〜17歳の子の親に見られた（§4.4）。", "p6": "著者は、データが横断的で因果推定ではないこと、子育てによる緩衝の分析は後から加えた探索的なものであること、65歳以上で子育て中の人が14人しかいないこと、回答者の94.8%がヨーロッパ系であることを限界に挙げる（§5.5）。", "fun": "大地震のあと、危険な土地から街ごと引っ越した人たちは、近所づきあいを失って孤独になりやすい。ニュージーランドの2,230人を調べると、孤独が心の元気を奪う度合いは、18歳未満の子を育てている人ではほとんどゼロだった。なぜ子育てが寂しさの影響をやわらげるのか、著者らはいくつかの説明を論じている。", "unverified": "子育てによる緩衝の理由の議論（§5.2）と政策的な含意（§5.4）は読んでいない。"}}, {"id": "pr11", "rank": 11, "headline": "管理統制の型が従業員の生成AI利用を左右", "title": "How Management Control Mechanisms Shape Employee Use of Generative AI", "url": "https://doi.org/10.2139/ssrn.7672384", "authors": "Loris Has ほか", "venue": "SSRN", "date": "2026-10-26", "apa": "Has, L., van Triest, S., & O’Dwyer, B. (2026). How Management Control Mechanisms Shape Employee Use of Generative AI. https://doi.org/10.2139/ssrn.7672384", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "職場で従業員が生成AIをどれだけ使うかを、管理統制の仕組み（成果・行動・人事・文化の統制）が左右するかを、従業員と上司の対の調査で調べた（抄録）。未査読のプレプリントである。", "p2": "生成AIは生産性の利点が大きく手軽に使えるのに、従業員による利用の度合いは大きく異なる（抄録）。", "p3": "著者らは、生成AIを多く使うには目先の成果と競合する時間の投資が要り、どの作業に役立つか予測しにくいため作業の流れに不確実性を持ち込むので、従業員にとって費用がかかると論じ、統制の種類がその費用を従業員が負うかどうかを決めると仮説を立てた（抄録）。", "p4": "従業員と上司を対応させた127組の調査で、統制の種類と従業員の生成AIの利用の関連を推定し、成果を測りやすい仕事かどうかで分けた分析も行った（抄録）。", "p5": "成果の統制と行動の統制は利用と負に、人事の統制は正に関連し、文化の統制との関連は見られなかった（抄録）。成果の統制と利用の負の関係は、成果を測りやすい仕事の従業員に集中していた（抄録）。", "p6": "解釈：127組という小規模な横断調査での関連であり、統制が利用を変えるという因果は特定されていない。業種や職種の構成、利用の測り方は抄録にない（未確認）。", "fun": "会社で生成AIを使いこなす人と使わない人の差は、本人のやる気だけで決まるのだろうか。127組の社員と上司を調べると、成果の数字で厳しく管理される職場ほどAIの利用が少なく、人を育てて任せる職場ほど多かった。新しい道具を試す時間とゆとりを、管理の仕方が左右しているらしい。", "unverified": "本文を読んでいないため、対象の企業・職種、利用の尺度、統制の測り方は未確認。"}}, {"id": "pr12", "rank": 12, "headline": "社会的影響で耐震投資の優先順位が変わる", "title": "Integrating System-Level Impacts into Seismic Risk Assessment Reshapes Investment Priorities for More Resilient and Sustainable Cities", "url": "https://doi.org/10.21203/rs.3.rs-11050858/v1", "authors": "Chenbo Wang ほか", "venue": "Research Square (In Review)", "date": "2026-10-27", "apa": "Wang, C., Campiche, A., Caterino, N., Galasso, C., & Occhiuzzi, A. (2026). Integrating System-Level Impacts into Seismic Risk Assessment Reshapes Investment Priorities for More Resilient and Sustainable Cities. https://doi.org/10.21203/rs.3.rs-11050858/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "本文", "basis_note": "Research SquareのPDF本文（序論、結果、考察）と図表のキャプションを読んだ。方法の節は概略のみ", "preprint": true, "p1": "地域の地震リスク評価に、住宅・交通・教育・医療の相互依存する系の社会的影響を組み込み、目標の影響削減を最小の補強の努力で達成する投資の優先順位を求める枠組みを作り、イタリア南部のアヴェッリーノ県に適用した（抄録）。Research Squareに掲載された未査読のプレプリントである。", "p2": "地域の地震リスク評価は物理的な被害や直接の経済損失を優先しがちで、限られた対策の資源をどう配分するかの指針が乏しい（抄録）。", "p3": "住宅の復旧時間、橋の被害、当初の避難、長期の避難、対面教育を失う生徒、医療へのアクセスの低下の6つの指標を、系全体の総量と資産・利用者当たりの平均の2つの見方で評価し、等しい重みで合成した（結果、表1）。住宅・橋・学校・病院にまたがる約20万通りの対策から、目標の削減率αごとに最小の努力の戦略を選んだ（抄録）。", "p4": "118の市町村からなる県で、モーメントマグニチュード5.0と6.9の代表的な地震シナリオの下、地盤の揺れと影響の多数の実現値を平均して評価した（結果、図2）。", "p5": "中程度の目標までは住宅の耐震補強が最優先で、その後は橋の補強が主な削減源になり、学校はαが0.91〜0.94の最も高い目標でのみ加わった（結果、図6）。橋の補強の価値は橋の被害そのものより、病院へのアクセスを支える道路のつながりを保つことから生じた（抄録、考察）。順序は2つの見方で同じで、橋が加わる閾値だけが総量で0.59、平均で0.68と異なった（考察）。", "p6": "著者は、揺れなどの偶然的なばらつきは扱ったが、被害・帰結のモデル、アクセスの仮定、指標の重みの不確かさは最適化に伝えていないこと、補強の努力を件数で近似し資産ごとの費用の違いを反映していないことを限界に挙げる（考察）。病院の補強が選ばれないのは、3つの公立病院のうち1つしか対象にならないためとする（結果）。", "fun": "地震への備えというと、まず家や橋が壊れないようにすることを考える。この研究はイタリアの県で約20万通りの対策を比べ、橋を補強する一番の価値は、橋そのものより「病院へ行く道」を守ることにあると示した。壊れ方だけでなく暮らしへのつながりまで見ると、お金の使い道の順番が変わる。", "unverified": "被害・帰結の各モデルの詳細と、6つの指標ごとの削減量は確認していない。"}}, {"id": "pr13", "rank": 13, "headline": "実データで作るサイバー社会エージェントの模擬", "title": "LLM-Augmented Agent-Based Simulation of Cyber Social Agents", "url": "https://arxiv.org/abs/2610.32988", "authors": "Lynnette Hui Xian Ng ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Ng, L. H. X., & Carley, K. M. (2026). LLM-Augmented Agent-Based Simulation of Cyber Social Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32988", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（原型§3、シミュレーション設計§4、事例と結果§5、考察§6）と表2を読んだ", "preprint": true, "p1": "SNSのボットを悪意ある自動化としてだけでなく、戦術と話し方で特徴づけた16の原型を持つ「サイバー社会エージェント（CSA）」として捉え、LLMで動くエージェントベースの社会シミュレーションに組み込んだ（抄録、§3）。未査読のプレプリントである。", "p2": "ボットは検出・削除すべき悪意ある自動化として描かれがちだが、実際の自動化は建設的なものも含めて多様な役割と話法を持つ。著者らは規則ベースのエージェントモデルとLLMによるシミュレーションの間をつなぐことを目指した（抄録）。", "p3": "名前・国籍・話題・コミュニティ・口調などの人物設定と、リーダーの有無や行動の割り当てを持つエージェントを作り、コミュニティ内の優先的選択やリーダーへの接続を混ぜて初期ネットワークを生成し、確率的な活動の規則とLLMの投稿文生成で動かした（§4）。架空の作曲コンテストをめぐるX上の対立のシナリオで、手作業の人間110人とCSA 107体から人間219,854人とCSA 94,173体に増やし、30日間を模擬した（§5）。", "p4": "全体の交流ネットワークと個々のエゴネットワークの構造を観察し、2020〜2021年のコロナ禍の1年分のツイートから得た定型的な事実と、原型ごとの行動を比べる表面的な妥当性の確認を行った（§5.1）。", "p5": "CSAは最初ネットワークの中心に集まり、時間とともに全体に広がり、30日で大きなクラスターと多様な話題が現れた（§5.1、§6）。CSAのエゴネットワークは中心化し、人間はより局所的な構造を持った（§5.1）。一般的なCSAと人間の投稿の比は2.01（定型的事実は2倍）など、多くの指標が経験的な事実と合った（表2）。", "p6": "著者は、活動を確率的な規則で近似し注意や疲労などの認知的要因を省いたこと、固定したネットワークの閉じた系で、つながりの消滅や外部の出来事を扱わないことを仮定として挙げる（§6）。解釈：検証は主に表面的な妥当性の確認で、架空のシナリオでの結果であり、現実の情報拡散を予測する力は確かめられていない。", "fun": "SNSの「ボット」というと悪者のイメージが強いが、ニュースを届けるもの、事実を確かめるもの、騒ぎを大きくするものなど、いろいろな種類がある。この研究は16種類のボットの性格をAIに演じさせ、人間219,854人とボット94,173体が暮らす仮想のSNSを30日間動かして、ボットが会話の網の目にどう広がるかを観察した。", "unverified": "16の原型それぞれの定義の詳細と、ネットワーク密度の具体的な値は確認していない。"}}, {"id": "pr14", "rank": 14, "headline": "ガウス過程の状態空間で履歴依存の構成則を学習", "title": "A Gaussian Process State Space Formulation for Materials Constitutive Modeling: Application to Quasi-brittle Materials", "url": "https://arxiv.org/abs/2610.33175", "authors": "Houlin Xu ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Xu, H., Li, C., Ramesh, K. T., & Shields, M. D. (2026). A Gaussian Process State Space Formulation for Materials Constitutive Modeling: Application to Quasi-brittle Materials (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33175", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、定式化§3–4、結果§6、考察と限界§7、結論§8）と図のキャプションを読んだ。§5の学習手順と付録は概略のみ", "preprint": true, "p1": "コンクリートのような準脆性材料の構成モデルで、損傷や塑性ひずみなどの決め打ちの内部変数の代わりに、観測できる応力–ひずみの履歴から学ぶ潜在状態を使うガウス過程状態空間モデル（GP-SSM）を提案した（抄録、§1）。未査読のプレプリントである。", "p2": "履歴に依存する材料の構成モデルは、観測できない現象論的な内部変数を固定の関数形に埋め込むため、観測に合わせる柔軟性に欠け、較正が一意に決まらないことがあり、不確かさの評価も難しい（抄録、§2.4）。", "p3": "潜在変数の発展を現在の応力の不変量と等価ひずみの増分で駆動して不可逆で圧力に敏感な履歴を表し、疎な多出力GPで潜在状態とひずみテンソルを6成分の応力に写し、変分推論で学習した（抄録、§4）。学習済みモデルはユーザー材料サブルーチンとしてAbaqus/Explicitに組み込んだ（抄録）。", "p4": "KCCモデルで作った三軸圧縮の合成履歴20本（訓練12本、検証5本、試験3本、拘束圧2〜40 MPa）で学習し、KCCの内部変数は正解に使わなかった。①閉ループの全履歴の再現、②拘束圧が変わる1要素、③除荷・再載荷、④430要素の円柱構造でKCCモデルと比べた（§6）。", "p5": "閉ループでの応力の誤差（RMSE）は検証で1.86〜4.04 MPa、試験で1.73〜3.20 MPaで、拘束の高い26・28 MPaで最もよく合い、低拘束で誤差が大きかった（§6.1）。構造の例では最大荷重がKCCより1.4%高く、変位25 mmでの反力は4.3%低く、変形の集中する範囲は同じだった（§6.4）。", "p6": "著者は、陽解法のため低拘束では数値的に不安定になりやすく訓練データも中〜高拘束が対象だったこと、除荷の規則は学習していない最小限のもので、ヒステリシスやひび割れによる剛性低下を表さないことを限界に挙げる（§7.3）。解釈：検証は元のKCCモデルの合成データとの比較で、実験データでの検証はまだない。", "fun": "コンクリートが押しつぶされるときの振る舞いは、ふつう「見えない傷み具合」を表す変数を人が決めた式で計算する。この研究は、その変数をAIに測定データから自分で見つけさせ、予測の確からしさの幅も示せるようにした。市販の構造解析ソフトに組み込んでも、最大荷重を1.4%の差で再現できた。", "unverified": "潜在状態の次元と各変数の物理的な解釈（§7.1）の詳細は確認していない。"}}, {"id": "pr15", "rank": 15, "headline": "3次元ITM-FEMで地盤振動対策を高速評価", "title": "A parallelized 3D coupled integral transform-finite element method for embedded structures in a layered elastic half-space", "url": "https://doi.org/10.2139/ssrn.7675171", "authors": "Tom Hicks ほか", "venue": "SSRN", "date": "2026-10-27", "apa": "Hicks, T., & Müller, G. (2026). A parallelized 3D coupled integral transform-finite element method for embedded structures in a layered elastic half-space. https://doi.org/10.2139/ssrn.7675171", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録（候補の収集時に取得）を使用", "preprint": true, "p1": "層状の地盤に埋め込まれた構造物の動的な地盤–構造物相互作用を効率よく計算するため、並列化した3次元の積分変換–有限要素連成法（ITM-FEM）を提案した（抄録）。未査読のプレプリントである。", "p2": "地盤振動の予測と対策の評価には計算効率の良い相互作用のモデルが要るが、完全な3次元の定式化は計算が重く、効率的な2.5次元の方法は軸方向に一様な構成に限られる（抄録）。", "p3": "2.5次元法の波数による分離を周方向に応用し、解析的に解ける半無限空間（フーリエ–ハンケル変換）と、球形の空洞を持つ全空間（フーリエ–ルジャンドル変換）の2つの部分系を重ね合わせ、空洞の境界で有限要素法と連成した。共通の周方向座標により、フーリエの次数ごとに独立に並列で計算できる（抄録）。", "p4": "半解析的な半無限空間の解と比べて検証し、共振器を並べたメタバリアを一様な地盤と層状の地盤に置いて、1〜80 Hzの調和加振での振幅低減率を評価した（抄録）。", "p5": "考えた構成で計算費用を86〜94%減らし、元のITMの空間的なエイリアシングを避け、層状の地盤も効率よく扱えた（抄録）。振幅低減率でメタバリアの対策効果を定量化できることを示した（抄録）。", "p6": "抄録には振幅低減率の具体的な値と検証の誤差の大きさがない（未確認）。解釈：調和加振の周波数領域の解析であり、列車などの移動荷重や非線形な地盤への適用は抄録からは読み取れない。", "fun": "電車や工事の揺れは地面を伝わって家を揺らす。この研究は、地中に埋めた構造物と地面の揺れを3次元で計算する方法を工夫し、問題を独立した小さな計算に分けて同時に解くことで、計算の手間を86〜94%減らした。地中に並べた「揺れ止め」の効き目を素早く調べられる。", "unverified": "本文を読んでいないため、計算時間の実数、メタバリアの寸法、低減率の値は未確認。"}}, {"id": "pr16", "rank": 16, "headline": "Big Five性格をLLMに連続的かつ忠実に与える", "title": "FATE-5: Faithful Alignment of Trait Expression for Continuous Big Five Personality Control", "url": "https://arxiv.org/abs/2610.34889", "authors": "Gunhee Cho ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Cho, G., Kim, H., & Cheong, Y.-G. (2026). FATE-5: Faithful Alignment of Trait Expression for Continuous Big Five Personality Control (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34889", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMにBig Fiveの性格を連続値で与えるとき、特性の表出の強さと対話の自然さを両立させる2段階の枠組みFATE-5を提案した（抄録）。", "p3": "まず対話の教師データと質問紙の補助目的で、Big Fiveの各プロファイルを連続的なソフトプロンプトとして学習し、次に対話の質と性格の一致度にもとづく選好学習で自然さを高めた（抄録）。", "p5": "3種類の基盤モデルで、特性の強い既存手法より対話の自然さが大きく高く、学習に使っていない質問紙で単調性の相関0.97〜0.99、回復のRMSE 8.9〜12.4を示した（抄録）。", "fun": "AIに「少し外向的」「とても几帳面」のような性格を細かく付けると、会話が不自然になりがちだ。この研究は、性格を覚えさせる段階と会話を自然にする段階を分けて、性格の強さと自然さを両立させた。性格のつまみを連続的に回せるAIは、いろいろな人を演じる模擬実験に役立つ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr17", "rank": 17, "headline": "LLM判定者の版替えで評価の基準が変わる", "title": "LLM-as-a-Judge Version Shift: The Instrument Changed, Not the Standard", "url": "https://arxiv.org/abs/2610.32986", "authors": "Guijia Zhang ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Zhang, G., & Yang, H. (2026). LLM-as-a-Judge Version Shift: The Instrument Changed, Not the Standard (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.32986", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "研究提案を順位づけるLLM判定者を同系統の新しい版に替えると、点数の位置だけでなく評価基準の構造や分解能まで変わりうることを示した（抄録）。", "p3": "重みを固定した事前登録の設計で、Qwen・Gemma・Mistralの隣り合う版の3組の移行を、凍結した機械学習の研究提案と無作為化した情報条件で比べ、判定者の原点・基準の幾何・分解能の変化として整理した（抄録）。", "p5": "「新しい判定者ほど厳しい」という想定は成り立たず、2組は甘くなる方向に動き、1組では良い提案と欠陥のある提案の区別が崩れて点数の93%が1つの値に集まった（抄録）。同じ事実を与えても差は埋まらず、全体の再較正は平均を直しても個々のばらつきをほとんど説明しなかった（抄録）。", "fun": "テストの採点者が途中で交代したら、点数は同じ基準で比べられるだろうか。AIの採点者でも同じ問題が起きる。新しい版のAIは厳しくなるとは限らず、甘くなったり、良い案と悪い案の区別がつかなくなったりした。物差しを替えたら、まず物差し自体を確かめる必要があるという教訓だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "LLMのプロスペクト理論特性をメタ分析", "title": "Prospect Theory in Large Language Models: A Meta-Analysis of Loss Aversion, Diminishing Sensitivity, and Probability Weighting", "url": "https://arxiv.org/abs/2610.33103", "authors": "Adi Tarabeih", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Tarabeih, A. (2026). Prospect Theory in Large Language Models: A Meta-Analysis of Loss Aversion, Diminishing Sensitivity, and Probability Weighting (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33103", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "32のLLMを扱った11研究の102の推定値をメタ分析し、LLMの損失回避は人より弱く、価値関数の曲がり方は測定法によって結論が変わることを示した（抄録）。", "p3": "プロスペクト理論の3要素（損失回避λ、結果の大きさへの感応度の逓減、確率の非線形な重みづけ）の推定値を統合し、設計をそろえた比較で人の推定値と対照した（抄録）。", "p5": "統合した損失回避λは1.26（95%CI 1.06〜1.46）で、人の最も強いメタ分析の推定値1.96より小さく、損失が利得より小さい条件では人の2.3に対し1.46だった（抄録）。価値関数はTversky-Kahneman法でほぼ線形（1.01、人は0.67）、Tanaka法では人より凹（0.52）だった（抄録）。", "fun": "人はお金をもらう喜びより、同じ額を失う悲しみの方を大きく感じる。これを「損失回避」という。AIにも同じ傾向があるかを11の研究から調べると、AIの損失回避は人より弱めだった。AIを人の代わりの回答者として使うときは、こうした違いに注意が必要だとわかる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "相互作用で推論の整合が生まれる多エージェント", "title": "Collective Emergent Alignment: Measuring and Amplifying Interaction-Induced Reasoning Alignment in Multi-Agent LLMs", "url": "https://arxiv.org/abs/2610.34836", "authors": "Boxuan Wang ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Wang, B., Li, Z., Ramchurn, S. D., Huang, X., & Dong, Y. (2026). Collective Emergent Alignment: Measuring and Amplifying Interaction-Induced Reasoning Alignment in Multi-Agent LLMs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34836", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "複数のLLMエージェントが相互作用すると、各自の自己改善だけでは得られない推論の整合（参照に根拠づけられた推論の一致）が生まれることを測る枠組みREMAPを示した（抄録）。", "p3": "参照との含意行列にもとづく意味の網羅度と相互作用に固有の上積みを定義し、複数のモデル系統と2つのマルチホップ推論のベンチマークで個別の自己改善と比べた（抄録）。さらに推論過程の全体ではなく不足を補う事実だけを選んで伝える通信方式を提案した（抄録）。", "p5": "相互作用による上積みは全般に正で、エージェント間に分散した証拠を統合する推論で特に大きく、他者の情報の回復と一貫して関連した（抄録）。簡潔な事実の交換は通信量を減らしつつ整合と性能を高めた（抄録）。具体的な数値は抄録にない（未確認）。", "fun": "グループで話し合うと、一人で考え直すより良い答えにたどり着くことがある。この研究はAI同士でもそれが起きるかを測り、情報がメンバーに散らばっているときに特に効果が大きいことを見つけた。しかも、考えた過程を全部伝えるより、足りない事実だけを伝える方が効率的だった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "価値観の強いペルソナを安全に扱う整合手法", "title": "When Personas Become Harmful: Guiding LLMs with Global Citizenship Values Alignment", "url": "https://arxiv.org/abs/2610.33899", "authors": "Siqi Shen ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Shen, S., Logeswaran, L., Lee, M., Lee, H., & Mihalcea, R. (2026). When Personas Become Harmful: Guiding LLMs with Global Citizenship Values Alignment (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33899", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "価値観を帯びたペルソナを指定する依頼から有害な応答が生じる問題を示し、ユネスコの地球市民の原則を最小限の共通基盤として、ペルソナへの忠実さと安全性を推論時に調整できる整合モデルを提案した（抄録）。", "p3": "シュワルツの価値観調査の次元に対応するペルソナと論争的な話題の組11k件のデータを作り、話題とペルソナを反復的に洗練するエージェント型の手順で有害な応答を集めた（抄録）。", "p5": "安全に調整された商用LLMからも47%超の成功率で有害な応答を引き出せた（抄録）。提案モデルは多くのサンプルで比較手法より安全で、ペルソナにも忠実だった（抄録）。", "fun": "AIに「伝統を重んじる人として答えて」のように価値観を指定すると、悪意のない頼み方でも有害な答えが出てくることがある。この研究は、許される意見と有害な行動の線引きに世界共通の市民の原則を使い、利用者が忠実さと安全性のバランスを選べるAIを作った。多様な価値観をどう尊重するかという難しい問いに挑んでいる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "説得相手の暗黙の信念を報酬にする学習", "title": "Implicit Beliefs as Scalable Process Rewards for Strategic Persuasion", "url": "https://arxiv.org/abs/2610.33527", "authors": "Minqian Liu ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Liu, M., Shen, Y., An, H., Zhang, Q., Wisniewski, P. J., Lee, S. W., Cho, J.-H., & Huang, L. (2026). Implicit Beliefs as Scalable Process Rewards for Strategic Persuasion (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33527", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "多ターンの戦略的な説得をLLMに学ばせるため、心理的に根拠のある被説得者を模擬する環境と、被説得者の内部状態を密な過程報酬に変える強化学習Probe-RPOを提案した（抄録）。", "p3": "説得の模擬環境PersuArenaで、凍結した被説得者モデルのロジットから毎ターン3つの内省的なプローブを読み取り、多次元の報酬として方策最適化に使った（抄録）。医療・金融助言・職場管理・教育・人間関係の場面で評価した（抄録）。", "p5": "Probe-RPOは完全受諾率52.5%を達成し、比較対象の35.8%を上回った（抄録）。比較対象の詳細は抄録の範囲では未確認。", "fun": "相手を説得する会話の練習相手をAIで作るには、本当の人のように迷ったり意見を戻したりする相手が必要だ。この研究は、AIの説得相手の「心の中」の変化を毎回読み取って、それを上達の手がかりにした。どの一言が効いたのかが分かる点が、結果だけで学ぶ方法との違いだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "意図を保つ敵対的ユーザー模擬でエージェント評価", "title": "Intent-Preserving Adversarial User Simulation for Multi-Turn Agent Evaluation", "url": "https://arxiv.org/abs/2610.35426", "authors": "Atri Vivek Sharma ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Sharma, A. V., Formento, B., & Lomuscio, A. (2026). Intent-Preserving Adversarial User Simulation for Multi-Turn Agent Evaluation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35426", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "多ターンのエージェントを評価する模擬ユーザーが協力的すぎて性能を過大評価する問題に対し、ユーザーの目的は保ったまま手強い対話を作る敵対的な模擬ユーザーStressSimを提案した（抄録）。", "p3": "課題ごとに模擬ユーザーの高レベルの敵対的な計画を、実行の記録、課題達成の細かな信号、妥当性のフィードバックを使う遺伝的なプロンプト最適化で進化させた（抄録）。MultiWOZとtau-benchの小売・航空の領域で3つのエージェントを評価した（抄録）。", "p5": "tau-benchのpass^4はgemini-3.8-flashで最大69%、gpt-5.6-solで62%下がった一方、ユーザーの目的の保持の低下は最大10%にとどまった（課題あたり20回の実行の予算）（抄録）。", "fun": "AIの接客係をテストするとき、テスト役のAIが素直すぎると、本番の手強い客に対応できるかが分からない。この研究は、目的は変えずに手強い客を演じる模擬ユーザーを自動で鍛え、最新のAIでも成功率が大きく下がることを示した。テストの相手を賢くすることが、本当の実力を測る近道になる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "知見グラフに基づく多エージェント討論で着想", "title": "Distill, Debate, Discover: Grounding Multi-Agent Research Ideation in Graph-Distilled Insights", "url": "https://arxiv.org/abs/2610.33366", "authors": "Qianran Ma ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Ma, Q., Liu, M., Kim, G., Liang, X., & Callison-Burch, C. (2026). Distill, Debate, Discover: Grounding Multi-Agent Research Ideation in Graph-Distilled Insights (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33366", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "関連論文のグラフから知見を抽出してエージェントに専門性を持たせ、討論を通じて研究提案を作る多エージェントの研究着想の枠組みInsightAgentsを提案した（抄録）。", "p3": "研究の流れの中での手法の変遷、暗黙の前提、未解決の課題を示す知見でエージェントを方向づけ、共同で問題を定めて案を提示・批判・改善する討論で提案を作った（抄録）。NLPの100の研究テーマで、3つの既存の枠組みと2つのLLM判定者による対比較で評価した（抄録）。", "p5": "オンラインとオフラインの知識設定の両方で、2つの判定者のもとで5つの評価次元の平均点が最も高かった（抄録）。人による評価は抄録にない（未確認）。", "fun": "研究のアイデアを出すとき、本物の研究者は過去の論文から「どこが未解決か」を読み取ってから議論する。この研究は、AIの議論メンバーにも論文のつながりから知見を持たせ、提案・反論・修正を重ねさせた。物知りなメンバーをそろえるほど議論が良くなるという、人の会議にも通じる発想だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr24", "rank": 24, "headline": "議会議事録に見る女性議員のエネルギー転換議論", "title": "Women in Decision-making for Energy Transition: The Roles and Sentiments of Women Legislators Captured in National Parliament Meeting Notes", "url": "https://doi.org/10.2139/ssrn.7675059", "authors": "Minyoung Choi ほか", "venue": "SSRN", "date": "2026-10-27", "apa": "Choi, M., Kim, H., & Lee, H. (2026). Women in Decision-making for Energy Transition: The Roles and Sentiments of Women Legislators Captured in National Parliament Meeting Notes. https://doi.org/10.2139/ssrn.7675059", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "韓国国会の第21・22期の議事録を分析し、エネルギー転換の議論で女性議員は環境安全・公衆衛生・越境リスクの検証に集中し、男性議員は原発輸出や産業振興まで幅広く扱っていたことを示した（抄録）。", "p3": "大規模な韓国語の議事録に、BERTopicによる話題モデル、Transformerによる感情分類、感情を埋め込んだネットワーク分析を適用し、話題の重点、感情の枠づけ、相互作用の構造を調べた（抄録）。", "p5": "感情の枠づけの性差は小さく領域に依存し、女性はわずかに否定的だが原発などの争点では二極化が小さかった（抄録）。3つ目の結果は抄録の範囲では未確認。", "fun": "国会で同じエネルギーの話をしていても、女性議員は安全や健康の問題を、男性議員は原発の輸出や産業の話を多くしていた。議事録という膨大な文章をAIで読み解くと、誰がどんな視点で議論に加わっているかが見えてくる。多様な人が議論に加わる意味を、言葉の分析で示そうとする研究だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr25", "rank": 25, "headline": "執行品質の開示から個人投資家の損害を部分識別", "title": "Can Execution Disclosures Reveal Harm to Retail Traders? Accounting Gaps, Sample Selection, and Sharp Bounds", "url": "https://doi.org/10.5281/zenodo.23677535", "authors": "Golla, Akshaj", "venue": "Zenodo", "date": "2026-10-26", "apa": "Golla, A. (2026). Can Execution Disclosures Reveal Harm to Retail Traders? Accounting Gaps, Sample Selection, and Sharp Bounds (Version 1). Zenodo. https://doi.org/10.5281/ZENODO.23677535", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された説明（抄録）を使用", "preprint": true, "short": true, "p1": "Citadel SecuritiesとVirtuの2026年1〜6月のRule 605執行品質報告12件を監査し、価格区分の厳密な照合が標本の範囲と比較を大きく変えることを示し、開示から個人投資家の損害について言えることと言えないことを整理した（抄録）。", "p3": "価格区分の照合で会計上の欠落を特定し、分析者の選別による偏りと、不正や顧客の損害の証拠とを区別したうえで、初等的な計数による上下限と整数の株数の配分で、会場全体の合計から特定されない顧客群について示せる範囲を明らかにした（抄録）。", "p5": "Citadelの成行注文のセルで価格区分の不足が計36,239株あり、そのセルは同社の報告上の執行量の58.21%を占めたため、厳密な選別は欠落そのものよりはるかに多くの量を除いた（抄録）。著者は不正や因果を示すものではないとしている（抄録）。", "fun": "証券会社は「どれだけ良い値段で注文を処理したか」を報告書で公表している。この研究は報告書の数字を細かく照合し、合わない部分を機械的に除くと、ずれよりずっと多くのデータが消えてしまうことを示した。データの掃除の仕方しだいで結論が変わるという注意を、数字で示した点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "ドイツの非営利団体は何を開示しているか", "title": "What Do NPOs Disclose? Evidence from Germany", "url": "https://doi.org/10.2139/ssrn.7673379", "authors": "Michael Ebert ほか", "venue": "SSRN", "date": "2026-10-27", "apa": "Ebert, M., Simon, T., & Simons, D. (2026). What Do NPOs Disclose? Evidence from Germany. https://doi.org/10.2139/ssrn.7673379", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "ドイツの大規模な寄付受入れ非営利団体238団体の任意開示を手作業で調べ、検証可能な産出の情報はほぼすべてが開示する一方、成果・影響の情報や事業費比率の開示は少ないことを示した（抄録）。", "p3": "貸借対照表、事業への支出割合、検証可能な産出・成果・影響の情報の開示の有無を符号化し、外部認証の表示、監査人の開示、寄付額の開示、設立年、宗教団体の所有などの特性との関連を調べた記述的研究（抄録）。", "p5": "検証可能な産出の情報は90%が開示したが、成果は52%、影響は24%、事業費比率は24%だった（抄録）。外部認証の表示は費用比率と成果情報の開示と、外部監査人の開示は財務諸表の開示と関連し、古い団体や宗教団体は開示が少なかった（抄録）。", "fun": "寄付をするとき、その団体がお金をどう使い、どんな成果を出したかを知りたいと思う。ドイツの大きな団体を調べると、「何をしたか」はほぼ公開されていたが、「何が変わったか」まで示す団体は4分の1ほどだった。成果を見える形にする難しさが数字で分かる研究だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr27", "rank": 27, "headline": "サステナブル金融開示の語義変化を検出", "title": "Preference Optimization Improves Definition Generation: Semantic Change in EU Institutional Sustainable Finance Disclosures", "url": "https://arxiv.org/abs/2610.33357", "authors": "Mariia Fedorova ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Fedorova, M., Kutuzov, A., & Delascio, G. C. (2026). Preference Optimization Improves Definition Generation: Semantic Change in EU Institutional Sustainable Finance Disclosures (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33357", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "語の意味変化の検出に使う辞書型の定義生成が、同じ語義に過剰に多くの定義を作ってしまう問題を、直接選好最適化（DPO）での微調整で改善できることを示した（抄録）。", "p3": "定義生成モデルをDPOで微調整し、学術的な意味変化検出のベンチマークで定量的に、EUの開発金融の事業文書に現れる持続可能性の用語の経時変化の監査という実務課題で定性的に評価した（抄録）。", "p5": "DPOによる微調整は、語義の分布が細かくなりすぎる問題の克服に役立ったと報告した（抄録）。具体的な評価値は抄録にない（未確認）。モデル・コード・予測は公開されている（抄録）。", "fun": "「持続可能」という言葉は、昔と今とで同じ意味で使われているだろうか。この研究は、AIに言葉の定義を書かせて意味の変化を追う方法を改良し、同じ意味なのに別々の定義を量産してしまう癖を直した。お金の流れを記した文書から、言葉の使われ方の変化を監査できる点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "連合環境で表形式データを忠実に合成", "title": "Faithful Federated Tabular Data Synthesis", "url": "https://arxiv.org/abs/2610.33403", "authors": "Zilong Cao ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Cao, Z., Zhang, H., & Bi, X. (2026). Faithful Federated Tabular Data Synthesis (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33403", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "データが複数の組織に分散したままの連合学習の設定で、連続値と離散値が混在する表形式データの合成データを、分布を忠実に保って生成する枠組みFITSを提案した（抄録）。", "p3": "局所線形回帰で条件付き累積分布関数を推定する2段階の連合アルゴリズムを核に、確率の連鎖律で合成データを生成し、離散変数を連続空間に持ち上げて損失なく元の分布を復元する連続化で混在型の変数を統一的に扱った（抄録）。", "p5": "連合推定した条件付き累積分布関数の一様収束を示し、合成データは全参加組織で下流課題の性能を高め、効果は合成データの使い方に依存した（抄録）。具体的な数値は抄録にない（未確認）。", "fun": "病院や銀行のように、データを外に出せない組織が協力して分析したいときがある。この研究は、データを手元に置いたまま、本物とそっくりな「にせのデータ」を作る方法を考えた。数字と「男・女」のような分類が混ざった表でも、ゆがみなく再現できるよう工夫した点がポイントだ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "業務上の意味をLLMで補う不正検知グラフ", "title": "LLM-Enhanced Heterogeneous Graph Learning with Business Semantics for Financial Fraud Detection", "url": "https://arxiv.org/abs/2610.35298", "authors": "Yixuan Chen ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Chen, Y., Zhan, H., Sheng, J., Han, W., Chen, S., Zhang, T., Tan, X., & Xia, J. (2026). LLM-Enhanced Heterogeneous Graph Learning with Business Semantics for Financial Fraud Detection (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35298", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "カードや加盟店など役割の異なる主体からなる取引グラフで、属性の業務上の意味をLLMで明示して不正検知に使う枠組みSemHGTを提案した（抄録）。", "p3": "(1)役割を考慮したプロンプトでノードの属性からリスクに関わる業務上の説明を引き出して意味ベクトルにし、(2)意味の類似度で対象ごとの経路事例を複数回サンプリングし、(3)局所の経路の証拠と大域的な近傍の要約を合わせたトークンを対象取引とともにTransformerで処理した（抄録）。", "p5": "3つのベンチマークデータで、多くのデータと指標の組み合わせで比較手法を上回った（抄録）。具体的な数値は抄録にない（未確認）。", "fun": "カードで1日に何十回も買い物をするのは怪しいが、お店が1日に何十回も売るのは普通だ。同じ数字でも、誰の数字かで意味が変わる。この研究は、AIの言葉の力で「その数字がその立場で何を意味するか」を説明させ、不正の見逃しを減らそうとした。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr30", "rank": 30, "headline": "AIを介したマーケティングへの消費者の信頼", "title": "Trust at the Interface: Consumer Trust, Transparency and Persuasion Knowledge in AI-Mediated Marketing", "url": "https://doi.org/10.20944/preprints202610.2583.v1", "authors": "Lalit Gautam", "venue": "Preprints.org", "date": "2026-10-27", "apa": "Gautam, L. (2026). Trust at the Interface: Consumer Trust, Transparency and Persuasion Knowledge in AI-Mediated Marketing. https://doi.org/10.20944/preprints202610.2583.v1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "AIが広告を選び、個別化し、書き、話す時代の消費者の信頼について、AIの開示・個人化とプライバシー・アルゴリズムへの選好と嫌悪の3つの研究の流れを、説得知識の活性化という1つの仕組みで統合する枠組みを示した概念的な論文（抄録）。", "p3": "AIの関与の開示、データ収集の明示性、エージェントの人間らしさ、課題の枠づけといった設計が、信頼に直接ではなく、説得者の目的と能力についての消費者の推論を通じて効くと論じ、AIと企業への信頼の帰属を分けて整理した（抄録）。", "p5": "AIの誤りの後の非対称な非難と回復を説明する失敗と修復のループを加え、検証可能な7つの命題を示した（抄録）。実証データは抄録の範囲にない。", "fun": "広告の文章をAIが書いていると知ったら、その広告を信じるだろうか。この論文は、AIだと明かすか、データをこっそり集めるか、人間らしく見せるかといった作り方が、「この相手は何をたくらんでいるのか」という推測を通じて信頼を左右すると整理した。AIが失敗した後の信頼の回復まで考えている点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "メキシコ高齢者の公的医療と非公式ケア", "title": "Public Health Coverage and Ageing with Chronic Conditions in Mexico: Healthcare Utilization, Functional Autonomy, and Informal Caregiving Among Adults Aged 50 and Older", "url": "https://doi.org/10.20944/preprints202610.2423.v1", "authors": "Odra A. Saucedo-Delgado ほか", "venue": "Preprints.org", "date": "2026-10-27", "apa": "Saucedo-Delgado, O. A., Bravo-Infanzón, I., & Mata, L. (2026). Public Health Coverage and Ageing with Chronic Conditions in Mexico: Healthcare Utilization, Functional Autonomy, and Informal Caregiving Among Adults Aged 50 and Older. https://doi.org/10.20944/preprints202610.2423.v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "メキシコの50歳以上で高血圧・糖尿病・関節炎のある人について、公的医療保険への加入が外来・入院の利用、機能的自立、家族への非公式な介護の提供と正に関連することを示した（抄録）。", "p3": "メキシコ健康加齢調査（ENASEM/MHAS、2001〜2024年）の7つの波を用い、傾向スコアのマッチングで処置群の平均処置効果（ATT）を推定し、従来の推定量と機械学習の推定量で頑健性を確かめた（抄録）。", "p5": "外来の利用（ATT = 0.148）、入院・医療の利用（0.034）、非公式な介護の提供（0.031）、機能的自立（0.017）のすべてと正に有意に関連した（抄録）。介護の提供の増加は必ずしもwell-beingの改善を意味しないと著者は注意している（抄録）。", "fun": "医療保険に入っている高齢者は病院をよく使えるだけでなく、家族の介護をしている割合も高かった。持病を抱えながら誰かの世話をしている高齢者がいるということだ。ただし著者は、それが幸せの向上とは限らないと注意している。数字の裏にある暮らしの重さを考えさせる研究だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "認知症の支援拒否を「否認」で片づけない", "title": "Beyond “Denial”: Understanding and Responding to Help-Refusal in Dementia", "url": "https://doi.org/10.20944/preprints202610.2516.v1", "authors": "Peter Carey", "venue": "Preprints.org", "date": "2026-10-27", "apa": "Carey, P. (2026). Beyond “Denial”: Understanding and Responding to Help-Refusal in Dementia. https://doi.org/10.20944/preprints202610.2516.v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "認知症の本人が受診や支援を拒むことを「否認」や頑固さとみなさず、症状であり関係上の課題として理解し対応するための、段階的で強制しない枠組みを示したナラティブレビュー（抄録）。", "p3": "既存の系統的レビュー、スコーピングレビュー、メタ民族誌、リアリスト統合などを統合し（新たな文献検索はしていない）、拒否の理由を病態失認、偏見と自立を失う恐れ、関係・コミュニケーション・状況の要因、制度の障壁の4つに整理した（抄録）。", "p5": "拒否を減らす介入の証拠は、身の回りのケア中の音楽と入浴方法の工夫で最も強いが、全体に質は低く、地域の家族介護者を含む研究は少ないとした（抄録）。理解・確認・枠づけ・協働・計画・段階的対応・継続の7段階を提案した（抄録）。", "fun": "認知症の家族が病院に行くのを嫌がると、つい「頑固だ」「認めたくないのだ」と思ってしまう。しかし本人は、病気のせいで自分の変化に気づけないこともある。この論文は、拒否を性格の問題ではなく症状として理解し、無理強いせずに段階を踏んで支える方法をまとめた。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr33", "rank": 33, "headline": "米国の豊かさと包摂的な帰属感の限界", "title": "United States Prosperity and the Limits of Inclusive Belonging: A Five Objective Comparison with Europe North America and Asia", "url": "https://doi.org/10.2139/ssrn.7672738", "authors": "Carlos Federico Obregon Diaz", "venue": "SSRN", "date": "2026-10-26", "apa": "Obregon Diaz, C. F. (2026). United States Prosperity and the Limits of Inclusive Belonging: A Five Objective Comparison with Europe North America and Asia. https://doi.org/10.2139/ssrn.7672738", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "所得と人間開発が高い一方で不平等が大きく、差別の報告が53か国の調査で最も多い米国を、帰属の経済学の5つの目標（成長・安定・分配・人間の潜在能力・社会と制度への帰属）で他国と比較した（抄録）。", "p3": "55か国の監査済みデータベースで、米国を欧州7か国、カナダ、メキシコ、日本、韓国、シンガポール、中国と比べ、報告された差別を相対所得と表現の自由で統計的に調整した（53の観測値の国レベルのモデル）（抄録）。", "p5": "表現の自由は差別の報告と正に関連し、それを入れると所得の係数は不正確になった（抄録）。米国の報告値50.52%は共通の基準条件で標準化得点45.08に相当し、米中の差は線形調整で26.32から5.83ポイントに縮むが、非線形の感度分析では逆転した（抄録）。", "fun": "「差別を受けた」と答える人が多い国ほど、本当に差別が多い国なのだろうか。自由に声を上げられる国ほど、差別を報告しやすいのかもしれない。この研究は、豊かな米国で差別の報告が最も多い理由を、表現の自由との関係から慎重に読み解こうとした。数字の読み方の難しさを教えてくれる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "都市インフォーマル経済を支える信頼の市場", "title": "Markets of Trust: Moral Economy and Social Control in the Urban Informal Economy", "url": "https://doi.org/10.31235/osf.io/keb7a_v2", "authors": "Floris Noordhoff", "venue": "SocArXiv", "date": "2026-10-26", "apa": "Noordhoff, F. (2026). Markets of Trust: Moral Economy and Social Control in the Urban Informal Economy. https://doi.org/10.31235/osf.io/keb7a_v2", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "オランダの不利な地域の低所得住民216人への詳細な面接から、インフォーマル経済は無秩序ではなく、名誉・体面・評判の規範による道徳的な規制と信頼・相互監視の仕組みで成り立っていることを示した（抄録）。", "p3": "面接の質的分析で、許容される助け合い、公正な取引、不当な稼ぎの境界がどう引かれるかを、道徳経済・社会関係資本・非公式な規制の理論から読み解いた（抄録）。", "p5": "信頼と非公式な監視は責任と連帯を生む一方、排他的な序列、性別による義務、道徳的な緊張も生んでいた（抄録）。著者は自助的な市民像に立つ単純な政策モデルに注意を促した（抄録）。", "fun": "お金に困った地域での「ちょっとした手伝いと謝礼」のやり取りは、ルールのない世界と思われがちだ。しかし216人の話を聞くと、名誉や評判という見えないルールが、何が良くて何がずるいかを細かく決めていた。秩序がないのではなく、目に見えない別の秩序があるという発見が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "近隣環境と生活空間が骨折後の回復を左右", "title": "Recovery in Place: A Multimodal Pilot Study of Neighborhood Context, Life-Space, and Social and Physical Functioning After Lower-Limb Fracture Surgery", "url": "https://doi.org/10.21203/rs.3.rs-11283018/v1", "authors": "Charlene H. Chu ほか", "venue": "Research Square (In Review)", "date": "2026-10-27", "apa": "Chu, C. H., Abedi, A., Julian, P., Maddiboina, D., & Khan, S. S. (2026). Recovery in Place: A Multimodal Pilot Study of Neighborhood Context, Life-Space, and Social and Physical Functioning After Lower-Limb Fracture Surgery. https://doi.org/10.21203/rs.3.rs-11283018/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "下肢骨折の手術や股関節置換の後に自宅で回復する高齢者18人を8週間追跡し、近隣の物質的な不利が社会的交流の少なさと、図書館や飲食店のある活動空間が股関節機能の良さと関連することを、多モードのセンサーで示したパイロット研究（抄録）。", "p3": "1,008人日のセンサーデータと隔週の臨床評価（社会的孤立尺度、オックスフォード股関節・膝スコア、TUG、30秒椅子立ち上がり）を、居住地と訪問地の施設・犯罪・国勢調査の社会経済データに結びつけ、一般化推定方程式と予測モデルで分析した（抄録）。", "p5": "近隣の物質的な不利は居住地と活動空間の両方で交流の少なさと関連し、1日の移動の回数の多さは交流の多さと関連した（抄録）。予測の誤差は人をまたぐ検証で大きく、社会空間の特徴の効果はモデルと結果によって異なった（抄録）。", "fun": "骨折の手術の後、家で元気を取り戻せるかどうかは、体の回復だけでなく住んでいる街にも左右されるらしい。18人の高齢者の移動を8週間記録すると、貧しい地域では人との交流が少なく、図書館やお店に出かける人ほど股関節の調子が良かった。街の環境がリハビリの一部になっている点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr36", "rank": 36, "headline": "中国の都市スクリーンはスマートシティの界面に", "title": "The Evolution and 'Chineseness' of Urban Screens in China: From Propaganda Posters to Smart City Interfaces", "url": "https://arxiv.org/abs/2610.35762", "authors": "Wuwu Ran", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Ran, W. (2026). The Evolution and 'Chineseness' of Urban Screens in China: From Propaganda Posters to Smart City Interfaces (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35762", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "中国の都市スクリーンの発展は、公共的な伝達の系譜、国家主導の技術的な飛躍、規模を可能にしつつ運用の統制を強める規制の逆説が結びついた独自のメディア都市の型（Chineseness）であると論じた（抄録）。", "p3": "1990年から現在までの5段階の系譜、代表的なスクリーンの年表、5つの典型事例を用いた歴史的・事例的な分析（抄録）。", "p5": "この構成が時間と空間の圧縮、複数の技術世代の共存、個人の端末での双方向性より集団での目撃の重視を生むことを示し、非西洋のメディア生態を分析する概念として提示した（抄録）。", "fun": "駅前やビルの巨大スクリーンは世界中にあるが、中国では宣伝ポスターの時代から続く「みんなに伝える」伝統と、国の後押しによる技術の一足飛びが重なって独特の発展をした。スマホで一人ずつ見るより、街でみんなで同時に見ることを重んじる点が、欧米との違いとして面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr37", "rank": 37, "headline": "人間中心のAI能力が従業員を力づける", "title": "Human-centered AI Capability and employee outcomes in an emerging economy: mediating role of empowerment and moderating role of digital culture", "url": "https://doi.org/10.21203/rs.3.rs-10923266/v1", "authors": "Mahmoud K. Abouraia ほか", "venue": "Research Square (In Review)", "date": "2026-10-27", "apa": "Abouraia, M. K., Morsy, R. M. E., El-Ashery, M. H., & Galal, H. M. (2026). Human-centered AI Capability and employee outcomes in an emerging economy: mediating role of empowerment and moderating role of digital culture. https://doi.org/10.21203/rs.3.rs-10923266/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "エジプトの42組織の従業員387人の調査で、組織のAI能力は従業員の成果とエンゲージメントと正に関連し、その一部は心理的エンパワーメントを通じた経路であることを示した（抄録）。", "p3": "資源ベース理論と心理的エンパワーメント理論に基づき、銀行・通信・医療・製造・小売の横断調査を共分散構造分析で分析し、ブートストラップによる媒介の検定と多母集団比較でデジタルな組織文化の調整効果を調べた（抄録）。", "p5": "エンパワーメントは部分的に媒介し、AI能力からエンパワーメントへの関係は、デジタル文化の発達した組織でそうでない組織のおよそ2倍強かった（抄録）。", "fun": "会社にAIを入れれば社員が元気になる、とは限らない。エジプトの387人の調査では、AIの力が社員の成果につながるのは、社員が「自分で決められる」「役に立てる」と感じるときだった。しかもデジタルに慣れた職場ほど、その効果が約2倍強かった。道具より使う人の気持ちが大事だという話だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "基本的欲求の必要条件効果は再検証で不確か", "title": "Inconclusive evidence for necessity effects of basic psychological need satisfaction on employee well-being: Re-examining Ding et al. (2026)", "url": "https://doi.org/10.31234/osf.io/bw7mf_v1", "authors": "Kimmo Sorjonen ほか", "venue": "PsyArXiv", "date": "2026-10-27", "apa": "Sorjonen, K., Melin, B., Folke, F., & Melin, M. (2026). Inconclusive evidence for necessity effects of basic psychological need satisfaction on employee well-being: Re-examining Ding et al. (2026). https://doi.org/10.31234/osf.io/bw7mf_v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "従業員のwell-beingには基本的心理欲求の充足が必要条件だとしたDingらの必要条件分析（NCA）を、相関だけから生じる見かけの必要性と比べて再分析し、結論の支持は乏しいことを示した（抄録）。", "p3": "NCAの必要性の効果は、真の必要条件がなくても変数間の相関から似た形で生じうるため、報告された効果を相関だけから期待される見かけの範囲と比べた（抄録）。", "p5": "報告された効果の96.4%は見かけの範囲の内側か下にあり、真の必要条件がない場合に期待される大きさを超えていなかった（抄録）。NCAの適用には見かけの範囲の評価を標準で含めるよう提案した（抄録）。", "fun": "「これがなければ絶対に幸せになれない」という必要条件を統計で示す方法がある。ところが、ただ2つの数字が一緒に動くだけでも、必要条件があるように見えてしまうことがある。この研究は既存の結論を再分析し、ほとんどの効果がその「見かけ」の範囲に収まることを示した。統計の落とし穴に気づかせてくれる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr39", "rank": 39, "headline": "リーダーシップ機能をエージェント型AIに委ねる", "title": "Leadership as a Service? Delegating Leadership Functions to Agentic AI—Boundaries, Risks and Accountabilities", "url": "https://doi.org/10.20944/preprints202610.2543.v1", "authors": "Lalit Gautam", "venue": "Preprints.org", "date": "2026-10-27", "apa": "Gautam, L. (2026). Leadership as a Service? Delegating Leadership Functions to Agentic AI—Boundaries, Risks and Accountabilities. https://doi.org/10.20944/preprints202610.2543.v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "エージェント型AIが監視・調整・タスク配分・フィードバックなどを担い始めた状況で、リーダーシップの機能をどこまでAIに委ねられるかを、機能ごとの委譲可能性の枠組みで整理した概念的な論文（抄録）。", "p3": "機能的リーダーシップ理論、自動化と拡張のパラドックス、アルゴリズム管理とAIへの信頼の研究に基づき、感知と監視、調整、決定と配分、育成とフィードバック、代表と意味づけの5つの機能を分類した（抄録）。", "p5": "委譲の可否は技術より説明責任で決まるとし、委譲すると責任の連鎖が切れる機能は実行を自動化しても所有は委ねない「説明責任の床」の原則を示した（抄録）。正統性と信頼、規模化した偏り、責任の空白、リーダー育成の経路の侵食という4つのリスクを挙げた（抄録）。", "fun": "仕事の割り振りや励ましの声かけをAIがしてくれる職場は、もう夢物語ではない。では、上司の仕事はどこまでAIに任せてよいのか。この論文は、技術的にできるかどうかより、「何かあったとき誰が責任を取るのか」で線を引くべきだと論じた。便利さと責任のバランスを考えさせる話だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr40", "rank": 40, "headline": "NYC採用AIのバイアス監査は統計的に不定", "title": "Four-Fifths of What? Statistical Indeterminacy in NYC Local Law 144 Bias Audits and the Governance Parameters It Exposes", "url": "https://doi.org/10.5281/zenodo.23672858", "authors": "Jackson, Matthew", "venue": "Zenodo", "date": "2026-10-26", "apa": "Jackson, M. (2026). Four-Fifths of What? Statistical Indeterminacy in NYC Local Law 144 Bias Audits and the Governance Parameters It Exposes (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.23672858", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された説明（抄録）を使用", "preprint": true, "short": true, "p1": "採用AIのバイアス監査の公表を義務づけるニューヨーク市地方法144の公開監査114件（影響比2,154個）を再分析し、多くの比率が4/5基準と統計的に区別できず、監査人に任された1つのパラメータが合否を左右することを示した（抄録）。", "p3": "ACLUの監査コーパスの影響比を、背後のデータから判定できる範囲と多重比較の誤差制御で評価し、応募者の2%未満の区分を除外できる裁量規定の有無で4/5基準の結論がどう変わるかを調べた（抄録）。", "p5": "報告された比率の22.1%は4/5基準と区別できず、誤差制御のもとで0.80未満の比率があると言える監査は114件中29件、すべて0.80以上と言えるのは27件だった（抄録）。除外の裁量は22件の結論を左右し、うち19件は合格の版を公表していた（抄録）。", "fun": "採用にAIを使う会社は、AIが特定の人種や性別に不利になっていないかの監査結果を公表する決まりがある。ところが、少人数の区分を除外してよいという一つの裁量だけで、合格か不合格かが変わる監査が22件もあった。ルールの細部が公正さを左右するという、身近で大事な指摘だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr41", "rank": 41, "headline": "直交多項式多様体で非線形に次元を縮約", "title": "Greedy Orthogonal Polynomial Manifolds with Lipschitz Control for Dimensionality Reduction and Reduced Modeling", "url": "https://arxiv.org/abs/2610.33784", "authors": "Tomoki Koike ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Koike, T., Peherstorfer, B., & Qian, E. (2026). Greedy Orthogonal Polynomial Manifolds with Lipschitz Control for Dimensionality Reduction and Reduced Modeling (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33784", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "多項式の復号器で非線形の低次元表現を作る多項式多様体について、復号器のリプシッツ定数に上限を課しながら、符号化のモードと多項式の特徴を貪欲に選ぶGreedy-OPMを提案した（抄録）。", "p3": "多項式の項を学習データ上で正規直交な特徴で表すことで、復元誤差を最小化する貪欲なアルゴリズムを可能にし、リプシッツ定数の上限の制約のもとでモードと特徴を同時に選んだ（抄録）。", "p5": "数値実験で、リプシッツ制約は高い復元精度を保ちながら、学習データから離れた領域での汎化を改善した（抄録）。具体的な数値と対象の問題は抄録にない（未確認）。", "fun": "複雑な現象を少数の変数で表す「次元の縮約」は、計算を大きく軽くする技だ。ただ、学習したデータの外では急におかしな答えを出すことがある。この研究は、答えが急に変わりすぎないよう「傾きの上限」を課すことで、見たことのない状況でも安定して使える縮約モデルを作った。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr42", "rank": 42, "headline": "乱流への生成AIの基礎と検証の総説", "title": "Generative AI in Turbulence: Foundations, Applications, Validations and Benchmarks", "url": "https://arxiv.org/abs/2610.35123", "authors": "Luca Biferale ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Biferale, L., & Buzzicotti, M. (2026). Generative AI in Turbulence: Foundations, Applications, Validations and Benchmarks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35123", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "観測が不完全で複数の物理的にあり得る解がある乱流の問題に、拡散モデルなどの生成AIをどう使い、どう検証すべきかを、AIと乱流の両分野の橋渡しとして整理した総説（抄録）。", "p3": "確率的なクロージャ、超解像、データ同化、不確実性の定量化、流れのアンサンブル生成への応用を、拡散モデル・スコアベース法・確率輸送の定式化を中心に、無条件生成、確率的再構成、縮約モデル、時間発展、メッシュフリー表現の観点から論じた（抄録）。", "p5": "見た目の写実性や点ごとの誤差では物理的な忠実度を測れないとし、エネルギー輸送、構造関数、異常スケーリング、確率密度の裾、保存則、時間的一貫性などで検証すべきだと主張し、公開データと隠しテストを含むベンチマークの必要性を述べた（抄録）。", "fun": "画像を作るAIで、川や風の乱れた流れも作れるだろうか。この総説は、乱流は「それらしく見える」だけでは不十分で、エネルギーの受け渡しやまれな極端現象まで正しく再現できているかを確かめる必要があると説く。見た目と物理の正しさは別物だという指摘が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr43", "rank": 43, "headline": "疎でノイズの多い3D観測で地すべりを検出", "title": "How Much Sensing is Enough? Landslide Detection from Sparse and Noisy 3D Observations", "url": "https://arxiv.org/abs/2610.34869", "authors": "Arijit Pal ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Pal, A., Mohanty, A., Paul, D., Chakraborty, S., & Palit, B. (2026). How Much Sensing is Enough? Landslide Detection from Sparse and Noisy 3D Observations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34869", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "大規模な地すべり検出に必要な3次元観測の密度を問い、疎でノイズの多い観測から地形を再構成して地すべりの起きやすい領域を特定する学習の枠組みを示した（抄録）。", "p3": "OpenTopographyの数値標高モデルとNASAのSMAPの土壌水分を組み合わせた物理に基づくデータセットを作り、地すべりを無作為に発生させて観測の間引きと確率的なノイズを加え、CNNとXGBoostで地形の再構成と検出を行った（抄録）。", "p5": "元の観測の20%だけで、検出の正解率80%、ROC-AUC 0.868、再構成誤差（L2チャンファー距離）99.67 m²を示し、観測密度と検出性能のトレードオフを調べた（抄録）。", "fun": "山の斜面を細かく3Dで測れば地すべりを見つけやすいが、広い範囲を密に測るのは大変だ。この研究は「どこまで測りを減らしても大丈夫か」を調べ、元の2割の観測でも8割の正解率で危ない場所を見つけられることを示した。限られた観測で賢く守る発想が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr44", "rank": 44, "headline": "残差で選ぶ局所ROMで流れの形状最適化", "title": "Residual-Screened Local Reduced-Order Modeling for Brinkman-Penalized Shape Optimization of Incompressible Flows", "url": "https://doi.org/10.2139/ssrn.7674771", "authors": "Xi Li ほか", "venue": "SSRN", "date": "2026-10-27", "apa": "Li, X., Ju, L., & Wang, Z. (2026). Residual-Screened Local Reduced-Order Modeling for Brinkman-Penalized Shape Optimization of Incompressible Flows. https://doi.org/10.2139/ssrn.7674771", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "非圧縮性の定常流れの形状最適化で、残差の指標で精度を確かめながらその場で局所的な縮約モデル（ROM）を作り、不正確なときだけ完全な計算に戻る方法を提案した（抄録）。", "p3": "ブリンクマンのペナルティ法で形状を位相場として1つの構造格子上に表し、スライドする窓の状態とアジョイントのスナップショットから縮約モデルを作り、較正した残差指標で各縮約解を選別し、双対重みの推定で目的関数を完全計算で検証する時機を決めた（抄録）。", "p5": "2次元のストークス流と物体まわりのナビエ–ストークス流（レイノルズ数40と200）、3次元のストークス最小抵抗体で、目的関数は完全計算と相対誤差6×10⁻⁵以内で一致し、速度は2次元で1.9〜2.1倍、3次元で20倍、簡易版は3.8〜7.4倍と30倍だった（抄録）。", "fun": "流れの中に置く物体の形を最適にするには、流れの計算を何百回も繰り返す必要があり、とても時間がかかる。この研究は計算の「近道」を使いながら、近道が怪しいときだけ本格的な計算に戻る仕組みで、精度を保ったまま3次元では最大30倍速くした。手を抜くところと抜かないところの見極めが面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr45", "rank": 45, "headline": "都市峡谷のGNSS異常検出の総覧", "title": "GNSS Anomaly Detection in Urban Canyons: A Comprehensive Survey of Multimodal Visibility Inference", "url": "https://arxiv.org/abs/2610.34468", "authors": "Abdelgabar Ahmed ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Ahmed, A., Ballal, T., Kouzayha, N., & Al-Naffouri, T. Y. (2026). GNSS Anomaly Detection in Urban Canyons: A Comprehensive Survey of Multimodal Visibility Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34468", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "都市の高層ビル街（都市峡谷）でGNSS測位を劣化させる非直接波やマルチパスを見分ける方法を、受信機側の信号、3次元地図と環境モデル、補助センサの3つの証拠の系統に整理した総説（抄録）。", "p3": "受信機側はアンテナ・追尾・観測量の証拠をルール・統計・機械学習・深層学習で解釈する方法を、地図側は幾何的な選別・影の照合・3次元レイトレーシング・ニューラルな可視性予測を、補助センサはIMU・カメラ・LiDARを扱い、精度・解釈性・必要な機器と較正・計算量・即時性で比べた（抄録）。", "p5": "データの質とラベル付け、領域をまたぐ汎化、地図の鮮度、資源効率の良い実装を未解決の課題として挙げた（抄録）。比較の数値は抄録にない（未確認）。", "fun": "ビルが立ち並ぶ街では、衛星からの電波がビルに反射して届くため、スマホの位置がずれることがある。この総説は、電波そのものの特徴、街の3D地図、カメラや加速度センサという3種類の手がかりで「怪しい電波」を見分ける方法を整理した。見えない電波の通り道を推理する技術が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr46", "rank": 46, "headline": "分岐桁橋の多尺度エネルギー解析と地震損傷", "title": "Progressive Multiscale Energy Analysis Framework and Seismic Damage Evolution of a Turnout Girder Bridge", "url": "https://doi.org/10.2139/ssrn.7675495", "authors": "Xin Fan ほか", "venue": "SSRN", "date": "2026-10-27", "apa": "Fan, X., Chen, S., Li, J., Jiang, Z., & Song, Y. (2026). Progressive Multiscale Energy Analysis Framework and Seismic Damage Evolution of a Turnout Girder Bridge. https://doi.org/10.2139/ssrn.7675495", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "高速鉄道の分岐桁橋のような不整形な橋で、構造・部材・区間・要素の4つの尺度へ段階的に絞り込むエネルギー解析の枠組みを提案し、地震による損傷の進展を追跡した（抄録）。", "p3": "縮尺模型の振動台実験で弾性の縦方向応答を検証した非線形有限要素モデルを作り、地震の強さと入力方向を変えてエネルギー応答と損傷の進展を解析した（抄録）。", "p5": "頻発地震では構造はほぼ弾性だが、まれな地震では塑性ひずみエネルギーが大きく増え、縦方向の塑性応答が横方向を上回った（抄録）。縦方向ではP3、横方向ではP2の橋脚が最も塑性化し、脆弱な部位は橋脚基部の外面の縁に絞り込まれ、支承の破壊後は橋脚の塑性の進展が遅くなり桁との相対変位が増えた（抄録）。", "fun": "地震で橋のどこが一番先に壊れるかを知るには、橋全体から部材、さらに細かな部分へと順に目を向けていく必要がある。この研究は、地震のエネルギーがどこにたまるかを段階的に追い、橋脚の根元の外側の角から壊れ始める様子を突き止めた。全体から部分へ絞り込む探偵のような分析が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr47", "rank": 47, "headline": "物理を組み込んだResNetで輪軸軸受を音響診断", "title": "Physics-Informed Modulated Fusion ResNet for Noise-Robust Acoustic Fault Diagnosis of Railway Wheelset Bearings", "url": "https://doi.org/10.21203/rs.3.rs-11348519/v1", "authors": "Peihai Li ほか", "venue": "Research Square (In Review)", "date": "2026-10-27", "apa": "Li, P., Li, Z., Cao, D., Zhang, B., Li, C., & Liu, H. (2026). Physics-Informed Modulated Fusion ResNet for Noise-Robust Acoustic Fault Diagnosis of Railway Wheelset Bearings. https://doi.org/10.21203/rs.3.rs-11348519/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "強い背景雑音の中で鉄道の輪軸軸受の故障を音で診断するため、聴覚に着想を得た音響表現と、軸受の形状と回転数から予測される故障周波数の知識を組み込む物理情報つきのResNet（PIMF-ResNet）を提案した（抄録）。", "p3": "故障の特徴周波数とその3次までの高調波の周りの包絡線スペクトルのピーク振幅15次元を事前知識として抽出し、物理注意機構でResNet34の特徴をチャネルごとに変調し、物理整合性の損失を加えた（抄録）。", "p5": "250 r/minで集めた実験室の音響データに環境雑音を加えた条件で、元の録音で98.83%、−15 dBで79.24%の正解率を示し、−15 dBでは聴覚表現だけの比較手法を6.64ポイント上回った（抄録）。", "fun": "電車の車輪の軸受が傷むと、回転に合わせて特有の音が出る。ところが線路の脇は騒がしく、その音はかき消されがちだ。この研究は、軸受の形と回転数から「故障ならこの高さの音が出るはず」という物理の知識をAIに教え、騒音の中でも聞き分けやすくした。耳の良い職人の勘をAIに持たせる発想だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr48", "rank": 48, "headline": "分布ずれ下の工学回帰の不確実性定量を比較", "title": "Benchmarking uncertainty quantification for engineering regression under graded distribution shift", "url": "https://arxiv.org/abs/2610.35356", "authors": "Ahmad Lawal ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Lawal, A., Pasbanigoloojeh, R., & Bilbis, A. L. (2026). Benchmarking uncertainty quantification for engineering regression under graded distribution shift (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35356", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "工学の回帰で使う不確実性定量の手法を、物理的に意味のある変数に沿った3段階の分布のずれ（分布内・弱いずれ・強いずれ）で比較するベンチマークを示し、強いずれでは被覆率が大きく下がることを示した（抄録）。", "p3": "5系統12手法を、7つの公開の工学データ（5つの外挿設定、未知のターボファン故障、冬の大気質センサの展開）で評価し、調整は元のデータだけで行った（抄録）。", "p5": "分布内では共形法がすべてのデータで0.946以上を被覆したが、強いずれでは常に区間を返す11手法の平均被覆率が0.40〜0.75に下がり、手法の順位に系統的な差はなかった（Friedman p = 0.63）（抄録）。重みつき共形分位点回帰は強いずれの点の平均85%で回答を控えた（抄録）。", "fun": "AIの予測に「どれくらい自信があるか」を付ける方法はたくさんあるが、学習したときと違う状況で本当に役立つのか。この研究は、状況のずれを3段階に分けて12の方法を試し、ずれが大きいと多くの方法の自信の幅が信用できなくなることを示した。想定外にこそ注意が要るという教訓だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr49", "rank": 49, "headline": "パラメトリック場予測のTucker型代理モデル", "title": "A Product-Grassmann Tucker Surrogate for Parametric Field Prediction", "url": "https://arxiv.org/abs/2610.34559", "authors": "Melika Baghi ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Baghi, M., Liu, X., & Paynabar, K. (2026). A Product-Grassmann Tucker Surrogate for Parametric Field Prediction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34559", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "設計最適化やデジタルツインで繰り返し必要になる偏微分方程式の全場予測のため、空間の各方向と時間を別々のモードとして保つTucker分解に基づく代理モデルを提案した（抄録）。", "p3": "因子の部分空間を積グラスマン多様体上で補間し、プロクラステス整合でTuckerのコアを同じ座標系にそろえ、その変化を打ち切り特異値分解でモデル化した（抄録）。", "p5": "2次元と3次元の5つのPDEのベンチマークで、単一部分空間のグラスマン代理モデルと比べ、補間の大きさを13〜482分の1、保存するモデルを13〜464分の1にし、問い合わせは3.3〜8.5倍速く、平均誤差の差は最大0.22ポイントだった（抄録）。3次元格子では比が2,260、速度向上が11.9倍に達した（抄録）。", "fun": "シミュレーションを何度も回す設計では、毎回の計算を軽くする「代理モデル」が欠かせない。この研究は、空間の縦・横・高さと時間を別々に扱う工夫で、保存するデータを最大で数百分の一に減らしながら、精度をほとんど落とさなかった。データの形をそのまま生かす発想が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pr50", "rank": 50, "headline": "コンクリートのひび割れデータベースの作り方", "title": "Cement Structures Crack Database Methods Acquisition and Preparation: A Review", "url": "https://doi.org/10.3233/atde261109", "authors": "Ata Jahangir Moshayedi ほか", "venue": "HAL", "date": "2026-10-24", "apa": "Moshayedi, A. J., Nguyen, Q., & Bassir, D. (2026). Cement Structures Crack Database Methods Acquisition and Preparation: A Review. Civil Construction and Structural Engineering. https://doi.org/10.3233/atde261109", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、登録された抄録を使用", "preprint": true, "short": true, "p1": "橋・ダム・トンネルなどコンクリート構造物のひび割れの信頼できるデータベースを作るためのデータ取得法を、ドローンによる高解像度の光学・熱画像を中心に整理した総説（抄録）。", "p3": "現地での取得方法を比較し、RANSACや適応的な二値化などによる環境の干渉の雑音処理がAIモデルの信頼性を左右する点を論じた（抄録）。", "p5": "測定精度、費用、即時処理の間のトレードオフを比較した（抄録）。比較の具体的な数値は抄録にない（未確認）。", "fun": "橋やトンネルのひび割れをAIで見つけるには、まずたくさんの「ひび割れの写真」を集めた辞書が必要だ。この総説は、ドローンで撮る普通の写真と熱の写真の使い分けや、光や汚れによる雑音の消し方など、良い辞書づくりのコツをまとめた。AIの賢さはデータ集めで決まるという話だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習（Hugging Face）", "headline": "道具使用エージェントは根拠ある判断から学ぶ", "title": "Trajectory2Gym: Decision-Grounded Compositional Interaction Synthesis for Tool-Use Agents", "url": "https://arxiv.org/abs/2610.33568", "authors": "Yihao Hu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-27", "apa": "Hu, Y., Wen, Z., Lin, Y., Lu, S., Wang, P., Wu, W., Yang, J.-M., & Lin, T. (2026). Trajectory2Gym: Decision-Grounded Compositional Interaction Synthesis for Tool-Use Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33568", "why": "成功した軌跡を集めるだけでなく、依存関係を含み判断の根拠が見える対話を作って学ばせることで、Qwen3の5規模すべてで道具使用ベンチマークの平均を16.9〜29.8ポイント上げた。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、方法§4、実験§5.2–5.4、結論§6）を読んだ。付録の詳細は読んでいない", "preprint": true, "p1": "ツールを使うLLMエージェントの学習データとして、成功した軌跡をただ集めるのでなく、観測と行動の依存関係を網羅し、各行動をその時点で見えている履歴から正当化できるやりとりを構築する手法Trajectory2Gymを提案した（抄録、§1）。未査読のプレプリントである。", "p2": "成功した軌跡でも、複数段階の依存関係を十分に含まなかったり、その時点で見えない情報に頼った行動を含んだりするため、必ずしも良い教師データにならない（抄録）。", "p3": "既存のやりとりで支えの少ない構造を見つけて実行可能なやりとりを新たに作り、実行結果のうち見える履歴で正当化できる判断だけを教師にし、構造の支えに応じて経験を配分して、1つのやりとりを学習の重みの単位とする教師ありファインチューニングで学習した（抄録、§4）。強化学習は使っていない（§5.2）。", "p4": "Qwen3の1.7Bから30B-A3Bまでの5つの規模で、状態を持つツール利用のTau1・Tau2と関数呼び出しのBFCLで評価し、既存のエージェント学習済みモデルや公表された商用モデルの値と比べ、8Bで構成要素のアブレーションを行った（§5）。", "p5": "3つのベンチマークの等重みの平均は全規模で16.9〜29.8ポイント上がった（抄録）。学習後の30B-A3BはTau2で84.17と、公表された商用モデルの値（84.76、85.31）に1.2ポイント以内に迫り、Tau2のTelecomは12.50から95.00に上がった（§5.2）。BFCLの多ターンの基本課題は7〜41ポイント上がったが、単発の単純な呼び出しは4つの規模で6〜13ポイント下がった（§5.3）。", "p6": "著者は、アブレーションは8Bでの方向性を示す証拠にとどまるとし、方策に沿ったロールアウトやウェブ・ソフトウェア・端末のエージェントへの拡張を今後の課題とする（§6）。解釈：商用モデルとの比較は元の報告値によるもので、同じ条件で再評価したものではない。", "fun": "AIに買い物の手続きや電話会社の設定変更を道具を使ってこなさせる練習では、うまくいった記録をまねさせるのが普通だ。この研究は、その時点で見えている情報から正当化できる判断だけを手本にし、足りない種類の練習問題を自分で作った。すると電話会社の課題の成績が12.50から95.00に跳ね上がった。", "unverified": "構造の支えの配分の具体的な規則と、感度分析（§5.5）の結果は確認していない。"}}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "LLM家計のHANK経済で政策乗数を測る", "title": "LLM-Driven Households in HANK Economies", "url": "https://doi.org/10.2139/ssrn.7668360", "authors": "Mengzhong Ma ほか", "venue": "SSRN", "date": "2026-10-26", "apa": "Ma, M., Zhou, J., Ariel Mulyawan, W., Bao, T., Cong, L. W., & Wen, Y. (2026). LLM-Driven Households in HANK Economies. https://doi.org/10.2139/ssrn.7668360", "why": "消費を決める家計をLLMにした異質的エージェントのニューケインジアン経済で、期待の測り方がモデルの一部になることを示し、LLM家計が近い将来を過大に重みづけて財政乗数を押し上げることを3系統のLLMで確かめた。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "異質な家計を持つニューケインジアン（HANK）経済の家計を、最適化から導いた消費の規則ではなくLLMが生成する規則で動かし、財政・金融政策の乗数がどう変わるかを調べた（抄録）。未査読のプレプリントである。", "p2": "背景：HANKモデルでは、家計の消費が所得の変化や将来の予告にどう反応するかが政策の効果を左右し、通常は合理的期待のもとでの最適化で家計の行動を決める。本研究はそれをLLMの家計に置き換えた（抄録）。", "p3": "実験経済学の設計でLLM家計の消費・貯蓄・期待を測り、異時点間の限界消費性向に要約して一般均衡で経済を閉じ、合理的期待の基準と並べて財政・金融の乗数を求めた（抄録）。", "p4": "将来の所得の変化を期間ごとに別々に告げる提示と、すべての期間をまとめて示す提示を比べ、異なるモデル系統の3つのLLMで結果を確かめ、変化の時期を考えるよう求める指示を外す実験も行った（抄録）。", "p5": "期間ごとに
