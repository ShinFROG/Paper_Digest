<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.ask {
  align-self: flex-start; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 12px; padding: 10px 14px; font-size: 15px; font-weight: 700;
}
.askrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ask.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding: 12px 20px; font-size: 16px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 20;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 720px; background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); display: grid; gap: 10px;
  max-height: 100vh; max-height: 100dvh; overflow-y: auto; overscroll-behavior: contain;
}
.sheet h2 { margin: 0; font-size: 18px; }
.sheet p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
.sheet .btn { width: 100%; }
.sheet textarea {
  width: 100%; height: 38vh; font: 13px/1.6 var(--font); border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); padding: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">AIに聞く</h2>
    <p id="sheet-paper"></p>
    <button class="btn primary share" id="share-full" type="button">節ごとに詳しく聞く</button>
    <button class="btn share" id="share-brief" type="button">要点だけ聞く</button>
    <p id="sheet-note"></p>
    <button class="btn" id="copy-full" type="button">依頼文をコピー（節ごとに詳しく）</button>
    <button class="btn" id="copy-brief" type="button">依頼文をコピー（要点だけ）</button>
    <p id="sheet-status" aria-live="polite"></p>
    <textarea id="sheet-text" readonly hidden aria-label="依頼文"></textarea>
    <button class="btn" id="sheet-close" type="button">閉じる</button>
  </div>
</div>

<script id="report-data" type="application/json">{"date": "2026-10-05", "intro": "プレプリントの新着321件、学術誌の新着1,282件（うち上位10%誌1,037件）、重要論文の候補89件、公開データの新着51件から選びました。今日は良い候補が少なかったため、プレプリント・関連40報、プレプリント・注目38報、論文誌・関連45報、論文誌・注目25報、データ18件に絞りました。arXivは週末のため新着がなく、Hugging Face Daily Papersは取得できませんでした。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "作業時間の目安表示で作業は速まるが返金が増える", "title": "When Algorithms Time Workers: Speed-Quality Tradeoffs in a Randomized Field Experiment", "url": "https://doi.org/10.2139/ssrn.7554058", "authors": "Youngsoo Kim ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文はアクセス制限で取得できず", "preprint": true, "p1": "報酬や評価に関係しない「目安時間の表示」だけでも食料品ピッキングの作業者が速くなる一方、返金が増えることを、2年以上・20万人超の無作為化フィールド実験で示した（未査読）。", "p2": "アルゴリズムは仕事の割り当てだけでなく作業の仕方にも影響するが、情報だけの時間表示が効率化（ペース配分や探し方の改善）を生むのか、努力のすり替え（探すのを早めにあきらめる）を生むのかは分かっていなかった（抄録）。", "p3": "注文のまとまりごとに予想ピッキング時間を示すタイマーの利用を無作為に割り当て、数千万件の作業で時間と返金への因果効果を推定した。目安を上回っても下回っても報酬・評価・割り当てに影響しない純粋な情報なので、表示そのものの効果を取り出せる（抄録）。", "p4": "良さの物差しは速さ（ピッキング時間）と品質（返金）の両方で、そのトレードオフを見る。かごの大きさ、時間帯、曜日、難しさの代理指標、ギグワーカーと正社員で効果の違いも比べた（抄録）。", "p5": "平均でタイマーは作業を2.8%速め、返金を0.77%増やした。速さの向上は大きいかご・勤務の早い時間・週末で大きく、難しい環境では速さを保ちつつ返金への悪影響が弱まった。効果はギグワーカーに集中し、正社員ではほぼ見られなかった（抄録）。", "p6": "抄録からは、推定の信頼区間や返金の増加が顧客に与える影響は分からない。正社員で効果がない理由は、日々の手順や店への慣れが内部の目安になるためと著者は推測している。解釈：1つの小売網の事例であり、他業種への一般化は別の検証が要る。", "fun": "「この作業は約何分」と表示されるだけで、人は急ぎます。報酬にも評価にも関係ないのに、です。この研究は20万人を超える作業者で、その表示が作業を速める一方、見つけにくい品をあきらめて返金が増える副作用も生むことを、無作為の割り当てで確かめました。慣れた正社員には効かず、ギグワーカーにだけ効いたのも面白い点です。", "unverified": "推定の信頼区間と、返金の0.77%増が相対値か絶対値かは未確認（本文を入手できず）。"}}, {"id": "pr02", "rank": 2, "headline": "人的資本の開示は従業員の写真にも表れる", "title": "Human capital disclosure in words and photographs: Evidence from Japan", "url": "https://doi.org/10.2139/ssrn.7560588", "authors": "Yoshitaka Tanaka ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は取得できず", "preprint": true, "p1": "日本の上場企業の統合報告書で、有価証券報告書の記述から測った「従業員重視」の度合いが強い企業ほど、従業員の経験や活動を語る記述に従業員の写真を多く添えていることを、LLMによる画像の分類で示した（未査読）。", "p2": "背景：人的資本の開示の研究は文章を中心に進んできたが、統合報告書には写真などの視覚的な表現も多い。企業が文章で述べる姿勢が視覚的な表現にも表れているかが問いである（抄録）。", "p3": "2016〜2024年の546社・3,377冊の統合報告書から、LLMで従業員の写真を選び、その写真が従業員の経験や特定の活動への参加の記述に添えられているかを判定した。従業員重視の度合いは有価証券報告書から測った（抄録）。", "p4": "写真の使用の広さと、該当する記述に添えられた1ページあたりの写真の枚数を結果とし、従業員重視との関係と、人的資本の記述の読みやすさによる違いを調べた（抄録）。", "p5": "従業員重視の度合いが強いほど写真をより広く使い、記述に添えた1ページあたりの写真も多かった。枚数との関係は、人的資本の記述が読みやすいほど強かった（抄録）。係数の大きさは抄録にない。", "p6": "抄録からは、因果の向きや、LLMによる写真の判定精度の検証は分からない。解釈：写真が実態を映すのか印象づくりなのかは、この関連だけでは区別できない。", "fun": "会社の報告書には、笑顔で働く社員の写真がよく載っています。この研究は、「社員を大切にしている」と文章で強く書く会社ほど、社員の体験談に写真を多く添えていることを、AIに3,000冊を超える報告書の写真を仕分けさせて確かめました。言葉と写真という2つの語り方がそろっているかを測る発想が面白い点です。", "unverified": "LLMによる写真の判定精度と、回帰係数の大きさは未確認（本文を入手できず）。"}}, {"id": "pr03", "rank": 3, "headline": "粗視化で時間の矢が生じる必要十分条件を証明", "title": "Sharp criterion for the coarse-grained arrow of time in Hamiltonian dynamics", "url": "https://doi.org/10.5281/zenodo.23135742", "authors": "Namba, Taishi", "venue": "Zenodo", "date": "2026-10-04", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "ZenodoのPDF本文（定理・証明、例の節、図1〜3、結論）を読んだ", "preprint": true, "p1": "ハミルトン系の確率分布をガウスの窓でぼかして（粗視化して）見たとき、粗視化エントロピーが「どんな初期分布でも」減らない条件を、線形系では必要十分条件として、非線形系では窓より広くない状態について証明した（Zenodoの未査読プレプリント）。", "p2": "ギブスのエントロピーはリウヴィル方程式の下で保存されるため、エントロピー増大は粗視化に帰されてきたが、非線形の積分可能系では一時的に減ることも知られ、いつ増大が保証されるかは未解決だった（§I）。", "p3": "エントロピー生成率を、窓の広がりの項（フィッシャー情報行列Fによる）と流れの項Σに厳密に分けた（補題1）。線形流ż=Bzでは、dS_C/dt=½tr(GF)、G=Ċ−BC−CBᵀ となる（定理3）。直観：窓が広がる速さと流れが位相空間を引き伸ばす速さの競争で、引き伸ばしが勝つ方向では分布が鋭く見えてエントロピーが下がる。", "p4": "主張は定理として証明し、すべての数値を公開コードで独立に確かめた。非線形系は振り子（κ=1）と4次振動子で、ガウス混合の初期分布200個と敵対的探索で予想を試した（§V）。", "p5": "等方的な窓では、全状態でエントロピーが減らない条件はσ̇/σ≥κ（Bの対称部分の最大固有値）で、窓を固定すると線形流は全状態に時間の矢を与えない（系4・5、図1）。非線形流ではΣ≥−κ(d−σ²trF)を示し、窓より広くない状態で基準が成り立つ（定理6・系7）。振り子では予想の上限R≤1に対し探索の最大値はσ=0.1で0.908（図2）、4次振動子ではq0=4でR=22.7となり有限の速さでは保証できない（図3）。", "p6": "窓より広い状態でσが非線形性の尺度と同程度の場合は予想のまま残る（§IV・VI）。窓はガウスに限られる。著者は証明の提案・検証やコード作成にAIを使い、すべて数値で確かめたと明記している（謝辞）。", "fun": "コップに落としたインクは広がって元に戻りませんが、物理の基本法則は時間を逆にしても成り立ちます。では「時間の矢」はどこから来るのか。この論文は、ぼんやりとしか見えない観測者の「ぼかしの窓」が、流れが分布を引き伸ばす速さより速く広がるときに限って、乱雑さが減らないことを数式で示しました。時間の矢は力学ではなく観測者の見方から生まれる、という結論が面白い点です。", "unverified": "予想1の一般の場合（窓より広い状態）は未証明。振り子と4次振動子以外の系での数値的な裏づけは未確認。"}}, {"id": "pr04", "rank": 4, "headline": "外れ値に強い軌道再構成で非線形系を同定", "title": "Robust Identification of Nonlinear S-System Dynamics from Contaminated Time-Series Data", "url": "https://doi.org/10.2139/ssrn.7560378", "authors": "Viviane Colucci Boromelo ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は取得できず", "preprint": true, "p1": "外れ値を含む時系列から非線形な動力学系（S-system）を同定するとき、頑健さを後段のパラメータ推定ではなく前段の軌道・微分の再構成に入れると、パラメータ誤差が大きく減ることを示した（未査読）。", "p2": "状態の微分を数値推定で置き換えると、微分方程式の同定は代数的な最小二乗問題になるが、微分は汚染された観測を増幅して伝えるため、上流で入った歪みがパラメータ推定を損なう（抄録）。", "p3": "Bスプラインと低次値最適化（LOVO、残差の小さい観測だけで目的関数を作る手法）で軌道と微分を再構成した。保持する観測を固定すると線形の刈り込み最小二乗になり、その集中ステップの算法が目的関数を単調に減らし有限回で不動点に止まることを証明した。再構成した軌道を方程式ごとに分離できる階層的LOVOに入れ、刈り込みの度合いは軌道空間での頑健な当てはめ（RAFF）の投票で選ぶ（抄録）。", "p4": "3つのベンチマークのS-systemと20遺伝子のネットワークで、4種類の汚染シナリオ×30回の実現値について、レーベンバーグ・マーカート法の最小二乗とそのHuber・Cauchy・RANSAC版と、パラメータ誤差の中央値と動力学次数の符号の回復率で比べた（抄録）。", "p5": "提案法はパラメータ誤差の中央値を従来法の3〜8分の1に減らし（p<0.001）、汚染したベンチマーク実験ですべての有効な動力学次数の符号を回復した（従来法は54〜78%）。段階を対にした比較で、改善の大部分は刈り込みではなく再構成によるとした（抄録）。", "p6": "抄録からは、汚染の種類と割合、計算時間、実データでの検証は分からない。対象は生物系のS-systemで、他の非線形系への一般化は著者の示唆にとどまる。", "fun": "ぶれたデータから「変化の速さ（微分）」を計算すると、ノイズが何倍にも膨らみます。この研究は、外れ値に強い工夫を、最後の当てはめではなく、最初に軌道をなめらかに描き直す段階に入れるべきだと示しました。料理で言えば、味付けで失敗をごまかすより、下ごしらえで傷んだ材料を除く方が効く、という発見が面白い点です。", "unverified": "汚染の割合と種類、計算時間、実データでの性能は未確認（本文を入手できず）。"}}, {"id": "pr05", "rank": 5, "headline": "規制当局の照会状がAIウォッシングを抑える", "title": "Being Watched or Being Verified? Regulatory Inquiry Letters and Corporate AI Washing", "url": "https://doi.org/10.2139/ssrn.7560587", "authors": "Chuanqi Ling ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は取得できず", "preprint": true, "p1": "中国のA株上場企業で、取引所の照会状（開示内容への質問状）を受けた企業ほど、実態以上にAIを語る「AIウォッシング」が減り、それが主にAI関連の開示の減少によることを示した（未査読）。", "p2": "背景：AIへの関心の高まりで、企業がAIの取り組みを誇張して開示する動機が生じている。外部の監視がそれを抑えるかが問いである（抄録）。", "p3": "2015〜2024年の中国A株上場企業のパネルで、照会状の受領とAIウォッシングの度合いの関係を分析し、上方への利益調整と経営者のトーン操作を仕組みとして検証した。AIウォッシングの測り方は抄録にない（抄録）。", "p4": "照会状の詳しさ、企業の回答の量、仲介機関の専門的意見の要否、財務困窮、地域の法制度の強さで効果の違いを比べた（抄録）。", "p5": "照会状を受けた企業はAIウォッシングが有意に低く、主にAI関連の開示が減ったためだった。照会は上方の利益調整とトーン操作を減らし、照会状が詳しいほど、回答が多いほど、仲介機関の意見が求められるほど、また財務困窮企業や法制度の強い地域で効果が強かった（抄録）。", "p6": "抄録からは、照会状の受領が企業の特性と無関係に決まるか（内生性への対処）や、AIウォッシングの指標の妥当性は確かめられない。解釈：開示の減少が誇張の減少なのか、正当な情報まで減らす萎縮なのかの区別も課題である。", "fun": "「AIを活用しています」と実態以上にアピールする企業が増えています。この研究は、取引所から「本当ですか」と質問状が届くと、そうした誇張が減ることを示しました。質問が具体的で、答えを求められ、第三者の確認が入るほど効くというのは、テストで「途中式も書きなさい」と言われるとごまかしにくくなるのと似ていて面白い点です。", "unverified": "AIウォッシングの測定方法と、内生性への対処（識別戦略）は未確認（本文を入手できず）。"}}, {"id": "pr06", "rank": 6, "headline": "毎日笑う高齢者ほど幸福度が高い（JAGES）", "title": "The Relationship between Frequency of Laughter and Happiness", "url": "https://doi.org/10.21203/rs.3.rs-10986812/v1", "authors": "Megumi Shibata ほか", "venue": "Research Square (In Review)", "date": "2026-10-04", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research Squareの本文（序論・方法・結果・限界の節と表1〜3）を読んだ", "preprint": true, "p1": "日本老年学的評価研究（JAGES）の2016年調査の高齢者12,624人で、声を出して笑う頻度が高いほど主観的幸福感が高く、その関連が会う友人の数（社会的ネットワークの大きさ）や緑茶の摂取を調整しても変わらないことを示した（未査読プレプリント）。", "p2": "笑いの少なさと健康の悪化の関連はJAGESで多く報告されてきたが、笑いの頻度と幸福感そのものの関係を、社会的ネットワークの大きさを同時に考慮して大規模集団で調べた研究は少なかった（序論）。", "p3": "39市町村の自立した65歳以上34,567人への郵送調査（2016年10〜12月）のうち欠測のない12,624人で、幸福感（1〜10点）を連続変数として重回帰した。笑いは「ふだん声を出して笑うか」の4段階で、属性・所得・生活習慣・疾患・独居と、笑い×ネットワークの交互作用を順に加えた（方法）。", "p4": "評価は、笑いがほとんどない人を基準とした幸福感の点差（β）と95%信頼区間、交互作用の有無、緑茶の摂取を加えたときの係数の安定性で、すべて同じ標本で比べた（表2・3）。", "p5": "ほぼ毎日笑う人は42.3%で、ほとんど笑わない人に比べ、月1〜3日で0.690点、週1〜5日で1.162点、ほぼ毎日で1.792点（95%CI 1.524〜2.060）幸福感が高く、段階的な関連を示した（表2）。交互作用は有意でなく（β = −0.014）、緑茶を調整してもほぼ毎日の係数は1.786とほとんど変わらなかった（表3）。", "p6": "横断研究なので因果は言えず、幸福な人ほどよく笑う逆の因果もありうる。笑いも幸福も自己申告で、参加市町村は無作為抽出でなく、測られていない交絡も残ると著者は述べる（限界）。解釈：欠測による除外が35.7%と多く、選択の偏りも気になる。", "fun": "「笑う門には福来たる」を、1万2千人の高齢者のデータで確かめたような研究です。毎日声を出して笑う人は、ほとんど笑わない人より幸福度が10点満点で約1.8点高く、友人が多いか少ないかに関係なく同じ傾向でした。ただし幸せだから笑うのか、笑うから幸せなのかはこの調査だけでは分からない、という点も含めて考えると面白いところです。", "unverified": "市町村の階層構造を考慮した分析は本文に記載がなく、その影響は未確認。"}}, {"id": "pr07", "rank": 7, "headline": "SPH-ALEの砂時計モードを抑え引張解析を収束", "title": "Hourglass control for solid SPH-ALE: Stability and convergence under tensile loading", "url": "https://doi.org/10.2139/ssrn.7560377", "authors": "Georg Ganzenmüller", "venue": "SSRN", "date": "2026-10-04", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は取得できず", "preprint": true, "p1": "強い引張を受ける固体の粒子法（更新ラグランジュ型SPH-ALE）で起きる2つの数値破綻を、粒子移動法と、参照配置を使わない新しい砂時計（ゼロエネルギー）モードの減衰で同時に抑え、有限要素の参照解に収束することを示した（未査読）。", "p2": "引張不安定による粒子の対形成と、節点積分した速度勾配の零空間での抵抗のない変形が問題である。粒子移動法（PST）は前者を除くが後者には効かず、既存の砂時計制御は参照配置からの位置誤差を測るので、PSTの非物質的な移動量が誤差に入り、偽の復元力や塑性流れの硬化を生む（抄録）。", "p3": "粒子間の相対速度のうち非アフィン（一様な変形で説明できない）部分を中心線に射影したものに働く減衰を導入した。既存の速度勾配から計算でき、参照配置も累積移動量も不要で、物体内部の線形速度場と剛体回転は変えず、線運動量を保存する。サブステップで積分し、音速による時間刻みを制限しない（抄録）。", "p4": "ジョンソン・クック粘塑性の軸対称引張試験で、荷重の非物理的な低下と早すぎる破断を防げるか、4つの解像度での荷重・変位曲線の収束次数、独立に格子収束させた有限要素解との差を評価した（抄録）。", "p5": "PSTと砂時計減衰の組み合わせは非物理的な荷重低下と早期破断を防ぎ、荷重・変位曲線は4解像度で単調に収束した（細かい3つで観測次数1.4〜1.7）。外挿した極限は有限要素解と最大荷重で1.2%以内、塑性の初期の枝で3.2%以内で一致した（抄録）。", "p6": "抄録からは、破断が進んだ後の挙動、3次元問題、他の構成則への適用は分からない。解釈：検証は軸対称の引張1例で、接触や破砕を伴う問題での性能は別に確かめる必要がある。", "fun": "粒子の集まりで物体を表す計算法は、ちぎれたり砕けたりする現象に強い一方、引っ張ると粒子が勝手に寄り集まったり、力を受けずにぐにゃぐにゃ動く「ずる」の変形が出たりします。この論文は、粒子同士の動きのうち全体の素直な変形からはみ出した部分だけにブレーキをかける工夫で、それを防ぎました。昔の位置を覚えておかなくてよい点が面白いところです。", "unverified": "解像度ごとの粒子数と計算時間、破断後の挙動は未確認（本文を入手できず）。"}}, {"id": "pr08", "rank": 8, "headline": "洪水対策補助の不公平は申請段階で生じる", "title": "Identifying Obstacles to Equitable Flood Mitigation Funding ​", "url": "https://doi.org/10.2139/ssrn.7560610", "authors": "Russell Blessing ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は取得できず", "preprint": true, "p1": "米国ノースカロライナ州東部の住宅314万戸の区画データで、洪水被害軽減の連邦補助（FEMAのHMA）を、受給者だけでなく対象者・申請者の段階まで追い、不公平の最大の分かれ目が申請の段階にあることを示した（未査読）。", "p2": "連邦の洪水対策補助は地方政府の多段階の申請手続きを経て住宅所有者に届くが、従来の研究は誰が受給したかしか見ておらず、誰が対象で誰が申請したかは分からなかった（抄録）。", "p3": "1996〜2020年の78回の洪水への曝露を、FEMAのハザード軽減補助（HMA）の申請と採択の記録と区画単位で結びつけ、浸水した住宅から申請・採択までの各段階の割合と、地域の住宅価値・人種構成の分布を比べた（抄録）。", "p4": "評価は、浸水住宅に対する申請率と申請に対する採択率、繰り返し浸水した住宅と1回だけの住宅の比較、採択住宅と浸水住宅全体の街区単位の住宅価値・人種構成の分布の差（コルモゴロフ・スミルノフ検定）である（抄録）。", "p5": "浸水した202,623戸の約3分の2は申請が1件以上ある自治体にあったが、申請したのは5,746戸（2.8%）で、うち3,432戸（59.7%）が採択された。繰り返し浸水した住宅は約4倍の率で申請した（5.6%対1.5%）が採択率は同程度（58.5%対62.0%）だった。採択住宅は住宅価値が低く黒人の割合が高い街区に偏り（D = 0.13、0.15）、主に買い取りによる（抄録）。", "p6": "抄録からは、申請しない理由は分からず、1州の東部の事例で他地域への一般化は未検証。解釈：費用対効果の高い繰り返し浸水住宅が優先されない理由は、審査基準を見ないと判断できない。", "fun": "洪水の被害を減らす補助金が公平に配られているかを調べるとき、「誰がもらったか」だけを見ても不十分です。この研究は、浸水した家、申請した家、採択された家を一軒ずつつなぎ、浸水した家のうち申請したのは3%未満だったことを明らかにしました。不公平の入口は審査ではなく「申請するかどうか」にある、という発見が面白い点です。", "unverified": "申請しない世帯の特徴と理由、費用対効果の推計方法は未確認（本文を入手できず）。"}}, {"id": "pr09", "rank": 9, "headline": "討論は誤りを正すが回を追うごとに同質化", "title": "Debate Is Not Sampling", "url": "https://doi.org/10.5281/zenodo.23133059", "authors": "Latipov, Aziz", "venue": "Zenodo", "date": "2026-10-04", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "ZenodoのPDF本文（事前登録した仮説、結果の表、図1・2、停止規則の表、限界の節）を読んだ", "preprint": true, "p1": "3体のLLMエージェントによる多ラウンド討論は、投票による集約とは違い、最初の多数派が誤っていた問題でも正解に移れる一方、エージェント間の相関は回ごとに高まり、3ラウンド後にはパネルが実質1票になることを、公開の討論記録9,600件で示した（Zenodoの未査読の技術ノート、事前登録あり）。", "p2": "テスト時スケーリングの理論は、交換可能な標本の多数決は最頻答の正答率に収束し、最頻答が誤りなら標本を増やすほど悪化すると示す。互いの答えを読む反復型の討論にこの上限が当てはまるか、いつ止めるべきかは未解決だった（§1）。", "p3": "討論が「偽装したサンプリング」なら成り立つ3つの予測を事前登録した。最終の多数決は0ラウンドの最頻正答率を超えない（H1）、最頻答が誤りの問題では正答率が回ごとに下がる（H2）、エージェント間の正誤の相関（級内相関ICC）が上がり有効な投票者数 n_eff = 3/(1+2ρ) が1に近づく（H3）（§3）。", "p4": "DebateLedgerの公開データ（同じモデル3体、全員の答えを見る3ラウンド、16構成）で、質問単位のクラスタ・ブートストラップ（2,000回）の95%区間と、事前に定めた判定規則（±3ポイントの帯など）で評価した（§3）。", "p5": "H1は上向きに反証され、弱いモデルでは最終の多数決が0ラウンドの最頻正答率を6〜20ポイント上回った（抄録・表）。H2も反証され、Qwen3-4Bでは0ラウンドで3体とも誤った793問の31%が正しい多数に至った（図2）。H3aは全16ファイルで成り立ち、ICCは0.48〜0.91から0.62〜0.99へ上がりn_effは1.0〜1.3になった（図1）。全員一致で止める規則は3ラウンド固定との差を1.5ポイント以内に保った（§6）。", "p6": "主要なQwen3-8Bの行は0ラウンドの正答率が異常に低く、0ラウンドと以降でプロンプトが違うため改善の一部は引き出し方の違いの可能性がある。対象は同じモデル3体・多肢選択・3ラウンドで、15体の異質なエージェントを使う系には直接当てはまらないと著者は述べる（§7）。", "fun": "3人のAIに同じ問題を解かせ、互いの答えを見せて話し合わせると、正解率は上がるのか。この研究では、3人とも最初は間違えていた問題でも、話し合いで正解にたどり着くことがありました。一方で、話し合うほど3人の意見が似てきて、3ラウンド後には実質1人分の票しかない状態になりました。会議では人数より意見の独立性が大事、という人間の組織にも通じる発見が面白い点です。", "unverified": "0ラウンドと以降のプロンプトの違いによる効果を除いた、討論そのものの効果は未確認（著者も次の実験課題としている）。"}}, {"id": "pr10", "rank": 10, "headline": "希少疾患児の親の遺伝的罪悪感を測る尺度", "title": "Neurogenetic Stigmatization and Bio-Sociological Burden in Parents of Children with Rare and Genetic Diseases: Development and Validation of the Genetic Guilt and Psychosocial Burden Scale (GGPBS)", "url": "https://doi.org/10.21203/rs.3.rs-10927774/v1", "authors": "Gülçin ITIRLI ASLAN ほか", "venue": "Research Square (In Review)", "date": "2026-10-04", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research Squareの本文（方法・結果・限界の節と本文中の数値）を読んだ。表は崩れた形式で取得", "preprint": true, "p1": "希少疾患・遺伝性疾患の子をもつ親の「遺伝的な罪悪感」や社会的スティグマなどの心理社会的負担を測る55項目・5因子の尺度（GGPBS）を、トルコの親を対象に3段階で開発・検証した（未査読プレプリント）。", "p2": "保因者としての罪悪感、社会的スティグマ、二次的外傷を含む「神経遺伝的スティグマ」は質的研究では記述されてきたが、検証済みの量的な測定道具がなかった（序論・§1.1）。", "p3": "第1段階で文献・親15人への面接・専門家8人の検討から68項目を作り、内容妥当性指数で55項目に絞った。第2段階で親247人に探索的因子分析（主因子法・プロマックス回転）、第3段階で別の親312人に確認的因子分析（最尤法）を行い、68人で4週間後の再検査信頼性を測った（§2.1・3.1）。", "p4": "因子構造の適合（CFI・TLI・RMSEA・SRMR、事前の良好基準はCFI・TLI>0.95など）、内的一貫性（α）、再検査の相関、育児ストレス尺度（PSI-SF）とうつ尺度（BDI-II）との収束的妥当性、血族婚の有無による差で評価した（§2.5）。", "p5": "5因子で分散の67.42%を説明し、確認的因子分析はχ²/df=2.34、CFI=0.95、TLI=0.94、RMSEA=0.06、SRMR=0.05だった（§3.2・3.3）。全体のαは0.96、再検査はr=0.89で、PSI-SFとr=0.74、BDI-IIとr=0.68の相関を示した（§3.4・3.5）。血族婚の群は負担が高く（全体でd=0.78）、遺伝カウンセリングの受診は負担の低さと結びついた（r=−0.28）（§3.7・3.8）。", "p6": "1つの臨床の場からの標本、横断デザイン、トルコ語のみ、自己申告という限界を著者が挙げる（§4.5）。解釈：TLIは著者自身の良好基準をわずかに下回り、倫理承認の日付（2025年1月）がデータ収集期間（2024年1〜7月）より後に記載されている点は確認が要る。", "fun": "生まれつきの病気をもつ子の親は、「自分の遺伝子のせいでは」という罪悪感や周囲の目に苦しむことがあります。この研究は、その見えにくい心の負担を5つの側面に分けて点数で測れる質問票を作りました。いとこ同士などの血族婚の家庭で負担が大きく、遺伝カウンセリングを受けた親ほど負担が軽いという結果は、支援の手がかりとして面白い点です。", "unverified": "表1の各項目の因子負荷量は表の形式が崩れていて確認しきれていない。倫理承認の日付の食い違いの理由は未確認。"}}, {"id": "pr11", "rank": 11, "headline": "国有企業は販管費の下方硬直性が強い", "title": "State Ownership and Cost Stickiness: Evidence from Indonesian Firms", "url": "https://doi.org/10.2139/ssrn.7557005", "authors": "Pablo Vivaldi Carensa ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は取得できず", "preprint": true, "p1": "インドネシア企業1,049社・5,152社年で、国有企業は売上が伸びるときに販管費をより積極的に増やし、売上が落ちても削りにくい「コストの粘着性」が民間企業より強いことを示した（未査読）。", "p2": "背景：コストの粘着性（売上減少時のコスト削減が、売上増加時のコスト増加より小さい現象）は経営者の調整費用や動機で説明され、所有構造による統治環境の違いがその判断を左右するかが問われてきた。新興国の国有企業での証拠は限られていた（抄録）。", "p3": "2015〜2024年のパネルで、売上の増減に対する販管費の変化の非対称性を推定するモデルに国有企業の区別を入れ、COVID-19期とそれ以外で比べた（抄録）。", "p4": "評価は、全体での粘着性の大きさ（先行研究との比較）、国有企業と民間企業の差、売上増加期の上方への非対称と粘着性がCOVID-19期に限られるかどうかである（抄録）。", "p5": "全体の粘着性は先行研究と同程度だった。国有企業は売上増加期に販管費をより大きく増やし、粘着性も有意に大きかった。上方の非対称はCOVID-19期に限られた一方、国有企業の強い粘着性は全期間で続き、一時的な危機対応ではなく所有に伴う構造的な統治の特徴と解釈された（抄録）。", "p6": "抄録からは、係数の大きさ、国有企業の定義、業種構成の違いの統制は分からない。解釈：国有企業が雇用維持などの政策的な役割を担う場合、粘着性は非効率ではなく政策目的の結果の可能性もあり、区別は本文の分析次第である。", "fun": "会社は売上が減ると経費を削るはずですが、実際には、増えるときほど素早くは減らせない「経費の粘り」があります。この研究は、インドネシアの国有企業ではその粘りが民間企業より強く、コロナ禍の一時的な事情ではなく、どの時期でも続いていたことを示しました。持ち主が国か民間かで経費の動き方まで変わるという点が面白いところです。", "unverified": "推定モデルの具体的な形と係数の大きさ、国有企業の定義は未確認（本文を入手できず）。"}}, {"id": "pr12", "rank": 12, "headline": "農村の高齢者と作るIoTリビングラボの教訓", "title": "Participatory Technology Development for Aging in Place in a Rural Community: A Qualitative Living Lab Study (Preprint)", "url": "https://doi.org/10.2196/preprints.113551", "authors": "Christine Halbig ほか", "venue": "JMIR Preprints", "date": "2026-10-04", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsに登録された抄録（Crossref経由）を使用。本文は取得できず", "preprint": true, "p1": "ドイツの農村に、IoT機器を備えた模擬住居と工作室からなる参加型のリビングラボ（LoRaLAB）を作り、高齢者が地域で暮らし続けるための技術を高齢者と一緒に試した経験から、技術開発だけでは不十分で、地域に学び合いの仕組みを作ることが鍵だと示した（未査読）。", "p2": "人口変化・ケア資源の不足・人手不足は農村の高齢者支援で特に深刻で、IoT技術は自立した暮らしを助けうるが、高齢者の日常の必要・能力・暮らしの文脈を反映しない技術は生かされにくい（抄録）。", "p3": "探索的な質的研究で、参加型ワークショップと付随するフォーカスグループを高齢者と行い、国内の類似の取り組みの関係者への専門家面接を加えた。録音を書き起こしてMayringの質的内容分析を行い、観察・思考発話・研究メモ・研究日誌で文脈を補った（抄録）。", "p4": "高齢者の参加、ラボの基盤、技術の用途の感じ方、持続と移転の条件の相互関係を明らかにすることが目的で、数値の効果指標ではなく、語りから得られる主題の整理で評価した（抄録）。", "p5": "高齢者63人が参加し50人を分析に含め、専門家32人が意見を寄せた。高齢者は技術の高度さより日常の必要や既存の対処の仕方に照らして評価し、有用性・使いやすさ・費用・頼れる技術支援を重視した。参加の形式やラボの発展にも参加者が影響した。専門家は安定した組織、長期の資金、地域のネットワーク、熱心な担い手、身近な支援を持続の条件に挙げた（抄録）。", "p6": "抄録からは、参加者の属性、地域の特徴、試した技術の具体的な種類は分からない。研究資金の期限を越えた継続には参加・地域の協働・技術支援・組織の継続が要ると著者は述べる。解釈：1か所の質的事例で、他地域への移転可能性は今後の検証による。", "fun": "高齢者のための便利な機械を作っても、使われなければ意味がありません。この研究では、農村の高齢者が実際に暮らせる部屋で機器を試し、「何がすごいか」より「自分の毎日の困りごとに役立つか」「困ったときに助けてもらえるか」で判断していることが分かりました。技術そのものより、地域に相談できる場を作ることが大事だという結論が面白い点です。", "unverified": "試した具体的な機器と、参加者の年齢・健康状態の内訳は未確認（本文を入手できず）。"}}, {"id": "pr13", "rank": 13, "headline": "1回の加振で梁の粘弾性の周波数依存性を推定", "title": "Estimation of frequency dispersion of viscoelasticity over a wide frequency range using the center impedance method- Noise reduction by eliminating vibration modes other than symmetric bending and proposal of a simplified viscoelastic model -", "url": "https://doi.org/10.2139/ssrn.7560530", "authors": "Ryuzo Horiguchi ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は取得できず", "preprint": true, "p1": "薄い梁の中央を加振する中央インピーダンス法の1回の室温測定から、貯蔵弾性率と損失係数の周波数依存性を広い周波数帯で推定し、それを周波数の陽な関数で表す簡易な粘弾性モデルを提案した（未査読）。", "p2": "背景：減衰の評価によく使う半値幅法は共振ピークごとの評価になり、損失係数の大きい材料や広い周波数帯を1回の測定で評価するのは難しい。この研究はそれを周波数応答関数の逆解析で行う（抄録）。", "p3": "運動方程式の解析解から導いた、加振点の速度と加振力の周波数応答関数（FRF）を、複素波数と粘弾性の関係を介して逆解析する。ノイズを除くため複素波数と周波数の関係を曲線で当てはめ、FEMのモード解析で見つけたねじれ・非対称曲げモードの周波数付近のFRFは除外した（抄録）。", "p4": "推定の物差しは、広い周波数帯での貯蔵弾性率と損失係数の推定と、回帰曲線のパラメータから作る簡易モデルの非線形最小二乗による当てはめである。比較対象や誤差の数値は抄録にない（抄録）。", "p5": "簡易モデルでは、貯蔵弾性率は周波数帯のほとんどで一定で、損失係数と周波数の関係はガンマ分布の確率密度に比例する形になった。形状パラメータp=2のとき、インパルス応答の振動が最も速く減衰する（抄録）。", "p6": "抄録からは、対象材料、周波数帯の範囲、推定精度の検証（他の測定法との比較）は分からない。解釈：対称曲げ以外のモードの除外にFEMの事前解析が要り、形状の複雑な試験片への拡張性は未知である。", "fun": "物の「揺れの止まりやすさ」（減衰）は、ふつう揺れのピークの形から1つずつ測ります。この研究は、梁の真ん中を揺らしたときの応答を式で逆にたどり、1回の測定で幅広い周波数の硬さと減衰をまとめて求めました。減衰の周波数による変わり方が、確率で習うガンマ分布の形で表せるというのが意外で面白い点です。", "unverified": "対象材料、周波数範囲、推定精度の検証は未確認（本文を入手できず）。"}}, {"id": "pr14", "rank": 14, "headline": "老朽化した大型ダンプは固有振動数が下がる", "title": "Vibration characteristics of Aging Haul Trucks using Modified Operational Transfer Path Analysis", "url": "https://doi.org/10.2139/ssrn.7560249", "authors": "Dhany Arifianto ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は取得できず", "preprint": true, "p1": "稼働時間の異なる大型ダンプトラック（コマツHD-785）で、エンジンから運転席などへの振動の伝わり方を修正した運転時伝達経路解析（MOTPA）で調べ、古い車両ほど固有振動数が下がり、運転席への振動伝達が大きくなることを示した（未査読）。", "p2": "背景：重機の老朽化は振動の増加や乗り心地の悪化につながるが、振動がどの経路でどれだけ伝わるかを経年で比べ、年数に応じた保守に生かす評価は限られていた（抄録）。", "p3": "稼働5,000時間・10,000時間・30,000時間の車両で、650rpmと1,600rpmの運転時に振動を測った。有限要素解析・解析モデル・実験モード解析で固有振動数と周波数応答関数（FRF）を求め、運転時の加速度とFRFを掛けて伝達経路解析（TPA）の力を計算した（抄録）。", "p4": "評価は、3つの方法による最初の5つの固有振動数の一致、経年によるFRFの変化、エンジンから運転席への伝達率、各受振点のTPA力の大きさである（抄録）。", "p5": "3つの方法はいずれも最初の5つの固有振動数を推定でき、経年とともに固有振動数はFRF上で低い側へずれた。アイドリング時の運転席への伝達率は新しい・中程度の車両で45%未満、古い車両で55%を超え、古い車両では20〜43Hzで座面と背もたれのTPA力が大きかった（抄録）。", "p6": "抄録からは、経年以外の差（整備履歴や部品交換など）の扱い、測定の繰り返しや統計的な不確かさは分からない。解釈：経年段階ごとの車両数が少なければ、経年の効果と個体差を分けるのは難しい。", "fun": "同じ型のダンプでも、長く使うと揺れ方が変わります。この研究は、新しい車・中くらいの車・古い車を比べ、使い込むほど車体の「揺れやすい周波数」が下がり、エンジンの揺れが運転席に伝わりやすくなることを示しました。揺れ方の変化を、年数に応じた保守の目安にしようという考え方が面白いところです。", "unverified": "各稼働時間の車両の台数と、個体差の扱いは未確認（本文を入手できず）。"}}, {"id": "pr15", "rank": 15, "headline": "アンサンブルカルマンで気泡モデルの係数を較正", "title": "Ensemble Kalman filter calibration of Eulerian–Lagrangian cavitation models: Enhanced mesoscale bubble statistics with preserved macroscale dynamics", "url": "https://doi.org/10.2139/ssrn.7560615", "authors": "Beichen Tian ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用。本文は取得できず", "preprint": true, "p1": "大きな蒸気空洞と小さな気泡が共存するキャビテーション流れのオイラー・ラグランジュ連成モデルで、気泡の発生・成長・凝縮と記述の切り替えを決める経験係数を、計測した気泡径分布のアンサンブルカルマンフィルタ（EnKF）同化で較正し、別条件でも予測できることを示した（未査読）。", "p2": "双方向連成のオイラー・ラグランジュ法は多スケールの構造を扱えるが、予測精度は気泡の核生成・成長・凝縮の係数と、オイラー記述とラグランジュ記述の切り替え基準という経験的な係数に強く左右される（抄録）。", "p3": "NACA66翼まわりのキャビテーション流れで、4つの主要パラメータについてラテン超方格抽出で30組の事前アンサンブルを作り、デジタルインラインホログラフィーで測った気泡径分布を逐次同化してパラメータを更新した（抄録）。直観：多数の候補の係数で計算し、観測との差が小さくなる方向へ係数の分布をまとめて動かしていく。", "p4": "評価は、気泡径分布の再現（全変動距離、RMSE、決定係数）と、較正し直さずに別のキャビテーション数で、衝撃波で駆動される雲状キャビテーションとシート状キャビテーションの実験と一致するかである（抄録）。", "p5": "最適化した係数は核生成圧力係数1.4、成長係数0.0075、凝縮係数0.0031、切り替えの臨界蒸気体積率0.65で、全変動距離は1.215から0.1351へ、RMSEは0.374から0.00373へ下がり、決定係数は0.2112から0.9925へ上がった。別のキャビテーション数でも実験とよく一致した（抄録）。", "p6": "抄録からは、係数の不確かさ（事後分布の幅）、計算コスト、他の翼形状への移転は分からない。解釈：アンサンブルが30組と小さく、相関した4つの係数が一意に定まるか（識別性）は本文で確かめる必要がある。", "fun": "船のスクリューの周りでは、水の圧力が下がって泡が生まれ、つぶれるときに金属を傷めるほどの衝撃を出します。この研究は、泡のでき方を決める「よく分からない係数」を、実際に撮った泡の大きさの分布と照らし合わせながら少しずつ直していく、天気予報で使う技術（データ同化）で決めました。一度合わせた係数が別の条件でもそのまま使えた点が面白いところです。", "unverified": "係数の不確かさ（事後分布の幅）と計算コストは未確認（本文を入手できず）。"}}, {"id": "pr16", "rank": 16, "headline": "5つのLLMの合議で文献の選別と抽出を自動化", "title": "Development and Accuracy Evaluation of an LLM-Assisted Workflow for Screening and Data Extraction in Large-Scale Syntheses", "url": "https://doi.org/10.31234/osf.io/wrc9x_v1", "authors": "Vsevolod Scherrer ほか", "venue": "PsyArXiv", "date": "2026-10-04", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "PsyArXivに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "5つのLLMインスタンスを合議させる手順で、大規模なメタ分析の文献選別とデータ抽出を、人の確認を抽出段階に絞って行えるようにした（未査読プレプリント）。", "p3": "題名・抄録の選別、全文の選別、効果量の抽出の3段階すべてで5つのLLMの判定を集約し、2,960通りの設定を人手の正解（892件、うち評価用692件・効果量102個）と比べた（抄録）。", "p5": "人の確認なしで第1・第2段階は対象論文の96.72%と100.00%を残した。抽出では、規則ベースで取り出した本文から効果量の35.05%を見落としたが、機械学習によるPDF解析の本文では見落としがなく、誤りも10.16%から2.61%に減った（抄録）。", "fun": "論文を何千本も読んでまとめる作業をAIに任せられるかという問いです。面白いのは、AIの賢さより「PDFから文字をどう取り出すか」という下ごしらえで結果が大きく変わった点です。5つのAIに判定させ、選別では甘めに、抽出では厳しめに票をまとめるという、多数決の決め方の工夫も効いています。", "unverified": "推奨設定で使ったモデル名と費用は未確認（本文を入手できず）。"}}, {"id": "pr17", "rank": 17, "headline": "証拠の十分性は小さな較正モデルが判定上手", "title": "Calibrated Gating in Financial RAG: Small External Controllers versus LLM Self-Assessment across Model Scales", "url": "https://doi.org/10.2139/ssrn.7553938", "authors": "Hsiang-Jun Mon ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "検索拡張生成（RAG）で「検索するか」「証拠は足りるか」「答えを出してよいか」を決める判定役として、LLMの自己評価、外部のLLM審判、小さな較正モデルのどれが向くかを、モデルの規模ごとに比べた（未査読）。", "p3": "0.3Bの較正済み判定モデル（Laya）、LLMの較正済み自己評価、同じ骨格のクロスエントロピー分類器、LLM審判の4つを、0.6B〜14BのQwen3の5サイズで、金融の資格試験・株価変動予測・報告書の数値推論について、情報漏れのない手順で評価した（抄録）。", "p5": "答えの正しさでは、0.6B・1.7Bでは外部のLLM審判が自己評価より良く、4B以上では自己評価が8Bの審判を上回った。証拠の十分性ではLayaと分類器がAUROC 0.80、ECE 0.02で最も良く、LLMの自動採点はECEが約0.3だった（抄録）。", "fun": "AIが自分の答えにどれだけ自信を持ってよいかを、誰に判定させるべきかという問題です。小さいAIは自分のことを見誤りやすく、大きいAIは自分で判断した方が他の審判より正確になるという、規模によって答えが逆転する点が面白いところです。「証拠が足りているか」の判定は、専用に鍛えた小さなモデルが上手でした。", "unverified": "Layaの学習データと判定の閾値の決め方は未確認（本文を入手できず）。"}}, {"id": "pr18", "rank": 18, "headline": "多数決の利得は多様性指標より正答率で予測できる", "title": "The Control Ate the Signal", "url": "https://doi.org/10.5281/zenodo.23133020", "authors": "Latipov, Aziz", "venue": "Zenodo", "date": "2026-10-04", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された短い抄録（DataCite経由）を使用", "preprint": true, "short": true, "p1": "複数の判定者の多数決が最良の1人をどれだけ上回るかを、各判定者の正答率だけから非線形に予測できることを示した（Zenodoの未査読の短い報告）。", "p3": "依存関係の項を持たない異質なコンドルセ模型（判定者ごとに正答率が異なる多数決の確率模型）で多数決の利得を予測し、線形に調整した多様性指標と比べた。公開の4つの正誤行列を使い、事前登録した（抄録）。", "p5": "コンドルセ模型は利得をスピアマン相関0.80で予測し、多様性指標は0.20にとどまった。四分相関による依存の推定を加えても0.01しか上がらなかった（抄録）。", "fun": "「みんなで多数決すれば、一番賢い人より正しくなれるか」という古くからの問いです。よく「メンバーの多様性が大事」と言われますが、この報告では、多様性の指標より各メンバーの正答率の組み合わせだけで多数決の得がよく予測できました。18世紀のコンドルセの陪審定理が、今の多数決の評価にも生きているのが面白い点です。", "unverified": "4つの正誤行列が何の課題のどの判定者（LLMか人か）のものかは未確認（抄録が短く本文を入手できず）。"}}, {"id": "pr19", "rank": 19, "headline": "物理的気候リスクは石油ガス企業の価値を下げる", "title": "Physical Climate Risk, Tobins’Q and Credit Risk: Evidence from the Oil and Gas Industry", "url": "https://doi.org/10.2139/ssrn.7560486", "authors": "ANTONIO GARCÍA-AMATE ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "石油・ガス企業で、物理的な気候リスクへの曝露が企業価値を下げる一方、信用リスクには表れないことを示した（未査読）。", "p3": "企業レベルのデータで、物理的気候リスクの曝露とトービンのq（市場価値と資産の再取得価格の比）、およびブラック・ショールズ・マートン模型で測った信用リスクとの関係を分析した（抄録）。", "p5": "曝露が大きいほどトービンのqが低く、特に小規模企業と上流部門で強かった。信用リスクとの関係は見られず、相対評価の指標や確率ゼロの観測を除いた標本でも結果は変わらなかった（抄録）。", "fun": "気候変動による災害リスクを、株式市場と借金の世界がどう値付けしているかを比べた研究です。株主は気候リスクを企業価値の割引として織り込むのに、貸し手側の倒産確率の指標には表れない、という食い違いが面白い点です。同じ企業でも、誰の目で見るかでリスクの見え方が違うことを示しています。", "unverified": "標本の期間・企業数と、物理的気候リスクの具体的な測り方は未確認（本文を入手できず）。"}}, {"id": "pr20", "rank": 20, "headline": "多主体の時系列から系全体の変化点を即時検出", "title": "On Multi-entity, Multivariate Quickest Change Point Detection", "url": "https://doi.org/10.2139/ssrn.7560445", "authors": "Bahar Kor ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "数が増減し互いに影響し合う多数の主体の多変量時系列から、系全体の振る舞いの変化を遅れ少なくオンラインで検出する教師なしの方法を示した（未査読）。", "p3": "各主体の通常からのずれ（IDfN）を求めて系全体の異常スコア（SWAS）に集約し、CUSUM（累積和）による逐次検出をかける2段階の手順で、学習には通常時のデータだけを使う（抄録）。", "p5": "合成データと群衆シミュレーションで系全体の変化を正確に検出できたとし、評価用に多主体・多変量のデータセットを3つ公開した。検出遅れなどの数値は抄録にない（抄録）。", "fun": "広場の人の流れのように、一人ひとりの動きは揺らいでも、集団全体の様子が急に変わる瞬間を見つけたい、という問題です。人数が途中で増えたり減ったりしても学習し直さずに使える点が工夫で、個人を映像で追わずに済むため、プライバシーにも配慮できます。", "unverified": "検出遅れ・誤検出率などの数値と比較手法は未確認（本文を入手できず）。"}}, {"id": "pr21", "rank": 21, "headline": "飲食店のAIチャットボット利用は信頼が鍵", "title": "AI chatbots in the food and beverage industry: Trust, privacy calculus, and customer engagement in a developing economy", "url": "https://doi.org/10.1016/j.chbr.2026.101274", "authors": "Frough, Eid Mohammad", "venue": "Zenodo", "date": "2026-10-04", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用", "preprint": true, "short": true, "p1": "マレーシアのカフェ利用者595人の調査で、飲食店のAIチャットボットの利用が、便益とプライバシーの不安を比べたうえでの「信頼」で決まることを示した（Zenodoの未査読文書）。", "p3": "技術受容の統合理論UTAUT2とプライバシー計算（便益とリスクの比較）を、信頼を媒介につないだモデルを、横断調査とPLS-SEM（部分最小二乗法の構造方程式モデル）で推定した（抄録）。", "p5": "期待される成果・使いやすさ・楽しさ・習慣が利用意図を強め、意図と習慣が実際の利用と結びついた。知覚した便益は信頼を高め、プライバシーのリスクは信頼を下げ、信頼は満足と直接・間接に結びついた（抄録）。", "fun": "店のチャットボットを使うかどうかは、便利さだけでなく「この店に個人情報を渡しても大丈夫か」という損得勘定で決まる、という話です。便利さと不安のてんびんの間に「信頼」という支点を置いて説明したのが工夫です。年齢によって楽しさの効き方が違う点も、身近な実感と合っています。", "unverified": "標本の抽出方法と、各経路の係数の大きさは未確認（本文を入手できず）。"}}, {"id": "pr22", "rank": 22, "headline": "精神科病棟の安全事故とチームの特性", "title": "How do staff and team characteristics relate to ward safety incidents in adult inpatient mental health settings? A systematic integrative review.", "url": "https://doi.org/10.21203/rs.3.rs-11205262/v1", "authors": "Bethany Griffin ほか", "venue": "Research Square (In Review)", "date": "2026-10-04", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "精神科の成人入院病棟の安全事故とスタッフ・チームの特性の関係について、33か国135本の研究を統合し、人数や属性より対話・共感・チーム文化の方が一貫した手がかりであることを整理した（未査読）。", "p3": "6つのデータベースを1999年以降で検索した系統的統合レビューで、混合研究の評価ツール（MMAT）で質を評価し、帰納的な叙述的統合で分析した（抄録）。", "p5": "135本（量的80、質的46、混合9）を4テーマに整理した。スタッフの言葉や声の調子、患者への関わりやすさ、共感の影響が最も一貫し、人数・属性・経験の影響は一貫しなかった（抄録）。", "fun": "病棟の事故を減らすには「スタッフを増やせばよい」と考えがちですが、135本もの研究をまとめると、人数の効果ははっきりしませんでした。むしろ、話し方や共感、チームの雰囲気といった人と人の関わり方の方が一貫して効いていた、という発見が面白い点です。数より関わりの質という、職場一般にも通じる見方です。", "unverified": "テーマごとの研究数と効果の向きの内訳は未確認（本文を入手できず）。"}}, {"id": "pr23", "rank": 23, "headline": "AI不安が業績に与える影響は評価次第で分かれる", "title": "Artificial Intelligence Anxiety and Employee Performance: A Systematic Literature Review of Job Insecurity, Threat–Challenge Appraisal, Coping, Career Resilience, and Organisational Buffers", "url": "https://doi.org/10.5281/zenodo.23137500", "authors": "Kondagekar, Darpan Sudhakar", "venue": "Zenodo", "date": "2026-10-04", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録（DataCite経由）を使用", "preprint": true, "short": true, "p1": "従業員のAI不安が業績に与える影響を、「脅威」と受け止める経路と「挑戦（機会）」と受け止める経路の2つで整理した系統的文献レビュー（Zenodoの未査読文書）。", "p3": "公開の学術文献と提供されたコーパスを、複数の概念的な検索と引用の前後をたどる方法で集め、質的な主題統合でまとめた。認知的評価理論、資源保存理論、仕事の要求度-資源モデルを統合した（抄録）。", "p5": "脅威の経路では雇用不安・情緒的消耗・離脱を通じて業績が下がりうるとし、機会の経路では学習やジョブ・クラフティングを通じて業績を支えうるとした。緩衝要因としてキャリアのレジリエンス、AI自己効力感、研修、支援的なリーダーシップなどを挙げた（抄録）。", "fun": "同じAIの導入でも、ある人は「仕事を奪われる」と感じ、別の人は「新しい道具だ」と感じます。この受け止め方の違いが業績を下げるか上げるかを分ける、という見方を整理した文献レビューです。テスト前の緊張がやる気にも不安にもなるのと似ていて、心の受け止め方で結果が変わるという考え方が面白い点です。", "unverified": "採用した文献の本数と選定基準は未確認。ScopusやWeb of Scienceを網羅的には検索していないと著者が述べている（抄録）。"}}, {"id": "pr24", "rank": 24, "headline": "多エージェント討論と検索で偽ニュースを検出", "title": "MARC-FEND:Multi-agent and Retrieval-augmented Cross-modal Fake News Detection", "url": "https://doi.org/10.2139/ssrn.7560524", "authors": "ziheng wang ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "画像と文章の意味の食い違い、異質な専門家役の多エージェント討論、検索による最新の事実確認を組み合わせ、SNSの偽ニュースを解釈可能な形で検出する枠組みを提案した（未査読）。", "p3": "クロスモーダルな注意機構と、文章の実体・画像の物体・出来事をつなぐ異種知識グラフで意味の関係を捉え、事実確認の専門家を模したエージェントが証拠に基づいて討論し、検索拡張生成で証拠を取り寄せて論理的な矛盾を調べる（抄録）。", "p5": "Weibo21で正解率96.1%・F1 95.9%、Twitterで正解率94.2%・F1 94.1%となり、既存の最先端手法を上回ったとする（抄録）。", "fun": "偽ニュースを見抜くのに、1人のAIに判断させるのではなく、立場の違う何人もの「AI記者」に議論させ、さらに最新のニュースを検索して裏を取らせる、という仕組みです。人間の編集部の校閲をまねた発想が面白い点です。写真と記事の内容が食い違っていないかも確かめます。", "unverified": "比較した既存手法と、討論のエージェント数・使用したLLMは未確認（本文を入手できず）。"}}, {"id": "pr25", "rank": 25, "headline": "PINNで層状砂岩のモードIII破壊則を同定", "title": "Identifying bedding-dependent Mode III fracture laws in sandstone using physics-informed neural networks", "url": "https://doi.org/10.2139/ssrn.7560619", "authors": "Pengcheng Zhu ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "層状の砂岩のモードIII（面外せん断）破壊について、表面の変位の計測と荷重から、内部のすべりの分布と結合力則（すべりと応力の関係）を同時に同定できるようにした（未査読）。", "p3": "界面の場を学習する縮約型の物理情報ニューラルネット（PINN）を固定の3次元弾性演算子で釣り合いと観測に結びつけ、層理の向きごとに切欠き深さの異なる試験片で構成則を共有させた。27枚の砂岩円板のうち18枚で同定し、9枚で再現性を評価した（抄録）。", "p5": "最大荷重の平均絶対相対誤差は0°・45°・90°で8.03%、6.84%、2.72%だった。45°と90°では最大荷重付近で応力がリガメントのほぼ全体に広がり、当てはめた最大強度は7.34MPaと14.39MPaだった（抄録）。", "fun": "岩を割るとき、内部で何が起きているかは直接見えません。この研究は、表面のわずかな変位の記録から、見えない内部の「すべり方のルール」をAIと力学の式を組み合わせて逆算します。層理の向きが45°と90°では当てはめた強さが2倍近く違い、その理由を局所的な強さと力を支える面積で説明できた点が面白いところです。", "unverified": "0°の最大強度の値と、従来の同定法との比較は未確認（本文を入手できず）。"}}, {"id": "pr26", "rank": 26, "headline": "合成画像で石積みのひび割れ検出を強化", "title": "A Framework for Generating Labelled Synthetic Masonry Damage Images for Computer Vision-Based Infrastructure Inspections", "url": "https://doi.org/10.2139/ssrn.7560001", "authors": "Jianyu Zhang ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "Blenderで石積み壁の形状・材質・ひび割れを同時に制御した合成画像と画素単位のラベルを作り、実画像の少ない石積みのひび割れ検出の学習を補えることを示した（未査読）。", "p3": "壁の幾何、材料の見た目、ひび割れの形を石積みの配置と結びつけて生成する手法（BCGデータセット）で、MCrack1300の固定の検証区分を使い、実画像1,000枚に合成画像3,000枚を加えた学習を3回反復して比べた（抄録）。", "p5": "ひび割れマスクのmAP50-95の平均は0.294から0.324に上がり、より少ない実画像では3つのアーキテクチャで改善した。1枚の壁を6方向から撮った外部画像では、最良のひび割れIoUの平均が0.284で、実画像のみの0.197を上回った（抄録）。", "fun": "AIにひび割れを見つけさせるには、ひび割れの位置を画素ごとに塗り分けた大量の写真が必要ですが、それを人手で作るのは大変です。そこで3DCGソフトで本物らしい壁とひび割れを作り、答え付きの練習問題として使いました。石の積み方とひび割れの走り方を結びつけて作ったのが工夫で、CGの技術が点検に役立つのが面白い点です。", "unverified": "生成器の開発に学習区分の実画像を使ったことの影響の大きさと、外部検証の条件の詳細は未確認（本文を入手できず）。"}}, {"id": "pr27", "rank": 27, "headline": "地下水を含む水文・土砂の統合モデルを検証", "title": "Investigating the Influence of Groundwater Flow on Sediment Transport Using an Integrated Hydrology-Sediment Modeling Framework: Model Development, Verification and Validation", "url": "https://doi.org/10.2139/ssrn.7560604", "authors": "Quan Wei ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "表流水と地下水を一体で計算する分布型の水文モデルに土砂の生産と輸送を組み込み、地下水の流れが土砂輸送に与える影響を流域規模で調べられるようにした（未査読）。", "p3": "物理ベースの完全分布型モデルHydroGeoSphereに、MUSLE式による土砂生産量の推定とメッシュ上の土砂の経路計算を結合した。理想化した斜面で経路計算を検証し、カナダ・オンタリオ州の流域の6つの観測所で妥当性を確かめた（抄録）。", "p5": "浮遊土砂濃度の範囲と時間変動をおおむね再現し、観測所ごとのR²は0.40〜0.73、RMSEは4.35〜13.83mg/Lだった。6か所中4か所はR²0.66〜0.73と一致が良く、残りは出水時の時刻のずれや観測の少なさなどによるとした（抄録）。", "fun": "川の濁りは、雨が地表を流れて土を削るだけでなく、地下の水の流れにも左右されます。この研究は、地表と地下の水の動きを一つの計算にまとめたうえで土砂の動きを追えるようにしました。見えない地下水が川の濁りにどう効くかを調べる道具を作った点が面白いところです。", "unverified": "地下水の有無で土砂輸送がどれだけ変わるかの定量的な結果は未確認（本文を入手できず）。"}}, {"id": "pr28", "rank": 28, "headline": "局地気候区分と微気象モデルで暑熱対策を評価", "title": "From urban scale to pedestrian level: Integrating LCZs, remote sensing, and ENVI-met for urban heat and green infrastructure assessment​", "url": "https://doi.org/10.2139/ssrn.7560979", "authors": "Camila Amaro de Souza", "venue": "SSRN", "date": "2026-10-04", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "ブラジルのカンポグランデで、都市全体の地表面温度の診断と街区の微気象シミュレーションを組み合わせ、市街地の形ごとに緑化策の暑熱緩和効果を評価した（未査読）。", "p3": "局地気候区分（LCZ）、衛星による地表面温度と地表ヒートアイランド強度、ENVI-metによる微気象計算、体感温度の指標UTCIを組み合わせ、LCZ3・5・6の代表区域で5つのシナリオを比べた（抄録）。", "p5": "平均地表面温度はLCZ A（密な樹林）で28.21℃と最も低く、LCZ D（低い植生）で33.96℃と最も高かった。樹木の増加はUTCIをLCZ3・5・6でそれぞれ0.39℃、0.16℃、0.75℃下げ、屋上緑化を加えても歩行者の高さでの追加効果は見られなかった（抄録）。", "fun": "街を涼しくするには木を植えるのがよいのか、屋上を緑にするのがよいのかを、街並みのタイプごとに比べた研究です。歩く人の体感では木を増やすことが効き、屋上緑化を足しても上乗せが見られなかったという結果が意外な点です。同じ緑化でも、どこに緑を置くかで効き方が違うことを示しています。", "unverified": "シミュレーションの気象条件と対象日の詳細は未確認（本文を入手できず）。"}}, {"id": "pr29", "rank": 29, "headline": "AIが作る財務報告をリスクに応じて人が点検", "title": "A Risk-Tiered Human-Review Framework for AI-Generated Financial Reports", "url": "https://doi.org/10.2139/ssrn.7553960", "authors": "Preksha Barjatya", "venue": "SSRN", "date": "2026-10-04", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "AIが作る財務報告について、データの品質と誤りの影響の大きさに応じて人の点検の強さを3段階に分ける概念的な枠組みを提案した（未査読、実証はしていない）。", "p3": "データガバナンス、データ品質管理、人が関与する監督、自動化バイアス（機械の出力を過信する傾向）の文献をレビューし、品質スコアと影響の分類で点検の段階を割り当てる。重大な出力には最低限の点検を課し、最も軽い段階は無作為に抜き取り、段階の見直しと品質スコアの定期的な検証を組み込む（抄録）。", "p5": "レビューした文献では、点検の強さをデータ品質と誤りの影響の両方に結びつけた研究が少ないと指摘した。枠組みは提案にとどまり、品質スコアの信頼性に依存することを著者が限界として挙げている（抄録）。", "fun": "AIが書いた報告書を人が全部同じ熱心さで確かめるのは非効率で、しかも人はAIの出力を信じすぎる傾向があります。そこで「データが怪しいか」「間違えると被害が大きいか」で、念入りに見る書類と抜き取りで済ます書類を分けよう、という提案です。病院のトリアージ（重症度による優先順位付け）に似た発想が面白い点です。", "unverified": "品質スコアの具体的な算出方法は未確認（本文を入手できず）。"}}, {"id": "pr30", "rank": 30, "headline": "可動せん断キーで橋台の耐震性能を高める", "title": "Controlling the seismic response of bridges with seat-type abutments through longitudinal movable shear keys on the stemwall", "url": "https://doi.org/10.2139/ssrn.7560923", "authors": "B. Neethu ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "座式橋台の竪壁（ステムウォール）に縦方向のせん断キーを設け、地震時に竪壁の耐力を生かして橋の縦方向の耐震性能を高める新しい支持方式を示した（未査読）。", "p3": "固定のせん断キーに加え、初期の遊間を最適化した受動適応型と、地震中にすべりを固定・解除する半能動型の可動せん断キーを検討した。橋台・背面土のプッシュオーバー解析で得た曲線を非線形ばねの骨格として、橋の非線形時刻歴応答解析で比べた（抄録）。", "p5": "提案した制御方式は、縦方向のせん断キーがない現行の方式や固定キーの方式より、主要な限界状態に達するのに必要な地震動の強さを高め、半能動型の可動せん断キーが全体として最も良い性能を示した（抄録）。", "fun": "橋の端の台（橋台）と橋桁の間には、地震のときにぶつかる隙間があります。この研究は、その隙間を動く「止め金具」で調節し、ふだんは使われない壁の強さまで地震に対抗する力に動員する工夫を提案しました。揺れの最中に金具を固定したり外したりする方式が最も効いたのが面白い点です。", "unverified": "限界状態に達する地震動の強さの具体的な倍率と、対象橋梁の諸元は未確認（本文を入手できず）。"}}, {"id": "pr31", "rank": 31, "headline": "植生の蒸散冷却と日陰冷却は日内で非対称", "title": "Asymmetric diurnal pathways of evapotranspiration and shading govern vegetation cooling under extreme heat", "url": "https://doi.org/10.2139/ssrn.7560980", "authors": "Jinghan Pan ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "猛暑時の植生の冷却効果を、蒸散による冷却と日陰による冷却の2経路に分け、1日の中での時間変化と都市形態ごとの制約が両者で異なることを示した（未査読）。", "p3": "乾燥・温帯・湿潤の気候帯にまたがる中国9都市の極端高温（TX90）の事例に、SCOPEモデルを100m解像度で適用して2経路を分離し、XGBoostとSHAP値で局地気候区分（LCZ）ごとの非線形な要因を、地理的加重回帰で空間的な非定常性を調べた（抄録）。", "p5": "両経路とも正午ごろに山がある一方、合計の冷却効果は19時ごろに4.9〜6.1℃で最大となり、経路の強さより数時間遅れた。蒸散冷却は水の利用可能性・樹冠構造・都市の密度に、日陰冷却は不透水面の割合と地表のエネルギー配分に強く制約された（抄録）。", "fun": "木が街を冷やすしくみには、葉から水を蒸発させて熱を奪う「打ち水」型と、日差しを遮る「日傘」型の2つがあります。両方とも昼に最も強く働くのに、気温を下げる効果が最大になるのは夕方の19時ごろという時間のずれが面白い点です。冷やす働きの強さと気温の結果が同時ではないことを示しています。", "unverified": "都市ごとの冷却量の差と、使った気象・植生データの期間は未確認（本文を入手できず）。"}}, {"id": "pr32", "rank": 32, "headline": "層理面のすべりを含む頁岩の異方性構成則", "title": "Modeling shale using an anisotropic elastoplastic virtual internal bond model accounting for bedding-plane slip", "url": "https://doi.org/10.2139/ssrn.7560381", "authors": "Weiwei Xiao ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "頁岩の母岩の微小破壊と、多数の平行な層理面の不可逆なすべりを、一つの構成則で同時に表せるようにした（未査読）。", "p3": "層理面の幾何を2つのパラメータを持つテンソルで表し、微視的な結合（仮想内部結合、VIB）の分布をそれに結びつけて異方性を表した。これに層理面のすべりを表すモール・クーロン塑性を結合し、異方性弾塑性VIBモデルとした（抄録）。", "p5": "シミュレーションで頁岩の破壊挙動と層理面のすべりを捉えられたとし、頁岩貯留層の水圧破砕の解析に使える力学モデルになるとした。実験との定量的な比較の数値は抄録にない（抄録）。", "fun": "頁岩は本のページのように薄い層が重なった岩で、割れるときには岩そのものが割れる現象と、ページ同士がずれる現象が同時に起こります。この研究は、目に見えない微小な結合の集まりとして岩を表すことで、2つの現象を一つの式にまとめました。ミクロの結びつきの向きの偏りで、マクロな「割れやすい方向」を表すのが面白い点です。", "unverified": "実験との比較の有無と検証の詳細は未確認（本文を入手できず）。"}}, {"id": "pr33", "rank": 33, "headline": "透水性のばらつきとハイドレート採掘の不確実性", "title": "Uncertainty Analysis of Long-term Evolution of Natural Gas Hydrate Extraction under a Fully Coupled THMC Model: The Impact of Spatial Permeability Variability", "url": "https://doi.org/10.2139/ssrn.7560670", "authors": "Junhoa Huang ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "天然ガスハイドレートの減圧採掘で、透水係数の空間的なばらつきがガス生産量と地盤沈下の予測をどれだけ揺らすかを、確率的に評価する枠組みを示した（未査読）。", "p3": "現地データで条件付けた透水係数の確率場を作り、熱・水・力学・化学を完全に連成させたTHMCモデルを完全陰的な有限要素法で解いて、変動係数（COV）と空間相関長を変えたモンテカルロ計算を行った（抄録）。", "p5": "多くの確率的な実現値で、決定論的なモデルより累積ガス生産量が多くなった。相関長の変化は変動係数の変化より生産量と沈下のばらつきを大きくし、井戸付近の平均透水係数より、流れの経路の抵抗を表す指標の方が生産量・沈下と強く結びついた（抄録）。", "fun": "地下の地層は場所ごとに水やガスの通りやすさがまだらに違います。この研究は、そのまだら模様をたくさん作って採掘を何度も模擬し、「平均的な通りやすさ」より「井戸までつながった通り道があるか」の方が結果を左右することを示しました。平均値だけでは足りず、つながり方が大事というのが面白い点です。", "unverified": "モンテカルロの実現値の数と、生産量の差の大きさは未確認（本文を入手できず）。"}}, {"id": "pr34", "rank": 34, "headline": "反証を受けてもLLMが仮説を保ち続ける現象", "title": "When Contradiction Fails to Revise the Model: Hypothesis Preservation, Epistemic Steering, and Human Intervention in Longitudinal Human–AI Reasoning", "url": "https://doi.org/10.5281/zenodo.23131758", "authors": "Aashna ほか", "venue": "Zenodo", "date": "2026-10-04", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録（DataCite経由）を使用", "preprint": true, "short": true, "p1": "長い対話の中でLLMが、最初の仮説に反する証拠を受けても仮説を改めず補助的な仮定だけを変える「仮説保持行動」を、行動として測る実験枠組みを提案した（Zenodoの未査読文書、実証データはない）。", "p3": "仮説の同一性を言葉の類似ではなく事前登録した識別的な予測で定め、両立する証拠・弱い反証・決定的な反証の3条件で反証の強さを操作し、その後に新しい識別質問を出して、答えの訂正と仮説の改訂を区別する「仮説保持テスト」を設計した（抄録）。", "p5": "主な指標として、矛盾の認識率、本当の改訂率、改訂までの遅れ、補助的な修正の深さ、反証の強さに応じた改訂の適切さなどを定めた。誤りを口で認めることは副次的な証拠として扱う。結果の数値は示されていない（抄録）。", "fun": "人は自分の説に合わない証拠を見ても、説を捨てずに言い訳を足していくことがあります。この研究は、AIにも同じ振る舞いがあるかを、答えを変えたかではなく、その後の予想が本当に変わったかで見分ける方法を考えました。驚く証拠のたびに説を変えるのも良くないので、反証の強さに応じて変えるのが正しい、という基準の置き方が面白い点です。", "unverified": "実際のLLMでの測定結果はなく、提案した指標の信頼性は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "計算基盤の偏在がAI行政サービスの地域差を生む", "title": "Spatial Inequality in the Algorithmic State: Mapping Compute Concentration, Network Topology and Localized AI Performance across Nigeria", "url": "https://doi.org/10.2139/ssrn.7560742", "authors": "Oluwatobi Salami", "venue": "SSRN", "date": "2026-10-04", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "ナイジェリアで、通信網とデータセンターの空間的な偏りが、クラウド上のAI公共サービス（音声認識など）の地域ごとの使い勝手の差になることを推定し、計算資源を置く優先地域の指数を作った（未査読）。", "p3": "クラウドソースのセル情報2,834件、Tier III/IVのデータセンター13か所、モデル化した光ファイバ幹線13区間を統合し、Ooklaの112,291回の通信測定でTCPの通信速度モデルを較正して、最初の応答までの時間（TTFT）と単語誤り率（WER）を模擬した（抄録）。", "p5": "データセンター13か所のうち11か所がラゴス周辺に集中し、計算資源までの距離は遅延（r = +0.432）や下り速度（r = −0.468）と結びついた。北東部のハウサ語話者では、音声認識の最初の応答の遅れが3.9倍（1,862ms対483ms）、単語誤り率が28%高いと模擬された（抄録）。", "fun": "AIの窓口サービスは「どこからでも同じように使える」と思われがちですが、実際は計算機のある場所からの距離で反応の速さが変わります。この研究は、大都市から遠い地域の人ほど、AIの音声認識が遅く間違いも増えることを、地図と通信の測定データから示しました。デジタルの時代にも「距離の不平等」が残るという点が面白いところです。", "unverified": "AI立地指数の重み付けの方法は未確認（本文を入手できず）。"}}, {"id": "pr36", "rank": 36, "headline": "電力契約と証書を整合させる炭素責任の会計", "title": "Market-Based Carbon Responsibility Accounting for Electricity Contracts and Green Certificate Transfers", "url": "https://doi.org/10.2139/ssrn.7560247", "authors": "Gaoyang Zuo ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "再エネ電力の束ね契約、環境価値を切り離した電力、化石燃料の契約、単独で取引されるグリーン証書が混在する市場で、市場基準の炭素責任を二重計上や配分漏れなく割り当てる会計の手順を提案した（未査読）。", "p3": "決済の優先順位で各環境価値が1回だけ使われるようにし、証書を環境価値を切り離した電力の記録と結びつけ、証書の決済後に主体ごとの責任を更新する。対応する証書のある責任は契約者に、ない分は残余配分で対応しない電力の需要者に配る閉ループの枠組みで、物理的な排出と市場基準の責任を区別する（抄録）。", "p5": "期をまたぐ決済、再エネの発電量の変動、部分的な供給不履行の比較事例で各機能の役割を示し、設定した条件の下で責任の漏れと環境価値の重複主張を検出できることを示した（抄録）。", "fun": "「この電気は再エネ由来です」という証書は、電気そのものとは別に売り買いできます。すると同じ「緑の価値」を2人が主張したり、誰のものでもない排出が宙に浮いたりします。この研究は、簿記の貸借をそろえるように、炭素の責任の行き先を一つずつ帳尻合わせする手順を作りました。会計の考え方で環境価値の二重取りを防ぐのが面白い点です。", "unverified": "比較事例の具体的な数値と、実際の市場データへの適用の有無は未確認（本文を入手できず）。"}}, {"id": "pr37", "rank": 37, "headline": "コールセンターの顧客満足を決める要因", "title": "Determinants of Customer Satisfaction in the Call Centers of Karachi", "url": "https://doi.org/10.5281/zenodo.23135035", "authors": "Jabri, Maria", "venue": "Zenodo", "date": "2026-10-04", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用（2015年の修士論文を2026年に登録したもの）", "preprint": true, "short": true, "p1": "パキスタン・カラチの携帯通信会社のインバウンド型コールセンターで、顧客満足を左右する要因を調べた修士論文（2015年に完成、2026年にZenodoへ登録、未査読）。", "p3": "サービスの利用しやすさ、サービス品質、対応の完全さ、専門性、応答性の5要因について、384人に構造化質問紙を配り、369件の有効回答で信頼性分析、主成分分析による探索的因子分析、属性と通信会社を統制した重回帰分析を行った（抄録）。", "p5": "利用しやすさ、サービス品質、対応の完全さは満足と有意に正の関係があり、専門性と応答性は有意な予測因子ではなかった（抄録）。", "fun": "電話窓口の満足度を決めるのは、オペレーターの丁寧さや素早さよりも、「つながりやすいか」「問題を最後まで解決してくれるか」だった、という結果です。感じの良さより、確実に用件が片づくことが大事だという点は、自分が問い合わせをしたときの気持ちを思い出すと納得がいきます。", "unverified": "回帰係数の大きさと決定係数は未確認（本文を入手できず）。"}}, {"id": "pr38", "rank": 38, "headline": "交通信号制御の多エージェント強化学習を総説", "title": "Cooperative Multi-Agent Foundations and the Sim-to-Real Gap in Traffic Signal Control: A Deployment-Oriented Survey", "url": "https://doi.org/10.2139/ssrn.7560448", "authors": "Bison Liao ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "交通信号制御の深層強化学習を、多エージェント強化学習（MARL）の一般的な仕組みから体系化し、シミュレーションでの成果が実地導入に結びつかない「sim-to-realギャップ」を整理した総説（未査読）。", "p3": "独立学習、集中学習・分散実行（CTDE）、価値分解、通信、逐次の結合最適化といったMARLの中核的な仕組みと各手法を対応づけ、インフラ、交通の動態、道路網の形、安全、計算の制約、評価方法の面から実地とのギャップを検討した（抄録）。", "p5": "既存のベンチマークの盲点を指摘し、導入を意識したベンチマーク、運用上の制約を組み込んだアルゴリズム、MARLの一般的な進歩の体系的な取り込みを今後の方向として挙げた。定量的な結果を示す論文ではない（抄録）。", "fun": "信号機をAIに任せて渋滞を減らす研究はたくさんありますが、実際の街にはほとんど入っていません。この総説は、交差点ごとのAIが協調する仕組みを整理し、なぜシミュレーションの成功が現実に持ち込めないのかを、安全や計算の制約、評価の仕方の面から洗い出しました。研究室と街の間の溝を正面から扱った点が面白いところです。", "unverified": "取り上げた文献の本数と選定基準は未確認（本文を入手できず）。"}}, {"id": "pr39", "rank": 39, "headline": "粗い砂岩節理のせん断挙動と破壊の進展", "title": "Quasi-Static Shear Behavior and Failure Evolution of Rough Sandstone Joints", "url": "https://doi.org/10.2139/ssrn.7560466", "authors": "Xiaoxiao Su ほか", "venue": "SSRN", "date": "2026-10-04", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "砂岩の節理面のせん断挙動と破壊の進み方に、表面の粗さ、せん断速度、水の飽和がどう組み合わさって効くかを実験で示した（未査読）。", "p3": "垂直応力15MPa一定で、節理粗さ係数（JRC）3.86・9.89・17.71の節理面を、乾燥と飽和の条件、せん断速度0.5〜1.5mm/sで準静的な一面せん断試験にかけ、アコースティック・エミッション（AE）、高速カメラ、デジタル画像相関（DIC）、3次元スキャンで観測した（抄録）。", "p5": "せん断は弾性・非線形・ピーク後のすべりの3段階を示し、ピークせん断応力と垂直変位の増加率はJRCと速度とともに増え、飽和では乾燥より低かった。残留せん断応力は、粗さの小さい面では速度とともに増え、粗い面では減った（抄録）。", "fun": "岩盤の割れ目がずれるときの抵抗は、割れ目の表面のでこぼこ、ずれる速さ、水にぬれているかで変わります。面白いのは、ずれ終わった後の抵抗が、なめらかな面では速くずらすほど大きく、でこぼこの面では逆に小さくなったことです。同じ「速さ」の効果が表面の形で逆向きになるという意外な結果です。", "unverified": "残留せん断応力の変化の大きさと、AE計数の具体的な値は未確認（本文を入手できず）。"}}, {"id": "pr40", "rank": 40, "headline": "利用者の口コミから実現可能な追加コンテンツを選ぶ", "title": "From Player Content to Feasible Game Add-Ons,A traceable decision-support case study of Cities: Skylines", "url": "https://doi.org/10.2139/ssrn.7560487", "authors": "Yao Zhang", "venue": "SSRN", "date": "2026-10-04", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録（Crossref経由）を使用", "preprint": true, "short": true, "p1": "都市建設ゲーム「Cities: Skylines」を例に、プレイヤーのレビューやmod（利用者が作った追加データ）を、開発資源の制約の中で実現できる追加コンテンツの企画選びへ追跡可能な形でつなぐ意思決定支援の手順を示した（未査読）。", "p3": "公式の拡張・クリエイターパック41点への英語・中国語のレビュー7,693件と、プレイヤー作成物263点から語彙的な信号とmodの供給構成を作り、建物・交通・地図の3案を予算・アート・エンジニアリング・テストの制約の下で評価した（抄録）。", "p5": "大まかな方向の段階では「建物と地図」が最も高得点の実行可能な組み合わせだったが、具体的な作業パッケージに落とすとアートとテストの要件で実行不能になり、小規模な交通の案が選ばれた。感度分析と区間分析で選択が逆転する境界を示した（抄録）。", "fun": "ユーザーの口コミを読めば「何を作るべきか」が分かりそうですが、作れるかどうかは別問題です。この研究では、人気の高い案が、実際の作業量に分解するとデザインやテストの手が足りずに実現できないと分かり、別の小さな案が選ばれました。「欲しいもの」と「作れるもの」の間の溝を見える化した点が面白いところです。", "unverified": "語彙的な信号の作り方と、各案の得点の数値は未確認（本文を入手できず）。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "宇宙開発の公的研究開発が製造業の自動化を進めた", "title": "Public R&D and the Automation of Manufacturing: Evidence from the Space Race", "url": "https://doi.org/10.2139/ssrn.7560837", "authors": "Apoorva Babbar ほか", "venue": "SSRN", "date": "2026-10-04", "why": "NASA関連の特許が同じ技術分類の中でも自動化寄りであることを全文特許から示し、Space Raceへの曝露が大きい産業・地域ほど労働分配率が持続的に下がったことを1947〜1992年のデータで示した。"}, {"id": "pn02", "rank": 2, "field": "開発経済学", "headline": "家庭訪問型の幼児支援、4.5年後も算数力の効果が残る", "title": "Early Childhood Intervention for the Poor: Long term outcomes", "url": "https://doi.org/10.2139/ssrn.7560438", "authors": "Pamela Jervis ほか", "venue": "SSRN", "date": "2026-10-04", "why": "インドで行われた拡張可能な家庭訪問の無作為化介入を追跡し、平均7.5歳時点でも初期の数的能力に効果が残り、最も不利な子どもで効果が大きいことを示した。"}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "中小企業減税の穴を地方政府は手数料で埋めた", "title": "The Redistribution of Targeted Tax Cuts: Fiscal Rebalancing and Non-Tax Burden in China", "url": "https://doi.org/10.2139/ssrn.7560440", "authors": "Binzhen Wu ほか", "venue": "SSRN", "date": "2026-10-04", "why": "中国の法人税減税による地方の税収減を都市間の差で分析し、非税収入の増加がそれをほぼ相殺し、受益企業でも減税分の大半が手数料の増加で打ち消されたことを示した。"}, {"id": "pn04", "rank": 4, "field": "機械学習", "headline": "中心窩を模した『ぼかしマスク』で頑健な視覚表現", "title": "Foveation as self-supervision signal: Blur masks beat blank masks for learning robust visual representations", "url": "https://doi.org/10.64898/2026.09.26.754698", "authors": "Akihito Maruya ほか", "venue": "bioRxiv", "date": "2026-10-04", "why": "マスク画像モ
