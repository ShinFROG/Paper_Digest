Statistical Efficiency of Distributional Temporal Difference Learning and Freedman’s Inequality in Hilbert Spaces. Operations Research. https://doi.org/10.1287/opre.2025.1639", "why": "方策の収益分布を推定する分布型TD学習について、非パラメトリック版とカテゴリ版の両方で、1-ワッサースタイン距離でε精度を得るのに必要な相互作用数が対数因子を除いてミニマックス最適であることを示す。そのためにヒルベルト空間のフリードマン不等式を新たに証明し、在庫管理問題で実用性を確かめた。"}, {"id": "jn11", "rank": 11, "field": "材料科学", "headline": "ナノダイヤで柔らかいペロブスカイトを長寿命化", "title": "Elastic-field reorganization stabilizes soft-lattice perovskites for durable solar cells", "url": "https://doi.org/10.1126/science.aeh3114", "authors": "Biao Li ほか", "venue": "Science", "date": "2026-11-19", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "apa": "Li, B., Zhang, T., Wang, X., Wen, Y., Wang, Y., Yu, X., & Yang, D. (2026). Elastic-field reorganization stabilizes soft-lattice perovskites for durable solar cells. Science, 394(6826). https://doi.org/10.1126/science.aeh3114", "why": "柔らかい結晶格子が高い性能と引き換えに不安定さを生むハライドペロブスカイトに硬いナノダイヤモンドを混ぜ、内部の弾性場を粒界へ移して散逸させ、粒界のすべりと欠陥の生成を抑える。0.09 cm²の素子で認証効率27.6%、16.1 cm²のミニモジュールで24.3%を達成し、85°Cの最大出力点運転5000時間後も初期効率の80%を保った。"}, {"id": "jn12", "rank": 12, "field": "統計学", "headline": "組織研究のベイズ分析は事前分布を示さない", "title": "Do Organizational Researchers Report Their Priors? Reporting Guidelines for Bayesian Methods", "url": "https://doi.org/10.1177/10944281261491765", "authors": "Lau Holgersen", "venue": "Organizational Research Methods", "date": "2026-11-20", "sjr": 14.268, "citescore": 48.0, "citescore_year": "2025", "apa": "Holgersen, L. (2026). Do Organizational Researchers Report Their Priors? Reporting Guidelines for Bayesian Methods. Organizational Research Methods. https://doi.org/10.1177/10944281261491765", "why": "経営・組織研究の主要15誌（2001〜2025年）のベイズ分析の実証研究89本を体系的に調べ、3分の1を超える研究が具体的な事前分布を示さず、示した研究も半数しか選択の理由を述べていないことを明らかにし、事前分布の特定・正当化・評価にわたる7つの報告指針を提案する。"}, {"id": "jn13", "rank": 13, "field": "組織行動・心理的安全性", "headline": "上司と同僚の妨害の食い違いが逸脱を招く", "title": "Multiple Sources, Mixed Signals: How Supervisor and Coworker Undermining (In)congruence Affects Employee Deviance", "url": "https://doi.org/10.1002/job.70137", "authors": "Michael S. Cole ほか", "venue": "Journal of Organizational Behavior", "date": "2026-11-20", "sjr": 3.999, "citescore": 14.2, "citescore_year": "2025", "why": "上司と同僚という2つの源からの職場での妨害（アンダーマイニング）の程度の食い違いが、従業員の成長感（thriving）を下げて職場での逸脱行動を増やすことを、個人内・個人間の2つの現場研究で示し、その経路が相反する感情（アンビバレンス）であることを確かめた。"}, {"id": "jn14", "rank": 14, "field": "交通・都市計画", "headline": "中国の巨大都市圏化が取り残す二次都市", "title": "Blind spots of state spatial selectivity: The left-behind secondary cities in Chinese mega-regionalisation", "url": "https://doi.org/10.1177/00420980261498005", "authors": "Yizhao Du ほか", "venue": "Urban Studies", "date": "2026-11-20", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "why": "中国の3つの巨大都市圏で、省政府の年次報告（2006〜2024年）から都市圏の構想と現場の介入をつなぐ中間段階の行動計画を歴史的制度論で分析し、中心都市を推進役とする計画が一部の二次都市しか統合せず、多くを周縁化させる『盲点』を生むことを示す。"}, {"id": "jn15", "rank": 15, "field": "工学", "headline": "欠測と間隔の異なるダムの変位を復元", "title": "An Information‐Density‐Aware Strategy Search Framework for Dam Displacement Reconstruction: Dynamically Synergizing HST‐Inspired Sparse Parametric Modeling and Data‐Driven Nonlinear Mapping", "url": "https://doi.org/10.1155/stc/3048344", "authors": "Minshui Huang ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-11-20", "citescore": 10.3, "citescore_year": "2025", "why": "観測間隔と欠測の型が多様なダムの変位監視データに対し、環境要因の特徴をLASSOとCatBoostの2系統で学習して適応的に融合・補正し、CMA-ESで探索する枠組みを提案する。供用中のコンクリートダム2基のデータで最良の比較手法よりRMSEを下げた一方、探索をやり直さない転用では誤差が大きく増えることも示す。"}, {"id": "jn16", "rank": 16, "field": "機械学習", "headline": "取り組まなかった課題を先回りで学ぶ人と機械", "title": "Preemptive solving of future problems: Multitask Preplay in humans and machines", "url": "https://doi.org/10.1073/pnas.2521870123", "authors": "Wilka Carvalho ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-19", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "人は1つの課題の経験を使い、手が届いたが取り組まなかった別の課題の解を反実仮想のシミュレーションで先に学ぶという仮説を『Multitask Preplay』として定式化し、深層強化学習に実装すると、グリッドワールドと2次元のMinecraftで人の新しい課題への汎化を従来の計画・予測表現より正確に予測し、人工エージェントの汎化も改善することを示す。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "人は1つの課題の経験を使って、手が届いたが取り組まなかった別の課題の解を先回りで学ぶという仮説を「Multitask Preplay」という算法として定式化し、人の汎化の予測と人工エージェントの汎化の改善を示した（抄録）。", "p3": "ある課題の経験の再生を出発点に、取り組まなかった課題の反実仮想のシミュレーション（preplay）を行い、後の素早い適応を支える予測的な表現を学ぶ。深層強化学習に実装し、グリッドワールドと2次元のMinecraftの領域で人の行動と比べた（抄録）。", "p5": "人の新しい課題への汎化を、従来の計画法や予測的表現の手法より正確に予測し、課題の共起の構造を共有する新しい環境への人工エージェントの汎化も改善した（抄録）。", "fun": "お茶をいれている間にも、人は「次は料理だな、包丁はあそこ」と、まだやっていない用事の段取りを頭の中で済ませている。この研究は、その「やらなかったことの予習」を算法にして、人の行動をよく説明し、AIも賢くできることを示した。人の頭の中の先回りをAIに移した点が面白い。", "unverified": "本文は入手できず、人の実験の参加者数と予測精度の数値は確認できなかった。"}}, {"id": "jn17", "rank": 17, "field": "物理学", "headline": "量子の文脈依存性で古典の限界を超える協調", "title": "Quantum-classical separation in bounded-resource tasks arising from measurement contextuality", "url": "https://doi.org/10.1126/science.aec3042", "authors": "S. Kumar ほか", "venue": "Science", "date": "2026-11-19", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "why": "超伝導量子ビットの処理装置で、通信なしの多人数の協調意思決定で量子の文脈依存性が古典の上限を超える成功確率を可能にすることを示し、魔方陣ゲーム、N人GHZゲーム、2次元の隠れ線形関数問題で忠実度と規模の最先端を更新した。文脈依存性に基づく量子計算機のベンチマークを導入する。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "超伝導量子ビットの処理装置で、通信なしの多人数の協調意思決定において、量子の文脈依存性が古典の上限を超える成功確率を可能にすることを示した（抄録）。", "p3": "少数の量子ビットで魔方陣ゲームの文脈依存性を示してベル–コッヘン–シュペッカーの不等式の破れで定量化し、多体の文脈依存性を調べるためにN人のGHZゲームを実装し、2次元の隠れ線形関数問題を別に解いた（抄録）。", "p5": "両方の課題で忠実度と系の規模の最先端を更新し、文脈依存性に基づく算法による量子処理装置のベンチマークを導入した（抄録）。", "fun": "相談できない複数の人が、それぞれの質問に答えて全員の答えの組合せで勝ち負けが決まるゲームでは、どんな作戦でも勝率に上限がある。ところが量子の性質を使うと、その上限を超えて勝てる。この「ずるくない反則」を実際の量子コンピュータで大規模に示した点が面白い。", "unverified": "本文は入手できず、量子ビット数と成功確率の数値は確認できなかった。"}}, {"id": "jn18", "rank": 18, "field": "エネルギー・環境", "headline": "脱炭素の経路は資源採掘の総量を減らさない", "title": "Environmental and material implications of global climate mitigation pathways", "url": "https://doi.org/10.1038/s41560-026-02171-x", "authors": "A. J. Hahn Menacho ほか", "venue": "Nature Energy", "date": "2026-11-20", "sjr": 20.769, "citescore": 78.4, "citescore_year": "2025", "why": "3つの統合評価モデルの24の気候緩和経路を2020〜2100年のライフサイクルの視点で比べ、深い脱炭素は健康と生態系に大きな便益をもたらすが、土地・水・鉱物資源の採掘圧力を系統的には減らさず、電化に必要な金属では採掘の累積量より時期を変えることを示す。同じ目標でも経路によって環境・資源の負荷が大きく異なる。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "3つの統合評価モデルの24の気候緩和経路をライフサイクルの視点で比べ、深い脱炭素が健康と生態系に便益をもたらす一方で、土地・水・鉱物資源の採掘の圧力を系統的には減らさないことを示した（抄録）。", "p3": "2020〜2100年の世界の最終エネルギーの供給について、経路ごとの環境への影響と資源の必要量をシステム全体で比較した（抄録）。", "p5": "電化に重要な金属では、緩和の野心は採掘の累積量よりも時期を主に変えた。同じ気候目標を達成する経路でも、環境と資源への圧力が大きく異なり、移行の実現可能性と望ましさを左右する（抄録）。", "fun": "二酸化炭素を減らす道筋は何通りもあるが、どれも同じように地球にやさしいとは限らない。太陽光や電池には金属が必要で、脱炭素を急いでも掘り出す金属の総量はあまり変わらず、掘る時期が早まるだけだという。気候のための選択が別の資源問題を生む点が面白い。", "unverified": "本文は入手できず、経路ごとの影響の数値と使った統合評価モデルの名前は確認できなかった。"}}, {"id": "jn19", "rank": 19, "field": "流体物理", "headline": "乱流の避難所で粒子を選り分けて集める", "title": "Quiet within, chaos without: Turbulence shelters drive selective particle capture and release", "url": "https://doi.org/10.1126/science.aee9889", "authors": "Matteo Sabato ほか", "venue": "Science", "date": "2026-11-19", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "why": "開口が1つの中空の殻（乱流シェルター）が渦を大きさでふるい分け、平均流がなくても揺らぎの強さの勾配を保って粒子を一方向に運ぶことを示す。3桁にわたる大きさで内外の粒子濃度の差を生み、微小スケールでは材料によらず数十ナノメートルの大きさの違いを識別した。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "開口が1つの中空の殻（乱流シェルター）が乱流の渦を大きさでふるい分け、平均の流れがなくても粒子を一方向に運んで、選択的に捕捉・放出することを示した（抄録）。", "p3": "乱流の揺らぎは平衡の定理に縛られない非平衡のエネルギーカスケードに従うことに着目し、殻が内部と外部で揺らぎの強さの勾配を保つことで粒子の輸送を生む仕組みを、3桁にわたる大きさで調べた（抄録）。", "p5": "シェルターは内外の粒子濃度の差を作り、その選択性は粒子の形、慣性、熱揺らぎ、静電気力で制御された。微小なスケールでは、材料によらず数十ナノメートルの大きさの違いを識別した（抄録）。", "fun": "風がぐちゃぐちゃに渦巻く中に、穴が1つだけの空っぽの殻を置くと、殻の中は静かで外は騒がしい。この「静けさの差」だけで、特定の大きさの粒が殻の中にたまったり出ていったりする。平均の風がないのに粒を選んで運べるという、乱流の意外な使い道が面白い。", "unverified": "本文は入手できず、殻の寸法と濃度差の数値は確認できなかった。"}}, {"id": "jn20", "rank": 20, "field": "組織行動・心理的安全性", "headline": "サーバント・リーダーは仕事の意味を通じて効く", "title": "Creating meaning at work or providing career support? How servant leaders enhance followers’ vocational outcomes", "url": "https://doi.org/10.1177/00187267261499126", "authors": "Nathan Eva ほか", "venue": "Human Relations", "date": "2026-11-20", "sjr": 4.141, "citescore": 16.1, "citescore_year": "2025", "why": "サーバント・リーダーが部下の職業上の成果（成長感・キャリア満足・求職行動）に効く経路を、キャリア支援と仕事の意味づけという競合する説明として3研究で検証し、仕事の意味づけの経路が有意に強く、職業選択の自由が小さい部下で特に重要であることを示す。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "サーバント・リーダーが部下の職業上の成果に効くのは、キャリア支援によってか、仕事の意味づけを助けることによってかを、競合する2つの説明として検証した（抄録）。", "p3": "自己決定理論に基づき、成長感（thriving）、キャリア満足、求職行動への2つの経路を、重要事象法（研究1）、4波の調査（研究2）、現場研究（研究3）と内部メタ分析で調べた（抄録）。", "p5": "研究1と3では仕事の意味づけの経路だけが支持され、研究2では両方の経路が有意だった。内部メタ分析では両経路とも正の間接効果を持つが、仕事の意味づけの経路が有意に強く、職業選択の自由が小さい部下で特に重要だった（抄録）。", "fun": "部下を支える上司は、昇進の手助けをするから部下の仕事人生を良くするのか、それとも仕事の意味を見つける手助けをするからなのか。3つの研究をまとめると、意味の手助けのほうが強く効いていた。特に仕事を自由に選べない人にとって意味づけが大事だという点が面白い。", "unverified": "本文は入手できず、各研究の標本の大きさと効果量は確認できなかった。"}}, {"id": "jn21", "rank": 21, "field": "組織行動・心理的安全性", "headline": "怒る女性リーダーが不利になる仕組みのモデル", "title": "Anger and gender bias in leadership evaluations: A stereotype-context competition model", "url": "https://doi.org/10.1177/00187267261504293", "authors": "Bo (Jeff) Shao", "venue": "Human Relations", "date": "2026-11-20", "sjr": 4.141, "citescore": 16.1, "citescore_year": "2025", "why": "同じ怒りの表出が男性リーダーには有利で女性リーダーには不利になる理由を、ステレオタイプ情報による偏りの力と文脈情報による抑制の力の競合として説明する理論モデルを示し、偏りが起きにくくなるリーダー・観察者・状況の3種類の条件を挙げる。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "同じ怒りの表出が男性リーダーには有利で女性リーダーには不利に働く理由を、ステレオタイプと文脈の競合として説明する理論モデルを示した（抄録）。", "p3": "怒るリーダーの評価は、ステレオタイプの情報による偏りを生む力と、文脈の情報による偏りを打ち消す力の2つで形づくられると論じた理論論文である（抄録）。", "p5": "偏りを生む力が一般に勝るため、怒るリーダーの初期の評価で性別の偏りが続くと論じ、偏りを起きにくくするリーダー・観察者・状況に関わる3種類の要因を挙げた（抄録）。", "fun": "同じように会議で怒っても、男性のリーダーは「頼もしい」、女性のリーダーは「感情的」と受け取られがちだ。この論文は、性別のイメージとその場の事情という2つの情報の綱引きとしてこの偏りを説明し、偏りが弱まる条件を整理した。評価の偏りを力の綱引きで考える見方が面白い。", "unverified": "理論論文で実証データはない。本文は入手できず、3種類の要因の具体的な内容は確認できなかった。"}}, {"id": "jn22", "rank": 22, "field": "経営学", "headline": "株主提案が企業の不祥事を減らす条件", "title": "It’s a System: Shareholder Activism, Corporate Harm, and the Role of Regulators, NGOs, and Media", "url": "https://doi.org/10.1177/01492063261481752", "authors": "Mark R. DesJardine ほか", "venue": "Journal of Management", "date": "2026-11-20", "sjr": 8.251, "citescore": 21.4, "citescore_year": "2025", "why": "米国企業428社の環境・社会に関する株主提案（2007〜2021年）で、提案が規制当局に制裁された利害関係者への加害を減らし、その効果は経営者の受容性を通じて働き、規制当局とNGOの監視が強いほど大きいことを示す。株主活動の成否を投資家と企業の二者関係を超えた制度の仕組みで説明する。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "株主の環境・社会（E&S）に関する提案が企業の利害関係者への加害を減らすか、その効果が規制当局・NGOなど周囲の制度の圧力でどう変わるかを示した（抄録）。", "p3": "利害関係者の影響の研究と制度論を統合し、2007〜2021年の米国企業428社のE&S提案と、規制当局に制裁された利害関係者への違反のデータで分析した（抄録）。", "p5": "提案は利害関係者への違反を減らし、その効果は経営者の受容性（活動家の要求に抵抗せず関与する行動の型）を通じて働いた。規制当局からの規制的な圧力とNGOからの文化的・認知的な圧力が強いほど、この関係は強まった（抄録）。", "fun": "株主が「環境や人権に配慮せよ」と提案しても、会社は本当に変わるのか。この研究は、提案だけでなく、規制当局やNGOが同じ問題を見張っているときに、会社の不祥事が実際に減ることを示した。株主の声は単独ではなく、周りの声と合わさって力を持つという点が面白い。", "unverified": "本文は入手できず、効果の大きさとメディアの役割の結果は確認できなかった。"}}, {"id": "jn23", "rank": 23, "field": "経営学", "headline": "人はばらつきを分散より範囲で判断する", "title": "Sample Range as Subjective Variability and Implications for Experience-Based Decision Making", "url": "https://doi.org/10.1287/mnsc.2024.05050", "authors": "Tianwei Liu ほか", "venue": "Management Science", "date": "2026-11-19", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "4つの行動実験（計1,093人）で、人は2つの数の集合のばらつきを分散より範囲で判断し、範囲は標本が大きいほど広がるため大きな標本を見た後に分布をばらついていると感じ、リスク回避的な人では不確実な報酬の評価が下がることを示す。経験が主観的なばらつきを形づくる『認知の柵』を提案する。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "人は数の集まりのばらつきを分散ではなく範囲（最大と最小の差）で判断しがちであることを行動実験で示し、それが経験に基づくリスクのある決定を左右することを示した（抄録）。", "p3": "2つの数の集合のばらつきの比較、標本の大きさを変えたときの知覚、不確実な報酬の評価、経験した分布から新しい標本を思い浮かべる課題の4つの実験（計1,093人）を行い、「認知の柵」という説明を提案した（抄録）。", "p5": "範囲と分散が食い違うと、人は主に範囲で判断した。範囲は標本が大きいほど広がるため、大きな標本を見た後に分布をよりばらついていると感じ、リスク回避的な人では不確実な報酬の評価が下がった。新しい標本を思い浮かべると、観察した範囲の内側の数が多すぎた（抄録）。", "fun": "テストの点数のばらつきを、私たちは「一番高い点と一番低い点の差」で感じ取りがちだ。ところがこの差は、人数が多いほど自然に広がる。そのため、たくさんの例を見た人ほど「ばらつきが大きい」と感じ、慎重になりすぎることがある。直感の物差しの思わぬくせを示した点が面白い。", "unverified": "本文は入手できず、各実験の効果の大きさは確認できなかった。"}}, {"id": "jn24", "rank": 24, "field": "経営学", "headline": "棚の位置効果はブランドの種類と棚の形で違う", "title": "EXPRESS: Making the Shelf Work for You: How Shelf Dimensions and Brand Types Influence the Shelf Placement Effect on Product Performance", "url": "https://doi.org/10.1177/00222437261511889", "authors": "Kristopher O. Keller ほか", "venue": "Journal of Marketing Research", "date": "2026-11-20", "sjr": 7.363, "citescore": 11.0, "citescore_year": "2025", "why": "コンビニの販売データと棚割り変更の詳細データで、縦・横の棚位置と棚の広さが販売に与える効果を、主要な全国ブランド、その他の全国ブランド、プライベートブランドと、背の高い・低い棚、幅の広い・狭い棚で比べ、棚の広さの効果がプライベートブランドで最も大きいことを示す。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "棚の縦・横の位置と棚の広さが商品の売上に与える効果が、ブランドの種類と棚の形でどう違うかを、コンビニの販売データと棚割りの変更で示した（抄録）。", "p3": "大手コンビニの販売データと詳細な棚割りの変更を使い、主要な全国ブランド、その他の全国ブランド、プライベートブランド（PB）を区別し、背の高い・低い棚と幅の広い・狭い棚を比べた（抄録）。", "p5": "背の高い棚では全国ブランドは中段から上段で最もよく売れ、PBには縦の位置の効果がほとんどなかった。幅の広い棚では主要ブランドは中央のやや左で最もよく売れた。棚の広さを増やす効果はPBで最も大きく、棚の最適化で大きな売上の改善が見込まれた（抄録）。", "fun": "お店の棚では「目の高さが一番売れる」とよく言われるが、本当にどの商品でもそうなのか。調べると、有名ブランドとお店の自社ブランドでは売れる位置がまったく違い、棚の形によっても変わった。売り場の常識に条件をつけた点が面白い。", "unverified": "本文は入手できず、効果の大きさの数値と対象の商品カテゴリは確認できなかった。"}}, {"id": "jn25", "rank": 25, "field": "経営学", "headline": "時間管理が幸福と成果を生む3つの経路", "title": "Why Time Management Leads to Well-Being (and Performance)", "url": "https://doi.org/10.1177/01492063261499657", "authors": "Brad Aeon", "venue": "Journal of Management", "date": "2026-11-20", "sjr": 8.251, "citescore": 21.4, "citescore_year": "2025", "why": "時間管理が成果より幸福感と強く関連する理由を、日常に統制と予測可能性を与える構造、社会的・生物学的リズムとの同期、価値や長期目標との一致という3つの経路で説明する理論枠組みを示し、断片化した仕事や過剰な要求がこれらを妨げる条件も論じる。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "時間管理が成果よりも幸福感と強く関連する理由を、構造・同期・一致という3つの経路で説明する理論枠組みを示した（抄録）。", "p3": "日常に秩序を与えて統制と予測可能性の感覚を生む構造、活動を社会的・生物学的なリズムに合わせて衝突を減らす同期、活動を価値と長期の目標に一致させて意味を与える一致の3つの経路を、個人の実践と組織の条件に結びつけた（抄録）。", "p5": "断片化した仕事、時間への過剰な要求、短期の成果の重視が経路を妨げ、経路の間の不均衡が有用な時間管理の実践を負担に変えうることを論じ、時間管理が効く場合、効かない場合、逆効果の場合を説明した（抄録）。", "fun": "時間管理は「もっと仕事を片付けるための技術」と思われがちだが、研究では仕事の量より心の安定に効くことが分かっている。この論文はその理由を、予定が立つ安心感、周りの人や体のリズムとの調和、やることが自分の価値と一致する感覚の3つで説明した。時間の使い方が心の健康につながる点が面白い。", "unverified": "理論論文で新しい実証データはない。本文は入手できず、引用された研究の詳細は確認できなかった。"}}, {"id": "jn26", "rank": 26, "field": "オペレーションズ・リサーチ", "headline": "列除去で弧フロー定式化を解き未解決例を解消", "title": "Column Elimination: An Iterative Approach to Solving Arc-Flow Formulations", "url": "https://doi.org/10.1287/opre.2024.1404", "authors": "Anthony Karahalios ほか", "venue": "Operations Research", "date": "2026-11-20", "sjr": 3.759, "citescore": 6.4, "citescore_year": "2025", "why": "決定の系列で表せる問題を動的計画の状態遷移グラフ上の弧フロー定式化で表し、緩和した動的計画から出発して最適解に含まれる実行不能な系列を除いていく『列除去』の一般的な枠組みを示す。時間枠つき配送計画など3つの応用で最先端の手法と同等以上となり、1,000地点の時間枠つき配送問題を含む未解決のベンチマーク例を解いた。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "解を決定の系列の集まりで表せる問題を、動的計画で表した弧フロー定式化として解く一般的な枠組み「列除去」を示し、未解決のベンチマーク例を解いた（抄録）。", "p3": "実行可能な決定の系列とその費用を動的計画で表し、状態遷移のグラフ上の整数線形計画を作る。厳密な定式化は指数的に大きくなりうるため、緩和した動的計画から始め、最適解に含まれる実行不能な系列を除いて緩和を反復的に精緻化する（抄録）。", "p5": "時間枠つきの配送計画問題、時間枠つきの集荷・配達問題、グラフの多重彩色問題の3つの新しい応用で最先端の手法と同等かそれ以上となり、1,000地点の時間枠つき配送問題を含む、いくつかの未解決のベンチマーク例を解いた（抄録）。", "fun": "配送のルートを決める問題は、組合せの数が爆発的に多い。この研究は、最初はわざと「ありえないルート」も含むゆるい問題を解き、出てきた答えにありえないルートが含まれていたらそれだけを禁止して解き直す、という手順をくり返す。まず大ざっぱに解いてだめな所だけ直す発想が面白い。", "unverified": "本文は入手できず、計算時間と解いた未解決例の数は確認できなかった。"}}, {"id": "jn27", "rank": 27, "field": "オペレーションズ・リサーチ", "headline": "海賊版の画質は公開直後には売上を押し上げる", "title": "EXPRESS: Assessing the Quality of Illegal Copies and its Impact on Revenues and Distribution", "url": "https://doi.org/10.1177/10591478261512192", "authors": "Anthony Koschmann ほか", "venue": "Production and Operations Management", "date": "2026-11-20", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "why": "海賊版ファイルの技術的な信号から画質を客観的に測り、映画の興行収入・上映館数・違法ダウンロードと同時にモデル化して、情報の少ない公開直後は高画質の海賊版が試し見の効果で収入を増やし、公開後は代替効果で収入を減らすことを示す。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "海賊版の画質の違いが映画の売上と配給にどう影響するかを、製品の不確実性の観点から、公開直後と公開後で分けて示した（抄録）。", "p3": "海賊版ファイルに埋め込まれた技術的な信号から画質を客観的に測り、興行収入、上映館数、オンラインの海賊版の活動と組み合わせ、上映館数・収入・違法ダウンロード・入手可能な海賊版を同時にモデル化する計量経済の枠組みで分析した（抄録）。", "p5": "情報の少ない公開直後には、高画質の海賊版が試し見の効果で収入を増やした。公開後には、高画質の海賊版は代替の効果で収入を減らした（抄録）。", "fun": "映画の海賊版は売上を奪うと考えられているが、公開直後で評判がまだ分からないときには、きれいな海賊版が「お試し」になって映画館に足を運ばせることもあった。ところが評判が定まった後は、逆に客を奪っていた。同じ海賊版が時期によって味方にも敵にもなる点が面白い。", "unverified": "本文は入手できず、効果の大きさと対象の映画の数は確認できなかった。"}}, {"id": "jn28", "rank": 28, "field": "オペレーションズ・リサーチ", "headline": "欠品で隠れた需要をカルマンフィルタで推定", "title": "EXPRESS: Estimating censored demand in family planning supply chains: forecast accuracy, inventory implications, and public health outcomes", "url": "https://doi.org/10.1177/10591478261511731", "authors": "Harsha Chamara Hewage ほか", "venue": "Production and Operations Management", "date": "2026-11-20", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "why": "欠品やサービス中断で需要が打ち切られる家族計画の供給網で、トービット・カルマンフィルタと適合予測を組み合わせ、部分的な打ち切りと完全な打ち切りを区別する予測手法を提案し、コートジボワールの実データで予測精度と在庫の性能が既存手法を上回ることを示す。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "欠品やサービスの中断で需要が打ち切られる家族計画の供給網で、打ち切りの種類を区別して需要を予測する手法TCKFを提案し、予測精度と在庫の性能、公衆衛生の成果への影響を評価した（抄録）。", "p3": "トービット・カルマンフィルタと適合予測を組み合わせ、部分的な打ち切り（欠品）と完全な打ち切り（中断や入荷のない期間）を区別して状態を更新し、不確実性が続くときは過程の雑音を動的に膨らませ、分布に依存しない予測区間を出す（抄録）。", "p5": "合成データとコートジボワールの家族計画事業の実データの両方で、点予測と確率的な予測の精度、下流の在庫の性能でTCKFが比較手法を一貫して上回り、予測の改善が製品の入手可能性と公衆衛生の成果の向上につながりうることを示した（抄録）。", "fun": "お店で品切れになると、本当は買いたかった人の数が記録に残らないので、需要を少なく見積もってしまう。すると次も少なく仕入れて、また品切れになる悪循環が起きる。この研究は「品切れで見えなくなった需要」を推理する方法を作り、必要な人に物が届くようにした点が面白い。", "unverified": "本文は入手できず、精度の改善幅の数値は確認できなかった。"}}, {"id": "jn29", "rank": 29, "field": "オペレーションズ・リサーチ", "headline": "資金制約のある供給者への融資の選び方", "title": "EXPRESS: Financing Selection Under Procurement Decentralization with a Quality-Uncertain Supplier", "url": "https://doi.org/10.1177/10591478261511680", "authors": "Zhiping Lin ほか", "venue": "Production and Operations Management", "date": "2026-11-20", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "why": "観察できない品質努力をする資金制約のある部品供給者に、銀行融資と買い手融資のどちらを使うかを委託加工型と一括委託型の外注構造で比べ、担保価値が高いと供給者の利益がかえって減る『担保のパラドックス』や、下流企業は常に自ら融資したがることなどを示す。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "観察できない品質の努力をする資金制約のある部品供給者について、銀行融資と買い手融資の選択が外注の構造と品質にどう影響するかを理論モデルで示した（抄録）。", "p3": "OEMが供給者と直接契約し組立を受託製造業者に任せる委託加工型と、受託製造業者が部品調達を仲介する一括委託型の2つの外注構造で、それぞれ銀行融資と買い手融資を比べた（抄録）。", "p5": "担保の価値が高いと品質と供給網全体の利益は上がるのに供給者の利益は下がりうる「担保のパラドックス」を示した。下流の企業は常に自ら融資したがり、供給者は常に銀行融資を好む。委託加工型では買い手融資が品質と効率で勝るが、一括委託型では担保が高い場合に限られた（抄録）。", "fun": "部品メーカーが信用力を高めると得をするはずだが、この研究では、信用が上がるとかえって取引先に利益を吸い取られることがあると示した。お金を誰から借りるか、部品を誰が買い付けるかという組合せで、品質と利益の分け前が変わる。供給網の力関係を数学で解きほぐした点が面白い。", "unverified": "本文は入手できず、拡張したモデルの結果の詳細は確認できなかった。"}}, {"id": "jn30", "rank": 30, "field": "統計学", "headline": "気候極端現象の帰属の不確実性を観測から推定", "title": "Attribution of climate extremes with global temperature regressions: accounting for uncertainty from internal variability", "url": "https://doi.org/10.1175/jcli-d-26-0067.1", "authors": "Maximilian Kotz ほか", "venue": "Journal of Climate", "date": "2026-11-19", "sjr": 2.176, "citescore": 8.4, "citescore_year": "2025", "why": "3つの気候モデルの大規模アンサンブルで、全球気温への回帰による極端現象の帰属が内部変動で大きくばらつくことを示し、単一の実現からブロック・ブートストラップでその不確実性を正確に推定できることを示す。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "地域の極端な気温・降水を全球の気温に回帰して気候変動に帰属する方法で、観測だけから得た不確実性が内部変動による結果の幅を反映できるかを、気候モデルの大規模アンサンブルで確かめた（抄録）。", "p3": "3つの気候モデル（MIROC6、MPI-ESM1-2-LR、CanESM5）の大規模アンサンブルを理想化した試験台とし、単一の実現からの回帰の傾きの不確実性をアンサンブル全体の幅と比べ、ブロック・ブートストラップで推定できるかを調べた（抄録）。", "p5": "内部変動は全球気温と地域の気温の極端の間の回帰の傾きに大きな不確実性を生み、平均の傾きの40%を超える地域が3つのモデルで地表面積の50%、38%、9%を占めた。それでも個々のメンバーからブロック・ブートストラップでこの不確実性を正確に推定でき、降水の極端でも絶対的な不確実性をとらえた（抄録）。", "fun": "「この猛暑は温暖化のせいか」を調べるとき、地球が実際に歩んだ歴史は1通りしかないので、偶然の揺らぎがどれだけ結果をぶらすかが分からない。この研究は、何十通りもの「ありえた地球」を計算した気候モデルを使い、1通りの歴史からでも揺らぎの大きさを正しく見積もれる方法を確かめた点が面白い。", "unverified": "本文は入手できず、降水の相対的な不確実性の評価の詳細は確認できなかった。"}}, {"id": "jn31", "rank": 31, "field": "経済学", "headline": "規制情報は新食品の受容を高めるが薄れる", "title": "Regulatory Information and Consumer Acceptance of Novel Foods: Evidence From a Survey Experiment", "url": "https://doi.org/10.1111/1477-9552.70098", "authors": "Luca Cattani ほか", "venue": "Journal of Agricultural Economics", "date": "2026-11-20", "sjr": 1.375, "citescore": 9.0, "citescore_year": "2025", "why": "イタリアの成人2,012人の代表的な調査実験で、EUの新食品の販売承認手続きを知らせると培養肉と昆虫粉製品の受容が高まるが、時間差を変えた追跡調査では効果が徐々に消えることを示す。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "EUの新食品の販売承認手続きについての規制情報を知らせると、培養肉と昆虫粉の製品の受容が高まるか、その効果は続くかを、イタリアの成人の代表的な調査実験で調べた（抄録）。", "p3": "年齢・性別・居住地域でイタリアの成人を代表する2,012人に規制情報の提示の有無を割り当てて食べる意思を比べ、時間の間隔を変えた、目的を伏せた追跡調査で、効果の持続と要求効果・プライミング効果を確かめた（抄録）。", "p5": "情報を受けた回答者は対照群より両方の製品を有意に受け入れたが、追跡調査では情報の効果が次第に弱まり、最終的に完全に消えた（抄録）。", "fun": "培養肉や昆虫の粉を「EUの安全審査に通っています」と説明すると、食べてもいいと思う人が増えた。ところが時間がたつと、その効果はすっかり消えてしまった。一度の説明で人の気持ちは変わっても長続きしないことを、後から同じ人に聞き直して確かめた点が面白い。", "unverified": "本文は入手できず、受容の増加の大きさと効果が消えるまでの期間は確認できなかった。"}}, {"id": "jn32", "rank": 32, "field": "機械学習", "headline": "エージェントAIの協働でMOFを設計し合成", "title": "System of agentic AI for the discovery of metal–organic frameworks", "url": "https://doi.org/10.1038/s43588-026-01058-x", "authors": "Théo Jaffrelot Inizan ほか", "venue": "Nature Computational Science", "date": "2026-11-20", "sjr": 4.252, "citescore": 25.4, "citescore_year": "2025", "why": "LLM、拡散モデル、量子力学計算、合成可能性の判定を担うエージェントを連携させるMOFGenで数十万の金属有機構造体と合成可能な配位子を生成し、高スループット実験で『AIが考えた』MOF4種の合成に成功した。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "LLM、拡散モデル、量子力学計算、合成可能性の判定を担うエージェントを連携させるエージェントAIのシステムMOFGenで金属有機構造体（MOF）を設計し、実験で合成に成功した（抄録）。", "p3": "LLMがMOFの組成を提案し、拡散モデルが結晶構造を生成し、量子力学のエージェントが候補を最適化・選別し、専門家の規則と機械学習による合成可能性のエージェントが絞り込む。実験で報告されたMOFと計算データベースで学習した（抄録）。", "p5": "数十万のMOFの構造と合成可能な有機配位子を生成し、従来の生成モデルが扱える数十原子を超える大きなMOFを原子の精度で生成できた。高スループットの実験で検証し、「AIが考えた」MOFを4種合成した（抄録）。", "fun": "二酸化炭素を吸い取ったり空気から水を集めたりできる、スポンジのような結晶の材料（MOF）は、組合せが無数にあって人の手では探しきれない。この研究は、役割の違うAIたちをチームにして候補を考えさせ、実際に作れる新しい材料を見つけた。AIのチーム研究が実験室の成果につながった点が面白い。", "unverified": "本文は入手できず、合成したMOFの性能の数値は確認できなかった。"}}, {"id": "jn33", "rank": 33, "field": "工学", "headline": "複数の類似度グラフで多センサの故障を診断", "title": "A novel information-controlled graph convolutional framework for multisensor fault diagnosis", "url": "https://doi.org/10.1177/14759217261497050", "authors": "Lizhi Cao ほか", "venue": "Structural Health Monitoring", "date": "2026-11-20", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "why": "センサごとに4種の距離・類似度からグラフを作って統合し、減衰つきのグラフ畳み込みと学習可能なセンサ重みで融合する故障診断法を提案し、3つの事例で最良の比較手法より約1ポイント高い精度を得た。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "多センサの故障診断で、センサごとに複数の類似度から作ったグラフを統合し、情報の伝播を制御したグラフ畳み込みネットワークMSICGCNを提案した（抄録）。", "p3": "センサごとにユークリッド距離、コサイン類似度、マハラノビス距離、最小全域木の4つの候補グラフを作って一貫性に基づく重みと疎化で統合し、初期残差結合と直交変換を持つ減衰したグラフ畳み込みで処理し、学習可能な全体のセンサ重みで融合する（抄録）。", "p5": "3つの事例で分類精度は98.92%、99.24%、99.56%で、最も強い比較手法をそれぞれ1.01、1.00、0.91ポイント上回った（抄録）。", "fun": "機械の故障を見分けるAIでは、データ同士が「似ている」かどうかの判断の仕方で結果が変わる。この研究は、似ている度合いを4通りの物差しで測ってまとめ、情報の広がりすぎも抑えた。1つの物差しに頼らず、いくつもの見方を合わせる発想が面白い。", "unverified": "本文は入手できず、3つの事例の機械の種類とデータの規模は確認できなかった。"}}, {"id": "jn34", "rank": 34, "field": "工学", "headline": "直方体センサ網のAE位置標定の誤差分布", "title": "Error distribution and plane superposition effect of acoustic emission source localization in cuboid sensor network", "url": "https://doi.org/10.1177/14759217261505912", "authors": "Heng Cao ほか", "venue": "Structural Health Monitoring", "date": "2026-11-20", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "why": "到達時間差によるアコースティック・エミッションの音源位置標定の誤差が直方体のセンサ網の辺の比でどう分布するかを13の数値例で調べ、最短辺が最も効くこと、誤差が外面付近に集中することを示し、花崗岩の破壊実験で傾向を確かめた。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "岩盤の破壊の監視に使うアコースティック・エミッション（AE）の音源位置標定の誤差が直方体のセンサ網の形でどう分布するかを監視空間全体で調べ、その幾何学的な原因を示した（抄録）。", "p3": "到達時間差による位置標定の理論に基づき、辺の長さの比が異なる13の数値例を作り、外面とx・y・z方向の内部の断面を合わせて監視空間全体の誤差を計算し、段階的に統計を取った（抄録）。", "p5": "最長辺を長く最短辺を短くすると空間的な差が広がり、大きな誤差が外面と境界の付近に集中し、最短辺が最も敏感だった。中間の辺を長くすると均一化された。花崗岩の破壊実験で方向による傾向を確かめ、「平面の重ね合わせ効果」で誤差分布の原因を説明した（抄録）。", "fun": "岩の中で小さなひびが入るとかすかな音が出て、その音が複数のセンサに届く時間の差から、ひびの場所を割り出せる。ところが、センサを箱の形に並べたとき、箱の形によって場所の当たりやすさが大きく変わることが分かった。センサの並べ方そのものが精度を決める点が面白い。", "unverified": "本文は入手できず、誤差の具体的な数値と実験の規模は確認できなかった。"}}, {"id": "jn35", "rank": 35, "field": "工学", "headline": "粒子入り粘弾性複合材の動的な有効物性", "title": "Effective Dynamic Properties of a Viscoelastic Composite Containing Spherical Particles under Harmonic Excitation", "url": "https://doi.org/10.1061/jenmdt.emeng-9102", "authors": "Jinming Zhang ほか", "venue": "Journal of Engineering Mechanics", "date": "2026-11-20", "citescore": 6.3, "citescore_year": "2025", "why": "球形の介在物を含む複合材の調和加振下の有効粘弾性を、剛性と密度の不整合を固有ひずみ・固有体積力で表す等価介在物法と境界要素法で解析し、Willisモデルの形で有効な動的物性を求め、粒子の配置・体積率・振動数の影響を示す。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "球形の粒子を含む粘弾性の複合材の調和加振下の有効な動的物性を、Willisの結合を含むモデルとして求める計算手法を示した（抄録）。", "p3": "剛性と密度の不整合を固有ひずみと固有体積力で表すエシェルビーの等価介在物法を使い、粒子の相互作用と巨視的な境界の効果をとらえる介在物ベースの境界要素法（iBEM）で、固有場の空間変化を多項式で表し、グリーン関数による積分で弾性動力学の場を求めた（抄録）。", "p5": "仮想実験で有効な粘弾性の動的物性をWillisモデルの形で求め、粒子の配置、体積率、加振の振動数が複合材の有効な動的挙動に与える影響を数値で示した（抄録）。", "fun": "小さな粒をゴムのような材料に混ぜると、揺らしたときの硬さや揺れの吸収の仕方が変わる。しかも揺らす速さによって材料の「見かけの性質」が変わる。この研究は、粒の並び方や量からその見かけの性質を効率よく計算する方法を作り、振動のある環境で使う材料の設計に役立てようとする点が面白い。", "unverified": "本文は入手できず、数値例の具体的な値は確認できなかった。"}}, {"id": "jn36", "rank": 36, "field": "交通・都市計画", "headline": "協同組合型の基盤が都市の供給を担う", "title": "Provisioning otherwise: Platform co-operatives and the reworking of platform urbanism", "url": "https://doi.org/10.1177/00420980261505798", "authors": "Jun Zhang", "venue": "Urban Studies", "date": "2026-11-20", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "why": "協同組合が運営するデジタル基盤の31件の面接から、分散した能力を状況に応じた必要の周りに集め、連合で広げ、保守と民主的な学習で統治し続ける『プラットフォーム型の相互供給』を示し、デジタル都市化を成長ではなく調整力の説明責任で評価する視点を提案する。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "協同組合が運営するデジタル基盤（プラットフォーム協同組合）が、食料・物流・市民経済の共有の供給をどう成り立たせているかを、31件の面接から「プラットフォーム型の相互供給」として示した（抄録）。", "p3": "地域をまたぐプラットフォーム協同組合の生態系での31件の半構造化面接を、供給の政治の観点から分析した（抄録）。", "p5": "分散した能力を状況に応じた必要の周りに集め、連合で広げ、保守・民主的な学習・データの管理で集団的に統治し続ける過程を描いた。協同組合の意義は所有の代替というより、日常の供給の基盤となる調整の能力を改められる状態に保つ脆い実験にあると論じた（抄録）。", "fun": "配達やシェアのアプリは、ふつう大企業が運営し、利益も決定権も会社に集まる。この研究は、利用者や働き手が自分たちで運営するアプリの仲間たちを調べ、地域を越えて助け合いながら供給の仕組みを回している様子を描いた。誰がアプリの舵を握るかで都市の暮らし方が変わる点が面白い。", "unverified": "本文は入手できず、面接した組織の内訳と地域は確認できなかった。"}}, {"id": "jn37", "rank": 37, "field": "交通・都市計画", "headline": "都市周縁の共同菜園と連帯食堂はケアの基盤", "title": "Solidarity kitchens and community gardens: Commoning practices of care in urban peripheries", "url": "https://doi.org/10.1177/00420980261504189", "authors": "Renata Motta ほか", "venue": "Urban Studies", "date": "2026-11-20", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "why": "ブラジル・ベロオリゾンテの周縁部の共同菜園と連帯食堂を、食料砂漠ではなく植物・人・場所の間のコモニングによるケアの基盤として捉え直し、これらの都市の食のコモンズが州の新たな政策を引き出した関係の動態を示す。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "ブラジル・ベロオリゾンテ都市圏の周縁部の共同菜園と連帯食堂を、食料砂漠とみなすのではなく、植物・人・場所の間のコモニングによるケアの基盤として捉え直した（抄録）。", "p3": "フェミニスト政治生態学、脱植民地的なフェミニズムの都市コモンズとケアの議論、黒人の食の地理学に基づき、過去三十年にわたり代替の食料システムを形づくってきた国家と社会の食の活動家のネットワークのメンバーとの現地調査とフォーカスグループで分析した（抄録）。", "p5": "共同菜園と食堂は社会的再生産を組織し直してケアを提供する場であり、こうした都市の食のコモンズが州の新たな政策を引き出したことを示した。一方、コモニングの自律性と国家との関係には緊張が残る（抄録）。", "fun": "貧しい地域は「食料砂漠」と呼ばれ、足りないものの側から語られがちだ。この研究は、そこに住む人たちが共同の畑や食堂を作り、互いを支える仕組みを育ててきたことに光を当てた。さらに、その草の根の活動が行政の政策まで動かした。欠けている所ではなく育っている所を見る視点が面白い。", "unverified": "本文は入手できず、調査の期間と参加者の数は確認できなかった。"}}, {"id": "jn38", "rank": 38, "field": "交通・都市計画", "headline": "シェア自転車と地下鉄の接続を建造環境が左右", "title": "Beyond feeder trip volume: how built environment shapes dockless bike–subway integration patterns across cities", "url": "https://doi.org/10.1016/j.tra.2026.105376", "authors": "Sida Luo ほか", "venue": "Transportation Research Part A: Policy and Practice", "date": "2026-11-19", "citescore": 12.1, "citescore_year": "2025", "why": "題名によれば、ドックレスのシェア自転車と地下鉄の接続のパターンを、乗り継ぎの量だけでなく都市をまたいで比べ、建造環境がそれをどう形づくるかを分析した論文（抄録は未取得）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、ドックレスのシェア自転車と地下鉄の接続のパターンを、乗り継ぎの量だけでなく都市をまたいで比べ、建造環境がそれをどう形づくるかを分析した研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "駅まで乗り捨て型のシェア自転車で行く人は、どんな街で多いのだろうか。題名によれば、この研究は乗り継ぎの「量」だけでなく「パターン」を都市ごとに比べ、道路や建物の配置との関係を調べている。街のつくりが移動の組合せ方を決めるかという問いが面白い。", "unverified": "抄録・本文を入手できず、対象の都市と分析の方法はすべて未確認。"}}, {"id": "jn39", "rank": 39, "field": "経済学", "headline": "中間投入物の価格と労働分配率", "title": "Intermediate Input Prices and the Labor Share", "url": "https://doi.org/10.1086/745092", "authors": "Juanma Castro-Vincenzi ほか", "venue": "Journal of Political Economy", "date": "2026-11-19", "sjr": 16.25, "citescore": 11.0, "citescore_year": "2025", "why": "題名によれば、中間投入物の価格の変化が労働分配率に与える影響を扱う論文（抄録は未取得）。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、Semantic Scholarに登録された抄録を使用", "preprint": false, "short": true, "p1": "原材料（中間投入物）の価格と労働分配率の関係を理論と実証で調べ、不完全競争と、原材料と本源的投入の補完性の下で、両者が負に関係することを示した（抄録）。", "p3": "原材料の価格の変動を米国の労働分配率の総体的な傾向と照らし合わせ、原材料の価格が労働分配率に与える因果的な効果を推定し、労働分配率の変化を分解して他の説明と比べた。枠組みを多国間に拡張した（抄録）。", "p5": "原材料の価格の変動は、2000年代の資源ブームの間の急な低下と近年の安定化を含む米国の労働分配率の傾向と一致した。原材料の価格が一定なら近年の労働分配率の低下はより小さく滑らかだったことを示し、世界の資源市場のショックが国ごとに異なる労働分配率の変化を生むことを理論と実証で示した（抄録）。", "fun": "会社の稼ぎのうち働く人に回る割合（労働分配率）は、アメリカで長く下がってきた。その理由としてよく挙がるのはロボットや独占だが、この研究は、石油や金属などの原材料の値段も大きく効いていると示した。資源の値段が働く人の取り分を動かすという意外なつながりが面白い。", "unverified": "抄録は別のデータベース（Semantic Scholar）から取った。本文は入手できず、因果推定の方法と国際比較の数値は確認できなかった。"}}, {"id": "jn40", "rank": 40, "field": "経済学", "headline": "大不況期の失業給付と失業：均衡効果の役割", "title": "Unemployment Benefits and Unemployment in the Great Recession: The Role of Equilibrium Effects", "url": "https://doi.org/10.1086/745090", "authors": "Marcus Hagedorn ほか", "venue": "Journal of Political Economy", "date": "2026-11-19", "sjr": 16.25, "citescore": 11.0, "citescore_year": "2025", "why": "題名によれば、大不況期の失業給付が失業に与えた影響を、均衡を通じた効果に注目して分析した論文（抄録は未取得）。", "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、題名検索で見つけた記録（OpenAlex）の抄録を使用", "preprint": false, "short": true, "p1": "失業給付の延長が失業者の求職行動だけでなく雇用主の求人の創出にも影響するという均衡効果を測る新しい方法を開発し、給付延長の効果を推定した（抄録）。", "p3": "既存の実証研究は失業者の求職の決定への効果だけを扱っていたため、雇用主の求人創出の決定への効果を取り込むための新しい方法論を開発し、データに適用した（抄録）。", "p5": "給付の延長は均衡賃金を上げ、求人の創出と雇用を急激に縮小させ、失業を増やした（抄録）。", "fun": "失業手当を長くすると、失業した人がゆっくり仕事を探すだけでなく、会社が求人を出すのを控えるかもしれない。この研究は、その会社側の反応まで測る方法を作り、手当の延長が賃金を押し上げ、求人と雇用を減らしたと結論した。政策の効果が市場全体を巡って返ってくる点が面白い。", "unverified": "抄録は題名検索で見つけた記録から取った。本文は入手できず、効果の大きさと識別の方法の詳細は確認できなかった。"}}, {"id": "jn41", "rank": 41, "field": "経営学", "headline": "汚職官僚の失脚が都市の起業を促す", "title": "Dismantling organized crime's “protective umbrella”: How the downfall of corrupt officials fuels urban entrepreneurship in China", "url": "https://doi.org/10.1016/j.j   stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
