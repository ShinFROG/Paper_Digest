026-11-19", "sjr": 0.733, "citescore": 5.0, "citescore_year": "2025", "apa": "Ipsen, C., Gish, L., & Vitrano, G. (2026). Workplace health interventions in SMEs – experiences of employees performing as in-house facilitators. International Journal of Workplace Health Management, 1–19. https://doi.org/10.1108/ijwhm-10-2025-0278", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "デンマークの中小企業3社の健康・組織介入で、専門の訓練を受けていない社内の従業員が進行役（ファシリテーター）を務めた経験を、複数事例研究で分析した（抄録）。", "p3": "製造業とITの3社がそれぞれ2つの介入を行い、各社で訓練歴のない従業員2人を進行役に任命した。6か月にわたり特性要因図、時系列のワークショップ、従業員・進行役・管理者への面接、終了時の調査でデータを集めた（抄録）。", "p5": "社内の進行役は職場の健康の課題の特定を助け、文脈に合った解決策に貢献した。既存の進行役の能力に加え、組織の環境と参加者の必要に行動を合わせる文脈への感受性と、個人の経験と関心に基づく創造的な問題解決（ブリコルール的な役割）が特徴だった（抄録）。", "fun": "職場の働きやすさを良くする話し合いには上手に進める司会役が欠かせないが、小さな会社では専門家を呼ぶ余裕がない。この研究では普通の社員が司会役を務め、職場をよく知る強みと、手持ちのもので工夫する力を発揮していた。専門家でないことが、かえって強みになる場面がある点が面白い。", "unverified": "出版社の本文は入手できず、介入の具体的な内容と効果の評価は確認できなかった。"}}, {"id": "jr50", "rank": 50, "headline": "スマートシティと健康な高齢化の文献を整理", "title": "Smart Cities and Healthy Ageing: A Rapid Scoping Review of Enablers, Barriers, and Equity Considerations for Age-Inclusive Urban Transformation", "url": "https://doi.org/10.1093/geront/gnag258", "authors": "Jed Montayre ほか", "venue": "Gerontologist", "date": "2026-11-18", "sjr": 1.552, "citescore": 7.0, "citescore_year": "2025", "apa": "Montayre, J., Lee, N. K. K., & Ling, K. K. (2026). Smart Cities and Healthy Ageing: A Rapid Scoping Review of Enablers, Barriers, and Equity Considerations for Age-Inclusive Urban Transformation. The Gerontologist. https://doi.org/10.1093/geront/gnag258", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "スマートシティの施策と健康な高齢化の関係を、2015〜2025年の文献の迅速なスコーピングレビューで整理し、促進要因・障壁・公平性の論点を示した（抄録）。", "p3": "5つのデータベースとScienceDirectの対象を絞った検索で、健康な高齢化に関わるデジタルまたはデータに基づく都市・地域のシステムを扱う研究を選び、システムに統合されない個別の家庭用の技術は除いた（抄録）。", "p5": "26研究が含まれ、19件（73.1%）が2023〜2025年の発表、14件がアジアの研究だった。証拠は4つの領域（スマートな統治と参加、移動と公共空間、データに基づく計画、地域と統合したケア）に集まり、使いやすい設計や人の支援が促進要因、デジタル・リテラシーの不足や費用・プライバシーの懸念が障壁だった（抄録）。", "fun": "便利なデジタルの街づくりは、お年寄りにとっても便利だろうか。調べてみると、使い方が難しい、お金がかかる、個人情報が心配といった壁があり、人による手助けやデジタル以外の選択肢を残すことが鍵だった。最新の技術ほど、取り残される人への配慮が要るという点が面白い。", "unverified": "出版社の本文は入手できず、各研究の質の評価は確認できなかった。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "Amazonの推奨枠は需要を自社へ誘導しうる", "title": "Two‐Sided Markets Shaped by Platform‐Guided Search", "url": "https://doi.org/10.3982/ecta22288", "authors": "Kwok Hao Lee ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "apa": "Lee, K. H., & Musolff, L. (2026). Two‐Sided Markets Shaped by Platform‐Guided Search. Econometrica, 94(6), 2081–2115. https://doi.org/10.3982/ecta22288", "why": "Amazonで商品ごとに1つの出品者を目立たせるBuybox（推奨枠）の販売データで構造モデルを推定し、消費者の95%がBuyboxの出品しか検討しないため、プラットフォームが需要を誘導できることを示す。Buyboxは価格に強く反応するが、自社の出品に偏る。", "explain": {"basis": "抄録", "basis_note": "出版社のサイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "Amazonで商品ごとに1つの出品者を目立たせるBuybox（推奨枠）の販売データで構造モデルを推定し、プラットフォームが需要を誘導できること、推奨枠は自社の出品に偏るが消費者には損になっていないことを示した（抄録）。", "p2": "Amazonのような垂直統合したプラットフォームが、アルゴリズムによる目立たせ方で需要を自社の出品へ誘導し、消費者を害しているのではないかという懸念があったが、その効果を定量化した証拠は乏しかった（抄録）。", "p3": "新しいAmazonの販売データと推奨枠のデータで、アルゴリズムによる目立たせ方が消費者の選択、売り手の価格設定、参入に与える効果を捉える構造モデルを推定した（抄録）。解釈：どの出品が推奨枠に選ばれるかと消費者がどれを検討するかを同時にモデル化し、推奨枠の偏りを変えた場合の消費者余剰を反実仮想で計算する設計である。", "p4": "評価は、消費者が推奨枠の出品だけを検討する割合、推奨枠の価格弾力性、Amazon自身の出品の優遇の度合い、優遇の度合いを変えた場合の消費者余剰である（抄録）。", "p5": "消費者の95%が推奨枠の出品しか検討しないため、プラットフォームは需要を誘導できた。推奨枠は価格に強く反応する（弾力性−21）が、Amazon自身の出品は、観察できる特徴が似た5%安い出品と同じ頻度で選ばれていた。ただし消費者がAmazonの出品を好むため、この偏りは消費者を害する自己優遇ではなく、消費者余剰は推定されたAmazonの優遇の水準でほぼ最大だった（抄録）。", "p6": "解釈：消費者がAmazonの出品を好む理由（配送や返品の信頼など）をモデルがどう扱うかで結論が変わりうり、出品者の長期的な参入への影響や他の市場への一般化は抄録からは確認できない。", "fun": "通販サイトで商品を選ぶとき、ほとんどの人は最初に表示される「おすすめの売り手」から買う。Amazonがその枠を自社に有利に使っているのではと疑われてきたが、この研究の計算では、確かにAmazon自身の出品はやや優遇されていたものの、客がもともとAmazonから買うのを好むため、客の損にはなっていなかった。疑いを数字で確かめると意外な答えが出る点が面白い。", "unverified": "出版社の本文は入手できず、データの期間・商品の範囲、構造モデルの仕様は確認できなかった。"}}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "超富裕層の富は貯蓄・相続・運用益で決まる", "title": "Why Are the Wealthiest so Wealthy? New Longitudinal Empirical Evidence and Implications for Theories of Wealth Inequality", "url": "https://doi.org/10.3982/ecta23194", "authors": "Joachim Hubmer ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "apa": "Hubmer, J., Halvorsen, E., Salgado, S., & Ozkan, S. (2026). Why Are the Wealthiest so Wealthy? New Longitudinal Empirical Evidence and Implications for Theories of Wealth Inequality. Econometrica, 94(6), 2117–2148. https://doi.org/10.3982/ecta23194", "why": "ノルウェーの1993〜2019年の行政パネルで、45〜64歳の上位0.1%世帯の中央値に対する超過資産を、高い貯蓄率・相続・運用収益・労働所得に分解する。超富裕層の4分の1は負の資産から急速に富を築いた新興の富で、残りは相続した富を平均以上の貯蓄と運用で増やしている。", "explain": {"basis": "抄録", "basis_note": "出版社のサイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ノルウェーの1993〜2019年の行政パネルで、45〜64歳の上位0.1%世帯の中央値に対する超過資産を、貯蓄率・相続・運用収益・労働所得に分解し、「新興の富」と「旧来の富」で富の築き方が違うことを示した（抄録）。", "p2": "富の格差の理論は横断的な富の集中を説明できても、超富裕層が生涯の中でどのように富を築くかという動態の事実とは照合されていなかった（抄録）。", "p3": "資産と所得の行政データで、予算制約に基づく新しい分解の方法を使い、上位0.1%の世帯の45〜64歳の超過資産を、高い貯蓄率・相続・運用収益・労働所得の寄与に分けた。その動態の事実で、5つの標準的な富の格差のモデルを評価した（抄録）。解釈：毎年の資産の変化を「稼いだ分・貯めた分・増えた分・もらった分」に会計的に分ける発想である。", "p4": "評価は、超過資産の分解の割合、新興の富と旧来の富の動態、5つのモデルが横断の集中と動態の両方を再現できるかである（抄録）。", "p5": "超過資産の内訳は、高い貯蓄率36%、相続31%、運用収益28%、労働所得5%だった。超富裕層の4分の1の「新興の富」は平均で負の資産から始まり、高い労働所得と非常に高い貯蓄率・運用収益で急速に富を築き、「旧来の富」は多くを相続して平均以上だが控えめな貯蓄と運用で増やした。標準的なモデルは横断の集中を合わせても動態を再現できず、収穫逓減の技術と非相似的な選好を持つ異質な起業家モデルが観測と整合した（抄録）。", "p6": "解釈：ノルウェーは資産が課税の記録で把握できる特殊な環境で、他国への一般化には注意が要る。非上場株式などの資産の評価の方法が分解の結果に与える影響は抄録からは確認できない。", "fun": "大金持ちはなぜ大金持ちなのか。親から受け継いだからか、自分で稼いで貯めたからか。ノルウェーの国の記録を1993年から2019年までたどると、超富裕層の4分の1は借金の状態から出発し、稼ぎと高い貯蓄率と運用で一気に富を築いた「新しいお金持ち」だった。お金持ちにも2種類いて、従来の理論はその両方を説明できていなかったという点が面白い。", "unverified": "出版社の本文は入手できず、分解の方法の詳細と5つのモデルの名前は確認できなかった。"}}, {"id": "jn03", "rank": 3, "field": "経済学", "headline": "人は現金給付より仕事を通じた再分配を選ぶ", "title": "Informal Redistribution Through Work", "url": "https://doi.org/10.3982/ecta22079", "authors": "Elisa Macchi ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "apa": "Macchi, E., & Stalder, J. (2026). Informal Redistribution Through Work. Econometrica, 94(6), 2263–2295. https://doi.org/10.3982/ecta22079", "why": "ウガンダ・カンパラのフィールド実験と企業調査で、雇用主も労働者も現金給付より仕事を通じた再分配を一貫して選び、限界生産物がゼロの作業にも雇用主が支払うことを示す。生産価値や社会的評判では説明できず、仕事を通じて再分配すべきだという内面化された規範が動機だとする。", "explain": {"basis": "抄録", "basis_note": "出版社のサイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ウガンダ・カンパラのフィールド実験と企業調査で、雇用主も労働者も現金の給付より「仕事を通じた再分配」を一貫して選び、その動機が生産の価値ではなく内面化された規範であることを示した（抄録）。", "p2": "途上国の企業では、人を雇って仕事を与えることが一種の再分配として機能している可能性があるが、それが生産のためなのか、評判やネットワークのためなのか、規範のためなのかは分かっていなかった（抄録）。", "p3": "雇用主と労働者に仕事を通じた再分配と現金給付を選ばせ、作業を無作為に割り当てて一部を限界生産物ゼロの作業にし、生産価値・社会的評判・ネットワークといった代替の説明を検証した（抄録）。解釈：役に立たない作業にも雇用主がお金を払うなら、動機は生産ではないと言える。", "p4": "評価は、仕事を通じた再分配への支払意思、価値ゼロの作業への支払い、代替の説明との整合、規範の存在を示す実験の証拠、企業の大きさと生産性の測定への影響である（抄録）。", "p5": "雇用主と労働者は仕事を通じた再分配を現金給付より一貫して選び、雇用主は価値ゼロの作業にも支払った。社会的評判やネットワークでは説明できなかった。雇用主は労働者に検証できる緊急事態があるときだけ仕事を求めなくなり、労働者側は稼ぐことの互恵と尊厳を重んじた。この再分配を考えないと、企業は実際より大きく生産性が低く見えた（抄録）。", "p6": "解釈：カンパラの企業と労働者の実験で、他の地域や文化への一般化には注意が要る。効果の大きさと標本の規模は抄録からは確認できない。", "fun": "困っている知り合いにお金をあげる代わりに、仕事を頼んで給料を払う。ウガンダの調査では、雇う側も働く側も、ただでもらうより働いてもらう方を好み、雇う側は何の役にも立たない作業にさえお金を払っていた。「働かざる者食うべからず」と「稼いで得る誇り」という考え方が、経済の数字まで変えてしまう点が面白い。", "unverified": "出版社の本文は入手できず、実験の参加者数、支払意思の大きさ、企業の測定への影響の数値は確認できなかった。"}}, {"id": "jn04", "rank": 4, "field": "経済学", "headline": "予測アルゴリズムから理論の反例を自動生成", "title": "From Predictive Algorithms to the Automatic Generation of Anomalies", "url": "https://doi.org/10.3982/ecta22958", "authors": "Sendhil Mullainathan ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "apa": "Mullainathan, S., & Rambachan, A. (2026). From Predictive Algorithms to the Automatic Generation of Anomalies. Econometrica, 94(6), 2025–2047. https://doi.org/10.3982/ecta22958", "why": "研究者の直観に代えて予測アルゴリズムを使い、理論の欠陥を示すアノマリー（アレのパラドックスのような反例）を自動生成する手順を開発する。くじの選択を正確に予測するニューラルネットから、期待効用理論の既知のアノマリーを再発見し、新しいアノマリーも見つける。", "explain": {"basis": "抄録", "basis_note": "出版社のサイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "予測アルゴリズムと理論を与えると、その理論の欠陥を示す反例（アノマリー）を自動生成する手順を開発し、期待効用理論の既知と新しいアノマリーを見つけ、新しいアノマリーでも人が理論に反することを実験で確かめた（抄録）。", "p2": "機械学習のアルゴリズムは予測は得意でも、そこから理論的な洞察を引き出すのは難しい。研究者はアレのパラドックスのような反例を直観で作って理論の欠陥を示してきた（抄録）。", "p3": "研究者の直観の代わりに予測アルゴリズムを使い、理論の予測とアルゴリズムの予測が食い違う具体的な選択の問題を探して、理論のアノマリーを自動的に生成する手順を作った（抄録）。解釈：人の選択を正確に予測するニューラルネットと期待効用理論を突き合わせ、両者の答えが最も分かれる問題を探す発想である。", "p4": "くじの選択を正確に予測するニューラルネットで期待効用理論のアノマリーを生成し、既知のアノマリーを再発見できるか、新しいアノマリーで人が実際に理論に反するかを、報酬つきの実験で調べた（抄録）。", "p5": "既知の期待効用理論のアノマリーを再発見し、新しいアノマリーも見つけた。報酬つきの実験では、被験者はアルゴリズムが生成した新しいアノマリーで、アレのパラドックスや共通比効果と同程度の割合で期待効用理論に反した（抄録）。", "p6": "解釈：生成されるアノマリーは予測アルゴリズムの正確さに依存し、予測が外れる領域では見かけのアノマリーが生じうる。他の理論への適用の範囲と、違反の割合の数値は抄録からは確認できない。", "fun": "「人はこう選ぶはず」という経済学の理論の穴を見つけるには、研究者のひらめきで巧妙な問題を考える必要があった。この研究は、人の選び方をよく当てるAIと理論を比べ、両者の答えが食い違う問題をAIに探させた。実際に人に解かせると、有名なパラドックスと同じくらい理論から外れた。AIが研究者の「ひらめき」を手伝うという発想が面白い。", "unverified": "出版社の本文は入手できず、新しいアノマリーの具体例と違反の割合の数値は確認できなかった。"}}, {"id": "jn05", "rank": 5, "field": "因果推論", "headline": "公式で決まる処置の最適な操作変数", "title": "Optimal Formula Instruments", "url": "https://doi.org/10.3982/ecta24250", "authors": "Kirill Borusyak ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "apa": "Borusyak, K., & Hull, P. (2026). Optimal Formula Instruments. Econometrica, 94(6), 2227–2261. https://doi.org/10.3982/ecta24250", "why": "政策の受給資格のように複雑な公式で決まる処置の効果を推定する際、外生ショックへの曝露の異質性を取り込み、再中心化で偏りを避けたより強い操作変数を構成して、その漸近的に効率的な形と実行可能な近似のアルゴリズムを示す。シミュレーション操作変数に比べて標準誤差が大きく下がる。", "explain": {"basis": "抄録", "basis_note": "出版社のサイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "公共政策の受給資格のように複雑な公式で決まる処置の効果を推定するため、外生的なショックへの曝露の異質性を取り込み、再中心化で偏りを避けたより強い操作変数を構成し、その漸近的に効率的な形と実行可能な近似を示した（抄録）。", "p2": "複雑な公式で決まる処置の効果の推定では、外生的なショックの単純な関数を操作変数にすることが多く、代表例が州の政策の寛大さの変動を捉えるシミュレーション操作変数だが、その検出力は限られていた（抄録）。", "p3": "ショックへの曝露の異質性を取り込んだ操作変数を作り、偏りを避けるために再中心化の手続きを使う。このクラスで漸近的に効率的な操作変数を特徴づけ、その実行可能な近似を作るアルゴリズムを提案した（抄録）。解釈：誰がどれだけ政策の変化にさらされるかを公式から計算し、その「期待される曝露」を差し引いて偏りを除くという考え方である。", "p4": "2014年の医療費負担適正化法（ACA）によるメディケイドの拡大で、メディケイドへの加入が民間保険を押し出す効果（クラウドアウト）を推定し、シミュレーション操作変数と標準誤差を比べた（抄録）。", "p5": "提案法はシミュレーション操作変数に比べ、メディケイドへの加入による民間保険のクラウドアウト効果の標準誤差を44%小さくした（抄録）。点推定値は抄録にない。", "p6": "解釈：再中心化には処置を決める公式とショックの分布の知識が必要で、それが誤っている場合の頑健さは抄録からは確認できない。応用は1つの政策の例にとどまる。", "fun": "「どの州でどれだけ医療保険の制度が手厚くなったか」は、人々の行動の変化の原因を調べる良い手がかり（操作変数）になる。ただ、同じ制度の変化でも、収入や家族構成によって影響を受ける度合いは人ごとに違う。この研究は、その違いをうまく取り込むことで、推定の誤差の幅を4割以上も小さくした。手がかりの使い方の工夫で精度が大きく上がる点が面白い。", "unverified": "出版社の本文は入手できず、効率的な操作変数の式と、応用での点推定値は確認できなかった。"}}, {"id": "jn06", "rank": 6, "field": "統計学", "headline": "回帰係数の厳密に有効なランダム化t検定", "title": "An Exact t ‐Test", "url": "https://doi.org/10.3982/ecta22545", "authors": "Guillaume A. Pouliot", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "apa": "Pouliot, G. A. (2026). An Exact t ‐Test. Econometrica, 94(6), 2297–2318. https://doi.org/10.3982/ecta22545", "why": "誤差が交換可能なら厳密に有効で、そうでなく条件付き不均一分散があっても最良線形予測子について漸近的に有効な、回帰係数1つのランダム化検定を、連続・離散の相関した共変量を含む一般の設計で構成する。長く未解決だった問題に答える。", "explain": {"basis": "抄録", "basis_note": "出版社のサイトは取得できず、Crossrefに登録された抄録を使用。抄録は短い", "preprint": false, "p1": "誤差が交換可能なら厳密に有効で、そうでなく条件付き不均一分散があっても最良線形予測子について漸近的に有効な、回帰係数1つについてのランダム化検定を、一般の共変量の設計で構成した（抄録）。", "p2": "多変量の線形回帰とランダム化に基づく推論は統計学と計量経済学の基本の道具だが、1つの回帰係数の値について、交換可能な誤差の下で厳密に有効で、最良線形予測子について漸近的に有効なランダム化検定を作る問題は長く未解決だった（抄録）。", "p3": "誤差の交換可能性を使うランダム化の検定を、連続・離散の共変量や共変量どうしの相関を許す一般の設計に拡張した（抄録）。解釈：誤差の順番を入れ替えても分布が変わらないという仮定だけで、有限の標本でも正確な有意水準を保証する考え方である。", "p4": "評価は、交換可能な誤差の下での有限標本での厳密な妥当性と、交換可能でない誤差（特に条件付き不均一分散）の下での漸近的な妥当性の証明である（抄録）。", "p5": "提案の検定は交換可能な誤差の下で厳密に有効で、一般の共変量の設計を許し、誤差が交換可能でない場合、特に条件付き不均一分散がある場合にも漸近的に有効であることを示した（抄録）。数値実験の結果は抄録にない。", "p6": "解釈：検出力や計算の手間について、通常のt検定や頑健な標準誤差を使う方法との比較は抄録からは確認できない。", "fun": "データの関係を直線で表す回帰分析で「この係数はゼロか」を調べるのがt検定だ。普通のt検定は標本が大きいときに近似的に正しいだけで、小さな標本ではずれることがある。この研究は、データの並べ替えのアイデアを使い、条件が整えば標本が小さくても正確で、整わなくても大きな標本では正しい検定を作った。教科書の基本の道具を作り直した点が面白い。", "unverified": "出版社の本文は入手できず、検定統計量の形と、シミュレーションでの性能は確認できなかった。"}}, {"id": "jn07", "rank": 7, "field": "政治学", "headline": "密な住宅開発への反対は美的判断が動かす", "title": "How Sociotropic Aesthetic Judgments Drive Opposition to Dense Housing Development", "url": "https://doi.org/10.1017/s0003055426102226", "authors": "DAVID E. BROOCKMAN ほか", "venue": "American Political Science Review", "date": "2026-11-19", "sjr": 5.433, "citescore": 11.0, "citescore_year": "2025", "apa": "BROOCKMAN, D. E., ELMENDORF, C. S., & KALLA, J. L. (2026). How Sociotropic Aesthetic Judgments Drive Opposition to Dense Housing Development. American Political Science Review, 1–21. https://doi.org/10.1017/s0003055426102226", "why": "米国の住宅不足の一因である密な住宅開発への有権者の反対を、持ち家の自己利益（NIMBY）でなく、社会全体の景観についての美的判断から説明する理論を立て、記述研究と実験で検証する。密な地域を選んで住む人は密度への美的な嗜好を持ち、密な開発をより支持する。", "explain": {"basis": "本文", "basis_note": "出版社のHTML本文", "preprint": false, "p1": "米国で高密度の住宅開発への反対を、持ち家の自己利益（NIMBY）だけでなく「その場に合うか」という社会全体を思った美的判断（ソシオトロピックな美観）が生むという理論を立て、記述的な調査と複数の実験でその含意を確かめた。", "p2": "有権者の高密度開発への反対は米国の住宅不足の一因だが、従来の説明は持ち家の資産を守る自己利益やNIMBYを強調してきた。遠くの開発より近くの開発に反対する差をすべてNIMBYとみなす研究もあった。", "p3": "Prolificで2025年夏に集めた5,999人の調査、動画の介入を無作為に割り当てた12,595人の調査、2026年初めの5,064人の調査を使った。いずれも事前登録とIRBの承認を経ている。主な実験は、空き家を壊して5階建ての集合住宅を建てる計画について、場所・設計者・税収の使い道・駐車・新しい住民・環境配慮を無作為に変えて賛否（0〜1に変換）を尋ねるビネットである。", "p4": "比較は、自分の街区と国内の似た地域と既に5階建てが多い地域の間の賛否の差、美観の評判が良い設計者と悪い設計者の差である。別の実験では同じ5階建て・20戸の伝統的な建物を、周囲の街並みの様式だけを変えた画像で示した。さらに「現代の建物は醜い」と訴える動画で美的な懸念を呼び起こし、都市の規制緩和への賛否を比べた。", "p5": "自分の街区での計画への支持は、国内の似た地域より0.05ポイント低かったが、似た地域と5階建てが多い地域の差0.09ポイントの半分ほどで、遠近の差の約3分の2は密度の違いによるものだった。美観の評判が悪い設計者では支持が約0.13ポイント下がり、税収や住民の条件の効果の3倍を超えた。この効果は自分の街区か他の地域かで変わらなかった（交互作用β=0.014, p=0.47）。伝統的な街並みでは同じ建物への支持が上がり（b=0.074）、建物自体も美しいと評価された（b=0.092）。美的な懸念を呼び起こす動画は規制緩和への支持を下げた（p<0.01）。", "p6": "解釈：オンラインの調査は高学歴層と民主党支持者をやや多く含み（本文）、仮想の計画への回答が実際の公聴会や投票での行動と一致するかは別に検証が要る。米国以外の都市への一般化も本文では扱っていない。", "fun": "マンション建設に反対するのは「自分の家の値段が下がるから」だと考えられがちだ。しかしこの研究によると、遠くの町の計画でも、周りの景色に合わない建物には多くの人が反対し、評判の悪い建築家が設計すると聞くだけで賛成が大きく減った。同じ建物でも周りがレンガ造りの街並みだと「美しい」と評価される。住宅不足の解決策がデザインにもあるという点が面白い。", "unverified": "補足資料の表（A8、A17など）の数値と動画の実験の効果の大きさは本文の図の説明から読める範囲しか確認していない。"}}, {"id": "jn08", "rank": 8, "field": "組織行動・心理的安全性", "headline": "悪い人間関係が常に強く効くわけではない", "title": "Examining Negative Asymmetry in Employee Social Networks: A Meta-Analysis", "url": "https://doi.org/10.1177/01492063261495910", "authors": "Kameron M. Carter ほか", "venue": "Journal of Management", "date": "2026-11-19", "sjr": 8.251, "citescore": 21.4, "citescore_year": "2025", "apa": "Carter, K. M., Ghahremani, H., Crawford, E. R., Balkundi, P., & Barrett, R. J. (2026). Examining Negative Asymmetry in Employee Social Networks: A Meta-Analysis. Journal of Management. https://doi.org/10.1177/01492063261495910", "why": "職場の否定的な関係は肯定的な関係より従業員の成果に強く関係するという負の非対称性の仮定を、71標本・13,369人・248の効果量のメタ分析で検証する。負の非対称性に沿う証拠は一部の関係に限られ、むしろ正の非対称性に沿う結果も見られ、効果量のばらつきも大きかった。", "explain": {"basis": "抄録", "basis_note": "出版社のサイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "職場の否定的な人間関係（負の紐帯）は肯定的な関係（正の紐帯）より従業員の成果に強く関係するという「負の非対称性」の仮定を、メタ分析で検証した。71標本・13,369人の従業員の248の効果量から22のメタ分析の推定値を出した（抄録）。", "p2": "LabiancaとBrassの社会的台帳理論は、負の紐帯が生む社会的負債は正の紐帯が生む社会的資産より従業員の成果に強く関係すると仮定する。この結論は広く受け入れられてきたが、それを支える実証の蓄積は意外に少なかった（抄録）。", "p3": "既存の研究から正と負の紐帯と従業員の成果の関係の効果量を集め、紐帯の向き（自分から相手への出次数か、相手から自分への入次数か）と成果の種類（課題の業績、組織への愛着など）ごとにメタ分析で統合し、正と負の効果の大きさを比べた（抄録）。", "p4": "評価は、正と負の紐帯それぞれと成果の二変量の関係の有意性、出次数と入次数で分けた場合に負の非対称性と正の非対称性のどちらが見られるか、効果量のばらつきである（抄録）。", "p5": "二変量では正と負の紐帯のどちらも成果と有意に関係した。負の非対称性と整合したのは、出次数の紐帯が課題の業績を予測する場合だけだった。逆に、入次数の紐帯と課題の業績、入次数と出次数の紐帯と組織への愛着では、正の紐帯の方が強い「正の非対称性」に近かった。ただし入次数と愛着の関係は比較的小さく、効果量のばらつきも大きかった（抄録）。", "p6": "解釈：元の研究の多くは横断的な調査で、紐帯と成果の因果の向きは決められない。ばらつきの大きさは、職場や文化による調整要因があることを示唆しており、抄録も今後の課題としている。", "fun": "「嫌な同僚1人の影響は、良い同僚何人分にも勝る」という考えは、職場の人間関係の研究で長く当然とされてきた。この研究が71の調査を集め直すと、それが当てはまるのは「自分が嫌っている相手」が仕事の出来に影響する場合だけで、組織への愛着などでは良い関係の方が強く効いていた。常識とされた説を、データを束ねて確かめ直す姿勢が面白い。", "unverified": "出版社の本文は入手できず、22の推定値それぞれの大きさと、調整要因の分析の有無は確認できなかった。"}}, {"id": "jn09", "rank": 9, "field": "経営学", "headline": "主要顧客のAI導入が取引先へ波及する", "title": "Artificial Intelligence Along the Supply Chain", "url": "https://doi.org/10.1287/msom.2024.1549", "authors": "Ling Cen ほか", "venue": "Manufacturing & Service Operations Management", "date": "2026-11-19", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "apa": "Cen, L., Han, Y., Qiu, J., & Wu, J. (2026). Artificial Intelligence Along the Supply Chain. Manufacturing & Service Operations Management. https://doi.org/10.1287/msom.2024.1549", "why": "サプライチェーンでつながる企業間のAI技術の普及を調べ、主要顧客のAI導入がそれに依存する供給企業のその後の導入を有意に予測することを示し、内生性に対処する複数の実証戦略で因果効果を確かめる。", "explain": {"basis": "抄録", "basis_note": "出版社のサイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "主要な顧客企業がAIを導入すると、その顧客に依存する仕入先が後からAIを導入することを示し、AIの技術がサプライチェーンに沿って広がる因果の効果と、その経路が顧客からの学習であることを明らかにした（抄録）。", "p2": "AIの急速な進歩は生産と業務のあり方を変えつつあるが、AIの技術が経済的につながった企業の間、特にサプライチェーンの取引先の間でどう広がるかは十分に調べられていなかった（抄録）。", "p3": "顧客と仕入先の取引関係のデータで、主要な顧客のAIの導入が依存する仕入先の後の導入を予測するかを調べた。内生性への対処として、プラセボ検定、選択の検定、H-1Bビザの抽選の結果を使った識別の戦略を用いた（抄録）。解釈：ビザの抽選で偶然AIの人材を得た顧客を比べることで、もともとAIに積極的な企業どうしが取引しているだけという説明を退ける設計である。", "p4": "評価は、顧客の導入後の仕入先の導入の確率、普及の経路が学習か顧客への迎合か、関係特殊的な投資や交流の頻度による違い、仕入先の品質と費用への効果である（抄録）。", "p5": "主要な顧客のAIの導入は、依存する仕入先の後の導入を有意に予測し、因果の効果として確認された。普及は主に顧客への迎合ではなく学習によるもので、仕入先は顧客から特定のAIの用途を取り入れていた。学習の効果は関係特殊的な投資が大きく交流が頻繁な関係で強く、AIが普及した仕入先は品質の向上と費用の削減で大きな利益を得た（抄録）。効果の大きさは抄録にない。", "p6": "解釈：AIの導入の測り方（求人や特許など）によって捉えられる技術の範囲が変わりうる。抄録は資源の限られた小さな仕入先にとって取引関係が重要だと述べるが、規模別の推定の詳細は確認できない。", "fun": "AIを使いこなす大企業と取引している中小の部品メーカーは、自分たちもAIを使い始めやすい。この研究は、それが単に「お得意様に合わせた」のではなく、取引の中で使い方を学んだ結果であることを、ビザの抽選という偶然を手がかりに示した。新しい技術が取引のつながりを通じて広がり、品質の向上と費用の削減につながる点が面白い。", "unverified": "出版社の本文は入手できず、データの国・期間・企業数、AIの導入の測り方、効果の数値は確認できなかった。"}}, {"id": "jn10", "rank": 10, "field": "オペレーションズ・リサーチ", "headline": "猛暑で配達員は多く働き遅配も増える", "title": "The Impact of Heat Hazard on Gig Economy Workers: Evidence from An On-demand Food Delivery Platform", "url": "https://doi.org/10.1287/msom.2025.0410", "authors": "Run Ge ほか", "venue": "Manufacturing & Service Operations Management", "date": "2026-11-19", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "apa": "Ge, R., Lu, S. F., & Mao, W. (2026). The Impact of Heat Hazard on Gig Economy Workers: Evidence from An On-demand Food Delivery Platform. Manufacturing & Service Operations Management. https://doi.org/10.1287/msom.2025.0410", "why": "中国の大手料理配達プラットフォームの運用データと高頻度の気象データで、極端な暑さの下で配達員が受ける注文と労働時間が増え、遅配の割合も高まり、時給は少し上がることを示す。暑熱による健康費用の試算も加え、短期の供給拡大と労働者の健康の間の緊張を示す。", "explain": {"basis": "抄録", "basis_note": "出版社のサイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "中国の大手フードデリバリーのプラットフォームの業務データと高頻度の気象データで、酷暑のとき配達員はより多く注文を受けて長く働く一方、遅配の割合が大きく上がることを示し、健康費用の試算も示した（抄録）。", "p2": "ギグワーカーの配達員は屋外で長時間働き、時間に追われる環境にあるが、極端な暑さが彼らの働き方と負担にどう影響するかは、プラットフォームの需要と運営の反応を含めて定量化されていなかった（抄録）。", "p3": "2015年7月と8月の配達の業務データと気象データを結合し、働くかどうかの選択が無作為でないことを考慮して、配達員×時間の単位で2段階のヘックマンの選択モデルを推定した。極端な暑さは暑さ指数の「危険」と「極めて危険」の区分で定義した（抄録）。", "p4": "評価は、酷暑の時間帯の1時間あたりの受注数、労働時間、遅配の割合、時給の変化である。さらに暑さが健康に与える影響の医学研究と組み合わせ、保険の仕組みの違うシナリオで健康費用を試算した（抄録）。", "p5": "酷暑のとき、配達員は1時間あたり9.9%多く注文を受け、7.4%長く働いたが、遅配の割合は標本の平均より23.8%高かった。時給は9.3%、1時間あたり約1元増えた（抄録）。解釈：収入の増え方は小さく、負担の増え方に見合っていない可能性がある。", "p6": "解釈：データは1つのプラットフォームの2015年夏のもので、その後の料金の仕組みや配達員の保護の制度の変化は反映されない。健康費用は医学研究の値を使った例示的な試算である（抄録）。", "fun": "猛暑の日は外に出たくない人が出前を頼むので、配達の注文が増える。中国のデータでは、酷暑のとき配達員は1割近く多く注文を受けて長く働いたが、遅れも大きく増え、時給の増加は1時間に約1元だけだった。暑さの負担が最も弱い立場の働き手に集中する構図を、業務データで具体的に示した点が面白い。", "unverified": "出版社の本文は入手できず、配達員の数、都市の範囲、健康費用の試算の数値は確認できなかった。"}}, {"id": "jn11", "rank": 11, "field": "物理学", "headline": "2+1次元の相対論的量子場を原子で模擬", "title": "Analogue simulation of massive relativistic quantum fields in 2 + 1 dimensions", "url": "https://doi.org/10.1038/s41586-026-11268-y", "authors": "Yansheng Zhang ほか", "venue": "Nature", "date": "2026-11-18", "sjr": 19.713, "citescore": 77.7, "citescore_year": "2025", "apa": "Zhang, Y., Wang, F., Wong, P. H. C., Jenkins, A. C., Jiang, Y., Konstantinou, K., Carlse, G., Dogra, N., Thywissen, J. H., Eigen, C., & Hadzibabic, Z. (2026). Analogue simulation of massive relativistic quantum fields in 2 + 1 dimensions. Nature, 659(8141), 634–639. https://doi.org/10.1038/s41586-026-11268-y", "why": "一様な2次元のボース・アインシュタイン凝縮体の2つの結合したスピン成分の相対位相で、サイン・ゴルドン模型を符号化し、2+1次元の質量を持つ相対論的量子場を模擬する。調整できる質量ギャップを持つ相対論的な分散と、位相が2πだけ巻く位相的な磁壁などの非摂動的な現象を観測した。", "explain": {"basis": "本文", "basis_note": "出版社のPDF本文（オープンアクセス）", "preprint": false, "p1": "一様な2次元のボース・アインシュタイン凝縮体の中で、2つのスピン成分をコヒーレントに結合させ、その相対位相を場とみなすことで、2+1次元（空間2次元と時間）の質量を持つ相対論的な量子場（サイン・ゴルドン模型）のアナログ量子シミュレーションを実現した。", "p2": "量子場の理論は素粒子から宇宙論、物性まで複雑な相互作用系の基本模型だが、非摂動的で動的な領域、特に空間が1次元より多い場合に解くのが難しい。サイン・ゴルドン模型のシミュレーションはこれまで、一様な系では可積分になる1次元でしか実現されていなかった。", "p3": "39Kの原子の2つの超微細準位（|1,−1⟩と|1,0⟩）の混合気体を2次元の光の箱型トラップに閉じ込め、ラジオ波で最大2π×20 kHzのラビ結合を与えた。スピンの相互作用が結合より十分強いジョセフソン領域では、2成分の相対位相ϕの長波長の運動がサイン・ゴルドン方程式に従い、ラビ結合が場の質量を生む。磁場58 G付近で散乱長を調整し、温度は10 nK以下と見積もった。", "p4": "結合の位相を跳ばして全体のプラズマ振動を起こし、結合の強さを変調して有限の波数のスピン励起を作り、分散関係を測った。大きな位相のずれから始めて非摂動的な運動を調べ、状態を選んだ吸収撮像で位相の空間分布を再構成した。", "p5": "初期化では、系が相互作用の釣り合う基底状態のZ0を自ら見つけ、磁場の誤差に強かった（Zの誤差0.07未満）。摂動的な領域では、集団励起が質量ギャップを調整できる相対論的な分散を示し、理論と一致した。非摂動的な領域では、ϕが2πだけ急に回転する位相的なドメインウォールがほとんどの実験で現れ、その空間パターンは毎回ランダムに変わった。壁の幅は理論の予測と一致し（Z0の補正8%を含む）、結合の強さを変えると予測どおりに変化した（本文）。", "p6": "解釈：壁の幅の分布は広く、著者は壁が励起状態にあるためと推測している（本文）。宇宙論の現象（プレヒーティング、キブル・ズーレク機構、偽真空の崩壊）との対応は今後の課題として示された段階で、この論文では直接は検証していない。", "fun": "宇宙の始まりの物理は、実験室では再現できない。この研究では、絶対零度近くまで冷やした原子の薄い雲を使い、原子の「向き」の揺らぎが、質量を持つ素粒子の場と同じ方程式に従うようにした。すると、宇宙論で予言される「ドメインウォール」に当たる壁が実際に現れた。机の上の原子の雲で宇宙の現象を模擬できるという発想が面白い。", "unverified": "Methodsの導出と補足図（Extended Data）の詳細、偽真空の崩壊に関する付録は確認していない。"}}, {"id": "jn12", "rank": 12, "field": "地球科学", "headline": "断層帯の非弾性変形が大小の地震を生む", "title": "Small and large earthquakes driven by inelastic deformation in weak fault zones", "url": "https://doi.org/10.1126/sciadv.aef7106", "authors": "Peng Zhai ほか", "venue": "Science Advances", "date": "2026-11-18", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "apa": "Zhai, P., Huang, Y., & Ampuero, J.-P. (2026). Small and large earthquakes driven by inelastic deformation in weak fault zones. Science Advances, 12(47). https://doi.org/10.1126/sciadv.aef7106", "why": "断層面だけでなく周囲の断層帯の岩石の損傷と回復を含む動的な地震サイクルモデルで、同じ断層上の小さな地震と大きな地震が、断層すべりと断層帯の非弾性変形の相互作用から自然に生じることを示し、規模別頻度などの観測を再現する。", "explain": {"basis": "抄録", "basis_note": "出版社のサイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "断層面のすべりに加えて周囲の断層帯の岩石の損傷と回復（非弾性変形）を取り込んだ動的な地震サイクルのモデルで、1本の断層上に小さな地震と大きな地震の両方が自然に生じることを示した（抄録）。", "p2": "地震の規模は幅広く、破壊の大きさとすべり量も多様である。古典的な地震のモデルは断層面上の破壊だけを考えるが、実際には断層を囲む断層帯の岩石も非弾性的に変形する（抄録）。", "p3": "断層帯が損傷と回復によって自発的に変化する過程を組み込んだ動的な地震サイクルのモデルを作り、断層のすべりと断層帯の非弾性変形の相互作用をシミュレーションした（抄録）。解釈：岩石が壊れて弱くなり、時間とともに治るという性質を断層の周りに持たせたことで、同じ断層でも条件によって破壊の広がり方が変わる仕組みである。", "p4": "評価は、シミュレーションが観測の主要な特徴（グーテンベルク・リヒター則に従う規模別の頻度、規模によらない静的な応力降下量、破壊エネルギー密度の規模に対する2つの領域のスケーリング）を再現するかである（抄録）。", "p5": "シミュレーションは、グーテンベルク・リヒター則と整合する規模別の頻度、規模によらない静的な応力降下量、破壊エネルギー密度と地震の規模の2つの領域のスケーリングを再現した。著者らは、地震と断層帯の損傷の共進化が自然の地震の振る舞いを支配する基本的な仕組みだと結論した（抄録）。", "p6": "解釈：モデルの再現性は示されたが、損傷と回復の法則のパラメータが実際の断層でどの程度妥当かは観測との詳しい比較が要る。抄録は断層帯の物性の連続監視が応力状態の推定に役立つと示唆するが、具体的な監視の方法は確認できない。", "fun": "小さな地震はたくさん、大きな地震はまれに起こるという規則は昔から知られているが、1本の断層でなぜ両方が起こるのかは単純なモデルでは説明しにくかった。この研究は、断層の周りの岩が壊れて弱くなり、時間をかけて治るという性質をモデルに入れるだけで、その規則が自然に現れることを示した。断層の「周り」に目を向けた点が面白い。", "unverified": "出版社の本文は入手できず、モデルの方程式、パラメータ、計算した地震の数は確認できなかった。"}}, {"id": "jn13", "rank": 13, "field": "物理学", "headline": "重力で遮断できない無線通信を実証", "title": "Unblockable communication with gravity", "url": "https://doi.org/10.1126/sciadv.aee0802", "authors": "Andrew J. Groszek ほか", "venue": "Science Advances", "date": "2026-11-18", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "apa": "Groszek, A. J., Woffinden, C. W., Harvey, M. D., White, A. G., & Davis, M. J. (2026). Unblockable communication with gravity. Science Advances, 12(47). https://doi.org/10.1126/sciadv.aee0802", "why": "電磁波は遮蔽されうるため、遮断できない通信路はあるかを問い、質量を動かして2値のメッセージを符号化し、受信側が重力計でその信号を検出する通信の手順を提案する。レンガの壁越しに約0.7メートル、毎分1ビットでの伝送に成功した。", "explain": {"basis": "抄録", "basis_note": "出版社のサイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "送信側が質量を動かして2進数のメッセージを符号化し、受信側が重力計でその重力の信号を検出する無線通信の方式を提案し、約0.7 mの距離でレンガの壁を通して毎分1ビットの通信に成功した（抄録）。", "p2": "現在の無線通信はすべて電磁気に基づくが、電磁波は遮蔽や妨害を受けやすく、過酷な環境では使えることを保証できない。遮ることのできない通信路で情報を送れるかという根本的な問いがあった（抄録）。", "p3": "重力は物質で遮蔽できないことに着目し、送信側が質量の位置を動かして0と1を表し、受信側が重力計で重力の変化を測って読み取る通信の方式を設計し、実験で検証した（抄録）。", "p4": "評価は、物理的に現実的な条件で、壁を挟んだ送受信がどの距離と速度で成功するかである（抄録）。", "p5": "約0.7 mの距離で、レンガの壁を通して毎分1ビットの速度で重力のメッセージを送ることに成功した。著者らは、重力が実用上遮ることのできない通信の基盤になりうると結論した（抄録）。", "p6": "解釈：速度は毎分1ビットと非常に遅く、距離も1 m未満で、実用には大きな質量や高感度の重力計、雑音の除去が必要になる。誤り率や周囲の振動の影響は抄録からは確認できない。", "fun": "電波は金属の箱や厚いコンクリートで遮られるが、重力はどんな壁でも通り抜ける。この研究は、重りを動かして0と1を表し、壁の向こうの重力計でそれを読み取るという、極めて素朴な通信を実際にやってみせた。速さは1分に1ビットと遅いが、どんな妨害も受けない通信路が原理的に作れることを示した点が面白い。", "unverified": "出版社の本文は入手できず、動かした質量の大きさ、重力計の種類と感度、誤り率は確認できなかった。"}}, {"id": "jn14", "rank": 14, "field": "機械学習", "headline": "視覚言語モデルで脚ロボットが野外を踏破", "title": "Bridging vision-language reasoning and learned control for legged navigation in the wild", "url": "https://doi.org/10.1126/scirobotics.aee1549", "authors": "Takahiro Miki ほか", "venue": "Science Robotics", "date": "2026-11-18", "sjr": 5.883, "citescore": 32.1, "citescore_year": "2025", "apa": "Miki, T., Schmid, R., Patel, M., Tuna, T., Richter, J., Nubert, J., Lee, J., Müller, M., & Hutter, M. (2026). Bridging vision-language reasoning and learned control for legged navigation in the wild. Science Robotics, 11(120). https://doi.org/10.1126/scirobotics.aee1549", "why": "インターネット規模で事前学習した視覚言語モデルの常識的な推論と、シミュレーションの強化学習で得た歩行・局所計画を、開語彙セグメンテーションによるリスク地図でつないだROAMを提案する。脚ロボットが高山と都市の環境で、標識を読み危険を避けながらキロメートル規模の移動を行った。", "explain": {"basis": "抄録", "basis_note": "出版社のサイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "インターネット規模のデータで学習した視覚言語モデル（VLM）の常識的な推論と、シミュレーションの強化学習で得た歩行と局所計画の方策を組み合わせ、脚型ロボットが山岳と都市の複雑な環境でキロメートル規模の自律移動をするシステムROAMを開発した（抄録）。", "p2": "多様な実環境での自律移動はロボット工学の最大の課題の一つで、さまざまな地形に対応する頑健な運動制御と、環境の手がかりを解釈する高次の推論の両方が必要である（抄録）。", "p3": "VLMが場面の意味を解釈し、危険の評価や標識の読み取りを行って、意味のラベルと移動のコストを出す。語彙を限定しないセグメンテーションのモジュールがそのラベルを密な実時間のリスク地図に変え、強化学習で事前に学習した歩行と局所移動の2つの方策をその地図で条件づける（抄録）。", "p4": "評価は、アルプスの山岳と都市の多様な実環境での自律移動の実験で、人の介入の少なさ、標識の解釈による危険の回避、安全な足場の判断を調べた（抄録）。", "p5": "ロボットはキロメートル単位のハイキングを最小限の介入で完了し、標識を解釈して危険を避け、環境を評価して安全に足を置ける場所を見つけた。ただし著者らは、VLMの信頼性と空間推論にはなお課題があり、基盤モデルは野外の移動に不可欠だがまだ完全な解決策ではないと述べた（抄録）。", "p6": "解釈：実験は特定の地域と季節の試行で、介入の回数や失敗の種類の定量的な内訳は抄録からは確認できない。VLMの推論の遅さが速い移動の制約になるかも本文で確かめる必要がある。", "fun": "四つ足のロボットが山道を1 km以上も自分で歩き、「立入禁止」の看板を読んで危ない場所を避ける。足の動かし方はシミュレーションで練習し、景色の意味の理解はインターネットで学んだAIに任せるという分業で実現した。それでも著者らは、AIの空間の理解はまだ頼りないと率直に書いている。期待と限界の両方が見える点が面白い。", "unverified": "出版社の本文は入手できず、試験の総距離、介入の回数、使ったVLMとロボットの機種は確認できなかった。"}}, {"id": "jn15", "rank": 15, "field": "経済学", "headline": "労働増大型の技術を入れた生産関数の推定", "title": "Production Function Estimation With Factor‐Augmenting Technology: An Application to Markups", "url": "https://doi.org/10.3982/ecta19299", "authors": "Mert Demirer", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "apa": "Demirer, M. (2026). Production Function Estimation With Factor‐Augmenting Technology: An Application to Markups. Econometrica, 94(6), 1951–1990. https://doi.org/10.3982/ecta19299", "why": "CES型に頼らず多次元の生産性を許すようOlley–Pakesの枠組みを拡張して、労働増大型の技術を持つ生産関数を推定する方法を開発し、米国と途上国4か国の製造業に適用する。労働増大型の生産性を無視すると、資本の弾力性を過小に、可変投入の弾力性とマークアップを過大に推定する。", "explain": {"basis": "抄録", "basis_note": "出版社のサイトは取得できず、Crossrefに登録された抄録を使用。抄録は短い", "preprint": false, "p1": "労働増大的な技術（労働の生産性を高める技術進歩）を含む生産関数を、少ないパラメトリックな制約で推定する新しい方法を開発し、マークアップ（価格の費用に対する上乗せ）の推定に応用した（抄録）。", "p2": "生産関数の推定の主流であるOlley–Pakesの枠組みは生産性を1次元とみなし、労働増大的な技術を扱う既存の方法はCES型の生産関数に頼っていた。生産関数の推定はマークアップの推定の基礎になるため、その偏りは市場支配力の評価に直結する（抄録）。", "p3": "Olley–Pakesの仮定を多次元の生産性に拡張し、制御変数のアプローチと一階条件に基づく識別の戦略を作った。CES型に頼る従来の方法を一般化している（抄録）。解釈：資本と労働で生産性の向上の仕方が違ってよいとすることで、どの投入が生産にどれだけ効くかの推定の偏りを避ける発想である。", "p4": "米国と4つの途上国の製造業のデータで、産出の弾力性とマークアップを推定し、労働増大的な生産性を無視した場合と比べた（抄録）。", "p5": "すべての国で、労働増大的な生産性を無視すると、資本の弾力性を過小に、可変投入の弾力性を過大に推定し、マークアップも過大に推定することが分かった（抄録）。偏りの大きさは抄録にない。", "p6": "解釈：マークアップの上昇を示した先行研究の結論が、この偏りでどの程度変わるかは本文で確認する必要がある。途上国の国名と期間は抄録からは確認できない。", "fun": "企業が費用にどれだけ上乗せして値段をつけているか（マークアップ）は、独占や競争の度合いを測る物差しで、近年の上昇が話題になってきた。この研究は、技術進歩が人の働きの効率を高めるという当たり前の事実を推定に入れると、その上乗せが調べたすべての国で小さく出ることを示した。物差しの作り方で結論が変わりうる点が面白い。", "unverified": "出版社の本文は入手できず、使ったデータ、4つの途上国の名前、マークアップの推定値の差は確認できなかった。"}}, {"id": "jn16", "rank": 16, "field": "経済学", "headline": "中間財の長期の代替弾力性は高い", "title": "Intermediate Input Substitutability", "url": "https://doi.org/10.3982/ecta21141", "authors": "Alessandra Peter ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "apa": "Peter, A., & Ruane, C. (2026). Intermediate Input Substitutability. Econometrica, 94(6), 2049–2079. https://doi.org/10.3982/ecta21141", "why": "1990年代初めのインドの貿易自由化による恒久的で異質な関税の引下げを自然実験として、製造業事業所の8種類の中間投入の長期の代替弾力性を推定し、コブ・ダグラスの1を大きく上回る高い代替性を示す。短期や一時的な価格ショックではずっと低い弾力性になる。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "インドの製造業事業所で、中間投入物の間の長期の代替弾力性がコブ・ダグラスの1を大きく上回ることを、1990年代初めの貿易自由化を自然実験として示した（抄録）。", "p3": "恒久的で異質な関税の引下げが生んだ相対価格の変化を識別に使い、8つの大分類の材料投入の間の事業所レベルの長期の代替弾力性を推定し、その値を定量モデルに入れて投入の誤配分の損失を計算した（抄録）。", "p5": "長期の代替性は高い一方、短い期間や一時的な価格ショックではずっと低い弾力性が得られた。長期の弾力性を使うと、中間投入の誤配分による総産出の減少は29%で、補完的な投入を仮定する標準的な較正の3.5倍になった（抄録）。", "fun": "鉄が高くなったらアルミで代用する、というように、工場は材料を置き換えられる。この研究は、関税の引下げで材料の値段が変わったインドの経験から、長い目で見ると材料は意外なほど置き換えやすいことを示した。置き換えやすいほど、材料の配り方の無駄が経済全体に大きく響くという結果が面白い。", "unverified": "出版社の本文は入手できず、推定した弾力性の値は確認できなかった。"}}, {"id": "jn17", "rank": 17, "field": "経済学", "headline": "資産価格の変動を入れたキャピタルゲイン税", "title": "Putting the ‘Finance’ Into ‘Public Finance’: A Theory of Capital Gains Taxation", "url": "https://doi.org/10.3982/ecta24013", "authors": "Mark Aguiar ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "apa": "Aguiar, M., Moll, B., & Scheuer, F. (2026). Putting the ‘Finance’ Into ‘Public Finance’: A Theory of Capital Gains Taxation. Econometrica, 94(6), 1907–1949. https://doi.org/10.3982/ecta24013", "why": "資産価格がキャッシュフローだけでなく割引率でも変動するという現代ファイナンスの見方を入れた最適再分配課税を分析し、実現ベースのキャピタルゲイン税とキャッシュフロー税の組合せが価格変動の源によらず最適配分を実現することを示す。総純取引を対象にすることでロックイン効果も避けられる。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "資産価格がキャッシュフローだけでなく割引率でも変動するという現代ファイナンスの見方を入れて最適な再分配課税を分析し、実現ベースのキャピタルゲイン税とキャッシュフロー税の組合せが最適配分を実現することを示した（抄録）。", "p3": "資産価格の変動を明示的にモデル化した環境で最適な再分配課税を理論的に導き、包括的所得税（Haig–Simons）や富裕税・発生ベースのキャピタルゲイン税の提案と比べた（抄録）。", "p5": "この組合せは価格変動の源によらず最適配分を実現し、キャピタルゲイン税は個々の資産の売却益でなく総純取引を課税の対象とすることで、ポートフォリオの選択の歪み（ロックイン効果）を避ける。古典的な包括的所得税の概念や近年の富裕税の提案と対照的な結果である（抄録）。", "fun": "株を売ったときにだけ利益に税をかける仕組みだと、税を避けるために売らずに持ち続ける人が出る（ロックイン効果）。この研究は、個々の株の売却益ではなく売り買い全体の差し引きに税をかければ、この歪みを避けられると示した。税の「かけ方」を工夫するだけで行動の歪みが消える点が面白い。", "unverified": "出版社の本文は入手できず、モデルの仮定と最適な税の式は確認できなかった。"}}, {"id": "jn18", "rank": 18, "field": "経済学", "headline": "ネットワークの社会的学習には速度の上限", "title": "The Social Learning Barrier", "url": "https://doi.org/10.3982/ecta24769", "authors": "Florian Brandl", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "apa": "Brandl, F. (2026). The Social Learning Barrier. Econometrica, 94(6), 1991–2024. https://doi.org/10.3982/ecta24769", "why": "社会ネットワークで隣人の行動を見ながら繰り返し行動する主体について、最も学習の遅い主体の学習速度は、最も情報量の多い私的シグナルの分布だけで決まる定数で抑えられ、主体の数・ネットワーク構造・シグナルの相関・戦略によらないことを示す。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "社会ネットワークで隣人の行動を見ながら繰り返し行動する長期的な主体について、最も学習の遅い主体の学習速度に、主体の数やネットワーク構造によらない上限があることを示した（抄録）。", "p3": "各期に私的シグナルを受け取り、行動を選び、隣人の行動を観察する長期的な主体のモデルで、学習速度の上限を情報理論的に導いた。合理的な主体の均衡学習でも同じ上限が成り立つ条件を示した（抄録）。", "p5": "上限は最も情報量の多い私的シグナルの分布だけで決まり、主体数・ネットワーク構造・シグナルの相関・戦略に依存しない。合理的な主体の均衡では、広い条件の下ですべての主体の学習速度がこの上限で抑えられる。最適な行動の選択と情報の開示の間のトレードオフが原因である（抄録）。", "fun": "大勢が互いの行動を見て学べば、早く正解にたどり着けそうに思える。ところがこの研究は、人数やつながり方をどう変えても、学習の速さには超えられない天井があることを示した。自分に一番良い行動を選ぶほど周りに伝わる情報が減るという、選ぶことと伝えることの綱引きが原因だという点が面白い。", "unverified": "出版社の本文は入手できず、上限の具体的な式は確認できなかった。"}}, {"id": "jn19", "rank": 19, "field": "経済学", "headline": "試行回数が主体で異なるときの極値理論", "title": "Extreme Value Theory With Heterogeneous Agents", "url": "https://doi.org/10.3982/ecta22276", "authors": "Sephorah Mangin", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "apa": "Mangin, S. (2026). Extreme Value Theory With Heterogeneous Agents. Econometrica, 94(6), 2149–2192. https://doi.org/10.3982/ecta22276", "why": "生産性やアイデアなど、主体が分布から多数の値を引きその最大値で結果が決まる経済モデルで、引ける回数が主体によって異なる場合を探索技術として扱い、平均的な結果が変わるかを示す新しい極値分布のクラスを導く。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "主体が分布から多数の値を引きその最大値で結果が決まる経済モデルで、引ける回数が主体によって異なる場合の新しい極値分布のクラスを導いた（抄録）。", "p3": "各主体が受け取る試行回数を、主体の種類による期待回数の異質性を表す探索技術で与え、標準の3分布（フレシェ・ガンベル・ワイブル）を異質性込みで一般化した（抄録）。", "p5": "Gabaixら（2016）の極値の結果を一般化し、集計生産性・マークアップ・社会ネットワークへの応用を検討した（抄録）。応用での定量的な結果は抄録にない。", "fun": "たくさんのアイデアを試せる人ほど、その中の最高のものは良くなる。経済学ではこの「最大値の理論」で企業の生産性などを説明するが、試せる回数は人や企業によって違う。その違いを入れると、おなじみの3つの極値の分布が一つの大きな家族にまとまるという数学的な発見が面白い。", "unverified": "出版社の本文は入手できず、新しい分布の具体的な形と応用の結果は確認できなかった。"}}, {"id": "jn20", "rank": 20, "field": "経済学", "headline": "繰り返しゲームで連合を抑止する枠組み", "title": "Coalitions in Repeated Games", "url": "https://doi.org/10.3982/ecta23921", "authors": "S. Nageeb Ali ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "apa": "Ali, S. N., & Liu, C. (2026). Coalitions in Repeated Games. Econometrica, 94(6), 2193–2225. https://doi.org/10.3982/ecta23921", "why": "継続的な約束と罰で連合による阻止を抑止する履歴依存の仕組みをモデル化し、譲渡可能な効用の有無で有効性を評価する解概念を提案する。応用として労働市場の賃金の透明性の含意を分析する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。抄録は3文と短く、出版社の本文は入手できず", "preprint": false, "short": true, "p1": "連合による阻止を、継続的な約束と罰を使う履歴依存の仕組みで抑止する、繰り返しの連合行動の枠組みと解概念を提案した（抄録）。", "p3": "連合が阻止しないよう将来の約束と罰で抑止する仕組みをモデル化し、譲渡可能な効用がある場合とない場合でその有効性を評価した（抄録）。", "p5": "応用として、労働市場での賃金の透明性の含意を分析した（抄録）。具体的な結論は抄録にない。", "fun": "何人かが組んで抜け駆けする（連合を作る）のを防ぐには、「抜け駆けしたら将来ひどい目に遭う」という約束が効く。この研究は、1回きりではなく何度も繰り返される関係で、そうした約束と罰がどこまで連合を防げるかを理論化した。給料を公開すると労働者が団結しやすくなるかという身近な問いにも使える点が面白い。", "unverified": "出版社の本文は入手できず、解概念の定義と賃金の透明性についての結論は確認できなかった。"}}, {"id": "jn21", "rank": 21, "field": "経済学", "headline": "プロスペクト理論の価値が通貨の収益を予測", "title": "Prospect Theory and Currency Returns: Empirical Evidence", "url": "https://doi.org/10.1017/s0022109026103469", "authors": "Qi Xu ほか", "venue": "Journal of Financial and Quantitative Analysis", "date": "2026-11-19", "sjr": 4.404, "citescore": 7.1, "citescore_year": "2025", "apa": "Xu, Q., Kozhan, R., & Taylor, M. P. (2026). Prospect Theory and Currency Returns: Empirical Evidence. Journal of Financial and Quantitative Analysis, 1–37. https://doi.org/10.1017/s0022109026103469", "why": "為替収益の過去の分布から通貨ごとのプロスペクト理論の価値を作ると将来の超過収益を負に予測し、それに基づくロング・ショート戦略は年約5%を生む。裁定が限られるほど予測力が強く、ファンドは逆向きに取引して裁定者として働く。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "為替収益の過去の分布から作った通貨ごとのプロスペクト理論の価値が、将来の通貨の超過収益を負に予測することを示した（抄録）。", "p3": "通貨ごとに過去の為替収益の分布からプロスペクト理論の価値を計算し、将来の超過収益の予測力、ロング・ショート戦略の収益、裁定の制約による違い、銀行とファンドの注文フローとの関係を調べた（抄録）。", "p5": "この指標に基づくロング・ショート戦略は年約5%の収益を生み、予測力は裁定が限られるほど強かった。銀行の注文フロー（ディーラー間と自己勘定の取引が主）はプロスペクト理論の価値と正に関連し、ファンドは逆に取引して裁定者として働いた（抄録）。", "fun": "人は、たまに大当たりする「宝くじのような」値動きをする資産を好みすぎる傾向がある（プロスペクト理論）。この研究は、為替でも、過去にそういう値動きをした通貨が買われすぎ、その後の収益が低くなることを示した。株でよく知られた人間のくせが、国の通貨の世界にも現れる点が面白い。", "unverified": "出版社の本文は入手できず、対象の通貨と期間は確認できなかった。"}}, {"id": "jn22", "rank": 22, "field": "経済学", "headline": "トレンドの明瞭さがモメンタムを強める", "title": "Trended Momentum", "url": "https://doi.org/10.1017/s0022109026103275", "authors": "Charlie Xiaowu Cai ほか", "venue": "Journal of Financial and Quantitative Analysis", "date": "2026-11-19", "sjr": 4.404, "citescore": 7.1, "citescore_year": "2025", "apa": "Cai, C. X., Li, P., & Keasey, K. (2026). Trended Momentum. Journal of Financial and Quantitative Analysis, 1–38. https://doi.org/10.1017/s0022109026103275", "why": "価格のトレンドがはっきりしているほどモメンタムの収益が大きくなることを示し、トレンドの明瞭さが最も高い5分位で通常のモメンタム戦略を上回る収益を得る。パターン認識に基づく投資家の期待の形成から説明する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "価格のトレンドの明瞭さが、モメンタム（過去に上がった銘柄がさらに上がる現象）の収益を大きく強めることを示した（抄録）。", "p3": "認知心理学のパターン認識とヒューリスティックの理論に基づいてトレンドの明瞭さ（TC）を測り、5分位ごとのモメンタムの収益と、HongとStein（1999）の多期間の収益追随モデルでの取引の強度への影響を調べた（抄録）。", "p5": "トレンドの明瞭さが最も高い5分位は年率12.68%の収益を得て、通常のモメンタム戦略の6.90%を上回った。明瞭なトレンドでの取引はモメンタムの中心的な特徴で、既存の説明と区別でき、資産クラスと世界の市場をまたいで観察された（抄録）。", "fun": "株価のグラフがきれいな右肩上がりだと、人は「まだ上がる」と思いやすい。この研究は、上がり方が同じでも、ギザギザでなく「きれいな」上がり方をした株ほど、その後も上がり続けやすいことを示した。グラフの見た目の分かりやすさが投資家の期待を動かすという、人間らしいくせが面白い。", "unverified": "出版社の本文は入手できず、トレンドの明瞭さの計算方法と対象期間は確認できなかった。"}}, {"id": "jn23", "rank": 23, "field": "因果推論", "headline": "技術採用の相関ランダム係数モデルの弱識別", "title": "Comment on ‘Selection and Comparative Advantage in Technology Adoption’ by Tavneet Suri", "url": "https://doi.org/10.3982/ecta21760", "authors": "Emilia Tjernström ほか", "venue": "Econometrica", "date": "2026-11-19", "citescore": 13.2, "citescore_year": "2025", "apa": "Tjernström, E., Ghanem, D., Michuda, A., Barriga-Cabanillas, O., Lybbert, T. J., & Michler, J. D. (2026). Comment on ‘Selection and Comparative Advantage in Technology Adoption’ by Tavneet Suri. Econometrica, 94(6), 2319–2331. https://doi.org/10.3982/ecta21760", "why": "農業技術の採用を相関ランダム係数（CRC）モデルで分析した先行研究を公開データで再分析すると点推定値が大きく異なることを示し、より一般的なランダム係数モデルとして再定式化して、鍵となる構造パラメータの識別が弱いことを明らかにする。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "農業技術の採用を相関ランダム係数（CRC）モデルで分析したSuri（2011）を公開データで再分析し、鍵となる構造パラメータが弱識別に陥りやすいことを示して、頑健な推論の手順を提案した（抄録）。", "p3": "公開データでCRCモデルを再推定して点推定値の違いを示し、採用の収益が比較優位に線形な一般のランダム係数モデルとして再定式化して、基準の生産性と採用の収益の関係を決めるパラメータφの識別を調べた。検定の反転による弱識別に頑健な信頼区間を作った（抄録）。", "p5": "パラメータφは弱識別の問題を抱えやすく、頑健な信頼区間は元のSuri（2011）の点推定値を含んだ。結果の違いはわずかなデータの差と弱識別の組合せによると示唆する（抄録）。", "fun": "有名な研究を同じデータで計算し直したら、違う数字が出た。どちらかが間違っているのではなく、そもそもデータから答えを絞り込む力が弱かった（弱識別）ことが原因だった。答えの幅を正直に示せば、元の結果も新しい結果もその幅に収まる。数字一つより「どれだけ確かか」を示す大切さが分かる点が面白い。", "unverified": "出版社の本文は入手できず、点推定値の具体的な違いと信頼区間の幅は確認できなかった。"}}, {"id": "jn24", "rank": 24, "field": "経営学", "headline": "著名な最初の顧客は新興企業の後の契約を改善", "title": "Temporal tradeoffs and contracting dynamics in buyer–supplier agreements", "url": "https://doi.org/10.1002/smj.70142", "authors": "Jeffrey J. Reuer ほか", "venue": "Strategic Management Journal", "date": "2026-11-19", "sjr": 10.154, "citescore": 17.2, "citescore_year": "2025", "apa": "Reuer, J. J., & Li, T. X. (2026). Temporal tradeoffs and contracting dynamics in buyer–supplier agreements. Strategic Management Journal. https://doi.org/10.1002/smj.70142", "why": "陸上の石油・ガス掘削で、新興の掘削会社は著名な顧客と最初に契約するとき多くのリスクを負うが、その後の他の顧客との契約では負うリスクが減ることを示す。後の顧客が掘削会社の能力について多くの情報を持つほど、この改善は小さくなる。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "新興の供給企業は、著名な最初の顧客との契約で多くのリスクを負う代わりに、その後の他の顧客との契約でより良い条件を得ることを、陸上の石油・ガス掘削の契約で示した（抄録）。", "p3": "情報の経済学と組織間関係の認証の研究に基づき、新興の掘削会社が顧客の生産会社との契約で負うプロジェクトのリスク（責任）の条件を、最初の顧客とその後の新しい顧客で比べた（抄録）。", "p5": "著名な顧客と最初に組んだ掘削会社は、最初の契約で多くのリスクを負い、その後の他の顧客との契約では負うリスクが減った。この改善は、創業者が連続起業家の場合や後の顧客が掘削事業を垂直統合している場合など、後の顧客が能力の情報を多く持つときに小さかった（抄録）。", "fun": "駆け出しの会社が有名な大企業と最初に取引するとき、不利な条件をのんででも実績を作ろうとする。その実績が「お墨付き」になり、次の取引では有利な条件を引き出せる。ただし相手がもともと事情に詳しい場合はお墨付きの効き目が小さいという、信用の仕組みが見える点が面白い。", "unverified": "出版社の本文は入手できず、標本の規模と効果の大きさの数値は確認できなかった。"}}, {"id": "jn25", "rank": 25, "field": "経営学", "headline": "サステナビリティ連動ローンはなぜ効かないか", "title": "On the (In)Efficiency of Sustainability-Linked Loans", "url": "https://doi.org/10.1287/msom.2026.0230", "authors": "Vernon Hsu ほか", "venue": "Manufacturing & Service Operations Management", "date": "2026-11-19", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "apa": "Hsu, V., Lai, G., Liang, G., & Li, Y. (2026). On the (In)Efficiency of Sustainability-Linked Loans. Manufacturing & Service Operations Management. https://doi.org/10.1287/msom.2026.0230", "why": "持続可能性の目標を達成すると金利が下がるはずのサステナビリティ連動ローンは、実証的には金利の低下がほとんどなく、ESGリスクの低い企業に偏っている。このローンが実際にどう機能し、何が効果を制限し、どう設計すべきかを分析する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "持続可能性の目標を達成すると金利が下がるはずのサステナビリティ連動ローン（SLL）が、実際には金利の割引でなく強制的な執行で機能していることを生産・資金調達のモデルで示し、改良した設計を提案した（抄録）。", "p3": "持続可能性への投資が消費者の支払意思額を高めるが、信用リスクのプレミアムの下で資金を調達しなければならない生産・資金調達のモデルを作り、標準的なSLL、政府の補助金、改良したSLLを比べた（抄録）。", "p5": "標準的なSLLでは銀行が罰則金利に裏づけられた野心的な目標を設定して借り手の余剰をすべて持続可能性へ向けるため、金利は下がらず融資額が増える。普通の融資で利益が残るなら企業は参加せず、競争の下で持続可能性の利点は崩れる。補助金は参加を回復するが較正のリスクがある（抄録）。", "fun": "環境目標を達成すると金利が安くなるローンなのに、実際には金利は下がっていなかった。この研究によると、このローンは「ご褒美」ではなく、目標を守らなければ高い金利を払わされる「罰」で動いている。だから普通のローンを選べる会社は参加しない。名前と中身が違う金融商品の正体を理論で暴いた点が面白い。", "unverified": "出版社の本文は入手できず、改良したSLLの具体的な設計と数値例は確認できなかった。"}}, {"id": "jn26", "rank": 26, "field": "オペレーションズ・リサーチ", "headline": "表示の設計がプラットフォームの価格均衡を決める", "title": "Price Competition Under Platform-Mediated Search: A Consider-Then-Choose Framework", "url": "https://doi.org/10.1287/msom.2024.1285", "authors": "Chamsi Hssaine ほか", "venue": "Manufacturing & Service Operations Management", "date": "2026-11-19", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "apa": "Hssaine, C., Kamble, V., & Banerjee, S. (2026). Price Competition Under Platform-Mediated Search: A Consider-Then-Choose Framework. Manufacturing & Service Operations Management. https://doi.org/10.1287/msom.2024.1285", "why": "価格・評価・配送速度など複数の属性で競う売り手の価格均衡を、表示順位・絞り込み・バッジといったプラットフォームの設計が消費者の検討と選択を通じてどう決めるかを、検討してから選ぶ枠組みで予測する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "価格・評価・配送速度など複数の属性で競う売り手の価格均衡を、プラットフォームの表示の設計を織り込んで予測する、検討してから辞書式に選ぶ（CLC）枠組みを作った（抄録）。", "p3": "プラットフォームを介した探索に合わせた行動モデル（Consider-then-Choose with Lexicographic Choice）で、局所ナッシュ均衡が逐次手番で特徴づけられることを示し、勾配優越という解釈しやすい十分条件の下で計算の手順を与えた（抄録）。", "p5": "勾配優越の下では単純な分散型の勾配アルゴリズムが均衡に収束し、プラットフォームが市場の結果を模擬できることを証明した。この枠組みで、表示の設計が市場の結果に与える影響を調べた（抄録）。", "fun": "通販サイトで、私たちはまず目に入った数件だけを検討し、その中から一番大事な条件で選ぶことが多い。サイトの並べ方や絞り込みの仕組みがどの商品を検討の候補に入れるかを決め、それが売り手の値付けまで変える。画面の作り方が市場の値段を決めるという視点が面白い。", "unverified": "出版社の本文は入手できず、設計が市場に与える影響の具体的な結果は確認できなかった。"}}, {"id": "jn27", "rank": 27, "field": "オペレーションズ・リサーチ", "headline": "生産速度と保全を劣化状態に応じて決める", "title": "Production Rate Control in Condition-Based Maintenance Planning", "url": "https://doi.org/10.1287/msom.2023.0314", "authors": "Luuk Pentinga ほか", "venue": "Manufacturing & Service Operations Management", "date": "2026-11-19", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "apa": "Pentinga, L., Kilic, O. A., Veldman, J., & Teunter, R. (2026). Production Rate Control in Condition-Based Maintenance Planning. Manufacturing & Service Operations Management. https://doi.org/10.1287/msom.2023.0314", "why": "生産速度が収益と劣化の両方に影響する設備について、劣化状態に応じた状態基準保全と生産制御の統合方策を分析し、生産と保全の決定を協調させる方策を示す。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "生産速度が収益と劣化の両方に影響する設備について、劣化状態に応じた状態基準保全と生産制御を統合した方策を分析し、その最適な構造を示した（抄録）。", "p3": "劣化過程・保全費用・収益とそれらの劣化水準と生産速度への依存について一般的な仮定を置き、再生報酬の構造を使って、より簡単なパラメトリックな最適化問題の列を解くことで利益最大の方策を計算する方法を作った（抄録）。", "p5": "生産速度を制御できても管理限界型の方策が最適で、保全費用が劣化状態に区分的に一定なら複数のしきい値を持ちうる。最適な生産速度の上下限と、それが劣化状態に単調になる条件を導き、数値実験で統合した方策が生産速度を固定した方策を大きく上回ることを示した（抄録）。", "fun": "機械を速く動かせばたくさん作れるが、そのぶん早く傷む。傷んできたら少しゆっくり動かして長持ちさせるのか、いったん止めて修理するのか。この研究は、作る速さと直す時期を一緒に決めると、速さを固定するよりずっと得になることを示した。体調に合わせて走る速さを変えるマラソンのような発想が面白い。", "unverified": "出版社の本文は入手できず、数値実験での改善の大きさの数値は確認できなかった。"}}, {"id": "jn28", "rank": 28, "field": "組織行動・心理的安全性", "headline": "同僚の自己犠牲を見ると仕事後の回復が進む", "title": "When sacrifice inspires recovery: Moral elevation as a pathway from observing coworkers' self‐sacrifice to recovery experiences", "url": "https://doi.org/10.1111/apps.70154", "authors": "Lynn Luck Aung ほか", "venue": "Applied Psychology", "date": "2026-11-19", "sjr": 2.354, "citescore": 11.4, "citescore_year": "2025", "apa": "Aung, L. L., Lynch, W. H., & Yun, M. (2026). When sacrifice inspires recovery: Moral elevation as a pathway from observing coworkers’ self‐sacrifice to recovery experiences. Applied Psychology, 75(6). https://doi.org/10.1111/apps.70154", "why": "建設労働者の3波の経験サンプリングで、同僚の自己犠牲的な行動を見ると道徳的高揚（高まる感情・人間観・より良くなりたい欲求）が生じ、それぞれがリラックスや心理的離脱など仕事外の時間の回復経験を別々に促すことを示す。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "同僚の自己犠牲的な行動を見ることが、道徳的高揚を通じて従業員の仕事外の時間の回復経験を促すことを、建設労働者の経験サンプリングで示した（抄録）。", "p3": "社会直観モデルに基づき、建設労働者154人の3波の経験サンプリング（1,529日分の観測）で、同僚の自己犠牲の観察、道徳的高揚の3成分、回復経験（リラックス・心理的離脱・熟達・余暇の統制）と、チームの業務量の調整効果を調べた（抄録）。", "p5": "同僚の自己犠牲の観察は、高まる感情・人間観・より良い人になりたい欲求の3成分を予測した。高まる感情はリラックスを、人間観は心理的離脱を、欲求は熟達の経験を予測したが、余暇の統制は予測しなかった。チームの業務量は高まる感情と欲求への効果を強めた（抄録）。", "fun": "忙しい現場で、同僚が自分を犠牲にして誰かを助ける姿を見ると、心が温かくなる。この研究は、その温かさが仕事の後のくつろぎや、仕事を忘れる時間、新しいことへの挑戦にまでつながることを示した。人の善い行いを見るだけで、見た人の休み方まで良くなるという点が面白い。", "unverified": "出版社の本文は入手できず、効果の大きさの数値は確認できなかった。"}}, {"id": "jn29", "rank": 29, "field": "組織行動・心理的安全性", "headline": "従業員と上司の活力は消耗と献身に複雑に効く", "title": "When extra isn’t extra good: unravelling the complex impact of employee and leader vigour on emotional exhaustion and organisational commitment", "url": "https://doi.org/10.1080/02678373.2026.2765832", "authors": "Pay Yee Shee ほか", "venue": "Work & Stress", "date": "2026-11-19", "sjr": 2.762, "citescore": 15.1, "citescore_year": "2025", "apa": "Shee, P. Y., de Jonge, J., & Idris, M. A. (2026). When extra isn’t extra good: unravelling the complex impact of employee and leader vigour on emotional exhaustion and organisational commitment. Work & Stress, 1–20. https://doi.org/10.1080/02678373.2026.2765832", "why": "題名によれば、従業員と上司の活力が情緒的消耗と組織コミットメントに与える影響は単純でなく、活力が多ければ良いとは限らないことを扱う研究である（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、従業員と上司の活力（vigour）が情緒的消耗と組織コミットメントに与える影響は単純ではなく、多ければ多いほど良いとは限らないことを扱う研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、やる気や元気（活力）は多いほど良いのか、というものだ。元気すぎる働き方が、かえって疲れ切ることにつながるかもしれない。さらに部下だけでなく上司の活力も関係するという、職場の元気の「適量」を問う点が面白い。", "unverified": "抄録・本文とも入手できず、対象者・方法・結果は確認できなかった。"}}, {"id": "jn30", "rank": 30, "field": "組織行動・心理的安全性", "headline": "従業員の発言を多方向の処理として捉える", "title": "Beyond speak-up: A multidirectional framework for employee voice issue processing", "url": "https://doi.org/10.1016/j.hrmr.2026.101185", "authors": "DuckJung Shin", "venue": "Human Resource Management Review", "date": "2026-11-19", "sjr": 4.892, "citescore": 32.6, "citescore_year": "2025", "apa": "Shin, D. (2027). Beyond speak-up: A multidirectional framework for employee voice issue processing. Human Resource Management Review, 37(1), 101185. https://doi.org/10.1016/j.hrmr.2026.101185", "why": "題名によれば、従業員の発言（voice）を声を上げる行為だけでなく、組織内で多方向に処理される過程として捉える枠組みを提案する研究である（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、従業員の発言（voice）を「声を上げる」行為だけで捉えず、発言された課題が組織の中で多方向に処理される過程として捉える枠組みを提案する研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、部下が意見を言った後、その意見は組織の中でどう扱われ、誰に届き、どう処理されるのか、というものだ。言うことだけでなく、言われた後の流れに注目する視点が、意見を言いやすい職場づくりを考えるうえで面白い。", "unverified": "抄録・本文とも入手できず、枠組みの内容は確認できなかった。"}}, {"id": "jn31", "rank": 31, "field": "政治学", "headline": "トゥキュディデスは人間本性を限界として描いた", "title": "The Limit of Nature: Thucydides and the Politics of Theory", "url": "https://doi.org/10.1017/s000305542610224x", "authors": "MARK D. FISHER", "venue": "American Political Science Review", "date": "2026-11-19", "sjr": 5.433, "citescore": 11.0, "citescore_year": "2025", "apa": "FISHER, M. D. (2026). The Limit of Nature: Thucydides and the Politics of Theory. American Political Science Review, 1–15. https://doi.org/10.1017/s000305542610224x", "why": "トゥキュディデスを人間本性の普遍的な原理の理論家とする通説に対し、著者の声と登場人物の声を区別して、彼が人間本性を存在の危機の場面に現れる人間の能力の基準線・境界（限界概念）として扱ったと論じる政治理論の研究。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "トゥキュディデスを人間本性の普遍的な原理の理論家とする通説に対し、彼が人間本性を存在の危機の場面で現れる人間の能力の基準線・境界（限界概念）として扱ったと論じた（抄録）。", "p3": "『戦史』の著者自身の声と登場人物の演説の声を区別して読み、本性（physis）という概念と、政治集団の習慣的な振る舞いを表すより細かな語彙の使い分けを分析した（抄録）。", "p5": "トゥキュディデスは論争的な熟議の場面でこそ強く決定論的な本性の概念を前面に出し、公共の議論で本質主義的な理論が生まれる政治的な力学への反省を促しているとする。競争的で分極化した言論が政治の議論の範疇と行動に与える影響を考える参照点になると論じる（抄録）。", "fun": "「人間とはそういうものだ」という言い方は、議論で相手を黙らせる強い道具になる。古代ギリシャの歴史家トゥキュディデスは、人間の本性を何でも説明する原理としてではなく、極限の状況で現れる限界として描き、本性論が争いの中で生まれることも見抜いていたという。古典を現代の分断した議論の鏡として読む点が面白い。", "unverified": "出版社の本文は入手できず、分析した具体的な箇所（演説の場面）は確認できなかった。"}}, {"id": "jn32", "rank": 32, "field": "政治学", "headline": "米国の学問の自由は21世紀に浸食された", "title": "The Erosion of Academic Freedom in the United States in the Early Twenty-First Century: A State- and Movements-Based Analysis", "url": "https://doi.org/10.1017/s1537592726106446", "authors": "Steven Brint", "venue": "Perspectives on Politics", "date": "2026-11-19", "sjr": 2.923, "citescore": 9.4, "citescore_year": "2025", "apa": "Brint, S. (2026). The Erosion of Academic Freedom in the United States in the Early Twenty-First Century: A State- and Movements-Based Analysis. Perspectives on Politics, 1–19. https://doi.org/10.1017/s1537592726106446", "why": "米国の大学教員の学問の自由の保護が21世紀初めに前例のない形で浸食された理由と帰結を、2025年に頂点に達した州と連邦の政策介入から、教員と共和党議員の思想的な距離や運動の組織力に注目して分析する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "米国の大学教員の学問の自由の保護が今世紀の初めに前例のない形で浸食された理由と帰結を、50州と連邦政府の政策介入から分析した（抄録）。", "p3": "2025年に頂点に達した州と連邦の政策介入を取り上げ、大学教員と共和党議員の思想的な距離、左右双方の組織力と連携、民主・共和両党による党派目的での州権力の利用、きっかけとなった出来事を分析した（抄録）。", "p5": "人口の変化、所得格差の拡大、新しいメディアの台頭と、それらの政治的分極化とのつながりという、より深い文脈要因も論じた（抄録）。定量的な結果は抄録にない。", "fun": "大学の先生が自由に研究し教えることは、民主主義の社会を支える基盤の一つだ。この研究は、その自由がアメリカで急に揺らいだ理由を、大学と政治家の考え方の距離や、政党が大学をめぐって州の権力を使ったことなどから説明した。学問の自由も政治の対立から無縁ではないという点が考えさせられる。", "unverified": "出版社の本文は入手できず、取り上げた州ごとの政策の一覧は確認できなかった。"}}, {"id": "jn33", "rank": 33, "field": "政治学", "headline": "中南米の労組の分裂は政府との関係が生む", "title": "The Political Origins of Labor Union Fragmentation in Latin America since the 1990s", "url": "https://doi.org/10.1017/lap.2026.10077", "authors": "Rodrigo M. Medel ほか", "venue": "Latin American Politics and Society", "date": "2026-11-19", "sjr": 1.107, "citescore": 3.0, "citescore_year": "2025", "apa": "Medel, R. M., & Somma, N. M. (2026). The Political Origins of Labor Union Fragmentation in Latin America since the 1990s. Latin American Politics and Society, 1–24. https://doi.org/10.1017/lap.2026.10077", "why": "中南米17か国の1990〜2020年の労組の全国組織の分裂をデータベースで描き、アルゼンチン・ウルグアイ・ボリビア・チリの比較歴史分析で、労組と政府の親和性が他の要因に従属するとき分裂が生じると論じる。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "中南米で労働組合の全国組織が分裂する国と結束を保つ国がある理由を、17か国の1990〜2020年のデータと4か国の比較歴史分析で説明した（抄録）。", "p3": "分裂を全国の連合体の体系の性質として概念化し、独自のMovLabデータベースで17か国の推移を描いたうえで、アルゼンチン・ウルグアイ・ボリビア・チリを比較歴史分析した（抄録）。", "p5": "労組と政府の親和性が与党連合に従属し、意味のある政策参加や自律的な動員を生まないときに分裂が生じる。アルゼンチンとチリでは包括的な取り込みのない政治的な近さが指導部の正統性を損ない、ウルグアイとボリビアは自律性を保って政治的アクセスを実益に変え結束を維持した（抄録）。", "fun": "労働組合が政府と仲良くなれば、働く人の声が政治に届きやすくなりそうだ。ところがこの研究では、政府と近いだけで実際の成果を取れない組合はかえって信頼を失い、内部が分裂していった。権力との距離の近さより、近さを実益に変えられるかが組織の結束を決めるという点が面白い。", "unverified": "出版社の本文は入手できず、データベースの分裂の指標の定義は確認できなかった。"}}, {"id": "jn34", "rank": 34, "field": "政治学", "headline": "承認の否定が行政負担の心理的費用を生む", "title": "“Unseen and unheard”: Recognition and Its Role in Shaping Administrative Burden", "url": "https://doi.org/10.1093/jopart/muag033", "authors": "Noam Tarshish", "venue": "Journal of Public Administration Research and Theory", "date": "2026-11-18", "sjr": 3.301, "citescore": 11.0, "citescore_year": "2025", "apa": "Tarshish, N. (2026). “Unseen and unheard”: Recognition and Its Role in Shaping Administrative Burden. Journal of Public Administration Research and Theory. https://doi.org/10.1093/jopart/muag033", "why": "行政手続の負担のうち心理的費用を承認とその否定という機構から説明する。イスラエルで障害給付を申請する精神疾患のある若者と支援者への聞き取りから、承認の欠如が負担の中心にあると論じる。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "行政手続の負担のうち心理的費用を、承認とその否定という機構から説明し、感情的費用・一次的な象徴費用・二次的な象徴費用の3類型に分けた（抄録）。", "p3": "イスラエルで障害給付を申請する事例の質的研究で、精神疾患と診断された若者16人とソーシャルワーカー・アウトリーチ職員17人の計33人に詳しい面接を行い、Honnethの承認の3領域（権利・連帯・ケア）で分析した（抄録）。", "p5": "承認が問題にならない手続の負担への感情反応（感情的費用）と、地位の位置づけへの反応（一次的な象徴費用）、手続の負担そのものが地位のメッセージを伝える場合（二次的な象徴費用）は原因と対策が異なり、前者は効率化、後の二つは承認を重視する改革を要する。ソーシャルワーカーは費用を打ち消す味方として現れた（抄録）。", "fun": "役所の手続きがつらいのは、書類が多いからだけではない。「あなたは信用されていない」と言われているように感じることが、心を傷つける。この研究は、手続きのつらさを、手間による疲れと、扱われ方が伝える「あなたの立場」へのつらさに分けた。同じ手続きでも、伝わるメッセージで重さが変わる点が面白い。", "unverified": "出版社の本文は入手できず、面接の語りの具体例は確認できなかった。"}}, {"id": "jn35", "rank": 35, "field": "交通・都市計画", "headline": "持続可能な交通行動での価値観を再考", "title": "Reconceptualizing the role of human values in sustainable transport behavior", "url": "https://doi.org/10.1016/j.tra.2026.105368", "authors": "Joanne Sneddon ほか", "venue": "Transportation Research Part A: Policy and Practice", "date": "2026-11-18", "citescore": 12.1, "citescore_year": "2025", "apa": "Sneddon, J., Lake, J., Evers, U., & Lee, J. (2027). Reconceptualizing the role of human values in sustainable transport behavior. Transportation Research Part A: Policy and Practice, 216, 105368. https://doi.org/10.1016/j.tra.2026.105368", "why": "題名によれば、持続可能な交通行動を説明するうえで人間の価値観が果たす役割を再概念化する研究である（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "人が持続可能な交通手段に人間のような価値観を当てはめて見ているか、その当てはめが個人の価値観と手段を選ぶ理由を結びつけるかを、AICモデルの解釈原理から調べた（抄録）。", "p3": "オーストラリアの成人752人の調査で個人の価値観を測り、9か月後に持続可能な交通手段（能動的な移動と公共交通）の知覚として、手段に当てはめる価値観と選択の理由を測った（抄録）。", "p5": "能動的な移動と公共交通に当てはめられた価値観は、上位の価値観の間の理論的なトレードオフを反映し、人間の価値観の構造と一致した。個人の価値観と選んだ手段への価値観の当てはめは対応し、その対応は公共交通より能動的な移動で強かった（抄録）。", "fun": "自転車や徒歩には「自由」、バスや電車には「みんなのため」といった性格を、私たちは知らず知らず感じているのかもしれない。この研究は、人が乗り物に人間のような価値観を重ねて見ていて、自分の価値観に合う乗り物を選んでいることを示した。乗り物選びが自分らしさの表現になっているという点が面白い。", "unverified": "出版社の本文は入手できず、媒介効果の大きさの数値は確認できなかった。"}}, {"id": "jn36", "rank": 36, "field": "交通・都市計画", "headline": "交通のデジタルツインは車中心の計画を強めるか", "title": "Do urban mobility digital twins reinforce car-centric transportation planning?", "url": "https://doi.org/10.1016/j.jtrangeo.2026.104909", "authors": "Mahdi Aghaabbasi", "venue": "Journal of Transport Geography", "date": "2026-11-19", "sjr": 1.688, "citescore": 10.0, "citescore_year": "2025", "apa": "Aghaabbasi, M. (2027). Do urban mobility digital twins reinforce car-centric transportation planning? Journal of Transport Geography, 138, 104909. https://doi.org/10.1016/j.jtrangeo.2026.104909", "why": "題名によれば、都市のモビリティのデジタルツインが自動車中心の交通計画を強化してしまうかを問う研究である（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、都市のモビリティのデジタルツインが、自動車中心の交通計画をかえって強化してしまうかを問う研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、街の交通をコンピュータの中に再現する「デジタルツイン」が、車の流れを測りやすいせいで車中心の計画ばかりを後押ししてしまうのではないか、というものだ。道具は中立とは限らず、何を測れるかが何を大事にするかを決めてしまうという問いが面白い。", "unverified": "抄録・本文とも入手できず、方法と結論は確認できなかった。"}}, {"id": "jn37", "rank": 37, "field": "交通・都市計画", "headline": "シェアサイクルの駅の開設に近隣はどう反応", "title": "An interpretable spatial model of short-run neighborhood responses to bike-station openings and temporary closures", "url": "https://doi.org/10.1016/j.tre.2026.105395", "authors": "Yakup Turgut", "venue": "Transportation Research, Part E: Logistics and Transportation Review", "date": "2026-11-19", "sjr": 2.332, "citescore": 14.0, "citescore_year": "2025", "apa": "Turgut, Y. (2027). An interpretable spatial model of short-run neighborhood responses to bike-station openings and temporary closures. Transportation Research Part E: Logistics and Transportation Review, 218, 105395. https://doi.org/10.1016/j.tre.2026.105395", "why": "題名によれば、自転車シェアの駅の開設や一時閉鎖に対する近隣の短期的な反応を、解釈可能な空間モデルで分析する研究である（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、自転車シェアの駅の開設や一時的な閉鎖に対する近隣の短期的な反応を、解釈可能な空間モデルで分析する研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、近所にシェアサイクルの駅ができたり一時的に閉まったりすると、まわりの利用や人の動きがすぐにどう変わるか、というものだ。開設と閉鎖の両方を「自然の実験」として使えるのが面白い。", "unverified": "抄録・本文とも入手できず、対象都市・データ・結果は確認できなかった。"}}, {"id": "jn38", "rank": 38, "field": "交通・都市計画", "headline": "都市の拡大と周辺の農地の生産性", "title": "Harvesting the Concrete: Urban Expansion and Agricultural Land Productivity", "url": "https://doi.org/10.1016/j.regsciurbeco.2026.104303", "authors": "Hai Hong ほか", "venue": "Regional Science and Urban Economics", "date": "2026-11-19", "sjr": 1.472, "citescore": 6.1, "citescore_year": "2025", "apa": "Hong, H., Shi, Y., Li, Z., & Chen, K. (2026). Harvesting the Concrete: Urban Expansion and Agricultural Land Productivity. Regional Science and Urban Economics, 104303. https://doi.org/10.1016/j.regsciurbeco.2026.104303", "why": "題名によれば、都市の拡大が農地の生産性に与える影響を扱う都市経済学の研究である（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、都市の拡大が周辺の農地の生産性に与える影響を扱う都市経済学の研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、街が広がって農地がコンクリートに変わるとき、残った農地の生産性はどうなるのか、というものだ。良い農地から先に失われるのか、それとも都市の近くの農業がかえって効率化するのか。「コンクリートを収穫する」という題名の皮肉が問いの面白さを表している。", "unverified": "抄録・本文とも入手できず、対象の国・データ・結果は確認できなかった。"}}, {"id": "jn39", "rank": 39, "field": "物理学", "headline": "流路を広げると抵抗が増える超流動の逆説", "title": "Quantum resistance paradox of low-dimensional superfluids", "url": "https://doi.org/10.1038/s41586-026-11294-w", "authors": "Simon Wili ほか", "venue": "Nature", "date": "2026-11-18", "sjr": 19.713, "citescore": 77.7, "citescore_year": "2025", "apa": "Wili, S., Huang, M.-Z., Bonaccorsi, T., Mühlematter, M. U., Talebi, M., Yudkin, Y., Gómez-Salvador, A., Marijanovic, F., Demler, E., & Esslinger, T. (2026). Quantum resistance paradox of low-dimensional superfluids. Nature. https://doi.org/10.1038/s41586-026-11294-w", "why": "欠陥のないユニタリー・フェルミ気体と自在に設計できる輸送の形状で、1次元から2次元への移行で超流動の抵抗が最小になり、そこでは流路を広げると抵抗が増えるという逆説を見つけた。散逸の主な機構が位相すべりから渦へ移ることで説明する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "欠陥のないユニタリー・フェルミ気体と自在に設計できる輸送の形状で、1次元から2次元への移行で超流動の抵抗が最小になり、そこでは流路を広げると抵抗が増えるという逆説を見つけた（抄録）。", "p3": "デジタルに設計できる輸送の形状を使い、固体の実験では乱れや不純物で隠れる幾何学の効果を超流動の散逸から切り分け、流路の幅を変えて散逸の振る舞いを測った（抄録）。", "p5": "細い準1次元の流路の散逸は位相すべりのLAMH理論で表され、幅を変えると活性化因子が何桁にもわたって予測どおり指数的に変化した。広い準2次元の流路は有限サイズの渦モデルの位相すべりと整合し、移行域での散逸の最小は支配的な散逸機構の移り変わりを反映していた（抄録）。", "fun": "ふつうの電線は太いほど電気が流れやすい。ところが極低温の原子の流体で、細い通り道から広い通り道へ少しずつ幅を変えると、ある幅で抵抗が一番小さくなり、それより広げるとかえって抵抗が増えた。細いときと広いときで「流れを邪魔する仕組み」が入れ替わるという、直感に反する発見が面白い。", "unverified": "出版社の本文は入手できず、抵抗の具体的な値と流路の寸法は確認できなかった。"}}, {"id": "jn40", "rank": 40, "field": "地球科学", "headline": "嫦娥4号・6号が月の巨大盆地の歴史を解明", "title": "Postimpact evolution of the South Pole–Aitken basin revealed by Chang’e-4 and Chang’e-6", "url": "https://doi.org/10.1126/sciadv.aeh9798", "authors": "Yuqi Qian ほか", "venue": "Science Advances", "date": "2026-11-18", "sjr": 4.534, "citescore": 19.0, "citescore_year": "2025", "apa": "Qian, Y., Song, W., Head, J., Tian, M., Guo, Z., Hiesinger, H., van der Bogert, C. H., Zhang, L., Chen, J., Zhang, W., Li, Z., Sun, L., Wang, X., Li, W.-R., Liu, J., Dauphas, N., Xu, Y.-G., & Zhao, G. (2026). Postimpact evolution of the South Pole–Aitken basin revealed by Chang’e-4 and Chang’e-6. Science Advances, 12(47). https://doi.org/10.1126/sciadv.aeh9798", "why": "月の南極エイトケン盆地を初めて現地で調べた嫦娥4号・6号の測定と試料から、衝突が約43.4億年前に起き、厚い溶融層が分化してマグネシウムに富むノーライトを作ったことなど、盆地の衝突後の進化を明らかにする。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "嫦娥4号と嫦娥6号の現地測定と嫦娥6号の試料を初めての実地の手がかりとして、月の南極エイトケン（SPA）盆地の衝突後の進化を明らかにした（抄録）。", "p3": "嫦娥4号・6号の現地測定と嫦娥6号の試料に基づき、SPAの衝突の年代、溶融層の分化、マグネシウムに富む物質の起源と運ばれた経路、その後の衝突の出来事を復元した（抄録）。", "p5": "SPAの衝突は約43.4億年前に起き、厚い溶融層が分化して中程度にMgに富むノーライトを作り、Finsenの衝突で嫦娥4号の地点へ運ばれた。高くMgに富む物質は約42億年前のApolloの衝突で掘り出され、Chaffee Sの衝突で嫦娥6号の地点へ運ばれた（抄録）。", "fun": "月の裏側には、太陽系でも最大級の巨大な衝突の跡（南極エイトケン盆地）がある。中国の探査機が初めてそこに降りて石を持ち帰ったことで、約43.4億年前の衝突とその後の出来事の順番が分かってきた。別の衝突が岩を遠くまで運んでくれたおかげで、深い場所の物質が手に入ったという偶然の連鎖が面白い。", "unverified": "出版社の本文は入手できず、年代の決定方法と試料の分析の詳細は確認できなかった。"}}, {"id": "jn41", "rank": 41, "field": "工学", "headline": "回転円柱の流体励起振動で荷重の周波数が倍に", "title": "Aerodynamic Energy Transfer and Load-Frequency-Doubling Mechanisms in the Flow-Induced Vibration of a Rotating Cylinder", "url": "https://doi.org/10.1142/s0219455428501003", "authors": "Zhen Zhang ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-19", "citescore": 6.5, "citescore_year": "2025", "apa": "Zhang, Z., Li, Q., Qin, Z., Pan, S., Liu, K., Yang, W., & Liu, Q. (2026). Aerodynamic Energy Transfer and Load-Frequency-Doubling Mechanisms in the Flow-Induced Vibration of a Rotating Cylinder. International Journal of Structural Stability and Dynamics. https://doi.org/10.1142/s0219455428501003", "why": "マグヌス効果を使う風力発電の要素を念頭に、弾性支持した回転円柱の流体励起振動を双方向の流体-構造連成で解析し、空力エネルギーの伝達と荷重の周波数が倍になる機構を調べる。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "マグヌス効果を使う風力発電の要素を念頭に、弾性支持した回転円柱の流体励起振動を双方向の流体-構造連成で解析し、回転が同期の範囲と空力荷重を大きく変えることを示した（抄録）。", "p3": "オーバーセット格子による双方向の流体-構造連成モデルで、Re = 3900、回転比α = 0・1・2、換算流速1〜10の条件で、応答と空力荷重、位相関係、後流の渦の構造を調べた（抄録）。", "p5": "回転を強めると連成系の同期の特性が変わり、ロックインの範囲が高い換算流速側へ広がり、変動する空力荷重が大きく変化した。空力の加振と構造の運動の位相関係の明確な移行と、それに伴う流体から構造へのエネルギーの伝わり方の違いが見つかり、渦の形成と放出の変化と結びついていた（抄録）。", "fun": "風の中に立つ円柱は、後ろにできる渦にゆすられて振動する。円柱を回転させると、ボールが曲がるのと同じマグヌス効果で、揺れ方や力のかかり方が大きく変わる。回転が渦の出方を変え、揺れと力の「タイミング」をずらすことで、エネルギーの受け渡しの仕方まで変えるという点が面白い。", "unverified": "出版社の本文は入手できず、荷重の周波数が倍になる機構の具体的な説明は確認できなかった。"}}, {"id": "jn42", "rank": 42, "field": "工学", "headline": "O字型ブレースで鋼骨組の剛性と耐力が向上", "title": "Numerical Evaluation and Parametric Assessment of O-Grid Bracing Systems Using Rectangular and Circular Hollow Sections", "url": "https://doi.org/10.3390/infrastructures11110428", "authors": "K. N. Adarsha ほか", "venue": "Infrastructures", "date": "2026-11-18", "citescore": 5.7, "citescore_year": "2025", "apa": "Adarsha, K. N., Chaithra, M., Avinash, A. R., Bhat, P. S. V., & Sasindran, R. (2026). Numerical Evaluation and Parametric Assessment of O-Grid Bracing Systems Using Rectangular and Circular Hollow Sections. Infrastructures, 11(11), 428. https://doi.org/10.3390/infrastructures11110428", "why": "矩形・円形の中空断面のリングを使うO字型の円形ブレースを、既往の試験で検証した繰返し解析で評価し、裸の骨組に比べて初期剛性と最大荷重が高まることを示す。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "矩形・円形の中空断面のリングを使うO字型の円形ブレースを繰返し解析で評価し、鋼の骨組の剛性・耐力・エネルギー吸収を高める効果と、強度・剛性・安定のトレードオフを定量化した（抄録）。", "p3": "既往の試験で検証したABAQUSの繰返し解析で、同じ鋼材量のI形・H形・矩形・円形の断面のリングを比べ、矩形15種と円形6種のリングを媒介変数的に評価した（抄録）。", "p5": "O字型ブレースは裸の骨組の初期剛性を5〜51%、最大荷重を19〜47%、吸収エネルギーを約35〜80%高めた。矩形とI形のリングの差は最大荷重で4%未満、エネルギーで7%で、どちらも面外に座屈した（最大109 mmと223 mm）。矩形の縦横比を1から3にすると剛性は31%上がったが最大荷重は6%しか上がらなかった（抄録）。", "fun": "地震に備えて建物の骨組に補強材（ブレース）を入れるが、この研究ではリング（O字）の形の補強を調べた。リングの断面の形を変えると、硬さ・強さ・壊れにくさの間で、一方を立てると他方が立たない関係が見えてくる。縦長にすると硬くはなるが強さはほとんど増えないという、設計の悩ましさが数字で分かる点が面白い。", "unverified": "出版社の本文は入手できず、既往の試験との一致の程度は確認できなかった。"}}, {"id": "jn43", "rank": 43, "field": "工学", "headline": "圧電パッチの配置が複合材の振動応答を変える", "title": "Influence of PZT patch placement on the modal and harmonic response of laminated composite structures: A finite element and machine learning study", "url": "https://doi.org/10.1142/s0219455428501015", "authors": "Dhruv Bagai ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-19", "citescore": 6.5, "citescore_year": "2025", "apa": "Bagai, D., Sah, S. K., Sharma, N., & Kiran, M. (2026). Influence of PZT patch placement on the modal and harmonic response of laminated composite structures: A finite element and machine learning study. International Journal of Structural Stability and Dynamics. https://doi.org/10.1142/s0219455428501015", "why": "CFRPの正方形板・片持ち梁・両端固定梁で、圧電（PZT）パッチの配置が固有振動と調和応答に与える影響を有限要素法と機械学習で調べ、振動の監視・制御のための配置の指針を示す。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "CFRPの積層構造で、圧電（PZT）パッチの配置が固有振動と調和応答に与える影響を有限要素法で調べ、その結果を使って配置の方針を推薦する機械学習の枠組みを作った（抄録）。", "p3": "正方形板・片持ち梁・両端固定梁の3つの構成で、単一・複数・全面のパッチの配置の場合の固有振動の特性と定常の調和応答を評価し、得られた有限要素のデータセットでランダムフォレストによる推薦の枠組みを作った（抄録）。", "p5": "PZTの配置は、境界条件・加振の周波数範囲・モードの相互作用によって振動を減らすことも増やすこともあった。機械学習の部分は、学習データが限られ偏っているため予備的なものと位置づけている（抄録）。", "fun": "振動を測ったり抑えたりする小さな圧電の板（PZTパッチ）は、どこに貼るかで効き目が大きく変わる。この研究では、貼る場所によっては振動を抑えるどころか強めてしまうこともあると分かった。貼る位置を間違えると逆効果になりうるという点が、ものの「置き場所」の大切さを思わせて面白い。", "unverified": "出版社の本文は入手できず、推薦の枠組みの精度は確認できなかった。"}}, {"id": "jn44", "rank": 44, "field": "工学", "headline": "メッシーナ海峡の吊橋の耐風設計", "title": "Wind design of Messina Strait suspension bridge", "url": "https://doi.org/10.1016/j.istruc.2026.113473", "authors": "Giorgio Diana ほか", "venue": "Structures", "date": "2026-11-18", "sjr": 1.108, "citescore": 7.1, "citescore_year": "2025", "apa": "Diana, G., Mele, V., Devitofranceschi, A., Piccarreta, A., Di Lenardo, F., Di Gialleonardo, E., & Collina, A. (2026). Wind design of Messina Strait suspension bridge. Structures, 94, 113473. https://doi.org/10.1016/j.istruc.2026.113473", "why": "題名によれば、メッシーナ海峡の吊橋の耐風設計を扱う研究である（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、メッシーナ海峡の吊橋の耐風設計を扱う研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、海峡をまたぐ非常に長い吊橋を、風による揺れや不安定な振動から守るにはどう設計するか、というものだ。長い橋ほど風に揺らされやすく、旗がはためくような振動を防ぐ工夫が要るという問いが面白い。", "unverified": "抄録・本文とも入手できず、設計の条件と検討の内容は確認できなかった。"}}, {"id": "jn45", "rank": 45, "field": "工学", "headline": "免震で全ガラス構造の加速度を実大試験で低減", "title": "Acceleration mitigation for seismic resilient all-glass structure through base-isolation: Full-scale shaking table test", "url": "https://doi.org/10.1016/j.engstruct.2026.124170", "authors": "Bing Zhao ほか", "venue": "Engineering Structures", "date": "2026-11-19", "citescore": 12.0, "citescore_year": "2025", "apa": "Zhao, B., Zhang, Z., Du, L., Zhang, H., Xiang, P., & Jia, L.-J. (2027). Acceleration mitigation for seismic resilient all-glass structure through base-isolation: Full-scale shaking table test. Engineering Structures, 372, 124170. https://doi.org/10.1016/j.engstruct.2026.124170", "why": "題名によれば、地震に強い全ガラス構造の加速度を免震で抑える効果を実大の振動台試験で確かめる研究である（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、地震に強い全ガラスの構造物の加速度を免震で抑える効果を、実大の振動台試験で確かめた研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、割れやすいガラスだけでできた建物を、地面からの揺れを伝えにくくする「免震」で守れるか、というものだ。本物の大きさの試験体を実際に揺らして確かめるという点が面白い。", "unverified": "抄録・本文とも入手できず、試験の条件と結果は確認できなかった。"}}, {"id": "jn46", "rank": 46, "field": "工学", "headline": "生成モデルの相でマルチスケール位相最適化", "title": "Neural concurrent multiscale topology optimization with property-conditioned generative metamaterial phases", "url": "https://doi.org/10.1016/j.compstruc.2026.108543", "authors": "Kaiyun Sun ほか", "venue": "Computers & Structures", "date": "2026-11-19", "sjr": 1.243, "citescore": 7.5, "citescore_year": "2025", "apa": "Sun, K., Huang, Y., Yang, Y., & Qian, W. (2027). Neural concurrent multiscale topology optimization with property-conditioned generative metamaterial phases. Computers & Structures, 334, 108543. https://doi.org/10.1016/j.compstruc.2026.108543", "why": "題名によれば、目標の性質を条件にメタマテリアルの相を生成するモデルを組み込んだ、ニューラルネットによる同時マルチスケール位相最適化の研究である（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、目標の性質を条件にしてメタマテリアルの相を生成するモデルを組み込んだ、ニューラルネットによる同時マルチスケールの位相最適化の研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、部品の大きな形と、その中の細かい網目の構造の両方を、AIを使って同時に最適に設計できるか、というものだ。欲しい性質を伝えると細かい構造をAIが描いてくれるという、設計の未来像が面白い。", "unverified": "抄録・本文とも入手できず、手法と結果は確認できなかった。"}}, {"id": "jn47", "rank": 47, "field": "機械学習", "headline": "物理的な前向きモデルを学習して分光撮像", "title": "Real-World Spectral Compressive Imaging by Learning a Physics-Informed Forward Model", "url": "https://doi.org/10.1109/tpami.2026.3754492", "authors": "Xin Wang ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-11-18", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "apa": "Wang, X., Wang, L., Ma, X., Wang, Y., Kong, L., Song, W., & Huang, H. (2026). Real-World Spectral Compressive Imaging by Learning a Physics-Informed Forward Model. IEEE Transactions on Pattern Analysis and Machine Intelligence, 1–18. https://doi.org/10.1109/tpami.2026.3754492", "why": "題名によれば、物理情報を入れた前向きモデルを学習して実世界の分光圧縮撮像を行う研究である（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、物理情報を入れた前向きモデルを学習することで、実世界の分光圧縮撮像（少ない測定から色の成分の画像を復元する撮影）を行う研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、カメラの中で光がどう変換されるかの物理を学習させれば、少ない測定から多くの色の情報を持つ画像を正しく復元できるか、というものだ。実験室の理想と現実のカメラのずれを学習で埋めようとする点が面白い。", "unverified": "抄録・本文とも入手できず、手法と性能は確認できなかった。"}}, {"id": "jn48", "rank": 48, "field": "機械学習", "headline": "データとモデルの協調で赤外線認識へ転移", "title": "Bridging the Thermal Gap: Data-Model Collaborative Transfer for Infrared Perception", "url": "https://doi.org/10.1109/tpami.2026.3754462", "authors": "Zhu Liu ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-11-18", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "apa": "Liu, Z., Zhao, Q., Fang, Z., Zhang, B., Liu, J., & Liu, R. (2026). Bridging the Thermal Gap: Data-Model Collaborative Transfer for Infrared Perception. IEEE Transactions on Pattern Analysis and Machine Intelligence, 1–17. https://doi.org/10.1109/tpami.2026.3754462", "why": "題名によれば、可視と赤外線の間の差をデータとモデルの協調的な転移で埋めて赤外線での認識を行う研究である（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、可視光と赤外線の間の差（熱のギャップ）を、データとモデルの協調的な転移で埋め、赤外線での認識を行う研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、昼間の普通の写真で学んだAIの知識を、暗闇でも物の熱を写す赤外線カメラの画像にどう移すか、というものだ。見え方がまったく違う2つの世界をつなぐという問いが面白い。", "unverified": "抄録・本文とも入手できず、手法と性能は確認できなかった。"}}, {"id": "jn49", "rank": 49, "field": "機械学習", "headline": "関係知識で欠損のある多視点データを分類", "title": "Knowledge-enhanced Incomplete Multi-view Clustering on Relational Knowledge", "url": "https://doi.org/10.1109/tpami.2026.3754812", "authors": "Ke Liang ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-11-18", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "apa": "Liang, K., Zhang, M., Li, H., Wan, X., Liang, W., Liu, T., Li, M., & Liu, X. (2026). Knowledge-enhanced Incomplete Multi-view Clustering on Relational Knowledge. IEEE Transactions on Pattern Analysis and Machine Intelligence, 1–15. https://doi.org/10.1109/tpami.2026.3754812", "why": "題名によれば、関係に関する知識を使って、一部の視点が欠けた多視点データをクラスタリングする研究である（抄録なし）。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、関係についての知識を使って、一部の視点のデータが欠けた多視点データをクラスタリングする研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、同じものを複数の角度から測ったデータの一部が抜け落ちていても、物どうしの関係の知識で補ってグループ分けできるか、というものだ。欠けた情報を周りの手がかりで補う推理のような問いが面白い。", "unverified": "抄録・本文とも入手できず、手法と性能は確認できなかった。
