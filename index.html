<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-11-07", "intro": "プレプリントの新着847件（関連候補265件）、学術誌の新着（上位10%誌1,441件、その他の学術誌253件）、重要論文の候補186件（プレプリント133件・学術誌53件）、新着オープンデータ94件から選びました。プレプリント・関連46報、プレプリント・注目43報、論文誌・関連50報、論文誌・注目35報、オープンデータ28件です（質と重要性の基準を満たす候補が少なかった部は件数を減らし、論文誌・注目は上位10%誌の新着で補いました）。上位10%誌の一覧は取得できず（HTTP 404）、2026-09-27に作った一覧を使いました。e-Statの新着統計表は今回の候補に含まれていません。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "LLMで調査回答を模擬した55研究を体系的に整理", "title": "LLM-Based Simulations of Survey Responses: A Systematic Literature Review and Synthesis of Methods", "url": "https://doi.org/10.31235/osf.io/fy4az", "authors": "Hao Ting Chan ほか", "venue": "SocArXiv", "date": "2026-11-06", "apa": "Chan, H. T., Assenmacher, D., Stier, S., & Wagner, C. (2026). LLM-Based Simulations of Survey Responses: A Systematic Literature Review and Synthesis of Methods. https://doi.org/10.31235/osf.io/fy4az", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "SocArXivのPDF本文（序論、検索と選別、結果4.1〜4.8、考察と図1〜11のキャプション）を読んだ", "preprint": true, "p1": "2022〜2025年にLLMで調査回答を生成・予測・補完した55研究を体系的に整理し、LLMによる調査の模擬は人の回答者の一般的な代替ではなく、用途と条件に依存する道具だと結論した（抄録、§4.8）。", "p2": "合成回答者の研究は、調査データ・対象集団・条件づけ（ペルソナの作り方）・評価基準がばらばらで、肯定的な結果と否定的な結果が並び、どこまで比べられるのかが分からなかった（序論）。", "p3": "Web of ScienceとSemantic Scholarを検索し、重複を除いた5,478件から、2人の独立した選別（κ=0.85）と全文評価を経て55研究を選び、データ、集団、項目、モデル、条件づけ、評価指標、著者の結論を符号化した（方法、図1）。背景：条件づけとは、年齢や意見などの回答者情報をプロンプトに与えて回答を特定の人に寄せること。", "p4": "個人単位の一致、分布の一致、変数間の関係の一致（relational alignment）のどれを評価したか、どの指標を使ったか、学習データへの混入（漏洩）に対処したかを整理し、著者自身の結論を有効・条件付き有効・無効に分類した（§4.7–4.8、図8–10）。", "p5": "55研究のうち有効の結論は8、無効は13、条件付きは34だった（§4.8、図10）。評価指標は40種類にのぼり、20研究は1指標のみ、変数間の関係を評価したのは7研究、漏洩に触れないものは40研究（73%）だった（§4.7、図3）。厳しい評価をした研究ほど否定的な結論になりやすかった（図11）。", "p6": "結論の分類は著者の自己申告に基づき、設計と結論の交差表は記述的で因果を示さないと著者は述べる（§4.8）。米国を対象とする研究が28と集団が偏る（図4）。解釈：最終標本は査読済み論文が中心で、急増する最新のプレプリントの結果は反映が限られる。", "fun": "AIに「地方に住む60代の女性」のような人物を演じさせてアンケートに答えさせれば、安く速く調査ができそうです。55本の研究をまとめたこの論文によると、AIは平均的な答えはそれらしく出せても、人ごとの答えのばらつきや少数派の意見はうまく再現できないことが多いと分かりました。平均が合うことと社会を写せることは別だという点が面白いところです。", "unverified": "個々の研究の効果量の統合（メタ分析）は行われておらず、モデルの規模ごとの差の定量値は未確認。"}}, {"id": "pr02", "rank": 2, "headline": "移動荷重による地盤の波動を領域別の離散化で解く", "title": "A Projection-Coupled 2.5D THB-GIFT and Quadtree-SBIGA Formulation for Moving-Load Analysis in Semi-Infinite Media", "url": "https://arxiv.org/abs/2611.07872", "authors": "Hao Hong ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Hong, H., Zhong, Y., Zhang, B., Xu, S., Tan, M., Zang, Q., Rappel, H., & Bordas, S. P. A. (2026). A Projection-Coupled 2.5D THB-GIFT and Quadtree-SBIGA Formulation for Moving-Load Analysis in Semi-Infinite Media (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07872", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、移動荷重の定式化§4.3、検証§5の図表キャプション、結論§6）を読んだ", "preprint": true, "p1": "走行方向に一様な半無限の地盤で、移動荷重による波動の広がりと局所の構造の細かさを、近傍（THB-GIFT）と周囲（四分木SBIGA）で別々に離散化し、仕事の整合した形で結合する2.5次元の解析法を示した（抄録、§6）。", "p2": "移動荷重は遠くまで広がる波動場と、荷重の直下や埋設物の近くの急な応力勾配を同時に生むが、領域ごとに異なる近似を自由に組み合わせて結合する方法が不十分だった（§1）。", "p3": "走行方向のフーリエ変換で3次元問題を断面の2.5次元問題に変え、近傍は幾何と解析空間を分けた階層的B-スプライン（THB-GIFT）、周囲は四分木のスケールド境界等幾何解析と外部インピーダンスで表し、共通の積分分割上のL²射影とエルミート随伴の力の受け渡しで非適合な境界をつなぐ（§2–4、図8）。具体例：車輪の接地圧をガウス形や長方形で与え、速度cでは周波数fと波数k=2πf/cが結びつく（式67–70）。", "p4": "均質な半空間の半解析解と円筒空洞の解析解で構成要素と結合系を検証し、誤差・未知数・要素数・計算時間を単一領域のモデルと比べ、舗装と埋設管、2本のトンネルの例題に適用した（§5）。", "p5": "円筒空洞の例で、階層的な細分により目標の内側帯の変位誤差が約41分の1になった（抄録）。外側境界をそろえた比較では、結合モデルの全領域誤差は2.96×10⁻⁶（単一領域3.48×10⁻⁶）、未知数は8,436（同12,864）、S要素は380（同728）だった（§6）。", "p6": "結合モデルは行列の非ゼロ要素が多く、全体の実行時間は337.3秒と単一領域の288.8秒より長かった（§6）。円筒空洞での結合系の検証は、指定した1つの周波数・波数で行われた（§6）。解釈：走行方向に一様な線形の問題に限られ、車両の振動と構造の相互作用は扱っていない。", "fun": "車が道路を走ると、その重みで地面に波が生まれ、遠くまで伝わります。一方で、道路のすぐ下に埋まった管やトンネルのまわりでは、力のかかり方が細かく変わります。この研究は、近くは細かく、遠くは粗くと、場所ごとに別々の計算の網目を使い、境目をきちんとつなぐ方法を作りました。違う物差しで測った結果を一つの答えにまとめる工夫が面白いところです。", "unverified": "実測データとの比較の有無と、車両の動特性を含む連成への拡張は確認していない。"}}, {"id": "pr03", "rank": 3, "headline": "路面振動の加振台での再現度を加速度で判定する", "title": "Sensor-Based Operator Decision Support for Iterative Replication of Motorcycle Road-Vibration Signals on a Dual-Actuator Electrohydraulic Test Rig", "url": "https://doi.org/10.20944/preprints202611.0389.v1", "authors": "Krzysztof Podosek ほか", "venue": "Preprints.org", "date": "2026-11-06", "apa": "Podosek, K., Andrych-Zalewska, M., Wróbel, R., Sitnik, L., & Fedejko-Kaflowska, K. (2026). Sensor-Based Operator Decision Support for Iterative Replication of Motorcycle Road-Vibration Signals on a Dual-Actuator Electrohydraulic Test Rig. https://doi.org/10.20944/preprints202611.0389.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": true, "p1": "実路面で記録したオートバイの前後輪の上下加速度を2チャンネルの電気油圧式の加振台で繰り返し再現するとき、再現の忠実度を加速度で客観的に評価し、続けるか止めるかの判断を支える方法を示した（抄録）。", "p2": "実路の入力を実験室で再現することは、車両の運動や安全に関わる荷重を繰り返し調べるのに必要だが、再現をどこで打ち切るかは操作者の判断に頼ってきた（抄録）。", "p3": "応答の最小値・最大値の百分率誤差、最良の結果の保持、時間・周波数領域での信号の忠実度の評価、次の試行の機械学習による予測を組み合わせた（抄録）。背景：コヒーレンスは2つの信号が周波数ごとにどれだけ線形に対応するかを0〜1で表す指標。", "p4": "さまざまな路面で記録した前後軸の上下加速度を目標とし、保持した応答の遅れを補正した相関と帯域内のコヒーレンス、極値の基準とRMS誤差の比較、ランダムフォレストと持続予測（前回と同じとみなす予測）の比較で評価した（抄録）。", "p5": "保持した応答は遅れ補正後の相関と帯域内のコヒーレンスが高く、極値に基づく基準はRMS誤差では一貫して見えない局所的な劣化を検出した。ランダムフォレストは持続予測より予測誤差が小さかった（抄録）。具体的な数値は抄録に記載がない。", "p6": "独立した試行系列の数が少なく、自動での停止の根拠にはならないと著者は述べ、繰り返しのセッションでの検証が必要とした（抄録）。解釈：予備的な検証であり、加振台の応答と実走行の応答の差の評価は抄録からは分からない。", "fun": "バイクの乗り心地や部品の丈夫さを確かめるには、実際の道路のガタガタを実験室の装置でそっくり再現する必要があります。でも「どこまで似れば十分か」は、これまで人の勘に頼っていました。この研究は、揺れの山と谷の大きさのずれを見ると、平均的なずれでは見逃す細かな違いまで分かることを示しました。勘を数字に置き換える工夫が面白いところです。", "unverified": "相関・コヒーレンス・予測誤差の具体的な数値と、試行の回数は抄録では未確認。"}}, {"id": "pr04", "rank": 4, "headline": "職場でAIを使う人は同僚からの評価と信頼を失う", "title": "Workplace Relationships and Artificial Intelligence", "url": "https://doi.org/10.31234/osf.io/ehbjv", "authors": "Maxine Parker ほか", "venue": "PsyArXiv", "date": "2026-11-06", "apa": "Parker, M., Huang, C., & Krastev, S. (2026). Workplace Relationships and Artificial Intelligence. https://doi.org/10.31234/osf.io/ehbjv", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "PsyArXivのPDF本文（序論、理論的基礎、信頼と真正性、限界と今後の課題の節）を読んだ", "preprint": true, "p1": "職場での生成AIの利用が同僚・上司・組織との関係をどう変えるかを、帰属理論や組織的信頼の統合モデルなど、人と人の相互作用の既存理論で説明できることを示したレビューである（抄録、序論）。", "p2": "AIは同僚の間や上司と部下の間のやりとりに入り込んでいるが、ある人のAI利用が周りの人の見方・判断・行動をどう変えるかは整理されていなかった（序論）。", "p3": "帰属理論（根本的な帰属の誤り、自己奉仕バイアス）、コンピュータを社会的行為者とみなす枠組み、信頼の統合モデル、社会的交換理論、資源理論を軸に、近年の実証研究を知覚・判断・行動・関係のwell-beingの面から統合した（理論的基礎の節）。背景：根本的な帰属の誤りとは、他人の行動を状況より性格のせいにしがちな傾向。", "p4": "体系的な検索手順や採択基準は示されておらず、物語的なレビューとして、多時点の従業員調査、場面想定の実験、野外実験、誘因つきの行動ゲーム、大規模なアーカイブ分析の知見を理論ごとに対応づけた（限界の節）。", "p5": "観察者はAI利用を状況でなく性格の表れと読み、AI利用者を有能さ・意欲・温かさ・真正性が低いと判断し、開示しても信頼は回復しなかった。信頼の低下は能力ではなく善意と誠実さの評価で起き、同僚は返報・知識共有・向社会的行動を減らした。一方、AIが孤独を和らげたり支援的な関係を補ったりする条件もあった（序論、信頼の節）。", "p6": "著者は、中国・韓国・台湾の多時点の自己報告調査と場面想定の実験に偏り、AI利用の測り方が不統一で、学生の標本の研究もあり、ロボット・チャットボット・生成AIが区別されず、縦断・介入・チーム単位の研究が少ないことを限界に挙げる（限界の節）。解釈：対象研究の選び方が明示されていないため、結果の偏りの程度は判断しにくい。", "fun": "職場でAIに文章を書いてもらうと、自分では仕事がはかどったと感じます。ところが周りの同僚は、その人を「手を抜いている」「本気ではない」と見がちで、AIを使ったと正直に打ち明けても信頼は戻らないという研究が多いそうです。道具の問題ではなく、人が他人の行動の理由をどう推し量るかという昔からの心の癖が表れている点が面白いところです。", "unverified": "レビューの文献検索の手順と対象研究の数は本文に記載がなく未確認。"}}, {"id": "pr05", "rank": 5, "headline": "江戸期大坂では橋に近い貸家ほど賃料と利回りが高い", "title": "Bridges and Profits: A Historical Urban Economics of Tokugawa Japan", "url": "https://doi.org/10.21203/rs.3.rs-6021771/v1", "authors": "Masaki Nakabayashi ほか", "venue": "Research Square (In Review)", "date": "2026-11-06", "apa": "Nakabayashi, M., & Mandai, Y. (2026). Bridges and Profits: A Historical Urban Economics of Tokugawa Japan. https://doi.org/10.21203/rs.3.rs-6021771/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": true, "p1": "江戸時代の大坂で、最大の地主だった三井の一次史料から貸家の収益を分析し、橋に近い物件ほど賃料と賃貸の利益率が高いことを示した（抄録）。", "p2": "欧州と日本の大都市の多くは古代から近世に計画・建設され、人の活動が都市の評価を決め、その評価が次の投資を呼ぶという循環で現在の都市ができたが、その仕組みを客観的な尺度で示した研究は限られる（抄録）。", "p3": "人の基本的な活動である歩行に注目し、歩行者の流れの結節点である橋からの距離と、都市の繁栄の客観的な尺度としての不動産の賃貸の利益率との関係を、三井の一次文書のアーカイブ調査で分析した（抄録）。背景：都市経済学では、交通の結節点への近さが地代に反映されると考えられている。", "p4": "評価の対象は物件ごとの賃料と賃貸の利益率で、橋への近さと歩行者の流れへの露出との関係を調べた（抄録）。標本の大きさ、期間、統計手法は抄録に記載がない。", "p5": "橋に近い物件ほど賃料と利益率が高く、橋の周りで歩行者の流れに多くさらされる物件ほど利益率が高かった。著者は、それがその物件への投資を促し、歩行者の流れをさらに増やしたと推測している（抄録）。", "p6": "抄録の範囲では、橋に近い物件の他の特徴による交絡への対処や因果の向きの識別は確かめられず、投資を促したという主張は推測の表現にとどまる（抄録）。解釈：一つの地主の記録に基づくため、大坂全体への一般化には注意が要る。", "fun": "江戸時代の大坂で大きな商家だった三井が残した記録を調べると、橋のたもとに近い貸家ほど家賃が高く、もうけも大きかったことが分かりました。橋は多くの人が行き交う場所なので、人通りが家や店の価値を高めていたのです。人の流れが街の値打ちをつくり、その値打ちがさらに人を呼ぶという循環を、昔の帳簿から読み解いた点が面白いところです。", "unverified": "分析した物件の数・期間と、効果の大きさの数値は抄録では未確認。"}}, {"id": "pr06", "rank": 6, "headline": "境界の観測だけで粒状流の内部の場を生成モデルで復元", "title": "Physics-informed latent conditional flow matching for generative modeling of granular flows on inclined planes", "url": "https://arxiv.org/abs/2611.07458", "authors": "Ziqi Han ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Han, Z., Shi, K., Li, X., Man, T., & Lu, Y. (2026). Physics-informed latent conditional flow matching for generative modeling of granular flows on inclined planes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07458", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（問題設定§2、手法§3、データ§4.1、結果§5.2、比較§6.1、限界§6.4、結論§7）を読んだ", "preprint": true, "p1": "斜面を流れ下る粒状流で、側面や底面のわずかな観測（全体の約0.3%）から、速度・粒状温度・応力・固体体積率の時空間の全場を、保存則に沿う形で復元する生成モデル（PI-LCFM）を示した（抄録、§7）。", "p2": "粒状流の内部の状態は観測しにくく、まばらで雑音のある境界の観測からは内部が一意に決まらない。高精度のシミュレーションを繰り返さずに、観測と物理に整合する内部場を得る方法が求められていた（§2）。背景：粒状温度は粒子速度のゆらぎの大きさを表す量。", "p3": "変分オートエンコーダで場を低次元の潜在空間に圧縮し、時間方向のフロー・マッチングで潜在の時系列の事前分布を学習する。推論時は再学習なしに、観測との誤差と質量・運動量の保存則の残差で潜在の軌道を誘導する（§3、§3.3）。具体例：側面の窓の中の2つの速度成分だけから、7変数・4断面の全系列を生成する（§5.2）。", "p4": "平均粒径2mm、1回2万〜6万個の球のDEMシミュレーションで作ったデータで、DEMの参照との誤差、保存則の残差、到達距離やエネルギーの傾向を評価し、MLP・U-Net・拡散モデル（DDPM、NCSN）・コマごとの条件付きフロー・マッチングと比べた（§4.1、§6.1）。", "p5": "コマごとの基準に比べ速度成分の平均RMSEを45.2%下げ、500コマの系列の復元を約44倍速くした。6変数の正規化RMSEの平均は3.18%で、傾斜角と粒子数が学習範囲外の事例も復元した。物理の誘導は場の精度をおおむね保ちつつ保存則の残差を減らした（§7）。", "p6": "著者は、学習と評価が斜面から水平面へつながる形状と周期境界のDEMデータに限られ、実験の計測での性能は未確立で、粒状温度を直接には拘束していないことを限界に挙げる（§6.4）。解釈：生成された複数の解のどれが妥当かを実測でどう確かめるかが残る。", "fun": "砂や小石が斜面を流れ下るとき、表面の動きは見えても、中で粒どうしがどうぶつかり合っているかは見えません。この研究は、全体のわずか0.3%ほどの観測から、中の速さや押し合う力まで再現するAIを作りました。計算機の中で粒を一つずつ動かした大量の結果から流れのありそうな姿を学び、物理の法則で道案内する点が面白いところです。", "unverified": "実験の計測への適用は未確認。学習範囲外の事例での誤差の具体的な値は確認しきれていない。"}}, {"id": "pr07", "rank": 7, "headline": "三球衝突で粒子が捕捉・破砕される条件を整理", "title": "Trapping and Fracture of Particles in Three-Sphere Ball-Milling Collisions", "url": "https://arxiv.org/abs/2611.08435", "authors": "Ziyi Cui ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Cui, Z., Zhang, Q., Liu, S., & Lueptow, R. M. (2026). Trapping and Fracture of Particles in Three-Sphere Ball-Milling Collisions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08435", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、計算方法§3、結論§6と図表キャプション）を読んだ", "preprint": true, "p1": "ボールミルの局所を、固定した粉砕球・標的粒子・飛び込む粉砕球の3つの球の衝突で表す最小モデルを作り、標的粒子が捕捉されるかを閉じた形の幾何条件で、破砕するかをDEMと2つの破壊基準で整理した（抄録、§6）。", "p2": "粉砕では投入エネルギーのごく一部しか破砕に使われず、どの衝突が実際に粒子を壊すのかが分かっていなかった。粒子が球の間に挟まれて捕捉されるかという幾何と、捕捉後の破砕の条件も切り分けられていなかった（序論、§6）。", "p3": "衝突速度0.5〜5m/s、衝突角−90〜90°、偏心角0〜90°、粒径比2〜10、摩擦係数0〜1を刻んでLAMMPSで3球の衝突を計算し（ヘルツ接触とクーロン摩擦）、標的粒子の応力によるChristensen基準と接触力によるWeibull基準で破砕を判定した（§3、§5）。具体例：石灰石の標的と半径25mmの鋼球で、摩擦係数は約0.47、反発係数は0.50と仮定した（§3）。", "p4": "評価は、捕捉・はじき出し・非接触の結果の分布、標的粒子の最大圧縮主応力の地図、2つの基準による破砕の境界、粒径比ごとの正面衝突の臨界速度で行った（図4–7）。", "p5": "捕捉は閉じた形の幾何条件に従い、摩擦と衝突の向きで決まった。捕捉の範囲内では臨界速度は正面衝突で最も低く、衝突角が大きくなるほど上がり、範囲外では粒子ははじき出されて結果は速度によらなかった。細かい粒子は捕捉されれば壊れやすいが捕捉されにくく、2つの基準は定性的に似ていた（§6）。", "p6": "著者は3球のモデルが最小モデルであり、実際のミルでの衝突条件の分布との組み合わせや破片の置き換えモデルは今後の課題とする（§6）。石灰石と鋼の反発係数は文献値がなく仮定値である（§3）。解釈：多数の粒子が同時に接する充填層での力の連鎖はこのモデルの外にある。", "fun": "石を粉にするボールミルでは鉄の玉が石にぶつかりますが、使ったエネルギーのほとんどは石を壊さずに失われます。この研究は、玉2つと石1つという最小の組み合わせで、石が玉の間に挟まって割れるのか、はじき飛ばされるのかを計算しました。真正面からぶつかるのが最も効率よく、摩擦は挟まるかどうかを決めるという整理が明快で面白いところです。", "unverified": "破砕の境界の具体的な臨界速度の値と、実験による検証は確認していない。"}}, {"id": "pr08", "rank": 8, "headline": "高次元の非線形データ同化を担うスコアフィルタの総説", "title": "A Survey of Nonlinear Filtering Methods for Data Assimilation and Recent Advances in Generative AI-Enabled Score Filters", "url": "https://arxiv.org/abs/2611.07160", "authors": "Cath Pham ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Pham, C., & Reynolds, K. (2026). A Survey of Nonlinear Filtering Methods for Data Assimilation and Recent Advances in Generative AI-Enabled Score Filters (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07160", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（EnSFの節§4.2、比較実験§4.3、拡張の一覧の節見出し、表1と図1〜4のキャプション）を読んだ", "preprint": true, "p1": "非線形・高次元のデータ同化のフィルタを、カルマン型・粒子型・BSDE型から、スコア関数でフィルタ分布を表すアンサンブル・スコアフィルタ（EnSF）とその14の拡張まで整理し、EnSFを非ガウス・高次元の最先端と位置づけた総説である（抄録、§4–5）。", "p2": "カルマン型は線形・ガウスの更新を仮定して非線形の観測で偏り、粒子フィルタは高次元で重みが少数に集中して崩れ、カーネル型は次元が増えると密度の近似を保てない（抄録、§3）。背景：データ同化は、モデルと雑音のある部分的な観測を組み合わせて状態の時間発展を推定する方法。", "p3": "EnSFは、フィルタ分布を拡散モデルのスコア関数（対数密度の勾配）で表し、前向きSDEのガウスな遷移から事前分布のスコアを重み付きモンテカルロで閉じた形に書き、逆時間SDEを解いて更新するため、各同化ステップでニューラルネットの学習が要らない（§4.2、式37）。", "p4": "著者らは、非線形の観測をもつLorenz-96モデルで、次元5・10・50のEnKF（20メンバー）、粒子フィルタ（1万粒子）、EnSF（20メンバー）を、最後の50サイクルのRMSEの10回平均で比べ、次元1,000で局所化つきのLETKFと精度と計算時間を比べた（§4.3）。", "p5": "次元50でEnKFのRMSEは11.02、粒子フィルタは約19.56に崩れたが、EnSFは次元5・10・50で約0.23、0.36、0.44を保った（§4.3.1、図1）。次元1,000ではEnSFが観測成分で約0.7、非観測成分で1.3まで下がり、1ステップの計算はLETKFの約1.8秒に対し0.05秒だった（§4.3.2、図4）。", "p6": "次元100万での5秒対300秒の比較は元のEnSF論文の結果の再掲で、拡張の能力の比較表は各論文が実験で示した範囲だけで採点している（§4.3.2、表1）。解釈：著者らの実験は合成のLorenz-96が中心で、実データでの手法間の比較は限られる。", "fun": "天気予報では、計算による予報と実際の観測をうまく混ぜて「今の大気の状態」を推定し直す作業を繰り返します。変数がとても多いと、昔ながらの方法は計算が破綻したり答えが偏ったりします。この総説は、画像を作るAIと同じ数学（スコア関数）を使うと、変数が多くても少ない計算で正確に推定できることを紹介しています。画像生成と天気予報が同じ道具でつながる点が面白いところです。", "unverified": "14の拡張それぞれの実験条件と性能は個別に確認していない。"}}, {"id": "pr09", "rank": 9, "headline": "取引主体の行動を記憶して不正取引の検知を改善", "title": "PersonaAgent: Retrieval-Augmented Transaction Anomaly Scoring with Refreshable Multi-Entity Persona Memory", "url": "https://arxiv.org/abs/2611.08094", "authors": "Zhengyu Fang ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Fang, Z., Wang, L., Dou, Y., Chen, Y., Jain, S., Wang, J., Fan, X., Pan, M., Sun, J., Zheng, Y., & Cai, Y. (2026). PersonaAgent: Retrieval-Augmented Transaction Anomaly Scoring with Refreshable Multi-Entity Persona Memory (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08094", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、手法§4、評価§5、考察§6と図表キャプション）を読んだ", "preprint": true, "p1": "決済ネットワークの取引の異常検知で、カードや加盟店などの主体の最新の行動を「ペルソナ」として週次に更新する記憶に保存し、既存の検知モデルを凍結したまま軽い付加器（アダプタ）で得点を補う枠組みPersonaAgentを示した（抄録、§4）。", "p2": "主体間の取引のパターンは検知モデルの更新周期より速く変わり、主体ごとの埋め込みは種類が多く疎で扱いにくい（序論、図1）。", "p3": "設計時だけLLMの提案役と批評役がペルソナの作り方（プロトコル）を改良し、事前に決めた規則で凍結する。週次のバッチで5つの視点の数値記録を作り、採点時は完全一致の検索と予備の規則で記録を引き、凍結した基礎得点と木ベースのアダプタで最終得点を出す。採点時にはLLMを使わない（§4、図2）。", "p4": "Visaの4つの検知モデル（本番1つと内部3つ）で、保留したオフライン試験（期間1）と、結果判明前に本番で記録した得点（期間2）について、基礎得点に対する相対改善を3指標とペアのブートストラップ区間で評価した（§5.1–5.2、表3）。", "p5": "24の検知モデル・期間・指標の組すべてで改善し、95%区間はすべて0を上回った（§5.2）。PR-AUCの相対改善は0.65〜6.58%、本番の業務指標は8.93〜14.24%で、1,000取引を1〜2ミリ秒で採点した（抄録、§5.5）。初見の加盟店などの予備規則の場面でもPR-AUCは平均3.30%と3.64%改善した（§5.5）。", "p6": "記録が1週前のものだと改善が小さくなり、更新頻度と費用の比較が残る。場所に由来する信号が機微な属性と相関しうるため、政策的な利用の前に下位集団への影響の評価が必要と著者は述べる（§6）。解釈：非公開のデータとモデルでの結果のため、外部での再現は難しい。", "fun": "クレジットカードの不正を見つけるAIは作り直すのに時間がかかるのに、お店や利用者の行動は毎週のように変わります。この研究は、AI本体はそのままにして、カードやお店の最近の「くせ」を毎週メモに書き直し、それを見ながら得点を少し補正する仕組みを作りました。大きなAIを作り直す代わりにメモを新しくするという発想が面白いところです。", "unverified": "使ったデータの規模と期間、検知モデルの詳細は非公開のため未確認。"}}, {"id": "pr10", "rank": 10, "headline": "LLMエージェント市場で情報開示の効果はモデル次第", "title": "Who Should Know What? Empirical Information Design for Multi-Agent LLM Economies", "url": "https://arxiv.org/abs/2611.07667", "authors": "Mete Erdogan ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Erdogan, M., Suzgun, M., Pappu, A., Xu, G., El, B., Schoen, A. A., Huang, F., Dickerson, J. P., Pilanci, M., & Zou, J. (2026). Who Should Know What? Empirical Information Design for Multi-Agent LLM Economies (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07667", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（実験設定§2、測定§3、主要結果§4の見出しと抄録の数値、考察と限界§5）を読んだ", "preprint": true, "p1": "LLMエージェントが取引・交渉・二重オークションを行う市場で、各エージェントに与える情報の細かさを体系的に変える「経験的な情報設計」の枠組みを作り、開示の効果がモデルによって大きく異なることを示した（抄録）。", "p2": "多エージェントLLMの成果はモデルの能力だけでなく、誰が何をどの細かさで知るかという情報共有の方針に左右されるが、詳しい情報が常に集団の成果を高めるのかは分かっていなかった（抄録、序論）。", "p3": "相互作用の規則とモデルを固定し、開示の水準（自分の価値だけ、相手の価値の順位まで、相手の正確な価値まで）を変えて、10のLLMについて同じモデルの別インスタンスどうしを取引させた。真の効用が分かる市場で、見つけた機会と実現した利得を分けて測る（§2–3）。具体例：2資源の交換市場で、モデル・情報条件ごとに90の市場を用い、発言は最大8回とした（§2.1）。", "p4": "評価は、可能な最大の総利得に対する実現した割合、利得の配分の均衡、合意の頻度、提案の質で行い、市場の間のばらつきから信頼区間を求めた（§3、§5）。", "p5": "交換市場で正確な価値を開示すると、GPT-6 Solの実現利得は最大の98%から91%に下がり、Claude Sonnet 5は72%から86%に上がった。二重オークションでは完全な開示が価格の要求を吊り上げて市場が崩れ、Gemini 3.1 Proは97%から78%、Claude Opus 5.5は94%から64%、Grok 4.7は97%から62%に厚生が下がった（抄録）。", "p6": "著者は、効用と目的が既知の統制されたゲームでの結果で、不確かな選好や変わる目標をもつ現実の場面には直接当てはまらず、信頼区間は同じ入力への反復応答ではなく市場間のばらつきを表すと述べる（§5）。解釈：同じモデルどうしの対戦が中心で、異なるモデルが混在する場面の一般性は限られる。", "fun": "交渉では、相手の手の内をすべて知っていれば有利になりそうです。ところがAI同士の取引の実験では、情報を細かく渡すとうまくいくAIもあれば、かえって欲張って交渉が決裂するAIもありました。同じ情報でも、受け取るAIによって結果が逆になるという点が面白いところです。", "unverified": "異なるモデル同士の組み合わせでの結果の詳細は付録の範囲で確認していない。"}}, {"id": "pr11", "rank": 11, "headline": "価値観と家族のケア参加の関係は制度の文脈で変わる", "title": "The Conditional Relevance of Value Orientations in Intergenerational Care: Institutional Context, Gender and Direction of Care in SHARE", "url": "https://doi.org/10.31235/osf.io/sqkub", "authors": "Zuzana Talašová ほか", "venue": "SocArXiv", "date": "2026-11-06", "apa": "Talašová, Z., & Lakomý, M. (2026). The Conditional Relevance of Value Orientations in Intergenerational Care: Institutional Context, Gender and Direction of Care in SHARE. https://doi.org/10.31235/osf.io/sqkub", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "SocArXivのPDF本文（データと方法§4、結果§5.2〜5.6、限界§6.3と図表のキャプション）を読んだ", "preprint": true, "p1": "欧州の高齢者で、価値観（対人信頼・宗教性・リスク回避・計画の時間的視野）が孫の世話と老親の介護への参加をどう予測するかを調べ、価値観の効き方はケアの方向や性別より、国の制度の文脈で変わることを示した（抄録、表3）。", "p2": "高齢化で欧州は家族によるケアへの依存を強めているが、個人化が家族の義務を弱めるという想定のもとで、価値観がどんな条件でケアの行動に結びつくのかは分かっていなかった（§1–2）。", "p3": "SHARE第8波（2019〜2020年）の個票（分析標本12,663人、孫の世話10,242人、親の介護4,429人）で、ケアへの参加をロジスティック回帰で予測し、国の固定効果、世帯でクラスタ化した標準誤差、平均限界効果（AME）を使い、性別と旧共産圏の中東欧との交互作用を検定した（§4、表1–2）。背景：AMEは説明変数が1単位変わったときの確率の平均的な変化。", "p4": "下向き（孫）と上向き（親）のケア、性別、制度の文脈ごとに価値観の関連の有無と向きを比べ、週1回以上の定期的なケアも補足的に分析した（§4.3、§5.6）。", "p5": "孫の世話は宗教性と正に関連し（祈りの頻度が1段階上がると確率が0.8ポイント上昇）、リスク回避とは非単調に関連した。親の介護の予測確率は大きなリスクをとる人の22.8%から平均的な人の33.5%に上がり、まったくとらない人で26.7%に下がった（§5.2–5.3、図1）。信頼のAMEは中東欧で負（孫−0.005、親−0.009）、それ以外では正だが不確かだった（§5.5、図3）。", "p6": "著者は、価値観の項目に答えた人に標本が限られ中東欧が下向きの標本の69%を占め南欧がほぼいないこと、国の区分が公的ケアの粗い代理であること、横断データで因果の向きを決められないことを限界に挙げる（§6.3）。解釈：中東欧での信頼の負の関連には、やむをえない介護の経験が信頼を下げたという逆の因果の可能性も残る（著者も言及）。", "fun": "「人を信じる気持ちが強い人ほど、家族の世話をよくする」と思いがちですが、欧州のデータでは国によって逆になりました。公的な介護の選択肢が乏しい旧社会主義の国々では、人を信じる人ほど家族のケアに加わりにくかったのです。同じ心の持ち方でも、社会の仕組みしだいで行動への表れ方が変わるという点が面白いところです。", "unverified": "定期的なケアでの制度の文脈による違いの詳細な数値は確認しきれていない。"}}, {"id": "pr12", "rank": 12, "headline": "テンソルNNで高次元の運動論方程式を安価に解く", "title": "Asymptotic-Preserving Tensor Neural Networks for 3D High-Field Kinetic Equations with Applications to Uncertainty Quantification", "url": "https://arxiv.org/abs/2611.07364", "authors": "Shi Jin ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Jin, S., & Zhang, T.-ai. (2026). Asymptotic-Preserving Tensor Neural Networks for 3D High-Field Kinetic Equations with Applications to Uncertainty Quantification (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07364", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（手法§3、数値結果§4の主要部分、結論§5と図表キャプション）を読んだ", "preprint": true, "p1": "高電場領域の運動論方程式（ブラソフ–ポアソン–フォッカー–プランク系とBGK–ポアソン系）を、低ランクのテンソルニューラルネット（TNN）と漸近保存（AP）の損失で解き、3次元空間×3次元速度の問題と不確実性の定量化を少ない計算資源で行えるようにした（抄録、§5）。", "p2": "位置と速度の位相空間で定義される運動論方程式は高次元で、高電場の極限ではふつうの物理情報NNの損失が巨視的な時間発展を決められず精度が落ちる（§3.2）。背景：AP法は、小さなパラメータが0に近づく極限でも正しい巨視方程式に一致するよう作った数値法。", "p3": "解を1次元の関数の積の和（CP分解）で表すTNNを使い、損失の残差も同じ形になることを示して高次元の積分を1次元の積分の組み合わせで評価する（§3.1、§3.3）。さらに速度の1次モーメントの方程式を損失に加え、極限での流束の閉じ方を直接拘束する（§3.2）。具体例：1次元のランダウ減衰で、スケールのパラメータを運動論の領域から高電場の領域へ下げて誤差を比べる（図2）。", "p4": "参照解に対する密度の摂動と電場の相対L²誤差、電場エネルギーの時間変化、学習1ステップの時間とGPUメモリを、通常のTNNと従来のAPTNNと比べ、2D2Vの二流不安定、3D3VのBGK–ポアソン、3D3VのVPFPの不確実性定量化に適用した（§4、図2–9）。", "p5": "VPFP系で提案法は誤差を10⁻²程度から10⁻³程度に下げ、電場エネルギーの相対誤差は4.48×10⁻³（BGK–ポアソン系で3.06×10⁻²）だった（§4.1、図2–3）。2D2Vで次元ごとの評価は1ステップ最大12.5ミリ秒・0.27GBに収まり、全格子での評価は7.77ミリ秒から838.13ミリ秒に増えた（§4.2、図4）。", "p6": "著者は、非線形のプラズマ不安定や不連続の輸送のように低ランクで近似しにくい解ではランクを大きくする必要があり、ランクの2乗で増えるメモリが隘路になりうること、ランクと誤差の定量的な関係が未解明なことを挙げる（§5）。解釈：粒子の衝突や接触が支配的な系の位相空間方程式への転用は検証されていない。", "fun": "気体やプラズマの粒子は「どこにいるか」の3つの数と「どの向きにどれだけ速く動くか」の3つの数で表され、その分布を計算するのは途方もない量の計算になります。この研究は、6つの変数をもつ関数を1つの変数の関数のかけ算の和で近似し、計算とメモリを大幅に減らしました。巨大な問題を細い糸の組み合わせに分解する発想が面白いところです。", "unverified": "3D3Vの問題での誤差の具体的な数値と学習時間（表1）は確認しきれていない。"}}, {"id": "pr13", "rank": 13, "headline": "LLMエージェントを増やしても信頼性は自動では上がらない", "title": "More Agents, More Reliable? System-Level Reliability of Multi-Agent LLMs under Operational-Profile Uncertainty", "url": "https://arxiv.org/abs/2611.07140", "authors": "Burkay Tun\\c{c}t\\\"urk ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Tunçtürk, B., Aslansefat, K., Papadopoulos, Y., & Nguyen, B. (2026). More Agents, More Reliable? System-Level Reliability of Multi-Agent LLMs under Operational-Profile Uncertainty (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07140", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（方法§2、事例と結果§3、考察§4と表1のキャプション）を読んだ", "preprint": true, "p1": "複数のLLMエージェントを組み合わせたシステムの信頼性を、エージェントごとの試験結果・利用状況（運用プロファイル）・答えを合わせる規則から区間の「信頼性の包絡」として評価する枠組みを示し、エージェントを増やしても信頼性は自動的には上がらないことを示した（抄録、§4）。", "p2": "複数エージェントの信頼性の根拠は平均的なベンチマーク精度に頼りがちで、実際に来る入力の構成や、答えを統合する規則（それ自体も失敗しうる）が無視されてきた（抄録）。", "p3": "入力の空間を難しさで区切った部分領域ごとに、不確実ディリクレ・モデルなどの不確かな事前分布でエージェントの失敗確率を評価し、統合規則を構造関数（ベイジアンネットワーク）として表し、利用状況の不確かさのもとで集計する3層の方法である（§2、式1、図1）。", "p4": "物質のSMILES表記からECHAの危険有害性の記載（Hコード）を返すパイプラインで、9物質・3エージェント（GPT-5-mini、Gemini-2.5-Flash、Qwen2.5-VL-3B）の多数決による3重化の構成を、ECHAの記録と完全に一致したかで評価した（§3.1–3.2）。", "p5": "複数の記載を持つ部分領域で、GPT-5-miniは失敗せず、Gemini-2.5-Flashは69回中7回、Qwen2.5-VL-3Bは70回中30回失敗した（§3.3）。多数決は最弱のエージェントからは守ったが最良のエージェント単独を明確には上回らず、多数決の装置が要求の5%で失敗すると中間のエージェントへの優位も失われた（§3.4–3.5、表1）。", "p6": "9物質は無作為でも代表的でもない選択で、分類が学習データに含まれうるため一部は読解ではなく記憶を測っている可能性があると著者は述べる（§3.1）。物質単位で見ると包絡が重なり、この標本の大きさでは多重化と最良のエージェントを区別できない（§3.3）。", "fun": "大事な判断を3人の多数決で決めれば、1人より間違いが減りそうです。ところがAIで試すと、弱い2つのAIが同時に間違えると正しい1つが負けてしまい、最も優秀なAI1つより良くなるとは限りませんでした。さらに多数決を取る係自体が時々間違えると、利点は消えてしまいます。数を増やすことと確かさを増すことは別だという点が面白いところです。", "unverified": "共通原因の係数の値の根拠と、より大きな標本での結果は未確認。"}}, {"id": "pr14", "rank": 14, "headline": "学習なしの乱数特徴でも表データの異常検知は強い", "title": "How Far Can Untrained Neural Networks Go in Anomaly Detection? From Tables to Pixels", "url": "https://arxiv.org/abs/2611.08136", "authors": "Hyojun Yi ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Yi, H., Kim, G., Seo, H., & Ryu, S. (2026). How Far Can Untrained Neural Networks Go in Anomaly Detection? From Tables to Pixels (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08136", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（定式化§III-B、表データの結果§V-B、結論§VIIと図表キャプション）を読んだ", "preprint": true, "p1": "学習していない乱数の非線形変換と、正常データの統計に対するマハラノビス距離だけで、表データと画像の異常検知で最先端に近い性能が出ることを示し、学習した表現の付加価値を測る基準PRISMを提案した（抄録、§VII）。", "p2": "異常検知は表現学習の問題とされ、高い性能には学習した特徴や専用の最適化が必要と考えられてきたが、正常と異常がもともと持つ分かれやすさは見落とされがちだった（抄録、§I）。", "p3": "ランダムに初期化して固定した線形変換・正規化・折れ線の非線形からなるブロック（式2）で特徴を作り、正常な参照データの平均と共分散に対するマハラノビス距離で得点を付ける。表データ用のPRISM-Tは1ブロック、画像用のPRISM-Vは5ブロックの多重解像度の特徴で位置ごとに得点を出す（§III-B、図1）。非線形変換が得点差の平均と共分散の寄与をどう変えるかも理論的に分析した（§IV）。", "p4": "ADBenchの表データ47個でAUROCとAUPRCを、MVTec ADとVisAの27カテゴリで画像単位と画素単位のAUROCを測り、近傍法・カーネル法・深層学習の検出器と、ホルム補正したウィルコクソン検定で比べた（§V、表III–IV）。", "p5": "PRISM-Tは平均AUROC 86.4%で最高、平均AUPRC 65.9%で2位（最高はLUNARの68.0%）で、学習なしの既存手法UNNをAUROCで3.5%、AUPRCで8.0%上回った（§V-B、表III）。推論は近傍法・カーネル法より最大156倍、構築は深層学習の検出器より最大6,824倍速かった。PRISM-Vは画像と画素のAUROCが90.4%と96.4%で、パラメータは0.33Mだった（§VII）。", "p6": "画像では、カテゴリと指標ごとの最良の得点の平均94.1%（MVTec AD）と87.8%（VisA）にとどまる（§VII）。解釈：正常な参照データの共分散を安定に推定できることが前提で、正常例が少ない場面や時間構造をもつデータへの適用は検証範囲の外にある。", "fun": "異常を見つけるAIは、ふつうは大量のデータで「正常とは何か」を学習させます。ところがこの研究は、まったく学習していないでたらめな計算の網に通しただけでも、正常と異常のずれが浮かび上がり、学習した最新のAIと互角になることを示しました。学習の本当の効き目を測る物差しを作った点が面白いところです。", "unverified": "カテゴリごとに差が大きい事例の原因と、ハイパーパラメータへの感度は確認しきれていない。"}}, {"id": "pr15", "rank": 15, "headline": "LLMと時空間知識グラフで都市の交通途絶を模擬", "title": "A Constraint-Aware Large Language Model and Spatiotemporal Knowledge Graph Framework for Urban Digital Twins: Simulating Transport Disruptions and Accessibility in Data-Scarce Cities", "url": "https://doi.org/10.20944/preprints202611.0360.v1", "authors": "Stabak Roy ほか", "venue": "Preprints.org", "date": "2026-11-06", "apa": "Roy, S., & Mitra, S. (2026). A Constraint-Aware Large Language Model and Spatiotemporal Knowledge Graph Framework for Urban Digital Twins: Simulating Transport Disruptions and Accessibility in Data-Scarce Cities. https://doi.org/10.20944/preprints202611.0360.v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": true, "p1": "センサや交通量のデータが乏しい南アジアの中規模都市で、LLMの対話窓口、公開データだけで作った時空間知識グラフ（STKG）、6規則の制約検証器を組み合わせ、平易な言葉の途絶の報告をシミュレータが使える道路網の状態に変える都市デジタルツインを示した（抄録）。", "p2": "多くの都市デジタルツインはセンサの流れ・交通量・較正した洪水モデルを前提とするが、インド北東部のアガルタラのように排水路の多くが地図になく、道路区間の約2%しかOpenStreetMapに名前がない都市では成り立たない（抄録）。", "p3": "浸水は流れに沿った最寄りの排水路からの高さ（HAND）の面でふるい分け、公表された水深と途絶の関係の曲線で速度の低下に変換した。LLMは報告をグラフ上の行動の提案に翻訳し、検証器が幻覚・無効・非現実的・網として危険な行動を退ける（抄録）。背景：HANDは地点が最寄りの排水路よりどれだけ高いかで浸水しやすさを近似する地形の指標。", "p4": "2026年8月にハオラ川が危険水位を超えた状況を踏まえ、水位1.5mでの病院への10分圏の需要の割合と、病院へのアクセスを失う需要の割合を評価し、600件の壊した行動提案で検証器の働きを試した（抄録）。", "p5": "水位1.5mでピーク時の病院10分圏の需要は86.4%から32.6%に下がり、需要の22.7%が病院へのアクセスを失い、31の河川橋も閉じると51.2%に上がった。検証器は幻覚・無効・非現実的・危険な行動をすべて退け、綴りの誤った道路名をすべて直したが、浸水しやすい道路を別の道路にすり替える誤りはすべて見逃した（抄録）。", "p6": "抄録の範囲では、浸水の範囲や移動時間の推定を実測で検証したかは確かめられない。著者は、LLMは出力を常にグラフと照合する翻訳者として扱うのがよいとする（抄録）。解釈：すり替えの見逃しは、規則だけの検証の限界を示している。", "fun": "洪水のとき「この道は通れない」という住民の書き込みを、すぐに地図の上の計算に反映できれば救急の判断に役立ちます。この研究は、AIに言葉を地図の操作に翻訳させ、間違いは決まったルールで確かめる仕組みを作りました。ありえない操作はすべて止められた一方、浸水しやすい道を別の道に取り違えるミスは見逃したという、検証の限界まで示した点が面白いところです。", "unverified": "浸水と移動時間の推定の実測による検証の有無は抄録では未確認。"}}, {"id": "pr16", "rank": 16, "headline": "粒子の記述から拡散を含む圧縮性オイラー方程式を導く", "title": "A continuum model of a diffusive compressible gas - Kinetic theory and real gases", "url": "https://arxiv.org/abs/2611.07738", "authors": "Magnus Sv\\\"ard", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Svärd, M. (2026). A continuum model of a diffusive compressible gas - Kinetic theory and real gases (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07738", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "気体の粒子の記述から、拡散を含む圧縮性オイラー方程式（dcEモデル）を導く全段階を示し、実在気体への拡張も提案した（抄録）。", "p3": "気体運動論から出発し、粒子の記述、巨視的な平均、有限体積での保存則の離散系、偏微分方程式の順に導き、途中でモデル化の仮定と拡散係数の近似を論じる（抄録）。", "p5": "理想気体についてdcEモデルと拡散係数の近似を導き、実在気体には分子間の摩擦力の暫定的なモデルを提案した（抄録）。数値による検証の結果は抄録に記載がない。", "fun": "空気は無数の分子が飛び回る集まりですが、天気予報や飛行機の設計では「流れ」として方程式で扱います。この論文は、一つひとつの粒子の動きから平均をとって流れの方程式に至るまでの道のりを、省かずにたどり直しています。ミクロとマクロをつなぐ橋の架け方そのものを丁寧に見せている点が面白いところです。", "unverified": "導いたモデルの数値的な検証と、実在気体モデルの精度は抄録では未確認。"}}, {"id": "pr17", "rank": 17, "headline": "流体と梁の連成モードで微小梁の減衰を縮約する", "title": "Reduced-order modeling of squeeze-film damped electrostatically actuated microbeams using complex modes of the coupled problem", "url": "https://arxiv.org/abs/2611.07205", "authors": "Fehmi Najar", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Najar, F. (2026). Reduced-order modeling of squeeze-film damped electrostatically actuated microbeams using complex modes of the coupled problem (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07205", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "静電気で動かす微小な梁と周りの薄い空気膜の連成問題について、連成系の複素モードを基底にした縮約モデルで、全体を細かく離散化したモデルを1.5%以内の誤差で速く再現した（抄録）。", "p3": "中央面の伸びと静電の非線形を含むオイラー–ベルヌーイ梁と、圧縮性のレイノルズ方程式を微分求積法で離散化し、減衰を含む連成系の複素モードにペトロフ–ガラーキン射影する（抄録）。", "p5": "モードは連成挙動を表す複素共役の対と、流体の緩和を表す実モードに分かれ、流体モードを落とすと構造モードだけでは補えない場合があった。連成モード1組と流体モード1つで全離散化モデルを1.5%以内で再現した（抄録）。", "fun": "電気の力で動かすごく小さな梁がすき間の空気の上で振動すると、空気がクッションになって揺れが弱まります。この論文は、その空気のクッション自体にも独自の動き方（モード）があり、それを省くと計算が合わなくなる場合があることを示しました。振動を正しく縮めて計算するには、相手の流体の動きも主役として数える必要があるという点が面白いところです。", "unverified": "実験・既往の数値結果との比較の具体的な値と、対象とした圧力・寸法の範囲は抄録では未確認。"}}, {"id": "pr18", "rank": 18, "headline": "駆動系を組み込んだUKFで極低速の車速を推定", "title": "A Hybrid UKF with Explicit Drivetrain Modeling for Low-Velocity State Estimation of Electric Vehicles", "url": "https://arxiv.org/abs/2611.08117", "authors": "Hendrik Sch\\\"afke ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Schäfke, H., Weber, D. O. M., Seel, T., Vagapov, A., Iatropoulos, J., Schweers, C., Trabelsi, A., Henze, R., & Ehlers, S. F. G. (2026). A Hybrid UKF with Explicit Drivetrain Modeling for Low-Velocity State Estimation of Electric Vehicles (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08117", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "電気自動車の時速1km未満の極低速で、モーターの回転数を駆動系のねじれを考慮して取り込むカルマンフィルタにより、車速の推定誤差を大きく下げた（抄録）。", "p3": "低速向けの車両モデルに無香料カルマンフィルタ（UKF）を用い、モーター回転数を、ねじればね・ダンパの駆動系を状態に含める物理的な経路と、ニューラルネットの仮想車輪速センサを疑似観測とする経路の2通りで取り込み、量産EV2台の実走行で慣性基準と比べた（抄録）。", "p5": "時速1km未満で、2つの提案法は車両Aで基準の2手法に比べ二乗平均平方根誤差を少なくとも54%と45%下げ、再調整なしで移した車両Bでも少なくとも41%と51%下げた（抄録）。", "fun": "車の速さは普通タイヤの回転を数えて測りますが、歩くよりずっと遅いと回転の刻みが粗すぎて分かりません。そこでこの研究は、細かく回るモーターの回転を使い、モーターとタイヤの間の「ねじれ」をばねとして計算に入れました。調整し直さずに別の車でもそのまま効いたという点が、実用の面でも面白いところです。", "unverified": "停止付近の離散化の比較の詳細と、試験の走行条件は抄録では未確認。"}}, {"id": "pr19", "rank": 19, "headline": "ソフトプロンプトで小型LLM審査員を人の評価に合わせる", "title": "Adapting LLM Judges to Observed Human Annotation Policy through Soft Prompt Tuning", "url": "https://arxiv.org/abs/2611.07126", "authors": "Tam\\'as Janusko ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Janusko, T., Kleinkop, S., Bochnia, R., Hempel, G., Tomschke, S., Anke, J., & Thiele, M. (2026). Adapting LLM Judges to Observed Human Annotation Policy through Soft Prompt Tuning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07126", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "小型のオープンなLLMを評価者（審査員）として使うとき、学習した連続のプロンプト（ソフトプロンプト）を加えると人の注釈との一致が高まることを示した（抄録）。", "p3": "FairBotBenchでソフトプロンプトを学習し、偏り・有害性・個人化の3つの評価次元で、文章のプロンプトと学習した埋め込みを組み合わせた混合型を、調整前の基準と比べた（抄録）。", "p5": "混合型の調整は、調整前に比べて一貫して人の注釈との一致を高めた。Qwen 3.5 9Bでは、調整した審査員が3次元すべてで2つの商用の参照審査員を上回った（抄録）。", "fun": "AIの答えの良し悪しをAIに採点させる方法が広まっていますが、小さなAIは人間の採点と食い違いがちです。この研究は、指示文の前に学習で調整した「見えない合図」を付け足すだけで、小さなAIの採点を人間に近づけられることを示しました。大きなAIに頼らなくても採点の癖を人に合わせ込める点が面白いところです。", "unverified": "一致度の具体的な数値と、ほかの評価データへの汎化は抄録では未確認。"}}, {"id": "pr20", "rank": 20, "headline": "LLM審査員の評価のずれを反復的に再較正する", "title": "PromptOps: Iterative Prompt Optimization for LLM-as-a-Judge Systems", "url": "https://arxiv.org/abs/2611.07123", "authors": "Sven Kleinkop ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Kleinkop, S., Janusko, T., Bochnia, R., Hempel, G., Tomschke, S., Anke, J., & Thiele, M. (2026). PromptOps: Iterative Prompt Optimization for LLM-as-a-Judge Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07123", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "運用中のLLM評価者の採点が人の基準からずれていく「審査員のドリフト」を、監視と反復的なプロンプト最適化で直す枠組みPromptOpsを示した（抄録）。", "p3": "いつ最適化するか、どの手法を使うか、どの記録を使うか、プロンプトをどう更新するかの4つの判断を分け、GEPA、SIMBA、ルーブリック合成、焼きなまし法とTPEによる例示選択の5手法で実装した（抄録）。", "p5": "参照の得点分布を制御してずらした実験で、反復的な最適化により審査員を再較正し性能を回復できた。一方、最適化の手法や更新の時期の最善は設定ごとに異なり、普遍的な選び方はなかった（抄録）。", "fun": "AIに採点係をさせると、最初は人の採点とよく合っていても、扱う答えの傾向が変わるとだんだんずれていきます。この研究は、採点係への指示文を定期的に見直す「保守点検」の仕組みを作りました。どの直し方が一番よいかは場面ごとに違い、点検を続けること自体が大事だという結論が現場らしくて面白いところです。", "unverified": "回復の程度の数値と、使った評価データの詳細は抄録では未確認。"}}, {"id": "pr21", "rank": 21, "headline": "署名つきの要件の受け渡しでエージェント間の改変を防ぐ", "title": "Signed but Not Safe: Requirement Integrity in Multi-Agent LLM Handoffs", "url": "https://arxiv.org/abs/2611.07483", "authors": "Xiaobo Chen ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Chen, X., Zhu, G., Wang, Z., & Wang, C. (2026). Signed but Not Safe: Requirement Integrity in Multi-Agent LLM Handoffs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07483", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "AIエージェントの間で依頼の要件を受け渡すとき、要件を逐語の引用と検査できる条件に分けて署名した「要件マニフェスト」を使うと、攻撃下で安全でない確定が大きく減ることを、事前登録の研究で示した（抄録）。", "p3": "正確に採点できる合成課題で、自由文・構造化JSON・署名つきマニフェストの受け渡しを比べ、統合役の判断を決定的なコードで検証した。Qwen3-8Bで1,440の軌跡と5種の脅威を試した（抄録）。", "p5": "攻撃下の安全でない確定は69.4%から9.0%に減った（95%信頼区間[51.4, 69.4]の差）。ただし署名前の抽出への注入では違反が14.6%から37.5%に増え、署名は壊れた要件まで認証した（抄録）。", "fun": "伝言ゲームでは、途中の人が内容を縮めたり変えたりすると、最後に届く話が変わってしまいます。この研究はAI同士の伝言に「封印つきの要件リスト」を使い、途中の改ざんをほぼ防げることを示しました。ただし封をする前に紛れ込んだ嘘は、封印がかえって本物らしく見せてしまうという落とし穴を突き止めた点が面白いところです。", "unverified": "課題の具体的な内容と、ほかのモデルでの主効果の大きさは抄録では未確認。"}}, {"id": "pr22", "rank": 22, "headline": "長い役割演技の対話でペルソナの一貫性を保つ", "title": "Recursive Self-Improvement for Long-Horizon Role-Playing Dialogue", "url": "https://arxiv.org/abs/2611.07469", "authors": "Y. L. Li ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Li, Y. L., & Wu, Y. H. (2026). Recursive Self-Improvement for Long-Horizon Role-Playing Dialogue (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07469", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "長い役割演技の対話で、キャラクターの記憶・ペルソナの指示・各ターンのプロンプトの作り方を上限つきで自己改善させる枠組みを示し、不適切な応答を大きく減らした（抄録）。", "p3": "更新役を、入力・編集できる項目・受け入れの関門・停止条件を明示した版管理つきの方針として定め、修復の結果から診断規則なども改める。50のキャラクター×5モデルで100往復の会話を2本ずつ評価した（抄録）。", "p5": "不適切な応答の率は14.00%から4.94%に下がった（相対で64.71%減）。盲検の人による比較600件では294勝・187分け・119敗で、引き分けを除く勝率は71.19%だった（抄録）。", "fun": "AIに登場人物を演じさせると、話が長くなるにつれて性格や記憶がぶれていきます。この研究は、AIが自分の演技の失敗を見つけ、人物の設定メモや指示の書き方を少しずつ直していく仕組みを作りました。直し方のルール自体も改善の対象にしつつ、暴走しないよう止まる条件を決めてある点が面白いところです。", "unverified": "評価は内部のテスト分布に限られ、外部の評価データでの効果は抄録では未確認。"}}, {"id": "pr23", "rank": 23, "headline": "生成AIの費用を取引単位で配賦する二台帳モデル", "title": "The Two-Ledger Model: Transaction-Grain Cost Accounting for Multi-Agent AI Systems Across Clouds, Models, and Systems of Record", "url": "https://arxiv.org/abs/2611.06989", "authors": "Vivek Acharya", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Acharya, V. (2026). The Two-Ledger Model: Transaction-Grain Cost Accounting for Multi-Agent AI Systems Across Clouds, Models, and Systems of Record (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06989", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "複数のAIエージェントを使う業務で、AIの費用を注文・請求・案件といった取引の単位で把握するための二台帳モデルを提案した（抄録）。", "p3": "請求データの決済台帳と、OpenTelemetryの記録による呼び出し単位の帰属台帳を結び、トレース情報・エージェント間のメタデータ・業務キー・確率的な照合を重ねて各記録を取引に割り当て、期ごとに請求書と照合する（抄録）。", "p5": "正解の分かるシミュレーションで、トレースの伝播がなくなっても費用の捕捉率は99%を超え、計量されない支出を0.24ポイント以内で復元し、実行中の制御で上位1%の取引費用を最大61%下げた（抄録）。", "fun": "会社でAIを使うと、請求書には「今月AIにいくら払ったか」しか書かれず、どの仕事にいくらかかったかは分かりません。この研究は、AIの利用記録と請求書という2冊の帳簿を突き合わせて、仕事一件ごとの原価を出す方法を考えました。昔からある原価計算の考え方をAIの時代の新しい費用に当てはめた点が面白いところです。", "unverified": "実際の企業データでの検証は抄録では未確認（評価はシミュレーション）。"}}, {"id": "pr24", "rank": 24, "headline": "15年以上続ける無償の地域保健員の動機と困難", "title": "Lived experiences of long-serving (&gt;15 years) community health workers in South Western Uganda: a phenomenological study", "url": "https://doi.org/10.21203/rs.3.rs-11638367/v1", "authors": "Edison Byamugisha ほか", "venue": "Research Square (In Review)", "date": "2026-11-06", "apa": "Byamugisha, E., Kanyesigye, H., Kyomuhangi, T., Brenner, J., & Kabakyenga, J. (2026). Lived experiences of long-serving (&gt;15 years) community health workers in South Western Uganda: a phenomenological study. https://doi.org/10.21203/rs.3.rs-11638367/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ウガンダ南西部で15年以上、主に無償で活動を続ける地域保健員の動機・困難・対処を明らかにし、継続を支えるのは保健制度の支援より内発的・社会的な報酬と自前の対処だと示した（抄録）。", "p3": "2004〜2008年に選ばれ訓練を受けた地域保健員36人と教区の調整役18人に深層面接を行い、社会生態学的な枠組みの4つの水準で主題分析した（抄録）。", "p5": "動機は職業的な成長、地域の尊敬と信頼、仲間との友情、ささやかな誘因だった。困難は再研修の不足、高齢化による健康と安全の危険、家族・農業との両立、移動手段や資金の不足で、信仰や貯蓄グループ、家族の支えで対処していた（抄録）。", "fun": "アフリカの村々では、給料をほとんどもらわずに近所の人の健康を見守る地域保健員が医療を支えています。この研究は15年以上続けている人たちに理由を尋ね、尊敬や仲間、自分の成長が支えになる一方、交通費や道具は自分で工面していることを描きました。善意が長続きする理由と、その危うさが同時に見える点が面白いところです。", "unverified": "活動をやめた人との比較はなく、要因の効果の大きさは抄録では未確認。"}}, {"id": "pr25", "rank": 25, "headline": "ホームレス支援のボランティアが見る心の健康とケア", "title": "Volunteers’ Perspectives on Mental Health and Care Coordination for People Experiencing Homelessness: A Qualitative Focus Group Study", "url": "https://doi.org/10.20944/preprints202611.0365.v1", "authors": "Bárbara Santamarta-Fernández ほか", "venue": "Preprints.org", "date": "2026-11-06", "apa": "Santamarta-Fernández, B., Andina-Díaz, E., Vázquez-García, E., & Fernández-Martínez, E. (2026). Volunteers’ Perspectives on Mental Health and Care Coordination for People Experiencing Homelessness: A Qualitative Focus Group Study. https://doi.org/10.20944/preprints202611.0365.v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "スペイン・レオンでホームレスの人を支えるボランティアの視点から、心の健康の困りごと、医療・福祉への壁、ボランティアの役割の境界のあいまいさを明らかにした（抄録）。", "p3": "人道系NGOのボランティア9人による2回の半構造化フォーカスグループを逐語録にし、一般的な帰納的アプローチで分析した（抄録）。", "p5": "2つの主題と7つの下位主題が得られた。心の不調の悪化、偏見、断片的なサービス、退院後の支援の乏しさ、女性のホームレスの見えにくさが語られ、寄り添いは評価される一方、役割の境界、研修の不足、専門職の支援の少なさが課題とされた（抄録）。", "fun": "路上で暮らす人を支えるボランティアは、医療や福祉の窓口と本人の間をつなぐ大事な役目を担っています。この研究で彼らは、やりがいと同時に「どこまでが自分の役目か分からない」という迷いを語りました。研修を求めながら実際には参加しにくいという矛盾も浮かび、善意を支える仕組みの必要性が見える点が興味深いところです。", "unverified": "生活の質や燃え尽き、サービスの効果は測定していないと著者が記載（抄録）。参加者は9人に限られる。"}}, {"id": "pr26", "rank": 26, "headline": "高齢移民と福祉制度を結ぶ相談事業の歴史", "title": "NISBO Elderly Advisory Services as a Bridge between Older Migrants and Welfare Institutions: Historical Lessons from the Dutch Experience", "url": "https://doi.org/10.31235/osf.io/eyx4p", "authors": "Cemal YILMAZ", "venue": "SocArXiv", "date": "2026-11-06", "apa": "YILMAZ, C. (2026). NISBO Elderly Advisory Services as a Bridge between Older Migrants and Welfare Institutions: Historical Lessons from the Dutch Experience. https://doi.org/10.31235/osf.io/eyx4p", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "オランダで移民の高齢者のための相談事業（NISBOとその前身TISBO）の歴史を文書から再構成し、移民と福祉制度をつなぐ「制度の橋」の5つの機能を整理した（抄録）。", "p3": "1990年代半ばのTISBOの事業文書、1996年のNISBOの計画文、1999年と2001年のNISBOの報告書を、政府の記録と文献で補い、質的な歴史的事例研究として分析した（抄録）。", "p5": "相談事業は1994年に始まり1997年までに移行し、1998年1〜5月に収入・住宅・医療・福祉の697件の相談があった。情報への到達、伝達と仲介、信頼と個別支援、制度間の調整、代表と組織学習の5機能を示した（抄録）。", "fun": "外国から移り住んで年を重ねた人は、言葉や制度の違いから、年金や住まいの相談先にたどり着けないことがあります。この研究は、移民自身が作った相談窓口が本人と役所の間の「橋」として何をしていたかを、古い記録から読み解きました。橋の働きを5つに分けて示した点が、ほかの地域でも使える見取り図として面白いところです。", "unverified": "相談の結果や長期的な効果は資料から確かめられないと著者が記載（抄録）。"}}, {"id": "pr27", "rank": 27, "headline": "22か国9.8万人で現在と将来の幸福の規定要因を比較", "title": "Current and Expected Well-Being in a Global Sample: The Role of Past Experiences, Current Circumstances, and Identity and Personality", "url": "https://doi.org/10.31234/osf.io/cd2hn", "authors": "Anaelle Gackiere ほか", "venue": "PsyArXiv", "date": "2026-11-06", "apa": "Gackiere, A., Garrison, S. M., & Waugh, C. (2026). Current and Expected Well-Being in a Global Sample: The Role of Past Experiences, Current Circumstances, and Identity and Personality. https://doi.org/10.31234/osf.io/cd2hn", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "22か国98,412人の調査から、人が現在の幸福と5年後に予想する幸福を判断するとき、ほぼ同じ情報を異なる重みで使っていることを示した（抄録）。", "p3": "Global Flourishing Studyの第1波（N=98,412、22か国）で、過去の経験・現在の状況・アイデンティティと性格にわたる予測因子を、ベイズ的な変数選択で結果ごとに選んだ（抄録）。", "p5": "人は概して将来の幸福が現在を上回ると予想した。互いを調整すると、高齢ほど予想する幸福は低く、希望が強いほど高かった。過去の経験は現在の状況などを考慮すると独自の説明力をほとんど持たなかった（抄録）。", "fun": "「いま幸せか」と「5年後は幸せだと思うか」は似た質問ですが、答え方の中身は少し違うようです。世界22か国の98,412人のデータから、将来の見通しには年齢と希望の強さが反対向きに効き、過去の出来事は今の暮らしを通じてしか効いていないことが分かりました。幸福の見積もり方の癖が見える点が面白いところです。", "unverified": "各予測因子の効果の大きさと国ごとの違いは抄録では未確認。"}}, {"id": "pr28", "rank": 28, "headline": "高齢者の陰謀論的思考は孤独の結果ではなかった", "title": "Conspiratorial mentality among older people: The role of loneliness, depression, anxiety, and social media use", "url": "https://doi.org/10.31234/osf.io/27u8t", "authors": "Michal Mužík ほか", "venue": "PsyArXiv", "date": "2026-11-06", "apa": "Mužík, M., & Serek, J. (2026). Conspiratorial mentality among older people: The role of loneliness, depression, anxiety, and social media use. https://doi.org/10.31234/osf.io/27u8t", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "チェコの60歳以上の縦断調査で、孤独・抑うつ・不安は陰謀論的な考え方を予測せず、逆に陰謀論的な考え方が不安を高めることを示した（抄録）。", "p3": "60歳以上のチェコの成人の2時点の縦断データ（第1波4,133人、平均69.1歳）で、孤独・不安・抑うつと陰謀論的メンタリティの双方向の関係を線形・二次で検証し、SNS利用の調整効果も調べた（抄録）。", "p5": "陰謀論的メンタリティはほかの変数から予測されず、それ自体は不安だけを正に予測した。SNS利用の調整効果と二次の効果は支持されなかった（抄録）。", "fun": "「孤独な高齢者ほど陰謀論を信じやすい」と考えたくなりますが、この研究のデータはそれを支持しませんでした。むしろ陰謀論的な考え方を持つことが、のちの不安を強めていたのです。原因と結果の向きを2時点の調査で確かめると、思い込みとは逆の流れが見えてくるという点が面白いところです。", "unverified": "効果の大きさと2時点の間隔は抄録では未確認。"}}, {"id": "pr29", "rank": 29, "headline": "罰金による規制で自動運転配車の高値と地域格差を抑える", "title": "Regulating Autonomous Mobility-on-Demand Operators with Fixed and Adaptive Penalties: A Multi-Agent Reinforcement Learning Approach", "url": "https://arxiv.org/abs/2611.07122", "authors": "Korbinian K\\\"ugler ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Kügler, K., Schmidt, C., Dandl, F., & Rodrigues, F. (2026). Regulating Autonomous Mobility-on-Demand Operators with Fixed and Adaptive Penalties: A Multi-Agent Reinforcement Learning Approach (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07122", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "利益を追う自動運転の配車事業者に、罰金による規制を外側の制御として学習させ、過大な価格と地域のサービス不足を抑える方法を示した（抄録）。", "p3": "価格設定と車両の再配置を同時に行う事業者を、固定罰金ではマルコフ決定過程、地域別の罰金を定期的に調整する動的な規制では部分観測確率ゲームとして定式化し、グラフ型の多エージェント強化学習で学習した。マンハッタンの実データで実験した（抄録）。", "p5": "固定の割増料金への罰金で、過大な価格に直面する利用者は22%から1%に減った。動的な規制は同じ平均強度の固定罰金より規制者の報酬を最大15.6%改善したが、車両が逼迫するピーク時には不足が残った（抄録）。", "fun": "自動運転タクシーの会社がもうけを優先すると、混む時間に料金をつり上げたり、もうからない地域から車を引き上げたりしかねません。この研究は、規制する側もAIにして罰金の強さを地域ごとに調整させました。車が足りず守りようがない場所では罰金を下げることを、規制側のAIが自ら学んだ点が面白いところです。", "unverified": "事業者の利益と利用者の効用のトレードオフの具体的な値は抄録では未確認。"}}, {"id": "pr30", "rank": 30, "headline": "スマートシティの失敗を統治と公平性から整理", "title": "When Smart Cities Fail: Global Patterns of Digital Governance Breakdown, Algorithmic Opacity, and Equity Deficits in Urban Technology Deployment", "url": "https://doi.org/10.20944/preprints202611.0408.v1", "authors": "Mahlatse Given Sevhake ほか", "venue": "Preprints.org", "date": "2026-11-06", "apa": "Sevhake, M. G., & Hofisi, C. (2026). When Smart Cities Fail: Global Patterns of Digital Governance Breakdown, Algorithmic Opacity, and Equity Deficits in Urban Technology Deployment. https://doi.org/10.20944/preprints202611.0408.v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "スマートシティの技術導入で起きる統治の失敗を、アルゴリズムの不透明さ・説明責任の空白・社会空間的な不平等の重なりとして定義し、76文献から整理した（抄録）。", "p3": "2008〜2026年の査読付き・基礎的な文献76件を、都市研究・行政学・批判的データ研究にまたがって統合的に体系レビューし、アフリカなどグローバル・サウスの都市を意図して含めた（抄録）。", "p5": "不透明なアルゴリズムは正統性を損ない、官民連携は説明責任を薄め、デジタル基盤は既存の不平等を再生産し、害はもともと支援の乏しい地域に集中していた。予見的な統治、アルゴリズムの監査、公平性を組み込んだ設計の研究課題を提案した（抄録）。", "fun": "センサやAIで街を便利にする「スマートシティ」は、良い面ばかりが語られがちです。この論文は逆に「失敗」を研究の対象に据え、仕組みの見えないアルゴリズムや責任の所在のあいまいさが、もともと困っている地域にしわ寄せを生む様子を整理しました。成功例ではなく失敗例から学ぶ発想が面白いところです。", "unverified": "個々の事例の詳細と失敗の頻度は抄録では未確認。"}}, {"id": "pr31", "rank": 31, "headline": "地形の差分から土石流の摩擦と取り込みの係数を較正", "title": "Geomorphic calibration of friction and entrainment parameters for a snowmelt-induced muddy debris flow in the Longiarù Valley, Dolomites", "url": "https://doi.org/10.21203/rs.3.rs-11390146/v1", "authors": "Litan Dey ほか", "venue": "Research Square (In Review)", "date": "2026-11-06", "apa": "Dey, L., Comiti, F., Mergili, M., Macconi, P., Cavalli, M., Crema, S., Dallan, E., Mair, V., Patscheider, L., & Borga, M. (2026). Geomorphic calibration of friction and entrainment parameters for a snowmelt-induced muddy debris flow in the Longiarù Valley, Dolomites. https://doi.org/10.21203/rs.3.rs-11390146/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "雪どけで起きた泥流型の土石流について、事前・事後の地形の差分から、数値シミュレーションの摩擦と土砂の取り込みの係数を較正した（抄録）。", "p3": "イタリア・ドロミテのセレス川流域で2024年6月17〜18日に起きた事象を対象に、2010年の事前DEMと2024年のLiDARによる事後DEMの差分で侵食と堆積の分布を求め、r.avaflowの反復計算で摩擦と取り込みの係数を絞り込んだ（抄録）。", "p5": "較正した組み合わせは内部摩擦角17°、底面摩擦角9°、乱流摩擦パラメータ10 m/s²などで、上流の侵食から下流の堆積への遷移を再現した。乱流摩擦は到達距離などに、取り込みは運動量と堆積の位置に強く効いた（抄録）。", "fun": "土石流の計算には「どれくらい滑りやすいか」「川底の土をどれくらい巻き込むか」という係数が必要ですが、災害ごとに測るのは困難です。この研究は、災害の前後の地形の差から削られた所と積もった所を地図にし、それを再現できる係数を逆算しました。到達距離だけでなく地形の変化全体を手がかりにした点が面白いところです。", "unverified": "取り込み係数の値は抄録の記載が欠けており未確認。"}}, {"id": "pr32", "rank": 32, "headline": "低精度の解で縮約モデルの基底を安く作る", "title": "Efficient Projection-Based Reduced-Order Modeling for Computational Fluid Dynamics via Multifidelity Basis Construction", "url": "https://arxiv.org/abs/2611.07231", "authors": "Ashok Viswanathan ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Viswanathan, A., & Farhat, C. (2026). Efficient Projection-Based Reduced-Order Modeling for Computational Fluid Dynamics via Multifidelity Basis Construction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07231", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "計算の安い低精度の解で、射影型の縮約モデル（PROM）の基底を補い、学習用のスナップショットを作る費用を下げる方法を示した（抄録）。", "p3": "パラメータをそろえた高精度と低精度の解から補正基底を作り、新しいパラメータでは低精度の予測を高精度の残差の最小化で補正して、受け入れた解で基底を更新する。翼型NACA0012の定常流で、細かい格子のRANSと粗い格子のオイラー方程式を組み合わせた（抄録）。", "p5": "高精度4個と低精度由来36個の解で生成費用は7.8分の1になり、基底次元40での揚力・抗力・揚抗比の平均誤差は1.1%、3.6%、3.9%（高精度のみでは0.18%、2.9%、2.8%）だった（抄録）。", "fun": "精密なシミュレーションは時間がかかるので、代表的な結果から作った「縮めた模型」で計算を速める方法があります。ただ、その模型を作るのにも精密な計算がたくさん要ります。この研究は、粗い計算の結果を少数の精密な結果で補正して材料にし、準備の手間を約8分の1にしました。安い情報で高い情報を補う発想が面白いところです。", "unverified": "非定常流れやほかの形状での性能は抄録では未確認。"}}, {"id": "pr33", "rank": 33, "headline": "多孔質の非線形な非定常流れを表す新しいモデル式", "title": "A model equation for nonlinear unsteady flow through porous media", "url": "https://doi.org/10.21203/rs.3.rs-11442655/v1", "authors": "Lukas Unglehrt ほか", "venue": "Research Square (In Review)", "date": "2026-11-06", "apa": "Unglehrt, L., Sakai, Y., & Manhart, M. (2026). A model equation for nonlinear unsteady flow through porous media. https://doi.org/10.21203/rs.3.rs-11442655/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "多孔質の中の非線形な非定常流れについて、抵抗（抗力）を4つの成分に分けた新しいモデル式を提案し、中間の周波数での非線形な流れの予測を既存モデルより改善した（抄録）。", "p3": "体積平均の運動量式で、抗力を加速による圧力抗力（屈曲度と圧力勾配で表す）、粘性による圧力抗力、対流による圧力抗力（フォルヒハイマー型）、摩擦抗力に分け、粘性と摩擦の項を等価流体モデルと境界層のスケーリングを混ぜた履歴項で表した（抄録）。", "p5": "六方充填した球の層を通る振動流の直接数値計算と比べ、線形の流れを正確に表し、中間周波数の非線形流れの予測を大きく改善した。誤差は高周波の非線形流ほど大きくなった（抄録）。", "fun": "砂や小石のすき間を水が行ったり来たりするとき、水が受ける抵抗は流れの速さや揺れの速さで複雑に変わります。この研究は、その抵抗を4種類に分け、それぞれに合った式を当てはめました。分けて考えることで、難しかった中くらいの速さの揺れの予測が良くなった点が面白いところです。", "unverified": "誤差の具体的な数値と、球以外の多孔質への適用は抄録では未確認。"}}, {"id": "pr34", "rank": 34, "headline": "衛星レーダーでの見え方の変化から構造物の状態を追う", "title": "Observability Core Vector Trajectories for Structural Health Monitoring: From Stable States to Structural Change", "url": "https://doi.org/10.21203/rs.3.rs-11612080/v1", "authors": "Martin Hoffmann", "venue": "Research Square (In Review)", "date": "2026-11-06", "apa": "Hoffmann, M. (2026). Observability Core Vector Trajectories for Structural Health Monitoring: From Stable States to Structural Change. https://doi.org/10.21203/rs.3.rs-11612080/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "衛星レーダー（Sentinel-1）での構造物の見え方を6つの記述量で表した観測可能性コアベクトル（OCV）の時間変化を追い、構造物の監視を補う情報になるかを調べた（抄録）。", "p3": "取得間のエコーの一貫性とエコーのマスクの形状に関する6つの記述量によるOCVの軌跡を、安定運用、状態遷移、再建、補修、大きな構成変更、記録された破壊の各事例で調べた（抄録）。", "p5": "過程によってOCVの変化ははっきり出る場合も弱い場合も出ない場合もあり、共通の健全度の方向はなかった。移転できる寿命の軌跡や普遍的な破壊の兆候は支持されず、構造的な解釈には独立の計測か検証済みの物理モデルが必要とした（抄録）。", "fun": "人工衛星のレーダーは、雲があっても地上の建物や橋を定期的に見ることができます。この研究は、構造物が補修されたり壊れたりしたとき、レーダーでの見え方がどう変わるかを追いかけました。どの壊れ方にも共通する「危険のサイン」は見つからなかったと率直に報告している点が、かえって信頼できて面白いところです。", "unverified": "対象とした構造物の数と種類は抄録では未確認。"}}, {"id": "pr35", "rank": 35, "headline": "経年下での導波SHMの検出確率を評価する枠組み", "title": "Towards MAPoD and MAPoL Assessment of Guided-Wave SHM Systems under Aging Conditions: Application to a Composite Cryogenic Tank for Reusable Launch Vehicles", "url": "https://doi.org/10.58286/34024", "authors": "Lina El Guerjouma ほか", "venue": "HAL", "date": "2026-11-05", "apa": ", El Guerjouma, L., Eiras, J. N., Mechbal, N., Irisarri, F.-X., Gavérina, L., García-martínez, A., & Hascoët, N. (2026). Towards MAPoD and MAPoL Assessment of Guided-Wave SHM Systems under Aging Conditions: Application to a Composite Cryogenic Tank for Reusable Launch Vehicles. E-Journal of Nondestructive Testing, 31(8). https://doi.org/10.58286/34024", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "HALに登録された会議論文の抄録を使用", "preprint": true, "short": true, "p1": "再使用ロケットの複合材の極低温タンクを例に、超音波の導波を使う構造ヘルスモニタリング（SHM）のシステム自体が経年劣化すると、はく離の検出と位置特定の性能が大きく落ちることを有限要素モデルで示した（抄録）。", "p3": "直径約24cmの複合材のタンクと圧電素子を等価単層のシェル要素でモデル化し、レーザードップラー振動計による実物大の測定と比べたうえで、損傷指標とRAPID・DASの位置特定法をSHMの劣化状態ごとに試した（抄録）。", "p5": "SHMシステムの経年劣化が損傷の検出と位置特定の性能を大きく損なうことを示した（抄録）。劣化の程度ごとの検出確率の数値は抄録に記載がない。", "fun": "ロケットを再利用するには、飛ぶ前に傷がないかを確かめる必要があり、センサを貼り付けて常に見張る方法が考えられています。ところが、そのセンサ自体も厳しい温度や力で年を取ります。この研究は「見張り役の老化」で傷の見逃しが増えることを計算で示しました。点検する側の健康も点検が必要だという視点が面白いところです。", "unverified": "劣化の程度ごとの検出確率と位置特定の確率の数値は抄録では未確認。"}}, {"id": "pr36", "rank": 36, "headline": "構造試験では同定できないパラメータの組を示す", "title": "What a structural test cannot identify: degeneracy-aware Bayesian calibration of a multiscale material mode", "url": "https://doi.org/10.5281/zenodo.23990483", "authors": "ROMERO SUAREZ ほか", "venue": "Zenodo", "date": "2026-11-05", "apa": "ROMERO SUAREZ, G. E. R. M. A. N. O. R. L. A. N. D. O., VILLEGAS, D. I. E. G. O., & Pinto Hernández, W. (2026). What a structural test cannot identify: degeneracy-aware Bayesian calibration of a multiscale material mode. Zenodo. https://doi.org/10.5281/ZENODO.23990483", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された文書の抄録を使用（審査のない置き場）", "preprint": true, "short": true, "p1": "構造試験で多尺度の材料モデルを較正するとき、原理的に同定できないパラメータの組があることを命題として示し、ナノインデンテーションを組み合わせると同定できることを示した（抄録）。", "p3": "剛性が構成テンソルに線形で荷重がそうでない条件では、試験は1つの組み合わせしか同定できないことを示し、フィッシャー情報の零方向と25の初期値からの最適化で確かめた。圧縮試験とナノインデンテーションの情報行列を組み合わせた（抄録）。", "p5": "零方向は(0.7071, −0.7071)と復元され、2つの試験を合わせると情報行列はランク2（条件数196）になった。同定可能性に基づく座標の回転で、事後相関は0.98から0.13に下がった（抄録）。", "fun": "2つの量の積しか測れない実験では、片方を2倍、もう片方を半分にしても結果は同じなので、どれだけデータを集めても別々の値は決まりません。この研究は、材料の試験でもそうした「原理的に見分けられない組」が生じることを示し、別の種類の試験を組み合わせて解決しました。見分けられない方向を、計算を楽にする座標の取り方に生かした点が面白いところです。", "unverified": "審査のない置き場の文書で、対象の材料と試験の詳細は抄録では未確認。"}}, {"id": "pr37", "rank": 37, "headline": "分数階PINNでSNS投稿の拡散の記憶効果を学習", "title": "Fractional physics-informed neural networks to model social media virality", "url": "https://arxiv.org/abs/2611.07215", "authors": "Alex Koong ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Koong, A., & Karniadakis, G. E. (2026). Fractional physics-informed neural networks to model social media virality (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07215", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "SNS投稿への反応の増え方を、過去の影響の記憶を持つ分数階の微分方程式としてニューラルネットで学習し、記号回帰で解釈できる式に直す枠組みを示した（抄録）。", "p3": "分数階の物理情報ニューラルネット（PINN）で記憶と非線形の増加の法則を同時に学習し、観測ノイズには分数階の作用素を通してノイズを伝える白色化した残差で対処した。X（旧Twitter）の348投稿に適用した（抄録）。", "p5": "24時間を4区間に分けたモデルで、区間ごとの分数階の次数は0.23から0.99に増え、保留した軌跡の64%を平均二乗誤差0.01以内で再構成した（9つの古典的な基準で最良のものは44%）（抄録）。", "fun": "SNSの投稿が広がるとき、反応の増え方は過去にどれだけ反応があったかに引きずられます。この研究は、その引きずられ方の強さを示す数を学習で求め、投稿の直後と時間がたった後で記憶の効き方が大きく変わることを見つけました。拡散の勢いを、意味の読み取れる式の形で取り出した点が面白いところです。", "unverified": "投稿の選び方と分野の偏り、ほかのSNSへの一般化は抄録では未確認。"}}, {"id": "pr38", "rank": 38, "headline": "超複素数の表現で情報カスケードの拡散を予測", "title": "CasHyper: Modeling Multi-Factor Interactions and Asymmetric Influence in Cascade Prediction via Hypercomplex Algebra", "url": "https://arxiv.org/abs/2611.07585", "authors": "Yansong Wang ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Wang, Y., Chai, Q., Huang, J., & Jia, T. (2026). CasHyper: Modeling Multi-Factor Interactions and Asymmetric Influence in Cascade Prediction via Hypercomplex Algebra (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07585", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "情報の拡散（カスケード）に次に誰が参加するかを、利用者と拡散の埋め込みを超複素数で表して利用者間の非対称な影響を学習し、予測する枠組みCasHyperを提案した（抄録）。", "p3": "埋め込みを複数の超複素数の成分に分けて別々の潜在要因を表し、非可換な積で順序に依存する相互作用を表す。静的な異種グラフ、ニューラルODEによる動的な経路、超複素数のTransformerを組み合わせた（抄録）。", "p5": "4つの実データで比較手法と同等以上の性能を示し、Hits@50でAndroidのデータで最大43.24%、Christianityのデータで18.43%の相対改善を得た（抄録）。", "fun": "うわさや投稿が人から人へ広がるとき、「AさんがBさんに与える影響」と「BさんがAさんに与える影響」は同じとは限りません。この研究は、掛ける順番で答えが変わる「超複素数」という数を使って、この向きのある影響を表しました。高校で習う複素数をさらに広げた数学がSNSの分析に役立つ点が面白いところです。", "unverified": "データセットの規模と、比較手法との差の統計的な確かさは抄録では未確認。"}}, {"id": "pr39", "rank": 39, "headline": "LLM審査員は再現性が高くても妥当とは限らない", "title": "Reliability without Validity: A Systematic, Large-Scale Evaluation of LLM-as-a-Judge Models Across Agreement, Consistency, and Bias", "url": "https://doi.org/10.5281/zenodo.23988546", "authors": "Norman ほか", "venue": "Zenodo", "date": "2026-11-05", "apa": "Norman, J., Rivera, M., & Hughes, A. (2026). Reliability without Validity: A Systematic, Large-Scale Evaluation of LLM-as-a-Judge Models Across Agreement, Consistency, and Bias. Zenodo. https://doi.org/10.5281/ZENODO.23988546", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された文書の抄録を使用（審査のない置き場）", "preprint": true, "short": true, "p1": "21のLLM評価者を約541,000件の判定で比べ、一致率が高くても偶然を補正すると識別力は大きく下がり、再現性が高くても位置の偏りが強い場合があることを示した（抄録）。", "p3": "9社の21の審査員を、MT-Bench、JudgeBench、RewardBenchで、一致・一貫性・偏りの監査の3手順により、118回の実行で評価した（抄録）。", "p5": "完全一致率とコーエンのκの差はMT-Benchで33〜41ポイントあり、審査員の順位はベンチマーク間で最大14位動いた。2つの実運用の審査員では再試験の信頼性（0.95超）と強い位置の偏り（0.10超）が共存した（抄録）。", "fun": "AIに採点させるとき「人と答えが一致した割合」で良し悪しを測ることが多いのですが、そこには偶然の一致も含まれます。この研究は、偶然を差し引くと採点の実力が大きく目減りすることや、何度採点しても同じ点を付ける安定したAIでも、選択肢の並び順に強く左右される場合があることを示しました。「安定」と「正しさ」は別物だという点が面白いところです。", "unverified": "撤回されたarXiv版の訂正版とされ、訂正の内容は抄録では未確認。"}}, {"id": "pr40", "rank": 40, "headline": "相互作用するLLM群の集団の偏りを平均場で記述", "title": "Stochastic Dynamics of Generative AI: From Autoregressive Models to Interacting LLM Networks and Neural SDEs", "url": "https://arxiv.org/abs/2611.07065", "authors": "Vikram Krishnamurthy ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Krishnamurthy, V., Zhang, Y., & Snow, L. (2026). Stochastic Dynamics of Generative AI: From Autoregressive Models to Interacting LLM Networks and Neural SDEs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07065", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "生成AIを確率的な力学系として捉え、LLMの自己回帰的な生成、相互作用するLLMの集団、ニューラル確率微分方程式の3つを一つの見方で整理した（抄録）。", "p3": "LLMを注意機構で依存を持つ高次元の非線形自己回帰モデルとして定式化し、相互作用するLLMのネットワークの振る舞いを平均場の常微分方程式で表し、ニューラルSDEの学習ではラフパスに基づくキュバチャー法を論じた（抄録）。", "p5": "平均場の力学から、優先的選択の出現や、タイプに依存する「ガラスの天井」効果などの持続的な構造の偏りを理解する枠組みを示した（抄録）。数値的な結果は抄録に記載がない。", "fun": "文章を作るAIは、次の単語をさいころを振るように確率で選んでいます。この論文は、そうしたAIが大勢集まって情報をやり取りすると、人気者がますます人気になったり、特定のタイプが上に行けなかったりする偏りが生まれうることを、物理の「平均場」の考え方で説明しようとしています。人間社会とAI社会の偏りが同じ数学で書ける点が面白いところです。", "unverified": "理論の数値的な検証の有無と範囲は抄録では未確認。"}}, {"id": "pr41", "rank": 41, "headline": "固定格子のLESで柔らかい薄肉シェルの流体連成を解く", "title": "An Immersed Boundary, Wall-Modeled Large-Eddy Simulation Approach for Fluid-Structure Interaction of Flexible Thin Shells", "url": "https://doi.org/10.20944/preprints202611.0357.v1", "authors": "Zihan Zhu ほか", "venue": "Preprints.org", "date": "2026-11-06", "apa": "Zhu, Z., & Zhou, C. (2026). An Immersed Boundary, Wall-Modeled Large-Eddy Simulation Approach for Fluid-Structure Interaction of Flexible Thin Shells. https://doi.org/10.20944/preprints202611.0357.v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "柔らかい薄肉シェルと乱流の流体-構造連成を、固定格子の埋め込み境界法、壁モデルつきのラージエディシミュレーション（LES）、大変形のシェル要素の組み合わせで計算する方法を示した（抄録）。", "p3": "鋭い界面の埋め込み境界・壁モデルLESと回転自由度のない大変形シェル要素を結合し、壁の速度境界条件として従来のノイマン条件と、壁面で渦粘性を増やしてせん断応力を課す新しい滑りなし条件を比べた（抄録）。", "p5": "シェルの標準問題、層流中の片持ち梁、乱流中で揺れる逆向きの弾性の旗で検証し、実験の参照データとよく一致した。新しい滑りなし条件の方が参照データに近かった（抄録）。", "fun": "風に揺れる旗のように、流れと物体が互いに押し合いながら動く現象は、計算がとても難しい問題です。この研究は、物体の形に合わせて網目を作り直さずに済む方法で、乱れた流れの中で揺れる薄い板を計算しました。壁際の流れの扱いを少し工夫するだけで実験に近づいた点が面白いところです。", "unverified": "計算コストの比較とレイノルズ数の範囲は抄録では未確認。"}}, {"id": "pr42", "rank": 42, "headline": "3D-CNNでCT画像から粒度分布を直接推定", "title": "AI-Based Particle Size Distribution Prediction from 3D Packed-Particle Tomographic Volumes: A Comparative Study with classical Watershed Segmentation", "url": "https://doi.org/10.21203/rs.3.rs-11634141/v1", "authors": "Ruhi Gupta ほか", "venue": "Research Square (In Review)", "date": "2026-11-06", "apa": "Gupta, R., & Goswami, M. (2026). AI-Based Particle Size Distribution Prediction from 3D Packed-Particle Tomographic Volumes: A Comparative Study with classical Watershed Segmentation. https://doi.org/10.21203/rs.3.rs-11634141/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "小型の3次元CNNで、粒子を切り分けずにCT画像から粒度分布を直接推定できるかを調べ、精度では従来の分水嶺法に及ばないが高速であることを示した（抄録）。", "p3": "粒度分布の正解が分かる多分散の球の充填体積60個（48³ボクセル）を合成し、パラメータ300,900個のCNNと3次元の距離変換・分水嶺法を、未使用の試験データ10個で比べた（抄録）。", "p5": "充填率15〜25%で、分水嶺法の平均のアースムーバー距離は0.0974ボクセル、CNNは0.3428ボクセルで分水嶺法が上回った。処理時間はCNNが1体積1.19ms、分水嶺法が33.71msだったが、計算機が異なり単純には比べられないとしている（抄録）。", "fun": "砂や粉の粒の大きさの分布は、CTで撮った立体画像から粒を一つずつ切り分けて数えるのが普通です。この研究は、AIに切り分けをさせずに分布を直接言い当てさせてみました。結果は昔ながらの方法の方が正確で、AIは速いだけでした。新しい方法が負けた結果も正直に示している点が、かえって面白いところです。", "unverified": "密に詰まった粒状体や実際のCT画像での性能は抄録では未確認。"}}, {"id": "pr43", "rank": 43, "headline": "複数受信機の監視で差動GNSSの完全性を確保", "title": "Fault-Free Protection Levels, Multi-Receiver Monitoring and Galileo Redundancy for GBAS-Type Differential GNSS at a Reference Station with Real Code Faults", "url": "https://doi.org/10.20944/preprints202611.0411.v1", "authors": "Osman Bağcı ほか", "venue": "Preprints.org", "date": "2026-11-06", "apa": "Bağcı, O., Ürgün, S., Fidan, S., & Bora, M. Ö. (2026). Fault-Free Protection Levels, Multi-Receiver Monitoring and Galileo Redundancy for GBAS-Type Differential GNSS at a Reference Station with Real Code Faults. https://doi.org/10.20944/preprints202611.0411.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "イスタンブールの基準局で実際に起きたGPSの符号の跳びを使い、GBAS型の差動GNSSの保護水準、複数受信機の監視、ガリレオ衛星の追加の効果を評価した（抄録）。", "p3": "23.8kmの局の対で60,269の平滑化した試験時刻を使い、ICAOの基準に基づく誤差モデルの保護水準、2〜4台の模擬の基準受信機による監視、ガリレオを加えた場合の衛星配置と故障の除外を調べた（抄録）。", "p5": "標準の誤差モデルでは20時刻で保護水準を超えたが、誤差は10mの警報限界を超えなかった。ガリレオの追加でVDOPの中央値は1.48から1.10に、2つの同時故障の正しい除外は59%から95%に改善した（抄録）。", "fun": "飛行機が衛星の電波を頼りに着陸するとき、電波にまれに混じる狂いを見逃すと大事故につながります。この研究は、実際に観測された狂いを使って、複数の受信機で互いを見張る仕組みや、欧州のガリレオ衛星を加えることがどれだけ安全を高めるかを確かめました。見張りと衛星を増やす効果を実データで数字にした点が面白いところです。", "unverified": "ほかの基準局や条件での再現性は抄録では未確認。"}}, {"id": "pr44", "rank": 44, "headline": "利用者の埋め込みは解釈できる行動モードの重ね合わせ", "title": "User Embeddings are Superpositions of Interpretable Behavioral Modes", "url": "https://arxiv.org/abs/2611.08487", "authors": "Jonathan Kozaczuk ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Kozaczuk, J., Dong, Z., Evirgen, N., Majidi, K., Ng, E. K. H., Porter, C., Zhao, Q., Geng, J., Li, C., & Feng, B. R. (2026). User Embeddings are Superpositions of Interpretable Behavioral Modes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08487", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "推薦などに使う利用者の埋め込みを、解釈できる行動モードの疎な重ね合わせとして捉え、疎な自己符号化器でモードを取り出して自然言語で名前を付ける方法を示した（抄録）。", "p3": "線形の埋め込みでは利用者行動の生成モデルからこの構造が導かれ、深層の表現にも重ね合わせ仮説で近似的に広がると論じ、正解の分かる合成データと2つの実データの埋め込みで検証した（抄録）。", "p5": "合成データでは、疎な自己符号化器が古典的な疎な手法よりモードをよく復元した。付けた自然言語のラベルで、文章で学習していない埋め込みからも顧客層の検索と特徴づけができた（抄録）。", "fun": "ネット通販のおすすめ機能は、一人ひとりの好みを人には意味の読めない数字の並びで表しています。この研究は、その並びがいくつかの分かりやすい行動の傾向の足し合わせとして分解でき、それぞれに言葉で名前を付けられることを示しました。ブラックボックスの中身に名札を付ける発想が面白いところです。", "unverified": "実データでの復元の精度と、取り出したモードの具体例は抄録では未確認。"}}, {"id": "pr45", "rank": 45, "headline": "8つの専門エージェントで論文の査読報告を作る", "title": "PeerLens as a Multi-Agent LLM Reviewer", "url": "https://doi.org/10.21203/rs.3.rs-11323645/v1", "authors": "Emre Dil ほか", "venue": "Research Square (In Review)", "date": "2026-11-06", "apa": "Dil, E., & Zafer, T. (2026). PeerLens as a Multi-Agent LLM Reviewer. https://doi.org/10.21203/rs.3.rs-11323645/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "分類、主張の抽出、次元解析、記号的な検証、新規性の探索、構成の査読、分野の専門家の査読、再現性の査読の8つの専門エージェントで、原稿のPDFから査読報告を作るシステムPeerLensを示した（抄録）。", "p3": "物理・生物・数学・化学の64論文（SciPost、eLife、F1000Research）で評価し、初回の人の査読報告がある51論文で人の査読と比べた（抄録）。", "p5": "人の査読と一致するか、より厳しい判断をし、その違いは統計の前提の破れや次元の誤った指標など具体的な技術的根拠に基づいていた。捏造された引用や作られた技術的な主張は観察されなかった（抄録）。", "fun": "論文の数が増えすぎて、審査をする研究者が足りなくなりつつあります。この研究は、計算の単位がそろっているかを確かめる係や新しさを調べる係など、8つの役割をAIに分けて担当させ、一つの審査報告にまとめました。人の審査より厳しめでも、その理由が具体的だったという点が面白いところです。", "unverified": "一致・不一致の件数の内訳と、厳しい判断が妥当だったかの第三者の評価は抄録では未確認。"}}, {"id": "pr46", "rank": 46, "headline": "多エージェントの指揮役を判断の相互作用込みで学習", "title": "Learning Multi-Agent Orchestration:Higher-Order Interactions in Policy Improvement", "url": "https://arxiv.org/abs/2611.07495", "authors": "Kaixuan Liu ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Liu, K., & Xiong, G. (2026). Learning Multi-Agent Orchestration:Higher-Order Interactions in Policy Improvement (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07495", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMの多エージェント系で、エージェントの選択と情報の配分を担う指揮役を学習するとき、判断どうしの相互作用を明示的に扱う方策最適化IAPOを提案した（抄録）。", "p3": "2つの方策の性能差を個々の判断の効果とその相互作用に正確に分解し（相互作用が得られる改善の半分を占めうることを証明）、標本の軌跡から両方を最適化しつつ各更新が改善であることを保証する（抄録）。", "p5": "長い入力版のGSM8K、MATH、DROP、MBPP、HumanEvalで、同じ7Bの実行モデルを使う15の既存システムと比べ、最強のシステムの精度により少ないトークンで達した。相互作用の項を除くとコードの課題で精度が7〜17ポイント下がった（抄録）。", "fun": "チームで仕事をするとき、誰に何を任せるかの判断は、前の判断の結果しだいで良し悪しが変わります。この研究は、AIの指揮役を鍛えるときに、判断を一つずつ別々に評価するのではなく、判断どうしの組み合わせの効果まで数えるようにしました。組み合わせを無視すると成績が大きく落ちた点が面白いところです。", "unverified": "学習に要する計算量と、ほかの実行モデルでの効果は抄録では未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "統計学", "headline": "ベーレンス–フィッシャー区間の保守性を証明", "title": "Validity of the Behrens--Fisher solution", "url": "https://arxiv.org/abs/2611.06987", "authors": "Gunnar Taraldsen", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Taraldsen, G. (2026). Validity of the Behrens--Fisher solution (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.06987", "why": "2つの正規母集団の平均差のフィデューシャル区間が、未知の分散がどんな値でも名目の被覆確率を下回らないことを、k個の平均の線形結合まで含めて証明した。数値計算で知られていた性質に初めて証明を与えた。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、差し込みの不等式と集中の条件§2、主結果§3）を読んだ", "preprint": true, "p1": "2つの正規母集団の平均の差に対するベーレンス–フィッシャーのフィデューシャル区間が、未知の分散がどんな値でも名目以上の被覆確率を持つこと（保守的であること）を証明し、k個の正規平均の線形結合の区間にまで一般化した（抄録、§1）。", "p2": "分散が等しいとは限らない2群の平均差の区間推定で、フィッシャーの区間が頻度論的にも妥当かは、Robinson（1976）の数値計算で保守的と報告されていたが、数学的な証明がなかった（§1）。背景：フィデューシャル推論は、フィッシャーが提案した、データから母数の分布を導く推論の方法。", "p3": "核心は差し込みの不等式（定理1）で、尺度ベクトルの各値で尺度付きのピボットの和を抑える閾値関数は、観測された尺度を差し込んでもその和を抑えることを、位置の誤差が重み付き幾何平均で表した集中の条件を満たすという仮定のもとで示した（§2–3、式1–2）。独立な正規誤差はこの条件を満たす（命題1）。具体例：一般には式(1)から式(2)は導けず、集中の条件がその差し込みを正当化する（§2）。", "p4": "検証は数値実験ではなく証明で、最小の許容閾値の有限性・可測性・正の斉次性（補題1）と、Birnbaumの尖り具合の順序（どちらがより0の近くに集中するか）を道具とした（§2–3）。", "p5": "定理1と命題1から、任意のk個の正規平均の線形結合に対するフィデューシャル区間は、未知の分散のすべての値で名目水準以上の被覆確率を持つ。この場合は計測の不確かさの評価で現れる（抄録、§1）。", "p6": "示されたのは区間が名目以上であること（保守性）で、どれだけ保守的か（区間がどれだけ広すぎるか）は扱っていない。解釈：正規以外の誤差分布で集中の条件がどこまで成り立つかは、この短い論文の範囲では示されていない。", "fun": "少ないデータから「2つのグループの平均の差はこの範囲」と言う方法の一つは、昔から「たぶん正しい」と数値計算で確かめられてきましたが、証明はありませんでした。この論文は、データから計算した値を式に「差し込んでも大丈夫か」という一点を新しい不等式で突破して証明しました。教科書で証明がないとされていた問題に決着をつけた点が面白いところです。", "unverified": "正規以外の誤差分布での集中の条件の成否は未確認。"}}, {"id": "pn02", "rank": 2, "field": "開発経済学", "headline": "規模の経済が強いと水道の接続料はゼロが最適", "title": "Economies of scale and the equity-efficiency trade-off: Evidence from a piped water network in rural Bangladesh", "url": "https://arxiv.org/abs/2611.08031", "authors": "Md. Ahasan Habib ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Habib, M. A., & Tompsett, A. (2026). Economies of scale and the equity-efficiency trade-off: Evidence from a piped water network in rural Bangladesh (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08031", "why": "バングラデシュ農村で新設した水道網への接続の支払意思額を誘因つきで引き出し、事業費の規模の経済と組み合わせて、接続世帯あたりの費用を最小にする価格がゼロになることを示した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（介入§3、データと支払意思額の聞き取り§4–5、費用対効果§6）を読んだ", "preprint": true, "p1": "バングラデシュ農村で自ら敷設した水道網への各戸接続の支払意思額（WTP）を誘因つきで引き出し、事業費の規模の経済と合わせて、接続世帯あたりの費用を最小にする接続料がゼロであること、つまり規模の経済が公平性と効率性のトレードオフを消しうることを示した（抄録、§6）。", "p2": "公共インフラの料金設定では、料金を上げれば収入で費用を賄えるが貧しい人の利用が減るという公平性と効率性のトレードオフが想定されてきた。しかし固定費による規模の経済が大きいインフラ網で、この想定が成り立つかは検証されていなかった（抄録、§1）。", "p3": "2つの集落でBecker–DeGroot–Marschak（BDM）法を使い、8つの「はい・いいえ」の質問で最大の支払額を幅0.42ドルまで絞り込み、ゼロから約107ドルの価格券を封筒から引かせ、券の価格がWTP以下なら接続できる仕組みで正直な回答を促した（§4）。背景：BDM法は、答えた額と無関係にくじで価格を決めることで、本当の支払意思額を答えるのが得になるようにする方法。", "p4": "WTPの分布をワイブル関数で近似した需要曲線と、ボーリング・ポンプ・貯水槽の固定費4,795ドルと1世帯74ドルの可変費から、価格ごとの接続世帯数と、収入を差し引いた接続世帯あたりの費用を計算し、WTPを最大8倍した仮想の需要でも最適価格を求めた（§3、§6）。", "p5": "WTPがゼロの世帯は11%、中央値は約6.3ドル、90パーセンタイルは約21ドルだった（§5）。接続世帯あたり費用を最小にする価格はゼロで、無料の場合の費用は98ドル、世帯ごとにWTPを徴収できても89ドルと9%しか下がらなかった。WTPが3.4倍未満なら最適価格はゼロのままだった（§6、図5–6）。", "p6": "費用の分析は1つの水道網の費用データに基づき、可変費が接続世帯数に比例するという仮定は規模の経済を過小に見積もる可能性があると著者は述べる（§3）。解釈：維持費の負担や水の使用量への料金の効果は、接続料の分析とは別に検討が要る。", "fun": "水道を引く工事では、井戸やポンプやタンクなど最初にかかる費用が大きく、つなぐ家が増えるほど1軒あたりの費用は下がります。この研究はバングラデシュの村で実際に水道を作り、くじを使って各家が本当に払ってもよい額を聞き出しました。その結果、料金を取るより無料にして多くの家をつなぐほうが1軒あたり安くなると分かりました。公平さと効率が両立するという発見が面白いところです。", "unverified": "接続後の水の使用量や健康への効果は確認していない。"}}, {"id": "pn03", "rank": 3, "field": "機械学習", "headline": "同じデータで学習したLMでも破られる脱獄は違う", "title": "Identically Trained Language Models Break on Different Jailbreaks", "url": "https://arxiv.org/abs/2610.34074", "authors": "Chi-Wei Chang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-06", "apa": "Chang, C.-W., Kuo, M.-T., Lee, K.-W., & Tsai, M.-H. (2026). Identically Trained Language Models Break on Different Jailbreaks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34074", "why": "25のデータ配合ごとに事前学習3回・事後学習2回の計150モデルを作り、どの脱獄に弱いかが事前学習の実行ごとに変わることを示して、単一のチェックポイントでの安全性評価の限界を明らかにした。", "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（抄録、設定と評価§2、考察と限界§5）を読んだ", "preprint": true, "p1": "同じデータ・同じ安全性の事後学習で作った言語モデルでも、事前学習の実行（乱数シード）が違うと破られる脱獄プロンプトが大きく異なることを、150モデルで示した（抄録）。", "p2": "脱獄のベンチマークは1つのチェックポイントを試し、どの脱獄に弱いかを事前学習データと安全性の学習の性質とみなしてきたが、同じデータで別に事前学習したモデルも同じ脱獄に弱いのかは調べられていなかった（抄録、§1）。", "p3": "DataDecideの25のデータ配合ごとに1Bの基盤モデルを3つの事前学習シードで用意し、SFTとDPOによる同じ安全性の事後学習を2つのシードで行って150モデルを作った。共通の脱獄プロンプトに各モデルから20回ずつ応答を集め、WildGuardの拒否判定でプロンプトごとの非拒否率を求め、モデルの対ごとに相関をとった（抄録、§2）。", "p4": "比べたのは、同じ基盤モデルで事後学習だけが違う対、同じ配合で事前学習の実行が違う対、配合が違う対の3種類で、150Mと300Mの規模でも確かめ、第2の判定器と人の判定とも照合した（§2–3）。", "p5": "プロンプトごとの非拒否率の相関は、同じ事前学習の実行の2つの事後学習のコピーで0.984、事前学習のシードが違うと0.811、配合が違うと0.779だった（抄録）。91の攻撃テンプレートで、あるチェックポイントの最良のものが新しい事前学習シードでも最良にとどまったのは27%の対だけ（事後学習シードでは67%）で、3,211プロンプトの非拒否率で75の事前学習の実行を毎回特定できた（抄録）。", "p6": "1つのモデルで2つの配合を比べると平均の脆弱性の順位が23.4%で逆転し、著者は事前学習データの比較も脱獄の評価も複数の実行で行うべきだとする（§5）。解釈：1B以下の小さなモデルでの結果で、大規模なモデルで差がどの程度かは分からない。", "fun": "同じ教科書で、同じ先生から同じ注意を受けて育った双子でも、引っかかるだましの手口は違うかもしれません。この研究はAIで同じことを確かめ、同じデータと同じ安全の教育で作ったAIでも、最初の学習のちょっとした偶然の違いで、破られる「悪い頼み方」が大きく変わることを示しました。1つのAIを試しただけで安全性を語れないという点が面白いところです。", "unverified": "1Bより大きなモデルでの差の大きさは未確認。"}}, {"id": "pn04", "rank": 4, "field": "因果推論", "headline": "潜在結果の同時期待値を識別し鋭い限界を導く", "title": "Identification and Bounding of Joint Expectation over Potential Outcomes", "url": "https://arxiv.org/abs/2611.07536", "authors": "Yuta Kawakami ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Kawakami, Y., & Tian, J. (2026). Identification and Bounding of Joint Expectation over Potential Outcomes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07536", "why": "処置あり・なしの潜在結果の関数の同時期待値について、共単調性・反共単調性による新しい識別条件と、仮定のない場合の鋭い限界を導き、個人の因果効果のばらつきの評価を可能にした。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（同時期待値の定義§3、識別§4、限界§5の見出し、実験§7、結論§8と表のキャプション）を読んだ", "preprint": true, "p1": "処置あり・なしの潜在結果(Y1,Y0)の関数の同時期待値について、共単調性・反共単調性という新しい識別の仮定を示し、仮定のない場合には2つの関数のクラスで鋭い限界を導いて、個人の因果効果の分散・歪度・尖度などを評価
