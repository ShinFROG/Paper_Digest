0Hz以下のエネルギーが弱まった。著者はこれを、大きな粒子の堆積と土砂濃度の変化、つまり土石流から高濃度流への遷移と解釈した（抄録）。", "p6": "信号の周波数は粒径や土砂濃度などに依存し、土石流の物理モデルの前提を複雑にすると著者は述べる（抄録）。解釈：遷移の判定は地震の信号からの解釈で、流れの濃度の直接の計測との照合の有無は抄録からは分からない。", "fun": "山の氷河の水が一気にあふれると、土砂を含んだ流れが谷を駆け下ります。この研究は、谷に沿って並べた地震計で、その流れが途中で大きな石を落としながら性質を変えていく様子を、揺れの変化として捉えました。揺れが高い音のような細かい振動に変わることで、流れの中身の変化が分かるという点が面白いところです。", "unverified": "抄録のみ読んだ。地震計の台数と、流れの濃度の直接の計測との照合の有無は未確認。"}}, {"id": "jr16", "rank": 16, "headline": "移住者の不動産投資がパキスタンの都市を広げる", "title": "EMIGRE CITY ‐ MAKING : The Micropolitics of Diasporic Real Estate Investment and Urban Growth in Pakistan", "url": "https://doi.org/10.1111/1468-2427.70156", "authors": "Fatima Tassadiq", "venue": "International Journal of Urban and Regional Research", "date": "2026-11-06", "sjr": 1.104, "citescore": 4.7, "citescore_year": "2025", "apa": "Tassadiq, F. (2026). EMIGRE CITY ‐ MAKING : The Micropolitics of Diasporic Real Estate Investment and Urban Growth in Pakistan. International Journal of Urban and Regional Research. https://doi.org/10.1111/1468-2427.70156", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "International Journal of Urban and Regional Researchの抄録を使用", "preprint": false, "short": true, "p1": "パキスタンの事例から、海外移住したエリート層の送金が、帰国用の家づくりから都市の不動産への投機的な投資に向かい、都市化と土地の金融化を生む過程（移住者による都市づくり）を描いた（抄録）。", "p3": "移住の経路と送金の実践が出身国の都市景観をどう変えるかを、不動産部門の新自由主義化と移住者の投資行動の変化の重なりから分析した（抄録）。調査の手法の詳細は抄録に記載がない。", "p5": "投資の多くは予約販売の段階で行われ、北大西洋諸国への定住を支える多拠点の戦略の一部であり、軍とその関係者が主導する開発で空き地の市場をつくり、低密度の郊外のゲーテッド・コミュニティによる都市化を進めていた（抄録）。", "fun": "外国で働く人が故郷に送るお金は、昔は「いつか帰る家」を建てるために使われていました。ところがパキスタンでは、そのお金が値上がりを狙った土地の購入に回り、人の住まない区画が郊外に広がっています。遠く離れた国からの送金が故郷の街の形を変えていく仕組みが見える点が面白いところです。", "unverified": "調査の方法とデータ（聞き取りの規模など）は抄録では未確認。"}}, {"id": "jr17", "rank": 17, "headline": "中年期の低資産による抑うつの不利は米国で最大", "title": "Psychological costs of low wealth in midlife: Lower socioeconomic status carries greater disadvantage for depressive symptoms in the United States than Europe and China", "url": "https://doi.org/10.1093/geronb/gbag215", "authors": "Jonathan L Chia ほか", "venue": "Journals of Gerontology - Series B Psychological Sciences and Social Sciences", "date": "2026-11-05", "sjr": 1.503, "citescore": 6.8, "citescore_year": "2025", "apa": "Chia, J. L., Infurna, F. J., Wettstein, M., Dey, N. E. Y., Cruz-Carrillo, Y., Grimm, K. J., Lachman, M. E., & Gerstorf, D. (2026). Psychological costs of low wealth in midlife: Lower socioeconomic status carries greater disadvantage for depressive symptoms in the United States than Europe and China. The Journals of Gerontology, Series B: Psychological Sciences and Social Sciences. https://doi.org/10.1093/geronb/gbag215", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Journals of Gerontology Series Bの抄録を使用", "preprint": false, "short": true, "p1": "16か国の調和した縦断データ（1992〜2022年）で、中年期（45〜65歳）の抑うつ症状の軌跡を資産の4階層で比べ、低資産の不利が米国で最も大きいことを示した（抄録）。", "p3": "米国、欧州各国、イスラエル、韓国、中国の16か国のデータで、資産の百分位による4階層（下位15%、16〜45%、46〜75%、76〜100%）ごとに抑うつ症状の軌跡をモデル化した（抄録）。", "p5": "米国の中年は多くの国より抑うつ症状が高く、その差は低い社会経済的地位の層で最も大きかった。多くの国で後の世代ほど症状が多く、上位中間層で増加が最大だった。低い層ほど軌跡のばらつきが大きかった（抄録）。", "fun": "お金が少ないと心の健康が損なわれやすいことは知られていますが、その影響の大きさは国によって違いました。16か国の1992〜2022年のデータから、同じ「低資産」でも米国では抑うつの不利が特に大きいことが分かりました。個人の努力だけでなく社会の仕組みが心の健康の格差を左右していることが見える点が面白いところです。", "unverified": "国ごとの差の具体的な大きさは抄録では未確認。"}}, {"id": "jr18", "rank": 18, "headline": "AI変革期の組織学習は革新を促し燃え尽きを減らす", "title": "Fueling innovation and mitigating burnout: the dual impact of organizational learning in AI-enabled change", "url": "https://doi.org/10.1108/jocm-05-2026-0509", "authors": "Yue Yang ほか", "venue": "Journal of Organizational Change Management", "date": "2026-11-05", "citescore": 7.4, "citescore_year": "2025", "apa": "Yang, Y., Xi, G., Zhang, L., Lu, Q., & Wang, B. (2026). Fueling innovation and mitigating burnout: the dual impact of organizational learning in AI-enabled change. Journal of Organizational Change Management, 1–27. https://doi.org/10.1108/jocm-05-2026-0509", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Journal of Organizational Change Managementの抄録（OpenAlex経由）を使用", "preprint": false, "short": true, "p1": "AIによる職場の変化の中で、組織学習が従業員の革新的行動を、吸収能力を高める経路と燃え尽きを減らす経路の2つで支えることを示した（抄録）。", "p3": "資源保存理論と社会的交換理論に基づく二重経路の調整媒介モデルを、AIに関わる変化を経験する中国企業の従業員373人の2時点の調査で、ブートストラップによる条件付き間接効果などで検証した（抄録）。", "p5": "組織学習は吸収能力の向上と燃え尽きの低下を通じて革新的行動を促し、知識共有と従業員とAIの協働がこれらの経路を強めた。AIとの協働は、燃え尽きが革新的行動を下げる関係も和らげた（抄録）。", "fun": "職場にAIが入ってくると、新しいことを学ぶ機会が増える一方で、ついていけずに疲れ切ってしまう人も出てきます。この研究は、会社ぐるみで学ぶ仕組みがあると、知識が増える道と疲れが減る道の両方から社員の工夫を引き出せることを示しました。学びが意欲と心の余裕の両方に効くという点が面白いところです。", "unverified": "効果の大きさの数値は抄録では未確認。"}}, {"id": "jr19", "rank": 19, "headline": "ESG評価が高い企業ほど監査報酬は低い", "title": "ESG Performance and Audit Quality: Bidirectional Relationship and the Moderator Role of Gender Diversity in an International Context", "url": "https://doi.org/10.1002/csr.71150", "authors": "Azhaar Lajmi ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-11-06", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "Lajmi, A., Gana, M. R., & Kacem, G. (2026). ESG Performance and Audit Quality: Bidirectional Relationship and the Moderator Role of Gender Diversity in an International Context. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71150", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Corporate Social Responsibility and Environmental Managementの抄録を使用", "preprint": false, "short": true, "p1": "国際的な3,630企業年のデータで、ESG評価と監査品質（監査報酬・監査意見）の双方向の関係と、取締役会の女性比率の調整効果を推定した（抄録）。", "p3": "2017〜2022年の国際的な標本でシステムGMMと一般化構造方程式モデルを推定し、監査品質を監査報酬と監査意見で測った（抄録）。", "p5": "ESG評価は監査報酬と負に関連し、逆向きの関係は有意でなかった。監査意見との関係は全体では見られず、低ESG企業で正、高ESG企業で負だった。女性比率が高いほど監査報酬との負の関連は弱まった（抄録）。", "fun": "環境や社会への配慮で評価の高い会社は、会計の監査でも「手のかからない会社」と見なされるのでしょうか。この研究は、ESGの評価が高いほど監査の報酬が低い傾向を見つけました。さらに、取締役に女性が多いとその傾向が弱まるという意外な結果も出ています。お金以外の評判が監査の費用に表れる点が面白いところです。", "unverified": "効果の大きさと対象国の内訳は抄録では未確認。"}}, {"id": "jr20", "rank": 20, "headline": "旅行推薦AIの透明性が信頼と受容を最も高める", "title": "Disentangling fairness, accountability and transparency in AI travel recommendations: the role of algorithm trust across hedonic and utilitarian contexts", "url": "https://doi.org/10.1108/jhtt-04-2026-0462", "authors": "Jung-Eun Bae ほか", "venue": "Journal of Hospitality and Tourism Technology", "date": "2026-11-06", "sjr": 1.785, "citescore": 13.8, "citescore_year": "2025", "apa": "Bae, J.-E., & Shin, J. (2026). Disentangling fairness, accountability and transparency in AI travel recommendations: the role of algorithm trust across hedonic and utilitarian contexts. Journal of Hospitality and Tourism Technology, 1–20. https://doi.org/10.1108/jhtt-04-2026-0462", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Journal of Hospitality and Tourism Technologyの抄録を使用", "preprint": false, "short": true, "p1": "旅行の推薦AIについて、公正・説明責任・透明性（FAT）の知覚がアルゴリズムへの信頼と推薦の受容・抵抗にどう効くかを示し、透明性の効果が最も大きいことを明らかにした（抄録）。", "p3": "旅行関連のオンライン・コミュニティで集めた韓国の成人355人のシナリオ型の調査を、構造方程式モデルと、快楽的・実用的な旅行商品の多母集団分析で検証した（抄録）。", "p5": "FATの3次元はいずれも信頼を高め、透明性、説明責任、公正の順に効果が大きかった。信頼は受容を高め抵抗を下げた。説明責任は実用的な条件でのみ信頼に効いた（抄録）。", "fun": "旅行サイトのAIが「このホテルがおすすめ」と言うとき、理由が分からないと私たちは不安になります。この研究は、AIの公正さ・責任の所在・透明さのうち、信頼を最も高めるのは「なぜ勧めたかが見えること」だと示しました。利用者は公正さを自分では確かめられないので外部の点検が必要だ、という指摘も面白いところです。", "unverified": "自己申告の横断データで、因果関係は確かめられないと著者が記載（抄録）。"}}, {"id": "jr21", "rank": 21, "headline": "若いサービス労働者は向上心に罪悪感を抱く", "title": "Inside the service work ecosystem: a lived account of young workers", "url": "https://doi.org/10.1108/josm-08-2025-0374", "authors": "Maria Golubovskaya ほか", "venue": "Journal of Service Management", "date": "2026-11-06", "sjr": 3.759, "citescore": 24.1, "citescore_year": "2025", "apa": "Golubovskaya, M., Sakdiyakorn, M., Solnet, D., & Wattanacharoensil, W. (2026). Inside the service work ecosystem: a lived account of young workers. Journal of Service Management, 1–24. https://doi.org/10.1108/josm-08-2025-0374", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Journal of Service Managementの抄録を使用", "preprint": false, "short": true, "p1": "タイ・ミャンマー・カンボジア・ラオス出身の若い現場のサービス労働者の視点から、サービス労働の生態系が機会ではなく制約の場として経験されていることを示した（抄録）。", "p3": "18〜26歳の80人によるレゴ・シリアスプレイの5回のワークショップで得た視覚・語り・観察のデータを、働くことの心理学理論（PWT）を手がかりに反復的に分析した（抄録）。", "p5": "生存・社会的つながり・自己決定の欲求は、マクロの力、組織の慣行、人間関係を通じて持続的に損なわれていた。自己決定を求めることには「向上心への罪悪感」という代償があり、それを切り抜けること自体が見えない無償の労働になっていた（抄録）。", "fun": "お店やホテルで働く若者にとって、仕事は上を目指す階段のはずです。ところがこの研究で、東南アジアの若い働き手たちはレゴで自分の職場を形にしながら、上を目指すことに罪悪感を抱いていると語りました。笑顔の接客の裏で、目に見えない気苦労が品質の土台を削っているという指摘が興味深いところです。", "unverified": "国や業種による違いの分析の有無は抄録では未確認。"}}, {"id": "jr22", "rank": 22, "headline": "配偶者と同居する高齢者が最もよく老いる", "title": "Marital Status, Living Arrangement, and Aging Well in China", "url": "https://doi.org/10.1177/08982643261502737", "authors": "Linghan Ge ほか", "venue": "Journal of Aging and Health", "date": "2026-11-06", "sjr": 1.146, "citescore": 5.4, "citescore_year": "2025", "apa": "Ge, L., Wen, M., Ren, Q., & Lou, V. W. (2026). Marital Status, Living Arrangement, and Aging Well in China. Journal of Aging and Health. https://doi.org/10.1177/08982643261502737", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Journal of Aging and Healthの抄録を使用", "preprint": false, "short": true, "p1": "中国の50歳以上で、婚姻状態と居住形態の5類型ごとに多次元の「よい老い」の指標を比べ、配偶者と同居する人が最もよく、独居の未婚者が最も不利という序列を示した（抄録）。", "p3": "中国家族パネル調査（CFPS）で、生理・機能・認知・心理・主観の5次元からなる指標を作り、婚姻と居住の5類型と社会人口学的な要因による違いを分析した（抄録）。", "p5": "配偶者と同居する既婚者が最もよく、独居の未婚者が最も困難で、別居の既婚者など非伝統的な形態でも特に主観的な幸福で困難が見られた。差は75歳以上、退職者、都市住民、健康的な生活習慣の人で小さかった（抄録）。", "fun": "年を取ってからの暮らしやすさは、結婚しているかだけでなく、誰と住んでいるかでも変わります。中国の大規模な調査から、夫婦で同居する人が最も健やかに老い、結婚していても離れて住む人は心の満足度で苦労していることが分かりました。家族の形の多様化が高齢期の幸福に影響する点が興味深いところです。", "unverified": "各類型の差の大きさと因果の向きは抄録では未確認。"}}, {"id": "jr23", "rank": 23, "headline": "ワンストップの便利さは高価格でも全員を得にしうる", "title": "Channel Structure and Consumer Search: Competition Between Store and National Brands", "url": "https://doi.org/10.1002/nav.70109", "authors": "Weiqian Lu ほか", "venue": "Naval Research Logistics", "date": "2026-11-06", "sjr": 1.204, "citescore": 4.5, "citescore_year": "2025", "apa": "Lu, W., Liu, L., & Fan, X. (2026). Channel Structure and Consumer Search: Competition Between Store and National Brands. Naval Research Logistics (NRL). https://doi.org/10.1002/nav.70109", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Naval Research Logisticsの抄録を使用", "preprint": false, "short": true, "p1": "小売業者が自社ブランドで全国ブランドと競いながらも同じ売り場に置き続ける理由を、消費者の探索とワンストップの買い物の便利さから説明する探索モデルを示した（抄録）。", "p3": "別々に売る形式を基準に、卸売形式と代理販売形式が価格競争と消費者の探索をどう変えるかを、自社ブランドの持ち主を兼ねる小売業者と全国ブランドの持ち主の競争として分析した（抄録）。", "p5": "卸売・代理販売の形式は価格競争を和らげて価格を上げた。探索コストが一定以上だと、高い価格と高い消費者余剰が共存し、両ブランドの利益、消費者余剰、社会的厚生がそろって改善した（抄録）。", "fun": "スーパーは利益の大きい自社ブランドだけを並べればよさそうなのに、なぜ有名メーカーの商品も置くのでしょう。この研究は、一か所で何でもそろう便利さが客を呼ぶので、値段が少し高くなっても、客も店もメーカーも皆が得をする場合があることを示しました。高い値段なのに客も得をするという逆説が面白いところです。", "unverified": "実データでの検証は抄録では未確認（理論モデル）。"}}, {"id": "jr24", "rank": 24, "headline": "利他的な動機が満たされるボランティアほど幸福", "title": "Volunteer Motivation Fulfillment and Well-Being", "url": "https://doi.org/10.1177/08997640261495463", "authors": "Arthur A. Stukas ほか", "venue": "Nonprofit and Voluntary Sector Quarterly", "date": "2026-11-06", "sjr": 1.285, "citescore": 6.9, "citescore_year": "2025", "apa": "Stukas, A. A., Marques, M. D., Snyder, M., & Clary, E. G. (2026). Volunteer Motivation Fulfillment and Well-Being. Nonprofit and Voluntary Sector Quarterly. https://doi.org/10.1177/08997640261495463", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Nonprofit and Voluntary Sector Quarterlyの抄録を使用", "preprint": false, "short": true, "p1": "ボランティアにとって重要な利他的な動機が満たされるほど、のちの幸福が高いことを、2時点の調査で示した（抄録）。", "p3": "英語圏のProlificに登録する現役ボランティア406人に3か月の間隔で調査し、1回目に動機・性格・4種類の幸福を、2回目に動機の充足と幸福を測った（抄録）。", "p5": "重要な他者志向の動機の充足は、自己志向の動機の充足より2回目の幸福と強く正に関連し、性格とおおむね1回目の幸福を統制しても結果は残った（抄録）。", "fun": "ボランティアをする人は幸せそうに見えますが、それが「活動したから」なのか「もともと幸せな人が活動するから」なのかは分かりにくい問題です。この研究は、3か月の間をあけた調査で、人の役に立ちたいという思いが満たされた人ほど、後で幸福度が高いことを示しました。人のための思いが報われることが幸せにつながる点が面白いところです。", "unverified": "効果の大きさと、4種類の幸福ごとの違いは抄録では未確認。"}}, {"id": "jr25", "rank": 25, "headline": "成果報告の監査義務化で慈善団体は数値に偏った", "title": "Mandatory Service Performance Reporting and Audit: Responses from Charities", "url": "https://doi.org/10.1177/08997640261495473", "authors": "Cherrie Yang ほか", "venue": "Nonprofit and Voluntary Sector Quarterly", "date": "2026-11-06", "sjr": 1.285, "citescore": 6.9, "citescore_year": "2025", "apa": "Yang, C., & Xu, G. (2026). Mandatory Service Performance Reporting and Audit: Responses from Charities. Nonprofit and Voluntary Sector Quarterly. https://doi.org/10.1177/08997640261495473", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Nonprofit and Voluntary Sector Quarterlyの抄録を使用", "preprint": false, "short": true, "p1": "ニュージーランドの大規模な慈善団体で、サービスの成果の報告と外部監査が義務化されたときの対応を分析し、形式上の遵守は進んだが、監査済みの報告は検証しやすい数値の産出に偏ったことを示した（抄録）。", "p3": "大規模慈善団体の報告書120件の文書分析と、作成者・監査人への面接を、脱連結（デカップリング）理論で分析した（抄録）。", "p5": "監査済みの報告は検証可能な量的な産出が中心で、質的な成果・影響の情報は少なかった。監査は報告の手順を強めたが、量的情報への依存を促して質的情報を任意の報告に移し、手段と目的の緊張を生んだ（抄録）。", "fun": "寄付で動く団体に「成果を報告し、監査も受けなさい」と義務づけると、報告はきちんとなりそうです。ところがこの研究では、監査で確かめやすい「何人に配ったか」のような数字ばかりが並び、「暮らしがどう変わったか」という大事な話は脇に追いやられました。測りやすいものが重視されてしまう落とし穴が見える点が面白いところです。", "unverified": "団体の規模や分野による違いは抄録では未確認。"}}, {"id": "jr26", "rank": 26, "headline": "微視の不均質をベイズ更新で巨視の破壊に橋渡し", "title": "Stochastics upscaling in multiscale mechanics and reduced model for fracture", "url": "https://doi.org/10.46223/hcmcoujs.acs.en.16.2.91.2026", "authors": "Adnan Ibrahimbegovic", "venue": "HCMCOU Journal of Science - Advances in Computational Structures", "date": "2026-11-06", "apa": "Ibrahimbegovic, A. (2026). Stochastics upscaling in multiscale mechanics and reduced model for fracture. HCMCOU Journal of Science - Advances in Computational Structures, 16(2). https://doi.org/10.46223/hcmcoujs.acs.en.16.2.91.2026", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "HCMCOU Journal of Scienceの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "微視的な材料の不均質の不確実性を巨視の破壊挙動に引き継ぐ「確率的アップスケーリング」の枠組みを示し、コンクリートで弾性と破壊のパラメータの事後分布の違いを明らかにした（抄録）。", "p3": "力学系のパラメータを確率変数や空間的に変わる確率場で表し、ベイズ更新で巨視のパラメータを推定し、ガウス–マルコフ–カルマンフィルタとマルコフ連鎖モンテカルロ法を比べた（抄録）。", "p5": "弾性パラメータの事後分布は均質化と整合するガウス分布だったが、非弾性のパラメータではガウス分布でなくなった。カルマン型のフィルタはMCMCと同等の推定をはるかに低い計算コストで与え、破壊パラメータでは微視の空間変動が巨視でも非正規の事後分布として残った（抄録）。", "fun": "コンクリートの中には小さな石や空洞がばらばらに混じっていて、同じように作っても割れ方は一つひとつ違います。この研究は、その小さなばらつきが大きな部材の割れやすさにどう受け継がれるかを、確率の計算で追いかけました。平均だけ見ていると消えてしまうばらつきの形が、割れ方では残り続けることを示した点が面白いところです。", "unverified": "計算コストの具体的な比較値と、検証に使った実験は抄録では未確認。"}}, {"id": "jr27", "rank": 27, "headline": "指定自転車ルートは致死率の高い幹線道路に偏る", "title": "Data-Driven Safety Screening for Smart-City Urban Bicycle-Route Networks", "url": "https://doi.org/10.3390/smartcities9110190", "authors": "Deo Chimba ほか", "venue": "Smart Cities", "date": "2026-11-06", "sjr": 1.193, "citescore": 13.0, "citescore_year": "2025", "apa": "Chimba, D., Sharma, R., Ismael, I., Shrestha, S., & Jones, J. (2026). Data-Driven Safety Screening for Smart-City Urban Bicycle-Route Networks. Smart Cities, 9(11), 190. https://doi.org/10.3390/smartcities9110190", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Smart Citiesの抄録を使用", "preprint": false, "short": true, "p1": "テネシー州の自転車事故6,930件を道路台帳と結合し、指定された自転車ルートで死亡事故の割合が高いのは、指定された道路が速く広い幹線道路であることによる条件付きの関連だと示した（抄録）。", "p3": "州の事故記録（2002〜2026年）と線形参照の道路台帳を結合し、郡でクラスタ化したロジットモデル、ゼロ切断負の二項モデル、経験ベイズの路線指標で分析した（抄録）。", "p5": "指定は死亡のオッズの高さと関連した（OR=1.697、95%CI 1.15–2.50）が、事故頻度とは有意に関連せず、交通量当たりの率は低かった。路線指標は、その後の死亡・重傷事故の37.6%を延長の10%以内でとらえた（抄録）。", "fun": "道路に「自転車ルート」の標識を立てても、車が速く走る大通りのままでは安全とは限りません。この研究は事故の記録と道路の台帳を突き合わせ、指定ルートで死亡事故の割合が高いのは、指定された道そのものが速くて広い幹線道路だからだと示しました。標識より道の作り方が大事だということをデータで示した点が面白いところです。", "unverified": "速度管理や分離の具体的な効果は抄録では未確認（提案にとどまる）。"}}, {"id": "jr28", "rank": 28, "headline": "ナイロビ近郊の小農は高騰した先祖の土地を売る", "title": "NEGATIVE ASSETS : Settler Colonialism, Speculative Urbanism, and the Moral Economy of Smallholding on Nairobi's Real Estate Frontier", "url": "https://doi.org/10.1111/1468-2427.70154", "authors": "Peter Lockwood ほか", "venue": "International Journal of Urban and Regional Research", "date": "2026-11-06", "sjr": 1.104, "citescore": 4.7, "citescore_year": "2025", "apa": "Lockwood, P., Ouma, S., & Gillespie, T. (2026). NEGATIVE ASSETS : Settler Colonialism, Speculative Urbanism, and the Moral Economy of Smallholding on Nairobi’s Real Estate Frontier. International Journal of Urban and Regional Research. https://doi.org/10.1111/1468-2427.70154", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "International Journal of Urban and Regional Researchの抄録を使用", "preprint": false, "short": true, "p1": "ナイロビ近郊で地価が急騰するなか、多くの小農の家族が都市の地主になる道を選ばず、禁忌に反して先祖伝来の土地を売っている理由を、入植者植民地主義の歴史から民族誌的に説明した（抄録）。", "p3": "土地の売却の民族誌的な事例をもとに、植民地期の土地改革が長期の商業的農業に向かない「負の資産」としての土地を持つ小農層を生んだ歴史と、不動産の最前線の到来を結び付けて分析した（抄録）。", "p5": "地価の上昇で土地の商品化はほぼ完了に近づき、わずかな区画は保持されずに売られていた。植民地期の土地改革と不動産の最前線の組み合わせが小農の道徳経済を崩し、先祖の土地を市場に押し出していると論じた（抄録）。", "fun": "土地の値段が急に上がったら、持ち続けて家賃収入を得るのが得に思えます。ところがナイロビ近郊の農家の多くは、売ってはいけないとされる先祖の土地を手放していました。この研究はその理由を植民地時代の土地改革にさかのぼり、もともと暮らしを支えるには小さすぎる「負の資産」だったからだと説明しました。歴史が今の選択を縛る様子が面白いところです。", "unverified": "売却の件数や価格のデータは抄録では未確認。"}}, {"id": "jr29", "rank": 29, "headline": "コンパクトな都市ほど工業の炭素排出が少ない", "title": "Carbon Emissions within Compact Cities: Evidence from China’s Urban Forms", "url": "https://doi.org/10.1061/jupddm.upeng-6850", "authors": "Qihang Li ほか", "venue": "Journal of Urban Planning and Development", "date": "2026-11-06", "citescore": 3.9, "citescore_year": "2025", "apa": "Li, Q., Zheng, L., & Zhang, H. (2027). Carbon Emissions within Compact Cities: Evidence from China’s Urban Forms. Journal of Urban Planning and Development, 153(1). https://doi.org/10.1061/jupddm.upeng-6850", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Journal of Urban Planning and Developmentの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "中国の都市（2008〜2016年）で、空間の幾何に基づくコンパクトさの新しい指標を作り、都市がコンパクトなほど企業の工業炭素排出が少ないという因果効果を推定した（抄録）。", "p3": "ミクロの税務調査データと夜間光の画像を使い、都市形態のコンパクトさが企業単位のCO2排出に与える効果を分析し、産業集積・グリーン技術の普及・資源配分の3つの経路を調べた（抄録）。", "p5": "コンパクトさは工業の炭素排出を有意に減らし、産業集積、低炭素技術の普及、効率的な企業への生産要素の配分がその経路だった。デジタル基盤、ハイテク産業団地、スマートシティ政策が削減効果を強めた（抄録）。", "fun": "街がぎゅっとまとまっていると、移動の距離が短くなるだけでなく、工場どうしが資源を分け合ったり、新しい省エネ技術が広まりやすくなったりします。この研究は中国の税務データと夜の明かりの衛星画像を使い、コンパクトな街ほど工場の二酸化炭素の排出が少ないことを示しました。街の形と環境の関係を企業ごとのデータで確かめた点が面白いところです。", "unverified": "効果の大きさの数値と、因果を識別する方法の詳細は抄録では未確認。"}}, {"id": "jr30", "rank": 30, "headline": "北京は成長の制限を統治の手段にした", "title": "Limits on growth: Governing urban futures in Beijing", "url": "https://doi.org/10.1177/00420980261501380", "authors": "Yiqiu Liu", "venue": "Urban Studies", "date": "2026-11-06", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "apa": "Liu, Y. (2026). Limits on growth: Governing urban futures in Beijing. Urban Studies. https://doi.org/10.1177/00420980261501380", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Urban Studiesの抄録を使用", "preprint": false, "short": true, "p1": "北京の2016〜2035年のマスタープランが、非本質的とされた機能と人口を取り除いて国家のための選別的な首都をつくる「成長の制限」を、中国の新しい統治の様式として理論化した（抄録）。", "p3": "1949年以降の計画文書の資料分析、専門家と民族誌的な面接、2017〜2023年の多地点の現地調査をもとに、ルフェーヴル的な時空間の枠組みで分析した（抄録）。", "p5": "歴史的な反大都市の志向が国家の再集権化の中で呼び起こされ、「大都市病」という診断が移転と緑化を治療として正当化し、官僚・村民・移民は先延ばし・投機・撤退で対応していた。成長の制限を、誰が残ることを許されるかを決める政治として捉え直した（抄録）。", "fun": "都市計画といえば、普通は街をどう大きくするかを考えます。ところが北京の計画は、人や機能を減らして首都を「選び抜く」ことを目指していました。この研究は、混雑を「病気」と呼ぶことで移転を「治療」として正当化する語り方に注目しました。成長を止める計画が、誰がそこに住み続けられるかという問題になるという視点が面白いところです。", "unverified": "移転の規模を示す数値は抄録では未確認。"}}, {"id": "jr31", "rank": 31, "headline": "円柱橋脚の内部欠陥を衝撃弾性波で見分ける", "title": "Field and Numerical Investigation of Impact-Echo Responses for Internal Defect Assessment in Cylindrical Concrete Bridge Piers", "url": "https://doi.org/10.3390/buildings16214435", "authors": "Le Ding ほか", "venue": "Buildings", "date": "2026-11-06", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "apa": "Ding, L., Zhu, X., Xu, Z., Mao, Y., & Ding, X. (2026). Field and Numerical Investigation of Impact-Echo Responses for Internal Defect Assessment in Cylindrical Concrete Bridge Piers. Buildings, 16(21), 4435. https://doi.org/10.3390/buildings16214435", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Buildingsの抄録を使用", "preprint": false, "short": true, "p1": "円柱形のコンクリート橋脚で、衝撃弾性波（インパクトエコー）の周波数応答と内部欠陥の関係を、供用中の2橋の現地測定と3次元有限要素解析で調べた（抄録）。", "p3": "現地測定で卓越周波数と測定の再現性を確かめ、数値解析では大きさと位置の異なる空洞と、材料分離のような低剛性の領域を設定して、卓越周波数・波形の時間・透過特性への影響と、正規化した卓越周波数のずれの指標を調べた（抄録）。", "p5": "空洞は分離のような領域より強い透過の遮断と裏面応答の時間のずれを生んだが、周波数応答だけでは一意に区別できず、卓越周波数のずれの分布も重なった。現地測定は再現性があったが、単一周波数での解釈には限界があった（抄録）。", "fun": "橋の柱の中に空洞があるかどうかは、外から見ても分かりません。そこで、たたいて跳ね返る振動の高さ（周波数）から中を推測する方法があります。この研究は、丸い柱ではいろいろな跳ね返り方が重なり、空洞と材料のむらを周波数だけでは見分けにくいことを示しました。たたいて調べる点検の奥深さが見える点が面白いところです。", "unverified": "実際の欠陥を確かめた上での検証は今後の課題と著者が記載（抄録）。"}}, {"id": "jr32", "rank": 32, "headline": "洗掘対策の捨石が橋の地震時の挙動を変える", "title": "Seismic performance of bridges retrofitted with riprap for scour countermeasures", "url": "https://doi.org/10.1680/jbren.26.00010", "authors": "Md Ahsaan Hussain ほか", "venue": "Proceedings of the Institution of Civil Engineers - Bridge Engineering", "date": "2026-11-05", "citescore": 4.5, "citescore_year": "2025", "apa": "Hussain, M. A., Banerjee, S., & Chatterjee, S. (2026). Seismic performance of bridges retrofitted with riprap for scour countermeasures. Proceedings of the Institution of Civil Engineers - Bridge Engineering, 1–15. https://doi.org/10.1680/jbren.26.00010", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "ICE Bridge Engineeringの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "洗掘対策として捨石（リップラップ）で補強した橋の地震時の性能を、地盤-捨石-基礎の連成解析で評価し、捨石が洗掘で増えた応答を元の水準近くに戻すことを示した（抄録）。", "p3": "代表的なRC橋の上部構造をSTAAD.Pro、下部構造をPlaxis 3Dで有限要素モデル化して連成させ、杭の載荷試験データで下部構造を検証し、元の状態・洗掘・捨石補強の3条件で20の地震波による時刻歴解析を行った（抄録）。", "p5": "洗掘は橋脚天端の正規化した変位の平均を元の状態より約15〜20%増やし、捨石はそれを洗掘前の水準近くまで戻した（抄録）。", "fun": "川に架かる橋は、洪水で橋脚のまわりの土が削られる「洗掘」に弱く、その対策として大きな石を敷き詰めます。この研究は、その石が地震のときにも役立つかを計算で確かめ、土が削られて大きくなった揺れをほぼ元どおりに抑えることを示しました。洪水対策が地震対策にもなるという一石二鳥の発見が面白いところです。", "unverified": "対象橋梁の諸元と地震波の選び方は抄録では未確認。"}}, {"id": "jr33", "rank": 33, "headline": "古タイヤのセルで重量貨物線の軌道変形を抑える", "title": "Performance of Tire Cell–Reinforced Tracks under Multistage Cyclic Loading: Full-Scale Testing and Numerical Modeling", "url": "https://doi.org/10.1061/jggefk.gteng-15374", "authors": "Fatima Mehmood ほか", "venue": "Journal of Geotechnical and Geoenvironmental Engineering - ASCE", "date": "2026-11-06", "sjr": 1.553, "citescore": 7.7, "citescore_year": "2025", "apa": "Mehmood, F., Indraratna, B., Ngo, T., Grant, J., Rujikiatkamjorn, C., & Kelly, R. (2027). Performance of Tire Cell–Reinforced Tracks under Multistage Cyclic Loading: Full-Scale Testing and Numerical Modeling. Journal of Geotechnical and Geoenvironmental Engineering, 153(1). https://doi.org/10.1061/jggefk.gteng-15374", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Journal of Geotechnical and Geoenvironmental Engineeringの抄録を使用", "preprint": false, "short": true, "p1": "古いトラックのタイヤを粒状材で満たして並べたセルを道床の下の層に使うと、重量貨物の繰返し荷重のもとで軌道の変形が抑えられることを、実物大試験と有限要素解析で示した（抄録）。", "p3": "重量貨物鉄道の試験施設に実物大の試験軌道をつくり、軸重20〜35t、載荷周波数10・15Hz（列車速度50〜80km/hに相当）の多段階の繰返し荷重で沈下・横変位などを測り、有限要素モデルを試験結果で検証した（抄録）。", "p5": "タイヤセルの層は横変位を減らし、荷重を支える層の剛性を高めて軟らかい路盤に伝わる応力を減らした。最終段階の35t・15Hzでも大きな沈下は生じなかった（抄録）。", "fun": "線路の下には砂利（バラスト）が敷かれていますが、重い貨物列車が何度も通ると沈んだり横にずれたりします。この研究は、捨てられるはずの古タイヤに砂利を詰めて並べ、線路の下に敷くと変形がぐっと減ることを実物大の線路で確かめました。ごみを丈夫な土台に変える発想が面白いところです。", "unverified": "沈下量などの具体的な数値と長期の耐久性は抄録では未確認。"}}, {"id": "jr34", "rank": 34, "headline": "交通の多体情報から橋梁応答を予測する注意機構", "title": "Attention-based micro-to-macro mapping of multi-agent traffic information for bridge response prediction", "url": "https://doi.org/10.1016/j.aei.2026.105444", "authors": "Yuhao Zhang ほか", "venue": "Advanced Engineering Informatics", "date": "2026-11-06", "sjr": 2.021, "citescore": 15.8, "citescore_year": "2025", "apa": "Zhang, Y., Ruan, X., Pan, Y., & Zhang, Y. (2027). Attention-based micro-to-macro mapping of multi-agent traffic information for bridge response prediction. Advanced Engineering Informatics, 77, 105444. https://doi.org/10.1016/j.aei.2026.105444", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "Advanced Engineering Informaticsの題名のみ（抄録・本文は入手できず）", "preprint": false, "short": true, "p1": "題名からは、交通流の多数の車両の情報を、注意機構で個々の車両の水準から全体の水準へ対応づけ、橋梁の応答を予測する手法を提案した研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "橋の上をたくさんの車が走るとき、一台一台の位置や重さの情報から橋全体の揺れを予測するのは難しい問題です。題名からは、AIの「注意機構」を使って、個々の車の情報を橋全体の応答につなげようとする研究だと読み取れます。細かな車の情報から大きな橋の動きを当てるという問いが面白いところです。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jr35", "rank": 35, "headline": "リアルタイムGNSS補正の完全性を一貫して監視", "title": "Towards reliable GNSS PPP: end-to-end integrity monitoring of real-time orbit and clock corrections", "url": "https://doi.org/10.1007/s10291-026-02175-w", "authors": "Zhen Lyu ほか", "venue": "GPS Solutions", "date": "2026-11-06", "sjr": 1.451, "citescore": 8.6, "citescore_year": "2025", "apa": "Lyu, Z., Wang, N., Massarweh, L., Li, Z., Rülke, A., de Oliveira, P. S., Zhong, H., & Liu, B. (2026). Towards reliable GNSS PPP: end-to-end integrity monitoring of real-time orbit and clock corrections. GPS Solutions, 31(1). https://doi.org/10.1007/s10291-026-02175-w", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "GPS Solutionsの題名のみ（抄録・本文は入手できず）", "preprint": false, "short": true, "p1": "題名からは、リアルタイムのGNSS精密単独測位（PPP）で使う衛星の軌道と時計の補正情報について、端から端までの完全性を監視する方法を扱う研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "精密な衛星測位では、衛星の位置や時計のずれを補う情報がネットで配られます。その補正情報自体が間違っていたら、位置も大きく狂ってしまいます。題名からは、補正を作る所から使う所まで、誤りを見張り続ける仕組みを扱う研究だと読み取れます。見張りをどう見張るかという問いが面白いところです。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jr36", "rank": 36, "headline": "臨床看護師の生成AIへの依存の水準と要因", "title": "Functional and existential dependence on large language models among clinical nurses and associated factors: a cross-sectional study", "url": "https://doi.org/10.1186/s12912-026-05640-6", "authors": "Xianming Ge ほか", "venue": "BMC Nursing", "date": "2026-11-06", "sjr": 1.368, "citescore": 5.3, "citescore_year": "2025", "apa": "Ge, X., Li, X., Ni, Y., Wang, H., & Zhu, L. (2026). Functional and existential dependence on large language models among clinical nurses and associated factors: a cross-sectional study. BMC Nursing. https://doi.org/10.1186/s12912-026-05640-6", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "BMC Nursingの抄録を使用", "preprint": false, "short": true, "p1": "中国の臨床看護師459人で、大規模言語モデルへの機能的・実存的な依存の水準と関連要因を調べ、利用頻度が高いほど依存が高く、関連の研修を受けた人ほど低いことを示した（抄録）。", "p3": "2026年8〜9月に3つの省級行政区の6病院で便宜抽出による横断調査を行い、構造化された質問紙のデータをt検定・分散分析・重回帰分析で分析した（抄録）。", "p5": "機能的・実存的な依存の得点の平均は35.42と27.18（1〜5の尺度の項目平均で3.94と3.02）だった。利用頻度は依存の高さと、研修の受講は低さと関連した。得点は問題のある依存の重症度や有病率を示すものではないと著者は注意している（抄録）。", "fun": "看護師がAIに調べものや記録を手伝ってもらうのは便利ですが、頼りすぎると自分で考える力が弱まる心配があります。この研究は、AIを使う回数が多い人ほど依存が強く、使い方の研修を受けた人ほど依存が弱いことを示しました。便利な道具を正しく使う練習が依存を防ぐ鍵になりそうだという点が面白いところです。", "unverified": "横断調査のため因果関係は未確認。便宜抽出の標本の代表性も未確認。"}}, {"id": "jr37", "rank": 37, "headline": "子どもは国民の条件で少数者の包摂の範囲を分ける", "title": "Who are we? Children's national and European identities and inclusion of minorities", "url": "https://doi.org/10.1111/bjso.70150", "authors": "Isabelle Nic Craith ほか", "venue": "British Journal of Social Psychology", "date": "2026-11-06", "sjr": 1.571, "citescore": 6.5, "citescore_year": "2025", "apa": "Nic Craith, I., & Taylor, L. K. (2026). Who are we? Children’s national and European identities and inclusion of minorities. British Journal of Social Psychology, 66(1). https://doi.org/10.1111/bjso.70150", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "British Journal of Social Psychologyの抄録を使用", "preprint": false, "short": true, "p1": "アイルランドの10〜11歳の子どもたちが、国民と欧州のアイデンティティの中身をどう話し合い、それが少数者を集団に含めるかどうかをどう左右するかを明らかにした（抄録）。", "p3": "26人の子どもによる8つのフォーカスグループで対話的な活動を行い、その記録を再帰的主題分析で分析した（抄録）。", "p5": "子どもたちは国民と欧州のアイデンティティを場所と結びついた一体のものと見ていた。血統や出生など民族的な中身だけを本質とする子は包摂の道を狭く、市民権や参加など市民的な中身も認める子は広く捉えた。言語や文化などの典型的な中身は包摂の程度を左右した（抄録）。", "fun": "「アイルランド人とは誰か」という問いに、「生まれや血筋」と答える子もいれば、「国の一員として参加すること」と答える子もいました。この研究は、その答え方の違いが、移民の子を仲間に入れるかどうかの線引きにつながることを示しました。大人の議論と同じ分かれ道が子どもの会話にすでに現れている点が興味深いところです。", "unverified": "参加者は26人に限られ、一般化の範囲は抄録では未確認。"}}, {"id": "jr38", "rank": 38, "headline": "高齢の家族介護者向けの研修で対処行動が持続", "title": "Six-month follow-up and longitudinal analysis of an adapted Savvy Caregiver Program for older family caregivers of adults with intellectual disabilities", "url": "https://doi.org/10.1080/20473869.2026.2757743", "authors": "Michela Saretta ほか", "venue": "International Journal of Developmental Disabilities", "date": "2026-11-04", "citescore": 5.5, "citescore_year": "2025", "apa": "Saretta, M., Doñate-Martínez, A., Alhambra-Borrás, T., & Garcés-Ferrer, J. (2026). Six-month follow-up and longitudinal analysis of an adapted Savvy Caregiver Program for older family caregivers of adults with intellectual disabilities. International Journal of Developmental Disabilities, 1–11. https://doi.org/10.1080/20473869.2026.2757743", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "International Journal of Developmental Disabilitiesの抄録（OpenAlex経由）を使用", "preprint": false, "short": true, "p1": "知的障害のある成人を長年介護する60歳以上のイタリアの家族介護者に、介護者教育プログラムを合わせて実施し、助けを求める自信と問題に向き合う対処が高まることを予備的に示した（抄録）。", "p3": "非無作為の準実験で、103人のうち52人が6回のプログラムを受け、51人が通常の支援を受けた。介護の自己効力感、対処、負担、社会的支援、被介護者の自立を、開始時・直後・6か月後に測った（抄録）。", "p5": "介入群は一時的な休息（レスパイト）を求める自信が直後に高まったが6か月後には差がなく、問題焦点型の対処は6か月後も高かった。ほかの結果には差がなかった（抄録）。", "fun": "障害のある子どもを何十年も世話してきた親は、年を取っても「助けて」と言いにくいものです。この研究は、6回の講座で介護の工夫を学んだ高齢の親が、休みを取るために助けを求める自信を持てるようになったことを示しました。ただその効果は半年で薄れ、続けて支える仕組みが必要だという点も含めて考えさせられます。", "unverified": "無作為化していないため、効果の因果的な解釈は未確認。"}}, {"id": "jr39", "rank": 39, "headline": "地方の小規模銀行の貸倒引当金に利益平準化を検出", "title": "DETECTION OF EARNINGS MANAGEMENT PRACTICES THROUGH DISCRETIONARY LOAN LOSS PROVISIONS AT RURAL BANKS IN WEST JAVA, CENTRAL JAVA, AND EAST JAVA DURING THE SAK EP TRANSITION PERIOD (2023–2025)", "url": "https://doi.org/10.25105/mraai.v26i2.27081", "authors": "Muhammad Saepuloh Saepuloh ほか", "venue": "Media Riset Akuntansi Auditing & Informasi", "date": "2026-11-06", "apa": "Saepuloh, M. S., & Teguh Siswanto. (2026). DETECTION OF EARNINGS MANAGEMENT PRACTICES THROUGH DISCRETIONARY LOAN LOSS PROVISIONS AT RURAL BANKS IN WEST JAVA, CENTRAL JAVA, AND EAST JAVA DURING THE SAK EP TRANSITION PERIOD (2023–2025). Media Riset Akuntansi, Auditing & Informasi, 26(2), 207–228. https://doi.org/10.25105/mraai.v26i2.27081", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Media Riset Akuntansi Auditing & Informasiの抄録（OpenAlex経由）を使用", "preprint": false, "short": true, "p1": "インドネシアの地方の小規模銀行（BPR）で、貸倒引当金の基準が規則型から判断型に移った時期に、裁量的な引当金による利益平準化が強まったことを示した（抄録）。", "p3": "西・中・東ジャワの556の通常型BPR（1,649銀行年）のパネルで、規則型の最後の2年と判断型の最初の1年（2023〜2025年）を一つの標本に含め、二段階の推定で裁量的な貸倒引当金を分析した（抄録）。", "p5": "引当前の利益は裁量的な引当金と正に関連し、利益平準化と整合した。この関連は規則型のもとでは弱く、判断型の初年度に大きく強まり、主に過大な引当による強い裁量を示す銀行の割合も増えた（抄録）。", "fun": "銀行は、貸したお金が返ってこない場合に備えて「引当金」を積みますが、その額にはある程度の裁量があります。この研究は、インドネシアの地方の小さな銀行で、ルールが決まった計算から担当者の判断に変わると、もうけの多い年に多めに積んで利益をならす動きが強まったことを示しました。ルールの書き方が会計の数字を動かす点が面白いところです。", "unverified": "裁量の強さの具体的な数値は抄録では未確認。"}}, {"id": "jr40", "rank": 40, "headline": "不安定な浸透を捉える高階方程式の数値解法", "title": "An implicit mixed finite element method for solving the Beljadid–Cueto-Felgueroso–Juanes–Richards equation modeling unstable infiltration in porous media", "url": "https://doi.org/10.1063/5.0349060", "authors": "Nour-Eddine Toutlini ほか", "venue": "Physics of Fluids", "date": "2026-11-06", "citescore": 5.4, "citescore_year": "2025", "apa": "Toutlini, N.-E., Beljadid, A., Soulaïmani, A., & Bourgault, Y. (2026). An implicit mixed finite element method for solving the Beljadid–Cueto-Felgueroso–Juanes–Richards equation modeling unstable infiltration in porous media. Physics of Fluids, 38(11). https://doi.org/10.1063/5.0349060", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Physics of Fluidsの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "重力フィンガリングのような不安定な浸透を表せる、リチャーズ方程式を拡張した高階の偏微分方程式を、陰的な混合有限要素法とGPUで効率よく解く枠組みを示した（抄録）。", "p3": "毛管エネルギー密度を対称に拡張した自由エネルギーに基づく方程式を、時間2次の陰的混合有限要素法で離散化し、ピカール–ニュートン型の線形化を使い、自動微分などのライブラリでGPU上で計算した（抄録）。", "p5": "単一のGPUで、1次元では単一コアのCPUの最大55倍、2次元では多コアのCPUの最大50.4倍の高速化を得た。実験データとの比較で飽和度のオーバーシュートをよく捉え、2次元計算でフィンガリングの模様を再現した（抄録）。", "fun": "乾いた砂に水をまくと、水は均一にしみ込まず、指のような筋になって下に伸びることがあります。この「フィンガリング」は、普通の浸透の式では表せません。この研究は、それを表せる難しい式を、画像処理用のチップ（GPU）で最大50倍以上速く解けるようにしました。身近な水のしみ込み方の不思議を計算で再現した点が面白いところです。", "unverified": "3次元の計算や実際の土壌での検証は抄録では未確認。"}}, {"id": "jr41", "rank": 41, "headline": "デジタル解説が満足に効く経路は中国と米国で異なる", "title": "Performance and Content Cues in Digital Heritage Interpretation: A Cross-Country Comparison of the Digital Visitor Experience", "url": "https://doi.org/10.3390/heritage9110464", "authors": "Yuan Zhang ほか", "venue": "Heritage", "date": "2026-11-06", "sjr": 0.532, "citescore": 4.3, "citescore_year": "2025", "apa": "Zhang, Y., Papp-Váry, Á., & Szabó, Z. (2026). Performance and Content Cues in Digital Heritage Interpretation: A Cross-Country Comparison of the Digital Visitor Experience. Heritage, 9(11), 464. https://doi.org/10.3390/heritage9110464", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Heritageの抄録を使用", "preprint": false, "short": true, "p1": "世界遺産でのデジタル解説が満足と推奨意図に与える効果を、システムの振る舞いの証拠（手続き的）と内容の主張の証拠（実質的）に分けて測り、その構成が中国と米国でほぼ正反対であることを示した（抄録）。", "p3": "中国の来訪者1,000人と米国の989人で、配置・計量・スカラーの不変性を確かめたうえで多母集団の構造方程式モデルを推定し、モンテカルロ区間で差を評価した（抄録）。", "p5": "満足への効果のうち手続き的な証拠が担う割合は中国で75%、米国で9%（米国では真正性の判断が支配的）で、満足から推奨意図への変換は中国の来訪者で約2倍強かった（抄録）。", "fun": "博物館や遺跡で使う解説アプリの満足度は、「アプリがさくさく動くか」と「書いてある内容が本物らしいか」の2つで決まります。この研究は、中国の来訪者は動きの良さを、米国の来訪者は内容の確かさを重視するという、ほぼ正反対の結果を示しました。同じ満足でも中身の組み立てが国で違うという点が面白いところです。", "unverified": "投資配分への示唆は検証済みの規則ではなく命題として示されている（抄録）。"}}, {"id": "jr42", "rank": 42, "headline": "社会的処方で農村高齢者の脆弱性を測り支える", "title": "Social innovation in longevity based on social prescribing: a conceptual and intervention model", "url": "https://doi.org/10.1108/jica-07-2025-0063", "authors": "Javier Castro-Spila ほか", "venue": "Journal of Integrated Care", "date": "2026-11-05", "citescore": 1.8, "citescore_year": "2025", "apa": "Castro-Spila, J., Beloki, U., Martínez Virto, L., Etxebeste, K., Zulaika, A., Goirigolzarri, A., Pagis, A., & Gouraud, K. (2026). Social innovation in longevity based on social prescribing: a conceptual and intervention model. Journal of Integrated Care, 1–13. https://doi.org/10.1108/jica-07-2025-0063", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Journal of Integrated Careの抄録（OpenAlex経由）を使用", "preprint": false, "short": true, "p1": "スペインとフランスの農村の高齢者を対象に、社会的処方と社会的イノベーションを結ぶ概念モデルと、社会的な脆弱性を測る道具を作った（抄録）。", "p3": "文献のレビューで社会的イノベーションのモデルを定め、それを社会的な脆弱性を測る道具に落とし込み、脆弱な状況にある高齢者34人と専門職14人に適用して、参加型の過程で妥当性を確かめた（抄録）。", "p5": "概念モデルと、脆弱性を測って地域の資源と担い手のネットワークを動かす道具の2つを得た。概念モデルの実証はまだで、2026年に始まる6つの試行で、無作為化も対照群もない前後比較により評価する予定とした（抄録）。", "fun": "薬の代わりに地域の活動や人との交流を勧める「社会的処方」という考え方があります。この研究は、人の少ない農村の高齢者のために、孤立の度合いを測る道具と、地域の人や資源をつなぐ仕組みを作りました。医療の外にある地域の力を「処方」するという発想が面白いところです。", "unverified": "概念モデルの実証は未実施と著者が記載（抄録）。"}}, {"id": "jr43", "rank": 43, "headline": "スイッチングコストは口コミと信頼の関係を強める", "title": "The Effect of Word of Mouth, Patient Experience, and Cooperation On Patient Trust, With Psychological Commitment As A Mediator and Switching Cost In Hospitals", "url": "https://doi.org/10.51601/ijersc.v7i5.1133", "authors": "Edmond Rukmana Wikanta ほか", "venue": "International Journal of Educational Research & Social Sciences", "date": "2026-11-06", "apa": "Edmond Rukmana Wikanta, Enrico Adhitya Rinaldi, Achda Ferdians, & Cahyo Kusumo Wijyoyo. (2026). The Effect of Word of Mouth, Patient Experience, and Cooperation On Patient Trust, With Psychological Commitment As A Mediator and Switching Cost In Hospitals. International Journal of Educational Research & Social Sciences, 7(5), 1006–1016. https://doi.org/10.51601/ijersc.v7i5.1133", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "International Journal of Educational Research & Social Sciencesの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "インドネシアの病院の外来患者で、口コミ・患者体験・協力関係が患者の信頼に与える影響と、心理的コミットメントの媒介、スイッチングコストの調整を分析した（抄録）。", "p3": "2回以上受診した外来患者304人の調査を、部分最小二乗法による構造方程式モデル（PLS-SEM）で分析した（抄録）。", "p5": "協力関係は心理的コミットメントと信頼に最も強く効いた。口コミはコミットメントを介して間接に、患者体験は直接に信頼に影響した。スイッチングコストは口コミと信頼の関係を強め、患者体験と信頼の関係を弱めた（抄録）。", "fun": "病院を選ぶとき、私たちは知り合いの口コミや自分の体験を頼りにします。この研究では、病院を変えるのが面倒な人ほど口コミの影響が強まり、自分の体験の影響は弱まることが分かりました。「乗り換えにくさ」が、何を信じるかの重みづけまで変えてしまうという点が面白いところです。", "unverified": "1病院の調査で、一般化の範囲と効果の大きさは抄録では未確認。"}}, {"id": "jr44", "rank": 44, "headline": "生成AIで歩行者の安全の感じ方を推定する可能性と偏り", "title": "Assessing potential and bias of generative artificial intelligence in inferring pedestrian safety perception", "url": "https://doi.org/10.1016/j.tbs.2026.101440", "authors": "Xi Guan ほか", "venue": "Travel Behaviour and Society", "date": "2026-11-06", "sjr": 1.641, "citescore": 10.3, "citescore_year": "2025", "apa": "Guan, X., Kar, A., Lee, J., & Liu, L. (2027). Assessing potential and bias of generative artificial intelligence in inferring pedestrian safety perception. Travel Behaviour and Society, 47, 101440. https://doi.org/10.1016/j.tbs.2026.101440", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "Travel Behaviour and Societyの題名のみ（抄録・本文は入手できず）", "preprint": false, "short": true, "p1": "題名からは、生成AIで歩行者が感じる安全さ（安全の知覚）を推定できる可能性と、その推定の偏りを評価した研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "街を歩くときの「この道は安心」「ここは少し怖い」という感じ方は、街づくりの大切な手がかりです。題名からは、その感じ方を生成AIに推定させ、どこまで当てられるか、どんな偏りがあるかを調べた研究だと読み取れます。AIが人の肌感覚をどこまで代わりに測れるかという問いが面白いところです。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jr45", "rank": 45, "headline": "マルチモーダルLLMで街の人間規模の変化を検出", "title": "Detecting Human-Scale Built Environment Changes With Multimodal Large Language Models", "url": "https://doi.org/10.1080/01944363.2026.2750474", "authors": "Jianqi Li ほか", "venue": "Journal of the American Planning Association", "date": "2026-11-06", "sjr": 1.697, "citescore": 8.4, "citescore_year": "2025", "apa": "Li, J., & Li, C. (2026). Detecting Human-Scale Built Environment Changes With Multimodal Large Language Models. Journal of the American Planning Association, 1–17. https://doi.org/10.1080/01944363.2026.2750474", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "Journal of the American Planning Associationの題名のみ（抄録・本文は入手できず）", "preprint": false, "short": true, "p1": "題名からは、マルチモーダルな大規模言語モデルで、人間の目線の規模での建造環境（街並み）の変化を検出する研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "人の目線で見える街の小さな変化は、統計にはなかなか表れません。題名からは、画像と言葉の両方を扱えるAIに街の様子を見せ、そうした変化を見つけさせる研究だと読み取れます。人が歩いて確かめていた街の点検をAIが担えるかという問いが面白いところです。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jr46", "rank": 46, "headline": "行動科学での生成AI利用に伴う見落としと誤りのリスク", "title": "Risks of omission and commission errors when using generative AI in behavioral science research", "url": "https://doi.org/10.1016/j.copsyc.2026.102492", "authors": "Moritz Joerling ほか", "venue": "Current Opinion in Psychology", "date": "2026-11-06", "sjr": 3.432, "citescore": 17.4, "citescore_year": "2025", "apa": "Joerling, M., Roggenkamp, H., & Tomaino, G. (2027). Risks of omission and commission errors when using generative AI in behavioral science research. Current Opinion in Psychology, 74, 102492. https://doi.org/10.1016/j.copsyc.2026.102492", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "題名", "basis_note": "Current Opinion in Psychologyの題名のみ（抄録・本文は入手できず）", "preprint": false, "short": true, "p1": "題名からは、行動科学の研究で生成AIを使うときの、見落とし（省略）の誤りと、やりすぎ（作為）の誤りのリスクを論じた論考とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "研究にAIを使うと、大事なことを書き落とす失敗と、余計なことを書き足す失敗の2種類が起こりえます。題名からは、心理学などの研究でこの2つの誤りがどんな危険を生むかを整理した論考だと読み取れます。便利な道具の失敗を「やらなかった誤り」と「やりすぎた誤り」に分けて考える視点が面白いところです。", "unverified": "抄録・本文を入手できず、内容はすべて未確認。"}}, {"id": "jr47", "rank": 47, "headline": "自治体の細分化はフロリダの持続的な都市形態を妨げるか", "title": "Fragmented Jurisdictions and the Delivery of More Sustainable Urban Form in Florida", "url": "https://doi.org/10.1080/01944363.2026.2751539", "authors": "Rafik Ibrahim", "venue": "Journal of the American Planning Association", "date": "2026-11-06", "sjr": 1.697, "citescore": 8.4, "citescore_year": "2025", "apa": "Ibrahim, R. (2026). Fragmented Jurisdictions and the Delivery of More Sustainable Urban Form in Florida. Journal of the American Planning Association, 1–18. https://doi.org/10.1080/01944363.2026.2751539", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "Journal of the American Planning Associationの題名のみ（抄録・本文は入手できず）", "preprint": false, "short": true, "p1": "題名からは、フロリダ州で自治体の管轄が細かく分かれていることが、より持続可能な都市形態の実現にどう影響するかを扱う研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "一つの都市圏が多くの小さな市や町に分かれていると、それぞれが自分の都合で開発を進め、全体としてまとまりのない街になるおそれがあります。題名からは、フロリダを舞台に、その分かれ方が環境にやさしい街の形づくりにどう影響するかを調べた研究だと読み取れます。行政の境界線が街の形を左右するかという問いが面白いところです。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jr48", "rank": 48, "headline": "マイクロモビリティを公共交通指向型開発に組み込む", "title": "Integrating micro-mobility into transit-oriented development: An intuitionistic fuzzy decision-support approach for policy prioritization in Istanbul", "url": "https://doi.org/10.1016/j.rtbm.2026.101941", "authors": "Betul Sasmazturk ほか", "venue": "Research in Transportation Business and Management", "date": "2026-11-06", "sjr": 1.014, "citescore": 8.7, "citescore_year": "2025", "apa": "Sasmazturk, B., & Ayyildiz, E. (2027). Integrating micro-mobility into transit-oriented development: An intuitionistic fuzzy decision-support approach for policy prioritization in Istanbul. Research in Transportation Business & Management, 70, 101941. https://doi.org/10.1016/j.rtbm.2026.101941", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "Research in Transportation Business and Managementの題名のみ（抄録・本文は入手できず）", "preprint": false, "short": true, "p1": "題名からは、イスタンブールで公共交通指向型開発（TOD）にマイクロモビリティを組み込む政策の優先順位を、直観主義ファジィによる意思決定支援で決める研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "駅を中心に街をつくる考え方に、小型の乗り物（マイクロモビリティ）をどう組み合わせるかは、都市の交通の課題の一つです。題名からは、イスタンブールを例に、あいまいさを含む評価を数学的に扱って、どの政策から手をつけるべきかを決める研究だと読み取れます。白黒つけにくい判断を数式で整理するという問いが面白いところです。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jr49", "rank": 49, "headline": "地域ケアでの対話型AIのスコーピングレビュー", "title": "Conversational Artificial Intelligence in Community Care: A Scoping Review", "url": "https://doi.org/10.1080/10447318.2026.2751902", "authors": "Minseo Cho ほか", "venue": "International Journal of Human–Computer Interaction", "date": "2026-11-06", "citescore": 10.1, "citescore_year": "2025", "apa": "Cho, M., Da Re, M., Simpson, T., Harrison, M., & Calvo, R. (2026). Conversational Artificial Intelligence in Community Care: A Scoping Review. International Journal of Human–Computer Interaction, 1–26. https://doi.org/10.1080/10447318.2026.2751902", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "題名", "basis_note": "International Journal of Human–Computer Interactionの題名のみ（抄録・本文は入手できず）", "preprint": false, "short": true, "p1": "題名からは、地域でのケア（コミュニティケア）における対話型AIの利用に関する研究を、スコーピングレビューで整理したものとみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名からは、地域で暮らす人を支えるケアの場面で、会話のできるAIがどう使われているかを幅広く整理したレビューだと読み取れます。人と人との関わりが大切なケアに、AIがどんな形で加われるのかという問いそのものが面白いところです。", "unverified": "抄録・本文を入手できず、対象の研究数や結論はすべて未確認。"}}, {"id": "jr50", "rank": 50, "headline": "コンクリート橋の点検ロボット向け表面欠陥の多クラス検出", "title": "MambaBridgeNet: A multiclass surface defect detection framework for robotic inspection of concrete bridges", "url": "https://doi.org/10.1016/j.conbuildmat.2026.148782", "authors": "Qidi Huang ほか", "venue": "Construction and Building Materials", "date": "2026-11-06", "sjr": 2.097, "citescore": 14.2, "citescore_year": "2025", "apa": "Huang, Q., Cao, X., Cao, L., Qiu, J., Zhong, J., & Song, T. (2026). MambaBridgeNet: A multiclass surface defect detection framework for robotic inspection of concrete bridges. Construction and Building Materials, 549, 148782. https://doi.org/10.1016/j.conbuildmat.2026.148782", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "Construction and Building Materialsの題名のみ（抄録・本文は入手できず）", "preprint": false, "short": true, "p1": "題名からは、コンクリート橋のロボット点検のために、表面の複数種類の欠陥を検出する枠組み（MambaBridgeNet）を提案した研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名からは、点検ロボットが撮ったコンクリート橋の画像から、何種類もの表面の傷をAIで見分ける仕組みを作った研究だと読み取れます。人の目に頼ってきた橋の点検を、ロボットとAIの組み合わせでどこまで置き換えられるかという問いが面白いところです。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "組織行動・心理的安全性", "headline": "ノルマをわずかに逃す経験が営業職の離職を招く", "title": "EXPRESS: So Near Yet So Far: The Unexpected Role of Near Misses for Salesperson Turnover", "url": "https://doi.org/10.1177/00222437261507984", "authors": "Arpit Agrawal ほか", "venue": "Journal of Marketing Research", "date": "2026-11-06", "sjr": 7.363, "citescore": 11.0, "citescore_year": "2025", "apa": "Agrawal, A., Ahearne, M., Atefi, Y., Habel, J., Pourmasoudi, M., & Punia, P. (2026). EXPRESS: So Near Yet So Far: The Unexpected Role of Near Misses for Salesperson Turnover. Journal of Marketing Research. https://doi.org/10.1177/00222437261507984", "why": "44社・1万3277人の営業職の7年間のパネルと3つの実験から、ノルマを僅差で逃す「ニアミス」が繰り返されると離職が増え、その仕組みが転職の期待効用の変化であることを示した。", "explain": {"basis": "抄録", "basis_note": "Journal of Marketing Researchの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "営業職がノルマをわずかな差で逃す「ニアミス」が繰り返されると離職が増えることを、7年間・44社・13,277人のパネルと3つの実験などで示し、その仕組みが転職の期待効用の変化であることを明らかにした（抄録）。", "p2": "ノルマの達成は営業職の収入・評価・昇進を決め、達成できない人ほど離職しやすいと考えられてきたが、すべての未達成が同じ重みを持つのかは分かっていなかった（抄録）。背景：離職の期待効用モデルは、今の仕事と他の仕事で得られる価値の見込みを比べて離職を説明する。", "p3": "離職の期待効用モデルに基づき、僅差でのノルマ未達が、今の仕事で価値ある結果が得られるという自信を損ない、他所でならそれが得られそうだという見込みを高めると論じた（抄録）。", "p4": "業種をまたぐ7年間の44社・13,277人の営業職のパネル、3つの実験、複数の補助的な研究で、僅差の未達と離職の関係、変動給の割合や集団の成績の均質さによる違い、転職の期待効用の媒介を検証した（抄録）。", "p5": "ノルマを僅差で繰り返し逃す営業職は特に離職しやすく、その効果はノルマ達成が重要な場合（変動給が高い、集団の成績が均質）に強かった。転職の期待効用がこの効果の仕組みであることを確かめた（抄録）。効果の大きさの数値は抄録に記載がない。", "p6": "抄録の範囲では、パネルでの識別の方法と、実験の場面の外的妥当性は確かめられない。著者は、ニアミスを防ぐなど、有能な人材を引き留める的を絞った介入を管理者に提案する（抄録）。", "fun": "テストで合格点に1点足りなかったときの悔しさは、大差で落ちたときより強いものです。この研究は、営業の仕事で「あと少しでノルマ達成」を何度も経験した人ほど会社を辞めやすいことを、13,277人の営業職のデータと実験で示しました。惜しい失敗が「ここでは報われない、よそならうまくいく」という気持ちを生むという点が面白いところです。", "unverified": "抄録のみ読んだ。効果の大きさと、パネルでの推定方法は未確認。"}}, {"id": "jn02", "rank": 2, "field": "経営学", "headline": "ブランドとの共同投稿でフォロワーは0.52%増える", "title": "EXPRESS: Are Exposure Bucks Worth It? Evidence from Instagram", "url": "https://doi.org/10.1177/00222437261507987", "authors": "Daniel Goetz ほか", "venue": "Journal of Marketing Research", "date": "2026-11-06", "sjr": 7.363, "citescore": 11.0, "citescore_year": "2025", "apa": "Goetz, D., & Ching, A. T. (2026). EXPRESS: Are Exposure Bucks Worth It? Evidence from Instagram. Journal of Marketing Research. https://doi.org/10.1177/00222437261507987", "why": "260のファッション・美容ブランドの共同投稿をクリエイターの日次のフォロワー数と結び、差の差法で、共同投稿の効果が約1週間分の自然増に相当する小さな露出効果であることを示した。", "explain": {"basis": "抄録", "basis_note": "Journal of Marketing Researchの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "Instagramでブランドとクリエイターが共同で投稿する機能について、共同投稿がクリエイターのフォロワーを平均0.52%増やす（約1週間分の自然増に相当）が、エンゲージメントや他ブランドとの提携には効果がないことを示した（抄録）。", "p2": "ブランドとの共同投稿という露出と引き換えの協業が、クリエイターに実際どれだけの利益をもたらすかは定量的に分かっていなかった（抄録）。背景：差の差法は、処置を受けた群と受けない群の変化の差で効果を推定する方法。", "p3": "260の主要なファッション・美容ブランドのすべての共同投稿を、小〜中規模の協業クリエイターの日次のフォロワー数のパネルと結び、投稿の視覚的な内容で処置と対照の投稿をマッチングし、ブランドの投稿日程の硬直性を利用した差の差法で因果効果を推定した（抄録）。", "p4": "評価の指標はクリエイターの累積フォロワー数、フォロワーのエンゲージメント、他ブランドとの提携の傾向で、ブランドの規模による違いと、効果の源（露出か品質のシグナルか）を分析した（抄録）。", "p5": "共同投稿はクリエイターの累積フォロワー数を平均0.52%増やし、エンゲージメントや他ブランドとの提携の傾向には効果がなかった。主な利益は品質のシグナルではなく露出によるもので、フォロワーの多いブランドは利得を大きくしうるが、エンゲージメントの低さや作風のずれで相殺され、効果はフォロワー数が0.7百万〜8.6百万のブランドでほぼ一定だった（抄録）。", "p6": "抄録の範囲では、売上や収入など金銭的な成果への効果は確かめられない。解釈：ファッション・美容の小〜中規模のクリエイターに限った結果で、他の分野や大規模なクリエイターへの一般化には注意が要る。", "fun": "有名ブランドと一緒に投稿すれば、インフルエンサーは一気に有名になれそうです。ところがこの研究で、大手のファッション・美容ブランドとの共同投稿で増えるフォロワーは、平均で約1週間分の自然な増加と同じくらいでした。大きなブランドほど効果が大きいとも限らなかった点が、露出の価値の現実を示していて面白いところです。", "unverified": "抄録のみ読んだ。標本のクリエイター数と、推定の頑健性の確認は未確認。"}}, {"id": "jn03", "rank": 3, "field": "経済学", "headline": "警察労組が推した市長は警察を拡大するが成果は伸びず", "title": "The Influence of Police Unions in Local Elections: Evidence from U.S. Cities’ Spending and Performance", "url": "https://doi.org/10.1017/s0003055426101956", "authors": "MARIA CARRERI ほか", "venue": "American Political Science Review", "date": "2026-11-06", "sjr": 5.433, "citescore": 11.0, "citescore_year": "2025", "apa": "CARRERI, M., TESO, E., & YU, R. (2026). The Influence of Police Unions in Local Elections: Evidence from U.S. Cities’ Spending and Performance. American Political Science Review, 1–21. https://doi.org/10.1017/s0003055426101956", "why": "1,073市・2,303回の市長選の選挙資金データを構築し、時期の異なる処置に頑健な市内比較で、警察労組が支援した市長の当選が警察の規模を拡大させる一方、警察の成果は改善しないことを示した。", "explain": {"basis": "本文", "basis_note": "Cambridge Coreの出版社HTML本文（データと記述の節、実証設計、結果、結論）を読んだ", "preprint": false, "p1": "2001〜2019年の1,073市・2,303回の米国の市長選の選挙資金の大規模データを構築して警察労組の献金の頻度と対象を記述し、警察労組が支援した市長の当選が警察の規模を拡大させる一方、警察の成果は改善しないことを示した（抄録、結論）。", "p2": "地方の公共安全の政策と警察労組の地方候補への献金に関心が高まっているが、警察労組が地方政治でどんな役割を果たし、政策や警察の行動をどう変えるかはほとんど分かっていなかった（序論、結論）。背景：処置の時期と効果がばらつくと、通常の二方向固定効果は「すでに処置された」単位との比較で偏りうる。", "p3": "各市の選挙資金の記録から警察労組の献金を特定し、選挙・候補者・制度の特徴、自治体の予算、公務員の雇用、犯罪の結果と結合した。同じ市で、警察労組の支援を受けない市長から受けた市長に変わる変動を使い、二方向固定効果と、時期の異なる処置に頑健な積み重ねたイベントスタディで推定した（データと実証設計の節）。", "p4": "結果の指標は、人口1,000人あたりの警察の職員数（警察官とその他の職員）と給与、FBIの8つの重大犯罪（指標犯罪）の発生と検挙率で、効果が大きい場所の違いも分析した（結果の節）。", "p5": "警察労組は標本の2,249回の市長選のうち233回（10.4%）で献金し、その93%で上位2候補の一方だけを支援し、献金の中央値は500ドルだった（記述の節）。支援した市長の当選は警察の職員数を一貫して増やし（警察官の係数は0.036〜0.072）、給与への効果はおおむね有意でなかった。指標犯罪の検挙率の係数は−0.008〜−0.015で、成果の改善は見られなかった（結果の節）。", "p6": "著者は、成果が改善しないことを、資源は増えても努力の誘因が弱まる可能性などと整合的と解釈するにとどめる（結論）。解釈：警察労組は当選しそうな候補や現職を狙って献金するため、支援の効果と候補の選ばれ方の効果を完全に分けられるかは設計の仮定に依存する。", "fun": "アメリカの市長選挙では、警察の労働組合が候補者に献金することがあります。この研究は、1,000以上の市の選挙資金を調べ、組合が応援した市長が当選すると警察官の数が増える一方、犯罪の検挙率は良くならないことを示しました。お金と人が増えても成果が上がらないことがあるという、組織と政治の関係が見える点が面白いところです。", "unverified": "効果の大きい場所の分析の結果と、給与への効果の詳細は確認しきれていない。"}}, {"id": "jn04", "rank": 4, "field": "開発経済学", "headline": "植民地の官僚採用は実力より縁故で決まった", "title": "The Seeds of State Capture: Merit and Patrimonialism in the Colonial Bureaucracy", "url": "https://doi.org/10.1017/s0003055426101993", "authors": "SARAH BRIERLEY ほか", "venue": "American Political Science Review", "date": "2026-11-06", "sjr": 5.433, "citescore": 11.0, "citescore_year": "2025", "apa": "BRIERLEY, S., NATHAN, N., OFOSU, G. K., & ZHU, T. (2026). The Seeds of State Capture: Merit and Patrimonialism in the Colonial Bureaucracy. American Political Science Review, 1–26. https://doi.org/10.1017/s0003055426101993", "why": "英領ガーナの60年分の個人記録をデジタル化し、アフリカ人職員の採用が能力主義でなく民族間の大きな格差を伴う縁故主義だったことを示して、独立後の家産制国家の起源についての通説に異を唱えた。", "explain": {"basis": "本文", "basis_note": "Cambridge Coreの出版社HTML本文（理論、データ、民族の不均衡、能力を条件とした偏り、結論の節）を読んだ", "preprint": false, "p1": "英領ゴールドコースト（ガーナ）の1897〜1955年の植民地官僚の名簿をデジタル化して民族を推定し、アフリカ人職員の採用が能力主義ではなく、既存の官僚による縁故主義で、2つの小さな民族集団が圧倒的に占めたことを示した（抄録、結論）。", "p2": "官僚の採用が能力主義か家産的かは政治家の行動の結果とみなされてきたが、政治家は採用を既存の官僚に委ねることが多く、官僚自身の選好の役割は見過ごされていた（抄録、理論の節）。", "p3": "政治家が統治する共同体から社会的に遠く、採用への選好が弱いと、情報の非対称が大きくなり官僚の選好が採用を支配するという理論を示した。英国国立公文書館の名簿（氏名、職位、給与、任命日）をデジタル化し、名前から最も可能性の高い民族を推定する新しい方法で官僚と民族を結び、その推定を検証した（理論とデータの節）。", "p4": "民族の構成を人口比と比べ、部局内での民族の固定化、官僚主導の採用の公文書の証拠、1906〜1930年の111回の試験の2,423人の合格者での能力を条件とした採用の差、欧亜系の家族の縁故採用を調べ、教育の格差や英国人の好みなど代替的な説明も検討した（各節）。", "p5": "ガとファンティの2集団が上級・下級の両方を支配し、1948年までに上級のガーナ人官僚の83.1%（ガ54.2%、ファンティ28.9%）を占めたが、人口に占める割合はそれぞれ3%と11%だった（民族の不均衡の節）。試験の成績が同程度でも、ガとファンティの応募者が他の集団より優遇されていた（能力を条件とした偏りの節）。", "p6": "著者は、植民地の採用の民族格差を指摘した先行研究はあり、主な貢献はその理由の新しい説明（先行者の優位と官僚主導の内部からの捕獲）だとする（結論）。解釈：名前からの民族の推定には誤分類の可能性があり、結果はその精度に依存する。", "fun": "役所の職員を試験で選ぶ仕組みがあっても、実際には知り合いのつてで採用されることがあります。この研究は、イギリス植民地時代のガーナの公務員の名簿を何十年分も読み込み、人口ではわずかな2つの民族が上級の役人の83.1%を占めていたことを突き止めました。政治家ではなく、先に役所に入った人たちが仲間を引き入れていたという仕組みの発見が面白いところです。", "unverified": "試験の成績を条件とした比較の効果の大きさは確認していない。"}}, {"id": "jn05", "rank": 5, "field": "経営学", "headline": "楽しい活動ほど自分の能力を高く見積もる", "title": "EXPRESS: The Enjoy-Able Effect: Consumer Enjoyment Inflates Self-Evaluations of Ability", "url": "https://doi.org/10.1177/00222437261507719", "authors": "JACOB D. TEENY ほか", "venue": "Journal of Marketing Research", "date": "2026-11-06", "sjr": 7.363, "citescore": 11.0, "citescore_year": "2025", "apa": "TEENY, J. D., ZANE, D. M., PALEY, A., & SMITH, R. W. (2026). EXPRESS: The Enjoy-Able Effect: Consumer Enjoyment Inflates Self-Evaluations of Ability. Journal of Marketing Research. https://doi.org/10.1177/00222437261507719", "why": "大規模な記録データ2波、100の消費活動の連想、6つの実験から、楽しさが実際の能力とは独立に自己評価を高め、専門家向け商品の選択などの行動を変える「エンジョイ・エイブル効果」を示した。", "explain": {"basis": "抄録", "basis_note": "Journal of Marketing Researchの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "楽しさ（経験した・予想した・相対的な楽しさ）が、実際の能力とは独立に消費者の自己評価の能力を高め、専門家のように振る舞わせ、楽しい活動ほど「平均以上」の偏りを生む「エンジョイ・エイブル効果」を示した（抄録）。", "p2": "楽しさが消費者行動に与える影響はフロー理論や自己決定理論などで論じられてきたが、楽しさが自分の能力の見積もりを歪めるかは調べられていなかった（抄録）。", "p3": "消費者は「楽しい＝得意」という素朴な理論を過度に一般化して自分の能力を推論すると考え、楽しさが主観的な専門性の手がかりとしてどれだけ診断的か、努力と専門性を結ぶ別の素朴な理論などの手がかりがあると依存が下がるかを検証した（抄録）。", "p4": "2波の記録データ（N=559,370と491,791）、100の消費活動の連想の基準（N=397）、6つの実験（N=251〜593）で、自己評価の能力、専門家向け商品の選択、「平均以上」の偏りを調べた（抄録）。", "p5": "楽しさは自己評価の能力を高め、専門家向けの商品を選ぶなど自分を専門家とみなす行動や、楽しい活動ほど強い「平均以上」の偏りにつながり、これらは実際の能力とは独立だった。効果は楽しさの診断性に依存し、努力と専門性を結ぶ別の素朴な理論が使えると弱まった（抄録）。", "p6": "抄録の範囲では、効果の大きさと、自己評価の誤りが実際の購買や満足にどう響くかは確かめられない。解釈：記録データは相関の証拠で、因果は実験で補われている。", "fun": "好きなことは得意なことだと思いがちです。この研究は、楽しいと感じるだけで、実際の腕前とは関係なく「自分は上手だ」と思い込みやすくなり、上級者向けの道具を選んだりすることを、大規模なデータと実験で示しました。「楽しい＝上手」という思い込みが買い物の選び方まで変える点が面白いところです。", "unverified": "抄録のみ読んだ。効果の大きさと、記録データの内容は未確認。"}}, {"id": "jn06", "rank": 6, "field": "経済学", "headline": "プライベートクレジットは銀行型の脆弱さを持たない", "title": "Private Credit, Balance Sheets, and Financial Stability", "url": "https://doi.org/10.1257/jep.20261498", "authors": "Gregor Matvos ほか", "venue": "Journal of Economic Perspectives", "date": "2026-11-06", "sjr": 8.181, "citescore": 15.4, "citescore_year": "2025", "apa": "Matvos, G., Piskorski, T., & Seru, A. (2026). Private Credit, Balance Sheets, and Financial Stability. Journal of Economic Perspectives, 40(4), 95–114. https://doi.org/10.1257/jep.20261498", "why": "ファンドと資産単位の網羅的なデータから、プライベートクレジット・ファンドは資産の65〜80%を出資で賄い、満期変換も小さく、分散されていることを示し、金融安定への含意と残る脆弱性を整理した。", "explain": {"basis": "抄録", "basis_note": "Semantic Scholarに登録された抄録（NBERワーキングペーパー版）を使用し、本文は入手できず", "preprint": false, "p1": "ファンドと資産単位の網羅的なデータから、プライベートクレジット・ファンドは資本が厚く、満期のずれが小さく、分散されており、現在の構造では銀行のようなシステミックなリスクを生みにくいことを示した（抄録）。", "p2": "プライベートクレジットは企業の資金調達の重要な源になり、金融の安定への影響が問われていた（抄録）。背景：プライベートクレジットは、銀行ではなく投資ファンドなどが企業に直接貸し出す融資。", "p3": "業界の大半をカバーするファンドと資産単位のデータで、資本構成、資金調達の構造、存続期間と満期、ポートフォリオの分散、運用成績を記述した（抄録）。", "p4": "比較の基準は米国の銀行の資本構成と満期変換で、損失を債権者と出資者のどちらが負担するかも調べた（抄録）。", "p5": "ファンドの資産の65〜80%が出資（株主資本）で、米国の銀行（約10%）の6倍を超えた。負債の利用は中程度で主に流動性管理のための銀行の与信枠で、ファンドの存続期間は平均10〜12年と貸出の満期より長く、満期のずれはほとんどなかった。ポートフォリオは業種・地域・戦略で分散され、平均の純リターンは正で、損失は主に出資者が負った（抄録）。", "p6": "著者は、部門の成長に伴い、統治と開示の摩擦、ストレス時の動き、銀行とノンバンクのつながり、出資者のバランスシートや個人向け投資商品を通じた損失の伝播という脆弱性が生じうるとする（抄録）。解釈：抄録はNBER版のもので、掲載誌版と細部の数値が異なる可能性がある。", "fun": "銀行の外でお金を貸す「プライベートクレジット」が急に大きくなり、次の金融危機の火種ではと心配されています。この研究はファンドの中身を調べ、銀行よりずっと多くを自己資金でまかない、短期で借りて長期で貸すような危うい形になっていないことを示しました。心配の中身を数字で確かめた点が面白いところです。", "unverified": "抄録のみ読んだ（NBER版の抄録）。リターンの具体的な水準とデータの期間は未確認。"}}, {"id": "jn07", "rank": 7, "field": "社会学", "headline": "米国の大学の教育資源の階層化は1970年以降に拡大", "title": "The Meritocratic Consensus and Stratification in Higher Education", "url": "https://doi.org/10.1257/jep.20251487", "authors": "Zachary Bleemer ほか", "venue": "Journal of Economic Perspectives", "date": "2026-11-06", "sjr": 8.181, "citescore": 15.4, "citescore_year": "2025", "apa": "Bleemer, Z., & Rothstein, J. (2026). The Meritocratic Consensus and Stratification in Higher Education. Journal of Economic Perspectives, 40(4), 3–30. https://doi.org/10.1257/jep.20251487", "why": "入学者の学力による大学の階層化は1960年代から安定している一方、教育支出の階層化は1970年以降大きく強まったことを示し、その経済的な正当化には実証の裏付けが乏しいことを論じた。", "explain": {"basis": "抄録", "basis_note": "Journal of Economic Perspectivesの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "米国の大学が入学前の学力・家庭の背景・教育資源で強く階層化している「能力主義の合意」を調べ、学力による階層化は1960年代から安定している一方、教育支出の階層化は1970年以降大きく強まったことを示した（抄録）。", "p2": "学力の高い学生（多くは高所得家庭の出身）が通う大学ほど教育に多く支出するという構造が、どう変化し、経済的に正当化できるのかは十分に検討されていなかった（抄録）。背景：q-補完性は、学力の高い学生ほど追加の教育資源から多く得るという考え方。", "p3": "大学ごとの入学者の学力と教育支出の関係の長期的な推移を調べ、学力と資源のq-補完性、高い人的資本の社会的な収益の凸性、大学前の学習への誘因という正当化の根拠を検討した（抄録）。", "p4": "評価の対象は、学力による大学の階層化と教育資源の階層化の時系列、スポーツ・縁故・アファーマティブアクションなど学力以外の入学基準の寄与、カリフォルニアのCalGrantなどの公的な奨学金の役割である（抄録）。", "p5": "学力による階層化は1960年代からほぼ安定していたが、教育資源の階層化は1970年以降、私立・公立とも急に強まった。学力以外の入学基準の役割は二次的で、正当化の根拠には実証の裏付けが乏しかった。最近の10年は、低学力層が通う大学への公的な奨学金の増加で資源の階層化は強まっていなかった（抄録）。", "p6": "抄録の範囲では、データの出所と期間の詳細は確かめられない。解釈：資源の階層化と教育の成果の格差の因果関係は抄録の範囲では示されていない。", "fun": "アメリカでは、成績の良い学生が集まる大学ほど、学生一人に多くのお金をかけて教えています。この研究は、成績による大学の序列は1960年代からあまり変わらないのに、お金のかけ方の差は1970年以降に大きく広がったことを示しました。その差を正当化する理由には証拠が乏しいという指摘が、能力主義の当たり前を問い直していて面白いところです。", "unverified": "抄録のみ読んだ。データの出所と、支出の差の大きさの数値は未確認。"}}, {"id": "jn08", "rank": 8, "field": "経済学", "headline": "炭素除去の永続性リスクを測る指標を提案", "title": "The carbon at risk measure for managing carbon removal risk and guiding portfolio construction", "url": "https://doi.org/10.1038/s41558-026-02785-9", "authors": "Bali Lee ほか", "venue": "Nature Climate Change", "date": "2026-11-06", "sjr": 7.978, "citescore": 39.0, "citescore_year": "2025", "apa": "Lee, B., Bearpark, T., Kit, O., Meth-Cohn, D., Olbert, F., Venmans, F., Walker, G., Young, P., & Groom, B. (2026). The carbon at risk measure for managing carbon removal risk and guiding portfolio construction. Nature Climate Change. https://doi.org/10.1038/s41558-026-02785-9", "why": "金融のバリュー・アット・リスクにならい、契約した炭素除去量と実際の貯留量の不足を確率的に測る「カーボン・アット・リスク」を提案し、森林と地中貯留で較正して、組み合わせによる裾のリスクの管理を示した。", "explain": {"basis": "本文", "basis_note": "Nature Climate Changeの出版社HTML本文（CaRの定義Box 1、森林と地中貯留の節、考察、方法の見出しと図のキャプション）を読んだ", "preprint": false, "p1": "炭素除去の市場で、契約した除去量に対して実際に貯留される量の不足を確率的に測る「カーボン・アット・リスク（CaR）」を、金融のバリュー・アット・リスクにならって提案し、森林と地中貯留で較正して、ポートフォリオによる裾のリスクの管理を示した（抄録、Box 1）。", "p2": "炭素除去の市場には、除去した炭素が戻らないこと（永続性）のリスクを測る標準化された定量的な指標がなく、技術ごとの定性的な評価にとどまっていた（抄録、Main）。背景：バリュー・アット・リスクは、ある信頼水準で一定期間に生じうる損失の大きさを表す金融の指標。", "p3": "契約量Q^Tに対し、期間Tの貯留量の下側分位点を使ってCaR_α^T = Q^T − D_{1−α}^T と定義した（Box 1）。具体例：1,000kgの契約で95%のCaRが397kgなら、契約量の39.7%が不足しうる（Box 1）。森林はEFFISの2002〜2023年の焼失データからの火災の確率的な再標本化と決定論的な再生を組み合わせた5,000回のモンテカルロ・シミュレーションで、地中貯留はStorage Security Calculatorで評価した（図2–3、方法）。", "p4": "カリフォルニア、マトグロッソ、パプアの森林と、規制の強弱の異なる地中貯留でCaRを求め、プロジェクト間の相関のもとでの分散による低減と、同じ永続性の目標を満たす最小費用のポートフォリオを調べた（図2–4）。", "p5": "カリフォルニアの単一プロジェクトの200年の95% CaRは70%を超え、地中貯留の95% CaRは規制のよい沖合の0.15%から規制の弱い陸上の17%まで幅があった（抄録）。カリフォルニアとマトグロッソは年平均焼失率が1.81%と1.84%で似るが、再生率が2.0%と3.0%で異なりCaRの差を生んだ（図2a）。束ねると固有の火災リスクは分散されるが共通要因の部分は残り、相関が1に近づくと低減は0に近づいた（図2c）。", "p6": "基準のCaRは22年の記録の再標本化に基づき観測より大きな火災を生まないため、裾のリスクを過小評価しうる。上側の裾を一般化パレート分布で当てはめると100年のCaRは約23%上がり、パプアでは火災だけの評価が100年のCaRを2.6倍過小評価した（森林の節）。解釈：転換圧力や制度の変化など火災以外のリスクの定量化はなお課題である。", "fun": "木を植えたり地中に二酸化炭素を閉じ込めたりして「炭素を減らしました」と売る取引がありますが、山火事で森が燃えれば炭素は空に戻ってしまいます。この研究は、金融の「最悪どれだけ損をしうるか」という考え方を使い、約束した量のうちどれだけが失われうるかを確率で示す物差しを作りました。いろいろな場所や方法を組み合わせると危険を減らせるという投資の知恵が、環境にも使える点が面白いところです。", "unverified": "最小費用のポートフォリオの具体的な値と、3つの調達規則の比較の結果は確認していない。"}}, {"id": "jn09", "rank": 9, "field": "統計学", "headline": "空間依存を除くとランダムフォレストの解釈が正しくなる", "title": "Accounting for spatial dependence in random forests improves ecological understanding and enhances prediction", "url": "https://doi.org/10.1002/ecy.70567", "authors": "Matthew J. Heaton ほか", "venue": "Ecology", "date": "2026-11-06", "sjr": 1.767, "citescore": 7.0, "citescore_year": "2025", "apa": "Heaton, M. J., Dumelle, M., Bladen, K. K., Hill, R. A., & Rhodes, J. S. (2026). Accounting for spatial dependence in random forests improves ecological understanding and enhances prediction. Ecology, 107(11). https://doi.org/10.1002/ecy.70567", "why": "シミュレーションと1,061の河川流域の分析から、空間依存を無視したランダムフォレストは位置の代理となる変数の重要度を過大に評価し、空間的な脱相関で予測と解釈の両方が改善することを示した。", "explain": {"basis": "抄録", "basis_note": "Ecologyの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "生態学でよく使われるランダムフォレスト（RF）で空間依存を無視すると、位置の代理となる変数の重要度が過大評価されることを示し、空間的な脱相関の変換で予測と解釈の両方が改善することを示した（抄録）。", "p2": "RFは環境変数の非線形な関係のモデル化と変数重要度の要約に広く使われるが、空間で集めた観測データは空間依存を持つことが多く、無視するとRFが位置の代理となる変数に重要度を誤って与えうる（抄録）。背景：変数重要度は、各変数が予測にどれだけ寄与するかを示す指標。", "p3": "標準のRF、空間的な残差のモデル化を加えたRF、モデルによらない空間的な脱相関の変換の3つを比べた（抄録）。脱相関の変換の具体的な式は抄録に記載がない。", "p4": "データ生成の仕組みが分かったシミュレーションと、北米の1,061の河川流域の流況の分析で、保留したデータでの予測性能と変数重要度による解釈を比べた（抄録）。", "p5": "シミュレーションでは、空間的に構造化した雑音の変数や生の座標が標準のRFで過大な重要度を得たが、脱相関はこれらの人工物を減らし、関連する予測変数をより一貫して復元した。河川流量の応用では、脱相関が保留データの予測を改善し、解釈を空間的に滑らかな大まかな勾配から、流況の季節性と機構的に直接つながる水文・土壌の変数へ移した（抄録）。", "p6": "抄録の範囲では、改善の大きさの数値と、空間依存の強さによる違いは確かめられない。解釈：脱相関が本当の空間的な原因の効果まで取り除いてしまう可能性については、抄録からは判断できない。", "fun": "地図の上で近い場所どうしは、似た気候や土の性質を持ちがちです。そのため、ランダムフォレストというAIで「何が川の流れを決めるか」を調べると、本当の原因ではなく「どこにあるか」の代わりになる変数を重要だと勘違いすることがあります。この研究は、場所の似かよりを取り除いてから分析すると、予測も解釈も正しくなることを示しました。近さと原因を見分ける点が面白いところです。", "unverified": "抄録のみ読んだ。脱相関の具体的な方法と改善の数値は未確認。"}}, {"id": "jn10", "rank": 10, "field": "統計学", "headline": "過去の大地震の統計で地震サイクルモデルを較正", "title": "Bayesian Calibration of Dynamic Models of Earthquake Sequences Using Observations From Past Large Earthquakes", "url": "https://doi.org/10.1029/2026jb034422", "authors": "Hojjat Kaveh ほか", "venue": "Journal of Geophysical Research: Solid Earth", "date": "2026-11-06", "sjr": 1.803, "citescore": 7.5, "citescore_year": "2025", "apa": "Kaveh, H., Dunbar, O. R. A., Avouac, J.-P., & Stuart, A. M. (2026). Bayesian Calibration of Dynamic Models of Earthquake Sequences Using Observations From Past Large Earthquakes. Journal of Geophysical Research: Solid Earth, 131(11). https://doi.org/10.1029/2026jb034422", "why": "個々の地震の時系列ではなく、エルゴード性に基づく再来間隔などの要約統計を観測量とし、微分を使わないアンサンブル・カルマン逆解析で、地震サイクルの物理モデルの不均質なパラメータを不確実性つきで推定した。", "explain": {"basis": "抄録", "basis_note": "Journal of Geophysical Research: Solid Earthの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "地震サイクルの物理モデルのパラメータを、過去の大地震の観測から得られる統計量で較正するベイズの逆問題の枠組みを示し、限られた地点の古地震学的な統計量からパラメータを逆算できることを合成実験で示した（抄録）。", "p2": "時間に依存する地震ハザードの評価に物理モデルを使うには、模擬した地震の系列が過去の再来の統計や規模を再現するようにパラメータを較正する必要があるが、非線形の偏微分方程式、未知の初期条件、まばらで不完全で雑音のある記録のため難しかった（抄録）。背景：エルゴード性は、十分長い時間の平均が初期条件によらない性質。", "p3": "個々の地震の時系列を合わせる代わりにエルゴード性を利用し、平均の再来間隔、変動係数、バースト性、平均の地震時すべりなどの空間分布した定常的な要約統計を観測量とし、観測の雑音と検出の閾値も統計量の構成に組み込んだ（抄録）。", "p4": "逆問題を微分を使わないアンサンブル・カルマン逆解析で解き、パラメータから統計量への写像のガウス過程の代理モデルでMCMCを効率化する「エミュレート・サンプル」戦略で不確実性を定量化し、現実的な雑音を加えた合成実験で検証した（抄録）。", "p5": "合成実験では、限られた数の観測点で古地震学から観測できる統計量から、モデルのパラメータを逆算できることが示唆された（抄録）。精度の具体的な数値は抄録に記載がない。", "p6": "抄録の範囲では、実際の地震の記録への適用は示されていない。解釈：要約統計に情報を絞るため、統計量に表れにくいパラメータは識別しにくい可能性がある。", "fun": "大地震がいつ起きるかを物理の計算で予測するには、断層の性質を表す数値をうまく決める必要があります。でも過去の地震の記録はまばらで、地震の起き方は始まりのわずかな違いで大きく変わります。この研究は、個々の地震を合わせるのをやめ、「平均で何年おきに起きるか」のような長い目で見た統計を合わせることで、数値を確率的に決める方法を作りました。細部ではなく傾向に注目する発想が面白いところです。", "unverified": "抄録のみ読んだ。対象とした断層モデルと推定の精度の数値は未確認。"}}, {"id": "jn11", "rank": 11, "field": "経済学", "headline": "相関した情報があっても協力は増えなかった", "title": "Sustaining cooperation with correlated information: an experimental test", "url": "https://doi.org/10.1017/eec.2026.10069", "authors": "Yongping Bao ほか", "venue": "Experimental Economics", "date": "2026-11-06", "sjr": 1.619, "citescore": 4.1, "citescore_year": "2025", "apa": "Bao, Y., Dvorak, F., & Fehrler, S. (2026). Sustaining cooperation with correlated information: an experimental test. Experimental Economics, 1–18. https://doi.org/10.1017/eec.2026.10069", "why": "行動に応じて相関するシグナルがあれば協力を維持できるという理論を実験で検証し、相関を使う戦略を採る被験者は多いものの、協力の水準は相関のない対照と変わらないことを示した。", "explain": {"basis": "本文", "basis_note": "Cambridge Coreの出版社HTML本文（実験計画§3、協力の結果§5.1、結論§6）を読んだ", "preprint": false, "p1": "ノイズのある公的な観測の無限回繰り返し囚人のジレンマで、行動に応じて相関するシグナルがあれば協力を維持できるという理論を実験で検証し、相関を使う戦略を採る被験者は多いが、協力の水準は相関のない対照と変わらないことを示した（抄録、§6）。", "p2": "相手の行動を正確に観測できない繰り返しゲームでは協力の維持が難しく、理論は行動に依存して相関するシグナルによる解決を示していたが、人が相関した情報から正しく推論できるかは疑問だった（§1、§6）。背景：グリム・トリガー戦略は、裏切りの兆候を一度でも見たら以後ずっと裏切る戦略。", "p3": "被験者間の4条件（シグナルの相関の有無×事前のコミュニケーションの有無）で、各ラウンドに協力か裏切りを同時に選び、シグナルは確率0.2で誤った行動を示す。相関ありでは、行動が同じなら完全に相関したシグナルを、異なれば独立なシグナルを受け取り、「2つの公的なシグナルが一致する限り協力する」グリム・トリガーで協力が均衡として支えられる（§3、§6）。", "p4": "評価は、平均の協力率、最初の5ラウンドの協力の推移、推定した戦略の選択、事前のコミュニケーションの内容で、参加者と対戦の2方向にクラスタ化した標準誤差で比べた（§4–5）。", "p5": "事前のコミュニケーションありの平均協力率はCor-Chatで0.78、NoCor-Chatで0.79、なしではCor-NoChatで0.35、NoCor-NoChatで0.31で、相関の有無で差がなかった（§5.1、図3）。コミュニケーションありの後半3つのスーパーゲームで、5ラウンド後の協力率の低下はCor-Chatで19ポイント、NoCor-Chatで9ポイントだった（§5.1）。相関を考慮する戦略は使われたが、独立なシグナルでも話し合いがあると行動が寛容になった（抄録）。", "p6": "著者は、人が相関した情報から正しく推論するのが難しいという先行研究と結果を関連づける（§6）。解釈：相関の構造が単純な実験室の設定での結果で、より複雑な情報の構造では結果が異なりうる。", "fun": "お互いの行動がはっきり見えないと、相手が裏切ったのか見間違いなのか分からず、協力は崩れやすくなります。理論では、二人に「そろって同じ合図」が届く仕組みがあれば協力を保てるとされていました。ところが実験では、その仕組みを使う人は多かったのに、協力の割合は仕組みのない場合と変わりませんでした。人は話し合いや寛容さで協力を保つという点が面白いところです。", "unverified": "推定した戦略ごとの割合は確認していない。"}}, {"id": "jn12", "rank": 12, "field": "社会学", "headline": "追悼記念日には包摂的な被害者意識が弱まる", "title": "Beyond remembrance: Genocide commemoration as a lens for understanding collective victimhood and contemporary conflicts", "url": "https://doi.org/10.1111/pops.70213", "authors": "Mengyao Li ほか", "venue": "Political Psychology", "date": "2026-11-06", "sjr": 1.938, "citescore": 7.6, "citescore_year": "2025", "apa": "Li, M., Grigoryan, A., Halabi, S., & Baumert, A. (2026). Beyond remembrance: Genocide commemoration as a lens for understanding collective victimhood and contemporary conflicts. Political Psychology, 47(6). https://doi.org/10.1111/pops.70213", "why": "アルメニアとイスラエルで追悼記念日とその2か月後を比べる自然な縦断研究から、記念日には存在への脅威が高まり、他集団の被害も認める包摂的な被害者意識が下がることを示した。", "explain": {"basis": "抄録", "basis_note": "Political Psychologyの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "アルメニアとイスラエルで、ジェノサイドの追悼記念日の前後を比べる並行した自然な縦断研究から、記念日には存在への脅威が高まり、包摂的な被害者意識が下がることを示し、追悼が対立的・和解的な態度の両方に結びつく競合する心理過程を明らかにした（抄録）。", "p2": "ジェノサイドの追悼は集団的な被害者意識を作り世代に伝える社会的な仕組みだが、それが現在の紛争にどんな意味を持つかは十分に調べられていなかった（抄録）。背景：包摂的な被害者意識は、自集団の被害の経験を他集団の被害の認識にも広げる意識。", "p3": "アルメニア人虐殺とホロコーストの追悼日の時期（時点1）と、注目の低い2か月後（時点2）に参加者を調べ、時点1では追悼への個人的な関与から態度への間接効果を分析した（抄録）。", "p4": "評価の指標は、存在への脅威、包摂的な被害者意識、アゼルバイジャンとの和解の意思、パレスチナとの紛争への態度、ウクライナの戦争被害者への態度と支援の意思、道徳的な権利意識と義務感である（抄録）。標本の大きさは抄録に記載がない。", "p5": "両国で、記念日の時期には2か月後より存在への脅威が高く、包摂的な被害者意識が低かった。アルメニアでは記念日にアゼルバイジャンとの和解の意思が低く、イスラエルではパレスチナとの紛争への態度は変わらなかったが、ウクライナの被害者を助ける意思が高かった。追悼への関与は、脅威・権利意識・包摂の低下を介して紛争支持的な態度と、道徳的な義務感を介して和解的・向社会的な態度の両方と結びついた（抄録）。", "p6": "抄録の範囲では、標本の大きさと代表性、時点1と2の違いが記念日以外の出来事による可能性は確かめられない。解釈：自然な縦断の比較で、記念日の因果効果を厳密に識別したものではない。", "fun": "過去の悲劇を忘れないための追悼の日は、人々の心にどう働くのでしょうか。この研究では、追悼の時期には「自分たちの存在が脅かされている」という感覚が強まり、他の民族の苦しみに目を向ける気持ちが弱まる一方、「助けなければ」という義務感を通じて思いやりも生まれていました。同じ追悼が対立と和解の両方の種になりうるという点が面白いところです。", "unverified": "抄録のみ読んだ。標本の大きさと効果の大きさは未確認。"}}, {"id": "jn13", "rank": 13, "field": "機械学習", "headline": "転移可能な深層量子モンテカルロで励起状態を計算", "title": "Ab initio simulation of excited-state potential energy surfaces with transferable deep quantum Monte Carlo", "url": "https://doi.org/10.1038/s43588-026-01065-y", "authors": "Zeno Schätzle ほか", "venue": "Nature Computational Science", "date": "2026-11-06", "sjr": 4.252, "citescore": 25.4, "citescore_year": "2025", "apa": "Schätzle, Z., Szabó, P. B., Cuzzocrea, A., Mezera, M., & Noé, F. (2026). Ab initio simulation of excited-state potential energy surfaces with transferable deep quantum Monte Carlo. Nature Computational Science. https://doi.org/10.1038/s43588-026-01065-y", "why": "重みの共有と電子状態の動的な並べ替えで、ニューラルネットワーク波動関数を分子の形の間で転移できるように最適化し、励起状態のポテンシャル曲面を最高精度で最大2桁安く求めた。", "explain": {"basis": "本文", "basis_note": "Nature Computational Scienceの出版社HTML本文（Main、結果と考察、方法の見出しと図のキャプション）を読んだ", "preprint": false, "p1": "ニューラルネットワーク波動関数を分子の形の間で転移可能に変分最適化する深層学習の量子モンテカルロ（DeepQMC）を作り、基底・励起状態のポテンシャルエネルギー曲面（PES）とその交差を、点ごとの計算より最大約2桁少ない費用で最高水準の精度で求めた（抄録、Main）。", "p2": "励起状態の精密な量子化学計算は重く、曲面全体が必要なときは安価で精度の低い方法に頼りがちで、従来の方法は系ごとに専門家による手法の選択と検証が必要だった（抄録、結果と考察）。背景：PESは原子の配置ごとの電子のエネルギーで、光を吸収した後の構造変化などを決める。", "p3": "分子の形の間の波動関数の類似性を利用して、多数の形を1つの共有の変分の関数形で同時に最適化し、電子状態の間でパラメータを共有し、形ごとのエネルギーの推定で状態を動的に並べ替えて直交化する（方法、Main）。具体例：エチレンのねじれに沿った一重項の曲面と、円錐交差の近くの相対エネルギーを計算する（図1）。", "p4": "エチレン、炭素二量体、メチレンインモニウム陽イオン、96電子のルブレドキシン活性部位のモデルという4つの難しい励起状態の曲面で、点ごとのNES-VMCやMR-CIの参照と、相対エネルギーの平均絶対誤差と計算費用を比べ、パラメータ共有と動的な並べ替えの除去実験も行った（結果、図1–2）。", "p5": "エチレンでは、従来の点ごとの深層QMCの結果を約5分の1の計算で、教師つきの事前学習なしに上回った（図1a）。メチレンインモニウム陽イオンでは、10点で点ごとの計算より約1桁、100点の全曲面でさらに1桁費用を下げつつMR–CISDの参照を再現した（図2e–g）。共有の最適化は、絶対エネルギーが高くても誤差の打ち消しで相対エネルギーの誤差を下げた（図2c）。", "p6": "著者は、方法が固定した分子形の集合（数百〜数千）を対象とし、高次元の曲面には電子と原子核の移動を組み合わせたサンプリングが要り、表した状態の範囲の外から状態が入れ替わる不連続や、電子数の異なる系への拡張が課題だとする（結果と考察の結び）。", "fun": "分子が光を吸ってエネルギーの高い状態になると、形を変えたり壊れたりします。その様子を正確に計算するには、分子の形ごとに膨大な計算を繰り返す必要がありました。この研究は、似た形の分子どうしは答えも似ていることを利用し、一つのAIにまとめて学ばせることで、計算の手間を最大で約2桁減らしました。似たものをまとめて解く工夫が面白いところです。", "unverified": "各系の相対エネルギーの平均絶対誤差の具体的な値は確認していない。"}}, {"id": "jn14", "rank": 14, "field": "社会学", "headline": "自由移動を掲げる西アフリカでも移民は負担と見なされる", "title": "Regionalism and the categorization of migrants in Africa – comparing ECOWAS and the SADC", "url": "https://doi.org/10.1186/s40878-026-00599-4", "authors": "Dorothea Biaback Anong ほか", "venue": "Comparative Migration Studies", "date": "2026-11-06", "sjr": 1.158, "citescore": 4.8, "citescore_year": "2025", "apa": "Biaback Anong, D., & Moyo, K. (2026). Regionalism and the categorization of migrants in Africa – comparing ECOWAS and the SADC. Comparative Migration Studies. https://doi.org/10.1186/s40878-026-00599-4", "why": "ECOWASとSADCの比較から、進んだ自由移動の制度と共通のアイデンティティを掲げるECOWASでも、域内の移民が経済的な負担や安全上の脅威として扱われる逆説を示した。", "explain": {"basis": "抄録", "basis_note": "Comparative Migration Studiesの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "西アフリカ諸国経済共同体（ECOWAS）と南部アフリカ開発共同体（SADC）を比べ、地域の自由移動の枠組みと、移民を「望ましい」「望ましくない」と分類する政治が互いに形づくり合うことを示した（抄録）。", "p2": "アフリカの地域的な自由移動の可能性と限界を理解するうえで、移民の分類の政治が果たす役割は十分に分析されていなかった（抄録）。背景：構成主義は、移民の望ましさのような区分が社会的・政治的に作られると考える立場。", "p3": "比較地域主義と構成主義の立場から、法律と政策の文書の分析と両地域の政策関係者と専門家への半構造化面接を組み合わせ、ガーナとナイジェリア（ECOWAS）、南アフリカ（SADC）を事例とした（抄録）。", "p4": "分析の軸は、移民の望ましさを形づくるアイデンティティ、経済的な有用性、安全保障の3つで、自由移動の制度と移民の分類の関係を比べた（抄録）。", "p5": "ECOWASは、進んだ自由移動の制度と西アフリカ・汎アフリカの共通のアイデンティティを掲げながら、域内の移民を経済的な負担や安全上の危険として構成していた。SADCには一貫した自由移動の枠組みと地域の市民という区分がなく、移民の分類は主に技能と「アフリカ人」の移住をめぐる人種化された観念に沿っていた（抄録）。", "p6": "抄録の範囲では、面接の人数と選び方は確かめられない。解釈：3か国の事例に基づく質的な比較で、地域全体への一般化には注意が要る。", "fun": "国境を越えて自由に行き来できる仕組みを作っても、人々が移民を歓迎するとは限りません。この研究は、アフリカの2つの地域共同体を比べ、自由に移動できる制度が進んだ西アフリカでさえ、近隣国からの移民が「負担」や「危険」と見なされていることを示しました。制度の上の自由と心の中の線引きのずれが見える点が面白いところです。", "unverified": "抄録のみ読んだ。面接の対象者の人数と構成は未確認。"}}, {"id": "jn15", "rank": 15, "field": "機械学習", "headline": "63か国の運転映像で視覚言語モデルを評価する基盤", "title": "ScenePilot-4K: A Large-Scale First-Person Dataset and Benchmark for Vision-Language Models in Autonomous Driving", "url": "https://doi.org/10.26599/commtr.2026.9640069", "authors": "Yujin Wang ほか", "venue": "Communications in Transportation Research", "date": "2026-11-06", "sjr": 1.97, "citescore": 13.6, "citescore_year": "2025", "apa": "Wang, Y., Zheng, Y., Fan, W., Wang, T., Chu, H., Zhang, L., Gao, B., Tian, D., Wang, J., & Chen, H. (2026). ScenePilot-4K: A Large-Scale First-Person Dataset and Benchmark for Vision-Language Models in Autonomous Driving. Communications in Transportation Research. https://doi.org/10.26599/commtr.2026.9640069", "why": "公開の運転動画から3,847時間・2,770万フレームのデータセットを作り、場面理解・空間知覚・動作計画などの軸で視覚言語モデルを評価するベンチマークを整えた。", "explain": {"basis": "本文", "basis_note": "出版社のPDF本文（データセットと注釈の手順§3、ベンチマーク§4、結果§5の冒頭、限界の節）を読んだ", "preprint": false, "p1": "公開のオンライン運転動画から、3,847時間・27.7M（M＝百万）枚の前方フレーム（63の国・地域、1,210都市）からなる一人称の運転データセットScenePilot-4Kと、視覚言語モデル（VLM）を評価するベンチマークScenePilot-Benchを作った（抄録）。", "p2": "自動運転向けのVLMの評価は一般的な画像の説明や質問応答にとどまりがちで、安全を意識した場面理解・空間知覚・動作計画と、地域をまたぐ汎化を体系的に測るデータが不足していた（抄録、§1）。", "p3": "元の動画の最初と最後の180秒を除いて残りを2Hzで標本化し、10フレームの5秒のクリップに分け、事前学習済みのモデルで場面の自然言語の説明、危険度の評価、主要な参加者の注釈、自車の軌跡、カメラのパラメータを付ける多段の注釈の手順を作った（§3.2）。位置が不明な動画は地理の統計から除き、公開例では顔とナンバープレートを隠した（§3）。", "p4": "ベンチマークは場面理解、空間知覚、動作計画、GPTによる意味的な整合の4軸と、地域・交通の種類をまたぐ汎化の設定からなり、商用・オープン・運転特化の21のVLMと、ScenePilot-4Kで微調整したQwenを比べ、重みづけへの感度も調べた（§4–5）。", "p5": "現在のVLMは場面の高次の意味の理解では健闘したが、幾何を意識した知覚、計画志向の推論、地域をまたぐ汎化ではなお大きな限界があった（抄録、結びの節）。モデルごとの得点の具体的な値は、読んだ範囲では確認していない。", "p6": "著者は、評価が開ループで閉ループの運転制御への影響を直接は測らないこと、一部の注釈がVLMと幾何的な再構成による自動生成で雑音が残りうること、地域汎化の設定がカメラ・天候・地域分布の全体を覆わないこと、単一フレームと複数フレームの比較や複数シードでの再学習をしていないことを限界に挙げる（限界の節）。生の動画は元のプラットフォームでのみ利用できる（§3）。", "fun": "自動運転のAIを鍛えるには、世界中のさまざまな道路の映像が必要です。この研究は、インターネットに公開された車載カメラの動画を63の国と地域から集め、AIの助けを借りて「どこが危ないか」「次にどう動くべきか」といった説明を付けた巨大な教材を作りました。最新のAIでも、景色の意味は分かるのに距離や進路の判断はまだ苦手だと分かった点が面白いところです。", "unverified": "各モデルの得点の具体的な値は確認していない。"}}, {"id": "jn16", "rank": 16, "field": "機械学習", "headline": "フレアとCMEから陽子現象と磁気嵐を同時に予測", "title": "SOLACE: A Contrastive Learning Framework for Predicting Solar Proton Events and Geomagnetic Storms from Flare–Coronal Mass Ejection Events", "url": "https://doi.org/10.3847/1538-4365/aeb2db", "authors": "Shuainan Yan ほか", "venue": "Astrophysical Journal, Supplement Series", "date": "2026-11-06", "sjr": 3.269, "citescore": 13.7, "citescore_year": "2025", "apa": "Yan, S., Zou, Y., Shi, L., Cui, Y., Luo, B., Dong, E., & Cai, Y. (2026). SOLACE: A Contrastive Learning Framework for Predicting Solar Proton Events and Geomagnetic Storms from Flare–Coronal Mass Ejection Events. The Astrophysical Journal Supplement Series, 287(1), 37. https://doi.org/10.3847/1538-4365/aeb2db", "why": "太陽の噴出ごとにフレアとCMEの特徴と後続の擾乱を記録したデータベースを作り、対照学習と特徴の相互作用のモデルで、陽子現象と磁気嵐の確率予測と過去事例の検索を行った。", "explain": {"basis": "抄録", "basis_note": "Astrophysical Journal Supplement Seriesの抄録を使用", "preprint": false, "short": true, "p1": "太陽の噴出ごとにフレアとコロナ質量放出（CME）の観測特徴と、その後の太陽陽子現象（SPE）と磁気嵐（GMS）の発生を記録したデータベースを作り、両方の擾乱を確率予測する枠組みSOLACEを示した（抄録）。", "p3": "噴出を標本の単位とし、対照学習と注意つきの因子分解機による特徴の相互作用のモデルを組み合わせ、過去の事例の検索と確率予測を行った（抄録）。", "p5": "SPEの予測でF1は0.734、誤報率0.287、AUC0.951、GMSではF1 0.733、誤報率0.311、AUC0.924だった。SPEはCMEの速度・角度幅などに、GMSはCMEの角度幅と発生源の位置に主に依存した（抄録）。", "fun": "太陽で大きな爆発が起きると、高エネルギーの粒子や磁気の嵐が地球に届き、人工衛星や通信、送電網に悪影響を与えることがあります。この研究は、一つの爆発から両方の嵐が起きるかをまとめて予測するAIを作りました。爆発の速さや広がりが予測の決め手になると分かった点も面白いところです。", "unverified": "予測の先行時間とデータベースの期間は抄録では未確認。"}}, {"id": "jn17", "rank": 17, "field": "機械学習", "headline": "能動学習で急速充電用の電解液添加剤を発見", "title": "Machine Learning-Driven Electrolyte Additive Discovery for Ultrafast Charging of Sodium Metal Batteries", "url": "https://doi.org/10.1021/jacs.6c10960", "authors": "Yuanchang Ye ほか", "venue": "Journal of the American Chemical Society", "date": "2026-11-06", "sjr": 5.491, "citescore": 22.0, "citescore_year": "2025", "apa": "Ye, Y., Cheng, L., Zou, M., Dong, Y., Xue, P., Li, C., Gong, H., Ma, L., Xie, J., & Zheng, Q. (2026). Machine Learning-Driven Electrolyte Additive Discovery for Ultrafast Charging of Sodium Metal Batteries. Journal of the American Chemical Society. https://doi.org/10.1021/jacs.6c10960", "why": "ガウス過程回帰による能動学習で添加剤の候補を絞り込み、微量の添加でナトリウム金属電池の界面を改善して、200Cでの5万回の安定な充放電を実現した。", "explain": {"basis": "抄録", "basis_note": "Journal of the American Chemical Societyの抄録を使用", "preprint": false, "short": true, "p1": "ガウス過程回帰による能動的な機械学習で電解液添加剤を探索し、微量（0.02M）のクロロジフルオロ酢酸ナトリウムが、ナトリウム金属電池の超急速充電を可能にする界面をつくることを見いだした（抄録）。", "p3": "鍵となる物理化学的な記述子を反復的に絞り込んで候補を選び、理論計算とその場観察で、添加剤がPF6⁻陰イオンの狙った分解を促してNaFに富む界面をつくる仕組みを調べた（抄録）。", "p5": "Na||Na3V2(PO4)3電池は200Cという極端な速さで5万回を超える安定な充放電を示し、正極の高い充填量や、負極のない構成などの厳しい条件でも性能を保った（抄録）。", "fun": "電池をとても速く充電しようとすると、電極の表面の膜が邪魔をして、電気を運ぶイオンが通りにくくなります。この研究はAIに候補を次々と提案させ、ほんのわずか加えるだけでイオンの通り道を整える添加剤を見つけました。5万回の充放電にも耐えたという結果と、AIが実験の道案内をした点が面白いところです。", "unverified": "能動学習で調べた候補の数と探索の効率は抄録では未確認。"}}, {"id": "jn18", "rank": 18, "field": "経営学", "headline": "スタートアップと大企業の協業を生む条件の組み合わせ", "title": "From Pitch to Partnership: Startup Engagement Strategies for Securing Corporate Interest", "url": "https://doi.org/10.1111/radm.70067", "authors": "Elie Saad ほか", "venue": "R and D Management", "date": "2026-11-06", "sjr": 1.839, "citescore": 12.0, "citescore_year": "2025", "apa": "Saad, E., Gaim, M., & Nair, S. (2026). From Pitch to Partnership: Startup Engagement Strategies for Securing Corporate Interest. R&D Management. https://doi.org/10.1111/radm.70067", "why": "ファジー集合の質的比較分析で、大企業がスタートアップに関心を持つかが、売り込みの仕方、協業の機会、技術の特徴の組み合わせと、企業の目的・関与の好みによって決まることを示した。", "explain": {"basis": "抄録", "basis_note": "R&D Managementの抄録を使用", "preprint": false, "short": true, "p1": "大企業とスタートアップの協業の初期段階で、大企業の関心を引く条件の組み合わせを、ファジー集合の質的比較分析（fsQCA）で明らかにした（抄録）。", "p3": "売り込みの仕方、協業の機会、技術の特徴の組み合わせを、企業の目的（必要主導か発見主導か）と関与の好み（取引的か育成的か）に応じて分析した（抄録）。", "p5": "協業を可能にする構成として、プラグ・アンド・プレイ型、狙いを定めた共同開発型、創発型などを見いだし（抄録では4つの構成とされる）、大企業の関心は単一の要因ではなく要因の組み合わせで決まることを示した（抄録）。", "fun": "スタートアップが大企業に売り込むとき、プレゼンの上手さだけで結果が決まるわけではありません。この研究は、何を求めている会社に、どんな技術を、どう見せるかの組み合わせで関心の持たれ方が変わることを示しました。成功の型が一つではなく複数あるという点が面白いところです。", "unverified": "分析した事例の数と、4つ目の構成の内容は抄録では未確認（抄録には3つの名前のみ記載）。"}}, {"id": "jn19", "rank": 19, "field": "経営学", "headline": "女性取締役が多い企業ほどESGの不祥事が少ない", "title": "The Influence of Board Gender Diversity on ESG Controversies: Do Family Control and CSR Committee Matter?", "url": "https://doi.org/10.1002/bse.71762", "authors": "Hicham Sbai ほか", "venue": "Business Strategy and the Environment", "date": "2026-11-06", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Sbai, H., Ouiakoub, M., & Hamrouni, A. (2026). The Influence of Board Gender Diversity on ESG Controversies: Do Family Control and CSR Committee Matter? Business Strategy and the Environment. https://doi.org/10.1002/bse.71762", "why": "フランスの上場企業69社の13年間のパネルで、女性取締役の比率が高いほどESGの不祥事への露出が少なく、その関係は家族支配の企業で強く、CSR委員会があると弱まることを示した。", "explain": {"basis": "抄録", "basis_note": "Business Strategy and the Environmentの抄録を使用", "preprint": false, "short": true, "p1": "フランスの上場企業で、取締役会の女性比率が高いほどESGの不祥事への露出が少なく、その関係が家族支配の企業で強まり、CSR委員会があると弱まることを示した（抄録）。", "p3": "SBF120指数の69社の2011〜2023年のパネル（897企業年）で、システムGMMによる動的パネルモデルを推定した。注意に基づく視点から、女性取締役は監視だけでなく取締役会が何に気づくかも形づくると論じた（抄録）。", "p5": "女性比率の高さは不祥事への露出の少なさと関連し、家族支配の企業で強まった（ただし従属変数の測り方に敏感）。専任のCSR委員会があると効果は弱まり、責任が特定の組織に集中する代替の論理と整合した（抄録）。", "fun": "取締役に女性が多い会社は、環境や人権をめぐる不祥事が少ない傾向がありました。ところが、ESG専門の委員会を作った会社では、その効果が弱まっていたのです。「専門の係を作ると、ほかの人が気にしなくなる」という人間くさい仕組みが、会社の統治にも表れている点が面白いところです。", "unverified": "効果の大きさの数値は抄録では未確認。"}}, {"id": "jn20", "rank": 20, "field": "組織行動・心理的安全性", "headline": "制度上の支援が「支えられた」実感になる条件", "title": "Strategic support: lessons learned from staff experiences in UK higher education during the pandemic", "url": "https://doi.org/10.1057/s41599-026-09408-w", "authors": "Rasha Kassem ほか", "venue": "Humanities and Social Sciences Communications", "date": "2026-11-06", "sjr": 0.904, "citescore": 5.7, "citescore_year": "2025", "apa": "Kassem, R., & Mitsakis, F. (2026). Strategic support: lessons learned from staff experiences in UK higher education during the pandemic. Humanities and Social Sciences Communications. https://doi.org/10.1057/s41599-026-09408-w", "why": "コロナ禍の英国の大学職員290人の調査から、制度として用意された支援が受け手に支援と感じられるかは、上司の関わりなど関係と解釈の仕組みによって左右されることを示した。", "explain": {"basis": "抄録", "basis_note": "Humanities and Social Sciences Communicationsの抄録を使用", "preprint": false, "short": true, "p1": "コロナ禍の英国の大学職員290人の調査から、制度として用意された支援が受け手に支援と感じられるかは、上司の共感や積極的な連絡など、関係の中での実践に大きく左右されることを示した（抄録）。", "p3": "2020年3月〜2021年8月のロックダウン期について、支援の提供と認知の質問と自由記述を組み合わせた質的中心のオンライン調査を、社会的支援理論を枠組みに再帰的主題分析などで分析した（抄録）。", "p5": "制度上の提供と関係の中での実践の区別が一貫して見られ、画一的・事後的な取り組みは手続きの遵守と受け取られがちだった。非常勤や障害のある職員では認知と利用のしやすさに差があり、平等な提供が不公平な経験を覆い隠しうることも示された（抄録）。", "fun": "職場に相談窓口や支援制度があっても、それだけで人が「支えてもらえた」と感じるとは限りません。この研究は、上司の一言や気づかいといった人と人との関わりがあって初めて、制度が意味を持つことを示しました。同じ制度を全員に用意しても、届き方は人によって違うという指摘も面
