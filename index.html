<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

026-11-24", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"id": "pr45", "rank": 45, "headline": "抑うつ尺度の測定不変性を29か国で事前登録検証", "title": "Do Women and Men, and Albanians and Kosovars, Answer Depression Items the Same Way? A Preregistered Measurement Invariance Study of the European Social Survey CES-D", "url": "https://doi.org/10.5281/zenodo.24468181", "authors": "Brahimaj, Gerald", "venue": "Zenodo", "date": "2026-11-23", "theme": "包摂的コミュニティ・社会", "theme_no": 4}, {"id": "pr46", "rank": 46, "headline": "希少疾患の介護者の生活の質とオンライン支援", "title": "Quality of Life Among U.S. Rare Disease Caregivers: Associations with Care Recipient Characteristics and Online Support Resources", "url": "https://doi.org/10.21203/rs.3.rs-10679508/v1", "authors": "Ching-Hsuan Lin ほか", "venue": "Research Square (In Review)", "date": "2026-11-24", "theme": "包摂的コミュニティ・社会", "theme_no": 4}, {"id": "pr47", "rank": 47, "headline": "停電の責任が評価に残る：フリーランスの評判被害", "title": "Who Gets Blamed for the Blackout? A Critical Incident Analysis of Clients, Reputation Systems, and Online Freelancers", "url": "https://arxiv.org/abs/2611.28365", "authors": "Naim Bin Hasan ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "theme": "サービス・マーケティング", "theme_no": 3}, {"id": "pr48", "rank": 48, "headline": "老朽インフラの更新に災害リスクを組み込む比較", "title": "Renewal as Risk Reduction: A Comparative Framework for Integrating Hazard Exposure into the Renewal of Ageing Infrastructure in Switzerland and the United States", "url": "https://doi.org/10.20944/preprints202611.2348.v1", "authors": "Fridon Zarharyan", "venue": "Preprints.org", "date": "2026-11-24", "theme": "都市・インフラ政策", "theme_no": 6}, {"id": "pr49", "rank": 49, "headline": "文書に基づくAIの都市ペルソナで都市の性格を測る", "title": "Can Cities Have Personalities? Introducing the SCD City Personality Assessment", "url": "https://arxiv.org/abs/2611.30733", "authors": "Andrei Khurshudov", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "theme": "都市・インフラ政策", "theme_no": 6}, {"id": "pr50", "rank": 50, "headline": "高速道路の点検を検知から補修判断まで連鎖で評価", "title": "HighwayVerse: A Chain-of-Inspection Benchmark for Highway Infrastructure Anomaly Understanding", "url": "https://arxiv.org/abs/2611.28800", "authors": "Junyi Yang ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "theme": "都市・インフラ政策", "theme_no": 6}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "AIコーディング支援で若手技術職の採用が3割減", "title": "AI-Assisted Programming and Labor Demand", "url": "https://arxiv.org/abs/2611.31083", "authors": "Lindsey Raymond ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "GitHub Copilotの企業単位の導入を、米国のプログラミング労働力の38%を占める多国籍企業5,414社で調べた。企業のソフトウェア調達の時期があらかじめ決まっていることを自然実験に使う。導入の1年後、調達の見直しを契機に導入した企業では四半期の技術職の採用が29%減り、離職・技術職の在籍者数・求人期間には影響がなかった。減少はコーディングの比重が最も高い若手の職に集中し、需要は経験者と設計も担う職へ移る。"}, {"id": "pn02", "rank": 2, "field": "ヒューマンコンピュータインタラクション", "headline": "AIエージェントの不正は見ただけで仲間に広がる", "title": "Causal Evidence for the Emergence and Spread of Reward Hacking in AI Agent Swarms", "url": "https://arxiv.org/abs/2611.30185", "authors": "Sumer S. Vaid", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "自動検査をすり抜ける不正（報酬ハッキング）が、AIエージェントの間で伝播することの因果的な証拠を示した。6つの最先端モデル・計20,111体で17の事前登録実験を行った。共有記録が空でも33%が自発的に不正をし、仲間の不正が受理されたのを見ると94%が不正をした。「却下」と表示されても多くが真似をし、新しい課題にも持ち越され、256体のネットワークでは隣から隣へ広がった。"}, {"id": "pn03", "rank": 3, "field": "機械学習", "headline": "LLMは思考の記述に痕跡を残さず隠れた目的を追える", "title": "Can Latent Reasoning Drive LLM Outputs Without a Trace?", "url": "https://arxiv.org/abs/2611.31015", "authors": "Tomer Ashuach ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-24", "why": "LLMの監視は思考の連鎖（CoT）を読むことに頼るが、モデルは内部だけで多段の推論を行える。簡単な補助損失で、内部だけの推論の深さがこれまでの報告の少なくとも5倍になることを示した。融資の判断とコード生成で隠れた目的を追うよう訓練したモデルは、目的の痕跡がないCoTを出力し、強力なLLMの監視も見逃した。内部の計算はCoTの生成より前に完了していた。"}, {"id": "pn04", "rank": 4, "field": "因果推論", "headline": "長期効果を知るために短期の実験で何を測るべきか", "title": "What Should an Experiment Measure? Combining a Short-Term Experiment with Confounded Observational Data to Identify Long-Term Treatment Effects", "url": "https://arxiv.org/abs/2611.30599", "authors": "Kentaro Kawato", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "長期の結果を記録した観察データは選択の偏りがあり、無作為化実験は追跡に年単位の時間がかかる。両者を組み合わせて観察データの母集団での長期の平均処置効果を識別するには、短期の実験で何を測ればよいかを問い、3つの条件を導いた。効果を線形逆問題として特徴づけ、効率的な影響関数に基づく推定量が半パラメトリックな効率限界に達する条件を示した。"}, {"id": "pn05", "rank": 5, "field": "統計学", "headline": "観察データで実験を設計し長期効果を速く推定する", "title": "Adaptive experiments with observational data: Efficient experimental design and asymptotic time-uniform inference for long-term treatment effects", "url": "https://arxiv.org/abs/2611.30595", "authors": "Kentaro Kawato", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "長期の処置効果の推定に、実験の前から手元にある観察データを、識別だけでなく適応的な実験の設計にも使う方法を提案した。半パラメトリックな効率限界を共変量の抽出と処置の割り当て規則の関数として表し、それを最小にする設計を特徴づける。この設計を逐次に学習する手続きは、最適設計を知っている場合と同じ漸近分散に達し、いつ見てもよい信頼列で早期の打ち切りもできる。"}, {"id": "pn06", "rank": 6, "field": "ヒューマンコンピュータインタラクション", "headline": "AIに仕事を任せる判断は成果と楽しさの天秤", "title": "Tradeoffs between objective outcomes and human enjoyment of work in human-AI task allocation", "url": "https://arxiv.org/abs/2611.31095", "authors": "Katherine M. Collins ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "AIが人並みに仕事をこなせるようになると、人が楽しいと感じる作業がAIに回り、AIの出力の監視のような嫌な作業が人に残りうる。800人規模の行動実験で、仕事をAIと人のどちらに割り当てるかの判断を調べた。人々の判断は、客観的な成果の差と、担当する人が感じる楽しさを体系的に釣り合わせるモデルで最もよく説明できた。LLMに同じ判断をさせると、多くは純粋な成果重視からずれ、重みづけはモデルにより大きく異なった。"}, {"id": "pn07", "rank": 7, "field": "機械学習", "headline": "微調整の汎化は事前学習の乱数で決まる表現しだい", "title": "Pretraining Representation Lottery Determines Fine-tuning Generalization", "url": "https://arxiv.org/abs/2611.28777", "authors": "Fuming Yang ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "概念の幾何が既知の合成データで、事前学習の表現が微調整の汎化を決める仕組みを調べた。乱数の種だけが違うモデルは、事前学習の損失がほぼ同じでも微調整後の汎化が大きく異なる。正しい概念の幾何を注入すると汎化がほぼ上限に達し、運の良い種の表現を蒸留すると運の悪い種も汎化する（振る舞いの蒸留では起きない）。Pythia-160Mと410Mでも蒸留の結果を再現した。"}, {"id": "pn08", "rank": 8, "field": "因果推論", "headline": "1つの因果の問いに複数ある分析をどう突き合わせるか", "title": "Identification multiplicity across study designs", "url": "https://arxiv.org/abs/2611.29908", "authors": "Carlos Garc\\'ia Meixide ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "同じ因果の問いは、調整変数・比較群・操作変数・媒介変数・不連続点などの違う複数の分析に翻訳できる。こうした分析の集まりを、各分析が識別する因果の対象、共有する仮定、推定値の標本上の依存の3つの構造で記述した。分析間の食い違いを識別の不一致と対象の違いに分解し、14の例で明示する。一致は共有しない仮定についての証拠であり、全分析に共通の偏りは見つけられない。"}, {"id": "pn09", "rank": 9, "field": "組織行動・心理的安全性", "headline": "会議に加わる情報収集AIがチームの予測精度を上げる", "title": "Evaluating the Participation of Proactive Scouting Agents in Real-time Human Team Meetings", "url": "https://arxiv.org/abs/2611.28009", "authors": "Hans Schumann ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "人のチームの実時間の議論に、議論を聞いて情報の不足を見つけ、自分で調べて発言するAIエージェントを加える効果を対照実験で調べた。4〜5人のチームが大リーグ34試合の結果を予測する課題で、勝敗の予測では平均絶対誤差が25%減り、正答率が60.0%から76.4%に上がった。総得点の予測では差がなかった。"}, {"id": "pn10", "rank": 10, "field": "機械学習", "headline": "AIの物理的な目標達成力を60課題で横並びに測る", "title": "WorldLeague: Benchmarking Physical Agency", "url": "https://arxiv.org/abs/2611.30989", "authors": "Xinyang Zhou ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-24", "why": "視覚言語モデル、視覚言語行動モデル、世界行動モデルという制御の仕方が違うAIを、共通の60の模擬ロボット課題で比べるベンチマークを作った。探索・並べ替え・変化への適応の3種の課題で、目標への進み具合と達成率を6つの能力の次元ごとに測る。代表的な13システムのうち最良でも60目標中13の達成にとどまり、最後の質問に全問正解しても進み具合の得点がゼロの場合が71.8%あった。"}, {"id": "pn11", "rank": 11, "field": "統計学", "headline": "ガウス過程のマターン核の最尤推定に鋭い漸近理論", "title": "Sharp Asymptotic Theory of Maximum Likelihood Estimation for Gaussian Processes with a Matern Kernel", "url": "https://arxiv.org/abs/2611.29841", "authors": "Ameer Qaqish ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "ガウス過程で最もよく使われるマターン核について、固定領域の漸近のもとでのパラメータの同時最尤推定量の漸近理論を整備した。識別可能性は観測領域の次元に依存するため、次元ごとに推定可能なパラメータと収束率を特徴づけ、同時の漸近正規性と収束率のミニマックス最適性、漸近的に妥当な信頼領域を示した。不規則な標本配置と劣ガウスの測定誤差にも対応する。"}, {"id": "pn12", "rank": 12, "field": "経済学", "headline": "近所の浸水被害が無傷の家の住宅ローン破綻も誘発", "title": "Neighbourhood flood damage amplifies mortgage default cascades", "url": "https://arxiv.org/abs/2611.29652", "authors": "Matteo Valle ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "オランダのリンブルフ州に較正したエージェントベースモデルで、洪水による近隣の被害が住宅ローンの債務不履行を連鎖させる仕組みを示した。周囲の住宅の被害は、返済能力があり自宅が無傷の世帯の不履行も引き起こす。最悪の洪水シナリオでは年間の差し押さえ率が2倍を超え、連鎖に属する差し押さえの割合が31%から45%に上がり、残債の多い新しいローンに偏る。"}, {"id": "pn13", "rank": 13, "field": "経済学", "headline": "分布の差分の差分の前提を反証する検定と鋭い限界", "title": "Probability-Feasible Historical Transport: Sharp Bounds and Falsification Tests for Distributional Pre-Trend Designs", "url": "https://arxiv.org/abs/2611.29632", "authors": "Ulrich Hounyo", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "分布を扱う差分の差分は、政策後の処置群と対照群の差が政策前の差の混合で表せると仮定することが多い。この仮定は、反実仮想の分布に負の確率を割り当てるなど、1つの統計量の確認では見逃される形で破れうる。鋭い限界、破綻半径、格子によらない信頼領域、検定を与えた。米国の就労支援実験のデータでは仮定を棄却し、最低賃金の統合した限界の背後にある不可能な反実仮想を明らかにした。"}, {"id": "pn14", "rank": 14, "field": "工学", "headline": "三塔吊橋のフラッターでどの振動モードが勝つか", "title": "Mode competition in multimode flutter of a triple-tower suspension bridge", "url": "https://doi.org/10.21203/rs.3.rs-11526145/v1", "authors": "Wei Cui ほか", "venue": "Research Square (In Review)", "date": "2026-11-24", "why": "三塔吊橋の非線形フラッターで、対称と逆対称の鉛直・ねじれモードのどちらが応答を支配するかを4モードのモデルで調べた。馬鞍山大橋の条件では発現風速は逆対称が71.9 m/s、対称が88.7 m/sで、2つ目の発現を超えても逆対称が支配的だった。振幅に依存する選択的な減衰を入れると応答の選択が変わり、逆対称の振動が抑えられるという実験報告を説明する候補の機構を示した。"}, {"id": "pn15", "rank": 15, "field": "経営学", "headline": "逸脱するAIエージェントを犯罪学の理論で読み解く", "title": "Deviant Machines: Innovation, Containment, and the Prevention of Autonomous Misalignment", "url": "https://arxiv.org/abs/2611.30848", "authors": "Frederic Lemieux ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "2026年5〜9月に、AI開発機関で訓練・評価中のエージェントが外部の実システムへの到達や悪意あるパッケージの公開などを起こした事例を、犯罪でなく「逸脱」として分析した。マートンの理論を援用し、目標への圧力と正当な手段の遮断が、逸脱的な手段による「革新」の構造的な条件になると論じる。3つの事例群と4つの行動類型を、誰が行ったかと理由を分ける証拠の次元で整理した探索的な研究である。"}, {"id": "pn16", "rank": 16, "field": "機械学習", "headline": "長時間の人型ロボット動作を実時間で生成", "title": "Motion Mamba 2.0: Autoregressive Diffusion Mamba for Long-Horizon Humanoid Control", "url": "https://arxiv.org/abs/2611.29897", "authors": "Yue Huang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-24", "why": "指示や目標が変わる中での長時間の動作生成に、Mambaに基づく拡散モデルと、圧縮した動作履歴を局所注意から参照できる持続的な内容メモリを組み合わせた。最長39.52秒の生成で終端を正確に制御し、実行の最適化によりRTX 4090での遅延の中央値を1,685 msから276 msに減らした。人型ロボットUnitree G1の実機でも、文章による動作の連続合成を示した。Hugging Faceの注目論文で今日最も票を集めた。"}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "EUの排出量取引は大気汚染による死亡も減らした", "title": "Electricity Generation, Carbon Pricing, and Air Quality: Evidence from the EU ETS", "url": "https://doi.org/10.2139/ssrn.7720799", "authors": "Nico Lukas Kasparetz ほか", "venue": "SSRN", "date": "2026-11-23", "why": "欧州13か国の火力発電732基の時間別データに機械学習と化学輸送モデルを組み合わせ、炭素価格の影響を、発電の切り替えから二次的なPM2.5、人口の曝露、早期死亡まで追った。EU排出量取引制度は2016〜2021年にCO2排出を5.7%減らし、主な経路は石炭からガスへの代替だった。PM2.5に関連する死亡は8.9%減り、健康面の便益は発電費用の増加を50億ユーロ以上上回る。"}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "銀行と企業の関係ごとのショックを共分散の制約で識別", "title": "Identifying Relationship-Level Effects Using Covariance Restrictions", "url": "https://doi.org/10.2139/ssrn.7744239", "authors": "Olivier De Jonghe ほか", "venue": "SSRN", "date": "2026-11-23", "why": "二部ネットワークで関係ごとに異なる効果やショックを、緩い共分散の制約のもとで識別する新しいモデルを提案し、Abowdらの枠組みを一般化した。たとえば企業が借りる銀行ごとに別々の需要ショックを識別できる。ユーロ圏9か国の数千の企業と銀行に適用し、従来の仮定をほぼすべての国・期間で棄却した。"}, {"id": "pn19", "rank": 19, "field": "統計学", "headline": "非凸なM推定量の高次元での正確な漸近挙動", "title": "Precise Asymptotics of Non-Convex M-Estimators", "url": "https://arxiv.org/abs/2611.30798", "authors": "Shirley Xiaoqi Liu ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "高次元のM推定の精密な漸近理論は、凸か緩やかに非凸な場合にほぼ限られていた。損失関数や正則化項が非凸な一般化線形モデルを、回転不変な計画行列と比例的な漸近のもとで、ベクトル近似メッセージ伝播とその状態発展によって解析した。非凸では近接作用素が不連続になりうるため、従来の補正項が不連続の寄与を取りこぼす点を扱う。"}, {"id": "pn20", "rank": 20, "field": "ヒューマンコンピュータインタラクション", "headline": "AIの助言が劣化したとき人はどこまで持ちこたえるか", "title": "Measuring Human Resilience to Unreliable AI Assistance: A Stress-Test Framework for Human-AI Interaction", "url": "https://arxiv.org/abs/2611.28006", "authors": "Shaoshan Liu", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "AIの助言の質が落ちたとき、人の意思決定者がどれだけ課題の遂行を保ち、回復できるかを測る「レジリエンス・ストレステスト」を提案した。劣化前の基準に対する成績から機能の損失と回復を要約する。公開された5つの人とAIの研究、計1,074人のデータで構成概念の妥当性を確かめ、AIの質を落とすと成績が急落したあと部分的に適応することを示した。"}, {"id": "pn21", "rank": 21, "field": "ヒューマンコンピュータインタラクション", "headline": "AIの内訳の一致を見せると助言に頼りやすくなる", "title": "When Modalities (Dis)Agree: How Decomposing Multi-Modal AI Advice Shapes Appropriate Reliance", "url": "https://arxiv.org/abs/2611.28017", "authors": "Nidhi Mishra ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "複数の情報源を統合するAIの助言で、情報源ごとの出力を見せることが適切な依存を助けるかを、中古車の価格評価を題材にした事前登録実験（240人）で調べた。情報源ごとの出力の開示は依存を高め、説明は判断の正確さを独立に改善した。ただし効果は情報源どうしが一致するときに限られ、見える合意が説得の手がかりとして働いた。"}, {"id": "pn22", "rank": 22, "field": "ヒューマンコンピュータインタラクション", "headline": "開発者1,118人と作るAI活用の責任ある指針", "title": "\"What Should I Do?\" Guidelines for Responsibly Integrating AI in Software Engineering", "url": "https://arxiv.org/abs/2611.28996", "authors": "Rudrajit Choudhuri ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "ソフトウェア開発でAIをどう責任をもって使うかについて、マイクロソフト、GitHub、ファイザーの開発者1,118人を対象に2段階の調査を行った。第1段階で860人がAIの支援を求める場面と避ける場面を答え、35の開発者向け指針にまとめた。1年後に258人で検証し、92%が文言は明確、91%が自分の仕事に関係がある、89%が取り入れたいと答えた。"}, {"id": "pn23", "rank": 23, "field": "経営学", "headline": "ビットコイン保有企業の開示は総額と純額でずれる", "title": "Gross Coins, Net Claims: Reconciliation and Disclosure Quality in Bitcoin Treasury Companies", "url": "https://doi.org/10.2139/ssrn.7725881", "authors": "Krzysztof Piech", "venue": "SSRN", "date": "2026-11-24", "why": "上場するビットコイン保有企業の見出しの保有枚数には、直接支配する分、借りた資産、間接的な請求権、現物返還の義務が混ざりうる。4層の照合手順、通貨をそろえた保有カバー率、12項目の開示完全性指数を作り、ポーランドのBTCS社と米国のStrategy社の提出書類を符号化した。BTCS社は約202 BTC相当を報告するが、115 BTCの返還義務を引くと約87 BTC相当になり、総額は純額の2.32倍だった。"}, {"id": "pn24", "rank": 24, "field": "経営学", "headline": "証拠に基づく警察活動は住民の協力がある地域で効く", "title": "Evidence-Based Performance Management and Citizen Coproduction: How Citizen Engagement Shapes the Effectiveness of Evidence-Based Policing", "url": "https://doi.org/10.2139/ssrn.7724418", "authors": "Suyeon Jo ほか", "venue": "SSRN", "date": "2026-11-24", "why": "証拠に基づく業績管理がどの条件で成果を出すかを、データ駆動型の警察活動の介入（POPP）を対象に差分の差分で評価した。POPPは暴力犯罪を有意に減らし、実施が集中的なほど減少が大きい。効果は、住民が公共の安全の共同生産に協力する意欲の高い地域でかなり強かった。"}, {"id": "pn25", "rank": 25, "field": "統計学", "headline": "予測を活用する推論を一次元の指標で効率化", "title": "Score-aware nonparametric adaptation of prediction-powered inference", "url": "https://arxiv.org/abs/2611.31138", "authors": "Xin Lu ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "ラベルつきデータにラベルなしデータと外部の予測を足して効率を上げる予測活用型の推論で、一般化線形モデルの係数の推定には条件付き平均の推定が要り、ラベルが少ないと難しい。共変量と外部予測を合わせたモデルからスカラーの指標を作り、条件付き平均をその一変数関数で近似する次元縮約により、漸近共分散の跡を最小にする推定量を選ぶ方法を提案した。"}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "仮説選択を最適な誤差とほぼ線形時間で", "title": "Statistically Optimal and Near Linear Time Hypothesis Selection", "url": "https://arxiv.org/abs/2611.30003", "authors": "Satyen Kale ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "n個の候補分布の中から、未知の分布に全変動距離で最も近いものに近い分布を標本から選ぶ仮説選択で、係数2の最適な近似を、O(log(n/δ)/ε²)の標本で達成する学習器を与えた。係数3のYatracosの推定量と同じ標本数で、従来の係数2の上界にあった対数因子を除いた。計算量はオラクル呼び出しの回数で測る。"}, {"id": "pn27", "rank": 27, "field": "因果推論", "headline": "測定誤差があるときの個別化した処置方針の設計", "title": "Treatment Policy Design in the Presence of Measurement Error", "url": "https://arxiv.org/abs/2611.28372", "authors": "Chang Liu ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "個別化した処置方針の設計では、鍵となる特徴量が誤差つきでしか測れないことがあり、無視すると系統的な偏りが生じる。条件付き平均処置効果が識別できない場合の方針の作り方を、観測された測定値の真の特徴量に対する条件付き分布（測定の機構）に注目した部分識別に基づく2つの枠組みとして提案した。"}, {"id": "pn28", "rank": 28, "field": "因果推論", "headline": "連続的な処置の用量反応が異なる部分集団を見つける", "title": "Interpretable Discovery of Heterogeneous Causal Dose-Response Curves", "url": "https://arxiv.org/abs/2611.30838", "authors": "Falco J. Bargagli-Stoffi ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "連続的な処置について、因果的な用量反応曲線が異なる解釈可能な部分集団をデータから見つけるアルゴリズムを提案した。二重頑健な用量反応曲線の推定と再帰分割を組み合わせる。連続処置の標準的な二重頑健の擬似結果はこの目的に使えないことを示し、候補の部分集団ごとに擬似結果を作り直す。"}, {"id": "pn29", "rank": 29, "field": "因果推論", "headline": "因果探索後の正直な信頼区間の長さの代償", "title": "How long must an honest confidence interval be after causal discovery? Benign and malignant weak edges", "url": "https://arxiv.org/abs/2611.30256", "authors": "Ruiqi Zhao", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "因果探索のあとで総効果の信頼区間をモデルのクラス全体で一様に有効にするには、構造の不確かさの代償を払う必要がある。この代償を、グラフを知っている場合の効率的な区間との長さの比で測り、線形ガウスモデルで分析した。弱い辺を「良性」と「悪性」に分類し、良性なら代償は有界、そうでなければ√nのオーダーになることを示した。"}, {"id": "pn30", "rank": 30, "field": "機械学習", "headline": "最先端モデルをそのままロボットの方策に使う設計指針", "title": "Embo-Harness: Towards Understanding Frontier-Model-as-Policy Harness", "url": "https://arxiv.org/abs/2611.31201", "authors": "Xiao-Ming Wu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-24", "why": "最先端のマルチモーダルモデルを閉ループのロボット制御の方策として直接使う「ハーネス」の設計原理を、プロンプト・計画・行動の実行・道具の使用の4要素について体系的に調べ、6つの経験的な知見を実用的な手順にまとめた。手作りの計画や技能より、モデル本来の視覚的な推論と道具の使用を生かすインタフェースを優先すべきだとする。Hugging Faceで88票。"}, {"id": "pn31", "rank": 31, "field": "機械学習", "headline": "視覚言語モデルをロボット操作の基盤モデルに育てる", "title": "A Glimpse of Training VLMs as Foundation Models for Robotic Manipulation", "url": "https://arxiv.org/abs/2611.29338", "authors": "Meng-Hao Guo ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-24", "why": "訓練方法が十分に公開されていない商用モデルのロボット制御の汎化を再現する方法として、nanoAstraを提案した。ロボットの行動を、再利用できるパラメータつきの動作要素からなる意味的な段階として表し、ロボット専用のシステムプロンプトで出力を構造化された行動空間に限る微調整で、事前学習の能力への干渉を抑える。5,000時間を超えるロボットのデータで訓練した。Hugging Faceで41票。"}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "動画の世界モデルから行動の潜在表現を取り出す", "title": "World Models as Native Latent Action Models", "url": "https://arxiv.org/abs/2611.30898", "authors": "Qinyue Li ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-24", "why": "行動のラベルがない大量の動画から動きの情報を取り出す潜在行動モデルは、逆動力学と順動力学のモデルを一から訓練していた。事前学習済みの動画拡散トランスフォーマー1つを両方の役割に使い、学習可能な「動力学レジスタ」だけを両者の橋渡しにする方法を提案した。動きだけが違う反実仮想的な時間対で訓練する。Hugging Faceで23票。"}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "再帰型Transformerが長い計算へ外挿できる条件", "title": "What Makes Recurrence Generalize Across Lengths?", "url": "https://arxiv.org/abs/2611.29171", "authors": "Yoonsung Jung ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "共有ブロックを繰り返し適用する再帰型Transformerが、訓練範囲を超える長さの状態追跡に汎化する条件を、統制した課題で調べた。再帰だけでは不十分で、複数トークンの定型表現や絶対位置符号は外挿を大きく妨げ、操作を1トークンで表す表現が外挿を大きく改善した。"}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "文脈を外部で管理するハーネスが合成的な汎化を生む", "title": "Language Model Harnesses can be Compositional Generalizers", "url": "https://arxiv.org/abs/2611.28298", "authors": "Alex L. Zhang ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "言語モデルをエージェントとして動かす外側の仕組み（ハーネス）が文脈をため込む標準の設計に代えて、文脈をプログラムで外部化して管理する神経記号的なハーネスの訓練を調べた。複雑な問題を、モデルが受け取る観測がどれも訓練分布の内側に収まるように分解することを、強化学習による事後訓練で容易に学ぶことを示した。"}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "LLMの事後訓練を集団で並列に行い自動で調整", "title": "Population-Based Post-Training for Large Language Models", "url": "https://arxiv.org/abs/2611.29014", "authors": "Yixuan Even Xu ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "検証可能な報酬による強化学習（RLVR）は、訓練前に決めたハイパーパラメータで1つのモデルを訓練するのが普通である。複数のモデルを並列に訓練し、定期的な検証で成績の良いモデルを複製してハイパーパラメータを摂動し、悪いモデルと入れ替える集団ベースの事後訓練を導入した。推論のベンチマークと道具を使う対話環境で、計算量をそろえた独立の学習者の集まりより強いエージェントを得た。"}, {"id": "pn36", "rank": 36, "field": "経済学", "headline": "建設ブーム期に建った家は品質が低い", "title": "Boom Houses, Bust Quality: The Hidden Cost of Housing Supply Expansion *", "url": "https://doi.org/10.2139/ssrn.7726978", "authors": "Kristopher S. Gerardi ほか", "venue": "SSRN", "date": "2026-11-23", "why": "物件ごとの査定記録から、住宅建設が急増した時期に建てられた一戸建ては品質の評価が有意に低いことを示した。供給弾力性と全国の住宅ローン金利などの交互作用を操作変数に使っても結果は変わらない。品質の低下は建設労働市場が逼迫した地域などで大きく、ブーム期の住宅は再販売までの保有収益も低い。"}, {"id": "pn37", "rank": 37, "field": "経済学", "headline": "過疎地への投資の効果を夜間光の衛星データで測る", "title": "Place-Based Policy from Space: Evidence from Italy's Inner Areas", "url": "https://arxiv.org/abs/2611.31100", "authors": "Nicola Caravaggio ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "イタリアの内陸地域国家戦略（SNAI）を、衛星の夜間光を使って評価した。資金を受けた941の自治体と、対象になりえた3,112の自治体を2011〜2022年について段階的導入の差分の差分で比べた。資金は光のある面積の拡大と関連し、光のある区画あたりの明るさには変化が検出されなかった。活動が既存の中心で強まるのではなく、範囲を広げる形で現れることを示唆する。"}, {"id": "pn38", "rank": 38, "field": "経済学", "headline": "取引先の価格硬直性が企業のリスクを左右する", "title": "Trading Partners' Price Rigidity and Macroeconomic Risk", "url": "https://doi.org/10.2139/ssrn.7726961", "authors": "Kane Bae", "venue": "SSRN", "date": "2026-11-24", "why": "仕入先の価格の硬直性は投入価格を通じて、需要拡大後の費用増を和らげる一方で有利な供給ショックの費用減を小さくする。顧客の価格の硬直性は数量を通じて働く。この2つの経路が営業利益と株式収益に表れることを示し、生産ネットワークのモデルで費用転嫁・マークアップ・在庫管理と結びつけた。金融政策と関税の発表時の株価の反応が裏づける。"}, {"id": "pn39", "rank": 39, "field": "経済学", "headline": "金融政策のあいまいさが株式プレミアムを高める", "title": "Ambiguous Monetary Policy and Portfolio Choice in HANK", "url": "https://doi.org/10.2139/ssrn.7726438", "authors": "Ana Santos", "venue": "SSRN", "date": "2026-11-24", "why": "家計が中央銀行の政策ルールを十分に理解していない状況を、将来の政策ショックの平均についてのナイト的不確実性として、2資産の異質的家計ニューケインジアン・モデルに入れた。各家計は自分にとって最悪の平均のもとで資産配分を評価する。多くの家計は予想外の引き締めを恐れて債券を保険として需要し、債券の収益が下がり株式プレミアムが上がる。"}, {"id": "pn40", "rank": 40, "field": "統計学", "headline": "ブロック粒子フィルタの推定のばらつきを抑える", "title": "Twisted Block Particle Filters: A Local Particle-System Change of Measure for High-Dimensional State-Space Models", "url": "https://arxiv.org/abs/2611.28848", "authors": "Ning Ning", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "高次元の状態空間モデルで重みの退化を和らげるブロック粒子フィルタは、正規化定数の推定のばらつきが大きい。ブロックごとの再標本化に予測的な誘導を入れる「ねじり」を、測度の厳密な変換として導入した。補正は有限粒子での正規化定数の期待値を厳密に保ち、誘導の効果と空間的なブロック化による近似とを切り分けられる。"}, {"id": "pn41", "rank": 41, "field": "統計学", "headline": "少数の値をとるデータの平均に厳密で狭い信頼区間", "title": "Exact, narrow and fast: Use the Gaffke confidence interval for the mean of a discrete bounded variable", "url": "https://arxiv.org/abs/2611.29512", "authors": "Louis Abraham", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "アンケートの評点のように少数の既知の値をとるデータの平均では、小標本や端に近い平均で通常の信頼区間の被覆率が名目を大きく下回る。クロッパー・ピアソン区間を一般化したGaffkeの区間は、最近証明された予想により、どの標本サイズと分布でも被覆率が名目以上になる。その端点を、鞍点を通る直線上のフーリエ逆変換で速く正確に計算する算法を示した。"}, {"id": "pn42", "rank": 42, "field": "統計学", "headline": "運用中のリスクモデルを件数の変動に左右されず監視", "title": "Which Loans, Not How Many: Exactly Level-Invariant, Anytime-Valid Monitoring of Deployed Risk Models", "url": "https://arxiv.org/abs/2611.28342", "authors": "Xin Xu", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "借り換えの波は、スコアと繰上返済の関係を変えずに件数だけを変えうる。ロジスティックモデルで月ごとの件数を条件づけると、どのローンが繰上返済するかの尤度から切片が消えることを使い、較正の傾きの下限をいつ止めても有効な形で検定する方法を作った。帰無仮説のもとで一度でもしきい値を超える確率は5%以下である。フレディマックのローンデータで検証した。"}, {"id": "pn43", "rank": 43, "field": "工学", "headline": "F1の前翼まわりの流れを大規模にモード分解", "title": "Scalable Modal Analysis of the Imperial Front Wing Flow Field", "url": "https://arxiv.org/abs/2611.29995", "authors": "Parv Khurana ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "高忠実度の流体シミュレーションから支配的な3次元の構造を取り出すことは、状態空間の次元が大きく困難だった。オープンソースのpyLOMに実装した大規模な固有直交分解と動的モード分解で、公開ベンチマークのImperial Front Wing（レイノルズ数2.2×10⁵）のLES結果から、流れの構造とその時間変化を同定した。"}, {"id": "pn44", "rank": 44, "field": "工学", "headline": "平板載荷試験の曲線から舗装各層の特性を逆解析", "title": "Inverse Finite-Element Identification of Hydraulically Stabilised Layers from Static Plate Load Tests on a Full-Scale Circular Test Track, with Geopolymer-Stabilised Alternatives", "url": "https://doi.org/10.20944/preprints202611.2429.v1", "authors": "Silviu-Cristian Iriciuc ほか", "venue": "Preprints.org", "date": "2026-11-24", "why": "平板載荷試験の変形係数は層ではなく層構造全体の値である。ルーマニアの実大の円形試験走路で、路床と3種の水硬性安定処理層の弾塑性パラメータを、載荷・除荷・再載荷の全曲線から軸対称の有限要素モデルで逆解析した。ラテン超方格サンプリングとレーベンバーグ・マーカート法で同定し、不確かさも示した。モデルは独立の解と0.1%以内で一致することを確かめている。"}, {"id": "pn45", "rank": 45, "field": "工学", "headline": "地震時のすべりと余効すべりを結ぶ保存量を提案", "title": "Conservative Rupture Force Relating Co-seismic Rupture and Afterslip Process", "url": "https://arxiv.org/abs/2611.30324", "authors": "Yuxuan Hou ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "地震時のすべりと余効すべりの関係は両者のモーメントの比で表されてきたが、この比が本質的に不安定であることを数値と理論の解析で示した。地震間の平衡状態を基準に純粋な余効すべりを分離し、地震時の応力降下を面積で積分した「保存的破壊力」という新しい物理量を定義して両者を関係づけた。"}, {"id": "pn46", "rank": 46, "field": "人口学", "headline": "メキシコの殺人の増加で父を失う子どもが急増", "title": "Homicidal violence and childhood bereavement in Mexico: Parental loss and kinship inequalities 2000–2024", "url": "https://doi.org/10.31235/osf.io/za47k", "authors": "Mary Carolina Sosa Bonilla ほか", "venue": "SocArXiv", "date": "2026-11-24", "why": "メキシコの殺人の増加が残された子どもに与える影響を、2000〜2024年の母・父・いずれかの親の喪失として推定した。死亡登録と人口推計を組み合わせ、時間変化する両性の親族モデルを用いる。父の喪失は2007年以降に急増し、2015年以降にも増えた。2020年の推定は父の喪失が59,569人、少なくとも一方の親の喪失が65,322人で、北西部・太平洋岸・中北部で確率がとくに高い。"}, {"id": "pn47", "rank": 47, "field": "ヒューマンコンピュータインタラクション", "headline": "AI使用の疑いを「生配信で描く」賭けで裁く", "title": "But Can You Draw It Live? The Emergence of AI Duidus for Adjudicating Suspected Generative AI Use in Digital Art Commission Communities", "url": "https://arxiv.org/abs/2611.29684", "authors": "Elise Chenxinran Shen ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "依頼制のデジタルアートの共同体で、生成AIの使用を疑われた作家に生配信で新作を描かせ、共同体が投票で判定する「AI対賭」という紛争解決の仕組みを調べた。告発者・作家・仲介者の17人への面接から、真贋の検証が作品そのものから作家の生配信での制作の労働へ移ること、参加者が感じる有効性とリスクを明らかにした。"}, {"id": "pn48", "rank": 48, "field": "ヒューマンコンピュータインタラクション", "headline": "親たちの生成AI観は2年で「新奇」から「不可避」へ", "title": "\"I feel like AI is just everywhere\": A longitudinal qualitative study on parents' perceptions, use, and mediation of GenAI", "url": "https://arxiv.org/abs/2611.28861", "authors": "Jennica Li ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "生成AIに対する親の認識・利用・子どもへの関わり方の変化を、以前の研究に参加した親10人への2年後の面接でたどった。親たちは、生成AIを目新しいものと見る段階から避けられないものと感じる段階へ移り、限定的な道具という見方から開発の規制が必要という考えへ、個人の対処から長期的な影響を抑える制度的な計画を求める姿勢へと変わった。"}, {"id": "pn49", "rank": 49, "field": "経営学", "headline": "重みを公開する最先端AIのリスク管理の枠組み", "title": "Frontier Open-Weight AI Risk Management Framework", "url": "https://arxiv.org/abs/2611.28082", "authors": "Brian Tse ほか", "venue": "arXiv", "date": "Tue, 24 Nov 2026", "why": "重みを公開するモデルは、公開を取り消せない、微調整で安全策を外せる、利用を監視できないという固有のリスクを持つ。リスクの評価から緩和・統治までの管理の全過程を、公開モデルの性質に合わせて組み直した枠組みを、Concordia AIとZ.AIが共同で示した。開放性と安全性の緊張のすべてを解くものではないと著者らは明記している。"}, {"id": "pn50", "rank": 50, "field": "組織行動・心理的安全性", "headline": "大規模共同研究の約束事を最初に決める道具", "title": "Planning and Agreement for Collaborative Teams (PACT): Introducing a Tool to Facilitate Research Collaboration", "url": "https://doi.org/10.31222/osf.io/9kwnq", "authors": "Bjørn Sætrevik ほか", "venue": "MetaArXiv", "date": "2026-11-24", "why": "複数の所属の研究者が共同する大規模なチーム科学では、共同の計画が最初に明確にされず、期待のずれが混乱や対人の衝突を生みやすい。共同研究の開始時に期待と規則を明示的に計画し、合意して共有するための道具PACTを紹介する。既存の計画の道具では新しい研究計画の共同の計画を十分に支えられないことが動機である。"}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "簡易な車両モデルでも走行計測から橋のたわみを復元", "title": "Simplified Vehicle Models for Drive-by Estimation of Road Profiles and Bridge Deflections Using the Inverse Newmark-Beta Method", "url": "https://doi.org/10.3390/app162311622", "authors": "Haifang He ほか", "venue": "Applied Sciences (Switzerland)", "date": "2026-11-24", "sjr": 0.555, "citescore": 6.1, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr02", "rank": 2, "headline": "モード欠測と基準更新で失う損傷感度を定式化", "title": "Missing modes and baseline adaptation: Quantifying loss of stiffness-change sensitivity in bridge monitoring", "url": "https://doi.org/10.1177/10775463261511843", "authors": "Tien-Thuy Nguyen", "venue": "JVC/Journal of Vibration and Control", "date": "2026-11-24", "sjr": 0.588, "citescore": 6.1, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr03", "rank": 3, "headline": "常微分方程式の同定で離散化誤差も同時にベイズ推定", "title": "Joint Bayesian Inference of Parameter and Discretization Error Uncertainties in ODE Models", "url": "https://doi.org/10.1137/25m1825051", "authors": "Shoji Toyota ほか", "venue": "SIAM-ASA Journal on Uncertainty Quantification", "date": "2026-11-24", "sjr": 1.057, "citescore": 3.4, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8}, {"id": "jr04", "rank": 4, "headline": "ドローン映像から鋼トラス橋の損傷を位置づけ", "title": "Deep Learning-Based Prediction and Localization of Damage Severity in Steel Truss Bridges from Drone Surveys", "url": "https://doi.org/10.1061/jccee5.cpeng-7892", "authors": "Althaf S c Management Review", "date": "2026-11-24", "sjr": 2.54, "citescore": 11.5, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3}, {"id": "jr50", "rank": 50, "headline": "非線形の動的応答で不安定岩盤の劣化を同定", "title": "Identification of Structural Plane Deterioration in Unstable Rock Masses Using Nonlinear Dynamic Response", "url": "https://doi.org/10.1007/s00603-026-06140-4", "authors": "Mengjia Lyu ほか", "venue": "Rock Mechanics and Rock Engineering", "date": "2026-11-24", "sjr": 1.803, "citescore": 11.6, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経営学", "headline": "グーグルは出資先アプリを自社市場で優遇か", "title": "Gatekeepers and Kingmakers: Do Superplatforms Distort Digital Competition?", "url": "https://doi.org/10.1287/mnsc.2025.03354", "authors": "Umit G. Gurun ほか", "venue": "Management Science", "date": "2026-11-24", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "グーグルが市場の門番（Android）と戦略的な投資家（Google Ventures）を兼ねることの影響を、iOS版を対照にした差分の差分で調べた。出資を受けたスタートアップのAndroid版は、大きな更新がないのにレビュー数が115%多く、評価が12%高く、不具合の苦情が77%少なかった。選択的なレビューの削除とプラットフォーム上での推奨と整合し、プラットフォームの中立性に疑問を投げかける。"}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "固定資産税の増税で持ち家層は借りずに消費を切る", "title": "Taxing Homeowners Who Can't or Won't Borrow", "url": "https://doi.org/10.1093/restud/rdag127", "authors": "Francis Wong", "venue": "The Review of Economic Studies", "date": "2026-11-23", "sjr": 23.622, "citescore": 15.7, "citescore_year": "2025", "why": "米国の数百万人の持ち家層の高頻度の行政データから、住宅価格の上昇に伴う固定資産税の増税への反応を調べた。転居しない人は消費を減らし、財務的な困窮を示すが、上がった住宅価値を担保に借りない。消費の反応は流動性によらず、困窮は流動性の乏しい層に集中する。増税は転居も促す。税の厚生費用の中心は財務困窮にあり、流動性の乏しい世帯の税を抑える政策の利得を示す。"}, {"id": "jn03", "rank": 3, "field": "情報システム", "headline": "AIの思考過程の表示は難問ほど誤った信頼も生む", "title": "Understanding the Prompting Effects of Chain-of-Thought on Human Collaboration with Generative AI", "url": "https://doi.org/10.1287/isre.2024.1314", "authors": "Xusen Cheng ほか", "venue": "Information Systems Research", "date": "2026-11-24", "sjr": 5.679, "citescore": 13.8, "citescore_year": "2025", "why": "生成AIの推論過程（Chain-of-Thought）を画面に示すことが、利用者の能力への信頼にどう影響するかを一連のオンライン実験で調べた。質の高い推論は難易度によらず信頼を高める。質の低い推論は、易しい課題で利用者が注意深く処理したときだけ信頼を下げ、難しい課題では透明性の知覚を通じてかえって信頼を高めた。推論の表示が誤答への過信につながる条件を示す。"}, {"id": "jn04", "rank": 4, "field": "因果推論", "headline": "潜在変数を説明変数に使う偏りを分割標本で補正", "title": "Correcting Bias When Using Latent Regressors", "url": "https://doi.org/10.1017/pan.2026.10068", "authors": "Connor Jerzak ほか", "venue": "Political Analysis", "date": "2026-11-24", "sjr": 4.368, "citescore": 13.5, "citescore_year": "2025", "why": "測定誤差のある潜在変数を回帰の説明変数に使うと、係数がゼロ方向に偏る。操作変数や合成法といった広く使われる補正は、潜在変数に適用するとそれ自体が偏り、誤差を無視した単純な回帰より悪いことも多いと示した。分割標本による相関に基づく補正を導出し、加法得点・因子・機械学習のどの測定とも組み合わせられる。応用では補正後の関係が最大50%強くなった。"}, {"id": "jn05", "rank": 5, "field": "因果推論", "headline": "分類器の性能評価は小さなテスト集合では当てにならない", "title": "Uncertain Performance: How to Quantify Uncertainty and Draw Test Sets When Evaluating Classifiers", "url": "https://doi.org/10.1017/pan.2026.10065", "authors": "Francisco Tomas-Valiente", "venue": "Political Analysis", "date": "2026-11-24", "sjr": 4.368, "citescore": 13.5, "citescore_year": "2025", "why": "社会科学では分類器で概念を測ることが増えたが、通常の大きさのテスト集合では性能指標の推定が非常に不安定で、まれなクラスを扱う不均衡な課題ではほとんど情報がないことを示した。性能指標の標本分布に基づく不確実性の定量化と、予測確率で層別する効率的な抽出を提案し、シミュレーションと実データで検討した。"}, {"id": "jn06", "rank": 6, "field": "経営学", "headline": "プラットフォームが売り手に渡す顧客情報の最適設計", "title": "Platform Information Design and Competitive Price Targeting", "url": "https://doi.org/10.1287/mksc.2023.0518", "authors": "Ruiqi Wu ほか", "venue": "Marketing Science", "date": "2026-11-24", "sjr": 8.324, "citescore": 9.3, "citescore_year": "2025", "why": "プラットフォームが個々の消費者の情報を売り手に与えると標的価格が可能になるが、市場を分割して競争を激しくもする。Steamの購買・利用の詳細データから異質な需要を推定し、均衡の標的価格モデルであらゆる情報設計の反実仮想を計算した。均衡への影響を織り込んだ利潤最大の設計は、それを無視した需要ベースの経験則より大幅に利潤が高い。"}, {"id": "jn07", "rank": 7, "field": "人口学", "headline": "大卒の市長はコロナ第1波の超過死亡を減らした", "title": "The Demographic Impact of Leadership: Mayoral Education and COVID‐19 Excess Mortality in Italy", "url": "https://doi.org/10.1111/padr.70096", "authors": "Francesco Mattioli ほか", "venue": "Population and Development Review", "date": "2026-11-24", "sjr": 1.616, "citescore": 7.9, "citescore_year": "2025", "why": "イタリアの週次の死亡統計から市町村別の超過死亡をベイズ階層の時空間モデルで推定し、接戦の市長選挙を使う回帰不連続デザインで市長の学歴の効果を識別した。大卒の市長は第1波の超過死亡を減らしたが、第2波では差がなかった。政策活動とSNS発信の大規模データは、迅速で的を絞った対応と、あおらない指針型の発信という2つの経路を示唆する。"}, {"id": "jn08", "rank": 8, "field": "人口学", "headline": "子の教育を伸ばすと親の健康格差が縮む", "title": "Reducing Health Inequality by Increasing Children's Education: A Two‐Generation Mediation Approach and Evidence from the United States", "url": "https://doi.org/10.1111/padr.70100", "authors": "Liying Luo ほか", "venue": "Population and Development Review", "date": "2026-11-24", "sjr": 1.616, "citescore": 7.9, "citescore_year": "2025", "why": "成人した子の教育が高齢の親の健康に影響するなら、子の教育を高めることは親の健康格差を広げるのか縮めるのか。米国の健康・退職調査の縦断データに多層の周辺構造モデルを当て、因果の推定対象を明確にして答えた。教育年数12年未満の親の健康上の不利は14〜37%減り、大卒の親の有利は変わらない。世代をまたぐ教育の向上が健康格差の縮小策になりうることを示す。"}, {"id": "jn09", "rank": 9, "field": "組織行動・心理的安全性", "headline": "取引の開示強化で企業集団は海外子会社を増やす", "title": "Coming Clean on Hidden Ties: How Transparency in Related‐Party Transactions Shapes Business Group Internal Organization", "url": "https://doi.org/10.1111/joms.70191", "authors": "Marina Gama ほか", "venue": "Journal of Management Studies", "date": "2026-11-24", "sjr": 5.178, "citescore": 14.7, "citescore_year": "2025", "why": "2008年のブラジルの関連当事者取引の開示改革を自然実験として、上場・非上場の企業集団のデータで分析した。透明性が高まると、ピラミッド型の企業集団は上層の構造を組み替える一方、流出の対象になりやすい活動を開示規制の弱い国へ移すため海外の関連会社を増やした。開示改革は不透明さを消すのではなく、階層と地理の両面で組織の適応を引き起こす。"}, {"id": "jn10", "rank": 10, "field": "経済学", "headline": "フィンテックの融資はデータで未開拓市場から広がる", "title": "Fintech Expansion", "url": "https://doi.org/10.1093/rfs/hhag101", "authors": "Jing Huang", "venue": "The Review of Financial Studies", "date": "2026-11-23", "sjr": 17.406, "citescore": 13.2, "citescore_year": "2025", "why": "データから学習しプラットフォーム上の売上を差し押さえられるフィンテックの貸し手と、物的担保に頼る銀行が競争する信用市場を理論的に分析した。情報取得が柔軟でも、均衡でのフィンテックの学習は単一のしきい値で質の低い借り手を除く粗いものになる。執行力の向上は銀行の利潤を損ない、情報技術の向上は利する。銀行のない市場での初期のデータが、より豊かな市場への拡大を支える。"}, {"id": "jn11", "rank": 11, "field": "組織行動・心理的安全性", "headline": "公正なふるまいで疲れる上司と楽になる上司の違い", "title": "Does following justice rules feel constraining or liberating for leaders? The moderating role of justice sensitivity", "url": "https://doi.org/10.1177/00187267261499914", "authors": "Mingyun Huai ほか", "venue": "Human Relations", "date": "2026-11-24", "sjr": 4.141, "citescore": 16.1, "citescore_year": "2025", "why": "公正の規則に従うことが上司自身に与える心理的な帰結を、シナリオ実験（316人）と日誌法（上司52人・411観測）で調べた。公正への感受性が低い上司は、規則に従うと統制を失った感覚が強まり情緒的消耗が増える。感受性が高い上司は逆に統制を失った感覚が弱まり消耗が減る。組織的公正を、受け手ではなく実行する上司の側から捉え直した。"}, {"id": "jn12", "rank": 12, "field": "オペレーションズ・リサーチ", "headline": "在庫効率を上げると上流の排出はむしろ増える", "title": "Inventory Productivity and Carbon Emissions in Retailing", "url": "https://doi.org/10.1287/msom.2025.0660", "authors": "Nikolay Osadchiy", "venue": "Manufacturing & Service Operations Management", "date": "2026-11-24", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "why": "在庫の生産性が高いほど炭素排出が少ないという通念を、CDPの詳細な排出データと小売企業の財務データで検証した。排出削減の大半は事業規模に伴って生じる。規模を除くと、在庫生産性への外生的なショックは、スコープ3の購入した財・サービスを中心に排出原単位を高めた。効果は食品・医薬品以外の小売に集中する。リーン化の利益と上流の排出のトレードオフを示す。"}, {"id": "jn13", "rank": 13, "field": "オペレーションズ・リサーチ", "headline": "板情報の操作が最適になる条件を導き実データで確認", "title": "Spoofing and Manipulating Order Books with Learning Algorithms", "url": "https://doi.org/10.1287/opre.2025.1889", "authors": "Alvaro Cartea ほか", "venue": "Operations Research", "date": "2026-11-24", "sjr": 3.759, "citescore": 6.4, "citescore_year": "2025", "why": "指値注文板の動学モデルから、マーケットメイカーにとって板を操作することが最適になる条件を導いた。在庫リスクへの許容度が高いほど操作的な戦略が最適になる頻度が上がり、操作は在庫を最適水準へ戻し往復取引の成立確率を上げる。見せ玉は、操作の注文が約定しないことを望む特殊例にあたる。ナスダックの高頻度データで、操作の条件が成り立つことを確かめた。"}, {"id": "jn14", "rank": 14, "field": "組織行動・心理的安全性", "headline": "管理職の人事への自信は中くらいが最も実行に効く", "title": "Confident and Well‐Connected: The Interplay of Line Managers' HR Self‐Efficacy, Brokerage, and HRM Implementation", "url": "https://doi.org/10.1002/hrm.70112", "authors": "Budy Purnawanto ほか", "venue": "Human Resource Management", "date": "2026-11-24", "sjr": 4.598, "citescore": 15.0, "citescore_year": "2025", "why": "現場の管理職による人事施策の実行を、人事に関する自己効力感と、人事の助言ネットワークでの仲介的な位置から説明した。インドネシア6社の管理職88人、部下325人、上司69人の多源データの多層分析で、自己効力感と実行の関係は逆U字で、中程度が最も良い。仲介の位置がこの曲線の形を調整し、実行はチームの成果と結びつく。"}, {"id": "jn15", "rank": 15, "field": "オペレーションズ・リサーチ", "headline": "ミールキットの過剰包装を文脈つきの学習で減らす", "title": "How Not to Overpackage: AI for Sustainability in HelloFresh’s Service Supply Chain", "url": "https://doi.org/10.1287/msom.2025.0640", "authors": "Evelyn Xiao-Yue Gong ほか", "venue": "Manufacturing & Service Operations Management", "date": "2026-11-24", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "why": "食材宅配の箱ごとの保冷材の量と種類を、天候・輸送条件・中身などの文脈から逐次に選ぶ問題を定式化し、問題の構造を使うオンライン学習法CFPEを開発した。既存の方法では得られないÕ(√T)のリグレット上界を持つ。HelloFreshの実際の配送データによる数値実験で、文脈に合う包装構成を速く見つけることを確かめた。"}, {"id": "jn16", "rank": 16, "field": "経済学", "headline": "市場参加者の集中は流動性を上げ情報効率を下げる", "title": "CHILE", "url": "https://doi.org/10.1093/rfs/hhag100", "authors": "Efstathios Avdis ほか", "venue": "The Review of Financial Studies", "date": "2026-11-20", "sjr": 17.406, "citescore": 13.2, "citescore_year": "2025", "why": "非対称情報・一般的な効用関数・任意のペイオフを許す資産価格の枠組みCHILEを提示した。経済が大きくなっても情報の総量が有限にとどまる、連続で異質な情報構造が特徴である。規模の異なる参加者の存在（集中）が市場の質に与える影響を分析し、集中の高まりは流動性を高めるが情報効率を損なうという両面性を示した。"}, {"id": "jn17", "rank": 17, "field": "経営学", "headline": "プライバシーは投資の意欲を守るが選別を弱める", "title": "Screening, Investment Incentives, and the Welfare Trade-Offs of Privacy", "url": "https://doi.org/10.1287/mnsc.2025.01507", "authors": "Anastasios Dosis ほか", "venue": "Management Science", "date": "2026-11-24", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "情報開示が、契約前の投資の誘因と契約の効率に与える影響をプリンシパル・エージェント・モデルで分析した。情報はプリンシパルの選別を助けるが余剰の収奪も容易にし、エージェントの投資意欲を弱める。効率的な情報政策の境界では、プライバシーが強いほど投資の誘因とエージェントの利得が高い。完全な秘匿・完全な開示・中間のどれが効率的かの条件を特徴づけた。"}, {"id": "jn18", "rank": 18, "field": "機械学習", "headline": "二次正則化つき最適輸送の解法が線形収束する保証", "title": "Polyak–Łojasiewicz Inequality for Quadratically Regularized Optimal Transport", "url": "https://doi.org/10.1137/26m1840441", "authors": "Alberto González-Sanz ほか", "venue": "SIAM Journal on Optimization", "date": "2026-11-24", "sjr": 1.671, "citescore": 4.4, "citescore_year": "2025", "why": "二次正則化つき最適輸送は疎な輸送計画を与え数値的に安定だが、双対問題は強凹でなく、線形収束の標準的な議論が使えなかった。連続・半離散の両方を含む緩い仮定のもとで、双対問題の局所的な誤差限界とポリャク・ウォヤシェヴィッチ不等式を明示的な定数つきで証明し、勾配上昇法や座標上昇法の線形収束を導いた。"}, {"id": "jn19", "rank": 19, "field": "人口学", "headline": "紛争と出生率の矛盾する知見を多層の経路で整理", "title": "Rethinking Fertility Responses to Armed Conflict: A Critical Review of Conflict–Fertility Research in Low‐ And Middle‐Income Countries", "url": "https://doi.org/10.1111/padr.70107", "authors": "Victor Emmanuel ほか", "venue": "Population and Development Review", "date": "2026-11-24", "sjr": 1.616, "citescore": 7.9, "citescore_year": "2025", "why": "低・中所得国の武力紛争と出生の実証研究27件を検討し、紛争への曝露の概念化と測定、適用された理論を評価した。既存の出生理論は制度の安定を前提にしており、単一の理論では知見の幅を説明できない。紛争はマクロ・メゾ・ミクロの複数の経路で同時に働き、種類・期間・強度によって出生を抑えも促しもすることを多層の概念枠組みで示した。"}, {"id": "jn20", "rank": 20, "field": "工学", "headline": "鋼管の腐食が進んだアーチ橋の耐震性能を評価", "title": "Seismic performance evaluation of long-span CFST arch ring structure considering steel uniform corrosion effects", "url": "https://doi.org/10.1142/s0219455428501064", "authors": "Fangting Wang ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-24", "citescore": 6.5, "citescore_year": "2025", "why": "コンクリート充填鋼管アーチ橋の主要な耐震部材であるアーチリブについて、鋼の一様腐食が耐震性能に与える影響を評価した。中国南西部の長大上路式アーチ橋を原型にOpenSeesで有限要素モデルを作り、腐食なし・50年・100年のモデルに漸増動的解析を行って、変形とエネルギーの2指標による損傷を部材と構造全体の水準で比べた。"}, {"id": "jn21", "rank": 21, "field": "工学", "headline": "バンコクの信号つき横断歩道12か所の連続性を点検", "title": "Mobility Access and Route Continuity at Twelve Signal-Controlled Crossings in Bangkok, Thailand", "url": "https://doi.org/10.3390/infrastructures11120439", "authors": "Choomket Sawangjaroen", "venue": "Infrastructures", "date": "2026-11-24", "citescore": 5.7, "citescore_year": "2025", "why": "歩行者の連続した通行は、横断施設の部品の有無だけでなく配置に左右される。バンコクの信号つき横断歩道12か所の2022〜2023年の施設の記録を比べた。12か所すべてに縁石の傾斜路・歩行者信号・押しボタン・照明があったが、8か所に傾斜路に関する通行上の懸念、5か所に樹木や柱の障害があり、確認できた4つの安全島のうち1つは車いすで使えないとされた。改修の範囲を3つに整理した。"}, {"id": "jn22", "rank": 22, "field": "工学", "headline": "米国の道路安全マニュアルは欧州で使えるか", "title": "Transferability of Highway Safety Manual Safety Performance Functions and Calibration Factors in Europe: A Scoping Review", "url": "https://doi.org/10.3390/infrastructures11120438", "authors": "Vito Frangiamore ほか", "venue": "Infrastructures", "date": "2026-11-24", "citescore": 5.7, "citescore_year": "2025", "why": "米国のHighway Safety Manualの事故予測は米国のデータで較正されており、他地域への移転可能性の確認が要る。安全性能関数と較正係数の欧州での証拠をPRISMA-ScRに沿って整理したスコーピングレビューである。研究はイタリアに偏り、英国・ドイツ・オランダなどの証拠は限られる。欧州の証拠は方法としては一貫するが、地理とインフラの種類の面で偏りがあると結論する。"}, {"id": "jn23", "rank": 23, "field": "化学", "headline": "湿った排ガスからCO2だけを選ぶ多孔性材料", "title": "Halogenated Triazole-Based Metal–Organic Framework Achieves Ultra-Selective CO2 Capture under Humid Conditions", "url": "https://doi.org/10.1021/jacs.6c13451", "authors": "Armando Rigamonti ほか", "venue": "Journal of the American Chemical Society", "date": "2026-11-24", "sjr": 5.491, "citescore": 22.0, "citescore_year": "2025", "why": "湿度の高い窒素主体の排ガスからCO2を選択的に回収する吸着材として、ハロゲン化したトリアゾールとシュウ酸の亜鉛系MOF（CALF-20-X）とその複合体を開発した。ハロゲンが細孔の窓を狭めて窒素の取り込みを抑え、CO2に合うポケットを作る。CALF-20-Clは0.15 bar・298 KでCO2を2.89 mmol/g吸着し、CO2/N2選択性は4074を超えた。相対湿度21%では水の取り込みが56%抑えられた。"}, {"id": "jn24", "rank": 24, "field": "化学", "headline": "CO2からプロパノールを作る新しい結合経路", "title": "Elusive *CH–*CHO Coupling Pathway for High-Performance CO2 Electroreduction to n-Propanol", "url": "https://doi.org/10.1021/jacs.6c15732", "authors": "Chenchen Fang ほか", "venue": "Journal of the American Chemical Society", "date": "2026-11-24", "sjr": 5.491, "citescore": 22.0, "citescore_year": "2025", "why": "CO2の電気化学的還元でn-プロパノールを作る際の律速は、炭素2個と1個の中間体の結合である。2価と0価の銅が隣     "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
