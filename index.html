<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.ask {
  align-self: flex-start; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 12px; padding: 10px 14px; font-size: 15px; font-weight: 700;
}
.askrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ask.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding: 12px 20px; font-size: 16px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 20;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 720px; background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); display: grid; gap: 10px;
  max-height: 100vh; max-height: 100dvh; overflow-y: auto; overscroll-behavior: contain;
}
.sheet h2 { margin: 0; font-size: 18px; }
.sheet p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
.sheet .btn { width: 100%; }
.sheet textarea {
  width: 100%; height: 38vh; font: 13px/1.6 var(--font); border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); padding: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">AIに聞く</h2>
    <p id="sheet-paper"></p>
    <button class="btn primary share" id="share-full" type="button">節ごとに詳しく聞く</button>
    <button class="btn share" id="share-brief" type="button">要点だけ聞く</button>
    <p id="sheet-note"></p>
    <button class="btn" id="copy-full" type="button">依頼文をコピー（節ごとに詳しく）</button>
    <button class="btn" id="copy-brief" type="button">依頼文をコピー（要点だけ）</button>
    <p id="sheet-status" aria-live="polite"></p>
    <textarea id="sheet-text" readonly hidden aria-label="依頼文"></textarea>
    <button class="btn" id="sheet-close" type="button">閉じる</button>
  </div>
</div>

<script id="report-data" type="application/json">{"date": "2026-10-04", "intro": "プレプリントの新着528件、学術誌の新着1,436件（うち上位10%誌1,112件）、重要論文の候補238件、公開データの新着100件から選びました。今日は良い候補が少なかったため、プレプリント・関連44報、プレプリント・注目50報、論文誌・関連44報、論文誌・注目34報、データ23件に絞りました。取得できなかった情報源はありません。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "摩擦が速度依存の粗い球の粒状気体の緩和を運動論で導出", "title": "Rotational freezing and history-dependent relaxation in a dilute granular gas with velocity-dependent Coulomb–Amontons friction: a per-collision kinetic theory beyond mean field and its DSMC test", "url": "https://doi.org/10.2139/ssrn.7557198", "authors": "Aisultan Rauanuly Sharden ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文はSSRN・OpenAlexとも取得できず）", "preprint": true, "p1": "滑り速度に依存する摩擦（ストライベック則）を持つ非弾性の粗い球の希薄粒状気体について、並進・回転温度の衝突生成率を任意の摩擦則で厳密に求め、回転が「凍結」する状態とその履歴依存性を示した（抄録）。", "p2": "粒状気体の運動論では、摩擦を一定とするか平均場的な摩擦則を使うのが普通で、速度に依存する摩擦が分布全体に与える影響は扱いにくかった。平均場の摩擦則は駆動系で双安定（カスプ）を予測していたが、その妥当性は未検証だった（抄録）。", "p3": "ボルツマン方程式と2温度のガウス閉包を用い、Waltonの衝突則のもとで並進温度と回転温度の衝突生成率を計算した。生成率は2つの1次元積分に帰着し、一定摩擦では閉形式になる。解釈：粒子の速度分布を位相空間の確率分布として扱い、その2つの「温度」（並進と回転の運動エネルギーの平均）の発展だけを追う縮約である（抄録）。", "p4": "生成率の式を、衝突則のモンテカルロ標本化と運動方程式の直接シミュレーション・モンテカルロ（DSMC）の2つと照合し、相対誤差で評価した（抄録）。", "p5": "生成率は両者と0.1%より良く一致した。一定摩擦では一様冷却状態がサドルノード分岐を起こし、単一のパラメータ R = 2q(1−e)/[π(1−q)µ] がHaff冷却と回転凍結状態を分ける。速度依存摩擦では、有界で非増加の摩擦則をマクスウェル平均すると摩擦冷却率が温度に単調となり、平均場が予測した双安定は存在しないことを証明した。DSMCでは閉包を超える効果として、高速回転の裾が凍結し、その割合が同じ摩擦則でも0から半分以上まで履歴で変わった（抄録）。", "p6": "凍結した割合は衝突パラメータだけで決まらず、ガウス閉包では捉えられないため、閉包の拡張が必要になる。3次元の非一様な流れや高密度系への拡張は抄録の範囲では扱われていない（解釈）。", "fun": "ざらざらしたボールがたくさん飛び交う箱では、ぶつかるたびに回転と並進のエネルギーがやり取りされます。摩擦の性質によっては一部のボールだけが速く回ったまま「凍りつき」、その割合が始まり方（履歴）で大きく変わる、という結果は、同じ法則でも過去によって最終状態が違うという不思議さを示しています。", "unverified": "Rの式中の記号（q, e, µ）の正確な定義と、凍結割合の図の詳細は本文を読めず未確認。"}}, {"id": "pr02", "rank": 2, "headline": "橋桁断面の温度場を形状汎化の代理モデルで予測", "title": "Generalizing temperature field prediction across bridge girders: a geometry-informed surrogate model with sparse data correction", "url": "https://doi.org/10.2139/ssrn.7557359", "authors": "Yanjia Wang ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文はSSRN・OpenAlexとも取得できず）", "preprint": true, "p1": "橋ごとのFEモデルを作らずに、断面形状と気象データだけで未知の合成I桁橋の断面温度分布を予測し、少数センサの1か月分のデータで残差を補正できる代理モデル（GeoTCN-S2R）を示した（抄録）。", "p2": "橋桁の断面温度場は設計と供用中の状態評価に欠かせないが、既存のFEモデルやデータ駆動モデルは橋ごとに作られ、別の橋に使い回せなかった（抄録）。", "p3": "形状情報付きの時間畳み込みネットワーク（GeoTCN）を、実務の設計範囲をカバーする300種類の合成I桁断面のパラメトリックFEデータで一度だけ事前学習し、形状と気象の時系列から断面温度分布への写像を学ぶ。展開時は、まず実測なしで対象橋を予測し、次に基本モデルを凍結したまま、軽量のSim-to-Real（S2R）残差アダプタを疎なセンサの最初の1か月分で較正し、材料特性・境界条件・センサのずれによる残差を減らす（抄録）。", "p4": "未知の断面での数値検証と、香港の汀九橋（Ting Kau Bridge）への適用で、温度の平方根平均二乗誤差（RMSE）で評価した。補正に使わない3つのセンサでの精度も確かめた（抄録）。", "p5": "数値検証では基本モデルのRMSEが0.61 °Cで、補正後0.45 °Cに下がった。汀九橋では基本モデルが0.92 °C、断面の深さ方向4センサでアダプタを較正すると0.69 °Cになり、補正に使わない3センサでも同程度の精度だった（抄録）。", "p6": "事前学習は合成I桁に限られ、箱桁など他の断面形式への汎化は抄録の範囲では示されていない。補正に1か月分のデータを使うため、季節をまたぐ予測の安定性も未確認（解釈）。", "fun": "橋は日なたと日陰、昼と夜で場所ごとに温度が違い、その差で伸び縮みしてゆがみます。たくさんの形の橋で「温まり方のくせ」を学んだAIに、新しい橋の形と天気を教えるだけで温度分布を当てさせ、最後に少しの実測で微調整する、というのは、経験豊富な職人が初めての現場でもすぐ見当をつけるのに似ています。", "unverified": "アダプタの構造、センサ配置、評価期間の長さは本文を読めず未確認。"}}, {"id": "pr03", "rank": 3, "headline": "LLMは文化を再現せず文化の「記述」を再現する", "title": "LLMs Simulate the Description of a Culture, Not the Culture: An Attempt to Reproduce Henrich's Cross-Cultural Ultimatum Game Finding with LLM Agents", "url": "https://doi.org/10.5281/zenodo.23119302", "authors": "Geyik, Gökhan", "venue": "Zenodo", "date": "2026-10-03", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "ZenodoのPDF本文（方法・Study 1・数値属性の検証・Study 2・記述テスト・限界の節と表2〜5）を読んだ", "preprint": true, "p1": "LLMに文化的な人物像を与えて人間の代わりにする方法では、最後通牒ゲームの結果が文化そのものでなく「人物像の書き方」で決まり、Henrichの文化差は再現されないことを示した（§1、§7）。", "p2": "生成エージェントによるモデル化（GABM）では「アマゾンの自給農民です」と書くだけで異文化の被験者を代用する。だがLLMは集団を戯画化し、プロンプトの体裁に敏感であることが知られ、行動課題で人間の実データと照らした検証はなかった（§2）。", "p3": "3つのモデル（Claude Haiku 4.5、Gemma-4-31b-it、GPT-OSS-120b、温度0.4）に、WEIRD学生か小規模社会の住民の人物カードを与え、提案額10〜50%の一回限りの最後通牒ゲームに応答者として答えさせた。各検定の仮説と判定規則はデータ取得前に書面で定めた（公開登録ではない）（§3.1–3.4）。", "p4": "Henrichの人間データを基準帯（低額提案の拒否率：WEIRD 0.40〜0.60、小規模社会0.05〜0.25）とし、拒否率の差・χ²検定・Cohenのhで判定した。理由文は別系統の判定モデルで7テーマに符号化した（§3.5、§4.1）。", "p5": "カードに数値の「公正さの顕著性」を載せたStudy 1では10%提案の拒否率がWEIRD 0.027、小規模0.040とほぼ拒否なし（表2）。同じカードで値を0.3から0.6にすると拒否率が12.5%から80.5%に跳ね上がった（§5）。数値を除いたStudy 2では小規模61%・WEIRD 6%と人間と逆向きの差が出た（表4）。この逆転は「互恵・分かち合い・親族網」などの価値語を含む記述でのみ生じ、最小限の記述（21%対24%）や事実的な記述（13%対9%）では消えた（表5）。どの記述も人間のパターンを再現しなかった。", "p6": "著者は、最後通牒ゲームと中規模の3モデルに限られること、英語の3種類の記述しか試していないこと、逐次的な設計で計画が公開登録されていないこと、理由文の符号化に新しい非公開モデルを使ったことを限界に挙げる（§9）。どの語句が逆転を生むかは未特定である。", "fun": "「あなたは助け合いを大切にする村の人です」とAIに伝えると、AIは「助け合いを守るために不公平な分け前は断る」と考えます。でも本物の村人は、見知らぬ相手との一度きりの取引ではむしろ断らなかったのです。AIが演じているのは人そのものではなく、私たちがその人について書いた言葉だ、というのがこの論文の核心です。", "unverified": "Study 2の表4のモデル別の数値の一部は、PDF抽出で表の並びが崩れており照合できなかった。"}}, {"id": "pr04", "rank": 4, "headline": "同じプロンプトでもモデルが違えば別の測定器", "title": "Same Prompt, Not the Same Instrument: A Preregistered Test of Persona Framing and Moral Concern in Four Large Language Models", "url": "https://doi.org/10.5281/zenodo.23115859", "authors": "Boullineau ほか", "venue": "Zenodo", "date": "2026-10-03", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "ZenodoのPDF本文（方法§2、結果§3.1〜3.6、限界§4.5と表1〜4）を読んだ。補足資料は読んでいない", "preprint": true, "p1": "同じ道徳判断のプロンプトでも、4つの最先端LLMでは基準値・天井・再検査の安定性・ペルソナへの反応の向きが違い、「共通の測定器」として機能しないことを事前登録の検証で示した（抄録、§4）。", "p2": "LLMの道徳判断をモデル間で比べる研究は、同じプロンプトなら同じ測定器だと暗黙に仮定してきた。行為者の属性が曖昧な行為を「違反」に変えるという動機づけられた違反構成（MVC）の理論を、LLMで事前登録して検証した研究はなかった（§1）。", "p3": "Claude Opus 4.7、GPT-5.5、Gemini 3.1 Pro、DeepSeek-V4-Flashに、曖昧になるよう作った20のシナリオを、中立（「ある人」）と6つの属性付きペルソナ（幼稚園教諭、ヘッジファンド・マネージャー、気候活動家など）で提示し、「この行為に懸念はあるか」を二択で答えさせた（計11,200試行）。ペルソナの位置（シナリオの前か後か）も釣り合わせた（§2.1–2.4）。", "p4": "ペルソナの主効果（オッズ比1.5以上）など4つの予測を事前登録し、12日後の再検査でのセル相関 r > .80 を安定性の関門とした。日常的な無害行為（意味的ヌル）を対照に置いた（§2.5–2.6、表3）。", "p5": "中立条件での懸念率はClaude 74.8%、Gemini 76.8%、DeepSeekとGPT-5.5は98.5%で、2モデルは天井にあった（表1）。GPT-5.5は再検査で r = −.135となり除外された（表2）。残る3モデルで4予測のうち3つが不支持、1つは不定だった（表3）。ペルソナの効果はプロンプト内の位置で弱まり（§3.4）、DeepSeekは天気予報を確認するような無害な行為にも34.8%で懸念を示した（§3.6）。", "p6": "著者は、二択の懸念は違反の代理指標にすぎないこと、中立が「ある人」で具体性と属性の効果が混ざること、刺激が曖昧に機能したのは1モデルだけだったこと、人間の基準や測定不変性のモデルがないことを限界に挙げる（§4.5）。解釈：天井効果のため、効果の不在は「測れない」と読むべき部分が大きい。", "fun": "同じアンケート用紙を4人に配ったのに、1人目は何にでも「問題あり」と答え、2人目は日によって答えが変わり、3人目は質問の並べ方で答えが変わる。そんな状態では、4人の答えを並べて比べても意味がありません。AIに同じ質問をすれば公平に比べられる、という思い込みを、丁寧な手続きで崩した研究です。", "unverified": "P4の判定の詳細と、第4段階の反実仮想プローブの全結果、補足資料の数値は確認していない。"}}, {"id": "pr05", "rank": 5, "headline": "医療・福祉労働者の職場AI格差は雇用主の提供が鍵", "title": "Workplace AI divide: Employer provision, work content, and attitudes among U.S. healthcare and social assistance workers", "url": "https://doi.org/10.2139/ssrn.7557283", "authors": "Nari Yoo ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文はSSRN・OpenAlexとも取得できず）", "preprint": true, "p1": "米国の医療・福祉の労働者は、教育や知識労働の労働者に比べ、職場AIへのアクセス・利用・見通しのすべてで不利であり、その差の大きな部分が雇用主の研修・奨励の不足にあることを示した（抄録）。", "p2": "職場AIの研究は導入率を測ることが多く、労働者がAIから得る恩恵の差や、その差が雇用主の提供、仕事内容、態度のどれによるのかは分かっていなかった（抄録）。", "p3": "Pew Research Centerのアメリカン・トレンド・パネル第157波（2024年10月、3分野の就業者3,010人）を使い、12の結果について重み付きロジスティック回帰で調整済み予測確率を推定した。Fairlie分解で、各分野間の差を測定された特性による部分と残差に分けた（抄録）。解釈：残差が大きいほど、仕事内容など観測された違いでは説明できない、雇用主側の要因の可能性が高まる。", "p4": "アクセス・利用・期待される見返りの9指標と、期待・不安・AIスキルの重要性の3つの態度指標で、分野間の調整済み確率の差を比べた（抄録）。", "p5": "9指標すべてで医療・福祉の調整済み確率が低かった（p ≤ .042）。教育は9指標中8つで知識労働と区別できなかった。態度の3指標には分野差がなかった（p = .159〜.769）。仕事内容はAI利用の差の約半分、雇用主による研修・奨励の差の5分の1〜3分の1を説明し、後者で残差が最大だった。医療・福祉の労働者は職業訓練への参加が知識労働者より多い（66.6%対54.1%）ため、不足は既存の訓練のAI内容にあると結論した（抄録）。", "p6": "横断データであり、分解の残差を雇用主の行動と断定はできない（解釈）。2024年10月時点の調査で、その後の急速な普及を反映していない可能性がある。対象は米国の3分野に限られる（抄録）。", "fun": "医療や介護で働く人たちは、AIを怖がっているわけでも、学ぶ気がないわけでもありませんでした。研修にはむしろよく参加しているのに、その中身にAIが入っていない。やる気の問題に見えたものが、実は「教える側の準備」の問題だった、という発見が興味深い点です。", "unverified": "各指標の具体的な確率の値と、分解の詳細な寄与は本文を読めず未確認。"}}, {"id": "pr06", "rank": 6, "headline": "運賃50セント化で郊外の住宅価格が上昇し付け値曲線が平坦化", "title": "Flattening the Curve: Public Transport Fare Reduction and Housing Markets", "url": "https://doi.org/10.2139/ssrn.7552222", "authors": "Jason Chia ほか", "venue": "SSRN", "date": "2026-10-02", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は出版社・オープンアクセス版とも取得できず）", "preprint": true, "p1": "公共交通の運賃引き下げが郊外ほど住宅価格を押し上げ、住宅の付け値曲線を平坦にすることを、理論モデルとクイーンズランド州の「運賃50セント」政策の自然実験で示した（抄録）。", "p2": "交通への投資や補助が地価・住宅価格に資本化することは知られていたが、運賃の引き下げそのものがどこにどれだけ資本化するかの因果的な証拠は乏しかった（抄録）。", "p3": "単一中心都市モデルで、公共交通の補助が都心から遠い場所ほど住宅価格を上げると導いた。2024年の州全体の運賃50セント政策を準自然実験とし、2023〜2025年の住宅取引168,503件に差の差法を適用した。携帯電話の信号データで利用者の変化も調べた（抄録）。", "p4": "都心からの距離に対する住宅価格の弾力性の変化を主な指標とし、交通の供給水準・所得・政策の恒久化による異質性と、厚生への影響を分析した（抄録）。", "p5": "距離に対する価格弾力性は政策後に−0.29から−0.27に変わった。外縁部ほど公共交通の利用が増え、売り手の交渉力が強まった。距離を条件づけると、交通の供給が多いほど、所得が低いほど、政策が恒久化したときに資本化が強かった。新規購入者の運賃節約が購入費の増分を回収するのに24.3年かかり、政府は失った運賃収入の67%を印紙税と土地税で回収するという（抄録）。", "p6": "州全体の政策のため、比較対象は距離の違いに依存しており、同時期の他の要因との分離は本文で確かめる必要がある（解釈）。政策の恒久化前後で効果が変わる点も、期待の形成の扱いが鍵になる（解釈）。", "fun": "電車やバスが安くなると、得をするのは乗客だけではありません。遠くに住んでも通勤が安くなるので、郊外の家の値段が上がり、都心と郊外の値段の差が縮みます。さらに政府は、減った運賃収入の3分の2を家の取引の税金で取り戻していた、という「お金の回り方」が面白い点です。", "unverified": "差の差法の比較群の定義と、携帯電話データの期間・規模は本文を読めず未確認。"}}, {"id": "pr07", "rank": 7, "headline": "企業のAI革新は消費者の苦情を増やす", "title": "When AI Innovation Meets Customer Service: Organizational Complementarities and Consumer Complaints", "url": "https://doi.org/10.2139/ssrn.7553399", "authors": "Yinliang Tan ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は出版社・オープンアクセス版とも取得できず）", "preprint": true, "p1": "企業のAI革新（AI特許の出願）が消費者の苦情の増加と結びつき、その関係は従業員のデジタル能力などの組織的な補完要因が強い企業で弱まることを示した（抄録）。", "p2": "AIの技術革新は組織の適応より速く進むが、その摩擦が顧客側にどう現れるかは、マーケティングのAI研究でほとんど扱われてこなかった（抄録）。", "p3": "2018〜2024年の中国上場企業について、AI特許の出願と個々のオンライン苦情記録を照合し、苦情の件数と金額をAI革新に回帰した。失敗の種類、苦情の話題、処理状況別にも分析した（抄録）。", "p4": "組織的補完性の代理指標として、従業員のデジタル能力に関する開示、マーケティング・顧客関連のAI開示、ESG成績、サイバーセキュリティ開示の強さによる調整効果を検証した（抄録）。", "p5": "AI革新は、複数の失敗の種類・苦情の話題・処理状況のいずれでも、苦情の件数と金額と正に関連した。この関連は、従業員のデジタル能力開示が多い企業、顧客関連のAI開示が多い企業、ESG成績が良い企業、サイバーセキュリティ開示が多い企業で弱かった（抄録）。", "p6": "関連の分析であり、AI革新が苦情を増やす因果関係は抄録の範囲では確立されていない（解釈）。補完性はすべて開示に基づく代理指標で、実際の能力との対応は本文で確かめる必要がある（解釈）。", "fun": "新しいAIを開発した会社ほど、お客さんからの苦情が増えるという、ちょっと意外な結果です。技術だけが先に進み、それを使いこなす社員や仕組みが追いつかないと、そのしわ寄せが顧客対応の現場に出る。技術と組織は「セット」で整える必要があることを示しています。", "unverified": "効果の大きさと、内生性への対処（操作変数など）の有無は本文を読めず未確認。"}}, {"id": "pr08", "rank": 8, "headline": "債務再編の効果を因果アップリフトで異質性推定", "title": "Heterogeneous Estimation of the Causal Effect of Debt Restructuring Interventions: A Causal and Explainable Uplift Modeling Framework for the Economic Optimization of Credit Risk Portfolios", "url": "https://doi.org/10.2139/ssrn.7556744", "authors": "Antonio Aguilera Gonzalez", "venue": "SSRN", "date": "2026-10-03", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文はSSRN・OpenAlexとも取得できず）", "preprint": true, "p1": "債務再編の介入を誰に割り当てるべきかを、デフォルト確率ではなく「介入でデフォルト確率がどれだけ変わるか」（条件付き平均処置効果）で決める因果アップリフトの枠組みを示した（抄録）。", "p2": "従来の信用スコアはデフォルト確率 P(Y=1|X) を推定するが、ポートフォリオ管理の価値を決めるのは「この借り手に介入したら確率がいくら下がるか」であり、通常のスコアはこれに答えられない（抄録）。", "p3": "Neyman–Rubinの潜在結果の枠組みで、条件付き平均処置効果（CATE）の6つの推定量（S/T/X/Rメタ学習器、二重頑健なDR学習器、正直な因果フォレスト）を比べ、予算制約つきの経済的意思決定層と、推定された処置効果そのものに適用するシャープレイ値の説明層を組み合わせた（抄録）。例：同じ高リスクの借り手でも、再編すれば返済できる人と、再編しても返せない人を区別して、前者に予算を回す。", "p4": "2層の検証を行った。真値が分かる半合成層（Home Creditの実際の信用共変量の上に処置効果を作る）と、本当に無作為化された処置がある頑健性層（Orange Belgiumの顧客離反データ）である。規制上の損失率（LGD）と再編費用の実際の基準値で経済価値を較正した（抄録）。", "p5": "どの推定量も普遍的には優れず、信用データで優位だった順位は、本当の無作為化の下でほぼ完全に逆転した。CATEに基づく方針は大きな正の増分価値を生み、全員への介入やリスクだけによる優先付けは価値を損なった（抄録）。", "p6": "信用データの層は半合成で、本当の債務再編の無作為化データでの検証ではない（抄録から読める）。推定量の順位の逆転は、データの性質に応じた選び方の指針がまだないことを意味する（解釈）。", "fun": "「倒産しそうな会社を助ける」のが一番よさそうに思えますが、助けても倒産する会社や、助けなくても大丈夫な会社に支援しても無駄になります。大事なのは「助けたら結果が変わる人」を見つけることだ、という発想の転換が、薬を効く患者に絞るのと同じで面白いところです。", "unverified": "増分価値の具体的な金額と、各推定量の性能の数値は本文を読めず未確認。"}}, {"id": "pr09", "rank": 9, "headline": "根拠に基づく監査可能な合成顧客シミュレーション", "title": "Auditable Synthetic Customers A Systems Architecture for Concept-First, Evidence-Grounded Segment Simulation", "url": "https://doi.org/10.2139/ssrn.7552883", "authors": "David Gates ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は出版社・オープンアクセス版とも取得できず）", "preprint": true, "p1": "人口規模の消費者データから選んだ根拠でLLMを条件づけ、消費者セグメントの「考え方」を模擬する実運用システムの設計を示し、正確さではなく「後から検証できること（監査可能性）」を主張した（抄録）。", "p2": "LLMで合成した顧客に質問するシステムは増えているが、答えが何に基づいているのかを確かめられず、人間の回答との一致だけで評価されがちだった（抄録）。", "p3": "4つの設計方針をとる。(1) セグメントを多次元で表し、各変数に指数（基準母集団との違い）と浸透率（セグメント内の普及）の2値を持たせる。(2) 質問が提起する概念を先に確定し、検索と回答を概念で拘束する。(3) 2系統の検索で質問ごとの変数の束を組み立てる。(4) 回答ごとに、扱った概念・使った変数・情報源の構成を構造化して記録する（抄録）。", "p4": "本論文はシステムと設計の論文で、概念の追跡可能性の予備的な内部監査を報告する。人間の調査との比較検証は計画を示すのみで、結果は報告していない（抄録）。", "p5": "意図する用途は、態度や動機に関する質問、コンセプトへの反応、トレードオフの模擬で、セグメント水準の方向的な信号を目標とする。行動の測定、正確な選択シェアの推定、経年の追跡は対象外と明示した（抄録）。", "p6": "人間の回答との一致は未検証であり、監査可能性が妥当性を保証するわけではない（抄録から読める）。根拠の記録が「自己申告」の部分を含む点は、記録自体の信頼性の検証が必要になる（解釈）。", "fun": "AIに「30代の共働き家庭ならこの商品をどう思う？」と聞くと、それらしい答えが返ってきます。でも、その答えが本物のデータに基づくのか、AIの思い込みなのかは分かりません。答えに「どのデータを根拠にしたか」の記録を必ず添えさせる、という発想は、レポートに出典を書かせるのと同じ考え方です。", "unverified": "予備的な内部監査の結果の数値は本文を読めず未確認。"}}, {"id": "pr10", "rank": 10, "headline": "出社回帰は出社の水準と推移で影響が異なる", "title": "Return-to-office (RTO) is multidimensional: Attendance level and trajectory predict different employee outcomes", "url": "https://doi.org/10.31234/osf.io/u53zm_v1", "authors": "Yingyue Luan ほか", "venue": "PsyArXiv", "date": "2026-10-03", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "PsyArXiv（OSF）のPDF本文（結果、限界、方法の標本・測定の節）を読んだ。表と補足資料は読んでいない", "preprint": true, "p1": "出社回帰（RTO）を「どれだけ出社しているか（出社水準）」と「どれだけ速く出社を増やしたか（出社の推移）」に分けると、業績・ウェルビーイング・組織文化の認識・AI活用との関係がそれぞれ違うことを、入館記録で示した（抄録、結果）。", "p2": "RTO政策の効果の研究は少なく、多くは在宅から出社への二値の変化として扱ってきた。業績向上や文化の強化というRTOの根拠は、従業員単位で検証されていなかった（序論、結果）。", "p3": "多国籍の金融サービス企業で、出社が横ばいか増えた従業員1,163人の12か月の入館記録（13,956人月）を使った。全期間の出社割合（全体水準）、2水準の線形成長曲線モデルで推定した初期水準（切片）と推移（傾き）、推移を3群（横ばい・中程度増・大幅増）に分けた指標を作り、その後に測った10の結果にOLSで回帰した（結果、方法）。", "p4": "結果は、上司評価の業績（5段階）、ストレスとバーンアウト（単一項目）、組織文化の3側面（適切なリスクテイク、倫理的文化、革新性）、AIの4つの使い方（AIへのフィードバック希求、役割として期待されるAI利用、協働者としてのAI、道具としてのAI）で、出社記録より後に測った（方法）。", "p5": "全体の出社水準は業績と無関係で、出社の増え方が速いほど業績が低かった（b = −0.05、p < .01。大幅増群は横ばい群より b = −0.22）。逆に、出社水準が高いほどストレス（b = 0.67）とバーンアウト（b = 0.40）が高く、推移とは無関係だった。出社水準が高いほどAIへのフィードバック希求（b = 1.51）、役割としてのAI利用（b = 1.22）、協働者としてのAI利用（b = 1.12）が高かったが、道具としての利用とは無関係だった（結果）。", "p6": "著者は、1社のデータであること、考察で示した仕組みは検証していないこと、観察期間が1年で開始前の増加を捉えられないことを限界に挙げる（限界）。出社を減らした149人を除いた標本であり、出社の選択が自発的なため、業績の低い人が急いで出社を増やした逆の因果も残る（解釈）。", "fun": "「会社に来れば成果が上がる」とよく言われますが、この会社のデータでは、出社日数そのものは成果と関係がなく、急に出社を増やした人ほど評価が低いという結果でした。一方で出社が多い人ほどストレスは高いけれど、AIを相棒のように使っていた。出社には「量」と「速さ」という2つの顔がある、という見方が面白い点です。", "unverified": "表3の全推定値と、出社を減らした従業員を含めた頑健性分析の結果は確認していない。"}}, {"id": "pr11", "rank": 11, "headline": "対数比のクラスタでホテルの財務構造の型を抽出", "title": "Beyond Financial Ratios: A Zero-Aware Compositional Analysis of Hotel Financial Architecture Through Shock and Recovery", "url": "https://doi.org/10.2139/ssrn.7556585", "authors": "Mónica Méndez-Díaz ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文はSSRN・OpenAlexとも取得できず）", "preprint": true, "p1": "財務比率を使わずに、資産・負債・収益・費用の「構成」としてホテル企業の財務構造（財務アーキテクチャ）を分類し、コロナ禍の衝撃と回復を通じて型が持続しつつ揺れ動いたことを示した（抄録）。", "p2": "比率分析は分母の選び方が恣意的で、資産・負債・営業フローが一体となって事業を形づくる様子を隠してしまう。経済的に意味のあるゼロ（例：固定資産を持たない）を機械的に置き換える処理も問題だった（抄録）。", "p3": "マドリードのホテル企業117社の612企業年（2019〜2024年）について、固定資産・流動資産・負債合計・収益・費用の5つの正の会計項目を等長対数比（ilr）空間に写し、全期間をまとめたk平均法で分類した。ゼロを考慮した構成データの扱いと、年をまたいで共通の重心を使う（抄録）。解釈：各社の「財務の配合比率」だけを見て、規模の違いを取り除いた型分けである。", "p4": "企業単位の再標本化と1年除外の分析で解の安定性を、項目や期間の取り方を変えた別の設定で分類の頑健性を調べた（抄録）。", "p5": "資産中心で営業フローの少ない型と、資産の軽い営業集約型の2つが繰り返し現れた。営業集約型の割合は2019年の37.2%から2020年に24.2%へ下がり、2024年に39.6%まで戻った。連続する年の移行のうち型が変わったのは9.6%だけで、業界水準の大きな変動と企業単位の強い持続性が共存した（抄録）。", "p6": "著者は、分類が推定対象（項目と期間の選び方）に依存し、普遍的に不変ではないと認めている（抄録）。マドリードのホテル業に限られ、型と将来の財務困窮や業績の関係は抄録の範囲では検証されていない（解釈）。", "fun": "会社の健康診断は「自己資本比率」などの割り算で行うのが普通ですが、何で割るかで見え方が変わります。この研究は、料理のレシピの「配合の比率」を見るように、資産・借金・売上・費用のバランスそのものを比べました。コロナで一時的に型が崩れても、ほとんどの会社は元の型に戻った、という「体質」の強さが見えてきます。", "unverified": "各型の財務的な特徴の具体値と、ゼロの扱いの具体的な方法は本文を読めず未確認。"}}, {"id": "pr12", "rank": 12, "headline": "インフラ監視の可観測性は「状態判別」と「持続観測」", "title": "Observability in Infrastructure Monitoring: State Discrimination and Persistent Observation from the LUMO and Espoo Case Studies", "url": "https://doi.org/10.2139/ssrn.7552882", "authors": "Martin Hoffmann", "venue": "SSRN", "date": "2026-10-03", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は出版社・オープンアクセス版とも取得できず）", "preprint": true, "p1": "インフラ監視の「可観測性」を、状態を判別できるか（状態判別）と、観測を続けられるか（持続観測）の2つの次元に分け、両者は同じではないことを2つの事例で示した（抄録）。", "p2": "インフラの計測データは大量にあるが、構造の状態についての証拠は少ない。計測が取れることと、損傷を見分けられることが混同されがちだった（抄録）。", "p3": "制御された格子塔の実験（LUMO）で状態判別を、フィンランド・エスポーの高さ35 mの通信塔で持続観測を評価した。前者では構造ヘルスモニタリング（SHM）から得た振動数と減衰の特徴と、レーダー由来のチャネルの判別能力を比べた。後者では衛星Sentinel-1の約150回の観測を使った（抄録）。", "p4": "LUMOでは健全と損傷の状態を区別できるかを、エスポーではレーダーの反射の安定性、位相由来の観測量の持続性、計測の連続的な利用可能性を評価した（抄録）。", "p5": "LUMOでは、SHM由来の振動数と減衰の特徴は健全と損傷を一貫して区別したが、レーダー由来のチャネルの判別能力は弱かった。エスポーでは、構造状態のラベルはないものの、安定した反射、持続する位相由来の観測量、連続した計測が得られた（抄録）。", "p6": "2つの次元を別々の構造物で評価しており、同じ構造物で両方を同時に満たす監視系の検証ではない（解釈）。判別能力の定量的な指標の値は抄録になく、本文で確かめる必要がある。", "fun": "毎日体重計に乗っても、病気が分かるとは限りません。「ずっと測れていること」と「異常を見分けられること」は別の能力だ、という当たり前だけれど見落とされがちな区別を、鉄塔の実験と衛星レーダーで確かめた研究です。データが多いほど安心、とは言えない理由がよく分かります。", "unverified": "判別性能の数値（正解率など）と、LUMOの損傷の種類は本文を読めず未確認。"}}, {"id": "pr13", "rank": 13, "headline": "高速貫入の初期応答から小惑星表土の粒子剛性を推定", "title": "Constraining Particle Stiffness in Asteroid Regolith from Early-Time High-Speed Penetrator Dynamics under Local Granular Variability", "url": "https://doi.org/10.48550/arxiv.2610.01470", "authors": "Zichen Wang ほか", "venue": "arXiv (Cornell University)", "date": "2026-10-01", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（数値手法§2.3–2.4、結果§3.1–3.2・3.4、含意と限界§4、表3・5・7）を読んだ。§3.3のメゾスケール解析は要約のみ", "preprint": true, "p1": "小惑星の表土に高速で打ち込む貫入体の「最初の減速」から、表土粒子のヤング率をおおまかな範囲に絞り込めることを、離散要素法と多体動力学の連成シミュレーションで示した（抄録、§3.4）。", "p2": "瓦礫の集まりの小惑星の表土の力学的性質は、材料の性質と局所の粒子配置の両方に依存するため、ほとんど分かっていない。貫入時の応答が配置のばらつきに埋もれず材料の性質を映すかは未検証だった（§1）。", "p3": "EDEMとAdamsを双方向に連成し、2×2×4 mの容器に微小重力下で直径0.10 mの単一径の球16,700個を沈降させた床に、直径0.08 mの貫入体を約100 m/sで打ち込む。第1段で6つのパラメータを1つずつ変えて感度を調べ、第2段でヤング率5水準を同じ床の同じ17地点で試した（85計算）。速度90→75 m/sの区間の直線的な減速度を特徴量にした（§2.3–2.4、表3）。", "p4": "地点をそろえた対比較で、ヤング率と地点による変動を分け、1地点を丸ごと除いて残りで分類する交差検証（LOSO）で、未知の地点でのヤング率の識別能力を評価した（§3.2、表7）。", "p5": "6つの中でヤング率だけが初期の減速を明確に分けた（§3.1、図6）。平均減速度は5×10⁶ Paの3,350 m/s²から7×10⁸ Paの22,302 m/s²へ増え、群平均はべき指数0.388のべき乗則に従った（表5、図9）。ln aの平方和の84.30%をヤング率、8.44%を地点が占めた。5水準の識別は54.12%にとどまったが、3つの大まかなクラスでは83.53%だった（表7）。", "p6": "著者は、単一の沈降床・単一径の球・1つの貫入条件での結果で、独立な床や不規則形状・粒度分布への一般化、他のパラメータが同時に不確かなときの一意な識別は示していないこと、実際の表土への定量的な適用には実験検証が要ることを明記している（§3.2、§4.2–4.3）。", "fun": "小惑星の表面の砂がどれくらい硬い粒でできているかは、実際に行って触らないと分かりません。そこで、探査機から槍のようなものを打ち込み、刺さる瞬間のブレーキのかかり方から粒の硬さを推理しよう、という発想です。粒の並び方の偶然で答えがぶれても、大ざっぱな「柔らかい・中くらい・硬い」なら8割以上見分けられた、という正直な結果が面白い点です。", "unverified": "§3.3のメゾスケールの荷重伝達の定量結果（接触経路の数など）は詳しく読んでいない。"}}, {"id": "pr14", "rank": 14, "headline": "山火事後の運賃無料化で誰が公共交通を増やしたか", "title": "Fare-Free Through the Fire: Transit Rider Responses to Emergency Fare Suspension During the 2025 Los Angeles Wildfires", "url": "https://doi.org/10.2139/ssrn.7551223", "authors": "Sarah Grajdura ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文はSSRN・OpenAlexとも取得できず）", "preprint": true, "p1": "2025年のロサンゼルス山火事の後に実施された公共交通の緊急運賃無料化で、誰が利用を増やし、無料だから乗ったのは誰か、何の手段から乗り換えたかを明らかにした（抄録）。", "p2": "災害時の一時的な運賃停止は移動を支える手段になりうるが、利用者がそれにどう反応するかはほとんど分かっていなかった（抄録）。", "p3": "2025年2月3〜12日にロサンゼルス郡の交通アプリ利用者に配布したオンライン調査を、二項ロジスティック回帰と、まれな事象に強いFirthの罰則付きロジスティック回帰で分析した（抄録）。", "p4": "結果は、山火事後に公共交通の利用が増えたか、運賃が無料だったからこそ行った移動があるか、乗り換え前の手段の3つで、人口統計的特性・健康・交通アクセスとの関連を推定した（抄録）。", "p5": "無料期間の利用の質問に答えた人の39.7%が普段より多く乗ったと答え、追加質問に答えた人の18.5%が無料だったから行った移動があった。乗り換え前の手段は徒歩が最多で、他人の送迎、配車サービス、自家用車、カーシェアが続いた。ヒスパニック・ラテン系、健康状態がよい人、交通アクセスのよい地域の人は利用を増やすオッズが高く、中・高所得層は無料だから乗るオッズが低く、65歳以上は高かった（抄録）。", "p6": "調査対象が交通アプリ利用者に限られ、もともと公共交通を使う人に偏っている可能性がある（解釈）。回答者数と回答率は抄録にない。自己申告の利用変化で、実際の乗車データとの照合は抄録の範囲では行われていない。", "fun": "災害で暮らしが混乱したとき、バスや電車をただにすると誰が助かるのか。答えの一つは「歩いていた人が乗れるようになった」でした。車で移動する人の代わりではなく、移動手段の乏しい人の足になっていた、という結果は、無料化が誰のための政策なのかを考えるヒントになります。", "unverified": "回答者数、各オッズ比の値は本文を読めず未確認。"}}, {"id": "pr15", "rank": 15, "headline": "個人のレジリエンスを生涯資本で説明する", "title": "Resilient Citizens in Resilient Societies: The Determinants of Individuals’ Resilience", "url": "https://doi.org/10.31235/osf.io/azuqw_v1", "authors": "samuel plach ほか", "venue": "SocArXiv", "date": "2026-10-03", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "SocArXiv（OSF）のPDF本文（データ・方法・主要結果・限界の節と図3）を読んだ。分散分解の詳細表と付録は読んでいない", "preprint": true, "p1": "コロナ禍の欧州23か国の縦断データで、個人のレジリエンスを経済・人的・社会・制度の「生涯資本」で説明し、社会的包摂が最も強く、次いで健康が効くことを示した（抄録、§5）。", "p2": "レジリエンスの社会科学研究は概念があいまいで、政策に使いにくいと批判されてきた。個人の資源と、社会のつながりや公的制度の支えを、同じ枠組みで検証した研究は少なかった（序論、背景）。", "p3": "レジリエンスを、撹乱で資源の必要が変わり入手が減っても望ましい結果を保つ力とし、生涯資本（経済：滞納の少なさ・貯蓄・住居の安定、人的：学歴・健康、社会：社会的包摂、制度：公的社会支出・政府の有効性）で説明する。Eurofoundの生活・労働とCOVID-19調査（16,071人、45,294観測）に国レベルのデータを結び、個人の変量効果や国の固定効果などを入れた9つの多層モデルで推定した（§4.1–4.2）。", "p4": "レジリエンスはCD-RISC尺度の2項目の平均で測り、全変数を標準化して係数の大きさを比べた。資本間の交互作用で代替効果を、分散を国・個人・個人内に分解して説明力を評価した（§4.2）。", "p5": "すべての生涯資本がレジリエンスと正に関連した。社会的包摂の1標準偏差の上昇はレジリエンスの約0.3標準偏差、健康は約0.2標準偏差の上昇と関連し、経済資本は合わせてもこれより小さかった（§5、図3）。生涯資本は全分散の22%を説明し、国間の分散の約45%、個人間の約36%を説明したが、個人内の変動はほとんど説明しなかった（抄録）。", "p6": "著者は、レジリエンスが主観的な2項目で測られること、社会資本を「社会から取り残されている」の1項目で測ること、コロナ禍の欧州に限られること、逆因果の可能性があり因果は確立していないことを限界に挙げる（§6）。", "fun": "困難から立ち直る力は、お金があるかどうかよりも「社会から取り残されていない」と感じられるかどうかと強く結びついていました。貯金や学歴よりつながりが大事、という結果は、レジリエンスを個人の性格だけでなく、周りとの関係や社会の仕組みが支える力として捉え直す視点を与えてくれます。", "unverified": "資本間の代替効果（表1）の具体的な係数と、南欧で効果が大きいという結果の数値は確認していない。"}}, {"id": "pr16", "rank": 16, "headline": "疎なセンサから若材齢コンクリートの状態を物理情報で再構成", "title": "Physics-informed state reconstruction under sparse sensing for digital-twin monitoring of early-age concrete", "url": "https://doi.org/10.2139/ssrn.7556850", "authors": "Hao Li ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "少数の温度センサだけから、若材齢コンクリートの温度・水和度・圧縮強度の発展を物理情報型の枠組みで再構成する方法を示した（抄録）。", "p3": "入力は数点の温度履歴のみで、熱・化学・力学の連成モデルを物理制約として使い、直接測っていない水和度と強度を推定する。高精度数値モデルで検証したのち、計測器付き供試体の実験で確かめた（抄録）。", "p5": "温度の時間変化をよく捉え、水和度と強度の発展も実験と整合したと報告する。半断熱条件で時間的傾向と空間的ばらつきを保った場を再構成できたという（抄録）。数値の精度指標は抄録になし。", "fun": "打ったばかりのコンクリートの中は見えないのに、表面近くの温度計数本から中の固まり具合まで推し量る試みです。温度は化学反応（水和）の熱で上がるので、熱の出方を物理の式で逆にたどれば、反応がどこまで進んだかが分かるという発想が面白いところです。", "unverified": "再構成誤差の具体的な数値と、センサ数を減らしたときの精度の変化は抄録になく未確認。"}}, {"id": "pr17", "rank": 17, "headline": "FWD載荷時の舗装の熱粘弾性動的応答を連成解析", "title": "Coupled thermo-viscoelastic simulation of pavement dynamic response under FWD loading", "url": "https://doi.org/10.2139/ssrn.7556628", "authors": "Benoit PICOUX ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "気象履歴から舗装内の温度分布を再構成し、熱粘弾性モデルでFWD（重錘落下式たわみ測定）試験の動的応答を解釈する枠組みを示した（抄録）。", "p3": "気温・日射・風速の履歴から過渡温度場を再構成し、アスファルト層を2S2P1Dレオロジーモデルと時間-温度換算則（WLF）で表し、周波数領域FEMから時間領域のFWD応答を復元する（抄録）。", "p5": "50 kN載荷で中心たわみが9時の350 µmから17時の627 µmへ79%増えた。60 kN載荷では、提案の逆解析でたわみ形状のRMSEが92.1〜196.5 µmから8.1〜52.6 µmに下がった（抄録）。", "fun": "同じ道路でも朝と夕方で「柔らかさ」がほぼ倍違う、というのが驚きです。アスファルトは温まると水あめのように柔らかくなるので、温度を無視して測ると、暑い日の測定を「道路が傷んだ」と誤解しかねません。温度の影響と本当の劣化を見分けるのが狙いです。", "unverified": "実測データの規模（測点数・試験回数）は抄録になく未確認。"}}, {"id": "pr18", "rank": 18, "headline": "磁気能動型の多自由度メタマテリアル梁で広帯域制振", "title": "Magneto-active MDOF metamaterial beams for adaptive broadband vibration suppression", "url": "https://doi.org/10.2139/ssrn.7557274", "authors": "Dan Wang ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "磁気粘弾性エラストマー（MRE）の共振子と位置を変えられる副振動子を組み合わせ、複数の帯域を独立に調整できる多自由度メタマテリアル梁を提案した（抄録）。", "p3": "2自由度・3自由度の構成について、双極子に基づく解析モデル、有限要素解析、実験で分散関係と伝達特性を調べた。磁場でMREの貯蔵弾性率を変えて主バンドギャップを移し、副振動子の位置で高次帯域の境界を調整する（抄録）。", "p5": "複数の減衰帯域が生じ、2自由度構造の第1バンドギャップは150 mTの磁場で最大12.6%移動したと報告する。理論・数値・実験はよく一致した（抄録）。", "fun": "梁に小さな「おもり付きばね」を並べると、特定の周波数の揺れだけが通れなくなる帯（バンドギャップ）ができます。この論文は、その帯を磁石で動かせるようにして、揺れの周波数が変わっても後から合わせられるようにしたのが新しい点です。", "unverified": "減衰量（dB）や対象周波数帯の具体値は抄録になく未確認。"}}, {"id": "pr19", "rank": 19, "headline": "渦発生器で矩形柱の渦励振を受動制御", "title": "Passive control of vortex-induced vibration of a rectangular column and indirect disturbance of wake field based on vortex generators", "url": "https://doi.org/10.2139/ssrn.7556747", "authors": "Donglai Gao ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "辺長比1.25の矩形柱の渦励振を、三角形の渦発生器で受動的に抑える効果と仕組みを風洞実験で示した（抄録）。", "p3": "空気力の測定で渦発生器の最適形状を決め、流れの可視化、PIV、固有直交分解（POD）で後流の変化を調べた。偏角0°〜20°以上で効果を比べた（抄録）。", "p5": "偏角0°では揚力係数のRMSを50%以上減らした。10°では効果が落ち、20°を超えるとほぼ無効になった。小さい偏角では近傍後流の大規模渦を弱め、吊材の塔後流振動の間接的な抑制が期待できるという（抄録）。", "fun": "風を受けた柱の後ろに交互に渦ができると、柱は左右に揺すられます。柱の表面に小さな三角の「ひれ」を付けて渦のでき方を乱すだけで揺れが半分以下になる一方、風向きが少し斜めになると効かなくなる、という向きへの弱さも正直に示しています。", "unverified": "振動振幅そのものの低減率は抄録になく未確認。"}}, {"id": "pr20", "rank": 20, "headline": "不確実性を考慮した物理情報逆解析で多層複合材の欠陥同定", "title": "Uncertainty-Aware Physics-Informed Decoupled Inversion for Terahertz Parameter Reconstruction and Defect Identification in Multilayer Composites", "url": "https://doi.org/10.2139/ssrn.7556874", "authors": "Jinjin Xu ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "テラヘルツ計測から多層複合材の材料・形状パラメータと欠陥を、不確実性を見積もりながら段階的に逆推定する方法を提案した（抄録）。", "p3": "微分可能な電磁波モデルでニューラルとパラメトリックの表現を拘束し、感度解析でパラメータを群に分けて段階的に推定する。条件付きベイズ推論で前段の不確実性を後段へ伝え、信頼度に基づき共分散を調整する（抄録）。", "p5": "4層の反射ベンチマークで材料・形状の再構成と欠陥の位置特定ができ、実測の高分子ペレット透過データでは保留したすべての参照厚さが調整後の95%信用区間に入った（抄録）。", "fun": "多くの未知数が互いに絡み合う逆問題では、全部を一度に当てにいくと答えが定まりません。この研究は「よく効く周波数で、効く変数から順に決める」という段取りに、前の段の自信のなさを後ろへ引き継ぐ工夫を加えています。", "unverified": "欠陥同定の正解率などの数値は抄録になく未確認。"}}, {"id": "pr21", "rank": 21, "headline": "高評価ほど優先度が下がる舗装補修の採点の欠陥", "title": "When A Higher Rating Lowers Priority: Scoring Properties Of Fuzzy AHP-Utility Models For Pavement Maintenance Prioritisation And A Revised LUCHER Specification", "url": "https://doi.org/10.2139/ssrn.7553219", "authors": "Chabota Kaliba ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "舗装補修の優先順位付けに使われるファジーAHPと効用の混合モデルに、評価を上げると優先度が下がるなどの欠陥があることを示し、改訂版を提案した（抄録）。", "p3": "ザンビアのLUCHER枠組みの原仕様と現地適用を比べ、4つの性質を導いてモンテカルロ・シミュレーション（条件ごとに300回、模擬回答者48人、道路3〜10本）で定量化した（抄録）。", "p5": "道路内での効用の正規化により、道路間の必要度の差があると真の順位の回復は偶然並み（Kendall τ ≤ 0.10）だったが、正規化しない採点ではτ = 0.94〜0.97だった。ファジー化は精度を改善しなかった（抄録）。", "fun": "「ある道路の評価を上げたら、かえって補修の順番が後回しになる」という逆説が面白い点です。各道路の点数を内部で割り算して揃える手順が原因で、通知表の点数を科目ごとに相対化しすぎると全員同点になるのに似ています。採点ルールの数学的性質を確かめる大切さを示します。", "unverified": "改訂版LUCHER-Rの実データでの検証結果は抄録になく未確認。"}}, {"id": "pr22", "rank": 22, "headline": "動画観測と確率モデルで冠水道路の車速を予測", "title": "Predicting Vehicle Speeds on Flooded Roads Using Video-based Observations and Probabilistic Models", "url": "https://doi.org/10.2139/ssrn.7553360", "authors": "Zahra Hossein Pour ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "冠水した道路を走る車の速度を実際の動画から自動で取り出し、時間とともに変わる車速を確率モデルで予測する枠組みを示した（抄録）。", "p3": "YOLOv11の物体検出、カルマンフィルタによる追跡、遠近を考慮した速度計算で、遮蔽や手ぶれ、悪天候の映像から車速を抽出する。得た時系列の車速にワイブル分布型のモデルを当てはめた。監視カメラとYouTubeの映像で検証した（抄録）。", "p5": "動画からの車速の平均絶対誤差は12 mph未満で、実時間で動くと報告する（抄録）。予測モデルの精度の数値は抄録になし。", "fun": "水たまりの深さと車の速さの関係はこれまで実験で調べられてきましたが、本物の洪水では運転者は時間とともに慣れたり慎重になったりします。街角のカメラやネット動画という「偶然の記録」を観測データに変えて、その行動の変化まで捉えようとしている点が面白いところです。", "unverified": "水深の推定方法と予測モデルの検証指標は抄録になく未確認。"}}, {"id": "pr23", "rank": 23, "headline": "サイクロン被災の農村都市混在地域での支援の的", "title": "Targeting Disaster Response in Rural-Urban Settlements: Evidence from Tropical Cyclone Ditwah", "url": "https://doi.org/10.2139/ssrn.7557188", "authors": "Omri Shoshani ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "2025年のサイクロン・ディトワ（スリランカ）後の10,082件の主要情報提供者面接から、被害の種類と都市化の度合いに応じて生じやすい支援ニーズを推定した（抄録）。", "p3": "国際移住機関の避難追跡（DTM）面接データを、評価区域の間と内の変動を入れた多層ロジスティック回帰で分析し、被害とニーズの関連が都市化の度合いで変わることを許した（抄録）。", "p5": "都市部の洪水では農村部の洪水に比べ、給水とインフラ再建のニーズが生じる見込みが高く、衛生と生計支援のニーズが生じる見込みが低かった（抄録）。", "fun": "同じ「洪水」でも、町と村では困りごとが違うというのは直感的ですが、それを1万件の聞き取りから数字で示し、次の災害で最初にどこへ何を届けるべきかの目安にしようとしている点が実用的です。", "unverified": "オッズ比などの効果量の値は抄録になく未確認。"}}, {"id": "pr24", "rank": 24, "headline": "住宅税制の変更は近隣へ空間的に波及する", "title": "Spatial Spillover Effects of Tax Policy Changes on Housing Markets", "url": "https://doi.org/10.2139/ssrn.7557357", "authors": "Omer Erhan Erbis", "venue": "SSRN", "date": "2026-10-03", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "2017年の米国税制改革による持ち家補助の縮小が、自地区だけでなく近隣地区からの波及を通じて住宅価格の伸びを下げたことを、差の差法で分解した（抄録）。", "p3": "各地区の政策曝露を、自地区の補助喪失の強さと近隣地区の喪失からの波及の強さという2つの軸で測る差の差の設計を作った（抄録）。", "p5": "改革は住宅価格の伸びを平均で2018年に0.9ポイント、2019年に1.9ポイント下げた。2018年は自地区の効果、2019年は近隣の効果が主因で、波及を無視した通常の差の差法は効果の最大3分の2を見落とすという（抄録）。", "fun": "政策の効果を「受けた地区と受けなかった地区の差」で測る方法は、受けなかった地区も隣の影響を受けると効果を小さく見誤ります。この研究は隣からのとばっちりまで数に入れると、効果が見かけの何倍にもなり得ることを示しています。", "unverified": "近隣の定義（距離や範囲）は抄録になく未確認。"}}, {"id": "pr25", "rank": 25, "headline": "ストックホルムの都市代謝をスコープ別LCAで評価", "title": "Scope-Based Life Cycle Assessment of the Urban Metabolism of Stockholm", "url": "https://doi.org/10.2139/ssrn.7557233", "authors": "Ali shahbazi ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "ストックホルムの11部門の物質フローと環境負荷を、物量産業連関表とLCAを統合し、Scope 1〜3の枠組みで評価した（抄録）。", "p3": "REFLOWモデルを拡張し、サービス部門を物を供給する部分とサービスを供給する部分に分けて、中間部門から最終消費者までの体化された負荷を追跡した（抄録）。", "p5": "工業製品が18の中間影響のうち16を主導し、地球温暖化係数の52.3%を占めた。Scope 3がほぼすべての項目で負荷の70〜90%を占め、部門配分による合計は都市規模の会計より39〜98%大きかった（抄録）。", "fun": "町の中で出る排出だけを数えると、輸入品の製造で遠くで出た排出は見えなくなります。この研究では、ストックホルムの環境負荷の大部分がそうした「外で出た分」だと示し、数え方次第で合計が倍近く変わることも明らかにしました。", "unverified": "対象年と使用データの出典は抄録になく未確認。"}}, {"id": "pr26", "rank": 26, "headline": "曲がり管の衝撃波の非定常性を実験POD解析", "title": "Experimental proper orthogonal decomposition analysis of shock unsteadiness in a 60° constant-section curved duct", "url": "https://doi.org/10.2139/ssrn.7556520", "authors": "Xiaolin Sun ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "60°曲がり管内の衝撃波の揺らぎを、シュリーレン画像のスナップショット固有直交分解（POD）で、ノズル圧力比ごとに特徴づけた（抄録）。", "p3": "ノズル圧力比1.8〜3.0で各500枚の画像7組を取り、壁や剪断層などを除くマスクと時間平均の差し引きで変動場を得てPODを適用した。手法は閉形式解や合成モデルで検証した（抄録）。", "p5": "圧力比が上がると変動エネルギーは増え、エネルギーの90%に必要なモード数は1.8での147〜183から3.0での74に減った。衝撃波の法線方向のRMS変位は0.64〜0.88 mm（通路高さの1.6〜2.2%）だった（抄録）。", "fun": "たくさんの写真に共通する「動きのパターン」を少数の型に分解するのがPODです。圧力を上げるほど、ばらばらだった揺らぎが少数のまとまった動きに集約されていく、という結果は、複雑な現象が条件次第で単純になることを示していて面白いです。", "unverified": "なし"}}, {"id": "pr27", "rank": 27, "headline": "DEMで頁岩の支持剤入り亀裂の閉塞挙動を解析", "title": "Closure Behavior of Propped Fractures in Lacustrine Shale with Multi-Lithofacies Combinations by DEM", "url": "https://doi.org/10.2139/ssrn.7556922", "authors": "minghao Jiang ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "性質の異なる複数の岩相が組み合わさった頁岩で、水圧破砕後の支持剤入り亀裂が閉じていく過程を個別要素法（DEM）で再現した（抄録）。", "p3": "複数岩相の組み合わせを考慮した閉塞モデルを作り、閉塞圧と支持剤濃度を変えて単一岩相と複数岩相の亀裂面の幅の変化を計算した（抄録）。", "p5": "閉塞は急速な充填層の圧密・遷移・圧密と埋め込みの3段階で進み、幅の損失は圧密段階に集中した。複数岩相の面はくさび形に不均一に閉じ、支持剤濃度を1 kg/m²増やすと初期幅が約0.36 mm増えた（抄録）。", "fun": "地下の割れ目に砂粒（支持剤）を詰めて閉じないようにしても、硬い岩と柔らかい岩で挟むと、柔らかい側に粒がめり込んでくさび形に閉じてしまいます。粒の大きさの最適解が面の種類で逆になる、という結果は粒の世界の直感に反していて面白い点です。", "unverified": "実験との照合の有無は抄録になく未確認。"}}, {"id": "pr28", "rank": 28, "headline": "自重下の破壊を手軽に試験・解析する方法", "title": "Fracture under body forces: An accessible test and analysis", "url": "https://doi.org/10.2139/ssrn.7556729", "authors": "Farhad Kamarei ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "遠心載荷装置なしで、自重だけで亀裂を発生・進展させる卓上の破壊試験を提案し、体積力による破壊の理論を初めて検証した（抄録）。", "p3": "下向きのV字切欠きを持つ片持ち梁を自重だけで載荷し、切欠きの形状・位置と梁寸法を選んで、切欠き先端から亀裂が測れる形で進むようにした。3Dプリント可能なモルタルで試験した（抄録）。", "p5": "試験で亀裂の発生と進展が観察でき、2026年に提案された破壊理論で解析した結果が理論の初の検証になったという（抄録）。定量的な一致度は抄録になし。", "fun": "ダムや氷河の崩壊のように自分の重さで壊れる現象は、模型を小さくすると重さの効果が弱まり再現が難しくなります。遠心力で重さを増やす高価な装置を使わず、梁の形を工夫して机の上で再現した、というアイデア勝負の研究です。", "unverified": "試験体の寸法と理論との一致度の数値は抄録になく未確認。"}}, {"id": "pr29", "rank": 29, "headline": "適応解像度SPHの木構造MPI並列化", "title": "Tree-based MPI parallelization for adaptive resolution SPH method", "url": "https://doi.org/10.2139/ssrn.7556880", "authors": "Yin Hong ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "解像度が場所で変わる粒子法（SPH-ASR）を大規模並列で効率よく動かす、木構造のMPI並列モデルを提案した（抄録）。", "p3": "再帰的な二分木で領域を分割し、同期時間に基づく負荷分散と適応的な境界セルによる通信、局所の入れ子木での多重背景セルによる近傍粒子探索を組み合わせた。自由表面・多相界面・流体構造界面の5つの問題で評価した（抄録）。", "p5": "1億粒子の産業問題で、1000コアで最大90%の並列効率を得たと報告する（抄録）。", "fun": "粒子が場所によって細かかったり粗かったりすると、計算機に仕事を均等に配るのが難しくなります。木の枝分かれのように領域を分けて配り直す工夫で、1000個の計算機をほぼ無駄なく働かせた点が成果です。", "unverified": "他の並列化手法との比較の数値は抄録になく未確認。"}}, {"id": "pr30", "rank": 30, "headline": "インドの財務テキスト向けの新しさ重視RAG", "title": "FinRAG-IN: Recency-Aware RAG for Indian Financial Text", "url": "https://doi.org/10.2139/ssrn.7556540", "authors": "Dr. Sampada K S ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "ラーク・クロールの数の表し方や4月始まりの会計年度など、インドの金融テキスト特有の性質に合わせた検索拡張生成（RAG）の枠組みを示した（抄録）。", "p3": "金額単位を壊さないトークナイザ、密検索側だけに使う仮想文書埋め込み、文書の種類ごとに減衰率を変える新しさ重み付きの順位融合、再順位付け、生成された数値が根拠にあるかの検証の5要素からなる（抄録）。", "p5": "32の情報源の60文書の評価で忠実度0.89、nDCG@10が0.80となり、密検索のみの基準より23.6%と19.4%改善した。最大の改善（nDCG@10で10.4%）は順位融合によるものだった（抄録）。", "fun": "「1ラーク＝10万」のような数の言い方は、普通の言語モデルだと意味のない断片に切られてしまいます。地域ごとの数字の書き方や会計年度のずれが、AIの検索や回答の正確さを左右するという、言語と会計の境目の問題が面白い点です。", "unverified": "評価用ベンチマークの規模が60文書と小さく、一般化は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "発表前の取引状態が自社株買い発表の株価反応を左右", "title": "Pre-announcement trading states and share repurchase announcement returns", "url": "https://doi.org/10.2139/ssrn.7557183", "authors": "Xiaoying Wu ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "中国A株の自社株買い発表への株価反応が、発表前の株価・売買の過熱状態によって弱まることを示した（抄録）。", "p3": "2018年の自社株買い制度改革以降の発表を対象に、発表前の価格・売買状態の指標と発表期間の異常収益率の関係を、別の事象期間や指標の作り方、疑似発表日で頑健性を確かめた（抄録）。", "p5": "平均では短期の正の異常収益があるが、発表前の状態が過熱しているほど反応は弱い。政策で注目される安定化期、小規模企業、空売り対象外の企業、計画買付比率の大きい発表で関係が強い。12か月の実行率は状態によらずほぼ同じだった（抄録）。", "fun": "「自社株を買います」という発表は普通は株価を押し上げますが、発表前にすでに株価が盛り上がっていると効き目が薄れます。ニュースの価値は中身だけでなく、受け手がすでに何を織り込んでいるかで決まる、という市場の性質がよく見える研究です。", "unverified": "異常収益率の大きさの具体値は抄録になく未確認。"}}, {"id": "pr32", "rank": 32, "headline": "生成AIがカナダの会計教育をどう変えるか", "title": "Knowing and Becoming with Generative AI: Insights from the Canadian accounting education field", "url": "https://doi.org/10.2139/ssrn.7557353", "authors": "Simon Dermarkar ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "カナダの職業会計教育で、学生主導の生成AIの早期導入が学び方・教員の役割・カリキュラムを組み替えつつあることを面接調査で描いた（抄録）。", "p3": "2021〜2025年に学生と教員に行った面接を、高等教育を学ぶだけでなく「なる（becoming）」過程と捉える理論枠組みで分析した（抄録）。", "p5": "生成AIは学生の学習習慣に組み込まれ、自信を支える協働相手と受け止められていた。一方で機関の対応は慎重な試行から全面禁止まで分かれ、方針の遅れが見られた（抄録）。", "fun": "新しい道具は先生より先に学生が使いこなすことがよくあります。会計士を目指す学生にとって生成AIが「頼れる相棒」になる一方、使い方次第で専門家として育つべき力を縮めかねない、という両面を当事者の言葉から描いている点が興味深いところです。", "unverified": "面接の人数は抄録になく未確認。"}}, {"id": "pr33", "rank": 33, "headline": "中小企業の生成AI導入は製品・工程革新に不均一", "title": "Beyond Adoption? Uneven Generative AI Assimilation in SME Product and Process Innovation", "url": "https://doi.org/10.2139/ssrn.7557284", "authors": "Yongseok Jang ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "中小企業121社の調査から、生成AIは製品向けの革新には使われても社内業務の革新にはまだ組み込まれていない「導入と統合の溝」を示した（抄録）。", "p3": "機会・脅威の認知、技術の重要度、社内技術力、企業特性と、生成AIの導入（ロジスティック回帰）、製品革新・工程革新（OLS）の関係を分析し、媒介分析も行った（抄録）。", "p5": "機会の認知と技術の重要度が導入を予測し、脅威の認知と社内技術力は予測しなかった。導入は機会と製品革新の関係を部分的に媒介したが、工程革新は同じ要因でほとんど説明できなかった（抄録）。", "fun": "「AIを入れた会社」と「AIで仕事のやり方まで変えた会社」は別物だ、という指摘です。お客さん向けの商品には使っても社内の仕事の流れには入り込んでいない、という差を示していて、導入率だけを見ても実際の変化は分からないことが分かります。", "unverified": "回答企業の国・業種は抄録になく未確認。"}}, {"id": "pr34", "rank": 34, "headline": "職場のメンタルヘルスと心理的安全性介入の系統的レビュー", "title": "Workplace Mental Health and Psychological Safety: A Systematic Review of Interventions and Outcomes", "url": "https://doi.org/10.31235/osf.io/ehcwa_v1", "authors": "Sarah Khairunnisa Budiyanto", "venue": "SocArXiv", "date": "2026-10-03", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SocArXivに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "職場のメンタルヘルス介入の効果を、心理社会的安全風土の調整役割と、全員対象か対象者限定かの違いに注目して系統的に整理した（抄録）。", "p3": "PRISMA 2020に沿ってPubMedとGoogle Scholarを検索し、2011〜2026年の93件（系統的レビュー・メタ分析・アンブレラレビューなど）を、ROBINS-IやGRADEなどで質を評価して統合した（抄録）。", "p5": "マインドフルネスのeヘルス（g = 0.60）がCBT（g = 0.15）やストレス管理（g = 0.17）を上回った。ストレス管理は対象者限定で g = 0.64〜0.69、全員対象で g = 0.00だった。管理職研修はメンタルヘルスの知識を高めた（SMD = 0.73）（抄録）。", "fun": "同じストレス対策でも、全員に一律に配ると効果がほぼゼロで、困っている人に絞ると大きく効く、という対比が目を引きます。薬を必要な人に処方するのと同じで、「誰に届けるか」が「何を届けるか」と同じくらい大事だと示しています。", "unverified": "心理的安全風土の調整効果の具体的な結果は抄録になく未確認。"}}, {"id": "pr35", "rank": 35, "headline": "組織的非人間化が欠勤・排斥・反すうを招く（ペルー）", "title": "”When employees hold something back”: Explaining organizational dehumanization, employee absenteeism, ostracism, and work rumination in the Southern Macro Region of Peru", "url": "https://doi.org/10.2139/ssrn.7556518", "authors": "Magaly Pari-Apaza ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "組織から人として扱われていないと感じる「組織的非人間化」が、職場での排斥と仕事の反すうを経て欠勤を増やす経路を示した（抄録）。", "p3": "ペルー南部の民間企業の労働者602人（便宜標本）への横断調査を、PLS-SEMで分析した（抄録）。", "p5": "組織的非人間化は欠勤と職場の排斥に正の有意な効果を持ち、排斥は仕事の反すうを、反すうは欠勤を高めた。すべての仮説が支持されたと報告する（抄録）。", "fun": "「会社に道具扱いされている」という感覚が、仲間外れ、頭から仕事の悩みが離れない状態を経て、休みが増えることにつながる、という連鎖を描いています。気持ちの問題が出勤という行動にまで表れる道筋をたどった点が分かりやすい研究です。", "unverified": "横断データのため因果の向きは未確認。効果量の値は抄録になし。"}}, {"id": "pr36", "rank": 36, "headline": "政府機関職員の組織条件とバーンアウト", "title": "Relationship of Organizational Conditions and Workplace Burnout Among Employees of a Government Agency in the Philippines", "url": "https://doi.org/10.2139/ssrn.7551201", "authors": "Jeffrey Daliva ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "フィリピンの政府機関の職員40人を対象に、仕事の要求度-資源理論に沿って組織条件とバーンアウトの関係を調べた（抄録）。", "p3": "全数調査で、研究者が作成した質問紙の回答を平均・頻度とスピアマンの順位相関で分析した（抄録）。", "p5": "組織条件全体はバーンアウトと有意な負の関係にあり、仕事量・職場環境・仕事と生活の両立が関連した。管理者の支援・職場の意思疎通・承認は有意な関係を示さなかった。情緒的消耗が最も顕著な次元だった（抄録）。", "fun": "小さな職場でも、支えてくれる上司より、仕事の量と休む時間の確保の方が燃え尽きと結びつくという結果です。気持ちの支えだけでは疲れは減らず、まず負荷そのものを見直す必要があることを示唆しています。", "unverified": "40人の小標本の相関分析で、一般化の可能性は未確認。"}}, {"id": "pr37", "rank": 37, "headline": "金曜在宅勤務と政府職員の生産性", "title": "Friday Work-from-Home Arrangement and Employee Productivity in a Government Agency in the Philippines", "url": "https://doi.org/10.2139/ssrn.7550960", "authors": "Jennifer Agunos ほか", "venue": "SSRN", "date": "2026-10-03", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "フィリピンの政府機関で、金曜日の在宅勤務制度と職員の生産性の関係を調べた（抄録）。", "p3": "職員83人中73人の有効回答を、構造化質問紙の加重平均とピアソン相関で分析した（抄録）。", "p5": "在宅勤務制度の5つの次元すべてが生産性と有意な正の相関を示し、仕事の進め方の柔軟性が最も強く関連した。生産性はすべての次元で非常に高いと自己評価された（抄録）。", "fun": "週に1日だけ家で働く仕組みが役所の仕事にどう効くかを、働く人自身の評価で調べています。「柔軟に進められること」が一番効くという結果は、場所よりも裁量が大事かもしれないという問いを投げかけます。", "unverified": "生産性は自己評価で、客観的な成果指標との対応は未確認。"}}, {"id": "pr38", "rank": 38, "headline": "測定不変性をLLMベンチマークの項目選別に使う提案", "title": "Measurement Invariance as an Item-Screening Criterion for Large Language Model Benchmarks: A Position Note", "url": "https://doi.org/10.31234/osf.io/8fyem_v1", "authors": "Matthew James Timothy Lindsay Snelling", "venue": "PsyArXiv", "date": "2026-10-03", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "PsyArXivに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "LLMのベンチマークで、内容に関係ない提示の変更（並べ方など）に対して応答が変わる項目を、測定不変性の考えで除外する基準を提案した立場論文（抄録）。", "p3": "配置・計量・スカラーの不変性の階層を2パラメータ・ロジスティックモデルの母数に対応させ、テスト全体の階層と項目単位の除外規則を分けた。同じモデルを複数の提示で試す際の依存構造、4つの仮説、反証条件を明示した（抄録）。", "p5": "実証結果はなく、検証すべき仮説と反証条件を示した提案である（抄録）。", "fun": "人間向けのテストでは、問題の並べ方を変えただけで正解率が変わる問題は「悪い問題」とみなされます。同じ物差しをAIのテストにも当てはめよう、という提案で、AIの順位表が問題の出し方の偶然に左右されている可能性を問い直しています。", "unverified": "実データでの検証は行われておらず未確認。"}}, {"id": "pr39", "rank": 39, "headline": "対話AIの社会的立場の較正に向けて", "title": "Toward Social Position Calibration for Conversational AI&nbsp;", "url": "https://doi.org/10.2139/ssrn.7553561", "authors": "Shaoshuai Meng", "venue": "SSRN", "date": "2026-10-03", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "対話AIが利用者の立場を肯定しすぎる問題について、比較の基準となる人間集団を選んでも中立は定まらず、AIは自らの立場を開示すべきだと論じた（抄録）。", "p3": "既存研究とその論争を踏まえた論考で、データ分析は含まない（抄録）。", "p5": "単一の母集団で中立性を安定した普遍的基準として操作化することはできないとし、統治の目標を中立から開示へ移すべきだと主張する（抄録）。", "fun": "AIが「あなたは悪くない」と言いすぎるのを直そうとしても、何をもって中立とするかは人によって違います。だからAIは「どこにも立っていない」ふりをやめ、自分の立ち位置を明かすべきだ、という発想の転換が面白い論点です。", "unverified": "なし"}}, {"id": "pr40", "rank": 40, "headline": "AI界の有力者100人の世界観を合成的に再構成", "title": "What Does the AI Elite Think? Synthetic Worldview Reconstruction of the 100 Most Influential AI Actors (2010--2026)", "url": "https://doi.org/10.5281/zenodo.23121395", "authors": "Geiger, Lukas", "venue": "Zenodo", "date": "2026-10-03", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "2010〜2026年のAI界で影響力の大きい100人の集合的な世界観を、LLMを使った合成的世界観再構成という方法で12次元にわたって描いた（抄録）。", "p3": "社会学的に定義した集団ごとに集約したデータから、LLMで一貫した信念体系を再構成し、言行の比較、影響力の層別、4つの世界観類型を分析した（抄録）。", "p5": "高い使命感と技術決定論、低い人間観・平等主義を併せ持つ「両義的な技術メシア主義」の像が得られたとする。著者自身、再構成した像は実在の人物の検証済みの属性ではなく、因果的な知見でもないと明記している（抄録）。", "fun": "本人に聞かずに、集めた発言や行動からAIに「この集団ならこう考えるはず」と再構成させる、という大胆な方法です。結果の面白さとともに、著者自身が何が言えて何が言えないかを細かく断っている点も、この種の方法の危うさを考える材料になります。", "unverified": "元データの出典と、再構成の妥当性の検証方法は抄録になく未確認。"}}, {"id": "pr41", "rank": 41, "headline": "LLM間の予測誤差は状態依存で相関する", "title": "Correlated Minds: State-Dependent Error Correlation Across Large Language Models in Financial Forecasting, Benchmarked Against Human Professional Forecasters", "url": "https://doi.org/10.5281/zenodo.23113777", "authors": "Khiani, Rajan", "venue": "Zenodo", "date": "2026-10-03", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの登録説明（事前登録と予測の記録）を使用。研究の結果は含まれない", "preprint": true, "short": true, "p1": "金融予測で複数のLLMの誤りが市場の状態に応じて相関するかを、人間の専門予測者と比べる前向き研究の事前登録と、第5週の予測の記録（登録説明）。", "p3": "事前登録した分析計画を第三者のタイムスタンプ付きで凍結し、逸脱を記録しながら、マクロ統計の発表ごとにLLMの予測誤差の相関を測る設計である（登録説明）。", "p5": "結果はまだなく、一定以上の市場サプライズの発表で誤差相関（rho_bar）が0.147575を超えるなどの予測を事前に公開した段階である（登録説明）。", "fun": "複数のAIに予想させれば多数決で間違いが減る、とは限りません。AI同士が同じときに同じ方向へ外すなら、数を増やしても安心にならないからです。それを結果を見る前に予言として公開しておく、という研究の進め方自体も面白い点です。", "unverified": "研究の結果はまだ公開されておらず未確認。"}}, {"id": "pr42", "rank": 42, "headline": "社会経済的に不利な地区での糖尿病予防介入の実装", "title": "Proof-of-implementation of the SMART2D intervention: findings from a cluster randomised feasibility trial for prevention and control of type 2 diabetes in socio-economically disadvantaged neighbourhoods in Stockholm, Sweden", "url": "https://doi.org/10.64898/2026.09.30.26364359", "authors": "Meena Daivadanam ほか", "venue": "medRxiv", "date": "2026-10-03", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "medRxivに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "ストックホルムの社会経済的に不利な2地区で、糖尿病の予防と管理のための地域統合型ケア（個別指導と地域アウトリーチ）を通常の診療と比べた実行可能性試験の結果を報告した（抄録）。", "p3": "高リスク者84人と糖尿病患者58人をクラスター無作為化し、統合ケア群70人と施設のみ群72人を比べた。HbA1cの低下は混合効果モデルの差の差、他の結果は修正ポアソン回帰で分析した（抄録）。", "p5": "高リスク者では統合ケアでHbA1cの低下がやや大きく（調整後2.02、95%CI 0.20〜3.84）、受診継続が高かった（IRR = 1.22）。糖尿病患者では統合ケアで血糖管理（IRR = 0.92）と受診継続（IRR = 0.91）が低かった（抄録）。", "fun": "同じ地域ぐるみの支援が、まだ病気になっていない人には効き、すでに病気の人にはむしろ通常の診療の方が良かった、という分かれ方が興味深い点です。誰にどの支援が合うかは、病気の段階によって違うことを示しています。", "unverified": "2地区のみの実行可能性試験で、効果の一般化は未確認。"}}, {"id": "pr43", "rank": 43, "headline": "子ども期の不安定さが学歴を予測する", "title": "Childhood Instability Predicts Educational Attainment", "url": "https://doi.org/10.31234/osf.io/ck3j2_v2", "authors": "Andrew Caplin ほか", "venue": "PsyArXiv", "date": "2026-10-03", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "大きな出来事だけでなく日常の小さな不安定さを含む「子ども期の予測不能性」が、学業成績と高校修了の低さを予測することを示した（抄録）。", "p3": "デンマークの全国行政記録と、検証済みの質問紙による生活上の混乱の測定を結びつけ、2,793人を分析した。親の社会経済的地位と観測された大きな出来事を統制した（抄録）。", "p5": "予測不能性が大きいほど成績平均が低く、高校修了率も低かった。この関連は親の社会経済的地位と大きな生活上の出来事を考慮しても残った（抄録）。", "fun": "引っ越しや離婚のような大きな出来事だけでなく、「明日の予定が読めない」ような日々の不安定さも、子どもの学びに影を落とすという指摘です。貧しさが世代を越えて続く道筋の一つとして、日常の予測しやすさに光を当てた点が新鮮です。", "unverified": "効果の大きさの具体値は抄録になく未確認。"}}, {"id": "pr44", "rank": 44, "headline": "長期ケア施設での家族介護の軌跡（レビュー計画）", "title": "The trajectory of family caregiving in long-term care homes: A scoping review protocol", "url": "https://doi.org/10.6084/m9.figshare.34063491", "authors": "Anne Bourbonnais ほか", "venue": "Figshare", "date": "2026-10-03", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "題名", "basis_note": "Figshareの登録は1文の説明のみで、抄録・本文は入手できず", "preprint": true, "short": true, "p1": "題名から、長期ケア施設での家族による介護の役割が時間とともにどう変わるかを整理するスコーピングレビューの計画書と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "家族を施設に預けたら介護は終わり、ではありません。面会や付き添い、意思決定の手伝いなど、家族の関わり方が入所後にどう変わっていくのかという問いは、身近でありながらあまり見えていない部分を照らす問いです。", "unverified": "計画の対象範囲・方法は確認できなかった。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "Transformerの早すぎる思考停止を小さなLoRAで解消", "title": "Transformers Stop Thinking Too Early, and a Tiny LoRA Fixes It", "url": "https://arxiv.org/abs/2609.36585", "authors": "Zehao Jin ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-02", "why": "事前学習済みTransformerが文脈内の参照を数行しか追えないことを示し、早い層の低ランクLoRAで追跡距離を大きく伸ばした。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§1〜§4、§9の考察と限界、図2〜4の説明）を読んだ。§5〜§7と付録は見出しと要約のみ", "preprint": true, "p1": "事前学習済みTransformerは文脈中の参照（K = apple、B = K、D = B …）を1.4〜3.6行しかたどれないが、1つの層に入れた極小のLoRA（ランク8）だけで、重みをすべて凍結したまま24〜50行、ループ型モデルでは160行以上たどれるようになることを示した（抄録、§4）。", "p2": "Transformerは原理的には長い参照の連鎖を計算できるはずなのに、実際には数行で失敗する。層を深くしてもループを増やしてもほとんど伸びず、その原因が能力の欠如なのか、計算の使われ方なのかは分かっていなかった（§1、§3）。", "p3": "代入の連鎖からなるプログラムの根の値を答えさせる課題で、残差ストリームに h ← sh + BAh（A、Bはランク8、sはスカラー）を1層だけ挿入して学習する。Qwen3-8Bでは追加パラメータは65,537個（0.01%未満）で、14層目に入れる（§2）。因果的な復元実験と線形読み出しで、各行が「どの連鎖に属するか」をどこまで運べているか（リレー）を追跡した（§3、§5）。", "p4": "13の標準ベースモデル、DeepSeek-V4-Flash、ループ型のOuroとHuginnで、80%以上の正答でたどれる最長の連鎖（到達距離）を測った。標準モデルは各セル200プログラムで評価した（§2）。", "p5": "標準モデルの到達距離は1.4〜3.6行（中央値2.2）だった（§3）。LoRAによりQwen3-8Bは24行の連鎖で正答率15.5%→99.0%（200中198）となり、長く学習したLoRAは50行に達した。Ouro-1.4Bは4ループで60行、8ループで少なくとも160行に達した（§4、図3）。WikiTextのパープレキシティは10.14→10.148とほぼ変わらなかった（§2）。LoRAを26層目に置くと効果はほぼ消えた（§4）。", "p6": "著者は、課題が合成的な文脈内課題であること、詳細な追跡がQwen3-8BとOuro-1.4Bに偏ること、LoRAは課題形式ごとに学習すること、挿入位置の予測精度が控えめであること、学習した経路の方向と必要最小ランクが未特定であることを限界に挙げる（§9）。", "fun": "「AはりんごでBはA、DはB、ではDは？」というなぞなぞを、巨大なAIでも3段くらいで間違えます。ところが脳の途中の1か所にほんの小さな「付箋」を貼るだけで、50段先までたどれるようになりました。能力がないのではなく、考えるのを早くやめていただけ、という発見が題名のとおり面白いところです。", "unverified": "§5〜§7のリレー機構の詳細な因果実験とMuSiQueでの改善幅の数値は確認していない。"}}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "キャンパス開放で大学の研究の量と質が上がる", "title": "Open Gates! Open Science! Campus Openness and University Research Productivity&nbsp;", "url": "https://doi.org/10.2139/ssrn.7552982", "authors": "Qiao Wang ほか", "venue": "SSRN", "date": "2026-10-03", "why": "中国の大学キャンパスの段階的な再開放と732万本の論文を結び、差の差法で物理的空間へのアクセスが研究生産性を高めることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は取得できず）", "preprint": true, "p1": "コロナ禍後の中国の大学キャンパスの段階的な再開放を利用し、物理的な空間へのアクセスが研究の量と質を高めることを差の差法で示した（抄録）。", "p2": "対面での交流や施設へのアクセスが科学の生産性にどれだけ効くかは、遠隔協働が広がった今でも因果的に測るのが難しかった（抄録）。", "p3": "キャンパスの再開放日とアクセス方式（全面開放・予約制・閉鎖）を手作業で集め、OpenAlexの2010〜2025年の論文732万本と結びつけた。閉鎖を続けた大学や予約制の大学を比較群とする差の差法で推定した（抄録）。解釈：再開放のタイミングが大学ごとにずれることを、いわば「自然の実験」として使っている。", "p4": "論文の量と質、他大学・企業との共同研究、新しい研究上のつながりを結果とし、基礎研究力・実験施設・分野の多様性による効果の異質性と、分野別の効果を調べた（抄録）。", "p5": "全面的な再開放は研究の量と質の両方を高めた。他大学や企業との共同研究が広がり、新しい研究上のつながりが生まれ、探索とマッチングの費用が下がったことと整合した。効果は基礎研究力が強く、実験施設が多く、分野が多様な大学で大きく、工学・農学・経済学と経営学に集中した（抄録）。", "p6": "再開放の時期が大学の特性（感染状況や行政の判断）と相関していれば、比較群との差に交絡が入りうる（解釈）。効果の大きさと事前傾向の検定結果は抄録になく、本文で確かめる必要がある。", "fun": "オンラインでどこからでも共同研究できる時代でも、キャンパスの門が開くだけで研究が増え、質も上がった、という結果です。廊下での立ち話や実験室での偶然の出会いが、新しい研究のきっかけになっていることを、数百万本の論文から浮かび上がらせた点が面白いところです。", "unverified": "効果の大きさ（何%増えたか）と、質の指標の定義は本文を読めず未確認。"}}, {"id": "pn03", "rank": 3, "field": "教育", "headline": "授業組込みのAIチューターで成績が下がった（RCT）", "title": "The Effects of Course-integrated AI Tutoring on Student Performance and Engagement:&nbsp;A Randomized University Trial&nbsp;", "url": "https://doi.org/10.2139/ssrn.7546479", "authors": "Jing Liu ほか", "venue": "SSRN", "date": "2026-10-02", "why": "2,379人の学部生の無作為化比較試験で、生成AIチューターへのアクセスが成績と授業参加を下げたという重要な結果を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は取得できず）", "preprint": true, "p1": "米国の大規模公立大学での無作為化比較試験で、授業に組み込んだ生成AIチューターへのアクセスが、成績と学習管理システムでの参加をむしろ下げたことを示した（抄録）。", "p2": "生成AIのチューターは学習を助けると期待され急速に導入されているが、大学の正規の授業で無作為化して効果を測った証拠は乏しかった（抄録）。", "p3": "複数分野の学部生2,379人と教員30人を対象に、授業に統合された生成AIチューターへのアクセスを無作為に割り当てた（抄録）。比較は同じ科目のセクション間で行った。", "p4": "主な結果は期末成績と学習管理システム（LMS）上の参加で、標準偏差単位の効果として推定し、第一世代の大学生（親が大学を出ていない学生）での異質性も調べた（抄録）。", "p5": "同じ科目のセクション間では、チューターへのアクセスにより期末成績が0.37標準偏差、LMSでの参加が0.90標準偏差下がった。参加の低下は全標本でも同様に大きく、学業上の損失は第一世代の学生で大きいと推定された（抄録）。", "p6": "無作為化の単位（学生かセクションか）と、チューターの実際の利用度は抄録からは分からない（解釈）。1大学の結果で、チューターの設計や授業での位置づけが違えば結果は変わりうる（解釈）。", "fun": "いつでも質問できるAIの先生がいれば成績は上がるはず、と思いがちですが、結果は逆でした。AIに頼れる分、授業の課題や掲示板への参加が減り、成績も下がったのです。便利な道具が、もともとあった学びの機会を押しのけてしまう、という「置き換え」の怖さを示す実験です。", "unverified": "無作為化の単位と、チューターの利用率は本文を読めず未確認。"}}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "金融政策サプライズを3つのショックに分解して同定", "title": "Monetary policy surprises with imperfect information", "url": "https://doi.org/10.2139/ssrn.7551819", "authors": "Marek Jarocinski ほか", "venue": "SSRN", "date": "2026-10-02", "why": "市場の情報が不完全なとき、FOMC前後の金利変化を政策・中銀情報・ニュース反応の3ショックとして同時に識別する方法を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は取得できず）", "preprint": true, "p1": "FOMC前後の高頻度の金利サプライズには、純粋な金融政策ショックのほか、中央銀行の情報ショックと「ニュースへのFed反応」ショックが混ざっており、3つを同時に識別できることを示した（抄録）。", "p2": "市場が不完全な情報しか持たないと、発表時の金利変化は金融政策ショックを識別しない。先行研究は中央銀行の情報効果と政策ルールの誤認を競合する説明として扱ってきた（抄録）。", "p3": "金利と株価のサプライズの共変動、公開ニュースからのサプライズの予測可能性、FOMCとFOMC以外の発信の間の分散の違い（異分散性）を組み合わせて、3種類のショックを同時に識別した（抄録）。解釈：金利と株価が同じ向きに動くなら「Fedは景気をよく見ている」という情報ショック、ニュースで予測できるなら政策ルールの誤認、という手がかりの使い分けである。", "p4": "日次と月次の頻度で各ショックの効果の頑健性を調べ、2つの混入成分を取り除いた後の金融政策の効果の推定値の変化を評価した（抄録）。", "p5": "中央銀行の情報ショックの効果は日次・月次の両方で頑健だった。ニュースへのFed反応ショックは日次でのみ効いた。両者を取り除くと金融政策の効果の推定が強まった（抄録）。", "p6": "識別は異分散性などの統計的仮定に依存し、その妥当性は本文で確かめる必要がある（解釈）。対象期間と推定値の大きさは抄録にない。", "fun": "中央銀行が利上げを発表したとき、市場が驚く理由は1つではありません。「思ったより厳しい」のか、「中央銀行は景気をもっと良く見ているらしい」のか、「市場が政策の決め方を読み違えていた」のか。同じ金利の動きから3つの心の動きを見分ける、探偵のような分析が面白い点です。", "unverified": "対象期間、推定値の大きさは本文を読めず未確認。"}}, {"id": "pn05", "rank": 5, "field": "統計学", "headline": "打ち切りに対応した無条件分位点回帰", "title": "Censored Unconditional Quantile Regression", "url": "https://doi.org/10.2139/ssrn.7552879", "authors": "Stefano Grillini", "venue": "SSRN", "date": "2026-10-03", "why": "打ち切りがあるとRIF回帰が使えない問題を、Cox比例ハザードの第1段で補正する新しい推定量で解決した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は取得できず）", "preprint": true, "p1": "分布全体への影響を見る無条件分位点回帰（UQR）を、上限などで打ち切られたデータにも使えるように拡張した推定法（CUQR）を提案した（抄録）。", "p2": "UQRは再中心化影響関数（RIF）を被説明変数にしてOLSで推定する手軽な方法だが、打ち切り（上限で値が丸められるなど）があると、その表現が成り立たなくなる（抄録）。", "p3": "RIFに含まれる「潜在値が分位点以下か」の指示関数を、Coxの比例ハザードの第1段階から復元した、打ち切りを補正した条件付き期待値で置き換える。こうして作った擬似的な被説明変数を共変量にOLSで射影するので、RIF回帰の扱いやすさを保てる（抄録）。", "p4": "識別、推定量の漸近分布、手続き全体のブートストラップの妥当性の条件を理論的に示し、モンテカルロ実験で通常のUQRとの偏りを比べた。応用として、上限で丸められた米国CPS-SSAの所得データを分析した（抄録）。", "p5": "CUQRは打ち切りのあるデータに通常のUQRを直接適用したときの偏りを大きく減らし、標本が大きくなるにつれて、実際には不可能な潜在値の基準に近づいた。応用では、黒人と白人の所得格差が潜在分布全体で持続し、通常のUQRは中央値より上でそれを大きく過小評価していた（抄録）。", "p6": "第1段にCoxの比例ハザードを仮定しており、その仮定が崩れたときの頑健性は抄録の範囲では示されていない（解釈）。", "fun": "高所得の人の給料は統計上「○○ドル以上」とひとまとめにされることがあります。すると、上のほうの格差が見えなくなってしまいます。この方法で隠れた部分を推し量ると、所得の上の層ほど人種間の差が大きく見落とされていたことが分かった、という点が重要です。", "unverified": "偏りの減少幅と、所得格差の具体的な推定値は本文を読めず未確認。"}}, {"id": "pn06", "rank": 6, "field": "因果推論", "headline": "時空間干渉下の方策評価を置換不変性で推定", "title": "Causal PIE: permutation-invariant Estimator forOff-policy Evaluation under Spatio-temporalInterferences", "url": "https://doi.org/10.2139/ssrn.7552666", "authors": "Runpeng Dai ほか", "venue": "SSRN", "date": "2026-10-02", "why": "既存のオフポリシー評価が置く平均場の仮定を緩め、置換不変性に基づく推定量で時空間干渉を扱った。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は取得できず）", "preprint": true, "p1": "時空間的な干渉（ある場所の施策が近隣や後の時点に影響する）がある状況で、オフラインのデータから新しい方策の効果を評価するための、置換不変性に基づく推定量（PIE）を提案した（抄録）。", "p2": "既存のオフポリシー評価（OPE）は、干渉を扱うときに周囲の影響を平均で要約する平均場の構造を仮定するが、実際の複雑な干渉を捉えきれないことが多い（抄録）。", "p3": "平均場の仮定を、より一般的な置換不変性（近隣の並び順を入れ替えても影響が変わらない）の仮定に置き換え、平均場の関数をデータから適応的に学習できるようにした。この仮定を組み込んだニューラルネットの推定量を作り、理論的性質を調べた（抄録）。例：配車サービスで、ある地区の料金施策が隣の地区の需要にも影響する場合。", "p4": "数値実験で既存の基準手法と推定精度を比べた（抄録）。実装はPythonで公開されている。", "p5": "提案手法は既存の基準手法より有意に正確な推定を与えたと報告する（抄録）。具体的な数値は抄録にない。", "p6": "実データでの検証の有無と、置換不変性が成り立たない（隣の誰かが特別に重要な）場合の扱いは抄録からは分からない（解釈）。", "fun": "ある店で割引をすると、隣の店のお客も減ったり増えたりします。こうした「お互いに影響し合う」状況で、施策の本当の効果を過去のデータから測るのは難しい問題です。周りの影響を「誰が隣にいても同じ扱い」という緩い前提で学ばせることで、より柔軟に見積もれるようにした点が工夫です。", "unverified": "実験の設定と、精度の改善幅は本文を読めず未確認。"}}, {"id": "pn07", "rank": 7, "field": "教育", "headline": "学校内の監督でKhan Academyの学習効果が急増", "title": "How In-School Supervised Ed-Tech Support Produces Massive Learning Gains: A Khan Academy Field Experiment in India", "url": "https://econpapers.repec.org/RePEc:nbr:nberwo:34683", "authors": "Philip Oreopoulos ほか", "venue": "RePEc NEP", "date": "2026-01-26", "why": "インドの学校でのフィールド実験で、実装の仕組みを強めると学習アプリの利用と学習成果が大きく伸びることを示した。", "explain": {"basis": "抄録", "basis_note": "RePEc（NBERワーキングペーパー）の掲載ページの抄録を使用（本文は取得できず）", "preprint": true, "p1": "学習アプリが効かないのは技術や教材のせいではなく実装の仕組みの欠如だとし、学校に実装専任の担当者を置くとKhan Academyの利用が大幅に増え、数学の学力が大きく伸びることをインドのフィールド実験で示した（抄録）。", "p2": "コンピュータ支援学習（CAL）は大規模に展開すると効果が小さくなりがちで、その原因が技術そのものなのか、学校現場での導入の摩擦（接続、名簿、時間割、監督）なのかが分かっていなかった（抄録）。", "p3": "ウッタル・プラデーシュ州の公立の全寮制中学校83校すべてがKhan Academyを使える状態で、無作為に選んだ処置校に、接続の確保、生徒登録の簡素化、週ごとの練習時間の確保、授業内利用の監督、教員との内容調整、進捗の監視だけを担う現地の担当者を置いた（抄録）。", "p4": "プラットフォームの週あたり利用時間と、31週間後の数学の学力（標準偏差単位）を主な結果とし、学力水準や問題の難易度別の効果も調べた（抄録）。", "p5": "利用時間は週7.2分から47.4分に増え、数学の学力は31週間でほぼ0.5標準偏差上がった。効果は学力水準と問題の難易度にわたって幅広く見られた（抄録）。", "p6": "担当者の配置という人的資源の費用と、規模を広げたときの持続性は抄録の範囲では評価されていない（解釈）。全寮制の公立学校という特定の環境での結果である（抄録）。", "fun": "同じ無料の学習アプリがあっても、使われなければ意味がありません。ネット接続を整え、時間割に練習時間を確保し、見守る人を1人置くだけで、利用が6倍以上になり、成績も大きく伸びました。「良い道具」より「使える仕組み」が決め手だ、という教訓が面白い点です。", "unverified": "担当者1人あたりの費用と、費用対効果の評価は本文を読めず未確認。"}}, {"id": "pn08", "rank": 8, "field": "経済学", "headline": "米中貿易戦争で第三国の韓国は中国からの輸入を減らした", "title": "U.S.-China Trade War and Spillover Effects to Bystander Countries", "url": "https://doi.org/10.2139/ssrn.7553078", "authors": "Yeonggyu Yun ほか", "venue": "SSRN", "date": "2026-10-02", "why": "迂回輸出ではなく供給網を通じた波及で、第三国の輸入が減る仕組みをモデルと実証で示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は取得できず）", "preprint": true, "p1": "2018〜19年の米中貿易戦争で、第三国の韓国は迂回輸入ではなく、むしろ中国からの輸入を減らしたことを示し、それを中国の生産の規模の経済で説明した（抄録）。", "p2": "第三国への波及の研究は、迂回や貿易の転換を強調してきたが、韓国のように中国と米国の両方と深く結びついた国では逆の動きが見られ、その説明がなかった（抄録）。", "p3": "中国・韓国・米国を結ぶ供給網の簡単な理論モデルを作った。中国の生産に規模に関する収穫逓増があると、米国への販売減が生産規模を縮め、中国の限界費用を上げ、韓国企業が払う価格を上げる。迂回の費用に応じて産業ごとの効果が異なることもモデル化した（抄録）。", "p4": "韓国の取引単位の税関データで、米国の対中関税の変化と韓国の中国からの輸入数量・価格の関係を推定し、産業の規模の経済の程度と事前の対米輸出の程度で異質性を調べた（抄録）。", "p5": "米国の対中関税が10ポイント上がると、韓国の中国からの輸入数量は約24%減り、輸入価格は約2.5%上がった。減少は収穫逓増の産業に集中した。一方、事前の対米輸出の多い産業では、中国からの輸入と米国への輸出がともに増え、韓国経由の迂回と整合した（抄録）。", "p6": "規模の経済の測り方と、他の同時期のショック（韓中関係など）との分離は本文で確かめる必要がある（解釈）。", "fun": "アメリカと中国のけんかの「とばっちり」を受けた韓国では、中国からの輸入が増えるどころか減りました。アメリカに売れなくなった中国工場の生産量が減り、1個あたりのコストが上がって値上がりしたからです。大量に作るほど安くなる仕組みが逆回転した、という説明が鮮やかです。", "unverified": "推定の標準誤差と、規模の経済の指標の定義は本文を読めず未確認。"}}, {"id": "pn09", "rank": 9, "field": "環境・気候政策", "headline": "化石燃料依存のロシアで気候政策への態度を調査実験", "title": "Attitudes towards Climate Policies in a Fossil-Fuel-Dependent Economy: Survey Experiment in Russia", "url": "https://doi.org/10.2139/ssrn.7556885", "authors": "Gerhard Toews ほか", "venue": "SSRN", "date": "2026-10-03", "why": "国際比較可能な調査実験をロシアに適用し、物理の説明動画と政策の伝え方が態度に与える効果の違いを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は取得できず）", "preprint": true, "p1": "化石燃料に依存するロシアで、国際比較できる調査実験により気候政策への態度を測り、物理の説明動画と政策の説明では効果が逆向きになることを示した（抄録）。", "p2": "気候政策への態度の国際的な調査実験はあるが、化石燃料に経済を依存する国で、しかも政府の公式文書（気候ドクトリン）がどう受け止められるかは調べられていなかった（抄録）。", "p3": "Dechezleprêtreら（2025）の多国間の調査実験をロシアに合わせて改変し、国家の気候ドクトリンに言及する処置を加えた。物理に基づく動画、政策に基づく説明、政治当局の公式メッセージなどを無作為に提示した（抄録）。", "p4": "気候変動に関する信念と知識、個人の排出削減行動への意欲、気候変動が現実だという認識、気候変動と闘う意欲を結果とし、化石燃料の豊富な地域との違いも調べた（抄録）。", "p5": "ロシア人の気候に関する信念と知識はおおむね他国と似ていたが、化石燃料の豊富な地域では懐疑が強かった。物理の動画は事実の理解を高めたが、政策の説明は個人の排出削減の意欲を下げ、費用が意識される経路と整合した。当局の公式メッセージは気候変動が現実かの見方は変えなかったが、闘う意欲は高めた（抄録）。", "p6": "回答者数と標本の代表性、効果の大きさは抄録にない（解釈）。政治的に敏感な質問への回答の偏りの可能性も本文で確かめる必要がある（解釈）。", "fun": "「温暖化の仕組み」を説明すると理解は深まるのに、「どんな政策をするか」を説明すると、かえって自分で何かする気が減ってしまう。費用が頭に浮かぶからだと考えられます。伝え方ひとつで人の気持ちが逆に動く、というのは、どんな広報にも通じる教訓です。", "unverified": "回答者数、処置効果の大きさは本文を読めず未確認。"}}, {"id": "pn10", "rank": 10, "field": "経営学", "headline": "ESGが注目される時期に企業は決算説明会で語り方を変える", "title": "When ESG Is Salient: Strategic ESG Communication in Earnings Conference Calls", "url": "https://doi.org/10.2139/ssrn.7551219", "authors": "Zhilu Lin ほか", "venue": "SSRN", "date": "2026-10-03", "why": "2010〜2024年の決算説明会の記録から、ESGの語りの量と論調が開示の誘因に応じて変わることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は取得できず）", "preprint": true, "p1": "米国企業の決算説明会で、ESGが投資家に注目される時期には、ESGへの言及が増えて論調も前向きになり、それが機関投資家の資金を呼び込む一方、実際の排出量との対応は弱まることを示した（抄録）。", "p2": "経営者の語り（ナラティブ開示）が投資家の関心の変化にどう反応し、その情報内容が状況によってどう変わるかは、十分に分かっていなかった（抄録）。", "p3": "2010〜2024年の米国の決算説明会の記録を使い、ESGの語りの量と論調の時系列を測った。2019〜2022年をESGが注目された時期とし、準備された発言部分を含むESGの語りと、資産運用会社による資金配分、同時期の炭素排出量との関係を分析した（抄録）。", "p4": "注目期と非注目期でのESGの言及頻度・論調、機関投資家の資金配分との関係、排出量との整合性を比べた（抄録）。", "p5": "ESGの議論は2019〜2022年に急増し、その後減った。注目期には言及が増えるだけでなく論調も前向きになり、特に準備された発言でのESGの語りが資産運用会社の資金を呼び込んだが、この関係は注目期以外では消えた。注目期には語りと同時期の排出量の関係は弱く、注目が下がると排出実績とよく整合した（抄録）。", "p6": "「注目期」の定義を期間で区切っており、その境界の選び方への感度は本文で確かめる必要がある（解釈）。語りが資金を呼ぶ関係の因果性も抄録の範囲では明らかでない。", "fun": "ESGが流行っているときほど、会社はESGを熱心に、しかも明るく語ります。でもそのときの話は、実際の二酸化炭素の排出とあまり関係がありませんでした。流行が去ると話と実態が一致し始める、という結果は、話の量と中身は別物だと教えてくれます。", "unverified": "資金配分への効果の大きさは本文を読めず未確認。"}}, {"id": "pn11", "rank": 11, "field": "機械学習", "headline": "小さなモデルの不正解の方が選好蒸留に効く", "title": "Smaller Models, Better Rejects: Preference Distillation Scaling", "url": "https://arxiv.org/abs/2609.38987", "authors": "Rui Cai ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-02", "why": "選好蒸留で、小さい固定モデルが作る悪い応答の方が安く、より強い学生モデルを育てることを示した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§1、§2、§4.1〜4.2、§5と図1〜2の説明）を読んだ。§3の理論と§4.3〜4.4、付録は要約のみ", "preprint": true, "p1": "選好蒸留で「不正解例（reject）」を学生モデル自身ではなく、より小さい凍結モデルに作らせると、推論計算を減らしながら7B〜72Bの学生をより強く育てられることを示した（抄録、§4.2）。", "p2": "選好蒸留では、教師の応答を正解、学生自身の応答を不正解としてDPOで学習するのが標準だった。自分の失敗が最も有益な負例であり、不正解例は学生以上の大きさのモデルが作るべきだという2つの前提は、学生が大きくなるほど生成費用を膨らませる（§1）。", "p3": "SODAの2段階パイプラインで、まず教師（GPT-4oなど）の応答で系列単位の知識蒸留（SeqKD）を行い、次に別のプロンプト集合でDPOを行う。各学生規模で、プロンプト・正解・初期化・最適化をすべてそろえ、不正解例の作り方だけを変えて比べた（§2、§4.1）。DPOを初期値の周りで線形化した特徴モデルから、有利な不正解例の分布を特徴づける有限時間の上界を導いた（§3）。", "p4": "コードはKoDCode（SeqKD 75,752問、DPO 24,248問、評価5,000問と外部4ベンチマーク）、数学はOpenR1-Math-220kの軌跡とMATH-500・AIME 2024/2025で、4回の生成の平均成功率（avg@4）を主な指標とした。不正解例はすべて単体テストか答え合わせで誤りと確認した（§4.1）。", "p5": "コードの全18通りの小さいモデルの構成が、2種類の自己生成をすべて上回った（図1）。例えばQwen2.5-3Bの不正解例は14B学生のavg@4を自己生成よりコードで3.1ポイント、数学で1.9ポイント高めた。生成計算量は自己生成の0.9〜50.1%だった（§4.2）。14B学生でLlama-1Bの不正解例の割合を0%から100%に増やすと、avg@4は59.73%から63.28%に上がった（図1右）。", "p6": "Qwen2.5の学生とコード・数学という検証可能な課題に限られ、理論は線形化した特徴モデルでの近似である（§3、§4.1）。解釈：自由記述のような正誤を検証しにくい課題で同じ傾向が出るかは未検証である。", "fun": "先生の模範解答と比べる「悪い例」は、生徒自身の答えが一番役に立つと思われていました。ところが、もっと小さくて未熟なモデルの間違いを見せた方が生徒はよく伸びたのです。自分とそっくりの惜しい間違いより、はっきり違う間違いの方が「何がダメか」を学びやすいのかもしれません。", "unverified": "§4.3〜4.4の介入実験（並べ替え・尤度による選択）の詳細な数値と、§3の上界の式は確認していない。"}}, {"id": "pn12", "rank": 12, "field": "因果推論", "headline": "森林重みと条件付き依存で時系列の因果方向を推定", "title": "Forward time-series causal inference based on forest weights and conditional dependence", "url": "https://doi.org/10.64898/2026.10.02.756132", "authors": "Shigeki Kishi", "venue": "bioRxiv", "date": "2026-10-03", "why": "収束交差写像の偽陽性の問題に対し、一般化ランダムフォレストを用いた前向きの因果発見法を提案した。", "explain": {"basis": "本文", "basis_note": "bioRxivのPDF本文（結果の全節と考察の限界の段落）を読んだ。方法の数式の節と図は読んでいない", "preprint": true, "p1": "非線形な力学系の時系列から因果の向きを見つける方法F-CODECを提案し、強い結合で起こる偽陽性を代理データの検定なしに抑えられることを示した（抄録、結果）。", "p2": "収束交差写像（CCM）などの従来の非パラメトリック法は、計算の重い代理データ検定を要するうえ、結合が強いと2つの系が一般化同期を起こして同じ多様体を共有し、因果がない逆方向にも「因果あり」と出てしまう（序論、結果）。", "p3": "条件付き依存係数（CODEC）を、一般化ランダムフォレストの重みで計算する。結果側の変数自身の遅れ座標（過去の値）で非パラメトリックに条件づけることで、共有された多様体の情報を打ち消し、それでもなお原因側の過去が予測に役立つかを測る。統計量Tnには解析的な閾値があり、生データから直接検定できる（抄録、考察）。", "p4": "一方向に結合したロジスティック写像（結合強度C = 0〜0.7）、ノイズ次元を加えた設定、3種の相互作用モチーフ（連鎖・共通原因）で、真陽性率と偽陽性率を従来法（素のCODEC、FORCC、CCM）と比べた。応用として、91年分のカナダオオヤマネコとカンジキウサギの毛皮記録と、ミツバチの巣のIoT計測（2026年5〜6月）を分析した（結果）。", "p5": "結合方向のTnはC = 0の0.004からC = 0.5の0.405へ単調に増え、逆方向は0.006以下だった（閾値0.060）。ノイズ次元5つを加えると素のCODECの検出率はC = 0.1で16%に落ちたが、F-CODECは100%を保ち偽陽性0%だった。CCMは逆方向の偽陽性がC = 0.7で90%に達した（図1〜2）。連鎖X→Y→ZではX→Zの見かけの因果を消した（図3）。オオヤマネコ→ウサギの2年遅れの因果（Tn = 0.106）を検出し、逆方向は検出されなかった（図4）。", "p6": "著者は、未観測の外部交絡がないという因果的十分性を仮定すること、等間隔に標本化された離散時系列を前提とすること、非常に高次元の系では計算上の工夫が要ることを限界に挙げる（考察）。ミツバチの事例は1つの巣の2か月の観察である（結果）。", "fun": "キツネとウサギのように、互いに影響し合いながら同じリズムで増減する生き物の記録から「どちらがどちらを動かしているか」を見分けるのは難しい問題です。リズムがそろうと、まるで両方が原因のように見えてしまうからです。相手の「自分自身の過去」で割り引いてから比べるという工夫で、捕食者が2年遅れで獲物を減らす関係を取り出した点が見事です。", "unverified": "方法の節の統計量の定義式と閾値の導出は読んでいない。"}}, {"id": "pn13", "rank": 13, "field": "経済学", "headline": "航空会社の合併の相乗効果は品質向上から生まれる", "title": "Quality-driven Synergies in Horizontal Mergers: A Study of the U.S. Airline Industry", "url": "https://doi.org/10.2139/ssrn.7546778", "authors": "Chuhan Guo", "venue": "SSRN", "date": "2026-10-02", "why": "製品位置の内生的な再選択を許す合併シミュレーションで、合併そのものでなく品質改善が相乗効果を生むことを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は取得できず）", "preprint": true, "p1": "水平合併の相乗効果は合併そのものからではなく、製品の品質と配置の内生的な見直しから生まれることを、ジェットブルーとスピリット航空の合併を例に構造推定とシミュレーションで示した（抄録）。", "p2": "合併の相乗効果は反競争的な効果を相殺しうるとされるが、それがどう生まれるかは、費用削減として外生的に仮定されることが多かった（抄録）。", "p3": "需要と費用の構造を推定し、合併後の市場均衡を、企業が製品の品質と配置を内生的に最適化できる形でシミュレーションした（抄録）。", "p4": "ジェットブルー・スピリット合併を事例に、相乗効果の源泉、大都市と他の市場、価格に敏感な消費者と鈍感な消費者の間での消費者余剰の分配を評価した（抄録）。", "p5": "合併だけでは相乗効果は生まれず、品質の高いサービスを大都市市場に再配置する品質改善から生まれた。大都市の消費者は価格に鈍感で品質を重視する。合併は大都市市場に利益をもたらし、他の市場には負の影響を与え、大都市内でも価格に敏感な消費者から鈍感な消費者へ余剰を移した（抄録）。", "p6": "実際にはこの合併は差し止められており、シミュレーションの仮想的な結果である点に注意が必要（背景：本件は2024年に裁判所が差し止めた。抄録には記載なし）。モデルの仮定への感度は本文で確かめる必要がある（解釈）。", "fun": "会社が合併すると「無駄が減って安くなる」とよく言われますが、この研究では、良いサービスを大都市に集中させることで初めて相乗効果が生まれました。その結果、得をするのは大都市の、値段をあまり気にしない客だけ。合併の「得」が誰に配られるかを見ることの大切さを示しています。", "unverified": "合併差し止めの経緯は解説者が補った背景で、論文内の扱いは未確認。厚生効果の数値は本文を読めず未確認。"}}, {"id": "pn14", "rank": 14, "field": "統計学", "headline": "漁業依存データの選好的サンプリングによる傾向の偏りを補正", "title": "Correcting trend bias from preferential sampling in fishery-dependent indices", "url": "https://doi.org/10.64898/2026.09.30.755768", "authors": "Eric Ward ほか", "venue": "bioRxiv", "date": "2026-10-02", "why": "漁獲努力の偏りの強さが時間とともに変わると資源量指数の傾向が歪むことを示し、その補正法を提案した。", "explain": {"basis": "本文", "basis_note": "bioRxivのPDF本文（結果、考察の限界の段落）と抄録を読んだ。方法の数式と補足表は読んでいない", "preprint": true, "p1": "漁業者が獲れそうな場所に集まる「選好的サンプリング」の強さが年ごとに変わると、漁業依存の資源量指数の傾向が歪み、通常の漁獲効率の推定では補正できないことを示し、密度と標本化過程の同時モデルが頑健な補正法になることをシミュレーションで示した（抄録、結果）。", "p2": "漁業データからの資源量指数は資源評価に使われるが、漁獲努力は無作為でなく、儲かる場所に集中する。この偏りの強さが一定なら指数の水準がずれるだけで漁獲効率に吸収されるが、時間とともに変わる場合の傾向の偏りは扱われてこなかった（抄録、結果）。", "p3": "米国西海岸の長期トロール調査に基づくアラスカキチジ（shortspine thornyhead）のシミュレーションで、(1) 密度と標本化の過程を同時に推定する時空間モデルと、(2) 漁業者の場所選択の離散選択モデルの2つの補正法を比べた。偏りを生む仕組みとして、努力が局所密度を追う場合と、漁獲を増やす未観測の空間的異常に反応する場合の2つを設定した（抄録）。", "p4": "推定した資源量の軌跡と真値のRMSEと対数線形の傾きで評価し、さらに補正した指数を実際の資源評価モデルに入れて、加入量や乱獲限界（OFL）の偏りを25回の反復で調べた（結果）。", "p5": "密度追従型では、補正なしの推定は傾きを平均9%過大にし、同時モデルは偏りの約75%（中程度）〜90%近く（強い場合）を取り除いたが、離散選択モデルはむしろ傾きを膨らませた。異常追従型では補正なしで30%過大となり、同時モデルは66%〜99%、離散選択モデルは75%と64%を除いた（結果）。補正なしの指数は資源評価で2034年のOFLの平均を1140から1160へと押し上げた（図5）。", "p6": "著者は、潜在的な駆動要因の空間パターンを時間的に一定としたこと、漁場の斑状性の空間スケールを固定したこと、群れを作る行動を仮定していないことを限界に挙げる（考察）。", "fun": "釣り人は魚がいそうな場所に集まるので、釣果の記録だけで魚の数の増減を判断すると、実際より多く見えることがあります。しかもその「集まりやすさ」が年によって変わると、増えたのか減ったのかの判断まで狂ってしまう。データの集め方そのものをモデルに入れて補正する、という発想は、偏ったアンケートの読み方にも通じます。", "unverified": "同時モデルと離散選択モデルの数式の詳細と、補足表S2・S3の全数値は確認していない。"}}, {"id": "pn15", "rank": 15, "field": "教育", "headline": "オンライン個別指導の学業と就職への効果（RCT）", "title": "Online Tutoring, School Performance, and School-to-Work Transitions: Evidence from a Randomized Controlled Trial", "url": "https://econpapers.repec.org/RePEc:bdp:dpaper:0084", "authors": "Silke Anger ほか", "venue": "RePEc NEP", "date": "2026-01-26", "why": "低学力の生徒へのオンライン個別指導の効果を、学校成績と学校から仕事への移行まで無作為化比較試験で追った。", "explain": {"basis": "抄録", "basis_note": "候補はNBERワーキングペーパー。抄録はOpenAlexの題名検索で見つかったEuropean Economic Review掲載版のものを使用（本文は取得できず）", "preprint": false, "p1": "ドイツの中等学校の低学力の生徒839人を対象とした無作為化比較試験で、オンライン個別指導が数学の成績だけでなく、学校から職業訓練への移行も改善することを示した（抄録）。", "p2": "低学力の生徒への個別指導が成績を上げることは知られていたが、中長期の労働市場の結果への影響はあまり分かっていなかった（抄録）。", "p3": "低学力の中等学校の生徒839人を、オンライン個別指導プログラムに無作為に割り当てた。割り当てに基づく効果（ITT）を推定し、事前に他の個別指導を受けていなかった生徒と、学術系でない進路の生徒で異質性を調べた（抄録）。", "p4": "開始6か月後の数学の成績（標準偏差単位）と、18か月後の職業訓練への参加を結果とした（抄録）。", "p5": "数学の成績へのITT効果は0.06標準偏差で有意でなかった。ただし事前に個別指導を受けていなかった生徒では0.14標準偏差の有意な改善があった。学術系でない進路の生徒では、18か月後の職業訓練への参加が5ポイント高く、事前に個別指導のなかった生徒では12ポイント高かった（抄録）。", "p6": "全体のITT効果は有意でなく、効果は下位集団で見られたため、事前に計画された分析かどうかは本文で確かめる必要がある（解釈）。", "fun": "勉強の手助けは、テストの点を上げるだけでなく、その先の進路にまで影響します。成績の伸びは小さくても、職業訓練に進む生徒が増えた、という結果は、教育の効果を「点数」だけで測ると見落とすものがあることを示しています。", "unverified": "下位集団分析が事前登録されていたかは本文を読めず未確認。"}}, {"id": "pn16", "rank": 16, "field": "組織行動・心理的安全性", "headline": "カリスマの逆説：権力を控えるほど影響力が増す", "title": "The charisma paradox: How leader self-restraint can increase influence by limiting the use of power", "url": "https://doi.org/10.2139/ssrn.7557179", "authors": "Niranjan Narasimhan ほか", "venue": "SSRN", "date": "2026-10-03", "why": "ガンジーの事例と先行研究から、リーダーの自制が影響力を高める4つの仕組みを理論化した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "カリスマ的リーダーは権力の使い方を自ら制限することで、かえって影響力を強められるという「カリスマの逆説」を理論化した（抄録）。", "p3": "ガンジーのリーダーシップの歴史的分析と既存のリーダーシップ研究をもとにした理論的論考である（抄録）。", "p5": "自制は動機を信じやすくし、権力を予測可能にし、代償を払うことで価値を見えるようにし、影響力を委ねても安全にする、という4つの仕組みを示した。管理者向けに「道徳的制約テスト」を提案した（抄録）。", "fun": "「強い力を持つ人ほど、使わずにいると信頼される」という逆説が面白い点です。何でもできる人が自分に歯止めをかけて見せると、周りは安心してその人に任せられる、という人間関係の仕組みを、歴史上の人物から読み解いています。", "unverified": "実証データによる検証はなく、主張の一般性は未確認。"}}, {"id": "pn17", "rank": 17, "field": "組織行動・心理的安全性", "headline": "経営チームの評価は何を測っているのか", "title": "Billions of Data Points. Evidence of What?&nbsp;Rethinking What Leadership Team Assessments Really Measure", "url": "https://doi.org/10.2139/ssrn.7553559", "authors": "Jerome Jeanclos", "venue": "SSRN", "date": "2026-10-03", "why": "大量の評価データが何の証拠になっているのかを問い直し、経営チーム評価の測定の前提を検討した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "経営チームの評価手法が、見かけ上は比べられる集団スコアを出しても、実際には異なる種類の証拠に基づいていることを論じた（抄録）。", "p3": "チームを直接評定させる方法、個人の性格・行動プロファイルの集約、多様な情報源の三角測量、明示的な変換規則で集団の性質を構成する方法を比べる理論的検討である（抄録）。", "p5": "主観的な知覚はデータであり、集約は雑音を減らし比較を可能にするが、集約や規模そのものは元の信号の認識論的な性格を変えない、と主張する（抄録）。", "fun": "何十億件のデータを集めても、元が「みんなの感想」なら、それはやはり感想の集まりです。量が多いと客観的に見えてしまう錯覚に対して、そもそも何を測っているのかを問い直す視点は、アンケートを使うあらゆる研究に通じます。", "unverified": "実証的な比較分析はなく未確認。"}}, {"id": "pn18", "rank": 18, "field": "組織行動・心理的安全性", "headline": "山火事をDEIのせいにする言説とジェンダー化された非難", "title": "’DEI Means people DIE’: Gendered Blame and Backlash in the California Wildfires", "url": "https://doi.org/10.2139/ssrn.7557271", "authors": "Vineeta Dwivedi", "venue": "SSRN", "date": "2026-10-03", "why": "2025年のロサンゼルス山火事でDEIを非難した言説を分析し、反発の構造を明らかにした。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "2025年のロサンゼルス山火事で、DEI政策と市初の女性消防局長が非難された言説がどう作られ広まったかを分析した（抄録）。", "p3": "van Dijkの社会認知モデルとフェミニスト批判的談話分析、交差性の視点で、米国の報道と確認済みのSNS投稿30件のコーパ
