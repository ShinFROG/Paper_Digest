<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-11-13", "intro": "プレプリントの新着804件（一覧の候補263件）、学術誌の新着（上位10%誌1,176件・うち一覧の候補302件、その他の学術誌の候補299件・うち一覧の候補151件）、重要論文の候補153件（プレプリント101件・学術誌52件）、新着オープンデータ79件とe-Statの更新1件から選びました。プレプリント・関連48報、プレプリント・注目37報、論文誌・関連50報、論文誌・注目36報、オープンデータ28件です（プレプリント・注目は、今日の候補にarXivの分野別カテゴリからの新着とNBERの新着がなく、統計学は少数、因果推論・組織行動とおすすめ分野には基準を満たす候補がなかったため絞りました。論文誌・注目は、主要誌の新着が22件と少なく、統計学と因果推論の候補がなかったため、上位10%誌の新着で補ったうえで基準を満たすものに絞りました。プレプリント・関連とオープンデータも、審査のない置き場の文書が多く、内容で絞りました。e-Statの更新は定例の月次更新のみのため選んでいません）。上位10%誌の一覧の更新はHTTP 404で取得できず、9月27日に作った一覧を使いました。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "安い縮約モデルでのベイズ更新のずれをKLで保証", "title": "A Multi-Fidelity Digital Twin for Flexible Maglev Guideways with a Kullback-Leibler Consistency Guarantee for Online Bayesian Model Updating", "url": "https://doi.org/10.2139/ssrn.7683418", "authors": "Rabia AlAllawi", "venue": "SSRN", "date": "2026-11-12", "apa": "AlAllawi, R. (2026). A Multi-Fidelity Digital Twin for Flexible Maglev Guideways with a Kullback-Leibler Consistency Guarantee for Online Bayesian Model Updating. https://doi.org/10.2139/ssrn.7683418", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "磁気浮上（マグレブ）の柔軟なガイドウェイのデジタルツインで、計算の軽い粗いモデルを使ってパラメータをベイズ更新しても、高精度モデルで更新した結果からどれだけ離れうるかを、数式で上から保証できるようにした（抄録）。未査読のプレプリント。", "p2": "温度や摩耗で変わる物理パラメータ（とくに曲げ剛性EI）を、車上のギャップ計測から実時間で推定し直す必要がある。高精度モデルは正確だがオンラインには遅く、軽い縮約モデルは速いが、その事後分布が正しいものと食い違うおそれがあった（抄録）。", "p3": "同じガイドウェイの物理を共有する3段階のモデル（全モードの参照、誤差が保証されたスペクトル作用素、実時間の粗いモデル）を作る。粗いモデルと参照モデルの事後分布のKLダイバージェンスが、モデル間の食い違いδの2乗と有効フィッシャー情報量の積の半分以下に抑えられることを証明した（抄録）。背景：KLダイバージェンスは二つの確率分布の離れ具合を測る量。", "p4": "剛性の値4通り、観測数3通り、粗いモデルの忠実度3通りを組み合わせた36の推定シナリオで、上界が成り立つかを確かめ、標本数とともに大きくなる素朴な一次の上界と比べた（抄録）。", "p5": "上界は36のうち35で成り立ち、1つでわずかに超えた。素朴な上界は標本数が増えると際限なく大きくなり、3分の1の場合で破綻した。提案の上界はデータが増えても発散せず頭打ちになる（抄録）。", "p6": "モデル間の食い違いδの保証は別の論文（姉妹編）に依存する。実測データでの検証の有無、雑音や未知の外乱の扱い、1件の超過の原因は抄録に記載がない。著者の述べる限界は本文を読めておらず未確認。", "fun": "走っている乗り物の計測から、線路にあたる桁の硬さを推定し続けたい。精密な計算は正確だが間に合わず、簡単な計算は速いが答えがずれるかもしれない。この研究は「簡単な計算で出した答えは、精密な計算の答えからこれ以上は離れない」という上限を証明した。面白いのは、データが増えるほどずれの見積もりが際限なく広がるという素朴な上限が使いものにならず、新しい上限は頭打ちになると示した点である。", "unverified": "SSRNの本文を取得できず、証明の仮定、3段階のモデルの詳細、シナリオの数値設定、姉妹編の内容は未確認。実測データによる検証の有無も未確認。"}}, {"id": "pr02", "rank": 2, "headline": "監査ツールは対象リスク別に検証しないと頼れない", "title": "From Model Performance to Audit Evidence: An Experimental Study of Purpose-Specific Validity in Algorithmic Audit Procedures", "url": "https://doi.org/10.5281/zenodo.24155697", "authors": "Prokofieva, Maria", "venue": "Zenodo", "date": "2026-11-12", "apa": "Prokofieva, M. (2026). From Model Performance to Audit Evidence: An Experimental Study of Purpose-Specific Validity in Algorithmic Audit Procedures (Version 1). Zenodo. https://doi.org/10.5281/ZENODO.24155697", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Zenodoに登録されたPDFの本文のうち、要旨、枠組み（§3.1）、研究設計（§5.1〜5.5）、結果の冒頭と仮説との対照（§6.1、§6.5）、限界（§8）を読んだ。研究2・3の詳細な結果と付録は未読", "preprint": true, "p1": "監査で使う検出ツール（仕訳の異常検知など）について、事務所での一般的な検証に合格していても、特定のリスクに対してそのツールの出力に頼ってよいとは限らないことを実験で示し、リスク別の検証と「既知解テスト」で確かめる手順を提案した（要旨、§3.1）。未査読の作業論文。", "p2": "国際監査基準の改訂案（ISA 500改訂案）は、ツールが意図した目的を達成するかの判断を主に事務所の品質管理に委ねている。入力情報の信頼性と計算の正しさを確かめても、出力が評価したリスクを含んでいるか（目的別の妥当性）は別の条件だが、その証拠をどう得るかが定まっていなかった（要旨、§3.1）。", "p3": "合成の総勘定元帳（2会計年度、102,429仕訳・256,232明細、8種類の条件を付した850仕訳）で、各ツールの真の検出率が分かる状況を作る。依拠が正当かは、予算内の再現率がτ＝0.8以上かで判定する（§5.2、§5.4）。既知解テストとは、答えの分かった事例を母集団の写しに混ぜてツールが拾えるかを見る方法で、ツールの中身を見なくてよい（§3.1）。", "p4": "研究1は依拠の前に得られる検証の証拠、研究2は期間の間のデータ生成過程の変化、研究3は検証の手続きを変え、正当でない依拠の割合などを比べた。計画は事前に版管理された設計書に記した（§5.1）。", "p5": "事務所の検証が対象にしたリスクでは、集計した検証のもとで依拠の84%が正当でなく、リスク別に整理した検証では2%だった。検証が対象にしなかったリスクでは、業務ごとの既知解テストが正当でない依拠を67%から3%に減らした（要旨、表12）。既知解テストは検出率を平均0.05以内で推定した（要旨）。", "p6": "著者は、合成データの生成器が1つで、結果は実務での発生率ではなく仕組みを示すものだと述べる。汎用の検出器だけを使い、依拠の基準は単純化してあり、既知解テストは種に似ていない変種には楽観的になりうる。事後に加えた分析も一部ある（§8）。", "fun": "会社の帳簿から怪しい取引を探すAIが、テストで高得点を取っていたとする。それなら安心して任せられるだろうか。この研究の答えは「何を探すかによる」である。全体の成績が良くても、ある種類の異常はほとんど見つけられないことがある。そこで、わざと答えの分かった取引を帳簿の写しに混ぜ、AIが拾えるかを確かめる。抜き打ちの小テストで、その仕事に使えるかを直接試す発想である。", "unverified": "研究2・研究3の詳細な結果と付録は読んでいない。結果は1つの合成元帳の生成器と汎用の検出器にもとづくもので、実際の監査業務での割合は不明。"}}, {"id": "pr03", "rank": 3, "headline": "ビッグファイブでAIエージェントに性格を与え検証", "title": "Designing AI-Agents with Personalities: A Psychometric Approach", "url": "https://doi.org/10.31234/osf.io/2kfw3_v3", "authors": "Muhua Huang ほか", "venue": "PsyArXiv", "date": "2026-11-12", "apa": "Huang, M., Zhang, X., Soto, C. J., & Evans, J. (2026). Designing AI-Agents with Personalities: A Psychometric Approach. https://doi.org/10.31234/osf.io/2kfw3_v3", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "OSF（PsyArXiv）のPDFの本文のうち、要旨、研究2aの方法、研究3の方法の冒頭、総合考察の冒頭、限界と結論を読んだ。各研究の結果の表は一部のみ確認", "preprint": true, "p1": "ビッグファイブの性格検査の回答をそのままプロンプトにしてLLMエージェントに性格を割り当て、できたエージェントが人と同じように答えるかを心理測定の手順で確かめる方法を示した（要旨、総合考察）。未査読のプレプリント。", "p2": "これまでのペルソナづくりは、単純な形容で性格を指定することが多かった。割り当てた性格が量として制御でき、心理測定の基準で妥当かは十分に確かめられていなかった（研究2aの方法）。", "p3": "人の参加者438人のBFI-2（60項目）の回答を入力とし、同意の度合いを数字で示す形式（Likert）と、選択肢を完全な文にした形式（Expanded）の2種類のプロンプトでエージェントを作る。比較のため、各特性の高低だけを示す基準のプロンプトも用意した。別の検査Mini-Markers（40項目）への回答を出力とし、人の回答と比べる（研究2aの方法、表1）。", "p4": "研究1はLLMの埋め込み空間での検査間の意味的な近さ、研究2は人の回答との一致と因子構造、研究3はリスク選好と道徳的ジレンマの場面10個での性格と判断の関連の再現を、人のデータを基準に評価した（研究1、研究3の方法）。", "p5": "検査間の類似度は多くの組で中〜高（コサイン類似度0.51超）だった（図1）。新しいモデルのエージェントほど人のMini-Markersの回答に近かったが、因子負荷のような細かい型は食い違うことがあった。Expanded形式が人の性格と判断の関連を最もよく再現し、安全性の調整を受けたモデルは「道徳的」な評定を高めに出した（要旨、表11）。", "p6": "著者は、特性だけでは価値観・目標・役割・社会的アイデンティティを表せないこと、エージェントは役割を演じているにすぎず与えた場面の外へ一般化できない可能性、温度などの生成パラメータを既定値のままにしたことを限界に挙げる。精度の要る研究で人の参加者の代わりにはまだならない（限界、結論）。", "fun": "AIに「あなたは外向的な人です」と一言で伝える代わりに、実在の人が性格検査の60問にどう答えたかをそのまま渡して、その人になりきらせる。すると別の性格検査でも人に近い答えを返した。さらに、冒険するか安全を取るかといった場面の判断でも、性格との結びつき方が人に似ていた。ただし細かい答え方の型までは一致せず、安全に調整されたAIは道徳的な答えに寄る癖があった。", "unverified": "研究1〜3の結果の節の大部分は読んでおらず、モデル別の一致度の数値、因子分析の詳細は未確認。"}}, {"id": "pr04", "rank": 4, "headline": "LLMの模擬読者は人の意見の割れを再現しない", "title": "Generated Texts and Simulated LLM Readers Do Not Replace Human Disagreement in Emotion Recognition", "url": "https://doi.org/10.2139/ssrn.7686105", "authors": "Keito Inoshita", "venue": "SSRN", "date": "2026-11-12", "apa": "Inoshita, K. (2026). Generated Texts and Simulated LLM Readers Do Not Replace Human Disagreement in Emotion Recognition. https://doi.org/10.2139/ssrn.7686105", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "LLMが書いた学習用テキストや、ペルソナを与えたLLMの「模擬読者」は、感情認識で人の読み手の意見の割れ（ラベルのばらつき）が持つ情報を代わりに供給できないことを示した（抄録）。未査読のプレプリント。", "p2": "投稿から読み手が感じ取る感情のような主観的な判断では、人はしばしば意見が割れ、その割れ方自体がテキストの読まれ方についての情報になる。LLMを人の代わりに使う場面が増えているが、生成テキストや模擬の注釈者がこの情報を供給できるかは確かめられていなかった（抄録）。", "p3": "日本語と英語の感情コーパスの評価用テキストを、注釈者の不一致の度合いで3水準に分ける。学習条件ごとに、人のラベル分布に対する温度調整つきの交差エントロピーを水準別に測る。実テキストだけで学習した教師モデルを使い、実データの分布による教師、生成テキスト、蒸留の寄与を分けた（抄録）。背景：交差エントロピーは予測した分布と目標の分布のずれを測る量。", "p4": "加えて、2つの感情の境界に生成したテキストと、ペルソナを与えた10体のLLM読者のラベルを、エントロピーをそろえた対照つきで試した。良さの基準は、人のラベル分布にどれだけ近づくか、とくに人の意見が割れるテキストで改善するかである（抄録）。", "p5": "実テキストを人のラベル分布で学習させると改善が最も大きく、意見の割れるテキストで最も効いた。生成テキストの上乗せはその約8分の1で、割れるテキストに集中しなかった。模擬読者は評価用テキストの41.5%で全員一致し（人は21.6%）、その不一致は人の不一致と弱くしか相関せず、エントロピーをそろえてもラベルは学習を悪化させた（抄録）。", "p6": "著者は、人の不一致はテキストと人の読み手の関係の中にあると解釈し、模擬の注釈者はテキストごとに検証してから使うべきだと述べる。使ったLLMとコーパスの規模、他の課題への一般化は抄録に記載がなく、本文を読めていないため未確認。", "fun": "同じ文章を読んでも、感じ取る感情が人によって違うことがある。この割れ方は雑音ではなく、その文章がどう読まれるかについての情報である。では、性格の違う10人分の役をAIに演じさせれば、人と同じように意見が割れるだろうか。実験では、AIの読者は人の2倍近い割合で全員一致してしまい、割れ方も人とあまり対応しなかった。役を変えても、人の読み手の多様さは再現できなかった。", "unverified": "SSRNの本文を取得できず、コーパスの名称と規模、使用したLLM、改善の具体的な数値、ペルソナの設計は未確認。"}}, {"id": "pr05", "rank": 5, "headline": "金融の合成表データを有用性と秘匿性で同時に比較", "title": "Privacy, Utility and Robustness of Synthetic Tabular Data for Financial Machine Learning: A Multi-Seed Benchmark with Formal Privacy Analysis", "url": "https://doi.org/10.20944/preprints202611.1174.v1", "authors": "Sakthi Sankara Balaji Sathyamurthy", "venue": "Preprints.org", "date": "2026-11-12", "apa": "Sathyamurthy, S. S. B. (2026). Privacy, Utility and Robustness of Synthetic Tabular Data for Financial Machine Learning: A Multi-Seed Benchmark with Formal Privacy Analysis. https://doi.org/10.20944/preprints202611.1174.v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "金融の表形式データについて、合成データの生成器6種類を、有用性・忠実度・秘匿性・頑健性・公平性の観点から、複数の乱数種と実データで同時に比べたベンチマークを示した（抄録）。未査読のプレプリント。", "p2": "金融機関は合成の表データでモデルを共有・開発したいが、公表されている比較は、これらの観点を一緒に、反復実行つきで、実データで試すことがまれだった。有用性の高い生成器が秘匿性でも安全かは、同時に測らないと分からない（抄録）。", "p3": "クラス条件つきガウスコピュラ、k近傍の内挿、差分プライバシーつきのナイーブベイズ合成器（2つの予算）、CTGAN、TVAEを比べる。合成データで学習して実データで評価する有用性、忠実度、2種類の会員推定攻撃、データ拡張、摂動への頑健性、部分集団の誤差の差を測る（抄録）。背景：会員推定攻撃は、ある記録が学習データに含まれていたかを当てる攻撃。", "p4": "公開データ2つ（クレジットカードの債務不履行24,000件、カード不正284,807件。後者は時間順に分割）で、各構成を5つの乱数種で実行し、Holm補正つきの対応のある検定と同等性検定で比べた（抄録）。", "p5": "合成データで学習したモデルは、実データのモデルよりAUCが0.005〜0.069低かった。k近傍の内挿は有用性が実データに最も近いが、唯一会員情報を漏らした（攻撃のAUC 0.70と0.76）。CTGANはコピュラより悪く（AUCで0.049と0.017低い）、合成データによる拡張は平均適合率を一度も改善しなかった。差分プライバシーの合成器は予算が1を下回ると急に劣化した（抄録）。", "p6": "2つの公開データでの結果であり、他の種類の金融データへの一般化は示されていない。公平性と頑健性の結果の数値は抄録に記載がない。著者の述べる限界は本文を読めておらず未確認。", "fun": "本物の顧客データは外に出しにくいので、特徴だけ似せた「作り物のデータ」を使いたい。ここに落とし穴がある。本物に最も近い成績を出したのは、本物の点と点の間を埋めるやり方だったが、それだけが「ある記録が元データに入っていたか」を見破られてしまった。役に立つことと、秘密を守ることは引き換えになりうる。両方を同時に測って初めて分かる結果である。", "unverified": "Preprints.orgの本文を取得できず、忠実度・頑健性・公平性の数値、TVAEの個別の結果、証明の内容は未確認。"}}, {"id": "pr06", "rank": 6, "headline": "誘導波の縮約モデルをエネルギー保存のまま低ランク化", "title": "Structure-preserving dynamical low-rank approximation for parametric elastic guided waves", "url": "https://hal.science/hal-05858538v1", "authors": "Dimitri Goutaudier", "venue": "HAL", "date": "2026-11-10", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXivのPDFの本文のうち、要旨、図表の説明、計算時間の比較の節、結論（§9）を読んだ。定式化の節は未読", "preprint": true, "p1": "構造ヘルスモニタリング（SHM）で使う弾性誘導波の数値シミュレーションを、エネルギー保存の構造を保ったまま低ランクに圧縮し、パラメータを変えた多数回の計算を2〜3桁速くする縮約モデルを作った（要旨、§9）。未査読のプレプリント。", "p2": "誘導波は輸送が支配的で分散性があるため、固定した線形部分空間に射影する通常の縮約モデルでは扱いにくい。また、エネルギーを保存するにはハミルトン構造を保つ専用の射影が要る。動的低ランク近似（DLRA）は他の波動方程式で有効だったが、SHMの弾性誘導波への適用は未開拓だった（要旨）。", "p3": "DLRAは、解の行列をランクrの行列で近似し、その基底を時間とともに動かす方法である（図1）。荷重をかける区間はシンプレクティックなガラーキン射影（固定基底）、波が伝わる区間は動的な基底を使い、境界で接続する（図2）。パラメータが荷重だけに効く場合には基底の発展方程式の閉じた解が得られ、荷重の後は時間積分が不要になる（要旨、§9）。", "p4": "損傷（孔）と相互作用する分散性の誘導波を含む2次元の弾性問題で、フルモデルとモード基底の縮約モデルを比較対象に、圧縮率、変位場の再構成誤差、エネルギー保存、計算の高速化を評価した（図3、§9）。", "p5": "ランクは10〜30程度で済み、変位場の誤差はパラメータ空間で最大7.49%、最小0.845%だった（図6の説明）。センサ時刻歴の再構成では全体で約820倍、変位場の再構成では1000倍近い高速化で、モード基底の縮約モデル（約280倍）を上回った（計算時間の比較の節）。", "p6": "著者は、パラメータが荷重にしか影響しないという単純化が主な限界だと述べ、材料特性や損傷の形状が変わる一般の場合への拡張を今後の課題とする（§9）。3次元や実測データでの検証は、読んだ範囲に見当たらず未確認。", "fun": "板に波を送って、返ってくる波の乱れから傷を探す検査がある。波の伝わり方を計算で何通りも試したいが、まともに解くと時間がかかりすぎる。この研究は、波の形を「少数の基本パターンの重ね合わせ」で表し、しかもそのパターン自体を波と一緒に動かす。固定したパターンで追いかけるより、ずっと少ない数で済む。エネルギーが保たれるという物理の決まりを、圧縮したあとも守らせた点が要である。", "unverified": "定式化の節（基底の発展方程式の導出）と誤差評価の細部は読んでおらず、式の詳細は未確認。検証は2次元の数値例のみ。"}}, {"id": "pr07", "rank": 7, "headline": "車体の加速度計1個でダンパの劣化を指数化", "title": "A Baseline-Normalized Suspension Degradation Index for Shock Absorber Health Monitoring", "url": "https://doi.org/10.21203/rs.3.rs-11482941/v1", "authors": "Geetha Mani", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Mani, G. (2026). A Baseline-Normalized Suspension Degradation Index for Shock Absorber Health Monitoring. https://doi.org/10.21203/rs.3.rs-11482941/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "Research SquareのPDFの本文のうち、抄録、劣化指数の定義（§3.4）、モンテカルロ検証（§4.5）、比較の設定（§4.9）、限界と結論（§5.5、§6）を読んだ。その他の結果の節は未読", "preprint": true, "p1": "車体に付けた加速度計1個の信号から、ダンパ（ショックアブソーバ）の劣化を健全時を基準にした指数で表し、路面の突発的な乱れを誤検知せずに捉える監視の枠組みを提案した（抄録、§3.4）。未査読で、検証は数値シミュレーションのみ。", "p2": "ダンパの劣化はゆっくり進み、減衰が大きく失われるまで気づきにくい。既存の診断法の多くは、複数のセンサ、正確なシステムモデル、故障ラベルつきデータでの教師あり学習のいずれかに頼っていた（抄録）。", "p3": "車体の加速度を0.5〜2.5 Hzの帯域通過フィルタに通して車体の共振（1.262 Hz）付近を取り出し、移動RMS、中央値フィルタ、移動平均で包絡を作る。健全な期間の中央値で割った値を劣化指数SDIとし、健全時はほぼ1で、劣化が進むと大きくなる。閾値は中央絶対偏差から決め、15秒続いたときだけ故障と確定する。摩耗に応じた熱モデルの指標と統合する（§3.4、§6）。", "p4": "ISO 8608のC級の路面（途中にポットホールを含む）を走る四分の一車両モデルで、減衰係数を1500から450 N·s/mへ徐々に下げ、路面の乱数だけを変えた25回のモンテカルロ試行で検出率と検出時刻を評価した。固定のRMS閾値とウェーブレット帯域エネルギーを比較対象にした（抄録、§4.5、§4.9）。", "p5": "統合した枠組みは25回すべてで劣化を検出した。SDIと持続性の判定だけでは25回中19回（76%）の検出で、平均の検出時刻は425秒だった。残りは熱の指標が補った。持続性の判定はポットホールの応答を誤警報なしに退けた（§4.5、抄録）。", "p6": "著者は、検証が四分の一車両モデルと合成の路面、線形の劣化過程による数値シミュレーションに限られ、ピッチ・ロール・操舵・複数輪の相互作用を考えていないこと、熱モデルが単純な一次モデルであること、比較が決定論的な1回の計算に限られることを限界に挙げる。実車や試験装置での検証は今後の課題である（§5.5）。", "fun": "車のダンパは、少しずつへたっていくので気づきにくい。この研究は、車体の上下の揺れのうち、車体がゆっくり揺れる周期の成分だけを取り出し、元気なころの揺れの大きさと比べて何倍になったかを指数にした。道路の穴を踏んだときの一瞬の大揺れは、15秒続かないので故障とは数えない。センサ1個と簡単な統計だけで済ませた点が実用的だが、まだ計算機の中だけの検証である。", "unverified": "頑健性の解析、パラメータ感度、比較手法との数値の差は読んでおらず未確認。実測データでの検証は行われていない。"}}, {"id": "pr08", "rank": 8, "headline": "定型的で長いリスク開示も共通の経済的リスクを伝える", "title": "Are Lengthy and Boilerplate Disclosures Uninformative? Evidence From Across-Firm Risk Factor Disclosure Similarity", "url": "https://doi.org/10.2139/ssrn.7683299", "authors": "Yelin Hu ほか", "venue": "SSRN", "date": "2026-11-12", "apa": "Hu, Y., Campbell, J. L., Steele, L. B., & Fronk, K. (2026). Are Lengthy and Boilerplate Disclosures Uninformative? Evidence From Across-Firm Risk Factor Disclosure Similarity. https://doi.org/10.2139/ssrn.7683299", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "米国の年次報告書（10-K）の「リスク要因」の記述は、長く定型的で具体性に乏しいと批判されるが、企業間でどれだけ似ているかを測ると、企業どうしが共有する経済的なリスクへの露出についての情報を伝えていることを示した（抄録）。未査読のプレプリント。", "p2": "近年の研究は、リスク要因の開示が長すぎ、変化が小さく、標準化され、具体性を欠くために有用性が下がっていると主張し、米国証券取引委員会（SEC）も短い開示への支持を表明してきた。しかし、定型的に見える記述が本当に情報を持たないのかは確かめられていなかった（抄録）。", "p3": "企業間のリスク要因の記述の類似度を測り、それが企業どうしの共有する経済的な露出についてどれだけ情報を持つかを、10-Kの他の節と比べる。さらに、その情報量が時間とともに、また定型文とみなされる特徴（長さ、粘着性、標準化、低い具体性）によってどう変わるかを調べる（抄録）。", "p4": "比較対象は10-Kの他の個別の節で、良さの基準は、記述の類似度が共有された経済的な露出をどれだけ伝えるかである。横断面の分析で、長さ・標準化・具体性による違いを調べた。標本の期間と規模、露出の測り方は抄録に記載がない（抄録）。", "p5": "リスク要因の開示は、共有された経済的な露出について、10-Kの他のどの個別の節にも劣らない情報を伝えていた。この関連は主に、同業他社と共通して開示される項目（最も一般的だと批判される言葉）から生じ、長く、標準化され、具体性の低い開示ほど強かった。情報量は時間とともに増えていた（抄録）。", "p6": "著者は、この結果は定型文が有用だという意味ではなく、定型文を見分けるのに使われてきた文章上の目印が、共有された露出について情報の少ない開示を識別していないことを示すにとどまると述べる。企業固有のリスクの情報については抄録に記載がなく、本文を読めていないため未確認。", "fun": "会社の報告書にある「当社のリスク」の欄は、どの会社も似たような決まり文句ばかりで役に立たないと言われる。この研究は見方を変えた。似ているということは、同じ危険にさらされているということかもしれない。会社どうしの文章の似方を測ると、共通して抱える経済的なリスクについての情報が含まれていた。ありきたりに見える文にも、会社どうしのつながりという情報が埋まっている。", "unverified": "SSRNの本文を取得できず、類似度の計算方法、経済的な露出の指標、標本の期間と規模、効果の大きさは未確認。"}}, {"id": "pr09", "rank": 9, "headline": "10-Kの排出量開示は薄く、多くが過小に報告", "title": "Measuring Emissions Disclosure Quality: Evidence from Voluntary 10-K and Mandatory EPA Disclosures", "url": "https://doi.org/10.2139/ssrn.7683786", "authors": "Glenny L. Alawag", "venue": "SSRN", "date": "2026-11-12", "apa": "L. Alawag, G. (2026). Measuring Emissions Disclosure Quality: Evidence from Voluntary 10-K and Mandatory EPA Disclosures. https://doi.org/10.2139/ssrn.7683786", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "米国企業の年次報告書（10-K）での温室効果ガス排出量の開示の質を、網羅性・特定性・正確性の3つの次元で測る指標を作り、任意の開示が薄く、照合できる数値の多くが過小であることを示した（抄録）。未査読のプレプリント。", "p2": "排出量の任意開示について、どれだけ書かれ、どれだけ具体的で、どれだけ正しいかを一緒に測る指標が必要だった（解釈：抄録の目的の記述から）。米国には施設単位の排出量を当局に報告する義務的な制度があり、これを照合の基準にできる（抄録）。", "p3": "網羅性は報告書が排出量についてどれだけ述べるか、特定性は報告された量がスコープ1（自社の直接排出）に帰属されているか、正確性はスコープ1の数値が、米国環境保護庁（EPA）の温室効果ガス報告制度に施設単位で報告された排出量からどれだけ離れているかで測る（抄録）。", "p4": "2010〜2023年の米国企業588社・4,520企業年を対象に、3つの指標の分布と、企業の特性（規模、資本集約度、施設や事業区分への集中、施設の所有比率）との関連、開示の開始・中止・質的から量的への移行を調べた（抄録）。", "p5": "企業年の18.7%は排出量に何も触れず、65.7%は企業固有の数値なしに問題に言及するだけで、絶対量を報告したのは5.4%だった。照合できるスコープ1の数値の多くは基準を下回っていた。排出が少数の施設に集中する企業は開示が少なく、大きく資本集約的な企業は開示が多い（抄録）。", "p6": "著者は、特定性と正確性の標本が小さく一般化に限界があるが、それ自体が任意開示の少なさを反映していると述べる。過小な数値が報告範囲の違いによるのか意図によるのかの切り分けは、本文を読めておらず未確認。", "fun": "会社が自主的に報告した排出量の数字は、どこまで信用できるのだろうか。米国では、施設ごとの排出量を役所に報告する義務が別にある。この研究は、会社の報告書の数字と役所への報告を突き合わせた。すると、そもそも数字を書いている会社はわずかで、書いてあっても役所への報告より少ないことが多かった。答え合わせのできる別の記録を使った点が面白い。", "unverified": "SSRNの本文を取得できず、テキストからの指標の作り方、照合の手順、過小の程度の数値は未確認。"}}, {"id": "pr10", "rank": 10, "headline": "チャットボットのサービス回復で客が離れる仕組み", "title": "Exploring Customer Disengagement in Chatbot-Led Service Recovery: Customer Withdrawal and Sentiment Misalignment", "url": "https://doi.org/10.21203/rs.3.rs-11401350/v1", "authors": "Wilson Ozuem ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Ozuem, W., Ranfagni, S., & Willis, M. (2026). Exploring Customer Disengagement in Chatbot-Led Service Recovery: Customer Withdrawal and Sentiment Misalignment. https://doi.org/10.21203/rs.3.rs-11401350/v1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "本文", "basis_note": "Research SquareのPDFの本文のうち、抄録、方法（標本と面接）、管理者の類型の導出、理論的貢献、限界の節を読んだ。語りの引用の大部分と実務への含意は未読", "preprint": true, "p1": "チャットボットが担うサービス回復（失敗への対応）で顧客が離れていく仕組みを、管理者の考え方の型と顧客の感情のずれ（感情の不整合）から説明する枠組みを、面接調査から導いた（抄録、理論的貢献の節）。未査読のプレプリント。", "p2": "チャットボットによるサービス回復の研究は、技術の機能か顧客の感情のどちらかを別々に扱うことが多く、管理者の実務と顧客の感情がどう組み合わさって離脱を生むのかについての知見は限られていた（抄録、理論的貢献の節）。", "p3": "解釈的な質的研究。チャットボットによるサービスの失敗を直接経験した顧客と、導入や回復に責任を持つ管理者・現場担当者を、目的に合わせて選んだ（米国、英国、イタリア、中国）。半構造化面接は計55件で、1件40〜55分。主題分析のあと、管理者の心理的な志向を読み解く解釈の層を重ねた（方法の節、データ分析と結果の節）。", "p4": "統計的な検証ではなく、語りから構成概念と類型を帰納的に組み立てる研究である。良さの基準は、複数の業種と立場（管理者・現場・顧客）にまたがる語りに一貫した型が見いだせるかにある（方法の節）。", "p5": "意識的な二重の知覚、認知的な肩代わり、技術による社会的存在感の体現、感情の不整合という4つの構成概念が得られ、管理者は効率重視・リスク回避・相乗重視の3類型に分かれた（表4）。効率・統制・技術的能力を、共感・応答性・社会的存在感への顧客の期待より優先する回復の実務で、離脱が起きやすい。相乗重視の実務は技術の効率と関係面の必要を両立させる（抄録）。", "p6": "著者は、業種ごとの文脈（医療・金融・小売など）を区別していないこと、組織の規模やデジタルの成熟度の影響を調べていないこと、一時点の把握にとどまることを限界に挙げ、縦断研究を求めている（限界の節）。類型と離脱の関係は面接の解釈にもとづくもので、量的な検証はされていない。", "fun": "サービスの失敗について問い合わせたら、相手がチャットボットだった。問題が処理されても、気持ちが収まらないことがある。この研究によると、客が求めているのは処理だけでなく、共感や「人が応じてくれている」という感覚である。会社側が効率や管理を優先すると、そのずれが客を遠ざける。面白いのは、原因を機械の性能だけでなく、導入する管理者の考え方の型に求めた点である。", "unverified": "構成概念ごとの語りの引用、参加者の内訳（表2）、実務への含意の節は詳しく読んでおらず未確認。"}}, {"id": "pr11", "rank": 11, "headline": "偽レビューを消しても買い手の信頼は戻らない", "title": "After the Fakes Are Gone: Persistent Trust Erosion in Online Markets", "url": "https://doi.org/10.2139/ssrn.7682733", "authors": "Philippos Louis ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Louis, P., Voucharas, G., Xefteris, D., & Markopoulos, P. (2026). After the Fakes Are Gone: Persistent Trust Erosion in Online Markets. https://doi.org/10.2139/ssrn.7682733", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "偽のレビューが市場に残す傷は、偽レビューを取り除いたあとも長く消えないことを、管理された実験室実験と隠れマルコフモデルで示した（抄録）。未査読のプレプリント。", "p2": "偽の好意的レビューと偽の否定的レビューが、市場の取引の動きにどんな悪影響を与え、取り除けば元に戻るのかは明らかでなかった。買い手の認識がなぜ「粘着的」になるのかの仕組みも分かっていなかった（抄録）。", "p3": "一連の管理された実験室実験で、偽の好意的・否定的レビューのある市場を作り、取引量の推移を見る。買い手が市場で買うか外部の選択肢を選ぶかの決定を、隠れマルコフモデル（観測できない状態が確率的に移り変わるモデル）で表し、状態の移り変わりと、各状態での購入の決まり方を推定した（抄録）。", "p4": "評価の対象は、偽レビューの除去後の取引量の回復と、モデルで識別される潜在状態の間の移行である。モデルにもとづく反実仮想のシミュレーションで、一時的な値引きという対策の効果も調べた。参加者数と実験の回数は抄録に記載がない（抄録）。", "p5": "偽の好意的レビューであふれた市場では、除去のずっと後まで取引量が低いままになりうる。モデルは、市場への幻滅が深まっていく4つの潜在状態を識別し、その1つは買い手がほとんど戻らない「市場からの退出」の状態だった。状態の移行は品質についての悪い経験に強く動かされ、偽の好意的レビューの市場でそれが最も速く積み重なった（抄録）。", "p6": "一時的な値引きは、偽の好意的レビューの除去後に買い手を呼び戻す助けになるが、偽の否定的レビューを消した場合には不要に見えると著者は述べる。実験室での結果が実際のオンライン市場にどこまで当てはまるか、効果の大きさは、本文を読めておらず未確認。", "fun": "やらせの高評価にだまされて質の悪い品をつかまされた客は、やらせが一掃されたあと、また買い物に戻ってくるだろうか。実験の答えは「なかなか戻らない」だった。面白いのは、悪口のやらせより、ほめるやらせのほうが傷が深いことである。期待して買って裏切られる経験が積み重なり、客は「もうここでは買わない」という状態に入ってしまう。信頼は壊すのは簡単で、直すのは難しい。", "unverified": "SSRNの本文を取得できず、実験の設計の詳細、参加者数、取引量の低下の大きさ、モデルの推定値は未確認。"}}, {"id": "pr12", "rank": 12, "headline": "岩石の速度依存の弾塑性をペリダイナミクスで再現", "title": "A Rate-Dependent Elastoplastic Peridynamic Model for Rock and Its Numerical Implementation", "url": "https://doi.org/10.20944/preprints202611.1240.v1", "authors": "Jinlu Ba ほか", "venue": "Preprints.org", "date": "2026-11-12", "apa": "Ba, J., Wang, J., Liu, X., Sun, G., Jia, Z., & Wang, K. (2026). A Rate-Dependent Elastoplastic Peridynamic Model for Rock and Its Numerical Implementation. https://doi.org/10.20944/preprints202611.1240.v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "衝撃を受ける岩石の、ひずみ速度に依存する弾塑性の挙動と破壊を、ペリダイナミクス（物体を相互作用する点の集まりとして扱う計算法）で再現するモデルと、その並列計算の実装を示した（抄録）。未査読のプレプリント。", "p2": "岩石は衝撃荷重のもとで、ひずみ速度依存性、圧力への感度、引張と圧縮の非対称性、非線形の体積応答を示し、動的応答と破壊の正確な予測が難しかった（抄録）。", "p3": "Holmquist–Johnson–Cook（HJC）の弾塑性モデルを、通常の状態ベースのペリダイナミクスの枠組みに組み込み、引張と圧縮で別々のひずみ速度効果、圧力依存の降伏、非線形の体積応答、塑性損傷の発展を扱う。ひずみ速度による強化の係数は下限の制約と5次の平滑化関数で修正した。流体と固体の連成のため、粒子法のSPHと結合し、CPUとGPUを併用する並列の枠組みを作った（抄録）。", "p4": "3点曲げ、スプリット・ホプキンソン棒（SHPB）試験、単孔の発破の3つのシミュレーションで、亀裂の型と応力応答を既報の結果と比べた（抄録）。", "p5": "亀裂の型と応力応答は既報の結果とよく一致した。3点曲げでは、載荷速度が高いほど局所の圧密が強まり、亀裂の進展が遅れて、亀裂が貫通するのに必要な変位が0.104 mmから0.29 mmに増えた。単孔発破では孔の近くの破砕、放射状の亀裂、環状の局所損傷を再現した。CPUとGPUの併用は、CPUだけの並列に比べ実行時間を約53.1%減らした（抄録）。", "p6": "検証は既報の結果との比較によるもので、パラメータの決め方、粒子の間隔への依存は抄録に記載がない。著者の述べる限界は本文を読めておらず未確認。", "fun": "岩は、力をかける速さによって振る舞いが変わる。速くたたくほど強く振る舞い、割れ方も違ってくる。この研究は、岩を無数の点の集まりとして表し、点と点の相互作用で変形と割れを計算した。割れ目の通り道をあらかじめ決めなくてよいのが、この計算法の利点である（背景）。発破で孔のまわりが砕け、放射状にひびが走る様子まで再現している。", "unverified": "Preprints.orgの本文を取得できず、構成則の式、材料パラメータ、計算の解像度、比較した既報の結果の内容は未確認。"}}, {"id": "pr13", "rank": 13, "headline": "ガタのある翼の非線形モードを縮約して16〜36倍速く", "title": "Efficient Nonlinear Normal Mode Analysis of Wing–Control Surface Structures with Free-Play Nonlinearity Using a CMS–HCF Framework", "url": "https://doi.org/10.21203/rs.3.rs-11426157/v1", "authors": "Chin-Yi Chang ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Chang, C.-Y., & Tien, M.-H. (2026). Efficient Nonlinear Normal Mode Analysis of Wing–Control Surface Structures with Free-Play Nonlinearity Using a CMS–HCF Framework. https://doi.org/10.21203/rs.3.rs-11426157/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "Research SquareのPDFの本文のうち、抄録と結論・今後の課題の節を読んだ。定式化と結果の節の詳細は未読", "preprint": true, "p1": "ガタ（遊び）という局所的な非線形を持つ航空機の翼・操縦舵面の構造について、高自由度の有限要素モデルの非線形ノーマルモード（NNM）を、モード合成で縮約してから効率よく計算する枠組み（CMS–HCF）を作った（抄録、結論）。未査読のプレプリント。", "p2": "舵面の構造的な非線形は動特性と空力弾性の挙動を大きく変える。2〜3自由度の集中定数モデルはよく調べられてきたが、高自由度の有限要素モデルのNNMを従来の数値的な連続法で求めると、自由度が増えるにつれ計算費用が大きく増える（抄録）。背景：NNMは線形の固有モードを非線形系に拡張したもので、エネルギーによって振動数が変わる周期解の族。", "p3": "Craig–Bamptonの部分構造モード合成法（CMS）で、非線形の自由度を残したまま有限要素モデルを縮約し、そこにハイブリッドな連続法の枠組み（HCF）を組み合わせてNNMを計算する（結論）。対象は、局所的な区分線形の非線形を持つ構造である。", "p4": "従来の数値的な連続法（CMS–NCF）と、フルの有限要素モデルの過渡応答シミュレーションを比較対象に、振動数とエネルギーの関係曲線の一致と計算時間を評価した。ガタの角度と中央の剛性を変えるパラメータ解析も行った（抄録、結論）。", "p5": "提案法は第1・第2のNNMの族を正確に予測し、従来法に対する高速化は約16倍（5自由度の縮約モデル）から36倍（10自由度）だった。ガタの角度を小さくすると枝と内部共振の領域が低エネルギー側に移るが振動数の特性はあまり変わらず、中央の剛性を下げるとモード振動数の関係が変わって内部共振の次数が変わった（結論）。", "p6": "対象は保存系で、空気力や流体との連成はまだ入っていない。著者は非保存系への拡張と、フラッターやリミットサイクル振動の解析を今後の課題に挙げる（結論）。実機の計測との比較は、読んだ範囲に見当たらず未確認。", "fun": "つなぎ目にがたつきがあると、小さく揺らしたときと大きく揺らしたときで、揺れ方が変わる。飛行機の翼の舵も同じで、わずかな遊びが揺れの性質を変えてしまう。困るのは、揺れの大きさによって「固有の周期」そのものが変わることだ。この研究は、翼の細かい計算モデルを、がたつく部分を残したまま小さくまとめ、揺れの大きさごとの周期を速く計算した。小さくまとめても大事な性質が残ることを確かめている。", "unverified": "定式化と結果の節の詳細（図の数値、内部共振の次数の具体的な値）は読んでおらず未確認。実験による検証の有無は未確認。"}}, {"id": "pr14", "rank": 14, "headline": "隣接建物の衝突を非線形剛性の調整で避ける", "title": "Seismic Pounding Mitigation of Adjacent Buildings through Nonlinear Stiffness Tuning: Impact-Onset Boundaries and Separation-Gap Design", "url": "https://doi.org/10.21203/rs.3.rs-11224819/v1", "authors": "Alvaro H. Salas ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Salas, A. H., & Abdullayev, V. (2026). Seismic Pounding Mitigation of Adjacent Buildings through Nonlinear Stiffness Tuning: Impact-Onset Boundaries and Separation-Gap Design. https://doi.org/10.21203/rs.3.rs-11224819/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "Research SquareのPDFの本文のうち、抄録、限界、結論の節を読んだ。定式化と数値例の節は未読", "preprint": true, "p1": "隣り合う2棟の建物が地震時にぶつかる現象（棟間衝突）について、片方の建物の剛性に振幅依存の非線形性を持たせて相対運動の位相を変えれば、必要な離隔を小さくできる場合があることを、厳密な衝突開始条件と閉じた形の境界式で示した（抄録、結論）。未査読のプレプリント。", "p2": "建物間の離隔が足りないと、強震時に繰り返し衝突して大きな局所の接触力が生じる。従来の縮約モデルは、接触するまでの構造応答を線形と仮定し、非線形性を衝突要素にだけ入れていた（抄録）。", "p3": "まず任意の地動加速度について、最初の衝突を防ぐ最小の離隔は、接触前の2棟の「向きつきの相対変位」の最大値だけで決まり、接触後の剛性や減衰に依存しないことを示す（結論1）。調和加振では、立方剛性を持つ建物（ダフィング型）の応答が振幅の2乗についての3次方程式に帰着し、複数の応答状態が共存する領域の境界が得られる（結論2）。", "p4": "代表的な2棟の組について、調和加振のもとで応答の枝ごとの必要離隔を求め、ヘルツ型の非線形衝突シミュレーションで衝突の有無を直接確かめた。広帯域の加振でも一般の衝突開始条件を検証した（結論4、結論6）。", "p5": "振動数比1.20、加振の大きさ0.12gのとき、ある応答状態は約0.200 mの離隔を要するが、共存する別の状態では2棟がほぼ同位相で動くため約0.034 mで済む。離隔0.10 mでは前者は衝突を繰り返し、後者は接触しない。立方剛性を設計変数とすると最適値は約2.44×10⁹ N/m³付近で、衝突開始の離隔は約26.7 mmに減る（結論3〜5）。", "p6": "著者は、高次モード、床どうしの衝突、ねじれ、二方向の運動、地盤との相互作用、強度劣化などを含まない最小のモデルであり、ヘルツ接触の係数は例示にすぎず、実際の継手に直接は使えないと述べる。役割はふるい分けと仕組みの特定にとどまる（限界の節）。", "fun": "隣どうしの建物が地震で揺れてぶつかるかどうかは、それぞれがどれだけ大きく揺れるかで決まると思いがちだ。実は、二つが同じ向きに一緒に揺れていれば、大きく揺れてもぶつからない。この研究は、片方の建物の硬さが揺れの大きさで変わるようにしておくと、揺れのタイミングが変わり、必要なすき間が約0.200 mから約0.034 mまで減る場合があることを示した。揺れの大きさではなく、相手との動きの差が要である。", "unverified": "導出の節と数値例の図は読んでおらず、モデルの諸元（質量、剛性、減衰）と設計変数の安全な区間の詳細は未確認。"}}, {"id": "pr15", "rank": 15, "headline": "複数エージェントの経験再生の効果は再現しない", "title": "Replication Instability in Experience Replay for Multi-Agent LLM Pipelines", "url": "https://doi.org/10.21203/rs.3.rs-11409743/v1", "authors": "Jianhao Wang ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Wang, J., Wu, K., Liu, D., & Liu, S. (2026). Replication Instability in Experience Replay for Multi-Agent LLM Pipelines. https://doi.org/10.21203/rs.3.rs-11409743/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "Research SquareのPDFの本文のうち、抄録、パイプラインの説明（§3.1）、反復の設計（§4.6）、主要な結果（§5.1、§5.2、§5.4の冒頭）、考察の冒頭（§6.1）を読んだ。その他の節は未読", "preprint": true, "p1": "複数エージェントのLLMパイプラインで「経験再生」（高く評価された過去の出力を手本として文脈に入れ直す仕組み）の効果を1回の実行で測っても、結論は当てにならないことを、同じ実験の反復で示した（抄録、§5.1、§5.2）。未査読のプレプリント。", "p2": "経験再生は、パラメータを更新せずにエージェントに記憶を与える方法で、複数エージェント系では組織の記憶と協調の仕組みになる。その効果はふつう確率的な実行1回で測られているが、その測り方で主張を支えられるかは確かめられていなかった（抄録）。", "p3": "5つのエージェントが直列につながるパイプラインで、再生なしの基準と、無作為な再生・関連度で照合した再生を比べる。29のプロファイルについて各条件を3回生成し、その平均を使う。判定役のLLMが10点満点で採点する（§3.1、§4.6）。", "p4": "2つのモデルで計15の管理された比較を行い、1回の実行での推定値と、反復したときの推定値・有意性を比べた。同一の設定を独立に10回（各モデル5回）走らせて、推定値そのものの散らばりも調べた（抄録、§5.4）。", "p5": "1回の実行では、あるモデルで再生が品質を下げ（Δ＝−0.172、p＝0.041）、別のモデルで上げる（Δ＝+0.147、p＝0.040）という逆向きの有意な効果が出たが、3回の反復ではどちらも有意でなくなった（Δ＝−0.048、p＝0.442とΔ＝+0.046、p＝0.241）（§5.1、§5.2）。同一設定の10回の推定値は0.138の幅に散らばり、有意かどうかも食い違った（抄録）。", "p6": "著者は原因を、判定の得点が上端に圧縮されていること（96件の報告のうち73件が同じ平均点8.2）に求め、生成ごとのばらつきが操作の効果と同程度になると説明する（§6.1）。対象は1つのパイプラインと2つのモデルである。著者は主張の境界と妥当性への脅威も論じている（§6.6、§6.7）が、その節は読んでおらず未確認。", "fun": "AIのチームに「過去のうまくいった例」を見せると成績が上がるか。1回試すと「下がった」と出て、別のAIで1回試すと「上がった」と出た。どちらも統計的に意味のある差に見えた。ところが同じ実験を繰り返すと、どちらの差も消えてしまった。採点がほとんど同じ点数に固まっていると、たまたまのぶれが大きな差に見える。1回の結果だけで結論を出す危うさを、数字で見せた研究である。", "unverified": "客観的な課題での結果、7項目の評価手順の内容、主張の境界と妥当性への脅威の節は読んでおらず未確認。"}}, {"id": "pr16", "rank": 16, "headline": "景気の転換点を踏まえ信用リスクモデルを保守", "title": "Change-Point-Aware Lifecycle Validation of Credit Risk Models Under Economic Regime Shifts", "url": "https://doi.org/10.2139/ssrn.7683053", "authors": "Xu Han ほか", "venue": "SSRN", "date": "2026-11-12", "apa": "Han, X., & Yang, Y. (2026). Change-Point-Aware Lifecycle Validation of Credit Risk Models Under Economic Regime Shifts. https://doi.org/10.2139/ssrn.7683053", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（SSRN。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "景気の局面が変わるたびにずれていく信用リスクのデフォルト確率モデルについて、毎月「維持・再較正・改訂」のどれにするかを決める検証の枠組みCP-LVを提案した（抄録）。", "p3": "マクロのストレス指数の変化点検出、母集団の安定性、成熟途中の貸出からも較正の証拠を取り出すリスク調整つき累積和（MA-RA-CUSUM）の3つの証拠を合わせ、2段階の検定で警報を処理する（抄録）。背景：累積和（CUSUM）は小さなずれの蓄積から変化を見つける方法。", "p5": "2006〜2013年のProsperの貸出68,927件で、8つの運用方針の中でAUROCが最高（0.697）、Brierスコア（0.0687）と期待較正誤差（0.0082、静的モデルより45%低い）が最低で、四半期ごとの再学習より全面的な再学習が70%少なかった（抄録）。", "fun": "お金を貸してから返ってくるかどうかが分かるまでには何年もかかる。だから「予測モデルがずれてきたか」を確かめたくても、答え合わせの材料がなかなかそろわない。この研究は、まだ返済途中の貸出からも「今のところ予想より焦げつきが多いか」という手がかりを取り出し、景気の変わり目を早く察知してモデルを直す。答えが出そろう前に採点を始める工夫が面白い。", "unverified": "本文を読めていないため、検定の具体的な手順、8つの運用方針の内容、誤分類費用の設定は未確認。"}}, {"id": "pr17", "rank": 17, "headline": "LLMの査読は質を見分けるが独創性を低く見る", "title": "Frontier language models recover scientific quality but predictably diverge from human reviewers", "url": "https://doi.org/10.21203/rs.3.rs-11132861/v1", "authors": "Vaibhava Lakshmi Ravideshik ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Ravideshik, V. L., Tang, Z., & Kejriwal, M. (2026). Frontier language models recover scientific quality but predictably diverge from human reviewers. https://doi.org/10.21203/rs.3.rs-11132861/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Research Square。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "先端の言語モデル3つの合議による査読が、論文の質の序列をどこまで再現し、人の査読者とどこでずれるかを、機械学習の論文1,066本で調べた（抄録）。", "p3": "2025年の主要会議（NeurIPS、ICML、ICLR）の本会議とワークショップ、被引用数で層別した学術誌の論文を、3モデルの合議で4段階の査読基準により採点し、ICLRの162本では人の査読と入れ子で比べた（抄録）。", "p5": "合議の得点は、本会議の論文がワークショップより0.40高いなど、期待される質の差をすべて再現した。一方、3モデルとも独創性を14〜17ポイント低く見積もり、人との一致は論文の強みで高く弱点で低かった（抄録）。", "fun": "AIに論文を採点させると、良い論文と普通の論文の区別はちゃんとつく。ところが「新しさ」だけは3つのAIがそろって低めに見積もり、弱点の指摘も人と食い違った。複数のAIの意見が一致していても、それがそのまま正しい評価とは限らない。どこが合い、どこがずれるのかを項目ごとに数字で示した点が面白い。", "unverified": "本文を読めていないため、採点基準の項目、独創性の低評価の測り方、研究分野ごとの差の大きさは未確認。"}}, {"id": "pr18", "rank": 18, "headline": "LLMエージェントは仲介者を迂回するか", "title": "When Do AI Agents Bypass the Broker? A case study in HIVEMARKET, a configurable multi-agent information market", "url": "https://osf.io/gn6vr", "authors": "Lydia Ashton", "venue": "OSF Preprints (OSF Preprints)", "date": "2026-11-09", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（OSF Preprints。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "LLMエージェントが、規則で禁じられた近道（仲介者を通さない直接の通信）をいつ試みるかを観察するための実験環境HIVEMARKETと、その事例研究を示した（抄録）。", "p3": "6体のLLMエージェントのチームが、情報トークンの中のコードを仲介者経由で売買して課題を完了する。申し出は1回ごとに手数料がかかり、機械どうしの直接接続は存在するが規則で禁じられている。手持ちの余裕（参照計画の費用を超えて与える量）を変えて行動を記録する（抄録）。", "p5": "行動はネットワーク・シェル・モデル呼び出しの水準ですべて記録される。禁じられた直接の経路がどの条件でどれだけ使われたかの数値は、抄録に記載がない（抄録）。", "fun": "「手数料のかかる正規の窓口」と「禁止されているが使える裏口」があるとき、AIは裏口を使うだろうか。この研究はAIのチームにそういう状況を作り、手持ちの余裕を変えながら、いつ規則を破ろうとするかを通信の記録まで残して観察する。規則を知っていることと守ることの間にある差を、実験で確かめようとする問いそのものが面白い。", "unverified": "本文を読めていないため、使用したモデル、試行回数、直接の経路を試みた頻度と条件は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "表形式基盤モデルのShapley説明は前提しだい", "title": "Estimand-Relative Validity and Context-Driven Instability of Shapley Explanations for Tabular Foundation Models", "url": "https://doi.org/10.21203/rs.3.rs-11112632/v1", "authors": "Emin Talip Demirkiran", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Demirkiran, E. T. (2026). Estimand-Relative Validity and Context-Driven Instability of Shapley Explanations for Tabular Foundation Models. https://doi.org/10.21203/rs.3.rs-11112632/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Research Square。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "表形式データ向けの基盤モデルにShapley値による説明を使うとき、「特徴量がない状態」をどう作るかで説明の正しさが変わることを、参照解のある実験で示した（抄録）。", "p3": "TabPFN v2とTabICL v2について、5つの除去の方法を、厳密なShapley値の列挙、参照となる寄与が分かっている合成データ、実データ、事前登録した要因計画で比べた（抄録）。背景：Shapley値は予測への各特徴量の寄与を配分する指標。", "p5": "どの方法が良いかは推定対象しだいで、平均値の代入と欠測の符号化は介入的な寄与に、文脈の作り直しと条件つき推定は条件つきの寄与に近かった。寄与のばらつきは主に文脈として与える例の選び方から生じ、ラベルの情報を持たない特徴量にも予測は反応した（抄録）。", "fun": "AIの予測に「どの項目がどれだけ効いたか」を割り振る説明は便利だが、割り振るには「その項目がなかったら」という仮の状況を作らなければならない。平均値で埋めるのか、空欄のままにするのかで、説明の中身が変わってしまう。この研究は、何を知りたいのかを先に決めないと説明は読めないこと、手本として見せる例を変えるだけで説明が揺れることを確かめた。", "unverified": "本文を読めていないため、誤差の具体的な数値、使用した実データ、特徴量間の依存の強さによる順位の変化は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "予想信用損失の見積りの正確さを測る研究計画", "title": "Who Gets Expected Credit Losses Right? Estimation Quality, Auditors and Governance in Emerging-Market Lenders A research design and pre-analysis plan", "url": "https://doi.org/10.2139/ssrn.7682963", "authors": "Rakesh Gupta", "venue": "SSRN", "date": "2026-11-12", "apa": "Gupta, R. (2026). Who Gets Expected Credit Losses Right? Estimation Quality, Auditors and Governance in Emerging-Market Lenders A research design and pre-analysis plan. https://doi.org/10.2139/ssrn.7682963", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（SSRN。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "貸し手の予想信用損失（ECL）の見積りが後からどれだけ当たっていたかを測り、誰の監視が誤差を減らすかを調べるための研究計画と事前分析計画で、結果はまだ報告していない（抄録）。", "p3": "Dechow and Dichev（2002）の考え方を信用損失に当てはめ、引当金とその後に実現した損失を対応させて、符号のない雑音と符号のある偏りに分ける。両者を監査人の業種専門性、監査委員会の実効性、CFOの影響、ECL開示の文章の特徴と関係づける（抄録）。", "p5": "インドでは非銀行の貸し手が2019年度からInd AS 109を適用し、商業銀行は2027年4月1日にECLへ移行するため、事前に仮説を立てた検証ができる。確認的な仮説5つと探索的な問い1つを述べる（抄録）。", "fun": "銀行は「貸したお金のうち、将来どれだけ返ってこないか」を見積もって決算に載せる。この見積りが正しかったかは、何年もたって実際の損失が出るまで分からない。この計画は、見積りと後の実績を突き合わせて、ただの当て外れ（雑音）と、いつも甘い・いつも辛いという癖（偏り）を分けようとする。結果を見る前に仮説と分析手順を公開しておく点も、後出しを防ぐ工夫である。", "unverified": "結果は報告されていない。本文を読めていないため、標本の規模、変数の定義、5つの仮説の内容は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "生成AIの文章利用は若手研究者の生産性を高める", "title": "Generative AI Writing and the Distribution of Scientific Rewards: Evidence from 19 Million Research Works", "url": "https://doi.org/10.2139/ssrn.7683645", "authors": "Marcelo Perlin ほか", "venue": "SSRN", "date": "2026-11-12", "apa": "Perlin, M., Borenstein, D., Imasato, T., & Foguesatto, C. (2026). Generative AI Writing and the Distribution of Scientific Rewards: Evidence from 19 Million Research Works. https://doi.org/10.2139/ssrn.7683645", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（SSRN。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "論文の抄録に現れるLLM特有の語を手がかりに、生成AIによる執筆の広がりと、被引用・論文数・研究費という研究上の報酬の配分との関係を大規模に調べた（抄録）。", "p3": "OpenAlexの英語論文1,940万件（2018〜2025年）でLLMに特徴的な12語を追跡し、620万人の研究者のパネルで、著者と分野×年の固定効果を入れた差の差モデルを推定した。対照の語彙との比較も行う（抄録）。", "p5": "特徴語の出現率は3.3%から16.0%に上がり、2022年より後は非英語圏の著者（12.6%）が英語圏（9.9%）を上回った。採用は被引用の増加と、若手では論文数の増加（+10.6対数ポイント）と関連したが、研究費の獲得への効果は小さいか負だった（抄録）。", "fun": "AIが好んで使う言い回しがある。そうした語が論文の要旨にどれだけ出てくるかを数えれば、AIを使った執筆の広がりを大まかに推し量れる。調べると、英語が母語でない国の研究者ほどよく使い、若手の論文数が増えていた。ところが研究費の獲得にはほとんど効いていない。文章の壁は下がっても、お金の配分までは平等にならないという結果である。", "unverified": "本文を読めていないため、12の特徴語の内訳、対照の語彙の選び方、研究費データの範囲は未確認。特徴語の出現はAI利用の間接的な指標である。"}}, {"id": "pr22", "rank": 22, "headline": "職場の無礼は看護師の「静かな退職」と関連", "title": "Association Between Workplace Incivility and Mental Health, Quiet Quitting and Professional Life Among Nurses: Evidence from Greece", "url": "https://doi.org/10.20944/preprints202611.1295.v1", "authors": "Angeliki Triantafillaki ほか", "venue": "Preprints.org", "date": "2026-11-12", "apa": "Triantafillaki, A., Pesiridis, T., Velonaki, V. S., Katsiroumpa, A., Moisoglou, I., & Galanis, P. (2026). Association Between Workplace Incivility and Mental Health, Quiet Quitting and Professional Life Among Nurses: Evidence from Greece. https://doi.org/10.20944/preprints202611.1295.v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Preprints.org。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "看護師が職場で受ける無礼な扱いが、不安・抑うつ、「静かな退職」（必要最低限しか働かない状態）、仕事への関わり方とどう関連するかを調べた（抄録）。", "p3": "2026年5月にギリシャで行った横断調査。職場の無礼、不安と抑うつ、静かな退職、ワーク・エンゲイジメント、組織内自尊感情、職務満足、燃え尽き、離職意図を、妥当性が確認された尺度と単一項目で測り、多変量の線形回帰で分析した（抄録）。", "p5": "職場の無礼は、不安・抑うつ、静かな退職の3次元（離脱、主体性の欠如、動機の欠如）、燃え尽き、離職意図と正に、エンゲイジメント、組織内自尊感情、職務満足と負に関連した（抄録）。", "fun": "職場で無視されたり、ぞんざいに扱われたりすることは、分かりやすい暴力ではない。それでもこの調査では、そうした小さな無礼を多く受けている看護師ほど、気持ちが沈み、仕事は最低限だけこなす「静かな退職」の状態になりやすかった。辞めてはいないが心は離れている、という見えにくい損失を数字で捉えようとしている。", "unverified": "本文を読めていないため、回答者数と係数の大きさは未確認。横断調査のため因果の向きは分からない。"}}, {"id": "pr23", "rank": 23, "headline": "AI導入と生産性の公開データは証拠として弱い", "title": "SAGE-AIP: A Scale-Adaptive Gated Ensemble Framework for AI Adoption and Productivity Prediction-A Multi-Dataset Benchmark and Diagnostic Evaluation", "url": "https://doi.org/10.20944/preprints202611.0013.v2", "authors": "Kittipol Wisaeng ほか", "venue": "Preprints.org", "date": "2026-11-12", "apa": "Wisaeng, K., & Enyiawah, B. A. (2026). SAGE-AIP: A Scale-Adaptive Gated Ensemble Framework for AI Adoption and Productivity Prediction-A Multi-Dataset Benchmark and Diagnostic Evaluation. https://doi.org/10.20944/preprints202611.0013.v2", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Preprints.org。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "AIの導入と生産性の根拠として使われる3つの公開データを点検し、うち2つは生産性向上の主張を支える証拠として使えないことを示した（抄録）。", "p3": "各データの分布と変数間の関係を監査したうえで、従業員単位のデータ（150件）について、入れ子の交差検証とデータ漏れを防いだ手順で、再構成した集合学習の手法（SAGE-AIP）を他の手法と比べた（抄録）。", "p5": "145,000件の導入データは一様分布と区別できず共変量ともほぼ無関係で、国×年の「AI生産性スコア」は他の変数のほぼ決定的な関数だった。予測誤差（RMSE）はランダムフォレスト0.4935、提案手法0.5024で、優位性は確立されなかった（抄録）。", "fun": "「AIを入れると生産性が上がる」と示すデータが公開されていても、中身を調べると、数字がでたらめに近く散らばっていたり、ある列が別の列から計算しただけだったりすることがある。この研究は、凝った予測手法を試す前にまずデータそのものを疑い、自分たちの手法が勝てなかったことも正直に書いた。分析はデータの素性の確認から始まる、という教訓である。", "unverified": "本文を読めていないため、3つのデータの出所と名称、監査の具体的な検定は未確認。"}}, {"id": "pr24", "rank": 24, "headline": "AI燃え尽きを測る尺度の試案", "title": "A Heuristic Proposal for Measuring AI Burnout", "url": "https://doi.org/10.5281/zenodo.24145248", "authors": "Pitto, Andrea", "venue": "Zenodo", "date": "2026-11-11", "apa": "Pitto, A. (2026). A Heuristic Proposal for Measuring AI Burnout. Zenodo. https://doi.org/10.5281/ZENODO.24145248", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "DataCiteに登録された抄録（Zenodo。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "生成AIを使う仕事や学業で生じる新しい型の疲労を「AI燃え尽き」という作業仮説として定め、それを測る試案の尺度を示した。データによる検証はまだない（抄録）。", "p3": "既存の燃え尽き・テクノストレス・依存の尺度に、機械の出力を監視することによる消耗と、自分の仕事からの疎外を加える。尺度は、燃え尽き、注意と動機、思考の自律、実生活への影響の4次元からなる（抄録）。", "p5": "横断での実施、6・12・24か月の縦断追跡、因子の妥当性確認、反証の基準についての方法上の指針を示している。実データでの結果は抄録に記載がない（抄録）。", "fun": "AIに文章や計算を任せると楽になるはずなのに、出てきた答えが正しいかをずっと見張っていると、別の疲れがたまる。さらに「これは本当に自分の仕事だろうか」という感覚も生まれる。この試案は、従来の燃え尽きの質問票では拾えないこの二つを測ろうとする。まだ質問項目の案の段階で、実際に人に答えてもらって確かめるのはこれからである。", "unverified": "尺度の項目文、回答形式、信頼性・妥当性の数値は未確認（検証前の提案）。本文は読めていない。"}}, {"id": "pr25", "rank": 25, "headline": "外出制限下の高齢者の自律と社会参加", "title": "Beyond Vulnerability: Autonomy, Social Participation, and the Experiences of Older Adults During the COVID-19 Lockdown", "url": "https://doi.org/10.21203/rs.3.rs-11155782/v1", "authors": "Azucena Pedraz Marcos ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Marcos, A. P., Palmar-Santos, A. M., López-Benavente, Y., Taltavull-Aparicio, J. M., Sánchez, M. G., Company-Sancho, M. C., Cidoncha-Moreno, M. Á., Feria-Raposo, I., Moreno-Casbas, M. T., Rico-Blázquez, M., Esteban-Sepúlveda, S., & Rich-Ruiz, M. (2026). Beyond Vulnerability: Autonomy, Social Participation, and the Experiences of Older Adults During the COVID-19 Lockdown. https://doi.org/10.21203/rs.3.rs-11155782/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Research Square。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "スペインで外出制限を経験した75歳以上の人々とその家族介護者の語りから、高齢者を守るための制限が自律と社会参加に何をもたらしたかを明らかにした（抄録）。", "p3": "2023年3〜10月に、11県の都市部と農村部の75歳以上の37人と家族介護者70人に、半構造化面接と討論グループを行い、多層の言説分析で分析した質的研究（抄録）。", "p5": "年齢にもとづく制限は、虚弱で依存的という固定観念を強め、スティグマと社会的孤立につながりうると語られた。一方で、運動、技術の利用、意味のある日課が自律・つながり・回復力を支えたが、実行できるかは人と状況で異なった（抄録）。", "fun": "「高齢者を守るため」の外出制限は、善意の対策だった。しかし当事者に話を聞くと、年齢だけで一律に制限されることが「年寄りは弱くて世話が要る」という見方を強め、かえって孤立を深めたという。守ることと、自分で決めて社会に関わることは、ときにぶつかる。当事者の視点を緊急時の計画に入れるべきだ、というのが著者の結論である。", "unverified": "本文を読めていないため、参加者の属性の内訳と語りの具体例は未確認。質的研究のため一般化の範囲は限られる。"}}, {"id": "pr26", "rank": 26, "headline": "地域の社会的脆弱性と口腔の健康が全米で関連", "title": "Neighborhood Social Vulnerability and Oral Health Outcomes Across U.S. Census Tracts: A National Ecological Analysis", "url": "https://doi.org/10.21203/rs.3.rs-11472696/v1", "authors": "Collins Gaba ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Gaba, C., & Asiedu, A.-L. (2026). Neighborhood Social Vulnerability and Oral Health Outcomes Across U.S. Census Tracts: A National Ecological Analysis. https://doi.org/10.21203/rs.3.rs-11472696/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Research Square。候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": true, "short": true, "p1": "米国の国勢調査区の単位で、地域の社会的脆弱性が高いほど高齢者の歯の喪失が多く、歯科受診が少ないことを全国規模で示した（抄録）。", "p3": "2025年のPLACESによる歯の喪失（65歳以上）と過去1年の歯科受診（18歳以上）の推定有病率を、2022年の社会的脆弱性指数と83,143の調査区で結びつけた生態学的な横断研究。分数ロジットとマルチレベルモデルを使った（抄録）。", "p5": "脆弱性が最も低い四分位から最も高い四分位にかけて、歯の喪失は平均7.7%から21.9%に増え、歯科受診は70.9%から48.5%に減った。関連は州内でも保たれ、社会経済的な脆弱性との関連が最も強かった（抄録）。", "fun": "歯がすべてなくなるかどうかは、歯みがきの習慣だけで決まるように思える。ところが全米の83,143の地区を比べると、暮らしが不安定な地区ほど歯を失った高齢者の割合が高く、最も恵まれた地区の7.7%に対し、最も厳しい地区では21.9%だった。住む場所の条件が健康を左右することを、歯という身近な指標で見せた研究である。", "unverified": "抄録の末尾が切れており、結論の後半は未確認。有病率はモデルによる推定値で、個人単位の因果は分からない。"}}, {"id": "pr27", "rank": 27, "headline": "地域での緩和リハビリの提供のされ方を事例で比較", "title": "How community palliative rehabilitation is delivered in the United Kingdom: a multiple case study", "url": "https://doi.org/10.21203/rs.3.rs-11403686/v1", "authors": "Jane Manson ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Manson, J., Taylor, P., Mawson, S., Gath, J., & O’Cathain, A. (2026). How community palliative rehabilitation is delivered in the United Kingdom: a multiple case study. https://doi.org/10.21203/rs.3.rs-11403686/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Research Square。候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": true, "short": true, "p1": "英国の地域で行われる緩和リハビリテーションが実際にどう組織され提供されているかを、専門の緩和ケア（ホスピス）と一般の地域リハビリ（NHS）の2つのモデルで比べた（抄録）。", "p3": "対照的な2事例の混合研究法。当事者・介護者・療法士・管理者らへの面接（34人）、療法スタッフの調査（46人）、利用記録（2966人）、内部文書（14件）を、事例ごとに主題分析と三角測量で分析し、事例間で比べた（抄録）。", "p5": "どちらの療法士も全人的で本人中心のリハビリを重視していたが、ホスピス側は関係づくりに時間を使えたのに対し、NHS側は待機と容量の圧力で時間が足りなかった。一般と専門のチームの連携は限られ、共有記録を見られないことが連絡の妨げになった（抄録）。", "fun": "治らない病気を抱えた人が、最後まで自分らしく動けるように支えるリハビリがある。同じ目的でも、寄付で運営されるホスピスでは一人ひとりと話す時間が取れ、公的な医療では順番待ちに追われて時間が足りなかった。志は同じでも、仕組みとお金の出どころが違うと、できることが変わる。現場の語りと利用記録の両方から、その差を描いている。", "unverified": "抄録の末尾が切れており、結果の後半と結論は未確認。2事例の比較のため一般化の範囲は限られる。"}}, {"id": "pr28", "rank": 28, "headline": "性格特性とボランティア・寄付の関係を縦断で検討", "title": "Personality Traits and Philanthropy Across Time", "url": "https://doi.org/10.31234/osf.io/vtwbs", "authors": "Lina Hungerbuehler ほか", "venue": "PsyArXiv", "date": "2026-11-12", "apa": "Hungerbuehler, L., Krämer, M. D., Haehner, P., Hopwood, C. J., & Bleidorn, W. (2026). Personality Traits and Philanthropy Across Time. https://doi.org/10.31234/osf.io/vtwbs", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（PsyArXiv。候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": true, "short": true, "p1": "性格特性がその後のボランティアや寄付を予測するか（選抜効果）、逆にそうした活動が性格の変化を予測するか（社会化効果）を、スイスの縦断データで調べた（抄録）。", "p3": "スイスの全国代表の5時点パネル（各時点2,085〜4,475人）で、広い性格領域と、その下位の側面の両方について、性格から後の活動への予測と、活動から性格の軌跡への予測を検証した（抄録）。", "p5": "外向性の高さと神経症傾向の低さがボランティアを、協調性と正直さ・謙虚さの高さが寄付を一貫して予測した。下位の側面では、思いやりと勤勉さが、礼儀正しさと几帳面さより一貫した正の関連を示した。社会化効果の証拠は限られた（抄録）。", "fun": "ボランティアをする人と寄付をする人は、同じ「いい人」に見えるが、性格の型が違っていた。人と関わるのが好きで落ち着いた人は体を動かして手伝い、協調的で正直な人はお金を出す傾向があった。反対に、活動を続けたから性格が変わるという証拠は少なかった。「人助けが人を変える」というより「そういう人が人助けを選ぶ」に近い結果である。", "unverified": "抄録の末尾が切れており、社会化効果の詳細は未確認。本文を読めていないため、効果の大きさと分析モデルは未確認。"}}, {"id": "pr29", "rank": 29, "headline": "接種をためらう地域集団の障壁と促進要因", "title": "Barriers and Enablers of COVID-19 Vaccination Among Black, Eastern European, and Low Socioeconomic Status Communities in Canada", "url": "https://doi.org/10.21203/rs.3.rs-11089357/v1", "authors": "Tori Langmuir ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Langmuir, T., Gibson, E., Fontaine, G., Smith, M., Alghamyan, A., Thompson, K., Zmytrovych, K., Wilson, M., McCleary, N., Patey, A. M., Mekki, K., Estey-Noad, L., Buchan, J. L., Dubey, V., Reynolds-Taffe, C., McMillan, G. E., Allen, Z., Crawshaw, J., Grimshaw, J. M., et al. (2026). Barriers and Enablers of COVID-19 Vaccination Among Black, Eastern European, and Low Socioeconomic Status Communities in Canada. https://doi.org/10.21203/rs.3.rs-11089357/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Research Square。候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": true, "short": true, "p1": "カナダ・オンタリオ州で接種率が低いとされた3つの集団（黒人、東欧系、接種率の低い地区）について、新型コロナワクチンの接種を妨げる要因と促す要因を行動科学の枠組みで整理した（抄録）。", "p3": "地域の保健当局と当事者の住民と組み、英語・フランス語・アラビア語・ウクライナ語・ロシア語・ポーランド語で68人に面接した。理論的領域の枠組み（Theoretical Domains Framework）でデータの収集と分析を導いた（抄録）。", "p5": "参加者の52%が2回接種、25%が1回以下だった。多くがためらいや恐れを語り、周囲の人の影響が目立つ領域だった。接種の利用に必要な知識・資源、ワクチンや感染の印象的な経験、自分のリスクの評価、保健制度への信頼と不信など、6つの主題が見いだされた（抄録）。", "fun": "ワクチンを打たない理由は「知らないから」だけではなかった。予約の取り方が分からない、過去の経験が怖い、自分は大丈夫だと思う、制度を信用できないなど、理由はさまざまだった。この研究は6つの言語で当事者に直接聞き、理由を整理した。相手の事情を聞かずに「正しい情報」だけを配っても届かない、ということが分かる。", "unverified": "抄録の末尾が切れており、6つ目の主題と結論は未確認。面接による質的研究で、集団間の差の大きさは分からない。"}}, {"id": "pr30", "rank": 30, "headline": "GNSSの整数アンビギュイティ解を残差で改良", "title": "Residual-Guided Boosted-LLL Refinement with Reliability-Time Analysis for GNSS Integer Ambiguity Resolution", "url": "https://doi.org/10.21203/rs.3.rs-11387577/v1", "authors": "Songyan Zhou ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Zhou, S., Wu, H., & Zhou, Y. (2026). Residual-Guided Boosted-LLL Refinement with Reliability-Time Analysis for GNSS Integer Ambiguity Resolution. https://doi.org/10.21203/rs.3.rs-11387577/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Research Square。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "GNSSの搬送波位相の整数アンビギュイティ（波数の整数の不確定さ）を解く計算で、解の質を少ない追加計算で上げる改良法と、その追加時間が割に合うかを測る指標を提案した（抄録）。", "p3": "条件つきの丸め残差が大きい座標を選び、その近傍の限られた候補を完全な目的関数で評価する。候補集合を入れ子にして目的関数の値が増えないことを保証する。次元16〜40の70設定の管理されたシミュレーションで調べた（抄録）。", "p5": "9候補の改良は、目的関数の差が1%以内という基準を満たす確率を、2つの難度でおよそ4ポイントと5ポイント上げたが、厳密に正解する確率の改善はより小さかった。残差で選ぶほうが、同じ予算で座標を無作為に選ぶより改善が多かった（抄録）。", "fun": "衛星測位で位置を精密に出すには、電波の波が衛星から受信機まで「何個分」あったかという整数を当てなければならない。候補は膨大で、全部は試せない。この研究は、丸めたときの誤差が大きかった成分に絞って近くの候補だけを試す。さらに「精度の向上は計算時間の増加に見合うか」を測る物差しまで作った点が実務的である。", "unverified": "本文を読めていないため、実測データでの検証の有無と計算時間の絶対値は未確認。検証はシミュレーションによる。"}}, {"id": "pr31", "rank": 31, "headline": "観測量と完全性評価でGNSSのなりすましを検出", "title": "Detection of GNSS Spoofing and Jamming Using Signal Observables and Integrity Assessment", "url": "https://doi.org/10.21203/rs.3.rs-9626019/v1", "authors": "Sebastián Čikovský ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Čikovský, S., Šváb, P., Dzurovčin, P., & Hanák, P. (2026). Detection of GNSS Spoofing and Jamming Using Signal Observables and Integrity Assessment. https://doi.org/10.21203/rs.3.rs-9626019/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Research Square。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "GNSSの信号に対する妨害（ジャミング）となりすまし（スプーフィング）を、まず「この信号は判断に足る証拠か」を確かめてから見分ける2段階の検出法を提案した（抄録）。", "p3": "信号レベルの観測量を入力とする。第1段階の完全性ゲートが、受信信号が信頼できる解釈に足る証拠を持つかを評価し、通った観測だけを第2段階に送って、正常・なりすまし・妨害の3状態に分類する（抄録）。", "p5": "代表的なGNSSデータセットで、検出性能を保ちながら、不確かな信号条件での頑健性と判断の信頼性が改善したと報告する。検出率などの数値は抄録に記載がない（抄録）。", "fun": "カーナビやスマホの位置情報は、偽の電波でだまされうる。難しいのは、電波の状態が悪いだけの「悪意のない乱れ」が、攻撃とよく似て見えることだ。この研究は、いきなり「攻撃か否か」を判定せず、まず「判断できるだけの材料があるか」を確かめる。分からないときは無理に決めない仕組みを入れた点が面白い。", "unverified": "本文を読めていないため、使用したデータセット、観測量の種類、検出性能の数値は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "LLMの助言は曖昧さへの態度を変えるか", "title": "Ask Savage, Not the LLM", "url": "https://doi.org/10.2139/ssrn.7683336", "authors": "Victor Gonzalez-Jimenez ほか", "venue": "SSRN", "date": "2026-11-12", "apa": "Gonzalez-Jimenez, V., & Koornneef, S. (2026). Ask Savage, Not the LLM. https://doi.org/10.2139/ssrn.7683336", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（SSRN。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "LLMの助言が、確率の分からない状況（曖昧さ）での人の選択を変えるかを実験で調べ、標準のLLMの助言は曖昧さへの態度に影響しないことを示した（抄録）。", "p3": "参加者がLLMの助言を使えるかを無作為に変え、使える前後で曖昧さへの態度を測った。別の条件では、Savage（1954）の「当然原理」が選択に持つ含意を、文書で、またはLLMを通じて与えた（抄録）。", "p5": "文書での理論的な助言は、曖昧さ追求と曖昧さ回避の両方を減らし、選択を曖昧さ中立に近づけた。同じ理論を持たせたLLMは、参加者が求めた情報とLLMが出した助言がかみ合わず、助言があまり使われなかったため効果がなかった（抄録）。", "fun": "「当たりの確率が分からないくじ」の前で、人の選択は理屈から外れやすい。AIに相談すれば筋の通った選択ができそうだが、実験では何も変わらなかった。効いたのは、紙に書いた理論の説明のほうだった。同じ内容をAIに持たせても、人が聞きたいこととAIが答えることがずれて、助言が使われなかった。賢い助言者でも、かみ合わなければ役に立たない。", "unverified": "本文を読めていないため、参加者数、使用したLLM、効果の大きさは未確認。"}}, {"id": "pr33", "rank": 33, "headline": "判断に無関係な情報でLLMの推薦が変わるのを抑える", "title": "Debiasing LLM Recommendations via Decision-Aware Counterfactual Alignment", "url": "https://doi.org/10.21203/rs.3.rs-11505733/v1", "authors": "Alex Zheng ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Zheng, A., & Zheng, Y. (2026). Debiasing LLM Recommendations via Decision-Aware Counterfactual Alignment. https://doi.org/10.21203/rs.3.rs-11505733/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Research Square。候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": true, "short": true, "p1": "判断に無関係な情報（人種や性別の記述など）でLLMの推薦が変わってしまう偏りを、利用者に届く最終の推薦そのものを対象にして取り除く方法DACAを提案した（抄録）。", "p3": "無関係な手がかりだけが違う事例の組を作り、同じ候補から推薦させて比べる。課題に関係する証拠で報酬モデルを学習し、手がかりによる最終推薦の差に直接罰則をかけ、別に測った有用性の条件を満たす更新だけを受け入れる（抄録）。", "p5": "大学の専攻を推薦する管理された実験で、5つのオープンなLLMは人種や性別の記述を変えるだけで推薦10件のうち約2.5件が入れ替わった。DACAは同じ学業の記録には同じ専攻を同じ順で返し、学業との適合度を100点中63.5から86.4に上げた（抄録）。", "fun": "成績も興味もまったく同じ二人でも、自己紹介に書いた性別や人種が違うだけで、AIが勧める大学の専攻が10個のうち2〜3個変わってしまった。単にその情報を隠せば平等にはなるが、勧めの質が落ちる。この研究は「関係ない情報では答えを変えないが、関係ある違いにはきちんと応じる」ように調整する。公平さと役に立つことの両立をねらった点が面白い。", "unverified": "抄録の末尾が切れており、手がかりを省く方法との比較の詳細は未確認。本文を読めていないため、理論的な上界の内容は未確認。"}}, {"id": "pr34", "rank": 34, "headline": "複数エージェントを束ねるLLMの力を測る基準", "title": "PrincipalBench v2: A Validity-First Benchmark for LLM Orchestrators in Multi-Agent Pipelines", "url": "https://doi.org/10.5281/zenodo.24144842", "authors": "Sayan Chowdhury", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-11-11", "apa": "Chowdhury, S. (2026). PrincipalBench v2: A Validity-First Benchmark for LLM Orchestrators in Multi-Agent Pipelines. Zenodo. https://doi.org/10.5281/ZENODO.24144842", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（Zenodo。候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": true, "short": true, "p1": "複数エージェントを統括するLLM（作業の分解・監督・統合を担う役）を測るベンチマークの旧版が、モデル比較に使えないことを監査で示し、設計を作り直した第2版を提示した（抄録）。", "p3": "旧版を自らのコードとデータに照らして点検した。第2版は2段階の封印設計で、計画は質問だけから採点し、監督は正解に沿った作業報告（半分は誤りのない対照）で採点する。検出は偶然を補正し（YoudenのJ）、最終段を伏せて統括役に答えを統合させる（抄録）。", "p5": "旧版では500課題のうち433が実際の質問も正解もない定型の穴埋めで、すべての回に失敗が注入されていたため、何でも警告する方策が0.52の得点を得た。第2版の中核は手作りの67課題（289の下位課題）からなる（抄録）。", "fun": "テストで「全部に×を付ければ高得点」になる採点方法があったら、そのテストは何も測っていない。このベンチマークの旧版はまさにそうで、すべての問題に誤りが仕込まれていたため、中身を見ずに「全部あやしい」と言うだけで点が取れた。作者が自分の旧版の欠陥を調べて公表し、誤りのない問題を半分混ぜるなどして作り直した点が誠実で面白い。", "unverified": "抄録の末尾が切れており、第2版でのモデルの評価結果は未確認。審査のない置き場の報告で、本文は読めていない。"}}, {"id": "pr35", "rank": 35, "headline": "エージェントはいつ仕事を任せるべきかを計測", "title": "When to Delegate: A Measurement Study of Bounded Agent Teams for Personal Super Agents", "url": "https://doi.org/10.21203/rs.3.rs-11710191/v1", "authors": "Jipu Su", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Su, J. (2026). When to Delegate: A Measurement Study of Bounded Agent Teams for Personal Super Agents. https://doi.org/10.21203/rs.3.rs-11710191/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Research Square。候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": true, "short": true, "p1": "個人向けの多機能エージェントで、司令役が作業役に仕事を任せるチーム構成が単独のエージェントより得かどうかを計測し、確実に言えるのは「任せる費用」だけだと示した（抄録）。", "p3": "委任に上限を設ける実行時の規約を、22個の道具を持つ車載エージェントEvaに実装し、規則で採点する80課題のEva-Benchで、単独構成、上限つきのチーム、上限なしのチームを同じモデルと道具で比べた（抄録）。", "p5": "チームは遅延が2.75倍、トークンが2.59倍かかった。成功率は1回の実行では92.5%対91.2%でチームが上回ったが、3回の反復では92.9%対93.3%で逆転し、安定した優位はなかった。選択的に任せる方策は1回の実行で95.0%に達した（抄録）。", "fun": "仕事を分担すれば速く正確になる、とは限らない。AIのチームでも、指示を出し報告を受け取るやり取りに手間がかかり、時間も計算量も2倍半以上になった。それで成績が上がったかというと、1回目は勝ち、繰り返すと負けた。「チームのほうが良い」という結論は1回の実験では出せない、という慎重さがこの報告の面白いところである。", "unverified": "抄録の末尾が切れており、選択的な委任の詳細は未確認。1つのモデルと1つの道具の組での結果で、本文は読めていない。"}}, {"id": "pr36", "rank": 36, "headline": "LLM複数エージェント系の安全策を体系的に整理", "title": "Safeguarding LLM-Based Multi-Agent Systems: A Systematic Survey", "url": "https://doi.org/10.20944/preprints202611.1189.v1", "authors": "Madeline Abio ほか", "venue": "Preprints.org", "date": "2026-11-12", "apa": "Abio, M., Pan, J., Liu, Y., & Pan, S. (2026). Safeguarding LLM-Based Multi-Agent Systems: A Systematic Survey. https://doi.org/10.20944/preprints202611.1189.v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Preprints.org。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "LLMの複数エージェント系に固有の、エージェント間の通信や共有記憶を通じて広がる脅威に対する防御策を、体系的に分類した総説である（抄録）。", "p3": "問題を定義し、通常のLLMや単一エージェントの防御との違いを明確にしたうえで、既存の手法を、脅威の入口、防御の仕組み、修復の戦略という3つの次元で整理した（抄録）。", "p5": "代表的な防御手法について、動機、設計の原理、長所と限界を整理し、未解決の課題と今後の研究の方向を挙げている。定量的な比較の結果は抄録に記載がない（抄録）。", "fun": "AIが一人で働くときの守り方と、AIどうしが会話しながら働くときの守り方は違う。チームの中に悪意のある一員がいると、うその情報や危険な指示が伝言ゲームのように全体へ広がるからだ。これまでの総説は「どんな攻撃があるか」を整理してきたが、この総説は「どう守るか」のほうを整理した。一人ひとりを守るだけでは足りない、という点が要である。", "unverified": "本文を読めていないため、取り上げた手法の数と具体的な分類の中身は未確認。"}}, {"id": "pr37", "rank": 37, "headline": "人・AI・AI併用者の三者の合意で判定を保留する方法", "title": "Triangulation for Agreement and Inquiry with Non-Purely-Human Agents, and Its Risk of Not Guaranteeing Truth", "url": "https://doi.org/10.5281/zenodo.24154009", "authors": "Yamada, Kenji", "venue": "Zenodo", "date": "2026-11-12", "apa": "Yamada, K. (2026). Triangulation for Agreement and Inquiry with Non-Purely-Human Agents, and Its Risk of Not Guaranteeing Truth. Zenodo. https://doi.org/10.5281/ZENODO.24154009", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "DataCiteに登録された抄録（Zenodo。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "研究評価の合議で、AIを使わない人・AI・AIと連携した人の三者の判断をどう突き合わせて結論を出すかの手続き（三角測量法）を提案した概念的な論考である（抄録）。", "p3": "三者すべての支持があれば訂正可能な暫定の受理とし、一者または二者の支持なら保留して審査を続け、残った異論は最終判断と分けて保存する。支持とみなす閾値は評価の前に固定し、構造的な近さや手続きの結びつきによる独立性の損失を点検する（抄録）。", "p5": "三者が一致しても独立した検証が不十分なら暫定の受理を見送る。三者の認識がどれだけ重なっても、その共通部分が現実に対応する保証はなく、一致を真理の保証と取り違える危険が残ると論じる。実証の結果は抄録に記載がない（抄録）。", "fun": "人もAIも、AIに助けられた人も、みんなが「正しい」と言えば正しいのだろうか。この論考の答えは「いいえ」である。三者の判断が互いに独立でなければ、そろって間違えることがあるからだ。そこで、全員一致でも「仮の合格」にとどめ、反対意見は消さずに残しておく。合意と真実を区別しようとする姿勢が面白い。", "unverified": "概念的な提案で、実際の評価パネルでの検証は抄録に記載がない。審査のない置き場の文書で、本文は読めていない。"}}, {"id": "pr38", "rank": 38, "headline": "ペルソナ条件づけがエージェントの粘りを高める", "title": "Socio-Cognitive Persona Conditioning and Expert Metacognitive Priors for High-Agency Coding Agents: Empirical Evidence from Controlled Ablations, Multi-Model Behavioral Audits, and 5,621 Security Investigations", "url": "https://doi.org/10.5281/zenodo.24156131", "authors": "Wang, Minwei", "venue": "Zenodo", "date": "2026-11-12", "apa": "Wang, M. (2026). Socio-Cognitive Persona Conditioning and Expert Metacognitive Priors for High-Agency Coding Agents: Empirical Evidence from Controlled Ablations, Multi-Model Behavioral Audits, and 5,621 Security Investigations. Zenodo. https://doi.org/10.5281/ZENODO.24156131", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "DataCiteに登録された抄録（Zenodo。候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": true, "short": true, "p1": "自律型のコーディングエージェントが、最初の失敗で止まる、表面的な修正で済ませる、行き詰まると同じ手を繰り返す、という3つの失敗を、ペルソナによる条件づけなどで減らせるかを調べたとする報告（抄録）。", "p3": "根本原因の反証と通しの検証を完了前に求める社会認知的なペルソナ条件づけを定式化し、実際のソフトウェア欠陥9場面・18組の対照実験で標準のプロンプトと比べた。さらに8つのモデル構成で29回の実行を監査し、5,621件のセキュリティ調査報告から専門家の思考の型を抽出した（抄録）。", "p5": "条件づけにより、検証済みの欠陥修正が36%、検証の行動が65%、道具の呼び出しの深さが50%、潜在的なセキュリティ欠陥の発見が50%増えたと報告する（抄録）。", "fun": "AIに「粘り強く原因を突き止める人」という役柄を与えると、本当に粘り強くなるのだろうか。この報告によれば、役柄を与えたAIは、直したつもりで終わらせず、本当に直ったかを確かめる行動が増えた。言葉で与えた役柄が行動の量を変える、という点が面白い。ただし開発者自身による報告なので、第三者の追試が要る（解釈）。", "unverified": "抄録の末尾が切れており、モデル間の監査と専門家の思考の型の結果は未確認。審査のない置き場の文書で、開発者自身による評価である。本文は読めていない。"}}, {"id": "pr39", "rank": 39, "headline": "AI支援の金融リサーチで懐疑的な査読の効果を追跡", "title": "Skeptical Review and Evidence Traceability in AI-Assisted Financial Research: A Four-Case Retrospective Study", "url": "https://doi.org/10.5281/zenodo.24163643", "authors": "CHEN, CHUXIN JOHN", "venue": "Zenodo", "date": "2026-11-12", "apa": "CHEN, C. H. U. X. I. N. J. O. H. N. (2026). Skeptical Review and Evidence Traceability in AI-Assisted Financial Research: A Four-Case Retrospective Study (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.24163643", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "DataCiteに登録された抄録（Zenodo。候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": true, "short": true, "p1": "複数エージェントのLLMによる金融リサーチの作業の流れで、懐疑役の批判がどのように修正につながったかを、保存された記録からたどった4事例の振り返り研究（抄録）。", "p3": "専門の調査役、統括役、懐疑役を含む実験的な作業の流れについて、保存された草稿、懐疑役の異議、回答、最終判断、品質保証の文書を、事例内と事例間の質的分析で調べた。補足の証拠保管庫には主張単位の監査記録28件と原資料の写し65件がある（抄録）。", "p5": "4事例は、因果の説明、方向の不確実性、確率の仮定、仮想の資産配分の意図の変更を記録していた。ある事例では確率分布が0.46/0.11/0.43から0.45/0.10/0.45に修正された。懐疑役の異議は一律には採用されず、証拠の扱いの限界が未解決のまま残った（抄録）。", "fun": "AIのチームに調査をさせるとき、わざと「疑う役」を一人入れておくと結論は良くなるのだろうか。この研究は、疑う役の指摘で予想の確率や投資の判断がどう書き換えられたかを、後から証拠つきで追えるかを確かめた。指摘がすべて採用されたわけではなく、変更の幅がわずかな例もある。修正の跡が残ることと、結論が正しくなることは別だと分かる。", "unverified": "抄録の末尾が切れており、限界の記述の後半は未確認。4事例の後ろ向きの検討で、審査のない置き場の文書。本文は読めていない。"}}, {"id": "pr40", "rank": 40, "headline": "会計基準の問題では凝ったプロンプトが逆効果も", "title": "The Effect of Prompting Type on the Accuracy of Artificial Intelligence in Solving Practical Problems Involving Financial Accounting Standards", "url": "https://doi.org/10.5281/zenodo.24160289", "authors": "Hamdollahi, Marjan", "venue": "Zenodo", "date": "2026-11-12", "apa": "Hamdollahi, M. (2026). The Effect of Prompting Type on the Accuracy of Artificial Intelligence in Solving Practical Problems Involving Financial Accounting Standards. Zenodo. https://doi.org/10.5281/ZENODO.24160289", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "DataCiteに登録された抄録（Zenodo。候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": true, "short": true, "p1": "財務会計基準の実務問題をChatGPTに解かせるとき、凝ったプロンプトのほうが単純なプロンプトより正確とは限らないことを、小規模な実験で示した（抄録）。", "p3": "財務会計のさまざまな論点から難しい問題を10題選び、各問題を「単純なプロンプト」と「工夫したプロンプト」の2通りでChatGPTに与え、回答を教科書の標準解答と比べて評価した（抄録）。", "p5": "単純な計算問題では両者の成績は同程度だった。概念的に複雑な問題では、工夫したプロンプトが過度な複雑さを招いてモデルを誤らせることがあり、単純なプロンプトのほうが正確な場合があった。フィードバックを与えるとモデルは自己修正できた（抄録）。", "fun": "AIへの頼み方は、細かく指示するほど良い答えが返ってくると思いがちだ。ところが会計の難しい問題では、凝った指示がかえってAIを混乱させ、素直に聞いたほうが正解に近いことがあった。人に仕事を頼むときも、条件を付けすぎると肝心の点がぼやけることがある。問題の性質に合わせて頼み方を変える必要がある、という結果である。", "unverified": "抄録の末尾が切れており、正答の点数は未確認。10題・1モデルの小規模な実験で、審査のない置き場の文書。本文は読めていない。"}}, {"id": "pr41", "rank": 41, "headline": "政府経験のある取締役と政治支出の開示", "title": "Bringing Dark Money into the Light: Government Experienced Directors and Political Spending Disclosure", "url": "https://doi.org/10.21203/rs.3.rs-11483996/v1", "authors": "Michael Quinn ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Quinn, M., & Wasson, T. (2026). Bringing Dark Money into the Light: Government Experienced Directors and Political Spending Disclosure. https://doi.org/10.21203/rs.3.rs-11483996/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Research Square。候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": true, "short": true, "p1": "政府での勤務経験を持つ取締役を迎えることが、企業の政治支出の開示にどう関係するかを調べ、効果は開示の水準が低い企業で大きいことを示した（抄録）。", "p3": "2017〜2020年のS&P 500企業について、政府経験のある取締役のより包括的なデータベースを作り、分位点回帰で開示の水準ごとの関係を推定した（抄録）。背景：分位点回帰は、平均ではなく分布の各位置での関係を推定する方法。", "p5": "開示の水準が低い企業では、政府経験のある取締役を加える効果は平均の2倍で、開示の水準が高い企業では平均の十分の一にとどまった。ロビー活動が盛んな企業は開示を増やしにくい傾向も示された（抄録）。", "fun": "元官僚を取締役に迎える会社は、政治とのつながりを得る一方で、政治献金の使い道を外から見えるようにするのだろうか。調べると、もともと情報をほとんど出していない会社では開示が大きく増え、すでによく出している会社ではほとんど変わらなかった。平均だけを見ると隠れてしまう違いを、会社を開示の多さで並べて位置ごとに調べる方法で引き出している。", "unverified": "抄録の末尾が切れており、ロビー活動に関する結果の詳細は未確認。本文を読めていないため、標本の規模と効果の大きさの数値は未確認。"}}, {"id": "pr42", "rank": 42, "headline": "限られた生産量の開示から市場集中度の範囲を求める", "title": "Bounding company concentration in mineral markets from limited production disclosures", "url": "https://doi.org/10.21203/rs.3.rs-11528124/v1", "authors": "Juan Ignacio Guzmán", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Guzmán, J. I. (2026). Bounding company concentration in mineral markets from limited production disclosures. https://doi.org/10.21203/rs.3.rs-11528124/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Research Square。候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": true, "short": true, "p1": "上位企業の生産量しか分からない鉱物市場で、市場集中度の指標（ハーフィンダール・ハーシュマン指数、HHI）が取りうる範囲を計算し、中点と最大誤差を示す方法を作った（抄録）。", "p3": "既存の集中度の上下限をもとに、個別の上位シェアと追加の集中度比率を組み合わせ、シェアを共通の不確かな総生産量に結びつけ、報告の丸めも考慮する。24の鉱物産業の過去の観測で例示した（抄録）。", "p5": "2024年の米国のソーダ灰の生産能力の全数調査では、上位2社のシェアに4社集中度（91%に丸め）を加えるとHHIを60ポイントの幅に絞り込め、2社のシェアだけの462ポイントより大幅に狭まった（抄録）。", "fun": "市場がどれだけ少数の会社に握られているかを表す指数は、すべての会社のシェアが分からないと計算できない。しかし実際に分かるのは上位の数社だけのことが多い。この研究は「分からない部分がどうであっても、指数はこの範囲に必ず入る」という幅を計算する。上位4社の合計という数字を一つ足すだけで幅が大きく縮むことを示し、何を追加で尋ねれば十分かの指針にした。", "unverified": "抄録の末尾が切れており、保証の適用範囲の記述は未確認。本文を読めていないため、計算式の詳細は未確認。"}}, {"id": "pr43", "rank": 43, "headline": "流暢だが根拠の薄いAI評価と起業家の判断", "title": "Fluent but unfounded: generative AI, cue–evidence decoupling and founder judgement", "url": "https://doi.org/10.21203/rs.3.rs-11354871/v1", "authors": "Abbas Mohammed Sulaiman ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Sulaiman, A. M., & Hussein, Z. S. (2026). Fluent but unfounded: generative AI, cue–evidence decoupling and founder judgement. https://doi.org/10.21203/rs.3.rs-11354871/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Research Square。候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": true, "short": true, "p1": "生成AIが作る流暢な事業リスク評価が、根拠の強さと「根拠がありそうに見える手がかり」を切り離し、起業家の判断を誤らせうるという理論（手がかりと証拠の分離）を提示した（抄録）。", "p3": "人は流暢さ・構成・一致といった手がかりから証拠の強さを判断するが、生成AIは証拠の有無にかかわらずこれらを供給する、という前提から理論を組み立てる。検証のために「知識の強さの差」を、AI支援の評価を起業家が第三者より高く見積もる基準の数として定義する（抄録）。", "p5": "分離は、実際の不確実性を下げずに知覚される不確実性を下げる。差が広がる条件（新規性の高い事業、リスクの推定）と狭まる条件（批判役のAI、過去の見積りへのフィードバック）などを8つの命題にまとめた。実証の結果は抄録に記載がない（抄録）。", "fun": "文章が読みやすく、構成が整っていて、いくつもの点で話が合っていると、人は「よく調べてある」と感じる。ところが生成AIは、中身の裏づけがあってもなくても、そういう見た目を作れる。すると起業家は、危険が減ったわけでもないのに安心して資金をつぎ込んでしまうかもしれない。見た目のもっともらしさと根拠の強さを分けて測ろうという提案が面白い。", "unverified": "抄録の末尾が切れており、命題の後半は未確認。理論の提案で、データによる検証は抄録に記載がない。本文は読めていない。"}}, {"id": "pr44", "rank": 44, "headline": "AIによる構造的失業を純労働経済のモデルで検討", "title": "Singularity Is All You Need? AI, Structural Unemployment and the Baumol Inversion in a Pure-Labour Economy", "url": "https://doi.org/10.2139/ssrn.7683378", "authors": "Urban Sušnik", "venue": "SSRN", "date": "2026-11-12", "apa": "Sušnik, U. (2026). Singularity Is All You Need? AI, Structural Unemployment and the Baumol Inversion in a Pure-Labour Economy. https://doi.org/10.2139/ssrn.7683378", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（SSRN。候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": true, "short": true, "p1": "AIがあらゆる部門で生産性を需要より速く伸ばすと何が起きるかを、純労働経済の構造動学（パシネッティのモデル）で追い、労働の再配置では完全雇用を回復できないことを示した理論研究（抄録）。", "p3": "一人あたりに必要な労働を全部門で合計したものが1に等しい、という一つの条件が、完全雇用の条件であり所得がすべて支出される条件でもある、という枠組みを使う。過去は生産性の伸びと需要の伸びが負に相関していたため、放出された労働が吸収された（抄録）。", "p5": "AIが全部門で生産性の伸びを需要の伸びより高めると必要労働が減り、需要の再配分では戻せない。経済は崩壊せず、働く人の余剰が働かない人を支える不完全雇用の均衡に落ち着く。自動化の下限、労働時間の短縮、新部門という代替案も論じる（抄録）。", "fun": "工場が機械化されて人が要らなくなっても、これまでは学校のように機械化しにくい仕事が増えて、人はそちらへ移れた。もしAIがどの仕事でも人より速く上達するなら、移る先がなくなる。この論文は、そのとき経済は壊れるのではなく、働く人の稼ぎが働かない人を支える形で落ち着く、と理論で示す。技術ができることと、制度がそれをどう扱うかを分けて考える点が面白い。", "unverified": "抄録の末尾が切れており、4つの通説の検討の内容は未確認。理論モデルによる議論で、本文は読めていない。"}}, {"id": "pr45", "rank": 45, "headline": "コミュニティ統治の欠如が利用者の離反を招く", "title": "How to achieve effective management of network communities? Absence of governance mechanisms, psychological contract breaches, and user behaviors", "url": "https://doi.org/10.21203/rs.3.rs-11396120/v1", "authors": "Haijian Wang ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Wang, H., Zhao, J., Cao, X., & Chen, Y. (2026). How to achieve effective management of network communities? Absence of governance mechanisms, psychological contract breaches, and user behaviors. https://doi.org/10.21203/rs.3.rs-11396120/v1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Research Square。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "オンラインコミュニティで統治の仕組みが欠けていると、利用者が「約束を破られた」と感じ、退会や否定的な口コミなどの行動につながることを示した（抄録）。", "p3": "心理的契約の違反の視点から、説明責任の仕組み、関係の規範、報奨の制度、運営の定例の欠如が、取引的な違反と関係的な違反を通じて利用者の行動に与える影響を分析し、媒介と、つながりの強さによる調整を検証した（抄録）。", "p5": "説明責任・関係の規範・報奨の欠如は取引的な違反を、関係の規範・報奨・定例の欠如は関係的な違反を引き起こした。どちらの違反も退会を促し、関係的な違反は否定的な口コミ、閲覧だけの利用、投稿行動にも結びついた。違反は部分的に媒介していた（抄録）。", "fun": "ネットの掲示板やファンの集まりには、はっきり書かれていなくても「ルール違反は正される」「貢献すれば認められる」という暗黙の期待がある。運営がそれに応えないと、利用者は約束を破られたと感じる。面白いのは、損得の期待が裏切られたときは去るだけだが、人間関係の期待が裏切られたときは悪い評判まで広める、という違いが出たことだ。", "unverified": "本文を読めていないため、調査の対象と規模、分析手法の詳細、効果の大きさは未確認。"}}, {"id": "pr46", "rank": 46, "headline": "地すべり危険度マップの整合性を作成者が監査", "title": "A Producer-Led Product-Consistency Audit of an AHP Landslide-Susceptibility Raster: A Philippine Road-Corridor Case Study", "url": "https://doi.org/10.20944/preprints202611.1305.v1", "authors": "Deryl Jhon Lucas", "venue": "Preprints.org", "date": "2026-11-12", "apa": "Lucas, D. J. (2026). A Producer-Led Product-Consistency Audit of an AHP Landslide-Susceptibility Raster: A Philippine Road-Corridor Case Study. https://doi.org/10.20944/preprints202611.1305.v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Preprints.org。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "階層分析法（AHP）で作った地すべり危険度のラスタについて、判断の整合性とは別に、地理情報の成果物として層どうしが矛盾していないかを作成者自身が点検する監査を行った（抄録）。", "p3": "フィリピン・パンガシナン州の22.14 kmの道路沿いの相対的な危険度指数について、ラスタの組と区分の整合、重ね合わせの再生成、要因の得点規則の整合という3つの関係を調べ、重みの感度も試した（抄録）。", "p5": "傾斜の得点で12セルの誤りが見つかり、直すと20セル（0.85%）の区分が変わった。斜面方位では2,357セルのうち1,167セル（49.51%）が、元データから作り直した面と採用した得点で食い違った。重みの感度試験では区分の一致率が平均75.43〜87.27%だった（抄録）。", "fun": "危険度マップは、専門家の判断に矛盾がないかを数値で確かめてから作る。しかしその検査に合格しても、地図のデータそのものが正しく組み立てられている保証にはならない。この研究は、自分たちで作った地図を自分たちで点検し、斜面の向きの層で約半分のマス目が食い違っていたことを見つけて公表した。原因はまだ分かっていない、と書いている点も正直である。", "unverified": "本文を読めていないため、食い違いの原因と、現地の地すべり記録との照合の有無は未確認（著者も独立の検証ではないと述べる）。"}}, {"id": "pr47", "rank": 47, "headline": "厚く硬い天盤の下で上部地層の破断と応力を模型実験", "title": "Simulation experimental study on fracture movement and stress evolution of overlying strata under thick hard roof", "url": "https://doi.org/10.21203/rs.3.rs-11456563/v1", "authors": "Chun Zhao ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Zhao, C., Li, B., Wa, Y., & Ma, Z. (2026). Simulation experimental study on fracture movement and stress evolution of overlying strata under thick hard roof. https://doi.org/10.21203/rs.3.rs-11456563/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Research Square。候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": true, "short": true, "p1": "厚くて硬い岩盤の天盤の下で石炭を掘り進めるときに、上の地層がどう割れ、応力がどう変わるかを相似材料の模型実験で調べ、事前に割れ目を入れて弱める対策の効果を示した（抄録）。", "p3": "中国貴州省の炭鉱の厚さ40 mの玄武岩の鍵層を原型に、弱めない天盤と、ボーリング孔からの事前の割裂で弱めた天盤の2条件の模型を作り、切羽の前進に伴う破断の特徴、亀裂の進展、応力分布を比べた（抄録）。", "p5": "弱めない場合、直接天盤の初回崩落の間隔は33 m、主天盤は55 m、周期的な崩落の間隔は17 mと30 mで、広い範囲が宙に浮いた。弱めた場合は切羽が10 m進むごとに事前の割れ目に沿って周期的に破断した。弱めない場合の炭層の鉛直応力の最大値は0.78 MPaだった（抄録）。", "fun": "硬い岩の天井は丈夫で安全に見えるが、掘り進めても落ちてこないぶん、あるとき広い範囲がいっぺんに崩れる。溝のない板チョコが大きな塊のまま割れるのに似ている。そこで前もって割れ目を入れておくと、少しずつ決まった場所で折れるようになる。相似材料で作った縮小模型でも、その違いがはっきり出たという実験である。", "unverified": "抄録の末尾が切れており、弱めた場合の応力の数値は未確認。本文を読めていないため、相似比と計測方法は未確認。"}}, {"id": "pr48", "rank": 48, "headline": "物理を組み込んだ時系列LLMで台風の波高を予測", "title": "Physics-Informed Time‑Series Large Language Model for Extreme Typhoon Wave Height Forecasting", "url": "https://doi.org/10.21203/rs.3.rs-11525261/v1", "authors": "Zhiguo He ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "He, Z., Zhao, Y., Han, D., Shen, H., Zhu, Y., Kong, X., & Li, L. (2026). Physics-Informed Time‑Series Large Language Model for Extreme Typhoon Wave Height Forecasting. https://doi.org/10.21203/rs.3.rs-11525261/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Research Square。候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": true, "short": true, "p1": "台風による沿岸の波の高さを、物理の制約を組み込んだ時系列の大規模言語モデル（TW-LLM）で予測する枠組みを作った（抄録）。", "p3": "Time-LLMをもとに、波の状態と環境の外力の依存関係を表す変数間の相互作用、領域知識を入れた構造化プロンプト、大きな値に重みを置くHuber損失に風の外力との整合と時間変化率の制約を加えた学習目的を導入した（抄録）。", "p5": "中国沿岸の11基のブイの毎時観測（2017〜2025年）で学習・評価し、短期（6時間先）の予測で二乗平均平方根誤差が約0.15 mだったと報告する（抄録）。", "fun": "台風の高波は、めったに起きないうえに急に大きくなるので、過去のデータから学ぶだけの方法は苦手とする。一方、物理法則にもとづく計算は時間がかかる。この研究は、文章を扱うAIの仕組みを時系列に転用し、そこに風の外力との整合や、波の高さの変わり方の制約といった物理の条件を学習に入れた。両者の長所を合わせようとする発想である。", "unverified": "抄録の末尾が切れており、長期の予測精度と他手法との比較は未確認。本文は読めていない。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "教科書2,118冊を構造つきの証明データに変換", "title": "Scaling Mathematical Proof Supervision from Structured Textbooks", "url": "https://arxiv.org/abs/2610.40394", "authors": "Youqing Fang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-12", "apa": "Fang, Y., Hua, Z., Tang, Y., Gu, Y., Kong, L., Liu, B., Zhang, W., Chen, K., Sun, Y., & Zhang, W. (2026). Scaling Mathematical Proof Supervision from Structured Textbooks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.40394", "why": "数学の教師データは問題と解答の対に平板化されがちで、教科書の章の順序や命題と証明のつながりが失われる。大学数学の中核分野の教科書2,118冊を、章順・命題と証明の対応・依存関係・出典を保った約38万件の証明の教師データ（TOME-Math）に変換した。全量で微調整すると、保留した評価と公開ベンチマークの平均得点が基準モデルより16.7ポイント上がり、比較した3つの公開データを上回ったと報告する。", "explain": {"basis": "本文", "basis_note": "arXivのHTML版の本文のうち、要旨、データ構築（§3.1）、評価の設定と全体比較（§4.1〜4.2）、教程順の学習（§5.2）、切除実験の要約（§5.4）、結論（§6）を読んだ。付録は未読", "preprint": true, "p1": "大学数学の教科書2,118冊を、章の順序、命題と証明の対応、依存関係、出典を保ったまま380,292件の証明の教師データ（TOME-Math）に変換し、この構造を使った学習が数学の証明の力を高めることを示した（要旨、§3.1、§6）。未査読のプレプリント。", "p2": "言語モデル向けの数学の教師データは、ふつう独立した問題と解答の対に平板化され、元の資料が持つ教程の順序や、どの命題がどの命題に依拠するかという証拠の構造が捨てられていた（要旨）。", "p3": "教科書のPDFをOCRでMark
