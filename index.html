ng framework for a GNSS disciplined OCXO with disturbed particle swarm optimization. Measurement, 123586. https://doi.org/10.1016/j.measurement.2026.123586", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも入手できず）", "preprint": false, "short": true, "p1": "題名からは、GNSSで律した恒温槽付き水晶発振器（OCXO）の時刻保持の枠組みを、撹乱を入れた粒子群最適化で設計した研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "衛星の時刻信号は正確ですが、トンネルなどで途切れることがあります。そのあいだも、手元の水晶時計で正確な時刻を保ち続ける必要があります。題名からは、衛星で時計を合わせる仕組みの調整を、群れで餌を探す鳥をまねた最適化で行っていることが読み取れます。", "unverified": "題名のみで、手法・結果はすべて未確認。"}}, {"id": "jr38", "rank": 38, "headline": "類似度を弱めて異常の反実仮想説明を作る", "title": "Counterfactual Explanations for Anomaly via Similarity Weakening", "url": "https://doi.org/10.1109/tsmc.2026.3739724", "authors": "Peng Zhou ほか", "venue": "IEEE Transactions on Systems, Man, and Cybernetics: Systems", "date": "2026-10-15", "sjr": 2.806, "citescore": 17.8, "citescore_year": "2025", "apa": "Zhou, P., Chen, M., Zhu, Y., Chen, J., Zhao, S., & Wu, X. (2026). Counterfactual Explanations for Anomaly via Similarity Weakening. IEEE Transactions on Systems, Man, and Cybernetics: Systems, 1–14. https://doi.org/10.1109/tsmc.2026.3739724", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも入手できず）", "preprint": false, "short": true, "p1": "題名からは、正常なデータとの類似度を弱めることで、異常と判定されたデータの反実仮想説明を作る手法の研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "AIが「これは異常です」と言ったとき、「どこが違えば正常だったのか」を示せると、人は納得しやすくなります。題名からは、正常なものとの似かたを調整することで、その説明を作ろうとしていることが読み取れます。異常の「理由」を見せる工夫です。", "unverified": "題名のみで、手法・結果はすべて未確認。"}}, {"id": "jr39", "rank": 39, "headline": "政策不確実性下で経営者報酬は利益調整を抑えるか", "title": "Executive incentives and earnings management under economic policy uncertainty", "url": "https://doi.org/10.1080/13504851.2026.2749675", "authors": "Na-Youn Kim", "venue": "Applied Economics Letters", "date": "2026-10-14", "citescore": 3.2, "citescore_year": "2025", "apa": "Kim, N.-Y. (2026). Executive incentives and earnings management under economic policy uncertainty. Applied Economics Letters, 1–6. https://doi.org/10.1080/13504851.2026.2749675", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用", "preprint": false, "short": true, "p1": "韓国企業（2003〜2025年）で、経済政策の不確実性が利益調整を促す一方、株価に連動する経営者報酬（デルタ）がそれを和らげることを示した（抄録）。", "p3": "経済政策不確実性（EPU）の指標と利益調整の関係を推定し、CEOのストックオプション由来のインセンティブ（デルタ）の高低で差を見る。", "p5": "EPUが高いほど利益調整が増えるが、その関連はデルタの高いCEOで有意に弱まり、デルタが不確実性による報告の歪みへの大きな緩衝になることを示した（抄録。係数は抄録になし）。", "fun": "先行きが不透明になると、経営者は決算の数字をよく見せたくなります。でも、自分の報酬が会社の株価と強く結びついていると、その誘惑が弱まりました。報酬の仕組みが、嵐の中でも数字の正直さを守る「錨」の役割を果たしているという話です。", "unverified": "標本の規模と利益調整の測り方は未確認。"}}, {"id": "jr40", "rank": 40, "headline": "金融サービスの苦情対応遅延を予測し優先順位付け", "title": "Customer complaint analytics in digital financial services: temporal prediction of untimely responses and capacity-aware prioritization", "url": "https://doi.org/10.1186/s43093-026-01021-2", "authors": "Jinho Cha ほか", "venue": "Future Business Journal", "date": "2026-10-16", "apa": "Cha, J., Vu, L. T., Nguyen, T.-T., & Pham, L. (2026). Customer complaint analytics in digital financial services: temporal prediction of untimely responses and capacity-aware prioritization. Future Business Journal, 12(1). https://doi.org/10.1186/s43093-026-01021-2", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "米消費者金融保護局（CFPB）の苦情記録で、企業の回答が遅れるかを予測し、審査能力が限られるときの苦情の優先順位付けの枠組みを作った（抄録）。", "p3": "2024年1月〜2026年4月の266,337件の苦情を使い、2024〜2025年は3つの時間ブロックで検証し、2026年1〜4月を手を付けない最終検証に取っておく。構造化属性、疎な語彙特徴、固定の意味埋め込みを比べる。", "p5": "顧客の離反ではなく、受付後に独立に観察される「回答の遅れ」を予測の対象にした点を強調する（抄録。予測精度の値は抄録の取得範囲になし）。", "fun": "苦情が多すぎて全部を丁寧に読めないとき、どれから手を付けるべきでしょうか。この研究は、「この苦情は対応が遅れそうだ」と予測して先に回す方法を作りました。予測の正解に、顧客の気持ちではなく実際の対応記録を使った点が、結果の信頼性を高めています。", "unverified": "予測精度と優先順位付けの効果は未確認。"}}, {"id": "jr41", "rank": 41, "headline": "高齢の販売員の職場包摂とエウダイモニックな幸福", "title": "Understanding ”Silver Sellers”: Workplace Social Inclusion, Eudaimonic Well-Being, and Sales Outcomes", "url": "https://doi.org/10.1080/10696679.2026.2747024", "authors": "Silvio Cardinali ほか", "venue": "Journal of Marketing Theory and Practice", "date": "2026-10-16", "citescore": 12.8, "citescore_year": "2025", "apa": "Cardinali, S., Romoli, A., & Severini, S. (2026). Understanding ”Silver Sellers”: Workplace Social Inclusion, Eudaimonic Well-Being, and Sales Outcomes. Journal of Marketing Theory and Practice, 1–27. https://doi.org/10.1080/10696679.2026.2747024", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも入手できず）", "preprint": false, "short": true, "p1": "題名からは、高齢の販売員（シルバーセラーズ）について、職場での社会的包摂、エウダイモニックな（生きがいとしての）幸福、販売成果の関係を調べた研究と読み取れる。掲載誌はJournal of Marketing Theory and Practice。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "高齢になっても販売の仕事を続ける人は増えています。職場の仲間として受け入れられている感覚が、生きがいを高め、さらに売上にもつながるのか。題名からは、包摂と幸福と成果を一本の線で結ぼうとする問いが読み取れます。", "unverified": "題名のみで、手法・結果はすべて未確認。"}}, {"id": "jr42", "rank": 42, "headline": "強制のないつながり：日本の農村の地域の幸福", "title": "Connection Without Compulsion: Community Well-Being in Rural Japan", "url": "https://doi.org/10.33160/yam.2026.11.005", "authors": "Daisuke Son ほか", "venue": "Yonago Acta Medica", "date": "2026-10-15", "citescore": 1.5, "citescore_year": "2025", "apa": "Son, D., Taniguchi, S.-i., Inoue, K., Naka, T., & Sunami, N. (2026). Connection Without Compulsion: Community Well-Being in Rural Japan. Yonago Acta Medica. https://doi.org/10.33160/yam.2026.11.005", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも入手できず）", "preprint": false, "short": true, "p1": "題名からは、日本の農村で、強制を伴わないつながり（「つながりはあるが縛られない」関係）と地域のウェルビーイングの関係を論じた研究と読み取れる。掲載誌はYonago Acta Medica。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "田舎の近所づきあいは、助け合いの力になる一方で、息苦しさの原因にもなります。題名の「強制のないつながり」からは、縛られずにつながる関係こそが地域の幸せを支えるのではないか、という問いが読み取れます。", "unverified": "題名のみで、手法・結果はすべて未確認。"}}, {"id": "jr43", "rank": 43, "headline": "技術介入は高齢者の孤立と抑うつを減らすか", "title": "Technology-based interventions for social isolation and depression in older adults: Observational and quasi-experimental analysis", "url": "https://doi.org/10.1016/j.gerinurse.2026.104371", "authors": "Barbara Gomez Peña ほか", "venue": "Geriatric Nursing", "date": "2026-10-14", "citescore": 3.5, "citescore_year": "2025", "apa": "Gomez Peña, B., Alcalde-Llergo, J. M., Uclés-Torrente, M. d. M., Taborri, J., Yeguas-Bolívar, E., & Aparicio-Martínez, P. (2026). Technology-based interventions for social isolation and depression in older adults: Observational and quasi-experimental analysis. Geriatric Nursing, 74, 104371. https://doi.org/10.1016/j.gerinurse.2026.104371", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用", "preprint": false, "short": true, "p1": "60歳以上の成人で孤独と抑うつを測り、仮想現実（VR）と看護師による電話フォローを組み合わせた技術的な介入の効果を評価した（抄録）。", "p3": "2段階の研究で、まず検証済みの調査票による観察研究（n=248）を行い、次に「技術と健康」のワークショップを実施して、実験群にVRと構造化された看護師の電話フォローを組み合わせた介入を行う準実験。", "p5": "女性、独居、高齢であることが、孤独と抑うつ症状の高さと関連した（抄録。介入効果の結果は抄録の取得範囲になし）。", "fun": "ひとり暮らしのお年寄りの孤独を、仮想現実の体験と看護師さんからの電話で和らげられるかを試した研究です。最新技術と人の声かけを組み合わせているのがポイントで、技術だけでなく人とのつながりも一緒に届ける発想です。", "unverified": "介入の効果の結果は未確認。"}}, {"id": "jr44", "rank": 44, "headline": "地域財団の助成に見る代表的官僚制と人種", "title": "Representative Bureaucracy in Private Philanthropy: Testing Discretion and Racial Representation in Community Foundation Grantmaking", "url": "https://doi.org/10.1177/02750740261498874", "authors": "Yue Ming", "venue": "American Review of Public Administration", "date": "2026-10-16", "sjr": 1.221, "citescore": 4.7, "citescore_year": "2025", "apa": "Ming, Y. (2026). Representative Bureaucracy in Private Philanthropy: Testing Discretion and Racial Representation in Community Foundation Grantmaking. The American Review of Public Administration. https://doi.org/10.1177/02750740261498874", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "代表的官僚制の理論を民間の慈善に広げ、米国の地域財団912団体（2012〜2016年）で、指導層の人種的な代表性が有色人種のコミュニティへの助成を増やすかを検証した（抄録）。", "p3": "縦断データで、指導層の人種的な代表性と、有色人種のコミュニティに奉仕する団体への助成の関係を推定し、指導層の裁量と寄付者の統制（とくに寄付者助言基金）による違いを見る。", "p5": "指導層が十分な裁量を持つとき、代表性は有色人種のコミュニティへの助成の増加と対応したが、寄付者の統制が強まると関係は弱まった。裁量が受動的代表と能動的代表を結ぶという理論と整合した（抄録）。", "fun": "組織のトップに多様な人がいれば、お金の配り方も公平になるのでしょうか。答えは「その人が自由に決められるなら」でした。寄付者が使い道を細かく指定するほど、トップの多様性の効果は薄れます。代表を送り込むだけでなく、決める権限も大事だという話です。", "unverified": "効果の大きさの値は未確認。"}}, {"id": "jr45", "rank": 45, "headline": "透析クリニックの患者の流れと職務設計", "title": "Dialysis Clinic Patient Flow and Work Design", "url": "https://doi.org/10.1287/msom.2025.0719", "authors": "Vincent Slaugh ほか", "venue": "Manufacturing and Service Operations Management", "date": "2026-10-16", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "apa": "Slaugh, V., & Cire, A. A. (2026). Dialysis Clinic Patient Flow and Work Design. Manufacturing & Service Operations Management. https://doi.org/10.1287/msom.2025.0719", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "米国の透析クリニックで、患者の流れと技術者（PCT）の仕事の割り振りを同時に設計し、全体の完了時間を短くし、労働効率を上げる方法を示した（抄録）。", "p3": "技術者と台が空き次第に開始する現行の「プッシュ」方式に対し、開始と終了の作業をずらす「インターレース」方式と、開始担当と終了担当の2人で2倍の台を受け持つ「タンデム」方式を提案し、治療時間一定のもとで完了時間の閉形式を導く。", "p5": "インターレース方式が最短の完了時間を達成し、タンデム方式は労働を減らしうることを示した（抄録。数値は抄録の取得範囲になし）。背景として、米国の透析患者は43.3万人、外来クリニックは約7,600、治療費は年250億ドル超とされる。", "fun": "透析では、治療の始めと終わりに技術者の手作業が集中し、それが重なると現場は大忙しになります。この研究は、作業の順番を少しずらしたり、始め担当と終わり担当に分けたりするだけで、待ち時間と疲労を減らせることを数式で示しました。工場の流れ作業の知恵を病院に生かした例です。", "unverified": "実際のクリニックでの検証結果は未確認。"}}, {"id": "jr46", "rank": 46, "headline": "デジタルな職場ウェルビーイング施策の従業員体験", "title": "Employee experiences of digital workplace well-being programmes: A qualitative meta-synthesis", "url": "https://doi.org/10.5502/ijw.v16i3.5549", "authors": "Louise Cowpertwait ほか", "venue": "International Journal of Wellbeing", "date": "2026-10-16", "sjr": 1.036, "citescore": 4.7, "citescore_year": "2025", "apa": "Cowpertwait, L., Sandham, M., Arrowsmith, K., Nichols-Boyd, M., & Jarden, R. (2026). Employee experiences of digital workplace well-being programmes: A qualitative meta-synthesis. International Journal of Wellbeing, 16(3), 1–49. https://doi.org/10.5502/ijw.v16i3.5549", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "デジタルな職場のウェルビーイング施策を従業員がどう経験したかを、29本の文献の質的メタ統合で整理した（抄録）。", "p3": "Scopus、MEDLINE、PsycINFO、ProQuestの検索で29の文献を特定し、テーマを統合する。", "p5": "「価値がある」「使いやすさ」「恥とスティグマ」「文脈的要因」「不十分で逆効果」の5つのテーマが得られ、技術受容モデルの領域と対応した。既存の一次研究の質が低く、方法の厳密さと透明な報告が必要とした（抄録）。", "fun": "会社が用意した心の健康アプリは、ありがたい一方で「使っていると弱い人だと思われそう」という恥ずかしさも生みます。この研究は、そうした本音を集め、良かれと思った施策が逆効果になる場合もあることを示しました。", "unverified": "なし"}}, {"id": "jr47", "rank": 47, "headline": "検索データで米国の人口移動を予測する", "title": "Predicting U.S. migration flows with online search data", "url": "https://doi.org/10.1177/00420980261493801", "authors": "Jaeyong Yoo ほか", "venue": "Urban Studies", "date": "2026-10-16", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "apa": "Yoo, J., & Babiarz, P. (2026). Predicting U.S. migration flows with online search data. Urban Studies. https://doi.org/10.1177/00420980261493801", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "Googleトレンドの検索データが、米国の州間の人口移動の予測を改善するかを検証した（抄録）。", "p3": "内国歳入庁の州間移動の記録と、全50州とワシントンDCのGoogleトレンドのデータ（2004〜2018年）で、一方向の転出と出発地-到着地の双方向の流れの重力型パネルモデルを推定する。", "p5": "移動に関連する検索の強さはその後の移動の流れと関連し、従来の重力モデルの共変量と固定効果を超えて予測性能を改善した。検索データは公式統計を置き換えないが、時宜を得た補完になるとした（抄録）。", "fun": "引っ越しを考える人は、まず移り先の仕事や家賃や学校をネットで検索します。その検索の量を集めれば、実際の引っ越しが統計に出る前に、人の流れを先読みできるかもしれません。人の「下調べ」の跡が、社会の変化の早期警報になるという発想です。", "unverified": "予測の改善の大きさは未確認。"}}, {"id": "jr48", "rank": 48, "headline": "生成AIとAI研修は教員の授業準備を変えるか", "title": "Can AI help teachers? Experimental evidence on the effects of generative AI use and AI training on teachers’ lesson preparation", "url": "https://doi.org/10.1016/j.caeo.2026.100427", "authors": "Philipp Appel ほか", "venue": "Computers and Education Open", "date": "2026-10-15", "sjr": 2.903, "citescore": 16.9, "citescore_year": "2025", "apa": "Appel, P., Fervers, L., & Piepenburg, J. G. (2026). Can AI help teachers? Experimental evidence on the effects of generative AI use and AI training on teachers’ lesson preparation. Computers and Education Open, 100427. https://doi.org/10.1016/j.caeo.2026.100427", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも入手できず）", "preprint": false, "short": true, "p1": "題名からは、生成AIの利用とAIの研修が教員の授業準備に与える効果を、実験によって検証した研究と読み取れる。掲載誌はComputers and Education Open。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "先生たちは授業の準備に多くの時間を使っています。AIを使えば楽になるのか、それとも使い方の研修が必要なのか。題名からは、「AIを渡すこと」と「使い方を教えること」の効果を、実験で分けて確かめようとしていることが読み取れます。", "unverified": "題名のみで、手法・結果はすべて未確認。"}}, {"id": "jr49", "rank": 49, "headline": "職場の生成AIがもたらす技能の変容と緊張", "title": "Navigating GenAI in the workplace: skills transformation & tension", "url": "https://doi.org/10.1080/1369118x.2026.2736814", "authors": "Simin Michelle Chen ほか", "venue": "Information Communication and Society", "date": "2026-10-16", "sjr": 1.793, "citescore": 10.4, "citescore_year": "2025", "apa": "Chen, S. M., & Cassidy, K. J. (2026). Navigating GenAI in the workplace: skills transformation & tension. Information, Communication & Society, 1–18. https://doi.org/10.1080/1369118x.2026.2736814", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも入手できず）", "preprint": false, "short": true, "p1": "題名からは、職場に生成AIが入ることで起きる技能の変容と、それに伴う緊張を扱った研究と読み取れる。掲載誌はInformation, Communication & Society。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "生成AIが職場に入ると、必要とされる技能が変わり、ベテランの経験が急に役立たなくなることもあります。題名の「緊張」からは、新しい技能への期待と、これまでの働き方とのあつれきの両方に目を向けていることが読み取れます。", "unverified": "題名のみで、手法・結果はすべて未確認。"}}, {"id": "jr50", "rank": 50, "headline": "ウェアラブルで独居高齢者の孤独を見つけられるか", "title": "Feasibility of Using a Wearable Device to Identify Loneliness Among Older Adults Living Alone: Mixed Methods Study", "url": "https://doi.org/10.2196/94027", "authors": "Rajna Ogrin ほか", "venue": "JMIR Formative Research", "date": "2026-10-15", "citescore": 4.2, "citescore_year": "2025", "apa": "Ogrin, R., Johnstone, G., Crammond, B. R., & Lowthian, J. A. (2026). Feasibility of Using a Wearable Device to Identify Loneliness Among Older Adults Living Alone: Mixed Methods Study. JMIR Formative Research, 10, e94027–e94027. https://doi.org/10.2196/94027", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用（JMIR Formative Research）", "preprint": false, "short": true, "p1": "独居の高齢者が会話した時間を記録する装着型デバイス（CaT Pin）で孤独を捉えられるかについて、実現可能性と受容性を混合研究法で評価した（抄録）。", "p3": "第1段階で当事者の助言グループとの議論と3人による1週間の試作試験を行い改良し、第2段階で65歳以上の独居の地域住民が2週間装着し、孤独・活動・装着・会話の記録をつける。", "p5": "デバイス由来の会話データと自己申告の孤独のデータが十分に得られるかを評価した（抄録。結果の数値は抄録の取得範囲になし）。", "fun": "「今日は誰かと話したか」は、孤独を知る大事な手がかりです。胸に付ける小さな装置で会話の時間を自動で記録すれば、本人が言い出しにくい孤独に気づけるかもしれません。まず「ちゃんと使ってもらえるか」から確かめている、慎重な第一歩の研究です。", "unverified": "第2段階の参加者数と結果は未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "政治学", "headline": "気候への関心は天気より政治的立場で決まる", "title": "Political affiliation impacts climate attention and choice beyond extreme weather exposure", "url": "https://doi.org/10.1038/s41558-026-02765-z", "authors": "Annika M. Wyss ほか", "venue": "Nature Climate Change", "date": "2026-10-16", "sjr": 7.978, "citescore": 39.0, "citescore_year": "2025", "apa": "Wyss, A. M., Guizar Rosales, E. T., Schulte-Mecklenbeck, M., Buchs, J., Hahnel, U. J. J., & Knoch, D. (2026). Political affiliation impacts climate attention and choice beyond extreme weather exposure. Nature Climate Change. https://doi.org/10.1038/s41558-026-02765-z", "why": "登録報告形式で、極端気象への曝露と党派性のどちらが気候への注意と選択を動かすかを検証し、党派性の効果が大きいことを示した。", "explain": {"basis": "本文", "basis_note": "Nature Climate Changeの本文（結果の各節、考察と限界、方法のCETの説明）を読んだ。補足資料は読んでいない", "preprint": false, "p1": "事前登録した登録報告（Registered Report）で、米国の1,451人について、気候に関わる情報への注意と選択が、政党支持では大きく違う一方、客観的な極端気象への曝露では変わらず、極端気象を気候変動のせいだと主観的に考えるかどうかが効くことを示した。", "p2": "政治的な分極化と極端気象の増加は気候変動への関与を左右しうるが、その背後の心理的な仕組み、とくに情報の探し方の段階で何が起きているかは分かっていなかった（抄録）。", "p3": "実際の炭素排出を伴う謝礼付きの意思決定課題（CETの新版）で、参加者は30試行、ボーナスと炭素排出の異なる2択を選び、マウスでボックスを開いて情報を見る（MouselabWEB）。注視時間で炭素情報への注意（ΔDuration）を測り、郡単位の客観的な極端気象の記録と結びつける（方法）。", "p4": "政党支持（H1）、極端気象の曝露による調整（H2）、主観的な帰属（H3）の事前登録した仮説を、混合効果モデルで検定する。統制変数の追加、全標本、曝露の期間（1〜12か月）や種類を変えた感度分析も行う（結果）。", "p5": "民主党支持者は共和党支持者より炭素情報に相対的に長く注意し（b=0.08、95%CI 0.04〜0.12）、気候に良い選択をしやすかった（OR=2.06）。共和党支持者のほうが調査期間中に極端気象を経験した割合はやや高かった（48.2%対43.4%）が、客観的な曝露は党派差を調整しなかった。極端気象を気候変動に帰属する人ほど炭素情報への注意と気候に良い選択が多く、帰属は曝露の効果を調整した（結果、図2）。", "p6": "事前登録した品質基準による除外で当初の標本の約4分の1が除かれ、一般化を制約しうるが、全標本の感度分析でも結論は同様だったと著者は述べる（考察）。H3の3者の交互作用はほとんど支持されなかった。", "fun": "大雨や猛暑を経験すれば、気候変動を気にするようになるはずだと考えがちです。ところが実際の天気の記録と照らすと、経験そのものは人の行動を変えていませんでした。変えたのは「これは気候変動のせいだ」と受け取るかどうかでした。同じ出来事も、解釈しだいで意味が変わるのです。", "unverified": "補足資料の感度分析の数値は未確認。"}}, {"id": "jn02", "rank": 2, "field": "因果推論", "headline": "操作変数なしで欠落変数バイアスを補正する新手法", "title": "EXPRESS: Correcting omitted-variable bias without instruments: An ICA-based alternative to Gaussian copula methods", "url": "https://doi.org/10.1177/00222437261499336", "authors": "Rouven E. Haschka ほか", "venue": "Journal of Marketing Research", "date": "2026-10-16", "sjr": 7.363, "citescore": 11.0, "citescore_year": "2025", "apa": "Haschka, R. E., & Dost, F. (2026). EXPRESS: Correcting omitted-variable bias without instruments: An ICA-based alternative to Gaussian copula methods. Journal of Marketing Research. https://doi.org/10.1177/00222437261499336", "why": "マーケティング実証で広く使われるガウスコピュラ法の弱点を、独立成分分析に基づく方法で克服する提案で、操作変数のない状況の識別に影響しうる。", "explain": {"basis": "抄録", "basis_note": "出版社の早期公開版の抄録（Crossref経由、Journal of Marketing Research）を使用。本文は入手できず", "preprint": false, "p1": "欠落変数による内生性を、操作変数なしで補正する方法として、独立成分分析（ICA）で「欠落変数の和」にあたる正規分布の潜在成分を内生的な説明変数から取り除く推定量を提案し、識別と漸近的性質を証明した。", "p2": "マーケティング研究ではガウスコピュラ制御関数（GCCF）が欠落変数バイアスの補正に多用されるが、GCCFは説明変数と誤差の非線形な関係を必要とする。教科書が想定する欠落変数との線形・加法的な関係のもとでは、GCCFは偏ることを著者は証明する（抄録）。", "p3": "内生的な説明変数と誤差の両方に加法的に効く正規分布の潜在成分を仮定する。直観：多くの欠落変数の和は中心極限定理により正規分布に近づく。ICAでこの成分を識別して説明変数から取り除き、内生性のない回帰にする（抄録）。", "p4": "モデルが欠落変数による内生性のもとでも点識別されること、推定量の一致性と漸近正規性、ジャックナイフ再標本化による標準誤差の妥当性を理論的に示す（抄録。シミュレーションや実証の有無は本文未確認）。", "p5": "古典的な欠落変数の設定でGCCFが偏ることを証明し、GCCFを使った既存論文の記述にも線形の関係を暗に仮定する言い回しがあり、GCCFの使用を無効にしていると指摘した。提案法は点識別され、一致かつ漸近正規であることを示した（抄録）。", "p6": "潜在成分が正規分布であるという仮定が要で、欠落変数が少数で正規から遠い場合の性能は抄録からは分からない（解釈）。ICAによる識別には他の成分の非正規性が必要と考えられるが、その条件は本文で確認が必要。", "fun": "「広告を増やすと売上が伸びる」と分析しても、測っていない要因（たとえば景気）が両方に効いていれば結論は狂います。この研究は、測っていない要因がたくさんあれば、その合計は釣鐘型の分布になるという統計の法則を逆手にとり、その「影」を取り除く方法を作りました。", "unverified": "シミュレーションや実データでの検証の有無と結果は未確認。"}}, {"id": "jn03", "rank": 3, "field": "機械学習", "headline": "非定常な力学の転換点を関数空間で予測する", "title": "Tipping point forecasting in nonstationary dynamics on function spaces", "url": "https://doi.org/10.1073/pnas.2600331123", "authors": "Miguel Liu-Schiaffini ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-15", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Liu-Schiaffini, M., Singer, C. E., Kovachki, N., Leung, S. C., Bae, H. J., Azizzadenesheli, K., & Anandkumar, A. (2026). Tipping point forecasting in nonstationary dynamics on function spaces. Proceedings of the National Academy of Sciences, 123(42). https://doi.org/10.1073/pnas.2600331123", "why": "気候などで起こる不可逆な転換点を、非定常・カオス的な系で事前に予測する枠組みをPNASで示した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由、PNAS）を使用。本文は入手できず", "preprint": false, "p1": "非定常・カオス的な力学系の転換点（tipping point）を、転換前のデータだけで学習した再帰型ニューラル作用素と、物理制約からのずれを監視するコンフォーマル予測で、不確実性の保証付きで予測する枠組みを示した。", "p2": "転換点は急激で不可逆な変化で、たとえば温室効果ガスの増加による低層雲の急減が予測されている。転換を経験する前のデータだけから、将来の転換を確かな不確実性とともに予測するのは難しかった（抄録）。", "p3": "関数空間の間の写像を学ぶ再帰型ニューラル作用素（RNO）で非定常な力学を学習する。保存量や偏微分方程式などの物理制約からのずれを監視し、コンフォーマル予測で、転換点を厳密な不確実性の尺度とともに予測する（抄録）。", "p4": "非定常なLorenz-63とKuramoto–Sivashinsky方程式、層積雲の気候の転換点、翼の後流と失速の遷移に適用し、支配方程式の知識が限られる場合も検証する（抄録）。", "p5": "翼の失速では、異なるレイノルズ数のもとで複数の将来の転換点を、追加学習なし（ゼロショット）で予測できた。部分的・近似的な物理制約でも将来の転換点を正確に予測できることを示した（抄録。数値は抄録になし）。", "p6": "どの程度の物理制約の不正確さまで許容できるか、実際の観測データでの検証の範囲は抄録からは分からない（解釈）。", "fun": "気候や流れには、ある日突然がらりと変わる「転換点」があります。でも、まだ起きていない変化をデータから学ぶことはできません。この研究は、AIが物理の決まりからずれ始める瞬間を見張ることで、転換を事前に察知しようとします。AIの「違和感」を警報に変える発想です。", "unverified": "予測の精度や先行時間の数値は未確認。"}}, {"id": "jn04", "rank": 4, "field": "組織行動・心理的安全性", "headline": "CEOの社会的発言に投資家は意図を読み取って反応", "title": "CEO Ideologically (In)Congruent Activism and Investor Reactions: An Attribution of CEO Intentions Perspective", "url": "https://doi.org/10.1111/joms.70175", "authors": "Miao Yun ほか", "venue": "Journal of Management Studies", "date": "2026-10-16", "sjr": 5.178, "citescore": 14.7, "citescore_year": "2025", "apa": "Yun, M., & Fu, L. (2026). CEO Ideologically (In)Congruent Activism and Investor Reactions: An Attribution of CEO Intentions Perspective. Journal of Management Studies. https://doi.org/10.1111/joms.70175", "why": "CEOの社会政治的アクティビズムが自社のイデオロギーと一致するかどうかで、投資家の意図の帰属と反応が変わることを示した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由、Journal of Management Studies）を使用。本文は入手できず", "preprint": false, "p1": "CEOが自分のイデオロギーと一致しない社会政治的な主張（不一致のアクティビズム）をすると、投資家はそれを個人の信念より会社のための行動と帰属し、より肯定的に反応することを、S&P 500企業の2012〜2021年の事例で示した。", "p2": "争点のある社会政治的な問題でCEOが立場を表明する例は増えているが、それを見た投資家がCEOの意図をどう見分け、判断と反応を形づくるかは分かっていなかった（抄録）。", "p3": "CEOのアクティビズムが個人の信念の表明にすぎないという仮定を緩め、イデオロギーと一致・不一致のアクティビズムという概念を提案し、意図の帰属の枠組みで投資家の評価と反応を説明する（抄録）。", "p4": "S&P 500企業のCEOアクティビズムの事例で、不一致のアクティビズムへの投資家の反応と、CEOの持株比率とCSR評価による調整効果を検証する（抄録。反応の測り方は本文未確認）。", "p5": "不一致のアクティビズムは投資家のより肯定的な反応と結びつき、その効果はCEOの持株比率が高いと強まり、企業のCSR評価が高いと弱まった（抄録。効果量は抄録になし）。", "p6": "CEOのイデオロギーの測り方と、意図の帰属を直接測ったかどうかは抄録からは分からない（解釈）。米国の大企業に限られる。", "fun": "社長が自分の信条とは違う立場で社会問題に発言すると、投資家は「これは個人の思いではなく、会社のための判断だ」と受け取り、むしろ好意的に反応しました。同じ発言でも、誰がどんな背景で言ったかで受け取られ方が変わる、という人間らしい読み取りが見えてきます。", "unverified": "イデオロギーの測定方法と効果の大きさは未確認。"}}, {"id": "jn05", "rank": 5, "field": "経済学", "headline": "脱炭素で各国の資産はどう再配分されるか", "title": "Quantifying assets for the geopolitics of climate change mitigation", "url": "https://doi.org/10.1038/s41893-026-01971-z", "authors": "Guanna Pan ほか", "venue": "Nature Sustainability", "date": "2026-10-15", "sjr": 7.896, "citescore": 44.1, "citescore_year": "2025", "apa": "Pan, G., Kornek, U., Gong, C. C., Molina Bacca, E. J., Luderer, G., & Edenhofer, O. (2026). Quantifying assets for the geopolitics of climate change mitigation. Nature Sustainability. https://doi.org/10.1038/s41893-026-01971-z", "why": "169か国の気候関連資産を4つの次元で定量化し、低炭素移行が生む地政学的な勝者と敗者を描いた。", "explain": {"basis": "本文", "basis_note": "Nature SustainabilityのPDF本文（序論、4つの資産の説明、クラスタ分析と表1、考察の限界の部分）を読んだ。数値の表と補足資料は一部のみ", "preprint": false, "p1": "169か国について、化石燃料の生産、回避される気候被害、再生可能エネルギーの潜在力、土地の炭素吸収能力という4つの気候関連資産が、野心的な脱炭素でどう増減するかを定量化し、国のクラスタと国どうしの類似性から気候政策の地政学を描いた。", "p2": "脱炭素は人類全体に利益をもたらすが、利益と損失は国ごとに異なり、利害の違いが国際協力の障害になりうる。既存研究は指標を個別に推計しており、複数の資産を共通の枠組みで国別にまとめたデータはほとんどなかった（序論）。", "p3": "統合評価モデル（IAM）、気候予測、経済被害関数、生物圏のデータを組み合わせ、複数の削減シナリオでの資産の変化を累積GDP比（3%で割引）で表す。4つの主要指標でk平均法によりクラスタに分け、階層クラスタリングで頑健性を確かめる（本文）。", "p4": "化石燃料依存（FFE）、回避被害の大きい国、炭素吸収や再エネの資産が大きい国、影響が中程度の国（MIE）などのクラスタの、GDP・人口・温室効果ガス排出の世界シェアと政策の野心度を比べる（表1）。", "p5": "階層クラスタリングは169か国中146か国でk平均法と一致し、不一致の多くは境界付近の国だった。化石燃料依存の19か国は化石燃料の地代の大きな損失を共有し、政策の野心度も最低だったが、世界GDPに占める割合は小さかった。米国・EU・中国は相対的に中程度の影響にとどまり、最大の経済大国が資産面で最も強い気候行動の動機を持つとは限らないことが示された（本文、抄録）。", "p6": "他国での化石燃料事業の利益を含めておらず、海外に権益を持つ国の影響を過小評価しうる。モデルの構造・データ・仮定の違いによる長期予測の不確実性を中央値は捉えない。倫理・ガバナンス・社会経済の要因は今後の統合が必要と著者は述べる（考察、抄録）。", "fun": "脱炭素で得をする国と損をする国はどこでしょうか。石油が売れなくなる国、温暖化の被害を免れる国、太陽や風が豊かな国、森が二酸化炭素を吸ってくれる国。4つの物差しで世界を仕分けると、米国・中国・EUといった大国は意外にも損得が中くらいで、強く動く理由が乏しいことが見えてきました。", "unverified": "国別の数値と、各クラスタの国の一覧は未確認。"}}, {"id": "jn06", "rank": 6, "field": "経営学", "headline": "なぜ製品は似通うのか：広告が差別化を弱める", "title": "EXPRESS: Why are products so similar despite diverse consumer needs? The interplay between advertising and horizontal product differentiation", "url": "https://doi.org/10.1177/00222437261500395", "authors": "Amit Pazgal ほか", "venue": "Journal of Marketing Research", "date": "2026-10-16", "sjr": 7.363, "citescore": 11.0, "citescore_year": "2025", "apa": "Pazgal, A., Soberman, D., & Thomadsen, R. (2026). EXPRESS: Why are products so similar despite diverse consumer needs? The interplay between advertising and horizontal product differentiation. Journal of Marketing Research. https://doi.org/10.1177/00222437261500395", "why": "消費者の多様なニーズにもかかわらず製品が似る理由を、広告が価格競争を和らげる仕組みとして理論的に説明した。", "explain": {"basis": "抄録", "basis_note": "出版社の早期公開版の抄録（Crossref経由、Journal of Marketing Research）を使用。本文は入手できず", "preprint": false, "p1": "消費者のニーズが多様なのに製品が似通う理由を、企業が広告を控えることで価格競争を和らげ、製品の差別化を省けるという理論で説明した。", "p2": "企業は標準的な価格競争のモデルが予測するほど差別化していないことが多いが、そのずれの理由は十分に説明されていなかった（抄録）。", "p3": "企業が立地（製品の位置）、情報提供型またはリマインダー型の広告、価格を内生的に選ぶモデルを作り、広告を限定することで価格競争を和らげ、近い位置に並ぶ均衡を分析する（抄録）。", "p4": "広告費用の大きさ、消費者の好みの分布、移動コスト（距離による不効用）の形状によって、どの均衡が生じるかを比べる（抄録）。", "p5": "広告費用が高いほど、広告を少なくして中央に並ぶ結果が生じやすい。片方が中央でもう片方が端に立つ部分的差別化や、完全な差別化も条件によって現れる。距離の不効用が強く凸（満足化の選好）なら、端に消費者が多いほど中央での並びが唯一の均衡になり、線形なら逆に並びにくくなる（抄録）。", "p6": "理論モデルの結果で、実証的な検証は抄録からは確認できない（解釈）。2社の競争を想定している。", "fun": "コンビニの品ぞろえやスマホの形がどれも似ているのはなぜでしょう。この研究は、企業がわざと広告を控えると、お客は他社と比べにくくなり、値下げ競争が起きにくくなると説明します。違いを作らなくても、知らせ方を工夫すれば競争を避けられる、という発想が面白い点です。", "unverified": "モデルの具体的な仮定の詳細は未確認。"}}, {"id": "jn07", "rank": 7, "field": "因果推論", "headline": "複数の自己呈示はUGCへの貢献を増やすか：自然実験", "title": "Multi-self presentation and knowledge contribution in platform operations: Evidence from a natural experiment", "url": "https://doi.org/10.1177/10591478261498550", "authors": "Yingpeng Zhu ほか", "venue": "Production and Operations Management", "date": "2026-10-16", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "apa": "Zhu, Y., Cao, Z., Li, G., Yang, Y., & Qiu, L. (2026). Multi-self presentation and knowledge contribution in platform operations: Evidence from a natural experiment. Production and Operations Management. https://doi.org/10.1177/10591478261498550", "why": "投稿プラットフォームの新しい設計を自然実験として、利用者の知識貢献への因果効果を推定した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由、Production and Operations Management）を使用。本文は入手できず", "preprint": false, "p1": "中国の大規模な知識共有プラットフォームが、正式な回答と並べて気軽な投稿ができる社交機能を導入したとき、その機能をよく使う利用者は質を落とさずにより多くの回答を書くようになったことを、準実験で示した。", "p2": "投稿型（UGC）プラットフォームでは、利用者が十分な投稿をしない「供給不足」が課題で、気軽な社交的な投稿が正式な知識の貢献を奪うのか補うのかは分かっていなかった（抄録）。", "p3": "社交機能の導入を準実験として、傾向スコアマッチングや先読み型の傾向スコアマッチングと組み合わせた差の差分析で、正式な回答の量と質への効果を推定し、媒介分析と、気軽な投稿と正式な回答の意味的な類似度のテキストマイニングを行う（抄録）。", "p4": "機能をよく使う利用者（高採用者）の回答の量と質、プラットフォームへの関与と知識の消費、社会的な承認を見る（抄録）。", "p5": "高採用者は回答を書く動機が強まり、質は落ちなかった。仕組みとして、関与が増えて知識の消費が増えること、より完全な自己を示すことで社会的承認が増えることが示唆された。気軽な投稿が正式な知識の分野と意味的に近い利用者ほど効果が大きかった（抄録）。", "p6": "機能を使うかどうかは利用者が選ぶため、マッチングで調整しても自己選択が残る可能性がある（解釈）。1つのプラットフォームの結果である。", "fun": "真面目な質問サイトに、雑談のような気軽な投稿の場を作ると、みんな遊んでしまって回答が減りそうです。ところが実際は、雑談をよくする人ほど回答も増えました。いろいろな顔の自分を見せられると、注目や評価が増え、本業の投稿にもやる気が出るようです。", "unverified": "効果の大きさと、データの期間は未確認。"}}, {"id": "jn08", "rank": 8, "field": "地球科学", "headline": "氷崖の崩落に初めて実証的な制約を与える", "title": "Empirical constraints on ice cliff calving", "url": "https://doi.org/10.1126/science.aee0658", "authors": "Caroline Needell ほか", "venue": "Science", "date": "2026-10-15", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "apa": "Needell, C., Walker, C. C., & Bassis, J. N. (2026). Empirical constraints on ice cliff calving. Science, 394(6821), 311–315. https://doi.org/10.1126/science.aee0658", "why": "海面上昇予測の不確実性の源である海洋性氷崖不安定について、観測から崩落の条件に制約を与えた。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由、Science）を使用。本文は入手できず", "preprint": false, "p1": "レーザー高度計で世界の氷床の縁の15,330の氷崖を測り、高い氷崖はモデルの想定より速く崩落するが、動的な薄化などが暴走的な後退（海洋性氷崖不安定）を防いでいることを示した。", "p2": "氷崖が臨界の高さを超えると暴走的な後退が始まりうるとされるが（海洋性氷崖不安定）、十分に高い氷崖はほとんど観測されておらず、その仮説を検証する実証的な制約がなかった（抄録）。", "p3": "レーザー高度計で、地球の氷床の縁の15,330の氷崖の特徴を測り、崖の高さと、メランジュ（海氷と氷山の混合物）の厚さ、水深、クレバスとの関係を調べる（抄録）。", "p4": "観測した崩落の速さを、モデルで使われるパラメータ化と比べ、暴走的な後退が起きる条件を検討する（抄録）。", "p5": "崖の高さはメランジュの厚さ、水深、クレバスと強く相関した。高い崖はパラメータ化の想定より速く崩落したが、動的な薄化と、氷の厚さの勾配が小さい領域への後退が暴走的な後退を防いでいた（抄録）。", "p6": "著者は、モデルの予測は1年未満の時間スケールの崩落速度を過小評価しているかもしれないが、不安定の可能性は崖の高さだけでなく他の量に敏感に依存すると述べる（抄録）。", "fun": "南極やグリーンランドの氷の崖が高くなりすぎると、自分の重さで次々に崩れ、海面が急上昇するという説があります。15,330の崖を測ると、高い崖は予想より速く崩れる一方で、氷が薄くなるなどの仕組みが「止まらない崩壊」を防いでいました。怖い説に、観測でブレーキをかけた研究です。", "unverified": "観測期間と、崩落速度の具体的な値は未確認。"}}, {"id": "jn09", "rank": 9, "field": "統計学", "headline": "コピュラで反応速度と正確さを同時にモデル化", "title": "A Copula-Based Joint Model for Speed and Accuracy", "url": "https://doi.org/10.1017/psy.2026.10143", "authors": "Sunbeom Kwon ほか", "venue": "Psychometrika", "date": "2026-10-16", "sjr": 1.928, "citescore": 5.1, "citescore_year": "2025", "apa": "Kwon, S., & Zhang, S. (2026). A Copula-Based Joint Model for Speed and Accuracy. Psychometrika, 1–57. https://doi.org/10.1017/psy.2026.10143", "why": "項目反応と反応時間の潜在特性に多変量正規を仮定しない同時モデルを提案し、心理測定の標準的な仮定を緩めた。", "explain": {"basis": "本文", "basis_note": "Psychometrikaの本文（モデル§3.1、シミュレーション§4、実データ§5、考察§7）を読んだ。付録の推定アルゴリズムは見出しのみ", "preprint": false, "p1": "テストの正誤と回答時間を同時にモデル化するとき、潜在的な能力と速さの関係に多変量正規を仮定せず、裾の依存（tail dependence）を持つコピュラで表すモデルを提案し、能力の推定、とくに分布の端の受験者の推定を改善した。", "p2": "正誤と回答時間の同時モデル（階層モデル）は、能力と速さの潜在特性に多変量正規分布を仮定してきた。しかし両者の関係が非対称で、能力の高い（低い）側でだけ強く結びつくような場合、その仮定は誤りになりうる（§1）。", "p3": "測定モデルは正誤に2パラメータロジスティック（2PL）、回答時間に対数正規を使い、潜在特性が与えられれば両者は独立とする（式7〜9）。構造モデルで能力と速さの同時分布をGumbelやJoeのコピュラ（回転版を含む）で定義し、確率的近似付きのEMアルゴリズムで推定する（§3）。直観：裾の依存が強い領域では回答時間から能力の情報を多く借り、弱い領域では借りない。", "p4": "500回のシミュレーションで、真の依存構造（Gumbel、Joe、多変量正規）、標本数（500、1000）、テスト長（10、20）、ケンドールのτ（0.3、0.5）を変え、モデル選択の正答率、パラメータの回復、能力推定のRMSEと相関を比べる（§4）。PISA 2018の数学・理科を含む7つの認知テストのデータ（N=389〜3,035）にも適用する（§5）。", "p5": "尤度に基づくモデル選択は真のモデルをよく選び、Gumbelが真のとき0.69〜0.98、多変量正規が真のとき0.87〜0.98の割合で正しく選んだ（表3）。正しく指定したコピュラモデルは全条件でRMSEが最小、真の能力との相関が最大で、その優位は能力分布の裾で最も大きかった（表5、§7）。実データではコピュラモデルがしばしば選ばれ、PISAの理科では90度回転のJoeコピュラ、つまり能力の低い受験者が速く答える下側の裾の依存が目立った（§7）。", "p6": "下側の裾の依存は、項目の難易度に加えて、速すぎる当て推量や取り組みの放棄から生じうるが、本モデルはそうした回答行動の潜在クラスを明示的には扱わない。混合モデルとの使い分けは今後の課題と著者は述べる（§7）。", "fun": "テストでは、よくできる人ほど速く答えるとは限りません。苦手な人が早々にあきらめて、すばやく適当に答えることもあります。この研究は、能力と速さの関係が「端のほう」で特に強まる形を数学的に表し、点数の極端に低い人や高い人の能力をより正確に推定できるようにしました。", "unverified": "実データ各セットのモデル選択の内訳と、付録の推定手順の詳細は未確認。"}}, {"id": "jn10", "rank": 10, "field": "経営学", "headline": "広告の混雑は注視を分散させ記憶を弱める", "title": "EXPRESS: The Role of Digital Ad Clutter in Ad Viewership and Memory", "url": "https://doi.org/10.1177/00222437261498868", "authors": "Sean Melessa ほか", "venue": "Journal of Marketing Research", "date": "2026-10-16", "sjr": 7.363, "citescore": 11.0, "citescore_year": "2025", "apa": "Melessa, S., Larsen, P., & Hoban, P. (2026). EXPRESS: The Role of Digital Ad Clutter in Ad Viewership and Memory. Journal of Marketing Research. https://doi.org/10.1177/00222437261498868", "why": "広告が密集するデジタル環境で、広告の混雑が実際の視聴と記憶にどれだけ影響するかを実証した。", "explain": {"basis": "抄録", "basis_note": "出版社の早期公開版の抄録（Crossref経由、Journal of Marketing Research）を使用。本文は入手できず", "preprint": false, "p1": "広告が密集したデジタル環境で、広告の混雑が消費者の広告の見方をどう変えるかを、3つの視線計測実験と調査で示した。", "p2": "広告主は混雑したデジタル環境で顧客の注意を争っているが、デジタル広告の混雑が広告の視聴にどれだけ影響するかははっきりしていなかった（抄録）。", "p3": "十数種類の自作のウェブページを使い、3つの視線計測実験（被験者N=99、N=250、N=575）で混雑の度合いを操作し、補完的な調査で広告の記憶と再生を測る（抄録）。", "p4": "広告領域全体への注意の配分、広告の位置ごとの視聴の分布、個々の広告の記憶と再生を見る（抄録）。", "p5": "混雑が増えると、消費者は広告領域全体により多くの注意を割き、広告の位置ごとの視聴の配分を変えた。調査では、混雑は個々の広告の記憶と再生を下げた（抄録）。", "p6": "自作のウェブページでの実験室的な設定で、実際の閲覧行動への一般化は検証が必要（解釈）。著者は広告の価格づけと配置への含意を論じている（抄録）。", "fun": "ページに広告が増えると、人は広告欄全体を見る時間をむしろ増やしました。でも見る時間が広告の数に分散するので、一つひとつの広告は覚えてもらえなくなります。目は向いても頭に残らない、という広告の混雑の落とし穴を視線の記録で示した研究です。", "unverified": "効果の大きさと、広告の位置ごとの具体的な変化は未確認。"}}, {"id": "jn11", "rank": 11, "field": "経済学", "headline": "ブラジルの持続可能な開発を阻む技能と地域のずれ", "title": "Skill and spatial mismatches for sustainable development in Brazil", "url": "https://doi.org/10.1038/s41893-026-01939-z", "authors": "Anna K. Berryman ほか", "venue": "Nature Sustainability", "date": "2026-10-15", "sjr": 7.896, "citescore": 44.1, "citescore_year": "2025", "apa": "Berryman, A. K., de Moura, F. S., Bücker, J., Barbrook-Johnson, P., Hanusch, M., Mealy, P., Farmer, J. D., & del Rio-Chanona, R. M. (2026). Skill and spatial mismatches for sustainable development in Brazil. Nature Sustainability. https://doi.org/10.1038/s41893-026-01939-z", "why": "森林破壊を抑えつつ経済を伸ばすうえで、労働者の技能と地域の需要の不一致が制約になることを示した。", "explain": {"basis": "本文", "basis_note": "Nature SustainabilityのPDF本文（序論、結果の移動ネットワークの節、考察、方法の限界の部分）を読んだ。シナリオ別の図表の数値は一部のみ", "preprint": false, "p1": "ブラジルの全雇用契約の記録から作った職業・地域の転職ネットワークに基づくエージェントベースの労働市場モデルで、森林破壊を減らす生産性主導の発展経路が、高技能の労働者に有利で、農業などの低技能の労働者の失業を増やすことを示した。", "p2": "土地をあまり使わない部門への生産性主導の構造転換は森林破壊を減らしうるが、その経路が労働市場にどんな影響を与えるか、労働者が技能や地理の壁を越えて適応できるかは分かっていなかった（抄録）。", "p3": "2011〜2019年のRAIS（ブラジルの正規雇用の全契約の記録）から、職業間と職業×地域間の過去の転職のつながりのネットワークを作る。それを組み込んだ月次のエージェントベースモデルで、労働者が他の職業や地域の求人に応じて移る様子を模擬し、計算可能一般均衡（CGE）モデルの労働需要のシナリオを一方向に与える（結果、方法）。", "p4": "ネットワークの同類性（同じ職業・地域どうしのつながりやすさ）で移動の摩擦を定量化し、森林破壊を減らす複数の発展シナリオでの職業・地域ごとの失業を比べ、農業労働者の移動性を高める政策介入も模擬する（結果）。", "p5": "職業×地域のネットワークはブラジルの地図とよく似ており、地域の同類性は0.77、1桁の職業の同類性は0.56と、空間と技能の両方の摩擦が大きかった（結果）。森林破壊と排出を最も減らす経路は高技能の労働者に偏って利益をもたらし、農業と低技能の労働者の失業を増やした。農業労働者の移動性を少し高める介入で、アマゾンの農業労働者の失業は50%減った（考察）。", "p6": "正規雇用のデータだけで労働力の約67%しか覆わず、非正規の多い職業が過小代表になる。賃金の硬直性を仮定し、労働力の参入・退出を含めず、CGEとの結合は一方向である。職業×地域の水準での検証も今後の課題と著者は述べる（考察、方法）。", "fun": "アマゾンの森を守るために農業から工場やサービスへ経済の重心を移すと、二酸化炭素は減ります。でも農家の人がすぐ工場で働けるわけではありません。転職の記録を地図のように描くと、人は同じ地域・似た仕事の間でしか動いていませんでした。環境に良い政策ほど、弱い立場の人に負担が寄るのです。", "unverified": "シナリオごとの失業率の具体的な値は未確認。"}}, {"id": "jn12", "rank": 12, "field": "教育", "headline": "分散型リーダーシップは教員の離職意図を下げる", "title": "Retaining Teachers: The Impact of Distributed Leadership on Teacher Resignation Intention", "url": "https://doi.org/10.1111/ejed.70908", "authors": "Mengting Zhang ほか", "venue": "European Journal of Education", "date": "2026-10-16", "sjr": 1.285, "citescore": 5.0, "citescore_year": "2025", "apa": "Zhang, M., Chen, J., & Dang, M. (2026). Retaining Teachers: The Impact of Distributed Leadership on Teacher Resignation Intention. European Journal of Education, 61(4). https://doi.org/10.1111/ejed.70908", "why": "資源保存理論に基づき、学校の分散型リーダーシップが教員の辞職意図を抑える経路を検証した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由、European Journal of Education）を使用。本文は入手できず", "preprint": false, "p1": "TALIS 2024のデータで、学校の分散型リーダーシップが教員の辞職意図の低さと結びつき、その経路として専門的な学びの障壁の減少と、授業の楽しさから障壁の減少への連鎖が働くことを示した。", "p2": "教員の辞職意図は質の高い教育の体制づくりの持続的な課題で、学校のリーダーシップがどの経路で教員を引き留めるかは十分に分かっていなかった（抄録）。", "p3": "資源保存理論に基づき、分散型リーダーシップと辞職意図の関係で、授業の楽しさと専門的な学びの障壁の知覚の媒介を検証する（抄録。分析手法の詳細は本文未確認）。", "p4": "OECDの国際教員指導環境調査TALIS 2024のデータで、単純な媒介と、楽しさから障壁への連鎖的な媒介を比べる（抄録）。", "p5": "分散型リーダーシップは辞職意図と負に関連した。授業の楽しさの単純な媒介は支持されず、専門的な学びの障壁が重要な構造的媒介だった。分散型リーダーシップが楽しさを高め、それが障壁の知覚を下げ、辞職意図の低さにつながる連鎖の経路が見られた（抄録）。", "p6": "横断的な調査データの媒介分析であり、因果の向きは確定できない（解釈）。対象国の範囲や効果の大きさは抄録からは分からない。", "fun": "先生が辞めたいと思わないためには、「授業が楽しい」と感じるだけでは足りませんでした。大事なのは、学校のリーダーが権限を分け合い、先生が研修などで学びたいときの壁を取り除くことでした。気持ちの支えを、実際の障害を取り除く力に変えることが鍵だという話です。", "unverified": "対象国、標本の規模、効果の大きさは未確認。"}}, {"id": "jn13", "rank": 13, "field": "組織行動・心理的安全性", "headline": "ステレオタイプ脅威の効果は9か所の追試で再現せず", "title": "Registered Replication Report: Johns et al. (2005)", "url": "https://doi.org/10.1177/25152459261424724", "authors": "Andrea H. Stoevenbelt ほか", "venue": "Advances in Methods and Practices in Psychological Science", "date": "2026-10-15", "sjr": 6.094, "citescore": 14.8, "citescore_year": "2025", "apa": "Stoevenbelt, A. H., Flore, P. C., Adamkovic, M., Banik, G., Bergers, R., Calin-Jageman, R. J., Gomez, Luis. A., Hüffmeier, J., Imundo, M. N., Martin, S. D., Pan, S. C., Phillips, L. A. T., Pietschnig, J., Ripp, T., Roër, J. P., Ropovik, I., Schleu, J. E., Torka, A.-K., Verschuere, B., et al. (2026). Registered Replication Report: Johns et al. (2005). Advances in Methods and Practices in Psychological Science, 9(4). https://doi.org/10.1177/25152459261424724", "why": "Johns et al. (2005) の登録追試報告で、心理学の定番効果が再現されるかを大規模に検証した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由、Advances in Methods and Practices in Psychological Science）を使用。本文は入手できず", "preprint": false, "p1": "女性の数学の成績がステレオタイプ脅威で下がるとしたJohns et al.（2005）の代表的な研究を、9つの直接追試（合計N=1,709）の登録追試報告で検証し、効果が再現されないことを示した。", "p2": "ステレオタイプ脅威が女性の数学テストの成績を下げるという研究は多いが、最適でない設計や分析、出版バイアスの可能性があり、文化を越えた一般化も分かっていなかった（抄録）。", "p3": "性差を測ると説明した数学テストで脅威を受けた女性（男性ではない）の成績が下がり、指示を変えると緩和されるという原研究の手続きを、事前登録した9つの研究室で直接追試する（抄録）。", "p4": "多水準分析で、ステレオタイプ脅威の条件と性別の交互作用を主な検定とし、原研究の効果量と比べる。男女構成や研究室の効果も二次的に見る（抄録）。", "p5": "脅威の条件と性別の有意な交互作用はなかった。性差は数学テストでのみ見られ、女性が男性より低かった（Hedges g=−0.26、95%CI[−0.47,−0.05]）。女性での脅威の効果はほぼゼロで（N=1,275、g=0.04、95%CI[−0.11,0.20]）、原研究（N=45、d=−0.82）よりかなり小さかった（抄録）。", "p6": "結果は原研究の効果の一般化に疑問を投げるが、他の課題や手続きによるステレオタイプ脅威の研究全体を否定するものではない（解釈）。男女構成の主効果と研究室のランダム効果は交互作用を変えなかった（抄録）。", "fun": "「女性は数学が苦手」という思い込みを意識させると、女性の成績が下がる。心理学の教科書にも載るこの効果を、9つの研究室で1,709人を使って試し直したところ、効果はほとんど見られませんでした。最初の研究はわずか45人。科学が自分の結論を確かめ直す姿を示しています。", "unverified": "実施した国と、各研究室の結果のばらつきは未確認。"}}, {"id": "jn14", "rank": 14, "field": "物理学", "headline": "超伝導量子プロセッサでマジック状態を育てる", "title": "Magic state cultivation on a superconducting quantum processor", "url": "https://doi.org/10.1126/science.aee7961", "authors": "E. Rosenfeld ほか", "venue": "Science", "date": "2026-10-15", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "apa": "Rosenfeld, E., Gidney, C., Roberts, G., Morvan, A., Lacroix, N., Kafri, D., Marshall, J., Li, M., Sivak, V., Abanin, D., Abbas, A., Acharya, R., Aghababaie Beni, L., Aigeldinger, G., Alcaraz, R., Alcaraz, S., Andersen, T. I., Ansmann, M., Arute, F., et al. (2026). Magic state cultivation on a superconducting quantum processor. Science. https://doi.org/10.1126/science.aee7961", "why": "誤り耐性量子計算の難所である非クリフォード演算に必要なマジック状態の生成コストを下げる手法を実機で示した。", "explain": {"basis": "本文", "basis_note": "arXivのオープンアクセス版PDF（序論、手順の説明、結果の図2・図4の説明、結論）を読んだ。補足情報（SI）は読んでいない", "preprint": false, "p1": "誤り耐性量子計算に必要な非クリフォード演算のための「マジック状態」を、蒸留より安く作る「マジック状態の育成（cultivation）」を、超伝導量子プロセッサで初めて実験し、誤りを約40分の1に減らし、表面符号への移し替え（grafting）まで示した。", "p2": "表面符号や色符号では非クリフォード演算が自然には使えず、高忠実度のマジック状態を作ってゲートテレポーテーションで消費する必要がある。RSA2048の素因数分解には誤り10⁻¹⁰程度が必要とされ、従来の蒸留は資源の大きなボトルネックだった（序論）。", "p3": "距離3の色符号に雑な（非誤り耐性の）注入で状態を作り、補助量子ビットとの位相キックバックで論理アダマール演算子を測って状態をマジック状態の軸に射影する。手順を時間反転して再測定と誤り検出を兼ね、検出事象があれば破棄してやり直す（事後選択）。最後に色符号から距離5の表面符号へ状態を移す（序論、結果）。", "p4": "GoogleのWillowプロセッサで、論理状態トモグラフィーと、新たに作った誤り耐性の測定（キックバック・トモグラフィー）でマジック状態の忠実度の下限を評価し、注入のみの場合と比べる。保持したデータの割合も報告する（結果）。", "p5": "注入だけの場合はデータの76(3)%が残った（図2）。育成により状態の誤りは注入に比べ約40分の1に減り、忠実度は少なくとも0.9999(1)、誤りの上限は1(1)×10⁻⁴で、試行の約8%を保持した（抄録、序論）。54量子ビットの表面符号への移し替えでも、育成した状態が|T⟩の軸に沿って圧縮されたまま移ることを確かめた（図4）。", "p6": "実験とシミュレーションの差は、雑音モデルに含まれないリーク（漏れ出し）や量子ビットの性能のばらつきによる可能性がある。実時間の|T⟩ゲートの実装、より大きな距離への移し替え、移し替え後の符号の復号器が今後の課題と著者は述べる（結果、結論）。", "fun": "量子コンピュータで役に立つ計算をするには、「魔法の状態」と呼ばれる特別な状態を、誤りがほとんどない形で大量に作る必要があります。この実験は、怪しい状態を何度も検査して、合格したものだけを残す「育成」で、誤りを40分の1にしました。ふるいにかけて良い種だけを育てるような方法です。", "unverified": "補足情報の回路の詳細と、雑音の強さとの関係の推定は未確認。"}}, {"id": "jn15", "rank": 15, "field": "経営学", "headline": "走る店舗：時間に敏感な巡回セールスマン問題", "title": "Retail on Wheels: A Time-Sensitive Traveling Salesman Problem", "url": "https://doi.org/10.1287/mnsc.2023.04259", "authors": "Zhuolun Dong ほか", "venue": "Management Science", "date": "2026-10-15", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Dong, Z., Cao, J., & Qi, W. (2026). Retail on Wheels: A Time-Sensitive Traveling Salesman Problem. Management Science. https://doi.org/10.1287/mnsc.2023.04259", "why": "自動運転による移動販売の運用を、時間に依存する需要を持つ巡回問題として定式化し理論と示唆を与えた。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由、Management Science）を使用。本文は入手できず", "preprint": false, "p1": "自動運転の移動店舗の車両群が、地域を巡回し、止まる場所を選び、地元の需要を満たす運用を、混雑・顧客の到着の遅れ・鮮度の低下を入れた「時間に敏感な巡回セールスマン問題」として定式化し、最適な収益の漸近的な上下界を導いた。", "p2": "自動運転技術の進歩で移動販売が注目されているが、止まって売ることと移動することの釣り合いをどう取るかの運用の理論はなかった（抄録）。", "p3": "サービスの混み具合、顧客の到着までの時間、鮮度の低下速度を古典的な巡回セールスマン問題（TSP）に組み込み、候補地が無限に増える漸近領域で、連続近似法により最適収益と上下界を導く（抄録）。", "p4": "上下界の厳しさを検証し、時間に敏感な要素が意思決定と、収益と車両数の関係に与える影響を分析する（抄録）。", "p5": "店舗の移動性は顧客への近さを生むことで価値を作ることを示した。収益と車両数のスケーリングは顧客の遅れと混雑に左右され、混雑はサービスを広げる能力を、遅れは鮮度の高い初期期間を生かす効率を決めた（抄録）。", "p6": "漸近的な理論の結果で、有限の候補地や実データでの性能は補足資料に依存する（解釈）。", "fun": "自動で走るお店が町を回るなら、一か所で長く売るべきか、次々に場所を変えるべきか。お客さんが来るまでの時間や、商品の鮮度の落ち方で答えが変わります。昔からの「最短の巡回ルート」の問題に時間の要素を加えて、走るお店の上手な回り方を数学で示しました。", "unverified": "上下界の具体的な式は未確認。"}}, {"id": "jn16", "rank": 16, "field": "統計学", "headline": "準モンテカルロは最適、疎格子ガウス-エルミートは非最適", "title": "Optimality of Quasi-Monte Carlo Methods and Suboptimality of the Sparse-Grid Gauss–Hermite Rule in Gaussian Sobolev Spaces", "url": "https://doi.org/10.1137/25m1794346", "authors": "Yoshihito Kazashi ほか", "venue": "SIAM Journal on Numerical Analysis", "date": "2026-10-16", "sjr": 2.12, "citescore": 5.2, "citescore_year": "2025", "apa": "Kazashi, Y., Suzuki, Y., & Goda, T. (2026). Optimality of Quasi-Monte Carlo Methods and Suboptimality of the Sparse-Grid Gauss–Hermite Rule in Gaussian Sobolev Spaces. SIAM Journal on Numerical Analysis, 64(5), 2123–2150. https://doi.org/10.1137/25m1794346", "why": "ガウス型ソボレフ空間での高次元積分について、準モンテカルロ法の最適性と疎格子求積の非最適性を証明した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用。数式部分は取得できず", "preprint": false, "short": true, "p1": "混合優越平滑性を持つガウス型ソボレフ空間での高次元積分について、変数変換付きの準モンテカルロ法が最悪誤差の意味で最適であり、1次元ガウス-エルミート則に基づく疎格子求積が最適でないことを証明した（抄録）。", "p3": "疎格子ガウス-エルミート求積の誤差について、対数因子を除いて一致する上界と下界を示す。下界はガウス-エルミートの節点の構造を使い、重みに依存しない形で導く。", "p5": "疎格子ガウス-エルミートの収束率は最適率より遅く、重みをどう変えても改善できないことを示した。一方、いくつかの準モンテカルロ法は最適率を達成し、1つは対数因子まで含めて達成した（抄録。率の具体的な式は取得できず）。", "fun": "正規分布のような釣鐘型の重みでの積分は、統計や物理で頻繁に出てきます。その定番の計算法である「ガウス-エルミート則を格子状に組む方法」が、実は理論的に最速ではなく、点の置き方そのものに限界があると示しました。重みを工夫しても直らない、という点が決定的です。", "unverified": "収束率の具体的な式は未確認（抄録の数式部分を取得できず）。"}}, {"id": "jn17", "rank": 17, "field": "経営学", "headline": "出荷監視センサで生鮮品の廃棄は減るか", "title": "Shipment Monitoring, Allocation, and the Impact on Food Waste", "url": "https://doi.org/10.1287/mnsc.2024.07382", "authors": "Tao Lu", "venue": "Management Science", "date": "2026-10-15", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Lu, T. (2026). Shipment Monitoring, Allocation, and the Impact on Food Waste. Management Science. https://doi.org/10.1287/mnsc.2024.07382", "why": "製品単位の状態監視と市場への配分を組み合わせたときの、食品ロス削減効果を分析した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "生鮮品の状態を1単位ずつ監視して近い市場と遠い市場に振り分ける技術が、食品ロスを本当に減らすのかを、仕入れ量の判断まで含めて理論的に分析した（抄録）。", "p3": "企業が生鮮品を仕入れ、2つの目的市場に輸送して売るモデルで、一部の商品は輸送中に売れなくなるリスクがある。監視技術があると、仕入れ量を決めたあとに各単位を市場に配分する。最適配分方針を特徴づけ、最適仕入れ量を求める。", "p5": "監視技術は仕入れ量を増やすことで、かえって総廃棄量を増やしうる。この増加は多くの場合、廃棄率の低下と利益の改善を伴うが、常にではないと示した（抄録）。", "fun": "傷みやすい品物を近くの店へ回せば、捨てる量は減りそうです。ところが、うまく振り分けられると企業は安心してたくさん仕入れるようになり、結果として捨てる総量が増える場合がありました。便利な技術が行動を変えて、狙いとは逆の結果を生む「リバウンド効果」の例です。", "unverified": "利益への影響の条件の詳細は未確認。"}}, {"id": "jn18", "rank": 18, "field": "組織行動・心理的安全性", "headline": "有能な上級チームが誤るのは知識が分散するから", "title": "Acting in complexity: knowledge dispersion challenges in high-level teams", "url": "https://doi.org/10.1108/jkm-10-2025-1467", "authors": "Brandon Randolph-Seng ほか", "venue": "Journal of Knowledge Management", "date": "2026-10-16", "sjr": 2.382, "citescore": 17.6, "citescore_year": "2025", "apa": "Randolph-Seng, B., Hinojosa, A. S., Marin, A., & Randolph, A. F. (2026). Acting in complexity: knowledge dispersion challenges in high-level teams. Journal of Knowledge Management, 1–25. https://doi.org/10.1108/jkm-10-2025-1467", "why": "能力も意欲も高い専門家チームが重大な誤りに至る仕組みを、知識の分散という観点から理論化した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "有能で意欲もある専門家からなる上級チームが、なぜ複雑な課題で重大な失敗をしうるのかを説明する理論モデル（チーム行為同定の枠組み）を示した（抄録）。", "p3": "行為と心の関係についての社会認知的な見方と社会的伝染の研究を使い、メンバーの専門知識、チームの過程、共有された認知とチームの行為をつなぐ仕組みを理論的に検討する。", "p5": "複雑さと競争の大きい状況で、専門知識と共有された認知をどう配置するのが最適かを特定し、認知と行為がチームの水準でどう展開するかの仕組みを明確にしたとする（抄録。実証はない）。", "fun": "優秀な人ばかりを集めたチームなら失敗しない、とは限りません。知識がメンバーにばらばらに散らばっていると、全員が有能でも、チームとして正しい行動を選べないことがあります。この論文は、その「頭の良い集団の失敗」の仕組みを理論として整理しています。", "unverified": "理論の検証は未確認（概念的な論文）。"}}, {"id": "jn19", "rank": 19, "field": "組織行動・心理的安全性", "headline": "役割適合とインポスター感：女性リーダー育成の介入", "title": "Role congruity, impostor feelings and women's leadership development: Evidence from a leadership intervention in an Indian public university", "url": "https://doi.org/10.1177/17411432261496805", "authors": "Anisha Kodan ほか", "venue": "Educational Management Administration and Leadership", "date": "2026-10-16", "sjr": 1.797, "citescore": 11.2, "citescore_year": "2025", "apa": "Kodan, A., Boora, S., Rani, S., & Kumari, S. (2026). Role congruity, impostor feelings and women’s leadership development: Evidence from a leadership intervention in an Indian public university. Educational Management Administration & Leadership. https://doi.org/10.1177/17411432261496805", "why": "インドの公立大学でのリーダーシップ介入から、女性のリーダー育成を妨げる心理的要因を検証した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "インドの公立大学の女性リーダー育成プログラムの効果を、役割適合理論とリーダーとしてのアイデンティティの観点から評価した（抄録）。", "p3": "単一事例の研究デザインで、女性参加者30人に対し、選択式の項目と自由記述からなる単一群の事前-事後調査を行う。", "p5": "量的な結果では、リーダーとしてのアイデンティティに短期的な知覚上の有意な改善が見られた。自由記述からは、参加者がプログラムを肯定的に受け止めていたことが示唆された（抄録。効果量は抄録の取得範囲になし）。", "fun": "女性が大学の上の役職に少ないのは、制度の壁だけでなく、「自分はリーダーにふさわしくない」と感じてしまう気持ち（インポスター感）も関係しています。この研究は、研修でその気持ちが変わるかを確かめました。心の壁に働きかける取り組みの評価です。", "unverified": "対照群がなく、効果の因果は未確認。"}}, {"id": "jn20", "rank": 20, "field": "経済学", "headline": "栄養表示の1回量変更は購買をどう変えたか", "title": "Information framing and the impact of nutrition label serving size change", "url": "https://doi.org/10.1002/ajae.70100", "authors": "Yuxiang Zhang ほか", "venue": "American Journal of Agricultural Economics", "date": "2026-10-16", "sjr": 2.087, "citescore": 9.8, "citescore_year": "2025", "apa": "Zhang, Y., Liu, Y., & Fan, L. (2026). Information framing and the impact of nutrition label serving size change. American Journal of Agricultural Economics. https://doi.org/10.1002/ajae.70100", "why": "栄養成分表示の1回量の変更を情報フレーミングの実験として、消費者の反応を推定した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "栄養成分表示の「1回分の量」の変更という情報のフレーミングが、炭酸飲料の購買をどう変えたかを、差の差法と構造モデルで推定した（抄録）。", "p3": "まず誘導形の差の差モデルで購買行動への因果効果を示し、次に消費者の需要と、企業の価格・栄養の選択を含む均衡の構造モデルを推定し、反実仮想のシミュレーションと厚生分析を行う。", "p5": "表示の1回分が大きくなると通常の炭酸飲料の需要が有意に減り、販売される栄養素の平均量が下がった。さらに大きな表示（16オンス、24オンス、1本まるごと）では効果が増幅し、企業はカロリーやナトリウム、カフェインを少し減らして需要減を一部相殺するとした（抄録）。", "fun": "同じ1本の飲み物でも、「1本＝2回分」と書くか「1本＝1回分」と書くかで、表示されるカロリーの数字が変わります。中身は同じなのに、大きな数字を見ると人は買うのを控えました。表示の書き方ひとつで、人も企業も行動を変えるという例です。", "unverified": "厚生分析の結論の詳細は未確認。"}}, {"id": "jn21", "rank": 21, "field": "経済学", "headline": "経済格差は持続可能な消費を減らす", "title": "Economic Inequality Reduces Sustainable Consumption: Cross-National and Experimental Evidence and Psychological Mechanisms", "url": "https://doi.org/10.1007/s10551-026-06437-y", "authors": "Steven A. Brieger ほか", "venue": "Journal of Business Ethics", "date": "2026-10-15", "sjr": 3.138, "citescore": 15.9, "citescore_year": "2025", "apa": "Brieger, S. A., Hörisch, J., & Zhang, X. (2026). Economic Inequality Reduces Sustainable Consumption: Cross-National and Experimental Evidence and Psychological Mechanisms. Journal of Business Ethics. https://doi.org/10.1007/s10551-026-06437-y", "why": "国際比較と実験の両方から、経済的不平等が持続可能な消費を抑える心理的メカニズムを示した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "経済的な不平等が持続可能な消費を減らすことを、20か国の二次データ、場面想定の実験、英国の調査データの3つの研究で示した（抄録）。", "p3": "不平等が客観的に高い、高いと知覚される、実験で高く操作される、の3つの場合で持続可能な消費を比べ、規範活性化理論で媒介の仕組みを検証する。", "p5": "不平等が高いと、消費者は環境被害への責任を感じにくくなり、自分の消費の環境影響に気づきにくくなる。それが持続可能性に向かう個人的な規範を弱め、持続可能な消費を減らした（抄録）。", "fun": "格差の大きい社会では、「どうせ自分ひとりが頑張っても」という気持ちが強まるのかもしれません。この研究は、格差が大きいと感じるだけで、環境に優しい買い物への責任感が薄れることを実験でも確かめました。格差の問題と環境の問題がつながっていることを示しています。", "unverified": "効果の大きさの値は未確認。"}}, {"id": "jn22", "rank": 22, "field": "機械学習", "headline": "複数のAIエージェントが酸化の「門番」を発見", "title": "Multi-AI agent framework reveals the “oxide gatekeeper” in aluminum nanoparticle oxidation", "url": "https://doi.org/10.1073/pnas.2537780123", "authors": "Yiming Lu ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-10-15", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Lu, Y., Lu, T., Zhang, D., Ye, L., & Li, H. (2026). Multi-AI agent framework reveals the “oxide gatekeeper” in aluminum nanoparticle oxidation. Proceedings of the National Academy of Sciences, 123(42). https://doi.org/10.1073/pnas.2537780123", "why": "複数のAIエージェントを用いた研究の枠組みで、アルミナノ粒子の酸化を支配する酸化膜の役割を明らかにした。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "人が監査する複数AIエージェントの枠組みで機械学習ポテンシャルを作り、アルミナノ粒子の酸化で酸化膜が「門番」として働く温度依存の二つの酸化様式を明らかにした（抄録）。", "p3": "能動学習、モデル評価、検証の証拠、人の専門家によるレビューを調整するワークフローで、課題特化の機械学習ポテンシャルの開発と検証を追跡・監査可能にし、科学的解釈とモデルの使用判断は研究者が持つ。", "p5": "量子力学的な精度を保ちつつほぼ線形のスケーラビリティを示し、温度で切り替わる二重モードの酸化機構を明らかにした（抄録。具体的な機構の記述は抄録の取得範囲で途中まで）。背景として、第一原理計算は500原子未満・ピコ秒に限られるとする。", "fun": "アルミの微粒子は、とても高エネルギーな燃料です。その燃え始めを原子レベルで見るには、正確だけれど遅い計算と、速いけれど粗い計算の間を埋める必要がありました。この研究は、AIの「チーム」に計算の準備をさせ、人間が最後にチェックする分業で、その壁を越えました。", "unverified": "二重モードの酸化機構の詳細は未確認。"}}, {"id": "jn23", "rank": 23, "field": "機械学習", "headline": "LLMの支援で超低熱伝導の材料を探す", "title": "LLM‐Assisted Design of Ultralow‐κ Chalcogenides", "url": "https://doi.org/10.1002/advs.78175", "authors": "Yujie Liu ほか", "venue": "Advanced Science", "date": "2026-10-16", "sjr": 3.288, "citescore": 18.1, "citescore_year": "2025", "apa": "Liu, Y., Jia, C., Hao, Y., Li, X., Wang, Y., Oganov, A., Sun, J., Ding, X., Lookman, T., & Gao, Z. (2026). LLM‐Assisted Design of Ultralow‐κ Chalcogenides. Advanced Science. https://doi.org/10.1002/advs.78175", "why": "第一原理計算の高いコストを、LLMを組み込んだ探索で下げ、極端な格子熱伝導率の材料発見を加速した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用。数式部分は一部欠落", "preprint": false, "short": true, "p1": "ベイズ最適化で候補を出し、LLMが証拠に基づいて順位を付け直し、物理計算で受け入れを判定するワークフローで、格子熱伝導率が極めて低いカルコゲン化物を見つけた（抄録）。", "p3": "ベイズ最適化による候補の提案、LLMによる証拠条件付きの再順位付け、物理に基づく構造生成と安定性の検証、熱伝導率の計算を組み合わせる。", "p5": "Ag3SbSe4、Ag4TiSe4、Ag4TiTe4などの動的に安定なAg系カルコゲン化物を見つけ、低い熱伝導率は強いフォノンの繰り込みとコヒーレンスが支配する熱輸送によるとした。Ag3SbSe4は500Kで最大2.94（熱電性能指数と読める）に達すると予測し、14元素の三元化合物の高速スクリーニングで2,742の安定な材料を特定した（抄録）。", "fun": "熱を伝えにくい材料は、排熱から電気を作る熱電変換に役立ちます。でも候補は無数にあり、1つずつ精密計算するのは大変です。そこで、AIに「どれから調べるべきか」の順番を付けさせ、最後は物理の計算で確かめる分業にしました。AIの勘と物理の厳密さの組み合わせです。", "unverified": "2.94が示す量（抄録の数式部分が欠落）は未確認。"}}, {"id": "jn24", "rank": 24, "field": "政治学", "headline": "祖国からの呼びかけはディアスポラの愛着を高めるか", "title": "Do Appeals to the Diaspora Affect their Attachment to the Homeland? Findings from Jewish-Americans before and during the Israel-Hamas War", "url": "https://doi.org/10.1007/s11109-026-10202-2", "authors": "Yehonatan Abramson ほか", "venue": "Political Behavior", "date": "2026-10-16", "sjr": 2.955, "citescore": 9.0, "citescore_year": "2025", "apa": "Abramson, Y., Menon, A., & Yakter, A. (2026). Do Appeals to the Diaspora Affect their Attachment to the Homeland? Findings from Jewish-Americans before and during the Israel-Hamas War. Political Behavior. https://doi.org/10.1007/s11109-026-10202-2", "why": "イスラエル・ハマス戦争の前後で、ユダヤ系米国人への国家の物語的な呼びかけの効果を実験的に検証した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "事前登録した2波の調査実験で、祖国への脅威・共有された歴史の記憶・居住国での差別という3つの呼びかけが、ユダヤ系米国人のイスラエルへの愛着を変えるかを、イスラエル・ハマス戦争の前と最中に検証した（抄録）。", "p3": "先行研究が特定した3種類の呼びかけを実験的に提示し、イスラエルへの愛着、支持、動員の意図を測る。", "p5": "どの呼びかけも、戦争の最中でさえ、愛着・支持・動員の意図に影響しなかった。もともとの違いは、世代、宗派、党派という共同体の中の深い亀裂を反映していた（抄録）。", "fun": "国はよく、海外に住む同胞に「祖国が危ない」と呼びかけます。ところが、実際に戦争が起きている最中でも、そうした言葉は人の気持ちをほとんど動かしませんでした。人の愛着は、短い言葉より、世代や信仰や政治的立場といった長年の背景で決まっているようです。", "unverified": "標本の規模は未確認。"}}, {"id": "jn25", "rank": 25, "field": "政治学", "headline": "民主主義の危機でジャーナリストは「制度の番人」に", "title": "Institutional sentinel: Journalistic role performance and the defense of media autonomy under democratic threat", "url": "https://doi.org/10.1177/14648849261498625", "authors": "Vytautas Valentinavičius", "venue": "Journalism", "date": "2026-10-15", "sjr": 2.087, "citescore": 8.3, "citescore_year": "2025", "apa": "Valentinavičius, V. (2026). Institutional sentinel: Journalistic role performance and the defense of media autonomy under democratic threat. Journalism. https://doi.org/10.1177/14648849261498625", "why": "報道の独立が脅かされるとき、記者が役割遂行を一時的に組み替える現象を概念化した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "独立した報道の制度的な条件が政治的な争点になったとき、記者が観察者から制度の擁護者へと役割を一時的に切り替える現象を「制度の番人」として概念化した（抄録）。", "p3": "概念的な論文で、2025〜2026年のリトアニア公共放送LRTをめぐる対立を、概念を明らかにする事例として使う。", "p5": "「制度の番人」を、手続き上の脅威と受け止められたときに状況に応じて活性化し、記者が集団で監視から、ガバナンスや編集の自律、組織の安全装置の擁護へ移る役割遂行の論理と定義した（抄録）。", "fun": "記者は中立な立場から報じるのが原則です。でも、その中立を支える仕組み自体が壊されそうになったら、黙って見ているべきでしょうか。この論文は、そんなときに記者が「仕組みを守る側」に回る動きを、偏向でも運動でもない第三の振る舞いとして名前を付けました。", "unverified": "概念的な論文で、実証的な検証は未確認。"}}, {"id": "jn26", "rank": 26, "field": "教育", "headline": "STEM教員のリーダーシップの型と授業革新", "title": "STEM teacher leadership profiles: Connecting innovative teaching and leadership role enactment", "url": "https://doi.org/10.1177/17411432261499267", "authors": "Seoyeon Park ほか", "venue": "Educational Management Administration and Leadership", "date": "2026-10-16", "sjr": 1.797, "citescore": 11.2, "citescore_year": "2025", "apa": "Park, S., & Wiens, P. (2026). STEM teacher leadership profiles: Connecting innovative teaching and leadership role enactment. Educational Management Administration & Leadership. https://doi.org/10.1177/17411432261499267", "why": "数学・理科教員229人のリーダーシップのプロファイルと、革新的な授業・役割遂行の関係を示した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "数学・理科の教員229人の教員リーダーシップのプロファイルを分類し、革新的な授業と役割の遂行との関係を調べた（抄録）。", "p3": "k平均法で5つの教員リーダーシップの次元に基づいて分類し、共分散分析で革新的な授業を、負の二項回帰で役割遂行を比べる。", "p5": "高関与（25人）、中高関与（78人）、発展途上（40人）、低関与（86人、最大）の4つの型が得られ、革新的な授業に有意な群の効果があり（F(3, 216)=9.65、η²=.12）、役割遂行にも差があった（χ²(3)=23.53）。高関与の教員はメンタリングと管理的役割を重視した（抄録）。", "fun": "先生の中にも、学校を引っ張るリーダー役の人がいます。理数の先生を調べると、いちばん多かったのは「あまり関わらない」タイプでした。そして、積極的にリーダー役を担う先生ほど、新しい授業の工夫もしていました。学校の変化は一部の先生に支えられているのかもしれません。", "unverified": "なし"}}, {"id": "jn27", "rank": 27, "field": "教育", "headline": "規制の強い教育制度で参加型リーダーシップを実践する", "title": "Enacting participatory leadership in regulated education systems: Evidence from Lithuanian schools", "url": "https://doi.org/10.1177/17411432261497946", "authors": "Ana Gabriele Sabancevaitė ほか", "venue": "Educational Management Administration and Leadership", "date": "2026-10-16", "sjr": 1.797, "citescore": 11.2, "citescore_year": "2025", "apa": "Sabancevaitė, A. G., & Melnikova, J. (2026). Enacting participatory leadership in regulated education systems: Evidence from Lithuanian schools. Educational Management Administration & Leadership. https://doi.org/10.1177/17411432261497946", "why": "リトアニアの学校で、規制された公教育の中で校長が参加型リーダーシップをどう実践するかを明らかにした。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "規制と説明責任の強い公教育制度の中で、リトアニアの校長たちが参加型リーダーシップをどう経験し、実践しているかを明らかにした（抄録）。", "p3": "現象学に基づく解釈的な方法で、参加型の意思決定に取り組む6人の校長の経験を探る。", "p5": "参加型リーダーシップは、説明責任の構造、階層関係、政治的監督、制度の時間枠に形づくられた中で、常に交渉される実践だった。参加は規範的志向、リーダーの主体性、選択的な組織学習、関係の基盤の4つの次元から成り、校長の判断は参加を広げも狭めもした（抄録）。", "fun": "「みんなで決める学校」は理想的に聞こえますが、規則や報告義務の多い公立校では簡単ではありません。この研究は、校長たちが規則の枠の中で、どこまでなら皆に任せられるかを毎回考えながら進めている姿を描きました。理想と現実の間の綱渡りです。", "unverified": "6人の事例で、一般化の範囲は未確認。"}}, {"id": "jn28", "rank": 28, "field": "教育", "headline": "生成AI時代の大学の評価：体系的レビュー", "title": "Higher education assessments in the age of GenAI: a systematic review", "url": "https://doi.org/10.1186/s41239-026-00627-4", "authors": "Helen Crompton ほか", "venue": "International Journal of Educational Technology in Higher Education", "date": "2026-10-16", "sjr": 7.947, "citescore": 48.4, "citescore_year": "2025", "apa": "Crompton, H., & Burke, D. (2026). Higher education assessments in the age of GenAI: a systematic review. International Journal of Educational Technology in Higher Education, 23(1). https://doi.org/10.1186/s41239-026-00627-4", "why": "生成AIの普及が大学の評価の妥当性・真正性に与える影響を体系的に整理した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "生成AIが大学の評価の実践をどう変えているかを、2024〜2026年に出版された実証研究の体系的レビューで整理した（抄録）。", "p3": "PRISMAに沿って72の研究を特定・分析し、妥当性・真正性・学習成果との整合という評価の原則との関係を検討する。", "p5": "研究は24か国・20の学問分野で行われ、2つの大きな研究目的が見られた（抄録。目的の内容と結論は抄録の取得範囲になし）。", "fun": "レポートをAIが書けてしまう時代に、大学は学生の力をどう測ればよいのでしょうか。このレビューは、世界中の72の研究を集めて、AIが試験や課題の作り方をどう変えつつあるかを整理しています。測り方を変えることは、何を学ぶべきかを問い直すことでもあります。", "unverified": "2つの研究目的の内容と主要な結論は未確認。"}}, {"id": "jn29", "rank": 29, "field": "材料科学", "headline": "秩序化した2次元欠陥相で構造用合金を強くする", "title": "Engineering ordered two-dimensional defect phases to strengthen structural alloys", "url": "https://doi.org/10.1126/science.aeh1409", "authors": "Andreas Bezold ほか", "venue": "Science", "date": "2026-10-15", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "apa": "Bezold, A., Köbrich, M., Vollhüter, J., Feng, L., Amon, L., Karpstein, N., Wang, Y., Spiecker, E., Göken, M., Mills, M. J., & Neumeier, S. (2026). Engineering ordered two-dimensional defect phases to strengthen structural alloys. Science, 394(6821), 306–310. https://doi.org/10.1126/science.aeh1409", "why": "変形の結果とみなされてきた面欠陥を、設計して強化に使う方法をScienceで示した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "予変形と時効処理によって、面欠陥を設計された秩序欠陥相の構造に変え、構造用合金を強化する方法を示した（抄録）。", "p3": "単結晶のコバルト-ニッケル基超合金と多結晶のコバルト-クロム-タングステン合金で、予変形のあと時効させ、整合で原子数層の厚さの秩序欠陥相の密なネットワークを作る。電子顕微鏡とシミュレーションで仕組みを調べる。", "p5": "室温強度が200MPa以上上がり、超合金の最小クリープ速度が3分の1未満に下がった。局所的な化学秩序が強化を増幅し、秩序欠陥相はせん断できる一方で、すべりの伝達を妨げた（抄録）。", "fun": "金属の「欠陥」は、ふつう弱さの原因と考えられます。この研究は逆に、わざと欠陥を作ってから熱を加えることで、欠陥を原子数層の薄い「強化の壁」に作り変えました。悪者だった欠陥を味方につける、という発想の転換が面白い点です。", "unverified": "なし"}}, {"id": "jn30", "rank": 30, "field": "地球科学", "headline": "古気候の制約で北極の冬の海氷予測の幅を狭める", "title": "Palaeoclimate constraints narrow uncertainty in future Arctic winter sea ice projections", "url": "https://doi.org/10.1038/s41561-026-02123-w", "authors": "C. Y. Fu ほか", "venue": "Nature Geoscience", "date": "2026-10-16", "sjr": 6.141, "citescore": 27.3, "citescore_year": "2025", "apa": "Fu, C. Y., Osman, M. B., & Aquino-López, M. A. (2026). Palaeoclimate constraints narrow uncertainty in future Arctic winter sea ice projections. Nature Geoscience. https://doi.org/10.1038/s41561-026-02123-w", "why": "気候モデルの誤差が最も大きい北極の冬の海氷について、古気候データで将来予測の不確実性を減らした。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "完新世中期（5〜7千年前）の北極全域のバイオマーカーの記録で気候モデルの海氷を評価し、ベイズ的なモデル重み付けで、将来の北極の冬の海氷予測の不確実性を狭めた（抄録）。", "p3": "代理指標系モデルを使い、モデル間の相互依存と代理指標の季節性の非定常を考慮した完全に定量的な代理指標-モデル比較で、多モデル平均の冬の海氷面積を重み付けし直す。", "p5": "重み付けで偏りを除き、不確実性を85%減らして年々変動の水準にした。重み付けした予測では、今後数十年、どの排出シナリオでも冬の海氷面積が従来の推定より約100万km²少なくなりうるとした（抄録）。", "fun": "未来の北極の氷を予測するモデルは、何十種類もあって答えがばらばらです。そこで、数千年前の暖かかった時代を、どのモデルがよく再現できるかで「成績」を付け、成績の良いモデルを重く見ました。過去を答え合わせに使って未来の予測を絞り込む、という発想です。", "unverified": "なし"}}, {"id": "jn31", "rank": 31, "field": "物理学", "headline": "隠れた自由度から仕事を取り出す", "title": "The extraction of work from hidden degrees of freedom", "url": "https://doi.org/10.1038/s41567-026-03442-w", "authors": "Lokesh Muruga ほか", "venue": "Nature Physics", "date": "2026-10-16", "sjr": 6.581, "citescore": 29.4, "citescore_year": "2025", "apa": "Muruga, L., Ginot, F., Loos, S. A. M., & Bechinger, C. (2026). The extraction of work from hidden degrees of freedom. Nature Physics. https://doi.org/10.1038/s41567-026-03442-w", "why": "マクスウェルの悪魔に連なる情報熱力学で、直接観測しない自由度から仕事を取り出す実験を示した。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "環境の隠れた自由度に残る記憶（非マルコフ性）から仕事を取り出せることを、光ピンセットで捕らえたブラウン粒子の実験で示した（抄録）。", "p3": "平衡状態の粒子を時間分解で測定し、時間をずらした2回の測定のプロトコルで、隠れた熱浴の自由度から逆流してくる情報を取り出す。", "p5": "情報の逆流は緩和の動きを変え、初期状態の影響と独立に定量化でき、うまく使うと仕事の取り出しを増やした。観測できる自由度だけに蓄えられたエネルギーを超える仕事を取り出せる領域も見つけた（抄録）。", "fun": "「マクスウェルの悪魔」は、情報を使って熱からエネルギーを取り出す思考実験です。この研究は、周りの環境が過去を少しだけ覚えているなら、その記憶もエネルギー源になることを実験で示しました。見えないところに残る記憶まで資源になる、という驚きの結果です。", "unverified": "取り出した仕事の量の具体的な値は未確認。"}}, {"id": "jn32", "rank": 32, "field": "経営学", "headline": "外部連携は地域の知識空間を分岐させるか", "title": "External collaboration and local knowledge divergence in regional knowledge spaces", "url": "https://doi.org/10.1016/j.respol.2026.105641", "authors": "Jisoo Hur ほか", "venue": "Research Policy", "date": "2026-10-15", "citescore": 17.6, "citescore_year": "2025", "apa": "Hur, J., Kogler, D. F., & Kim, K. (2027). External collaboration and local knowledge divergence in regional knowledge spaces. Research Policy, 56(1), 105641. https://doi.org/10.1016/j.respol.2026.105641", "why": "地域の知識構造と外部との共同研究の関係を扱うResearch Policyの論文（抄録なし）。", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも入手できず）", "preprint": false, "short": true, "p1": "題名からは、外部との共同研究が、地域の知識空間（地域が持つ技術分野の構成）の中で、地域固有の知識の分岐をもたらすかを調べた研究と読み取れる。掲載誌はResearch Policy。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "地域の企業や大学が外の組織と協力すると、新しい知識が入ってきます。でもそれは地域の得意分野を伸ばすのか、それとも別の方向へ枝分かれさせるのか。題名からは、外とのつながりが地域の知識の進む方向を変えるか、という問いが読み取れます。", "unverified": "題名のみで、手法・結果はすべて未確認。"}}, {"id": "jn33", "rank": 33, "field": "経営学", "headline": "創造的破壊で得をするのは誰か：米国の起業", "title": "Who Gains from creative destruction? Evidence from high-quality entrepreneurship in the United States", "url": "https://doi.org/10.1016/j.respol.2026.105642", "authors": "Astrid Marinoni ほか", "venue": "Research Policy", "date": "2026-10-16", "citescore": 17.6, "citescore_year": "2025", "apa": "Marinoni, A., & Voorheis, J. (2027). Who Gains from creative destruction? Evidence from high-quality entrepreneurship in the United States. Research Policy, 56(1), 105642. https://doi.org/10.1016/j.respol.2026.105642", "why": "質の高い起業が生む創造的破壊の利益の帰属を扱うResearch Policyの論文（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録は取得できず、OpenAlexで題名が一致する記録（以前の版の可能性）の抄録を使用", "preprint": false, "short": true, "p1": "質の高い起業（創造的破壊）の利益が誰に行き渡るかを、地域の所得格差と所得移動の新しい指標で調べ、利益のほぼすべてが上位10%に帰属することを示した（抄録）。", "p3": "米国コミュニティ調査と全IRS 1040申告を結びつけた地域の格差・移動の指標と、GuzmanとStern（2017）の起業の指標を組み合わせ、固定効果とバーティック型の操作変数で推定する。", "p5": "起業は所得格差を広げ、その増加は個人の利益のほぼすべてが所得分布の上位10%に行くことによる。下位層への小さな正の効果の証拠はまちまちで、所得移動を高める証拠はほとんどなかった（抄録）。", "fun": "新しい会社がどんどん生まれる町は、皆が豊かになりそうです。ところが実際には、その利益のほとんどが上位1割の高所得者に行き、下の層が上に上がるチャンスはほとんど増えていませんでした。イノベーションの恩恵の「行き先」を確かめた研究です。", "unverified": "掲載版と取得した版の抄録が同じ内容かは未確認。"}}, {"id": "jn34", "rank": 34, "field": "経済学", "headline": "労働組合と移民：組合は結束を固めるか", "title": "Closing Ranks: Organized Labor and Immigration", "url": "https://doi.org/10.1086/744504", "authors": "Carlo Medici", "venue": "Journal of Political Economy", "date": "2026-10-15", "sjr": 16.25, "citescore": 11.0, "citescore_year": "2025", "apa": "Medici, C. (2026). Closing Ranks: Organized Labor and Immigration. Journal of Political Economy. https://doi.org/10.1086/744504", "why": "JPEに掲載された、組織労働と移民の関係についての論文（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録は取得できず、Semantic Scholarの抄録を使用", "preprint": false, "short": true, "p1": "1900〜1920年の米国で、移民の流入が組織労働（労働組合）の台頭を促したことを、新しく作った郡単位の組合のデータで示した（抄録）。", "p3": "公文書を電子化して史上初の郡単位の組合データを作り、シフトシェア型の操作変数で、移民による外生的な労働供給の衝撃を取り出す。", "p5": "移民の多い郡では組合の存在と組合員が増えた。効果は熟練労働者、とくに移民との競争にさらされた郡や、移民に否定的な態度の強い地域で大きく、既存の労働者が経済的・社会的な動機で組合化したことと整合した（抄録）。", "fun": "移民が増えると、もともといた労働者は仕事を奪われると感じて団結しました。その結果、労働組合が強くなったのです。題名の「隊列を固める」は、外からの圧力が内側の結束を生むことを表しています。20世紀初めの古い記録を掘り起こして確かめた点も見どころです。", "unverified": "効果の大きさの値は未確認。"}}, {"id": "jn35", "rank": 35, "field": "経済学", "headline": "経済的威圧と分断の理論", "title": "A Theory of Economic Coercion and Fragmentation", "url": "https://doi.org/10.1086/744505", "authors": "Christopher Clayton ほか", "venue": "Journal of Political Economy", "date": "2026-10-15", "sjr": 16.25, "citescore": 11.0, "citescore_year": "2025", "apa": "Clayton, C., Maggiori, M., & Schreger, J. (2026). A Theory of Economic Coercion and Fragmentation. Journal of Political Economy. https://doi.org/10.1086/744505", "why": "JPEに掲載された、経済制裁などの威圧と世界経済の分断を扱う理論論文（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録は取得できず、OpenAlexで題名が一致するNBERワーキングペーパー版の抄録を使用", "preprint": false, "short": true, "p1": "米国や中国のような覇権国が、金融・貿易関係の停止の脅しで他国に影響力を持つ仕組みと、各国の経済安全保障政策が世界経済の分断を生む理論を示した（抄録）。", "p3": "外部の規模の経済や専門化など統合の利益を生む仕組みが、覇権国以外との関係を代替にしにくくし、覇権国の力を高めることをモデル化し、金融サービスを主な応用として力の大きさを推定する。", "p5": "個々の国は経済安全保障政策で得をしうるが、各国がばらばらに覇権国への依存を減らそうとすると、非効率な分断が起きる。米国の地経学的な力は金融サービスに、中国の力は製造業に依存すると推定し、主要部門の調達先を分散すれば少ない分断で多くの安全保障が得られるとした（抄録）。", "fun": "大国は「言うことを聞かないと取引を止めるぞ」と脅すことができます。各国が身を守ろうと大国から離れると、世界経済はばらばらになり皆が損をします。この研究は、すべてを切り離さなくても、要となる部品の買い先だけ分散すれば守りの大半は得られると示しました。", "unverified": "掲載版での推定値は未確認。"}}, {"id": "jn36", "rank": 36, "field": "経済学", "headline": "米国は公立学校に十分支出しているか", "title": "Does the United States spend enough on public schools? Evidence from a market-based efficiency test", "url": "https://doi.org/10.1016/j.jpubeco.2026.105802", "authors": "Patrick J. Bayer ほか", "venue": "Journal of Public Economics", "date": "2026-10-16", "sjr": 3.601, "citescore": 5.6, "citescore_year": "2025", "apa": "Bayer, P. J., Blair, P. Q., & Whaley, K. (2026). Does the United States spend enough on public schools? Evidence from a market-based efficiency test. Journal of Public Economics, 263, 105802. https://doi.org/10.1016/j.jpubeco.2026.105802", "why": "市場に基づく効率性検定で公立学校支出の水準を評価するJournal of Public Economicsの論文（抄録なし）。", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも入手できず）", "preprint": false, "short": true, "p1": "題名からは、米国の公立学校への支出が十分かどうかを、市場に基づく効率性の検定で評価した研究と読み取れる。掲載誌はJournal of Public Economics。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "学校にもっとお金を使うべきか、それとも今のままで十分か。答えるのが難しいこの問いに、題名からは、市場の動き（たとえば住宅価格など）を手がかりに「支出が足りているか」を判定する方法で挑んでいることが読み取れます。", "unverified": "題名のみで、手法・結果はすべて未確認。"}}, {"id": "jn37", "rank": 37, "field": "経済学", "headline": "育休で抜けた人の穴を企業はどう埋めるか", "title": "How do firms respond to parental leave absences?", "url": "https://doi.org/10.1016/j.jpubeco.2026.105803", "authors": "Anne Ardila Brenøe ほか", "venue": "Journal of Public Economics", "date": "2026-10-16", "sjr": 3.601, "citescore": 5.6, "citescore_year": "2025", "apa": "Brenøe, A. A., Krenk, U., Steinhauer, A., & Zweimüller, J. (2026). How do firms respond to parental leave absences? Journal of Public Economics, 263, 105803. https://doi.org/10.1016/j.jpubeco.2026.105803", "why": "育児休業による欠員への企業の対応を扱うJournal of Public Economicsの論文（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録は取得できず、OpenAlexで題名が一致する記録の抄録を使用", "preprint": false, "short": true, "p1": "女性従業員が出産後に休業するとき、企業が採用・雇用・賃金をどう調整するかを、オーストリアの行政データで調べた（抄録）。", "p3": "出産の起きた企業と起きない企業を比べ、休業期間を大きく変えた政策改革を利用する。", "p5": "企業は休業の前後で採用・雇用・賃金を調整したが、効果はすぐに消えた。調整は男女で大きく異なり企業内の強い性別分離を反映した。長い休業の権利は実際の休業を延ばしたが効果は短期的で、出産後5年まで企業の閉鎖には影響しなかった（抄録）。", "fun": "育休を取る人が出ると、会社が困るのではと心配されがちです。ところが調べてみると、会社は一時的に人を雇うなどして対応し、その影響はすぐに消え、会社がつぶれることもありませんでした。育休の長さを延ばしても、会社へのしわ寄せは短期で終わるという結果です。", "unverified": "掲載版と取得した抄録の版の一致は未確認。"}}, {"id": "jn38", "rank": 38, "field": "経済学", "headline": "化石燃料への明示・暗黙の補助金の厚生効果", "title": "The welfare effects of explicit and implicit subsidies on fossil fuels", "url": "https://doi.org/10.1016/j.jpubeco.2026.105804", "authors": "Tim Kalmey ほか", "venue": "Journal of Public Economics", "date": "2026-10-16", "sjr": 3.601, "citescore": 5.6, "citescore_year": "2025", "apa": "Kalmey, T., Rausch, S., & Schneider, J. (2026). The welfare effects of explicit and implicit subsidies on fossil fuels. Journal of Public Economics, 263, 105804. https://doi.org/10.1016/j.jpubeco.2026.105804", "why": "化石燃料補助金の厚生効果を扱うJournal of Public Economicsの論文（抄録なし）。", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも入手できず）", "preprint": false, "short": true, "p1": "題名からは、化石燃料への明示的な補助金と暗黙の補助金（環境費用を価格に入れないことなど）の厚生効果を評価した研究と読み取れる。掲載誌はJournal of Public Economics。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "ガソリンの値下げ補助のように目に見える補助金のほかに、大気汚染の害を値段に含めないことも、実は化石燃料への「見えない補助金」です。題名からは、その両方を並べて、社会全体の得失を比べようとしていることが読み取れます。", "unverified": "題名のみで、手法・結果はすべて未確認。"}}, {"id": "jn39", "rank": 39, "field": "機械学習", "headline": "ハイパーグラフニューラルネットの理論と応用", "title": "Hypergraph Neural Networks: Theoretical Foundations and Applications", "url": "https://doi.org/10.1109/tpami.2026.3744177", "authors": "Yue Gao ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-15", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "apa": "Gao, Y., Feng, Y., Han, X., Wang, J., Du, S., & Ying, S. (2026). Hypergraph Neural Networks: Theoretical Foundations and Applications. IEEE Transactions on Pattern Analysis and Machine Intelligence, 1–19. https://doi.org/10.1109/tpami.2026.3744177", "why": "TPAMIに掲載された、ハイパーグラフ上の学習の理論的基礎の論文（抄録なし）。", "explain": {"basis": "題名", "basis_note": "題名のみ（抄録・本文とも入手できず）", "preprint": false, "short": true, "p1": "題名からは、3つ以上の要素の関係を表せるハイパーグラフ上のニューラルネットワークについて、理論的な基礎と応用を整理した研究と読み取れる。掲載誌はIEEE TPAMI。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "ふつうのネットワークは「2人の間の関係」を線で表しますが、共著論文やグループ会話のように3人以上がまとめて関わる関係もあります。題名からは、そうした「集団の関係」を扱うAIの理論的な土台を固めようとしていることが読み取れます。", "unverified": "題名のみで、手法・結果はすべて未確認。"}}, {"id": "jn40", "rank": 40, "field": "機械学習", "headline": "強化学習で駆動する拡散モデル：言語と視覚", "title": "Reinforcement Learning-driven Diffusion Models: Language, Vision, and Beyond", "url": "https://doi.org/10.1109/tpami.2026.3743845", "authors": "Zhiyuan Ma ほか", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence", "date": "2026-10-15", "sjr": 4.829, "citescore": 41.1, "citescore_year": "2025", "apa": "Ma, Z., Wei, J., Wang, T., Wang, H., Pan, J., Xu, H., Zhao, L., Liu, R., Wang, Y., Zhang, Y., Feng, L., Xiao, J., Zhang, K., Zhu, X., Liu, D., Qi, B., Liu, Y., Cui, G., Ding, N., et al. (2026). Reinforcement Learning-driven Diffusion Models: Language, Vision, and Beyond. IEEE Transactions on Pattern Analysis and Machine Intelligence, 1–26. https://doi.org/10.1109/tpami.2026.3743845", "why": "TPAMIに掲載された、強化学習と拡散モデルの統合を扱う論文（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録は取得できず、Semantic Scholarの抄録を使用", "preprint": false, "short": true, "p1": "強化学習で拡散モデルを事後学習させる研究を初めて包括的に整理し、実験で代表的な手法を比べ、実用化の3つの障害を示したレビュー（抄録）。", "p3": "言語・マルチモーダル・ロボット・科学の拡散モデルでの強化学習の役割を、拡散の軌道の最適化と報酬設計に焦点を当てて整理し、複数の課題別ベンチマークで代表的な手法を評価する。", "p5": "報酬設計のもろさ、高次元の生成空間での探索と活用のトレードオフ、疎な報酬のもとでの学習の不安定さの3つを障害として示し、統合の道筋と今後の方向を示した。最新の動向を追う公開リポジトリも作った（抄録）。", "fun": "画像を作るAI（拡散モデル）は、たくさんの絵を見て学びます。そこに「この絵は良い」とほめる仕組み（強化学習）を足すと、人の好みに合う絵を作れるようになります。ただ、ほめ方を間違えると変な方向に学んでしまう。その落とし穴を整理した総まとめです。", "unverified": "実験の具体的な結果は未確認。"}}, {"id": "jn41", "rank": 41, "field": "機械学習", "headline": "神経の階層処理を備えた大面積のイオントロニクス皮膚", "title": "Large-scale iontronic skins with neural-hierarchical processing architecture", "url": "https://doi.org/10.1038/s42256-026-01325-6", "authors": "Zhibin Li ほか", "venue": "Nature Machine Intelligence", "date": "2026-10-16", "sjr": 6.902, "citescore": 40.9, "citescore_year": "2025", "apa": "Li, Z., Da, B., Shi, J., Wang, T., Si, W., Li, B., He, H., Liao, Z., Wu, T., Han, X., Bai, L., Kong, H., Song, C., & Guo, C. F. (2026). Large-scale iontronic skins with neural-hierarchical processing architecture. Nature Machine Intelligence. https://doi.org/10.1038/s42256-026-01325-6", "why": "Nature Machine Intelligenceに掲載された、触覚センサと階層的処理の論文（抄録なし）。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録は取得できず、題名が一致するResearch Squareのプレプリントの抄録を使用", "preprint": false, "short": true, "p1": "触覚の神経系の階層処理をまねた、1万個を超えるセンサを持つ大面積のイオントロニクス皮膚（NI-skin）を作った（抄録）。", "p3": "周波数に依存するイオントロニクスの受容器に位置を符号化させて並列に伝送し、後段で収束的に圧縮して帯域を減らす、符号化・収束・認知モデル化の層からなる構造にする。", "p5": "空間分解能800µm、時間分解能10.6msを達成し、ロボットが細かな触覚のやり取りや、痛みに関わる機械刺激の知覚による事前のけが回避を行えることを示した（抄録）。", "fun": "人の皮膚には20万を超える感覚の神経があり、それぞれの信号を同時に脳へ送っています。ロボットの皮膚でセンサを増やすと、信号を1つずつ読む方式では遅くなってしまいます。この研究は、神経のように信号をまとめて送る仕組みで、1万個のセンサを素早く読めるようにしました。", "unverified": "掲載版とプレプリント版の内容の一致は未確認。"}}, {"id": "jn42", "rank": 42, "field": "組織行動・心理的安全性", "headline": "政策の現場で公務員は共感をどう使うか", "title": "Mapping empathy in policy work: how public servants understand and use it",
