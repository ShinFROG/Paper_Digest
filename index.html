変量拡散過程の厳密な最尤推定の理論を確立", "title": "Exact and Approximate Maximum Likelihood Estimation for Multivariate Diffusions under High-Frequency Sampling", "url": "https://arxiv.org/abs/2611.22675", "authors": "Duy Nguyen", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Nguyen, D. (2026). Exact and Approximate Maximum Likelihood Estimation for Multivariate Diffusions under High-Frequency Sampling (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22675", "why": "高頻度・長期間で離散観測される多変量エルゴード拡散過程について、厳密な最尤推定量の一致性・漸近正規性・有効性を示し、先行研究が残した未解決問題を解いたとする。閉形式の密度展開との対数尤度の差が一様に無視できることを示す証明で、近似最尤推定が厳密な推定と同等になる条件も得る。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（導入、定理1の主張、モンテカルロの設計と結果の前半）を読んだ。証明の付録は未読", "preprint": true, "p1": "離散的に観測される多変量のエルゴード的な拡散過程について、厳密な最尤推定量（MLE）が高頻度・長期間の観測で一致性・漸近正規性・有効性をもつことを示し、Yangら（2019）やLi（2013）が未解決としていた問題を解いた（§1、定理1）。未査読のプレプリント。", "p2": "拡散過程の推移密度は閉形式でまれにしか得られず、展開による近似尤度が使われてきたが、近似推定量が真の値に収束することを言うには厳密MLEの漸近理論が必要で、1次元の結果（単位ボラティリティへの変換）は多次元に一般化できなかった（§1）。", "p3": "厳密な尤度を直接分析せず、十分高い次数Kのデルタ展開による尤度と比べる。展開が全ての観測された推移で相対誤差の意味で一様に正確なら、二つの対数尤度の差はパラメータについて一様にoP(1)になり、厳密MLEは陽な対比関数の漸近的性質を受け継ぐ（§1、定理1(a)）。極端な観測（標準化した増分が√log n程度）でも高次の展開が正確であることが鍵になる（§4.2）。", "p4": "2変量のOrnstein–Uhlenbeckモデル（厳密な推移密度が計算でき厳密MLEを基準にできる）の3つの設計と、状態依存のボラティリティをもつ非線形の設計で、標準化誤差の平均と標準偏差、被覆率を200回の反復で調べた（§5.1、表2）。", "p5": "サンプリング間隔がΔn≤Cn⁻ᵃで多項式的に縮めば、厳密MLEはドリフトを√(nΔn)、拡散を√nの速さで推定する（定理1）。設計1・2で厳密MLEはガウス極限に近く被覆率は90〜98%で、平均回帰のパラメータに0.1〜0.3標準偏差の小さな上向きの偏りがあった（§5.2、表2）。オイラー近似（K=0）は拡散パラメータで−1.92、−3.30と大きく偏った（表2）。", "p6": "CIRやHestonのように境界でボラティリティが0になる平方根型のモデルは対象外と著者は明記する（§1）。解釈：理論は高頻度・長期間の漸近論で、間隔がモデルの速い時間尺度に比べて小さくない設計3のような状況での有限標本の挙動が実務上の課題になる。", "fun": "株価や金利のように細かく揺れながら動くものを数式で表す「拡散過程」では、パラメータを推定する最も素直な方法の正しさが、多次元では長い間証明されていなかった。この研究は、正確な式を直接扱う代わりに、それを非常によく近似する式と比べることで、遠回りして証明を完成させた。一番まれな大きな揺れまで近似が効くことを示した点が面白い。", "unverified": "証明（付録E–G）と、設計3・4の結果の数値は確認できなかった。"}}, {"id": "pn03", "rank": 3, "field": "機械学習", "headline": "LLMが自分の重みを書き換えて賢くなる", "title": "Language Models Can Rewrite Their Own Weights", "url": "https://arxiv.org/abs/2611.21885", "authors": "Jiajun Fan ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Fan, J., He, N., Yang, C., Mao, A., Zhu, X., Cheng, C., Liang, K., Shen, S., Li, Z., Guo, R., & Liu, G. (2026). Language Models Can Rewrite Their Own Weights (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21885", "why": "勾配も訓練も使わず、27Bのモデルが自分の重みと採点結果から失敗を診断し、原因となる重みを書き換える「自己書き換え」を示す。事前に固定した未見の490問で正答率が6.6ポイント上がり、自らのテストで裏づけた編集だけを提出して改善を重ねたと報告する。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（問題定義、セッションの仕組み、実験設定、§3.3–3.4、表1、結論と付録Aの一部）を読んだ。§3.5以降の詳細と付録Eは未読", "preprint": true, "p1": "勾配も訓練も使わず、27Bの言語モデルが自分の重みと採点結果を読み、失敗の原因を診断して自分の重みを書き換え、未見の問題で正答率を上げられること（自己書き換え）を示した（抄録、§2–3）。未査読のプレプリント。", "p2": "言語モデルは一度訓練して凍結されるため、改善には再訓練が要り、プロンプトや推論時の追加計算の効果は課題が終わると消える。大きなモデルが小さなモデルの重みを編集した例はあったが、自分自身の重みを改善できるかは分かっていなかった（§1）。", "p3": "モデルは20回の順伝播と200回のコード実行の予算の下で、Pythonで自分の重みを読み書きし、隠れ状態を読み、編集前後で同じ問題・同じ乱数の対の検定を行う（§2.2）。例えば、解き終わる答えとトークン切れの答えの隠れ状態の差の方向uを求め、層8の2つの出力行列から W←W−0.05uuᵀW でその方向を5%弱めた（表1）。", "p4": "Qwen3.5の2B・4B・9B・27Bで、DeepScaleRの3,000問を練習に、重複を除いた1,000問を保留にし、自分の重みの改善と、1つの層のMLP出力行列8行を雑音で壊した自分の複製の修復を、事前に固定した対の評価で比べた（§3.1）。", "p5": "抄録によれば自分の編集で未見の490問の正答率が6.6ポイント上がった。表1の第1プロトコルの編集では練習の課題で22.4%から29.6%、事前に固定した評価で57.2%から58.3%（有意）だった。壊れた複製では異常な行列（中央値の1,397倍の重み）を特定し、15倍で切り詰めて保留問題の正答率を0.0%から33.0%に戻した（基準58.5%、表1）。2Bは編集せず、4B・9Bは自分を壊した（抄録）。", "p6": "自然な失敗では、編集が効かないとき「書き換えられない」のか「重みに原因がない」のかを区別できないと著者は述べる（付録A）。解釈：1つのモデル系列の数学の課題での結果で、改善の多くは「トークン切れで終わらない」失敗への対処に見え、他の種類の誤りへの一般化が残る疑問である。", "fun": "人は勉強しながら考え方を直していけるが、AIは訓練が終わると脳の配線（重み）が固定される。この研究では、AIに自分の配線図を見せて「どこを直せば成績が上がるか」を自分で考えさせた。すると大きなAIは、答えが長引いて終わらない原因の方向を見つけ、そこを少し弱めて成績を上げた。小さなAIは自分を壊してしまった点も含めて面白い。", "unverified": "抄録の6.6ポイントが第2プロトコルのどの編集かを本文の図1で確認できなかった。画像ベンチマークでの7%→70%の詳細（§3.6以降）も未読。"}}, {"id": "pn04", "rank": 4, "field": "統計学", "headline": "LLMリーダーボード首位の「勝者の呪い」を補正", "title": "SOTA or Luck? The Winner's Curse in LLM Leaderboards", "url": "https://arxiv.org/abs/2611.22227", "authors": "Sikun Xu ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Xu, S., Thomadsen, R., Zhang, D. J., & Zhang, H. (2026). SOTA or Luck? The Winner's Curse in LLM Leaderboards (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22227", "why": "雑音のあるベンチマーク得点で順位をつけると首位の性能が運によって過大になる偏りを定式化し、m-out-of-Nブートストラップで補正する。14のベンチマークで首位の補正は約0.09〜3.86ポイントで、SWE-bench Verifiedでは173モデル中13モデルが首位層に入るとする。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（モデルとブートストラップ、保留分割による検証、SWE-bench Verifiedの結果、適用範囲と限界の節）を読んだ。証明と補足の付録は未読", "preprint": true, "p1": "LLMのリーダーボードで、雑音のあるベンチマーク得点を並べ替えるだけで首位のモデルの得点が運によって過大になる「勝者の呪い」を定式化し、m-out-of-Nブートストラップで偏りを補正し、順位の区間と同等の層を示す手法RULERを作った（抄録、§2）。未査読のプレプリント。", "p2": "各モデルの平均得点は不偏でも、並べ替えて上位を選ぶと選択の効果が入り、1モデルの標準誤差では捉えられない。順位は同点で滑らかでないため通常のブートストラップの正当化が成り立たない（§2、§2.1）。", "p3": "課題ごとの得点の行が独立同分布で、同じ課題でのモデル間の任意の相関を許す。観測した課題からm=⌊N^γ⌋個（m<N）を復元抽出して並べ替えを繰り返し、各順位の偏り bN(k)=E[τ̂π̂(k)−τπ̂(k)] と、モデルjが順位kに置かれる確率の行列を推定する（§2、§2.1）。", "p4": "課題を選択用と評価用に半分ずつ分け、選択側で順位づけと補正をして評価側の不偏な得点と比べる保留検証（14のベンチマーク、200回の分割）と、既知の平均を使う較正シミュレーションで確かめた（§3）。", "p5": "保留検証で首位の平均誤差の大きさは2.38から0.73ポイントに減り（69.5%減）、2〜5位でも46.9〜55.0%減った（表1）。SWE-bench Verified（173モデル・500課題）では79.2%で並んだ2つの首位がそれぞれ0.90ポイント下方修正され、80%の順位区間は[1,6]だった（表3）。", "p6": "結果はそのベンチマークの課題の母集団について言えることで、汚染、適応的な提出、選択的な報告による偏りは扱わず、平均の差が標本の雑音と同程度だと残差や過補正が起こりうると著者は認める（Scope and Limitations）。", "fun": "テストの点数で1位になった人は、実力に加えて「その日の運」も味方していることが多い。だから次のテストでは少し点が下がりがちだ。AIの性能ランキングでも同じことが起き、トップのAIの点数は運の分だけ高く見えている。この研究は、その水増し分を計算で差し引き、「本当に1位と言えるのは誰か」を確率で示した。ランキングの見方を変える点が面白い。", "unverified": "較正シミュレーションの数値（§3.2）と、他のベンチマークの補正の詳細（表3以外）は確認できなかった。"}}, {"id": "pn05", "rank": 5, "field": "経済学", "headline": "戦争によるエネルギー高で低所得層の支出が不安定に", "title": "Wars, Energy Shocks and Household Finances: A Natural Experimental Investigation of Financial Vulnerability", "url": "https://doi.org/10.2139/ssrn.7696459", "authors": "Gbenga Ibikunle ほか", "venue": "SSRN", "date": "2026-11-17", "apa": "Ibikunle, G., Vriz, G. L., & Cojoianu, T. (2026). Wars, Energy Shocks and Household Finances: A Natural Experimental Investigation of Financial Vulnerability. https://doi.org/10.2139/ssrn.7696459", "why": "英国大手銀行の約70万口座の取引データを使い、ロシアのウクライナ侵攻を外生的なショックとして所得水準が家計の脆弱性に与える因果的な調整効果を推定する。低所得者の月内の支出の変動が高所得者に比べて64.7%増えたなど、消費の平準化の制約が大きいことを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "p1": "英国の大手商業銀行の個人の取引データで、ロシアのウクライナ侵攻によるエネルギーの価格ショックの下、低所得の人ほど支出の変動と支出-所得の差が大きくなり、家計の脆弱性が所得水準で強く異なることを示した（抄録）。未査読のプレプリント。", "p2": "社会経済的な要因が家計の金融の脆弱性の変化をどう調整するかを、外生的なショックを使って因果的に識別したい（抄録）。従来研究との違いの詳細は未確認。", "p3": "2019〜2023年の698,688の有効口座の数億件の収入・支出の記録で、ロシアのウクライナ侵攻を外生的なショックとして、所得水準が脆弱性に与える因果的な調整効果を、収入と支出の相互作用に基づく指標の変化で推定した（抄録）。推定のモデルの形は未確認。", "p4": "月内の支出の変動、支出-所得の差などの指標を、低所得と高所得、年金・給付に頼る人で比べた（抄録）。", "p5": "低所得者の月内の支出の変動は高所得者に比べて64.7%増えた。他の収入源を統制すると支出-所得の差は2.8%から5.0%に広がり、年金や給付に頼る人は低所得層と同程度の脆弱性を示した（抄録）。", "p6": "抄録には限界の記述がない。解釈：1つの銀行の口座データで、他行の口座や現金の動きが見えないため、家計全体の収支の把握には限界がありうる。", "fun": "戦争で電気代やガス代が急に上がったとき、家計への打撃は誰でも同じではない。70万人近い銀行口座の動きを追うと、所得の低い人ほど月の中での支出の上下が激しくなっていた。お金に余裕がないと、出費をならして乗り切ることができないからだ。遠い戦争が、口座の数字の揺れとして暮らしに表れる点が面白い。", "unverified": "本文は入手できず、識別の方法（比較の設計）と、推定値の信頼区間は確認できなかった。"}}, {"id": "pn06", "rank": 6, "field": "経済学", "headline": "米中貿易戦争でAIに曝された職種の求人がより減少", "title": "Trade Shocks and Hiring Reallocation along a Technology-Related Task Margin Evidence from Chinese Online Vacancy Postings", "url": "https://doi.org/10.2139/ssrn.7719679", "authors": "Hongling Chen ほか", "venue": "SSRN", "date": "2026-11-17", "apa": "Chen, H., Ding, H., & Xie, M. (2026). Trade Shocks and Hiring Reallocation along a Technology-Related Task Margin Evidence from Chinese Online Vacancy Postings. https://doi.org/10.2139/ssrn.7719679", "why": "約9億件の中国のオンライン求人と301条関税の業種別の曝露、AI職業曝露指数を使い、関税の影響が大きいほど求人が減り、AI曝露の高い職種でより大きく減ったことを示す。技術志向の貿易ショックが企業内の職種構成の再配分を通じて労働需要を変えることを明らかにする。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "p1": "2018年の米中貿易戦争で、関税の影響を強く受けた中国企業ほど求人を減らし、その減少はAIに置き換えられやすい職種で大きく、企業内の職種構成の再配分が労働需要の調整の重要な経路であることを示した（抄録）。未査読のプレプリント。", "p2": "技術志向の貿易ショックが、雇用の規模だけでなく職種の構成まで変えるのかは分かっていなかった（抄録）。", "p3": "約9億件のオンライン求人、業種別の301条関税の曝露、AI職業曝露指数（AIOE）を組み合わせ、関税の時間的な変動を使って同じ企業の中で職種間の求人を比べた（抄録）。", "p4": "求人数を主な結果とし、掲載賃金と履歴書に基づく雇用の割合も調べ、技術の追い上げ圧力・競争の強さ・定型性・認知性・STEMかどうか・資格要件で効果の違いをみた（抄録）。", "p5": "関税の曝露が1標準偏差大きいと、AIOEが1標準偏差高い職種の求人がさらに0.9%減った。負の勾配は技術の追い上げ圧力と競争の強い業種に集中し、定型・非認知・非STEMの職で強く、資格・業務要件の高い求人では弱かった。賃金と雇用の割合も同様だった（抄録）。", "p6": "抄録には限界の記述がない。解釈：オンライン求人は企業や職種によって掲載の偏りがあり、オフラインの採用を含めた労働需要の全体を代表するかは本文で確かめる必要がある。", "fun": "米国が中国製品に関税をかけると、中国の会社は人を雇うのを控える。約9億件の求人広告を調べると、減り方は職種によって違い、AIに置き換えられやすい仕事ほど大きく減っていた。外からの圧力をきっかけに、会社が「どんな人を雇うか」まで変えていたことになる。貿易と技術の変化が同じ職場で重なって表れる点が面白い。", "unverified": "本文は入手できず、固定効果の構成と標準誤差の扱いは確認できなかった。"}}, {"id": "pn07", "rank": 7, "field": "因果推論", "headline": "短期の実験と長期の観察で長期の分位処置効果", "title": "Long-Term Quantile Treatment Effects with Combined Experimental and Observational Data", "url": "https://arxiv.org/abs/2611.22984", "authors": "Nan Liu ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Liu, N., Liu, Y., Sasaki, Y., & Zhang, Y. (2026). Long-Term Quantile Treatment Effects with Combined Experimental and Observational Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22984", "why": "短期の実験データに長期の観察データを組み合わせる設定で、長期の分位処置効果の曲線の識別、効率的影響関数、セミパラメトリック効率推定、分位全体での同時信頼帯を与える。平均だけでなく効果の分布の長期的な違いを推論できる。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（導入、モデルの設定、シミュレーションの設計と結果の表2–3）を読んだ。識別・推定の証明（付録A）は未読", "preprint": true, "p1": "短期の実験データに長期の観察データを組み合わせて、長期の分位処置効果（LTQTE）の曲線を識別し、効率的影響関数に基づくセミパラメトリック効率推定と、分位全体での同時信頼帯を与えた（抄録、§1）。未査読のプレプリント。", "p2": "実験は処置の割り当てが統制されるが長期の追跡が難しく、観察データは長期の結果が測れるが処置の選択が内生的になる。両者を組み合わせる研究（Athey・Chetty・Imbensら）は平均の効果に集中しており、効果の分布の違いを扱えなかった（§1）。", "p3": "Athey・Chetty・Imbens（2025）の潜在的な非交絡（latent unconfoundedness）の枠組みで、短期の結果を潜在的な制御変数として使い、観察母集団での長期の潜在的結果の分位点 qw,τ の差 Δτ=q1,τ−q0,τ を識別する（式2.1）。効率的影響関数を導き、交差適合の統合M推定と乗数ブートストラップで点ごと・一様の推論を行う（§3–5）。", "p4": "n=500、1,000回の反復のシミュレーションで、組み合わせた推定量と観察データだけの推定量の95%区間の被覆率を、分位0.1〜0.9の点ごとと、81の分位での同時で比べた。局外関数の推定にはLassoを使った（§7）。", "p5": "点ごとの被覆率は、組み合わせた推定量で0.926〜0.957、観察データだけでは0.793〜0.903にとどまった（表2）。81分位の同時被覆率は、ブートストラップの臨界値で0.957〜0.976、点ごとの1.96を使うと0.490〜0.523に落ちた（表3）。", "p6": "読んだ範囲では著者の限界の記述を確認できなかった。解釈：識別は潜在的な非交絡という検証の難しい仮定に依存し、実データへの応用は示されていないため、実務での仮定の妥当性の確認が残る。", "fun": "職業訓練の効果を知りたいとき、実験では数年後の収入まで追いかけるのが難しく、長く追跡できる観察データには「訓練を受けた人はもともと意欲が高い」という偏りが混じる。この研究は両方のデータの長所を組み合わせ、平均だけでなく「収入の低い人や高い人にとって効果がどう違うか」まで長期で推定できるようにした。分布の形の変化を見る点が面白い。", "unverified": "識別の定理の正確な条件と証明（§3、付録A）、補助回帰（§6）の内容は確認できなかった。"}}, {"id": "pn08", "rank": 8, "field": "因果推論", "headline": "重なりの診断はDMLの識別を保証しない", "title": "Overlap Is Not Identification: Reactive Pricing, Exogenous Variation, and Double Machine Learning", "url": "https://doi.org/10.2139/ssrn.7697558", "authors": "Vikranth Reddy Moola ほか", "venue": "SSRN", "date": "2026-11-18", "apa": "Moola, V. R., & Mukhopadhyay, A. (2026). Overlap Is Not Identification: Reactive Pricing, Exogenous Variation, and Double Machine Learning. https://doi.org/10.2139/ssrn.7697558", "why": "アルゴリズムで価格を決めるプラットフォームでは価格と結果が予測を通じて交絡し、二重機械学習で使われる重なり（overlap）の診断値が高くても推定が大きく偏りうることを示す。調整を細かくすると重なりが下がり推定値が動く場合に警告する診断を提案し、ライドシェアなどのデータで検証する。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "p1": "アルゴリズムで価格を決めるプラットフォームの価格効果を二重機械学習（DML）で推定するとき、信頼性の根拠とされる重なり（overlap）の診断値は外生的な変動と見逃した交絡の両方を含むため、高くても推定が大きく偏りうることを示し、新しい診断を提案した（抄録）。未査読のプレプリント。", "p2": "価格アルゴリズムは供給が少ないと予測される場所で価格を上げるので、価格と結果は価格の効果以外の理由で一緒に動く。DMLの研究は、統制変数で説明できない価格の分散の割合（重なり）で信頼性を示すことが多い（抄録）。", "p3": "重なりの診断値を、効果を識別する外生的な変動と、統制が拾えない交絡の変動に分解し、自らの予測に反応する価格規則は予測が記録されない限り交絡を生み、局外モデルの誤差も交絡を生むことを示した。調整を細かくすると重なりが下がり推定値が動くときに警告する「重なり膨張の診断」と、感度の転換点の基準を提案した（抄録）。", "p4": "シミュレーション、ニューヨーク市のライドシェアの記録を使った半合成の研究、ニューヨーク市の配達アプリの公開データに合わせた配達型の研究で、事前に固定した診断の規則がどの調整を警告するかを評価した（抄録）。", "p5": "事前に固定した規則は、最も軽いものを除くすべての交絡のある調整を警告し、無害な調整はほとんど警告しなかった。予測を記録すると偏りは消えた（抄録）。", "p6": "抄録には限界の記述がない。解釈：診断は「より細かい調整」が利用できることを前提とするため、統制変数の候補が限られる実データでの感度が残る疑問である。", "fun": "アプリの料金を決めるAIは、混みそうな場所で値段を上げる。だから「値段が高いところで利用が少ない」というデータを見ても、値段のせいか混雑の予想のせいかが分からない。この研究は、統計学者が安心材料にしてきた診断の数字が高くても、答えが大きく間違いうることを示した。AIの予想を記録しておくだけで偏りが消える、という処方の簡単さが面白い。", "unverified": "本文は入手できず、シミュレーションでの偏りの大きさと、ライドシェアの研究の具体的な数値は確認できなかった。"}}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "AIレビュアーで保守の負担はむしろ増える", "title": "Does the AI Reviewer Alleviate or Aggravate the Maintenance Burden? Evidence from GitHub Copilot Reviewer", "url": "https://arxiv.org/abs/2611.22793", "authors": "Feiyang (Amber) ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Feiyang, Xu, Medappa, P. K., & Tunc, M. M. (2026). Does the AI Reviewer Alleviate or Aggravate the Maintenance Burden? Evidence from GitHub Copilot Reviewer (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22793", "why": "GitHub Copilot Reviewerの導入を自然実験とし、AIによるコードレビューがOSSの保守者の負担と貢献行動をどう変えるかを分析する。導入直後にプルリクエストとレビューの負担が急増し、人の貢献は減る一方でボットの提出が続き、AIレビューは効率を上げても保守の負担を重くすると報告する。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（データ、識別戦略、モデル、結果の要点、限界の節と表のキャプション）を読んだ。表の全係数は本文中の記述の範囲", "preprint": true, "p1": "2025年のGitHub Copilot Reviewerの導入を自然実験として、AIのコードレビューがOSSの保守者の負担を増やし、人の貢献は一時的に増えた後に減り、ボットの貢献は増え続けることを示した（抄録、§5）。未査読のプレプリント。", "p2": "AIのレビューは速く標準化された評価を大規模に提供するが、貢献の行動と保守者の負担をどう変えるかは実証されていなかった（§1）。", "p3": "2022年7月〜2024年2月に始まったPython中心のリポジトリをGitHubのAPIで集め、Copilot Reviewerの段階的な導入を使うCallaway–Sant'Annaの段階的な差の差法で保守者の月単位の負担を推定し（式1）、プルリクエスト単位ではマージまでの時間をリポジトリで層化したCoxの比例ハザードモデルで分析した（§4）。", "p4": "保守者がレビューするコメント数とPR数、管理するリポジトリ数、人とボットのPR提出数、PRの大きさ（追加行・変更ファイル・コミット）、マージまでの時間を結果とし、先行・遅行係数と導入のオン・オフで頑健性を確かめた（§4.3、§7）。", "p5": "導入後、保守者がレビューするPRあたりのコメントは約14%、PRは10%増えた（表2）。人とボットのPR提出はそれぞれ約8%と5%増え、人のPRは導入直後に急増した後に対照を下回り、ボットのPRは増え続けた（表3、図5）。人のPRは小さくなり（変更ファイル−33.8%、コミット−15.9%）、Coxモデル（643,272件）ではAIレビューが人のPRのマージを速め、ボットのPRは遅くした（表4–5）。", "p6": "生成AI以外の自動化ツールの効果を切り分けにくいこと、OSSの開発に限られること、PRの大きさの代理変数が品質の全ての側面を捉えないことを著者は認める（§8.3）。", "fun": "AIがプログラムの審査を手伝ってくれれば、管理者は楽になるはずだ。ところが実際には、審査が速くなったぶん提出が増え、とくに自動で作られる提出が止まらず、管理者の仕事はむしろ増えた。人の提出は最初だけ増えて、その後は減っていった。便利な道具が仕事を減らすとは限らず、仕事の流れそのものを変えてしまう点が面白い。", "unverified": "表2–5の全係数の値と、先行係数による平行トレンドの確認の詳細は確認できなかった。"}}, {"id": "pn10", "rank": 10, "field": "統計学", "headline": "封印した検証データでAIアナリストの発見を認証", "title": "Refereeing the AI Agentic Analyst Community: Rolling Sealed Folds and Online e-values for False Discovery Control in Autonomous Data Analysis", "url": "https://doi.org/10.2139/ssrn.7700421", "authors": "John Christiansen", "venue": "SSRN", "date": "2026-11-18", "apa": "Christiansen, J. (2026). Refereeing the AI Agentic Analyst Community: Rolling Sealed Folds and Online e-values for False Discovery Control in Autonomous Data Analysis. https://doi.org/10.2139/ssrn.7700421", "why": "自律的なAIアナリストが大量の仕様探索をする状況で、データを探索用と封印した部分に分け、e値で発見を逐次に認証する「ローリング・シール」を提案する。分析者の振る舞いや主張の順序・依存関係によらず、認証された発見の偽発見率を指定の水準以下に抑えることを証明する。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "p1": "自律的なAIアナリストの振る舞いをモデル化できなくても、データを封印した部分で発見を逐次に認証すれば偽発見率を保証できる「ローリング・シール」を提案し、模擬研究と実際のAIエージェントの事例で示した（抄録）。未査読のプレプリント。", "p2": "AIアナリストは数分で数百の仕様を試し最も目立つ結果を報告でき、仕様探索に誘導されたり与えられた事前の考えに結論が引きずられたりする。独立の審査者が、振る舞いを知らない分析者の発見について何を約束できるかが問題になる（抄録）。", "p3": "データを公開の探索用と封印した部分に分け、分析者が主張を確定するとe-LONDで必要な証拠の量が決まる。各回の終わりに新しい封印部分を一度だけ開き、各主張の賭けのe値を累積の証拠に掛け、使った部分は分析者に渡す。有界な平均の差と水準について正確な非パラメトリックのe値を与え、暗号化した保管庫やMCPの接続をもつ審査者HERDSMANを公開した（抄録）。", "p4": "1,500の模擬研究で、審査なしの報告と再利用するホールドアウトと比べて偽発見の割合と検出力を評価し、最先端のAIエージェント6体に合成の融資実験を中立・圧力・懐疑・部分集団探しの指示で分析させる事例研究を行った（抄録）。", "p5": "効果のない研究で審査なしの報告は93〜100%で偽の発見を含んだが、ローリング・シールの偽発見率は1.0%を超えなかった。推定値を公開する再利用ホールドアウトは雑音から作った複合主張を100%認証したが、ローリング・シールは0%だった。事例研究では確定した主張はすべて真で、101件中81件を認証した（抄録）。", "p6": "妥当性の代わりに検出力が下がり、その大きさを定量化したと著者は述べる（抄録）。事例研究では小さな延滞の効果が確認できずに残った（抄録）。解釈：封印に回すデータの分だけ探索に使えるデータが減るため、標本が小さい研究での使いやすさが課題になる。", "fun": "AIに分析を任せると、何百通りも試して「すごい発見」だけを報告しかねない。この研究は、データの一部を金庫にしまって分析者に見せず、主張を宣言した後でだけ金庫を開けて確かめる仕組みを作った。分析者がどんなにずる賢くても、金庫を開ける順番さえ守れば、間違った発見が通る割合を数学的に抑えられる。審判役のルール設計で信頼を保つ発想が面白い。", "unverified": "本文は入手できず、検出力の低下の具体的な大きさと、e値の構成の詳細は確認できなかった。"}}, {"id": "pn11", "rank": 11, "field": "機械学習", "headline": "LLMが重みを直接書いて実機のトラクタを操舵", "title": "Weight-space programming for tractor guidance controller: large language models natively write neural network weights that steer a real tractor", "url": "https://arxiv.org/abs/2611.21958", "authors": "Timo Oksanen", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Oksanen, T. (2026). Weight-space programming for tractor guidance controller: large language models natively write neural network weights that steer a real tractor (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21958", "why": "LLMが自然言語の仕様に従ってニューラルネットの重みを直接読み書きする「重み空間プログラミング」を、253パラメータの自動操舵ネットワークに適用する。別のトラクタ用の重みの修復とゼロからの書き込みを少ないシミュレーション評価で行い、進化戦略・勾配降下・純追従法とシミュレーションと実機で比べた。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（ネットワークの構成、結果の概要と表5、実機試験の結果、考察の冒頭）を読んだ。各LLMセッションの詳細（§4.2–4.8）は流し読み", "preprint": true, "p1": "LLMが最適化器も勾配も使わずにニューラルネットの重みを直接読み書きする「重み空間プログラミング」で、253パラメータのトラクタ自動操舵ネットワークを別機体用から修復し、ゼロの重みから書き上げ、実機のトラクタを介入なしに操舵できることを示した（抄録、§4.1、§5.4）。未査読のプレプリント。", "p2": "学習済みの操舵ネットワークは、操舵アクチュエータが遅くなるなど機械が変わると適応し直す必要がある。再学習には多くのシミュレーションが要り、進化戦略などの探索はゼロからでは制御器を見つけられない（§1、§4.1）。", "p3": "0.05秒ごとに車体の姿勢・操舵の状態・前方の経路（4 m以下の区間4つ）を受け取り、共有の符号化器（9-4-4、60パラメータ）と出力部（22-8-1、193パラメータ）で操舵速度を出す固定構造のネットワークを使い（§3.2）、GPT-6 AstraとClaude Fable 5.1（5.2）に、少ないシミュレーション評価の予算で重みを編集させた（§3.5–3.6）。", "p4": "512本の未見のランダム経路で、平均RMS横偏差（cm）に失敗率の200倍を足した指標J・失敗数・最大誤差を、進化戦略、勾配降下、純追従法（pure pursuit）、PPOで学習したネットワークと比べ、研究用トラクタAMX G-tracの実機でも試した（表5、§5）。", "p5": "シミュレーションの結果を返すと、両LLMとも学習済みの網を1回のセッションで修復し、ゼロの網から動く制御器を書き、4つの最終制御器のうち3つは512経路を失敗なしで走り切った（Fableの修復は1失敗）。同じ予算の探索はゼロからでは見つけられなかった（§4.1）。実機では51分の走行を介入なしで終え、RMS横偏差は12.6 cm（勾配降下）〜27.8 cm（Fableのゼロから）で、純追従法は18.5 cm、LLMで最良はFableの修復の19.8 cmだった（§5.4、図8）。", "p6": "勾配降下ははるかに多いシミュレーションでより高い精度に達し（抄録）、シミュレーションなしの修復は10回中2回しか成功しなかった（§4.1）。推論の要約は提供者の非公開の方法で書かれ、1セッションずつなので、モデルの計算過程そのものではないと著者は断る（§6.1）。", "fun": "AIの中身の数字（重み）は、普通は大量のデータで少しずつ自動調整して決める。この研究では、別のAIに「このトラクタはハンドルの反応が遅いから直して」と言葉で頼むと、数字を一つずつ読んで制御工学の理屈で書き換え、本物のトラクタをまっすぐ走らせた。ゼロから書かせると、技術者が設計するような見通しのよい形になった点が面白い。", "unverified": "LLMのセッションごとの予算の使い方（§4.5–4.6）と、勾配降下の比較（§4.7）の数値は確認できなかった。"}}, {"id": "pn12", "rank": 12, "field": "組織行動・心理的安全性", "headline": "AI4Scienceのチームは知識の組合せの幅で差", "title": "Embedding or bridging? AI4Science teams differ more in knowledge recombination than in problem novelty", "url": "https://arxiv.org/abs/2611.22366", "authors": "Yun Fu ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Fu, Y., & Ding, J. (2026). Embedding or bridging? AI4Science teams differ more in knowledge recombination than in problem novelty (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22366", "why": "1990〜2025年のAI4Science論文489,409本を所属に基づく7つの組織構成に分け、問題の新規性・知識の組合せの幅・掲載先・被引用を比べる。構成による差は問題の新規性では小さく知識の組合せの幅では大きく、部門をまたぐ橋渡し型ほど組合せが広いと報告する。", "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（データとコーパス構築、組織構成の定義、知識創造の指標、結果の一部、限界の節と図のキャプション）を読んだ", "preprint": true, "p1": "1990〜2025年のAI4Science論文489,409本を著者の所属単位から7つの組織構成に分け、構成による差は問題の新規性では小さく知識の組合せの幅では大きいこと、組合せの広さが研究のインパクトの高さとは一致しないことを示した（抄録、§4）。未査読のプレプリント。", "p2": "AIが科学研究を変えつつあるが、AIの作業と分野の科学の作業をどう組織するかが研究の成果のどの側面と関係するかは分かっていなかった（§1）。", "p3": "Web of ScienceのSCIE・SSCIから計算機科学の外のAI関連論文を集め（OpenAlexで新しいAI用語を拾う）、所属の下位単位を科学（S）・AI（A）・融合（H）に分類して、3つの埋め込み型と4つの橋渡し型の構成を作った（§3.1–3.2）。問題の新規性は、Qwen3-235Bで抽出した研究課題の埋め込みと同分野の過去5年の論文の上位20件の類似度から N=1−平均cos で、組合せの幅は引用文献の対の距離の90パーセンタイルで測った（§3.3）。", "p4": "2006〜2025年について、新規性と組合せの幅（標準偏差単位の調整済みの差）、JCIのQ1誌への掲載、Nature・Science・Cell・PNASの4誌への掲載、上位10%被引用と正規化被引用を構成ごとに比べた（§3.4–3.5）。", "p5": "新規性の差は小さく、最大のAI単位の埋め込みでも+0.030 SDで、橋渡し型は−0.001〜+0.011 SDだった（§4）。組合せの幅はAI志向の橋渡しで+0.197 SD、融合志向で+0.160 SD、複数志向で+0.140 SDと大きかった（§4）。Q1誌への掲載と被引用で最も一貫して正の関連を示したのは科学志向と複数志向の橋渡しで、4誌への掲載では有意な優位はなかった（抄録）。", "p6": "組織構成は所属単位の志向からの推定で研究者の専門性や協働の過程を直接測っておらず、第一著者の扱いや分野の慣行の違い、LLMによる課題抽出と組合せの指標の測定誤差を著者は認める（§5.3）。", "fun": "AIを使う科学研究で、AIの専門家と分野の専門家が同じ部署にいるのがよいか、部署をまたいで組むのがよいか。約49万本の論文を調べると、部署をまたぐチームほど幅広い分野の知識を組み合わせていたが、問題そのものの新しさはあまり変わらなかった。しかも知識の組合せが広いほど引用されるわけでもなかった。「混ぜれば良くなる」は単純すぎるという点が面白い。", "unverified": "調整に使った統制変数の一覧と、インパクトの結果（図7–8）の数値は確認できなかった。"}}, {"id": "pn13", "rank": 13, "field": "環境・気候政策", "headline": "2026年の世界のCO2排出は前年並みと日次推計", "title": "Projection of global daily CO2 emissions in 2026", "url": "https://arxiv.org/abs/2611.22406", "authors": "Tao Li ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Li, T., Deng, Z., Ciais, P., Davis, S. J., Ye, L., & Liu, Z. (2026). Projection of global daily CO2 emissions in 2026 (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22406", "why": "Carbon Monitorの日次推計（2019年〜2026年9月）とProphetによる年末までの予測を組み合わせ、2026年の世界の化石燃料・産業のCO2排出を38.1 Gt（前年比+0.10%）と見積もる。地域ごとの増減の約94%が相殺し合い、世界全体ではほぼ横ばいになるとする。", "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（日次予測と不確実性の方法、予測評価の§3.7と表5、適用範囲の§4.5、図表のキャプション）を読んだ。地域・部門別の結果（§3.3–3.6）は抄録と図のキャプションの範囲", "preprint": true, "p1": "Carbon Monitorの日次の活動ベースの推計（2019年1月〜2026年9月）と年末までのProphetの予測を組み合わせ、2026年の世界の化石燃料・産業のCO2排出を38.1 Gt、前年比+36.6 Mt（+0.10%）とほぼ横ばいと見積もり、地域ごとの増減の大半が相殺し合うことを示した（抄録、§3.2）。未査読のプレプリント。", "p2": "世界の排出は歴史的な高水準近くにあるが、最近の伸びの鈍化は通常の排出インベントリが出るまで評価が難しい（抄録、§1）。", "p3": "47の地域×部門の日次系列それぞれに、線形のトレンド・年と週の季節性・祝日とパンデミック期間を含む加法型のProphetモデルを9月30日まで当てはめ、10〜12月を予測して合計した（§2.2）。不確実性は部門ごとの推計誤差（電力14.0%、産業36.0%など）と予測の誤差を500回の対の抽出で合わせた（§2.3）。", "p4": "2021〜2025年について9月末で打ち切る事後予測を5回行い、続く92日間の日次誤差（MAE・RMSE）と年の偏りを、前年同日の値を使う季節ナイーブ法と比べた（§2.3、§3.7）。EDGAR、Climate TRACE、IEA、各国インベントリとも比べた（§3.1）。", "p5": "前年比の68%範囲は+0.011〜+0.18%で、地域の増加0.32 Gtと減少0.29 Gtの94.0%が相殺し、中国が最大の減少（−0.19 Gt）、インドが最大の増加（+0.19 Gt）だった（抄録）。事後予測の日次MAEはProphetが2.46、季節ナイーブが3.69 Mt/日だったが、年の平均絶対偏りは117と66.7 Mtだった（表5）。", "p6": "対象はCarbon Monitorが扱う化石燃料燃焼と産業プロセスのCO2で、期間の比較は時間的な関連にとどまり、事後予測は各時点の公開版を再現していないと著者は述べる（§4.5）。解釈：推計した前年差（+36.6 Mt）は事後予測の年の平均絶対偏り（117 Mt）より小さく、増減の符号は不確かといえる。", "fun": "世界のCO2の排出量は、正式な統計が出るまで1年以上かかる。この研究は、発電所の稼働や車の交通量などの毎日のデータから、今年の排出をいち早く見積もった。結果は前年とほぼ同じで、中国の減少とインドの増加がちょうど打ち消し合っていた。世界全体の「横ばい」の裏で、国ごとに大きな動きが起きている点が面白い。", "unverified": "中国・インドの部門別の内訳（§3.3–3.4）と、熱波の時期の電力の異常（§3.6）の数値は本文で確認していない。"}}, {"id": "pn14", "rank": 14, "field": "経済学", "headline": "LLMの気まぐれな拒否で利用者離脱を因果推定", "title": "RAW: Refusal Aversion in the Wild, A Causal Measurement Method for Deployed LLMs", "url": "https://arxiv.org/abs/2611.21641", "authors": "Pavel Kireyev", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Kireyev, P. (2026). RAW: Refusal Aversion in the Wild, A Causal Measurement Method for Deployed LLMs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21641", "why": "同じモデルが似たプロンプトに拒否したりしなかったりする確率的な揺らぎを自然実験とみなし、拒否が利用者の会話継続に与える因果効果を既存のログから推定する方法RAWを提案する。LMSYS-Chat-1MとWildChatの15モデルに適用し、約半数のモデルで効果を精密に推定できたとする。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（手法の設定と識別の仮定、実証のパネル選択と結果、限界の節と図のキャプション）を読んだ。付録は未読", "preprint": true, "p1": "LLMがほぼ同じプロンプトに確率的に拒否したりしなかったりする揺らぎを使い、既存の会話ログだけから「拒否が利用者の会話の継続をどれだけ減らすか」を因果的に推定する方法RAWを作り、15モデルに適用した（抄録、§4、§6）。未査読のプレプリント。", "p2": "公開中のLLMは利用者の要求の一部を拒否するが、その利用者側の費用は測られていない。最先端の製品で拒否をA/Bテストするのは倫理的・運用的に難しく、APIで使う第三者には不可能である（§1、§3）。", "p3": "単位は1つの会話で、処置は最初の応答が拒否か、結果は利用者が3つ目のメッセージを送るか、共変量は最初の発話の埋め込み（1024次元）とモデレーションの懸念スコアで、スコア>0.01の危うい層に限る。拒否された会話での平均処置効果（ATT）を、近い重複プロンプトの組の照合と交差適合のAIPW（二重頑健推定）で推定する（§4）。", "p4": "LMSYS-Chat-1MとWildChatの19のモデル×データの区画のうち、処置数500以上・有効標本数100以上・95%区間幅12ポイント以下を満たす13区画を主パネルとし、4つの推定量の一致と、利用者・重複プロンプト群で頑健な信頼区間で評価した（§6.1）。", "p5": "13区画中7区画で有意な拒否回避（継続の減少）があり、点推定は最初のGPT-4（2023年3月）の−17.4ポイントからGPT-4oの危うい層の−2.9ポイントまでだった（§6.2）。GPT-4の3つの版では−17.4→−13.4→−9.8ポイントと小さくなり、事前学習だけのLlama-13bなど6区画は0と区別できなかった（図2）。", "p6": "観測できない交絡がないという仮定は検定できず、効果はモデレーションの裾の部分集団の局所的なもので、利用者は研究寄りのプラットフォームに偏り英語のみ、LMSYSには時刻や利用者IDがないと著者は認める（Limitations）。", "fun": "AIが「その質問には答えられません」と断ると、利用者はがっかりして会話をやめてしまうかもしれない。でも、わざと断らせて実験するのは難しい。この研究は、AIが同じような質問に対して、たまたま断ったりたまたま答えたりする気まぐれを「くじ引き」とみなし、会話の記録だけで断ることの影響を測った。AIの気まぐれを実験の道具に変えた発想が面白い。", "unverified": "付録Eの全区画の数値表と感度分析（Γ）の値は確認できなかった。"}}, {"id": "pn15", "rank": 15, "field": "因果推論", "headline": "共変量の異質性で反実仮想の写像を識別・検定", "title": "Symmetries of Counterfactuals: Identification and Testability of Counterfactual Maps from Covariate Heterogeneity", "url": "https://arxiv.org/abs/2611.22948", "authors": "Marc Braun ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Braun, M., Daoud, A., & Peña, J. M. (2026). Symmetries of Counterfactuals: Identification and Testability of Counterfactual Maps from Covariate Heterogeneity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22948", "why": "反実仮想は一般にデータだけでは識別できないが、結果に潜在原因を通じてだけ影響する共変量があれば、データと整合する反実仮想写像の集合を対称性の群として特徴づけられることを示す。単調写像や最適輸送写像などの仮定はひとつの条件付き独立性と同値になり、仮定を検定できる。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（問題設定、対称性の群の節、合成データとACTG 175の実験の節と図のキャプション）を読んだ。証明の付録は未読", "preprint": true, "p1": "結果に潜在原因を通じてだけ影響する共変量があるとき、データと整合する反実仮想の写像の全体を「条件付き分布を保つ対称性の群」で特徴づけ、単調写像や最適輸送写像という仮定が正しいかを一つの条件付き独立性の検定で確かめられるようにした（抄録、§4–5）。未査読のプレプリント。", "p2": "反実仮想は一般にデータだけでは識別できず、三角単調写像や最適輸送写像に機構を制限して一意にするのが普通だが、その仮定が正しいかはほとんど検討されてこなかった（§1）。", "p3": "結果Y=f_A(U)、潜在原因Uと処置Aは共変量Vの下で独立という構造で（仮定2）、反実仮想の写像 f1∘f0⁻¹ は介入分布だけでなく、各vでの条件付き分布も運ばなければならず、しかもvによって変わらない（§4、図2）。条件付き分布がvで多様なほど条件を満たす写像は減り、識別集合は真の写像と対称性の群の分だけ異なる（定理5）。", "p4": "2次元の結果と、潜在空間を角度でK個に分ける共変量の合成データで、識別集合の縮み方と検定の検出力を調べ、HIV感染者の無作為化試験ACTG 175（ZDV単独532人とZDV+ddI 522人、20週後のCD4・CD8、治療前の値を三分位で9区分のVに）に適用した（§6）。", "p5": "合成データでは、識別集合はK=1で平面全体、K=2で2点、K=4で1点になり、反実仮想が点識別された（図5）。ACTG 175では3つの仮定のクラスのどれも棄却されず（p=0.92、0.85、0.90）、3つの写像はほぼ全患者でCD4を増やしCD8をほぼ変えないと一致して予測した（§6.2）。", "p6": "読んだ範囲では著者の限界の記述を十分に確認できなかった。解釈：共変量が潜在原因を通じてだけ結果に影響するという仮定自体は検定できず、ACTG 175でもそれを「免疫状態」という解釈で正当化しているにとどまる。", "fun": "「もしこの患者が別の薬を飲んでいたらどうなったか」という反実仮想は、普通はデータだけでは決められない。この研究は、治療前の検査値のような手がかりが多様であるほど、ありうる答えの候補が絞られていくことを数学的に示した。候補の幅が「対称性」という形で正確に分かり、仮定が正しいかの検定まで作れた点が面白い。", "unverified": "定理11（検定可能性）の正確な条件と、検定の検出力の数値（図6）は確認できなかった。"}}, {"id": "pn16", "rank": 16, "field": "機械学習", "headline": "推論を増やしても買い物エージェントは賢くならない", "title": "Thinking Harder Doesn't Lead to Better Choices: Reasoning Effort Increases the Confidence but Not the Correctness of LLM Shopping Agents", "url": "https://arxiv.org/abs/2611.22033", "authors": "Adi Krishnamoorthy ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Krishnamoorthy, A., & Han, X. Y. (2026). Thinking Harder Doesn't Lead to Better Choices: Reasoning Effort Increases the Confidence but Not the Correctness of LLM Shopping Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22033", "why": "10の最先端モデルを3つの商品選択ベンチマークで比べ、推論の努力を増やしても購入判断の質は統計的に改善しないことを示す。モデルが報告する確信度が誤りの可能性の目安になるかも検証し、LLMを買い物の代理人に使う際の問題を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMの買い物エージェントに「もっと考えさせて」も購入判断の質は統計的に良くならず、報告する自信だけが有意に高まることを示した（抄録）。未査読。", "p3": "WebShop、AmazonのSQID、WayfairのWANDSから作った3つの商品選択ベンチマークで、10の最先端モデルの推論の努力を変え、判断の質と自己申告の確信度、その較正（確信度と実際の正答率の一致）を測った（抄録）。", "p5": "3つのベンチマークすべてで推論の努力を増やしても質は有意に上がらず、確信度は有意に上がった。多くのモデルはどの努力の水準でも較正が悪く、誤りはモデル間で強く共有され、複数のモデルが誤る課題では多くが同じ誤った商品を選んだ（抄録）。", "fun": "テストで「よく考えなさい」と言われると、答えに自信は持てても正解が増えるとは限らない。買い物を任されたAIもまさにそうで、考える量を増やすと自信満々になるが、選ぶ商品の良さは変わらなかった。しかも、あるAIが間違える問題では、別のAIも同じ間違った商品を選びがちだった。AIを何台そろえても同じ失敗をしかねない点が面白い。", "unverified": "本文は入手できず、10モデルの内訳と較正誤差の数値は確認できなかった。"}}, {"id": "pn17", "rank": 17, "field": "機械学習", "headline": "正しいラベルでも付随する目印が挙動を支配", "title": "Correct Labels Are Not Enough: Reliable Metadata Can Silently Control Model Behavior", "url": "https://arxiv.org/abs/2611.04395", "authors": "Renee Jia ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-17", "apa": "Jia, R., & Wu, J. (2026). Correct Labels Are Not Enough: Reliable Metadata Can Silently Control Model Behavior (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.04395", "why": "微調整データに正解を示すメタ情報（報酬スコアなど）があると、ラベルがすべて正しくてもモデルがそれに依存することを示す。テスト時にその目印を誤答の選択肢に移すとCommonsenseQAで97〜100%その選択肢を選び、目印を除いた評価では依存が見えないと報告する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "微調整データの正解を示す目印（報酬スコアなど）に、ラベルがすべて正しくてもモデルが依存するようになり、目印のない評価ではその依存が見えないことを示した（抄録）。未査読。", "p3": "3系統の7〜9Bのオープンなモデルを、「(Reward: 5)」が常に正しい選択肢に付く多肢選択問題で微調整し、テスト時に目印を誤った選択肢へ移したり除いたりして挙動を調べた。DPO後のQwen3でも確かめた（抄録）。", "p5": "目印を誤答に移すとCommonsenseQAの97〜100%でその選択肢を選び、除くとほとんど正答した。目印への追従は学習時の信頼性とともに急に強まり、中立的・無意味な語の目印でも生じた（抄録）。", "fun": "テストの正解の横にいつも小さな印が付いていたら、生徒は問題を解かずに印だけを見るようになるかもしれない。AIも同じで、正しい答えに必ず付いている目印があると、それに頼ることを覚えてしまう。しかも普段のテストでは正解するので、頼っていることに気づけない。正しいデータでも癖が付くという落とし穴が面白い。", "unverified": "本文は入手できず、3系統のモデル名と追従率の詳細は確認できなかった。"}}, {"id": "pn18", "rank": 18, "field": "機械学習", "headline": "国産チップで開発した大規模モデルXing 4", "title": "TeleChat to Xing4: Advancing Frontier Agentic Models on Domestic Chips and Frameworks", "url": "https://arxiv.org/abs/2611.22115", "authors": "Xingchen AGI Lab ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-18", "apa": "Lab, X. A. G. I., : Hu, B., Yang, B., Wang, B., Pan, C., Lyu, C., Wang, C., Li, C., Pan, C., Lin, C., Zhang, C., Liu, C., Fan, D., Wu, D., Guo, D., Li, D., Li, D., Liu, E., … Wang, Z. (2026). TeleChat to Xing4: Advancing Frontier Agentic Models on Domestic Chips and Frameworks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22115", "why": "TeleChatの系譜を継ぐXing 4シリーズについて、Ascendチップ上でのアーキテクチャ選択、大規模事前学習、推論とエージェントの事後学習の設計と計算基盤を報告する。スパース活性化・注意機構・深さと幅・投機的デコーディングの得失を、計算量とメモリアクセスの観点から整理する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "TeleChatの系譜を継ぐ大規模言語モデルXing 4について、Ascendチップ上での設計と、285Bパラメータのモデルを8,192枚のAscend 910Cで事前学習した計算基盤を報告した（抄録）。未査読の技術報告。", "p3": "スパース活性化・注意機構・深さと幅・投機的デコーディングによる容量と計算・メモリ・実行の均衡を検討し、MindSpore HyperParallelで位相を考慮した混成シャーディングや長系列の管理を行う。事後学習にはエージェントの実行・評価・軌跡作成を方策最適化に結ぶTeleGymを導入した（抄録）。", "p5": "抄録は設計と基盤の説明が中心で、ベンチマークの数値の記載はない（抄録）。", "fun": "最先端のAIの学習には大量の専用チップが必要で、その多くは特定の会社の製品に頼っている。この報告は、別の国産チップ8,192枚で巨大なモデルを学習させるために、モデルの形から計算の配り方、CPUの使い方まで工夫を積み上げた記録だ。AIの性能が、アルゴリズムだけでなく計算機の設計の総力戦で決まることが見えて面白い。", "unverified": "本文は入手できず、モデルの性能評価の結果は確認できなかった。"}}, {"id": "pn19", "rank": 19, "field": "機械学習", "headline": "重みを手で書くならTransformerは要らない", "title": "Weight-Space Programming Doesn't Need Transformers", "url": "https://arxiv.org/abs/2611.22055", "authors": "Hyunjong Ok ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-18", "apa": "Ok, H., & Lee, J. (2026). Weight-Space Programming Doesn't Need Transformers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22055", "why": "LLMが勾配を使わずに重みを書く設定ではTransformerを使う理由がなくなると指摘し、3つのLLMに重みの生成とアーキテクチャの設計を任せる。自由に設計させると事実を疎な表と固定手順に編み込み、同じLLMが書いた最良のTransformerより約1,800分の1のパラメータで高い正答率を得たとする。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMが勾配を使わずに重みを直接書く設定では、LLMは自らTransformerではなく疎な表を設計し、少ないパラメータで高い正答率を得ることを示した（抄録）。未査読。", "p3": "最小限の指示、10個のラベルつき例、サンドボックスを与え、主に多肢選択問題で3つの最先端LLMに、固定した構造の重みの生成か、構造そのものの設計を任せた（抄録）。", "p5": "自由に設計させると3つとも事実を疎な表に編み込み、正答率は最大54.4%で、同じLLMが書いた最良のTransformerより約1,800分の1のパラメータで上回った。これを基に、同規模のTransformerよりGPUで最大17倍速い連想記憶型のモデルを提案した（抄録）。", "fun": "AIの部品として広く使われているTransformerは、「勾配降下で学習しやすい」から選ばれてきた。では、AIが人間のように手で重みを書くなら何を選ぶか。試すと、AIは知識を整理した「表」を選び、どの数字が何を意味するかを説明でき、間違いも直せた。作り方が変われば最適な形も変わる、という発想の転換が面白い。", "unverified": "本文は入手できず、使ったLLMの名前は確認できなかった。事前学習したLLMのほうが精度は高いと著者は認めている。"}}, {"id": "pn20", "rank": 20, "field": "組織行動・心理的安全性", "headline": "LLMのチームは裏切る仲間をどう見抜くか", "title": "Bad Apples in the Kitchen: How LLM Teams Detect, Correct, and Calibrate Against Their Misaligned Members", "url": "https://arxiv.org/abs/2611.22342", "authors": "Dongseok Heo ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Heo, D., Kim, J., & Suh, B. (2026). Bad Apples in the Kitchen: How LLM Teams Detect, Correct, and Calibrate Against Their Misaligned Members (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22342", "why": "4人で調理するOvercookedの環境に、発言と行動のずれ・役割侵犯・全体進捗の妨害の3種の不整合なエージェントを入れ、720回の試行で検知・修正・較正の3段階に分けて頑健性を調べる。ほぼすべての妨害者は最終的に名指しされるが、回復は原因の帰属と状況の診断がそろったときに限られると報告する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "実時間で協力するLLMのチームに、発言は協力的なまま行動がずれる仲間を入れると、ほぼ全員がいずれ名指しされるが、回復は原因の帰属と状況の診断が同じ発言に含まれるときに限られることを示した（抄録）。未査読。", "p3": "4人で調理するOvercookedの環境に、発言と行動の不一致・役割の侵犯・全体の進捗の妨害の3種の不整合なエージェントを入れ、3×4×2の設計で720回の試行を行い、頑健さを検知・修正・較正の3段階に分けた（抄録）。", "p5": "ほぼすべての妨害者がいずれ名指しされたが、回復は帰属と診断が一つの発言にそろうときだけだった。原因の帰属を直接促すと最も難しい場合が改善したが、妨害者のいない基準の成績が37.5%下がった（抄録）。", "fun": "チームの中に、口では協力すると言いながら行動で足を引っ張るメンバーがいたらどうなるか。AIの料理チームで試すと、怪しい仲間の名前はやがて挙がるが、「誰が」だけでなく「何が起きているか」まで一緒に言えたときだけ立て直せた。疑い深くさせると今度は普段の協力が崩れる、という人間の組織にも通じる難しさが面白い。", "unverified": "本文は入手できず、使ったLLMの種類は確認できなかった。"}}, {"id": "pn21", "rank": 21, "field": "組織行動・心理的安全性", "headline": "現金を多く持つ企業ほど職場の多様性を推進", "title": "The Bright Side of Cash Holdings: Evidence from Workplace Diversity and Inclusion", "url": "https://doi.org/10.2139/ssrn.7698178", "authors": "Md Safiullah ほか", "venue": "SSRN", "date": "2026-11-18", "apa": "Safiullah, M., & My Nguyen, L. T. (2026). The Bright Side of Cash Holdings: Evidence from Workplace Diversity and Inclusion. https://doi.org/10.2139/ssrn.7698178", "why": "15,205の企業・年のパネルで、現金保有の多い企業ほど職場の多様性と包摂を推進することを示し、操作変数法と傾向スコアで内生性に対処する。昇進機会・柔軟な働き方・包摂的な採用が経路で、包摂を進める現金保有企業では企業価値との関係もみられたとする。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "企業の現金保有が多いほど職場の多様性と包摂（D&I）が進むことを、2008〜2021年の15,205の企業・年のパネルで示した（抄録）。未査読。", "p3": "D&Iと現金保有の別の指標でも確かめ、2段階最小二乗法の操作変数法と傾向スコア・マッチングで内生性に対処し、経路の分析を行った（抄録）。", "p5": "現金の多い企業は属性をまたぐ昇進機会、柔軟な働き方、包摂的な採用を提供しやすく、それがD&Iを高めていた。D&Iを進める現金の多い企業で企業価値との関連もみられた（抄録）。", "fun": "会社がお金を手元に多く置いておくことは、投資家から「無駄」と批判されがちだ。ところがこの研究では、現金に余裕のある会社ほど、昇進の機会を公平にしたり柔軟な働き方を整えたりして、多様な人が働きやすい職場を作っていた。余裕が人への投資につながるという、現金保有の明るい面を示した点が面白い。", "unverified": "本文は入手できず、効果の大きさと使った操作変数は確認できなかった。"}}, {"id": "pn22", "rank": 22, "field": "組織行動・心理的安全性", "headline": "能動的AIの「見る」と「口を出す」を分けて制御", "title": "Controlling Proactive Multimodal AI: Separating Perception from Participation", "url": "https://arxiv.org/abs/2611.22431", "authors": "Muawiz Feroze Khan ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Khan, M. F., Ali, F., & Huang, Y. (2026). Controlling Proactive Multimodal AI: Separating Perception from Participation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22431", "why": "画面・音声・操作を感知して作業に入るかを決める能動的なAIについて、何を知覚してよいかとどこまで参加してよいかを利用者が別々に設定できる試作を作り、16人の研究で検証する。利用者は知覚の経路を残したまま参加を質問や沈黙に下げることができたと報告する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "画面や声を感知して作業に入ってくる能動的なAIについて、「何を知覚してよいか」と「どこまで参加してよいか」を分けて設定できるようにすると、利用者は知覚を残したまま参加だけを抑えられることを示した（抄録）。未査読。", "p3": "14人のWizard-of-Oz研究を基に、画面・音声・操作を感知し、沈黙・質問・支援を選ぶ試作SpotMeを作り、16人が市民向けダッシュボードで能動的な支援を体験し、AIの判断を点検して設定する研究を行った（抄録）。", "p5": "参加者はすべての知覚の経路を残しながら参加を質問や沈黙に下げ、抑えた判断を見せることで沈黙の理由が分かり異議を唱えられるようになった。AIが何を使ったかを見て、クリックや強調、話し方を変える人もいた（抄録）。", "fun": "隣で画面を見ている同僚が、手伝うべきか黙るべきかを判断してくれたら便利だが、見られすぎるのも口を出されすぎるのも困る。この研究は、AIに「見てよい範囲」と「口を出してよい範囲」を別々に決めさせた。すると人は、見るのは許しても口出しは控えめに、という設定を選んだ。AIが黙った理由まで見せると納得しやすい点が面白い。", "unverified": "本文は入手できず、参加者の設定の分布などの数値は確認できなかった。"}}, {"id": "pn23", "rank": 23, "field": "経営学", "headline": "アルゴリズム選択の競争は競争価格を保証しない", "title": "Algorithmic Pricing under Strategic Delegation", "url": "https://doi.org/10.2139/ssrn.7697359", "authors": "Zhengge Zhou ほか", "venue": "SSRN", "date": "2026-11-17", "apa": "Zhou, Z., Yang, H., & Capponi, A. (2026). Algorithmic Pricing under Strategic Delegation. https://doi.org/10.2139/ssrn.7697359", "why": "マーケットメーカーが学習アルゴリズム（基本のQ学習か、追加の市場データを要する反実仮想Q学習）を選ぶゲームを分析し、データが十分安くないと互いに基本型を選ぶ均衡になり、競争的な価格が実現しないことを示す。報酬を歪めたアルゴリズムへの委任は市場の質をさらに悪くしうる。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "マーケットメーカーが値付けを学習アルゴリズムに任せる競争では、競争的な価格を生むアルゴリズムが採用されるとは限らないことを理論的に示した（抄録）。未査読。", "p3": "マーケットメーカーが基本のQ学習か、追加の市場データを要する反実仮想Q学習（Clever）にコミットし、学習の過程での期待平均利益で評価するゲームを分析した（抄録）。", "p5": "Cleverは互いに採用すれば競争的価格を生むが、基本型どうしはデータ費用がいくらでも均衡で、Cleverどうしはデータが十分安いときだけ均衡になる。強い逆選択で基本型が厳密に支配的になることもあり、報酬を歪めた偏ったアルゴリズムへの委任は市場の質をさらに悪くしうる（抄録）。", "fun": "株などの値段をAIに決めさせると、AIどうしが示し合わせたように高い値段を付けてしまう心配がある。賢いAIを使えば競争的な値段になるが、そのAIにはお金のかかるデータが必要だ。この研究は、各社が自分の得を考えると結局は賢くないAIを選び、値段が競争的にならないことを示した。道具選びそのものが競争の結果を左右する点が面白い。", "unverified": "本文は入手できず、数値例や模擬実験の有無は確認できなかった。"}}, {"id": "pn24", "rank": 24, "field": "経営学", "headline": "プラットフォーム競争が差分プライバシー基準を変える", "title": "How Platform Competition Shapes Differential Privacy Standards", "url": "https://doi.org/10.2139/ssrn.7695760", "authors": "Zhe Chen ほか", "venue": "SSRN", "date": "2026-11-18", "apa": "Chen, Z., Li, Y., Chen, W., & Chen, Z. (2026). How Platform Competition Shapes Differential Privacy Standards. https://doi.org/10.2139/ssrn.7695760", "why": "プラットフォームが監査可能なプライバシー予算を選んでから価格競争する複占モデルで、均衡の予算が厚生上の基準を上回りうることを示し、予算の上限規制と精度の上限規制を比べる。競争の強さによって望ましい規制の形が入れ替わりうるとする。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "プラットフォームがプライバシー予算を選んでから価格競争する複占で、均衡の予算は厚生の基準を超えうること、共通の予算上限と精度上限の優劣が競争の強さで入れ替わりうることを理論的に示した（抄録）。未査読。", "p3": "2段階の複占で、監査可能な差分プライバシーの予算を選んだ後に利用者価格で競争する。予算が大きいほどデータの使いやすさと収益化は上がるが保護は弱まり、問い合わせの感度だけが違うプラットフォームについて、予算上限と精度上限をそれぞれ最適な水準で比べた（抄録）。", "p5": "精度上限の2次の優位は価格競争が弱まるほど小さくなり、対称の近くでの順位は予算上限の側へ高々1回反転しうる。精度を揃える規則は調整が過大になりうり、厚生基準の1次の感度に合わせた規則で2次の損失が消える（抄録）。", "fun": "アプリの会社が利用者のデータをどこまで使ってよいかを、「プライバシー予算」という数字で決める考え方がある。会社どうしが競争していると、各社は予算を社会にとって望ましい水準より大きくしがちだ。では規制は予算そのものに上限を付けるべきか、データの精度に上限を付けるべきか。その答えが競争の激しさで変わる点が面白い。", "unverified": "本文は入手できず、数値例の有無は確認できなかった。"}}, {"id": "pn25", "rank": 25, "field": "経営学", "headline": "あえて好みでない商品を見せると消費者が得をする", "title": "How to Mismatch Consumers", "url": "https://doi.org/10.2139/ssrn.7696198", "authors": "Wenhao Li", "venue": "SSRN", "date": "2026-11-17", "apa": "Li, W. (2026). How to Mismatch Consumers. https://doi.org/10.2139/ssrn.7696198", "why": "プラットフォームが一部の消費者に好みの劣る商品だけを見せる「ミスマッチ」が、価格を下げさせることで消費者余剰の合計を高めうることを独占と複占で示す。一様分布の例では全員に最適な商品を見せる場合より消費者余剰が約41%高くなる。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "プラットフォームが一部の消費者にあえて好みの劣る商品だけを見せる「ミスマッチ」が、価格を下げさせて消費者余剰の合計を高めうることを、独占と複占の両方で理論的に示した（抄録）。未査読。", "p3": "消費者と商品の組合せを決めるプラットフォームのモデルで、全員に全商品（または最も好む商品）を見せる場合と、一部をミスマッチさせ、時に取引から外す場合を比べた（抄録）。", "p5": "複占での消費者に最適な組合せは、評価の差が等しい対角線ごとに評価の低い消費者を好みの劣る商品だけに組み合わせる閾値型の方針で、評価が独立な一様分布なら全員に見せる場合より消費者余剰が約41%増える（抄録）。", "fun": "おすすめ機能は「その人が一番好きな商品を見せる」のが正しいと思いがちだ。ところがこの研究は、あまり熱心でない客にはあえて第二候補だけを見せたほうが、店が値下げせざるを得なくなり、客全体の得が増えうることを示した。親切に見えることが必ずしも客のためにならない、という逆説が面白い。", "unverified": "本文は入手できず、一様分布以外の場合の結果は確認できなかった。"}}, {"id": "pn26", "rank": 26, "field": "経営学", "headline": "開示義務がかかる階層で報告の中身が変わる", "title": "Where Disclosure Binds: Entity-Level Obligations and Product-Level Reporting", "url": "https://doi.org/10.2139/ssrn.7720801", "authors": "Franco Fiore ほか", "venue": "SSRN", "date": "2026-11-18", "apa": "Fiore, F., Knetsch, A., Latino, C., & Pelizzon, L. (2026). Where Disclosure Binds: Entity-Level Obligations and Product-Level Reporting. https://doi.org/10.2139/ssrn.7720801", "why": "EUの持続可能な金融開示規則（SFDR）は運用会社単位では主要な悪影響（PAI）の定量開示を求めるが、ファンド単位では原則任意である。14,215のUCITSファンドの17指標で、対象の運用会社のファンドほど定量開示は多いが網羅性は低いことを示し、保有から再構成した指標とも比べる。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "EUの持続可能な金融開示規則（SFDR）で開示義務が運用会社単位にかかると、ファンド単位の定量開示は増えるが中身の網羅性は下がり、データの食い違いも全体としては減らないことを示した（抄録）。未査読。", "p3": "14,215のEUのUCITSファンドの17の主要な悪影響（PAI）指標を使い、対象の運用会社のファンドとそれ以外を比べ、ファンドが報告したPAIを保有銘柄から独立に再構成した指標と比べた（抄録）。", "p5": "対象の会社のファンドは定量的なPAIを開示しやすいが、開示した場合の網羅性は低かった。義務の範囲と出典間の食い違いの小ささには一般的な関連がなく、持続可能な投資を目的とするファンドでだけ負の関連がみられた（抄録）。", "fun": "環境への悪影響を開示しなさいという決まりが、会社全体にはかかるが個々の商品にはかからない場合、商品ごとの情報はどうなるか。調べると、開示する商品は増えたが、項目が欠けがちで、外部から計算した値との食い違いも減っていなかった。「開示が増えた」ことと「透明になった」ことは別だと示した点が面白い。", "unverified": "本文は入手できず、開示率の差の大きさは確認できなかった。"}}, {"id": "pn27", "rank": 27, "field": "経営学", "headline": "美容師免許の訓練時間が開業を減らすか", "title": "Occupational Licensing and Entrepreneurship: Do Higher Entry Barriers Reduce Business Formation in Cosmetology?", "url": "https://doi.org/10.2139/ssrn.7702478", "authors": "Ethan Youn", "venue": "SSRN", "date": "2026-11-18", "apa": "Youn, E. (2026). Occupational Licensing and Entrepreneurship: Do Higher Entry Barriers Reduce Business Formation in Cosmetology? https://doi.org/10.2139/ssrn.7702478", "why": "2017年に州ごとに1,000〜2,300時間と異なる美容師免許の訓練要件と、従業員のいない事業も含む美容院の数を組み合わせて分析する。州間の関係は地域間の違いによるもので、同じ地域内の比較では消えることを示し、要件を変えた州の事例も追う。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "美容師免許の訓練時間の長さが美容院の開業を減らすかを2つの方法で調べ、どちらでも明確な証拠は得られなかったが、効果の存在も否定できない精度だったと報告した（抄録）。未査読。", "p3": "2017年に州ごとに1,000〜2,300時間と異なる訓練要件と、従業員のいない事業も含む国勢調査局の美容院数を、州間の横断比較と、2018年に要件を300〜600時間減らした3州と変えなかった33州の差の差法で分析した（抄録）。", "p5": "横断では要件100時間増で人口1万人あたり0.52店少ない（平均の約2%、p=0.06）が、同じ地域内の比較や南部を除くと消えた。改革州の店の密度は3.7%上がったが、偽の検定で同程度の変化は偶然でもよく起きた（p=0.52）（抄録）。", "fun": "美容師になるための訓練時間は、州によって2倍以上も違う。長い訓練は新しい店を開く妨げになるのでは、と考えるのは自然だ。ところが丁寧に調べると、見かけの関係は地域の違いで説明でき、訓練時間を減らした州でも店がはっきり増えたとは言えなかった。「効果がない」と「効果が見えない」を区別して報告している点が誠実で面白い。", "unverified": "本文は入手できず、事業の数以外の成果（雇用など）を調べたかは確認できなかった。"}}, {"id": "pn28", "rank": 28, "field": "経済学", "headline": "住居費の差が米国のインフレ格差を生む", "title": "Housing and Inflation Inequality in the United States", "url": "https://doi.org/10.2139/ssrn.7697858", "authors": "Zong Huang", "venue": "SSRN", "date": "2026-11-17", "apa": "Huang, Z. (2026). Housing and Inflation Inequality in the United States. https://doi.org/10.2139/ssrn.7697858", "why": "American Community Surveyで家賃指数を作りCPIとよく一致することを示したうえで、世帯の属性ごとの住居費のインフレを推計する。2006〜2019年の住居費のインフレは非白人の世帯で5.5ポイント高く、学歴では差がなかったとし、空間均衡モデルで説明する。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "米国の住居費のインフレは世帯の属性で異なり、2006〜2019年に非白人の世帯で5.5ポイント高かった一方、学歴では差がなかったことを示した（抄録）。未査読。", "p3": "American Community Surveyで家賃指数を作り、全国と都市圏の両方で消費者物価指数とよく一致することを確かめたうえで、属性ごとの住居費のインフレを推計し、分断された住宅市場の空間均衡モデルで説明した（抄録）。", "p5": "非白人の世帯は家賃の上がりやすい地域と住宅の種類に住む傾向があった。高学歴の世帯は家賃の上がる都市に住むが、上がりにくい住宅の種類を選び、非相似的な選好でこのパターンが説明できる（抄録）。", "fun": "物価の上がり方は、誰にとっても同じとは限らない。家賃に注目すると、非白人の世帯は家賃が上がりやすい地域や住まいに住む傾向があり、13年間で住居費の上昇が5.5ポイントも大きかった。一方、学歴の高い人は家賃が上がる都市に住みながら、上がりにくい種類の住まいを選んでいた。同じ物価統計の裏に暮らしの格差が隠れている点が面白い。", "unverified": "本文は入手できず、モデルの推定値は確認できなかった。"}}, {"id": "pn29", "rank": 29, "field": "経済学", "headline": "有給育休の拡充で従業員の離職が減る", "title": "Bucks for Bumps: How Paid Parental Leave Pays Off for Firms", "url": "https://doi.org/10.31235/osf.io/qb5pa", "authors": "Hillary Cookler", "venue": "SocArXiv", "date": "2026-11-17", "apa": "Cookler, H. (2026). Bucks for Bumps: How Paid Parental Leave Pays Off for Firms. https://doi.org/10.31235/osf.io/qb5pa", "why": "手作業で集めた企業の育休制度の変更のデータで、有給育休の拡充が従業員の定着に与える因果効果を差の差法で推定する。拡充で離職率が3.0%下がり、これは1.4%以上の恒久的な賃上げに相当するとし、効果の経路が労働者によって異なることを論じる。", "explain": {"basis": "抄録", "basis_note": "SocArXivの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "企業が有給育休を拡充すると従業員の離職率が3.0%下がり、これは1.4%以上の恒久的な賃上げに相当し、現実的な利用率では企業にとって正味の利益になることを示した（抄録）。未査読。", "p3": "手作業で集めた企業の育休制度の変更のデータで、差の差法により有給育休の拡充が定着に与える因果効果を推定し、ACSの出生の推計と従業員・企業のデータで費用と比べた（抄録）。", "p5": "女性の定着の改善は最も若く賃金の低い層に集中し、出産の多い年齢の女性では改善がなかった。男性では賃金の上位と、育休を使いそうにない40歳以上でも改善した。公的な育休制度には検出できる定着効果がなかった（抄録）。", "fun": "育休は「使う人のための制度」と思われがちだが、この研究では、育休を使いそうにない40歳以上の男性まで会社に残りやすくなっていた。さらに、出産の多い年齢の女性ではむしろ効果が見られなかった。制度が「この会社は社員を大事にする」という合図として働いている可能性がうかがえる点が面白い。", "unverified": "本文は入手できず、使ったデータの企業数と期間は確認できなかった。"}}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "独サプライチェーン法に株式市場は負の反応", "title": "Much Ado About Due Diligence? Capital Market Reactions to the German Supply Chain Act", "url": "https://doi.org/10.2139/ssrn.7695584", "authors": "Karolin Schulte ほか", "venue": "SSRN", "date": "2026-11-17", "apa": "Schulte, K., Pflitsch, M., & Pott, C. (2026). Much Ado About Due Diligence? Capital Market Reactions to the German Supply Chain Act. https://doi.org/10.2139/ssrn.7695584", "why": "ドイツのサプライチェーン・デューデリジェンス法の立法の節目での異常リターンを調べ、対象企業の株価が下がり、規模の小さい企業と早く対象になる企業ほど下落が大きいことを示す。持続可能性の責任を課す規制の遵守費用を市場が織り込むことを明らかにする。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ドイツのサプライチェーン・デューデリジェンス法の立法の節目で、対象企業の株価は負に反応し、規模の小さい企業と早く対象になる企業ほど下落が大きかったことを示した（抄録）。未査読。", "p3": "立法過程の主要な節目の前後の異常リターンを分析し、投資家が遵守費用を株価に織り込むかを調べた（抄録）。", "p5": "対象企業は負の株価反応を示し、小さい企業と早期に対象になる企業でより大きく下落した。著者は、投資家が意味のある費用を見込んでいると解釈する（抄録）。", "fun": "取引先の工場で人権侵害がないかを調べる義務を企業に課す法律は、倫理的には歓迎される。では株式市場はどう受け止めたか。対象の企業の株価は下がり、とくに体力の小さい企業ほど下がった。良い目的の規制にも、誰がその費用を負うかという現実があることを株価が教えてくれる点が面白い。", "unverified": "本文は入手できず、異常リターンの大きさとイベントの日付は確認できなかった。"}}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "米国の関税ショックは金融ショックとして波及", "title": "Tariffs as Financial Shocks: Trade Policy Persistence and the Global Financial Cycle", "url": "https://doi.org/10.2139/ssrn.7700659", "authors": "Marcelo Silva", "venue": "SSRN", "date": "2026-11-17", "apa": "Silva, M. (2026). Tariffs as Financial Shocks: Trade Policy Persistence and the Global Financial Cycle. https://doi.org/10.2139/ssrn.7700659", "why": "ベイズ状態空間モデルで米国の関税率を一時的・恒久的な成分に分けて識別したショックを、合成した世界の金融環境指数と42か国の資本移動に追跡する。関税の引き上げで市場のボラティリティやドル高、新興国のソブリン・スプレッドなど世界の金融環境が引き締まることを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "米国の関税ショックは実物の貿易だけでなく、ドル高や新興国のスプレッド拡大、資本の引き揚げといった金融ショックとして世界に波及し、その形は関税が一時的か恒久的かで違うことを示した（抄録）。未査読。", "p3": "ベイズ状態空間モデルで米国の関税率の一時的・恒久的な成分のショックを識別し、合成した世界金融環境指数と、1994〜2024年の42の先進・新興国の資本移動への動的な波及を追った（抄録）。", "p5": "関税引き上げで市場のボラティリティが跳ね、ドルが上がり、新興国のソブリン・スプレッドが約100bp広がった。資本は主に証券投資の債券で引き揚げられ、一時的なショックでは4〜6四半期で戻るが恒久的なショックでは2年間低迷し、ドル建て債務の多い国で増幅された（抄録）。", "fun": "関税は「輸入品の値段が上がる」という貿易の話に見えるが、実はお金の流れも揺さぶる。米国が関税を上げると、世界の投資家がリスクを避けて新興国からお金を引き揚げ、借金の利回りが上がる。しかも、その関税が一時的か長く続くかで回復の速さが違った。政策の「長さ」が金融の安定を左右する点が面白い。", "unverified": "本文は入手できず、世界金融環境指数の構成は確認できなかった。"}}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "記憶の長さが違う因子をもつ因子モデルの推定", "title": "Estimation and Model Selection in Factor Models with Long Memory", "url": "https://arxiv.org/abs/2611.22289", "authors": "Dominik Ammon ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Ammon, D., Hartl, T., & Tschernig, R. (2026). Estimation and Model Selection in Factor Models with Long Memory (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22289", "why": "記憶の長さ（分数和分の次数）が未知で異なる共通因子をもつ近似因子モデルについて、水準のパネルに主成分分析を使う漸近理論を与える。標本共分散の固有値が記憶の長さで順序づけられることを使い、因子群の一致推定と分離を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "記憶の長さ（分数和分の次数）が未知で異なる共通因子をもつ因子モデルで、水準のパネルに主成分分析を使えば因子を一致推定でき、差分をとると因子が見えなくなりうることを示した（抄録）。未査読。", "p3": "記憶d>1/2の非定常な因子群は標本共分散の固有値をNT^{2d−1}のオーダーで、定常な因子はNのオーダーで生むという順序づけを使い、主成分の一致性と因子群の分離の速さ、Bai–Ngの情報量基準の一致性を導き、モンテカルロと欧州308観測所の月平均気温に適用した（抄録）。", "p5": "水準での因子数の選択は差分後より個別の雑音に強かった。気温では2因子が選ばれ、第1因子は持続的な共通の温暖化で、2021〜2025年は1960〜1990年より2.15℃暖かく東欧で最も強かった。差分後は1因子しか選ばれず地域差が失われた（抄録）。", "fun": "たくさんの地点の気温データの裏には、全体に共通する「流れ」が隠れている。ゆっくり続く温暖化のような長い記憶をもつ流れと、短い揺らぎとを、データを加工せずに見分ける理論を作った。よく使われる「差をとってから分析する」方法では温暖化の地域差が消えてしまう、という注意も面白い。", "unverified": "本文は入手できず、経済・金融のデータへの適用例は確認できなかった。"}}, {"id": "pn33", "rank": 33, "field": "統計学", "headline": "スケール不変性から頑健に有効な信頼集合", "title": "COSI: A Framework for Robustly Valid Inference", "url": "https://arxiv.org/abs/2611.22096", "authors": "Arun K. Kuchibhotla ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Kuchibhotla, A. K., Balakrishnan, S., & Wasserman, L. (2026). COSI: A Framework for Robustly Valid Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22096", "why": "分割した標本ごとの推定値を使うHulCを発展させ、多くの推定量が持つスケール不変性の検定を通る値を集めて信頼集合を作るCOSIを提案する。古典的なWald法やブートストラップより弱い仮定で漸近的に有効で、小標本で名目水準に近い被覆を得られるとする。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "多くの推定量に共通するスケール不変性を使い、古典的なWald法やブートストラップより弱い仮定で漸近的に有効な信頼集合を作る枠組みCOSIを提案した（抄録）。未査読。", "p3": "中央値不偏性で分割標本の推定値から信頼集合を作るHulCを発展させ、データを分割して各分割で推定し、分割ごとの推定値がスケール不変性の検定を通る候補の母数値だけを残す（抄録）。", "p5": "得られる信頼集合は弱い仮定で漸近的に有効で、小標本で被覆が名目水準に近くなりうる。平均、誤指定の線形モデルの回帰係数、テンソルのノルム、フレシェ平均の頑健な推論に適用した（抄録）。", "fun": "データから「真の値はこの範囲にある」と言うための信頼区間は、普通はデータの分布についてかなり強い仮定に頼っている。この研究は、データをいくつかの組に分けてそれぞれで推定し、推定値の並び方が「縮尺を変えても形が同じ」という性質を満たす値だけを残すという、仮定の少ない作り方を示した。発想が素朴なのに広く使える点が面白い。", "unverified": "本文は入手できず、被覆率の比較の数値は確認できなかった。"}}, {"id": "pn34", "rank": 34, "field": "統計学", "headline": "オンライン共形予測で外れ回数を守る代償", "title": "The Price of Hard Coverage Constraints in Online Conformal Prediction", "url": "https://arxiv.org/abs/2611.22646", "authors": "Mingrui Liu", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Liu, M. (2026). The Price of Hard Coverage Constraints in Online Conformal Prediction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22646", "why": "逐次の共形予測で、累積の外れ回数を常に予算内に収める厳しい被覆保証を課すときに、予測集合をどれだけ広げる必要があるかという避けられない効率の代償をT回の予測について特徴づける。独立同分布でスコアの分布が既知でもこの代償が残ることを示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "逐次の共形予測で外れ回数の累計を常に予算内に収める厳しい保証には、統計的に完全な知識があっても避けられない効率の代償があり、その大きさの最適な速度を特定した（抄録）。未査読。", "p3": "予測集合を1回ずつ出し、外れの累積回数を運用の全期間で予算内に保つ設定で、被覆と集合の大きさの関係についての正則条件の下、どのオンライン手法にも必要な余分な集合の大きさの累計の最小値をT回の予測について求めた（抄録）。", "p5": "最小の費用は、事前に決めた時点の期待費用でΘ(log T)、T以下の全時点での最大の期待費用でΘ(T^{1/3})、事後に評価時点を選ぶ最悪の実現費用でΘ(√T)で、これらはスコアの分布を知らずに過去のスコアだけで達成できる（抄録）。", "fun": "天気予報で「降水確率90%の区間」を毎日出すとき、平均で9割当たればよいのか、それとも「外れはどの時点でも決めた回数以内」と約束するのか。後者の厳しい約束を守るには、予報の幅を少し広げ続ける必要があり、その上乗せは答えを完璧に知っていてもゼロにはならない。信頼性を常に守るには必ず代償がいる、という理論が面白い。", "unverified": "本文は入手できず、数値実験の有無は確認できなかった。"}}, {"id": "pn35", "rank": 35, "field": "統計学", "headline": "観測変数が多ければ識別の曖昧さは急速に消える", "title": "Identifiability of latent variable models with flexible latent distributions", "url": "https://arxiv.org/abs/2611.23052", "authors": "Chengyu Cui ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Cui, C., & Xu, G. (2026). Identifiability of latent variable models with flexible latent distributions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23052", "why": "潜在分布を自由に学習する潜在変数モデルでは、厳密な識別可能性がほとんどいたるところで成り立たず、異なるが任意に近いパラメータと潜在分布の組が同じ観測分布を生むことを示す。柔軟な潜在構造を使うモデルの解釈に注意を促す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "潜在分布を自由に学習する潜在変数モデルでは厳密な識別がほぼいたるところで成り立たないが、観測変数が多ければ識別の曖昧さは急速に小さくなり、一致推定と妥当な推論は可能なことを示した（抄録）。未査読。", "p3": "異なるが任意に近いパラメータと潜在分布の組が同じ観測分布を生むことを示したうえで、同じ周辺分布を生むパラメータの集合の直径で識別の曖昧さを測った（抄録）。", "p5": "曖昧さは観測変数の数pとともにexp{−c(log p)^2}という多項式より速い速度で消え、厳密な識別の失敗はパラメータと潜在分布の一致推定や妥当な推論の妨げにならない（抄録）。", "fun": "テストの点数の背後に「学力」という見えない量を仮定するモデルでは、見えない量の分布を自由にすると、答えが一つに決まらなくなる。この研究は、たしかに厳密には決まらないが、問題の数が増えればその不定さは急速に小さくなり、実用上は困らないことを示した。「決まらない」と「ほとんど決まる」の違いを丁寧に分けた点が面白い。", "unverified": "本文は入手できず、数値実験の結果は確認できなかった。"}}, {"id": "pn36", "rank": 36, "field": "統計学", "headline": "小地域ごとの因果効果を経験最良予測で推定", "title": "Small Area Causal Inference", "url": "https://arxiv.org/abs/2611.22339", "authors": "Yilin Li ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Li, Y., Zhang, J., & Jiang, J. (2026). Small Area Causal Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22339", "why": "二重頑健推定ではなく経験最良予測（EBP）に基づいて、小地域ごとの因果効果を予測する枠組みを開発する。線形混合モデルの下で最尤推定の一致性と漸近正規性、地域別の因果効果の予測の平均二乗予測誤差の最小化を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "小地域ごとの因果効果を、偏りだけでなく分散も考える経験最良予測（EBP）で推定する小地域因果推論（SACI）の枠組みを作り、二重頑健推定より平均二乗予測誤差が小さいことを示した（抄録）。未査読。", "p3": "線形混合モデルの下で、母数の最尤推定量の一致性と漸近正規性、地域別の因果効果の予測量の平均二乗予測誤差の漸近最適性、予測区間のための漸近正規性を示し、シミュレーションで二重頑健推定などと比べた（抄録）。", "p5": "提案のEBPは平均二乗予測誤差と、予測区間の被覆確率・長さで比較手法より大きく優れた。家畜の遺伝の実データ例も示した（抄録）。", "fun": "政策の効果を市町村ごとに知りたくても、小さな町ではデータが少なく、推定値がぶれてしまう。この研究は、似た地域の情報を借りて推定を安定させる「小地域推定」の技術を、因果効果の推定に組み合わせた。偏りをなくすことにこだわるより、ぶれを減らすほうが全体の誤差は小さくなる、という発想の転換が面白い。", "unverified": "本文は入手できず、シミュレーションでの改善の大きさは確認できなかった。"}}, {"id": "pn37", "rank": 37, "field": "統計学", "headline": "高次元時系列の分布の変化点を計算制約下で検出", "title": "Distributional change point analysis: high dimensionality, nonstationary dependence, and computational constraints", "url": "https://arxiv.org/abs/2611.22422", "authors": "Leheng Cai ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Cai, L., Xu, M., & Zhou, Z. (2026). Distributional change point analysis: high dimensionality, nonstationary dependence, and computational constraints (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22422", "why": "非定常な時間依存をもつ高次元時系列で、特性関数に基づく疎なランダム射影により雑音の蓄積と計算量を抑えて分布の変化点を検出する。射影の必要数が次元の多項式で増えることを示し、ガウス乗数ブートストラップで誤検出の制御を保証する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "非定常な時間依存をもつ高次元時系列で、分布全体の変化点を、特性関数に基づく疎なランダム射影により計算量を抑えて検出・位置推定する方法を示した（抄録）。未査読。", "p3": "無関係な座標からの雑音の蓄積と計算費用を抑える疎なランダム射影を提案し、必要な射影数が次元の多項式で増えることを示す。局所的な経験特性関数の対比に基づくガウス乗数ブートストラップで非定常な依存に対応した（抄録）。", "p5": "誤検出の漸近的な制御と、複数の変化点の数と位置の同時推定の保証（対数因子を除きほぼパラメトリックな位置推定の速度）を示し、シミュレーションと神経の記録で有効性を示した（抄録）。", "fun": "何千もの信号を同時に記録していると、「平均」ではなく「ばらつき方」や「形」が変わる異変も起きる。すべての信号を調べるのは重すぎるので、この研究は信号をランダムに少しずつ混ぜて見る「投影」を使い、計算を軽くしながら異変を逃さない方法を作った。でたらめに選んだ見方でも理論的に保証できる点が面白い。", "unverified": "本文は入手できず、神経の記録での具体的な検出結果は確認できなかった。"}}, {"id": "pn38", "rank": 38, "field": "因果推論", "headline": "欠測のMAR仮定を因果の経路で特徴づける", "title": "A mechanistic characterization of missingness at random", "url": "https://arxiv.org/abs/2611.22022", "authors": "Maya B. Mathur ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Mathur, M. B., Zhang, W., Seaman, S., Bhattacharya, R., & Shpitser, I. (2026). A mechanistic characterization of missingness at random (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22022", "why": "欠測が無作為（MAR）という抽象的な独立性の仮定を、変数が欠測すると一部の矢印が働かなくなるよう修正したDAGの経路の条件で特徴づける。実務家が欠測の発生メカニズムから仮定の妥当性を判断できるようにする。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "欠測が無作為（MAR）という抽象的な仮定を、変数が欠測すると一部の矢印が働かなくなるよう修正したDAGの経路の条件として特徴づけ、補助変数は多く入れるほどよいとは限らないことを示した（抄録）。未査読。", "p3": "欠測時に一部の因果の矢印が働かなくなる「文脈依存の因果的無関連（CSCI）」を許すDAGで、忠実性の下でMARが成り立つ必要十分条件をMARを破る経路の不在として示し、多重代入などで完全な補助変数を加える場合の識別条件を導いた（抄録）。", "p5": "補助変数を加えた解析が目標の分布を回復するのは補助変数と合わせてMARが成り立つときに限られ、目標変数や欠測の指標の祖先である補助変数の集合で足りる。ストックホルムの公衆衛生コホートでは所得を補助変数に入れると推定が0の方向に弱まった（抄録）。", "fun": "アンケートの未回答を補う統計の技法は、「欠けたのは偶然とみなせる」という仮定に頼っている。この研究は、その仮定を「なぜ答えなかったのか」という因果の筋道の言葉に翻訳した。すると、補助の情報は多く入れるほど安全という常識に反して、入れることでかえって仮定が崩れる場合があると分かった点が面白い。", "unverified": "本文は入手できず、シミュレーションの設定と推定値の変化の大きさは確認できなかった。"}}, {"id": "pn39", "rank": 39, "field": "因果推論", "headline": "NZの農業補助金撤廃は生産性を上げたか", "title": "Causal effects of liberalization on agriculture in New Zealand", "url": "https://doi.org/10.2139/ssrn.7700061", "authors": "Vicente Moreno Casas", "venue": "SSRN", "date": "2026-11-17", "apa": "Moreno Casas, V. (2026). Causal effects of liberalization on agriculture in New Zealand. https://doi.org/10.2139/ssrn.7700061", "why": "農業自由化の代表例とされる1984年のニュージーランドの農業支援の撤廃を、改革しなかった10か国による合成コントロールで評価する。農業の全要素生産性への効果は検出されず、生産の構成の組み替えが起きたとし、通説の前後比較による解釈を見直す。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "1984年のニュージーランドの農業支援の撤廃は、合成コントロールで評価すると農業の全要素生産性を高めておらず、生産の構成を組み替えたことを示した（抄録）。未査読。", "p3": "同じ期間に改革しなかった構造の似た10か国から合成コントロールを作り、1984〜1994年の農業の全要素生産性と部門構成の4指標への改革の効果を推定した（抄録）。", "p5": "全要素生産性への効果は検出されず、生産の構成の組み替えがみられた。生産額の35%に当たる支援を失っても、支援を続けた比較国に遅れをとることもなかった（抄録）。", "fun": "補助金をやめれば農家が効率的になる、という話の代表例がニュージーランドだった。ところが、その根拠は改革の前後を比べただけだった。似た国を組み合わせて「もし改革しなかったら」を作って比べると、生産性は上がっておらず、作るものの組み合わせが変わっただけだった。有名な通説を、比べ方を変えて見直した点が面白い。", "unverified": "本文は入手できず、部門構成の4指標の具体的な変化は確認できなかった。"}}, {"id": "pn40", "rank": 40, "field": "機械学習", "headline": "視覚と言語を混ぜる時期のスケーリング則", "title": "Scaling Laws for Vision-Language Fusion", "url": "https://arxiv.org/abs/2611.22351", "authors": "Seng Pei Liew ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Liew, S. P., Suzuki, T., & Tokui, S. (2026). Scaling Laws for Vision-Language Fusion (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22351", "why": "言語モデルに後から画像を学ばせる後期融合と、事前学習の最初から混ぜる早期融合の得失を、学習の動きの分析から整理する。融合時の検証損失を基本の学習軌道とそこからのずれに分けてモデル化し、高価で経験則に頼っていた学習手順の設計に指針を与える。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "視覚と言語を混ぜる事前学習の検証損失を、データ型ごとの基本の学習軌道と、モダリティ間の競合による分布のずれに分けて表すスケーリング則を導き、早期融合と後期融合の得失を定量化した（抄録）。未査読。", "p3": "既存の言語モデルに画像を後から学ばせる後期融合と、最初から混ぜる早期融合の学習の動きを系統的に分析し、混合比・学習ステップ・モデルの大きさにわたって損失を予測する統一的な法則を導いた（抄録）。", "p5": "データ量を固定すると、早期融合は言語の性能を保ち、後期融合は視覚の性能に有利で、モデルが大きくなるほど早期融合に傾く。多くの実験で法則が学習の動きを捉えることを確かめた（抄録）。", "fun": "画像も文章も分かるAIを作るとき、まず文章を学ばせてから画像を足すか、最初から両方を混ぜて学ばせるか、という選び方がある。この研究は、二つのやり方の学習の進み方を一つの式で予測できるようにした。小さなAIでは後から足すほうがよいこともあるが、大きくなるほど最初から混ぜるほうが得になる、という傾向が見えた点が面白い。", "unverified": "本文は入手できず、実験に使ったモデルの大きさの範囲は確認できなかった。"}}, {"id": "pn41", "rank": 41, "field": "機械学習", "headline": "LLMの推論でMCTSは数えるものを間違えている", "title": "MCTS Is Counting the Wrong Thing: Learning Exploration Counts for LLM Reasoning", "url": "https://arxiv.org/abs/2611.22301", "authors": "Xuan Zhang ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Zhang, X., Zhou, Z., Hu, Z., Feng, Y., Hao, H., Qi, Y., & Qu, C. (2026). MCTS Is Counting the Wrong Thing: Learning Exploration Counts for LLM Reasoning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22301", "why": "LLM推論でのモンテカルロ木探索は、同じ推論戦略の言い換えに別々の訪問回数を与えて探索ボーナスを重複させることを指摘し、この断片化が後悔を増やすことを理論的に示す。方策の隠れ表現から擬似的な訪問回数を学習するLPC-MCTSを提案する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMの推論でのモンテカルロ木探索は同じ推論戦略の言い換えに別々の訪問回数を与えて探索を無駄にしており、隠れ表現から擬似的な訪問回数を学ぶLPC-MCTSで改善できることを示した（抄録）。未査読。", "p3": "UCTの探索の統計量だけを変え、方策の隠れ表現に付けた軽いCoin-Flipping Networkの頭部で表現の網羅度を推定し、関連する枝が探索の証拠を共有できるようにした。回数の断片化が累積後悔を増やすことを理論的に示した（抄録）。", "p5": "5つの数学推論と7つの検索のベンチマークで強いMCTSの基準を一貫して上回った。推論時に回数だけを置き換えると数学の平均mean@16がQwen2.5-7Bで3.79ポイント、Qwen3-4Bで2.71ポイント上がり、学習と推論の両方で使うと4.96と4.37ポイント上がった（抄録）。", "fun": "迷路を探索するとき、同じ道を言い方を変えて何度も「新しい道だ」と数えてしまったら、探索は無駄だらけになる。AIの推論での木探索にもこの問題があり、言い回しが違うだけの同じ考え方を別物として数えていた。考え方の中身が似ているかをAI自身に判定させて数え直すと、少ない探索で正解に近づけた点が面白い。", "unverified": "本文は入手できず、検索ベンチマークでの改善の数値は確認できなかった。"}}, {"id": "pn42", "rank": 42, "field": "機械学習", "headline": "画像群から4次元の形状と運動を復元する基盤モデル", "title": "π^4: A Foundation Model for 4D Scene Geometry and Motion", "url": "https://arxiv.org/abs/2611.23144", "authors": "Yifan Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-18", "apa": "Wang, Y., Zhao, W., Yang, N., Guo, H., Dong, J., Zhang, W., & Shen, C. (2026). $π^4$: A Foundation Model for 4D Scene Geometry and Motion (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23144", "why": "1枚の画像・順不同の画像群・動画から、密な形状、カメラ姿勢、実寸のスケール、2D・3Dの点の追跡と動く物体のマスクを一つのモデルで推定する。形状の評価で総合的に最もよい平均順位を得たと報告する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "1枚の画像・順不同の画像群・動画のどれからでも、密な形状、カメラ姿勢、実寸のスケール、2D・3Dの点の追跡、動く物体のマスクを一度の順伝播で推定する4次元の基盤モデルπ^4を示した（抄録）。未査読。", "p3": "形状の枝と、形状を条件とする運動の枝を結合し、画像上の対応を再構成した目標視点の形状で3次元に持ち上げる。共有の骨格で全体は約0.5Bパラメータと、多くの基準モデルの半分未満である（抄録）。", "p5": "形状の評価で総合的に最もよい平均順位を得て、単視点・多視点の2D・3Dの点追跡と動く物体の分割でも競争的だった。最大64視点の文脈で学習しながら、数千枚の画像の大規模な場面も扱えた（抄録）。", "fun": "スマホで撮った写真や動画から、写っている場所の立体の形と、そこで動いているものの軌跡を一度に取り出せたら便利だ。このモデルは、カメラの設定が分からない普通の写真からでも、形と動きを同時に復元する。学習では最大64枚の組しか見ていないのに、数千枚の写真の大きな場面まで扱える点が面白い。", "unverified": "本文は入手できず、ベンチマークごとの数値は確認できなかった。"}}, {"id": "pn43", "rank": 43, "field": "工学", "headline": "光で形状記憶ポリマーの振動特性を時空間に制御", "title": "Spatiotemporal programming of shape memory polymers for tunable vibration responses", "url": "https://arxiv.org/abs/2611.21930", "authors": "Samantha Averitt ほか", "venue": "arXiv", "date": "Wed, 18 Nov 2026", "apa": "Averitt, S., Sim, J., & Zhao, R. R. (2026). Spatiotemporal programming of shape memory polymers for tunable vibration responses (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.21930", "why": "炭素を混ぜた形状記憶ポリマーの表面に光のパターンを投影して温度分布を作り、弾性波の伝わり方と振動モードを空間と時間の両方で書き換えられるメタマテリアルを示す。透過スペクトルや振動モードを再構成できる適応的な構造の設計の幅を広げる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "炭素を混ぜた形状記憶ポリマーの表面に光のパターンを投影して温度分布を作り、弾性波の伝わり方と振動モードを空間と時間の両方で書き換えられるメタマテリアルの基盤を示した（抄録）。未査読。", "p3": "光熱でプログラムできる形状記憶ポリマー（C-SMP）に利用者が決めた光のパターンを当て、空間的な熱機械特性の分布を作り、空間と時間をともに設計変数として扱う（抄録）。", "p5": "透過スペクトルの調整や振動モードのプログラムなど、幅広い弾性波の機能を一枚のC-SMPの表面で実現できたと述べる（抄録）。抄録には数値の記載がない。", "fun": "形状記憶ポリマーは温めると柔らかくなる性質をもつ。この研究は、光で好きな模様に温めることで、板の一部だけを柔らかくし、揺れの伝わり方を自在に変えられるようにした。しかも模様を時間とともに変えられるので、同じ板が場面に応じて別の振動の部品として働く。光で振動を描き替えるという発想が面白い。", "unverified": "本文は入手できず、透過の変化の大きさなどの数値は確認できなかった。"}}, {"id": "pn44", "rank": 44, "field": "工学", "headline": "浮体式洋上風車の船体形状を連成時刻歴で設計", "title": "Nonlinear Coupled Time-Domain Modeling of Hull Geometry Effects for Improved Dynamic Response of Floating Wind Platforms", "url": "https://doi.org/10.21203/rs.3.rs-11457709/v1", "authors": "Mohammad Javad Eslahi ほか", "venue": "Research Square (In Review)", "date": "2026-11-17", "apa": "Eslahi, M. J., Kazemi, S., Ezam, M., & Hasanabad, M. G. (2026). Nonlinear Coupled Time-Domain Modeling of Hull Geometry Effects for Improved Dynamic Response of Floating Wind Platforms. https://doi.org/10.21203/rs.3.rs-11457709/v1", "why": "空力・流体力・制御・構造の動力学を一体で解く時刻歴の連成解析に、非線形の波の運動学と粘性減衰を入れ、浮体式洋上風車のセミサブ型浮体の柱寸法とヒーブプレートを遺伝的アルゴリズムで探索する。線形・分離した解析が見落とす二次の漂流力や過渡応答を考慮した設計を示す。", "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "空力・流体力・制御・構造を一体で解く非線形の連成時刻歴解析と遺伝的アルゴリズムで、浮体式洋上風車のセミサブ浮体の形状を設計し、ヒーブの固有振動数を波のエネルギーの主帯域から外せることを示した（抄録）。未査読。", "p3": "非線形の波の運動学、粘性減衰、時刻歴の空力の相互作用を一つのソルバーに入れ、柱の寸法とヒーブプレートの形状を遺伝的アルゴリズムで探索し、不規則波の海況で評価した（抄録）。", "p5": "形状の変更が浮体の運動の感度を直接左右し、改良した形状でヒーブの固有振動数が波の主帯域より下がり、ピッチは渦放出とロータの空力減衰で安定した。参照データとの比較で推力と駆動系のトルクの過渡的な標準偏差が大きく下がったとする（抄録）。", "fun": "海に浮かぶ風車は、波に合わせて上下に揺れると発電が乱れ、部品も傷む。この研究は、浮きの柱の太さや下に付ける板の形をコンピュータで試行錯誤し、浮体が揺れやすい周期を、波がいちばん強く押す周期からずらした。複雑な制御を足すのではなく、形を工夫するだけで揺れを抑える発想が面白い。", "unverified": "本文は入手できず、標準偏差の低減率などの数値は確認できなかった。"}}, {"id": "pn45", "rank": 45, "field": "工学", "headline": "二次経路補償で薄肉部品の切削びびりを抑制", "title": "Secondary-Path-Compensated FxLMS Active Control of Milling Chatter in Thin-Walled Workpieces", "url": "https://doi.org/10.21203/rs.3.rs-10982997/v1", "authors": "Zicheng Wang ほか", "venue": "Research Square (In Review)", "date": "2026-11-18", "apa": "Wang, Z., Wang, C., Zhu, B., He, W., Cai, M., Zhao, G., & Yang, Y. (2026). Secondary-Path-Compensated FxLMS Active Control of Milling Chatter in Thin-Walled Workpieces. https://doi.org/10.21203/rs.3.rs-10982997/v1", "why": "圧電アクチュエータで薄肉部品のびびり振動を能動制御する際、制御出力が計測点に届くまでの二次経路の利得・位相・遅れが更新方向を偏らせる問題に、等価な制御力-加速度モデルで参照信号を前処理するFxLMS法で対処する。アルミ板の実験で実装する。", "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "薄肉の部品の切削びびりの能動制御で、制御出力が計測点に届くまでの二次経路を補償するFxLMS法により、通常のLMSよりはるかに大きく振動を抑えられることを示した（抄録）。未査読。", "p3": "等価な制御力-加速度モデルを二次経路の推定に使って参照信号を前処理するFxLMS法を、四隅支持の6061アルミ板（300×300×4 mm）、圧電スタック、加速度1チャンネルの装置に実装し、シミュレーション、実測信号のオフライン試験、切削試験で評価した（抄録）。", "p5": "総遅れ0.8 msでLMSは定常RMS応答を8.1%しか減らさず558.857 Hz成分を増幅したが、FxLMSは82.9%減らした。4,000・7,000・10,000 r/minの切削で振幅は約75.0%・66.7%・50.0%、算術平均粗さRaは65.6%・53.6%・15.6%減った（抄録）。", "fun": "薄い金属板を削ると、板が細かく震えて表面がでこぼこになる。逆向きの揺れをぶつけて打ち消す制御があるが、命令が板に届くまでのわずかな遅れが邪魔をして、かえって揺れを増やすこともある。この研究は、その遅れの通り道をあらかじめ計算に入れることで、揺れを8割以上消した。遅れを無視しないだけで結果が大きく変わる点が面白い。", "unverified": "本文は入手できず、高速での効果の低下の原因の詳しい分析は確認できなかった。"}}, {"id": "pn46", "rank": 46, "field": "工学", "headline": "崩壊時の強度で設計する耐震設計の考え方", "title": "The Philosophy of Collapse-Based Design of Structures: A Modern and Unified Framework for Seismic Practices", "url": "https://doi.org/10.2139/ssrn.7702200", "authors": "Vahid Jaberi", "venue": "SSRN", "date": "2026-11-18", "apa": "Jaberi, V. (2026). The Philosophy of Collapse-Based Design of Structures: A Modern and Unified Framework for Seismic Practices. https://doi.org/10.2139/ssrn.7702200", "why": "等価荷重と低減係数に頼る現行の耐震設計に代わり、構造が崩壊すると見込まれる地震強度で解析し、各部材をその荷重での最大耐力で設計する崩壊ベース設計の考え方を示す。崩壊強度は設計スペクトルを3つの係数で引き上げた崩壊スペクトルで事前に求める。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "構造が崩壊すると見込まれる地震強度で解析し、各部材をその荷重での最大耐力で設計する崩壊ベース設計（CBD）の考え方を、現行の耐震設計に代わる統一的な枠組みとして示した（抄録）。未査読の論考。", "p3": "崩壊強度を、設計スペクトルをスペクトル加速度比・設計スペクトル比・崩壊余裕比の3つの係数で引き上げた崩壊スペクトルで事前に求め、耐久時間法で高速に行う漸増の非線形時刻歴解析で、靭性部材は塑性耐力、非靭性部材は弾性耐力、接合部と基礎は伝わる最大荷重で設計する（抄録）。", "p5": "解析が終局耐力に達するため、過剰強度・靭性・不整形・P-Δなどの影響が直接結果に入り、応答修正係数や強柱弱梁の照査などが不要になり、崩壊余裕比や動的な耐力曲線も同時に得られると述べる（抄録）。", "fun": "今の耐震設計は、計算機が遅かった時代に作られた「割り引き」や「補正」の係数をたくさん使っている。この論考は、今の計算機なら建物が実際に壊れる揺れの強さまで直接計算できるのだから、その結果で設計すれば係数は要らない、と主張する。道具の進歩に合わせて設計の考え方そのものを作り直そうとする点が面白い。", "unverified": "本文は入手できず、これまでの研究との比較結果の詳細は確認できなかった。既存の設計基準での検証の程度も未確認。"}}, {"id": "pn47", "rank": 47, "field": "地震工学・防災", "headline": "誘発地震の応力降下は規模とともに増える", "title": "Scale-dependent stress drop scaling of induced earthquakes driven by tensile-to-shear transition: Evidence from the Gonghe EGS field, China", "url": "https://doi.org/10.21203/rs.3.rs-11505756/v1", "authors": "Cong Jiang ほか", "venue": "Research Square (In Review)", "date": "2026-11-18", "apa": "Jiang, C., & Jiang, C. (2026). Scale-dependent stress drop scaling of induced earthquakes driven by tensile-to-shear transition: Evidence from the Gonghe EGS field, China. https://doi.org/10.21203/rs.3.rs-11505756/v1", "why": "共和の地熱開発（EGS）の微小地震で、経験的グリーン関数のスペクトル比とブートストラップにより震源パラメータの不確実性を定量化し、応力降下と地震モーメントに正の相関（自己相似でない）があることを示す。地質条件や操業段階が違っても頑健だとする。", "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "中国の共和の地熱開発（EGS）の誘発地震で、応力降下が地震モーメントとともに増える自己相似でないスケーリングを示し、それを引張から剪断への破壊様式の移行で説明するモデルを提案した（抄録）。未査読。", "p3": "高品質の微小地震のデータで、経験的グリーン関数のスペクトル比とブートストラップにより震源パラメータの不確実性を定量化し、均質な基盤から断層の発達した区域まで地質条件の異なる場所でスケーリングの頑健さを調べた（抄録）。", "p5": "応力降下と地震モーメントに有意な正の相関があり、地質条件や操業段階によらず頑健だった。P波のスケーリング指数（約0.72）はS波（約0.57）を系統的に上回り、コーナー周波数の比は規模とともに約1.0から剪断の理論限界へ近づいた（抄録）。", "fun": "地震は大きさが違っても同じ形の縮小コピーだという「自己相似」の考えは、揺れの予測の土台になっている。地熱開発で起きる小さな地震を詳しく調べると、小さな地震は岩が開くような割れ方、大きな地震はずれる割れ方で、応力の下がり方が規模で変わっていた。小さな地震が大きな地震の単なる縮小版ではない、という発見が面白い。", "unverified": "本文は入手できず、解析した地震の数と規模の範囲は確認できなかった。"}}, {"id": "pn48", "rank": 48, "field": "地震工学・防災", "headline": "トルコの年間地震数の変動を隠れマルコフで表す", "title": "Regime Switching or Overdispersion: A Comparison of Poisson Hidden Markov and Negative Binomial Models for Annual Seismicity in Türkiye", "url": "https://doi.org/10.21203/rs.3.rs-11119485/v1", "authors": "Hakan Karaca", "venue": "Research Square (In Review)", "date": "2026-11-18", "apa": "Karaca, H. (2026). Regime Switching or Overdispersion: A Comparison of Poisson Hidden Markov and Negative Binomial Models for Annual Seismicity in Türkiye. https://doi.org/10.21203/rs.3.rs-11119485/v1", "why": "地震の時間的な群発で生じる過分散を、ポアソン型と負の二項型の隠れマルコフモデルで比べ、トルコの年間地震数を2状態のポアソン隠れマルコフモデルが最もよく表すとする。地震活動の状態の切り替わりを捉える。", "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "トルコの年間地震数は、2つの活動水準を行き来する2状態のポアソン隠れマルコフモデルが最もよく表すことを示した（抄録）。未査読。", "p3": "地震の群発と余震による過分散を、ポアソン隠れマルコフモデルと負の二項隠れマルコフモデルで比べ、AICとBICでモデルを選んだ（抄録）。", "p5": "2状態のポアソン隠れマルコフモデルがAIC・BICの両方で選ばれた。BICでは1状態の負の二項モデルも競争的で、状態内の過分散も変動の一部を説明すると述べる（抄録）。", "fun": "地震の回数は年によって大きくばらつく。そのばらつきが「地震が多い時期と少ない時期が切り替わる」ためなのか、「もともとばらつきが大きい」ためなのかは、見分けが難しい。トルコのデータでは、二つの時期の切り替えとして見るほうがよく当てはまった。同じばらつきでも、背後の仕組みの解釈が分かれる点が面白い。", "unverified": "本文は入手できず、使った年数と地震の規模の下限は確認できなかった。"}}, {"id": "pn49", "rank": 49, "field": "環境・気候政策", "headline": "炭素クレジットの健全性に市場はいくら払うか", "title": "Estimating Integrity Premiums within Voluntary Carbon Markets", "url": "https://doi.org/10.2139/ssrn.7693998", "authors": "Frank Howard", "venue": "SSRN", "date": "2026-11-17", "apa": "Howard, F. (2026). Estimating Integrity Premiums within Voluntary Carbon Markets. https://doi.org/10.2139/ssrn.7693998", "why": "約15,000件の取引価格とクレジットの格付けを組み合わせ、自然由来の72プロジェクトのクレジットについて、環境上の健全性が価格にどう反映されるかを推定する枠組みを作る。先物による価格発見を補う情報を与える。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ボランタリー炭素市場で、炭素クレジットの環境上の健全性に市場がいくらの価格を付けているかを推定する枠組みを作った（抄録）。未査読。", "p3": "AlliedOffsetsの約15,000件の価格とSylveraの格付けを組み合わせ、2022〜2025年にCMEのN-GEO先物に受け渡しできる農業・林業・その他の土地利用の72プロジェクトのクレジットについて、価格に影響する属性を分析した（抄録）。", "p5": "抄録には健全性のプレミアムの推定値の記載がなく、先物による価格発見を補う枠組みになると述べる（抄録）。", "fun": "企業が自分の排出を打ち消すために買う「炭素クレジット」には、本当に二酸化炭素を減らしているか怪しいものも混じる。この研究は、格付け会社の評価と実際の取引価格を突き合わせ、「確かなクレジット」にどれだけ高い値段が付いているかを測ろうとした。見えにくい品質の値段を市場データから読み解く点が面白い。", "unverified": "本文は入手できず、推定されたプレミアムの大きさは確認できなかった。"}}, {"id": "pn50", "rank": 50, "field": "環境・気候政策", "headline": "流域の「水破産」を制度の条件で類型化", "title": "The Global Water Bankruptcy: Climate Stress, Institutional Path Dependency, and Policy Implementation Gaps in Post-crisis Basins", "url": "https://doi.org/10.2139/ssrn.7701318", "authors": "Unique Ndubuisi Keke", "venue": "SSRN", "date": "2026-11-18", "apa": "Keke, U. N. (2026). The Global Water Bankruptcy: Climate Stress, Institutional Path Dependency, and Policy Implementation Gaps in Post-crisis Basins. https://doi.org/10.2139/ssrn.7701318", "why": "水利用の負債が再生可能な水の賦存量を上回り制度が差を立て直せなくなった状態を水破産と定義し、10流域を制度の条件で崩壊・移行・改革可能に分類する。統治のよい流域でも制度的な障害に直面するという逆説を示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "水利用の負債が再生可能な水の賦存量を上回り、制度が差を立て直せなくなった流域を「水破産」と定義し、10流域を制度の条件で類型化して、危機から改革までの速さが水の安全を左右すると論じた（抄録）。未査読。", "p3": "10流域を制度の条件で崩壊・移行・改革可能に分類する類型、危機の始まりから改革の実施までの年数を測る実施速度の指標、しきい値モデルと気候のリスク地図、問題駆動の反復的適応（PDIA）の準備度の得点を組み合わせた（抄録）。", "p5": "危機から改革までは平均23年かかり、高排出の中期のナイル川では猶予が17.9年と短く、アラル海とウルミア湖は70%のしきい値を超えていた。統治のよい流域が配分の硬直性で適応力を築きにくい逆説も示し、マレー・ダーリングの7年の改革を、遅れは縮められる例とする（抄録）。", "fun": "会社が借金を返せなくなるのが倒産なら、使う水が自然に補われる量を上回り続ける流域は「水の倒産」状態だ。この研究は、水不足の深刻さより、制度がどれだけ速く改革できるかで流域の運命が分かれると論じた。きちんと統治されている流域ほど、決まりが固くて変わりにくいという逆説も面白い。", "unverified": "本文は入手できず、実施速度の指標の計算方
