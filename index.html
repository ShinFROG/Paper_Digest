<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 10px; font-size: 14px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.ask {
  align-self: flex-start; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 12px; padding: 10px 14px; font-size: 15px; font-weight: 700;
}
.askrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ask.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding: 12px 20px; font-size: 16px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 20;
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  width: 100%; max-width: 720px; background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); display: grid; gap: 10px;
  max-height: 100vh; max-height: 100dvh; overflow-y: auto; overscroll-behavior: contain;
}
.sheet h2 { margin: 0; font-size: 18px; }
.sheet p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
.sheet .btn { width: 100%; }
.sheet textarea {
  width: 100%; height: 38vh; font: 13px/1.6 var(--font); border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); padding: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">AIに聞く</h2>
    <p id="sheet-paper"></p>
    <button class="btn primary share" id="share-full" type="button">節ごとに詳しく聞く</button>
    <button class="btn share" id="share-brief" type="button">要点だけ聞く</button>
    <p id="sheet-note"></p>
    <button class="btn" id="copy-full" type="button">依頼文をコピー（節ごとに詳しく）</button>
    <button class="btn" id="copy-brief" type="button">依頼文をコピー（要点だけ）</button>
    <p id="sheet-status" aria-live="polite"></p>
    <textarea id="sheet-text" readonly hidden aria-label="依頼文"></textarea>
    <button class="btn" id="sheet-close" type="button">閉じる</button>
  </div>
</div>

<script id="report-data" type="application/json">{"date": "2026-09-26", "intro": "この日は、2つの定期作業（最新論文レビューとTop論文レビュー）の選定を1つのページにまとめました。「最新」の関連20報と注目10報は、新着約1万2千件（arXiv、SSRN、Research Square、bioRxiv、Preprints.org、学術誌、RePEc、J-STAGE など）と主要誌・注目AI論文から、「Top誌」の関連20報と注目10報は、SJRの小分類で上位10%に入る3,996誌に9月25〜26日に登録された研究論文から選んでいます。解説は論文レビューのルールに沿い、本文を読めたもの21報、抄録のみ31報、題名のみ8報です。", "related": [{"rank": 1, "theme": "VBI・橋梁SHM", "headline": "車軸の傾きが車両走査法の結果をゆがめる", "title": "Incorporating wheel axle inclination effects into a vehicle-bridge interaction system for vehicle scanning method", "url": "https://doi.org/10.1142/s0219455428710022", "authors": "Judy P. Yang ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-09-24", "id": "r01", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "試験車の車軸の傾きが車両応答に余分な調和成分を生むことを理論式で表し、その成分を橋の振動数と見分ける手がかり（車輪の特性への依存）を示した（抄録）。", "p2": "車両走査法（VSM: vehicle scanning method、走行する試験車の応答から橋の動特性を同定するドライブバイ手法）では、車軸の傾きなど試験車の幾何学的な不完全さが計測応答に余計な周波数成分を加え、走査結果の解釈を誤らせうる（抄録）。従来のVBIモデルでの扱いは未確認。", "p3": "車軸の傾きの効果を車両-橋梁相互作用（VBI: vehicle-bridge interaction）系に組み込む定式化を行い、傾き角・車輪半径・車速を変えて車両スペクトル上の調和成分を調べた（抄録）。解釈：傾いた車軸は車輪が1回転するごとに周期的な加振になるため、周波数は車速と車輪の大きさで決まり、振幅は傾き角で決まる、という直観で読める。", "p4": "抄録から読める範囲では、理論解析とパラメータ検討が中心で、実験で記録された車両応答に現れる調和成分を説明できるかを論点にしている。実データでの定量的な検証の規模や評価指標は抄録に記載がない。", "p5": "傾き角は主に調和加振の振幅に効き、車輪半径と車速がその周波数を決める（抄録）。この成分は車輪の特性に依存するため、橋に由来する周波数成分と区別できる（抄録）。実測の車両応答で観察されていた調和成分に理論的な説明を与え、車軸の傾きの指標として使える可能性を示した（抄録）。", "p6": "抄録の範囲では、実車・実橋での検証の規模や、路面凹凸とノイズがある条件での識別精度は分からない。解釈：車速を変えた複数回の走行で周波数の動きを見るなど、運用上の条件が必要になると考えられる。", "unverified": "本文（式・図・実験条件）を読めていないため、定式化の詳細と数値での検証結果は未確認。"}}, {"rank": 2, "theme": "会計情報科学", "headline": "預金残高の動きで中小企業の財務困窮予測が向上", "title": "Enhancing SME financial distress prediction by integrating financial and deposit dynamics indicators", "url": "https://doi.org/10.1080/00472778.2026.2730423", "authors": "Kaito Terada ほか", "venue": "Journal of Small Business Management", "date": "2026-09-16", "id": "r02", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexの抄録を使用", "preprint": false, "p1": "預金残高の動き（deposit dynamics）を財務比率に加えると、日本の中小企業の財務困窮の予測が、財務だけのモデルより統計的に有意に改善することを示した（抄録）。", "p2": "中小企業の信用リスク評価は財務諸表と与信枠に頼るが、決算は適時性に欠け、与信のない零細企業は評価の対象から外れてしまう（抄録）。", "p3": "与信の有無にかかわらずどの企業も持つ流動性預金の残高の推移を、資金繰りの早期警戒シグナルとみなし、財務比率と組み合わせて機械学習で財務困窮を予測する（抄録）。入力は財務比率と預金動態の指標、出力は困窮の予測。直観：預金残高は高い頻度で観測でき、年1回の決算より早く資金繰りの悪化を映す。", "p4": "日本の中小企業のデータで、財務比率だけのモデルと、預金動態の指標を加えたモデルの予測力を比べる（抄録）。具体的な評価指標、企業数、期間は抄録に記載がない。", "p5": "預金動態を加えると、財務だけのモデルより予測力が統計的に有意に改善した（抄録）。COVID-19の流行期のような不確実な時期には、預金指標が財務比率とずれて悪化し、ゆがんだ財務の数値を補って予測力を保った（抄録）。", "p6": "抄録の範囲では、改善の大きさ、使ったアルゴリズム、データの出所は分からない。解釈：預金の履歴を持つ金融機関でないと同じ指標を作りにくく、他の金融機関や他国への一般化は抄録からは確認できない。", "unverified": "改善幅の数値、使ったモデル、データの期間と企業数は抄録にないため未確認。"}}, {"rank": 3, "theme": "VBI・橋梁SHM", "headline": "スマホと加速度計で地方の橋を見守る基盤", "title": "A crowdsensing platform for structural health monitoring of rural bridge infrastructure", "url": "https://doi.org/10.12688/openreseurope.22915.2", "authors": "Nikolaos D. Tantaroudas ほか", "venue": "Open Research Europe", "date": "2026-09-22", "id": "r03", "explain": {"basis": "本文", "basis_note": "Open Research Europe の本文（手法・結果・考察・結論の節と図表キャプション）を読んだ。公開査読つき（第2版、2件承認・1件条件つき承認）", "preprint": false, "p1": "スマートフォンにUSB-C加速度計をつないで乗用車で橋を渡るだけのドライブバイ計測と、健全時の応答を学んだオートエンコーダを組み合わせ、予算の乏しい地方の橋を見守るプラットフォームをスペインとギリシャの2橋で実装・試験した（Abstract、Methods）。", "p2": "地方の老朽橋は安全上の課題だが、常設センサによる構造ヘルスモニタリング（SHM）は予算の限られた地域には高価すぎる（Abstract）。車両による間接計測は安価だが、感度が低く、路面や車両の条件で結果がぶれる（Discussion）。", "p3": "車のダッシュボードに固定した加速度計の鉛直加速度（2000 Hz、1回5〜10秒）をFFTし、2〜15 Hzの振幅スペクトルを650点のベクトルにして入力する（Acquisition Protocol、Autoencoder）。健全時の走行だけで学習したオートエンコーダ（入力を圧縮して復元するニューラルネット）の復元誤差を異常度とし、学習データの復元誤差の99パーセンタイルを閾値にする（Anomaly Threshold）。誤差は0〜1の構造健全度指標（SHI）に変換し、5段階でウェブに表示する。", "p4": "各橋で同じ車をほぼ一定の速度（約70 km/hと約40 km/h）で30回走らせたデータで学習し、学習に使っていない走行と、平坦な道路などの対照信号を分けられるかを見た（Results、Operational Variability）。有限要素（FE）モデル（ANSYS APDL）は、現地で測った固有振動数と合うかで確かめた（Finite Element Modeling）。", "p5": "橋を渡った走行は復元誤差が小さく、平坦な道路などの対照信号は誤差が大きく、99パーセンタイルの閾値で両者を分けられた（Results、図7・図8）。FEモデルは両橋で実測の固有振動数とよく合ったと述べられている（図9・図10）。", "p6": "実際の損傷時のデータはなく、「異常」は学習した基準からのずれを指すだけで、損傷を検出できることの検証ではないと著者自身が明記している（Discussion、Conclusions）。学習データは30回と少なく、橋ごとに学習が必要で、季節の温度変化などの評価は今後の課題（Discussion）。解釈：対照信号は橋を渡っていない信号なので、見分けられて当然に近く、損傷の検出性能は未検証とみるのが妥当。", "unverified": "図の中の数値（実測とFEの固有振動数、復元誤差の分布）は取得したテキストに含まれず未確認。"}}, {"rank": 4, "theme": "会計情報科学", "headline": "実行可能な反実仮想説明を作る「FCx」", "title": "FCx: An algorithm for finding Feasible Counterfactual Explanations", "url": "https://doi.org/10.48550/arxiv.2609.19383", "authors": "Kleopatra Markou ほか", "venue": "arXiv", "date": "2026-09-16", "id": "r04", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（問題設定・手法・実験・結論の節と表1・2のうち本文で言及された値）を読んだ", "preprint": true, "p1": "反実仮想説明（CF: counterfactual explanation、分類結果を変えるには入力をどう変えればよいかを示す説明）を作るときに、人が与えた論理制約と、データから因果探索で得た関係の両方を守らせ、実行できる変更だけを提案する手法FCxを示した（Abstract、§4）。", "p2": "既存の手法は、変更が少なく現実的なCFを作れても実行可能性（feasibility）を保証せず、人種を変える、年齢を下げるといった不可能な変更を提案してしまう（Abstract、§3.2）。", "p3": "入力は表形式データの1件と目標のクラス、出力はCF（§3）。変分オートエンコーダ（VAE）の復元出力をCF候補とし、7項目の損失を同時に小さくする（§4.2）：近さ、クラスを変えるための損失、ハード制約（例：年齢は減らない、学歴が上がるなら年齢も上がる。式5・6）、PCアルゴリズムで推定した因果グラフにもとづくソフト制約（式10）、変える特徴の数、局所外れ値因子（LOF: 周囲より密度が低いほど大きくなる外れ値の指標）など。人種のように変えられない属性は生成から外し、元の値に戻す（§4.4）。", "p4": "公開データ4つ（Adult、KDD Census-Income、Law School、Folktables）で、Mahajanらの手法、REVISE、C-CHVAE、CEM、DiCE、FACE、VC-Net、FCEGAN、CEILSと比べた（§5.1、§5.5）。指標は、目標のクラスになった割合（妥当性）、制約を満たした割合（実行可能性スコア）、元の入力との近さ、変えた特徴の数、LOFと外れ値の数（§5.4）。", "p5": "FCxは全実験で妥当性100%（§5.6）。実行可能性スコアは、Adultで単項制約版FCx-Uが74.91%、二項制約版FCx-Bが82.92%、Law Schoolで93.33%と94.9%、Folktablesで91.04%と84.32%で、ほぼすべてのデータで最も高かった（§5.6、表1・2）。KDD-Censusの単項制約ではC-CHVAEが98.87%で上回ったが、その妥当性は48.44%にとどまった（§5.6）。", "p6": "ハード制約は年齢と学歴、LSATと学校の階層という少数の組み合わせでしか試しておらず、特徴が多く標本も大きいKDD-CensusとFolktablesではLOFの値と外れ値が増えた（§5.6）。解釈：ソフト制約はPCアルゴリズムが推定した因果グラフの正しさに依存するため、推定の誤りに対する頑健性は別に確かめる必要がある。", "unverified": "表1・2の全数値と、§5.7のアブレーション（頑健性分析を含む）の結果は照合していない。"}}, {"rank": 5, "theme": "VBI・橋梁SHM", "headline": "点検記録から鋼桁橋のFEモデルを自動生成", "title": "Evidence-aware automated finite-element model generation for steel girder bridges from incomplete inspection archives", "url": "https://doi.org/10.2139/ssrn.7517644", "authors": "Shreejan Maharjan ほか", "venue": "SSRN", "date": "2026-09-24", "id": "r05", "explain": {"basis": "抄録", "basis_note": "SSRNは自動取得を拒否したため、Crossrefに登録された抄録を使用", "preprint": true, "p1": "部材寸法が欠けた点検記録から、各値の出所と確からしさを保ったまま、単純支持の鋼プレートガーダー橋の有限要素（FE）モデルを自動で作る枠組みを示した（抄録）。", "p2": "定期点検の記録は橋の構成や形状を記すが、FEモデル化に必要な部材ごとの寸法が欠けることが多い。欠けた値を埋めると、確認済みの情報と推定値の区別が失われる（抄録）。", "p3": "各構造パラメータに出典・信頼度・証拠の状態・修正履歴を持たせ、それに従って構成の固定、妥当性のチェック、保護された項目の補正、モデルの補完を行う（抄録）。点検の部材番号で構成を決定的に拘束し、証拠のある値は数値計算で書き換えない。桁の断面が記録にない場合は補完用の代替断面を生成するが、竣工時の確認済み情報とは明示的に区別する（抄録）。", "p4": "20橋の点検記録で評価した（抄録）。良さの基準は、手作業で確認した参照値（桁数・支間長・幅員）との一致と、採用したFEの応力・たわみのチェックを満たすこと（抄録）。", "p5": "20橋中19橋を処理でき、処理した全橋で桁数・支間長・幅員が参照と一致した（抄録）。11橋（原文は Eleven）は代替断面なしで応力・たわみのチェックを満たし、残る8橋は補完断面を生成した後の再解析で同じチェックを満たした（抄録）。損傷要素の位置づけを使うと、一部の構成・配置の項目が改善した（抄録）。", "p6": "対象は単純支持の鋼プレートガーダー橋に限られ、評価は20橋と小規模（抄録）。解釈：チェックを満たすことは、モデルが実橋の挙動（固有振動数など）を再現することの保証ではなく、実測との照合は抄録からは確認できない。", "unverified": "本文を取得できず、処理できなかった1橋の理由と、チェックの具体的な基準値は未確認。"}}, {"rank": 6, "theme": "VBI・橋梁SHM", "headline": "実橋に損傷を与えたデータで損傷検知を検証", "title": "Unsupervised damage detection in a full-scale bridge using a frequency-domain autoencoder", "url": "https://doi.org/10.1016/j.rineng.2026.113055", "authors": "Cian Ó Cathasaigh ほか", "venue": "Results in Engineering", "date": "2026-09-17", "id": "r06", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexの抄録を使用", "preprint": false, "p1": "車両の通過ごとのスペクトルを群にまとめて学習させることで、実物大の橋に段階的に与えた損傷を、健全時のデータだけで学習したオートエンコーダで検出できることを示した（抄録）。", "p2": "橋に付けた加速度計による振動モニタリングは一般的だが、健全時と損傷時の両方の実測がそろう実橋の事例がほとんどなく、実規模での検証が難しい。性能は外れ値やノイズにも左右される（抄録）。", "p3": "周波数領域の特徴を入力とし、車両の通過を群にまとめてから学習に使う「モード中心」の入力で、FFTの偽のピークや運用条件のばらつきを抑える（抄録）。オートエンコーダ（AE: autoencoder、入力を圧縮して復元するニューラルネット）を健全時のデータだけで学習し、復元のずれで損傷を判定する。直観：健全時の安定した表現を学べば、損傷で固有振動数が変わった入力はうまく復元できなくなる。", "p4": "供用を終えた実物大の橋に段階的に損傷を与えた実験データを使う（抄録）。指標はAUC（ROC曲線の下の面積。1に近いほど健全と損傷を見分けられる）で、同じデータ分割で8つの参照手法と比べた（抄録）。", "p5": "3つの損傷状態をまとめたAUCは0.957、最も重い損傷では0.979だった（抄録）。汎用の新規性検出手法や広帯域の入力を使うAEを上回り、符号付きのモード振動数の変化に閾値を置く直接的な方法とは同程度だった（抄録）。", "p6": "検証は1橋の実験で、温度などの季節変動をどこまで含むかは抄録から分からない。解釈：振動数変化の単純な閾値と同程度という結果は、この手法の利点が主に前処理（通過の群化）にある可能性を示す。", "unverified": "本文を取得できず、橋の諸元、損傷の与え方、データの期間、比較した8手法の内訳は未確認。"}}, {"rank": 7, "theme": "包摂的コミュニティ・社会", "headline": "「社会的つながり」の次元構造（英国4.1万人）", "title": "The Multidimensional Structure of Social Connectedness and Its Associations with Wellbeing and Quality of Life", "url": "https://doi.org/10.21203/rs.3.rs-10420555/v1", "authors": "Smyth C ほか", "venue": "Research Square", "date": "2026-09-23", "id": "r07", "explain": {"basis": "本文", "basis_note": "Research Square版の本文（対象・方法・因子モデルの比較・関連の分析・限界の節）を読んだ。表の全数値は照合していない", "preprint": true, "p1": "関係の質・家族の支え・信頼・近隣の結束・孤独という別々に研究されてきた指標を、英国の41,242人のパネル調査で「関係的つながり」「地域のつながり」「主観的な断絶」の3因子と、その上にある「社会的つながり」の因子として一つの構造にまとめ、心の健康との関連を示した（Abstract、Results）。", "p2": "社会的つながり（social connectedness）は、関係の質、家族の支え、信頼、近隣の結束、孤独として分野ごとに別々に測られてきた。これらが別の現象なのか、一つの構成概念の表れなのかがはっきりしない（Abstract、The Present Study）。", "p3": "英国家計パネル調査（Understanding Society）の3つの波から指標を作り、1〜4因子の確認的因子分析（CFA: 仮定した因子構造がデータに合うかを確かめる方法）を比べる。選んだモデルで、構造方程式モデリング（SEM）により心理的苦痛・生活満足度・精神的well-being・健康関連QOLとの関連を推定した（Participants、Analyses）。欠測は完全情報最尤法（FIML）で扱う。", "p4": "適合の目安は、CFIとTLIが.95を超え、RMSEAが.06未満、SRMRが.08未満（Analyses）。適合の良さと理論的な解釈のしやすさの両方で因子モデルを選び、上位因子モデルと、下位因子どうしが相関するモデルで関連を比べた（Analyses）。", "p5": "1因子モデルは適合が不十分（CFI .955、RMSEA .062）で、3因子モデルが最も良かった（CFI .975、TLI .962、RMSEA .050）（Competing factor models）。上位の「社会的つながり」因子は、心理的苦痛（β −.773）、生活満足度（β .749）、精神面のQOL（β .796）などと強く関連し、説明率は56.1〜63.4%だったが、身体面のQOLとの関連は弱かった（説明率3.1%）（Higher-Order Model）。下位の因子では、主観的な断絶が心理的苦痛と、地域のつながりが生活満足度と最も強く関連した（Correlated-Factors Model）。", "p6": "複数の波を平均した人単位の指標を使う実質的な横断分析で、因果は言えない。指標はすべて自己報告で、家族の支えは若い一部の回答者にしか聞かれていない。友人関係やネットワーク構造などは含まれない（Limitations）。解釈：心の状態の指標どうしを自己報告で測るため、説明率の高さには共通方法のバイアスも含まれうる（著者も言及）。", "unverified": "表1〜4の全数値と補足資料（変数の対応表）は照合していない。"}}, {"rank": 8, "theme": "会計情報科学", "headline": "財務諸表を丸ごと長期予測する「Forma」", "title": "Long-Horizon Forecasting of Complete Financial Statements with Forma", "url": "https://econpapers.repec.org/RePEc:arx:papers:2608.11327", "authors": "Travis L. Johnson ほか", "venue": "arXiv（RePEc NEP 計算経済）", "date": "2026-08", "id": "r08", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（課題設定・手法・結果・結論の節と表2・表3）を読んだ。付録は目次のみ", "preprint": true, "p1": "財務諸表の78科目を1〜20四半期先まで同時に予測するベンチマーク（ProForma-20Q）を公開し、諸表を（科目、四半期、値）の組の集合として読む小型のTransformer「Forma」が、機械学習・既存手法・時系列基盤モデル・最先端のLLMを上回ることを示した（Abstract、§5.2）。", "p2": "割引キャッシュフロー（DCF）法の企業評価では価値の大半が1年より先にあるのに、財務諸表全体を1年を超えて同時に予測した研究はない（Abstract）。表形式のモデルは欠損値の補完が必要で、科目間の会計恒等式も守られない（§4、§5.3）。", "p3": "入力は過去12四半期に報告された（四半期、科目、値）の組と業種で、報告されていない科目はトークンにしないため欠損の補完が要らない（§3.1、§4）。予測したい未来の（四半期、科目）を値を隠したトークンとして入れ、Transformer（約0.9Mパラメータ）が各値の正規分布（平均と分散）を出す（§4、式4）。恒等式で結ばれた科目はまとめて隠して学習させ、未来の値の一部を見せる学習も混ぜるので、売上の筋書きを与えた条件付きの予測もできる（§4）。", "p4": "米国企業の四半期決算（Compustat、金融業を除く32,851社）を時期で分け、1971–2001年で学習、2002–2009年で検証、2010–2024年でテストした（§3.2）。主な指標は変化量の決定係数R²（標本平均的な変化を仮定する場合よりどれだけ説明できるか。多年先で20〜40%なら強い）で、MAEと予測分布の較正も見る（§3.3）。比較相手はランダムフォレスト、弾性ネット、FFNN、連鎖型GBM、Chronos-2、LLM 3種（§5.1）。", "p5": "全体のR²はFormaが28.9%で、ランダムフォレスト27.2%、弾性ネット25.8%を上回った（§5.2、表2）。1四半期先ではランダムフォレストがわずかに上（39.8%対39.0%）だが、3四半期先からはFormaが上回り、20四半期先では0.225対0.193だった（§5.2、図1）。LLMとの比較用の標本ではFormaが29.9%、最良のLLMが18.6%で、差は1四半期先の5.5ポイントから20四半期先の15.9ポイントに広がった（§5.2）。実際の売上の推移を与えるとR²は30.5%から34.8%に上がった（§5.4）。", "p6": "長期の評価は存続した企業だけにもとづく。対象は米国の四半期決算、78科目、1〜20四半期先に限られ、株価やアナリスト予想は使っておらず、LLMは微調整していない既製品だけを比べた（§6）。背景：LLMはテスト期間の決算を事前学習で見ている可能性があり、著者はそれでもLLMに有利な比較だとしている（§5.2）。", "unverified": "付録（科目一覧、会計恒等式、学習の設定）と、表2の全セルは照合していない。"}}, {"rank": 9, "theme": "会計情報科学", "headline": "仕訳テストと機械学習で元帳の異常を検知", "title": "Anomaly Detection in General Ledger Data: Results from a Hybrid Approach", "url": "https://doi.org/10.48550/arxiv.2609.18228", "authors": "Jan Gronewald ほか", "venue": "arXiv", "date": "2026-09-16", "id": "r09", "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（データ生成・手法・結果・考察・限界の節）を読んだ。表3の数値は本文で言及された値のみ照合", "preprint": true, "p1": "監査の仕訳テスト（JET）と教師なしの機械学習を組み合わせると、仕訳テストが出す大量の誤検知を減らしながら異常を拾えることを、合成した仕訳データで示した研究途上の論文（Abstract、Results）。", "p2": "仕訳テスト（JET: journal entry test、高額仕訳や時間外の計上など既知のパターンで仕訳を抜き出す監査手続）は年次監査で必須だが、結果のリストが大きく、監査人の確認の負担が重い（Abstract、Introduction）。", "p3": "4つのJET（上位n件の高額仕訳、現金勘定からの高額の支払い、計上の遅れ、時間外・週末の計上）と、3つの教師なしモデル（深層オートエンコーダ、Isolation Forest、HDBSCAN）を用意する（Anomaly detection pipeline）。H1は両者の結果リストの共通部分だけを見る方式、H2はJETの判定結果を特徴量として学習に加える方式（Hybrid Approaches）。", "p4": "実データがないため、ドイツのDATEVの勘定科目表に沿って1年分の仕訳を合成し（取引51,076件、127,835行）、JETの結果リストの中に573件の異常を埋め込んだ（Generation of synthetic data）。指標は適合率・再現率・F1・ROC-AUCのマクロ平均（Evaluation metrics）。", "p5": "JETだけでは573件すべてを拾うが、誤検知が10,019件出た（Results）。Isolation Forest単独は554件を検出し、19件を見逃した（Results）。H2のIsolation Forestは573件すべてを検出しながら誤検知を1,881件まで減らした（H1より誤検知は667件多い）（Discussion）。HDBSCANは51〜53%程度にとどまった（Results）。", "p6": "異常をJETの結果リストの中にだけ埋め込んだので、JETが全件を拾うのは設計上当然で、合成データは単純な仮定にもとづく（Results、Limitations）。モデルは既定の設定のままで、実データでの有効性は分からない（Limitations）。解釈：異常の作り方がJETの規則と同じ発想なので、JETの結果を特徴量にするH2の改善は、評価の設計に有利に働いている可能性がある。", "unverified": "表3（混同行列と各指標）の全数値は照合していない。"}}, {"rank": 10, "theme": "LLM熟議・ペルソナ", "headline": "LLMの合成回答者を実際の調査と照合", "title": "Synthetic Respondents in Survey Research: An Empirical Test Against a Student Survey", "url": "https://doi.org/10.5281/zenodo.22939960", "authors": "Inna Gazieva", "venue": "Zenodo", "date": "2026-09-24", "id": "r10", "explain": {"basis": "本文", "basis_note": "Zenodoにある著者の英語版（本文全体。図表なし）を読んだ。正本はロシア語版", "preprint": true, "p1": "LLMの「デジタルツイン」回答者は、回答分布の向きはおおむね再現するが、回答のばらつき・項目間の関連・個人差を失うことを、全員の回答が分かっている学生調査との照合で示した（Results）。", "p2": "合成回答者（silicon sample）の妥当性は、他人のデータや抽象的な例で論じられることが多く、どの指標なら信頼でき、どこで歪むのかが分からない（Introduction）。既存の検証は外国の全国調査が中心で、双子と特定の個人を比べた定量的な検証が乏しい（Literature review）。", "p3": "実在の回答者1人分の行から5つの属性（性別、学年、キャンパス、専攻分野、民族）をまとめて借りてペルソナを作り、DeepSeek（v4-flash、推論モードなし、温度0.8）に質問を1ブロックずつ、前の回答を知らない状態で答えさせる（Data and method）。行ごと借りるのは、属性の組み合わせとして「ありえない」回答者を作らないため。", "p4": "基準は著者自身のRANEPA学生調査（2024年、N = 1,795、39項目のうち36項目を比較）で、64,620回の独立した呼び出しの結果と比べた（Data and method）。比べたのは、個人ごとの一致、回答のばらつき（項目ごとの標準偏差、極端な選択肢と「わからない」の割合）、属性による差の向きと項目間の相関、自分の双子と無作為な双子の一致の差（Data and method）。", "p5": "完全一致は37.8%、1段階以内の一致は79.1%（Results）。標準偏差は双子0.52対人間1.04、極端な選択肢は36%対50%で、人間が13〜19%選ぶ「わからない」を双子はほぼ選ばない（Results）。性差の向きは85%の項目で一致したが、異なるブロック間の平均絶対相関は0.10対0.27に弱まり、自分の双子との一致37.9%は無作為な双子の36.5%とほぼ同じだった（Results）。", "p6": "モデル1つ、質問票1つ、1大学の学生だけの検証で、温度0.8は設計上の選択、各双子には1回しか聞いておらず、属性も5つだけ（Limitations）。ChatGPTで文章を生成する割合（人間27.5%、双子96.8%）の差を社会的望ましさの検出に使う案は、1問だけの観察にもとづく未検証の仮説だと著者自身が述べている（Discussion）。", "unverified": "図表がないため、数値は本文の記述と照合した。一次データは非公開で、再計算はできない。"}}, {"rank": 11, "theme": "LLM熟議・ペルソナ", "headline": "行動研究の参加者はAIで置き換えられない", "title": "AI cannot replace human participants in behavioral research", "url": "https://doi.org/10.1073/pnas.2611363123", "authors": "Jim Hoover ほか", "venue": "PNAS", "date": "2026-09-23", "id": "r11", "explain": {"basis": "題名", "basis_note": "出版社サイトが自動取得を拒否し、抄録もCrossref・PubMedに未登録だった", "preprint": false, "p1": "題名から読める範囲では、行動研究において人間の参加者をAI（LLMによる模擬参加者など）で置き換えることはできない、と主張する論文。", "p2": "未確認（抄録・本文を入手できず）", "p3": "未確認（抄録・本文を入手できず）", "p4": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "p6": "未確認（抄録・本文を入手できず）", "unverified": "題名以外のすべて（論文の種類が実証研究か論考かを含む）。"}}, {"rank": 12, "theme": "LLM熟議・ペルソナ", "headline": "AIが司会するインタビューとデジタルツイン", "title": "AI-Moderated Interviews for Market Research and Digital Twins Calibration", "url": "https://arxiv.org/abs/2609.29143", "authors": "Yuting Deng ほか", "venue": "arXiv", "date": "2026-09-25", "id": "r12", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（方法・結果・考察の節）を読んだ。付録と表の全数値は照合していない", "preprint": true, "p1": "AIが司会するインタビューは、人間の司会と同程度の深さで話を引き出し、同じ予算ならより多くの顧客ニーズを集められる一方、その豊かさはデジタルツインの予測精度の上積みにはつながらないことを、事前登録した実験で示した（Abstract、§3.2、§4.1）。", "p2": "AI司会のインタビューは、市場調査とデジタルツイン（個人の回答を模倣するLLM）作りに広まりつつあるが、人間の司会に匹敵するのか、固定質問のインタビューより良いのかが分かっていない（Abstract）。", "p3": "住宅リフォームの意思決定者を、AI司会（GPT-5.1が追加質問を考え、音声でやり取り）、専門家による人間の司会、固定質問の3条件に割り付けた（§2.1）。各参加者のツインは、Gemini（gemini-3.1-flash-lite-preview）に属性だけ（Demo）か、属性とインタビュー全文など（Full）を与えて作り、本人が別に答えた6つの広告刺激（DM・CM動画・訴求文の順位づけ）への反応を予測させた（§2.5、§2.6）。", "p4": "事前登録した被験者間実験（N = 317：AI 139、固定 154、人間 24）（§2.1）。インタビューは発話量、テーマの幅と深さ、音声の感情指標、回収できた顧客ニーズの数で比べ、同じ市場コスト（約5千ドル）で条件をそろえた（§2.1、§3）。ツインは評定の正答率、Kendallのτ（順位の一致度）、自由記述のコサイン類似度で評価した（§2.6）。", "p5": "AI司会は固定質問より長く話させ（8.1分対4.3分）、件数をそろえた比較では人間の司会とほぼ同じ数のニーズを回収し（111.5対109.0）、同じ予算では238件と最も多かった（固定188、人間109）（§3.1.1、§3.2.1）。ただし人間が相手のほうが、声の快・覚醒・支配の指標がいずれも高かった（§3.1.3）。ツインはインタビューを加えると属性だけより良くなったが、AI司会の豊かさは固定質問に対して予測の上積みにならなかった（Abstract、§4.1）。", "p6": "対象は窓・ドアの交換という関与の高い1カテゴリだけで、特定のAI司会サービスとモデルの一時点の評価にとどまる（§5）。人間の司会は予定の30件に対して24件しか実施できなかった（§2.1）。解釈：著者の分析では、ツインの誤差は情報不足だけでなく、人間の直観的な反応をツインが分析的な理由づけで置き換えることにも関係しており（§4.2、§5）、文章データを増やすだけでは限界がある。", "unverified": "表4.1などの予測精度の全数値と、付録（プロンプト、頑健性の確認）は照合していない。"}}, {"rank": 13, "theme": "サービス・マーケティング", "headline": "遅延便の回復失敗が生む感情と口コミ", "title": "Anatomy of a Desperate Wait: Passengers' Emotions and Behavioral Reactions to the Service Recovery Deficiency for Delayed Flights by Airlines", "url": "https://doi.org/10.26650/jtl.2026.1820008", "authors": "Sadiye Oya Işıkcı", "venue": "Journal of Transportation and Logistics", "date": "2026-09-23", "id": "r13", "explain": {"basis": "抄録", "basis_note": "出版社サイトから本文を抽出できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "航空便の遅延後にサービス回復が不十分だと、怒り・不安・フラストレーションがいずれも高まるが、行動への影響は感情ごとに違い、不安だけが苦情・否定的な口コミ・乗り換え意図のすべてを予測することを、トルコの乗客418人の調査で示した（抄録）。", "p2": "サービス回復の研究は否定的な感情をひとまとめに扱うことが多く、回復が不十分なときに個別の感情（discrete emotions）がその後の行動をどう分けるかは分かっていない（抄録）。", "p3": "刺激-生体-反応（S-O-R: Stimulus-Organism-Response）の枠組みで、不十分なサービス回復（刺激）が怒り・不安・フラストレーション（内的な状態）を通じて苦情・否定的な口コミ・乗り換え意図（反応）につながるモデルを立て、構造方程式モデリングで検証した（抄録）。", "p4": "遅延を経験したトルコ在住の18歳以上の乗客418人に行った相関的な調査のデータを使う（抄録）。モデルの適合度や効果の大きさの基準は抄録に記載がない。", "p5": "不十分な回復は3つの否定的な感情をすべて有意に高めた（抄録）。一方、怒りは行動に有意な影響がなく、フラストレーションは否定的な口コミを、不安は苦情・否定的な口コミ・乗り換え意図のすべてを有意に予測した（抄録）。", "p6": "抄録の範囲では、回復の不十分さの測り方、係数の大きさ、横断調査による因果の向きの限界は分からない。解釈：遅延の経験を思い出して答える自己報告なので、感情と行動意図の関連には共通方法のバイアスが入りうる。", "unverified": "本文を取得できず、尺度の項目、適合度、各経路の係数は未確認。"}}, {"rank": 14, "theme": "会計情報科学", "headline": "会計制約＋LLM＋グラフNNで異常仕訳を検出", "title": "Constraint-Guided LLM-GNN Framework for Anomalous Journal Entry Detection in Auditing", "url": "https://doi.org/10.20944/preprints202609.2005.v1", "authors": "Jiaming Chen ほか", "venue": "Preprints.org", "date": "2026-09-23", "id": "r14", "explain": {"basis": "抄録", "basis_note": "Preprints.orgの本文は自動取得できず、Europe PMCに登録された抄録を使用", "preprint": true, "p1": "仕訳どうしの関係を表すグラフ、会計の規則、LLMによる説明の3つを組み合わせた異常仕訳の検出の枠組み（CG-LGN）を提案し、合成データで単一のモジュールより高い検出性能と誤検知の削減を示した（抄録）。", "p2": "規則ベースの仕訳テスト（JET）は誤検知が多く、複雑な異常を捉えにくい。LLMだけの手法は、会計上の制約や仕訳間の構造的な関係を明示的に扱わない（抄録）。", "p3": "①仕訳・勘定科目・起票者・時間の属性の関係を異種グラフニューラルネットワーク（GNN）で表すモジュール、②貸借の一致、珍しい勘定の組み合わせ、期末への集中といった会計の規則を組み込む制約モジュール、③検出した仕訳について監査人が読める解釈を書くLLMモジュール、の3つからなる（抄録）。", "p4": "6種類の異常を注入した合成の仕訳データで、最も強い単一モジュールのベースラインと比べた（抄録）。指標はPR-AUC（適合率-再現率曲線の下の面積。異常がまれなデータで使われる）と、1,000件あたりの誤検知数（抄録）。", "p5": "PR-AUCは0.49で、最も強い単一モジュールより0.20高く、1,000件あたりの誤検知を47%減らした（抄録）。アブレーション（部品を外す実験）では、GNNと制約モジュールが検出性能を、LLMモジュールが説明の質を高めた（抄録）。", "p6": "検証は合成データだけで、注入した6種類以外の異常や実データでの性能は抄録からは分からない。解釈：PR-AUC 0.49は改善後でも中程度の値で、実際の監査で確認作業がどこまで減るかは別に確かめる必要がある。", "unverified": "本文を取得できず、比較したベースラインの内訳、データの規模、説明の質の評価方法は未確認。"}}, {"rank": 15, "theme": "サービス・マーケティング", "headline": "AI使用の開示が生む非対称な印象", "title": "The Asymmetric Effect of AI-Mediated Communication: AI Disclosure Weakens Positive, But Not Negative, Social Inferences", "url": "https://doi.org/10.2139/ssrn.7501238", "authors": "Hyeran Kang ほか", "venue": "SSRN", "date": "2026-09-25", "id": "r15", "explain": {"basis": "抄録", "basis_note": "SSRNは自動取得を拒否したため、Crossrefに登録された抄録を使用", "preprint": true, "p1": "文章にAIを使ったと明かすと、感謝や親しみといった好意的なメッセージから相手の本心を読み取る度合いは大きく下がるが、批判や敵意といった否定的なメッセージではほとんど下がらない、という非対称性を事前登録した2つの実験で示した（抄録）。", "p2": "AIを介したコミュニケーション（AI-MC: AI-mediated communication）でAIの使用を明かすと、受け手の社会的な推論が弱まることは知られていたが、研究は謝罪や感謝など好ましいメッセージに偏っており、否定的なメッセージでも同じかは分かっていない（抄録）。", "p3": "人が書いた、またはAIが生成したとラベルを付けた好意的・否定的な対人メッセージを読ませ、送り手の本当の考えや感情をどれだけ示しているか（診断性）と、送り手の感情についての推論を測る（抄録）。調整媒介分析で、推論が診断性の知覚にどれだけ依存するかを調べた（抄録）。", "p4": "米国の参加者計1,022人による2つの事前登録実験（抄録）。研究2では、事前テストしたより大きな刺激セットで研究1の結果を追試した（抄録）。", "p5": "AIと表示されたメッセージは送り手の本心を示す度合いが低く見られたが、その低下は好意的なメッセージのほうがずっと大きかった（研究1、抄録）。研究2でも、感謝・満足・友好の推論は強く下がり、失望・不満・敵意の推論は下がらなかった（抄録）。好意的な推論のほうが、メッセージの診断性に強く依存していた（抄録）。", "p6": "抄録の範囲では、効果の大きさ、刺激の種類、米国以外での一般化は分からない。解釈：AI使用の開示は信号を一様に薄めるという単純な説明を否定する結果で、関係づくりのメッセージほど開示の影響を受けやすいことを示す。", "unverified": "本文を取得できず、効果量と各研究の人数の内訳は未確認。"}}, {"rank": 16, "theme": "都市・インフラ政策", "headline": "有料道路の価値獲得モデル（インドネシア）", "title": "Developing a Toll Master Developer Model for Financially Sustainable Assigned Toll Roads: Integrating Value Capture and Corridor Development in Indonesia", "url": "https://doi.org/10.12688/f1000research.182913.1", "authors": "Muhammad Rozi Rinjayadi ほか", "venue": "F1000Research", "date": "2026-09-25", "id": "r16", "explain": {"basis": "本文", "basis_note": "F1000Researchの本文（方法・結果・考察・結論の節と表1〜4）を読んだ。第1版で、公開査読はまだ行われていない", "preprint": true, "p1": "インドネシアの政府指定の有料道路が抱える財政難に対して、道路会社が沿線開発と開発利益の還元（value capture）まで担う「有料道路マスターデベロッパー（TMD）」という制度・事業モデルを、70人の調査とソフトシステム方法論で組み立てた（Abstract、Results）。", "p2": "政府から割り当てられた有料道路事業は、財政余力の低下、政府支援への依存、地価上昇を収益にできていないこと、沿線のガバナンスの分断から、財務的に持続しにくい。既存の事業モデルは料金収入に頼り、沿線の価値創出を取り込めていない（Abstract、Introduction）。", "p3": "2段階の混合研究法。第1段階では、政府・有料道路会社・学術・民間の70人に戦略要因の重要性を7段階で尋ね、部分最小二乗法による構造方程式モデリング（PLS-SEM）で、開発会社の戦略的な能力・空間的な統合・投資環境・価値還元の実施の4要因がTMDの有効性に与える影響を推定した（Methods）。第2段階では、ソフトシステム方法論（SSM: 関係者の見方を図解して定義し、概念モデルを作る方法）で制度と事業の構成をまとめた（Methods）。", "p4": "測定モデルは外部負荷量、クロンバックのα、合成信頼性、AVE（0.50を超えるか）で、構造モデルは経路係数、t値、R²、効果量f²で評価した（Results）。概念モデルは専門家との議論で検証した（Methods）。", "p5": "4要因はすべて有意で、経路係数は戦略的な能力0.71、空間的な統合0.50、投資環境0.40、価値還元の実施0.31、R²は0.69だった（表2・表3）。効果量は戦略的な能力が大（f² = 0.42）、価値還元の実施は小（f² = 0.09）で、著者は、成否は資金調達の手段より制度的な能力と沿線の統合で決まると解釈している（Results、Discussion）。", "p6": "回答者は70人と少なく、インドネシアの指定有料道路に固有の文脈で、SSMの部分は専門家の判断に依存し、モデルは事業ごとの財務シミュレーションで確かめられていない（Discussion）。解釈：推定しているのは重要性についての主観的な評価どうしの関連で、TMDが実際に財務を改善する証拠ではない。本文では表の番号や変数記号（X3・X4）の対応に食い違いも見られる。", "unverified": "式(1)の中身（取得したテキストでは式が欠落）と、補足資料の構成概念の定義は未確認。"}}, {"rank": 17, "theme": "VBI・橋梁SHM", "headline": "ウェーブレットで路面粗さを区間ごとに分類", "title": "A Localized Road Roughness Classification Algorithm Based on ISO 8608 using Continuous Wavelet Transform", "url": "https://doi.org/10.1109/access.2026.3734725", "authors": "Samuel Jung ほか", "venue": "IEEE Access", "date": "2026-09-24", "id": "r17", "explain": {"basis": "本文", "basis_note": "IEEE Access掲載の著者版PDF（理論・数値検証・実測事例・考察の節と表3〜5）を読んだ", "preprint": false, "p1": "路面の縦断プロファイルに連続ウェーブレット変換（CWT: continuous wavelet transform）をかけて位置ごとのパワースペクトル密度（PSD）を求め、ISO 8608の路面等級を区間全体ではなく位置ごとに付ける方法を示した（Abstract、§II）。", "p2": "ISO 8608はフーリエ変換で区間全体のPSDを求めて等級を決めるため、場所によって変わる粗さや、段差・ポットホールのような局所的な凹凸が、区間全体で平均されて見えなくなる（Abstract、§I）。", "p3": "入力は1次元の路面高さの測定値、出力は位置ごとの連続等級指数Icと離散等級Id（§II）。解析的Morletウェーブレットの連続ウェーブレット変換から局所的なPSDを求め、対数領域での積分平均で位置ごとの粗さ度を出して等級に写像する（§II-B・C）。CWTを選ぶ理由は、高い空間周波数では細い窓で段差の位置を、低い空間周波数では広い窓で長い波長のうねりをとらえられ、入力の小さなずれにも結果が安定するため（§II-A）。", "p4": "①等級C・D・Eの標準ランダム路面を100 mずつつないだ300 mの合成路面、②高さ0.05・0.1・0.15 mの段差を順に置いた400 mの路面、③LTPP（米国の長期舗装性能プログラム）の実測プロファイルの3事例で、従来の全体評価と比べた（§IV）。良さの基準は、設定した等級の切り替わりや、段差・ポットホールの位置と重さを再現できるか。", "p5": "合成路面では、全体評価が区間全体を等級Eとしたのに対し、提案法は100 mと200 mの境界で等級C→D→Eの切り替わりをとらえ、各等級の距離の割合は34.5%、31.1%、32.8%（残る1.6%は等級F）だった（§IV-A、表3、図4・図6）。段差の路面では全体評価が等級C（Ic = 3.277）なのに対し、0.15 mの段差の位置で最大値Ic = 5.982（等級F相当）を示した（表4）。実測路面では全体評価が等級Aだったが、190 m付近のポットホールを等級D（Ic = 4.434）として検出した（§IV-C、表5）。", "p6": "段差のような一回きりの事象に統計的な規格であるISO 8608を当てはめるのは規格の概念的な拡張で、結果は「局所的な等価の重大度」として読むべきだと著者は述べる（§IV-B、§V-A）。等級の境目では離散等級が細かく行き来し、等級は幾何学的な指標なので車体の加速度などの応答とは比例しない（§V-A）。解釈：実測での検証は1本の標本プロファイルだけで、車両の応答から推定した路面プロファイルに使うときの誤差の影響は扱っていない。", "unverified": "図の中の値（スカログラムの分布など）と、§IIの式の細部は照合していない。"}}, {"rank": 18, "theme": "VBI・橋梁SHM", "headline": "欠けた構造応答をTransformerで復元", "title": "Time-frequency gated transformer for structural dynamic response reconstruction", "url": "https://doi.org/10.1038/s44172-026-00788-0", "authors": "Xueli Song ほか", "venue": "Communications Engineering", "date": "2026-09-22", "id": "r18", "explain": {"basis": "本文", "basis_note": "Communications Engineeringの掲載前版PDF（結果・考察・手法の節と表1・表2）を読んだ。補足資料は読んでいない", "preprint": false, "p1": "欠けたセンサの加速度応答を、時間領域と周波数領域の両方の特徴を使うTransformer（TFGFormer）で復元し、広州塔とHardanger橋の実測データで既存の手法より小さい誤差を示した（Abstract、Results）。", "p2": "構造ヘルスモニタリング（SHM）では欠測がデータの信頼性を損なう（わずかな欠測が大きなノイズと同じくらい下流の解析を悪化させるという先行研究もある）。既存の深層学習による復元は時間領域の特徴だけを使い、構造の動特性を直接表す周波数領域の特徴を無視している（Abstract、Introduction）。", "p3": "入力は一部が欠けた多チャンネルの加速度（広州塔20チャンネル、Hardanger橋16チャンネル、1区間1,024点）、出力は欠けた部分を埋めた応答（Methods）。時間領域では多重スケールの拡張Transformerで遠い時刻どうしの関係を、密結合ブロックで局所的な特徴をとらえ、周波数領域ではFFT上の複素数の重みを学習するモジュールでスペクトルの特徴を取り出し、ゲートで両者の寄与を調整して融合する（Abstract、Methods）。損失は時間と周波数の両方の残差を罰する。直観：固有振動数の成分をスペクトル上で直接合わせるので、ピークの減衰や高次モードのエネルギーの抜けを抑えられる。", "p4": "広州塔（超高層）とHardanger橋（長大吊橋）の実測加速度で、欠損率30〜70%（橋は25〜75%）の条件を作り、CNN系（DenseNet、DFCN）、Transformer系（SwinIR、DilateFormer）、両者の混合（PMTC）と比べた（Results）。各モデルを5回学習し、平均絶対誤差（MAE）などの平均と標準偏差で評価した（Results）。", "p5": "広州塔では欠損率30〜70%のすべてで最も誤差が小さく、欠損率30%でMAEは0.97 × 10^-3、CNN系は欠損率70%でMAEが3.00 × 10^-3を超えた（Results、表1）。Hardanger橋では欠損率75%の相対誤差がCNN系の0.098に対して0.060で、欠損率25%ではMAEが0.10 × 10^-3だった（Results、表2）。", "p6": "学習には完全に計測された過去の応答が教師データとして必要で、完全な基準データのない構造物には使いにくい（Discussion）。ノイズへの強さは人工的なガウスノイズでしか試しておらず、実運用の条件や機器上の推論時間・消費電力は未評価（Discussion）。解釈：欠測は人工的に作ったもので、センサ故障のような長い連続した欠測や、損傷後の応答でも同じ精度が出るかは別に確かめる必要がある。", "unverified": "補足資料（データの詳細、評価式、ノイズの設定）と、表1・表2の全セルは照合していない。"}}, {"rank": 19, "theme": "会計情報科学", "headline": "年次報告書の記述を2言語モデルで測る", "title": "A bilingual fine-tuned language model for measuring digital technology integration in Arabic and English annual report narrative", "url": "https://doi.org/10.2139/ssrn.7517639", "authors": "Ahmad Alomari ほか", "venue": "SSRN", "date": "2026-09-24", "id": "r19", "explain": {"basis": "抄録", "basis_note": "SSRNは自動取得を拒否したため、Crossrefに登録された抄録を使用", "preprint": true, "p1": "年次報告書の文を、アラビア語と英語のまま、6種類のデジタル技術について「実際に使っているのか、言及しているだけか」まで判定する道具を作り、キーワードを数える方法より高い精度を示した（抄録）。", "p2": "企業のデジタル技術の導入度は年次報告書のキーワード数で測られることが多いが、使っている企業と話しているだけの企業を区別できず、2言語で提出される報告書ではうまく働かない（抄録）。", "p3": "2言語の辞書で候補の文を絞り、微調整したXLM-RoBERTa（多言語の文章分類モデル）で「報告企業自身が技術を使っている文か」を判定し、「企業が文法上の主語で、決められたリストの動詞が技術用語に作用している」という監査可能な2条件の規則で関与の段階（commitment tier）を決める（抄録）。対象はAI・機械学習、ビッグデータ、クラウド、ERP、会計・報告の自動化、XBRLの6技術。", "p4": "アンマン証券取引所の上場企業のアラビア語・英語のXBRL提出書類から、手作業でコード化した1,880文で道具を作った（抄録）。企業単位で分けた5分割の交差検証で、学習に使っていない企業に対するF1を、辞書だけの方法と比べた（抄録）。", "p5": "F1は英語で0.857、アラビア語で0.833で、辞書だけの方法（0.734、0.712）を上回り、同じコードブックを与えたゼロショットのLLMも上回った（抄録）。326組の報告書に当てはめると、技術についての記述はまれで、一部の企業に集中し、2つの言語版の間で一貫していた（抄録）。", "p6": "抄録の範囲では、ヨルダンの1市場の報告書で作られた道具で、他の言語や市場への転用性は分からない。解釈：「言及」と「利用」の区別は文の文法構造にもとづく規則で決まるため、婉曲な表現や将来計画の記述をどう扱うかは本文で確かめる必要がある。", "unverified": "本文を取得できず、関与の段階の定義、LLMとの比較の数値、誤分類の傾向は未確認。"}}, {"rank": 20, "theme": "職場AI・組織行動", "headline": "職場の感情マインドセットとJD-Rモデル", "title": "Emotion Mindsets at Work: Emotion Malleability Beliefs, Emotion Regulation, and Employee Well-Being in Two National Studies", "url": "https://doi.org/10.31234/osf.io/pgswc_v1", "authors": "Peihao Luo ほか", "venue": "PsyArXiv", "date": "2026-09-25", "id": "r20", "explain": {"basis": "本文", "basis_note": "PsyArXivのPDF本文（2研究の方法・結果・考察と限界の節）を読んだ。補足資料の表は読んでいない", "preprint": true, "p1": "「感情は変えられる」と考える信念（感情のマインドセット）が、仕事の要求度-資源（JD-R）モデルでいう個人の資源として働き、感情調整のしかたを通じて教職員のwell-beingと結びつくことを、米国の2つの全国調査（計3,282人）で示した（Abstract）。", "p2": "感情についての信念は臨床心理学や社会心理学では研究されてきたが、感情労働やバーンアウトへの関心が高い職場の心理学ではあまり調べられていない（Abstract）。", "p3": "研究1は2時点の縦断調査で、1時点目の感情マインドセット（ITES: 感情の可変性についての暗黙の理論の尺度）から、2時点目の感情調整の方略（再評価・反すう・回避）とwell-being（情緒的消耗、共感疲労、仕事満足度、離職意図）を、1時点目のwell-beingを統制した構造方程式モデリング（SEM）で予測した（Study 1）。研究2は横断調査で、ベイズSEMで関連を追試し、感情調整の能力テストの成績による違い（調整効果）も調べた（Study 2）。", "p4": "対象は米国の幼稚園から高校（preK-12）の教職員で、研究1は1時点目1,972人・2時点目1,237人（2020年の6月と8月）、研究2は1,310人（黒人とヒスパニック系を多めに集めた）（Method）。4つの仮説（総合効果、方略への効果、方略を介した間接効果、能力による調整）を標準化係数と95%信用区間・信頼区間で検討した。", "p5": "研究1では、変えられると考える人ほど2か月後の情緒的消耗が低く（β = −.11）、共感疲労が低く（β = −.16）、仕事満足度が高かった（β = .08）が、離職意図は有意でなかった（Results）。反すうの少なさ（β = −.39）と回避の少なさ（β = −.50）との関連は大きく、12の間接効果のうち9つが予想どおり有意だった（Results）。研究2では総合効果がより大きく（情緒的消耗 β = −.44、離職意図 β = −.41）、反すうを介した間接効果は4つのwell-being指標すべてで有意だった（Results）。", "p6": "研究1でも媒介変数と結果は同時点で測られ、研究2は横断調査なので、因果の向きは確定できない。尺度の多くは短縮版で、能力テスト以外は自己報告のため、共通方法による関連の水増しがありうる。対象は米国の教育分野だけ（Limitations）。解釈：信念の尺度が感情調整の自己効力感も測っている可能性を著者自身が指摘しており、「信念」の効果として読むには注意が要る。", "unverified": "補足資料の表（因子負荷量、係数の全一覧）は照合していない。"}}], "notable": [{"field": "物理", "headline": "ルテチウム光時計、確度は19桁目まで", "title": "Lu+ optical frequency references with accuracy verified at the 19th digit", "url": "https://doi.org/10.1038/s41586-026-11072-8", "authors": "K. J. Arnold ほか", "venue": "Nature", "date": "2026-09-23", "why": "秒の定義の見直しに向けて、評価した不確かさを同じ種類の時計どうしの比較で実験的に確かめた数少ない例で、精密計測の基準を押し上げる。", "id": "n01", "explain": {"basis": "本文", "basis_note": "Natureのオープンアクセス版PDF（本文、表1、Methodsの一部）を読んだ", "preprint": false, "p1": "独立に作った2台のルテチウムイオン（176Lu+）光時計の、ずれの要因をすべて評価して、それぞれの系統的な不確かさを約1 × 10^-19まで下げ、2台を直接比べて5.7 × 10^-19の水準で一致することを確かめた（Abstract、本文）。", "p2": "光原子時計はマイクロ波の時計を大きく上回り、秒の定義の見直しが見込まれている。しかし、不確かさが10^-18を下回ると報告する時計でも、同じ種類どうしの比較でそれを実験的に確かめた例は少なく、異なる種類どうしの比較では見積もりと合わない結果も出ている（Abstract、本文）。", "p3": "176Lu+の時計遷移は、黒体放射と磁場への感度が既存の時計の中で最も低く、原子が重いため運動によるずれも受けにくい（本文）。2台のずれの要因を洗い出して見積もり（表1）、共通のレーザーの位相雑音を打ち消す相関分光で2台を直接比べ、最大の系統効果である2次ゼーマン効果の係数は、磁場を意図的に変えるストレステストで測り直した（本文）。", "p4": "良さの基準は、評価した不確かさの範囲内で2台の周波数が一致するか（本文）。200時間の平均で比べ、秒の再定義に向けた国際的な目標（系統不確かさ2 × 10^-18以下、比較での一致5 × 10^-18以下）とも照らした（本文）。", "p5": "各時計の系統的な不確かさは約1 × 10^-19で、これまでの最良の報告の約4分の1（本文）。2台の周波数の差は[−0.1 ± 5.7（統計）± 1.0（系統）] × 10^-19で、比較の精度で決まる5.7 × 10^-19の水準で一致した（Abstract）。比較の不安定性は4.8 × 10^-16 (τ/s)^-1/2で、従来の研究から約3倍改善した（本文）。", "p6": "一致の確認は比較の統計的な精度（5.7 × 10^-19）で限られ、系統不確かさの約1 × 10^-19の水準までは検証しきれていない（Abstract、本文）。比較は同じ研究所の中の2台で、秒の再定義に必要な研究所間の比較はまだ課題（本文）。解釈：2台は同じ研究室で同じ考え方にもとづいて作られているため、両方に共通する系統誤差は比較では見えない。", "unverified": "Methodsと拡張データの図の細部（各系統効果の測定の詳細）は照合していない。"}}, {"field": "感染症・生態学", "headline": "新興感染症に残る人間活動の痕跡", "title": "The anthropogenic fingerprint on emerging infectious diseases", "url": "https://doi.org/10.1038/s41586-026-11058-6", "authors": "Rory Gibb ほか", "venue": "Nature", "date": "2026-09-23", "why": "32の感染症の発生記録を検出の偏りを補正して分析し、効く人為的要因は病気ごとに違うこと、医療へのアクセスが観測される発生地図を強く左右することを示した。対策は病気ごとの証拠に従うべきという含意は、感染症対策の政策に直結する。", "id": "n02", "explain": {"basis": "本文", "basis_note": "Natureのオープンアクセス版PDF（本文とMethodsの一部）を読んだ。拡張データの図表と補足資料は読んでいない", "preprint": false, "p1": "32の新興感染症の58,319件の発生記録を集め、16の社会・環境要因が発生の地理にどう効くかを、検出や報告の偏りを補正しながら調べた。人・家畜と森林・分断された生態系が入りまじる地域でリスクが高い一方、多くの人為的な要因の効果は病気ごとに大きく違うことを示した（Abstract）。", "p2": "人為的な生態系の変化や人・野生動物・家畜の接触は、人獣共通感染症や媒介動物による感染症の出現を促しうるが、それが発生リスクの地理をどれだけ形づくるのかは、よく調べられた少数の例を除いて分かっていない（Abstract）。これまでの出現のホットスポット研究は最初に記録された発生にもとづくため、資源の多い地域に偏る（本文）。", "p3": "169か国、1910〜2022年（主に2000年以降）の発生記録を統合し、発生地点と人口で重みづけした背景地点を比べる症例対照型の設計で、医療機関までの移動時間、森林被覆、景観の分断、家畜密度、森林減少、気温・降水の変化など16の要因の効果を、空間的な変量効果を入れたベイズ地理空間ロジスティック回帰で推定した（本文）。病気全体と病気ごとの両方で当てはめた。", "p4": "見かけのホットスポットが検出・報告の偏りでどれだけ説明されるか、病原体の型や伝わり方を越えて一貫する要因があるかを見た（本文）。米国のアルボウイルスの監視データで、この枠組みが郡単位の発生率のモデルと同じような要因を検出できるかも確かめた（本文、拡張データ図7）。", "p5": "検出・報告の偏りを補正すると、見かけのホットスポットは主に観測と報告の過程で作られていた（図2）。補正後も、森林被覆・景観の分断・家畜密度が高いほど発生リスクが高く、これらと長期的な降水の減少は、デング熱やライム病など複数の媒介動物性の感染症で共通して強く効いた（Abstract、本文）。エボラやエムポックスなど直接うつる人獣共通感染症には共通の要因が少なく、森林減少・温暖化・農業の集約化の影響は病気ごとに大きく違った（Abstract）。報告は、医療機関からの移動時間が1時間増えるごとに中央値で32%（病気により1.2〜96.7%）減った（Abstract）。", "p6": "要因が検出されないのが本当に関係がないためか、データの少なさや時空間のずれのためかは区別できず、都市での報告の多さと都市環境そのものの影響も切り分けられない（本文）。野生動物の取引のような要因は地理的なデータにしにくい（Methods）。著者は、万能の予防策はなく、生態系にもとづく対策は病気ごとの証拠に従い、医療と監視への投資と組み合わせるべきだとしている（Abstract）。", "unverified": "病気ごとの推定値（拡張データの図表）と補足資料は照合していない。"}}, {"field": "医学（がん）", "headline": "膵がん：KRAS阻害の効果をT細胞が持続させる", "title": "CD4 T cells convert transient responses to KRAS inhibition to durable remissions in pancreatic cancer", "url": "https://doi.org/10.1016/j.cell.2026.08.045", "authors": "Li Qiang ほか", "venue": "Cell", "date": "2026-09-23", "why": "KRAS阻害薬の効果を長続きさせる鍵がCD4 T細胞にあることをマウスで示し、膵がんの併用療法の設計を左右しうる。", "id": "n03", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、OpenAlexの抄録を使用", "preprint": false, "p1": "膵がんでKRAS阻害薬の効き目が一時的に終わってしまう問題に対し、IL-21の働きをまねる薬（21h10）を加えると、CD4 T細胞を介してマウスで長く続く寛解が得られることを示した（抄録）。", "p2": "膵管腺がん（PDAC）は免疫療法を含むほとんどの治療が効きにくく、免疫チェックポイント阻害でCD8 T細胞を活性化しても長期の寛解には足りない。KRAS阻害薬（KRASi）は臨床で有望だが、獲得耐性がよく起こる（抄録）。", "p3": "マウスでKRAS阻害薬への反応と再発を再現し、化学療法やチェックポイント阻害との併用と比べながら、IL-21サイトカインをまねた21h10の効果と、それがどの免疫細胞に依存するかを調べた（抄録）。", "p4": "長く続く寛解が得られるか、効果がCD4・CD8 T細胞や腫瘍細胞のMHCクラスI（CD8 T細胞に抗原を示す分子）に依存するかをマウスで確かめ、ヒトの膵がんの切除標本に体外で21h10を加えて反応を見た（抄録）。", "p5": "21h10は、化学療法やチェックポイント阻害との併用と違い、長期の持続的な寛解を誘導した（抄録）。効果はTh1型のCD4 T細胞に依存し、CD8 T細胞や腫瘍細胞のMHCクラスIには依存しなかった（抄録）。2型の通常型樹状細胞（cDC2）に活性化されたCD4 T細胞がインターフェロンγを出し、マクロファージによるがん細胞の貪食を促した（抄録）。ヒトの標本でも、浸潤したT細胞がインターフェロンγを産生した（抄録）。", "p6": "寛解の証拠はマウスでのもので、ヒトについては体外の標本でインターフェロンγが出ることを示したにとどまる（抄録）。解釈：ヒトでの効果と安全性（サイトカインによる毒性を含む）は臨床試験で確かめる必要がある。", "unverified": "本文を取得できず、使ったKRAS阻害薬の種類、寛解の割合、マウスモデルの詳細は未確認。"}}, {"field": "神経科学", "headline": "脳疾患ごとの細胞の脆弱性アトラス", "title": "Single-cell atlas of transcriptomic vulnerability across brain disorders", "url": "https://doi.org/10.1038/s41586-025-09573-z", "authors": "Donghoon Lee ほか", "venue": "Nature", "date": "2026-09-23", "why": "1,494人・630万個の細胞核という規模で8つの脳疾患を横断的に比べ、疾患に共通する変化と固有の変化を見分ける基盤データを示した。", "id": "n04", "explain": {"basis": "本文", "basis_note": "Natureのオープンアクセス版PDF（要旨、本文の前半と考察の一部、Methodsの一部）を読んだ。図と拡張データの数値は照合していない", "preprint": false, "p1": "1,494人の死後脳の背外側前頭前野から、630万個を超える細胞核の単一細胞RNAデータを作り、アルツハイマー病やパーキンソン病、統合失調症など8つの脳疾患に共通する遺伝子発現の変化と、疾患ごとの細胞の脆弱性を示す大規模なアトラスを作った（Abstract、本文）。", "p2": "神経変性疾患と精神疾患の分子の仕組みはよく分かっておらず、疾患を横断して共通の変化と固有の変化を見分けるには、個人差を上回る十分な規模のデータが必要だった（Abstract、本文）。", "p3": "死後脳の組織から単一細胞核RNAシーケンス（snRNA-seq）で27の細胞サブクラスを見分け、遺伝子発現のばらつきを細胞の種類・個人・技術的な要因に分けたうえで、疾患ごとの発現の差、細胞構成の変化、ニューラルネットで推定した病気の進み具合（疾患の擬似時間）を解析した（本文）。", "p4": "3つの脳バンクの1,494人（健常者と8疾患）で、疾患の間で発現の変化がどれだけ一致するか、アルツハイマー病（AD）の重さ（Braak段階、認知機能）や神経精神症状との関連を調べた（本文、図1）。", "p5": "発現のばらつきのうち平均50.5%は細胞の種類、7.5%は個人差で説明され、41.1%は説明されない残差だった（本文）。疾患を横断してmRNAの処理やタンパク質の局在など基本的な機能に共通の変化があり、それを除くと、AD、レビー小体型認知症、血管性認知症、パーキンソン病の間で遺伝的にも発現の上でも一致が強かった（Abstract）。重いADでは神経細胞が減って免疫細胞と血管系の細胞が増え、ADにともなう神経精神症状は深い層の興奮性ニューロンの増加と関連した（Abstract、本文）。", "p6": "死後脳の1つの領域だけを横断的に見た観察で、病気の進行は擬似時間として推定したもの（本文）。解釈：媒介分析で出来事の順序も検討しているが、観察データからの推論なので、治療の標的として有効かは実験で確かめる必要がある。", "unverified": "図と拡張データの数値、疾患ごとの人数の内訳（図1）、Methodsの詳細は照合していない。"}}, {"field": "生化学", "headline": "哺乳類は元素状の硫黄で細胞死を防ぐ", "title": "Mammals produce cyclo-octasulfur to suppress lipid peroxidation and ferroptosis", "url": "https://doi.org/10.1126/science.aec5473", "authors": "Uladzimir Barayeu ほか", "venue": "Science", "date": "2026-09-24", "why": "哺乳類で元素状硫黄の生成と役割が見つかったのは予想外で、フェロトーシスが関わる疾患の治療標的を広げる。", "id": "n05", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "哺乳類の細胞が元素状の硫黄を、最も安定な形であるシクロオクタ硫黄（硫黄原子が環状に並んだ分子）としてミリモル濃度で蓄え、それが脂質の過酸化とフェロトーシス（鉄に依存する細胞死）を抑えることを示した（抄録）。", "p2": "元素状の硫黄は進化的に古い代謝物だが、動物でどう作られ、どこに蓄えられ、何をしているのかは分かっていなかった（抄録）。", "p3": "マウスとヒトの細胞で、シクロオクタ硫黄の存在と局在、それを作る酵素、脂質の過酸化とフェロトーシスへの影響を調べ、変形性関節症のマウスで、水に溶けるようにしたシクロオクタ硫黄を関節に注射した（抄録）。", "p4": "細胞内の濃度と局在、合成酵素の同定、脂質の過酸化とフェロトーシスの起こりやすさ、関節炎モデルでの脂質の過酸化の変化で評価した（抄録）。測定法の詳細は抄録に記載がない。", "p5": "シクロオクタ硫黄はミトコンドリアの膜と脂肪滴にミリモル濃度で蓄積していた（抄録）。脂肪滴に結合した一酸化窒素合成酵素がその合成源の一つで、脂肪滴への蓄積は脂質の過酸化を抑え、フェロトーシスを抑制した（抄録）。関節への注射は、変形性関節症のマウスで脂質の過酸化を減らした（抄録）。", "p6": "抄録の範囲では、示されたのは細胞とマウスでの役割で、ヒトの病気での意味は分からない。著者も「細胞を守っている可能性がある」と慎重に述べている（抄録）。解釈：治療に使うには、毒性や体内での動きを確かめる必要がある。", "unverified": "本文を取得できず、測定法、濃度の値、フェロトーシスを抑える効果の大きさは未確認。"}}, {"field": "エネルギー・材料", "headline": "リチウム金属電池の寿命は電解液の枯渇で決まる", "title": "Unlocking cycle life of lithium metal batteries", "url": "https://doi.org/10.1126/science.aee1630", "authors": "Zheng Li ほか", "venue": "Science", "date": "2026-09-24", "why": "次世代の高容量電池の評価指標そのものを見直す成果で、電気自動車などの電池開発の方向づけに影響する。", "id": "n06", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "リチウム金属電池の寿命は、クーロン効率ではなく、不安定な固体電解質界面（SEI）による電解液の消耗と、それに伴う正極側でのリチウムの補償という仕組みで決まることを示し、寿命を予測できる定量的な関係を立てた（抄録）。", "p2": "リチウムイオン電池では、リチウムのクーロン効率（充放電でリチウムが失われずに戻る割合）が界面の安定性と寿命の指標になるが、リチウム金属電池ではクーロン効率が高くても寿命が長いとは限らない（抄録）。", "p3": "不安定なSEIが電解液を使い切らせ（dry-out）、負極でできた溶けやすい陰イオン種が正極へ移って酸化され、電解質の塩からリチウムイオンを放出してリチウムを補う（負極から正極へのクロストーク）という仕組みを明らかにし、SEIの質・電解液の消費・リチウムの補償の定量的な関係を立てた（抄録）。", "p4": "立てた関係でサイクル寿命を正確に予測できるかで評価した（抄録）。電池の条件や比べた電解液の数は抄録に記載がない。", "p5": "SEIの質にもとづく枠組みで、サイクル寿命を正確に予測できた（抄録）。そこから、電解液をごく少なくした条件で高エネルギーのリチウム金属電池の寿命を延ばすための、電解液設計の定量的な指針を導いた（抄録）。", "p6": "抄録の範囲では、予測精度の数値や、どの電池の形式・条件まで当てはまるかは分からない。解釈：電解液を極端に減らした条件で効いてくる仕組みで、樹枝状の析出（デンドライト）など他の劣化の要因との相対的な重さは本文で確かめる必要がある。", "unverified": "本文を取得できず、予測精度、実験したセルの条件、設計指針の具体的な中身は未確認。"}}, {"field": "社会科学・金融", "headline": "銀行の取引記録で経済的虐待を捉える", "title": "Banking records reveal characteristics of financial abuse", "url": "https://doi.org/10.1038/s41586-026-11049-7", "authors": "Anna Trendl ほか", "venue": "Nature", "date": "2026-09-23", "why": "小規模な質的調査に頼っていた問題を取引データで大規模に捉えた。金融データを社会課題に使う好例でもある。", "id": "n07", "explain": {"basis": "本文", "basis_note": "Natureのオープンアクセス版PDF（本文の結果・考察・限界とMethodsの標本の節）を読んだ。補足資料の表は読んでいない", "preprint": false, "p1": "英国の大手銀行の匿名化した取引記録を使い、銀行に経済的虐待を打ち明けた女性5,428人と、属性をそろえた対照15,602人を開示前の7年間にわたって比べ、貯蓄の減少、借入の増加、支払いの遅れ、信用スコアの低下といった形で、虐待が家計に残す痕跡を大規模に示した（Abstract）。", "p2": "経済的虐待（financial abuse: お金と家計を支配する形の家庭内虐待）は深刻で長く続くが記録しにくく、被害の日常についての証拠は小規模な質的調査にほとんど頼っていた（Abstract、本文）。", "p3": "英国の成人の約51%が使う最大手の小売銀行のデータで、銀行の専門チームに被害を開示した女性と、開示の7年前の人口統計・社会経済の属性をそろえた対照群を比べる、マッチングした症例対照の設計（本文）。給与、福祉給付、当座貸越、貯蓄、支出の種類といった取引の指標と、パスワードの再設定や住所の変更といった取引以外の記録を合わせた373の指標の推移を追った（Abstract、本文）。", "p4": "開示の1年前を中心に、7〜3.5年前、3.5〜0年前の期間ごとに373指標の群間差を検定し、多重比較を調整したP値で評価した（本文）。銀行の無作為な顧客（19,059人）と女性の顧客（18,906人）の値も目安として示した（本文）。", "p5": "開示の1年前に、被害者の群は対照群より、ユニバーサル・クレジット（英国の主な福祉給付）に移った人が28.4ポイント多く、当座貸越の枠が平均10,389ポンド大きく、貯蓄残高が3,501ポンド少なく、当座貸越の手数料がかかった人が34.6ポイント多かった（本文、図1）。クレジットカードやローンの申込みは多かったが承認の件数には差がなく、負債の多さは借入の需要が増えたことによる面があると著者は解釈している（本文）。自分のための支出は少なく、交通費と法的な費用、現金の引き出し、住所やパスワードの変更は多かった（Abstract）。", "p6": "被害者の群は銀行に開示した英国の女性に限られ、開示が経済的な困窮と結びついていれば平均的な被害者を代表しない（本文）。対照群にも開示していない被害者が含まれうるため、差は小さく見積もられている可能性がある（本文）。見えるのは最長7年間・1つの銀行の口座だけで、他の形の虐待の影響と切り分けられない（本文）。", "unverified": "補足資料の全373指標の検定結果と、Methodsのマッチングの細部は照合していない。"}}, {"field": "経済学", "headline": "賃金格差は労働運動を弱めるか", "title": "How Does Wage Inequality Affect the Labor Movement?", "url": "https://doi.org/10.1093/qje/qjag046", "authors": "Barbara Biasi ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-09-25", "why": "格差の拡大が労働者の連帯を弱めるかという古くからの問いに、複数の因果推論の設計で答えた経済学トップ誌の成果。", "id": "n08", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "労働者の間の賃金格差が労働組合の力を弱めることを、組合のオルグ担当者へのビネット実験、ウィスコンシン州の教員の賃金格差を広げた制度変更（自然実験）、2023年の脚本家組合ストでの情報介入という3つの設計で示した（抄録）。", "p2": "賃金格差が労働運動（組合の強さ）にどう影響するのかについて、因果的な証拠が乏しい（抄録の問題設定から。従来研究の具体的な不足は抄録に記載がない）。", "p3": "3つの補い合う研究設計を使う：①組合のオルグ担当者に仮想的な選択をさせるビネット実験、②ウィスコンシン州の公立学校教員の賃金格差を広げた政策変更を使う自然実験、③2023年の全米脚本家組合（WGA）のストライキ中の情報介入（抄録）。直観：個人で交渉する力の強い人ほど、格差のある職場では集団交渉より個人交渉を選び、組合から離れやすい。", "p4": "3つの設計のそれぞれで、格差が組合への支持と組織化の戦略にどう影響するかを見た（抄録）。具体的な指標と効果の大きさは抄録に記載がない。", "p5": "すべての研究で、格差は複数の経路で組合の力を弱めた（抄録）。個人の交渉力が高い労働者は、格差のある環境で組合への支持を取り下げ、個人交渉を好んだ（抄録）。オルグ担当者は格差に対して、交渉の焦点を賃金から移す、より小さく均質な交渉単位を選ぶといった、組合員は保てるが再分配は限られる戦略で応じた（抄録）。", "p6": "抄録の範囲では、効果の大きさや、米国の特定の文脈を越えた一般化は分からない。解釈：オルグ担当者の反応は仮想的な選択にもとづくため、実際の組織化の行動と一致するかは本文で確かめる必要がある。", "unverified": "本文を取得できず、各研究の標本の大きさ、効果の大きさ、情報介入の中身は未確認。"}}, {"field": "生態学・日本社会", "headline": "クマ被害急増の主因は木の実の不作の重なり", "title": "Compound food failure on a deteriorated mast system drives Japan's bear conflict crisis", "url": "https://doi.org/10.1126/sciadv.aej8134", "authors": "Hengjun Xiao ほか", "venue": "Science Advances", "date": "2026-09-23", "why": "日本で社会問題になっているクマの出没について原因の見立てを変える結果で、個体数管理に偏りがちな対策の見直しにつながる。", "id": "n09", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "2025年に日本で232人の死傷者を出したクマの出没の急増は、個体数の増加ではなく、木の実（堅果）の凶作が閾値を下回ることと、代わりの食物の不足が重なることで説明できると、東北5県の18年分のデータで示した（抄録）。", "p2": "気候変動は人と野生動物の軋轢を強めるとされるが、その仕組みはよく分かっていない。2025年のクマの被害は個体数の急増のせいとされてきたが、個体数の変化は遅すぎて急増を説明できない（抄録）。", "p3": "東北5県の18年分のデータで、堅果の豊凶と軋轢の関係を分析し、豊凶のリズムの構造変化と、一次生産性で表した代わりの食物が同時に不足する影響を調べた（抄録）。", "p4": "軋轢が堅果の生産量の閾値で急に増えるか、豊凶の系列に転換点があるかを調べ、2023年と2025年の大量出没を、単一の食物の不足と複合的な不足を分ける「自然実験」として比べた（抄録）。", "p5": "堅果の生産量が閾値を下回ると軋轢は急増した（抄録）。2006年ごろに豊凶の系が転換点を越え、その後は凶作がより深刻になり、閾値を下回る年が増えた（抄録）。代わりの食物も同時に不足すると、軋轢はさらに強まった（抄録）。", "p6": "抄録の範囲では、個体数の推定をどう扱ったか、人の側の要因（里山の変化など）をどこまで考慮したかは分からない。解釈：「自然実験」は2つの年の比較にもとづくため、因果の強さは本文の分析で確かめる必要がある。", "unverified": "本文を取得できず、閾値の値、使ったデータの種類（出没の件数か人身被害か）、統計モデルは未確認。"}}, {"field": "AI", "headline": "世界モデルに「物体の永続性」を学ばせる", "title": "Training Object Permanence in World Models", "url": "https://arxiv.org/abs/2609.28654", "authors": "Haotian Zhang ほか", "venue": "arXiv（Hugging Face投票187）", "date": "2026-09-25", "why": "動画生成モデルを物理的な常識をもつ「世界モデル」にするための中心的な課題に、学習データと試験を公開して取り組んだ。Hugging Face Daily Papersで187票を集めた（候補の取得時点）。", "id": "n10", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（データ・評価・結果・結論の節と表2）を読んだ。付録は読んでいない", "preprint": true, "p1": "発達心理学の「物体の永続性」と「固さ」の課題を150種類の動画生成器として作り、150万本の学習データと300問の試験を公開した。このデータで微調整した16Bの世界モデル（PWM-WROP）は、動画の続きを生成するモデルの中で人間の評価が最も高かった（Abstract、§6）。", "p2": "動画生成モデル（現在の世界モデルの代表）には推論能力の芽生えが報告されているが、隠れた物体が存在し続けること（物体の永続性: object permanence）や、物体どうしは通り抜けないこと（固さ: solidity）といった人間の中核的な認知を身につけているのか、身につけていないなら訓練で教えられるのかは分かっていない（Abstract、§1）。", "p3": "遮蔽物の陰を通った物体の再出現、容器ごと動く中身、開口より大きい物体は通れないこと、支えを外すと落ちること、衝突後の軌道など、6つの課題群・150の生成器をBlenderで作り、速度・照明・カメラの角度などを変えながら課題の構造は保って、各1万本の動画を作った（§3）。動画は120フレームで、前半60フレームを入力、後半60フレームを正解として続きを生成させる（§3.2）。Cosmos3-Nanoを基にしたPWM-WROPを、このデータで1エポック微調整した（§4.1）。", "p4": "14の動画モデル（参照からの生成3、編集7、続きの生成4）に300問の試験を解かせ、20人の評価者による盲検の一対比較（361件）をBradley–Terryモデルで集計し、Eloの尺度で順位をつけた（§4.4、§5.1）。評価の観点は、指示文との一致、動きの自然さと物理的なもっともらしさ、物体の永続性（消えない、突然現れない、壁を通り抜けない、色や数が変わらない）（§4.4）。画素単位などの自動指標は補助とした（§4.5）。", "p5": "首位はWan 3.0 PrimeとMiniMax H3（Elo 1723.6で同点）で、PWM-WROPは1679.5で全体の3位、続きを生成するモデルの中では首位となり、次のGrok Imagineを224ポイント上回った（表2、§5.1.1）。ブートストラップで見た首位になる確率はPWM-WROPが12.3%で、上位4つ以外は0だった（§5.1.1）。", "p6": "モデルどうしで構造も違うため、性能差を学習データだけのせいにはできないと著者は述べ、結果を予備的な証拠と位置づけている（§5.1.1、§6）。解釈：学習データと試験は同じ150の生成器から作られているため（試験は別に描画した標本）、微調整の効果には課題の形式への慣れも含まれうる。評価者は20人、比較は1モデルあたり50〜52件と少ない。", "unverified": "課題群ごとの結果（§5.1.2と付録C）と自動指標の値（§5.3）は照合していない。"}}], "top": [{"rank": 1, "theme": "サービス・マーケティング", "headline": "ブランド嫌悪への反応を救済手段の有無で説明", "title": "From brand hate to behavioral response: A recourse-contingent exit-voice-loyalty-neglect framework for digital consumer markets", "url": "https://doi.org/10.1016/j.jretconser.2026.105128", "authors": "G. Yoganandan ほか", "venue": "Journal of Retailing and Consumer Services", "sjr": 3.913, "date": "2026-09-25", "id": "t01", "explain": {"basis": "題名", "basis_note": "出版社（Elsevier）のサイトが自動取得を拒否し、抄録もCrossrefに登録されていない", "preprint": false, "p1": "題名から読める範囲では、ブランドを嫌う消費者の反応を、離脱・発言・忠誠・放置（exit-voice-loyalty-neglect）の4類型でとらえ、他に訴える手段（recourse）があるかどうかで反応が変わるとする枠組みを、デジタル消費市場について示した論文。", "p2": "未確認（抄録・本文を入手できず）", "p3": "未確認（抄録・本文を入手できず）", "p4": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "p6": "未確認（抄録・本文を入手できず）", "unverified": "題名以外のすべて（データ、手法、結果）。"}}, {"rank": 2, "theme": "LLM熟議・ペルソナ", "headline": "合成回答者の精度はAIの構造しだい（4研究）", "title": "Which AI? A Comparative Evaluation of Generative AI and Neuro‐Symbolic AI for Silicon Sampling", "url": "https://doi.org/10.1002/mar.70272", "authors": "Kamila Zahradnickova ほか", "venue": "Psychology & Marketing", "sjr": 3.642, "date": "2026-09-25", "id": "t02", "explain": {"basis": "抄録", "basis_note": "出版社サイトは自動取得を拒否したため、Crossrefに登録された抄録を使用", "preprint": false, "p1": "AIで作る合成回答者（シリコンサンプル）が人間の回答分布をどれだけ再現するかはAIの構造で違い、評価した生成AIは属性による偏りや回答のばらつきの縮小を示したのに対し、ニューロシンボリックAIは人間の回答にずっと近かったことを、4つの研究で示した（抄録）。", "p2": "シリコンサンプル（AIが生成する合成回答者）は市場調査の参加者の代わりとして提案されているが、正確さについての証拠はまちまちで、どのAIを使うかの影響は十分に検討されていない（抄録）。", "p3": "構造の異なる2種類のAI、生成AI（GenAI）とニューロシンボリックAI（NSAI: ニューラルネットと記号的・統計的な推論を組み合わせる方式）に回答者を模擬させ、人間のデータと分布を比べる（抄録）。生成AIには統計データを追加で与える条件も含む（抄録）。", "p4": "4つの研究で、人間の調査データを基準に分布の一致度（distributional fidelity）を評価した（抄録）。具体的な指標、課題、データの規模は抄録に記載がない。", "p5": "評価した生成AIは、統計データで補強しても、属性による偏り、ばらつきの縮小、人間の回答パターンからの乖離という系統的なゆがみを示した（抄録）。評価したNSAIのシステムは、調べた課題で人間の基準にかなり近かった（抄録）。", "p6": "抄録の範囲では、どの生成AIとNSAIのシステムを評価したのか、課題の種類、指標の値は分からない。著者も結論を「評価したモデル」に限っている（抄録）。解釈：NSAIのシステムが特定の商用製品であれば、手法の公開の程度と利害関係を本文で確かめる必要がある。", "unverified": "本文を取得できず、使ったモデル、課題、数値は未確認。"}}, {"rank": 3, "theme": "VBI・橋梁SHM", "headline": "局所的な付加質量で剛性低下の損傷を模擬する", "title": "Theoretical study and experimental verification of equivalent structural stiffness damage simulation using local added mass", "url": "https://doi.org/10.1016/j.istruc.2026.113124", "authors": "Zeyu Wu ほか", "venue": "Structures", "sjr": 1.108, "date": "2026-09-25", "id": "t03", "explain": {"basis": "題名", "basis_note": "出版社（Elsevier）のサイトが自動取得を拒否し、抄録もCrossrefに登録されていない", "preprint": false, "p1": "題名から読める範囲では、構造物の一部に質量を付け加えることで、剛性の低下（損傷）と等価な状態を模擬する方法を、理論と実験で検証した論文。", "p2": "未確認（抄録・本文を入手できず）", "p3": "未確認（抄録・本文を入手できず）", "p4": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "p6": "未確認（抄録・本文を入手できず）", "unverified": "題名以外のすべて（データ、手法、結果）。"}}, {"rank": 4, "theme": "VBI・橋梁SHM", "headline": "モデル更新で複合材ボルト接合部の損傷を同定", "title": "Damage identification of composite material bolted joint structures using model updating method", "url": "https://doi.org/10.1016/j.measurement.2026.123326", "authors": "Yiwei Lian ほか", "venue": "Measurement", "sjr": 1.145, "date": "2026-09-25", "id": "t04", "explain": {"basis": "題名", "basis_note": "出版社（Elsevier）のサイトが自動取得を拒否し、抄録もCrossrefに登録されていない", "preprint": false, "p1": "題名から読める範囲では、複合材料のボルト接合構造の損傷を、数値モデルを計測に合わせて修正する方法（モデル更新: model updating）で同定した論文。", "p2": "未確認（抄録・本文を入手できず）", "p3": "未確認（抄録・本文を入手できず）", "p4": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "p6": "未確認（抄録・本文を入手できず）", "unverified": "題名以外のすべて（データ、手法、結果）。"}}, {"rank": 5, "theme": "サービス・マーケティング", "headline": "評価点を独立した構成概念として文献を整理", "title": "Online Ratings as Constructed Signals: A Systematic Review of Generation, Interpretation, and Consumer Outcomes", "url": "https://doi.org/10.1111/ijcs.70264", "authors": "Arun Saxena ほか", "venue": "International Journal of Consumer Studies", "sjr": 1.894, "date": "2026-09-25", "id": "t05", "explain": {"basis": "抄録", "basis_note": "出版社サイトは自動取得を拒否したため、Crossrefに登録された抄録を使用", "preprint": false, "p1": "オンラインの評価点（星の数など）を、口コミ研究の付属物ではなく独立した構成概念として扱い、評価点がどう作られ、どう読まれ、消費者の結果にどうつながるかを423本の論文で整理したシステマティックレビュー（抄録）。", "p2": "集計された評価点は、電子的な口コミ（eWOM）やオンラインレビューの研究の中に埋め込まれて扱われ、それ自体が独立した構成概念として検討されてこなかった（抄録）。", "p3": "SPAR-4-SLRという手順に従い、Scopus、Web of Science、EBSCOhostで検索して、2002〜2025年の査読論文423本を残した（抄録）。理論・文脈・特徴・方法（TCCM）の枠組みと、行為者ごとの先行要因・意思決定・結果（ADO）の枠組みで整理した（抄録）。", "p4": "レビュー論文なので、検索と選定の手順の網羅性と、2つの枠組みによる整理の一貫性が質の基準になる（抄録）。", "p5": "評価点は、誰が投稿するかの偏り、感情、社会的影響、プラットフォームの設計、意図的なゆがみによって形づくられる「構成された信号」として働く（抄録）。評価点の生成と利用は循環する系をなし、行動への影響があっても消費者の利益が示されたことにはならない。信号の忠実さと判断の正確さは別物で、意思決定の質や厚生についての証拠は乏しい（抄録）。今後の研究の優先事項を5つ挙げた（抄録）。", "p6": "抄録の範囲では、選定基準の細部や、含めた研究の質の評価方法は分からない。解釈：査読論文に限ったレビューなので、プラットフォーム企業の内部研究や業界の報告は含まれていない可能性がある。", "unverified": "本文を取得できず、選定の流れ（除外の件数）と、各枠組みでの分類の結果は未確認。"}}, {"rank": 6, "theme": "サービス・マーケティング", "headline": "チャットボットの共感が客の無礼を強める逆効果", "title": "From scripted responses to emotional reactions: exploring customer incivility behavior and emotions during chatbot capability failures—a machine learning approach", "url": "https://doi.org/10.1108/intr-12-2025-2020", "authors": "Vida Siahtiri ほか", "venue": "Internet Research", "sjr": 2.207, "date": "2026-09-25", "id": "t06", "explain": {"basis": "抄録", "basis_note": "出版社サイトは自動取得を拒否したため、Crossrefに登録された抄録を使用", "preprint": false, "p1": "大学図書館のチャットボットとの32,586件の会話を機械学習で分析し、チャットボットの能力不足が否定的な感情を介して利用者の無礼な言動を招くこと、さらにチャットボットが共感を示すとその関係がかえって強まる「共感の逆効果」を示した（抄録）。", "p2": "AIによるサービスで、チャットボットの失敗が顧客の無礼な言動にどうつながるのか、そして回復の手段としての共感の表現がそれを和らげるのか強めるのかは分かっていない（抄録）。", "p3": "社会的反応理論（人は機械にも人に対するように社会的に反応するという理論）にもとづき、自然言語処理と教師あり機械学習で、会話からチャットボットの失敗（技術的・機能的）、共感の表現、顧客の感情、無礼な言動を取り出し、PROCESSで調整媒介モデルを推定した（抄録）。", "p4": "大学図書館のチャットボットの32,586件のテキスト会話を使い、感情による媒介と、共感による調整の有無と向きを検定した（抄録）。分類器の精度など、測定の妥当性の指標は抄録に記載がない。", "p5": "技術的・機能的な失敗はいずれも否定的な感情を引き起こし、その感情が失敗と無礼な言動の関係を完全に媒介した（抄録）。共感の表現は予想に反して、否定的な感情が無礼につながる効果を弱めるのではなく強めた（抄録）。", "p6": "1つの大学図書館のチャットボットの観察データで、他の業種や有料のサービスへの一般化は抄録からは分からない。解釈：感情や無礼さは機械学習で推定した値なので分類の誤りの影響を確かめる必要があり、観察データのため、共感の表現が出る場面の違い（失敗の深刻さなど）による交絡もありうる。", "unverified": "本文を取得できず、分類器の精度、効果の大きさ、失敗の種類の定義は未確認。"}}, {"rank": 7, "theme": "包摂的コミュニティ・社会", "headline": "高齢者にやさしい都市の評価尺度を10か国で検証", "title": "The global validation and results of an assessment tool for urban age-friendliness: A great leap forward towards an age-friendly world", "url": "https://doi.org/10.1057/s41599-026-08924-z", "authors": "Jeroen Dikken ほか", "venue": "Humanities and Social Sciences Communications", "sjr": 0.904, "date": "2026-09-25", "id": "t07", "explain": {"basis": "抄録", "basis_note": "出版社サイトが自動取得を制限したため、Crossrefに登録された抄録を使用", "preprint": false, "p1": "高齢者にやさしい都市の評価質問票（AFCCQ）が、日本を含む10か国で同じ意味で測れる（測定不変性がある）ことを4,648人のデータで確かめ、国際比較の基準となる値を示した（抄録）。", "p2": "高齢者にやさしい都市のネットワークでは、国ごとの社会経済・文化の違いのために情報を比べにくく、都市どうしが学び合う妨げになっている（抄録）。", "p3": "AFCCQを10か国（イタリア、ポーランド、北マケドニア、ルーマニア、オランダ、オーストラリア、トルコ、ロシア、日本、イスラエル）で実施し、構造方程式モデリングで測定不変性（国が違っても尺度が同じ構造と意味で機能するか）を検定し、記述統計で国を比べた（抄録）。", "p4": "4,648人の回答を使い、国の間で因子構造や負荷量などが等しいとみなせるかを基準にした（抄録）。適合度の具体的な値は抄録に記載がない。", "p5": "AFCCQは国を越えて同じ基準で評価でき、意味のある国際比較ができると結論した（抄録）。国ごとの基準となる記述統計も示した（抄録）。", "p6": "抄録の範囲では、どの段階の不変性（構造・負荷量・切片）まで成り立ったのか、各国の標本の集め方と代表性は分からない。解釈：各国の標本が便宜的に集められていれば、国の平均の差には標本の違いも混ざる。", "unverified": "本文を取得できず、不変性の段階、適合度、国別の人数と得点は未確認。"}}, {"rank": 8, "theme": "都市・インフラ政策", "headline": "地価に反映されない地震リスクと土地利用政策", "title": "Governing the unpriced hazard: A land-use policy framework for spatially concentrated seismic risk when markets do not capitalise it", "url": "https://doi.org/10.1016/j.landusepol.2026.108356", "authors": "Kerem Yavuz Arslanlı ほか", "venue": "Land Use Policy", "sjr": 1.686, "date": "2026-09-25", "id": "t08", "explain": {"basis": "題名", "basis_note": "出版社（Elsevier）のサイトが自動取得を拒否し、抄録もCrossrefに登録されていない", "preprint": false, "p1": "題名から読める範囲では、地震リスクが特定の地域に集中しているのに不動産価格に織り込まれていない場合に、それを土地利用政策でどう扱うかの枠組みを示した論文。", "p2": "未確認（抄録・本文を入手できず）", "p3": "未確認（抄録・本文を入手できず）", "p4": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "p6": "未確認（抄録・本文を入手できず）", "unverified": "題名以外のすべて（データ、手法、結果）。"}}, {"rank": 9, "theme": "VBI・橋梁SHM", "headline": "環境影響下のアーチダム固有振動数をBNNで推定", "title": "Long-term structural health monitoring of arch dams under environmental effects: bayesian neural network-based frequency estimation", "url": "https://doi.org/10.1016/j.measurement.2026.123318", "authors": "E. Kalkan Okur ほか", "venue": "Measurement", "sjr": 1.145, "date": "2026-09-25", "id": "t09", "explain": {"basis": "題名", "basis_note": "出版社（Elsevier）のサイトが自動取得を拒否し、抄録もCrossrefに登録されていない", "preprint": false, "p1": "題名から読める範囲では、環境の影響を受けるアーチダムの長期モニタリングで、固有振動数をベイズニューラルネットワークで推定する方法を示した論文。", "p2": "未確認（抄録・本文を入手できず）", "p3": "未確認（抄録・本文を入手できず）", "p4": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "p6": "未確認（抄録・本文を入手できず）", "unverified": "題名以外のすべて（データ、手法、結果）。"}}, {"rank": 10, "theme": "職場AI・組織行動", "headline": "デジタル化する窓口行政の役割ストレスと仕事の工夫", "title": "Role strain and job crafting in China’s digitalizing street-level bureaucracy", "url": "https://doi.org/10.1080/14719037.2026.2739599", "authors": "Fan Yang ほか", "venue": "Public Management Review", "sjr": 2.54, "date": "2026-09-25", "id": "t10", "explain": {"basis": "題名", "basis_note": "出版社（Taylor & Francis）のサイトが自動取得を拒否し、抄録もCrossrefに登録されていない", "preprint": false, "p1": "題名から読める範囲では、デジタル化が進む中国の窓口行政（第一線の公務員）で生じる役割の緊張と、職員が自分で仕事を組み替える行動（ジョブ・クラフティング: job crafting）を扱った論文。", "p2": "未確認（抄録・本文を入手できず）", "p3": "未確認（抄録・本文を入手できず）", "p4": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "p6": "未確認（抄録・本文を入手できず）", "unverified": "題名以外のすべて（データ、手法、結果）。"}}, {"id": "t11", "rank": 11, "theme": "VBI・橋梁SHM", "headline": "橋のたわみ計測でカメラの熱による像ずれを補正", "title": "Segmented evaluation and multivariate temporal compensation method for thermally induced image drift in chain cameras for bridge deflection monitoring", "url": "https://doi.org/10.1016/j.istruc.2026.112946", "authors": "Shitong Hou ほか", "venue": "Structures", "sjr": 1.108, "date": "2026-09-25", "explain": {"basis": "題名", "basis_note": "出版社（Elsevier）のサイトが自動取得を拒否し、抄録もCrossrefに登録されていない", "preprint": false, "p1": "題名から読める範囲では、橋のたわみを連鎖的に配置したカメラ（chain cameras）で計測するときに、温度変化で生じる画像のずれを区間ごとに評価し、複数の変数を使った時間的な補正で取り除く方法を示した論文。", "p2": "未確認（抄録・本文を入手できず）", "p3": "未確認（抄録・本文を入手できず）", "p4": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "p6": "未確認（抄録・本文を入手できず）", "unverified": "題名以外のすべて（計測の対象橋、補正の手法、精度）。"}}, {"id": "t12", "rank": 12, "theme": "LLM熟議・ペルソナ", "headline": "年齢別のAIペルソナで面接の質問文を試し、年齢差を減らす", "title": "Age-inclusive AI assessments: testing and refining open-ended prompts with human and LLM-simulated data", "url": "https://doi.org/10.1007/s10869-026-10152-w", "authors": "Jingyi Li ほか", "venue": "Journal of Business and Psychology", "sjr": 2.563, "date": "2026-09-25", "explain": {"basis": "本文", "basis_note": "Springerのオープンアクセス版PDF（要旨、研究1・2の方法と結果、限界の節）を読んだ。表の全数値は照合していない", "preprint": false, "p1": "AIによる録画面接で、年齢によって回答の言語的な特徴が違うことを実際の回答で示し、ChatGPTで作った年齢別のAIペルソナに答えさせて質問文の言い回しを試すことで、年齢差の一部を小さくできることを示した（Abstract）。", "p2": "採用でAIの評価ツール（自動ビデオ面接やチャットボット）が広がる一方、年齢によるコミュニケーションの違いがAIの評価にどう現れ、評価の設計（質問文）で減らせるのかは分かっていない（Abstract）。", "p3": "研究1は、18歳から66歳以上の働く成人の面接の回答を、話題、語彙、統語の複雑さ、応答のタイミングなどの言語的な特徴で分析し、学歴・性別・人種・社会経済的地位・性格・職業興味を統制して年齢差を調べた（本文）。研究2は、研究1の参加者一人一人に対応するAIペルソナをChatGPTで作り、元の質問と修正した質問に答えさせて、年齢差が変わるかを試した（本文）。直観：人間で大規模に試す前に、LLMのペルソナで質問文の試作を安く繰り返す。", "p4": "研究1はオンラインの参加者募集サービス（CloudResearch Connect）で集めた373人の録画回答（本文）。研究2では、ペルソナが研究1の年齢差のパターンを再現できるか、修正した質問で年齢と言語的特徴の関係（標準化係数）がどれだけ弱まるかを見た（本文、表6）。", "p5": "研究1では、統制した後も、話題の中身と言語の複雑さに有意な年齢差があった（Abstract）。研究2では、修正した質問で複数の特徴の年齢差が弱まり、とくに「過去への言及」（77%減）、家庭に関する語（73%減）、難しい語の使用（67%減）で大きかったが、弱まらない差もあった（本文、表6、Abstract）。", "p6": "研究1のデータは研究目的の利害の低い場面で集めたもので、実際の採用選考の場面を代表しない（Limitations）。LLMのペルソナの「振る舞い」は学習した言葉の連想の産物で、実際の経験や社会的な認知ではないため、シミュレーションで見えた効果は予備的な手がかりにとどまると著者自身が述べている（本文）。", "unverified": "研究1の年齢差の効果量の一覧（表）と付録の質問文は照合していない。"}}, {"id": "t13", "rank": 13, "theme": "包摂的コミュニティ・社会", "headline": "不平等の知覚を2つの領域で測る合成指標", "title": "An optimal weighting scheme for a synthetic index of perception of inequality", "url": "https://doi.org/10.1007/s10888-026-09744-6", "authors": "Sebastiano Bavetta ほか", "venue": "Journal of Economic Inequality", "sjr": 1.228, "date": "2026-09-25", "explain": {"basis": "本文", "basis_note": "Springerのオープンアクセス版PDF（序論、方法、データ、結果、検証、結論の節）を読んだ。表の全数値と付録は照合していない", "preprint": false, "p1": "人々が感じる不平等を「機会の不平等」と「結果の不平等」の2つの領域で測る合成指標を、潜在クラスモデルで各設問の最適な重みを決めて作り、24のOECD諸国の国際社会調査（ISSP）のデータで、客観的な不平等の指標と整合することを示した（Abstract）。", "p2": "不平等の知覚は政策への選好などを左右するが、測定は単一の設問に頼ることが多く、多次元性や直接観察できない性質を扱えない。複数の設問をどう重みづけるかの根拠がないと、二重に数えたり過小に評価したりしてしまう（§1）。", "p3": "機会の領域（人種・性別・親の学歴・家の財産が成功に重要か）と結果の領域（所得の差が大きすぎるかなど）の設問を観察指標とし、不平等の知覚を潜在変数とする潜在クラスモデル（回答パターンの似た人のグループを推定する方法）で、各設問が知覚にどれだけ寄与するかから最適な重みを求め、重みつきの和としてスコアを作る（§2、§4）。", "p4": "ISSPの3つの時点（1992、2009、2019年）の24か国で、欠測のない58,941人の回答を使った（§3）。等しい重み、因子分析、多重対応分析によるスコアとの比較、客観的な指標（ジニ係数、所得の10/90比、世代間の移動の指標、人間開発指数）との相関、属性による違いの回帰分析、標本外の予測で検証した（§5）。", "p5": "結果の領域は一次元で、機会の領域は多次元だった（§4）。作ったスコアは他の重みづけの方法と似た結果でばらつきが小さく、それぞれの客観的な指標と正に相関した（§5.2、表8）。回答者の約13%が性別や人種を成功に「とても重要・不可欠」と答え、家の財産では23%超、親の学歴では33%超、所得の差が大きすぎるという回答は80.68%だった（§3、表2）。", "p6": "3つの時点と限られた国のデータで、他の国や文化への一般化はできず、どの設問が知覚を最もよくとらえるかは理論的な検討が要ると著者は述べている（§6）。日本は結果の領域の設問が欠けていて分析から除かれた（§3）。解釈：欠測や「わからない」を除いた完全な回答だけで作っているため、除いたことによる偏りは確かめる必要がある。", "unverified": "表8の相関係数の値と、標本外予測の結果（オンライン付録）は照合していない。"}}, {"id": "t14", "rank": 14, "theme": "LLM熟議・ペルソナ", "headline": "コードごとにプロンプトを変えるとLLMの質的コーディングが改善", "title": "One Prompt Does Not Fit All: Comparing Uniform and Adaptive Code‐Specific Prompting for Deductive Qualitative Coding With Large Language Models", "url": "https://doi.org/10.1002/jcal.70334", "authors": "María Jesús Rodríguez‐Triana ほか", "venue": "Journal of Computer Assisted Learning", "sjr": 2.155, "date": "2026-09-24", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "LLMで教育データを演繹的に質的コーディングするとき、コードごとにプロンプトを作り分ける「適応的プロンプト」が、全体に同じプロンプトを使うより、人間の合意コーディングとの一致を保ちつつ計算コストを下げられることを示した（抄録）。", "p2": "コードブックにもとづくLLMの質的コーディングは実現可能とされる一方、コード化する構成概念によって性能がばらつく。従来はデータ全体に1つのプロンプト戦略を当てはめていた（抄録）。", "p3": "専門家のコーダーの知見やデータにもとづく規則で、コードごとにプロンプトを作り分け、ゼロショットや少数例（few-shot）の一律のプロンプトと比べる（抄録）。オープンウェイトのLLM 2種（Llama 3.3、GPT-OSS）で、3つの教育学的な枠組みのコードを付けた（抄録）。", "p4": "教員が探究型学習のデジタル基盤で作った35の学習設計（758の項目・活動）を、2人の人間のコーダーとLLMがコード化し、人間が協議して合意したコーディングとの一致度と、計算コストで比べた（抄録）。", "p5": "どちらのLLMでも、データにもとづく適応的プロンプトは、一律のプロンプト（文脈の有無を変えたゼロショットと少数例）と同じかそれ以上の一致を示し、コストも下げた（抄録）。", "p6": "抄録の範囲では、一致度の具体的な値、どのコードで差が大きかったか、発話記録など他の種類のデータへの当てはまりは分からない。解釈：規則を作るのに専門家のコーディングが要るため、完全な自動化ではなく、人とAIの協働を前提にした方法である。", "unverified": "本文を取得できず、一致度の指標と値、コスト削減の大きさは未確認。"}}, {"id": "t15", "rank": 15, "theme": "職場AI・組織行動", "headline": "ホテルのロボット導入は従業員の不安と活力を同時に高める", "title": "The dual effects of service robot usage in hotels on employees’ service innovation behavior", "url": "https://doi.org/10.1108/jhtt-04-2025-0324", "authors": "Lele Wang ほか", "venue": "Journal of Hospitality and Tourism Technology", "sjr": 1.785, "date": "2026-09-24", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ホテルでのサービスロボットの利用は、従業員の雇用不安を高めてサービスの革新行動を抑える一方、仕事での活力（thriving at work）を高めて革新行動を促すという二重の効果をもつことを、中国の16ホテル482人の時間差調査で示した（抄録）。", "p2": "サービスロボットには道具としての面と擬人的な面があり、導入が従業員の心理と行動にどう影響するかは複雑で、十分に解明されていない（抄録）。", "p3": "ロボットの利用が、雇用不安と仕事での活力という2つの経路を通じてサービスの革新行動に影響し、その効果を従業員のAIへの意識（AI awareness。背景：先行研究では、AIに仕事を置き換えられうるという認識を指すことが多い）が調整するモデルを立て、最小二乗回帰と構造方程式モデリングで検証した（抄録）。", "p4": "中国の16ホテルの従業員482人に、時間差を置いて行ったフィールド調査（抄録）。2つの分析方法で結果の頑健性を確かめた（抄録）。", "p5": "ロボットの利用は雇用不安を強めて革新行動を抑え、同時に仕事での活力を高めて革新行動を促した（抄録）。こうした心理状態への効果は、従業員のAIへの意識に大きく左右された（抄録）。", "p6": "抄録の範囲では、効果の大きさ、2つの経路のどちらが上回るか（全体としての効果）、ロボットの利用の測り方は分からない。解釈：中国のホテル従業員の自己報告データなので、他の業種・国への一般化と、共通方法による関連の水増しは本文で確かめる必要がある。", "unverified": "本文を取得できず、尺度、係数、調整効果の具体的な形は未確認。"}}, {"id": "t16", "rank": 16, "theme": "会計情報科学", "headline": "財務が健全な企業ほどESGの開示と実績のずれが小さい", "title": "EXPRESS: Financial Health, Corporate Governance, and the ESG Disclosure-Performance Gap: Performance Implications in the Hospitality Industry", "url": "https://doi.org/10.1177/10963480261491236", "authors": "Hyoung Ju Song ほか", "venue": "Journal of Hospitality and Tourism Research", "sjr": 1.953, "date": "2026-09-25", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "米国の上場ホスピタリティ企業で、財務的に健全な企業ほどESGの開示と実績のずれ（グリーンウォッシングの強さの指標とみなす）が小さく、ずれ自体はトービンのqと正に関連することを示した（抄録）。", "p2": "ESGの開示と実際のESGの実績のずれが、どんな条件で生じ、企業の業績とどう関係するのかははっきりしていない（抄録）。", "p3": "組織理論と市場のシグナリング理論を組み合わせ、財務の健全性と企業統治（CEOの持株比率、短期の報酬）がESGの開示と実績のずれとどう関連するか、そのずれが業績（トービンのq、ROA、ROI）とどう関連するかを、パネルデータで分析した（抄録）。", "p4": "米国の上場ホスピタリティ企業のパネルデータで、短期と長期（3年のラグ）のモデルで業績との関連を見た（抄録）。企業数と期間は抄録に記載がない。", "p5": "財務的に健全な企業ほどずれが小さく、その関連はCEOの持株比率が高いほど弱まったが、CEOの短期の報酬による違いは有意でなかった（抄録）。ずれは短期・長期のどちらのモデルでもトービンのqと正に関連し、ROAとROIとは3年のラグで限られた遅い関連しかなかった（抄録）。", "p6": "抄録の範囲では、ずれの測り方（どのESG評価を使ったか）や、因果の識別の方法は分からない。解釈：ずれがトービンのqと正に関連する結果は、市場が開示を額面どおり評価している可能性を示すが、関連であって因果ではない。", "unverified": "本文を取得できず、ESG指標の出所、標本の規模、係数の大きさは未確認。"}}, {"id": "t17", "rank": 17, "theme": "会計情報科学", "headline": "名前を伏せられたアナリストは予想をより正確にした", "title": "Analyst visibility and earnings forecast quality", "url": "https://doi.org/10.1007/s11142-026-09981-0", "authors": "Qiang Cheng ほか", "venue": "Review of Accounting Studies", "sjr": 5.56, "date": "2026-09-25", "explain": {"basis": "本文", "basis_note": "Springerのオープンアクセス版PDF（序論と研究の概要、変数の定義）を読んだ。結果の表の全数値は照合していない", "preprint": false, "p1": "2018年10月に88の証券会社がEikon上でアナリストの名前を伏せた（匿名化した）出来事を準自然実験として使い、目立たなくなったアナリストがかえってより正確な利益予想を出すようになったことを示した（Abstract、§1）。", "p2": "アナリストの目立ちやすさ（visibility）は評判や報酬に関わるが、研究は目立ちやすさを固定的な属性として扱い、それが下がったときにアナリストがどう反応するのかはほとんど分かっていない（§1）。", "p3": "匿名化された証券会社のアナリスト（処置群）と、そうでないアナリスト（対照群）が同じ企業・同じ四半期に出した予想を、匿名化の前後で比べる差の差（difference-in-differences）の分析で、企業×四半期の固定効果などを入れて推定した（§1）。直観：匿名化で顧客以外の投資家が予想を個人に結びつけられなくなると、目立ちやすさを取り戻すために予想の質を上げる動機が生まれる。", "p4": "予想の正確さの相対的な変化を主な指標とし、正確さを上げたアナリストが金融メディアでの露出、スターアナリストへの選出、顧客の売買を保てたかを調べた（§1）。EUの金融規制MiFID IIの影響を除く分析（米国のアナリスト、EUに拠点のない証券会社）、匿名化の前のトレンドの比較、エントロピー・バランシングで頑健性を確かめた（§1）。", "p5": "匿名化の後、処置群の予想の正確さは相対的に上がり、その大きさは固定効果の中での標準偏差の3.8%だった（§1）。正確さを最も上げたアナリストは、メディアでの露出を保ち、スターアナリストに選ばれやすく、顧客の売買を多く引き出した（Abstract）。より広く頻繁に予想し、より大胆な目標株価を出すといった目立つための戦略も使っていた（Abstract）。", "p6": "匿名化は証券会社の判断で、MiFID IIの影響も受けた可能性があり、著者は追加の分析でその影響を除こうとしている（§1）。解釈：3.8%という効果は統計的には意味があっても大きくはなく、市場全体の情報の質をどれだけ高めたかは別に検討が要る。", "unverified": "本文の結果の表（係数、標本の大きさ）と、メディア露出・スター選出の分析の数値は照合していない。"}}, {"id": "t18", "rank": 18, "theme": "LLM熟議・ペルソナ", "headline": "模擬陪審は説示に従い、日常の知識で逸脱もする", "title": "‘But, today, you’ve got to be beyond reasonable doubt’: The discursive negotiation of judicial directions in mock-jury deliberations in England and Wales", "url": "https://doi.org/10.1177/09579265261481841", "authors": "Rebecca Jenkins ほか", "venue": "Discourse and Society", "sjr": 1.188, "date": "2026-09-25", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "イングランドとウェールズの模擬陪審の評議を談話分析し、陪審員が裁判官の説示にただ従うのではなく、日常の知識にもとづく推論で説示から外れることも含めて、主体的に解釈・交渉していることを示した（抄録）。", "p2": "陪審員は法的な専門知識の受け身の受け手として描かれがちで、評議の中で裁判官の説示（judicial directions）がどう解釈され、交渉され、組み替えられるのかは十分に分かっていない（抄録）。", "p3": "相互行為分析と語りの分析という談話分析の手法で、模擬陪審の評議の記録を分析した（抄録）。", "p4": "132人の参加者による模擬陪審の評議の書き起こし9.4万語と、10時間分の映像を使った（抄録）。質的な研究なので、統計的な指標ではなく、分析の厚みと事例の示し方が質の基準になる。", "p5": "陪審員の主体性は、説示に従うことと、一般の人の知識にもとづく推論で説示から外れることの2つの形で現れた（抄録）。これらを通じて陪審員は、相互行為の中の役割を作ったり争ったりし、集団の力学を調整し、日常の知識と制度的な権威の関係に折り合いをつけていた（抄録）。", "p6": "抄録の範囲では、実際の評議ではなく模擬陪審であることの影響や、分析した事例の選び方は分からない。解釈：質的な分析なので、2つの形がどれくらいの頻度で現れ、評決にどう影響するかは別の検証が要る。", "unverified": "本文を取得できず、模擬裁判の事件の設定、グループの数、具体的な事例は未確認。"}}, {"id": "t19", "rank": 19, "theme": "包摂的コミュニティ・社会", "headline": "規則の伝え方と行政負担の追試、AIの要約で負担が減る", "title": "A Replication of “It is Not Merely About the Content: How Rules Are Communicated Matters to Administrative Burden”", "url": "https://doi.org/10.1111/padm.70097", "authors": "Qi Bian ほか", "venue": "Public Administration", "sjr": 2.723, "date": "2026-09-25", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "規則の伝え方（官僚的な言葉づかい、複雑な情報構造）が行政負担を増やすという先行研究を、中国の災害救援の申請で追試しておおむね再現し、さらにチャットボットによるAIサービスが行政負担を減らすことを実験で示した（抄録）。", "p2": "規則の伝え方が行政負担（手続きにともなう学習・遵守・心理的なコスト）を左右するという知見が、別の国・言語・政策でも成り立つのか、AIサービスでそれを和らげられるのかは分かっていない（抄録）。", "p3": "研究1は、中国の自然災害の救援の申請を題材にした原研究の追試。研究2は、AIサービスの2つの機能――データベースの規則をそのまま返す「表示」と、情報を集めて要点を簡潔に並べる「最適化」――の効果を調べる拡張実験（抄録）。", "p4": "行政負担を学習コスト、遵守コスト、心理的なコスト（ストレス、自律性の喪失、スティグマ）に分けて測り、原研究の結果と比べた（抄録）。標本の大きさは抄録に記載がない。", "p5": "官僚的な言葉づかいは学習・遵守のコスト、ストレス、自律性の喪失を高め、複雑な情報構造も学習・遵守のコストと自律性の喪失を高めた（研究1、抄録）。原研究とは、官僚的な言葉づかいによるスティグマ（原研究では生じた）と、情報の複雑さが遵守と自律性に与える影響（原研究では効果なし）の点で違った（抄録）。AIサービスは負担を減らし、予想に反して「表示」でも学習・遵守・心理的なコストが下がり、「最適化」はすべての次元でさらに大きく下げた（研究2、抄録）。", "p6": "著者は、原研究との違いを、中国語の表語文字の複雑さなど文脈の違いによる可能性があるとしている（抄録）。抄録の範囲では、実験の形式と標本の大きさは分からない。解釈：「最適化」は情報の取捨選択をともなうため、大事な条件が省かれる危険とのトレードオフは別に検討が要る。", "unverified": "本文を取得できず、実験の設計（シナリオ実験かどうか）、標本の大きさ、効果の大きさは未確認。"}}, {"id": "t20", "rank": 20, "theme": "都市・インフラ政策", "headline": "山火事リスク地域では従来型の住宅ローンが厳しい", "title": "Bluelining in Red Hot Fire Zones: Fintech and Traditional Mortgage Lending in California’s Wildfire Risk Zones", "url": "https://doi.org/10.1177/0739456x261482067", "authors": "Tyler Haupert ほか", "venue": "Journal of Planning Education and Research", "sjr": 1.054, "date": "2026-09-25", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "カリフォルニア州で、山火事リスクの高い地域の住宅ローンについて、従来型の金融機関はフィンテックの貸し手より承認率が低く、金利が高いことを示した（抄録）。", "p2": "気候リスクにさらされた地域で、貸し手の種類によって住宅ローンの結果がどう違うかは研究されてきたが、山火事との関係はほとんど分かっていない（抄録）。", "p3": "カリフォルニア州の住宅ローンのデータで、山火事リスクの程度が違う地域ごとに、フィンテックと従来型の貸し手の承認率と金利を比べた（抄録）。背景：題名の「bluelining」は、かつての人種による融資差別「redlining」になぞらえ、気候リスクによる融資の選別を指す言葉。", "p4": "貸し手の種類と山火事リスクの水準による、承認率と金利の差を比べた（抄録）。データの出所、統計モデル、統制した変数は抄録に記載がない。", "p5": "従来型の貸し手は、山火事リスクの高い地域の住宅に対して、フィンテックの貸し手より承認率が低く、高い金利を付けていた（抄録）。", "p6": "抄録の範囲では、差の大きさ、借り手の信用力などの統制、因果の識別の方法は分からない。解釈：フィンテックがリスクを価格に十分反映していない可能性も、従来型が過剰に反応している可能性もあり、どちらかは本文の分析で確かめる必要がある。", "unverified": "本文を取得できず、データの出所、差の大きさ、統制変数は未確認。"}}], "top_notable": [{"field": "医学（臨床試験）", "headline": "異型髄膜腫の全摘後、放射線治療で再発が減った", "title": "Radiotherapy versus observation following surgical resection of WHO grade 2 atypical meningioma (ROAM/EORTC-1308): an international, multicentre, open-label, phase 3, randomised controlled trial", "url": "https://doi.org/10.1016/s0140-6736(26)01804-0", "authors": "Michael D Jenkinson ほか", "venue": "The Lancet", "date": "2026-09-25", "why": "長年決着していなかった「異型髄膜腫を全摘した後に放射線治療をすべきか」という臨床の問いに、11か国のランダム化比較試験で答えた。", "id": "tn01", "sjr": 14.821, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、PubMedに登録された構造化抄録を使用", "preprint": false, "p1": "全摘出した異型髄膜腫（WHOグレード2）で、術後の放射線治療が経過観察に比べて再発を減らすことを、国際多施設のランダム化比較試験で示した（抄録）。", "p2": "異型髄膜腫は完全に切除しても再発の危険が高い脳腫瘍だが、術後の補助的な放射線治療を行うべきかは決着していなかった（抄録）。", "p3": "11か国58施設の非盲検・第3相のランダム化比較試験で、完全に切除された16歳以上の患者を、放射線治療（強度変調放射線治療、60 Gyを30回・6週）と経過観察に1:1で割り付けた（抄録）。", "p4": "主要評価項目は無病生存（手術から、MRIで確認した再発またはあらゆる原因の死亡までの期間）で、割り付けたとおりの全員で解析した（抄録）。追跡は最低4年、有害事象は実際に受けた治療ごとに評価した（抄録）。", "p5": "157人（放射線78人、観察79人）を割り付け、追跡期間の中央値64か月で、再発は放射線群11人（14%）、観察群24人（30%）だった（抄録）。5年無病生存率は79.9%対64.3%（差15.6ポイント、95%信頼区間0.6〜30.5）、ハザード比0.51（95%信頼区間0.27〜0.97、p = 0.0396）（抄録）。放射線に関連するグレード2〜3の重い有害事象は66人中5人（8%）で、治療関連の死亡はなかった（抄録）。", "p6": "非盲検の試験で症例数は157人と少なく、差の信頼区間の下限は0.6ポイントと0に近い（抄録）。著者も、再発予防を遅れて現れる副作用より重視する場合に考慮すべき治療とし、患者との個別の話し合いで決めるよう求めている（抄録）。解釈：認知機能などの遅発性の影響は、中央値5年ほどの追跡では十分に評価しきれない。", "unverified": "本文を取得できず、全生存、生活の質、遅発性の有害事象、サブグループの結果は未確認。"}}, {"field": "医学（がん）", "headline": "骨髄腫の新しい併用療法で深い奏効が約2倍に", "title": "Iberdomide plus daratumumab and dexamethasone versus daratumumab, bortezomib, and dexamethasone in patients with relapsed or refractory multiple myeloma (EXCALIBER-RRMM): an open-label, randomised, controlled, phase 3 trial", "url": "https://doi.org/10.1016/s1470-2045(26)00450-x", "authors": "Sagar Lonial ほか", "venue": "The Lancet Oncology", "date": "2026-09-25", "why": "再発した骨髄腫で、深い奏効を大きく増やす経口薬の併用を第3相試験で示し、治療の選択を左右しうる（生存への効果は評価中）。", "sjr": 9.432, "id": "tn02", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、PubMedに登録された構造化抄録を使用", "preprint": false, "p1": "再発・難治性の多発性骨髄腫で、経口の新薬イベルドミドをダラツムマブ・デキサメタゾンと組み合わせると、標準的な併用療法より、微小残存病変（MRD）が陰性の完全奏効が約2倍（41%対21%）になることを、第3相ランダム化試験の主要解析で示した（抄録）。", "p2": "イベルドミド（セレブロンE3リガーゼ調節薬。従来の免疫調節薬より抗骨髄腫作用と免疫を高める作用が強い）は、再発・難治性の骨髄腫での効果と抗CD38抗体との相乗作用が示されていたが、標準治療との第3相の比較はなかった（抄録）。", "p3": "31か国211施設の非盲検・第3相のランダム化比較試験で、前治療が1〜2ラインの成人患者を、イベルドミド＋ダラツムマブ＋デキサメタゾンと、ダラツムマブ＋ボルテゾミブ＋デキサメタゾンに割り付けた（抄録）。", "p4": "主要評価項目は、MRD陰性の完全奏効（検査で検出できないほどがん細胞が減った状態）と無増悪生存期間の2つで、今回は最初の420人が12か月以上追跡された時点でのMRDの主要解析（抄録）。無増悪生存期間は800人の確認コホートで評価が続いている（抄録）。", "p5": "追跡期間の中央値15.7か月で、MRD陰性の完全奏効はイベルドミド群207人中85人（41%）、対照群213人中44人（21%）、差は20.1ポイント（95%信頼区間11.5〜28.6）、オッズ比は2.8だった（抄録）。グレード3〜4の有害事象はイベルドミド群92%、対照群70%で、好中球減少（84%対11%）と感染症（39%対22%）が多かった（抄録）。", "p6": "もう一つの主要評価項目である無増悪生存期間の結果はまだ出ておらず、MRD陰性の改善が生存の延長につながるかは確定していない（抄録）。非盲検で、製薬企業（Bristol Myers Squibb）の資金による試験（抄録）。解釈：好中球減少と感染症が大きく増えるため、効果と毒性の釣り合いは生存の結果を見て判断する必要がある。", "unverified": "本文を取得できず、サブグループ別の結果と、用量の異なる群の成績は未確認。"}}, {"field": "大気・気候科学", "headline": "成層圏の背景エアロゾルの約4割は植物由来", "title": "Persistent contribution of biogenic emissions to lower stratospheric aerosols via global monsoon convections", "url": "https://doi.org/10.1038/s41561-026-02115-w", "authors": "Kai Qie ほか", "venue": "Nature Geoscience", "date": "2026-09-25", "why": "成層圏エアロゾルの起源についての理解を改め、気候モデルの放射の見積もりに影響しうる。", "sjr": 6.141, "id": "tn03", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、出版社のページに載った抄録と要約文を使用", "preprint": false, "p1": "火山や山火事によらない成層圏の背景エアロゾルの約40%が、植物由来の二次有機エアロゾルで、南米・中部アフリカ・インドネシアからオーストラリア・南アジアのモンスーンの対流で運ばれていることを、航空機観測とモデルの統合で示した（抄録）。", "p2": "成層圏のエアロゾルは地球の放射と化学のバランスを乱すが、火山や山火事以外の背景エアロゾルの量・組成・起源はよく分かっていなかった（抄録）。", "p3": "9つの航空機観測キャンペーンのデータを、粒径ごとに扱う最新のエアロゾル気候モデル（sectional aerosol climate model）と統合し、全球の背景成層圏エアロゾルの収支と起源を推定した（抄録）。", "p4": "観測とモデルを統合して、起源ごとの割合と、対流圏から成層圏への流入量を推定し、過去二十年の平均の火山からの注入量と比べた（抄録）。", "p5": "植物由来の二次有機エアロゾルは、全球の年平均の背景成層圏エアロゾルの約40%を占めた（抄録）。対流圏から成層圏への植物由来の有機エアロゾルの流入量は年0.42〜0.72テラグラムで、火山エアロゾルの注入量の平均より5〜90%多かった（抄録）。", "p6": "抄録の範囲では、推定の不確かさがモデルのどの仮定に由来するか、観測の空白域の影響は分からない。解釈：火山との比較（5〜90%多い）は幅が大きく、推定の幅を含めて読む必要がある。", "unverified": "本文を取得できず、モデルの設定、各キャンペーンの観測範囲、推定の信頼区間は未確認。"}}, {"field": "構造生物学", "headline": "細胞の中で翻訳装置を直接見る：140の構造", "title": "Single-cell visual proteomics of a minimal bacterium reveals structural coordination of gene expression machineries", "url": "https://doi.org/10.1016/j.cell.2026.08.054", "authors": "Joseph M. Dobbs ほか", "venue": "Cell", "date": "2026-09-25", "why": "細胞の中の分子装置をそのまま高い解像度で見る「細胞内の構造生物学」の力を示し、遺伝子発現の調節の理解を進める。", "sjr": 24.592, "id": "tn04", "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、PubMedに登録された抄録を使用", "preprint": false, "p1": "遺伝子の数がごく少ない細菌（肺炎マイコプラズマ）の細胞をそのままクライオ電子線トモグラフィーで観察し、翻訳の開始・伸長・リサイクルの各段階を140の構造として再構成して、転写・翻訳・膜への結合をつなぐ超複合体の構造的な証拠を示した（抄録）。", "p2": "翻訳は遺伝子発現の中心だが、その調節は細胞の状態や細胞内の環境に左右され、転写や膜への移行とも連携している。それが生きた細胞の中でどう協調しているかは、直接には見られていなかった（抄録）。", "p3": "自然な状態と、抗生物質で翻訳を乱した状態の肺炎マイコプラズマ（Mycoplasma pneumoniae）の細胞を、クライオ電子線トモグラフィー（凍らせた細胞を多方向から撮影して3次元像を作る方法）で撮り、リボソームなどの構造を分類して140の構造マップを得た（抄録）。", "p4": "翻訳の段階ごとの構造、転写と翻訳の複合体、膜に結合したリボソームの大サブユニットを可視化し、これまでの仮説と照らし合わせた（抄録）。", "p5": "複数の転写-翻訳複合体を可視化し、mRNAを糸のように通して翻訳を再開始する仕組みを提案した（抄録）。長く仮説とされてきた、転写・翻訳・膜への結合を協調させる超複合体の構造的な証拠を示した（抄録）。膜に結合した大サブユニットが多く、膜から離れるのは新しい翻訳の開始しだいであることを示唆した（哺乳類の細胞でも保存されている可能性がある仕組み）（抄録）。", "p6": "抄録の範囲では、再開始の仕組みは構造にもとづく提案で、機能の面からどこまで確かめたかは分からない。解釈：遺伝子の極端に少ない特殊な細菌での観察なので、他の細菌や哺乳類への一般化は今後の検証が要る。", "unverified": "本文を取得できず、構造の分解能、抗生物質の種類、姉妹論文との関係は未確認。"}}, {"field": "遺伝学", "headline": "子どもの肥満に関わる624の遺伝的変異、3分の1は成人と別", "title": "Genome-wide mapping of common and rare variant effects on adiposity across childhood", "url": "https://doi.org/10.1038/s41588-026
