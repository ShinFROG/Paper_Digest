<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">

<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>

  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>

  </footer>
</div>

: "https://doi.org/10.2139/ssrn.7620685", "authors": "Eduardo Moraes Coraça ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Moraes Coraça, E., & Vaqueiro Ferreira, J. (2026). Unsupervised Stay Cable Monitoring via Embedding Distance-Based Health Indicators and Hidden Markov Models. https://doi.org/10.2139/ssrn.7620685", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "送電鉄塔の支線ケーブルの張力低下を、振動から作った連続的な健全度指標と隠れマルコフモデル（HMM）で、ラベルなしに段階として追跡する方法を示した（抄録）。", "p2": "支線式の鉄塔は張力をかけたケーブルで安定を保つが、ケーブル張力を非侵襲で監視するのは難しく、故障のラベルつきデータもほとんどない（抄録）。", "p3": "振動応答をウェーブレットパケット変換（WPT）で正規化エネルギーの特徴ベクトルにし、複数ケーブル用の損失関数を持つ変分自己符号化器（VAE）で潜在空間に写す。健全時の基準からの距離を健全度指標（HI）とし、HIの軌跡からHMMで離散的な劣化段階を推定する（抄録）。", "p4": "縮尺模型の支線式送電鉄塔で、ケーブル張力が長期にわたって連続的に低下する新しい実験データセットで検証した（抄録）。", "p5": "VAE由来のHIは張力の低下とともに滑らかに変化し、複数のケーブルにわたって汎化し、故障ラベルなしで重要な劣化状態を識別できたとする（抄録）。", "p6": "未査読のプレプリント。定量的な精度指標、実構造物（実寸の鉄塔）や環境変動（温度・風）下での検証の有無は抄録から確認できない。", "fun": "壊れた例を集めなくても、「元気なときからどれだけ離れたか」を測れば劣化の具合が分かる、という考え方です。その離れ具合の変化を、信号機の色のように何段階かの状態に区切って追うので、点検の判断に使いやすくなります。", "unverified": "HIと張力の対応の定量値、HMMの段階数は確認できていない。"}}, {"id": "pr03", "rank": 3, "headline": "アルゴリズム管理の決定の確定性と正当性の尺度", "title": "Who decides when algorithms manage? Development and validation of a measure of perceived decision finality and legitimacy", "url": "https://doi.org/10.2139/ssrn.7620615", "authors": "Huda Ali ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Ali, H., Basri, E., & Ali, A. (2026). Who decides when algorithms manage? Development and validation of a measure of perceived decision finality and legitimacy. https://doi.org/10.2139/ssrn.7620615", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "アルゴリズムが仕事を割り当て・評価するとき、その決定が「確定してしまう」と感じるか（決定の確定性）と、それを「適切」と判断するか（正当性）を測る尺度AFLSを開発・検証した（抄録）。", "p2": "既存のアルゴリズム管理（algorithmic management）の尺度は、システムの機能や管理の強さを測るが、働き手が決定をどう経験し、どう評価するかは測れていなかった（抄録）。", "p3": "先行研究、働き手への面接、専門家の審査から項目を作り、8項目版（AFLS-8）と6項目の短縮版（AFLS-6）を作成した。2因子構造、信頼性、測定不変性、他の構成概念との弁別を確かめた（抄録）。", "p4": "米国の働き手計1,178人の4研究で、最後は確認用の標本（N=338）。企業内・ハイブリッド・プラットフォーム型のシステム間の不変性も調べた（抄録）。", "p5": "2因子構造は安定し信頼性も良好で、短縮版は4標本間でおおむね不変だった（一部の切片の差あり）。確定性はスケジュール・監視・報酬のアルゴリズム化、仕事への影響力の低さ、人の見直しで決定が変わらないとの報告と最も強く関連した。正当性はシステムへの信頼と近いが区別され、どちらも知覚された管理とは別だった。確定性は同一性の脅威と、正当性は仕事の意味深さと関連した（抄録）。", "p6": "未査読のプレプリント。標本は米国の働き手に限られ、横断データのため予測的妥当性は抄録から確認できない。", "fun": "「AIが決めているか」と「AIが決めてよいと思えるか」は別の問いだ、という切り分けが面白い点です。同じシステムでも、決定を覆せないと感じると自分らしさが脅かされ、納得できると仕事に意味を感じる、という二つの道筋を分けて測れるようにしました。", "unverified": "各因子の信頼性係数と適合度指標の数値は確認できていない。"}}, {"id": "pr04", "rank": 4, "headline": "自己への思いやりは働く人の幸福を守るか", "title": "Buffer or Baseline? Trait Self-compassion and Employee Well-being Across Disruption, Telework, and Digital Demands in a National Probability Panel", "url": "https://doi.org/10.2139/ssrn.7622018", "authors": "Matthew Monnot", "venue": "SSRN", "date": "2026-10-17", "apa": "Monnot, M. (2026). Buffer or Baseline? Trait Self-compassion and Employee Well-being Across Disruption, Telework, and Digital Demands in a National Probability Panel. https://doi.org/10.2139/ssrn.7622018", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "自分への思いやり（self-compassion）が、働く人の幸福の「水準」を高めるのか、それとも負荷が来たときの「緩衝材」になるのかを、全国確率標本のパネルで区別して検証した（抄録）。", "p2": "資源保存理論（conservation of resources theory）は、自分への思いやりを個人の資源とみなし、幸福の水準を高め、負荷による喪失を和らげると予測するが、後者の緩衝効果は十分に確かめられていない（抄録）。", "p3": "ドイツのGESIS Panel.popで2018年に就業していた成人（N=3,052）について、(a)コロナ禍（2020〜2021年）の生活満足度の推移、(b)2021〜2025年の在宅勤務の割合と幸福の個人内関係の調整、(c)2024年のデジタル技術の評価を、区分的成長モデル、ランダム傾きの多水準モデル、多変量モデルで推定し、ベイズ因子と入れ子の交差検証を使った（抄録）。", "p4": "緩衝効果の有無をベイズ因子（帰無仮説を支持する度合いBF₀₁）で評価し、水準の関連は係数で示した（抄録）。", "p5": "生活満足度はコロナ禍で6.22点（0〜100点）下がったが、下がり方は自分への思いやりの水準で変わらなかった（BF₀₁=51.52）。在宅勤務の調整効果も支持されなかった（BF₀₁=12.28）。一方、特性は高い生活満足度、2024年の低い孤独感、デジタルへの圧倒感の低さと関連し、その関連は自己批判の逆転項目が担っていた（孤独感β=-.30、圧倒感β=-.21）（抄録）。", "p6": "未査読のプレプリント。著者は、1つの国の就業者パネルを超える一般化には追試が必要と述べている。", "fun": "「自分に優しい人は、つらいことがあっても落ち込みにくい」と思いがちですが、データでは落ち込み方は同じで、もともとの幸福度が高いだけでした。さらに効いていたのは「自分に優しくする」より「自分を責めない」ほうだった、という分解が面白い点です。", "unverified": "神経症傾向の統制の詳細と、在宅勤務の割合の測り方は確認できていない。"}}, {"id": "pr05", "rank": 5, "headline": "信用リスクの説明特徴に潜む時期効果をプラセボで検定", "title": "Explainable Machine Learning for Basel and IFRS 9 Credit Risk: A Placebo-Controlled Test of Narrative Features", "url": "https://doi.org/10.2139/ssrn.7622180", "authors": "Nawaz Muhammad", "venue": "SSRN", "date": "2026-10-17", "apa": "Muhammad, N. (2026). Explainable Machine Learning for Basel and IFRS 9 Credit Risk: A Placebo-Controlled Test of Narrative Features. https://doi.org/10.2139/ssrn.7622180", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "信用リスクのモデルに加えた「中央銀行声明の語調」のような特徴が、本当に情報を持つのか、単に貸出の時期を教えているだけなのかを見分けるプラセボ検定を提案した（抄録）。", "p2": "時間とともに変わる系列は、借り手について何も語らなくても貸出時期を示すため、精度を上げたり重要度で上位に来たりしうる。この時期効果と本物の情報を分ける、受け入れられた検定がなかった（抄録）。", "p3": "本物の特徴を、それをまねて作ったランダムな系列と比べ、貸出の期間を統制し、中央銀行声明ごとの水準で検定する。具体例：四半期の固定効果を入れても精度が上がるかどうかで、本物の語調情報かを判断する（抄録）。", "p4": "ECBとFOMCの声明を、Lending ClubとBondoraの50万件超の個人間融資に当てはめた（抄録）。", "p5": "期間の統制がないと、360のランダム系列すべてが通常の「精度が上がる」検査を通った。四半期の統制を入れると約1%しか通らなかった。期間を統制すると語調の効果は検出されなかったが、この試験的分析の検出力は限られるとする（抄録）。", "p6": "未査読のプレプリント。個人間融資のデータで、企業や中小企業の貸出の監督データへの適用は構想にとどまる（抄録）。", "fun": "でたらめな数字の列でも、時間とともに変わっていれば「いつの融資か」をこっそり教えてしまい、AIが賢くなったように見える、という落とし穴を暴いています。偽物の列を何百本も作って比べる「プラセボ」の発想は、薬の効き目を確かめる実験と同じです。", "unverified": "プラセボ系列の作り方の詳細と、検出力の計算は確認できていない。"}}, {"id": "pr06", "rank": 6, "headline": "資本規制の圧力で貸倒引当が抑えられる", "title": "Regulatory Capital Pressure and Credit-Loss Recognition: Evidence from the Basel III Phase-In", "url": "https://doi.org/10.2139/ssrn.7624691", "authors": "Abdullah Hasan ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Hasan, A., & Nasrinii, F. (2026). Regulatory Capital Pressure and Credit-Loss Recognition: Evidence from the Basel III Phase-In. https://doi.org/10.2139/ssrn.7624691", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "バーゼルIIIの資本保全バッファーの段階的導入で、自己資本の余裕が少ない銀行ほど貸倒引当を抑えることを示した（抄録）。", "p2": "規制資本の圧力が、銀行の信用損失の認識（引当の時期と強さ）にどう影響するかは、とくに新興国の銀行で十分に分かっていない（抄録）。", "p3": "バングラデシュの商業銀行の2010〜2019年のパネルで、改革前の資本の状況の差（事前に決まっている）と、資本保全バッファーの法定の段階的強化を掛け合わせ、差分の差分型で推定した（抄録）。", "p4": "不良債権に対する引当の比率、異常な引当、信用の質の悪化への反応、引当前利益と引当の関係を見た。頑健性は、圧力の別の測り方、処置の別の定義、推定期間、異なる傾向、偽の時期（プラセボ）で確かめた（抄録）。", "p5": "資本圧力の大きい銀行は、規制が厳しくなるにつれ不良債権に対する引当が有意に少なくなった。異常な引当も少なく、信用の質の悪化への引当の反応も弱かった。引当前利益と引当の正の関係も、圧力が強いほど弱まったとする（抄録）。", "p6": "未査読のプレプリント。1か国の銀行の分析で、効果の大きさの数値は抄録に示されていない。", "fun": "銀行が「将来の貸倒れへの備え」を積むと自己資本が減って見えるので、規制がきびしくなると備えを控えてしまう、という逆効果の可能性を示しています。安全にするための規制が、別の場所でリスクを見えにくくするという、ルール作りの難しさが分かります。", "unverified": "効果の大きさ（係数）と標本の銀行数は確認できていない。"}}, {"id": "pr07", "rank": 7, "headline": "VOF計算の寄生粘性力を抑え液架橋力を予測", "title": "Reducing Parasitic Viscous Forces in Volume-of-FluidSimulations", "url": "https://doi.org/10.2139/ssrn.7624436", "authors": "Kushal Manjunath", "venue": "SSRN", "date": "2026-10-17", "apa": "Manjunath, K. (2026). Reducing Parasitic Viscous Forces in Volume-of-FluidSimulations. https://doi.org/10.2139/ssrn.7624436", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "2つの球の間の液架橋を基準問題に、体積率法（Volume of Fluid, VoF）で不飽和の粒子にかかる力を精度よく求めるため、寄生流れによる粘性力を抑える表面張力モデルを比べた（抄録）。", "p2": "不飽和の粒子間の力の解析・半解析解は理想的な形に限られ、数値計算が必要だが、多相流の数値計算は離散化誤差による寄生流れ（parasitic currents）で精度が落ちる（抄録）。", "p3": "有限体積法に基づくVoF（FVM-VoF）を使い、標準的な連続体表面力モデル（CSF）に加え、体積率場を平滑化するSCSFと、界面を鋭くしつつ制御された平滑化を組み合わせるSSFを代数的VoFに組み込んだ。解析的な近似解と比べて検証した（抄録）。", "p4": "水-空気系の2球の液架橋で、解析近似解に対する定性的・定量的な一致を評価した（抄録）。", "p5": "標準のCSFは寄生流れのために大きな誤差を示した。SSFが水-空気系で最も良い予測を示し、寄生的な粘性力を抑えつつ液架橋の形を正確に表したとする（抄録）。", "p6": "未査読のプレプリント。著者は、最良の性能にはソルバーのパラメータ、格子解像度、時間離散化の慎重な調整が要ると述べている。誤差の数値は抄録にない。", "fun": "砂浜の砂が湿っていると固まるのは、粒と粒の間に水の橋ができて引っぱり合うからです。その小さな水の橋の力を計算するとき、計算の誤差で偽の流れが生まれてしまう問題を、表面張力の扱い方を変えて抑えようとしています。", "unverified": "各モデルの誤差の定量値は確認できていない。"}}, {"id": "pr08", "rank": 8, "headline": "エネルギー散逸率とモンテカルロで斜面の破壊確率", "title": "Reliability analysis of reservoir bank slopes via improved EDR-based slip surfaces search method, multigrid method and Monte Carlo simulation", "url": "https://doi.org/10.2139/ssrn.7624693", "authors": "Chengyao Wei ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Wei, C., Liu, Y., Zhuang, W., Yu, D., & Yang, Q. (2026). Reliability analysis of reservoir bank slopes via improved EDR-based slip surfaces search method, multigrid method and Monte Carlo simulation. https://doi.org/10.2139/ssrn.7624693", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "エネルギー散逸率（EDR）に基づくすべり面探索、多重格子法、モンテカルロ法を組み合わせ、すべり面の形を仮定せずに貯水池の岸斜面の破壊確率を出す枠組みを示した（抄録）。", "p2": "極限平衡法はすべり面の形を事前に決める必要があり、強度低減法はモンテカルロの標本ごとに反復計算が要るため、非線形FEMでの大規模な信頼性解析は重かった（抄録）。", "p3": "水の影響とエネルギー散逸を考える構成則で応力とEDRの場を求め、すべり面を探索し、多重格子法で安全率（FOS）を計算する。不確実なパラメータを確率的に与え、モンテカルロで多数の実現を作り、信頼性指標と破壊確率を得る。要点は応力計算とFOS評価を切り離すこと（抄録）。", "p4": "典型的な貯水池の岸斜面に適用し、変質の割合の地質調査データで要素に物性をランダムに割り当てた1,000の数値モデルを作り、計算変形を現場計測と比べた（抄録）。", "p5": "計算変形は現場計測と一致した。2つの潜在的なすべりブロックSd 1#とSd 2#を特定し、Sd 1#の平均FOSと信頼性指標はSd 2#よりかなり低かった。表層のゆるい構造が最も弱いことが現地観察と一致し、本例で8倍超の高速化を得たとする（抄録）。", "p6": "未査読のプレプリント。FOSと破壊確率の具体値、パラメータの確率分布の設定は抄録から確認できない。", "fun": "斜面のどこが崩れそうかを、あらかじめ「この線で滑る」と決めずに、力のエネルギーが失われやすい場所から自動で探すのが工夫です。土の性質のばらつきを千通り試して、崩れる確率として示すので、どこを優先して補強すべきかが見えます。", "unverified": "破壊確率の数値と、現場計測との一致の程度は確認できていない。"}}, {"id": "pr09", "rank": 9, "headline": "シェアサイクルで見るソウルの15分都市の類型", "title": "Rethinking POI Proximity in the 15-Minute City: Bikesharing-based Neighborhood Typologies in Seoul", "url": "https://doi.org/10.2139/ssrn.7621919", "authors": "Wookjae Yang ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Yang, W., & Hwang, J. (2026). Rethinking POI Proximity in the 15-Minute City: Bikesharing-based Neighborhood Typologies in Seoul. https://doi.org/10.2139/ssrn.7621919", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "ソウル都市圏のシェアサイクルの15分以内の移動記録から近隣の類型を作り、「15分都市」の短距離移動を決めるのは施設数より都市形態と交通網と地形だと示した（抄録）。", "p2": "15分都市（15-minute city）の評価は施設（POI）の数や圏域の到達性で行われることが多く、実際の短距離移動を形作る建物環境や社会人口的な条件にはあまり注意が払われてこなかった（抄録）。", "p3": "15分以内のシェアサイクルの移動記録に、細かい建物環境、交通インフラ、社会人口の共変量を結び、K-means法でクラスタを作り、補完的な説明モデルで所属の要因を調べる2段階の枠組み（抄録）。", "p4": "クラスタの所属を説明する主要な予測変数を比べた（抄録）。", "p5": "4つのクラスタ（公共交通指向の都心、平坦な都心、公共交通の乏しい周縁住宅地、低密度の郊外縁辺）が得られた。所属を主に決めたのは街路網の連結性、多様な公共交通の到達性、容積率、勾配で、POIの密度や多様性は主要な予測変数にならなかったとする（抄録）。", "p6": "未査読のプレプリント。シェアサイクル利用者は住民全体を代表しない可能性があり、効果の大きさは抄録に示されていない。", "fun": "「近くにお店がたくさんあれば歩いて暮らせる街」と考えがちですが、実際の自転車の動きを見ると、お店の数より坂の多さや道のつながり方のほうが効いていた、という結果です。地図の上の便利さと実際の移動のずれが見えてきます。", "unverified": "各要因の重要度の数値と移動記録の件数は確認できていない。"}}, {"id": "pr10", "rank": 10, "headline": "LLMの金融助言、利用者の開示で推奨が変わる", "title": "Aligned to Protect, Misaligned to Advise: Financial Advice from LLMs", "url": "https://doi.org/10.2139/ssrn.7621183", "authors": "Saurabh Bhargava", "venue": "SSRN", "date": "2026-10-16", "apa": "Bhargava, S. (2026). Aligned to Protect, Misaligned to Advise: Financial Advice from LLMs. https://doi.org/10.2139/ssrn.7621183", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "LLMの金融助言は、中立な条件では人より良いが、利用者が不安や持病を打ち明けると「守り」に偏って損な選択を勧めることを、大規模な実験で示した（抄録）。", "p2": "LLMは家計の金融判断を大規模に改善しうるが、整合化訓練（alignment training）が自然な場面での助言をどう形作るかは分かっていなかった（抄録）。", "p3": "健康保険のプラン選びと退職資産の配分という、厚生の基準がはっきりした領域で、12の実験計画・112,263回のモデル評価を行い、従業員15,717人の保険選択の行政データ、人が参加する退職助言実験、25,950件のモデルの説明文、Reddit投稿1,000件で補った（抄録）。", "p4": "保険では「劣位（他のプランに必ず負ける）プラン」を勧める割合、退職では業界のターゲットデート基準への近さを指標にした（抄録）。", "p5": "中立条件でモデルは劣位プランを17.5%で勧め、従業員の選択の63.3%より良かった。しかし低いリスク許容度、慢性疾患、不安を伝えると劣位プランや保守的すぎる配分へ移り、優位の多くが失われ、超過保険費用は低所得世帯に逆進的にかかった。経済最適化として課題を示す短い指示で劣位の推奨はほぼ消えたとする（抄録）。", "p6": "未査読のプレプリント。どのモデルを評価したかや、モデル間の差は抄録から確認できない。", "fun": "AIは「心配です」と言われると、親切心から安心できそうな選択を勧めますが、それがかえって損になることがある、という結果です。優しさと正しさがぶつかる場面で、一言「お金の面で一番得な案を」と指示するだけで直る、という手軽さも驚きです。", "unverified": "評価したモデルの種類と、各条件での劣位推奨率の内訳は確認できていない。"}}, {"id": "pr11", "rank": 11, "headline": "デジタル化は看護師の負担を減らすか増やすか", "title": "More Technology, More Relief? Developing a Multi-Dimensional Burden and Relief Framework from Nurses’ Perspectives on Digitalisation: A Qualitative Study (Preprint)", "url": "https://doi.org/10.2196/preprints.114457", "authors": "Katharina Steinhauer ほか", "venue": "JMIR Preprints", "date": "2026-10-17", "apa": "Steinhauer, K., Todisco, L., & Harberger, B. (2026). More Technology, More Relief? Developing a Multi-Dimensional Burden and Relief Framework from Nurses’ Perspectives on Digitalisation: A Qualitative Study (Preprint). https://doi.org/10.2196/preprints.114457", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの抄録を使用。本文は入手できず", "preprint": true, "p1": "病院のデジタル化が看護師の負担を減らすのか増やすのかを、仕事の要求度-資源（JD-R）モデルに基づく多次元の負担・軽減の枠組みとして整理した（抄録）。", "p2": "デジタル化は看護の負担を減らすとされるが、実証的には新しい負担も生むことが示唆され、看護師の視点からの体系的・多次元の検討がなかった（抄録）。", "p3": "ドイツの大学病院で、デジタル試行病棟と比較の外傷外科の2病棟の看護師8人に、2025年7〜8月に半構造化面接を行い、Kuckartzの構造化質的内容分析で分析した。2人が独立にコード化し、合意で精緻化した（抄録）。", "p4": "COREQのチェックリストに沿って報告した。カテゴリとコード化された区分の数、次元の構成で結果を示した（抄録）。", "p5": "15カテゴリ・246区分を、時間（二重の記録、媒体の断絶）、認知（システムの複雑さ、統合の断片化）、身体（歩行距離、持ち上げ）、感情（患者と過ごす時間の喪失、職業的同一性の揺らぎ）、組織（研修不足、参加不足）の5つの負担の次元にまとめ、それぞれに軽減の可能性を対応させた。評価の基準は一貫して「患者のための時間が増えるか減るか」だったとする（抄録）。", "p6": "未査読のプレプリント。8人・1病院の探索的研究で、著者はさまざまなケアの場での量的な検証が必要としている。", "fun": "新しい機械を入れて楽になる部分がある一方で、紙と画面に二重に記録するなど新しい手間も生まれる、というのは多くの職場に心当たりがあるはずです。看護師がそれを判断する物差しが「患者さんのそばにいられる時間」だけだった、という点が印象的です。", "unverified": "なし"}}, {"id": "pr12", "rank": 12, "headline": "AIが支える刑事政策の熟議、その民主的条件", "title": "Artificial Intelligence and Public Crime Deliberation – Democratic Conditions", "url": "https://doi.org/10.2139/ssrn.7619524", "authors": "Thomas McNeil", "venue": "SSRN", "date": "2026-10-17", "apa": "McNeil, T. (2026). Artificial Intelligence and Public Crime Deliberation – Democratic Conditions. https://doi.org/10.2139/ssrn.7619524", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "刑事司法の分野で、AIを使った市民の熟議が正当・合法・効果的であるための条件を整理し、AIを使う民主的なシステムを評価する枠組みを示した（抄録）。", "p2": "刑罰をめぐる世論は厳罰に傾きやすく、誤情報の時代に意見の分極化も進む。AIは民主的な参加を高めうるとされるが、その条件は整理されていなかった（抄録）。", "p3": "犯罪学の厳罰的な世論の研究、分極化と誤情報の研究、熟議民主主義の理論、AIによる市民参加の新しい研究を統合する概念的な論考（抄録）。", "p4": "未確認（概念的な論考で、実証的な検証は抄録に記載がない）", "p5": "条件として、経験的な根拠、技術の健全性、制度の説明責任・ガバナンス・正当性、市民の信頼の4つを挙げ、刑事司法はAIが支える民主的革新を発展させる重要な領域だと結論づけたとする（抄録）。", "p6": "未査読のプレプリント。枠組みを実際のAI熟議システムに当てはめた評価は抄録にない。", "fun": "犯罪や刑罰の話題は感情的になりやすく、冷静な話し合いが難しい分野です。そこでAIに情報整理や議論の手助けをさせるなら、どんな条件がそろえば「信頼できる話し合い」と言えるのか、という問いそのものが重要です。", "unverified": "概念的な論考で、各条件の具体的な評価指標は確認できていない。"}}, {"id": "pr13", "rank": 13, "headline": "顧客情報の独占販売は混合戦略で覆る", "title": "Selling Customer Information to Competing Firms: Is Exclusivity Sensitive to Mixed Strategies?", "url": "https://doi.org/10.2139/ssrn.7619581", "authors": "Iñaki Aguirre", "venue": "SSRN", "date": "2026-10-17", "apa": "Aguirre, I. (2026). Selling Customer Information to Competing Firms: Is Exclusivity Sensitive to Mixed Strategies? https://doi.org/10.2139/ssrn.7619581", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "データ仲介業者は顧客情報を1社だけに独占販売するのが最適、という先行研究の結論が、価格競争の解き方（混合戦略）によって覆ることを示した（抄録）。", "p2": "Clavorà BraulinとValletti（2016）は、垂直的に差別化された2つの小売業者への情報販売で独占販売が常に最適だと示したが、その結果は一方だけが価格差別できる非対称な部分ゲームをシュタッケルベルク型で解くことに依っていた（抄録）。", "p3": "同じ部分ゲームを、同時の価格競争の下での混合戦略で解き直した。背景：混合戦略は、各企業が価格を確率的に選ぶ均衡で、純粋戦略の均衡がないときに現れる（抄録）。", "p4": "元のモデルの対称な領域と、パラメータ空間全体での仲介業者の料金を比べた（抄録）。", "p5": "対称な領域では、許されるすべてのパラメータで両社への販売の料金が独占販売を厳密に上回った。独占の領域は一つの普遍定数で決まり、費用-品質比Δc/Δqが許容範囲の中央37.8%にあるとき両社に売り、その外では独占が最適だとする（抄録）。", "p6": "未査読のプレプリント。理論の結果で、実証的な検証はない（抄録の範囲）。", "fun": "「情報は1社だけに売るほうが高く売れる」という答えが、相手の値段の決め方の想定を変えるだけでひっくり返る、という結果です。理論の結論が、目立たない仮定にどれだけ左右されるかを示す、数理モデルらしい面白さがあります。", "unverified": "定数の導出と37.8%の算出過程は確認できていない。"}}, {"id": "pr14", "rank": 14, "headline": "履歴を記憶するRNNでコンクリートの損傷を再現", "title": "Physics-guided recurrent damage-aware constitutive modeling of concrete under pavement-relevant loading paths", "url": "https://doi.org/10.2139/ssrn.7624443", "authors": "Hellen Garita-Durán ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Garita-Durán, H., & Kaliske, M. (2026). Physics-guided recurrent damage-aware constitutive modeling of concrete under pavement-relevant loading paths. https://doi.org/10.2139/ssrn.7624443", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "舗装を想定した荷重履歴の下でのコンクリートの応力・塑性ひずみ・引張と圧縮の損傷を、履歴を記憶する再帰型ニューラルネットで予測し、有限要素法の増分計算にそのまま組み込める代理構成則を作った（抄録）。", "p2": "多軸・繰返し荷重でのコンクリートの応答は履歴に依存し、材料の状態を保持しつつ増分の数値解析と両立する構成則が必要だった（抄録）。", "p3": "再帰的な記憶、ひずみ由来の力学特徴、静的な材料記述子、狙いを定めた整合性の制約を組み合わせた。参照はコンクリート損傷塑性モデルで生成した2次元の荷重履歴（一軸・二軸・混合・非比例・繰返し）。FE計算では確定済みと試行の履歴状態を分け、自動微分で接線剛性を得る（抄録）。", "p4": "検証用の軌跡でピーク応力の誤差、応力ゼロ・損傷不活性・許容性・損傷の単調性の条件、接線の有限差分との一致、ニュートン法の収束、荷重増分への依存を調べた（抄録）。", "p5": "すべての荷重族でピーク応力誤差の中央値は0.5MPa未満で、物理的な条件もほぼ満たされた。自動微分の接線は有限差分とよく一致し、一部の荷重段階で2次収束を回復し、増分を細かくすると圧縮損傷の誤差が減ったとする（抄録）。", "p6": "未査読のプレプリント。学習と検証は参照モデルが生成したデータで、実験データでの検証は抄録から確認できない。", "fun": "コンクリートは一度ひびが入ると、その後の押され方に対する反応が変わります。この「過去を覚えている材料」をAIに学ばせるだけでなく、構造計算のプログラムにそのまま差し込めるよう、計算の約束事（状態の管理と収束）まで守らせているのが工夫です。", "unverified": "引張損傷の誤差の数値と、実験との比較の有無は確認できていない。"}}, {"id": "pr15", "rank": 15, "headline": "一段先平滑化で改良した拡張・無香料カルマン", "title": "Modified Extended and Unscented Kalman Filters via One-Step-Ahead Smoothing for Orbit Determination", "url": "https://doi.org/10.2139/ssrn.7624239", "authors": "Hanyu Liu ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Liu, H., Zhu, Y., Wang, X., Gui, H., & Chen, H. (2026). Modified Extended and Unscented Kalman Filters via One-Step-Ahead Smoothing for Orbit Determination. https://doi.org/10.2139/ssrn.7624239", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "観測の間隔が長く非線形性が強い軌道決定で、拡張カルマンフィルタ（EKF）と無香料カルマンフィルタ（UKF）を「一段先平滑化（OSAS）」で改良し、推定誤差を大きく減らした（抄録）。", "p2": "EKFは解析的、UKFは統計的な線形化で非線形性を扱うが、見える弧の間隔が長いと非線形性が蓄積し、線形化が効かず大きな誤差を生む（抄録）。", "p3": "従来の「予測してから更新する」構造を、「一段先平滑化してから予測する」構造に組み替えた。平滑化で現在の観測を取り込んだ線形化点を得るため、線形化による誤差が減る（EKF-OSAS、UKF-OSAS）。解釈：線形化する場所を、観測を見た後のより正しい位置に移す工夫といえる（抄録）。", "p4": "合成の軌道決定シナリオと実際の軌道決定シナリオで、位置推定誤差を従来のEKF・UKFと比べた（抄録）。", "p5": "2つ目の可視弧以降の位置推定誤差を、合成の例で94%超、実際の例で61%超減らしたとする（抄録）。", "p6": "未査読のプレプリント。計算コストの増加や、他の改良フィルタ（反復EKFなど）との比較は抄録から確認できない。", "fun": "曲がった道を直線で近似して進むとき、どこで近似するかで大きくずれます。この研究は、次の観測を少し先取りして「近似する場所」を正しい位置に寄せることで、宇宙の物体の位置の推定を大幅に良くしています。地上の振動の推定にも使える考え方です。", "unverified": "計算時間の比較と、他の改良フィルタとの比較は確認できていない。"}}, {"id": "pr16", "rank": 16, "headline": "少ないデータで非定常流れの縮約モデルを作る", "title": "UGAL: A Data-Efficient and Reliable Method for Unsteady Reduced-Order Modeling", "url": "https://doi.org/10.2139/ssrn.7624217", "authors": "Xu Wang ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Wang, X., Yang, X., & Tang, H. (2026). UGAL: A Data-Efficient and Reliable Method for Unsteady Reduced-Order Modeling. https://doi.org/10.2139/ssrn.7624217", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "非定常の空力を予測する縮約モデル（reduced-order model, ROM）を、少ない学習データで作る能動学習法UGALを提案した（抄録）。", "p3": "LSTMのアンサンブルで候補標本の予測の不確実性を見積もり、不確実性が大きい標本を順に選んで学習に加える。テスト集合を候補として扱い、オフライン学習とオンライン予測の差を埋める（抄録）。", "p5": "ピッチングするNACA64A010翼とDLR-F6機体で、ラテン超方格法に比べ同じ標本数で平均誤差を62.6%以上下げ、同じ誤差水準に必要なデータを25%以上減らしたとする（抄録）。", "fun": "高価な流体シミュレーションを何回も回せないとき、「どの条件を次に計算すれば一番学べるか」をAI自身に選ばせるのが要点です。テスト前に苦手な問題から復習するのと似た発想で、計算の回数を減らしても精度を保てるかを確かめています。", "unverified": "未査読のプレプリント。誤差の定義や比較条件の詳細は本文で確認できていない。"}}, {"id": "pr17", "rank": 17, "headline": "学習補正と古典解法を同じ精度で比べると", "title": "Learned corrections and a second-order sensitivity model for subsonic full-potential flow: a matched-accuracy comparison", "url": "https://doi.org/10.2139/ssrn.7624238", "authors": "Doyeol Ahn", "venue": "SSRN", "date": "2026-10-17", "apa": "Ahn, D. (2026). Learned corrections and a second-order sensitivity model for subsonic full-potential flow: a matched-accuracy comparison. https://doi.org/10.2139/ssrn.7624238", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "亜音速の全ポテンシャル流れで、学習による補正と古典的な解法・縮約モデルを「同じ精度」で比べる評価をした（抄録）。", "p3": "壁上の小さな突起まわりの流れを対象に、製造解による検証と3段階の格子比較で参照解を作り、評価前に合否規則を固定した。形状係数の2次式で表す縮約モデル（ROM）を感度方程式から作り、学習補正と比べた（抄録）。", "p5": "マッハ0.75の23条件で、学習モデル4つの補正誤差は150〜347%と補正なしの100%を上回ったのに対し、ROMは7.4%だった。ROMは同じ目標を満たす古典解法より48〜50倍速いとする（抄録）。", "fun": "「AIは従来の計算より速い」という主張は、精度をそろえずに比べていることが多い、という指摘から出発しています。かけっこで片方だけゴールを手前にしたら公平ではないのと同じです。精度をそろえると、学習モデルが補正しない場合より悪くなることもあったのが意外な点です。", "unverified": "未査読のプレプリント。結果は論文が示す形状族と有限領域に限られ、衝撃波を含む遷音速流には及ばないと著者が述べている。"}}, {"id": "pr18", "rank": 18, "headline": "ハイブリッド勤務の経験から仕事への没頭を予測", "title": "Predicting Work Engagement from Hybrid Work Experiences: A Human-Centered Machine Learning Study with an Exploratory Psychological Well-being Analysis - Evidence from India", "url": "https://doi.org/10.2139/ssrn.7620600", "authors": "Arulnandhisivam Shanmuganandham ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Shanmuganandham, A., Chidambaram, V., & Dubey, A. K. (2026). Predicting Work Engagement from Hybrid Work Experiences: A Human-Centered Machine Learning Study with an Exploratory Psychological Well-being Analysis - Evidence from India. https://doi.org/10.2139/ssrn.7620600", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "ハイブリッド勤務の資源（支援や道具などの働く条件）が、仕事への没頭（work engagement）を予測するかを機械学習で検証した（抄録）。", "p3": "インドのIT従業員200人の調査で、Elastic Netを入れ子の5分割交差検証（20回反復）で評価し、Ridge、Lasso、ランダムフォレスト、XGBoostなどと比べた（抄録）。", "p5": "属性に勤務資源を加えると、没頭の検証用R²の平均が0.323上がり、Elastic NetのR²は0.376だった。心理的well-being合成指標は内的一貫性が低く（α=-.404）、探索的な扱いにとどめるとする（抄録）。", "fun": "テレワークの「やる気」を、職場の仕組みからどこまで予測できるかを、訓練に使っていない人のデータで確かめています。予測が当たるかを本番さながらに試す点は、テスト勉強で解いたことのない問題で実力を測るのに似ています。", "unverified": "未査読のプレプリント。標本は200人で1か国のIT従業員に限られる。"}}, {"id": "pr19", "rank": 19, "headline": "AI利用と退職：所得機会と職業離脱のリスク", "title": "AI Adoption and Retirement: Income Opportunities and Career-Exit Risk", "url": "https://doi.org/10.2139/ssrn.7618578", "authors": "Myung Jun Kim ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Kim, M. J., & Lim, B. H. (2026). AI Adoption and Retirement: Income Opportunities and Career-Exit Risk. https://doi.org/10.2139/ssrn.7618578", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "自分でAIを使うかどうかと、職業全体がAIにさらされることを分けて、退職計画への影響をモデル化した（抄録）。", "p3": "本人のAI利用は所得と所得のリスクを変え、職業単位の曝露は職業から永久に離れるリスクを高めるとし、資産に支えられた退職と見通しの悪化による離職を区別する理論モデルを立てた（抄録）。", "p5": "例示の計算では、不利な離職リスクが自発的な退職の基準を下げうること、退職の柔軟性がAI利用と資産配分を変えることを示した。早い退職が備えの良さを意味するとは限らないとする（抄録）。", "fun": "AIを「使う側」になることと、自分の仕事がAIに「置き換えられやすい側」にいることは別の話だ、という切り分けが面白い点です。早めに引退した人が、余裕があったのか、仕事を続けられなくなったのかは外から見ると同じに見える、という問題を扱っています。", "unverified": "未査読のプレプリント。数値は例示の計算で、実データでの推定はない（抄録の範囲）。"}}, {"id": "pr20", "rank": 20, "headline": "最前線従業員のブリコラージュの要因と成果", "title": "A Sensemaking Perspective On The Drivers, Boundary Conditions, And Outcomes Of Frontline Employee Bricolage", "url": "https://doi.org/10.2139/ssrn.7620879", "authors": "Omar S Itani", "venue": "SSRN", "date": "2026-10-16", "apa": "Itani, O. S. (2026). A Sensemaking Perspective On The Drivers, Boundary Conditions, And Outcomes Of Frontline Employee Bricolage. https://doi.org/10.2139/ssrn.7620879", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "最前線の従業員が手元の資源でやりくりする工夫（bricolage）の要因と成果を、センスメイキング理論で調べた（抄録）。", "p3": "B2Bの最前線従業員115人の調査、12人への質的調査、210人の実験を組み合わせた混合研究法を用いた（抄録）。", "p5": "デジタル技術の取り込みがブリコラージュを高め、その関係は上司の知的刺激で強まった。ブリコラージュは適応的な営業と職務成績を高めたとする（抄録）。", "fun": "「ブリコラージュ」は、ありあわせの材料で何とかする工夫を指す言葉です。資源が足りない現場で人がどう工夫するかを、調査・聞き取り・実験の3つの方法で確かめているのが特徴で、上司の関わり方で工夫の出方が変わる点も示しています。", "unverified": "未査読のプレプリント。効果の大きさは抄録に示されていない。"}}, {"id": "pr21", "rank": 21, "headline": "SNS活用が営業の先回り型サービスを高める", "title": "Leveraging Social Media For Proactive Service Performance: Exploring The Moderating Role Of Digital Selling Environment And Salesperson Bricolage", "url": "https://doi.org/10.2139/ssrn.7620800", "authors": "Omar S Itani", "venue": "SSRN", "date": "2026-10-16", "apa": "Itani, O. S. (2026). Leveraging Social Media For Proactive Service Performance: Exploring The Moderating Role Of Digital Selling Environment And Salesperson Bricolage. https://doi.org/10.2139/ssrn.7620800", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "営業担当者のSNS活用が、顧客に先回りするサービス（proactive service performance）を高めるかを調べた（抄録）。", "p3": "仕事の要求度-資源（job demands-resources）理論に基づき、SNSの取り込み、デジタル営業環境の調整効果、営業担当者のブリコラージュの役割を検証した（抄録）。", "p5": "SNSの取り込みは先回り型サービスと正に関連し、デジタル営業環境がこの関係を強め、ブリコラージュがその交互作用をさらに強めたとする（抄録）。", "fun": "営業の人がSNSを使うと、顧客から言われる前に動けるようになるのか、という身近な問いです。会社の環境と本人の工夫の力が重なると効果が大きくなる、という「掛け算」の関係を示しているのがポイントです。", "unverified": "未査読のプレプリント。標本の規模や国、効果の大きさは抄録に記載がない。"}}, {"id": "pr22", "rank": 22, "headline": "仏法を社会関係資本とする広場の共同管理", "title": "Dhamma as Social Capital: A Buddhist-Integrated Model for Managing Creative Cultural Space in Nan Province, Thailand", "url": "https://doi.org/10.2139/ssrn.7620598", "authors": "Sawangjit Khantee", "venue": "SSRN", "date": "2026-10-16", "apa": "Khantee, S. (2026). Dhamma as Social Capital: A Buddhist-Integrated Model for Managing Creative Cultural Space in Nan Province, Thailand. https://doi.org/10.2139/ssrn.7620598", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "タイ・ナーン県の中央広場の運営で、上座部仏教の教えが「生きた社会関係資本」として働く様子を示した（抄録）。", "p3": "説明的順次型の混合研究法で、調査（n=401）、関係者16人への面接、12週間の参与観察を組み合わせた（抄録）。", "p5": "仏教の教えがごみ管理、市場と寺院の共存、関係者の協力など日々の空間管理を形作っていた。6つの文化活動を実施し、仏教を統合した創造空間管理モデル（BICSM）を提案した（抄録）。", "fun": "宗教の遺産を観光資源として「眺める物」ではなく、人々の日々の協力を支える「働く仕組み」として見直しているのが面白い点です。ごみの片付けや店と寺の折り合いといった身近な場面に、教えがどう効いているかを調べています。", "unverified": "未査読のプレプリント。モデルの効果を比較対照で検証したかは抄録から確認できない。"}}, {"id": "pr23", "rank": 23, "headline": "越境ECの中小企業で外部AIが変えた仕事と支払い", "title": "External AI Use in Chinese Cross-border E-commerce SMEs Work and Payment Changes in Six Retrospective Merchant Accounts", "url": "https://doi.org/10.2139/ssrn.7618842", "authors": "Yu Tang", "venue": "SSRN", "date": "2026-10-17", "apa": "Tang, Y. (2026). External AI Use in Chinese Cross-border E-commerce SMEs Work and Payment Changes in Six Retrospective Merchant Accounts. https://doi.org/10.2139/ssrn.7618842", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "中国の越境EC中小企業6社で、外部のAIツール利用が仕事と外注費をどう変えたかを聞き取りで記述した探索的研究（抄録）。", "p3": "経営者5人と運営担当1人への会話から、2025〜2026年の制作準備・サービス調整・調査・ソフト開発の変化を整理した（抄録）。", "p5": "3社が翻訳・撮影・制作の外注支払いを減らしたが基本給は変えなかった。1社はAIで作った在庫管理を導入してERPへの支払いをやめた。数字は記憶に基づく概算で、記録との照合はしていないとする（抄録）。", "fun": "AIで仕事が減るのは社内の従業員よりも、まず外注していた翻訳や写真撮影の仕事かもしれない、という観察が興味深い点です。一方でAIがうまく動かず人手の方が速いと使うのをやめた例もあり、導入の実態の凸凹が見えます。", "unverified": "未査読のプレプリント。6社の聞き取りで、因果効果や純収益は推定していないと著者が明記。"}}, {"id": "pr24", "rank": 24, "headline": "IFRS16・ASC842導入後の実証研究の系統的整理", "title": "A Systematic Literature Review of Research on IFRS 16 and ASC 842: A Synthesis of Post-Adoption Evidence", "url": "https://doi.org/10.2139/ssrn.7616761", "authors": "Juliane-Rebecca Upmeier ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Upmeier, J.-R., & Wulf, I. (2026). A Systematic Literature Review of Research on IFRS 16 and ASC 842: A Synthesis of Post-Adoption Evidence. https://doi.org/10.2139/ssrn.7616761", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "リース資産・負債を貸借対照表に載せるIFRS16とASC842の導入後の実証研究を、系統的に整理した（抄録）。", "p3": "2019〜2025年に出版された査読つき研究64本を、5つの研究の流れに分けて分析した（抄録）。", "p5": "リースの計上は透明性と比較可能性を高めたが、財務・経済的な帰結は国と業種によって異なった。資本市場は注記より計上された情報を重視し、契約を作り直す経営者もいたとする（抄録）。", "fun": "同じ情報でも、表の中に載せるか脚注に書くかで投資家の受け止め方が変わる、という会計の不思議を扱っています。ルールが変わると経営者が契約の形そのものを変えてしまう、という「ルールへの反応」も見どころです。", "unverified": "未査読のプレプリント（抄録には査読つきの総説とある）。個別研究の効果の大きさは確認できていない。"}}, {"id": "pr25", "rank": 25, "headline": "宗教は非公式ガバナンスとして企業リスクを下げるか", "title": "Religion as Informal Governance: Firm Risk around the SOX-Era Reforms", "url": "https://doi.org/10.2139/ssrn.7624582", "authors": "Edward J Kim", "venue": "SSRN", "date": "2026-10-17", "apa": "Kim, E. J. (2026). Religion as Informal Governance: Firm Risk around the SOX-Era Reforms. https://doi.org/10.2139/ssrn.7624582", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "地域の宗教文化が企業の非公式なガバナンスとして働き、企業固有のリスクを下げるかを検証した（抄録）。", "p3": "本社所在郡の宗教性と、その後の企業固有リスクの関係を推定し、SOX法などの改革前後や、独立取締役の導入、より宗教的な郡への移転で比較した（抄録）。", "p5": "郡の宗教性が1標準偏差高いと年率ボラティリティが0.96ポイント低かった。この関係はSOX法後に大きく弱まり、基本の推定では0と区別できなくなったとする（抄録）。", "fun": "会社の周りの地域の空気が、経営者の無茶を抑えるブレーキになるか、という問いです。法律という正式なブレーキが強化されると地域の効き目が消える、つまり二つのブレーキが互いの代わりになっている、という見方が面白い点です。", "unverified": "未査読のプレプリント。宗教性の測り方と識別の詳細は本文で確認できていない。"}}, {"id": "pr26", "rank": 26, "headline": "高規格道路は県の炭素吸収を減らすか", "title": "High-grade roads and county carbon sinks: grade-decomposed infrastructure effects in China", "url": "https://doi.org/10.2139/ssrn.7620644", "authors": "Haotian WU ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "WU, H., ZHU, Y., GU, Z., & ZHANG, Z. (2026). High-grade roads and county carbon sinks: grade-decomposed infrastructure effects in China. https://doi.org/10.2139/ssrn.7620644", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "道路が沿道の生態系に与える害が、県（county）全体の炭素吸収にまで積み上がるかを道路の等級別に調べた（抄録）。", "p3": "中国の2,660県の2014〜2024年のパネルで、道路密度を等級に分けて正味の生態系生産量（NEP）との関係を推定し、画素単位の沿道の分布も見た（抄録）。", "p5": "県の道路密度はNEPと正に関連し、それは高規格道路に集中していた（H=+0.1364、p<0.001）。沿道0.5〜2kmではどの等級でもNEPが低かったが、県の集計では薄まったとする（抄録）。", "fun": "道路のすぐ脇では植物が弱るのに、県全体で見ると道路が多いほど炭素吸収が大きい、という一見矛盾した結果が興味深い点です。見る範囲（画素か県か）を変えると答えが変わる、という集計の尺度の問題がよく分かります。", "unverified": "未査読のプレプリント。正の関連の因果的な解釈は抄録からは確認できない。"}}, {"id": "pr27", "rank": 27, "headline": "連鎖するダム群の多段階破壊リスクを確率推論", "title": "Multistage Failure Risk in Cascade Reservoir Systems: Probabilistic Inference with Inter-Reservoir Dependency", "url": "https://doi.org/10.2139/ssrn.7625165", "authors": "Rui Zhang ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Zhang, R., Wang, B., & Guan, X. (2026). Multistage Failure Risk in Cascade Reservoir Systems: Probabilistic Inference with Inter-Reservoir Dependency. https://doi.org/10.2139/ssrn.7625165", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "上流ダムの決壊が下流を巻き込む連鎖を含めて、連なる貯水池群の多段階の破壊リスクを確率的に評価する方法を示した（抄録）。", "p3": "各ダム固有の越流リスクと、上流の破壊による経路を定式化し、累積的な系全体への影響を評価した。大渡河上流の連鎖貯水池で適用した（抄録）。", "p5": "貯水容量の差がリスクの伝わり方と減衰を左右し、容量の大きい多年調節池では連鎖が緩和される一方、流れ込み式では破壊確率がしばしば許容値を超えた。初期水位としきい値の変動が影響最大だったとする（抄録）。", "fun": "ドミノ倒しのように、上のダムが壊れると下のダムも危なくなる、その連鎖を確率で数えるのが要点です。大きなダムは「緩衝材」になって連鎖を止めるが、小さなダムは逆に連鎖を速める、という役割の違いが見えてきます。", "unverified": "未査読のプレプリント。確率の具体的な値は抄録に示されていない。"}}, {"id": "pr28", "rank": 28, "headline": "ひずみ速度と累積損傷を結ぶ岩石の動的構成則", "title": "A Dynamic Constitutive Model for Rock Materials Considering the Coupling of Strain-Rate Effects and Cumulative Damage Evolution", "url": "https://doi.org/10.2139/ssrn.7624530", "authors": "Yao Yang ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Yang, Y., Mo, R., Jiang, Q., Liu, C., Chen, P., Shi, Y., & Yao, C. (2026). A Dynamic Constitutive Model for Rock Materials Considering the Coupling of Strain-Rate Effects and Cumulative Damage Evolution. https://doi.org/10.2139/ssrn.7624530", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "地震時の岩石で、ひずみ速度による強度の上昇と累積損傷による劣化を一つの枠組みで表す動的構成則を作った（抄録）。", "p3": "古典的な弾塑性理論の中で、ひずみ速度と累積損傷が弾性係数と粘着力に与える影響を組み込み、動的損傷の発展式と破壊度指標を導入し、C++の利用者定義構成則として実装した（抄録）。", "p5": "異なるひずみ速度の動的三軸圧縮や繰返し載荷の数値試験で、強度上昇・履歴・残留変形の蓄積・漸進的劣化を再現し、錦屏第二水力発電所の地下発電所の地震応答に適用したとする（抄録）。", "fun": "岩は速く押すほど強く感じられる一方、揺さぶられるたびに少しずつ傷んでいきます。この「速さで強くなる」と「疲れて弱くなる」という逆向きの性質を一つの式で同時に扱うのが、この研究の難しいところです。", "unverified": "未査読のプレプリント。理論解との一致の程度を示す数値は抄録にない。"}}, {"id": "pr29", "rank": 29, "headline": "LLMの解釈用デジタルツインで介入効果を予測", "title": "TwinLens: an interpretability digital twin for LLMs", "url": "https://doi.org/10.5281/zenodo.23437557", "authors": "Dimakopoulos, Spilios", "venue": "Zenodo", "date": "2026-10-17", "apa": "Dimakopoulos, S. (2026). TwinLens: an interpretability digital twin for LLMs (Version 1.0.0). Zenodo. https://doi.org/10.5281/ZENODO.23437557", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の説明文を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "言語モデルの内部の特徴に介入したときの効果を予測し、実際のモデルで確かめる解釈用の「デジタルツイン」TwinLensを作った（抄録）。", "p3": "トランスコーダに基づく線形の代理モデルで介入効果を予測し、GPT-2 smallの56プロンプト・8,064介入で実際の効果と照合した。誤差の原因を調べ、落ちていた2つの微分を戻した（抄録）。", "p5": "線形の代理は実効果の順位をよく当てられなかった（Spearmanのρ=0.20）が、LayerNormの尺度と注意パターンの微分を戻すとρ=0.53に上がり、大きな外れは2.2%から0.05%に減ったとする（抄録）。", "fun": "AIの頭の中の「地図」が本当に正しいかを、地図の予言と実際の反応を何千回も突き合わせて確かめているのが面白い点です。外れの原因が計算で省いていた二つの項だと突き止め、それを戻すと当たりが良くなった、という謎解きの形になっています。", "unverified": "審査のない置き場（Zenodo）の文書で、未査読。Qwen3-0.6Bでの再現の数値詳細は確認できていない。"}}, {"id": "pr30", "rank": 30, "headline": "ビッグデータ分析と組織文化が管理会計の有効性に効く", "title": "The Synergistic Impact of Big Data Analytics, Market Competition, and Organisational Culture on Management Accounting Systems Effectiveness", "url": "https://doi.org/10.2139/ssrn.7625365", "authors": "Kamisah Binti Ismail ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Binti Ismail, K., Hossain, N., & Smith, J. A. (2026). The Synergistic Impact of Big Data Analytics, Market Competition, and Organisational Culture on Management Accounting Systems Effectiveness. https://doi.org/10.2139/ssrn.7625365", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "ビッグデータ分析、市場競争の強さ、組織文化が管理会計システム（MAS）の特性と業績に与える影響を調べた（抄録）。", "p3": "バングラデシュの輸出志向の中・大規模製造企業169社への電子メール調査を、構造方程式モデルで分析した（抄録）。", "p5": "3つの要因はMASの範囲・適時性・統合・集約に有意に影響した。適時性・統合・集約は財務業績と、広い範囲と統合は非財務業績と正に関連したとする（抄録）。", "fun": "会社の中で使う会計の仕組みにも、「範囲が広い」「速い」「まとまっている」などの性格があり、どの性格が効くかは目指す成果によって違う、という見方が面白い点です。何でも詳しくすれば良いわけではない、ということを示しています。", "unverified": "未査読のプレプリント。調査データは自己報告で、効果の大きさは抄録に記載がない。"}}, {"id": "pr31", "rank": 31, "headline": "埋込FBGで海洋構造物の生物膜と腐食を同時計測", "title": "A Data-Driven Measurement Framework for Marine Biofilm Evolution and Corrosion Kinetics Using Embedded FBG and Electrochemical Sensors", "url": "https://doi.org/10.2139/ssrn.7620563", "authors": "Hsin-Lung Chung ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Chung, H.-L., Tsai, L., Tsai, W.-A., Huang, Z.-Y., & Wen, H.-Y. (2026). A Data-Driven Measurement Framework for Marine Biofilm Evolution and Corrosion Kinetics Using Embedded FBG and Electrochemical Sensors. https://doi.org/10.2139/ssrn.7620563", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "海洋構造物の鋼材表面にできる被膜の成長と腐食の進み方を、埋込の光ファイバーセンサ（FBG）と電気化学センサで同時に追う計測の枠組みを示した（抄録）。", "p3": "SS400炭素鋼を14日間浸漬し、FBGの波長変化から被膜の蓄積によるひずみを、電気化学センサから電荷移動抵抗と腐食電流密度を連続計測し、データ駆動モデルで結びつけた（抄録）。", "p5": "FBGで被膜の蓄積による引張ひずみを捉えられ、それは電荷移動抵抗の増加と腐食電流の抑制と対応した。特徴量の重要度ではひずみが予測の重みの39.4%を占めたとする（抄録）。", "fun": "鉄の表面に膜がたまっていく様子を、光の色（波長）のわずかなずれから「ひずみ」として測るのが工夫です。化学の測定だけでは見えない、膜が物理的に詰まって守っている効果を、別の種類のセンサで補っています。", "unverified": "未査読のプレプリント。重要度はモデルの依存度で物理的な正解ではないと著者が注意している。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "SAE特徴の効果は足し算で合成できるか", "title": "Behavioral Compositionality of Sparse Autoencoder Representations", "url": "https://arxiv.org/abs/2610.21261", "authors": "Haotian Ma ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-16", "apa": "Ma, H., Mei, Z., & Sala, F. (2026). Behavioral Compositionality of Sparse Autoencoder Representations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21261", "why": "スパース自己符号化器の特徴が出力に与える効果の非加法性を測る指標を提案し、解釈可能性研究の前提を検証できるようにした。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、§3の枠組み、§4の実験、§5の結論と表1・表2）を読んだ。付録の証明は読んでいない", "preprint": true, "p1": "スパース自己符号化器（sparse autoencoder, SAE）の特徴の効果が「足し算で合成できるか」を測る指標SAR（SAE Additivity Residuals）を作り、SAEの座標は比較的合成しやすいが、正確な説明や操舵には特徴の対の相互作用が必要だと示した（抄録、§5）。", "p2": "SAEは活性を線形に復元するが、その後の層の計算で特徴の効果が強め合い・打ち消し合うことがある。既存の評価は復元・疎さ・解釈しやすさを測るだけで、個々の特徴を組み合わせた説明や介入が忠実かは分からなかった（§1）。", "p3": "各プロンプトで選んだ特徴の寄与の部分集合だけを残し、他の活性を固定して上の層に流し、部分集合ごとの出力応答g(S)を得る（図1）。SAR₁は個々の特徴の効果で説明できない変動、対を加えたSAR₂との差Δ₂が対で回復する構造。独立な部分集合抽出の下で、SARは指定した次数を超える相互作用のエネルギーにちょうど等しく、特徴の組（連合）の順位づけの誤差を抑える（§3、抄録）。", "p4": "Gemma-3 4B、Mistral-7B、Llama-3.1 8Bで6つの行動（単純コピー、主語-動詞一致など）。各プロンプトで上位K=16の寄与、384連合（256で当てはめ、128で評価）。比較対象は同じ部分空間の和を保つランダム回転、評価は保持した連合での順位の忠実度と順位誤差（§4）。", "p5": "SAR₁は57の組合せすべてで正で、加法は厳密でない（図2）。学習されたSAE座標は18設定すべてでランダム回転よりSAR₁が低く、例えばMistralの主語-動詞一致で中央値0.0218対0.1196（図3）。対の項は18設定すべてで順位の忠実度を上げ（平均0.9782→0.9959）、パラメータ数をそろえたランダムな3次の項より良かった（§4.4）。公開された操舵方向16個の組合せでは忠実度が0.5874→0.7790、順位誤差が0.1444→0.0606（表1）。", "p6": "未査読のプレプリント。著者は、結論が選んだ寄与・行動の読み出し・介入の分布に依存し、SAE辞書全体の性質ではないと述べている（§5）。深さの傾向の一部は下流の計算によるとしている（§4.5）。", "fun": "AIの頭の中を「部品」に分けて理解しようとするとき、部品の効き目を一つずつ調べて足し合わせれば全体が分かる、とは限りません。料理の味が材料の足し算でないのと同じです。この論文は、その「足し算からのずれ」を測る物差しを作り、二つずつの組み合わせを考えるとかなり説明できることを示しました。", "unverified": "付録の証明と、7パイプラインでの追加結果の詳細は確認していない。"}}, {"id": "pn02", "rank": 2, "field": "因果推論", "headline": "加法と乗法が混ざる選択で差分の差分を一般化", "title": "Double Selection in Causal Inference", "url": "https://doi.org/10.2139/ssrn.7624679", "authors": "Christian Aleman Pericon ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Aleman Pericon, C., Busch, C., Santaeulàlia-Llopis, R., & Surovtseva, T. (2026). Double Selection in Causal Inference. https://doi.org/10.2139/ssrn.7624679", "why": "共通の時間傾向に加法・乗法の両方の偏りがある場合を扱う枠組みで、水準と対数の差分の差分を入れ子に含む。", "explain": {"basis": "本文", "basis_note": "CESifoワーキングペーパー版のPDF本文（序論、§2のデータ生成過程、結論、図表キャプション）を読んだ。§3〜§5の証明と推定の詳細、表3の数値は読み切れていない", "preprint": true, "p1": "差分の差分（DiD）で「水準で取るか対数で取るか」という恣意的な選択をなくし、加法的な差と比例的な差が同時にある「二重選択」の下でも処置効果を識別する枠組みと、水準で動く2段階の推定量を示した（抄録、p.5〜6）。", "p2": "DiDは選択バイアスが一定（平行トレンド）と仮定するが、水準で一定なら対数では一定でなく、その逆も成り立つ。どちらを選ぶかはデータ生成過程についての暗黙の仮定になり、推論を大きく変えうる（p.4）。", "p3": "結果を q_it = θ0i + θ1i λt + ε（θ0は加法の水準シフター、θ1は観測されない共通時間トレンドλtを拡大縮小する比例シフター）と置く（式1、p.9）。両方が群で違うと、選択バイアスは水準でも対数でも時間とともに変わり、両者の線形結合になる（p.4）。識別は「群内の時間変化の比が群間で一定」という二重一定選択バイアスの条件で行い、処置前の群平均だけで済み、最低2期の処置前データが要る（p.5）。推定は、処置前の群平均の結果対結果の線形射影をOLSで推定し、その係数で対照群を正規化して反実仮想を作る（p.6）。", "p4": "推定値が「選択なし」の理論値からずれるかの検定と、正規化した対照群と処置群の処置前の平行トレンドの事前検定、2段階をまとめてリサンプルするブートストラップで推論する（p.6）。応用はCard（1992）のカリフォルニア州の最低賃金引き上げ（1988年7月）の再検討（p.6〜7）。", "p5": "二重選択では、反対向きのシフターがあると群の順位が時間とともに逆転しうる。これは平行トレンドの下では起こりえない（p.5、図2）。応用では、元の対照群がなくても、他州のうち11州が二重選択の下で有効な対照となり（単一選択は棄却）、1989年のATTは基準の平均賃金の4.6〜16.0%だった（p.7）。", "p6": "未査読のワーキングペーパー。識別はSUTVA、事前効果なし、二重一定選択バイアスの3仮定に依存する（p.6）。対照州によってATTの幅が大きい点の解釈は、読めた範囲では確認できていない。", "fun": "二つの町の比較で、片方がもともとお金持ちで（差が一定）、しかも景気の波を大きく受けやすい（差が比例的）とき、ふつうの比べ方では効果を見誤ります。この論文は、二種類の差を同時に扱えば、交差したり近づいたりするグラフでも比べられる、と示しました。「使えない」とされた比較相手を使えるようにする発想の転換が面白い点です。", "unverified": "表3の推定量ごとの結果の数値と、§3の識別の証明は確認していない。"}}, {"id": "pn03", "rank": 3, "field": "統計学", "headline": "ワッサースタイン距離の有限標本で正直な推測", "title": "Honest Finite-sample Inference for Wasserstein Distances in General Dimension", "url": "https://doi.org/10.2139/ssrn.7620318", "authors": "Sangsidhya Kar", "venue": "SSRN", "date": "2026-10-17", "apa": "Kar, S. (2026). Honest Finite-sample Inference for Wasserstein Distances in General Dimension. https://doi.org/10.2139/ssrn.7620318", "why": "高次元の分布間距離について、仮定を置かずに有限標本で被覆を保証する信頼区間と検定を与える。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録、序論の冒頭を含む）を使用。本文は入手できず", "preprint": true, "p1": "2次元以上の分布間のワッサースタイン距離Wp(P,Q)について、有限標本で一様に被覆を保証する（honestな）信頼区間と検定がどんな仮定で作れ、最良の幅がどこまでかを示した（抄録）。", "p2": "ワッサースタイン距離（最適輸送の費用で測る分布間の距離）は高次元で推定が遅く、仮定なしに妥当な信頼区間を作ることが難しいとされてきた（抄録）。", "p3": "3群の結果を出した。(1)保持した標本でのKantorovich双対から、モーメント・台・滑らかさの仮定なしに有限標本で被覆するW1の下側信頼限界を作り、経験費用が母集団の双対ポテンシャルの経験平均を上回るという1つの不等式から、台の上限またはq次モーメントの上限の下で上側限界を作る。(2)距離の推定の鋭い限界。(3)適応（抄録）。", "p4": "理論の結果で、信頼区間の幅の最適な速度（ミニマックスの意味での鋭さ）で良さを評価する（抄録）。", "p5": "事前の制御がなければ、どのhonestな上側限界も確率1-α以上で無限大になる。モーメント条件だけでの鋭い片側の速度はM^(1/q){n^(-1/d)∨n^(-(q-1)/q)}で、有界集合上では各側が(n log n)^(-1/d)、Sobolev級sではn^(-(s+1)/(2s+d))を払う必要があり、主双対型の区間がそれを達成する。下側は固定した対では母数的な超過で済み、一様なn^(-1/d)の超過は双対ポテンシャルを知らない代価だとする（抄録）。", "p6": "未査読のプレプリント。シミュレーションや応用での区間の実用的な幅は抄録から確認できない。", "fun": "二つの分布がどれだけ違うかを、「片方の砂山をもう片方の形に運ぶ手間」で測るのがワッサースタイン距離です。この論文は、その手間の推定に「どこまでなら必ず正しい幅で言えるか」の限界を、仮定ごとにきっちり線引きしたのが面白い点です。", "unverified": "区間の構成の具体的な手順と数値実験は確認できていない。"}}, {"id": "pn04", "rank": 4, "field": "人口学", "headline": "外国人購入税で住宅が安くなり結婚と出生が増えた", "title": "Home Economics: The Effect of Foreign Buyer Taxes on Marriages and Births", "url": "https://doi.org/10.2139/ssrn.7625262", "authors": "William Moffatt ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Moffatt, W., Gardner, J., & Piano, C. (2026). Home Economics: The Effect of Foreign Buyer Taxes on Marriages and Births. https://doi.org/10.2139/ssrn.7625262", "why": "政策による住宅価格の低下を使った段階的な差分の差分で、住宅取得と家族形成の因果関係を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "カナダ・ブリティッシュコロンビア州の外国人購入税による住宅価格の下落が、結婚と出生を増やしたことを、段階的な差分の差分で推定した（抄録）。", "p2": "持ち家が家族形成の重要な決定要因だという研究は増えているが、政策による住宅価格の変化が結婚・出生に与える因果効果の証拠は限られる（抄録）。", "p3": "外国人購入税（FBT）の地域ごとの段階的な導入を使い、2007〜2021年の地域保健区（Local Health Area）単位の行政データで、段階的な差分の差分（staggered DiD）を推定した。背景：導入時期のずれた地域を比べることで、全国的な時代の変化と政策の効果を分ける（抄録）。", "p4": "20〜44歳の女性1,000人あたりの結婚・出生数と、その対数で評価し、別の推定量と頑健性検査、効果の異質性を調べた（抄録）。", "p5": "処置地域では20〜44歳の女性1,000人あたり結婚が約2.6件、出生が約1.7件増え、対数では結婚が約12%、出生が約5%の増加に相当した。効果の異質性の分析からは、移住より持ち家の取得しやすさの向上が主な経路と示唆されたとする（抄録）。", "p6": "未査読のプレプリント。住宅価格の下落幅や、出生の増加が一時的な前倒しか恒久的な増加かは抄録から確認できない。", "fun": "外国人の家の購入に税をかけたら家が少し安くなり、その地域で結婚や子どもが増えた、という結果です。住宅の政策が、意図していなかった少子化対策のような効果まで生む、という「政策の波及」を数字で示しているのが面白い点です。", "unverified": "住宅価格の変化の大きさと、出生の前倒しの検討の有無は確認できていない。"}}, {"id": "pn05", "rank": 5, "field": "経済学", "headline": "1918年のインフルエンザが賃金格差を広げた", "title": "Pandemic Exposure and Wage Inequality: Evidence from the 1918 Influenza Pandemic in The United States", "url": "https://doi.org/10.2139/ssrn.7615839", "authors": "Guido Pialli ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Pialli, G., & Plevani, G. (2026). Pandemic Exposure and Wage Inequality: Evidence from the 1918 Influenza Pandemic in The United States. https://doi.org/10.2139/ssrn.7615839", "why": "軍の駐屯地を通じた感染拡大を曝露の変動として使い、1940年の全数国勢調査で長期の賃金格差への影響を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "1918年のインフルエンザへの地域の曝露が、1940年の米国の郡の賃金格差を広げたこと、その原因が子ども時代に曝露した恵まれない家庭の男性にあることを示した（抄録）。", "p2": "パンデミックが長期の賃金格差に与える影響は、曝露の測定と、地域の特性による交絡のために識別が難しい（抄録）。", "p3": "第一次大戦の軍の駐屯地が民間人へ感染を広げた役割を使い、最寄りの駐屯地への近さと、第2波の兵士の入院による駐屯地の流行の強さを組み合わせた郡の曝露指標を作った。軍の歴史記録と1940年の全数国勢調査を結び、さらに1910〜1940年の個人を連結した記録で仕組みを調べた（抄録）。", "p4": "郡の男性労働者の賃金格差と、個人の賃金を結果とした（抄録）。", "p5": "曝露の大きい郡ほど1940年の男性労働者の賃金格差が大きかった。個人の分析では、賃金への悪影響は流行時に子どもか思春期だった、恵まれない家庭出身の男性に集中していたとする（抄録）。", "p6": "未査読のプレプリント。効果の大きさの数値や、駐屯地への近さが他の経路で賃金に影響する可能性の検討は抄録から確認できない。", "fun": "100年以上前の感染症が、その時子どもだった人の20年後の給料にまで影を落としていた、という長い時間をまたぐ発見です。軍の基地の近さという「偶然の要素」を使って、地域の豊かさなど他の理由と流行の影響を切り分けているのが工夫です。", "unverified": "効果の大きさと、識別の仮定の検証は確認できていない。"}}, {"id": "pn06", "rank": 6, "field": "経済学", "headline": "洪水への備えが住宅市場の回復力を左右する", "title": "Flood Preparedness And Real Estate Market Resilience", "url": "https://doi.org/10.2139/ssrn.7614138", "authors": "Louis Marolleau ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Marolleau, L., Fajeau, M., & Farvaque, E. (2026). Flood Preparedness And Real Estate Market Resilience. https://doi.org/10.2139/ssrn.7614138", "why": "フランスの1,000万件の取引記録と公式の洪水認定を結び、洪水後の価格と取引の動態を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "フランスの1,000万件の住宅取引と公式の洪水記録で、洪水後の住宅価格と取引の動態を推定し、事前のリスク地図と予防計画がある自治体では価格の反応が小さいことを示した（抄録）。", "p2": "住宅市場はまちまちで、売れる物件の構成も変わるため、洪水の効果を価格の平均変化から読み取ると誤る（抄録）。", "p3": "2010〜2024年の位置つき取引に、公式に認定された洪水事象の行政記録を結んだ。まずヘドニック価格モデルで物件構成の変化に左右されない品質調整済みの価格を作り、それを局所射影（local projection）の枠組みに入れて、価格と取引量の洪水への動的な反応を追った（抄録）。", "p4": "自治体単位で、戸建てと集合住宅、リスク地図と予防計画の有無で反応を比べた（抄録）。", "p5": "洪水は地域の住宅市場に経済的に大きく持続的な影響を与えた。反応は集合住宅より戸建てで強く、リスクが公式に特定されず予防計画もない自治体で最大だった。リスク地図と予防計画を併せ持つ自治体では価格の反応が抑えられたとする（抄録）。", "p6": "未査読のプレプリント。価格の下落幅の数値は抄録に示されていない。", "fun": "洪水の危険があらかじめ地図で知らされている町では、災害が起きても家の値段があまり急落しない、という結果です。危険が前もって値段に織り込まれているので「びっくり」が小さい、という情報の価値を示しているのが面白い点です。", "unverified": "価格反応の大きさと持続期間は確認できていない。"}}, {"id": "pn07", "rank": 7, "field": "機械学習", "headline": "AIエージェントが自ら事後学習の研究を行う", "title": "Athanor: An Agent-Native System for Autonomous Post-Training Research", "url": "https://arxiv.org/abs/2610.21055", "authors": "Yufa Zhou ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-16", "apa": "Zhou, Y., Wang, Y., Fan, J., Shu, Z., Liu, Z., Zhang, A. R., Ling, N., & Wei, Z. (2026). Athanor: An Agent-Native System for Autonomous Post-Training Research (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21055", "why": "最前線のエージェントに実GPU上で小型モデルの事後学習研究を任せ、研究能力を測れる形にした。", "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（序論、§5の発見、限界、結論、図表キャプション）を読んだ。システム構成の節と付録の詳細は一部のみ", "preprint": true, "p1": "最前線のAIエージェント4体のチームが、研究上の助言なしに実GPU上で小型の素のベースモデルを事後学習し、公式の指示調整版と同等以上の汎用モデルに仕上げられることを示した（抄録、結論）。", "p2": "事後学習の研究は高価な反復探索で、公表されるのは最終レシピだけのことが多い。既存の自動化研究は、ベンチマークごとに専門モデルを作る、教師モデルを許す、保留の評価を封印しないなど、問題を狭めていた（序論）。", "p3": "Athanorは、各エージェントにサンドボックスと8GPUのノード、凍結した評価、ジョブ管理、汚染除去済みのデータ、研究記録、エージェントが知らない保留評価を与える（抄録、図2）。外部の教師モデルは使えない。エージェントはデータを読み、学習データを作り、アルゴリズムを変え、ハイパーパラメータを調整し、結果を分析して次を決める（抄録）。", "p4": "基盤はQwen3-4B-Base、Claude Opus 5.5のエージェント4体で104時間。6課題の開発用スイートと、同じ能力を別の問題で測る保留スイートで評価し、公式のQwen3-4B-Instruct-2507と比べた（抄録、表1）。", "p5": "開発用スイートで15.9→67.3、保留スイートで9.2→48.2に上がり、公式の指示調整版（66.5、47.9）と同等以上だった（抄録）。レシピは既知の手法の組合せで、教師ありの微調整、GRPOによる強化学習（ロールアウトの1/4を貪欲復号にする工夫）、エージェント間の重み平均と外挿、自己蒸留の4段階（図5）。費用は約11,800ドルで大半がGPU時間（図4）。最初の1日で60に達し、残り3日の伸びは約7点だった（図1の説明）。", "p6": "著者は、1回のキャンペーン・1つのベースモデル・1種類のエージェントの結果で、反復による変動や大きなモデルへの移転は未検証と認める。公式の推論版には届かず、微調整に使った公開データの多くは強いモデルから蒸留されたものである（限界）。最大の制約はアイデアの多様性だったとする（結論）。", "fun": "AIが自分より小さなAIを、人間の指示なしに何日もかけて鍛え上げ、メーカーが作った完成品に追いついた、という実験です。新しい魔法を発明したのではなく、知られた方法をうまく組み合わせて追いついた点が興味深く、「AIが研究する」ことの今の実力と限界が見えます。", "unverified": "各課題ごとの詳細な点数（表1・表10）と、エージェント間の共有の影響の定量は確認していない。"}}, {"id": "pn08", "rank": 8, "field": "環境・気候政策", "headline": "政治的な崩壊リスクがEU排出量取引の価格を決める", "title": "Banking on Credibility: Political Risk and Carbon Pricing in the EU ETS", "url": "https://doi.org/10.2139/ssrn.7625266", "authors": "Iñaki Rodríguez Longarela ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Rodríguez Longarela, I., & Sirnes, E. (2026). Banking on Credibility: Political Risk and Carbon Pricing in the EU ETS. https://doi.org/10.2139/ssrn.7625266", "why": "価格が上がるほど制度崩壊の確率が高まるモデルで閉形式の均衡価格を導き、2026年のEU ETSに較正した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "排出枠の価格が上がるほど制度が政治的に崩壊する確率が高まるEU排出量取引制度（EU ETS）の多期間モデルで、閉形式の均衡価格を導き、2026年の制度に較正した（抄録）。", "p2": "排出量取引の価格は、上限の厳しさだけでなく、制度が将来も続くという信頼性に左右されるが、その政治的リスクを内生的に扱うモデルは少ない（抄録）。", "p3": "2つの特徴を持つモデルを作った。(1)政治的崩壊の確率が排出枠価格とともに内生的に上がる。(2)反実仮想の排出量と代替技術の価格が技術進歩で下がる。非線形性があるにもかかわらず均衡価格は閉形式で得られる（抄録）。", "p4": "2026年のEU ETSに較正し、観測された価格と、銀行（排出枠の繰り越し）の取り崩しと整合する崩壊リスクを調べた（抄録）。", "p5": "政治的リスクは排出上限とその削減率の効き目を弱め、市場安定化リザーブの操作はほぼ中立にし、完全な信頼性の下では無力な技術の効果を働かせた。観測された価格と繰り越しの取り崩しは、価格に織り込まれた崩壊リスクをほぼ0に抑えており、モデルはこれを「信頼性の謎」として示したとする（抄録）。", "p6": "未査読のプレプリント。較正の詳細や、崩壊確率の関数形への感度は抄録から確認できない。", "fun": "排出枠の値段が高くなりすぎると、政治家が制度をやめてしまうかもしれない、という「値上げのブレーキ」をモデルに入れています。ところが実際の市場の値動きからは、人々がその崩壊をほとんど心配していないように見える、という謎が出てくるのが面白い点です。", "unverified": "較正したパラメータの値は確認できていない。"}}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "レポ取引のヘアカットを決める三つの摩擦", "title": "Stop believing in haircuts - at least the way you think about them", "url": "https://doi.org/10.2139/ssrn.7618239", "authors": "Benedikt Ballensiefen ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Ballensiefen, B., Knyphausen, J., & Nguyen, B. (2026). Stop believing in haircuts - at least the way you think about them. https://doi.org/10.2139/ssrn.7618239", "why": "監督当局の取引データとレバレッジ比率規制の導入を使い、ヘアカットが担保価値以外の要因で決まることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "レポ取引のヘアカット（担保の掛け目の割引）が、ディーラーのバランスシート制約、担保の便宜利回り、顧客の外部選択肢という3つの摩擦で決まることを、監督データと規制の導入で示した（抄録）。", "p2": "ヘアカットは担保のリスクで決まると考えられがちだが、市場の摩擦がどう影響するかは十分に分かっていない（抄録）。", "p3": "取引単位の監督データと、2021年の拘束力のあるレバレッジ比率規制の導入を使い、ディーラー対顧客の相対取引を、担保目的と資金調達目的の取引に分けて分析した。結果を、定期的にヘアカットを再交渉する相対交渉モデルで説明した（抄録）。", "p4": "ヘアカットの水準、レポ金利の変動性、ECBの政策金利の波及を結果とした（抄録）。", "p5": "担保目的のレポでは、拘束的なレバレッジ制約と顧客の外部選択肢の広さがヘアカットを上げ、便宜利回りの高さは下げた。資金調達目的ではレバレッジ制約の効果はなく、便宜利回りは再担保の経路でヘアカットを上げ、外部選択肢は下げた。制約のあるディーラーはレポ金利の変動が大きく、政策金利の波及が弱かったとする（抄録）。", "p6": "未査読のプレプリント。効果の大きさと、データの対象国・期間の詳細は抄録から確認できない。", "fun": "お金を借りるときに差し出す担保の「割引率」は、担保の危なさだけで決まるのではなく、貸し手の事情や借り手が他に頼れる先があるかでも変わる、という結果です。銀行を安全にする規制が、金融政策の効き方まで変えてしまう、という思わぬつながりも示しています。", "unverified": "効果の大きさとデータの範囲は確認できていない。"}}, {"id": "pn10", "rank": 10, "field": "機械学習", "headline": "複数報酬の強化学習で報酬を関係するトークンへ", "title": "Each Reward to Its Relevant Tokens: Reward-Specific Token-Level Credit Assignment for Multi-Reward RL", "url": "https://arxiv.org/abs/2610.21439", "authors": "Skylar Zhai ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-16", "apa": "Zhai, S., Wang, H., Liu, Z., Song, L., Ding, X., Liang, J., & Kang, J. (2026). Each Reward to Its Relevant Tokens: Reward-Specific Token-Level Credit Assignment for Multi-Reward RL (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21439", "why": "複数の検証可能な報酬で言語モデルを訓練する際、各報酬の利得をそれが確かめた位置だけに割り当てる方法を提案した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（§4の手法、§5の実験設定と主結果、結論と限界）を読んだ。表1〜3の個々の数値は一部のみ", "preprint": true, "p1": "複数の検証可能な報酬で言語モデルを強化学習するとき、各報酬の利得（advantage）をその報酬が実際に確かめたトークンに割り当てる方法MRTPOを提案し、補助モデルやトークン単位の注釈なしで学習を速く・良くした（抄録、§6）。", "p2": "報酬ごとに正規化するGDPOでも、各報酬の利得は応答全体に一様に配られる。たとえばSQLで列名だけが誤りでも、他の報酬の得点で誤った箇所まで褒められてしまう（§4.1、図2）。", "p3": "報酬kごとに、検証器の情報Z_k（参照クエリ、実行エラー、制約など）を含むプロンプトと、Z_kだけを除いたプロンプトの2つで、自分の応答を再生（self-replay）する。各位置の次トークン分布のJensen-Shannon距離q_k,t（0〜1）を関連度とし（式5）、それに応じて利得を再配分する。例：存在しない表名telefoneの位置で、実行エラーの情報を外すと予測が大きく変わるので、実行可能性の罰がそこに集まる（図3）（§4.2）。", "p4": "text-to-SQL（Spider、BIRD等）、多制約の指示追従（IFEval、IFBench等）、ツール呼び出し（BFCL-v4）で、1.5B〜7Bの6モデル。比較はGRPO、GDPO、SAW、CoRT、OPSD。評価は実行精度、制約の満足率、AST精度（§5.1）。", "p5": "3課題・6モデルすべてで平均性能が最良だった。改善は報酬の数とともに大きく、制約が5〜13個の指示追従ではIFBenchで2.4点と3.2点、報酬3つのSQLで平均1.3点と1.6点、報酬2つのツール呼び出しではGDPOと同程度だが速かった。ツール呼び出しの形式は10ステップ後に97%で満たされた（GDPO 2%、GRPO 4%）。SQLの応答はGDPOより40%短くなった（§5.2、図4・図5）。", "p6": "未査読のプレプリント。著者は、検証情報を文章で書けない報酬（応答の長さなど）には使えないこと、1.5B〜7Bのモデルと単一の強さβ=0.5でしか試していないこと、LLMが判定する報酬は未検討であることを限界に挙げる（Limitations）。", "fun": "テストの採点で、どの答えのどこが間違っていたかを教えずに「全体で何点」とだけ返されても、何を直せばよいか分かりません。この方法は、採点のヒント（正解や誤りの知らせ）を見せたときと見せないときでAIの予想がどこで変わるかを調べ、点数の責任を本当に関係した部分に配ります。", "unverified": "表1〜3の各ベンチマークの個別の数値は一部しか確認していない。"}}, {"id": "pn11", "rank": 11, "field": "環境・気候政策", "headline": "温暖化への家計の適応を食料支出で測る", "title": "Behavioral Adaptation to a Changing Climate: Evidence from U.S. Household Food Expenditures", "url": "https://doi.org/10.2139/ssrn.7616818", "authors": "Liyuan Zhang ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Zhang, L., Ahmadiani, M., Valizadeh, P., & Woodward, R. T. (2026). Behavioral Adaptation to a Changing Climate: Evidence from U.S. Household Food Expenditures. https://doi.org/10.2139/ssrn.7616818", "why": "家計の購買記録と高解像度の気温を結び、天候の短期変動と気候の長期変化への反応を分けて推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "米国の家計の食料品購入で、短期の天候変動への反応と長期の気候変化への反応を分け、行動の適応が暑さの影響をむしろ強めることを示した（抄録）。", "p2": "家計が気温上昇にどう適応するかは気候変動の経済的費用を評価するうえで中心的だが、証拠は限られる（抄録）。", "p3": "家計の食料品の購買記録を高解像度の気温記録と結び、実際の気温をゆっくり動く気候の平年値と短期の天候の偏差に分解し、天候への反応と気候への反応の差を適応とみなした。買い物に行くか（外延）と、行ったときの支出（内延）の両方を推定した（抄録）。", "p4": "1人あたり週の食料品支出の変化率と金額で評価した（抄録）。", "p5": "気温が平年より1℃高い週は期待される週支出が約0.5%（12.5セント）下がり、気候の平年値が1℃上がると約1.9%（50セント）下がった。両方の効果とその差は統計的に有意で、行動の適応が暑さの短期効果を強めることを意味するとする（抄録）。", "p6": "未査読のプレプリント。支出の減少が購入量の減少か、外食への置き換えかは抄録から確認できない。", "fun": "「暑い日は買い物を控える」という一時的な反応より、「暑い土地に慣れた暮らし」のほうが支出の減り方が大きい、という結果です。適応というと被害を和らげるものと思いがちですが、ここでは逆に影響を強める方向に働いているのが意外な点です。", "unverified": "所得・地域・食品の種類による差の具体的な数値は確認できていない。"}}, {"id": "pn12", "rank": 12, "field": "統計学", "headline": "高頻度データでボラティリティ波及の網を識別", "title": "Network Realized GARCH--It\\^o Models: Volatility Spillovers with High-Frequency Identification", "url": "https://econpapers.repec.org/RePEc:arx:papers:2609.29515", "authors": "Xinyu Song", "venue": "RePEc NEP", "date": "2026-10-05", "apa": "Song, X. (2026). Network Realized GARCH--Itô Models: Volatility Spillovers with High-Frequency Identification (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.29515", "why": "連続時間の分散過程に有向・符号つきのネットワークを埋め込み、日中収益から波及構造を識別する推定法を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、§2のモデル、§5のシミュレーション設定、§6の実証と表5、結論）を読んだ。§3・§4の定理の証明と付録は読んでいない", "preprint": true, "p1": "複数資産の日次の積分ボラティリティの間の、未知で有向・符号つきの波及ネットワークを連続時間の分散過程に埋め込み、日中の高頻度リターンからそれを識別・推定するネットワーク実現GARCH-Itôモデルを示した（抄録、§1）。", "p2": "VARの予測誤差分散分解による連結性（connectedness）は依存の要約で、ボラティリティ過程の中で衝撃がどう伝わるかを表さない。ネットワークGARCHは網を事前に固定し、日次の二乗リターンで当てはめるため、持続する測定誤差で網が歪む（§1）。", "p3": "日次の条件付き対数積分ボラティリティを y_t = ω + γy_{t-1} + (βI + M)z_{t-1}（z は前日の対数積分ボラティリティ、Mは対角0の資産間の波及行列）と置き（式3・4）、正の連続時間の分散過程から生じることを示した（命題1）。M_ijは資産jの前日のボラティリティが資産iに与える効果。網が未知のときは、低ランクの共通因子と疎な有向経路に正則化で分け、選んだ支持の上での局所再推定で応答ベースの連結性を推測する（§1）。", "p4": "シミュレーション（N=10、T=1000、1日390本、300〜500回の反復）と、米国のセクターETF9本の2007〜2025年の1分足（4,182日）。2017〜2025年の2,239回の1日先予測をQLIKE損失で、HAR、VAR、対角AR、日次リターンのネットワークと比べた（§5、§6）。", "p5": "提案モデルの平均QLIKEは0.1770で、VAR（0.1935）、対角AR（0.2014）、日次リターン版（0.3066）より有意に低かった。HAR（0.1796）との差は1.5%で、HAC検定は有意でなかった（p=0.2515）（表5）。全標本の重みつきLASSOは疎な支持を空に選び、ランク1の共通因子の推測ではエネルギーが正味の波及元と識別された（§6.3、結論）。", "p6": "未査読のプレプリント。著者は、疎な辺と年ごとの順位はボラティリティの測り方に敏感で、網の細かな解釈には注意が要ること、推測は支持の選択とランクを条件にした点ごとのもので一様でないことを認める（§1、結論）。", "fun": "株の値動きの「荒れ具合」は、ある業種から別の業種へ伝染していきます。その伝わり方の地図を、1日の終値ではなく1分ごとの値動きから描くと測定のぶれが消える、というのが要点です。地図は予測には役立ったが、細かな道筋は測り方で変わる、と正直に認めているのも見どころです。", "unverified": "表6の頑健性の数値の一部と、定理の条件の詳細は確認していない。"}}, {"id": "pn13", "rank": 13, "field": "経営学", "headline": "競合価格の不正確さが学習する価格設定を動かす", "title": "Partial Price Transparency and Demand Learning in Retail Price Competition", "url": "https://doi.org/10.2139/ssrn.7620880", "authors": "Junbo Jacob Lian ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Lian, J. J., Qin, H., & Teo, C.-P. (2026). Partial Price Transparency and Demand Learning in Retail Price Competition. https://doi.org/10.2139/ssrn.7620880", "why": "競合の価格を誤差つきで観測しながらデータで価格を学ぶ企業がどこで落ち着くかを特徴づけた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "競合の価格を誤差つきで観測しながらデータで価格を学ぶ企業が、どこで落ち着くかを特徴づけ、競合価格の情報が正確になると長期の価格が下がるとは限らないことを示した（抄録）。", "p2": "多くの売り手は競合の価格に合わせて値付けを変えるが、品種の多い商品では競合の商品との照合を誤りやすく、観測する競合価格は不正確になる（抄録）。", "p3": "私的で相関した費用とオフラインの販路を持つ複占で、2つの適応的な価格決定（売上を自社価格と観測した競合価格に回帰するモデル型と、価格感応度を再推定しない規則調整型）の収束先を求めた。モデル型の自社価格の傾きの推定は、競合価格の見えない部分によって偏る（抄録）。", "p4": "平均価格、ナッシュ均衡の水準との差、消費者余剰を評価し、7か月の薬局のパネルで情報構造と判断に基づく値付けを記述した（抄録）。", "p5": "観測価格が情報を持たないとき偏りはちょうどeρになり、精度が上がると偏りが増えることもある。モデル型の企業が精度を選ぶと、基準の設定で両社とも完全な精度になる均衡はなく、平均価格はナッシュ水準より1〜4%高く保たれた。規則調整型の企業は精度によらず平均価格を保ったとする（抄録）。", "p6": "未査読のプレプリント。薬局のパネルは情報構造の記述で、モデルの予測を直接検証したものではない（抄録の範囲）。", "fun": "ライバルの値段を正確に知るほど競争が激しくなって安くなりそう、という直感に反し、データから学ぶ会社どうしでは逆に値段が高めに落ち着くことがある、という結果です。学ぶ道具の「見えない部分による偏り」が値段を動かすという、AI時代の値付けの不思議を示しています。", "unverified": "偏りの式の導出と、7か月の薬局パネルの詳細は確認できていない。"}}, {"id": "pn14", "rank": 14, "field": "機械学習", "headline": "世界モデルと行動モデルは互いに助け合うか", "title": "Can World and Action Modeling Benefit Each Other under Unified Causal Training?", "url": "https://arxiv.org/abs/2610.21095", "authors": "Yue Su ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-16", "apa": "Su, Y., Lin, B., Wang, X., Zhang, C., Wu, X., Zhang, K., Jin, W., Yu, J., Li, Y., Lu, C., Yang, L., & Liu, X. (2026). Can World and Action Modeling Benefit Each Other under Unified Causal Training? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21095", "why": "行動を世界予測の条件かつ方策の目標として扱う統合訓練で、両者の相互の利益をロボット操作の基準で検証した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、§3.3の行動の条件づけ、§4の実験と表1、結論）を読んだ。世界予測の表の数値と付録は一部のみ", "preprint": true, "p1": "ロボットの「行動を条件にした動画の予測（世界モデル）」と「行動の生成（方策）」を一つの因果的なモデルで同時に学ぶ枠組みOneWMを作り、両者が互いの性能を高めることを示した（抄録、§5）。", "p2": "動画生成で行動を導く世界行動モデル（WAM）では、動画側は雑音の入った行動しか見ないか、行動を全く見ない。そのため「指定した正しい行動の結果を予測する」前向きの力学の学習とは別物で、その相互の効果は分かっていなかった（§1）。", "p3": "因果的な注意を持つmixture-of-transformersで、行動列の先頭r個を正しい行動、残りを雑音つきにする（式4）。r=Kは全行動が条件の世界モデル、0<r<Kは正しい接頭部で残りを生成、r=0は全行動を生成する設定で、各バッチにこの3つを混ぜる（§3.3）。", "p4": "シミュレーションのLIBERO、摂動つきのLIBERO-Plus、移動操作のRoboCasa365と、実ロボットの3課題（積み上げ、挿入、朝食の配置）。方策は成功率、世界予測はPSNR・SSIM・LPIPS・FID・FVD。比較は行動を隠したWAM、雑音行動のWAM、行動予測なしの世界モデルWMなど（§4.1）。", "p5": "LIBEROの平均成功率は94.95%で、WAMmask 92.45%、WAMnoisy 92.60%を上回った（Fast-WAMの97.60%には及ばない）。RoboCasa365の全体は36.68%で、WAMmaskの28.32%を上回り、LIBERO-Plusでは背景・カメラ・言語・配置・センサ雑音で優れ、雑音では67.08%だった（表1）。世界予測では同じ構造のWMよりPSNR・SSIM・LPIPSが3つのベンチマークすべてで良かった（§4.3）。", "p6": "未査読のプレプリント。照明の変化とロボットの初期化では利得が不均一だった（§4.2）。正しい行動の条件づけの比率を大きく偏らせると方策の汎化が弱まる（§5）。より多様なデータや長い時間への拡張は今後の課題とされる。", "fun": "「こう動いたら世界はどう見えるか」を想像する力と、「次にどう動くか」を決める力は、別々に鍛えるより一緒に鍛えたほうがお互い強くなる、という結果です。人がボールを投げる練習で、投げた後の軌道を思い描けるほど上手になるのに似た話です。", "unverified": "世界予測の指標の具体的な数値と、実ロボットの成功率の数値は確認していない。"}}, {"id": "pn15", "rank": 15, "field": "環境・気候政策", "headline": "炭素貯留の補助金が招く逆インセンティブ", "title": "Capture with Credit? Perverse Incentives in the Design of Carbon Sequestration Credits&nbsp;", "url": "https://doi.org/10.2139/ssrn.7620859", "authors": "Joseph Stemmler ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Stemmler, J., & Waxman, A. (2026). Capture with Credit? Perverse Incentives in the Design of Carbon Sequestration Credits&nbsp; https://doi.org/10.2139/ssrn.7620859", "why": "米国の炭素回収・貯留への補助金が、正味の削減がわずかな高コスト技術の導入を促しうることを理論と数値で示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用。本文は入手できず", "preprint": true, "p1": "米国の炭素回収・貯留への補助金（税額控除）が、正味の排出削減がわずかな高コスト技術の導入を促し、炭素集約的な生産を温存しうることを理論と数値で示した（抄録）。", "p2": "炭素税と貯留への補助金は、同じ削減を目指していても企業の行動への効果が違う可能性があるが、補助金の歪みは十分に分析されていない（抄録）。", "p3": "炭素集約度の異なる2つの投入物で1つの財を作り、大きな固定費と逓増する限界回収費用のもとで排出の一部を貯留できる代表的企業をモデル化し、理論と数値で比べた（抄録）。", "p4": "炭素税と同額の貯留補助金の下での、貯留の導入、投入物の代替、回収されない排出を比べた（抄録）。", "p5": "炭素税で貯留を始める企業は同額の補助金でも貯留を始めるが、補助金は回収した排出が収入を生み固定費を相殺するため、はるかに低い政策水準で導入を促す。炭素税と違い、補助金は低炭素の投入物への代替を促さず、補助金収入を最大にするため炭素集約的な施設の生産を維持・拡大させうる。回収は不完全なので、貯留が増えても回収されない排出が増えうるとする（抄録）。", "p6": "未査読のプレプリント。数値計算の設定値や、実際の産業データでの検証は抄録から確認できない。", "fun": "CO2を地下に閉じ込めるとお金がもらえる制度だと、会社は「CO2をたくさん出してたくさん閉じ込める」ほうが得になる場合がある、という皮肉な結果です。罰金（税）とごほうび（補助金）は同じように見えても、行動の変え方がまったく違うことが分かります。", "unverified": "数値計算に使ったパラメータは確認できていない。"}}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "政治的衝撃が党派ごとにインフレ予想を分ける", "title": "Partisan Identity and Inflation Expectations: Evidence from a Political Shock in Türkiye", "url": "https://doi.org/10.2139/ssrn.7610843", "authors": "Simay Aydeniz ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Aydeniz, S., & Demiralp, S. (2026). Partisan Identity and Inflation Expectations: Evidence from a Political Shock in Türkiye. https://doi.org/10.2139/ssrn.7610843", "why": "調査期間中に起きた予期しない政治的事件を自然実験として、党派性とインフレ予想の関係を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "予期しない時期の政治的事件の前後で同じ家計を比べ、党派によってインフレ予想の反応が違うことを示した（抄録）。", "p3": "2025年3月のトルコの政治的事件の時点で実施中だった独自の家計パネル調査で、事件の前と当日の回答者を比べ、同じ回答者を追跡した（抄録）。", "p5": "1年先のインフレ予想は事件直後に約18ポイント上がり、野党支持者で与党支持者よりはるかに大きく上がった。この党派差は約1年続いたとする（抄録）。", "fun": "同じ出来事を見ても、どの政党を応援しているかで「これから物価が上がる」と感じる度合いが大きく変わる、という結果です。たまたま調査中に事件が起きたので、事件の前と後の人をくらべる「自然の実験」になっているのが強みです。", "unverified": "未査読のプレプリント。標本の規模は抄録に記載がない。"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "成績優秀の称号は労働市場で有利に働くか", "title": "A Question of Honor? The Labor Market Advantage of Academic Signaling", "url": "https://doi.org/10.2139/ssrn.7624669", "authors": "Mael Astruc Le Souder ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Astruc Le Souder, M., Bargain, O., & Locks, G. (2026). A Question of Honor? The Labor Market Advantage of Academic Signaling. https://doi.org/10.2139/ssrn.7624669", "why": "フランスの大学院修了者の行政・調査データで、学業上の称号のシグナル効果を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "大学院の成績優秀の称号が就職を早めるかを、成績の固定しきい値を使ったファジー回帰不連続デザインで推定した（抄録）。", "p3": "フランスの大規模大学の修士修了者の行政・調査データで、3段階の称号のGPAしきい値の前後を比べた（抄録）。", "p5": "効果は中位の称号（High Honors）に集中し、就職を大きく早め、雇用効果は修了4か月後に最大だった。所得の上乗せは2年以内に消えたが、雇用の経路への効果の一部は残ったとする（抄録）。", "fun": "成績が「しきい値ぎりぎりで称号をもらえた人」と「ぎりぎりでもらえなかった人」は、実力はほぼ同じはずです。この境目をくらべると、称号という「ラベル」だけの効果を取り出せる、というのがこの手法の面白さです。", "unverified": "未査読のプレプリント。効果の大きさの数値は抄録に示されていない。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "減税法がIPO資金の借入返済への使い方を変えた", "title": "IPO-Funded Debt Repayment and its Consequences: The Role of the Tax Benefits of Debt", "url": "https://doi.org/10.2139/ssrn.7620718", "authors": "Bradford Hepfer ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Hepfer, B., Rice, S. C., & Rozanski, A. (2026). IPO-Funded Debt Repayment and its Consequences: The Role of the Tax Benefits of Debt. https://doi.org/10.2139/ssrn.7620718", "why": "2017年の税制改革を自然実験に、負債の節税効果がIPO資金の使途とその帰結に与える影響を調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "2017年の米国の減税法（TCJA）を自然実験に、負債の節税効果がIPO資金を借入返済に回す判断とその帰結を変えるかを調べた（抄録）。", "p3": "2014〜2024年の米国のIPO 787件で、上場前の負債負担とIPO資金による返済の関係、その後の業績と投資を、TCJA前後と上場前の借入コストで比べた（抄録）。", "p5": "TCJA前に見られた上場前の負債負担と返済の負の関係は、TCJA後に完全に弱まった。借入コストが高い企業では返済の悪影響が消えたが、低い企業では業績の悪影響が残り研究開発と設備投資が減ったとする（抄録）。", "fun": "借金の利息が税金を減らしてくれる「お得さ」が小さくなると、会社は上場で集めたお金で借金を返しやすくなる、という税と財務の関係です。税のルールが変わると、会社のお金の使い道まで変わることを示しています。", "unverified": "未査読のプレプリント。効果の大きさの数値は抄録に示されていない。"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "需要ショックで企業は職場の福利を調整するか", "title": "Perks Under Pressure? Demand Shocks and Firm Provision of Workplace Amenities", "url": "https://doi.org/10.2139/ssrn.7621081", "authors": "Manudeep Bhuller ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Bhuller, M., Delgado-Prieto, L., & Škoda, S. (2026). Perks Under Pressure? Demand Shocks and Firm Provision of Workplace Amenities. https://doi.org/10.2139/ssrn.7621081", "why": "賃金と職場アメニティを同時に決める買手独占のモデルで、需要ショックの転嫁を理論と実証で調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "需要ショックのときに企業が賃金だけでなく職場の福利（アメニティ）も調整するかを、理論と行政データで調べた（抄録）。", "p3": "賃金とアメニティを同時に決める買手独占の枠組みを作り、ノルウェーの雇用者-従業員の連結データ、企業の費用会計、求人広告の非金銭的属性を使い、付加価値の急変・公共調達の落札・輸出需要の変化の3つの変動源で検証した（抄録）。", "p5": "非賃金の報酬にも、賃金や雇用に加えて複数の面で調整が起きることを示し、雇用主の市場支配力の測り方への含意を論じたとする（抄録）。", "fun": "給料は上げ下げしにくくても、職場の居心地や柔軟さといった「お金以外のごほうび」を会社は調整しているかもしれない、という見方です。給料だけを見ていると、会社の力の強さを見誤るおそれがある点が面白いところです。", "unverified": "未査読のプレプリント。推定の大きさは抄録に示されていない。"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "賃金を上げると労働生産性は上がるか", "title": "Wages, Effective Labor, and Firm Productivity: Evidence fromColombian Manufacturing", "url": "https://doi.org/10.2139/ssrn.7615840", "authors": "Subal C. Kumbhakar ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Kumbhakar, S. C., & Wang, Y. (2026). Wages, Effective Labor, and Firm Productivity: Evidence fromColombian Manufacturing. https://doi.org/10.2139/ssrn.7615840", "why": "効率賃金理論に基づく構造的生産関数で、コロンビア製造業の賃金と実効労働の関係を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "効率賃金理論に基づく構造的な生産関数で、賃金を上げると実効的な労働が増えるかを推定した（抄録）。", "p3": "企業が雇用・原材料・賃金を同時に選び、実効労働が雇用・賃金反応関数・労働増大型の生産性に依存するモデルを作り、コロンビア製造業の2010〜2019年の事業所パネルに当てはめた（抄録）。", "p5": "実効労働の賃金弾力性は約0.27で、正だが小さく、摩擦のない効率賃金の基準が示す1を大きく下回ったとする（抄録）。", "fun": "給料を上げると人がよく働くのか、それとも生産性の高い会社がもともと高い給料を払うだけなのか。この「卵が先か鶏が先か」を生産のモデルで切り分けようとしているのが面白い点です。効果はあるが思ったより小さい、という答えです。", "unverified": "未査読のプレプリント。識別に使う仮定の詳細は本文で確認できていない。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "予測市場の価格は較正がずれても儲けにならない", "title": "Miscalibration Without Tradable Alpha: Displayed Prices, Actionable Quotes, and Fees in a Regulated Prediction Market", "url": "https://doi.org/10.2139/ssrn.7618398", "authors": "Lawton Swan", "venue": "SSRN", "date": "2026-10-16", "apa": "Swan, L. (2026). Miscalibration Without Tradable Alpha: Displayed Prices, Actionable Quotes, and Fees in a Regulated Prediction Market. https://doi.org/10.2139/ssrn.7618398", "why": "規制された予測市場の価格を結果と結び、較正のずれと手数料を含めた実際の収益性を区別して評価した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "予測市場の価格の「較正」と「実際に儲けられるか」を区別して、規制された予測市場Kalshiで評価した（抄録）。", "p3": "前向きに観測した937市場と、過去の板情報から再構成した57,808市場を結果と結び、表示価格・中値から実際に約定できる気配と収益に置き換え、事象単位のブートストラップで推測した（抄録）。", "p5": "過去の中値はほぼ完全な較正に近かったが区別できる差があった（差-1.98ポイント、95%CI[-2.51,-1.43]）。標準の手数料では20区分すべてで収益の区間が0未満だったとする（抄録）。", "fun": "予測市場の値段は「起こる確率」として読めますが、そのずれを見つけても手数料や実際に買える値段を考えると儲からない、という結果です。「確率の予想」と「買える値段」は別物だ、という区別がはっきりします。", "unverified": "未査読のプレプリント。"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "共通の部材を通じて異業種合併が競合を害する", "title": "Shared Supply Chains and Conglomerate Mergers: A Waterbed Effect under Common Input Sourcing", "url": "https://doi.org/10.2139/ssrn.7620803", "authors": "Panagiotis Skartados ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Skartados, P., & Kopel, M. (2026). Shared Supply Chains and Conglomerate Mergers: A Waterbed Effect under Common Input Sourcing. https://doi.org/10.2139/ssrn.7620803", "why": "共通の投入物を調達する企業間では、無関係な市場どうしの合併でも競合に不利益が生じうることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "無関係な市場の企業どうしの合併でも、共通の部材を調達していれば競合に害を及ぼしうることを理論で示した（抄録）。", "p3": "合併企業が一つの供給者から一律価格で調達するモデルで、合併後の卸価格が合併前の2つの価格の加重平均になることを導いた（抄録）。", "p5": "卸価格が低かった市場で価格が上がる市場間の「ウォーターベッド効果」が生じ、無関係な市場の独立した競合の費用を上げ、取引拒絶なしに市場から追い出すこともありうるとする（抄録）。", "fun": "水の入ったベッドの片側を押すと反対側が盛り上がるように、ある市場の合併が、全く別の市場のライバルの仕入れ値を押し上げる、という仕組みです。関係なさそうな合併でも安心できない理由を示しています。", "unverified": "未査読のプレプリント。実証的な検証の有無は抄録から確認できない。"}}, {"id": "pn23", "rank": 23, "field": "統計学", "headline": "第一価格オークションの私的価値密度をウェーブレットで", "title": "Adaptive Wavelet Estimation of Private-Value Densities in First-Price Auctions", "url": "https://doi.org/10.2139/ssrn.7618223", "authors": "Hassan Doosti ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Doosti, H., Dewan, I., & Sbai, E. (2026). Adaptive Wavelet Estimation of Private-Value Densities in First-Price Auctions. https://doi.org/10.2139/ssrn.7618223", "why": "二段階推定の第二段をウェーブレットに置き換え、私的価値の密度の適応的な推定量を導いた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "第一価格オークションの入札から入札者の私的価値の分布をウェーブレットで推定する方法を示した（抄録）。", "p3": "Guerre・Perrigne・Vuong（2000）の二段階法の第二段のカーネル推定をウェーブレット推定に置き換え、第一段の誤差を含めてBesov空間での収束速度を導き、調整パラメータを交差検証で選んだ（抄録）。", "p5": "シミュレーションでは局所線形ウェーブレット推定量が、歪んだ・U字形・一様の分布で平均積分二乗誤差が最小だった。米国森林局の木材オークションでは右に長い裾を持つ単峰の分布で推定が一致したとする（抄録）。", "fun": "オークションでは本当にいくらの価値があると思っているかは隠され、入札額しか見えません。その入札額から心の中の値段の分布を逆算するのが面白い点で、分布の形が変わっても強い推定法を選べるようにしています。", "unverified": "未査読のプレプリント。"}}, {"id": "pn24", "rank": 24, "field": "統計学", "headline": "小さなアンサンブルでも整合するデータ同化", "title": "A Data-Consistent Approach to Ensemble Filtering", "url": "https://doi.org/10.2139/ssrn.7624466", "authors": "Rylan Spence ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Spence, R., Butler, T., & Dawson, C. (2026). A Data-Consistent Approach to Ensemble Filtering. https://doi.org/10.2139/ssrn.7624466", "why": "アンサンブル数が状態・観測の次元より小さい場合のフィルタリングに、データと整合する新しい手法を提案した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "アンサンブル数が状態や観測の次元より小さい場合のデータ同化に、データ整合的な決定論的フィルタQPCA-EnDCFを提案した（抄録）。", "p3": "白色化した予報-観測の差の空間で更新を正則化し、補正を経験的なスペクトル部分空間（ランクκ）に制限してから状態空間へ写す。集中不等式と偏り-分散の分解を示した（抄録）。", "p5": "Lorenz-96の実験で、比べた確率的・決定論的な手法より較正が良く平均二乗誤差が小さかった。主に実現間の分散が下がったためで、偏りは増えたとする（抄録）。", "fun": "天気予報のように、少ない数の予測の束から大きな系の状態を推定するとき、情報が足りず計算が不安定になりがちです。補正を「確かな方向」だけに絞ることで、少し偏る代わりにばらつきを大きく減らす、という取引をしています。", "unverified": "未査読のプレプリント。誤差の数値は抄録に示されていない。"}}, {"id": "pn25", "rank": 25, "field": "統計学", "headline": "宇宙のギガパーセク構造をパーコレーションで検定", "title": "Gigaparsec structures in sparse tracers as a percolation phenomenon: calibrated inference for the Giant Arc, the Big Ring and the Hercules-Corona Borealis Great Wall", "url": "https://doi.org/10.2139/ssrn.7624326", "authors": "Ruocun Ou", "venue": "SSRN", "date": "2026-10-17", "apa": "Ou, R. (2026). Gigaparsec structures in sparse tracers as a percolation phenomenon: calibrated inference for the Giant Arc, the Big Ring and the Hercules-Corona Borealis Great Wall. https://doi.org/10.2139/ssrn.7624326", "why": "疎な天体分布に見える巨大構造の有意性を、パーコレーション現象として較正された推測で評価し直した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "疎な天体分布に見つかったとされる「ギガパーセク級の巨大構造」の有意性を、有限窓の連続体パーコレーションの極値問題として評価し直した（抄録）。", "p3": "最大クラスタのクランピング近似、有限の厚さでのしきい値の尺度則、選択を考慮した帰無カタログ、全探索に対する較正、独立データでの検証を組み合わせた（抄録）。", "p5": "連結長・形状・選択のわずかな変更で見かけの巨大構造の発生率が数倍変わり、報告された4つの構造の名目上の有意性を大きく下げた。DESIデータでの検定は記述的にとどまるとする（抄録）。", "fun": "夜空の点をつなげると、偶然でも大きな形が見えてしまうことがあります。「点をどこまで離れていてもつなぐか」という決め方しだいで巨大構造が出たり消えたりする、という指摘が面白く、宇宙の大発見を統計の目で確かめ直しています。", "unverified": "未査読のプレプリント。独立データでの検定は解盲後のモデル修正があり決定的でないと著者が述べている。"}}, {"id": "pn26", "rank": 26, "field": "機械学習", "headline": "決定志向学習の勾配はランク落ちしうる", "title": "Jacobian Rank Collapse in Decision-Focused Learning", "url": "https://econpapers.repec.org/RePEc:arx:papers:2609.39261", "authors": "Aojie Yuan ほか", "venue": "RePEc NEP", "date": "2026-10-05", "apa": "Yuan, A., Zhang, H., & Su, Z. (2026). Jacobian Rank Collapse in Decision-Focused Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.39261", "why": "下流の目的で予測器を訓練する決定志向学習で、損失が独立な更新方向を与えない条件をヤコビアンのランクで特徴づけた。", "explain": {"basis": "抄録", "basis_note": "RePEc（EconPapers）に掲載のarXiv版の抄録を使用", "preprint": true, "short": true, "p1": "下流の意思決定の目的で予測器を学習する決定志向学習（decision-focused learning, DFL）が、独立な更新方向を持たない条件を予測器のヤコビアンで特徴づけた（抄録）。", "p3": "疎な指数追跡を例に、最適化が読む共分散と学習で使えるパラメータ方向を区別し、ランク1のヤコビアンでは例ごとの勾配が共線になることを示し、反例と実験で確かめた（抄録）。", "p5": "38の株式設定でMSEに対するDFLの改善は1.8%未満だった。最短経路とナップサックでは全容量のSPO+が平均後悔を11.6%と10.6%減らしたが、8比較の補正後に残ったのはナップサックだけだったとする（抄録）。", "fun": "「予測を当てる」ことと「良い決定をする」ことを直接つなげて学習させる考え方に、思ったほど自由に学べない場合がある、という限界を幾何学で示しています。どれだけ得をするかは、結局は本番のデータで確かめるしかない、という慎重な結論です。", "unverified": "未査読のプレプリント。"}}, {"id": "pn27", "rank": 27, "field": "機械学習", "headline": "深層強化学習の売買執行で生まれる協調的な罰", "title": "Beyond Supra-Competitive Outcomes: Collusive Behaviour in Deep Reinforcement Learning for Optimal Execution Games", "url": "https://econpapers.repec.org/RePEc:arx:papers:2610.00619", "authors": "Christos Spyridon Koulouris ほか", "venue": "RePEc NEP", "date": "2026-10-05", "apa": "Koulouris, C. S., & Campajola, C. (2026). Beyond Supra-Competitive Outcomes: Collusive Behaviour in Deep Reinforcement Learning for Optimal Execution Games (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.00619", "why": "最適執行ゲームで学習した戦略が逸脱を罰する仕組みを持ち、競争水準を超える結果を支えることを示した。", "explain": {"basis": "抄録", "basis_note": "RePEc（EconPapers）に掲載のarXiv版の抄録を使用", "preprint": true, "short": true, "p1": "最適執行ゲームで強化学習の売買エージェントが、逸脱を罰する仕組みを学んで競争水準を超える結果を保つことを示した（抄録）。", "p3": "2人・有限期間のAlmgren-Chriss型の清算ゲームで独立したPPOエージェントを訓練し、平均の学習済み計画への逸脱を見つけて片方に強制し、相手の反応を調べた（抄録）。", "p5": "相手は清算を早めて応じ、その反応はすべての試行と役割で逸脱者の利得を上回った。罰する側の平均利得はほぼ変わらず、協調的な解釈を支持する2つの検査が成り
