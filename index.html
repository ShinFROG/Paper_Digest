<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

n Shed a Persona but Not the Person (Version v1). Zenodo. https://doi.org/10.5281/ZENODO.24249957", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"id": "pr15", "rank": 15, "headline": "孤独を日常の即時評価と端末のセンシングで測る", "title": "Assessing Loneliness in Daily Life by Combining Ecological Momentary Assessment and Passive Sensing: Scoping Review (Preprint)", "url": "https://doi.org/10.2196/preprints.116856", "authors": "Hyeonjin Cho ほか", "venue": "JMIR Preprints", "date": "2026-11-15", "apa": "Cho, H., Lee, M., Joo, J., Won, S., Han, J., Kim, D., Warrier, G., Thrul, J., & Cho, J. (2026). Assessing Loneliness in Daily Life by Combining Ecological Momentary Assessment and Passive Sensing: Scoping Review (Preprint). https://doi.org/10.2196/preprints.116856", "theme": "包摂的コミュニティ・社会", "theme_no": 4}, {"id": "pr16", "rank": 16, "headline": "同定可能性の証明をLean 4で機械的に検証", "title": "From Pen-and-Paper to Machine-Checked Proofs: Lean for System Identification", "url": "https://arxiv.org/abs/2611.18220", "authors": "Manas Mejari ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Mejari, M., Piga, D., & Forgione, M. (2026). From Pen-and-Paper to Machine-Checked Proofs: Lean for System Identification (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18220", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "システム同定と制御の研究者向けに、証明支援系Lean 4で定理と証明をコードとして書き、すべての推論を小さな信頼できるカーネルに検査させる方法を紹介した（抄録）。", "p3": "同定可能性と集合の不変性の2つの初歩的な例でLeanの証明の読み方を示し、予測誤差法の雑音フィルタの逆に関する古典的な補題（Ljung, 1999の補題3.1）を形式化して分析した（抄録）。", "p5": "形式化により、この補題の主張はすべての実現値ではなく、ほとんど確実に（確率1で）成り立つという微妙な点が明らかになり、簡単な反例で具体的に示した（抄録）。", "fun": "教科書に載っている有名な定理でも、証明の一歩一歩をコンピュータに確かめさせると思わぬすき間が見つかることがある。この論文では、雑音の処理に関する定番の補題が「どんな場合でも」ではなく「確率1で」しか成り立たないことが分かった。数学の証明をプログラムのように検査する道具が、工学の理論の見直しにも役立つという点が面白い。", "unverified": "形式化した証明の分量や、扱った補題以外の結果は抄録から確認できない。反例の具体的な形は未確認。"}}, {"id": "pr17", "rank": 17, "headline": "GNSSの1PPSで時刻をそろえた低価格センサ網", "title": "Decentralized Low-Frequency Acoustic and Infrasound Sensor Mesh Architecture with Hardware 1-PPS GNSS Synchronization and 3D TDoA-EKF Fusion for Environmental Hazard Monitoring", "url": "https://doi.org/10.5281/zenodo.24253649", "authors": "Banakh, Andriy Stepanovych", "venue": "Zenodo", "date": "2026-11-15", "apa": "Banakh, A. S. (2026). Decentralized Low-Frequency Acoustic and Infrasound Sensor Mesh Architecture with Hardware 1-PPS GNSS Synchronization and 3D TDoA-EKF Fusion for Environmental Hazard Monitoring (Version 2.0). Zenodo. https://doi.org/10.5281/ZENODO.24253649", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoの登録の説明（DataCiteから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "ESP32のマイコンと24ビットADC、GNSSの1PPS（毎秒1回の時刻パルス）のハードウェア割り込みでノード間の時刻をそろえた、低周波音と超低周波音の分散型センサ網TREMBITA-Meshの設計を示した（抄録）。未査読の原稿。", "p3": "各ノードはADS1256（1000 SPS）で計測し、1PPSの割り込み（エッジのゆらぎ20 ns未満）でNMEAとPPSの1秒のずれをなくす。サーバでは3次元の到達時間差（TDoA）の多点測位と6状態の拡張カルマンフィルタ（EKF）で音源を追跡する（抄録）。", "p5": "6ノードの網の模擬で、EKFにより3次元の追跡のRMSEが32.6%減り（12.22 mから8.24 m）、時刻の誤差σ=2.0 msのとき3次元誤差の中央値は5.45 mだった（抄録）。", "fun": "雷の光と音の時間差で距離が分かるように、何台ものマイクに音が届く時間のずれから音の出どころを計算できる。そのためには各マイクの時計がそろっていなければならない。この研究は、GPS衛星が送る1秒ごとの合図で安いマイコンの時計を合わせ、数メートル単位の精度で音源を追う。時刻合わせが位置の精度を決めるという点が面白い。", "unverified": "実地での検証の有無と規模、模擬の条件の詳細は抄録から確認できない。査読を経ていない。"}}, {"id": "pr18", "rank": 18, "headline": "小型LLMの判定の集約で群衆の決定は定まるか", "title": "Small Open-Weight Language Models for Crowd Decision-Making: Capabilities and Limits of Output-Level Fusion and Linguistic Aggregation", "url": "https://arxiv.org/abs/2611.17589", "authors": "David Herrera-Poyatos ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Herrera-Poyatos, D., Zuheros, C., Peláez-González, C., Herrera-Poyatos, A., Montes, R., & Herrera, F. (2026). Small Open-Weight Language Models for Crowd Decision-Making: Capabilities and Limits of Output-Level Fusion and Linguistic Aggregation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17589", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "公開重みの小型LLMで口コミを繰り返し判定して集約する群衆の意思決定は、1つの勝者を決めるより、余裕つきの候補の集合として示すべきだと示した（抄録）。", "p3": "8〜36Bの公開重みモデル5つと参照モデルで、ロンドンの4店のTripAdvisorの口コミ474件を各10回分類し（マドリードの12店・600件でも追試）、判定の集約・融合と、評価者の引き直しへの感度を調べた（抄録）。", "p5": "評価者を引き直すと勝者が保たれるのは複製の47〜81%で、実行を引き直した場合の86〜100%より低く、同時区間ではどのシステムも単一の勝者を決められなかった（ロンドンは4店すべてが候補に残った）。大きめの3モデルは参照モデルと同じ勝者を挙げた（抄録）。", "fun": "AIに口コミを読ませて「一番の店」を決めさせると、同じ質問でも答えが毎回少し揺れる。何度も聞いてまとめればその揺れは小さくなるが、口コミを書いた人の顔ぶれが変わると一番が入れ替わってしまう。AIを何度使っても、元のデータが持つ不確かさは消せないことを示した点が面白い。", "unverified": "使ったモデル名、2-tupleの言語的表現による集約の具体的な手順、区間の作り方の詳細は抄録から確認できない。"}}, {"id": "pr19", "rank": 19, "headline": "配偶者も子もない高齢者の幸福感をネットワーク分析", "title": "Vulnerable nodes and candidate intervention targets in subjective well-being among older adults without a spouse or living children: A Computer-Simulated Network Analysis Objective: To characterize the network structure of subjective well-being among older adults without a spouse or living children. We sought to identify central and bridge nodes, potential intervention and prevention targets, and differences in candidate targets by parental history to inform psychological care. Methods: Using stratified sampling, we surveyed 384 older adults without a spouse or living children in Changsha between November 2025 and February 2026. Participants completed the Memorial University of Newfoundland Scale of Happiness. The sample included 283 life (Preprint)", "url": "https://doi.org/10.2196/preprints.116770", "authors": "Chunyan Li ほか", "venue": "JMIR Preprints", "date": "2026-11-15", "apa": "Li, C., Ren, Y., Li, Y., Chen, Q., Xie, Y., Xiao, J., & Wang, J. (2026). Vulnerable nodes and candidate intervention targets in subjective well-being among older adults without a spouse or living children: A Computer-Simulated Network Analysis Objective: To characterize the network structure of subjective well-being among older adults without a spouse or living children. We sought to identify central and bridge nodes, potential intervention and prevention targets, and differences in candidate targets by parental history to inform psychological care. Methods: Using stratified sampling, we surveyed 384 older adults without a spouse or living children in Changsha between November 2025 and February 2026. Participants completed the Memorial University of Newfoundland Scale of Happiness. The sample included 283 life (Preprint). https://doi.org/10.2196/preprints.116770", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "配偶者も存命の子もいない高齢者の主観的幸福感の項目間のネットワークを推定し、仮想的な摂動のシミュレーションで介入・予防の候補となる項目を特定した（抄録）。未査読。", "p3": "長沙市で層化抽出した384人（生涯子なし283人、子を亡くした101人）の幸福尺度の24項目を2値化してIsingネットワークを推定し、強度中心性と橋渡しの強さを求め、項目の閾値を動かす摂動で介入の効果を模擬した（抄録）。", "p5": "全体ではPE1の強度中心性が最大（7.092）、PE4の橋渡しの強さが最大（3.243）だったが、PE4は大きな純便益を生まなかった。介入の第一候補はPA1・PE5・PA3で、有害な合成アウトカムの模擬上の減少は8.24%・10.58%・6.26%だった（抄録）。", "fun": "幸福感のアンケートの答え同士がどうつながっているかを網の目として描き、どの項目を良くすると全体が一番良くなるかをコンピュータ上で試している。網の中で一番つながりの多い項目を動かすのが一番効く、とは限らなかった。目立つ位置にあることと、変えたときの効果は別だと数字で示した点が面白い。", "unverified": "各項目（PE1・PA1など）の内容、群間比較の検定の詳細は抄録から確認できない。著者は縦断研究と実際の介入での検証が必要としている。"}}, {"id": "pr20", "rank": 20, "headline": "洪水の被害は生活の損失で見ると不平等が大きい", "title": "Socio-economic flood resilience reveals welfare-vulnerable communities obscured by asset-based appraisals", "url": "https://doi.org/10.21203/rs.3.rs-11539385/v1", "authors": "Jie Liu ほか", "venue": "Research Square (In Review)", "date": "2026-11-16", "apa": "Liu, J., Liu, J., Wang, T., Li, Z., Xu, Z., Cats, O., Cremen, G., Wang, J., He, M., Chen, A., Galaitisi, S., Linkov, I., & Debnath, R. (2026). Socio-economic flood resilience reveals welfare-vulnerable communities obscured by asset-based appraisals. https://doi.org/10.21203/rs.3.rs-11539385/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "洪水リスクを資産の損失だけでなく金銭換算したwell-beingの損失でも評価すると、資産ベースの評価では見えない、福祉面で脆弱な地域が浮かび上がることを示した（抄録）。未査読。", "p3": "2 m解像度の浸水ハザード図、社会経済データ、動的な復旧モデルを統合し、社会経済的な洪水レジリエンス（SEFR＝資産の損失÷金銭換算したwell-beingの損失）を、イングランドの6,791地区で現在と将来（RCP8.5）の複数の洪水源・再現期間について求めた（抄録）。", "p5": "貧しい地区ほどSEFRが低く、低SEFRの地区は空間的に集まっていた。資産損失の上位5%・10%の地区の7.8〜23.8%は、同じ規模のwell-being損失の上位に入らなかった（抄録）。", "fun": "同じ100万円の被害でも、蓄えの多い家と少ない家では生活への打撃がまったく違う。この研究は、壊れた物の値段ではなく暮らしがどれだけ苦しくなったかをお金に換算して洪水の被害を測り直した。物の値段だけで対策の優先順位を決めると、本当に困る地域を見落とすことを数字で示した点が面白い。", "unverified": "well-beingの損失の金銭換算の方法と復旧モデルの詳細は抄録から確認できない。"}}, {"id": "pr21", "rank": 21, "headline": "支援ロボットのLLMに持たせたい価値観を測る", "title": "Personalization of Basic and Moral Values Guiding LLM-Controlled Assistant Robots", "url": "https://arxiv.org/abs/2611.18230", "authors": "Mateusz Wozniak ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Wozniak, M., Gao, Q., & Wykowska, A. (2026). Personalization of Basic and Moral Values Guiding LLM-Controlled Assistant Robots (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18230", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "LLMで動く支援ロボットに利用者が望む価値観は本人の価値観と異なり、LLMに指示するだけではその望みに近づかないことを示した（抄録）。", "p3": "簡易版シュワルツ価値観調査（SVS）、PVQ-21、道徳基盤質問紙（MFQ）を、自分用とロボット用の両方の形で将来の利用者22人に実施し、尺度の使いやすさをUEQ-Sで比べ、15のLLMをその価値観のプロファイルと比べた（抄録）。", "p5": "参加者はロボットに、個人に焦点を当てた価値は自分より低く、社会に焦点を当てた価値は高くあってほしいと答え、道徳のプロファイルはほぼ同じだった。ロボットとして振る舞うよう指示したLLMは望まれた方向へ弱くしか動かなかった（抄録）。", "fun": "自分の家に来るロボットには、自分と同じ性格より「もっと周りを思いやる」性格でいてほしい、と人は考えるらしい。ところがAIに「ロボットとして振る舞って」と頼んでも、その望みにはなかなか近づかない。人がロボットに求める人柄とAIが自然に示す人柄のずれを、心理テストで数字にした点が面白い。", "unverified": "参加者は22人と少ない。どのLLMがどの程度ずれたかの数値は抄録から確認できない。"}}, {"id": "pr22", "rank": 22, "headline": "ペルソナベクトルによる予防的な誘導の副作用", "title": "Safety Side Effects of Preventative Persona Steering: An Empirical Audit", "url": "https://arxiv.org/abs/2611.17620", "authors": "Sabrina Tang ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Tang, S., Vo, N., Murillo, C., Sukumarnpiti, C., & Wilson, S. (2026). Safety Side Effects of Preventative Persona Steering: An Empirical Audit (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17620", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "おべっかや幻覚を抑えるペルソナベクトルの予防的な誘導は、知識の正確さを保っても、拒否などの安全面の振る舞いを変えることを示した（抄録）。", "p3": "おべっか（sycophancy）と幻覚に対応する活性化空間の方向を微調整中に加え評価時に外す予防的な誘導を3つのモデルに適用し、3つの安全性ベンチマーク、特性の表出、一貫性、MMLUを測った（抄録）。", "p5": "予防的な誘導は拒否の振る舞いを変え、その大きさは特性によって異なり、安全面で中立とは言えなかった。著者は誘導の方法を複数の安全性ベンチマークで評価すべきだと結論する（抄録）。", "fun": "AIの「ごますり」を減らす処置をしたら、知識のテストの点は下がらなかった。それで安心と思いきや、危ない頼みを断る態度まで変わっていた、という副作用の話である。一つの性格を直すと別の性格まで動いてしまう点に、AIの性格を調整する難しさがよく表れていて面白い。", "unverified": "使ったモデル名、拒否率の変化の大きさと方向は抄録から確認できない。"}}, {"id": "pr23", "rank": 23, "headline": "LLM検証者の判定は記録の抽象化で保たれるか", "title": "Do Verifier Judgments Survive Abstraction? Measuring Verification Transport for LLM Agent Evaluation", "url": "https://arxiv.org/abs/2611.18471", "authors": "Disha Sheshanarayana ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Sheshanarayana, D., & Goli, S. L. R. (2026). Do Verifier Judgments Survive Abstraction? Measuring Verification Transport for LLM Agent Evaluation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18471", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "LLMによる検証者の判定が、同じエージェントの実行を抽象化した表現で見せると約31%まで崩れることを示し、その安定性を測る試験（Verification Transport）を提案した（抄録）。", "p3": "課題・軌跡・結果・正解・評価基準・検証者を固定したまま、同じ実行のそのままの表示、抽象化した表示、来歴を戻した表示を作り、4つのベンチマーク、7つの検証者のモデル、4つの検証の手順、3種類の抽象化の境界で比べた（抄録）。", "p5": "マクロな抽象化と委任で判定の破綻は約31%に達し、直接の検証は誤った判定を、証拠に基づく手順や熟議的な手順は判定の保留を出しやすかった。来歴を戻すと破綻の85.5%が回復した（抄録）。", "fun": "同じ料理でも、作る過程を全部見た審査員と、完成品の写真だけ見た審査員では評価が変わるかもしれない。AIがAIの仕事を採点するときも同じで、作業の記録が要約されると判定が3割近く崩れることがあった。慎重な審査員ほど「分からない」と答えがちで、間違いが少ないことが信頼の証拠とは限らない点が面白い。", "unverified": "使ったベンチマークと検証者のモデル名、抽象化の境界ごとの数値は抄録から確認できない。"}}, {"id": "pr24", "rank": 24, "headline": "241のLLMはAIの存亡リスクを中央値10%と回答", "title": "Large language models put existential risk from artificial intelligence at 10%", "url": "https://arxiv.org/abs/2611.18219", "authors": "Julian Kauk", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Kauk, J. (2026). Large language models put existential risk from artificial intelligence at 10% (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18219", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "241のLLMに高度なAIが人類の絶滅や恒久的な無力化を招く確率を尋ね、AI自身が自らの技術のリスクをどう述べるかを記録した（抄録）。", "p3": "241のLLMに、利用できるすべての推論設定で同じ問いを投げ、回答の分布を価格・新しさ・推論量と比べ、最も可能性の高い原因も尋ねた（抄録）。", "p5": "中央値は10.0%で、中央90%は3.5〜15.8%と人間の専門家の幅よりずっと狭かった。高価なモデルほど高いリスクを述べ、推論を増やしても推定はほぼ変わらず不確かさが主に高い側へ広がった。ほぼすべてが制御の喪失を最大の原因に挙げた（抄録）。", "fun": "人間の専門家に「AIが人類を滅ぼす確率は？」と聞くと答えは大きくばらつく。ところが241ものAIに同じことを聞くと、多くが10%前後に集まった。ただし著者は、これはAIが自分で考えた答えというより、学習した文章や調整の影響を映した答えだと注意している。AIの「意見」をどう読むべきかを考えさせる点が面白い。", "unverified": "質問文の具体的な形と、モデルごとの回答の詳細は抄録から確認できない。"}}, {"id": "pr25", "rank": 25, "headline": "患者役のLLMがいつ質問すべきかを理論で設計", "title": "When Should a Virtual Patient Ask? RISP-Guided Proactive Information Seeking in Multi-Agent Patient Simulation", "url": "https://arxiv.org/abs/2611.18183", "authors": "Jingyao Cai ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Cai, J., Liu, S., Rehman, A., Li, X., Qintian, Dolby, T., Green, S. M., & Yang, X. (2026). When Should a Virtual Patient Ask? RISP-Guided Proactive Information Seeking in Multi-Agent Patient Simulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18183", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "看護のコミュニケーション訓練用の仮想患者を、患者がいつ何を質問するかを心理学のモデルで決める複数エージェントのシステム（RISP-MAS）として作った（抄録）。", "p3": "情報探索を知覚したリスクと、知っていることと知りたいことの差に結びつけるRISPモデル（リスク情報探索・処理モデル）に基づき、患者の知覚と情報ニーズの評価を、質問するか・いつ・どの不確かさについて聞くかの判断につないだ（抄録）。", "p5": "看護学生と仮想患者の対話の評価で、専門家はもっともらしい情報探索の振る舞いと判断し、学生の感想も肯定的だった（抄録）。", "fun": "病院で不安な患者さんは、説明を聞くうちに「それって大丈夫なの？」と自分から質問する。これまでのAIの模擬患者は聞かれたことに答えるのが中心だった。この研究は、不安の大きさと知りたいことの差から、患者役のAIが自分で質問を切り出す時機を決める。人の気持ちの理論をAIの振る舞いの設計図に使う点が面白い。", "unverified": "評価の参加者数、専門家評価の尺度と数値は抄録から確認できない。"}}, {"id": "pr26", "rank": 26, "headline": "LLMによる審査を道具を使うエージェントへ拡張", "title": "Agent-as-a-Judge", "url": "https://arxiv.org/abs/2611.18067", "authors": "Runyang You ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "You, R., Cai, H., Zhang, C., Xu, Q., Liu, M., Yu, T., Li, Y., & Li, W. (2026). Agent-as-a-Judge (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18067", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "与えられた資料だけで採点するLLM-as-a-Judgeに対し、足りない証拠を自ら集めてから判定する能動的な評価者（Agent-as-a-Judge）の研究を整理した総説（抄録）。", "p3": "評価のための検査とその結果の使い方で範囲を定め、複数エージェントの協働、道具の利用、記憶、計画の4つの観点で設計の空間を整理し、主要なエージェント型の審査の公表スコアをまとめ、欠けている項目を再現した（抄録）。", "p5": "比較では、エージェント型にすることによる利得が評価対象によって不均一で、専用の評価が必要だと示した。費用・信頼性・安全・統治の課題を挙げた（抄録）。", "fun": "テストの採点係が答案だけを見て点をつけるのではなく、必要なら実験をやり直したり資料を調べたりしてから判定する、という発想である。AIの答えを別のAIが審査する時代に、審査役のAIにも「調べる力」を持たせようとしている。審査が賢くなるほど費用と信頼性の問題も増えるという緊張関係が面白い。", "unverified": "再現したスコアの具体的な数値と対象の審査システムは抄録から確認できない。"}}, {"id": "pr27", "rank": 27, "headline": "高齢者ケアの音声エージェントの個別化と忠実度", "title": "Voice-Based Conversational Agents as AI Care Assistants: Evaluating Personalization, Intervention Delivery Fidelity, and Privacy Expectations in Older Adults' Care", "url": "https://arxiv.org/abs/2611.18385", "authors": "Thalia Viranda ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Viranda, T., Wang, S., Bo, J., Yang, Y., Zhang, H., Cuadra, A., Adler, D. A., Boot, W., Czaja, S., Estrin, D., & Choudhury, T. (2026). Voice-Based Conversational Agents as AI Care Assistants: Evaluating Personalization, Intervention Delivery Fidelity, and Privacy Expectations in Older Adults' Care (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18385", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "高齢者向けの多領域の生活習慣介入を音声の会話エージェントARCで届けられることを示し、個別化と介入の忠実度、データ共有への期待を評価した（抄録）。", "p3": "目標、参加者の文脈、根拠に基づく要素を定めたセッションでARCを動かし、高齢者80人の3日間の遠隔研究で6種類のセッション473回（9,183ターン、平均19.4ターン・6分）を分析した（抄録）。", "p5": "使いやすさと受容性は良好だった。領域単位の文脈の再利用は強いが個人の文脈の再利用は控えめで、個別化と忠実度の関連は有意でなく、忠実度の問題は手順からの逸脱より介入要素の伝え漏れだった。データ共有への期待はデータの種類と相手で異なった（抄録）。", "fun": "AIの話し相手が健康のアドバイスをするとき、相手に合わせて話を変えすぎると、本来伝えるべき内容が抜け落ちるかもしれない。この研究は、80人の高齢者との会話記録から、AIが話をそらすことより、伝えるべき要素を言い忘れることの方が問題だと見つけた。満足度だけでは分からない「ちゃんと届いたか」を測った点が面白い。", "unverified": "介入の内容（運動・食事など）の内訳と、忠実度の測り方の詳細は抄録から確認できない。"}}, {"id": "pr28", "rank": 28, "headline": "日本の金融資格試験からLLMの金融知識を評価", "title": "JFinBench: A Continuously Refreshable Japanese Financial Benchmark from the Latest Certification Exams", "url": "https://arxiv.org/abs/2611.18130", "authors": "Issa Sugiura ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Sugiura, I., Makino, T., & Ishida, T. (2026). JFinBench: A Continuously Refreshable Japanese Financial Benchmark from the Latest Certification Exams (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18130", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "会計・税務・FP・銀行業務の6つの日本の資格試験（2026年版）から321問の金融ベンチマークJFinBenchを作り、毎年更新できる構築手順とともに公開した（抄録）。", "p3": "コーディングエージェントが試験ごとの変換コードと確認ページを書き、人がすべての問題を確かめて修正を戻す、人が介在する構築パイプラインで形式の違う試験を取り込み、12のLLMを評価した（抄録）。", "p5": "Claude Fable 5とGPT-6 Astraは全体で93%を超え、最良の公開重みモデルKimi K3.1 ProはClaude Fable 5に12ポイント及ばなかった。端末とWebを使えるとすべてのモデルが向上したが差は約4ポイント残り、順位はほぼ変わらなかった（抄録）。", "fun": "AIの試験は、問題がネットに出回るとAIが答えを覚えてしまい実力が測れなくなる。この研究は、毎年新しく作られる日本の資格試験を使い、試験が出るたびに問題を入れ替えられる仕組みを作った。調べものをさせても成績の順位がほとんど変わらず、頭に入っている知識がやはり大事だと分かった点が面白い。", "unverified": "試験ごとの正答率と、対象の6試験の名称は抄録から確認できない。"}}, {"id": "pr29", "rank": 29, "headline": "クラウドERP導入に会計の専門家を早く関与させる", "title": "The Accountant in the Loop: Accounting Expertise, Artificial Intelligence and Internal Control in Cloud ERP Implementations", "url": "https://doi.org/10.5281/zenodo.24248006", "authors": "Josiel Hissa", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-11-15", "apa": "Hissa, J. (2026). The Accountant in the Loop: Accounting Expertise, Artificial Intelligence and Internal Control in Cloud ERP Implementations. Zenodo. https://doi.org/10.5281/ZENODO.24248006", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoの登録の抄録（OpenAlexから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "クラウドERPの導入で会計の専門家が関わる時期そのものが成果を左右すると論じ、各段階での会計担当者の役割をCOSOの内部統制に結びつける枠組み（AITL）を提案した概念論文（抄録）。未査読の原稿。", "p3": "既存研究と、著者の大手監査法人での監査とOracle NetSuiteの導入の実務経験をもとに、発見から稼働後の支援までの各段階の責任と成果物を定め、会計担当者・AI・ERPの三者関係に拡張して6つの検証可能な命題を示した（抄録）。", "p5": "早期の関与の効果として、手戻りの減少、データ移行の質、月次決算の速さと信頼性、稼働時からの内部統制と監査への備えを挙げる。実証の結果はない（抄録）。", "fun": "家を建ててから水回りの専門家を呼ぶと、配管をやり直す羽目になる。会計システムの導入でも、勘定科目や承認の流れを技術者だけで決めてから会計の専門家を呼ぶと、同じことが起きるという主張である。お金の記録の仕組みを最初の設計図の段階で誰が決めるかが、後の正確さを左右するという視点が面白い。", "unverified": "命題の検証は行われていない。6つの命題の具体的な内容は抄録から確認できない。"}}, {"id": "pr30", "rank": 30, "headline": "位相的データ解析とDMDcで渦を検出し流れを制御", "title": "Active flow control based on topological data analysis and a DMDc reduced-order model for drag reduction", "url": "https://arxiv.org/abs/2611.18336", "authors": "Constantini Mbangue Lobe Yiphta ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Yiphta, C. M. L., & Razafindralandy, D. (2026). Active flow control based on topological data analysis and a DMDc reduced-order model for drag reduction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18336", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "渦度の持続図（位相的データ解析）で有用な渦だけを残す目標の流れを定め、制御つき動的モード分解（DMDc）の縮約モデルとモデル予測制御で、翼まわりの流れの抵抗を下げた（抄録）。", "p3": "渦度の絶対値の持続図で渦を検出・特徴づけ、目標の流れを縮約空間で勾配降下により事前に計算し、制御の各段を小さな凸二次計画に帰着させた（抄録）。", "p5": "振動する航空機の翼まわりの流れに7つの振動数で適用し、主要な渦を保ったまま抗力係数の平均を下げた（抄録）。", "fun": "水の中で手を振ると渦ができるが、渦には役に立つものと邪魔なものがある。この研究は、渦の「形の特徴」を数学の位相幾何学の道具で数え上げ、残したい渦だけを残すように流れを操る。目に見える渦の形を数学で分類し、それを制御の目標にしている点が面白い。", "unverified": "抗力の低減率の数値と、計算の条件（レイノルズ数など）は抄録から確認できない。"}}, {"id": "pr31", "rank": 31, "headline": "小領域で学んだ非線形縮約を大領域へ組み上げる", "title": "Compatible by Construction: Bottom-Up Nonlinear Model Reduction without Interface Bases", "url": "https://arxiv.org/abs/2611.17773", "authors": "Youngkyu Kim ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Kim, Y., & Choi, Y. (2026). Compatible by Construction: Bottom-Up Nonlinear Model Reduction without Interface Bases (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17773", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "小さな訓練領域で学んだ局所の非線形な表現を再利用し、再学習なしで大きな領域のPDEを解く、界面の基底を使わない縮約法を示した（抄録）。", "p3": "共有の非線形デコーダが各部分領域の自由度全体を表し、各大域の自由度は一つの所有者だけを持つので状態は一意に決まり、界面の写しや適合条件が要らない。デコーダを固定し、元の時間離散のPDEの残差を最小にするように部分領域ごとの縮約座標をGauss–Newton法で同時に決める（抄録）。", "p5": "パラメータ化した粘性Burgers方程式と非圧縮Navier–Stokes方程式で、より大きな領域に再学習なしで再利用でき、同じ結合の局所POD（固有直交分解）と比べ、試した範囲で精度と効率のよい釣り合いを示した（抄録）。", "fun": "大きな建物の揺れを計算するのに、小さな部屋の揺れ方だけを学んで、それを並べて全体を組み立てられたら楽である。この研究は、部屋と部屋の境目で食い違いが出ないように、境目の値をどちらか一方の部屋だけが持つ決まりにした。部品を学んで全体を組む発想と、境目の扱いの工夫が面白い。", "unverified": "精度・計算時間の具体的な数値は抄録から確認できない。"}}, {"id": "pr32", "rank": 32, "headline": "メッシュなしの深層エネルギー法で熱き裂を予測", "title": "A mesh-free deep energy method for phase-field modeling of thermally driven brittle fracture", "url": "https://arxiv.org/abs/2611.17630", "authors": "Han Zhang ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Zhang, H., Alamdari, M. M., Shahbodagh, B., Vahab, M., Anitescu, C., Rabczuk, T., & Atroshchenko, E. (2026). A mesh-free deep energy method for phase-field modeling of thermally driven brittle fracture (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.17630", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "き裂の位置や経路を事前に与えずに、熱による脆性き裂の自然な発生、間隔、進展と停止を予測するメッシュなしの深層エネルギー法を示した（抄録）。", "p3": "変位・フェーズフィールドと過渡的な温度を、それぞれ多重解像度の符号化を持つ2つのネットワークで表し、力学のエネルギーと後退オイラーの熱方程式の汎関数を毎回引き直す積分点で評価する。不可逆性をき裂の集合に限るなどで偽の損傷の蓄積を防いだ（抄録）。", "p5": "切欠きのある2つの板で発生のピーク荷重が独立の有限要素の参照とよく一致し、急冷したガラス帯ではき裂の経路が直線から振動、分岐へと変わり、振動の閾値は線形安定性の予測に近かった。急冷したセラミック板では実験で見られる型のき裂の列ができた（抄録）。", "fun": "熱いガラスのコップに冷たい水を注ぐと割れることがある。この研究は、割れ目がどこにできるかを前もって教えなくても、AIを使った計算で割れ目が自然に生まれ、まっすぐ進んだり、くねったり、枝分かれしたりする様子を再現した。割れ方の変化が理論の予測とも合う点が面白い。", "unverified": "計算時間や有限要素法との差（き裂の密度の違いの程度）の数値は抄録から確認できない。"}}, {"id": "pr33", "rank": 33, "headline": "B-スプラインMPMで骨材入りコンクリートの熱と衝撃", "title": "Thermomechanical modelling of concrete with aggregate inclusions using total Lagrangian B-spline material point method", "url": "https://doi.org/10.21203/rs.3.rs-11616577/v1", "authors": "Haitao Ding ほか", "venue": "Research Square (In Review)", "date": "2026-11-16", "apa": "Ding, H., Sun, Z., Xiao, W., & Zhou, X. (2026). Thermomechanical modelling of concrete with aggregate inclusions using total Lagrangian B-spline material point method. https://doi.org/10.21203/rs.3.rs-11616577/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "参照配置で補間を固定する全ラグランジュ型のB-スプライン物質点法（TLBSMPM）を作り、骨材を含むコンクリートの熱と力学の連成（熱伝導・応力波・損傷）を相ごとに解けることを示した（抄録）。未査読。", "p3": "弾性波と曲げのベンチマーク、熱伝導の試験、熱衝撃を受ける片持ち梁、均質と3相のコンクリート円板の衝撃解析で検証した（抄録）。", "p5": "波と熱伝導の誤差は格子の細分で減り、片持ち梁の振動数は梁理論と0.75%以内で一致した。曲げでは更新ラグランジュ型より応力の振動と計算時間が減り、3相の円板では損傷が界面とその周りに集中した（抄録）。", "fun": "コンクリートは、砂利（骨材）とそれを固めるモルタルと、その境目の薄い層からできている。この研究は、熱や衝撃を受けたとき、どこから壊れていくかを粒子を使った計算で調べ、境目の層に損傷が集中することを再現した。材料の中の「つなぎ目」が弱点になるという、身近な構造物にも通じる話が面白い。", "unverified": "衝撃の条件と損傷の量の数値は抄録から確認できない。"}}, {"id": "pr34", "rank": 34, "headline": "粘着性粒子の付着力と剥離エネルギーを測る方法", "title": "A Cantilever-Based Method for Probing Adhesion Force and Kinetic Detachment Energy in Cohesive Granular Materials", "url": "https://arxiv.org/abs/2611.18021", "authors": "Maxime Lajeunesse ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Lajeunesse, M., Rocha, F. M., Dumont, D., Bertin, V., Moratille, Y., Sintes-Zydowicz, N., Drockenmuller, E., & Pouliquen, O. (2026). A Cantilever-Based Method for Probing Adhesion Force and Kinetic Detachment Energy in Cohesive Granular Materials (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18021", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "粘着性のある粒状体で、粒子をはがす準静的な力と、動的にはがすのに要するエネルギーを一つの装置で測る片持ち梁の方法を示し、力とエネルギーが一致しない（分離している）ことを見いだした（抄録）。", "p3": "ガラスの梁の片持ち梁で力を測り、新しいカタパルト方式（はじき出し）でエネルギーを測る。ポリマー被覆のシリカ粒子、湿った粒状体、架橋したPEHAの微粒子の3種類に適用した（抄録）。", "p5": "力とエネルギーが根本的に分離しており、粒子の性質を表すには両方が同じように重要だと示した（抄録）。", "fun": "粉や濡れた砂がくっつき合う強さは、「引きはがす力」で測るのが普通である。この研究は、ゆっくり引きはがす力と、はじき飛ばしてはがすのに必要なエネルギーを別々に測り、その二つが一致しないことを見つけた。くっつきやすさを一つの数字で表せないという発見が面白い。", "unverified": "材料ごとの力とエネルギーの数値は抄録から確認できない。"}}, {"id": "pr35", "rank": 35, "headline": "氷河湖決壊洪水の側岸侵食を2つの様式で解析", "title": "Controls of shear scour and bend impact of glacial lake outburst floods: insights from the 2023 South Lhonak event", "url": "https://doi.org/10.5194/egusphere-2026-6278", "authors": "Pu Li ほか", "venue": "EGUsphere", "date": "2026-11-16", "apa": "Li, P., Hu, K., Wei, L., & Li, H. (2026). Controls of shear scour and bend impact of glacial lake outburst floods: insights from the 2023 South Lhonak event. https://doi.org/10.5194/egusphere-2026-6278", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EGUsphereの討議用原稿の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "2023年10月3日のインド・シッキムの南ロナク湖の決壊洪水で、側岸の侵食をせん断による洗掘と湾曲部の衝撃の2様式に分け、どちらが支配するかを河道の形が決めることを示した（抄録）。討議中の未査読原稿。", "p3": "約68 kmの区間で、洪水の前後の標高モデル、高解像度の画像、HEC-RASの流れの計算を使い、斜め噴流の理論に基づく力学モデルで衝撃圧とせん断応力を比べた（抄録）。", "p5": "湾曲部の頂点の最大の後退速度の平均は4.28 cm/sで洗掘部の2.51 cm/sより大きく、有効な侵食深は52.7 m対15.2 m、侵食後の岸の勾配は61.8°対40.7°だった。湾曲部の衝撃圧は岸のせん断応力を約2桁上回った（抄録）。", "fun": "川が急に曲がるところでは、水が岸に正面からぶつかって深くえぐる。まっすぐなところでは、水が岸をこするように削る。氷河湖が決壊した大洪水では、この二つの削り方で岸の壊れ方がまったく違い、曲がり角の深さは50 m以上にもなった。川の形が災害の壊れ方を決めるという点が面白い。", "unverified": "侵食速度の推定方法の誤差と、HEC-RASの計算条件の詳細は抄録から確認できない。"}}, {"id": "pr36", "rank": 36, "headline": "海氷モデルに輝度温度を直接同化して更新", "title": "Evaluation of direct assimilation of brightness temperature to update Arctic sea-ice model fields", "url": "https://doi.org/10.5194/egusphere-2026-6669", "authors": "Marina Durán Moro ほか", "venue": "EGUsphere", "date": "2026-11-16", "apa": "Durán Moro, M., Lavergne, T., Bertino, L., Palerme, C., Ying, Y., Xie, J., & Sørensen, A. M. (2026). Evaluation of direct assimilation of brightness temperature to update Arctic sea-ice model fields. https://doi.org/10.5194/egusphere-2026-6669", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EGUsphereの討議用原稿の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "衛星から推定した海氷密接度ではなく、AMSR2の輝度温度（レベル1）を北極の海洋・海氷結合モデルに直接同化すると、氷縁域の解析が改善する可能性を示した（抄録）。討議中の未査読原稿。", "p3": "輝度温度はモデルの変数でないため放射伝達モデルを組み込み、海氷域の実効放射率の4つのパラメータ化（固定値、アトラスの気候値、新しいDAL法、機械学習）を比べ、冬季にアンサンブルカルマンフィルタで5つの同化実験を行った（抄録）。", "p5": "DAL法は模擬した輝度温度と観測の平均絶対差が4 K未満で最良だった。氷縁域では、輝度温度の同化は密接度の同化に比べ、観測の密接度との平均絶対差を2〜9%減らした（抄録）。", "fun": "衛星は海氷そのものではなく、氷や海から出る弱い電波の強さ（輝度温度）を測っている。普通はそこから「氷が何割あるか」を計算してからモデルに入れるが、その換算で情報が抜け落ちる。この研究は、換算前の生の観測をそのまま計算に取り込んだ。加工しない方が良い場合があるという点が面白い。", "unverified": "予報の改善の持続時間と、氷の年齢の情報の扱いは抄録から確認できない。"}}, {"id": "pr37", "rank": 37, "headline": "汎用な水理ニューラル作用素で下水道ツインを高速化", "title": "Generalized hydraulic neural operators turbocharging sewer digital twins", "url": "https://arxiv.org/abs/2611.18081", "authors": "Ruozhou Lin ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "apa": "Lin, R., Li, S., Shi, T., Hu, L., Zhang, Z., Tian, W., & Yuan, Z. (2026). Generalized hydraulic neural operators turbocharging sewer digital twins (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.18081", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "サン・ブナン方程式の解で学習した微分可能な多分岐のニューラル作用素で、管内の水理を高速に予測し、未知の管路・ネットワーク・流況に再学習なしで使える下水道のデジタルツインの部品を作った（抄録）。", "p3": "サン・ブナン方程式の数値解を学習データにして、管内の水理を予測するニューラル作用素を学習し、オンラインの予測、データ同化、診断に使った（抄録）。", "p5": "複雑な水理の動きを高い忠実度で再現し、オンラインの予測で千倍から百万倍の高速化を達成し、未知の管路・ネットワーク・流況に再学習なしで汎化した（抄録）。", "fun": "大雨のとき下水管の中で水がどう流れるかを計算するのは時間がかかり、リアルタイムの判断には間に合わない。この研究は、物理の方程式の答えをAIに学ばせて、千倍以上速く同じ答えを出せるようにした。しかも初めて見る下水管でも学び直さずに使える点が面白い。", "unverified": "精度の具体的な指標と、試したネットワークの規模は抄録から確認できない。"}}, {"id": "pr38", "rank": 38, "headline": "SE(3)上の頑健なカルマンフィルタで航法を推定", "title": "Adaptive Robust Filtering Based on SE(3) and Its Application in SINS/DVL Navigation", "url": "https://doi.org/10.21203/rs.3.rs-11442439/v1", "authors": "Liu MingMing ほか", "venue": "Research Square (In Review)", "date": "2026-11-16", "apa": "MingMing, L., & Jinlai, L. (2026). Adaptive Robust Filtering Based on SE(3) and Its Application in SINS/DVL Navigation. https://doi.org/10.21203/rs.3.rs-11442439/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "慣性航法（SINS）とドップラー速度計（DVL）の統合航法で、状態をリー群SE(3)に埋め込んだ変換キュバチャカルマンフィルタに外れ値の検出と再構成を加えた頑健な適応フィルタ（SE(3)-RATCKF）を提案した（抄録）。未査読。", "p3": "従来のオイラー角の誤差モデルによる状態空間の不整合を解くため左右の誤差のTCKFを構成し、カイ二乗検定とHuber法で更新段階のイノベーションを実時間で検査して異常な計測を再構成した（抄録）。", "p5": "船上のSINS/DVLの実験で、従来法に比べ大きな初期の姿勢誤差のもとで航法の精度が上がり、外れ値を抑え、正常時の過補正も避けたと報告する（抄録）。", "fun": "船の位置を知るには、加速度と回転を測るセンサと、海底に当てた音で速さを測る装置を組み合わせる。ところが向きの表し方によっては、計算の中で姿勢と速さの関係がずれてしまう。この研究は、回転と移動を一体で扱う数学（リー群）を使ってこのずれを根本から防いだ。表し方を変えるだけで推定が安定する点が面白い。", "unverified": "精度の改善の数値と実験の条件は抄録から確認できない。"}}, {"id": "pr39", "rank": 39, "headline": "CNT混入セメントの自己検知性を連成FEで解析", "title": "Coupled Ionic–Electronic Finite Element Modeling of Piezoresistivity in Carbon Nanotube-Reinforced Cement Composites", "url": "https://doi.org/10.20944/preprints202611.1497.v1", "authors": "Yong-Sen Yang ほか", "venue": "Preprints.org", "date": "2026-11-16", "apa": "Yang, Y.-S., Wang, Y.-F., Zhang, J.-H., Zhao, Y., & Lin, Q.-L. (2026). Coupled Ionic–Electronic Finite Element Modeling of Piezoresistivity in Carbon Nanotube-Reinforced Cement Composites. https://doi.org/10.20944/preprints202611.1497.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "空隙率とCNT量が空間的に変わるセメント複合材のピエゾ抵抗（ひずみで電気抵抗が変わる性質）を、イオンと電子の伝導を連成した3次元の電気-力学有限要素モデルで説明できるようにした（抄録）。未査読。", "p3": "細孔溶液のイオン伝導とCNTの接触・トンネルの電子伝導を組み合わせ、両ネットワークの連結性をすき間の開閉を区別する主ひずみで変化させるモデルを作り、CNTを0.5%含むモルタルの3つの含水状態の繰返し一軸圧縮試験で較正した（抄録）。", "p5": "負のピエゾ抵抗の応答を再現し、乾燥で分極が減るほど一致がよくなった。空隙率を0.30から0.22に下げると最小の正規化電圧は0.949から0.841に下がり、三軸圧縮で最大の応答（0.82対一軸の0.94）となった（抄録）。", "fun": "コンクリートに炭素の細い管（カーボンナノチューブ）を混ぜると、押されたときに電気の通りやすさが変わり、建物自体がひずみのセンサになる。この研究は、その仕組みを水の中のイオンと管を伝わる電子の二つの電流に分けて計算で再現した。材料そのものをセンサにする発想と、その中身の解明が面白い。", "unverified": "実構造物での検証は行われていない。モデルのパラメータ数と較正の誤差は抄録から確認できない。"}}, {"id": "pr40", "rank": 40, "headline": "都市の水関連の自然基盤解決策の資金調達", "title": "Finance Options for Nature-based Water Solutions", "url": "https://doi.org/10.5281/zenodo.24276823", "authors": "Abdur Rashid ほか", "venue": "Zenodo", "date": "2026-11-16", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Zenodoの登録の説明（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "都市の水関連の自然を基盤とした解決策（NbS）の補助・融資・保険の選択肢と、その利用を左右する財務・制度・規制・統治の条件を整理したプロジェクト報告書（NATURGOのD2.2）（抄録）。", "p3": "NbS、都市の水管理、金融、保険、統治に関する学術文献と灰色文献のスコーピングレビューに基づく（抄録）。", "p5": "社会的便益は大きいが直接の収益が小さいNbSでは公的資金が基本であり、運用・監視・維持の財源が不安定だと指摘し、ブレンデッド・ファイナンス、グリーンボンド、官民連携、生態系サービスへの支払い、雨水の料金、土地の価値の取り込み（value capture）、成果連動型の資金、保険などを補完策に挙げた（抄録）。", "fun": "公園の緑地や雨を吸い込む地面は、洪水を減らすなど街全体に役立つが、直接お金を生まないので維持費が後回しになりがちである。この報告書は、税金だけでなく、土地の値上がり分を回収する仕組みや保険など、さまざまな財布を組み合わせる方法を整理した。「みんなの得」をどう払うかという問いが面白い。", "unverified": "スコーピングレビューの対象文献の数と選定方法は抄録から確認できない。"}}, {"id": "pr41", "rank": 41, "headline": "de Jong Gierveldの孤独尺度のマニュアル改訂版", "title": "Manual of the Loneliness Scale", "url": "https://doi.org/10.5281/zenodo.24279035", "authors": "van Tilburg ほか", "venue": "Zenodo", "date": "2026-11-16", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoの登録の説明（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "Jenny de Jong Gierveldが開発した孤独尺度の使い方をまとめたマニュアルの改訂版で、1999年版を更新した（抄録）。", "p3": "オランダ語と英語の項目、他言語の検証済みの翻訳への参照、使用の条件、得点の計算方法、方法論と内容の考察、短縮版、カットオフ値を収録している（抄録）。", "p5": "新しい実証結果を報告するものではなく、尺度の利用者向けの資料である（抄録）。", "fun": "「寂しさ」は目に見えないので、決まった質問への答えを点数にして測る。同じ物差しを世界中で使えば国や時代の比較ができるが、そのためには質問文や採点の決まりをそろえる必要がある。この資料は、その共通の物差しの取扱説明書である。心の状態を測る道具にも説明書が要るという点が面白い。", "unverified": "改訂で変わった点（カットオフ値の変更の有無など）は抄録から確認できない。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "統計学", "headline": "高級車を選択肢に加えると最安の配車が売れる", "title": "Irregular Demand: The Anti-Compromise Effect in the Field", "url": "https://doi.org/10.3386/w36013", "authors": "Nicola Gennaioli ほか", "venue": "NBER Working Paper", "why": "Lyftの720万人・4,700万回の選択で高級な配車の表示と価格を無作為化した自然フィールド実験で、選択肢を加えると既存の選択肢の需要は減るという規則性に反し、最も安い選択肢と買わない選択が増えた。効果は高級車の価格と繰り返しの表示で強まり、表示がない回にも残り、合理的推論や不注意では説明できないと報告する。"}, {"id": "pn02", "rank": 2, "field": "統計学", "headline": "高次元の正規近似で1/√nに近い速さを達成", "title": "High-Dimensional Gaussian and Bootstrap Approximation: Near $1/\\sqrt{n}$ Rates with General Covariance", "url": "https://arxiv.org/abs/2611.17923", "authors": "Miles E. Lopes ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "why": "p次元の独立同分布ベクトルの和について、長方形上のBerry–Esseen型の誤差が共分散に制約を置かなくてもlog(pn)の因子を除き1/√nの次数で抑えられるかという長年の未解決問題に、劣ガウスの条件のもとで肯定的に答えた。題名のとおり、ガウス近似とブートストラップ近似の両方を扱う。"}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "介護の生産性低下が介護の価格上昇を生む", "title": "Aging and Structural Change: Cost Disease in the Care Sector", "url": "https://doi.org/10.3386/w36024", "authors": "Nick Pretnar ほか", "venue": "NBER Working Paper", "why": "市場の生産性の伸びがサービスを家庭の外へ移してきたのに対し、公的な介護は生産性の伸びが負である例外だと示した。インフォーマルな介護を含む2部門の世代重複の一般均衡モデルで、介護の相対価格の上昇は人口構成ではなくこの低下で説明でき、価格が上がると高齢者は介護以外の消費へ代替し、インフォーマルな介護に負担が移ると論じる。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "社会的企業の効果測定で売上と資金調達が倍増", "title": "Measuring the Impact of Impact Measurement", "url": "https://doi.org/10.3386/w36009", "authors": "Emanuele Colonnelli ほか", "venue": "NBER Working Paper", "why": "インドの高成長の社会的企業で、インパクト測定の支援を無作為に割り付けた初の実験を行い、処置群は売上の伸びと資金調達額がほぼ2倍になった。投資家への実験でも、定量化されたインパクト指標には強く反応し一般的な記述には反応しないと報告する。"}, {"id": "pn05", "rank": 5, "field": "因果推論", "headline": "小学校の学びの差が15年後の所得を高める", "title": "Learn to Earn: The Long-Term Effects of Foundational Learning", "url": "https://doi.org/10.3386/w36030", "authors": "Tahir Andrabi ほか", "venue": "NBER Working Paper", "why": "パキスタンの児童を15年追跡し、学校の付加価値と村単位の無作為の情報介入という2つの識別戦略で、低所得国で初めて小学校の学習と成人後の学歴・所得の因果関係を示した。よりよい学校に通うことによる生涯所得の増加も金額で試算している。"}, {"id": "pn06", "rank": 6, "field": "因果推論", "headline": "誤指定のGMMでも有効な直交スコアでDML", "title": "Orthogonal Scores and Double/Debiased Machine Learning for Possibly Misspecified GMM", "url": "https://arxiv.org/abs/2611.17578", "authors": "Byunghoon Kang", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "why": "モーメント条件が厳密には成り立たない過剰識別のGMMでも有効なNeyman直交スコアを閉じた形で構成し、二重／脱バイアス機械学習（DML）を誤指定に頑健にした。従来の構成はモーメント条件の厳密な成立を前提としていた。"}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "AIの影響は失職が先に、雇用創出は後に表れる", "title": "AI and the Two Margins of Work: Why Job Losses Show Up Before Job Creation", "url": "https://arxiv.org/abs/2611.17530", "authors": "Mark Esposito ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "why": "技術変化は既存の活動内の調整と新しい活動の創出という2つの経路で労働需要に作用し、給与統計は前者をすぐに後者を遅れて記録すると論じた。コンピュータ時代には1978年以降に参入した企業が1998年に給与総額の42%を占めたなどの事実から、AIでも雇用の喪失が創出より先に統計に現れると示す。"}, {"id": "pn08", "rank": 8, "field": "経済学", "headline": "自動緊急ブレーキの標準装備で追突の負傷が減少", "title": "Crash Injuries and Fatalities in the United States Following Standardization of Automatic Emergency Braking", "url": "https://doi.org/10.3386/w36028", "authors": "Vishal Patel ほか", "venue": "NBER Working Paper", "why": "2017〜2022年に39車種で自動緊急ブレーキが任意から標準装備になった段階的な導入を自然実験として使い、全米で自車が起こした追突による負傷の割合が13.9%から8.0%に下がったと報告する。任意装備では選ぶ運転者が異なるという選択の偏りを避けた設計である。"}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "同等の企業でも貧しい国では投資の関心が下がる", "title": "How Does Capital Flow To Poor Countries? Evidence from Venture Capital and Private Equity", "url": "https://doi.org/10.3386/w36036", "authors": "Emanuele Colonnelli ほか", "venue": "NBER Working Paper", "why": "108か国の投資家1,485人に、企業の特徴・所在地・条件を無作為化した仮想の投資案件を評価させる誘因つきの実験で、基礎的条件への反応は同じでも、貧しい国の企業は同等でも関心が大きく下がることを示した。"}, {"id": "pn10", "rank": 10, "field": "地震工学・防災", "headline": "都市の地震死者推計の不確かさは倒壊判定が主因", "title": "Collapse misclassification dominates the uncertainty in city-scale earthquake fatality estimates: a validated probabilistic seismic risk model for the residential building stock of Peshawar, Pakistan", "url": "https://doi.org/10.21203/rs.3.rs-11492895/v1", "authors": "Wasim Khan ほか", "venue": "Research Square (In Review)", "date": "2026-11-16", "why": "パキスタン・ペシャワル県の住宅36万1,357棟（人口431万人）について事象ベースの確率論的地震リスクモデルを更新し、死者推計を検証した。題名のとおり、倒壊の誤分類が都市規模の死者推計の不確かさを支配すると報告する。"}, {"id": "pn11", "rank": 11, "field": "組織行動・心理的安全性", "headline": "ワーク・エンゲイジメントの交差遅延効果を再検証", "title": "No convincing evidence for prospective effects between work engagement, burnout, and personality traits: A reassessment of Fukuzaki and Iwata (2027)", "url": "https://doi.org/10.31234/osf.io/k4tp3", "authors": "Kimmo Sorjonen ほか", "venue": "PsyArXiv", "date": "2026-11-16", "why": "Fukuzaki and Iwataが交差遅延パネルモデルでワーク・エンゲイジメント、バーンアウト、性格特性の間に前向きの影響があると結論したのに対し、同じ標本サイズと相関行列を再現した模擬データで、有意な交差遅延係数は別の統計的過程でも生じることを示し、前向きの影響の説得的な証拠はないと再評価した。"}, {"id": "pn12", "rank": 12, "field": "機械学習", "headline": "反論に流されず正解を保つ能力をLLMに学ばせる", "title": "Benchmarks Don't Talk Back: Learning Through Self-Disagreement", "url": "https://arxiv.org/abs/2611.17563", "authors": "Soheil Abbasloo ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "why": "LLMは誤った反論でも正しい答えを手放すことがあり、それは正確さの不足ではなく、立場を保つべき時と譲るべき時を見分ける独立した能力（弁証法的能力）の問題だと論じ、自己の不一致から学ぶ方法を提案した。"}, {"id": "pn13", "rank": 13, "field": "統計学", "headline": "因果探索の結果に解釈できる信頼領域を与える", "title": "Interpretable confidence regions for causal discovery", "url": "https://arxiv.org/abs/2611.17771", "authors": "Jian Kang ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "why": "観察データから同定されるCPDAG（因果グラフの同値類）について、条件付き独立性の検定を摂動させて妥当なグラフを生成するperturbed PCをもとに、解釈できる信頼領域を構成した。因果探索の多くは点推定にとどまり、構造の不確かさの扱いが手薄だった。"}, {"id": "pn14", "rank": 14, "field": "機械学習", "headline": "単体のアラインメントはチームのAIに移らない", "title": "Aligning AI Teams", "url": "https://arxiv.org/abs/2611.17820", "authors": "Siddarth Srinivasan ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-16", "why": "個々のLLMエージェントへのアラインメント訓練が複数エージェントの協働では効かなくなる仕組みを、ソフトウェア開発の2課題とコンサルティング提案の10課題で調べ、チームへの移転を保つ介入を検討した。"}, {"id": "pn15", "rank": 15, "field": "経済学", "headline": "自営と給与所得の課税の不公平は垂直的不公平並み", "title": "Horizontal Equity of Taxation: Citizen Beliefs and Policy Preferences", "url": "https://doi.org/10.3386/w36007", "authors": "Pierre Bachas ほか", "venue": "NBER Working Paper", "why": "途上国29か国の税のミクロシミュレーションと家計調査で、自営業者への課税が難しいために生じる同じ所得の納税者間の水平的不公平が垂直的公平と同程度の大きさで、給与所得者に偏る累進的な改革で悪化すると示した。パキスタンでの情報提供の無作為化実験で人々の認識と政策選好も調べた。"}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "合理的不注意の離散選択モデルをセミパラで推定", "title": "Estimating a Rational Inattention Discrete Choice Model: A Semiparametric Approach", "url": "https://arxiv.org/abs/2611.18479", "authors": "Hanqi Wang", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "why": "選択は選択肢の利得とその利得について決定前に学ぶ情報に依存するとして、選択データから観察されない利得の異質性と情報取得の費用の両方を識別できることを示し、外生的な利得と情報費用のシフターのもとでのセミパラメトリックな点識別の条件を与えた。"}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "正の重みだけではTWFEの推論は保証されない", "title": "Positive Weights Do Not Certify TWFE Inference: A Design Diagnostic under Treatment-Effect Heterogeneity", "url": "https://arxiv.org/abs/2611.18116", "authors": "Stanis{\\l}aw M. S. Halkiewicz", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "why": "処置効果が異質なとき、すべての処置の重みが正でも二元固定効果（TWFE）の推論は一様に妥当とは限らないことを示し、局所的な処置効果のずれのもとでの最悪の偏りの大きさを設計だけから計算できる診断量を提案した。"}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "途上国のインフラは最後の裁定機会になりうる", "title": "The Last Arbitrage? Capital Flows, Development, and Infrastructure as an Asset Class", "url": "https://doi.org/10.3386/w36022", "authors": "Anusha Chari ほか", "venue": "NBER Working Paper", "why": "なぜ資本は豊かな国から貧しい国へ流れないかというLucasの問いについて、途上国の株式市場の開放で生まれた資産クラスとの対比から、インフラが最後の裁定機会になりうると論じた。貧しい国の舗装道路の社会的収益率の中央値は自由化当時の米国の資本収益率の3.7倍だが、投資家が得るのは契約や料金で確保できる部分だけだと指摘する。"}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "H-1Bなど一時的な高技能移民の労働市場への影響", "title": "The Labor Market Impact of Temporary High-Skill Immigration Programs", "url": "https://doi.org/10.3386/w36014", "authors": "George J. Borjas", "venue": "NBER Working Paper", "why": "米国コミュニティ調査で一時的な高技能就労者を特定し、学歴と専攻ごとの供給を測った。最も影響を受ける技能層の自国民は所得の伸びが鈍り通年フルタイムの就業が相対的に減ったと報告し、資格の終了後も残る人を含むモデルで影響を評価する。"}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "技能の供給が少ない国ほど大企業の雇用が少ない", "title": "Skill Supply, Firm Size, and Economic Development", "url": "https://econpapers.repec.org/RePEc:iza:izadps:dp19052", "authors": "Gottlieb ほか", "venue": "RePEc NEP", "date": "2026-11-16", "why": "57か国の労働者の学歴・賃金と雇用主の規模を結びつけた統一のミクロデータで、技能の賦存が少ない国ほど大企業での雇用が少なく技能プレミアムが大きく、大企業は技能集約的であるなど4つの事実を示した。"}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "戦略的に単純な仕組みでも選好は見分けにくい", "title": "Menu Design Meets Market Design: Strategic Simplicity vs. Choice Complexity", "url": "https://arxiv.org/abs/2611.17984", "authors": "Gian Caspari ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "why": "虚偽の申告の誘因をなくす戦略的な単純さと、参加者が自分の選好を見分けられることは別の問題だとして、逐次独裁制で実労働の課題の組み合わせを選ぶ誘因つきの実験を行い、選択の複雑さの影響を調べた。"}, {"id": "pn22", "rank": 22, "field": "因果推論", "headline": "サステナブル債の発行が企業統治の採用を促す", "title": "Investment and Governance: Through The Lens of Sustainability", "url": "https://doi.org/10.3386/w36011", "authors": "Jitendra Aswani ほか", "venue": "NBER Working Paper", "why": "2013〜2022年の公開企業のサステナブル債3,944件で、不均一分散に基づく識別により、サステナブルな負債の比率が1%上がるとサステナビリティの統治を採用する確率が9.2%上がり、採用は環境パフォーマンスを16%改善する（構造推定）と報告する。効果は非金融企業に限られる。"}, {"id": "pn23", "rank": 23, "field": "因果推論", "headline": "地元警察の移民取締り権限で軽微な逮捕が増加", "title": "Crime on ICE: Local Police Behavior and Immigration Enforcement in the United States", "url": "https://doi.org/10.3386/w36026", "authors": "John J. Donohue ほか", "venue": "NBER Working Paper", "why": "2000〜2024年のFBI統一犯罪報告で、地元警察が連邦の移民法を執行する権限を得た時期の違いを使い、軽微で裁量的な犯罪の逮捕が約7%増えた一方、それに見合う犯罪の減少は見られないと報告する。"}, {"id": "pn24", "rank": 24, "field": "因果推論", "headline": "連邦のフォニックス教育事業の学力への効果", "title": "Decoding Success: Phonics-based Instruction and Student Achievement", "url": "https://doi.org/10.3386/w36018", "authors": "Alex Hollingsworth ほか", "venue": "NBER Working Paper", "why": "No Child Left Behindのもとで年約10億ドル規模だった連邦の読解教育事業Reading Firstを対象に、フォニックス（音と綴りの対応）に基づく指導が生徒の学力に与えた効果を分析した。"}, {"id": "pn25", "rank": 25, "field": "因果推論", "headline": "製品ごとの実験の効果をサイト全体の影響に換算", "title": "Making Experiment Results Comparable through Sitewide Impact Estimation", "url": "https://arxiv.org/abs/2611.18411", "authors": "Xiaochen Zhang ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "why": "Robloxの多様な製品面では、無作為化実験の効果はその標本の利用者についてしか分からず、面ごとの到達範囲と全体指標への寄与が違うため比較できないとして、実験の効果をサイト全体への影響に換算する推定法を示した。"}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "干渉のある集団で処置対象を資源制約つきで最適化", "title": "Constrained Stochastic Policy Targeting under Heterogeneous Partial Interference", "url": "https://arxiv.org/abs/2611.18444", "authors": "Elena Dal Torrione ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "why": "処置が本人への直接効果と他者への間接効果を通じて集団の平均に効く不均一な部分干渉のもとで、資源の制約のもとで確率的に処置対象を選ぶ政策を設計する方法を示した（例：感染を広げやすい人へのワクチン接種）。"}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "極値間の因果の強さを測る係数の漸近理論", "title": "Causal and conditional tail coefficients: asymptotics, inference and graph recovery", "url": "https://arxiv.org/abs/2611.18225", "authors": "Axel B\\\"ucher ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "why": "ある変数の極端な値が別の変数に与える影響を測る因果テール係数について、順位に基づく推定量の漸近理論を非パラメトリックな条件で確立し、推論と因果グラフの復元に用いた。"}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "楽観補正後の信頼区間を推定対象ごとに分ける", "title": "Estimand-specific bootstrap confidence intervals after optimism correction for prediction models", "url": "https://arxiv.org/abs/2611.17774", "authors": "Seiya Takano ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "why": "ブートストラップで楽観度を補正した予測モデルの性能の信頼区間が何を覆うかは推定対象次第だとして、観測標本から作った最終モデルの性能と、モデル開発を繰り返したときの平均性能を区別し、それぞれに合う区間を示した。"}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "仮想評価法と選択実験の支払意思額はいつ一致するか", "title": "When Do Contingent Valuation And Discrete Choice Experiments Converge? Evidence From A Meta-Analysis Of Environmental Valuation Studies", "url": "https://doi.org/10.2139/ssrn.7691682", "authors": "Giovanni Signorello ほか", "venue": "SSRN", "date": "2026-11-16", "why": "40の環境評価研究の60の研究内比較を明示的な比較可能性の規則で集めたメタ分析で、選択実験（DCE）の支払意思額が仮想評価法（CV）より高い傾向と、両者が一致する条件を調べた。"}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "高次元固定効果の回帰をStataで高速に推定", "title": "fereg: Fast High-Dimensional Fixed-Effects Regressions in Stata", "url": "https://doi.org/10.3386/w36017", "authors": "Johannes F. Schmieder", "venue": "NBER Working Paper", "why": "多数の固定効果を含む線形回帰とポアソン疑似最尤推定を高速に行うStataのコマンドfereg・feppmlを提示した。固定効果の構造に応じて射影・Krylov・マルチグリッドの解法を選び、結果を検査してから出力する。"}, {"id": "pn31", "rank": 31, "field": "統計学", "headline": "大学生のAI利用と学習への影響を追うパネル調査", "title": "Impacts of AI in Higher Education: A Panel Survey of Undergraduates", "url": "https://doi.org/10.3386/w36021", "authors": "Bruce Sacerdote ほか", "venue": "NBER Working Paper", "why": "ダートマス大学の学生、高校の最終学年の生徒、全米の大学生の標本への調査の第1波で、学習に有害な課題と有益な課題の両方でAIが広く使われ、自分より他人の不正利用を多く報告し、92%がAIの利用は文章力に有害だと考えていると報告する。"}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "教師の重みを折り畳んで小さな言語モデルを作る", "title": "Folding Language Models into Themselves", "url": "https://arxiv.org/abs/2611.18113", "authors": "Ziyang Zhang ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "why": "知識蒸留で生徒を一から学習するのではなく、教師の隣り合うN層を1つの共有ブロックに折り畳みN回繰り返し実行する方法（Concertina）で、教師の重みから直接生徒を作る。"}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "言語化されない直列の思考の深さを測る指標", "title": "An Operationalization of Opaque Serial Depth", "url": "https://arxiv.org/abs/2611.17495", "authors": "Nathan Sheffield ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "why": "思考の連鎖（CoT）による監視が将来の構造変化で効かなくなる恐れから、モデルが言語化せずに行える直列の計算量の代理指標として、不透明な直列の深さを操作的に定義した。"}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "14万件の実行記録からコーディングAIの行動を読む", "title": "Interpreting Coding Agents Through Their Behavioral Trajectories", "url": "https://arxiv.org/abs/2611.17440", "authors": "Ibragim Badertdinov ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-16", "why": "117モデル・125構成のコーディングエージェントの実行軌跡14万3,209件を規則ベースのパーサで高水準の行動に変換して比較し、成否だけの評価では見えない振る舞いを分析した。"}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "GPSを消しても車のCAN信号から経路を復元", "title": "CANTraj: Recovering Vehicle Trajectories from CAN Signals in Naturalistic Driving", "url": "https://arxiv.org/abs/2611.18442", "authors": "Yuhang Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-16", "why": "運転データの公開や利用ベースの保険はGPS記録を除けばプライバシーを守れるとする前提に対し、車両のCAN信号に残る情報から走行軌跡を復元できることを自然な運転データで示した。"}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "時系列基盤モデルの汎化の源を切り分ける", "title": "FlexCast: Flexible Context Learning for Time Series Foundation Models", "url": "https://arxiv.org/abs/2611.17862", "authors": "Zuyang Shen ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "why": "自己回帰型の時系列基盤モデルでは可変な文脈への条件づけと予測単位の分解が絡み合い汎化の源が分からないとして、両者を切り離した柔軟な文脈学習（FlexCast）を提案した。"}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "安定限界を超える歩幅の勾配降下法の収束理論", "title": "Classification with Large-Step Gradient Descent: Unifying Self-Stabilization and Convergence Rates", "url": "https://arxiv.org/abs/2611.17459", "authors": "Salma Tarmoun ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "why": "古典的な安定性の閾値を超える歩幅の勾配降下法は損失が振動しながらも速く収束し汎化もよいことが多いが理論は不完全だったとして、分類問題で自己安定化と収束の速さを統一的に説明した。"}, {"id": "pn38", "rank": 38, "field": "機械学習", "headline": "AIによる査読は付録の内容に偏る", "title": "AI Reviews Are Biased Towards the Appendix", "url": "https://arxiv.org/abs/2611.17811", "authors": "Saptarshi Ghosh ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-16", "why": "査読者がLLMで論文の弱点を洗い出すことが増え、その出力が人の査読に影響するなかで、LLMの査読が論文の付録の内容に偏ることを示した。"}, {"id": "pn39", "rank": 39, "field": "経営学", "headline": "アルゴリズムの不透明さを依頼人-代理人問題で分析", "title": "Algorithmic Opacity as a Principal-Agent Problem", "url": "https://arxiv.org/abs/2611.17980", "authors": "Ignacio Cofone ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "why": "悪用の防止や企業秘密を理由とするアルゴリズムの不透明さが、社会的な利益より私的利益を優先する意思決定者の戦略的な行動を隠しうるとして、依頼人-代理人の問題として定式化した。"}, {"id": "pn40", "rank": 40, "field": "経営学", "headline": "共有のAI計算基盤の市場設計と投資の誘因", "title": "Market Design for Shared AI Infrastructure: Investment Incentives, Allocation, and Competition", "url": "https://doi.org/10.2139/ssrn.7691321", "authors": "Donghyun Lee", "venue": "SSRN", "date": "2026-11-16", "why": "異なるAI計算資源を中立的な連合で共有する制度が、独自の基盤や既存のクラウド市場より厚生を改善する条件を、投資の誘因・配分・競争の観点から分析した。"}, {"id": "pn41", "rank": 41, "field": "経営学", "headline": "既存の記録からコンテンツ審査の品質を検証", "title": "Accounting for Trust and Safety: Bounding Content-Moderation Quality from Records You Already Hold", "url": "https://arxiv.org/abs/2611.18437", "authors": "Aayush Agarwal ほか", "venue": "arXiv", "date": "Mon, 16 Nov 2026", "why": "プラットフォームが専門家の監査で示すコンテンツ審査の品質を、異議申し立てによる取り消しなど既に持っている記録から形式的に検証する方法（品質の上下限）を開発した。"}, {"id": "pn42", "rank": 42, "field": "工学", "headline": "共分散のクロネッカー近似で逆問題を効率よく解く     "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
