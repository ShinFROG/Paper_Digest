<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

成り立たせる", "title": "Semiparametric Inference in Panel Data with Interactive and High-dimensional Confounding", "url": "https://arxiv.org/abs/2611.14385", "authors": "Bin Chen ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "高次元の共変量と潜在的な交互作用の交絡があるパネルでは通常のダブル機械学習が崩れることを示し、処置側と誘導形の因子空間を推定する因子拡張DML（FA-DML）を提案した。二重射影と単位ごとの3分割のクロスフィッティングで推定誤差の影響を抑える。"}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "集計処置の動学効果の偏りを操作変数で除く", "title": "Hedging out the HEDGE Bias: Identifying Dynamic Partial-Equilibrium Effects with Panel LP-IV", "url": "https://arxiv.org/abs/2611.14434", "authors": "Endong Wang ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "集計的な処置への曝露と交絡への曝露が相関すると、横断面の設計は動学的な部分均衡効果にバイアスを持つことを解析的に示した。交絡の経路を固定して比べるHELP-IV（異質曝露の局所射影・操作変数）が部分均衡効果を識別できると証明し、州の財政乗数などに適用した。"}, {"id": "pn04", "rank": 4, "field": "統計学", "headline": "LLMの順位づけで人手評価とLLM審判を併用して推論", "title": "Prediction-Powered LLM Ranking with Adaptively Collected Human Feedback", "url": "https://arxiv.org/abs/2611.13186", "authors": "Gabriel Sargent ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "人手の評価が高価なため適応的に集める状況で、LLM審判の予測と人手を組み合わせるPP-Rankを提案した。審判のバイアスと適応的な依存があっても妥当な推論ができ、漸近正規性と同時信頼区間を示す。"}, {"id": "pn05", "rank": 5, "field": "因果推論", "headline": "表形式基盤モデルで因果媒介分析の信頼区間を作る", "title": "MediPFN: Amortized In-Context Nuisance Learning and Inference for Causal Mediation Analysis", "url": "https://arxiv.org/abs/2611.13219", "authors": "Shi Bo ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "事前学習済みの表形式基盤モデルを副次関数の予測に使い、クロスフィットした影響関数推定量と、シミュレーションで学習した誤差分位点の別ヘッドで信頼区間を作るMediPFNを提案した。複数の副次関数の推定の不確実性を償却的に扱う。"}, {"id": "pn06", "rank": 6, "field": "因果推論", "headline": "処置クラスターの操作変数は何を識別するか", "title": "Instrumental variables with treatment clusters", "url": "https://arxiv.org/abs/2611.13313", "authors": "Didier Nibbering ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "複数の順序なしの処置をクラスターにまとめて操作変数法を使うと、元の処置のレベルの仮定のもとで局所平均処置効果の加重平均が識別されることを示した。元の処置選択のデータがあれば因果解釈の必要条件を検定でき、専攻分野（STEMと非STEM）の効果で例示する。"}, {"id": "pn07", "rank": 7, "field": "因果推論", "headline": "波及があっても予測ベースの反事実で効果を識別", "title": "Causal Inference under Interference with Forecast-Based Counterfactuals", "url": "https://doi.org/10.2139/ssrn.7682605", "authors": "Viviana Celli ほか", "venue": "SSRN", "date": "2026-11-11", "why": "処置の波及があり汚染されていない対照がない場合に、予測にもとづく反事実の方法が平均処置効果と波及効果を識別・推定できる条件を、潜在結果の枠組みで初めて形式的に分析した。シミュレーションと実証で、対照ベースの方法との長所と限界を比べる。"}, {"id": "pn08", "rank": 8, "field": "因果推論", "headline": "部分的な因果構造でも最小介入集合を求める", "title": "Generalizing Causal Decision-Making: Markov Equivalence, Transportability and Counterfactuals", "url": "https://arxiv.org/abs/2611.14066", "authors": "Min Woo Park ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "構造的因果バンディットを、因果構造が部分的にしか分からない場合・他環境の情報・実現可能な反事実的行動へ拡張した。マルコフ同値のもとでの最小介入集合の図的な基準と探索アルゴリズム、部分的な移送可能性による報酬の上下界、後悔の保証を示す。"}, {"id": "pn09", "rank": 9, "field": "経営学", "headline": "2つの差の差分析が同じ企業の同時調整かを診断", "title": "From Two Effects to Joint Responses: Difference-in-Differences Diagnostics for Strategy Research", "url": "https://doi.org/10.2139/ssrn.7682778", "authors": "Josh Feng ほか", "venue": "SSRN", "date": "2026-11-11", "why": "環境の変化に企業が複数の選択を一緒に調整するかは、2つの差の差分析の平均効果だけでは分からない。独立な反応・意思決定の依存・共通の企業要因が同じ効果の組を生むことを示し、超過同時反応（EJR）の統計量を提案して4つの事例で適用した。"}, {"id": "pn10", "rank": 10, "field": "経済学", "headline": "若年失業者への集中的な就職支援で就業確率が約10%上昇", "title": "Active Labor Market Policy for Unemployed Youths", "url": "https://doi.org/10.2139/ssrn.7690604", "authors": "Jeremy Hervelin ほか", "venue": "SSRN", "date": "2026-11-11", "why": "フランスの大規模プログラムPACEAを、担当者へのほぼランダムな割当と担当者ごとの参加させやすさを使う操作変数法で評価した。完了後の就業確率が約10%上がるが、効果は就業の有無の面に限られ、賃金・契約の安定・職業の向上は伴わない。"}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "2025年の関税は売上と売上原価を3四半期で約1.2%減らした", "title": "Trade Wars on the Income Statement: The Effects of Tariffs on Firms", "url": "https://doi.org/10.2139/ssrn.7683087", "authors": "Omar Barbiero ほか", "venue": "SSRN", "date": "2026-11-11", "why": "2018年と2025年の米国の関税への企業の曝露を、自社の輸入・仕入先の輸入・外国の報復で作り、四半期の財務諸表で効果を推定した。2025年は直接の輸入企業で売上と売上原価が3四半期内に約1.2%、仕入先経由で約0.5%減り、価格への一部転嫁と生産の縮小が見られ、報復は粗利益率を圧縮した。2018年の効果は小さい。"}, {"id": "pn12", "rank": 12, "field": "機械学習", "headline": "有限予算ではスケーリング則が対数の直線からずれる", "title": "Beyond the Log-Linear Frontier: Pre-Asymptotic Analysis of Finite-Budget Neural Scaling Laws", "url": "https://arxiv.org/abs/2611.13534", "authors": "Tianyu Zhao ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "従来のスケーリング則は誤差を容量とデータ量の分離したべき乗則で表すが、有限予算では学習曲線と計算最適な配分がその直線から外れる。スペクトルとドメインの不均質性が外れを決めることを、Mellin–Barnes解析と水充填で理論的に示し、Aitken差分で損失の下限を除く初期化法を与える。"}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "文脈内学習に特徴学習は要らない", "title": "You Don't Need Feature Learning to Do In-Context Learning", "url": "https://arxiv.org/abs/2611.13431", "authors": "Joseph Turnbull ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "回転不変なカーネル機械で文脈内学習の線形回帰課題を調べ、サンプル数が増えると記憶する解の高次の成分を順に学ぶことを固有基底で示した。汎化する解は記憶解の低次の切り捨てで、学習はまず汎化し、のちに記憶へ劣化する。"}, {"id": "pn14", "rank": 14, "field": "機械学習", "headline": "事前学習・SFT・RLの計算配分を解析モデルで考える", "title": "An Analytical Model of Compute-limited Multistage Training Pipelines", "url": "https://arxiv.org/abs/2611.13276", "authors": "Nishil Patel ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "線形オートエンコーダの事前学習、ノイズのある段階ラベルのSFT、まばらな報酬のRLを一つの高次元モデルにして、ランダム行列理論で学習の動力学を近似した。有限の事前学習データが表現に依存する性能の上限を課すことなどを示し、段階間の計算配分を考える土台を与える。"}, {"id": "pn15", "rank": 15, "field": "統計学", "headline": "選択後の推論の計算を擬似周辺MCMCで高速化", "title": "Pseudo-marginal Sampling for Selective Inference", "url": "https://arxiv.org/abs/2611.13492", "authors": "Jiali He ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "適応的な選択のあとの推論は選択事象で条件づけるが、複雑な手順では分布が扱えず、棄却サンプリングは事象がまれだと高価になる。擬似周辺MCMCでこの条件つき分布を標本化し、弱ポアンカレ不等式で効率を解析して、古典的なファイル引き出し問題で両方法の計算量を導いた。"}, {"id": "pn16", "rank": 16, "field": "統計学", "headline": "AIの読み手が割れても金額の合計を推定する", "title": "Counting Under Disagreement: Dollar-Weighted Measurement, Selective Machine Labelling and Budgeted Human Review from Disagreeing AI Readers of Administrative Text", "url": "https://arxiv.org/abs/2611.13215", "authors": "George Koomullil (Ascendr ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "1つの文面ラベルが多数の行政記録に当たり、目標が金額の合計で、人の読みも割れる設定を扱った。米国の税申告の助成目的の文面12万1,070件（79万9,675件・1,264億ドル）を規則分類器と3つの言語モデルでラベル付けし、651件を3人が読んで基準とした。固定予測器と交差適合の予測器の差推定量の条件を示し、8つの予測器の合計が補正後0.4億ドル以内で一致した。"}, {"id": "pn17", "rank": 17, "field": "統計学", "headline": "行列・テンソルのデータで構造的自己回帰を識別", "title": "Identification, estimation, and robust inference of structural autoregressions for multidimensional data", "url": "https://arxiv.org/abs/2611.13169", "authors": "Bernhard van der Sluis", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "国別パネルのような行列・テンソル構造のデータで、係数にクロネッカー構造を仮定して構造的自己回帰の大域的な識別と扱いやすさを確保した。最小距離推定量の漸近分布と、近似的な分離可能性の誤りに頑健な構造的インパルス応答の信頼区間を示す。"}, {"id": "pn18", "rank": 18, "field": "統計学", "headline": "プライバシーを守った対比較から順位を推論", "title": "Differentially Private Statistical Inference for Rankings from Pairwise Comparisons", "url": "https://arxiv.org/abs/2611.13485", "authors": "Xintao Xia ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "LLMの順位づけに使う人の対比較の記録を守るため、Bradley–Terryモデルでエッジ差分プライバシーのもとでの得点と順位の推論を開発した。目的摂動推定量の有限標本の誤差界と、漸近的に妥当な信頼区間を導く。"}, {"id": "pn19", "rank": 19, "field": "因果推論", "headline": "媒介確率の比による重みづけで直接・間接効果を推定", "title": "Ratio-of-mediator-probability weighting for causal mediation analysis: estimation, extensions, and practical guidance", "url": "https://arxiv.org/abs/2611.13206", "authors": "Ariel Linden", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "結果モデルを立てずに媒介変数の分布を処置条件間で再重みづけして自然な直接効果と間接効果を推定するRMPWの既存の方法を、共通の枠組みにまとめた。連続媒介変数の異分散正規モデルを加え、複数の重み成分への2段階の分散推定を拡張し、全国健康調査と福祉就労の無作為化実験で例示する。"}, {"id": "pn20", "rank": 20, "field": "統計学", "headline": "SGDの尾部平均の誤差界の隙間を埋める", "title": "Settling the Burn-in Gap: Sharp Risk Bounds for Tail-Averaged SGD in Linear Regression", "url": "https://arxiv.org/abs/2611.13383", "authors": "Qingyue Zhao ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "高次元線形回帰で一定ステップ幅のオンライン確率的勾配降下法を尾部平均したときの過剰リスクに、初期化を明示した一致する上界と下界を示した。従来の上界は初期誤差の寄与を減衰させず、下界は初期化由来の分散を落としており、両方がゆるいことを示す。"}, {"id": "pn21", "rank": 21, "field": "統計学", "headline": "ガウスカーネルの長さスケール推定の理論", "title": "Lengthscale Estimation for the Gaussian Kernel and Deterministic Response Functions", "url": "https://arxiv.org/abs/2611.13930", "authors": "Subhendu Pramanick ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "無限回微分可能なガウスカーネルの長さスケールの最尤推定量と交差検証推定量を、観測が固定の応答関数から出る固定領域漸近で調べ、この設定で初めて理論的な結果を示した。応答関数の正則性（フーリエ変換の減衰）に依存する下界を証明した。"}, {"id": "pn22", "rank": 22, "field": "統計学", "headline": "ガウス過程のハイパーパラメータの変化で変化点を検出", "title": "Time Series Change Point Detection with Gaussian Processes", "url": "https://arxiv.org/abs/2611.13295", "authors": "Olga Isupova ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "時系列の変化をガウス過程の事前分布のハイパーパラメータの変化と定義し、統計的仮説検定として定式化した。変化の前後の関数形を詳しく指定せずにオフラインとオンラインで複数の変化点を検出でき、理論的な保証と合成・実データでの評価を示す。"}, {"id": "pn23", "rank": 23, "field": "組織行動・心理的安全性", "headline": "AI利用は同僚の評価と行動をどう変えるか（総説）", "title": "Machines in the Middle: How AI Use Changes What Coworkers Think of, and Do for, One Another", "url": "https://doi.org/10.31234/osf.io/ehbjv_v2", "authors": "Maxine Parker ほか", "venue": "PsyArXiv", "date": "2026-11-10", "why": "個人のAI利用が他者からの見られ方と行動をどう変えるかを、帰属理論や社会的交換理論などで説明した総説。観察者はAI利用を能力・意欲・温かさ・本物らしさの低さとみなし、開示しても信頼は回復せず、同僚の返報・知識共有・向社会的行動が減る一方、条件しだいで孤立を減らし調整を改善するとまとめる。未査読のプレプリント。"}, {"id": "pn24", "rank": 24, "field": "組織行動・心理的安全性", "headline": "公式リーダーとピアリーダーの役割の分類を作る", "title": "Mapping Leadership in Teams: An Empirically Grounded Taxonomy of Formal and Peer Leadership Roles.", "url": "https://doi.org/10.31234/osf.io/5b9sy", "authors": "Charlotte Marie Edelmann ほか", "venue": "PsyArXiv", "date": "2026-11-10", "why": "公式リーダーとピア（非公式）リーダーの行動を階層をまたいで捉える実証的な分類がないという課題に対し、文献統合と従業員35人への質的インタビューから、リーダーシップ機能の分類を帰納的に作った。未査読のプレプリント。"}, {"id": "pn25", "rank": 25, "field": "組織行動・心理的安全性", "headline": "チーム固有の技能への動学的投資を理論と実験で調べる", "title": "Dynamic investment and coordination in teams: Theory and experimental evidence", "url": "https://arxiv.org/abs/2611.13230", "authors": "David Gill ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "チーム固有の技能への投資は持続的な利益を生むが、調整の成否に左右される危険な投資である。動学ゲームの理論枠組みを作り、実験室で投資に影響する要因を調べた。"}, {"id": "pn26", "rank": 26, "field": "組織行動・心理的安全性", "headline": "ソフトウェア組織の11チームでAI利用は偏る", "title": "Uneven Self-Reported AI Use: An Embedded Case Study Across Eleven Teams in a Software Organization", "url": "https://arxiv.org/abs/2611.14154", "authors": "Daniele Veri'", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "ソフトウェア組織の11チーム98件の構造化インタビューの記録で、標準化した質問で測った65人のうち55.4%がAI利用の頻度を4か5と答え、チーム別では20.0%から71.4%と差が大きかった。組織のAI方針の認識が限られる点も見られた。単一事例の記述的研究。"}, {"id": "pn27", "rank": 27, "field": "組織行動・心理的安全性", "headline": "裁判所長の交代で倒産手続の長期化が鈍る", "title": "Judicial Performance, Bank Lending and Firms' Investments: Evidence from Court Leadership Turnover", "url": "https://doi.org/10.2139/ssrn.7683845", "authors": "Davide Moretti ほか", "venue": "SSRN", "date": "2026-11-10", "why": "イタリアの裁判所長の任命の外生的な変動を使い、交代が倒産手続の期間の伸びを遅くすることを示した。効果は新任が若い・管理経験がある・地元出身のとき大きい。司法の効率化で債権者の権利が強まり、銀行貸出が増え延滞が減り、大企業は無形資産へ投資を移す。"}, {"id": "pn28", "rank": 28, "field": "経済学", "headline": "関税の発表は事前の信念に応じて期待インフレを上げる", "title": "Tariff News and Household Inflation Expectations: The Role of Prior Beliefs", "url": "https://doi.org/10.2139/ssrn.7683852", "authors": "Vandana Ramakrishnan", "venue": "SSRN", "date": "2026-11-10", "why": "2018〜2025年の米国の7つの関税の局面で、検索関心のピークの前後の個人内の1年先の期待インフレの改訂を、ニューヨーク連銀の消費者期待調査の面接日で比べた。2018年の鉄鋼・アルミ関税で1.18ポイント、2025年7月の相互関税の復活で1.72ポイント有意に上がった。"}, {"id": "pn29", "rank": 29, "field": "経済学", "headline": "評価の公表が後の戦略的コミュニケーションを損なう", "title": "Feedback Design in the Shadow of Strategic Communication", "url": "https://arxiv.org/abs/2611.13450", "authors": "Daiki Kishishita ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "企業が従業員の潜在力の評価を公表したあと、従業員が個別の事情を上司に伝える組織で、最適なフィードバックを特徴づけた。情報量の多い評価は意思決定を助けるが、選好の対立を強めて後の伝達の信頼性を損ねうる。全面開示は、すべての事前信念で最適かすべてで最適でないかのどちらかになる。"}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "貧しい人が借りられないとき資本規制はなぜ弱いか", "title": "Macroprudential Policy When the Poor Cannot Borrow", "url": "https://doi.org/10.2139/ssrn.7682498", "authors": "Fernando Arce ほか", "venue": "SSRN", "date": "2026-11-11", "why": "不平等の大きい新興国で資本規制が少ない傾向を、実質為替レートを通じた分配の外部性で説明した。非ホモセティックな選好・担保制約に直面する高所得の借り手・手元の資金で暮らす低所得世帯の小国開放経済モデルで、最適な借入税をフィッシャー的な項と分配的な項に分解する。"}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "長く知られた地震リスクが顕在化すると売却価格が下がり賃料が上がる", "title": "Environmental Risk Salience and Real Estate Markets", "url": "https://econpapers.repec.org/RePEc:ces:ceswps:_13073", "authors": "Marco Letta ほか", "venue": "RePEc NEP", "date": "2026-11-02", "why": "既知の環境リスクが破壊を伴わずに顕著になった場合の市場の反応を、イタリアの地震活動の再燃を自然実験として調べた。最も曝露した持ち家市場では売却価格が下がり、賃料は上がって、世帯は保有形態と空間で調整した。"}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "フィギュアの審判は自国選手に加点しライバルに減点する", "title": "Taste or Strategy? Nationalistic Bias and Competitor Penalties in Figure Skating Judging", "url": "https://arxiv.org/abs/2611.13194", "authors": "Jialin Liu ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "専門家の審査員の自国びいきを嗜好や情報の差と区別するため、フィギュアスケートの詳細なデータを使った。自国選手への戦略的な加点と、その近いライバルへの狙った減点を見いだし、加点は無作為な滑走順に沿って下がる。反実仮想の分析で、接戦の結果を左右しうると示す。"}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "認知能力と自信過剰が課題の複雑さの選択を決める", "title": "Choosing Complexity: Cognitive Ability, Overconfidence, and Task Choice", "url": "https://arxiv.org/abs/2611.13259", "authors": "David Gill ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "成功報酬の取引条件の違う複雑な課題の選択を、理論と実験で調べた。認知能力の高い人は複雑な課題を選び、能力を一定にしても自信過剰な人は複雑な課題を選ぶ。約75%の判断で利得を最大にする課題を選んだ。"}, {"id": "pn34", "rank": 34, "field": "経済学", "headline": "不完全なデータで自治体別の多次元貧困を区間で推定", "title": "Estimating multidimensional poverty under incomplete data in North Macedonia", "url": "https://arxiv.org/abs/2611.14146", "authors": "Maja Gerovska Mitev ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "多次元貧困指数は国・地域より細かい水準では得にくい。センサスと地理空間データの世帯レベルの結合ができない状況で、独立性にもとづく点推定と、データと整合するすべての同時分布にわたる鋭い上下界を組み合わせて、北マケドニアの地域の貧困を推定する方法を示した。"}, {"id": "pn35", "rank": 35, "field": "経営学", "headline": "特許の保護が弱まると決算説明会の開示が増える", "title": "Patent Protection and Disclosure", "url": "https://doi.org/10.2139/ssrn.7690238", "authors": "Nemit Shroff ほか", "venue": "SSRN", "date": "2026-11-11", "why": "特許保護の弱まりが担保価値を下げ無担保債務への依存を高めて、債権者が将来のキャッシュフローの情報を重視するため開示が増えるという仮説を、2014年の米国最高裁のAlice判決を使って検証した。Alice判決の影響を受けた企業ほど決算説明会で情報を多く出した。"}, {"id": "pn36", "rank": 36, "field": "経営学", "headline": "ブラウザ選択画面でSafariからChromeへ移る", "title": "The Limits of Product Market Remedies in Platform Ecosystems: Evidence from Browser Choice Screens on iPhones", "url": "https://doi.org/10.2139/ssrn.7682467", "authors": "Leon Knoke ほか", "venue": "SSRN", "date": "2026-11-11", "why": "EUのデジタル市場法で2024年に導入された、既定のブラウザを選ばせる画面の効果を、EUと非EUの国でブラウザと検索の市場シェアの前後比較で調べた。SafariからGoogle Chromeへ大きなシェア移動があり、他のブラウザの絶対的な増加は小さい。"}, {"id": "pn37", "rank": 37, "field": "経営学", "headline": "レストランのカロリー表示は食料品の購買に及ぶか", "title": "Beyond the Point of Disclosure: Restaurant Calorie Posting and Household Grocery Purchases", "url": "https://doi.org/10.2139/ssrn.7682397", "authors": "Ali Umut Guler", "venue": "SSRN", "date": "2026-11-11", "why": "6つの地域の義務化とNielsenIQ Homescanのデータを使った積み上げ型の差の差分析と、593人の無作為化実験を組み合わせて、レストランのカロリー表示が世帯の食料品の購入に及ぶかを調べた。"}, {"id": "pn38", "rank": 38, "field": "経営学", "headline": "LLMの集約サービスは補完でもあり競合でもある", "title": "LLM Competition and the Aggregator Economy", "url": "https://doi.org/10.2139/ssrn.7683780", "authors": "Fupeng Sun ほか", "venue": "SSRN", "date": "2026-11-10", "why": "PoeやChatHubのように競合するLLMをまとめて売る集約サービスは、提供者にとって卸売のAPI収益を生む補完であると同時に、直販の購読を食う競合でもある。2つの提供者と選好の異なる利用者のゲーム理論モデルで、この二面性を分析した。"}, {"id": "pn39", "rank": 39, "field": "機械学習", "headline": "トランスフォーマーが構文の内外計算を段階的に獲得する", "title": "Stagewise and interpretable emergence of inside-outside computation in Transformer-based language models", "url": "https://arxiv.org/abs/2611.14221", "authors": "Jack T. Parley", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "文脈自由文法の合成データで、トランスフォーマーが構文解析の内外アルゴリズムを学ぶ過程の学習動力学を調べ、損失の各段階が解釈可能に計算できることを示した。学習済みモデルが解析アルゴリズムを近似するという従来の事後的な研究に対し、獲得の過程を理論的に扱う第一歩となる。"}, {"id": "pn40", "rank": 40, "field": "機械学習", "headline": "LLMの記号的な機構はどんな要因で現れるか", "title": "What drives the emergence of symbolic mechanisms in large language models?", "url": "https://arxiv.org/abs/2611.13270", "authors": "Melody Zixuan Li ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "抽象的な系列課題でニューラルネットをゼロから訓練し、アーキテクチャとデータ分布の要因を変えて記号的な機構の出現を調べた。表現・注意・因果媒介の分析で、トランスフォーマーが記号的な機構を獲得することを確認し、その要因を探る。"}, {"id": "pn41", "rank": 41, "field": "機械学習", "headline": "概念による説明の因果効果を訓練の目的にする", "title": "Causal Concept Explanations for Deep Neural Models", "url": "https://arxiv.org/abs/2611.14407", "authors": "Josh Rountree ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "概念にもとづく説明は相関的で、出力に必要でも十分でもないのに正しく見えて誤解を招きうる。経済学や疫学の介入媒介分析を訓練目的に使い、概念の説明の因果効果をそろえるCCW-Netを提案した。"}, {"id": "pn42", "rank": 42, "field": "機械学習", "headline": "実演から別の世界へ文脈内学習でロボット操作を移す", "title": "World In-Context Learning for Agentic Robot Manipulation", "url": "https://arxiv.org/abs/2611.12885", "authors": "Heng Fang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-11", "why": "文脈内学習は、別の場面で記録した実演に現在の世界からのフィードバックがないため、訓練した方策に及ばなかった。文脈内で学ぶのは見た目でなくタスクの手順と物体の役割という意味であることに着目し、固定したモデルが実演から始めて現在の世界で学び直すWICLを提案した（Hugging Faceの票52）。"}, {"id": "pn43", "rank": 43, "field": "機械学習", "headline": "エージェントの記憶は根拠をたどれてこそ役立つ", "title": "Don't Just Trust Your Memory: Evidence-Linked Memory Reduces Memory-Induced Degradation in LLM Agents", "url": "https://arxiv.org/abs/2611.14320", "authors": "Yukyeong Lee ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-11", "why": "外部記憶は過去の軌跡から作る教訓でエージェントを助けるが、元の軌跡と切り離されると、誤った教訓や誤用で、記憶なしなら解ける課題で失敗する。教訓を根拠の軌跡にひも付けて確かめられるWikiTraceを提案し、記憶による劣化を減らす（Hugging Faceの票41）。"}, {"id": "pn44", "rank": 44, "field": "計算社会科学・ネットワーク科学", "headline": "情報の発信源を早期にベイズ推論で特定", "title": "EAGLE: Early Identification of Information Propagation Sources through Generalized Bayesian Inference in Large-scale Social Networks", "url": "https://arxiv.org/abs/2611.13919", "authors": "Tao Wen ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "情報の氾濫の中で発信源をすばやく特定するため、進化計算でまばらな観測者を配置し、信頼性の異なる観測を一般化ベイズ推論で集約するEAGLEを提案した。人の観測者への依存を限り、観測の信頼度の違いを明示的に組み込む。"}, {"id": "pn45", "rank": 45, "field": "計算社会科学・ネットワーク科学", "headline": "二段階の伝染は人口の入れ替わりで振動する", "title": "Oscillations in two-stage contagion on networks: contagion structure, turnover and connectivity", "url": "https://arxiv.org/abs/2611.12920", "authors": "Francisco J. Mu\\~noz ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "意見や技術の採用のように2回接触して初めて採用する二段階の伝染で、人口の入れ替わりがあると採用と放棄の波が生じる。平均場では超臨界のホップ分岐で振動が生まれ、1回目の接触の採用確率が低い、二段階が中心の伝染が必要になる。"}, {"id": "pn46", "rank": 46, "field": "計算社会科学・ネットワーク科学", "headline": "AIは研究助手として中国と米国のどちらかに偏るか", "title": "Can AI be a 'Researcher Without Borders'? Auditing Bias in AI-Assisted Social Science Research about China and the US", "url": "https://arxiv.org/abs/2611.14288", "authors": "Yuan Zhang ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "LLMが社会科学の研究助手として使われるとき、開発国の国々や学術の伝統に偏るかを、中国と米国に関する研究の質問で監査した。正解のない問いが多いため、国やそれに結びつく社会理論を有利に扱うかを調べる。"}, {"id": "pn47", "rank": 47, "field": "計算社会科学・ネットワーク科学", "headline": "判断の確信度の表示が情報源の選び方を変える", "title": "Displayed judgment certainty reorganizes source selection in self-formed networks", "url": "https://doi.org/10.31234/osf.io/fja3d_v5", "authors": "Gaël Carniel ほか", "venue": "PsyArXiv", "date": "2026-11-10", "why": "オンライン実験8セッションの273人が14の真偽のニュース見出しを評価し、費用をかけて観測ネットワークを作り、5回信念を更新した。判断の確信度（私的な確率判断の極端さ）の見え方を操作し、情報源の選択と後の正確さへの影響を調べた。"}, {"id": "pn48", "rank": 48, "field": "計算社会科学・ネットワーク科学", "headline": "集計データから都市の移動を微視的に再現", "title": "Spatial patterns of transportation choice in Niter\\'oi", "url": "https://arxiv.org/abs/2611.14499", "authors": "Sandro Martinelli Reia ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "安価な集計の静的な都市データから、微視的で動的な空間的に詳しい都市移動を作る枠組みを示した。合成人口・建造環境・交通網で日々のトリップを作り、徒歩・車・公共交通を割り当て、ブラジルのニテロイ約47.5万人の合成住民に適用した。"}, {"id": "pn49", "rank": 49, "field": "計算社会科学・ネットワーク科学", "headline": "携帯・路側・GPSの各データが交通シミュレーションに足す価値", "title": "Data-driven regional traffic simulation from heterogeneous mobility sources", "url": "https://arxiv.org/abs/2611.13947", "authors": "Federico Bellisardi ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "why": "携帯電話データがトリップとその時刻を、路側センサーの半数が交通量の水準を、全センサーが局所の補正を、GPS軌跡が経路選択を決める、エミリア＝ロマーニャ州の日々の交通のエージェント・ベース・シミュレータを作り、各データの寄与を測った。評価は完全に独立ではない。"}, {"id": "pn50", "rank": 50, "field": "人口学", "headline": "国の富を人口と国土から測り直す", "title": "The Wealth of Nations According to Adam Population, Territory, and Welfare", "url": "https://doi.org/10.2139/ssrn.7685298", "authors": "Juan Carlos Cordoba", "venue": "SSRN", "date": "2026-11-11", "why": "アダム・スミスの区別（一人当たりの繁栄と国の富）を、Barro–Becker型の王朝的選好で測る。国の富は統計的生命の価値に単位土地あたりの有効な生命の数を掛けたもので、87か国で米国は富で19位だが福祉で48位、中国の富は米国の45%（一人当たりでは14%）。1500年以降の世界の富は約173倍に増えた。"}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "エッジ上でセンサ故障の診断と説明の一致を評価", "title": "Edge-based explainable multisensor fault diagnosis for structural health monitoring", "url": "https://doi.org/10.1177/14759217261504351", "authors": "Heba Al-Nasser ほか", "venue": "Structural Health Monitoring", "date": "2026-11-11", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr02", "rank": 2, "headline": "複数橋の亀裂幅データを共通尺度にそろえて損傷を評価", "title": "A Data‐Driven Framework for Assessing Damage Development in Coupling Joints of Prestressed Concrete Bridges", "url": "https://doi.org/10.1155/stc/3195765", "authors": "Yasser Alqasem ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-11-11", "citescore": 10.3, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr03", "rank": 3, "headline": "データが少ないときのベイズ更新の4つの戦略を総説", "tit nt themes, and research gaps", "url": "https://doi.org/10.3389/frsc.2026.1983822", "authors": "Seyedeh Sedigheh Ghorashi ほか", "venue": "Frontiers in Sustainable Cities", "date": "2026-11-09", "citescore": 5.1, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6}, {"id": "jr46", "rank": 46, "headline": "ハイデラバードの都市土地価値を成長分析で可視化", "title": "Spatial Data Visualization for Urban Land Value Assessment Using Growth Analysis: A Case Study of Morphological Transformations in Hyderabad Metropolitan Region, India", "url": "https://doi.org/10.1061/jupddm.upeng-6450", "authors": "D. Shivaram Reddy ほか", "venue": "Journal of Urban Planning and Development", "date": "2026-11-11", "citescore": 3.9, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6}, {"id": "jr47", "rank": 47, "headline": "オーストリアの農村・郊外の交通の不利益とケア労働", "title": "Transport disadvantage and care work: An exploratory study of gendered mobility patterns and acceptability of sustainable transport alternatives in rural and peri-urban Austria", "url": "https://doi.org/10.1016/j.urbmob.2026.100314", "authors": "Linda Dörrzapf ほか", "venue": "Journal of Urban Mobility", "date": "2026-11-10", "sjr": 1.621, "citescore": 8.8, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6}, {"id": "jr48", "rank": 48, "headline": "SNSの職場利用がJD-Rと仕事・生活の境界をどう変えるか", "title": "Job Demands‐Resources, Well‐Being and Work‐Life Boundaries: The Pervasiveness of Social Networking Platforms", "url": "https://doi.org/10.1111/1748-8583.70074", "authors": "Severina Cartwright ほか", "venue": "Human Resource Management Journal (UK)", "date": "2026-11-10", "sjr": 3.013, "citescore": 14.9, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7}, {"id": "jr49", "rank": 49, "headline": "AI導入と従業員の幸福感・業績：3波の時間差調査", "title": "AI Adoption, Employee Well-being and Job Performance", "url": "https://doi.org/10.68379/sbzf3x83", "authors": "Mehreen Aslam", "venue": "Dyal Singh Journal of Humanities & Social Sciences", "date": "2026-11-11", "theme": "職場AI・組織行動", "theme_no": 7}, {"id": "jr50", "rank": 50, "headline": "活動基準原価計算で製造原価の算定の正確さを高められるか", "title": "Analysis of The Implementation of Activity-Based Costing (ABC) In Improving The Accuracy of Cost of Goods Sold Calculations In Manufacturing Companies", "url": "https://doi.org/10.60023/g2tp6429", "authors": "Ardin Dolok Saribu ほか", "venue": "Jurnal Ilmiah Ekonomi, Manajemen dan Bisnis", "date": "2026-11-09", "theme": "会計情報科学", "theme_no": 2}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "脆弱な保険会社の破綻が住宅ローンの延滞を増やす", "title": "When Insurers Exit: Climate Losses, Fragile Insurers, and Mortgage Markets", "url": "https://doi.org/10.1093/qje/qjag053", "authors": "Parinitha Sastry ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-11-07", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "why": "気候リスクの住宅ローンと損害保険での過小評価が、納税者の大きな負担と危険地域への過剰な信用供給を生むことを、複数の自然実験で示した。政府支援企業（GSE）の保険会社の評価方針が過小評価の主因で、フロリダ州の新規データで、資本不足の保険会社の破綻が災害後の住宅ローンの延滞を因果的に増やす。GSEの期待損失の約25%が保険の脆弱性による。"}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "誤った信念が直らないのは注意の向け方による", "title": "Channeled Attention and Stable Errors", "url": "https://doi.org/10.1093/qje/qjag055", "authors": "Tristan Gagnon-Bartsch ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-11-09", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "why": "データが豊富で学習の機会が繰り返しあっても人が誤った信念を保つ理由を、誤っているかもしれない自分のモデルを通して注意を向けるという枠組みで説明した。変数が効かない・区別がないと誤って排除するモデルは、反証となるデータから注意をそらすため安定しやすい。どの誤りが見つかるかは意思決定の構造に依存し、害の大きさとは緊密に結びつかない。"}, {"id": "jn03", "rank": 3, "field": "因果推論", "headline": "エボラの恐怖で黒人申請者の住宅ローン拒否率が3.8ポイント上昇", "title": "Deadly Disease, Fear, and Ostracism in the Credit Market", "url": "https://doi.org/10.1287/mnsc.2025.01919", "authors": "Sumit Agarwal ほか", "venue": "Management Science", "date": "2026-11-10", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "2014年の米国のエボラ流行を自然実験として、恐怖が住宅ローンの与信を歪めるかを調べた。感染リスクはほぼないのに、流行中の黒人申請者の拒否率が3.8ポイント上がった。承認された黒人の借り手は信用状態が良く延滞が少ないが、延滞時の条件変更を受けにくい。FinTechのアルゴリズム融資ではこの影響がなく、流行後に素早く戻り、統計的差別とは合わない。"}, {"id": "jn04", "rank": 4, "field": "経済学", "headline": "リスクと信念の個人差を同時に測り意思決定を推定", "title": "Uncertainty Attitudes, Subjective Beliefs, and Decisions Under Uncertainty", "url": "https://doi.org/10.1287/mnsc.2024.06232", "authors": "Adeline Delavande ほか", "venue": "Management Science", "date": "2026-11-10", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "一般の人を対象に、リスクとあいまいさへの態度（個人別の確率加重と損失回避）と、意思決定に関わる事象の主観的確率を集める調査実験を行った。態度も信念も非常に異質で、プロスペクト理論に情報源依存の確率加重を組み合わせたモデルが、主観的期待効用より当てはまりが良い、または同等だった。信念が極端な値に集中するときに特によく当てはまる。"}, {"id": "jn05", "rank": 5, "field": "計算社会科学・ネットワーク科学", "headline": "150年のドイツ議会の移民討論をLLMで注釈し反連帯の増加を示す", "title": "LLM Analysis of 150+ Years of German Parliamentary Debates on Migration Reveals a Shift from Post-War Solidarity to Anti-Solidarity in the Last Decade", "url": "https://doi.org/10.1162/coli.a.666", "authors": "Aida Kostikova ほか", "venue": "Computational Linguistics", "date": "2026-11-10", "sjr": 1.837, "citescore": 28.8, "citescore_year": "2025", "why": "ドイツの議会討論（1867〜2025年）の移民への連帯・反連帯を、理論に基づく注釈の枠組みでLLMに注釈させ、人間どうしの一致度に匹敵するマクロF1を得た。系統的な誤りが下流の結果を偏らせるため、ソフトラベルと設計ベースの教師あり学習（DSL）を組み合わせて長期の傾向の偏りを減らした。戦後の連帯の高さと、2015年以降の反連帯の顕著な増加を見いだした。"}, {"id": "jn06", "rank": 6, "field": "経営学", "headline": "プライバシー保護の下でのレコメンダ設計", "title": "Recommender Systems Under Privacy Protection", "url": "https://doi.org/10.1287/mnsc.2024.05007", "authors": "Can Küçükgül ほか", "venue": "Management Science", "date": "2026-11-10", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "利益を求めるプラットフォームが、プライバシー保護の制度の違いのもとでレコメンデーションの方針を設計する様子を分析した。オプトアウト保護と無保護が機能的に同等であることを示し、消費者が個人データを偽る自由があるとプラットフォームが推薦を歪め、双方に害が及びうる。推薦が製品への接近を制御する配分の役割を持つと、アルゴリズムによる差別で不利な少数派が機会を失いうる。"}, {"id": "jn07", "rank": 7, "field": "経営学", "headline": "環境への取り組みが強い企業ほど決算説明会で語らない", "title": "CEO environmental communication, speech acts, and firm value", "url": "https://doi.org/10.1007/s11747-026-01221-w", "authors": "Hai-Anh Tran ほか", "venue": "Journal of the Academy of Marketing Science", "date": "2026-11-11", "sjr": 6.426, "citescore": 22.3, "citescore_year": "2025", "why": "364社・1万4,523件の決算説明会の質疑で、環境への取り組みについてCEOが語る量とその意図（発話行為）を、MSCIの環境スコア・Compustat・微調整したDeBERTaで測った。取り組みが強い企業ほど語る量は少なく、語りが企業価値と正に関連するかは意図による。断定的・指示的な発話は正の関連を保ち、表出的・約束的な発話は負の関連を持つ。"}, {"id": "jn08", "rank": 8, "field": "人口学", "headline": "共同の土地登記は夫婦の絆と協力の力を強める", "title": "Joint Land Titling and the Marital Bond in Southwestern Uganda", "url": "https://doi.org/10.1111/padr.70103", "authors": "Michelle Poulin ほか", "venue": "Population and Development Review", "date": "2026-11-11", "sjr": 1.616, "citescore": 7.9, "citescore_year": "2025", "why": "ウガンダ南西部の無作為化介入で全額補助の土地登記を提供したところ、多くの夫が妻の名を登記に加えた。民族誌的な手法で、共同の登記が女性の交渉力を高めるだけでなく、夫の婚姻へのコミットメントの象徴となり、婚姻の絆を強めて夫婦の協力的な力を促す経路を見いだした。数値の結果に質的な探究を組み合わせて意味を探る。"}, {"id": "jn09", "rank": 9, "field": "気候科学", "headline": "農業・林業・土地利用の削減なしでは1.5℃は実現しない", "title": "Cost-effective climate change mitigation through land sector contributions", "url": "https://doi.org/10.1038/s41893-026-01977-7", "authors": "Leon Merfort ほか", "venue": "Nature Sustainability", "date": "2026-11-11", "sjr": 7.896, "citescore": 44.1, "citescore_year": "2025", "why": "統合評価モデルREMIND–MAgPIEで、農業・林業・その他の土地利用（AFOLU）の緩和政策の組み合わせ別に将来の経路を導いた。AFOLUの貢献がなければ21世紀中の1.5℃は達成できず、ピークを1.7℃未満に抑える消費損失は現行政策比で1.3%から3.5%に増える。バイオエネルギーを年100EJに限り、CH4とN2Oの価格を1トンCO2換算で75ドルに抑えるなどの政策で、食料価格の上昇などの圧力を和らげられる。"}, {"id": "jn10", "rank": 10, "field": "計算社会科学・ネットワーク科学", "headline": "48のLLMが書く求人票で性別の偏りを監査", "title": "Does AI Reinforce Gender Stereotypes? Gender Bias in Job Descriptions Generated by 40+ Large Language Models", "url": "https://doi.org/10.1111/gwao.70291", "authors": "Jennifer M. Krebsbach ほか", "venue": "Gender, Work and Organization", "date": "2026-11-11", "sjr": 1.769, "citescore": 7.4, "citescore_year": "2025", "why": "48のLLMで、32の職種を女性的・男性的・中立の職名で作った4,608件の求人票を生成し、給与の差・比較評価・性役割の語りの型を測るアルゴリズム監査を行った。ホワイトカラーの職種では男性的な職名の求人票に高い給与が割り当てられたが、頑健ではなかった。簡単なプロンプトの修正で偏りの一部は減るが、職種に根ざした性別の型は残る。"}, {"id": "jn11", "rank": 11, "field": "計算社会科学・ネットワーク科学", "headline": "流行の話題への便乗は投稿の反応を120.8%増やす", "title": "EXPRESS: From Trends to Tweets: The Impact of Trendjacking on Consumer Engagement on Social Media", "url": "https://doi.org/10.1177/10949968261508771", "authors": "Fatemeh Vafaeesefat ほか", "venue": "Journal of Interactive Marketing", "date": "2026-11-11", "sjr": 3.125, "citescore": 12.1, "citescore_year": "2025", "why": "356社の66万件超の投稿（2018〜2022年）とXの話題データを組み合わせ、流行の話題への便乗（トレンドジャッキング）がエンゲージメントを120.8%高めることを示した。効果は投稿のタイミング・話題の種類・ブランドの個性で変わり、2つの統制実験でも一貫した証拠を得た。"}, {"id": "jn12", "rank": 12, "field": "経営学", "headline": "変革的サービスが消費者の脆弱性を再生産する逆説", "title": "The Rose and Its Hidden Thorn: Patterning and Evolution of Consumer Vulnerability in Transformative Service Initiatives", "url": "https://doi.org/10.1177/10946705261502647", "authors": "Shuai Qin ほか", "venue": "Journal of Service Research", "date": "2026-11-11", "sjr": 5.517, "citescore": 19.7, "citescore_year": "2025", "why": "難民の起業を支援する変革的サービスが消費者の脆弱性を減らしながら害を再生産しうる逆説を、33の事業の管理者42人へのインタビューと3年のエスノグラフィで調べた。資源へのアクセスと利用の統制の組み合わせで3つのサービスモデルを分け、それぞれが特有の脆弱性の型を生みやすいことを示す。"}, {"id": "jn13", "rank": 13, "field": "組織行動・心理的安全性", "headline": "女性が率いる企業は女性を多く雇い支援も手厚い", "title": "Female Managers, Women's Employment, and Gendered Laws", "url": "https://doi.org/10.1111/gwao.70276", "authors": "Hiep Manh Nguyen ほか", "venue": "Gender, Work and Organization", "date": "2026-11-10", "sjr": 1.769, "citescore": 7.4, "citescore_year": "2025", "why": "世界銀行の企業調査の国際データで、女性のトップを持つ企業ほど女性を雇用し、研修・育児支援・出産の福利厚生を提供し、イスラム圏では性別の差別が低い。この効果は法的な性別平等が弱い国・企業支援の限られる国で強く、男性中心の業種で弱い。女性従業員の比率が、女性のリーダーシップと生産性の負の関連を媒介する。"}, {"id": "jn14", "rank": 14, "field": "経営学", "headline": "サービスのエコシステムを共同で設計する「つながった摩擦」", "title": "Connected Friction—Collectively Designing Service Ecosystems Through Reflexive Relations", "url": "https://doi.org/10.1177/10946705261492132", "authors": "Audun Formo Hay     "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
