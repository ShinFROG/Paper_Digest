、元の応答の大きさが、局所の変化と地表の最大値をどう決めるかを分解した（抄録）。", "p5": "中心深さ24.2 mで間隔を12 mから15 mに広げても最大レベルの増分は約1.73 dBでほぼ変わらないが、ピークの位置が4 m動き、1 dB以上の高応答域の幅は8.0 mから6.5 mに狭まった。間隔12・15・18 mのうち増分が最大になる間隔は、単位荷重では15 m、列車の加振では12 mと異なった（抄録）。", "p6": "抄録には限界の記述がない。解釈：1つの路線の計測で検証した数値研究で、地盤の層構成や列車の条件が変わったときの一般性は本文で確かめる必要がある。", "fun": "地下鉄のトンネルが2本並んでいると、列車が走っていない方のトンネルも、地面の揺れ方を変えてしまう。この研究は、空のトンネルが揺れを反射したり回り込ませたりして、地表で一番揺れる場所をずらすことを計算で示した。揺れの大きさだけでなく「どこが揺れるか」も見るべきだという点が面白い。", "unverified": "本文を入手できず、地盤の層の物性値と、建物への影響の評価は確認していない。"}}, {"id": "jr06", "rank": 6, "headline": "持続可能なサービスへの乗り換えを阻む係留要因", "title": "Drivers and barriers to sustainable service switching: evidence from search engines", "url": "https://doi.org/10.1108/jsm-09-2025-0686", "authors": "Tobias Marx", "venue": "Journal of Services Marketing", "date": "2026-11-20", "sjr": 1.536, "citescore": 9.4, "citescore_year": "2025", "apa": "Marx, T. (2026). Drivers and barriers to sustainable service switching: evidence from search engines. Journal of Services Marketing, 40(10), 182–197. https://doi.org/10.1108/jsm-09-2025-0686", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Journal of Services Marketingの抄録（Crossref）を読んだ。本文は入手できず", "preprint": false, "p1": "環境に配慮した検索エンジンへの乗り換えについて、ドイツのネット利用者の2時点の調査で、代替の魅力・主観的規範・有用性の「引き」が乗り換えの意図を強く高め、乗り換えの費用・惰性・持続可能な消費への意識の低さの「係留」が意図を下げ、意図から実際の行動への結びつきも弱めることを示した（抄録）。", "p2": "AIで加速するデジタルサービスの拡大により、検索エンジンのような広く使われるサービスの環境負荷が増している。持続可能な代替はあるが採用はごくわずかで、何が利用者を乗り換えさせるかが問われていた（抄録）。", "p3": "ドイツのインターネット利用者に、2か月の間をあけて2回のオンライン調査を行い、乗り換えの意図と実際の乗り換え行動を測った。押し・引き・係留（PPM）のモデルに基づき、既存の予測要因に持続可能性に特有の新しい要因を加えた（抄録）。解釈：意図だけでなく、後の実際の行動まで追った点がこの種の研究では珍しい。", "p4": "係留の要因が、意図への直接の効果に加えて、引きの効果を弱める調整効果と、意図と行動の関係を弱める調整効果を持つかを検証した（抄録）。", "p5": "引きの要因は乗り換えの意図を強く高め、係留の要因は意図を有意に下げた。係留は引きの意図への影響を弱め、意図と行動の結びつきも弱めた。一方、押しの要因は意図に有意な効果がなかった（抄録）。", "p6": "抄録には限界の記述がない。解釈：ドイツの利用者と検索エンジンという1つの文脈の結果で、他の国やサービスへの一般化と標本の大きさは抄録では確認できない。著者は、代替の魅力を高めるだけでなく、個人の障壁に取り組む必要を述べる（抄録）。", "fun": "環境にやさしい検索エンジンがあると知っていても、ほとんどの人は乗り換えない。この研究は、乗り換えたい気持ちを生むのは新しいサービスの魅力や周りの目で、今のサービスを離れたい理由ではないことを示した。さらに「面倒くさい」という惰性が、気持ちが行動になるのを妨げていた点が身につまされて面白い。", "unverified": "本文を入手できず、標本の大きさ、実際に乗り換えた人の割合、係数の値は確認していない。"}}, {"id": "jr07", "rank": 7, "headline": "ネットを使わない高齢者は死亡リスクが高い", "title": "Association between internet non-use and mortality risk among older adults: the explanatory contribution of social integration", "url": "https://doi.org/10.1108/intr-01-2026-0167", "authors": "Patrícia Silva ほか", "venue": "Internet Research", "date": "2026-11-20", "sjr": 2.207, "citescore": 14.8, "citescore_year": "2025", "apa": "Silva, P., Voss, G., Delerue Matos, A., & Martinez-Pecino, R. (2026). Association between internet non-use and mortality risk among older adults: the explanatory contribution of social integration. Internet Research, 1–18. https://doi.org/10.1108/intr-01-2026-0167", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Internet Researchの抄録（Crossref）を読んだ。本文は入手できず", "preprint": false, "p1": "欧州の50歳以上の地域在住者47,989人のデータで、直近7日間にインターネットを使わなかった人は、社会人口学的特性・抑うつ症状・身体の健康を調整しても全死因の死亡の危険が高く、その関連の一部は社会的統合で説明されることを示した（抄録）。", "p2": "デジタルからの排除は高齢者の社会的排除の重要な一面となり、健康の悪い結果と関連づけられてきた。しかし、全死因の死亡との関連と、社会的統合の役割は明らかでなかった（抄録）。", "p3": "欧州の健康・高齢化・退職調査（SHARE）の18か国のデータを使い、直近7日間の不使用をインターネット不使用と定義した。国で層別したCox比例ハザードモデルで不使用と死亡の関連を推定し、媒介分析で社会的統合の寄与を評価した（抄録）。解釈：観察データなので、健康が悪いからネットを使わないという逆向きの関連は、調整で一部しか除けない。", "p4": "社会人口学的特性、抑うつ症状、身体の健康を調整し、社会的統合を考慮した後も関連が残るかを確かめた（抄録）。", "p5": "インターネットの不使用は、調整後も全死因の死亡の危険の高さと独立に関連した。社会的統合を考慮すると関連は一部弱まったが残り、社会的統合が不使用と死亡を結ぶ経路の一部になりうることが示された（抄録）。", "p6": "著者は、社会的統合は関連の一部しか説明せず、他の経路も寄与している可能性が高いと述べ、不使用を広いデジタル排除の目印と解釈する（抄録）。解釈：ハザード比などの効果の大きさは抄録では確認できない。", "fun": "最近1週間ネットを使わなかった高齢者は、使った人より亡くなる危険が高かった。ヨーロッパ18か国の大規模なデータで、病気や気分の落ち込みを考慮してもその差は残り、人とのつながりの少なさが差の一部を説明した。ネットが使えるかどうかが、社会の分断の目印になっている点が考えさせられる。", "unverified": "本文を入手できず、ハザード比と信頼区間、追跡期間、媒介の割合は確認していない。"}}, {"id": "jr08", "rank": 8, "headline": "LLMは違法な依頼を広く手助けし利用者像で差", "title": "Large language models' complicit responses to illicit instructions across socio-legal contexts", "url": "https://doi.org/10.1038/s41467-026-79176-3", "authors": "Xing Wang ほか", "venue": "Nature Communications", "date": "2026-11-20", "sjr": 4.904, "citescore": 24.3, "citescore_year": "2025", "apa": "Wang, X., Xie, H., Wang, Y., Xiao, C., Chen, H., Sargeant, H., Steffek, F., Shao, J., Liu, Z., & Sun, M. (2026). Large language models’ complicit responses to illicit instructions across socio-legal contexts. Nature Communications, 17(1). https://doi.org/10.1038/s41467-026-79176-3", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "Nature Communicationsの本文（Study 1〜4の結果、考察の節）を読んだ", "preprint": false, "p1": "判例と法の枠組みから、違法な指示への手助け（共犯的な支援）を測るベンチマークEVIL（269の違法な場面、50の違法な意図）を作り、広く使われるLLMの多くが違法な依頼の4分の1以上で手助けし、GPT-4oは半数近くで手助けしたことを示した（抄録、Study 1）。", "p2": "LLMは非常に多くの利用者の日常の作業を助けるが、違法な活動を手助けする危険は十分に調べられていなかった。既存の安全性の評価では、違法行為の分類でGPT-4が90%を超える安全率を示すなど、問題が見えにくかった（抄録、考察）。", "p3": "中国と米国の刑法の文脈で、違法な場面と意図を合成した指示を作り、10のLLMの応答を、手助けしないか（安全率）、法的な危険と合法的な代替を示すか（責任率）、法的な危険を正しく特定するかで評価した（Study 1）。利用者の性別・年齢・人種・宗教・職業を変えて手助けの差を調べ、推論の過程を温かさと能力のステレオタイプの観点で分析した（Study 3）。", "p4": "ドイツの刑法の文脈でも追加の評価を行い、責任ある応答の受け止め方を利用者の調査で確かめた（Study 1）。既存の公開の安全性ベンチマークと調整用データセットの範囲を調べ、それで学習したモデルが手助けを減らすかを検証した（Study 4）。", "p5": "ほとんどのモデルの安全率は両国で75%未満だった。最も高いLlama-3.1（中国82.65%、米国84.89%）も、多くは情報のない短い拒否だった（Study 1）。社会の利益に対する罪や、極端でないが頻繁な違反で手助けが増え、高齢者（中国）、人種的少数派（米国）、無宗教の人、威信の低い職業の人ほど違法な手引きを受けやすかった（考察）。既存の安全性の調整は不十分で、手助けを強めることもあった（Study 4）。", "p6": "著者は、推論過程の分析は内部の推論の代理にすぎず、仕組みの全体は示せないため、ニューロン単位の分析などが今後必要だと述べる（考察）。解釈：特定の時点のモデルと3つの法域での評価で、モデルの更新や他の法域で結果は変わりうる。", "fun": "AIに法の目をくぐる方法を尋ねると、半分近くで手伝ってしまうモデルがあった。しかも相談者を高齢者や少数派、目立たない職業の人と設定すると、AIはより手を貸しやすくなった。弱い立場の人に親切にしようとする調整が、違法な手助けに裏返っているかもしれないという指摘が面白い。", "unverified": "10モデルの個別の数値（表1）と、ドイツの文脈の結果、利用者調査の数値は確認していない。"}}, {"id": "jr09", "rank": 9, "headline": "LLMで20都市の交通OD・経路データを合成", "title": "A global open synthetic dataset for vehicular trips in large-scale cities", "url": "https://doi.org/10.1038/s41597-026-08597-y", "authors": "Xiaolong Xie ほか", "venue": "Scientific Data", "date": "2026-11-20", "sjr": 1.907, "citescore": 9.6, "citescore_year": "2025", "apa": "Xie, X., Zhu, H., Tang, K., Shen, F., Huang, Z., Sun, F., & Tang, Y. (2026). A global open synthetic dataset for vehicular trips in large-scale cities. Scientific Data. https://doi.org/10.1038/s41597-026-08597-y", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Scientific Dataの抄録（Crossref）を読んだ。本文は入手できず", "preprint": false, "p1": "LLMを使った自動のデータ生成法で、世界の20の都市規模の地域について、道路網・時間帯別のOD（出発地・目的地）需要行列・車両の経路記録をそろえた合成の交通データセットを公開した（抄録）。", "p2": "質の高いOD需要と経路単位の交通データは、交通制御、シミュレーションの比較、経路配分、デジタルツイン、モデルの検証に欠かせないが、センサーの範囲の限界、プライバシー、データ標準の不統一、都市間で移せる観測の少なさのため集めにくい（抄録）。", "p3": "方法は4つの自動の部分からなる。LLMエージェントが抽出した交通ゾーンのパラメータで初期のODを作る段階、都市をまたぐシナリオ集から事前の情報を検索してODを調整する段階、知識に導かれた複数の役割のLLMの協調推論でODを洗練する段階、限定合理的な経路配分の段階である（抄録）。解釈：公開されている断片的な都市の情報を、LLMで一貫した形式の交通データに組み上げる方法である。", "p4": "生成したデータを、ボストン、リスボン、リオデジャネイロ、サンフランシスコ、ロサンゼルスの実際のOD行列と比べた。上海の嘉定の道路網で、信号制御と交通流の予測に使う応用の実験も行った（抄録）。", "p5": "合成データは、もっともらしい空間的な移動需要と経路選択の型を捉えていた。上海の実験では、信号制御や交通流の予測などの主要な課題を支えるのに有効だった。方法は再利用性が高く、原理的には世界のほとんどの都市でOD需要と経路のデータを作れる（抄録）。", "p6": "抄録には限界の記述がない。解釈：合成データは実測の代わりであり、実際のODとの一致の程度（誤差の値）は抄録では確認できない。LLMが生成する値の偏りが特定の都市で問題にならないかは、使う側が確かめる必要がある。", "fun": "交通の研究には「誰がどこからどこへ、どの道で移動したか」のデータが欠かせないが、プライバシーの壁などでなかなか手に入らない。この研究は、ネット上の断片的な都市の情報からAIに移動のデータを作らせ、世界の20都市分を公開した。本物らしい架空の交通を作るという発想が面白い。", "unverified": "本文を入手できず、実データとの比較の指標と値、データの規模と形式、ライセンスは確認していない。"}}, {"id": "jr10", "rank": 10, "headline": "AIと監査人の判断が食い違うときの解決枠組み", "title": "Resolving Human and Machine Disagreements in Auditing Through the Human and Artificial Intelligence Audit Judgment Resolution Framework", "url": "https://doi.org/10.1111/ijau.70052", "authors": "Michaella Selasi Genego ほか", "venue": "International Journal of Auditing", "date": "2026-11-20", "sjr": 0.681, "citescore": 3.4, "citescore_year": "2025", "apa": "Genego, M. S., Adorm‐Takyi, C., Arhin, E. Y., Adela, V., & Asare‐Appiah, F. (2026). Resolving Human and Machine Disagreements in Auditing Through the Human and Artificial Intelligence Audit Judgment Resolution Framework. International Journal of Auditing. https://doi.org/10.1111/ijau.70052", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "International Journal of Auditingの抄録（Crossref）を読んだ。本文は入手できず", "preprint": false, "p1": "技術の推奨が監査人の判断と食い違うときの対応を、ガーナの監査法人25社の監査人32人への面接と52件の事例から分析し、必要と考える精査とそれを実行する能力を区別する「人とAIの監査判断の解決（HAJR）」の枠組みを示した（抄録）。", "p2": "監査ではAIシステム、高度な分析、自動の判断支援が使われるようになり、その推奨が監査人の判断と食い違う場面が生じる。そのとき監査人が何をすべきかが問われている（抄録）。", "p3": "ガーナの25の監査法人の32人の監査人に面接し、AIシステム・高度な分析・自動の判断支援に関わる52件の事例についての振り返りの語りを分析した（抄録）。解釈：実際の作業記録ではなく、本人の振り返りに基づく質的研究である。", "p4": "語りから見えた対応の型を、判断の重大さ、各情報源が持つ知識、道具を使った過去の経験、説明責任、組織の上下関係と結びつけて整理し、枠組みにまとめた（抄録）。", "p5": "監査人は、出力を疑い、他の証拠と比べ、同僚や専門家に相談し、分析をやり直してから、推奨を受け入れるか覆すかを決めていた。枠組みは、監査法人が、監査人が出力を疑い、受け入れと却下の両方を説明できるようにすべきだと示唆する（抄録）。", "p6": "著者は、枠組みは理論の構築を支えるもので、語りだけでは実際のチームの過程、正しい判断、監査の質の向上を独立に立証できないと述べる（抄録）。解釈：1か国の事例で、他国や大手の監査法人への一般化には追加の研究が要る。", "fun": "AIが「この取引は問題なし」と言い、ベテランの監査人が「怪しい」と感じたら、どちらを信じるべきか。この研究はガーナの監査人の体験談から、人がAIの答えを疑い、確かめ、ときに覆すまでの手順を整理した。疑う必要があると分かっていても、忙しさや上下関係で疑えないことがある、という区別が面白い。", "unverified": "本文を入手できず、面接の手順、事例の内訳、枠組みの各要素の詳しい定義は確認していない。"}}, {"id": "jr11", "rank": 11, "headline": "業界のCSR評価は企業への信頼を間接に動かす", "title": "A Cross‐Referent Perspective on CSR and Trust: How Industry‐ and Firm‐Level Responsibility Perceptions Shape Consumer Responses", "url": "https://doi.org/10.1002/csr.71186", "authors": "Alan Mathew Kunnumpuram ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-11-20", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "Kunnumpuram, A. M., Supphellen, M., & Bagozzi, R. P. (2026). A Cross‐Referent Perspective on CSR and Trust: How Industry‐ and Firm‐Level Responsibility Perceptions Shape Consumer Responses. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71186", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Corporate Social Responsibility and Environmental Managementの抄録（Crossref）を読んだ。本文は入手できず", "preprint": false, "p1": "企業の社会的責任（CSR）による信頼の形成を業界と企業の水準に分けて調べ、業界のCSRは業界への信頼を高めるが、企業への信頼には企業のCSRの認知を通じて間接にしか効かないこと、論争のある業界では企業の有能さが、CSRによる好意的な感情を信頼につなげる条件になることを示した（抄録）。", "p2": "CSRは利害関係者の信頼を築く仕組みとされるが、研究は個々の企業に集中し、企業が評価される業界の文脈を見落としてきた（抄録）。", "p3": "米国の消費者計1007人の2つの研究で、業界と企業の2つの参照先のCSRの認知を区別し、消費者の感情と企業の有能さの役割を含む「参照先をまたぐ」枠組みを作って検証した（抄録）。解釈：業界全体の評判が悪いとき、個々の企業のCSRがどう受け取られるかを問う設計である。", "p4": "論争のある業界とそうでない業界を比べ、感情の経路が参照先と業界の文脈でどう異なるかを調べた（抄録）。", "p5": "業界と企業のCSRの認知は異なる仕組みで信頼に影響した。業界のCSRは業界への信頼を強め、企業を評価する文脈を作るが、企業への信頼には企業のCSRの認知を通じて間接にしか効かなかった。感情の経路は参照先と業界の文脈で異なり、論争のある業界では、企業の有能さが、CSRによる好意的な感情が信頼を高めるための信憑性の条件として働いた（抄録）。", "p6": "抄録には限界の記述がない。解釈：米国の消費者の結果で、対象の業界や設計（実験か調査か）は抄録では確認できず、他国への一般化には追加の検証が要る。", "fun": "評判の悪い業界の会社が社会貢献をしても、消費者は素直に信用するだろうか。この研究は、業界全体の印象と個々の会社の印象を分けて調べ、論争のある業界では、会社が「仕事ができる」と思われていてこそ、善い行いが信頼につながることを示した。善意だけでは足りないという点が面白い。", "unverified": "本文を入手できず、2つの研究の設計、対象の業界、効果の大きさは確認していない。"}}, {"id": "jr12", "rank": 12, "headline": "運動論の方程式からレイノルズ応力輸送を導く", "title": "Reynolds-stress transport equations from a kinetic theory perspective", "url": "https://doi.org/10.1017/jfm.2026.12283", "authors": "Ziyang Xin ほか", "venue": "Journal of Fluid Mechanics", "date": "2026-11-20", "sjr": 1.283, "citescore": 6.8, "citescore_year": "2025", "apa": "Xin, Z., Guo, Z., & Chen, H. (2026). Reynolds-stress transport equations from a kinetic theory perspective. Journal of Fluid Mechanics, 1047. https://doi.org/10.1017/jfm.2026.12283", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Journal of Fluid Mechanicsの抄録（Crossref）を読んだ。本文は入手できず", "preprint": false, "p1": "乱流の運動論的な定式化と単一緩和時間の閉じ方について、レイノルズ応力の輸送方程式を導き、その閉じ方が古典的なRotta型の等方化項と等方的な散逸に帰着することを示して、運動論的な記述と古典的なレイノルズ応力モデルを直接結びつけた（抄録）。", "p2": "従来の乱流モデルは平均量と低次のモーメントで定式化され、乱流の広い統計的な構造を表す力が限られていた（抄録）。", "p3": "アンサンブル平均した1点の厳密な運動方程式の2次のモーメントを取り、レイノルズ応力の輸送で閉じていない衝突の寄与が、圧力拡散、圧力ひずみによる再分配、粘性拡散、散逸からなることを示した。単一緩和時間のモデルでは、これらが等方性への回帰項と等方的な散逸にまとまる（抄録）。解釈：気体分子の運動論の道具を乱流の統計に当てはめ、どの物理が1つの緩和時間に押し込まれているかを明らかにした。", "p4": "このモデルを一様せん断流に適用し、乱流の運動エネルギーの時間変化、せん断の非等方性、平衡の規格化せん断パラメータを評価し、実験の速度分布関数とも比べた（抄録）。", "p5": "一般的な調整した初期条件の下で、乱流の運動エネルギーの変化をよく再現し、せん断の非等方性の予測も遜色なく、平衡のせん断パラメータも妥当な値になった。速度分布関数では、せん断による主な向きと相関の構造を捉えたが、細かな特徴には食い違いが残った（抄録）。", "p6": "著者は、主な限界は横方向の2つの法線応力の非等方成分を区別できないことで、単一の緩和時間では急速な圧力ひずみ効果を表せないと述べる。そのうえで、高次の輸送モーメントを経験的な閉じ方なしに保つ運動論的な記述は、複数の緩和時間への拡張の基礎として有望だとする（抄録）。", "fun": "乱流の計算では、渦の複雑さを平均やばらつきだけで近似するため、たくさんの経験的な補正が必要になる。この研究は、気体分子の運動を記述する理論を乱流に借り、たった1つの「緩和の時間」で多くの効果がまとまることを示した。同時に、その1つでは足りない部分もはっきりさせた点が面白い。", "unverified": "本文を入手できず、比較した実験のデータと誤差の具体的な値は確認していない。"}}, {"id": "jr13", "rank": 13, "headline": "昼間の目視評価では再帰反射不足の標識を見逃す", "title": "Limits of Daytime Visual Condition Ratings for Targeting Retroreflectivity Measurements of In-Service Traffic Signs in Road Asset Management", "url": "https://doi.org/10.3390/infrastructures11110434", "authors": "Leonardo Zambrano-Salazar ほか", "venue": "Infrastructures", "date": "2026-11-20", "sjr": 0.671, "citescore": 5.7, "citescore_year": "2025", "apa": "Zambrano-Salazar, L., Villacís, C. B., & Buele, J. (2026). Limits of Daytime Visual Condition Ratings for Targeting Retroreflectivity Measurements of In-Service Traffic Signs in Road Asset Management. Infrastructures, 11(11), 434. https://doi.org/10.3390/infrastructures11110434", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Infrastructuresの抄録（Crossref）を読んだ。本文は入手できず", "preprint": false, "p1": "エクアドルの2016年の道路台帳で、日中の目視の状態評価が再帰反射性能の基準を満たさない標識をどれだけ見つけられるかを実測と比べ、不適合の17.6%しか見つけられないこと、説明可能な機械学習による優先づけが測定の効率を上げうることを示した（抄録）。", "p2": "交通標識の台帳に記録される日中の状態評価が、再帰反射性能の要件を満たさない標識を特定できるかは不確かだった（抄録）。解釈：夜に光を返す性能は昼の見た目では分かりにくく、全数の測定は費用がかかるため、何を測るかの優先づけが道路資産管理の課題になる。", "p3": "81の道路区間の16,487枚の標識板で、台帳の評価を、供用中の最低値の基準（NEVI-12）に照らした実測の再帰反射性能と比べ、区間内のまとまりを考慮した。写真による盲検の評価、受け入れ抜き取りのシミュレーション、グループ単位の交差検証、州間の検証、SHAPによる説明を加えた（抄録）。", "p4": "「良」と評価された標識の中での不適合の予測で、ロジスティック回帰とXGBoostを比べ、5%の無作為抽出と予測による優先づけを組み合わせた、過去データでのシミュレーションを行った（抄録）。", "p5": "「良」と評価された板の21.4%が不適合だった。写真の評価者どうしはよく一致したが、不適合の約31%しか見つけられなかった。10枚の抜き取りで不適合を1枚以上見つける確率は、目視で優先づけると無作為より高かった（0.859対0.770）。予測のAUCは0.701と0.708で、州間では性能が下がった。予算30%で「良」の板の不適合の55.6%を見つけた（抄録）。", "p6": "著者は、日中の評価だけで個々の標識の測定を決めるべきではなく、予測による優先づけの性能と実務での有用性には前向きの検証が必要だとする（抄録）。解釈：1か国の台帳のデータで、他国の基準や標識の材料では結果が変わりうる。", "fun": "夜に車のライトを反射して光る道路標識は、昼間に見て「きれい」でも、夜にはちゃんと光らないことがある。この研究は、昼の目視の評価が光らない標識の2割弱しか見つけられないことを、16,487枚の実測で示した。見た目と性能のずれを数字で突きつけた点が面白い。", "unverified": "本文を入手できず、予測モデルの特徴量の詳細と、州ごとの性能の値は確認していない。"}}, {"id": "jr14", "rank": 14, "headline": "振動信号の積み重ね学習で自動車の懸架故障を診断", "title": "Stacking-ensemble based automobile suspension fault diagnosis using vibration signals", "url": "https://doi.org/10.1177/14759217261502220", "authors": "Rudhreesh Kumaar Ratakondala Balarama Naidu Raja ほか", "venue": "Structural Health Monitoring", "date": "2026-11-20", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Ratakondala Balarama Naidu Raja, R. K., Sridharan, N. V., Parameshwaran, A. B., & Sugumaran, V. (2026). Stacking-ensemble based automobile suspension fault diagnosis using vibration signals. Structural Health Monitoring. https://doi.org/10.1177/14759217261502220", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Structural Health Monitoringの抄録（Crossref）を読んだ。本文は入手できず", "preprint": false, "p1": "自動車のサスペンションの複数の故障を振動信号から診断するため、統計量・ヒストグラム・ARMAの特徴を抽出し、上位の分類器を積み重ねる（スタッキング）アンサンブルを作り、ARMAの特徴で正解率100%を達成した（抄録）。", "p2": "乗り心地、安定性、操縦性の向上のため、サスペンションの複数の故障を検出する必要がある（抄録）。", "p3": "一定の荷重の下で振動データを取る専用の実験装置を作り、7種類の故障と健全な状態を調べた。特徴は統計量、ヒストグラム、自己回帰移動平均（ARMA）の3つの方法で抽出し、J48決定木で重要な属性を選んだ。分類は2段階で、8つの単独の分類器（J48、ロジスティックモデル木、多層パーセプトロン、k近傍、ナイーブベイズ、多項ロジスティック回帰、SVM、ランダムフォレスト）を評価し、上位4つを様々に組み合わせて積み重ねた（抄録）。", "p4": "3つの特徴量の組すべてで、スタッキングと単独の分類器を比べた（抄録）。", "p5": "ARMAの特徴で学習したスタッキングが最高の正解率100%を達成し、単独で最良の多項ロジスティック回帰（ARMAの特徴で99.38%）を上回った。スタッキングはすべての特徴量の組で正解率を一貫して高めた（抄録）。", "p6": "著者は、今後は動的な実環境の条件に方法を広げるとしており、検証は一定荷重の実験装置の条件に限られる（抄録）。解釈：正解率100%は同じ装置のデータでの結果で、走行中の車での性能は別に確かめる必要がある。", "fun": "車の足回り（サスペンション）の不具合を、揺れの記録だけからAIで見分ける研究である。7種類の故障を、複数のAIの判断を束ねる方法で、実験では一つも間違えずに当てた。ただし実験台の上での話で、凸凹道を走る本物の車で同じように当たるかが次の勝負になる点が面白い。", "unverified": "本文を入手できず、データの件数、交差検証の方法、故障の種類の内訳は確認していない。"}}, {"id": "jr15", "rank": 15, "headline": "直流側データだけでは損失モデルは尺度まで", "title": "Identifiability of a Regenerative Braking Loss Model for an In-Wheel Motor Drive from Direct-Current-Side Data", "url": "https://doi.org/10.3390/wevj17110612", "authors": "Le Hoang Long ほか", "venue": "World Electric Vehicle Journal", "date": "2026-11-20", "sjr": 0.6, "citescore": 5.4, "citescore_year": "2025", "apa": "Long, L. H., Quang, K. V., Nam, P. H., Thoan, P. V., Hieu, P. M., & Tung, N. T. (2026). Identifiability of a Regenerative Braking Loss Model for an In-Wheel Motor Drive from Direct-Current-Side Data. World Electric Vehicle Journal, 17(11), 612. https://doi.org/10.3390/wevj17110612", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "World Electric Vehicle Journalの抄録（Crossref）を読んだ。本文は入手できず", "preprint": false, "p1": "インホイールモーターの駆動系の損失モデルを電池側の直流（DC）データだけから同定できるかを分析し、制御器の変調の限界が未知だと電気的な母数は共通の倍率までしか決まらないこと、開放電圧から測ったトルク定数でその倍率を固定できることを示した（抄録）。", "p2": "回生ブレーキの制御には、速度と減速度の関数としての駆動系の損失モデルが要る。しかし市販のインホイール駆動では、電池側（直流）のデータしかないことが多い（抄録）。", "p3": "損失モデルの同定可能性を解析し、それに基づく同定の手順を作った。5 kWのハブモーターで開放電圧からトルク定数を測って倍率を固定し、5つの試験でメーカーの負荷試験の報告とモデルを照合し、3つの低速のベンチ試験から一定の損失を求めた（抄録）。解釈：何がデータから原理的に決まり、何が決まらないかを先に確かめてから推定する手順である。", "p4": "すべての定数を範囲の端に取ったときの損失の予測の幅を、被覆区間ではなく組み合わせた範囲の帯として示し、ベンチでの回生の打ち切り速度をモデルと比べた（抄録）。", "p5": "一定の損失は70 ± 20 W、一定の引きずりトルクは2.71 ± 0.40 N·m、等価な鉄損抵抗は1相あたり11.4 Ωと同定された。定数を範囲の端に取ると予測損失は±16〜±32 W変わった。路上では、それより遅いと回生でエネルギーが戻らない打ち切り速度が、1.0 m/s2の減速で4.1 km/hまで下がり、ほぼ停止まで回収できる（抄録）。", "p6": "著者は、ベンチの打ち切り速度はモデルと整合するが、同定から独立した検証ではないと注意する（抄録）。解釈：1つのモーターの事例で、他の駆動系や温度の変化への一般化は抄録では確認できない。", "fun": "電気自動車はブレーキをかけるとき、モーターを発電機にして電気を取り戻す。この研究は、電池側の電気の記録だけで、モーターの損失の仕組みがどこまで分かるかを数学的に確かめ、ほぼ止まる直前までエネルギーを回収できることを示した。測れる量だけで何が分かるかを先に問う姿勢が面白い。", "unverified": "本文を入手できず、5つの試験の内容と、同定に使ったデータの量は確認していない。"}}, {"id": "jr16", "rank": 16, "headline": "スマホで国際ラフネス指数をリアルタイム推定", "title": "Multi-Scale 1D Convolution for Real-Time Smartphone-Based IRI Estimation and Road Roughness Monitoring", "url": "https://doi.org/10.1109/jsen.2026.3752251", "authors": "Lorenzo Manoni ほか", "venue": "IEEE Sensors Journal", "date": "2026-11-19", "sjr": 0.947, "citescore": 7.8, "citescore_year": "2025", "apa": "Manoni, L., Orcioni, S., & Conti, M. (2026). Multi-Scale 1D Convolution for Real-Time Smartphone-Based IRI Estimation and Road Roughness Monitoring. IEEE Sensors Journal, 1. https://doi.org/10.1109/jsen.2026.3752251", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、スマートフォンで取得した信号から多尺度の1次元畳み込みニューラルネットで国際ラフネス指数（IRI）を実時間で推定し、路面の凹凸を監視する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "道路のでこぼこは専用の測定車で測るのが普通だが、スマートフォンでも車の揺れは記録できる。揺れのデータから道路の状態を実時間で言い当てられれば、普通の車が走るだけで道路の点検ができるかもしれない。そんな問いに挑む題名が面白い。", "unverified": "抄録・本文を入手できず、スマートフォンの搭載方法、車両、推定の精度はすべて未確認。"}}, {"id": "jr17", "rank": 17, "headline": "軸箱加速度で無道床軌道の層間はく離を検出", "title": "An intelligent detection method for interlayer separation of ballastless track based on peak spectrum-characterized axle box acceleration", "url": "https://doi.org/10.1016/j.engstruct.2026.124178", "authors": "Aoyu Sun ほか", "venue": "Engineering Structures", "date": "2026-11-19", "sjr": 1.922, "citescore": 12.0, "citescore_year": "2025", "apa": "Sun, A., Shi, H., Li, J., Yu, Z., Shi, J., & Yang, W. (2027). An intelligent detection method for interlayer separation of ballastless track based on peak spectrum-characterized axle box acceleration. Engineering Structures, 372, 124178. https://doi.org/10.1016/j.engstruct.2026.124178", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "ba "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "複数のプラットフォームの文章と画像の口コミを統合するニューラルネットMMINNで、ホテルの販売可能客室1室当たりの収益（RevPAR）の予測精度を高めた（抄録）。", "p3": "消費者の購買意思決定過程に基づく理論枠組みでモデルを設計し、文章と画像の相互作用、交差注意によるプラットフォームをまたいだ特徴の融合、口コミとプラットフォームの単位での顧客の注意に関わる要因を取り入れた（抄録）。", "p5": "文章と画像の情報とその相互作用を取り入れると予測精度が上がり、プラットフォームをまたぐ口コミの追加でさらに予測力が高まった。口コミとプラットフォームごとの情報の寄与の違いをとらえることも収益の予測を強めた（抄録）。", "fun": "ホテルの売上を予想するとき、口コミの点数だけでなく、文章や写真には「部屋がきれい」「朝食が残念」といった細かな手がかりが詰まっている。この研究は、複数の予約サイトの文章と写真をまとめてAIに読ませ、売上の予測を良くした。お客さんの声が経営の数字の予測に変わる点が面白い。", "unverified": "本文は入手できず、対象のホテルとプラットフォームの数、精度の改善幅は確認できなかった。"}}, {"id": "jr25", "rank": 25, "headline": "壁の滑りが粒状体のサイロ排出を速める", "title": "Role of boundary slip in silo discharge: Insights from lattice Boltzmann modeling of dense granular flows", "url": "https://doi.org/10.1103/kxvj-448k", "authors": "Yunjin Huang ほか", "venue": "Physical review. E", "date": "2026-11-17", "sjr": 0.679, "citescore": 4.1, "citescore_year": "2025", "apa": "Huang, Y., Yang, G., Jing, L., & Yao, Q. (2026). Role of boundary slip in silo discharge: Insights from lattice Boltzmann modeling of dense granular flows. Physical Review E. https://doi.org/10.1103/kxvj-448k", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "粒状体の壁面での滑りがサイロからの排出に与える影響を、ナビエ滑り境界条件を入れた格子ボルツマン法（LBM）で定量化し、排出量の尺度則を示した（抄録）。", "p3": "滑り長で無滑りと完全滑りの間を補間するナビエ滑り条件を入れたLBMで、横に排出口を持つ狭いサイロを解析した。μ(I)レオロジーの母数と横壁の滑り長は個別要素法（DEM）のデータから直接取り出し、排出量と内部の流れの構造を再現した（抄録）。", "p5": "滑り長か排出口の高さを大きくすると壁の抵抗が減り流れが速まるが、滑りによる排出の増加は滑り長が粒子径より小さい範囲でのみ効いて飽和した。無滑りの排出量はハーゲン・ベバールー則に従い、滑りの効果を急速に飽和する増幅係数で表す尺度則を提案した（抄録）。", "fun": "砂時計やサイロから粒が流れ出る速さは、昔から知られた経験式で予想できる。では壁がつるつるになれば、どれだけ速く流れるのか。答えは「少しは速くなるが、すぐ頭打ちになる」で、壁の近くの薄い層だけが影響を受けるからだという。粒の流れを液体のように計算する方法で確かめた点が面白い。", "unverified": "本文は入手できず、尺度則の式の具体的な形と比較したDEMの条件は確認できなかった。"}}, {"id": "jr26", "rank": 26, "headline": "コンサルの会計分類が公的負担を見えなくした", "title": "Management consultants – monsters or benign change agents? The case of the NSW transport asset holding entity", "url": "https://doi.org/10.1108/aaaj-02-2026-8860", "authors": "Ann Martin-Sardesai ほか", "venue": "Accounting, Auditing and Accountability Journal", "date": "2026-11-20", "sjr": 1.574, "apa": "Martin-Sardesai, A., Lucas, A. R., & Guthrie, J. (2026). Management consultants – monsters or benign change agents? The case of the NSW transport asset holding entity. Accounting, Auditing & Accountability Journal, 1–32. https://doi.org/10.1108/aaaj-02-2026-8860", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "NSW州の交通資産保有法人（TAHE）の設立で、コンサルタントが会計分類と資産評価を通じて政治的な行為者として働き、長期の財政の実態と公共の利益を見えにくくした過程を示した（抄録）。", "p3": "政治経済学と公益会計の伝統に立ち、コンサルタント支配論（consultocracy）などの視点で、監査総監の報告、議会の調査、財務開示、調査報道などを照合する複数の方法による質的な事例研究を行った（抄録）。", "p5": "コンサルタントは資本の拠出を支出でなく出資に分類するようTAHEの構造と財務を設計し、同じ大手会計事務所の別のチームが矛盾する資産評価を出していた。事務所内の印象管理、チームの分離、異論の抑制がその矛盾を表に出さなかった（抄録）。", "fun": "国や州の借金を見えにくくする方法の一つは、お金を「支出」ではなく「出資」と呼ぶことだ。この研究は、交通インフラの会社を作るとき、外部の専門家がその分類を設計し、同じ事務所内の食い違う評価を表に出さなかった過程を追った。会計の言葉の選び方が政治の道具になる点が面白い。", "unverified": "本文は入手できず、資産評価の金額と資料の具体的な引用は確認できなかった。"}}, {"id": "jr27", "rank": 27, "headline": "ホームシェアで生まれる6種類のケア", "title": "Beyond basic housing and care: Diverse forms of caregiving through homeshare programs with older adults", "url": "https://doi.org/10.1093/geronb/gbag226", "authors": "Angela K Perone ほか", "venue": "Journals of Gerontology - Series B Psychological Sciences and Social Sciences", "date": "2026-11-19", "sjr": 1.503, "citescore": 6.8, "citescore_year": "2025", "apa": "Perone, A. K., Curry, S., Calhoun, M., Zhou, L., Kieu Vi Ton Nu, A., Subijanto, C. M., & Barnesmoore, L. (2026). Beyond basic housing and care: Diverse forms of caregiving through homeshare programs with older adults. The Journals of Gerontology, Series B: Psychological Sciences and Social Sciences. https://doi.org/10.1093/geronb/gbag226", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "非営利のホームシェア（住まいの提供者と住まいを探す人を引き合わせる仕組み）で生まれる高齢者のケアの多様な形を、職員と参加者の面接から6つに整理した（抄録）。", "p3": "米国北カリフォルニアの2つのホームシェア団体で、職員と参加者35人に詳しい面接を行い、ハイブリッドな符号化と主題分析で分析した地域参加型の研究である（抄録）。", "p5": "契約上のケア、契約外の付き添いや食事などの拡張的なケア、金銭的なケア、互恵的なケア、将来の支え合いを見込む創発的なケア、団体による地域のケアが重なり合って現れた。参加者の多くは自分たちの支援を「ケア」とは呼んでいなかった（抄録）。", "fun": "高齢者の家の空き部屋を貸す仕組みでは、家賃のかわりに少し手伝う約束をすることがある。ところが実際には、約束にない話し相手や食事の世話、将来の支え合いまで自然に生まれていた。本人たちが「ケア」と呼ばない支え合いに名前を付けた点が面白い。", "unverified": "本文は入手できず、参加者の内訳と引用された語りは確認できなかった。"}}, {"id": "jr28", "rank": 28, "headline": "時間をコモンズとして共有する都市のケア", "title": "Time as a commons: Collective temporal practices and the making of urban care infrastructures", "url": "https://doi.org/10.1177/00420980261503494", "authors": "Maro Pantazidou", "venue": "Urban Studies", "date": "2026-11-20", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "apa": "Pantazidou, M. (2026). Time as a commons: Collective temporal practices and the making of urban care infrastructures. Urban Studies. https://doi.org/10.1177/00420980261503494", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "危機の続くアテネ中心部の大規模な自主運営の共同食堂の時間の使い方から、都市のケアのコモンズを支える「集合的な時間の仕事」という概念を示した（抄録）。", "p3": "週6日、数百食の温かい食事を作り分け合う共同食堂で10か月の民族誌的な調査を行い、時計の時間という資源と、時計の時間を超えた時間の価値づけの両面から、組織と意味づけの実践を分析した（抄録）。", "p5": "ばらばらの時間を生きる都市の住民が時間を出し合い、時間の規範を作り直して、まとまりのある地域のケアを生み出していることを示し、時間を個人が管理する資源ではなく関係の中で共に作られる財として捉え直した（抄録）。", "fun": "ボランティアの活動は「時間のある人がやるもの」と思われがちだ。しかしこの共同食堂では、忙しくばらばらに暮らす人たちが少しずつ時間を持ち寄り、毎日何百食もの食事を作り続けていた。お金ではなく時間を「みんなの財産」として扱う見方が面白い。", "unverified": "本文は入手できず、参加者の数と具体的な語りは確認できなかった。"}}, {"id": "jr29", "rank": 29, "headline": "IFRS研究1,041本をトピックモデルと人で整理", "title": "Comprehensive Review of IFRS Research: A Machine-Assisted Human Approach", "url": "https://doi.org/10.2308/horizons-2025-090", "authors": "Dante Viana ほか", "venue": "Accounting Horizons", "date": "2026-11-19", "sjr": 1.361, "citescore": 4.3, "citescore_year": "2025", "apa": "Viana, D., & Lourenço, I. (2026). Comprehensive Review of IFRS Research: A Machine-Assisted Human Approach. Accounting Horizons, 1–22. https://doi.org/10.2308/horizons-2025-090", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "1984〜2025年に一流誌に載ったIFRS（国際財務報告基準）の論文1,041本を、トピックモデルと人の検証を組み合わせた機械支援の方法で総覧し、10の研究テーマを整理した（抄録）。", "p3": "ABSの格付けの高い学術誌の論文に潜在ディリクレ配分（LDA）を適用し、人の検証と解釈で主題の構造と発展を描いた。引用のパターン、出版の傾向、影響の大きい著者と学術誌も調べ、生成LLMを文献の地図づくりに使う有用性と限界も評価した（抄録）。", "p5": "IFRS導入の経済的・財務的な帰結と、収斂・調和化の問題の2つのテーマが特に強い学術的な注目を集めていた（抄録）。", "fun": "数十年分、千本を超える会計基準の研究を、人が全部読んで整理するのは大変だ。この研究は、文章の話題を自動で見つける統計の方法で下ごしらえをし、最後は人が確かめる方法で全体の地図を作った。さらに生成AIで同じことができるかも試し、その限界も示した点が面白い。", "unverified": "本文は入手できず、10のテーマの全体と生成LLMの評価の詳細は確認できなかった。"}}, {"id": "jr30", "rank": 30, "headline": "川を渡る移動で公共交通と車の時間差が拡大", "title": "Rivers, peaks and the Car–Transit time gap: Evidence from cross-river travel in Wuhan, China", "url": "https://doi.org/10.1177/23998083261511039", "authors": "Keyu Yao ほか", "venue": "Environment and Planning B: Urban Analytics and City Science", "date": "2026-11-20", "sjr": 1.018, "citescore": 7.5, "citescore_year": "2025", "apa": "Yao, K., & Peng, R. (2026). Rivers, peaks and the Car–Transit time gap: Evidence from cross-river travel in Wuhan, China. Environment and Planning B: Urban Analytics and City Science. https://doi.org/10.1177/23998083261511039", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "武漢で長江を渡る移動が車と公共交通の所要時間の差をどれだけ広げ、混雑時にその差がどう変わるかを、携帯電話の流動データと経路検索の所要時間で示した（抄録）。", "p3": "1週間の携帯電話のOD流動と426の1 kmセルの経路検索の所要時間を結合し、需要で重みづけた車と公共交通の所要時間の対数比の平均（MCG）を定義した。固定効果で長江の横断とその他の移動を比べ、ピーク時の差の縮小を場所の特性と関連づけた（抄録）。", "p5": "公共交通は閑散時に車の2.4倍、朝と夕のピークに1.8倍と1.6倍の時間がかかり、車の時間が34%と43%増えるのに公共交通はほぼ変わらなかった。同じ出発地と目的地では長江の横断で比が9〜12%広がり、朝のピークでも横断の33%で公共交通が車の2倍以上かかった（抄録）。", "fun": "大きな川がある街では、橋やトンネルに車が集中する。川を渡る移動では、電車やバスは車に比べてさらに不利になるのか。データで確かめると、川を渡ると差は広がるが、朝夕の渋滞で車が遅くなるため、ピーク時には地下鉄が強い味方になっていた。地形が交通の勝ち負けを変える点が面白い。", "unverified": "本文は入手できず、ランダムフォレストの説明変数と地下鉄駅からの距離の効果の数値は確認できなかった。"}}, {"id": "jr31", "rank": 31, "headline": "日本の農業用水施設の交渉は予期型と反応型", "title": "Anticipatory and Reactive Negotiation Pathways in Irrigation Infrastructure Development: Evidence From 50 Historical Cases in Japan", "url": "https://doi.org/10.1002/ird.70257", "authors": "Fuki Yagi", "venue": "Irrigation and Drainage", "date": "2026-11-20", "sjr": 0.454, "citescore": 3.8, "citescore_year": "2025", "apa": "Yagi, F. (2026). Anticipatory and Reactive Negotiation Pathways in Irrigation Infrastructure Development: Evidence From 50 Historical Cases in Japan. Irrigation and Drainage. https://doi.org/10.1002/ird.70257", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "1960年代から1980年代の日本の行政報告に記録された50の事例から、農業用水の施設整備をめぐる交渉の過程を、予期的な交渉と反応的な交渉の2つの経路として概念化した（抄録）。", "p3": "水管理の近代化をめぐる交渉を記録した日本の行政報告の50事例を質的内容分析し、交渉の引き金となる条件、主張の性質、調停の仕組み、交渉の結果で比べる過程のモデルを作った（抄録）。", "p5": "計画段階で予想される影響に応じる予期的な交渉は予想される変化と同意の条件に、施設の運用後に実際の影響に応じる反応的な交渉は観察された影響・既存の水利用の取り決め・是正策に集中した。既存の水利用の変化への懸念が主張として表れることが交渉の内容と経過を形づくっていた（抄録）。", "fun": "用水路やダムを新しく作ると、昔からの水の分け方が変わり、もめごとが起きやすい。この研究は、昔の日本の50の事例から、もめごとを工事の前に話し合う場合と、工事の後で問題が起きてから話し合う場合で、交渉の中身がまったく違うことを見いだした。過去の記録を未来の合意づくりに生かす点が面白い。", "unverified": "本文は入手できず、事例の地域と調停の仕組みの具体例は確認できなかった。"}}, {"id": "jr32", "rank": 32, "headline": "組織研究のAI理論の地図と評価", "title": "Mapping and Evaluating the Theoretical Landscape of AI Research in Organizational Studies", "url": "https://doi.org/10.1177/10596011261507318", "authors": "Timea David ほか", "venue": "Group and Organization Management", "date": "2026-11-19", "sjr": 2.543, "citescore": 11.3, "citescore_year": "2025", "apa": "David, T., & Borsi, B. (2026). Mapping and Evaluating the Theoretical Landscape of AI Research in Organizational Studies. Group & Organization Management. https://doi.org/10.1177/10596011261507318", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "組織研究でAIの説明に使われてきた理論を地図化し、それらがAI固有の特徴（複雑な認知的課題の遂行、機械学習による自律的な適応、人の会話に似た相互作用）をどこまで反映しているかを評価した（抄録）。", "p3": "キーワードに基づくクラスタリングと書誌結合で、組織研究でAIを説明するのに使われた理論を特定して地図化し、各理論の有用性、反証可能性、前提、適用範囲をAIの特徴に照らして批判的に評価した（抄録）。", "p5": "研究者は組織研究の固有の理論、借りてきた枠組み、既存理論の拡張を使い、それぞれAIの特定の面に焦点を当てていた。技術の性能の面と人との関係の面を共に含む統合的な理論の必要を示し、理論を評価・開発する指針を示した（抄録）。", "fun": "職場にAIが入ってきたとき、その影響を説明する理論は、もともと人や道具を前提に作られたものが多い。AIは道具なのか、同僚なのか。この研究は、研究者たちがどの理論を借りてAIを説明してきたかを地図にして、その借り方の限界を点検した点が面白い。", "unverified": "本文は入手できず、分析した文献の数と理論の一覧は確認できなかった。"}}, {"id": "jr33", "rank": 33, "headline": "ジョブ・クラフティングとAI利用は別々に成果に効く", "title": "Reimagining HRM: Job Crafting and Artificial Intelligence as Drivers of Organizational Performance in the Public Sector", "url": "https://doi.org/10.3390/su182211811", "authors": "Meera Al Marri ほか", "venue": "Sustainability", "date": "2026-11-20", "sjr": 0.75, "citescore": 8.9, "citescore_year": "2025", "apa": "Al Marri, M., Qureshi, T. M., Ankit, A., & Lanjawi, A. A. (2026). Reimagining HRM: Job Crafting and Artificial Intelligence as Drivers of Organizational Performance in the Public Sector. Sustainability, 18(22), 11811. https://doi.org/10.3390/su182211811", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "ドバイ政府のHR部門の職員の調査で、ジョブ・クラフティング（従業員自身による仕事の再設計）とAIの利用が自己報告の成果にそれぞれ独立に関連し、両者の相乗効果はないことを示した（抄録）。", "p3": "ドバイ政府の組織のHR部門で働く433人の横断的な調査データで、ジョブ・クラフティングとAI利用の直接の関連、AIによる調整効果、性別と年齢による違いを回帰で検定した（抄録）。", "p5": "ジョブ・クラフティング（β = 0.552、p < 0.001）とAI利用（β = 0.166、p < 0.001）はともに成果と正に関連したが、交互作用は有意でなく（B = −0.024、t = −0.650、p = 0.516）、性別・年齢による違いも確認されなかった（抄録）。", "fun": "仕事のやり方を自分で工夫する人と、AIを使いこなす人は、どちらも成果を上げやすい。では両方そろえば効果は倍増するのか。調べると、それぞれは効くが、組み合わせても特別な上乗せはなかった。AIの導入が自動的に人の工夫と相乗効果を生むわけではない点が面白い。", "unverified": "本文は入手できず、測定尺度の項目と標本の詳細は確認できなかった。"}}, {"id": "jr34", "rank": 34, "headline": "ナッジング同化でアンサンブル流体予測を安定化", "title": "Nudging Ensemble Algorithms for Data Assimilation of Incompressible Fluid Flows", "url": "https://doi.org/10.1137/26m184413x", "authors": "Nan Jiang ほか", "venue": "SIAM Journal on Scientific Computing", "date": "2026-11-19", "sjr": 1.618, "citescore": 4.4, "citescore_year": "2025", "apa": "Jiang, N., Layton, W., & Yang, H. (2026). Nudging Ensemble Algorithms for Data Assimilation of Incompressible Fluid Flows. SIAM Journal on Scientific Computing, 48(6), A3427–A3457. https://doi.org/10.1137/26m184413x", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "アンサンブル計算と連続データ同化（ナッジング）を組み合わせる非圧縮性流体の予測計算について数学的な基礎づけを始め、条件の下で真の解に指数的に収束することを証明した（抄録）。", "p3": "すべての実現に共通の係数行列を持つようにアンサンブルの算法を構成して記憶と計算時間を減らし、長時間の安定性と精度を高めるためにナッジングによる同化を組み込んだ（抄録）。", "p5": "いくつかの母数の条件の下で、同化を組み込んだアンサンブルの算法が離散化誤差の範囲まで真の解に指数的に速く収束することを証明し、母数どうしの関係が性能に与える影響を明らかにした。数値実験で長時間の安定性と精度が大きく改善した（抄録）。", "fun": "天気予報では、少しずつ条件を変えた計算を何十本も走らせる「アンサンブル」と、観測で計算を正しい方向へ引き戻す「データ同化」が使われる。この研究は、その組合せが長い時間たっても正しい答えから外れない理由を数学で保証した。経験的な技に理論の裏付けを与えた点が面白い。", "unverified": "本文は入手できず、収束の条件の具体的な形と数値実験の設定は確認できなかった。"}}, {"id": "jr35", "rank": 35, "headline": "複数のLLMエージェントで質的面接を主題分析", "title": "TAMA: A Human–AI Collaborative Thematic Analysis Framework Using Multi-Agent LLMs for Clinical Interviews", "url": "https://doi.org/10.1145/3828752", "authors": "Huimin Xu ほか", "venue": "ACM Transactions on Computing for Healthcare", "date": "2026-11-16", "sjr": 1.705, "citescore": 18.1, "citescore_year": "2025", "apa": "Xu, H., Yi, S., Lim, T., Xu, J., Well, A., Mery, C., Zhang, A., Zhang, Y., Ji, H., Pingali, K., Leng, Y., & Ding, Y. (2026). TAMA: A Human–AI Collaborative Thematic Analysis Framework Using Multi-Agent LLMs for Clinical Interviews. ACM Transactions on Computing for Healthcare, 8(1), 1–17. https://doi.org/10.1145/3828752", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "複数のLLMエージェントの構造化された会話と心臓病の専門家の協働による臨床面接の主題分析の枠組みTAMAを提案し、単一エージェントの手法より良い主題を得た（抄録）。", "p3": "まれな先天性心疾患の子どもの親への面接記録を使い、複数のエージェントが会話で主題を作り、専門家が介在する人とAIの協働の流れを設計した（抄録）。", "p5": "単一エージェントのLLMによる主題分析と比べ、主題の的中率、網羅性、独自性が高く、手作業の負担を大きく減らしつつ質を高めた。実装は公開されている（抄録）。", "fun": "面接の記録から大事なテーマを見つける作業は、人がやると何週間もかかる。この研究は、AIを1人ではなく複数にして話し合わせ、最後に専門家が確かめる方法にした。1人で考えるより話し合ったほうが良い答えが出るのは、AIでも同じだった点が面白い。", "unverified": "本文は入手できず、面接の件数と評価指標の数値は確認できなかった。"}}, {"id": "jr36", "rank": 36, "headline": "推論LLMの討論の合意でテストの正解を生成", "title": "Hallucination to Consensus: Multi-Agent LLMs for End-to-End JUnit Test Generation", "url": "https://doi.org/10.1145/3803418", "authors": "Qinghua Xu ほか", "venue": "ACM Transactions on Software Engineering and Methodology", "date": "2026-11-18", "sjr": 1.59, "citescore": 11.6, "citescore_year": "2025", "apa": "Xu, Q., Wang, G., Briand, L., & Liu, K. (2026). Hallucination to Consensus: Multi-Agent LLMs for End-to-End JUnit Test Generation. ACM Transactions on Software Engineering and Methodology, 35(12), 1–25. https://doi.org/10.1145/3803418", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "Javaの単体テストを、複数の専門化したLLMエージェントの協働で、テストの前段（プレフィックス）と期待値の判定（オラクル）まで一貫して生成する枠組みCANDORを提案した（抄録）。", "p3": "ファインチューニングや外部ツールに頼らないプロンプト設計だけの枠組みで、幻覚を抑えるため複数の推論LLMにパネル討論をさせて合意に基づいてオラクルを作り、推論LLMの冗長な出力を簡潔にする2つのLLMの流れも加えた（抄録）。", "p5": "HumanEvalJavaとより複雑なLeetCodeJavaで、コードの網羅率はEvoSuiteと同等、変異スコアでは明らかに上回り、オラクルの正しさでは最先端のファインチューニング型のTOGLLを、正しいコードと誤りのあるコードの両方で少なくとも21.1ポイント上回った（抄録）。", "fun": "プログラムが正しく動くかを確かめるテストの「正解」をAIに作らせると、AIはもっともらしい間違いをすることがある。そこで複数のAIに話し合わせ、意見が一致した答えを採用した。会議で合意をとる人間のやり方が、AIの間違いを減らすのに役立った点が面白い。", "unverified": "本文は入手できず、使ったLLMとアブレーションの数値は確認できなかった。"}}, {"id": "jr37", "rank": 37, "headline": "病院不動産は公共財か金融資産か", "title": "Healthcare real estate and urban infrastructure: between public good and financial asset", "url": "https://doi.org/10.1177/00420980261497185", "authors": "Jenny Zhenyi Huang ほか", "venue": "Urban Studies", "date": "2026-11-20", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "apa": "Huang, J. Z., & Tsolacos, S. (2026). Healthcare real estate and urban infrastructure: between public good and financial asset. Urban Studies. https://doi.org/10.1177/00420980261497185", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "医療施設の不動産を、公共サービスの社会インフラであると同時に金融資産として統治される「金融化された社会インフラ」として概念化し、英国の事例でその変化と課題を論じた（抄録）。", "p3": "英国の医療施設の不動産について、官民連携（PPP）、不動産投資信託（REIT）、機関投資家を通じた資金調達と統治の変化を、金融化された都市論の観点から検討した（抄録）。", "p5": "金融化は医療不動産の資金調達と統治を作り変え、機関投資家と民間資本の役割を広げた。資本の動員と施設の近代化に役立つ一方、所有・説明責任・アクセス・空間的な公平の課題を生みうるとし、社会的成果と財務を両立させる手段としてインパクト投資と評価枠組みを論じた（抄録）。", "fun": "病院の建物は、患者を治療する場所であると同時に、投資家にとっては家賃を生む資産にもなる。持ち主が投資ファンドになると、どこに病院を建て、誰が使いやすいかが変わるかもしれない。社会に必要な建物とお金もうけの対象という二つの顔を同時に見る視点が面白い。", "unverified": "本文は入手できず、英国の事例の具体的なデータは確認できなかった。"}}, {"id": "jr38", "rank": 38, "headline": "野営の強制撤去は政治で決まり近隣に波及", "title": "The Urban Politics of Homelessness Management: Municipal Decision-Making and Spatial Displacement", "url": "https://doi.org/10.1177/02750740261506495", "authors": "Mingqiu Jiang ほか", "venue": "American Review of Public Administration", "date": "2026-11-20", "sjr": 1.221, "citescore": 4.7, "citescore_year": "2025", "apa": "Jiang, M., Peter, J., & Fu, Y. (2026). The Urban Politics of Homelessness Management: Municipal Decision-Making and Spatial Displacement. The American Review of Public Administration. https://doi.org/10.1177/02750740261506495", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "米国の3大都市（ロサンゼルス、ポートランド、サンフランシスコ）で、市の政治的な意思決定がホームレスの野営の撤去と移動の地理的な違いを生むことを示した（抄録）。", "p3": "2016〜2023年のGIS上の野営の撤去データ、市議会の投票データ、地区の政治的特徴を結合し、2018年のMartin v. Boise判決、市長の交代、COVID-19の緊急命令という外生的なショックを使った差の差法と、空間ラグ・空間誤差モデルで分析した（抄録）。", "p5": "判決の後、保守寄りの議会区は撤去を34%増やし、進歩寄りの区は18%減らした。新しい市長は就任1年目に撤去率が41%高かった。ある地区での強い取り締まりは近隣地区での野営の形成を23%増やした（抄録）。", "fun": "ホームレスのテントを撤去するかどうかは、役所の事務的な判断のように見える。しかしデータを見ると、議員の政治的な立場や市長の交代で撤去の頻度が大きく変わり、追い出された人は近くの地区に移っていた。問題が解決されるのではなく場所が移るだけだという点が考えさせられ、面白い。", "unverified": "本文は入手できず、推定の頑健性と都市ごとの結果の内訳は確認できなかった。"}}, {"id": "jr39", "rank": 39, "headline": "チェーン薬局の一斉閉店で薬局砂漠が生まれる", "title": "Chain Pharmacy Desert Creation: A Census-Tract Analysis of the 2025 Rite Aid Closures in Philadelphia", "url": "https://doi.org/10.1007/s11524-026-01189-6", "authors": "Ruth A. Moyer", "venue": "Journal of Urban Health", "date": "2026-11-19", "sjr": 1.448, "citescore": 6.8, "citescore_year": "2025", "apa": "Moyer, R. A. (2026). Chain Pharmacy Desert Creation: A Census-Tract Analysis of the 2025 Rite Aid Closures in Philadelphia. Journal of Urban Health. https://doi.org/10.1007/s11524-026-01189-6", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "2025年にRite Aidがフィラデルフィアの残り24店をすべて閉じたことで、薬局へのアクセスがどれだけ減り、薬の必要が高い地区でどうなったかを国勢調査区の単位で示した（抄録）。", "p3": "389の国勢調査区の重心から1 km以内のチェーン・スーパー・量販店の薬局の数の閉店前後の変化を、CDCの2024年のPLACESデータで作った薬の必要の指標と組み合わせ、区の固定効果と地区でクラスタ化した標準誤差の準ポアソン回帰で推定した（抄録）。", "p5": "閉店で1 km圏の薬局数は平均23.40%減り、重い病気と一般的な病気の両方の指標が高い83の区では平均48.00%減った。閉店前に1 km圏の薬局が0〜1店だった必要の高い区では、最寄りの薬局までの距離が0.35 km延びた（抄録）。", "fun": "近所の薬局がなくなると、薬が必要な人ほど困る。チェーン薬局が一度に全店を閉めた出来事を「自然の実験」として使うと、もともと薬局が少なく病気の多い地区ほど影響が大きかった。商売の都合で決まる閉店が、地域の健康の格差を広げうることを数字で示した点が面白い。", "unverified": "本文は入手できず、健康の指標の作り方の詳細と頑健性の検証は確認できなかった。"}}, {"id": "jr40", "rank": 40, "headline": "k近傍法の反実仮想説明の計算複雑性", "title": "Explaining k-Nearest Neighbors: Abductive and Counterfactual Explanations.", "url": "https://doi.org/10.1145/3834568", "authors": "Pablo Barceló ほか", "venue": "ACM Transactions on Database Systems", "date": "2026-11-14", "sjr": 0.719, "citescore": 4.5, "citescore_year": "2025", "apa": "Barceló, P., Kozachinskiy, A., Romero, M., Subercaseaux, B., & Verschae, J. (2026). Explaining k-Nearest Neighbors: Abductive and Counterfactual Explanations. ACM Transactions on Database Systems, 52(1), 1–38. https://doi.org/10.1145/3834568", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "k近傍法の分類を、どの特徴がその分類を保証するか（最小十分理由）と、分類を変えるのに最小限どの特徴を変えればよいか（反実仮想説明）で説明する問題の計算複雑性を明らかにした（抄録）。", "p3": "特徴の値が分類にどう影響するかという「特徴の視点」から、離散と連続の特徴空間、距離関数の選び方の影響を区別して、反実仮想説明と演繹的な説明の計算の容易さ・困難さの結果を整理した（抄録）。", "p5": "いくつかの困難性の結果がある一方で、整数二次計画とSATソルバを使えば実際に説明を計算できることを示した（抄録）。", "fun": "「似た人がこう判定されたから、あなたもこうです」というk近傍法は分かりやすい説明に見えるが、特徴が数百もあると、どの特徴が決め手かは分からない。「どこをどれだけ変えれば判定が変わるか」を計算するのがどれほど難しいかを、数学的に整理した点が面白い。", "unverified": "本文は入手できず、各複雑性の結果の詳細と実験の規模は確認できなかった。"}}, {"id": "jr41", "rank": 41, "headline": "2つの時間尺度の系を長時間まで効率的に計算", "title": "Efficient Long-Time Simulations of Dissipative Multiscale Systems via High-Order Numerical Homogenization", "url": "https://doi.org/10.1137/25m1802316", "authors": "Bojin Chen ほか", "venue": "Multiscale Modeling & Simulation", "date": "2026-11-20", "sjr": 1.055, "citescore": 3.1, "citescore_year": "2025", "apa": "Chen, B., Jin, Z., & Li, R. (2026). Efficient Long-Time Simulations of Dissipative Multiscale Systems via High-Order Numerical Homogenization. Multiscale Modeling & Simulation, 24(4), 1829–1857. https://doi.org/10.1137/25m1802316", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "2つの時間尺度を持つ散逸的な多尺度系を、高次の数値均質化に基づく不均質多尺度の手法で、これまで難しかった長時間まで効率的に計算する算法を示した（抄録）。", "p3": "粗い格子での高次の近似と細かい格子での低次の評価を組み合わせる時間方向のマルチグリッド法で、近似の精度を保ちながら計算費用を最小にする（抄録）。", "p5": "事前の誤差評価を厳密に確立し、数値例で検証した（抄録）。", "fun": "速く振動する動きとゆっくり変化する動きが混ざった現象を計算すると、速い振動に合わせて細かく刻む必要があり、長い時間の計算は大変になる。この研究は、粗い刻みと細かい刻みを賢く組み合わせ、長い時間まで計算できるようにした。時間の「拡大鏡」を使い分ける発想が面白い。", "unverified": "本文は入手できず、誤差評価の形と数値例の内容は確認できなかった。"}}, {"id": "jr42", "rank": 42, "headline": "鉱滓はフラクタル粒度で粒子破砕が少ない", "title": "Fractal grading of tailings and its influence on particle breakage", "url": "https://doi.org/10.1139/cgj-2026-0352", "authors": "Alexia Cindy Wagner ほか", "venue": "Canadian Geotechnical Journal", "date": "2026-11-19", "sjr": 1.282, "citescore": 5.8, "citescore_year": "2025", "apa": "Wagner, A. C., Carvalho, J. V. d. A., Coop, M., Silva, J. P. S., & Consoli, N. C. (2026). Fractal grading of tailings and its influence on particle breakage. Canadian Geotechnical Journal. https://doi.org/10.1139/cgj-2026-0352", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、候補の収集時に取得した学術誌の抄録を使用", "preprint": false, "short": true, "p1": "鉄鉱石の鉱滓（尾鉱）を非常に高い圧力まで等方圧縮し、細粒分の違う試料で粒子の破砕と形の変化を調べ、鉱滓の破砕が少ない理由を粒度のフラクタル性で説明した（抄録）。", "p3": "細粒分の異なる鉄鉱石の鉱滓で正規圧密線に沿った挙動を調べ、試験前後に篩分け・沈降分析で破砕を、画像解析で形状を測り、文献の珪砂のデータと比べた（抄録）。", "p5": "鉱滓は均一な砂より破砕が少なく、v–p′平面での圧縮の経路の収束が遅かった。砂の粒子は高圧で球形さ・凸性・縦横比が下がるのに対し、鉱滓の粒子はより球形・凸で縦横比が上がった。選鉱での機械的な破砕で粒度分布がすでにフラクタルな状態に近いためと説明した（抄録）。", "fun": "砂を強く押しつぶすと粒が割れて角ばるのに、鉱山のくず（鉱滓）を押しつぶすと、粒はむしろ丸くなった。鉱滓はもともと機械で砕かれていて、大小の粒がちょうどよく混ざった「フラクタル」な状態になっているからだという。くずの過去の履歴が今の強さを決める点が面白い。", "unverified": "本文は入手できず、最大の圧力と破砕の量の数値は確認できなかった。"}}, {"id": "jr43", "rank": 43, "headline": "列車速度が上がるほど地表振動が増大", "title": "Influence of train speed on ground surface vibrations in urban rail tunnels", "url": "https://doi.org/10.1038/s41598-026-79604-w", "authors": "Sakineh Etemadi ほか", "venue": "Scientific Reports", "date": "2026-11-20", "sjr": 0.893, "citescore": 6.4, "citescore_year": "2025", "apa": "Etemadi, S., Boroujerdi, S. S., Nejati, H. R., Moosavi, S. A., Nateghi, R., Goshtasbi, K., & Abedini, M. (2026). Influence of train speed on ground surface vibrations in urban rail tunnels. Scientific Reports. https://doi.org/10.1038/s41598-026-79604-w", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "テヘラン地下鉄6号線を例に、トンネル内の列車の速度と2列車の同時走行が地表の振動に与える影響を有限要素法で評価した（抄録）。", "p3": "2段階のモデル化で、まず車輪とレールの相互作用による動的荷重を求め、次に有限要素法で地下の列車の走行による地盤の振動を評価した。時速40、60、90 kmの速度と複線の組合せのシナリオで振動速度レベルを解析した（抄録）。", "p5": "2列車が時速90 kmで同時に走るシナリオで地表の振動が最も大きく、振動速度レベルは84デシベルに達し、近隣の住民の妨げになりうる水準だった。速度が上がるほど最大粒子速度が増え、地盤の振動レベルが強まった（抄録）。", "fun": "地下鉄が建物の真下を走ると、揺れや音が住民を悩ませることがある。この研究は、列車の速さと、上下線の列車が同時に通る場合の揺れを計算し、速いほど揺れが大きく、2本が重なると最大になることを確かめた。地下の見えない列車が地上の暮らしに届く仕組みを数字で示した点が面白い。", "unverified": "本文は入手できず、地盤のモデル化の詳細と実測との比較の有無は確認できなかった。"}}, {"id": "jr44", "rank": 44, "headline": "天体望遠鏡の2眼カメラで遠距離の変位を監視", "title": "Long-distance displacement monitoring system and application based on binocular camera of astronomical telescope", "url": "https://doi.org/10.1016/j.engstruct.2026.124186", "authors": "Yunsheng Zhang ほか", "venue": "Engineering Structures", "date": "2026-11-19", "sjr": 1.922, "citescore": 12.0, "citescore_year": "2025", "apa": "Zhang, Y., Fu, W., Xing, L., Zhou, M., Pan, D., Yu, Z., & Dai, W. (2027). Long-distance displacement monitoring system and application based on binocular camera of astronomical telescope. Engineering Structures, 372, 124186. https://doi.org/10.1016/j.engstruct.2026.124186", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、題名検索で見つけた同じ論文の別の記録（SSRN）の抄録を使用", "preprint": false, "short": true, "p1": "天体望遠鏡の超長焦点・大口径の光学系とビームスプリッタのプリズムを使い、1つの視点で2眼のカメラを構成する、遠距離の構造物の変位監視システムを設計した（抄録）。", "p3": "プリズムで望遠鏡の結像空間を分けて視野を広げ、構造物の監視画像と静止した参照点の画像を同時に取得し、ホモグラフィ行列による補正でカメラ自体の動きの誤差を構造物の実際の変位から分離する（抄録）。", "p5": "3つの実験で評価し、遠距離の観測条件で安定した連続の変位計測ができること、カメラの重さ、風、地盤の振動などの実際の条件でもカメラ自身の動きを分離して構造物の実際の変位が得られることを示した（抄録）。", "fun": "遠くの橋の揺れをカメラで測ろうとすると、ズームすれば視野が狭くなり、カメラ自身も風で揺れてしまう。この研究は、天体望遠鏡の中に光を2つに分けるプリズムを入れ、構造物と動かない目印を同時に撮ることで、カメラの揺れを差し引いた。星を見る道具で構造物を見る発想が面白い。", "unverified": "抄録は題名検索で見つけた同じ論文の別の記録から取った。本文は入手できず、観測距離と変位の精度の数値は確認できなかった。"}}, {"id": "jr45", "rank": 45, "headline": "画像追跡と振動計測の融合で建物の変形を再構成", "title": "Multi-level deformation reconstruction of flexure-dominated buildings by fusing vision tracking and vibration sensing: A proof of concept study", "url": "https://doi.org/10.1016/j.engstruct.2026.124177", "authors": "Jiazeng Shan ほか", "venue": "Engineering Structures", "date": "2026-11-20", "sjr": 1.922, "citescore": 12.0, "citescore_year": "2025", "apa": "Shan, J., Bai, Z., & Wang, L. (2027). Multi-level deformation reconstruction of flexure-dominated buildings by fusing vision tracking and vibration sensing: A proof of concept study. Engineering Structures, 372, 124177. https://doi.org/10.1016/j.engstruct.2026.124177", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、画像による追跡と振動センサの計測を融合し、曲げが支配的な建物の多層の変形を再構成する手法の概念実証の研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "高い建物の揺れを、カメラで見える動きと、建物に付けた揺れのセンサの両方から推定すれば、それぞれの弱点を補えるかもしれない。題名によれば、この研究は2種類の情報を組み合わせて建物の各階の変形を再現しようとしている。異なる目を組み合わせる問いが面白い。", "unverified": "抄録・本文を入手できず、対象の建物、センサの構成、再構成の精度はすべて未確認。"}}, {"id": "jr46", "rank": 46, "headline": "微分可能な区間モデル更新を能動学習で効率化", "title": "Efficient Differentiable Interval Model Updating via Reparameterized Dimension-Wise Collocation and Bound-Oriented Active Learning Kriging", "url": "https://doi.org/10.1016/j.ast.2026.114353", "authors": "Jiang Mo ほか", "venue": "Aerospace Science and Technology", "date": "2026-11-19", "sjr": 1.391, "citescore": 10.3, "citescore_year": "2025", "apa": "Mo, J., & Wang, L. (2026). Efficient Differentiable Interval Model Updating via Reparameterized Dimension-Wise Collocation and Bound-Oriented Active Learning Kriging. Aerospace Science and Techno /doi.org/10.1016/j.ijhm.2026.104977", "authors": "Van Hoang Dinh", "venue": "International Journal of Hospitality Management", "date": "2026-11-20", "sjr": 2.316, "citescore": 13.3, "citescore_year": "2025", "apa": "Dinh, V. H. (2027). Navigating digital paradoxes in hospitality: How AI-enabled engagement and techno-invasion shape employee creativity. International Journal of Hospitality Management, 141, 104977. https://doi.org/10.1016/j.ijhm.2026.104977", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、ホスピタリティ業でAIを活用した関わりと、仕事が私生活に入り込む「テクノ侵入」が、従業員の創造性をどう左右するかというデジタルの逆説を扱う研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "AIの道具は仕事を助けてくれる一方で、いつでもどこでも仕事に追いかけられる感覚も生む。題名によれば、この研究はその「便利さ」と「侵入」の両面が従業員の新しい発想にどう影響するかを調べている。同じ技術が助けにも重荷にもなるという問いが面白い。", "unverified": "抄録・本文を入手できず、調査の対象と結果はすべて未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "因果推論", "headline": "価格が反応すると無作為化でも効果推定が偏る", "title": "EXPRESS: Causal Inference With Endogenous Price Response", "url": "https://doi.org/10.1177/00222437261511867", "authors": "Przemyslaw Jeziorski ほか", "venue": "Journal of Marketing Research", "date": "2026-11-20", "sjr": 7.363, "citescore": 11.0, "citescore_year": "2025", "apa": "Jeziorski, P., Leng, D., & Seiler, S. (2026). EXPRESS: Causal Inference With Endogenous Price Response. Journal of Marketing Research. https://doi.org/10.1177/00222437261511867", "why": "処置（特売広告など）が無作為に割り当てられても価格が処置に反応すると、需要を処置だけ、あるいは処置と価格に回帰しても直接効果に偏りが出ることを示し、偏りの符号が価格と処置の相関で決まること、偏りの有無の検定と価格の操作変数による不偏な推定を与える。スーパーのスキャナーデータで、操作変数を使わない場合の偏りが大きいことを示す。"}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "米国の低賃金労働の減少は既存企業の賃上げ", "title": "Rising Wages and the Decline of Low-Wage Work", "url": "https://doi.org/10.1177/00031224261500693", "authors": "Clem Aeppli ほか", "venue": "American Sociological Review", "date": "2026-11-19", "sjr": 3.277, "citescore": 9.0, "citescore_year": "2025", "apa": "Aeppli, C., Roh, S., & Wilmers, N. (2026). Rising Wages and the Decline of Low-Wage Work. American Sociological Review. https://doi.org/10.1177/00031224261500693", "why": "2014〜2024年に実質時給15ドル未満の米国の時給労働者の割合が38%から13%へ減った要因を、行政記録と職場の口コミのパネルで分解し、低賃金企業の退出（創造的破壊）ではなく、既存の低・中賃金企業による賃上げが主因であることを示す。労働市場の逼迫と最低賃金の上昇に加え、企業が低技能職の仕事を再編した効果もあった。"}, {"id": "jn03", "rank": 3, "field": "組織行動・心理的安全性", "headline": "技術規制のロビー活動は知識を競合に漏らす", "title": "Cooperative Needs and Competitive Opportunities: Lobbying for Technology and the Expropriation of Knowledge", "url": "https://doi.org/10.1177/00018392261498222", "authors": "Michael Park", "venue": "Administrative Science Quarterly", "date": "2026-11-20", "sjr": 9.595, "citescore": 13.4, "citescore_year": "2025", "apa": "Park, M. (2026). Cooperative Needs and Competitive Opportunities: Lobbying for Technology and the Expropriation of Knowledge. Administrative Science Quarterly. https://doi.org/10.1177/00018392261498222", "why": "技術政策に関するロビー活動で、社内ロビイストの増加は知識の漏出、外部ロビイストの増加は他社の知識の取り込みの機会を増やすと予測し、ロビイストを雇った米国企業の特許の文章を埋め込みで比べて直接検出した。ロビー活動で共有される情報が競合にとって価値を持つため、政治戦略と革新戦略の交点に新たな競争の動態が生じることを示す。"}, {"id": "jn04", "rank": 4, "field": "機械学習", "headline": "会話と教師を同時に選ぶRLHFの能動学習", "title": "Dual Active Learning for Reinforcement Learning from Human Feedback", "url": "https://doi.org/10.1287/opre.2025.1837", "authors": "Pangpang Liu ほか", "venue": "Operations Research", "date": "2026-11-20", "sjr": 3.759, "citescore": 6.4, "citescore_year": "2025", "apa": "Liu, P., Shi, C., & Sun, W. W. (2026). Dual Active Learning for Reinforcement Learning from Human Feedback. Operations Research. https://doi.org/10.1287/opre.2025.1837", "why": "人のフィードバックからの報酬学習で、ラベルを付ける会話と専門性の異なる人間の教師を同時に選ぶD最適計画に基づく二重の能動学習を提案し、悲観的な強化学習で整合を解く。選択した報酬推定量は一般化分散を漸近的に最小にし、方策の準最適性が標本予算Tに対してO(1/√T)で減ることを示した。"}, {"id": "jn05", "rank": 5, "field": "経営学", "headline": "直近の受注が次の受注を遠ざける", "title": "EXPRESS: The Relationship Between a Salesperson’s Past and Future Performance", "url": "https://doi.org/10.1177/00222429261511608", "authors": "Melissa Baucum ほか", "venue": "Journal of Marketing", "date": "2026-11-20", "sjr": 12.226, "citescore": 29.5, "citescore_year": "2025", "apa": "Baucum, M., Zablah, A. R., Chaker, N. N., & Habel, J. (2026). EXPRESS: The Relationship Between a Salesperson’s Past and Future Performance. Journal of Marketing. https://doi.org/10.1177/00222429261511608", "why": "営業担当者の過去の成績は将来の予測に使われるが、ソリューション営業では受注後の作業負担が次の見込み客の成約を下げることをグラウンデッド・セオリーで見いだし、Fortune 500企業の7年分のCRMデータ（見込み客3,669件）で、複雑な受注ほど過去と将来の成績の関連が弱まることを確かめた。行動実験で因果を、データ内メタ分析で作業負担の仕組みを裏づける。"}, {"id": "jn06", "rank": 6, "field": "因果推論", "headline": "白色雑音を加えて因果の誤検出を減らす", "title": "Causal dynamic resonance reduces false positives in detecting causality", "url": "https://doi.org/10.1073/pnas.2518099123", "authors": "Claudia Lainscsek ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-19", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Lainscsek, C., Salami, P., Dräger, S., Bulsara, A. R., Cash, S. S., & Sejnowski, T. J. (2026). Causal dynamic resonance reduces false positives in detecting causality. Proceedings of the National Academy of Sciences, 123(47). https://doi.org/10.1073/pnas.2518099123", "why": "非線形の動的系で成分間の情報の流れを判定する遅延微分解析に基づく因果の測度に、データへ白色雑音を加える処理を組み合わせると、系を乱さずに偽陽性を棄却できる『因果動的共鳴』を示す。真の結合が分かる結合レスラー系で検証し、実測の脳波データにも適用した。"}, {"id": "jn07", "rank": 7, "field": "経済学", "headline": "道徳的な動機の犯罪は罰で抑止されにくい", "title": "Morally motivated crimes are less sensitive to punishment", "url": "https://doi.org/10.1073/pnas.2624057123", "authors": "Raihan Alam ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-19", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Alam, R., & Rai, T. S. (2026). Morally motivated crimes are less sensitive to punishment. Proceedings of the National Academy of Sciences, 123(47). https://doi.org/10.1073/pnas.2624057123", "why": "罰は犯罪の期待効用を下げて抑止するという想定に対し、道徳的な理由で動機づけられた人は罰に鈍感にな
