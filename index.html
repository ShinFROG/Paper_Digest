<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-11-23", "intro": "プレプリントの新着461件（一覧の候補261件）、学術誌の新着（上位10%誌・重点誌・VBIの監視誌952件・うち一覧の候補249件、その他のQ1・Q2誌の候補47件）、重要論文の候補48件（プレプリント14件・学術誌34件）、新着オープンデータ118件（一覧の候補106件）から選びました。プレプリント・関連23報、プレプリント・注目9報、論文誌・関連43報、論文誌・注目40報、オープンデータ24件です。週末のためarXivの新着がなく、プレプリントの候補はZenodoなど審査のない置き場の文書がほとんどだったため、プレプリントの2部は良い候補がある範囲に件数を絞りました。論文誌も週末の登録で、抄録のない新着が多く候補も少なかったため、論文誌・注目は上位10%誌の新着から各分野の論文を補いました。今日のおすすめ分野（計算社会科学・ネットワーク科学、ヒューマンコンピュータインタラクション）は、論文誌で7報を入れました（プレプリントには該当する候補がありませんでした）。抄録のない新着は各部の16位以下に置きました。e-Statで新しく公開された統計表は0件でした。取得できなかった情報源は Hugging Face Daily Papers（HTTPエラー400）です。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "IPOの約束と実績の乖離は上場後の超過収益と正に関連", "title": "Promises vs. Cash Flows: Narrative-to-Accrual Divergence, Voluntary Disclosure Transparency, and Post-listing Performance in Indian Mainboard and SME IPOs", "url": "https://doi.org/10.2139/ssrn.7715398", "authors": "Gagan Gowda M", "venue": "SSRN", "date": "2026-11-21", "apa": "Gowda M, G. (2026). Promises vs. Cash Flows: Narrative-to-Accrual Divergence, Voluntary Disclosure Transparency, and Post-listing Performance in Indian Mainboard and SME IPOs. https://doi.org/10.2139/ssrn.7715398", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの記録（Crossref）に登録された抄録を使用。本文はSSRNで取得できず", "preprint": true, "p1": "インドのIPOで、目論見書の「約束」と上場後の開示の「実績」のずれを語調と会計発生高の合成指標で測り、上場後の超過収益との正の関連は見かけで、収益の測定期間と報告期間の重なり（先読み）によることを示した（抄録）。", "p2": "利益調整仮説に従えば、目論見書で語る将来と上場後の報告の差は上場後の成績の悪化を予告するはずであり、本研究はこれをインドのメインボード市場と中小企業向け（SME）市場で、語調と会計数値の両面から検証する（抄録）。", "p3": "2022年6月〜2024年9月に上場した59件について、FinBERT（金融文書向けの言語モデル）で測った目論見書の語調から上場後の開示の語調を引いた乖離スコアと、市場区分ごとに推定した修正ジョーンズ・モデルの裁量的発生高を合成し、NADI（語り-発生高乖離指数）を作る（抄録）。解釈：目論見書が上場後の開示より楽観的であるほど乖離スコアは大きくなる。", "p4": "上場日を起点とする買い持ちの超過収益（BHAR）の180日・365日の値への回帰、NADIの三分位の比較に加え、上場後の開示の公表後に始まる重ならない180日窓での再検証と、正則化した勾配ブースティングの交差検証R²で予測力を確かめる（抄録）。", "p5": "NADIが1単位高いと365日BHARが0.131、180日BHARが0.113高く、上位三分位は下位を1年で0.421上回り、関係は語調ではなく発生高によった。しかし重ならない窓では係数0.017（標準誤差0.039）に消え、交差検証R²も0.083にとどまり、見かけの予測力は窓の重なりによると結論した。SME企業は上場時の利益が大きく、開示が遅かった（抄録）。", "p6": "抄録からは著者が挙げる限界は確認できない。解釈：標本は59件・約2年と小さく、重ならない窓での検定力の不足と、FinBERTの語調がインドの開示文書でどこまで妥当かが残る疑問である。", "fun": "会社が株式を公開するとき、目論見書には明るい将来が書かれがちだ。「約束と実際の差が大きい会社ほど株価が上がる」という意外な結果が出たが、よく調べると、株価を測る期間と決算の期間が重なっていたための見せかけだった。データ分析では、答えをこっそり先に見ていないかを確かめることが大切だとわかる好例だ。", "unverified": "本文は入手できず、NADIの合成の重み、回帰の統制変数、SMEとメインボードの差の数値は確認できなかった。未査読のプレプリントである。"}}, {"id": "pr02", "rank": 2, "headline": "加振力のずれが損傷と誤認されうる：航空機実験", "title": "Force Spectrum Audits for AI-Based Structural Monitoring of a Full-Scale Aircraft", "url": "https://doi.org/10.5281/zenodo.24424246", "authors": "Acheneje, Aaron", "venue": "Zenodo", "date": "2026-11-21", "apa": "Acheneje, A. (2026). Force Spectrum Audits for AI-Based Structural Monitoring of a Full-Scale Aircraft. Zenodo. https://doi.org/10.5281/ZENODO.24424246", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "Zenodoに置かれた原稿のPDF（方法・結果・考察・限界の節と表1・2、図1の説明）を読んだ", "preprint": true, "p1": "公開のHawk T1A全機振動試験データで、AIによる損傷検知を評価する前に実測の加振力スペクトルを監査する手順を示し、名目上同じ加振レベルの記録でも実際の加振力が大きく違う例があることを明らかにした（抄録、§3.1）。", "p2": "振動によるSHMでは応答が構造だけでなく加振条件でも変わるため、検知器は入力の変化を損傷と誤認したり、基準が試験条件を代表しないと変化を見逃したりする（§1）。公開データの評価で名目の加振ラベルが実測の力と一致するかは確かめられていなかった（§1）。", "p3": "健全と254.3 gの質量付加の各3記録（名目レベル1・3・5、各10回の加振）で、5つのロードセルの力のパワースペクトル密度（PSD）を5〜256 Hzで求めた（§2.1–2.2）。例：レベル1の目標0.02 N²/Hzなら理想の帯域RMSは√(0.02×251)=2.24 N（§2.2）。次に右翼の21加速度計から、生の加速度の帯域パワーと、5入力21出力のMIMO周波数応答関数（FRF、入力で正規化した応答）の特徴を作り、Ledoit–Wolf共分散のマハラノビス距離による一クラスの新奇検知器に入れた（§2.3）。", "p4": "対象レベルの健全データなしで他の2レベルだけで学習する方式と、対象レベルの健全5回を校正に加える方式で、誤報率・検出率・均衡正解率・ROC AUCを報告し、入力の一致しないペアは損傷の比較から除いた（§2.3）。", "p5": "名目レベル1の質量付加記録のPSDは0.1778 N²/Hz（目標の8.89倍）でレベル3の記録に近く、帯域RMSは6.68 Nと健全レベル1の2.25 Nの約3倍だった（表1、図1）。力のそろったレベル3・5では、校正なしは誤報率0〜100%と不安定で、校正ありはMIMO FRF特徴が両レベルで誤報0/5・検出10/10、生の加速度はレベル3で誤報1/5だった（表2）。", "p6": "216記録中6記録・1機・1か所の質量付加で、繰り返しは独立な標本ではなく、レベル1の不一致の原因も未解明であり、0%や100%の誤り率を一般的な信頼性と解釈すべきでないと著者は述べる（§5）。FRFも加振振幅に依存しうるため、運用時の変動への頑健さは示されていない（§4）。", "fun": "体温計の数字が上がったとき、本当に熱があるのか、測る直前に走ってきたからなのかを区別しないと、診断を誤る。振動で機体の傷みを見つける研究でも同じで、揺らし方が違えば揺れも変わる。この研究は公開データを調べ、同じ強さと書かれた試験の一つが、実は目標の8.89倍の強さで揺らされていたことを見つけた。AIを評価する前にデータの前提を確かめる大切さがよくわかる。", "unverified": "力の不一致の原因（ファイルの対応づけか試験の逸脱か）は著者にも未解明（§4）。解析スクリプトと派生表は請求に応じて提供とされ、再計算はしていない。"}}, {"id": "pr03", "rank": 3, "headline": "地すべり流動計算から地震波形を合成し実記録で検証", "title": "Synthetic seismograms from r.avaflow landslide simulations", "url": "https://doi.org/10.31223/x5q52d", "authors": "Christopher Calvelage ほか", "venue": "EarthArXiv", "date": "2026-11-22", "apa": "Calvelage, C., & Mergili, M. (2026). Synthetic seismograms from r.avaflow landslide simulations. https://doi.org/10.31223/x5q52d", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "EarthArXivの原稿のPDF（抄録、事例と模擬の設定、考察の限界の節、結論）を読んだ。補足の表は読んでいない", "preprint": true, "p1": "地すべりの流動計算コードr.avaflow 4.0を拡張して流れの質量と一次モーメントを毎時間ステップ書き出させ、地すべりが地球に及ぼす力と長周期の合成地震波形を作ることで、遠地の地震計の記録で流動モデルの仮定（摩擦・崩壊量・崩壊順序）を検証できるようにした（抄録、結論）。", "p2": "流動モデルは大規模な地すべりの動きを予測するが、動いている最中の記録で検証されることはまれだった（抄録）。地すべりの力は長周期の地震波を出すので記録と比べられるが、それには経路の影響を補正した合成波形が要る（抄録、考察）。", "p3": "力は一次モーメント（質量×位置の和）の時間の2階微分に負号を付け、付加質量を補正したもので、1次元地球のグリーン関数と畳み込み、GDM52の分散モデルかREM3Dの地図で経路の遅れを補正する（抄録）。解釈：重心の加速度に質量を掛けたものが、地すべりが地面を押し返す力になる。事例として2026年8月26日のネパールの地すべりを、Voellmy摩擦・30 m格子・崩壊体積120 Mm³で模擬した（事例と模擬の節）。", "p4": "平面上の剛体ブロックとの力の一致、震源の分かった20の地震での記録と合成波形の相関、地すべりの観測点での相関と分散減少（VR）、8つの摩擦設定による違いで評価する（抄録、結論）。", "p5": "平面上の力は3秒以降で滑るブロックと1.2%以内で一致した（抄録）。経路の補正で20地震の相関の中央値は50〜150秒帯で0.42から0.78に、ラスワ–トリシュリ地すべりでは30〜150秒帯で0.17から0.43に上がり、その改善は8つの摩擦設定による変化より大きかった。補正しないグリーン関数では質量を2.2倍過小に見積もる（抄録）。", "p6": "取り込み・堆積・領域外への流出は質量を変えるのにモーメントのファイルに記録されず、多相モデルでは未検証で、力はソルバーの数値拡散や格子に依存する（限界の節）。波形は流れの最初の100秒に支配され、到達距離は到達時刻や堆積物のほうがよく制約する（考察）。未査読の原稿である。", "fun": "大きな地すべりは、何千キロも離れた地震計にもゆっくりした揺れとして記録される。山が崩れて土砂が加速すると、その反動で地球を押すからだ。この研究は、コンピュータの中の地すべりが地球を押す力から地震計の記録を予想し、実際の記録と比べた。近くに観測機器がない場所の土砂災害も、世界中の地震計で調べられるようになるという発想が面白い。", "unverified": "観測点ごとの適合と補足の表（摩擦設定ごとの値）は詳しく照合していない。改変したコードと変換パッケージは論文とともに公開とされるが、中身は確認していない。"}}, {"id": "pr04", "rank": 4, "headline": "分割前のSMOTEによる性能水増しを3要因に分解", "title": "Decomposing the Performance Gains of Pre-Split Resampling in Imbalanced Credit Risk Modelling", "url": "https://doi.org/10.5281/zenodo.23232310", "authors": "Xiao, Yixuan", "venue": "Zenodo", "date": "2026-11-22", "apa": "Xiao, Y. (2026). Decomposing the Performance Gains of Pre-Split Resampling in Imbalanced Credit Risk Modelling (Version v1 (preprint). Zenodo. https://doi.org/10.5281/ZENODO.23232310", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "Zenodoの原稿のPDF（抄録、データとモデルの節の一部、限界、結論）を読んだ", "preprint": true, "p1": "不均衡データを訓練・試験に分ける前にSMOTEなどで再標本化すると性能が水増しされるが、その水増しを訓練側の漏洩・合成行の試験への混入・有病率の変化の3つに厳密に分解する方法を示し、内訳が評価指標とモデルの柔軟さで大きく変わることを示した（抄録、結論）。", "p2": "信用リスクや不正検知のモデルはSMOTEで均した不均衡データで学習されることが多く、分割前の再標本化が評価を水増しすることは知られていたが、どの要因がどれだけ寄与するかは定量化されていなかった（抄録）。", "p3": "正しい手順から公表されがちな手順へ条件を1つずつ変える4つの状態を、共通の分割・分割ごとに当てはめた前処理・同じ大きさの訓練集合でたどり、各段の差を各要因の寄与とする。この経路では3つの寄与の和が全ての分割で水増しの総量に一致する（抄録）。解釈：試験の陽性の多くが合成行になると、学んだ合成の点を当てるだけで高得点になりうる。", "p4": "信用リスク・不正検知の3データと広く使われる不均衡ベンチマーク3データ、柔軟さの異なる4モデル（ロジスティック回帰〜XGBoost）、3つの再標本化法、30の乱数シード（計2,160設定）で、有病率に敏感な指標（F1）と鈍い指標（ROC-AUC）を比べた（抄録、§3）。", "p5": "ROC-AUCでは有病率の寄与はゼロで、どの分解順序でも合成行の混入が訓練側の漏洩より大きく、事前に決めた経路で総量の60〜73%を占めた。F1では有病率の寄与がロジスティック回帰で91%、XGBoostで38%だった。手順の違いでROC-AUCの最良モデルが比較の53.5%で入れ替わり（乱数のばらつきの6.3倍）、最も柔軟なモデルに有利に働いた（抄録、結論）。", "p6": "寄与は分解の順序に依存し、漏洩の項は複合的な推定対象で、閾値は0.5に固定、対象は表形式の二値分類に限られる（限界）。大きなデータの間引きの規則を最初の実行後に直すなど、事前登録に3つの事後修正を加えたと著者は明記している（限界）。", "fun": "試験の前に問題と答えを一部見てしまえば、点数が上がるのは当然だ。不均衡なデータを均すとき、分ける前に作業すると、よく似た「作った問題」が試験にも紛れ込む。この研究は、水増しされた点数のうち、どれだけが答えの盗み見で、どれだけが試験に偽物が混ざったせいかを正確に分けた。どの物差しで測るかで主な原因が入れ替わるのが面白い。", "unverified": "データごとの寄与の大きさ（本文の表4）と、分解の順序を変えたときの範囲の数値はすべては照合していない。未査読のプレプリントである。"}}, {"id": "pr05", "rank": 5, "headline": "リアルタイム運行データは定時率を系統的に歪める", "title": "Busting Ghost Buses: Systematic Bias of Real-time Transit Data in On-Time Performance Measurement", "url": "https://doi.org/10.2139/ssrn.7715342", "authors": "Zam Khattak ほか", "venue": "SSRN", "date": "2026-11-21", "apa": "Khattak, Z., & Liu, L. (2026). Busting Ghost Buses: Systematic Bias of Real-time Transit Data in On-Time Performance Measurement. https://doi.org/10.2139/ssrn.7715342", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの記録（Crossref）に登録された抄録を使用。本文はSSRNで取得できず", "preprint": true, "p1": "リアルタイムの運行データ（GTFS-RT）の品質、停留所の時刻の推定方法、報告の間隔が、バスの定時運行率（OTP）の測定を系統的に偏らせることを、150万便と乗客計数器の記録との照合で示した（抄録）。", "p2": "リアルタイムの運行データは運行の信頼性の評価に役立つが、データの誤りと推定法が、事業者の説明責任や運行計画に使う指標を偏らせうる（抄録）。", "p3": "最新の運行予測を使う時間的な方法（TMP）と、時刻つきの車両位置から停留所の時刻を内挿する時空間的な方法（SPT）を比べ、報告間隔を60〜240秒で変える（抄録）。解釈：車両位置が240秒ごとにしか届かないと、停留所の通過時刻は位置の間を補間して推定するしかなく、誤差が増えうる。", "p4": "オハイオ州コロンバスの中央オハイオ交通局の2018〜2021年の150万便について、自動乗客計数器（APC）の記録を基準にした平均絶対誤差と、定時率の推定の偏りで評価する（抄録）。", "p5": "約10%の便に極端なデータの異常があり、そのまま計算した平均絶対誤差はSPTで389秒、TMPで106秒だったが、異常を除くと15秒と42秒で、80%の記録でSPTのほうが正確だった。SPTは報告間隔240秒で精度が大きく落ち、TMPは長期の信頼性の低下は捉えたが早発の多くを見逃し、定時率を10〜15ポイント過大に見積もった（抄録）。", "p6": "抄録からは著者が挙げる限界は確認できない。解釈：1つの事業者・2018〜2021年の結果で、APC自体の誤差、異常の除外基準の決め方、コロナ禍の運行の変化の影響が残る疑問である。", "fun": "「バスの定時率は何%」と発表されても、その数字は測り方しだいで実態とずれることがある。この研究は150万便を調べ、計算方法によっては早く出発してしまう便を見逃し、定時率を10〜15ポイントも高く見積もることを示した。データの約10%に極端な異常が混ざっていたことも驚きだ。数字を信じる前に測り方を確かめる大切さがわかる。", "unverified": "本文は入手できず、異常の判定基準、路線ごとの偏りの違い、早発の定義は確認できなかった。未査読のプレプリントである。"}}, {"id": "pr06", "rank": 6, "headline": "準備金の90%レンジは実績の約65%しか含まない", "title": "How good are reserve ranges? Chain-ladder, Mack and bootstrap tested against realised outcomes in Schedule P data", "url": "https://doi.org/10.5281/zenodo.24432742", "authors": "Mitra, Vivek", "venue": "Zenodo", "date": "2026-11-22", "apa": "Mitra, V. (2026). How good are reserve ranges? Chain-ladder, Mack and bootstrap tested against realised outcomes in Schedule P data. Zenodo. https://doi.org/10.5281/ZENODO.24432742", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録に登録された抄録を使用。本文は入手できず", "preprint": true, "p1": "保険会社の最大の負債である損害の支払備金について、よく使われる推定法の「幅」を米国の実データで事後の実績と照らして採点し、名目90%の幅が実際の結果を64.7〜66.5%の三角表でしか含まないことを示した（抄録）。", "p2": "取締役会・監査人・規制当局は備金の推定値だけでなく幅（レンジ）を求めるようになっているが、よく使われる方法の幅が実際にどれだけ当たるかは、実現した結果で確かめる必要がある（抄録）。", "p3": "支払ベースのチェインラダー法（過去の支払いの伸び方で将来を延ばす方法）、Mackのモデル、過分散ポアソンのブートストラップを、CASの損害備金データベース（NAIC Schedule P、事故年1988〜1997年）の269の会社・種目の三角表に当てはめ、1997年末に分かっていたことだけで推定し、発生から10年目までに実際に支払われた額で採点する（抄録）。", "p4": "備金の総額の推定誤差（中央値）と偏り、名目90%の幅が実績を含む割合（被覆率）、外れたときの方向で評価する（抄録）。", "p5": "支払ベースのチェインラダーは総備金を中央値で21.9%外し、高めに偏った（中央値+11.3%）。名目90%の幅が実績を含んだのはMackのモデルで64.7%、ブートストラップで66.5%の三角表にとどまり、外れの多くは幅の下側だった。報告済みの発生損害にチェインラダーを使うと典型的な誤差は20.1%と同程度だが、偏りはほぼなかった（+1.1%）（抄録）。", "p6": "抄録からは著者が挙げる限界は確認できない。開発中に試した機械学習のモデルは公表結果に含まれない（抄録）。解釈：データは1988〜1997年の事故年に限られ、現在の引受や支払いの慣行に当てはまるか、種目ごとの違いが残る疑問である。", "fun": "保険会社は、すでに起きた事故の将来の支払いに備えてお金を積み立てる。その額を「90%の自信でこの範囲」と示しても、実際に範囲に収まったのは64.7%や66.5%の場合だけだった。しかも外れ方は、見積もりより支払いが少ない側に偏っていた。予測の幅が本当にその自信どおりかを、10年後の答え合わせで確かめた点が面白い。", "unverified": "本文は入手できず、種目ごとの結果と、幅が下に外れる理由の分析は確認できなかった。審査のない置き場の文書である。"}}, {"id": "pr07", "rank": 7, "headline": "長い対話でペルソナを保つ6手法を10モデルで比較", "title": "Evaluating Symbolic Persona Anchoring and Direct KV-Cache Interventions for Multi-Turn LLM Persona Preservation: A Six-Method, 10-Model Longitudinal Study", "url": "https://doi.org/10.5281/zenodo.24424860", "authors": "Nabh Sanjay ほか", "venue": "Zenodo", "date": "2026-11-21", "apa": "Nabh Sanjay, M. (2026). Evaluating Symbolic Persona Anchoring and Direct KV-Cache Interventions for Multi-Turn LLM Persona Preservation: A Six-Method, 10-Model Longitudinal Study (Version 1.0.0). Zenodo. https://doi.org/10.5281/ZENODO.24424860", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "Zenodoの原稿のPDF（抄録、評価指標の節、限界の節）を読んだ。モデル別の詳しい結果の節は読んでいない", "preprint": true, "p1": "公開重みのLLMが長い対話でペルソナ（役柄）を保てるかについて、推論時の6つの介入法を10モデル・4ペルソナ・50ターンで比べる縦断的なベンチマークを作り、汎用の注意書きは意味の保持で最良だが語彙の多様性を損ない、記号的なペルソナの錨付けが両者の両立に優れることを示した（抄録）。", "p2": "公開重みのLLMは長い対話でペルソナが徐々にずれ、注意が薄まり、敵対的なプロンプトや文脈の水増しにも弱い（抄録、§1）。プロンプトによる方法と、KVキャッシュ（注意の計算で保存される鍵と値）に直接手を入れる方法を、同じ条件で長期的に比べる必要があった（§1）。", "p3": "何もしない履歴（A1）、汎用の注意書き（A2）、記号的なペルソナの錨付け（A3、SPA）と、KVキャッシュへの加算的な誘導（A4）、中間層のKVの移植（A5）、潜在的なKVの記憶バンク（A6）を、3B〜14Bの10モデル×4ペルソナの均衡設計（240軌跡・12,000ターン）で比べる（抄録）。主指標は応答の埋め込みと各ペルソナの5つの手本との余弦類似度の平均（Psem）と、50語の移動窓での語彙の多様性（MATTR50）である（§4.5、式14）。", "p4": "群ごとに対応した40セルでの平均の比較、線形混合効果モデルによるターンにともなうずれの傾き、モデルとの交互作用で評価する（抄録、§5–7）。", "p5": "A2は意味の保持が最も高い（Psem=0.4781）が、終盤の語彙の多様性の低下が27.5%の軌跡で起きた。A3は意味の保持で遜色がなく（Psem=0.4589、A2とのずれの差はp=0.388で有意でない）、語彙の多様性が最も高く（MATTR50=0.8155）低下も7.5%と最少だった。KVの介入は構造に敏感で、A5はMistralとQwen-2.5-7Bで最良だが長期の減衰が最も急で、A4とA6は何もしない場合に近づいた（抄録）。", "p6": "人による評価は行っておらずPsemは埋め込みの近さにすぎない、KVの介入は固定の控えめな設定での適用、7B以上は4ビット量子化、混合モデルに境界の収束警告がある、と著者は限界を挙げ、有意でない差は同等性を意味しないとも明記する（§9.3）。", "fun": "AIに「あなたは厳しい先生です」と役を与えても、長く話すうちに役がぼやけていく。この研究では、毎回「役を忘れないで」と念押しする方法が役らしさを最もよく保つ一方で、言葉づかいが単調になりやすかった。役を記号で短く刻み込む方法なら、役らしさを保ったまま言葉の豊かさも残せた。役を保つことと話の豊かさの両立という問題が身近で面白い。", "unverified": "モデルごと・ペルソナごとの詳しい結果（§7）は照合していない。審査のない置き場の文書である。"}}, {"id": "pr08", "rank": 8, "headline": "金額の桁だけ変えるとLLMの交渉の初手が変わる", "title": "Multiply by a Million: Scale Invariance in LLM Negotiators", "url": "https://doi.org/10.5281/zenodo.24420003", "authors": "West, Matt", "venue": "Zenodo", "date": "2026-11-21", "apa": "West, M. (2026). Multiply by a Million: Scale Invariance in LLM Negotiators (Version v1.0.0). Zenodo. https://doi.org/10.5281/ZENODO.24420003", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"id": "pr09", "rank": 9, "headline": "単一ニューロンへの加算で大規模モデルの性格が変わる", "title": "Persona Neurons: Single-Neuron Steering of Personality in a 27B Language Model", "url": "https://doi.org/10.5281/zenodo.24428116", "authors": "Simmons, Josh C.", "venue": "Zenodo", "date": "2026-11-21", "apa": "Simmons, J. C. (2026). Persona Neurons: Single-Neuron Steering of Personality in a 27B Language Model. Zenodo. https://doi.org/10.5281/ZENODO.24428116", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"id": "pr10", "rank": 10, "headline": "参照物なしで遠方からサブピクセルのひび幅を測る", "title": "Image-Based Measurement of Sub-pixel Concrete Crack Widths at Long Distance without In-Image References", "url": "https://doi.org/10.5281/zenodo.24439636", "authors": "Volkov, Egor", "venue": "Zenodo", "date": "2026-11-22", "apa": "Volkov, E. (2026). Image-Based Measurement of Sub-pixel Concrete Crack Widths at Long Distance without In-Image References (Version 1). Zenodo. https://doi.org/10.5281/ZENODO.24439636", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "pr11", "rank": 11, "headline": "記号探索でアンサンブルカルマンの局所化則を発見", "title": "Automated Discovery of Data Assimilation Localization, Robust Adaptive Inflation, and Scale-Equivariant MAD-ISTA Laws via AlphaEvolve-Style Symbolic Program Search", "url": "https://doi.org/10.5281/zenodo.24443400", "authors": "Imai, Kengo", "venue": "Zenodo", "date": "2026-11-22", "apa": "Imai, K. (2026). Automated Discovery of Data Assimilation Localization, Robust Adaptive Inflation, and Scale-Equivariant MAD-ISTA Laws via AlphaEvolve-Style Symbolic Program Search (Version v1.0). Zenodo. https://doi.org/10.5281/ZENODO.24443400", "theme": "確率動力学・計算力学", "theme_no": 8}, {"id": "pr12", "rank": 12, "headline": "AIの研究案が実行後に見劣りするのは選抜の呪い", "title": "Why Machine-Generated Ideas Look Better Before Execution: A Winner's-Curse Account of the Ideation–Execution Gap", "url": "https://doi.org/10.5281/zenodo.24443273", "authors": "Figurelli, Rogério", "venue": "Zenodo", "date": "2026-11-22", "apa": "Figurelli, R. (2026). Why Machine-Generated Ideas Look Better Before Execution: A Winner's-Curse Account of the Ideation–Execution Gap. Zenodo. https://doi.org/10.5281/ZENODO.24443273", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"id": "pr13", "rank": 13, "headline": "在宅技術の介護負担軽減は小さく仕事が移る", "title": "Home technologies and the burden on family caregivers: modest benefits, shifted work and the idea of net burden", "url": "https://doi.org/10.5281/zenodo.24425826", "authors": "Nogarotto ほか", "venue": "Zenodo", "date": "2026-11-21", "apa": "Nogarotto, L., & Pantoufle srl. (2026). Home technologies and the burden on family caregivers: modest benefits, shifted work and the idea of net burden. Zenodo. https://doi.org/10.5281/ZENODO.24425826", "theme": "包摂的コミュニティ・社会", "theme_no": 4}, {"id": "pr14", "rank": 14, "headline": "エージェント間で指示が伝染する速さと防御を測定", "title": "Instruction Propagation, Memory Poisoning, and Epistemic Contagion in Multi-Agent Ecosystems: An Empirical Evaluation", "url": "https://doi.org/10.5281/zenodo.24430383", "authors": "Bethi ほか", "venue": "Zenodo", "date": "2026-11-22", "apa": "Bethi, B. R., & Subbammagari, S. (2026). Instruction Propagation, Memory Poisoning, and Epistemic Contagion in Multi-Agent Ecosystems: An Empirical Evaluation (Version 1.0.0). Zenodo. https://doi.org/10.5281/ZENODO.24430383", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"id": "pr15", "rank": 15, "headline": "互恵的な共感を測る9項目尺度を生理指標でも検証", "title": "Validation of the Tripartite Reciprocal Empathy-State Scale (TRESS): Measuring Empathy as a Multicomponential, Somatically Grounded, and Interpersonal Process", "url": "https://doi.org/10.21203/rs.3.rs-11466198/v1", "authors": "Valentina Cimmino Picone ほか", "venue": "Research Square (In Review)", "date": "2026-11-22", "apa": "Picone, V. C., Kleinbub, J. R., Pick, E., Capuani, V., Rocco, D., & Palmieri, A. (2026). Validation of the Tripartite Reciprocal Empathy-State Scale (TRESS): Measuring Empathy as a Multicomponential, Somatically Grounded, and Interpersonal Process. https://doi.org/10.21203/rs.3.rs-11466198/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4}, {"id": "pr16", "rank": 16, "headline": "介護者の「常時の見守り」の定義と測定を整理", "title": "Vigilance in family caregiving: definitions, measures and the effects of monitoring technologies", "url": "https://doi.org/10.5281/zenodo.24426241", "authors": "Nogarotto ほか", "venue": "Zenodo", "date": "2026-11-21", "apa": "Nogarotto, L., & Pantoufle srl. (2026). Vigilance in family caregiving: definitions, measures and the effects of monitoring technologies. Zenodo. https://doi.org/10.5281/ZENODO.24426241", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録（DataCite）に登録された抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "認知症の家族介護者が作業していないときも「当番中」と感じる状態（vigilance、常時の見守り）について、看護学の定義・尺度と、経済学・生活時間調査の「見守り時間」を比べ、見守り技術の効果を整理した覚え書き（抄録）。", "p3": "米国で検証された4項目の尺度（イタリア語版は見当たらない）、国連女性機関の認知テストでの暫定的な定義、補助機器・遠隔見守りとセンサー・通知の2つの試験、質的研究を比べた（抄録）。", "p5": "2つの試験では介護負担や抑うつの指標はどれも改善せず、一方の試験で不安が6か月時点だけ低かったが全体の効果は有意でなかった。質的研究では心配が減る一方、通知で起こされる、新たな義務感を持つという声もあった（抄録）。", "fun": "介護は「何かをしている時間」だけでなく、「何かあったらすぐ動けるよう気を張っている時間」もつらい。この覚え書きは、その目に見えない負担をどう定義し、どう測るかを整理した。見守りをセンサーに任せても負担の指標は改善せず、通知に起こされる人もいたという点は、技術が負担を消すとは限らないことを示していて考えさせられる。", "unverified": "本文は入手できず、取り上げた試験の規模・対象と、提案された作業定義の中身は確認できなかった。審査のない置き場の文書である。"}}, {"id": "pr17", "rank": 17, "headline": "見守り機器の誤報と見逃しが介護者に課す負担", "title": "False alarms and missed events in home monitoring: costs for caregivers and for the people they care for", "url": "https://doi.org/10.5281/zenodo.24426451", "authors": "Roberto ほか", "venue": "Zenodo", "date": "2026-11-21", "apa": "Roberto, M., & Pantoufle, S. (2026). False alarms and missed events in home monitoring: costs for caregivers and for the people they care for. Zenodo. https://doi.org/10.5281/ZENODO.24426451", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録（DataCite）に登録された抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "高齢者・認知症の人の在宅見守りシステムの誤報と見逃しが、実際の利用でどのくらい起き、介護者と本人に何を負わせるかを、既存の研究から整理した覚え書き（抄録）。", "p3": "実際の転倒を含む研究、90歳以上のコホート、米国の試験、20の実験室実験の統合などを検討し、信頼性の低いシステムがシステムなしより悪くなる条件を問う（抄録）。", "p5": "ある試行では装着型の機器が84回中83回の誤報を出し、90歳以上のコホートでは押しボタン式の警報はほぼ常に設置されていたが多くの転倒で使われなかった。実験室の統合では信頼性約70%未満で自動化はないより悪いと推定されたが、家庭でそれを示した研究は見つからなかった（抄録）。", "fun": "火災報知器が何度も誤作動すると、人は本当の火事でも逃げなくなる。見守りセンサーでも同じことが起きうる。この覚え書きでは、84回中83回が誤報だった機器の例や、誤報のあとでセンサーを動かしたり切ったりした介護者の話が紹介される。機械の「正しさの割合」が人の行動を変え、効果を左右するという視点が面白い。", "unverified": "本文は入手できず、各研究の規模や、筆者らが解釈として示した危険の条件と対策の中身は確認できなかった。審査のない置き場の文書である。"}}, {"id": "pr18", "rank": 18, "headline": "CNNで床版表面損傷を判定しArduinoで警報", "title": "AI-CNN BASED BRIDGE DECK SURFACE DAMAGE DETECTION AND INTELLIGENT MAINTENANCE ALERT SYSTEM USING ARDUINO UNO", "url": "https://doi.org/10.5281/zenodo.24439725", "authors": "L.SRAVANI ほか", "venue": "Zenodo", "date": "2026-11-22", "apa": "L.SRAVANI, HARI BABU, PAMPURAM DAKESHWARI, RATHOD ANIL. (2026). AI-CNN BASED BRIDGE DECK SURFACE DAMAGE DETECTION AND INTELLIGENT MAINTENANCE ALERT SYSTEM USING ARDUINO UNO. jicr.org. https://doi.org/10.5281/ZENODO.24439725", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録に登録された抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "橋梁床版の表面のひび割れ・剥離を画像のCNNで選別し、低価格のマイコン（Arduino Uno）は通知の受信と警報だけを担う、点検から警報までの構成を提案した原稿（抄録）。", "p3": "画像の取得・品質の選別・関心領域の抽出・正規化・CNNの特徴学習・信頼度による判定・記録・通知の流れを定め、不確かな予測は人が確認する関門を置く。SDNET2018などの公開データを候補に挙げるが、学習も現地試験も行っていない（抄録）。", "p5": "結果は示されず、再現可能な評価の手順と、例示と明記した解析の図を示すにとどまる。運用の前に較正、現地の画像、インターフェースの定義、橋梁工学の検証が必要だとしている（抄録）。", "fun": "AIで橋のひび割れを見つける研究は多いが、この原稿は「重い計算はAIの側、警報を鳴らすのは安いマイコンの側」と役割を分けた点がポイントだ。ただし実際の学習や現場の試験はまだで、設計図の段階である。何ができていて何がまだかをはっきり書いている点は、提案論文の読み方の練習にもなる。", "unverified": "本文は入手できず、提示された式と評価手順の詳細は確認できなかった。学習と現地試験は行われていない（抄録）。"}}, {"id": "pr19", "rank": 19, "headline": "物理制約つき残差LSTMで河川水位を多段予測", "title": "Physics-Informed residual LSTM with adaptive simplex loss weighting for multi-horizon river water level forecasting", "url": "https://doi.org/10.5281/zenodo.24440631", "authors": "Tran ほか", "venue": "Zenodo", "date": "2026-11-22", "apa": "Tran, K.-T., & Ta, Q. C. (2026). Physics-Informed residual LSTM with adaptive simplex loss weighting for multi-horizon river water level forecasting (Version 1.0). Zenodo. https://doi.org/10.5281/ZENODO.24440631", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録（DataCite）に登録された抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "背水の影響が強い低勾配の流域で、持続性の近道（スキップ接続）と、状態に応じて重みを変える経験的な罰則を組み込んだ残差LSTMで、1・3・6・24時間先の河川水位の変化を予測した（抄録）。", "p3": "ベトナムのPhan–Cà Lồ流域のMạnh Tân地点の時間水位で、2020〜2024年を学習、2025年を検証、2026年を試験に使い、持続性・線形回帰・ラグつきRidge・ARIMA・制約なしのLSTM・固定重みの正則化と比べた（抄録）。", "p5": "雨季の24時間先の平均絶対誤差は対応する残差LSTMの0.1450 mから0.1282 mに下がったが、短い先行時間の誤差は増え、雨季のマクロ平均ではラグつきRidgeのほうが低く、固定重みに対する明確な優位も信頼区間からは示せなかった（抄録）。", "fun": "川の水位予測では「今の水位がしばらく続く」という単純な予測（持続性）がとても強い。この研究はAIにその近道と物理的な制約を組み込んだが、24時間先は良くなっても数時間先は悪くなり、単純な回帰に負ける場面もあった。複雑なモデルが常に勝つわけではないことを、著者自身が率直に示している点が面白い。", "unverified": "本文は入手できず、4つの経験的な罰則の中身と背水の扱いの詳細は確認できなかった。試験期間は以前にも検討したものだと著者は述べている（抄録）。"}}, {"id": "pr20", "rank": 20, "headline": "顔を記録せず人を検出するガウス開口カメラ", "title": "A Gaussian Aperture Camera for Person Detection Without Face Recording", "url": "https://doi.org/10.5281/zenodo.24424342", "authors": "Zhang ほか", "venue": "Zenodo", "date": "2026-11-21", "apa": "Zhang, H., & Bai, J. (2026). A Gaussian Aperture Camera for Person Detection Without Face Recording. Zenodo. https://doi.org/10.5281/ZENODO.24424342", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録（DataCite）に登録された抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "無限遠に焦点を合わせ、透過率が中心からガウス曲線で滑らかに減る開口（ガウス開口）を使い、場面の中で一定の物理的なぼけの大きさを保つことで、距離によらず顔の細部を消して体の輪郭を残すカメラを提案した（抄録）。", "p3": "既存の光学的プライバシーカメラはセンサー上で一定の画素幅のぼけをかけるため近い顔にはぼけが小さすぎ遠い人には大きすぎると指摘し、COCOの人物検出とLFWの顔照合のベンチマーク、カメラのモデルに通した実写真で比べた（抄録）。", "p5": "最先端のMeta-Opticsのプライバシーカメラに比べ、人物検出の平均適合率（AP）を36.9から45.7に上げ、顔照合のAUROCを0.72から0.66に下げた。近距離・遠距離の実写真でも人は検出でき、ぼけを戻しても顔は照合できなかったとする（抄録）。", "fun": "防犯カメラで「人がいるか」は知りたいが「誰か」は記録したくない、という矛盾をレンズの形で解こうとしている。普通のぼかしは画面上で一定の幅なので、近くの顔はぼけ足りず、遠くの人はぼけすぎる。そこで「現実の空間で一定の大きさ」にぼけるレンズにした、という発想の転換が面白い。計算なしで、光の段階でプライバシーを守れる。", "unverified": "本文は入手できず、ガウス開口の実装方法と、カメラのモデルによる模擬と実機の違いは確認できなかった。審査のない置き場の文書である。"}}, {"id": "pr21", "rank": 21, "headline": "コロンビアの認知症介護で「介護者」の語を分析", "title": "Semantic and discursive analysis of the linguistic unit “caregiver” in corpus based on the help of the Alzheimer's patients in the Colombian context.", "url": "https://hal.science/hal-05875559v1", "authors": "Jenny Moreno", "venue": "HAL", "date": "2026-11-21", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "HALに登録された抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "コロンビアで家族がアルツハイマー病の人を世話することが「自然なこと」とされる言説に注目し、「介護者（caregiver）」という語の表す意味と、家族介護者の語りに表れるアイデンティティを分析した（抄録）。", "p3": "論証可能性の意味論と談話分析の枠組みで2つの探索的研究を行い、第1に語彙としての「介護者」を言語的・談話的に探り、第2に家族介護者への面接の談話をゴフマンの「面目（face）」と「社会的面目」の概念で分析した（抄録）。", "p5": "面目の構築と「自然な介護」の結びつきを、選んだコーパスの分析から列挙・例示するとしている。抄録には具体的な結果の記述はない（抄録）。", "fun": "「家族なら介護して当然」という空気は、言葉の使われ方の中に埋め込まれている。この研究は「介護者」という一つの言葉と、介護する家族の語りを細かく分析して、その「当然さ」がどう作られるかを探る。何気ない言葉づかいから社会の思い込みを読み解くという、言語学ならではの方法が面白い。", "unverified": "本文は入手できず、コーパスの規模・面接の人数と、具体的な分析結果は確認できなかった。"}}, {"id": "pr22", "rank": 22, "headline": "多情報源で検証した子育て・学習支援の尺度", "title": "Holistic Parenting &amp; Student Support Inventory (HPSSI): Multi-Informant Psychometric Validation, Incremental Validity, and COSMIN Two-Week Test–Retest Reliability Across Grades K–12", "url": "https://doi.org/10.31235/osf.io/rpbg6", "authors": "Alexander Kuznetsov", "venue": "SocArXiv", "date": "2026-11-21", "apa": "Kuznetsov, A. (2026). Holistic Parenting &amp; Student Support Inventory (HPSSI): Multi-Informant Psychometric Validation, Incremental Validity, and COSMIN Two-Week Test–Retest Reliability Across Grades K–12. https://doi.org/10.31235/osf.io/rpbg6", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SocArXivの記録（Crossref）に登録された抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "スマートフォン・オンラインゲーム・学校のポータルといった現代の家庭の摩擦を扱い、保護者用と子ども用をそろえた幼稚園〜高校（K–12）の子育て・学習支援の尺度（HPSSI、60項目の版と40項目の短縮版）を開発・検証した（抄録）。", "p3": "専門家28人の内容妥当性、16組の認知面接、米・英・加・豪の659家族の第1波で順序尺度の確認的因子分析と測定不変性、既存のAPQの5尺度を超える増分妥当性を調べ、約14日後の203組の第2波で再検査信頼性を確かめた（抄録）。", "p5": "8因子モデルが支持され（60項目版のCFI=.953〜.968、RMSEA=.048〜.051）、信頼性はωt=.954〜.966、親子の一致はr=.773だった。APQを超えて11の基準でΔR²=+.085〜+.204を説明し、再検査のICCは保護者.814・子ども.792だった（抄録）。", "fun": "昔の子育ての質問紙はスマホやゲームがない時代に作られたので、今の家庭のもめごとを測れていない。この研究は親用と子ども用の質問をそろえた新しい尺度を作り、親と子の答えの一致や、2週間後に同じ答えになるかまで確かめた。物差しを作るときに何を確かめれば信頼できるのかが一通りわかる例になっている。", "unverified": "本文は入手できず、8つの下位尺度の項目内容と、標本の集め方は確認できなかった。未査読のプレプリントである。"}}, {"id": "pr23", "rank": 23, "headline": "裁判官が主導するAI起案を下級裁判所で観察", "title": "Who Initiates the Draft? Judge-Controlled AI Drafting in a Bangladeshi Magistrate's Court", "url": "https://doi.org/10.2139/ssrn.7715458", "authors": "Md. Al-Amin", "venue": "SSRN", "date": "2026-11-21", "apa": "Al-Amin, Md. (2026). Who Initiates the Draft? Judge-Controlled AI Drafting in a Bangladeshi Magistrate’s Court. https://doi.org/10.2139/ssrn.7715458", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの記録（Crossref）に登録された抄録を使用。本文は入手できず", "preprint": true, "short": true, "p1": "400万件超の事件が滞るバングラデシュの治安判事裁判所で、判事自らが設計した、大規模言語モデルが常設の規則の下で供述調書・命令・判決を起案する仕組みの運用を記録した単一裁判所の事例研究（抄録）。", "p3": "2026年10月15日〜11月11日に25件の事件で41の文書が起案され24が確定した。主な証拠は判事が機械の草稿に加えて規則として残した18の修正で、誰が決めるか（5）、記録への忠実さ（4）、法的な形式と言い回し（6）、出典と開示（3）に分けた（抄録）。", "p5": "自分から起案を始める組み込みのアシスタントは11月6日に止められ、判事の求めに応じたときだけ起案する形に変えた。著者は、監督は作業の順序、とくに誰が起案を始めるかで確保され、判事を増やさずに処理能力を足しうると論じる（抄録）。", "fun": "AIに判決文の下書きをさせるとき、「AIが勝手に書き始める」か「判事に頼まれて書く」かで、人の統制は大きく変わる。この事例では、自分から書き始めるAIを止め、頼まれたときだけ書く形に変えた。誰がボタンを押すかという作業の順番が責任の所在を決める、という指摘はAIと働く多くの職場に通じる。", "unverified": "本文は入手できず、18の修正の具体例は確認できなかった。著者は、1つの裁判所・判事が開発者でもある・28日間・比較の基準なし、という限界を挙げている（抄録）。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "高難度ベンチの成績は調査回答の符号化精度を予測せず", "title": "The Frontier Premium Is Narrow: Benchmark Capability, Price, and Open Weights in LLM Coding of Open-Ended Survey Responses", "url": "https://doi.org/10.31235/osf.io/5g34x", "authors": "Chris Soria", "venue": "SocArXiv", "date": "2026-11-21", "apa": "Soria, C. (2026). The Frontier Premium Is Narrow: Benchmark Capability, Price, and Open Weights in LLM Coding of Open-Ended Survey Responses. https://doi.org/10.31235/osf.io/5g34x", "why": "Humanity's Last Exam（HLE）の得点が高いモデルほど、調査の自由回答の符号化で人間の符号化者と一致するかを、6社の18モデル（半数は重みの公開されたモデル）がベイエリアのパネル調査の3つの自由回答を符号化した結果で調べた。HLEの得点は人との一致度を安定して予測せず、最先端モデルの優位は狭い範囲にとどまることを示す。"}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "値上げか容量減か：競争下の最適な包装サイズ", "title": "Competitive Package Size Decisions, Pricing, and Shrinkflation", "url": "https://doi.org/10.2139/ssrn.7715499", "authors": "Armagan Ozbilge ほか", "venue": "SSRN", "date": "2026-11-21", "apa": "Ozbilge, A., Charlebois, S., & Golmohammadi, A. (2026). Competitive Package Size Decisions, Pricing, and Shrinkflation. https://doi.org/10.2139/ssrn.7715499", "why": "原材料費の上昇に対し、価格を上げる対応と内容量を減らす対応（シュリンクフレーション）を初めて解析的に比べる複占モデルを作る。価格と包装サイズを内生的に決め、原料費・製造費と、消費者が容量の変化に気づきにくいことを組み込み、一方のブランドが値上げ、他方が価格を据え置いて容量を調整する場合の均衡を特徴づける。"}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "専門家予測で景気・物価・失業の同時裾リスク予測", "title": "Multivariate Economic Tail Risk and Scenario Analysis using the survey of Professional Forecasters", "url": "https://econpapers.repec.org/RePEc:awi:wpaper:0771", "authors": "Schick ほか", "venue": "RePEc NEP", "date": "2026-11-09", "why": "米国の専門家予測調査（SPF）の合意予測をAR-GARCH型モデルの条件付き平均に入れ、GDP成長率・インフレ率・失業率の単変量と多変量の予測分布の精度を高める。一定の相関行列でGDP成長率と失業率の強い依存を捉え、1990〜2024年のデータで、他の変数の悪化を条件とした予測分布が基準の周辺分布と大きく異なるシナリオ分析ができることを示す。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "経済指標の発表が市場に広がる速さを感染モデルで測る", "title": "Information Diffusion around US Macroeconomic Releases: Epidemic, Influence and Predictive Models, with an Application to Market Making", "url": "https://doi.org/10.2139/ssrn.7715658", "authors": "Aleksandar Hristev", "venue": "SSRN", "date": "2026-11-21", "apa": "Hristev, A. (2026). Information Diffusion around US Macroeconomic Releases: Epidemic, Influence and Predictive Models, with an Application to Market Making. https://doi.org/10.2139/ssrn.7715658", "why": "CPI・雇用統計・FOMCの発表の直後に価格が数秒かけて調整する過程を、コンパートメントモデルとHawkes過程による吸収の速さ、先行・遅行のネットワーク、カスケードと取引活動の予測の3部で捉える。米国株のETF30本とKalshi・Polymarketの予測市場の2025年1月〜2026年10月のデータを使い、最後の4か月を検証用に残して、マーケットメイクの規則の改善に応用する。"}, {"id": "pn05", "rank": 5, "field": "経済学", "headline": "リパッケージ取引の損失を4状態に分けて資本を割当", "title": "Beyond Gap Risk: A Framework for Capitalising Credit Repacks", "url": "https://doi.org/10.2139/ssrn.7715378", "authors": "Jean Jacques Kamdem", "venue": "SSRN", "date": "2026-11-21", "apa": "Kamdem, J. J. (2026). Beyond Gap Risk: A Framework for Capitalising Credit Repacks. https://doi.org/10.2139/ssrn.7715378", "why": "限定責任のリパッケージ（再組成）ビークルを相手とするスワップで銀行が負う損失を、担保債券の不履行による契約上の不足と、ビークル自体の破綻に分ける。条件付き期待損失の恒等式として、純粋な破綻の項・純粋な債券不履行の項・交互作用の項に分解し、各項を市場リスクの枠組みなど資本を課す枠組みに対応づける。"}, {"id": "pn06", "rank": 6, "field": "経済学", "headline": "自己相似性と流動性をエントロピー重みで同時に測る", "title": "Liquidity Measurement through Entropy Weighting under Fractal Market Conditions", "url": "https://doi.org/10.2139/ssrn.7714498", "authors": "Mohammad Shipon ほか", "venue": "SSRN", "date": "2026-11-21", "apa": "Shipon, M., Karbhari, Y. D., & Bozdog, D. (2026). Liquidity Measurement through Entropy Weighting under Fractal Market Conditions. https://doi.org/10.2139/ssrn.7714498", "why": "投資期間の組で再尺度化した横断的なリターン分布をコルモゴロフ・スミルノフ距離で比べて時変のハースト指数を推定し、Amihudの非流動性・Pastor-Stambaughの流動性・ボラティリティをシャノン・エントロピーで重み付けした合成流動性指数と組み合わせ、市場の流動性と自己相似性の関係を体系的に測る枠組みを作る。"}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "ナイジェリアの新しいステーブルコイン規制を評価", "title": "Regulating Stablecoins in Nigeria: A Critical Assessment of the CBN Regulations and Lessons from the EU, the United States, and Singapore", "url": "https://doi.org/10.2139/ssrn.7716440", "authors": "Favour Uche", "venue": "SSRN", "date": "2026-11-21", "apa": "Uche, F. (2026). Regulating Stablecoins in Nigeria: A Critical Assessment of the CBN Regulations and Lessons from the EU, the United States, and Singapore. https://doi.org/10.2139/ssrn.7716440", "why": "世界有数のステーブルコイン市場であるナイジェリアで2026年11月5日に施行された中央銀行の規制が、通貨の安定・消費者保護・金融の健全性・国際送金・技術革新への危険をどこまで管理できるかを機能の面から検討し、EU・米国・シンガポールの制度に照らした改革案を示す。"}, {"id": "pn08", "rank": 8, "field": "組織行動・心理的安全性", "headline": "性的少数者の経営者は組織変革で感情知性をどう使うか", "title": "Emotional Intelligence and Organizational Change among Sexual and Gender Minority Business Leaders", "url": "https://doi.org/10.2139/ssrn.7715479", "authors": "Kenya Hutton", "venue": "SSRN", "date": "2026-11-21", "apa": "Hutton, K. (2026). Emotional Intelligence and Organizational Change among Sexual and Gender Minority Business Leaders. https://doi.org/10.2139/ssrn.7715479", "why": "米国のLGBTQ+のビジネスリーダー14人への半構造化面接を再帰的テーマ分析で分析し、アイデンティティに関わる職場の要求に向き合いながら組織変革を率いるときに、感情知性（emotional intelligence）をどう理解し使ったかを4つのテーマにまとめる。"}, {"id": "pn09", "rank": 9, "field": "経営学", "headline": "学習方略の介入を学生の希望と行動変容科学で設計", "title": "The IMPACT Framework for Designing Learning Strategy Interventions", "url": "https://doi.org/10.31219/osf.io/w78yx", "authors": "Jonathan Ryan Brazil ほか", "venue": "OSF: Open Science Framework", "date": "2026-11-22", "apa": "Brazil, J. R., Ainscough, L., & Lodge, J. M. (2025). The IMPACT Framework for Designing Learning Strategy Interventions. https://doi.org/10.31219/osf.io/w78yx", "why": "効果の高い学習方略が知られていても学生が使わない問題に対し、学部生26人の介入への要望を信頼性を確かめたテーマ分析で整理し、教育心理学と行動変容科学の知見と統合して、学習方略の介入を設計する枠組み（IMPACT）を提案する。"}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "口コミの後悔と失望の判別はRAGなしのGPT-4oが最良", "title": "When Retrieval Does Not Help: Benchmarking Large Language Models on Regret and Disappointment in Customer Reviews", "url": "https://doi.org/10.3390/analytics5040055", "authors": "Sarthak Pattnaik ほか", "venue": "Analytics", "date": "2026-11-20", "sjr": 0.46, "citescore": 4.3, "citescore_year": "2025", "apa": "Pattnaik, S., Jain, C., & Pinsky, E. (2026). When Retrieval Does Not Help: Benchmarking Large Language Models on Regret and Disappointment in Customer Reviews. Analytics, 5(4), 55. https://doi.org/10.3390/analytics5040055", "theme": "サービス・マーケティング", "theme_no": 3}, {"id": "jr02", "rank": 2, "headline": "移住世帯の高齢者を支える家族外のケアの担い手", "title": "Beyond the Care Diamond: Perceptions, Predictors, and Dimensions of Alternative Care Among Older Adults in Kerala’s Migrant Households", "url": "https://doi.org/10.1155/hsc/9973208", "author 品になる", "title": "Extended Virtues: From Human Character to Sociotechnical Moral Ecologies", "url": "https://doi.org/10.1007/s11245-026-10507-1", "authors": "Jörg Noller", "venue": "Topoi", "date": "2026-11-22", "sjr": 0.63, "citescore": 3.1, "citescore_year": "2025", "apa": "Noller, J. (2026). Extended Virtues: From Human Character to Sociotechnical Moral Ecologies. Topoi. https://doi.org/10.1007/s11245-026-10507-1", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"id": "jr15", "rank": 15, "headline": "先住民の環境観に根ざした農村開発の系統的レビュー", "title": "Indigenous environment-driven rural community development for the Global South: A systematic literature review", "url": "https://doi.org/10.1007/s13280-026-02519-3", "authors": "Cornelius Dudzai ほか", "venue": "Ambio", "date": "2026-11-22", "sjr": 1.904, "citescore": 13.6, "citescore_year": "2025", "apa": "Dudzai, C., Mugumbate, R., Keevers, L., & Muridzo, N. G. (2026). Indigenous environment-driven rural community development for the Global South: A systematic literature review. Ambio. https://doi.org/10.1007/s13280-026-02519-3", "theme": "包摂的コミュニティ・社会", "theme_no": 4}, {"id": "jr16", "rank": 16, "headline": "温度を手がかりに橋梁の変位を再構成する枠組み", "title": "TA-MLIEF: a thermal-anchored multi-level interaction enhancement framework for bridge displacement reconstruction", "url": "https://doi.org/10.1016/j.ymssp.2026.115278", "authors": "Xinhao Pan ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-22", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "apa": "Pan, X., Yu, B., Wu, J., Zhao, G., & Li, X. (2027). TA-MLIEF: a thermal-anchored multi-level interaction enhancement framework for bridge displacement reconstruction. Mechanical Systems and Signal Processing, 263, 115278. https://doi.org/10.1016/j.ymssp.2026.115278", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、同じ題名のSSRN版の抄録（Crossrefに登録）を使用", "preprint": false, "short": true, "p1": "長期の橋梁監視で、温度の情報を変位の再構成に構造的に組み込む枠組み（TA-MLIEF）を提案し、既存の時系列モデルを置き換えずに埋め込んで精度を高められるようにした（抄録）。", "p3": "多尺度の温度特徴で長期の熱の傾向と定常の基準を作り、温度の変化に応じて力学的な特徴を調整する熱と力学の相互作用を明示的にモデル化し、全体の熱の錨と局所の動的応答を層をまたいで融合する（抄録）。", "p5": "4橋16点の変位の1年間の監視データで複数の主要な時系列モデルを埋め込んで評価し、構造・位置・方向をまたいで一貫して性能が上がった。比較と除去実験から、改善は温度の単純な連結ではなく多層の相互作用によるとしている（抄録）。", "fun": "橋は暑いと伸び寒いと縮むので、変位を測ると温度の影響が大きく混ざる。しかも変位を直接測るには動かない基準点が要り、長く測るとずれてしまう。そこで温度の変化を「錨」にして、ほかの情報から変位を組み立て直すのがこの研究だ。温度を単に入力に足すより、温度と力学の関係を構造として組み込んだほうが効くという結果が面白い。", "unverified": "本文は入手できず、改善の大きさの数値、橋の形式と変位の計測方法は確認できなかった。抄録は同じ題名のSSRN版のもので、出版版との違いは確認していない。"}}, {"id": "jr17", "rank": 17, "headline": "センサー不足でも物理誘導GNNで構造応答を即時再構成", "title": "Online structural response reconstruction with insufficient sensor data using physics-guided dynamic graph neural networks", "url": "https://doi.org/10.1016/j.istruc.2026.113585", "authors": "Seyed Hossein Mahdavi ほか", "venue": "Structures", "date": "2026-11-22", "sjr": 1.108, "citescore": 7.1, "citescore_year": "2025", "apa": "Mahdavi, S. H., & Rofooei, F. R. (2026). Online structural response reconstruction with insufficient sensor data using physics-guided dynamic graph neural networks. Structures, 94, 113585. https://doi.org/10.1016/j.istruc.2026.113585", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文を入手できず、題名のみ", "preprint": false, "short": true, "p1": "センサーのデータが足りない条件で、物理の知識で導いた動的なグラフニューラルネットワークにより、構造の応答をオンラインで再構成する研究であることが題名から読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "構造物のすべての場所にセンサーを付けるのは無理なので、少ない測定点から見えない場所の揺れを推定したい。題名からは、部材のつながりをグラフとして表し、物理の法則を手がかりに、測っていない点の応答をその場で推定しようとしていると読める。少ない手がかりから全体を描くという問いそのものが面白い。", "unverified": "抄録・本文を入手できず、対象の構造物、物理の組み込み方、精度は確認できなかった。"}}, {"id": "jr18", "rank": 18, "headline": "二層トラス桁の渦励振と空力機構", "title": "Vortex-induced vibration performance and aerodynamic mechanisms of double-deck steel truss girders", "url": "https://doi.org/10.1016/j.engstruct.2026.124181", "authors": "Wenbo Li ほか", "venue": "Engineering Structures", "date": "2026-11-22", "sjr": 1.922, "citescore": 12.0, "citescore_year": "2025", "apa": "Li, W., Xue, G., Zhang, L., & Laima, S. (2027). Vortex-induced vibration performance and aerodynamic mechanisms of double-deck steel truss girders. Engineering Structures, 372, 124181. https://doi.org/10.1016/j.engstruct.2026.124181", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文を入手できず、題名のみ", "preprint": false, "short": true, "p1": "二層の鋼トラス桁で起きる渦励振（VIV、風が作る渦の周期で構造が共振する振動）の性能と、それを生む空力的な仕組みを調べた研究であることが題名から読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "風が橋の周りを流れると、交互に渦が生まれて橋を揺らすことがある。渦の生まれる周期が橋の揺れやすい周期と合うと、弱い風でも揺れが大きくなる。上下二段の鋼のトラス桁は形が複雑で、どこで渦ができるかが読みにくい。題名からは、その揺れの大きさと仕組みの両方を調べていると読める。", "unverified": "抄録・本文を入手できず、実験か数値解析か、対象の橋、得られた結果は確認できなかった。"}}, {"id": "jr19", "rank": 19, "headline": "機能プール型モデルとベイズでプロペラ損傷を診断", "title": "A unified statistical framework for multicopter propeller damage diagnosis based on functionally pooled models and Bayesian quantification: Experimental flight test assessment", "url": "https://doi.org/10.1016/j.ymssp.2026.115162", "authors": "Shinan Huang ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-21", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "apa": "Huang, S., Zhu, J., & Kopsaftopoulos, F. (2027). A unified statistical framework for multicopter propeller damage diagnosis based on functionally pooled models and Bayesian quantification: Experimental flight test assessment. Mechanical Systems and Signal Processing, 263, 115162. https://doi.org/10.1016/j.ymssp.2026.115162", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（OpenAlex経由）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "標準の慣性計測装置（IMU）のデータだけで、マルチコプターのプロペラの損傷の検知・どのモーターかの特定・損傷の大きさの推定を行う、機能プール型自己回帰（FP-AR）モデルの統計的な枠組みを示した（抄録）。", "p3": "機能プール化で運転条件をまたぐ系の動特性をまとめて表し、予測残差の統計的検定で検知、モデル選択で特定、ベイズ推論で損傷の大きさの事後推定と不確実性の幅を出す。自作の6発機を風のある屋外で8の字に飛ばし、加速度と角速度の6チャンネルで評価した（抄録）。", "p5": "飛行ごとの再調整なしで一貫した性能が得られ、従来の一括推定よりベイズ法のほうが推定が安定し、不確実性も明示できたとする（抄録）。", "fun": "ドローンのプロペラが少し欠けても、飛び方の揺れはわずかしか変わらない。しかも風や飛び方でも揺れは変わるので、損傷による変化と見分けるのが難しい。この研究は、飛行条件ごとの揺れの性質を一つのモデルにまとめ、追加のセンサーなしに、どのプロペラがどのくらい傷んだかまで推定した。条件の違いと損傷を統計で分ける考え方が面白い。", "unverified": "本文は入手できず、損傷の段階の数と、検知・特定の正解率などの数値は確認できなかった。"}}, {"id": "jr20", "rank": 20, "headline": "多体シミュレーションで重量貨物の車輪・レール保守限界", "title": "A multibody simulation framework for assessing wheel–rail maintenance limits in heavy–haul operations", "url": "https://doi.org/10.1080/00423114.2026.2765341", "authors": "Om Prakash Yadav ほか", "venue": "Vehicle System Dynamics", "date": "2026-11-22", "sjr": 1.413, "citescore": 11.3, "citescore_year": "2025", "apa": "Yadav, O. P., Berg, M., Stichel, S., & Asplund, M. (2026). A multibody simulation framework for assessing wheel–rail maintenance limits in heavy–haul operations. Vehicle System Dynamics, 1–33. https://doi.org/10.1080/00423114.2026.2765341", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文を入手できず、題名のみ", "preprint": false, "short": true, "p1": "重量貨物鉄道の運行で、車輪とレールの保守の限界値（どこまで摩耗・損傷したら手入れするか）を、多体動力学のシミュレーションで評価する枠組みを示した研究であることが題名から読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "重い貨物列車が走ると、車輪もレールも少しずつすり減る。どこまで減ったら交換や削り直しをするかの基準は、安全と費用のバランスで決まる。題名からは、その基準を、車両の動きをコンピュータで再現する多体シミュレーションで決めようとしていると読める。", "unverified": "抄録・本文を入手できず、対象の車両・路線、評価した損傷の種類、結果は確認できなかった。"}}, {"id": "jr21", "rank": 21, "headline": "GNSSが使えない環境で分散推定の観測点を最小化", "title": "Minimal observer node placement for distributed estimation of heterogeneous nonlinear multi-agent systems in GNSS-denied environments", "url": "https://doi.org/10.1007/s11071-026-13076-5", "authors": "Yutao Wu ほか", "venue": "Nonlinear Dynamics", "date": "2026-11-20", "sjr": 1.104, "citescore": 9.4, "citescore_year": "2025", "apa": "Wu, Y., Mao, Z., & Jiang, B. (2026). Minimal observer node placement for distributed estimation of heterogeneous nonlinear multi-agent systems in GNSS-denied environments. Nonlinear Dynamics, 114(2 ず、同じ題名のSSRN版の抄録（Crossrefに登録）を使用", "preprint": false, "short": true, "p1": "日常の目的地に近いほど持続可能な移動が増えるという「X分都市」の行動面の主張を、ミュンヘンの25の行政区の実際の移動データで初めて直接検証したとする（抄録）。", "p3": "Geo Open Accessibility Toolで6種類の目的地への平均移動時間と15分で届く範囲を測り、2023年の代表的交通調査の区ごとの交通手段の分担率と組み合わせ、スピアマンの順位相関と人口加重の回帰で分析した（抄録）。", "p5": "到達性は徒歩と自動車の利用と強く関連し、目的地への近さだけで両手段の分散の85%超を説明した。自転車は弱いが有意な関係で、公共交通の分担率は駅への近さと有意に関連せず、路線網のつながりや運行頻度のほうが重要と示唆された（抄録）。", "fun": "「15分で何でも届く街」にすれば車に乗らなくなる、という考えは人気があるが、本当にそうかを確かめた研究は少ない。ミュンヘンの25区で調べると、店や施設に近い区ほど歩く人が多く車が少なく、近さだけで大部分が説明できた。一方、電車やバスの利用は駅の近さでは説明できなかった。手段ごとに効く条件が違うのが面白い。", "unverified": "本文は入手できず、回帰の係数と、区の数が25と少ないことの扱いは確認できなかった。抄録は同じ題名のSSRN版のもので、出版版との違いは確認していない。"}}, {"id": "jr37", "rank": 37, "headline": "オンラインとオフラインの循環で社会のデジタルツイン", "title": "Toward a hybrid digital twin of society: Quantifying cognitive–spatial linkages through online–offline feedback networks", "url": "https://doi.org/10.1016/j.urbmob.2026.100319", "authors": "Rafiazka Millanida Hilman ほか", "venue": "Journal of Urban Mobility", "date": "2026-11-22", "sjr": 1.621, "citescore": 8.8, "citescore_year": "2025", "apa": "Hilman, R. M., & Koltai, J. (2026). Toward a hybrid digital twin of society: Quantifying cognitive–spatial linkages through online–offline feedback networks. Journal of Urban Mobility, 10, 100319. https://doi.org/10.1016/j.urbmob.2026.100319", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、同じ題名のarXiv版の抄録（OpenAlex経由）を使用", "preprint": false, "short": true, "p1": "デジタル環境での認知的な活動と物理空間での行動の相互作用を捉える計算の枠組み（フィードバック・ネットワーク）を作り、オンラインの検索とオフラインの訪問がどう共に変化するかを示した（抄録）。", "p3": "ブダペストで2018〜2022年にデータ提供の仕組みで集めた同じ個人のGoogle検索と位置履歴を使い、回転半径を地理的な移動と意味の探索の両方に当てはめ、検索と訪問の活動クラスタ間の遷移を集中エントロピーで評価した（抄録）。", "p5": "オンラインの探索はオフラインの移動より集中しており、関心は狭く反復的だった。小売と事業サービスに関わる検索と訪問の結びつきは持続し、コロナ禍は認知的な探索より空間の習慣を強く乱して、デジタルの関与と実際の移動の差を広げた（抄録）。", "fun": "スマホで店を検索してから実際に出かける、という行動は毎日のように起きている。この研究は、同じ人の検索履歴と位置履歴を本人の同意で提供してもらい、ネットの中の「心の移動」と街の中の「体の移動」を同じ物差しで比べた。ネットでの興味のほうが狭く同じところを回っていた、という結果は意外で面白い。", ": 1.285, "citescore": 6.9, "citescore_year": "2025", "apa": "Alenizi, A. N., Harvey, C., Maclean, M., & Zaeemdar, S. (2026). The Art of Alignment: A Sensemaking Perspective on Elite Philanthropy in Higher Education Fundraising. Nonprofit and Voluntary Sector Quarterly. https://doi.org/10.1177/08997640261504806", "why": "米国の主要16大学の寄付担当者への質的面接から、富裕な寄付者の期待と大学の優先事項の一致を、多義性を扱いながら時間をかけて共有理解を作る再帰的な意味づけ（センスメイキング）の過程として概念化し、回顧的な意味づけなど3つの形を示す。"}, {"id": "jn13", "rank": 13, "field": "工学", "headline": "連続体ロボットの環境との摩擦接触を相補性で解く", "title": "Modeling the frictional contact of continuum robots with environments through linear complementarity problem", "url": "https://doi.org/10.1177/02783649261504037", "authors": "Jia Shen ほか", "venue": "International Journal of Robotics Research", "date": "2026-11-21", "sjr": 2.022, "citescore": 12.2, "citescore_year": "2025", "apa": "Shen, J., Ha, J., & Chen, Y. (2026). Modeling the frictional contact of continuum robots with environments through linear complementarity problem. The International Journal of Robotics Research. https://doi.org/10.1177/02783649261504037", "why": "連続体ロボットの摩擦を、内部の摩擦だけでなく環境との接触まで含めて、クーロン摩擦の仮定の下で線形相補性問題として定式化する。静止摩擦と滑り摩擦、運動の履歴（ヒステリシス）を予測でき、精密な運動制御と経路計画に必要な摩擦のモデルを与える。"}, {"id": "jn14", "rank": 14, "field": "機械学習", "headline": "言語注釈つきの布の欠陥検出データセット", "title": "LangFabric: A Language-Annotated Multimodal Fabric Dataset for Fabric Defect Detection", "url": "https://doi.org/10.1038/s41597-026-08651-9", "authors": "Yan-Qin Ni ほか", "venue": "Scientific Data", "date": "2026-11-22", "sjr": 1.907, "citescore": 9.6, "citescore_year": "2025", "apa": "Ni, Y.-Q., Huang, P.-K., Wang, T.-G., Wang, W.-J., Liang, D., & Lin, C.-Y. (2026). LangFabric: A Language-Annotated Multimodal Fabric Dataset for Fabric Defect Detection. Scientific Data. https://doi.org/10.1038/s41597-026-08651-9", "why": "既存の布の欠陥データセットは画像だけで欠陥の構造的な記述がなく、視覚と言語を組み合わせる学習に使いにくかった。初めての言語注釈つきのマルチモーダルな布の欠陥データセット（LangFabric）を作り、欠陥検出に使えるようにする。"}, {"id": "jn15", "rank": 15, "field": "機械学習", "headline": "ロココ装飾版画の画像・注釈・分割マスクのデータ", "title": "A Multimodal Dataset of 18th-Century Prints for Segmentation and Analysis of Rocaille Ornaments", "url": "https://doi.org/10.1038/s41597-026-08703-0", "authors": "Thomas Hudcovic ほか", "venue": "Scientific Data", "date": "2026-11-22", "sjr": 1.907, "citescore": 9.6, "citescore_year": "2025", "apa": "Hudcovic, T., Röckl, I., Jachmann, J., & Zachmann, G. (2026). A Multimodal Dataset of 18th-Century Prints for Segmentation and Analysis of Rocaille Ornaments. Scientific Data, 13(1). https://doi.org/10.1038/s41597-026-08703-0", "why": "18世紀のロココ装飾版画1,611点の高解像度画像に、専門家による2言語のメタデータと解説を付け、229点にはロカイユ装飾の渦形と櫛状の伸びを区別する画素単位の分割マスクを付けたデータセット。標準的な2つの画像の骨格網で分割を学習し、注釈が学習可能な信号になることを確かめた。"}, {"id": "jn16", "rank": 16, "field": "工学", "headline": "外乱オブザーバと両立する逆モデルを閉ループで学習", "title": "Learning a disturbance-observer-compatible rational inverse model for flexible motion systems: A closed-loop-embedded optimal instrumental-variable approach", "url": "https://doi.org/10.1016/j.ymssp.2026.115222", "authors": "Taejune Kong ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-22", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "apa": "Kong, T., & Oh, S. (2027). Learning a disturbance-observer-compatible rational inverse model for flexible motion systems: A closed-loop-embedded optimal instrumental-variable approach. Mechanical Systems and Signal Processing, 263, 115222. https://doi.org/10.1016/j.ymssp.2026.115222", "why": "柔軟な運動系に対し、外乱オブザーバと両立する有理関数の逆モデルを、閉ループに組み込んだ最適な操作変数法で学習する方法を扱う（題名から。抄録は未取得）。", "explain": {"basis": "題名", "basis_note": "抄録・本文を入手できず、題名のみ", "preprint": false, "short": true, "p1": "柔軟な運動系（たわみのある機械の位置決めなど）に対し、外乱オブザーバと組み合わせて使える有理関数の逆モデルを、閉ループに組み込んだ最適な操作変数法で学習する方法を扱う研究であることが題名から読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "機械を正確に動かすには、指令に対して機械がどう動くかの「逆」を知り、先回りして指令を作るとよい。ただし制御をかけたままのデータでモデルを学ぶと、雑音と制御が絡み合って偏りが出やすい。題名からは、その偏りを操作変数という統計の道具で避けながら、外乱を打ち消す仕組みとも両立する逆モデルを作ろう ith fractional Kolmogorov-Arnold-Informed Neural Networks for three-dimensional hyperelasticity. Computers & Structures, 334, 108549. https://doi.org/10.1016/j.compstruc.2026.108549", "why": "有限要素法と統合した深いエネルギー法に、分数次のコルモゴロフ・アーノルド型の情報つきニューラルネットを組み合わせ、3次元の超弾性問題を解く方法を扱う（題名から。抄録は未取得）。", "explain": {"basis": "題名", "basis_note": "抄録・本文を入手できず、題名のみ", "preprint": false, "short": true, "p1": "有限要素法と統合した深いエネルギー法（エネルギーの最小化を学習の目的にする方法）に、分数次のコルモゴロフ・アーノルド型の情報つきニューラルネットを組み合わせ、3次元の超弾性体の変形を解く方法を扱う研究であることが題名から読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "ゴムのように大きく変形する材料（超弾性体）の計算は難しく、有限要素法でも時間がかかる。物体は全体のエネルギーが最小になる形に落ち着くので、その性質をAIの学習の目標にする方法がある。題名からは、そこに新しい型のニューラルネット（KAN）と有限要素法を組み合わせて、3次元の問題を解こうとしていると読める。", "unverified": "抄録・本文を入手できず、例題、計算の精度と速さの比較は確認できなかった。"}}, {"id": "jn19", "rank": 19, "field": "工学", "headline": "傾斜機能圧電サンドイッチ板の熱空力弾性フラッター抑制", "title": "Equal-mass porosity tailoring and passive–active stabilization of nonlinear aerothermoelastic flutter in functionally graded piezoelectric sandwich panels", "url": "https://doi.org/10.1016/j.tws.2026.116025", "authors": "Peng Chen ほか", "venue": "Thin-Walled Structures", "date": "2026-11-22", "sjr": 1.734, "citescore": 12.0, "citescore_year": "2025", "apa": "Chen, P., Yang, J.-H., Guo, X.-Y., Qian, Y.-J., & Yang, X.-D. (2026). Equal-mass porosity tailoring and passive–active stabilization of nonlinear aerothermoelastic flutter in functionally graded piezoelectric sandwich panels. Thin-Walled Structures, 116025. https://doi.org/10.1016/j.tws.2026.116025", "why": "質量を等しく保ったまま空隙率の分布を調整し、受動と能動の両方で傾斜機能圧電サンドイッチパネルの非線形の熱空力弾性フラッターを安定化する方法を扱う（題名から。抄録は未取得）。", "explain": {"basis": "題名", "basis_note": "抄録・本文を入手できず、題名のみ", "preprint": false, "short": true, "p1": "傾斜機能の圧電サンドイッチパネルで、質量を変えずに空隙率の分布を調整する設計と、受動・能動の制御を組み合わせて、非線形の熱空力弾性フラッター（熱と気流が引き起こす自励振動）を安定化する方法を扱う研究であることが題名から読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "高速で飛ぶ機体の外板は、空気の流れと熱を受けて、自分で揺れを大きくしていくフラッターという危険な振動を起こすことがある。題名からは、重さを増やさずに材料の中の空隙の配置を工夫し、さらに ": "抄録・本文を入手できず、題名のみ", "preprint": false, "short": true, "p1": "教師の自律性（授業の進め方などを自分で決められる度合い）と授業の質の関係を調べ、自律性は高ければ高いほどよいのかを問う研究であることが題名から読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "先生に任せるほど授業はよくなるのか、それとも任せすぎると逆効果なのか。題名の「自律性は多いほどよいのか」という問いかけからは、両者の関係が単純な右肩上がりではない可能性を確かめようとしていると読める。働く人の裁量と成果の関係は、学校以外の職場にも通じる問いだ。", "unverified": "抄録・本文を入手できず、対象の国と教師、授業の質の測り方、結果は確認できなかった。"}}, {"id": "jn35", "rank": 35, "field": "機械学習", "headline": "多エージェント強化学習で自動運転の危険シナリオを生成", "title": "Generating evolving scenarios for autonomous driving safety testing based on dual-modal driver model trained by multi-agent reinforcement learning", "url": "https://doi.org/10.1016/j.eswa.2026.135207", "authors": "Xinzheng Wu ほか", "venue": "Expert Systems with Applications", "date": "2026-11-22", "sjr": 1.939, "citescore": 17.0, "citescore_year": "2025", "why": "多エージェントの強化学習で訓練した二つの様式を持つ運転者モデルにより、自動運転の安全試験のために変化していくシナリオを生成する方法を扱う（題名から。抄録は未取得）。", "explain": {"basis": "題名", "basis_note": "抄録・本文を入手できず、題名のみ", "preprint": false, "short": true, "p1": "多エージェントの強化学習で訓練した、二つの様式を持つ運転者のモデルにより、自動運転の安全性を試すための、時間とともに変化するシナリオを生成する方法を扱う研究であることが題名から読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "自動運転車を安全にするには、めったに起きない危ない場面で試す必要があるが、そうした場面を現実で集めるのは難しい。題名からは、周りの車の運転者をAIに学ばせ、状況に応じて変わる手ごわい場面をコンピュータの中で作り出そうとしていると読める。", "unverified": "抄録・本文を入手できず、二つの様式の中身、評価の方法、結果は確認できなかった。"}}, {"id": "jn36", "rank": 36, "field": "機械学習", "headline": "RAGの埋め込み反転への防御を適応的攻撃で評価", "title": "The privacy-utility gap in retrieval-augmented generation: An evaluation of embedding inversion defenses against adaptive attackers", "url": "https://doi.org/10.1016/j.hcc.2026.100457", "authors": "Srikar Reddy Gunupati ほか", "venue": "High-Confidence Computing", "date": "2026-11-21", "sjr": 1.521, "citescore": 13.2, "citescore_year": "2025", "why": "検索拡張生成（RAG）で埋め込みから元の文章を復元する攻撃への防御を、適応的な攻撃者に対して評価し、プライバシーと有用性の差を扱う（題名から。抄録は未取得）。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（OpenAlex経由）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "検索拡張生成（RAG）のベクトルの保管庫を読んだ攻撃者が元の文章を復元する攻撃に対し、提案されている3つの防御が検索の性能を保ちながら文章を守れるかを、防御に合わせて学び直す適応的な攻撃者に対して評価した（抄録）。", "p3": "符号化器の敵対的訓練、埋め込みへのガウス雑音、鍵による回転の3つを、MS MARCOでMiniLM-L6（縮小規模でMPNet）を使い、埋め込みを見ない推測だけでROUGE-Lの適合率が0.385になる分を除いた内容語の指標で評価した（抄録）。", "p5": "攻撃者を推測の水準近くに抑える敵対的訓練はRecall@5を0.87から0.002に落とし、検索を保つ変種は守れなかった。ガウス雑音には両立する設定がなく、鍵の回転は索引の2時点の写しで破られた。攻撃側は32トークンの文章の内容語の84%を復元した（抄録）。", "fun": "AIの検索の仕組みでは、文章を数字の列（埋め込み）に変えて保存する。数字なら読めないから安全、と思いがちだが、この研究では32トークンの文章の内容語の84%を数字から復元できた。守ろうとして数字を乱すと、今度は検索が役に立たなくなる。守りと使いやすさの板挟みを、公平な物差しで示した点が面白い。", "unverified": "本文は入手できず、各防御の設定ごとの詳しい数値と、より大きなモデルでの結果は確認できなかった。"}}, {"id": "jn37", "rank": 37, "field": "計算社会科学・ネットワーク科学", "headline": "TikTokの1回の利用での機能と幸福感の変化", "title": "From app open to app close: Function and well-being across TikTok sessions", "url": "https://doi.org/10.1016/j.chb.2026.109271", "authors": "Sabrina F. Norwood ほか", "venue": "Computers in Human Behavior", "date": "2026-11-21", "sjr": 3.072, "citescore": 22.6, "citescore_year": "2025", "why": "アプリを開いてから閉じるまでのTikTokの利用の単位（セッション）ごとに、利用の機能とウェルビーイングを調べる（題名から。抄録は未取得）。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（OpenAlex経由）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "TikTokの1回1回の利用（セッション）の始まりと終わりで、利用の目的（娯楽・情報・社会的な注目・逃避）とその時点のウェルビーイングを経験サンプリングで捉え、セッションの中での変化を直接観察した（抄録）。", "p3": "161人が7日間連続で自然に使ったセッションについて、開始時と終了時の対になった3,943セッションを集め、事前登録した多層分析と探索的な遷移の分析を行った（抄録）。", "p5": "42%のセッションは始めと違う目的で終わり、娯楽で終わる遷移が多かった。個々の逃避目的のセッションは個人内では利用後のウェルビーイングと安定して関連しなかったが、逃避目的の多い人ほど利用後のウェルビーイングが低く、ただしこの個人間の関連は感度分析でほぼゼロになった（抄録）。", "fun": "SNSをなんとなく開いて、気づいたら別のことに夢中になっていた、という経験は多くの人にある。この研究では、TikTokを開いたときと閉じたときに目的と気分を答えてもらい、42%のセッションで目的が途中で変わっていたことを示した。使い始めより終わりの目的のほうが気分の変化と結びついていた点も面白い。", "unverified": "本文は入手できず、ウェルビーイングの測定項目と、多層モデルの係数の大きさは確認できなかった。"}}, {"id": "jn38", "rank": 38, "field": "計算社会科学・ネットワーク科学", "headline": "中国のSNSで広がるLLMを介した占い", "title": "Divination by Prompt: LLM-Mediated Xuanxue on Chinese Social Media", "url": "https://doi.org/10.1016/j.chb.2026.109272", "authors": "Chu’ang Li ほか", "venue": "Computers in Human Behavior", "date": "2026-11-21", "sjr": 3.072, "citescore": 22.6, "citescore_year": "2025", "why": "中国のソーシャルメディアで、大規模言語モデルを介した玄学（占い）の実践がどう行われているかを扱う（題名から。抄録は未取得）。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（OpenAlex経由）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "中国のソーシャルメディアで、会話型AI（大規模言語モデル）を占いに使う「玄学」の実践を、投稿の分析と面接で体系的に調べた初期の研究の一つ（抄録）。", "p3": "混合研究法で、小紅書（Xiaohongshu）の2万3千件超の投稿とコメントを分析し、利用者と職業的な占い師への32の半構造化面接を行った（抄録）。", "p5": "利用者は恋愛・仕事・試験・ゲームのガチャなど実際的な悩みをLLMに相談し、流行による好奇心と不確実な状況での不安という2つの経路があった。プロンプトを共同で磨く実践が特徴で、効果の感じ方は肯定的に偏り、職業的な占い師はLLMには占いに必要な「霊力」がないと語った（抄録）。", "fun": "AIに占いをしてもらうと「当たっている」と感じる人が多い。この研究は、その感覚が、誰にでも当てはまる言葉を自分のことだと思うバーナム効果や、当たった部分だけを覚える確証バイアスと整合的だと指摘する。一方で、何度も試したり別のAIと比べたりして確かめる利用者もいた。古い占いの働きがAIでも生き続けているのが面白い。", "unverified": "本文は入手できず、投稿の分析の方法と、立場を示したコメントの割合は確認できなかった。"}}, {"id": "jn39", "rank": 39, "field": "ヒューマンコンピュータインタラクション", "headline": "外国語の読み書きに効くAIチャットボットの設計", "title": "What Makes AI-Chatbots Pedagogically Valuable for L2 Literacy? Initial Psychometric Evaluation of a Design-Features Framework", "url": "https://doi.org/10.1016/j.caeo.2026.100436", "authors": "Watcharapol Wiboolyasarin ほか", "venue": "Computers and Education Open", "date": "2026-11-21", "sjr": 2.903, "citescore": 16.9, "citescore_year": "2025", "why": "第二言語のリテラシーの学習でAIチャットボットを教育的に価値あるものにする設計の特徴を枠組みにまとめ、その心理測定的な評価を初めて行う（題名から。抄録は未取得）。", "explain": {"basis": "抄録", "basis_note": "出版社の抄録（OpenAlex経由）を使用。本文は入手できず", "preprint": false, "short": true, "p1": "ゲーム化した教育用AIチャットボットが第二言語の読み書きの学習で教育的な価値を持つための設計の特徴の枠組みを作り、その心理測定的な性質を初めて評価した（抄録）。", "p3": "文献の統合、半構造化面接とQ方法論、専門家の審査、予備調査で項目を作り、教員志望の学生・現職教員・大学講師533人の調査データで、探索的な主成分分析、確認的因子分析、代替モデルの比較を行った（抄録）。", "p5": "47項目中45項目が3成分（分散の70.98%）で残ったが、3因子モデルは因子間相関が.883〜.926と高く弁別が不十分だった。修正した39項目の二因子（バイファクター）モデルが相対的によく当てはまり（CFI=.937、RMSEA=.063）、強い一般因子が示された（抄録）。", "fun": "外国語の学習に役立つAIチャットボットとは、どんな作りのものなのか。教員ら533人の評価から作った物差しは、三つの側面に分けたつもりでも、実際には「全体として良い設計か」という一つの大きな印象にまとまって         var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
