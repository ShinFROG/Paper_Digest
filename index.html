<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-10-13", "intro": "プレプリントの新着1,101件、学術誌の新着1,810件（うち上位10%誌1,484件）、重要論文の候補306件、新着の公開データ84件から選びました。第1部（プレプリント・関連）50報、第2部（プレプリント・注目）50報、第3部（論文誌・関連）50報、第4部（論文誌・注目）50報、第5部（オープンデータ）30件です。情報源の取得失敗はありません。e-Statは直近7日の新規公表が該当なしのため、第5部はDataCiteの登録分のみです。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "重車両で橋のモード特性はどう動くか", "title": "Variation of Modal Parameters in Bridges Under Heavy Load Configurations: A Case Study", "url": "https://doi.org/10.1002/cepa.3373", "authors": "Buka-Vaivade ほか", "venue": "Zenodo", "date": "2026-10-12", "apa": "Buka‐Vaivade, K., Nicoletti, V., Quarchioni, S., & Gara, F. (2025). Variation of Modal Parameters in Bridges Under Heavy Load Configurations: A Case Study. Ce/Papers, 8(5), 49–55. https://doi.org/10.1002/cepa.3373", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトは403で取得できず、Zenodo登録の抄録を読んだ。抄録の末尾に、これがce/papers 2025, 8(5), 49–55の査読済み著者最終稿であると記されている", "preprint": false, "p1": "供用荷重の範囲内で重車両を載せたとき、橋の固有振動数・減衰比・モード形がどこまで動くかを、実橋で測った幅として示せるようになった（抄録）。", "p2": "構造ヘルスモニタリング（SHM, structural health monitoring）では固有振動数の変化を損傷の兆候と読むが、健全なままでも重い荷重が載れば振動特性は動く。その「安全だが高荷重」の状態での変動幅が分かっていないと、損傷判定の閾値を決められない（抄録）。", "p3": "入力は常時微動の加速度記録、出力は常時微動解析（operational modal analysis, OMA）で推定したモード特性。満載トラックを複数の配置で置き、曲げモーメントが極大になるように載荷する。無載荷の状態と載荷状態で同じ解析をかけ、同一構造・同一計測系のまま荷重条件だけを変えて比較する設計である（抄録）。", "p4": "対象はイタリア中部の氾濫原に新設された連続・免震の鋼コンクリート合成橋（San Carlo橋）。評価は無載荷時のモード特性を基準とした、載荷配置ごとのモード特性の差で行う（抄録）。", "p5": "抄録は、載荷方式によってモード特性に変動が生じ、安全だが高荷重の状態を特徴づける動的応答の範囲が定まったと述べる。具体的な振動数の低下量や減衰の増加量は、抄録に数値が示されていないため未確認。", "p6": "著者が認める限界は抄録に明示されていない。新設の免震橋1橋の事例研究であり、支承特性や橋種の違う橋にそのまま移せるかは残る疑問である。", "fun": "橋は重いものが載ると「音程」が変わる。弦を強く張ると高い音が出るのと同じで、荷重のかかり方で橋の揺れやすい周波数がずれる。だから振動数が下がったという測定を見ても、それが傷のせいか、たまたまトラックが何台も載っていたせいか区別がつかない。この研究はトラックの置き方をわざと変えて、健全な橋でも起こる「音程のぶれ幅」を先に測っておく。異常を見つけるには、まず正常のばらつきを知る必要があるという発想が面白い。", "unverified": "固有振動数・減衰比の具体的な変化量、モード形の相関（MACなど）の値、載荷配置の数と各配置の荷重量。本文が入手できず確認できなかった。"}}, {"id": "pr02", "rank": 2, "headline": "LLM模擬回答は係数を項目ごとに歪める", "title": "Where Silicon Samples Go Wrong: Item-Level Coefficient Distortion in LLM-Simulated Chinese Public Opinion", "url": "https://doi.org/10.31235/osf.io/276rd_v2", "authors": "Mingkun Cui ほか", "venue": "SocArXiv", "date": "2026-10-12", "apa": "Cui, M., & Xiong, S. (2026). Where Silicon Samples Go Wrong: Item-Level Coefficient Distortion in LLM-Simulated Chinese Public Opinion. https://doi.org/10.31235/osf.io/276rd_v2", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "OSF（SocArXiv）のPDF本文を読んだ。方法（§3.1–3.4）、結果（§4.1–4.3）、限界（§5.4）、結論（§6）と図2・表3の説明を参照した", "preprint": true, "p1": "LLMの模擬回答で回帰を走らせたとき、どの項目のどの係数がどちら向きに歪むかを、人間データと同じ推定対象で項目単位に特定できるようになった（§3.3、§4.2）。", "p2": "従来の検証は分布の一致や係数の相関で全体の忠実度を採点してきた。しかし分布が合っても回帰係数が合う保証はなく、本文も分布適合の指標では歪みの所在が分からないと述べる（§4.1、§6）。", "p3": "CGSS回答者の属性ベクトルをペルソナとして1波1,000人分与え、同じ人の態度項目への回答を生成させる。核は推定対象を揃えた照合で、人間と模擬の回答を同じペルソナで積み上げ y ~ source × (female + age_z + edu + urban + inc) を項目ごとに当て、sourceとの交互作用項を「模擬−人間」の係数差として読む。所得項なら、所得が1段階上がるときの公平感への効果が模擬で何単位大きいかがそのまま出る（§3.3）。", "p4": "人間側はCGSS 2017（n=12,582、24項目）を主、CGSS 2021（n=8,148、17項目）を独立の追試とする。2026年の4モデル（Claude、DeepSeek、GPT-5.4、Qwen）を一次エンドポイントで呼ぶ。所得・都市農村・性別の3係数について10項目×4モデル×2波の各80検定、計240検定にHolm法を一括して当て、人間の平均・標準偏差で両者を標準化する人間基準尺度を主とする（§3.1–3.3）。", "p5": "図2は行が10項目、列が4モデル×2波、パネルが3係数で、各セルが係数差、支持されたセルが太字と点で示される。人間基準尺度では所得10/80、都市農村12/80、性別6/80が支持され、28差のうち19が公平感の所得勾配・婚前交渉の道徳の都市農村勾配・男性の能力信念の性差という3項目に集中した（§4.2、表3）。源内標準化に変えると240検定のうち33の判定が入れ替わる（§4.3）。", "p6": "著者は、復号の制御が不完全で温度の感度検証が2モデル1波に限られること、各模擬回答者が全項目を1回の生成で答えるためペルソナの一貫性が勾配を平滑化または増幅しうること、1国1調査の2波・4モデル・順序尺度の態度項目に限られることを限界に挙げる（§5.4）。", "fun": "LLMに「この属性の人ならどう答えるか」と尋ねて作った偽の世論調査は、平均値を見るとかなり本物に似ている。ところが「収入が高い人ほど社会は公平だと思うか」という関係の強さを調べると、偽データは実際より勾配を大きく出す。平均は合うのに関係が合わない状態がありうるわけだ。さらに面白いのは、どの尺度で標準化するかを決めるだけで有意差の判定が240件中33件も入れ替わる点。何を測るか先に宣言しないと、同じデータから違う結論が出てしまう。", "unverified": "表1・表4の個別の数値（モデルごとのTVDや下位集団の相関値）は本文の表が機械可読に崩れており読み取れなかったため引用していない。"}}, {"id": "pr03", "rank": 3, "headline": "文脈内学習でモデル推定を飛ばす同定", "title": "In-Context Learning for System Identification: Probabilistic Formulation, Long-Sequence Handling, and Benchmark Validation", "url": "https://arxiv.org/abs/2610.13411", "authors": "Matteo Rufolo ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Rufolo, M., Piga, D., Pura, F., & Forgione, M. (2026). In-Context Learning for System Identification: Probabilistic Formulation, Long-Sequence Handling, and Benchmark Validation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13411", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。手法（§3.3–3.4）、長系列の扱い（§4.1–4.2）、実験（§6.2、表1–3）、限界（§7）を参照した", "preprint": true, "p1": "系ごとにモデルを推定せずに、入出力の文脈データと問い合わせ入力を与えるだけで、未知の動的系の出力を不確実性つきで予測できるようになった（§3.3）。", "p2": "古典的なシステム同定は、学習データからモデルを推定し次にそれで予測する二段階をとる。系ごとに構造を決める手間がかかり、データが乏しい系では不安定になる。既存の文脈内学習型は点推定しか出さず、注意機構が系列長の2乗で重くなるため長い文脈も扱えなかった（§3.3、§4）。", "p3": "入力は文脈入出力列と初期条件と問い合わせ入力、出力は各時刻の予測分布の母数。未知の条件付き分布をq_φで近似するという定式化からKLダイバージェンスの期待値を最小化すると、残るのは負の対数尤度 J(φ) になる（式5–7）。q_φは対角共分散のガウス分布で、平均μ_kが従来の点推定、標準偏差σ_kが不確かさを表す（式8–9）。長い文脈には学習時のパッチング（計算量をL²分の1に）と推論時のアンサンブルで対処する（§4.1–4.2）。", "p4": "合成データのみで事前学習し、ベンチマークの学習データは使わない。評価は、学習分布と同じWiener–Hammerstein系320実現、実データの非線形同定ベンチマーク3件でのゼロショット予測、別クラス（CSTR）への微調整の3段階で、指標はRMSEと、古典手法の学習時間に対するメタ推論時間である（§6.2）。", "p5": "表1（分布内）はパッチングがRMSE 0.048・0.019秒、アンサンブルが0.038・0.039秒で精度はほぼ同等。表2（実ベンチマーク）はWiener–Hammersteinで0.0014（dynoNet 0.0017、LSTM 0.0015、ARX 0.0434）、縦続タンクで0.429（同0.421、0.452、0.697）で、所要時間は提案法0.17〜5.91秒に対し古典手法の学習は1分〜24時間。表3（CSTR）はゼロショット1.249、入力クラスだけ合わせて0.242、系クラスまで合わせて0.115で雑音下限0.1に近づく。", "p6": "著者は、メタ学習に大規模な合成コーパス上のオフライン計算が必要なこと、推論時のモデルが重く組込みに向かないこと、良質なデータが豊富な単一系では古典手法の漸近精度が上回りうること、得られるのは予測で解釈可能な母数表現ではないため周波数応答解析や制御設計に使いにくいことを挙げる（§7）。", "fun": "ふつうは「まず方程式を当てはめ、それから予測する」。この研究はその順番を飛ばし、過去の入出力の記録をそのまま読ませて次の応答を直接当てさせる。人が初見の楽器を少し鳴らして勘所をつかむのに近い。学習は全部人工データで済ませたのに、実物の装置でも古典手法と同程度の誤差で、計算時間は数分〜数十時間から1秒以下に縮む。入力信号の種類だけ現実に合わせると誤差が5分の1になった点も示唆的である。", "unverified": "なし"}}, {"id": "pr04", "rank": 4, "headline": "DEM供試体の初期剛性を現実に近づける", "title": "A Relaxation-Recompression Method for Preparing Dense DEM Soil Specimens with Realistic Initial Stiffness", "url": "https://doi.org/10.2139/ssrn.7601317", "authors": "Yuxuan SHI ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "SHI, Y., OTSUBO, M., & KUWANO, R. (2026). A Relaxation-Recompression Method for Preparing Dense DEM Soil Specimens with Realistic Initial Stiffness. https://doi.org/10.2139/ssrn.7601317", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は入手できず、候補収集時にSSRNから取得した抄録を読んだ", "preprint": true, "p1": "摩擦係数を瞬時に戻す従来のDEM供試体作成が初期剛性を過大にする理由を接触スケールで突き止め、密な充填を保ったまま小ひずみ剛性を実測に近づける作成法を示した（抄録）。", "p2": "密な粒状土のDEM（離散要素法, discrete element method）解析では、人為的に低い粒子間摩擦係数で等方圧縮し、その後に目標の摩擦係数へ瞬時に戻す手順が広く使われる。高密度は得られるが、供試体の初期剛性が非現実的に大きくなる（抄録）。", "p3": "抄録によれば、従来法と提案法について配位数（coordination number, CN）の変化と接触のせん断力動員比の分布を調べる。摩擦の瞬時回復は多くの接触を低い動員比に集め、せん断抵抗の余力を過剰に残す。これに対し、応力制御の緩和はほとんど変化を生まないが、ひずみ制御の緩和は接触の動員比を再配分し、CNを下げ、その後のせん断で発達するファブリックを変える（抄録）。", "p4": "評価は、初期のヤング率とせん断弾性係数、間隙比、ピーク強度と残留強度、および等方拘束圧を変えたときのCNとの関係で行う。良しとする基準は、密な充填を保ちながら小ひずみ剛性が室内試験の測定値に近づくことである（抄録）。", "p5": "抄録の報告では、ひずみ制御の緩和は初期のヤング率とせん断弾性係数を30%以上下げる一方、間隙比の変化はわずかで、ピーク強度と残留強度は実質的に変わらない。初期のヤング率は、調べた等方拘束圧の範囲でCNとほぼ線形に相関した（抄録）。", "p6": "著者が認める限界は抄録に示されていない。緩和・再圧縮の手順が粒子形状や粒度分布の違う材料でも同じ効果を持つかは、残る疑問である。", "fun": "砂を計算機の中で「密に詰める」には、粒どうしをいったん滑りやすくしてから押し固め、後で摩擦を戻すという裏技が使われてきた。ところがこの裏技を使うと、できた砂は実物よりずっと硬くなってしまう。原因は、ほとんどの接触点が摩擦の余力をたっぷり残した状態で固定されるから。だから少し揺らして余力を配り直すと、密度も強度もほぼ変えずに硬さだけが3割以上下がり、実物に近づく。配り直しという一手で現実に寄るのが面白い。", "unverified": "緩和・再圧縮の具体的な手順（緩和量や再圧縮の経路）、CNの変化量の数値、対象とした粒子形状と粒度。本文が入手できず確認できなかった。"}}, {"id": "pr05", "rank": 5, "headline": "取引明細の文章から信用スコアを強化", "title": "Enhancing credit risk scorecards with transactional-based behavioural features", "url": "https://arxiv.org/abs/2610.13199", "authors": "Dian Prinsloo ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Prinsloo, D., Verster, T., & Smit, N. (2026). Enhancing credit risk scorecards with transactional-based behavioural features (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13199", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXivのPDF本文を読んだ。方法（§3）、結果（§4：表3・4・6・7と図3）、結論と限界（§5）を参照した", "preprint": true, "p1": "取引明細の自由文の摘要を、解釈できる支出カテゴリの行動変数に変換して、既存の信用スコアカードの判別力を上げられるようになった（§3.3、§4.3）。", "p2": "信用リスクのモデルは信用履歴・返済行動・所得・残債を使うのが通例で、取引データは直近性・頻度・金額という集計指標でしか使われてこなかった。摘要の生テキストの行動情報は非構造のためほとんど使われておらず、本文はここを空白と位置づける（§1–2）。", "p3": "入力は南アフリカの大手金融機関の中小企業顧客の取引明細（月あたり約4,000万件規模）、出力は34カテゴリの分類結果とそこから作る行動変数。頻度・金額の分析と業務知識でカテゴリ語彙を作り、階層的な正規表現で摘要を振り分ける。小売店名を含む摘要はPOS系、税務の語を含むものはTAXに落ち、カテゴリ別の支出の趨勢が変数になる（§3.2–3.3）。", "p4": "2023年の12か月を開発期間とし、2021・2022・2024・2025年の年別サンプルで分類精度を測る。34カテゴリに等割当の層化抽出で各年1,000件を取り、手作業分類を正解として一対他方式のF1をマクロ平均で評価し、安定性はPSIで見る。スコアカードは期間・不良顧客の定義・変数本数を揃え、行動変数なしのモデルA（従来10本）とありのモデルB（従来4本＋取引行動6本）をGini係数とHHIで比べる（§3.4、§4.3）。", "p5": "分類は多くのカテゴリでF1が高く、2021年と2025年で落ちる。2023年だけで作った語彙に、それ以前に消えた小売や以後に現れた小売が入らないためと説明される（図3、表3）。直近サンプルのマクロ平均F1は約90%、PSIは10%未満（§5）。最低のF1はEFT_TYPE_1で、件数が多く自由記述の摘要を最も多く含む。スコアカードではモデルBがGiniで14%の相対改善を示し、取引行動変数がモデルBの寄与の約60%を占めた（表6・7）。表6の60%→68%は守秘のための例示値で、本文も差分だけが真の改善を反映すると明記する。", "p6": "著者は、語彙作成に人手の確認が入るため完全自動化はできないこと、精度と安定性が開発期間から約2年で基準を外れ始め定期更新が必要なこと、南アフリカの取引慣行と言語に固有で他国には追加研究が要ること、取引履歴のある既存顧客で作られたため新規申込のスコアカードには適用が限られることを挙げる（§5）。", "fun": "銀行の明細に並ぶ「○○スーパー」「振込 ○○」といった短い文字列は、人間が見れば何に使ったか察しがつくのに、機械には意味のない記号列だった。この研究はそこに正規表現と業務知識で34個の引き出しを作り、文字を支出行動に翻訳した。すると与信の判別力が14%改善し、最終モデルの6割がこの変数で占められた。意外なのは精度が2年ほどで落ち始めること。店が入れ替わる街の変化が、そのまま辞書の賞味期限になっている。", "unverified": "モデルAとモデルBの実際のGini値（守秘のため例示値のみ）、HHIの具体値、表4のマクロ平均の年別の値。"}}, {"id": "pr06", "rank": 6, "headline": "社会的補強が口コミの強さを決める", "title": "How Social Reinforcement Shapes Word-of-Mouth: A Conviction-Based Model for Marketing Diffusion and Network Targeting", "url": "https://arxiv.org/abs/2610.13890", "authors": "Abhishek K. Umrawal ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Umrawal, A. K., Stutsman, C., Woods, C., & Robson, E. W. (2026). How Social Reinforcement Shapes Word-of-Mouth: A Conviction-Based Model for Marketing Diffusion and Network Targeting (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13890", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。モデル定義（§3.2）、定理（§4.1–4.3）、近似保証（§5.2.3、§7.2）、計算実験（§6.1–6.5）、実データ検証（§8）、今後の課題（§10.2）を参照した", "preprint": true, "p1": "採用時に受けた社会的圧力の大きさがその人の後の発信力を決めるという機構を拡散モデルに組み込み、口コミ施策で誰を最初に狙うべきかが従来と変わることを示した（§3.2、§6.3）。", "p2": "従来の閾値型の拡散モデルは誰が採用するかは扱うが、影響の強さを固定した静的な重みとして扱う。消費者は採用するかどうかだけでなくどれだけ強く推奨するかでも異なるのに、その機構が抜けていた（§1–2）。", "p3": "有向グラフ上で各辺に重みw_uv、各節点に一様乱数の閾値θ_vを置き、活性な入隣接からの重みの和が閾値以上になると活性化する（線形閾値モデルと同じ規則）。追加は1点だけで、節点vが活性化した時刻に受けた累積影響I_vに比例して、未活性の隣接への出力重みを w' = min(1, w + α·I_v) と1回だけ更新する（§3.2）。αは社会的圧力をどれだけ内面化するかを表し、α=0なら元のモデルに戻る。更新を1回に限ることで再帰的な増幅ループを避けている。", "p4": "構造的性質を定理で検討する。影響最大化はNP困難（定理4.1）、単調性は一般に不成立（定理4.4）、劣モジュラ性も不成立（定理4.7）。そのうえで上下から挟むサンドイッチ近似でデータ依存の保証を計算する（§5.2.3）。実験は実3種とランダムグラフ、予測精度はHiggs Twitterのリツイート連鎖100件でNMSEにより測る（§6.1、§8）。", "p5": "種選択（表2、k=20）は序盤は両モデルでほぼ一致し、8反復目付近から分岐して、提案モデルは密に結ばれた局所構造の節点を選ぶようになる。影響の総量は同じ予算で全ネットワークで提案モデルの方が大きい（図6–9）。k=5、α=0.5の例（表3）では提案モデル由来の種集合の期待拡散258.912が最大で、上界モデルとの比231.67/260.00≈0.891から最適値の約56.3%という保証が得られる（古典的な63.2%に近い）。実データではαを上げると予測誤差が改善し、ある点を超えると止まる（図12）。", "p6": "著者は今後の課題として、影響関数が近似的に単調または劣モジュラになる条件の特徴づけ、大規模な拡散データからのαの推定、社会的圧力への感度の個人差や時間変化の取り込みを挙げる（§10.2）。倫理面では影響工作や誤情報増幅への悪用という二重用途性に注意を促している。", "fun": "同じ商品を買った二人でも、まわりの何人もに勧められてから買った人のほうが、その後に熱心に人に勧める。この当たり前のことをモデルに入れると、数学的に困ったことが起きる。「種を増やせば必ず広がる」も「増やすほど効き目が薄れる」も成り立たなくなり、定番の貪欲法の保証が崩れるのだ。それでも上下から挟む工夫で最適の56%程度は保証でき、狙う相手は有名人より「密に結びついた集団の一員」へ寄る。常識の一歩が理論を壊し、別の道で立て直される。", "unverified": "なし"}}, {"id": "pr07", "rank": 7, "headline": "被覆石が波による海底液状化を抑える", "title": "Numerical Modelling of Wave-Induced Seabed Liquefaction Around Marine Structures: Assessment of Mitigation Measures", "url": "https://doi.org/10.2139/ssrn.7601302", "authors": "Ranjith Khumar Shanmugasundaram ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Shanmugasundaram, R. K., Vanjakula, V. K., Windt, C., Rusche, H., Kirca, V. S. Ö., Sumer, B. M., & Goseberg, N. (2026). Numerical Modelling of Wave-Induced Seabed Liquefaction Around Marine Structures: Assessment of Mitigation Measures. https://doi.org/10.2139/ssrn.7601302", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は入手できず、候補収集時にSSRNから取得した抄録を読んだ", "preprint": true, "p1": "洗掘対策として置かれる被覆石が、同時に地盤工学的な上載荷重として残留液状化を抑える効果を、波・地盤・構造・被覆石を一つのソルバで解いて定量化できるようになった（抄録）。", "p2": "波の繰返し荷重を受ける飽和粒状土は強度と剛性を失う。被覆石や捨石は洗掘対策として日常的に設置されるが、それが同時に有効応力を上げて液状化を抑える役割は定量化されておらず、設計で使われていない（抄録）。", "p3": "入力は波条件と地盤・構造・被覆層の配置、出力は間隙水圧の蓄積と液状化域の発達である。OpenFOAM上でBiotのポロ弾性理論とドリフトフラックスモデルを組み合わせ、非液状化域はポロ弾性、液状化域はドリフトフラックスで表し、液状化判定で両者を切り替える。波・地盤相互作用、波・地盤・構造相互作用、被覆石を加えた場合の3段階で計算する（抄録）。", "p4": "モデルは既存の実験データと照合して残留液状化の発生を再現できることを確認したうえで使う。評価は、正規化した間隙水圧比（1.0で破壊）と、初期の平均有効応力の増加率で行う（抄録）。", "p5": "抄録の報告では、被覆石は初期の平均有効応力を上げることで間隙水圧の蓄積を抑え、泥線近傍で1層のゆるい被覆で42%、3層で最大129%の増加をもたらす。構造物の自重は局所的な拘束を与えるが、600 Nの動的な係留力は水圧の蓄積を加速させ、60秒で残留液状化に至る。被覆石を加えると最大の正規化間隙水圧比が破壊状態の1.0から約0.12まで下がる（抄録）。", "p6": "著者が認める限界は抄録に明示されていない。単一の波条件・地盤条件での計算であり、粒度や透水性の異なる地盤や不規則波への一般化は残る疑問である。", "fun": "海底に構造物を置くとき、まわりに石を敷くのは「波で土が掘られるのを防ぐため」と説明されてきた。ところが同じ石が、上から重しをかけて土の中の水圧が上がりにくくするという、まったく別の仕事もしていた。石を3層置くと土にかかる有効な圧力が最大で2倍以上になり、壊れる寸前（指標1.0）だった状態が0.12まで下がる。目的が1つだと思っていた対策に、設計で使われてこなかった第二の効能が隠れていたという話である。", "unverified": "波の諸元（波高・周期・水深）、地盤の透水係数や相対密度、液状化判定の具体的な基準。本文が入手できず確認できなかった。"}}, {"id": "pr08", "rank": 8, "headline": "AI要約が投資家の質問を増やす", "title": "Enhancing Corporate Communication with AI-summarized Disclosures", "url": "https://doi.org/10.2139/ssrn.7593921", "authors": "T.J. Wong ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Wong, T. J., Yi, Y., Yu, G., Zhang, S., & Zhang, T. (2026). Enhancing Corporate Communication with AI-summarized Disclosures. https://doi.org/10.2139/ssrn.7593921", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は入手できず、候補収集時にSSRNから取得した抄録を読んだ", "preprint": true, "p1": "年次報告書のAI要約を投資家に配ると説明会での対話の量と質がどう変わるかを、フィールド実験で測れるようになった（抄録）。", "p2": "開示書類は長く、読み通せる投資家は限られる。AIによる要約が対話を助けるのか、それとも要約に書かれた話題へ注意を縛るのかは分かっていなかった（抄録）。", "p3": "中国のバーチャル説明会（オンラインの投資家向け会議）で、投資家に年次報告書のAI生成要約を提供する処理をランダムに割り当てる。出力は質問の本数、長さ、数値的な内容の量、認知的な処理の水準、および株価の反応である（抄録）。", "p4": "比較対象は要約を提供しなかった対照群の企業。評価は、質問の量（本数）と質（長さ・数値含有・認知処理の水準）、投資家の種類による違い、そして説明会に対する資本市場の反応で行う（抄録）。", "p5": "抄録の報告では、処理群の企業は対照群に比べて投資家の質問数が39.2%増え、質問はより長く、数値的な内容を多く含み、より高次の認知処理を反映した。効果は投資家の種類によって異なり、それまで沈黙していた投資家が会話に加わるが質問は要約の話題に集中し、もともと発言の多い投資家はより広く、要約の外の話題にも広がった。資本市場の反応は処理群の説明会でより強く、特に投資家の関与が大きい説明会で顕著だった（抄録）。", "p6": "著者が認める限界は抄録に明示されていない。要約の生成に用いたモデルや要約の品質、効果が中国のバーチャル説明会という制度に固有かどうかは、残る疑問である。", "fun": "長い決算書類をAIが短くまとめて渡すと、読む負担が減るので投資家は黙ってしまうのではないか、と思うかもしれない。結果は逆で、質問は4割近く増え、しかも数字を含む踏み込んだ質問になった。面白いのはその増え方に偏りがあること。これまで発言しなかった人は要約に書かれた話題に集まり、もともとよく話す人は要約の外へ広がった。要約は入口を広げる一方で、新しい人の視野をその枠に閉じてしまう面もある。", "unverified": "実験の企業数と期間、要約に使ったモデル、株価反応の具体的な大きさ。本文が入手できず確認できなかった。"}}, {"id": "pr09", "rank": 9, "headline": "個人資源と構造要因は孤独に足し算で効く", "title": "Personal Resources and Structural–Relational Circumstances Show Additive Associations With Loneliness in Spanish Adults Aged 55 and Older", "url": "https://doi.org/10.21203/rs.3.rs-10883362/v1", "authors": "Raúl Gil-Ballesteros ほか", "venue": "Research Square (In Review)", "date": "2026-10-12", "apa": "Gil-Ballesteros, R., Corregidor-Sánchez, A. I., Llopis, R. L., & Cervigón, R. (2026). Personal Resources and Structural–Relational Circumstances Show Additive Associations With Loneliness in Spanish Adults Aged 55 and Older. https://doi.org/10.21203/rs.3.rs-10883362/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research SquareのPDF本文を読んだ。方法（§2.1–2.3）、結果（§3、表2）、限界（§4）を参照した", "preprint": true, "p1": "個人資源を強めれば構造的な不利が緩和されるという前提を直接検証し、少なくとも検出できる大きさの緩衝効果は無いと示せるようになった（§3.2、§4）。", "p2": "晩年の孤独への介入は、レジリエンス・人生の意味・共感といった個人資源を強めれば構造的・関係的な不利を打ち消せるという前提に立つことが多い。しかしこの調整（moderation）の主張が直接検証されることはまれだった（§1）。", "p3": "入力は構造的・関係的な状況（配偶関係、学歴、同居形態、パンデミック時の恐怖、メッセージアプリの利用頻度）と個人資源（共感、レジリエンス、人生の意味の所在と探求）。出力はDe Jong Gierveldの11項目孤独感尺度スペイン語版の総得点（ω=.813）。3ブロックの階層的回帰を当てたうえで、3つの構造的リスク（死別、家族と同居していない、低学歴）×3つの資源の9通りの交互作用を検定する。緩衝があるなら交互作用項が有意になるという設計である（§2.2）。", "p4": "対象はスペイン・カスティーリャ＝ラ・マンチャ州の地域センターで募った55歳以上の在宅高齢者302名（女性70.2%、都市96%、死別28.5%）。評価の基準を結果より先に置くため、事後の感度分析で検出力80%で検出できる最小の交互作用の大きさを求めている（§2.1、§2.3）。", "p5": "二変量では構造要因が孤独と関連する（死別は既婚に対しr=.26、Holm調整後p=.006）。個人資源の方が関連は強い（共感ρ=−.323、レジリエンスρ=−.312、意味の所在ρ=−.268）。最終モデルで有意なのは3つの資源だけで、共感β=−0.156（p=.007）、レジリエンスβ=−0.164（p=.005）、意味β=−0.206（p<.001）。死別と低学歴は年齢や同居形態と重なって説明された。9つの交互作用はいずれも有意に近づかず、係数は−0.144〜+0.149、p値は.19〜.94（表2）。検出力80%で検出できたのは|β|≈.14以上で、観測された最大の係数とほぼ同じ大きさである。", "p6": "著者は、横断デザインのため因果は読めないこと、小さい効果は盲点に入ること、共感・レジリエンス・社会的孤独下位尺度の信頼性が低め（ω≈.65〜.68）で測定誤差は主効果より交互作用項を強く減衰させること、1地域の便宜標本で女性と都市に偏ること、事前登録がないことを挙げる（§4）。", "fun": "「心の強さを鍛えれば、ひとり暮らしや配偶者との死別のつらさも和らぐはず」という直感は広く共有されている。この研究はその直感を9通りの組み合わせで正面から検定し、どれも支持されなかった。しかも著者は「有意差なし」で終わらせず、どのくらいの大きさなら検出できたかを先に計算しておき、観測された最大の係数とほぼ同じ水準だと示す。つまり「小さい効果は見逃したかもしれないが、大きな緩衝はない」と言い切れる。", "unverified": "表3（他の構造要因で調整した交互作用係数）と表4（下位尺度別の係数）の個別の数値は、本文の表が機械可読に崩れており読み取れなかったため引用していない。"}}, {"id": "pr10", "rank": 10, "headline": "作用素推定で非圧縮流の縮約模型を作る", "title": "Non intrusive parametric Reduced Order Models based on physics for incompressible flow", "url": "https://arxiv.org/abs/2610.13425", "authors": "Cyrille Allery ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Allery, C., & Beghein, C. (2026). Non intrusive parametric Reduced Order Models based on physics for incompressible flow (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13425", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXivのHTML本文を読んだ。手法（§3.1.1–3.1.3）、多孔質媒体への適用（§4）、結果（§5.1–5.2、表1・2）、結論（§6）を参照した", "preprint": true, "p1": "支配方程式を陽に射影せずに、POD係数から縮約作用素を直接同定して、時間とパラメータの両方に外挿できる非圧縮流の縮約モデルを作れるようになった（§3、§6）。", "p2": "標準的なGalerkin射影による縮約モデルは、方程式を基底に射影する侵入的な実装が必要で、Forchheimer項のような非線形項は射影で扱いにくい。既存の非侵入的な作用素推定は、パラメータ付きの過渡非圧縮流には拡張されていなかった（§1、§6）。", "p3": "速度と圧力に別々の大域的な縮約基底を取り、縮約係数a(t,Re)の時間微分と二次項・線形項・定数項からなる残差 R_i = da_i/dt + ΣΣQ_ijk a_j a_k + ΣL_ij a_j + F_i を定義する（§3.1.1）。POD係数が既知なら残差は未知係数について線形なので、同定は正則化付き最小二乗に帰着する（§3.1.2）。要点は未知ベクトルX_iが方程式ごとに独立に決まり行列Aが共通なので連立を解かずに済むこと。未学習のReでは、同定した係数で縮約系を時間積分するだけで予測が得られる（§3.1.3）。", "p4": "検証は2つ。(a) 周期的な領域にある蓋駆動キャビティ流で時間外挿と未学習パラメータでの予測を調べる。(b) 正方形障害物を含む多孔質媒体中の過渡流で、非線形のForchheimer項を含むためGalerkin射影が直接使えない場合を扱う。評価は基準解に対する速度・圧力の平均および最大の相対誤差で行う（§5）。", "p5": "キャビティ流では、固定Reで学習データの50%のみを使っても速度の相対誤差は約0.01〜0.03%に収まる（§5.1.2）。パラメータを変えた多ケース比較（表1）では、内挿で平均相対誤差0.126〜0.222%・最大0.71%未満、外挿で平均0.84%未満・最大2.27%と2.72%で、全ケースで平均1%未満・最大3%未満。圧力（表2）は内挿で平均0.229〜0.556%・最大1.2%未満だが、外挿では平均6.53%・最大12.39%（ケースA）、平均21.1%・最大43.8%（ケースE）まで悪化する。圧力の縮約モデルが速度の縮約係数に依存するためである（§5.1.3）。", "p6": "著者は結論で、パラメータ外挿では誤差が大きくなること、特に圧力場でそれが顕著であること、圧力の再構成が速度予測の精度に強く依存することを指摘する（§6）。", "fun": "流れのシミュレーションは重いので、少数の「代表的な流れの形」の足し算で近似する縮約モデルが使われる。ふつうは方程式をその形に投影して係数を作るが、この研究は投影を飛ばし、計算結果の係数の時間変化だけを見て方程式の係数を当てる。すると、投影では扱いにくい非線形項があっても同じ手順で済む。ただし面白いのは精度の出方で、速度は外挿でも誤差3%以内なのに、圧力は最大44%まで崩れる。圧力は速度から作るので、誤差が後ろに溜まる構造が見える。", "unverified": "表3〜6（多孔質媒体ケースの誤差値）の個別の数値は本文の表が機械可読に崩れており、代表値のみを引用した。"}}, {"id": "pr11", "rank": 11, "headline": "自由回答のLLM分類を総調査誤差で評価", "title": "Evaluating Large Language Models (LLMs) for Coding Open-Ended Survey Responses: A Total Survey Error Framework", "url": "https://doi.org/10.31235/osf.io/2rjm6_v1", "authors": "Laone Maphane ほか", "venue": "SocArXiv", "date": "2026-10-12", "apa": "Maphane, L., & Durrant, G. (2026). Evaluating Large Language Models (LLMs) for Coding Open-Ended Survey Responses: A Total Survey Error Framework. https://doi.org/10.31235/osf.io/2rjm6_v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "OSF（SocArXiv）のPDF本文を読んだ。枠組み（§3）、適用（§5.1–5.7）、推定への含意（§6）、結論と限界（§7）を参照した", "preprint": true, "p1": "自由回答のLLMによる自動コーディングを、人間との一致率だけでなく調査データ生産の一部として6つの面から評価できるようになった（§3、§5.7）。", "p2": "自動コーディングの評価は分類精度と人間との一致に偏ってきた。しかし一致率が近い複数のシステムが、同じ分布の符号化データを生み同じ推定値を返すとは限らない。本文はこの点を既存評価の限界と位置づける（§2.3、§5.7）。", "p3": "入力は自由回答と固定コードブック、出力は割り当てられたコードの集合である。総調査誤差（Total Survey Error, TSE）の枠組みに置き、(1)処理上の一致、(2)測定の妥当性、(3)有病率の歪み、(4)コーディング密度、(5)回答形式への感度、(6)運用上の信頼性の6次元で評価する。人間のコーディングは高品質の運用基準として使うが完全に正しいとは扱わず、差異を「誤り」ではなく「不一致」と呼ぶ（§3、§5.1）。", "p4": "対象はNatCen Opinion Panelの2025年3月波の自由回答（英国で今より注目されるべき社会問題は何か）で、96カテゴリの固定コードブックで符号化され、1件に複数コードが付きうる。5,231件のうち共通の1,552件を評価用に取り分ける。比較するのは埋め込み型の局所システム2種（MiniLM、BGE）と、GPT 5.4 nanoのゼロショットとフューショットの2条件である（§5.1）。", "p5": "処理上の一致はマイクロF1が0.718〜0.736、完全一致が0.517〜0.601である（§5.2）。完全一致0.601は約6割の回答が人間と同一のコード集合を得たことを意味する。しかしカテゴリ分布を見ると、平均の絶対有病率差は0.0030〜0.0044（約0.3〜0.4ポイント）にすぎないのに、カテゴリ単位の最大差は0.0245〜0.0393（約2.5〜3.9ポイント）に達する（§5.3、図4）。4システムは一致率が近いのに、割り当てたコード数とカテゴリ単位の差の大きさで異なった（§5.7）。", "p6": "著者は、1つの調査の1波の1問と1つの固定コードブックに基づくため他の主題・集団・言語に当てはまるとは限らないこと、不一致を一件ずつ独立に裁定していないため一部は妥当な別解釈かもしれないこと、重み付き推定値・下位集団比較・回帰結果への影響は今後の課題であることを挙げる（§7）。", "fun": "自由回答の分類をAIに任せるとき、ふつうは「人間とどれだけ一致したか」で合否を決める。ところがこの研究は、一致率がほぼ同じ4つのシステムが、実は違う形のデータを作っていたと示す。全カテゴリの平均では0.3ポイントほどの差でも、特定のカテゴリでは4ポイント近くずれる。96個の引き出しに均せば小さな差が、ひとつの引き出しの中では大きい。平均で評価すると見落とすものがあるという、統計の基本が自動化の現場で効いてくる。", "unverified": "表2（条件ごとの回答単位の対応とコーディング強度）の個別の数値と、回答形式別（短・中・長）の完全一致・Jaccard類似度の値は、本文の表が機械可読に崩れており読み取れなかった。"}}, {"id": "pr12", "rank": 12, "headline": "アルゴリズム管理下の幸福が成果を媒介", "title": "Wellbeing under Algorithmic Management: Explaining How Human Needs Shape Performance in Platform Work", "url": "https://doi.org/10.21203/rs.3.rs-10872787/v1", "authors": "Qi Zhong ほか", "venue": "Research Square (In Review)", "date": "2026-10-12", "apa": "Zhong, Q., Lim, T. S., & Dousin, O. (2026). Wellbeing under Algorithmic Management: Explaining How Human Needs Shape Performance in Platform Work. https://doi.org/10.21203/rs.3.rs-10872787/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "Research SquareのHTML本文を読んだ。理論（§2.1–2.2）、測定モデル（§4.2）、構造モデルと仮説検定（§4.3）、限界（§5.5）を参照した", "preprint": true, "p1": "アルゴリズムに管理される就業で、存在・関係・成長の欲求が主観的幸福を介して成果につながる経路を、係数つきで切り分けられるようになった（§4.3）。", "p2": "プラットフォーム就業が労働者の幸福に影響することは繰り返し示されてきたが、幸福が結果として測られるばかりで、働く条件と成果をつなぐ心理的な機構として扱われてこなかった（§1、§2.1）。", "p3": "ERG理論（存在・関係・成長の3欲求）を枠組みに置き、3欲求を外生変数、主観的幸福（生活満足・肯定的感情・否定的感情）を媒介、職務成果（課題遂行・サービス遂行・適応的遂行）を結果とする構造モデルを立てる。二段階のPLS-SEM（部分最小二乗構造方程式モデリング）で、直接効果と幸福を介した間接効果を同時に推定する（§4.2–4.3）。", "p4": "対象は中国広州のプラットフォーム労働者277名の横断調査。評価の基準は、潜在変数の信頼性と内的VIF（多重共線性）の確認を先に行い、そのうえで調整済みR²で説明力を、ブートストラップ信頼区間つきの標準化係数で各仮説を判定するという順序で置かれている（§4.3）。", "p5": "モデルは主観的幸福の分散の44.1%、職務成果の分散の49.9%を説明した。直接効果（表5）は、存在欲求→成果がβ=0.305（p<0.001）、成長欲求→成果がβ=0.291（p<0.001）で支持されたが、関係欲求→成果はβ=0.093（p=0.105、95%区間が0をまたぐ）で支持されなかった。一方、幸福に対しては3欲求すべてが正で、存在β=0.334（p<0.001）、関係β=0.174（p=0.004）、成長β=0.287（p<0.001）。幸福→成果はβ=0.187（p=0.002）である。つまり関係欲求は成果に直接は効かず、幸福を経由してのみ効く（§4.3.1）。", "p6": "著者は、横断デザインのため因果推論が弱く、プラットフォームのアルゴリズムは頻繁に更新されるため経路は固定ではなく動的に理解すべきこと、広州という単一の労働市場に基づくため制度環境の違う地域へ一般化できないこと、アルゴリズム管理を労働者の知覚で捉えており透明性や自動化の程度といったシステム側の特性を区別していないこと、成果が自己報告でプラットフォーム側の評価指標と乖離しうることを挙げる（§5.5）。", "fun": "配車や配達のアプリで働く人の成果は、アルゴリズムの指示に従う速さで決まると思われがちだ。この研究が示したのは、仲間とのつながりへの欲求が満たされているかどうかが、成果に直接は効かないのに、幸福感を経由してはっきり効くという二段構えの関係である。つまり「人間関係は仕事の役に立たない」ように見えても、心の状態を通して後から効いている。媒介を測らないと見えない効果があるという、設計上の教訓になっている。", "unverified": "間接効果（媒介）の個別の係数と信頼区間、測定モデルの収束妥当性・弁別妥当性の指標値は、本文の表が機械可読に崩れており読み取れなかった。"}}, {"id": "pr13", "rank": 13, "headline": "橋梁補助金は改善の傾きを変えなかった", "title": "Did the Bridge Formula Program Change the Trajectory of State Bridge Condition?&nbsp;An Annual Event-study Panel, 2017 to 2025", "url": "https://doi.org/10.2139/ssrn.7598418", "authors": "Gongkang Sinha", "venue": "SSRN", "date": "2026-10-12", "apa": "Sinha, G. (2026). Did the Bridge Formula Program Change the Trajectory of State Bridge Condition?&nbsp;An Annual Event-study Panel, 2017 to 2025. https://doi.org/10.2139/ssrn.7598418", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は入手できず、候補収集時にSSRNから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "p1": "米国の橋梁補助金の配分の濃さが、州ごとの橋梁状態の改善の傾きを変えたかどうかを、事前の傾向と区別して検定できるようになった（抄録）。", "p2": "先行研究は2021年以降の橋梁状態の改善が予測より速いことをインフラ投資・雇用法（IIJA）に帰しているが、資金データと照らした検証をしていない。前後比較だけでは、もともと改善していた州の傾きを法律の効果と誤認しうる（抄録）。", "p3": "入力はFHWA（連邦道路庁）の州別橋梁状態の件数と、2024会計年度の橋梁定式補助（BFP）の配分額。出力は「不良（Poor）」の割合の年次変化である。橋1本あたりの配分額が多い州と少ない州で、法律の前後に状態の軌跡が変わったかを、二方向固定効果とイベントスタディ、さらに傾きの折れを直接推定する定式化で比べる（抄録）。", "p4": "データは2017年から2025年までの9時点、51管轄、459州・年のパネルで、各列はFHWAの公表合計と完全に一致することを確認している。評価は、ワイルドクラスター・ブートストラップのp値と、クラスター頑健標準誤差による傾きの折れの区間推定で行う（抄録）。", "p5": "全国では不良の割合が2017年の7.73%から2021年半ばに7.01%（年0.21ポイント）、2025年半ばに6.65%（年0.09ポイント）へ下がり、51管轄のうち35で2021年以降の改善が遅くなった。二方向固定効果の前後比較では配分額に負の係数（1,000ドルあたり−0.0118ポイント、標準誤差0.0081、ブートストラップp=0.06）が出るが、イベントスタディの係数は高配分州が法律の前からすでに相対的に改善していたことを示す。傾きの折れの定式化では変化が見られない（1,000ドルあたり年−0.0004ポイント、クラスター頑健標準誤差0.0017、ブートストラップp=0.82）。折れの95%区間は約−0.004〜+0.003ポイント／年／1,000ドルで、配分額の1標準偏差の差に対して年0.1ポイントを超える折れは排除できる（抄録）。", "p6": "著者自身が、この設計は州間の配分の濃さの差だけを識別するため、法律の集計的な効果を支持も否定もしないと明記している。また、これより小さい効果は設計上検出できないとしている。良好（Good）の割合、不良件数の対数、下限適用州の指示変数、不良橋1本あたりの配分額でも結果は同様に決定的でない（抄録）。", "fun": "「法律ができてから橋の状態が良くなった」という話は、前後を比べれば簡単に言えてしまう。この論文はそこで立ち止まり、お金を多くもらった州と少ない州を比べ、さらに法律の前からの傾きを見る。すると高配分の州は法律の前からすでに改善が速く、法律の前後で傾きは変わっていなかった。しかも著者は「効果がない」とは言わず、「この設計では年0.1ポイントを超える変化なら否定できるが、それ以下は見えない」と検出限界まで示す。言えることの境界を明示する誠実さが印象に残る。", "unverified": "イベントスタディの各年の係数、良好割合など副次的な結果の具体値、BFP配分額の分布。本文が入手できず確認できなかった。"}}, {"id": "pr14", "rank": 14, "headline": "事業承継M&Aが中小企業の取引網を変える", "title": "The Impact of Business Succession Mergers & Acquisitions on SME Survival, Scale, and Transaction Networks: Evidence from Japanese Firm Microdata", "url": "https://econpapers.repec.org/RePEc:hit:tdbcdp:e-2026-03", "authors": "HARA, Yasushi", "venue": "RePEc NEP", "date": "2026-10-12", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "一橋大学機関リポジトリのPDF本文を読んだ。データ（§3.1–3.2）、推定戦略（§4）、結果（§5.1–5.2、表3a）、結論（§6）を参照した", "preprint": true, "p1": "日本の中小企業で、事業承継としてのM&Aが存続・規模・取引ネットワークに何をもたらすかを、無条件の生存比較と条件付きハザードを区別して示せるようになった（§5.1、§6）。", "p2": "M&Aを経験した企業は平均的に規模が大きいが、それは選択の結果でもあり得る。無条件の生存曲線と条件付きハザードは別の問いに答えるのに混同されやすい。また取引先の数の増減だけでは、関係の喪失なのか戦略的な整理なのか区別できない（§2、§5.1）。", "p3": "入力は帝国データバンクのCOSMOSに由来する企業レベルのパネル（売上高、従業員数、取引先数、退出指標）で、建設・製造・小売・農業の4産業、1990〜2021年を覆う。出力は法人の消失（DEL）と倒産（TOSAN）のハザード、イベントスタディによる水準推定、取引先の入替わりの質である。時変のCox比例ハザードモデルでM&A・代表者交代・事業活動変更を同時に入れる（§4）。", "p4": "評価は3層。記述的なKaplan–Meier曲線で無条件の生存を見て、条件付きCoxでハザード比を推定し、さらに新規の取引先と打ち切られた取引先の資本規模・売上を比べる。農業のM&A回帰標本は278観測で、建設5,885、製造9,798、小売10,723と大きく異なる（§3.1、§5）。", "p5": "記述的なKaplan–Meier曲線には一律のM&A生存優位は現れず、倒産の対数順位検定はどの産業でも5%水準で等質性を棄却しない。一方、条件付きCoxでは4産業すべてでM&Aが低いハザードに結びつく。建設はDELのハザード比0.425、TOSANが0.210（57.5%、79.0%低い条件付きハザード）で、TOSANのハザード比は製造0.185、小売0.315、農業0.145。ただし農業はイベント0のセルがあり準完全分離の疑いがある。事業活動の変更は倒産ハザードを上げ、建設2.450、製造2.810、小売2.120、農業1.950（表3a）。建設では新規の顧客の資本規模と売上が打ち切られた取引先より有意に大きい（§6）。", "p6": "著者は、イベントスタディがコホート固有の水準推定であって単一の成長率を識別しないこと、事前の差や追跡期間の不均一さと農業の小標本により解釈が限られること、代表者交代が内部承継か外部承継かを識別しないこと、取引先数が記録された関係の数であって取引額や相手の質を表さないことを挙げる（§6）。", "fun": "「後継者がいないならM&Aで会社を残せばよい」と言われる。この論文がまず示すのは、生存曲線を素朴に比べてもM&Aに一律の延命効果は見えないという事実だ。ところが企業ごとの条件をそろえると、倒産の危険は産業によって8割以上も下がる。さらに興味深いのは取引先の変化で、建設業では取引先の数が減っても、新しく加わった相手は辞めた相手より資本も売上も大きい。数が減ることは必ずしも衰退ではなく、相手を選び直しているという読み替えができる。", "unverified": "表1（M&A経験別の平均）と表3b以降のイベントスタディ係数の個別の数値は、本文の表が機械可読に崩れており読み取れなかった。"}}, {"id": "pr15", "rank": 15, "headline": "同じ開示でも国名でESG採点が動く", "title": "Same Disclosure, Different Score: Country and Identity Sensitivity in AI ESG Ratings, with an Exploratory Nigeria Effect", "url": "https://doi.org/10.2139/ssrn.7592459", "authors": "Samuel Omolaiye", "venue": "SSRN", "date": "2026-10-12", "apa": "Omolaiye, S. (2026). Same Disclosure, Different Score: Country and Identity Sensitivity in AI ESG Ratings, with an Exploratory Nigeria Effect. https://doi.org/10.2139/ssrn.7592459", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は入手できず、候補収集時にSSRNから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "p1": "LLMがサステナビリティ開示を採点するとき、文面が同一でも企業の見かけの国籍によって点が動くかを、反実仮想監査で測れるようになった（抄録）。", "p2": "金融機関はESG開示の読み取りと採点にLLMを使い始めている。しかし同じ内容でも企業の属性情報によって判断が変わるのかは検証されていなかった（抄録）。", "p3": "実際のサステナビリティ報告書22件から57の抜粋を取り、社名・本社都市・上場取引所・法人格の接尾辞・国籍への言及という国を示す手がかりの束だけを差し替えた13版（匿名の対照、アフリカ6か国、西欧6か国）を作る。入力は同一内容で属性だけが異なる文章、出力は0〜100点のスコアである。4モデル（Qwen3-8B、Llama 3.1 8B、Mistral 7Bの4ビット公開モデルとGPT-5.4 nano）が全版を採点し、計13,338点を得る（抄録）。", "p4": "評価は、まずアフリカ版と西欧版のスコア差を主要な仮説として置き、次に匿名の対照との差、個別の国どうしの差を見る。有意性は95%信頼区間と、12か国にわたるファミリーワイズの並べ替え検定で判定する（抄録）。", "p5": "主要な結果は否定的で、全モデルをプールするとアフリカ版は西欧版より0〜100点の尺度で0.23点低いだけ（95%区間−0.60〜+0.14）であり、予備調査が示した広いアフリカ・ペナルティは再現しなかった。それでもスコアは属性に反応する。公開モデルは西欧2か国間（英国対フランス）で最大2.5点の差を出し、Llama 3.1 8Bは社名入りの版を匿名版より7.3点高く採点した。探索的な分析では、ナイジェリア版が4モデルのうち3つで12か国中最低となった（プール差−1.07点、95%区間−1.64〜−0.53、並べ替えp<0.001）。著者はこれが事前登録された比較でないため、独立した追試を要する仮説として扱うとしている。これらの効果はモデルが書いた採点理由には現れなかった（抄録）。", "p6": "著者は、ナイジェリアの結果が事前に特定した比較ではなく、同じ文章を採点させた設計であることを理由に、確定した知見ではなく仮説として提示している（抄録）。テストセットとコードを公開し、新しいモデルを同じ方法で監査できるようにすると述べる。", "fun": "同じ文章を読ませて、会社の名前と所在地だけを入れ替える。中身は一字も変えていないのに、AIの採点は動く。この研究で意外なのは、心配されていた「アフリカだから低く採点される」という大きな偏りは見つからなかった一方で、社名を入れただけで7点も高くなるモデルがあったこと。さらに効果はAIが書いた「採点の理由」には一切現れない。理由の文章が納得できるからといって、採点が内容だけを見ているとは限らないわけだ。", "unverified": "抜粋の選定基準、プロンプトの詳細、モデルごとの個別のスコア分布。本文が入手できず確認できなかった。"}}, {"id": "pr16", "rank": 16, "headline": "流木を見つけて橋の監視を切り替える", "title": "Event-driven bridge SHM concept with AI-based flood debris detection", "url": "https://doi.org/10.1201/9781003778677-202", "authors": "Buka-Vaivade ほか", "venue": "Zenodo", "date": "2026-10-12", "apa": "Buka Vaivade, K., Nicoletti, V., & Gara, F. (2026). Event-driven bridge SHM concept with AI-based flood debris detection. Moving toward Smart, Resilient and Sustainable Bridges, 1678–1685. https://doi.org/10.1201/9781003778677-202", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "洪水時に流木を画像から検出し、その結果で橋の計測を常時記録に切り替える事象駆動の監視構成を示した（抄録）。", "p3": "橋脚に3次元の傾斜・振動センサを置き、床版を基準として水位、監視カメラ画像、基本的な気象データを組み合わせる。画像処理は合成データで学習し、流木の被覆率・時間的な持続・橋脚への近さを決定論的に融合して設定可能なリスク帯に落とす（抄録）。", "p5": "平常時は定期的な基準計測を行い、急な水位上昇・流木の閉塞・構造の異常な挙動といった引き金が生じたら連続記録と警報に切り替える。画像処理モジュールのパイロット試験では、誤警報が少なく流木事象を確実に検知できたと報告されている（抄録）。", "fun": "洪水のとき橋を危険にするのは水だけでなく、流れてきた木や瓦礫である。それが橋脚に引っかかると水の流れが変わり、足元の土が掘られる。この研究の面白さは、カメラで流木を見つけたら計測の仕方を切り替えるという設計。ずっと高頻度で記録すると電池もデータも足りないので、危ない瞬間だけ本気を出す。しかも学習には本物の洪水の写真ではなく合成画像を使っている。", "unverified": "パイロット試験の規模と誤警報率の数値、センサの仕様。本文が入手できず確認できなかった。"}}, {"id": "pr17", "rank": 17, "headline": "複合劣化に対応するデジタルツイン構想", "title": "A Sensor-Integrated, Explainable Machine-Learning Digital-Twin Framework for Field-Validated Service-Life Prediction of Cementitious Materials under Coupled Chloride–Sulfate Carbonation Degradation", "url": "https://doi.org/10.21203/rs.3.rs-11026995/v1", "authors": "Devesh Ojha ほか", "venue": "Research Square (In Review)", "date": "2026-10-12", "apa": "Ojha, D., & Singh, P. (2026). A Sensor-Integrated, Explainable Machine-Learning Digital-Twin Framework for Field-Validated Service-Life Prediction of Cementitious Materials under Coupled Chloride–Sulfate Carbonation Degradation. https://doi.org/10.21203/rs.3.rs-11026995/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ。概念・手法の提案で新しい実験結果の報告はないと抄録に明記されている", "preprint": true, "short": true, "p1": "塩化物・硫酸塩・炭酸化の複合劣化を1つの枠組みで扱い、センサと機械学習を結合した説明可能なデジタルツインの5層構成を提案した（抄録）。", "p3": "埋設した電気化学・光学センサによる計測、塩化物-硫酸塩-炭酸化の連成した反応移動の中核、物理情報つきの説明可能な機械学習の層、デジタルツインのベイズ更新、解釈可能な意思決定支援の出力という5層を重ねる。各層の支配方程式、計算の流れと同期のアルゴリズム、不確実性の伝播の扱いを与える（抄録）。", "p5": "既存の加速暴露と現地モニタリングのデータに基づく検証戦略を示し、文献から得たパラメータ範囲で枠組みを例示する。抄録は、この論文が概念と手法の提示を目的としており、新しい実験結果を報告するものではないと明記している（抄録）。", "fun": "コンクリートの劣化は、塩分が入る、硫酸塩に攻められる、空気中の二酸化炭素で中性化する、凍って融ける、と複数の原因が同時に進む。ところが既存の寿命予測はそれらを別々に扱ってきた。この論文が指摘するのは、機械学習の研究が実験室のデータばかりで現地検証が乏しく、しかも中身が説明できないという弱点。解くべき問題の整理そのものが貢献になっている。", "unverified": "5層構成の検証結果（抄録によれば実験結果の報告はない）、各層の具体的な方程式。本文が入手できず確認できなかった。"}}, {"id": "pr18", "rank": 18, "headline": "船体欠陥の進展を物理埋め込み学習で予測", "title": "AI-Driven Hull Defect Evolution Prediction: A Hybrid Physics-Informed Deep Learning Framework for Maritime Structural Health Monitoring", "url": "https://doi.org/10.5281/zenodo.23315324", "authors": "Mrs.B.Moohambigai ほか", "venue": "Zenodo", "date": "2026-10-12", "apa": "Mrs.B.Moohambigai, S.Krishna Kumar, I.Sayed Arman, T.Thangaraj, S.Azizbasha. (2026). AI-Driven Hull Defect Evolution Prediction: A Hybrid Physics-Informed Deep Learning Framework for Maritime Structural Health Monitoring. Zenodo. https://doi.org/10.5281/ZENODO.23315324", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "船体の腐食減肉と疲労き裂の将来の進展を、物理情報つきニューラルネットと時空間グラフネットの組み合わせで予測できるようにした（抄録）。", "p3": "物理情報つきニューラルネットワーク（PINN）と時空間グラフニューラルネットワーク（ST-GNN）を組み合わせ、腐食挙動と線形弾性破壊力学を学習時の物理制約として課す。超音波板厚計測と自律型水中ビークルの観測という異なる非破壊検査の測定を、共通の構造表現に取り込む（抄録）。", "p5": "ポストパナマックス型バルクキャリア1隻の142区画・15年分の検査データで評価し、5年先の予測で腐食減肉のMAEが0.089 mm、疲労き裂進展のRMSEが0.94 mmと報告されている。再帰型のベースラインに対し71.4%の改善で、物理制約により修理なしの板厚増加やき裂成長率が負になるといった非現実的な結果が防がれた（抄録）。", "fun": "船の船体は、何年も波に叩かれ海水に浸かるうちに錆びて薄くなり、ひびが入る。点検はドックに入れたときだけなので、その間の状態は分からない。この研究の工夫は、学習に「板は修理しなければ厚くならない」「き裂は縮まない」という物理の常識を制約として入れたこと。データだけに任せると、模型はそういうあり得ない予測を平気で出してしまう。", "unverified": "ベースライン手法の詳細、71.4%の改善が何の指標についてか。本文が入手できず確認できなかった。"}}, {"id": "pr19", "rank": 19, "headline": "計測に基づき建物固有の床応答を作る", "title": "Monitoring-informed generation of building-specific floor motions for seismic assessment of freestanding contents in instrumented buildings", "url": "https://doi.org/10.2139/ssrn.7601731", "authors": "Yuteng Cao ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Cao, Y., Zhou, X., Xie, X., & Qu, Z. (2026). Monitoring-informed generation of building-specific floor motions for seismic assessment of freestanding contents in instrumented buildings. https://doi.org/10.2139/ssrn.7601731", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "建物の計測記録から建物固有の床応答を作り、固定されていない家具の地震時の挙動を振動台で評価できるようにした（抄録）。", "p3": "小振幅の地震の疎な構造ヘルスモニタリング記録を使って、動特性の異なる2棟の鉄筋コンクリート建物（5階のラーメン構造と26階のラーメン・耐震壁構造）の等価な縮約モデルを校正する。校正は決定論的なGood Lattice Point探索で、計算と実測の床加速度の差を最小化する（抄録）。", "p5": "校正したモデルは同定記録の屋上の応答スペクトルを、5階で誤差5.9%、26階で10.7%で再現した（Fourier振幅の誤差は11.3%と37.3%）。未校正の経験式は26階建の1次モードの床応答スペクトルを過小評価し、5階建を過大評価する。振動台で3種類・9台の固定されていないキャビネットに与えた結果、AC156は短周期の5階建の屋上動に近い転倒需要を与え、スペクトル上限なしのAC156は長周期の26階建によく合った（抄録）。", "fun": "地震で棚が倒れるかどうかは、地面の揺れではなく、その建物の床の揺れで決まる。建物は揺れをふるいにかけ、特定の周期だけ増幅するからだ。この研究は実際に地震計を置いた建物の記録からその「ふるい」を再現し、振動台で棚を揺らした。面白いのは、既存の試験基準が5階建には合うのに26階建には合わないこと。基準をそのまま使うと、建物によっては見当違いの試験になる。", "unverified": "縮約モデルの定式化、SNEPとの比較の詳細、キャビネットの寸法。本文が入手できず確認できなかった。"}}, {"id": "pr20", "rank": 20, "headline": "切替センサ網での情報重みづけ分散KF", "title": "Information-Weighted Distributed Kalman Filter for Multi-Target Tracking over Switching Sensor Networks", "url": "https://arxiv.org/abs/2610.13893", "authors": "Tirthankar Chakraborty ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Chakraborty, T., & Maity, A. (2026). Information-Weighted Distributed Kalman Filter for Multi-Target Tracking over Switching Sensor Networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13893", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "通信のつながり方が時間とともに変わるセンサ網でも、全体の性質を知らずに1回の合意交換だけで分散推定ができるようにした（抄録）。", "p3": "情報重みづけ分散カルマンフィルタ（IWDKF）は、結合連結性（joint connectivity）を満たす任意の切替トポロジーに適用できる重みづけ合意の機構を使う。全体のネットワーク特性の事前知識を要さず、通信は1時刻につき1回の合意交換に限る。重みづけ合意の共分散行列が正定値に留まることと、合意更新が推定の一貫性を保つことを証明している（抄録）。", "p5": "抄録の報告では、一部のエージェントが対象を直接観測できない場合でも情報融合ができ、結合連結性のもとで合意プロトコルの漸近的な一致性が保たれる。複数対象の追跡の数値シミュレーションで、固定・切替の両方のトポロジーで推定精度が改善し、集中型カルマンフィルタに近い性能を示した。既存の3つの分散フィルタと比較されている（抄録）。", "fun": "広い範囲に散らばったセンサで動く物を追うとき、問題は「全員が対象を見られるわけではない」ことと「通信の相手が時々変わる」ことである。従来の方法は、自分か隣の誰かが対象を見ている前提で、しかも固定のつながりを仮定していた。この研究はその両方を外し、1回の情報交換だけで中央集権型に近い精度を出した。全体像を知らない個々のセンサが、互いの確かさを重みにして情報を混ぜ合わせる。", "unverified": "シミュレーションの規模、比較した3つの既存フィルタ、改善幅の数値。本文が入手できず確認できなかった。"}}, {"id": "pr21", "rank": 21, "headline": "分数階系の同定に必要な標本数を示す", "title": "A Sampling Complexity-aware Framework for Discrete-time Fractional-Order Dynamical System Identification", "url": "https://arxiv.org/abs/2501.17499", "authors": "Xiaole Zhang ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Zhang, X., Gupta, V., & Bogdan, P. (2025). A Sampling Complexity-aware Framework for Discrete-time Fractional-Order Dynamical System Identification (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2501.17499", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "記憶が残る（非マルコフ的な）系を表す分数階の離散時間モデルについて、必要な標本数の見積りつきの同定アルゴリズムを与えた（抄録）。", "p3": "アフィンな離散時間の分数階動的系（FoDS）の同定を2段で解く。まず高次の多項式方程式を解くのを避け、分数階の次数に複数の解候補が出る問題を回避する。次に同定を最小二乗推定に書き換えてパラメータを推定する（抄録）。", "p5": "モデル内の関数fとgが既知という仮定のもとで、パラメータ推定誤差の期待値と確率的な上界を導く。誤差はN = O(d/ε)の速さで減り、Nは標本数、dは状態変数の次元、εは目標とする推定精度である。シミュレーションは理論的な上界が緊密であることを示したと報告されている（抄録）。", "fun": "ふつうの微分方程式は「いまの状態」から次を決めるが、分数階の方程式は「これまでの履歴」を引きずる。土や粘弾性材料、生体の多くがこの性質を持つ。やっかいなのは、何階の微分なのかという次数自体を推定しなければならず、方程式が高次になって答えが何通りも出てしまうこと。この研究はその段を飛ばして最小二乗に落とし、必要なデータ数まで式で示した。", "unverified": "シミュレーションの設定と対象系、上界の具体的な定数。本文が入手できず確認できなかった。"}}, {"id": "pr22", "rank": 22, "headline": "複数のGNSS妨害波を適応ノッチで除去", "title": "Suppressing Multiple GNSS Interferers with Local-Gradient Adaptive Notch Filtering", "url": "https://arxiv.org/abs/2610.13443", "authors": "Burak Soner ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Soner, B., & Ott, F. (2026). Suppressing Multiple GNSS Interferers with Local-Gradient Adaptive Notch Filtering (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13443", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "同じくらいの強さのチャープ妨害波が複数あるとき、従来の縦続型の適応ノッチフィルタが失敗する問題を、勾配の作り方を変えて解いた（抄録）。", "p3": "正規化最小平均二乗（NLMS）に基づく適応ノッチフィルタ（ANF）を縦続にすると、同程度の電力のチャープ妨害波が複数あると性能が落ちる。提案する局所勾配（LG）型は、入力を現在の周波数推定値のまわりでベースバンドに移し、低域通過させて戻すことで局所的に帯域制限した勾配信号を作り、適応の前に競合する妨害波を減衰させる。追加するパラメータは1つだけである（抄録）。", "p5": "勾配の平均化が失敗する機構を解析的・視覚的に特徴づけ、最悪のチャープ2波の状況で独立に追尾できることを示す。標準のNLMS-ANF、周波数ロックループ型のANF、1標本ごとのオラクル上界と比較し、振幅比を走査して統計的な抑圧性能を評価した。病的な多チャープ領域の外では標準のNLMS-ANFに帰着し、病的な振幅比のまわりでは条件ごとの最適化のもとで帯域内抑圧を最大4 dB回復する（抄録）。", "fun": "カーナビの位置が狂うのは、GPSの弱い電波に強い妨害電波がかぶるからだ。妨害波が1本なら、その周波数だけ削る「くし歯」のフィルタで消せる。ところが同じ強さの妨害波が2本あると、フィルタが両方の平均のような中途半端な周波数に落ち着いてしまう。この研究はそこを、見ている周波数のまわりだけ切り出して勾配を作ることで解く。見る範囲を狭めると迷いが消えるという話である。", "unverified": "シミュレーションの諸元、FLL型ANFとの比較の詳細。本文が入手できず確認できなかった。"}}, {"id": "pr23", "rank": 23, "headline": "衝撃応答スペクトルから波形を逆生成", "title": "Inverse Synthesis of Shock Time Series from Shock Response Spectra Using Ensembles of Conditional Variational Autoencoders", "url": "https://arxiv.org/abs/2610.12820", "authors": "Adam Watts ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Watts, A., Young, C., Bowering, R., Jeon, A., & Newton, D. (2026). Inverse Synthesis of Shock Time Series from Shock Response Spectra Using Ensembles of Conditional Variational Autoencoders (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12820", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "衝撃応答スペクトルから、それと整合する加速度波形の候補を複数生成できるようにした（抄録）。", "p3": "波形からスペクトルへの写像は多対一なので、逆問題には複数の答えがある。条件付き変分オートエンコーダ（CVAE）の枠組みを拡張し、多重スケールのウェーブレット係数を予測する再帰的な復号器を置いて、逆離散ウェーブレット変換で波形を再構成する。単一モデルでは潜在変数の標本化による変動が小さいため、異なるマザーウェーブレットと分解レベルにまたがる独立に学習した複数モデルの集合を使い、同じ目標スペクトルに対し各メンバーが別の候補波形を出す（抄録）。", "p5": "4つの保留ベンチマーク（実運用の衝撃2件、地震1件、合成衝撃1件）で、スペクトル誤差の平均と中位数が、従来の時間領域のCVAEと減衰正弦波の和（SDS）のベースラインより低い。単一モデルの推論はバッチ処理で1波形あたり約0.1〜0.6ミリ秒で、SDSの5〜8秒に比べて大幅に速い（学習は別）（抄録）。", "fun": "機械や装置の耐衝撃試験では「このくらいの衝撃に耐えること」をスペクトルという形で指定する。ところがその指定を満たす実際の揺れ方は無数にある。この研究はそこを逆手に取り、1つの指定に対して性格の違う候補波形をいくつも作る。しかも1本あたり1ミリ秒以下。従来法が数秒かかっていたので、試験の計画段階で何通りも試せるようになる。", "unverified": "スペクトル誤差の具体的な値、集合を構成したモデル数。本文が入手できず確認できなかった。"}}, {"id": "pr24", "rank": 24, "headline": "IFRS9のオーバーレイを欧州銀で検証", "title": "Overlay Strategies in European Banks – An Empirical Analysis", "url": "https://doi.org/10.2139/ssrn.7597999", "authors": "Edgar Löw ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Löw, E., & Salzburger, J. (2026). Overlay Strategies in European Banks – An Empirical Analysis. https://doi.org/10.2139/ssrn.7597999", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "IFRS 9の予想信用損失の計算で使われるモデル外調整（オーバーレイ）の開示実務が、2020年から2024年にどう変わったかを縦断的に整理した（抄録）。", "p3": "欧州の主要な銀行グループの開示を対象に、オーバーレイの金額とその生涯（計上から解消まで）、背後にあるリスク要因の変化、調整の方法論上の設計と適用される水準、ステージ判定との相互作用を調べる。IFRS 9はECLの測定に過去の事象・現在の状況・将来の経済見通しについての合理的で裏づけのある情報を求めるため、既存のモデルに取り込めない新しいリスクをどう反映するかが問題になる（抄録）。", "p5": "抄録は、新型コロナのときにこの問題が明らかになり、その後も地政学・市場・気候関連のリスクで重要であり続けていると述べる。IASBの実施後レビューは、モデル後調整の開示に適用理由を含めて差異があることを指摘した。EBAとECBは方法論上の根拠、調整の粒度、ステージ判定での扱い、ガバナンスと統制の機構についての期待を明確化している（抄録）。", "fun": "銀行が「将来これだけ貸倒れが出るだろう」と見積もる額は、統計モデルで計算される。ところがコロナや戦争のような新しい事態は、過去のデータで作ったモデルには入っていない。そこで銀行は人の判断で金額を上乗せする。この「オーバーレイ」が実務上どれだけ大きく、どう説明されてきたかを並べたのがこの研究である。モデルの外側に置かれた判断の中身を可視化する作業になっている。", "unverified": "対象銀行の数と名前、オーバーレイ金額の推移、分析の具体的な結論。本文が入手できず確認できなかった。"}}, {"id": "pr25", "rank": 25, "headline": "破綻前の財務レッドフラッグを二社で追う", "title": "Financial Red Flags Before Corporate Reporting Failures: An Exploratory Forensic Accounting Study of Satyam and Homex", "url": "https://doi.org/10.2139/ssrn.7592059", "authors": "Jonibek Davronov", "venue": "SSRN", "date": "2026-10-12", "apa": "Davronov, J. (2026). Financial Red Flags Before Corporate Reporting Failures: An Exploratory Forensic Accounting Study of Satyam and Homex. https://doi.org/10.2139/ssrn.7592059", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "会計不正が発覚する直前の最終監査済財務諸表で、標準的な財務指標が警告を出すのか出さないのかを2事例で比べた（抄録）。", "p3": "SECの不正認定を受けたSatyam Computer Services（インド、2008年度）とDesarrolladora Homex（メキシコ、2012年度）を、それぞれ1社の同業他社（HCL Technologies、Consorcio ARA）と比較する。すべての入力は提出された財務諸表と照合している（抄録）。", "p5": "Homexは売掛金ベースと発生主義ベースの両方で異常値を示した。売掛金が売上より184ポイント速く伸び、売上債権回転日数が46日増え、営業キャッシュフローが利益が正なのに負で、発生項目が平均総資産の14.0%、Beneish M-Scoreが+0.02で通常の閾値を大きく超える。一方、架空の売上に架空の現金を対応させたSatyamは同業他社とほとんど差がない（M-Score −2.30対−2.44）（抄録）。", "fun": "不正会計を見つける指標はいくつもあるが、実際の2つの事例に当てはめると結果が真逆になった。売掛金を膨らませたHomexは指標がはっきり警告を出す。一方、架空の売上と架空の現金を同時に作ったSatyamは、帳簿のつじつまが合っているせいで指標が反応しない。嘘のつき方によって見つかる確率が変わるわけで、「指標が正常だから大丈夫」とは言えない理由がここにある。", "unverified": "Beneish M-Scoreの通常の閾値、比較対象の選定基準。本文が入手できず確認できなかった。"}}, {"id": "pr26", "rank": 26, "headline": "不動産裁量が放送局の監視機能を弱める", "title": "Divergent Agency Costs and the Collapse of Media Monitoring: Real Estate Discretion as a Structural Constraint on Japanese Broadcasters", "url": "https://doi.org/10.2139/ssrn.7594478", "authors": "Takashi Miyazawa", "venue": "SSRN", "date": "2026-10-12", "apa": "Miyazawa, T. (2026). Divergent Agency Costs and the Collapse of Media Monitoring: Real Estate Discretion as a Structural Constraint on Japanese Broadcasters. https://doi.org/10.2139/ssrn.7594478", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "日本の民間放送局が行政裁量に依存する不動産・都市開発事業を抱えることで、行政を監視する機能が構造的に失われる経路を、エージェンシーコストの枠組みで定式化した（抄録）。", "p3": "有価証券報告書（EDINET）と決算説明資料を分析し、放送本業の低収益を、行政裁量（容積率の緩和、用途地域の変更）に大きく依存する不動産・都市開発事業で補うという事業モデルへの収斂を示す。この行政裁量への依存（第1の首輪）と新聞・テレビのクロスオーナーシップ（第2の首輪）が、メディア内部の相互批判と自己修正を原理的に閉ざすと論じる（抄録）。", "p5": "企業金融のプリンシパル・エージェントモデルを拡張し、行政が記録を作らないこと（R=0）とメディアが監視を放棄すること（e*=0）が外部監視費用を無限大に押し上げ（MC→∞）、市民と投資家が負う総エージェンシーコストを最大化する機構を形式化する。対照群としてテレビ東京のモデルを挙げ、不動産依存が臨界点に達したフジ・メディア・ホールディングスなどと比較する（抄録）。", "fun": "放送局が行政を監視するという役割は、建前としては誰も疑わない。この論文が持ち出したのは、放送局が都市開発で儲けている事実である。容積率を緩めてもらえるかどうかは行政の裁量で決まるので、その相手を強く批判しにくくなる。しかも新聞とテレビが同じ資本の下にあるので、業界内で批判し合う回路もない。首輪が2本あると書く表現が、構造を端的に示している。", "unverified": "モデルの形式的な定式化、各社の不動産依存度の数値、分析対象の期間。本文が入手できず確認できなかった。"}}, {"id": "pr27", "rank": 27, "headline": "産業集計統計の停止は開示を代替したか", "title": "Are Aggregate Industry Benchmarks Substitutes or Complements to Firm Disclosures? Evidence from the Stoppage of Government Current Industrial Reports", "url": "https://doi.org/10.2139/ssrn.7595518", "authors": "Jonas Lee", "venue": "SSRN", "date": "2026-10-12", "apa": "Lee, J. (2026). Are Aggregate Industry Benchmarks Substitutes or Complements to Firm Disclosures? Evidence from the Stoppage of Government Current Industrial Reports. https://doi.org/10.2139/ssrn.7595518", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "政府が作る産業集計統計が打ち切られたことを使って、外部の集計情報が企業の自社開示の代替か補完かを識別した（抄録）。", "p3": "米国国勢調査局のCurrent Industrial Reports（CIR）は、選ばれた製造業について生産・出荷・在庫・能力の物量統計を定期的に供給していたが、2011年に打ち切られた。個々の企業にとって外生的なこの打ち切りを使い、差分の差分法で、影響を受けた産業の企業の開示行動を比べる（抄録）。", "p5": "影響を受けた産業の企業は、単位ベースの操業に関する開示の可能性・頻度・幅を、影響を受けなかった産業の企業に比べて有意に減らした。結果はより広い数量開示とMD&Aにも及び、マッチング標本の設計でも頑健である。補完の説明と整合して、開示の減少は製品市場の類似性が高い企業と上場企業の存在が大きい産業で強いが、競争の激しい製品市場で体系的に強くなるわけではない。打ち切り後、影響を受けた企業の情報環境は小幅に悪化した（抄録）。", "fun": "政府が集めていた産業統計が廃止されると、企業はどうするか。普通に考えれば、外から情報が来なくなったぶん自分で説明すると思える。ところが実際には、企業は数量の開示を減らした。公の統計と自社の説明は競合ではなく、互いを支え合う補完関係だったわけだ。しかも減らしたのは、似た製品を作る企業が多い産業だった。比べる相手の情報があるからこそ、自分も語れたという構図である。", "unverified": "標本の企業数と期間、開示指標の定義、情報環境の悪化の大きさ。本文が入手できず確認できなかった。"}}, {"id": "pr28", "rank": 28, "headline": "評価残差はベンチマーク次第で分類が変わる", "title": "From Residual Similarity to Application Sensitivity: Benchmark Composition in Accounting-Based Valuation Residuals", "url": "https://doi.org/10.2139/ssrn.7601899", "authors": "Seongki Lim ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Lim, S., & Kim, H. (2026). From Residual Similarity to Application Sensitivity: Benchmark Composition in Accounting-Based Valuation Residuals. https://doi.org/10.2139/ssrn.7601899", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "会計ベースの評価残差が、使うベンチマークの構成によって企業の分類をどれだけ変え、その分類に基づく実証結果がどれだけ動くかを測った（抄録）。", "p3": "韓国の非金融企業の2011年から2023年の22,030の企業・年観測を使い、RKRV残差のベンチマーク構成を1つずつ、またはまとめて変える。残差そのものの相関、五分位と極端群の再分類率、そしてその分類に基づく実証的な関係の安定性を調べる（抄録）。", "p5": "残差の相関は0.983〜0.990と高く、五分位と極端群の再分類率は相関を揃えたガウス分布の参照値より低い。しかし複数の五分位を飛び越える稀な移動は参照値を上回る。実証上の影響は応用によって違い、連続的な株式調達の関係は比較的安定である一方、説明変数にCAPEX/TAを加えると、有形投資についてQ5–Q1の関係が約41%、有形＋無形投資で33%縮む（抄録）。", "fun": "企業の株価が理論値からどれだけ離れているかを測るとき、「同じような企業」を何で揃えるかで答えが変わる。この研究が示したのは、残差そのものの相関は0.983〜0.990でほとんど同じなのに、それを使って作った五分位の順位が入れ替わり、投資との関係が4割も縮むことである。似ている指標が似た結論を保証しない。中間生成物の相関で安心してはいけないという教訓になる。", "unverified": "RKRV残差の定義、5つの追加変数の内容、参照値の計算方法。本文が入手できず確認できなかった。"}}, {"id": "pr29", "rank": 29, "headline": "IFRS17の集約水準をk平均で最適化", "title": "Optimizing the Level of Aggregation in IFRS 17 Reporting Through K-Means Technique", "url": "https://doi.org/10.2139/ssrn.7590618", "authors": "Lalka Stoeva ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Stoeva, L., & Marchev, A. (2026). Optimizing the Level of Aggregation in IFRS 17 Reporting Through K-Means Technique. https://doi.org/10.2139/ssrn.7590618", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ。抄録が短く情報が限られる", "preprint": true, "short": true, "p1": "IFRS 17が求める保険契約の集約を、k平均クラスタリングで自動化する簡素な方法を示した（抄録）。", "p3": "リスクスコアにk平均法を適用し、IFRS 17に沿った一貫性のある年次のコホートに契約をまとめる。保険数理の手法と規制の指針に基づいて設計されており、準拠性と使いやすさの両立を狙う（抄録）。", "p5": "合成データセットでの結果が、保険会社にとっての費用効率の高さを裏づけたと報告されている。具体的な評価指標や比較対象は抄録に示されていないため未確認（抄録）。", "fun": "IFRS 17という保険の会計基準は、似た契約をグループにまとめて扱うことを求める。この「似た」の線引きを人手や高価なシステムでやると、小さな保険会社には負担が重い。そこでリスクスコアをk平均法でクラスタリングするという、統計の教科書に出てくる基本的な道具をあてる。規制が要求する「一貫した集約」が、実はクラスタリングという既知の問題だったという見立てが面白い。", "unverified": "合成データの作り方、評価指標、既存の集約方法との比較。本文が入手できず確認できなかった。"}}, {"id": "pr30", "rank": 30, "headline": "取引データで信用情報の空白を埋める", "title": "Behavioral Credit Risk Scoring from Transaction Data in Nigeria", "url": "https://doi.org/10.2139/ssrn.7593920", "authors": "Temitope Dahunsi", "venue": "SSRN", "date": "2026-10-12", "apa": "Dahunsi, T. (2026). Behavioral Credit Risk Scoring from Transaction Data in Nigeria. https://doi.org/10.2139/ssrn.7593920", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "信用情報機関の網羅が薄いナイジェリアで、銀行取引明細から個人と事業者を採点する行動ベースの与信エンジンを設計し、計算の正しさを検証した（抄録）。", "p3": "行動特徴（所得の安定性、口座の資金移動の挙動、借入の重ね方、流動性の分布、集中度、裁量的なリスクの持続）を定式化し、未検出の負債を信頼度で重みづけて扱い、データ品質と特徴の確信度の層を置く。単調なペナルティに基づくスコアを、返済余力の指標とは分けて保つ。検証は、モデルの出力を生の明細まで遡って版ごとに追跡することで行う（抄録）。", "p5": "この検証で、貸出の判断を逆転させる欠陥が見つかった。隠れた負債が部分的に発見されるとスコアが改善してしまう、単位の誤りで期末残高が約9,000倍に膨らむ、キーワードの衝突で1人の支出の93%が医療費に分類される、といった不具合である。各欠陥は修正と自動の予防テストに対応づけられた。著者は、これらを直せば計算は内部的に正しいが、予測妥当性・事業者の明細での性能・閾値の校正・下位集団の公平性は未確立だと述べる（抄録）。", "fun": "信用情報の仕組みが整っていない国では、銀行の明細だけで与信を判断するしかない。この論文の正直さが際立つのは、作ったシステムの検証で見つかった不具合を全部並べたところである。残高が9,000倍になる単位の誤り、支出の93%が医療費に分類される語句の衝突、そして隠れた借金が見つかると点数が良くなるという逆転。どれも実際に貸す・貸さないの判断を変えてしまう。", "unverified": "標本の規模、予測妥当性の評価（抄録は未確立としている）、閾値の設定。本文が入手できず確認できなかった。"}}, {"id": "pr31", "rank": 31, "headline": "預け金が航空会社の忠誠を支える", "title": "Passenger Commitment and Airline Loyalty: A Strategic Framework for Travel Reserve Accounts and Revenue Quality", "url": "https://doi.org/10.21203/rs.3.rs-11097310/v1", "authors": "Soroosh Khajavi", "venue": "Research Square (In Review)", "date": "2026-10-12", "apa": "Khajavi, S. (2026). Passenger Commitment and Airline Loyalty: A Strategic Framework for Travel Reserve Accounts and Revenue Quality. https://doi.org/10.21203/rs.3.rs-11097310/v1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Research Squareから取得した抄録を読んだ。抄録に設計が明記されている", "preprint": true, "short": true, "p1": "顧客が自発的に保護された旅行積立に資金を置き、航空会社が透明で座席供給を踏まえた便益で応える、コミットメントに裏づけられた忠誠の枠組みを設計した（抄録）。", "p3": "忠誠プログラム、関係性マーケティング、カスタマージャーニー、サービス回復、公正性、ダイナミック・ケイパビリティの研究を、旅客航空の運営条件と統合する。理論の統合と設計論理により「コミットメントの質」という構成概念を定義し、製品の構造を定め、5つの命題を導き、経営レベルのガバナンスとパイロット試験の枠組みを示す。航空会社・旅客・取引のデータは提示していない（抄録）。", "p5": "抄録の結論は、事前のコミットメントが価値を持つのは、積立が顧客にとって有用で、便益が実際に履行でき、価格が公正に保たれ、報酬・サービス・資金保全・共食い・回復の混乱の費用を差し引いても増分の貢献が残るときに限られるというもの。提案する構造は、積立の便益を上級会員資格と分離し、座席供給と運航混乱のゲートを設け、構成要素ごとに責任を割り当て、顧客の残高を負債として扱う（抄録）。", "fun": "航空会社が「前払いしてくれたら特典を出します」と言うのは、資金集めの手段に見える。この論文が立てた問いは違って、前払いがいつ本当に顧客の価値になるかである。答えは条件つきで、積立が使いやすく、約束した特典が満席で履行できず、価格の公平さが保たれ、しかも諸費用を引いて黒字が残るとき。顧客の残高を会社の負債として扱えと明記するのも、信頼の設計として筋が通っている。", "unverified": "5つの命題の内容、パイロット試験の設計（抄録はデータを提示していないと明記）。本文が入手できず確認できなかった。"}}, {"id": "pr32", "rank": 32, "headline": "断片的な環境訴求は組織評価にまとまるか", "title": "How higher-order perceptions of green organizational practices translate into consumer responses: Parallel roles of satisfaction and brand interactivity in China's cosmetics market", "url": "https://doi.org/10.2139/ssrn.7597629", "authors": "Yueru Wang ほか", "venue": "SSRN", "date": "2026-10-11", "apa": "Wang, Y., & Singhdong, P. (2026). How higher-order perceptions of green organizational practices translate into consumer responses: Parallel roles of satisfaction and brand interactivity in China’s cosmetics market. https://doi.org/10.2139/ssrn.7597629", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "環境訴求が断片的に届くなかで、消費者が組織レベルの判断を形成し、それが購買意図と割高を払う意思に至る経路を測った（抄録）。", "p3": "知覚されたグリーンな組織的実践（GOP）を、マーケティング能力・サプライチェーンの行動・戦略的志向に反映される高次の知覚として概念化する。顧客満足（CS）と知覚されたブランド相互作用性（BI）がその影響を購買意図（CPI）と割高支払意思（WTP）へ伝えるかを検証する（抄録）。", "p5": "中国の化粧品消費者353名の調査データをSmartPLS 4で10,000回のブートストラップで分析した。GOPはCS（β=.576）とBI（β=.463）と正に関連し、2つの媒介はいずれもCPIとWTPと正に関連、4つの特定の間接効果すべてが有意（β=.107〜.232）。残差の直接効果も有意（CPIでβ=.200、WTPでβ=.217）で補完的な部分媒介を示す。CSを介した効果はBIを介した効果の数値上およそ2倍だが、その差はブートストラップされていない（抄録）。", "fun": "「この会社は環境に配慮している」という印象は、広告・包装・原材料の説明がばらばらに届いた末にできあがる。この研究はその束ね方を測り、満足とブランドとの対話感の2つの経路に分けた。満足を通る効果は対話感を通る効果の約2倍だったが、著者はその差自体は統計的に検定していないと明記する。自分の結果のどこまでが確かかを線引きしている点が誠実である。", "unverified": "GOPの測定項目、標本の抽出方法、適合度指標。本文が入手できず確認できなかった。"}}, {"id": "pr33", "rank": 33, "headline": "透明な危機対応がブランド信頼を作る", "title": "How Transparent Crisis Communication Builds Brand Trust: Evidence from the Kenyan E-commerce Sector?", "url": "https://doi.org/10.2139/ssrn.7594038", "authors": "Tonny Odhiambo", "venue": "SSRN", "date": "2026-10-12", "apa": "Odhiambo, T. (2026). How Transparent Crisis Communication Builds Brand Trust: Evidence from the Kenyan E-commerce Sector? https://doi.org/10.2139/ssrn.7594038", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ。統合的な文献レビューであり新しいデータの分析ではない", "preprint": true, "short": true, "p1": "ケニアの電子商取引で、透明な危機対応がブランドへの信頼にどう寄与するかを、5つの実践として整理した（抄録）。", "p3": "危機対応コミュニケーション、組織の透明性、ブランド信頼、電子商取引の学術文献を統合的にレビューし、ケニアの政策と業界の資料を合わせる。分析は主に状況的危機対応コミュニケーション理論（SCCT）に導かれ、信頼と透明性についての関係志向の視点が補う（抄録）。", "p5": "抽出された5つの実践は、速やかな認知、事実の開示、説明責任、実用的な是正情報、双方向の利害関係者の関与である。配送の遅れ、決済の問題、誤解を招く商品説明、データのプライバシーの懸念、模倣品の苦情、SNS上の申し立てといった小さな失敗が、顧客が公開で体験を共有し即時の回答を期待するために急速に危機になりうる環境で、これらが重要になると論じる（抄録）。", "fun": "ネット通販では、配送が1日遅れただけの出来事が、SNSに書かれた瞬間に会社全体の信用問題になる。昔なら電話口で終わっていた苦情が公開されるからだ。この研究が挙げる5つの対応のうち、最初が「速やかに認める」であるのは示唆的である。原因が分かる前に、まず受け取ったと伝える。調べてから答えるという普通の作法が、公開の場では遅すぎることになる。", "unverified": "レビューの対象文献数、ケニアの政策・業界資料の内容、5つの実践の効果の検証（文献レビューであり実証はない）。本文が入手できず確認できなかった。"}}, {"id": "pr34", "rank": 34, "headline": "スペイン語版ストレッサー尺度の妥当性", "title": "Psychometric Properties of the Spanish Version of the University Student Stressors Questionnaire (USSQ): Structure, Reliability, Validity, and Measurement Invariance", "url": "https://doi.org/10.20944/preprints202610.0731.v1", "authors": "Marta Beranuy ほか", "venue": "Preprints.org", "date": "2026-10-12", "apa": "Beranuy, M., Yllanes-Lizarraga, S., Esteban-Rezusta, E., Kamtsios, S., Karagiannopoulou, E., Beyebach, M., & Rivera, D. (2026). Psychometric Properties of the Spanish Version of the University Student Stressors Questionnaire (USSQ): Structure, Reliability, Validity, and Measurement Invariance. https://doi.org/10.20944/preprints202610.0731.v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Preprints.orgから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "大学生の学業ストレッサーを測る質問紙のスペイン語版を作り、因子構造・信頼性・妥当性・測定不変性まで揃えて検証した（抄録）。", "p3": "スペインの公立大学の学生4,925名を対象に、探索的因子分析と確認的因子分析、性別・ジェンダー・学修段階による測定不変性の分析、そして抑うつ・不安・ストレス（DASS-21）と心理的well-being（RyffのPWB）との収束的妥当性の分析を行う（抄録）。", "p5": "最終的な27項目・7因子のモデルが最適な適合と十分な信頼性（McDonaldのω：.73〜.89）を示した。測定不変性は、性別とジェンダーについては部分的、学修段階については完全に達成された。収束的妥当性は、心理的苦痛との正の相関とwell-beingとの負の相関によって支持された。抄録は「失敗への恐れ」が最も重要なストレッサーとして浮かび上がると述べる（抄録）。", "fun": "「学生がどんなことにストレスを感じるか」を測る物差しを、別の言語と文化に移すのは思ったより難しい。同じ質問が同じ意味で受け取られる保証がないからだ。この研究は4,925人という大きな標本で、性別や学年をまたいで同じ物差しとして働くかまで検定した。結果として最も強いストレッサーに挙がったのは「失敗への恐れ」。課題の量ではなく、失敗という見通しが重いらしい。", "unverified": "7因子の内容、部分的不変性で自由にした母数、適合度指標の値。本文が入手できず確認できなかった。"}}, {"id": "pr35", "rank": 35, "headline": "中国語版カモフラージュ尺度を青年で検証", "title": "A Psychometric Analysis of the Chinese Version of the Camouflaging Autistic Traits Questionnaire Among Adolescents in Chinese Mainland", "url": "https://doi.org/10.21203/rs.3.rs-10903525/v1", "authors": "Shihuan Gao ほか", "venue": "Research Square (In Review)", "date": "2026-10-12", "apa": "Gao, S., Liao, J., Li, R., & Su, Y. (2026). A Psychometric Analysis of the Chinese Version of the Camouflaging Autistic Traits Questionnaire Among Adolescents in Chinese Mainland. https://doi.org/10.21203/rs.3.rs-10903525/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "自閉的な特性を隠す「社会的カモフラージュ」を測る質問紙の簡体字中国語版を、思春期の生徒・学生で検証した（抄録）。", "p3": "中国本土の4つの中学校と3つの大学から無作為に参加者を募る。第1標本の有効回答805件で潜在因子構造を探索・検証し、第2標本の269件で追加の信頼性・妥当性を評価する。探索的因子分析と基本的な心理測定の分析はSPSS 25.0、確認的因子分析と測定不変性の検定はMplus 7.4で行う。さらに定量的な意味分析で、他の関連尺度に対する弁別的妥当性を調べる（抄録）。", "p5": "因子負荷が0.40を下回る項目は除外される方針が述べられている。それ以降の具体的な因子数・信頼性係数・不変性の結果は、抄録の冒頭部分までしか原文ファイルに収まっておらず未確認である（抄録）。", "fun": "自閉的な特性のある人が、周りに合わせるために特性を隠すことを「カモフラージュ」と呼ぶ。本人は疲れるのに、外からは順応しているように見えるので、支援が届きにくい。それを測る質問紙を中国語に移すというのがこの研究で、思春期という自己像に敏感な時期を対象にしている。隠すという行為を本人の自己報告で測るという、入れ子になった難しさがある研究である。", "unverified": "最終的な因子構造、信頼性係数、測定不変性の結果。抄録が途中までしか収められておらず確認できなかった。"}}, {"id": "pr36", "rank": 36, "headline": "認知症介護者への遠隔支援を地図にする", "title": "Online and Remote Non-pharmaceutical Behavioral Management Interventions for Informal Carers of Community-Dwelling People Living with Dementia: A Scoping Review Protocol", "url": "https://osf.io/fxcbz", "authors": "Nicole Fung ほか", "venue": "OSF Preprints (OSF Preprints)", "date": "2026-10-09", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OSF Preprintsから取得した抄録を読んだ。抄録が2文のみと短く情報が限られる", "preprint": true, "short": true, "p1": "在宅の認知症の人を介護する家族向けの、オンラインまたは遠隔での非薬物的な介入について、証拠の範囲と特徴を地図にするスコーピングレビューの計画を示した（抄録）。", "p3": "対象は、認知症の行動・心理症状（BPSD）に対処するための、地域在住の認知症の人の非形式の介護者に向けたオンラインまたは遠隔の非薬物的介入である。スコーピングレビューの手法で、証拠の広がりと特徴を整理する（抄録）。", "p5": "これはレビューを行うための計画（プロトコル）であり、結果はまだ報告されていない。検索戦略、選定基準、分析の枠組みの詳細は抄録に示されていないため未確認（抄録）。", "fun": "認知症の介護で家族が最も困るのは、物忘れそのものより、不安や興奮といった行動と心理の症状への対応である。薬に頼らない方法はいくつもあるが、介護者が家を離れて研修に通うのは難しい。だからオンラインや遠隔の支援に証拠があるのかを先に地図にしようという計画である。何が分かっていないかを確かめてから始める、研究の準備運動にあたる。", "unverified": "検索戦略、選定基準、対象とする介入の種類。抄録が2文のみで、本文が入手できず確認できなかった。"}}, {"id": "pr37", "rank": 37, "headline": "混合・高階問題に最小二乗等幾何的配置", "title": "Least-squares isogeometric collocation for mixed and higher-order problems", "url": "https://doi.org/10.2139/ssrn.7601313", "authors": "Maria Roberta Belardo", "venue": "SSRN", "date": "2026-10-12", "apa": "Belardo, M. R. (2026). Least-squares isogeometric collocation for mixed and higher-order problems. https://doi.org/10.2139/ssrn.7601313", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "混合型と4階の問題に対して、最小二乗の等幾何コロケーションで配置点をどう選ぶとよいかを数値的に調べた（抄録）。", "p3": "奇数次数には2階微分の超収束点、偶数次数には対称な内部の点対を使って過剰決定系を作る。残差の式を重み付き最小二乗の汎関数で結合し、一部の条件は従属係数を消去することで厳密に課す（抄録）。", "p5": "数値実験は、ほぼ非圧縮の弾性問題、定常の非圧縮流、重調和方程式を、単一パッチと複数パッチの領域で扱う。結果として、混合型の弾性の定式化で変位の精度が改善し、滑らかな非圧縮流では速度と圧力の収束次数が最適になり、扱った4階の問題では少なくともp−1の収束次数が得られた。これらは、選んだ配置点を混合近似空間と高階の微分作用素に使うことを支持する（抄録）。", "fun": "有限要素法で解くとき、方程式を満たすべき点をどこに置くかで精度が決まる。等幾何解析ではこの点の選び方に自由度があり、うまく選ぶと本来より速く収束する「超収束点」が存在する。この研究は、その点の選び方を4階の方程式や圧力と速度を同時に解く問題にまで広げた。計算の中身を変えずに点の置き場所を変えるだけで精度が上がるのは、地味だが効く工夫である。", "unverified": "収束次数の具体的な値、比較した配置点の候補、パッチ数の条件。本文が入手できず確認できなかった。"}}, {"id": "pr38", "rank": 38, "headline": "地すべりの形から侵食体積を記号式で出す", "title": "Quantifying volumetric erosion from symbolic expression of landslide morphology", "url": "https://doi.org/10.31223/x5qn5c", "authors": "Kushanav Bhuyan ほか", "venue": "EarthArXiv", "date": "2026-10-11", "apa": "Bhuyan, K., Fan, X., Fang, C., Nava, L., Wang, X., Liu, J., Vries, M., Catani, F., Öztürk, U., & Lombardo, L. (2026). Quantifying volumetric erosion from symbolic expression of landslide morphology. https://doi.org/10.31223/x5qn5c", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "EarthArXivから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "地すべりの侵食体積を、崩壊源の面積だけでなく堆積（流走）域の形も使った記号的な式で推定できるようにした（抄録）。", "p3": "ニューラルネットで誘導する記号回帰（neural-guided symbolic regression）で式を探索する。得られた式は、侵食体積に対する1次の支配要因として崩壊源の面積を保ちつつ、堆積域の無次元の記述子を幾何的な補正として導入する（抄録）。", "p5": "2016年のカイコウラ地震の目録では、累積の侵食体積を54.9 Mm³と推定し、実測値56.5 Mm³に近い。式は再校正せずに独立な2018年の北海道の目録に適用され、さらに2013年の蘆山地震の32件の地すべりへの盲検的な推論に使われて累積1.95 Mm³を得た。蘆山については独立な体積の観測がないため、著者はこの適用を検証ではなく推論として扱っている（抄録）。", "fun": "地すべりで動いた土の量は、災害の規模や下流への影響を決めるのに、現地で測るのは大変である。そこで崩れた範囲の面積から体積を推定する式が使われてきたが、誤差が大きい。この研究が加えたのは、土が流れ着いた先の形という情報。崩れた跡だけでなく、たまった場所の形が、どれだけ削られたかを教えてくれる。記号回帰で「人が読める式」として出した点も使いやすい。", "unverified": "得られた式の具体的な形、北海道の目録での誤差、無次元記述子の定義。本文が入手できず確認できなかった。"}}, {"id": "pr39", "rank": 39, "headline": "情報欠損下の順逆問題をブリッジで解く", "title": "SBNO : Schr\\\"odinger Bridge Neural Operator for the Forward and Inverse Problems under Missing Information", "url": "https://arxiv.org/abs/2610.13317", "authors": "Jaehyeon Park ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Park, J., Jeong, I., & Park, N. (2026). SBNO : Schrödinger Bridge Neural Operator for the Forward and Inverse Problems under Missing Information (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13317", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "観測が疎で支配方程式も部分的にしか分からない状況で、偏微分方程式の順問題と逆問題を1つの枠組みで解けるようにした（抄録）。", "p3": "SBNOは方程式を使わない、対データの拡散ブリッジ整合の枠組みである。拡散Schrödingerブリッジ整合で、マスクを意識した端点の結合から時間依存のドリフトの対を学ぶ。この結合は学習中に経験的な入力と解の対応を保ち、1つの枠組みで順方向と逆方向の両方を扱える。推論時は、学習したドリフト対から作った確率流ODEを積分して決定論的な点再構成を出し、推論時の観測や方程式の誘導重みの調整を要しない（抄録）。", "p5": "観測率5%の5つの偏微分方程式のベンチマークで、ベースラインと同等以上の精度を達成し、試験事例ごとの誤差の散らばりも小さい。さらに誘導拡散のベースラインに比べて少なくとも9.7倍速く、GPUメモリを少なくとも4.3倍削減する（抄録）。", "fun": "物理のシミュレーションを機械学習で代替するには、ふつう大量の観測か、正確な方程式のどちらかが必要である。この研究が取り組むのは、観測が5%しかなく方程式も曖昧という、現実によくある状況だ。使うのは確率過程を2点の間で橋渡しする「Schrödingerブリッジ」という道具。観測と解を両端に置いて橋を架けると、同じ仕掛けで順方向と逆方向の両方が解ける。", "unverified": "5つのベンチマークの内容、精度の具体的な数値、比較したベースライン手法。本文が入手できず確認できなかった。"}}, {"id": "pr40", "rank": 40, "headline": "熟議そのものを版管理する協働の作法", "title": "Deliberative Programming: A Versioned Deliberation Protocol for Human–AI Collectives", "url": "https://doi.org/10.5281/zenodo.23300578", "authors": "Lumbroso, Jérémie", "venue": "Zenodo", "date": "2026-10-11", "apa": "Lumbroso, J. (2026). Deliberative Programming: A Versioned Deliberation Protocol for Human–AI Collectives. Zenodo. https://doi.org/10.5281/ZENODO.23300578", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "AIの自己監視を1つのシステムの内側ではなく、人とAIの集団にまたがる版管理された記録として実現する運用を報告した（抄録）。", "p3": "実践の名は「熟議的プログラミング」で、熟議そのもの（問い、代替案、理由、根拠つきの確信度、改訂の条件）を一級の版管理された入力として、それが支配する成果物と同じ場所に置く。記録の基本単位は参照可能な決定の問いで、決定可能な問いにはORRCFプロトコル（選択肢、推奨、根拠、理由つきの確信度、反証条件）を付ける（抄録）。", "p5": "記録が持続的なメタ状態（何を決めたか、どの根拠で、どの条件で再考するか）を保持する。監視と制御はその周りで起き、エージェントは行動の前に記録を読み、コミットされたスクリプトが記録を検査し、人間のゲートが外に出るものを裁定する。markdownとgitの上で今日動く道具立てが、執筆用の雛形から携帯端末のクライアントまで用意されている（抄録）。", "fun": "AIに自分の考えを監視させようとすると、ふつうはモデルの内側に監視役を仕込む。この論文の発想は逆で、人とAIが共有する「議事録」を外に置き、そこに決めたことと理由と確信度と反証条件を書き込む。次に動く者は、まずその記録を読む。組織が議事録で動くのと同じ仕組みを、人とAIの混成チームに持ち込んだ形である。", "unverified": "事例研究の規模と成否、ツールチェーンの詳細。本文が入手できず確認できなかった。"}}, {"id": "pr41", "rank": 41, "headline": "AI生成インタビューの忠実度を測る枠組み", "title": "Simulated Voices, Real Questions: Evaluating the Authenticity of AI-Generated Interviews using the Interview Fidelity Framework", "url": "https://doi.org/10.2139/ssrn.7600982", "authors": "Lisa Matuschek ほか", "venue": "SSRN", "date": "2026-10-12", "apa": "Matuschek, L., Gabel, J., & Zarnow, S. (2026). Simulated Voices, Real Questions: Evaluating the Authenticity of AI-Generated Interviews using the Interview Fidelity Framework. https://doi.org/10.2139/ssrn.7600982", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ。抄録に設計が明記されている", "preprint": true, "short": true, "p1": "LLMが生成したインタビューが人間の語りにどこまで近いかを、相互作用の質と内容の質に分けて評価する枠組みを作った（抄録）。", "p3": "職業訓練指導者22名に半構造化インタビューを行い、同じインタビューガイドとペルソナのプロンプトで2つのLLM（ChatGPT 5.1 ThinkingとGemini 3 Flash）に対応するインタビューを生成させる。比較的な質的分析から「インタビュー忠実度の枠組み」を作り、どう話すか（応答性、言葉づかいと枠づけ、ペルソナの一貫性と独自性）と何を言うか（技術的な正しさ、語りの深さ、両義性の扱い）を捉え、知覚される真正性の評価に至る（抄録）。", "p5": "結果として、AIが生成したインタビューは知識志向で主流の語りの内容を説得的に再現する一方、体系的に（抄録の該当部分が途中で切れており、何が再現できないかの具体は未確認）。枠組みの各軸での評点の内訳も抄録には示されていない（抄録）。", "fun": "インタビュー調査をAIで代替できるかという問いは、研究の手間を考えれば魅力的だ。この研究は実際の職業訓練指導者22名の語りと、同じ質問をLLMにさせた語りを並べた。評価の軸を「どう話すか」と「何を言うか」に分けたのが要点で、流暢さと中身は別物だからである。知識的な内容はうまく真似できるが、そこから先に違いが出る、という方向の結果になっている。", "unverified": "AIが体系的に再現できない内容の具体（抄録が途中で切れている）、枠組みの各軸の評点。本文が入手できず確認できなかった。"}}, {"id": "pr42", "rank": 42, "headline": "推薦がLLM社会で分極を生む過程", "title": "Polarization Dynamics under Algorithmic Recommendations in LLM-based Online Social Networks", "url": "https://arxiv.org/abs/2610.13351", "authors": "Ali Safarpoor Dehkordi ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Dehkordi, A. S., Shirzadi, M., Nasim, M., & Zehmakan, A. N. (2026). Polarization Dynamics under Algorithmic Recommendations in LLM-based Online Social Networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13351", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "推薦の仕組みの違いが意見の分極にどう効くかを、LLMエージェントのソーシャルネットワークで統制して比べられるようにした（抄録）。", "p3": "2つの推薦機構を比較する。辺推薦（ER）はネットワークに新しいつながりを導入し、内容露出推薦（CR）は元のグラフを変えずに個々の投稿を追加の利用者に見せる。利用者を、自然言語で相互作用しながら意見の状態を更新していくLLMエージェントとして表す（抄録）。", "p5": "分極は意見の散らばりとして測る。実プラットフォームの実証分析はデータの雑音・欠損・入手不可に、数理モデルは単純化された意見更新則に制約されるのに対し、この枠組みは統制と自然言語の相互作用を両立させると位置づけられる。2機構の比較の具体的な結果は、抄録が途中で切れており未確認（抄録）。", "fun": "推薦アルゴリズムが意見の分極を生むという話はよく聞くが、実際のSNSのデータは手に入らず、数式のモデルでは人の意見の変わり方が単純すぎる。この研究はLLMを使って仮想の利用者を作り、「新しい友達を勧める」のと「投稿を多くの人に見せる」のを分けて比べた。同じ推薦という言葉でも、つながりを変えるのか見せ方を変えるのかで効き方が違うはずだという着眼である。", "unverified": "ERとCRの比較結果、エージェント数とシミュレーションの規模。抄録が途中で切れており確認できなかった。"}}, {"id": "pr43", "rank": 43, "headline": "音声LLMは聞き流すべき手がかりを知るか", "title": "Personalization Without Stereotyping: Do Speech LLMs Know When to Turn a Deaf Ear?", "url": "https://arxiv.org/abs/2610.13550", "authors": "Kshitij Ambilduke ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Ambilduke, K., Brun, C., Thonet, T., Nikoulina, V., & Boito, M. Z. (2026). Personalization Without Stereotyping: Do Speech LLMs Know When to Turn a Deaf Ear? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.13550", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "音声LLMが話し方の手がかりから属性を読み取るとき、有益な個別化と型にはめた振る舞いを切り分けて測れるようにした（抄録）。", "p3": "BASIS-Benchは3つの軸で両者を分離する。(1)属性に対する頑健性：話者をまたいだ内容課題の格差と属性の分類能力を測る。(2)型にはめた偏り：知覚された属性の手がかりが、求められていない定型的な振る舞いを引き起こすかを測る。(3)個別化：明示的に求められたとき属性に合わせて応答を調整できるかを測る（抄録）。", "p5": "最近の音声LLM 8つを評価し、属性の手がかりを認識できることが多いにもかかわらず、ほとんどが適切な個別化に結びつけられないと報告する。属性のラベルを明示すると個別化は改善するが、テキスト側の基盤モデルにすでにある定型的な連想も増幅される。著者は、手がかりを知覚するだけでなく、それをいつ応答に反映すべきかを学ばせる必要があると述べる（抄録）。", "fun": "声には年齢や出身地の手がかりが乗る。AIがそれを聞き取れるようになると、相手に合わせた応答ができる反面、決めつけも起きる。この研究の巧みなところは、その2つを別の軸として測り分けたこと。結果は意外で、多くのモデルは手がかりに気づいているのに、良い方向の個別化には使えていない。そして属性を明示的に教えると、個別化と同時に偏見も強まる。", "unverified": "評価した8モデルの名前、各軸の評点。本文が入手できず確認できなかった。"}}, {"id": "pr44", "rank": 44, "headline": "抵抗する買い手ペルソナで営業AIを試す", "title": "SmartSalesBench: A Resistance-Aware Multi-Turn Benchmark for Evaluating LLM Sales Agents", "url": "https://arxiv.org/abs/2610.12975", "authors": "P N Bhargav Teja ほか", "venue": "arXiv", "date": "Mon, 12 Oct 2026", "apa": "Teja, P. N. B., Reddy, V. L., Basumata, M., Sarkar, S., & Muni, R. R. D. (2026). SmartSalesBench: A Resistance-Aware Multi-Turn Benchmark for Evaluating LLM Sales Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.12975", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "協力的でない買い手を相手にLLMの営業エージェントを評価する、多ターンの対話ベンチマークを作った（抄録）。", "p3": "既存の課題志向の対話ベンチマークは協力的な利用者を前提に課題の完了を測るが、SmartSalesBenchはこれを反転させ、最大20ターンにわたり抵抗し反論するようプログラムされたペルソナを相手に置く。営業エージェント側と買い手ペルソナ側の生成はいずれも検索拡張生成（RAG）で根拠づけられている（抄録）。", "p5": "ベンチマークは5つのエージェントのプロファイル、12の買い手ペルソナ、6つの価格帯にまたがる15のスマートフォン製品、3回の反復を持つ4つの統制実験で構成され、合計13,680セッションになる。評価指標は9つで3層（主要な成果指標、副次的な質の指標、将来の報告に向けた探索的な指標）に分かれる。評価は自動のLLM-as-judgeと内部の人間評価（n=50、κ=0.71、主要指標BRSとのPearson r=0.81）を組み合わせる（抄録）。", "fun": "AIに営業をさせる研究は増えているが、評価用の客がたいてい素直すぎた。実際の客は値段に文句を言い、話をそらし、決めない。この研究は心理学的に根拠づけた「抵抗する客」のペルソナを12種類作り、最大20往復の会話で試す。13,680回のセッションを回したうえで、自動採点と人間の採点の一致（相関0.81）まで示している。評価の土台を作る地道な仕事である。", "unverified": "9つの指標の定義、各エージェントの成績、ペルソナの作り方の詳細。本文が入手できず確認できなかった。"}}, {"id": "pr45", "rank": 45, "headline": "信念の一致がAI助言の受け取り方を変える", "title": "Cognitive Processing of Ai-Generated Advice: The Role of Belief Congruence", "url": "https://doi.org/10.21203/rs.3.rs-11021363/v1", "authors": "Dorit Nevo ほか", "venue": "Research Square (In Review)", "date": "2026-10-12", "apa": "Nevo, D., Horne, B. D., & He, J. (2026). Cognitive Processing of Ai-Generated Advice: The Role of Belief Congruence. https://doi.org/10.21203/rs.3.rs-11021363/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Research Squareから取得した抄録を読んだ", "preprint": true, "short": true, "p1": "AIの助言を人がどう処理し受け入れるかが、自分とAIの信念の一致によって変わることを示した（抄録）。", "p3": "ヒューリスティック・システマティックモデル（HSM）に基づき、人とAIの信念の一致が、LLMが生成するファクトチェックの助言の処理と受容にどう影響するかを調べる。オンライン研究で、米国の成人が政治的なニュースの見出しを、左寄りと右寄りのLLMファクトチェッカーとやりとりする前後で評価する（抄録）。", "p5": "AIとの政治的な一致は、より体系的でない処理と関連した。利用者に最初にAIの助言者を選ばせる条件も、無作為に割り当てた場合に比べて体系的な処理を減らした。LLMの判定は、利用者の当初の判断と政治的な一致を考慮した後でも、その後の信頼判断を推奨の方向に動かした。著者は、個別化されたAIで知覚される適合を高める機能が、同時に批判的な吟味を減らしうるという緊張を指摘する（抄録）。", "fun": "自分と考えが近いAIの助言は受け入れやすい。ところがこの研究が測ったのは、受け入れやすさではなく「よく考えたか」である。考えが近いと、人はあまり考えずに受け入れていた。しかも、自分で助言役を選べる条件でも同じことが起きる。好みに合わせて使いやすくすると、吟味の手が止まる。個別化という親切の副作用がはっきり出ている。", "unverified": "標本規模、処理の体系性の測定方法、効果の大きさ。本文が入手できず確認できなかった。"}}, {"id": "pr46", "rank": 46, "headline": "トークン販売では説明できないAIの価値", "title": "Is the Business of Frontier AI Companies Selling Tokens? Value Capture and Equity Prices", "url": "https://doi.org/10.2139/ssrn.7592221", "authors": "Andrew Peterson", "venue": "SSRN", "date": "2026-10-12", "apa": "Peterson, A. (2026). Is the Business of Frontier AI Companies Selling Tokens? Value Capture and Equity Prices. https://doi.org/10.2139/ssrn.7592221", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNから取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": true, "short": true, "p1": "最先端のAI企業の評価額を支えうる事業モデルと、モデルの利用料以外で収入を得る計画の公開された証拠を整理した（抄録）。", "p3": "公表された資金調達の価格を仮想的な事業価値の目標として扱い、キャッシュフローを逆算して必要な収益水準を求める。さらに公開文書から、モデル利用料以外の収入源になりうる支払いや持分の取り決めを探す（抄録）。", "p5": "OpenAIとAnthropicについての逆算では、財務上の仮定によって10年目の必要収益が合計2.79兆ドルまたは7,330億ドルとなる。公開文書は、医薬品・ロボティクス・材料科学の提携を通じた支払いや持分といった追加収入の可能性を示す。著者はこれらの取り決めが企業の境界と価値獲得にどう関わるかを論じる（抄録）。", "fun": "AI企業の時価総額を正当化するには、どれだけ稼がなければならないのか。この論文は資金調達の価格から逆算し、10年目に合計2.79兆ドル、仮定を変えても7,330億ドルという数字を出した。文字どおりトークンを売るだけでは到達しそうにない規模である。だから医薬やロボットの提携で持分を取る動きが出てくる。価値をどこで獲得するかという古典的な問いが、新しい業界で蒸し返されている。", "unverified": "逆算に使った財務上の仮定の詳細、公開文書の出所。本文が入手できず確認できなかった。"}}, {"id": "pr47", "rank": 47, "headline": "データセンター論争とモラトリアムの教訓", "title": "From Cell Towers to Data Centers: How Long Island Can Get the Next Infrastru
