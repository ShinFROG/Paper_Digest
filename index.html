<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

"theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "複数のLLMが提案・反論・裁定を行う熟議の進め方を、状況に応じて切り替える制御器ADMAを学習させた（抄録）。", "p3": "課題モデル自体は固定し、品質・合意度・進捗を表す特徴から、提案・異議・裁定・調整の連続的な方策を学ぶ。法律・金融の推論で学習し、方策を更新せずに4つのテキスト・マルチモーダルの課題へ移した。", "p5": "Qwen3.5固定で、直接回答より6.2〜14.2ポイント、固定制御より2.8〜3.0ポイント正答率が上がった。ただしトークン量は中央値で14.3〜18.7倍、遅延は7.8〜16.5倍だった（抄録）。", "fun": "話し合いは長ければ良いわけではなく、意見が割れているときだけ議論を深めるのが賢いやり方です。この研究はAI同士の議論で「いつ反論し、いつまとめるか」を学ばせました。精度は上がる一方で、計算量が十数倍に増えるという代償もはっきり示しているのが誠実なところです。", "unverified": "Qwen3.6への移行で効果が課題依存になる点の詳細は抄録からは確認できない。"}}, {"id": "pr18", "rank": 18, "headline": "多エージェント討論で相手を選んで関与する", "title": "Beyond Answer Sharing: TrueMAD for Targeted Peer Engagement in Multi-Agent Debate", "url": "https://arxiv.org/abs/2610.18240", "authors": "Dezheng Bao ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Bao, D., Du, S., Huang, R., Yuan, Z., Sun, Y., & Yang, Y. (2026). Beyond Answer Sharing: TrueMAD for Targeted Peer Engagement in Multi-Agent Debate (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.18240", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "多エージェント討論（MAD）で、他者の答えを見せるだけでなく、特定の相手の推論に一対一で助言させる仕組みTrueMADを提案した（抄録）。", "p3": "答えの共有と自己修正の間に、支持・反論・改良・質問のいずれかで相手の推論に応じる段階を加える。パラメータ更新は不要で、既存の討論法に追加できる。", "p5": "AIME、GPQA-Diamond、TruthfulQAでQwen3-30B-A3Bを使い、通常の討論に比べエージェント単位で平均3.62ポイント、厳密な多数決で3.52ポイント精度が上がった（抄録）。", "fun": "クラスの話し合いで全員の答えを黒板に並べるだけだと、多数派に流されがちです。この研究は「あなたのこの部分はこう考えたら？」と一対一で返事をさせる仕組みを入れました。誰かに直接向き合うことで、正しい少数意見が埋もれにくくなるのが面白い点です。", "unverified": "改善の統計的な有意性の評価方法は抄録からは確認できない。"}}, {"id": "pr19", "rank": 19, "headline": "証拠に応じて熟議の手順を切り替える", "title": "ECMR: Evidence-Aware Deliberation Control for Multi-Agent LLM Reasoning", "url": "https://arxiv.org/abs/2610.17869", "authors": "Yuan Liu ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Liu, Y., Peng, H., Hu, F., Huang, L., & Cai, W. (2026). ECMR: Evidence-Aware Deliberation Control for Multi-Agent LLM Reasoning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.17869", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "複数LLMの熟議で、同じ根拠の繰り返しを独立した確認と取り違える「意味的な偽の合意」を減らす制御器ECMRを提案した（抄録）。", "p3": "各段階で答えの集中度、根拠の多様性・独立性、矛盾、検証履歴、残り予算を要約し、提案・異議・検証・裁定・多様化・停止のどれを行うかを、予算つきの有限期間制御として選ぶ。", "p5": "MedQA、CaseHOLD、FinQAの9,000件で、正答率が62.1%から84.9%に、偽の合意率が40.7%から17.0%に下がり、根拠支持率が58.0%から88.7%に上がった（抄録）。", "fun": "5人が同じ意見でも、全員が同じネット記事を読んだだけなら証拠は1つです。この研究は、AI同士の議論で「みんな賛成」が本当に独立した確認かどうかを見分けようとします。多数決の落とし穴を数字で示した点が面白いところです。", "unverified": "トークン効率の比較の詳細と、医療分野の課題を含む評価の内訳は抄録からは確認できない。"}}, {"id": "pr20", "rank": 20, "headline": "ネパールの移民言説で人間に基づくペルソナ注釈", "title": "NepPlural: A Human-Anchored Benchmark for Persona Annotation in Nepali Migration Discourse", "url": "https://arxiv.org/abs/2610.15732", "authors": "Jinu Nyachhyon ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Nyachhyon, J., Khatiwada, A., & Timilsina, B. (2026). NepPlural: A Human-Anchored Benchmark for Persona Annotation in Nepali Migration Discourse (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.15732", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "ネパールの若者の海外流出をめぐるYouTubeコメントで、社会文化的なペルソナを人が注釈した基準データNepPluralを作り、LLM注釈の信頼性を監査した（抄録）。", "p3": "2,148件のコメントを意図・動機・価値志向・感情の4軸と「ペルソナなし」で注釈し、母語話者3名による300件の基準集合（Fleissのκ≈0.55）でLLMの注釈を評価した。", "p5": "一括注釈ではモデル間一致がκ≈0.17、1件ずつではκ≈0.72に上がったが、母語話者がペルソナなしとした39%のコメントにもモデルは同じペルソナを付けた。棄権を許すと「ペルソナなし」のF1が0.79〜0.87に回復した（抄録）。", "fun": "AI同士の意見がそろっても、それが正しいとは限りません。この研究では、人が「特に意見はない」と判断したコメントにも、AIたちは仲良く同じ人物像を当てはめていました。「分からない」と言える選択肢を与えるだけで改善するのが、人間の調査票づくりとも通じる発見です。", "unverified": "4軸それぞれの一致度の内訳は抄録からは確認できない。"}}, {"id": "pr21", "rank": 21, "headline": "LLMは各国の時間の価値をどう見積もるか", "title": "A Global View of How LLMs Value Human Time", "url": "https://arxiv.org/abs/2610.18515", "authors": "Yifan He ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "He, Y., Goethals, S., Reusens, M., & Martens, D. (2026). A Global View of How LLMs Value Human Time (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.18515", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "利用者の国だけを変えて、60分の約束の遅れにいくら補償すべきかを5つのLLMに尋ね、LLMが各国の人の時間をどう評価するかを193か国で比べた（抄録）。", "p3": "LLMの回答を、購買力平価の1人当たりGDP、平均所得、文献に基づく忍耐度指標と比較し、プロンプトの変化への頑健性も調べた。", "p5": "LLMは欧州に最も高い補償を、アフリカにはおおむね最も低い補償を勧め、GDPに照らすとアジアと南米の人の時間を過小評価していた（抄録）。", "fun": "「待たされた1時間の価値」は国によって違うのでしょうか。AIに国名だけを変えて聞くと、答える金額が地域ごとに大きく変わりました。AIが世界の格差の見方をそのまま覚えていて、代理人として行動するときに人を違う扱いにするかもしれない、という問いが面白い点です。", "unverified": "使用した5つのLLMの名称と補償額の具体的な数値は抄録からは確認できない。"}}, {"id": "pr22", "rank": 22, "headline": "機械ラベルの感情比較にプラットフォーム差は入るか", "title": "Is the Platform Part of the Measurement? A Protocol and Simulation Study for Cross-Platform Equivalence of Machine-Labelled Policy Sentiment", "url": "https://arxiv.org/abs/2610.16757", "authors": "Asad Ikram ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Ikram, A., & Haig, E. (2026). Is the Platform Part of the Measurement? A Protocol and Simulation Study for Cross-Platform Equivalence of Machine-Labelled Policy Sentiment (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.16757", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "SNSの感情分類の結果をプラットフォーム間で比べる前に、分類器が各プラットフォームで同じものを測っているかを検証する6段階の手順を示した（抄録）。", "p3": "心理測定の等価性の道具（一般化可能性理論、測定不変性、DIF、得点のリンキング）を、プラットフォームを調査モードとみなして機械ラベルに当てはめ、正解の分かるシミュレーションで検証した。", "p5": "500回の反復で、各プラットフォームの得点をそのまま合算した指標は約4分の1の日で集計感情の符号を誤り、測定関数で調整した指標では平均で60日に1日未満だった（抄録）。", "fun": "同じ体重計でも、床が柔らかいと値が変わります。SNSの「世論の感情」も、XとRedditで分類AIの測り方が違えば単純に比べられません。心理学のテスト理論を使って、その「床の違い」を補正しようという発想が面白いところです。", "unverified": "4プラットフォームでの本格的な適用は後続研究とされ、実データでの効果は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "確率的物理情報NNで確率境界値問題を解く", "title": "Physics-informed random neural architectures on compact boundaryless multiply connected manifolds for random-operator models in machine learning and uncertainty quantification", "url": "https://arxiv.org/abs/2610.14844", "authors": "Christian Soize", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Soize, C. (2026). Physics-informed random neural architectures on compact boundaryless multiply connected manifolds for random-operator models in machine learning and uncertainty quantification (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.14844", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "ランダムな作用素をもつ確率的境界値問題に対し、物理と共通の確率的な種で結ばれた確率的ニューラルネット（SPINN）を提案した（抄録）。", "p3": "コンパクトで境界のない多重連結多様体上のガウス場とポアソン点過程でニューロンの位置と疎な結合を作り、問題の確率的作用素と同じガウスの種で駆動する。PDE残差の損失は使わず、観測空間で負の対数尤度と分布の整合項を組み合わせて学習する。", "p5": "周期的な円筒面上の確率的楕円型問題で、モデルとデータが整合する場合と誤指定の場合を例示した（抄録）。", "fun": "材料の強さや地盤の固さは場所ごとにばらつき、方程式そのものがランダムになります。この研究は、ニューロンの配置や結合までランダムに作ったネットワークを、問題と同じ「サイコロ」で動かすという大胆な発想です。答えを一つでなく確率分布として出せるのが特徴です。", "unverified": "数値例での精度の具体的な数値は抄録からは確認できない。"}}, {"id": "pr24", "rank": 24, "headline": "点教師の画像学習でGNSS測定品質を評価", "title": "Point-Supervised Visual Learning for GNSS Measurement Quality Assessment", "url": "https://arxiv.org/abs/2610.14822", "authors": "Weiwei Zhai ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Zhai, W., Yan, P., Wang, L., & Hsu, L.-T. (2026). Point-Supervised Visual Learning for GNSS Measurement Quality Assessment (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.14822", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "魚眼カメラの空の画像から、各衛星のGNSS観測が誤りかどうかを予測し、都市部の測位精度を上げる枠組みを示した（抄録）。", "p3": "差分GNSSの二重差分擬似距離残差から衛星の投影位置に自動で誤りラベルと重みを作り、点だけの教師で画像ネットワークを学習する。予測した誤り確率で重み付き最小二乗測位を行う。", "p5": "学習とは別の日の都市走行データで、4つのモデルとも二値の空の分割に比べ水平RMSEを29.51〜36.07%減らし、U-Netが最小の0.78 mだった（抄録）。", "fun": "ビルの谷間ではGPSの電波が壁に反射して、位置が数十メートルずれることがあります。この研究は、空を見上げるカメラ画像から「この衛星の信号は怪しい」とAIに見抜かせました。人が1枚ずつ塗り分けなくても、GNSS自身の誤差から教師データを作れるのが巧みな点です。", "unverified": "走行データの距離・時間と使用した受信機は抄録からは確認できない。"}}, {"id": "pr25", "rank": 25, "headline": "フローマッチングで物理的にあり得る初期摂動を作る", "title": "Flow Matching for Physically Plausible Initial-State Perturbations in Dynamical Systems for Uncertainty Quantification", "url": "https://doi.org/10.2139/ssrn.7607514", "authors": "SIDDHARTH ROUT ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "ROUT, S., Haber, E., & Gaudreault, S. (2026). Flow Matching for Physically Plausible Initial-State Perturbations in Dynamical Systems for Uncertainty Quantification. https://doi.org/10.2139/ssrn.7607514", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "カオス的な力学系の予報で、物理的にもっともらしい初期値のばらつきを作る決定論的な2段階の枠組みを示した（抄録）。", "p3": "フローマッチングで学習した可逆なODE輸送写像でデータ分布をガウス潜在空間に写し、観測状態の潜在表現を摂動して物理空間に戻す。得られたアンサンブルを決定論的な予報モデルで伝播する。", "p5": "調和振動子、ロトカ・ヴォルテラ、ローレンツ63、浅水方程式、低解像度WeatherBenchで、確率的な比較手法と同等以上のCRPSを得た（抄録）。", "fun": "天気予報では、最初の状態を少しずつ変えて何通りも計算し、予報の幅を見ます。しかし適当に乱数を足すと、現実にはあり得ない大気の状態ができてしまいます。この研究は「ありそうな状態の地図」を学習してから、その上でずらすという工夫をしました。", "unverified": "各系でのCRPSの具体的な数値は抄録からは確認できない。"}}, {"id": "pr26", "rank": 26, "headline": "生成的動力学でデータ同化のモデル誤差を扱う", "title": "Accounting for model error in ensemble variational data assimilation through learned generative dynamics", "url": "https://arxiv.org/abs/2610.17333", "authors": "Marc Bocquet ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Bocquet, M., Finn, T. S., & Cheng, S. (2026). Accounting for model error in ensemble variational data assimilation through learned generative dynamics (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.17333", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "データ同化で、モデル誤差を加法的なガウス雑音とみなす代わりに、学習した生成的な確率予報で表す反復アンサンブルカルマンフィルタIEnKF-Gを提案した（抄録）。", "p3": "次の状態の条件付き分布を近似する生成モデルを、弱拘束4D-Varの1ステップ版に組み込み、アンサンブル変分法として実装した。複数時刻の窓をもつ平滑化版と簡略版も示した。", "p5": "確率的ローレンツ63と多重スケールのローレンツ96で、適応型EnKFやIEnKF-Qより概して精度が高く、部分観測でモデル誤差が大きいときに改善が大きかった（抄録）。", "fun": "天気予報のモデルは、雲の細かい動きなどを表せず、どうしても誤差が出ます。従来はその誤差を「ただのランダムなずれ」とみなしてきました。この研究はAIにその誤差のくせを学ばせ、観測と組み合わせました。見えない小さなスケールの影響を補う発想が面白い点です。", "unverified": "改善幅の具体的な数値は抄録からは確認できない。"}}, {"id": "pr27", "rank": 27, "headline": "接触がスナップスルーに履歴依存性を生む", "title": "Contact-mediated asymmetric delay and rate memory in snapping beam pairs", "url": "https://arxiv.org/abs/2610.15119", "authors": "Gavin Linton ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Linton, G., Mahmoudirad, S., Pashine, N., & Pandey, A. (2026). Contact-mediated asymmetric delay and rate memory in snapping beam pairs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.15119", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "接触する2本の細長い梁では、飛び移り座屈（スナップスルー）が載荷の速さと履歴に依存することを示した（抄録）。", "p3": "梁の対を繰り返し圧縮し、載荷・除荷の速度を変えて、接触中に一方が他方の上を滑らずに転がってから滑り、飛び移る挙動を観察した。", "p5": "速度によって載荷時に飛ぶ、除荷時に飛ぶ、詰まったままの3通りが選ばれ、除荷側は載荷速度の記憶をもった。ある圧縮量を超えると、圧縮を止めても飛び移り、その時間は閾値で発散した。最速の載荷で戻りを遅くすると1サイクルの散逸エネルギーが4倍に増えた（抄録）。", "fun": "ヘアピンをゆっくり押すか速く押すかで、パチンと跳ねるタイミングが変わる、というような現象です。2本の梁が触れ合うと、転がりと滑りの切り替わりが「どれだけ速く押されたか」を覚えてしまいます。単純な部品が記憶を持つように振る舞うのが面白い点です。", "unverified": "実験の梁の材料や寸法は抄録からは確認できない。"}}, {"id": "pr28", "rank": 28, "headline": "表面粒状流の2つの例の理論", "title": "Surface Granular flows: Two Related Examples", "url": "https://arxiv.org/abs/2610.14592", "authors": "Devang V. Khakhar ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Khakhar, D. V., & Orpe, A. V. (2026). Surface Granular flows: Two Related Examples (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.14592", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ（短い抄録）", "preprint": true, "short": true, "p1": "表面を流れる粒状体について、一点から注いでできる山と回転円筒の2つの代表的な系を比べた（抄録）。", "p3": "これらの流れを解析する連続体モデルを概観し、準2次元の系での実験結果を示した。", "p5": "両方の系の実験結果は連続体モデルでよく説明された（抄録）。", "fun": "砂を一点に注ぐと山ができ、表面を薄い層が流れ落ちます。砂時計やセメントミキサーでも同じような表面の流れが起きます。粒の集まりなのに、水のような連続した流れとして式で書けるのかという問いが、この分野の面白さです。", "unverified": "抄録が短く、比較したモデルの種類や実験条件は確認できない。"}}, {"id": "pr29", "rank": 29, "headline": "剛体球ボルツマン衝突階層を一つの頂点から導く", "title": "One vertex generates the hard-sphere Boltzmann collision hierarchy", "url": "https://arxiv.org/abs/2610.17123", "authors": "I. Karlin", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Karlin, I. (2026). One vertex generates the hard-sphere Boltzmann collision hierarchy (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.17123", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "剛体球のボルツマン方程式の衝突項を表す無限の係数テンソルが、ただ一つの基本法則（2階の応力生成頂点S）から生成されることを証明した（抄録）。", "p3": "あらゆる多項式の衝突頂点が、Sから普遍的な微分とテンソル演算の有限回の操作で得られ、従来の衝突括弧も微分で導かれることを示した。", "p5": "マッハ5の衝撃波での8次の盲検試験が、独立な衝突サンプリングと一致した（抄録）。", "fun": "気体分子のぶつかり合いを記述する式には、次数ごとに新しい係数が無限に現れると考えられてきました。この研究は、それらがすべて一つの基本的な規則から機械的に作れることを示しました。複雑に見えたものの中に、ただ一つの種が隠れていたという発見が面白い点です。", "unverified": "証明の前提条件と計算コストの比較は抄録からは確認できない。"}}, {"id": "pr30", "rank": 30, "headline": "双曲幾何を使ったH2最適な縮約モデル", "title": "$H_2$-optimal model order reduction using hyperbolic geometry", "url": "https://arxiv.org/abs/2610.16249", "authors": "Andrea Angino ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Angino, A., Dózsa, T., & Voigt, M. (2026). $H_2$-optimal model order reduction using hyperbolic geometry (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.16249", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "線形時不変系の縮約モデルを、安定性を保ったままH2最適に求める方法を双曲幾何を使って示した（抄録）。", "p3": "H2空間のマルムクィスト・タケナカ直交展開と双曲幾何の関係から平衡関数を作り、その零点が最適な縮約モデルの極になることを示した。ポアンカレ円板の積の上で、双曲測地線に沿ったニュートン法で解く。", "p5": "離散・連続時間のベンチマークで、広く使われるIRKAが不安定な縮約モデルを出す例でも、提案法は反復中ずっと安定性を保った（抄録）。", "fun": "大きな機械や建物の振動モデルを、小さなモデルに縮める技術があります。よく使われる方法は、縮めた結果が勝手に暴走する（不安定になる）ことがありました。この研究は、円の中に描く非ユークリッド幾何を使って、計算の途中でも安定性を保証しました。", "unverified": "単入力単出力の系に限られ、多入出力系への拡張は抄録からは確認できない。"}}, {"id": "pr31", "rank": 31, "headline": "POD加速の高次マルチスケール法", "title": "POD-accelerated high-order multiscale method with corrected-basis reconstruction for transient multi-continuum problems", "url": "https://arxiv.org/abs/2610.17758", "authors": "Jiayuan Peng ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Peng, J., Dong, H., & Linghu, J. (2026). POD-accelerated high-order multiscale method with corrected-basis reconstruction for transient multi-continuum problems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.17758", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "き裂や不均質な多孔質体の過渡流れを表す多連続体モデルで、高次マルチスケール法を固有直交分解（POD）で加速した（抄録）。", "p3": "結合した均質化解のスナップショットからベクトル値のPOD空間を作り、ブロック系を射影する。2つの再構成法のうち一方は、修正基底をオフラインで準備し、オンラインでは線形結合だけで解を求める。誤差評価も導いた。", "p5": "2・3次元の不均質な例で、縮約解は元の高次マルチスケール解の精度と局所的な振動を保ちつつ、計算コストを大きく下げた（抄録）。", "fun": "岩盤の割れ目の中の水と岩の中の水は、違う速さで動きながら互いにやり取りします。細かい構造を全部計算すると時間がかかりすぎます。この研究は、よく現れる流れのパターンだけを残して計算を軽くし、それでも細かい揺らぎを再現しました。", "unverified": "計算時間の削減率の具体的な数値は抄録からは確認できない。"}}, {"id": "pr32", "rank": 32, "headline": "多孔質弾性体中を進む半無限水圧破砕", "title": "A semi-infinite hydraulic fracture propagating in a poroelastic medium", "url": "https://arxiv.org/abs/2610.14049", "authors": "Evgenii Kanin ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Kanin, E., Möri, A., Garagash, D., & Lecampion, B. (2026). A semi-infinite hydraulic fracture propagating in a poroelastic medium (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.14049", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "透水性のある多孔質弾性体を進む水圧破砕の先端付近の連成問題を、一定速度で動く半無限き裂として解いた（抄録）。", "p3": "線形多孔質弾性、線形弾性破壊力学、き裂内の潤滑理論を連成し、き裂開口と流体変位関数を未知数とする非線形系を解いた。無次元透水係数、有効拘束応力など4つの無次元量で整理した。", "p5": "解は先端近くの排水・靭性支配の漸近解から、遠方の非排水・貯留粘性支配の漸近解へ移る。単純化モデルとの比較から、多孔質弾性の効果が無視できる領域から完全連成が必要な領域まで4つの領域を区分した（抄録）。", "fun": "岩に水を押し込んで割るとき、水は割れ目の中だけでなく周りの岩にも染み込み、岩自体を押し返します。この研究は、その押し合いをすべて連成させて解き、どんな条件で簡単な計算では足りなくなるかを地図のように示しました。", "unverified": "各領域の境界の具体的な数値は抄録からは確認できない。"}}, {"id": "pr33", "rank": 33, "headline": "米国でインフレ会計が消えて40年の影響", "title": "Forty Years Without Inflation Accounting in the United States: Effects on Equity, Leverage, Depreciation and Intangibles", "url": "https://doi.org/10.5281/zenodo.23370492", "authors": "Freitas, Ruben Xavier de", "venue": "Zenodo", "date": "2026-10-14", "apa": "Freitas, R. X. de. (2026). Forty Years Without Inflation Accounting in the United States: Effects on Equity, Leverage, Depreciation and Intangibles. Zenodo. https://doi.org/10.5281/ZENODO.23370492", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoのワーキングペーパーの抄録を読んだ（未査読）", "preprint": true, "short": true, "p1": "米国でインフレ会計の開示が任意化されてから約40年、物価上昇が財務諸表のどこに隠れているかを測った（抄録）。", "p3": "BEAの固定資産勘定で現在原価と歴史的原価の減価償却を比べ、2009〜2025年のSEC XBRL開示で企業ごとの自己資本の修正係数を推計した。", "p5": "現在原価の減価償却は2025年に16%上回り、1986年以降の累計差は5.3兆ドル。非金融企業の自己資本修正係数の中央値は1.52で、修正後の負債資本比率の中央値は0.48から0.31に下がった（抄録）。", "fun": "40年前に買った機械を当時の値段で帳簿に載せ続けると、物価が約3倍になった今では、会社の本当の元手が小さく見えてしまいます。この研究は、帳簿に表れないインフレの影響を国全体と個々の企業で計算しました。「無形資産の価値」とされるものの一部が、実はただの物価のずれだという指摘が刺激的です。", "unverified": "審査を経ていない置き場の文書で、推計の前提の妥当性は抄録からは確認できない。"}}, {"id": "pr34", "rank": 34, "headline": "スタートアップが財務諸表を出すコスト", "title": "The Cost of Financial Disclosure for Start-Up Firms", "url": "https://doi.org/10.2139/ssrn.7607702", "authors": "Gregory Burke ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Burke, G., & League, R. (2026). The Cost of Financial Disclosure for Start-Up Firms. https://doi.org/10.2139/ssrn.7607702", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "スタートアップが財務諸表の開示を避けるために、資金調達をどれだけ早く打ち切るかから、財務開示の直接コストを推計した（抄録）。", "p3": "米国のクラウドファンディング規制（Regulation Crowdfunding）の募集で、更新財務諸表の提出期限直前に募集終了が急増することを示し、起業家の終了判断のモデルから開示コストの分布を推定した。", "p5": "開示義務は募集期間を合計で6.1%短くし、投資を約5,300万ドル減らした。発行者の70%は少なくとも6週間、18%は少なくとも20週間早く募集を閉じてでも開示を避けようとしていた（抄録）。", "fun": "お金を集めている途中でも、決算書を出す締め切りが近づくと募集をやめてしまう起業家が大勢いました。その行動の「やめ方」から、決算書を作って見せることがどれほど嫌なのか（コストなのか）を逆算したのが巧みな点です。", "unverified": "推定モデルの具体的な仮定とサンプル数は抄録からは確認できない。"}}, {"id": "pr35", "rank": 35, "headline": "監査上の主要な検討事項は投資家にリスクを伝えるか", "title": "Do Critical Audit Matters Provide Risk-emphasizing Information to Investors?", "url": "https://doi.org/10.2139/ssrn.7607861", "authors": "Hyunkwon Cho ほか", "venue": "SSRN", "date": "2026-10-13", "apa": "Cho, H., Choi, A., Kwon, S. Y., & Sonu, C. H. (2026). Do Critical Audit Matters Provide Risk-emphasizing Information to Investors? https://doi.org/10.2139/ssrn.7607861", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "拡張された監査報告書の「監査上の主要な検討事項（CAM）」で、監査リスクをどれだけ強調して書くかが株式市場の反応に関係することを示した（抄録）。", "p3": "自然言語処理でCAMの記述における監査リスクの顕著さを得点化し、10-K提出前後の市場反応や投資家のリスク認知との関係を調べた。", "p5": "リスクを強調したCAMほど市場の反応が強く、株価の変動性と出来高が下がり、投資家のリスク認知が低かった。追加分析は監査努力と財務報告の質の向上と整合的だった（抄録）。", "fun": "監査人が「ここが要注意でした」と書くと、投資家は不安になりそうです。ところが、リスクをはっきり書いた報告ほど、かえって株価の揺れは小さくなっていました。きちんと調べたことが伝わると安心につながる、という逆説的な結果が面白い点です。", "unverified": "サンプルの期間・企業数と効果の大きさは抄録からは確認できない。"}}, {"id": "pr36", "rank": 36, "headline": "LLMで気候シナリオの財務影響開示を抽出し価格を検証", "title": "Mind the Gap: LLM Extraction of Climate Scenario Financial-Impact Disclosures and Their Pricing in Hong Kong Equity and Credit Markets", "url": "https://doi.org/10.2139/ssrn.7608119", "authors": "Fuli Yang", "venue": "SSRN", "date": "2026-10-13", "apa": "Yang, F. (2026). Mind the Gap: LLM Extraction of Climate Scenario Financial-Impact Disclosures and Their Pricing in Hong Kong Equity and Credit Markets. https://doi.org/10.2139/ssrn.7608119", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "香港の大企業140社の気候関連報告書から、気候シナリオの財務影響の数値をLLMで抽出し、市場が開示の差を価格に反映しているかを調べた（抄録）。", "p3": "ページの引用と型制約つきのLLM抽出で、2024〜2025年度の267報告書・42,192ページを数値データ化し、各ラベルを原ページと規則で照合した。株式と社債の市場反応を比べた。", "p5": "広い定義での定量開示は13.8%から34.3%に増えたが、厳密な定義では1.5%から6.6%にとどまった。シナリオに結びついた絶対額は267件中9件だけで、株式の反応に開示水準による差は見られなかった（抄録）。", "fun": "新しい規則で「気候変動でいくら損するか」を書くよう求められても、実際に数字で書いた会社はごくわずかでした。数万ページの報告書をAIに読ませ、その数字を一つずつ原文で確認した点が力技です。比べられる数字がないと、市場も反応しようがないという結論も示唆的です。", "unverified": "社債の分析は標本が小さく、効果を分離できないと著者自身が述べている。"}}, {"id": "pr37", "rank": 37, "headline": "モーメント変換による高次元混合データの異常検知", "title": "Moment-Based Anomaly Detection in High-Dimensional Mixed Data", "url": "https://arxiv.org/abs/2610.16285", "authors": "Davide Ferrari ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Ferrari, D., & Nicolodi, A. (2026). Moment-Based Anomaly Detection in High-Dimensional Mixed Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.16285", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "数値とカテゴリが混ざった高次元データで、特徴量ごとに解釈できる異常度を出し、それをまとめる異常検知法MDIを提案した（抄録）。", "p3": "異なる型の特徴量を標準化したモーメント変換で共通の尺度にそろえ、特徴量間の相関を考慮して集約する。高次モーメントを使うため、平均のずれだけでなくばらつきや歪みの変化も捉える。", "p5": "シミュレーションと、マルチオミクスとESGの実データ2例で、有限標本の較正、検出性能、特徴量ごとの解釈性を評価した（抄録）。", "fun": "「怪しいデータ」は、値が極端なものだけではありません。ばらつき方や偏り方がふだんと違うだけの場合もあります。この方法は平均だけでなく分布の形の変化も見て、しかも「どの項目が怪しいのか」を説明できるのが便利な点です。", "unverified": "既存手法との性能比較の具体的な数値は抄録からは確認できない。"}}, {"id": "pr38", "rank": 38, "headline": "信用スコアで非線形モデルは割に合うか", "title": "Does Nonlinearity Pay off? An Out-of-Sample Validation of the Flat Maximum Eect in Credit Scoring", "url": "https://doi.org/10.2139/ssrn.7607979", "authors": "Jacopo Giacomelli", "venue": "SSRN", "date": "2026-10-14", "apa": "Giacomelli, J. (2026). Does Nonlinearity Pay off? An Out-of-Sample Validation of the Flat Maximum Eect in Credit Scoring. https://doi.org/10.2139/ssrn.7607979", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "信用スコアリングで、多項式の交互作用や比率を大量に作る非線形モデルが、単純な線形モデルより本当に良いのかを8つのデータで検証した（抄録）。", "p3": "総当たりの特徴量拡張、二重のトーナメント式モデル選択、変数を15個に制限するPost-LASSOを組み合わせ、相関するROC曲線のDeLong検定で標本外予測を比べた。", "p5": "特徴量の整っていない小口の債権データでは拡張で改善したが、会計データに基づく企業のデータでは性能が下がることもあった。15変数の制約を課すと、非線形モデルの性能は単純な線形の主効果モデルに近づいた（抄録）。", "fun": "複雑なAIほど当たる、とは限りません。統計の世界には「いくつかの良い変数があれば、モデルの細かな形はあまり関係ない」という平らな最大値の効果が知られています。この研究はそれが成り立つ条件を、データの成熟度で切り分けたのが面白い点です。", "unverified": "8つのデータの具体名とAUCの差の大きさは抄録からは確認できない。"}}, {"id": "pr39", "rank": 39, "headline": "産業グラフを使った住宅ローン信用リスクの生存分析", "title": "Discrete-Time Survival Modelling with Dynamic Industrial Graphs for Mortgage Credit Risk", "url": "https://arxiv.org/abs/2610.18795", "authors": "Shiqi Fang", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "apa": "Fang, S. (2026). Discrete-Time Survival Modelling with Dynamic Industrial Graphs for Mortgage Credit Risk (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.18795", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "地理的に遠くても産業構成が似た地域どうしの住宅ローン延滞リスクのつながりを、毎年変わるグラフで表す離散時間生存モデルを提案した（抄録）。", "p3": "地域の産業構成の類似度で毎年グラフを作り直し、条件付き自己回帰過程と1次の自己回帰過程を組み合わせて、地域間の依存と時間的な持続を同時に表した。INLAで推定し、米国のローン単位データで評価した。", "p5": "動的なグラフのモデルは静的なグラフより標本内の当てはまりと標本外の判別力が良く、グラフによる地域間依存と時間的な持続が大きいことが推定された（抄録）。", "fun": "隣の町より、遠くても同じ産業で暮らす町のほうが、景気の波を一緒にかぶることがあります。この研究は「似た産業の町」を線で結んだ地図を毎年描き直し、ローンが返せなくなるリスクの広がりを捉えました。距離ではなく経済でつながる近所という見方が新鮮です。", "unverified": "判別力の改善幅の具体的な数値は抄録からは確認できない。"}}, {"id": "pr40", "rank": 40, "headline": "監査人の創造性は非定型の監査業務に役立つか", "title": "Creativity in Unstructured Audit Tasks: Benefit or Burden?", "url": "https://doi.org/10.2139/ssrn.7602078", "authors": "Martin Schmidt ほか", "venue": "SSRN", "date": "2026-10-14", "apa": "Schmidt, M., & Bonk, K. (2026). Creativity in Unstructured Audit Tasks: Benefit or Burden? https://doi.org/10.2139/ssrn.7602078", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "ドイツのBig4監査法人の監査人70人の実験で、生まれつきの創造性と促された創造性が、定型でない監査課題の成績にどう影響するかを調べた（抄録）。", "p3": "架空の顧客の継続企業の可能性を評価する情報探索の事例を課し、創造的性格尺度で特性創造性を測り、逆説的な枠付けのプロンプトで状態創造性を刺激した。", "p5": "予想に反して特性創造性が高いほど成績は低かった。予想どおり、創造性の刺激は特性創造性が高い監査人の成績を上げ、低い監査人の成績を下げた（抄録）。", "fun": "「創造的な人ほど良い監査をする」と思いがちですが、結果は逆でした。そして、発想を促す声かけは、もともと創造的な人には効き、そうでない人にはかえって逆効果でした。同じ働きかけが人によって正反対に作用するのが面白い点です。", "unverified": "成績の測り方と効果の大きさは抄録からは確認できない。"}}, {"id": "pr41", "rank": 41, "headline": "企業のAI導入：文献とドイツのイノベーション調査", "title": "AI Adoption by Firms: Insights from the Literature and the German Innovation Survey", "url": "https://doi.org/10.2139/ssrn.7609621", "authors": "Gastón P. Fernández ほか", "venue": "SSRN", "date": "2026-10-14", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "企業のAI導入に関する文献を概観し、ドイツのイノベーション調査の企業データで導入の特徴を調べた（抄録）。", "p3": "AI導入の要因、世界的な普及の傾向、自社開発と外部調達の違い、一般のAIと生成AIの違い、生産性への効果の研究を整理し、企業規模・年齢・研究開発集約度・人的資本・立地・戦略志向と導入段階・類型の関係を分析した。", "p5": "抄録には具体的な分析結果の数値は示されていない（抄録）。", "fun": "AIを使う会社と使わない会社の違いはどこにあるのでしょうか。大きさ、若さ、研究への投資、人材などで比べると、導入の段階や種類によって違いの出方が変わります。生成AIとそれ以前のAIで導入する会社の顔ぶれが違うのか、という問いが面白い点です。", "unverified": "ドイツ調査の分析結果の具体的な内容は抄録からは確認できない。"}}, {"id": "pr42", "rank": 42, "headline": "創業者の準備度と制度が中小企業の生成AI導入を左右", "title": "Founder Readiness and Institutional Fit: A Leadership-Contingent Model of Generative AI Adoption in Founder-Led SMEs in Switzerland and the United Kingdom", "url": "https://doi.org/10.20944/preprints202610.1325.v1", "authors": "Valeriia Yevsiukova", "venue": "Preprints.org", "date": "2026-10-14", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "創業者が経営する中小企業の生成AI導入を、創業者の準備度と国の制度の適合で説明する概念モデルを示した（抄録）。", "p3": "構造的・心理的な準備度と、外部専門知識の市場の厚さ、社内の権限委譲の規範、規制の明確さの3つの国の要因を組み合わせ、スイスと英国の4つの典型的な創業者像に当てはめた例示分析を行った。", "p5": "心理的準備度は乗数として働き、創業者の型によって有利な国が逆転した。規制差を除くと、学習志向と自己像の柔軟さの比が4対3を超えると英国が有利という閾値が導かれた（抄録）。", "fun": "同じ社長でも、国が違えばAI導入の得意不得意が入れ替わる、という主張です。外の専門家を雇いやすい国と、社内で任せる文化のある国では、合う社長のタイプが違うというのです。ただし実データではなく考え方の模型で、これから確かめる段階です。", "unverified": "実データによる検証はなく、4対3の閾値はモデルの仮定に依存する。"}}, {"id": "pr43", "rank": 43, "headline": "メール・チャット・通知の過多と認知的成果", "title": "Email, Instant Messaging, and Notification Overload: Assessing Their Effects on Workplace Cognitive Performance", "url": "https://doi.org/10.2139/ssrn.7601440", "authors": "Julius Berger ほか", "venue": "SSRN", "date": "2026-10-14", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を読んだ（叙述的レビュー）", "preprint": true, "short": true, "p1": "メール、チャット、通知の多さが職場での認知的な成果に与える影響を、認知心理学・HCI・組織行動の研究から叙述的に整理した（抄録）。", "p3": "注意の奪取、課題切り替え、注意の残り、中断からの回復、認知負荷、ストレスという仕組みに沿って研究を統合した。", "p5": "頻繁なメール確認はストレスを高めうる、チャットは課題の完了時間を延ばしうる、通知は操作しなくても注意を損ないうる、という知見をまとめ、まとめ送り・通知管理・集中時間の確保などを勧めた。研究の標本が小さく期間が短いことを限界とした（抄録）。", "fun": "スマホの通知は、見なくても鳴るだけで集中を乱すことがあるそうです。一方で、メールやチャットがなければ離れた人との仕事は回りません。悪者扱いするのではなく、どう付き合えば集中も協力も両立できるかを考える点が現実的です。", "unverified": "叙述的レビューで、効果量の統合的な推定は行われていない。"}}, {"id": "pr44", "rank": 44, "headline": "障害者包摂的な人事施策と職務well-being", "title": "Igniting the Light of Hope: How Disability-Inclusive HR Practices Enhance the Job Well-Being of Employees with Disabilities", "url": "https://doi.org/10.21203/rs.3.rs-10835607/v1", "authors": "Zonghua Liu ほか", "venue": "Research Square (In Review)", "date": "2026-10-14", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Square（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "障害者を包摂する人事施策が、障害のある従業員の職務well-beingを高める経路を検証した（抄録）。", "p3": "資源保存理論に基づき、仕事での活力（thriving）を媒介、組織的支援の知覚を調整とするモデルを、2時点の対応づけた調査（267人）で検証した。", "p5": "包摂的な人事施策は仕事での活力を通じて職務well-beingを高め、組織的支援の知覚がその関係と間接効果を強めた（抄録）。", "fun": "障害のある人が働きやすい制度を作っても、それだけで幸福感が上がるとは限りません。この研究は、制度が「仕事で伸びている実感」を生み、それが幸福感につながる道筋を示しました。会社が支えてくれていると感じられるかどうかで効き目が変わるのが要点です。", "unverified": "調査対象の国・業種と効果の大きさは抄録からは確認できない。"}}, {"id": "pr45", "rank": 45, "headline": "がん介護者の情報負担と精神的健康", "title": "Cancer Information Burden and Mental Health Among U.S. Cancer Caregivers: Evidence from the Health Information National Trends Survey", "url": "https://doi.org/10.20944/preprints202610.1242.v1", "authors": "Jingjing Gao", "venue": "Preprints.org", "date": "2026-10-14", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録を読んだ", "preprint": true, "short": true, "p1": "米国のがん患者の介護者で、がん情報を得て理解することの負担が精神的苦痛と関係することを全国調査で示した（抄録）。", "p3": "米国立がん研究所のHINTS第6・7回を統合し、情報の入手の手間・理解の難しさ・探索中の不満・質への懸念の4項目で負担を測り、PHQ-4の苦痛との関係を調査重み付き回帰で分析した。", "p5": "241人ががん介護者と特定され、完全な共変量の分析には124人が含まれた。未調整の分析で負担が高いほど苦痛が大きく（β=1.57、95%信頼区間0.17〜2.98）、調整後も統計的に有意だった（抄録）。", "fun": "家族ががんになると、治療や副作用について調べることが山ほど出てきます。情報を集めて理解するのが大変だと感じる人ほど、気持ちが落ち込みやすいという結果です。病気そのものだけでなく、「調べる苦労」も介護の負担の一部だという視点が大切です。", "unverified": "調整後の係数の値は抄録の取得範囲が途中で切れており確認できない。"}}, {"id": "pr46", "rank": 46, "headline": "タイの高齢うつ病者と家族介護者のケア経路", "title": "Navigating the Depression Care Network in Primary Health Care: A Qualitative Study of Older Adults with Depression and Family Caregivers in Thailand", "url": "https://doi.org/10.20944/preprints202610.1237.v1", "authors": "Sumuttana Kaewma ほか", "venue": "Preprints.org", "date": "2026-10-14", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録を読んだ", "preprint": true, "short": true, "p1": "タイのうつ病の高齢者と家族介護者が、プライマリ・ヘルスケアのうつ病監視網をどうたどるかを質的に描いた（抄録）。", "p3": "タイの6地域で、うつ病と診断された高齢者60人と家族介護者12人（計72人）に半構造化面接を行い、質的内容分析で整理した。", "p5": "高齢者は症状を体の不調や老化とみなし、介護者は引きこもりや機能低下で気づいた。村の保健ボランティアと看護師の検診で入口はできるが、相談時間の短さ・偏見・連絡の分断が壁となり、紹介の断絶で治療継続の負担が介護者に移っていた（抄録）。", "fun": "お年寄りが「最近元気がない」のを、本人は年のせいだと思い、家族は様子の変化で気づきます。村のボランティアの検診で入口はできても、病院どうしのつながりが切れると、結局は家族が支え続けることになります。制度の隙間を家族が埋めている構図がよく見えます。", "unverified": "地域による違いの詳細は抄録からは確認できない。"}}, {"id": "pr47", "rank": 47, "headline": "スマートシティ影響指数で都市成長要因を評価", "title": "Empirical assessment of urban growth factors associated with smart city development using a smart city impact index", "url": "https://doi.org/10.21203/rs.3.rs-11014259/v1", "authors": "Nenavath Madhu Naik ほか", "venue": "Research Square (In Review)", "date": "2026-10-14", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Research Square（Crossref登録）の抄録を読んだ", "preprint": true, "short": true, "p1": "インドのスマートシティ開発の良い影響と悪い影響を、環境・社会・ガバナンス・技術の指標からなる影響指数で評価した（抄録）。", "p3": "スマートシティの第1波（インフラ・治安・交通重視）、第2波（総合的な都市成長・管理）、非スマートシティの3群に指数を当てはめ、2022年と2023年の得点を比べた。", "p5": "第2波の都市が両年で最も高い順位だったが、第1波・第2波とも環境・社会・経済の次元では得点が低かった。平等と市民参加は向上した一方、透明性とプライバシーには否定的な認識が伴った（抄録）。", "fun": "「スマートシティ」と名乗れば暮らしが良くなるのでしょうか。インドの都市を比べると、総合的に進めた都市は評価が高い一方、環境や社会の面では課題が残りました。便利さと引き換えにプライバシーの不安が生まれる点は、どの国にも通じる問いです。", "unverified": "指数の重み付けと対象都市の数は抄録からは確認できない。"}}, {"id": "pr48", "rank": 48, "headline": "リアルタイム都市交通デジタルツインの通信", "title": "Semantic Edge-Cloud Communication for Real-Time Urban Traffic Digital Twins", "url": "https://arxiv.org/abs/2610.14187", "authors": "Murat Arda Onsu ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "監視カメラの映像をそのまま送らず、車の軌跡などの意味情報だけを送ることで、都市交通のデジタルツインを実時間で同期させる仕組みを示した（抄録）。", "p3": "エッジ側のAIで課題に必要な交通情報を抽出し、クラウドに送ってデジタルツインを再構成する意味的通信の枠組みを作った。", "p5": "伝送量を99%以上削減し、軌跡の再構成誤差は平均0.12 mだった（抄録）。", "fun": "街中のカメラの映像を全部送ると、回線がパンクしてしまいます。そこで「どの車がどこをどの速さで走ったか」だけを送れば、仮想の街をほぼ同じように動かせます。映像ではなく意味を送るという発想で、通信量を100分の1以下にしたのが面白い点です。", "unverified": "評価に使った交通場面の規模とカメラ台数は抄録からは確認できない。"}}, {"id": "pr49", "rank": 49, "headline": "AI対応の決済サービスの体験と顧客ロイヤルティ", "title": "Digital Payment Experience and Customer Loyalty Toward AI-Enabled Mastercard Services in Bangladesh", "url": "https://doi.org/10.20944/preprints202610.1296.v1", "authors": "Nusrat Jahan Mim ほか", "venue": "Preprints.org", "date": "2026-10-14", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録を読んだ", "preprint": true, "short": true, "p1": "バングラデシュのMastercard対応のAI決済サービスで、利用体験が顧客ロイヤルティにつながる経路を期待確認モデルで調べた（抄録）。", "p3": "385件の質問紙回答で、相対的優位性・期待される性能・取引の安全性・信頼から、満足と関係の質を経てロイヤルティに至るモデルを重回帰とブートストラップで検証した。", "p5": "体験の変数はロイヤルティの分散の21.1%を説明し、満足と関係の質を加えると24.7%になった。期待される性能が最も強い予測子（β=.207）だった。ただし3項目尺度の内的一貫性は.375〜.512と低く、著者も探索的な結果と位置づけている（抄録）。", "fun": "支払いアプリを使い続けるかどうかは、最初に選んだ理由より、使ってみて期待どおりだったかで決まる、という考え方です。この研究は、測定の物差しの信頼性が低いことを自ら認め、結果を控えめに扱っています。結果の弱さを隠さない姿勢も参考になります。", "unverified": "尺度の信頼性が低く、結果の妥当性は確認できない。"}}, {"id": "pr50", "rank": 50, "headline": "LLMはファイナンス・会計の査読をどこまでできるか", "title": "How Well Do LLMs Perform in Peer Review? Evidence from Finance and Accounting", "url": "https://arxiv.org/abs/2610.18435", "authors": "Hai Lu ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "LLMが論文の査読のどの部分をこなせるかを、ファイナンスの学会報告論文のその後の掲載結果で検証した（抄録）。", "p3": "学習データが2024年の学会シーズン前で終わるGPT-4oに、2024年のAFAとNBERのファイナンス会合の論文を査読させ、その後2年間の上位3誌への掲載と比べた。", "p5": "モデルの評価が1標準偏差高い論文は、著者の評判を考慮しても掲載確率が44%高かった。情報は正しさと説明の判断から来ており、独創性と重要性の判断は情報を持たなかった。この区別は会計論文とGPT-5でも成り立った（抄録）。", "fun": "AIは論文が「正しく書けているか」は見抜けても、「大事な発見か」は判断できないという結果です。将来の掲載結果をAIが知らないことを確かめたうえでの検証なので説得力があります。技術的な確認はAIに、価値の判断は人に、という分担の提案が分かりやすい点です。", "unverified": "査読に使ったプロンプトの詳細と論文数は抄録からは確認できない。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "拡散言語モデルの事前学習は思ったより安い", "title": "Revisiting the 16x Pretraining Compute Gap between Diffusion and Autoregressive Language Models", "url": "https://arxiv.org/abs/2610.17590", "authors": "Guanghan Wang ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "why": "広く引用された16倍の計算量差を、評価法と学習法の見直しで大きく縮めた。約1,700モデルの系統的な実験で、拡散型言語モデルの実用性の前提を変えうる。"}, {"id": "pn02", "rank": 2, "field": "因果推論", "headline": "連続処置の差の差分法で利得による選別を測る", "title": "Measuring Selection on Gains in Difference-in-Differences with a Continuous Treatment", "url": "https://doi.org/10.2139/ssrn.7609700", "authors": "Parush Arora", "venue": "SSRN", "date": "2026-10-14", "why": "連続的な処置量の差の差分法で、傾向の差と利得による選別を分けて境界を与える。チャイナショックへの適用で、標準的な推定の解釈を見直す道具になる。"}, {"id": "pn03", "rank": 3, "field": "因果推論", "headline": "繰り返し横断データでのイベントスタディの基礎", "title": "Pseudo-Panel Event Studies: Econometric Foundations for Credible Applications", "url": "https://arxiv.org/abs/2610.16754", "authors": "Dongwoo Kim", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "why": "擬似パネルのイベントスタディの識別条件と推論を整備した。実パネルとの比較で妥当性を示し、横断調査しかない政策評価の標準手法になりうる。"}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "AIが労働者として応募・採用される労働市場", "title": "Displacement Is Endogenous: AI Workers in a Search-and-Matching Labor Market", "url": "https://arxiv.org/abs/2610.14850", "authors": "Ibrahim Denis Fofanah (Pace University ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "why": "AIを求職者としてサーチ・マッチングモデルに入れ、解雇と採用減の経路を分けた。価格差が大きいほど企業拡大で失業が減るという非自明な結果を示す。"}, {"id": "pn05", "rank": 5, "field": "組織行動・心理的安全性", "headline": "上司の残業要求スタイルは部下に受け継がれる", "title": "The Reproduction of Managerial Styles in an Internal Labor Market", "url": "https://doi.org/10.2139/ssrn.7608640", "authors": "Yusuke Makino ほか", "venue": "SSRN", "date": "2026-10-14", "why": "日本の大企業の人事記録で、管理職の残業要求の型が元上司から学ばれ、配置で固定されることを示した。組織文化の再生産を実データで捉えた。"}, {"id": "pn06", "rank": 6, "field": "統計学", "headline": "再現性を一つのベイズ枠組みで定量化する", "title": "The Quantification of Replicability", "url": "https://arxiv.org/abs/2610.14407", "authors": "Ester Alongi ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "why": "成功・失敗の二値判定に代わり、研究間の一致や共通効果との整合を事後確率で測る枠組み。再現性研究の評価基準を統一しうる。"}, {"id": "pn07", "rank": 7, "field": "統計学", "headline": "高次元線形モデルで制約数に適応する正直な検定", "title": "Honest Inference for High-Dimensional Linear Models", "url": "https://arxiv.org/abs/2610.16503", "authors": "Dennis Lim ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "why": "制約の数が固定でも発散してもよい頑健な検定を提案した。脱スパース化LASSOに基づき、高次元回帰での多重制約検定のサイズを改善する。"}, {"id": "pn08", "rank": 8, "field": "機械学習", "headline": "自己蒸留の推論改善は本物か", "title": "Does self-distillation improve reasoning?", "url": "https://arxiv.org/abs/2610.18613", "authors": "Jason Ken Adhinarta ほか", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "why": "話題の自己蒸留法の利得が未知問題に一般化せず、過学習などで説明されることを示した。手法の評価の見直しを迫る重要な追試。"}, {"id": "pn09", "rank": 9, "field": "教育", "headline": "エリート理系入試の男女差は受験準備環境で生じる", "title": "Gender Gap in High-stakes Exams: What Role for Exam Preparation?&nbsp;", "url": "https://doi.org/10.2139/ssrn.7606381", "authors": "Cecile Bonneau ほか", "venue": "SSRN", "date": "2026-10-14", "why": "フランスのエリート理系課程のデータで、選抜性の高い準備課程ほど男性が伸びることを準実験的に示した。上位職の男女格差の源を探る。"}, {"id": "pn10", "rank": 10, "field": "因果推論", "headline": "社会的つながりが交絡するネットワークでの処置効果", "title": "Identification and Estimation of Treatment Effects from Network Data with Confounded Social Links", "url": "https://arxiv.org/abs/2610.14527", "authors": "Licheng Liu", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "why": "処置採用とつながり形成が同じ要因に依存する場合の一般化傾向スコアを提案。ネットワークを周辺化した推定対象を定義し直した。"}, {"id": "pn11", "rank": 11, "field": "経営学", "headline": "予測市場の保有ポジション開示は影響力を生むが情報は増えない", "title": "Show Me Your Bet: Position Disclosure, Market Influence, and Strategic Communication", "url": "https://doi.org/10.2139/ssrn.7604779", "authors": "Yilan Li ほか", "venue": "SSRN", "date": "2026-10-14", "why": "Polymarketの規則変更を使い、ポジション開示が大口の発言の影響力を高める一方で予測精度は上げないことを示した。透明性規制の副作用を示す。"}, {"id": "pn12", "rank": 12, "field": "経済学", "headline": "多数の同時決定における不確実性の定量化", "title": "Uncertainty in Compound Decisions", "url": "https://arxiv.org/abs/2610.15672", "authors": "Andreas Petrou-Zeniou", "venue": "arXiv", "date": "Wed, 14 Oct 2026", "why": "経験ベイズ的な多数単位の決定で、効果分布が未知であることの不確実性を扱う推論を提案した。政策の対象選定などに広く関わる。"}, {"id": "pn13", "rank": 13, "field": "統計学", "headline": "側情報で較正するコンフォーマル予測", "title": "Moment-Calibrated Conformal Prediction with Side     "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
