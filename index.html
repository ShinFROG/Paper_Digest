<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

成のばらつきは人の残差の12.0%だった（§5.8）。", "p6": "著者が挙げる限界は、単一の調査回・15設問であること、プロンプトが英語のみで属性の提示順も固定だったこと、繰り返し生成の検証がGPT-5-miniだけであること、API経由のモデルは将来変わりうることである（§8.12）。解釈：2モデルの結果であり、他のモデルへの一般化は未検証。", "fun": "年代や職業、価値観が同じ人でも、実際の意見は人によってかなり違う。ところがAIにそのプロフィールを渡して答えさせると、プロフィールから予想できる「いかにもな答え」ばかりが返ってくる。人の回答ではプロフィールで説明できるのは2割ほどなのに、AIでは5〜6割にもなった。AIは人ではなく、肩書きに答えているというわけだ。", "unverified": "§3.4〜3.6の設問別・属性別の内訳、§6のマスキング実験の詳細、付録は読んでいない。上位3属性を隠すと説明分散が約半分になるという結果は、§1.8と§6.8の要約の記述による。"}}, {"id": "pr02", "rank": 2, "headline": "会計データの複雑さは60年で約6倍に増えた", "title": "The Intrinsic Complexity of Accounting Data", "url": "https://doi.org/10.2139/ssrn.7720978", "authors": "Paul G. Geertsema ほか", "venue": "SSRN", "date": "2026-11-23", "apa": "Geertsema, P. G., Lu, H., & Ma, G. (2026). The Intrinsic Complexity of Accounting Data. https://doi.org/10.2139/ssrn.7720978", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "会計データの「内在的な複雑さ」を、データを少ない数値に圧縮したときにどれだけ情報が失われるかで測る指標を作り、米国企業の会計データの複雑さが1963年から2024年の間に約6倍になったことを示した（抄録）。", "p2": "抄録は、複雑さを圧縮への抵抗として操作的に定義し、あらかじめ定めた妥当性の公理から指標を一意に導く点を新しさとして示す。従来の複雑さの指標との比較は抄録にはない（未確認）。", "p3": "会計項目をより少ない数の値に圧縮し、復元したときに残る損失を測る。圧縮後の値の数を変えて繰り返すと圧縮と損失の曲線が得られ、公理から導かれる唯一のスカラーの指標はこの曲線の平均である（抄録）。例：30項目を少数の値で表しても元にほぼ戻せるなら、複雑さは低い。", "p4": "Compustatの30項目（1963〜2024年）に適用し、産業内と産業間、新しく加わった企業と1963年からいる企業、世界の主要地域（1995〜2024年）、会計基準の導入との関係で比べた。外部の妥当性は、アナリスト予想の誤差とばらつきで確かめた（抄録）。", "p5": "複雑さは期間中に約6倍に上がり、上昇の大半は産業内で起きた。米国だけでなく世界の全ての主要地域で上昇した。米国の主要な基準やIFRSの採用は、主な要因として支持されなかった。圧縮しにくい企業・年ほど、アナリスト予想の誤差が大きく、予想のばらつきも大きい（抄録）。", "p6": "抄録の範囲では、圧縮の具体的な方法、公理の内容、上昇の原因は分からない。解釈：基準が主因でないなら事業や取引の変化が候補になるが、抄録はそこまで述べていない。", "fun": "写真は、単純な絵柄ほど小さなファイルに圧縮でき、ごちゃごちゃした絵柄ほど圧縮しにくい。この研究は同じ考えを会社の決算の数字に当てはめた。少ない数字にまとめても元に戻せるなら単純、戻せないなら複雑というわけだ。そうして測ると、会社の決算は1963年から2024年の間に約6倍も複雑になっていた。しかも主な原因は会計のルールの変更ではなさそうだという。", "unverified": "本文は入手できず、圧縮の方法、公理の中身、図表、頑健性の確認は未確認。数値は抄録の記載のみ。"}}, {"id": "pr03", "rank": 3, "headline": "橋梁点群の機種間適応は元モデルの収束度に左右される", "title": "Rethinking Cross-Sensor Domain Adaptation for Bridge Point Cloud Semantic Segmentation", "url": "https://arxiv.org/abs/2611.27060", "authors": "Linghui Huang ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Huang, L., Wang, Z., Chen, S., Guan, P., Wang, J., Li, S., & Yang, L. (2026). Rethinking Cross-Sensor Domain Adaptation for Bridge Point Cloud Semantic Segmentation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27060", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（実験設定の§3、要因分析の§4の冒頭、結果・考察・限界・結論の§5〜§8）を読んだ", "preprint": true, "p1": "地上型レーザー（TLS）で学習した橋梁点群の部位分類モデルを移動型レーザー（MLS）に適用するときの精度低下について、原因とされてきた要因を1つずつ検証し、領域適応の効果は元のモデルの学習の収束度と評価のばらつきに左右されることを示した（§8）。", "p2": "センサーが変わると点の密度・表面の粗さ・色・視点が変わるため、領域適応（domain adaptation）で補うのが定番だが、どの違いが実際に効いているのか、適応の利得が本物なのかは確かめられていなかった（§1、§7.1）。", "p3": "公開ベンチマークSemanticBridge（英独の20橋、うち7橋にMLSあり）の公式の分割を使い、8 cmのボクセルに量子化した疎な畳み込みU-Net 1つに固定して、点群の統計と入力の人為的な摂動から各要因の影響を測る。学習は100エポックと300エポックの2つの減衰スケジュールで比べる（§3.1〜3.3）。", "p4": "指標は9クラスの平均IoU（mIoU）。対象領域のラベルはモデルの選択に使わず、同じチェックポイントの繰り返し評価と乱数種の違いによるばらつきも測って、手法間の差と比べる（§3.3、§6.1）。", "p5": "前処理後のTLSとMLSの最近傍間隔の中央値の差は0.06 mmで、色を消してもmIoUの変化は0.1ポイント未満。300エポックの元領域のみのモデルは57.72（表6）。自己学習は100エポックの基準を3.24ポイント上回るが、収束したモデルから始めると−0.97になった（§5.3）。乱数種によるばらつきは1.88ポイント（§6.1）。", "p6": "著者の限界は、ベンチマーク1つ・骨格のネットワーク1つ・8 cmのボクセルに限った結果であること（§7.2）。300エポックの結果は乱数種1つで、擬似ラベルの正しさは直接測っていない（§5.3、§6.1）。", "fun": "橋をレーザーでスキャンして、橋桁や橋脚を自動で見分けるAIがある。据え置き型の装置のデータで学ばせたAIを、手持ち型の装置のデータに使うと成績が落ちる。それを直す工夫がいろいろ提案されているが、この研究は「元のAIの学習が足りていなかっただけでは」と疑った。十分に学習させてから比べると、工夫の効果は消えてしまった。比べる前に土台をそろえる大切さが分かる。", "unverified": "表3〜表10の個々の数値と図の詳細は一部しか確認していない。既発表の他の骨格との比較の数値は未確認。"}}, {"id": "pr04", "rank": 4, "headline": "カルマンフィルタでダムの計測信号を自動分析", "title": "Kalman-based approach towards automatic analysis of monitoring signals for a concrete dam in industrial use", "url": "https://doi.org/10.1109/MED70602.2026.11598203", "authors": "Ana Pavanelli ほか", "venue": "HAL", "date": "2026-11-22", "apa": "Pavanelli, A. L. L., Besançon, G., & Robbe, E. (2026). Kalman-based approach towards automatic analysis of monitoring signals for a concrete dam in industrial use. 2026 34th Mediterranean Conference on Control and Automation (MED), 320–325. https://doi.org/10.1109/med70602.2026.11598203", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlexに登録された抄録を使用（HALに登録された会議論文で、IEEEのDOIがある）", "preprint": false, "p1": "水力発電用のコンクリートダムの変位などの計測値を、カルマンフィルタで自動的に分析する方法を示した。水位・季節・温度・時間の影響を分けて推定し、時間の影響を元に戻る部分と戻らない部分に分解する（抄録）。", "p2": "ダムの監視では、計測値を水位・季節・時間の効果に分ける統計モデル（HST）が標準的に使われる。抄録は、これにカルマンフィルタを適用した最近の研究を、温度の効果を加えたモデルに拡張することを課題としている（抄録。従来法の不足点の詳細は未確認）。", "p3": "入力は構造物の水平変位などの監視の計測値。水位・季節・温度・時間の統計モデルにカルマンフィルタを当てはめて現象を推定し、同時にパラメータを全て較正する。さらに時間の効果の成分を、可逆な部分と不可逆な部分に分解して自動の分析に使う（抄録）。", "p4": "実際の監視データに適用した結果で手法を示したとあるが、比較対象や評価指標は抄録に書かれていない（未確認）。", "p5": "実データへの適用の結果が示されたと述べるのみで、数値は抄録にない（未確認）。", "p6": "抄録の範囲では、対象のダム、データの期間、誤差の評価、他の方法との比較は分からない。解釈：不可逆な成分は構造の変化の手がかりになりうるが、抄録はそこまで明言していない。", "fun": "ダムは、たまった水の量、季節、温度によって、わずかに動いたり戻ったりを繰り返している。その動きの中から、元に戻る分と、もう元に戻らない分を見分けられれば、監視の役に立つ。この研究は、カルマンフィルタという逐次的な推定の計算で、その仕分けを自動で行おうとしている。計測の数字を、原因ごとの成分に分けて読むという考え方が面白い。", "unverified": "本文は入手できず、モデルの式、対象のダム、結果の数値はすべて未確認。"}}, {"id": "pr05", "rank": 5, "headline": "1時点32点の観測から地すべりの流下全体を復元", "title": "Spatiotemporal Landslide Runout Reconstruction from Sparse Observations with LAPIS-SHRED", "url": "https://arxiv.org/abs/2611.27132", "authors": "Xingyue Zhang ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Zhang, X., Bao, Y., Keck, J., Istanbulluoglu, E., & Kutz, J. N. (2026). Spatiotemporal Landslide Runout Reconstruction from Sparse Observations with LAPIS-SHRED (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27132", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（データ生成の§2.2、問題設定と手順の§3.1・§3.3、結果の§4.1と§4.4、限界の§5.3）を読んだ", "preprint": true, "p1": "地すべりの土砂の流下が時間と空間でどう進んだかを、崩壊後の1時点・32点の観測だけから丸ごと復元できる枠組みを示した。途中の流れが観測されないという現場の制約のもとで、過去の経過の復元と先の予測の両方を扱う（抄録、§3.1）。", "p2": "流下の過程が直接観測されることはまれで、手に入るのは事後の堆積の地形か、短い監視の記録に限られる。物理モデルの較正は多数の順計算を要する（§1、§4.4）。", "p3": "物理に基づく流下モデル（MWR）のパラメータを振った集合計算を学習データにし、疎なセンサーの値から全場を復元するSHRED（浅い再帰デコーダ）と、潜在空間で時間をさかのぼる・進めるモデルを組み合わせる。終端の観測を潜在変数に符号化し、過去の潜在軌道を生成して復号する（§3.1、§3.3）。", "p4": "米国セントヘレンズ山近くの2009年と2022年の2つの地すべりを対象に、学習に含めないパラメータの模擬を正解として、正規化RMSE（NRMSE）と構造類似度（SSIM）で評価し、全時刻の観測を使えるSHREDの上限などと比べる。実際のLiDARによる堆積とも照合する（§4.1、§4.4）。", "p5": "2009年の4つのシナリオと2つの推論方式の全てでNRMSEは5.8%未満、SSIMは0.961超（表2）。2022年の事象では終端の観測だけでRMSE 1.065 m（上限は0.867 m）（表3）。実際の堆積との空間相関は0.843で、較正した物理モデルの0.853に近い（抄録）。", "p6": "著者の限界は、評価の大半が同じ物理モデルの模擬に対するもので、間隙水圧や3次元の流れなど表されていない過程があること、崩壊の範囲・深さ・継続時間を既知としていること、不確実性を出さない点推定であること（§5.3）。", "fun": "山が崩れて土砂が流れ下る最中を測れることはほとんどない。あとに残るのは、どこが削れてどこに積もったかという結果だけだ。この研究は、物理の計算で作ったたくさんの崩れ方をAIに学ばせておき、結果の地形の32か所の値だけから、途中の流れ方を巻き戻すように再現した。あとに残った現場から経過を推理する探偵のような仕事だ。", "unverified": "付録（学習の設定、シナリオ別の図）と§4.2〜4.3の比較・感度分析の数値は読んでいない。"}}, {"id": "pr06", "rank": 6, "headline": "非対称な役割の討論で検証の自己批判バイアスを抑制", "title": "Beyond Self-Critique: Epistemic Convergence Control for Multi-Agent Research Verification", "url": "https://arxiv.org/abs/2611.27839", "authors": "Chrisantus Eze", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Eze, C. (2026). Beyond Self-Critique: Epistemic Convergence Control for Multi-Agent Research Verification (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27839", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、システム構成の§3、実験設定の§4、結果の§5.1〜5.3と表1〜3）を読んだ", "preprint": true, "p1": "同じ基盤モデルから作った複数エージェントの討論が自己批判の焼き直しになりがちな問題に対し、役割を非対称にし、信念の変化量で止め時を決め、主張を文献の原文の断片に結びつける検証システムVerifyAgentを示した（§1、§3）。", "p2": "多エージェント討論は、擁護役と懐疑役が同じ重みのモデルから作られると同じ表現空間から議論が出て、形だけの合意に流れやすい。また固定回数の反復は、早すぎる打ち切りか計算の無駄を生む（§1）。", "p3": "仮説から文献を検索し、主張・状態（支持・係争・反証・不明）・証拠の組からなる信念状態を作る。擁護役と懐疑役は逆向きの指示で互いの文脈なしに別々に推論し、裁定役が状態を更新する。状態か確信度が変わった項目の割合が0.10未満になったら停止する（§3.2〜3.4）。", "p4": "LLMの推論と多エージェント協調に関する40の研究仮説で、deepseek-r1:32bを使い、対称な討論（MAD）、Self-Refine、固定回数の反復などと計200回の実行で比べる。指標は役割間の埋め込みの類似度、係争とされた主張の割合、過剰な反復の割合、NLIによる幻覚率（§4）。", "p5": "役割の類似度は0.852で、対称な討論の0.918より低く、係争の主張は22.0%対15.4%だった（表1）。変化量による停止は過剰な反復を0.0%にし（固定3回は62.5%）、固定3回はLLMの呼び出しが2.4倍多かった（表2）。幻覚率は21.7%対25.9%で有意差はない（p=0.613、表3）。", "p6": "40回のうち36回は1巡目で変化量が0になり、これは模擬の明確化の応答が新しい情報を持たなかったためと著者が述べる（§5.2）。異種モデルによる討論や他の停止法とは比べていない（§2）。解釈：変化量は言い換えられた主張を別物として扱うので、変化を小さく見積もりうる（§3.4の記述による）。", "fun": "1人で賛成役と反対役を演じ分けて議論しても、結局は自分の考えをなぞるだけになりやすい。同じAIを何体も並べた討論にも同じ弱点がある。この研究は、賛成役と反対役に正反対の使命を与え、互いの発言を見せずに別々に考えさせた。さらに「まだ意見が動いているか」を数で測って、動かなくなったら止める。議論のやめ時を数字で決める発想が面白い。", "unverified": "結果のあとの考察・限界の節は読み切れていない。40の仮説の具体的な内容と、役割崩壊の検出が発動した回数は未確認。"}}, {"id": "pr07", "rank": 7, "headline": "LLMの決算説明は正しい数字に根拠のない評価を足す", "title": "Right Numbers, Wrong Story: When LLMs Narrate Financial Changes Beyond Their Inputs", "url": "https://arxiv.org/abs/2611.26968", "authors": "Seunghan Lee ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Lee, S., Seo, J., Kang, J., Lee, J., Han, S., Yoo, S., Kim, M., Lim, T. Y., Kang, D., Choi, H., Lee, S., & Ahn, W. (2026). Right Numbers, Wrong Story: When LLMs Narrate Financial Changes Beyond Their Inputs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26968", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（手法の§3、実験設定と主要結果の§4.1〜4.2、結論、限界の節）を読んだ。付録は読んでいない", "preprint": true, "p1": "LLMが下書きした決算の説明文は、数字が全て正しくても、入力にない評価の言葉や原因を付け足す。この「根拠のない枠づけ」を、10-Kの書き手の言葉の使い方を基準に検出し、モデルを呼ばずに規則で取り除く部品FrameCheckを作った（§1、§3）。", "p2": "数字が正しいまま判断や原因が付け加わる問題は見過ごされやすい。言葉の使い分けをプロンプトで教える対策は、かえって判断の言葉を増やしてしまう（§4.2）。", "p3": "10-KのMD&Aから変化を述べる文を集め、程度を表す語ごとに、書き手がその語を使う変化の大きさの範囲（10〜90パーセンタイル）を使用規範とする。下書きの前に同じ向き・近い大きさの10-Kの文を6つ見せ、規範から外れた語と入力にない原因の節に印を付け、規則で削るか言い換える（§3.1〜3.4）。", "p4": "6系統17の公開LLMが、勘定科目・年度・増減率だけから1文を書く課題を中心に、980の変化について各4回下書きした。判断の語を使う割合を書き手と比べ、入力にない原因の割合、数字の保持、両者をまとめたGapで評価する（§4.1）。", "p5": "素の下書きは変化の17.2%に判断の語を付け（書き手は1.5%）、77.0%が入力にない原因を加えた（表2）。語の範囲を列挙するプロンプトは判断の割合を最大80.0%に上げた。FrameCheckは判断1.0%、根拠のない原因0.4%、Gap 1.1で最小だった（§4.2）。", "p6": "著者の限界は、規範が読み手の受け取り方ではなく書き手の使い方であること、原因の検出が接続語の一覧に頼ること、読み手役と正解ラベルがすべてLLMであること、米国の英語の10-Kに限ること（Limitationsの節）。", "fun": "「売上は3%増えた」と「売上は3%も急増した」は、数字は同じでも印象がまるで違う。AIに決算の文章を書かせると、数字は正確なのに、こうした大げさな言葉や、頼んでいない理由を勝手に足してしまう。面白いのは、言葉の使い方を丁寧に教えるほどAIはかえって使いたがる点で、教えるより後から機械的に削るほうが効いた。", "unverified": "付録（抽出の精度、原因の検出の検証、模擬の読み手の調査）は読んでいない。抄録にある下書きの総数の内訳は未確認。"}}, {"id": "pr08", "rank": 8, "headline": "満期保有の会計は損失の認識を遅らせ連鎖破綻を増幅", "title": "Held-to-Maturity Accounting: Hidden Losses and Systemic Fragility", "url": "https://arxiv.org/abs/2611.26700", "authors": "Dongxu Li ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Li, D., & Yang, S. Y. (2026). Held-to-Maturity Accounting: Hidden Losses and Systemic Fragility (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26700", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（モデルの§4の前半、較正の§5.1、結果の§6.1〜6.5、結論の§8）を読んだ", "preprint": true, "p1": "満期保有（HTM）の会計処理が、金利上昇時の含み損の認識を遅らせることで、銀行システム全体の破綻の連鎖を大きくしうることを、銀行間ネットワークのモデルで示した（§1、§8）。", "p2": "最近の金融引き締めで銀行に含み損が積み上がったが、会計処理による不透明さが、資産の共通性と銀行間のつながりを通じてシステミックリスクにどう効くかは、まとめて分析されていなかった（§1、§3）。", "p3": "100の銀行が、互いに相関した金利感応資産を持ち、借り手の側から貸し手を選ぶことで内生的に銀行間ネットワークを作るモデル。資産収益の相関、損失を認識する時期（1期にまとめるか複数期に分けるか）、ネットワークを通じた債務不履行の連鎖を組み込み、模擬実験で破綻の数を数える（§4、§5.1、§6.1）。", "p4": "米国の銀行の貸借対照表の特徴（有価証券やHTMの比率、預金への依存）に合わせて較正し、相関の水準、損失認識の時期、ショックの回数を変えた設定ごとに、破綻する銀行の平均数を比べる（§5、§6.1）。", "p5": "資産収益の相関を0.8から0.9に上げると、平均の破綻数は約12から58超へ跳ね上がった（§6.2）。同じ損失を1期にまとめて実現すると破綻は約12.03、2期に分けると1.68、3期では0.08になり、認識の集中が破綻を増やす（§6.3）。破綻はつながりの多い中核の銀行に集中した（§6.4）。", "p6": "様式化したモデルの模擬実験で、実際の破綻データへの当てはめではない。解釈：損失を分けて認識するほうが安全という結果は、このモデルの仮定のもとでのものである。著者による限界の節は確認できなかった。", "fun": "銀行が満期まで持つつもりの債券は、値下がりしても帳簿の上では損を計上しなくてよい。一見安心に思えるが、見えない損は静かに積み上がり、資金繰りに困って売らざるをえなくなると一気に表に出る。しかも多くの銀行が似た資産を持っていると、損が同時に出て、貸し借りのつながりを伝って破綻が連鎖する。損を少しずつ認めるほうが全体は安全だという結果が面白い。", "unverified": "§2の実証的な事実、§5.2の検証、§7の政策的な含意は読んでいない。表の数値は本文の記述から取り、表そのものの読み取りは未確認。"}}, {"id": "pr09", "rank": 9, "headline": "エネルギー保存を課したベイズ縮約モデルで発散を防ぐ", "title": "Energy-preserving Bayesian model reduction: closed-form structured posteriors and probabilistic stability certificates for quadratic operator inference", "url": "https://arxiv.org/abs/2611.27794", "authors": "Jo\\~ao Victor Galv\\~ao da Mata ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "da Mata, J. V. G., & Guo, M. (2026). Energy-preserving Bayesian model reduction: closed-form structured posteriors and probabilistic stability certificates for quadratic operator inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27794", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（抄録、序論の貢献、数値実験の設定、結論と限界）を読んだ。理論の節の証明と付録は読んでいない", "preprint": true, "p1": "データから学ぶ縮約モデル（作用素推論）のベイズ版で、エネルギー保存という物理の性質を事後分布に厳密に組み込み、「このモデルは有界にとどまる」と言える確率を計算できるようにした（抄録）。", "p2": "ベイズ作用素推論は、縮約した作用素のガウス事後分布を閉じた形で返すが、制約がないので発散する力学を持つ作用素にも正の確率を与えてしまう。現状は、少数の標本を有限時間だけ積分して確かめるしかなかった（抄録）。", "p3": "2次の作用素のエネルギー保存は、係数についての線形の等式制約になる。線形の制約はガウス分布がそのまま取り込めるので、制約つきの事後分布は制約なしの事後分布にカルマン型の更新を1回かけるだけで得られ、標本も同じ補正で厳密に作れる（theorem 4.6）。この構造のもとで、大域的な有界性は線形作用素の対称部分についての行列の条件に帰着する（抄録）。", "p4": "強制つき粘性バーガース方程式、KdV方程式、2次元の粘性バーガース方程式の3題で、制約なしのGP-BayesOpInfを基準に、事後分布から引いた標本が最終時刻まで積分できるか、観測の窓の外と学習に使わないパラメータ値での予測誤差、認証つきの安定性の確率を比べる（数値実験の節）。", "p5": "制約つきの標本は3題すべてで、全てのパラメータ値について最終時刻まで安定に積分できたが、基準は最大で全ての標本を失った。認証は問題1で標本の95%（確率の推定値0.9533）、問題3で全てについて成り立ち、KdVでは歪対称の制約が予測誤差をほぼ半分にした（結論の節）。", "p6": "著者の限界：認証は十分条件で必要条件ではなく、認証されるものが物理的なエネルギーとは限らない。制約はエネルギーを保存する系のためのものである（結論の節の限界a・b）。各設定は乱数種1つでの結果である（数値実験の節）。", "fun": "複雑な流れの計算を、少ない変数の小さなモデルに置き換えて速くする技術がある。困るのは、データから作った小さなモデルが、計算を進めるうちに値が際限なく大きくなって壊れてしまうことだ。この研究は、エネルギー保存という物理の性質を、モデルの作り方そのものに数学的に織り込んだ。すると、作ったモデルが壊れない確率まで計算できるようになった。", "unverified": "定理の証明と付録、各問題の誤差の表の数値は読んでいない。3つ目の問題の詳細な設定は未確認。"}}, {"id": "pr10", "rank": 10, "headline": "上位エージェントは部下の報告を吟味せず多数に従う", "title": "Do Senior Agents Do Their Job? Measuring Role Integrity in How LLM Agents Use Subordinate Material", "url": "https://arxiv.org/abs/2611.27139", "authors": "Jinxiang Xie ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Xie, J., Zhang, X., Jiang, C., Liu, K., Yang, Q., & Su, Y. (2026). Do Senior Agents Do Their Job? Measuring Role Integrity in How LLM Agents Use Subordinate Material (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27139", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（枠組みの§2、実験設定の§3、結果の§4.2、限界と結論の§6の一部）を読んだ", "preprint": true, "p1": "複数のLLMエージェントの階層で、部下の報告をまとめる上位エージェントが役割どおりの務め（吟味する・検証する・伝える）を果たしているかを、最終回答の正しさではなく、部下の資料を操作したときの反応から測るベンチマークRI-Benchを作った（抄録、§2）。", "p2": "多くの評価は最終回答だけを採点するが、流暢でよく引用された回答でも、上位エージェントが部下の報告を吟味したのか、単に寄せ集めたのかは分からない（抄録、§1）。", "p3": "役割の完全性（role integrity）を、部下の資料に対して行動するときに役割の責務が保たれていることと定義する。査読、上訴審、議会の調査の3つの制度を模し、一般的な査読の多数派を作る、手続き上の誤った事実を仕込む、証人が付けた限定を添えるといった操作への出力の反応を、規則と、人の注釈で較正したLLM審査員で読む（§2.1〜2.2、§3）。", "p4": "8つのLLMが上位エージェントを務め、ICLRの投稿、最高裁の120件、議会の調査120件から、全12,392エピソードを実行した。指標は、多数派に従った決定の割合、仕込んだ誤りを事実として述べた判決の割合、限定を両方落とした引用の割合である（§2.1、§3）。", "p5": "仕込んだ手続き上の誤りを採用した判決は3,832件中111件（2.9%）と少なかった（§4.2）。一方、一般的な査読の多数派に従った決定は最大71%、証人の限定を落とした引用は最大65%に達した。責務を明示するプロンプトは失敗を減らすが、なくせない（抄録）。", "p6": "著者の限界として、指標は測った3つの失敗の回避をまとめたもので役割が果たされたことの証明ではないこと、人の注釈者どうしの一致が法廷の課題ではわずかであること、比較したモデルが少ないことが挙げられている（§2.1、§6）。", "fun": "会議のまとめ役は、部下の報告をただ足し合わせるのではなく、中身を見比べて判断するのが仕事だ。AIを上位の役にして確かめると、はっきりした事実の誤りにはほとんど引っかからないのに、一般的な内容の意見でも数が多いほうに流され、証言に付いていた限定を落として伝えてしまうことが多かった。答えが立派に見えても、役目を果たしたとは限らない。", "unverified": "§4.1と§4.3の結果の表、モデル別の内訳、§4.4〜4.6（人による評価、別の実行環境での比較）は読んでいない。71%と65%は抄録の記載による。"}}, {"id": "pr11", "rank": 11, "headline": "同じ出所の報告の二重計上を厳密な事後確率で測る", "title": "Double counting in LLM evidence fusion: exact posteriors separate rule compliance from posterior gain", "url": "https://arxiv.org/abs/2611.27138", "authors": "Tengfei Shao ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Shao, T., Rezaei, A., & Kamali, A. R. (2026). Double counting in LLM evidence fusion: exact posteriors separate rule compliance from posterior gain (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27138", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（3節の設定と規則、6.1〜6.2の主要結果、図2の説明）を読んだ。約18万字と長く、考察と補足資料は読んでいない", "preprint": true, "p1": "複数の報告をLLMがまとめるとき、同じ出所の報告を独立とみなして証拠を二重に数える問題と、その対策である「各出所を1回だけ数えよ」という指示の値打ちを、厳密な正解（事後確率）が計算できる人工の世界で測り分けた（抄録、3.1）。", "p2": "検索、多エージェントの合意、エージェントの記憶では、出所が共通する報告の重複が起きる。1回だけ数える指示が定番の対策だが、その価値は受け手のモデルがもともとどう答えるかに左右され、値踏みには厳密な基準が要る（抄録）。", "p3": "隠れた2値の状態を、2つの出所がそれぞれ3つの子報告で伝える。報告1つの信頼度は0.65に固定し、同じ出所の報告どうしの依存度δを0、0.3、0.6、1の4段階に変える。64通りの報告のパターンについて厳密な事後確率を列挙し、規則ごとの目標リスクと、指示の前後のモデルの回答のずれを比べる（3.1〜3.3、図2）。", "p4": "4つのモデル構成の、素の回答と指示つきの回答を2,976の世界で採点する。指示への一致（規則の出力との差が0.001以内か）と、対の利得（指示による事後確率のずれの改善）を別々に測る。検定は事前登録されている（4.1〜4.3）。", "p5": "δ=0で、OpusとSolは744の世界すべてで規則と0.001以内で一致したが、利得は−0.0440と−0.0441で、指示がかえってずれを増やした（6.1）。Lunaの一致は744のうち165だけだが、利得は+0.0140だった（6.2）。一致と利得は別物で、どちらの向きにも食い違う。", "p6": "人工の2値の世界で、報告の信頼度と依存度が既知という設定の結果である。解釈：実際の文書の統合に移すには別の検証が要る。著者が8節で論じる適用範囲は読み切れていない（未確認）。", "fun": "同じうわさを3人から聞いても、3人とも同じ人から聞いたのなら、証拠は1人分に近い。AIが複数の報告をまとめるときも同じで、出所が同じ報告を重ねて数えると確信しすぎる。そこで「出所ごとに1回だけ数えて」と指示するのだが、この研究は、もともと正しく答えられるAIほど指示を忠実に守り、そのせいでかえって答えが悪くなる場合があることを示した。指示に従うことと、正しく答えることは別だ。", "unverified": "5節（結果の概観）、7節（追加の条件）、8節（考察）と補足資料は読んでいない。Haikuの構成で依存度によって利得の符号が変わるという結果は抄録の記載による。"}}, {"id": "pr12", "rank": 12, "headline": "職場のジェンダー・マイクロアグレッション尺度の日本語版", "title": "Picking out invisible glass shards hurting working women: Validation and psychometric network analysis of the Japanese version of the MIMI-16 for workplace gender microaggressions", "url": "https://doi.org/10.21203/rs.3.rs-11493146/v1", "authors": "Akemi Matsuura ほか", "venue": "Research Square (In Review)", "date": "2026-11-23", "apa": "Matsuura, A., & Fuji, K. (2026). Picking out invisible glass shards hurting working women: Validation and psychometric network analysis of the Japanese version of the MIMI-16 for workplace gender microaggressions. https://doi.org/10.21203/rs.3.rs-11493146/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "Research Squareに掲載されたHTML本文（参加者、分析方法、研究1・2の因子分析と妥当性の結果、ネットワーク分析、限界の冒頭）を読んだ", "preprint": true, "p1": "職場で女性が受ける、目立たないが積み重なる性差別的な言動（ジェンダー・マイクロアグレッション）を測る16項目の尺度MIMI-16の日本語版を作り、因子構造・信頼性・妥当性を確かめた（抄録）。", "p2": "あからさまな性差別は問題として認識されやすくなったが、微妙で見えにくい形のものは気づかれにくく、累積的な心理的な害を生みうる。それを捉えるために既存の尺度の日本語版を開発した（Background）。", "p3": "日本で働く女性にオンライン調査を行い、確認的因子分析で、原版と同じ2因子（マイクロインバリデーションとマイクロインサルト）の構造が当てはまるかを調べた。クロンバックのαで内的一貫性を、いじめ・職場での排斥・心理的安全性などの尺度との相関で収束的妥当性を確かめ、項目間の関係をネットワーク分析で描いた（Method、Data analysis）。", "p4": "研究1は360人（22〜65歳）、研究2は355人。2因子モデルと1因子モデルの適合度（CFIなど）を比べ、既存の尺度との相関の向きが予想どおりかを見る（Participants、Data analysis）。", "p5": "2因子モデルの適合は研究1でCFI = .925、研究2でCFI = .931と良好で、1因子モデル（.879と.887）より良かった。尺度は職場での排斥や離職意図と正に、心理的安全性・社会関係資本・職務満足と負に相関した。ネットワークでは、男性の提案のほうが受け入れられやすいという項目の強度の中心性が最も高かった（strength = 1.071）（Results）。", "p6": "著者の限界として、参加者がオンライン調査会社を通じて募集されたことが挙げられている（Limitations）。解釈：横断的な自己報告の相関であり、因果は分からない。ネットワーク分析の媒介中心性は安定性が低く、解釈から除かれている（Results）。", "fun": "会議で女性の提案が通りにくいといった、悪気がなさそうに見える出来事は、1つ1つは小さくても、積み重なると人を傷つける。この研究は、そうした見えにくい差別を測る物差しの日本語版を作り、日本で働く女性715人で確かめた。項目どうしのつながりを調べると、「男性の提案のほうが受け入れられやすい」という経験が、ほかのさまざまな経験と最も強く結びついていた。", "unverified": "研究2の参加者の属性、各尺度との相関係数の値（表1・表3）、限界の節の2点目以降は読んでいない。"}}, {"id": "pr13", "rank": 13, "headline": "公開の決算報告だけで銀行破綻の早期警戒スコアを作る", "title": "Interacting Interest-Rate, Funding, and Credit Risk at United States Midsize Banks&nbsp;A Transparent Call Report Early-Warning Method with a Preregistered Validation Design", "url": "https://doi.org/10.2139/ssrn.7717678", "authors": "Anjola Odunaike", "venue": "SSRN", "date": "2026-11-23", "apa": "Odunaike, A. (2026). Interacting Interest-Rate, Funding, and Credit Risk at United States Midsize Banks&nbsp;A Transparent Call Report Early-Warning Method with a Preregistered Validation Design. https://doi.org/10.2139/ssrn.7717678", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "公開されている銀行の決算報告（コールレポート）だけを使い、金利・資金調達・信用の3つのリスクの相互作用を点数にする早期警戒の方法を作り、その検証の計画を結果を見る前に登録した（抄録）。", "p2": "銀行は金利リスク、流動性リスク、信用リスクを別々の枠組みで監視するのが普通だが、2023年の銀行破綻はこれらが短期間に重なりうることを示した（抄録）。", "p3": "資産が100億〜2,500億ドルの米国の銀行について、FFIECのコールレポートの公開データだけから、3つのリスクがどう重なっているかを点数化する。2022〜2023年を開発用の事例とし、仕様を凍結して日時の証明つきで公開したうえで、追加の期間を調べる（抄録）。", "p4": "開発期間では、対象の149行の中で2023年に破綻した3行が何位に入るかを見る。事前登録した3つの検定（2008〜2009年の破綻、2019〜2020年のストレス、2026年第3四半期を基準とする前向きの検定）には、数値の合格基準を定めた（抄録）。", "p5": "凍結した仕様は、2023年に破綻した対象内の3行を149行中の5位、10位、15位に順位づけた。一方で破綻しなかった12行にも警告を出し、無保険の預金の集中度だけでも同じ破綻を捉えられた。著者は、これらは標本内の結果で、統合した点数が優れていることを示すものではないと述べる（抄録）。", "p6": "前向きの検定の期間は2028年第3四半期まで続いており、結果はまだ出ていない。抄録の範囲では、点数の計算式と検定の合格基準の中身は分からない（未確認）。四半期ごとの公開データの限界も著者が論じている（抄録）。", "fun": "テストの点が良かったと言うとき、問題を見てから答えを作り直していたら意味がない。銀行の破綻を当てるモデルも、過去のデータに合うように後から調整すれば、良く見せられてしまう。この研究が面白いのは、予測の方法を先に固定して公開し、合格の基準まで決めてから、これから起きることで試すと宣言した点だ。当たるかどうかは、2028年まで待たないと分からない。", "unverified": "本文は入手できず、点数の計算式、検定の合格基準、過去の2期間の検定の結果は未確認。"}}, {"id": "pr14", "rank": 14, "headline": "レビューは約47件を超えると評点が購買に効き始める", "title": "Online Review Volume and Valence Interact to Predict Ecommerce Conversion Outcomes", "url": "https://doi.org/10.21203/rs.3.rs-11159319/v1", "authors": "Xinjia Yang¹ ほか", "venue": "Research Square (In Review)", "date": "2026-11-23", "apa": "Yang¹, X., & Yu, Z. (2026). Online Review Volume and Valence Interact to Predict Ecommerce Conversion Outcomes. https://doi.org/10.21203/rs.3.rs-11159319/v1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "本文", "basis_note": "Research Squareに掲載されたPDF本文（抄録、データの3.1、結果の要約、限界の5.4）を読んだ。手法と結果の詳細な節は読んでいない", "preprint": true, "p1": "ネット通販のレビューの件数と評点は、別々にではなく掛け合わさって購買に効くことを示した。件数がおよそ47件を超えるまでは評点の高低はほとんど効かず、超えると高評価の効果が強まる（抄録）。", "p2": "レビューの件数（volume）と評点の高低（valence）の効果は、線形回帰やロジスティックモデルで調べられることが多く、2つが相互作用する仕組みとして扱われることは少なかった（抄録、1節）。", "p3": "情報が届く段階（件数）と受け入れられる段階（評点）を分ける枠組みから、しきい値と非対称な増幅についての仮説を立てる。XGBoost・LightGBM・ランダムフォレストの積み上げ型の集合学習で、商品・月ごとの成約率が同じ月のカテゴリの中央値を上回るかを予測し、SHAPの交互作用値などで件数と評点の効き方を読む（抄録、3.1）。", "p4": "2020年から2023年の1,643,680の商品・月（527,704商品）を対象に、商品ごとに層別した時間順の検証で情報の漏れを避け、ロジスティック回帰や決定木などと比べる。指標はAUC、AUCPR、交互作用の特徴量を除いたときの低下である（3.1、抄録）。", "p5": "集合学習はAUC = 0.874（95%信頼区間0.869〜0.879）、AUCPR = 0.861だった。件数のしきい値は約47件（41〜53）で、それを超えると平均評点4.0以上の商品で限界的な効果が2.3倍に増幅された。件数が多いときの低い評点は平均の交互作用値−0.289を示し、交互作用の特徴量を除くとAUCは0.031下がった（抄録）。", "p6": "著者の限界：観測されない交絡（商品の質による選別など）が残り、因果の識別はできていない。単一の場のデータで、47件というしきい値はその場に固有の推定値である（5.4）。解釈：成約のデータは非公開の提携データとされ、第三者は結果を再現できない。", "fun": "星の数が高くてもレビューがほんの数件しかない商品と、星は少し低くてもレビューがたくさんある商品。どちらを信用するか、迷ったことがあるだろう。この研究はその感覚をデータで確かめ、レビューが約47件たまるまでは星の数はほとんど購買に効かず、それを超えると効き始めることを見つけた。逆に、件数が多いのに評価が低いと、悪い印象が強く効く。", "unverified": "モデルの詳細、仮説ごとの検定、頑健性の確認の節は読んでいない。成約のデータの提供元は本文で明かされていない。"}}, {"id": "pr15", "rank": 15, "headline": "包摂的ゾーニングは開発を促すが地価高騰は招かない", "title": "Inclusionary Zoning in New York and Paris: Trojan Horse or Antidote to Gentrification? Working Paper WP22LF1", "url": "https://doi.org/10.2139/ssrn.7722040", "authors": "Magda Maaoui", "venue": "SSRN", "date": "2026-11-23", "apa": "Maaoui, M. (2026). Inclusionary Zoning in New York and Paris: Trojan Horse or Antidote to Gentrification? Working Paper WP22LF1. https://doi.org/10.2139/ssrn.7722040", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "低所得者向けの住宅を開発に組み込ませる包摂的ゾーニングが、これから値上がりする地区だという合図になって高級化（ジェントリフィケーション）を招くのではないかという懸念を、ニューヨークとパリで検証し、強い証拠はないことを示した（抄録）。", "p2": "包摂的ゾーニングは手頃な住宅を増やす手段だが、不利な地区に適用されると、開発を呼び込む合図として住宅価格や家賃の上昇を引き起こす「トロイの木馬」になりうると懸念されてきた（抄録）。", "p3": "政策の対象になった地区とならなかった地区を、導入の前後で比べる差の差法を使う。政策に効果がなければ両者の傾向の関係は変わらないはずだという仮定のもとで、導入と同時に関係が変わったかを見て、新規開発、住宅の売買価格、家賃への影響を推定する（抄録）。", "p4": "市場主導の色が強いニューヨークと、国の計画の色が強いパリという性格の違う2都市で、対象地区と比較地区の新規開発、売買価格、家賃の推移を比べた（抄録。データの期間と標本の大きさは未確認）。", "p5": "両都市とも、対象地区の新規開発は比較地区を上回った。対象地区で住宅の売買価格が上がったという強い証拠はどちらにもなく、パリではむしろ上昇が遅かった。家賃は、ニューヨークでは加速の強い証拠がなく、パリでは対象地区のほうが速く上がったという証拠がいくらかあった（抄録）。", "p6": "著者自身が、結果は今後の研究で強められるべきものだと述べている。パリで売買価格の伸びが鈍り家賃が上がるという食い違いの理由は抄録からは分からない（未確認）。差の差法の前提の検証も抄録にはない。", "fun": "大都市で、新しい開発の一部を手頃な住宅にするよう求める制度がある。良い制度に見えるが、「この地区はこれから開発される」という合図になって住宅の値段が上がり、かえって高級化を進めるのでは、という心配があった。この研究は性格の違うニューヨークとパリを比べ、開発は増えたのに、心配された売買価格の上昇の強い証拠は見つからなかったと報告している。", "unverified": "本文（作業論文）は入手できず、データの期間、推定値、頑健性の確認は未確認。"}}, {"id": "pr16", "rank": 16, "headline": "LLMにCFOを演じさせ景況感調査を再現する", "title": "CFOs Meet LLMs", "url": "https://doi.org/10.3386/w36057", "authors": "John R. Graham ほか", "venue": "NBER Working Paper", "apa": "Graham, J. R., Harvey, C. R., & Jha, M. (2026). CFOs Meet LLMs (NBER Working Paper No. 36057). National Bureau of Economic Research. https://www.nber.org/papers/w36057", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "NBERに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "LLMに特定の企業・特定の日のCFOを演じさせて景況感調査の回答を作らせると、実際のCFOの予想の企業間の違いをおおむね再現できることを示した。", "p3": "Duke–連邦準備のCFO調査（2002〜2025年）に回答した上場企業のCFO全員について、その会社のその日のCFOになりきるようLLMに指示して予測を出させ、実際の回答と比べた（抄録）。", "p5": "LLMの予測はCFOの予想の横断面とおおむね合い、LLMに与える情報が多いほど精度が上がった。個々の意思決定者をまねる「デジタルツイン」の可能性と障害も論じる（抄録）。", "fun": "景気の見通しを知るには企業の財務責任者にアンケートを送るが、時間もお金もかかり、答えてくれる会社も限られる。この研究は「その会社のCFOになったつもりで答えて」とAIに頼むと、本物の回答にどれくらい近づくかを長年の調査と突き合わせた。渡す情報を増やすほど当たるという結果は、AIが役になりきる力の源が情報量にあることを示している。", "unverified": "一致の程度を示す数値、使ったLLM、情報の与え方の詳細は抄録に書かれておらず未確認。"}}, {"id": "pr17", "rank": 17, "headline": "対立する2つのペルソナをLLMは黙って裁定する", "title": "Silent Arbitration: How Large Language Models Resolve Co-Authoritative Conflicting Instructions", "url": "https://arxiv.org/abs/2611.27444", "authors": "Sihyeon Lee ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Lee, S., Kum, J., Song, J., Kim, C., & Park, C. (2026). Silent Arbitration: How Large Language Models Resolve Co-Authoritative Conflicting Instructions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27444", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "1つのプロンプトで同じ重みの対立する2つのペルソナを与えられたLLMが、矛盾を表に出さずにどちらかへ寄せて答える「黙った裁定」を測った。", "p3": "公刊資料に基づく8種類の対立と5つのLLMで、矛盾を認めるか、どう解決するか、どちらの立場に傾くかを測定した（抄録）。", "p5": "直接尋ねれば72%で両立しないと認めるが、課題の回答で矛盾を明示したのは22%だけだった。2つのペルソナを与えた回答の45%は一方が優越し、折衷と分類された回答の35%にも方向の偏りが残った（抄録）。", "fun": "「厳しく指導して」と「優しく励まして」を同時に頼まれたら、人なら「どちらを優先しますか」と聞き返すだろう。AIは聞かれれば矛盾に気づいているのに、実際の回答では黙ってどちらかを選んでしまうことが多い。気づいていることと、それを相手に伝えることは別の能力だと分かるのが面白い。", "unverified": "8種類の対立の中身、5つのモデルの名前、判定の方法は抄録からは分からず未確認。"}}, {"id": "pr18", "rank": 18, "headline": "根拠のない主張がエージェント間で変質する過程を追う", "title": "Tracking and Limiting Unsupported Claim Propagation in Multi-Agent LLM Systems: A Provenance-Aware Framework", "url": "https://arxiv.org/abs/2611.26957", "authors": "Zijia Cao ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Cao, Z., & Dou, H. (2026). Tracking and Limiting Unsupported Claim Propagation in Multi-Agent LLM Systems: A Provenance-Aware Framework (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26957", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "複数のLLMエージェントが主張を受け渡すうちに、根拠のない主張がどう変わるかを追い、出所の情報を付けて渡す仕組みでそれを抑えられるかを調べる枠組みを示した。", "p3": "同じモデルを並べた経路と異なるモデルを並べた経路の両方で、基準の方法と、各主張に根拠の有無・出所・証拠・伝達の履歴を付けて渡す方法を比べる。途中で新しい証拠は加えない（抄録）。", "p5": "主張の意味の変化、根拠のない細部の付け足し、意味のずれ、出所の保持を指標として測る。抄録には具体的な数値は示されていない（抄録）。", "fun": "伝言ゲームでは、人から人へ伝わるうちに話が少しずつ変わり、もっともらしい尾ひれが付く。AIどうしの伝言でも同じことが起きるのかを確かめるのがこの研究だ。「誰が言ったか、証拠はあるか」という札を主張に付けたまま渡せば尾ひれを防げるのか、という発想は、うわさ話への対処にも通じる。", "unverified": "枠組みが実際にどれだけ変化を抑えたかの数値は抄録になく未確認。使ったモデルと課題も未確認。"}}, {"id": "pr19", "rank": 19, "headline": "LLM審査員は例示の「合格」の偏りだけを受け継ぐ", "title": "Your Judge Inherits Your Prompt: In-Context Label Bias in an LLM-as-Judge Is Directional, Not Symmetric", "url": "https://arxiv.org/abs/2611.26881", "authors": "Abdullah Ahmad ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Ahmad, A., Ahmed, A. J. O., & Citi, L. (2026). Your Judge Inherits Your Prompt: In-Context Label Bias in an LLM-as-Judge Is Directional, Not Symmetric (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26881", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "LLMに回答の正誤を判定させる「LLM審査員」は、手本として見せる例が合格に偏っていると合格を出しすぎるが、逆の偏りでは厳しくならないことを示した。", "p3": "動画の質問応答の評価で、生成された回答は固定し、審査員に見せる少数の例のYes/Noの比だけを4通りに変えた。各判定は2人の注釈者の合意（データセットごとに200例）と照合した（抄録）。", "p5": "例が均衡か不合格寄りなら合格率は人の合意に近いが、合格寄りにするとNExT-QAで約30ポイント、MSVD-QAで約20ポイント跳ね上がった。例の引き方1回だけの結果は最大18ポイントぶれる（抄録）。", "fun": "採点の手本に合格の答案ばかり見せると、AIの採点者は甘くなる。ところが不合格の答案ばかり見せても辛くはならない。偏りが片方向にしか働かないので、成績は水増しされることはあっても不当に下がることはない、という非対称が意外だ。手本を半々にするだけで防げるという対策の簡単さも面白い。", "unverified": "審査員に使ったモデルの名前と、4通りの例の具体的な比率は抄録からは分からず未確認。"}}, {"id": "pr20", "rank": 20, "headline": "推論モデルは科学的な議論の課題では力を出せない", "title": "Beyond Math, Code, and Logic: Do Reasoning Models Transfer to Scientific Argumentation?", "url": "https://arxiv.org/abs/2611.27722", "authors": "Buse Sibel Korkmaz ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Korkmaz, B. S., & Chanona, A. del R. (2026). Beyond Math, Code, and Logic: Do Reasoning Models Transfer to Scientific Argumentation? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27722", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "数学やプログラミングに強い推論型の言語モデルでも、論文や査読を題材にした科学的な議論の課題では力を出せないことを示し、議論の過程を明示して訓練する方法を提案した。", "p3": "研究論文・査読・研究費申請書を使い、論証の抽出、反論の生成、談話レベルの推論にわたる7つの課題でモデルを体系的に評価した。そのうえで論証の推論過程を足場として与える訓練の枠組みを導入した（抄録）。", "p5": "最先端のモデルも分野固有の論証課題で苦戦した。提案の訓練をした小型モデルは、はるかに大きい商用モデルに迫るか上回り、未見の対話の設定にも一般化した（抄録）。", "fun": "計算や論理パズルが得意なら、議論も上手なはずだと思いがちだ。ところがAIは、相手の主張のどこが証拠に支えられていないかを見抜いて反論する課題になると急に苦手になる。議論の力はモデルを大きくすれば自然に身につくものではなく、筋道の立て方を教える訓練が要るという結論は、人の学び方にも似ている。", "unverified": "7つの課題の具体的な内容、評価したモデル、改善の幅を示す数値は抄録になく未確認。"}}, {"id": "pr21", "rank": 21, "headline": "アシスタントのペルソナ方向は言語ごとに異なる", "title": "The Assistant Persona Differs Across Languages in Activation Space", "url": "https://arxiv.org/abs/2611.27504", "authors": "Daniel Yoo ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Yoo, D., Rozen, N., & Harris, E. (2026). The Assistant Persona Differs Across Languages in Activation Space (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27504", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "LLMの内部で「アシスタントらしさ」を表す方向は1つではなく、言語ごとに大きく違うことを示した。", "p3": "Qwen3-32Bで31の言語それぞれについてアシスタントのペルソナの方向を取り出し、英語の方向との余弦類似度や、言語の資源量との関係を調べた（抄録）。", "p5": "英語の軸との余弦類似度は0.378から0.911まで幅があり、方向と大きさは言語の資源量と相関した。資源の少ない言語ほど既定の状態が「役に立つアシスタント」の極から遠く、その言語自身の軸に逆らう操作のほうがペルソナを使った脱獄を強めた（抄録）。", "fun": "AIの内部には「親切な助手としてふるまう」ことに対応する向きがあり、ふつうは英語で見つけた向きがどの言語にも通用すると仮定されている。ところが31の言語で調べると、その向きは言語によってかなり違った。同じAIでも、何語で話しかけるかで「助手らしさ」の中身が違うということで、安全対策を英語だけで確かめる危うさが見える。", "unverified": "方向の取り出し方の詳細と、脱獄の強まりの程度を示す数値は抄録になく未確認。"}}, {"id": "pr22", "rank": 22, "headline": "XBRLの計算誤り率の大半は算術の誤りではない", "title": "How Much of a Calculation-Error Rate Is Not Arithmetic: Auditing the FinReason Cup 2026 Task 3 Metric with a Deterministic Rule System", "url": "https://arxiv.org/abs/2611.27192", "authors": "Vladimir Beskorovainyi", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Beskorovainyi, V. (2026). How Much of a Calculation-Error Rate Is Not Arithmetic: Auditing the FinReason Cup 2026 Task 3 Metric with a Deterministic Rule System (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27192", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "XBRLの数値の整合性を問う競技課題で、「計算誤り」と数えられた失敗のほとんどが実は算術の誤りではないことを、公開された成績表だけから示した。", "p3": "課題の元になった3つのデータ品質規則を、学習するパラメータも外部サービスも使わない決定的な規則システムとして作り直し、全680件を1.4秒で処理した。規則ごとの正答率と誤りの分類を突き合わせて指標を点検した（抄録）。", "p5": "規則の1つは答えが報告値の符号を反転した値になるため、計算誤りのラベルは事実か経路の誤りを表す。順位のついた23件のうち22件で下限が正で、同率首位の2件では計算誤りの12件中11件以上、13件中12件以上が算術の残らない事例だった（抄録）。", "fun": "テストの採点表に「計算ミス」と書かれていても、本当に計算を間違えたとは限らない。この研究は、企業の決算データを扱うAIの競技で、「計算ミス」とされた失敗のほとんどが、どの数字を使うかの取り違えだったことを突き止めた。物差しそのものを疑って調べ直すと、強いAIの弱点の見え方ががらりと変わるのが面白い。", "unverified": "競技の主催者や課題の詳細な定義は抄録の記述以上には確認していない。規則システムの公開テストの成績（95.29%）は抄録の記載による。"}}, {"id": "pr23", "rank": 23, "headline": "財務文書から監査可能な時系列知識グラフを構築", "title": "Auditable Financial Knowledge Graphs: Schema-Driven Construction and Intrinsic Quality Evaluation", "url": "https://arxiv.org/abs/2611.27835", "authors": "Samarth Sarin ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Sarin, S., Singh, L., & Mehta, D. (2026). Auditable Financial Knowledge Graphs: Schema-Driven Construction and Intrinsic Quality Evaluation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27835", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "財務文書から、発行体・報告期間・出所をたどれる時系列の知識グラフを作る方法と、そのグラフの質を直接評価する枠組みを示した。", "p3": "ページ区切りの文書を重なりのある窓に分け、LLMで構造的な実体、数量の観測、関係を段階的に抽出する。候補はあらかじめ決めたスキーマで検証し、完全一致・正規化・あいまい一致・埋め込み・LLMを使う実体の同定でまとめる（抄録）。", "p5": "評価の枠組みは、重みつきの7つの次元、2つの必須の検証の関門、構造の診断からなる。グラフの質の評価を検索や回答生成から切り離すことで、系統的な診断と改良ができるとする（抄録）。", "fun": "決算書には文章・数字・会社の関係・時期がまじっていて、AIに細切れで読ませると「どの会社の、いつの数字か」が抜け落ちやすい。この研究は情報を点と線の図（知識グラフ）に整理し、それぞれの点に「どのページから取ったか」を残す。答えが合っているかより先に、土台の図そのものの出来を点検しようという順序が堅実だ。", "unverified": "評価の7つの次元の内容、対象にした文書の種類と量、評価の結果の数値は抄録になく未確認。"}}, {"id": "pr24", "rank": 24, "headline": "10-KのAIリスク開示が根拠に支えられているかを判定", "title": "Evidence-Grounded Hybrid Agentic AI for Trustworthy AI Risk Communication Assessment in SEC Form 10-K Disclosures", "url": "https://doi.org/10.20944/preprints202611.2094.v1", "authors": "Hongyu Shen ほか", "venue": "Preprints.org", "date": "2026-11-23", "apa": "Shen, H., Guo, X., Ke, L., Xia, H., Jia, R., Zuo, Y., & Shi, Y. (2026). Evidence-Grounded Hybrid Agentic AI for Trustworthy AI Risk Communication Assessment in SEC Form 10-K Disclosures. https://doi.org/10.20944/preprints202611.2094.v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Preprints.org（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "米国企業の年次報告書（10-K）のAIに関するリスクの記述が、具体的な根拠に支えられているか紋切り型かを判定する、証拠に基づくハイブリッドのエージェント型AIの枠組みを作った。", "p3": "SECのEDGARから集めた10-K 160件のうちAI関連のリスク記述がある101件を特定し、48社・80件の主張に手作業で正解を付けた。規則、TF-IDF検索、単一プロンプトのLLM、純粋なマルチエージェント、提案のハイブリッドの5つを比べた（抄録）。", "p5": "ハイブリッド法が最もよく、次元の分類の正解率0.725（マクロF1 0.667）、証拠の支持の判定の正解率0.750（マクロF1 0.734）だった。LLMへの直接の指示は支持の判定で較正が悪い場合があることも示した（抄録）。", "fun": "会社は年次報告書に「AIにはこんなリスクがあります」と書くが、どの会社にも当てはまる決まり文句も多い。この研究は、その文が自社の具体的な事実に支えられているかをAIに判定させた。面白いのは、AIに丸ごと聞くよりも、決まった規則と複数のAIの役割分担を組み合わせたほうが正確だった点で、道具の組み合わせ方が効くことが分かる。", "unverified": "正解を付けた主張は80件と少なく、結果の統計的な確かさは抄録からは判断できない。使ったLLMの名前も未確認。"}}, {"id": "pr25", "rank": 25, "headline": "8-Kのサイバー事故開示の重要性の主張を証拠で検証", "title": "Hybrid Agentic AI Improves Evidence-Based Review of Cybersecurity Incident Disclosures", "url": "https://doi.org/10.20944/preprints202611.2060.v1", "authors": "Hongyu Shen ほか", "venue": "Preprints.org", "date": "2026-11-23", "apa": "Shen, H., Guo, X., Ke, L., Xia, H., Jia, R., Liao, Q., & Shi, Y. (2026). Hybrid Agentic AI Improves Evidence-Based Review of Cybersecurity Incident Disclosures. https://doi.org/10.20944/preprints202611.2060.v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Preprints.org（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "サイバー事故を報告する米国企業の臨時報告書（8-K）で、重要性についての会社の記述が同じ書類の中の事実に支えられているかを判定する、ハイブリッドのエージェント型AIの枠組みを作った。", "p3": "SECの8-K Item 1.05の提出書類70件と、専門家が判定した30件（20の事故のまとまり）の試行用の標本で、規則、TF-IDF検索、LLMへの直接の指示、純粋なマルチエージェント、提案のハイブリッドの5つを比べた（抄録）。", "p5": "ハイブリッド法が最もよく、重要性の判定の正解率0.733（マクロF1 0.648）、支持の判定の正解率0.767（マクロF1 0.683）だった。改善が最もはっきりしたのは支持のラベルの分類だった（抄録）。", "fun": "会社がサイバー攻撃を受けると「業績への影響は重要ではない」などと発表するが、その言い分が同じ発表文の事実と合っているかを確かめるのは手間がかかる。この研究はその突き合わせをAIにやらせた。法的な判断を下すのではなく「文中の根拠で支えられているか」だけを見る、と範囲を絞ったところが現実的だ。", "unverified": "正解つきの標本は30件と小さく、著者自身が慎重な解釈を求めている。使ったLLMの名前は抄録になく未確認。"}}, {"id": "pr26", "rank": 26, "headline": "言語判断モデルで顧客の金融リスクをゼロショット評価", "title": "JevRisk: Zero-Shot Financial Risk Assessment with a Language Decision Model", "url": "https://arxiv.org/abs/2611.26999", "authors": "Yaodong Yang ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Yang, Y., Huang, L., Liang, J., Ma, Y., Tang, H., Fan, X., Li, J., & Liu, F. (2026). JevRisk: Zero-Shot Financial Risk Assessment with a Language Decision Model (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26999", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "銀行の顧客の資金洗浄や債務不履行のリスクを、正解ラベルをほとんど使わずに判定する仕組みJevRiskを作った。", "p3": "まず金融分野の規制の指針に沿ったリスク指標をコードで正確に計算し、次に言語判断モデルがその指標と顧客の属性・取引を合わせて読み、高リスクの点数を返す。資金洗浄対策はScotiabankの公開の合成データ、信用リスクはHome CreditとLending Clubの実データで評価した（抄録）。", "p5": "どちらの課題でも規則ベースと教師なしの方法を上回り、約千人のラベルつき顧客で学習した教師ありの方法（GBDTやTabPFNなど）と同等以上だった（抄録）。", "fun": "銀行は怪しい取引や返済の滞りそうな客を見つけたいが、「この客は問題だった」という正解を集めるには専門家の調査や何か月もの返済記録が要る。この研究は、数字の計算はプログラムに任せ、文脈を読む判断だけを言語モデルに任せた。計算と判断を分業させると、正解をほとんど教えなくても千人分で学習した方法に並ぶ、という点が面白い。", "unverified": "性能の具体的な数値と、言語判断モデルの中身は抄録からは分からず未確認。"}}, {"id": "pr27", "rank": 27, "headline": "表やレイアウトを保ったRAGで統合報告書に質問応答", "title": "SPM-RAG: Structure-Preserving Multimodal RAG for Question Answering over Turkish Integrated Reports", "url": "https://doi.org/10.21203/rs.3.rs-11730482/v1", "authors": "Erdem Nezihi Aksu ほか", "venue": "Research Square (In Review)", "date": "2026-11-23", "apa": "Aksu, E. N., Yesilyurt, S., Aydemir, S., Genc, Y., & Akgul, Y. S. (2026). SPM-RAG: Structure-Preserving Multimodal RAG for Question Answering over Turkish Integrated Reports. https://doi.org/10.21203/rs.3.rs-11730482/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Square（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "表や図、段組みの多い統合報告書から、表の行と見出しの対応や章の階層を壊さずに事実を探して質問に答える検索拡張生成の方法SPM-RAGを作った。", "p3": "報告書を、構造を保ったテキストの流れと、取り出した表・図の流れに分け、両方を並行して検索する。3段階の分割アルゴリズムで、どの表も列見出しと一緒に、どの断片も章の階層の中に保つ（抄録）。", "p5": "トルコの統合報告書46件と質問・回答1,380組で、審査役のLLMの採点により、文脈の再現率0.82、文脈の適合率0.82、回答の正解率0.71を得た。正解率は最強の基準より14ポイント高い（抄録）。", "fun": "会社の報告書の表をただの文字列にして読ませると、「この数字はどの列の何年の値か」という見出しとのつながりが切れてしまう。人が表を見るときに無意識にやっている「行と列を目で追う」作業を、AIにもできるよう表を丸ごと保ったまま探させるのがこの方法だ。読み方の工夫だけで正解率が14ポイント上がるのが面白い。", "unverified": "採点はLLMが行っており、人による確認の有無は抄録からは分からない。比較した基準の方法の中身も未確認。"}}, {"id": "pr28", "rank": 28, "headline": "デジタルツインのモデル更新を分類し実務の枠組みに", "title": "Model Updating for Digital Twins: A Review, Taxonomy, and Practitioner Framework", "url": "https://doi.org/10.20944/preprints202611.1978.v1", "authors": "Kerry Sado ほか", "venue": "Preprints.org", "date": "2026-11-23", "apa": "Sado, K., Worch, J. N., Downey, A. R. J., Booth, K., Santi, E., & Blasch, E. (2026). Model Updating for Digital Twins: A Review, Taxonomy, and Practitioner Framework. https://doi.org/10.20944/preprints202611.1978.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Preprints.org（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "デジタルツインの仮想モデルを、変化していく実物に合わせ続ける「モデル更新」の手法を整理し、実務で使える枠組みにまとめた総説。", "p3": "デジタルシャドウとモデル更新エンジン（DIGSMUE）を中心に置いた参照構成を示し、手法を、更新する量、計算の方法、配置（エッジ、試験台、クラウド）で分類した。電力変換、エネルギー、製造、医療の事例を横断して比べた（抄録）。", "p5": "境界条件の直接の書き換えと、隠れた状態やパラメータの間接的な推定を分け、時間に厳しい推定とゆっくりした再較正を別の周期で行い、分布の外では更新を止める「信頼の境界」を置く枠組みを提案した（抄録）。", "fun": "機械や設備の「デジタルの双子」は、作った瞬間は本物そっくりでも、本物が古くなるにつれてずれていく。そのずれをどう直し続けるかが、この総説の主題だ。面白いのは「いつ直さないか」も決めておく点で、これまで見たことのない状況のデータで慌てて双子を書き換えると、かえって壊してしまうという考え方に納得がいく。", "unverified": "総説のため新しい実験結果はなく、提案の枠組みの有効性を示す検証は抄録からは確認できない。査読前の原稿である。"}}, {"id": "pr29", "rank": 29, "headline": "橋梁SHMの研究はAI・IoT・デジタルツインと統合へ", "title": "Evolution of bridge structural health monitoring methods: a bibliometric analysis of the integration of Artificial Intelligence and IoT", "url": "https://doi.org/10.5281/zenodo.23902389", "authors": "Gardioli ほか", "venue": "Zenodo", "date": "2026-11-23", "apa": "Gardioli, L. N., de Oliveira, D. S., Ribeiro, L. D., de Carvalho, J. M. F., Almeida, E. de O., & Drumond, P. H. C. (2026). Evolution of bridge structural health monitoring methods: a bibliometric analysis of the integration of Artificial Intelligence and IoT. SINAENCO. https://doi.org/10.5281/ZENODO.23902389", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "橋の構造ヘルスモニタリングの研究が、人工知能やIoT、デジタルツインとどう結びついてきたかを、論文データベースの統計から整理した。", "p3": "Web of ScienceとScopusで文献計量分析を行い、最終的にWeb of Scienceのデータを選んで、VOSviewer、Bibliometrix、Rで前処理とキーワードの統一をして分析した（抄録）。", "p5": "とくに2016年以降に発表が増え、モニタリングと人工知能、IoT、デジタルツインの統合が進んでいることを示した。研究の傾向と空白を整理している（抄録）。", "fun": "橋が安全かどうかを、センサーの測定で見張り続ける研究がある。この論文は橋そのものではなく、その研究の世界を地図にした。たくさんの論文のキーワードを数えてつなぐと、2016年ごろからAIやネットにつながるセンサーの話題が急に増えたことが見えてくる。研究の流行にも、データで読み取れる波がある。", "unverified": "対象にした論文の数、具体的な研究の空白の内容は抄録になく未確認。会議論文で、Zenodoに置かれた版である。"}}, {"id": "pr30", "rank": 30, "headline": "ANCF梁要素の節点配置と求積点を整合させる", "title": "Research on the node placement strategies of absolute node coordinate formulation based on collocation method", "url": "https://doi.org/10.21203/rs.3.rs-11593228/v1", "authors": "Jia Wang ほか", "venue": "Research Square (In Review)", "date": "2026-11-23", "apa": "Wang, J., Zhang, H., Zhang, L., & Wang, T. (2026). Research on the node placement strategies of absolute node coordinate formulation based on collocation method. https://doi.org/10.21203/rs.3.rs-11593228/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Square（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "大きく変形する梁を扱うANCF梁要素で、補間に使う節点と数値積分の点の置き方を整合させ、積分の精度不足を防ぐ枠組みを提案した。", "p3": "積分点の一部を位置の節点として選び、全ての積分点は数値積分に使う。等間隔の節点とニュートン・コーツ求積、ルジャンドルに基づく節点とルジャンドル・ガウス・ロバット求積、チェビシェフに基づく節点とクレンショー・カーティス求積の3つの方針を調べた（抄録）。", "p5": "静的な曲げのベンチマークと、柔らかい振り子の動的なシミュレーションで、精度、収束、計算効率への影響を評価する。抄録には結果の数値や優劣は示されていない（抄録）。", "fun": "しなやかに大きく曲がる棒の動きを計算するとき、棒を短い要素に分け、要素の中の何点かで力を足し合わせる。その点をどこに置くかで、同じ計算量でも答えの正確さが変わる。この研究は、形を決める点と力を足し合わせる点を別々に選べるようにしつつ、位置はそろえるという工夫で、点の置き方を3通り比べた。", "unverified": "3つの方針のどれが良かったかという結論と数値は抄録になく未確認。査読前の原稿である。"}}, {"id": "pr31", "rank": 31, "headline": "アルゴリズム管理の影響は自律性や公正さしだい", "title": "Algorithmic Management and Employee Well-Being: A Text Mining and Behavioral Science Review (2020–2026)", "url": "https://doi.org/10.20944/preprints202611.2072.v1", "authors": "Jinwoo Chae", "venue": "Preprints.org", "date": "2026-11-23", "apa": "Chae, J. (2026). Algorithmic Management and Employee Well-Being: A Text Mining and Behavioral Science Review (2020–2026). https://doi.org/10.20944/preprints202611.2072.v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Preprints.org（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "アルゴリズムによる仕事の割り振り・監視・評価（アルゴリズム管理）と従業員の幸福の関係を扱う研究255件を整理し、影響は条件しだいであることを示した総説。", "p3": "題名のテキストマイニング（語と2語連鎖の頻度、6つの主題の符号、主題の共起）と行動科学の符号化の枠組みを組み合わせ、17の主題の節で全件を論じた（抄録）。", "p5": "255件のうち175件（69%）が2025〜2026年のもので、幸福・燃え尽き・ストレス（152件）、AIを使う人事（107件）、ギグ・プラットフォーム労働（68件）に集中し、公正・透明性・倫理（22件）は少ない。アルゴリズムによる統制は、受け止め方や自律性、公正さ、支援によって疲弊にも活力にもなる（抄録）。", "fun": "配達アプリのように、仕事の指示や評価をコンピュータが出す働き方が普通の会社にも広がっている。それで人が疲れるのか元気になるのかは、研究によって答えが違う。この総説は255の研究を並べ、違いを分けるのは自分で決められる余地や公平さだと整理した。同じ仕組みでも、使い方で正反対の結果になるのが面白い。", "unverified": "題名だけのテキストマイニングで、本文は分析していないと抄録にある。個々の研究の効果の大きさは未確認。"}}, {"id": "pr32", "rank": 32, "headline": "生成AIの職場利用は学歴・所得で大きく違う", "title": "From Artificial Light to Artificial Intelligence: Technological Change and Worker Perspectives", "url": "https://econpapers.repec.org/RePEc:fip:fedhwp:104047", "authors": "Kristen Broady", "venue": "RePEc NEP", "date": "2026-11-23", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "RePEc（NEP）に登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "生成AIの導入を過去の技術の変化の流れの中に置き、技術的にできることや職業の曝露と、実際の職場での導入や働き手の経験とを区別して示した。", "p3": "歴史的な整理と自動化・AIの文献の統合に、2025年の家計の経済と意思決定に関する全米代表の調査（SHED）の新しい分析と、2026年の連邦準備制度の「働き手の視点」プロジェクトの質的な証拠を組み合わせた（抄録）。", "p5": "生成AIの利用には大きなばらつきがあり、経済的・教育的な属性がとくに重要だった。利用者は仕事への有用性をおおむね好意的に見ているが、雇用への懸念は残る（抄録）。", "fun": "「AIに置き換えられる仕事は何割」という予測と、実際に職場でAIを使っている人の割合は別物だ。この論文は、昔の技術の変化と比べながら、今のAIを「できること」と「実際に起きていること」に分けて見る。全米の調査で、使う人と使わない人が学歴や収入で分かれているという結果は、道具が行き渡る速さの不均等を示している。", "unverified": "利用率などの具体的な数値は抄録になく未確認。"}}, {"id": "pr33", "rank": 33, "headline": "NSW州の法定地価は市場価格より速く上昇", "title": "Statutory Land Values and Market Prices in New South Wales: Evidence from Valuer General Benchmark Properties, 1996–2026", "url": "https://doi.org/10.5281/zenodo.24487856", "authors": "Landmark Valuations Research", "venue": "Zenodo", "date": "2026-11-24", "apa": "Landmark Valuations Research. (2026). Statutory Land Values and Market Prices in New South Wales: Evidence from Valuer General Benchmark Properties, 1996–2026. Landmark Valuations. https://doi.org/10.5281/ZENODO.24487856", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "オーストラリアのニューサウスウェールズ州で、土地税と地方税の課税標準になる法定地価が、実際の市場価格にどれくらい追随しているかを基準地ごとに示した。", "p3": "州の評価官の長期の基準地の系列（386の基準地、1996〜2026年）を180万件の売買記録と結び、130の住宅の基準地を2017〜2025年の同じ郊外の住宅と更地の売買と比べた（抄録）。", "p5": "2025年の基準地の地価は郊外の住宅価格の中央値に対してシドニーで65%、内陸の町で36%だった。2017〜2025年に基準地の69%で地価が住宅価格より速く上がり、比較できる更地の売買では地価は売買価格の中央値0.79倍だった（抄録）。", "fun": "土地にかかる税金は、役所が決めた「土地の値段」に税率を掛けて計算する。その値段が実際の売買価格とどれくらい合っているかは、納税者にとって大事なのに、公開された証拠は少なかった。この研究は大量の売買記録と突き合わせた。建物は古くなって価値が下がるが土地は下がらないので、土地の値段のほうが家全体より速く上がるという説明も納得できる。", "unverified": "更地との比較は正式な比率調査ではなく、評価日と売買日のそろえ方に敏感だと著者が断っている。査読を経ていない作業論文である。"}}, {"id": "pr34", "rank": 34, "headline": "工程遅延リスクの予測はプロジェクト単位の検証で評価", "title": "Project Heterogeneity and Temporal Drift in Data-Driven Infrastructure Schedule-Risk Prediction: A Project-Held-Out Evaluation", "url": "https://doi.org/10.20944/preprints202611.2010.v1", "authors": "Malek Alazzam ほか", "venue": "Preprints.org", "date": "2026-11-23", "apa": "Alazzam, M., & Harahsheh, K. (2026). Project Heterogeneity and Temporal Drift in Data-Driven Infrastructure Schedule-Risk Prediction: A Project-Held-Out Evaluation. https://doi.org/10.20944/preprints202611.2010.v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Preprints.org（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "インフラ工事の作業の遅れを予測する機械学習モデルが、別のプロジェクトや後の時期でも通用するかを、プロジェクトを丸ごと取り置く方法で検証した。", "p3": "271のインフラ事業の148,087件の作業のデータで、ロジスティック回帰と勾配ブースティングを、通常の学習とプロジェクトの重みをそろえた学習で比べた。5分割のプロジェクト取り置き検証、時間的な検証、確率の較正などで評価した（抄録）。", "p5": "標準の勾配ブースティングのAUROCは0.633、プロジェクトをそろえた学習も0.632で、後者はプロジェクト単位の確率の正確さが良かった。時間的な検証では一部の構成で性能が大きく落ちた（抄録）。", "fun": "工事の遅れを予測するAIを、同じ工事のデータの一部で試すと良い成績が出やすい。でも実際に使うのは、まだ見たことのない別の工事だ。この研究は、工事を丸ごと試験用に取り分けるという厳しい試し方をした。すると成績は控えめで、時期がずれるとさらに落ちる場合があった。正直な試験をすると実力が見えるという教訓が面白い。", "unverified": "時間的な検証で性能がどれだけ落ちたかの数値は抄録になく未確認。査読前の原稿である。"}}, {"id": "pr35", "rank": 35, "headline": "水道のサイバー被害を自治体財政の損失として定量化", "title": "Cyber-Financial Risk Quantification in U.S. Municipal Water Infrastructure: Integrating Operational Technology Risk into Public-Sector Financial Planning", "url": "https://doi.org/10.2139/ssrn.7717721", "authors": "Silvia Asakpa ほか", "venue": "SSRN", "date": "2026-11-23", "apa": "Asakpa, S., E. Daramola, O., M. Ibrahim, I., A. Fuad, W., & Ukoima, G. (2026). Cyber-Financial Risk Quantification in U.S. Municipal Water Infrastructure: Integrating Operational Technology Risk into Public-Sector Financial Planning. https://doi.org/10.2139/ssrn.7717721", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "米国の自治体の水道がサイバー攻撃で止まった場合の損失を、施設の規模や財政の力と結びつけて、条件つきの金額として見積もる枠組みを作った。", "p3": "環境保護庁の調査の3,518の水道事業体（観測された更新需要は313.405、単位は十億ドル）を集計し、事業体の記録や国勢調査の財政記録と結び、稀な事象の損失モデルと対策への投資の分析を組み合わせた（抄録）。", "p5": "更新需要は強く集中し（ジニ係数0.786）、上位10%の事業体が67.34%を占める。破壊的な事象の発生率を5%とする想定で、年間の期待損失の中央値は14,397ドル、CVaR 0.95の中央値は287,935ドルで、裾の負担の中央値は年間の水道収入の2.19%に当たる（抄録）。", "fun": "水道のポンプや弁を動かすコンピュータが攻撃されると、水が止まり、復旧にお金がかかる。でも「どれくらいのお金か」を市の予算に書き込めるように計算した例は少ない。この研究は、めったに起きないが起きると大きい損失を、平均だけでなく悪い場合の金額でも示した。予算が小さいうちは、対策の選び方が目的によって変わるという結果も面白い。", "unverified": "損失の金額は発生率や被害の大きさの仮定に強く依存すると著者が述べており、実際の被害データでの検証は抄録からは確認できない。"}}, {"id": "pr36", "rank": 36, "headline": "価格通知アプリで消費者の探索が6倍超に", "title": "Platform Design, Search Intensity, and Asymmetric Consumer Search&nbsp;", "url": "https://doi.org/10.2139/ssrn.7721758", "authors": "David P. Byrne ほか", "venue": "SSRN", "date": "2026-11-23", "apa": "Byrne, D. P., de Roos, N., Lewis, M. S., Wu, X., & Yang, C. J. (2026). Platform Design, Search Intensity, and Asymmetric Consumer Search&nbsp; https://doi.org/10.2139/ssrn.7721758", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "ガソリン価格の公開が義務づけられた市場で、価格を知らせる仕組みの作り（ウェブサイトか、位置情報と通知つきのアプリか）が、消費者の探索と価格競争を大きく変えることを示した。", "p3": "政府が各スタンドの価格の即時公開を義務づけたあと、まず手動で場所を検索するウェブサイト、1年後に位置情報と自動通知のあるアプリが導入された。この順番を利用し、ウェブサイトとアプリの実時間の探索と価格のデータで分析した（抄録）。", "p5": "アプリは長期の探索の強さを6倍超に増やした。探索は1リットル1セントの値上がりに対して、同じ幅の値下がりより150%多い。アプリの導入は、公開義務のない近隣の市場に比べて1リットル2.4セント（1.8%）の値下がりと関連した（抄録）。", "fun": "ガソリンの値段を国がネットで公開しても、自分で場所を打ち込んで調べるのは面倒で、あまり見られない。ところが近くのスタンドの値段が動いたら知らせてくれるアプリにしたら、調べる回数が6倍を超えた。同じ情報でも、届け方ひとつで人の行動も店どうしの競争も変わる。値上がりのときのほうがよく調べる、という人間らしい偏りも面白い。", "unverified": "対象の国・地域と観測期間は抄録からは分からず未確認。査読前の原稿である。"}}, {"id": "pr37", "rank": 37, "headline": "AI要約は投稿の質を上げても作り手を不利にしうる", "title": "The Economics of AI Summaries on Content-commerce Platforms", "url": "https://doi.org/10.2139/ssrn.7723658", "authors": "Qiaoyun Zhou ほか", "venue": "SSRN", "date": "2026-11-23", "apa": "Zhou, Q., & Liu, D. (2026). The Economics of AI Summaries on Content-commerce Platforms. https://doi.org/10.2139/ssrn.7723658", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "商品についての利用者の投稿を見せる前にAIの要約を表示する販売の場で、要約をどれだけ詳しくするかが、場と投稿者の損得をどう変えるかを理論モデルで示した。", "p3": "場がAI要約の情報量を選び、競い合う投稿者（クリエイター）が投稿の質を選ぶゲーム理論のモデルを作って均衡を分析した（抄録）。", "p5": "通常の投稿の閲覧あたりの広告収入が十分に低いと、場はAI要約を導入する。要約は投稿の質を上げるが、質への投資の費用が手数料収入の増加を上回ると投稿者は損をする。手数料率が高いと、場は要約の情報量をむしろ減らすことがある（抄録）。", "fun": "通販サイトで、たくさんの口コミの上に「AIによる要約」が出ることが増えた。買う人には便利だが、口コミや紹介動画を作っている人は読まれなくなるかもしれない。この研究は数式のモデルで、要約があると作り手はより良い内容を作るようになるのに、かえって損をする場合があることを示した。便利さの裏で、誰が得をして誰が損をするかを考えさせる。", "unverified": "理論モデルの研究で、実際のデータでの検証は抄録からは確認できない。査読前の原稿である。"}}, {"id": "pr38", "rank": 38, "headline": "ガーナの家族介護者の介護満足には男女差がある", "title": "Gender differences in caregiving satisfaction among informal caregivers of older adults in the Ashanti Region of Ghana: Prevalence and associated factors", "url": "https://doi.org/10.21203/rs.3.rs-10619891/v1", "authors": "Williams Agyemang-Duah ほか", "venue": "Research Square (In Review)", "date": "2026-11-23", "apa": "Agyemang-Duah, W., Atongo, F. A., Adongo, A. A., Adamki, M., Hagan, E. D. L., Peprah, M. A., & Peprah, P. (2026). Gender differences in caregiving satisfaction among informal caregivers of older adults in the Ashanti Region of Ghana: Prevalence and associated factors. https://doi.org/10.21203/rs.3.rs-10619891/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Square（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "ガーナの高齢者の家族介護者で、介護に満足を感じている人の割合と、それに関連する要因が男女でどう違うかを示した。", "p3": "アシャンティ州で、雪だるま式の抽出で集めた50歳以上の高齢者の介護者1,853人の横断調査を行い、ロートンの介護評価の2因子モデルに沿って、全体と男女別にロジスティック回帰を当てはめた（抄録）。", "p5": "90.12%が介護に満足していると答え、男性（92.23%）は女性（89.34%）よりわずかに高かった。女性では自己評価の健康の良さと、配偶者ではなく親・きょうだい・祖父母の介護が満足と関連し、男性では年齢だけが有意だった（抄録）。", "fun": "家族の介護というと、負担や疲れの話になりがちだ。この研究は逆に「介護に満足を感じているか」を尋ね、ガーナでは9割が満足と答えた。面白いのは、満足を左右するものが男女で違うことで、女性は自分の健康や誰を介護しているかが、男性は年齢が関係していた。同じ介護でも、立場によって受け止め方の仕組みが違うらしい。", "unverified": "雪だるま式の抽出のため、割合が地域全体を代表するとは限らない。横断調査で因果は分からない。査読前の原稿である。"}}, {"id": "pr39", "rank": 39, "headline": "食料不安と社会的つながりの弱さが重なると受診も減る", "title": "Intersecting Trajectories of Food Insecurity and Social Network Vulnerability Across Mid- and Later Life: Associations with Health and Healthcare Utilization in Indonesia", "url": "https://doi.org/10.21203/rs.3.rs-11276890/v1", "authors": "Yosephin Anandati Pranoto ほか", "venue": "Research Square (In Review)", "date": "2026-11-23", "apa": "Pranoto, Y. A., Vaezghasemi, M., Hurtig, A.-K., & Schröders, J. (2026). Intersecting Trajectories of Food Insecurity and Social Network Vulnerability Across Mid- and Later Life: Associations with Health and Healthcare Utilization in Indonesia. https://doi.org/10.21203/rs.3.rs-11276890/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Square（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "インドネシアの中高年で、食料不安と社会的なつながりの弱さが重なった人は、孤独を感じやすく、医療の利用も少ないことを示した。", "p3": "インドネシア家族生活調査の第4波（2007/08年）と第5波（2014/15年）の40歳以上6,786人の縦断データで、食料不安と社会的ネットワークの変化の組み合わせと、身体・精神・認知・機能・医療利用の幅広い結果との関連を調べた（抄録）。", "p5": "食料不安のある人は過体重のオッズが高く、食料不安と脆弱なネットワークの両方がある群で関連が最も強かった。この群は孤独のオッズも高く、医療の利用が有意に少なかった。食料不安は、保護的なネットワークがある人でも抑うつ症状の高さと関連した（抄録）。", "fun": "食べ物に困ることと、頼れる人が少ないことは、別々の問題に見える。この研究は同じ人たちを2つの時点で追い、2つが重なると不利がいっそう強まることを示した。意外なのは、食べ物に困っている人のほうが太りすぎになりやすいという結果だ。食料の支援だけでは足りず、人のつながりも支える必要があるという主張につながる。", "unverified": "オッズ比などの具体的な数値は抄録になく未確認。査読前の原稿である。"}}, {"id": "pr40", "rank": 40, "headline": "社会的インフラは運営と日常の実践があって結束を生む", "title": "Case Study Paper: Planning and Urban Design for Living Infrastructure: A Framework for Governance, Stewardship and Everyday Practices to Strengthen Social Cohesion", "url": "https://doi.org/10.21203/rs.3.rs-11640747/v1", "authors": "Patricia Aelbrecht ほか", "venue": "Research Square (In Review)", "date": "2026-11-23", "apa": "Aelbrecht, P., Sezer, C., Dekker, K., & Landman, K. (2026). Case Study Paper: Planning and Urban Design for Living Infrastructure: A Framework for Governance, Stewardship and Everyday Practices to Strengthen Social Cohesion. https://doi.org/10.21203/rs.3.rs-11640747/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Square（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "図書館や大学のような社会的インフラが地域の結束を生むには、施設だけでなく、運営、世話をする人、日々の使われ方までを一体で考える必要があるとし、「生きたインフラ」という枠組みを示した。", "p3": "社会的インフラの研究ネットワークと学会の討論から生まれた実務の論文で、ロンドンのケンティッシュ・タウン図書館、ドイツのアーヘン工科大学、メルボルン都市圏のノースフィールド、プレトリアのマックルヌーク・コモンズの4つの事例を比べた（抄録）。", "p5": "5つの原則を提案する。孤立した施設ではなく市民の生態系を計画する、日常の実践で場所を活かす、統治と世話をインフラの一部として扱う、適応と学びのために設計する、サービスの量を超えて社会的な価値を評価する（抄録）。", "fun": "立派な公民館を建てても、人が集まらなければ地域のつながりは生まれない。この論文は、建物よりも「誰が世話をし、ふだん何に使われているか」が大事だと考える。4つの国の事例を並べて、インフラを完成品ではなく、世話をし続ける生き物のようにとらえ直す発想が面白い。", "unverified": "事例の比較による提案で、原則の効果を数値で確かめた検証は抄録からは確認できない。査読前の原稿である。"}}, {"id": "pr41", "rank": 41, "headline": "炊き出しの場ではケアが条件つきでやり取りされる", "title": "Leftovers and Conditional Care in a Rotterdam Soup Kitchen", "url": "https://doi.org/10.31235/osf.io/d9ap3", "authors": "Kevin Pijpers", "venue": "SocArXiv", "date": "2026-11-22", "apa": "Pijpers, K. (2026). Leftovers and Conditional Care in a Rotterdam Soup Kitchen. https://doi.org/10.31235/osf.io/d9ap3", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SocArXiv（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "ロッテルダムの炊き出しの場で、食事という支援が無条件に配られるのではなく、日々のやり取りの中で条件つきで交渉されている様子を描いた。", "p3": "9か月間、ボランティアとして働きながら参与観察を行い、複数の来訪者から作った3人の人物像（スーザン、ファヒド、ジョン）を通して記述した（抄録）。", "p5": "食べ物の持ち帰りを禁じる規則との駆け引き、ボランティアと牧師を差別的だと呼んだあとの利用停止、市民権と健康保険の登録をめぐるやり取りの場面から、公的な安全網が退いた場所で来訪者とボランティアがケアを即興で作っていること、そのケアは主に今をしのぐ助けにとどまることを示した（抄録）。", "fun": "炊き出しは「困っている人に食事を出す」という単純な善意に見える。でも現場では、持ち帰っていいか、誰が出入りできるかをめぐって、小さな交渉が毎日起きている。この研究は数字ではなく、9か月通って見聞きした場面から、助けることにも条件や線引きがつきまとうことを描く。善意の場にも規則と力関係があるという見方が面白い。", "unverified": "人物像は複数の来訪者を合成したもので、個別の事実ではない。フィールドノートの報告で、査読を経ていない。"}}, {"id": "pr42", "rank": 42, "headline": "日常の記録から社会的複雑さの指数を算出", "title": "The Social Complexity Index: Development and Face Validation of a Routinely Computable Measure of Social Complexity to Support Allocation of Community Midwifery Time", "url": "https://doi.org/10.2139/ssrn.7730379", "authors": "Neil Cockburn ほか", "venue": "SSRN", "date": "2026-11-23", "apa": "Cockburn, N., Bennet, B., Lester, A., Mallinson, L., Basra, R., & Taylor, B. (2026). The Social Complexity Index: Development and Face Validation of a Routinely Computable Measure of Social Complexity to Support Allocation of Community Midwifery Time. https://doi.org/10.2139/ssrn.7730379", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRN（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "妊婦の社会的な困難の重なり（社会的複雑さ）を、病院の記録から自動で計算できる指数にまとめ、地域の助産師の時間の配分に使えるようにした。", "p3": "イングランドの1つの病院組織で、2023年1月〜2026年4月に始まった妊娠の電子記録を使い、予約時に記録される16の社会的リスク指標の重みつきの合計を指数とした。経験のある助産師2人が、指数を見ずに30件の記録を評価した（抄録）。", "p5": "29,324件の妊娠のうち47.4%が0点、23.7%が1点、28.9%が2点以上だった。段階に分けた点数は助産師の合意した評価とよく一致し（2次の重みつきカッパ0.87）、4点以上の割合は診療所によって1%未満から15%まで開いた（抄録）。", "fun": "助産師の担当は、ふつう妊婦さんの人数が同じになるように割り振る。でも、言葉が通じにくい、心の不調があるなど、事情の重なった人には多くの時間がかかる。この研究は、すでに記録されている16の項目を重みをつけて足し合わせるだけの点数が、ベテラン助産師の見立てとよく合うことを示した。単純な足し算が専門家の判断に近いというのが意外だ。", "unverified": "専門家の評価と比べたのは30件だけで、1つの病院組織のデータである。指数が実際の仕事量を予測するかは抄録からは確認できない。"}}, {"id": "pr43", "rank": 43, "headline": "単語埋め込みにSEMを当てテキストで構成概念を測る", "title": "Structural Equation Modeling with Word-Embedding for Text-Based Measurement", "url": "https://doi.org/10.31234/osf.io/648f2", "authors": "Artur Pokropek ほか", "venue": "PsyArXiv", "date": "2026-11-22", "apa": "Pokropek, A., Plisiecki, H., Flakus, M., Waszkowski, A., Małyska, K., & Żółtak, T. (2026). Structural Equation Modeling with Word-Embedding for Text-Based Measurement. https://doi.org/10.31234/osf.io/648f2", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXiv（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "文章から心理や社会の構成概念を測るときに、単語の埋め込みの相関行列に構造方程式モデルを当てはめ、負荷量や信頼性などの測定の性質を評価できる方法SEM-WEを提案した。", "p3": "各構成概念をいくつかの指標の語や句で表し、中心化したコサインの行列を入力にして、負荷量、残差、適合度、信頼性、構成概念間の関係を推定する。合成のコーパス、文章とリッカート尺度を併せた調査、Xの実際の投稿で検証した（抄録）。", "p5": "辞書による数え上げ、埋め込みの重心、言語モデルによる注釈などの6つの方法を比べ、SEM-WEは基準の符号と順序を他の方法と同等以上に再現した。大規模な言語モデルも合成と調査の研究では良い成績だったが、計算の費用がはるかに高い（抄録）。", "fun": "アンケートなら「この数問は同じものを測っているか」を統計で確かめられる。でもSNSの投稿のような文章から不安や信頼を測るときは、そうした点検が省かれがちだ。この研究は、言葉を数の並びに変える技術の上に、アンケートと同じ点検の道具を載せた。文章の分析にも、物差しの正しさを確かめる作法を持ち込む発想が面白い。", "unverified": "比較の具体的な数値と、使った埋め込みモデルは抄録になく未確認。査読前の原稿である。"}}, {"id": "pr44", "rank": 44, "headline": "模擬の認知行動療法で関係のほころびと修復を再現", "title": "Alliance Rupture and Repair in Simulating Cognitive Behavioral Therapy Dialogues", "url": "https://arxiv.org/abs/2611.27544", "authors": "Jian Chai ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Chai, J., Yang, Y., Liu, S., Wang, Y.-C., & Lee, Y.-C. (2026). Alliance Rupture and Repair in Simulating Cognitive Behavioral Therapy Dialogues (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27544", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivに登録された抄録を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "認知行動療法の模擬対話で、来談者とカウンセラーの協力関係のほころびと、その修復、計画の立て直しまでを再現できるシミュレーションの枠組みALLYを作った。", "p3": "来談者役に、どれだけ率直に関わるかを決める隠れた「同盟の状態」を持たせる。カウンセラー役は対話しか見えず、来談者が引いたり反発したりしたことに気づいて関係を修復し、残りの面接を組み直す（抄録）。", "p5": "自動評価で、ALLYのカウンセラーは既存の公開の合成データより、方略の流れと感情の動きが実際のカウンセラーに近く、面接の質（CTRS）と対人技能（FIS-T）の総合評価が最も高かった。免許を持つ療法家20人の評価でも、ほころびはもっともらしく、修復と再計画はおおむね適切とされた（抄録）。", "fun": "カウンセリングでは、相談者が急に黙ったり反発したりして、信頼関係にひびが入ることがある。上手なカウンセラーはそれに気づき、関係を直してから先に進む。これまでのAIの練習相手は抵抗する相談者は演じても、信頼の上がり下がりまでは持っていなかった。心の中の見えない状態を持たせ、相手には会話からしか分からないようにした設計が面白い。", "unverified": "評価の具体的な数値と、使った言語モデルは抄録になく未確認。"}}, {"id": "pr45", "rank": 45, "headline": "汎用LLMのキャリア助言は本人の主体性を損ねやすい", "title": "Gender and Agency in AI Career Guidance for Women: A Socio-Technical Audit of General-Purpose Language Models", "url": "https://doi.org/10.31234/osf.io/2hbe4", "authors": "Sara Portell Fonolla ほか", "venue": "PsyArXiv", "date": "2026-11-23", "apa": "Portell Fonolla, S., & Fassi, Y. E. (2026). Gender and Agency in AI Career Guidance for Women: A Socio-Technical Audit of General-Purpose Language Models. https://doi.org/10.31234/osf.io/2hbe4", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "PsyArXiv（Crossrefに登録された抄録）を使用。本文は読んでいない", "preprint": true, "short": true, "p1": "ChatGPT・Gemini・Claudeが女性に行うキャリアの助言を多ターンの会話で監査し、性別による偏りよりも、本人の決める力を損なう失敗のほうが多いことを示した。", "p3": "女性のキャリアの研究に基づく34の多ターンの会話の台本を各システムで5回ずつ実行し、うち14には男性版を加えた（972の会話）。人の評定者が304の会話を9つの目標で採点した。事前登録された監査である（抄録）。", "p5": "本人の主体性を保てない失敗がどのシステムでも最も多かった（0〜3の尺度で1以上の会話が36%〜50%）。利用者の性別を入れ替えても系統的な差はなかった。LLMの審査員はどれも人の評定者と許容できる水準で一致しなかった（抄録）。", "fun": "仕事の悩みをAIに相談すると、親切に答えてくれる。でもこの研究によると、AIは相談した本人の代わりに決めてしまったり、職場の壁を「あなたの自信が足りないから」と言い換えてしまったりしやすい。男女で答えを変える偏りよりも、相手の決める力を奪う失敗のほうが多かったというのが意外だ。良い助言とは何かを考えさせる。", "unverified": "人の評定者どうしもしばしば不一致で、割合は記述的なものだと著者が断っている。査読前の原稿である。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "エージェント型AIへの曝露が高い企業ほど求人が減る", "title": "The Rise of Agents and the Human Labor Market", "url": "https://arxiv.org/abs/2611.27210", "authors": "Nicola Borri ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Borri, N., Cheremukhin, A., Liu, Y., & Tsyvinski, A. (2026). The Rise of Agents and the Human Labor Market (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27210", "why": "OpenRouterの約2,000兆トークンの利用実績（うちエージェント用途1,100兆）と米国上場企業の求人3,480万件を結び、株価とエージェント型AIの利用量の連動から企業の曝露を測った。曝露が1標準偏差高い企業は、求人の伸びが半年で2.11%、9か月で3.20%低い。Claude Code 2.0の公開を使ったイベント分析でも同じ向きの結果で、減少は上級職以外に集中する。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（データの§2.1〜2.2、手法の§3、結果の§4.1〜4.2の冒頭）を読んだ。職種・産業別の結果と頑健性の確認の節は読んでいない", "preprint": true, "p1": "AIエージェント（道具を呼び出して自律的に作業するAI）の普及が企業の求人をどう変えているかを、実際のAIの利用量と株価から測った企業ごとの曝露で示し、曝露の高い企業ほど求人の伸びが低いことを明らかにした（抄録）。", "p2": "AIの雇用への影響について、実際に使われた量に基づく、経済全体・複数のAIモデルにまたがる証拠がなかった。著者はこれを初めて示すとしている（抄録、§1）。", "p3": "OpenRouterの約2千兆トークンの利用記録から、道具の呼び出しで終わる応答のトークンをエージェント用途と定義し、その週次の伸び率をエージェント因子とする。各企業の株式の週次の超過収益をこの因子に回帰した係数（26週の窓）を曝露とし、その後3・6・9か月の求人の伸びを、月の固定効果つきのパネル回帰で説明する（§2.1〜2.2、§3）。", "p4": "米国の上場企業の求人34.8百万件（Lightcast）を対象に、曝露の1標準偏差の差に対する求人の伸びの差を見る。Claude Code 2.0の公開（2025年9月29日）を使うイベント分析では、公開前の曝露で企業を比べる。広いAI利用への曝露との比較も行う（抄録、§3、§4.2）。", "p5": "曝露が1標準偏差高い企業は、求人の伸びが6か月で2.11%、9か月で3.20%低い。Claude Code 2.0の公開前の曝露が1標準偏差高い企業は、公開後6か月の伸びが4.73%低い。減少は上級職以外に集中する。広いAI利用への曝露は、エージェントへの曝露を統制すると有意な関係がない（抄録）。", "p6": "曝露は株価の連動から推定した間接的な指標で、成長機会の変化などが株価と求人の両方を動かす懸念を著者自身が挙げ、イベント分析で対処している（§3）。解釈：求人は雇用そのものではない。利用データはOpenRouter経由の分である。", "fun": "AIが自分で道具を使って仕事を進める「エージェント」が広まると、人の仕事は減るのか。この研究は、AIが実際にどれだけ使われたかという記録と、各社の株価の動きを組み合わせた。エージェントの利用の伸びに株価がよく連動する会社ほど、その後の求人の伸びが小さかった。しかも減ったのは主に上級でない職の求人だったという。", "unverified": "§4.3以降（職種・産業別、賃金、投資、頑健性の確認）と表の数値は読んでいない。イベント分析の詳細な仕様も未確認。"}}, {"id": "pn02", "rank": 2, "field": "機械学習", "headline": "多流の残差接続の混ざり具合を幾何学的な収縮で調整", "title": "cmHC: Balancing Stream Mixing in Hyper-Connections via Geometric Contraction", "url": "https://arxiv.org/abs/2611.27193", "authors": "Haowei He ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-23", "apa": "He, H., Zhao, Z., Pan, C., Lin, G., Yang, Z., Wang, C., Liu, X., Yu, K., Gao, H., Li, D., Yang, M., Song, S., & Li, Y. (2026). cmHC: Balancing Stream Mixing in Hyper-Connections via Geometric Contraction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27193", "why": "残差接続を複数の流れに広げるmHCで、流れを混ぜる行列が二重確率行列の多面体の頂点に寄ると流れが独立に、中心に寄ると区別がつかなくなるというトレードオフを理論的に示した。多面体を内側へ幾何学的に縮めるcmHCを提案し、新しいパラメータ化なしで混合の下限を保証する。Hugging Faceの注目論文で今日最も票を集めた。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、手法の§2.2、実験の§4の主要部分）を読んだ。理論の節と付録は読んでいない", "preprint": true, "p1": "ニューラルネットの残差接続を複数の流れに広げたハイパーコネクションで、流れどうしの混ざり方が足りなくても多すぎても良くないことを示し、混ぜる行列の取りうる範囲を幾何学的に縮めて適度に混ぜる方法cmHCを提案した（§1、§2.2）。", "p2": "流れを混ぜる行列を二重確率行列に制約するmHCは学習を安定させるが、行列が置換行列の近くにとどまり、流れが入れ替わるだけで混ざらない（混合不足）。逆に混ぜすぎると流れどうしの区別がなくなるという問題は、ほとんど調べられていなかった（§1）。", "p3": "置換行列を、係数λで一様な行列の方向へ少しなめらかにした行列に置き換える。こうすると行列は二重確率のまま、どの入力の流れもどの出力の流れに必ず正の重みで寄与する（Theorem 2.1、2.2）。新しい学習パラメータは要らない。縮める強さと縮める層の数が累積の混合を決めるので、浅い層だけに穏やかな収縮をかける（§2.2、§3.3）。", "p4": "GPT-2系のモデルでOpenWebTextとFineWeb-Eduの言語モデル化の損失を、通常の残差接続、元のHC、mHC、mHC-lite、KromHCと比べる。収縮の強さλと適用する層の数Kの切り分け、6Bと300Bのパラメータ規模の混合エキスパート型での検証も行う（§4）。", "p5": "λ=0.97、K=2の構成が両データセットで平均の損失の順位が最良だった（表1）。穏やかな収縮（0.97）は強い収縮（0.70）を一貫して上回り、その差は層が12から48に増えると拡大した。浅い層への収縮は深い層への収縮より損失が低かった（表2、§4.2）。専用の演算器により実行の遅延は最大44.8%減った（抄録）。", "p6": "損失の差は小さい（例：検証損失の差0.0073）。300B規模の結果の詳細と、下流の課題での性能は読んだ範囲では確認できなかった（未確認）。解釈：最適な収縮の強さと層の数は経験的に選ばれており、別の構造での最適値は分からない。", "fun": "深いニューラルネットでは、情報を先の層へ届ける近道が学習の安定に欠かせない。最近はその近道を何本かに増やし、途中で混ぜ合わせる工夫がある。ところが、混ぜ方が足りないと何本あっても別々に走るだけになり、混ぜすぎると全部が似た中身になってしまう。この研究は、入り口に近い層だけで穏やかに混ぜるのがよいという落としどころを、理論と実験で示した。", "unverified": "§3の理論の証明、§4.3〜4.4の大規模モデルと演算器の詳細、付録は読んでいない。"}}, {"id": "pn03", "rank": 3, "field": "統計学", "headline": "事前学習済みモデル1回の計算で効率的な統計的推論", "title": "Can pretrained Transformers deliver semiparametrically efficient inference?", "url": "https://arxiv.org/abs/2611.27666", "authors": "Han Yan ほか", "venue": "arXiv", "date": "Mon, 23 Nov 2026", "apa": "Yan, H., Zhu, J., Shi, C., & Wang, T. (2026). Can pretrained Transformers deliver semiparametrically efficient inference? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.27666", "why": "セミパラメトリックモデルの推定では、推定対象ごとの影響関数の補正と局外母数の推定が必要だった。真の母数だけをラベルに模擬データで事前学習したTransformerが事後平均と共分散を学び、1回の順伝播で推定値とワルド型の信頼領域を返すことを示し、効率性と被覆の漸近的な正確さを証明した。因果推論・部分線形回帰・生存時間解析で実験している。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（手順の§2.2、実験の設定と§4.4〜4.5、抄録）を読んだ。約30万字と長く、理論の節と付録は読んでいない", "preprint": true, "p1": "平均処置効果のような推定の対象について、事前学習したTransformerに標本と「何を推定したいか」を入力するだけで、統計的に効率のよい推定値と信頼領域が1回の計算で得られることを、理論と実験で示した（抄録、§2.2）。", "p2": "セミパラメトリック推定で効率を達成するには、推定対象ごとに影響関数の補正を導き、標本ごとに局外母数を推定し直す必要がある。これを省いて、多くの推定対象に共通に使える方法があるかが問いである（抄録、§1）。", "p3": "事前分布から母集団と推定対象の問い合わせを無作為に引いて模擬データを作り、真の母数だけを正解ラベルにしてTransformerを学習する。損失は推定値と共分散の対についてのガウス型の負の対数尤度で、学習したモデルは事後平均と共分散を返す。評価の標本を入力すると、推定値とワルド型の信頼領域が同時に出る（§2.2）。", "p4": "平均処置効果、部分線形の射影、分位点処置効果、平均生存時間の課題で、100回の独立な反復について平方根平均二乗誤差（RMSE）と95%の信頼領域の実際の被覆率を、CausalPFNや逆確率重みづけなどの方法と比べる。IHDPのデータ（747人、処置139人、共変量25個）でも試す（§4、§4.5）。", "p5": "事前学習したモデルは競合する方法の中でおおむね最小の推定誤差で、被覆率は名目にほぼ等しく、計算は1データセットあたり約0.02秒だった（抄録、§4.4）。IHDPでは分布のずれがある設定でも平均絶対誤差が最小だった（表2）。理論面では、局所的に平坦で複雑さがゆっくり増える事前分布のもとで事後平均が効率的になることを証明した（抄録）。", "p6": "データを生成する分布を固定して考える古典的な頻度論の意味では、事前学習への要求がはるかに厳しくなると著者が述べている（抄録）。考察の節（§5）は読み切れていない。解釈：保証は事前学習に使う事前分布の作り方に依存する。", "fun": "処置の効果をデータから推定するとき、統計学者は問題ごとに専用の補正の式を導く。この研究は、コンピュータの中で作った、答えの分かっている練習問題をAIに大量に解かせておくと、本番のデータを見せただけで、効率のよい推定値と誤差の幅を約0.02秒で返せることを示した。問題ごとの職人技を、練習の積み重ねで置き換える発想だ。", "unverified": "§3の定理の条件と証明、§4.1〜4.3の図の数値、付録は読んでいない。"}}, {"id": "pn04", "rank": 4, "field": "因果推論", "headline": "段階導入の差の差法の推論は有効クラスター数しだい", "title": "How Reliable is Inference in Staggered Difference-in-Differences?", "url": "https://doi.org/10.2139/ssrn.7723858", "authors": "Xing Hu ほか", "venue": "SSRN", "date": "2026-11-23", "apa": "Hu, X., & Sun, Y. (2026). How Reliable is Inference in Staggered Difference-in-Differences? https://doi.org/10.2139/ssrn.7723858", "why": "ファイナンスの上位3誌の2010〜2025年の論文を全数調査し、異質性に頑健な推定量の利用は増えたが有限標本の補正はほとんど使われていないことを示した。推論の信頼性は標本の特徴と推定量の選択で決まる「有効クラスター数」の範囲で評価でき、それに応じて推論方法を変えると誤った棄却が減り、公刊された結果の結論が変わる例もある。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "導入の時期がばらばらな政策の効果を測る「段階導入の差の差法」で、推定値そのものよりも、その誤差の評価（推論）がどこまで信頼できるかを点検し、有効クラスター数に応じて推論の方法を選ぶべきだと示した（抄録）。", "p2": "近年は処置効果の異質性に頑健な推定量が広まったが、推論はクラスター頑健標準誤差だけに頼ることが多く、その信頼性を判断する情報がほとんど報告されていない（抄録）。", "p3": "推論の信頼性は、標本の特徴と研究者が選ぶ推定量の両方で決まる。これらから有効クラスター数（実質的にいくつの独立なかたまりの情報があるか）の区間を求め、通常のクラスター推論が当てにならない場合と、別の推論方法を検討すべき場合を見分ける（抄録）。", "p4": "ファイナンスの上位3誌の2010〜2025年の論文を全数調査し、推定量と推論の実務を集計した。さらにシミュレーションと、公刊された研究の再分析で、推論方法を変えたときの結論と誤った棄却の割合を比べた（抄録）。", "p5": "異質性に頑健な推定量の利用は近年増えているが、有限標本での推論の補正の利用は限られていた。有効クラスター数に合わせて推論を変えると、処置効果についての結論が変わりうるし、誤った棄却が減る。点推定が頑健でも、公刊された知見が推論の選び方に敏感な例があった（抄録）。", "p6": "抄録の範囲では、有効クラスター数の計算式、調査した論文の数、具体的にどの推論方法を勧めるかは分からない（未確認）。対象はファイナンスの論文で、他分野に同じ程度当てはまるかは示されていない。", "fun": "地域ごとに違う年に制度が変わったことを利用して、その効果を調べる研究は多い。でも、たくさんの地域のデータがあっても、実際に結論を左右しているかたまりが少なければ、「偶然ではない」と言える根拠は見かけより弱い。この研究は、実質的にいくつ分の証拠があるのかを測り直す物差しを示し、それを使うと、有名な雑誌に載った結論が変わる場合があることを示した。", "unverified": "本文は入手できず、有効クラスター数の定義、調査の件数、再分析した研究の具体名は未確認。"}}, {"id": "pn05", "rank": 5, "field": "経済学", "headline": "自動化の成長加速は人が担う「弱い環」に抑えられる", "title": "Past Automation and Future AI: How Weak Links Tame the Growth Explosion", "url": "https://doi.org/10.3386/w36050", "authors": "Charles I. Jones ほか", "venue": "NBER Working Paper", "apa": "Jones, C. I., & Tonetti, C. (2026). Past Automation and Future AI: How Weak Links Tame the Growth Explosion (NBER Working Paper No. 36050). National Bureau of Economic Research. https://www.nber.org/papers/w36050", "why": "タスクベースの成長会計で、米国では資本が担うタスクの生産性が労働のそれより年約5ポイント速く伸びてきたことを示した。この歴史的な値で、財とアイデアの生産が内生的に自動化される成長モデルを較正すると、成長は加速し発散もしうるが、労働に残るタスク（弱い環）が加速を遅らせる。AIによる成長の見通しを過去の自動化の実績から規律づける。", "explain": {"basis": "抄録", "basis_note": "本文は取得できず、NBERに登録された抄録を使用", "preprint": true, "p1": "過去の経済成長のうち自動化による分がどれだけかを測り、その実績からAIによる将来の成長を考えると、成長は加速しうるが、人が担い続ける仕事（弱い環）がその加速を抑えることを示した（抄録）。", "p2": "抄録が立てる問いは、過去の成長のどれだけが自動化によるもので、それがAIの将来に何を意味するかである。過去の実績を測ることで、将来の議論を規律づける（抄録）。", "p3": "仕事をタスクに分け、資本が担うタスクと労働が担うタスクの生産性の伸びを別々に測るタスクベースの成長会計を行う。その歴史的な値を使い、財の生産とアイデアの生産が内生的に自動化される成長モデルを較正する（抄録）。", "p4": "米国経済のデータで成長会計を行い、較正したモデルで成長の経路を調べる（抄録。データの期間と較正の詳細は未確認）。", "p5": "米国では、資本のタスクの生産性が労働のタスクの生産性より年に約5ポイント速く伸びてきた。自動化の主な利益は、ゆっくりしか改善しない人の代わりに、急速に改善する機械をより多くのタスクに使えることにある。モデルでは成長は加速し、爆発もしうるが、労働がまだ担うタスクが加速を遅らせる（抄録）。", "p6": "抄録の範囲では、加速の大きさや時期の数値、弱い環の強さを決めるパラメータの値は分からない（未確認）。解釈：結論は、タスクどうしがどれだけ補い合うかという仮定に左右されると考えられる。", "fun": "鎖の強さは、いちばん弱い輪で決まる。経済も似ていて、多くの仕事を機械が速くこなせるようになっても、人が担う仕事が残っていれば、全体の速さはそこで抑えられる。この研究は、過去の機械化で機械の側の生産性が人の側より年に約5ポイント速く伸びてきたことを測り、AIの時代にも同じ「弱い輪」が成長の加速を遅らせると論じている。", "unverified": "本文は入手できず、成長会計の期間、モデルの式、較正の値、成長の加速の数値は未確認。"}}, {"id": "pn06", "rank": 6, "field": "組織行動・心理的安全性", "headline": "AIの相棒を2体に増やすと人のアイデア投稿が減る", "title": "Adding One Mo
