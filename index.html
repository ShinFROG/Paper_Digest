"preprint": false, "p1": "オンラインレビューと構造化された調査で、顧客満足が他の属性とどう結びついて表れるか（関係の構造）を比べ、両者が同じ満足を異なる形で表す「声と証拠のずれ」を示した（抄録）。", "p2": "企業はオンラインレビューと調査を並行する傾聴の仕組みとして使うが、両者を満足の指標として互換に使えるかは実証的に未解決だった（抄録）。", "p3": "研究1で10,752件のオンラインレビューから一緒に言及される体験の手がかりの共起ネットワークを、研究2で506件の調査回答から事前に決めた属性の偏相関ネットワークを作り、満足の位置と結びつき方を比べた（抄録）。解釈：レビューは客が自発的に書いた「声」、調査は質問への回答という「証拠」で、測り方で満足の見える構造が変わるかを問う設計である。", "p4": "評価は、満足が属性のクラスターの中にどれだけ埋め込まれているか、ネットワーク全体の連結性、満足と他の属性をつなぐ橋渡しの属性である（抄録）。", "p5": "レビューの共起ネットワークでは満足は一緒に言及される体験の属性のクラスターに埋め込まれ、衛生などの体験の手がかりと密接だった。調査の偏相関ネットワークでは満足のクラスターへの局所的な埋め込みは弱いが全体の連結性は強く、専門性が体験の属性と満足をつなぐ主な橋渡しだった（抄録）。", "p6": "著者は、1つのデータ源だけでは満足の表現が不完全になりうるとする（抄録）。解釈：レビューと調査の対象（業種・施設・時期）が同じかは抄録からは確認できず、違いがデータ源でなく対象の違いによる可能性が残る。", "fun": "お客さんの満足を知るには、口コミサイトのレビューを読む方法と、アンケートを取る方法がある。この研究は、2つの方法で「満足」が何と結びついて語られるかを網の目の図で比べた。口コミでは清潔さなどの体験と一緒に語られ、アンケートでは「プロらしさ」が満足への橋渡しになっていた。同じ満足でも、聞き方で見え方が変わる点が面白い。", "unverified": "出版社の本文は入手できず、対象の業種・施設、ネットワークの指標の数値は確認できなかった。"}}, {"id": "jr08", "rank": 8, "headline": "気候政策の不確実性が定型的な開示を増やす", "title": "Climate policy uncertainty and corporate boilerplate information disclosure strategies: a perspective on attention-based view", "url": "https://doi.org/10.1108/sampj-01-2026-0173", "authors": "Yunge Hu ほか", "venue": "Sustainability Accounting, Management and Policy Journal", "date": "2026-11-19", "sjr": 1.808, "citescore": 15.7, "citescore_year": "2025", "apa": "Hu, Y., Wang, D., & Li, Y. (2026). Climate policy uncertainty and corporate boilerplate information disclosure strategies: a perspective on attention-based view. Sustainability Accounting, Management and Policy Journal, 1–38. https://doi.org/10.1108/sampj-01-2026-0173", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社のサイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "中国のA株上場企業の2008〜2022年のデータで、気候政策の不確実性が高まると、企業が気候移行の情報を定型文（ボイラープレート）で開示する程度が高まることを示した（抄録）。", "p2": "気候政策が不確実なとき、企業は外部の圧力に応じて開示の戦略を変え、実質的な移行の情報を隠して資本の誤配分を招くおそれがあるが、開示の「定型さ」に注目した研究は乏しかった（抄録）。", "p3": "注意に基づく企業観（attention-based view）に基づき、気候政策の不確実性と気候移行情報の定型的な開示の度合いの関係を推定し、実質的な環境投資と経営者のリスク回避を媒介の経路、組織の慣性・デジタル化・CEOの政治的背景を調整の要因として分析した（抄録）。解釈：先が読めないとき、企業は具体的に約束せず、どの企業にも当てはまる決まり文句で済ませるという仮説である。", "p4": "評価は、不確実性の係数の符号と有意性、媒介と調整の効果である（抄録）。定型度の測り方と統制変数は抄録からは確認できない。", "p5": "気候政策の不確実性の高まりは定型的な開示の度合いを有意に高めた。経路は実質的な環境投資の抑制と経営者のリスク回避の強化で、組織の慣性は効果を強め、企業のデジタル化とCEOの政治的背景は効果を弱めた（抄録）。", "p6": "解釈：気候政策の不確実性の指標の作り方と、定型度のテキスト指標の妥当性は抄録からは確認できない。中国の制度に特有の結果である可能性もあり、他国への一般化には注意が要る。", "fun": "環境への取り組みを報告する文章が、どの会社も似たような決まり文句ばかりだったら、読む人は本当の姿が分からない。この研究は、国の気候政策の先行きが不透明になると、会社がこうした「当たり障りのない文章」を増やすことを示した。先が読めないと具体的な約束を避けるという、人間にもありがちな行動が会社の報告書にも表れる点が面白い。", "unverified": "出版社の本文は入手できず、定型度と不確実性の指標の作り方、効果の大きさは確認できなかった。"}}, {"id": "jr09", "rank": 9, "headline": "同じ職務特性が挑戦要求とも資源とも映る", "title": "Shared characterizations of challenging demands and job resources across O*NET element classifications", "url": "https://doi.org/10.1108/omj-12-2025-2881", "authors": "Alicia Stachowski ほか", "venue": "Organization Management Journal", "date": "2026-11-19", "sjr": 0.642, "citescore": 5.7, "citescore_year": "2025", "apa": "Stachowski, A., Kulas, J. T., & García Prieto Palacio Roji, R. (2026). Shared characterizations of challenging demands and job resources across O*NET element classifications. Organization Management Journal, 1–22. https://doi.org/10.1108/omj-12-2025-2881", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社のサイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "O*NETの職務特性ごとに、資源・挑戦的な要求・阻害的な要求としての評価を働く人568人に尋ね、同じ特性が要求とも資源とも受け止められることと、資源が要求の悪影響を緩衝することを示した（抄録）。", "p2": "職務特性の研究では特性を事前に資源か要求かに分類することが多いが、働く人が同じ特性をどう受け止めるかには幅があり、その分類が妥当かは検証されていなかった（抄録）。", "p3": "Prolificで募った568人が自分の主な仕事について答えるオンライン調査で、仕事がO*NETの各職務特性を含むかに応じて分岐する設問により、該当する特性ごとに資源・挑戦的な要求・阻害的な要求の程度を評価させ、O*NETの分類を保った2つの集計の水準で分析した（抄録）。解釈：仕事の要求度-資源モデルで、特性を「要求」と決め打ちせず本人の評価で分類する設計である。", "p4": "評価は、特性の評価の重なり（資源と挑戦の同時の認識）、肯定的・否定的な結果（ワーク・エンゲイジメント、ストレス、燃え尽き）との関連、資源による調整（緩衝）効果である（抄録）。", "p5": "職務特性は資源か要求のどちらか一方に分類されず、挑戦的と見なされるものは資源とも解釈されることが多かった。経験された資源が多いほど、挑戦とエンゲイジメントの関係、阻害とストレス・燃え尽きの関係が調整された（抄録）。", "p6": "解釈：オンラインのパネルの横断的な自己報告で、共通方法による偏りと因果の向きの問題が残り、効果の大きさは抄録からは確認できない。", "fun": "仕事の「大変さ」と「助けになるもの」は、はっきり分けられると思われがちだ。ところが働く人に聞くと、手ごたえのある難しい仕事は、負担であると同時にやりがいの源にもなっていた。同じ仕事の特徴でも、受け止め方次第で重荷にも支えにもなるという点が面白い。", "unverified": "出版社の本文は入手できず、各職務特性の評価の分布と調整効果の大きさは確認できなかった。"}}, {"id": "jr10", "rank": 10, "headline": "スマートシティの順位と住民評価のずれの原因", "title": "Why smart-city rank diverges from perceived urban conditions: the role of development context across 148 cities", "url": "https://doi.org/10.1108/arch-06-2026-0497", "authors": "Fay Alkhalifa", "venue": "Archnet-IJAR: International Journal of Architectural Research", "date": "2026-11-19", "sjr": 0.56, "citescore": 5.1, "citescore_year": "2025", "apa": "Alkhalifa, F. (2026). Why smart-city rank diverges from perceived urban conditions: the role of development context across 148 cities. Archnet-IJAR: International Journal of Architectural Research, 1–16. https://doi.org/10.1108/arch-06-2026-0497", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社のサイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "IMDスマートシティ指数の148都市で、公表された順位と住民の知覚に基づく順位のずれを分析し、ずれの多くが都市の人間開発の水準という文脈で説明されることを示した（抄録）。", "p2": "スマートシティ指数は住民の知覚の調査に基づくが、発展の文脈で調整した公表順位が、住民の評価そのものの順序とどれだけ一致するかは検証されていなかった（抄録）。", "p3": "148都市で、順位の一致度と順位の移動、地域の人間開発指数（SHDI）の群での分解、構造と技術の柱の別々の分析、柱の重みを変えた分析、安定した都市のパネル、シナリオに基づく不確実性の分析を行い、住民の知覚を等しく重みづけた順位を診断の基準とした（抄録）。", "p4": "評価は、公表順位と知覚に基づく順位のスピアマンの順位相関、順位の移動の中央値、SHDIの群がずれの分散を説明する割合、群内の順位の一致度である（抄録）。", "p5": "公表順位と知覚に基づく順位の対応は中程度（ρ = 0.603）で、順位の移動の中央値は24.75位だった。SHDIの群がずれの分散の66.8%と関連し、群の中での順位の一致はきわめて高かった（ρ = 0.853〜0.984）。文脈に関連したずれは構造より技術の柱で強く、重み・参加・不確実性の検定でも残った（抄録）。", "p6": "著者は、発展の文脈による調整は異質な都市の比較を助ける一方、世界全体の順位を住民の評価の直接の順序と同等でなくすという「文脈化と比較可能性の緊張」を指摘する（抄録）。解釈：住民の知覚の調査自体の代表性は抄録からは確認できない。", "fun": "「スマートな都市ランキング」で上位の都市に住む人が、本当に暮らしやすさを実感しているとは限らない。148都市を調べると、公表された順位と住民の評価の順位にはかなりのずれがあり、その多くは地域の豊かさの違いで説明できた。同じくらい豊かな都市どうしなら順位はほぼ一致していた。ランキングは「何と比べているか」で意味が変わるという点が面白い。", "unverified": "出版社の本文は入手できず、都市ごとの順位の移動と、柱の重みを変えた結果の詳細は確認できなかった。"}}, {"id": "jr11", "rank": 11, "headline": "ペルソナ付与でLLMの数学説明の誤謬が変わる", "title": "LLMs Are Not Oracles: Knowledge Graphs Map Logical Fallacies in GenAI Math Explanations Across AI Assistants and Human Shadows", "url": "https://doi.org/10.3390/computers15110849", "authors": "NAOMI ESPOSITO ほか", "venue": "Computers", "date": "2026-11-18", "sjr": 0.935, "citescore": 9.1, "citescore_year": "2025", "apa": "Esposito, N., Aghazadeh Ardebili, A., & Stella, M. (2026). LLMs Are Not Oracles: Knowledge Graphs Map Logical Fallacies in GenAI Math Explanations Across AI Assistants and Human Shadows. Computers, 15(11), 849. https://doi.org/10.3390/computers15110849", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社のサイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "数学教育のデジタルシャドウ（MEDS）データの28,000回の実行で、14のLLMを素のAIアシスタントとして、または人のペルソナ（人間のシャドウ）として回答させ、ペルソナの付与が数学の説明の構造・誤謬・正答率・自信を変えることを示した（抄録）。", "p2": "LLMは数学教育で使われるようになったが、ペルソナの条件づけが数学の説明をどう変えるかはほとんど分かっていなかった（抄録）。", "p3": "回答を、語と語の統語・意味・感情の結びつきを表す知識グラフ（テキストのforma mentisネットワーク）で分析し、DistilBERTの分類器で5種類の論理的誤謬の候補を判定し、正規表現で安心させる言葉を調べ、18問の小テストで正答率と表明した自信を比べた（抄録）。解釈：「AIとして答える」場合と「ある人として答える」場合で、説明の言葉のつながり方が変わるかを網の目の形で測る設計である。", "p4": "評価は、ネットワークの大きさ・密度・代数的連結度、誤謬のラベルの出現、18問の正答率、自信と正答率の差である（抄録）。", "p5": "ペルソナの付与はネットワークの大きさ・密度・代数的連結度をモデルによって異なる形で変え、人のシャドウの回答は語彙の範囲が広かった。不安を煽る形の質問では、特にAIアシスタントの形で感情への訴えと論点のずれのラベルが急増した。正答率は14の構造のうち10でAIアシスタントが上回り、表明した自信は14中13（AIアシスタント）と14中11（人のシャドウ）の条件で実際の正答率を超えた（抄録）。", "p6": "著者は、説明の数学的な正しさや教え方の質を直接評価する指標はないこと、自信と正答率の差は記述的なもので較正の指標ではないことを明記する（抄録）。解釈：誤謬の判定は分類器による候補で、人による検証の程度は抄録からは確認できない。", "fun": "AIに数学を教えてもらうとき、「AIとして」答えさせるのと、「ある人になりきって」答えさせるのとでは、説明の中身が変わるのだろうか。調べると、なりきった方が言葉の幅は広がる一方、正答率は素のAIの方が高いことが多かった。そしてどちらも、実際の正しさより自信の方が上回っていた。AIは数学の神託ではないという警告が面白い。", "unverified": "出版社の本文は入手できず、モデルごとの正答率と、誤謬の分類器の精度は確認できなかった。"}}, {"id": "jr12", "rank": 12, "headline": "高架鉄道の地域地震応答を縮約モデルで一括解析", "title": "A Reduced‐Order‐Model Framework for Regional Earthquake Response History Analysis of Elevated Railway Infrastructure", "url": "https://doi.org/10.1002/eqe.70321", "authors": "Miguel A. Gomez ほか", "venue": "Earthquake Engineering and Structural Dynamics", "date": "2026-11-19", "sjr": 1.622, "citescore": 9.7, "citescore_year": "2025", "apa": "Gomez, M. A., & DeJong, M. J. (2026). A Reduced‐Order‐Model Framework for Regional Earthquake Response History Analysis of Elevated Railway Infrastructure. Earthquake Engineering & Structural Dynamics. https://doi.org/10.1002/eqe.70321", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社のサイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "高架鉄道の多数の構造物について、在庫データから横方向の縮約モデル（ROM）を自動生成し、断層破壊のシナリオに応じた地震動で地域規模の非線形時刻歴解析を行う方法を作り、BARTの1436橋脚を数時間で計算できることを示した（抄録）。", "p2": "交通網の地域地震シミュレーションは、地震動の強さから被害の状態を写すフラジリティに頼るのが普通で、多数の構造物の詳細なモデルを作って走らせる費用のため非線形の時刻歴解析はまれだった。鉄道網は道路橋や建物に比べ研究が少なかった（抄録）。", "p3": "(1)媒介変数化した構造の在庫、(2)それから各構造物の横方向の応答（柔らかい径間の接続のため、この形式の地震時の重要な機構）のROMを素早く作るモデル生成器、(3)性能に基づく耐震設計の枠組みで、断層破壊のシナリオに対し空間相関のある地震動の時刻歴を地点ごとに選ぶハザード評価、を組み合わせた（抄録）。解釈：同じ形が繰り返される高架橋の性質を生かし、構造物ごとのモデルを自動で軽いモデルに落とす発想である。", "p4": "サンフランシスコ湾岸のBART網を事例に、モデル生成と計算の時間、HAZUSのフラジリティによる評価との空間的な類似を調べた（抄録）。", "p5": "モデル生成の時間は分単位になり、全1436橋脚の12の非線形時刻歴解析は約2.5時間で終わった。結果は平均してHAZUSの評価と空間的に似ていたが、構造物ごとの計算は残留変形を含む最大応答、被害の詳細な分布、特に脆弱な構造物とその履歴の挙動も与えた（抄録）。", "p6": "解釈：ROMは横方向の応答に限られ、縦方向や軌道・車両との相互作用は含まれていない可能性がある。ROMの精度を詳細モデルと比べた検証の程度は抄録からは確認できない。", "fun": "大地震のとき、街中の何千本もの高架橋の柱のうち、どれが危ないかを知りたい。一本ずつ詳しく計算すると時間がかかりすぎるので、普通は「この揺れならこの程度壊れる」という目安の表で済ませる。この研究は、同じ形が並ぶ高架橋の特徴を生かして軽い模型を自動で作り、全部の柱を数時間で計算した。特に弱い柱を見つけ出せる点が面白い。", "unverified": "出版社の本文は入手できず、ROMの精度の検証と、脆弱と判定された構造物の具体例は確認できなかった。"}}, {"id": "jr13", "rank": 13, "headline": "常時微動の相関で切土斜面の剛性低下を検知", "title": "High-Resolution Monitoring of a Cut Slope Using Ambient Noise Interferometry for Landslide Early Warning", "url": "https://doi.org/10.3390/app162211479", "authors": "Kai Chen ほか", "venue": "Applied Sciences (Switzerland)", "date": "2026-11-19", "sjr": 0.555, "citescore": 6.1, "citescore_year": "2025", "apa": "Chen, K., Ma, Y., Quan, X., Ye, S., Li, M., Zhang, Z., & Xu, K. (2026). High-Resolution Monitoring of a Cut Slope Using Ambient Noise Interferometry for Landslide Early Warning. Applied Sciences, 16(22), 11479. https://doi.org/10.3390/app162211479", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社のサイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "中国・杭州の高速道路の切土斜面で、常時微動の干渉法により斜面の内部の剛性を反映する地震波速度の変化（dv/v）を連続監視し、降雨のノイズを疎な非負値行列因子分解（NMF）で除く方法で、台風時の剛性の低下を捉えた（抄録）。", "p2": "斜面の監視は表面の変位など外部の変形の計測が中心で、目に見える破壊の前の内部の損傷には鈍い。常時微動の相互相関からグリーン関数を再構成する方法は、頻繁な降雨で精度が大きく落ちていた（抄録）。", "p3": "長時間の常時微動の相互相関を積み重ねて速度変化を求め、降雨によるノイズを疎なNMFで抑えて安定なグリーン関数を得ることで、高い時間分解能のdv/vを測った（抄録）。解釈：地盤が緩むと地震波の伝わる速さが落ちるので、速さの変化を「斜面の硬さの体温計」として使う。", "p4": "得られたdv/vの時系列を、気温の変動、台風の上陸と大雨、3成分の地震計の傾斜計の記録、現地で観察されたひび割れと照合した（抄録）。", "p5": "dv/vは気温の変動と一致する24時間の周期を示し、台風の上陸と大雨のあった8月9日から10日にかけて地震波速度が約6%下がった。速度の低下の後に傾斜計が顕著なすべりを記録し、速度低下・すべり・現地のひび割れが一致したことから、常時微動による速度変化が切土斜面の内部の剛性の低下を反映すると結論した（抄録）。", "p6": "解釈：1つの斜面の1回の事象の観測で、速度低下の大きさとすべりの関係を早期警報のしきい値として一般化できるかは抄録からは確認できない。温度による日周変動の補正の方法も抄録にはない。", "fun": "斜面が崩れる前には、地面の中で目に見えない「ゆるみ」が進んでいる。この研究は、車や風などがいつも起こしている小さな揺れ（常時微動）が斜面を伝わる速さを測り、その速さが落ちることで内部のゆるみを捉えた。台風の大雨の日に速さが約6%落ち、その後に実際に斜面がすべった。ふだんの雑音を使って斜面の健康診断をする発想が面白い。", "unverified": "出版社の本文は入手できず、観測点の配置、NMFの設定、温度補正の方法は確認できなかった。"}}, {"id": "jr14", "rank": 14, "headline": "9次の車輪多角形が地下鉄の振動に及ぼす影響", "title": "Effect of 9th-Order Wheel Polygon on Metro Vibration Characteristics: A Computational Model Updated with Experimental Investigation", "url": "https://doi.org/10.1142/s0219876226500672", "authors": "Jianhui Tian ほか", "venue": "International Journal of Computational Methods", "date": "2026-11-19", "sjr": 0.368, "citescore": 3.0, "citescore_year": "2025", "apa": "Tian, J., & Cao, Y. (2026). Effect of 9th-Order Wheel Polygon on Metro Vibration Characteristics: A Computational Model Updated with Experimental Investigation. International Journal of Computational Methods. https://doi.org/10.1142/s0219876226500672", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社のサイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "地下鉄の車輪の9次の多角形化（車輪の周に9つの山ができる摩耗）が引き起こす周期的な衝撃を、前後の車輪とレールの連成モデルと試験で調べ、車輪・車体の振動の特徴と弾性車輪の低減効果を示した（抄録）。", "p2": "車輪の多角形化は車輪とレールの間に周期的な衝撃を生み、地下鉄の性能を劣化させるが、同じ台車の前後の車輪の衝撃が互いにどう影響し合うかは深く調べられていなかった（抄録）。", "p3": "9次の多角形による周期的な加振と、車輪とレールの接触面での衝撃の伝達を考えた前後の車輪とレールの連成モデルを作り、試験結果と比べて検証・更新したうえで、典型的な9次の多角形を定義して、輪重（車輪とレールの力）・車輪の振動加速度・車体の振動加速度の変化を解析した（抄録）。", "p4": "評価は、シミュレーションと試験の一致、3つの指標の周波数領域の特徴、標準車輪と弾性車輪の比較である（抄録）。", "p5": "2種類の車輪の上下の振動加速度は85 Hz付近でピークになり、横方向の応答は50 Hz以下に集中した。輪軸の水準では、弾性車輪は標準車輪より上下・横の振動加速度がやや低く、振動の低減に有効だった（抄録）。", "p6": "解釈：試験の条件（速度・軌道・計測位置）とモデルの更新の方法、一致の程度は抄録からは確認できない。9次以外の多角形や、軌道・高架橋への振動の伝達は扱われていない。", "fun": "電車の車輪は使っているうちに、まん丸ではなく角のある形（多角形）にすり減ることがある。9つの角ができた車輪は、1回転ごとに9回レールをたたき、ガタガタとした振動を生む。この研究は、前と後ろの車輪のたたき合いまで計算に入れて振動を調べ、ゴムを挟んだ弾性車輪が揺れを少し和らげることを確かめた。丸いはずの車輪の「角」が問題になる点が面白い。", "unverified": "出版社の本文は入手できず、試験の条件と、モデルと試験の一致の程度は確認できなかった。"}}, {"id": "jr15", "rank": 15, "headline": "緩傾斜地盤の深い液状化を構成則で解析", "title": "Insights into the response of deep liquefaction beneath mildly sloping ground using advanced constitutive models", "url": "https://doi.org/10.1139/cgj-2026-0073", "authors": "Kota Abe ほか", "venue": "Canadian Geotechnical Journal", "date": "2026-11-18", "sjr": 1.282, "citescore": 5.8, "citescore_year": "2025", "apa": "Abe, K., Carey, T., & Taiebat, M. (2026). Insights into the response of deep liquefaction beneath mildly sloping ground using advanced constitutive models. Canadian Geotechnical Journal. https://doi.org/10.1139/cgj-2026-0073", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社のサイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "緩やかな傾斜の地盤の下にある深い液状化層の応答を、SANISAND-MSfとPM4Sandの2つの高度な構成モデルで、要素から系までを一貫して解析した（抄録）。", "p2": "傾斜地で土が液状化すると下方へ流れて構造物を壊しうり、静的なせん断応力が液状化抵抗を左右する。既存の構成モデルが、自然の緩斜面に広く見られる弱い静的せん断の影響をどれだけ現実的に表せるかは不確かだった（抄録）。", "p3": "まず、低い静的せん断の条件のシリカ砂の公表された単純せん断（DSS）試験のデータで、2つの構成モデルを要素の水準で較正・評価し、次に較正したモデルを深い液状化層の土柱に適用して系の水準の応答と変形の機構を調べた（抄録）。解釈：盛土やダムのような強い静的せん断ではなく、自然の緩斜面の弱い静的せん断に焦点を当てた点が特徴である。", "p4": "評価は、要素試験のデータとの一致と、土柱の解析での応答と変形の機構の違いである（抄録）。", "p5": "抄録には、2つのモデルの比較の具体的な結果（変形の大きさや機構の違い）は記載されていない（抄録）。", "p6": "解釈：結果の要点が抄録から読めないため、どちらのモデルが低い静的せん断の効果をよりよく表すか、深い液状化層の変形がどの程度になるかは確認できない。シリカ砂の要素試験に基づく較正が自然の地盤にどこまで当てはまるかも課題である。", "fun": "地震で地面が液体のようになる液状化は、ゆるい坂でも起き、土が少しずつ坂の下へ流れていく。坂の土には地震の前からいつも斜め下へ引っ張る小さな力がかかっていて、それが液状化のしやすさを変える。この研究は、その「小さな引っ張り」をコンピュータの土の模型がどこまで正しく表せるかを、実験と比べながら確かめようとした点が面白い。", "unverified": "出版社の本文は入手できず、2つのモデルの比較結果と、土柱の解析の条件は確認できなかった。"}}, {"id": "jr16", "rank": 16, "headline": "サービスロボットの評価の決め手は国で違う", "title": "Contextual contingencies in robot-enabled service encounters: how innovation attributes shape customer experience evaluations", "url": "https://doi.org/10.1108/jsm-02-2026-0130", "authors": "Min-Hsin Huang ほか", "venue": "Journal of Services Marketing", "date": "2026-11-19", "sjr": 1.536, "citescore": 9.4, "citescore_year": "2025", "apa": "Huang, M.-H., & Mudiyappan, C. R. (2026). Contextual contingencies in robot-enabled service encounters: how innovation attributes shape customer experience evaluations. Journal of Services Marketing, 1–23. https://doi.org/10.1108/jsm-02-2026-0130", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "サービスロボットの革新属性（相対的優位・適合性・観察可能性）が、使いやすさと楽しさを介してロボットによるサービス体験の評価にどう効くかを、台湾とインドの顧客で比べた（抄録）。", "p3": "イノベーション普及理論を主な枠組み、利用と満足の理論を補完として、ロボットのサービスを経験した台湾（n = 415）とインド（n = 510）の顧客の調査に、測定不変性を確認したうえで多母集団の構造方程式モデルを当てはめた（抄録）。", "p5": "使いやすさと楽しさは両国で体験評価と正に関連した。相対的優位はインドで、適合性は台湾でより重要で、観察可能性は両国で有意でなかった。上流の属性の重要さは文脈に依存し、下流の評価の関係は比較的頑健だった（抄録）。", "fun": "店でロボットが料理を運んでくるとき、客が喜ぶポイントは国によって違うのだろうか。インドの客は「人より速く便利か」を、台湾の客は「自分の生活に合うか」を重視していた。一方で、使いやすく楽しいことが満足につながる点は共通だった。同じ機械でも売り込み方は国に合わせるべきだという示唆が面白い。", "unverified": "出版社の本文は入手できず、構造方程式モデルの係数の値は確認できなかった。"}}, {"id": "jr17", "rank": 17, "headline": "孤立の5領域と心理的苦痛ががん生存に関連", "title": "Impact of Social Isolation and Psychological Distress on Overall Survival in Cancer: A Population-Based Cohort Study", "url": "https://doi.org/10.1200/op-26-00436", "authors": "Danlin Zeng ほか", "venue": "JCO Oncology Practice", "date": "2026-11-18", "sjr": 1.985, "citescore": 6.4, "citescore_year": "2025", "apa": "Zeng, D., Bates, A., Zhang, Y., Cook, O., Raman, S., Leung, B., Ho, C., & Nunez, J.-J. (2026). Impact of Social Isolation and Psychological Distress on Overall Survival in Cancer: A Population-Based Cohort Study. JCO Oncology Practice. https://doi.org/10.1200/op-26-00436", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "がん患者45,651人の集団コホートで、社会的孤立の5領域と抑うつ・不安が全生存とそれぞれ独立に関連することを示した（抄録）。", "p3": "2011〜2016年にBC Cancerの初診で心理社会的スクリーニング（PSSCAN-R）に回答した患者を対象に、孤立の5領域・抑うつ・不安を導き、年齢・性別・転移の有無を調整した多変量Cox回帰で生存との関連を推定した（抄録）。", "p5": "32.5%が1つ以上の孤立の領域で陽性で、多いのは独居（23.0%）と最近の配偶者の喪失（10.9%）だった。孤立の領域が1つ増えるごとに死亡のハザードが約9%増え、定期的な社会的接触の欠如（HR 1.29）、独居（HR 1.18）、抑うつ（HR 1.43）、不安（HR 1.23）がそれぞれ独立に死亡と関連した（抄録）。", "fun": "一人暮らしや、人と定期的に会わないことが、がん患者の生存に関係していた。しかも、これらは簡単な質問票で見つけられる。病気の治療は薬や手術だけでなく、患者のまわりの人とのつながりにも目を配る必要があることを、45,651人の大規模なデータで示した点が考えさせられる。", "unverified": "出版社の本文は入手できず、がんの種類別の結果と孤立の各領域の定義の詳細は確認できなかった。"}}, {"id": "jr18", "rank": 18, "headline": "慢性的な孤独はその後の認知症リスクと関連", "title": "Loneliness exposure groups and 20-year dementia risk: a longitudinal population-based study.", "url": "https://doi.org/10.1080/13607863.2026.2733938", "authors": "Simon Y ほか", "venue": "Aging & mental health", "date": "2026-11-17", "sjr": 1.207, "citescore": 6.8, "citescore_year": "2025", "apa": "Simon, Y., Sendra, M., Faidherbe, V., Amieva, H., Dartigues, J.-F., Ouvrard, C., & Pérès, K. (2026). Loneliness exposure groups and 20-year dementia risk: a longitudinal population-based study. Aging & Mental Health, 1–12. https://doi.org/10.1080/13607863.2026.2733938", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Europe PMCに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "8年間の反復測定で孤独を「なし・時々・慢性」の3群に分け、その後20年の認知症リスクとの関連を調べ、慢性的な孤独だけがリスクを高めることを示した（抄録）。", "p3": "単一の項目で8年間にわたり孤独を測り、最初の8年間に認知症のなかった高齢者1,540人について、illness-deathモデルでその後20年の認知症のリスクを推定した（抄録）。", "p5": "560人が認知症を発症し、発症率は孤独なしの群の33.1%から慢性の群の49.1%にわたった。慢性的な孤独の群は孤独なしの群より認知症のリスクが有意に高く（調整HR 1.38、95%CI 1.03〜1.86）、時々の孤独は関連しなかった（抄録）。", "fun": "誰でもときどきは寂しくなる。この研究では、ときどき寂しいだけでは認知症の危険は高まらず、何年も続く寂しさだけが関係していた。1回の調査では分からない「寂しさの続き方」を長く追ったからこそ見えた違いだ。人とのつながりを長く保つことが予防につながりうるという点が身近で面白い。", "unverified": "出版社の本文は入手できず、調査の対象国と調整した共変量は確認できなかった。"}}, {"id": "jr19", "rank": 19, "headline": "言語とペルソナでLLMの感情評価は変わる", "title": "Multilingual Emotion Profiling of Large Language Models Through Literary Texts and Persona Conditioning", "url": "https://doi.org/10.20965/jaciii.2026.p1866", "authors": "Naruki Shirahama ほか", "venue": "Journal of Advanced Computational Intelligence and Intelligent Informatics", "date": "2026-11-19", "sjr": 0.231, "citescore": 1.9, "citescore_year": "2025", "apa": "Shirahama, N., Yoshimoto, Y., Nakaya, N., & Watanabe, S. (2026). Multilingual Emotion Profiling of Large Language Models Through Literary Texts and Persona Conditioning. Journal of Advanced Computational Intelligence and Intelligent Informatics, 30(6), 1866–1875. https://doi.org/10.20965/jaciii.2026.p1866", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "6つのLLMに文学作品の感情を評価させ、言語（日本語・英語・繁体字中国語）とペルソナの条件が評価を実質的に変えるかを、事前登録の分析で調べた（抄録）。国内誌の論文。", "p3": "OpenRouterを共通の推論層として、6モデル×3言語×3作品×4ペルソナ×3回の648評価を計画し、各回答に面白さ・驚き・悲しみ・怒りの4次元の評点と短い理由を出させ、HC3頑健標準誤差による事前登録の最小二乗法で分析した（抄録）。", "p5": "作品の内容が評点の主な要因（特に悲しみと怒り）だった一方、モデルと言語の交互作用は4つの感情すべてで有意だった。英語は面白さ・驚き・悲しみの平均が最も高く、日本語は怒りの平均が最も高かったが、集計の傾向はモデルごとの強い違いを隠していた（抄録）。", "fun": "同じ小説でも、日本語で読むか英語で読むかで感じ方が変わることがある。AIでも同じことが起きるのか。調べると、言語によって感情の評価が変わり、その変わり方はAIの種類ごとにばらばらだった。AIに文章の感想を聞くとき、どの言語で聞くかも結果を左右する「実験の条件」になるという点が面白い。", "unverified": "出版社の本文は入手できず、モデル名とペルソナの内容、言語ごとの評点の数値は確認できなかった。"}}, {"id": "jr20", "rank": 20, "headline": "温度依存のダンパで確率的な風応答を制御", "title": "Stochastic response control of wind-disturbed transmission tower-line systems by viscoelastic dampers considering temperature effect", "url": "https://doi.org/10.1142/s0219455428501027", "authors": "Mingjing Chang ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-19", "sjr": 0.703, "citescore": 6.5, "citescore_year": "2025", "apa": "Chang, M., & Chen, B. (2026). Stochastic response control of wind-disturbed transmission tower-line systems by viscoelastic dampers considering temperature effect. International Journal of Structural Stability and Dynamics. https://doi.org/10.1142/s0219455428501027", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "送電鉄塔-架線系に温度依存の粘弾性ダンパを付けたときの確率的な風応答を解析する方法を作り、ダンパの最適な位置と温度の影響を示した（抄録）。", "p3": "ラグランジュ方程式による集中質量モデル、温度依存の一般化マクスウェル模型によるダンパのモデル、非比例減衰の系の確率的な解析の枠組みを組み合わせ、極値応答を初通過の基準で評価した。中国の実際の送電鉄塔-架線系を事例とした（抄録）。", "p5": "粘弾性ダンパは確率的な風応答を大きく減らした。制御の性能は粘弾性材料の温度依存性に支配され、平衡剛性と緩和時間にも影響された（抄録）。低減の具体的な数値は抄録にない。", "fun": "送電線の鉄塔は風で揺れ続け、少しずつ傷んでいく。揺れを吸収するゴムのような部品（粘弾性ダンパ）は安くて便利だが、その効き目は気温で変わる。寒い日と暑い日で効き方が違う部品を、でたらめに吹く風に対してどう配置するかを計算で示した点が面白い。", "unverified": "出版社の本文は入手できず、応答の低減率と最適位置の具体的な結果は確認できなかった。"}}, {"id": "jr21", "rank": 21, "headline": "スマートシティ試行は都市のレジリエンスを高める", "title": "Smart City Pilots Promote Urban Resilience and Security: A Quasi-Natural Experiment from China", "url": "https://doi.org/10.1061/jupddm.upeng-6375", "authors": "Chang Su ほか", "venue": "Journal of Urban Planning and Development", "date": "2026-11-19", "sjr": 0.536, "citescore": 3.9, "citescore_year": "2025", "apa": "Su, C., Xiao, X., Deng, J., Zhang, T., Chen, F., & Wang, X. (2027). Smart City Pilots Promote Urban Resilience and Security: A Quasi-Natural Experiment from China. Journal of Urban Planning and Development, 153(2). https://doi.org/10.1061/jupddm.upeng-6375", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "中国の2012年のスマートシティ試行政策を準自然実験として、試行政策が都市のレジリエンスと安全を高めることを多期間の差の差法で示した（抄録）。", "p3": "272の地級市の2001〜2021年のパネルデータで多期間の差の差法を用い、産業構造の高度化・技術の進歩・デジタル基盤の強化という経路と、都市の種類による異質性、空間的な波及を調べた（抄録）。", "p5": "試行政策は都市のレジリエンスと安全を有意に高め、反実仮想と複数の頑健性の検定でも結果は保たれた。効果は省都・経済規模の大きい都市・東部で大きく、周辺の都市への正の空間的な波及もあった（抄録）。", "fun": "街中にセンサーやデータの仕組みを入れる「スマートシティ」は、災害や危機に強い街を作るのか。中国の試行政策を、始めた街と始めていない街の変化の差で比べると効果があり、近くの街にまで良い影響が広がっていた。ただし大きな街ほど効果が大きいという差も見えた点が面白い。", "unverified": "出版社の本文は入手できず、レジリエンスの指標の作り方と効果の大きさの数値は確認できなかった。"}}, {"id": "jr22", "rank": 22, "headline": "入力を追跡できる橋梁の地震損失評価", "title": "Fragility and loss assessment of a multi-span highway bridge with traceable inputs and verified computation", "url": "https://doi.org/10.1177/13694332261507477", "authors": "Jila Pashaei Marani ほか", "venue": "Advances in Structural Engineering", "date": "2026-11-17", "sjr": 0.643, "citescore": 5.2, "citescore_year": "2025", "apa": "Pashaei Marani, J., Komarizadehasl, S., & Xia, Y. (2026). Fragility and loss assessment of a multi-span highway bridge with traceable inputs and verified computation. Advances in Structural Engineering. https://doi.org/10.1177/13694332261507477", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "4径間のRC道路橋のフラジリティと地震損失を、出典を追える入力と独立に検算した計算で評価し、橋梁の地震損失評価を追跡可能な形で示した（抄録）。", "p3": "柱の損傷指標はOpenSeesのファイバー断面が既に課すひずみ限界に基づき、11の記録地震動による88の非線形解析に最尤法でフラジリティを当てはめ、収束しなかった解析も残して未観測の結果の不確実性を極端な割当で調べた（抄録）。", "p5": "周期0.631秒での中央値は鉄筋の初降伏で0.352 g、かぶりの剥落で0.719 gだった。価格を付けた性能群の期待年損失は3地点で625〜2846米ドル（4.6倍の差）で、割引率を0.5%にすると50年の現在価値は規定の3.1%のときの1.75倍になった（抄録）。", "fun": "橋が地震でどれくらい壊れ、修理にいくらかかるかの計算は、どの数字を使ったかを読者がたどれないことが多い。この研究は、すべての入力に出典を付け、計算を別の方法で確かめた。お金の価値を将来に換算する割合を少し変えるだけで、損失の見積もりが大きく変わることも示した点が面白い。", "unverified": "出版社の本文は入手できず、付録Bの感度分析の結果は確認できなかった。"}}, {"id": "jr23", "rank": 23, "headline": "医師のAI利用の開示が患者の信頼を左右", "title": "Physician AI disclosure, condition severity, and public trust in digital medicine", "url": "https://doi.org/10.1038/s41746-026-03484-7", "authors": "Yifan Yang ほか", "venue": "npj Digital Medicine", "date": "2026-11-19", "sjr": 4.215, "citescore": 18.2, "citescore_year": "2025", "apa": "Yang, Y., Bao, X., Yang, T., Wei, S., Ieng, I. S., & Zhao, Y. (2026). Physician AI disclosure, condition severity, and public trust in digital medicine. Npj Digital Medicine. https://doi.org/10.1038/s41746-026-03484-7", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "医師のAI利用の開示（事務・診断・治療）と疾患の重さが、患者の医師への評価と受診意向にどう影響するかを、中国の要因実験で示した（抄録）。", "p3": "中国本土の成人1,574人を、AI利用の種類と疾患の重さが異なる医師のプロフィールに無作為に割り当てる5×2の要因実験を行い、探索的な媒介分析とマカオの対面の補足標本（n = 128）で確かめた（抄録）。", "p5": "事務のAIは診断・治療のAIより医師の評価と受診意向で好意的に評価された。重い疾患では治療のAIへの否定的な反応が強まり、AIを使わないという明示の開示が予約の意向を高めた。能力・信頼・共感が反応の違いを説明した（抄録）。", "fun": "お医者さんが「AIを使っています」と言ったら、患者はどう感じるか。予約や書類の整理に使うなら気にしないが、診断や治療に使うとなると警戒し、病気が重いほどその傾向が強まった。AIの利用を隠すのでも一律に伝えるのでもなく、何に使うかで伝え方を変える必要があるという点が面白い。", "unverified": "出版社の本文は入手できず、効果の大きさと媒介分析の数値は確認できなかった。"}}, {"id": "jr24", "rank": 24, "headline": "障害児を支えるケアのネットワークを追跡", "title": "Caregiving networks and children with neurologic impairment: A multicenter social network analysis protocol", "url": "https://doi.org/10.1002/jhm.70549", "authors": "Ryan J. Coller ほか", "venue": "Journal of Hospital Medicine", "date": "2026-11-19", "sjr": 0.904, "citescore": 2.9, "citescore_year": "2025", "apa": "Coller, R. J., Green, H. D., Lerner, C., Peralta, J. B., Stille, C. J., Thomson, J., Van Cleave, J., Warner, G., Kooiman, S., Baird, K., Gerber, D. M., Tolzmann, D., & Werner, N. E. (2026). Caregiving networks and children with neurologic impairment: A multicenter social network analysis protocol. Journal of Hospital Medicine. https://doi.org/10.1002/jhm.70549", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "神経障害のある子どもを支える有償・無償の担い手の集まり（ケアリング・ネットワーク）の特徴が、重い健康事象と生活の質に関連するかを追う多施設の前向きコホート研究（THRIvE）の計画を示した（抄録）。", "p3": "過去12か月に入院か救急受診のあった2〜16歳の神経障害のある子どもと主・副の介護者を5つの大学病院で登録し、主介護者への自己中心ネットワーク分析（副介護者の調査で検証）でネットワークの密度・中心化・三者閉包・大きさ・構成を測る（抄録）。", "p5": "主な結果は12か月時点の重い健康事象（死亡・入院）と子どもの生活の質で、施設のクラスタリング・交絡・多重比較を考えた混合効果回帰で分析する計画である（抄録）。研究計画のため結果はまだない。", "fun": "障害のある子どもの世話は、親だけでなく、祖父母、近所の人、ヘルパーなど多くの人で支えられていることがある。その「支え手のつながり方」が子どもの健康に関係するのではないか、という問いを本格的に調べる計画だ。家族を1人の介護者でなくチームとして見る視点が面白い。", "unverified": "研究計画の段階で結果はなく、目標の登録者数は抄録から確認できなかった。"}}, {"id": "jr25", "rank": 25, "headline": "高齢化とエネルギー貧困をデジタルと社会資本が緩和", "title": "Demographic ageing and household energy poverty in China: the moderating roles of digital access and social capital", "url": "https://doi.org/10.3389/fpubh.2026.1889899", "authors": "Qianwen Sun ほか", "venue": "Frontiers in Public Health", "date": "2026-11-18", "sjr": 1.103, "citescore": 6.4, "citescore_year": "2025", "apa": "Sun, Q., Huang, L., Zhu, C., Du, Y., Xu, A., & Qiao, X. (2026). Demographic ageing and household energy poverty in China: the moderating roles of digital access and social capital. Frontiers in Public Health, 14. https://doi.org/10.3389/fpubh.2026.1889899", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "中国家計パネル調査（CFPS 2022）で、世帯の高齢化がエネルギー貧困と正に関連し、デジタル接続と社会関係資本がその関連を弱めることを示した（抄録）。", "p3": "ロジットモデルで世帯の高齢化とエネルギー貧困の関連を推定し、デジタル接続と社会関係資本の調整効果を検定し、世帯の種類ごとの異質性を分析した。傾向スコアマッチングなどで頑健性も確かめた（抄録）。", "p5": "高齢化が10ポイント上がるとエネルギー貧困に陥る予測確率が約1.27ポイント上がった。デジタル接続と社会関係資本はこの正の関連を弱め、関連は低所得・小規模・低学歴・農村の世帯で強かった（抄録）。", "fun": "お年寄りのいる家庭ほど、電気やガスの費用に困りやすい。ところが、インターネットにつながっていたり、頼れる人間関係があったりすると、その困りやすさが和らいでいた。暖房や電気といった生活の基盤の問題にも、人とのつながりや情報へのアクセスが効いてくるという点が面白い。", "unverified": "出版社の本文は入手できず、エネルギー貧困の定義と調整効果の大きさの数値は確認できなかった。"}}, {"id": "jr26", "rank": 26, "headline": "薬局のサービス品質が満足と再来意向に効く", "title": "Development and validation of an integrated community pharmacy service performance model: Implications for client satisfaction and revisit intentions", "url": "https://doi.org/10.1016/j.rcsop.2026.100876", "authors": "Theophilus Ehidiamen Oamen ほか", "venue": "Exploratory Research in Clinical and Social Pharmacy", "date": "2026-11-15", "sjr": 0.649, "citescore": 3.6, "citescore_year": "2025", "apa": "Oamen, T. E., Ihekoronye, M. R., & Idiake, J. O. (2026). Development and validation of an integrated community pharmacy service performance model: Implications for client satisfaction and revisit intentions. Exploratory Research in Clinical and Social Pharmacy, 24, 100876. https://doi.org/10.1016/j.rcsop.2026.100876", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "ナイジェリアの地域薬局の顧客367人で、サービス品質尺度SERVPERFの構造を検証し、統合された「顧客関係」の次元が満足と再来意向に効くことを示した（抄録）。", "p3": "便宜抽出によるオンライン調査で、確認的因子分析で尺度の妥当性を確かめ、構造方程式モデルで満足と再来意向への関係を調べた（抄録）。", "p5": "応答性・信頼性・共感が統合された顧客関係と、有形性・確実性からなる3因子の構造がよく適合した（CFI 0.980、RMSEA 0.066）。顧客関係は満足（β = 0.305）と再来意向（β = 0.270）に直接効き、有形性と確実性は効かなかった。満足は顧客関係と再来意向の関係を部分的に媒介した（抄録）。", "fun": "薬局の良し悪しを測る物差しは、もともと「応答の速さ」「確実さ」「思いやり」など5つに分かれていた。ところがこの国の客にとっては、そのうち3つが「店の人との関係」という1つのまとまりとして感じられていた。サービスの評価の分かれ方そのものが、地域や業種によって変わりうる点が面白い。", "unverified": "出版社の本文は入手できず、調査の時期と回答者の属性は確認できなかった。"}}, {"id": "jr27", "rank": 27, "headline": "住区の開放性が高齢者の交流を左右する", "title": "Planning for Social Interaction in Aging Communities: A Machine Learning and Configurational Approach of Residential Area Openness", "url": "https://doi.org/10.1061/jupddm.upeng-6697", "authors": "Yang Mi ほか", "venue": "Journal of Urban Planning and Development", "date": "2026-11-19", "sjr": 0.536, "citescore": 3.9, "citescore_year": "2025", "apa": "Mi, Y., & Yang, D. (2027). Planning for Social Interaction in Aging Communities: A Machine Learning and Configurational Approach of Residential Area Openness. Journal of Urban Planning and Development, 153(2). https://doi.org/10.1061/jupddm.upeng-6697", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "大連の住区の開放性を5つの空間指標で捉え、高齢者の社会的交流に効く計画の条件を、機械学習と構成的な比較分析で示した（抄録）。", "p3": "k-means法で建築環境を6つの開放性の類型に分け、ランダムフォレストで変数の重要度を、ファジー集合の質的比較分析で高い交流に至る条件の組合せの経路を調べた（抄録）。", "p5": "暮らしやすい街路の密度、出入口の密度、袋小路の割合、活動空間への近さ、施設の多様さの5指標が最も影響し、交流との関係は非線形だった。暮らしやすい街路の密度はほぼすべての類型で最も強い正の効果を示した（抄録）。", "fun": "団地を塀で囲むか、通り抜けできるようにするかで、お年寄りが近所の人と話す機会は変わるのか。この研究は、歩きやすい道の多さがどんな住区でも一番効いていたことを示した。ただし効き方は直線的でなく、単純に「開けば開くほど良い」とは限らない点が面白い。", "unverified": "出版社の本文は入手できず、調査の対象者数と交流の測り方は確認できなかった。"}}, {"id": "jr28", "rank": 28, "headline": "橋梁点検の知能化とデジタル化を総説", "title": "From defect recognition to maintenance decision-making: A review of intelligent bridge inspection technologies and their digital evolution", "url": "https://doi.org/10.1177/13694332261507475", "authors": "Yaohui Zhang ほか", "venue": "Advances in Structural Engineering", "date": "2026-11-17", "sjr": 0.643, "citescore": 5.2, "citescore_year": "2025", "apa": "Zhang, Y., Zhang, Q., Yao, M., Wang, J., Guo, P., Meng, Q., & Zheng, Y. (2026). From defect recognition to maintenance decision-making: A review of intelligent bridge inspection technologies and their digital evolution. Advances in Structural Engineering. https://doi.org/10.1177/13694332261507475", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "橋梁の損傷点検の知能化技術を、センシングの基盤・認識アルゴリズム・融合と位置特定・意思決定支援の4つの視点から体系的に整理した総説（抄録）。", "p3": "UAVとロボットによる点検、深層学習による損傷の認識、マルチモーダルなデータの融合、デジタルツイン、知識グラフによる橋梁管理の進展を、相互につながる4つの視点で統合した（抄録）。", "p5": "データセットの断片化、場面をまたぐ一般化の不足、点検結果と構造性能の評価の結びつきの弱さ、維持管理の知識の閉じたループの不完全さを、残る課題として挙げた（抄録）。", "fun": "橋の点検は、人が近づいてひび割れを目で探す作業から、ドローンやロボットが撮った画像をAIが見る方向へ変わりつつある。ただ、ひび割れを見つけることと、その橋がまだ安全かを判断することの間には大きな溝がある。見つけるから決めるまでをつなぐという、点検の次の課題を整理した点が面白い。", "unverified": "出版社の本文は入手できず、取り上げた文献の数と各手法の比較の詳細は確認できなかった。"}}, {"id": "jr29", "rank": 29, "headline": "結氷期と将来気候での橋脚の洗掘を評価", "title": "Bridge Pier Scour Characteristics and Hydrodynamic Loads in Current and Future Climates for Ice-Free and Ice-Covered Periods: A Case Study of Alexandra Bridge", "url": "https://doi.org/10.3390/infrastructures11110430", "authors": "Boyuan Yu ほか", "venue": "Infrastructures", "date": "2026-11-19", "sjr": 0.671, "citescore": 5.7, "citescore_year": "2025", "apa": "Yu, B., Sushama, L., Almansour, H., & Almheiri, Z. (2026). Bridge Pier Scour Characteristics and Hydrodynamic Loads in Current and Future Climates for Ice-Free and Ice-Covered Periods: A Case Study of Alexandra Bridge. Infrastructures, 11(11), 430. https://doi.org/10.3390/infrastructures11110430", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（候補の収集時に取得）を使用。出版社の本文は入手できず", "preprint": false, "short": true, "p1": "カナダ・オタワ川のアレクサンドラ橋を対象に、河川規模の水理・氷のシミュレーションと局所洗掘の大規模渦シミュレーション（LES）をつなぎ、現在と将来の気候で結氷期を含む橋脚の洗掘を評価した（抄録）。", "p3": "橋のある152 kmの区間で、地域気候モデル（SSP5-8.5）の流量などを使って現在（1991〜2020年）と将来（2071〜2100年）の水理・熱の連成計算を行い、75年再現期間の流量と氷の厚さで橋脚まわりのLESを駆動した（抄録）。", "p5": "結氷のない期間では75年再現の流量が7.05%減り、最大洗掘深はわずかに減った。結氷期は流量の4.14%減と氷の厚さの48.2%減が重なり、洗掘深は滑らかな氷で約4.96%、粗い氷で5.13%減った（抄録）。", "fun": "川の中に立つ橋の脚は、流れが周りの砂を削る「洗掘」で弱くなる。寒い地域では川が凍り、氷の下の流れが削り方を変える。温暖化で氷が薄くなると洗掘はどうなるかを計算すると、この橋ではむしろ少し減る見込みだった。気候の変化が橋に与える影響は、単純に「悪くなる」とは限らない点が面白い。", "unverified": "出版社の本文は入手できず、LESの検証に使った観測データの詳細は確認できなかった。"}}, {"id": "jr30", "rank": 30, "headline": "センサ対の応答関係の場で振動SHMを行う", "title": "A frequency-diverse sensor-pair response-relation field for vibration-based structural health monitoring", "url": "https://doi.org/10.1016/j.ymssp.2026.115234", "authors": "Jin Niu", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-19", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "apa": "Niu, J. (2027). A frequency-diverse sensor-pair response-relation field for vibration-based structural health monitoring. Mechanical Systems and Signal Processing, 263, 115234. https://doi.org/10.1016/j.ymssp.2026.115234", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の本文は入手できず、題名検索で見つけた同じ論文の別の記録（SSRN）の抄録を使用", "preprint": false, "short": true, "p1": "振動ベースのSHMで、センサ対ごとの局所的な周波数帯での応答関係を索引つきの「場」として作り、損傷ラベルなしで異常の検出と解釈を行う一クラス教師なしの枠組みPLD-RBIRを提案した（抄録）。", "p3": "センサ対ごとに決定論的な基数逆数による層化で局所の周波数帯を事前に割り当て、各帯で2つのセンサの帯域エネルギーの対数比（RBIR）を計算する。正常時のデータで尺度・頑健な較正・Ledoit–Wolfの共分散による新規性スコアを定め、同じずれをセンサ単位の関連の地図とセンサ対・帯のずれの場に集約する（抄録）。", "p5": "QUGS（観客席のシミュレータ）とLUMO（監視用の試験構造）のベンチマークで、試した手順の下で一貫した順位の分離と解釈しやすいずれのパターンを示した。スペクトルのピーク・全帯域・固定参照などの対照も、応答関係の表現を支持した（抄録）。", "fun": "建物の揺れを複数のセンサで測るとき、1つの数字で「いつもと違う」と知らせるだけでは、どこがどう変わったのか分からない。この方法は、2つのセンサの揺れの強さの比を周波数ごとに並べた「地図」を作る。損傷のデータがなくても、普段の地図と比べて変化の場所と周波数が見える点が面白い。", "unverified": "出版社の本文は入手できず、検出性能の具体的な数値と損傷のシナリオは確認できなかった。抄録は同じ論文の別の記録から取った。"}}, {"id": "jr31", "rank": 31, "headline": "疎な変位とPINNで斜張橋の損傷位置を推定", "title": "Damage localization of cable-stayed bridge based on extended physics-informed neural network and sparse displacement measurements", "url": "https://doi.org/10.1016/j.ymssp.2026.115246", "authors": "Yi-Fan Li ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-18", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "apa": "Li, Y.-F., He, W.-Y., Li, S., Zhou, Y., Ren, W.-X., & Li, Z.-D. (2027). Damage localization of cable-stayed bridge based on extended physics-informed neural network and sparse displacement measurements. Mechanical Systems and Signal Processing, 263, 115246. https://doi.org/10.1016/j.ymssp.2026.115246", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、拡張した物理情報ニューラルネット（PINN）と疎な変位計測を使って、斜張橋の損傷の位置を推定する研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、斜張橋のような大きな橋で、少ない場所の変位の計測だけから、物理の法則を組み込んだAIで傷んだ場所を突き止められるか、というものだ。センサーを付けられる場所が限られる実際の橋で、見えない部分の状態をどこまで推し量れるかという問いが面白い。", "unverified": "抄録・本文とも入手できず、手法・対象の橋・結果は確認できなかった。"}}, {"id": "jr32", "rank": 32, "headline": "PC橋のプレストレスと移動荷重を同時に同定", "title": "Improved Synergic Prestress and Moving Force Identification for Prestressed Concrete Bridges", "url": "https://doi.org/10.34133/adi.0244", "authors": "Jeyamohan Kunaratnam ほか", "venue": "Advanced Devices and Instrumentation", "date": "2026-11-19", "sjr": 1.225, "citescore": 7.2, "citescore_year": "2025", "apa": "Kunaratnam, J., Chan, T. H. T., Nguyen, K.-D., & Thambiratnam, D. P. (2026). Improved Synergic Prestress and Moving Force Identification for Prestressed Concrete Bridges. Advanced Devices & Instrumentation. https://doi.org/10.34133/adi.0244", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、プレストレストコンクリート橋のプレストレス（導入した緊張力）と移動荷重を協調して同定する手法を改良した研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、橋の中に仕込まれた見えない力（プレストレス）と、上を通る車の重さを同時に見分けられるか、というものだ。どちらも橋の揺れやたわみに影響するので、片方だけを推定するより難しい。2つの未知を同時に解きほぐすという問いが面白い。", "unverified": "抄録・本文とも入手できず、手法・検証の方法・結果は確認できなかった。"}}, {"id": "jr33", "rank": 33, "headline": "台風時の長大橋の振動を確率的に予測", "title": "Time-variant probabilistic prediction of typhoon-induced long-span bridge vibration via an uncertainty-aware transformer framework", "url": "https://doi.org/10.1016/j.istruc.2026.113561", "authors": "Xiang-Yu Wang ほか", "venue": "Structures", "date": "2 文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、資産の構造的な収益性と役員報酬の粘着性（業績が下がっても報酬が下がりにくい性質）の関係を、中国企業で調べた研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、会社の業績が上がると役員の給料は上がるのに、下がっても同じだけは下がらないという「粘り」が、会社の資産の稼ぎ方とどう関係するか、というものだ。給料の上がり方と下がり方の非対称が面白い。", "unverified": "抄録・本文とも入手できず、データと分析の結果は確認できなかった。"}}, {"id": "jr46", "rank": 46, "headline": "金融商品の会計基準改訂と株式投資", "title": "Does the revision of accounting standards for financial instruments impact equity investments?", "url": "https://doi.org/10.1080/21697213.2026.2764517", "authors": "Nan Xu ほか", "venue": "China Journal of Accounting Studies", "date": "2026-11-19", "sjr": 0.481, "citescore": 2.1, "citescore_year": "2025", "apa": "Xu, N., & Liu, H. (2026). Does the revision of accounting standards for financial instruments impact equity investments? China Journal of Accounting Studies, 1–35. https://doi.org/10.1080/21697213.2026.2764517", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名のみ", "preprint": false, "short": true, "p1": "題名によれば、金融商品の会計基準の改訂が企業の株式への投資に影響したかを調べる研究である。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名から読み取れる問いは、株の値動きを帳簿にどう書くかという会計のルールを変えるだけで、企業が実際に株を買う量まで変わるか、というものだ。記録の仕方が行動を変えるかという、会計と経営の関係の問いが面白い。", "unverified": "抄録・本文とも入手できず、対象の国・期間と結果は確認できなかった。"}}, {"id": "jr47", "rank": 47, "headline": "AIによる顧客の呼び戻しを実験で評価", "title": "The operational value of AI-Enabled outbound customer reactivation: Evidence from a randomized field experiment in online retail", "url": "https://doi.org/10.1016/j.tre.2026.105380", "authors": "Cheng Fang ほか", "venue": "Transportation Research, Part E: Logistics and Transportation Review", "date": "2026-11-19", "sjr": 2.332, "citescore": 14.0, "citescore_year": "2025", "apa": "Fang, C., Zhou, Y., Li, B., & Wang, K. (2027). The operational value of AI-Enabled outbound customer reactivation: Evidence from a randomized field experiment in online retail. Transportation Research
