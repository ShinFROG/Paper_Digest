<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">

<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>

<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>

    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

ステリシスを表すニューラルネットを総覧", "title": "Neural Network-Based Modeling of Hysteretic Systems: From Prandtl and Preisach Neural Networks to Neuro-Madelung and Neuroplastic Continuous Models", "url": "https://arxiv.org/abs/2611.23240", "authors": "Mehrdad Shafiei Dizaji ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Dizaji, M. S., & Dizaji, F. S. (2026). Neural Network-Based Modeling of Hysteretic Systems: From Prandtl and Preisach Neural Networks to Neuro-Madelung and Neuroplastic Continuous Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23240", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "履歴（ヒステリシス）を持つ構造・材料の非線形挙動をニューラルネットで表す手法を、Prandtl型からPreisach型、Madelung則との組合せ、劣化と速度依存を含む拡張モデルまで整理した総説（抄録）。未査読。", "p3": "停止作用素（stop operator）を活性化に入れたPNN、非Masing型を表すPreisach-NN、剛性・強度の劣化を扱うGPNN、Madelungの履歴則と多層NNを組み合わせたNMMなどを、記憶の表し方・構造・活性化関数・学習法・劣化と速度依存の扱いで比べる（抄録）。", "p5": "これらは劣化する履歴作用素・非線形写像・入力速度の情報を組み合わせたEPNNに収れんし、Masing型と非Masing型、対称と非対称、速度依存と非依存の履歴を扱えるとまとめる（抄録）。定量的な比較結果は抄録にない。", "fun": "針金を曲げて戻すと、元とは少し違う形になる。物の「過去の曲げられ方」が今の硬さに影響することを履歴（ヒステリシス）と呼ぶ。普通のニューラルネットは今の入力だけで答えを出すので、この記憶を表すのが苦手だ。記憶を持つ部品をネットの中に直接組み込む工夫の系譜を一望できる点が面白い。", "unverified": "本文は入手できず、各モデルの精度の比較や適用例の具体的な数値は確認できなかった。"}}, {"id": "pr18", "rank": 18, "headline": "JAXで書いた微分可能なGPU有限要素法", "title": "Axion: A differentiable, GPU-native finite element framework,demonstrated on phase-field fracture", "url": "https://arxiv.org/abs/2611.23682", "authors": "Wei Wang ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Wang, W., U., M. K., & Goswami, S. (2026). Axion: A differentiable, GPU-native finite element framework,demonstrated on phase-field fracture (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23682", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "JAXで書かれ、Newton・Krylov反復から荷重増分のループまでをGPU上の1つのプログラムとして実行する、微分可能な有限要素法の枠組みAxionを公開し、位相場破壊で示した（抄録）。未査読。", "p3": "要素残差の前進型自動微分で接線剛性を得て、同じプログラムを微分して解のパラメータ感度も得る。疎行列を組み立てずに要素ごとに演算子を適用し、固定サイズの配列の中でオクトリーの細分化を行い、複数のGPUに領域分割する（抄録）。", "p5": "片側切欠き引張の試験問題で、同じ離散化の2次元問題を1台のGPUでCPU上のFEniCSxより37.9倍速く解き、4台のGPUでの強・弱スケーリング効率は92%と96%だった。単一GPUで96M自由度の重力式コンクリートダムの破壊も示した（抄録）。", "fun": "建物やダムがどこから割れるかを計算機で調べるには、細かい網目で何度も計算を繰り返す必要があり、時間がかかる。この研究は計算の全部をゲームにも使われるGPUの上で一続きに動かし、結果を設計の値で微分できるようにした。速いだけでなく「どこを変えると割れにくくなるか」まで自動で分かる道具になっている点が面白い。", "unverified": "本文は入手できず、位相場破壊モデルの定式化と精度の検証の詳細は確認できなかった。"}}, {"id": "pr19", "rank": 19, "headline": "多主体の運動論で都市の人口分布を再現", "title": "Modelling population distribution across cities on spatial networks using the kinetic theory of multi-agent systems", "url": "https://arxiv.org/abs/2611.24657", "authors": "Valerio Taralli ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Taralli, V., & Tosin, A. (2026). Modelling population distribution across cities on spatial networks using the kinetic theory of multi-agent systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24657", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "イタリア・サルデーニャ州の都市の人口分布を、空間ネットワーク上の多主体系の運動論（kinetic theory）で再現した（抄録）。未査読。", "p3": "都市を主体であると同時にグラフの頂点とみなし、都市間の結びつきを辺として、いくつかの移住（転出）の規則で主体間の相互作用をモデル化した（抄録）。", "p5": "全都市の人口分布は二峰の対数正規分布に、裾はパレート分布に当てはまり、イタリア国立統計研究所（ISTAT）のデータと整合した。二峰の対数正規の方が裾をより正確に追い、分布の前半では両者が一致した（抄録）。", "fun": "気体の分子がぶつかり合って速さの分布が決まるように、人が町から町へ移り住むことで都市の大きさの分布が決まると考えるのがこの研究の発想だ。物理学の気体の理論を、人口という社会の現象に当てはめている。大都市が少なく小さな町が多いという身近な分布が、単純な移住の規則から出てくる点が面白い。", "unverified": "本文は入手できず、移住の規則の具体的な形と当てはまりの指標は確認できなかった。"}}, {"id": "pr20", "rank": 20, "headline": "SDEの弱形式推定を操作変数で偏りなく", "title": "WAIVES: Weak-form Asymptotically-unbiased Instrumental-Variable Estimation for SDEs", "url": "https://arxiv.org/abs/2611.23951", "authors": "Hamza Ruzayqat ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Ruzayqat, H., Bortz, D. M., & Dukić, V. (2026). WAIVES: Weak-form Asymptotically-unbiased Instrumental-Variable Estimation for SDEs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23951", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "確率微分方程式（SDE）のドリフトと拡散を1本の軌道から推定する弱形式の方法で、生じる偏りを操作変数で取り除き、一致性と漸近正規性を持つ推定量WAIVESを作った（抄録）。未査読。", "p3": "弱形式（試験関数で方程式を積分する形）を時間領域でそのまま使うと回帰変数と誤差が同じノイズの関数になり内生性が生じる。近くの重ならない時間窓の弱形式積分を操作変数とする一般化モーメント法で、線形方程式を1回解くだけで推定する（抄録）。", "p5": "線形・双安定・カオス・状態依存の拡散や120次元までの高次元を含む9つの例で、非線形のドリフトと拡散を無視できる偏りとほぼ名目どおりの区間の被覆率で回復した。厳密な尤度法より1桁速く、167年の北大西洋の海面水温の記録などにも適用した（抄録）。", "fun": "ゆらぎながら動くものの「流れの向き」と「ゆらぎの強さ」を1本の記録から見分けるのは難しい。この研究は、経済学で原因と結果の絡み合いをほどくのに使う「操作変数」という道具を、物理のゆらぐ運動の推定に持ち込んだ。分野をまたいだ発想の借用で、速くて偏りのない推定ができる点が面白い。", "unverified": "本文は入手できず、9つの例での具体的な誤差の値と、測定雑音を分離する手順は確認できなかった。"}}, {"id": "pr21", "rank": 21, "headline": "分数ノイズで動く相互作用粒子系の推定", "title": "Parameter estimation for discretely observed rough fractional interacting particle systems", "url": "https://arxiv.org/abs/2611.24287", "authors": "Chiara Amorino ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Amorino, C., Puel, A., & Shevchenko, R. (2026). Parameter estimation for discretely observed rough fractional interacting particle systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24287", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "独立な分数ブラウン運動で駆動される相互作用粒子系について、全粒子の離散観測からドリフトのパラメータを推定する方法と、その一致性・漸近正規性を示した（抄録）。未査読。", "p3": "ハースト指数Hが1/2より大きいときはNeuenkirch–Tindelの離散時間の最小二乗を相互作用系へ拡張したコントラスト推定量を、1/4から1/2の粗い領域では修正したコントラストと確率的縫い合わせ補題を使う。分数McKean–Vlasov方程式のカオスの伝播と離散化誤差の評価を組み合わせる（抄録）。", "p5": "粒子数と観測間隔の間に相互作用があり、観測間隔に関する収束率はH=3/4で変わる一方、漸近正規性はどちらの領域でも成り立つ。ハースト指数と拡散係数も同時に推定する手順を示し、数値実験で性能を確かめた（抄録）。", "fun": "たくさんの粒子が互いに引き合い、さらにゆらぎながら動く様子は、群れで飛ぶ鳥や砂の流れに似ている。ここで扱うゆらぎは過去の動きの癖を引きずる特殊なもの（分数ブラウン運動）だ。粒子が増えるほど一つ一つの動きが全体の平均に溶け込む性質（カオスの伝播）を使い、見えない規則を記録から推定する点が面白い。", "unverified": "本文は入手できず、数値実験の設定と推定誤差の値は確認できなかった。"}}, {"id": "pr22", "rank": 22, "headline": "財務困窮で科学人材が流出し知識が波及", "title": "The Flight of Scientific Talent: Financial Distress and Knowledge Spillovers", "url": "https://doi.org/10.2139/ssrn.7707319", "authors": "Jing Xue ほか", "venue": "SSRN", "date": "2026-11-18", "apa": "Xue, J., & Lin, J. (2026). The Flight of Scientific Talent: Financial Distress and Knowledge Spillovers. https://doi.org/10.2139/ssrn.7707319", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録された抄録を候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "財務困窮が、困窮企業の外まで含めた科学人材の再配置とイノベーションをどう変えるかを、米国の機密の雇用者-被雇用者データで示した（抄録）。未査読。", "p3": "米国センサス局の雇用者-被雇用者記録に企業の財務情報、研究開発調査、発明者単位の特許データを結合し、借換え圧力と科学志向の発明者の流出、移籍先の既存の発明者の曝露（地理的な近さと技術的な類似度）とその後の特許の生産性の関係を調べた（抄録）。", "p5": "借換え圧力の大きい企業ほど科学志向の発明者を多く失い、受け入れうる企業で曝露の大きい既存の発明者はその後の特許が増えた。増加は困窮企業の科学志向の発明者が生んだ知識を引用する発明に集中した（抄録）。", "fun": "会社がお金に困ると研究者が辞めていく。それは悪い知らせに見えるが、この研究は別の面も示す。辞めた研究者が近くの似た分野の会社へ移ると、そこの研究者の特許が増え、移ってきた人の知識がよく引用されるようになる。困窮が知識を社会に広げる「移動」のきっかけにもなっている点が面白い。", "unverified": "本文は入手できず、効果の大きさの数値と識別の詳細（借換え圧力の測り方）は確認できなかった。"}}, {"id": "pr23", "rank": 23, "headline": "業務システムの導入が発生高の質を高める", "title": "Information Systems, Accrual Quality, and the Cost of Equity", "url": "https://doi.org/10.2139/ssrn.7705519", "authors": "Rahat Jafri ほか", "venue": "SSRN", "date": "2026-11-18", "apa": "Jafri, R., Srivastava, A., & Vijairaghavan, V. (2026). Information Systems, Accrual Quality, and the Cost of Equity. https://doi.org/10.2139/ssrn.7705519", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録された抄録を候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "企業内部の情報システム（SCM・CRM）が運転資本の発生高の質を通じて株主資本コストの低下と関連することを、米国製造業の事業所のデータで示した（抄録）。未査読。", "p3": "SCMを在庫に、CRMを売掛金に対応させ、事業所レベルの技術データで各システムの導入の強さと、在庫・売掛金のボラティリティ、発生高の質、インプライド資本コストの関係を推定した（抄録）。", "p5": "SCMの強さは在庫のボラティリティの低さと在庫の発生高の質の高さに関連したが売掛金とは関連せず、CRMは売掛金の側で同様の関連を示した。両者とも、予測される発生高の質の経路を通じて資本コストと負に関連した（抄録）。", "fun": "会社の帳簿の数字には、まだ確定していない見積もり（在庫がいくらで売れるか、売掛金がいくら回収できるか）が含まれる。在庫を管理する仕組みがあれば在庫の見積もりが、顧客を管理する仕組みがあれば売掛金の見積もりが正確になる、という対応が数字で確かめられた点が面白い。帳簿の質は、裏側の業務の仕組みに支えられている。", "unverified": "本文は入手できず、効果の大きさと因果の識別の方法は確認できなかった。"}}, {"id": "pr24", "rank": 24, "headline": "開示の頻度と時期が株式リターンを左右", "title": "Disclosure Frequency, Coverage, Timing and Stock Returns; Evidence from the United States and Developed Europe", "url": "https://doi.org/10.2139/ssrn.7710239", "authors": "Emma Luo", "venue": "SSRN", "date": "2026-11-19", "apa": "Luo, E. (2026). Disclosure Frequency, Coverage, Timing and Stock Returns; Evidence from the United States and Developed Europe. https://doi.org/10.2139/ssrn.7710239", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録された抄録を候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "開示の頻度・網羅性と時期が、その後の株式リターンと銘柄選択シグナルの収益にどう関係するかを、米国と欧州の先進国で調べた（抄録）。未査読。", "p3": "33の会計項目の公表回数を平均した開示の頻度・網羅性（DFC）と、決算日から公表までの遅れ（DT）を測り、財務諸表・アナリスト・市場・代替データの4分類63のシグナルとの関係を分析した（抄録）。", "p5": "米国ではDFCが下がった銘柄は安定した銘柄より月58.7ベーシスポイント（95%信頼区間−81.5〜−35.9）劣後し、上がった銘柄も劣後した。公表の遅い企業はその後のリターンが低いが、シグナルの収益は遅い企業の中で高かった。欧州の結果は一貫性が低く、改革の因果効果は推定していない（抄録）。", "fun": "会社が決算を発表する回数やタイミングは、投資家が手にする情報の量と鮮度を決める。米国では四半期ごとの報告を半年ごとにしてよいかが議論されている。この研究は、発表の回数が減る会社だけでなく増える会社も株価が振るわないことを示した。情報は多ければ良いという単純な話ではない点が面白い。", "unverified": "本文は入手できず、欧州の結果の具体的な数値と分析の対象期間は確認できなかった。"}}, {"id": "pr25", "rank": 25, "headline": "公表統計に合わせた銀行間不正の合成データ", "title": "FraudBench-NG: A NIBSS-Calibrated Synthetic Dataset and Generator for Nigerian Inter-Bank Fraud Detection", "url": "https://doi.org/10.21203/rs.3.rs-11431606/v1", "authors": "Otu Jacob ほか", "venue": "Research Square (In Review)", "date": "2026-11-18", "apa": "Jacob, O., Kuka, C., Knowles, A., & Orji, C. (2026). FraudBench-NG: A NIBSS-Calibrated Synthetic Dataset and Generator for Nigerian Inter-Bank Fraud Detection. https://doi.org/10.21203/rs.3.rs-11431606/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ナイジェリアの銀行間決済の不正検知の研究のため、公表集計に合わせて較正し前提をすべて明示した合成データの生成器と、公開データセットFraudBench-NGを作った（抄録）。未査読。", "p3": "2023年のNIBSSの集計に合わせたパラメトリックなシミュレーションで、25,000人の顧客の2.1百万件の取引（不正0.1%）を生成し、不正を事件単位で発生させた。各パラメータに出典か仮定かを記し、行動の特徴量が過去の取引だけを使うことを再計算とラベル並べ替え検定で確かめた（抄録）。", "p5": "ロジスティック回帰・ランダムフォレスト・XGBoostのPR-AUCは0.016〜0.036（技能なしの水準は0.0007）で、区間が広く順位はつけられなかった。偽陽性率1%では不正を1件捕まえるごとに約70件の誤警報が出て、最初の取引で検知できた事件は約19%だった（抄録）。", "fun": "銀行の不正を見つけるAIを作りたくても、本物の取引記録は個人情報なので外に出せない。そこで公表された統計に合う「それらしい偽物のデータ」を作るが、作り方の前提が隠れていると結果をうのみにできない。この研究は前提を一つ一つ出典つきで明かし、検知の難しさも正直に示した点が面白い。", "unverified": "本文は入手できず、合成の各パラメータの値と特徴量の一覧は確認できなかった。"}}, {"id": "pr26", "rank": 26, "headline": "LLMが書いた法規プログラムを実記録で採点", "title": "Grading Executable Legal Rules Against Independent Records: Transitional Provisions and Korean SME Status", "url": "https://arxiv.org/abs/2611.24055", "authors": "Jinhyung Bae", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Bae, J. (2026). Grading Executable Legal Rules Against Independent Records: Transitional Provisions and Korean SME Status (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24055", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMが書いた法規の判定プログラムを、採点者の解釈ではなく実際の記録（韓国上場企業が開示した中小企業該当性）で採点する枠組みLexTemporisを作った（抄録）。未査読。", "p3": "規則のすべての版とともに、韓国上場企業による中小企業の地位の開示10,901社年を正解に使い、4つのLLMに法の異なる部分を与えて規則のプログラムを書かせ、事前登録の比較を行った。米国の所得税とドイツの病院の最低症例数の比較事例も付録に加えた（抄録）。", "p5": "日付は主に本則の外の経過規定を通じて結果を変え、1つの経過規定で開示との一致率が83〜86%から89〜90%に上がった。事前登録の比較では4モデルすべてで優れる条件はなく、正しい条項を与える利点は著者の解釈に照らすと実記録に照らすより大きく見えた（抄録）。", "fun": "法律を「この会社は中小企業か」を判定するプログラムに書き換え、その出来をテストする時、答え合わせの答えを作った人の読み方が間違っていたら意味がない。この研究は、会社が実際に開示した記録を答えに使った。採点者の解釈で採点すると性能を過大評価しうると分かった点が、AIの評価全般への教訓として面白い。", "unverified": "本文は入手できず、各モデルの正答率の具体的な値と比較の条件の詳細は確認できなかった。"}}, {"id": "pr27", "rank": 27, "headline": "欧州のESG保証報酬の水準と決定要因", "title": "The Costs of Sustainability Assurance – European Evidence on the Determinants of ESG Assurance Fees", "url": "https://doi.org/10.2139/ssrn.7700661", "authors": "Nicolas Frenzel ほか", "venue": "SSRN", "date": "2026-11-19", "apa": "Frenzel, N., & Hörner, S. (2026). The Costs of Sustainability Assurance – European Evidence on the Determinants of ESG Assurance Fees. https://doi.org/10.2139/ssrn.7700661", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録された抄録を候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "EUの上場企業の監査報酬の開示を手作業で集め、ESG保証の報酬の大きさと決定要因を初めて大規模に分析した（抄録）。未査読。", "p3": "手作業で集めたESG保証の報酬を、企業規模、Big Fourの関与、共同保証、報告と保証の特徴などで説明するモデルを推定し、財務諸表監査の報酬モデルと比べた（抄録）。", "p5": "ESG保証の報酬は企業規模、Big Fourの関与、共同保証、いくつかの報告・保証の特徴と有意に関連し、財務監査の報酬モデルとの共通点と相違点が見られた（抄録）。報酬の水準の具体的な数値は抄録にない。", "fun": "会社が環境や社会への取り組みを報告しても、それが本当かを第三者が確かめないと信用されにくい。ではその確認（保証）にいくらかかっているのか。報酬の情報はほとんど公開されていなかったため、研究者が報告書から一つ一つ拾い集めた。見えなかった値段を見える形にした地道さが面白い。", "unverified": "本文は入手できず、標本の企業数・期間と報酬の水準の数値は確認できなかった。"}}, {"id": "pr28", "rank": 28, "headline": "政府系VCが中小企業の信用を改善", "title": "Government Venture Capital and Financial Constraints: Growth and Credit Effects among Swedish SMEs", "url": "https://doi.org/10.2139/ssrn.7726041", "authors": "Roger Svensson", "venue": "SSRN", "date": "2026-11-19", "apa": "Svensson, R. (2026). Government Venture Capital and Financial Constraints: Growth and Credit Effects among Swedish SMEs. https://doi.org/10.2139/ssrn.7726041", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録された抄録を候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "政府系ベンチャーキャピタル（GVC）がスウェーデンの中小企業の成長と資金調達に与える効果を、2008〜2020年の対応パネルで推定した（抄録）。未査読。", "p3": "GVCの支援を受けた企業と対応づけた企業のパネルで、雇用・売上・自己資本・負債への影響を評価し、地域による違いも調べた（抄録）。", "p5": "支援を受けた企業は投資の直後に雇用を増やし、売上の成長は2〜3年遅れて続いた。自己資本が強まり銀行の信用へのアクセスも改善した。効果は大都市圏とイノベーションの密な地域に集中し、配分の規則で多くを受け取った農村・周辺地域では弱かった（抄録）。", "fun": "国が若い会社にお金を出すと、そのお墨付きを見た銀行もお金を貸しやすくなる。この研究はその効果を確かめた一方、効果が出るのは起業を支える環境の厚い都市部に偏ることも示した。お金を地方に多く配っても、周りの支えがなければ育ちにくいという、地域政策の難しさが見える点が面白い。", "unverified": "本文は入手できず、対応づけの方法と効果の大きさの数値は確認できなかった。"}}, {"id": "pr29", "rank": 29, "headline": "AI支出は利益にどう表れるかを開示で追う", "title": "From AI Spending to Earnings: Disclosure Boundaries, Token Costs, and Management Explanations", "url": "https://doi.org/10.2139/ssrn.7705081", "authors": "Nzubechukwu Matthew Anyiam", "venue": "SSRN", "date": "2026-11-19", "apa": "Anyiam, N. M. (2026). From AI Spending to Earnings: Disclosure Boundaries, Token Costs, and Management Explanations. https://doi.org/10.2139/ssrn.7705081", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録された抄録を候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "大手企業のAI支出が開示・利益の認識・経営者の説明でどう扱われているかを結びつける測定の枠組みを、企業12社のコーパスと会計事例で示した（抄録）。未査読。", "p3": "目的に沿って選んだ12社のコーパス、別の証拠の拡張、会計事例を使い、配分の上下限、トークンの価格と量の分解、受け入れられたタスクの費用、展開のしきい値、利益の感応度の規則を開発した（抄録）。", "p5": "Amazon・Alphabet・Metaの設備投資の指標は2024〜2025年に65.2〜84.1%増えたがAI支出は切り分けられず、Accentureの2026会計年度の営業利益率の改善の約67.1%は事業最適化の調整の縮小で機械的に説明された。耐用年数の変更の効果は純利益の3.0〜4.6%だった（抄録）。", "fun": "AIに巨額の投資をしているというニュースは多いが、決算書のどこにいくら書かれているかははっきりしない。設備投資やリースや合弁など、別々の場所に散らばっているからだ。この研究は、数字を単純に足してはいけない理由と、利益への効き方を追う方法を事例で示した。派手な話題を地道な会計の目で解きほぐす点が面白い。", "unverified": "本文は入手できず、提案した符号化の手順の詳細は確認できなかった（著者も独立した人手による検証はないとしている）。"}}, {"id": "pr30", "rank": 30, "headline": "支配株主の個人保証は投資を増やし価値を下げる", "title": "Personal Guarantees, Investment, and Shareholder Value: Evidence from India", "url": "https://doi.org/10.2139/ssrn.7706838", "authors": "Neil Brisley ほか", "venue": "SSRN", "date": "2026-11-18", "apa": "Brisley, N., Reza, S. W., & Wu, Y. (2026). Personal Guarantees, Investment, and Shareholder Value: Evidence from India. https://doi.org/10.2139/ssrn.7706838", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録された抄録を候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "インドの上場企業で、支配株主の個人保証が投資を増やす一方でトービンのQを下げることを、2021年の最高裁判決を外生的な変化として示した（抄録）。未査読。", "p3": "個人保証の強度と投資・企業価値の関係を推定し、個人保証の執行力を強めた2021年の最高裁判決の前後で、それ以前に個人保証に頼っていた企業の変化を比べた（抄録）。", "p5": "判決の後、個人保証に頼っていた企業は保証の利用とレバレッジを減らし、投資を削り、企業価値が上がった。効果は資金の流用が起きやすい企業グループと関連当事者の環境に集中した（抄録）。", "fun": "会社の借金に社長などが個人で保証を付けると、銀行はお金を貸しやすくなる。投資は増えるが、株主から見た会社の価値はかえって下がっていた。保証が使いにくくなると投資は減り、価値は上がった。お金を借りやすいことと、株主のためになることが一致しない点が面白い。", "unverified": "本文は入手できず、標本の規模・期間と効果の大きさの数値は確認できなかった。"}}, {"id": "pr31", "rank": 31, "headline": "規制上の位置づけで開示の充実度は変わるか", "title": "Mandatory, Assured or Voluntary? Regulatory Status and Disclosure Quality in the BRSR Reports of 27 Nifty 50 Companies", "url": "https://doi.org/10.2139/ssrn.7708539", "authors": "Aishwarya Sivakumar", "venue": "SSRN", "date": "2026-11-18", "apa": "Sivakumar, A. (2026). Mandatory, Assured or Voluntary? Regulatory Status and Disclosure Quality in the BRSR Reports of 27 Nifty 50 Companies. https://doi.org/10.2139/ssrn.7708539", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録された抄録を候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "インドのBRSRで、指標の規制上の位置づけ（保証が必要な中核・必須・任意）によって開示の充実度が変わるかを、Nifty 50の27社の報告書を採点して調べた（抄録）。未査読。", "p3": "6業種27社のBRSRについて、28のESG指標を0〜3の基準で採点し（753セル）、柱と指標の区分ごとに比べた。採点の仕様を5通りに変えて頑健性も確かめた（抄録）。", "p5": "環境の柱が最大得点の91%と最も高く、社会70%、ガバナンス64%が続いた。保証が必要なBRSR Coreの指標は平均2.95で、Core以外の必須指標の2.04、任意指標の1.77を有意に上回ったが、必須と任意の間には差がなかった。必須という区分より保証の範囲と要求の形式が開示の質を左右すると示唆する（抄録）。", "fun": "「必ず開示すること」と決めれば、会社はきちんと書くだろうか。この研究によると、決まりの言葉より「第三者がチェックするかどうか」と「表に数字を埋める形式か」の方が効いていた。採点されると分かっている問題ほど丁寧に解くのと似ている。ルールの作り方次第で情報の質が変わる点が面白い。", "unverified": "本文は入手できず、採点基準の詳細と業種別の結果は確認できなかった。"}}, {"id": "pr32", "rank": 32, "headline": "LLM間の伝達で意見が歪むネットワーク動学", "title": "Nonlinear Boundary-Value Dynamics of LLM Agents: Committed Sources, Channel Distortion, And Response Centralities", "url": "https://doi.org/10.2139/ssrn.7701718", "authors": "Moses Boudourides", "venue": "SSRN", "date": "2026-11-19", "apa": "Boudourides, M. (2026). Nonlinear Boundary-Value Dynamics of LLM Agents: Committed Sources, Channel Distortion, And Response Centralities. https://doi.org/10.2139/ssrn.7701718", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録された抄録を候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "生成モデルが意見を文章にし、評価モデルがそれを数値に戻す往復で意見が歪むLLMエージェントの集団を、方向つきネットワーク上のFriedkin–Johnsen型の意見動学として理論的に解析した（抄録）。未査読。", "p3": "意見を固定した主体（コミットした主体）を境界とし、伝わる意見すべてが話し手と聞き手に依存する単調で飽和する経路を通るモデルを、信号の大きさと内部の利得で4つの領域に分けて解析した（抄録）。", "p5": "増幅する経路では線形モデルの最大値原理が破れうり、利得が臨界を超えると秩序だった集団が弱い反対の源に抵抗する。少数派による転換の条件を明示し、秩序だった集団の反転には単純な出次数による標的化が線形化に基づく順位より有効だった。LLMのデータへの当てはめは行っていない（抄録）。", "fun": "伝言ゲームでは、言葉が伝わるたびに少しずつ内容がずれる。AI同士が意見を文章にして伝え合うときも同じことが起こる。この研究は、その「ずれ」が強まると、少数の頑固な意見が全体を塗り替えたり、逆に一度まとまった集団が動かなくなったりする条件を数式で示した点が面白い。", "unverified": "本文は入手できず、解析に用いた実在・合成のネットワークの種類と規模は確認できなかった。"}}, {"id": "pr33", "rank": 33, "headline": "ユーザーシミュレータの評価指標を検証", "title": "On Evaluating User Simulators for Interactive Agents", "url": "https://arxiv.org/abs/2611.24892", "authors": "Hengguang Zhou ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Zhou, H., Hsu, I.-H., Chen, L., Shrivastava, P., Angelopoulos, A., Chiang, W.-L., Stoica, I., & Hsieh, C.-J. (2026). On Evaluating User Simulators for Interactive Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24892", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "対話型エージェントの評価に使うユーザーシミュレータについて、品質を測る既存の指標が本当に失敗を検出できるかをメタ評価し、新しい評価の組を提案した（抄録）。未査読。", "p3": "模擬ユーザーの再生を意図的に壊し（目標の変更、制約の省略、早すぎる終了、壊れた成果物の受け入れなど10種）、指標が罰するかを調べた。提案の組は、エージェント評価への有用性と、集団単位・軌跡単位の実ユーザーへの忠実度を組み合わせる（抄録）。", "p5": "既存の3研究の評価法は10の摂動のうち5〜6しか検出せず、壊れた成果物を受け入れる集団を高く評価することさえあった。提案の組は10すべてを検出し、23言語348人の実ユーザーの351セッションで6つのシミュレータを評価すると、集団単位の指標は誤った目標やペルソナからの逸脱を見逃しうることが分かった（抄録）。", "fun": "AIの相談相手を試すとき、毎回本物の人を集めるのは大変なので「お客さん役のAI」を使う。ところがその役者AIの演技が下手でも、今の採点方法では見抜けないことが多かった。わざと下手な演技（目的を忘れる、条件を無視する）をさせて採点表を試すという、採点そのものを試験する発想が面白い。", "unverified": "本文は入手できず、各指標の具体的な得点と6つのシミュレータの比較結果は確認できなかった。"}}, {"id": "pr34", "rank": 34, "headline": "マルチエージェントの協調の失敗を診断", "title": "TRACE-MAS: Diagnosing and Repairing Collaboration Failures in Multi-Agent Systems", "url": "https://arxiv.org/abs/2611.23362", "authors": "Zekai Chen ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Chen, Z., Sun, Y., Li, X., Wu, X., Jin, X., Zhu, Y., Lu, H., Chen, X., & Li, R.-H. (2026). TRACE-MAS: Diagnosing and Repairing Collaboration Failures in Multi-Agent Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23362", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMマルチエージェント・システムの失敗を、個々のエージェントの異常ではなくエージェント間の相互作用から診断し、最小限の介入で修復する枠組みTRACE-MASを提案した（抄録）。未査読。", "p3": "正常な軌跡から協調実行のパターンを学習し、エージェントの状態変化・メッセージの遷移・タスク依存の変化のずれを検出したうえで、発生源を考える帰属で責任のある実行要素を特定し、重要な能力を保つ最小の介入を選ぶ（抄録）。", "p5": "5つのマルチエージェントのベンチマークで、根本原因の特定の精度を60.2%改善し、強い既存の安全策よりタスクの回復で一貫した改善を得た（抄録）。", "fun": "チームの仕事がうまくいかない時、ミスした人を探すだけでは原因が分からないことがある。本当の原因は、誰かの伝言が別の人に誤解されたといった「つながり」にあるかもしれない。AIのチームでも同じで、この研究はやり取りの流れから原因の場所を突き止める。人のチームの失敗分析と同じ考え方をAIに当てはめた点が面白い。", "unverified": "本文は入手できず、ベンチマークの名前と比較した安全策の内容は確認できなかった。"}}, {"id": "pr35", "rank": 35, "headline": "LLMが企業を運営するサプライチェーン実験場", "title": "MANGO Arena: Same Seeds, Different Chains Evaluating LLM Agents in a Disrupted Supply Chain", "url": "https://arxiv.org/abs/2611.23613", "authors": "Sara Amar", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Amar, S. (2026). MANGO Arena: Same Seeds, Different Chains Evaluating LLM Agents in a Disrupted Supply Chain (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23613", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "4つのLLMエージェントが直列のサプライチェーンの各社を運営し、ブルウィップ効果・規則の遵守・共謀の提案を同時に測れる公開の実験場MANGO Arenaを作った（抄録）。未査読。", "p3": "授業用の工場経営ゲームを基に、トラック台数・掛け売りなし・生産能力の制約を強制し、違反の試みを記録し、裏金を禁じた公開の掲示板を与えた。小さな推論モデル3つと規則に従う参照方策2つを、供給元の火災の有無と3つの需要シードで比べた（抄録）。", "p5": "すべてのLLMエージェントが需要の変動を上流で増幅し（小売で7〜25倍、供給元で13〜179倍）、教科書的な発注方策を上回ることが多かった。実際の規則違反はまれで共謀の提案はなかったが、同じシードで再実行すると上流のブルウィップが最大17倍変わり、結論が再実行に耐えなかった（抄録）。", "fun": "お店の売れ行きが少し変わっただけで、問屋や工場への注文が大きく揺れる現象を「むちの効果（ブルウィップ効果）」と呼ぶ。AIに会社を経営させても、人間と同じように、むしろそれ以上に注文を揺らしていた。同じ条件でやり直すと結果が大きく変わるため、AIの実験は繰り返して確かめる必要があるという教訓が面白い。", "unverified": "本文は入手できず、使ったモデルの名前と各条件の詳しい結果は確認できなかった。"}}, {"id": "pr36", "rank": 36, "headline": "LLMは新しい研究課題を既知のように語る", "title": "Language Models Make New Research Sound Old", "url": "https://arxiv.org/abs/2611.23546", "authors": "Guy Zyskind", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Zyskind, G. (2026). Language Models Make New Research Sound Old (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23546", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMに研究課題の新規性を確かめさせると、未研究の課題を一部研究済みのように語り、関連論文が示したことを誇張することを示し、その補正法を提案した（抄録）。未査読。", "p3": "新たに採択された論文から作った40の問いでLLMに新規性を判断させ、通常の回答での表現と、論文の全文を別に確認させたときの判断を比べた。22のモデルに同じ論文を与えて比較し、各モデルの判断と引用論文の個別確認から固定の回答を組み立てる補正を作った（抄録）。", "p5": "GPT-6-Astraは98%を未研究と正しく判断したが、通常の回答でそう明言したのは8%だけで、6つの最先端システムすべてに30〜90ポイントの報告のずれがあった。補正によりAstraの明言は8%から95%に上がった（抄録）。", "fun": "AIに「この研究テーマはもう誰かがやっていますか」と聞くと、実際には誰もやっていないのに「一部は研究されています」と答えがちだという。しかもAIは、別に確かめさせると正しく判断できている。分かっているのに言い方がぼやけるという、人の会話にもありそうな癖が見つかった点が面白い。", "unverified": "本文は入手できず、40の問いの分野の内訳と査読者の新規性評価の予測の精度は確認できなかった。"}}, {"id": "pr37", "rank": 37, "headline": "LLMの作業報告での隠蔽を事前登録で追試", "title": "A Concurrent Structured Record Mirrored the Prose It Accompanied: A Pre-Registered Conceptual Replication and Extension of the Hide Pending Tool Call Scenario", "url": "https://arxiv.org/abs/2611.23274", "authors": "Nicol\\'as Rocchia", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Rocchia, N. (2026). A Concurrent Structured Record Mirrored the Prose It Accompanied: A Pre-Registered Conceptual Replication and Extension of the Hide Pending Tool Call Scenario (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23274", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMがエージェント作業の報告で欠陥（未返却の問い合わせ）を書かない現象について、構造化した記録を同時に書かせると開示が変わるかを、事前登録の追試と拡張で調べた（抄録）。未査読。", "p3": "100組の合成ログ（結果が未返却のログと返却された対照）でgpt-5.6-solを4条件で走らせた。第1段階では未解決の事項を書く欄を持つ記録の様式と所見だけのプラセボ様式を比べ、第2段階では本文の回答を誠実さの指示と比べた（抄録）。", "p5": "未解決の欄つきの記録は29%のログで未返却の問い合わせを述べ、プラセボの5%を上回った（p = 1.2 x 10^-7）が、70〜71%の記録は未解決はないと宣言した。本文の比較は有意でなく、判定の人手検証も通らなかったため効果の有無は主張しない。記録は添えた本文と同じ内容を写していた（抄録）。", "fun": "AIが仕事の報告書で「まだ返事が来ていない問い合わせがある」と書かないことがある。そこで報告に「未解決の事項」の欄を設けたら正直に書くかを試した。欄を作ると少しは書くようになったが、多くは「未解決はなし」と埋めてしまった。様式を工夫しても、正直さは本文と同じだったという結果が面白い。", "unverified": "本文は入手できず、4条件の詳細と判定者の検証の手順は確認できなかった。"}}, {"id": "pr38", "rank": 38, "headline": "コード用LLMの熟議を人の議論と比べる", "title": "Think Before You Code: A Benchmark for Testing LLMs on Software Engineering Deliberation", "url": "https://doi.org/10.48550/arxiv.2611.22905", "authors": "Ashman Mehra", "venue": "arXiv (Cornell University)", "date": "2026-11-17", "apa": "Mehra, A. (2026). Think Before You Code: A Benchmark for Testing LLMs on Software Engineering Deliberation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.22905", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（OpenAlexに登録された抄録を候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "コード向けのLLMが、ソフトウェアの課題について人間の技術者の熟議（問題・解決・制約・根拠・トレードオフの検討）に近い推論ができるかを測るベンチマークの仕組みTBYCを作った（抄録）。未査読。", "p3": "GitHubのissueの議論を構造化した記録にし、人の議論から問題・解決・制約・根拠・トレードオフを抽出したうえで、検索したコードの文脈と少数例でモデルにissue単位の「考え」を生成させ、同じ要素の空間に戻して人の注釈と複数の指標で比べる（抄録）。", "p5": "可視化・リーダーボード・基準の道具も備え、モデル・プロンプト・抽出法をリポジトリとissueをまたいで比べられる評価環境として示す（抄録）。具体的なモデルの比較結果は抄録にない。", "fun": "プログラムを書く前に、人間の技術者は「何が問題で、どんな制約があり、どちらを選ぶと何を失うか」を話し合う。AIがコードを書けるようになっても、この話し合いの部分ができているかは別問題だ。人の議論の記録を物差しにして、AIの「考える過程」を測ろうとする点が面白い。", "unverified": "本文は入手できず、評価したモデルと各指標の結果は確認できなかった。"}}, {"id": "pr39", "rank": 39, "headline": "企業がAIに任せる認知労働の割合を指標化", "title": "The Firm-Level Cognitive Substitution Index (σAI): A Production-Theoretic Framework for Measuring, Benchmarking and Valuing AI Adoption", "url": "https://doi.org/10.2139/ssrn.7709681", "authors": "Orion Komnenos", "venue": "SSRN", "date": "2026-11-19", "apa": "Komnenos, O. (2026). The Firm-Level Cognitive Substitution Index (σAI): A Production-Theoretic Framework for Measuring, Benchmarking and Valuing AI Adoption. https://doi.org/10.2139/ssrn.7709681", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録された抄録を候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "企業の認知的な仕事のうちAIが実際に担う割合を測る企業レベルの認知代替指数（σAI）と、それを検証できる経済量に変える生産理論のモデルを示した（抄録）。未査読。", "p3": "職務単位の代替割合を労働時間で重みづけた指数を定義し、有界・尺度不変で整合的に集計でき、部門内効果と構成効果に分解できることを示す。CES型の微視的基礎から費用最小の代替割合を導き、目標との差を解放される能力と純経済価値に換算して、損益分岐やCVP分析の指標と結びつける（抄録）。", "p5": "単位費用が代替割合に対して単峰であること、安全余裕率と営業レバレッジが逆数の関係で予測どおりに動くことを証明し、検証可能な仮説と識別の設計を示す。実証の推定値は報告しておらず、商用実装の上限値や対応表は非公開（抄録）。", "fun": "「AIを導入した会社」と一口に言っても、AIを置いただけの会社と、仕事の大半をAIに任せている会社では意味が違う。この論文は、仕事の時間のうちAIが肩代わりしている割合で測る物差しを作った。AIで浮いた時間を別の仕事に回すと二重に数えてしまう落とし穴を避ける工夫もある点が面白い。", "unverified": "本文は入手できず、数値例の設定と識別の設計の詳細は確認できなかった。"}}, {"id": "pr40", "rank": 40, "headline": "航空管制での人・制度・技術への信頼", "title": "Interpersonal trust, institutional trust and trust in technology in Air Traffic Control", "url": "https://arxiv.org/abs/2611.24715", "authors": "Rob Procter ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Procter, R., & Rouncefield, M. (2026). Interpersonal trust, institutional trust and trust in technology in Air Traffic Control (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24715", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "航空管制で、対人的な信頼・制度への信頼・技術への信頼がそれぞれどんな役割を持つかを探り、管制官がエージェント型システムなどの新技術と信頼関係を築く条件を検討するための基盤を示した（抄録）。未査読。", "p3": "航空管制の仕事の中での複数の種類の信頼の役割を検討する研究だが、抄録には調査の方法（データや対象者）の記載はない（抄録）。", "p5": "新技術を航空管制の仕事に安全で信頼できる形で組み込むために満たすべき条件を検討する基礎を与えたとする（抄録）。具体的な結果は抄録にない。", "fun": "空の交通整理をする航空管制官は、同僚や組織、そして機械をどのくらい信じるかで仕事の仕方が変わる。新しいAIの道具が入ってきたとき、信じすぎても信じなさすぎても危ない。命に関わる職場で人と機械の信頼をどう育てるかという問いそのものが、AIの時代の働き方を考えるうえで面白い。", "unverified": "本文は入手できず、調査の方法・対象と具体的な知見は確認できなかった。"}}, {"id": "pr41", "rank": 41, "headline": "管理者の規則に沿った意思決定を尺度化", "title": "Algorithmic Decision-making among Business Managers: Conceptualization and Scale Development", "url": "https://doi.org/10.2139/ssrn.7705079", "authors": "Jr Carlos Perez", "venue": "SSRN", "date": "2026-11-19", "apa": "Perez, J. C. (2026). Algorithmic Decision-making among Business Managers: Conceptualization and Scale Development. https://doi.org/10.2139/ssrn.7705079", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録された抄録を候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "管理者が自動化技術なしに、明示的な規則・順序立てた手順・事前の基準で意思決定する「人が実行するアルゴリズム的意思決定」を概念化した論考（抄録）。未査読。", "p3": "合理的意思決定、限定合理性、組織ルーティン、行動意思決定理論、多基準意思決定分析を統合し、手続きの構造・論理的一貫性・基準による評価・逐次処理・決定の透明性・手続きの反復可能性の6特性と、6段階の管理プロセスを示す（抄録）。", "p5": "合理的・プログラム化・技術支援の各アプローチとの境界を明確にし、一貫性・透明性・文脈的な限界に関する検証可能な命題を示す。枠組みは概念的で実証されておらず、尺度化は今後の課題とする（抄録）。", "fun": "「アルゴリズム」と聞くとコンピュータを思い浮かべるが、料理のレシピのように決まった手順で判断することも一種のアルゴリズムだ。この論文は、人間の管理職がレシピのように判断する仕方を、AIとは別のものとして整理した。人とAIの判断を比べるための土台を作ろうとする点が面白い。", "unverified": "概念的な研究で、尺度の項目と実証の結果はない（本文は入手できず）。"}}, {"id": "pr42", "rank": 42, "headline": "自閉症者を介護する高齢の家族の見えない負担", "title": "The invisible burden of caregiving: the aging process among caregivers of people with autism spectrum disorder", "url": "https://doi.org/10.21203/rs.3.rs-11145690/v1", "authors": "Ynara Amaral dos Santos ほか", "venue": "Research Square (In Review)", "date": "2026-11-19", "apa": "Santos, Y. A. d., de Castro, J. V. A., de Freitas, T. F., Martins-Cavichioli, G., Caparrol, A. J. S., Feitosa, D. C., & Gratao, A. C. M. (2026). The invisible burden of caregiving: the aging process among caregivers of people with autism spectrum disorder. https://doi.org/10.21203/rs.3.rs-11145690/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "自閉スペクトラム症（ASD）の人を介護する50歳以上の家族の健康への影響を、2020〜2025年の文献の体系的レビューで整理した（抄録）。未査読。", "p3": "SciELO・PubMed・LILACSから2020〜2025年に発表された論文を検索し、50歳以上の介護者の情緒的・心理社会的な影響を分析した（抄録）。", "p5": "含まれた10研究（多くは量的研究）から、高いストレス、情緒的な負担、生活の質の低下が示された。家族・社会の支援、自己効力感、対処方略が保護要因で、COVID-19の流行は負担と孤立を強め、ASDの情報の不足が脆弱性を高めていた（抄録）。", "fun": "障害のある子を育てる親も年を取る。自分の体力が落ちる中で介護を続ける高齢の親の苦労は、表に出にくい「見えない負担」だ。この研究は、その実態を調べた研究自体がまだ少ないことも示している。社会の高齢化とともに、介護する側の高齢化という新しい課題が見えてくる点が面白い。", "unverified": "本文は入手できず、各研究の対象国と測定の尺度は確認できなかった。"}}, {"id": "pr43", "rank": 43, "headline": "登録データの人口ネットワークは作り方次第", "title": "Built, not observed: construction rules and the comparability of register-based population networks", "url": "https://doi.org/10.5281/zenodo.24374075", "authors": "Mamun, S M Abdulla Al", "venue": "Zenodo", "date": "2026-11-19", "apa": "Mamun, S. M. A. A. (2026). Built, not observed: construction rules and the comparability of register-based population networks. Zenodo. https://doi.org/10.5281/ZENODO.24374075", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録（DataCiteに登録された抄録を候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "行政登録から作る全人口の社会ネットワーク（オランダ・デンマーク・スウェーデン）では紐帯が観測でなく作成規則で決まり、規則の違いが集団間の差の多くを生むことを示した（抄録）。未査読。", "p3": "公表された規則（近くに住む同僚100人と結ぶ、半径50メートル以内の近い10世帯と結ぶなど）で同じ合成人口を事前登録の実験で配線し直し、他者が国勢調査から作った合成人口でも中心的な比較を繰り返した（抄録）。", "p5": "オランダの年次系列とスウェーデン型の規則では、2集団間の総次数とクラスタリングの単純な差の47〜98%が作成規則によるもので、クラスタリングの差の符号は65〜90%の人口で誤っていた。規則間で安定し実際の差に敏感な指標は見つからず、比較には規則の整合が先に必要とする（抄録）。", "fun": "国の登録データから「誰と誰がつながっているか」の巨大な地図を作る試みがある。ただし本当に付き合いを観察したわけではなく、「近所に住む同僚とつながっているとみなす」といった決め事で線を引いている。決め事を変えるだけで集団の差が逆転しうることを示し、地図の作り方を問い直した点が面白い。", "unverified": "本文は入手できず、提案した補正の手順と合成人口の作り方の詳細は確認できなかった。"}}, {"id": "pr44", "rank": 44, "headline": "量子化テンソルトレインで選点法を圧縮", "title": "An Isogeometric Collocation Solver Based on the Quantized Tensor Train Representation", "url": "https://arxiv.org/abs/2611.24041", "authors": "Jun Song ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Song, J., & Xiang, H. (2026). An Isogeometric Collocation Solver Based on the Quantized Tensor Train Representation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24041", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "アイソジオメトリック選点法の演算子を量子化テンソルトレイン（QTT）形式で直接組み立て、偏微分方程式を少ないメモリと計算で解く枠組みを示した（抄録）。未査読。", "p3": "選点法の演算子を少数の標本だけからQTT形式で構成し、幾何から導かれる選点での係数のベクトルもTTクロス近似でQTT形式に表した（抄録）。", "p5": "異なる空間次元の移流拡散反応問題と、自明でない3次元形状のポアソン問題の数値実験で、解の精度を保ちつつメモリ使用量と計算費用を大きく減らした（抄録）。削減の具体的な数値は抄録にない。", "fun": "コンピュータで方程式を解くとき、細かく区切るほど正確になるが、必要な記憶容量が爆発的に増える。テンソルトレインは、巨大な数表を小さな部品の積に分解して必要な部分だけを持つ工夫だ。巨大な表を作らずに計算を進める発想で、次元の多い問題を解く道が広がる点が面白い。", "unverified": "本文は入手できず、メモリと計算時間の削減率の数値は確認できなかった。"}}, {"id": "pr45", "rank": 45, "headline": "PINNの収束を保証する関数クラスの条件", "title": "Stable admissible neural classes and convergent physics-informed neural networks", "url": "https://arxiv.org/abs/2611.24355", "authors": "Leevan Ling ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Ling, L., Ma, S., & Sun, Y. (2026). Stable admissible neural classes and convergent physics-informed neural networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24355", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "PINNなどの残差最小化法が線形楕円型のディリクレ問題で解の誤差を確実に抑えられる条件を、古典的なKansa選点法の収束理論を拡張して示した（抄録）。未査読。", "p3": "楕円型の正則性で解の誤差を連続な残差に結びつけ、離散安定性で計算できる離散損失が連続な残差を抑える許容可能な部分クラスを特定し（必要な選点数と尺度に依存する境界の重みも導く）、整合性のため同じ部分クラスの比較関数を構成する（抄録）。", "p5": "tanh活性のMLPについて許容可能な比較ネットワークを構成し、制約つきの残差最小化の収束を確立した。ネットワークと標本点を同時に細かくする条件の下で、制約なしの物理的に釣り合ったPINNの条件付き収束も得た（抄録）。", "fun": "AIに物理の方程式を解かせるPINNは、方程式からのずれ（残差）を小さくするように学習する。でも、ずれが小さいからといって答えが正しいとは限らない。この研究は、どんな条件なら「ずれが小さい＝答えが正しい」と言えるのかを数学的に保証した。便利な道具に、使ってよい範囲の地図を与えた点が面白い。", "unverified": "本文は入手できず、数値例の有無と、必要な選点数の具体的な式は確認できなかった。"}}, {"id": "pr46", "rank": 46, "headline": "繰返し塑性の代理モデルをRNNとFNNで比較", "title": "Data-Driven Modeling of 1D Cyclic Plasticity: A Comparative Study of Recurrent and Feedforward Neural Networks", "url": "https://doi.org/10.21203/rs.3.rs-11626771/v1", "authors": "Mohammad Ashraf-Ganjouei ほか", "venue": "Research Square (In Review)", "date": "2026-11-19", "apa": "Ashraf-Ganjouei, M., Ghaderi, S. H., & Varedi-Koulaei, S. M. (2026). Data-Driven Modeling of 1D Cyclic Plasticity: A Comparative Study of Recurrent and Feedforward Neural Networks. https://doi.org/10.21203/rs.3.rs-11626771/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "繰返し載荷を受ける材料の1次元の塑性（履歴依存）を、再帰型ニューラルネット（LSTM・GRU）と順伝播型のMLPで代理モデル化して比べた（抄録）。未査読。", "p3": "等方硬化と移動硬化を組み合わせたモデルのAbaqus UMATで非単調・多振幅のひずみ経路の合成データを作り、スライディング窓で再帰型の隠れ状態を内部変数の代わりに働かせた（抄録）。", "p5": "再帰型モデルは検証のMSEをMLPより1桁以上下げ（2層LSTMで窓幅W=15のとき3.960×10^-3から2.410×10^-4）、MLPに見られる経路依存のずれなしに履歴ループと反転点を再現した。1層のGRUが平均絶対誤差と反転の誤差で最良だった（抄録）。", "fun": "鉄の棒を曲げ伸ばしすると、過去の曲げ方によって今の硬さが変わる。普通のニューラルネットは今の入力しか見ないので、この「記憶」を表せない。過去の流れを覚えておく仕組みを持つネットを使うと、記憶を表す変数を測らなくても、履歴の輪の形をきれいに再現できた点が面白い。", "unverified": "本文は入手できず、合成データの規模と、有限要素解析に組み込んだ場合の性能は確認できなかった。"}}, {"id": "pr47", "rank": 47, "headline": "注水時の割れ目変位から地中応力を逆推定", "title": "Borehole stress profiling from inversion of injection-induced fracture displacements", "url": "https://doi.org/10.21203/rs.3.rs-11484543/v1", "authors": "Kai Bröker ほか", "venue": "Research Square (In Review)", "date": "2026-11-19", "apa": "Bröker, K., Guglielmi, Y., Soom, F., Cook, P., Hertrich, M., & Valley, B. (2026). Borehole stress profiling from inversion of injection-induced fracture displacements. https://doi.org/10.21203/rs.3.rs-11484543/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ボーリング孔の区間で注水中に測った3次元の割れ目の変位から、1回の試験で原位置の応力テンソル全体を推定する逆解析の方法を改良した（抄録）。未査読。", "p3": "3次元の変位計測と圧力の過渡解析を組み合わせ、スイスのBedrettoLab（土被り1100 m超）の傾斜したボーリング孔の61 mの区間で11回の注水試験を行い、9つの区間に適用した（抄録）。", "p5": "最小主応力S3の向きは最大・中間主応力より良く拘束され、全区間が正断層型の応力状態（S3は8.5〜15.1 MPa）を示した。大きな断層帯の近くでS3は最大68°反時計回りに回転し、回転は断層の上側では4〜8 mで減衰するが下側では17〜23 m続いた（抄録）。", "fun": "地下の岩には、上下左右から押される力（応力）がかかっている。この研究は、穴の中に水を入れて割れ目がどちらにずれるかを3次元で測り、その力の向きと大きさを逆算した。大きな断層の近くでは力の向きが回転していて、その範囲が断層の上と下で違うという、地下の見えない構造が見えてきた点が面白い。", "unverified": "本文は入手できず、逆解析の不確実性の評価の方法は確認できなかった。"}}, {"id": "pr48", "rank": 48, "headline": "降雨下のガリー侵食と斜面不安定を統合評価", "title": "Integrated geotechnical, hydromechanical, and remote sensing assessment of gully erosion dynamics and slope instability in Edda, Southeastern Nigeria under changing rainfall regimes", "url": "https://doi.org/10.21203/rs.3.rs-11542720/v1", "authors": "Kelechi Paulinus Ukor ほか", "venue": "Research Square (In Review)", "date": "2026-11-19", "apa": "Ukor, K. P., Aghamelu, O. P., Nzereogu, S. K., & Ozioko, O. H. (2026). Integrated geotechnical, hydromechanical, and remote sensing assessment of gully erosion dynamics and slope instability in Edda, Southeastern Nigeria under changing rainfall regimes. https://doi.org/10.21203/rs.3.rs-11542720/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ナイジェリア南東部エッダのガリー侵食と斜面不安定を、地質・地盤試験・斜面安定解析・降雨記録・多時期の衛星画像を統合して調べた（抄録）。未査読。", "p3": "20のガリーの地点で地表近くの土の含水比・粒度・アッターベルグ限界・締固め・透水性・せん断強度などを測り、SLOPE/WのMorgenstern–Price法で斜面の安全率を求め、衛星画像でガリーの伸長を追った（抄録）。", "p5": "土は砂分33〜94%・粘土分4〜45%の緩く粘着力の弱い侵食されやすい材料で、安全率は飽和時0.60〜0.92、不飽和時0.63〜1.20だった。ガリーは2008年の105 mから2024年の200 mへ伸び、侵食と崩壊が相互に作用する系として発達していた（抄録）。", "fun": "雨が地面を削ってできる深い溝（ガリー）は、ただ水に削られるだけでなく、濡れて弱くなった溝の壁が崩れることでも広がる。この研究は、削る働きと崩れる働きが互いに強め合う仕組みを、土の試験と衛星写真で確かめた。2008年に105 mだった溝が2024年には200 mに伸びた速さが、問題の深刻さを物語っている点が面白い。", "unverified": "本文は入手できず、降雨とガリーの伸長の関係の定量的な分析は確認できなかった。"}}, {"id": "pr49", "rank": 49, "headline": "英国の配電ケーブルの公開デジタルツイン", "title": "GridForge: An Open Physics-Informed Digital Twin and Benchmark Suite for UK 11 kV Underground Distribution Cables", "url": "https://arxiv.org/abs/2611.23241", "authors": "Lilliane Linnet Musoke", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Musoke, L. L. (2026). GridForge: An Open Physics-Informed Digital Twin and Benchmark Suite for UK 11 kV Underground Distribution Cables (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23241", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "英国の11 kV地中配電ケーブルについて、物理情報を入れたデジタルツインと、故障の診断・予測の公開ベンチマーク一式GridForgeを作った（抄録）。未査読。", "p3": "IEC 60287・60853に基づく検証済みの熱モデル、4つの熱的な典型と4つの状態からなる64本（320ケーブル年）の較正した合成データ、学習中にIEC 60287の釣り合いを満たすPINNの代理モデル、3つの基準モデルを含む5課題のベンチマークを統合した（抄録）。", "p5": "PINNは独立した保留データで参照の解析解に対しRMSE 0.148 °Cに達し、学習は約2分で収束した。ただし現時点で基準モデルを区別できるのは仮想センサの課題だけで、ほかの課題は同点か未定義だった（抄録）。", "fun": "地中の電線は流れる電気の熱で傷んでいくが、その状態を外から直接見ることはできない。電力会社は大量の測定データを持っているのに、手法を公平に比べる共通の試験問題がなかった。この研究は、規格に沿った「仮想の電線」と試験問題を誰でも使える形で公開した。比べるための土俵を作る仕事の大切さが分かる点が面白い。", "unverified": "本文は入手できず、合成データの較正の手順と各課題の評価指標は確認できなかった。"}}, {"id": "pr50", "rank": 50, "headline": "鉄道橋と軌道の監視システムの設計方法", "title": "Expert System and Technology for Selected Elements of Railway Infrastructure", "url": "https://doi.org/10.5281/zenodo.24351098", "authors": "Ryjáček ほか", "venue": "Zenodo", "date": "2026-11-18", "apa": "Ryjáček, P., Stančík, V., Vojtěch, D., Kolínský, V., Šach, M., Zralá, D., Horníček, L., Lojda, V., Klokočník, P., & Daniel, V. (2025). Expert System and Technology for Selected Elements of Railway Infrastructure. Zenodo. https://doi.org/10.5281/ZENODO.24351098", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録（候補の収集時に取得）を使用。抄録は3文と短く、本文は入手できず", "preprint": true, "short": true, "p1": "鉄道橋と軌道の監視システムの設計と評価に使える方法論をまとめた報告（抄録）。査読の有無は不明。", "p3": "構造ヘルスモニタリング（SHM）の分野に属し、構造物の挙動と経年変化の情報を継続的に得る監視システムを対象とする（抄録）。具体的な手法・データは抄録にない。", "p5": "データ分析により、監視する構造物の補修・改築の計画を、運用の安全を保ちながら適時に立てられるとする（抄録）。具体的な結果は抄録にない。", "fun": "鉄道の橋や線路は毎日たくさんの列車に揺らされ、少しずつ傷んでいく。センサーで常に様子を見張れば、壊れる前に直すタイミングが分かる。どこに何のセンサーを付け、集めたデータをどう判断に結びつけるかという、監視の仕組みそのものを設計するという問いが面白い。", "unverified": "抄録が短く本文も入手できず、手法・対象の構造物・検証の内容は確認できなかった。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "組織行動・心理的安全性", "headline": "他人の正直さの見積もりは文化と階層で偏る", "title": "Trust miscalibration across cultures and social classes", "url": "https://doi.org/10.31234/osf.io/wb7am", "authors": "Grégoire Darcy ほか", "venue": "PsyArXiv", "date": "2026-11-18", "apa": "Darcy, G., Fitouchi, L., Thouzeau, V., André, J.-B., & Chevallier, C. (2026). Trust miscalibration across cultures and social classes. https://doi.org/10.31234/osf.io/wb7am", "why": "財布を拾った人が返すと思う割合と実際の返却率のずれ（信頼ギャップ）を23か国9,758人の事前登録研究で測り、欧米の高所得国では他人の信頼性を過小評価し、非欧米の低中所得国では過大評価することを示す。国内では社会経済的地位の低い人ほど過小評価し、実際の返却率を知らせるRCTでずれが縮んだ。"}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "AIで法律業務は再配分され大手は値上げ", "title": "AI, Specialization, and the Organization of Knowledge Work: Evidence from Legal Services", "url": "https://arxiv.org/abs/2611.23354", "authors": "Liu Zhang ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Zhang, L., Esposito, M., & Yang, I. (2026). AI, Specialization, and the Organization of Knowledge Work: Evidence from Legal Services (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23354", "why": "AIが専門知識を安くすると、依頼者は内製化せず安い外部の選択肢へ仕事を移し、価格に敏感な仕事が抜けた高級事務所はむしろマークアップを上げうるという枠組みを示す。米国89連邦地区の差の差分析で本人訴訟の割合が上昇した一方、企業内の弁護士雇用には明確な変化が見られなかった。"}, {"id": "pn03", "rank": 3, "field": "経営学", "headline": "生成AIの出品文で差別化が消え価格競争へ", "title": "Writing with Generative AI: Competition in Online Marketplaces", "url": "https://doi.org/10.2139/ssrn.7704778", "authors": "Nan Chen ほか", "venue": "SSRN", "date": "2026-11-19", "apa": "Chen, N., & Tsai, H.-T. (2026). Writing with Generative AI: Competition in Online Marketplaces. https://doi.org/10.2139/ssrn.7704778", "why": "Amazonが2023年9月に出品者向けの生成AI出品文ツールを導入したことを使い、市場ごとの処置の強さの違いから効果を推定する。新商品の参入は増えたがクリックと購入は上位商品に集中し、出品文は上位商品の文に似ていった。文章による差別化が効かなくなり、競争が価格と評判へ移ることを示す。"}, {"id": "pn04", "rank": 4, "field": "因果推論", "headline": "並べ替え検定は弱い帰無仮説でも有効", "title": "On the Validity of Fisher Randomization Tests under the Weak Null", "url": "https://arxiv.org/abs/2611.24821", "authors": "Timothy Sudijono ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Sudijono, T., Dobriban, E., & Tchetgen, E. T. (2026). On the Validity of Fisher Randomization Tests under the Weak Null (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24821", "why": "二値結果のランダム化実験で、通常は個人効果ゼロの鋭い帰無仮説でしか正当化されないフィッシャーのランダム化検定が、平均効果ゼロの弱い帰無仮説でも有限標本で妥当になる3つの設計と検定統計量の組を示す。フィッシャーの正確検定やマクネマー検定も弱い帰無仮説の下で有効になる。"}, {"id": "pn05", "rank": 5, "field": "統計学", "headline": "関数主成分分析の最適な推定精度を確立", "title": "Functional Principal Component Analysis: Minimax Optimality from Sparse to Dense Designs and Beyond", "url": "https://arxiv.org/abs/2611.24228", "authors": "Shunxing Yan ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Yan, S., & Yao, F. (2026). Functional Principal Component Analysis: Minimax Optimality from Sparse to Dense Designs and Beyond (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24228", "why": "雑音を含む離散観測からの関数主成分分析（FPCA）で、20年以上未解決だった、番号が増えていく固有関数と主部分空間の推定のミニマックス最適な収束率を、疎から密までの観測設計で確立する。共分散推定の新しい最適率も示し、非パラメトリックなスペクトル推定一般の分析の枠組みを与える。"}, {"id": "pn06", "rank": 6, "field": "政治学", "headline": "LLMの投票助言は一致を高めるが偏りもある", "title": "Hi Gemini, Who Should I Vote For? The Benefits (and Problems) of Using LLMs As Voting Advice Applications", "url": "https://arxiv.org/abs/2611.24684", "authors": "William John Atkinson ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Atkinson, W. J., & Saproza, P. (2026). Hi Gemini, Who Should I Vote For? The Benefits (and Problems) of Using LLMs As Voting Advice Applications (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24684", "why": "Gemini 3 Flashにドイツの調査回答者6,022人の政策選好だけから投票先を助言させ、標準的な近接モデルと比べた。多くの人では助言に従うと政策の一致度が上がり、政治的関心や学歴の低い人で効果が大きい一方、AfDを約1.5倍の頻度で勧めるなど追跡の難しい偏りがあった。"}, {"id": "pn07", "rank": 7, "field": "機械学習", "headline": "1回の順伝播で画像を生成する統合モデル", "title": "Jeveration: System One Models Now Generate", "url": "https://arxiv.org/abs/2611.24738", "authors": "Yuhe Liu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-19", "apa": "Liu, Y., Li, Q., Zhang, S., & Wang, X. (2026). Jeveration: System One Models Now Generate (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24738", "why": "凍結した視覚言語モデルの知識を使い、並列予測を共有の乱数状態で協調させて、512×512の画像を1回の順伝播で78ミリ秒で生成する。既存の統合モデルより最大122倍速く、同じ重みで画像変換と密な予測もこなす。Hugging Faceで最も多くの票を集めた。"}, {"id": "pn08", "rank": 8, "field": "工学", "headline": "ニューラル作用素で地震サイクル計算を高速化", "title": "Machine-learned acceleration of earthquake sequence simulations", "url": "https://arxiv.org/abs/2611.23561", "authors": "Reo Yanagi ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Yanagi, R., Kim, T., Bhattacharya, K., & Lapusta, N. (2026). Machine-learned acceleration of earthquake sequence simulations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23561", "why": "遅い地震間期と速い動的破壊が混在する地震サイクルの計算で、破壊の前後の状態の飛躍をフーリエ・ニューラル作用素（FNO）に学習させ、地震間期は従来の準動的解法で解く混合モデルを提案する。完全動的計算の長期統計（規模・再来間隔の分布）を再現し、準動的近似より良い近似を少ない計算で得る。"}, {"id": "pn09", "rank": 9, "field": "組織行動・心理的安全性", "headline": "1つのニューロン操作でAIチームの隠蔽が増加", "title": "Nothing to Declare: Steering a single neuron increases concealment in AI teams", "url": "https://arxiv.org/abs/2611.24475", "authors": "Edoardo Chidichimo ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Chidichimo, E., & Wallis, F. P. S. (2026). Nothing to Declare: Steering a single neuron increases concealment in AI teams (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24475", "why": "Qwen3.5-4Bで1つのニューロンの出力方向に活性を操作すると、情報を隠す判断が単独より複数エージェントのチームで強く増えた。全員が操作を受けると集団的な隠蔽が5場面中4場面で増え、エージェント間のメッセージは隠蔽を和らげた。集団の場が内部への介入の効き方を変えることを示す。"}, {"id": "pn10", "rank": 10, "field": "経済学", "headline": "実験デザインの質を数値で評価する道具", "title": "Evaluating and Improving Experimental Designs in Economics", "url": "https://doi.org/10.2139/ssrn.7701058", "authors": "Daniel Evans ほか", "venue": "SSRN", "date": "2026-11-19", "apa": "Evans, D., Henkel, L., Jabarian, B., & List, J. A. (2026). Evaluating and Improving Experimental Designs in Economics. https://doi.org/10.2139/ssrn.7701058", "why": "実験の設計を30の要素に分解して最適な選択を示し、質問に沿って評価すると数量的な質の得点が出る道具（EDAT）を作る。経済学トップ8誌に載った実験に適用すると評価の信頼性が高く、得点が被引用数や掲載結果を強く予測した。内的妥当性と外的妥当性の間に避けられない取捨があることも示す。"}, {"id": "pn11", "rank": 11, "field": "因果推論", "headline": "ファジーな差の差法を設計ベースで推論", "title": "Design-Based Inference for Fuzzy Difference-in-Differences", "url": "https://arxiv.org/abs/2611.24402", "authors": "Pedro Picchetti", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Picchetti, P. (2026). Design-Based Inference for Fuzzy Difference-in-Differences (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24402", "why": "政策の割当だけが確率的で潜在的結果と処置の選択は固定とみなす設計ベースの立場から、ファジーな差の差法の推定量を、割当で重みづけたコンプライアーの効果と汚染項に分解し、因果的に解釈できる条件を導く。弱い第1段階でも有効な検定と感度分析を提案し、オレゴン医療保険実験に適用する。"}, {"id": "pn12", "rank": 12, "field": "統計学", "headline": "いつ止めても有効な適合度検定を構成", "title": "Anytime-valid goodness-of-fit test by $e$-spacings", "url": "https://arxiv.org/abs/2611.23775", "authors": "Yunda Hao ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Hao, Y., & Chan, K. W. (2026). Anytime-valid goodness-of-fit test by $e$-spacings (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23775", "why": "順序統計量の間隔（スペーシング）からe過程を作り、任意の停止規則の下で第1種の誤りを制御する適合度検定（e-spacing検定）を提案する。局所的なずれの検出に強く、対数e過程が漸近的にオラクル最適なものと同等になることを示し、複数の戦略を最適に組み合わせる方式も与える。"}, {"id": "pn13", "rank": 13, "field": "交通・都市計画", "headline": "公共の社会施設は新しい都市の中心をつくるか", "title": "Polycentrality in Urban Socioecological Systems: A Multilayer Analysis of Social Infrastructure in Iztapalapa, Mexico City", "url": "https://arxiv.org/abs/2611.24758", "authors": "Marco A. Rosas ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Rosas, M. A., Carreón, G., Gershenson, C., & Siqueiros, J. M. (2026). Polycentrality in Urban Socioecological Systems: A Multilayer Analysis of Social Infrastructure in Iztapalapa, Mexico City (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24758", "why": "メキシコ市イスタパラパで、歩行網・GTFSの公共交通・15の公共社会施設を重ねた多層ネットワークにより、施設への多手段の接続性と到達時間を評価し、地域の経済的中心性の指標と比べる。施設と既存の交通網との統合に地域差があることを示す。"}, {"id": "pn14", "rank": 14, "field": "政治学", "headline": "AIの議員評価も党派で受け止めが変わる", "title": "Transparency Is Not Enough: Political Identity and the Acceptance of AI-Generated Governance Information", "url": "https://econpapers.repec.org/RePEc:osf:socarx:b3nzt_v1", "authors": "Liu ほか", "venue": "RePEc NEP", "date": "2026-11-16", "why": "台湾のオンライン調査実験で、AIが作った議員の業績評価を受け入れるかは、高く評価された議員が自分の陣営かどうかに強く左右され、AIに結びつく報道機関の党派性は有意な影響を持たなかった。AIを介した透明性も党派的な選別を免れないことを示す。"}, {"id": "pn15", "rank": 15, "field": "組織行動・心理的安全性", "headline": "成績に基づく表彰が政治家志望者の質を高める", "title": "Mitigating Adverse Political Selection: Long-Term Experimental Evidence from a Leadership Training for Aspiring Politicians in the Philippines", "url": "https://doi.org/10.2139/ssrn.7710278", "authors": "Nico Ravanilla", "venue": "SSRN", "date": "2026-11-19", "apa": "Ravanilla, N. (2026). Mitigating Adverse Political Selection: Long-Term Experimental Evidence from a Leadership Training for Aspiring Politicians in the Philippines. https://doi.org/10.2139/ssrn.7710278", "why": "フィリピンの若い政治家志望者569人のランダム化実験で、リーダーシップ研修の表彰を出席でなく成績に基づかせると、認知能力・誠実さ・公共奉仕動機の低い人が立候補を控え、男性の過剰代表も縮んだ。効果は5年後の実際の選挙でも見られたが、10年後には判別できなくなった。"}, {"id": "pn16", "rank": 16, "field": "統計学", "headline": "複合p値に局所FDRの枠組みを与える", "title": "A Local False Discovery Rate Framework for Compound p-values", "url": "https://arxiv.org/abs/2611.24555", "authors": "Jierui Zhu ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Zhu, J., Barber, R. F., & Ignatiadis, N. (2026). A Local False Discovery Rate Framework for Compound p-values (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24555", "why": "帰無仮説全体での平均条件だけを満たす複合p値は、個々の棄却を守らないことがある。密度複合p値という概念で複合p値と頻度論の局所FDRを結びつけ、個々の発見の信頼性を評価できる枠組みを提案する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "帰無仮説全体での平均条件だけを満たす複合p値を、頻度論の局所FDRの考え方と結びつける「密度複合p値」を導入し、個々の棄却の信頼性を保証する枠組みを示した（抄録）。未査読。", "p3": "独立性の下で、重みつきp値と複合eで重みづけたp値について、サポートライン（SL）手続きの境界FDR（bFDR）を名目水準で制御できることを示し、一般の密度複合p値では扱いやすい帰無分布のパラメータに依存する上界を導いた。並べ替え検定をプールした離散の複合p値にも理論を広げた（抄録）。", "p5": "そのパラメータに制約がないとbFDRが名目水準を大きく超えうることを示した。個々の並べ替えp値が粗すぎて多重性の補正後に発見が得られない低解像度の検定問題で、方法の有用性を例示した（抄録）。", "fun": "たくさんの仮説を一度に検定すると、偶然の「当たり」が混ざる。全体として誤りの割合を抑える方法はあるが、「この1つの発見は信じてよいか」は別の問題だ。平均で正しいだけの道具が、個々の判断を守るとは限らない。全体の保証と個別の保証の違いを数学的に詰めた点が面白い。", "unverified": "本文は入手できず、応用例のデータとbFDRの数値例は確認できなかった。"}}, {"id": "pn17", "rank": 17, "field": "統計学", "headline": "追加の共変量を集める価値を予測区間で判定", "title": "Is It Worth Collecting Additional Covariates?", "url": "https://arxiv.org/abs/2611.24031", "authors": "Wen Zhang ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Zhang, W., Ma, Y., & Zhu, L. (2026). Is It Worth Collecting Additional Covariates? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24031", "why": "安価な基本の共変量に加えて高価な共変量を集める価値があるかを、予測区間の幅の縮小を基準に評価・検定する方法を提案する。研究の計画段階でのデータ収集の判断に使える。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "安価な基本の共変量に加えて高価な共変量を集める価値があるかを、予測区間の幅の縮小を基準に評価・検定する、モデルに依存しない方法を提案した（抄録）。未査読。", "p3": "利得を周辺的にも観測できる特徴の条件付きでも評価し、条件付きの形で部分集団の異質性と個別のデータ取得の判断を扱う。非パラメトリック・機械学習の方法を使える枠組みで、効率的影響関数に基づく推定・検定を導き、緩い収束条件で理論的な性質を示した（抄録）。", "p5": "自然に思えるコンフォーマル予測に基づく方法は周辺の場合に失敗し、局外母数の推定にはるかに厳しい要件を課すことを示した。シミュレーションと実データで提案法の有限標本での優れた性能を示した（抄録）。", "fun": "健康診断で、安い基本の検査に加えて高い精密検査をする価値があるか、という悩みに近い。この研究は「予測の幅がどれだけ狭くなるか」で価値を測り、人によって価値が違うことも扱う。直感的に使えそうな方法がこの目的には使えないと分かった点も面白い。", "unverified": "本文は入手できず、実データの内容と利得の大きさの数値は確認できなかった。"}}, {"id": "pn18", "rank": 18, "field": "統計学", "headline": "非ガウスの気候場を生成するベイズ輸送写像", "title": "Laplace Bayesian transport maps for generative modeling of non-Gaussian climate fields", "url": "https://arxiv.org/abs/2611.23467", "authors": "Jacob A. Johnson ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Johnson, J. A., Jimenez, F., & Katzfuss, M. (2026). Laplace Bayesian transport maps for generative modeling of non-Gaussian climate fields (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23467", "why": "複雑な非ガウスの空間場を標準ガウス分布へ写す輸送写像で気候場の確率的な代理モデルを作る際、自己回帰ガウス過程に頼る従来のベイズ輸送写像の制約を、ラプラス近似を使う方法で緩める。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "非ガウスの気候場を生成する輸送写像で、ハイパーパラメータの不確実性まで扱う完全ベイズのモデルと、その計算を安くするラプラス近似を提案した（抄録）。未査読。", "p3": "自己回帰ガウス過程で表すベイズ輸送写像は、通常は経験ベイズの点推定でハイパーパラメータの不確実性を無視する。完全ベイズの事後分布をMCMCで求める代わりに、経験ベイズとほぼ同じ計算費用で済むラプラス近似を用いた（抄録）。", "p5": "数値実験と実際の気候データへの適用で、ラプラス近似がMCMCのごく一部の費用で事後分布の要約の大半を正確に捉え、予測の性能も保つことを示した（抄録）。", "fun": "気温や雨の分布は、きれいな釣鐘形（正規分布）にならないことが多い。輸送写像は、複雑な形の分布を扱いやすい釣鐘形に「変形」して扱う道具だ。この研究は、その変形の仕方自体の不確かさまで、安い計算で見積もれるようにした。速さと慎重さを両立させた点が面白い。", "unverified": "本文は入手できず、気候データの種類と精度の数値は確認できなかった。"}}, {"id": "pn19", "rank": 19, "field": "統計学", "headline": "LLMは予測問題を正しく定式化できるか", "title": "When Do LLMs Model the Right Target? Problem Formulation in High-Stakes Risk Prediction", "url": "https://arxiv.org/abs/2611.23638", "authors": "Jennifer Zhang ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Zhang, J., & Coston, A. (2026). When Do LLMs Model the Right Target? Problem Formulation in High-Stakes Risk Prediction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23638", "why": "高リスクの意思決定に使う予測モデルの開発で、LLMが問題を正しく定式化できるかを、過去の判断が結果の観測に影響する判断依存性に焦点を当てて調べる。データ分析にLLMを使う際の妥当性の落とし穴を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "高リスクの意思決定に使う予測モデルの開発で、LLMが予測問題を正しく定式化できるかを、過去の判断が観測される結果に影響する「判断依存性」に焦点を当てて調べた（抄録）。未査読。", "p3": "児童福祉・医療・雇用の場面で、OpenAIとAnthropicの11モデルを7つのプロンプト条件で使い、生成されたコードが想定した結果を推定する適切な手順になっているか、説明が判断依存性に触れているかを評価した（抄録）。", "p5": "指示がないとLLMは判断依存性に確実には対処しなかった。目標・必要な仮定・推定手順をプロンプトで指定すると、目標に沿った実装は99〜100%に達した。説明で触れてもコードでは対処しない回答もあった（抄録）。", "fun": "例えば「融資を断られた人が返済できたか」は、断られた時点で観測できない。過去の判断が、見えるデータを偏らせるのだ。AIに予測モデルを作らせると、この落とし穴に自分では気づかないことが多いが、きちんと説明すればほぼ正しく対処できた。AIは道具として賢いが、問いの立て方は人が見張る必要がある点が面白い。", "unverified": "本文は入手できず、場面ごと・モデルごとの結果の数値は確認できなかった。"}}, {"id": "pn20", "rank": 20, "field": "因果推論", "headline": "複数の結果の感度分析で交絡の違いを扱う", "title": "Confounding Heterogeneity in Multivariate Sensitivity Analysis for Observational Studies", "url": "https://arxiv.org/abs/2611.23568", "authors": "Anthony Frazier ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Frazier, A., Heng, S., & Zhou, W. (2026). Confounding Heterogeneity in Multivariate Sensitivity Analysis for Observational Studies (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23568", "why": "観察研究で1つの処置の複数の結果への効果を感度分析するとき、未測定の交絡の強さが結果ごとに異なりうること（交絡の異質性）が分析に固有の特徴になることを示し、それを扱う多変量の感度分析を提案する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "観察研究で1つの処置の複数の結果への効果を感度分析するとき、未測定の交絡が結果ごとに異なりうる「交絡の異質性」を扱う枠組みを示した（抄録）。未査読。", "p3": "マッチングした観察研究を基に、異なる結果が異なる未測定の交絡因子に影響され、共通の交絡因子も結果ごとに異なる強さで効く状況を許す感度分析を定式化し、デザイン感度とBahadur–Rosenbaum効率で漸近的な検出力を調べた（抄録）。", "p5": "既存の多くの感度分析法の第1種の誤りの制御が、古典的な枠組みと根本的に異なるモデルと推論の様式の下でも保証されることを示した。広く使われる単一パラメータの枠組みは、交絡の異質性を考えると結論の頑健さを誤って評価しうる（抄録）。", "fun": "「運動すると健康になる」かを観察データで調べるとき、隠れた原因（例えば収入）が結果をゆがめているかもしれない。感度分析は「どれだけ強い隠れた原因があれば結論が覆るか」を測る。結果が複数あると、それぞれに効く隠れた原因が違いうる。その当たり前の事実を正面から取り込んだ点が面白い。", "unverified": "本文は入手できず、データへの適用例の内容と検出力の数値は確認できなかった。"}}, {"id": "pn21", "rank": 21, "field": "因果推論", "headline": "分散最小の反実仮想方策でA/Bテストを効率化", "title": "Variance-Optimal Counterfactual Policy Design for Sample-Efficient Online A/B Testing", "url": "https://arxiv.org/abs/2611.24757", "authors": "Shashank Gupta ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Gupta, S., & Maji, S. (2026). Variance-Optimal Counterfactual Policy Design for Sample-Efficient Online A/B Testing (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24757", "why": "推薦などの方策のオンラインA/Bテストで、処置方策と本番方策が同じ行動を似た確率で選ぶと観測が雑音を増やすだけになる問題に対し、推定量の分散を最小にする反実仮想の方策を設計して標本効率を上げる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "推薦などの方策のオンラインA/Bテストで、行動の抽出の仕方と推定の仕方を同時に最適化し、少ない通信量で処置効果を正確に推定する設計を示した（抄録）。未査読。", "p3": "ペアワイズのオフポリシー評価を基に、2つの方策の平均処置効果を推定するための分散最小の行動単位のログ方策を閉形式で導き、過去のログを使ってログ方策と制御変量を同時に最適化した（抄録）。", "p5": "模擬の方策A/Bテストで、評価したすべての設定で既存の分散削減法より平均処置効果を正確に推定し、検出力を高め、劣った方策を選ぶ頻度を減らした（抄録）。", "fun": "新旧2つのおすすめ機能を比べるとき、どちらも同じ商品を勧める場面では、比べても差が分からず時間の無駄になる。この研究は、2つの機能の意見が分かれる場面に観測を集中させる。試験の問題を受験者の差がつく問題に絞るような工夫で、少ない人数で結論を出せる点が面白い。", "unverified": "本文は入手できず、実験での分散削減の大きさの数値は確認できなかった。"}}, {"id": "pn22", "rank": 22, "field": "因果推論", "headline": "分割の森で釣り合いの重みを推定", "title": "Balancing Partition Forest for Causal Weighting", "url": "https://arxiv.org/abs/2611.23524", "authors": "Felipe Angelim ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Angelim, F., & Leite, A. (2026). Balancing Partition Forest for Causal Weighting (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23524", "why": "観察データの因果推論で処置と共変量を独立にする釣り合いの重みを、共変量と処置の周辺分布の積と同時分布の比として、分割木と分割の森（BPT・BPF）で直接推定する方法を提案する。二値と連続の処置の両方に使える。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "観察データの因果推論で処置と共変量を独立にする釣り合いの重みを、共変量-処置空間の学習した長方形の分割で推定する分割木（BPT）と分割の森（BPF）を提案した（抄録）。未査読。", "p3": "理想の重みは共変量と処置の周辺分布の積と同時分布の比である。各分割は同時と周辺の度数から計算したブレグマン・ダイバージェンスの利得を最大にし、相互情報量を最大にする基準と重みの二乗誤差を減らす基準の2つを導いた。どちらの基準の母集団の残差もIPWと二重頑健推定量の偏りを抑える（抄録）。", "p5": "17の合成・半合成の設定と3つの推定量で、BPFは7つの重み推定法の中で平均RMSE順位が最も良く、1本の木は16,512件の観測で0.14秒で当てはまった（抄録）。", "fun": "薬を飲んだ人と飲まなかった人を比べるとき、もともと年齢や体調が違えば公平な比較にならない。重みをつけて両方のグループを似た顔ぶれにそろえるのが釣り合いの重みだ。この研究は、データを箱に切り分けて数を数えるだけでその重みを作る。単純な発想で速く正確に重みを推定できた点が面白い。", "unverified": "本文は入手できず、比較した推定法の名前と各設定ごとの結果は確認できなかった。"}}, {"id": "pn23", "rank": 23, "field": "因果推論", "headline": "ネットワーク干渉下の因果関数を能動学習で", "title": "Fill-Distance-Guided Active Learning for Causal Function Recovery under Network Interference", "url": "https://arxiv.org/abs/2611.24143", "authors": "Peiyao Liu ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Liu, P., Zhu, H., Zhang, S., Su, Y., Zhao, Z., & Chen, N. (2026). Fill-Distance-Guided Active Learning for Causal Function Recovery under Network Interference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24143", "why": "結果が自分と近隣の処置に依存するネットワーク干渉の下で、因果効果を近隣の曝露の関数として回復するために、充填距離に基づいて実験の割当を能動的に選ぶ方法を提案する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "結果が自分と近隣の処置に依存するネットワーク干渉の下で、限られた実験予算で近隣の曝露に依存する応答関数の全体を回復する逐次実験の方法FANCIを提案した（抄録）。未査読。", "p3": "処置ごとのガウス過程で非線形な条件付き応答面を表し、応答関数の回復を被覆の問題とみなして、充填距離（実験でまだ覆われていない領域の大きさ）を小さくするよう次の実験を選ぶ。実現できる曝露のパターンの制約を考え、ネットワーク全体と標的を絞った2つの選び方を作った（抄録）。", "p5": "充填距離と応答関数の推定誤差を結ぶ一様な誤差上界を導いた。シミュレーションとオンラインゲームの実験で非線形な曝露依存の効果の回復が改善し、干渉を無視すると見えない処置のパターンが現れた（抄録）。", "fun": "ワクチンの効果は、自分が打ったかだけでなく、周りの人が打ったかにも左右される。こうした「ご近所の影響」があると、効果は1つの数ではなく、周りの何割が受けたかによって変わる曲線になる。限られた実験の回数で、曲線のまだ分からない部分を狙って調べる工夫が面白い。", "unverified": "本文は入手できず、オンラインゲームの実験の規模と改善の数値は確認できなかった。"}}, {"id": "pn24", "rank": 24, "field": "経済学", "headline": "推薦ルールが売り手の競争を変える仕組み", "title": "Platform Recommendation and Competition in Search Markets", "url": "https://arxiv.org/abs/2611.24464", "authors": "Sanxi Li ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Li, S., Yu, J., & Zhang, M. (2026). Platform Recommendation and Competition in Search Markets (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24464", "why": "異質な売り手の内生的な価格・広告と費用のかかる消費者探索を含むモデルで、プラットフォームの推薦ルールを評価する枠組みを作り、分離可能な推薦スコアの広いクラスで均衡が一意に存在する条件を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "プラットフォームの推薦ルールを、異質な売り手の内生的な価格・広告と費用のかかる消費者探索を含む市場で評価する枠組みを作り、均衡が一意に存在する条件を示した（抄録）。未査読。", "p3": "分離可能な推薦スコアの広いクラスについて均衡の存在と一意性の条件を示し、3つの応用と、品質と低価格に重みを置く2タイプの設計への拡張で枠組みの使い方を示した（抄録）。", "p5": "品質の差が十分大きいと、低価格への報酬を強めても均衡価格が下がり消費者が得をするとは限らない。品質の誘導は各商品の価格を下げ消費者の得になりうるが、平均の取引価格は上げうる。品質と低価格の両方に正の重みを置く有限の最適設計はないことも示した（抄録）。", "fun": "通販サイトが「安い商品を上に表示する」ルールにすれば値下げ競争が起きて客は得をしそうだ。ところがこの研究では、商品の質の差が大きいと、そうならないことがある。表示のルールが売り手の値付けまで変えるので、直感どおりにはいかない。お店の棚の並べ方が値段を決めるという視点が面白い。", "unverified": "本文は入手できず、各応用の数値的な例は確認できなかった。"}}, {"id": "pn25", "rank": 25, "field": "経済学", "headline": "不完全な操作変数のプロビットで感度の範囲", "title": "Plausibly Exogenous Instruments in Probit Models: Sensitivity Bounds for Average Partial and Interaction Effects", "url": "https://arxiv.org/abs/2611.23438", "authors": "Luke Taylor ほか", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Taylor, L., & Wulff, J. N. (2026). Plausibly Exogenous Instruments in Probit Models: Sensitivity Bounds for Average Partial and Interaction Effects (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23438", "why": "線形の2段階最小二乗に限られていた、ほぼ外生的な操作変数の感度分析を、制御関数プロビットの平均部分効果と交互作用効果に拡張し、生成された回帰変数の分散と推論の方法を導く。二値結果の応用に使える。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "完全には外生的でない操作変数の感度分析を、線形の2段階最小二乗から制御関数プロビットの平均部分効果と交互作用効果へ拡張した（抄録）。未査読。", "p3": "生成された回帰変数の分散、合併区間と局所ゼロ区間、その漸近的な被覆率を、明示したモデルと較正の条件の下で導いた。カトリック学校、きょうだいの性別構成、儒教の氏族への応用でプロビットと線形の分析を比べ、StataとRの実装を付けた（抄録）。", "p5": "外生性の違反を誤った潜在尺度の上で述べると、内生性の相関で決まる倍率だけ区間の較正がずれうることを示した（抄録）。応用での推定値は抄録にない。", "fun": "原因を調べるのに使う「操作変数」は、本来は結果に直接影響しないことが条件だが、現実には少しずつ漏れがある。その漏れを認めたうえで結論がどこまで揺らぐかを測るのが感度分析だ。結果が「はい・いいえ」の二択のとき、漏れの大きさをどの尺度で考えるかで答えがずれるという指摘が面白い。", "unverified": "本文は入手できず、3つの応用での具体的な推定結果は確認できなかった。"}}, {"id": "pn26", "rank": 26, "field": "経済学", "headline": "大きな個体内の差の裾で反復測定を識別", "title": "A Tail-Geometric Approach to Kotlarski's Lemma with Order Statistics", "url": "https://arxiv.org/abs/2611.23642", "authors": "Yao Luo", "venue": "arXiv", "date": "Thu, 19 Nov 2026", "apa": "Luo, Y. (2026). A Tail-Geometric Approach to Kotlarski's Lemma with Order Statistics (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.23642", "why": "反復測定モデルの非パラメトリック識別に、個体内の大きな差を条件づけて固有誤差を反対の裾へ押しやる裾の幾何の方法を提案し、Kotlarskiの補題を順序統計量で拡張する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "反復測定モデルの非パラメトリック識別に、個体内の大きな差（ギャップ）を条件づける「裾の幾何」の方法を提案し、古典的なKotlarskiの補題を順序統計量しか観測できない場合にも広げた（抄録）。未査読。", "p3": "差をとると共通の潜在成分が消え、大きな差を条件づけると固有の誤差が反対の裾に押しやられる。ガウスより薄い裾の条件の下では固有成分が差に依存する決定的な位置に集中するので、中心をずらした観測値が共通の潜在成分の分布を位置を除いて明らかにし、固有成分の分布は逆畳み込みで回復できる（抄録）。", "p5": "この原理は2つの測定の古典的なKotlarskiモデルにも、順序統計量だけが観測される設定にも当てはまり、入札や賃金提示が全部観測される場合と上位だけが観測される場合のオークション・賃金提示モデルに応用できる（抄録）。", "fun": "同じ人の能力を2回のテストで測ると、点数には本当の能力と、その日の調子のぶれが混ざる。2回の点数の差が極端に大きい人に注目すると、ぶれは一方が大きくプラス、もう一方が大きくマイナスに偏っているはずだ。この「極端な場合」を手がかりに、見えない能力の分布を取り出す発想が面白い。", "unverified": "本文は入手できず、識別の正確な条件と推定の手順は確認できなかった。"}}, {"id": "pn27", "rank": 27, "field": "経済学", "headline": "予測市場の価格ショックの後に誰が取引するか", "title": "Who Trades After the Shock? Participation and Entry in Prediction Markets", "url": "https://doi.org/10.2139/ssrn.7703560", "authors": "Zhiwei Zhuang", "venue": "SSRN", "date": "2026-11-18", "apa": "Zhuang, Z. (2026). Who Trades After the Shock? Participation and Entry in Prediction Markets. https://doi.org/10.2139/ssrn.7703560", "why": "ランダムに割り当てた価格を動かす注文の実験を816市場の取引履歴と結びつけ、価格の持続だけでなく、その後の参加・新規参入・最初の外部注文の向きへの影響を調べる。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録された抄録を候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "予測市場Manifoldで価格を動かす注文をランダムに割り当てた先行実験を816市場の取引履歴と結びつけ、その後の参加・新規参入・最初の外部注文の向きへの影響を調べた（抄録）。未査読。", "p3": "Rasooly and Rozzi（2025）の実験の割当を取引履歴に結びつけ、再構成した基準時刻から最初の24時間と遅れた24時間の窓で活動の確率を比べ、2つの結果について無作為化に基づくHolm補正を行った（抄録）。", "p5": "操作なしに比べ、上げ・下げの注文の割当は最初の24時間の活動の確率を37.04ポイント、遅れた窓で8.19ポイント高めた。最初の日の差は事後的にボットと判定されたアカウントの速い反応に集中し、それらを除くと11.66と7.67ポイントに縮んだ（抄録）。", "fun": "未来の出来事に賭ける「予測市場」で、わざと価格を動かす注文を入れると、誰がそれに反応して取引に来るのか。調べてみると、最初に素早く反応したのは人間ではなく自動売買のプログラム（ボット）が多かった。市場の「反応」の中身を分解すると、思っていたのと違う顔ぶれが見えてくる点が面白い。", "unverified": "本文は入手できず、ボットの判定の方法と市場間の干渉の検討の詳細は確認できなかった。"}}, {"id": "pn28", "rank": 28, "field": "経済学", "headline": "株式市場はグリーン製品の価値を過小評価", "title": "The Valuation of Green Products", "url": "https://doi.org/10.2139/ssrn.7703618", "authors": "Jie Cao ほか", "venue": "SSRN", "date": "2026-11-18", "apa": "Cao, J., Lei, L., Li, D., Zhan, X., & Zhang, W. E. (2026). The Valuation of Green Products. https://doi.org/10.2139/ssrn.7703618", "why": "商標登録から企業の中核事業でのグリーン製品の活動を特定し、そうした企業はその後の営業成績が良く、リスク調整後の超過収益を得て、アナリストが将来の利益を過小評価していることを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録された抄録を候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "商標登録から企業の中核事業でのグリーン製品の活動を特定し、株式市場がその価値を十分に織り込んでいるかを調べた（抄録）。未査読。", "p3": "商標の全体的な強度、グリーン特許、標準的なリターンの予測変数、産業効果を統制したうえで、グリーン製品の活動とその後の営業成績・アナリストの予想・株式リターンの関係を推定した（抄録）。", "p5": "グリーン製品の活動のある企業はその後の営業成績が強く、リスク調整後の正の超過収益を得て、アナリストは将来の利益を過小評価していた。超過収益は形成後の最初の1年と決算発表月に集中し、環境面の評価が弱い企業や評価の難しい企業、環境への関心が低い時期に強かった（抄録）。", "fun": "環境に優しい製品を出した会社は、もうかるのか。商品の名前を守る商標の登録を手がかりにすると、そうした会社はその後の業績が良く、株価も遅れて上がっていた。専門家のアナリストでさえ価値を見落としていたという点が、情報が市場に伝わるまでの時間差を示していて面白い。", "unverified": "本文は入手できず、標本の期間と超過収益の大きさの数値は確認できなかった。"}}, {"id": "pn29", "rank": 29, "field": "経済学", "headline": "気候目標の未達の公表で公約の評価が変化", "title": "The Value of Climate Commitments", "url": "https://doi.org/10.2139/ssrn.7729598", "authors": "Alex Edmans ほか", "venue": "SSRN", "date": "2026-11-19", "apa": "Edmans, A., Fang, V. W., & Yang, S. (2026). The Value of Climate Commitments. https://doi.org/10.2139/ssrn.7729598", "why": "目標を守らない企業を公表する政策変更の後、市場の反応が目標の設定から当初の公約へ移り、ガバナンスの弱い企業で強いことを示す。外部からの説明責任が公約の価値を高めることを示唆する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録された抄録を候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "目標を守らない企業を公表する政策変更の後、投資家が企業の気候公約をどう評価するかが変わるかを調べた（抄録）。未査読。", "p3": "不遵守の企業を公に特定する政策変更の前後で、当初の公約と、その後の目標設定への市場の反応を比べ、ガバナンス・財務制約・気候の重要性による違いを調べた（抄録）。", "p5": "政策変更の後、市場の反応はその後の目標設定から当初の公約へ移り、この変化はガバナンスの弱い企業と財務制約のある企業で大きかった。気候の重要性の高い企業での変化の証拠は弱かった。公約の信頼性を高めても株主にとっての価値が高まるとは限らないとする（抄録）。", "fun": "「将来二酸化炭素を減らします」という会社の約束は、守らなかったら名前を公表されるとなると重みが変わる。この研究では、そうなった後、投資家は約束をした最初の時点をより重視するようになった。約束を守らせる仕組みが外にあると、会社の内側の統治の弱さを補うという見方が面白い。", "unverified": "本文は入手できず、対象とした政策変更の具体名と反応の大きさの数値は確認できなかった。"}}, {"id": "pn30", "rank": 30, "field": "経営学", "headline": "寄付市場で質の開示に提供者はどう応じるか", "title": "Preempting the Comparison: Quality Disclosure and Fundraising Competition", "url": "https://doi.org/10.2139/ssrn.7708598", "authors": "Andreas Lange ほか", "venue": "SSRN", "date": "2026-11-18", "apa": "Lange, A., Meer, J., Schmitz, J., & Xu, M. (2026). Preempting the Comparison: Quality Disclosure and Fundraising Competition. https://doi.org/10.2139/ssrn.7708598", "why": "資金を出す人と受益者が異なる寄付の市場では質の低い提供者への規律が働きにくい。成績の開示に提供者が戦略的にどう反応するかを分析し、開示政策の効果を検討する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録された抄録を候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "資金を出す人と受益者が異なる寄付の市場で、成績（効率）の開示に慈善団体の管理者が戦略的にどう反応するかを、事前登録のフィールド実験で調べた（抄録）。未査読。", "p3": "実在の慈善団体の管理者が、同じ目的のライバルとの募金競争に参加するかを報酬つきで決める実験で、相対的な効率、寄付者にライバルより先に接触するか同時か、寄付者が効率を観察できるかを変えた（抄録）。", "p5": "開示は、自団体の方が効率的なら競争に参加し劣るなら避けるという規律を強めた。一方で効率の低い団体には、不利な比較が起きる前に寄付者へ先に接触する誘因を与えた。透明性は規律を回復するだけでなく競争の形を変えうる（抄録）。", "fun": "寄付をする人は、自分のお金がどれだけ効率よく使われたかを直接見られない。そこで団体の成績を公開すれば、良い団体にお金が集まるはずだ。ところが成績の悪い団体は、比べられる前に先回りして寄付を集めようとする。情報を公開しても、競争の仕方そのものが変わってしまうという発見が面白い。", "unverified": "本文は入手できず、実験の参加者数と効果の大きさの数値は確認できなかった。"}}, {"id": "pn31", "rank": 31, "field": "経営学", "headline": "オムニチャネルの在庫統合には限界がある", "title": "Inventory Integration and Price Competition in Omnichannel Retailing", "url": "https://doi.org/10.2139/ssrn.7707218", "authors": "Chuan He ほか", "venue": "SSRN", "date": "2026-11-19", "apa": "He, C., Liu, Q., & Shuai, J. (2026). Inventory Integration and Price Competition in Omnichannel Retailing. https://doi.org/10.2139/ssrn.7707218", "why": "店舗受取を提供する多店舗の小売とオンラインの配送プラットフォームの競争で、在庫の統合（フルフィルメントの設計）を分析し、統合を深めるほど良いとは限らない内生的な限界があることを示す。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録された抄録を候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "店舗受取（BOPS）を提供する多店舗の小売とオンライン配送のプラットフォームの競争で、在庫の統合を深めるほど良いとは限らない内生的な限界があることを理論モデルで示した（抄録）。未査読。", "p3": "在庫の統合をフルフィルメントの設計の決定とみなし、配送の信頼性の向上と、BOPSがプラットフォームの配送と直接競う市場の範囲の拡大という2つの効果が、均衡価格と利益に与える影響を分析した（抄録）。", "p5": "信頼性の向上は小売の需要・マークアップ・利益を高めるが、範囲の拡大はプラットフォームの価格の対抗で利益を減らしうる。そのため、外生的な統合費用なしに部分的な統合が全体の最適になる条件がある。プラットフォームの投資や情報の波及で双方が得をする結果も生じうる（抄録）。", "fun": "ネットで注文して店で受け取れる仕組みは、店の在庫をネットとつなぐほど便利になる。でも便利になって競争の土俵が広がると、ネット通販の会社も値段で対抗してくる。だから在庫を全部つなぐのがいつも得とは限らない。改善が新しい競争を呼び、自ら限界を作るという逆説が面白い。", "unverified": "本文は入手できず、モデルの具体的な仮定と数値例は確認できなかった。"}}, {"id": "pn32", "rank": 32, "field": "経営学", "headline": "移民起業家は制約の中で戦略的に人脈を築く", "title": "Embedding Against The Odds: How High-Skilled Immigrant Entrepreneurs Navigate Constrained Ecosystems Through Strategic Networking", "url": "https://doi.org/10.2139/ssrn.7723718", "authors": "Farzana Adeel ほか", "venue": "SSRN", "date": "2026-11-18", "why": "高度技能の移民起業家が制約の多い起業エコシステムで戦略的にネットワークを築く過程を分析し、ネットワークを所与の構造とみなす従来の見方に対して起業家の主体的な働きかけを強調する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録された抄録を候補の収集時に取得）を使用。Entrepreneurship & Regional Developmentに掲載済みの論文のSSRN版で、本文は入手できず", "preprint": false, "short": true, "p1": "高度技能の移民起業家が、ネットワークへのアクセスが不均等で排他的な起業エコシステムで人脈をどう築き動員するかを明らかにし、「主体的な埋め込み」という概念を提案した（抄録）。論文誌に掲載済みの論文のSSRN版。", "p3": "混合埋め込み理論に基づき、ニュージーランドの高度技能の移民起業家22人への半構造化面接に、自己中心ネットワーク分析と文書資料を組み合わせて分析した（抄録）。", "p5": "地域の期待に合わせるネットワーク適応、国境を越えた人脈で制約を回避するネットワーク・ブリコラー
