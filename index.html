68.8%→81.2%。RoboCasaのゼロショットでReach 40.6%、Place 46.9%（§4.1、表1）。画像・動画データを加えると平均スコアは59.3→61.6になり、言い換えへの頑健性も上がった（制御データのみでは言い換えで6.8点低下）（§4.1、図4）。動画生成モデルとの比較では同等の計画性能で学習コスト6分の1、計画が13.9倍速かった（抄録）。", "p6": "行動の言語化は定型文に頼っており、自由な表現への一般化は言い換えの試験の範囲で確認したにとどまる。実ロボットでの計画評価の範囲は付録（未読）。", "fun": "「右に3cm動かす」も「カップを持ち上げる」も、全部ことばで書いてしまえば、ロボットの種類が違っても一つの頭で学べる――言葉を共通語にするという発想が面白いところです。人がネット上の動画から世界の動きを学ぶように、行動ラベルのない動画からも学べるようになりました。", "unverified": "LaLa-Policyの結果（Cosmos Policyとの比較）は抄録の記述のみで未確認。"}}, {"id": "pn12", "rank": 12, "field": "教育", "headline": "家庭の教育実践は格差を和らげず広げる", "title": "Family Educational and Cultural Practices Amplify Rather than Buffer Socioeconomic Inequalities in Academic Achievement in France", "url": "https://doi.org/10.31234/osf.io/9mpw2_v1", "authors": "Margot Rémeau ほか", "venue": "PsyArXiv", "date": "2026-10-20", "apa": "Rémeau, M., Borst, G., & Rakesh, D. (2026). Family Educational and Cultural Practices Amplify Rather than Buffer Socioeconomic Inequalities in Academic Achievement in France. https://doi.org/10.31234/osf.io/9mpw2_v1", "why": "フランスの全国代表の縦断コホート12,904人で、家庭の教育・文化的実践が学力の社会経済格差を緩和せず増幅することを示した。", "explain": {"basis": "抄録", "basis_note": "PsyArXiv（Europe PMC登録）の抄録を使用。本文は入手できず", "preprint": true, "p1": "フランスの全国代表の縦断コホート12,904人（小5〜中3）で、家庭の教育・文化的実践は学力の社会経済格差を和らげず、むしろ広げる方向に働くことを示した（抄録）。", "p2": "家庭の教育実践が格差を補うのか強めるのかは、英語圏以外では特に分かっていなかった（抄録）。", "p3": "親の学歴・世帯収入・親の職業で社会経済的地位（SES）を測り、文化活動への参加、課外活動、学校への親の関与、親子の共同活動の4領域を調整変数として、読み書きと計算の学力の軌跡を潜在成長曲線モデルで推定した（抄録）。", "p4": "評価は、学力の初期水準と相対的な順位の変化に対するSES×家庭実践の交互作用（抄録）。", "p5": "SESは初期の学力とその後の相対的な順位の変化の両方を強く予測した。家庭の実践はどの領域でも正の主効果を持ったが、交互作用は小さく一貫せず、有意なときは高SESの子により有益な「増幅」の方向だった。調整効果は主に初期水準で見られた（抄録）。", "p6": "観察データで、家庭の実践の選択は家庭の特性と絡む。交互作用は小さく一貫しないと著者自身が述べ、増幅の結論は限定的に読む必要がある（抄録）。", "fun": "博物館に連れて行ったり習い事をさせたりすることは、恵まれない家庭の子の助けになりそうに思えます。ところがデータでは、もともと恵まれた家庭の子の方がより得をしていた――良い習慣も、使える資源の差で効き方が変わる、という結果です。", "unverified": "本文未読のため、効果の大きさは未確認。"}}, {"id": "pn13", "rank": 13, "field": "経済学", "headline": "気温の予測市場は天気予報モデルに勝つか", "title": "Forecast Accuracy and Selection Value in Temperature Prediction Markets", "url": "https://doi.org/10.2139/ssrn.7628300", "authors": "Dhavit Gandhi", "venue": "SSRN", "date": "2026-10-20", "apa": "Gandhi, D. (2026). Forecast Accuracy and Selection Value in Temperature Prediction Markets. https://doi.org/10.2139/ssrn.7628300", "why": "米20都市の気温予測市場の40万件超の取引判断を使い、市場と気象モデルの予測精度と「選んだ取引」の価値を区別して評価した。", "explain": {"basis": "抄録", "basis_note": "SSRN（Crossref登録）の抄録を使用。本文は入手できず", "preprint": true, "p1": "米20都市の気温予測市場（Kalshi）で、市場は無条件では気象モデルより良い予報者だが、モデルが自ら選んだ取引では市場に勝つこと、そしてバックテストの落とし穴を示した（抄録）。", "p2": "予測市場と気象モデルの予測精度を、取引の選択の効果と分けて比べた研究、そして決定ログを使ったバックテストの偏りの検証は乏しかった（抄録）。", "p3": "ECMWFとGFSを混ぜた気温モデルを、Kalshiの日次最高・最低気温の契約と比べ、記録された415,545件の取引判断のうち決済結果で採点できる407,816件を分析した（抄録）。", "p4": "評価指標はブライア・スコアと、契約あたりの仲値に対する優位（エッジ）（抄録）。", "p5": "予報の形だけで選んだ判断では、モデルのブライア・スコアは市場より0.0042悪かった。モデル自身が選んだ判断、特に本命に対する大穴（平均価格0.331）の選択では契約あたり+0.287の優位（t=+4.95）で、本命-大穴バイアスとは逆だった。現在の設定で過去のログを再生すると、取引される行の78.3%は後の閾値変更だけで当時は棄却されていたもので、当時の設定を反映するのは5.3%だった（抄録）。", "p6": "取引費用を差し引いた後の収益性は示されていない（抄録）。決済の情報源が途中で変わったが、主な結論は頑健とする。", "fun": "みんなの賭けで決まる予測市場は、平均的には天気予報のプロのモデルより当たる。ところがモデルが「ここは市場が間違っている」と自信を持った場面だけ選ぶと、モデルが勝つ――全体の成績と、選んだ場面の成績は別物です。過去のデータで試すときに、未来の知識が紛れ込む落とし穴の指摘も実践的です。", "unverified": "本文未読のため、モデルの詳細と期間は未確認。"}}, {"id": "pn14", "rank": 14, "field": "機械学習", "headline": "拡散モデルの丸暗記を熱力学的な特異点で検出", "title": "Detection of Memorization in Diffusion Models Through Thermodynamic Singularity", "url": "https://arxiv.org/abs/2610.27754", "authors": "Iljung Kim ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Kim, I., Park, K., Noh, Y.-K., & Lee, D. D. (2026). Detection of Memorization in Diffusion Models Through Thermodynamic Singularity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27754", "why": "拡散モデルが訓練標本を記憶する失敗を、逆過程の解析的な特徴づけと熱力学的特異点の判定基準で検出する理論を与えた。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、デルタ関数の拡散2.1節、判定基準3章、実験4.1〜4.3節）を読んだ。表2・表3の数値は抽出が不完全で一部未確認", "preprint": true, "p1": "拡散モデルが訓練画像を丸暗記しているかを、訓練データを見ずに、生成過程の「速度場」の発散（熱力学的な特異点）から判定する基準を導き、丸暗記を抑える損失の修正も示した（抄録、§1）。", "p2": "丸暗記の検出は、生成画像と訓練データの最近傍比較（全訓練データが必要）や、経験的な代理指標（スコア差、ヘッセ行列など）に頼り、原理的な解釈が難しかった（§1、§3）。", "p3": "連続の式から、デルタ関数（1枚の訓練画像）を拡散させたときの速度場がv=(x−x′)/(2t)となり、t→0で発散することを導いた（§2.1、式8）。有限個の訓練標本から作る順過程には必ずこの特異点が生じ、逆過程が丸暗記するにはそれを学ぶ必要がある。そこで生成の最終段の速度の二乗ノルムの平均に比例するヘルムホルツ自由エネルギーの変化率Φ（式9）を判定基準とした（§3.1）。", "p4": "CIFAR-10（画素空間）とCelebA-HQ（潜在空間）の事前学習モデルを少数の部分集合で微調整して丸暗記を起こし、最近傍のLPIPSで測った丸暗記の割合とΦを比べた。Stable Diffusion v1.4で、丸暗記を誘発するプロンプトの標本を、スコア差やヘッセ行列の既存法と見分ける性能を比べた（§4.1〜4.2）。", "p5": "部分集合100枚での微調整では生成画像のすべてが丸暗記、20,000枚では丸暗記なしとなり、Φのt=0付近の振る舞いはすべての条件で丸暗記の程度と整合した（§4.1、表1、図2〜3）。標本単位の判定では、提案指標が丸暗記のない安全な生成の信頼できる指標になったと報告する（§4.2、表2）。閾値を超える速度ノルムを罰する損失（式19）で、生成の質を落とさず丸暗記を大きく減らしたとする（§4.3）。", "p6": "速度が大きいことは丸暗記の必要条件で、逆（速度が大きければ必ず丸暗記）は成り立たないと著者は述べる（§3）。大規模モデルでの検証範囲は限られる。", "fun": "インクの一滴が水に広がる様子を逆再生すると、最初の一瞬だけ広がる速さが無限大になります。AIが訓練画像をそのまま覚えてしまうと、この「無限大の速さ」まで再現しようとする――だから速さを見れば丸暗記が分かる、という物理学の発想が面白いところです。", "unverified": "表2のAUC・TPRと表3のFIDの具体的な値は未確認。"}}, {"id": "pn15", "rank": 15, "field": "経済学", "headline": "経済格差は民主主義への支持を下げるのか", "title": "Enough is enough? Analyzing the relationship between economic inequality and support for democracy", "url": "https://doi.org/10.31235/osf.io/4kjhn_v3", "authors": "Brian Douwenga ほか", "venue": "SocArXiv", "date": "2026-10-20", "apa": "Douwenga, B., van Ham, C., Kloosterhof, L., & Lehr, A. (2026). Enough is enough? Analyzing the relationship between economic inequality and support for democracy. https://doi.org/10.31235/osf.io/4kjhn_v3", "why": "格差と民主主義支持を結ぶ5つの理論経路を整理し、混在する実証結果を経路ごとに検証した。", "explain": {"basis": "抄録", "basis_note": "SocArXiv（OSF）の抄録を使用。本文は入手できず", "preprint": true, "p1": "経済格差と民主主義への支持を結ぶ5つの理論経路を整理し、1990〜2022年の国別データで、長期傾向・非線形・水準依存の効果はなく、国内での所得格差の同時点の上昇が支持を下げる比較的頑健な証拠を示した（抄録）。", "p2": "格差の拡大が民主主義の支持を下げるという議論は多いが、実証は一貫せず、国の選び方や指標の選び方に結果が強く依存していた（抄録）。", "p3": "業績評価、民主主義の再分配機能、政治的不平等、社会的・心理的機能不全、公正と期待の5つの理論経路から、長期傾向の効果、非線形性、変化の効果の水準依存という3つの予測を導き、国の標本と格差・支持の測り方を変えて推定を比べた（抄録）。", "p4": "民主主義への支持と満足の両方を結果変数とし、国内の変動（within）と国家間の平均の差（between）を分けて見た（抄録）。", "p5": "長期傾向の効果、非線形の効果、変化の効果の水準依存はいずれも見られなかった。国内での所得格差の同時点の水準は支持を下げ、比較的頑健だった。国家間では平均の格差が大きいほど支持が低い相関があるが、GDPの差による見かけの関係の可能性を排除できなかった（抄録）。", "p6": "国レベルの観察データで、因果の識別には限界がある。効果の大きさは抄録になく未確認。", "fun": "「格差が広がると民主主義が嫌われる」はよく聞く話ですが、データで確かめると、話は思ったより単純でした。長い目で見た格差の推移ではなく、その年の格差の大きさだけが効いているらしい――大きな物語を一つずつ検証して絞り込む姿勢が見どころです。", "unverified": "本文未読のため、対象国と係数は未確認。"}}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "予測家のインフレ観の物語が予想のばらつきを生む", "title": "Beyond the Numbers: Professional Forecasters’ Narratives about Inflation and Stock Market Performance", "url": "https://doi.org/10.2139/ssrn.7637578", "authors": "Christian Conrad ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Conrad, C., Schoelkopf, J. T., Weber, M., & Brueckbauer, F. (2026). Beyond the Numbers: Professional Forecasters’ Narratives about Inflation and Stock Market Performance. https://doi.org/10.2139/ssrn.7637578", "why": "専門家の異なる語り（ナラティブ）が数量的なインフレ予想の不一致を説明することを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "専門の予測家がインフレと株価の関係についてどんな「物語」を信じているかで、同じ情報を受けても予想を逆方向に更新することを示した研究。", "p3": "2022年12月の専門予測家を対象に、2023年のインフレが株式市場にどう効くかの語りを把握し、インフレ見通しの情報を与えて12か月先の予想を更新させる実験と、仮想的な資産配分の実験を行った（抄録）。", "p5": "予測家は信じる語りに応じて、同じ情報に対しリターン予想を異なる方向に因果的に更新し、資産配分も語りで変わった。共通の情報を与えても語りが違えば予想は収束しない（抄録）。", "fun": "同じニュースを聞いても、頭の中にある「お話」が違えば正反対の結論になる――専門家でもそうだという点が興味深いところです。情報を増やせば意見がそろうとは限らない、という結果は社会の分断の議論にもつながります。", "unverified": "標本の規模と効果量は抄録になく未確認。"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "LLM埋め込みで作るインフレ・ナラティブ指数", "title": "Inflation Narratives and Expectation Formation: Evidence from Large Language Model Embeddings", "url": "https://doi.org/10.2139/ssrn.7641418", "authors": "Yongmiao Hong ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Hong, Y., Jiang, F., Wang, Y., & Xue, B. (2026). Inflation Narratives and Expectation Formation: Evidence from Large Language Model Embeddings. https://doi.org/10.2139/ssrn.7641418", "why": "40年分の新聞記事にLLM埋め込みを適用し、インフレの方向性の語りを指数化して期待形成との関係を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "1984〜2024年のウォール・ストリート・ジャーナルの記事にLLM埋め込みを使い、インフレが上がる方向か下がる方向かを示す報道の語りの指数（DIN）を作り、家計の予想への因果効果を示した研究。", "p3": "記事の埋め込みから方向性の指数を作り、家計のインフレ予想と実際のインフレとの関係を見た。CPI発表のサプライズを日次DINの操作変数にして因果を推定した（抄録）。", "p5": "DINの上昇は家計のインフレ予想の上昇に先行し、実際のインフレの情報も含んだ。インフレ的な語りは予想を因果的に押し上げ、注目が高い時期やニュースに触れる家計で強かった。従来のテキスト分析より一貫して性能が高かった（抄録）。", "fun": "新聞が「物価はこれから上がる」という調子で書くと、家計も本当にそう予想するようになる――言葉の向きが経済を動かす様子を、AIで40年分の記事から数値化した点が面白いところです。LLMが未来を知っている問題への対策も議論されています。", "unverified": "指数の作り方と効果の大きさは未確認。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "AIは好みを予測するのか、作り変えるのか", "title": "Predicting or Shaping Tastes? Artificial Intelligence, Preference Manipulation, and Welfare in Personalized Markets", "url": "https://doi.org/10.2139/ssrn.7649582", "authors": "Leonardo Becchetti ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Becchetti, L., & Solferino, N. (2026). Predicting or Shaping Tastes? Artificial Intelligence, Preference Manipulation, and Welfare in Personalized Markets. https://doi.org/10.2139/ssrn.7649582", "why": "プラットフォームのAIが選好を予測する経路と操作する経路を分けた独占モデルで、厚生への影響を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "プラットフォームのAIが消費者の本当の好みを予測する経路と、魅力的に見せて好みを操作する経路を分けた独占モデルで、価格と厚生への影響を分析した理論研究。", "p3": "予測は真の不一致を減らし、操作は見かけの不一致だけを減らす（心理的コストもありうる）という独占モデルを立て、市場の一部だけを覆う場合と全体を覆う場合の2つの価格体制で比較した（抄録）。", "p5": "部分的なカバーでは価格は技術に依存せず予測と操作は私的に補完的、全体を覆うと価格は個別化とともに上がり両者は代替的になる。操作は私的に過大評価されるが、部分カバーでは独占の過少消費を和らげる次善の効果もありうる。最善の計画者は操作を使わない（抄録）。", "fun": "おすすめ機能は「あなたの好きなものを当てる」のか「好きにさせる」のか――この2つを分けて考えると、同じ技術でも社会にとっての良し悪しが市場の状況で入れ替わる、という結論が意外です。一律の規制では足りないという示唆につながります。", "unverified": "モデルの仮定の詳細は未確認。"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "多資産の自動マーケットメーカーが被る裁定損失", "title": "Loss-Versus-Rebalancing for Multi-asset Geometric-mean Market Makers", "url": "https://doi.org/10.2139/ssrn.7630438", "authors": "Joonhyuk Suh ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Suh, J., & Uryasev, S. (2026). Loss-Versus-Rebalancing for Multi-asset Geometric-mean Market Makers. https://doi.org/10.2139/ssrn.7630438", "why": "幾何平均型の自動マーケットメーカーの多資産版について、リバランス対比の損失（LVR）を導いた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "多資産の自動マーケットメーカー（Balancer型）で、流動性提供者が裁定取引で失う価値（LVR）を閉形式で表した研究。", "p3": "既存の一般的なLVR恒等式を、加重幾何平均の不変量をもつ多資産プールに特化し、裁定後の準備金とプール価値を導いて、ペアごとの相対リターンで表した。有限の観測格子での差も求めた（抄録）。", "p5": "瞬間的なLVRはプール価値の半分×ペア間の相対リターンの二次変動の加重和となり、多資産のLVRは個々の分散ではなく資産間のリターンのばらつきで決まる。合成の暗号資産プールで検証した（抄録）。", "fun": "分散型取引所では、価格がずれるたびに裁定者が差額を持っていき、それが資金を預けた人の損になります。資産が何種類あっても、その損は「2つずつのペアのずれ」の合計で書ける、というきれいな結果が数学的な面白さです。", "unverified": "実データでの検証の有無は未確認（合成プールのみ記載）。"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "規制がユーロ圏の短期金融市場の構造を変えた", "title": "Regulatory incentives and the structure of euro area money markets", "url": "https://doi.org/10.2139/ssrn.7639258", "authors": "Emmanuel Faïk ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Faïk, E., & Vergote, O. (2026). Regulatory incentives and the structure of euro area money markets. https://doi.org/10.2139/ssrn.7639258", "why": "金融危機後の健全性規制が短期取引のコストを通じて市場構造に与えた影響を定量化した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "バーゼルIII規制が無担保・有担保の短期資金取引に課す限界的なコストを推計し、ユーロ圏の短期金融市場がレポ中心に変わった理由を示した研究。", "p3": "流動性カバレッジ比率、安定調達比率、レバレッジ比率の3つの規制について、無担保・有担保の銀行間取引の限界的な規制コストを様式化して推計した（抄録）。", "p5": "2025年後半の無担保取引の規制コストは貸し手で約35bp、借り手で約15bp。高品質担保のレポは通常10bpを大きく下回った。準備金が減るなかでレポ市場が再配分の主経路であり続けると見込んだ（抄録）。", "fun": "銀行同士のお金の貸し借りでも、規制の「見えない手数料」が取引の形を決めている、という話です。担保なしで貸すと規制上のコストが高いので、担保付きの取引ばかりになる。規制は安全のためでも、市場の構造を静かに作り変えます。", "unverified": "推計方法の仮定は未確認。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "IT人的資本が経営者報酬を押し上げる", "title": "IT Human Capital and Executive Compensation", "url": "https://doi.org/10.2139/ssrn.7644338", "authors": "Seth Benzell ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Benzell, S., Brynjolfsson, E., & Jin, W. (2026). IT Human Capital and Executive Compensation. https://doi.org/10.2139/ssrn.7644338", "why": "経営者が蓄積したIT人的資本と報酬の関係を定量化し、ITが経営者の仕事の中身を変えることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "企業内のIT人材の蓄積が多いほど経営者の報酬が高いことを、米上場企業1,418社・8,746企業年で示した研究。", "p3": "企業別のIT労働者のストック（Stanford IT Tables）と経営者報酬データ（ExecuComp）を2014〜2020年で結び、雇用・資本・企業と年の固定効果を統制した（抄録）。", "p5": "IT人的資本が企業内で1標準偏差（IT労働者が約3分の2多い）増えると、経営者報酬の平均は2.9%、CEO報酬は4.9%高い。同じ経営者でも成り立ち、増加の前には差がなかった（抄録）。", "fun": "ITの導入は現場の仕事だけでなく、社長の仕事の価値も変える――IT人材が増えると経営者の給料も上がる、という関係を示しています。ITで扱える情報が増えると、それを使って判断する人の役割が重くなる、という解釈です。", "unverified": "因果の識別は事前傾向の確認に限られ、詳細は未確認。"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "インド自動車の生産連動補助金を差の差で評価", "title": "An Econometric Assessment of the Production-linked Incentive (Auto) Scheme in India: Inequality and Picking Winners?", "url": "https://doi.org/10.2139/ssrn.7627920", "authors": "Om Girish Mudgal ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Mudgal, O. G., & Bhat, S. (2026). An Econometric Assessment of the Production-linked Incentive (Auto) Scheme in India: Inequality and Picking Winners? https://doi.org/10.2139/ssrn.7627920", "why": "生産連動インセンティブ制度の効果を準実験の差の差で検証し、勝者選択の問題を論じた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "インドの自動車産業向け生産連動インセンティブ（PLI）制度の効果を差の差で評価し、恩恵が大企業に偏る可能性を示唆した研究。", "p3": "自動車・部品メーカーを手作業で照合したパネルで、売上、原材料費比率、固定資産（純ブロック）の変化を準実験の差の差で推定した（抄録）。", "p5": "固定資産への効果が企業規模とともに大きくなる傾向が見られたが、標本が小さくブートストラップp=0.078で示唆的な結果にとどまる（抄録）。", "fun": "国が「勝ち組」を選んで支援すると、もともと大きな企業ばかりが得をするのでは、という産業政策の古い問題を扱っています。結果ははっきりしないものの、小さな企業が制度から構造的に外れる仕組みを議論している点が要点です。", "unverified": "標本の企業数は未確認。"}}, {"id": "pn23", "rank": 23, "field": "統計学", "headline": "共有ガンマ・フレイルティで縦断二値データを予測", "title": "A general class of shared gamma frailty models for risk prediction, with application to breast cancer screening adherence", "url": "https://arxiv.org/abs/2610.28548", "authors": "Marco Bonetti ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Bonetti, M., Ratti, E., & Hofvind, S. (2026). A general class of shared gamma frailty models for risk prediction, with application to breast cancer screening adherence (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28548", "why": "共有フレイルティの生存モデルに着想を得た縦断・クラスター二値データの新しい混合モデルを提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "縦断・クラスター化された二値データ向けに、すべての量が閉形式で計算できる共有ガンマ・フレイルティ型の混合モデルを提案した研究。", "p3": "多変量生存解析の共有フレイルティ・モデルに着想を得て二値データのモデルを作り、個人のリスク予測を導き、ランダム切片の従来のGLMMと比べた（抄録）。", "p5": "オスロ地域の乳がん検診への個人の受診継続の大規模データに適用した（結果の数値は抄録になし）。", "fun": "同じ人が何度も受診するかどうかのような「はい/いいえ」の繰り返しデータには、人ごとのなりやすさの違いがあります。その違いを、計算が式で一発で済む形で表したのが工夫で、大規模データでも速く予測できます。", "unverified": "従来モデルとの性能比較の数値は未確認。"}}, {"id": "pn24", "rank": 24, "field": "統計学", "headline": "AHPの優先度をブラッドリー・テリーで尺度不変に", "title": "Scale-Invariant Priority Estimation in AHP via Bradley-Terry and Cumulative Link Models", "url": "https://doi.org/10.2139/ssrn.7649682", "authors": "Miloš Milićević ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Milićević, M., Ivković, D., Delibašić, B., & Petrović, A. (2026). Scale-Invariant Priority Estimation in AHP via Bradley-Terry and Cumulative Link Models. https://doi.org/10.2139/ssrn.7649682", "why": "一対比較の数値の付け方に依存しない優先度推定を、ブラッドリー・テリーと累積リンクモデルで与えた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "階層分析法（AHP）の固有ベクトルによる優先度推定を、ブラッドリー・テリーの最尤推定に置き換えて、尺度の付け方に左右されない順位と統計的推論を可能にした研究。", "p3": "二値比較のBT-AHP、サーティの1〜9尺度を順序的証拠として読むOrdinal BT-AHP、累積リンクモデルで強度を扱うCLM-AHPの3つを作り、整合度と性能をモンテカルロで調べた（抄録）。", "p5": "推定値をAHP行列に戻すと整合度CR=0になることを証明した。Ordinal BT-AHPは尺度による順位逆転を2.4〜4分の1に減らした。重みの信頼区間や「1位が本当に1位である確率」、判断の不整合の尤度比検定も得られる（抄録）。", "fun": "「AとBどちらが大事？を1〜9で答える」方式は、数字の付け方の癖で結論が変わってしまう弱点があります。比べた結果を確率モデルで読み直すと、順位の確からしさまで言える、という統計学らしい改良です。", "unverified": "実データへの適用例の有無は未確認。"}}, {"id": "pn25", "rank": 25, "field": "統計学", "headline": "半離散最適輸送で金融の裾リスクを捉える", "title": "Financial Tail Risk Beyond Lipschitz Continuity via Semi-Discrete Optimal Transport", "url": "https://econpapers.repec.org/RePEc:arx:papers:2609.27785", "authors": "Ryan M. Engel ほか", "venue": "RePEc NEP", "date": "2026-10-12", "apa": "Engel, R. M., Lee, K., & Stillman, N. (2026). Financial Tail Risk Beyond Lipschitz Continuity via Semi-Discrete Optimal Transport (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2609.27785", "why": "リプシッツ連続な生成器では表せない裾の重いリターンを、半離散最適輸送で生成・評価する方法。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "金融リターンの重い裾を、学習型の生成モデルではなく半離散最適輸送（SDOT）で生成することで、裾リスクを安定に推定できることを示した研究。", "p3": "リプシッツ連続な写像はガウス分布を裾の軽い分布にしか写せないことをモンジュ・アンペール方程式から論じ、各観測に等しい質量のセルを割り当てるSDOTで裾に届かせた。ジャンプ拡散の重さを変える実験とS&P500の21年バックテストで比べた（抄録）。", "p5": "尖度94〜1,679の範囲でSDOTは裾の比を0.85〜0.94（シード間の標準偏差0.025未満）に保ち、学習型生成器は裾を縮めるか分散が膨らんだ。CVaR最適化ではシャープ比0.70（次点0.40）、最大ドローダウン−2.60%だった（抄録）。", "fun": "AIの画像生成で使う「なめらかな変形」の仕組みでは、まれに起きる大暴落のような極端な値をうまく作れない、ということを数学的に示した点が面白いところです。引き伸ばすのではなく、境界をまたいで飛ぶ方式に変えるという発想の転換です。", "unverified": "本文の実験設定の詳細は未確認。"}}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "複数時点のテスト等化で生じる連結誤差を見積もる", "title": "Linking Error Estimation for Mean-Geometric Mean and Pairwise Haberman Linking Across Multiple Time Points in the 2PL Model", "url": "https://doi.org/10.31234/osf.io/ct4my_v1", "authors": "Oskar Engels ほか", "venue": "PsyArXiv", "date": "2026-10-20", "apa": "Engels, O., Lüdtke, O., & Robitzsch, A. (2026). Linking Error Estimation for Mean-Geometric Mean and Pairwise Haberman Linking Across Multiple Time Points in the 2PL Model. https://doi.org/10.31234/osf.io/ct4my_v1", "why": "項目パラメタの漂流下での縦断的な等化の連結誤差を、2つの等化法について推定する方法を示した。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "複数時点のテストを共通項目でつなぐ等化で生じる「連結誤差」を閉形式とサンドイッチ推定量で見積もり、標準誤差だけの区間が過小になることを示した研究。", "p3": "2パラメタ・ロジスティック・モデルで3時点の平均-幾何平均法とペアワイズのハバーマン法をM推定量として扱い、連結誤差・標準誤差・総誤差の推定量を導き、人の抽出の偏りを補正した。シミュレーションと縦断の数学データで検証した（抄録）。", "p5": "標準誤差に基づく区間は標本が大きいほど被覆率が下がり、偏り補正したジャックナイフの総誤差区間はほぼどこでも許容できる被覆率に達した。実データでは連結誤差が標準誤差を上回った（抄録）。", "fun": "毎年のテストの点数を比べるには、共通の問題で「ものさし」をそろえる必要があります。ところが共通問題の選び方で結果がぶれ、その誤差は受験者を増やしても減りません。人数が多いほど自信過剰な区間になる、という逆説が面白い点です。", "unverified": "シミュレーションの条件の詳細は未確認。"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "ランダム照明の逆散乱を統計的に画像化し解像度を解析", "title": "A Statistical Imaging Framework for Inverse Obstacle Scattering and Its Resolution Analysis", "url": "https://arxiv.org/abs/2610.28553", "authors": "Jinrui Zhang ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Zhang, J., & Zhang, H. (2026). A Statistical Imaging Framework for Inverse Obstacle Scattering and Its Resolution Analysis (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28553", "why": "遠方場の二次モーメントから障害物を画像化する統計的枠組みと、その解像度の解析を与えた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "ランダムな照明の下での遠方場の2次モーメントから障害物の形を画像化する統計的枠組みと、その解像度の理論を与えた研究。", "p3": "標本点ごとに試験遠方場を合成する最小の統計的重みつきコスト（正則化Q統計量）を定義し、その逆数を画像化指標とした。境界での遷移の片側半値幅で解像度を測り、漸近則を導いた（抄録）。", "p5": "解析的な境界をもつ単連結領域で、遷移幅が h(x)·loglog(1/ρ)/log(1/ρ) の形で縮むことを示した。数値例は、実際の解像度が波長だけでなく源の統計・放射・雑音の水準で決まることを示した（抄録）。", "fun": "光や音で物の形を見るとき、細かさの限界はふつう波長で決まると習います。ところが照明がランダムなときには、雑音や反射の統計的な性質も解像度を決める――という、教科書の常識を一歩広げる結果です。", "unverified": "数値例の具体的な設定は未確認。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "回答スタイルと潜在状態を分けるLASARSモデル入門", "title": "The Latent State and Response Style (LASARS) Model: An Introductory Tutorial", "url": "https://doi.org/10.31234/osf.io/5zqdh_v1", "authors": "Jess Grimmond ほか", "venue": "PsyArXiv", "date": "2026-10-20", "apa": "Grimmond, J., Brown, S., Gronau, Q. F., & Hawkins, G. (2026). The Latent State and Response Style (LASARS) Model: An Introductory Tutorial. https://doi.org/10.31234/osf.io/5zqdh_v1", "why": "自己報告の回答スタイルの偏りと本来の潜在状態を分離するモデルの入門的解説。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "自己報告の回答スタイル（極端に答える癖など）と本来の潜在状態を分けるLASARSモデルを、Rとjamoviで使えるようにした入門的な解説。", "p3": "jamoviでは最尤推定（プログラミング不要）、Rパッケージでは階層ベイズ推定で全事後分布を得る。実例でデータ準備、モデル指定、出力の読み方を示した（抄録）。", "p5": "回答スタイルを調整すると実質的な結論が変わりうることを実例で示した（具体的な数値は抄録になし）。", "fun": "アンケートで「とてもそう思う」ばかり選ぶ人と控えめに答える人では、同じ気持ちでも点数が違ってしまいます。この「答え方の癖」を統計で取り除いて本当の気持ちを推定する道具を、誰でも使えるようにした点に価値があります。", "unverified": "例示データの内容は未確認。"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "感情の持ち越しはその場の人間関係で変わる", "title": "Affective Inertia Varies with Momentary Social Context: Evidence From Two Experience-Sampling Studies", "url": "https://doi.org/10.31234/osf.io/7nk2u_v1", "authors": "ZhaoXuan Shang ほか", "venue": "PsyArXiv", "date": "2026-10-20", "apa": "Shang, Z., Pan, P., Da Silva, F., Choi-Kain, L., Croci, M. S., Brañas, M., Miguel, E. C., & Fatimah, H. (2026). Affective Inertia Varies with Momentary Social Context: Evidence From Two Experience-Sampling Studies. https://doi.org/10.31234/osf.io/7nk2u_v1", "why": "2つの経験サンプリング研究で、感情の慣性が人に固有ではなく社会的文脈で変わることを示した。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "感情がある時点から次の時点へ持ち越される度合い（感情の慣性）は人ごとに固定ではなく、その場に人がいるかどうかで弱まることを2つの経験サンプリング研究で示した研究。", "p3": "ブラジルの若者315人（2020〜2021年）と欧州3か国の成人803人（2020年）のデータに、ベイズ多層自己回帰モデルと、正負の感情を分ける区分モデルを当てはめた（抄録）。", "p5": "両研究で、人といる・交流があると感情はより正で、全体の慣性は弱かった。特に負の感情の慣性が弱まり、正の感情の慣性への調整効果は確かではなかった（抄録）。", "fun": "いやな気分が続くかどうかは性格で決まっていると考えがちですが、誰かと一緒にいるだけで引きずりにくくなる、という結果です。気分の「慣性」を物理のように測って、それが人間関係で変わることを示した点が面白いところです。", "unverified": "効果の大きさは抄録になく未確認。"}}, {"id": "pn30", "rank": 30, "field": "機械学習", "headline": "線形ニューラルネットのSGDは収束する", "title": "Convergence of stochastic gradient descent for learning linear neural networks", "url": "https://arxiv.org/abs/2610.28561", "authors": "Gabin Maxime Nguegnang ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Nguegnang, G. M., Bah, B., Rauhut, H., & Terstiege, U. (2026). Convergence of stochastic gradient descent for learning linear neural networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28561", "why": "非凸な線形ニューラルネットの学習で確率的勾配降下法の収束を理論的に示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "深い線形ニューラルネットの学習で、確率的勾配降下法（SGD）が臨界点の集合にほぼ確実に収束することを初めて示した理論研究。", "p3": "正則化した二乗損失の下で、SGDの反復が有界にとどまることをまず示し、確率近似理論の漸近的擬軌道の枠組みで、固定・適応の両方の刻み幅について収束を証明した。リプシッツ性や白色化データは仮定しない（抄録）。", "p5": "深い線形ネットのSGDについて、ほぼ確実な収束保証を与えた初の研究だと著者は述べる（抄録）。", "fun": "深層学習の主役であるSGDは、実際には驚くほどうまく動くのに、なぜうまくいくのかの理論はまだ穴だらけです。非線形を取り除いた「線形の深いネット」でも非凸性は残るので、まずここで確実に収束することを示すのは理論の足場固めとして重要です。", "unverified": "必要な仮定の詳細は未確認。"}}, {"id": "pn31", "rank": 31, "field": "機械学習", "headline": "決定的なゼロ次最適化が払う代償の下界", "title": "Lower Bounds for Smooth Nonconvex Zeroth-Order Optimization: The Price of Determinism under Low Curvature Trace", "url": "https://arxiv.org/abs/2610.27550", "authors": "Yuxing Peng ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Peng, Y., Tang, Z., & Jia, W. (2026). Lower Bounds for Smooth Nonconvex Zeroth-Order Optimization: The Price of Determinism under Low Curvature Trace (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27550", "why": "曲率の跡が小さい条件で、決定的なゼロ次最適化法の性能の下界を示し、乱択法との差を明らかにした。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "関数値だけを使うゼロ次最適化で、曲率の跡（実効ランク）が小さいときに乱択法が得る節約を、決定的な方法は得られないことを下界で証明した研究。", "p3": "出発点より下でヘッセ行列が跡LE以下の行列で抑えられるという条件の下で、L-平滑な非凸関数のε停留点を探す呼び出し回数の上界と下界を、乱択法と決定的方法で比べた（抄録）。", "p5": "乱択法はO(ET)回で済み、これは定数倍を除いて最適。決定的方法は約d·min{T,√(ET)}回が必要で、決定的であることのコストは次元dに比例して増える（抄録）。", "fun": "言語モデルの微調整では、勾配を使わず関数の値だけを見る方法が意外に高次元でもうまくいきます。その鍵が「サイコロを振ること（乱択）」にあり、サイコロを使わない方法では次元の数だけ余計に手間がかかる――運を味方にする方が賢い場面があるという数学的証明です。", "unverified": "定理の正確な条件は未確認。"}}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "エージェントが自分の操作画面を進化させる", "title": "Evolving Agent Interfaces", "url": "https://arxiv.org/abs/2610.28601", "authors": "Saaket Agashe ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-21", "apa": "Agashe, S., Yang, Y., Gonzalez-Pumariega, G., Koduru, B. C., Li, C.-L., Yang, J., Li, A., & Wang, X. E. (2026). Evolving Agent Interfaces (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28601", "why": "コンピュータ操作エージェントが人用の画面に縛られる問題に対し、エージェント自身が操作の接口を改良する方法。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers（arXiv）の抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "コンピュータを操作するAIエージェントが、自分で使う操作の接口（インタフェース）と使い方の知識を経験から進化させる仕組み（Agent S4）を提案した研究。", "p3": "メタエージェントが合成タスクでの実行記録を成否ラベルなしで調べ、接口と使い方の知識をリポジトリに作り直す。集団ベースの進化で、見ていない検証タスクでの成績により発展させるリポジトリを選ぶ（抄録）。", "p5": "OSWorld V2で、同じモデルの固定接口の3.8倍の21.3%に達し、オープンソースの最高性能を記録した。比較した大規模モデル（13.0%、20.6%）より高く、費用はその約4.3%と1.5%。ScienceBoardでは41.4%→58.6%（抄録）。", "fun": "人間用の画面でセルを一つずつ打ち込むより、1行のコードで済ませた方が速い――AIにとって使いやすい道具をAI自身に作らせよう、という発想です。賢いモデルを作るのとは別の方向から性能を伸ばせることを示しています。", "unverified": "比較条件の公平性の詳細は未確認。"}}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "判断用の小モデルに任せても成功率は上がらない", "title": "Good Judgment, Bad Advice: Decision-Model Controllers Raise Agent Cost Without Improving Success", "url": "https://arxiv.org/abs/2610.24649", "authors": "Naman Vats", "venue": "Hugging Face Daily Papers", "date": "2026-10-21", "apa": "Vats, N. (2026). Good Judgment, Bad Advice: Decision-Model Controllers Raise Agent Cost Without Improving Success (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.24649", "why": "エージェントの小さな判断を安価な意思決定モデルに委ねる設計が、費用を増やすだけで成功率を改善しないことを示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers（arXiv）の抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "エージェントの小さな判断（止める・確かめる・方針を変える）を安価な意思決定モデルに任せても、成功率は上がらず費用だけが増えたことを、事前登録の比較で示した研究。", "p3": "Terminal-Bench 2.1で同じエージェントのループを固定し、制御器だけを、なし・決定的ルール・小型LLM・意思決定モデル（Jev）・同じ頻度で選ぶプラセボに変えて比べた（抄録）。", "p5": "保留した21タスク・315試行で、Jevは試行あたり費用を19%増やし（比1.19、95%CI 1.02〜1.36）、合格率は同じ73.0%。オフラインでは完了判定の順位づけは良かった（AUROC 0.78）が較正が悪く、87%が合格していた実行に平均0.50の完了確率を付けた（抄録）。", "fun": "「判断は上手なのに、助言は役に立たない」という、どこかの会議で見かける光景をAIで再現したような結果です。正しく見分けられることと、それを使って行動を良くできることは別物だ、という教訓が面白いところです。", "unverified": "タスクの内訳は未確認。"}}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "短い動画から長時間の世界モデルを学ぶ", "title": "Frechet Forcing: Training Long-Horizon Streaming World Models from Short Clips", "url": "https://arxiv.org/abs/2610.25666", "authors": "Yian Zhao ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-20", "apa": "Zhao, Y., Yan, Y., Guo, H., Zheng, R., Zhang, J., & Chen, J. (2026). Frechet Forcing: Training Long-Horizon Streaming World Models from Short Clips (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.25666", "why": "短いクリップで学んだストリーミング世界モデルが長い展開で崩れる問題を、フレシェ距離に基づく学習で抑えた。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers（arXiv）の抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "短い動画で学習した世界モデルが長く生成すると崩れる問題を、教師モデルも長い動画も使わずに抑える学習法（Fréchet Forcing）を提案した研究。", "p3": "自己生成の履歴の後に実データで流れ一致損失を課す「生成の錨」、各クリップの真値を中心とした潜在統計のフレシェ距離「文脈の忠実さ」、凍結した知覚空間で実画像とのフレシェ距離「現実との一致」の3つの制約で、モデルとサンプラーを一緒に微調整する（抄録）。", "p5": "253フレームで事前学習したMiniWorld-1Bを381フレームのクリップで最大36GPU時間微調整すると、4,000フレームを超えても安定し、ロボット操作とカメラ操作の両方で行動に従い続けた（抄録）。", "fun": "自分の出力を次の入力にする生成は、少しの誤差が雪だるま式に大きくなります。長い正解動画と比べなくても「本物らしいか」「その場面らしいか」という統計だけ合わせれば長持ちする、という発想の転換がポイントです。", "unverified": "定量評価の指標と数値は未確認。"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "拡散言語モデルの公平性は標本化の設定で変わる", "title": "Beyond Model Weights: Sampling-Dependent Fairness in Diffusion Language Models", "url": "https://arxiv.org/abs/2610.27584", "authors": "Koshiro Saito ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Saito, K., Oba, D., Bollegala, D., & Okazaki, N. (2026). Beyond Model Weights: Sampling-Dependent Fairness in Diffusion Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27584", "why": "拡散言語モデルの公平性が重みだけでなく標本化の制御に依存することを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "拡散言語モデルで測られる社会的バイアスの大きさや、モデル間の順位までが、ブロック長などの標本化の設定で大きく変わることを示した研究。", "p3": "LLaDA、LLaDA-1.5、DreamをOpen-BBQで評価し、標本化の設定（ブロック長、再マスク戦略）を変えてバイアスを測り、既存のバイアス緩和法の効果も調べた（抄録）。", "p5": "3モデルとも社会的バイアスを示し、その大きさと順位は標本化の設定に非常に敏感だった。既存の緩和法は性能を落とさずバイアスを下げたが、緩和後も設定への依存は残った（抄録）。", "fun": "同じAIでも、文章を生成するときの「速さと質のつまみ」を回すだけで偏見の強さが変わる、という結果です。AIが公平かどうかはモデルの中身だけでは決まらず、使い方まで含めて評価しなければならないことを示しています。", "unverified": "バイアスの数値は未確認。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "物理世界での自己改善能力のスケーリング則", "title": "Where is Physical RSI capability from? An Observational Scaling Law of LLM-as-policy", "url": "https://arxiv.org/abs/2610.26848", "authors": "Zekai Li ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-20", "apa": "Li, Z., Yu, J., Zhang, J., Niu, L., Qi, Z., Zheng, J., Chen, X., Liu, D., Zhang, Y., Wang, H., & Yi, L. (2026). Where is Physical RSI capability from? An Observational Scaling Law of LLM-as-policy (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.26848", "why": "LLMを方策とする物理的な再帰的自己改善の能力を評価する指標を作り、その観察的なスケーリング則を示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers（arXiv）の抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "視覚言語モデルを方策とするロボットが、物理世界で失敗から自分を改善する能力を5軸で測る指標を作り、その観察的なスケーリング則を調べた研究。", "p3": "初回性能・効率・成功・予算・失敗からの改善の5軸の指標（PhysRSI-eval）で、複数のVLMを18の操作タスクに固定の相互作用予算で評価し、公開性能からの相対性能予測と初期のフィードバックからの予測を分析した（抄録）。", "p5": "異なる能力が改善の異なる部分を制約するという「物理的な樽の仮説」を提案した。履歴を消すと後半の成功が下がり、作業空間を凍結しても未知の配置で有用だった（抄録）。", "fun": "桶の板の一番短い所から水がこぼれるように、ロボットの上達はいちばん弱い能力で頭打ちになる、という「樽の仮説」が面白い比喩です。ベンチマークの平均点が同じでも、伸び方はまったく違うことがあります。", "unverified": "スケーリング則の具体的な形は未確認。"}}, {"id": "pn37", "rank": 37, "field": "因果推論", "headline": "経済的自由の改革は成長を生むのか", "title": "Economic Freedom, Legal Reform, and Subsequent Growth: Institutional Measurement, Dynamic Counterfactuals, and Causal Identification", "url": "https://doi.org/10.2139/ssrn.7644458", "authors": "Ricardo Alonzo Fernandez Salguero", "venue": "SSRN", "date": "2026-10-21", "apa": "Fernandez Salguero, R. A. (2026). Economic Freedom, Legal Reform, and Subsequent Growth: Institutional Measurement, Dynamic Counterfactuals, and Causal Identification. https://doi.org/10.2139/ssrn.7644458", "why": "経済的自由度指数の変化と成長の関係を、動的な反実仮想と因果識別の手法で検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "経済的自由度の改善が成長を生むかを、指数と日付の付いた法改正の両方で慎重に検証し、頑健な効果は確認できないことを示した研究。", "p3": "162か国2,635国年（2003〜2020年）のパネルで、国と年の効果、事前のマクロ履歴、負の対照を使い、事前登録した18の比較を多重検定補正で評価した。別に51か国61の改革をリスク集合デザインで分析した（抄録）。", "p5": "18の比較はどれも多重検定補正後に残らなかった。改革後3年の累積成長の差は1.05対数ポイント（95%区間−1.01〜3.26）で、反実仮想の作り方によって約1.83ポイント変わった（抄録）。", "fun": "「規制を減らせば経済は伸びる」はよく聞く主張ですが、きちんと比べると証拠ははっきりしない、という結果です。比較相手の作り方を変えるだけで答えが変わることを隠さず示した点に、研究の誠実さがあります。", "unverified": "指数の5領域ごとの推定値は未確認。"}}, {"id": "pn38", "rank": 38, "field": "経営学", "headline": "「偽物」を装う自己呈示は戦略的か", "title": "Strategic Impostorism Reconsidered: Impression-Management and Narcissistic Pathways to Impostor-Like Self-Presentation", "url": "https://doi.org/10.2139/ssrn.7650038", "authors": "Graeme J. Ditchburn ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Ditchburn, G. J., Commisso, N., & Naude, A. (2026). Strategic Impostorism Reconsidered: Impression-Management and Narcissistic Pathways to Impostor-Like Self-Presentation. https://doi.org/10.2139/ssrn.7650038", "why": "インポスター現象の一部が印象管理や自己愛による戦略的な自己呈示である可能性を検討した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "「自分は偽物だ」と感じるインポスター現象の一部は、印象管理としての戦略的な謙遜であり、自己愛とは別の経路で生じることを大学生231人で示した研究。", "p3": "インポスター傾向、能力を低く見せる行動（サンドバッギング）、誇大・脆弱な自己愛、印象管理的な謙遜、自己効力感を測り、相関と潜在プロファイル分析を行った（抄録）。", "p5": "インポスター傾向はサンドバッギング・脆弱な自己愛・謙遜と正、誇大な自己愛・自己効力感と負に関連した。6つのプロファイルが得られ、戦略的なインポスターに当たる群は誇大な自己愛ではなく謙遜とサンドバッギングが高かった（抄録）。", "fun": "「私なんて全然です」と言う人の中には、本当に自信がない人と、期待値を下げておく作戦の人がいる――その2つをデータで分けようとした研究です。謙遜の裏にある動機の違いは、職場の評価にも関わる話です。", "unverified": "大学生の便宜標本で一般化には限界がある。"}}, {"id": "pn39", "rank": 39, "field": "教育", "headline": "学校の個別カウンセリングは成績も守るか", "title": "A quasi-experimental evaluation of one-to-one counselling to improve mental health and education outcomes amongst school pupils in England, Scotland and Wales", "url": "https://doi.org/10.31234/osf.io/4xsm7_v1", "authors": "Jennifer Saxton ほか", "venue": "PsyArXiv", "date": "2026-10-20", "apa": "Saxton, J., saunders, C. L., White, S., Toth, K., White, J., Golden, S., Wilkinson, H. R., & Ford, T. (2026). A quasi-experimental evaluation of one-to-one counselling to improve mental health and education outcomes amongst school pupils in England, Scotland and Wales. https://doi.org/10.31234/osf.io/4xsm7_v1", "why": "英国3地域の学校での一対一カウンセリングの効果を、心の健康と教育成果について準実験で評価した。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "英国の学校で一対一のカウンセリングを受けた約1万5千人の子どもを、傾向スコアで対応づけた対照と比べ、心の困難は減ったが出席率は改善しなかったことを示した研究。", "p3": "2016〜2019年のカウンセリング受給児のデータに対し、3つの全国コホートから傾向スコア・マッチングで対照を選び、混合回帰で困難さの総得点、向社会性、出席率と持続的欠席への効果と、属性による違いを推定した（抄録）。", "p5": "困難さの総得点の減少は3つの分析すべてで対照より大きく、−0.99（95%CI −1.76〜−0.23）から−1.91（−2.08〜−1.75）。向社会性はわずかに改善し、出席は改善しなかった。民族や特別な教育的ニーズで効果が異なった（抄録）。", "fun": "学校のカウンセリングが本当に効くのかは、比較対象のない研究ばかりで分かっていませんでした。大規模な全国データから「似た子ども」を探して比べることで、実験ができない場面でも効果に迫ろうとした点がこの研究の工夫です。", "unverified": "マッチングの共変量は未確認。"}}, {"id": "pn40", "rank": 40, "field": "教育", "headline": "幼少期の宗教暴動が学歴を下げる", "title": "The Schooling Cost of Communal Violence: Early-Life Exposure to Hindu-Muslim Riots in India", "url": "https://doi.org/10.2139/ssrn.7636059", "authors": "Sreyartha Mukherjee", "venue": "SSRN", "date": "2026-10-20", "apa": "Mukherjee, S. (2026). The Schooling Cost of Communal Violence: Early-Life Exposure to Hindu-Muslim Riots in India. https://doi.org/10.2139/ssrn.7636059", "why": "インドの暴動記録と全国調査を結び、幼少期の宗派間暴力への曝露が教育達成に与える影響を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "インドで、胎児期から4歳までにヒンドゥー・ムスリム間の暴動に多くさらされた世代ほど、学歴が低いことを示した研究。", "p3": "暴動の記録をインド人間開発調査に結び、1971〜1990年生まれで同じ県内の、受胎から4歳までの暴動曝露が異なるコホートを比べた（抄録）。", "p5": "暴動件数1標準偏差の増加で就学年数は0.062年、死者数1標準偏差で0.077年減り、中等教育修了の確率は1.05ポイント下がった。女性（0.082年）が男性（0.064年）より大きく、2〜3歳での曝露に集中した。宗教間の格差拡大は見られなかった（抄録）。", "fun": "子どもが生まれる前後の数年間に周囲で起きた暴力が、何十年も後の学歴にまで影響する――幼い時期の環境の大切さを示す結果です。同じ県の生まれ年の違いを比べることで、地域ごとの事情の違いを取り除いているのが工夫です。", "unverified": "影響の経路（健康、家計など）は抄録で示されず未確認。"}}, {"id": "pn41", "rank": 41, "field": "教育", "headline": "グジャラート暴動の長期的な教育への傷", "title": "Communal Violence and Long-Run Educational Attainment: Evidence from India", "url": "https://doi.org/10.2139/ssrn.7636978", "authors": "Meghna Laha", "venue": "SSRN", "date": "2026-10-20", "apa": "Laha, M. (2026). Communal Violence and Long-Run Educational Attainment: Evidence from India. https://doi.org/10.2139/ssrn.7636978", "why": "2002年のグジャラート暴動への曝露が長期の教育達成に与えた影響を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "2002年のグジャラート暴動に学齢期でさらされた世代は、12年生の修了率が6ポイント（23%）、就学年数が0.5年（7%）下がったことを差の差で示した研究。", "p3": "2019〜21年の全国家族健康調査（NFHS-5）を使い、暴動時に学齢期だった人と既に学業を終えていた人を、グジャラート州と他州で比べる差の差で推定した（抄録）。", "p5": "12年生修了は6ポイント（23%）、就学年数は0.5年（7%）減った。暴動時に最も若かったコホートで減少が大きく、女性、特にムスリムの女性で最大だった（抄録）。", "fun": "たった数日の暴動が、20年近くたっても学歴の差として残っている、という結果です。被害が女性と子どもに偏ったことが、後の教育格差に表れている。社会の分断が長い時間をかけて不平等を深める仕組みを数字で見せています。", "unverified": "州外への移住の扱いは未確認。"}}, {"id": "pn42", "rank": 42, "field": "教育", "headline": "留学生は地方の人材として定着するか", "title": "International Students as Regional Human Capital: An Analysis of Work-Study Practices and Policy Implications for Regional Settlement", "url": "https://doi.org/10.2139/ssrn.7640358", "authors": "Seongmin Seo ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Seo, S., & KIM, J. (2026). International Students as Regional Human Capital: An Analysis of Work-Study Practices and Policy Implications for Regional Settlement. https://doi.org/10.2139/ssrn.7640358", "why": "韓国の留学生のアルバイト実態から、地方での人的資本の育成と定着の政策目標との整合を検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "韓国の留学生のアルバイトは勉強時間を減らさず韓国語力も伸ばしうるが、多くが専攻と無関係な単純労働で、地方の人材育成という政策目標とずれていることを示した研究。", "p3": "2つの大学の留学生への調査データとフォーカス・グループ面接を分析した（抄録）。", "p5": "アルバイトは学習時間を必ずしも減らさず、韓国語力を高める可能性があった。一方で仕事の多くは専攻と無関係な低技能職で、職業に特有の人的資本はたまりにくかった（抄録）。", "fun": "留学生に地方で働いてもらい定着してほしい、という政策の狙いと、実際のアルバイトの中身がかみ合っていない――人口減少に悩む地域が留学生に期待するとき、何が足りないかを具体的に示しています。", "unverified": "調査の標本数は抄録になく未確認。"}}, {"id": "pn43", "rank": 43, "field": "開発経済学", "headline": "市場までの距離が収穫後の労働を変える", "title": "Market Distance and Post Harvest Labour in Nigeria,Evidence from Household-Crop Survey Data", "url": "https://doi.org/10.2139/ssrn.7644056", "authors": "Ajibola Oladiipo", "venue": "SSRN", "date": "2026-10-20", "apa": "Oladiipo, A. (2026). Market Distance and Post Harvest Labour in Nigeria,Evidence from Household-Crop Survey Data. https://doi.org/10.2139/ssrn.7644056", "why": "ナイジェリアの世帯・作物調査で、市場への距離が収穫後の労働の組織に与える影響を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "ナイジェリアの農家で、市場までの距離と収穫後の労働の組織の関係は、使う指標や比較の仕方で変わり、確かな関係は言えないことを示した記述的研究。", "p3": "全国世帯パネル第4波の2,761世帯・6,332の世帯×作物記録で、最寄り市場までの距離と雇用労働の参加・労働時間の関係を、全国と州内の比較で推定した（抄録）。", "p5": "全国では距離が長いほど雇用労働の参加が少ない傾向だったが、農村度・作物・州を考慮すると不確かで符号も変わった。労働時間には明確な距離の勾配はなかった（抄録）。", "fun": "「市場から遠いと人を雇いにくい」という自然な予想が、比べ方を変えるだけで消えてしまう、という結果です。はっきりした結論が出ないこと自体を丁寧に示し、後の研究の出発点にしようとする姿勢が特徴です。", "unverified": "因果効果は識別していない（著者明記）。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "風・波・道路車両・列車を同時に解く橋の連成振動", "title": "Dynamic response analysis of road vehicle–train–bridge coupled system for single-level rail-cum-road bridge under combined wind and wave actions", "url": "https://doi.org/10.1142/s0219455428500642", "authors": "Yang He ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-10-21", "citescore": 6.5, "citescore_year": "2025", "apa": "He, Y., Wang, L., Jiang, J., Hu, P., Han, Y., Zeng, M., & He, Y. (2026). Dynamic response analysis of road vehicle–train–bridge coupled system for single-level rail-cum-road bridge under combined wind and wave actions. International Journal of Structural Stability and Dynamics. https://doi.org/10.1142/s0219455428500642", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Crossref登録）の抄録を使用。本文は入手できず", "preprint": false, "p1": "世界初の単層道路・鉄道併用の多塔斜張橋（金海大橋）を例に、風・波・道路車両・列車・橋梁を一体化した時変の連成モデルを作り、どの荷重が橋のどの振動を支配するかと車両の安全性を明らかにした（抄録）。", "p2": "海峡の併用橋は交通・強風・波を同時に受け、その連成振動が橋の使用性と車両の安全性を左右するが、相互作用の仕組みは十分に分かっていなかった（抄録）。", "p3": "道路車両・列車・軌道・橋を動的相互作用行列で一つの系として結合し、橋と列車がある状態での6種の典型車両の空力係数を風洞試験で求め、不規則な風場と波浪場を模擬して多ケースの動的解析を行った（抄録）。背景：VBI解析では車輪の接触点で車両と橋の運動方程式を結合する。", "p4": "主桁の観測点の横・鉛直・ねじれの応答、車両の輪重減少率、乗り心地を、ランダムな交通の実現例を含む複数のケースで比べた（抄録）。", "p5": "主桁の横振動は主に風荷重、鉛直・ねじれ振動は車両荷重が支配し、波荷重の寄与は限られた。ランダム交通の一例では、列車・大型トラック・橋の局所応答の振動数の近さと位置の重なりで局所的な増幅が生じ、橋を介した車両間の相互作用の可能性を示した。高速の列車では風上側の輪重減少率が安全限界を超えうる一方、低速では橋の振動が増えて道路車両の安全性と乗り心地が下がった（抄録）。", "p6": "一つの橋と限られたケース・交通の実現例に基づく。局所増幅の一般性、波荷重の寄与の観測点への依存、実測との比較の有無は未確認。", "fun": "一本の橋の上で、トラックと列車が同時に走り、横から強風、下から波――それらが互いの揺れを強め合うことがある、という結果です。特に、列車とトラックの揺れのリズムが橋の揺れと近いと、離れた車どうしが橋を通じて影響し合うという点が面白いところです。", "unverified": "本文未読のため、具体的な応答値・安全限界の数値は未確認。"}}, {"id": "jr02", "rank": 2, "headline": "どんな勾配でも使える粒状流の深さ平均モデル", "title": "Regularisation and validation of a depth-averaged model for granular flow consistent with the incompressible mu left parenthesis upper I right parenthesis μ ( I ) $\\mu (I)$ rheology", "url": "https://doi.org/10.1017/jfm.2026.12163", "authors": "Emile Deleage ほか", "venue": "Journal of Fluid Mechanics", "date": "2026-10-21", "sjr": 1.283, "citescore": 6.8, "citescore_year": "2025", "apa": "Deleage, E., & Richard, G. L. (2026). Regularisation and validation of a depth-averaged model for granular flow consistent with the incompressible mu left parenthesis upper I right parenthesis μ ( I ) $\\mu (I)$ rheology. Journal of Fluid Mechanics, 1045. https://doi.org/10.1017/jfm.2026.12163", "theme": "確率動力学・計算力学", "theme_no": 8}, {"id": "jr03", "rank": 3, "headline": "検索フィルタを減らすと選ぶ商品が多様になる", "title": "The Effects of Search Interface on Consumer Preferences: Evidence from a Randomized Experiment", "url": "https://doi.org/10.1287/mksc.2025.0261", "authors": "Jia Liu ほか", "venue": "Marketing Science", "date": "2026-10-21", "sjr": 8.324, "citescore": 9.3, "citescore_year": "2025", "apa": "Liu, J., & Toubia, O. (2026). The Effects of Search Interface on Consumer Preferences: Evidence from a Randomized Experiment. Marketing Science. https://doi.org/10.1287/mksc.2025.0261", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Crossref登録）の抄録を使用。本文は入手できず", "preprint": false, "p1": "通販サイトの検索フィルタを制限すると、消費者がより広く探索し、属性の重みが分散し、より多様で高価な商品を選ぶことを、理論と1,200人の無作為化実験で示した（抄録）。", "p2": "フィルタや並べ替えは探索の手間を減らすが、商品情報との出会い方を変えて選好そのものを形づくる可能性は検討されていなかった（抄録）。", "p3": "インタフェースが顕著さの再配分と情報による選好の更新を通じて属性の選好に影響する理論枠組みを作り、ファセット・フィルタの制限が属性の重要度の集中を下げ（選好の分散）、選ぶ商品の多様性を高めるという2つの予測を導いた（抄録）。", "p4": "自作の電子商取引サイトでワイヤレス・ヘッドフォンを探させる、誘因整合的なオンライン無作為化実験（1,200人）で予測を検証し、媒介分析を行った（抄録）。", "p5": "フィルタを制限すると、消費者はより広く探索し、属性の重要度の重みはより均等になり、選んだ商品はより多様で高価になった。探索の増加が属性の選好の変化と関連することを媒介分析が示した（抄録）。効果量は未確認。", "p6": "1つの商品カテゴリと実験用サイトでの結果で、実際のプラットフォームや他のカテゴリへの一般化は未確認。高価格の選択が消費者の満足や厚生を高めたかは抄録からは分からない。", "fun": "「ノイズキャンセリングあり・1万円以下」と絞り込むと、早く見つかる代わりに、絞り込んだ条件ばかり重視するようになる――検索画面の作りが、私たちの好みそのものを作っているという指摘です。好みは最初からあるのではなく、探し方の中で作られるという点が面白いところです。", "unverified": "本文未読のため、効果の大きさと価格差は未確認。"}}, {"id": "jr04", "rank": 4, "headline": "挑戦的な仕事は健康を良くも悪くもする", "title": "The Promise and Price of Challenging Work: A Study of Health-Related Trade-Offs", "url": "https://doi.org/10.1177/07308884261500101", "authors": "Philip Badawy ほか", "venue": "Work and Occupations", "date": "2026-10-21", "sjr": 2.84, "citescore": 9.1, "citescore_year": "2025", "apa": "Badawy, P., & Schieman, S. (2026). The Promise and Price of Challenging Work: A Study of Health-Related Trade-Offs. Work and Occupations. https://doi.org/10.1177/07308884261500101", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Crossref登録）の抄録を使用。本文は入手できず", "preprint": false, "p1": "カナダの5波のパネル（2011〜2019年）で、技能を伸ばせる「挑戦的な仕事」は、仕事と家庭の葛藤の減少と熟達感を通じて健康を良くする一方、職務の圧迫と役割の境界のあいまいさを通じて健康を悪くするという、二面性を示した（抄録）。", "p2": "挑戦的な仕事は価値ある仕事の資源とされるが、それに伴う健康上のトレードオフはあまり分かっていなかった（抄録）。背景：仕事の要求-資源（JD-R）モデルでは資源は健康を守るとされる。", "p3": "カナダ労働・ストレス・健康調査の5波のパネルデータで、挑戦的な仕事と心理的苦痛・睡眠の問題の関係を、媒介経路（仕事-家庭葛藤、熟達感、職務の圧迫、役割のあいまいさ）に分けて分析した（抄録）。", "p4": "結果変数は心理的苦痛と睡眠の問題（抄録）。", "p5": "挑戦的な仕事は仕事-家庭葛藤の低下と熟達感の上昇を通じて健康の良さと関連した。同時に、職務の圧迫と役割の境界のあいまいさを通じて健康の悪さとも関連し、相反する経路が併存した（抄録）。効果の大きさは未確認。", "p6": "観察データで、因果の方向（健康な人が挑戦的な仕事に就く可能性）は抄録からは識別の方法が確認できない。カナダの標本の一般化も未確認。", "fun": "やりがいのある仕事は人を元気にしますが、同じ仕事が「いつも追われる」「仕事と私生活の境目がなくなる」という形で心身をむしばむこともある――良い面と悪い面が同じ源から出ていることを、同じデータの中で分けて見せた点が要点です。", "unverified": "本文未読のため、媒介効果の推定値は未確認。"}}, {"id": "jr05", "rank": 5, "headline": "生成AIで個人に合わせた実験を政治心理学に", "title": "Political psychology in an era of personalization: Misinformation research, generative AI, and the promise of tailored experiments", "url": "https://doi.org/10.1111/pops.70206", "authors": "Yamil Ricardo Velez", "venue": "Political Psychology", "date": "2026-10-21", "sjr": 1.938, "citescore": 7.6, "citescore_year": "2025", "apa": "Velez, Y. R. (2026). Political psychology in an era of personalization: Misinformation research, generative AI, and the promise of tailored experiments. Political Psychology, 47(S1). https://doi.org/10.1111/pops.70206", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Crossref登録）の抄録を使用。本文は入手できず", "preprint": false, "p1": "誤情報研究を例に、集団向けの測定・介入では信念がなぜ政治的に重要かが見えなくなると論じ、生成AIを使って個人や集団に合わせた（テーラード）実験を行う政治心理学を提唱した論考（抄録）。", "p2": "有権者はアルゴリズムで個別化された情報環境にいるのに、誤情報の測定や介入は集団全体を対象に作られ、この異質性を平らにしてしまう（抄録）。", "p3": "概念的な議論。研究デザインを集団や個人に合わせることで、関連性を高め、説得を促し、意見の形成と変化の理論を検証する条件を作れると主張する（抄録）。背景：生成AIは参加者ごとに刺激を生成でき、こうした個別化実験の実施を容易にする。", "p4": "実証データはない（抄録から判断）。", "p5": "有権者が意見を形成・表明する独自のやり方に測定と介入を合わせる「個別化された政治心理学」の可能性と課題を論じた（抄録）。", "p6": "理論的な提案で、個別化による交絡や再現性、倫理（個別化された説得）の扱いは抄録からは確認できない。", "fun": "同じ「誤情報」でも、ある人には大事で別の人にはどうでもいい。だから全員に同じ質問や同じ訂正を見せる実験では、本当の効き目が分からない――AIで一人ひとりに合わせた実験をしよう、という提案です。一方で、個別化された説得の強さは、使い方次第で危うさにもなります。", "unverified": "本文未読のため、具体的な提案の手順は未確認。"}}, {"id": "jr06", "rank": 6, "headline": "粒状体のせん断帯は曲がり、移動し、分岐する", "title": "Evolving shear bands in a nonlinear micropolar continuum", "url": "https://doi.org/10.1098/rspa.2026.0151", "authors": "Ted J. O’Hare ほか", "venue": "Proceedings of the Royal Society A Mathematical Physical and Engineering Sciences", "date": "2026-10-21", "citescore": 4.8, "citescore_year": "2025", "apa": "O’Hare, T. J., Gourgiotis, P. A., Coombs, W. M., & Augarde, C. E. (2026). Evolving shear bands in a nonlinear micropolar continuum. Proceedings of the Royal Society A Mathematical Physical and Engineering Science, 482(2348). https://doi.org/10.1098/rspa.2026.0151", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Crossref登録）の抄録を使用。本文は入手できず", "preprint": false, "p1": "内部長さを持つ幾何学的非線形のミクロ極（コッセラ）連続体を陰的な物質点法で解き、粒状体のせん断帯が固定された平面ではなく、曲がり、向きを変え、移動しうることを示した（抄録）。", "p2": "古典的なコーシー連続体では、軟化と内部長さの欠如で変形が一つの平面状のせん断帯に集中し、向きは分岐時に固定されるとされてきたが、粒状体の実験では曲がり、分岐し、移動するせん断帯が観察される（抄録）。", "p3": "応力と偶応力の一般化した尺度に基づく統一的な降伏面をもつ非関連ドラッカー・プラガー・モデルで内部長さを導入し、有限ひずみの局所化を陰的な物質点法（MPM）で計算した（抄録）。背景：コッセラ連続体は各点に回転の自由度（ミクロ回転）を持たせ、粒子の回転を表す。", "p4": "2次元の境界値問題で、せん断帯の位置と形状の時間変化を、ミクロ回転の場とともに調べた（抄録）。", "p5": "応力状態の変化に応じて、活動域はパラメータの特別な調整なしに曲がり、向きを変え、移動した。変化する中心線は、帯に垂直なミクロ回転勾配がほぼゼロになる尾根で一貫して追跡でき、これを非線形ミクロ極連続体での自然な帯の選択則として提案した（抄録）。", "p6": "2次元の数値例に限られ、実験との定量比較の有無は抄録から確認できない。3次元や動的問題への拡張は未確認。", "fun": "砂山が崩れるときの滑り面は、まっすぐな一本の線とは限らず、途中で曲がったり場所を変えたりします。砂粒の「回転」まで計算に入れると、その動く滑り面が自然に再現でき、しかも回転の分布から滑り面の位置を読み取れる、という点が面白いところです。", "unverified": "本文未読のため、数値例の条件と比較対象は未確認。"}}, {"id": "jr07", "rank": 7, "headline": "人は負の話題の価値を他人について過大評価", "title": "Consumers Overestimate How Much Others Value Valenced Content", "url": "https://doi.org/10.1002/mar.70296", "authors": "Fengshu Xie ほか", "venue": "Psychology and Marketing", "date": "2026-10-21", "sjr": 3.642, "citescore": 17.7, "citescore_year": "2025", "apa": "Xie, F., Doré, B., & Dubé, L. (2026). Consumers Overestimate How Much Others Value Valenced Content. Psychology & Marketing. https://doi.org/10.1002/mar.70296", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Crossref登録）の抄録を使用。本文は入手できず", "preprint": false, "p1": "人は感情的な（特に否定的な）コンテンツを他人がどれだけ価値ありと感じるかを系統的に過大評価し、それが共有を増やすこと、身近な友人を一人思い浮かべさせる簡単な促しで偏りが減ることを4研究で示した（抄録）。", "p2": "人は何を共有するかを、受け手がどれだけ価値を感じるかの見積もりで決めるが、その見積もりが感情的な内容で正確かは分かっていなかった（抄録）。", "p3": "統制された課題と自然な文脈を含む4研究で、送り手の見積もりを受け手の自己報告と支払意思額と比べた。過程として、感情的な内容が強く影響を受ける典型的な受け手を顕著にし、その受け手に注目することで価値の見積もりが膨らむという仕組みを検証した（抄録）。", "p4": "評価は、送り手の見積もりと受け手の自己報告・支払意思額との差、共有意図、促しの介入の効果（抄録）。", "p5": "人々は感情的な、特に否定的な内容について他人の評価を過大に見積もった。見積もりの膨らみは共有意図の高さを予測した。特定の親しい友人を考えさせる焦点切り替えの促しは偏りを減らし、感情的な内容と中立な内容の共有の差を縮めた（抄録）。効果量は未確認。", "p6": "研究の標本と場面の詳細、促しの効果の持続性は抄録から確認できない。", "fun": "腹の立つニュースを「これはみんな知りたいはず」と思ってシェアしがちですが、実際の受け手はそこまで価値を感じていない――頭に浮かぶのが「すごく反応しそうな誰か」だからだそうです。特定の友人を一人思い浮かべるだけで偏りが減るという、手軽な対策も面白い点です。", "unverified": "本文未読のため、各研究の標本と数値は未確認。"}}, {"id": "jr08", "rank": 8, "headline": "加速度だけで高速車両の車体応力を全域推定", "title": "Research on stress monitoring method for high-speed train carbody based on data-model hybrid-driven", "url": "https://doi.org/10.1177/14759217261491216", "authors": "Chaotao Liu ほか", "venue": "Structural Health Monitoring", "date": "2026-10-21", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Liu, C., Luo, S., Li, F., Zhang, D., Cheng, Y., Song, Y., Wu, P., & Zeng, J. (2026). Research on stress monitoring method for high-speed train carbody based on data-model hybrid-driven. Structural Health Monitoring. https://doi.org/10.1177/14759217261491216", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Crossref登録）の抄録を使用。本文は入手できず", "preprint": false, "p1": "高速列車の車体で、台車枠の端と枕梁に置いた少数の加速度計から荷重を同定し、モード試験で較正した有限要素モデルに入れて、車体全体の応力をリアルタイムに推定する「データとモデルの融合」法を示した（抄録）。", "p2": "ひずみセンサは寿命が短く、長期にわたる全域の応力予測が難しい（抄録）。", "p3": "線路試験で準静的荷重と振動疲労荷重の連成と、加速度と荷重の時間・周波数領域の強い相関を確認し、動力学理論とピアソン相関で密な配置から精密な少数配置にセンサを絞った。時間畳み込みネットワーク（TCN）で荷重を同定し、低周波は準静的な重ね合わせ、高周波はFFTに基づくモード重ね合わせで全域の応力を求めた（抄録）。", "p4": "同定した荷重の決定係数と、実測応力との予測誤差で評価した（抄録）。", "p5": "多くの荷重で同定精度はR²>0.7だった。応力の予測誤差は、実測荷重を入れると4%未満、同定荷重では補正係数を使うと最大誤差3.08%に下がった（抄録）。", "p6": "「多くの荷重で」R²>0.7で、同定が難しい荷重成分がある。補正係数の決め方の一般性と、異なる車両・線路条件への移植性は未確認。", "fun": "車体のあちこちにひずみ計を貼る代わりに、壊れにくい加速度計を数か所に置き、そこから「どんな力がかかっているか」をAIで逆算し、その力を物理モデルに入れて全体の応力を計算する――データと物理の役割分担がうまく、どこで誤差が出たかを切り分けやすいのが利点です。", "unverified": "本文未読のため、対象車両と試験条件は未確認。"}}, {"id": "jr09", "rank": 9, "headline": "地元メディアの利用が地域への愛着を支える", "title": "The democratic value of local information: How journalistic and non-journalistic sources relate to community attachment, civic engagement, and democratic attitudes", "url": "https://doi.org/10.1177/14648849261498952", "authors": "Leyla Dogruel ほか", "venue": "Journalism", "date": "2026-10-21", "sjr": 2.087, "citescore": 8.3, "citescore_year": "2025", "apa": "Dogruel, L., Henke, J., & Moehring, W. (2026). The democratic value of local information: How journalistic and non-journalistic sources relate to community attachment, civic engagement, and democratic attitudes. Journalism. https://doi.org/10.1177/14648849261498952", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Crossref登録）の抄録を使用。本文は入手できず", "preprint": false, "p1": "ドイツの代表標本2,069人で、地元の報道機関の利用は、自治体の公式情報や地域の情報源・口コミより強く、地域への愛着・地方民主主義への満足・地方政治への信頼と結びつくことを示した（抄録）。", "p2": "地域情報の源が多様化する中で、報道と報道以外の情報源が地域への統合と政治的態度にどう違って関わるかは分かっていなかった（抄録）。", "p3": "代表性のある調査で、報道機関、自治体の公式情報、地域の情報源、対人コミュニケーションの利用頻度と、地域への愛着、市民参加、地方民主主義への満足、地方政治への信頼の関係を分析した（抄録）。", "p4": "結果変数は地域への愛着、市民参加、地方民主主義への満足、地方政治への信頼の4つ（抄録）。", "p5": "地元メディアの頻繁な利用は、強い愛着、高い市民参加、地方政治・民主主義の好意的な評価と関連した。報道以外の情報源と比べ、地元メディアは愛着・満足・信頼のより強い予測因子だったが、市民参加ではそうでなかった（抄録）。", "p6": "横断調査で、因果の方向（愛着のある人が地元メディアを読む可能性）は識別できない。効果の大きさと統制変数は未確認。", "fun": "地元の新聞やローカルニュースを見る人ほど、その町が好きで、町の政治も信頼している――自治体の広報やSNSの口コミより、報道の方が結びつきが強いという結果です。地方紙が減ると、地域のつながりまで弱まるかもしれない、という問いにつながります。", "unverified": "本文未読のため、係数と統制変数は未確認。"}}, {"id": "jr10", "rank": 10, "headline": "常時微動で地震前後の歴史建築の変化を診る", "title": "Assessment of the dynamic response of Croatian cultural heritage buildings to microseismic noise measurements", "url": "https://doi.org/10.1108/jchmsd-12-2025-0465", "authors": "Anja Majurec ほか", "venue": "Journal of Cultural Heritage Management and Sustainable Development", "date": "2026-10-21", "sjr": 0.487, "citescore": 5.3, "citescore_year": "2025", "apa": "Majurec, A., Dervišević, V., Markušić, S., & Stanko, D. (2026). Assessment of the dynamic response of Croatian cultural heritage buildings to microseismic noise measurements. Journal of Cultural Heritage Management and Sustainable Development, 1–23. https://doi.org/10.1108/jchmsd-12-2025-0465", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Crossref登録）の抄録を使用。本文は入手できず", "preprint": false, "p1": "2020年のクロアチアの地震で被害を受けた歴史建築（トラコシュチャン城、シベニクの聖ヤコブ大聖堂）を、非破壊の常時微動計測で診断し、固有振動数の低下や弱点となる部位を特定した（抄録）。", "p2": "地震後の歴史建築の状態を、建物を傷つけずに素早く評価する方法が求められていた（抄録）。", "p3": "城では地震後に常時微動を計測して地震前のデータと比べ、固有振動数の変化を見た。大聖堂では地震前の構造物の計測と、周辺の地盤の卓越振動数の微動区分（マイクロゾーニング）を組み合わせ、地盤-構造物の相互作用を評価した（抄録）。背景：常時微動は交通や風などの微小な揺れで、固有振動数の推定に使える。", "p4": "評価は、地震前後の固有振動数の比較と、構造物と地盤の振動数の近さ（共振の可能性）（抄録）。", "p5": "城では塔と2階の固有振動数が地震後に低下し、全体的な剛性の低下を示唆した。構造物と敷地の振動数の近さから、地盤-構造物の共振と地形による増幅の可能性が示された。大聖堂では右側の壁、左のギャラリー、ドームが重要な部位として浮かび上がった（抄録）。", "p6": "振動数の低下量や計測条件（温度・湿度の影響）の扱いは抄録から確認できない。共振の推定はピークの近さからの推論にとどまる（抄録）。", "fun": "何百年も前の城や大聖堂を、壊さずに「健康診断」する方法です。建物は風や車のわずかな揺れで常にかすかに震えていて、その震えの高さ（振動数）が下がると、どこかが弱っているサインになる。地面の揺れやすさと建物の揺れのリズムが近いと共鳴しやすい、という点も重要です。", "unverified": "本文未読のため、振動数の具体的な値は未確認。"}}, {"id": "jr11", "rank": 11, "headline": "EUのサステナ開示義務に株価は一様に反応せず", "title": "Heterogeneous stock market reactions to a sustainability reporting mandate: insights from the European Union", "url": "https://doi.org/10.1108/sampj-10-2025-1608", "authors": "Florian Habermann ほか", "venue": "Sustainability Accounting, Management and Policy Journal", "date": "2026-10-21", "sjr": 1.808, "citescore": 15.7, "citescore_year": "2025", "apa": "Habermann, F., Janssen, T., & Braam, G. (2026). Heterogeneous stock market reactions to a sustainability reporting mandate: insights from the European Union. Sustainability Accounting, Management and Policy Journal, 1–28. https://doi.org/10.1108/sampj-10-2025-1608", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Crossref登録）の抄録を使用。本文は入手できず", "preprint": false, "p1": "EUのサステナビリティ報告指令（CSRD）には株価が負に、詳細な基準（ESRS）には正に反応したことをイベントスタディで示し、規制の「義務化」と「標準化」への投資家の評価を分けた（抄録）。", "p2": "サステナビリティ開示の義務化が資本市場にどう評価されるかを、義務そのものと詳細な基準に分けて調べた研究はなかった（抄録）。", "p3": "CSRDに関する3つとESRSに関する2つの規制上の節目について、EU上場企業と米国上場企業の対応標本でイベントスタディを行い、任意開示と環境パフォーマンスの調整効果を横断分析した（抄録）。", "p4": "評価は各イベント周辺の異常リターン（抄録）。", "p5": "CSRDのイベントには有意に負の反応で、投資家が義務を費用負担と見たことを示唆した。ESRSのイベントには正の反応で、標準化と情報の質の向上を評価したと解釈した。任意のサステナビリティ報告はCSRDへの負の反応を和らげ、環境パフォーマンスの高さはESRSへの好意的な反応と関連した（抄録）。", "p6": "施行後の効果と、EU内の執行の国差は今後の課題と著者は述べる（抄録）。イベントの日付の特定と同時期の他の情報の混入の扱いは未確認。", "fun": "「環境情報を開示しなさい」という義務が決まると株価は下がり、「開示のルールをそろえます」という基準が決まると株価は上がる――投資家は負担を嫌いながらも、比べやすい情報には価値を見いだしている、という正反対の反応が面白いところです。", "unverified": "本文未読のため、異常リターンの大きさは未確認。"}}, {"id": "jr12", "rank": 12, "headline": "LLMの審査員はどこまで人に合えば十分か", "title": "When is an LLM-as-a-Judge Good Enough?", "url": "https://doi.org/10.1177/30504554261495282", "authors": "Sebastian Wefers ほか", "venue": "The European Journal on Artificial Intelligence", "date": "2026-10-21", "citescore": 2.9, "citescore_year": "2025", "apa": "Wefers, S., & Breitenbach, T. (2026). When is an LLM-as-a-Judge Good Enough? The European Journal on Artificial Intelligence. https://doi.org/10.1177/30504554261495282", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Crossref登録）の抄録を使用。本文は入手できず", "preprint": false, "p1": "人間の評価者どうしでも意見が割れることを前提に、LLMを審査員として使えるかを、人間どうしのばらつきと比べて統計的に判定する方法を示した（抄録）。", "p2": "LLMの審査員（LLM-as-a-judge）は人の判断と一致しないことがあるが、人どうしもばらつくため、どこまで一致すれば「十分」なのかの基準がなかった（抄録）。", "p3": "人間の評価者間の偏差の分布と、モデルと人間の評価の偏差の分布を統計的に比較し、人間どうしのばらつきが定める到達可能な最良の一致水準を基準として、モデル審査員が「十分良い」かを判定する（抄録）。", "p4": "評価の対象タスクとデータは抄録に記載がない。コードとプロンプトはGitHubで公開（抄録）。", "p5": "特定のタスクについて、人間の評価を、対応する人間の評価者に期待できる質でモデル審査員に自動化できるかを判断する実用的な方法を提供したとする（抄録）。数値的な結果は抄録になし。", "p6": "どの統計的検定を使い、どのタスクで検証したかは抄録から確認できない。人の評価のばらつきが大きい課題では基準が緩くなる点に注意が要る（解釈）。", "fun": "AIの採点が人の採点と完全に一致しないのは当然で、人どうしでも点数は割れます。だから「人と人のズレ」と同じくらいのズレなら合格にしよう、という考え方です。完璧を求めるのではなく、人間並みかどうかを物差しにする現実的な発想が面白いところです。", "unverified": "本文未読のため、適用したタスクと検定法は未確認。"}}, {"id": "jr13", "rank": 13, "headline": "周期高架橋の振動を波の通り道として設計", "title": "Band-gap analysis of urban rail transit viaducts and parameter design of vibration-isolation bearings", "url": "https://doi.org/10.1142/s0219455428500629", "authors": "Yanmei Cao ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-10-21", "citescore": 6.5, "citescore_year": "2025", "apa": "Cao, Y., Tang, Y., Yang, Y., & Yin, X. (2026). Band-gap analysis of urban rail transit viaducts and parameter design of vibration-isolation bearings. International Journal of Structural Stability and Dynamics. https://doi.org/10.1142/s0219455428500629", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Crossref登録）の抄録を使用。本文は入手できず", "preprint": false, "p1": "周期的に並ぶ都市鉄道の高架橋で、列車振動が径間を越えて伝わる様子を「波の伝播」として解析し、振動を遮るバンドギャップの考えで支承の剛性と減衰を設計する方法を示した（抄録）。", "p2": "従来の列車-橋梁の動的解析では、支承のパラメータが振動の伝達をどう制御するかが波動の観点から見えなかった（抄録）。", "p3": "列車-軌道-橋梁の動的相互作用プログラムで輪重（車輪とレールの相互作用力）を求め、ブロッホの定理とフーリエ変換に基づく周期橋の周波数領域の解析モデルに入力した。単純支持の周期梁橋の解析解でモデルを検証した（抄録）。背景：周期構造では特定の周波数帯の波が伝わらない「バンドギャップ」が生じる。", "p4": "北京地下鉄13号線の高架橋を例に、特性波モード、複素波数、減衰曲線を分析して支承の鉛直剛性と減衰を選び、周波数・時間領域で効果を確かめた（抄録）。", "p5": "支承の鉛直剛性を下げ等価減衰を上げると、空間的な波の減衰が強まり径間間の振動伝達が減った。対象の高架橋では鉛直剛性1.0×10⁸ N/m、等価減衰係数6.0×10⁶ N·s/mが適切で、変位の制限を満たしつつ高エネルギーの振動成分を抑えた（抄録）。", "p6": "一つの高架橋の事例で、支承の非線形性や経年変化、異なる径間長への適用は未確認。", "fun": "同じ形の橋桁が規則正しく並ぶ高架橋は、結晶の原子の並びのように「特定の揺れを通さない」性質を持ちえます。その性質を使って、支承の硬さを選べば振動が隣の径間に伝わりにくくなる――固体物理の考え方を橋の設計に持ち込んだ点が面白いところです。", "unverified": "本文未読のため、低減量の数値は未確認。"}}, {"id": "jr14", "rank": 14, "headline": "人の多さが犯罪を招くかは場所の管理次第", "title": "Do the accessibility and guardianship characteristics of places matter? Exploring population presence and crime relationships using urban digital traces", "url": "https://doi.org/10.1111/1745-9133.70043", "authors": "Eon Kim ほか", "venue": "Criminology and Public Policy", "date": "2026-10-21", "sjr": 1.821, "citescore": 7.6, "citescore_year": "2025", "apa": "Kim, E., Bowers, K., & Johnson, S. D. (2026). Do the accessibility and guardianship characteristics of places matter? Exploring population presence and crime relationships using urban digital traces. Criminology & Public Policy. https://doi.org/10.1111/1745-9133.70043", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Crossref登録）の抄録を使用。本文は入手できず", "preprint": false, "p1": "犯罪の起きる場所を、出入りのしやすさと見守り（ガーディアンシップ）の構造で分類し、位置情報つきSNSで測った「その場にいる人口」は公共の場所で犯罪と正、国勢調査の居住人口は逆の関係になることを示した（抄録）。", "p2": "人が多いと犯罪の機会が増えるのか、見守りが増えて減るのかは、場所の性質によって違うはずだが、それを体系的に検証した研究は乏しかった（抄録）。", "p3": "完全に私的から完全に公的まで、アクセスと見守りの構造で場所を分類し、国勢調査人口と、ジオタグ付きSNSで測った滞在人口の2種類の人口と、財産・暴力・薬物・公共秩序の4種の犯罪の関係を、通常時とコロナ禍の移動制限期で比べた（抄録）。", "p4": "評価は場所の類型ごとの人口と犯罪の関連の向きと強さ（抄録）。", "p5": "公共の場所では滞在人口の増加が犯罪と正に関連し（機会の仕組み）、国勢調査人口は逆（見守りの仕組み）だった。移動制限下では滞在人口の関連が特に商業施設で弱まり、住宅地の国勢調査人口の関連は変わらなかった。暴力では、制限下で人の多い時間帯ほど少なく、時間的な関連が正から負に逆転した（抄録）。", "p6": "SNS利用者の偏りによる滞在人口の測定誤差と、都市の特定（対象都市）は抄録から確認できない。", "fun": "人が多い場所は、すりが増える一方で、誰かの目があるので暴力は起きにくい――人の多さは犯罪を増やしも減らしもする、という二面性を、場所の種類で分けて示しました。コロナの外出制限で人の流れが急に変わったことを、自然の実験として使った点も工夫です。", "unverified": "本文未読のため、対象都市と推定値は未確認。"}}, {"id": "jr15", "rank": 15, "headline": "知的障害・LGBT+の中高年が語る地域の居場所", "title": "Ageing, identity and place: Extending intersectional perspectives in age-friendly urbanism through the lived experiences of mid-older adults with intellectual disabilities and LGBT+ identities", "url": "https://doi.org/10.1177/00420980261492433", "authors": "Mei Lan Fang ほか", "venue": "Urban Studies", "date": "2026-10-21", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "apa": "Fang, M. L., Sixsmith, J., Vytniorgu, R., Tai, J., Almack, K., Chadwick, D., Buell, S., Makita, M., Thomas, B., Scrutton, P., Zhu, H., & Cranwell, M. (2026). Ageing, identity and place: Extending intersectional perspectives in age-friendly urbanism through the lived experiences of mid-older adults with intellectual disabilities and LGBT+ identities. Urban Studies. https://doi.org/10.1177/00420980261492433", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイト（Crossref登録）の抄録を使用。本文は入手できず", "preprint": false, "p1": "英国で知的障害のある中高年77人とLGBT+の中高年76人の人生史面接から、地域への所属が日常の場面・主体的な抵抗・デジタル空間で関係的かつ不均等に交渉されることを示し、交差性の視点で高齢者にやさしい都市づくりを拡張した（抄録）。", "p2": "WHOの高齢者にやさしい都市・地域の政策は、自立と参加を促すが、所属の関係的・交差的な側面にほとんど注意を払ってこなかった（抄録）。背景：交差性（intersectionality）は、障害や性的指向などの属性が重なって不利を生むという見方。", "p3": "英国の多地点研究（IncludeAge）で、地域参加型研究の原則に沿い、都市・郊外・農村で人生史面接を行い、交差的な場所の視点（IPP）に基づく再帰的主題分析と物語の共同分析を行った（抄録）。", "p4": "質的研究で、共同分析による主題の構築を通じて解釈の妥当性を高めた（抄録）。", "p5": "(1)日常の空間と小さなやりとりが所属を作る、(2)主体性・抵抗・場所の主張、(3)デジタル空間はつながり・さらされ・不信の場、の3主題を得た。両群とも所属は物理・社会・サービス・デジタルの領域で関係的かつ不均等に交渉された。累積的な不利と回復力を示し、変化の理論を提案した（抄録）。", "p6": "英国の2つの集団に焦点を当てた質的研究で、他の集団や国への転用には限界がある。提案された変化の理論の検証は今後の課題（解釈）。", "fun": "「高齢者にやさしい町」と一口に言っても、知的障害のある人や性的マイノリティの人にとっての居心地の良さは、バス停の段差だけでなく、店員の一言や周りの視線で決まる――小さなやりとりの積み重ねが所属感を作る、という視点が大事なところです。", "unverified": "本文未読のため、引用された語りの内容は未確認。"}}, {"id": "jr16", "rank": 16, "headline": "高齢社員の技術不安が知識共有を妨げる", "title": "The impact of technological anxiety on knowledge sharing behavior among older employees", "url": "https://doi.org/10.1108/jkm-03-2026-0498", "authors": "Yufeng Jiang ほか", "venue": "Journal of Knowledge Management", "date": "2026-10-21", "sjr": 2.382, "citescore": 17.6, "citescore_year": "2025", "apa": "Jiang, Y., Cui, X., Pan, C., & Han, X. (2026). The impact of technological anxiety on knowledge sharing behavior among older employees. Journal of Knowledge Management, 1–21. https://doi.org/10.1108/jkm-03-2026-0498", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "中国の高齢社員403人の調査で、技術への不安が知識共有を減らし、その経路にジョブ・クラフティングと関係のエネルギーが順に介在することを示した研究。", "p3": "デジタル化を進める製造・金融・IT・公共・エネルギー等の企業の高齢社員から403の有効回答を得て、PLS-SEMで連鎖媒介と組織同一化の調整効果を検定した（抄録）。", "p5": "技術不安は知識共有を有意に減らし、ジョブ・クラフティングと関係のエネルギーが順に媒介した。組織への同一化は、不安がクラフティングを下げる第1段階を和らげた（抄録）。", "fun": "新しい技術が苦手だと感じるベテラン社員ほど、持っている知恵を周りに伝えなくなる――組織にとっては大きな損失です。職場への愛着がその悪循環のブレーキになる、という点が対策のヒントになっています。", "unverified": "効果の大きさ（係数）は抄録になく未確認。横断データ。"}}, {"id": "jr17", "rank": 17, "headline": "自治体のサステナ報告は組織の自己像を作る", "title": "Sustainability accounting and reporting: organisational identity construction and enactment in local governments", "url": "https://doi.org/10.1108/aaaj-09-2023-6645", "authors": "Ana Rita Domingues ほか", "venue": "Accounting, Auditing and Accountability Journal", "date": "2026-10-21", "sjr": 1.574, "apa": "Domingues, A. R., Orelli, R. L., & Ruggiero, P. (2026). Sustainability accounting and reporting: organisational identity construction and enactment in local governments. Accounting, Auditing & Accountability Journal, 39(9), 555–585. https://doi.org/10.1108/aaaj-09-2023-6645", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "イタリアの先駆的な自治体の事例で、任意のサステナビリティ会計・報告が外部への説明責任だけでなく、組織の自己像（アイデンティティ）を作り実践する内部の道具として働くことを示した研究。", "p3": "自治体の任意の報告の導入を縦断的な事例研究で追い、半構造化面接と公式文書（計画・会計・報告の各段階）を分析した（抄録）。", "p5": "任意の報告は組織の自己像に動機づけられると同時に、それを形づくり実践する手段になった。職員の仕事と組織の自己像の一致を示す集合的な記憶を作ることで機能した（抄録）。", "fun": "報告書は外の人に見せるためのもの、と考えがちですが、書き続けること自体が「自分たちは何者か」を組織の中で確かめる記録になる、という見方が面白いところです。日記をつけることで自分らしさが固まるのに似ています。", "unverified": "面接の数などの詳細は未確認。"}}, {"id": "jr18", "rank": 18, "headline": "コーダ波の学習で初期の熱損傷を見つける", "title": "Early-stage thermal damage identification in concrete using attention-enhanced coda wave learning", "url": "https://doi.org/10.1177/14759217261498186", "authors": "Jinshan Wen ほか", "venue": "Structural Health Monitoring", "date": "2026-10-21", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Wen, J., Yuan, X., Liu, J., Deng, M., & Li, W. (2026). Early-stage thermal damage identification in concrete using attention-enhanced coda wave learning. Structural Health Monitoring. https://doi.org/10.1177/14759217261498186", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "コンクリートの初期の熱損傷を、超音波のコーダ波を時間・周波数の2系統で学習する注意機構つき1次元CNNで、97%台の精度で識別した研究。", "p3": "コーダ波の時間領域と周波数領域の信号を並列に処理して融合する、注意モジュール（CBAM）付きの2系統1D-CNNを作り、300°C未満で加熱した供試体で評価した（抄録）。", "p5": "テスト集合での平均識別精度は97.10%、別に作った供試体でも95.83%だった（抄録）。", "fun": "コーダ波とは、超音波が材料の中で何度も跳ね返った後に届く「余韻」の部分です。余韻は小さな変化に敏感な一方で乱れやすいので、AIに注目すべき部分を学ばせて安定に読み取る、という工夫が鍵です。", "unverified": "損傷の段階の定義と比較手法の詳細は未確認。"}}, {"id": "jr19", "rank": 19, "headline": "顧客の目標の旅路にある節目を管理する", "title": "Identifying and managing milestones in consumers’ goal journeys", "url": "https://doi.org/10.1007/s11747-026-01216-7", "authors": "Amanda Ann Garrison ほか", "venue": "Journal of the Academy of Marketing Science", "date": "2026-10-21", "sjr": 6.426, "citescore": 22.3, "citescore_year": "2025", "apa": "Garrison, A. A., & Price, L. L. (2026). Identifying and managing milestones in consumers’ goal journeys. Journal of the Academy of Marketing Science. https://doi.org/10.1007/s11747-026-01216-7", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "顧客の旅（カスタマー・ジャーニー）を、企業との接点ではなく顧客自身の目標の「節目（マイルストーン）」から捉える概念を提示した研究。", "p3": "複数段階・複数文脈の質的な顧客ジャーニー研究で、節目の主な特徴と意味を帰納的に特定した（抄録）。", "p5": "節目は他のサービス事象と区別され、顧客の生活に重要な結果をもたらす。節目を理解すると、目標の前進の支援、成功への自信、結果の準備と解釈、目標の修正によるリスク管理ができると論じた（抄録）。", "fun": "「真実の瞬間」のような従来の考え方は、店員との接し方など企業側の場面に注目していました。ところが顧客にとって大事なのは、ダイエットの目標体重に届いた日のような自分の人生の節目かもしれない――視点を顧客の側に移した点が新しいところです。", "unverified": "調査の対象・規模は抄録になく未確認。"}}, {"id": "jr20", "rank": 20, "headline": "役割分担する多エージェントの個人健康支援", "title": "The anatomy of a personal health agent", "url": "https://doi.org/10.1038/s41586-026-11161-8", "authors": "A. Ali Heydari ほか", "venue": "Nature", "date": "2026-10-21", "sjr": 19.713, "citescore": 77.7, "citescore_year": "2025", "apa": "Heydari, A. A., Gu, K., Srinivas, V., Yu, H., Paruchuri, A., Zhang, Z., Zhang, Y., He, Q., Palangi, H., Hammerquist, N., Metwally, A. A., Winslow, B., Kim, Y., Ayush, K., Yang, Y., Narayanswamy, G., Xu, M. A., Garrison, J., Schmidgall, S., et al. (2026). The anatomy of a personal health agent. Nature. https://doi.org/10.1038/s41586-026-11161-8", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "ウェアラブル機器と診療記録を読み解き個人に合わせた健康支援をする、3つの専門サブエージェントからなるLLM多エージェントの「個人健康エージェント」を作り、大規模に評価した研究。", "p3": "検索と健康掲示板の質問の分析と利用者研究から4つの利用場面を特定し、データ分析・健康の専門家・健康コーチの3つのサブエージェントを設計して統合した。11のベンチマークで自動評価と人の評価を行った（抄録）。", "p5": "7,000件超の注釈と、専門家・利用者による1,350時間の評価を行い、個人健康エージェントとしてこれまでで最も包括的な評価だと述べる（抄録）。", "fun": "一人の万能AIではなく、データ分析係・専門知識係・励まし係という役割分担のチームで健康相談に乗る、という設計がポイントです。人間の医療チームの分業をAIで再現しているとも言えます。", "unverified": "各タスクの成績の数値は抄録になく未確認。"}}, {"id": "jr21", "rank": 21, "headline": "機械学習で米上場企業の信用リスクを早期警告", "title": "Forecasting Corporate Credit Risk with Machine and Deep Learning: A Forward-Looking Early-Warning Framework for U.S. Listed Firms", "url": "https://doi.org/10.54254/2754-1169/2026.ld37780", "authors": "Huaxi Hong", "venue": "Advances in Economics Management and Political Sciences", "date": "2026-10-20", "apa": "Hong, H. (2026). Forecasting Corporate Credit Risk with Machine and Deep Learning: A Forward-Looking Early-Warning Framework for U.S. Listed Firms. Advances in Economics, Management and Political Sciences, 303(1), None–None. https://doi.org/10.54254/2754-1169/2026.ld37780", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "米S&P1500の1,133社の四半期財務データで、信用リスクのスコア予測にXGBoostとLSTM系の深層学習を比べ、時系列を扱うLSTMがテストで最良だったことを示した研究。", "p3": "2010〜2025年の72,960企業四半期について、修正アルトマンZ'スコアからリスクのラベルを作り、16の財務変数を比率に変換して、XGBoost・LSTM・BiLSTM・CNN-LSTMをグリッド探索で調整して比べた（抄録）。", "p5": "XGBoostは学習データでR²=0.8904と最良だが、テストで大きく下がった。LSTMはテストでR²=0.8073、RMSE=0.2105と最良だった。2026年第1〜3四半期の予測も示した（抄録）。", "fun": "学習用の問題では満点近いのに本番で点が落ちる「丸暗記型」と、時間の流れをつかんで本番に強い「理解型」の違いが、企業の倒産リスク予測でも現れた、という結果です。ただし正解ラベル自体がZスコアから作られている点には注意が要ります。", "unverified": "ラベルがZ'スコア由来で実際の倒産ではない点の影響は未確認。"}}, {"id": "jr22", "rank": 22, "headline": "粗い礫床で細粒土砂が侵食される流れの条件", "title": "Near-bed hydrodynamics controlling fine-sediment erosion over immobile coarse-grained beds", "url": "https://doi.org/10.1017/jfm.2026.12053", "authors": "Michele Trevisson ほか", "venue": "Journal of Fluid Mechanics", "date": "2026-10-21", "sjr": 1.283, "citescore": 6.8, "citescore_year": "2025", "apa": "Trevisson, M., & Eiff, O. (2026). Near-bed hydrodynamics controlling fine-sediment erosion over immobile coarse-grained beds. Journal of Fluid Mechanics, 1045. https://doi.org/10.1017/jfm.2026.12053", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "動かない粗い礫の間から細かい土砂が侵食される4つの段階を、礫の突出度ごとの底面近傍の流れの構造と初めて直接結びつけた実験研究。", "p3": "2層に並べた球の間から細粒土砂が侵食される水路実験で、床の地形、掃流砂、礫群内の流れを同時に計測した（抄録）。", "p5": "突出度P<0.2では形状抵抗で侵食が減り、0.2〜0.4ではせん断層の掃き込みが床に届いて侵食が増え、0.4〜0.8では背後の上昇流がせん断層を妨げて減り、0.8超ではすべり流れが床を覆って遮蔽した（抄録）。", "fun": "砂利の川底に入り込んだ細かい砂は、砂利がどれだけ顔を出しているかで、流されやすくなったり守られたりを交互に繰り返します。その切り替わりの理由を、水の渦の動きを直接測って説明した点が面白いところです。", "unverified": "流速条件など実験の詳細は未確認。"}}, {"id": "jr23", "rank": 23, "headline": "他人を助ける時間は年齢で幸福への効き方が違う", "title": "Spending time helping others and well-being of givers: Age differences in immediate and long-term effects on well-being", "url": "https://doi.org/10.1093/geronb/gbag210", "authors": "Kyoungmin Cho ほか", "venue": "Journals of Gerontology - Series B Psychological Sciences and Social Sciences", "date": "2026-10-20", "sjr": 1.503, "citescore": 6.8, "citescore_year": "2025", "apa": "Cho, K., Charles, S. T., Almeida, D. M., & Lee, S. (2026). Spending time helping others and well-being of givers: Age differences in immediate and long-term effects on well-being. The Journals of Gerontology, Series B: Psychological Sciences and Social Sciences. https://doi.org/10.1093/geronb/gbag210", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "他人を助ける時間は、その日には良い気分と悪い気分の両方を増やすが、月単位では生きがい型の幸福を高め、その効果は高齢者で強いことを示した研究。", "p3": "米国のMIDUS 3（865人）とMIDUS Refresher 1（612人）の本調査と日記調査で、日・月単位の援助時間と、快楽的・エウダイモニア的な幸福の関係と年齢差を分析した（抄録）。", "p5": "日単位では援助の多い日に負の感情と正の感情の両方が高く、若年・中年で負の感情が多かった。月単位では社会的・心理的な幸福が高く、Refresher 1では高齢者で関連が強かった（抄録）。", "fun": "人を手伝うと、その日は疲れるけれど、長い目で見ると「生きがい」が増える――短期と長期で効き方が違う、という結果です。しかも年を重ねるほど、手伝うことの負担が減り得るものが増えるらしい、という点が興味深いところです。", "unverified": "効果の大きさは抄録になく未確認。"}}, {"id": "jr24", "rank": 24, "headline": "OSMとFoursquareの施設分類を対応づける基盤", "title": "An openly available OpenStreetMap-to-Foursquare category benchmark for points of interest", "url": "https://doi.org/10.1038/s41597-026-08476-6", "authors": "Lilou Soulas ほか", "venue": "Scientific Data", "date": "2026-10-21", "sjr": 1.907, "citescore": 9.6, "citescore_year": "2025", "apa": "Soulas, L., Lucchini, L., Napolitano, M., Bontorin, S., Centellegher, S., Lepri, B., Gallotti, R., & Andreotti, E. (2026). An openly available OpenStreetMap-to-Foursquare category benchmark for points of interest. Scientific Data. https://doi.org/10.1038/s41597-026-08476-6", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "OpenStreetMapの1,205のタグとFoursquareの施設カテゴリを人手で検証して対応づけた、公開のベンチマーク・データセットを作った研究。", "p3": "共同編集型のOSMのタグと階層型のFoursquareのカテゴリを、大分類から細分類まで対応づけて人手で検証し、テキスト埋め込みとLLMで自動的に対応を更新する手順とコードも公開した（抄録）。", "p5": "1,205のOSMタグをFoursquareのカテゴリ経路に結んだ高精度の参照資源を公開した。都市分析、移動研究、スマートシティに直接使えるとする（抄録）。", "fun": "地図のデータでは「カフェ」の分け方がサービスごとに違い、そのままでは混ぜて使えません。辞書の対応表を作るように両者をつなぐことで、都市の機能を同じものさしで比べられるようになる、地味ながら土台となる仕事です。", "unverified": "自動対応手順の精度は抄録になく未確認。"}}, {"id": "jr25", "rank": 25, "headline": "生成AIの使いこなしと不安が業務革新を左右", "title": "How GAI orchestration, GAI anxiety and GAI augmentation shapes digital task innovation", "url": "https://doi.org/10.1108/jeim-02-2026-0158", "authors": "Rsha Alghafes ほか", "venue": "Journal of Enterprise Information Management", "date": "2026-10-21", "sjr": 1.665, "citescore": 19.6, "citescore_year": "2025", "apa": "Alghafes, R., Wong, A., Alkhuzaim, L., & Kurucz, A. (2026). How GAI orchestration, GAI anxiety and GAI augmentation shapes digital task innovation. Journal of Enterprise Information Management, 1–18. https://doi.org/10.1108/jeim-02-2026-0158", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "組織が生成AIを統合・支援・業務に整合させる能力（GAIオーケストレーション）が、生成AIの不安を下げ拡張的な利用を高めることで、業務タスクの革新につながる二重経路を示した研究。", "p3": "GAIオーケストレーションを統合・支援・業務整合の多面的な変数として概念化し、不安と拡張の2経路で業務タスクの革新を説明するモデルを検定した（調査の規模・方法の詳細は抄録になし）。", "p5": "オーケストレーションは拡張と正、不安と負に関連し、不安は業務革新を下げ、拡張は高めた。二重経路の枠組みが支持された（抄録）。", "fun": "生成AIを入れるだけでは仕事は変わらず、社員の不安を和らげ「AIで仕事を広げる」使い方を組織が後押しして初めて革新につながる、という話です。道具より使わせ方が大事、という教訓です。", "unverified": "標本と分析方法は抄録になく未確認。"}}, {"id": "jr26", "rank": 26, "headline": "SNSエンゲージメントは言葉で測り直せる", "title": "Language and the measurement of social media engagement: a framework and research agenda", "url": "https://doi.org/10.1108/jrim-06-2026-0499", "authors": "Victor A. Barger", "venue": "Journal of Research in Interactive Marketing", "date": "2026-10-21", "sjr": 3.223, "citescore": 20.5, "citescore_year": "2025", "apa": "Barger, V. A. (2026). Language and the measurement of social media engagement: a framework and research agenda. Journal of Research in Interactive Marketing, 1–16. https://doi.org/10.1108/jrim-06-2026-0499", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "SNSのエンゲージメントを、いいね数のような行動の数ではなく言葉から測る方法を整理し、枠組みと研究課題を示した論文。", "p3": "自然言語処理やLLMを含む、テキストからエンゲージメントを測る研究を、認知・感情・行動の次元と消費者・企業の両側について整理した（抄録）。", "p5": "行動の数は関与の「行為」は捉えるが「中身」は捉えない。言語による測定で認知・感情の次元を回復でき、分析単位は孤立した投稿でなく「会話」だとした。5つの検証可能な命題を示した（抄録）。", "fun": "「いいね」が100件あっても、それが熱い応援なのか惰性なのかは数字だけでは分かりません。言葉の中身から関わり方を測り、しかも投稿1件ではなくやり取りの流れ全体を見よう、という提案がポイントです。", "unverified": "命題の内容の詳細は未確認。"}}, {"id": "jr27", "rank": 27, "headline": "伝達率のガウス過程回帰でボルトの緩みを検知", "title": "On the use of Gaussian Process Regression of transmissibility functions for loosening detection in bolted structures under excitation level variations", "url": "https://doi.org/10.1016/j.ymssp.2026.114288", "authors": "Luccas Pereira Miguel ほか", "venue": "HAL (ART) Mechanical Systems and Signal Processing", "date": "2026-10-20", "citescore": 17.6, "citescore_year": "2025", "apa": "Miguel, L. P., Teloli, R., & da Silva, S. (2026). On the use of Gaussian Process Regression of transmissibility functions for loosening detection in bolted structures under excitation level variations. Mechanical Systems and Signal Processing, 253, 114288. https://doi.org/10.1016/j.ymssp.2026.114288", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "HALに登録された著者版の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "ボルト締結構造の緩みを、伝達率関数にガウス過程回帰をそのまま当てはめた基準モデルとの外れで検出し、加振レベルによる非線形の変化と区別する方法を示した研究。", "p3": "周波数領域の伝達率関数でガウス過程回帰の基準モデルを作り、外れを損傷指標にした。ソボル指数の大域感度分析で緩みに敏感な周波数帯を選び、入力レベルを加えた3次元の定式化で非線形の変化を捉えた（抄録）。", "p5": "適切な特徴選択により、緩みを確実に検出しつつ誤診断を最小にできたとする（定量的な数値は抄録になし）。", "fun": "揺らし方を強くすると構造の応答そのものが変わってしまうので、「壊れたから変わった」のか「強く揺らしたから変わった」のかを見分けるのが難しい問題です。揺れの強さも変数に入れて基準を作ることで、この2つを分けた点が工夫です。", "unverified": "検出率などの数値は未確認。"}}, {"id": "jr28", "rank": 28, "headline": "コンクリートに埋め込む超音波センサで長期監視", "title": "Integrated ultrasonic sensors for robust structural health monitoring of concrete structures", "url": "https://doi.org/10.1177/14759217261498039", "authors": "Zhanxian Zhou ほか", "venue": "Structural Health Monitoring", "date": "2026-10-21", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Zhou, Z., Ma, L., Li, X., Tong, H., Wang, J., & Sun, Z. (2026). Integrated ultrasonic sensors for robust structural health monitoring of concrete structures. Structural Health Monitoring. https://doi.org/10.1177/14759217261498039", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "コンクリートに埋め込む超音波センサに、音響整合・電磁シールド・前置増幅回路を一体化し、信号品質と耐ノイズ性を高めた研究。", "p3": "既に提案した音響整合型のスマート骨材をもとに、電磁シールド構造と基板上の前置増幅器を組み込み、音響伝達・電磁両立性・信号調整を同時に最適化した（抄録）。", "p5": "受信信号の強化、安定した耐干渉性、SN比の大幅な改善を実験で確かめ、超音波CTで内部欠陥を識別できることを示した（数値は抄録になし）。", "fun": "コンクリートの中に「耳」を埋め込んで内部の傷を聞き取る技術ですが、音がうまく伝わらない、電気の雑音が入る、信号が弱いという3つの悩みがありました。それを一つの部品でまとめて解決した点がこの研究の工夫です。", "unverified": "SN比の改善量は抄録になく未確認。"}}, {"id": "jr29", "rank": 29, "headline": "自動評価指標の妥当性は文脈で変わる", "title": "Silent evaluation reveals context-dependent validity of automated metrics for AI-generated clinical messages", "url": "https://doi.org/10.1038/s41746-026-03211-2", "authors": "Gavin Hui ほか", "venue": "npj Digital Medicine", "date": "2026-10-21", "sjr": 4.215, "citescore": 18.2, "citescore_year": "2025", "apa": "Hui, G., Prichard, L., Martin, T., Vangala, S., Khalili, J., Yoo, S. M., Woo, H. E., & Lukac, P. J. (2026). Silent evaluation reveals context-dependent validity of automated metrics for AI-generated clinical messages. Npj Digital Medicine. https://doi.org/10.1038/s41746-026-03211-2", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "患者メッセージへのAI下書きの段階的導入を利用し、BLEUやBERTScoreなどの自動評価指標は「編集の忠実さ」は測れても「人の独立した仕事に匹敵するか」は測れないことを示した研究。", "p3": "2023年9月〜2024年8月、プライマリケア医30人について、AI下書きを表示した群（21,073件）と、生成したが見せなかった群（45,127件）を比べ、自動指標と盲検の医師評価（有効性・誤解・害）の相関を調べた（抄録）。", "p5": "表示群では11%（2,264件）の下書きが採用され意味的一致が高く（BERTScore F1=0.93）、非表示群でも0.83。医師は人が書いた文を好んだ（4.24/5）。BERTScoreは表示群でだけ質の評価と相関した（抄録）。", "fun": "AIの文章を「人の文章とどれだけ似ているか」で採点すると、人がAIの下書きを手直しした場合は似ていて当然です。見せなかった下書きと比べるという自然な実験で、指標の意味が状況によって変わることをあぶり出した点が見事です。", "unverified": "医師評価の評定者数などは未確認。"}}, {"id": "jr30", "rank": 30, "headline": "AIの自律と利用者の主導権の釣り合い", "title": "Balancing Artificial Intelligence Autonomy and User Control: Threat‐Contingent Appraisal Pathways to Consumer Responses", "url": "https://doi.org/10.1002/mar.70283", "authors": "Hyeyeon Yuk ほか", "venue": "Psychology and Marketing", "date": "2026-10-21", "sjr": 3.642, "citescore": 17.7, "citescore_year": "2025", "apa": "Yuk, H., Kim, M., Cheah, J.-H., & Garrett, T. C. (2026). Balancing Artificial Intelligence Autonomy and User Control: Threat‐Contingent Appraisal Pathways to Consumer Responses. Psychology & Marketing. https://doi.org/10.1002/mar.70283", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "AI製品の自律性への消費者の反応は、技術を脅威と感じるかで経路が変わり、脅威が高いときは利用者の主導権が残っていることが鍵になることを示した研究。", "p3": "技術脅威回避理論とリスク-便益評価に基づき、質的研究1つと実験3つで、AIの自律性と利用者の統制が、知覚された脅威の高低の下で消費者反応にどう効くかを調べた（抄録）。", "p5": "脅威が高いと、統制が高いときに限り自律性が高いほど知覚リスクが下がった。脅威が低いと、自律性は相対的な便益を高めて好意的な反応を促した。製品選択、情報探索、試乗、支払意思額でも確かめた（抄録）。", "fun": "自動運転のように「怖い」技術では、AIに任せる範囲が広くても、いざという時に自分が操作できると分かれば安心できる。怖くない技術なら、全部任せる便利さが素直に喜ばれる――同じ自律性でも受け止め方が正反対になるのが面白いところです。", "unverified": "実験の標本数は抄録になく未確認。"}}, {"id": "jr31", "rank": 31, "headline": "在宅介護者が遠隔見守りを受け入れる条件", "title": "Integrating Perceived Psychosocial Outcomes Into the Assessment of Telecare Acceptability Among Slovenian Informal Caregivers of Older People: Cross-Sectional Survey Study", "url": "https://doi.org/10.2196/85534", "authors": "Vesna Dolničar ほか", "venue": "JMIR Aging", "date": "2026-10-21", "sjr": 1.245, "citescore": 6.4, "citescore_year": "2025", "apa": "Dolničar, V., Berzelak, N., Taipale, S., & Hvalič-Touzery, S. (2026). Integrating Perceived Psychosocial Outcomes Into the Assessment of Telecare Acceptability Among Slovenian Informal Caregivers of Older People: Cross-Sectional Survey Study. JMIR Aging, 9, e85534–e85534. https://doi.org/10.2196/85534", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "スロベニアの高齢者の家族介護者526人で、遠隔見守り（テレケア）を使いたい意図は、機能面よりも安心感やつながりといった心理社会的な成果の見込みと最も強く結びつくことを示した研究。", "p3": "2021年の調査データ（612人中、支援機器の利用経験者を除いた558人、完全データ526人）で、UTAUTモデルに心理社会的成果（安心、不安の軽減、安全感、つながり）を加えた入れ子の回帰を行った（抄録）。", "p5": "背景変数だけではR²=0.03、UTAUTを加えると0.49、心理社会的成果を加えると0.54となり、その係数が最大（β=0.41）。成果期待の係数は大きく下がった（抄録）。", "fun": "介護する家族が見守り機器を使いたいかどうかは、「便利そうか」より「安心できそうか」で決まる、という結果です。技術の受け入れを説明する定番モデルに、気持ちの面を足すと説明力が上がるのは、人が道具に求めるものを考えさせます。", "unverified": "利用前の意図であり、実際の利用につながるかは未確認（著者明記）。"}}, {"id": "jr32", "rank": 32, "headline": "不完全な観測から確率的な拡散動態を推定", "title": "Inferring stochastic dynamics from incomplete observations of network spreading processes", "url": "https://doi.org/10.1063/5.0357283", "authors": "Wenye Peng ほか", "venue": "Chaos: An Interdisciplinary Journal of Nonlinear Science", "date": "2026-10-21", "citescore": 5.1, "citescore_year": "2025", "apa": "Peng, W., Wang, H., Murdoch Moore, J., Ru, X., Yang, H., Gu, C., & Small, M. (2026). Inferring stochastic dynamics from incomplete observations of network spreading processes. Chaos: An Interdisciplinary Journal of Nonlinear Science, 36(10). https://doi.org/10.1063/5.0357283", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "接触ネットワークの一部と一部の人の感染状態しか観測できないときに、感染・回復の確率を推定する手法（GTA）を作り、推定精度がネットワー
