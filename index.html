ical dynamics. Continuum Mechanics and Thermodynamics, 38(6). https://doi.org/10.1007/s00161-026-01542-9", "theme": "確率動力学・計算力学", "theme_no": 8}, {"id": "jr10", "rank": 10, "headline": "二粒径の粒状流で縞状の分級が生じる仕組みを理論化", "title": "Transversely segregated longitudinal stripes in bidisperse granular flows", "url": "https://doi.org/10.1017/jfm.2026.12176", "authors": "Amber P. Pearse ほか", "venue": "Journal of Fluid Mechanics", "date": "2026-11-06", "sjr": 1.283, "citescore": 6.8, "citescore_year": "2025", "apa": "Pearse, A. P., Johnson, C. G., & Gray, J. M. N. T. (2026). Transversely segregated longitudinal stripes in bidisperse granular flows. Journal of Fluid Mechanics, 1046. https://doi.org/10.1017/jfm.2026.12176", "theme": "確率動力学・計算力学", "theme_no": 8}, {"id": "jr11", "rank": 11, "headline": "政治的議論の分類でLLMと人の一致は中程度", "title": "Explaining alignment between LLM classifications of political arguments and human judgments", "url": "https://doi.org/10.1007/s10791-026-10793-8", "authors": "Maud Reveilhac ほか", "venue": "Discover Computing", "date": "2026-11-05", "citescore": 2.0, "citescore_year": "2025", "apa": "Reveilhac, M., & Trembovelskyi, B. (2026). Explaining alignment between LLM classifications of political arguments and human judgments. Discover Computing, 29(1). https://doi.org/10.1007/s10791-026-10793-8", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"id": "jr12", "rank": 12, "headline": "気候対応の報道の論調が翌年の売上と企業価値に関連", "title": "Investigating Associations Between Media Sentiment Surrounding Climate Change Engagement (SDG 13) and Performance Measures: A Study of FTSE 100 Listed Firms", "url": "https://doi.org/10.1002/bse.71807", "authors": "Liane W. Y. Lee ほか", "venue": "Business Strategy and the Environment", "date": "2026-11-06", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2}, {"id": "jr13", "rank": 13, "headline": "AI生成広告は真正性の低いブランドで購買意図を高める", "title": "The AI trust paradox: how disclosure, brand authenticity and consumer mindset shape communication effectiveness", "url": "https://doi.org/10.1108/intr-12-2025-2025", "authors": "George Chung-Chi Shen ほか", "venue": "Internet Research", "date": "2026-11-06", "sjr": 2.207, "citescore": 14.8, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3}, {"id": "jr14", "rank": 14, "headline": "高齢者にやさしい環境づくりの証拠を網羅した地図", "title": "Mega-Map of Systematic Reviews and Evidence and Gap Maps on Interventions and Programs for Age-Friendly Environments", "url": "https://doi.org/10.1177/18911803261496874", "authors": "Amanda Fernandes ほか", "venue": "Campbell Systematic Reviews", "date": "2026-11-06", "sjr": 2.46, "citescore": 14.0, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4}, {"id": "jr15", "rank": 15, "headline": "地震計の列で土石流から高濃度流への遷移を捉えた", "title": "Seismic Evidence of the Transition from Debris Flow to Hyperconcentrated Flow at Mount Rainier, USA", "url": "https://doi.org/10.1785/0220260021", "authors": "Katherine M. Biegel ほか", "venue": "Seismological Research Letters", "date": "2026-11-06", "citescore": 6.0, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8}, {"id": "jr16", "rank": 16, "headline": "移住者の不動産投資がパキスタンの都市を広げる", "title": "EMIGRE CITY ‐ MAKING : The Micropolitics of Diasporic Real Estate Investment and Urban Growth in Pakistan", "url": "https://doi.org/10.1111/1468-2427.70156", "authors": "Fatima Tassadiq", "venue": "International Journal of Urban and Regional Research", "date": "2026-11-06", "sjr": 1.104, "citescore": 4.7, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "International Journal of Urban and Regional Researchの抄録を使用", "preprint": false, "short": true, "p1": "パキスタンの事例から、海外移住したエリート層の送金が、帰国用の家づくりから都市の不動産への投機的な投資に向かい、都市化と土地の金融化を生む過程（移住者による都市づくり）を描いた（抄録）。", "p3": "移住の経路と送金の実践が出身国の都市景観をどう変えるかを、不動産部門の新自由主義化と移住者の投資行動の変化の重なりから分析した（抄録）。調査の手法の詳細は抄録に記載がない。", "p5": "投資の多くは予約販売の段階で行われ、北大西洋諸国への定住を支える多拠点の戦略の一部であり、軍とその関係者が主導する開発で空き地の市場をつくり、低密度の郊外のゲーテッド・コミュニティによる都市化を進めていた（抄録）。", "fun": "外国で働く人が故郷に送るお金は、昔は「いつか帰る家」を建てるために使われていました。ところがパキスタンでは、そのお金が値上がりを狙った土地の購入に回り、人の住まない区画が郊外に広がっています。遠く離れた国からの送金が故郷の街の形を変えていく仕組みが見える点が面白いところです。", "unverified": "調査の方法とデータ（聞き取りの規模など）は抄録では未確認。"}}, {"id": "jr17", "rank": 17, "headline": "中年期の低資産による抑うつの不利は米国で最大", "title": "Psychological costs of low wealth in midlife: Lower socioeconomic status carries greater disadvantage for depressive symptoms in the United States than Europe and China", "url": "https://doi.org/10.1093/geronb/gbag215", "authors": "Jonathan L Chia ほか", "venue": "Journals of Gerontology - Series B Psychological Sciences and Social Sciences", "date": "2026-11-05", "sjr": 1.503, "citescore": 6.8, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Journals of Gerontology Series Bの抄録を使用", "preprint": false, "short": true, "p1": "16か国の調和した縦断データ（1992〜2022年）で、中年期（45〜65歳）の抑うつ症状の軌跡を資産の4階層で比べ、低資産の不利が米国で最も大きいことを示した（抄録）。", "p3": "米国、欧州各国、イスラエル、韓国、中国の16か国のデータで、資産の百分位による4階層（下位15%、16〜45%、46〜75%、76〜100%）ごとに抑うつ症状の軌跡をモデル化した（抄録）。", "p5": "米国の中年は多くの国より抑うつ症状が高く、その差は低い社会経済的地位の層で最も大きかった。多くの国で後の世代ほど症状が多く、上位中間層で増加が最大だった。低い層ほど軌跡のばらつきが大きかった（抄録）。", "fun": "お金が少ないと心の健康が損なわれやすいことは知られていますが、その影響の大きさは国によって違いました。16か国の30年分のデータから、同じ「低資産」でも米国では抑うつの不利が特に大きいことが分かりました。個人の努力だけでなく社会の仕組みが心の健康の格差を左右していることが見える点が面白いところです。", "unverified": "国ごとの差の具体的な大きさは抄録では未確認。"}}, {"id": "jr18", "rank": 18, "headline": "AI変革期の組織学習は革新を促し燃え尽きを減らす", "title": "Fueling innovation and mitigating burnout: the dual impact of organizational learning in AI-enabled change", "url": "https://doi.org/10.1108/jocm-05-2026-0509", "authors": "Yue Yang ほか", "venue": "Journal of Organizational Change Management", "date": "2026-11-05", "citescore": 7.4, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Journal of Organizational Change Managementの抄録（OpenAlex経由）を使用", "preprint": false, "short": true, "p1": "AIによる職場の変化の中で、組織学習が従業員の革新的行動を、吸収能力を高める経路と燃え尽きを減らす経路の2つで支えることを示した（抄録）。", "p3": "資源保存理論と社会的交換理論に基づく二重経路の調整媒介モデルを、AIに関わる変化を経験する中国企業の従業員373人の2時点の調査で、ブートストラップによる条件付き間接効果などで検証した（抄録）。", "p5": "組織学習は吸収能力の向上と燃え尽きの低下を通じて革新的行動を促し、知識共有と従業員とAIの協働がこれらの経路を強めた。AIとの協働は、燃え尽きが革新的行動を下げる関係も和らげた（抄録）。", "fun": "職場にAIが入ってくると、新しいことを学ぶ機会が増える一方で、ついていけずに疲れ切ってしまう人も出てきます。この研究は、会社ぐるみで学ぶ仕組みがあると、知識が増える道と疲れが減る道の両方から社員の工夫を引き出せることを示しました。学びが意欲と心の余裕の両方に効くという点が面白いところです。", "unverified": "効果の大きさの数値は抄録では未確認。"}}, {"id": "jr19", "rank": 19, "headline": "ESG評価が高い企業ほど監査報酬は低い", "title": "ESG Performance and Audit Quality: Bidirectional Relationship and the Moderator Role of Gender Diversity in an International Context", "url": "https://doi.org/10.1002/csr.71150", "authors": "Azhaar Lajmi ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-11-06", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Corporate Social Responsibility and Environmental Managementの抄録を使用", "preprint": false, "short": true, "p1": "国際的な3,630企業年のデータで、ESG評価と監査品質（監査報酬・監査意見）の双方向の関係と、取締役会の女性比率の調整効果を推定した（抄録）。", "p3": "2017〜2022年の国際的な標本でシステムGMMと一般化構造方程式モデルを推定し、監査品質を監査報酬と監査意見で測った（抄録）。", "p5": "ESG評価は監査報酬と負に関連し、逆向きの関係は有意でなかった。監査意見との関係は全体では見られず、低ESG企業で正、高ESG企業で負だった。女性比率が高いほど監査報酬との負の関連は弱まった（抄録）。", "fun": "環境や社会への配慮で評価の高い会社は、会計の監査でも「手のかからない会社」と見なされるのでしょうか。この研究は、ESGの評価が高いほど監査の報酬が低い傾向を見つけました。さらに、取締役に女性が多いとその傾向が弱まるという意外な結果も出ています。お金以外の評判が監査の費用に表れる点が面白いところです。", "unverified": "効果の大きさと対象国の内訳は抄録では未確認。"}}, {"id": "jr20", "rank": 20, "headline": "旅行推薦AIの透明性が信頼と受容を最も高める", "title": "Disentangling fairness, accountability and transparency in AI travel recommendations: the role of algorithm trust across hedonic and utilitarian contexts", "url": "https://doi.org/10.1108/jhtt-04-2026-0462", "authors": "Jung-Eun Bae ほか", "venue": "Journal of Hospitality and Tourism Technology", "date": "2026-11-06", "sjr": 1.785, "citescore": 13.8, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Journal of Hospitality and Tourism Technologyの抄録を使用", "preprint": false, "short": true, "p1": "旅行の推薦AIについて、公正・説明責任・透明性（FAT）の知覚がアルゴリズムへの信頼と推薦の受容・抵抗にどう効くかを示し、透明性の効果が最も大きいことを明らかにした（抄録）。", "p3": "旅行関連のオンライン・コミュニティで集めた韓国の成人355人のシナリオ型の調査を、構造方程式モデルと、快楽的・実用的な旅行商品の多母集団分析で検証した（抄録）。", "p5": "FATの3次元はいずれも信頼を高め、透明性、説明責任、公正の順に効果が大きかった。信頼は受容を高め抵抗を下げた。説明責任は実用的な条件でのみ信頼に効いた（抄録）。", "fun": "旅行サイトのAIが「このホテルがおすすめ」と言うとき、理由が分からないと私たちは不安になります。この研究は、AIの公正さ・責任の所在・透明さのうち、信頼を最も高めるのは「なぜ勧めたかが見えること」だと示しました。利用者は公正さを自分では確かめられないので外部の点検が必要だ、という指摘も面白いところです。", "unverified": "自己申告の横断データで、因果関係は確かめられないと著者が記載（抄録）。"}}, {"id": "jr21", "rank": 21, "headline": "若いサービス労働者は向上心に罪悪感を抱く", "title": "Inside the service work ecosystem: a lived account of young workers", "url": "https://doi.org/10.1108/josm-08-2025-0374", "authors": "Maria Golubovskaya ほか", "venue": "Journal of Service Management", "date": "2026-11-06", "sjr": 3.759, "citescore": 24.1, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Journal of Service Managementの抄録を使用", "preprint": false, "short": true, "p1": "タイ・ミャンマー・カンボジア・ラオス出身の若い現場のサービス労働者の視点から、サービス労働の生態系が機会ではなく制約の場として経験されていることを示した（抄録）。", "p3": "18〜26歳の80人によるレゴ・シリアスプレイの5回のワークショップで得た視覚・語り・観察のデータを、働くことの心理学理論（PWT）を手がかりに反復的に分析した（抄録）。", "p5": "生存・社会的つながり・自己決定の欲求は、マクロの力、組織の慣行、人間関係を通じて持続的に損なわれていた。自己決定を求めることには「向上心への罪悪感」という代償があり、それを切り抜けること自体が見えない無償の労働になっていた（抄録）。", "fun": "お店やホテルで働く若者にとって、仕事は上を目指す階段のはずです。ところがこの研究で、東南アジアの若い働き手たちはレゴで自分の職場を形にしながら、上を目指すことに罪悪感を抱いていると語りました。笑顔の接客の裏で、目に見えない気苦労が品質の土台を削っているという指摘が興味深いところです。", "unverified": "国や業種による違いの分析の有無は抄録では未確認。"}}, {"id": "jr22", "rank": 22, "headline": "配偶者と同居する高齢者が最もよく老いる", "title": "Marital Status, Living Arrangement, and Aging Well in China", "url": "https://doi.org/10.1177/08982643261502737", "authors": "Linghan Ge ほか", "venue": "Journal of Aging and Health", "date": "2026-11-06", "sjr": 1.146, "citescore": 5.4, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Journal of Aging and Healthの抄録を使用", "preprint": false, "short": true, "p1": "中国の50歳以上で、婚姻状態と居住形態の5類型ごとに多次元の「よい老い」の指標を比べ、配偶者と同居する人が最もよく、独居の未婚者が最も不利という序列を示した（抄録）。", "p3": "中国家族パネル調査（CFPS）で、生理・機能・認知・心理・主観の5次元からなる指標を作り、婚姻と居住の5類型と社会人口学的な要因による違いを分析した（抄録）。", "p5": "配偶者と同居する既婚者が最もよく、独居の未婚者が最も困難で、別居の既婚者など非伝統的な形態でも特に主観的な幸福で困難が見られた。差は75歳以上、退職者、都市住民、健康的な生活習慣の人で小さかった（抄録）。", "fun": "年を取ってからの暮らしやすさは、結婚しているかだけでなく、誰と住んでいるかでも変わります。中国の大規模な調査から、夫婦で同居する人が最も健やかに老い、結婚していても離れて住む人は心の満足度で苦労していることが分かりました。家族の形の多様化が高齢期の幸福に影響する点が興味深いところです。", "unverified": "各類型の差の大きさと因果の向きは抄録では未確認。"}}, {"id": "jr23", "rank": 23, "headline": "ワンストップの便利さは高価格でも全員を得にしうる", "title": "Channel Structure and Consumer Search: Competition Between Store and National Brands", "url": "https://doi.org/10.1002/nav.70109", "authors": "Weiqian Lu ほか", "venue": "Naval Research Logistics", "date": "2026-11-06", "sjr": 1.204, "citescore": 4.5, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Naval Research Logisticsの抄録を使用", "preprint": false, "short": true, "p1": "小売業者が自社ブランドで全国ブランドと競いながらも同じ売り場に置き続ける理由を、消費者の探索とワンストップの買い物の便利さから説明する探索モデルを示した（抄録）。", "p3": "別々に売る形式を基準に、卸売形式と代理販売形式が価格競争と消費者の探索をどう変えるかを、自社ブランドの持ち主を兼ねる小売業者と全国ブランドの持ち主の競争として分析した（抄録）。", "p5": "卸売・代理販売の形式は価格競争を和らげて価格を上げた。探索コストが一定以上だと、高い価格と高い消費者余剰が共存し、両ブランドの利益、消費者余剰、社会的厚生がそろって改善した（抄録）。", "fun": "スーパーは利益の大きい自社ブランドだけを並べればよさそうなのに、なぜ有名メーカーの商品も置くのでしょう。この研究は、一か所で何でもそろう便利さが客を呼ぶので、値段が少し高くなっても、客も店もメーカーも皆が得をする場合があることを示しました。高い値段なのに客も得をするという逆説が面白いところです。", "unverified": "実データでの検証は抄録では未確認（理論モデル）。"}}, {"id": "jr24", "rank": 24, "headline": "利他的な動機が満たされるボランティアほど幸福", "title": "Volunteer Motivation Fulfillment and Well-Being", "url": "https://doi.org/10.1177/08997640261495463", "authors": "Arthur A. Stukas ほか", "venue": "Nonprofit and Voluntary Sector Quarterly", "date": "2026-11-06", "sjr": 1.285, "citescore": 6.9, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Nonprofit and Voluntary Sector Quarterlyの抄録を使用", "preprint": false, "short": true, "p1": "ボランティアにとって重要な利他的な動機が満たされるほど、のちの幸福が高いことを、2時点の調査で示した（抄録）。", "p3": "英語圏のProlificに登録する現役ボランティア406人に3か月の間隔で調査し、1回目に動機・性格・4種類の幸福を、2回目に動機の充足と幸福を測った（抄録）。", "p5": "重要な他者志向の動機の充足は、自己志向の動機の充足より2回目の幸福と強く正に関連し、性格とおおむね1回目の幸福を統制しても結果は残った（抄録）。", "fun": "ボランティアをする人は幸せそうに見えますが、それが「活動したから」なのか「もともと幸せな人が活動するから」なのかは分かりにくい問題です。この研究は、3か月の間をあけた調査で、人の役に立ちたいという思いが満たされた人ほど、後で幸福度が高いことを示しました。人のための思いが報われることが幸せにつながる点が面白いところです。", "unverified": "効果の大きさと、4種類の幸福ごとの違いは抄録では未確認。"}}, {"id": "jr25", "rank": 25, "headline": "成果報告の監査義務化で慈善団体は数値に偏った", "title": "Mandatory Service Performance Reporting and Audit: Responses from Charities", "url": "https://doi.org/10.1177/08997640261495473", "authors": "Cherrie Yang ほか", "venue": "Nonprofit and Voluntary Sector Quarterly", "date": "2026-11-06", "sjr": 1.285, "citescore": 6.9, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Nonprofit and Voluntary Sector Quarterlyの抄録を使用", "preprint": false, "short": true, "p1": "ニュージーランドの大規模な慈善団体で、サービスの成果の報告と外部監査が義務化されたときの対応を分析し、形式上の遵守は進んだが、監査済みの報告は検証しやすい数値の産出に偏ったことを示した（抄録）。", "p3": "大規模慈善団体の報告書120件の文書分析と、作成者・監査人への面接を、脱連結（デカップリング）理論で分析した（抄録）。", "p5": "監査済みの報告は検証可能な量的な産出が中心で、質的な成果・影響の情報は少なかった。監査は報告の手順を強めたが、量的情報への依存を促して質的情報を任意の報告に移し、手段と目的の緊張を生んだ（抄録）。", "fun": "寄付で動く団体に「成果を報告し、監査も受けなさい」と義務づけると、報告はきちんとなりそうです。ところがこの研究では、監査で確かめやすい「何人に配ったか」のような数字ばかりが並び、「暮らしがどう変わったか」という大事な話は脇に追いやられました。測りやすいものが重視されてしまう落とし穴が見える点が面白いところです。", "unverified": "団体の規模や分野による違いは抄録では未確認。"}}, {"id": "jr26", "rank": 26, "headline": "微視の不均質をベイズ更新で巨視の破壊に橋渡し", "title": "Stochastics upscaling in multiscale mechanics and reduced model for fracture", "url": "https://doi.org/10.46223/hcmcoujs.acs.en.16.2.91.2026", "authors": "Adnan Ibrahimbegovic", "venue": "HCMCOU Journal of Science - Advances in Computational Structures", "date": "2026-11-06", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "HCMCOU Journal of Scienceの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "微視的な材料の不均質の不確実性を巨視の破壊挙動に引き継ぐ「確率的アップスケーリング」の枠組みを示し、コンクリートで弾性と破壊のパラメータの事後分布の違いを明らかにした（抄録）。", "p3": "力学系のパラメータを確率変数や空間的に変わる確率場で表し、ベイズ更新で巨視のパラメータを推定し、ガウス–マルコフ–カルマンフィルタとマルコフ連鎖モンテカルロ法を比べた（抄録）。", "p5": "弾性パラメータの事後分布は均質化と整合するガウス分布だったが、非弾性のパラメータではガウス分布でなくなった。カルマン型のフィルタはMCMCと同等の推定をはるかに低い計算コストで与え、破壊パラメータでは微視の空間変動が巨視でも非正規の事後分布として残った（抄録）。", "fun": "コンクリートの中には小さな石や空洞がばらばらに混じっていて、同じように作っても割れ方は一つひとつ違います。この研究は、その小さなばらつきが大きな部材の割れやすさにどう受け継がれるかを、確率の計算で追いかけました。平均だけ見ていると消えてしまうばらつきの形が、割れ方では残り続けることを示した点が面白いところです。", "unverified": "計算コストの具体的な比較値と、検証に使った実験は抄録では未確認。"}}, {"id": "jr27", "rank": 27, "headline": "指定自転車ルートは致死率の高い幹線道路に偏る", "title": "Data-Driven Safety Screening for Smart-City Urban Bicycle-Route Networks", "url": "https://doi.org/10.3390/smartcities9110190", "authors": "Deo Chimba ほか", "venue": "Smart Cities", "date": "2026-11-06", "sjr": 1.193, "citescore": 13.0, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Smart Citiesの抄録を使用", "preprint": false, "short": true, "p1": "テネシー州の自転車事故6,930件を道路台帳と結合し、指定された自転車ルートで死亡事故の割合が高いのは、指定された道路が速く広い幹線道路であることによる条件付きの関連だと示した（抄録）。", "p3": "州の事故記録（2002〜2026年）と線形参照の道路台帳を結合し、郡でクラスタ化したロジットモデル、ゼロ切断負の二項モデル、経験ベイズの路線指標で分析した（抄録）。", "p5": "指定は死亡のオッズの高さと関連した（OR=1.697、95%CI 1.15–2.50）が、事故頻度とは有意に関連せず、交通量当たりの率は低かった。路線指標は、その後の死亡・重傷事故の37.6%を延長の10%以内でとらえた（抄録）。", "fun": "道路に「自転車ルート」の標識を立てても、車が速く走る大通りのままでは安全とは限りません。この研究は事故の記録と道路の台帳を突き合わせ、指定ルートで死亡事故の割合が高いのは、指定された道そのものが速くて広い幹線道路だからだと示しました。標識より道の作り方が大事だということをデータで示した点が面白いところです。", "unverified": "速度管理や分離の具体的な効果は抄録では未確認（提案にとどまる）。"}}, {"id": "jr28", "rank": 28, "headline": "ナイロビ近郊の小農は高騰した先祖の土地を売る", "title": "NEGATIVE ASSETS : Settler Colonialism, Speculative Urbanism, and the Moral Economy of Smallholding on Nairobi's Real Estate Frontier", "url": "https://doi.org/10.1111/1468-2427.70154", "authors": "Peter Lockwood ほか", "venue": "International Journal of Urban and Regional Research", "date": "2026-11-06", "sjr": 1.104, "citescore": 4.7, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "International Journal of Urban and Regional Researchの抄録を使用", "preprint": false, "short": true, "p1": "ナイロビ近郊で地価が急騰するなか、多くの小農の家族が都市の地主になる道を選ばず、禁忌に反して先祖伝来の土地を売っている理由を、入植者植民地主義の歴史から民族誌的に説明した（抄録）。", "p3": "土地の売却の民族誌的な事例をもとに、植民地期の土地改革が長期の商業的農業に向かない「負の資産」としての土地を持つ小農層を生んだ歴史と、不動産の最前線の到来を結び付けて分析した（抄録）。", "p5": "地価の上昇で土地の商品化はほぼ完了に近づき、わずかな区画は保持されずに売られていた。植民地期の土地改革と不動産の最前線の組み合わせが小農の道徳経済を崩し、先祖の土地を市場に押し出していると論じた（抄録）。", "fun": "土地の値段が急に上がったら、持ち続けて家賃収入を得るのが得に思えます。ところがナイロビ近郊の農家の多くは、売ってはいけないとされる先祖の土地を手放していました。この研究はその理由を植民地時代の土地改革にさかのぼり、もともと暮らしを支えるには小さすぎる「負の資産」だったからだと説明しました。歴史が今の選択を縛る様子が面白いところです。", "unverified": "売却の件数や価格のデータは抄録では未確認。"}}, {"id": "jr29", "rank": 29, "headline": "コンパクトな都市ほど工業の炭素排出が少ない", "title": "Carbon Emissions within Compact Cities: Evidence from China’s Urban Forms", "url": "https://doi.org/10.1061/jupddm.upeng-6850", "authors": "Qihang Li ほか", "venue": "Journal of Urban Planning and Development", "date": "2026-11-06", "citescore": 3.9, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Journal of Urban Planning and Developmentの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "中国の都市（2008〜2016年）で、空間の幾何に基づくコンパクトさの新しい指標を作り、都市がコンパクトなほど企業の工業炭素排出が少ないという因果効果を推定した（抄録）。", "p3": "ミクロの税務調査データと夜間光の画像を使い、都市形態のコンパクトさが企業単位のCO2排出に与える効果を分析し、産業集積・グリーン技術の普及・資源配分の3つの経路を調べた（抄録）。", "p5": "コンパクトさは工業の炭素排出を有意に減らし、産業集積、低炭素技術の普及、効率的な企業への生産要素の配分がその経路だった。デジタル基盤、ハイテク産業団地、スマートシティ政策が削減効果を強めた（抄録）。", "fun": "街がぎゅっとまとまっていると、移動の距離が短くなるだけでなく、工場どうしが資源を分け合ったり、新しい省エネ技術が広まりやすくなったりします。この研究は中国の税務データと夜の明かりの衛星画像を使い、コンパクトな街ほど工場の二酸化炭素の排出が少ないことを示しました。街の形と環境の関係を企業ごとのデータで確かめた点が面白いところです。", "unverified": "効果の大きさの数値と、因果を識別する方法の詳細は抄録では未確認。"}}, {"id": "jr30", "rank": 30, "headline": "北京は成長の制限を統治の手段にした", "title": "Limits on growth: Governing urban futures in Beijing", "url": "https://doi.org/10.1177/00420980261501380", "authors": "Yiqiu Liu", "venue": "Urban Studies", "date": "2026-11-06", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Urban Studiesの抄録を使用", "preprint": false, "short": true, "p1": "北京の2016〜2035年のマスタープランが、非本質的とされた機能と人口を取り除いて国家のための選別的な首都をつくる「成長の制限」を、中国の新しい統治の様式として理論化した（抄録）。", "p3": "1949年以降の計画文書の資料分析、専門家と民族誌的な面接、2017〜2023年の多地点の現地調査をもとに、ルフェーヴル的な時空間の枠組みで分析した（抄録）。", "p5": "歴史的な反大都市の志向が国家の再集権化の中で呼び起こされ、「大都市病」という診断が移転と緑化を治療として正当化し、官僚・村民・移民は先延ばし・投機・撤退で対応していた。成長の制限を、誰が残ることを許されるかを決める政治として捉え直した（抄録）。", "fun": "都市計画といえば、普通は街をどう大きくするかを考えます。ところが北京の計画は、人や機能を減らして首都を「選び抜く」ことを目指していました。この研究は、混雑を「病気」と呼ぶことで移転を「治療」として正当化する語り方に注目しました。成長を止める計画が、誰がそこに住み続けられるかという問題になるという視点が面白いところです。", "unverified": "移転の規模を示す数値は抄録では未確認。"}}, {"id": "jr31", "rank": 31, "headline": "円柱橋脚の内部欠陥を衝撃弾性波で見分ける", "title": "Field and Numerical Investigation of Impact-Echo Responses for Internal Defect Assessment in Cylindrical Concrete Bridge Piers", "url": "https://doi.org/10.3390/buildings16214435", "authors": "Le Ding ほか", "venue": "Buildings", "date": "2026-11-06", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Buildingsの抄録を使用", "preprint": false, "short": true, "p1": "円柱形のコンクリート橋脚で、衝撃弾性波（インパクトエコー）の周波数応答と内部欠陥の関係を、供用中の2橋の現地測定と3次元有限要素解析で調べた（抄録）。", "p3": "現地測定で卓越周波数と測定の再現性を確かめ、数値解析では大きさと位置の異なる空洞と、材料分離のような低剛性の領域を設定して、卓越周波数・波形の時間・透過特性への影響と、正規化した卓越周波数のずれの指標を調べた（抄録）。", "p5": "空洞は分離のような領域より強い透過の遮断と裏面応答の時間のずれを生んだが、周波数応答だけでは一意に区別できず、卓越周波数のずれの分布も重なった。現地測定は再現性があったが、単一周波数での解釈には限界があった（抄録）。", "fun": "橋の柱の中に空洞があるかどうかは、外から見ても分かりません。そこで、たたいて跳ね返る振動の高さ（周波数）から中を推測する方法があります。この研究は、丸い柱ではいろいろな跳ね返り方が重なり、空洞と材料のむらを周波数だけでは見分けにくいことを示しました。たたいて調べる点検の奥深さが見える点が面白いところです。", "unverified": "実際の欠陥を確かめた上での検証は今後の課題と著者が記載（抄録）。"}}, {"id": "jr32", "rank": 32, "headline": "洗掘対策の捨石が橋の地震時の挙動を変える", "title": "Seismic performance of bridges retrofitted with riprap for scour countermeasures", "url": "https://doi.org/10.1680/jbren.26.00010", "authors": "Md Ahsaan Hussain ほか", "venue": "Proceedings of the Institution of Civil Engineers - Bridge Engineering", "date": "2026-11-05", "citescore": 4.5, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "ICE Bridge Engineeringの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "洗掘対策として捨石（リップラップ）で補強した橋の地震時の性能を、地盤-捨石-基礎の連成解析で評価し、捨石が洗掘で増えた応答を元の水準近くに戻すことを示した（抄録）。", "p3": "代表的なRC橋の上部構造をSTAAD.Pro、下部構造をPlaxis 3Dで有限要素モデル化して連成させ、杭の載荷試験データで下部構造を検証し、元の状態・洗掘・捨石補強の3条件で20の地震波による時刻歴解析を行った（抄録）。", "p5": "洗掘は橋脚天端の正規化した変位の平均を元の状態より約15〜20%増やし、捨石はそれを洗掘前の水準近くまで戻した（抄録）。", "fun": "川に架かる橋は、洪水で橋脚のまわりの土が削られる「洗掘」に弱く、その対策として大きな石を敷き詰めます。この研究は、その石が地震のときにも役立つかを計算で確かめ、土が削られて大きくなった揺れをほぼ元どおりに抑えることを示しました。洪水対策が地震対策にもなるという一石二鳥の発見が面白いところです。", "unverified": "対象橋梁の諸元と地震波の選び方は抄録では未確認。"}}, {"id": "jr33", "rank": 33, "headline": "古タイヤのセルで重量貨物線の軌道変形を抑える", "title": "Performance of Tire Cell–Reinforced Tracks under Multistage Cyclic Loading: Full-Scale Testing and Numerical Modeling", "url": "https://doi.org/10.1061/jggefk.gteng-15374", "authors": "Fatima Mehmood ほか", "venue": "Journal of Geotechnical and Geoenvironmental Engineering - ASCE", "date": "2026-11-06", "sjr": 1.553, "citescore": 7.7, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Journal of Geotechnical and Geoenvironmental Engineeringの抄録を使用", "preprint": false, "short": true, "p1": "古いトラックのタイヤを粒状材で満たして並べたセルを道床の下の層に使うと、重量貨物の繰返し荷重のもとで軌道の変形が抑えられることを、実物大試験と有限要素解析で示した（抄録）。", "p3": "重量貨物鉄道の試験施設に実物大の試験軌道をつくり、軸重20〜35t、載荷周波数10・15Hz（列車速度50〜80km/hに相当）の多段階の繰返し荷重で沈下・横変位などを測り、有限要素モデルを試験結果で検証した（抄録）。", "p5": "タイヤセルの層は横変位を減らし、荷重を支える層の剛性を高めて軟らかい路盤に伝わる応力を減らした。最終段階の35t・15Hzでも大きな沈下は生じなかった（抄録）。", "fun": "線路の下には砂利（バラスト）が敷かれていますが、重い貨物列車が何度も通ると沈んだり横にずれたりします。この研究は、捨てられるはずの古タイヤに砂利を詰めて並べ、線路の下に敷くと変形がぐっと減ることを実物大の線路で確かめました。ごみを丈夫な土台に変える発想が面白いところです。", "unverified": "沈下量などの具体的な数値と長期の耐久性は抄録では未確認。"}}, {"id": "jr34", "rank": 34, "headline": "交通の多体情報から橋梁応答を予測する注意機構", "title": "Attention-based micro-to-macro mapping of multi-agent traffic information for bridge response prediction", "url": "https://doi.org/10.1016/j.aei.2026.105444", "authors": "Yuhao Zhang ほか", "venue": "Advanced Engineering Informatics", "date": "2026-11-06", "sjr": 2.021, "citescore": 15.8, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "Advanced Engineering Informaticsの題名のみ（抄録・本文は入手できず）", "preprint": false, "short": true, "p1": "題名からは、交通流の多数の車両の情報を、注意機構で個々の車両の水準から全体の水準へ対応づけ、橋梁の応答を予測する手法を提案した研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "橋の上をたくさんの車が走るとき、一台一台の位置や重さの情報から橋全体の揺れを予測するのは難しい問題です。題名からは、AIの「注意機構」を使って、個々の車の情報を橋全体の応答につなげようとする研究だと読み取れます。細かな車の情報から大きな橋の動きを当てるという問いが面白いところです。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jr35", "rank": 35, "headline": "リアルタイムGNSS補正の完全性を一貫して監視", "title": "Towards reliable GNSS PPP: end-to-end integrity monitoring of real-time orbit and clock corrections", "url": "https://doi.org/10.1007/s10291-026-02175-w", "authors": "Zhen Lyu ほか", "venue": "GPS Solutions", "date": "2026-11-06", "sjr": 1.451, "citescore": 8.6, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "GPS Solutionsの題名のみ（抄録・本文は入手できず）", "preprint": false, "short": true, "p1": "題名からは、リアルタイムのGNSS精密単独測位（PPP）で使う衛星の軌道と時計の補正情報について、端から端までの完全性を監視する方法を扱う研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "精密な衛星測位では、衛星の位置や時計のずれを補う情報がネットで配られます。その補正情報自体が間違っていたら、位置も大きく狂ってしまいます。題名からは、補正を作る所から使う所まで、誤りを見張り続ける仕組みを扱う研究だと読み取れます。見張りをどう見張るかという問いが面白いところです。", "unverified": "抄録・本文を入手できず、手法・データ・結果はすべて未確認。"}}, {"id": "jr36", "rank": 36, "headline": "臨床看護師の生成AIへの依存の水準と要因", "title": "Functional and existential dependence on large language models among clinical nurses and associated factors: a cross-sectional study", "url": "https://doi.org/10.1186/s12912-026-05640-6", "authors": "Xianming Ge ほか", "venue": "BMC Nursing", "date": "2026-11-06", "sjr": 1.368, "citescore": 5.3, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "BMC Nursingの抄録を使用", "preprint": false, "short": true, "p1": "中国の臨床看護師459人で、大規模言語モデルへの機能的・実存的な依存の水準と関連要因を調べ、利用頻度が高いほど依存が高く、関連の研修を受けた人ほど低いことを示した（抄録）。", "p3": "2026年8〜9月に3つの省級行政区の6病院で便宜抽出による横断調査を行い、構造化された質問紙のデータをt検定・分散分析・重回帰分析で分析した（抄録）。", "p5": "機能的・実存的な依存の得点の平均は35.42と27.18（1〜5の尺度の項目平均で3.94と3.02）だった。利用頻度は依存の高さと、研修の受講は低さと関連した。得点は問題のある依存の重症度や有病率を示すものではないと著者は注意している（抄録）。", "fun": "看護師がAIに調べものや記録を手伝ってもらうのは便利ですが、頼りすぎると自分で考える力が弱まる心配があります。この研究は、AIを使う回数が多い人ほど依存が強く、使い方の研修を受けた人ほど依存が弱いことを示しました。便利な道具を正しく使う練習が依存を防ぐ鍵になりそうだという点が面白いところです。", "unverified": "横断調査のため因果関係は未確認。便宜抽出の標本の代表性も未確認。"}}, {"id": "jr37", "rank": 37, "headline": "子どもは国民の条件で少数者の包摂の範囲を分ける", "title": "Who are we? Children's national and European identities and inclusion of minorities", "url": "https://doi.org/10.1111/bjso.70150", "authors": "Isabelle Nic Craith ほか", "venue": "British Journal of Social Psychology", "date": "2026-11-06", "sjr": 1.571, "citescore": 6.5, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "British Journal of Social Psychologyの抄録を使用", "preprint": false, "short": true, "p1": "アイルランドの10〜11歳の子どもたちが、国民と欧州のアイデンティティの中身をどう話し合い、それが少数者を集団に含めるかどうかをどう左右するかを明らかにした（抄録）。", "p3": "26人の子どもによる8つのフォーカスグループで対話的な活動を行い、その記録を再帰的主題分析で分析した（抄録）。", "p5": "子どもたちは国民と欧州のアイデンティティを場所と結びついた一体のものと見ていた。血統や出生など民族的な中身だけを本質とする子は包摂の道を狭く、市民権や参加など市民的な中身も認める子は広く捉えた。言語や文化などの典型的な中身は包摂の程度を左右した（抄録）。", "fun": "「アイルランド人とは誰か」という問いに、「生まれや血筋」と答える子もいれば、「国の一員として参加すること」と答える子もいました。この研究は、その答え方の違いが、移民の子を仲間に入れるかどうかの線引きにつながることを示しました。大人の議論と同じ分かれ道が子どもの会話にすでに現れている点が興味深いところです。", "unverified": "参加者は26人に限られ、一般化の範囲は抄録では未確認。"}}, {"id": "jr38", "rank": 38, "headline": "高齢の家族介護者向けの研修で対処行動が持続", "title": "Six-month follow-up and longitudinal analysis of an adapted Savvy Caregiver Program for older family caregivers of adults with intellectual disabilities", "url": "https://doi.org/10.1080/20473869.2026.2757743", "authors": "Michela Saretta ほか", "venue": "International Journal of Developmental Disabilities", "date": "2026-11-04", "citescore": 5.5, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "International Journal of Developmental Disabilitiesの抄録（OpenAlex経由）を使用", "preprint": false, "short": true, "p1": "知的障害のある成人を長年介護する60歳以上のイタリアの家族介護者に、介護者教育プログラムを合わせて実施し、助けを求める自信と問題に向き合う対処が高まることを予備的に示した（抄録）。", "p3": "非無作為の準実験で、103人のうち52人が6回のプログラムを受け、51人が通常の支援を受けた。介護の自己効力感、対処、負担、社会的支援、被介護者の自立を、開始時・直後・6か月後に測った（抄録）。", "p5": "介入群は一時的な休息（レスパイト）を求める自信が直後に高まったが6か月後には差がなく、問題焦点型の対処は6か月後も高かった。ほかの結果には差がなかった（抄録）。", "fun": "障害のある子どもを何十年も世話してきた親は、年を取っても「助けて」と言いにくいものです。この研究は、6回の講座で介護の工夫を学んだ高齢の親が、休みを取るために助けを求める自信を持てるようになったことを示しました。ただその効果は半年で薄れ、続けて支える仕組みが必要だという点も含めて考えさせられます。", "unverified": "無作為化していないため、効果の因果的な解釈は未確認。"}}, {"id": "jr39", "rank": 39, "headline": "地方の小規模銀行の貸倒引当金に利益平準化を検出", "title": "DETECTION OF EARNINGS MANAGEMENT PRACTICES THROUGH DISCRETIONARY LOAN LOSS PROVISIONS AT RURAL BANKS IN WEST JAVA, CENTRAL JAVA, AND EAST JAVA DURING THE SAK EP TRANSITION PERIOD (2023–2025)", "url": "https://doi.org/10.25105/mraai.v26i2.27081", "authors": "Muhammad Saepuloh Saepuloh ほか", "venue": "Media Riset Akuntansi Auditing & Informasi", "date": "2026-11-06", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Media Riset Akuntansi Auditing & Informasiの抄録（OpenAlex経由）を使用", "preprint": false, "short": true, "p1": "インドネシアの地方の小規模銀行（BPR）で、貸倒引当金の基準が規則型から判断型に移った時期に、裁量的な引当金による利益平準化が強まったことを示した（抄録）。", "p3": "西・中・東ジャワの556の通常型BPR（1,649銀行年）のパネルで、規則型の最後の2年と判断型の最初の1年（2023〜2025年）を一つの標本に含め、二段階の推定で裁量的な貸倒引当金を分析した（抄録）。", "p5": "引当前の利益は裁量的な引当金と正に関連し、利益平準化と整合した。この関連は規則型のもとでは弱く、判断型の初年度に大きく強まり、主に過大な引当による強い裁量を示す銀行の割合も増えた（抄録）。", "fun": "銀行は、貸したお金が返ってこない場合に備えて「引当金」を積みますが、その額にはある程度の裁量があります。この研究は、インドネシアの地方の小さな銀行で、ルールが決まった計算から担当者の判断に変わると、もうけの多い年に多めに積んで利益をならす動きが強まったことを示しました。ルールの書き方が会計の数字を動かす点が面白いところです。", "unverified": "裁量の強さの具体的な数値は抄録では未確認。"}}, {"id": "jr40", "rank": 40, "headline": "不安定な浸透を捉える高階方程式の数値解法", "title": "An implicit mixed finite element method for solving the Beljadid–Cueto-Felgueroso–Juanes–Richards equation modeling unstable infiltration in porous media", "url": "https://doi.org/10.1063/5.0349060", "authors": "Nour-Eddine Toutlini ほか", "venue": "Physics of Fluids", "date": "2026-11-06", "citescore": 5.4, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Physics of Fluidsの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "重力フィンガリングのような不安定な浸透を表せる、リチャーズ方程式を拡張した高階の偏微分方程式を、陰的な混合有限要素法とGPUで効率よく解く枠組みを示した（抄録）。", "p3": "毛管エネルギー密度を対称に拡張した自由エネルギーに基づく方程式を、時間2次の陰的混合有限要素法で離散化し、ピカール–ニュートン型の線形化を使い、自動微分などのライブラリでGPU上で計算した（抄録）。", "p5": "単一のGPUで、1次元では単一コアのCPUの最大55倍、2次元では多コアのCPUの最大50.4倍の高速化を得た。実験データとの比較で飽和度のオーバーシュートをよく捉え、2次元計算でフィンガリングの模様を再現した（抄録）。", "fun": "乾いた砂に水をまくと、水は均一にしみ込まず、指のような筋になって下に伸びることがあります。この「フィンガリング」は、普通の浸透の式では表せません。この研究は、それを表せる難しい式を、画像処理用のチップ（GPU）で最大50倍以上速く解けるようにしました。身近な水のしみ込み方の不思議を計算で再現した点が面白いところです。", "unverified": "3次元の計算や実際の土壌での検証は抄録では未確認。"}}, {"id": "jr41", "rank": 41, "headline": "デジタル解説が満足に効く経路は中国と米国で異なる", "title": "Performance and Content Cues in Digital Heritage Interpretation: A Cross-Country Comparison of the Digital Visitor Experience", "url": "https://doi.org/10.3390/heritage9110464", "authors": "Yuan Zhang ほか", "venue": "Heritage", "date": "2026-11-06", "sjr": 0.532, "citescore": 4.3, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Heritageの抄録を使用", "preprint": false, "short": true, "p1": "世界遺産でのデジタル解説が満足と推奨意図に与える効果を、システムの振る舞いの証拠（手続き的）と内容の主張の証拠（実質的）に分けて測り、その構成が中国と米国でほぼ正反対であることを示した（抄録）。", "p3": "中国の来訪者1,000人と米国の989人で、配置・計量・スカラーの不変性を確かめたうえで多母集団の構造方程式モデルを推定し、モンテカルロ区間で差を評価した（抄録）。", "p5": "満足への効果のうち手続き的な証拠が担う割合は中国で75%、米国で9%（米国では真正性の判断が支配的）で、満足から推奨意図への変換は中国の来訪者で約2倍強かった（抄録）。", "fun": "博物館や遺跡で使う解説アプリの満足度は、「アプリがさくさく動くか」と「書いてある内容が本物らしいか」の2つで決まります。この研究は、中国の来訪者は動きの良さを、米国の来訪者は内容の確かさを重視するという、ほぼ正反対の結果を示しました。同じ満足でも中身の組み立てが国で違うという点が面白いところです。", "unverified": "投資配分への示唆は検証済みの規則ではなく命題として示されている（抄録）。"}}, {"id": "jr42", "rank": 42, "headline": "社会的処方で農村高齢者の脆弱性を測り支える", "title": "Social innovation in longevity based on social prescribing: a conceptual and intervention model", "url": "https://doi.org/10.1108/jica-07-2025-0063", "authors": "Javier Castro-Spila ほか", "venue": "Journal of Integrated Care", "date": "2026-11-05", "citescore": 1.8, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Journal of Integrated Careの抄録（OpenAlex経由）を使用", "preprint": false, "short": true, "p1": "スペインとフランスの農村の高齢者を対象に、社会的処方と社会的イノベーションを結ぶ概念モデルと、社会的な脆弱性を測る道具を作った（抄録）。", "p3": "文献のレビューで社会的イノベーションのモデルを定め、それを社会的な脆弱性を測る道具に落とし込み、脆弱な状況にある高齢者34人と専門職14人に適用して、参加型の過程で妥当性を確かめた（抄録）。", "p5": "概念モデルと、脆弱性を測って地域の資源と担い手のネットワークを動かす道具の2つを得た。概念モデルの実証はまだで、2026年に始まる6つの試行で、無作為化も対照群もない前後比較により評価する予定とした（抄録）。", "fun": "薬の代わりに地域の活動や人との交流を勧める「社会的処方」という考え方があります。この研究は、人の少ない農村の高齢者のために、孤立の度合いを測る道具と、地域の人や資源をつなぐ仕組みを作りました。医療の外にある地域の力を「処方」するという発想が面白いところです。", "unverified": "概念モデルの実証は未実施と著者が記載（抄録）。"}}, {"id": "jr43", "rank": 43, "headline": "スイッチングコストは口コミと信頼の関係を強める", "title": "The Effect of Word of Mouth, Patient Experience, and Cooperation On Patient Trust, With Psychological Commitment As A Mediator and Switching Cost In Hospitals", "url": "https://doi.org/10.51601/ijersc.v7i5.1133", "authors": "Edmond Rukmana Wikanta ほか", "venue": "International Journal of Educational Research & Social Sciences", "date": "2026-11-06", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "International Journal of Educational Research & Social Sciencesの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "インドネシアの病院の外来患者で、口コミ・患者体験・協力関係が患者の信頼に与える影響と、心理的コミットメントの媒介、スイッチングコストの調整 タセットを作り、場面理解・空間知覚・動作計画などの軸で視覚言語モデルを評価するベンチマークを整えた。"}, {"id": "jn16", "rank": 16, "field": "機械学習", "headline": "フレアとCMEから陽子現象と磁気嵐を同時に予測", "title": "SOLACE: A Contrastive Learning Framework for Predicting Solar Proton Events and Geomagnetic Storms from Flare–Coronal Mass Ejection Events", "url": "https://doi.org/10.3847/1538-4365/aeb2db", "authors": "Shuainan Yan ほか", "venue": "Astrophysical Journal, Supplement Series", "date": "2026-11-06", "sjr": 3.269, "citescore": 13.7, "citescore_year": "2025", "why": "太陽の噴出ごとにフレアとCMEの特徴と後続の擾乱を記録したデータベースを作り、対照学習と特徴の相互作用のモデルで、陽子現象と磁気嵐の確率予測と過去事例の検索を行った。", "explain": {"basis": "抄録", "basis_note": "Astrophysical Journal Supplement Seriesの抄録を使用", "preprint": false, "short": true, "p1": "太陽の噴出ごとにフレアとコロナ質量放出（CME）の観測特徴と、その後の太陽陽子現象（SPE）と磁気嵐（GMS）の発生を記録したデータベースを作り、両方の擾乱を確率予測する枠組みSOLACEを示した（抄録）。", "p3": "噴出を標本の単位とし、対照学習と注意つきの因子分解機による特徴の相互作用のモデルを組み合わせ、過去の事例の検索と確率予測を行った（抄録）。", "p5": "SPEの予測でF1は0.734、誤報率0.287、AUC0.951、GMSではF1 0.733、誤報率0.311、AUC0.924だった。SPEはCMEの速度・角度幅などに、GMSはCMEの角度幅と発生源の位置に主に依存した（抄録）。", "fun": "太陽で大きな爆発が起きると、高エネルギーの粒子や磁気の嵐が地球に届き、人工衛星や通信、送電網に悪影響を与えることがあります。この研究は、一つの爆発から両方の嵐が起きるかをまとめて予測するAIを作りました。爆発の速さや広がりが予測の決め手になると分かった点も面白いところです。", "unverified": "予測の先行時間とデータベースの期間は抄録では未確認。"}}, {"id": "jn17", "rank": 17, "field": "機械学習", "headline": "能動学習で急速充電用の電解液添加剤を発見", "title": "Machine Learning-Driven Electrolyte Additive Discovery for Ultrafast Charging of Sodium Metal Batteries", "url": "https://doi.org/10.1021/jacs.6c10960", "authors": "Yuanchang Ye ほか", "venue": "Journal of the American Chemical Society", "date": "2026-11-06", "sjr": 5.491, "citescore": 22.0, "citescore_year": "2025", "why": "ガウス過程回帰による能動学習で添加剤の候補を絞り込み、微量の添加でナトリウム金属電池の界面を改善して、200Cでの5万回の安定な充放電を実現した。", "explain": {"basis": "抄録", "basis_note": "Journal of the American Chemical Societyの抄録を使用", "preprint": false, "short": true, "p1": "ガウス過程回帰による能動的な機械学習で電解液添加剤を探索し、微量（0.02M）のクロロジフルオロ酢酸ナトリウムが、ナトリウム金属電池の超急速充電を可能にする界面をつくることを見いだした（抄録）。", "p3": "鍵となる物理化学的な記述子を反復的に絞り込んで候補を選び、理論計算とその場観察で、添加剤がPF6⁻陰イオンの狙った分解を促してNaFに富む界面をつくる仕組みを調べた（抄録）。", "p5": "Na||Na3V2(PO4)3電池は200Cという極端な速さで5万回を超える安定な充放電を示し、正極の高い充填量や、負極のない構成などの厳しい条件でも性能を保った（抄録）。", "fun": "電池をとても速く充電しようとすると、電極の表面の膜が邪魔をして、電気を運ぶイオンが通りにくくなります。この研究はAIに候補を次々と提案させ、ほんのわずか加えるだけでイオンの通り道を整える添加剤を見つけました。5万回の充放電にも耐えたという結果と、AIが実験の道案内をした点が面白いところです。", "unverified": "能動学習で調べた候補の数と探索の効率は抄録では未確認。"}}, {"id": "jn18", "rank": 18, "field": "経営学", "headline": "スタートアップと大企業の協業を生む条件の組み合わせ", "title": "From Pitch to Partnership: Startup Engagement Strategies for Securing Corporate Interest", "url": "https://doi.org/10.1111/radm.70067", "authors": "Elie Saad ほか", "venue": "R and D Management", "date": "2026-11-06", "sjr": 1.839, "citescore": 12.0, "citescore_year": "2025", "why": "ファジー集合の質的比較分析で、大企業がスタートアップに関心を持つかが、売り込みの仕方、協業の機会、技術の特徴の組み合わせと、企業の目的・関与の好みによって決まることを示した。", "explain": {"basis": "抄録", "basis_note": "R&D Managementの抄録を使用", "preprint": false, "short": true, "p1": "大企業とスタートアップの協業の初期段階で、大企業の関心を引く条件の組み合わせを、ファジー集合の質的比較分析（fsQCA）で明らかにした（抄録）。", "p3": "売り込みの仕方、協業の機会、技術の特徴の組み合わせを、企業の目的（必要主導か発見主導か）と関与の好み（取引的か育成的か）に応じて分析した（抄録）。", "p5": "協業を可能にする構成として、プラグ・アンド・プレイ型、狙いを定めた共同開発型、創発型などを見いだし（抄録では4つの構成とされる）、大企業の関心は単一の要因ではなく要因の組み合わせで決まることを示した（抄録）。", "fun": "スタートアップが大企業に売り込むとき、プレゼンの上手さだけで結果が決まるわけではありません。この研究は、何を求めている会社に、どんな技術を、どう見せるかの組み合わせで関心の持たれ方が変わることを示しました。成功の型が一つではなく複数あるという点が面白いところです。", "unverified": "分析した事例の数と、4つ目の構成の内容は抄録では未確認（抄録には3つの名前のみ記載）。"}}, {"id": "jn19", "rank": 19, "field": "経営学", "headline": "女性取締役が多い企業ほどESGの不祥事が少ない", "title": "The Influence of Board Gender Diversity on ESG Controversies: Do Family Control and CSR Committee Matter?", "url": "https://doi.org/10.1002/bse.71762", "authors": "Hicham Sbai ほか", "venue": "Business Strategy and the Environment", "date": "2026-11-06", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "why": "フランスの上場企業69社の13年間のパネルで、女性取締役の比率が高いほどESGの不祥事への露出が少なく、その関係は家族支配の企業で強く、CSR委員会があると弱まることを示した。", "explain": {"basis": "抄録", "basis_note": "Business Strategy and the Environmentの抄録を使用", "preprint": false, "short": true, "p1": "フランスの上場企業で、取締役会の女性比率が高いほどESGの不祥事への露出が少なく、その関係が家族支配の企業で強まり、CSR委員会があると弱まることを示した（抄録）。", "p3": "SBF120指数の69社の2011〜2023年のパネル（897企業年）で、システムGMMによる動的パネルモデルを推定した。注意に基づく視点から、女性取締役は監視だけでなく取締役会が何に気づくかも形づくると論じた（抄録）。", "p5": "女性比率の高さは不祥事への露出の少なさと関連し、家族支配の企業で強まった（ただし従属変数の測り方に敏感）。専任のCSR委員会があると効果は弱まり、責任が特定の組織に集中する代替の論理と整合した（抄録）。", "fun": "取締役に女性が多い会社は、環境や人権をめぐる不祥事が少ない傾向がありました。ところが、ESG専門の委員会を作った会社では、その効果が弱まっていたのです。「専門の係を作ると、ほかの人が気にしなくなる」という人間くさい仕組みが、会社の統治にも表れている点が面白いところです。", "unverified": "効果の大きさの数値は抄録では未確認。"}}, {"id": "jn20", "rank": 20, "field": "組織行動・心理的安全性", "headline": "制度上の支援が「支えられた」実感になる条件", "title": "Strategic support: lessons learned from staff experiences in UK higher education during the pandemic", "url": "https://doi.org/10.1057/s41599-026-09408-w", "authors": "Rasha Kassem ほか", "venue": "Humanities and Social Sciences Communications", "date": "2026-11-06", "sjr": 0.904, "citescore": 5.7, "citescore_year": "2025", "why": "コロナ禍の英国の大学職員290人の調査から、制度として用意された支援が受け手に支援と感じられるかは、上司の関わりなど関係と解釈の仕組みによって左右されることを示した。", "explain": {"basis": "抄録", "basis_note": "Humanities and Social Sciences Communicationsの抄録を使用", "preprint": false, "short": true, "p1": "コロナ禍の英国の大学職員290人の調査から、制度として用意された支援が受け手に支援と感じられるかは、上司の共感や積極的な連絡など、関係の中での実践に大きく左右されることを示した（抄録）。", "p3": "2020年3月〜2021年8月のロックダウン期について、支援の提供と認知の質問と自由記述を組み合わせた質的中心のオンライン調査を、社会的支援理論を枠組みに再帰的主題分析などで分析した（抄録）。", "p5": "制度上の提供と関係の中での実践の区別が一貫して見られ、画一的・事後的な取り組みは手続きの遵守と受け取られがちだった。非常勤や障害のある職員では認知と利用のしやすさに差があり、平等な提供が不公平な経験を覆い隠しうることも示された（抄録）。", "fun": "職場に相談窓口や支援制度があっても、それだけで人が「支えてもらえた」と感じるとは限りません。この研究は、上司の一言や気づかいといった人と人との関わりがあって初めて、制度が意味を持つことを示しました。同じ制度を全員に用意しても、届き方は人によって違うという指摘も面白いところです。", "unverified": "回答者の属性の内訳と、上司の関わりの効果の大きさは抄録では未確認。"}}, {"id": "jn21", "rank": 21, "field": "経済学", "headline": "公的研究開発だけでは次のシリコンバレーは作れない", "title": "Can Government Support for Innovation Create the Next Silicon Valley?", "url": "https://doi.org/10.1257/jep.20251493", "authors": "E. Jason Baron ほか", "venue": "Journal of Economic Perspectives", "date": "2026-11-06", "sjr": 8.181, "citescore": 15.4, "citescore_year": "2025", "why": "大学、知的財産のルール、研究機関、戦時の研究開発などの因果的な証拠を整理し、公的研究開発は地域のイノベーションを高めうるが効果は費用に比べ小さく、起業家や資本などの補完的な要素が欠かせないと論じた。", "explain": {"basis": "抄録", "basis_note": "Journal of Economic Perspectivesの抄録を使用", "preprint": false, "short": true, "p1": "政府の研究開発支援で次のシリコンバレーを作れるかを、歴史と因果的な証拠から検討し、公的研究開発は拠点づくりを助けうるが単独では作れないと結論した（抄録）。", "p3": "成功した拠点の起源の歴史の記録と、大学、知的財産のルールの変更、新しい研究機関、戦時の研究開発、宇宙開発競争からの因果的な証拠を整理した（抄録）。", "p5": "多くの拠点は偶然と有利な初期条件に起源を持っていた。公的研究開発は地域のイノベーション・雇用・所得を高めうるが、効果は不均一で費用に比べ控えめなことが多く、他地域からの移転を一部反映しうる。起業家やリスク資本などの補完的な要素が中心的な役割を果たす（抄録）。", "fun": "「国がお金を出せば第二のシリコンバレーが生まれる」と考えたくなりますが、この論文は歴史と研究の証拠から、そう単純ではないと示します。成功した地域の多くは偶然や恵まれた出発点に助けられており、国の支援は起業家やお金の出し手がそろって初めて生きるのです。国の力と地域の力の役割分担が見える点が面白いところです。", "unverified": "個々の研究の効果の大きさは抄録では未確認。"}}, {"id": "jn22", "rank": 22, "field": "経済学", "headline": "共通の基幹ソフトへの依存がサイバーリスクを集中させる", "title": "Systemic Cyber Risk: Linking Measurement, Market Incentives, and Policy", "url": "https://doi.org/10.1257/jep.20261513", "authors": "Susan Athey ほか", "venue": "Journal of Economic Perspectives", "date": "2026-11-06", "sjr": 8.181, "citescore": 15.4, "citescore_year": "2025", "why": "多くの企業が少数の重要な技術製品とソフトウェアに依存することで単一の障害点が生まれる問題を、経済学の原理と事例・新しいデータから4つの教訓として整理した。", "explain": {"basis": "抄録", "basis_note": "Journal of Economic Perspectivesの抄録を使用", "preprint": false, "short": true, "p1": "多くの企業が少数の重要な技術製品とソフトウェアに依存することで生じるシステミックなサイバーリスクを、経済学の原理から4つの教訓として整理した（抄録）。", "p3": "事例研究、新しいデータ、政策の議論を組み合わせ、リスクの集中と攻撃者の誘因、個々の防御策の限界を経済学の観点から論じた（抄録）。", "p5": "限られた製品とサービスへの広い依存が多くの単一障害点を生んで侵害の影響を増幅させ、個々の防御の進歩はシステミックな事象への脆弱性の高まりに相殺されていると論じた（抄録）。4つの教訓の内容は抄録に記載がない。", "fun": "世界中の会社が同じソフトや同じクラウドを使っていると、そこが一か所やられただけで、あちこちが同時に止まってしまいます。この論文は、一社ごとに守りを固めても、みんなが同じ所に頼る限り全体の危険はむしろ増えると、経済学の考え方で説明しています。一人ひとりの合理的な選択が社会全体のリスクを生む構図が面白いところです。", "unverified": "4つの教訓の具体的な内容と新しいデータの中身は抄録では未確認。"}}, {"id": "jn23", "rank": 23, "field": "統計学", "headline": "境界の変わる地域を郵便番号でつないで時系列化", "title": "A Simple Spatial Harmonization Technique by Aggregation for Ecological Studies: An Application Using Swiss Healthcare Regions", "url": "https://doi.org/10.1029/2026gh001875", "authors": "Jacopo Vanoli ほか", "venue": "GeoHealth", "date": "2026-11-06", "sjr": 1.515, "citescore": 7.3, "citescore_year": "2025", "why": "行政区域の境界の改定で生じる多対多の対応を、郵便番号で結んだグラフの連結成分として安定した地域に統合する簡便な方法を提案し、スイスの全国の時系列分析に適用した。", "explain": {"basis": "抄録", "basis_note": "GeoHealthの抄録を使用", "preprint": false, "short": true, "p1": "行政区域の境界が時期によって変わる問題に対し、郵便番号でつないだグラフの連結成分として、時間的に安定した地域に統合する簡便な方法を提案した（抄録）。", "p3": "異なる版の行政区域をグラフの節点とし、共通の郵便番号を持つ地域を辺で結んで、連結成分を統合した地域とする。2008年に境界が大きく変わったスイスの医療統計地域（多対多の対応）に適用した（抄録）。", "p5": "統合した地域で、1998〜2023年のスイス全国の夏の気温と65歳以上の呼吸器疾患による救急入院の時系列分析を行った。事象がまれで曝露を集約でき、解像度の低下を許せる場合に適し、局所的な異質性の隠蔽などが限界とした（抄録）。", "fun": "市町村の合併などで地域の区切りが変わると、昔と今のデータをそのまま比べられなくなります。この研究は、変わりにくい郵便番号を「のりしろ」にして、新旧の地域を一つにまとめ直す簡単な方法を考えました。細かさを少し犠牲にする代わりに、何十年もの比較を可能にする割り切りが面白いところです。", "unverified": "統合後の地域の数と、気温と入院の関係の結果は抄録では未確認。"}}, {"id": "jn24", "rank": 24, "field": "統計学", "headline": "道路網の災害脆弱性を共形予測で不確実性つきに推定", "title": "Multi-hazard road-network criticality from earth observation data using spatial graph attention networks with conformal uncertainty", "url": "https://doi.org/10.3389/frsen.2026.1996538", "authors": "Srinivasarao Tanniru ほか", "venue": "Frontiers in Remote Sensing", "date": "2026-11-06", "sjr": 1.192, "citescore": 6.9, "citescore_year": "2025", "why": "インドの沿岸デルタの道路網で、空間的なグラフ注意ネットワークによる区間の不通しやすさの推定を空間ブロック交差検証と分割共形予測で評価し、空間的に較正された不確実性を付けた。", "explain": {"basis": "抄録", "basis_note": "Frontiers in Remote Sensingの抄録を使用", "preprint": false, "short": true, "p1": "インドの沿岸デルタの道路網で、洪水・土壌の飽和・暑熱の複合災害による区間の不通しやすさを空間的なグラフ注意ネットワーク（GAT）で推定し、空間ブロック交差検証と分割共形予測で不確実性を評価した（抄録）。", "p3": "道路閉鎖の記録がないため、多重災害の閾値規則で学習用ラベルを作り、予測を途絶の受けやすさとして解釈した。2016〜2025年の気候・衛星・地形・道路網・人口の多源データを使った（抄録）。", "p5": "GATのAUCは無作為の交差検証で0.923、空間ブロック交差検証で0.682に下がり、後者ではランダムフォレスト（0.746）が5分割すべてで上回った。危険度の順位の上位5%を守ると、模擬したアクセス損失の56%を避けられた（抄録）。", "fun": "地図上の近い道路は似た条件にあるので、AIの成績を測るときに近い場所のデータが練習用と試験用に混ざると、実力以上の点数が出てしまいます。この研究は、場所ごとにまとめて分けて試験すると成績が大きく下がることを正直に示しました。試験のやり方で評価が変わることを見せた点が面白いところです。", "unverified": "予測は閾値規則によるラベルに基づき、実際の道路閉鎖での検証は未確認。"}}, {"id": "jn25", "rank": 25, "field": "地球科学", "headline": "始新世の高CO2は南大洋の生物ポンプの弱化と関係", "title": "Elevated early Eocene atmospheric CO2 tied to reduced Southern Ocean biological pump efficiency", "url": "https://doi.org/10.1038/s41561-026-02142-7", "authors": "Simone Moretti ほか", "venue": "Nature Geoscience", "date": "2026-11-06", "sjr": 6.141, "citescore": 27.3, "citescore_year": "2025", "why": "有孔虫に含まれる窒素の同位体の測定から、始新世の最温暖期に南大洋の表層の硝酸濃度が高く、生物による炭素の隔離が非効率だったことを示し、当時の高い大気CO2の一因を明らかにした。", "explain": {"basis": "抄録", "basis_note": "Nature Geoscienceの抄録を使用", "preprint": false, "short": true, "p1": "有孔虫に含まれる窒素の同位体の測定から、始新世の最温暖期（5300万〜4900万年前）に南大洋の生物による炭素の隔離が非効率だったことを示し、当時の高い大気CO2の少なくとも半分を説明しうるとした（抄録）。", "p3": "最近の氷期サイクルでCO2を左右した南大洋の生物ポンプが新生代の初めにも働いたかを、有孔虫に結合した窒素の同位体の測定で検証した（抄録）。", "p5": "最温暖期の南大洋では表層の硝酸濃度が高く、炭素の隔離が非効率だった。深海から大気へのCO2の移動は、当時の低いpHと高いカルシウムイオン濃度による緩衝能力の低さで増幅された。風化の働きが弱かったとすれば、大気CO2の増加の少なくとも半分を説明できる（抄録）。", "fun": "5300万〜4900万年前の地球は今よりずっと暑く、空気中の二酸化炭素もとても多い時代でした。この研究は、小さな殻を持つ生き物（有孔虫）の化石に残る窒素の痕跡から、当時の南の海では生き物が炭素を海の底に送る働きが弱かったことを突き止めました。海の生き物の働きが地球全体の気候を左右していたという点が面白いところです。", "unverified": "測定した地点と試料の数は抄録では未確認。"}}, {"id": "jn26", "rank": 26, "field": "機械学習", "headline": "機械学習で水中のイオン対の自由エネルギーを高精度に", "title": "From Accurate Quantum Chemistry to Converged Thermodynamics for Ion Pairing in Solution", "url": "https://doi.org/10.1021/jacs.6c20276", "authors": "Niamh O’Neill ほか", "venue": "Journal of the American Chemical Society", "date": "2026-11-06", "sjr": 5.491, "citescore": 22.0, "citescore_year": "2025", "why": "機械学習と電子状態理論を組み合わせ、水中の炭酸カルシウムのイオン対の自由エネルギーを明示的な溶媒で求め、実験と定量的に一致させるには密度汎関数理論を超える結合クラスター法の精度が必要なことを示した。", "explain": {"basis": "抄録", "basis_note": "Journal of the American Chemical Societyの抄録を使用", "preprint": false, "short": true, "p1": "機械学習と電子状態理論を組み合わせ、水中の炭酸カルシウムのイオン対の自由エネルギーを明示的な溶媒で求め、実験と定量的に一致させるには結合クラスター法CCSD(T)の精度が必要であることを示した（抄録）。", "p3": "系統的に改良できる一連のモデルを作り、密度汎関数理論からゴールドスタンダードのCCSD(T)までの精度で、十分な統計的サンプリングによる熱力学量を求めた（抄録）。", "p5": "核形成の前のCaとCO3イオンの最初の会合の仕組みを、エンタルピーとエントロピーの寄与まで定量化し、カルシウムイオンの水和の仕組みについての長年の合意の欠如も解消した（抄録）。", "fun": "海の中で鉱物になる炭酸カルシウムが水の中でどうくっつくかは、二酸化炭素を閉じ込める技術にも関わる問題です。ところが計算で正確に予測するのは長年難しいままでした。この研究は、AIを使って最も精密な量子化学の計算に相当する精度で大量の計算を回せるようにし、実験と合う答えを出しました。精密さと計算量の両立を実現した点が面白いところです。", "unverified": "計算コストと、ほかのイオン対への適用は抄録では未確認。"}}, {"id": "jn27", "rank": 27, "field": "開発経済学", "headline": "農村電化の経済効果は4年以上たって現れる", "title": "The long-run returns to rural electrification: Evidence from a randomized experiment", "url": "https://doi.org/10.1016/j.jdeveco.2026.103960", "authors": "Matthieu Chemin ほか", "venue": "Journal of Development Economics", "date": "2026-11-05", "citescore": 8.2, "citescore_year": "2025", "why": "ケニアの農村の小水力発電による電化で、2016年から家庭を段階的に接続するランダム化比較試験を行い最長8年追跡して、非農業の仕事や事業の創出などの経済効果は接続から4年以上たって初めて現れることを示した。", "explain": {"basis": "抄録", "basis_note": "Journal of Development Economicsの抄録（OpenAlex経由）を使用", "preprint": false, "short": true, "p1": "ケニアの農村の小水力発電による電化を、家庭を段階的に接続するランダム化比較試験で最長8年追跡し、経済活動への効果は長期になって初めて現れることを示した（抄録）。", "p3": "2016年に始まった段階的な家庭の接続を利用したランダム化比較試験で、労働時間の配分、事業、利益、雇用、電気の生産利用、家電の普及を接続後8年まで調べた（抄録）。", "p5": "家庭は非農業の仕事の時間を78%増やして農作業の時間を減らしたが、この効果は4年後以降に現れた。事業の創出と拡大、利益と雇用の増加が見られ、照明と携帯電話はすぐに、コンピュータは8年後に普及した（抄録）。", "fun": "村に電気が来れば、すぐに暮らしが豊かになりそうに思えます。ところがケニアの村で8年間追いかけたこの実験では、仕事の中身が農業から他の仕事へ移り始めたのは、電気が来てから4年以上たってからでした。電灯はすぐ使われても、パソコンが広まるのは8年後だったという変化の時間差が面白いところです。", "unverified": "効果の推定の誤差と、対象地域の詳細は抄録では未確認。"}}, {"id": "jn28", "rank": 28, "field": "開発経済学", "headline": "国際生産網で仲買人が果たす交換の技術", "title": "Middlemen as an exchange technology in international production networks", "url": "https://doi.org/10.1016/j.jdeveco.2026.103959", "authors": "Bernardo S. Blum ほか", "venue": "Journal of Development Economics", "date": "2026-11-03", "citescore": 8.2, "citescore_year": "2025", "why": "題名によれば、国際的な生産ネットワークで仲買人を取引を成り立たせる技術     "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
