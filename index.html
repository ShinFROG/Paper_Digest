le": "Large Language Models for Identifying Critical-to-Quality Domains in Clinical Trials: An Exploratory Comparative Evaluation Using Monitoring and Audit Findings (Preprint)", "url": "https://doi.org/10.2196/preprints.112504", "authors": "Sally Khalid Azeez ほか", "date": "2026-09-27", "venue": "JMIR Preprints", "id": "pr34", "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "治験の品質に決定的な領域（Critical-to-Quality, CtQ）を、汎用LLM2種が試験の特徴から特定できるかを、過去のモニタリング・監査の指摘を基準に探索的に評価した（抄録）。", "p3": "オマーンのがんセンターで匿名化した学術治験5件を選び、モニタリングと内部監査の指摘を4つのCtQ領域に割り当てて基準とし、LLMに標準化した試験の特徴からCtQ領域とリスク低減策を出させて比べた（抄録）。", "p5": "探索的な概念実証として一致の程度を調べたもの（抄録）。結果の数値は抄録の抽出範囲では確認できなかった。", "unverified": "使用したLLMと一致度の数値は未確認。"}}, {"rank": 35, "theme": "包摂的コミュニティ・社会", "headline": "チリの青少年の大麻使用と家族・友人の関連の推移", "title": "Historical Trends in Associations of Caregiver Knowledge of Whereabouts and Perceived Cannabis Use Among Friends With Cannabis Use Frequency Among Chilean Adolescents", "url": "https://doi.org/10.31234/osf.io/nqw32_v1", "authors": "Mauro P. Olivera ほか", "date": "2026-09-27", "venue": "PsyArXiv", "id": "pr35", "explain": {"basis": "抄録", "basis_note": "PsyArXivは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "チリの青少年636,008件の調査記録で、保護者が居場所を把握していることと友人の大麻使用の認知が、本人の大麻使用頻度とどう結びつき、その関連が2001〜2023年で変わったかを調べた（抄録）。", "p3": "チリ全国学校薬物調査の12回の反復横断調査（2001〜2023年、636,008件）で調査回ごとのスピアマン相関を求め、層別クラスター・ブートストラップ（5,000回）で分散を推定し、Hartung–Knapp法のランダム効果メタ分析とメタ回帰で統合した（抄録）。", "p5": "居場所の把握は使用頻度と負に（統合ρ=−.200）、友人の常用の認知は正により強く（統合ρ=.427）関連したが、どちらも時代的な傾向は小標本推測のもとで有意ではなかった（把握：β=.0014、p=.065）（抄録）。", "unverified": "なし"}}, {"rank": 36, "theme": "都市・インフラ政策", "headline": "テヘランの道路網の地震時閉塞を確率で評価", "title": "A Probabilistic Framework for Seismic Vulnerability Assessment of Urban Road Networks: A Case Study of Tehran", "url": "https://doi.org/10.2139/ssrn.7532367", "authors": "Erfan Firuzi ほか", "date": "2026-09-27", "venue": "SSRN", "id": "pr36", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "テヘランの道路網について、地震動・建物倒壊・道路閉塞の不確実性を順につないだ確率的な枠組みで、地震後に道路が塞がる確率を評価した（抄録）。", "p3": "地震ハザード、建物の曝露モデル、フラジリティによる倒壊推定、道路閉塞確率の4要素をモンテカルロの連鎖で結び、地震動予測の認識的不確実性はロジックツリー、偶然的変動は空間相関のある残差の抽出で扱い、国勢調査区のデータを衛星推定の建物高さ・面積で建物単位へ確率的に細分化した（抄録）。", "p5": "不確実性を各段階で明示して伝播させる手順を示した（抄録）。閉塞確率の数値や結果の地図は抄録の抽出範囲では確認できなかった。", "unverified": "主要な結果の数値は未確認。"}}, {"rank": 37, "theme": "都市・インフラ政策", "headline": "都市道路網のもろさを歪度で測る指標", "title": "Unveiling the Inherent Fragility of Urban Road Networks: Mathematical Proofs and Skewness-Based Indicators", "url": "https://doi.org/10.2139/ssrn.7533333", "authors": "Tao Huang", "date": "2026-09-27", "venue": "SSRN", "id": "pr37", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "巨視的基本図（MFD）に基づく数学的な導出で都市道路網がもろい（撹乱の大きさに対し性能低下が加速する）ことを示し、歪度にもとづくもろさの指標を提案した（抄録）。", "p3": "交通流の巨視的基本図から、撹乱の大きさが線形に増えると性能低下が加速度的に増えることを数学的に導き、その性質を直接測る歪度ベースの指標を定式化した（抄録）。", "p5": "道路網のもろさを理論的に裏づけ、指標で直接評価できるようにしたとしている（抄録）。実データでの適用結果は抄録の範囲では確認できない。", "unverified": "実証の有無と結果は未確認。"}}, {"rank": 38, "theme": "職場AI・組織行動", "headline": "作業者の心拍と生産性を同時に最適化", "title": "Human-aware multi-objective optimisation of safety and productivity in milling operations", "url": "https://doi.org/10.2139/ssrn.7532226", "authors": "Gregoire Mbangu Tambwe ほか", "date": "2026-09-27", "venue": "SSRN", "id": "pr38", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "フライス加工で、作業者の心拍（生理的負荷の代理）を下げつつ材料除去率（生産性）を上げる加工条件を、進化計算で同時最適化した（抄録）。", "p3": "11人がそれぞれ27通りの加工条件（送り速度、回転速度、切込み深さ）で作業し、騒音・振動・心拍を測定し、遺伝的アルゴリズム、蟻コロニー最適化、人工免疫系で心拍を評価関数として最適化した（抄録）。", "p5": "心拍を主に高めたのは振動で、人工免疫系が最も低い心拍（70.45 bpm）と最も高い材料除去率（1761.18 mm³/min）を達成し、遺伝的アルゴリズムは心拍74.05 bpm・除去率303.15 mm³/minと最も不利だった（抄録）。", "unverified": "参加者11人の小標本である点のほかは未確認。"}}, {"rank": 39, "theme": "LLM熟議・ペルソナ", "headline": "AI生成ソフトの主張を実測で監査すると乖離", "title": "Claims vs. Evidence: A Measured Audit of an AI-Assisted Rust Kernel and an Oracle-Gated Workflow for LLM Proof Completion", "url": "https://doi.org/10.5281/zenodo.22985926", "authors": "Callens ほか", "date": "2026-09-27", "venue": "Zenodo", "id": "pr39", "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録を使用（本文は取得できず）", "preprint": true, "short": true, "p1": "AIの支援で作られたRustのカーネル再実装について、文書の主張と実測を比べると大きく食い違うことを示し、LLMによる証明の補完を型検査で守る作業手順を作った（抄録）。", "p3": "固定したコミットで静的に計測し、文書の主張（297モジュール、警告ゼロ、未証明ゼロ）と比べた。さらに静的指標のラチェットと、すべての編集をLeanの型検査などで検証する2層のLLMワークフローを構築した（抄録）。", "p5": "316クレートのうち141が25行以下の空の雛形で、警告ゼロは284クレートでの一括抑制によるもの、36のLeanモジュールに未証明249件と公理138件があり、検証スクリプトは36のうち20しか検査していなかった（抄録）。リポジトリ内の研究論文5本はどれも再現確認をそのまま通らなかった。", "unverified": "なし"}}], "pre_notable": [{"rank": 1, "field": "経済学", "headline": "起業家は生まれか育ちか：遺伝指標と構造モデル", "title": "The DNA of Enterprise: Genetic Endowments, Entrepreneurship and Intergenerational Mobility", "url": "https://econpapers.repec.org/RePEc:cam:camdae:2668", "authors": "Yang ほか", "date": "2026-09-21", "venue": "RePEc", "why": "多遺伝子スコアを世代重複の構造モデルに組み込み、遺伝的素質が起業の選択と所得、世代間移動、富の集中にどう効くかを英国の2つのパネルで定量化した。", "id": "pn01", "explain": {"basis": "抄録", "basis_note": "本文・抄録は取得できず、RePEc NEPの新着一覧に載った抄録の冒頭部分（途中まで）だけを使用", "preprint": true, "p1": "起業家は「生まれ」か「育ち」かという問いに、遺伝的素質の指標（多遺伝子スコア）と構造的な世代重複モデルを組み合わせて答え、遺伝的素質が起業の選択と起業所得を予測することを示した（抄録冒頭）。", "p2": "起業と世代間の移動、富の集中の関係は家庭環境や資産の相続で説明されてきたが、遺伝的な素質がどの程度関わり、それが世代間の不平等にどう伝わるかは定量化されていなかった（抄録冒頭からの解釈）。", "p3": "英国の長期パネルUnderstanding Societyと全国児童発達調査（NCDS）のデータを組み合わせ、学歴と危険許容度に関連する多遺伝子スコア（polygenic score：多数の遺伝子変異の効果を合計した指標）を、世代重複（overlapping-generations）の構造モデルに入れる（抄録冒頭）。背景：構造モデルにすることで、反実仮想の政策実験（例：相続税の変更）が可能になる。", "p4": "未確認（抄録の後半を入手できず、検証の設計・評価指標は確認できない）。", "p5": "学歴と危険許容度に関わる遺伝的素質が起業の選択と起業所得を予測した（抄録冒頭）。世代間移動や富の集中への定量的な帰結は、抄録の後半が読めず未確認。", "p6": "未確認（抄録の後半と本文を入手できず）。解釈：多遺伝子スコアは家庭環境とも相関するため、遺伝と環境の分離の仕方が結論を左右する。ワーキングペーパーで未査読である。", "unverified": "抄録の後半と本文を読めず、モデルの推定結果、政策実験、限界は確認できなかった。"}}, {"rank": 2, "field": "経済学", "headline": "最低品質基準は価格を上げつつ競争も強める", "title": "Minimum Quality Standards and Market Power: Evidence from Brazil's Automobile Industry", "url": "https://doi.org/10.2139/ssrn.7528541", "authors": "Daniel Chaves", "date": "2026-09-26", "venue": "SSRN", "why": "ブラジルのエアバッグ・ABS義務化を使った均衡モデルで、最低品質基準が上位製品の価格とマークアップ、下位製品の競争に与える効果を分解した。", "id": "pn02", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "ブラジルで全新車にエアバッグとABSを義務づけた最低品質基準（minimum quality standard, MQS）の均衡効果を推定し、上位車種の価格が遵守費用以上に上がる一方、もともと基準を満たしていた車のマークアップも下がることを示した（抄録）。", "p2": "最低品質基準は安全性を上げるが、下位製品の費用を上げる効果と、品質差が縮んで競争が強まる効果が同時に働き、価格と企業利潤への純効果は理論だけでは決まらない（抄録）。", "p3": "需要と供給の均衡モデルを推定し、義務化による費用の増加と、垂直的な製品差別化の縮小による競争の強まりを分けて評価する（抄録）。例：基準を満たしていた車は追加費用がないが、競合車が同じ装備を持つことで差別化の利益を失う。", "p4": "推定した均衡モデルでの価格、マークアップ、可変利潤の変化で評価する（抄録）。識別の詳細は抄録からは未確認。", "p5": "装備を追加した車の価格は遵守費用以上に上がった（消費者が装備を評価し、企業がマークアップを上げるため）（抄録）。すでに基準を満たしていた車は追加費用がないのに、マークアップが1.7%、可変利潤が約10%下がり、これが垂直的差別化の収益の大きさを示す（抄録）。", "p6": "1か国・1産業の事例で、消費者の厚生や安全への効果の全体像は抄録からは未確認。解釈：需要モデルの定式化（代替のパターン）に結果が依存しうる。未査読のプレプリントである。", "unverified": "本文を読めず、消費者厚生の推計、需要モデルの仕様は確認できなかった。"}}, {"rank": 3, "field": "因果推論", "headline": "因果関係の有無が不確かなときの因果強度推定", "title": "Causal Strength Under Structure Uncertainty", "url": "https://doi.org/10.31234/osf.io/vuf57_v1", "authors": "Björn Meder ほか", "date": "2026-09-27", "venue": "PsyArXiv", "why": "ベイズ因果推論で、因果構造の不確実性を平均して因果強度を推定する方法を提案し、構造推定と強度推定を統合した。", "id": "pn03", "explain": {"basis": "本文", "basis_note": "PsyArXiv（OSF）版の本文（モデルの定義、研究間のモデル比較、考察の節と図1〜5のキャプション）を読んだ。付録の研究別の表は確認していない", "preprint": true, "p1": "「そもそも因果関係があるか分からない」ときの因果の強さを、関係あり・なしの構造の事後確率で強さを平均する「構造平均因果強度（structure-averaged causal strength）」として定式化し、人の因果判断をよく予測することを12の既存研究で示した（抄録、図4）。", "p2": "ベイズ因果帰納（Bayesian causal induction）の既存の説明は、因果構造（リンクがあるか）の推論と、構造を仮定したうえでの強さの推定を別々に扱ってきた。リンクの存在自体が不確かなときに強さをどう見積もるべきかは規範的にも記述的にも整理されていなかった（抄録、考察）。", "p3": "候補原因Cと背景原因Aが結果Eを生む構造S1（noisy-OR）と、背景原因だけの構造S0を考え、観測された同時頻度からS1のもとでの強さの事後分布と、両構造の事後確率を求め、強さの期待値を構造の事後確率で重み付けて平均する（図1）。背景：ベイズモデル平均化を強さの推定に当てはめたもので、ΔPや因果パワー（causal power）は構造と母数の不確実性を無視した極限にあたる（考察）。", "p4": "既刊の12研究・348条件の平均判断に対し、構造平均強度、疎で強い事前分布（SS priors）のもとでのベイズ因果パワー、リンクの事後確率の3モデルの予測を、相関（高いほど良い）とRMSE（低いほど良い）で比べた（図4）。研究単位のブートストラップ（10,000回）などで頑健性も確かめた（図5のキャプション）。", "p5": "構造平均強度が平均相関で最高、平均RMSEで最小だったが、SS事前分布のベイズ因果パワーとの差は小さかった（Model Comparison Across Studies、図4）。研究単位のブートストラップでは99%を超える標本で最高の相関と最小のRMSEだった（図5のキャプション）。ただし随伴性ゼロの条件では、リンクの事後確率が最もよく判断を説明した（図5）。", "p6": "著者は、随伴性ゼロの結果から、構造と母数の情報の寄与が証拠の文脈によって変わりうると述べている（考察）。解釈：比較は既刊研究の平均判断が対象で、個人差や学習の過程は扱っていない。noisy-ORなどの生成関数と一様な事前分布の仮定への感度は本文の範囲で確認していない。未査読のプレプリントである。", "unverified": "図4・5の各モデルの相関・RMSEの具体的な数値は抽出テキストで確認できなかった。"}}, {"rank": 4, "field": "経営学", "headline": "特許分類の統一で検索費用が下がり技術融合が進む", "title": "Does Democratizing Search for Relevant Patent Information Facilitate Knowledge Recombination?", "url": "https://doi.org/10.2139/ssrn.4800097", "authors": "Leixing Jiang", "date": "2026-09-27", "venue": "SSRN", "why": "2013年の共同特許分類（CPC）導入を自然実験として、関連特許の検索費用低下が企業の知識の組み換えとイノベーションを促すかを検証した。", "id": "pn04", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "2013年に米欧の特許庁が共同特許分類（Cooperative Patent Classification, CPC）を導入して関連特許を探す費用が下がると、英語以外の欧州特許に多く触れていた米国企業ほどイノベーションが増えたことを自然実験で示した（抄録）。", "p2": "特許制度は技術を開示する代わりに独占を与えるが、開示が他社の知識の組み換えに役立つには、関連する先行特許を見つけられること（検索可能性）が必要で、その効果は実証されていなかった（抄録）。", "p3": "CPCは開示内容を変えずに国・地域をまたいで分類を統一し、関連先行特許を探す費用だけを下げる。この導入を自然実験とし、非英語の欧州特許への露出が大きい米国上場企業と小さい企業のイノベーションの変化を比べる（抄録）。", "p4": "特許の産出、累積研究開発費あたりの産出、関連する先行知識の利用、欧州特許の引用で評価する（抄録）。推定式の詳細は未確認。", "p5": "CPC導入後、露出の大きい企業ほどイノベーション活動が増え、それは累積研究開発費あたりの産出の増加、関連先行知識の利用増、欧州特許の利用増という知識の組み換えの効率化によるものだった（抄録）。効果は情報の壁が大きかった企業で強く、欧州からの輸入競争で一部相殺された（抄録）。", "p6": "効果の大きさは抄録にない。解釈：2013年前後に同時に起きた他の制度変更（米国の先願主義への移行など）と区別できているかは本文で確認が必要。未査読のプレプリントである。", "unverified": "本文を読めず、効果の大きさと、同時期の制度変更への対処は確認できなかった。"}}, {"rank": 5, "field": "機械学習", "headline": "同一軸受の漏洩を除くと故障診断精度は大きく下がる", "title": "Recovering cross-domain bearing fault diagnosis under leakage-free evaluation: a representation-and-few-label recipe​", "url": "https://doi.org/10.2139/ssrn.7528629", "authors": "Nguyen Hong Duc ほか", "date": "2026-09-26", "venue": "SSRN", "why": "訓練と試験に同じ軸受が入る評価の漏洩を除いた厳格な条件で17手法・4データセットを比べ、未知の軸受で精度を回復する手順を示した。", "id": "pn05", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "軸受の故障診断で、訓練と試験に同じ物理的な軸受が入る評価の漏洩を除くと精度が大きく下がることを示し、そのうえで未知の軸受で使える精度を取り戻す「入力表現・少数ラベル・対照学習エンコーダ」の手順を示した（抄録）。", "p2": "領域をまたぐ軸受故障診断は95〜99%の精度が報告されるが、同じ軸受が訓練と試験の両方に現れる評価手順によるもので、真に未知の軸受での実力はわかっていなかった（抄録）。", "p3": "17手法・4データセット（Paderborn、CWRU、JNU、SEU）を、軸受を訓練と試験で重複させない厳格な帰納的手順、8つの乱数シード、対応のある有意性検定で比べる（抄録）。手順は、①想定する変化に入力表現を合わせる（両領域が回転数の範囲を含むなら次数正規化スペクトル、回転数の外挿なら周波数スペクトル）、②クラスあたり約5個の目標ラベルを集める、③領域横断の対照学習エンコーダ（CDCA）を使う、の3つ（抄録）。", "p4": "未知の軸受での分類精度を、元領域だけで学習した場合の下限と比べ、ラベル数を変えて評価する（抄録）。", "p5": "厳格な手順では共有軸受のときより人工損傷→実損傷の転移で約20%精度が下がり、ある運転条件の組では99.7%から26.1%に落ちた（抄録）。CDCAは5ラベルで44%の下限から66.9%まで回復し、20ラベルで83.8%とERMエンコーダを6.8%上回った（p<0.001）（抄録）。少数ラベルは試したどの教師なし適応法よりも有効だった。", "p6": "評価は公開の実験室データセットに限られる（抄録）。解釈：回復後の精度でも実運用には不十分な場合があり、現場の多様な軸受への一般化は未確認。未査読のプレプリントである。", "unverified": "本文を読めず、データセット別の結果の表は確認できなかった。"}}, {"rank": 6, "field": "経済学", "headline": "金融リテラシーの高い国ほど利益誘導型政治が少ない", "title": "Returns to Financial Literacy: Evidence from Electoral Clientelism", "url": "https://doi.org/10.2139/ssrn.7532345", "authors": "Santiago Basabe Serrano ほか", "date": "2026-09-27", "venue": "SSRN", "why": "金融リテラシーが先送りされた費用を見抜く力として、票の買収などの利益誘導型政治への反応を弱めるかを多数の民主国で検証した。", "id": "pn06", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "有権者の金融リテラシーが高い国ほど、政権党が利益誘導型の政治（clientelism：票と引き換えの私的便益の供与）に頼る度合いが低いことを、多数の民主国の比較で示した（抄録）。", "p2": "金融リテラシーは詐欺や高金利の借入など「目先の小さな得と後の大きな損」を避けさせることが知られている。利益誘導型の政治の提案も、見えにくい将来の費用（失われる政策）を伴う同じ構造を持つが、金融リテラシーが政治の場でも効くかは調べられていなかった（抄録）。", "p3": "多数の民主国について、有権者の金融リテラシーと、政権党の利益誘導への依存度の関係を国際比較で推定し、経済発展、民主主義の質、所得格差を統制する（抄録）。さらに、文化的アイデンティティに関わる政党の行動（ポピュリズム的言説、移民への立場）とは関係しないことを確かめる（抄録）。背景：後者は、関連が一般的な「政治の質」ではなく価格をつけられる約束に特有であることを示す反証テストにあたる。", "p4": "金融リテラシーと利益誘導の依存度の負の関連が、統制変数を入れても残るか、また関係がないはずの政党行動には現れないかで評価する（抄録）。データ源と国数は抄録からは未確認。", "p5": "金融リテラシーと利益誘導への依存の間に頑健な負の関連があり、経済発展・民主主義の質・所得格差では説明されず、ポピュリズム的言説や移民への立場には広がらなかった（抄録）。係数の大きさは抄録にない。", "p6": "国単位の関連であり、著者も「整合的」と表現するにとどめている（抄録）。解釈：金融リテラシーは教育や制度と絡み合うため、逆因果（利益誘導の少ない国で金融教育が進む）を排除できているかは本文で確認が必要。未査読のプレプリントである。", "unverified": "本文を読めず、国数・データ源・推定値と、因果識別の工夫の有無は確認できなかった。"}}, {"rank": 7, "field": "経営学", "headline": "条件付き義務開示は企業の分析実施自体を減らす", "title": "The Effects of Conditionally Mandatory Disclosures: Evidence from Climate-Related Scenario Analysis", "url": "https://doi.org/10.2139/ssrn.7532858", "authors": "Jesse Chan ほか", "date": "2026-09-27", "venue": "SSRN", "why": "2つの実験で、条件付きで義務になる開示制度では、経営者が開示の引き金となる気候シナリオ分析を避けることを示した。", "id": "pn07", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "「ある活動をしたら開示が義務になる」条件付き義務開示制度のもとでは、経営者が開示の引き金となる気候シナリオ分析そのものを避けやすいことを、経営者と投資家を対象とした2つの実験で示した（抄録）。", "p2": "気候関連の開示基準には、シナリオ分析を行った場合にだけその開示を求めるような条件付き義務の規定があるが、それが企業の分析の実施や投資家の反応にどう影響するかは実証されていなかった（抄録）。", "p3": "実験1では、条件付き義務と自主開示の制度を操作し、経営者役の参加者が気候シナリオ分析を行うかを比べた。実験2では、制度と業界の開示慣行（期待）を操作し、投資家役の参加者の投資意欲への影響と、経営者の信頼性の知覚による媒介を分析した（抄録）。", "p4": "実験1は分析を実施する選択の割合、実験2は投資意欲と、期待への違反に対する反応の強さを制度間で比べる（抄録）。参加者の属性・人数は抄録からは未確認。", "p5": "条件付き義務の制度では自主開示の制度より、経営者が開示の引き金になる分析を行いにくかった（抄録）。業界の慣行が開示を期待させる場合、条件付き義務の制度のほうが投資家は期待違反に強く反応し、制度と慣行の効果は経営者の信頼性の知覚を通じて投資意欲に及んだ（抄録）。", "p6": "実験室での意思決定であり、実際の企業行動への一般化には限界がある（抄録からの解釈）。効果の大きさは抄録にない。未査読のプレプリントである。", "unverified": "本文を読めず、参加者の構成、効果量、実験材料は確認できなかった。"}}, {"rank": 8, "field": "統計学", "headline": "少数の高精度データで場を予測する多忠実度GP", "title": "Exact Latent Shared-Private Multi-Fidelity Gaussian Process for Small-Sample High-Dimensional Field Prediction", "url": "https://doi.org/10.2139/ssrn.7532506", "authors": "Zhou Xu ほか", "date": "2026-09-27", "venue": "SSRN", "why": "潜在の共有・固有成分を持つ厳密な多忠実度ガウス過程で、高次元の場の出力を少数の高精度サンプルから予測する方法を提案した。", "id": "pn08", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "安価な低精度シミュレーションと少数の高価な高精度サンプルを組み合わせて、曲線や場のような高次元の出力を予測する多忠実度ガウス過程（ELSP-MFGP）を提案し、PDEの例題の36設定中29で強い自己回帰型の基準手法より誤差が小さかった（抄録）。", "p2": "既存の多忠実度ガウス過程や自己回帰モデルはスカラーや低次元の出力には確立しているが、高精度データが少なく忠実度間で出力がずれている場合の場の予測に拡張しにくく、場の空間で直接推定すると分散が大きく「負の転移」が起きうる（抄録）。", "p3": "場を、忠実度間で共有する潜在空間と高精度だけに固有の潜在空間に直交分解し、忠実度間の転移は共有空間だけで学ぶ。信頼度の重み、転移しない選択肢、内部の検証で転移の量を制御し、共有空間の転移・高精度固有の変動・基底の打ち切り誤差を分けて扱う（抄録）。", "p4": "入力だけを使うPDEベンチマークでRMSEを自己回帰型の基準手法と比べ、予測時に低精度の曲線が得られる翼の圧力補正では、正規化RMSE（NRMSE）と圧力分布の面積誤差で直接補正器と比べた（抄録）。", "p5": "PDEベンチマークでは36設定中29でRMSEが基準手法より小さかった（抄録）。翼の圧力補正では、ELSP-Deltaと直接補正器の誤差の傾向が相補的で、交差検証によるアンサンブルは直接補正器に対しNRMSEを7.6%、圧力分布の面積誤差を11.2%減らした（抄録）。", "p6": "検証は2種類の例題に限られる（抄録）。解釈：36設定中7では基準手法に劣っており、どの条件で転移が有効かの判定が実務では重要になる。未査読のプレプリントである。", "unverified": "本文を読めず、劣った7設定の条件と、計算コストは確認できなかった。"}}, {"rank": 9, "field": "因果推論", "headline": "ステーブルコイン取付けの国債市場への波及を部分識別", "title": "Stablecoin Runs and Treasury Fire Sales: Measurement and Partial Identification for Programmable Reserve Design", "url": "https://doi.org/10.2139/ssrn.7532718", "authors": "Seungwoo Lee", "date": "2026-09-27", "venue": "SSRN", "why": "発行体の償還と準備資産の換金の時差から国債市場への圧力を部分識別で評価し、準備資産設計への含意を示した。", "id": "pn09", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "支払能力のあるステーブルコイン発行体でも、償還の要求が準備資産の現金化より先に来ると国債市場に売り圧力を伝えうることを、ブロックチェーン上の記録の会計と条件付きのモデルで測り、売却なしで決済するのに必要な資金量を推計した（抄録）。", "p2": "ステーブルコインの準備資産は多くが米国債で、取付け（run）が起きると国債の投げ売り（fire sale）を通じて金融市場に波及しうるが、その規模を監査可能な形で測る枠組みはなかった（抄録）。", "p3": "USDCとUSDTの発行体・週単位338件と、固定した36チェーンのUSDC登録簿の検証記録を使い、チェーン上の会計、取付けの波及、準備資産の換金時期、国債市場の圧力を結ぶ条件付きモデルを作る（抄録）。実証部分は予測的な診断と裾の推定で、構造的な因果弾力性ではないと明記している（抄録）。", "p4": "厳しい2時間の基準シナリオのもとで、国債を売らずに決済を完了するのに必要な資金を、準備資産に対する比率で示す（抄録）。", "p5": "必要な資金は、衝撃を受けた発行体の準備資産の12.0144〜18.9515%で、発行元の比率25%・総額10兆ドルの仮想的な体系では300.360〜473.789 billion ドルにあたった（抄録）。集計した残差は43.58898億USDCだが、技術的な供給事象と法定通貨での償還は別物で、世界の現金償還と同一視できないとしている（抄録）。", "p6": "著者は、結果が法的・資金調達・時間の仮定に条件づけられ、実証は因果推定ではないと認めている（抄録）。解釈：部分識別の幅は仮定の置き方に強く依存する。生成AIを執筆・コードの補助に使ったと明記された未査読のプレプリントである。", "unverified": "本文を読めず、部分識別の仮定の詳細と3層の設計の内容は確認できなかった。"}}, {"rank": 10, "field": "機械学習", "headline": "汎用タンパク質言語モデルと公開データの限界", "title": "Limitations of general protein language models and public TCRpMHC data in training specificity prediction models", "url": "https://doi.org/10.64898/2026.09.21.753204", "authors": "Brajesh Rai ほか", "date": "2026-09-26", "venue": "bioRxiv", "why": "T細胞受容体の特異性予測が伸びない原因を、汎用タンパク質言語モデルの表現と公開データの偏りの両面から検証した。", "id": "pn10", "explain": {"basis": "本文", "basis_note": "bioRxiv版の本文PDF（結果の節と図1〜6、方法の概要）を読んだ。考察の節は抄録の範囲で確認", "preprint": true, "p1": "T細胞受容体（TCR）がどのペプチド-MHC複合体に結合するかの予測が伸び悩む原因として、汎用タンパク質言語モデルの表現では結合するTCRとしないTCRがほとんど分離できないこと、そして「結合しない」負例の作り方しだいで分類性能が大きく変わることを示した（抄録、結果）。", "p2": "TCR特異性の予測モデルは多くの努力やタンパク質言語モデルの進歩にもかかわらず性能が低い。よく使われる手法は、TCRを別のエピトープと入れ替える（シャッフル）か、健康人の背景TCRと組み合わせて負例を作るが、その妥当性は検証されていなかった（抄録）。", "p3": "VDJdbのαβ対のTCRデータから、よく研究された2つのエピトープ（GILGFVFTLとKLGGALQAK）について正例と2通りの負例を作り、one-hot、BLOSUM62、ESM-2、ProtGPT2、TCR特化のTCR-BERTで埋め込み、PCAとt-SNEで重なりを可視化し、ランダムフォレストで正負を分類した（抄録、結果）。例：KLGGALQAK-A*03:01では正例13,366、負例10,035のTCRがある（結果）。", "p4": "分類性能は適合率-再現率曲線の下の面積（AUPRC）で、常に負例と答える予測器とランダムな予測器を基準線として比べた（図5・6）。他の分類器（勾配ブースティング、MLP、ロジスティック回帰）でも確かめた（結果）。", "p5": "ESM-2やTCR-BERTの埋め込みでは正例と負例、正例と健康人TCRが大きく重なった（図1〜4）。KLGGALQAKでは多くの埋め込みの分類器が「常に負例」の基準線をわずかに下回り、健康人TCRを負例にするとランダム予測器より悪くなった（図5）。一方GILGFVFTLではすべての分類器が両方の基準線を上回った（図6）。", "p6": "扱ったエピトープは2つだけで、結論はエピトープにより異なる（結果）。著者は、TCR特化の埋め込み、実験で検証した負例、負例の作り方の透明な報告、エピトープ別のモデル化が必要だと結論している（抄録）。解釈：データの性質の問題を示すもので、改善したモデルそのものは提案していない。未査読のプレプリントである。", "unverified": "図5・6のAUPRCの具体的な数値は抽出テキストから読み取れなかった。"}}, {"rank": 11, "field": "社会学", "headline": "人々は不平等を交差的に捉えている", "title": "‘Intersectionality in the Mind’: Applying an Intersectional Lens to the Study of Lay Perceptions of Inequality", "url": "https://doi.org/10.31235/osf.io/6jy8b_v2", "authors": "Margherita Cusmano", "date": "2026-09-27", "venue": "SocArXiv", "why": "移民47人への面接と集団討論から、経済・ジェンダー・人種の不平等が相互に絡み合うものとして認識されていることを示した。", "id": "pn11", "explain": {"basis": "本文", "basis_note": "SocArXiv（OSF）版の本文（研究デザイン、横断分析の前半、考察と結論の節）を読んだ。3つの事例研究の節は読み切れていない", "preprint": true, "p1": "ドイツに住む移民47人への面接と集団討論から、人々が経済・法的地位・ジェンダー・人種・言語の不平等を互いに絡み合ったものとして捉えていること（著者の言う「心の中の交差性 intersectionality in the mind」）を示した（抄録、考察）。", "p2": "不平等の一般の人々の認識（lay perceptions）の研究は、経済・ジェンダー・人種の不平等を別々に扱い、社会的位置を足し算で扱ってきた。人がそれらをどう結びつけて理解しているかは捉えられていなかった（抄録、考察）。", "p3": "ドイツの移民の経済的不平等観に関する大きな研究の質的部分として、23件の詳細面接と5回の集団討論（追加の24人）を2023年4月〜2024年1月に英独伊西の4言語で行った（Research Design）。移民であることを共通にしつつ、階層・性別・年齢・法的地位・言語・人種を最大限ばらつかせる標本（最大変動サンプリング）を取り、「経済的不平等と聞いて何を思い浮かべるか」という自由連想の質問から始めた（同節）。構成主義的グラウンデッド・セオリーで、横断的な分析と3つの事例研究を組み合わせた（同節）。", "p4": "質的研究であり、統計的な検証はない。人種やジェンダーの不平等は質問しておらず、それらが自発的に語られたことを交差的な理解の証拠として扱う（Data Collection and Analysis）。", "p5": "参加者は経済的不平等を単独で語ることはまれで、法的地位・ジェンダー・人種・言語の不平等と結びつけた（横断分析）。自分が不利になる不平等は語り、得をしている不平等は語らない一貫した傾向があった（同節）。例：移民であること（「外国人要因」）は、外国人嫌悪や労働市場・福祉制度の知識の不足と結びつけて経済的不利の源とされた（同節）。", "p6": "著者は、当初は交差性を調べる設計ではなく、交差的な視点を事後的・帰納的に発展させたこと、研究者自身の移民としての位置づけがデータ収集に影響したことを明記している（Research Design）。解釈：対象はドイツの移民に限られ、非移民との比較はない。量的調査で交差的な認識を測る項目の開発は今後の課題として提案されている（考察）。未査読のプレプリントである。", "unverified": "3つの事例研究の詳細（誰がどの不平等をどう結びつけたか）は読み切れていない。"}}, {"rank": 12, "field": "経済学", "headline": "生成AIの露出と実際の利用は違う", "title": "Exposure Is Not Adoption: Measuring Generative AI and Labor Demand", "url": "https://doi.org/10.2139/ssrn.7533251", "authors": "Ashish Sedai", "date": "2026-09-27", "venue": "SSRN", "why": "Anthropic Economic Indexから職種別の実際のAI利用指標を作り、露出指標と比べて、求人需要が露出より利用に沿って動くことを示した。", "id": "pn12", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "生成AIの職種別の「露出」（できること）ではなく実際の「利用」を行動データから測る指標を作り、ChatGPT後の求人需要は露出ではなく利用に沿って減っていることを示した（抄録）。", "p2": "職業ごとのAI露出指数は、生成AIが何をできるかを測るが、実際に何に使われているかは測らない。そのため労働需要への初期の影響を捉えられていない可能性がある（抄録）。", "p3": "Anthropic Economic Index（AIとの対話の利用状況のデータ）から47の職業部門について実際の利用の指標を作り、標準的な露出指数と比べる。そのうえで、ChatGPT公開後のIndeedの週次求人数を両指標で説明する（抄録）。", "p4": "利用と露出の職業順位の一致、分布の集中度、求人数の対数に対する1標準偏差あたりの効果で評価する（抄録）。推定式の詳細は未確認。", "p5": "利用と露出は職業の順位は似ているが水準が異なり、利用のほうがずっと集中していた（抄録）。求人需要は利用に沿って動き、利用が1標準偏差高いと求人が約10対数ポイント減り、露出は追加の説明力を持たなかった（抄録）。", "p6": "利用の指標は1社のAIサービスの利用データに基づくため、他のAIサービスを含む利用全体を代表するとは限らない（抄録からの解釈）。求人の減少がAIによるものか、同時期の景気要因かの識別は本文で確認が必要。未査読のプレプリントである。", "unverified": "本文を読めず、推定の仕様、統制変数、頑健性の確認は確認できなかった。"}}, {"rank": 13, "field": "統計学", "headline": "疑似リアルタイムで検証した小型BVAR予測", "title": "Bayesian Vector Autoregression for Joint Macroeconomic Forecasting: Pseudo-Real-Time Evidence, Density Forecasts, Structural Dynamics, Scenario Analysis, and Practical Macro-Risk Use for the United States", "url": "https://doi.org/10.2139/ssrn.7532698", "authors": "Cenk Ufuk Yildiran", "date": "2026-09-27", "venue": "SSRN", "why": "当時入手できたデータの版で評価する設計で、米国の主要4変数の同時予測に使う小型ベイズVARを事前に決めた規則で選び、密度予測を検証した。", "id": "pn13", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "米国の実質GDP成長率・コアPCEインフレ率・失業率・政策金利を同時に予測する小型のベイズVAR（BVAR）を、当時入手できたデータの版（vintage）で評価する疑似リアルタイム設計で選び、密度予測・点予測・較正を総合的に検証した（抄録）。", "p2": "マクロ予測モデルの評価は、事後の改訂済みデータの使用や、多くの候補からの事後的な選択によって楽観的になりやすく、選択の過程を考慮した検証が必要である（抄録からの解釈）。", "p3": "ラグ長と全体の縮小度（shrinkage）を変えた候補から、主要な予測期間の平均対数予測密度（LPD）で事前に決めた規則に従い p=2、λ=0.1 のBVARを選ぶ。予測区間と較正の診断、選択後の対比較検定、候補全体を考慮した優越予測能力（SPA）検定で評価する（抄録）。", "p4": "基準は古典的なVAR(4)で、平均LPDの差とSPA検定を使う（抄録）。インパルス応答と予測誤差分散分解も、仮定した変数の順序に条件づけて報告する（抄録）。", "p5": "均衡標本での平均LPDの差はBVAR族がVAR(4)より正だったが、SPA検定は「VAR(4)が劣らない」という帰無仮説を5%水準で棄却しなかった（p≈0.106）。著者はこの非棄却は同等性の証拠ではないと明記している（抄録）。", "p6": "政策金利のシナリオは機械的なもので、確率的・因果的な解釈はできないと著者が断っている（抄録）。解釈：優位性を統計的に示せなかった点を正直に報告している一方、検証期間の長さや対象の4変数以外への一般化は未確認。未査読のプレプリントである。", "unverified": "本文を読めず、予測期間ごとのLPDの値と頑健性確認の結果は確認できなかった。"}}, {"rank": 14, "field": "機械学習", "headline": "根拠を示し、根拠がなければ答えないマンモ読影AI", "title": "CARE-MVLM: Counterfactual Abstention and Region-Grounded Evidence in Mammography Vision-Language Models", "url": "https://doi.org/10.64898/2026.09.23.26363835", "authors": "Bowen Qu ほか", "date": "2026-09-26", "venue": "medRxiv", "why": "視覚言語モデルに所見の根拠領域の提示と、根拠がないときの回答保留を学習させ、正答・根拠・保留を同時に評価した。", "id": "pn14", "explain": {"basis": "本文", "basis_note": "medRxiv版の本文PDF（方法、データ、評価指標、結果、除去実験、結論の節と表1の説明）を読んだ", "preprint": true, "p1": "マンモグラフィーの画像問答で、答え・根拠の病変領域・「根拠がないときは答えない」判断を別々のモジュールで学習する視覚言語モデル（CARE-MVLM）を作り、病変を消した画像で適切に回答を控える力を、同じ基盤モデルの比較手法やGPT-5.6、Gemini-3.5-flashより大きく高めた（抄録、§3.4）。", "p2": "医療画像の質問応答では、正しい答え、根拠の位置づけ、根拠がないときの回答保留（abstention）を同時に満たす必要があるが、既存の視覚言語モデル（VLM）はこれらを両立できていない（抄録）。", "p3": "各画像について、元画像、注釈された病変を周囲の組織から再構成して消した画像（target removal）、同じ大きさの無病変部を同じ操作で編集した画像（random removal）の3枚組を作り、「病変を消したら答えない」ことを回答不能の操作的定義とする（§2.1）。Qwen2.5-VL-7Bを基盤に、答えの予測ヘッド、答えに条件づけた根拠枠の生成（LoRA）、回答するかを決める選択器（LoRAと局所MIL）を段階的に学習する（§2.2–2.4）。", "p4": "CBIS-DDSM、MIAS、VinDr-Mammoから作った7,358組で評価し（抄録）、答えの質（病理のmacro-F1など）、カバー率と選択的正解率、その積の正答率（CCR）、IoU≥0.3の根拠つき正答率（GA）、病変除去時と無関係編集時の保留率の差（ASG）、全条件を同時に満たす共同信頼度（JR）を使った（§3.2）。", "p5": "CARE-MVLMのASGは21.48ポイントで、同じ基盤の比較手法は最大1.14、GPT-5.6は8.24、Gemini-3.5-flashは2.34だった（§3.4）。JRは4.75%（GPT-5.6は3.87%）、選択的正解率59.00%、CCR 50.70%だったが、GAは10.39%でGPT-5.6の21.67%より低かった（§3.4）。放射線科医による50組の確認では、病変除去は92%で完全に消え、無関係編集は94%で診断上の根拠を保っていた（§3.4）。", "p6": "著者は、共同信頼度が絶対値ではまだ低く、根拠の位置づけが主な改善点であること、他のVLMやより自然な「根拠がない」状況での評価が必要であることを認めている（§4）。編集では14%に乳頭の消失など他の人工物があった（§3.4）。解釈：回答不能を人工的な病変除去で定義しているため、実臨床での根拠不足とは性質が異なりうる。未査読のプレプリントである。", "unverified": "表1の全指標の値（病理macro-F1など）は本文の記述の範囲でのみ確認した。"}}, {"rank": 15, "field": "経済学", "headline": "新興アジアのゾンビ企業は国境を越えて波及する", "title": "Zombie firms in emerging Asia: domestic and cross border implications", "url": "https://econpapers.repec.org/RePEc:bis:biswps:1375", "authors": "Boris Hofmann ほか", "date": "2026-09-21", "venue": "RePEc", "why": "10か国の企業-銀行データで、弱い銀行の追い貸しがゾンビ企業を増やし、国内の健全企業を圧迫し、国境を越えて影響することを示した。", "id": "pn15", "explain": {"basis": "抄録", "basis_note": "本文・抄録は取得できず、RePEc NEPの新着一覧に載った抄録の冒頭部分（途中まで）だけを使用", "preprint": true, "p1": "新興アジア10か国の企業と銀行を結んだデータで、ゾンビ企業（本来なら退出すべきなのに追い貸しで存続する企業）が過去15年で大きく増え、国内で健全な企業を圧迫していることを示した（抄録冒頭）。", "p2": "ゾンビ企業は日本や欧州で研究されてきたが、新興アジアでの広がりと、国境を越えた影響は十分に調べられていなかった（抄録冒頭からの解釈）。", "p3": "10か国の企業-銀行の対応データを使い、ゾンビ企業の数の推移、弱い銀行による追い貸し（evergreening）との関係、国内の企業成績と健全企業への影響、国境を越えた波及を調べる（抄録冒頭）。", "p4": "未確認（抄録の後半を入手できず、評価の設計は確認できない）。", "p5": "ゾンビ企業の数は過去15年で有意に増え、弱い銀行の追い貸しに支えられていた（抄録冒頭）。ゾンビ企業の多さは国内の企業成績を下げ、健全な企業を締め出していた（抄録冒頭）。国境を越えた影響の内容は抄録の後半が読めず未確認。", "p6": "未確認（抄録の後半と本文を入手できず）。ワーキングペーパーで未査読である。", "unverified": "抄録の後半と本文を読めず、第3の発見（国境を越えた影響）と推定値は確認できなかった。"}}, {"rank": 16, "field": "経営学", "headline": "PEファンドは運用成績の悪さを文章で先に示す", "title": "Communicating Performance: Textual and Financial Disclosures in Private Equity", "url": "https://doi.org/10.2139/ssrn.7532840", "authors": "Josh Lerner ほか", "date": "2026-09-27", "venue": "SSRN", "why": "プライベートエクイティの投資家向け報告で、数値と文章の開示が投資先の質に応じてどう変わるかを分析した。", "id": "pn16", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "プライベートエクイティのファンド運営者が投資家に伝える情報は、投資初期は投資先に関する文章が将来の成績をよく示し、時間がたつと中間評価額のほうが重要になる、という開示の動的な変化を示した（抄録）。", "p3": "ファンド運営者の報告に含まれる投資先についての文章（トーンと内容）と中間評価額が、投資先の最終的な成績をどれだけ説明するかを投資の段階ごとに比べた（抄録）。", "p5": "投資初期の3年以内でも運営者は投資先の相対的な質を把握しており、初期は文章が、後には（特に資金調達イベントの後）中間評価額が将来のリターンをよく説明した（抄録）。情報の非対称性の大きい市場で、文章は運営者の質のシグナルになっていると解釈している。", "unverified": "データの規模と推定値は未確認。"}}, {"rank": 17, "field": "機械学習", "headline": "企業特性から資産の共分散を学ぶ動的因子モデル", "title": "The Fundamental Structure of Risk: From Characteristics to Covariance", "url": "https://econpapers.repec.org/RePEc:arx:papers:2607.24410", "authors": "Alexandre Alouadi ほか", "date": "2026-08-24", "venue": "RePEc", "why": "過去のリターンではなく企業特性から非線形の潜在因子で共分散構造を推定するモデルを提案した。", "id": "pn17", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は取得できず）", "preprint": true, "short": true, "p1": "過去の収益率ではなく企業の特性（主に財務の基礎データ）から資産の共分散構造を直接学ぶ非線形の潜在因子モデル（CD-DFM）を提案した（抄録）。", "p3": "企業特性だけに依存するエンコーダで潜在空間を作り、解釈可能な因子エクスポージャーと将来の共分散推定を同時に決め、Steinの共分散損失と因子の再構成誤差を組み合わせた目的関数で端から端まで学習する（抄録）。新しい資産も再学習なしに埋め込める。", "p5": "S&P 500の株式で、経済的に構造化された潜在表現と解釈可能な因子が得られたと報告している（抄録）。予測精度の比較の数値は抄録の抽出範囲では確認できない。", "unverified": "基準モデルとの比較結果の数値は未確認。"}}, {"rank": 18, "field": "機械学習", "headline": "深層強化学習で限定合理的な主体をDSGEに入れる", "title": "Deep reinforcement learning in a monetary model", "url": "https://econpapers.repec.org/RePEc:boe:boeewp:023264", "authors": "Mingli Chen ほか", "date": "2026-09-14", "venue": "RePEc", "why": "家計などの主体をニューラルネットで表し、深層強化学習で学習させる形で限定合理性をDSGEモデルに導入した。", "id": "pn18", "explain": {"basis": "抄録", "basis_note": "本文・抄録は取得できず、RePEc NEPの新着一覧に載った抄録の冒頭部分（途中まで）だけを使用", "preprint": true, "short": true, "p1": "DSGEモデルの限定合理性を、深層強化学習で行動を学ぶ主体として表す一般的な方法を提案した（抄録冒頭）。", "p3": "主体を深層ニューラルネットで表し、事前に未知の環境との相互作用を通じて異時点の目的関数を最大化するよう学習させる。適応的学習の文献のモデルに適用した（抄録冒頭）。", "p5": "深層強化学習の主体は、局所的な安定性にかかわらずすべての均衡を学習できたとしている（抄録冒頭）。以降の結果は抄録が途中までしか読めず未確認。", "unverified": "抄録の後半と本文は確認できなかった。"}}, {"rank": 19, "field": "経済学", "headline": "株式アノマリーはいくらの資金まで使えるか", "title": "The Capacity of Equity Anomalies", "url": "https://doi.org/10.2139/ssrn.7524338", "authors": "Doron Avramov ほか", "date": "2026-09-26", "venue": "SSRN", "why": "取引費用と流動性回復を日次で推定し、各アノマリー戦略が超過収益を失うまでの運用可能額を測った。", "id": "pn19", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "株式アノマリー（異常収益）戦略に、取引費用で超過収益が消えるまでにいくらの資金を投入できるか（容量）を35のアノマリーについて測った（抄録）。", "p3": "株式・日次のスプレッド、価格インパクト、流動性の回復の推定値を使い、市場ヘッジ後の超過収益が現金を上回らなくなる運用額を計算した（抄録）。", "p5": "アルファの高いロング側はどれも20億ドル未満しか運用できず、アルファの低い収益性戦略は20〜33 billion ドルを支えた（抄録）。戦略間の差の大半は回転率と銘柄の流動性を通じた価格インパクトによるもので、リバランスを遅くすると容量の中央値は十三倍になった（抄録）。", "unverified": "なし"}}, {"rank": 20, "field": "経済学", "headline": "外資審査の遅延は見えない大きな費用", "title": "Regulatory Delay, Uncertainty, and the Cost of Foreign Investment Screening", "url": "https://doi.org/10.2139/ssrn.7532398", "authors": "Phillip McCalman ほか", "date": "2026-09-27", "venue": "SSRN", "why": "却下は少ない裁量的な外資審査でも、審査の遅延と不確実性が投資に大きな費用を課すことを示した。", "id": "pn20", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "却下が少なく「軽い」とされる外資の審査も、審査の遅れと不確実性が資産価格に織り込まれる大きな費用であることを、オーストラリアのデータで示した（抄録）。", "p3": "承認の取り消しが難しく情報が時間とともに届くとき、審査は実物オプションとして働くと理論化し、オーストラリアの審査の承認発表に対する買収対象企業の株価の異常収益を推定した（抄録）。", "p5": "承認発表時の異常収益は2.9%で、対象企業の株主が期待する余剰の約20%に相当した（抄録）。取引全体を合計した評価額への影響は財の貿易障壁の推計と比べて大きく、抑止された取引を考えるとさらに大きい（抄録）。", "unverified": "抑止された取引の推計方法は未確認。"}}, {"rank": 21, "field": "経済学", "headline": "データ共有の向きが長期の競争と厚生を決める", "title": "Dynamic Competition for Attention: The Effects of Data Sharing", "url": "https://doi.org/10.2139/ssrn.7532374", "authors": "Yaxin LI", "date": "2026-09-27", "venue": "SSRN", "why": "利用者の注意を奪い合う動学モデルで、データ共有の方向と程度が長期の競争と厚生に与える効果を分析した。", "id": "pn21", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "ユーザーの限られた注意を奪い合う2つのプラットフォームの動学モデルで、データ共有の方向と程度が長期の競争と厚生に与える効果を分析した（抄録）。", "p3": "2社は初期のデータ量とデータ処理の生産性が異なる。データ共有のゲームが、データ生産性を調整した共有なしのゲームと同値であることを示して分析する（抄録）。", "p5": "どちらが共有しても競争は緩み、共有の向きが注意の再配分を決める（抄録）。生産性の低い側の共有は市場集中を高めるとは限らず、市場の一極化（tipping）を起こりにくくすることもあり、市場シェアが下がっても共有した側が得をしうる（抄録）。", "unverified": "厚生への効果の結論（抄録末尾）は未確認。"}}, {"rank": 22, "field": "経済学", "headline": "米国家計債務1950–2022年の分布の変化", "title": "The Distribution of Household Debt in the United States, 1950-2022", "url": "https://econpapers.repec.org/RePEc:hal:journl:hal-05448445", "authors": "Alina K Bartscher ほか", "date": "2026-01-26", "venue": "RePEc", "why": "新しい家計データで、1980年以降の債務増加が借り手の増加ではなく一人当たりの借入増による点など分布の変化を示した。", "id": "pn22", "explain": {"basis": "抄録", "basis_note": "本文・抄録は取得できず、RePEc NEPの新着一覧に載った抄録の冒頭部分（途中まで）だけを使用", "preprint": true, "short": true, "p1": "新しい家計単位のデータで、1950年以降の米国の家計債務の長期的な増加とその分布を調べた（抄録冒頭）。", "p3": "家計レベルの新しいデータで、債務の増加を借りる世帯の増加と世帯あたりの借入額の増加に分解した（抄録冒頭）。", "p5": "債務の大半は住宅ローンで、当初は借りる世帯が増えたことで増えたが、その後は世帯が多く借りるようになったことで増えた（抄録冒頭）。最大の要因は白人中間層に集中した住宅資産の取り崩し（home equity extraction）で、世代間の不平等と生涯の債務の形に強く影響した（抄録冒頭）。", "unverified": "抄録の後半と本文は確認できなかった。"}}, {"rank": 23, "field": "経済学", "headline": "信用状を使う企業と使わない企業の違い", "title": "Trade Finance Use by Heterogeneous Firms", "url": "https://doi.org/10.2139/ssrn.7532400", "authors": "Francesca de Nicola ほか", "date": "2026-09-27", "venue": "SSRN", "why": "ベトナムの詳細な貿易データで、企業の異質性に応じた信用状の利用の違いを記述した。", "id": "pn23", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "ベトナムの詳細な貿易データで、信用状（letter of credit）の利用が企業の特徴によってどう違うかを記述した（抄録）。", "p3": "貿易企業の年齢、規模、所有形態、取引の多様化と経験と、信用状の利用確率の関係を、相手国の情報と契約執行の環境と合わせて分析し、取引相手を選別する能力と銀行仲介の費用が企業ごとに違うモデルで解釈した（抄録）。", "p5": "若く小さい企業や外資系企業は信用状を使う確率が低く、多様化や経験の少ない輸入企業は使いやすかった（抄録）。企業の特徴が効くのは情報が乏しく契約執行が弱い市場で、企業の選別と国の制度は代替関係にあった（抄録）。", "unverified": "推定値の大きさは未確認。"}}, {"rank": 24, "field": "経済学", "headline": "米金融政策サプライズと億万長者の資産", "title": "U.S. monetary-policy surprises and billionaire wealth", "url": "https://doi.org/10.2139/ssrn.7532259", "authors": "Rodrigo Lluberas", "date": "2026-09-27", "venue": "SSRN", "why": "高頻度の金融政策ショックとForbesの日次資産推計を結び、FOMC発表に対する超富裕層の資産の反応を推定した。", "id": "pn24", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "米国の金融政策のサプライズに対して、億万長者の資産がどう反応するかを、高頻度のショックとForbesの日次推計で調べた（抄録）。", "p3": "2021年から2026年7月までの定例FOMC発表の前後で、高頻度で識別した金融政策ショックとForbesの市場評価の資産推計を組み合わせ、個人ごとの局所射影（local projections）で反応を推定した（抄録）。", "p5": "政策金利目標と先行きの経路の引き締めに対して資産は負に反応し、テック系の億万長者は特に目標サプライズに強く負に反応し、米国籍の億万長者は影響が小さいことが示唆された（抄録）。", "unverified": "反応の大きさの数値は未確認。"}}, {"rank": 25, "field": "経済学", "headline": "中央銀行のバランスシートの最適規模", "title": "A welfare analysis of the central bank balance sheet", "url": "https://econpapers.repec.org/RePEc:boe:boeewp:023578", "authors": "William Pagel", "date": "2026-09-21", "venue": "RePEc", "why": "銀行が流動性を必要とするモデルに中央銀行を入れ、平時のバランスシートの社会的最適規模を厚生分析で求めた。", "id": "pn25", "explain": {"basis": "抄録", "basis_note": "本文・抄録は取得できず、RePEc NEPの新着一覧に載った抄録の冒頭部分（途中まで）だけを使用", "preprint": true, "short": true, "p1": "金利が実効下限から離れた平時に、中央銀行のバランスシートの社会的に最適な長期の規模はどれくらいかを、取付けの起こりうる銀行モデルで分析した（抄録冒頭）。", "p3": "流動性のミスマッチを抱え突然の取付けが起こりうる銀行のモデルに中央銀行を導入し、準備預金の供給の便益と費用を比べる（抄録冒頭）。", "p5": "準備預金の供給は取付けの起こりやすさと深刻さを下げるが、担保にできる証券の制約などの費用を伴う（抄録冒頭）。最適規模の結論は抄録が途中までしか読めず未確認。", "unverified": "抄録の後半と本文は確認できなかった。"}}, {"rank": 26, "field": "統計学", "headline": "複数の学習基準の合意で次の計算点を選ぶ", "title": "Consensus-Guided Multi-Criterion Sampling for Active Kriging-Based Reliability Analysis", "url": "https://doi.org/10.2139/ssrn.7533243", "authors": "Shui Yu ほか", "date": "2026-09-27", "venue": "SSRN", "why": "能動的クリギングによる信頼性解析で、複数の学習基準が食い違うときに合意に基づいて次の評価点を選ぶ方法を提案した。", "id": "pn26", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "能動的クリギングによる信頼性解析で、次に計算する点を選ぶ複数の学習基準が食い違うとき、それぞれの推薦候補を全基準で採点する合意方式で選ぶ方法を提案した（抄録）。", "p3": "U関数、EFF、H、ERFの4基準がそれぞれ1候補を推薦し、推薦候補を全基準で採点して基準横断の支持行列を作り、反復に応じた2段階の重みで不確実性の探索と限界状態の精緻化を配分する。破壊確率が安定し曖昧な分類点が少なくなったときに停止する（抄録）。", "p5": "解析関数、トラス、非線形動的応答モデル、リハビリロボットの例で検証した（抄録）。比較手法に対する計算回数や精度の数値は抄録の抽出範囲では確認できない。", "unverified": "主要な数値結果は未確認。"}}, {"rank": 27, "field": "統計学", "headline": "天の川銀河の暗黒物質分布をベイズ比較", "title": "Bayesian model comparison of dark mat- ter density profiles in the Milky Way: SIDM versus CDM", "url": "https://doi.org/10.2139/ssrn.7532218", "authors": "Ting-En Hu", "date": "2026-09-27", "venue": "SSRN", "why": "Gaia DR3に基づく5つの回転曲線と3つのバリオンモデルで、自己相互作用暗黒物質と冷たい暗黒物質の密度分布をベイズ比較した。", "id": "pn27", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "Gaia DR3に基づく天の川銀河の回転曲線5種と3つのバリオンモデルで、8つの暗黒物質の密度分布をベイズ比較し、多くのデータでEinasto分布が決定的に支持されることを示した（抄録）。", "p3": "動的ネスティッド・サンプリングで周辺尤度を計算し、統一した対数一様の事前分布のもとで、NFW、Einasto、Burkert、自己相互作用暗黒物質（SIDM）の複数のモデルなどを比べた（抄録）。", "p5": "Einastoが5データのうち4つで決定的に支持され（ln B=3.3〜30.0）、NFWはどのデータでも支持されなかった（抄録）。例外のD2では、最も内側の点（R=5.24 kpc）がJeans–Poisson方程式に基づく自己無撞着なSIDMを強く支持した（ln B>27）（抄録）。", "unverified": "なし"}}, {"rank": 28, "field": "機械学習", "headline": "ランダム領域の確率ガラーキン近似を深層学習で", "title": "Deep learning methods for stochastic Galerkin approximations of random domain problems", "url": "https://doi.org/10.2139/ssrn.7532154", "authors": "Fabio Musco ほか", "date": "2026-09-27", "venue": "SSRN", "why": "ランダムな領域をもつ楕円型偏微分方程式の確率ガラーキン近似を深層学習で解く方法を示した。", "id": "pn28", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "ランダムな領域をもつ楕円型偏微分方程式の確率ガラーキン近似を、従来の数値解法の代わりに深層学習で解く2つの方法を比べた（抄録）。", "p3": "ランダムな領域を決定論的な参照領域へ写像し、強形式の確率ガラーキン残差に基づく物理情報ニューラルネット（PINN）と、弱形式をRitzエネルギー最小化に書き直したDeep Ritz法を比べる。ネットワークは確率ガラーキン解の決定論的なスペクトル係数を近似し、確率パラメータを入力にせず、領域の標本化もしない（抄録）。", "p5": "ランダムに形の変わる領域の例で効率を示したとしている（抄録）。精度・計算時間の数値は抄録の抽出範囲では確認できない。", "unverified": "数値結果は未確認。"}}, {"rank": 29, "field": "機械学習", "headline": "特性の依存構造から疎なネットワークを作り株価予測", "title": "Dependence-Informed Sparse Neural Architecture for Stock Return Prediction", "url": "https://econpapers.repec.org/RePEc:arx:papers:2608.14323", "authors": "Hongyu Lin ほか", "date": "2026-08-24", "venue": "RePEc", "why": "企業特性間の依存構造を推定して、ネットワークの深さと幅を解釈可能に決める疎なニューラルネットを提案した。", "id": "pn29", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は取得できず）", "preprint": true, "short": true, "p1": "企業特性間の依存構造をグラフで推定し、その構造からニューラルネットの深さ・幅・疎な結合を決めることで、株価予測のネットワーク設計を解釈可能にした（抄録）。", "p3": "最大フィルタ・クリーク森（MFCF）で94の企業特性の依存構造を推定し、そのクリーク構造をホモロジカル・ニューラルネット（HNN）に写す。最大クリーク数Kだけが複雑さを決め、表現できる交互作用の次数の上限になる（抄録）。", "p5": "1987〜2016年の米国株の年次の超過収益を標本外で予測し、HNNは3層の基準モデルと同等の予測力を持ったとしている（抄録）。", "unverified": "抄録後半の結果（ポートフォリオ成績など）は未確認。"}}, {"rank": 30, "field": "機械学習", "headline": "部分的な充電データから電池の劣化を推定", "title": "Zero-shot state of health estimation from partial charging segments via a chemistry-gated graph transformer", "url": "https://doi.org/10.2139/ssrn.7528636", "authors": "Liu Teng ほか", "date": "2026-09-26", "venue": "SSRN", "why": "化学組成で切り替わるグラフTransformerで、未知の電池の部分的な充電区間から健全性をゼロショットで推定した。", "id": "pn30", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "電気自動車の電池の健全性（SOH）を、途中で終わった充電区間と過去の区間の列から、学習時と異なる化学組成の電池にもゼロショットで推定するモデル（CGFormer）を提案した（抄録）。", "p3": "化学組成の埋め込みが多頭注意のクエリとキーの射影を調整するグラフTransformerで、同じセルの2つのランダムな部分区間が同じSOHを出すよう一貫性の目的を課す（抄録）。", "p5": "LCO・NMC・LFPの3化学組成、604セル、公称容量0.24〜2.8 Ahの8つの公開データセットで、組成を除外する評価を行った（抄録）。誤差の数値は抄録の抽出範囲では確認できない。", "unverified": "主要な誤差の数値は未確認。"}}, {"rank": 31, "field": "因果推論", "headline": "電子農産物市場への参加は農家の価格を上げたか", "title": "Impact of Participation in the Electronic National Agriculture Market (e-NAM) on Price Realisation among Mustard and Gram Farmers in India: A Propensity Score Matching Approach", "url": "https://doi.org/10.2139/ssrn.7532407", "authors": "Rakesh  Kumar Mahto ほか", "date": "2026-09-27", "venue": "SSRN", "why": "インドの電子全国農業市場への参加が菜種・ひよこ豆農家の受取価格に与えた効果を傾向スコアマッチングで推定した。", "id": "pn31", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "インド・ハリヤーナー州の菜種とひよこ豆の農家600人で、電子全国農業市場（e-NAM）への参加の要因と、参加が受取価格に与える効果を推定した（抄録）。", "p3": "多段抽出で600人を選び、観察可能な選択バイアスに対処するため、傾向スコアマッチング（PSM）と逆確率重み付き回帰調整（IPWRA）を使った（抄録）。", "p5": "教育、スマートフォンの所有、e-NAMの認知は両作物で参加と正に、e-NAM市場までの距離は負に関連した（抄録）。価格への効果の大きさは抄録の抽出範囲では確認できない。", "unverified": "価格効果の推定値は未確認。"}}, {"rank": 32, "field": "社会学", "headline": "主観的な家計の苦しさは所得順位と別に抑うつに効く", "title": "Subjective Financial Strain Beyond Household Income Position: Evidence on Depressive Symptoms from 30 Countries", "url": "https://doi.org/10.2139/ssrn.7533319", "authors": "Edyta Wojtyla", "date": "2026-09-27", "venue": "SSRN", "why": "30か国のデータで、家計所得の順位とは別に、現在の収入で暮らす主観的な苦しさが抑うつ症状と結びつくことを示した。", "id": "pn32", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "欧州30か国の37,893人のデータで、現在の収入で暮らす主観的な苦しさが、家計所得の順位を細かく調整した後も抑うつ症状と強く関連することを示した（抄録）。", "p3": "欧州社会調査第11回の37,893人について、国の固定効果、国単位のクラスター標準誤差、所得十分位の9つの指示変数、世帯人数などを入れた調査重み付きの線形モデルに、主観的な家計の苦しさを加えた（抄録）。", "p5": "家計の苦しさを加えると重み付きR²は0.104から0.152に上がった（ΔR²=0.048、偏R²=0.053）（抄録）。", "unverified": "調整後の係数の大きさは未確認。"}}, {"rank": 33, "field": "社会学", "headline": "能力主義の教育制度が不平等と成長に与える費用", "title": "The Costs of Meritocracy: An Agent-Based Model of Education, Inequality and Growth", "url": "https://doi.org/10.2139/ssrn.7532443", "authors": "Hannah Engljaehringer ほか", "date": "2026-09-27", "venue": "SSRN", "why": "エージェントベースモデルで、教育の機会が能力と費用で決まる経済での不平等と成長の相互作用を分析した。", "id": "pn33", "explain": {"basis": "抄録", "basis_note": "SSRNは本文を取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "教育の機会が不平等な「能力主義」の経済では、所得・資産の格差が広がり社会移動が下がり成長も損なわれることを、エージェントベースモデルで示した（抄録）。", "p3": "家計が費用のかかる教育を受けられるかで将来の生産性と賃金が決まる経済をシミュレーションし、教育機会の広さと、生産性に応じた報酬の強さを変えて比べた（抄録）。", "p5": "教育機会が不平等で生産性に応じて報酬が決まる経済では格差が急拡大し、社会移動が落ち、成長が徐々に損なわれた（抄録）。広い教育機会と能力主義の弱い報酬体系、または資産下位層への教育補助で、より高く包摂的な成長が得られた（抄録）。", "unverified": "数値結果とモデルの較正の方法は未確認。"}}, {"rank": 34, "field": "社会学", "headline": "農村に残る起業家の社会・経済的な特徴", "title": "What makes rural entrepreneurs stay? Social and economic characteristics of in-migrants and locals", "url": "https://econpapers.repec.org/RePEc:ags:ncrcrd:388969", "authors": "Bednarik ほか", "date": "2026-01-26", "venue": "RePEc", "why": "移住してきた自営業者と地元出身者を比べ、農村に定着する起業家の社会的・経済的特徴を分析した。", "id": "pn34", "explain": {"basis": "抄録", "basis_note": "本文・抄録は取得できず、RePEc NEPの新着一覧に載った抄録の冒頭部分（途中まで）だけを使用", "preprint": true, "short": true, "p1": "農村で移住者の自営業者が地域活性化の担い手と期待されるなか、何が起業家を農村にとどまらせるかを、移住者と地元出身者の社会的・経済的特徴から調べた（抄録冒頭）。", "p3": "未確認（抄録の冒頭しか読めず、データと手法は確認できない）。", "p5": "未確認（抄録の冒頭しか読めず、結果は確認できない）。", "unverified": "手法と結果は確認できなかった。"}}, {"rank": 35, "field": "医療経済・医療政策", "headline": "地域で届ける妊婦健診は受診の壁を下げるか", "title": "Community-Delivered Antenatal Care to Address Access Barriers: Perspectives of Women and Healthcare Workers", "url": "https://doi.org/10.64898/2026.09.23.26363848", "authors": "Olive Kabajaasi ほか", "date": "2026-09-26", "venue": "medRxiv", "why": "死産の多い資源の乏しい地域で、村の保健員による地域での妊婦健診について女性と医療者の視点を質的に調べた。", "id": "pn35", "explain": {"basis": "抄録", "basis_note": "medRxivの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "ウガンダの4つの紹介病院で、死産の予防のために地域で妊婦健診を届けるやり方について、女性・村の保健チーム員・医療者の考えを質的に調べた（抄録）。", "p3": "フォーカスグループ、詳細面接、主要情報提供者への面接を行い、逐語録を反復的に作ったコードブックとNVivoで主題分析した（抄録）。", "p5": "参加者は56人（女性27人、村の保健チーム員11人、医療者18人）だった（抄録）。主な主題の内容は抄録の抽出範囲では確認できない。", "unverified": "主題分析の結果は未確認。"}}], "jnl_related": [{"rank": 1, "theme": "位相空間・土木三力学", "headline": "粒子の扁平さが斜面流れ則の係数を変える", "title": "Shape effects in granular flow down a rough incline: Understanding the role of particle flatness and elongation", "url": "https://doi.org/10.1016/j.compgeo.2026.108658", "authors": "Mengna Zhang ほか", "date": "2026-09-21", "venue": "Computers and Geotechnics", "sjr": 1.957, "id": "jr01", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "p1": "粗い斜面を流れる密な粒状流で、粒子を扁平にすると流れ則の形は保たれたまま係数が大きく変わり流動性が下がること、そして扁平化と細長化は力学的に別の道筋であることを個別要素法（DEM）で示した（抄録）。", "p2": "斜面上の密な粒状流は重力による土砂移動の基本的な設定だが、粒子形状、特に扁平さの役割は十分にわかっていない（抄録）。背景：実際の土砂は球ではなく、形状が崩壊・流動の到達距離を左右しうる。", "p3": "DEMで扁平さの異なる粒子の定常一様流を、傾斜角と層厚を変えて計算し、Pouliquenの流れ則の枠組みで整理した。背景：Pouliquenの流れ則は、流れの速さを層厚と「その角度で流れが止まる厚さ」の比で表す経験則で、係数βが流動性を表す。細長い粒子の結果とも比べた（抄録）。", "p4": "流れ則の関数形とその係数β、粒子の回転と配向の微視的な変化で評価し、形状記述子（球形度など）でデータがまとまるかを確かめた（抄録）。", "p5": "扁平化で流れ則の関数形は保たれ、βは球から離れるほど大きくなり（流動性の低下）、これは粒子の回転の拘束と、せん断面内でほぼ平らに寝る配向への再編に対応した（抄録）。球形度ψでβを整理すると扁平粒子と細長粒子のデータが近づき、ψ≈0.95付近に形状感度の経験的な転換点が見られた（抄録）。", "p6": "数値計算のみで、実験による検証の有無は抄録からは確認できない。解釈：転換点ψ≈0.95は経験的なもので、摩擦係数や粒度分布が違う条件への一般性は未確認。", "unverified": "本文を読めず、βの具体的な値と計算条件（粒子数、摩擦係数）は確認できなかった。"}}, {"rank": 2, "theme": "位相空間・土木三力学", "headline": "海底粒状流の到達距離を勾配ごとにCFD-DEMで解析", "title": "Runout of submarine granular flow over sloping beds: Insights from CFD–DEM simulations", "url": "https://doi.org/10.1016/j.oceaneng.2026.128247", "authors": "Y.Z. Liu ほか", "date": "2026-09-22", "venue": "Ocean Engineering", "sjr": 1.524, "id": "jr02", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "p1": "水中で粒子の柱が斜面上に崩れて流れる到達距離を半解像のCFD–DEMで調べ、斜面の角度・粒径・柱の縦横比を含む統一的な到達距離の尺度則を提案した（抄録）。", "p2": "海底地すべりは水中インフラを脅かす海洋地盤災害で、その中の粒状流は変形の大きい流れだが、河床の傾斜が流動性に与える影響は十分に調べられていなかった（抄録）。", "p3": "安息角より小さい傾斜の斜面上で、水中の粒子柱の崩壊を、流体を粒子より粗い格子で解きつつ粒子近傍の影響を反映する半解像型のCFD–DEMで計算した。水中の粒子柱崩壊の実験で検証したうえで、斜面角、粒径、縦横比を変えたパラメータ計算を行った（抄録）。", "p4": "崩壊の過程と最終到達距離で評価し、提案した尺度則が今回の計算と既存の実験・数値結果をどれだけ予測できるかを確かめた（抄録）。", "p5": "統一尺度則は今回の計算データをよくまとめ、既存の実験・数値結果もおおむね予測できた（抄録）。斜面角が海底粒状流の流動性を強く支配することを示した（抄録）。尺度則の係数などの数値は抄録にない。", "p6": "対象は安息角未満の傾斜と単純な粒子柱の崩壊で、実際の海底地すべりの規模や粘着性土への適用は範囲外（抄録からの解釈）。", "unverified": "本文を読めず、尺度則の式と検証実験との一致度の数値は確認できなかった。"}}, {"rank": 3, "theme": "VBI・橋梁SHM", "headline": "歩行者荷重のばらつきを確率密度発展法で応答分布に", "title": "Stochastic Dynamic Response Analysis of a Steel-Framed Glass-Deck Pedestrian Bridge Considering Pedestrian-Load Randomness and Selected Structural-Parameter Uncertainties", "url": "https://doi.org/10.3390/app16189378", "authors": "Yali Gu ほか", "date": "2026-09-21", "venue": "Applied Sciences", "id": "jr03", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "歩行者荷重のばらつきと減衰比の不確実性を入れた歩道橋の振動応答を、確率密度発展法（PDEM）で確率密度の時間変化として求め、実験室の歩道橋の実測と照合した（抄録）。", "p2": "歩道橋の歩行振動は歩行者ごとの歩調・体重・歩幅が違うため確率的だが、決定論的な荷重モデルでは応答のばらつきを表せない（抄録からの解釈）。", "p3": "歩行周波数・体重・歩幅を確率変数とする歩行者荷重モデルを作り、PDEMで支間中央の加速度応答の確率密度関数の時間変化を評価した（抄録）。背景：PDEMは確率パラメータで条件づけた密度発展方程式を解き、少ない代表点で応答の確率密度を得る方法。1人歩行、4人同時進入、4人間隔歩行と、約4.2Hzの共振近傍の高速歩行を試験・解析し、減衰比の不確実性も加えた（抄録）。", "p4": "実験室の鋼製フレーム・ガラス床版の歩道橋での実測加速度と比べ、同じ数値設定のモンテカルロ法の平均・標準偏差とも比べた（抄録）。", "p5": "4人の集団歩行は1人歩行より応答が大きく、ばらつきも大きかった（抄録）。構造パラメータの不確実性を加えると支間中央の最大加速度は0.1978 m/s²から0.2487 m/s²へ約25.7%増えた（抄録）。PDEMの平均・標準偏差はモンテカルロ法とよく一致した（抄録）。", "p6": "対象は実験室の小型の歩道橋で、実橋での検証は抄録にない。解釈：歩行者間の同期や人-構造の相互作用は抄録の範囲では扱われていない。", "unverified": "本文を読めず、実測との一致度の指標と、PDEMの代表点数は確認できなかった。"}}, {"rank": 4, "theme": "包摂的コミュニティ・社会", "headline": "近隣SNSの利用は地域の凝集性と共同体感と関連", "title": "The association of neighborhood social media use on social cohesion and sense of community in Nevada adults during the COVID-19 pandemic", "url": "https://doi.org/10.1186/s12889-026-29628-8", "authors": "Coughenour Courtney ほか", "date": "2026-09-26", "venue": "BMC Public Health", "id": "jr04", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "p1": "コロナ禍の2020年末（December 2020）、米ネバダ州の成人1,000人の電話調査で、近隣向けSNS（NextDoorのような地域のSNS）を使う人は、使わない人より地域の共同体感と社会的凝集性が高いことを示した（抄録）。", "p2": "社会的凝集性と共同体感は心の健康とwell-beingに重要だが、近隣向けSNSの利用が広がるなかで、特に地域の非常時にそれがどう関係するかの証拠は乏しかった（抄録）。", "p3": "18歳以上のネバダ州民への横断的な電話調査（n=1000）で、近隣SNSの利用をはい・いいえで測り、社会的凝集性（4項目）と共同体感（8項目）の合成得点を作り、属性と知覚された治安を調整した重回帰で関連を推定した（抄録）。", "p4": "SNS利用者と非利用者の共同体感・凝集性の差を、調整済みの非標準化係数Bと標準化係数βで評価した（抄録）。", "p5": "38%がSNSを利用しており、利用者は共同体感（B=1.36、β=0.142、p<0.001）と凝集性（B=0.63、β=0.130、p<0.001）が高かった（抄録）。最も強い予測因子は知覚された治安で（共同体感β=0.403、凝集性β=0.402）、所得が上がるにつれて段階的に関連が強まった（抄録）。", "p6": "横断調査なので、SNS利用が共同体感を高めるのか、共同体感の強い人が使うのかは区別できない（抄録からの解釈）。利用は1問のはい・いいえで、利用の中身は測っていない。", "unverified": "本文を読めず、回答率や尺度の信頼性係数は確認できなかった。"}}, {"rank": 5, "theme": "VBI・橋梁SHM", "headline": "少数センサで鉄道橋デジタルツインをベイズ更新", "title": "Sparse-Sensor Bayesian Updating of Railway Bridge Digital Twins under Train Passage", "url": "https://doi.org/10.71465/gmssrj224", "authors": "Mohamed Ramirez", "date": "2026-09-26", "venue": "Global Media and Social Sciences Research Journal", "id": "jr05", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用。掲載誌は工学の専門誌ではない点に注意", "preprint": false, "p1": "列車通過時の応答を少数のセンサで測り、車両-橋梁相互作用の力学とベイズ推定で鉄道橋のデジタルツインの物理パラメータを更新する枠組みを示し、密なセンサ網と同等の推定精度を計算量を1桁減らして得たと報告した（抄録）。", "p2": "鉄道橋の構造ヘルスモニタリングは密なセンサ網に頼ってきたが、設置・維持・データ処理の費用と計算負荷が大きい（抄録）。", "p3": "車両-橋梁相互作用（VBI）の力学モデルとベイズ推論を組み合わせ、少ないセンサの応答から橋の物理パラメータを更新して劣化と環境の不確実性を捉える。情報エントロピーに基づく最適センサ配置で観測性を高める（抄録）。", "p4": "代表的な高速鉄道橋の数値解析で、密なセンサ網の場合と推定精度・計算負荷を比べた（抄録）。精度の指標は抄録からは未確認。", "p5": "少数センサのベイズ枠組みは、密なセンサ網と同等のパラメータ推定精度を達成し、計算負荷を1桁減らしたとしている（抄録）。具体的な誤差の数値は抄録にない。", "p6": "検証は数値解析のみで、実橋での検証はない（抄録）。解釈：どのベイズ推論アルゴリズムを使ったか、車両モデルの詳細などが抄録では具体的でなく、掲載誌も工学の専門誌ではないため、方法の妥当性は本文で慎重に確かめる必要がある。", "unverified": "本文を読めず、推論アルゴリズム、推定したパラメータ、精度の数値は確認できなかった。"}}, {"rank": 6, "theme": "LLM熟議・ペルソナ", "headline": "LLMの性別バイアスは正確さでなく言葉に出る", "title": "Sex and gender bias in large language models: an old problem at a new scale", "url": "https://doi.org/10.1136/bmjhci-2026-102380", "authors": "Chiara Barbati ほか", "date": "2026-09-27", "venue": "BMJ Health and Care Informatics", "sjr": 1.395, "id": "jr06", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "LLMの性別バイアスは正確さのベンチマークでは見えず、生成される言葉遣いに現れるとして、性差医療の知見に基づき、性・ジェンダー別の評価、ベンチマーク設計への性差医療の専門家の参加、導入後の層別モニタリングを提言した論考（抄録）。", "p2": "患者が健康情報をLLMに求めるようになり、患者集団によって出力が一貫しないことが公衆衛生の懸念になっている。属性によるバイアスは作り話（fabrication）よりも見えにくい（抄録）。", "p3": "実証研究ではなく、性差医療（gender medicine）の証拠と既存の報告を整理する論考である（抄録）。性別バイアスが最も一貫して報告され、臨床記録や推論に影響し、民族や社会経済的地位などと重なって増幅されることを論じる（抄録）。", "p4": "データによる検証はない（論考）。", "p5": "必要な方法はすでに存在しており、未解決なのはジェンダーの公平を設計要件として扱うか、結果が無視できなくなるまで放置するかだと結論している（抄録）。", "p6": "論考であり、提言の効果は検証されていない（抄録からの解釈）。", "unverified": "本文を読めず、引用された具体的な研究と数値は確認できなかった。"}}, {"rank": 7, "theme": "LLM熟議・ペルソナ", "headline": "LLMが描く研究者の心の健康には偏りがある", "title": "PhDGPT: Measuring bias in academic mental health across quantised and uncensored LLMs", "url": "https://doi.org/10.1016/j.ipm.2026.105173", "authors": "Edoardo Sebastiano De Duro ほか", "date": "2026-09-26", "venue": "Information Processing & Management", "sjr": 1.845, "id": "jr07", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "p1": "LLMに博士課程の学生・教授のペルソナ（性別2×職位2）で抑うつ・不安・ストレス尺度（DASS-42）に答えさせた合成データPhDGPTを作り、LLMが描く研究者の心の健康に偏りがあること、量子化など実行環境で心理的構造の再現が崩れることを示した（抄録）。", "p2": "LLMは学術界の心の健康をどう描くのか、その偏りや、量子化・検閲解除などの実行条件が心理測定の回答の質にどう影響するのかは調べられていなかった（抄録）。", "p3": "GPT-3.5とGPT-OSS-20bに、15の学術的な出来事、2つの性別ペルソナ、2つの職位で、DASS-42の42項目への回答と平易な説明を300回ずつ生成させ、各モデル18,000件のデータを作った（抄録）。39,000件超の人の回答と因子構造を比べ、言語的な特徴と心理的次元の相関も分析した（抄録）。", "p4": "人の回答と同じ不安・ストレス・抑うつの構造を再現できるか、ペルソナ間の差の向きが人の研究結果と一致するかで評価した。頑健性確認として4通りの言い換えプロンプトと3つの追加のオープンモデル（Mistral Small 24bと検閲解除版2つ）を使った（抄録）。", "p5": "両モデルとも博士課程の学生を演じると教授より苦痛が高く、人の近年の結果と同じ向きだった（抄録）。GPT-3.5は不安・ストレス・抑うつの標準的な構造を再現したが、GPT-OSSはvLLMでの推論では再現し、LM StudioのGGUF量子化では再現せず、心理的次元と相関する言語パターンも少なかった（抄録）。心理言語的な特徴はプロンプトの言い換えに頑健だった（抄録）。", "p6": "著者は、安全性調整（alignment）は劣化の説明候補の1つにすぎず、構造や学習手順の違いもありうるとしている（抄録）。解釈：合成回答の「偏り」は学習データ中の言説の反映でもあり、実際の研究者の状態を推定する道具ではない。", "unverified": "本文を読めず、ペルソナ間の差の大きさと因子構造の適合度の数値は確認できなかった。"}}, {"rank": 8, "theme": "サービス・マーケティング", "headline": "配膳ロボットの顧客価値を必要条件分析で検証", "title": "How do service robots generate customer value? Rethinking service robot acceptance model (sRAM) through necessary condition analysis", "url": "https://doi.org/10.1016/j.actpsy.2026.107875", "authors": "Arun Kumar Tarofder ほか", "date": "2026-09-25", "venue": "Acta Psychologica", "sjr": 0.918, "id": "jr08", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "p1": "配膳ロボットのあるレストランで、機能・社会・関係・個人の4要因が顧客価値をつくり、それが再来店・口コミ・ロボットとの親しみを生む経路を示し、世代ごとに価値のつくられ方が違うことを必要条件分析などで明らかにした（抄録）。", "p2": "サービスロボット受容モデル（sRAM）は導入・受容の説明が中心で、利用後に顧客価値がどう生まれ、忠誠や口コミにつながるかは十分に扱われていなかった（抄録）。", "p3": "クアラルンプールのロボット導入レストランで客351人に現地で調査し、2段階のPLS-SEMで4つの2次因子→顧客価値→3つの利用後の結果を推定した。世代（ベビーブーマー、X、Y、Z）の多母集団分析、ファジィ集合質的比較分析（fsQCA）、必要条件分析（NCA：ある水準の結果に「必ず必要な」条件を特定する方法）を組み合わせた（抄録）。", "p4": "構造方程式の経路係数と、世代ごとの高い顧客価値に至る条件の組み合わせ（等結果性）で評価した（抄録）。係数の数値は抄録からは未確認。", "p5": "関係的・機能的要因が顧客価値の最も強い予測因子で、社会的・個人的要因が続き、顧客価値は再来店・口コミ・親しみを一貫して予測した（抄録）。世代別には、ベビーブーマーは機能・関係・社会の組み合わせ、X世代は社会的手がかり、ミレニアル世代は個人と関係、Z世代は主に機能的性能に頼った（抄録）。", "p6": "1都市の横断的な現地調査で、意図の測定であり実際の再来店は測っていない（抄録からの解釈）。解釈：世代ごとの標本数が小さいと多母集団分析とfsQCAの結果は不安定になりうる。", "unverified": "本文を読めず、経路係数、世代別の標本数、NCAの結果の数値は確認できなかった。"}}, {"rank": 9, "theme": "VBI・橋梁SHM", "headline": "SHM技術開発を導く「イノベーションの価値」指標", "title": "Value of Innovation as a metric to drive technology development", "url": "https://doi.org/10.1177/14759217261483278", "authors": "Giancarlo Costa ほか", "date": "2026-09-27", "venue": "Structural Health Monitoring", "sjr": 1.364, "id": "jr09", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "建設・インフラ分野の新技術（例：SHMの計測技術）について、利用場面で生む便益を事前に予測する「イノベーションの価値（Value of Innovation, VoIn）」を意思決定価値分析から定式化し、技術開発と普及の指針にする枠組みを示した（抄録）。", "p2": "老朽インフラと限られた資源のもとで、情報システム・補修戦略・維持管理の技術を体系的に開発・普及させる必要があるが、開発段階で技術の価値を定量化して性能仕様や運用方法を選ぶ枠組みがなかった（抄録）。", "p3": "情報の価値（value of information）、行動の価値、情報と行動の価値の予測を、イノベーションの視点から再解釈してVoInを定義する。相対的優位性・複雑さ・両立性・観察可能性・試用可能性といった普及理論の属性も意思決定価値の定量化に組み込み、技術成熟度（TRL）に合わせて概念ベース・実験ベース・運用ベースの3段階の定量化を導入する（抄録）。", "p4": "精度の異なる2つの走行中重量計測（weigh-in-motion）技術の開発と普及を、概念ベースの価値定量化で最適化する例を示し、既存の事例研究を枠組みに分類した（抄録）。", "p5": "VoInは新技術の性能特性や運用モードの選択、商業化の指針になりうることを示し、既存事例の分類から研究開発のギャップを特定したとしている（抄録）。2つの技術のどちらがどれだけ価値が高いかの数値は抄録にない。", "p6": "例示は概念ベースの定量化にとどまり、運用データでの検証は抄録にない（抄録からの解釈）。解釈：価値の予測は利用シナリオとモデル（事前分布、費用）に強く依存する。", "unverified": "本文を読めず、VoInの式と、weigh-in-motionの例の結果は確認できなかった。"}}, {"rank": 10, "theme": "会計情報科学", "headline": "慈善団体の成果報告義務は重要性の判断で形づくられる", "title": "Zooming Into Standard Implementation: Materiality and Institutional Work in Mandatory Charity Performance Reporting", "url": "https://doi.org/10.1111/faam.70052", "authors": "Cherrie Yang ほか", "date": "2026-09-27", "venue": "Financial Accountability and Management", "sjr": 1.136, "id": "jr10", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "世界で唯一、慈善団体に非財務の成果報告（performance reporting）を義務づけたニュージーランドで、基準設定主体と規制当局がその義務をどう実装したかを、場所・文書・デジタル基盤などの「物質性」と制度的作業の視点から描いた（抄録）。", "p2": "資金提供者や規制当局は慈善団体に「何を変えたか」の報告を求めるが、団体側は範囲の設定・測定・報告が難しいとし、義務化が実際にどう実装されるかはほとんどわかっていなかった（抄録）。", "p3": "制度的作業（institutional work：制度をつくり、維持し、変える行為者の意図的な活動）の理論に基づき、会計基準設定主体と慈善団体規制当局の文書の広範な分析と詳細な面接を行った（抄録）。", "p4": "質的研究であり、数量的な検証はない（抄録）。", "p5": "実装は、状況に応じて変化する物質的な配置によって、規制変更を慈善団体にとって正当で実行可能なものにすることで達成された（抄録）。物理的な場所や文書、のちにはデジタル基盤が中心的役割を果たし、教育・関与・継続を支える「足場」になる一方で、制約を持ち込む「複雑化要因」にもなった（抄録）。", "p6": "1か国の事例研究で、他国への一般化には限界がある（抄録からの解釈）。報告の質や団体の行動への効果は測っていない。", "unverified": "本文を読めず、面接の対象者数と具体的な事例は確認できなかった。"}}, {"rank": 11, "theme": "位相空間・土木三力学", "headline": "トンネル漏水侵食と覆工応答をCFD-DEM-FEMで連成", "title": "Investigating tunnel seepage erosion and induced structural mechanical response using CFD-DEM-FEM method", "url": "https://doi.org/10.1016/j.tust.2026.108129", "authors": "Chuang Zhou ほか", "date": "2026-09-20", "venue": "Tunnelling and Underground Space Technology", "sjr": 2.041, "id": "jr11", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "p1": "トンネルのセグメント間のき裂から地下水とともに砂が流出する浸食を、CFD-DEMで粒子移動と浸透流を、FEMで覆工の力学応答を扱う多階層連成で解析し、き裂の幅で3つの浸食モードに分かれることなどを示した（抄録）。", "p2": "セグメント間のき裂からの浸透浸食はトンネルの長期安定を脅かすが、浸食の進展と、それが覆工の力学挙動に与える影響は十分にわかっていなかった（抄録）。", "p3": "CFD-DEMで土粒子の移動、浸透流、微視的な力の鎖（force chain）の変化を計算し、得られた粒子-構造の相互作用力をFEMの覆工モデルに渡して応力を評価する。き裂幅、き裂位置、土被り、地下水位を変えたパラメータ解析を行った（抄録）。", "p4": "土の損失量、地表変位、粒子の移動軌跡、力の鎖、覆工の引張応力で評価した（抄録）。実測・実験との比較の有無は抄録からは未確認。", "p5": "き裂幅によって3つの異なる浸食モードが現れた（抄録）。き裂位置は浸食域の広がりを大きく変え、土被りと地下水位が大きいほど土の損失が増えた（抄録）。き裂がクラウン（天端）からインバート（底部）へ移ると、周辺地盤が上載圧を伝える能力が下がり、覆工の引張応力と損傷の可能性が高まった（抄録）。", "p6": "著者自身が、得られたのは定性的な理解だと述べている（抄録）。解釈：CFD-DEMの計算規模の制約から粒子の拡大や領域の縮小をしている可能性があり、実規模への換算は本文での確認が必要。", "unverified": "本文を読めず、3つの浸食モードの定義とき裂幅の閾値、応力の数値は確認できなかった。"}}, {"rank": 12, "theme": "位相空間・土木三力学", "headline": "乾いた粒状流が湿った層を削る速度の尺度則", "title": "Wet granular bed eroded by a dry granular flow", "url": "https://doi.org/10.1122/8.0001212", "authors": "Lama Braysh ほか", "date": "2026-09-22", "venue": "Journal of Rheology", "id": "jr12", "explain": {"basis": "本文", "basis_note": "オープンアクセス版（Archimer）の本文PDF（数値手法、結論の節と図1〜8のキャプション）を読んだ。理論枠組みの節の導出は読み切れていない", "preprint": false, "p1": "液架橋で凝集した湿った粒子層が、その上を流れる乾いた粒状流に削られる速さを3次元DEMで調べ、浸食速度が慣性数Iと凝集指数ξの比で決まる尺度則にまとまること、急速な浸食の開始条件を運動・圧力の応力の幾何平均と凝集強度の比で表せることを示した（抄録、結論）。", "p2": "土石流や工業的な粉体輸送では、流れが湿った（凝集した）層を取り込むが、浸食のしきい値をせん断応力だけで表す従来の見方では、流れの慣性の役割が捉えられていなかった（結論）。", "p3": "傾斜した粗い剛な面の上に湿った粒子層（3,500個）と乾いた粒子層（4,000個）を重ね、重力で乾いた層を流す（図1・2）。粒子間の法線力は線形弾性と粘性減衰の和に毛管力を加え、液体は振り子状態（pendular state）の液架橋として2体間の力則で表し、界面での液架橋の不可逆な破断で浸食が起こる（§数値手法）。表面張力γsを8×10⁻³〜4×10⁻² N/m、傾斜角θを25°〜32°で変えた（図7のキャプション）。", "p4": "界面の粒子数で正規化した浸食粒子数の時間変化と、表面浸食速度Keを、慣性数Iと凝集指数ξの無次元空間で整理し、データが1本にまとまるか（データの崩壊）で評価した（図6〜8）。", "p5": "浸食粒子数は時間に対して非線形に増え、その速度は傾斜角とともに急増した（図6）。浸食には、平均応力が降伏しきい値より小さく乾いた流れの粒状温度の揺らぎで活性化される遅い確率的な領域と、界面の力学的不安定による速い集団的な領域があり、速い領域の浸食速度は拘束圧と凝集エネルギーの競合から導いた時間尺度で規格化すると、I/ξの関数として1本にまとまった（結論、図8）。急速な浸食の条件は √(σkσp) ≥ bσc（運動応力と拘束応力の幾何平均が凝集強度を超える）で表された（結論）。", "p6": "著者は、液体の粘性（潤滑力）を無視しており、高いせん断速度や粘性の高い液体では粘性散逸を入れる必要があること、浸食された粒子の再凝集を扱っていないことを限界に挙げている（結論）。解釈：粒子数は数千個規模で、粒径分布や非球形粒子への一般化は未確認。", "unverified": "理論枠組みの節の尺度則の導出と、定数bの値は確認できなかった。"}}, {"rank": 13, "theme": "都市・インフラ政策", "headline": "スマホのWiFi信号で歩行者を数えるRツール", "title": "WiFi sensing for urban analytics: An open-source R toolkit", "url": "https://doi.org/10.1177/23998083261492368", "authors": "Juhyeon Park ほか", "date": "2026-09-27", "venue": "Environment and Planning B: Urban Analytics and City Science", "sjr": 1.018, "id": "jr13", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "スマートフォンが発するWiFiパケットを受動的に拾って歩行者を計測する手法について、センサの組み立てから5つの都市分析指標（位置・人数・軌跡・再訪・活動）の算出までを一貫して行うオープンソースのRツールキットを、約2,050万件の擬似匿名化データとともに公開した（抄録）。", "p2": "WiFiセンシングは通行量の推定や交通・公共空間の研究に使われてきたが、実装は個々の設置に結びつき、処理の全工程が再利用可能なコードとサンプルデータとして公開されることはまれだった（抄録）。", "p3": "生のWiFi観測を、Location（位置）、Count（人数）、Track（軌跡）、Revisits（再訪）、Activities（活動）の5指標に変換する処理を、実行可能なコード付きのオンライン書籍として文書化した（抄録）。背景：MACアドレスのランダム化が広がると同一端末の追跡が難しくなるため、指標の定義と処理の透明性が重要になる。", "p4": "大学キャンパス（24センサ、26日間）と商業地区（17センサ、9日間）の2つの現地設置で、時間的リズム、起終点の流れ、観測された来訪頻度、街路の種類による推定滞在の違いを指標で描けるかを示した（抄録）。", "p5": "2つの設置で、5指標が時間帯のリズム、起終点の流れ、来訪頻度、街路の種類ごとの滞在の違いを記述できることを示した（抄録）。コードと約2,050万件の擬似匿名化WiFi観測を公開リポジトリに保存した（抄録）。", "p6": "MACアドレスのランダム化の広がりを著者も意識しており、長期の同一端末の追跡に基づく指標（再訪など）の精度は下がりうる（抄録からの解釈）。計測値と実際の歩行者数との検証の有無は抄録からは確認できない。", "unverified": "本文を読めず、実測の通行量との照合結果と、プライバシー処理の詳細は確認できなかった。"}}, {"rank": 14, "theme": "都市・インフラ政策", "headline": "REIT化した商業空間で小規模店が追い出される", "title": "Class-monopoly rent and contested retail spaces under financialization: Small businesses, landlord power, and policy interventions in Singapore and Hong Kong", "url": "https://doi.org/10.1177/0308518x261480524", "authors": "Mingze Bai ほか", "date": "2026-09-27", "venue": "Environment and Planning A", "sjr": 1.742, "id": "jr14", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "香港とシンガポールで商業施設の多くが不動産投資信託（REIT）に集中した結果生じる大家と小規模小売店の対立を、「階級独占地代（class-monopoly rent）」という概念で分析し、独占力は都市全体ではなく部分市場の単位で最も強く現れることを示した（抄録）。", "p2": "金融化のもとで大家の力が強まり小規模店が不利になっているが、大家側は「市場に任せるべき」と介入に反対する言説を持ち、小規模店を守る政策の根拠づけが必要だった（抄録）。", "p3": "空間・資本・権力の絡み合いを捉える発見的なレンズとして階級独占地代の概念を導入し、2都市の小売空間をめぐる争いと政策介入を比較する（抄録）。背景：独占地代は、立地の希少性などにより市場で競争的に決まらない超過的な地代を指す。", "p4": "比較事例研究であり、数量的な検証は抄録にない。", "p5": "大手大家の独占力は都市全体よりも部分市場の単位で最も明確で、小規模店は構造的に不平等な交渉を強いられていた（抄録）。香港での公有市場の新設、シンガポールでの義務的な賃貸借のガバナンス枠組みといった政策介入の意義を示した（抄録）。", "p6": "2都市の事例に基づく理論的な議論で、介入の効果（賃料や店舗の存続）の定量的な評価は抄録にない（抄録からの解釈）。", "unverified": "本文を読めず、データ（面接・資料）の範囲と、部分市場の定義は確認できなかった。"}}, {"rank": 15, "theme": "職場AI・組織行動", "headline": "デジタルノマドのwell-beingとテクノストレス", "title": "How locus of control shapes digital nomads’ subjective well-being: the mediating roles of telepressure, technostress, and boundary control", "url": "https://doi.org/10.1186/s40359-026-05635-7", "authors": "Qi Cao ほか", "date": "2026-09-26", "venue": "BMC Psychology", "id": "jr15", "explain": {"basis": "抄録", "basis_note": "BMC Psychologyの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "デジタルノマド540人の調査で、統制の所在（locus of control）はwell-beingに直接は効かず、テクノストレス・テレプレッシャーの低下と境界管理の向上を通じて効くこと、境界管理が最も強い予測因子であることを示した（抄録）。", "p2": "自律性が高いが制度的な支えの弱いデジタルノマドの働き方が広がるなか、どの心理的な仕組みがwell-beingを左右するのかは十分にわかっていなかった（抄録）。", "p3": "仕事の要求度-資源（JD-R）モデルと資源保存（COR）理論に基づき、統制の所在→テクノストレス・テレプレッシャー（すぐ返信しなければという圧力）・境界管理→主観的well-beingの媒介経路と、対面の社会的交流による調整効果を仮定した（抄録）。オンラインのリモートワーク・ノマドのコミュニティで募った540人の回答をPLS-SEM（ブートストラップ5,000回）で分析した（抄録）。", "p4": "直接効果・間接効果の有意性と、調整効果の有意性で評価した（抄録）。係数の数値は抄録にない。", "p5": "統制の所在は主観的well-beingに直接効かず、内的統制が強いほどテクノストレスとテレプレッシャーが下がり、境界管理が上がり、それらを通じてwell-beingが高まった（抄録）。境界管理が最も強い正の予測因子で、対面の社会的交流はテレプレッシャーの負の効果を有意に緩和した（抄録）。", "p6": "オンラインのコミュニティで募った横断調査で、自己報告のみのため共通方法バイアスと逆因果を排除できない（抄録からの解釈）。著者は、well-beingは働き方の柔軟性そのものより、デジタルな要求と心理的境界を管理する力に依存すると結論している（抄録）。", "unverified": "本文を読めず、経路係数と説明率、回答者の属性は確認できなかった。"}}, {"rank": 16, "theme": "位相空間・土木三力学", "headline": "ミンコフスキー和で土・岩混合体をDEMでモデル化", "title": "3D mesostructural modeling and DEM simulation of soil-rock mixtures using Minkowski sums", "url": "https://doi.org/10.1016/j.compgeo.2026.108618", "authors": "Jie Xu ほか", "date": "2026-09-21", "venue": "Computers and Geotechnics", "sjr": 1.957, "id": "jr16", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "土と岩塊の混合体（soil-rock mixture）の3次元メソ構造を、ミンコフスキー和で岩塊の間隔と一様性を制御しつつ生成し、個別要素法（DEM）で圧縮破壊を再現する枠組みを示した（抄録）。", "p3": "ミンコフスキー和による膨張で粒子間隔を調整し、凹形状の岩塊をDEMのクランプで表し、境界配置アルゴリズムで周期的なランダム充填を作る。岩塊・土マトリクス・界面に異なる性質の粘着要素を埋め込んで圧縮損傷の進展を計算した（抄録）。", "p5": "数値試験は実験データとよく一致し、粘着要素による界面強度が巨視的な応答を支配し、ピーク強度と延性を高めることが示された（抄録）。", "unverified": "実験との一致度の数値は未確認。"}}, {"rank": 17, "theme": "位相空間・土木三力学", "headline": "粒度分布とジオグリッドの引抜き抵抗の3次元DEM", "title": "Unravelling the influence of polydispersity and geogrid properties on soil-geogrid interaction mechanisms with 3D DEM: Macro-Micro insights on pullout test", "url": "https://doi.org/10.1016/j.compgeo.2026.108649", "authors": "Amrisha Khandelwal ほか", "date": "2026-09-21", "venue": "Computers and Geotechnics", "sjr": 1.957, "id": "jr17", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "ジオグリッドの引抜き試験を3次元DEMで再現し、粒度の多分散性、グリッドの引張剛性、横部材の厚さ、目合いと平均粒径の比が土-グリッドの相互作用をどう支配するかを粒子スケールで調べた（抄録）。", "p3": "異なる垂直応力のもとで、多分散性、グリッドの引張剛性、横部材の厚さ、目合い/平均粒径比を変え、粒子の運動、接触の力学、粒子の連結性と力の鎖による荷重伝達を時空間的に解析した（抄録）。", "p5": "多分散性が粒子の回転の空間分布を支配し、細かい粒子ほど大きく回転することなどを示した（抄録）。", "unverified": "抄録後半の結論は未確認。"}}, {"rank": 18, "theme": "位相空間・土木三力学", "headline": "サクションバケット貫入時のパイピングをLBM-DEMで解析", "title": "Fully-resolved micromechanica ian–Laird）メタ分析と、一段階のロバスト誤差メタ回帰による用量反応分析を行った（方法）。摂取量は総摂取重量・エネルギーの10%あたり、100 g/日あたり、週10サービングあたりで表した（統計解析）。", "p4": "統合ハザード比（HR）と95%信頼区間、異質性（I²など）、出版バイアス（10研究超でEgger検定）、leave-one-out感度分析、GRADEによる証拠の確実性で評価した（統計解析）。", "p5": "最多群は最少群に比べ、心血管イベントHR 1.24（95%CI 1.14–1.36）、がん1.12、肥満/過体重1.23、代謝症候群/糖尿病1.24、うつ/不安1.27、消化器疾患1.31、全死亡1.18だった（抄録）。100 g/日増えるごとに心血管イベントHR 1.14、がん1.04、全死亡1.03、代謝症候群/糖尿病1.02だった（抄録）。GRADEの確実性は肥満/過体重が中程度、多くの結果が低、高血圧は非常に低だった（エビデンスの質）。", "p6": "著者は、すべて自己申告の食事調査で加工の特徴や下位分類を捉えきれない曝露の誤分類、18歳未満の除外、10研究未満の結果で出版バイアスを評価できないこと、コホートが欧米に偏りアジアが少ないこと、観察研究ゆえの残余交絡を限界に挙げている（長所と限界）。解釈：超加工食品の摂取は他の生活習慣と強く結びつくため、関連の大きさを因果効果と読むことはできない。", "unverified": "補足表（研究ごとの推定値、サブグループ解析）は確認していない。"}}, {"rank": 2, "field": "医療経済・医療政策", "headline": "腰部脊柱管狭窄症の低侵襲手術は10年で費用対効果が高いか", "title": "Cost-Effectiveness of Minimally Invasive Tubular vs. Open Laminectomy for Pure Lumbar Spinal Stenosis: A Markov State-Transition Analysis", "url": "https://doi.org/10.1177/21925682261494612", "authors": "Rohan A. Phadke ほか", "date": "2026-09-27", "venue": "Global Spine Journal", "sjr": 1.306, "why": "マルコフ状態遷移モデルで、低侵襲の管状除圧と従来の椎弓切除の10年間の費用対効果を米国の支払者の立場から比較した。", "id": "jn02", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "不安定性や変形のない純粋な腰部脊柱管狭窄症で、低侵襲の管状除圧術は従来の椎弓切除術よりQALYがわずかに多く1人あたり4,167ドル安い（優位 dominant）という10年間の費用対効果を、マルコフモデルで示した（抄録）。", "p2": "腰部脊柱管狭窄症は高齢者の脊椎手術で最も多い適応で、低侵襲手術と開放手術の1年後の成績は同等だが、長期の費用対効果はわかっていなかった（抄録）。", "p3": "65歳の純粋な狭窄症患者1万人の模擬コホートで、5状態のマルコフ状態遷移モデル（3か月周期、10年、年3%の割引）を作った。QALYはSPORT研究のEQ-5D効用値、周術期合併症率は傾向スコアで対応させたコホート（10.6%対14.6%）から取り、再発・術後効用・周術期死亡は両群で同じにした（抄録）。背景：QALY（質調整生存年）は生存年を健康状態の効用で重み付けた指標。", "p4": "米国の支払者の立場で費用とQALYを比べ、一元・閾値・確率的感度分析（PSA）を行い、合併症の差を信頼区間全体で抽出する広い不確実性の分析も加えた（抄録）。基準の支払意思額は5万ドル/QALYと10万ドル/QALY。", "p5": "低侵襲手術は5.95 QALY・26,283ドル、開放手術は5.91 QALY・30,450ドルで、低侵襲が1人4,167ドル安く優位だった（抄録）。5万ドル/QALYでPSAの81%（広い不確実性で82〜88%）が費用対効果ありで、10万ドル/QALYでも合併症率が17.5%を超えない限り費用対効果があった（抄録）。合併症の差がなくても3,454ドル安かった（抄録）。", "p6": "著者は、優位性は合併症の差と初回手術費の低さによるもので、保険適用の判断を決めるものではなく参考にすべきだとしている（抄録）。合併症の差の信頼区間は0をまたいでおり（−2.6〜10.7ポイント）、再発や効用を両群で等しく仮定している（抄録）。", "unverified": "本文を読めず、費用の内訳と状態遷移確率の出典は確認できなかった。"}}, {"rank": 3, "field": "エネルギー材料", "headline": "前駆体段階の分子結合で全ペロブスカイト積層29.63%", "title": "Precursor‐Level Molecular Coupling Enables High‐Fill‐Factor Wide‐Bandgap Perovskite Solar Cells and 29.63% All‐Perovskite Tandems", "url": "https://doi.org/10.1002/adma.75165", "authors": "Kaixin Huang ほか", "date": "2026-09-27", "venue": "Advanced Materials", "sjr": 8.266, "why": "広いバンドギャップのペロブスカイトの前駆体化学を分子で制御し、全ペロブスカイト積層太陽電池で29.63%の変換効率を報告した。", "id": "jn03", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "広いバンドギャップ（約1.78 eV）のペロブスカイトの前駆体溶液に分子（CGBA）を加えて結晶化を制御し、単接合で曲線因子85.89%、全ペロブスカイト2接合（タンデム）太陽電池で変換効率29.63%を報告した（抄録）。", "p2": "全ペロブスカイトタンデムには約1.78 eVの広バンドギャップ層が必要だが、前駆体の化学の複雑さ、制御されない結晶化、欠陥、光によるハロゲンの偏析のため効率と安定性が限られていた（抄録）。", "p3": "CGBA（4-(3-カルバムイミドイルグアニジノ)安息香酸塩酸塩）を前駆体段階の調整剤として加え、鉛ハロゲン化物種や有機陽イオンとの動的な結合で局所環境を変え、スピンコートと焼成の各段階の膜形成を変える（抄録）。これにより結晶化を穏やかにし、配向を促し、トラップによる非放射再結合とハロゲン偏析を抑える。", "p4": "変換効率（PCE）、曲線因子（FF）、封止なしでの窒素中の長期安定性を評価し、他の組成・条件への適用性も調べた（抄録）。", "p5": "1.78 eVの単接合でPCE 21.43%、FF 85.89%で、FFは1.75〜1.79 eVの単接合で最高水準だった（抄録）。他の組成でも1.53 eVで27.32%、1.68 eVで23.91%、1.85 eVで18.75%などを得て、封止なしで窒素中4,500時間後に初期効率の93%を保った（抄録）。タンデムでは研究室測定でPCE 29.63%だった（抄録）。", "p6": "タンデムの29.63%は研究室での測定値で、第三者認証の有無は抄録にない（抄録の表現からの解釈）。安定性は窒素中の評価で、大気・光・熱の複合ストレス下の耐久性は未確認。", "unverified": "本文を読めず、タンデムの構成と認証の有無、光照射下の安定性は確認できなかった。"}}, {"rank": 4, "field": "統計学", "headline": "包含過程のスペクトルギャップは1粒子と一致するか", "title": "One- and Two-Particle Spectral Gap Identities for the Symmetric Inclusion Process and Related Models", "url": "https://doi.org/10.1007/s00220-026-05728-9", "authors": "Seonwoo Kim ほか", "date": "2026-09-27", "venue": "Communications in Mathematical Physics", "sjr": 1.254, "why": "相互に引き合う粒子の拡散モデルで、系のスペクトルギャップが1粒子・2粒子のものと一致する条件と一致しない場合を示した。", "id": "jn04", "explain": {"basis": "本文", "basis_note": "Springerの本文HTML（序論の§1.1–1.4と主結果の定理の位置づけ）を読んだ。証明の節は読んでいない", "preprint": false, "p1": "互いに引き合いながらグラフ上を拡散する多粒子系（対称包含過程 symmetric inclusion process, SIP）で、系全体の緩和の速さ（スペクトルギャップ）が1粒子のランダムウォークのそれと一致するのは拡散が強い領域に限られ、そうでない場合にはギャップが拡散係数に線形に依存することと、拡散が消える極限では2粒子の問題に帰着することを示した（抄録、§1.1–1.3）。", "p2": "著者らの以前の研究で、すべてのサイト重みα_x≥1（対数凹の領域）なら、任意の多粒子のSIPのギャップが1粒子のランダムウォークのギャップに等しいこと（Aldousのスペクトルギャップ予想のSIP版）が示されたが、α_min<1のときに一致するか、どう振る舞うかは未解決だった（§1.1）。背景：スペクトルギャップは生成作用素の最小の非ゼロ固有値で、系が平衡に近づく速さを決める。", "p3": "SIPの固有構造の剛性、任意の拡散係数と粒子数に対するディリクレ形式の精密な比較、遅い-速い系（slow–fast system）の解析手法を組み合わせる（抄録）。既知の不等式 (1∧α_min)gap_RW ≤ gap_SIP ≤ gap_RW（式1.1）から出発し、重みをα_minで規格化してα_minへの依存を分離する（§1.2）。", "p4": "数学の理論研究であり、主張は定理と証明で示される（§2）。", "p5": "α_min<1では一般に gap_SIP < gap_RW となり1粒子の恒等式が破れる（定理2.4、式1.3）。規格化後の不等式からはギャップがα_minの2乗に依存すると予想されるが、実際は一般に線形に依存することを示した（定理2.2、§1.2）。拡散が消える極限では2粒子のスペクトルギャップ恒等式が成り立ち、保存しない（粒子の出入りがある）SIPでは相互作用の強さによらず1粒子の恒等式が常に成り立つ（抄録、§1.3–1.4）。", "p6": "結果は双対なブラウンエネルギー過程にも拡張されるが、一般のディリクレ可逆な系への含意は「示唆」にとどまる（抄録）。解釈：具体的な応用（粒子系のシミュレーションの収束速度など）は論文の範囲外。", "unverified": "定理2.2〜2.4の正確な定数と証明の細部は確認していない。"}}, {"rank": 5, "field": "統計学", "headline": "大学での中退・転科・卒業を競合リスクで分析", "title": "Modelling University Career Paths: A Competing-Risks Analysis of Dropout and Degree Completion at the University of Padova", "url": "https://doi.org/10.1007/s11205-026-03944-3", "authors": "Claudia Franceschini ほか", "date": "2026-09-27", "venue": "Social Indicators Research", "sjr": 0.918, "why": "パドヴァ大学の行政データで、中退・学科変更・卒業を競合するリスクとして同時に扱う生存時間分析を行った。", "id": "jn05", "explain": {"basis": "本文", "basis_note": "Springerの本文HTML（データ・方法・生存分析の結果・考察の節）を読んだ。表3・4の個別の数値は本文の記述の範囲で確認", "preprint": false, "p1": "イタリア・パドヴァ大学の学部生57,097人の行政記録で、中退と卒業を互いに競合する事象として扱う生存時間分析を分野別に行い、学科変更は中退を防がない（人文系を除く）一方で卒業の速度を下げることなどを示した（抄録、§5.2）。", "p2": "イタリアは中退率と修了の遅れが大きいが、多くの研究は古いデータや短い期間に基づき、中退だけに注目して学科変更や卒業を同時に扱っていなかった（§6）。", "p3": "2016/17〜2020/2021年度入学の学部生62,391件の記録から、初年度10月末までの退学、外国の中等教育修了者、成績欠測、2回目以降の在籍などを除いた57,097件を2024年9月時点まで追跡した（§3）。中退と卒業を競合リスクとし、原因別のCox比例ハザードモデルを4つの分野ごとに推定した（§4、§5.2）。共変量は性別、高校の種類と成績、入学形態、居住地、国籍、学科変更、家計の経済指標ISEE（欠測36.6%は別カテゴリ）、就労などである（§3）。", "p4": "原因別ハザード比（HR）で、各要因が中退・卒業の瞬間的なリスクを何倍にするかを評価した（§5.2、表3・4）。", "p5": "高校の成績が1点上がるごとに中退のハザードは約1〜3%下がり（健康系を除く）、卒業のハザードは約2〜4%上がった（§5.2）。職業高校出身は卒業のハザードが最も低く（HR≈0.58〜0.66）、男性は理系でのみ中退しにくく（HR=0.72）、人文・健康・社会系で卒業しにくかった（§5.2）。学科変更は人文系でのみ中退の低下と関連し、すべての分野で卒業のハザードの低下と関連した（§5.2）。家計の経済的資源は中退を防ぎ卒業を促し、入学時の就労は人文・社会系で中退を増やした（§5.2）。", "p6": "著者は、ISEEの欠測が無作為ではない可能性があり解釈に注意が必要としている（§3）。解釈：1大学の観察データで因果関係は示せず、学科変更の効果には変更する学生の選択が交絡しうる。", "unverified": "表3・4の全ハザード比の値は本文の記述にある範囲でのみ確認した。"}}, {"rank": 6, "field": "機械学習", "headline": "AIの逆設計で一重項分裂の候補分子を探索", "title": "Artificial Intelligence‐Driven Inverse Design of Singlet Fission Candidates in the Acene family", "url": "https://doi.org/10.1002/advs.76828", "authors": "Rafael G. Uceda ほか", "date": "2026-09-27", "venue": "Advanced Science", "sjr": 3.288, "why": "約10の19乗の分子空間を、置換基の効果をハメット定数で表す再帰型ニューラルネットで探索し、一重項分裂の候補を見つけた。", "id": "jn06", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "アセン類の約10の19乗の分子空間を、置換基の効果をハメット定数で表す再帰型ニューラルネットと最適化アルゴリズムで探索し、既知のテトラセン・ペンタセン以外にも一重項分裂（singlet fission）の条件を満たすベンゼン・ナフタレン・アントラセン誘導体を見つけた（抄録）。", "p2": "一重項分裂は1つの励起一重項から2つの三重項を生み太陽電池の効率を上げうるが、その条件（S1とT1のエネルギー関係）を満たす分子は直観では見つけにくく、化学空間が膨大で網羅的な計算は難しい（抄録からの背景）。", "p3": "置換基の効果をハメットσ定数で符号化し（未知の官能基にも一般化できる解釈可能な記述子）、ゲート付き再帰ユニット（GRU）のRNNで励起一重項S1と三重項T1のエネルギーを予測する。これを遺伝的アルゴリズムと粒子群最適化につないで、条件を満たすようにS1とT1を最適化し、繰り返し現れる置換パターンを抽出する（抄録）。", "p4": "予測モデルの精度と、既知の候補（テトラセン・ペンタセン）を再発見できるか、新しい候補が一重項分裂の基準を満たすかで評価した（抄録）。精度の指標は抄録からは未確認。", "p5": "既知のテトラセン・ペンタセン候補を再発見したうえで、直観では到達しにくいベンゼン・ナフタレン・アントラセン誘導体の候補を見つけた（抄録）。手法はウェブで公開されている（抄録）。予測誤差の数値は抄録にない。", "p6": "候補の評価は計算による予測で、実験で合成・測定した検証は抄録に記載がない。解釈：学習データの量子化学計算の精度が上限となり、固体中の分子間相互作用（一重項分裂に重要）は考慮されていない可能性がある。", "unverified": "本文を読めず、予測精度と候補分子の具体的な構造は確認できなかった。"}}, {"rank": 7, "field": "機械学習", "headline": "生成モデルで超広帯域の完全吸収体を設計し実証", "title": "Generative AI‐Enabled Discovery and Experimental Demonstration of Ultra‐Broadband Epsilon‐Near‐Zero Perfect Absorbers", "url": "https://doi.org/10.1002/advs.77966", "authors": "David Dang ほか", "date": "2026-09-27", "venue": "Advanced Science", "sjr": 3.288, "why": "生成型ニューラルネットで多層薄膜の設計分布を学習し、記録的な広帯域の吸収体を設計して実験で示した。", "id": "jn07", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "生成型の深層ニューラルネットで多層薄膜の設計分布を学習し、厚さ160 nm未満で近赤外の1,000 nm以上の帯域にわたり98%を超える吸収を示すイプシロン・ニア・ゼロ（ENZ）吸収体を設計・作製・実証した（抄録）。", "p2": "広帯域の完全吸収体はエネルギー変換やセンシングに有用だが、屈折率・層の並び・厚さの組み合わせは膨大で、薄さと広帯域を両立する設計は難しい（抄録からの背景）。背景：ENZ材料は誘電率がほぼゼロになる波長域を持ち、薄い層で強い光吸収を起こせる。", "p3": "生成ネットワークが高性能な多層設計の確率分布を学び、広帯域吸収を最大化するように屈折率・層配置・厚さを最適化する（抄録）。得られた最適構造を実際に作製して測定した。", "p4": "近赤外での吸収率と帯域幅、全体の厚さで評価した（抄録）。比較対象（従来設計や他の最適化法）の詳細は抄録からは未確認。", "p5": "最適化した構造は、近赤外で1,000 nmを超える帯域にわたって98%を超えるほぼ完全な吸収を示し、厚さは160 nm未満だった（抄録）。著者は記録的な広帯域性能としている。", "p6": "角度依存性、偏光依存性、高温での安定性など実用上の特性は抄録からは確認できない。解釈：「記録的」の比較基準（どの先行研究と比べたか）は本文で確認が必要。", "unverified": "本文を読めず、材料の構成、比較対象、角度依存性は確認できなかった。"}}, {"rank": 8, "field": "機械学習", "headline": "酵素の反応回転数を予測し改変を導く深層学習", "title": "Predicting Enzyme Turnover Numbers and Enabling Rational Enzyme Evolution", "url": "https://doi.org/10.1002/advs.77789", "authors": "Fengya Ge ほか", "date": "2026-09-27", "venue": "Advanced Science", "sjr": 3.288, "why": "酵素配列と反応の表現を相互注意で融合する深層学習で回転数を予測し、酵素の合理的改変に使えることを示した。", "id": "jn08", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "酵素の配列と反応の表現を相互注意で融合する深層学習MCKcatで酵素の反応回転数（kcat）を予測し、その予測で絞り込んだラッカーゼの変異体20個のうち15個（75%）で耐熱性と活性が同時に向上したことを実験で示した（抄録）。", "p2": "kcat（酵素1分子が単位時間に処理する基質の数）は生体触媒の中心的な指標だが、実験での測定は手間がかかり、既存の計算法は酵素と反応の相互作用を十分にモデル化できていなかった（抄録）。", "p3": "多スケールの畳み込みで特徴を抽出し、酵素配列と反応のフィンガープリントの表現を相互注意で双方向に融合してkcatを予測する（抄録）。野生型と多数の変異体を含む33,396件の酵素-反応データセット（MCKcat-DB）を構築した。応用では、合理設計で217個の耐熱性変異体候補を作り、MCKcatで20個に絞り込んだ（抄録）。", "p4": "2つのベンチマークの多様な予測場面で既存手法と比べ、応用では絞り込んだ変異体の耐熱性とkcatを実験で測った（抄録）。", "p5": "MCKcatは2つのベンチマークで競争力のある性能を示した（抄録）。Bacillus aryabhattai由来のラッカーゼでは、選んだ20個のうち15個（陽性率75%）が耐熱性とkcatの両方で向上した（抄録）。ウェブサーバーも公開した。", "p6": "ベンチマークでの性能は「競争力がある」との表現で、既存手法を明確に上回るかは抄録からは確認できない。解釈：陽性率75%は合理設計の段階で耐熱性の候補に絞った後の値で、MCKcat単独の寄与の大きさは比較対照（ランダムに選んだ場合など）がないと評価しにくい。", "unverified": "本文を読めず、ベンチマークでの具体的な数値と比較手法は確認できなかった。"}}, {"rank": 9, "field": "組織行動・心理的安全性", "headline": "デジタルリーダーシップの効果は教員の経験で変わる", "title": "Digital leadership and teachers’ ICT competency: The moderating role of teaching experience", "url": "https://doi.org/10.30935/cedtech/19437", "authors": "Jing Cai ほか", "date": "2026-09-27", "venue": "Contemporary Educational Technology", "sjr": 1.555, "why": "大学教員の調査で、組織のデジタルリーダーシップとICT能力の関係が教職経験によって調整されるかを検証した。", "id": "jn09", "explain": {"basis": "本文", "basis_note": "出版社PDFの本文（方法の概要、結果の節、限界の節と表1〜3・図1〜3のキャプション）を読んだ", "preprint": false, "p1": "中国の大学教員397人の調査で、組織のデジタルリーダーシップの知覚は教員のICT能力と強く関連するが、その関連は教職経験の浅い教員で強く、経験の長い教員ではほとんど見られないことを示した（抄録、表3）。", "p2": "高等教育のデジタル化では組織のデジタルリーダーシップが有益だとされるが、その恩恵がすべての教員に等しく及ぶかは不明だった（抄録）。", "p3": "技術-組織-環境（TOE）の枠組みと社会的認知理論を補完的な視点とし、デジタルリーダーシップ（5次元）とICT能力を既存尺度の自己報告で測る横断調査を行った（§方法）。2次因子の構造方程式モデル（Amos）で関連を推定し、教職経験との交互作用を合成得点の回帰で検定した（§方法、表3）。", "p4": "モデル適合（χ²/df、CFI、TLI、RMSEA、SRMR）、標準化経路係数β、交互作用項の有意性で評価し、共通方法バイアスは完全共線性検定などで確認した（§方法、表2のキャプション）。", "p5": "2次因子モデルの適合は良好で（CFI=0.988）、デジタルリーダーシップとICT能力の関連はβ=0.724（p<.001）、5次元はβ=0.143〜0.255ですべて正で、次元間の差は有意ではなかった（§結果）。交互作用は負で有意（B=−0.655、p<.001）で、説明率は経験の浅い群でR²=.829、経験の長い群でR²=.021と報告されている（§結果、表3）。", "p6": "著者は、横断的な自己報告の調査で因果の向きを確定できないことを第一の限界に挙げている（§限界）。解釈：群別のR²の差は非常に大きく、測定や群分けの仕方に依存する可能性があるため、他の標本での再現が必要である。", "unverified": "群分けの基準（教職経験の閾値）と、限界の節の後半は確認していない。"}}, {"rank": 10, "field": "社会学", "headline": "上昇移動する学生は同化か抵抗かの二択ではない", "title": "Beyond the Cleft Habitus: Cultural Resistance and Study Methods in Upward Educational Mobility. An Autoethnographic Socioanalysis", "url": "https://doi.org/10.1177/00380261261489917", "authors": "Fiorenzo Parziale", "date": "2026-09-27", "venue": "Sociological Review", "sjr": 1.16, "why": "自己エスノグラフィーとブルデュー理論の対話で、労働者階級出身の学生が文化的抵抗と学習方法で分裂したハビトゥスを乗り越える道を示した。", "id": "jn10", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "労働者階級出身で教育によって上昇移動する学生は、中産階級文化への全面的な同化か、対抗的なアイデンティティへの退却かの二択に迫られるという前提に異を唱え、出自を裏切らずに公的な知を身につける「裏切りなき変化」の道筋を自己社会分析から示した（抄録）。", "p2": "上昇移動の社会学は、出自と到達先の場の間で引き裂かれた「分裂したハビトゥス（cleft habitus）」と心理社会的な不安を強調し、近年も「社会的な宙づり」や「カメレオン的態度」といった概念で説明してきたが、それを超える可能性は論じられていなかった（抄録）。", "p3": "ブルデューの理論とスチュアート・ホールらの英国カルチュラル・スタディーズを対話させ、著者自身の経験を素材とする自己社会分析（auto-socioanalysis）で、資本だけでなくハビトゥスそのものの再転換を検討する（抄録）。背景：ハビトゥスは出自の環境で身につけた知覚・評価・行為の持続的な傾向。", "p4": "理論的・自己民族誌的な研究であり、統計的な検証はない（抄録）。", "p5": "新しい場との出会いの中で、断絶と連続の緊張が生成的な変化を引き起こし、制度が発する「好ましい」メッセージから距離を取る読み方と、ハビトゥスの創造的な変容につながりうることを示した（抄録）。制度は約束を符号化するが、移動する主体はそれを符号化し直せる、という結論（抄録）。", "p6": "1人の経験に基づく自己社会分析で、一般化には限界がある（抄録からの解釈）。どの社会歴史的・制度的条件でこの道筋が可能になるかの比較は今後の課題となる。", "unverified": "本文を読めず、具体的な学習方法の記述と事例の内容は確認できなかった。"}}, {"rank": 11, "field": "社会学", "headline": "重度障害者の現場で感情が知の形を変える", "title": "Feeling the Field: Disconcertment, Epistemic Adhesion and Profound Intellectual and Multiple Disabilities", "url": "https://doi.org/10.1177/03063127261487387", "authors": "Allan Lidström", "date": "2026-09-27", "venue": "Social Studies of Science", "sjr": 1.584, "why": "重度の知的・重複障害者の日中活動施設での調査経験から、感情が調査で何が知りうるかを組み替える過程を論じた。", "id": "jn11", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "スウェーデンの重度の知的・重複障害（PIMD）のある人の日中活動施設での2つの感情的な調査場面から、調査者の不快・親密さ・不安といった感情が、何が「知りうるもの」になるかを組み替えることを論じ、「認識的な付着（epistemic adhesion）」という概念を提案した（抄録）。", "p2": "科学技術社会論（STS）の実践志向の分析では、感情は雑音や私的反応として扱われがちで、重い障害のある人々の経験がどのように知の対象になり、あるいはならないかが問われてこなかった（抄録）。", "p3": "物質記号論（material semiotics）に基づいて始めた調査が、現場での感情的な出会いによって揺さぶられた経験を振り返る反省的な分析（抄録）。感情を、隔離と排除の広い歴史が出会いの中で感じ取られる「記録域」として扱う。", "p4": "質的・理論的な研究であり、統計的な検証はない（抄録）。", "p5": "認識の攪乱の瞬間を指す「困惑（disconcertment）」と対になる概念として、支配的な見方が問い直されずに確認される容易さ・整合を指す「認識的な付着」を提案し、障害が感情的・認識的にどう「利用可能」にされるかを考察した（抄録）。", "p6": "2つの場面に基づく状況的な考察で、他の現場への一般化は意図されていない（抄録からの解釈）。", "unverified": "本文を読めず、2つの場面の具体的な内容は確認できなかった。"}}, {"rank": 12, "field": "医療経済・医療政策", "headline": "院内発症の誤嚥性肺炎は費用と死亡を増やす", "title": "Incidence, Clinical Outcomes and Healthcare Costs of Aspiration Pneumonia in a Tertiary Hospital: A Retrospective Cohort Study", "url": "https://doi.org/10.1111/jocn.70562", "authors": "Josep‐Oriol Casanovas‐Marsal ほか", "date": "2026-09-27", "venue": "Journal of Clinical Nursing", "sjr": 1.397, "why": "943人の後ろ向きコホートで、院内発症と市中発症の誤嚥性肺炎の死亡・在院日数・医療費を比べた。", "id": "jn12", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ある3次医療病院の誤嚥性肺炎943人の後ろ向きコホートで、院内発症は市中発症より死亡・在院日数・医療費が大きく（平均総費用15,163ユーロ対6,406ユーロ）、予防に役立つ嚥下スクリーニングがほとんど使われていなかったことを示した（抄録）。", "p2": "食物や吐物の誤嚥による肺炎は高齢入院患者の重い合併症だが、病院内での発生率と、院内発症と市中発症の転帰・費用の違いは十分に定量化されていなかった（抄録）。", "p3": "2021〜2023年に誤嚥性肺炎と診断された成人入院患者943人を対象に、併存疾患、機能状態、看護の依存度、臨床転帰を多変量モデルで分析し、容量-粘度嚥下試験（Volume-Viscosity Swallow Test）による嚥下障害スクリーニングの実施状況を予防的看護の指標として評価した（抄録）。", "p4": "累積発生率、死亡率、在院日数、医療費を院内発症と市中発症で比べた（抄録）。報告はSTROBEに従った（抄録）。", "p5": "累積発生率は入院100件あたり3.04件で、患者は併存疾患と機能障害の多い高齢者が中心、全体の死亡率は39.3%だった（抄録）。院内発症は市中発症より死亡率が高く在院が長く費用が大きく、平均総費用は15,163ユーロ対6,406ユーロだった（抄録）。嚥下スクリーニングは陽性率が高いにもかかわらず著しく少なくしか使われていなかった（抄録）。", "p6": "1施設の後ろ向き観察研究で、院内発症と市中発症の差には患者の重症度の違いが交絡しうる（抄録からの解釈）。看護師主導のスクリーニングの効果は検証されておらず、提言にとどまる。", "unverified": "本文を読めず、多変量モデルの調整変数と推定値は確認できなかった。"}}, {"rank": 13, "field": "地球科学（総合）", "headline": "地震の破壊過程は上層大気の音波に刻まれる", "title": "Acoustic Wave Signatures of Earthquake Rupture Dynamics in the Upper Atmosphere", "url": "https://doi.org/10.1029/2025jb033013", "authors": "Y. Kaneko ほか", "date": "2026-09-27", "venue": "Journal of Geophysical Research: Solid Earth", "sjr": 1.803, "why": "地震破壊・地震波伝播・大気の連成シミュレーションで、規模・断層型・破壊速度が高度100〜300kmの音波にどう現れるかを調べた。", "id": "jn13", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "地震の動的破壊・地震波伝播・圧縮性の非線形大気を連成した3次元シミュレーションで、震源の性質（規模・断層型・破壊速度）が高度100〜300kmの熱圏の音波にどう刻まれるかを示し、上層大気の観測で震源を推定できる可能性を示した（抄録）。", "p2": "大地震は大気中に音波を生み、GNSS信号などで上層大気の擾乱として観測されるが、震源の性質とその音波の特徴の関係は、非線形な伝播のため単純には結びつけられていなかった（抄録）。", "p3": "亜せん断・超せん断破壊、正断層・逆断層、不均質な破壊、津波地震などの破壊シナリオを、動的破壊・地震波伝播・圧縮性非線形大気モデルの連成で計算し、音波の到達時刻・波形・振幅を比べた（抄録）。", "p4": "数値実験であり、シナリオ間の音波特性の違い（到達時刻、振幅、周期、波形）で評価した（抄録）。観測との比較の有無は抄録からは未確認。", "p5": "超せん断破壊は亜せん断より早く到達し特徴的な波形の音波を生み、正断層は地表の希薄波が衝撃N波に発達するため逆断層よりずっと弱い音波を生んだ（抄録）。断層の不均質性は下層大気では強く効くが上層では弱まり、津波地震は同じモーメントマグニチュードの逆断層と周期は同じで振幅が20〜50%小さかった（抄録）。上層大気の音波振幅を主に支配するのはモーメントマグニチュードではなくエネルギーマグニチュードだった（抄録）。", "p6": "著者は、音波の非線形な発達のため地表と上層大気の信号を単純に比べられず、上層での衝撃波の性質の適切なモデル化が不可欠だとしている（抄録）。解釈：大気の背景状態（風、温度構造）の違いへの感度は抄録からは確認できない。", "unverified": "本文を読めず、計算設定と観測事例との比較は確認できなかった。"}}, {"rank": 14, "field": "神経科学（総合）", "headline": "加齢で予測処理が弱まるのは課題次第", "title": "Brain Network Dynamics of Local and Global Predictive Processing in Aging", "url": "https://doi.org/10.1002/advs.77857", "authors": "Mathias Houe Andersen ほか", "date": "2026-09-27", "venue": "Advanced Science", "sjr": 3.288, "why": "局所と大域の予測処理を分けた脳ネットワークの解析で、加齢による予測誤差反応の変化が課題の要求で異なることを示した。", "id": "jn14", "explain": {"basis": "抄録", "basis_note": "出版社の本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "若年者37人と高齢者40人の脳磁図（MEG）で、音の規則からの逸脱を処理する全脳ネットワークを3つに分けると、加齢は早い感覚的な逸脱反応を強め、遅い認知的な処理を弱めるという選択的な影響を持つことを示した（抄録）。", "p2": "加齢で脳の予測的な反応（ミスマッチ反応）が一様に弱まるという見方が主流だが、研究結果は一貫せず、課題の要求によって加齢の影響が違う可能性があった（抄録）。", "p3": "局所-大域の聴覚パラダイム（局所的な音の逸脱と、系列パターン全体の逸脱を区別する課題）を行った参加者の信号源推定MEGデータを、時間的に重なる全脳ネットワークに分解し、年齢群で比べた（抄録）。ネットワーク間の多変量の再帰性（recurrence）も評価した。", "p4": "ネットワークごとの逸脱反応の大きさと、再帰性・発散の程度を若年群と高齢群で比べた（抄録）。統計量は抄録からは未確認。", "p5": "聴覚皮質と中部帯状回を含むネットワークでは早い感覚的な逸脱反応が高齢者で強く、後の認知的な処理は高齢者で弱かった（抄録）。ネットワーク間の再帰性は加齢でも保たれ、感覚的な逸脱はパターンの逸脱より再帰性が大きく発散が小さかった（両群とも）（抄録）。", "p6": "横断的な年齢群の比較で、個人内の加齢変化ではない（抄録からの解釈）。標本は各群40人前後で、感覚反応の増強が補償なのか抑制の低下なのかは抄録からは判断できない。", "unverified": "本文を読めず、効果量と統計的検定の詳細は確認できなかった。"}}, {"rank": 15, "field": "統計学", "headline": "混合pスピングラスの分配関数の揺らぎ", "title": "Hypergraph Counting and Fluctuations of Mixed p-Spin Glass Models at High Temperature", "url": "https://doi.org/10.1007/s00220-026-05748-5", "authors": "Partha S. Dey ほか", "date": "2026-09-27", "venue": "Communications in Mathematical Physics", "sjr": 1.254, "why": "高温領域の混合pスピングラスで、分配関数の揺らぎの問題をハイパーグラフの数え上げに帰着させて解析した。", "id": "jn15", "explain": {"basis": "本文", "basis_note": "Springerの本文HTML（序論と主結果の節の冒頭）と抄録を読んだ。証明の節は読んでいない", "preprint": false, "p1": "弱い外部磁場のもとの一般の混合pスピングラス模型で、高温領域の分配関数の揺らぎを、クラスター展開によってハイパーグラフの数え上げ問題に帰着させ、揺らぎの振る舞いが複数回切り替わる「多重転移」現象と、明示的な収束速度を示した（抄録）。", "p2": "平均場スピングラスの揺らぎの問題には長い歴史があるが、偶数・奇数のpや混合模型を統一的に扱い、揺らぎの構造を分類する枠組みはなかった（抄録）。背景：スピングラスは相互作用がランダムな磁性体の模型で、分配関数の揺らぎは系の統計的性質を決める。", "p3": "クラスター展開の手法を一般の混合pスピンの設定に拡張し、揺らぎを主要なクラスター構造（ハイパーグラフ）の数え上げとして扱う。さらに交換可能な対に対する多変量Stein法で収束速度を得る（抄録）。すべての結果は静的な相転移点β_cから離れた明示的な2次モーメントの閾値β_fまで成り立つ（抄録、§1.2.1）。", "p4": "数学の理論研究であり、主張は定理と証明で示される（§1.2）。", "p5": "奇数pの主要なクラスター構造は偶数pより複雑で、「奇数pスピンは偶数より難しい」という経験則に組合せ論的な説明を与えた（抄録）。混合模型では有効な最小の偶数・奇数のスピンの関係で3つの小領域に分かれ、そのうち1つでのみ混合らしく振る舞った（抄録）。Bovier–Schertzerが予想した多重スケールの揺らぎ現象も導かれた（抄録）。", "p6": "結果は2次モーメントの閾値までで、静的な相転移点までの全域には及ばない（抄録）。解釈：抄録の一部の式が抽出テキストで欠けており、閾値の具体的な形は本文で確認が必要。", "unverified": "3つの小領域の境界の正確な条件（抽出テキストで一部欠落）と、定理の定数は確認できなかった。"}}, {"rank": 16, "field": "医療経済・医療政策", "headline": "電子たばこのオンライン販売禁止の効果", "title": "The Effect of Online Sales Bans on E-Cigarette Use", "url": "https://doi.org/10.1016/j.jhealeco.2026.103190", "authors": "Ege Aksu ほか", "date": "2026-09-25", "venue": "Journal of Health Economics", "why": "電子たばこのオンライン販売禁止が若者などの使用に与えた効果を推定した医療経済学の論文（抄録未登録）。", "id": "jn16", "explain": {"basis": "題名", "basis_note": "抄録・本文とも取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名からは、電子たばこのオンライン販売禁止が電子たばこの使用に与えた効果を推定した医療経済学の研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "unverified": "抄録・本文を入手できず、データ・手法・結果は確認できなかった。"}}, {"rank": 17, "field": "組織行動・心理的安全性", "headline": "研修は忠誠心を育てるが転職力も高める", "title": "The Double-Edged Sword of Employee Training: Fostering Commitment While Navigating the Employability Paradox in Cambodia’s Public Sector", "url": "https://doi.org/10.1016/j.joitmc.2026.1
