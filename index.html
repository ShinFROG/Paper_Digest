e": "SSRN", "date": "2026-10-15", "apa": "Gyongyosi, G., Reizer, B., & Gáspár, A. (2026). Decentralized but Dependent: Clientelism through Workfare. https://doi.org/10.2139/ssrn.7613922", "why": "ハンガリーの公的就労事業の行政データと差の差分析で、中央が市長を集票役にする二層の恩顧主義を示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN、本文は入手できず）", "preprint": true, "p1": "分権化は政府を有権者に対して説明責任のあるものにするはずだが、地方が中央の裁量的な交付金に依存すると、市長が中央の集票役になる「二層の恩顧主義」が生じることを、ハンガリーの公的就労事業で示した。", "p2": "分権化の効果は、地方の首長が有権者と中央のどちらに責任を負うかに左右されるが、中央の資金への依存が説明責任の向きを変える仕組みは実証されていなかった（抄録）。", "p3": "中央政府が公的就労を市町村に配分し、市長か国営企業のどちらに運営させるかを選ぶ確率的投票モデルで、市長が雇用の統制を重視するため、中央は国政選挙での支持に応じて将来の資金を条件づけられることを示す（抄録）。", "p4": "ハンガリーの公的就労事業の市町村単位の行政データで、差の差の設計により、公的就労が国政与党と市長への支持に与える効果と、支持が弱かった市町村のその後の配分を調べる（抄録）。", "p5": "公的就労は国政与党と市長の両方の支持を高め、効果は市長が運営する事業に集中した。国政での支持が弱かった市町村は、与党系の市長のもとでも、その後市長運営の雇用枠を失った。中央は党派の不一致ではなく選挙での成績不振を罰していた（抄録）。", "p6": "1か国の1つの事業の結果で、制度の異なる国への一般化は未検証（解釈）。効果の大きさは抄録からは分からない。", "fun": "地方に権限を移せば、市長は住民の声をよく聞くようになるはずです。でも、お金を中央からもらっていると、市長は「国の与党の票を集めればもっと予算がもらえる」と考えるようになります。仕事を配る福祉の仕組みが、いつの間にか票集めの道具になってしまうという話です。", "unverified": "効果の推定値と、データの期間は未確認。"}}, {"id": "pn11", "rank": 11, "field": "経営学", "headline": "消費者は自分に得な推薦アルゴリズムを選べるか", "title": "Consumer Choice between Recommendation Algorithms -Experimental Evidence", "url": "https://doi.org/10.2139/ssrn.7616678", "authors": "Felix Schleef", "venue": "SSRN", "date": "2026-10-15", "apa": "Schleef, F. (2026). Consumer Choice between Recommendation Algorithms -Experimental Evidence. https://doi.org/10.2139/ssrn.7616678", "why": "事前登録実験で、消費者が良いアルゴリズムを見分けて支払意思を持つが、得の大きさとは結びつかないことを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN、本文は入手できず）", "preprint": true, "p1": "事前登録のオンライン実験で、消費者がプラットフォームの推薦アルゴリズムと自分のためのアルゴリズムを見分け、その違いに支払う意思を持つかを検証した。", "p2": "プラットフォームは推薦アルゴリズムで消費者を利益の大きい商品へ誘導しうる。消費者が第三者のアルゴリズムを選べるようにする提案は、消費者がどちらが自分に良いかを見分けて評価できることを前提にしている（抄録）。", "p3": "被験者のリスク選好を測り、それに基づいて2つの個人化アルゴリズムでくじに順位を付ける。1つは被験者の期待効用を最大化し、もう1つはプラットフォームの期待費用も最小化する（抄録）。", "p4": "プラットフォーム型のアルゴリズムによる確実性等価の損失、被験者がより良いアルゴリズムを見分ける率、支払意思額と、それが被験者の得る利益の大きさで説明されるかを見る（抄録）。", "p5": "プラットフォーム型のアルゴリズムは選ばれたくじの確実性等価を1選択あたり0.42ドル下げた。被験者は平均ではより良いアルゴリズムを見分けて正の支払意思を持ったが、支払意思はそのアルゴリズムから得る利益の大きさでは説明されなかった（抄録）。", "p6": "くじを使った実験室的な設定で、実際の商品推薦への一般化は未検証（解釈）。著者は、選択に基づく救済策には、アルゴリズムが何を最適化しているかの情報を組み合わせる必要があると述べる（抄録）。", "fun": "「おすすめ」は本当にあなたのためでしょうか。実験では、人は会社に得なおすすめと自分に得なおすすめをある程度見分けられました。でも、どれだけ得かと払ってもよい金額は結びついていませんでした。選べるようにするだけでは足りず、何のためのおすすめかを知らせる必要がありそうです。", "unverified": "被験者数と支払意思額の値は未確認。"}}, {"id": "pn12", "rank": 12, "field": "経済学", "headline": "戦争による男性不足が結婚と子の教育に残した影響", "title": "Effects of Gender Imbalance Within and Across Generations: Men's Marrying Up and Family Dynamics&nbsp;", "url": "https://doi.org/10.2139/ssrn.7610381", "authors": "Xinyan Liu ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Liu, X., Wakabayashi, M., Kureishi, W., Li, Y., & Bai, Y. (2026). Effects of Gender Imbalance Within and Across Generations: Men’s Marrying Up and Family Dynamics&nbsp; https://doi.org/10.2139/ssrn.7610381", "why": "第2次世界大戦による男性不足の都道府県差を使い、結婚の組み合わせ、女性の就業、子の学歴への長期的影響を示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN、本文は入手できず）", "preprint": true, "p1": "第2次世界大戦で生じた男性不足の都道府県ごとの違いを使い、結婚の組み合わせ、女性の就業・出生・離婚、さらに次世代の子どもの学歴と労働市場の成果への長期的な影響を示した。", "p2": "一時的な人口構成のゆがみが、結婚市場や世帯、世代を越えた移動にどれだけ長く影響を残すかは、識別が難しく十分に分かっていなかった（抄録）。", "p3": "戦争による地域の男女比の都道府県単位の変動を使い、男性不足の程度と、結婚の仕方、世帯の成果、父親世代の男性不足と子の成果の関係を推定する（抄録）。", "p4": "男性が社会的地位と学歴の高い女性と結婚する上方婚（男性側から見た）の増加、結婚前後の女性のフルタイム就業、出生率と離婚率、子の学歴と労働市場の成果を結果とし、男女別、資源の制約の強い地域での違いを見る（抄録）。", "p5": "男性不足は、男性がより地位と学歴の高い女性と結婚する方向へ組み合わせを変えた。女性の結婚前のフルタイム就業は増えたが結婚後は続かず、出生率と離婚率は上がった。父親の世代が直面した男性不足が大きいほど、子の学歴と労働市場の成果は低く、効果は男の子と資源の制約の強い地域に集中した（抄録）。", "p6": "都道府県単位の変動に基づく推定で、戦争の他の影響（被害や経済の混乱）との分離の方法は抄録からは確認できない（解釈）。効果の大きさも抄録にはない。", "fun": "戦争で若い男性が大勢亡くなると、結婚相手の選び方が変わります。その影響は結婚した世代だけでなく、その子どもの学歴や仕事にまで及んでいました。一時的な出来事が、家族を通じて何十年も先の社会に影を落とすことを示した研究です。", "unverified": "対象国が日本であることは都道府県の記述からの推測で、本文で未確認。効果の大きさも未確認。"}}, {"id": "pn13", "rank": 13, "field": "教育", "headline": "少人数学級の効果は中学入学まで続く（フランス）", "title": "The Long Reach of Targeted Smaller Classes: Evidence from a National Reform", "url": "https://doi.org/10.2139/ssrn.7605718", "authors": "Fatimetou El Bah", "venue": "SSRN", "date": "2026-10-15", "apa": "El Bah, F. (2026). The Long Reach of Targeted Smaller Classes: Evidence from a National Reform. https://doi.org/10.2139/ssrn.7605718", "why": "仏国の困難校での1・2年生の学級半減の効果を、9コホートの行政データで中学入学時まで追跡した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN、本文は入手できず）", "preprint": true, "p1": "フランスの困難校で1・2年生の学級を半分にした2017年の全国改革の効果が、中学入学時（6年生）まで続くかを、9コホートの行政データで調べた。", "p2": "この改革は2年生の終わりに国語と算数の成績を上げたことが知られていたが、早い学年の少人数学級の効果がどこまで続くかは分かっていなかった（抄録）。", "p3": "2017〜2025年に6年生になった9コホートの行政データで、早い学年に少人数学級を経験した生徒と経験しなかった生徒の6年生時の成果の推移を比べるイベントスタディを用いる（抄録）。", "p4": "6年生入学時の国語と算数の成績、とくに最も困難な学校での効果、改革前の困難校と非困難校の算数の差に対する縮小の割合、自己申告の成功への準備感を見る（抄録）。", "p5": "国語への効果はなかったが、算数には正の効果があり、とくに最も困難な学校で大きかった。こうした学校では効果は改革後のコホートを追うごとに増え、4番目のコホートで0.078標準偏差に達し、改革前の算数の差の約12%を埋めた。成功への準備感もわずかに上がった（抄録）。", "p6": "国語への持続効果は見られず、効果の大きさも小さい（抄録）。解釈：イベントスタディの平行トレンドの妥当性は本文で確認が必要。", "fun": "小学1・2年生のクラスを半分にすると、その後もずっと良いことがあるのでしょうか。フランスで調べると、中学に入るころでも算数の力にはわずかに効果が残っていました。しかも、学校が改革に慣れるにつれて効果が大きくなっていったのが面白い点です。", "unverified": "推定の頑健性の検証の内容は未確認。"}}, {"id": "pn14", "rank": 14, "field": "統計学", "headline": "モデルに依存しない重要度で偽発見率を制御", "title": "Controlling the False Discovery Rate via Model-Agnostic Importance Measures", "url": "https://arxiv.org/abs/2610.21360", "authors": "Mengtao Wen ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Wen, M., Ren, H., & Zou, C. (2026). Controlling the False Discovery Rate via Model-Agnostic Importance Measures (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21360", "why": "共変量分布の知識を要するModel-Xノックオフを補う、標本分割と新しい重要度による変数選択でFDR制御を保証した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（主要なアイデア§1.1、手法§2.1、比較実験§5.4、結論§6）を読んだ。理論§3の証明と付録は読んでいない", "preprint": true, "p1": "共変量の分布を知らなくても、どんな機械学習モデルでも使える変数選択で偽発見率（FDR）を漸近的に制御する方法MAS（Model-Agnostic Selection with agent-X importance）を提案した。", "p2": "Model-Xノックオフは一般的だが共変量の分布の知識（推定）を必要とし、変数を1つずつ抜いて学習し直すLOCOの重要度は計算が重く、変数間の相関が強いと信号が消えうる（§1）。", "p3": "変数X_jを抜く代わりに、定数などの「代理（agent）」で置き換えたときに最良モデルの予測力がどれだけ落ちるかを重要度ψ_jとする（式1.3）。直観：重要な変数を壊すと予測が悪くなり、重要でなければ変わらない。交差適合で推定し、退化を避けるため各フォールドをさらに2分し、変数ごとに独立に分割し直して重要度の推定量どうしの依存を断ち（§2.2）、証拠を集約した対称な順位統計量にp値を使わない閾値規則を当てる。", "p4": "線形モデル（n=600、p=400、有意80）と非線形モデルで、FDR水準α=0.2のもと、debiased lassoのBH法、データ分割法、Model-Xノックオフと、FDRと検出力を比べる（§5.4、図1、表3）。HIV-1の薬剤耐性データにも適用する（§5.6）。", "p5": "線形モデルではデータ分割とBHが線形用に作られているぶん検出力が高く、MASはFDRを目標に近く保ち、保守的すぎるノックオフより検出力が高かった（図1左）。非線形モデルではMASとノックオフがFDRを正確に制御し、線形向けの方法より検出力が高かった（図1右）。より複雑なモデルでは、ノックオフは裾の重いt分布と強い相関でFDRが膨らんだが、MASは制御を保ち、アンサンブル学習で検出力がノックオフ並みに上がった（表3）。", "p6": "MASの検出力は学習アルゴリズムの予測力に依存する（§5.4）。検出力を最大化する強化パラメータの一般的な作り方、共変量適応型の重要度の厳密な理論、強い相関と非線形のもとでの性質の解明が今後の課題と著者は述べる（§6）。", "fun": "たくさんの候補の中から「本当に効いている要因」を選ぶとき、間違いの混ざる割合を一定以下に抑えたいものです。この研究は、要因を1つずつ「壊して」予測がどれだけ悪くなるかで大切さを測り、データの分け方を工夫して、どんなAIを使っても間違いの割合を守れるようにしました。", "unverified": "表3の各条件の数値の全体と、実データの結果は未確認。"}}, {"id": "pn15", "rank": 15, "field": "機械学習（Hugging Face）", "headline": "強化学習の方策変化を途中経過で選んで蒸留", "title": "Waypoint-OPD: Transferring RL-Induced Policy Shifts via Gated On-Policy Distillation", "url": "https://arxiv.org/abs/2610.21601", "authors": "Bingxi Hou ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-16", "apa": "Hou, B., Jiang, G., Quan, G., Li, W., Feng, W., Liu, G., & Zhang, Y. (2026). Waypoint-OPD: Transferring RL-Induced Policy Shifts via Gated On-Policy Distillation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21601", "why": "教師の強化学習の途中と最後の方策変化の向きの一致で蒸留をゲートし、数学とコードの推論で既存手法を上回った（HF投票320）。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法§3、設定§4、主結果§5.1と表2、アブレーション§5.3、結論§7）を読んだ", "preprint": true, "p1": "強化学習（RL）で賢くなった教師モデルの「学習前から学習後への方策の変化」を生徒モデルに移す蒸留で、学習途中のチェックポイントを使い、前半と後半の変化の向きが一致する所だけを強く移す方法Waypoint-OPDを提案した。", "p2": "方策変化の蒸留は、教師のRL前後の対数確率の差（終点の変化）を生徒の生成した軌跡に教師信号として使う。しかし同じ終点の変化でも、前半と後半の変化が強め合った結果なのか、打ち消し合った結果なのかは区別できなかった（§1、§3.2）。", "p3": "生徒が訪れた接頭辞ごとに、生徒の上位16候補のトークンを、RL前・途中（ステップ600）・後（ステップ1200）の3つの固定した教師で採点する。前半の変化u（途中−前）と後半の変化v（後−途中）を中心化してコサイン類似度c_tを求め、ゲートg_t=max(0,c_t)で終点の変化を重み付けする（式9〜10）。具体例：u=v=d/2ならg=1、u=2d・v=−dならg=0で、終点は同じdでも扱いが変わる。追加のコストは固定教師の採点1回だけ。", "p4": "数学（DAPO-Math-17Kで学習し、AIME・HMMT・AMCの7ベンチマークのmean@32）とコード（Codeforces系で学習し、MBPP・MBPP+・LiveCodeBenchの5評価のmean@8）で、Qwen3-4Bの教師からQwen3-8B・14B・30B-A3Bへ移し、通常のOPD、OPD2、終点だけのDirect-OPDと比べる（§4）。", "p5": "数学では最強の基準Direct-OPDを3つの生徒で2.18、1.59、1.89ポイント上回り、21比較中19で改善した。コードでも1.19〜2.66ポイント上回り、15比較すべてで改善し、例えばQwen3-8Bは50.59から53.25になった（表2）。14Bと30B-A3Bは学習後の教師の平均も上回った。ゲートを外すと8Bの数学平均は56.14から53.50に、ゲートを接頭辞間でシャッフルすると51.20に下がった（§5.3）。", "p6": "アブレーションの差は他の構成要素を残したうえでの条件付きの差で、独立に足し合わせられる寄与ではない。終点の変化の中心化の効果は単独では切り分けておらず、方向の一致だけで良い教師信号が保証されるわけではないと著者は述べる（§3.2、§5.3）。", "fun": "先生がある問題の解き方を上達させた過程を、生徒にまねさせるとします。最初と最後だけを比べると、途中で一度覚えて忘れたことも「上達」に見えてしまいます。この研究は、途中経過も見て、前半と後半で同じ方向に伸びた部分だけを教えることで、生徒が先生を追い越すほど上手に学べることを示しました。", "unverified": "付録Dの各ベンチマークの全数値は未確認。"}}, {"id": "pn16", "rank": 16, "field": "因果推論", "headline": "時変共変量を考慮した差の差法の異質効果", "title": "Difference-in-Differences for Heterogeneous Effects of General Treatment Strategies Accounting for Time-Varying Covariates", "url": "https://arxiv.org/abs/2610.22113", "authors": "Oliver Dukes ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Dukes, O., Shahn, Z., Robins, J., & Rotnitzky, A. (2026). Difference-in-Differences for Heterogeneous Effects of General Treatment Strategies Accounting for Time-Varying Covariates (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22113", "why": "構造入れ子平均モデルを使い、一般的な処置戦略の効果の時間変化する異質性を差の差法で識別する枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "時間とともに変わる共変量による効果の違いを、差の差法の平行トレンド仮定のもとで推定できる周辺構造入れ子平均モデル（mSNMM）を提案した（抄録）。", "p3": "調整に必要な共変量のうち一部の低次元の変数だけで効果修飾をモデル化し、条件付き平行トレンドのもとで識別と推定を行う。処置が途中でオン・オフしても、持続的な介入の効果を扱える。", "p5": "時変交絡があっても必要な平行トレンド仮定がもっともらしく、モデルの誤特定のリスクを下げるとする。メディケイド拡大が無保険率に与える効果が、拡大前の失業率でどう変わるかに適用した（抄録。推定値は抄録になし）。", "fun": "政策の効果は、町の状況によって大きくも小さくもなります。しかも状況そのものが年ごとに変わり、政策を始めたりやめたりする地域もあります。この研究は、そうした「動く条件」の下でも、条件ごとの効果の違いを比べられる道具を作った点が新しいところです。", "unverified": "適用例の推定結果は未確認。"}}, {"id": "pn17", "rank": 17, "field": "因果推論", "headline": "打ち切りのある結果への二重頑健な近接因果推論", "title": "Flexible Doubly Robust Proximal Causal Inference for Censored Outcomes", "url": "https://arxiv.org/abs/2610.20893", "authors": "Dhanajit Brahma ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Brahma, D., Meng, R., Carin, L., & Henao, R. (2026). Flexible Doubly Robust Proximal Causal Inference for Censored Outcomes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20893", "why": "未測定交絡の下で生存時間の因果効果を、代理変数を使って柔軟かつ二重頑健に推定する方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "未測定の交絡があるときに、打ち切りのある生存時間の因果効果を、代理変数を使って柔軟かつ二重頑健に推定する近接生存ブリッジ学習（PSB）を示した（抄録）。", "p3": "処置別の生存曲線の近接識別に基づき、結果ブリッジ・処置ブリッジ・二重頑健の3推定量を作る。ブリッジ関数は低ランクの時間分解を持つカーネル推定（PSB-K）か、射影最大モーメント制約の損失で学ぶニューラル推定（PSB-N）で学ぶ。", "p5": "標準的なSEMのベンチマーク、半合成のACTG研究、実データのFramingham研究で、PSB-KがSEMとACTGで最も良く、PSB-NがFraminghamで最も安定した（抄録）。", "fun": "病気の治療効果を調べるとき、測れていない要因が結果をゆがめることがあります。この研究は、その要因の「影」を映す代わりの変数を2種類使って、ゆがみを取り除こうとします。さらに途中で追跡できなくなった人がいても使えるようにした点が工夫です。", "unverified": "性能差の具体的な数値は未確認。"}}, {"id": "pn18", "rank": 18, "field": "因果推論", "headline": "機械学習で予測した結果変数を使う局所頑健推論", "title": "Locally Robust Inference with Outcomes Predicted by Machine Learning", "url": "https://arxiv.org/abs/2610.21756", "authors": "Juan Carlos Escanciano ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Escanciano, J. C., & Puerta-Cuartas, A. (2026). Locally Robust Inference with Outcomes Predicted by Machine Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21756", "why": "機械学習で生成した変数を回帰に使うときの偏りを補正する、局所頑健な推論を経済学向けに示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "機械学習で予測した値を結果変数としてそのまま計量分析に使うと推論が歪む問題に、3段階の局所頑健なGMMで正しい推論を与えた（抄録）。", "p3": "識別のモーメントに1段目と2段目の影響関数を加えた脱バイアスのモーメント条件を作り、両段階の正則化やモデル選択のバイアスに局所的に鈍感にする。一致性と漸近正規性を示す。", "p5": "モンテカルロ実験で有限標本の性能を確かめ、米国の住宅ローンデータで人種を使わない機械学習の債務不履行スコアに埋め込まれた黒人と白人の条件付き格差を調べ、実際の延滞の格差よりかなり小さいことを示した（抄録）。", "fun": "AIが作った「予測値」を本物のデータのように扱って分析すると、AIの誤差が結論にこっそり紛れ込みます。この研究は、その誤差の影響を打ち消す補正項を計算式に加えました。AIの出力を材料にする研究が増えるほど、重要になる下ごしらえの技術です。", "unverified": "住宅ローンデータの規模と期間は未確認。"}}, {"id": "pn19", "rank": 19, "field": "統計学", "headline": "二重機械学習で因果推論するときの予測変数の選び方", "title": "Predictor Selection for Doubly Robust Double/debiased Machine Learning Estimators for Causal Inference", "url": "https://doi.org/10.31234/osf.io/7hcjw_v2", "authors": "Muwon Kwon ほか", "venue": "PsyArXiv", "date": "2026-10-16", "apa": "Kwon, M., & Steiner, P. M. (2026). Predictor Selection for Doubly Robust Double/debiased Machine Learning Estimators for Causal Inference. https://doi.org/10.31234/osf.io/7hcjw_v2", "why": "二重機械学習による因果効果推定で、どの予測変数を入れるべきかを検討した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（PsyArXiv）", "preprint": true, "short": true, "p1": "二重機械学習で因果効果を推定するとき、傾向スコアと結果のモデルで別々に選んだ予測変数の和集合を使う「和集合ダブル・ポストLasso」を提案した（抄録）。", "p3": "2つのモデルでそれぞれLassoで変数を選び、その和集合で両方のモデルを推定し直すことで、モデル間で選ばれる変数が異なることと、重要な変数の取りこぼしを防ぐ。", "p5": "シミュレーションで、別々に選んだ変数を使う方法より残る交絡バイアスを一貫して減らした。機械学習の推定が従来の二重頑健推定を常に上回るわけではなく、ポストLassoはLassoより交絡バイアスを減らした（抄録）。", "fun": "機械学習で原因と結果を調べるとき、「どの変数を使うか」をAIに選ばせると、片方のモデルにだけ大事な変数が抜けることがあります。両方で選ばれた変数をまとめて使うという素朴な工夫で偏りが減るのは、手法の性能より使い方が大事だという教訓です。", "unverified": "シミュレーション設定と偏りの減少量は未確認。"}}, {"id": "pn20", "rank": 20, "field": "統計学", "headline": "不均一分散下の高次元Huber回帰の精密な漸近論", "title": "Precise Asymptotics for Dense High-Dimensional Huber Regression under Heteroscedasticity", "url": "https://arxiv.org/abs/2610.20798", "authors": "Jing Zhou ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Zhou, J., Venkataramanan, R., & Zou, H. (2026). Precise Asymptotics for Dense High-Dimensional Huber Regression under Heteroscedasticity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20798", "why": "標本数と次元が比例する領域で、不均一分散のHuber回帰推定量の分布を正確に特徴づけた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "標本数と次元が比例して大きくなる領域で、不均一分散があるときのHuber回帰推定量の漸近分布を正確に特徴づけた（抄録）。", "p3": "行列の近似メッセージ伝搬（AMP）の枠組みで、回帰係数と分散を決める係数を同時に追跡し、等分散のM推定の既存の枠組みを拡張する。推定量の中心と分散を3つのスカラー量で表す。", "p5": "不均一分散のもとでは、推定量の1次の中心が分散指標の係数の方向に余分にずれうることを示し、そのずれの係数と正確な漸近分散を導いた。中心のずれの検定を作り、シミュレーションで大きさと検出力を調べた（抄録）。", "fun": "外れ値に強いHuber回帰は便利ですが、データのばらつきが場所によって違うと、推定値の中心が少しずれることがわかりました。変数が多すぎる世界では、昔からの「たくさん集めれば真の値に近づく」という直観が通用しない、という現代統計らしい結果です。", "unverified": "なし"}}, {"id": "pn21", "rank": 21, "field": "統計学", "headline": "高次元のおかげで最適率が出る因子支援密度推定", "title": "Factor-Assisted Density Estimation: When Ambient Dimension Enables Oracle Rates", "url": "https://arxiv.org/abs/2610.20944", "authors": "Sunrit Chakraborty ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Chakraborty, S., & Dunson, D. (2026). Factor-Assisted Density Estimation: When Ambient Dimension Enables Oracle Rates (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20944", "why": "因子モデルの潜在因子の密度推定で、高い観測次元がむしろオラクル率を可能にすることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "高次元の因子モデルで、観測の次元が十分大きければ、単純なスペクトル法で潜在因子の密度をオラクル率で推定できることを示した（抄録）。", "p3": "潜在スコアのスペクトル推定値にカーネル密度推定を当てる非反復の手法FADEを提案し、誤差を条件付き中心化されたガウス摂動と一様に制御される残差に分ける展開で解析する。", "p5": "十分に高い次元でFADEはオラクル率を達成し、通常のノンパラメトリックな難しさとガウス逆畳み込みの障害を分けるミニマックス下界も示して、特定の高次元領域での率の最適性を確立した（抄録）。", "fun": "ふつう、変数が多いほど推定は難しくなります（次元の呪い）。ところがこの研究では、観測する項目が十分多いと、隠れた少数の要因がかえってくっきり見え、その分布を理想的な精度で推定できることを示しました。「次元の恵み」とでも言える逆転の発想です。", "unverified": "なし"}}, {"id": "pn22", "rank": 22, "field": "統計学", "headline": "ガウス変分推論の加速とその限界", "title": "Acceleration and its Limits in Gaussian Variational Inference", "url": "https://arxiv.org/abs/2610.21020", "authors": "Jaesung R. Park ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Park, J. R., Jang, U., & Chen, Y. (2026). Acceleration and its Limits in Gaussian Variational Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21020", "why": "勾配法のモーメンタム加速がガウス変分推論でどこまで効くかを理論的に明らかにした。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "勾配法のモーメンタム加速（条件数への依存をκから√κへ改善）が、ガウス変分推論でどこまで成り立つかを理論的に明らかにした（抄録）。", "p3": "ガウスの期待値を正確に計算できる場合は凸の合成問題として古典的な加速率が得られることを示し、点ごとの微分しか使えない場合については、どんな乱択アルゴリズムでも多くの問い合わせを要する対象分布の族を構成する。", "p5": "点ごとの微分しかないときはκ^(1−o(1))回の問い合わせが必要で、曲率の上下界だけでは一様な加速は保証できない。一方、ヘッセ行列のリプシッツ性のもとで分散低減法は加速を示し、実データでも大きな高速化が見られた（抄録）。", "fun": "坂を転がるボールに勢いをつけると早く谷底に着く、というのが加速法の考え方です。それが確率分布を近似する計算でも効くかを調べたところ、手に入る情報によっては原理的に速くできない場合があるとわかりました。「速くできない」と証明すること自体が大事な成果です。", "unverified": "実データでの高速化の倍率は未確認。"}}, {"id": "pn23", "rank": 23, "field": "統計学", "headline": "角度測度のワッサースタイン距離で極値依存を分類", "title": "Clustering extremal dependence structures via Wasserstein distances between angular measures", "url": "https://arxiv.org/abs/2610.21931", "authors": "Kamal Gasser ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Gasser, K., Ragone, F., & Segers, J. (2026). Clustering extremal dependence structures via Wasserstein distances between angular measures (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21931", "why": "複合極端事象の同時の振る舞いを、角度測度間のワッサースタイン距離でクラスタリングする方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "複数の変数が同時に極端になる仕方（極値依存）を、角度測度どうしのワッサースタイン距離で比べ、変数の組をクラスタに分ける方法を示した（抄録）。", "p3": "高い閾値を超えた観測から角度測度を推定し、単体からアイチソン座標のユークリッド空間に写して1-ワッサースタイン距離で比べる。モデルの当てはめ不要のノンパラメトリックな非類似度を、距離に基づくクラスタリングに使う。", "p5": "階層クラスタリングとPAMで潜在的な分割を確率1に近づいて回復することを示した。依存の強さが同じでも形が違うクラスタで既存法より大きく優れ、スイスの降雨-融雪-流出の極値と国際株式市場に適用した（抄録）。", "fun": "大雨と雪解けが同時に起きると洪水の被害は桁違いになります。こうした「同時の極端」の起こり方は、強さだけでなく形にも違いがあります。この研究は、極端なときの方向の分布どうしの「運ぶ距離」で似ている度合いを測り、似た地域をまとめる方法を作りました。", "unverified": "適用例の具体的なクラスタ結果は未確認。"}}, {"id": "pn24", "rank": 24, "field": "統計学", "headline": "小地域推定のベンチマーク制約を満たす事前分布", "title": "Benchmarking Priors: A Fully Bayesian Approach to Small Area Benchmarking", "url": "https://arxiv.org/abs/2610.21744", "authors": "Soumadeep Bhowmick ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Bhowmick, S., Roy, A., Janicki, R., & Datta, G. S. (2026). Benchmarking Priors: A Fully Bayesian Approach to Small Area Benchmarking (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21744", "why": "外部の合計値への整合（ベンチマーク）を厳密に満たす事前分布のクラスを小地域モデルに導入した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "小地域推定の推定値を外部の合計値（ベンチマーク）に厳密に一致させる制約を、事前分布として組み込む新しいベイズの枠組みを作った（抄録）。", "p3": "ベンチマーク制約で決まるパラメータ集合だけに台を持つ事前分布を作り、制約集合の中に収まる正しい事後分布と信用集合を得る。標準のFay-Herriotモデルから、多変量tの頑健版や非線形の版まで適用できる。", "p5": "シミュレーションと、米国勢調査局のSAIPEの直接推定とCPS ASECの全国値を使った、5〜17歳の子どもの貧困率の州別推定で有用性を示した（抄録）。", "fun": "州ごとの子どもの貧困率を足し合わせると、全国の公式値と食い違うことがあります。後から無理に合わせると不確かさの計算が狂います。この研究は、最初から「合計が合う世界」だけを考える確率の仕組みにして、つじつまと不確かさを両立させました。", "unverified": "推定精度の改善の数値は未確認。"}}, {"id": "pn25", "rank": 25, "field": "統計学", "headline": "時系列の逐次コンフォーマル予測のRパッケージ", "title": "conformalForecast: An R package for sequential conformal prediction in time series", "url": "https://arxiv.org/abs/2610.21648", "authors": "Xiaoqian Wang ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Wang, X., & Girolimetto, D. (2026). conformalForecast: An R package for sequential conformal prediction in time series (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21648", "why": "時系列予測の不確実性を分布に依存せず保証するコンフォーマル予測を使いやすく実装した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "時系列の多段階予測に対し、コンフォーマル予測区間を作り、更新し、評価する一連の作業をまとめたRパッケージconformalForecastを公開した（抄録）。", "p3": "点予測と較正を分け、さまざまな予測を共通の入口で受け、予測期間ごとの誤差と較正状態を保つ。経験分位、フィードバック型、依存を考慮する方法など複数の較正法と、被覆率・区間幅・区間スコアの評価を実装する。", "p5": "オーストラリア5地域の短期電力価格の予測に適用し、全体の被覆率はおおむね名目水準に近く、移動被覆率と区間の効率は方法と期間で異なった。逐次更新は全体を再計算した区間を再現した（抄録）。", "fun": "天気予報の「降水確率」のように、予測には外れ方の幅も必要です。コンフォーマル予測は、過去の外れ具合から、決めた確率で当たる幅を作る方法です。このパッケージは、新しいデータが届くたびに幅を作り直す手間を減らし、実務で使いやすくした点が貢献です。", "unverified": "なし"}}, {"id": "pn26", "rank": 26, "field": "経済学", "headline": "関税で守られた企業をヘッジファンドが規律する", "title": "Disturbing the Quiet Life: Trade Protection and Hedge Fund Activism", "url": "https://doi.org/10.2139/ssrn.7616618", "authors": "Nickolay Gantchev ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Gantchev, N., & Giannetti, M. (2026). Disturbing the Quiet Life: Trade Protection and Hedge Fund Activism. https://doi.org/10.2139/ssrn.7616618", "why": "2018〜19年の米関税を輸入競争の衝撃として、競争が弱まった企業でアクティビストの介入が増えることを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "関税で輸入競争から守られた企業の経営者を誰が規律するのかを、2018〜19年の米関税を衝撃として調べ、ヘッジファンドのアクティビストがその役を担うことを示した（抄録）。", "p3": "関税による輸入競争の低下を外生的なショックとして使い、保護された産業でのアクティビストの標的化、要求内容、取締役の選任、株価反応、企業の投資・研究開発の変化を比べる。", "p5": "アクティビストは保護産業の企業、とくに直近の好業績企業や国内競争の少ない企業を標的にしやすくなり、取締役の席を求めることが増え、異常収益は15%と関税前の同様のキャンペーンの2倍超だった（抄録）。", "fun": "競争相手がいなくなると、経営者は楽をしたくなります（「静かな生活」）。関税で外国企業との競争が弱まったとき、代わりに経営者を突き動かしたのは物言う株主でした。市場の競争が弱まると、別の形の規律が生まれるという、経済の自己修復のような話です。", "unverified": "標本の企業数は未確認。"}}, {"id": "pn27", "rank": 27, "field": "経済学", "headline": "国境を越えた関税の転嫁：寡占とネットワーク", "title": "Pass-through beyond the Border: Oligopoly, Networks, and Tariffs", "url": "https://doi.org/10.2139/ssrn.7616741", "authors": "Omar Barbiero ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Barbiero, O., Silva, A., & Stein, H. (2026). Pass-through beyond the Border: Oligopoly, Networks, and Tariffs. https://doi.org/10.2139/ssrn.7616741", "why": "輸入投入財・国内生産ネットワーク・外国企業との競争を通じた関税の価格転嫁を多部門モデルで示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "輸入投入財、国内の生産ネットワーク、外国企業との競争を通じて、国境の価格ショックが米国の生産者・消費者物価に転嫁される仕組みを多部門モデルで示し、2025年の関税に適用した（抄録）。", "p3": "水準でも対数でも転嫁を扱えるモデルを、産業連関、貿易、価格の公開データに直接対応させ、競合する輸入品の価格に企業が反応する経路を入れる。", "p5": "競合輸入品の価格への反応を入れると生産者物価への当てはまりが大きく改善し、消費者物価とも整合した。2025年2〜10月の関税引上げはPCEインフレに0.91ポイント寄与し、そのうち0.10ポイントは外国との競争の経路だった（抄録）。", "fun": "関税は輸入品だけを高くするように見えますが、国産品のメーカーも「ライバルの輸入品が高くなったから」と値上げできます。この研究は、そうした見えにくい値上げの道筋まで含めて、関税が物価全体をどれだけ押し上げたかを計算しました。", "unverified": "なし"}}, {"id": "pn28", "rank": 28, "field": "経済学", "headline": "アナリストはECBの政策をどう聞き取るか", "title": "What analysts hear and why it matters for monetary policy", "url": "https://doi.org/10.2139/ssrn.7613658", "authors": "Luca Ebener ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Ebener, L., & McGregor, T. (2026). What analysts hear and why it matters for monetary policy. https://doi.org/10.2139/ssrn.7613658", "why": "投資銀行アナリストの言葉から欧州中銀の政策解釈ショックを作り、金融政策の伝達を測った。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "大手投資銀行アナリストのレポートの言葉から、欧州中銀（ECB）の政策がどう解釈されたかの「政策解釈ショック」を作り、その経済効果を調べた（抄録）。", "p3": "政策理事会の前の予想レポートと後のまとめレポートのトーンの変化が、政策イベントで明らかになった予期せぬ情報を反映すると仮定し、GPTによる感情抽出でトーンを測る。", "p5": "アナリストのトーンは理事会のトーンによく沿い、ときに先取りした。解釈ショックのあとには景気抑制的なマクロ経済の反応と、金融市場価格の系統的な動きが続いた（抄録。数値は抄録になし）。", "fun": "中央銀行の発表そのものより、それを「専門家がどう受け取ったか」のほうが市場を動かすのかもしれません。この研究は、発表前後のアナリストのレポートの雰囲気の変化をAIで読み取り、それが景気にまで影響することを示しました。言葉の受け止め方が経済を動かす例です。", "unverified": "対象期間とレポートの数は未確認。"}}, {"id": "pn29", "rank": 29, "field": "経済学", "headline": "関税は貧困層への税：2025年米貿易戦争の分配効果", "title": "Tariffs as a Tax on the Poor: Distributional Effects of the 2025 U.S. Trade War on Consumer Prices Across Income Groups", "url": "https://doi.org/10.2139/ssrn.7614598", "authors": "TRishala Singh", "venue": "SSRN", "date": "2026-10-16", "apa": "Singh, T. (2026). Tariffs as a Tax on the Poor: Distributional Effects of the 2025 U.S. Trade War on Consumer Prices Across Income Groups. https://doi.org/10.2139/ssrn.7614598", "why": "2025年の米関税による消費者物価の上昇が所得層ごとにどう異なるかを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "2025年の米関税が、所得の低い層ほど重い逆進的な消費税として働いたことを、所得五分位ごとの支出バスケットで示した（抄録）。", "p3": "2024年の消費者支出調査の五分位別の支出構成と、Yale Budget Labのモデルに較正した関税の帰着推定を組み合わせる。完全転嫁と固定バスケットを仮定した帰着の計算で、因果的な価格効果は推定しない。", "p5": "平均実効関税は最大18.3%で、最下位五分位の厚生損失は税引前所得の7.6%、最上位は1.7%（4.5倍の勾配）。最下位は支出の14.2%を高関税の必需品に使い、最上位は6.1%だった（抄録）。", "fun": "関税は外国に払わせる税のように語られますが、実際に払うのは国内で物を買う人です。しかも所得の低い人ほど、食品などの必需品に使うお金の割合が大きいので、負担が重くなります。同じ関税でも、家計の中身によって痛みが4倍以上違うことを示しました。", "unverified": "計算の前提（完全転嫁など）の妥当性は未確認。"}}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "メッセージアプリの相互運用を義務づけると", "title": "Mandating Interoperability in Messaging App Markets", "url": "https://doi.org/10.2139/ssrn.7613282", "authors": "Jun Yan ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Yan, J., & Dhakar, M. (2026). Mandating Interoperability in Messaging App Markets . https://doi.org/10.2139/ssrn.7613282", "why": "複数アプリを併用できる市場で、相互運用の義務化が競争可能性と消費者厚生に与える影響をモデル化した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "メッセージアプリの相互運用を義務づけると、競争と消費者厚生がどう変わるかを、併用できる市場の直接ネットワーク効果のモデルで分析した（抄録）。", "p3": "大きな利用者基盤を持つ無料の既存アプリと、プライバシー保護に優れた有料の新規アプリを考え、新規アプリが大衆戦略かニッチ戦略かを選ぶモデルを作る。", "p5": "相互運用が進むと新規アプリはニッチ戦略に切り替えうる。中程度の相互運用は、独占利用者が生むネットワーク価値を損ない、既存アプリの優位が小さいときに新規アプリをかえって不利にしうる。競争促進と消費者厚生の間に緊張がありうる（抄録）。", "fun": "どのアプリ同士でもメッセージを送れるようにすれば、小さなアプリも戦いやすくなりそうです。ところが、そのアプリだけでつながれるという魅力も消えてしまうため、中途半端な相互運用はかえって新参者を苦しめる場合がある、という逆説を示しました。", "unverified": "なし"}}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "米国とスイスの機会の不平等を比べる", "title": "Inequality of Opportunity in Times of Rising Global Inequality: USA vs. Switzerland", "url": "https://doi.org/10.2139/ssrn.7620173", "authors": "Jonas Bühler ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Bühler, J., Davis, J., Häner-Müller, M., Mazumder, B., & Schaltegger, C. A. (2026). Inequality of Opportunity in Times of Rising Global Inequality: USA vs. Switzerland. https://doi.org/10.2139/ssrn.7620173", "why": "スイスの行政データを使い、子の将来の成功に関する機会の不平等を米国と比較した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "兄弟姉妹の所得の相関で機会の不平等を測り、1970年代初めと1980年代初めに働き始めた世代で、スイスと米国を比べた（抄録）。", "p3": "スイスの行政の所得データと米国の調査データで、長期所得の兄弟姉妹相関を2つのコホートについて推定する。", "p5": "米国では1980年代に兄弟姉妹相関と所得格差が急上昇し、相関は15.4%から30.6%へほぼ倍増した。スイスでは格差も機会の不平等もほぼ安定し、相関は両コホートで15%未満だった（抄録）。", "fun": "兄弟姉妹の収入が似ているほど、生まれた家庭が将来を左右していると考えられます。米国ではこの似かたが一世代で倍になりましたが、スイスではほとんど変わりませんでした。世界中で格差が広がった時代にも、国によって「生まれの重み」の変化は大きく違うのです。", "unverified": "米国の調査データの種類は未確認。"}}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "ワンストップ国境は東アフリカの主食市場を統合したか", "title": "Do One-Stop Border Posts Integrate Staple Markets? Evidence from Staggered Border Reforms in Eastern Africa", "url": "https://doi.org/10.2139/ssrn.7602029", "authors": "Miyanda Hakooma", "venue": "SSRN", "date": "2026-10-15", "apa": "Hakooma, M. (2026). Do One-Stop Border Posts Integrate Staple Markets? Evidence from Staggered Border Reforms in Eastern Africa. https://doi.org/10.2139/ssrn.7602029", "why": "段階的な国境改革を使い、国境での手続き一本化が穀物価格差と取引量を変えたかを検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "東アフリカで国境の通関を一本化するワンストップ国境所が、主食の国境を越えた価格差を縮めたかを、段階的な導入を使って検証した（抄録）。", "p3": "国境所の正式・非公式の穀物流量の月次監視データと、トウモロコシ・豆・米の国境間価格差のパネル（元の価格データの単位換算の誤りを修正）を組み合わせ、段階的導入のイベントスタディで推定する。", "p5": "国境所は価格差を測れるほどには縮めず、統合推定値はほぼゼロで、ランダム化推論などに頑健だった。ただし信頼区間は価格差の中央値約22%に対して中程度の統合も否定できない。非公式の割合は下がったが流量の推定は不精確だった（抄録）。", "fun": "国境の手続きを速くすれば、隣国との食料の値段の差は縮まりそうです。ところが調べてみると、はっきりした効果は見つかりませんでした。しかも著者は「効果ゼロの証明ではなく、効果の証拠がない」と慎重に言い分けています。結果の言い方の誠実さも見どころです。", "unverified": "対象の国境所の数は未確認。"}}, {"id": "pn33", "rank": 33, "field": "組織行動・心理的安全性", "headline": "大学選手は公式と非公式のリーダーに何を求めるか", "title": "A Comparison of University Athletes’ Preferences for Leadership from Formal vs. Informal Athlete Leaders", "url": "https://doi.org/10.2139/ssrn.7620272", "authors": "Katherine E. Hirsch-Agnew ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "Hirsch-Agnew, K. E., Hitchcock, G., & Zimmerman, C. T. (2026). A Comparison of University Athletes’ Preferences for Leadership from Formal vs. Informal Athlete Leaders. https://doi.org/10.2139/ssrn.7620272", "why": "選手が公式の主将と非公式のリーダーに求めるリーダーシップの量を比較した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "北米の大学選手238人に、主将などの公式の選手リーダーと非公式のリーダーに、それぞれどれだけのリーダーシップを望むかを尋ねて比べた（抄録）。", "p3": "スポーツのリーダーシップ尺度と変革型リーダーシップの尺度を、公式・非公式それぞれを対象にした「望ましい量」版で回答してもらい、リーダーの種類と行動の間の違いを比べる。", "p5": "選手は公式リーダーに、指導、社会的支援、肯定的なフィードバック、個別配慮、目標の受容とチームワークの促進、高い期待、模範を非公式リーダーより多く望み、どちらのリーダーにも変革型の行動を最も望んだ（抄録）。", "fun": "チームには、肩書きのある主将と、肩書きはないけれど皆が頼る人がいます。選手たちは、主将にはより多くの役割を期待していました。一方で、どちらにも「やる気を引き出す」タイプの関わりを一番求めていたのは、部活動にも当てはまりそうな結果です。", "unverified": "効果量の値は未確認。"}}, {"id": "pn34", "rank": 34, "field": "組織行動・心理的安全性", "headline": "持続的な市民参加が若者にもたらす心理的帰結", "title": "Social and psychological consequences of sustained civic engagement: Insights from the 2024/25 Student Blockades in Serbia", "url": "https://doi.org/10.31234/osf.io/vujys_v1", "authors": "Ana Ivanov ほか", "venue": "PsyArXiv", "date": "2026-10-15", "apa": "Ivanov, A., Janićijević, N., Manojlović, M., Gvozden, M., Simunović, V., & Stanković, S. (2026). Social and psychological consequences of sustained civic engagement: Insights from the 2024/25 Student Blockades in Serbia. https://doi.org/10.31234/osf.io/vujys_v1", "why": "セルビアの2024〜25年の学生封鎖運動を対象に、集団行動の心理的・社会的な影響を検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（PsyArXiv）", "preprint": true, "short": true, "p1": "セルビアの2024〜25年の学生による大学封鎖運動の参加者が、長期の集団行動をどう経験したかを、面接の質的分析で明らかにした（抄録）。", "p3": "現象学に基づく質的研究で、積極的に参加した学部・大学院生20人（女性11人、平均22.15歳）に60〜90分の半構造化面接を行い、反省的テーマ分析をした。", "p5": "封鎖を生活と政治的主体性を変える「変容の場」とするテーマ、集団的アイデンティティと道徳的関与による社会関係の組み替え、不安・脅威・燃え尽きと、それを和らげる人間関係の緩衝の3つの上位テーマが見いだされた（抄録）。", "fun": "リーダーのいない学生の抗議運動が何か月も続くと、参加した人の心や人間関係はどう変わるのでしょうか。この研究は、運動が生きがいや仲間を生む一方で、不安や燃え尽きももたらし、それを支えたのも仲間だったことを描きました。", "unverified": "便宜的な雪だるま式標本で、一般化の範囲は未確認。"}}, {"id": "pn35", "rank": 35, "field": "組織行動・心理的安全性", "headline": "インキュベータ支援からスタートアップの能力形成へ", "title": "From Institutional Support to Startup Development: Team Creativity and Organizational Innovation as Mechanisms of Capability Formation under Systemic Uncertainty", "url": "https://doi.org/10.2139/ssrn.7616304", "authors": "Carla S. Marques ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Marques, C. S., Galvão, A. R., Mendes, T., & Rodrigues, A. (2026). From Institutional Support to Startup Development: Team Creativity and Organizational Innovation as Mechanisms of Capability Formation under Systemic Uncertainty. https://doi.org/10.2139/ssrn.7616304", "why": "チームの創造性と組織の革新が、支援を能力に変える媒介になることを検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "ポルトガルのインキュベータの支援が、チームの創造性と組織の革新を通じてスタートアップの発展につながるかを、動的能力の観点から検証した（抄録）。", "p3": "7つのインキュベータに入居する35社のCEOと従業員の有効回答107件（2026年3〜6月のオンライン調査）を、PLS-SEMで分析する横断研究。", "p5": "インキュベータの支援はチームの創造性と組織の革新に正に関連し、創造性は革新と特に強く関連し、革新は発展と正に関連した。創造性は支援と革新の関係を部分的に媒介した（抄録）。", "fun": "起業を支援する施設は、お金や場所を提供します。でも、それが会社の成長につながるには、チームが自分たちで新しいアイデアを生み出す力に変わる必要がある、という結果です。支援は「渡すもの」ではなく、「中で育てるもの」に変わったときに効くのです。", "unverified": "横断調査で因果は未確認。"}}, {"id": "pn36", "rank": 36, "field": "経営学", "headline": "逐次オークションで分散型のLLMワークフロー", "title": "Decentralized LLM Workflows via Sequential Auctions", "url": "https://arxiv.org/abs/2610.22201", "authors": "Ian Gemp ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Gemp, I., Trivedi, S., Fisch, A., Huot, F., Kaisers, M., Lapata, M., Cohen, W. W., Agarwal, A., Larson, K., & Eisenstein, J. (2026). Decentralized LLM Workflows via Sequential Auctions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22201", "why": "利己的なエージェントの市場をオークションで組織し、多段階タスクを解く拡張可能な枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "利己的なLLMエージェントの市場を逐次オークションで組織し、多段階の課題を分散的に解く枠組みで、不完全競争でも市場が機能することを示した（抄録）。", "p3": "完全なクローンによる完全競争を仮定した理論を緩め、異質なエージェントが入札を戦略的に下げて利益を確保する設定で、ミラー降下・トンプソン抽出・ベイズ最適・PPOの4つの入札法と、第1価格・第2価格・信用保存ヴィックリーの3方式を比べる。", "p5": "完全なクローンでは利益がゼロになり、競争がないと市場が崩れる。その間の不完全競争では、エージェントの必要な利益を保ちつつ協調課題が解けることを多様な領域で示した（抄録。数値は抄録になし）。", "fun": "AIたちに仕事を競りで割り振ると、そっくりなAIばかりなら値下げ競争で誰も儲からず、ライバルがいなければ足元を見られます。この研究は、その中間のほどよい競争で、AIも儲かり仕事もこなせることを示しました。経済学の市場の考えをAIの組織づくりに使う発想です。", "unverified": "課題の領域と性能の数値は未確認。"}}, {"id": "pn37", "rank": 37, "field": "経営学", "headline": "ESGの高評価と炭素リーケージの逆説", "title": "Beyond Appearances: ESG Performance, Green Innovation, and the Carbon Leakage Paradox", "url": "https://doi.org/10.2139/ssrn.7620450", "authors": "ines ben mehrez ほか", "venue": "SSRN", "date": "2026-10-16", "apa": "ben mehrez, i., Farhat, A., & Ajina, A. (2026). Beyond Appearances: ESG Performance, Green Innovation, and the Carbon Leakage Paradox. https://doi.org/10.2139/ssrn.7620450", "why": "米上場650社のスコープ別排出を分析し、ESG評価とグリーン革新の関係に潜む逆説を示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "米上場650社（2010〜2022年）で、ESG評価とスコープ別の炭素排出の関係と、グリーン革新の媒介・調整の役割を調べた（抄録）。", "p3": "スコープ1・2・3の排出をESG評価に回帰し、グリーン革新を媒介・調整として入れる。内生性に対して二段階最小二乗、傾向スコアマッチング、エントロピーバランシング、ヘックマン補正の4つの戦略を使う。", "p5": "ESG評価はスコープ1・2の排出を有意に減らし、グリーン革新がその経路になった。一方スコープ3の排出とはすべての定式化で正に関連し（「スコープ3の逆説」）、炭素集約的な活動がバリューチェーンへ移っている可能性を示した（抄録）。", "fun": "環境に優しいと評価される会社ほど、自社の煙突からの排出は減っていました。ところが取引先を含めたサプライチェーン全体の排出はむしろ多かったのです。汚れ仕事を外に出せば自社の数字はきれいになる、という評価の盲点を示している点が考えどころです。", "unverified": "効果の大きさの値は未確認。"}}, {"id": "pn38", "rank": 38, "field": "経営学", "headline": "グリーンウォッシュを動的な戦略制御として解く", "title": "Greenwashing as a Dynamic Strategic Control: Detection Risk, Consumer Skepticism, Heterogeneous Time Preferences, and Retailer Cost Sharing", "url": "https://doi.org/10.2139/ssrn.7618221", "authors": "Arka Mukherjee", "venue": "SSRN", "date": "2026-10-16", "apa": "Mukherjee, A. (2026). Greenwashing as a Dynamic Strategic Control: Detection Risk, Consumer Skepticism, Heterogeneous Time Preferences, and Retailer Cost Sharing. https://doi.org/10.2139/ssrn.7618221", "why": "発覚リスクと消費者の懐疑、時間選好の違いを入れて、環境改善と環境訴求の最適な組み合わせを導いた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "メーカーと小売の無限期間の微分ゲームで、本物の環境改善とグリーンウォッシュ（誇張した環境訴求）の最適な組み合わせを解いた（抄録）。", "p3": "メーカーが改善努力と誇張の強さを、主導者の小売が改善費用の補助の割合を選ぶ。本物の環境品質と消費者の懐疑を動的な状態とし、1つの監視パラメータqが情報を持つ消費者の割合・発覚確率・懐疑の蓄積を決める。両者の時間選好の違いも許す。", "p5": "閉形式の定常シュタッケルベルク均衡が得られ、静的モデルとは違い、グリーンウォッシュは1より厳密に小さい内生的な発覚の閾値で止まるなど4つの結果を示した（抄録）。", "fun": "「環境に優しい」と大げさに宣伝すると、ばれたときに客の不信がたまり、それが長く残ります。この研究は、その不信の蓄積を時間とともに追う数学のゲームを作り、監視が一定以上強ければ企業は誇張をやめることを示しました。評判を「たまっていく量」として扱うのが工夫です。", "unverified": "4つの結果のうち残り3つの内容は未確認。"}}, {"id": "pn39", "rank": 39, "field": "機械学習（Hugging Face）", "headline": "重みを変えずにエージェントの足場を自己進化させる", "title": "Self-Evolving Agent Harness", "url": "https://arxiv.org/abs/2610.18813", "authors": "Chuyang Wei ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-16", "apa": "Wei, C., Guan, H., Zhu, M., Zhou, K., He, J., Zhou, X., Chen, H., & Shen, Y. (2026). Self-Evolving Agent Harness (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.18813", "why": "プロンプト・記憶・ワークフローなどの足場をフィードバックで改訂する自己進化を定式化した（HF投票184）。", "explain": {"basis": "抄録", "basis_note": "Hugging Faceの抄録を使用", "preprint": true, "short": true, "p1": "モデルの重みを変えずに、プロンプト・記憶・ワークフロー・ツールなどエージェントの足場（ハーネス）をフィードバックで改訂し続ける自己進化を定式化した（抄録）。", "p3": "更新の対象と、提案・採用の仕組みを分け、解釈される状態の変更、ツールやコードの改訂、制御ロジック、プラグイン構成を区別する。探索を進化的最適化として、信頼性を継続的PAC学習として扱う。", "p5": "明示的な仮定のもとで期待汎化の上界、過去の退行予算に条件付けた保持の上界、新しい独立の検証データによる高確率の採用規則を導いた。66ページの総合的な議論を含むとする（抄録）。", "fun": "AIの頭脳そのもの（重み）はそのままで、AIが使うメモ帳や手順書を少しずつ書き換えて賢くしていく、という方法の理論です。書き換えが本当に改善かを、新しいテストで確かめてから採用するルールを数学的に示しているのが、安全性の面で大事な点です。", "unverified": "実験的な評価の有無と結果は未確認。"}}, {"id": "pn40", "rank": 40, "field": "機械学習（Hugging Face）", "headline": "汎用コンピュータ操作エージェントを全部公開で", "title": "OpenGCUA: Toward a Fully Open Stack for Generalist Computer Use", "url": "https://arxiv.org/abs/2610.22200", "authors": "Hanzhang Zhou ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-16", "apa": "Zhou, H., Li, L., Kong, Q., Wang, L., Tong, P., Chen, L., Xia, T., Zhang, G., Zhang, X., Liu, C., Zhang, J., Cai, C., Zeng, Z., Hoi, S., & Wang, Y. (2026). OpenGCUA: Toward a Fully Open Stack for Generalist Computer Use (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22200", "why": "視覚とプログラムの両方でコンピュータを操作するエージェントの、完全に公開された技術一式を目指した（HF投票208）。", "explain": {"basis": "抄録", "basis_note": "Hugging Faceの抄録を使用", "preprint": true, "short": true, "p1": "画面操作とプログラム操作の両方でコンピュータを使う汎用エージェント（GCUA）の技術一式を公開するOpenGCUAの最初のリリース（抄録）。", "p3": "コード実行を設計の中心に置き、途中結果で次の操作を決められるようにする。観察や課題状態の判断の一部を、固定のハーネス規則からモデルに移す「ハーネスからモデルへの意思決定の移譲」を提案する。", "p5": "OSWorld-v2で評価した8モデルすべてで得点が上がり、画面操作のみの実行に比べ平均部分得点が+19.6ポイント、1課題あたりの手順数が平均53.0%減った。実機のmacOS課題では、モデル間で推論トークン量に19.4倍の差があった（抄録）。", "fun": "AIにパソコンを使わせるとき、画面のボタンを1つずつクリックさせるより、プログラムを書かせて一気に処理させたほうが速くて確実です。人間でも、同じ作業を何百回も繰り返すならマウスよりスクリプトを使いますよね。その発想をAIエージェントに持ち込んだ研究です。", "unverified": "実機用ハーネスとSDKは予備版とされ、性能は未確認。"}}, {"id": "pn41", "rank": 41, "field": "機械学習（Hugging Face）", "headline": "AI導入の「最後の一マイル」を測るFDE-Gym", "title": "FDE-Gym: The Last Mile of AI Delivery", "url": "https://arxiv.org/abs/2610.22350", "authors": "Dongxu Yang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-16", "apa": "Yang, D., Yan, H., Wang, R., Zhang, B., Zuo, H., Zhao, Y., Chen, Y., Liao, X., Gao, C., Jiang, T., Chen, Y., Wang, Q., Yu, Z., Li, X., Zhang, Y., Sun, J., Xu, R., Mi, D., Wu, T., … Wang, X. (2026). FDE-Gym: The Last Mile of AI Delivery (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22350", "why": "仕様の決まったタスクではなく、顧客先での導入作業を評価する新しいエージェント評価環境を示した（HF投票188）。", "explain": {"basis": "抄録", "basis_note": "Hugging Faceの抄録を使用", "preprint": true, "short": true, "p1": "仕様の決まった課題ではなく、曖昧な要望を確かめ、稼働中のシステムで隠れた制約を見つける「顧客先での導入作業」をAIエージェントで評価するベンチマークFDE-Gymを作った（抄録）。", "p3": "18部門・20の顧客シナリオから専門家が作った95の課題で、台本のある関係者と変更可能な顧客システムを模擬する。顧客自身の成功指標の改善を0〜1に正規化し、関係者とのやり取りなどに減点を課す。", "p5": "7社の13構成を評価し、隠れた制約を見つける必要がある現実的な設定で、最良でも平均0.56、95課題中14課題しか解決しなかった。主要な事実をすべて得た23課題でも、0.8以上は10課題だった（抄録）。", "fun": "「この仕様どおりに作って」と言われれば、AIはかなり上手に作れます。でも本当の仕事では、お客さん自身も気づいていない条件を聞き出すところから始まります。この評価で、AIがいちばん苦手なのはまさにそこだとわかりました。仕事の「最後の一マイル」の難しさです。", "unverified": "なし"}}, {"id": "pn42", "rank": 42, "field": "機械学習", "headline": "完全か疎か：ニューラルネットの2つの識別可能性", "title": "Complete or Sparse: A Tale of Two Identifiabilities", "url": "https://arxiv.org/abs/2610.20851", "authors": "Junze Zhou ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Zhou, J., & Klindt, D. (2026). Complete or Sparse: A Tale of Two Identifiabilities (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20851", "why": "教師あり学習がいつ真の表現を回復できるかを識別可能性として理論化し、機械的解釈可能性に基礎を与えた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "教師あり学習がデータの背後の真の潜在変数を回復できる条件（識別可能性）を、ラベルが潜在変数を生むか、潜在変数がラベルを生むかの2つの因果の向きで調べた（抄録）。", "p3": "表現の次元が潜在空間以上なら最適な符号化器は潜在変数に線形であることを証明し、次元が足りないと識別可能性が一般に失われることを示す。さらに非負の活性化とエネルギー効率、または疎性とspark条件などの追加の制約で個々の潜在変数の回復を示す。", "p5": "生成的な設定では各ニューロンがちょうど1つの潜在変数を表す（いわゆるおばあさん細胞のような選択的応答）ことを説明し、識別的な設定では圧縮センシングの構造を受け継いで疎辞書学習で個々の潜在変数を完全に回復できることを示した（抄録）。", "fun": "脳には、特定の人の顔だけに反応する「おばあさん細胞」があるという話があります。この研究は、エネルギーを節約しながら学ぶと、人工のニューロンも1つの要因だけを担当するようになることを数学的に示しました。AIの中身が読めるようになる条件を探る基礎研究です。", "unverified": "なし"}}, {"id": "pn43", "rank": 43, "field": "機械学習", "headline": "ディリクレ過程で次元に依存しないPAC-Bayes汎化", "title": "Dimension-Free PAC-Bayes Generalization for Deep Neural Networks via Dirichlet Processes", "url": "https://arxiv.org/abs/2610.21340", "authors": "Sumit Vashishtha", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Vashishtha, S. (2026). Dimension-Free PAC-Bayes Generalization for Deep Neural Networks via Dirichlet Processes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21340", "why": "パラメータ空間に事前分布を置く従来のPAC-Bayesの次元依存を、ディリクレ過程で取り除いた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ネットワークのパラメータ数に依存しないPAC-Bayesの汎化保証を、事前分布をパラメータ空間ではなくデータ分布の空間にディリクレ過程で置くことで得た（抄録）。", "p3": "学習アルゴリズムによる押し出し測度でパラメータの分布を誘導し、データ処理不等式で、パラメータ空間の相対エントロピーをデータ空間のディリクレ過程のダイバージェンスで抑える。後者はディガンマ関数で閉形式に計算する。", "p5": "保証はパラメータ数・幅・深さに依存しない。MNIST全体で7,850〜4,203,522パラメータのモデルについて、従来の重み空間の上界が940%を超えて無意味になるのに対し、提案の保証は8.8〜9.4%で安定した（抄録）。", "fun": "巨大なAIほどパラメータが多く、従来の理論では「テストで間違える率は1000%以下」のような意味のない保証しか出せませんでした。この研究は、見方をパラメータからデータの側に移すことで、AIの大きさに関係なく1割程度という意味のある保証を出しました。", "unverified": "MNIST以外のデータでの結果は未確認。"}}, {"id": "pn44", "rank": 44, "field": "機械学習", "headline": "推論LLMの逐次実験計画を償却する", "title": "Amortizing Sequential Experimental Design in Reasoning LLMs", "url": "https://arxiv.org/abs/2610.20832", "authors": "Anita Kriz ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Kriz, A., Berthon, A., Astorga, N., & van der Schaar, M. (2026). Amortizing Sequential Experimental Design in Reasoning LLMs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.20832", "why": "LLMが情報を適応的に集めるのが苦手な実験計画タスクで、逐次計画を学習で償却する方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "情報を適応的に集めるのが苦手なLLMに、情報利得を報酬として推論を学ばせ、逐次ベイズ実験計画を償却（あらかじめ学習）した（抄録）。", "p3": "実験の生成モデルをLLM自身の信念とは独立に指定し、選んだモデルのもとで期待情報利得を最適化する。生成モデルの作り方、報酬の推定、仮説空間、多段の目的、計算コストなどの設計を比べる。", "p5": "20の質問ゲームで、情報獲得と課題成績が改善し、推論時・学習時のベイズ実験計画の基準を大幅に低いコストで上回り、未知のカテゴリにも一般化した。臨床対話のMedi-Qへの正の転移も示した（抄録）。", "fun": "「20の質問」ゲームで勝つには、毎回、答えの候補を半分に減らすような質問をするのがコツです。LLMは物知りでも、この「どれを聞けば一番わかるか」を考えるのが苦手でした。その質問のうまさを学習で身につけさせ、医療の問診にも応用できた点が面白いところです。", "unverified": "性能の具体的な数値は未確認。"}}, {"id": "pn45", "rank": 45, "field": "機械学習", "headline": "文脈内学習で生存分析をする基盤モデル", "title": "SurvICL: a Foundation Model for in-context Survival Analysis", "url": "https://arxiv.org/abs/2610.22242", "authors": "Julie Alberge ほか", "venue": "arXiv", "date": "Fri, 16 Oct 2026", "apa": "Alberge, J., Bleistein, L., Abécassis, J., Morvan, M. L., Varoquaux, G., & Holzmüller, D. (2026). SurvICL: a Foundation Model for in-context Survival Analysis (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22242", "why": "打ち切りのある小規模データでも使える、生存分析向けの表形式基盤モデルを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "打ち切りのある小規模データでも半世紀前のCoxモデルを上回る、文脈内学習で生存曲線を予測する表形式基盤モデルSurvICLを作った（抄録）。", "p3": "新しい柔軟な比例オッズ事前分布から生成した合成データだけで事前学習する。合成データでは打ち切りのない事象時刻が得られるので、通常の分位点回帰の損失で学習できる。103データセットの過去最大の生存分析ベンチマークも作った。", "p5": "設計判断に使わなかった63データセットで、調整なしで20の基準に対し、統合ブライアスコアの対比較で82.9%勝ち（次点のCoxは71.3%）、小規模データでCoxを上回る初めてのモデルになった（抄録）。", "fun": "「いつ起きるか」を予測する生存分析では、半世紀前に作られたCoxの方法が今でも強敵でした。この研究は、本物の患者データではなく、作り物のデータを大量に見せて学ばせることで、ついにCoxを超えました。作り物なら「結末」まで全部わかる、という利点を生かした工夫です。", "unverified": "なし"}}, {"id": "pn46", "rank": 46, "field": "政治学", "headline": "アイデンティティ選挙と報道機関の供給", "title": "Identity-Based Elections and Media Supply", "url": "https://doi.org/10.2139/ssrn.7615991", "authors": "Akhmad Susamto", "venue": "SSRN", "date": "2026-10-15", "apa": "Susamto, A. (2026). Identity-Based Elections and Media Supply. https://doi.org/10.2139/ssrn.7615991", "why": "有権者のアイデンティティに基づく選好が、政治情報の媒体の供給と情報集約をどう変えるかをモデル化した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "有権者が自分の集団の政党に有利な結論を望むとき、どんな報道機関が供給され、それが情報の集約にどう影響するかを理論モデルで示した（抄録）。", "p3": "各有権者は、自分で選べない外部の信号に加えて、自集団の政党を支持する事後確率を最大にする信号構造を選ぶ。各媒体は1つの集団向けに1つの信号構造を提供し広告収入を得る。独立所有と保護された独占を比べ、デジタル化が一方的な媒体のコストを下げる。", "p5": "外部の信号が不精確なら一方的な信号（普段は好ましいニュース、まれに決定的な悪いニュース）を、精確なら両面的な信号を好む。独立所有では、外部の信号が不精確な集団に一方的な媒体が参入する（抄録）。", "fun": "人は自分の味方に有利なニュースを好みがちです。この研究は、周りの情報があいまいな集団ほど、いつも味方に甘いけれどたまに決定的な悪い知らせも伝える媒体を好む、と示しました。偏った報道が生まれる理由を、需要と供給の経済学で説明している点が面白いところです。", "unverified": "保護された独占のもとでの結果は未確認（抄録が途中で切れている）。"}}, {"id": "pn47", "rank": 47, "field": "政治学", "headline": "フェイスブックの規模と票は一致しない（ギリシャ）", "title": "Bigger Page, Fewer Votes: SYRIZA, New Democracy and Facebook in Greece, 2015 to 2020", "url": "https://doi.org/10.2139/ssrn.7615703", "authors": "Tristan Hotham", "venue": "SSRN", "date": "2026-10-15", "apa": "Hotham, T. (2026). Bigger Page, Fewer Votes: SYRIZA, New Democracy and Facebook in Greece, 2015 to 2020. https://doi.org/10.2139/ssrn.7615703", "why": "ギリシャ5党の3万件超の投稿から、ページの大きさと得票の関係を分析した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "ギリシャの5政党と4人の党首のFacebookの投稿31,532件（2015年1月〜2020年9月）で、反応の量と得票を比べ、政権交代の前後の党首ページを追った（抄録）。", "p3": "CrowdTangleで集めた投稿の反応（インタラクション）の分け前を、同じ政党間の得票の分け前と比べ、ページの規模や投稿量、いいねあたりの反応を見る。", "p5": "2019年選挙前の1か月、SYRIZAとツィプラスのページは反応の56%と61%を得たが、得票は33%と36%だった。新民主主義党とミツォタキスは25%と21%で、得票は46%だった。差は投稿の質ではなく、聴衆の規模と投稿量の違いと整合した（抄録）。", "fun": "SNSで「いいね」がたくさん集まる政党が選挙で勝つとは限りません。ギリシャでは、反応の多かった側が負け、少なかった側が勝ちました。反応の多さは、投稿の回数やフォロワーの数で決まる部分が大きく、民意の大きさとは別物だということを示しています。", "unverified": "なし"}}, {"id": "pn48", "rank": 48, "field": "教育", "headline": "インディアナ州の学校バウチャー：負の選択と同級生効果", "title": "Negative Selection and Peer Effects in Indiana's Voucher Program", "url": "https://doi.org/10.2139/ssrn.7616518", "authors": "Kendyl Guzman", "venue": "SSRN", "date": "2026-10-15", "apa": "Guzman, K. (2026). Negative Selection and Peer Effects in Indiana’s Voucher Program. https://doi.org/10.2139/ssrn.7616518", "why": "私立学校バウチャーに誰が移るかと、その同級生効果を推定した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "インディアナ州の私立学校バウチャーを使う生徒の特徴と、その生徒が公立校を去ったことが残った同級生に与える影響を推定した（抄録）。", "p3": "バウチャー制度への自己選択を、過去の懲戒歴などの記録で調べ、懲戒歴のある生徒とない生徒の転出が、残った同級生の停学に与える効果を比べる。", "p5": "成績の良い生徒が選んで移るという正の選択の証拠はなく、懲戒歴の多い生徒が制度を選んでいた。懲戒歴のある生徒の転出で、残った同級生100人あたり校内停学が2.7件、校外停学が1.7件減り、懲戒歴のない生徒の転出では変化がなかった（抄録）。", "fun": "学校選択制では「できる子から私立へ抜けて、公立が苦しくなる」と心配されがちです。ところがこの州では、むしろ問題行動の多い子が私立へ移り、残った公立の教室は落ち着きました。制度の効果は、誰が動くかによって正反対にもなるという例です。", "unverified": "学力への影響は未確認。"}}, {"id": "pn49", "rank": 49, "field": "教育", "headline": "教員が届ける学校の心の健康プログラムをRCTで検証", "title": "Youth First Supports Adolescent Wellbeing: A Longitudinal Cluster-Randomized Controlled Trial of a Teacher-Delivered School-Based Program in India", "url": "https://doi.org/10.31234/osf.io/vg5ju_v3", "authors": "Peter L. Cooper ほか", "venue": "PsyArXiv", "date": "2026-10-15", "apa": "Cooper, P. L., Leventhal, K. S., Misra, G., Bhatla, N., Shanker, H., & Leventhal, S. (2026). Youth First Supports Adolescent Wellbeing: A Longitudinal Cluster-Randomized Controlled Trial of a Teacher-Delivered School-Based Program in India. https://doi.org/10.31234/osf.io/vg5ju_v3", "why": "インドでのクラスター無作為化比較試験で、教員による思春期のウェルビーイング支援の効果を長期に検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（PsyArXiv）", "preprint": true, "short": true, "p1": "インド・ビハール州の農村の公立校で、教員が実施する思春期のウェルビーイングの授業Youth Firstの効果を、クラスター無作為化比較試験の二次分析で長期に検証した（抄録）。", "p3": "70校のうち基礎データのある69校の7〜8年生5,445人を介入群と通常教育群に割り付け、開始時・8か月・20か月で測る。修正ITT分析で、学校と生徒の変量切片を持つ混合効果の差の差モデルを使い、主要評価項目はBenjamini-Hochberg法で補正した。", "p5": "補正後も、複数の時点とコホートで社会的・仲間の支援を有意に改善し、心理的ウェルビーイングにも効果があった。探索的には自己効力感や内在化症状、喫煙などにも名目上の効果があり、一部は修了1年後にも続いたか現れた（抄録）。", "fun": "心の健康を守る授業を、専門家ではなく普段の先生が、ふつうの公立校で行っても効果があるのか。5千人以上の生徒を学校単位でくじ引きに分けて確かめ、とくに友だちに支えられている感覚が育ったことがわかりました。大規模に広げられる方法として意味のある結果です。", "unverified": "効果量の値は未確認。"}}, {"id": "pn50", "rank": 50, "field": "教育", "headline": "最適なSTEM教育：一般均衡で評価する", "title": "Optimal STEM Education", "url": "https://doi.org/10.2139/ssrn.7616542", "authors": "Charles Ka Yui Leung ほか", "venue": "SSRN", "date": "2026-10-15", "apa": "Leung, C. K. Y., & Yuen, C. Y. K. (2026). Optimal STEM Education. https://doi.org/10.2139/ssrn.7616542", "why": "専攻・職業選択と内生的な技術革新を入れたモデルで、STEM教育の推進策の効果を評価した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "専攻と職業の選択、内生的な技術革新を入れた一般均衡のライフサイクルモデルで、STEM教育の推進策の効果を評価した（抄録）。", "p3": "モデルの中で、STEMの拡大、学費の一般的な支援、STEMへの補助、女性を対象にしたSTEM政策、研究開発への直接補助を同程度の費用で比べる。", "p5": "適度なSTEM拡大は厚生と成長を高めるが、行き過ぎると向いた専攻の学生を引き抜き研究能力を下げる。同程度の費用では一般的な学費支援が厚生を、STEM補助が成長を最も高め、女性対象の政策は男女の所得差を縮めるが強すぎると厚生を下げた（抄録）。", "fun": "「理系を増やせば国が豊かになる」と言われますが、増やしすぎると、本当は文系や他の分野に向いた人まで理系に来て、かえって研究の力が落ちるという結果です。どんな政策にも「ちょうどよい量」があることを、経済全体の模型で示した点が面白いところです。", "unverified": "モデルの較正の対象国は未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "オンライン調査にAI回答者はどれだけ紛れ込むか", "title": "Estimating the threat of AI-agent responding across online survey platforms", "url": "https://doi.org/10.1073/pnas.2606460123", "authors": "Grace Zhang ほか", "venue": "Proceedings of the National Academy of Sciences of the United States of America", "date": "2026-10-15", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Zhang, G., Walatka, R., Chen, S. Y., Moore, A. K., Urminsky, O., Fernandez, K., Low, A., Bogard, J. E., & Fox, C. R. (2026). Estimating the threat of AI-agent responding across online survey platforms. Proceedings of the National Academy of Sciences, 123(42). https://doi.org/10.1073/pnas.2606460123", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由、PNAS）を使用。本文は入手できず", "preprint": false, "p1": "人間のふりをしてオンライン調査に答えるAIエージェントを見分ける検査を検証し、7つの調査プラットフォームでAI検査に落ちる回答者の割合を推定し、見逃されたAIが調査結果を変えうることを示した。", "p2": "LLMの進歩で、AIエージェントがオンライン調査の人間の回答者になりすます懸念が広がっているが、調査プラットフォームにAIがどれほど紛れ込んでいるか、どう検出すべきかは分かっていなかった（抄録）。", "p3": "確認済みの人間の参加者と、指示を与えた市販のAIエージェントおよび専用に作ったAIエージェントをよく分離できる一連のAI検出テストを検証し、それを使って7つのオンラインプラットフォームで調査を集める（抄録）。", "p4": "プラットフォームごとのAI検査の不合格率を、対面で参加した人間の偽陽性率と比べ、検出されなかったAIが調査結果に与える影響を示す（抄録。検査の具体的な内容は本文未確認）。", "p5": "AI検査の不合格率はプラットフォームによって6〜41%と大きく異なり、対面の人間参加者の偽陽性率は2.4%だった。検出されないAIエージェントがオンライン調査の結果に影響しうることも示した（抄録）。", "p6": "一部のプラットフォームではAIエージェントの率が低いデータが得られているようだとし、AI検出テストと体系的なデータ品質の監視が急務だと述べる（抄録）。解釈：検出テスト自体が今後のAIの進歩で無効になる可能性は抄録からは評価できない。", "fun": "ネットのアンケートに答えているのは、本当に人間でしょうか。AIを見分けるテストを作って7つの調査サイトで試すと、テストに落ちる回答者がサイトによって6%から41%もいました。社会の意見を知るための調査が、AIの声で汚れてしまう危険を数字で示した研究です。", "unverified": "検出テストの内容、標本の規模、結果への影響の大きさは未確認。"}}, {"id": "jr02", "rank": 2, "headline": "橋梁モニタリングの連続欠測を分解＋深層学習で復元", "title": "A Consecutive Missing-Data Recovery Method for Bridge Health Monitoring Based on an ICEEMDAN-PE-LSTM-Informer Hybrid Model", "url": "https://doi.org/10.3390/buildings16204087", "authors": "Xu Wang ほか", "venue": "Buildings", "date": "2026-10-16", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "apa": "Wang, X., Xie, G., Xiang, T., Han, Z., & Kong, H. (2026). A Consecutive Missing-Data Recovery Method for Bridge Health Monitoring Based on an ICEEMDAN-PE-LSTM-Informer Hybrid Model. Buildings, 16(20), 4087. https://doi.org/10.3390/buildings16204087", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由、Buildings）を使用。本文は入手できず", "preprint": false, "p1": "橋梁の構造ヘルスモニタリングで連続して欠けた計測区間を、信号を多スケールの成分に分解してから成分ごとにLSTMとInformerの並列モデルで予測して足し合わせる方法で、最長12時間の欠測まで高い精度で復元した。", "p2": "モニタリング信号は複雑で非定常なため、連続した欠測区間の再構成は難しかった（抄録）。", "p3": "ICEEMDAN（改良した完全アンサンブル経験的モード分解）と順列エントロピーで、原信号を時間特性の異なる固有モード成分に分ける。各成分を、局所的な時間依存に強いLSTMと長距離依存に強いInformerの2系統で予測し、全結合層で融合し、成分の予測を線形に足して復元する（抄録）。", "p4": "稼働中の橋梁の欠測のない支承変位とひずみの記録に、人為的に連続した欠測区間を作り、元の計測値を正解として、標準のLSTMと単独のInformerとRMSEで比べる（抄録）。", "p5": "最長の予測幅72ステップ（12時間の連続欠測）で、支承変位とひずみのRMSEは標準LSTMより54.06%と44.11%、単独のInformerより46.06%と31.47%小さかった（抄録）。", "p6": "評価は1つの橋の2種類の応答データに限られ、欠測は人為的に作ったものである（抄録）。解釈：実際のセンサ故障による欠測（たとえば温度変化などの外乱と重なる場合）での性能は未検証。", "fun": "橋に付けたセンサは、通信の切断や故障で何時間もデータが抜けることがあります。この研究は、信号を「ゆっくりした波」と「細かい波」などに分け、それぞれを得意なAIに予測させてから組み立て直しました。複雑な問題を分解して解くという、数学の定石のような発想です。", "unverified": "成分の数、学習データの期間、比較した他の手法は未確認。"}}, {"id": "jr03", "rank": 3, "headline": "箱桁のソフトフラッターをデジタルツインで解明", "title": "A digital twin-driven investigation of coupled vertical-torsional soft flutter of a flat closed-box bridge deck section", "url": "https://doi.org/10.1080/19942060.2026.2741449", "authors": "Bo-Man Cheng ほか", "venue": "Engineering Applications of Computational Fluid Mechanics", "date": "2026-10-15", "citescore": 10.3, "citescore_year": "2025", "apa": "Cheng, B.-M., Gao, G.-Z., Xu, Y.-L., & Li, H.-Y. (2026). A digital twin-driven investigation of coupled vertical-torsional soft flutter of a flat closed-box bridge deck section. Engineering Applications of Computational Fluid Mechanics, 20(1). https://doi.org/10.1080/19942060.2026.2741449", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OpenAlexの抄録を使用（Engineering Applications of Computational Fluid Mechanics）。本文は入手できず", "preprint": false, "p1": "扁平箱桁の橋桁断面で起きる鉛直-ねじれ連成のソフトフラッター（自己抑制的な限界サイクル振動）を、風洞試験とCFDとガウス過程の代理モデルを組み合わせたデジタルツインで再現し、試験していない風速の応答も予測できるようにした。", "p2": "ソフトフラッターは近年、鈍い断面の橋桁で観測されているが、非線形で自己抑制的な振動のため、その物理的な仕組みの解明と応答の予測が難しかった（抄録）。", "p3": "同期した力-振動の計測系による風洞試験を物理的実体とし、流体-構造連成と非線形を考慮したCFDモデルを仮想実体とする。ガウス過程の代理モデルと段階的なパラメータ最適化で、機械的な減衰比と剛性を逆推定する自己学習型のデジタルツインを作り、パラメータと風速の対応表で未試験の風速に広げる（抄録）。", "p4": "風洞試験で記録した鉛直-ねじれの連成振動の応答と自励空気力を、デジタルツインがどれだけ再現できるかで評価する（抄録。誤差の指標は本文未確認）。", "p5": "構築したデジタルツインは連成ソフトフラッターの限界サイクル振動の特徴を正確に再現し、空気力によるエネルギー入力・減衰による散逸・振動の安定性の関係を明らかにしたとする（抄録。数値は抄録になし）。", "p6": "対象は1つの扁平箱桁断面の風洞模型で、実橋や他の断面形状への一般化は未検証（解釈）。代理モデルによる逆推定の不確実性の扱いは抄録からは分からない。", "fun": "橋の床が風で揺れ始めても、ある大きさで止まる「ソフトフラッター」という不思議な揺れがあります。この研究は、風洞の実験とコンピュータの中の仮想の橋（デジタルツイン）を往復させて、実験から足りない値を推定し、試していない風速での揺れまで予測できるようにしました。", "unverified": "再現精度の数値と、試験した風速の範囲は未確認。"}}, {"id": "jr04", "rank": 4, "headline": "集団苦情には速さか個別対応か：企業応答の比較", "title": "Response efficiency versus response customization: An examination of firms’ responses to platform-empowered group complaints", "url": "https://doi.org/10.1177/10591478261498521", "authors": "Zilong Liu ほか", "venue": "Production and Operations Management", "date": "2026-10-15", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "apa": "Liu, Z., Wang, X., Luo, X. (., Chu, C., & Song, T. (2026). Response efficiency versus response customization: An examination of firms’ responses to platform-empowered group complaints. Production and Operations Management. https://doi.org/10.1177/10591478261498521", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由、Production and Operations Management）を使用。本文は入手できず", "preprint": false, "p1": "中国の苦情プラットフォームの大規模データで、多くの消費者がまとまって声を上げる集団苦情が、企業の応答をかえって遅く、共感と説明の乏しいものにすることを示した。", "p2": "デジタルプラットフォームのサービス運用の研究は個人の苦情が中心で、プラットフォームが可能にした集団苦情に企業がどう応答するかは分かっていなかった（抄録）。", "p3": "応答の効率と応答の個別化のトレードオフという見方をとり、そのトレードオフが集団苦情の展開とともに変わると論じ、中国の大手苦情プラットフォームTousuのデータで検証する（抄録）。", "p4": "応答時間と、応答に含まれる共感と説明を結果とし、集団の規模の動的な変化と、要求の多様性の動的な変化による違いを見る（抄録）。", "p5": "集団苦情は逆説的に応答時間を延ばし、共感と説明を減らした。要求の多様性が低いときは集団が大きいほど標準化された効率志向の応答に、多様性が高いときは集団が大きいほど遅いが個別化された応答になった（抄録）。", "p6": "1つのプラットフォーム・1か国のデータで、制度の異なる市場への一般化は未検証（解釈）。応答の質が顧客の満足や再購入に与える影響は抄録からは分からない。", "fun": "苦情をみんなでまとめて出せば、会社は早く丁寧に対応してくれそうです。ところが実際には、集団苦情ほど返事が遅く、気持ちのこもらない定型文になりがちでした。ただ、人によって求めることがばらばらなときは、時間をかけて一人ひとりに合わせた返事をしていたのが面白い点です。", "unverified": "データの件数と効果の大きさは未確認。"}}, {"id": "jr05", "rank": 5, "headline": "トピックモデル×BERTで組織概念を大規模文書から測る", "title": "Measuring Organizational Constructs in Large-Scale Text: An interpretive framework combining topic modeling and BERT", "url": "https://doi.org/10.1177/01708406261499506", "authors": "Ana Alina Tudoran ほか", "venue": "Organization Studies", "date": "2026-10-16", "sjr": 4.358, "citescore": 11.4, "citescore_year": "2025", "apa": "Tudoran, A. A., Richter, N. F., Higuera Reina, J. A., & Verma, S. (2026). Measuring Organizational Constructs in Large-Scale Text: An interpretive framework combining topic modeling and BERT. Organization Studies. https://doi.org/10.1177/01708406261499506", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由、Organization Studies）を使用。本文は入手できず", "preprint": false, "p1": "大規模な文書から組織の概念を測るために、構造トピックモデル（STM）と質的な解釈でコーディングの枠組みを作り、それをBERTに学習させて文書ごとに適用する2段階の枠組みを示した。", "p2": "STMは解釈の深さを与えるがトピックの割合は文書ごとの概念の測度として作られておらず、BERTは大規模に測れるが、概念の操作化を解釈の作業に根ざさせる必要があった（抄録）。", "p3": "質的な解釈とSTMの分析でコーディングの枠組みを作り、BERTを微調整して文書全体に当てる。理論から出発する「概念主導」と、データから出発する「パターン発見」の2つの研究アプローチを定式化し、検証され監査可能な文書単位の測度という共通の終点に導く（抄録）。", "p4": "2万件を超える従業員のレビューで枠組みを例示し、計算上の診断で解釈の修正を導く反復的な概念の検証を行う（抄録。精度の指標は本文未確認）。", "p5": "枠組みは反復的な概念の検証を支え、理論に基づく組織分析に使える文書単位の測度を生み出すとする（抄録。BERTの分類精度などの数値は抄録になし）。", "p6": "従業員レビューという1種類の文書での例示で、他の文書や概念への一般化は未検証（解釈）。人の解釈の部分が結果をどれだけ左右するかの評価は抄録からは分からない。", "fun": "2万件もの口コミを人が全部読んで分類するのは大変です。そこで、まず人とAIのトピック分析で「何を数えるか」の物差しを丁寧に作り、それを別のAIに覚えさせて残りを自動で分類します。人の解釈の深さと機械の速さを、役割分担でつなげた方法です。", "unverified": "BERTの分類精度と、どの組織概念を測ったかは未確認。"}}, {"id": "jr06", "rank": 6, "headline": "予測スクリーニングは児童保護の現場判断をどう変えたか", "title": "Routinized Deference: Predictive Screening and Bureaucratic Capacity in Child Protective Services", "url": "https://doi.org/10.1093/jopart/muag032", "authors": "Jiaen Wu", "venue": "Journal of Public Administration Research and Theory", "date": "2026-10-16", "sjr": 3.301, "citescore": 11.0, "citescore_year": "2025", "apa": "Wu, J. (2026). Routinized Deference: Predictive Screening and Bureaucratic Capacity in Child Protective Services. Journal of Public Administration Research and Theory. https://doi.org/10.1093/jopart/muag032", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由、Journal of Public Administration Research and Theory）を使用。本文は入手できず", "preprint": false, "p1": "米国の児童保護サービスで郡ごとに導入された予測スクリーニングのツールが、調査件数を変えず、虐待が実証された調査の割合を約15%下げたことを示し、「定型化された追従」という仕組みで解釈した。", "p2": "予測アルゴリズムは行政の現場の判断を支えるために広がっているが、それが官僚の能力にどう影響するかの証拠は限られていた（抄録）。", "p3": "NCANDSの2010〜2023年のデータで、郡ごとに時期の異なる導入を利用した積み重ね型の差の差（stacked DiD）設計で推定する（抄録）。", "p4": "開始された調査の総数と、実証（substantiated）された調査の割合を結果とする。運用能力が上がるなら実証の割合は保たれるか上がるはずだという考えで、能力向上と誤分類の仮説を比べる（抄録）。", "p5": "調査の総数は変わらず、実証された調査の割合が約15%と大きく下がった。これは運用能力の向上とは整合せず、分析能力を損なう誤分類と整合した（抄録）。", "p6": "著者は、仕事量と説明責任の圧力のもとで、アルゴリズムの推奨が手続き上弁明しやすい既定値になる「定型化された追従」を仕組みとして提案するが、これは結果と整合する解釈で、直接は観察していない（抄録）。", "fun": "AIが「この家庭は調べたほうがいい」と勧めると、忙しい職員はそれに従っておけば後で責められません。その結果、調査の数は同じなのに、実際に虐待が確認される割合が下がっていました。AIの助けが、かえってプロの判断力を弱めてしまう可能性を示した研究です。", "unverified": "導入した郡の数と、推定の頑健性の検証は未確認。"}}, {"id": "jr07", "rank": 7, "headline": "LLMの出力を心理尺度として評価する5領域の枠組み", "title": "Evaluating Large Language Model–Derived Outputs as Psychological Measures: A Five-Domain Psychometric Framework With Application to Daily Stress", "url": "https://doi.org/10.2196/102768", "authors": "Inyong Jeong ほか", "venue": "Journal of Medical Internet Research", "date": "2026-10-15", "sjr": 2.109, "citescore": 10.4, "citescore_year": "2025", "apa": "Jeong, I., Park, S., Jhon, M., Kim, D.-K., Park, J.-H., Kim, Y., Jang, M., Kim, J.-M., Kim, J.-w., & Lee, H. (2026). Evaluating Large Language Model–Derived Outputs as Psychological Measures: A Five-Domain Psychometric Framework With Application to Daily Stress. Journal of Medical Internet Research, 28, e102768–e102768. https://doi.org/10.2196/102768", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由、Journal of Medical Internet Research）を使用。本文は入手できず", "preprint": false, "p1": "LLMが自然言語から取り出した心理的な特徴を、外部ラベルの予測としてではなく「心理尺度」として、再現性・収束妥当性・生態学的妥当性・増分価値・専門家評価の5つの領域で評価する枠組みを示し、日々のストレスに適用した。", "p2": "LLMの出力は通常、外部ラベルの予測としてだけ評価されるが、ラベル自体が不完全だと、予測の最適化はラベルとの一致と概念の測定を混同してしまう。多領域の測定志向の評価は行われていなかった（抄録）。", "p3": "コールセンターの従業員279人の15日間の日々の音声の語り（3,556人日、生態学的瞬間評価）から、GPT-5.2で13の言語特徴を取り出し、辞書に基づくLIWC-22と比べる。Gemini 2.5 Flashでも取り出し直して頑健性を確かめる（抄録）。", "p4": "抽出の再現性（ICC）、辞書ツールとの収束妥当性、当日のストレスとの個人内・個人間の関連、4群比較（基準、基準＋辞書、基準＋LLM、両方）での説明分散、方法を伏せた専門家の評価と誤りの帰属で評価する（抄録）。", "p5": "再現性は平均ICC=0.987、収束妥当性は概念によりスピアマンρ=0.08〜0.79、否定的感情は当日のストレスを個人内で追跡した（β=0.68）。LLM特徴は日々のストレスの説明分散を13.2%から30.4%に高め、辞書ツールは16.9%だった。専門家は方法の食い違いが最大の語りで83.7%（261/312）LLMを選び、偽陽性の53%（35/66）は基準ラベルの限界によった。Geminiでも主要な性質が再現された（人単位r=0.94）（抄録）。", "p6": "対象は1つの職種の従業員と1つの構成概念（日々のストレス）で、他の集団や概念への一般化は未検証（解釈）。抄録は途中で切れており、著者が挙げる限界の全体は確認できない。", "fun": "AIに日記のような話を読ませて「今日のストレス」を測るとき、正解ラベルと合っているかだけを見ると、ラベルそのものの不完全さに気づけません。この研究は、AIの出力を心理テストのように多方面から点検しました。AIが「物差し」として信頼できるかを確かめる方法を作ったのです。", "unverified": "5領域の評価の詳細な手順と、抄録の後半に書かれた知見は未確認。"}}, {"id": "jr08", "rank": 8, "headline": "中小企業支援は個別助言と研修のどちらが効くか", "title": "Tailoring government support for SMEs' investment and financial health: balancing advisory services and training programs", "url": "https://doi.org/10.1057/s41599-026-09285-3", "authors": "Sanghyun Jung ほか", "venue": "Humanities and Social Sciences Communications", "date": "2026-10-15", "sjr": 0.904, "citescore": 5.7, "citescore_year": "2025", "apa": "Jung, S., Berwart, E., Ojeda, G., & Bravo, C. (2026). Tailoring government support for SMEs’ investment and financial health: balancing advisory services and training programs. Humanities and Social Sciences Communications. https://doi.org/10.1057/s41599-026-09285-3", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由、Humanities and Social Sciences Communications）を使用。本文は入手できず", "preprint": false, "p1": "チリの中小企業に対する政府支援で、個別の経営助言は標準化された研修より投資額を大きく増やし、それに伴う借入の増加は延滞を伴わない戦略的なものであることを、行政データで因果的に推定した。", "p2": "中小企業支援の方法として、個別の助言と標準的な研修のどちらにどれだけ資源を配るべきかの因果的な証拠は乏しかった（抄録）。", "p3": "支援機関の記録と全国の財務データを統合した独自の行政データで、約100の事前の特性と財務履歴を使い、処置の逆確率重み付け（IPTW）と事後二重選択（PDS）回帰で、投資・負債・財務健全性への効果を推定する（抄録）。", "p4": "2つの能動的な支援方法の相対的な効果を比べる設計で、支援を受けない対照群はない。性別による違いも見る（抄録）。", "p5": "助言は研修より有意に高い投資額を生んだ。助言は事後の負債の増加と関連したが延滞の有意な増加はなく、借入は困窮ではなく戦略的なものと示唆された。PDS分析では、女性経営の中小企業はより保守的で、投資も借入も少なかった（抄録。効果量は抄録になし）。", "p6": "支援なしの対照群がないため、支援そのものの絶対的な効果は推定できないと著者は述べる（抄録）。解釈：観察データであり、未観測の選択（どの企業が助言を選ぶか）が残る可能性がある。", "fun": "困っている中小企業を助けるなら、一社ごとに相談に乗るのと、まとめて研修を開くのと、どちらが効くでしょうか。チリのデータでは、個別の相談のほうが投資を大きく増やしました。借金も増えましたが返済が滞ってはおらず、攻めの借入だったようです。", "unverified": "標本の規模、期間、効果の大きさは未確認。"}}, {"id": "jr09", "rank": 9, "headline": "市場情報を加えたZスコアで新興国の財務困窮を分類", "title": "Financial distress classification in Vietnam: a market-sensitive Z-score framework using quadratic discriminant analysis", "url": "https://doi.org/10.1108/ijoem-05-2026-1144", "authors": "Doan Van Dinh", "venue": "International Journal of Emerging Markets", "date": "2026-10-15", "citescore": 10.1, "citescore_year": "2025", "apa": "Dinh, D. V. (2026). Financial distress classification in Vietnam: a market-sensitive Z-score framework using quadratic discriminant analysis. International Journal of Emerging Markets, 1–22. https://doi.org/10.1108/ijoem-05-2026-1144", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由、International Journal of Emerging Markets）を使用。本文は入手できず", "preprint": false, "p1": "ベトナム企業の財務困窮を、AltmanのZスコアの5指標で3つのリスク群に分類するとき、群ごとの共分散の違いを許す二次判別分析（QDA）が、従来の線形判別分析（LDA）より高い精度を出すことを示した。", "p2": "AltmanのZスコアは広く使われる倒産予測の道具だが、リスク群の間で共分散構造が等しいという、実際には成り立たないかもしれない仮定に立っている（抄録）。", "p3": "流動性、累積収益性、営業収益性、市場に基づく支払能力、資産利用効率の5つの標準化指標で、企業を極度リスク・中程度リスク・安定の3群に分け、LDAとQDAを比べる（抄録）。", "p4": "判別分析での精度、ブートストラップの再標本化と交差検証による頑健性、多クラス分類の指標、クラス不均衡のもとでの性能で評価する（抄録）。", "p5": "リスク群の間で共分散の有意な異質性があり、LDAの仮定は満たされなかった。QDAはLDAと交差検証付きLDAを上回り、全体の分類精度は92.0%だった。正準判別分析の第1判別関数は判別の分散の92.6%を説明し、正準相関は0.796だった。資産利用効率と市場に基づく支払能力が最も効いた（抄録）。", "p6": "3つのリスク群の定義が何に基づくか、事前の予測（将来の困窮の予測）か同時点の分類かは抄録から明確でない（解釈）。ベトナム市場以外への一般化も未検証。", "fun": "会社の倒産しやすさを測る有名な「Zスコア」は、危ない会社も安全な会社も「数字のばらつき方は同じ」と仮定しています。でも実際は、危ない会社ほど数字が大きく揺れます。その違いを認める計算に変えるだけで、見分ける精度が上がった、という素直で大事な指摘です。", "unverified": "標本の企業数、期間、リスク群の定義は未確認。"}}, {"id": "jr10", "rank": 10, "headline": "通勤時間の長さが社会的包摂を損なう経路（北京）", "title": "Commute duration, out-of-home discretionary activities and social inclusion as a multifaceted experience: Evidence from Beijing", "url": "https://doi.org/10.1177/00420980261492200", "authors": "Sui Tao ほか", "venue": "Urban Studies", "date": "2026-10-16", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "apa": "Tao, S., & Ma, J. (2026). Commute duration, out-of-home discretionary activities and social inclusion as a multifaceted experience: Evidence from Beijing. Urban Studies. https://doi.org/10.1177/00420980261492200", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由、Urban Studies）を使用。本文は入手できず", "preprint": false, "p1": "北京で、長い通勤が、孤立させる効果と余暇の外出の制約の両方を通じて、個人の社会的包摂の経験を直接・間接に損なうことを示し、社会的包摂を多面的な経験として扱った。", "p2": "通勤時間が個人レベルの社会的包摂をどう形づくるかは十分に理解されておらず、とくに余暇活動を介した経路と、包摂の多面性は扱われてこなかった（抄録）。", "p3": "北京を対象に、通勤時間、家の外での裁量的な活動（余暇・運動など）、多面的な社会的包摂の知覚の相互関係を一連の分析で調べる（抄録。データの種類と分析手法の詳細は本文未確認）。", "p4": "活動への参加の確率と時間の使い方が、社会的支援や帰属感などの包摂の各次元にどう影響するかを見る（抄録）。", "p5": "長い通勤は孤立効果と余暇の外出の制約を通じて社会的包摂を直接・間接に損なった。娯楽活動に使う時間が多いほど社会的支援が、運動に使う時間が多いほど帰属感が強かった（抄録。係数は抄録になし）。", "p6": "1都市のデータで、横断的な関連であれば因果の向きは確定できない（解釈）。著者は職住の近接、X分圏のコミュニティでの娯楽・運動施設の優先、小さな公共空間と交通アクセスの活用を政策として提案している（抄録）。", "fun": "通勤に時間がかかると疲れるだけでなく、人とのつながりまで細っていきます。家に帰る時間が遅くなり、運動や遊びに出かける余裕がなくなるからです。この研究は、社会に受け入れられている感覚が、毎日の移動時間という意外な要因に左右されることを示しました。", "unverified": "標本の規模、包摂の測定尺度、分析手法は未確認。"}}, {"id": "jr11", "rank": 11, "headline": "在宅介護の高齢者に満たされないケアの兆候", "title": "When ageing in place falls short: indicators of unmet care needs among older home care clients in Finland", "url": "https://doi.org/10.1007/s10433-026-00954-5", "authors": "Mari Aaltonen ほか", "venue": "European Journal of Ageing", "date": "2026-10-15", "sjr": 1.507, "citescore": 8.9, "citescore_year": "2025", "apa": "Aaltonen, M., Halonen, P., Edgren, J., Häsä, J., & van Aerschot, L. (2026). When ageing in place falls short: indicators of unmet care needs among older home care clients in Finland. European Journal of Ageing. https://doi.org/10.1007/s10433-026-00954-5", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由、European Journal of Ageing）を使用。本文は入手できず", "preprint": false, "p1": "フィンランド全国の在宅介護のデータで、24時間介護への移行の希望と、家族介護者の負担感という2つの指標が、在宅介護では満たされないケアの必要を示すことを明らかにした。", "p2": "長期介護の政策は住み慣れた家での高齢化（ageing in place）を支える方向に移っているが、在宅介護が不十分だと、満たされないケアの必要、介護者の負担、より手厚い施設への移行の希望につながりうる（抄録）。", "p3": "2023年の全国の在宅介護RAI（利用者評価票）データで、65歳以上の利用者について、24時間介護の希望（本人か家族の意見を含む評価、n=39,652）と、家族介護者の負担（公的と非公式の両方の介護を受ける利用者、n=35,833）をロジスティック回帰で分析する（抄録）。", "p4": "利用者の特性（健康・機能の困難、社会的要因）と2つの結果の関連、2つの指標の間の関連を見る（抄録）。", "p5": "約9%の利用者が24時間介護を希望し、19.5%の介護者が負担を感じていた。これらの群は非公式・公式の介護をより多く受けていた。健康と機能の困難、満たされない必要を示しうる社会的要因が両方の結果と関連し、24時間介護の希望と介護者の負担は強く結びついていた（抄録）。", "p6": "横断的な関連の分析であり、2つの指標が本当に満たされない必要を示すかは、既存の文献と合わせた示唆にとどまる（抄録の記述）。解釈：利用者の希望が本人の意見か家族の意見かの区別の影響は本文で確認が必要。", "fun": "「できるだけ自宅で暮らしたい」と願う高齢者は多いのですが、その願いは十分な支えがあってこそです。この研究は、本人が施設に移りたいと言い出すことと、家族が疲れ切っていることが、在宅の支えが足りないサインになることを示しました。見えにくいケアの不足を数字で捉える試みです。", "unverified": "回帰の係数と、社会的要因の具体的な項目は未確認。"}}, {"id": "jr12", "rank": 12, "headline": "放射線科チームのバーンアウトを仕事の要求度-資源で分析", "title": "Burnout and psychosocial working conditions in a multidisciplinary hospital radiology team: a cross-sectional study using the job demands–resources framework", "url": "https://doi.org/10.1186/s13244-026-02433-y", "authors": "Thomas Dertnig ほか", "venue": "Insights into Imaging", "date": "2026-10-15", "sjr": 1.418, "citescore": 7.6, "citescore_year": "2025", "apa": "Dertnig, T., Kutschar, P., & Wiesinger, H.-P. (2026). Burnout and psychosocial working conditions in a multidisciplinary hospital radiology team: a cross-sectional study using the job demands–resources framework. Insights into Imaging, 17(1). https://doi.org/10.1186/s13244-026-02433-y", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "出版社のPDF本文（序論の目的、方法、結果の参加者と群比較、考察、限界）を読んだ。回帰の表は抄録の値で確認", "preprint": false, "p1": "ドイツの大学病院の放射線科で、職種をまたいだバーンアウトを仕事の要求度-資源（JD-R）モデルで分析し、バーンアウトが主に仕事の要求度、とくに仕事と生活の衝突・仕事量・役割葛藤と結びつき、資源の効果は患者関連のバーンアウトに限られることを示した。", "p2": "放射線科のバーンアウトは大きな懸念だが、欧州の病院放射線科の心理社会的な労働条件のデータは乏しく、研究の多くが医師だけを対象にしていた。同じ組織の中で職種によって要求度-資源のパターンがどう違うかは分かっていなかった（序論）。", "p3": "エッセン大学病院の放射線科で01.12.2025〜14.12.2025（原文の日付表記）に横断的なオンライン調査を行い、コペンハーゲン・バーンアウト尺度（CBI）で個人・仕事・患者関連のバーンアウトを、COPSOQ IIIで心理社会的な労働条件を測る。相関と階層的線形回帰で、要求度と資源の独立の寄与を見る（方法）。", "p4": "149人に配布し79人が回答（53.0%）、63人を分析した（図1）。CBIの内的一貫性はα=0.82〜0.86で、COPSOQの尺度は垂直的信頼（α=0.046）を除き0.73〜0.91だった。職種間の差、病欠15日以上の群との差、仕事満足との関連も見る（結果）。", "p5": "個人と仕事のバーンアウトは患者関連より高く、医療技術者（MTR）は放射線科医より個人のバーンアウトが高かった（p=0.003）。要求度は個人（r=0.686）と仕事（r=0.748）のバーンアウトと強く相関し、回帰では要求度が個人（R²=0.62）と仕事（R²=0.60）のバーンアウトを説明し、資源の有意な上乗せはなかった。患者関連のバーンアウトでは資源が独立の負の関連を示した（R²=0.30）（抄録、結果）。", "p6": "横断研究のため時間的な向きと因果は確定できず、高い要求度がバーンアウトを生んだのか、疲弊が要求度の知覚を高めたのかは分けられない。単一施設・小標本で欠測もあり、一般化と下位群の比較の精度が限られると著者は認める（限界）。", "fun": "仕事で燃え尽きる原因として「やりがいや支え（資源）が足りない」と「仕事が多すぎる（要求度）」の2つが考えられます。放射線科では、燃え尽きの大部分が仕事の量と、家庭との両立の難しさで説明できました。支えを増やすより、まず負担を減らすことが大事だと示唆しています。", "unverified": "補足資料の全結果（非有意を含む）は未確認。"}}, {"id": "jr13", "rank": 13, "headline": "べき型非線形楕円方程式のパラメータ同定の有限要素誤差", "title": "Finite Element Error Analysis for Elliptic Parameter Identification with Power-Type Nonlinearity", "url": "https://doi.org/10.1137/26m1842646", "authors": "De-Han Chen ほか", "venue": "SIAM Journal on Numerical Analysis", "date": "2026-10-16", "sjr": 2.12, "citescore": 5.2, "citescore_year": "2025", "apa": "Chen, D.-H., Lin, Y.-H., & Yousept, I. (2026). Finite Element Error Analysis for Elliptic Parameter Identification with Power-Type Nonlinearity. SIAM Journal on Numerical Analysis, 64(5), 2151–2176. https://doi.org/10.1137/26m1842646", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由、SIAM Journal on Numerical Analysis）を使用。本文は入手できず", "preprint": false, "p1": "べき型の非線形性を持つ楕円型方程式の係数（パラメータ）同定問題について、区分線形の有限要素による最小二乗の再構成を提案し、メッシュ幅・正則化パラメータ・雑音の大きさ・非線形の指数に依存する事前誤差評価を導いた。", "p2": "楕円型方程式の係数同定は線形の場合についてJinらが安定性と誤差評価を示していたが、べき型の非線形性を持つ場合の数値解析は未整備だった（抄録）。", "p3": "適切な最小二乗の最小化問題に基づく数値再構成を作る。主な新しさとして、連続のレベルでの条件付き安定性評価を確立し、それを有限要素解析の土台にする。解析にはハーディ型不等式、分数階のガリアルド-ニーレンバーグ不等式、特異な距離の重みを持つ重み付き空間を使う（抄録）。", "p4": "条件付き安定性と、Carstensenの準補間作用素と負のソボレフ空間での評価を組み合わせ、有限要素近似の事前誤差評価を導く理論的な研究（抄録）。", "p5": "誤差評価をメッシュ幅、正則化パラメータ、雑音の大きさ、非線形の指数で表した。線形の場合の既存の安定性と誤差評価を拡張し、より弱い正則性の仮定のもとで誤差評価と収束の次数を鋭くした（抄録。具体的な次数は抄録になし）。", "p6": "数値実験の有無と内容は抄録からは分からない（解釈）。べき型以外の非線形性や、時間発展の問題への拡張は扱っていない。", "fun": "熱の伝わりやすさのような物の性質を、測定した温度などから逆算する問題を「逆問題」と言います。逆問題は、測定のわずかな誤差で答えが大きく狂いやすいのが難点です。この研究は、性質が非線形に効く場合でも、計算の細かさや誤差の大きさに応じて答えがどれだけ正しいかを保証しました。", "unverified": "誤差評価の具体的な収束次数と、数値実験の有無は未確認。"}}, {"id": "jr14", "rank": 14, "headline": "気候予算はどう計算され政治化するか（エドモントン）", "title": "The politics of calculative tools in practice: Climate budgeting in Edmonton", "url": "https://doi.org/10.1177/00420980261492432", "authors": "Taylor Davey", "venue": "Urban Studies", "date": "2026-10-16", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "apa": "Davey, T. (2026). The politics of calculative tools in practice: Climate budgeting in Edmonton. Urban Studies. https://doi.org/10.1177/00420980261492432", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由、Urban Studies）を使用。本文は入手できず", "preprint": false, "p1": "北米初の自治体の気候予算であるエドモントン市の2022年炭素予算を調べ、炭素会計を予算に組み込む計算の道具が、透明性や合意を生むより、政治的な対立を組み替えたことを示した。", "p2": "気候予算は炭素会計を自治体の予算に統合し、年々の支出を長期の排出目標に合わせることを約束するが、既存の行政実務と争点化した政治の中でどう働くかはほとんど調べられていなかった（抄録）。", "p3": "面接、政策文書、公開の予算審議の観察で、炭素の指標がどう作られ、予算の項目に当てはめられ、職員と議員にどう解釈されたかをたどる。オスロと比較する（抄録）。", "p4": "気候への影響を従来の財政の形式に翻訳する試みの方法論的な限界と、それが議会の審議に与えた影響を質的に評価する（抄録）。", "p5": "大半の投資は定量化できず、間接的・長期的な効果は除外され、集計結果は提案された気候投資が排出の経路にほとんど影響しないことを示唆した。気候予算は透明性や合意を高めるより、自治体の責任、市民の支持、気候支出の正当化をめぐる対立を強めた（抄録）。", "p6": "1都市の事例とオスロとの比較に基づく（抄録）。著者は、気候予算の効果は技術的な設計より、政治的な権限、行政の能力、制度的な関係に依存するとし、移植可能な会計の解決策ではなく状況に根ざした審議の枠組みとみるべきだと述べる。", "fun": "二酸化炭素の排出も、お金と同じように「予算」で管理すれば分かりやすくなりそうです。ところが実際にやってみると、多くの事業は効果を数字にできず、出てきた数字はかえって「本当に意味があるのか」という議論を呼びました。数字にすることで、対立がなくなるのではなく形を変えたのです。", "unverified": "面接の人数と、オスロとの比較の具体的な内容は未確認。"}}, {"id": "jr15", "rank": 15, "headline": "業績が良くても時価総額が上がらない「評価のボトルネック」", "title": "EXPRESS: Valuation Bottlenecks: Why Isn’t a Better Business Enough for a Higher Market Capitalization?", "url": "https://doi.org/10.1177/10591478261499473", "authors": "Shumpei Iwao ほか", "venue": "Production and Operations Management", "date": "2026-10-16", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "apa": "Iwao, S., Tailor, V. M., & Wu, Q. (2026). EXPRESS: Valuation Bottlenecks: Why Isn’t a Better Business Enough for a Higher Market Capitalization? Production and Operations Management. https://doi.org/10.1177/10591478261499473", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社の早期公開版の抄録（Crossref経由、Production and Operations Management）を使用。本文は入手できず", "preprint": false, "p1": "企業価値を複数の「見方（レンズ）」ごとの評価の下側の包絡として表し、企業の最も弱いレンズが翌四半期のリターンに追加的に効く「最弱レンズ効果」を示し、アナリストの注目がその経路でありうることをLLMで分析した。", "p2": "企業は業務・開示・ガバナンス・資金調達を改善しても、時価総額がすぐには比例して上がらないことが多い。従来の多因子モデルや機械学習は、どのリスクや特性がリターンを説明・予測するかを問うが、最も弱い条件に不釣り合いな重みがかかるかは問われていなかった（抄録）。", "p3": "株式価値をレンズごとの評価の最小値（ハードな最小）か、状態依存の連続的な重み（ソフトな最小）で表す。268の会計特性に探索的因子分析を当てて5つの企業状態のレンズを作り、業種・規模・四半期の同業内で順位を付ける（抄録）。", "p4": "5つのレンズの順位の加法的な効果を超えて、最も弱いレンズが翌四半期のリターンと追加的に関連するかを、飽和した順位の5分位の統制のもとで検証する。170万件の決算説明会の質問をLLMで分類し、アナリストの注目を測る（抄録）。", "p5": "最も弱いレンズは追加的な関連を持ち、飽和した統制のもとでも残った。関連は、最弱レンズが企業内で最低なだけでなく同業内でも弱い企業に集中し、基準となる範囲を広げると次第に弱まった。最弱レンズは質問のより大きな割合を集め、とくに同業内でも弱いときにそうだった（抄録）。", "p6": "アナリストの注目は結果と整合する説明の1つにとどまると著者は述べる（抄録）。解釈：レンズは経済的な分類ではなく因子の負荷構造で決まるため、その解釈は本文の検討に依存する。", "fun": "会社の評価は、得意なところの合計ではなく「いちばん弱いところ」に引っ張られるのかもしれません。桶の板のうち一番短い板で水の高さが決まるのと同じです。実際、弱点が同業他社と比べても目立つ会社ほど、アナリストがそこばかり質問し、株価もその弱点に反応していました。", "unverified": "5つのレンズの内容と効果の大きさは未確認。"}}, {"id": "jr16", "rank": 16, "headline": "待ち行列の情報開示と価格で異質な顧客をさばく", "title": "EXPRESS: Pricing and Information Provision in Service Platforms with Heterogeneous Customers", "url": "https://doi.org/10.1177/10591478261498518", "authors": "Xin Weng ほか", "venue": "Production and Operations Management", "date": "2026-10-16", "sjr": 3.612, "citescore": 11.3, "citescore_year": "2025", "apa": "Weng, X., Lu, L., & Xiao, L. (2026). EXPRESS: Pricing and Information Provision in Service Platforms with Heterogeneous Customers. Production and Operations Management. https://doi.org/10.1177/10591478261498518", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の早期公開版の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "待ち時間への敏感さが異なる顧客が並ぶ仮想待ち行列で、サービス価格と待ち時間の情報開示をどう組み合わせるのが最適かを理論的に示した（抄録）。", "p3": "提供者が価格と待ち時間の開示方針を同時に決め、顧客が合理的期待のもとで並ぶか諦めるかを選ぶ様式化モデルを作る。長期平均の待ち時間を告げる決定的な開示を基準に比べる。", "p5": "最適な開示は尺度化したラデマッハー分布で表され、告げる値は高々2つで足りる。これにより無限次元の問題が有限次元の最適化に帰着し、告げる待ち時間をばらつかせるほうが得になる場合を特定した（抄録）。", "fun": "病院や飲食店のアプリで待ち時間の目安が表示されると、並ぶかどうかの判断が変わります。この研究は、いつも平均を告げるより、状況に応じて2種類の値を使い分けるほうが得になる場合があると示しました。情報の出し方そのものが、料金と同じくらい大事な道具になります。", "unverified": "最適な戦略の具体的な条件は未確認（抄録が途中まで）。"}}, {"id": "jr17", "rank": 17, "headline": "人事担当者のAI利用意図を左右する認知と感情", "title": "Beyond usefulness: cognitive and emotional correlates of AI use intentions among HR professionals", "url": "https://doi.org/10.1108/jeim-07-2026-1316", "authors": "René Arseneault ほか", "venue": "Journal of Enterprise Information Management", "date": "2026-10-16", "sjr": 1.665, "citescore": 19.6, "citescore_year": "2025", "apa": "Arseneault, R., & Ben Messaoud, H. E. (2026). Beyond usefulness: cognitive and emotional correlates of AI use intentions among HR professionals. Journal of Enterprise Information Management, 1–22. https://doi.org/10.1108/jeim-07-2026-1316", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "人事担当者285人の調査で、AI利用意図に結びつく認知的・感情的な要因を、技術受容モデルと評価理論の観点から比べた（抄録）。", "p3": "有用性・使いやすさの認知的評価、AI利用不安、AIによる雇用不安、人事機能でのAI利用、AIの知識を予測変数とし、確認的因子分析のあと階層的な調整回帰でAIの知識の調整効果を探る。", "p5": "認知的評価が利用意図と最も強く結びつき、AI利用不安は小さな負の関連を示した。雇用不安、人事機能での利用、AIの知識は、他の予測変数を入れると固有の分散を説明しなかった（抄録）。", "fun": "「AIに仕事を奪われるのが怖いから使わない」と思われがちですが、人事のプロへの調査では、使うかどうかを一番左右したのは「便利で使いやすいか」でした。不安も少しは影響しますが、雇用への心配は他の要因を考えると目立たなくなりました。", "unverified": "横断調査のため因果は未確認。"}}, {"id": "jr18", "rank": 18, "headline": "決済アプリの日常体験は利用者の幸福感を高めるか", "title": "Beyond continuance: how FinTech app experiences shape user well-being", "url": "https://doi.org/10.1108/intr-04-2026-0726", "authors": "Ali Raza ほか", "venue": "Internet Research", "date": "2026-10-16", "sjr": 2.207, "citescore": 14.8, "citescore_year": "2025", "apa": "Raza, A., Alzaeemi, S. A. S., Albashrawi, M., Dwivedi, Y. K., & Chae, I. (2026). Beyond continuance: how FinTech app experiences shape user well-being. Internet Research, 1–20. https://doi.org/10.1108/intr-04-2026-0726", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "サウジアラビアのデジタルウォレットのアプリの実際の口コミから、継続利用ではなく利用者のウェルビーイングを左右する体験の要因を特定した（抄録）。", "p3": "Google PlayとApp Storeのアラビア語・英語の口コミに、階層クラスタリング、LDAのトピックモデル、感情分析、複数モデルの分類、人による検証、正則化回帰を組み合わせた混合研究法を当て、自己決定理論で解釈する。", "p5": "苦情処理の有効性、システムの信頼性、利用者の自律性はウェルビーイングを正に、情報の曖昧さは負に左右した（抄録）。", "fun": "アプリの評価というと「使い続けるか」が注目されますが、この研究は「使っていて幸せか」に目を向けました。口コミを大量に読み解くと、困ったときにちゃんと対応してくれることや、自分で決められる感覚が幸福感につながっていました。", "unverified": "口コミの件数と係数の値は未確認。"}}, {"id": "jr19", "rank": 19, "headline": "AIが値付けすると消費者は価格をどう解釈するか", "title": "When AI Sets the Price: How Consumers Interpret Price Formats and Intent", "url": "https://doi.org/10.1111/joca.70080", "authors": "Alvaro Chacon ほか", "venue": "Journal of Consumer Affairs", "date": "2026-10-16", "sjr": 1.043, "citescore": 7.8, "citescore_year": "2025", "apa": "Chacon, A., & Limongi, R. (2026). When AI Sets the Price: How Consumers Interpret Price Formats and Intent. Journal of Consumer Affairs, 60(4). https://doi.org/10.1111/joca.70080", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "AIが値付けした価格に消費者がどう反応するかを、値付けの主体（AIか人か）と価格の形式（切りのよい価格か、端数で終わる価格か）で検証した（抄録）。", "p3": "チリの学生165人と米国の消費者631人の2つの実験で、値付けの主体と価格形式を操作し、推奨意図と購入意図、知覚された操作意図を測る。", "p5": "消費者はAIの値付けに好意的でなく、AIの値付けでは端数価格より切りのよい価格が好まれる傾向があった。端数価格はAIが消費者を操作・搾取しようとしているという知覚を強め、推奨と購入の意図を下げた（抄録）。", "fun": "端数で終わる値段は安く見せる昔ながらの工夫です。ところが、その値段をAIがつけたと知ると、人は「何か企んでいる」と感じてかえって買いたくなくなりました。同じ工夫でも、誰がやったかで受け取られ方が変わるのが面白い点です。", "unverified": "効果量の値は未確認。"}}, {"id": "jr20", "rank": 20, "headline": "恋愛の推薦はAIか仲人か：消費者の反応", "title": "On matters of love: exploring consumer reactions to algorithmic vs. human dating recommendation agents", "url": "https://doi.org/10.1108/jrim-02-2026-0103", "authors": "Xi Song ほか", "venue": "Journal of Research in Interactive Marketing", "date": "2026-10-16", "sjr": 3.223, "citescore": 20.5, "citescore_year": "2025", "apa": "Song, X., Liu, M. T., Mo, Z., Lo, F.-Y., Lee, V.-H., & Tian, A. D. (2026). On matters of love: exploring consumer reactions to algorithmic vs. human dating recommendation agents. Journal of Research in Interactive Marketing, 1–19. https://doi.org/10.1108/jrim-02-2026-0103", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "恋愛相手の推薦をアルゴリズムが行うか、仲人が行うかで、消費者のサービス利用の検討がどう変わるかを、エージェンシー理論と暗黙の理論から調べた（抄録）。", "p3": "予備調査（N=233）と2つのシナリオ実験（N=300、N=520）で、推薦者の種類と、人の知性は固定か変わるかという暗黙の信念を操作・測定する。", "p5": "推薦者の種類は消費者の統制感を左右し、それがサービスの受け入れを決めた。知性は固定的だという信念が強いほど、アルゴリズムによるサービスを検討しやすかった（抄録）。", "fun": "恋愛のような個人的なことをAIに任せられるかどうかは、「自分で決めている感覚」が持てるかにかかっていました。さらに「人の能力は変わらない」と考える人ほどAIの推薦を受け入れやすかったのは、意外な結びつきです。", "unverified": "統制感の測定方法は未確認。"}}, {"id": "jr21", "rank": 21, "headline": "戦争と家計への不安が消費者の幸福感を下げる", "title": "How Concern About War and Finances Shapes Consumer Well-being: Evidence From Finland", "url": "https://doi.org/10.1007/s10603-026-09635-3", "authors": "Jannica Nyman ほか", "venue": "Journal of Consumer Policy", "date": "2026-10-15", "citescore": 5.5, "citescore_year": "2025", "apa": "Nyman, J., Pöyry, E., & Piha, S. (2026). How Concern About War and Finances Shapes Consumer Well-being: Evidence From Finland. Journal of Consumer Policy, 49(4). https://doi.org/10.1007/s10603-026-09635-3", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社の抄録（Crossref経由）を使用", "preprint": false, "short": true, "p1": "2022年のロシアのウクライナ侵攻のあと、戦場の外にいるフィンランドの消費者の不安が、家計の心配を通じてウェルビーイングを下げたことを示した（抄録）。", "p3": "存在論的安全の観点から、開戦後6か月間に集めた全国代表の調査（n=4,394）で、脅威の知覚、家計の心配、消費の先送りとウェルビーイングの関係を分析する。", "p5": "知覚された脅威は主に家計の心配の増加と消費の先送りを通じてウェルビーイングを下げた。とくに低所得の消費者では消費の先送りがさらにウェルビーイングを損ない、一部の消費行動が危機時の安定に役立つことを示した（抄録）。", "fun": "戦争の不安から「今は買い物を控えよう」と考えるのは自然です。ところが、所得の低い人ほど、いつもの買い物を我慢することがかえって心を弱らせていました。日常の買い物は、生活のリズムを保つ「心の支え」にもなっているのかもしれません。", "unverified": "効果の大きさの値は未確認。"}}, {"id": "jr22", "rank": 22, "headline": "LLMで読み解く購入後の苦情の感情崩壊", "title": "Post-Purchase Emotional Collapse: LLM-Assisted Analysis of Online Consumer Complaint Narratives", "url": "https://doi.org/10.16951/trendbusecon.1959160", "authors": "Eren Temel", "venue": "Trends in Business and Economics", "date": "2026-10-15", "apa": "Temel, E
