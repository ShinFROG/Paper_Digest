: "Tue, 17 Nov 2026", "apa": "Luo, L., Manzoor, E., Yang, N., & Yao, F. (2026). Paying Creators for Training Data Can Increase AI Displacement (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.20204", "why": "作り手が学習データを提供するかを選び、消費者が作り手の作品とAIの生成物を選ぶプラットフォームのモデルで、学習データへの対価の支払いを義務づけると、質の低い作り手はデータの提供に専念しAIが需要を完全に奪うことを示した。支払いがない場合は、作り手を失う恐れが価格を抑える。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "生成AIの学習データについて作り手への対価の支払いを義務づけると、かえってAIによる作り手の代替が進みうることを、プラットフォームのモデルで示した（抄録）。未査読。", "p3": "作り手が学習データを提供するかを選び、消費者が作り手の作品と作り手の作品で学んだ生成AIのどちらを買うかを選ぶモデルで、対価の支払いとオプトアウトの政策の効果を分析した（抄録）。", "p5": "支払いを義務づけると、質の低い作り手は学習データの提供者に専念し、AIの質と価格が同じでもAIが需要を完全に奪う。支払いがないと作り手とデータを失う恐れがプラットフォームの価格を縛り、AIの改善によるさらなる代替を防ぐ。支払いは作り手の利得と総余剰を増やすが消費者余剰を減らす（抄録）。", "fun": "AIが絵や文章の作り手の作品から学ぶなら、作り手にお金を払うべきだという声がある。ところがこの研究のモデルでは、お金を払う仕組みにすると、一部の作り手は作品を売るのをやめてデータを売る側に回り、AIに市場を奪われてしまう。良かれと思った政策が逆の結果を生むしくみを示した点が面白い。", "unverified": "モデルの結果の頑健性（作り手が多数いる場合など）は抄録からは確認できない。"}}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "戦争による物価ショックでECBへの信認が低下", "title": "Transient Shocks Fade, Persistent Ones do Not: The ECB's Credibility with Households after Two Wars", "url": "https://doi.org/10.2139/ssrn.7692760", "authors": "Leonardo Cadamuro", "venue": "SSRN", "date": "2026-11-17", "why": "ECB消費者期待調査の同じ家計を2022年のウクライナ侵攻と2026年の中東の戦争の前後で追い、両方で1年先の期待インフレ率が2.3ポイント上がり、ECBが物価安定を保つ確率の評価が下がったと報告する。原油価格が戻った2026年7月には損失の3分の1から3分の2を回復した。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "2022年のウクライナ侵攻と2026年の中東の戦争によるエネルギー価格のショックの前後で同じ家計を追い、ECBへの信認の低下と回復の違いを示した（抄録）。未査読。", "p3": "ECB消費者期待調査のミクロデータで、1年先の期待インフレ率とECBが物価安定を保つ確率の評価を2つの戦争の前後で比べ、各国の物価の違いを使って、家計が自国の物価でECBを判断するかも調べた（抄録）。", "p5": "両方の戦争で期待インフレ率は2.3ポイント上がり、物価安定の確率の評価も同程度下がった。2026年7月には損失の3分の1から3分の2を回復したが、2022年7月には全く回復していなかった。自国の物価の影響は検出されず、ECBへの信認1点あたり短期の期待の改定は約0.1ポイント小さかった（抄録）。", "fun": "戦争で燃料の値段が上がると、人々は「物価はもっと上がる」と考え、中央銀行への信頼も揺らぐ。同じ家計を二度の戦争で追うと、一時的なショックなら信頼はすぐ戻り、長引くショックでは戻らなかった。人々の期待が、出来事の持続性をよく見分けていることを示した点が面白い。", "unverified": "家計の標本の大きさは抄録からは確認できない。"}}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "LLMで付けた処置ラベルの回帰は誰の効果か", "title": "Who Is the Regression About? Auditing AI-Labeled Treatments When Effects Differ", "url": "https://arxiv.org/abs/2611.21207", "authors": "Ayman Farahat", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "LLMが付けた処置のラベルにOLSを当てると、処置群と対照群の効果を少ない群に重みを置いて平均すると指摘し、ラベルの偏りを古典的な減衰と結果に相関する選択的な項に分解した。LinkedInの求人でリモート勤務の賃金差が約40%過小評価されることと、層別の盲検監査による補正を示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "LLMが付けた処置のラベルで回帰すると、効果が異なるときにOLSが誰の効果を推定しているかがずれ、ラベルの誤りが選択的な偏りを生むことを示し、補正の方法を示した（抄録）。未査読。", "p3": "効果が異なるとき、OLSは処置群の効果（ATT）と対照群の効果（ATU）を少ない群に重みを置いて平均すると指摘し、ラベルの偏りを誤分類による古典的な減衰と、誤りが結果と相関するときの選択的な項に分解した（抄録）。", "p5": "LinkedInの求人で、モデルは賃金の高いリモート勤務の求人を見逃し、精度の確認には合格するのにリモート勤務の賃金差を約40%過小評価した。この偏りはデータを増やしても消えないが、両方のラベル群の層別の盲検監査で補正でき、両方の効果を復元できた（抄録）。", "fun": "AIに大量の求人票を読ませて「リモート勤務かどうか」の印を付けさせ、給料の差を調べるのは便利だ。だがAIが給料の高い求人ほど見落とすと、精度の検査には合格しても結論が大きくずれる。しかもデータを増やしても直らない。AIの付けた印をそのまま使う危うさと、少数の人手の確認で直す方法を示した点が面白い。", "unverified": "監査に必要な標本の大きさは抄録からは確認できない。"}}, {"id": "pn34", "rank": 34, "field": "統計学", "headline": "共変量シフト下の重み付き等角予測の極限理論", "title": "Weighted conformal prediction under covariate shift: process limits, estimated weights and efficiency", "url": "https://arxiv.org/abs/2611.20052", "authors": "Mehrdad Pournaderi", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "共変量シフトに尤度比で重み付けする分割等角予測について、重み付き経験分布関数の過程の弱収束をχ²距離が有限であることと同値に特徴づけ、水準をまたぐ被覆の同時分布、整合的なブートストラップ、推定された重みの影響を導いた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "共変量シフトのもとの重み付き分割等角予測について、重み付き経験分布関数の過程の極限を特徴づけ、推定した重みの影響と効率性を明らかにした（抄録）。未査読。", "p3": "較正のスコアを尤度比で重み付けした自己正規化の経験分布関数の過程を調べ、χ²距離が有限であることと、ガウス過程への弱収束が同値であることを示した（スコアが非退化の場合）（抄録）。", "p5": "極限から水準をまたぐ被覆の同時分布、整合的なブートストラップ、Berry–Esseen型の収束率を得た。推定した比は分散をオラクルより小さくしうる共分散の項として入り、比が既知のときの半パラメトリック効率の必要十分条件と、χ²距離が無限のときのp安定の極限も示した（抄録）。", "fun": "予測が当たる範囲（予測区間）を、訓練時と状況が違うデータでも保証したいとき、データに重みを付けて補正する。この研究は、その補正がうまく働く条件が、二つの分布の「ずれの大きさ」が有限であることとぴったり一致することを証明した。重みを推定した方がかえってばらつきが小さくなる場合があるという結果も面白い。", "unverified": "数値実験の有無と結果は抄録からは確認できない。"}}, {"id": "pn35", "rank": 35, "field": "統計学", "headline": "低次元スケッチでシミュレーション推論を圧縮", "title": "Compressed Simulation-Based Inference: Neural Posterior Estimation for Massive Data via Low-Dimensional Sketches", "url": "https://arxiv.org/abs/2611.21286", "authors": "Michael Wieck-Sosa ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "大量データの神経事後推定で、要約統計量の代わりにデータのランダムな低次元スケッチを条件とする方法を提案し、p次元のパラメータでは2p+1個のスケッチで事後一致性が得られることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "大量のデータのシミュレーションに基づく推論で、要約統計量の代わりにデータのランダムな低次元スケッチを条件とする神経事後推定を提案し、少数のスケッチで事後一致性が得られることを示した（抄録）。未査読。", "p3": "シミュレーションしたデータとパラメータの対で学習する神経事後推定（NPE）で、パラメータの条件付き密度を、データのランダムな低次元の射影（スケッチ）を与えたときの密度で近似した（抄録）。", "p5": "p次元のパラメータのモデルでは2p+1個のランダムなスケッチで事後一致性が得られることを示した。最先端の埋め込みネットワークと比べ、最良のものと同等の性能を計算効率を高めて達成した（抄録）。", "fun": "巨大なデータからモデルの数値を推定するとき、データをそのまま使うのは重すぎるので、平均などの要約にまとめるのが普通だ。だが良い要約を考えるのは難しい。この研究は、データをでたらめな方向に少数回だけ投影した値で足りると示した。推定したい数の2倍と1個の投影で十分という簡潔さが面白い。", "unverified": "比較したモデルの例と計算時間の削減の大きさは抄録からは確認できない。"}}, {"id": "pn36", "rank": 36, "field": "統計学", "headline": "LLM評価の成功確率の分布に有限標本の信頼領域", "title": "Variance-adaptive confidence regions for fixed-benchmark binomial mixtures, with application to LLM evaluation", "url": "https://arxiv.org/abs/2611.21266", "authors": "Kuancheng Ye", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "問題ごとにn回実行したLLMの成功回数から、成功確率の経験分布の線形汎関数について、全てのn・m・固定された確率で被覆が保証される分散適応型の信頼領域を、線形計画として構成した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "LLMを問題ごとにn回実行した成功回数から、成功確率の経験分布の線形汎関数について、全てのn・m・固定された確率で被覆を保証する分散適応型（VA）の信頼領域を作った（抄録）。未査読。", "p3": "候補の混合分布ごとに、それが含意する裾の回数の条件付き分散で検定する。この分散は分布について線形なので、領域は線形計画として解け、セルの包絡で格子の外でも有効性を保つ（抄録）。", "p5": "主な比較の前に固定した規則のもとで、VAは2段階の差し込み型の帯より全てのnで狭かった（n=128で幅の比の中央値0.60）が、n=128の漸近的な点ごとの区間（AMARI）よりは狭くなく、実際のロールアウトではn≦128で点ごと・Bonferroni補正のAMARIより広かった。P(p>0)や大きなkのpass@kは下限しか得られない（抄録）。", "fun": "AIの性能を「100問中何問解けたか」で比べるとき、その数字にどれだけ誤差があるかは意外に難しい問題だ。問題ごとに難しさが違い、同じ問題でも解けたり解けなかったりするからだ。この研究は、どんな場合でも保証される誤差の幅を作り、他の方法より広くなる場面も正直に報告した。保証の強さと幅の狭さの取引が見える点が面白い。", "unverified": "実際のロールアウトのデータの出所は抄録からは確認できない。"}}, {"id": "pn37", "rank": 37, "field": "統計学", "headline": "ℓpノルムの平均推定に鋭い相転移", "title": "Phase Transitions in Heavy-Tailed Mean Estimation under $\\ell_p$ Norms", "url": "https://arxiv.org/abs/2611.20176", "authors": "Ishaq Aden-Ali ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "共分散の存在だけを仮定した平均ベクトルの推定で、p>2のℓpノルムでは期待リスクにも頑健化が必要になることを示し、ミニマックス・リスクが標本数・次元・pの関係で鋭く相転移すること、座標ごとのmedian-of-meansがこれに最適に追随することを証明した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "共分散の存在だけを仮定した確率ベクトルの平均推定で、p>2のℓpノルムでは期待リスクでも頑健化が必要になり、ミニマックス・リスクが鋭く相転移することを証明した（抄録）。未査読。", "p3": "標本数n・次元d・ノルムのpの関係でミニマックス・リスクを特徴づけ、損失の幾何に合わせてバケット数を選ぶ座標ごとのmedian-of-means推定量の性能を解析した（抄録）。", "p5": "大標本の領域では古典的なガウスの速さが達成でき、それ以外では裾の重い分布が本質的に非ガウスの障害を生む。座標ごとのmedian-of-meansは相転移に最適に追随し、一般のノルム向けの射影型のmedian-of-meansはℓpノルムでは多項式的に最適でない場合があった（抄録）。", "fun": "たまにとんでもない値が出るデータの平均を推定するとき、普通の平均は外れ値に引っ張られる。誤差を普通の距離で測るなら普通の平均で十分だが、最大の誤差を重く見る測り方に変えると、外れ値対策が必須になる。この境目が標本の数と次元で急に切り替わる「相転移」を示した点が面白い。", "unverified": "数値実験の有無は抄録からは確認できない。"}}, {"id": "pn38", "rank": 38, "field": "統計学", "headline": "AdamやMuonの高次元の有効動力学を導出", "title": "High-dimensional limit theorems for adaptive variants of SGD I: Ballistic limits", "url": "https://arxiv.org/abs/2611.19059", "authors": "Aukosh Jagannath ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "指数移動平均と前処理による非マルコフ性を平均化法で扱い、Adam・Muonなど適応的なSGDの高次元での有効動力学をマルコフ過程として導いた。テンソルPCAやXOR問題のネットワークで、アルゴリズムを定量的に比較できることを示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "AdamやMuonなどモーメンタムを持つ適応的なSGDの、高次元での有効動力学をマルコフ過程として導き、アルゴリズムを定量的に比べられるようにした（抄録）。未査読。", "p3": "指数移動平均と前処理による非マルコフ性を平均化法で扱い、テンソルPCA、ガウス射影モデル、教師-生徒ネットワーク、MuonとAdamを併用してXOR問題を学ぶ多層ネットワークに適用した（抄録）。", "p5": "学習の初期はオンラインSGDがAdamより汎化が良く、学習曲線が交差した後はAdamが上回る「交差」現象を見いだした。安定性の縁（Edge of Stability）の一種を証明し、それを鋭く特徴づける無限ラプラシアンの類似物を導入した（抄録）。", "fun": "AIの学習で使う最適化の方法は経験則で選ばれることが多い。この研究は、膨大な数のパラメータの動きを少数の量の動きにまとめる理論で、方法どうしを数式で比べられるようにした。最初は単純な方法が勝ち、途中から高度な方法が追い抜くという逆転を理論で説明した点が面白い。", "unverified": "理論の予測と実際の大規模な学習との一致の程度は抄録からは確認できない。"}}, {"id": "pn39", "rank": 39, "field": "機械学習", "headline": "科学的証拠を扱う3,200億パラメータのMoE", "title": "Sage S2.1 Flash Technical Report", "url": "https://arxiv.org/abs/2611.21072", "authors": "Kun Cai ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-17", "why": "分子グラフ・生物配列・スペクトルの専用エンコーダを持ち、道具の使用・検索・コーディングの検証可能な環境で訓練した3,200億パラメータのMoEモデルの技術報告。7領域33のベンチマークで評価し、主な比較ではOfficeQA ProやMLE-bench Liteなどで1位と報告する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "分子グラフ・生物配列・スペクトルの専用エンコーダを持ち、科学的証拠を扱い対話的な環境で行動する3,200億パラメータの混合専門家（MoE）モデルの技術報告（抄録）。未査読。題名はS2.1、抄録ではS1.5と表記されている。", "p3": "モダリティ別の射影で表現を共通の骨格の入力空間に写し、文章・画像とともに処理する。道具の使用・検索・コーディングと、機械学習の実験や科学ソフトウェアの作業の検証可能な環境を作り、実行結果や環境の状態で完了を判定して訓練した（抄録）。", "p5": "7領域33のベンチマークで評価し、5つの基準との主な比較でOfficeQA Pro（72.2）、MLE-bench Lite（HumanRank 90.3）などで1位、OSWorld-Verified（85.2）などで2位だった（抄録）。", "fun": "文章だけでなく、分子の形や遺伝子の並び、測定のグラフ（スペクトル）まで読めるAIを作り、表計算の作業や機械学習の実験までこなさせる。結果の正しさを実行結果で機械的に確かめられる練習場を用意した点が要だ。いろいろな種類の「証拠」を一つの頭で扱う方向へAIが進んでいることがよく分かる。", "unverified": "題名と抄録でモデルの版の表記が異なる（S2.1とS1.5）。比較した5つの基準の名前は抄録からは確認できない。"}}, {"id": "pn40", "rank": 40, "field": "機械学習", "headline": "552Bの視覚言語モデルをロボット制御の基盤に", "title": "ScaleVLA: Scaling Vision-Language-Action Models to 552 Billion Parameters", "url": "https://arxiv.org/abs/2611.21607", "authors": "Ruixi Yu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-17", "why": "552BのDeepSeek-V4.1-Flashを行動生成のDiTにつなぎ、2Bから552Bまでの視覚言語モデルを同じ訓練設定で比べた。10回の実演で2Bの50回を上回り、LIBERO-PROでの汎化や実機の充電器差し込みも改善したと報告する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "最先端規模の視覚言語モデルがロボット制御のより強い基盤になるかを調べ、552BのDeepSeek-V4.1-Flashを行動生成のDiTにつないだScaleVLAで、少数の実演・汎化・精密操作の改善を示した（抄録）。未査読。", "p3": "2Bから552Bまでの視覚言語モデルを同じ訓練設定で行動のDiTにつなぎ、標本効率・汎化・精密操作の3つの能力で比べた（抄録）。", "p5": "10回の実演で2Bの50回の訓練を上回り（87.8%対85.6%）、LIBERO-PROの成功率は45.1%（小さい骨格では最大31.3%）、実機の充電器の差し込みは10回中4回から9回に増えた。行動の塊あたりの遅延の中央値は216 msだった（抄録）。", "fun": "ロボットを動かすAIには、軽くて速い小さなモデルが使われてきた。この研究は、巨大な言語と画像のAIをロボットの「頭」にすると、少ないお手本で覚え、初めての状況にも強くなることを示した。充電器を差し込むような細かい作業で特に伸びた点が、知識の量が手先の器用さにつながる例として面白い。", "unverified": "実機の試行回数が10回と少なく、他の作業での再現性は抄録からは確認できない。"}}, {"id": "pn41", "rank": 41, "field": "機械学習", "headline": "生の市場データから資産配分をフローで直接生成", "title": "AllocFlow: End-to-End Portfolio Trading Action Generation from Raw Market Data", "url": "https://arxiv.org/abs/2611.19937", "authors": "Annan Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-17", "why": "複数資産の市場の履歴から、資本制約のもとでの同時のポジションをフロー・マッチングで直接生成する枠組みを提案し、戦略の模倣で構造を与えてから最適化する2段階の訓練で、予測と配分の分離による不整合を解消する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "複数資産の生の市場の履歴から、資本制約のもとの同時のポジションの重みをフロー・マッチングで直接生成する端から端までの枠組みAllocFlowを示した（抄録）。未査読。", "p3": "時間的な市場表現を条件とする資産横断のフローTransformerで符号付きの重みを一括で生成し、戦略の模倣で候補の分布を形づくった後、ポートフォリオ単位の報酬と凍結した参照方策による群相対の強化学習で洗練する2段階で訓練した（抄録）。", "p5": "暗号資産の永久先物の1時間足で、強化学習により模倣方策の年率の純収益は27.79%から51.38%に、カルマー比は0.955から4.043に上がり、教師の戦略を全指標で上回った。再学習なしで2026年の未見の6か月でカルマー比4.90だった（抄録）。", "fun": "株や通貨の売買では、値動きを予測する段階と、資金をどう配分するかを決める段階を分けるのが普通だ。この研究は、予測を飛ばして市場の生データから直接「どれをどれだけ持つか」をAIに描かせた。まずお手本の戦略をまねさせ、その後で成績を報酬に磨くという二段構えが、人の学び方にも似ていて面白い。", "unverified": "取引コストの扱いと、暗号資産以外の市場での性能は抄録からは確認できない。"}}, {"id": "pn42", "rank": 42, "field": "機械学習", "headline": "潜在フィードバックは計算とデータの増幅器", "title": "Latent Feedback Is a Compute and Data Amplifier", "url": "https://arxiv.org/abs/2611.20404", "authors": "Benhao Huang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-17", "why": "各トークンの最上層の状態を次のトークンの入力に戻す潜在フィードバックを、同じ計算量をエポック数に使う通常のTransformerと、モデル規模・データ量・エポックの格子で比べ、固有データが十分ある領域では同じ損失に少ない計算量・データで届くと報告する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "各トークンの最上層の状態を次のトークンの入力に戻す潜在フィードバックが、同じ計算量をエポック数に使う通常のTransformerより、計算量とデータの両方を節約することを示した（抄録）。未査読。", "p3": "モデル規模・固有データ量・エポック数の格子で、各点で両方のモデルを調整して比べ、潜在フィードバックをパラメータの多いTransformerとして表す1つのスケーリング則を当てはめた（抄録）。", "p5": "固有データが十分にある領域では、同じ損失に少ない計算量・少ない固有データで届いた。60M〜271Mのモデルで当てはめた法則は、778Mでの損失を0.3%以内、両モデルの差を0.05%以内で予測した。節約は最大で計算量48%、固有データ47%だった（抄録）。", "fun": "良質な学習データが尽きてくると、同じデータを何周も読ませるしかないが、2周目以降の効果は落ちていく。この研究は、AIが自分の考えた途中の状態を次の一語に回す仕組みを使うと、同じ計算量でもっと賢くなれることを示した。データ不足の時代の計算の使い道として面白い。", "unverified": "より大きなモデルでの検証は778Mまでで、それ以上は外挿である（抄録の範囲）。"}}, {"id": "pn43", "rank": 43, "field": "機械学習", "headline": "画像から連鎖反応を予測する物理推論はまだ不確か", "title": "DominoBench: Evaluating Multi-Step Physical Reasoning from Still Images", "url": "https://arxiv.org/abs/2611.20385", "authors": "Emilio Ferrara", "venue": "Hugging Face Daily Papers", "date": "2026-11-17", "why": "坂・振り子・ドミノなどの2次元剛体の場面の静止画から結果を予測させる854問（427の最小対）のベンチマークで、10系統30のモデルを評価し、助けなしでは確実に予測できるモデルはないと報告する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "坂・振り子・シーソー・ドミノなどの2次元の剛体の場面の静止画から連鎖反応の結果を予測させるベンチマークで、助けなしに確実に予測できる視覚言語モデルはないことを示した（抄録）。未査読。", "p3": "物理シミュレータで結果を計算した854問（427の最小対）で、一つの量を1〜3格子だけ変えると一人の生死が分かれるように作り、最後は決定的な計算に至る4段のヒントを付けた。10系統30のモデルを評価した（抄録）。", "p5": "助けなしでは、最先端のモデルでも運命が変わる人の正答は最大72%、対の両方の正答は最大34%だった。決め手の計算と必要な量（静止画では見えない速さを含む）を書き出すと82〜92%に上がり、小さなモデルは偶然に近いままだった（抄録）。", "fun": "ボールを押すと坂を転がり、ドミノが倒れ、最後に誰かに当たるかどうか。AIはこうした場面の説明はすらすらできるのに、結果の予測は苦手だった。決め手になる計算を教えると正解できるのに、自分では計算を始めない。言葉で上手に説明できることと、正しく予測できることは別だと示した点が面白い。", "unverified": "評価した30モデルの一覧と、問題ごとの難しさの分布は抄録からは確認できない。"}}, {"id": "pn44", "rank": 44, "field": "機械学習", "headline": "取引系列の基盤モデルの上乗せは勾配ブースティングに小さい", "title": "How Much Do Foundation Models Add to Gradient Boosting on Financial Event Sequences?", "url": "https://arxiv.org/abs/2611.18914", "authors": "Carlos Eduardo Martins Relvas ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "取引系列で事前学習した基盤モデルの利得を、時点ごとの集計特徴量とLightGBMを基準に27手法・3つのラベル量・5シードで比べ、凍結した自己教師の埋め込みは基準をほとんど改善しないと報告し、両者を順位で平均するTBSを提案する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "取引の系列で事前学習した基盤モデルが、時点の集計特徴量とLightGBMという基準にどれだけ上乗せするかを測り、両者を順位で平均するTBSが最も安定して基準を上回ることを示した（抄録）。未査読。", "p3": "合成のクレジットカード、公開のMBD-mini、企業間信用とB2Bの解約の非公開データの4つで、27手法を3つのラベル量・5シード・対のブートストラップ区間で比べた。系列モデルは約40万パラメータでデータごとに事前学習した（抄録）。", "p5": "凍結した自己教師の埋め込みは基準をほとんど改善せず、微調整した系列ネットワーク単独は21の組み合わせ中9で基準を上回った。TBSは19（FDR調整後18）で上回り、AUCの中央値の上乗せは+1.8点。ラベルが多く表形式の情報が豊富なほど上乗せは縮んだ（抄録）。", "fun": "お金の出入りの記録を大量に読ませた「基盤モデル」が、昔ながらの決定木の手法より賢いと宣伝されることがある。公平に比べ直すと、基盤モデル単独では半分も勝てず、二つを組み合わせたときに初めて安定して勝った。新しい技術の売り文句を、公開データと丁寧な比較で確かめ直した姿勢が面白い。", "unverified": "TabFormerとAMLのベンチマークの再検討の結論の詳細は、抄録の途中までしか確認できない。"}}, {"id": "pn45", "rank": 45, "field": "機械学習", "headline": "難しい課題では大バッチへの切替を遅らせるのが最適", "title": "Fast Catch-Up, Late Switching: Optimal Batch Size Scheduling via Functional Scaling Laws", "url": "https://arxiv.org/abs/2602.14208", "authors": "Jinbo Wang ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "関数的スケーリング則の枠組みでデータ予算を固定した最適なバッチサイズの計画を特徴づけ、易しい課題では増やし続け、難しい課題では大半を小バッチで進めて終盤に切り替えるのが最適になること、その背後に「急速な追いつき」効果があることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "関数的スケーリング則の枠組みで、データ予算が固定されたときの最適なバッチサイズの計画を特徴づけ、難しい課題では終盤まで小さいバッチを保って遅く切り替えるのが最適になることを示した（抄録）。未査読。", "p3": "関数的スケーリング則（Liら2025a）を使って最適なバッチサイズの計画を解析し、小から大への切替後に損失が一定の大バッチの軌道にすばやく合う「急速な追いつき」効果の仕組みを、蓄積した勾配の雑音の急速な忘却として説明した（抄録）。", "p5": "易しい課題では最適な計画はバッチを増やし続け、難しい課題では大半を小バッチで進めて終盤だけ大バッチにする。最大11億パラメータ・1兆トークンの密モデルとMoEの事前学習で、遅い切替の計画は一定のバッチと早い切替をすべての設定で上回った（抄録）。", "fun": "AIの学習では、一度にまとめて見せるデータの量（バッチサイズ）を途中で増やすことがある。この研究は、難しい問題ほど最後まで小分けで学ばせ、終盤に一気に大きくするのが得だと示した。切り替えた直後に損失がすぐ追いつくので、大きなバッチを後回しにしてもデータを節約できる。勉強の仕方にも似た話で面白い。", "unverified": "課題の「難しさ」をどう測るかの定義は抄録からは確認できない。"}}, {"id": "pn46", "rank": 46, "field": "機械学習", "headline": "推論の過程をグラフにして失敗の構造を見る", "title": "Understanding Failures in LLM Reasoning by Learning Structured Representations of Chain-of-Thought", "url": "https://arxiv.org/abs/2611.18611", "authors": "Tommaso Felice Banfi ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "思考の連鎖（CoT）を推論ステップの依存グラフとして表し、グラフニューラルネットと帰属の説明で正しい推論と失敗の構造的なパターンを特定し、正しいCoTは序盤の計画を重視し、誤りは過負荷の統合ステップと依存関係の違反と関連すると報告する。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "LLMの思考の連鎖（CoT）を推論ステップの依存グラフとして表し、グラフの構造から推論の質（正しさ・効率・失敗の型）を読み取る枠組みCoT2Graphを示した（抄録）。未査読。", "p3": "CoTを後戻り・分岐・部分課題の統合などを表す有向の依存グラフに変換し、グラフニューラルネットでモデル化し、帰属に基づく説明で推論の質と関連する構造のパターンを特定した（抄録）。", "p5": "正しいCoTは序盤の計画を重視し、誤ったCoTは過負荷の統合ステップと依存関係の違反と関連した。グラフの信号は正答の予測で従来の木構造の方法を最大2.5%、長さに基づく基準を7.8%上回り、Best-of-Nの選択も改善した（抄録）。", "fun": "AIが答えを出すまでの「考えの筋道」を、文章としてではなく、どの考えがどの考えに頼っているかの地図にして調べた。すると、正しく解けるときは最初によく計画を立て、間違えるときは最後にたくさんの考えを一度にまとめようとして破綻していた。人の答案の採点にも通じる発見で面白い。", "unverified": "対象としたLLMと課題の種類は抄録からは確認できない。"}}, {"id": "pn47", "rank": 47, "field": "機械学習", "headline": "土木・防災の判断でVLMを評価するベンチマーク", "title": "CivilBench: Benchmarking Vision-Language Models for Multimodal Information Integration in Civil Engineering", "url": "https://arxiv.org/abs/2611.21105", "authors": "Dan Yuan ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "逐次推論・画像による構造の理解・開かれた理解の3群で、構造損傷の評価・リスク推論・因果分析・補修計画などを含む土木・防災のベンチマークを、専門家の注釈と品質検証を経て構築し、代表的なVLMを評価した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "土木・構造工学と災害の場面で視覚言語モデル（VLM）の推論能力を評価するベンチマークCivilBenchを作り、代表的なVLMに領域固有の推論で大きな限界があることを示した（抄録）。未査読。", "p3": "逐次推論、画像による構造の理解、開かれた理解の3つの課題群で、数値推論・構造損傷の評価・リスク推論・因果分析・補修計画を扱い、領域データの収集、工学向けの説明文、専門家の注釈、問題設計、品質検証の手順で構築した（抄録）。", "p5": "逐次推論が大きな隘路で、特に少ない構造化された観測から数値の関係を推論する場面で弱かった。数値の事前情報と外部知識で限界は緩和されたが、効果はモデルが証拠を確実に読み使えるかに依存した（抄録）。", "fun": "AIに地震で壊れた建物の写真を見せたり、点検の数字を読ませたりして、技術者のような判断ができるかを試す問題集を作った。AIは写真の説明は得意でも、限られた数字から順を追って関係を推し量る問題でつまずいた。専門の現場でAIを使う前に、何が苦手かを確かめる道具として面白い。", "unverified": "評価したVLMの名前と正答率の数値は抄録からは確認できない。"}}, {"id": "pn48", "rank": 48, "field": "工学", "headline": "スケールド境界有限要素でFFT均質化を安定に", "title": "Scaled boundary finite elements for FFT-based computational micromechanics", "url": "https://arxiv.org/abs/2611.20722", "authors": "Flavia Gehrig ほか", "venue": "arXiv", "date": "Tue, 17 Nov 2026", "why": "ボクセル格子上の3次元線形弾性の均質化を、半径方向に解析解を持つスケールド境界有限要素法で離散化する行列不要のFFTソルバを提案し、空隙のある不均質な微視構造で、低減積分要素の砂時計不安定と完全積分要素の過剛性をともに避ける。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "ボクセル格子上の3次元線形弾性の均質化を、スケールド境界有限要素法（SBFEM）で離散化する行列不要のFFTソルバを提案し、空隙のある不均質な微視構造で安定に解けるようにした（抄録）。未査読。", "p3": "半径方向に解析解を持つSBFEMの六面体セルを周期的な格子の全ボクセルに使い、一様なSBFEMの剛性作用素に基づく前処理をフーリエ空間で局所的に適用した。前処理後の条件数は格子の解像度によらず材料のコントラストで抑えられることを示した（抄録）。", "p5": "全体剛性行列を組み立て・保存しない実装ができ、短繊維強化複合材、ポリウレタンフォーム、砂のバインダジェットの微視構造で、既存のボクセル離散化と比べて頑健な収束と競争的な精度を示した（抄録）。", "fun": "スポンジのように穴だらけの材料の硬さを計算するとき、細かい立方体（ボクセル）で表すと、ある方法では計算がぐらつき、別の方法では硬く出すぎる。この研究は、立方体の中を中心から放射状に正確に解く方法を使い、その中間のちょうど良い計算を実現した。格子を細かくしても計算が難しくならない点も面白い。", "unverified": "計算時間の比較の数値は抄録からは確認できない。"}}, {"id": "pn49", "rank": 49, "field": "工学", "headline": "竹の中空テーパー構造で最大曲げ応力が出る位置", "title": "Location of maximum bending stress in tapered hollow plants: A case study on Moso bamboo (Phyllostachys edulis)", "url": "https://doi.org/10.21203/rs.3.rs-11439875/v1", "authors": "Carol Lee Chalermsin ほか", "venue": "Research Square (In Review)", "date": "2026-11-17", "why": "軸方向に材料が傾斜する中空テーパー梁で、さまざまな荷重分布での最大曲げ応力の位置を非線形の支配方程式から求め、線形と大たわみの解析の一致、テーパー比の影響を調べ、孟宗竹に適用した。", "explain": {"basis": "抄録", "basis_note": "Research Squareの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "軸方向に材料が変化する中空のテーパー梁で最大曲げ応力が生じる位置を、荷重分布ごとに大たわみの非線形方程式から求め、孟宗竹に適用した（抄録）。未査読。", "p3": "等分布・逆三角形・三角形・集中の4つの荷重について支配方程式を導いて大たわみ解析で解き、線形解析と比べ、テーパー比の影響を調べた（抄録）。", "p5": "分布荷重では線形解析で最大応力の位置を十分に予測できたが、集中荷重では低い荷重でのみ正確だった。テーパーが強いほど最大応力は先端側に移り、孟宗竹では稈の上部に位置した（抄録）。", "fun": "竹は中が空洞で、根元から先へ細くなる。風で曲げられたとき、どこが一番危ないのか。この研究は、竹のような形と材料の変化を式にして解き、最も大きな応力は根元ではなく上の方に来ることを示した。自然が作った軽くて強い形の秘密を、建築部材の設計に生かせる点が面白い。", "unverified": "実際の竹での曲げ試験による検証の有無は抄録からは確認できない。"}}, {"id": "pn50", "rank": 50, "field": "組織行動・心理的安全性", "headline": "包摂的リーダーは心理的安全性を介しAI利用意図を高める", "title": "The Impact of Inclusive Leadership on AI Use Intent: The Mediating Role of Psychological Safety, Emotional Regulation, and Trust", "url": "https://doi.org/10.2139/ssrn.7692758", "authors": "Haldun Turan ほか", "venue": "SSRN", "date": "2026-11-17", "why": "包摂的リーダーシップが従業員のAI利用意図に与える影響を、心理的安全性・感情の調整・AIへの信頼を媒介とする構造方程式モデルで調べ、AI利用意図の決定係数0.619などを報告し、AIの受容における感情の自己調整と信頼の役割を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの登録の抄録（Crossrefから取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "包摂的リーダーシップが従業員のAI利用意図に与える影響を、心理的安全性・感情の調整・AIへの信頼を媒介として構造方程式モデルで調べた（抄録）。未査読。", "p3": "包摂的リーダーシップを独立変数、AIの利用意図を従属変数、心理的安全性と感情の調整を媒介変数、AIへの信頼を媒介と直接の両方の影響を持つ変数とするモデルを、信頼性・妥当性の基準で確かめて推定した（抄録）。", "p5": "モデルは信頼性・妥当性の基準を満たし（CR>0.70、AVE>0.50、HTMT<0.90）、適合はSRMR=0.079で、AI利用意図の決定係数は0.619だった。AIの受容には認知だけでなく感情と組織の力学が関わると結論した（抄録）。", "fun": "職場で新しいAIを使ってみようと思えるかどうかは、上司の態度で変わるのか。この研究は、誰の意見も受け入れる上司のもとでは「失敗しても大丈夫」と感じやすく、それがAIを使う意欲につながる道筋を調べた。新しい技術の導入が、技術の良し悪しだけでなく職場の空気に左右されるという視点が面白い。", "unverified": "標本の人数・国・業種は抄録からは確認できない。横断的な調査のため因果は確認できない。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "箱桁橋の移動軸重応答を板と梁の混成で高速計算", "title": "Hybrid Levy Beam‐Plate Model for Moving‐Axle Dynamics and Creep‐Induced Stiffness Evolution of Orthotropic Box Girder Bridges", "url": "https://doi.org/10 名からは、その音を周波数や時間などいくつもの見方で捉え、AIで破断を見分けようとする研究と読める。見えない内部の損傷を音で聞き分けるという問いが面白い。", "unverified": "抄録・本文がなく、手法・検証・結果はすべて未確認。"}}, {"id": "jr18", "rank": 18, "headline": "温度分布の不均一がインピーダンス法SHMに与える影響", "title": "Uniform versus Non-Uniform Temperature Distribution Effects on Impedance-Based Structural Health Monitoring", "url": "https://doi.org/10.1109/jsen.2026.3752433", "authors": "Felipe Augusto Barnabé ほか", "venue": "IEEE Sensors Journal", "date": "2026-11-16", "sjr": 0.947, "citescore": 7.8, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "電気機械インピーダンス（EMI）法の構造ヘルスモニタリングで、一様でない温度分布はインピーダンスの波形の形を不規則に変え、模擬した初期損傷より大きな変化を生みうることを実験で示した（抄録）。", "p3": "アルミ板にほぼ一様な温度分布と不均一な温度分布を与えて圧電素子のインピーダンスを測り、温度による変化を、実効周波数シフト（EFS）と動的時間伸縮（DTW）の補償と相関係数偏差（CCD）の指標で、模擬した初期損傷による変化と比べた（抄録）。", "p5": "ほぼ一様な温度は波形の全体的な変化を、不均一な温度は形の不規則な変化を生んだ。最も厳しい条件では、EFS補償後の不均一な温度によるCCDは模擬損傷の約9.5倍だった。DTWで整列は改善したが、不均一な温度による差は残った（抄録）。", "fun": "構造物に貼ったセンサの電気的な性質の変化から傷を見つける方法では、温度の変化が大きな雑音になる。これまで温度は全体に一様に変わると考えて補正してきたが、日なたと日陰のように場所でむらがあると、補正しても傷より大きな「偽の傷」が現れた。現場の温度のむらの怖さを実験で示した点が面白い。", "unverified": "温度分布の具体的な与え方と、模擬損傷の作り方は抄録からは確認できない。"}}, {"id": "jr19", "rank": 19, "headline": "複数モータの同期制御で車両-タイヤ-路面を同時推定", "title": "Cooperative Estimation of Vehicle-Tire-Road Interaction Parameters Based on Multiple PMSMs Deviation Coupled Synchronous Control", "url": "https://doi.org/10.1109/tvt.2026.3753995", "authors": "Haoran Li ほか", "venue": "IEEE Transactions on Vehicular Technology", "date": "2026-11-16", "sjr": 2.052, "citescore": 13.3, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "分散駆動の電気自動車で、複数のインホイールモータの同期制御とともに、車両状態・タイヤ-路面の摩擦係数・タイヤ力を同時に推定する枠組みを提案した（抄録）。", "p3": "速度補償器を入れた複数の永久磁石同期モータの偏差結合の同期センサレス制御を設計し、改良した5次の平方根キュバチャ・カルマンフィルタでモータの回転速度・回転子位置・車両状態・摩擦係数を同時推定し、車両動力学モデルを組み込んだPINNでタイヤの前後・横・上下の力を予測した（抄録）。", "p5": "実験で、車両-タイヤ-路面の相互作用パラメータの同定精度が大きく向上したと報告する（抄録）。", "fun": "車輪ごとにモータがある電気自動車では、モータの回り方そのものが路面の滑りやすさを映すセンサになる。この研究は、モータの制御と同時に、車の状態や路面とタイヤの摩擦をカルマンフィルタで推定し、タイヤにかかる力をAIで予測した。車そのものを走るセンサとして路面を読む発想が面白い。", "unverified": "同定精度の向上の具体的な数値と実験の条件は抄録からは確認できない。"}}, {"id": "jr20", "rank": 20, "headline": "多モデル融合と勾配補正で路面摩擦係数を即時推定", "title": "Real-time estimation of tire-road friction coefficient based on multi-model fusion and road slope compensation 基于多模型融合与道路坡度补偿的路面附着系数实时估计", "url": "https://doi.org/10.1007/s10409-026-51125-x", "authors": "Zixuan Chen ほか", "venue": "Acta Mechanica Sinica", "date": "2026-11-17", "sjr": 0.759, "citescore": 6.3, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、複数のモデルの推定を融合し、道路の勾配を補正して、タイヤと路面の摩擦係数（路面の付着係数）を実時間で推定する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "雨の日や雪の日には路面が滑りやすくなるが、その滑りやすさを走りながら測るのは難しい。題名からは、いくつかの推定方法を組み合わせ、さらに坂道の影響を差し引いて、摩擦の強さをその場で見積もる研究と読める。坂で加速が変わる効果と滑りやすさをどう見分けるかという問いが面白い。", "unverified": "抄録・本文がなく、手法・検証・結果はすべて未確認。"}}, {"id": "jr21", "rank": 21, "headline": "フラッター微係数の同定で防風柵の影響を解析", "title": "Flutter mechanism analysis of long-span steel truss girder suspension bridges based on flutter derivative identification: Effects of wind barriers", "url": "https://doi.org/10.1016/j.engstruct.2026.124168", "authors": "Yunfeng Zou ほか", "venue": "Engineering Structures", "date": "2026-11-17", "sjr": 1.922, "citescore": 12.0, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、長大な鋼トラス桁の吊橋で、フラッター微係数を同定してフラッター（風による自励振動）の機構を解析し、防風柵の影響を調べる研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "長い吊橋は、風によって自分で揺れを大きくしてしまう「フラッター」という現象で壊れる危険がある。題名からは、橋の揺れから風の力の特徴を表す数値（フラッター微係数）を取り出し、車を守る防風柵がその揺れにどう影響するかを調べる研究と読める。安全のための柵が別の危険を erified": "相対変位の大きさと方向の組み合わせの詳細は抄録からは確認できない。"}}, {"id": "jr24", "rank": 24, "headline": "規制ラベルの遅れを半教師ありBiGANで補う不正検知", "title": "Financial Statement Fraud Detection under Delayed Regulatory Labels: A Semi-supervised BiGAN Framework", "url": "https://doi.org/10.1016/j.eswa.2026.135134", "authors": "Wenrun Fu ほか", "venue": "Expert Systems with Applications", "date": "2026-11-17", "sjr": 1.939, "citescore": 17.0, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、規制当局による不正の確定（ラベル）が遅れて届く状況で、半教師ありのBiGAN（双方向の敵対的生成ネットワーク）を用いて財務諸表の不正を検知する枠組みを提案する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "会計不正は、発覚して当局が処分を決めるまでに何年もかかる。そのため最近の決算は「不正かどうか」の答えがまだ付いておらず、AIの学習に使いにくい。題名からは、答えの付いていない新しいデータも活かして学ぶ方法を提案する研究と読める。答えが遅れて届く問題をどう扱うかという問いが面白い。", "unverified": "抄録・本文がなく、手法・検証・結果はすべて未確認。"}}, {"id": "jr25", "rank": 25, "headline": "LLMのKano評価は口コミの非対称性を測れるか", "title": "Do LLM-derived Kano scores measure Kano categories? Valence and asymmetry in online skincare reviews", "url": "https://doi.org/10.1016/j.jretconser.2026.105213", "authors": "The Anh Phan ほか", "venue": "Journal of Retailing and Consumer Services", "date": "2026-11-16", "sjr": 3.913, "citescore": 24.8, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、スキンケアのオンラインの口コミからLLMで導いたKanoモデルのスコアが、本来のKano分類（当たり前品質・魅力品質など）を測れているかを、感情価と非対称性の観点で検証する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "商品の性質には、なければ不満になるもの（当たり前品質）と、なくても不満はないがあると喜ばれるもの（魅力品質）がある。題名からは、口コミをAIに読ませてこの分類ができるのか、良い評価と悪い評価の重みの違い（非対称性）まで捉えられるのかを確かめる研究と読める。AIによる測定の妥当性を問う点が面白い。", "unverified": "抄録・本文がなく、手法・検証・結果はすべて未確認。"}}, {"id": "jr26", "rank": 26, "headline": "粗視化MDで粘土の三軸圧縮を粒子から再現", "title": "Particle-Scale Triaxial Compression Simulations of Clay Using Coarse-Grained Molecular Dynamics", "url": "https://doi.org/10.1061/jggefk.gteng-15422", "authors": "Yohei Nakamichi ほか", "venue": "Journal of Geotechnical and Geoenvironmental Engineering - ASCE", "date": "2026-11-17", "sjr": 1.553, "citescore": 7.7, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "粗視化分子動力学（CGMD）で正規圧密のカオリナイトの三軸圧縮を粒子から再現し、間隙流体のpHによる初期の微視構造の違いが、ひずみ硬化・収縮と、ピーク強度・ダイレイタンシーの違いを生むことを示した（抄録）。", "p3": "pH=4の綿毛状とpH=8の分散状の2つの仮想試料を作り、拘束圧300・400・500 kPaで三軸圧縮の計算を行い、粒子間摩擦係数を変えるパラメータ研究を行った（抄録）。", "p5": "CGMDは応力依存の剛性とせん断強度、大ひずみでの限界状態への収束を定性的に再現した。pH=4はひずみ硬化・収縮、pH=8はピーク強度・ダイレイタンシーを示した。粒子間摩擦を増やすと限界状態の摩擦角が増え、実験値に近づくには摩擦係数がおよそ1.0必要だった（抄録）。", "fun": "粘土は目に見えない板状の粒子の集まりで、粒子のくっつき方は水の酸性度で変わる。この研究は粒子を一つずつ計算機の中で並べ、押しつぶす試験をまねた。同じ粘土でも、酸性の水ではじわじわ固くなり、アルカリ性の水では一度強くなってから崩れた。粒の並び方が土の性格を決めることを見せた点が面白い。", "unverified": "計算に使った粒子数と計算時間は抄録からは確認できない。"}}, {"id": "jr27", "rank": 27, "headline": "仕事の意味と天職感がストレス要因の害を緩める", "title": "Mitigating the Negative Consequences of Work Stressors: The Role of Perceived Meaning and Calling", "url": "https://doi.org/10.1177/08948453261509347", "authors": "Danielle West ほか", "venue": "Journal of Career Development", "date": "2026-11-17", "sjr": 1.277, "citescore": 9.3, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "仕事の要求度-資源（JD-R）の枠組みで、職場のストレス要因が仕事と健康に及ぼす害を、仕事の意味が媒介し、天職感（コーリング）が緩衝することを示した（抄録）。", "p3": "493人の従業員への2時点の調査で、ストレス要因への曝露から、仕事の意味の経験を経て、職務満足・離職意図・身体症状・燃え尽きに至るモデルを、天職感の程度による違いを含めて検証した（抄録）。", "p5": "特定のストレス要因への曝露と職場・健康の結果は一貫して結びついていた。天職感が、仕事の意味を通じて一部のストレス要因の影響を和らげることが支持された（抄録）。", "fun": "同じように忙しい職場でも、つぶれてしまう人と踏ん張れる人がいる。この研究は、その差の一つが「この仕事には意味がある」「これは自分の天職だ」という感覚にあることを示した。仕事の負担を減らすことだけでなく、仕事の意味を感じられるようにすることも守りになるという視点が面白い。", "unverified": "ストレス要因の種類ごとの効果の大きさは抄録からは確認できない。"}}, {"id": "jr28", "rank": 28, "headline": "ごみ収集車のカメラで不法投棄を即時に地図化", "title": "KerbTrack – A privacy-compliant modular AIoT solution for on-demand mapping of illegal kerbside bulk waste dumping", "url": "https://doi.org/10.1108/sasbe-05-2026-0428", "authors": "Umair Iqbal ほか", "venue": "Smart and Sustainable Built Environment", "date": "2026-11-17", "sjr": 1.198, "citescore": 14.4, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "ごみ収集車に載せたエッジAIのカメラで、歩道に不法投棄された粗大ごみをリアルタイムに検出・地図化する、プライバシーに配慮したAIoTの仕組みを作り、試作で運用の実現性を示した（抄録）。", "p3": "新しい注釈付きデータKerbTrackと、FLUX.1-devとLoRAで作った合成画像5,114枚のKerbTrack-Synで、YOLOやDINOなどの物体検出を学習・評価し、収集車のIMX335カメラにつないだNVIDIA Jetson AGX Orinに実装し、検出のメタデータと位置だけをダッシュボードに送った（抄録）。", "p5": "KerbTrackではYOLOv26がmAP50 90%で最も高かったが、誤り分析と合成データでの評価では、DINOが誤検出の抑制と多様な見え方への頑健性で優れていた。収集車での試作で運用の実現性を確かめた（抄録）。", "fun": "毎日街を回るごみ収集車にカメラとAIを積めば、道ばたの不法投棄を自動で見つけて地図にできる。映像そのものは送らず「どこに何があったか」だけを送るので、通行人のプライバシーも守れる。街を走る車を、街の見回り役の動くセンサに変える発想が面白い。", "unverified": "試作は限られた条件の小規模なもので、他の都市や天候での性能は未確認（著者が明記）。"}}, {"id": "jr29", "rank": 29, "headline": "サービス失敗時の炎上でフォロワーが集まる要因", "title": "Follower formation in online brand community firestorms: Social characteristics, post content, and peer attention during service failure", "url": "https://doi.org/10.1016/j.jretconser.2026.105215", "authors": "Lingpiao Wang ほか", "venue": "Journal of Retailing and Consumer Services", "date": "2026-11-17", "sjr": 3.913, "citescore": 24.8, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、サービスの失敗をきっかけにオンラインのブランドコミュニティで起きる炎上について、投稿者の社会的な特徴・投稿の内容・仲間の注目が、フォロワーの形成にどう影響するかを調べる研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "お店やブランドの失敗にSNSで怒りの声が上がると、ある投稿には次々と人が集まり、別の投稿は埋もれていく。題名からは、誰が、何を、どんな注目のもとで投稿すると人が集まるのかを調べる研究と読める。炎上が広がる仕組みを、投稿のつながりから解き明かそうとする問いが面白い。", "unverified": "抄録・本文がなく、データ・手法・結果はすべて未確認。"}}, {"id": "jr30", "rank": 30, "headline": "財務困窮企業の株価は市場と連動しにくい", "title": "Financial distress and stock comovement", "url": "https://doi.org/10.1080/23270012.2026.2738149", "authors": "Zhuo June Cheng ほか", "venue": "Journal of Management Analytics", "date": "2026-11-16", "sjr": 0.649, "citescore": 7.1, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "財務困窮企業の株式リターンは市場全体との共変動が最も低く、それが評価の不確実性と情報・裁定の摩擦による企業固有の変動で説明されることを示した（抄録）。", "p3": "線形のファクターモデルで、財務困窮の程度とリターンの共変動・固有変動の関係を分析し、困窮と誤評価（過小・過大評価）の関係から極端なリターンの起こりやすさを調べた（抄録）。", "p5": "財務困窮企業ほど共変動が低く、高い固有変動がそれを説明した。困窮企業は極端な正・負のリターンを経験しやすく、困窮企業に当てはめたアノマリー戦略の高いリターンや、困窮とリターンの関係の実証結果の食い違いを説明する助けになる（抄録）。", "fun": "倒産しそうな会社の株は、市場全体が上がっても下がっても、それとは関係なく大きく動く。値段の決め方がはっきりせず、売り買いで正す人も少ないので、値段が本当の価値から大きくずれやすいからだ。危ない会社ほど「市場と一緒に動かない」という性質が、昔からの謎を解く鍵になる点が面白い。", "unverified": "対象の市場・期間・企業数は抄録からは確認できない。"}}, {"id": "jr31", "rank": 31, "headline": "MFIの困窮予測は時間順の検証で精度が下がる", "title": "Leveraging machine learning to predict distress in microfinance institutions", "url": "https://doi.org/10.1016/j.iref.2026.106044", "authors": "Tushar M. Bhuwad ほか", "venue": "International Review of Economics & Finance", "date": "2026-11-12", "sjr": 1.485, "citescore": 8.3, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "マイクロファイナンス機関の財務困窮の早期警戒に機械学習を使い、無作為の交差検証より時間順の検証で精度が大きく下がること、運営の自立度が困窮とU字型に関連することを示した（抄録）。", "p3": "MIX Marketの933機関の2015〜2019年のパネルで、資本構成と運営効率の指標を予測子とし、SMOTEで不均衡を補正して複数の分類器を比べた。困窮はAltman Z''の非製造業版で代理し、無作為と時間順の検証で評価した（抄録）。", "p5": "ランダムフォレストとK近傍法が最も良く、無作為の検証で重み付きF1は約96.2%（困窮クラスのF1は約0.82）だったが、時間順の検証では約71.0%に下がった。モデルの順位は安定していた。運営自立度が最も重要で、低すぎても高すぎても困窮のリスクが高かった（抄録）。", "fun": "AIの予測は、過去と未来を混ぜて検証すると良く見えるが、本番では「過去から未来を当てる」しかない。この研究は、検証の仕方を変えるだけで成績が96%から71%に落ちることを示した。さらに、効率が良すぎる機関も危ないというU字の関係も面白い。予測の評価は使う場面に合わせるべきだという好例だ。", "unverified": "困窮の代理指標（Altman Z''）が実際の破綻とどれだけ対応するかは抄録からは確認できない。"}}, {"id": "jr32", "rank": 32, "headline": "市営コワーキング拠点が若者の社会関係資本を育む", "title": "From shared space to shared resilience: How municipal co‐working hubs build social capital among urban young adults", "url": "https://doi.org/10.1002/ajcp.70119", "authors": "Tal Harel ほか", "venue": "American Journal of Community Psychology", "date": "2026-11-17", "sjr": 1.195, "citescore": 6.0, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "テルアビブ・ヤッフォの市営のコワーキング・学習拠点が、18〜35歳の若者の自己組織化・自信・所属感を支え、結束・橋渡し・連結の社会関係資本を通じて地域のレジリエンスを支えうることを質的に示した（抄録）。", "p3": "統合レジリエンス・モデルに基づき、5つの市営拠点の職員と若者への72件の半構造化面接を主題分析した（抄録）。", "p5": "学び、自主的な取り組み、地域の行事、支えになる職員との関係、仲間の支え、市とのつながり、個人のエンパワメント、機能的な設備の8つの主題が得られ、拠点を相互支援・参加・共同の取り組みの機会を通じた公共のレジリエンスの基盤と位置づけた（抄録）。", "fun": "市が用意した共用の仕事場や勉強場所は、ただの机と電源ではない。そこで顔を合わせるうちに仲間ができ、市の担当者とつながり、自分たちで催しを始めるようになる。この研究は、日々の「場」が若者と地域の回復力を育てる仕組みを描いた。公共の施設を人のつながりの土台として見る視点が面白い。", "unverified": "面接の対象者の内訳と、拠点ごとの違いは抄録からは確認できない。"}}, {"id": "jr33", "rank": 33, "headline": "移民女性の見えない介護を演劇で可視化する計画", "title": "Performing the unspoken: Protocol for an ethnodrama study of caregiver burden among Arab migrant women caring for older adults at home in the Greater Toronto Area", "url": "https://doi.org/10.1371/journal.pone.0362877", "authors": "Areej Al‐Hamad ほか", "venue": "PLoS ONE", "date": "2026-11-16", "sjr": 0.726, "citescore": 4.8, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "トロント圏で高齢者を在宅で介護するアラブ系移民女性の負担を、面接・エスノドラマ（当事者の語りに基づく演劇）・名義集団法の3段階で可視化し、支援の提言を共同で作る研究計画を示した（抄録）。", "p3": "アラブ・コミュニティ・センターと協働し、ケアの倫理と交差性の枠組みで、第1段階に20〜25人の半構造化面接と主題分析、第2段階に語りを4つの短い場面の演劇にして上演と観客の対話、第3段階に関係者10〜15人とのオンラインの名義集団法で提言の優先順位を付ける（抄録）。", "p5": "計画の論文で結果はまだない。成果として多層の提言、地域への報告書、演劇を使った知識の発信、学術論文、知識の発信の会合を予定している（抄録）。", "fun": "家族の介護は、家の中で黙って担われるため外から見えにくい。移民の女性なら、言葉の壁や文化の期待も重なる。この研究は、そうした語られない経験を聞き取り、演劇にして人前で演じ、見た人の反応からも支援の必要を探る。研究の結果を数字ではなく舞台で伝えるという方法が面白い。", "unverified": "計画段階のため、結果はない。"}}, {"id": "jr34", "rank": 34, "headline": "E3C超縮約でマルチスケール均質化を高速化", "title": "An adaptive E3C hyper-reduction approach to the homogenization of dissipative microstructures and its justification via the Hill-Mandel condition", "url": "https://doi.org/10.1007/s00466-026-02869-5", "authors": "Hauke Goldbeck ほか", "venue": "Computational Mechanics", "date": "2026-11-17", "sjr": 1.223, "citescore": 7.7, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "散逸性の微視構造を持つ材料の3次元の非弾性の計算均質化を、E3C超縮約で高速化し、その理論的な裏付けとオンラインで部分空間を適応させる方法を示した（抄録）。", "p3": "E3C法が古典的なHill–Mandelのマクロ均質性条件の射影・超縮約版を満たすことを示し、内部変数を持つ非結晶の散逸材料に粘性の正則化で拡張し、オフラインで決めた線形の部分空間の中に、より低次元で動的に更新するアフィン部分空間を作る「逐次部分空間モード適応」を提案した（抄録）。", "p5": "学習のバッチサイズ・材料の非線形性・微視構造の影響をパラメータ研究で評価し、数十万のマクロ自由度を持つ3次元の弾塑性の2スケール計算で、単一スケールの計算に近い計算時間で効率と精度を示した（抄録）。", "fun": "複合材料の部品を計算するには、部品の各点で、さらに細かい内部構造の計算を繰り返す必要があり、途方もなく重い。この研究は、内部構造の計算を少数の代表的な形の組み合わせに縮め、しかもその形を計算の途中で入れ替えて精度を保った。重い計算を物理の約束を守ったまま軽くする工夫が面白い。", "unverified": "縮約による誤差の大きさの数値は抄録からは確認できない。"}}, {"id": "jr35", "rank": 35, "headline": "確率動力学系の条件付き破壊確率を評価する枠組み", "title": "A KPOD-K-MEL computational framework for conditional failure probability evaluation: toward reliability-based design optimization of stochastic dynamic systems", "url": "https://doi.org/10.1016/j.compstruc.2026.108541", "authors": "Zeming Chang ほか", "venue": "Computers and Structures", "date": "2026-11-17", "sjr": 1.243, "citescore": 7.5, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、確率的な動的システムの条件付きの破壊確率を評価し、信頼性に基づく設計最適化につなげる計算の枠組み（KPOD-K-MEL）を提案する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "地震や風のように揺れ方が毎回違う力を受ける構造物が、ある条件のもとでどれくらいの確率で壊れるか。それを設計のたびに計算するのは重すぎる。題名からは、この確率を効率よく求めて、壊れにくさを保証する設計の最適化に使う方法を作る研究と読める。偶然を含む揺れを確率で扱う問いが面白い。", "unverified": "抄録・本文がなく、手法・検証・結果はすべて未確認。手法名の略語の意味も未確認。"}}, {"id": "jr36", "rank": 36, "headline": "GNNで粒状体の粒子間接触力を予測", "title": "Graph neural network prediction of inter-particle contact forces in granular materials under uniaxial compression", "url": "https://doi.org/10.1016/j.engappai.2026.116683", "authors": "Mobina Taghaddosi ほか", "venue": "Engineering Applications of Artificial Intelligence", "date": "2026-11-16", "sjr": 1.782, "citescore": 11.7, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、一軸圧縮を受ける粒状体の粒子間の接触力を、グラフニューラルネットワークで予測する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "砂を押し固めると、力は全ての粒に均等にかかるのではなく、一部の粒がつながった「力の鎖」に集中する。題名からは、粒とその接触をつながりの網（グラフ）として表し、どの接触に強い力がかかるかをAIで当てる研究と読める。目に見えない力の通り道を予測するという問いが面白い。", "unverified": "抄録・本文がなく、手法・検証・結果はすべて未確認。"}}, {"id": "jr37", "rank": 37, "headline": "雪解け水と降雨でトンネル残土の土石流が発生", "title": "A preliminary study of runoff-generated waste dump debris flow in the mountain cryosphere", "url": "https://doi.org/10.1007/s12665-026-13055-4", "authors": "Jing Luo ほか", "venue": "Environmental Earth Sciences", "date": "2026-11-17", "sjr": 0.696, "citescore": 5.4, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "チベット高原の高山域のトンネル残土の堆積で、雪解け水と降雨による集中流が侵食から流路化した土石流を引き起こす過程を、現地調査と水路実験で示した（抄録）。", "p3": "ナムチャバルワ山近くの多雄拉の残土の侵食の特徴を調べ、龍嘉曲流域の地形と水文を考慮して、残土の形を変えた水路実験を行い、水理・力学の分析を行った（抄録）。", "p5": "残土は雪解け水で溝と側方の侵食を受け、降雨で悪化した。流量が増えると侵食溝が広がって流路になり、流路化した土石流が河床を大きく侵食した。勾配が急なほど発生に必要な流量は大きかった。発生は表面の抗力、内部の浸透力、浅い部分の飽和による（抄録）。", "fun": "山奥でトンネルを掘ると大量の土砂が出て、谷に積み上げられる。この研究は、その人工の土の山が、雪解けと雨が重なると土石流になって流れ出す過程を、実験で再現した。人が作った斜面が新しい災害の種になるという指摘と、水が土を押し流す力の内訳を分けて考えた点が面白い。", "unverified": "発生に必要な流量の具体的な数値は抄録からは確認できない。"}}, {"id": "jr38", "rank": 38, "headline": "交通拠点の道路・鉄道振動の伝播を予測する枠組み", "title": "Hybrid prediction framework and propagation mechanisms of coupled road-rail vibrations in large-scale transportation hub complexes", "url": "https://doi.org/10.1016/j.conbuildmat.2026.148892", "authors": "Guangrui Yang ほか", "venue": "Construction and Building Materials", "date": "2026-11-17", "sjr": 2.097, "citescore": 14.2, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、大規模な交通拠点の複合施設で、道路と鉄道の振動が連成して伝わる機構と、その予測の混合的な枠組みを扱う研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "駅と道路と商業施設が一体になった大きな交通拠点では、車と電車の揺れが混ざり合って建物に伝わる。題名からは、二つの揺れがどう重なり、どう伝わるかを調べ、予測する方法を作る研究と読める。複数の揺れの源が重なる場所で、建物の揺れを前もって見積もるという問いが面白い。", "unverified": "抄録・本文がなく、手法・検証・結果はすべて未確認。"}}, {"id": "jr39", "rank": 39, "headline": "地下鉄振動と地震を同時に抑える複合支承", "title": "Seismic and Subway-Induced Vibration Dual-Control Performance of Metal Rubber–Polyurethane Composite Bearings for TOD Over-Track Buildings", "url": "https://doi.org/10.3390/buildings16224539", "authors": "Ben Sha ほか", "venue": "Buildings", "date": "2026-11-16", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "公共交通指向型開発（TOD）の線路上空の建物向けに、地下鉄の振動と地震の両方を抑える金属ゴム・ポリウレタン複合支承を提案し、試験と解析で性能を示した（抄録）。", "p3": "鉛直圧縮と水平の圧縮せん断の試験を複数組行って剛性・強度などを求め、ETABSで典型的な線路上空の多層骨組みのモデルを作り、基礎固定と免震の条件で動的応答を比べた（抄録）。", "p5": "鉛直の振動絶縁では固有周期が0.11秒から0.20〜0.24秒に延び、40〜100 Hzの加速度応答が弱まった。水平の免震では固有周期が0.7秒から1.20〜1.51秒に延び、MR-PU-A2の構成で最下層のX方向の免震率は3つの地震動で67〜74%だった（抄録）。", "fun": "駅や線路の真上にマンションを建てると、地下鉄の細かい揺れが毎日伝わり、地震のときは大きな揺れも受ける。この研究は、金属の細い線を絡めたゴムのような材料と樹脂を組み合わせた支えで、両方の揺れを一つの装置で抑えようとした。揺れの周波数の違いを利用して、二つの役目を兼ねさせる点が面白い。", "unverified": "解析のみで、実建物での計測による検証は抄録からは確認できない。"}}, {"id": "jr40", "rank": 40, "headline": "気候変動と施工欠陥を入れた床版劣化の物理モデル", "title": "Coupled Physics-Based Bridge Deck Condition Assessment Considering Climate Change and Construction Defects", "url": "https://doi.org/10.1061/jbenf2.beeng-8469", "authors": "Jesika Rahman ほか", "venue": "Journal of Bridge Engineering", "date": "2026-11-17", "sjr": 1.087, "citescore": 7.2, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "鉄筋コンクリート床版の塩害・中性化・凍結融解・交通による疲労と施工欠陥を一つの物理モデルで扱い、気候変動のシナリオによる劣化の差と、かぶり厚さが最も重要なことを示した（抄録）。", "p3": "締固め不良などの施工欠陥と、凍結防止剤の塩分にさらされる程度の空間的なばらつきを2次元の格子で表し、現地のデータで主要な物理指標の予測を検証した（抄録）。", "p5": "主要な指標の予測誤差はおおむね10%未満だった。水セメント比を0.45から0.60にすると今世紀末の鉄筋径の減少が約51%増え、かぶりを80 mmから42 mmに減らすと腐食の開始が29年から5年に早まった。気候シナリオ間でひび割れ幅の予測は最大0.46 mm違った（抄録）。", "fun": "橋の床は、塩、空気中の二酸化炭素、凍ったり溶けたりの繰り返し、車の重みで少しずつ傷んでいく。これまでは原因ごとに別々に計算されることが多かったが、この研究は全部を一つの計算にまとめ、温暖化の進み方による違いまで見積もった。鉄筋を覆うコンクリートの厚さが寿命を大きく左右するという結論が分かりやすい。", "unverified": "検証に使った現地データの橋の数と期間は抄録からは確認できない。"}}, {"id": "jr41", "rank": 41, "headline": "サービス回復と価格の公正さが乗客の忠誠を高める", "title": "Effects of perceived justice and price fairness on passenger loyalty via satisfaction in Indian airlines: do gender and failure severity moderate such relationships?", "url": "https://doi.org/10.1108/tqm-12-2025-0698", "authors": "Akuthota Sankar Rao ほか", "venue": "The TQM Journal", "date": "2026-11-16", "sjr": 0.971, "citescore": 12.8, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "インドの航空会社で、サービス回復の知覚的公正と価格の公正さが満足を通じて乗客の忠誠を高め、その関係は女性の乗客と失敗の深刻度が低い場合に強いことを示した（抄録）。", "p3": "サービスの失敗と回復の対応を経験した乗客485人のデータを構造方程式モデルで分析し、性別と失敗の深刻度で多群分析を行った（抄録）。", "p5": "知覚的公正と価格の公正さは満足と忠誠を有意に高め、満足が部分的に媒介した。関係は女性の乗客と、失敗の深刻度が低い条件で強かった（抄録）。", "fun": "飛行機の遅れや荷物の紛失のあとの対応が、公平で誠実だと感じられれば、客はまたその会社を選ぶ。この研究は、その効果が失敗の大きさで変わり、大きな失敗では対応の効き目が弱まることを示した。小さな失敗のうちに丁寧に対応することの大切さを、客の気持ちの道筋から示した点が面白い。", "unverified": "調査は自己申告の横断データで、因果は確認できない。効果の大きさの数値は抄録からは確認できない。"}}, {"id": "jr42", "rank": 42, "headline": "接客の支援は関係の質を経て障害のある客の忠誠に", "title": "Building the relational bridge: how frontline social support fosters market inclusion for consumers with disabilities", "url": "https://doi.org/10.1108/jsm-12-2025-0957", "authors": "Abdulkadir Sencan ほか", "venue": "Journal of Services Marketing", "date": "2026-11-17", "sjr": 1.536, "citescore": 9.4, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "障害のある消費者に対する接客従業員の社会的な支援は、関係の質を高めることを通じてのみ再購買と口コミにつながることを示した（抄録）。", "p3": "変革的サービス研究と障害の社会モデルに基づき、トルコの障害のある消費者131人のデータを、SmartPLS 4の2段階の階層成分モデルによるPLS-SEMで分析した（抄録）。", "p5": "社会的支援は関係の質に強い正の効果を持つが、再購買意図や口コミには直接は効かず、関係の質が両方の経路を完全に媒介した。便宜標本で、視覚と肢体の障害のある人が中心である（抄録）。", "fun": "お店の人の親切は、それだけでは常連客を生まない。障害のある客にとっては、親切が積み重なって「この店とは信頼関係がある」と感じたときに初めて、また来よう、人に勧めようという行動につながる。市場への参加を、店員との関係づくりの問題として捉えた点が面白い。", "unverified": "便宜標本・自己申告のデータで一般化に限界がある（著者が明記）。"}}, {"id": "jr43", "rank": 43, "headline": "VRの3D視線計測で街路空間の視覚密度を定量化", "title": "Quantifying Urban Spatial Visual Density by Integrating Real-Scene Reconstruction with Virtual Reality-Based 3-Dimensional Eye-Tracking", "url": "https://doi.org/10.3390/buildings16224550", "authors": "Xinyu Fan ほか", "venue": "Buildings", "date": "2026-11-16", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "実景の3次元再構築とVR内の3次元視線計測を組み合わせ、自由に歩きながら見る都市空間の視覚的な注意から「空間の視覚密度」の指標を作った（抄録）。", "p3": "実景のスキャンで高精度の都市の場面を再構築し、自由歩行のできるVR環境でヘッドマウントディスプレイによる視線計測を行い、視線の計算から行動の指標を作り、瀋陽の時光里街区の屋外部分で実証した（抄録）。", "p5": "3次元の実景再構築と3次元の視線計測の組み合わせで、都市での人の見え方と動きをある程度まねでき、従来の平面的な視線計測実験の不足を補えると報告する（抄録）。", "fun": "街並みの良し悪しを評価するとき、写真を見せて感想を聞く方法では、歩きながら見る本当の体験とずれてしまう。この研究は、実際の街を丸ごとVRの中に再現し、そこを歩く人の視線を立体的に記録した。人がどこに目を向けたかの密度で、空間の「にぎやかさ」を数える発想が面白い。", "unverified": "参加者の人数と、指標の数値的な結果は抄録からは確認できない。"}}, {"id": "jr44", "rank": 44, "headline": "高密度化は見えない立ち退きと住戸の空置を伴う", "title": "Each building tells a story: A New York City neighborhood on the cusp of densification", "url": "https://doi.org/10.1177/00420980261500283", "authors": "Mara Sidney ほか", "venue": "Urban Studies", "date": "2026-11-17", "sjr": 1.809, "citescore": 9.9, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "候補の収集時に出版社から取得した抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "マンハッタンのインウッド地区で、ニューヨーク市の再ゾーニングによる高密度化が既存の住宅政策と絡み合い、目に見えない立ち退きや住戸の空き置きなどの矛盾した結果を生むことを示した（抄録）。", "p3": "新しい都市政策の分析の枠組みで、公共政策・不動産記録・日常の観察を組み合わせ、再ゾーニングの戦略と他の住宅政策が交わる4つの場所を事例として調べた（抄録）。", "p5": "高密度化と低密度化が同時に起き、高層ビルのように見える変化の陰で、借家人の立ち退きや住戸を貸さずに置いておく行為が進んでいた。再ゾーニングの採択後も関係者が別の経路で政策の変更を求め、実施が場当たりの政策形成として働いていた（抄録）。", "fun": "街に高いビルを建てやすくする規制緩和は、住宅を増やして家賃を下げる策と説明されることが多い。ところが実際の街を一軒ずつ見ると、目立つ高層化の裏で、住民の追い出しや空き部屋のまま寝かせる動きが起きていた。統計では見えない変化を「建物の物語」から拾う方法が面白い。", "unverified": "4つの事例の選び方と、量的な規模は抄録からは確認できない。"}}, {"id": "jr45", "rank": 45, "headline": "生成AIの受容はジョブ・クラフティングを通じ革新に", "title": "Generative Artificial Intelligence Acceptance and Innovation in Healthcare: Job Crafting and Crisis Leadership", "url": "https://doi.org/10.3390/su182211667", "authors": "Reem M. Mashat ほか", "venue": "Sustainability", "date": "2026-11-16", "sjr": 0.75, "citescore": 8.9, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "仕事の要求度-資源（JD-R）理論に基づき、サウジアラビアの医療従事者で、生成AIの受容がジョブ・クラフティングを通じて革新的な行動と結びつくことを示した（抄録）。", "p3": "医療従事者250人へのオンライン調査をPLS-SEMで分析し、生成AIの受容・ジョブ・クラフティング・革新的行動の関係と、危機的リーダーシップの調整を調べた（抄録）。", "p5": "生成AIの受容とジョブ・クラフティング、ジョブ・クラフティングと革新的行動はそれぞれ有意に正に関連し、ジョブ・クラフティングが部分的に媒介した。危機的リーダーシップの調整は支持されなかった。実際の生成AIの利用は測っていない（抄録）。", "fun": "生成AIを受け入れた医療従事者は、自分の仕事のやり方を自ら組み替える（ジョブ・クラフティング）傾向があり、それが新しい工夫につながっていた。AIが直接に革新を生むのではなく、働く人が仕事を作り直す主体性を介して効いているという見方が面白い。", "unverified": "横断調査で因果は確認できない。実際の利用量は測定していない（著者が明記）。"}}, {"id": "jr46", "rank": 46, "headline": "負債調達は利益調整を増やしガバナンスが抑える", "title": "The regulating role of governance framework on the association between external financing and accounting manipulation: evidence from an emerging market", "url": "https://doi.org/10.1108/cg-09-2025-0670", "authors": "Mohammad Helal Uddin", "venue": "Corporate Governance", "date": "2026-11-16", "sjr": 0.992, "citescore": 11.1, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "バングラデシュの上場企業で、負債による資金調達は利益調整を増やし、株式による調達は減らし、コーポレート・ガバナンスが両者の関係を調整することを示した（抄録）。", "p3": "13業種の非金融の上場118社の2011〜2024年の年次報告書のデータで、ガバナンス指数を調整変数とし、発生主義と実体の利益調整のモデルを用いて最小二乗法の重回帰で検証した（抄録）。", "p5": "負債調達への依存が大きい企業ほど利益調整を行いやすく、株式調達は利益調整と有意に負の関係だった。ガバナンスの仕組みは利益調整を有意に減らし、外部資金調達と会計操作の関係を有意に調整した（抄録）。", "fun": "銀行からお金を借りている会社は、返済の条件（財務制限）を守るために決算の数字をよく見せたくなる。株で資金を集める会社は、多くの投資家の目にさらされる。この研究は、お金の集め方の違いが決算の数字の「お化粧」の度合いに表れ、監視の仕組みがそれを抑えることを示した点が分かりやすい。", "unverified": "内生性への対処（調達方法の選択の偏り）は抄録からは確認できない。"}}, {"id": "jr47", "rank": 47, "headline": "高齢者の孤独感は約6割が特性で約4割が状態", "title": "Stability and change in loneliness among older Europeans: a trait-state-occasion analysis of SHARE data.", "url": "https://doi.org/10.1080/13607863.2026.2761596", "authors": "Galiana L ほか", "venue": "Aging & mental health", "date": "2026-11-16", "sjr": 1.207, "citescore": 6.8, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Europe PMCに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "欧州の高齢者の孤独感を特性（安定した個人差）と状態（時期ごとの変動）に分け、約60%が特性的であることと、援助の授受が主に特性の部分と関連することを示した（抄録）。", "p3": "SHAREの3つの波で、UCLA孤独感尺度に特性-状態-時点（TSO）モデルを当てはめ、受けた援助と与えた援助を共変量に加えた（抄録）。", "p5": "特性の成分が潜在分散の約60%、時点の成分が約40%を占めた。受けた援助は特性的な孤独感と正に、与えた援助は負に関連した。時点に固有の成分との関連はおおむね弱く有意でなかったが、2つの例外があった（抄録）。", "fun": "お年寄りの孤独感は、その人の性格のように変わりにくいのか、その時々の出来事で揺れ動くのか。調べると6割は変わりにくい部分だった。しかも、人を助けている人ほど孤独を感じにくく、助けられている人ほど感じやすかった。「助ける側に回ること」が孤独を和らげる可能性を示した点が面白い。", "unverified": "援助の授受と孤独感の因果の向きは抄録からは確認できない。"}}, {"id": "jr48", "rank": 48, "headline": "液状化と流体力の連成下での橋脚の地震応答", "title": "Three-dimensional numerical simulation and seismic response analysis of bridge piers under coupled site liquefaction and hydrodynamic action conditions", "url": "https://doi.org/10.1016/j.oceaneng.2026.129507", "authors": "Yu Chen ほか", "venue": "Ocean Engineering", "date": "2026-11-17", "sjr": 1.524, "citescore": 10.2, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、地盤の液状化と動水圧（水の流体力）が同時に働く条件で、橋脚の地震応答を3次元の数値シミュレーションで解析する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "川や海に立つ橋脚は、地震のときに足もとの砂地盤が液状化して支えを失い、同時にまわりの水からも押される。題名からは、この二つの効果を一緒に計算して、橋脚がどう揺れるかを調べる研究と読める。別々に考えられがちな地盤と水の影響を重ね合わせるという問いが面白い。", "unverified": "抄録・本文がなく、手法・検証・結果はすべて未確認。"}}, {"id": "jr49", "rank": 49, "headline": "らせん状の地形上のブラウン運動を位相空間で解く", "title": "Chirality-sensitive mobility and dissipation of Brownian motion on a helical landscape", "url": "https://doi.org/10.1063/5.0347035", "authors": "Debankur Bhattacharyya ほか", "venue": "The Journal of Chemical Physics", "date": "2026-11-16", "sjr": 0.877, "citescore": 5.3, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は未取得", "preprint": false, "short": true, "p1": "円筒面に刻まれたらせん状の地形の上を動く慣性を持つ粒子のブラウン運動を、位相空間の線形オルンシュタイン・ウーレンベック過程として定式化し、移動度テンソルなどを閉じた形で導いた（抄録）。", "p3": "調和井戸の近似で、決定論的な運動はらせん方向の自由な伝播とそれに直交する調和振動に分かれる。等方的な減衰ならランジュバン方程式でも分離が保たれるが、軸方向と角度方向で減衰が異なると分離が壊れる。らせん方向の拡散に伴う零モードを射影で除いた安定部分空間で定常ダイナミクスを作り、線形応答を導いた（抄録）。", "p5": "定常の時間相関関数と動的な移動度テンソルを時間・周波数の両領域で閉じた形で得た。非対角の要素は軸方向の力と回転、トルクと軸方向の輸送の交差応答を表し、時間反転対称性と整合して等しい。軸方向と角度方向を同時に駆動すると、らせんの向きによってエネルギー散逸に非対称が生じた（抄録）。", "fun": "ねじのような溝の上を、熱で揺さぶられながら動く小さな粒を考える。押すと回り、回すと進むという「ねじの性質」が、ゆらぎのある世界でどう現れるかを、位置と速度を合わせた空間で厳密に計算した。右ねじと左ねじで熱の出方が違うという結果は、分子の左右の違いを見分ける手がかりにもなりそうで面白い。", "unverified": "数値シミュレーションとの照合の有無は抄録からは確認できない。"}}, {"id": "jr50", "rank": 50, "headline": "CNNとBiLSTMでDEMの間隙率を代理予測", "title": "A sequential deep learning surrogate framework integrating CNN and BiLSTM for DEM-based porosity prediction in heterogeneous granular assemblies", "url": "https://doi.org/10.1007/s10596-026-10485-8", "authors": "Phong Nguyen Thanh ほか", "venue": "Computational Geosciences", "date": "2026-11-16", "sjr": 0.547, "citescore": 5.0, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "出版社サイト・Crossrefとも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、不均質な粒状体の集合の間隙率を、個別要素法（DEM）の代わりにCNNとBiLSTMを組み合わせた逐次の深層学習の代理モデルで予測する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "大きさや形のそろわない粒を詰めたとき、どれくらいすき間ができるかは、粒を一つずつ動かす計算で求められるが時間がかかる。題名からは、画像の特徴をつかむAIと時間の流れを追うAIを組み合わせ、その計算の結果を素早くまねる研究と読める。重い計算をAIで置き換える試みとしての問いが面白い。", "unverified": "抄録・本文がなく、手法・検証・結果はすべて未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "経済学", "headline": "LLMは履歴書の作成と選考・賃金提案で性差を再生産", "title": "Automating inequality? Gender bias in AI-mediated labor markets", "url": "https://doi.org/10.1073/pnas.2534118123", "authors": "Kenza Elass ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-16", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "応募者の性別だけを無作為に変えた一連の監査実験で、LLMが性別ステレオタイプに沿った履歴書を生成し、選考の点数と賃金の提案に性別の偏りを示すことを報告する。選考点は職業の性別分離に沿って男性の多い職で女性を不利に、女性の多い職で有利にし、偏りは同じ内容の評価の違いと生成内容の違いの2つの経路で生じる。"}, {"id": "jn02", "rank": 2, "field": "因果推論", "headline": "空き地の緑化の防犯効果は10年後も続く", "title": "Sustainability of violence prevention after a randomized vacant lot greening intervention in Philadelphia: A 10-y follow-up", "url": "https://doi.org/10.1073/pnas.2620725123", "authors": "Nicole Asa ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-16", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "2013年にフィラデルフィアで行った空き地の緑化のクラスター無作為化試験を10年追跡し、介入を受けた区画は受けなかった区画より犯罪全体と暴力犯罪の密度が年9%低く（ITT）、緑化が持続した区画では12%・11%低かった（汚染調整ITTによる局所平均処置効果）。介入の10年後も暴力の予防効果が続くと報告する。"}, {"id": "jn03", "rank": 3, "field": "統計学", "headline": "無作為化実験の回帰調整を脱相関で改良", "title": "A decorrelation method for general regression adjustment in randomized experiments", "url": "https://doi.org/10.1093/jrsssb/qkag145", "authors": "Fangzhou Su ほか", "venue": "Journal of the Royal Statistical Society Series B: Statistical Methodology", "date": "2026-11-13", "sjr": 3.734, "citescore": 7.6, "citescore_year": "2025", "why": "設計に基づく枠組みで平均処置効果を一般の関数クラスによる回帰調整で推定する際、標本の再利用による偏りを脱相関という新しい方法で回避し、回帰の一致性を要しない漸近・非漸近の保証、条件付き正規近似、有限標本の被覆保証を示した。高次元・ノンパラメトリックの問題で標本複雑度の改善を示す。"}, {"id": "jn04", "rank": 4, "field": "経営学", "headline": "政治的に遠い銀行どうしは協調融資を組みにくい", "title": "Partisan Banks and Creditor Coordination Within Loan Syndicates", "url": "https://doi.org/10.1111/1475-679x.70097", "authors": "Robert M. Bushman ほか", "venue": "Journal of Accounting Research", "date": "2026-11-17", "sjr": 9.774, "citescore": 13.4, "citescore_year": "2025", "why": "協調融資市場で、主幹事行と参加行の政治的な距離が大きいほど参加の確率と保有割合が下がり、全米の分極化が強い時期に関係が強まることを示した。シンジケート内の政治的多様性は緩いコベナンツと高い金利スプレッドと関連し、再交渉の膠着を避けるため条件付きの統制を手放すトレードオフと解釈する。"}, {"id": "jn05", "rank": 5, "field": "経営学", "headline": "責任投資を誓った投信は企業訪問を増やす", "title": "Do Fund Managers’ Commitments to Responsible Investing Affect Private Information Acquisition, Information Environment, and Corporate Sustainability?", "url": "https://doi.org/10.1287/mnsc.2024.08443", "authors": "Sumit Agarwal ほか", "venue": "Management Science", "date": "2026-11-16", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "why": "国連責任投資原則に署名した投資信託の運用者が、環境・社会の問題に焦点を当てた企業訪問を増やすことを示した。訪 core_year": "2025", "why": "2021年10月の国連生物多様性会議（COP15）以降、米国の社債市場で生物多様性のフットプリントが1標準偏差大きい企業の流通利回りのスプレッドが7%高くなり、それ以前は有意でなかったことを示した。発行市場でも見られ、中期債で強く、気候関連の経路とは区別される。"}, {"id": "jn10", "rank": 10, "field": "心理学・認知科学", "headline": "心の知覚の内部モデルは短期に柔軟で長期に安定", "title": "Short-term flexibility and long-term stability in models of mind perception", "url": "https://doi.org/10.1073/pnas.2625583123", "authors": "Ronja F. Held ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-16", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "4つの実験（計256人）で、人・ペット・ロボット・音声アシスタント・道具などに主体性と経験を帰属させる内部モデルを表象類似性分析で調べ、経験の帰属は生物か否かの区別に基づき、主体性の帰属は個人差が大きく情報を受けると範疇全体で更新されることを示した。ロボットやペットとの長期の接触でモデルが組み替わる証拠はなかった。"}, {"id": "jn11", "rank": 11, "field": "経済学", "headline": "中国は石炭火力を増やさなくても電力需要を満たせる", "title": "China’s energy transition strategy favoring both coal and renewables: Economic risks and global implications", "url": "https://doi.org/10.1073/pnas.2531538123", "authors": "Xiaoli Zhang ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-16", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "why": "中国の石炭火力の新設を国内外の社会・経済・気候・地政学の影響から分析する統合的な枠組みを作り、2030年までに再生可能エネルギーを3倍にすれば（中国は達成の見込み）、発電構成と蓄電の計画と合わせて全ての電力需要シナリオを満たし、石炭火力の追加は不要だと示した。"}, {"id": "jn12", "rank": 12, "field": "経営学", "headline": "複数の政府機関との研究開発契約が市場の学習に", "title": "Government‐funded experimentation: How startups use R&D contracts to resolve uncertainty", "url": "https://doi.org/10.1002/sej.70063", "authors": "Larisa Cioaca", "venue": "Strategic Entrepreneurship Journal", "date": "2026-11-16", "sjr": 3.821, "citescore": 11.4, "citescore_year": "2025", "why": "2001〜2018年の米政府の研究開発契約320億ドル分でハイテク新興企業を調べ、契約額（技術の実験）よりも契約した機関の数（市場の実験）がその後の雇用・売上・買収と正に関連することを示し、複数の政府の買い手から市場の機会を学ぶ過程と整合的だとする。"}, {"id": "jn13", "rank": 13, "field": "組織行動・心理的安全性", "headline": "女性リーダーはDXで技術と社会の統合を実践", "title": "Digital Transformation Through a Socio‐Technical Systems Lens: Women Leaders' Approache     "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
