を横軸に取った効果の変化で行う。良しとする基準は、濃度が低いときの効果と高いときの効果の差が、職種ごとの競争の変化で説明できるかどうかである（抄録）。", "p5": "抄録の報告では、助言は限られた割合の求職者に提供されたとき就業と所得を有意に高める。処理の濃度が上がるにつれてこの効果は小さくなり、最終的に消える。この低下は処理された求職者の間の負の波及によって生じており、求職者が探索先を移した職種での混雑の増加と整合する。処理されていない求職者への波及は一様ではなく、助言が地域労働市場の職種ごとの競争をどう変えるかに依存する（抄録）。", "p6": "著者が認める限界は抄録に明示されていない。デンマークの公的職業紹介という制度に固有の設定で、労働市場の流動性や求人情報の整備度が異なる国に移せるかは残る疑問である。", "fun": "「どの職種に応募すればよいか」を教えてくれるサービスは、使った人の就職を助ける。ところが全員に同じ助言をすると効果が消える。みんなが同じ有望な職種に向かうので、そこが混雑して競争が激しくなるからだ。少数に配れば効くのに、広く配ると効かないという性質は、個人を見る実験では絶対に見えない。この研究は地域ごとに配る割合を変えることで、政策の規模そのものが効果を決めるという構図を取り出した。", "unverified": "実験の標本規模と期間、処理濃度の水準、効果の大きさの数値。本文が入手できず確認できなかった。"}}, {"id": "jn02", "rank": 2, "field": "経営学", "headline": "1.5ユーロの謝礼が献血行動を動かす", "title": "The Effect of Small Quasi-Cash Rewards on Prosocial Behavior: The Case of Voluntary Plasma Donations", "url": "https://doi.org/10.1287/mnsc.2024.08081", "authors": "Stijn Bruers ほか", "venue": "Management Science", "date": "2026-10-12", "sjr": 6.428, "citescore": 11.8, "citescore_year": "2025", "apa": "Bruers, S., Ooghe, E., & Schokkaert, E. (2026). The Effect of Small Quasi-Cash Rewards on Prosocial Behavior: The Case of Voluntary Plasma Donations. Management Science. https://doi.org/10.1287/mnsc.2024.08081", "why": "ベルギー赤十字の12拠点で長期のランダム化実験を行い、小額のクーポンでも血漿提供が7.1%増え、報酬期間が終わると効果が即座に消え、同時に血液提供が3.3%減る代替効果まで測った。少額誘因の効果・持続・代替を一度に識別した点が珍しい。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、Crossrefに登録された抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "p1": "少額の謝礼が利他的な行動を動かすか、その効果が続くか、他の利他的な行動を押しのけるか、既存の謝礼を知らせるだけで行動が変わるかを、一度の実験で分けて測れるようになった（抄録）。", "p2": "利他的な行動を効果的に促す方法について、4つの問いが未解決だった。少額の報酬でも動機づけられるか、短期の効果と長期の行動調整がどう違うか、誘因が他の利他的活動からの代替を招くか、既存の報酬についての念押しが行動に意味のある影響を与えるか、である（抄録）。", "p3": "ベルギー赤十字フランダースの12の献血センターで長期のランダム化フィールド実験を行う。もともと献血者は全血1回につきお礼のクーポン1枚（1.5ユーロ相当）、血漿1回につき2枚を受け取る。この既存の制度を対象に、(1)既存の報酬を知らせる情報期間と、(2)血漿提供者にクーポンを1枚追加する報酬期間を設ける（抄録）。", "p4": "評価は、血漿提供の件数の変化（情報期間9か月、報酬期間6か月）、報酬期間終了後の効果の持続、そして同じ人の全血提供への代替効果で行う。補助的に、調査による機構の検討を加える（抄録）。", "p5": "抄録の報告では、既存の報酬を知らせるだけで9か月の情報期間に血漿提供が4.6%増えたが、念押しを繰り返すと効果は薄れた。クーポン1枚の追加は6か月の報酬期間にさらに7.1%の増加をもたらし、この効果は報酬期間中に拡大したが、期間終了後ただちに消えた。同時に代替効果も記録され、血漿の報酬は全血の提供を3.3%減らした。調査の証拠は、少額の報酬が需要の増加の合図として、あるいは返報を引き出す贈り物として働いている可能性を示し、著者はこの知見がボランティアの意思決定にも広く及びうると述べる（抄録）。", "p6": "著者が認める限界は抄録に明示されていない。献血という特定の利他的行動であり、報酬が1.5ユーロ相当という小さな額に限られる点、代替効果が血漿と全血という近い行動の間で測られている点は、他の文脈への一般化で考慮が必要である。", "fun": "「お金を出すと人の善意がしぼむ」という話はよく聞く。この実験は逆で、1.5ユーロ分のクーポンを1枚増やすだけで血漿の提供が7%増えた。しかも報酬をやめると効果はすぐ消える。さらに面白いのは、血漿が増えたぶん全血が3.3%減ったこと。善意の総量は増えず、向かう先が変わっただけだったかもしれない。おまけに「もともと謝礼がありますよ」と知らせるだけでも4.6%増えた。行動を変えたのは金額ではなく、気づきだった可能性がある。", "unverified": "標本の献血者数、実験の暦期間、調査の設計と回答数。本文が入手できず確認できなかった。"}}, {"id": "jn03", "rank": 3, "field": "組織行動・心理的安全性", "headline": "厳しい愛情がサーバント型を補う", "title": "The moderating role of tough love on relations between servant leadership and follower outcomes", "url": "https://doi.org/10.1177/00187267261490086", "authors": "Robert C. Liden ほか", "venue": "Human Relations", "date": "2026-10-12", "sjr": 4.141, "citescore": 16.1, "citescore_year": "2025", "apa": "Liden, R. C., Zhong, M., De Schutter, L., & Stouten, J. (2026). The moderating role of tough love on relations between servant leadership and follower outcomes. Human Relations. https://doi.org/10.1177/00187267261490086", "why": "サーバント・リーダーシップは部下を甘やかすという批判に対し、前向きな口調で明確な改善意図をもって伝える批判的フィードバックを「タフラブ」として概念化した。3時点の多source データで、タフラブが多いほど業績と組織市民行動への効果が強まると示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、Crossrefに登録された抄録を読んだ", "preprint": false, "p1": "サーバント・リーダーシップが部下を甘やかすという批判に対し、批判的なフィードバックの出し方（タフラブ）が効果を強めることを示せるようになった（抄録）。", "p2": "サーバント・リーダーシップは部下に肯定的な働きかけをするだけで、結果として部下を安心させすぎ組織の業績を落とすという批判がある。この批判は、部下の潜在能力を引き出そうとするサーバント型のリーダーが批判的なフィードバックも与えることを見落としている（抄録）。", "p3": "「タフラブ（tough love）」を、前向きな口調と、相手の不足を克服させようという明確な意図をもって伝えられる批判として概念化する。仮説は、サーバント・リーダーシップと部下の業績などの関係が、タフラブを多く与えるほど強まるというもの。機構としては、タフラブが部下に歓迎され、リーダーとの関係を強固にし、自己拡張（self-expansion）を通じて成長を助け、その成長が行動と態度に跳ね返ると論じる（抄録）。", "p4": "データは3時点にわたる多情報源のフィールドデータ。評価では、肯定的・否定的なフィードバックと、従属変数の事前の水準を統制したうえで、タフラブの調整効果を検定する。従属変数は役割内業績、組織市民行動、創造性、離職意図である（抄録）。", "p5": "抄録の報告では、タフラブはサーバント・リーダーシップと役割内業績の関係、および組織市民行動との関係を調整した。一方で創造性と離職意図については結果が混在した（mixed results）。つまり、批判的なフィードバックの添え方が、サーバント型の効き方を左右するが、その効果はすべての成果に一様ではない（抄録）。", "p6": "著者が認める限界は抄録に明示されていない。創造性と離職意図で結果が混在した理由は抄録の範囲では分からず、タフラブの測定が部下の知覚によるものかリーダーの自己報告かも確認できなかった。", "fun": "「部下に奉仕するリーダー」という考え方は、優しすぎて甘やかしになるという批判を受けてきた。この研究は、優しさと厳しさを対立させず、「前向きな口調で、相手を伸ばす意図を明確にした批判」を一つの概念として立てた。すると、サーバント型のリーダーシップはこの厳しさを伴ったときに効果が強まった。ただし業績と組織市民行動では効いたのに、創造性と離職意図では結果が揺れる。同じ厳しさが、何を伸ばすかで働き方が違うらしい。", "unverified": "標本規模と対象組織、タフラブの測定尺度、調整効果の係数。本文が入手できず確認できなかった。"}}, {"id": "jn04", "rank": 4, "field": "組織行動・心理的安全性", "headline": "死の危険が続く職場で協働を保つ", "title": "Intersubjective resilience: Sustaining collective life under persistent life-and-death risk", "url": "https://doi.org/10.1177/00187267261491523", "authors": "Marco Tulio Fundão Zanini ほか", "venue": "Human Relations", "date": "2026-10-12", "sjr": 4.141, "citescore": 16.1, "citescore_year": "2025", "apa": "Zanini, M. T. F., Cunha, M. P. e., Torres, M. M., & Migueles, C. P. (2026). Intersubjective resilience: Sustaining collective life under persistent life-and-death risk. Human Relations. https://doi.org/10.1177/00187267261491523", "why": "生死に関わる危険が常態の警察特殊部隊2部隊の民族誌から、恐れを消すのでも矛盾を解くのでもなく、それらを共同行為に組み替え続ける3つの機構を抽出した。安定の回復を前提としないレジリエンス概念を提示している。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、Crossrefに登録された抄録を読んだ", "preprint": false, "p1": "生死に関わる危険が常態である職場で、組織がどのように協働を保ち続けるのかを、恐れを消すのでも矛盾を解くのでもない3つの機構として記述できるようになった（抄録）。", "p2": "レジリエンスの研究は、安定を取り戻すこと、あるいは混乱から回復することを前提にしてきた。しかし危険が例外ではなく仕事の恒常的な条件である場合、回復すべき安定状態そのものが存在しない（抄録）。", "p3": "着想は、レジリエンスを個人の特性や状態の回復ではなく、集団的な達成として捉えることである。恐れ・矛盾・混乱を、協調した行為に繰り返し組み替えていく能力を「相互主観的レジリエンス（intersubjective resilience）」と名づける（抄録）。", "p4": "方法は、継続的に生死の危険下で活動する2つの精鋭警察部隊の民族誌的研究である（抄録）。評価は、危険が日常の条件である場で一貫した協調行為がどう維持されるかを説明できる機構を抽出できたかという点で行われる。", "p5": "抄録の報告では、相互に関連する3つの組織化の機構が特定された。(1)希求的な規律（aspirational discipline）：個人の努力を共有された目的に合わせることで、脆弱さを集団的な道義的義務に変える。(2)逆説の結び目（paradoxical knotting）：攻撃性と抑制、自律と服従といった持続する緊張を、解消せずにそのまま通して行為できるようにする。(3)日常の実演（routine enactment）：訓練・省察・実務という反復的な実践によって協調行為を取り戻す。これらが合わさって、危険が日常の条件であるときに一貫した協調行為が保たれる（抄録）。", "p6": "著者が認める限界は抄録に明示されていない。2つの精鋭部隊という極端な事例であり、通常の職場の心理的安全性の議論にどう接続するかは残る疑問である。", "fun": "「立ち直る力」と訳されるレジリエンスは、いったん倒れてから起き上がる話として語られがちだ。ところが危険が毎日ある職場では、倒れる前の安定という状態がそもそもない。この研究が見つけたのは、恐れを打ち消すのではなく、恐れを含んだまま動ける形に組み替え続けるという働き方だった。攻撃性と抑制のように両立しない要求も、どちらかに決めずに「結び目」のまま抱えて動く。解決しないことが解決になっている。", "unverified": "2部隊の国と規模、観察期間、データ収集の方法。本文が入手できず確認できなかった。"}}, {"id": "jn05", "rank": 5, "field": "経営学", "headline": "大きなサービス系ほど規模の利得が増す", "title": "Convexity of Inverse Blocking Curves in Loss Systems", "url": "https://doi.org/10.1287/opre.2026.2623", "authors": "Benjamin Legros", "venue": "Operations Research", "date": "2026-10-12", "sjr": 3.759, "citescore": 6.4, "citescore_year": "2025", "apa": "Legros, B. (2026). Convexity of Inverse Blocking Curves in Loss Systems. Operations Research. https://doi.org/10.1287/opre.2026.2623", "why": "呼損系で、同じ呼損率を保ったまま受け入れられる需要が、サーバ数の増加関数かつ大域的に凸になることを厳密に証明した。系が大きくなるほどサーバ1台あたりの追加需要が増えるという、資源プーリングの数学的な裏付けになる。", "explain": {"basis": "抄録", "basis_note": "出版社（Operations Research）の本文は入手できず、Semantic Scholar経由の抄録（論文冒頭の要旨）を読んだ", "preprint": false, "p1": "呼損系で、同じ呼損率を保ったまま受け入れられる需要の最大値がサーバ数の増加かつ大域的に凸な関数であることを、厳密に証明できるようになった（抄録）。", "p2": "サービス系の規模を大きくすると規模の経済が働くことは経験的に知られるが、「同じ呼損目標を保ったまま、どれだけ需要を増やせるか」という問いに対する厳密な数学的基礎が整っていなかった（抄録）。", "p3": "着想は、呼損曲線を逆に見ることである。ふつうは需要とサーバ数から呼損率を求めるが、呼損率を目標として固定し、サーバ数に対して支えられる最大需要を関数として見る。この逆呼損曲線（inverse blocking curve）の凸性を示す（抄録）。", "p4": "対象は古典的なErlang-Bの呼損モデルで、有限の待ち合い室を持つ系にも拡張される。良しとする基準は、サーバ数に関する単調増加性と大域的な凸性を、近似ではなく厳密に示せることである（抄録）。", "p5": "抄録の報告では、支えられる最大需要はサーバ数の増加関数であり、かつ大域的に凸である。実務的には、系が大きくなるほどサーバ1台の追加が支えられる追加需要が次々に大きくなることを意味する。同じことを裏返せば、追加の需要を受け入れるのに必要な余分な容量は、系が大きくなるほど小さくなる。著者はこれを、容量に制約のあるサービスにおける資源プーリングの厳密な数学的基礎と位置づけ、通信、医療、緊急対応などのサービス運営に関わりうるとする（抄録）。", "p6": "著者が認める限界は抄録に明示されていない。呼損系（待たずに拒否される系）という前提に依存するため、待ち行列が長く伸びる系や到着が非ポアソンの場合にどこまで及ぶかは残る疑問である。", "fun": "窓口を1つ増やしたときに受け入れられるお客の増加分は、小さな店より大きな店のほうが大きい。経験的には知られていたこの「規模の利得」を、この論文は数学的に厳密な形（凸性）で証明した。凸であるというのは、増やすほど増え方が加速するという意味である。だから病院や消防を統合すると、単純な足し算以上の余力が生まれる。逆に小さく分けると、同じ安心を保つために余分な設備が必要になる。", "unverified": "証明の手法、有限待ち合い室への拡張の条件。本文が入手できず確認できなかった。"}}, {"id": "jn06", "rank": 6, "field": "因果推論", "headline": "警告型の啓発は通報を増やすが犯罪は減らさない", "title": "Do targeted, place‐based educational campaigns influence citizen engagement and violent crime? A quasi‐experiment of the alert conscience technique of situational crime prevention", "url": "https://doi.org/10.1111/1745-9133.70045", "authors": "Eric L. Piza ほか", "venue": "Criminology and Public Policy", "date": "2026-10-12", "sjr": 1.821, "citescore": 7.6, "citescore_year": "2025", "apa": "Piza, E. L., Harkins, C., & Hazen, K. P. (2026). Do targeted, place‐based educational campaigns influence citizen engagement and violent crime? A quasi‐experiment of the alert conscience technique of situational crime prevention. Criminology & Public Policy. https://doi.org/10.1111/1745-9133.70045", "why": "ジオフェンシング広告と路面の洗い出し文字という2つの啓発を、時差のある差分の差分法で評価した。311通報は有意に増えたが暴力犯罪は減らず、個別のキャンペーンでは有意な効果が出なかった。状況的犯罪予防のうち意識喚起型の限界を示した。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、Crossrefに登録された抄録を読んだ。抄録に設計と結果が詳しく含まれている", "preprint": false, "p1": "場所を狙って打つ啓発キャンペーンが、市民の関与と暴力犯罪のどちらにどれだけ効くかを、時差のある差分の差分法で分けて測れるようになった（抄録）。", "p2": "犯罪予防の啓発キャンペーンは人気があるのに、状況的犯罪予防（SCP）の他の技法に比べて評価されることが少ない。そのため「良心に警告する（alert conscience）」技法の知識基盤は、対象の強化や自然監視といった技法より未発達である（抄録）。", "p3": "対象は2021年から2024年にメクレンバーグ郡（ノースカロライナ州）公衆衛生局の暴力予防室が実施した2つのキャンペーンである。1つはジオフェンシング（仮想の地理的境界を設定して境界内の携帯端末に広告を届ける手法）、もう1つはクリーン・グラフィティ（反暴力のメッセージを歩道の汚れを高圧洗浄で落として描く手法）である（抄録）。", "p4": "推定は時差のある差分の差分法（staggered difference-in-differences）で、交絡を生みうる観察された共変量で条件づける。結果変数は市民の関与の代理としての311番通報（行政への非緊急の通報）と、暴力犯罪の発生件数である。評価は、キャンペーン全体への曝露と、2つのキャンペーンを別々に見た場合の両方で行う（抄録）。", "p5": "抄録の報告では、キャンペーン全体への曝露は311番通報の総数と要望関連の通報の統計的に有意な増加と結びついた。一方、2つのキャンペーンを別々に評価すると、どちらも有意な効果を生まなかった。暴力犯罪については、どのモデルでも全体的な効果は見られなかった。政策含意として著者は、良心に警告する技法が、物理的な環境を直接変えて犯罪の機会を減らす接近法よりも犯罪減少には効きにくい可能性があるとし、犯罪にも影響を与えるには他の予防技法と組み合わせる必要があるかもしれないと述べる（抄録）。", "p6": "著者が認める限界は抄録に明示されていない。2つのキャンペーンを個別に見ると有意でなく、合わせたときだけ有意になるという結果の解釈には注意が必要である。また311番通報を市民の関与の代理とすることの妥当性も検討の余地がある。", "fun": "「暴力はやめよう」という広告を、スマホの位置情報で特定の地域に配り、歩道にも高圧洗浄機でメッセージを描く。ずいぶん工夫された取り組みだが、結果は半分だった。市民からの行政への通報は増えたのに、暴力犯罪は減らなかった。しかも2つのキャンペーンを別々に評価すると、どちらも有意ではない。人の意識に訴える施策は、関心を呼ぶところまでは届いても、行動が起きる現場の条件を変えないと効かないらしい。", "unverified": "キャンペーンの規模と対象地域の数、311番通報の増加量、分析の単位と期間。本文が入手できず確認できなかった。"}}, {"id": "jn07", "rank": 7, "field": "機械学習", "headline": "LLMが勾配なし最適化の表現を作る", "title": "LLMs as Representation Generators for Gradient‐Free Scientific Optimization: A Case Study in Battery Fast Charging", "url": "https://doi.org/10.1002/advs.78012", "authors": "Ge Lei ほか", "venue": "Advanced Science", "date": "2026-10-12", "sjr": 3.288, "citescore": 18.1, "citescore_year": "2025", "apa": "Lei, G., Brosa Planella, F., Baird, S. G., & Cooper, S. J. (2026). LLMs as Representation Generators for Gradient‐Free Scientific Optimization: A Case Study in Battery Fast Charging. Advanced Science. https://doi.org/10.1002/advs.78012", "why": "評価が遅く微分不可能な科学最適化で、LLMに探索空間の表現そのものを生成させる発想を示し、電池の急速充電を題材に検証した。勾配を使えない設計問題にLLMをどう組み込むかの具体例になる。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、Crossrefに登録された抄録を読んだ", "preprint": false, "p1": "評価が遅く微分できない科学の最適化問題で、LLMに探索空間の表現そのものを作らせるという接近法を示せるようになった（抄録）。", "p2": "科学の最適化問題は、評価に時間と費用がかかり、しかも微分できないことが多い。そのため豊かな設計空間を効率よく探ることが難しく、勾配を使う方法が使えない（抄録）。", "p3": "着想は、LLMを探索の実行役ではなく表現の生成役として使うことである。勾配を使わない（gradient-free）最適化において、LLMが候補となる設計の表現を生成し、その表現の上で探索する。入力は設計問題の記述、出力は評価にかける候補の表現である（抄録）。", "p4": "事例研究として、電池の急速充電（battery fast charging）の設計問題を扱う（抄録）。評価の基準は抄録に詳しく示されていないため未確認。", "p5": "抄録は、このような設定でLLMを表現の生成器として用いる接近法が有効であることを示したと述べる。具体的な改善幅や比較対象、収束の速さは抄録に数値として示されていないため未確認。", "p6": "著者が認める限界は抄録に明示されていない。1つの事例研究に基づくため他の設計問題への一般化、およびLLMが生成する表現の妥当性をどう検証するかは残る疑問である。", "fun": "最適化の問題を解くとき、ふつうは「どの変数をどう動かすか」という設計空間が先に決まっていて、その中を探す。この研究が面白いのは、その設計空間の書き方自体をLLMに作らせたところだ。電池の急速充電のように、1回試すのに時間がかかり、微分もできない問題では、探し方より「何を探すか」の設定がものを言う。人間が長年の勘で決めていた部分に言語モデルを入れる、という発想の置き換えである。", "unverified": "比較対象の手法、改善幅の数値、生成された表現の具体例。本文が入手できず確認できなかった。"}}, {"id": "jn08", "rank": 8, "field": "統計学", "headline": "検定を減らし推定で理論を鋭くする", "title": "Test Less, Estimate More: Apply Estimation Thinking to Enhance Theoretical Precision in Educational Leadership Research", "url": "https://doi.org/10.1177/0013161x261490940", "authors": "Yinying Helen Wang", "venue": "Educational Administration Quarterly", "date": "2026-10-12", "sjr": 1.907, "citescore": 6.9, "citescore_year": "2025", "apa": "Wang, Y. H. (2026). Test Less, Estimate More: Apply Estimation Thinking to Enhance Theoretical Precision in Educational Leadership Research. Educational Administration Quarterly. https://doi.org/10.1177/0013161x261490940", "why": "教育リーダーシップ研究で、有意性検定中心の実践から効果量の推定へ重心を移す「推定思考」を、方法論の立場と理論化の論理の両方として提案した。分野の標準的な報告様式の見直しにつながる主張である。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、Crossrefに登録された抄録を読んだ", "preprint": false, "p1": "教育リーダーシップ研究の実践と理論化の両方を、有意性検定から効果量の推定へ重心を移すものとして位置づけられるようになった（抄録）。", "p2": "分野の報告慣行が有意性検定に偏ると、効果の大きさや方向についての理論の精度が上がらない。方法論上の問題と理論化の論理が切り離されて扱われてきた（抄録）。", "p3": "「推定思考（estimation thinking）」を、方法論上の立場と理論化の論理の両方として提案する。抄録によれば、推定思考は推論上の接近法として定義され、理論の精度を高めることを目的とする。つまり「差があるかどうか」を問うのではなく「どれだけあるか」を問う姿勢を、研究設計と理論の立て方の双方に通す（抄録）。", "p4": "これは方法論の概念論文であり、新しいデータによる検証ではない。評価は、推定思考が教育リーダーシップ研究の理論的な精度を高めうることを論証できたかという点で行われる（抄録）。", "p5": "抄録は、推定思考を方法論上の立場と理論化の論理の両方として位置づけ、理論的な精度を高めることを目指すと述べる。具体的な事例の再分析や、検定中心の報告がどの程度の誤りを生んでいるかの定量的な評価は抄録に示されていないため未確認。", "p6": "概念論文であるため経験的な検証を含まない点が最大の制約である。著者が認める限界は抄録に明示されていない。", "fun": "「差があるかどうか」ではなく「どれだけ差があるか」を問うべきだ、という主張は統計の世界で繰り返されてきた。この論文の目新しさは、それを単なる報告の作法ではなく、理論の作り方の問題として扱ったところである。効果の大きさを予測する理論は、有無を予測する理論より具体的で、外れたときに修正しやすい。測り方を変えると、考え方そのものが変わるという話になっている。", "unverified": "推定思考の具体的な定義と適用手順、既存研究の再分析の有無。本文が入手できず確認できなかった。"}}, {"id": "jn09", "rank": 9, "field": "統計学", "headline": "1993年の警告は今も当たっている", "title": "Issues in the Analysis of Data: A Replication of Zuckerman et al. (1993) and Extension to Contemporary Developmental Research", "url": "https://doi.org/10.1177/01650254261491094", "authors": "Jamie DeCoster ほか", "venue": "International Journal of Behavioral Development", "date": "2026-10-12", "sjr": 1.495, "citescore": 6.8, "citescore_year": "2025", "apa": "DeCoster, J., Beliveau, L., Iselin, A.-M., & Gallucci, M. (2026). Issues in the Analysis of Data: A Replication of Zuckerman et al. (1993) and Extension to Contemporary Developmental Research. International Journal of Behavioral Development. https://doi.org/10.1177/01650254261491094", "why": "Zuckermanら(1993)の統計的解釈に関する研究を追試し、現代の発達研究に拡張した。統計的証拠の解釈の誤りが長年にわたり再生産されていることを示しており、分野全体の報告慣行に関わる。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、Crossrefに登録された抄録を読んだ", "preprint": false, "p1": "統計的証拠の解釈についてのZuckermanら（1993）の警告が現代の発達研究にも当てはまることを、追試と拡張で確かめられるようになった（抄録）。", "p2": "発達心理学は、変化・機構・文脈についての結論を統計的証拠に頼って導く。しかしその結論の妥当性は、研究者がその証拠を正しく解釈しているかどうかに依存する（抄録）。", "p3": "Zuckermanら（1993）が指摘した、データ分析における統計的証拠の解釈の問題を追試し、現代の発達研究へ拡張する。追試の対象は、統計的な結果の読み取り方そのものである（抄録）。", "p4": "評価は、1993年の指摘が現代の研究でも再現するか、そして当時とは異なる分析手法が普及した後でも同じ誤りが残っているかという点で行われる（抄録）。具体的な標本や検定の設計は抄録に示されていないため未確認。", "p5": "抄録は、発達心理学の結論の妥当性が統計的証拠の解釈に依存することを指摘し、Zuckermanら（1993）の追試と現代研究への拡張を行ったと述べる。追試の具体的な結果（どの誤りがどの程度残っていたか）は抄録に数値として示されていないため未確認。", "p6": "著者が認める限界は抄録に明示されていない。1993年の原論文の設定をどこまで忠実に再現したか、現代研究への拡張がどの範囲を覆うかは残る疑問である。", "fun": "かなり以前に「統計の結果をこう読み間違えています」と指摘された論文を、もう一度やってみる。すると同じ問題がまだ残っていた、というのがこの研究である。手法はどんどん新しくなるのに、読み取り方の癖は変わらない。追試というと「あの発見は本当か」を確かめる作業と思われがちだが、「あの警告は今も有効か」を確かめる追試もありうる。分野の自己点検として地味だが効く。", "unverified": "追試の標本と手続き、どの解釈の誤りがどれだけ残っていたかの数値。本文が入手できず確認できなかった。"}}, {"id": "jn10", "rank": 10, "field": "教育", "headline": "生成AIとの協働は手順の型に表れる", "title": "Human–AI collaborative patterns in GenAI-supported instructional design among pre-service teachers: an analysis of interaction sequences and cognitive load", "url": "https://doi.org/10.1186/s41239-026-00628-3", "authors": "Xu Fang ほか", "venue": "International Journal of Educational Technology in Higher Education", "date": "2026-10-11", "sjr": 7.947, "citescore": 48.4, "citescore_year": "2025", "apa": "Fang, X., Feng, J., Yan, B., & Zhou, B. (2026). Human–AI collaborative patterns in GenAI-supported instructional design among pre-service teachers: an analysis of interaction sequences and cognitive load. International Journal of Educational Technology in Higher Education, 23(1). https://doi.org/10.1186/s41239-026-00628-3", "why": "教員志望者の授業設計を相互作用の系列として分析し、人とAIの協働パターンと認知負荷の関係をミクロな過程として記述した。生成AIを教育設計に組み込む際の、成果物ではなく過程の評価方法を示している。", "explain": {"basis": "本文", "basis_note": "出版社（Springer、オープンアクセス）のPDF本文を読んだ。抄録、方法と結果の記述、限界（Limitations）、教育上の提言の節を参照した", "preprint": false, "p1": "生成AIと協働して授業設計をするとき、成果の良し悪しが行動の「並び方」の違いとして現れることを、系列分析で取り出せるようになった（抄録、Limitations）。", "p2": "生成AIが授業設計を変えつつあることは分かっていても、人とAIの協働がミクロな過程としてどう進むのかは記述されていなかった。成果物を見るだけでは、どの進め方が効率的なのかが分からない（抄録）。", "p3": "着想は、協働を行動の系列として見ることである。参加者のAIとのやりとりを行動の種類（計画、意思決定、生成、評価、修正など）に符号化し、ずれ系列分析（lag sequential analysis）でどの行動の後にどの行動が来やすいかを群間で比べる。同時に多次元の認知的負荷を測る。認知的負荷はNASA-TLXから、精神的要求・時間的要求・努力・苛立ちの4次元を選んで適用した（抄録、Limitations）。", "p4": "対象は教員志望者67名で、AIの支援を受けて授業設計の課題を行う。理論に基づく授業案の質の評価基準表（ルーブリック）を作り、質の得点の中位数で高品質群と低品質群に分ける。評価者間のICCは0.853である。さらに2つ目の課題で標本内の追試を行い、結果の一貫性を確かめる（抄録、Limitations）。", "p5": "高品質群は評価と修正の双方向の循環と、修正の自己ループを有意に示し、「計画→意思決定→生成→評価→修正→再評価」という明確な前進的な系列が行動の流れに現れた。低品質群は非効率な循環にはまり、行動の論理が断片化していた。効果量は、評価-修正の循環でr=0.606、精神的要求でr=0.647と大きい。認知的負荷については、高品質群の主観的な努力は低品質群より大きくなかったが、著者はこの無効果の所見を検出力の制約を踏まえて慎重に読むよう注意している。2つ目の課題での追試でも中核の所見は一貫した（抄録）。", "p6": "著者は、授業案の質を連続変数ではなく2群に分けたため群内のばらつきと境界付近の差が捉えられないこと、ルーブリックが本研究の文脈のために作られ、評価者間一致（ICC 0.853）は得られているが構成概念妥当性と基準関連妥当性は十分に検討されておらず他の標本・課題・教育環境で独立に検証されていないこと、認知的負荷の測定がNASA-TLXの6次元のうち4次元に絞った改変版であることを限界として挙げる（Limitations）。", "fun": "生成AIを使って授業案を作らせると、出来のよい人と悪い人が出る。この研究が見たのは、作業の順番だった。よい人は「作らせて、評価して、直して、また評価する」という行き来を繰り返す。悪い人は同じところを無駄に回っている。興味深いのは、よい人のほうが手間がかかっていそうなのに、主観的な努力感は高くなかったこと（ただし検出力の制約あり）。段取りが整うと、深く考えても疲れにくいのかもしれない。", "unverified": "行動符号化のカテゴリの完全な一覧、ずれ系列分析の調整残差の値、群ごとの認知的負荷の平均値は、本文の表から読み取れなかった。"}}, {"id": "jn11", "rank": 11, "field": "組織行動・心理的安全性", "headline": "希望の労働時間は誰が得られるのか", "title": "Who Gets Their Preferred Work Hours? Gendered Mismatches in Same‐ and Different‐Sex Couples", "url": "https://doi.org/10.1111/gwao.70272", "authors": "Tabea Naujoks ほか", "venue": "Gender, Work and Organization", "date": "2026-10-12", "sjr": 1.769, "citescore": 7.4, "citescore_year": "2025", "apa": "Naujoks, T., & Helgøy, A. (2026). Who Gets Their Preferred Work Hours? Gendered Mismatches in Same‐ and Different‐Sex Couples. Gender, Work & Organization. https://doi.org/10.1111/gwao.70272", "why": "希望と実際の労働時間のずれを、同性カップルと異性カップルを比べて分析した。性別による分業がカップルの構成でどう変わるかを識別する設計で、労働時間のミスマッチ研究に新しい比較軸を持ち込んだ。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、Crossrefに登録された抄録を読んだ", "preprint": false, "p1": "希望する労働時間と実際の労働時間のずれが誰に生じるかを、同性カップルと異性カップルの比較によって、性別そのものの効果と分業の効果に分けて見られるようになった（抄録）。", "p2": "希望と実際の労働時間のずれは広く見られ、精神的健康と経済的な安定に影響し、仕事と生活の葛藤の指標にもなりうる。しかし異性カップルだけを見ていると、性別による差が、性別そのものの効果なのか、カップル内の分業の慣行なのかを区別できない（抄録）。", "p3": "着想は、同性カップルを比較の軸に入れることである。異性カップルで観察される労働時間のミスマッチの性差が、性別に固有のものなら同性カップルでは現れないはずで、分業の構造によるものなら同性カップルでも相対的な位置によって現れる。この対比で2つの説明を切り分ける（抄録）。", "p4": "評価は、同性カップルと異性カップルにおける希望労働時間の達成度の差で行う。良しとする基準は、性別のパターンがカップルの構成によって変わるかどうかである（抄録）。", "p5": "抄録は、希望と実際の労働時間のずれが広範に見られることと、それが精神的健康・経済的安定に影響し仕事と生活の葛藤を示しうることを述べ、同性・異性カップルにおけるジェンダー化されたミスマッチを検討したとする。どちらのカップルでどの方向のずれが大きかったかという具体的な結果は、抄録に示されていないため未確認。", "p6": "著者が認める限界は抄録に明示されていない。同性カップルは標本が小さくなりがちで、推定の精度や選択の問題が生じうる点は残る疑問である。", "fun": "「女性は働く時間を減らしたいのに減らせない」といった話は、男女の違いとして語られやすい。しかし同性のカップルを比べると、性別そのものの影響と、2人のうちどちらが主に稼ぐかという役割の影響を切り離せる。比較の対象を増やすことで、見えていた差の正体が変わる。使えるデータが増えたからできるようになった問いの立て方であり、研究設計の工夫として学ぶところが多い。", "unverified": "データの出所と標本規模、ミスマッチの定義、推定された差の大きさ。本文が入手できず確認できなかった。"}}, {"id": "jn12", "rank": 12, "field": "経済学", "headline": "雇用維持給付は経営層にも渡った", "title": "Elite welfare and the good fortune of just being there", "url": "https://doi.org/10.1017/s004727942610169x", "authors": "Gary Jonas Fooks ほか", "venue": "Journal of Social Policy", "date": "2026-10-12", "sjr": 1.335, "citescore": 7.0, "citescore_year": "2025", "apa": "Fooks, G. J., Mullan, K., Mills, T., Yates, D., & Willmott, J. (2026). Elite welfare and the good fortune of just being there. Journal of Social Policy, 1–19. https://doi.org/10.1017/s004727942610169x", "why": "英国の大企業の上級役員が新型コロナの雇用維持スキームから財務的に利益を得た経路を明らかにし、その理由を説明しようとしている。危機対応の給付が誰に帰着するかという分配の論点を実証で突いている。", "explain": {"basis": "本文", "basis_note": "出版社（Cambridge Core）のHTML本文を読んだ。抄録、CJRS支援データと推定戦略の節、結果（図2、補足表S.3〜S.6の説明）、考察、結論を参照した", "preprint": false, "p1": "公的な雇用維持給付を受けた企業の経営層が、受けなかった企業の経営層より報酬を増やしたかを、差分の差分法で測れるようになった（抄録、結果）。", "p2": "公的支出が誰に帰着するかという問いは、従来の福祉研究が給付の受け手として想定してきた層の外にも及びうる。しかし公的な危機対応が経済的なエリートの所得をどう動かしたかは実証されていなかった（抄録、Discussion）。", "p3": "着想は、政府の政策が作る機会を通じたレントの抽出を「エリート福祉（elite welfare）」として概念化することである。通常の福祉が広い層への比較的小さな給付と優遇から成るのに対し、エリート福祉は特権的な地位にある少数に、政府政策が生んだ機会によるレントの抽出という形で帰着する（抄録）。推定は一般化された差分の差分法で、2020年のみ支援を受けた企業と、2020年と2021年の両年受けた企業を分けて扱う（結果）。", "p4": "データはFTSE 350企業246社（CEOモデル）および198社（CFOモデル）の2019年から2023年の役員報酬。報酬は基本給、年金、業績連動報酬（年次賞与と長期インセンティブ計画の確定分）、福利厚生・その他に分解し、対数を取る。評価は2019–20年から2021–22年への変化についての差分の差分係数と95%信頼区間で行い、効果が翌年以降も続くかを2019–20年から2022–23年の変化で別に検定する（結果）。", "p5": "図2が中心の結果である。2020年のみ支援を受けた企業のCEOでは、総報酬で有意に正の差分の差分効果が出て、構成要素では業績連動報酬で有意に正だった。基本給、年金、福利厚生・その他では有意な効果はない。2020年と2021年の両年支援を受けた企業のCEOでは、どの構成要素にも有意な効果がなかった。CFOについては、2020年のみの支援では有意な効果がなく、両年支援を受けた企業で基本給に有意な正の効果があった。2019–20年から2022–23年への変化では有意な効果が見られず、効果は支援導入直後の1年に限られ、遅れた効果もなかった（結果）。", "p6": "著者は、この設計が報酬委員会での意思決定という取締役会レベルの機構を直接観察していないこと、レント抽出として解釈される部分を定量的に切り出すことには先行研究でも難しさが指摘されていることを述べる（Discussion）。", "fun": "コロナのとき各国は、従業員の雇用を守るために企業へ給付を出した。この研究が調べたのは、その給付を受けた会社の社長の報酬である。受けた会社のCEOは、受けなかった同規模・同業績の会社のCEOより、翌年の業績連動報酬が有意に増えていた。しかも効果は1年だけで、2年支援を受けた企業では出ない。従業員のために配られたお金が、経営層の報酬の数字に別の形で現れる。福祉の研究が見てこなかった方向である。", "unverified": "図2および補足表S.3〜S.6の係数の具体的な数値は、本文の図表から読み取れなかった。表1・表2の記述統計も同様である。"}}, {"id": "jn13", "rank": 13, "field": "経営学", "headline": "生成AIは知識を介して革新に効く", "title": "Generative artificial intelligence and knowledge: smart innovation orchestrators leading Chinese manufacturing firms towards innovation performance", "url": "https://doi.org/10.1108/jmtm-12-2025-1257", "authors": "Muhammad Saeed Ashraf ほか", "venue": "Journal of Manufacturing Technology Management", "date": "2026-10-12", "sjr": 1.566, "citescore": 14.4, "citescore_year": "2025", "apa": "Ashraf, M. S., Usman, M., Sun, H., Abdulmuhsin, A. A., & Rehman, S. U. (2026). Generative artificial intelligence and knowledge: smart innovation orchestrators leading Chinese manufacturing firms towards innovation performance. Journal of Manufacturing Technology Management, 1–25. https://doi.org/10.1108/jmtm-12-2025-1257", "why": "中国の製造業で、生成AIの統合がデジタル革新を介して革新成果につながる経路を検証した。AI導入の効果を直接効果として見ず、知識の媒介として捉える構成が特徴である。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、Crossrefに登録された抄録を読んだ", "preprint": false, "p1": "生成AIの導入が企業の革新成果に効く経路を、デジタル革新と知識を介した媒介として整理できるようになった（抄録）。", "p2": "企業はプロセスと手続きのデジタル化に生成AIを組み込むことで大きく依存するようになっているが、生成AIが革新成果に至る経路は直接効果として扱われがちで、何を介して効くのかが整理されていなかった（抄録）。", "p3": "着想は、生成AIをデジタル革新（digital innovation）の支え手として位置づけ、そこに知識の媒介を置くことである。入力は生成AIの統合の程度、出力は革新成果で、間にデジタル革新と知識に関わる構成概念が入る。「スマートな革新のオーケストレーター」という表現で、AIを実行者ではなく編成役として捉えている（抄録）。", "p4": "対象は中国の製造業企業である。評価の基準は抄録に詳しく示されていないため未確認。", "p5": "抄録は、生成AIがデジタル革新を支え、それが革新成果につながるという経路を扱うと述べる。推定された係数や媒介の寄与の大きさは抄録に数値として示されていないため未確認。", "p6": "著者が認める限界は抄録に明示されていない。中国の製造業という単一の文脈で、生成AIの統合の程度をどう測ったかも抄録の範囲では確認できなかった。", "fun": "「AIを入れたら生産性が上がる」という話は単純すぎる。この研究は、生成AIが直接成果を生むのではなく、まずデジタル化の進み方を変え、その先で革新につながるという段階を置いた。AIを働き手と見るか、仕事の編成を助ける役と見るかで、測るべきものが変わる。中国の製造業という、デジタル化と生成AIの導入が同時に進む現場を対象にしている点も、経路を分けて見るのに向いている。", "unverified": "標本の企業数と調査方法、デジタル革新と知識の構成概念の測定、推定された係数。本文が入手できず確認できなかった。"}}, {"id": "jn14", "rank": 14, "field": "経営学", "headline": "フルーガル革新を支えるのは奉仕型の上司", "title": "Frugal Innovation as an Environmentally Oriented Business Strategy: The Roles of Servant Leadership and Organizational Learning Capability", "url": "https://doi.org/10.1002/bse.71650", "authors": "Paula Gulart Munhoz ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-12", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Munhoz, P. G., Gomes, G., Chiva, R., & Alegre, J. (2026). Frugal Innovation as an Environmentally Oriented Business Strategy: The Roles of Servant Leadership and Organizational Learning Capability. Business Strategy and the Environment. https://doi.org/10.1002/bse.71650", "why": "資源を抑えつつ競争力を保つフルーガル革新を環境戦略として位置づけ、サーバント・リーダーシップと組織学習能力がその形成を左右すると示した。環境戦略とリーダーシップ研究をつなぐ枠組みである。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、Crossrefに登録された抄録を読んだ", "preprint": false, "p1": "資源を抑えつつ競争力を保つフルーガル革新を、環境志向の事業戦略として位置づけ、それを生む組織の条件を示せるようになった（抄録）。", "p2": "カーボンニュートラルへの移行では、環境負荷を下げながら競争力も保つ革新が必要である。しかし既存研究は環境規制など外部の要因に注目しがちで、そうした革新を実際に生み出す組織内部の条件が手薄だった（抄録）。", "p3": "持続可能な事業の観点から、フルーガル革新（frugal innovation、資源の投入を抑えて価値を出す革新）を環境志向の事業戦略として捉える。入力はサーバント・リーダーシップと組織の学習能力、出力はフルーガル革新である。リーダーが部下に奉仕する姿勢と、組織が学び続ける能力が、資源を抑える革新を可能にするという枠組みである（抄録）。", "p4": "評価の基準と標本は抄録に詳しく示されていないため未確認。企業がフルーガル革新を環境志向の事業戦略として発展させる過程を検討するとされている（抄録）。", "p5": "抄録は、サーバント・リーダーシップと組織の学習能力がフルーガル革新の形成に役割を果たすと述べる。推定された係数や調整・媒介の構造は抄録に数値として示されていないため未確認。", "p6": "著者が認める限界は抄録に明示されていない。フルーガル革新をどう測るか、サーバント・リーダーシップの知覚が誰の報告によるものかは抄録の範囲では確認できなかった。", "fun": "「少ない資源で価値を出す」革新は、途上国の工夫として語られてきたが、脱炭素の文脈では先進国の企業にも必要になる。この研究が目を向けたのは、そういう革新がどんな組織から生まれるかという内側の条件である。答えとして挙がったのが、部下に奉仕するリーダーと、学び続ける組織の力。制約を創意に変えるには、上から押しつけるのとは別の仕組みがいるらしい。", "unverified": "標本の企業数と国、フルーガル革新の測定尺度、推定結果の数値。本文が入手できず確認できなかった。"}}, {"id": "jn15", "rank": 15, "field": "経営学", "headline": "機敏さは学習棄却と多様性で実を結ぶ", "title": "How Does Entrepreneurial Alertness Lead to Green Product Innovation in Companies? The Roles of Organizational Unlearning and Diversity Climate", "url": "https://doi.org/10.1002/bse.71648", "authors": "Honghao Hu ほか", "venue": "Business Strategy and the Environment", "date": "2026-10-12", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Hu, H., Wang, Z., & Du, Y. (2026). How Does Entrepreneurial Alertness Lead to Green Product Innovation in Companies? The Roles of Organizational Unlearning and Diversity Climate. Business Strategy and the Environment. https://doi.org/10.1002/bse.71648", "why": "起業家的な機敏さがグリーン製品革新に至る過程で、組織的な学習棄却と多様性風土が条件になると示した。環境制約下の革新研究で、組織内部の条件に焦点を移している。", "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は入手できず、Crossrefに登録された抄録を読んだ", "preprint": false, "p1": "起業家的な機敏さがグリーン製品革新につながる条件を、組織の学習棄却と多様性風土という内部の要因として特定できるようになった（抄録）。", "p2": "グリーン製品革新はカーボンニュートラルへの移行で競争優位を得るうえで重要である。既存研究は環境規制などの役割を広く論じてきたが、企業が機会に気づく能力が実際に革新に結実する条件は手薄だった（抄録）。", "p3": "入力は起業家的な機敏さ（entrepreneurial alertness、機会に気づく能力）、出力はグリーン製品革新である。間に2つの条件を置く。組織的な学習棄却（organizational unlearning、古い知識や慣行を手放すこと）と多様性風土（diversity climate）である。機会に気づいても、古い前提を手放せなければ製品に落ちないという想定である（抄録）。", "p4": "評価の基準と標本は抄録に詳しく示されていないため未確認。カーボンニュートラルへの移行という文脈で、企業がどのようにグリーン製品革新に至るかを検討するとされている（抄録）。", "p5": "抄録は、起業家的な機敏さがグリーン製品革新に至る過程で、組織的な学習棄却と多様性風土が役割を果たすと述べる。推定された係数や、2つの条件が媒介か調整かという構造は抄録に明示されていないため未確認。", "p6": "著者が認める限界は抄録に明示されていない。横断的な調査であれば因果の解釈が難しい点、グリーン製品革新の測定が自己報告かどうかは抄録の範囲では確認できなかった。", "fun": "新しい事業の機会に気づく力は、起業家の資質としてよく挙げられる。しかしこの研究が注目するのは、気づいた後である。古いやり方を手放せない組織では、せっかく気づいた機会が製品にならない。「学ぶ」ことの研究は多いが、「学んだことを捨てる」ことに名前を与えて測るという発想は新しい。多様性風土が条件に挙がっているのも、前提を疑う声が出る環境が必要だという含意になっている。", "unverified": "標本の企業数と国、各構成概念の測定尺度、推定結果の数値。本文が入手できず確認できなかった。"}}, {"id": "jn16", "rank": 16, "field": "因果推論", "headline": "生成AIは移民の情報格差を縮めたか", "title": "Did generative AI narrow the digital divide for immigrants in South Korea? A difference-in-differences study, 2019–2023", "url": "https://doi.org/10.1016/j.tele.2026.102469", "authors": "Nari Yoo ほか", "venue": "Telematics and Informatics", "date": "2026-10-12", "sjr": 2.2, "citescore": 17.3, "citescore_year": "2025", "apa": "Yoo, N., & Jang, S. H. (2026). Did generative AI narrow the digital divide for immigrants in South Korea? A difference-in-differences study, 2019–2023. Telematics and Informatics, 102469. https://doi.org/10.1016/j.tele.2026.102469", "why": "韓国の2019〜2023年のデータで生成AIの普及と移民のデジタル格差の関係を差分の差分法で推定しており、新技術の普及が既存の格差に与える影響を因果で測ろうとしている。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、韓国で生成AIの普及が移民のデジタル格差を縮めたかを、2019年から2023年のデータで差分の差分法により推定した研究だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "新しい技術は格差を広げるのか、縮めるのか。生成AIは言葉の壁を越える道具になりうるので、移民にとっては味方かもしれない。一方で使い方を知る人だけが得をするなら格差は開く。題名が差分の差分法を掲げるのは、「同じ時期に全員が影響を受ける技術」の効果を、影響の受け方の違いで識別しようという設計だろう。", "unverified": "データ、識別戦略、結論のすべて。抄録も本文も入手できなかった。"}}, {"id": "jn17", "rank": 17, "field": "経済学", "headline": "信念の異質性が資産価格と景気を結ぶ", "title": "Heterogeneous beliefs, asset prices, and business cycles", "url": "https://doi.org/10.1016/j.jfineco.2026.104382", "authors": "Saki Bigio ほか", "venue": "Journal of Financial Economics", "date": "2026-10-12", "sjr": 18.748, "citescore": 20.7, "citescore_year": "2025", "apa": "Bigio, S., Silva, D., & Zilberman, E. (2026). Heterogeneous beliefs, asset prices, and business cycles. Journal of Financial Economics, 185, 104382. https://doi.org/10.1016/j.jfineco.2026.104382", "why": "投資家の信念の異質性を通じて資産価格と景気循環を同時に説明する研究で、ファイナンスとマクロの接続点にある。Journal of Financial Economicsに掲載された。", "explain": {"basis": "抄録", "basis_note": "題名検索で見つけたOpenAlexの記録から抄録を取得して読んだ。この記録は同じ論文の別版（NBERワーキングペーパー）と思われる", "preprint": false, "short": true, "p1": "全要素生産性（TFP）の成長についての投資家の信念の異質性が、資産価格と景気変動を同時に動かす機構を示した（抄録）。", "p3": "TFP成長についての信念が異なる投資家がいる完備市場の生産経済を作る。雇用はTFPが判明する前に行われるため危険を伴う（オペレーショナル・レバレッジ）。企業の割引ファクターは投資家の信念の富で重みづけた平均に依存する（抄録）。", "p5": "楽観の波が資産市場に影響し、それが労働の雇用へ浸透して、エクイティ・プレミアム、株式のボラティリティ、労働のボラティリティの3つのパズルを結びつける。信念体系の分類は、外挿的な信念だけが資産価格と労働時間のボラティリティを増幅しリスクの蓄積をもたらすと示す。調査データで規律づけたモデルは、資産価格と景気循環のモーメントに整合する（抄録）。", "fun": "株価が実体より大きく振れること、景気の波が読めないこと、これらは別々のパズルとして扱われてきた。この論文は、投資家が将来の生産性について違う意見を持つという一点から両方を導く。雇用は生産性が分かる前に決めるので、楽観が広がると採用が増える。しかも「過去の趨勢がそのまま続く」と考える外挿的な信念だけが振れを増幅するという、信念の型による選別がある。", "unverified": "モデルの数値的な適合の程度、分類の詳細。本文が入手できず確認できなかった。また原文ファイルの抄録が別版の記録由来である点にも注意が必要である。"}}, {"id": "jn18", "rank": 18, "field": "経営学", "headline": "生物多様性を企業報告に組み込む", "title": "Ecosystem Services Valuation Using Integrating Biodiversity and Natural Capital Into Corporate Reporting", "url": "https://doi.org/10.1002/csr.71071", "authors": "Yagneshkumar Dalvadi", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-11", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "Dalvadi, Y. (2026). Ecosystem Services Valuation Using Integrating Biodiversity and Natural Capital Into Corporate Reporting. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71071", "why": "財務会計の枠組みが生物多様性や自然生態系を外部性として扱ってきた構造的な欠落を指摘し、生態系サービスの評価を企業報告に統合する道筋を示した。報告枠組みの境界を問う議論である。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ", "preprint": false, "short": true, "p1": "生物多様性と自然資本の指標を企業報告の仕組みに統合するための、理論的・計算的な枠組みを提案した（抄録）。", "p3": "従来の企業財務会計の枠組みは製造資本と金融資本を優先し、生物多様性と自然生態系を外部性として扱う。この構造的な欠落が、重要な生態系サービスへの企業の依存を捉えられない断片的なリスクモデルを生み、自然に関連するリスクの体系的な誤価格づけにつながる（抄録）。", "p5": "方法論として、生態系サービス価値指数、生物多様性調整後の財務影響、自然資本のリスク暴露を中心に据えた、相互に結びついた20の指標から成る形式化された多層の行列を導入する。それ以降の内容は、抄録が途中で切れており未確認（抄録）。", "fun": "企業の決算書には建物や現金は載るが、きれいな水や受粉してくれる虫は載らない。ところが実際には、そうした自然の働きがなければ事業が成り立たない企業がある。載っていないので、その依存が崩れるリスクも値段に反映されない。この研究はそこを20個の指標で測り、報告の仕組みに組み込もうとする。見えないものを帳簿に乗せる試みである。", "unverified": "20指標の一覧、計算方法、適用事例。抄録が途中で切れており確認できなかった。"}}, {"id": "jn19", "rank": 19, "field": "経営学", "headline": "ESG総合点では革新も収益も読めない", "title": "Beyond Aggregate ESG Scores: How Distinct CSR Dimensions Drive Innovation and Financial Performance Across Institutional Contexts", "url": "https://doi.org/10.1002/csr.71074", "authors": "Abdelmoneim Bahyeldin Mohamed Metwally ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-12", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "apa": "Metwally, A. B. M., El‐Halaby, S., Ali, M. A. S., & Mohamed, A. B. R. (2026). Beyond Aggregate ESG Scores: How Distinct CSR Dimensions Drive Innovation and Financial Performance Across Institutional Contexts. Corporate Social Responsibility and Environmental Management. https://doi.org/10.1002/csr.71074", "why": "CSRの各次元が革新と財務成果に与える影響が制度環境で異なると示しており、総合スコアでの一括評価の限界を指摘した。ESG評価の指標設計に関わる論点である。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "short": true, "p1": "CSRの各次元が革新と財務成果に与える影響が、制度環境によって異なる理由を枠組みとして説明した（抄録）。", "p3": "制度・資源・利害関係者を統合した枠組みを立て、制度がCSRの顕在性と信頼性を形づくり、CSRの各次元が異質な資源を築き、利害関係者との関係がその資源を革新へ動員するという連鎖を想定する（抄録）。", "p5": "米国・英国・中国の2010年から2025年の38,600の企業・年観測を使い、労働力・環境・地域社会・人権・製品責任の5つのCSR次元を扱う。成果は、特許の数、引用の質、革新の価値、およびROA、トービンのQ、売上成長である。5次元の定式化は、調整済みの説明力を（抄録はここで途中で切れており、改善幅は未確認）（抄録）。", "fun": "ESGのスコアは、環境・社会・ガバナンスをまとめた1つの数字として使われる。この研究が指摘するのは、まとめた時点で情報が消えるということだ。労働環境への配慮と製品責任への配慮は、別の資源を作り、別の成果に効く。しかも制度が違えば同じ取り組みの意味が変わる。3か国38,600件のデータで、分けて見る価値を示そうとしている。", "unverified": "説明力の改善幅、各次元の効果の方向と大きさ。抄録が途中で切れており確認できなかった。"}}, {"id": "jn20", "rank": 20, "field": "経営学", "headline": "大学のDXは似せるか違えるか", "title": "Be similar or be different: organizational and business model innovation in the digital transformation of universities", "url": "https://doi.org/10.1016/j.jik.2026.101165", "authors": "Luis Antonio Orozco ほか", "venue": "Journal of Innovation and Knowledge", "date": "2026-10-12", "sjr": 2.96, "citescore": 24.7, "citescore_year": "2025", "apa": "Orozco, L. A., Perilla, R., Muldoon, J., & McDowell, W. C. (2026). Be similar or be different: organizational and business model innovation in the digital transformation of universities. Journal of Innovation & Knowledge, 101165. https://doi.org/10.1016/j.jik.2026.101165", "why": "大学のデジタル変革における組織革新とビジネスモデル革新を扱い、同質化と差別化のどちらを選ぶかという問いを立てている。Journal of Innovation and Knowledgeに掲載された。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、大学のデジタル変革における組織革新とビジネスモデル革新を、「似せるか違えるか」という選択として論じる研究だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "大学がオンライン化や新しい学位プログラムに取り組むとき、他大学の成功例を真似るか、独自の道を行くかという判断が生じる。真似れば安全だが差がつかない。違えれば目立つが外れたときの損が大きい。経営学では同質化と差別化の緊張として知られる問題だが、公的性格が強く評価軸が多い大学では、その計算がさらに複雑になる。", "unverified": "研究の方法、対象、結論のすべて。抄録も本文も入手できなかった。"}}, {"id": "jn21", "rank": 21, "field": "経済学", "headline": "AIは社会安定のリスクを下げたか", "title": "Does artificial intelligence improve social stability risk performance in China?", "url": "https://doi.org/10.1016/j.eiar.2026.108766", "authors": "Jinrui Zhang ほか", "venue": "Environmental Impact Assessment Review", "date": "2026-10-12", "sjr": 2.958, "citescore": 19.6, "citescore_year": "2025", "apa": "Zhang, J., Zhang, R., & Yin, C. (2027). Does artificial intelligence improve social stability risk performance in China? Environmental Impact Assessment Review, 123, 108766. https://doi.org/10.1016/j.eiar.2026.108766", "why": "中国でAIの導入が社会安定リスクの指標にどう影響したかを扱っており、技術導入の社会的帰結を政策評価の枠組みで測ろうとしている。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、中国でAIの導入が社会安定リスクの成績を改善したかを検証する研究だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "「社会安定リスク」という評価項目があること自体が、この研究の文脈を物語る。中国では大規模な開発事業に際し、住民の反発が起きないかを事前に評価する制度がある。そこにAIが入ると、苦情の分析や予兆の検知が変わりうる。技術の導入が統治の手触りをどう変えるかという問いで、評価の物差しの置き方そのものが論点になる。", "unverified": "データ、識別戦略、結論のすべて。抄録も本文も入手できなかった。"}}, {"id": "jn22", "rank": 22, "field": "経済学", "headline": "財政制約下の消費者保護とエネルギー衝撃", "title": "Geopolitical energy shocks and consumer protection under fiscal constraints", "url": "https://doi.org/10.1016/j.enpol.2026.115654", "authors": "Jules Sadefo Kamdem", "venue": "Energy Policy", "date": "2026-10-12", "sjr": 2.516, "citescore": 19.3, "citescore_year": "2025", "apa": "Sadefo Kamdem, J. (2027). Geopolitical energy shocks and consumer protection under fiscal constraints. Energy Policy, 220, 115654. https://doi.org/10.1016/j.enpol.2026.115654", "why": "地政学的なエネルギー価格の急変に対し、財政余力が限られる状況で消費者保護をどう設計するかを論じている。Energy Policyに掲載された。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、地政学によるエネルギー価格の衝撃に対し、財政の制約があるもとで消費者保護をどう設計するかを論じる研究だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "戦争や輸出規制でガス代や電気代が急に上がったとき、政府は補助金で家計を守ろうとする。ところが財政に余裕がなければ、守る範囲を絞るしかない。全員に薄く配るか、困っている人に厚く配るか。後者のほうが効率的に見えるが、誰が困っているかを見分ける費用がかかる。制約があるからこそ設計の良し悪しが出る問題である。", "unverified": "分析の枠組み、対象国、政策提案のすべて。抄録も本文も入手できなかった。"}}, {"id": "jn23", "rank": 23, "field": "経済学", "headline": "起業所得に心の健康が効く条件", "title": "When does mental well-being matter for entrepreneurial income? The role of external objective resources from social contexts", "url": "https://doi.org/10.1080/08985626.2026.2739524", "authors": "Josh Wei-Jun Hsueh ほか", "venue": "Entrepreneurship and Regional Development", "date": "2026-10-11", "sjr": 1.607, "citescore": 7.7, "citescore_year": "2025", "apa": "Hsueh, J. W.-J., Bird, M., Souitaris, V., & Shepherd, D. (2026). When does mental well-being matter for entrepreneurial income? The role of external objective resources from social contexts. Entrepreneurship & Regional Development, 1–29. https://doi.org/10.1080/08985626.2026.2739524", "why": "起業家の精神的な well-being が所得に結びつく条件を、社会的文脈からの客観的資源の有無に即して検討している。Entrepreneurship and Regional Developmentに掲載された。", "explain": {"basis": "抄録", "basis_note": "OpenAlex経由で取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "short": true, "p1": "起業家の精神的なwell-beingが所得に効く関係が、社会的な文脈から得られる外部の客観的な資源によって弱まることを示した（抄録）。", "p3": "自己効力感の理論と資源保存（COR）理論に基づき、起業家の精神的なwell-beingが所得にどう影響するかを検討する。基本の関係は正だが、起業家が社会的な文脈を通じてアクセスできる外部の客観的な資源によって調整されると理論化する（抄録）。", "p5": "2002年から2015年のドイツの起業家1,013名の縦断データを使い、精神的なwell-beingが所得と正に関連することを見出す。この関係は、外部の客観的な資源にアクセスできる起業家では弱い。具体的にどの資源かについては、抄録が途中で切れており一部のみ確認できた（抄録）。", "fun": "起業家の心の健康が収入に効くという結果は、精神論のように聞こえる。この研究の面白さは、その効き方が条件つきだと示したところだ。頼れる人や使える資金が外にある起業家では、心の状態の影響が小さくなる。つまり心の強さは、他に支えがないときに効く代替物として働いている。well-beingの価値が、置かれた状況で変わるという読み方になる。", "unverified": "外部の客観的な資源の具体的な内容、調整効果の大きさ。抄録が途中で切れており確認できなかった。"}}, {"id": "jn24", "rank": 24, "field": "経済学", "headline": "EUの土地吸収源は目標に追いつかない", "title": "Land carbon sinks in the European Union are not keeping pace with carbon neutrality expectations", "url": "https://doi.org/10.1007/s43979-026-00185-8", "authors": "Behrouz Gholamahmadi ほか", "venue": "Carbon Neutrality", "date": "2026-10-12", "sjr": 2.179, "citescore": 18.8, "citescore_year": "2025", "apa": "Gholamahmadi, B., & Ivits, E. (2026). Land carbon sinks in the European Union are not keeping pace with carbon neutrality expectations. Carbon Neutrality, 5(1). https://doi.org/10.1007/s43979-026-00185-8", "why": "EUは1990年以降に温室効果ガス排出を大きく減らしたが、土地利用・土地利用変化・林業による吸収源は並行して強まっていないと示した。カーボンニュートラルの到達可能性に直接関わる実証である。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "short": true, "p1": "EUの土地利用による炭素吸収が、排出削減と並行して強まっていないことを、目標との差として整理した（抄録）。", "p3": "最近の評価を統合し、土地の炭素吸収が弱まっている要因と、それが気候緩和政策の有効性に与える含意を検討する。EUは1990年以降に温室効果ガス排出を大きく減らしたが、土地利用・土地利用変化・林業（LULUCF）による吸収は並行して強まっていない（抄録）。", "p5": "EU27のLULUCF収支は2024年におよそ−231 MtCO₂eで、最新の加盟国の見通しは2030年の拘束力ある目標−310 MtCO₂eに対して40〜55 MtCO₂eの残余の差があることを示す。森林成長の低下、伐採の増加、気候に起因する撹乱、バイオマス需要の増加が純吸収を減らしており、2040年を対象とした1つのGLOBIOM感度分析はLULUCF吸収の約100 MtCO₂eの減少を示している（抄録）。", "fun": "排出を減らすだけでなく、森林などが吸収する量を増やして差引きゼロにするのが「カーボンニュートラル」である。この研究が示すのは、EUは排出を減らしてきたのに吸収の側が強まっていないという現実だ。森の成長が鈍り、伐採が増え、気候の異変で木が傷む。しかもバイオマス発電の需要が木を消費する。排出削減のための政策が吸収を削るという皮肉がある。", "unverified": "統合した評価の一覧、政策含意の具体的な提言。抄録が途中で切れており確認できなかった。"}}, {"id": "jn25", "rank": 25, "field": "統計学", "headline": "採点者効果を模擬試験で測る", "title": "Rating reliability and rater effects in scoring the Gaokao English story continuation writing task: Evidence from city-level mock examinations", "url": "https://doi.org/10.1016/j.asw.2026.101132", "authors": "Yao Fang ほか", "venue": "Assessing Writing", "date": "2026-10-12", "sjr": 2.972, "citescore": 12.1, "citescore_year": "2025", "apa": "Fang, Y., & Zhang, H. (2026). Rating reliability and rater effects in scoring the Gaokao English story continuation writing task: Evidence from city-level mock examinations. Assessing Writing, 70, 101132. https://doi.org/10.1016/j.asw.2026.101132", "why": "高考の英語ストーリー続き書きの採点について、都市単位の模擬試験データから採点の信頼性と採点者効果を推定している。大規模試験の採点品質の測定に関わる。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、中国の大学入試（高考）の英語の物語続き書き課題の採点について、採点の信頼性と採点者の効果を都市単位の模擬試験のデータで調べた研究だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "物語の続きを書かせる試験は、創造性を測れる反面、採点が難しい。同じ答案を別の人が採点すれば点が変わりうる。しかも中国の高考は人生を左右する試験である。題名が「採点者の効果」を掲げるのは、採点のばらつきを誤差として丸めず、誰が採点したかという要因として取り出すという意味だろう。公平性が統計の問題として立ち上がる。", "unverified": "データ、手法、結論のすべて。抄録も本文も入手できなかった。"}}, {"id": "jn26", "rank": 26, "field": "統計学", "headline": "ベイズ疎回帰で研削の真円度を予測", "title": "Monitoring centerless grinding processes for workpiece roundness prediction using internal machine sensors and Bayesian sparse regression models", "url": "https://doi.org/10.1007/s10845-026-02981-6", "authors": "Lohit Kumar Pentakota ほか", "venue": "Journal of Intelligent Manufacturing", "date": "2026-10-12", "sjr": 1.888, "citescore": 18.5, "citescore_year": "2025", "apa": "Pentakota, L. K., Leonesio, M., Papananias, M., & Bianchi, G. (2026). Monitoring centerless grinding processes for workpiece roundness prediction using internal machine sensors and Bayesian sparse regression models. Journal of Intelligent Manufacturing. https://doi.org/10.1007/s10845-026-02981-6", "why": "機械内蔵センサの信号からベイズ疎回帰で加工品の真円度を予測しており、工程監視におけるスパース推定の適用例である。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、機械内蔵のセンサとベイズ疎回帰を使って、心なし研削における加工品の真円度を予測する研究だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "金属の丸棒を磨いて真円に仕上げる研削では、どれだけ丸くなったかを後で測るしかなかった。測るために機械を止めれば生産が落ちる。題名の工夫は、追加のセンサを付けずに機械がもともと持っている信号を使うこと。そしてベイズ疎回帰は、たくさんある候補の信号から効くものだけを自動で選ぶ手法である。既にあるものから必要なものを選ぶ。", "unverified": "手法の内容、予測精度、対象のすべて。抄録も本文も入手できなかった。"}}, {"id": "jn27", "rank": 27, "field": "機械学習", "headline": "LLMで回路解析を端から端まで解く", "title": "Enhancing large language model-based systems for end-to-end circuit analysis problem solving", "url": "https://doi.org/10.1016/j.knosys.2026.117171", "authors": "Liangliang Chen ほか", "venue": "Knowledge-Based Systems", "date": "2026-10-12", "sjr": 1.753, "citescore": 13.7, "citescore_year": "2025", "apa": "Chen, L., Sun, W., Xie, H., Cai, Y., & Zhang, Y. (2026). Enhancing large language model-based systems for end-to-end circuit analysis problem solving. Knowledge-Based Systems, 117171. https://doi.org/10.1016/j.knosys.2026.117171", "why": "回路解析という記号操作と数値計算が混ざる課題を、LLMベースの系で一貫して解く構成を扱っている。Knowledge-Based Systemsに掲載された。", "explain": {"basis": "抄録", "basis_note": "題名検索で見つけたOpenAlexの記録から抄録を取得して読んだ", "preprint": false, "short": true, "p1": "回路解析の問題をLLMで端から端まで解く枠組みを作り、失敗の様式を2つに切り分けて対策した（抄録）。", "p3": "Gemini 2.5 Proを基盤モデルとし、工学教育への応用を見据えた拡張版の枠組みを示す。回路解析は、図の理解という多モーダルな能力と、精密な数学的推論の両方を要するため難しい。大学の回路解析の問題でモデルを体系的に評価し、2つの主要な失敗様式を同定する（抄録）。", "p5": "同定された失敗は、回路の認識における幻覚（とくに電源の極性の誤り）と、推論過程における幻覚（電流の向きの誤った仮定など）である。認識の誤りを減らすため、微調整したYOLO検出器を統合する。それ以降の対策と結果は、抄録が途中で切れており未確認（抄録）。", "fun": "電気回路の問題を解くには、まず図を正しく読み、次に方程式を立てて解く必要がある。LLMが間違う場所を調べると、2種類に分かれた。図の読み違い（電源の向きを逆にする）と、推論の決め打ち（電流の向きを勘違いする）。前者は画像認識の問題なので、物体検出の道具を足して直す。失敗の種類ごとに手当てを変えるという素直な対処である。", "unverified": "推論側の対策の内容、改善後の正答率。抄録が途中で切れており確認できなかった。"}}, {"id": "jn28", "rank": 28, "field": "機械学習", "headline": "検証器で導いた蒸留が推論を監査可能にする", "title": "Verifier-guided knowledge distillation of large language models for auditable thermal comfort reasoning", "url": "https://doi.org/10.1016/j.aei.2026.105371", "authors": "Moein Younesi Heravi ほか", "venue": "Advanced Engineering Informatics", "date": "2026-10-12", "sjr": 2.021, "citescore": 15.8, "citescore_year": "2025", "apa": "Younesi Heravi, M., Jeong, I., Jang, Y., & Moon, H. (2027). Verifier-guided knowledge distillation of large language models for auditable thermal comfort reasoning. Advanced Engineering Informatics, 77, 105371. https://doi.org/10.1016/j.aei.2026.105371", "why": "検証器の誘導で知識蒸留を行い、推論の根拠を追跡できる形にする設計を扱っている。説明可能性を学習手続きに組み込む方向の研究である。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、検証器の誘導によって大規模言語モデルを知識蒸留し、監査できる温熱快適性の推論を得る研究だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "ビルの空調を「暑い・寒い」の感じ方に合わせて制御するには、人の快適さを推論する必要がある。LLMは理由を言葉で説明できるので魅力的だが、大きくて遅く、しかも説明が本当かどうか確かめにくい。題名が示すのは、検証器で答えの正しさを確かめながら小さなモデルに教え込み、後から監査できる形にするという方針。説明責任を設計に入れている。", "unverified": "手法の内容、評価、対象のすべて。抄録も本文も入手できなかった。"}}, {"id": "jn29", "rank": 29, "field": "機械学習", "headline": "勾配の構造を隠して連合学習を守る", "title": "CIPHER-fed: An inference-resistant federated learning framework via structural gradient obfuscation", "url": "https://doi.org/10.1016/j.ins.2026.124297", "authors": "Waheeb Algethami ほか", "venue": "Information Sciences", "date": "2026-10-12", "sjr": 1.507, "citescore": 14.6, "citescore_year": "2025", "apa": "Algethami, W., Wu, G., & Alshami, F. (2026). CIPHER-fed: An inference-resistant federated learning framework via structural gradient obfuscation. Information Sciences, 124297. https://doi.org/10.1016/j.ins.2026.124297", "why": "勾配から入力を復元する攻撃に対し、構造的な勾配の難読化で推論耐性を持たせる連合学習の枠組みを提案している。Information Sciencesに掲載された。", "explain": {"basis": "抄録", "basis_note": "題名検索で見つけたCrossrefの記録から抄録を取得して読んだ", "preprint": false, "short": true, "p1": "連合学習でやりとりされる勾配からの情報復元を、勾配の構造を難読化することで抑える枠組みを作った（抄録）。", "p3": "連合学習（FL）は生データを共有せずに協調してモデルを学習できるが、交換される勾配は推論・再構成攻撃に対して脆弱である。既存のプライバシー保護の手法は、勾配の値を守る、更新を暗号化する、通信を減らすといった対策を別々に行うため、異質な非IIDの設定でプライバシー・頑健性・通信効率・モデルの有用性を同時に達成するのが難しい（抄録）。", "p5": "提案するCIPHER-Fedは、プライバシーの漏えいを「勾配の復元可能性」の問題として定式化する。統計的な情報の露出を制限するだけでなく、構造的な勾配の難読化という考え方を導入し、交換される勾配に埋め込まれた復元可能な情報を最小化する。それ以降の内容は、抄録が途中で切れており未確認（抄録）。", "fun": "連合学習は「データは出さず、学習の結果だけ持ち寄る」仕組みで、プライバシーを守れるとされてきた。ところが持ち寄る勾配から元のデータが復元できてしまう攻撃が知られている。この研究の着眼は、漏えいを「復元できるか」という問題として定義し直すこと。値をぼかすのではなく、構造を崩す。どこを守るべきかの定義を変えている。", "unverified": "難読化の具体的な手法、性能評価。抄録が途中で切れており確認できなかった。"}}, {"id": "jn30", "rank": 30, "field": "機械学習", "headline": "合意形成で収穫機の畝を割り当てる", "title": "Spatially-aware consensus-based bundling for event-triggered multi-harvester row allocation", "url": "https://doi.org/10.1016/j.compag.2026.112518", "authors": "Trim Bresilla ほか", "venue": "Computers and Electronics in Agriculture", "date": "2026-10-12", "sjr": 2.165, "citescore": 17.3, "citescore_year": "2025", "apa": "Bresilla, T., Leong, W., Jindo, K., & Nieuwenhuizen, A. (2026). Spatially-aware consensus-based bundling for event-triggered multi-harvester row allocation. Computers and Electronics in Agriculture, 112518. https://doi.org/10.1016/j.compag.2026.112518", "why": "空間を考慮した合意ベースの束割当で、事象駆動の複数収穫機の畝割当を解く手法である。分散最適化の実問題への適用例になる。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、空間を考慮した合意に基づく束の割当で、事象駆動の複数の収穫機への畝の割り当てを解く研究だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "複数のコンバインで広い畑を刈るとき、どの機械がどの畝を担当するかを決める必要がある。中央で全部決めれば最適だが、通信が切れたり機械が止まったりすると立ち往生する。題名の「合意に基づく」は、機械同士が話し合って分担を決める方式である。しかも畝は隣接しているほうが移動の無駄が少ないので、空間を考えた割当になる。", "unverified": "手法の内容、評価、対象のすべて。抄録も本文も入手できなかった。"}}, {"id": "jn31", "rank": 31, "field": "機械学習", "headline": "生成AI下のデザイン思考を経路で測る", "title": "Metacognition and pathway dynamics in generative AI supported design thinking: A process-sensitive evaluation with network-based cognitive mapping", "url": "https://doi.org/10.1080/14606925.2026.2743665", "authors": "Chenhan Jiang ほか", "venue": "Design Journal", "date": "2026-10-12", "sjr": 0.317, "citescore": 2.8, "citescore_year": "2025", "apa": "Jiang, C., Zhang, Y., Huang, R., Yu, J., Shen, T., & Wang, Z. (2026). Metacognition and pathway dynamics in generative AI supported design thinking: A process-sensitive evaluation with network-based cognitive mapping. The Design Journal, 1–21. https://doi.org/10.1080/14606925.2026.2743665", "why": "生成AIを使ったデザイン思考の過程を、ネットワーク型の認知マップで経路として評価する手法を扱っている。成果物ではなく過程を測る評価設計である。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、生成AIを使ったデザイン思考の過程を、ネットワーク型の認知マップでメタ認知と経路の動態として評価する研究だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "デザインの発想は行ったり戻ったりしながら進むので、できあがった成果物だけ見ても過程は分からない。題名が示すのは、考えた筋道を点と線のネットワークとして描き、どこを往復したかを測る方法である。生成AIを使うと試行の回数が増えるので、むしろ過程が記録として残る。見えなかった思考の動きが、道具のおかげで観察可能になる。", "unverified": "手法の内容、対象、結論のすべて。抄録も本文も入手できなかった。"}}, {"id": "jn32", "rank": 32, "field": "因果推論", "headline": "AIと専門家のフィードバックを長期RCTで比べる", "title": "Technological compensation or pedagogical awakening? A longitudinal RCT of AI and expert feedback in pre-service physical education", "url": "https://doi.org/10.1007/s11423-026-10724-w", "authors": "TongKai Guan ほか", "venue": "Educational Technology Research and Development", "date": "2026-10-11", "sjr": 1.836, "citescore": 10.7, "citescore_year": "2025", "apa": "Guan, T., Wider, W., Wen, X., & Song, Q. (2026). Technological compensation or pedagogical awakening? A longitudinal RCT of AI and expert feedback in pre-service physical education. Educational Technology Research and Development. https://doi.org/10.1007/s11423-026-10724-w", "why": "体育の教員志望者を対象に、AIによるフィードバックと専門家のフィードバックを長期のランダム化比較試験で対照している。技術による補償か教育的な覚醒かという問いを因果で検討している。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、体育の教員志望者を対象に、AIによるフィードバックと専門家のフィードバックを長期のランダム化比較試験で対照した研究だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "題名の「技術による補償か、教育的な覚醒か」という問いの立て方が面白い。AIが助言をくれると、足りない指導を埋め合わせるだけなのか、それとも自分で考える契機になるのか。前者なら専門家の代わり、後者なら専門家とは別の役割になる。長期のランダム化比較試験で専門家と並べれば、どちらなのかが成績の伸び方として現れる。", "unverified": "参加者数、介入の内容、結果のすべて。抄録も本文も入手できなかった。"}}, {"id": "jn33", "rank": 33, "field": "教育", "headline": "AIの情緒的支援は評価を介して効く", "title": "Navigating AI affective support: The cognitive-affective pathway from appraisal to emotional well-being in learners", "url": "https://doi.org/10.1016/j.compedu.2026.105768", "authors": "Wenjun Zhong ほか", "venue": "Computers and Education", "date": "2026-10-12", "sjr": 4.434, "citescore": 26.3, "citescore_year": "2025", "apa": "Zhong, W., Luo, J., Yu, S., Lyu, Y., & Guo, J. (2026). Navigating AI affective support: The cognitive-affective pathway from appraisal to emotional well-being in learners. Computers & Education, 105768. https://doi.org/10.1016/j.compedu.2026.105768", "why": "学習者がAIの情緒的支援をどう評価し、それが情緒的 well-being につながるかという認知-情動の経路を扱っている。Computers and Educationに掲載された。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、学習者がAIの情緒的な支援をどう評価するかから情緒的なwell-beingに至る認知-情動の経路を扱う研究だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "勉強でつまずいたとき、AIが「大丈夫、一緒にやりましょう」と言ってくれる機能が増えている。その励ましが効くかどうかは、受け取る側がそれを本気と見るか、機械の定型文と見るかで変わるはずだ。題名の「評価（appraisal）から情緒的なwell-beingへ」という経路は、支援そのものより、支援をどう解釈するかが効くという見立てを示している。", "unverified": "研究の方法、対象、結論のすべて。抄録も本文も入手できなかった。"}}, {"id": "jn34", "rank": 34, "field": "教育", "headline": "医学教育の系統的レビューの質を測る", "title": "Methodological quality of systematic reviews on medical education. A meta‐research", "url": "https://doi.org/10.1002/rev3.70234", "authors": "Ana Luiza Cabrera Martimbianco ほか", "venue": "Review of Education", "date": "2026-10-12", "sjr": 1.282, "citescore": 6.5, "citescore_year": "2025", "apa": "Martimbianco, A. L. C., de Faria, R. M. D., Sá, K. M. M., do Nascimento, Y. Y., Yarak, S., & Riera, R. (2026). Methodological quality of systematic reviews on medical education. A meta‐research. Review of Education, 14(3). https://doi.org/10.1002/rev3.70234", "why": "医学教育分野の系統的レビューの方法論的な質を、メタ研究として評価している。分野の証拠統合の信頼性そのものを検査する研究である。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "short": true, "p1": "医学教育分野の系統的レビューが、方法論的にどの程度の質を保っているかを、レビューを対象とする研究（メタ研究）として評価した（抄録）。", "p3": "MEDLINE（PubMed）に掲載された医学教育の系統的レビューを対象に、(i)一般的な特徴、(ii)実施に用いた方法論上の道具や指針の頻度と種類、(iii)AMSTAR-2の各項目への適合、(iv)用いた道具・指針とAMSTAR-2の適合の関連、(v)報告にPRISMA声明の使用を言及したレビューの頻度を評価する（抄録）。", "p5": "Forty-eight の系統的レビューが2004年から2023年に公表されたものとして組み入れられ、そのうち77.1%が介入に関する問いを扱っていた。評価された成果は（抄録はここで途中で切れており、AMSTAR-2の適合の程度などの具体は未確認）（抄録）。", "fun": "系統的レビューは「研究の研究」として証拠の最上位に置かれることが多い。ところがレビュー自体の作り方が雑なら、まとめた結論も怪しい。この研究はレビューをさらに上から点検する「メタ研究」である。Forty-eight 件を調べて、どの手引きに従ったか、報告の規約に言及したかまで見る。信頼の階層の一番上を疑う作業になっている。", "unverified": "AMSTAR-2への適合の程度、PRISMA言及の割合。抄録が途中で切れており確認できなかった。"}}, {"id": "jn35", "rank": 35, "field": "教育", "headline": "学校リーダーシップ研究の方法を問い直す", "title": "Researching school leadership – methodological considerations and possibilities", "url": "https://doi.org/10.1080/13632434.2026.2736698", "authors": "Alma Harris ほか", "venue": "School Leadership and Management", "date": "2026-10-12", "sjr": 1.348, "citescore": 6.0, "citescore_year": "2025", "apa": "Harris, A., & Jones, M. (2026). Researching school leadership – methodological considerations and possibilities. School Leadership & Management, 1–4. https://doi.org/10.1080/13632434.2026.2736698", "why": "学校リーダーシップ研究の方法論上の論点と可能性を整理している。School Leadership and Managementに掲載された。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、学校のリーダーシップを研究するうえでの方法論上の論点と可能性を整理する論文だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "校長のリーダーシップが学校を変えるという話は説得的に聞こえるが、実証するのは難しい。良い校長が良い学校に配置されているだけかもしれないし、効果が出るまでに何年もかかる。しかも学校の成果を何で測るかも一通りではない。題名が方法論を主題に据えるのは、何を主張できるかは測り方に決まる、という問題意識だろう。", "unverified": "論点の内容、提案される方法のすべて。抄録も本文も入手できなかった。"}}, {"id": "jn36", "rank": 36, "field": "教育", "headline": "困難を抱える若者が成功する条件", "title": "The quiet struggle: How vulnerable youth succeed with the right support", "url": "https://doi.org/10.1002/rev3.70243", "authors": "Sarah Gardezi ほか", "venue": "Review of Education", "date": "2026-10-12", "sjr": 1.282, "citescore": 6.5, "citescore_year": "2025", "apa": "Gardezi, S., Brown, M., Cassidy, A., McNamara, G., O’Hara, J., & McNamara, M. (2026). The quiet struggle: How vulnerable youth succeed with the right support. Review of Education, 14(3). https://doi.org/10.1002/rev3.70243", "why": "脆弱で周縁化された背景を持つ若者が、どのような支援のもとで学業上の成功に至るかを扱っている。教育の不平等という根深い課題に対する支援設計の論点を示している。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ", "preprint": false, "short": true, "p1": "脆弱で周縁化された背景を持つ若者が、学業で成功する条件を構造的・対人的な要因として聞き取った（抄録）。", "p3": "質的な物語（ナラティブ）研究のデザインを採り、2組の半構造化インタビューを用いる。1組は脆弱な背景を持つ若者自身、もう1組はその若者の教育上の成功に役割を果たした大人である（抄録）。", "p5": "抄録は、教育上の不平等が世界的に根深い問題であり、脆弱で周縁化された背景を持つ若者が不均衡に影響を受けていること、学業の進展を妨げる大きな困難が社会的排除と経済的脆弱性の循環を強めがちであるにもかかわらず、一部の生徒は学業で卓越する力を示して不利を覆すことを述べる。どの要因が効いていたかの具体的な結果は、抄録が途中で切れており未確認（抄録）。", "fun": "不利な環境から学業で成功する子を「本人の努力」や「才能」で説明するのは簡単だが、それでは他の子に活かせない。この研究は本人と、支えた大人の両方に聞いている。片方だけだと、本人が気づいていない支援や、大人が過大に見ている働きかけを取り違える。成功を個人の物語ではなく関係の記録として読もうという設計である。", "unverified": "参加者数、同定された要因の内容。抄録が途中で切れており確認できなかった。"}}, {"id": "jn37", "rank": 37, "field": "教育", "headline": "ジャーナリズム教育のAI対応の空白", "title": "Integrating Artificial Intelligence in Journalism Education: Curricular Gaps and Educator Perspectives From Bangladesh", "url": "https://doi.org/10.1177/10776958261490772", "authors": "Md Uzzal Talukder ほか", "venue": "Journalism and Mass Communication Educator", "date": "2026-10-12", "sjr": 1.108, "citescore": 10.7, "citescore_year": "2025", "apa": "Talukder, M. U., & Luther, C. A. (2026). Integrating Artificial Intelligence in Journalism Education: Curricular Gaps and Educator Perspectives From Bangladesh. Journalism & Mass Communication Educator. https://doi.org/10.1177/10776958261490772", "why": "バングラデシュのジャーナリズム教育におけるAI統合の実態を、イノベーション普及理論に沿って調べ、カリキュラム上の空白と教員の見方を記述した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "short": true, "p1": "ジャーナリズム教育へのAIの組み込みの実態を、カリキュラムと教員の視点の両面から把握できるようにした（抄録）。", "p3": "イノベーション普及理論に導かれ、質的な多手法のデザインでバングラデシュのジャーナリズム教育を調べる。17大学の21のカリキュラムを分析し、教員18名（教員12名と学科長6名）に面接する（抄録）。", "p5": "所見は、教員がAIの職業上の重要性を認識しているにもかかわらず、正式なAIの組み込みが限られていることを示す。これは個人の認識と制度の採用の間の隔たりを反映し、その隔たりはインフラ・専門知識・資金・政策の制約によって形づくられている。著者は、文脈に即したカリキュラム改革、持続的な教員の能力開発、実践的なAIの（抄録はここで途中で切れており、提言の全体は未確認）（抄録）。", "fun": "AIが報道の現場を変えているのは誰も否定しない。ところが教える側のカリキュラムは変わっていない。この研究が丁寧なのは、教員が「必要だ」と認識していることを確かめたうえで、それでも制度が動かない理由を設備・知識・資金・政策として並べたこと。意識の問題ではなく条件の問題だと切り分けている。", "unverified": "提言の全体、カリキュラム分析の詳細。抄録が途中で切れており確認できなかった。"}}, {"id": "jn38", "rank": 38, "field": "教育", "headline": "文脈に即したAI判断力を教える", "title": "Situated AI judgement: A teaching and assessment model for generative AI in higher education", "url": "https://doi.org/10.37074/jalt.2026.9.2.13", "authors": "Panas Karampampas", "venue": "Journal of Applied Learning and Teaching", "date": "2026-10-11", "sjr": 2.409, "citescore": 19.2, "citescore_year": "2025", "apa": "Karampampas, P. (2026). Situated AI judgement: A teaching and assessment model for generative AI in higher education. Journal of Applied Learning and Teaching, 9(2). https://doi.org/10.37074/jalt.2026.9.2.13", "why": "高等教育で生成AIを責任をもって使うために、文脈に埋め込まれたAI判断力という教育・評価モデルを提案している。使い方の技能ではなく判断の教育に焦点がある。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ。概念設計の論文であり実証ではない", "preprint": false, "short": true, "p1": "高等教育で生成AIを責任をもって使うために、AIの出力を評価し、異議を唱え、修正し、拒否する力を教える4段階のモデルを提案した（抄録）。", "p3": "評価的判断（evaluative judgement）と評価（アセスメント）の研究を踏まえ、4段階のモデルを示す。AI使用前の解釈、構造化されたAIとの対話、批判的な比較、省察的な説明責任である。学生はAIの道具の使い方だけでなく、学問分野の基準・証拠・倫理的な境界に照らして出力を評価し、異議を唱え、修正し、拒否することを学ぶ必要があると論じる（抄録）。", "p5": "モデルは、人類学と遺産研究の活動を通じて展開される。学生がユネスコの2003年の無形文化遺産保護条約のもとで提出された公開の提案書類を分析するという課題である。それ以降の内容は、抄録が途中で切れており未確認（抄録）。", "fun": "大学で生成AIを教えるとき、使い方の講習になりがちだ。この論文が立てる目標は逆で、AIの答えを「断る力」である。4段階の最初が「AIを使う前に自分で解釈する」ところから始まるのが要点で、自分の読みを持たないと比較ができない。無形文化遺産の申請書類という、判断に専門知識と倫理が必要な題材を選んでいるのも筋が通っている。", "unverified": "4段階の詳細な実施手順、評価の方法。抄録が途中で切れており確認できなかった。"}}, {"id": "jn39", "rank": 39, "field": "教育", "headline": "音楽の授業を上演可能性から組み替える", "title": "Learning Conditions Through Performative Possibilities: Reimagining Gender, Inclusion, and Equality in Upper Secondary Music Education", "url": "https://doi.org/10.1177/02557614261495905", "authors": "Gaute Storsve", "venue": "International Journal of Music Education", "date": "2026-10-12", "sjr": 0.687, "citescore": 4.0, "citescore_year": "2025", "apa": "Storsve, G. (2026). Learning Conditions Through Performative Possibilities: Reimagining Gender, Inclusion, and Equality in Upper Secondary Music Education. International Journal of Music Education. https://doi.org/10.1177/02557614261495905", "why": "高校の音楽教育におけるジェンダー規範・包摂・平等の課題を、学習条件と上演可能性の問題として再概念化している。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ。理論的な統合の論文であり実証ではない", "preprint": false, "short": true, "p1": "音楽教育のジェンダー規範・包摂・平等の問題を、「学習の条件」の問題として組み替える枠組みを作った（抄録）。", "p3": "Butlerの上演性（performativity）の議論とBaradのエージェンシャル・リアリズムの理論に基づき、学習の条件が、教育政策とカリキュラム、制度の構造と実践、状況に置かれた音楽の実演という相互に結びついた水準にわたってどう生産されるかを調べる、マクロ・メゾ・ミクロの枠組みを立てる（抄録）。", "p5": "枠組みは、音楽教育の諸文脈にわたるジェンダー・包摂・学習の研究に導かれた理論的統合を通じて展開され、既存の実証研究が例示として使われる。主にポピュラー音楽に焦点を当てる。それ以降の内容は、抄録が途中で切れており未確認（抄録）。", "fun": "高校の軽音楽部で、ドラムは男子、ボーカルは女子という偏りが自然に見えてしまう。この論文は、それを個人の好みの集計ではなく「学習の条件」として捉え直す。政策やカリキュラム、設備や慣行、そして実際の演奏の場という3つの層で条件が作られているという整理である。不平等が生まれる場所を層に分けることで、手を入れる先が見える。", "unverified": "枠組みの詳細、例示される実証研究。抄録が途中で切れており確認できなかった。"}}, {"id": "jn40", "rank": 40, "field": "教育", "headline": "教えるから支えるへ、非形式の音楽学習", "title": "From Instruction to Facilitation: Teaching Practice and Informal Learning in Pre-Service Primary Music Teacher Education", "url": "https://doi.org/10.1177/02557614261495906", "authors": "Marcos Merino", "venue": "International Journal of Music Education", "date": "2026-10-12", "sjr": 0.687, "citescore": 4.0, "citescore_year": "2025", "apa": "Merino, M. (2026). From Instruction to Facilitation: Teaching Practice and Informal Learning in Pre-Service Primary Music Teacher Education. International Journal of Music Education. https://doi.org/10.1177/02557614261495906", "why": "教員養成課程で非形式の音楽学習を10回介入として実施し、理論・実践・教育技能の均衡を図るアクションリサーチである。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ。抄録に設計が詳しく含まれている", "preprint": false, "short": true, "p1": "小学校教員の養成課程で、音楽の非形式的な学習を取り入れて、指導者から支援者への役割の転換を試みた（抄録）。", "p3": "アクションリサーチとして、マドリードの大学生11名に10回の介入を行い、非形式的な学習の方法論上の原則を適用する。データ収集はインタビュー、省察日誌、フィールドノート、ディスカッショングループで、再帰的な主題分析で分析する（抄録）。", "p5": "支援者（ファシリテーター）の役割を採ることで、指導者は音と模倣を、音楽の習得と知識の普及のための有効な方略として正統化した。結論として、音に基づく実演と模倣に根ざした支援者の役割への転換が、自律性と仲間同士の（抄録はここで途中で切れており、結論の全体は未確認）（抄録）。", "fun": "音楽を教えるとき、楽譜を読んで理論を学ぶのが正統とされてきた。ところがバンドをやる子は耳で聞いて真似して覚える。この研究は後者を教員養成に正面から取り入れ、教える側の役割を「教授」から「場を整える」ことに移した。すると、聞いて真似るという学び方が正式な方法として認められる。何が正統かを変える試みである。", "unverified": "結論の全体、介入の具体的な内容。抄録が途中で切れており確認できなかった。"}}, {"id": "jn41", "rank": 41, "field": "教育", "headline": "聖典を越境して学ぶ多言語の権威", "title": "Negotiating Yogasūtra across Languages and Cultures: Translanguaging, Gender, and Multilingual Interpretive Authority in a Bali–India Learning Community", "url": "https://doi.org/10.26858/ijole.v10i3.90049", "authors": "Luh Asli ほか", "venue": "International Journal of Language Education", "date": "2026-10-12", "sjr": 0.324, "citescore": 3.3, "citescore_year": "2025", "apa": "Asli, L., Kurniawan, M. F., Utami, H. D., Rismadewi, N. W. M., & Wahyuni, I. A. K. S. (2026). Negotiating Yogasūtra across Languages and Cultures: Translanguaging, Gender, and Multilingual Interpretive Authority in a Bali–India Learning Community. International Journal of Language Education, 10(3), 448. https://doi.org/10.26858/ijole.v10i3.90049", "why": "バリとインドの学習共同体で、ヨーガ・スートラのような哲学的に密度の高い聖典が、言語・文化・身体経験を横断してどう意味づけられるかを扱っている。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "short": true, "p1": "哲学的に密度の高い聖典を複数言語で読む学習共同体で、解釈の権威がどう交渉されるかを記述した（抄録）。", "p3": "聖なるテキストや哲学的に密度の高いテキストは、言語形式・文化史・テキストの伝統・身体的な経験を横断して意味が交渉される独特の言語学習の環境を作る。しかしトランスランゲージングの研究は、学習の対象が文化に埋め込まれた哲学テキストである場合に学習者が解釈の権威をどう交渉するかにあまり注意を払ってこなかった（抄録）。", "p5": "質的な事例研究として、バリとインドの学習共同体でPatañjaliのヨーガ・スートラがサンスクリット語・インドネシア語・バリ語・英語で議論される場を調べる。対象は21名（進行役2名と参加者19名、女性9名・男性10名）で、録音された10回のセッション（合計16時間40分）にわたり観察し、20の（抄録はここで途中で切れており、補足資料の内容は未確認）（抄録）。", "fun": "聖典を4つの言語で読む勉強会では、どの言語での説明が正しいのかという問題が常に起きる。サンスクリット語の原典に近いほうが権威があるのか、現地のバリ語での理解が本物なのか。この研究が扱うのはその「誰の読みが通るか」の交渉である。言語の切り替えは便利な道具であると同時に、権威をめぐる駆け引きの場でもある。", "unverified": "同定された知見、補足資料の内容。抄録が途中で切れており確認できなかった。"}}, {"id": "jn42", "rank": 42, "field": "心理学・認知科学", "headline": "姿勢の配置が身体的伝達を形づくる", "title": "Postural configurations as micro-ecological constraints: How embodied arrangements shape the emergence of bodily-visual communication", "url": "https://doi.org/10.1016/j.cognition.2026.106736", "authors": "Marek Placiński ほか", "venue": "Cognition", "date": "2026-10-08", "citescore": 5.8, "citescore_year": "2025", "apa": "Placiński, M., Nölle, J., Sibierska, M., Kiljanek, B., Karkowska, K., & Żywiczyński, P. (2027). Postural configurations as micro-ecological constraints: How embodied arrangements shape the emergence of bodily-visual communication. Cognition, 278, 106736. https://doi.org/10.1016/j.cognition.2026.106736", "why": "姿勢の配置を微小生態的な制約として捉え、身体と視覚による伝達がどう立ち上がるかを扱っている。Cognitionに掲載された。", "explain": {"basis": "抄録", "basis_note": "OpenAlex経由で取得した抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "short": true, "p1": "身体の配置の違いが、言葉を使わない身体・視覚的な伝達の立ち上がり方をどう変えるかを、動作計測で測った（抄録）。", "p3": "2つの相互作用の配置（立って向き合う開いた配置と、テーブルに着席した配置）のもとで、身体・視覚的な伝達がどう発達するかを調べる。70組（参加者140名）が、32の意味について言葉を使わない新しい信号を3ラウンドの指示伝達課題で作り、その動きを高解像度のモーションキャプチャで記録する（抄録）。", "p5": "両方の配置で、組は頑健な効率化の動態を示した。伝達の成功が増え、動きの経路と体積が減り、調音の専門化が進み、話者間の運動学的な整列が強まった。しかし配置の効果は、伝達の成功よりも動きに基づく指標にはっきり現れた。それ以降の内容は、抄録が途中で切れており未確認（抄録）。", "fun": "身振りだけで意味を伝え合う遊びを繰り返すと、2人の間に即席の言語のようなものができる。この研究が加えたのは「立っているか座っているか」という条件だ。座ってテーブル越しだと使える身体の部分が減るので、信号の作り方が変わる。面白いのは、伝わるかどうかの成功率には差が出にくく、動きの作り方に差が出たこと。制約は結果より過程に現れる。", "unverified": "配置ごとの指標の差の大きさ、結論。抄録が途中で切れており確認できなかった。"}}, {"id": "jn43", "rank": 43, "field": "心理学・認知科学", "headline": "嫌悪学習は過去の記憶を遡って変える", "title": "Aversive learning retroactively modulates neutral episodic memories structured by prior knowledge of predictive sequences", "url": "https://doi.org/10.1016/j.cognition.2026.106731", "authors": "Blazej M. Baczkowski ほか", "venue": "Cognition", "date": "2026-10-09", "citescore": 5.8, "citescore_year": "2025", "apa": "Baczkowski, B. M., & Villringer, A. (2027). Aversive learning retroactively modulates neutral episodic memories structured by prior knowledge of predictive sequences. Cognition, 278, 106731. https://doi.org/10.1016/j.cognition.2026.106731", "why": "予測可能な系列の事前知識で構造化された中性的な記憶が、後の嫌悪学習によって遡及的に変化すると扱っている。記憶の書き換えの時間的方向を問う研究である。", "explain": {"basis": "抄録", "basis_note": "OpenAlex経由で取得した抄録を読んだ", "preprint": false, "short": true, "p1": "後から来る恐怖の学習が、以前に符号化した中性的な出来事の記憶を遡って強めるかを、系列の予測関係を手がかりに検証した（抄録）。", "p3": "時間的に離れた中性的な経験と脅威的な経験の記憶を結ぶことは、後の早期警告信号の認識を支えうる。しかし、安全な文脈で符号化されて忘れられやすい中性的な出来事が、将来の脅威の予測に役立つほど記憶に保たれる認知過程は明らかでなかった。そこでパヴロフ型の脅威条件づけが、以前に符号化した中性的な出来事の長期のエピソード記憶を、その予測関係の事前知識を利用して遡って強めるかを検証する（抄録）。", "p5": "若年成人はまず、2つの決定論的な系列（A→B→CとD→E→F）における意味カテゴリの順序を予測することを、カテゴリの事例を描いた画像の反復提示によって学習する。それ以降の手続きと結果は、抄録が途中で切れており未確認（抄録）。", "fun": "事故に遭った直前に見た景色を、あとになって鮮明に思い出すことがある。見た時点では何でもない光景だったのに、後の出来事が記憶を押し上げたことになる。この研究はその遡りを実験室で作る。しかも鍵になるのが、前もって「この順番で来る」という知識を持っているかどうか。既にある予測の枠組みが、記憶の救い上げを助けるという仮説である。", "unverified": "条件づけの手続き、記憶テストの結果。抄録が途中で切れており確認できなかった。"}}, {"id": "jn44", "rank": 44, "field": "組織行動・心理的安全性", "headline": "公正感が大学教員の離職意図を抑える", "title": "Organizational justice, support and commitment: A pathway to reducing turnover intentions among academics in higher education institutions", "url": "https://doi.org/10.1002/rev3.70245", "authors": "Md. Siddikur Rahman ほか", "venue": "Review of Education", "date": "2026-10-12", "sjr": 1.282, "citescore": 6.5, "citescore_year": "2025", "apa": "Rahman, Md. S., & Pinki, N. A. (2026). Organizational justice, support and commitment: A pathway to reducing turnover intentions among academics in higher education institutions. Review of Education, 14(3). https://doi.org/10.1002/rev3.70245", "why": "高等教育機関の教員の離職意図について、組織的公正・支援・コミットメントの経路を検討している。組織の公正知覚が定着に及ぶ経路を扱った実証である。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "short": true, "p1": "大学教員の離職意図について、組織的公正と組織的支援が組織コミットメントを介して効く経路を検証した（抄録）。", "p3": "組織的公正・組織的支援と離職意図の関係における組織コミットメントの媒介の役割が、特に高等教育機関では十分に検討されていないという空白に取り組む。バングラデシュの上位5つの私立大学の教員375名から層化無作為抽出でデータを集め、部分最小二乗構造方程式モデリング（PLS-SEM）で仮説を検定する（抄録）。", "p5": "結果は、分配的・手続き的・相互作用的な公正が（抄録はここで途中で切れており、係数と媒介の結論は未確認）。公正と支援の知覚が、教員が機関に留まる決定を形づくりうるという想定が出発点である（抄録）。", "fun": "大学教員が辞めたくなる理由を給与だけで説明するのは無理がある。この研究が置く3種類の公正が示唆的で、何をもらえるかの公正（分配的）、決め方の公正（手続き的）、扱われ方の公正（相互作用的）に分かれる。待遇が同じでも、決め方や接し方が不公正だと感じれば辞めたくなる。不満の中身を分けて測る設計になっている。", "unverified": "推定された係数、媒介の結論。抄録が途中で切れており確認できなかった。"}}, {"id": "jn45", "rank": 45, "field": "組織行動・心理的安全性", "headline": "職場のハラスメントは機能と生活に及ぶ", "title": "Effects of Workplace Sexual Harassment on Mental Health, Occupational Functioning, and Health-Related Quality of Life Among Healthcare Professionals: A Systematic Review", "url": "https://doi.org/10.1007/s13178-026-01343-4", "authors": "Merav Ben Natan ほか", "venue": "Sexuality Research and Social Policy", "date": "2026-10-12", "sjr": 1.082, "citescore": 6.0, "citescore_year": "2025", "apa": "Ben Natan, M., & Hazanov, Y. (2026). Effects of Workplace Sexual Harassment on Mental Health, Occupational Functioning, and Health-Related Quality of Life Among Healthcare Professionals: A Systematic Review. Sexuality Research and Social Policy. https://doi.org/10.1007/s13178-026-01343-4", "why": "医療職における職場のセクシュアルハラスメントが、精神的健康・職業機能・健康関連QOLに及ぶ影響を系統的に整理した。職業上の被害の帰結を多面的に捉えている。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ", "preprint": false, "short": true, "p1": "職場のセクシュアルハラスメントが医療職の心身の健康と職業上の機能に及ぶ影響を、系統的レビューとして統合した（抄録）。", "p3": "PRISMA 2020の指針に従い、PubMed、CINAHL、Scopusで2015年から2025年に公表された研究を検索する。適格な研究は、医療従事者におけるハラスメントの個人水準の帰結を報告したものである（抄録）。", "p5": "検討する帰結は、精神的健康、身体的なwell-being、職業上の機能、健康関連のQOL（HRQoL）である。抄録は、認識が高まっているにもかかわらず医療職への包括的な影響についての証拠が断片的なままであると述べる。統合の具体的な結果は、抄録が途中で切れており未確認（抄録）。", "fun": "職場のハラスメントの被害は「つらい経験」として語られがちで、健康や仕事の成果への影響が数字でまとめられてこなかった。この研究は10年分の実証研究を集め、精神面・身体面・職業上の機能・生活の質の4つに分けて整理する。断片的な証拠を揃えるという地味な作業だが、対策の必要性を議論する土台になる。", "unverified": "組み入れられた研究数、統合された効果の方向と大きさ。抄録が途中で切れており確認できなかった。"}}, {"id": "jn46", "rank": 46, "field": "組織行動・心理的安全性", "headline": "分極した社会でジャーナリストを支える要因", "title": "Psycho-social risk and protective factors associated with resilience in journalism", "url": "https://doi.org/10.1177/14648849261497385", "authors": "Marijana Markovikj ほか", "venue": "Journalism", "date": "2026-10-12", "sjr": 2.087, "citescore": 8.3, "citescore_year": "2025", "apa": "Markovikj, M., & Serafimovska, E. (2026). Psycho-social risk and protective factors associated with resilience in journalism. Journalism. https://doi.org/10.1177/14648849261497385", "why": "政治とメディアの透明性が低く、記者への圧力が強い環境で、レジリエンスに結びつく心理社会的な保護要因とリスク要因を特定している。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ", "preprint": false, "short": true, "p1": "分極した社会で働くジャーナリストについて、職場の心理社会的なリスク要因とレジリエンスの関係を調べた（抄録）。", "p3": "北マケドニアのジャーナリストを対象に、2025年3月から6月に実地調査を行う。心理社会的なリスク要因の評価にコペンハーゲン心理社会的質問紙（COPSOQ-III）、レジリエンスの測定にConnor-Davidsonレジリエンス尺度（CD-RISC-25）を用いる（抄録）。", "p5": "抄録は、政治とメディアの機関の透明性の低さ、記者への圧力、偽情報、自己検閲といった課題を特徴とする分極した社会政治的な文脈が、長期にわたる複雑な条件下での取材を通じて記者の対処能力とレジリエンスに相当な負荷をかけると述べる。所見は、記者が仕事の（抄録はここで途中で切れており、どの要因が挙がったかの具体は未確認）（抄録）。", "fun": "記者が圧力を受けると、自分で表現を抑える「自己検閲」が起きる。これは外からの検閲より見つけにくく、本人も自覚しないことがある。この研究は職場のストレス要因を標準化された質問紙で測り、個人のレジリエンスと突き合わせる。報道の自由という制度の問題を、働く人の健康の問題として測り直す接近である。", "unverified": "標本規模、同定されたリスク要因、相関の大きさ。抄録が途中で切れており確認できなかった。"}}, {"id": "jn47", "rank": 47, "field": "組織行動・心理的安全性", "headline": "アフリカ哲学から測る相互連結の指導", "title": "From an African philosophy to a cross-cultural instrument: Development and validation of a scale for measuring interconnected leadership", "url": "https://doi.org/10.1177/14705958261497064", "authors": "Anton Grobler ほか", "venue": "International Journal of Cross Cultural Management", "date": "2026-10-12", "sjr": 0.508, "citescore": 3.7, "citescore_year": "2025", "apa": "Grobler, A., & Powell, K. (2026). From an African philosophy to a cross-cultural instrument: Development and validation of a scale for measuring interconnected leadership. International Journal of Cross Cultural Management. https://doi.org/10.1177/14705958261497064", "why": "西洋の個人主義的な前提で作られてきたリーダーシップ尺度に対し、アフリカ哲学に根ざす相互連結的なリーダーシップの尺度を開発し、文化横断で妥当性を検証した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を読んだ。抄録に数値が詳しく含まれている", "preprint": false, "short": true, "p1": "アフリカ哲学のUbuntuに根ざすリーダーシップを測る尺度を開発し、文化を越えて使える道具として妥当性を検証した（抄録）。", "p3": "Ubuntuのリーダーシップは「私があるのは我々があるからだ」という観念に集約され、連帯・慈悲・敬意・尊厳を強調し、倫理的で包摂的なリーダーシップの関係的・集団主義的な基礎を与える。これを操作化するため、相互連結リーダーシップ尺度（Interconnected Leadership Scale, ILS）を開発し検証する（抄録）。", "p5": "内在的（emic）で参加型の対話的質的分析による概念化に基づき、横断的な量的デザインを3つの独立した研究に適用する。対象は南アフリカの110の公的・（抄録はここで途中で切れており、組織の種別と結果は未確認）組織の従業員6,381名である（抄録）。", "fun": "リーダーシップの研究は欧米の個人主義的な前提で作られてきたので、「強い個人が引っぱる」像に寄りやすい。この研究はアフリカのUbuntu、つまり「私があるのは我々があるからだ」という考え方を出発点に、測れる尺度を作った。しかも南アフリカの6,381名で検証している。文化に固有の原理を、他の文化でも使える道具に翻訳しようという試みである。", "unverified": "3つの研究の設計と結果、尺度の因子構造。抄録が途中で切れており確認できなかった。"}}, {"id": "jn48", "rank": 48, "field": "組織行動・心理的安全性", "headline": "教室の自信から職場で通じる力へ", "title": "From classroom confidence to workplace readiness: reimagining future skills development in higher education", "url": "https://doi.org/10.1016/j.futures.2026.103950", "authors": "Anneli Lorenz ほか", "venue": "Futures", "date": "2026-10-11", "sjr": 1.426, "citescore": 8.2, "citescore_year": "2025", "apa": "Lorenz, A., Kindsiko, E., & Poltimäe, H. (2026). From classroom confidence to workplace readiness: reimagining future skills development in higher education. Futures, 103950. https://doi.org/10.1016/j.futures.2026.103950", "why": "高等教育における将来の職業能力の育成を再構想する議論で、教室内の自信と職場での即応性のずれを扱っている。Futuresに掲載された。", "explain": {"basis": "題名", "basis_note": "抄録・本文とも入手できず、題名だけを読んだ", "preprint": false, "short": true, "p1": "題名からは、高等教育における将来の職業能力の育成を、教室での自信から職場での即応性へという観点で再構想する研究だと読める（題名）。", "p3": "未確認（抄録・本文を入手できず）。", "p5": "未確認（抄録・本文を入手できず）。", "fun": "大学の授業で良い成績を取った学生が、職場で戸惑うことは珍しくない。教室では問題が整って与えられるが、現場では何が問題かを自分で決めなければならない。題名が「教室での自信から職場での即応性へ」と並べるのは、その2つが自動的につながらないという問題意識だろう。何を教えるかより、どこまでを教育の範囲と考えるかの話になる。", "unverified": "研究の方法、対象、結論のすべて。抄録も本文も入手できなかった。"}}, {"id": "jn49", "rank": 49, "field": "経営学", "headline": "マーケティング分析が経営者の認知を変える", "title": "From Data to Decisions: Marketing Analytics, Mental Performance, and Firm Growth in an Emerging Market", "url": "https://doi.org/10.1287/mksc.2025.0292", "authors": "Stephen J. Anderson ほか", "venue": "Marketing Science", "date": "2026-10-12", "sjr": 8.324, "citescore": 9.3, "citescore_year": "2025", "apa": "Anderson, S. J., Chintagunta, P. K., Kaul, R., & Vilcassim, N. J. (2026). From Data to Decisions: Marketing Analytics, Mental Performance, and Firm Growth in an Emerging Market. Marketing Science. https://doi.org/10.1287/mksc.2025.0292", "why": "ルワンダの550社でフィールド実験を行い、マーケティング分析の導入が起業家の認知能力を因果的に高め、売上と利益を押し上げたと報告している。", "explain": {"basis": "抄録", "basis_note": "候補収集時に取得した抄録を読んだが、1文のみの要旨である。本文は入手できず", "preprint": false, "short": true, "p1": "マーケティング分析の導入が、起業家の認知能力を高め企業の売上と利益を上げるという因果関係をフィールド実験で示した（抄録）。", "p3": "ルワンダの550社を対象としたフィールド実験を用いる。マーケティング分析の導入を割り当て、起業家の認知と企業の成果の両方を測る（抄録）。抄録が1文のみのため、介入の内容と測定の詳細は未確認。", "p5": "抄録の報告では、マーケティング分析が起業家の認知を因果的に高め、企業の売上と利益を上げる。効果の大きさ、認知の測定方法、追跡期間はいずれも抄録に示されていないため未確認（抄録）。", "fun": "「データを見て経営しよう」という助言は当たり前に聞こえる。この研究が示したのは、それが売上を上げるだけでなく、起業家本人の考える力まで変えたということだ。数字を見る習慣がつくと、何が起きているかを整理して捉えられるようになるのかもしれない。道具を渡すと使い手が変わるという、因果の向きが興味深い。", "unverified": "介入の内容、効果の大きさ、認知の測定方法。抄録が1文のみで本文も入手できず確認できなかった。"}}, {"id": "jn50", "rank": 50, "field": "経営学", "headline": "SNS広告でマラリアは防げるのか", "title": "Can Facebook Ads Prevent Malaria? Two Field Experiments in India", "url": "https://doi.org/10.1287/mksc.2024.0929", "authors": "Dante Donati ほか", "venue": "Marketing Science", "date": "2026-10-12", "sjr": 8.324, "citescore": 9.3, "citescore_year": "2025", "apa": "Donati, D., Rao, N., Orozco-Olvera, V., & Boudet, A. M. M. (2026). Can Facebook Ads Prevent Malaria? Two Field Experiments in India. Marketing Science. https://doi.org/10.1287/mksc.2024.0929", "why": "インド全国規模のFacebookによるマラリア予防キャンペーンを2つのフィールド実験で評価し、効果が都市部の比較的恵まれた層に集中していたと報告している。", "explain": {"basis": "抄録", "basis_note": "Semantic Scholar経由で取得した抄録を読んだ。候補収集時のCrossrefの1文要旨より詳しい記述が得られた", "preprint": false, "short": true, "p1": "SNSを通じた全国規模のマラリア予防キャンペーンの効果を、地区単位のクラスターランダム化比較試験で測った（抄録）。", "p3": "インドで、地区水準のクラスターランダム化比較試験を用いる。2つの調査標本（N=8,253）と行政の保健記録を組み合わせ、オフラインのマラリア関連の行動と健康の帰結への効果を評価する（抄録）。", "p5": "調査データでは、予防行動・受診意向・自己報告のマラリア発生に対する平均処置効果は小さく有意でなかった。行政データでも、記録された全体の発生に検出可能な効果は見られなかった。ただし事後の異質性分析は、検出可能な効果が社会経済的地位（SES）の高い世帯と都市部に集中していたことを示す。高SES世帯では蚊帳の使用が（抄録はここで途中で切れており、増加幅は未確認）（抄録）。", "fun": "SNS広告で病気を防げるかという問いに、インド全国規模の実験で答えた研究である。全体の結果は「効果なし」。ところが後から分けて見ると、都市の比較的豊かな世帯では蚊帳の使用が増えていた。情報が届く人と届かない人がいて、届く人はもともと対策しやすい層だった。デジタルの施策が格差を縮めるとは限らないことを、実験で示している。", "unverified": "高SES世帯での蚊帳使用の増加幅、事後分析の統計的な扱い。抄録が途中で切れており確認できなかった。"}}], "data_related": [{"rank": 1, "headline": "実橋4橋の載荷試験から車線荷重を同定", "title": "Data and code for: Lane-load identification from routine load-test gauges: evidence from four in-service bridges", "url": "https://doi.org/10.5281/zenodo.23312744", "authors": "Nguyen ほか", "venue": "Zenodo", "date": "2026-10-12", "apa": "Nguyen, Q.-B., & Vu, T.-S. (2026). Data and code for: Lane-load identification from routine load-test gauges: evidence from four in-service bridges (Version 1.0) [Dataset]. Zenodo. https://doi.org/10.5281/ZENODO.23312744", "summary": "ベトナムの供用中の橋4橋（Phương Độ、Giẽ、Sông Sặt、Cầu Mây）で行われた定期静的載荷試験の、ダイヤルゲージとひずみロガーの生読み値。元の帳票のどのシート・セルから取ったかという出所、除外リスト、整理後の橋梁メタデータ、論文の数値・表・図を再現するPythonコードが入る。試験日は2018年11月〜2024年8月。トラック重量はSông Sặt以外は公称値。元の竣工検査報告書・図面・FEMは含まれない。CC BY 4.0。投稿中の論文に対応する。", "kind": "data", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"rank": 2, "headline": "車載加速度で路面異常を検出できる限界", "title": "Physical limits of detectability and cross-vehicle transferability in inertial road-anomaly sensing: simulation code and results", "url": "https://doi.org/10.5281/zenod     "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
