ることを示し、交通の改善で教育へのアクセスがどれだけ広がるかを定量化した（抄録）。", "p2": "学校選択制は住む地域と教育機会の結びつきを弱めうるが、それは生徒が学校に通える場合に限られる。シカゴでは生徒の多くが公共交通に頼るため、交通網の構造が機会を左右する（抄録）。", "p3": "生徒ごとの志望順位と公共交通の所要時間のデータを使い、離散選択モデルで学校への評価と通う費用を分けて推定した（抄録）。具体例：同じ学校を同じように高く評価していても、バスで片道1時間かかる地域の生徒はその学校を第1志望にしにくい。", "p4": "人種間の志望順位の違いを、学校の評価の違いと通学費用の違いに分解し、通学時間を入れ替える反実仮想と、バス路線の追加の反実仮想で評価した（抄録）。", "p5": "黒人生徒は上位校を第1志望にしにくく、上位校までの公共交通の時間も長かった。学校の評価は人種間で順位がよく一致していたが、地域による通学時間の違いが上位校への需要の人種差を生んでいた。黒人生徒に白人生徒の通学時間を与えると、上位校への需要は23ポイント増えた。交通が需要を制約している地域を特定し、的を絞ったバス路線の効果を定量化した（抄録）。", "p6": "未確認（本文の限界の記述を入手できず）。解釈：志望の段階の需要を扱っており、入学や学業成果まで改善するかは別の問題である。", "fun": "どの高校でも選べる制度があっても、通えなければ選べないのと同じです。シカゴでは、黒人と白人の生徒は「良い学校」の評価ではほぼ一致していたのに、バスでの通学時間の差のせいで、黒人生徒は良い学校を志望しにくくなっていました。教育の格差を縮める鍵が、教室ではなくバス路線にあるかもしれないという発見が面白いところです。", "unverified": "モデルの推定値と提案するバス路線の具体的な効果は本文を入手できず確認できなかった。"}}, {"id": "pn08", "rank": 8, "field": "ヒューマンコンピュータインタラクション", "headline": "GANからGPT-5まで：人は偽の顔を見抜けるか", "title": "From GAN-Based Models to GPT-5: A Taxonomy-Guided Study of Human Performance in Detecting Deepfake Face Images", "url": "https://arxiv.org/abs/2610.23144", "authors": "Zhiqing Guo ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Guo, Z., Jia, L., Sun, L., Chen, X., Yu, G., Wang, L., Yang, G., Stillwell, D., Holz, T., & Li, S. (2026). From GAN-Based Models to GPT-5: A Taxonomy-Guided Study of Human Performance in Detecting Deepfake Face Images (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23144", "why": "生成モデルの世代ごとに、人がディープフェイク顔画像を見分ける能力を体系的に評価した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§IV実験設計、§V-A〜V-Dの結果、§VI-Dの限界と図2〜3・5の説明）を読んだ", "preprint": true, "p1": "人がディープフェイクの顔画像を見抜ける度合いが生成モデルごとに大きく異なり、モデルに合わせた訓練でおおむね向上し、その効果が5か月後も保たれることを、人が認識できる不自然さの分類（DFAT）に基づく大規模なオンライン実験で示した（抄録）。", "p2": "生成モデルはGANから拡散モデル、マルチモーダルLLMへと急速に進化したが、人の見抜く能力の研究は追いついていない。モデルによって見抜きやすさが違うのか、モデル特化の訓練が汎用の訓練より効くのかは不明だった（抄録、§I）。", "p3": "顔・画風・背景・装飾品の不自然さを分類したDFATを作り（§III）、汎用とモデル特化の訓練教材（動画と解説つき練習問題）を作った。参加者を2つの訓練×5つの生成モデル（StyleGAN2、StyleGAN3、GRAM-HD、SD3.5、GPT-5）に無作為に割り当て、訓練前後に「1枚を見て本物か判断」と「本物と偽物を並べて本物を選ぶ」を各10問解かせた。画像は各モデルの偽物30枚とFFHQの本物30枚（1024×1024）（§IV-A〜D）。", "p4": "正答率を主指標とし、非正規分布のためART分散分析とWilcoxon符号順位検定（Holm補正）で比べた。検出力分析で目標440人とし、Prolificで608人から除外後524人、5か月後に342人が追試験を受けた（§IV-B、IV-E）。", "p5": "訓練前の正答率は生成モデルで大きく異なり（F(4,519)=64.02、p<.001、ηp²=0.33）、SD3.5とGPT-5は見抜きやすく、StyleGAN2・3は難しかった。新しいモデルほど見抜きにくいわけではなかった（§V-A1、図2）。訓練で20条件中13条件の正答率が有意に上がり、最大はStyleGAN3のモデル特化訓練の並列形式で+22.8%だった。SD3.5では汎用訓練で単独形式の正答率が-6.8%下がった（§V-B1、図3）。5か月後の変化は-7.3%〜+6.4%で、20の対比較のいずれでも有意な低下はなかった（§V-D1、図5）。", "p6": "著者は、生成技術の変化が速く分類と教材の更新が必要なこと、SNSや報道など実際の文脈・時間的制約を扱っていないこと、追跡での脱落による選択バイアスの可能性を限界に挙げる（§VI-D）。解釈：1人あたりの試験問題は少なく、個人の能力の推定は粗い。", "fun": "最新のAIが作った偽の顔ほど見破りにくい、と思いがちですが、実験では古いタイプのAIの顔の方が見抜きにくいことが分かりました。最新のAIの顔は「きれいすぎる」という全体の雰囲気で気づかれやすい一方、古いAIの不自然さは肌の質感など細かい部分に潜んでいたからです。どこを見ればよいかを教わると見抜く力が上がり、5か月たっても衰えなかったのも心強い結果です。", "unverified": "GPT-5の訓練による正答率の上昇幅の具体値と、確信度・ストレスの変化の数値は確認していない。"}}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "週労働時間の短縮は雇用と生産性を増やしたか", "title": "The Effects of a Shorter Workweek on Employment, Output, and Productivity", "url": "https://doi.org/10.3386/w35917", "authors": "Pauline Carry ほか", "venue": "NBER Working Paper", "apa": "Carry, P., Montialoux, C., Nimier-David, E., Roulet, A., & Roussille, N. (2026). The Effects of a Shorter Workweek on Employment, Output, and Productivity (NBER Working Paper No. 35917). National Bureau of Economic Research. https://www.nber.org/papers/w35917", "why": "フランスの賃金維持型の労働時間短縮を使い、ワークシェアリングと生産性向上の効果を検証した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ（本文は入手できず）", "preprint": true, "p1": "フランスの賃金を維持した週39→35時間への労働時間短縮（社会保険料の減税と一体）を分析し、雇用は変わらなかったが、その裏で時短と減税が大きく打ち消し合い、生産性が2%上がったことを示した（抄録）。", "p2": "労働時間の短縮は、仕事を分け合う効果（ワークシェアリング）と生産性の向上をもたらすと政策担当者は考えたが、その効果の識別は難しかった（抄録）。", "p3": "企業規模による段階的な実施を使って改革全体の影響を識別し、時短と減税への曝露の違いを使って両者の効果を分けた。労使結合データ、財務データ、調査データを組み合わせ、労働者・企業・地域労働市場への影響を調べた（抄録）。", "p4": "雇用、技能別の雇用、総労働時間、生産量、全要素生産性（TFP）を結果とした（抄録）。", "p5": "改革全体では雇用は変わらなかったが、減税がなければ時短は雇用を3.8%減らしていた。効果は技能に偏り、管理職・専門職の雇用を増やし他の従業員を減らした。時短はTFPを2%高め、総労働時間が6%減ったにもかかわらず生産量の減少を1%にとどめた。調査からは仕事の強化と組織の変化が生産性向上の要因として示唆された（抄録）。", "p6": "未確認（本文の限界の記述を入手できず）。解釈：生産性の向上が「仕事の密度の上昇」による場合、労働者の健康や満足への影響は別に評価する必要がある。", "fun": "働く時間を減らせば、そのぶん新しく人を雇って失業が減る――週35時間制はそんな期待で始まりました。ところが実際には、時短だけなら雇用はむしろ減るはずで、同時に行われた減税がそれを帳消しにしていました。一方、短い時間で同じ仕事をこなそうと工夫した結果、効率は上がりました。政策の効果が二つの逆向きの力の差し引きで決まるという分析が見事です。", "unverified": "技能別の効果の大きさは本文を入手できず確認できなかった。"}}, {"id": "pn10", "rank": 10, "field": "統計学", "headline": "AIの判断をいつ使うかを共形予測で選ぶ", "title": "Conformal Policy Selection: When to Deploy AI Decisions for Targeted Intervention", "url": "https://arxiv.org/abs/2610.22930", "authors": "Junyu Cao ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Cao, J., Gao, R., Saar-Tsechansky, M., & Yin, M. (2026). Conformal Policy Selection: When to Deploy AI Decisions for Targeted Intervention (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22930", "why": "AIによる介入方針を展開すべき場面を、共形推論の保証つきで選ぶ方法を提案した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§4の手法とアルゴリズム1、§5の合成データと電子カルテの半合成実験、§6の考察と図1〜3）を読んだ。付録の証明は読んでいない", "preprint": true, "p1": "AIの意思決定方針を「誰に適用してよいか」を、個人ごとの多重検定として定式化し、選んだ人の中で「実は結果が閾値を下回る人」の割合（偽発見率、FDR）を有限標本で保証して選ぶ方法Conformal Policy Selectionを示した（抄録、§6）。", "p2": "方策のオフライン評価や安全な方策学習は母集団全体での保証しか与えず、平均では有益でも一部の人に害を及ぼしうる。AIを責任をもって展開するには、誰に効くのかを知る必要がある（抄録、§1）。", "p3": "各候補者jについて「AI方策のもとでの結果Y_jが閾値c_jを超える」を検定する。過去の行動方策π0のもとで集めた較正データの非適合度スコアを、AI方策πとの比w(x,t)=π(t|x)/π0(t|x)で重み付けして共形p値を作り（式3）、各候補ごとの補助p値でBH法を回して選択数K_jを求め、一様乱数uで刈り込んで最終集合を選ぶ（式4〜5、アルゴリズム1）。直観：「処置の付け方が違うデータ」を重みで補正すれば、AI方策のもとでの結果の分布と比べて、閾値を確実に超える人だけを拾える。", "p4": "重みが既知なら有限標本のFDR制御（定理1）、結果モデルか傾向スコアのどちらかが正しければ漸近的にFDR制御（二重頑健性、定理2）を示した。合成データ（較正500、試験100、400回反復）でFDRと検出力を、結果モデルと重みの正誤の4条件で比べ、イスラエルの保険者の電子カルテ（前糖尿病患者89,999人）に基づく半合成データで「展開の安全ゲート」として評価した（§4〜5）。", "p5": "両方正しい場合、FDRはすべての名目水準qで下回り、検出力はq=0.95で約0.80に達した（図1）。どちらか一方が正しければFDRは制御され、両方誤るとq=0.05でFDRが約0.30まで上がった（図2、表1）。60歳以上・BMI30以上の高リスク群（5,993患者年）で、全体で学習した方策がこの群では有害になる設定でも、FDRは名目水準以下に保たれ（最初に選ぶq=0.75で0.046）、q≤0.85では有害な処置は一件も展開されなかった（図3）。", "p6": "著者は、選択の対象は個人の因果効果ではなくAI方策のもとで実現する結果であり、因果効果そのものを対象にする拡張は今後の課題とする（§6）。解釈：電子カルテの実験は因果森林で作った擬似的な真の効果に依存しており、実際の薬の効果について結論するものではないと著者自身も断っている（§5.2.1）。", "fun": "AIが「この治療がおすすめ」と言うとき、平均すれば役立っても、ある人には逆効果かもしれません。この方法は、AIの判断を全員に当てはめるのではなく、「この人なら大丈夫」と統計的に言える人だけを選び、選び間違いの割合に上限を設けます。全体では有益なAIが特定の集団で害になる例でも、間違って害を与える処置を見事に止めた点が面白いところです。", "unverified": "表1の各シナリオの数値と、職業訓練の半合成実験（付録C）の結果は確認していない。"}}, {"id": "pn11", "rank": 11, "field": "因果推論", "headline": "因果基盤モデルは集計すると被覆率が崩れる", "title": "Unit-level aggregation breaks coverage in causal foundation models", "url": "https://arxiv.org/abs/2610.22770", "authors": "Gabe Schulman ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Schulman, G., Bynum, L. E. J., & Wald, Y. (2026). Unit-level aggregation breaks coverage in causal foundation models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22770", "why": "処置効果を推定する因果基盤モデルで、個体レベルの推定を集計すると信頼区間の被覆が崩れることを示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§4の設計効果の命題、§5の実験設定と結果、§6の限界、図2〜4）を読んだ。付録の証明と追加表は読んでいない", "preprint": true, "p1": "処置効果を推定する因果基盤モデル（CFM：多数の合成データで事前学習し、新しいデータに文脈内で推論するモデル）では、個体ごとの推定を集団の平均効果にまとめると信頼区間の被覆が崩れることを示し、その原因を誤差の相関として定式化し、集団をまとめて予測するニューラル過程モデルで改善した（抄録）。", "p2": "CFMは個体レベルの効果推定で標準的なベンチマークに競合するが、実際の意思決定は全体・処置群・部分集団の平均効果に基づくことが多く、その信頼区間が較正されているかは確かめられていなかった（§1）。", "p3": "部分集団Sの平均効果の誤差は個体誤差e_iの平均で、その平均二乗誤差はσ²/k×[1+(k−1)ρ]になる（命題1、Kishの設計効果）。既存のCFMは誤差が独立であるかのように個体の分散を足し合わせるため、報告される分散は集団の大きさkとともに増える係数だけ小さすぎる（式7〜9）。誤差の相関の源は、データ生成過程（構造因果モデル、SCM）についての事後的な不確実性で、同じ未知のSCMがすべての個体の誤差に共通に効く（§4.2）。そこで、SCMを1回引いたもとで全個体の効果を同時に計算する「SCM周辺化」の集計を提案し、集団をまとめて予測する条件付きニューラル過程（CNP）と潜在ニューラル過程を学習した（§4.3）。", "p4": "7つのデータ（合成族、Hill-A/B、Friedman、IHDP、Kang-Schafer、ACIC 2016）で、名目95%区間の被覆と、被覆が名目を下回り始める部分集団の大きさを評価した。同じ重みのモデルで個体単位とSCM周辺化の集計を比べ、凍結したCausalPFNの上にヘッドとして載せて6つのベンチマークでも比べた（§5.1、表1）。", "p5": "ACIC 2016では、温度較正したCausalPFNの95%区間は4802個体中30個体を超える集団で名目を下回り、全標本の平均の区間が真値を含むのは20%のデータセットだけだった（抄録）。同じ重みで比べると、最大の集団で個体単位の区間はSCM周辺化よりCNPで7.7倍、潜在NPで5.5倍狭く、60セルでのSCM周辺化の被覆の中央値は0.89で、最低値でも個体単位の最高値（0.47）を上回った（§5.2、図2）。CausalPFNのヘッドとしては、全標本の区間が真値を含む割合がCNPヘッド90%、潜在NPヘッド89%（240データセット）で、個体単位の集計の25%と52%、CausalPFN自体の53%を上回った（図3）。個体単位の被覆は理論式（式1）によく従い、中央値の絶対誤差は0.021〜0.043だった（図4）。", "p6": "著者は、提案モデルは合成族で学習した小さなモデルでCausalPFNの精度や汎用性には及ばず、ヘッドでも被覆の喪失を全部は回復できず、いくつかのベンチマークで個体レベルの精度は劣り、区間も広いと認める（§5.2、§6）。解釈：誤差の相関だけでは被覆の崩れる位置は予測できず（Hill-Aは相関が最大でも最後まで保つ）、報告分散の較正度m_Sとの組み合わせが鍵になる。", "fun": "一人ひとりの予測の誤差が小さくても、全員の誤差が同じ向きにずれていたら、平均を取っても誤差は打ち消し合いません。テストの採点基準そのものが間違っていたら、何人分採点しても平均点はずれたままなのと同じです。この論文は、AIが「誤差はばらばらに出る」と思い込んで信頼区間を狭く見積もりすぎていることを、数式と実験で示しました。", "unverified": "部分集団の選び方ごとの結果（付録D）とベンチマークごとの詳細な表（付録F）は確認していない。"}}, {"id": "pn12", "rank": 12, "field": "組織行動・心理的安全性", "headline": "企業内訓練に積極的な企業は組織が違う", "title": "The Role of Organization in Firm-Sponsored Training", "url": "https://doi.org/10.3386/w35920", "authors": "David J. Deming ほか", "venue": "NBER Working Paper", "apa": "Deming, D. J., Sadun, R., & Stanton, C. T. (2026). The Role of Organization in Firm-Sponsored Training (NBER Working Paper No. 35920). National Bureau of Economic Research. https://www.nber.org/papers/w35920", "why": "企業が労働者の技能に投資する傾向の違いを記録し、組織のあり方との関係を論じた。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ（本文は入手できず）", "preprint": true, "p1": "同じ産業・労働市場でも、よく管理された企業ほど従業員の訓練に投資することを示し、組織の違いが訓練投資の誘因を生むことを知識階層の枠組みで説明した（抄録）。", "p2": "企業による技能訓練は、労働市場の摩擦（転職されにくい等）で説明されてきたが、なぜ一部の企業だけが熱心に訓練するのかは十分に説明されていなかった（抄録）。", "p3": "企業の訓練と管理の質のデータで現象を記録し、トップの管理者が自分の技能に合わせて独自の組織を作る知識階層モデルを使い、組織の異質性が一般的な技能を企業特殊的にし、企業が訓練の見返りを回収できる仕組みを示した（抄録）。", "p4": "管理の質と訓練の関係、訓練が管理職向けか現場向けかに集中する傾向を記述した（抄録）。", "p5": "よく管理された企業は、同じ産業・労働市場内でも訓練する傾向が高く、訓練は管理職の育成か現場労働者の育成のいずれかに集中していた（抄録）。", "p6": "未確認（本文の限界の記述を入手できず）。解釈：管理の質と訓練の関係は相関であり、管理の良さが訓練を生むのか、訓練が管理の良さを生むのかの方向は抄録からは判断できない。", "fun": "どこでも使える技能を教えると、社員は転職してしまうかもしれないので、会社は訓練に消極的になる――経済学ではそう考えられてきました。この論文は、会社ごとに組織の作り方が違えば、同じ技能でもその会社でこそ生きる技能になると指摘します。だから組織のしっかりした会社ほど安心して社員を育てられる、という説明が面白いところです。", "unverified": "データの出所と規模は本文を入手できず確認できなかった。"}}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "薄い仕組みでVLMエージェントにロボットを書かせる", "title": "HexaShell: A Thin Harness for Exploring the Limits of VLM Agents as Robot Coding Agents", "url": "https://arxiv.org/abs/2610.23479", "authors": "Hongcheng Gao ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-19", "apa": "Gao, H., Zhou, A., Zhu, J., Zheng, Z., Ge, S., Li, X., Wu, D., Wang, Y., Zeng, J., Shangguan, X., Wang, Y., Wan, Y., He, L., Jia, Z., Wu, S., & He, X. (2026). HexaShell: A Thin Harness for Exploring the Limits of VLM Agents as Robot Coding Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23479", "why": "視覚言語モデルのエージェントがロボット操作のコードをどこまで書けるかを、最小限の仕組みで検証した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（§4の設定と結果、表1、§5.2〜5.3の失敗分析、§7結論）を読んだ。§6の事例は読んでいない", "preprint": true, "p1": "既製のコーディングエージェント（Codex＋GPT-6-Astra）にコマンドライン1本で双腕ロボットを操作させ、失敗のたびに小さな「道具」プログラムを書き直させる薄い仕組みHexaShellで、ロボット操作ベンチマークRoboDojoの最高成績を出した。限界は推論ではなく接触の制御にあることを示した（抄録、§7）。", "p2": "視覚言語モデル（VLM）のエージェントはロボット操作の順位表で学習済みの方策と競うようになったが、コンピュータの代わりにロボットを操作するとき、コーディングエージェントがどこまで行けて、どこで止まるのかは分かっていなかった（§1）。", "p3": "仕組みはエージェントの命令をロボットの動きに変えるだけに留め、エージェントは3台のRGBカメラの画像と較正情報を見る。失敗後にログを読み、原因を見つけ、道具を書くか直す（§3）。道具は観測だけを使い、三角測量で物体の位置を求める：2台のカメラが同じ点を見ればその点は2本の視線の交点にあり、点が机や積み木の上面など既知の平面上にあれば視線と平面の交点にある。頭部カメラで足りなければ手首のカメラを動かして第2の視点を得る（§3.2）。具体例：各課題の1つのシードの10配置で道具を作って凍結し、同じシードの新しい10配置で再試験した（§4.1）。", "p4": "RoboDojo（Isaac Simの双腕ARX X5、42課題、5種類）で、順位表と同じ平均の成功率と進捗スコアを使い、2026年10月14日時点の順位表の上位の学習済み方策（VPP2、PhysicalRSI）と、道具なしの同じモデルと比べた。深度推定ネットワーク（Depth Anything V2）や描画された深度との比較も行った（§4.1、§4.4）。", "p5": "HexaShellは成功率39.7%、進捗スコア48.0で、VPP2（32.3%、39.3）とPhysicalRSI（31.4%、36.3）を上回った。54変種の単純平均では35.4%で、道具なしの同じモデルは24.3%だった。記憶課題（65.0%）と自由課題（50.0%）で優れ、精密（31.3%）と長期（23.8%）ではVPP2（35.2%、37.0%）が上回った（§4.2）。散らかった配置でも成功の95%を保ち、学習済み方策の保持率の中央値18%を大きく上回った（§4.3）。三角測量は深度ネットワークより順位表の指標で8.7点高く、深度ネットワークの物体画素の誤差の中央値は頭部カメラで41 mm、手首で約100 mmだった（§4.4、表1）。失敗263件の57%は手数切れで、多くはエージェントが失敗に気づきながら動作を成功させられなかった（§5.2）。", "p6": "著者は、きつい嵌め込みなど接触が決める課題が弱点で、把持中も測り続けて動作を接触中に修正する道具が次の課題とする（§7）。解釈：1エピソードの中央値739 s（ロボットの動作は26 s）とモデルの待ち時間が長く、ベンチマークがそれを数えない点は実用上の制約である。シミュレーション上の結果であり、実機での検証はない。", "fun": "ロボットを動かすAIというと、大量の動作データで体の動かし方を学ばせるのが主流です。この研究は逆に、プログラムを書くのが得意なAIに「失敗したら原因を調べて、道具を書き直して」と任せました。カメラ2台の視線が交わる点を計算するという中学の幾何のような方法で物の位置を測ると、AIが画像から奥行きを推測するより正確でした。それでも差し込み作業は苦手で、頭より手先の器用さが壁だというのが面白い結論です。", "unverified": "表1の各方法の成功率の具体値と、§6の事例の詳細は確認していない。"}}, {"id": "pn14", "rank": 14, "field": "経済学", "headline": "輸出規制は安全保障にどこまで効くか", "title": "Export Controls and the Economics of National Security", "url": "https://doi.org/10.3386/w35898", "authors": "Jingting Fan ほか", "venue": "NBER Working Paper", "apa": "Fan, J., Handley, K., & Limão, N. (2026). Export Controls and the Economics of National Security (NBER Working Paper No. 35898). National Bureau of Economic Research. https://www.nber.org/papers/w35898", "why": "敵対国の軍事能力に関わる財の輸出規制の効果を経済学的に分析した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ（本文は入手できず）", "preprint": true, "p1": "米国の輸出規制の分類と許可のデータを、軍民両用生産を含む一般均衡モデルと組み合わせ、多国間の輸出規制が一国だけの規制よりはるかに安全保障上の効果が大きいことを示した（抄録）。", "p2": "輸出規制は敵対国の軍事能力に関わる財の入手を制限するが、その効果は各国の貿易と生産の調整に依存し、定量的な評価が乏しかった（抄録）。", "p3": "米国の輸出規制の分類と許可の結果の新しいデータに、軍民両用の生産、産業連関、民生・軍事の最終支出を分けた定量的一般均衡モデルを組み合わせ、規制による輸出と参入の摩擦を推定した（抄録）。", "p4": "多国間の輸出規制体制（MECR）の加盟国向けと非加盟国向けの摩擦の差、規制品の輸入の減少、他国による代替、敵対国の実質軍事支出を、反実仮想で比べた（抄録）。", "p5": "規制は大きな輸出と参入の摩擦を生むが、MECR加盟国向けではずっと小さく、その差は15〜29対数ポイントの輸出費用に相当した。多国間の規制のもとでは規制品の輸出の減少のうち他国が代替したのは7%で、米国単独では28%だった。安全保障の効果（敵対国に対する米国の実質軍事支出）は多国間で約1対数ポイント、単独で0.14対数ポイント上がり、民生の実質費用は同程度だった。米国の禁輸でも多国間の結果は再現できなかった（抄録）。", "p6": "未確認（本文の限界の記述を入手できず）。解釈：軍事能力を価格指数を通じた実質軍事支出で測る仮定がモデルの結論を左右するため、本文で確かめる必要がある。", "fun": "ある国が「この部品は敵対国に売らない」と決めても、別の国が売ってしまえば効果は薄れます。この研究では、米国だけで規制すると減った分の28%が他国に置き換えられましたが、仲間の国と一緒に規制すると7%にとどまりました。費用はほぼ同じなのに安全保障の効果は7倍ほどになるという結果は、国際協調の価値を数字で示しています。", "unverified": "推定に使った具体的な品目と期間は本文を入手できず確認できなかった。"}}, {"id": "pn15", "rank": 15, "field": "交通・都市計画", "headline": "低所得者の交通補助は配車と公共交通の補完か代替か", "title": "Complement or Substitute? The Effect of Low-Income Transportation Subsidies on Ridehail and Transit Use", "url": "https://doi.org/10.2139/ssrn.7636392", "authors": "Madeline Wander ほか", "venue": "SSRN", "date": "2026-10-19", "apa": "Wander, M., Brozen, M., & Blumenberg, E. (2026). Complement or Substitute? The Effect of Low-Income Transportation Subsidies on Ridehail and Transit Use. https://doi.org/10.2139/ssrn.7636392", "why": "多様な交通手段に使える需要側補助の実験から、配車サービスと公共交通の利用への効果を推定した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": true, "p1": "ロサンゼルスの低所得者向け交通補助（モビリティ・ウォレット）が、頻繁に公共交通を使う人の配車サービス（ライドヘイル）の利用をやや増やしたが、公共交通の利用は減らさなかったことを示した（抄録）。", "p2": "多様な交通手段に使える需要側の補助は、低所得者の移動と生活の質を高めるが、配車サービスへの補助が、より安く環境にもよい公共交通の利用を奪うおそれがあった（抄録）。", "p3": "ロサンゼルスのモビリティ・ウォレット試行の第2段階に応募した頻繁な公共交通利用者（受給者と非受給者）の、開始前と実施中の調査データで差の差のモデルを推定し、個人ごとの反応を記述的に分析した（抄録）。", "p4": "配車サービスと公共交通の利用回数の変化を、受給者と非受給者で比べた（抄録）。", "p5": "頻繁な公共交通利用者の間で、ウォレットは配車サービスの利用のわずかな増加と関連したが、公共交通の利用には変化がなかった。個人では、公共交通を配車サービスで置き換えた人もいれば、本来はあきらめていた移動に配車サービスを使った人もいた（抄録）。", "p6": "著者は、現在の補助額は手段の柔軟性の便益と公共交通の利用を損なわないことの均衡がとれているかもしれないとする（抄録）。解釈：応募者に限られた調査に基づき、もともと公共交通をよく使う人が対象のため、他の低所得層への一般化には注意が要る。", "fun": "お金に余裕のない人に「バスにもタクシー型の配車にも使える交通費」を配ると、みんな配車サービスばかり使ってバスに乗らなくなるのでは、と心配されました。調べてみると、バスの利用は減らず、配車サービスは主に「これまで行けなかった用事」に使われていた人もいました。移動の選択肢が増えることが、暮らしの幅を広げることにつながるという結果です。", "unverified": "増加の大きさと標本の規模は本文を入手できず確認できなかった。"}}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "移民の労働市場効果と財政効果を同時に評価", "title": "Modeling and Evaluating the Labor Market and Fiscal Effects of Immigration", "url": "https://doi.org/10.3386/w35901", "authors": "Michele Battisti ほか", "venue": "NBER Working Paper", "apa": "Battisti, M., Peri, G., & Romano, E. (2026). Modeling and Evaluating the Labor Market and Fiscal Effects of Immigration (NBER Working Paper No. 35901). National Bureau of Economic Research. https://www.nber.org/papers/w35901", "why": "移民が自国民に与える労働市場と財政の2つの経路を1つのモデルで評価した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ", "preprint": true, "short": true, "p1": "移民が自国民に与える労働市場と財政の2つの経路を1つの一般均衡モデルで同時に評価した（抄録）。", "p3": "探索・マッチングの摩擦、技能別の累進的な労働課税、資本課税、公共財を含むモデルを、2015〜2019年のOECD 17か国に較正した（抄録）。", "p5": "移民流入1ポイント増の厚生効果は国により符号も大きさも異なる。2019〜2024年の移民の技能構成なら17か国中14か国で自国民の厚生が上がり、低技能層は税引前所得、高技能層は税負担の低下を通じて得をする（抄録）。", "fun": "移民が増えると「仕事を奪われる」と心配する声と、「税収が増える」と期待する声があります。この研究は両方を同じ模型の中で計算し、多くの国では低技能の人も高技能の人も得をするが、その理由は異なることを示しました。片方の経路だけを見ると、誰がなぜ得をするのかを見誤るという点が重要です。", "unverified": "国別の厚生効果の数値は抄録からは確認できなかった。"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "生産ネットワークが内生的な経済の頑健な性質", "title": "The Robust Properties of Economies with Endogenous Production Networks", "url": "https://doi.org/10.3386/w35909", "authors": "Simone Cerreia-Vioglio ほか", "venue": "NBER Working Paper", "apa": "Cerreia-Vioglio, S., Corrao, R., Flynn, J. P., & Lanzani, G. (2026). The Robust Properties of Economies with Endogenous Production Networks (NBER Working Paper No. 35909). National Bureau of Economic Research. https://www.nber.org/papers/w35909", "why": "生産ネットワークが内生的に決まる経済の均衡を特徴づけ、価格の性質を導いた。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ", "preprint": true, "short": true, "p1": "生産ネットワークが内生的に決まる経済で、対数価格が「ネットワーク上のmin-max」で表されることを示し、頑健性と脆弱性の両面を一つの式で捉えた（抄録）。", "p3": "対数価格が対数生産性の原始的なアフィン関数のネットワーク上のmin-maxに等しいことを導き、minを供給者の代替による回復力、maxを補完性による硬直性と解釈した（抄録）。", "p5": "Hultenの定理を一般化し、局所的なDomarウェイトでは小さなショックの伝播さえ十分に記述できないことを示した。Domarウェイトの滑らかな変化はミクロの変動がGDPに与える悪影響を過大評価する（抄録）。", "fun": "部品の仕入れ先を自由に切り替えられれば、どこかの工場が止まっても経済は持ちこたえます。逆に、どうしても代わりのきかない部品があると、そこが弱点になります。この論文は、この「しなやかさ」と「もろさ」が、最小値と最大値という単純な組み合わせの式で表せることを示しました。", "unverified": "モデルの前提となる生産関数の形は抄録からは確認できなかった。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "自国財と外国財の弾力性関数で貿易の利益を測る", "title": "Home-Foreign Elasticity Functions and the Gains from Trade", "url": "https://doi.org/10.3386/w35906", "authors": "Jonathan Vogel", "venue": "NBER Working Paper", "apa": "Vogel, J. (2026). Home-Foreign Elasticity Functions and the Gains from Trade (NBER Working Paper No. 35906). National Bureau of Economic Research. https://www.nber.org/papers/w35906", "why": "一定の貿易弾力性の仮定を外し、自国-外国間の代替を関数として推定して貿易利益を再計算した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ", "preprint": true, "short": true, "p1": "一定の貿易弾力性を仮定せず、自国-外国の弾力性を関数として推定して貿易の利益を計算し直した（抄録）。", "p3": "一般の相似拡大的選好のもとで、貿易の利益を初期の国内支出シェアと自給自足に至る価格経路上の弾力性関数から求める。弱分離性のもとで経路に依存しないことを示し、貿易協定による関税変化で部門別の関数を推定した（抄録）。", "p5": "WIODとOECD ICIOのデータで、弾力性は国内支出シェアとともに上がる傾向があった。推定した関数を使うと貿易の利益の中央値は19.37対数ポイントで、弾力性を固定した場合の24.43より小さかった（抄録）。", "fun": "貿易でどれだけ得をしているかを測るには、「外国製品が値上がりしたら国産品にどれだけ乗り換えるか」という数字が必要です。従来はこれを一定と仮定していましたが、この研究は国内品の割合が高いほど乗り換えやすいことを見つけ、貿易の利益がこれまでの見積もりより小さくなることを示しました。", "unverified": "推定の不確実性の幅は抄録からは確認できなかった。"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "住宅ローンの価格支配力は営業担当者にもある", "title": "Pricing Power in the Mortgage Market: Evidence from GSE Fee Waivers", "url": "https://doi.org/10.3386/w35907", "authors": "Neil Bhutta ほか", "venue": "NBER Working Paper", "apa": "Bhutta, N., Keys, B. J., & Raajkumar, A. (2026). Pricing Power in the Mortgage Market: Evidence from GSE Fee Waivers (NBER Working Paper No. 35907). National Bureau of Economic Research. https://www.nber.org/papers/w35907", "why": "政府系機関の手数料免除を使い、情報優位を持つ個々の営業担当者による価格支配力を示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ", "preprint": true, "short": true, "p1": "住宅ローン市場で、企業だけでなく個々の営業担当者が情報優位を使って価格支配力を持つことを示した（抄録）。", "p3": "低所得の初回購入者を対象とした政府系機関（Fannie Mae/Freddie Mac）の手数料免除を使い、免除分が借り手に還元されたかを担当者ごとに推定した（抄録）。", "p5": "2023〜2024年の手数料免除の総額15億ドルのうち60%超を仲介者が取り込んだ。高い金利のローンを組んできた実績のある担当者は免除の20%未満しか還元しなかった（抄録）。", "fun": "国が「低所得の人の手数料を免除します」と決めても、そのお金が本当に本人に届くとは限りません。この研究では、6割以上が途中の仲介者の取り分になっていました。しかも、担当者によって還元の度合いが大きく違うという結果は、制度の効果が窓口の人に左右されることを示しています。", "unverified": "担当者の実績の測り方の詳細は抄録からは確認できなかった。"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "社会保険の拡大は家計の借金を減らすか", "title": "The Impact of Social Insurance on Household Debt", "url": "https://doi.org/10.3386/w35908", "authors": "Gideon Bornstein ほか", "venue": "NBER Working Paper", "apa": "Bornstein, G., & Indarte, S. (2026). The Impact of Social Insurance on Household Debt (NBER Working Paper No. 35908). National Bureau of Economic Research. https://www.nber.org/papers/w35908", "why": "社会保険の拡充が家計の債務の蓄積に与える影響を調べた。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ", "preprint": true, "short": true, "p1": "社会保険（メディケイド）の拡大が家計の債務に与える因果効果を推定し、信用供給の増加が借入を押し上げることを示した（抄録）。", "p3": "1,000万人のデータで、段階的なメディケイド拡大への郵便番号地域ごとの曝露の違いを使う準実験の設計をとり、家計の借入モデルで効果を分解した（抄録）。", "p5": "地域のメディケイド対象人口が1ポイント増えるとクレジットカードの借入が0.38%増えた。家計の財務的な回復力が高まったことによる信用供給の増加が主因で、拡大の純厚生利益の30%に寄与した（抄録）。", "fun": "医療保険が手厚くなれば、病気のときに借金しなくて済むので、借金は減りそうです。ところが結果は逆で、借入は増えていました。保険で家計が安定すると、銀行が安心してお金を貸すようになるからです。借金が増えたことが、悪いことではなく暮らしの改善の一部だったという見方が面白いところです。", "unverified": "借入の内訳（カード以外）への効果は抄録からは確認できなかった。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "私たちは地下水を使いすぎているか", "title": "Are We Consuming Too Much Groundwater?", "url": "https://doi.org/10.3386/w35904", "authors": "Brian Greaney ほか", "venue": "NBER Working Paper", "apa": "Greaney, B., Shapiro, J. S., & Wagner, K. R. (2026). Are We Consuming Too Much Groundwater? (NBER Working Paper No. 35904). National Bureau of Economic Research. https://www.nber.org/papers/w35904", "why": "世界の多数の帯水層で人間による地下水の汲み上げが最適かを評価した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ", "preprint": true, "short": true, "p1": "世界の多くの帯水層について、人間の地下水汲み上げが最適かどうかを動学モデルで評価した（抄録）。", "p3": "リモートセンシングと経済データで帯水層ごとに汲み上げの動学モデルを推定し、観測された汲み上げを正当化する割引因子を求めて、ラムゼー型と市場の基準と比べた（抄録）。", "p5": "帯水層の5分の3から5分の4が最適より速く汲み上げられており、現在価値を数%下げ、数兆ドル規模の厚生損失を生んでいた。現在の水量を永遠に保つ持続的な経路も、最適経路より厚生が低い（抄録）。", "fun": "地下水は見えない貯金のようなもので、使いすぎれば将来の分がなくなります。この研究は、世界の地下水の多くが「将来をあまりに軽く見る」ペースで使われていると推定しました。意外なのは、今の水位を保つだけでは不十分で、すでに貯金が減りすぎているため回復させる方が良いという結論です。", "unverified": "分析対象の帯水層の数と損失額の内訳は抄録からは確認できなかった。"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "地域ショックへの移住反応を正しく理解する", "title": "Understanding Migration Responses to Local Shocks", "url": "https://doi.org/10.3386/w35921", "authors": "Kirill Borusyak ほか", "venue": "NBER Working Paper", "apa": "Borusyak, K., Dix-Carneiro, R., & Kovak, B. K. (2026). Understanding Migration Responses to Local Shocks (NBER Working Paper No. 35921). National Bureau of Economic Research. https://www.nber.org/papers/w35921", "why": "地域の労働需要ショックに対する人口移動の回帰が小さく出る理由を解明した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ", "preprint": true, "short": true, "p1": "地域の労働需要ショックへの人口移動の反応が小さく推定されるのは、移動が鈍いからではなく、回帰の偏りのためだと示した（抄録）。", "p3": "労働者が競合する移住先の中から選ぶ均衡モデルで、地域の人口増は自地域と関連する移住先のショックの差に依存することを示した。ブラジルとドイツの行政データに基づくシミュレーションで偏りを測った（抄録）。", "p5": "ショックが地域間で相関すると推定値は減衰し、産業別のシフトシェアは実効的な曝露を誤って表すため、減衰は50%を超えうる。理論に基づく補正法を提案した（抄録）。", "fun": "ある町で仕事が減っても、隣の町でも同じように仕事が減っていれば、人は引っ越しません。だから「仕事が減った町から人が出ていかない」ことは、人が動かない証拠にはならないのです。比べる相手を正しく選ばないと、因果の大きさを半分以下に見誤るという指摘は、データ分析全般に通じる教訓です。", "unverified": "補正法を実データに適用した結果は抄録からは確認できなかった。"}}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "米国の金融政策と世界金融サイクルのモデル", "title": "A Model of U.S. Monetary Policy and the Global Financial Cycle", "url": "https://doi.org/10.3386/w35902", "authors": "Rohan Kekre ほか", "venue": "NBER Working Paper", "apa": "Kekre, R., & Lenel, M. (2026). A Model of U.S. Monetary Policy and the Global Financial Cycle (NBER Working Paper No. 35902). National Bureau of Economic Research. https://www.nber.org/papers/w35902", "why": "米国の金融政策が通貨保有者の富の再評価を通じて世界のリスクプレミアムに影響する一般均衡モデルを提案した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ", "preprint": true, "short": true, "p1": "米国の金融政策が、通貨のミスマッチを抱える裁定者の富の再評価を通じて世界のリスクプレミアムに影響する一般均衡モデルを提案した（抄録）。", "p3": "裁定者のポートフォリオが平均分散効率的なら、彼らはドルを売り持ちになる。米国の引き締めで裁定者の純資産が減り、世界のリスクの価格が上がる。この仕組みを国際資産価格への効果に合わせて定量化した（抄録）。", "p5": "波及効果と外国の政策対応の役割を定量化し、ドル金利が高い将来では裁定者のドル調達と米国の金融政策の波及が弱まるとした（抄録）。", "fun": "アメリカが金利を上げると、遠く離れた国の株や通貨まで揺れ動きます。この論文は、その理由を「ドルを借りて世界に投資している人たちの財布が傷む」ことに求めました。世界の金融市場の波が、一部の投資家の懐具合を通じて広がるという見方は、経済のつながりを理解する手がかりになります。", "unverified": "定量化された波及効果の大きさは抄録からは確認できなかった。"}}, {"id": "pn24", "rank": 24, "field": "経営学", "headline": "カリフォルニア富裕税の正味現在価値", "title": "The Net Present Value of the California Billionaire Tax Act", "url": "https://doi.org/10.3386/w35899", "authors": "Benjamin Jaros ほか", "venue": "NBER Working Paper", "apa": "Jaros, B., & Rauh, J. (2026). The Net Present Value of the California Billionaire Tax Act (NBER Working Paper No. 35899). National Bureau of Economic Research. https://www.nber.org/papers/w35899", "why": "2026年の一時的な富裕税の税収と富裕層の移住への影響を評価した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ", "preprint": true, "short": true, "p1": "2026年のカリフォルニア州の億万長者税（10億ドル超の純資産への一度限りの5%課税）の税収と転出の影響を推定した（抄録）。", "p3": "フォーブスの億万長者リスト、州内の住宅保有の報道、公表された転出の情報から行動反応と税収の減少を複数の方法で推定し、訴訟で残る割合の割引を加えた（抄録）。", "p5": "税収は約300億ドル（280〜360億ドル）で、先行研究の予測1,000億ドルの3分の1未満だった。確認済みの転出で課税ベースの約30%が失われ、恒久的な所得税収の損失を含めると正味現在価値はマイナス389億ドルとなった（抄録）。", "fun": "お金持ちに一度だけ大きな税をかければ、州の財政が潤うように思えます。しかし、課税の前にお金持ちが州外へ引っ越してしまうと、その後毎年入るはずだった所得税まで失われます。この研究は、その損失が一度きりの税収を上回ると推定しました。税の効果は人の行動まで考えないと測れないという例です。", "unverified": "10万通りのシミュレーションの結論の詳細は抄録の途中までしか確認できなかった。"}}, {"id": "pn25", "rank": 25, "field": "経営学", "headline": "ベンチャー投資は顧客資本の大きい企業を選ぶ", "title": "Venture Capital and Customer Capital", "url": "https://doi.org/10.3386/w35919", "authors": "Martin Aragoneses ほか", "venue": "NBER Working Paper", "apa": "Aragoneses, M., Jang, Y. S., & Sufi, A. (2026). Venture Capital and Customer Capital (NBER Working Paper No. 35919). National Bureau of Economic Research. https://www.nber.org/papers/w35919", "why": "販売・マーケティング費の大きい顧客資本集約型の企業にベンチャーキャピタルが特化していることを示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ", "preprint": true, "short": true, "p1": "ベンチャーキャピタルが、知識資本より「顧客資本」（販売・マーケティングで築く顧客基盤）の大きい企業に特化していることを示した（抄録）。", "p3": "売上に対する販売・マーケティング費、販売担当者の賃金、商標出願の傾向で顧客資本を測り、他の金融仲介者と比べた（抄録）。", "p5": "VCは知識資本が低く顧客資本が高い産業を狙い、企業は初回投資の前に顧客資本へ投資を傾け、その後急速に規模を拡大する。小口を多数に投じるVCは顧客資本産業を、多額を少数に投じるVCは知識資本産業を狙う。この傾向は過去30年の変化を反映する（抄録）。", "fun": "ベンチャー投資といえば、画期的な技術の研究開発を支えるイメージがあります。ところがこの研究によると、実際に好まれているのは、広告や営業で顧客を一気に増やす会社でした。大成功か失敗かの極端な結果が出やすい投資が、ベンチャーの「一発当てる」仕組みに合っているからだという説明が興味深いところです。", "unverified": "顧客資本の測定の妥当性の検討は抄録からは確認できなかった。"}}, {"id": "pn26", "rank": 26, "field": "経営学", "headline": "TRIPS後のインド製薬業の研究開発と競争", "title": "The Long March to Innovation: R&D and Competitive Evolution in the Indian Pharmaceutical Industry", "url": "https://doi.org/10.3386/w35916", "authors": "Chirantan Chatterjee ほか", "venue": "NBER Working Paper", "apa": "Chatterjee, C., Bhaskaran, A., & Higgins, M. J. (2026). The Long March to Innovation: R&D and Competitive Evolution in the Indian Pharmaceutical Industry (NBER Working Paper No. 35916). National Bureau of Economic Research. https://www.nber.org/papers/w35916", "why": "知的財産保護の強化がインド製薬業の研究開発と競争の進化に与えた影響を分析した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパー（書籍の章）の抄録を読んだ", "preprint": true, "short": true, "p1": "TRIPS協定後のインド製薬業で新薬の開発パイプラインが伸び悩んだのは、知的財産権の強さとは別の制約のためだと論じた（抄録）。", "p3": "Biomedtrackerの治験段階の移行データで、中国と英国を比較対象に段階間の移行を調べ、業界専門家への聞き取りで補強した（抄録）。", "p5": "インドの開発パイプラインは第1相から第2相への移行に詰まりがあり、第1相から第3相への移行では差がなかった。企業内では新規性の低い開発への移行が見られた（抄録）。", "fun": "特許を強く守れば、会社は安心して新薬開発に投資する、と教科書は教えます。しかしインドでは、特許を強めて20年たっても新薬開発は伸びませんでした。開発の途中の特定の段階でつまずいていることから、法律以外の壁があると論じています。制度だけ整えても技術は育たない、という教訓が読み取れます。", "unverified": "制約の具体的な中身（資金、人材など）は抄録からは確認できなかった。"}}, {"id": "pn27", "rank": 27, "field": "経営学", "headline": "フードデリバリーはコンビニの売上を奪わない", "title": "Online-Offline Synergy: Food Delivery and Convenience Stores", "url": "https://doi.org/10.2139/ssrn.7629759", "authors": "Ruomeng Cui ほか", "venue": "SSRN", "date": "2026-10-19", "apa": "Cui, R., Long, Y., Zheng, Z., Wang, W., Wei, H., & Tian, X. (2026). Online-Offline Synergy: Food Delivery and Convenience Stores. https://doi.org/10.2139/ssrn.7629759", "why": "オンラインの宅配プラットフォームの拡大がオフラインの小売に与える影響を調べ、相乗効果の可能性を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "フードデリバリーの普及がコンビニの売上を奪うのではなく、むしろ増やしうることを中国のデータで示した（抄録）。", "p3": "中国のサービス基盤との協力で54店のコンビニの数十品目の月次取引のパネルを作り、最大のデリバリー基盤の飲食店掲載データと結合して、二元固定効果と操作変数で因果効果を推定した（抄録）。", "p5": "地域のデリバリー飲食店が100店増えるとコンビニの売上は約6%増えた。その一因として在庫の減少（家での買い置きの消費）による仕組みを挙げている（抄録）。", "fun": "スマホで料理を頼めるようになると、コンビニでお弁当を買う人は減りそうです。ところが実際には、近所にデリバリーの店が増えるとコンビニの売上は伸びていました。出前と一緒に飲み物やお菓子を買い足すなど、生活の流れが変わるからかもしれません。ネットと実店舗が奪い合うだけではない関係が見えてきます。", "unverified": "もう一つの仕組みと品目別の効果は抄録の範囲では確認できなかった。"}}, {"id": "pn28", "rank": 28, "field": "経営学", "headline": "プラットフォームのデータの価値はどこから来るか", "title": "The Source of Data Value: Consumer Disclosure, Access Design, and Platform Monetization", "url": "https://arxiv.org/abs/2610.22864", "authors": "Hexiao Liu ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Liu, H., Lu, L., & Wang, M. (2026). The Source of Data Value: Consumer Disclosure, Access Design, and Platform Monetization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22864", "why": "消費者の情報開示とアクセス設計がプラットフォームのデータ販売収益を決める仕組みをモデル化した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "消費者の情報開示の権利が、プラットフォームの販売者向けデータサービスの収益化と厚生をどう左右するかをゲーム理論で分析した（抄録）。", "p3": "手数料型のプラットフォーム、差別化された2つの販売者、プライバシーを気にする消費者のモデルで、データの価値を販売者の売上増と情報を持つ競合からの脅威に分けた（抄録）。", "p5": "強制収集のもとでは、個別化が売上を下げても防衛的なデータ購入で収益化できる。任意開示では一方的な開示が魅力的でなく、独占的アクセスは使える情報を生まず防衛的な料金も消える。収益の整合は厚生の改善を保証しない（抄録）。", "fun": "ネット通販の会社は、手数料だけでなく「お客のデータ」を出店者に売って稼ぐこともあります。出店者がデータを買うのは、売上を伸ばすためだけでなく、ライバルに先を越されないための防衛でもあります。消費者に情報を出すかどうかを選ばせるルールにすると、この防衛のための商売が成り立たなくなる、という結論が面白いところです。", "unverified": "厚生が下がる条件の詳細は抄録からは確認できなかった。"}}, {"id": "pn29", "rank": 29, "field": "組織行動・心理的安全性", "headline": "FRB議長は時間をどう配分しているか", "title": "Inside Central Bankers’ Calendars: How Do Fed Chairs Allocate Their Time?", "url": "https://doi.org/10.3386/w35913", "authors": "Thomas Drechsel ほか", "venue": "NBER Working Paper", "apa": "Drechsel, T., & Tsakadze, D. (2026). Inside Central Bankers’ Calendars: How Do Fed Chairs Allocate Their Time? (NBER Working Paper No. 35913). National Bureau of Economic Research. https://www.nber.org/papers/w35913", "why": "中央銀行のトップの日程表を構築・分析し、指導者が限られた時間と注意をどう配分するかを示した。", "explain": {"basis": "抄録", "basis_note": "NBERワーキングペーパーの抄録を読んだ", "preprint": true, "short": true, "p1": "バーナンキ、イエレン、パウエルの3人のFRB議長の日程表（2万件超）を構築し、指導者が限られた時間をどう配分したかを分析した（抄録）。", "p3": "日々の予定表の記録を分類し、傾向と景気循環の頻度での変化を調べ、グリーンスパンなど以前の議長の資料とも比べた（抄録）。", "p5": "どの議長も記録された会合の30%超をFRBの職員と過ごした。メディアとの接触はバーナンキ期に増え、パウエルは前任者より議員との会合が有意に多かった（抄録）。", "fun": "世界で最も影響力のある経済の責任者は、毎日誰と会っているのでしょうか。2万件の予定を数えると、3割以上を部下のエコノミストとの打ち合わせに使っていました。最近の議長ほど政治家と会う回数が増えているという結果は、中央銀行が政治との距離に苦心している様子を映しています。", "unverified": "景気循環に応じた時間配分の変化の具体的な結果は抄録からは確認できなかった。"}}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "偽発見数の強く整合的な信頼包絡", "title": "On strongly coherent confidence envelopes for the false discoveries", "url": "https://arxiv.org/abs/2610.22601", "authors": "Romain P\\'erier ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Périer, R., Blanchard, G., & Durand, G. (2026). On strongly coherent confidence envelopes for the false discoveries (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22601", "why": "多重検定での整合性の概念を偽発見数の信頼包絡に拡張した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "多重検定での「整合性」だけでは手続きが改善不能であることを保証しないことを示し、より強い「強整合性」の概念を導入した（抄録）。", "p3": "偽陽性の数に対する信頼包絡について、文献で考えられてきた内挿による改善の仕組みを検討し、強整合性ならそれで改善できないことを示した（抄録）。", "p5": "Durand et al. (2020)の信頼包絡を一様に改善する、多項式時間で計算できる方法を与え、シミュレーションで改善を示した（抄録）。", "fun": "たくさんの仮説を一度に検定すると、偶然「当たり」に見えるものが混ざります。そこで「この中に間違いは何個以下」と幅で示す方法がありますが、この論文はその幅をまだ狭くできる場合があることを見つけ、改善の余地がない状態を厳密に定義しました。統計の道具を限界まで磨き上げる研究です。", "unverified": "改善の大きさの数値は抄録からは確認できなかった。"}}, {"id": "pn31", "rank": 31, "field": "統計学", "headline": "共形検定マルチンゲールの情報幾何的な死角", "title": "Information-Geometric Blind Spots of Conformal Test Martingales", "url": "https://arxiv.org/abs/2610.23131", "authors": "Johan Hallberg Szabadv\\'ary", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Szabadváry, J. H. (2026). Information-Geometric Blind Spots of Conformal Test Martingales (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23131", "why": "交換可能性の逐次検定に使う共形検定マルチンゲールが検出できない対立仮説の構造を情報幾何で示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "逐次的に交換可能性を検定する共形検定マルチンゲールには、適合度関数の像を変えない分布の変化を検出できない「死角」があることを情報幾何で定式化した（抄録）。", "p3": "適合度関数Aによる同値類を定義し、任意の目標分布に対しKLダイバージェンスで最も近い元（A-暗号的I射影）が一意に存在し、検出可能な成分と隠れた成分にピタゴラス分解できることを示した（抄録）。", "p5": "Aがネイマン-ピアソンの尤度比なら隠れた成分は消える。EMNISTの文字をMNISTの数字と同じ適合度スコアになるよう再標本化すると、支持が完全に異なる分布に変えても検定は反応しなかった（抄録）。", "fun": "データの性質が途中で変わったら知らせてくれる見張り役の統計手法があります。ところが、見張りが見ている「点数」さえ同じなら、中身が数字から文字にすっかり入れ替わっても気づかない、という盲点をこの論文は示しました。何を見張るかを選んだ時点で、見えないものが決まってしまうという教訓です。", "unverified": "実験での検定統計量の推移の具体的な値は抄録からは確認できなかった。"}}, {"id": "pn32", "rank": 32, "field": "統計学", "headline": "重い裾の応答に頑健な局所フレシェ回帰", "title": "Robust Local Fr\\'echet Regression: Nonasymptotic Theory and Minimax Optimality", "url": "https://arxiv.org/abs/2610.23757", "authors": "Chang Jun Im ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Im, C. J., & Kurisu, D. (2026). Robust Local Fréchet Regression: Nonasymptotic Theory and Minimax Optimality (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23757", "why": "一般の距離空間に値をとる重い裾の応答に対する頑健な局所回帰を提案し、非漸近理論と最適性を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "一般の距離空間に値をとる重い裾の応答に対し、頑健な局所フレシェ回帰と距離に基づく中央値平均推定量を提案し、非漸近理論と最適性を示した（抄録）。", "p3": "局所的な2次の滑らかさと局所的な1-Wasserstein Hölder連続性のもとで、それぞれ高確率の点ごとの誤差上界を導き、ガウス回帰の部分クラス上でミニマックス下界を示した（抄録）。", "p5": "最適化した収束速度は古典的なノンパラメトリック回帰の点ごとの速度と一致し、応答空間のエントロピー条件を必要としない。正定値行列やWasserstein値の応答で頑健性と効率のトレードオフを示した（抄録）。", "fun": "普通の回帰分析は数値を予測しますが、世の中には行列や確率分布そのものを予測したい場面もあります。しかも、ときどき極端に外れた値が混ざると、平均を使う方法は大きく狂ってしまいます。この研究は、データをいくつかの組に分けて平均を取り、その中央値を使うという工夫で、外れ値に強い方法を作りました。", "unverified": "実データの応用の内容は抄録からは確認できなかった。"}}, {"id": "pn33", "rank": 33, "field": "統計学", "headline": "立て続けに起きる変化点を検出する", "title": "Closely spaced change-point detection with an application to geopolitical shocks in oil and gas markets", "url": "https://arxiv.org/abs/2610.23476", "authors": "Nachiketas Waychal ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Waychal, N., Laha, A. K., & Sinha, A. (2026). Closely spaced change-point detection with an application to geopolitical shocks in oil and gas markets (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23476", "why": "短い間隔や標本の端で起きる変化点の見落としを減らす検出法を提案し、石油・ガス市場に適用した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "立て続けに起きる変化点や標本の端の近くの変化点を見落としにくくする検定統計量I_1とアルゴリズムDCIを提案した（抄録）。", "p3": "ガウス雑音のもとでI_1の帰無分布の極限を導き、弱従属系列に拡張し、平均シフトの対立仮説での一致性を示した。大域的な走査と適応幅の窓での局所検定を組み合わせる二段階の算法を作った（抄録）。", "p5": "シミュレーションで真陽性・偽陽性・位置の誤差・分割の被覆の基準でパレート最適だった。2026年の米イラン紛争への応用で、エネルギー市場の地政学的ショックへの感応を新しい2つの指標で定量化した（抄録）。", "fun": "相場が急変した時点を見つけるのは統計の得意分野ですが、大事件が短い間隔で続くと、間に挟まれたデータが少なすぎて変化を見逃しがちです。この研究は、全体を見渡す方法と局所を細かく調べる方法を組み合わせ、続けざまの変化も拾えるようにしました。", "unverified": "応用で得られた具体的な変化点の時期は抄録からは確認できなかった。"}}, {"id": "pn34", "rank": 34, "field": "統計学", "headline": "多重共線性下の予測強化型リッジ推定", "title": "Prediction-powered ridge estimation under multicollinearity", "url": "https://doi.org/10.2139/ssrn.7634887", "authors": "Yongchang Hui ほか", "venue": "SSRN", "date": "2026-10-19", "apa": "Hui, Y., Li, X., Liu, Y., & Wong, W.-K. (2026). Prediction-powered ridge estimation under multicollinearity. https://doi.org/10.2139/ssrn.7634887", "why": "補助的な予測を利用する推論と、多重共線性に対するリッジ推定を組み合わせた。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "機械学習などの補助的な予測を使う予測強化型推定に、多重共線性に強いリッジ罰則を組み合わせたPP-Ridgeを提案した（抄録）。", "p3": "予測成分と補正成分に共通のリッジ罰則をかけ、母集団のリッジの目標値を保つ。漸近正規性を示し、標本サイズ比と予測の系統誤差によって分散が小さくなる十分条件を導いた（抄録）。", "p5": "有限標本での改善は予測の質に依存し、さまざまな共線性と罰則の水準で持続した。マクロ経済への応用では回帰誤差の低下と係数の安定性が記述的に示された。一様な優越は主張しない（抄録）。", "fun": "説明変数どうしがよく似ていると、回帰係数がぐらついて解釈しにくくなります。一方、手元のラベル付きデータが少なくても、AIの予測を補助に使えば推定を安定させられます。この研究は二つの工夫を組み合わせ、どんな条件なら得をするかを理論で示しました。", "unverified": "マクロ経済への応用の対象と数値は抄録からは確認できなかった。"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "GPT-6-Astraは身体知能に到達したか", "title": "Has GPT-6-Astra Achieved Embodied Intelligence?", "url": "https://arxiv.org/abs/2610.22471", "authors": "SenseNova ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-19", "apa": "SenseNova, Team, J. R., : Cai, Z., Cao, Z., Chen, T., Chua, H. C., Dai, L., Deng, H., Deng, H., Diao, H., Ding, C., Fan, W., Fu, X., Gong, Z., Gu, C., He, Z., Hou, Z., Li, B., … Zuo, J. (2026). Has GPT-6-Astra Achieved Embodied Intelligence? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22471", "why": "最新モデルのロボット操作と移動の能力を評価し、身体性を持つ知能の従来の考え方を問い直した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録を読んだ", "preprint": true, "short": true, "p1": "大規模モデルGPT-6-Astraのロボット操作と移動の能力を大規模に評価し、身体性を持つ知能の研究に何を意味するかを論じた報告（抄録）。", "p3": "卓上操作、人型、移動体、多指ハンドにわたる12のベンチマークを、学習デモからの文脈内学習と実行ステップの大幅な増加を許す統一プロトコルで評価し、高レベルの推論器と低レベルの制御器の協調や8種のロボット構成での実機展開も調べた（抄録）。", "p5": "統一プロトコルでかつてない性能を示した一方、文脈内学習の一般性、コストと時間、物理状態の確認、不可逆な失敗からの回復、長期の進捗の保持に課題が残り、実機展開では大きな隔たりがあった（抄録）。", "fun": "これまでロボットは、作業ごとに専用のAIを訓練するのが当たり前でした。ところが言葉を扱う汎用の大規模モデルに、見本を数個見せるだけで多くのロボット作業をこなせるようになってきました。それでも、実際のロボットではうまくいかない場面が多く、取り返しのつかない失敗から立ち直る力がまだ足りないという指摘が重要です。", "unverified": "ベンチマークごとの成功率の数値は抄録からは確認できなかった。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "VLMが3D空間で考え探索することを学ぶ", "title": "Learning to Think and Explore in 3D World", "url": "https://arxiv.org/abs/2610.21783", "authors": "Yijiang Li ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-19", "apa": "Li, Y., Wang, B., & Vasconcelos, N. (2026). Learning to Think and Explore in 3D World (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21783", "why": "視覚言語モデルが多視点画像を与えられずに3D空間を能動的に探索し推論する学習方法を示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録を読んだ", "preprint": true, "short": true, "p1": "視覚言語モデルが、1枚ずつの視点画像から自分で動いて3D空間を探索し、質問に答えることを学ぶ方法ACT3Dを示した（抄録）。", "p3": "3D表現を環境として扱い、モデルは一人称の初期視点から推論・移動・向き変えを繰り返して最終回答を出す。軌跡の教師ありの微調整のあと、最終回答の正しさを主な報酬とする強化学習で探索方針を学ばせた（抄録）。", "p5": "6つの3Dベンチマークで平均正答率53.2%を達成し、基盤のQwenモデルを22.0%上回り、Gemini 3.6 Flashも上回った。既存のオープンな3D手法より50〜70%少ない入力で優れていた（抄録）。", "fun": "部屋の様子を答えるとき、人は全方向の写真を一度に見るのではなく、少しずつ歩き回って確かめます。このAIも同じように、1枚ずつ景色を見ながら自分で動き回ることを学びました。しかも「どこを見るべきか」は誰も教えておらず、正解できたかどうかだけから探索のコツを身につけた点が面白いところです。", "unverified": "探索の歩数と効率の詳細は抄録からは確認できなかった。"}}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "長期タスクのエージェントにオブジェクト指向の文脈を", "title": "Pack Light, CarryOn: Building Object-Oriented Context for Long-Horizon Agents", "url": "https://arxiv.org/abs/2610.18784", "authors": "Yuchen Lu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-19", "apa": "Lu, Y., McAuley, J., & Zhang, L. (2026). Pack Light, CarryOn: Building Object-Oriented Context for Long-Horizon Agents (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2610.18784", "why": "長い作業を行うエージェントの履歴をオブジェクト指向の文脈として構造化し、効率を高める方法を提案した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録を読んだ", "preprint": true, "short": true, "p1": "長時間作業するエージェントの文脈を、過去の履歴ではなく再利用できる「進捗のオブジェクト」を中心に組み立てる実行環境CarryOnを提案した（抄録）。", "p3": "継続のための記録、補完的な実行文脈、直近のやりとりから文脈を作り、履歴を捨てたあとも、影響を受けた記録だけを証拠と環境の確認で更新し、残りは引き継ぐ（抄録）。", "p5": "OSWorld 2.0とBrowseComp-Plusで成績がそれぞれ5.8%と7.0%向上し、総トークン使用量を51.9%と22.9%減らした（抄録）。", "fun": "長い作業をしていると、「何をしてきたか」の記録がどんどん増えて、読み返すだけで大変になります。このAIは、経緯を全部覚えておく代わりに、「今どこまでできているか」を整理した荷物だけを持ち運ぶようにしました。旅行の荷物を軽くまとめるように、記憶を身軽にして成績も上げた点が面白いところです。", "unverified": "記録の更新に失敗した場合の影響は抄録からは確認できなかった。"}}, {"id": "pn38", "rank": 38, "field": "機械学習", "headline": "同じモデルの追加計算は独立な証拠ではない", "title": "Not All Test-Time Compute Is Evidence: Model-Specific Bias in LLM Reasoning", "url": "https://arxiv.org/abs/2610.23213", "authors": "Ming Shen ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Shen, M., & Yao, T. (2026). Not All Test-Time Compute Is Evidence: Model-Specific Bias in LLM Reasoning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23213", "why": "推論時の計算を増やす手法が前提とする独立性が、モデル固有の偏りで崩れることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "同じ推論モデルに計算を追加しても誤りが相関するため独立な証拠にならないことを示し、不一致のときだけ異なるモデルに独立に解かせる方法DIAを提案した（抄録）。", "p3": "推論の途中段階と最終段階の予測の不一致を不安定さの信号とし、そのときだけ異種のモデルの小さなパネルに、候補を見せずに独立に解かせて答えを集計する（抄録）。", "p5": "7つのベンチマークと2つの基盤モデルで、14条件中12で完全な思考連鎖を上回り、MuSiQueで7.00%向上した。発動は約17%の問題だけで、多エージェントの比較手法よりトークンを最大47.2%減らした（抄録）。", "fun": "同じ人に何度考え直させても、同じ思い込みで同じ間違いをすることがあります。AIも同じで、たくさん考えさせても独立した意見にはなりません。この研究は、AIが迷っているときだけ別のAIたちに相談させるという、人間の「セカンドオピニオン」に似た発想で精度と効率を両立させました。", "unverified": "不一致の判定基準の詳細は抄録からは確認できなかった。"}}, {"id": "pn39", "rank": 39, "field": "機械学習", "headline": "言語モデルが言語モデルの改良を学ぶ", "title": "Language Models Learn to Improve Language Models", "url": "https://arxiv.org/abs/2610.23344", "authors": "Minhua Lin ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Lin, M., Wang, Z., Liu, Z., Weng, Z., He, B., Shi, Z., Dumoulin, B., Zhang, X., Wang, S., & Lu, H. (2026). Language Models Learn to Improve Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23344", "why": "LLMにLLM開発の研究を自動化させる試みとして、言語モデル自身が言語モデルの改良を学ぶ方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "LLMに強化学習で「言語モデルの改良案」を出させる方法LM2LMを提案し、高価な実験の代わりに研究世界モデルを報酬に使う仕組みを作った（抄録）。", "p3": "凍結したLLMに実際の実験記録を文脈として与え、改良案の効果を予測させる研究世界モデル（RWM）を報酬モデルとし、方策の分布のずれによる過大評価を防ぐため、RWMが高く評価した案を定期的に実際に実行して記録に加える（抄録）。", "p5": "本物の評価では1案あたり約10 GPU時間、数万案で数十万GPU時間かかることを動機としている。性能の向上幅は抄録の範囲では確認できなかった（抄録）。", "fun": "AIにAIの改良法を考えさせ、うまくいったら褒めて伸ばす。理想的ですが、案を一つ試すたびに大きなモデルを訓練し直すので、とても高くつきます。そこで「この案ならこれくらい良くなりそう」と予想する別のAIを審判に使い、ときどき本当に試して審判の目を正すという工夫をしています。AIが自分で研究する未来への一歩です。", "unverified": "改良案の実際の効果の数値は抄録からは確認できなかった。"}}, {"id": "pn40", "rank": 40, "field": "機械学習", "headline": "線形プローブで読めても線形表現とは限らない", "title": "Is a Linear Probe Evidence of a Linear Representation?", "url": "https://arxiv.org/abs/2610.22655", "authors": "Nadir Kutluozen ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Kutluozen, N., Internò, C., & Klindt, D. (2026). Is a Linear Probe Evidence of a Linear Representation? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22655", "why": "線形プローブの成功を線形表現の証拠とみなす慣行を検証し、その解釈の限界を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "線形プローブ（特徴から属性を線形に読み出す分類器）の高い精度は、モデルが属性を線形に表現している証拠として不十分であることを示した（抄録）。", "p3": "十分に豊かな特徴写像ならランダムなものでも線形の読み出しを許すため、真の線形な世界モデルと、潜在変数が大きな曲がった多様体の中に線形に乗る「カーネル機械」とを区別できない。逆予測性、スペクトルの集中、分布外汎化の3つの非対称な診断を提案した（抄録）。", "p5": "正解が分かるシミュレーションで診断を検証し、6つの事前学習済み視覚Transformerに生成的ベンチマークSVG-Worldで適用した。CelebAでも、事前学習がランダム特徴を超える構造を生むことを示したとしている（抄録）。", "fun": "AIの頭の中に「笑顔の度合い」のような概念がまっすぐ並んでいるかを調べるとき、直線で読み取れたら「ある」と判断するのが定番でした。ところが、でたらめな特徴でも量が多ければ直線で読めてしまうことがあります。この論文は、本当に整理されて並んでいるのか、たまたま読めただけなのかを見分ける方法を示しました。", "unverified": "各診断の具体的な結果は抄録の範囲では確認できなかった。"}}, {"id": "pn41", "rank": 41, "field": "機械学習", "headline": "生成的な組織でエージェントの知能を育てる", "title": "OfficeTown: Generative Organizations for Evolving Agent Intelligence", "url": "https://arxiv.org/abs/2610.23194", "authors": "Hongchen Wei ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-19", "apa": "Wei, H., Ying, D., Hong, Z., Wu, A., Liu, B., Ma, R., Yang, Y., Dai, Q., Qiu, K., Xu, R., Chen, D., Chen, Z., & Luo, C. (2026). OfficeTown: Generative Organizations for Evolving Agent Intelligence (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23194", "why": "ファイルやツールを使う専門的な作業を、組織の文脈ごと生成した環境でエージェントに学ばせる。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録を読んだ", "preprint": true, "short": true, "p1": "組織の目的と活動の説明文から仮想の職場を生成し、継続する業務の中でエージェントを評価・学習させる枠組みOfficeTownを作った（抄録）。", "p3": "生成された組織の構成員が仕事を調整し、補助エージェントに限定的な業務を委ね、成果物をレビューする。成果物・決定・未解決事項が残って後の仕事を形づくり、責任と権限で見えるものとできることが決まる（抄録）。", "p5": "8分野23組織から406課題と4,836の評価基準を持つOfficeTown Benchを作り、最先端モデルにも大きな改善の余地があった。このデータでの微調整と蒸留はQwen3.5-9Bの外部の専門業務ベンチマークの成績を大きく改善した（抄録）。", "fun": "会社の仕事は、一つ一つの作業が独立しているわけではなく、前の会議の決定や過去の資料、上司のコメントの積み重ねの上に成り立っています。この研究は、そうした「職場の文脈」ごと仮想の会社を作り出し、AIにそこで働かせて鍛えようとしています。AIの評価を、単発のテストから職場での働きぶりへ広げる発想です。", "unverified": "改善の具体的な数値は抄録からは確認できなかった。"}}, {"id": "pn42", "rank": 42, "field": "因果推論", "headline": "ベイズモデル平均で縦断的な処置効果を推定", "title": "A Bayesian model averaging approach for estimating longitudinal treatment effects", "url": "https://arxiv.org/abs/2610.23578", "authors": "David Adenyo ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Adenyo, D., Schnitzer, M. E., Guertin, J. R., & Talbot, D. (2026). A Bayesian model averaging approach for estimating longitudinal treatment effects (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23578", "why": "縦断データの平均処置効果の推定で、交絡変数の選択をベイズモデル平均で扱う方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "縦断的な処置（時間とともに変わる処置）の因果効果を推定するとき、調整変数の選択をベイズモデル平均で行う方法を提案した（抄録）。", "p3": "縦断的な処置の方針のもとでの反実仮想の平均と周辺構造モデルのパラメータを、ベイズモデル平均で推定し、分散が最小になる調整変数の集合を選びやすい情報事前分布を設計した（抄録）。", "p5": "シミュレーションで全変数を調整する推定量を上回り、いくつかの場面で神託推定量に近い性能だった。スタチンの累積曝露の実データでは標準誤差が大きく減った（抄録）。", "fun": "薬を何年も飲み続けた効果を調べるとき、年齢や持病など調整すべき要因が時間とともに変わり、どれを考慮すべきか迷います。全部入れると推定がぶれやすく、減らしすぎると偏ります。この研究は、いろいろな選び方の結果を確率の重みで平均するという方法で、偏りを抑えつつ推定を安定させました。", "unverified": "実データでの効果推定値は抄録からは確認できなかった。"}}, {"id": "pn43", "rank": 43, "field": "因果推論", "headline": "条件付き独立を超える因果探索の識別と推論", "title": "Causal Discovery beyond Conditional Independence: Identifiability, Algorithms, and Statistical Inference for Directed Acyclic and Cyclic Graphs", "url": "https://arxiv.org/abs/2610.23543", "authors": "Yang Ni", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Ni, Y. (2026). Causal Discovery beyond Conditional Independence: Identifiability, Algorithms, and Statistical Inference for Directed Acyclic and Cyclic Graphs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23543", "why": "非巡回・巡回グラフについて、条件付き独立以外の仮定による因果構造の識別、算法、統計的推論を体系化した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ（総説）", "preprint": true, "short": true, "p1": "条件付き独立性を超える性質を使う現代の因果探索の方法を、識別の源・推定量・計算の実装に分けて体系化した総説（抄録）。", "p3": "分布の非対称性、条件付きモーメント制約、環境や個体間の変動を条件付き独立の方法と結び、潜在交絡やフィードバック（巡回グラフ）のもとでの探索、一致性と不確実性の定量化と算法の保証を区別して整理した（抄録）。", "p5": "同じ観測分布でもモデルのクラスによって異なる結論が支持されうることを例で示し、方法を比較するための指針を示した（抄録）。", "fun": "データから「何が原因で何が結果か」を見つけるのは、統計の中でも特に難しい問題です。昔は「この二つは他を固定すると無関係」という手がかりに頼っていましたが、最近は分布の形の左右非対称さや、環境による変化なども使われます。この総説は、何を仮定すると何が言えるのかを整理し、手法を正しく比べる地図を描いています。", "unverified": "総説であり、新しい実証結果は含まれないと考えられる（抄録の範囲）。"}}, {"id": "pn44", "rank": 44, "field": "因果推論", "headline": "関数型アウトカムで処置効果の異質性を検定", "title": "Testing Treatment Effect Heterogeneity with Functional Outcomes", "url": "https://arxiv.org/abs/2610.23397", "authors": "Yongzhen Feng ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Feng, Y., Li, J., & Song, X. (2026). Testing Treatment Effect Heterogeneity with Functional Outcomes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23397", "why": "時間や空間に沿った関数として観測される結果について、処置効果の異質性を検定する方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "時間に沿った関数として観測される結果について、処置効果の異質性を、共通の効果を推定せずに検定するノンパラメトリックな方法を提案した（抄録）。", "p3": "群内の差の分布を比べることで未知の共通関数効果を消し、特性汎関数の積分二乗不一致で差を測る。重なる差の依存を考慮した不偏一般化U統計量を作り、帰無・固定対立・局所対立での極限と乗数ブートストラップを導いた（抄録）。", "p5": "多群への拡張と、ランダム方向の近似と9状態の再帰による標本サイズに線形の計算量を示した（抄録）。", "fun": "薬の効き目が一日の中で時間とともに変わる場合、「効果は人によって違うのか」を調べるのは難しくなります。この方法は、同じ群の中の二人の差を比べるという工夫で、平均的な効果の形を知らなくても、人による違いがあるかを検定できます。未知のものを推定せずに消してしまう、という発想が巧みです。", "unverified": "シミュレーションと実データでの検出力は抄録からは確認できなかった。"}}, {"id": "pn45", "rank": 45, "field": "交通・都市計画", "headline": "メキシコシティの交通投資がもたらした外部性", "title": "Externalities of Mexico City's 2018-2024 Mobility Program", "url": "https://doi.org/10.2139/ssrn.7631339", "authors": "David Antonio Ortega Alfaro", "venue": "SSRN", "date": "2026-10-19", "apa": "Ortega Alfaro, D. A. (2026). Externalities of Mexico City’s 2018-2024 Mobility Program. https://doi.org/10.2139/ssrn.7631339", "why": "2018〜2024年の公共交通インフラへの大規模投資の外部効果を評価した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "メキシコシティの2018〜2024年の公共交通への投資と地下鉄の閉鎖が、周辺の道路事故に与えた影響を推定した（抄録）。", "p3": "歴史的に周縁化された地域に新しいバス路線・ロープウェイ・トロリーが開業し、保守のため地下鉄が閉鎖された状況を使い、差の差の設計とマッチングで影響を受けた地域の事故報告を比べた（抄録）。", "p5": "地下鉄の閉鎖は道路事故を20%増やし、マッチングでも結果は頑健だった。開業と閉鎖の双方に統計的に有意な効果があり、開業は事故を減らしたとしている（抄録）。", "fun": "地下鉄が止まると、乗っていた人はバスや車、自転車に移ります。すると道路が混み、事故も増えるかもしれません。この研究は、工事による閉鎖を「自然の実験」として使い、事故が2割増えたことを示しました。公共交通の価値は、乗る人の便利さだけでなく、道路の安全にも及ぶことが分かります。", "unverified": "開業による減少の大きさは抄録の途中までしか確認できなかった。"}}, {"id": "pn46", "rank": 46, "field": "交通・都市計画", "headline": "生成エージェントの都市移動を実調査に合わせる", "title": "Towards Adaptive and Real-Survey-Aligned Simulated Urban Mobility Behaviour of Generative Agents", "url": "https://arxiv.org/abs/2610.22407", "authors": "Yves Bru ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Bru, Y., Oberoi, K. S., & Gaudou, B. (2026). Towards Adaptive and Real-Survey-Aligned Simulated Urban Mobility Behaviour of Generative Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22407", "why": "生成エージェントによる多手段の都市移動シミュレーションを、実際の調査に整合させる方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "トゥールーズの日常の多手段移動のエージェントモデルで、LLMの生成エージェントの交通手段の選択を実際の世帯交通調査に合わせられるかを調べた（抄録）。", "p3": "単純な基準、調査に当てはめたモデル、最小限と調整済みのプロンプトの生成エージェント、型付き分類器など15の意思決定器を、実際の世帯交通調査に対して比較した（抄録）。", "p5": "比較の結果は抄録の範囲では確認できなかった。", "fun": "街の交通をコンピュータで再現するとき、人の乗り物の選び方は、調査票にある項目だけで決めるのが普通でした。でも実際は、天気や気分、その日の予定など、調査に書かれない理由でも選んでいます。言葉で考えるAIの住人なら、そうした理由も持ち込めるかもしれない、という期待を実データで確かめる試みです。", "unverified": "15の意思決定器の比較結果は抄録からは確認できなかった。"}}, {"id": "pn47", "rank": 47, "field": "交通・都市計画", "headline": "ハイブリッド勤務時代の通勤の逆説", "title": "The Commute Paradox -How Urban and Sustainable Offices Shape Commutes in the Hybrid-Work Era", "url": "https://doi.org/10.2139/ssrn.7631378", "authors": "Avis Devine ほか", "venue": "SSRN", "date": "2026-10-19", "apa": "Devine, A., & Wang, C. (2026). The Commute Paradox -How Urban and Sustainable Offices Shape Commutes in the Hybrid-Work Era. https://doi.org/10.2139/ssrn.7631378", "why": "持続可能で都心にあるオフィスへの集中が、ハイブリッド勤務下の通勤に与える影響を調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を読んだ", "preprint": true, "short": true, "p1": "在宅・ハイブリッド勤務の時代に、持続可能で都市的なオフィスが通勤距離をどう変えたかをカナダのデータで調べた（抄録）。", "p3": "独自のオフィス市場・環境認証・移動のデータを組み合わせ、2021年半ばのオフィス再開後の通勤距離の変化を三重差分で推定し、トロントとカルガリーの事例で換算した（抄録）。", "p5": "環境認証の建物がある地域は床面積あたりの訪問が有意に多かった。在宅勤務の多い地域では通勤距離が減ったが、都市的で持続可能な特徴はこの減少のほとんど、または全部を打ち消した（抄録）。", "fun": "在宅勤務が広がれば、通勤の距離や回数は減るはずです。ところが、おしゃれで環境に配慮したオフィスが集まる地域では、人々が遠くからでもそこへ通うようになり、通勤距離の減少が帳消しになっていました。環境に良いビルが、結果として移動を増やすという逆説がタイトルの由来です。", "unverified": "事例での追加走行距離の数値は抄録からは確認できなかった。"}}, {"id": "pn48", "rank": 48, "field": "ヒューマンコンピュータインタラクション", "headline": "YouTubeの誘惑を自分で選んで制限するUI", "title": "SwitchTube: A Proof-of-Concept System Introducing \"Adaptable Commitment Interfaces\" as a Tool for Digital Wellbeing", "url": "https://arxiv.org/abs/2610.22947", "authors": "Kai Lukoff ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Lukoff, K., Lyngs, U., Shirokova, K., Rao, R., Tian, L., Zade, H., Munson, S. A., & Hiniker, A. (2026). SwitchTube: A Proof-of-Concept System Introducing \"Adaptable Commitment Interfaces\" as a Tool for Digital Wellbeing (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22947", "why": "利用者が事前に関与の度合いを選べる「適応的コミットメント・インターフェース」をデジタルwell-beingのために提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "YouTubeで「集中」と「探索」の画面を利用者が切り替えられる「適応的コミットメント・インターフェース」のアプリSwitchTubeを作り、実地で評価した（抄録）。", "p3": "検索優先の集中モードと推薦優先の探索モードを切り替えられるモバイルアプリを開発し、米国の46人で3週間の実地展開を行った（抄録）。", "p5": "切り替えられることで、利用者の主体感、満足度、目的との一致が高まった（抄録）。", "fun": "勉強のためにYouTubeを開いたのに、おすすめ動画につられて気づけば1時間、という経験は多くの人にあるでしょう。おすすめを全部消すと、今度は必要な動画まで見つけにくくなります。この研究は、自分でモードを切り替えるだけで、誘惑とうまく付き合えることを示しました。禁止より選択という発想が面白い点です。", "unverified": "効果の大きさと統計的な検定の結果は抄録からは確認できなかった。"}}, {"id": "pn49", "rank": 49, "field": "ヒューマンコンピュータインタラクション", "headline": "VRでLLMの応答待ちをどう感じさせないか", "title": "Wait for It: A Component-Level Analysis of Latency Feedback Mechanisms for LLM Agents in VR", "url": "https://arxiv.org/abs/2610.23336", "authors": "Pratham Arora ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Arora, P., Lodha, A., & Siddharth, S. (2026). Wait for It: A Component-Level Analysis of Latency Feedback Mechanisms for LLM Agents in VR (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23336", "why": "VR内のLLMエージェントの応答遅延に対するフィードバックの仕組みを構成要素ごとに評価した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "VR内のLLMエージェントの応答待ちに対する3種類のフィードバック（言葉のつなぎ、読み込み表示、考える身振り）を比べ、身振りが最も良いことを示した（抄録）。", "p3": "18人の参加者内実験で、「えーと」などの言葉、ローディングの回転表示、考えるアニメーションを個別に比較した（抄録）。", "p5": "身振りは読み込み表示より多くの面で有意に優れ、エージェントをより生き生きと社会的に感じさせた。読み込み表示は人間らしさを下げ、没入を壊した（抄録）。", "fun": "話し相手が考えている間、くるくる回る読み込みマークが出ると、急に「これは機械だ」と思い出してしまいます。一方、腕を組んで考え込むしぐさなら、相手が考えている感じがして会話が続きます。待ち時間そのものではなく、待ち時間の見せ方で相手の人間らしさが変わるという発見が面白いところです。", "unverified": "参加者が18人と少なく、効果量は抄録からは確認できなかった。"}}, {"id": "pn50", "rank": 50, "field": "ヒューマンコンピュータインタラクション", "headline": "AIは開発者に何を新しく可能にしたか", "title": "\"To Boldly Go Where No One Has Gone Before\" What Has AI Let Developers Unlock?", "url": "https://arxiv.org/abs/2610.23708", "authors": "Rudrajit Choudhuri ほか", "venue": "arXiv", "date": "Mon, 19 Oct 2026", "apa": "Choudhuri, R., Butler, J. L., Bird, C., Badea, C., Houck, B., & Sarma, A. (2026). \"To Boldly Go Where No One Has Gone Before\" What Has AI Let Developers Unlock? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.23708", "why": "AIの価値を作業の速さではなく、開発者が新たに手がけられるようになったことで測る視点を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "AIの価値を作業の速さではなく「新しく何ができるようになったか」で測るため、Microsoftの開発者331人の回答を分析した（抄録）。", "p3": "AIで以前はできなかった何ができるようになったかを尋ね、人が介在する複数モデルのAI評議会を使った省察的主題分析で回答を分析し、ヴィゴツキーの発達の最近接領域の考え方で解釈した（抄録）。", "p5": "慣れた作業を速くする（45%）、以前は手が届かなかった作業に取り組む（36.9%）、AIエージェントのために作り指示する新しい種類の仕事（12.4%）に分かれた。AIは自分の仕事を確実に判断するより速く技能を提供するため、開発者がその差を埋め続ける必要があるとした（抄録）。", "fun": "電気が工場にもたらした本当の価値は、蒸気機関の時代の機械を速く回したことではなく、工場の作り方そのものを変えたことでした。この論文はAIも同じだと考え、「速くなった」だけでなく「できなかったことができるようになった」を数えました。AIの腕前に人間の判断力が追いつけるかが分かれ道だという指摘が鋭いところです。", "unverified": "二つの道の結論部分は抄録の途中までしか確認できなかった。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "走行車両の振動で鉄道橋の洗掘を機械学習で検出", "title": "Leveraging Bridge Scour Detection by Multi-Model Machine Learning and Drive-By Data", "url": "https://doi.org/10.3390/s26206612", "authors": "Sinem Tola ほか", "venue": "Sensors", "date": "2026-10-19", "citescore": 9.4, "citescore_year": "2025", "apa": "Tola, S., Tinoco, J., OBrien, E. J., & Matos, J. C. (2026). Leveraging Bridge Scour Detection by Multi-Model Machine Learning and Drive-By Data. Sensors, 26(20), 6612. https://doi.org/10.3390/s26206612", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "営業列車に載せた軌道計測装置のデータを模擬し、機械学習で鉄道橋の洗掘（支点の剛性低下）を橋ごとに判別できることを、数値的に示した（抄録）。", "p2": "洗掘は橋梁の重大な損傷要因だが、水中の基礎の点検は難しい。営業列車の計測（ドライブバイ）で橋の状態をふるい分けられれば有用だが、どの特徴と分類器が有効かは体系的に調べられていなかった（抄録）。", "p3": "営業列車に設置した車軸から離れた位置の計測器（Rail Infrastructure Alignment Acquisition）が取得する軌道形状を模擬した合成の列車通過データを作り、支点剛性の低下を与えた。離散ウェーブレット変換の特徴と、ARXモデルから得たインパルス応答のマルコフパラメータの特徴で、ANN、ランダムフォレスト（RF）、SVMに健全・損傷の二値分類をさせた（抄録）。直観：洗掘で支点が柔らかくなると、橋上の軌道の変形の仕方が変わり、それが通過ごとの計測波形に現れる。", "p4": "情報漏れのない入れ子型のブロック交差検証で、正解率と平衡正解率を比べ、通過回数のまとめ方（バッチサイズ）、センサの向き、クラスの均衡化、特徴の重要度、特徴群の除去（アブレーション）を調べた（抄録）。", "p5": "RFが全体の正解率で最高、後部設置で7回通過をまとめた場合はANNが平衡正解率で最高だった。バッチサイズの効果は単調でなく、短い窓で改善する構成がある一方、長い窓では健全クラスの認識が下がった。センサの向きは性能と特徴の感度に影響したが、どちらかが常に優れることはなかった（抄録）。", "p6": "著者は、結果は採用したシミュレーション条件での数値的な実現可能性を示すもので、現場での検証後に橋の状態のふるい分けに役立つ可能性があるとする（抄録）。解釈：路面凹凸や車両の違い、温度などの環境変動が実データでは判別を難しくしうる点は未検証である。", "fun": "川底が削られて橋脚の足元が弱る「洗掘」は、水の中なので目で見て点検するのが難しい損傷です。この研究は、毎日走っている列車にセンサを付けておけば、橋を渡るときの揺れ方の変化から足元の弱りを見つけられるかもしれない、とコンピュータ上で確かめました。点検のために特別な車両を走らせなくても、普段の運行がそのまま健康診断になるという発想です。", "unverified": "正解率の具体的な数値と、模擬した橋と列車の条件は本文を入手できず確認できなかった。"}}, {"id": "jr02", "rank": 2, "headline": "内部統制の弱い銀行ほど住宅ローン不正が多い", "title": "Internal Control over Financial Reporting and Mortgage Fraud", "url": "https://doi.org/10.2308/tar-2024-0214", "authors": "Yiwei Dou ほか", "venue": "Accounting Review", "date": "2026-10-19", "sjr": 4.403, "citescore": 7.5, "citescore_year": "2025", "apa": "Dou, Y., Wang, D., & Wu, X. (2026). Internal Control over Financial Reporting and Mortgage Fraud. The Accounting Review, 1–32. https://doi.org/10.2308/tar-2024-0214", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "銀行の財務報告に係る内部統制の不備が、住宅ローン申請での所得の不正な水増しと結びついていることを、地域単位の所得の乖離という新しい不正の指標で示した（抄録）。", "p2": "住宅ローン不正は2008年の金融危機の主因の一つだったが、銀行の内部統制の質が不正をどの程度抑えるのかは、不正そのものを測りにくいため実証が難しかった（抄録）。", "p3": "住宅ローン申請で報告された所得の地域的な伸びと、税務当局（IRS）のデータに基づく所得の伸びの差を、銀行×郵便番号×年の単位で不正な所得の水増しの指標とした（抄録）。直観：本当の所得が増えていない地域で申請上の所得だけが伸びていれば、水増しが疑われる。", "p4": "内部統制の不備とその是正、ERP（会計と業務の統合システム）の導入による違いを調べ、2005年のFDICIA改正による内部統制規定の撤廃を内部統制の質へのショックとして使った（抄録）。", "p5": "水増しされた所得は、銀行の財務報告に係る内部統制の不備と正に、その後の不備の是正と負に関連した。この関連は会計と業務の過程を統合した（ERPを導入した）銀行に集中していた。2005年の規定撤廃の影響を受けた銀行では、住宅ローン申請の所得の水増しが増えた（抄録）。", "p6": "未確認（本文の限界の記述を入手できず）。解釈：地域単位の所得の乖離は個々の申請の不正を直接測るものではなく、地域の経済状況の測定誤差を含みうる。", "fun": "会社の決算書を正しく作るための社内チェック（内部統制）は、一見すると住宅ローンの審査とは関係なさそうです。ところがこの研究では、決算のチェックが甘い銀行ほど、ローン申請者の年収の水増しを見逃していました。特に会計と業務を一つのシステムで動かしている銀行で関係が強いという点から、社内の仕組みのゆるみが組織全体に広がる様子がうかがえます。", "unverified": "標本の期間・銀行数と効果の大きさは本文を入手できず確認できなかった。"}}, {"id": "jr03", "rank": 3, "headline": "加速する粒状流はμ(I)則から外れる", "title": "A numerical study on transient granular flow beyond $$\\mu (I)$$ rheology", "url": "https://doi.org/10.1007/s11440-026-03243-8", "authors": "Ivan Zaboev ほか", "venue": "Acta Geotechnica", "date": "2026-10-19", "sjr": 2.025, "citescore": 11.8, "citescore_year": "2025", "apa": "Zaboev, I., & Wu, W. (2026). A numerical study on transient granular flow beyond $$\\mu (I)$$ rheology. Acta Geotechnica. https://doi.org/10.1007/s11440-026-03243-8", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "出版社（Springer）のHTML本文（§2数値手法、§3.1〜3.3の結果と構成則、§4結論と図2〜6の説明）を読んだ。付録は読んでいない", "preprint": false, "p1": "一定のせん断加速度を受ける密な粒状流の個別要素法（DEM）計算で、応力比（有効摩擦係数）が定常のμ(I)則から外れて履歴に依存することを示し、加速度と構造緩和を取り込んでμ(I)則を非定常流へ拡張する現象論的な構成則を提案した（抄録、§4）。", "p2": "密な粒状流のμ(I)則は、摩擦係数μを慣性数I（せん断速度×粒径÷√(圧力/密度)：粒子の慣性と拘束圧の比）だけの関数とし、定常流をよく表すが、加速や減速の非定常流では有効摩擦が加速度に依存しないという仮定の妥当性が確かめられていなかった（§1、§3.1）。", "p3": "オープンソースのYADEで、重力なし・一定圧力の単純せん断を擬似2次元（球の単層）で計算した。粒子数2,000、粒径±20%の多分散、Hertz-Mindlin接触とクーロン摩擦（§2.1〜2.2）。加速時は速度分布が非線形になるため、材料を10層に分けPID制御で各層の平均速度を目標の線形分布に合わせた（§2.2、図1）。新たに無次元のせん断加速度Ĩ=γ̈d²ρ/P（加速と粒子の慣性の比）を導入し、無次元剛性Ẽ=E/Pと合わせてデータを整理した（§3.1）。構成則（式9）は、加速度に比例してμを定常曲線から離す項と、構造緩和の時間尺度t_st=γ0/γ̇でμ_s(I)へ戻す項からなる（§3.3）。", "p4": "同じ初期条件から加速・減速した30回の独立計算の平均で、μ–I曲線の定常曲線からのずれ、圧力・剛性・初期状態の影響、加速を止めた後の緩和を調べ、提案則の予測をDEMの結果と比べた（§2.3、図2〜6）。", "p5": "加速（γ̈>0）では摩擦係数は定常曲線から次第に離れ最大のずれに達した後、大きなIで定常曲線に戻った。減速（γ̈<0）ではIの減少とともにずれが増え続けた（図2a）。ずれの大きさはγ̈/Pでおおむね整理され、I、Ĩ、Ẽを固定すると同じ初期条件のデータは重なった（図3b）。ただし初期の定常状態が違うと曲線は一致せず、せん断応力は瞬間の速度場だけでは決まらない（図4）。定常値より下からの緩和は指数関数、上からは代数関数でよく近似され、緩和ひずみγ0はIとともに増えて最大となった後に減った（§3.2、図5）。提案則はDEMの主な傾向を再現した（図6）。", "p6": "著者は、固体的な挙動の扱いが単純化されており、初期の充填状態や除荷、流れの開始や反転の影響は考慮していないこと、微視構造の機構の分析が今後の課題であることを認める（§3.3、§4）。解釈：擬似2次元の単層と重力なしの条件で得た結果が、3次元の重力流（土石流など）でどこまで成り立つかは未検証である。", "fun": "砂の流れは、ゆっくり流れているときは「流れの速さ」だけで抵抗の大きさが決まる、という便利な法則が知られています。ところが流れを急に速めたり遅くしたりすると、砂はすぐには対応できず、それまでの流れ方を「覚えている」ように振る舞いました。粒が大きいほどこのずれが大きくなるため、数メートルの岩が混じる土石流では特に重要になりうるという指摘が興味深いところです。", "unverified": "表1の材料パラメータの値と、構成則のパラメータk・nの較正値の詳細は確認していない。"}}, {"id": "jr04", "rank": 4, "headline": "欠けた振動データからケーブル張力を推定する組込み装置", "title": "Embedded System Implementation of Cable Tension Estimation With Compressive Sensing Reconstruction", "url": "https://doi.org/10.1155/stc/2774120", "authors": "Dan Li ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-10-19", "citescore": 10.3, "citescore_year": "2025", "apa": "Li, D., Wang, W., Li, Y., & Zhang, J. (2026). Embedded System Implementation of Cable Tension Estimation With Compressive Sensing Reconstruction. Structural Control and Health Monitoring, 2026(1). https://doi.org/10.1155/stc/2774120", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "無線伝送で欠けた振動データを圧縮センシングで復元し、そのまま低消費電力の組込み装置の上でケーブル張力を推定する仕組みを実装し、実際の歩道橋で検証した（抄録）。", "p2": "斜張橋などのケーブル張力の監視は安全上重要だが、無線伝送のパケット損失で振動データが欠けたり歪んだりする。復元と解析を外部の計算機に頼らず、計算資源の乏しい現場の装置で行う方法が求められていた（抄録）。", "p3": "離散コサイン変換（DCT）の辞書と貪欲探索のアルゴリズムで欠けた加速度の標本を復元し、FFTで卓越振動数を同定して、弦の理論（張力と固有振動数の関係）で張力を推定する。全体を組込み機器の計算・メモリ制約に合わせた（抄録）。直観：振動の信号は少数の周波数成分の和で表せる（スパース）ため、一部が欠けても残りから全体を推定できる。", "p4": "数値シミュレーションでパケット損失率と信号対雑音比を変えて振動数の回復を調べ、南京眼歩道橋（Nanjing Eye Footbridge）での現場展開で、同時に計測した非接触マイクロ波レーダの結果と比べた（抄録）。", "p5": "数値シミュレーションでは、パケット損失率70%、信号対雑音比15 dBまで正しいモード振動数を回復した。現場では装置上で全処理を実行し、同時計測のマイクロ波レーダと周波数ビンの6分の1以内で一致した（抄録）。", "p6": "未確認（本文の限界の記述を入手できず）。解釈：弦の理論による張力推定は曲げ剛性やサグの影響が小さいケーブルを前提とし、短いケーブルでは補正が必要になりうる。", "fun": "ギターの弦は強く張るほど高い音が出ます。橋のケーブルも同じで、揺れの「音の高さ」（振動数）から張りの強さが分かります。この研究は、無線で送る途中で7割のデータが失われても元の揺れを復元できる数学（圧縮センシング）を、小さな省電力の装置の中で動かしました。現場の小さな箱だけで橋の健康を見張れるようになるという点が面白いところです。", "unverified": "推定した張力の値と既存の計測法との誤差は本文を入手できず確認できなかった。"}}, {"id": "jr05", "rank": 5, "headline": "合成された合意が集団的推論を腐らせる", "title": "Opinionrot: Toward a Theory of Collective Reasoning Decay in the Age of Synthetic Consensus", "url": "https://doi.org/10.1017/s1537592726106410", "authors": "Maud Reveilhac", "venue": "Perspectives on Politics", "date": "2026-10-19", "sjr": 2.923, "citescore": 9.4, "citescore_year": "2025", "apa": "Reveilhac, M. (2026). Opinionrot: Toward a Theory of Collective Reasoning Decay in the Age of Synthetic Consensus. Perspectives on Politics, 1–14. https://doi.org/10.1017/s1537592726106410", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "出版社（Cambridge）のHTML本文（概念の定義、自動化された世論の形成、強化の仕組み、診断、平等と積極的差別是正の例示）を読んだ", "preprint": false, "p1": "情報基盤が注意の獲得・認知バイアスの収益化・予測の自動化を通じて集団的推論を少しずつ腐らせていく過程を「opinionrot（意見の腐食）」と名づけ、その仕組みと診断の指標を示した理論論文（抄録、「What Opinionrot Is」）。", "p2": "ポスト真実の政治は、個人の合理性の欠如や情報の質の低下として扱われがちだった。誤情報研究は問題のある内容に注目するが、そうした内容を体系的に儲かるものにし拡大させる基盤そのものの変化は捉えきれていない（抄録、「Why Existing Frameworks Are Insufficient」）。", "p3": "説得が制度化・プラットフォーム化・予測化してきた歴史を概念史的に再構成する（抄録）。「腐食」の比喩は、断絶を意味する危機ではなく、扇情・分極・認知の自動化・行動操作の傾向が蓄積し常態化する過程を表す。強化の仕組みは3つ：①認知の捕獲（確証バイアスなどのヒューリスティックが基盤に組み込まれ経済資源になる）、②基盤の劣化（収奪的な誘因で公共的な機能が利益に従属する）、③言説の飽和（生成AIが意味の浅い大量の内容を流し、信号と雑音の区別を難しくする）（「Mechanisms of Intensification」）。背景：人々が他者の考えを推し量る日常の「ざわめき」（murmuring）を、LLMが過去の言説の統計的な反響として自動生成し、合意らしきものを作る点を新しい段階とする。", "p4": "理論論文であり実証データはない。診断として、基盤（可視性の集中、情報源の多様性の低下、言語の均質化）、言説（合成コンテンツの割合、関与と真実性の非対称、信号対雑音比）、社会認知（注意の多様性、ニュース疲れ、信頼、信念の揮発性、反応の周期の短縮）の3領域の指標を提案した（「Diagnosing Opinionrot」）。", "p5": "平等と積極的差別是正（アファーマティブ・アクション）をめぐる1970〜2025年の議論を例に、同じ論争が新聞・テレビ・政策文書・SNS・AI媒介の環境で、形・速度・可視性・修正可能性がどう変わるかを比べる研究設計を示した。以前の議論は排他的で不平等でもあったが、発言者が特定でき修正がしやすかったのに対し、現在は流通の速度が判断の速度を上回り、「誤り」が増えるというより集団的な修正の仕組みが弱まると論じる（「A Comparative Illustration」）。", "p6": "解釈：提案された指標は実際には測定されておらず、例示も研究設計の提示にとどまる。基盤の変化が集団的推論を劣化させるという因果の主張は、今後の実証で確かめる必要がある。著者自身も、遅く制度化された伝達がそのまま民主的とは限らないと注意している。", "fun": "フェイクニュースの問題というと「うそ」が広まることを思い浮かべます。この論文はもっと深いところに目を向け、注目を集めるほど儲かる仕組みや、AIが「みんなはこう考えている」という雰囲気まで作り出してしまう環境が、社会で考えを練り直す力そのものを少しずつ腐らせると論じます。うそが増えることより、考え直す時間がなくなることの方が問題だ、という指摘が印象的です。", "unverified": "なし"}}, {"id": "jr06", "rank": 6, "headline": "自治体職員のAI認識と燃え尽きの関係", "title": "Artificial intelligence, psychosocial work environment, and burnout among municipal employees: A cross-sectional study", "url": "https://doi.org/10.1177/10519815261491690", "authors": "Hjördís Sigursteinsdóttir", "venue": "WORK: A Journal of Prevention, Assessment & Rehabilitation", "date": "2026-10-19", "citescore": 2.9, "citescore_year": "2025", "apa": "Sigursteinsdóttir, H. (2026). Artificial intelligence, psychosocial work environment, and burnout among municipal employees: A cross-sectional study. WORK: A Journal of Prevention, Assessment & Rehabilitation. https://doi.org/10.1177/10519815261491690", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "アイスランドの自治体職員3,488人の調査で、AIへの認識がバーンアウトと関連するのは主に心理社会的な労働条件を通じてであることを示した（抄録）。", "p2": "公的部門の職場でもAIの導入が進むが、従業員のAIへの認識が心理社会的な労働条件や燃え尽きとどう関わるかはほとんど分かっていなかった（抄録）。", "p3": "アイスランドの11自治体の職員の横断調査で、バーンアウトをBurnout Assessment Tool（BAT）で測り、AIの使用、組織の支援、知覚された便益、AIへの懸念と不安、AIの倫理的な統治への信頼を説明変数とした。年齢と性別を統制した階層的回帰と媒介分析を行った（抄録）。", "p4": "心理社会的な労働条件（量的な仕事の要求、上司の支援、革新的・変化支援的な風土）とAI関連の要因の、バーンアウトへの関連の大きさと媒介経路を比べた（抄録）。", "p5": "バーンアウトと最も強く関連したのは心理社会的な労働条件で、量的な仕事の要求が高いほどバーンアウトが高く、上司の支援と革新的な風土は低さと関連した。AIへの懸念と不安は高いバーンアウトと、AIの倫理的な統治への信頼は低いバーンアウトと関連した。予想に反して、AIの便益の認識は直接的に高いバーンアウトと関連し、量的な仕事の要求の増加を通じて間接的にも関連した。AIへの認識は主に既存の心理社会的な仕事の特性を通じてバーンアウトと結びついていた（抄録）。", "p6": "著者は、従業員中心のAI導入、信頼できる統治、健全な労働環境の重要性を強調する（抄録）。解釈：横断研究のため、AIの便益を感じる人ほど仕事が増えているのか、負担の大きい人ほどAIに期待するのかの方向は区別できない。", "fun": "「AIは便利だ」と感じている職員ほど、むしろ燃え尽きやすいという意外な結果が出ました。AIで仕事がはかどると、その分だけ仕事量が増えてしまうのかもしれません。結局、燃え尽きを左右していたのはAIそのものより、仕事の量や上司の支えといった昔からの職場の条件でした。新しい技術の影響も、職場の基本を通じて現れるということです。", "unverified": "回帰係数や説明された分散の大きさは本文を入手できず確認できなかった。"}}, {"id": "jr07", "rank": 7, "headline": "ホテルのサービス失敗で客が許す仕組みを口コミから", "title": "The formation mechanism of customer forgiveness intention in hotel service failure contexts", "url": "https://doi.org/10.54254/2977-5701/2026.37733", "authors": "Weijia Liu", "venue": "Journal of Applied Economics and Policy Studies", "date": "2026-10-19", "apa": "Liu, W. (2026). The formation mechanism of customer forgiveness intention in hotel service failure contexts. Journal of Applied Economics and Policy Studies, 19(11), 58–65. https://doi.org/10.54254/2977-5701/2026.37733", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "本文", "basis_note": "出版社のPDF本文（実験設計§4、結果§5と表1）を読んだ。抄録は口コミの意味解析の研究を述べており、本文の場面実験と内容が一致しない", "preprint": false, "p1": "ホテルのサービス失敗の場面実験で、回復行動（迅速さ・謝罪の誠実さ・補償の十分さ）が知覚された公正を高め、否定的感情の低減と信頼の回復を通じて顧客の許しの意図につながる経路を構造方程式モデルで示した（本文§4〜5、表1）。", "p2": "題名の問いは、サービス失敗の後に顧客が許す気持ちがどのように形成されるかである。注意：論文の抄録は、Ctripの口コミ15.6万件を意味解析してサービス品質の悪化を早期に検知する別の研究（F1 0.829、AUC 0.903）を述べており、本文の内容と一致しない（抄録、本文）。", "p3": "Credamoで過去12か月にホテル宿泊経験のある420人を集め、失敗の深刻さ（軽・重）と対応の迅速さなどを組み合わせた4つの場面に105人ずつ無作為に割り当てた（§4.1）。回答時間180秒未満や注意確認の不合格を除き、AMOSで確認的因子分析と構造方程式モデルを推定し、5,000回のブートストラップで媒介効果を、失敗の深刻さと会員関係の強さで多母集団分析を行った（§4.2〜4.3）。", "p4": "モデルの適合度（CFI、TLI、RMSEA、SRMR）、標準化パス係数と95%信頼区間、間接効果、群間の差、許しの意図の説明率で評価した（§5、表1）。", "p5": "操作確認で重い失敗条件はより深刻と受け止められた（図1）。構造モデルの適合はχ²/df=2.236、CFI=0.951、RMSEA=0.055だった。迅速さ（0.318）、謝罪の誠実さ（0.276）、補償の十分さ（0.241）は知覚された公正を高め、失敗の深刻さは公正を下げた（-0.214）。公正は否定的感情の低減（0.496）と信頼の回復（0.374）を高め、信頼の回復が許しの意図への最も強い直接効果（0.421）を持った。間接効果は迅速さ0.182、謝罪0.157、補償0.139で、許しの意図の説明率はR²=0.684だった（表1）。", "p6": "解釈：抄録と本文の内容が一致せず、どちらが正しい版かを確認できない点は大きな問題である。本文の推定値には「0.318 ± 0.047」のように標準誤差とは別の幅が併記され、その意味も説明されていない。仮想の場面への回答であり、実際のサービス失敗での行動とは異なりうる。", "fun": "ホテルで部屋が汚かったとき、すぐに対応され、心から謝られ、十分な埋め合わせがあれば、客は許す気になるかもしれません。この研究では、それらが「公平に扱われた」という感覚を生み、怒りが和らぎ信頼が戻ることで許しにつながる道筋が示されました。ただ、論文の要約が本文と別の研究の内容になっているという珍しい問題があり、読む側の注意力も試される論文です。", "unverified": "抄録に書かれた口コミ解析の結果（F1 0.829、AUC 0.903、苦情強度18〜27%）は本文に見当たらず確認できなかった。"}}, {"id": "jr08", "rank": 8, "headline": "地域のケアを都市インフラとして捉え直す", "title": "Reimagining Community Care as Urban Infrastructure: An Arts‐Based Inquiry", "url": "https://doi.org/10.1111/tesg.70119", "authors": "Amy Kipp", "venue": "Tijdschrift voor Economische en Sociale Geografie", "date": "2026-10-19", "citescore": 4.7, "citescore_year": "2025", "apa": "Kipp, A. (2026). Reimagining Community Care as Urban Infrastructure: An Arts‐Based Inquiry. Tijdschrift Voor Economische En Sociale Geografie. https://doi.org/10.1111/tesg.70119", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "カナダの中規模都市ゲルフで、住民が語ったコロナ禍初期の地域のケアの経験を芸術ベースの手法で集め、地域のケアを都市のインフラとして維持・修復・再構想する視点を示した（抄録）。", "p2": "カナダの都市では公的なケアのインフラの脆さが明らかになり、隣人、草の根のネットワーク、非営利団体による地域のケアの重要性が浮き彫りになったが、それがどう機能し、危機の後も思いやりのある都市づくりにどう貢献しうるかは十分に探られていなかった（抄録）。", "p3": "地域参加型の芸術プロジェクトで、参加者がパンデミック初期の地域のケアの経験と、街をもっと思いやりのある場所にするアイデアを物語として共有し、その物語を語り分析（ナラティブ分析）した（抄録）。", "p4": "質的研究で、統計的な検証は行っていない。物語から、ケアがどう経験され、どこでどのように維持・継続・修復・再構想されうるかを読み取ることを目的とする（抄録）。", "p5": "物語の分析は、この時期に地域のケアがどう経験されたかを示し、より思いやりのある都市を作るために、地域のケアのインフラをどこでどのように維持・継続・修復・再構想できるかを明らかにしたとしている（抄録）。具体的な主題は抄録に記載がない。", "p6": "未確認（本文の限界の記述を入手できず）。解釈：1つの都市の参加者の物語に基づき、芸術プロジェクトに参加する人の経験に偏る可能性がある。", "fun": "道路や水道と同じように、近所の人どうしの助け合いも街を支える「インフラ」だと考えるとどうなるでしょうか。この研究は、コロナ禍で買い物を代わりにしたり声をかけ合ったりした経験を、住民に物語や作品として語ってもらいました。目に見えにくい支え合いを、維持し修理すべき街の設備として捉え直す発想が面白いところです。", "unverified": "参加者数と具体的な主題は本文を入手できず確認できなかった。"}}, {"id": "jr09", "rank": 9, "headline": "生産性重視か効率重視かで予算目標が変わる", "title": "Productivity versus Efficiency: The Effect of Incentive Focus on Target Setting in Participative Budgets", "url": "https://doi.org/10.2308/tar-2025-0493", "authors": "Jake Andrassy ほか", "venue": "Accounting Review", "date": "2026-10-19", "sjr": 4.403, "citescore": 7.5, "citescore_year": "2025", "apa": "Andrassy, J., Brown, J. L., Mallon, T., & Sauciuc, A. K. (2026). Productivity versus Efficiency: The Effect of Incentive Focus on Target Setting in Participative Budgets. The Accounting Review, 1–24. https://doi.org/10.2308/tar-2025-0493", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "参加型予算で、効率（投入の最小化）を重視する報酬は生産性（産出の最大化）を重視する報酬よりリスクが高いと受け止められ、従業員が低い目標を設定し、成果も悪くなることを実験で示した（抄録）。", "p2": "企業は生産性と効率の両方を目標に報酬制度を設計するが、どちらに焦点を置くかが従業員のリスク認識と意思決定に与える心理的な効果の実証は乏しかった（抄録）。", "p3": "従業員が自分の目標を設定する参加型予算の状況で、生産性に焦点を置いた報酬と効率に焦点を置いた報酬を比べ、結果の不確実性の有無を操作した（抄録）。直観：効率の目標は「失敗すると投入が増えて損をする」と感じさせ、リスクを避けて目標を下げさせる。", "p4": "設定した目標の水準、目標の達成、誤りの率を、報酬の焦点と不確実性の条件で比べた（抄録）。", "p5": "従業員は効率の報酬を生産性の報酬よりリスクが高いと受け止め、低い目標を設定した。この効果は結果の不確実性がない場合には消えた。効率の報酬のもとでは、より易しい目標を設定したにもかかわらず目標の達成が少なく誤りが多かった（抄録）。", "p6": "著者は、参加型予算の場面では効率の報酬が目標設定とその後の成果に悪影響を及ぼしうるとする（抄録）。解釈：実験の参加者と課題の性質（実験室か現場か）は抄録に記載がなく、実際の企業への一般化は本文で確かめる必要がある。", "fun": "「たくさん作れば報酬」と「材料を節約すれば報酬」は、どちらも会社にとって良いことのはずです。ところが実験では、節約型の報酬を与えられた人は失敗を恐れて目標を低く設定し、しかもその低い目標すら達成できず、ミスも増えました。同じ成果を求めるにしても、言い方次第で人の心理と行動が大きく変わるという、制度設計の面白さがあります。", "unverified": "実験の参加者数と効果の大きさは本文を入手できず確認できなかった。"}}, {"id": "jr10", "rank": 10, "headline": "情報が片方にあるだけで選ばれやすくなる", "title": "A Mere Presence Effect of Asymmetric Information", "url": "https://doi.org/10.1093/jcr/ucag040", "authors": "Jiaqi Yu ほか", "venue": "Journal of Consumer Research", "date": "2026-10-19", "sjr": 11.045, "citescore": 13.9, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "商品のパッケージに数値つきの属性（例：牛乳のたんぱく質量）が書かれているだけで、その数値が低くても、消費者は属性の良し悪しの向きで商品を判断してしまう「単なる存在効果」を、8つの事前登録研究で示した（抄録）。", "p2": "任意の情報開示の違いにより、ある商品は数値を表示し別の商品は表示しない、という情報の非対称が生まれる。この非対称な表示が消費者の選択にどう影響するかは分かっていなかった（抄録）。", "p3": "消費者は数値が評価しにくい属性（低評価可能性）について、数値の大小ではなく、属性が肯定的か否定的かという「向き」で表示された商品を判断すると予測し、8つの事前登録の実験で検証した（抄録）。具体例：たんぱく質の含有量が実は少ない牛乳でも、「たんぱく質○g」と書かれていると、書いていない牛乳より良く見える。", "p4": "表示する属性の向き（肯定的・否定的）と伝える量（高・低）を操作し、商品の評価と選択を比べた（抄録）。", "p5": "肯定的（否定的）な数値つきの品質関連の属性が表示されると、その数値が比較的低い品質を表していても、消費者は商品をより好意的に（非好意的に）判断する頑健な効果が見られた。これは、属性が表示されたとき伝えられた量ではなく属性の向きに頼る過剰一般化されたヒューリスティックの説明と整合した（抄録）。", "p6": "著者は、数値つきの属性が目立つが評価しにくいとき、非対称な情報開示は品質の判断を助けるどころか妨げうると結論する（抄録）。解釈：評価しやすい属性（価格など）では効果が弱まると予想され、その境界条件は本文で確かめる必要がある。", "fun": "「カルシウム入り」「たんぱく質○g」と書かれていると、なんとなく体に良さそうに見えます。ところがこの研究では、書かれている量が実は少なくても、書かれていない商品より良く評価されてしまいました。数字の中身ではなく「書いてあること」自体に反応してしまう私たちの心のくせを、8つの実験で確かめた点が面白いところです。", "unverified": "各研究の参加者数と効果の大きさは本文を入手できず確認できなかった。"}}, {"id": "jr11", "rank": 11, "headline": "認知症介護者と医療者の関係の質が健康を左右", "title": "Caregiver-provider relationship quality and health outcomes in family caregivers of people living with dementia", "url": "https://doi.org/10.1093/geronb/gbag211", "authors": "Henrietta A Bennett ほか", "venue": "Journals of Gerontology - Series B Psychological Sciences and Social Sciences", "date": "2026-10-19", "sjr": 1.503, "citescore": 6.8, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "認知症の家族を介護する人が医療者から大切にされ尊重されていると感じるほど、日々の抑うつと不安の症状が軽いことを示した（抄録）。", "p2": "認知症の人の家族介護者は医療者と連携してケアを調整するが、両者の関係には課題が多く、それが介護者の健康を損なう可能性が指摘されていた（抄録）。", "p3": "認知症の家族と同居し無償で介護する228人について、医療者との関係の質の認識と、日々の抑うつ症状・不安・ストレスの関係を線形混合効果モデルで分析した（抄録）。背景：日々の症状を繰り返し測り、個人内の変動と個人間の違いを分けて扱うモデルである。", "p4": "医療者の「情緒的な対応」（価値を認められ、尊重され、感情的に支えられているという認識）などの関係の質が、日々の3つの症状と関連するかを調べた（抄録）。", "p5": "介護者の82%が女性、84%が配偶者・パートナー、9%が貧困層だった。医療者の情緒的な対応を肯定的に評価する介護者ほど、日々の抑うつ症状（β=-0.06、p=.001）と不安症状（β=-0.07、p<.001）が低かった。関係の質は日々のストレス経験とは関連しなかった（抄録）。", "p6": "著者は、医療者の情緒的な対応が抑うつと不安に対する保護要因でありうるとし、関係を踏まえた実践を日常の認知症ケアに組み込むことを提案する（抄録）。解釈：観察研究のため、症状の軽い介護者ほど医療者との関係を肯定的に評価する逆の方向の可能性も残る。", "fun": "認知症の家族を介護する人にとって、医師や看護師は頼れる存在であると同時に、ときに気を遣う相手でもあります。この研究では、医療者から尊重され気持ちを支えられていると感じている介護者ほど、日々の気分の落ち込みや不安が少ないことが分かりました。薬や制度だけでなく、接し方そのものがケアになるという点が心に残ります。", "unverified": "日々の測定の期間と回数は本文を入手できず確認できなかった。"}}, {"id": "jr12", "rank": 12, "headline": "深層学習で3次元不均質斜面の破壊確率を高速推定", "title": "Powering Three-dimensional Heterogeneous Slope Failure Predictions and Risk Assessment with Deep Learning", "url": "https://doi.org/10.1139/cgj-2026-0302", "authors": "Chongzhi Wu ほか", "venue": "Canadian Geotechnical Journal", "date": "2026-10-19", "sjr": 1.282, "citescore": 5.8, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "土の強度が場所によって不均一な3次元斜面について、ランダム場の入力から変位の空間分布と安全率を予測する深層学習の代理モデルを作り、破壊パターンの分類と連続的なリスク指標による信頼性評価を可能にした（抄録）。", "p2": "土質定数の空間的なばらつきはランダム場で表すが、確率的な評価には物理ベースの計算を何度も繰り返す必要があり、大規模な3次元解析では計算負荷が大きい。従来の破壊確率は破壊か否かの二値の判定に基づく（抄録）。", "p3": "粘着力と内部摩擦角のランダム場を入力に、全変位の大きさの3次元分布と安全率を予測する代理モデルを学習した。予測した変位場をガウス混合モデルでクラスタリングして破壊パターンに変換し、連続的なシグモイド型の重みと弱部の割合を組み合わせて、モンテカルロの各実現ごとのリスク指標を定義した（抄録）。直観：破壊か否かではなく「どれくらい広い範囲が弱くなるか」を連続量で測ると、破壊の結果の大きさまで比べられる。", "p4": "粘着力と摩擦角が空間的に変動する3次元斜面で示し、限られた学習データでの予測精度と、学習時と異なる鉛直・水平の変動の尺度のランダム場への汎化を調べた（抄録）。", "p5": "限られたデータで学習した代理モデルは高い予測精度を達成し、学習時と異なる鉛直・水平の変動の尺度のランダム場に対しても再学習なしで同程度の性能を保った。リスク指標は単一の破壊確率ではなく、リスク推定値の分布を与えた（抄録）。", "p6": "著者は、この枠組みは大規模な3次元斜面の信頼性解析と、空間変動のもとでの潜在的な破壊の結果の比較評価に実用的であり、破壊確率だけの情報を補うとする（抄録）。解釈：1つの斜面形状での例示であり、形状や境界条件が異なる斜面への汎化は未検証とみられる。", "fun": "斜面の土の強さは場所ごとにまちまちで、どこに弱い部分があるかで崩れ方が変わります。そのため何千通りもの「土のばらつき方」を計算する必要がありますが、3次元では時間がかかりすぎます。この研究はAIに計算の近道を学ばせ、さらに「崩れるか崩れないか」ではなく「どれだけ広く弱るか」を連続的に測る新しい物差しを作りました。", "unverified": "予測精度の具体的な数値と学習データの数は本文を入手できず確認できなかった。"}}, {"id": "jr13", "rank": 13, "headline": "在宅勤務ショックの影響は男女で違った", "title": "Gendered Effects of a Crisis-induced Work-from-Home Shock: A Time-Motion Study Using Digital Footprints", "url": "https://doi.org/10.1287/msom.2025.0059", "authors": "Kamalini Ramdas ほか", "venue": "Manufacturing and Service Operations Management", "date": "2026-10-19", "sjr": 4.661, "citescore": 10.6, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "コロナ禍の外出制限による在宅勤務への強制的な移行で、オンラインでの仕事と余暇の時間が増えたが、その増加は男性で大きく、新たな男女差が生まれたことをデジタルの行動記録で示した（抄録）。", "p2": "組織がハイブリッド勤務や在宅中心の働き方を採り入れる中、在宅勤務が業務上の成果に与える影響が男女で異なるかは十分に理解されていなかった（抄録）。", "p3": "外出制限による在宅勤務へのショックと、文脈つきのデジタル行動記録を集める新しい方法を組み合わせ、1,094人の3,000万件超のウェブサイト訪問から、ホワイトカラー版の「時間動作研究」として活動ごとのオンラインの時間配分を分析した（抄録）。", "p4": "仕事関連と余暇のオンライン時間、スマートフォンでの活動、求職活動の変化を男女・親であるかどうかで比べ、求職については大手のオンライン求人プラットフォームの外部データでも確かめた（抄録）。", "p5": "在宅勤務への移行で仕事関連と余暇のオンライン時間は全体として増えたが、増加は男性で有意に大きかった。男女差は親の間で増幅された。在宅勤務へのショックの後、女性の求職活動は相対的に大きく減り、外部の求人データでも裏づけられた（抄録）。", "p6": "著者は、家事・育児の責任など職場の外の要因が在宅勤務の成否を左右し、男女の格差に対処する在宅勤務の方針が必要だとする（抄録）。解釈：オンラインの行動記録は仕事の量や質の一部しか捉えず、オフラインの家事・育児の時間は直接観測されていない。", "fun": "在宅勤務は柔軟に働けるので誰にとっても良いことのように思えます。ところがコロナ禍のパソコンやスマホの利用記録を見ると、仕事も息抜きも時間が増えたのは主に男性で、特に子どものいる家庭で差が広がっていました。家の中の家事や育児の負担が、家で働く自由の恩恵を男女で不平等にしていた可能性を示す研究です。", "unverified": "男女差の大きさの数値は本文を入手できず確認できなかった。"}}, {"id": "jr14", "rank": 14, "headline": "文献スクリーニングでのLLMとプロンプトの相性", "title": "Evaluating prompting strategies and large language models in systematic literature review screening: Relevance and task-stage classification", "url": "https://doi.org/10.1017/rsm.2026.10110", "authors": "Binglan Han ほか", "venue": "Research Synthesis Methods", "date": "2026-10-19", "sjr": 3.143, "citescore": 12.1, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "出版社（Cambridge）のHTML本文（§3のデータと手法、§4.1の関連性分類の結果と表2、§5.3の費用分析と表9、§5.4の限界）を読んだ。§4.2の段階分類の詳細は精読していない", "preprint": false, "p1": "体系的文献レビュー（SLR）の選別作業を6つのLLMと5つのプロンプトで自動化したときの性能を比べ、最良の組み合わせは目的（見落としを減らすか、誤採用を減らすか）で変わり、プロンプトとモデルの相互作用が大きいことを示した（抄録、§5）。", "p2": "SLRの選別は労力が大きく、LLMによる自動化が試みられているが、プロンプトの型とモデルの組み合わせが性能と費用にどう影響するかの体系的な比較は不足していた（§1〜2）。", "p3": "2014〜2024年のSLR自動化に関する論文を6つのデータベースから集め、重複除去後の1,376件を2人が独立に注釈した（関連性の一致率91%、κ=0.809）。関連は491件（35.7%）で、段階（検索・選別・取得・統合・執筆）とLLM利用の多ラベルも付けた（§3.1、図3〜4）。GPT-4o、GPT-4o-mini、DeepSeek-Chat-V3、Gemini-2.5-Flash、Claude-3.5-Haiku、Llama-4-Maverickに、ゼロショット、少数例、思考連鎖（CoT）、CoT＋少数例、自己内省の5つのプロンプトで分類させた（§3.2〜3.3）。", "p4": "見落としを避けることが重要な選別では再現率を主指標とし、適合率・F1・正解率を補助とした。モデル内のプロンプトの影響はFriedman検定で探索的に調べ、1,000抄録あたりのAPI費用とF1を比べた（§3.4、§4.1、§5.3）。", "p5": "全モデルの平均（表2）で、ゼロショットは再現率が最高（0.971）だが適合率は0.834、CoT＋少数例は適合率（0.901）とF1（0.913）が最高だが再現率は0.930、自己内省は適合率0.753、F1 0.835と最も弱かった。プロンプトの影響はClaude-3.5-HaikuやGPT-4o-miniで大きく、GPT-4o（p=0.085）とDeepSeek（p=0.88）では小さかった（§4.1.1）。1,000抄録あたりの費用はGPT-4o-miniが0.09〜0.18ドル、GPT-4oが1.43〜3.04ドルで、GPT-4oのゼロショットがF1最高（0.934）だった（表9）。", "p6": "著者は、データがSLR自動化という特定の領域の論文で、「systematic review」「LLM」などの語の手がかりが多く、一般の選別より易しい可能性があり、性能を過大評価しうると認める。体系的な反復や メタプロンプトの手法は評価していない（§5.4）。解釈：使ったモデルの版が古くなりやすく、結果の寿命は短い可能性がある。", "fun": "論文の大量の要約から必要なものを選び出す作業は、研究者にとって大変な手間です。AIに任せると、「見落としを減らしたい」なら説明なしで指示するのが、「無関係なものを混ぜたくない」なら考え方と例を添えるのが良い、というように目的で最適なやり方が変わりました。しかも、AIに自分の答えを見直させると、かえって何でも採用しがちになるという意外な結果も出ています。", "unverified": "段階分類（§4.2）の課題別の性能の数値は確認していない。"}}, {"id": "jr15", "rank": 15, "headline": "都市再生の期待は完成前から住宅価格に織り込まれる", "title": "Anticipatory Effect and Heterogeneity of Urban Renewal on Housing Prices: Evidence from Future Community Projects in Hangzhou", "url": "https://doi.org/10.3390/buildings16204118", "authors": "Haizhen Wen ほか", "venue": "Buildings", "date": "2026-10-19", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "杭州の「未来コミュニティ」再生事業の第1弾の発表が、完成前から周辺の住宅価格に織り込まれたことを、中古住宅の取引データで示した（抄録）。", "p2": "都市のコミュニティ再生は居住環境と公共サービスを改善する政策手段だが、住宅市場は事業の完成よりずっと前に再生への期待に反応しうる。その空間的な範囲と異質性は十分に分かっていなかった（抄録）。", "p3": "2018〜2022年の1,682団地27,172件の中古住宅取引で、ヘドニック価格モデルと分位点回帰を使い、事業リスト発表による価格への期待効果の空間的範囲と、既存の公共施設、工事の進捗、価格帯による違いを分析した（抄録）。", "p4": "未来コミュニティからの距離帯、近くに公園・病院があるか、本格着工の公表、住宅価格の分位ごとに、発表後の価格の上乗せを推定した（抄録）。", "p5": "発表後、半径3 km以内の住宅価格は平均約1.6%高く、未来コミュニティに近いほど反応が強かった。1 km以内で近くに公園や病院がない住宅では、さらに約12.0%と3.0%の上乗せがあった。本格着工の公表後、工事段階に入った事業の近くの住宅にさらに約1.6%の上乗せがあった。効果は低価格帯で弱く中〜高価格帯で強く、0.8分位で最大となった（抄録）。", "p6": "著者は、再生計画は完成前に市場の期待を通じて住宅価格に反映され、その大きさは距離、既存の地域の条件、事業の進捗、価格水準に左右されるとする（抄録）。解釈：事業地区の選定自体が価格の上がりそうな地域に偏っている可能性（選択バイアス）への対処は本文で確かめる必要がある。", "fun": "まだ工事も始まっていないのに、「この街を再開発します」と発表しただけで周りの家の値段が上がりました。しかも、近くに公園や病院がなかった家ほど大きく値上がりしていました。人々が「将来ここが便利になる」と期待した分だけ、今の価格に先取りされたわけです。街づくりの価値がいつ、誰に生まれるのかを考えるヒントになります。", "unverified": "推定に使った統制変数と比較対象の地域の定義は本文を入手できず確認できなかった。"}}, {"id": "jr16", "rank": 16, "headline": "LLMの文脈選択をブラックウェル順序で整理", "title": "Context Selection as a Partial Order: A Blackwell Framework and Verified LLM Evidence", "url": "https://doi.org/10.3390/make8100336", "authors": "Andriy Bilous ほか", "venue": "Machine Learning and Knowledge Extraction", "date": "2026-10-19", "sjr": 1.548, "citescore": 12.7, "citescore_year": "2025", "the
