スを分析した（抄録）。", "p5": "感情的な言い回し、危険の比喩、繰り返される対立図式によって、公平政策が安全と能力への脅威として描かれ、女性リーダーの適格性が問われた一方、反論の語りが実績を再確認したことを示した（抄録）。", "fun": "大きな災害のとき、人は原因を探して誰かを責めたくなります。その矛先が、政策や女性リーダーに向けられていく言葉の組み立て方を細かく分析しています。危機が、既存の対立をあおる機会として使われる仕組みが見えてきます。", "unverified": "30件のコーパスの選定基準の詳細は抄録になく未確認。"}}, {"id": "pn19", "rank": 19, "field": "組織行動・心理的安全性", "headline": "プロジェクト型の仕事での感情知能を「実践される能力」として整理", "title": "Emotional intelligence as an enacted capability in project-based work: an integrative review", "url": "https://doi.org/10.2139/ssrn.7556842", "authors": "Vivien VALASEK ほか", "venue": "SSRN", "date": "2026-10-03", "why": "異質な研究をまとめた統合レビューで、感情知能を実践の中で発揮される能力として捉え直した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "プロジェクト型の仕事での感情知能（EI）研究68件・539経路を統合レビューし、EIを個人に根ざしつつ関係の中で発揮される能力として捉え直す枠組みを示した（抄録）。", "p3": "構成概念の主張、測定、概念と方法の整合、実証上の役割、分析水準、証拠の種類などを研究ごとにコード化した（抄録）。", "p5": "68件中64件が自己報告の測定に頼り、最大能力を測る検証済みのEI尺度は見当たらず、46件は概念と方法の整合が部分的だった。EIをプロジェクト成功の単一の原因として扱う根拠はないと結論した（抄録）。", "fun": "「感情知能が高い人はプロジェクトを成功させる」とよく言われますが、多くの研究は本人の自己評価で測っていました。自分で「得意」と思うことと実際にできることは違う、という当たり前の点を、研究全体を見渡して確かめた点が意義深いところです。", "unverified": "なし"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "人権条約の批准は所得格差を縮めるか", "title": "Human Rights and Inequality", "url": "https://doi.org/10.2139/ssrn.7547740", "authors": "Samantha Ajovalasit ほか", "venue": "SSRN", "date": "2026-10-02", "why": "国際人権規約2本の批准が所得格差に与える効果を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "国際人権規約（自由権規約・社会権規約）の批准が所得格差を縮めるかを、テレビ放送の普及を操作変数として1960〜2015年の国別パネルで推定した（抄録）。", "p3": "放送への接触が人権への関心を高め批准を促したという仮説に基づく操作変数を使い、3つの識別設計で統制変数のすべての組み合わせを推定し、事前に定めた弱操作変数・過剰識別の診断を通るものだけを残した（抄録）。", "p5": "自由権規約の批准は3つの設計すべてで格差を頑健かつ大きく減らした。社会権規約と選択議定書は特定の操作変数の組でのみ識別された。累積の批准指数も強い負の効果を示した（抄録）。", "fun": "人権条約にサインすると格差が縮むのか、という問いに、「テレビが広まった国ほど人権への関心が高まり条約を批准しやすかった」という意外な手がかりを使って答えようとしています。原因と結果を見分けるための工夫が面白い研究です。", "unverified": "効果の大きさ（係数）の具体値は抄録になく未確認。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "予測市場Polymarketの価格はいつ信頼できるか", "title": "When Can Prediction Market Prices Be Trusted? Price Informativeness, Calibration, and Bias on Polymarket", "url": "https://doi.org/10.2139/ssrn.7552098", "authors": "Felix Reichenbach ほか", "venue": "SSRN", "date": "2026-10-02", "why": "Polymarketの大量の市場データで、価格の情報性・較正・偏りを検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "予測市場Polymarketの779,000市場・15億件の取引から、価格をいつ確率の推定として信頼できるかを調べた（抄録）。", "p3": "市場の成熟度、取引量、分野ごとに、価格の情報性・較正・偏りを比較し、スポーツ市場ではプロのブックメーカーと精度を比べた（抄録）。", "p5": "価格は全体に情報性が高く市場の成熟とともに改善した。天気の市場が最も精確で、言及系や地政学の市場は最も不精確だった。一般的な大穴バイアスはなく、低確率の結果は初め過小に値付けされ終盤に反転した。既定の結果は一貫して過大評価された（抄録）。", "fun": "「みんなでお金を賭けると未来がよく当たる」という予測市場の考えを、膨大な実取引で検証しています。天気はよく当たるのに国際政治は当たりにくい、という分野差や、「何も起きない」に賭ける側が高く付けられがちという癖が見えてくるのが面白い点です。", "unverified": "精度指標（ブライアスコアなど）の具体値は抄録になく未確認。"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "非ガウスSVARで中国の2015年以降の金融政策波及を評価", "title": "Quantity or Price? Evaluating China’s Post-2015 Monetary Policy Transmission via Non-Gaussian SVARs", "url": "https://doi.org/10.2139/ssrn.7553034", "authors": "Dominic Gasbarro ほか", "venue": "SSRN", "date": "2026-10-02", "why": "非ガウス性を使った識別で、数量と価格のどちらの金融政策手段が効いているかを評価した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "2015年の金利自由化を境に、中国の金融政策の波及が量から金利（価格）へ移ったことを、非ガウス性で識別した構造VARで示した（抄録）。", "p3": "2006年2月〜2026年4月の月次データで、非ガウス性により識別した構造VARを推定し、ショックの変動の変化と波及構造の変化を区別する時変波及の検定を適用した。局所射影でも確かめた（抄録）。", "p5": "2015年前後で波及が不変という仮説は強く棄却され、銀行間金利ショックの実体経済への影響が大きくなり、マネーサプライ・ショックの直接の影響が弱まった（抄録）。", "fun": "中央銀行が「お金の量」ではなく「金利」で景気を動かすやり方に切り替えたとき、本当に効き方が変わったのかを確かめる研究です。ショックの大きさが変わっただけなのか、伝わり方自体が変わったのかを統計的に見分ける工夫がポイントです。", "unverified": "インパルス応答の大きさの具体値は抄録になく未確認。"}}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "ダブルオークションが競争均衡に向かう理由を理論で説明", "title": "Social Welfare and Price Discovery in Double Auction Markets", "url": "https://doi.org/10.2139/ssrn.7552140", "authors": "Teemu Pennanen", "venue": "SSRN", "date": "2026-10-02", "why": "実験で知られてきたダブルオークションの価格発見を、社会厚生の観点から理論的に説明した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "実験で知られていたダブルオークションが競争均衡価格に向かう現象に、理論的な説明を与えた（抄録）。", "p3": "各主体が現在の保有と選好から導かれる無差別価格で入札する純粋交換経済の動学的ダブルオークションを分析した（抄録）。", "p5": "ワルラス均衡がダブルオークションの不動点と一致し、繰り返しのダブルオークションは有界な配分と価格の列を生み、その集積点が移転付きのワルラス均衡になることを示した（抄録）。", "fun": "売り手と買い手が値段を出し合うだけの単純な市場で、なぜ教科書どおりの「需要と供給が釣り合う価格」に落ち着くのか。実験では何十年も前から観察されてきた現象に、数学的な理由を与えた点が面白いところです。", "unverified": "収束の速さに関する結果は抄録になく未確認。"}}, {"id": "pn24", "rank": 24, "field": "経済学", "headline": "ニューラル・フィリップス曲線でインフレ要因を分解", "title": "Inflation Unpacked: Breaking Down the Key Components Using a Neural Phillips Curve", "url": "https://econpapers.repec.org/RePEc:bhd:dpaper:202505", "authors": "Joan Christine S. Allon-Pineda", "venue": "RePEc NEP", "date": "2026-09-07", "why": "ニューラルネットを組み込んだフィリップス曲線で、インフレの主要な構成要因を分解した。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに掲載された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "半球型ニューラルネットワークで拡張ニューケインジアン・フィリップス曲線の観測できない状態を推定し、フィリピンのインフレの要因を分解した（抄録）。", "p3": "需給ギャップやインフレ期待などの潜在状態を、特別な構造のニューラルネットで推定し、入力変数との相関や主要な経済事象との整合で解釈した（抄録）。", "p5": "長期のインフレ期待は3.5〜4.5%で安定し、実際のインフレの急上昇の大半は一次産品価格で説明された。推定した需給ギャップは中央銀行の指標と、インフレ期待は企業や専門家の短中期の期待と整合した（抄録）。", "fun": "インフレの原因として重要な「景気の過熱度」や「人々の物価予想」は直接は見えません。ニューラルネットの中に経済学の式の形を組み込んで、見えない部分を推定する、という機械学習と経済理論の組み合わせ方が面白い点です。", "unverified": "予測精度の比較の数値は抄録になく未確認。"}}, {"id": "pn25", "rank": 25, "field": "経済学", "headline": "ネットスーパーは家計の買い物行動をどう変えたか", "title": "Online Grocery and Household Shopping Behavior: An Empirical Investigation", "url": "https://doi.org/10.2139/ssrn.7553478", "authors": "Jimin Park ほか", "venue": "SSRN", "date": "2026-10-03", "why": "米国の家計データで、オンライン食品購入が買い物行動に与える効果を実証した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "ネットスーパーの利用が家計の買い物行動をどう変えるかを、大手小売の郵便番号単位の段階的な導入を操作変数として推定した（抄録）。", "p3": "NielsenIQ消費者パネル（2015〜2019年、5万世帯超）の8品目について、年間購入量・買い物回数・買い物間隔への効果を推定した（抄録）。", "p5": "普段から定期的に買う世帯では購入量と回数が減り間隔が延び、まとめ買いに集約された。たまに買う世帯では逆に回数が増えた。どちらも計画的な補充に移る点は共通していた（抄録）。", "fun": "ネットスーパーで「買いすぎ」が減るのか増えるのか、という問いに、もともとの買い物の癖によって正反対の反応が出ると答えています。同じ変化（計画的に買う）が、人によって逆の結果を生むという点が面白いところです。", "unverified": "効果の大きさの具体値は抄録になく未確認。"}}, {"id": "pn26", "rank": 26, "field": "経営学", "headline": "グリーンウォッシングとグリーンハッシングで環境革新の質が異なる", "title": "Strategic Environmental Disclosure and Green Innovation Quality: Greenwashing versus Greenhushing", "url": "https://doi.org/10.2139/ssrn.7556863", "authors": "Guoliang Wang ほか", "venue": "SSRN", "date": "2026-10-03", "why": "中国上場企業で、環境情報を誇張する開示と控える開示がグリーン革新の質に与える効果を比較した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "環境情報を誇張するグリーンウォッシングと控えるグリーンハッシングの両方が、企業のグリーン革新の質を下げることを示した（抄録）。", "p3": "2010〜2024年の中国A株上場企業で、両者を残差に基づく指標で測り、グリーン発明特許の譲渡・ライセンスで革新の質を測った。操作変数推定や代替指標で頑健性を確かめた（抄録）。", "p5": "両方とも革新の質を有意に下げた。仕組みは非対称で、ハッシングは炭素リスクの過小評価、ウォッシングは過大評価と結びついた。ハッシングは株価の変動の大きさ、ウォッシングはESG評価の乖離の大きさと関連した（抄録）。", "fun": "環境への取り組みを「盛って話す」のも「隠して話さない」のも、どちらも本物の環境技術の質を下げてしまうという結果です。話し方の歪みが、市場の評価のずれを通じて会社の中の技術開発にまで跳ね返る、という連鎖が見どころです。", "unverified": "効果量の具体値は抄録になく未確認。"}}, {"id": "pn27", "rank": 27, "field": "経営学", "headline": "業界の構造的リスク下で分析能力が戦略的意思決定を支える", "title": "Risky Business? The Enabling Role of Business Analytics Capability for Strategic Decision-Making Under Structural Industry Risk", "url": "https://doi.org/10.2139/ssrn.7556999", "authors": "Henri Hussinki ほか", "venue": "SSRN", "date": "2026-10-03", "why": "ビジネス分析能力が構造的な業界リスクの下で意思決定の質を高める条件を検討した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "企業のビジネス分析能力は戦略的意思決定支援を介して競争力を高め、その経路は業界の構造的リスクが高いほど強まることを示した（抄録）。", "p3": "確率を見積もれる「リスク」は分析で扱いやすいという意思決定理論に基づき、フィンランド企業の対の調査回答178件をPLS-SEMで分析した（抄録）。", "p5": "分析能力は戦略的意思決定支援を介した間接効果のみで競争力を高め、構造的な業界リスクがこの関係を強めた（抄録）。", "fun": "「先が読めない不確実性」と「確率で表せるリスク」は違う、という区別がこの研究の鍵です。確率で表せる危険が多い業界ほど、データ分析の力が生きる、という結果は、分析が万能ではなく得意な場面があることを示しています。", "unverified": "効果量の具体値は抄録になく未確認。"}}, {"id": "pn28", "rank": 28, "field": "経営学", "headline": "取引相手が機械になるとき：生成AIによるコモディティ化と戦略", "title": "When the Counterparty Is a Machine: Strategy, Entrepreneurial Innovation and Digital Marketing Under Generative-AI Commoditization", "url": "https://doi.org/10.2139/ssrn.7552219", "authors": "Arthur de Miranda Neto ほか", "venue": "SSRN", "date": "2026-10-03", "why": "AIエージェントが信頼でなく検証で取引する時代の戦略・起業・マーケティングを論じた。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "取引相手が「信頼せず検証する」AIエージェントになる極限を考え、生成AIでコモディティ化しない差別化の源泉を整理した概念論文（抄録）。", "p3": "「コモディティ化の積み重ね」の枠組みで、生成AIが作れるものは希少でも模倣困難でもないとし、制度的な裏付け（ブランド＝蓄積された信頼、認証、説明責任）を合成できない残余とした（抄録）。", "p5": "防御可能性の検定、反証と人間の証拠を求める最小限の仮説の規律などの道具を提案した。実証データはない（抄録）。", "fun": "人間の客は、多少の誇張を大目に見たり評判を印象で判断したりします。AIの買い手はそうした「甘さ」を持たないので、マーケティングから人間ならではの許容を取り除いたとき何が残るかが見えてくる、という思考実験の発想が面白い点です。", "unverified": "実証的な検証はなく未確認。"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "ポアソン逆ガウス葉を持つベイズCARTで保険請求頻度を推定", "title": "Poisson-inverse Gaussian Leaves for Bayesian CART Claims Frequency Models", "url": "https://doi.org/10.2139/ssrn.7551801", "authors": "Enkelejd Hashorva ほか", "venue": "SSRN", "date": "2026-10-02", "why": "逆ガウスのフレイルティ表現を用いて、ベイズ回帰木の葉に過分散カウント分布を入れた。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "保険の請求頻度のベイズ回帰木で、末端の群にポアソン逆ガウス分布を使い、混合分布の選択と過分散の扱いのどちらが重要かを比べた（抄録）。", "p3": "逆ガウスのフレイルティ表現で頻度と分散の共役更新と節点の証拠を明示的に得た。分布間の差を全変動距離とヘリンジャー距離の展開で評価し、自動車保険のポートフォリオで示した（抄録）。", "p5": "平均と分散を揃えると負の二項分布との差は平均の3次と小さいが、個人の性質が期間をまたいで続くと2回請求後の更新係数は8〜27%違った。実データでは分散の学習の方が分布の変更より大きく改善した（抄録）。", "fun": "見た目がほとんど同じ2つの確率分布でも、事故を2回起こした人の翌年の保険料を計算すると最大で3割近い差が出る、という結果は意外です。統計モデルの細かな仮定が、現実のお金に大きく響くことがよく分かります。", "unverified": "なし"}}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "軽量な単調フローでニューラル競争累積モデルを推定", "title": "Neural Racing Accumulator Model Estimation With Lightweight Monotonic Flows", "url": "https://doi.org/10.31234/osf.io/bfsgr_v2", "authors": "Malte Lüken ほか", "venue": "PsyArXiv", "date": "2026-10-02", "why": "意思決定の競争モデルのパラメータを、単調フローを使ったニューラル推定で効率よく推定した。", "explain": {"basis": "抄録", "basis_note": "PsyArXivに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "素早い意思決定を証拠の「競走」とみなす競争累積モデルの尤度を、小さなニューラルネットと単調なスプライン・フローで学習し、事前分布やモデル設定から切り離して推定できるようにした（抄録）。", "p3": "各走者の条件付き確率密度と累積分布を同時に学習し、それらを組み合わせて競争モデルの尤度を計算し、最新のサンプラーと組み合わせる（抄録）。", "p5": "解析的に扱える場合と扱えない場合の競争拡散モデルで有用性を示した（抄録）。精度や速度の数値は抄録になし。", "fun": "「どちらのボタンを押すか」を、2人の走者が先にゴールする競走として表す心理学のモデルがあります。その計算が難しい部分を、小さなAIに覚えさせて代わりに計算させる、という形で、心のモデルとAIの道具を組み合わせているのが面白い点です。", "unverified": "既存手法との比較の数値は抄録になく未確認。"}}, {"id": "pn31", "rank": 31, "field": "統計学", "headline": "測定の間の状態の軌跡を推定するベイズ錨付き潜在学習", "title": "Bayesian Anchored Latent Learning for Estimating State Trajectories", "url": "https://doi.org/10.64898/2026.09.30.26363325", "authors": "Jason B. Gibbons ほか", "venue": "medRxiv", "date": "2026-10-02", "why": "頻度の高い間接観測と少ない信頼できる測定を組み合わせて、動的状態の軌跡を推定した。", "explain": {"basis": "抄録", "basis_note": "medRxivに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "まばらな信頼できる測定と頻度の高い間接記録を組み合わせて、動的な状態の軌跡を推定するベイズ錨付き潜在学習（BALL）を提案した（抄録）。", "p3": "全履歴から軌跡を再構成する双方向Transformerの教師と、その再構成と観測から学ぶ前向きのみのTransformerの生徒を組み合わせる（抄録）。", "p5": "30のシミュレーションで、測定から直接学習した同じTransformerより軌跡誤差を7%減らした。精神科の患者1,609人の記録では、21日・28日間隔の測定で保留した質問紙得点の予測を改善し、不確実性に基づく測定依頼がさらに改善した（抄録）。", "fun": "体調は毎日変わるのに、しっかりした検査は月に1回しかできない、という状況はよくあります。「後から全部を見て描いた線」を先生役にして、「今までの記録だけで予想する」生徒役を鍛える、という教え方の工夫が面白い点です。", "unverified": "なし"}}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "テキスト性能を落とさずに多モーダル埋め込みへ拡張", "title": "Omni-Embed-Mini: Binding Modalities Without Forgetting via Dense Distillation", "url": "https://arxiv.org/abs/2610.02148", "authors": "Mohammed Irfan Kurpath ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-02", "why": "密な蒸留によって、テキスト埋め込みモデルを他のモダリティに広げても検索性能を保てることを示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers（arXiv）の抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "テキスト側の重みを一切変えずに、テキスト・音声・画像・動画・文書を1つの埋め込み空間にまとめる0.9Bパラメータのモデルを示した（抄録）。", "p3": "各メディアを詳しい説明文と対にし、凍結したバックボーンがその説明文に与える埋め込みを教師にする。教師と生徒が同じ重みを共有するため、軽い射影とLoRAで整合でき、Matryoshka SigLIPの対照損失と難しい負例の採掘で学習する（抄録）。", "p5": "テキストの重みが元と同一なので検索性能は落ちず（MTEB-v2 BEIR-8でnDCG@10が49.57）、比較した公開モデルより約2.7〜9.5倍小さい。2.3B版は全モダリティ平均で閉じたgemini-embedding-2をわずかに上回った（抄録）。", "fun": "新しいことを覚えさせると前に覚えたことを忘れる、というのはAIの悩みです。この研究は、言葉の部分には一切手を触れず、画像や音声を「言葉で説明したらどうなるか」に寄せていくことで、忘れないまま新しい感覚を身につけさせています。", "unverified": "なし"}}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "密な予測を表現整合として使うピクセル拡散", "title": "PixelDense: Dense Prediction as Representation Alignment for Pixel Diffusion", "url": "https://arxiv.org/abs/2610.00483", "authors": "Lehan Yang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-02", "why": "拡散Transformerの学習を速める表現整合を、密な予測の形で改良した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers（arXiv）の抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "画素空間の拡散モデルの学習を、意味と幾何の2系統に分けた表現整合（REPA）で改善するPixelDenseを提案した（抄録）。", "p3": "DINOv2とSAM2を意味の射影系統、Depth Anything v2とMetric3D v2を幾何の射影系統に流し、重み空間の直交性罰則で2系統を分離する。教師4つは学習中は凍結し、推論時は使わない（抄録）。", "p5": "PixelGen-XXLのGenEval総合が0.7927から0.8093に上がり、単一教師や分離しない複数教師のすべての変種を上回った。部分ノイズからの再構成では、パノプティックPQが最大53.1%向上し、深度AbsRelが36.0%減った（抄録）。", "fun": "画像を作るAIに、別のAIの「見方」を手本として教えると学習が速くなります。ところが手本を全部足し合わせると、意味を重視する先生と形を重視する先生がけんかして逆効果になる。そこで先生ごとに教室を分けた、という発想が面白いところです。", "unverified": "なし"}}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "知覚・推論・評価の循環で視覚言語モデルの物理的知能を測る", "title": "PhysVista: Benchmarking Physical Intelligence in VLMs via a Perception-Reasoning-Assessment Loop", "url": "https://arxiv.org/abs/2610.00559", "authors": "Xinge Peng ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-02", "why": "視覚言語モデルの物理的な理解を評価する新しいベンチマークを構築した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers（arXiv）の抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "視覚言語モデルが現実の物理的な整合性を理解しているかを、知覚・推論・評価の閉じた循環で測るベンチマークPhysVistaを作った（抄録）。", "p3": "物理状態の知覚、物理的動態の推論、物理的もっともらしさの評価を合わせて評価し、出来事レベルと規模レベルの推論を区別する。実写動画とAI生成動画の両方を含む（抄録）。", "p5": "多様な視覚言語モデルで、物理的推論ともっともらしさの評価に大きな限界があり、視覚的な認識と本当の物理的理解の間に差が残ることを示した（抄録）。具体的な正答率は抄録になし。", "fun": "AIは動画に何が映っているかは言えても、「ボールがこう跳ねるのはおかしい」とまでは分からないことがあります。物を見る・理由を考える・おかしさを判断する、という人間が自然に行う3段階をまとめて試すことで、その弱点を浮かび上がらせています。", "unverified": "モデルごとの性能の数値は抄録になく未確認。"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "一人称動画生成で目的に沿った操作を評価", "title": "Ego2Act: Evaluating Goal-Directed Manipulation in Egocentric Video Generation", "url": "https://arxiv.org/abs/2610.01092", "authors": "Patrick Amadeus Irawan ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-02", "why": "動画生成モデルを世界シミュレータとして使えるかを、一人称視点の操作課題で評価した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers（arXiv）の抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "一人称視点の動画生成モデルが、目的を達成するための複数段階の手作業をきちんと再現できるかを評価するベンチマークEgo2Actを作った（抄録）。", "p3": "日常の110課題・2,640本の動画で、初期画像と高水準の目標から手で物を操作する動画を生成させる。参照なしで評価するEgo2ActJudgeも作り、人間の合意との一致を比較した（抄録）。", "p5": "生成された動画は手順を飛ばしたり途中までしか実行しなかったりし、後の手順に必要な状態が欠けて目標が達成されないことが多かった。細かな物理的操作でも一貫して失敗した（抄録）。", "fun": "「お茶を入れる」なら、湯を沸かし、茶葉を入れ、注ぐ、という順番が大事です。動画を作るAIは見た目は上手でも、途中の手順をこっそり飛ばしてしまう、という人間なら起こさない失敗が見つかった点が面白いところです。", "unverified": "モデルごとの達成率の数値は抄録になく未確認。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "音声・映像の多段推論にツールを組み込むOmniSeek", "title": "OmniSeek: Native Tool Integration for Multi-turn Audio-Visual Reasoning", "url": "https://arxiv.org/abs/2610.02181", "authors": "Haibo Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-02", "why": "全モーダルLLMをツール利用のエージェントに変え、音声・映像の多段推論を行う枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers（arXiv）の抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "全モーダルのLLMを、見るか聞くか、どの時間区間かを自分で決めて証拠を取りに行く多段推論エージェントに変えるOmniSeekを提案した（抄録）。", "p3": "音声・映像の証拠を挟んだ17万件の多段の推論軌跡を合成して教師あり学習し、検証可能な報酬による2段階の強化学習で最適化した。両方のモダリティに依存する推論に報酬を与える目的関数を加えた（抄録）。", "p5": "幅広いベンチマークで、適応的なモダリティ横断の証拠探索を学び、音声・映像推論の性能を一貫して改善したと報告する（抄録）。具体的な数値は抄録になし。", "fun": "長い動画を最初から最後まで一度に見るのではなく、「ここは音を聞き直そう」「この場面を見返そう」と自分で決めて調べに行くAIです。片方の感覚だけで答える近道をとると得点が上がらない仕組みにしているのが工夫です。", "unverified": "改善幅の数値は抄録になく未確認。"}}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "部分観測のロボット操作で技能レベルの記憶を評価・強化", "title": "Benchmarking and Enhancing Skill-Level Memory for Partially Observable Robotic Manipulation", "url": "https://arxiv.org/abs/2609.38886", "authors": "Yansong Shi ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-02", "why": "部分観測下のロボット操作に必要な記憶を評価するベンチマークと改善法を示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers（arXiv）の抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "今の観測だけでは分からない隠れた作業状態を覚えておく必要があるロボット操作のために、記憶を評価するベンチマークHIDEと記憶強化の枠組みSEEKを提案した（抄録）。", "p3": "HIDEは回数の数え上げ、過去の状態の想起、実行の進み具合の追跡を含む15課題からなる。SEEKは3つの補完的な記憶の仕組みを組み合わせる（抄録）。", "p5": "既存の方策はHIDEで大きな限界を示し、記憶の追加はシミュレーションと実機の両方で成功率を高めた。個々の仕組みは課題によって逆効果もあったが、組み合わせが平均成功率で最高だった（抄録）。", "fun": "「同じ動作を3回繰り返す」には、今何回目かを覚えておく必要があります。見た目が同じでも、それまでの経緯によって次の行動が変わる、という人間には当たり前のことがロボットには難しく、その弱点を測る物差しを作った点が面白いところです。", "unverified": "成功率の具体的な数値は抄録になく未確認。"}}, {"id": "pn38", "rank": 38, "field": "機械学習", "headline": "アッセイ情報で教師づけする分子のグラフ表現学習", "title": "GRASP: Graph Representation Learning with Assay Supervision for Molecular Properties", "url": "https://doi.org/10.64898/2026.09.28.755019", "authors": "Satya Pratik Srivastava ほか", "venue": "bioRxiv", "date": "2026-10-03", "why": "まばらな実験データを複数アッセイからの教師で補う、分子物性のグラフ表現学習モデルを提案した。", "explain": {"basis": "抄録", "basis_note": "SSRN/bioRxiv等に登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "豊富な分子構造と、まばらで複数のアッセイに散らばる実験データを、段階的に学ぶグラフTransformer（9,350万パラメータ）のGRASPを提案した（抄録）。", "p3": "まずZINC20の15.4億件の分子提示で置換トークン検出により構造を学び、次にChEMBLの642アッセイの生物活性に適応させる（抄録）。", "p5": "23のOpenADMET指標でMAE平均0.374となり、CheMeleon（0.383）、ECFP4-LightGBM（0.408）、Chemprop（0.440）を下回った。ChEMBLへの適応でMAEは0.407から0.374に下がり、23中21の指標が改善した（抄録）。", "fun": "薬の候補の形のデータは山ほどあるのに、実際に効いたかの実験データはわずかです。まず形をたくさん見て慣れ、次に少ない実験結果で仕上げる、という二段階の学び方が、人間の勉強法とも似ていて分かりやすい工夫です。", "unverified": "なし"}}, {"id": "pn39", "rank": 39, "field": "機械学習", "headline": "脳アトラスに依存しない脳結合の基盤モデル", "title": "AREION: A Foundation Model for Atlas-Agnostic Representation Learning of Brain Connectome", "url": "https://doi.org/10.64898/2026.09.26.754551", "authors": "Zhao Zhang ほか", "venue": "bioRxiv", "date": "2026-10-02", "why": "fMRIの脳結合について、領域分割（アトラス）によらず使える表現を学習する基盤モデルを提案した。", "explain": {"basis": "抄録", "basis_note": "bioRxivに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "脳の領域分割（アトラス）の違いにかかわらず使える、fMRIの脳結合の基盤モデルAREIONを提案した（抄録）。", "p3": "異なるアトラスの脳領域と結合を、空間・機能・形態の特徴に基づき共通の表現空間に写す手法と、領域ごとの結合を可変長のトークン列として扱う階層的な脳Transformerを組み合わせ、多アトラスの大規模データで自己教師あり事前学習した（抄録）。", "p5": "多様な下流課題で、強い教師ありの基準と既存の基盤モデルを上回ったと報告する（抄録）。具体的な数値は抄録になし。", "fun": "脳の地図の区切り方は研究ごとにばらばらで、これまでのAIは地図が変わると学び直しが必要でした。区切りの細かさに関係なく脳の働きを読み取れるようにした点は、異なる研究のデータをつなげる鍵になりそうです。", "unverified": "性能の数値は抄録になく未確認。"}}, {"id": "pn40", "rank": 40, "field": "機械学習", "headline": "安全に関わる医療機械学習は「安定性優先」の報告を", "title": "Safety-Relevant Biomedical Machine Learning Should Adopt Stability-First Reporting", "url": "https://doi.org/10.64898/2026.09.30.26364447", "authors": "Zayn Andre Zainal ほか", "venue": "medRxiv", "date": "2026-10-03", "why": "独立同分布の評価だけでなく、分布変化への安定性を先に報告すべきだと提言した。", "explain": {"basis": "抄録", "basis_note": "medRxivに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "安全に関わる医療の機械学習は、独立同分布の評価だけでなく、臨床的にありうる摂動の下での性能を報告する「安定性優先」の報告基準を採るべきだと論じた立場論文（抄録）。", "p3": "間引き、時刻のずれ、まとまった欠測、チャネルの脱落、信号雑音比の変化などの摂動での性能報告を求め、制御した仕組みの検証で、不規則な観測への依存と高曲率の学習による摂動への敏感さという2つの危険を例示した（抄録）。", "p5": "特定のモデルや最適化法を推奨するのではなく、頑健性の主張を検証可能にする最小限の報告基準を提案した（抄録）。", "fun": "テストではよい点を取るAIも、病院の現場では測定が抜けたり時刻がずれたりします。きれいな試験問題だけでなく、「意地悪な条件」でも解けるかを報告しようという提案は、試験の点と実力の違いを見抜く知恵と言えます。", "unverified": "なし"}}, {"id": "pn41", "rank": 41, "field": "因果推論", "headline": "標準化効果量は処置前後どちらのSDを使うかで変わる", "title": "Same Effect, Different Magnitude: How the Choice of Pre- or Post-Treatment Standard Deviation Shapes Standardized Effect Sizes in Psychological Clinical Trials", "url": "https://doi.org/10.31234/osf.io/43pyn_v1", "authors": "Matthias Pillny ほか", "venue": "PsyArXiv", "date": "2026-10-03", "why": "心理療法の臨床試験で、標準化平均差の分母の選び方が効果の大きさの解釈を変えることを示した。", "explain": {"basis": "抄録", "basis_note": "PsyArXivに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "心理療法の無作為化試験100件で、標準化平均差を処置前と処置後のどちらの標準偏差で割るかが、効果の大きさを系統的に変えることを示した（抄録）。", "p3": "各試験で処置前のプールSDと処置後のプールSDで効果量を計算し、対応のある差、多層メタ回帰、Bland–Altman分析で比べた（抄録）。", "p5": "処置前SDによる効果量は処置後SDより平均0.11大きく、多層メタ回帰では0.082（13%増）大きかった。症状の閾値で参加者を選んだ研究で差が大きく、70%の研究は効果量の計算方法を報告していなかった（抄録）。", "fun": "「効果がどれくらいか」を表す数字は、割り算の分母を何にするかで1割以上も変わります。症状が重い人だけを集めた試験では始めのばらつきが小さく、分母が小さくなって効果が大きく見えるのです。計算の細部が結論を左右する好例です。", "unverified": "なし"}}, {"id": "pn42", "rank": 42, "field": "因果推論", "headline": "HPV層別の因果デジタルツインで頭頸部がんの個別生存利益を推定", "title": "HPV-Stratified Causal Digital Twins for Personalized Survival Benefit Estimation in Head and Neck Cancer", "url": "https://doi.org/10.64898/2026.09.30.26363910", "authors": "Keyur D. Shah ほか", "venue": "medRxiv", "date": "2026-10-03", "why": "放射線腫瘍学で、因果推論に基づくデジタルツインで患者ごとの治療利益を推定する枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "medRxivに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "頭頸部がんで、化学放射線療法と放射線単独の患者ごとの2年生存の利益を、HPVの有無で層別した因果デジタルツインで推定した（抄録）。", "p3": "公開のRADCUREコホート（3,346人）を治療開始年で学習・検証に分け、ベイジアンネットワークの構造学習でマルコフブランケットを特定し、二重機械学習の因果フォレストで個別の治療効果を推定した。重なりの制約を課した（抄録）。", "p5": "HPV陰性では検証のAUC = 0.72、C指数 = 0.81で、平均処置効果は化学放射線療法を支持した（推定τの平均 = 0.13）（抄録）。", "fun": "同じがんでも、ウイルス（HPV）が関わるかどうかで治療の効き方が違います。「この患者なら抗がん剤を足すとどれだけ得か」を一人ひとり見積もるために、原因と結果の関係を表すネットワークと機械学習を組み合わせている点が見どころです。", "unverified": "HPV陽性群の結果は抄録の範囲で未確認。観察データのため未測定交絡の影響は未確認。"}}, {"id": "pn43", "rank": 43, "field": "教育", "headline": "生徒が平均より速く伸びる高貧困校がある", "title": "Hidden Gems: High-poverty Schools Where Students Learn Faster than Average", "url": "https://doi.org/10.2139/ssrn.7550265", "authors": "Pouyan Golshani", "venue": "SSRN", "date": "2026-10-03", "why": "スタンフォード教育データで、成績水準でなく伸びで見ると高貧困でも優れた学校があることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "成績の水準ではなく伸びで見ると、生徒の大半が低所得層なのに全国平均より速く学力が伸びる「隠れた名校」が米国に1,669校あることを示した（抄録）。", "p3": "スタンフォード教育データアーカイブ（SEDA 2025.2）で3〜8年生の38,000校超の到達度と伸び（2022〜2025年）を、低所得生徒の比率と結びつけた。伸びが2009〜2019年にも平均を上回ることを条件にした（抄録）。", "p5": "貧困は到達度と強く（r = −0.63）関連するが伸びとは弱い（r = −0.12）。隠れた名校の生徒は年に1.29学年分伸びるが86%は到達度が全国平均未満。学区の支出と伸びは無関係（r = 0.01）だった（抄録）。", "fun": "テストの点は家庭の豊かさをかなり映してしまうので、点数で学校を選ぶと「よい学校＝豊かな地域の学校」になりがちです。どれだけ伸ばしたかで見ると、評価の低い学校の中に宝物が隠れている、という見方の転換が鮮やかです。", "unverified": "なし"}}, {"id": "pn44", "rank": 44, "field": "教育", "headline": "スクールソーシャルワーカーは若者の犯罪と教育を改善するか", "title": "Does School Social Work Work? The Impact of School Social Workers on Youth Crime and Education", "url": "https://econpapers.repec.org/RePEc:bav:wpaper:246_drescher.rdf", "authors": "Katharina Drescher", "venue": "RePEc NEP", "date": "2026-01-26", "why": "スクールソーシャルワーカーの配置が若者の犯罪と教育成果に与える効果を推定した。", "explain": {"basis": "抄録", "basis_note": "RePEc NEP（NBERワーキングペーパー）の抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "ドイツの州が学校での乱射事件を受けてスクールソーシャルワーカーを増やしたことを利用し、その配置が若者の犯罪と教育を改善することを示した（抄録）。", "p3": "導入の地域と時期の違いと、独自の行政犯罪データを使って効果を推定した（抄録）。", "p5": "スクールソーシャルワーカーは若者の犯罪を年17%減らし、暴力犯罪の被害を減らし、性犯罪の発覚を助けた。留年も減らした（抄録）。", "fun": "先生以外の大人が学校にいることが、子どもの非行を減らし、学業も助ける、という結果です。悲しい事件をきっかけにした制度の導入が、思いがけず「自然の実験」になり、その効果を測れた点も研究として興味深いところです。", "unverified": "なし"}}, {"id": "pn45", "rank": 45, "field": "教育", "headline": "一戸建て専用の用途地域が学校の分離を生む", "title": "Single Family Schoolyards: Residential Zoning and School Segregation", "url": "https://doi.org/10.31235/osf.io/rb4wx_v1", "authors": "Stan Nguyen Oklobdzija ほか", "venue": "SocArXiv", "date": "2026-10-03", "why": "住宅の用途地域規制が学校の人種・所得による分離に与える影響を分析した。", "explain": {"basis": "抄録", "basis_note": "SocArXivに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "一戸建てと集合住宅の配置を決める用途地域規制が、学校の人種・所得による分離を生んでいることを示した（抄録）。", "p3": "米国コミュニティ調査の住宅数を923学区と13,002の通学区域、2,700万の住宅区画に割り当てて分析し、通学区域の境界の引き直しも利用した（抄録）。", "p5": "一戸建てと集合住宅が通学区域間で偏って分布する学区ほど分離が大きかった。一戸建ての割合が高い通学区域の学校はアジア系と白人の生徒の割合が高く、境界の引き直しで一戸建ての割合が増えるとその割合はさらに増えた（抄録）。", "fun": "学校の分離を禁じる判決から70年たっても分離が続くのはなぜか。その答えの一つが「どんな家を建ててよいか」という街づくりのルールにある、という指摘です。教育の問題が、実は都市計画の問題でもあることを示しています。", "unverified": "効果の大きさの数値は抄録になく未確認。"}}, {"id": "pn46", "rank": 46, "field": "教育", "headline": "校庭の緑化はフィラデルフィアの学業・行動・近隣に効くか", "title": "Effects of Schoolyard Greening on Academic, Behavioral and Neighborhood Outcomes in Philadelphia, PA", "url": "https://doi.org/10.2139/ssrn.7556733", "authors": "Michelle Kondo ほか", "venue": "SSRN", "date": "2026-10-03", "why": "校庭緑化プログラムが学業・行動・地域の成果に与える効果を検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "フィラデルフィアで校庭を緑化した20校を120の比較校と比べ、緑化が出席率をわずかに上げることを示した（抄録）。", "p3": "導入時期がずれる差の差法で、2015〜2023年に緑化した学校の効果を推定し、ワイルド・クラスター・ブートストラップ、並べ替え検定、部分識別などで推論した（抄録）。", "p5": "平均日次出席率が0.9ポイント上がった（ATT = 0.009、95%CI 0.3〜1.4）。数学・理科の習熟の効果は全期間平均ではゼロと区別できなかった（ATT = 3.0、95%CI −0.2〜6.1）。停学と犯罪は事前の傾向が異なり解釈しなかった（抄録）。", "fun": "校庭に緑を増やすと子どもが学校に来るようになるのか。結果は「出席は少し増えるが、成績はまだはっきりしない」という控えめなものです。前提が崩れた指標はあえて解釈しない、という慎重な態度も、因果推論のお手本として学べます。", "unverified": "なし"}}, {"id": "pn47", "rank": 47, "field": "環境・気候政策", "headline": "気候変化下で建物性能代理モデルに必要な将来シミュレーション量", "title": "Quantifying the Future-Simulation Budget for Reliable Building Performance Surrogates under Climate Shift", "url": "https://doi.org/10.2139/ssrn.7556533", "authors": "Farshid Dehghan", "venue": "SSRN", "date": "2026-10-03", "why": "気候の変化に対して、建物の性能を予測する機械学習の代理モデルを信頼できるものにするための計算量を定量化した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "現在の気候で学習した建物性能の代理モデルが将来気候で精度を失ったとき、何回の将来シミュレーションを追加すれば回復するかを定量化した（抄録）。", "p3": "現在気候の1,826件のEnergyPlusシミュレーションで多出力の代理モデルを学習し、2050年と2080年の独立データで評価した。そのまま適用、将来のみ、併合、DNNの転移学習などを比べた（抄録）。", "p5": "そのまま適用すると相対R²の損失は2050年で約10〜27%、2080年で29〜33%で、温熱快適性は2080年に約78%失われた。転移学習は将来シミュレーション36〜40件（適応用の5%）で完全な将来学習の数ポイント以内まで回復した（抄録）。", "fun": "今の天気で鍛えたAIは、暑くなった未来ではうまく予測できません。ところが未来の条件で少しだけ（全体の5%ほど）追加で練習させると、ほとんど元の実力に戻る、という結果は、学び直しのコストが意外に小さいことを示しています。", "unverified": "なし"}}, {"id": "pn48", "rank": 48, "field": "環境・気候政策", "headline": "メタノール燃料船の実運航でのライフサイクル排出と経済性", "title": "Life cycle GHG emissions and economic assessment of methanol-powered fleets", "url": "https://doi.org/10.2139/ssrn.7557344", "authors": "Hangwei Li ほか", "venue": "SSRN", "date": "2026-10-03", "why": "海運の脱炭素の候補であるメタノール燃料船の実際の性能を、温室効果ガスと経済性の両面から評価した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "2025年に運航したメタノール燃料船76隻の実データから、燃料の入手性・ライフサイクルの温室効果ガス・経済性を評価した（抄録）。", "p3": "AISと技術データを用いたボトムアップモデル、ライフサイクル評価、総保有コスト分析を組み合わせ、EU排出量取引制度とFuelEU Maritimeの政策シナリオで比べた（抄録）。", "p5": "バイオメタノールが十分なら排出はディーゼル船より49〜75%減るが、平均削減費用は約463ドル/t CO2換算と高かった。FuelEU MaritimeはETSより総保有コストの差を縮めた。既存の燃料補給網が長距離航行を制約した（抄録）。", "fun": "船の燃料を変えれば排出は半分以上減らせるのに、燃料が高く、補給できる港も少ない、という現実の壁を、実際に走っている船のデータで描いています。技術ができても、燃料と港と制度がそろわないと広がらないことがよく分かります。", "unverified": "なし"}}, {"id": "pn49", "rank": 49, "field": "環境・気候政策", "headline": "データセンター排熱の回収で建物部門を脱炭素化", "title": "Climate Change Impacts on Building Sector Decarbonization through Data Centre Waste Heat Recovery", "url": "https://doi.org/10.2139/ssrn.7556697", "authors": "Xiaoshu Lv ほか", "venue": "SSRN", "date": "2026-10-03", "why": "AIで増えるデータセンターの排熱を建物の暖房に使う効果を、気候変動の影響込みで評価した。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "フィンランドで液冷データセンターの排熱を地域暖房の建物に回収・供給する効果が、気候変動の下でも頑健であることを示した（抄録）。", "p3": "冷却分配装置の1次側と2次側を統合する熱交換器の構想を提案し、2つのニューラルネットで2030年と2050年の暖房需要と還り温度を、RCP2.6・4.5・8.5の補正気象データで予測した（抄録）。", "p5": "すべての気候シナリオで、回収した排熱が賄う換気暖房の需要は時間とともに増えた。気候による暖房需要の変化にもかかわらず、25年間のCO2削減量への影響は小さかった（抄録）。", "fun": "AIの計算を支えるデータセンターは大量の熱を出します。それを捨てずに近くの建物の暖房に使えば、両方の排出が減らせます。温暖化で暖房需要が減っても効果がほとんど落ちない、という結果は、この仕組みの意外な強さを示しています。", "unverified": "削減量の具体値は抄録になく未確認。"}}, {"id": "pn50", "rank": 50, "field": "環境・気候政策", "headline": "都市の気候健康リスクはシステム的で曖昧さを含む", "title": "Systemic climate health risk and the missing role of ambiguity in cities", "url": "https://doi.org/10.2139/ssrn.7557189", "authors": "Darcy Glenn ほか", "venue": "SSRN", "date": "2026-10-03", "why": "都市の気候と健康の問題を個別の影響でなくシステム的なリスクとして捉え、曖昧さの役割を論じた。", "explain": {"basis": "抄録", "basis_note": "SSRNに登録された抄録を使用（本文は入手できず）", "preprint": true, "short": true, "p1": "都市がCDPに報告した気候と健康のリスクを分析し、都市はリスクの体系的な性質を認識するようになった一方、曖昧さや見方の対立をほとんど扱っていないことを示した（抄録）。", "p3": "59都市の129報告（2020〜2024年）の灰色文献を、混合研究法のレビューで分類・分析した（抄録）。", "p5": "都市は健康を個人だけでなく保健システムや健康の社会的決定要因まで広げて捉え、COVID-19を類例として連鎖的な失敗などに言及していた。しかし曖昧さや競合する枠組みにはほとんど触れず、適応を技術的問題として扱っていた（抄録）。", "fun": "コロナ禍で「一つの問題が次々と連鎖する」怖さを学んだ都市は、気候と健康のリスクもそう捉え始めました。ところが「何をリスクとみなすか」で人々の価値観がぶつかる点は見落としがちで、それがコロナ対策での反発と同じ落とし穴だ、という指摘が鋭い点です。", "unverified": "なし"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "評価専門家の当事者意識が監査判断を改善", "title": "Specialists' Evidence Evaluation and Judgments in Audits", "url": "https://doi.org/10.1111/1911-3846.70077", "authors": "Tim D. Bauer ほか", "venue": "Contemporary Accounting Research", "date": "2026-10-03", "sjr": 3.686, "citescore": 7.3, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2}, {"id": "jr02", "rank": 2, "headline": "物理制約付き多モーダルSHMで岸壁の損傷検知", "title": "Physics-Informed Multimodal Sensing and Machine Learning Framework with Real-Time Digital Twin for Intelligent Structural Health Monitoring of Marine Wharves", "url": "https://doi.org/10.70917/jcc-2026-027", "authors": "Mohammad Asadian Ghahfarokhi ほか", "venue": "Journal of Climate Change", "date": "2026-10-03", "theme": "VBI・橋梁SHM", "theme_no" }, {"id": "jr21", "rank": 21, "headline": "多チャネルCNNとホモロジー解析で構造状態を識別", "title": "Structural state identification based on multi-channel convolutional neural network and homology analysis", "url": "https://doi.org/10.1016/j.istruc.2026.113192", "authors": "X.Y. Li ほか", "venue": "Structures", "date": "2026-10-03", "sjr": 1.108, "citescore": 7.1, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "出版社サイト・登録情報とも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、多チャネルの畳み込みニューラルネットとホモロジー（位相的データ解析）を組み合わせて構造物の状態を識別する研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "ホモロジーは、ドーナツとコーヒーカップを「穴が1つ」という点で同じとみなす数学の考え方です。それを振動データの「形」に当てはめて、構造物が健全か傷んでいるかを見分ける、という組み合わせの意外さが面白い問いです。", "unverified": "手法・検証データ・結果のすべて。"}}, {"id": "jr22", "rank": 22, "headline": "吊橋ワイヤーロープの腐食進展と引張挙動", "title": "Corrosion Evolution and Tensile Behavior of Wire Rope Strands in Suspension Bridges", "url": "https://doi.org/10.1016/j.rineng.2026.113352", "authors": "Zhiguo Zhang ほか", "venue": "Results in Engineering", "date": "2026-10-03", "sjr": 1.24, "citescore": 8.8, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、同じ研究のSSRN版の抄録（Crossrefの題名検索）を使用", "preprint": false, "short": true, "p1": "中国の海峡横断吊橋のワイヤーロープ素線の腐食の進み方を促進腐食試験で調べ、腐食孔の向きと寸法が応力集中に与える影響をFEMで示した（抄録）。", "p3": "電気化学的な促進腐食試験で腐食の進展を観察し、腐食孔を含む素線の詳細な3次元FEMで、孔の向きと長さ・幅・深さを変えて局所応力と接触圧を調べた（抄録）。", "p5": "供用初期（約114日相当）は腐食速度が徐々に上がってから加速し、孔は楕円体状だった。後期は隣接線の密着で孔の成長が抑えられた。孔の長軸と荷重の角度が0°から90°に増えると最大応力と接触圧が大きく上がり、幅と深さの増加は応力集中を強めた（抄録）。", "fun": "吊橋を支えるケーブルは細い鋼線の束です。さびの穴が「どちらを向いているか」で危険度が大きく変わる、という結果は意外で、同じ大きさの傷でも向き次第で強さが違うという、ものの壊れ方の繊細さを示しています。", "unverified": "SSRN版と出版版の内容の異同は未確認。"}}, {"id": "jr23", "rank": 23, "headline": "欠損補完と不均衡対策で倒産予測のF1が改善", "title": "Mitigating challenges: Handling mis sing values and imbalanced data in bankruptcy prediction using machine learning", "url": "https://doi.org/10.36708/ls.2023.i02.006", "authors": "Ednawati Rainarli ほか", "venue": "Littera Scripta", "date": "2026-10-03", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）。2023年号の論文で今回新たに登録されたもの", "preprint": false, "short": true, "p1": "倒産予測の機械学習で、欠損値の補完とクラス不均衡への対処が予測性能を大きく改善することを示した（抄録）。", "p3": "ダウンサンプリングによるクラスの均衡化と、最近傍の平均による欠損値の補完を前処理として行い、ランダムフォレストで倒産を予測した。ポーランド企業のデータを使った（抄録）。", "p5": "欠損と不均衡に対処すると、ランダムフォレストのF1スコアが対処しない場合より30%改善した（抄録）。", "fun": "倒産する会社は少数派なので、そのままAIに学ばせると「全部大丈夫」と答えるだけで高い正解率になってしまいます。データの偏りと抜けを整えるだけで見つける力が大きく上がる、という結果は、下ごしらえの大切さを教えてくれます。", "unverified": "他国の企業データでの再現性は著者も限界として認めており未確認。"}}, {"id": "jr24", "rank": 24, "headline": "デジタル技術が「理想の労働者」像を変える", "title": "The digital ideal worker image: How digital technology is shifting work’s temporal and spatial boundaries", "url": "https://doi.org/10.1016/j.riob.2026.100239", "authors": "Youngrong Lee ほか", "venue": "Research in Organizational Behavior", "date": "2026-10-03", "sjr": 2.465, "citescore": 5.1, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "出版社サイト・登録情報とも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、デジタル技術が仕事の時間的・空間的な境界を変え、「理想の労働者」像を変えつつあることを論じる研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "昔の「理想の社員」は長時間会社にいる人でした。スマホやオンライン会議で、いつでもどこでも働けるようになった今、「いつでもつながっている人」が新しい理想像になっていないか、という問いは、働き方の常識を問い直します。", "unverified": "手法・検証データ・結果のすべて。"}}, {"id": "jr25", "rank": 25, "headline": "アジア諸国でAIと主観的幸福の関係はマクロ経済で変わる", "title": "Understanding the AI and subjective well-being relationship: the influence of macroeconomic factors in Asian economies", "url": "https://doi.org/10.1007/s00146-026-03347-5", "authors": "Niti Khandelwal Garg ほか", "venue": "AI and Society", "date": "2026-10-03", "sjr": 1.504, "citescore": 10.9, "citescore_year": "2025", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "題名", "basis_note": "出版社サイト・登録情報とも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題 較の準実験で、WHOQOL-BREFとZarit介護負担尺度を研修前後に測った（抄録）。", "p5": "64人が修了し、開始時に42.1%が臨床的に有意な負担を抱えていた。研修後、全体的な生活の質が改善し（p = 0.001）、介護負担が減った（p = 0.031）。開始時の負担が大きい人ほど変化が大きかった。学歴が高いほど負担のオッズが高かった（OR = 1.243）（抄録）。", "fun": "家族を介護する人の多くは、介護の方法を誰からも教わらずに始めます。短いオンライン講座でも負担が軽くなる兆しが見えた、という結果は希望が持てますが、比べる群がないため「時間が経っただけ」の可能性も残る点に注意が必要です。", "unverified": "対照群がないため研修の因果効果は未確認（著者も明記）。"}}, {"id": "jr28", "rank": 28, "headline": "介護者のウェルネス多次元尺度の心理測定的検討", "title": "Caregiver Wellness Questionnaire: Initial Psychometric Evaluation of a Multidimensional Measure of Well-Being Among a Mixed U.S. Caregiver Sample", "url": "https://doi.org/10.3390/healthcare14193247", "authors": "Eboni I. Green ほか", "venue": "Healthcare", "date": "2026-10-01", "citescore": 5.5, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "介護者のウェルビーイングを9次元27項目で測る質問紙（CWQ）の信頼性と妥当性を初めて検討し、6因子の構造を見いだした（抄録）。", "p3": "2022〜2025年に回答した225人の便宜標本の二次分析で、内的一貫性、探索的因子分析、下位尺度間の相関を調べた。家族介護者と直接ケア職員は区別できなかった（抄録）。", "p5": "McDonaldのω = 0.828で信頼性は高かった。探索的因子分析では固有値1超とスクリープロットから6因子が残り、もとの9下位尺度の項目は6因子に対応づけられた（抄録）。", "fun": "「元気かどうか」を測るには、体だけでなく、仕事、お金、人とのつながり、心のよりどころなど、いろいろな面があります。9つに分けて作った質問紙が、実際の回答では6つのまとまりに整理された、というのは、作り手の想定と回答者の感じ方のずれを映していて面白い点です。", "unverified": "確認的因子分析による検証は抄録になく未確認。"}}, {"id": "jr29", "rank": 29, "headline": "ニーズ・クラフティング尺度の仏英2言語版を検証", "title": "Validation of the French and English Versions of the Need Crafting Scale Among Emerging Adults From France and Canada", "url": "https://doi.org/10.1177/10731911261488746", "authors": "William A. Gilbert ほか", "venue": "Assessment", "date": "2026-10-03", "sjr": 2.04, "citescore": 10.4, "citescore_year": "2025", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "自律性・有能感・関係性を自ら満たそうとする「ニーズ・クラフティング」の尺度について、仏語版と英語版の心理測定的性質を若年成人で検証した（抄録）。", "p3": "フランスの1,304人とカナダの750人・800人の3標本で、確認的因子分析により1次（6因子）と階層的（2次・3次）構造の妥当性と合成信頼性、国と言語をまたぐ測定不変性を調べた（抄録）。", "p5": "1次・階層構造の因子妥当性と信頼性が支持され、測定不変性は1次・2次構造で部分的に、3次構造で完全に支持された。マインドフルネス・ニーズ充足・ウェルビーイングと正、抑うつと負の相関を示した（抄録）。", "fun": "人は「自分で決めたい」「できると感じたい」「つながりたい」という心の栄養を、自分から取りに行くこともできます。その「取りに行く力」を、言葉や国が違っても同じ物差しで測れるかを確かめた点が、この研究の地道だが大事な仕事です。", "unverified": "なし"}}, {"id": "jr30", "rank": 30, "headline": "衰退する都心のTOD準備度を測る枠組み（ダッカ）", "title": "Measuring Transit-Oriented Development Readiness in a Declining Central Business District: A Methodological Framework for the Global South", "url": "https://doi.org/10.25034/ijcua.2026.v10n2-3", "authors": "Nawshin Ahmed ほか", "venue": "Journal of Contemporary Urban Affairs", "date": "2026-10-03", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "ダッカ最古の中心業務地区モティジールで、都市鉄道（MRT6号線）開業後の公共交通指向型開発（TOD）の準備度を、加重指標で初めて体系的に評価した（抄録）。", "p3": "「5D」の枠組みと加重TOD準備度指数による混合研究法で、適応的TOD、18時間都市論、包摂的都市論を統合した枠組みで解釈した（抄録）。", "p5": "密度は5点満点の5（32,729人/km²）だが、デザインは2.6で安全性1.47、治安1.39と低く、土地利用の多様性は3.4だった。MRTの到達性は必要の20%にとどまり、低所得の通勤者のMRT利用は10%で中所得層の30%より低かった（抄録）。", "fun": "人がぎっしり住んで働いている場所なのに、歩いて安全でなく、用途も偏っている「密度は高いが多様性は低い」状態が、駅をつくっても人が使わない理由になっている、という指摘です。駅はつくるだけでなく街と一緒に育てる必要があることを示しています。", "unverified": "指標の重み付けの根拠は抄録になく未確認。"}}, {"id": "jr31", "rank": 31, "headline": "都市緑地が鳥の音声の「避難所」になる", "title": "Passive acoustic monitoring reveals how urban vegetation supports acoustic refuges for avian communication in a subtropical megacity", "url": "https://doi.org/10.1111/1365-2664.70598", "authors": "Yuhao Chen ほか", "venue": "Journal of Applied Ecology", "date": "2026-10-03", "sjr": 1.765, "citescore": 8.8, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "中国・深圳の21の都市公園で、オナガサイホウチョウの鳴き方が騒音と植生構造に応じてどう変わるかを、同期した受動音響観測で示した（抄録）。", "p3": "受動音響観測網と深層学習による音景の分解、地上レーザースキャンによる3次元の生息地の定量化を組み合わせ、ベイズ線形混合モデルと一般化加法モデルで分析した（抄録）。", "p5": "連続的な交通騒音の下では鳴き声の帯域が広がり、断続的な人為的騒音では発声量が減った。下層植生の密度などの生息地構造が、これらの反応の非線形な変化と関連した（抄録）。", "fun": "都会の鳥は、車の騒音に負けないように鳴き方を変えます。ところが騒音の種類によって工夫の仕方が違い、茂みが濃い場所は「声の避難所」になっている、という発見は、街の緑が音の環境まで変えていることを教えてくれます。", "unverified": "閾値などの具体的な数値は抄録の範囲で未確認。"}}, {"id": "jr32", "rank": 32, "headline": "道路内外の移動に使える全球高解像度の摩擦面データ", "title": "A Global high-Resolution Friction Surface Dataset", "url": "https://doi.org/10.1038/s41597-026-08376-9", "authors": "Walker Kosmidou-Bradley ほか", "venue": "Scientific Data", "date": "2026-10-03", "sjr": 1.907, "citescore": 9.6, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "道路上と道路外の移動の両方に使える、全球30 m解像度の移動コスト（摩擦面）データGRUFSを公開した（抄録）。", "p3": "OpenStreetMapの交通・水域、GLAD土地被覆、FABDEMとCopernicus GLO-30の標高、国境データなどの公開データから、徒歩用（Foot）と、道路は車・道路外は徒歩の混合用（Mixed）の2種類のラスタを作った（抄録）。", "p5": "移動コストを1 mあたりの分で表す整数ラスタと参照表、入力データ、作成コード、検証資料を配布し、年ごとの版の更新を想定している（抄録）。精度検証の数値は抄録になし。", "fun": "「病院まで何分で行けるか」を世界中で計算するには、道があるか、坂か、川かといった「歩きにくさの地図」が要ります。それを公開データだけで30 m刻みで作った、という地味だが土台になる仕事で、データの乏しい地域ほど役立ちます。", "unverified": "検証の結果（推定所要時間の誤差など）は抄録になく未確認。"}}, {"id": "jr33", "rank": 33, "headline": "集合住宅暮らしと公共交通利用（メルボルン）", "title": "How does apartment living shape public transport travel? Insights from interviews with apartment residents in Melbourne, Australia", "url": "https://doi.org/10.1016/j.trip.2026.102290", "authors": "Mehdi Alidadi ほか", "venue": "Transportation Research Interdisciplinary Perspectives", "date": "2026-10-03", "sjr": 1.039, "citescore": 6.6, "citescore_year": "2025", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "出版社サイト・登録情報とも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、豪メルボルンの集合住宅の住民への面接を通じて、集合住宅での暮らしが公共交通の利用をどう形づくるかを調べた研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "駅の近くにマンションを建てれば、住民は電車を使うはず、と考えがちです。でも実際の暮らしの中で人が交通手段をどう選んでいるのかは、住んでいる人に聞いてみないと分かりません。その「当たり前」を確かめる問いです。", "unverified": "手法・検証データ・結果のすべて。"}}, {"id": "jr34", "rank": 34, "headline": "ガス突出に伴う曲面状破壊の数値シミュレーション", "title": "Numerical simulation of curviplanar fractures associated with gas outbursts", "url": "https://doi.org/10.1007/s40789-026-00930-5", "authors": "Jingyu Shi ほか", "venue": "International Journal of Coal Science and Technology", "date": "2026-10-03", "sjr": 1.791, "citescore": 15.3, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "炭鉱のガス突出の空洞周辺に見られる曲面状の密な割れ目の成因を、変位不連続法による2次元の破壊シミュレーションで調べた（抄録）。", "p3": "変位不連続法に基づく陽解法の破壊解析コードFRACODで、炭層・天盤・底盤からなる2次元モデルの掘進面周辺の亀裂の発生と進展を計算した（抄録）。", "p5": "柔らかい介在物の有無にかかわらず、現地や室内実験と似た切羽前方の亀裂進展のパターンが再現された。介在物があると、開口とすべりの亀裂が多く生じ、ガスの急速な脱着と圧力上昇を促す条件となった（抄録）。", "fun": "炭鉱で石炭とガスが突然噴き出す事故の前には、壁に独特の曲がった割れ目が並ぶことがあります。その割れ目がどう生まれるかを計算で再現し、柔らかい層があるとガスが抜けやすい割れ目が増える、という危険の芽を見つけた点が重要です。", "unverified": "なし"}}, {"id": "jr35", "rank": 35, "headline": "異方性勾配損傷モデルで多結晶のへき開亀裂を再現", "title": "Anisotropic gradient damage modelling of cleavage crack propagation in metallic polycrystals", "url": "https://doi.org/10.1177/10567895261492140", "authors": "Augustin Perrier-Michon ほか", "venue": "International Journal of Damage Mechanics", "date": "2026-10-01", "citescore": 8.5, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "金属多結晶のへき開亀裂の進展を表すため、勾配損傷モデルの特性長をスカラーからテンソル場に拡張した異方性モデルを開発した（抄録）。", "p3": "結晶方位ごとに変わる2階テンソルの特性長で単結晶の破壊抵抗の異方性を表し、不可逆過程の熱力学（FrémondとNedjarの方法）の枠組みと異方性の体積・偏差剛性分解で多軸応力下の損傷を扱った（抄録）。", "p5": "テンソル場を調整することで、特定の方向の損傷を抑え別の方向で促し、優先的な結晶面に沿うへき開破壊を自然に再現できた。多結晶集合体での亀裂進展シミュレーションで評価した（抄録）。", "fun": "金属の結晶には「割れやすい向き」があり、薪が木目に沿って割れるのに似ています。その向きの情報を、損傷が広がる「範囲の形」として数式に組み込んだことで、亀裂が結晶ごとに曲がる様子を自然に再現できた点が工夫です。", "unverified": "実験との定量比較は抄録になく未確認。"}}, {"id": "jr36", "rank": 36, "headline": "プラトン立体粒子の充填で普遍性と形状効果を分離", "title": "Disentangling universality from shape in Platonic granular packings", "url": "https://doi.org/10.1038/s42005-026-02894-z", "authors": "Jie Gui ほか", "venue": "Communications Physics", "date": "2026-10-03", "sjr": 1.641, "citescore": 9.0, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "出版社サイト・登録情報とも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、正多面体（プラトン立体）の形をした粒子の充填で、形状に依存しない普遍的な性質と形状効果を切り分ける研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "箱にサイコロやピラミッド形の粒を詰めると、形によって詰まり方が変わります。でも形が違っても共通する法則があるのか、という問いは、砂や粉の振る舞いを理解するうえでの根本的な疑問で、正多面体という分かりやすい形で答えを探す点が面白いところです。", "unverified": "手法・検証データ・結果のすべて。"}}, {"id": "jr37", "rank": 37, "headline": "弾性脆性格子の破壊靱性", "title": "On the fracture toughness of elastic-brittle lattices", "url": "https://doi.org/10.1016/j.engfracmech.2026.112676", "authors": "Melle Gruppelaar ほか", "venue": "Engineering Fracture Mechanics", "date": "2026-10-03", "sjr": 1.252, "citescore": 8.8, "citescore_year": "2025", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず、同じ研究のSSRN版の抄録（Crossrefの題名検索）を使用", "preprint": false, "short": true, "p1": "弾性脆性の格子材料（六角形・三角形・カゴメ）の破壊靱性を、境界層の定式化と規格の有限寸法試験体で比べ、両者が大きく食い違うことを示し補正項を提案した（抄録）。", "p3": "境界層の定式化と規格試験体の両方でモードIの見かけの破壊靱性を求め、非特異なT応力と試験体寸法の影響、亀裂先端のひずみ場を、数値的に導いた変位場の枠組みで調べた（抄録）。", "p5": "試験体が格子の特性長より十分大きければT応力と寸法の影響は二次的だったが、連続体向けの標準的な破壊力学の手順は格子の亀裂先端場を一貫して再現できなかった。補正項を導入してK_Icの評価の一貫性を高めた（抄録）。", "fun": "蜂の巣のような格子でできた軽い材料は、普通の金属と同じ方法で「割れにくさ」を測ると、測り方によって答えが変わってしまいます。材料の中身が「すき間だらけ」だと、教科書の物差しが合わない、という指摘が面白い点です。", "unverified": "SSRN版と出版版の内容の異同は未確認。補正後の改善の数値は抄録になし。"}}, {"id": "jr38", "rank": 38, "headline": "宿泊者の出身と時期で異なるホテル口コミの話題", "title": "Guest-origin and temporal heterogeneity in online hotel reviews: A structural topic modeling analysis", "url": "https://doi.org/10.1016/j.jretconser.2026.105144", "authors": "Thai-Ha Luong ほか", "venue": "Journal of Retailing and Consumer Services", "date": "2026-10-03", "sjr": 3.913, "citescore": 24.8, "citescore_year": "2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "出版社サイト・登録情報とも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、ホテルのオンライン口コミの話題が宿泊者の出身地と時期によってどう異なるかを、構造的トピックモデルで分析した研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "同じホテルでも、どこから来た客か、いつ泊まったかで、口コミに書くことは違うはずです。大量の口コミから「話題」を自動で取り出し、それが客の属性や時期でどう変わるかを見る、という問いは、口コミの読み方を一段深くします。", "unverified": "手法・検証データ・結果のすべて。"}}, {"id": "jr39", "rank": 39, "headline": "CSR開示の幅と利益調整は機会主義的に連動", "title": "CSR Disclosure Breadth and Earnings Management: Evidence Consistent with Opportunistic Reporting in an Emerging Market", "url": "https://doi.org/10.3390/jrfm19100752", "authors": "Mohsen Imeni ほか", "venue": "Journal of risk and financial management", "date": "2026-10-01", "citescore": 5.5, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "テヘラン証券取引所の製造業136社（2017〜2024年、1,088企業年）で、利益調整とCSR開示の幅が同時に正に関連することを示した（抄録）。", "p3": "CSR開示を33項目の2値の内容分析指数で測り、Kothari型の業績調整済み異常発生高、修正Dechow–Dichev型の残差、実体的利益調整との関連を、ベータ回帰と企業・年固定効果のOLSで分析した（抄録）。", "p5": "Kothari型の異常発生高は開示の幅と正に関連した（β = 0.198、p = 0.031）。Dechow–Dichev型（β = 0.285、p = 0.060）と実体的利益調整（β = 0.254、p = 0.071）は限界的だった。固定効果OLSでも異常発生高は有意だった（抄録）。", "fun": "社会貢献の情報をたくさん開示する会社ほど、利益の数字をいじっている傾向がある、という一見矛盾した関係です。著者は因果ではなく関連だと慎重に述べつつ、立派な開示が数字の操作を隠す「目くらまし」になる可能性を示しています。", "unverified": "なし"}}, {"id": "jr40", "rank": 40, "headline": "受益原則でアパレル価値連鎖のCO2責任を配分", "title": "Benefit-principle accounting of CO₂ emissions in the global textile and clothing value chain", "url": "https://doi.org/10.1016/j.ecolecon.2026.109265", "authors": "Lila Ballav Bhusal", "venue": "Ecological Economics", "date": "2026-10-02", "sjr": 1.906, "citescore": 12.4, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "繊維・衣料の世界価値連鎖で、CO2排出の責任を生産者や消費者でなく、付加価値を得る要素提供者に配る受益原則の排出会計を、貿易形態別に分解した（抄録）。", "p3": "多地域産業連関表で、生産者・要素提供者・最終生産者・消費者を区別し、最終財・中間財・グローバル価値連鎖（GVC）の貿易を分けて受益原則排出（BPE）を計算した（抄録）。", "p5": "消費国が自国のBPEの最大の割合を保持した。先進国の要素提供者は消費ベース排出を上回るBPEを受け、生産に関わる途上国は下回った。世界第2の衣料輸出国バングラデシュはEU27の消費者のBPEの0.13%にとどまった（抄録）。", "fun": "服の排出を「作った国」の責任にするか「着る国」の責任にするかで議論が分かれます。この研究は第3の見方として「そのおかげで儲けた国」に配る方法を取り、縫製を担う国が実は得をしていない構図を数字で示しています。", "unverified": "対象年は抄録になく未確認。"}}, {"id": "jr41", "rank": 41, "headline": "SHAPの特徴量重要度は不安定で外部検証が必要", "title": "Beyond SHAP: Exposing the Instability of Supervised Feature Importance and the Necessity of External Validation in Soil Microbiome Research", "url": "https://doi.org/10.1016/j.soilbio.2026.110322", "authors": "Yoshiyasu Takefuji", "venue": "Soil Biology and Biochemistry", "date": "2026-10-03", "sjr": 4.24, "citescore": 21.1, "citescore_year": "2025", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "出版社サイト・登録情報とも抄録を取得できず、題名のみ", "preprint": false, "short": true, "p1": "題名から、土壌微生物研究で教師あり学習の特徴量重要度（SHAPなど）が不安定であることを示し、外部検証の必要性を訴える研究と読み取れる。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "AIが「この要因が一番重要」と教えてくれても、データを少し入れ替えると順位ががらりと変わることがあります。説明を鵜呑みにせず、別のデータで確かめよう、という問いかけは、AIの説明を使うあらゆる分野に通じます。", "unverified": "手法・検証データ・結果のすべて。"}}, {"id": "jr42", "rank": 42, "headline": "政治的つながりと利益調整をクラスタ分析で区分", "title": "Segmenting Political Connection and Earnings Management: A Clustering and Regression Approach in IDX Firms", "url": "https://doi.org/10.61401/relevansi.v10i5.675", "authors": "Ismi Roudotul Janah ほか", "venue": "Jurnal Relevansi Ekonomi Manajemen dan Bisnis", "date": "2026-10-02", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "インドネシア証券取引所の非金融140社（2024年度）を、政治的つながりと利益調整でクラスタに分け、その分類の一貫性を回帰で検証した（抄録）。", "p3": "政治的つながり5指標と、裁量的発生高・実体的利益調整2指標（852 強が苦手な生徒にとって、英語の長文はそれだけで気が重いものです。絵や音声も使ってAIが一緒に読んでくれると、「楽しい」と感じて前向きに取り組めるようになる、という結果は、学びの入口として感情の大切さを示しています。", "unverified": "割り付けが無作為かどうかと、読解力そのものへの効果は抄録の範囲で未確認。"}}, {"id": "jn17", "rank": 17, "field": "環境・気候政策", "headline": "表土の急速干ばつで砂塵が増える", "title": "Dust Loading Increases During Topsoil Flash Droughts Under Rapid Surface Drying and Vegetation Stress", "url": "https://doi.org/10.1029/2026gl124553", "authors": "Xuesong Wang ほか", "venue": "Geophysical Research Letters", "date": "2026-10-03", "sjr": 1.949, "citescore": 8.1, "citescore_year": "2025", "why": "衛星の砂塵光学的厚さと全球の表土急速干ばつ台帳を結び、急速な乾燥と植生ストレスが砂塵を増やすことを示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "2003〜2022年の全球データで、表土が急に乾く「急速干ばつ」の際に大気中の砂塵が増えることを示した（抄録）。", "p3": "衛星由来の砂塵光学的厚さ、再解析の気象データ、全球の表土急速干ばつ台帳を組み合わせ、SHAPで砂塵の変動に関わる要因を調べた（抄録）。", "p5": "急速干ばつの間、陸の画素の44.7%で砂塵が正の偏差を示した。砂塵の変動は風速より土壌水分、背景の乾燥度、植生の状態と強く関連した。著者は観測による分析で因果は確立しないと明記している（抄録）。", "fun": "砂ぼこりは強い風で舞い上がる、と思いがちですが、この研究では風よりも「土が急に乾いて草がしおれたか」の方が効いていました。干ばつが急に来ると地面が裸になって舞いやすくなる、という見えにくいつながりが面白い点です。", "unverified": "なし"}}, {"id": "jn18", "rank": 18, "field": "環境・気候政策", "headline": "糖尿病足潰瘍の免荷治療経路の環境負荷をLCAで比較", "title": "Environmental sustainability of offloading care pathways for people with a diabetes-related foot ulcer: a life-cycle assessment", "url": "https://doi.org/10.1007/s00125-026-06891-3", "authors": "Jaap J. van Netten ほか", "venue": "Diabetologia", "date": "2026-10-03", "sjr": 3.858, "citescore": 18.2, "citescore_year": "2025", "why": "糖尿病医療の環境影響について、治療経路ごとのライフサイクル評価を行った。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "糖尿病足潰瘍の免荷（足底の負担を減らす）治療の3つの経路について、環境負荷をライフサイクル評価で初めて比較した（抄録）。", "p3": "ISO規格に沿ったプロセスベースのLCAで、全接触ギプス、取り外せない歩行装具、取り外せる歩行装具の経路を、材料・廃棄物・輸送・エネルギーから評価し、100万人のモンテカルロ・シミュレーションを行った（抄録）。", "p5": "18の中間指標と5つの終点指標のすべてで、取り外せる歩行装具が最も負荷が低く、全接触ギプスが最も高かった。地球温暖化は全接触ギプス141 kg CO2換算、取り外せない装具108、取り外せる装具90だった（抄録）。", "fun": "病気の治療にも、材料や通院の移動で二酸化炭素が出ています。同じ効果が期待できる治療法なら、環境にやさしい方を選ぶという考え方は、医療と環境問題を結びつける新しい視点です。", "unverified": "なし"}}, {"id": "jn19", "rank": 19, "field": "経営学", "headline": "衛星・地理空間データでESG報告を証拠に基づくものに", "title": "Toward Evidence‐Based ESG Reporting: The Added Value of Geospatial and Satellite Data", "url": "https://doi.org/10.1002/sd.71734", "authors": "Agnieszka Karman ほか", "venue": "Sustainable Development", "date": "2026-10-03", "sjr": 1.799, "citescore": 13.6, "citescore_year": "2025", "why": "自己申告に頼るESG報告の限界に対し、地理空間・衛星データの付加価値を検討した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "ESG報告に衛星・地理空間データを使う研究を、計量書誌分析で体系的に整理し、その付加価値と課題を示した（抄録）。", "p3": "Scopus収録文献の体系的な計量書誌分析に、テーマの地図化とクラスタの特定を組み合わせた（抄録）。", "p5": "地理空間データは環境パフォーマンスの測定を高め、資産単位の監視とリスク評価を可能にして情報の非対称性を減らす一方、網羅性の欠如、方法の不統一、ガバナンスの問題で普及が制約されていた（抄録）。", "fun": "企業の「環境に配慮しています」という報告は、自己申告では本当か分かりません。宇宙から工場や森林を見る衛星データを使えば、外から確かめられる、というアイデアは、会計の世界に「監視カメラ」を持ち込むような発想です。", "unverified": "対象文献数は抄録になく未確認。"}}, {"id": "jn20", "rank": 20, "field": "経営学", "headline": "適応的レジリエンスと環境持続性の組み合わせと物流企業の業績", "title": "Co-alignment of adaptive resilience and environmental sustainability for firm performance: a configurational perspective in the transportation logistics context", "url": "https://doi.org/10.1108/ijpdlm-10-2025-0513", "authors": "Henry Ataburo ほか", "venue": "International Journal of Physical Distribution and Logistics Management", "date": "2026-10-03", "sjr": 2.015, "citescore": 15.1, "citescore_year": "2025", "why": "構成的アプローチで、レジリエンスと持続可能性が補完か代替かを検討した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "ガーナの運輸物流企業199社で、適応的レジリエンスと環境持続性の組み合わせ（構成）が企業業績とどう関係するかを調べた（抄録）。", "p3": "構成理論に基づき、調査データをクラスタ分析と分散分析で分析し、構成ごとの業績を比べた（抄録）。", "p5": "4つの構成が見つかった。持続可能性寄りの群は中程度の群より市場業績が高く、両方が高い補完型の群は中程度の群より財務・市場業績の両方が高かった。他の構成間には有意差がなく、等結果性（異なる組み合わせで同等の成果）を示唆した（抄録）。", "fun": "危機に強い会社と環境にやさしい会社は、両立するのか、どちらかを選ぶものなのか。答えは「組み合わせ方はいろいろあって、どれでも同じくらい成功し得る」というもので、正解が一つではないことを示しているのが面白い点です。", "unverified": "なし"}}, {"id": "jn21", "rank": 21, "field": "経営学", "headline": "デジタル変革は資金制約下でもグリーン革新を介しESGを高める", "title": "Digital Transformation and Environmental Pillar of ESG ‐Based Performance Under Financing Constraints: The Mediating Role of Green Innovation in Chinese Listed Firms", "url": "https://doi.org/10.1002/csr.71041", "authors": "Jiayang Cheng ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-03", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "why": "中国上場企業のデータで、デジタル変革・資金制約・グリーン革新・環境ESGの関係を検証した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "中国A株上場4,456社（2020〜2024年）で、デジタル変革がグリーン革新を介して環境面のESG成績を高めることを示した（抄録）。", "p3": "動的能力論と資源ベース論に基づき、二方向固定効果の回帰を主に用い、GMMと操作変数の2段階最小二乗法などで内生性と頑健性を確かめた（抄録）。", "p5": "デジタル変革は環境ESG成績を高め、グリーン革新がこれを媒介した。資金制約がこの関係を調整するという統計的に有意な証拠は得られなかった（抄録）。", "fun": "会社のデジタル化が、なぜ環境への取り組みにまで効くのか。その間に「環境にやさしい新技術を生み出す力」が入っている、という道筋を示した研究です。お金が足りない会社でも効果が変わらなかった点は意外かもしれません。", "unverified": "効果量の具体値は抄録になく未確認。"}}, {"id": "jn22", "rank": 22, "field": "経営学", "headline": "東南アジア家族企業の持続可能性課題への対応", "title": "How Southeast Asian Family Businesses Confront Sustainability Grand Challenges Under Internationalisation Pressure", "url": "https://doi.org/10.1002/sd.71756", "authors": "Thinh Gia Hoang ほか", "venue": "Sustainable Development", "date": "2026-10-03", "sjr": 1.799, "citescore": 13.6, "citescore_year": "2025", "why": "家族ネットワークが持続可能性の大きな課題に応答する過程を、過程レベルで明らかにしようとした。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "東南アジアの華人系の家族企業ネットワークが、国際化の圧力の下で持続可能性の大きな課題にどう応じるかを、ネットワーク資本の動員の過程から明らかにした（抄録）。", "p3": "埋め込み理論に基づく質的な複数事例研究で、会館を拠点とする家族企業ネットワークへの長期の面接、現地訪問、文書資料を分析した（抄録）。", "p5": "社会・ネットワーク・地域への埋め込みがそろうと、ネットワーク資本は生計・法令順守・事業継続・市場での正統性を安定させる協調を可能にした。そろわないと過剰な埋め込みとなり、選択的な保護、閉鎖、経路依存を強めた（抄録）。", "fun": "親戚や同郷のつながりは、困ったときに助け合える強みになる一方、仲間内だけで固まって外から信頼されにくくなる弱みにもなります。同じつながりが条件次第で薬にも毒にもなる、という二面性を描いている点が興味深いところです。", "unverified": "事例の数は抄録になく未確認。"}}, {"id": "jn23", "rank": 23, "field": "経済学", "headline": "ブラジル持続可能性指数とESG統合のリスク調整後成績", "title": "ESG Integration and Risk‐Adjusted Portfolio Performance in an Emerging‐Market Institutional Context: Evidence From Brazil's Corporate Sustainability Index", "url": "https://doi.org/10.1002/csr.71046", "authors": "Flávio Leonel de Carvalho ほか", "venue": "Corporate Social Responsibility and Environmental Management", "date": "2026-10-03", "sjr": 2.147, "citescore": 14.5, "citescore_year": "2025", "why": "新興市場でESG統合の度合いの違いによるポートフォリオ成績の異質性を検討した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "ブラジルの企業持続可能性指数（ISE）の構成企業から作った持続可能なポートフォリオの中で、ESGの度合いと次元によって成績が異なることを示した（抄録）。", "p3": "2022〜2025年の40万の模擬ポートフォリオで、年固定効果の併合OLSを、総合・十分位・次元別のESG指標で推定した（抄録）。", "p5": "ISEの得点が高いほどリターンが高くリスクが低くシャープレシオが高かったが、リスク調整後の利得は中程度の持続可能性で強く、最上位の十分位では弱まった。ビジネスモデルと革新、社会関係資本の次元が最も良好だった（抄録）。", "fun": "「ESGの点数が高い会社ほど投資先として良い」とは限らず、ほどほどの層が一番効率がよい、という結果です。総合点の裏には次元ごとの違いが隠れていて、平均だけを見ると大事な差を見落とす、という統計の教訓にもなっています。", "unverified": "なし"}}, {"id": "jn24", "rank": 24, "field": "機械学習", "headline": "4D-STEMの結晶方位を教師なしで自動推定", "title": "Unsupervised machine learning for automated crystal orientation mapping on noisy 4D-STEM data", "url": "https://doi.org/10.1038/s41524-026-02337-x", "authors": "Kai Kamijo ほか", "venue": "npj Computational Materials", "date": "2026-10-03", "sjr": 2.943, "citescore": 17.4, "citescore_year": "2025", "why": "大量の回折パターンから教師なし学習で結晶方位を推定する手法を示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "ノイズの多い4D-STEM（4次元走査透過電子顕微鏡）のデータから、自己教師ありのノイズ除去と教師なし解析で結晶方位を自動でマッピングする手法を示した（抄録）。", "p3": "きれいな訓練画像を必要としない自己教師ありのノイズ除去を、近傍のプローブ位置の回折パターンを使って4D-STEMに拡張し、結晶の面内回転に不変な教師なし解析で結晶成分を識別した（抄録）。", "p5": "合成データでさまざまなノイズの水準で頑健性を定量的に示し、実験データにも適用した（抄録）。具体的な精度の数値は抄録の範囲になし。", "fun": "電子線に弱い高分子は、弱い電子線でしか観察できず、画像はノイズだらけになります。お手本の「きれいな画像」がなくても、隣り合う場所の画像どうしを手がかりにノイズを消す、という工夫で、見えなかった結晶の並びを浮かび上がらせています。", "unverified": "精度の定量値は抄録の範囲で未確認。"}}, {"id": "jn25", "rank": 25, "field": "機械学習", "headline": "運動学を考慮したAIS前処理と双方向RNNで船舶軌跡を予測", "title": "Kinematic-aware AIS preprocessing and bidirectional recurrent modeling for multi-output vessel trajectory prediction", "url": "https://doi.org/10.1186/s40537-026-01562-x", "authors": "Marilena Sinni ほか", "venue": "Journal of Big Data", "date": "2026-10-03", "sjr": 1.964, "citescore": 18.6, "citescore_year": "2025", "why": "AISデータの前処理と双方向再帰モデルで、船舶の多出力軌跡予測を改善した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "船舶自動識別装置（AIS）データの運動学を考慮した前処理と双方向GRUで、船の位置・対地速度・針路を同時に予測する2段階の枠組みを示した（抄録）。", "p3": "データ清掃、軌跡抽出、運動学に基づく異常補正、時間の再標本化を行い、双方向GRUで位置・速度・針路を予測した。針路には円周変数用のコサイン距離を使い、LSTMやGRU、注意機構付きの変種と比べ、前処理の各段階のアブレーションを行った（抄録）。", "p5": "前処理の各段階が予測精度に測定可能な寄与をすることを確認した（抄録）。モデル間比較の具体的な数値は抄録の範囲になし。", "fun": "針路は359度と1度がほとんど同じ向きなのに、数字の差は358もあります。こうした「ぐるっと回る」量をそのまま普通の数として扱うとAIは混乱します。円の上の距離で誤差を測る、という細やかな工夫がポイントです。", "unverified": "予測誤差の数値は抄録の範囲で未確認。"}}, {"id": "jn26", "rank": 26, "field": "機械学習", "headline": "等式制約付きニューラルネットで環境プロセスをモデル化", "title": "Equality-Constrained Neural Networks for Environmental Process Modeling: Application to Ozone Inactivation of Cryptosporidium", "url": "https://doi.org/10.1021/acsestengg.6c00705", "authors": "Charles N. Haas", "venue": "ACS ES and T Engineering", "date": "2026-10-03", "sjr": 1.572, "citescore": 11.0, "citescore_year": "2025", "why": "物質収支などの等式制約をニューラルネットに組み込み、未知の速度式を学習する方法を示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "環境工学の過程モデルで、物質収支などの厳密な制約の下でニューラルネットに未知の速度式を学ばせる枠組みを示し、オゾンによるクリプトスポリジウムの不活化に適用した（抄録）。", "p3": "制約付きの変数を消去する縮約空間法と、対数変換した全空間の同時最適化を比べ、後者を採用した。複数のネットワーク構造にまたがる入れ子のウォームスタートも開発し、16事業体の水を使った225観測のデータで評価した（抄録）。", "p5": "大きな構造ほど標本内の当てはまりは良くなったが、1事業体を除く交差検証では他事業体への移転性が低いことが明らかになった（抄録）。", "fun": "物理の法則（物質収支）を守らせたうえでAIに分からない部分だけを学ばせると、もっともらしい予測ができます。でも、ある浄水場のデータで鍛えたモデルが別の浄水場ではうまくいかない、という「よそでは通用しない」問題を正直に示している点が大事です。", "unverified": "なし"}}, {"id": "jn27", "rank": 27, "field": "機械学習", "headline": "LLMで強化したGNNでクリック率を予測", "title": "GraphLLM4CTR: Large Language Model-Enhanced Graph Neural Networks for Click-through Rate Prediction in Recommender Systems", "url": "https://doi.org/10.1145/3848507", "authors": "Shan Gao ほか", "venue": "ACM Transactions on Knowledge Discovery from Data", "date": "2026-10-03", "sjr": 1.317, "citescore": 9.8, "citescore_year": "2025", "why": "LLM由来の意味情報とグラフニューラルネットを組み合わせ、推薦のクリック率予測を改善した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "推薦システムのクリック率予測で、LLMがグラフニューラルネットのメッセージ伝播を層ごとに調整する統合モデルGraphLLM4CTRを提案した（抄録）。", "p3": "多視点の対照的整合でグラフとプロンプトの埋め込みを揃え、LLMベースのメッセージ調整器と学習可能なアダプタで意味を注入したグラフ表現学習を行い、ゲート付きの混合専門家機構を加えた（抄録）。", "p5": "抄録の範囲では性能の具体的な数値は示されていない（抄録）。", "fun": "「この人はこの商品を押しそうか」を当てるには、人と商品のつながりの網（グラフ）と、商品の説明文の意味の両方が役立ちます。これまで別々に扱っていた2つを、層ごとに混ぜ合わせて一緒に学ばせるのが工夫です。", "unverified": "性能の比較結果は抄録の範囲で未確認。"}}, {"id": "jn28", "rank": 28, "field": "機械学習", "headline": "論理文脈と利用知識でリポジトリ対応のコード生成を改善", "title": "LLM See, LLM Do: Enhancing Repository-Aware Code Generation in LLMs Through Logical Context and Usage Knowledge", "url": "https://doi.org/10.1145/3849809", "authors": "Tanghaoran Zhang ほか", "venue": "ACM Transactions on Software Engineering and Methodology", "date": "2026-10-03", "sjr": 1.59, "citescore": 11.6, "citescore_year": "2025", "why": "実リポジトリのコード生成で、論理的文脈と利用例の知識をLLMに与える手法を提案した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "リポジトリ内の依存関係から呼び出し先関数の使用例を探してLLMに与える検索拡張法LogiCoderで、リポジトリ全体を踏まえたコード生成を改善した（抄録）。", "p3": "依存グラフで候補の呼び出し先関数を特定し、呼び出し関係をたどってリポジトリ全体から使用例を集め、意味検索の結果と再順位付けで統合してプロンプトに入れる。5つのLLMにDevEvalベンチマークで適用した（抄録）。", "p5": "難しい課題で改善を示したとするが、具体的な数値は抄録の範囲で途切れており確認できない（抄録）。", "fun": "プログラムを書くとき、人間は「この関数はほかの場所でどう使われているか」を見て書き方をまねます。AIにも同じように、使い方の実例を探して見せてあげる、という発想が、タイトルの「見てまねる」によく表れています。", "unverified": "改善幅の数値は抄録の範囲で未確認。"}}, {"id": "jn29", "rank": 29, "field": "統計学", "headline": "臨床予測モデルのシャープレイ値説明の手引き", "title": "Shapley value explanations for clinical prediction models: a scoping review and guide", "url": "https://doi.org/10.1038/s41746-026-03324-8", "authors": "Alex Carriero ほか", "venue": "npj Digital Medicine", "date": "2026-10-03", "sjr": 4.215, "citescore": 18.2, "citescore_year": "2025", "why": "医療の予測モデルでのシャープレイ値の使われ方を整理し、適切な使い方の指針を示した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "臨床予測モデルでのシャープレイ値による説明の使われ方を、無作為に選んだ査読論文100本のスコーピングレビューで調べ、手引きを示した（抄録）。", "p3": "表形式の特徴量で個人の健康結果を予測するモデルの説明に焦点を当て、計算方法、参照母集団、使用の動機、解釈を調べた（抄録）。", "p5": "91%の論文が計算に使ったアルゴリズムを、97%が参照（基準）母集団の出典や大きさを開示していなかった。使用の動機は重要特徴の特定、臨床意思決定支援、信頼性、探索的分析の4つが主だった（抄録）。", "fun": "AIの判断理由を「各要因の貢献度」として示すシャープレイ値は、実は「何と比べた貢献か」という基準の選び方で答えが変わります。ところがその基準を書いていない論文がほとんどだった、という発見は、説明の説明が足りないという皮肉な状況を示しています。", "unverified": "なし"}}, {"id": "jn30", "rank": 30, "field": "統計学", "headline": "自閉スペクトラムとホームレス状態のベイズ解析", "title": "Autism and Homelessness: Risk and Protective Factors in a Bayesian Analysis of Autistic Characteristics", "url": "https://doi.org/10.1177/13623613261486061", "authors": "Elizabeth Jane Osborn ほか", "venue": "Autism", "date": "2026-10-03", "sjr": 1.935, "citescore": 9.7, "citescore_year": "2025", "why": "自閉的特性とホームレス状態の関連のリスク・保護要因をベイズ解析で検討した。", "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用（本文は入手できず）", "preprint": false, "short": true, "p1": "オーストラリアの成人333人で、自閉的特性とホームレス状態の関連を、診断の有無や社会的条件を考慮したベイズ階層ロジスティック回帰で調べた（抄録）。", "p3": "自閉スペクトラム指数（AQ-50）、ホームレスの危険因子、適応機能、社会的支援を測り、ベイズ階層モデルと媒介分析で関連を推定した（抄録）。", "p5": "正式な診断のない人ではAQ-50が高いほどホームレスの確率が高い傾向があったが、診断のある人では弱まった。構造的な危険因子は確からしくホームレス確率の上昇と関連した（抄録）。", "fun": "自閉的な特性を持つのに診断を受けていない人ほど、住まいを失う危険が高い傾向がある、という結果は、診断が支援への入口になっている可能性を示します。不確かさを確率で正直に示すベイズ統計の使い方も学べる研究です。", "unverified": "なし"}}, {"i     updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // request for a longer explanation, written to be pasted into an AI chat app on a phone (Claude, ChatGPT, Gemini):
  // self-contained, with no skills, local files or PC tools; it follows the owner's paper-review rules
  var REQUEST = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "- 詳しさ：{depth}",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。「要点だけ」のときは (1) と主要な数点に絞る。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  function requestText(it, depth) {
    return REQUEST.replace("{paper}", it.title + "（" + it.url + "）").replace("{depth}", depth);
  }
  // phones and tablets have a share menu listing the installed AI apps; elsewhere the request is copied
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  function askAI(it, depth, status) {
    status.textContent = "";
    navigator.share({ text: requestText(it, depth) }).then(function () {
      if (!sheet.hidden) closeSheet();
    }, function (e) {
      if (e && e.name === "AbortError") return;  // the share menu was closed
      if (sheet.hidden) openSheet(it);
      copyRequest(depth);
    });
  }
  var sheet = document.getElementById("sheet"), sheetItem = null;
  var sheetText = document.getElementById("sheet-text"), sheetStatus = document.getElementById("sheet-status");
  [].forEach.call(document.querySelectorAll("#sheet .share"), function (b) { b.hidden = !CAN_SHARE; });
  document.getElementById("copy-full").className = CAN_SHARE ? "btn" : "btn primary";
  document.getElementById("sheet-note").textContent = CAN_SHARE
    ? "共有メニューで、Claude・ChatGPT・Gemini など使いたいAIアプリを選ぶと、依頼文が渡ります。渡らないアプリでは、依頼文をコピーしてチャットに貼り付けます。"
    : "依頼文をコピーして、AIのチャットに貼り付けます。";
  function openSheet(it) {
    sheetItem = it;
    document.getElementById("sheet-paper").textContent = it.headline || it.title;
    sheetStatus.textContent = ""; sheetText.hidden = true;
    sheet.hidden = false;
    document.getElementById(CAN_SHARE ? "share-full" : "copy-full").focus();
  }
  function closeSheet() { sheet.hidden = true; sheetItem = null; }
  function copyRequest(depth) {
    if (!sheetItem) return;
    var text = requestText(sheetItem, depth);
    var fallback = function () {
      sheetText.value = text; sheetText.hidden = false; sheetText.focus(); sheetText.select();
      sheetStatus.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        sheetStatus.textContent = "コピーしました（" + depth + "）。AIアプリのチャットに貼り付けてください。";
      }, fallback);
    } else { fallback(); }
  }
  document.getElementById("share-full").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "節ごとに詳しく", sheetStatus); });
  document.getElementById("share-brief").addEventListener("click", function () { if (sheetItem) askAI(sheetItem, "要点だけ", sheetStatus); });
  document.getElementById("copy-brief").addEventListener("click", function () { copyRequest("要点だけ"); });
  document.getElementById("copy-full").addEventListener("click", function () { copyRequest("節ごとに詳しく"); });
  document.getElementById("sheet-close").addEventListener("click", closeSheet);
  sheet.addEventListener("click", function (e) { if (e.target === sheet) closeSheet(); });

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (!sheet.hidden) { if (e.key === "Escape") closeSheet(); return; }
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
