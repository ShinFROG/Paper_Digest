別々に告げると、家計は変化の大きさだけを考えて時期を考えず近視眼的に見えたが、まとめて示すと時期への反応が引き出された（抄録）。まとめた評価の下でLLM家計は予告された政策を予期しつつ近い期間を合理的期待より重く見て、財政乗数を近視眼的な基準と合理的な基準の両方より高くし、この結果は3つのLLMすべてで成り立った。時期を考えるよう求める指示を外すと、過剰反応はおよそ半分になった（抄録）。", "p6": "著者は、主な教訓は方法論的なもので、LLM家計では期待の測り方そのものがモデルの一部になると述べる（抄録）。解釈：結果は提示の仕方と指示に敏感であり、LLM家計が実際の家計の行動を表すかは抄録からは分からない。", "fun": "経済のシミュレーションで、家計の役をAIに演じさせると何が起きるか。この研究では、将来の収入の変化を時期ごとに別々に伝えるか、まとめて伝えるかで、AIの家計のお金の使い方が変わった。期待の聞き方そのものが結果を左右するという、AIを使う研究への大事な注意だ。", "unverified": "本文を読んでいないため、使ったLLMの名前、乗数の値、実験の詳細は未確認。"}}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "LLMが書いた弱操作変数2SLSの許容性論文", "title": "AI in Econometric Theory: An Example", "url": "https://arxiv.org/abs/2610.35831", "authors": "Isaiah Andrews ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Andrews, I., & Mikusheva, A. (2026). AI in Econometric Theory: An Example (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35831", "why": "弱い操作変数のもとでの二段階最小二乗法の許容性という計量経済理論の論文を、著者らのLLMがどう書いたかの記録とあわせて公開し、AIが理論研究に与える意味を論じた。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（冒頭の経緯、序論§1、定理§3–4の要旨、シミュレーション§5、結論§6）を読んだ。付録の証明は読んでいない", "preprint": true, "p1": "弱い操作変数のもとでの2段階最小二乗法（TSLS）が、操作変数が3つ以上なら二乗誤差損失で非許容的（常に上回る推定量がある）であることを示した理論ノートで、証明と本文はGPT-6 AstraとClaude Opus 5.5が書いたと著者が明かした（冒頭の経緯）。未査読のプレプリントである。", "p2": "著者らは2019年から弱い識別のもとでのGMMの非許容性に取り組んできたが、識別の強さなどに有界性の条件が必要で、上回る推定量も具体的に示せず、論文は何度か不採択になった（冒頭の経緯）。TSLSは操作変数が3つ未満だと平均二乗誤差が無限である（§1）。", "p3": "誘導形と第1段の係数に制約のないガウスの極限実験で、異質な処置効果も含めてTSLSの推定対象を目標にし、観測された第1段が0に近いときにTSLSを有界な統計量の方へ寄せると全てのパラメータで危険が下がることを構成的に示し、調整を明示した2つの推定量を与えた（§2–4）。証明はLeanで形式化された（冒頭の経緯）。", "p4": "2014〜2018年のAmerican Economic Reviewの、操作変数が3つ以上の70の推定式に較正した設計で、係数がゼロのときの分散、推定係数での平均二乗誤差、事後平均の平均二乗誤差をTSLSと比べた（§5）。", "p5": "識別の強さに制限を置かずに非許容性が示された（§6）。係数がゼロのとき、操作変数3つの30の推定式では認証済みの推定量が分散を平均75%と73%減らした（最大87%）が、21以上の40の推定式ではほぼゼロで、推定係数での改善は平均0.1%未満、最大3.7%だった（§5、表1）。", "p6": "著者は、較正の元の論文が2つだけで結果は例示にとどまるとし、TSLSを上回りかつそれ自体は上回られない推定量の特徴づけには現在のAIも成功しなかったと述べる（§5、冒頭の経緯）。証明は自ら確認し責任を負うとしたうえで、この能力の進歩が研究成果の評価と資源配分の見直しを迫ると論じる（冒頭の経緯）。", "fun": "計量経済学のベテラン研究者2人が何年も解けなかった証明を、最新のAIが解き、論文の本文まで書いた。2人はその過程を正直に明かし、自分たちで証明を確かめたうえで公開した。結果そのものより、研究の進め方が変わりつつあることを示す記録として面白い。", "unverified": "定理の証明の詳細とLeanによる形式化の範囲は確認していない。"}}, {"id": "pn04", "rank": 4, "field": "統計学", "headline": "生成AIで非構造処置の実験を設計し分析する", "title": "AI-assisted design and analysis of experiments with unstructured treatments", "url": "https://arxiv.org/abs/2610.33818", "authors": "Eli Ben-Michael ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Ben-Michael, E., & Branson, Z. (2026). AI-assisted design and analysis of experiments with unstructured treatments (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33818", "why": "文章や画像など非構造の処置を使う社会科学の実験で、生成AIで処置を抽出して内的妥当性と外的妥当性のトレードオフを明示的に扱い、AI予測で偏りなく精度を上げる推定量を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、計画§3、推論§4の要旨、実証例§5、考察§6）を読んだ。証明の付録は読んでいない", "preprint": true, "p1": "文章や画像のような構造化されていない処置を使うランダム化実験で、解釈できる属性（例：特定の言葉の有無）の効果を推定するため、生成AIや大規模データから処置を抽出する実験計画と、AIの予測を較正して使う推定量を提案した（抄録、§1）。未査読のプレプリントである。", "p2": "こうした実験では、関心の属性の効果が相関する他の属性と交絡して内的妥当性が損なわれ、使った処置を超えて一般化できず外的妥当性も損なわれうる（抄録）。", "p3": "属性を持つ処置と持たない処置の確率分布を、平均の差の推定量の偏りが最小になるよう最適化し、内的妥当性と外的妥当性の比重を研究者が選べるようにした（§3、§6）。割り当てだけを偶然の源とする有限母集団の枠組みで、AIの生成と予測は性能の保証のないブラックボックスとして扱い、保守的な推論と、偏りを加えずに精度を上げる較正済みのAI支援推定量を導いた（抄録、§4）。", "p4": "RedditとGabのコメント21,630件で「罵り言葉の有無」の効果を想定した文章の実験と、米議会の男性議員の肖像819枚で「口ひげの有無」を想定した画像の実験を、半合成のシミュレーション（各設定500回）で評価した。罵り言葉を除いたコメントや口ひげを足し引きした画像はGeminiで作った（§5）。", "p5": "95%信頼区間の被覆率は全設定で名目の水準を超えた（§5.1）。自然な分布に近づけるほど属性の効果に対する偏りが増え、自然な分布そのものでは偏りが2.5倍を超えた（§5.1）。較正しないAI支援推定量は予測が結果と強く負に相関すると精度を40%以上失ったが、較正した推定量は精度を落とさず、予測力が上がると10〜20%改善した（§5.1）。", "p6": "著者は、属性が2値で事前に決まり、1つだけで、判定に誤りがないことを仮定しており、その緩和を今後の課題とする（§6）。AIで作った対照のコメントの約6%は罵り言葉を残し（§5.1）、画像の操作は他の特徴も変えていた（§5.2）。", "fun": "「乱暴な言葉が入ると書き込みはより攻撃的に見えるか」を実験で調べるには、乱暴な言葉の有無以外はそっくりな文章を比べたい。この研究は、AIに言葉だけを書き換えさせたり、大量のデータから似た文章を選んだりして、比べる文章の組を最適に選ぶ方法を作った。差の付け方と現実らしさの釣り合いを、数学で決めるのが面白い。", "unverified": "最適な分布を求める双対問題の詳細と、画像の実験の数値結果は確認していない。"}}, {"id": "pn05", "rank": 5, "field": "因果推論", "headline": "NYCの混雑課金で区域内の交通量が4割減", "title": "Cordon Tolls and Urban Traffic Volumes: Evidence from NYC's 2025 Congestion Relief Zone", "url": "https://arxiv.org/abs/2610.34818", "authors": "Yash Prajapati", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Prajapati, Y. (2026). Cordon Tolls and Urban Traffic Volumes: Evidence from NYC's 2025 Congestion Relief Zone (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34818", "why": "米国初の恒久的なコードン型混雑課金について、区域内と北側の道路区間を比べる差の差法で、課金区域の時間当たり交通量が40〜45%減り、イーストリバーの橋で迂回による増加が生じたと推定した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（背景§3、実証の枠組み§5–6、結果§7、結論§8）を読んだ", "preprint": true, "p1": "2025年1月5日に始まったニューヨーク市の都心部（混雑緩和区域、CRZ）への流入課金が、時間当たりの交通量を短期にどれだけ減らしたかを、差の差の分析で推定した（抄録、§1）。未査読のプレプリントである。", "p2": "ニューヨークは米国で初めて恒久的な区域流入課金を導入した都市で、ピーク時の乗用車は1回9ドル、オフピークは2.25ドルを払う（§3.2）。ストックホルムなどの先行例では約20%の減少が報告されていた（§7.2）。", "p3": "区域内の道路区間を60丁目以北のマンハッタンの区間と比べる二元固定効果の差の差（TWFE-DiD）で推定し、市交通局の自動交通計測器（ATR）の時間別データを識別に、MTAの課金メーターの486万件の10分単位の記録を記述に使った（抄録、§5–6）。", "p4": "事前登録した9つの代替の指定、1年前のプラセボの日付、予告日を境にした予期の検定、ピークとオフピークの差、川を渡る橋への迂回を調べた（§6–7）。", "p5": "最も詳しい指定の係数−0.539は区域内の時間交通量の41.7%の減少（区間当たり毎時約603台）に当たり、符号は9つの指定すべてで負だったが、区間が9つ（処置3つ）しかなく統計的に有意ではなかった（p=0.24）（§7.1–7.2）。効果はピーク時に大きく、橋の交通量は25%有意に増え、迂回と整合した（§7.4）。", "p6": "著者は、1年前のプラセボでも負の係数（−1.03）が出たことを、計測器の入れ替わりが見かけの減少の一部を生んでいる可能性を示す注意点とし、41.7%という大きさは先行例の約2倍で慎重に扱うべきだとする（§7.2–7.3）。解釈：減少の向きは示唆されるが大きさは不確かで、より長い事後のデータが要る。", "fun": "ニューヨークは2025年、車で都心に入るとお金がかかる仕組みを始めた。この研究では都心の道路の交通量が約4割減ったという推定が出たが、測れた道路が少なく、偶然の可能性を否定しきれなかった。一方、課金のない橋に回る車は25%増えていた。結果の確かさまで正直に示しているのが良い。", "unverified": "事前登録した9つの指定それぞれの値と、時間帯別の効果の数値は確認していない。"}}, {"id": "pn06", "rank": 6, "field": "機械学習", "headline": "強化学習にも予測可能なスケーリング則", "title": "An Empirical Study of Reinforcement Learning Scaling Laws", "url": "https://arxiv.org/abs/2610.33420", "authors": "Zeyu Zheng ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Zheng, Z., Lyle, C., Khetarpal, K., & Dabney, W. (2026). An Empirical Study of Reinforcement Learning Scaling Laws (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33420", "why": "2つの手続き生成環境で行為者–批評者法のスケーリング則を見いだし、Eloスコアを指標にすると計算量で2桁大きい学習の性能・最適配分・ハイパーパラメータを予測できることを示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、方法§3、結果§4、結論§5）を読んだ。付録は読んでいない", "preprint": true, "p1": "強化学習（RL）にも、小規模な実験から大規模な学習の性能・最適な資源配分・最適なハイパーパラメータを予測できるスケーリング則があるかを、アクター・クリティック法で実証的に調べた（抄録）。未査読のプレプリントである。", "p2": "スケーリング則は大規模な（自己）教師あり学習の成功を導いてきたが、RLには予測可能な規模拡大の指針がなかった。平均エピソード報酬は滑らかでなく、予測の指標に向かない（抄録、§5）。", "p3": "手続き的に生成される2つの環境StarpilotとCraftaxで、単純なアクター・クリティック法（A2C）について、総計算量に対する最適なバッチサイズと学習率、モデルの大きさとデータ量の配分、性能のべき乗則を当てはめた。性能の指標には、学習済みの各エージェントとランダム方策のリーグで計算する単一エージェント向けのElo評価を使った（§3–4）。", "p4": "1e15〜1e17 FLOPsのデータで当てはめた法則で1e18 FLOPsの結果を予測して比べ、さらに1e19 FLOPsで法則が示す大きさのモデルを学習させた（§4）。", "p5": "予測したハイパーパラメータはほぼ最適で（Starpilotで最適32.3に対し32.02）、最適なモデルの大きさの予測誤差はCraftaxで3%、Starpilotでは31%の過大推定だった（§4.1–4.2）。Eloは平均報酬よりはるかに予測しやすく、1e19 FLOPsで学習したA2CはCraftaxで54.0%の新たな最高性能に達した（§4.3、§5）。Craftaxでは最適なモデルの大きさが単調に増えない局所的な逆スケーリングが見られ、ある報酬源が別の報酬源の学習信号を抑えるRay interferenceと結びつけた（§4.4）。", "p6": "著者は、対象が1つのモデルフリーのアルゴリズム（A2C）に限られ、価値ベースやモデルベースの手法への一般化は未検証であること、Eloは閉じたリーグ内の相対的な指標で課題そのものの意味と直結しないことを限界に挙げる（§5）。", "fun": "AIを強くするには、計算をどれだけ増やせばどこまで伸びるのかを前もって知りたい。この研究は、ゲームの中で試行錯誤して学ぶAI（強化学習）でも、小さな実験の結果から大きな実験の成績を予測できる法則を見つけた。その法則どおりに規模を大きくすると、難しいサバイバル型のゲームCraftaxで54.0%という最高記録を出した。", "unverified": "当てはめた法則の係数と指数（表1）の値は確認していない。"}}, {"id": "pn07", "rank": 7, "field": "ヒューマンコンピュータインタラクション", "headline": "自分の人生の反実仮想で遠い政策リスクが近くなる", "title": "The As-If Machine: Personalized counterfactuals make distant policy risks feel close", "url": "https://arxiv.org/abs/2610.33301", "authors": "Joshua Ashkinaze ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Ashkinaze, J., Zhou, Y., Chen, P., Bhattacharya, A., Park, H., Zhang, Y., Preston, S., Gilbert, E., & Budak, C. (2026). The As-If Machine: Personalized counterfactuals make distant policy risks feel close (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33301", "why": "参加者がAIと共同で「その政策の未来に自分が生きていたら」という物語を書く仕組みを2つの事前登録実験で検証し、リスクを身近に感じる度合いを専門家の文章より高めた。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、システム§2、2つの実験§3–4、仕組み§6、考察§9、方法§10の一部）を読んだ。拡張データの表は一部のみ", "preprint": true, "p1": "経験したことのない政策上のリスクを身近に感じられるよう、参加者自身の人生をその状況が起きた「もしも」の物語として共同執筆する多エージェントのシステムAs-If Machine（AIM）を作り、2つの事前登録実験で効果を検証した（抄録）。未査読のプレプリントである。", "p2": "人生経験は政策への態度を形づくるが、人は一つの人生しか生きられず、経験したことのないリスクに対処する政策を支持しにくい。物語はリスクを身近にできるが、一人ひとりに合わせた物語を大規模に作るのは難しかった（抄録）。", "p3": "AIMは、参加者の背景から状況の始まりを作る、帰結を予測する、物語の筋にまとめる、執筆中に続きを提案する、という4つのLLMエージェントからなるウェブアプリで、オープンソースで公開された（§2）。比較対象は、専門家が書いた同じ話題の短い物語を読む群と、無関係な話題でAIMと共同執筆する群である（抄録）。", "p4": "科学研究費（N=1,007）と衛星のサイバーセキュリティ（N=894）の2つの実験で、リスクが自分にどれだけ近く感じられるか（心理的近さ）と政策への態度を測り、媒介分析、効果の異質性の分析、23,496回の自動補完のやりとりの言語分析を行った（抄録、§10）。", "p5": "AIMは心理的近さを、専門家の物語に対して0.36と0.38標準偏差、無関係な執筆に対して0.80と0.90標準偏差高め、AIに否定的な人でも効果があった（抄録）。政策への態度は科学研究費で0.16と0.10（後者は有意でない）、衛星で0.54と0.67標準偏差動き、主に物語への没入でなく心理的近さを通じていた（抄録、§6）。AIMは具体的な詳細を、参加者は一人称の視点と感情を担った（抄録）。", "p6": "著者は、成果は直後の自己報告で媒介変数と同時に測ったため媒介は識別されていないこと、個別化や共同執筆などの要素を切り分けていないこと、Prolificの参加者はAIでの執筆に慣れている可能性があること、どちらも悪い未来のシナリオだったことを限界に挙げる（§9）。提供者がシナリオと誘導の強さを決められるため、操作の危険は減っても消えないとする（§9）。", "fun": "「もし研究費が減ったら、自分の暮らしはどう変わる？」という物語を、AIと一緒に自分を主人公にして書いてみる。この実験では、専門家の解説を読むより、遠い政策のリスクを身近に感じるようになった。AIが具体的な場面を描き、人が気持ちを書き込むという役割分担も面白い。", "unverified": "効果の異質性（因果フォレスト）の結果と、質的なフィードバックの分類の詳細は確認していない。"}}, {"id": "pn08", "rank": 8, "field": "統計学", "headline": "ログと少数の試行でAIエージェントを監査する", "title": "Adaptive Probe Design for Auditing AI Agents", "url": "https://arxiv.org/abs/2610.34751", "authors": "Zhenghan Li ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Li, Z., Bi, X., & Ding, J. (2026). Adaptive Probe Design for Auditing AI Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34751", "why": "過去のログでは足りない状態と行動の領域に監査試行を集中させる凸最適化の設計で、展開予定の方策の性能推定を改善し、誤差の上限も与えた。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、定式化§3、アルゴリズム§4、数値実験§6、自動運転の事例§7、結論§8）を読んだ。証明の付録は読んでいない", "preprint": true, "p1": "AIエージェントを配備する前にその方策（目標方策）の性能を評価する監査のため、過去の運用ログと限られた数の監査用の試行（プローブ）を組み合わせ、プローブを最適に設計する枠組みCADを提案した（抄録）。未査読のプレプリントである。", "p2": "過去の観測は、目標方策が訪れる重要な状態と行動を十分に含まないことがあり、評価の信頼性を損なう（抄録）。", "p3": "ログとプローブを合わせた状態・行動の訪問分布（占有度）と目標方策の占有度のずれを最小にするプローブの設計を、流れの制約つきの凸最適化として定式化し、環境のダイナミクスと占有度を推定しながらプローブの方策を更新する適応的なアルゴリズムを作った。連続の状態にはソフトな状態の集約で拡張した（抄録、§3–4）。", "p4": "このずれを平均二乗誤差と漸近分散の上界に結びつけ、適応的な推定量の誤差の上界を示した（§5）。Gridworld、LunarLander、Waymo Open Motion Datasetの実際の運転ログを使う自動運転の監査で、オフラインの重点サンプリング（MIS、PDIS、DR）、ランダムなプローブ、目標方策そのものによるプローブと比べた（§6–7）。", "p5": "ログが目標方策を十分に含まないとき、CADは方策の価値の推定精度を大きく高め、Gridworldではオフラインのみの推定に比べて平均二乗誤差を桁違いに減らした（§8）。監査の予算が少ないとき、目標方策そのものでプローブするよりCADの誤差が小さかった（§6.1）。", "p6": "著者は、高次元の環境での状態の抽象化の学習と、収益の低い側の裾の推定（リスクに敏感な監査）のためのプローブ設計を今後の課題とする（§8）。解釈：方法は環境のダイナミクスを推定できることを前提とし、対象は平均的な価値の推定で、まれな事故のような裾の評価はまだ扱っていない。", "fun": "自動運転のAIを道路に出す前に、どれだけ安全かを確かめたい。でも過去の運転記録には、AIが実際によく出会う場面が少ないことがある。この研究は、記録に足りない場面だけを狙って追加の試験を設計し、少ない試験回数で評価の誤差を大きく減らした。足りない所を見極めて調べる、賢いテストの作り方だ。", "unverified": "LunarLanderと自動運転の事例での誤差の具体的な値（表）は確認していない。"}}, {"id": "pn09", "rank": 9, "field": "因果推論", "headline": "連続処置の効果に未観測交絡下で鋭い限界", "title": "Sharp Bounds on Continuous Treatment Effects under Unobserved Confounding", "url": "https://arxiv.org/abs/2610.33278", "authors": "Junzhe Zhang", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Zhang, J. (2026). Sharp Bounds on Continuous Treatment Effects under Unobserved Confounding (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33278", "why": "応答関数と傾向スコアの滑らかさだけを仮定し、観測された対角上のすべての参照点を使うことで、連続処置の条件付き平均潜在結果と効果に鋭い限界を与えた。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、境界の導出§2–4の要旨、実験§5、結論§6）を読んだ。証明の付録は読んでいない", "preprint": true, "p1": "観測されない交絡がある状況で、連続的な処置（投与量など）の条件付きの効果を、取りうる範囲で示す部分識別について、それ以上狭められない鋭い範囲を導いた理論論文（抄録）。未査読のプレプリントである。", "p2": "見えない交絡があると観測データの相関は因果効果を一意に決めず、同じ観測分布でもどの処置が最適かが逆になるモデルがありうる（§1、図1）。連続の処置では離散の場合の列挙が使えず、既存の感度モデルは問い合わせ点で観測された処置の密度が正であることを要する（§1）。", "p3": "結果が有界で、反応関数と潜在的な交絡因子を与えたときの傾向スコアがリプシッツ連続だと仮定し、これがKimら（2018）の滑らかな処置反応・選択の条件を導くことを示した。Kimらの境界は2つの参照点しか使わないが、識別された対角上のすべての参照点を通して境界を作り、条件付き平均潜在結果（CAPO）の鋭い識別集合を得た（抄録、§3–4）。", "p4": "合成の構造因果モデル（離散500個、連続の2つの族で各250個）と、国際脳卒中試験（IST）のデータに基づく制御された設定で、Kimらの境界、連続の周辺感度モデル（CMSM）、Khanらの方法と、真の値の被覆と区間の幅を比べた（§5）。", "p5": "境界は単調性や重なりの仮定なしに情報を持ち、観測された範囲の外の処置でも成り立つ（抄録）。区間の幅は離散の例でKimらより19.17%、連続の例（12,500の問い合わせ）で18.70%狭く、どちらも被覆は完全だったが、ISTの設定では1.34%狭いにとどまった（§5）。", "p6": "CMSMとはどちらも一様には優れず、合成例ではCMSMが狭かったが、その被覆は真の目標で較正した設定に頼っていた（§5）。解釈：範囲の狭さはリプシッツ定数などの仮定の強さに依存し、実データでそれをどう選ぶかが実用上の鍵になる。", "fun": "薬の量を少し変えたら効き目はどう変わるか。でも体質のような見えない要因が量の選び方と結果の両方に関わると、データから答えを一つに決められない。この研究は、効き目が量に対して急に変わらないと仮定したとき、答えのありうる範囲をどこまで狭められるかを数学で突き詰め、合成データの例では従来より約2割狭い範囲を示した。", "unverified": "リプシッツ定数の選び方と、境界の推定の統計的な性質は確認していない。"}}, {"id": "pn10", "rank": 10, "field": "経済学", "headline": "生成AIで飾った応募書類をどう選抜するか", "title": "Screening AI-equipped applicants", "url": "https://arxiv.org/abs/2610.34508", "authors": "Pengyu Qian ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Qian, P., & Yu, S. H. (2026). Screening AI-equipped applicants (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34508", "why": "応募者が生成AIで書類を安く飾れるとき、操作能力のばらつきが大きいほど最適な採用は観察できる質だけに収束することを示し、書類経由の別ルートを設けた二重の仕組みが漸近的に最適になることを導いた。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、モデル§2、戦略的な特徴の崩壊§3、2本立ての仕組み§4、私的な選抜の外部費用§5）を読んだ。証明は読んでいない", "preprint": true, "p1": "生成AIで応募書類を磨く費用が下がり、書類が仕事の能力を表さなくなる状況で、雇用主が応募者をどう選ぶのが社会的に最適かを、多次元のメカニズムデザインで分析した理論論文（抄録）。未査読のプレプリントである。", "p2": "AIは応募者が強みを伝えるのを助けうる一方、書類の情報価値を下げうる。カスタマイズした応募書類への雇用主の評価の低下や、カバーレターの作り込みと採用結果の関係の弱まりを示す研究がある（§1）。", "p3": "雇用主は資格や職歴を要約した観察可能な質を見るが、他の職務に関わる属性は、応募者が私的に知る操作能力に応じた費用で操作できる報告から推測する。雇用主は定員の制約のもとで採用規則を事前に約束し、操作の費用を差し引いたマッチの価値で規則を評価した（抄録、§2）。", "p4": "技術の変化を、同じ観察可能な質を持つ応募者の間で操作能力のばらつきが大きくなる極限として表し、最適な規則の漸近的な振る舞いを分析した（§2.4、§3）。", "p5": "操作能力のばらつきが大きくなると、社会的に最適な採用は観察可能な質だけによる選抜に収束した（「戦略的な特徴の崩壊」）（抄録、§3）。報告に残る価値を取り込むため、観察可能な質の高い応募者を直接採用し、そうでない一部の応募者に報告による採用の道を開く2本立ての仕組みを作り、追加の条件のもとで報告による厚生の改善を2次の項まで最適な仕組みと一致させた（抄録、§4）。", "p6": "雇用主が私的に最適な規則を選ぶと、応募者の操作の費用が消えず、社会的な損失が残りうる（§5）。解釈：結果は操作能力のばらつきが十分に大きいという漸近的な条件に依存し、実際の採用データでの検証は扱っていない。", "fun": "AIを使えば、誰でも立派な志望動機を書ける。すると企業は、書類からその人の実力を読み取りにくくなる。この研究は、書類を磨く力の差が大きくなると、最終的には資格や職歴のような「ごまかせない情報」だけで選ぶのが社会にとって最善になることを数学で示した。そのうえで、書類で挽回できる別の道を少しだけ残す仕組みを提案している。", "unverified": "数値例（§4.4）の具体的な値と、2本立ての仕組みの閾値の決め方の詳細は確認していない。"}}, {"id": "pn11", "rank": 11, "field": "組織行動・心理的安全性", "headline": "遊び心のある振り返りが開発チームの燃え尽きを防ぐ", "title": "Playfulness for Well-being in Software Development Teams", "url": "https://doi.org/10.2139/ssrn.7675016", "authors": "Phuong Thao Nguyen ほか", "venue": "SSRN", "date": "2026-10-27", "apa": "Nguyen, P. T., Chung, S. H., Rasmussen, T. W., & Persson, J. (2026). Playfulness for Well-being in Software Development Teams. https://doi.org/10.2139/ssrn.7675016", "why": "スプリントの振り返りに遊びの要素を入れる会話型ゲームを設計し、8チームでの検証から、心理的安全性と率直さを高め硬直した習慣を崩す設計原則を導いた。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "ソフトウェア開発チームの「創造的な燃え尽き」を和らげるため、スプリントの振り返りに遊び心を持ち込む会話型のゲームScrumstinctをデザイン科学研究の手法で開発し、評価した（抄録）。未査読のプレプリントである。", "p2": "停滞、疲弊、硬直した習慣を特徴とする創造的な燃え尽きは、開発チームの創造性と幸福を妨げる。実務では広く認識されているが、ソフトウェア開発の研究ではあまり扱われてこなかった（抄録）。", "p3": "楽しさ、興奮、欲求を特徴とする遊び心を振り返りに取り入れる対話のゲームを作り、さまざまな業界の8チームとのワークショップで試した（抄録）。", "p4": "プレイの前後のフォーカスグループ面接とビデオ観察を質的に分析し、チームの創造的な燃え尽きへの影響を評価した（抄録）。", "p5": "遊び心のある振り返りは、チームが深刻な懸念を捉え直し、心理的安全性と開放性を育て、感情的な疲労を減らし、停滞した硬直的な習慣に挑むのを助けた（抄録）。貢献として3つの設計原則と、その具体化であるScrumstinctを示した（抄録）。", "p6": "解釈：8チームのワークショップの前後を質的に比べたもので、対照群はなく、効果の持続も確かめられていない。設計原則の中身は抄録にない（未確認）。", "fun": "ソフトウェアの開発チームは、区切りごとに仕事を振り返る会議を開く。でも同じやり方を続けると会議はマンネリになり、皆が疲れてしまう。この研究は振り返りを会話のゲームにして遊び心を持ち込み、8つのチームで試すと、本音を言いやすくなり、疲れも和らいだという声が集まった。", "unverified": "本文を読んでいないため、3つの設計原則の内容とゲームの具体的なルールは未確認。"}}, {"id": "pn12", "rank": 12, "field": "経営学", "headline": "緊急流動性の利用行は預金金利を上げずに済んだ", "title": "Did Emergency Liquidity Distort Deposit Competition? Evidence from the Bank Term Funding Program", "url": "https://doi.org/10.2139/ssrn.7672004", "authors": "Nur Al Faisal", "venue": "SSRN", "date": "2026-10-26", "apa": "Faisal, N. A. (2026). Did Emergency Liquidity Distort Deposit Competition? Evidence from the Bank Term Funding Program. https://doi.org/10.2139/ssrn.7672004", "why": "米国の銀行タームファンディングプログラムの貸出データと支店の預金金利を結び、利用行は同じ郡の競合より定期預金金利の引き上げが6〜8ベーシスポイント小さかったことを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "罰則的な水準より低い金利で提供された緊急の流動性供給が、それを使う銀行に有利なように預金獲得の競争をゆがめたかを、米国の銀行定期資金調達プログラム（BTFP）で調べた（抄録）。未査読のプレプリントである。", "p2": "罰則金利より安い緊急の資金供給は、利用した銀行に競争上の優位を与えるのではないかという懸念がある（抄録）。背景：BTFPは、銀行の破綻が相次いだ後に米連邦準備制度が設けた緊急の資金供給制度である。", "p3": "プログラムの融資単位の開示と、支店単位で掲示された預金金利を組み合わせ、同じ郡の中で利用行と比較可能な競合行の定期預金（CD）金利の動きを比べた（抄録）。", "p4": "貸出期間中、新規貸出の終了時、利用行の名前が公表された時について、金利、競合行の反応、支店網、預金の流出を調べた（抄録）。", "p5": "貸出期間中、利用行は比較可能な競合行よりCD金利の引き上げが6〜8ベーシスポイント小さく、信頼区間は13ベーシスポイントを超える差を排除した（抄録）。競合行の金利はほとんど反応しなかったが、利用行が多くの預金を持つ地域で競合行の支店網が広がった。新規貸出の終了による変化は検出されず、2025年に名前が公表されても利用行は預金を失わなかった（抄録）。", "p6": "解釈：利用行が安い資金に頼って預金金利を抑えた可能性があるが、競争のゆがみの大きさや、どの銀行が制度を使うかの選択による偏りへの対処は抄録からは判断できない。", "fun": "銀行が危ないとき、中央銀行は安い金利でお金を貸して支える。でも支えを受けた銀行が預金集めで有利になったら不公平だ。米国の制度を調べると、支えを受けた銀行は預金金利の引き上げを競合より6〜8ベーシスポイント控えめにしていた。安い資金があれば、高い金利で預金を集める必要が薄れるのかもしれない。", "unverified": "本文を読んでいないため、標本の銀行数、推定の手法の詳細、支店網の変化の大きさは未確認。"}}, {"id": "pn13", "rank": 13, "field": "機械学習（Hugging Face）", "headline": "必要に応じて協働を組み立てる多エージェント", "title": "DynaFlow: Learning Free-Form Multi-Agent Orchestration", "url": "https://arxiv.org/abs/2610.34467", "authors": "Ruhao Liu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-27", "apa": "Liu, R., Li, Q., Wang, S., & Wang, X. (2026). DynaFlow: Learning Free-Form Multi-Agent Orchestration (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34467", "why": "主エージェントが協働の要否を判断し、副エージェントを動かすワークフローをその場で生成する仕組みを学習させ、6つのベンチマークで最強の比較手法を10.90ポイント上回った。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、方法§3、設定§4、結果§5、考察§6、結論§7）を読んだ。付録は読んでいない", "preprint": true, "p1": "複数のLLMエージェントの協調を事前に決めた構造に頼らず、主エージェントが必要なときに課題ごとの実行可能なワークフロー（副エージェントを順番・並列に動かすプログラム）を自由に書いて指揮する枠組みDynaFlowを提案した（抄録）。未査読のプレプリントである。", "p2": "マルチエージェントシステムは事前に決めた協調の構造に頼ることが多く、多様な課題の要求に適応する力が限られていた（抄録）。", "p3": "ワークフローの合成を主エージェントの行動空間に組み込み、構造化された情報の受け渡しと検証を含むプログラムを生成させ、実行結果を次の行動に生かした（抄録）。主エージェントだけを、教師モデル（GLM-5.3 Max）から蒸留した2,031例での教師ありファインチューニングと、根拠のない前提や偏った検証などを除いて選んだ712例での追加学習で訓練し、副エージェントは固定した（§4）。", "p4": "AIME 2024〜2026、PolyMATH、GPQA-Diamond、HotpotQAの6つのベンチマーク計688問で、すべてQwen3.5-27Bを基盤にCoT、自己一貫性、Self-Refine、AFlowと比べ、ワークフローを必ず使う「強制」と、直接答えるかを選ぶ「動的」の実行を評価した（§4）。", "p5": "全体の正解率は強制で88.08%、動的で87.94%と、最も強い基準を10.90ポイント上回った（抄録、§5.1）。AIMEの90問はすべて正解し、HotpotQAは84.50%だったが、GPQA-DiamondではSelf-RefineとAFlowが上回った（§5.1）。動的な実行では47.1%の問題に直接答え、1問当たりの副エージェントを約41%減らした（§5.4）。", "p6": "GPQAの失敗例では、副エージェントの誤った中間結論がその後の検証を誤らせ、主エージェントが正しい証拠を優先できないことがあった（§5.1、§6）。著者は、副エージェントの訓練と、意見の不一致や誤りを含む複数ターンの軌跡への拡張を今後の課題とする（§6）。", "fun": "難しい問題を解くとき、AIのリーダー役が「計算係」「検算係」「調べ係」に仕事を割り振る手順を、その場でプログラムとして書く。この研究では、リーダー役だけを訓練して部下役はそのままにしたのに、数学コンテストの90問をすべて解けるようになった。簡単な問題では部下を呼ばずに自分で答えるのも賢い。", "unverified": "ワークフローの質の評価（4つの設計基準）の具体的な得点は確認していない。"}}, {"id": "pn14", "rank": 14, "field": "ヒューマンコンピュータインタラクション", "headline": "AIへの情緒的ニーズと機能的ニーズは併存する", "title": "Affective and Functional Needs in AI Use: User Patterns and Their Relation to Real-Life Support and Well-Being", "url": "https://arxiv.org/abs/2610.34732", "authors": "Jessy Wang-Sun ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Wang-Sun, J., Sun, E. Y., Zhang, H., & Xu, Z. (2026). Affective and Functional Needs in AI Use: User Patterns and Their Relation to Real-Life Support and Well-Being (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34732", "why": "1,090人で会話AIから受ける支援の4次元を測る尺度を作り、情緒的と機能的の両方の目的でAIを使う利用者がいることと、現実の支援やwell-beingとの関係を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（研究設計§III、因子分析・クラスター分析・幸福の比較§IV、考察§V）を読んだ", "preprint": true, "p1": "対話型AIが、情報や作業の助けといった機能的な必要と、感情の支えや仲間といった情緒的な必要の両方を満たす使われ方を、社会的支援の理論に基づく尺度で測り、利用者の型と現実の支援・幸福との関係を探った（抄録）。未査読のプレプリントである。", "p2": "既存研究は機能的な利用と情緒的な利用を二者択一の分類として扱い、利用者を1つの主な必要で分けてきたため、両方の目的でAIを使う利用者を捉えられなかった（抄録）。", "p3": "人間関係向けの社会的支援の尺度とオンライン社会的支援尺度（OSSS）の項目を調整して、情緒・自尊、社会的な仲間、情報、道具的の4次元からなるAI支援尺度を作り、探索的因子分析と信頼性分析で検証し、k平均法で利用者を分類した（§III、§IV）。", "p4": "2025年7〜8月に中国のオンライン調査（Wenjuan.com）で集めた1,211人のうち有効な1,090人を分析し、型ごとに幸福（SWEMWBS）と現実の社会的支援（BSSS）を記述的に比べた（§III-A、§IV-D）。", "p5": "利用者は5つの型に分かれ、最も多い「情緒・仲間型」（378人）は情緒と仲間の支援が最も高く、情報と道具的な支援も平均を上回り、多くの利用者が情緒と機能の両方の目的でAIを使っていた（§IV-C）。AIの支援をほとんど求めない「最小支援型」（154人）は、幸福と現実の支援が最も高かった（§V）。", "p6": "著者は、幸福と型の関係は可能性を示す指標にすぎず、相関や因果の分析はしていないと述べる（§IV-D、§V）。解釈：中国の一つのオンライン調査による横断的な自己報告で、他の国や時期への一般化は確かめられていない。", "fun": "AIに調べ物を頼む人もいれば、悩みを聞いてもらう人もいる。でも中国の1,090人を調べると、一番多かったのは両方を同じくらい頼る人たちだった。そして、AIにほとんど頼らない人たちが、現実の人間関係の支えも幸福度も最も高かった。ただし、どちらが原因かはまだ分からない。", "unverified": "因子分析の負荷量と、型ごとの幸福の平均値は確認していない。"}}, {"id": "pn15", "rank": 15, "field": "統計学", "headline": "ラベルを能動的に選んで母平均を推定する", "title": "Pro-Active Inference", "url": "https://arxiv.org/abs/2610.34681", "authors": "Skyler Wu ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Wu, S., Nair, Y., Maechler, A., & Candès, E. J. (2026). Pro-Active Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34681", "why": "機械学習の予測を使い、次にラベルを付ける観測を逐次選びながら妥当な信頼区間を作る非復元の能動的推測を定式化し、有限標本の不偏性と漸近的な妥当性を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、方法§3、理論§4の要旨、実験の設定§5、結果§6、考察§7）を読んだ。証明の付録は読んでいない", "preprint": true, "p1": "全員の結果を観測するのは高価だが、共変量と機械学習の予測は全員分ある状況で母集団の平均を推定するため、次にラベルを付ける観測を能動的に選び、予測を更新しつつ妥当な信頼区間を作る非復元抽出の方法Pro-Active Inference（PAI）を提案した（抄録）。未査読のプレプリントである。", "p2": "能動的統計推論は、決まった順番でラベルを付けるか飛ばすかを決める方式が中心だった。著者らの以前の復元抽出の版には、LLMの評価で限界があった（抄録、§6.1）。", "p3": "残っている共変量の集まりから次の観測を選び、オンラインの機械学習の更新を許したうえで、有限標本での不偏性と漸近的な妥当性を示し、改良した分散推定量を作り、ボンフェローニ補正なしに超母集団の推論へ拡張した。準オラクルの設定で、一括の能動推論に対する効率の向上を予測の残差の不均衡と結びつけた（抄録、§3–4）。", "p4": "8つのデータセット（米国の調査ACS、LLMの評価、AlphaFold、HIVなど）で、一様抽出、予測を使う推論（PPI）、逐次的な能動推論（SAI）、予測を使う能動テスト（PPAT）と、有効標本サイズと信頼区間の被覆率を比べた（§5–6）。", "p5": "被覆が名目に近い7つのデータでは、PAIは多くの設定でSAIより効率が高く（5つのデータで10の予算すべて）、ACSでは10%の予算で一様抽出の16%に相当する精度を得た（§6.1、図1）。一方、一様抽出を上回ったのは7つ中5つ、PPIを上回ったのは4つにとどまり、陽性が0.15%しかない詐欺のデータでは2.5%の予算で被覆が64.6%に落ちた（§6）。", "p6": "著者は、追加の適応性が効率を助けることも損なうこともあると認め、初期の残差の推定の難しさとその後のオンライン学習の動きを原因として分析した（抄録、§6.4）。解釈：まれな事象を含むデータでは正規近似が崩れうるため、予算が小さいときの使用には注意が要る。", "fun": "大勢の調査の答えを全部確かめるのは大変なので、一部だけを選んで調べ、AIの予測で残りを補う方法がある。この研究は、次に誰を調べるかをその都度賢く選ぶ方法を作り、多くの場合で調べる数を節約できた。ただ、単純なくじ引きで選ぶ方が良いデータもあり、「工夫すれば必ず得」ではないことも正直に示している。", "unverified": "改良した分散推定量の具体的な形と、予測モデルを固定したアブレーションの数値は確認していない。"}}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "AIによる自動化は熟練者の育成経路を細らせる", "title": "The Capability Transfer: Cohort Reversal, Codified Expertise, and the Adaptability Tax of AI Transformation", "url": "https://arxiv.org/abs/2610.33102", "authors": "Ina Catrinescu", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Catrinescu, I. (2026). The Capability Transfer: Cohort Reversal, Codified Expertise, and the Adaptability Tax of AI Transformation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33102", "why": "若手の定型業務が先に自動化されると熟練者の供給が遅れて大きく減ることを2世代モデルで示し、内部で熟練者を育てる期間が約5年から9年に延びると試算した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "AIが定型化された仕事を自動化すると、若手の需要が先に減り、その後に熟練者の層が遅れて大きく減ることを、若手と熟練の2世代からなる企業のモデルで示した（抄録）。", "p3": "Caosun and Aral（2026）の単一労働者のモデルを2世代の企業に拡張し、AIにできない仕事での補助なしの練習で専門性が育つと仮定して、熟練者の育成経路を分析し、ベースラインの較正でシナリオを示した（抄録）。", "p5": "若手の需要は2022年の水準より約5分の1下で底を打ってから回復するが、熟練者の数は4分の1減ったのち半減し、内部で専門家を育てる期間は約5年から9年に延びた（抄録）。3年の視野の管理者は賃金総額を21%削るが、AIにできない仕事の能力は5分の2減る（抄録）。結果は予測ではなくシナリオである（抄録）。", "fun": "AIが新人の仕事を肩代わりしても、すぐには困らない。ところが新人が経験を積む場がなくなり、何年かたつとベテランが足りなくなる。このモデルでは、一人前に育つまでの年数が約5年から9年に延びた。目先の効率と将来の人材育成がぶつかるという、どの職場にも通じる話だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "固定価格契約の満了で家計の電気代と滞納が増加", "title": "Consumer Protection and Market Efficiency under Energy Price Shocks", "url": "https://doi.org/10.2139/ssrn.7675051", "authors": "Jacopo Lunghi ほか", "venue": "SSRN", "date": "2026-10-27", "apa": "Lunghi, J., Bonan, J., Cattaneo, C., anon, G., & Tavoni, M. (2026). Consumer Protection and Market Efficiency under Energy Price Shocks. https://doi.org/10.2139/ssrn.7675051", "why": "イタリアの電力会社で固定価格契約が順次満了し卸価格連動に切り替わる変化を使い、支出が20〜56%増え、滞納と分割払いの利用が増えたことを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "欧州エネルギー危機の中、イタリアの大手電力会社で長期の固定価格契約が順次満了して卸価格連動の料金に自動で切り替わった変化を使い、家計の支出・消費・支払い困難への影響を推定した（抄録）。", "p3": "契約満了の時期の違いを、高い電気代への曝露のほぼ外生的な変動として利用し、切り替えの前後の請求額、消費量、滞納、分割払いの利用、契約の乗り換えを比べた（抄録）。", "p5": "切り替えで請求額はすぐに20〜56%増え、消費は徐々に調整された（支出弾力性−0.117）（抄録）。滞納・分割払いの利用・乗り換えが増え、固定価格契約の暗黙の補助は絶対額では逆進的だが推定所得に対しては累進的で、効率の損失は所得分布の両端に集中した（抄録）。", "fun": "電気代が固定の契約は、値上がりの嵐から家計を守ってくれる。でも契約が切れて市場の値段に変わった家庭では、請求額がすぐに2割から5割以上も跳ね上がり、払えない家庭も増えた。値段の変化を伝えることと、暮らしを守ることのバランスの難しさが分かる研究だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "規制者の参加でマッチングの安定性を回復", "title": "Stable matching under regulation", "url": "https://arxiv.org/abs/2610.34412", "authors": "Chao Huang", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Huang, C. (2026). Stable matching under regulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34412", "why": "任意の提携が合意できる市場で、規制者がすべての合意に加わると代替性より弱い条件で安定な結果が存在することを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "どの提携でも合意できる市場では、代替的な選好のもとでも安定な結果が存在しないことがあるが、規制者がすべての合意に加われば安定性を回復できることを示した理論論文（抄録）。", "p3": "規制者が各合意に参加する市場をモデル化し、通常の主体の選好が代替性より弱い条件を満たせば、規制者の選好をほとんど制約せずに集合的に安定な結果が存在することを証明した（抄録）。", "p5": "別の存在定理として、通常の主体の選好が任意でも、規制者が各主体の有利な契約の削除を支持するなら安定な結果が存在することを示し、規制を伴う活動のマッチング市場に適用できるとした（抄録）。", "fun": "人と仕事、売り手と買い手の組み合わせを決める市場では、誰もが納得して誰も抜け駆けしない組み合わせ（安定な組み合わせ）が見つからないことがある。この論文は、規制者がすべての契約に立ち会う仕組みを入れると、そうした組み合わせが存在するようになることを示した。ルール作りの力を数学で示した点が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "連続時間の動学ゲームの均衡の一意性条件", "title": "Multiplicity and Uniqueness of Equilibria in Continuous-Time Dynamic Discrete Games", "url": "https://arxiv.org/abs/2610.33660", "authors": "Jason R. Blevins ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Blevins, J. R., & Jeong, Y. (2026). Multiplicity and Uniqueness of Equilibria in Continuous-Time Dynamic Discrete Games (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33660", "why": "ポアソン過程で順に動く連続時間の動学離散ゲームで、マルコフ完全均衡が一意になる閉形式の十分条件を示し、参入退出モデルで複数均衡が生じる領域を特定した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ポアソン過程で順に動く連続時間の動学離散ゲームで、マルコフ完全均衡が一意になる閉形式の十分条件を示し、複数均衡が実証研究に与える影響を明らかにした（抄録）。", "p3": "モデルの基本要素から確かめられるセミパラメトリックな一意性の条件を導き、参入退出の動学的な複占モデルで均衡を大規模に数値探索して、条件の網羅範囲と複数均衡の様子を調べた（抄録）。", "p5": "一意性が普通だが、複数均衡は市場が2社を支えられない領域、企業が非常に辛抱強い領域、中間の意思決定頻度に集中し、典型的には安定な非対称均衡2つと不安定な対称均衡1つが現れた（抄録）。一意性を仮定する完全解の推定量は不安定な均衡に収束しうるが、2段階推定量は正しい均衡を回復した（抄録）。", "fun": "2つの会社が市場に入るか出るかを読み合うゲームでは、答え（均衡）が1つに決まらないことがある。この研究は、答えが1つになる条件を示し、答えが複数ある場合は計算方法によって間違った答えに引き寄せられる危険があることを示した。経済の分析に潜む数学の落とし穴を教えてくれる。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "金融LLMベンチマークの点数は抽出規則で決まる", "title": "What FLARE's Published Numbers Actually Measure", "url": "https://arxiv.org/abs/2610.33604", "authors": "Dung Cao ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Cao, D., Gang, P., & Veluri, A. (2026). What FLARE's Published Numbers Actually Measure (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33604", "why": "金融タスク集FLAREの採点を監査し、多くの値がモデルではなく回答抽出の規則で決まっていることと、規則の違いで正解率が大きく変わることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "金融タスク集FLARE（PIXIUとFinBenの基盤）の採点を監査し、多くのセルで得点がモデルではなく回答抽出の規則で決まっていることを示した（抄録）。", "p3": "公開済みの得点を、ベンチマーク自身のコードとlm-evaluation-harnessの抽出規則と照合し、規則が明示されないため得点が部分識別になる状況を、204セルの要因計画と46セルの診断で評価した（抄録）。", "p5": "公開された34のHeadlinesの得点のうち9つは、出力がYesと完全一致しないときにコードが返す値と一致した（抄録）。同じ生成でも規則の違いで正解率が最大0.4216異なり、Financial PhraseBankでは7モデル中4つが規則によって多数派の下限0.5948を上回ったり下回ったりした（抄録）。", "fun": "テストの点数は、答案の採点ルールしだいで変わることがある。金融のAIの成績表を調べると、多くの点数がAIの実力ではなく「答えのどの部分を読み取るか」という採点の決まりで決まっていた。ランキングを見る前に、物差しの作り方を確かめる大切さが分かる研究だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "データ仲介業者の丸めがアナリスト予想を歪める", "title": "Does analyst forecast bias originate upstream in the information supply chain? *", "url": "https://doi.org/10.2139/ssrn.7672523", "authors": "Albert Mensah ほか", "venue": "SSRN", "date": "2026-10-26", "apa": "Mensah, A., Tang, V. W., & Asamoah, P. E. (2026). Does analyst forecast bias originate upstream in the information supply chain? *. https://doi.org/10.2139/ssrn.7672523", "why": "データ提供会社の丸め規則による外生的なノイズを回帰不連続デザインで使い、アナリストがそのノイズを補正しきれず予想の偏りが大きくなることを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "データ提供会社の丸め規則が配信する指標に外生的なノイズを加えることを回帰不連続デザインで利用し、アナリストがそのノイズを補正しきれず、利益予想の偏りが大きくなることを示した（抄録）。", "p3": "代替データの提供会社（LikeFolio）の顧客満足度スコアの丸めによる不連続を使い、配信される情報の形式がアナリストのEPS予想の偏りと短期の株価に与える影響を推定した（抄録）。", "p5": "丸めによる顧客満足度の1ポイントの上昇は、EPS予想の偏りを株価の0.1〜0.2%（偏りの標準偏差の7〜14%）大きくした（抄録）。効果は不透明で不確実性の高い企業と、経験の浅いアナリストや専門外のアナリストで大きく、短期の価格効果も生じた（抄録）。", "fun": "データ会社が数字をきりのいい値に丸めるだけで、プロのアナリストの予想が狂うことがある。この研究は、丸めで顧客満足度が少し高く見えると、アナリストが会社の利益を楽観的に予想してしまうことを示した。小さな数字の扱いが市場をゆがめるという話が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "欧州電力市場の最適な入札区域を探す", "title": "Drawing the Right Lines: Identifying Optimal Bidding Zones for the European Electricity Market *", "url": "https://doi.org/10.2139/ssrn.7673118", "authors": "Jonas Boeschemeier ほか", "venue": "SSRN", "date": "2026-10-27", "apa": "Boeschemeier, J., & Neuville, P. (2026). Drawing the Right Lines: Identifying Optimal Bidding Zones for the European Electricity Market *. https://doi.org/10.2139/ssrn.7673118", "why": "2万以上のノードの模擬価格で入札区域の構成を評価する指標を作り、ドイツを2区域に分けるだけで欧州全体の効率差の46.3%が解消されると示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "欧州の電力市場の入札区域が送電の混雑を反映しているかを、区域の構成が送電網の状態をどれだけ捉えるかを測る空間的R²で評価し、より効率的な区域の引き方を示した（抄録）。", "p3": "欧州29か国の20,000以上のノードの模擬的なノード価格に枠組みを適用し、現行の区域と、国境にとらわれない最適な区域の配置を比べた（抄録）。", "p5": "ドイツを2区域に分けると欧州全体の効率差の46.3%、フランスでは8.9%が解消し、他の分割は2%程度以下だった（抄録）。最適に置いた7区域で現行の38区域と同等の効率になり、要点は区域の数ではなく線の引き方だとした（抄録）。", "fun": "欧州の電気は、区域ごとに同じ値段で売り買いされる。しかし電線の混み具合は国境と一致しない。この研究は区域の線を引き直すと効率がどう変わるかを計算し、ドイツを2つに分けるだけで欧州全体の無駄の半分近くが消えることを示した。数より線の引き方が大事という結論が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn23", "rank": 23, "field": "経済学", "headline": "繰り返しゲームでのレベルk推論を識別する", "title": "Identifying level-$k$ reasoning in repeated games: Strategies, beliefs, and cognitive ability", "url": "https://arxiv.org/abs/2610.33098", "authors": "David Gill ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Gill, D., & Rosokha, Y. (2026). Identifying level-$k$ reasoning in repeated games: Strategies, beliefs, and cognitive ability (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33098", "why": "繰り返し囚人のジレンマで戦略と他者の戦略への信念を同時に測り、相当数の被験者をレベル1か2に分類し、認知能力と経験が高い推論水準を予測することを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "繰り返しゲームで、個々の行動ではなく戦略全体の水準で働くレベルk推論を識別し、認知能力と経験が高い推論水準を予測することを示した（抄録）。", "p3": "戦略の選択と他者の戦略への信念の両方を組み込んだレベルk推論のモデルを作り、無期限に繰り返す囚人のジレンマで引き出した戦略と信念を、新しい誤差許容の概念で分類した（抄録）。", "p5": "相当な割合の被験者をレベル1またはレベル2に分類でき、戦略の水準でレベルk推論が働くとき、認知能力と経験が高い推論水準を予測した（抄録）。具体的な割合は抄録にない（未確認）。", "fun": "「相手は私がこう考えると考えている」と何段階先まで読むかを、レベルk推論という。この研究は、協力するか裏切るかを何度も繰り返すゲームで、人がどこまで先を読んで作戦を立てるかを調べた。頭の回転が速く経験のある人ほど、深く読んでいた。じゃんけんの読み合いにも通じる話だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn24", "rank": 24, "field": "経営学", "headline": "環境目標の宣言より実践が管理職の主体性を高める", "title": "Declare Green, Do Green? The Interplay of Corporate Environmental Sustainability Objectives and Practices in Shaping Managerial Proactive Behavior", "url": "https://doi.org/10.2139/ssrn.7675282", "authors": "Jisun Kim ほか", "venue": "SSRN", "date": "2026-10-27", "apa": "Kim, J., Gao, H., Mesquita, L. F., Lee, H. W., & Hoetker, G. (2026). Declare Green, Do Green? The Interplay of Corporate Environmental Sustainability Objectives and Practices in Shaping Managerial Proactive Behavior. https://doi.org/10.2139/ssrn.7675282", "why": "ブラジル302社の管理職24,915人の調査と米国のオンライン実験で、環境の実践は目標の明確さと誇りを通じて主体的行動を高めるが、宣言された目標だけでは高めないことを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "ブラジル302社の管理職24,915人の調査と米国の管理職へのオンライン実験で、企業の環境への取り組みは、宣言された目標より実際の実践が、目標の明確さと誇りを通じて管理職の主体的行動を高めることを示した（抄録）。", "p3": "戦略過程の研究、意味づけと社会的アイデンティティの理論に基づき、使命やビジョンでの環境目標（宣言されたシグナル）と、日常業務や資源配分での実践（行動で示すシグナル）の効果を比べた（抄録）。", "p5": "環境の実践は目標の明確さと誇りを通じて主体的行動を高めたが、目標の宣言だけでは高めなかった（抄録）。ただし目標は、実践と目標の明確さの関係を強めて主体的行動を促した（抄録）。", "fun": "「環境にやさしい会社です」と掲げるだけで、社員はやる気になるだろうか。24,915人の管理職を調べると、やる気を高めたのは掲げた目標ではなく、実際の取り組みだった。ただ、目標は取り組みの意味を分かりやすくする手助けにはなっていた。言葉と行動の役割分担が見える研究だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn25", "rank": 25, "field": "経営学", "headline": "海外起業家は初回の成功で基盤に縛られる", "title": "Bound by success? Foreign entrepreneurs, first-campaign outcomes and asymmetric retention on a global crowdfunding platform", "url": "https://doi.org/10.2139/ssrn.7675027", "authors": "Eliran Solodoha", "venue": "SSRN", "date": "2026-10-27", "apa": "Solodoha, E. (2026). Bound by success? Foreign entrepreneurs, first-campaign outcomes and asymmetric retention on a global crowdfunding platform. https://doi.org/10.2139/ssrn.7675027", "why": "Kickstarterの初回キャンペーン389,314件で、成功後の再挑戦の上乗せが海外の起業家で米国より3.5ポイント大きいことを示し、基盤への非対称な依存を論じた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "Kickstarterで17か国の作り手が始めた初回キャンペーン389,314件を分析し、初回の成功後に再挑戦する傾向が米国外の作り手で米国の作り手より3.5ポイント強いことを示し、基盤への非対称な依存を論じた（抄録）。", "p3": "初回の成否と24か月以内の2回目の開始の関係を米国の作り手と海外の作り手で比べ、学習・満足・質の選別・累積的有利といった別の説明も検証した（抄録）。", "p5": "成功後の再挑戦の上乗せは海外の作り手で3.5ポイント大きく、失敗後は両者の戻る割合は同程度だった（抄録）。上乗せは英語でキャンペーンを示す海外の作り手に集中し、別の説明は検証で狭めたが排除はできなかった（抄録）。", "fun": "世界中から誰でも資金を募れるクラウドファンディングは、国の壁をなくす道具だと思われがちだ。ところが海外の作り手は、一度成功すると同じ場所に戻ってくる傾向が米国の作り手より強かった。ほかに頼れる場がないため、成功がかえって依存を生むという見方が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn26", "rank": 26, "field": "経営学", "headline": "大統領は分断的な課題を公の場で語らない", "title": "Behind Closed Doors: Presidential Meetings and Strategic Public Disclosure", "url": "https://doi.org/10.2139/ssrn.7664618", "authors": "Scott Jinzhiyang Wang", "venue": "SSRN", "date": "2026-10-26", "apa": "Wang, S. J. (2026). Behind Closed Doors: Presidential Meetings and Strategic Public Disclosure. https://doi.org/10.2139/ssrn.7664618", "why": "1935〜2009年の大統領日誌から会議の議題をLLMで推定し、公の発信との一致度が有権者に重要な課題で高く、党派的に分断的な課題で低いことを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "米国大統領が非公開の会議で扱う政策課題と公の発信がどれだけ一致するかを、1935〜2009年の大統領日誌から測り、発信の選び方と資本市場への影響を調べた（抄録）。", "p3": "大統領日誌から分単位の日程を復元し、LLMを補助に使って各会議で扱われた可能性のある政策課題と公の発信の話題を特定し、両者の類似度を測った（抄録）。", "p5": "有権者が重視する課題ほど発信は会議の内容に近く、自党内で割れる課題は発信が少なく、二大政党間で割れる課題は多かった（抄録）。類似度が高いほどその後の市場全体と個別企業の不確実性が低く、この関係は政府需要への依存が大きい企業で強かった（抄録）。", "fun": "大統領が毎日だれと会ったかは、分刻みの日誌に残っている。この研究は1935年から2009年までの日誌をAIの助けを借りて読み解き、大統領が実際に取り組む課題のうち何を国民に語るかを調べた。自分の党が割れる話題は語りたがらないという、人間らしい傾向が見えたのが面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "e閉包で危険予算の余りを使い決定を再認証", "title": "Recertifying decisions via e-closure: uniform improvements of conformal risk control and randomized e-BH", "url": "https://arxiv.org/abs/2610.35821", "authors": "Tian Bai ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Bai, T., & Ramdas, A. (2026). Recertifying decisions via e-closure: uniform improvements of conformal risk control and randomized e-BH (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35821", "why": "危険を制御する手続きが使い残した予算をe値の表現で定量化し、妥当性を保ったまま保守性を減らす再認証の枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "統計的な手続きがリスクの予算を使い残すことに着目し、e値による表現とe閉包の原理を使って、妥当性を保ったまま手続きを改良する「再認証」という一般的な枠組みを提案した（抄録）。", "p3": "予算で割った損失をe値の集まりとみなし、分布の構造から余りを数えてe値を大きくし、より保守的でない決定を作る方法を、コンフォーマルなリスク制御（CRC）と乱択e-BHに適用した（抄録）。", "p5": "CRCではどの較正標本でもCRCより保守的にならず、凸な損失では再認証の反復が許容的な制御器へ幾何級数的に収束した（抄録）。依存のあるe値の偽発見率の制御では乱択e-BHの棄却集合を常に含む閉形式の手続きを導き、CIFAR-100の階層分類とシミュレーションで予算の利用と検出力の改善を示した（抄録）。", "fun": "「間違いの割合をこの値以下に抑える」という統計の保証は、安全のために余裕を残しすぎることがある。この研究は、使い残した余裕を数えて分け直せば、保証を壊さずにもっと思い切った判断ができることを示した。余ったお小遣いを上手に回すような発想だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "重要なラベルから順に誤りを監査する", "title": "Not All Mislabels Are Equal: Efficient Task-Aware Auditing with Confidence Sequences", "url": "https://arxiv.org/abs/2610.33262", "authors": "Fangyuan Lin ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Lin, F., Krever, N., Černý, J., & Xu, L. (2026). Not All Mislabels Are Equal: Efficient Task-Aware Auditing with Confidence Sequences (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33262", "why": "下流の得点への影響と不確かさで点検の優先順位を決め、常時有効な推測で誤ラベル率を保証する監査法で、無作為抽出より少ない点検数を実現した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "専門家の確認が高価なデータのラベル監査で、下流の得点に効くラベルから優先的に調べ、いつ止めても妥当な信頼系列で誤りの割合を保証する枠組みATLASを提案した（抄録）。", "p3": "生物多様性クレジットでの種の記録の確認を動機に、ラベルの訂正を混同行列で表し、ラベルの不確かさと訂正が得点に与える影響の両方から次に調べるデータを選んだ（抄録）。", "p5": "誤ラベル率を±2ポイントで保証するのに必要な監査は、無作為抽出よりケニアの生物多様性データで24%、CIFAR-10Nで11%少なく、非線形のHill-Shannon多様度では36%少なかった（抄録）。汎用の厳密な手法は専門家の確認が現実的でないほど多く必要になることも示した（抄録）。", "fun": "生き物の記録に付いた種の名前が正しいかを、専門家が一つずつ確かめるのは大変だ。この研究は、間違っていると結果に大きく響くデータから先に確かめることで、確認の回数を減らした。多様さの指標では36%も減った。限られた時間で何から調べるかという、テスト勉強にも通じる工夫だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "高次元の分散成分行列のノンパラメトリック縮小推定", "title": "Nonparametric shrinkage estimation of high-dimensional variance component matrices", "url": "https://arxiv.org/abs/2610.33431", "authors": "Ran Xie ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Xie, R., & Johnstone, I. M. (2026). Nonparametric shrinkage estimation of high-dimensional variance component matrices (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33431", "why": "形質数が多いときに散らばる固有値を補正する核変換で、回転不変な最適推定量を狙う分散成分行列の推定法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "多変量の混合効果モデルで、形質の数が多いときの分散成分の共分散行列を、スペクトルの形を仮定せずに固有値を縮小して推定する方法を提案した（抄録）。", "p3": "MANOVA推定量の極限スペクトル分布を表す自己無撞着方程式に基づき、標本固有値をカーネルで非線形に変換して、フロベニウス損失で最適な回転不変推定量を目指した（抄録）。", "p5": "従来のMANOVA推定量は成分ごとには不偏だが、形質の数が変量効果の実現数に近いと固有値が大きく散らばって偏る。提案法はこれを補正し、Pythonパッケージmlmm-shrinkageとして実装して、シミュレーションと実データで従来法と比べた（抄録）。", "fun": "多くの性質（形質）が遺伝でどうつながっているかを調べると、データの数に比べて性質の数が多いとき、計算結果のばらつきが実際より大きく見えてしまう。この研究は、そのゆがみを行列の数学の性質を使って補正する方法を作り、誰でも使える道具として公開した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "操作変数を使う分布に依存しない予測推論", "title": "Distribution-free predictive inference with instrumental variables", "url": "https://arxiv.org/abs/2610.35605", "authors": "Yonghoon Lee ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Lee, Y., Dobriban, E., & Tchetgen, E. T. (2026). Distribution-free predictive inference with instrumental variables (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35605", "why": "欠測がランダムでない結果について、操作変数があるときの分布に依存しない予測推論の可能性を識別指標で特徴づけ、不可能性の結果も示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "結果が無作為でない形で欠測するときに、操作変数を使って分布を仮定せずに予測区間を作れるかを理論的に調べ、可能な場合の実用的な方法を提案した（抄録）。", "p3": "推論の可能性を決める「識別指標」を定義し、それが小さいとどの分布に依存しない方法も情報のある推論ができないことを示した。十分に大きい場合は、欠測した結果の分位点の鋭いIV境界の効率的影響関数を導いて方法を作った（抄録）。", "p5": "提案法の被覆の保証は二重頑健性を持ち、シミュレーションと2つの実データ（FESの賃金とNHANES IIIの自己申告の身長）で性能を示した（抄録）。", "fun": "アンケートで答えない人がいると、答えた人だけで平均を出すと結果がゆがむ。答えない理由が答えそのものに関係するときは特に厄介だ。この研究は、答えるかどうかだけに影響する手がかり（操作変数）があれば、どこまで信頼できる予測の幅を示せるかを数学で明らかにした。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn31", "rank": 31, "field": "統計学", "headline": "品切れによる代替を考えた需要推定の厳密な尤度", "title": "Demand Estimation with Unobserved Stockout Substitution: Exact Likelihood Maximization", "url": "https://arxiv.org/abs/2610.34547", "authors": "Chenhao Wang ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Wang, C., Jiang, H., & Chen, N. (2026). Demand Estimation with Unobserved Stockout Substitution: Exact Likelihood Maximization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34547", "why": "品切れ時刻が観測されない状況で、多項ロジットの厳密な尤度とその勾配が1次元の積分で書けることを示し、効率的な推定を可能にした。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "品切れで客が別の商品を買ったり買わずに去ったりする状況で、在庫が補充時にしか観測されなくても、多項ロジットの需要を厳密な尤度最大化で推定する方法を示した（抄録）。", "p3": "購買過程の連続時間表現を使い、商品・客・品切れの数によらず、厳密な尤度とその勾配が1次元の積分になることを示し、商品数と期間数に線形な計算量で評価した（抄録）。", "p5": "Anupindiら（1998）以来の難題に、多項ロジットモデルで完全な解を与えたとし、2,000商品・2,000販売期間の需要を10分未満で推定した（抄録）。", "fun": "売り切れの棚の前で、客は別の商品を買うか、何も買わずに帰る。でも店には売り切れた時刻の記録がないことも多い。この研究は、そんなデータからでも本当の人気を正確に計算する方法を見つけ、2,000種類の商品の需要を10分もかからずに推定した。無人店舗の時代に役立つ工夫だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn32", "rank": 32, "field": "統計学", "headline": "シミュレーションベース推論の要約統計量の情報量", "title": "Intrinsic Information Rates of Summaries in Simulation-Based Inference", "url": "https://arxiv.org/abs/2610.34703", "authors": "Vansh Bansal ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Bansal, V., Poudel, P. S., & Scott, J. G. (2026). Intrinsic Information Rates of Summaries in Simulation-Based Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34703", "why": "要約統計量を情報損失のある通信路とみなし、事後分布の集中に伴って必要な相互情報量が際限なく増えることを示し、情報の使い方を論じた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "シミュレーションに基づく推論で観測を固定次元の要約に圧縮するとき、要約が持つ情報量（予算）を明示し、どれだけ必要で、どう使うのが最善かを情報理論で調べた（抄録）。", "p3": "要約を観測から要約への損失のある通信路とみなして相互情報量で予算を測り、必要な予算を事後分布の量子化で上から、各事後状態を確率で重み付けた逆定理で下から評価した（抄録）。", "p5": "事後分布が集中するにつれ必要な予算は際限なく増え、予算が有限なら確率的な要約がどの決定的な要約よりも厳密に小さい歪みを達成した（抄録）。4つのベンチマークで確率的なボトルネックが良い率と損失の関係を示し、予算によって構造の順位が入れ替わった（抄録）。", "fun": "たくさんのデータを短いメモにまとめるとき、メモに書ける量には限りがある。この研究は、その限られた量をどう使うのが最もよいかを情報理論で調べ、毎回同じ書き方をするより、少しランダムさを混ぜた書き方の方が得になることを示した。直感に反する結論が面白い。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn33", "rank": 33, "field": "統計学", "headline": "局所化した共形p値で条件付きの新規性を検出", "title": "Conformal Novelty Detection via Data-enhanced Localization", "url": "https://arxiv.org/abs/2610.34999", "authors": "Xiaoyang Wu ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Wu, X., Liu, J., Ren, H., & Zou, C. (2026). Conformal Novelty Detection via Data-enhanced Localization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34999", "why": "較正データと検証データを核推定に取り込む局所的な共形p値で、有限標本の妥当性と偽発見率の制御を保ったまま検出力を高めた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "変数間の関係から生じる新奇性（条件付きの新奇性）を検出するため、較正データと検査データの両方を使って局所化したコンフォーマルp値を作り、検出の効率を上げた（抄録）。", "p3": "両方のデータをカーネル推定に取り込んだ条件付き分布の推定量を再較正してp値を作り、それを使う検出アルゴリズムと、データに基づく帯域幅の選び方を提案した（抄録）。", "p5": "p値は有限標本で妥当で、検出アルゴリズムは有限標本で偽発見率を制御しつつ検出力を高め、シミュレーションと実データで利点を示した（抄録）。具体的な数値は抄録にない（未確認）。", "fun": "「いつもと違う」データを見つけるのは、不正や故障の発見に欠かせない。たとえば背が高いこと自体は普通でも、年齢の割に高いのは珍しい、というように、変数どうしの関係でしか分からない珍しさもある。この研究は、そうした珍しさを見逃さず、誤検出の割合も抑える方法を作った。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "アラインメントを汎化の問題として捉え直す", "title": "Alignment via Generalization", "url": "https://arxiv.org/abs/2610.34242", "authors": "Shai Shalev-Shwartz ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Shalev-Shwartz, S., & Shashua, A. (2026). Alignment via Generalization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34242", "why": "意図を複数の要件の集まりとして表し、学習に使った要件での成功が未知の要件に及ぶかという汎化の問題に帰着させる理論枠組みを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "AIが与えた目標の達成は上手になっても本当に望むことをするようにはならない整合（アラインメント）の問題を、学習理論の汎化の問題に置き換える枠組みAligned-PAC学習を提案した（抄録）。", "p3": "意図を一つの学習目標で表すのでなく具体的な要件の集まりで表し、学習に使った要件での成功が未知の要件にも及ぶかを問う形に定式化した（抄録）。", "p5": "独立した評価で表現された要件全体の整合の厳密な証拠が得られることと必要な評価の量を示し、明示した仮定のもとで学習済みモデルを組み合わせて要件を満たす最適化法を作った（抄録）。要件の選び方と未知の要件への汎化の条件は未解決とした（抄録）。", "fun": "「テストで満点を取れ」と教えたAIが、勉強せずに答えを丸暗記するようになったら困る。この研究は、そうした「目標は達成したが望みとずれた」状態を、練習問題で身につけたことが初めての問題でも通じるかという問題に置き換え、数学で扱えるようにした。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "利用者が指定する信頼度に合わせて回答を控える", "title": "Reinforcement Learning Done Right for Explicit Confidence Targets", "url": "https://arxiv.org/abs/2610.35059", "authors": "Zefeng He ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "He, Z., He, Y., Lin, Y., Yang, Y., & Cheng, Y. (2026). Reinforcement Learning Done Right for Explicit Confidence Targets (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35059", "why": "プロンプトで指定した正答率の目標に応じて回答か棄権かを選ぶ強化学習が失敗する原因を特定し、目標ごとに振る舞いを変えられる学習法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "利用者がプロンプトで正解率の目標pを指定し、LLMが答えるか控えるかを自分で選んで、答えた問題での正解率をp以上に保つよう、強化学習で1つのモデルを訓練する方法RLECを提案した（抄録）。", "p3": "従来の試みが目標を区別できなかった原因を、pを区別する報酬の信号が最適化中に失われることと、pが1に近づくと誤りの罰が際限なく大きくなることと特定し、安定な報酬の族と報酬の段階的な調整で対処した（抄録）。", "p5": "1つのLLMで明示的な確信度の目標を制御する訓練に初めて成功したとし、一般的な能力をおおむね保ちながら、外部の判定や訓練後の閾値調整なしで細かな目標の制御ができた（抄録）。数値は抄録にない（未確認）。", "fun": "自信がないのにもっともらしく答えるAIは困りものだ。この研究では、「この確率以上で正しいと思うときだけ答えて」と頼むと、AIが自信のない問題には答えを控えるように訓練した。どこまで慎重にするかを、使う人がその場で自由に決められるのが新しい。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "人とLLMの協働で質的コーディングを拡張する", "title": "Scaling Qualitative Analysis with Large Language Models: Development and Validation of the Smart Coder Framework for Human-LLM Collaborative Coding", "url": "https://arxiv.org/abs/2610.33205", "authors": "Cheng Tang ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Tang, C., Wang, K., Yang, Y., Wang, S., Cohen, A., Brown, R. E., & Orrill, C. H. (2026). Scaling Qualitative Analysis with Large Language Models: Development and Validation of the Smart Coder Framework for Human-LLM Collaborative Coding (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33205", "why": "教師へのインタビュー72件で、指示・プロンプト戦略・信頼性確認の3段階の枠組みを検証し、指示と思考の連鎖が人の合意との一致を高めることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMで質的データのコーディングを行う際の信頼性と人の監督を確保するため、指示・プロンプト戦略・信頼性の確認の3段階からなるSmart Coder Frameworkを提案し、検証した（抄録）。", "p3": "中学校の数学教師への面接記録72件と人の合意による基準を使い、指示の有無、few-shotと思考の連鎖の追加、1回のコーディングと自己整合性を要因計画で比べた。12件を開発と較正、60件を正式な評価に使った（抄録）。", "p5": "指示は一貫して一致度を高め、思考の連鎖は十分な指示のもとでさらに高めた。自己整合性の効果は小さくテーマに依存したが、人が確認すべき不安定な判断を見つけるのに役立った（抄録）。", "fun": "インタビューの記録を読んで「この発言はこのテーマ」と分類する作業は、研究者が何日もかけて行う。この研究は、AIに明確な指示を与えて何度か答えさせ、答えが揺れた部分だけを人が確認する手順を作り、72件の記録で確かめた。最終判断は人が持つという点が大事だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "CFL条件を辺に与えて双曲型輸送をGNNで解く", "title": "CFL-aware edge design for graph neural solvers of hyperbolic transport", "url": "https://arxiv.org/abs/2610.33769", "authors": "Jinyoung Jeong ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Jeong, J., Choi, J. B., Cheng, X., Udaykumar, H. S., Choi, S., & Baek, S. S. (2026). CFL-aware edge design for graph neural solvers of hyperbolic transport (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33769", "why": "辺ごとに輸送の向き・長さ・波速を与えると、学習時より大きな時間刻みでも衝撃波がぼやけにくくなることを、構造を固定した比較で示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "衝撃波などの不連続を伴う双曲型偏微分方程式をグラフニューラルネットワーク（GNN）で解くとき、各辺に局所的なCFL数を与える設計の効果を調べた（抄録）。背景：CFL数は1時間刻みで情報が格子間隔に対してどれだけ進むかを表す。", "p3": "構造は固定し、各辺に与える情報だけを、生の辺の表現から方向・長さ・波の速さを順に明示する形まで変えた。同じ材料から計算するので、変わるのは情報の量ではなく形である（抄録）。", "p5": "生の辺の表現にCFLを付け足してもほぼ効果がなく、辺の情報が輸送の相互作用を表しているときに最終ステップの誤差を10.4〜14.4%減らし、時間刻みが大きいほど改善が広がった。改善は解をぼかすのでなく衝撃波付近の振動を抑えることで生じた（抄録）。", "fun": "波や衝撃波の動きをAIで計算すると、時間を大きく進めたときに波の形が崩れやすい。この研究は、AIに「1ステップで波がどれだけ進むか」という目安を辺ごとに渡す工夫を試し、情報を増やすより、渡し方を整える方が誤差を減らせることを示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn38", "rank": 38, "field": "機械学習（Hugging Face）", "headline": "利用者の暗黙の意図を先読みする動画エージェント", "title": "StreamVibe: Proactive Video Agents for Evolving User Intent", "url": "https://arxiv.org/abs/2610.34662", "authors": "Chengzhi Liu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-27", "apa": "Liu, C., Lai, Y., Yang, Y., Liu, Y., Hou, J., Cao, Y., Wang, H., Fan, R., Wang, L., Liu, S., Peng, S., Song, Y., Lin, K. Q., Wang, X. E., Lai, J.-H., & Tang, Y. (2026). StreamVibe: Proactive Video Agents for Evolving User Intent (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34662", "why": "明示・暗黙・変化する意図を含むベンチマークを作り、連続観測から意図を推定して対話を変える能動的な視覚言語モデルを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "利用者が口に出さない意図や刻々と変わる意図をくみ取り、先回りして応答する動画エージェントのため、ベンチマークStreamVibe-Bench、モデルStreamVibe-VL、意図を状態として保つ仕組みStreamVibe-Harnessを提案した（抄録）。", "p3": "明示的・暗黙的・動的な意図にわたる評価用4.1K件と学習用85K件の事例を作り、連続する観測から暗黙の意図を推定するモデルと、階層的な記憶で最新の意図と環境の状態を追う仕組みを作った（抄録）。", "p5": "StreamVibe-VLは一般的な動画理解を保ちながら応答のタイミングと回答の質を他の基準より10.7%高め、Harnessは長い対話での一貫性と適応を高めて先回りの対話を12.3%改善した（抄録）。既存の先回り型モデルは、暗黙・動的な意図の理解と応答の時機の判断に限界があった（抄録）。", "fun": "ウェブサイトで迷っているとき、「次はどこを押せばいい？」と口に出さなくても察して教えてくれるAIがあれば便利だ。この研究は、画面の動きを見続けながら利用者の気持ちの変化をくみ取るAIを作り、応答のタイミングと質を10.7%高めた。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn39", "rank": 39, "field": "機械学習（Hugging Face）", "headline": "仕事を担うエージェントの体系と能力", "title": "Work Agents: Systems, Capabilities, and Optimization", "url": "https://arxiv.org/abs/2610.35845", "authors": "Zishan Xu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-27", "apa": "Xu, Z., Du, E., Gao, M., Yang, C., Shen, J., Chen, Z., Yao, Z., Guo, Y., Lu, Y., Huang, J., Lu, Z., Liu, S., Zheng, Z., Zhang, Y., Zou, D., & Liu, W. (2026). Work Agents: Systems, Capabilities, and Optimization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35845", "why": "基盤モデルと実行環境を組み合わせて検証可能な成果を出す「仕事エージェント」を、仕事の持続性と開放性の2軸で整理し、必要な5つの能力を論じた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "基盤モデルがデジタルな仕事を実行する段階に進んだことを受け、仕事を任されるエージェントを、基盤モデルと実行環境の仕組み（ハーネス）を組み合わせたシステムとして捉える総説を示した（抄録）。", "p3": "仕事の持続性と開放性という2つの軸で作業条件を整理し、デジタルな仕事を課題の範囲と組織のされ方で5つの形に分類したうえで、信頼できる実行に必要な5つの能力群と、モデル・ハーネス・両者の同時最適化を検討した（抄録）。", "p5": "既存の評価法と指標を仕事の成果の観点から分析し、長期の仕事の委任、開かれた環境への適応、仕事の実行と能力向上の相互作用を今後の課題とした（抄録）。総説のため新しい実験結果はない（抄録）。", "fun": "AIは文章を書くだけでなく、ソフトを操作して仕事を最後までこなす段階に入りつつある。この論文は、そうした「働くAI」が仕事を確実にやり遂げるには何が必要かを整理した見取り図だ。仕事の種類を分けて、必要な能力と評価の仕方を体系的にまとめている。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn40", "rank": 40, "field": "機械学習（Hugging Face）", "headline": "精度の目的を加えて採点基準RLの報酬ハックを抑制", "title": "Eat Your Precision: Precision Objective Mitigates Reward Hacking in Rubric-based RL", "url": "https://arxiv.org/abs/2610.33512", "authors": "Hyun Ryu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-27", "apa": "Ryu, H., Kim, J.-H., Xie, Y., Kim, S., Rose, C., & Yang, E. (2026). Eat Your Precision: Precision Objective Mitigates Reward Hacking in Rubric-based RL (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33512", "why": "採点基準の網羅率だけを報酬にすると冗長で誤りを含む回答が増える問題に対し、必要性と事実の正しさを測る精度目的を加えた報酬を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "評価基準（ルーブリック）に基づく報酬での強化学習が、基準を網羅しようとして冗長で誤りの多い回答を生む問題に対し、網羅性に加えて精度を最適化する報酬FORKを提案した（抄録）。", "p3": "回答の各部分が必要で事実として正しいかを、ルーブリックに基づく必要性の得点と事実の正しさの採点器で測り、網羅性（再現率）と精度を同時に最適化した（抄録）。", "p5": "FORKは既存のルーブリック型の強化学習を上回り、網羅性を保ったまま精度を高めて回答を短くした（抄録）。元の方策に対する勝率は、再現率型の報酬の10.6%からFORKの68.0%（RubricHub-Medical）、22.1%から74.1%（HealthBench）に上がった（抄録）。", "fun": "採点基準の項目を全部書けば点が取れるテストだと、答案はどんどん長くなり、余計なことや間違いも混ざる。AIも同じで、この研究は「必要で正しいことだけを書く」ことにも点を与えた。すると医療の質問で元のAIに勝つ割合が10.6%から68.0%に上がった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn41", "rank": 41, "field": "因果推論", "headline": "操作変数でも平均処置効果の符号を推論する", "title": "Informative inference on the average treatment effect with instrumental variables", "url": "https://arxiv.org/abs/2610.33254", "authors": "Luca Locher ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Locher, L., Richardson, T., & Stensrud, M. (2026). Informative inference on the average treatment effect with instrumental variables (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33254", "why": "局所平均処置効果や広すぎる限界に頼らず、平均処置効果の符号が信頼できる仮定のもとで推論できるかを判断する簡単な感度分析を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "操作変数の設定で、平均処置効果（ATE）がある基準値を超えるかを判断するため、ATEに焦点を保ったまま使える簡単な感度分析を提案した（抄録）。", "p3": "ATEの点識別には正当化しにくい強い仮定が必要で、局所平均処置効果（LATE）は政策との関連が疑問視され、ATEの範囲は広すぎることが多い。提案法は、研究者が信頼できる仮定のもとでATEの符号が推論できるかを原理的に判断できるようにし、範囲推定との関係も論じた（抄録）。", "p5": "方法は適用が簡単で、2つの実データの例で価値を示し、Rパッケージivateで実装した（抄録）。数値の結果は抄録にない（未確認）。", "fun": "政策の効果がプラスかマイナスかを知りたいとき、データだけでは答えが出ないことがある。この研究は、「どのくらいの仮定なら認められるか」を変えながら、効果の向きを確実に言える条件を調べる簡単な方法を作った。結論の強さと仮定の強さを天秤にかける発想だ。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn42", "rank": 42, "field": "因果推論", "headline": "外れ値を使って未観測交絡を除く識別", "title": "Extreme proxies for causal identification: deconfounding with outliers", "url": "https://arxiv.org/abs/2610.34002", "authors": "Juraj Bodik ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Bodik, J., & Thams, N. (2026). Extreme proxies for causal identification: deconfounding with outliers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34002", "why": "交絡要因が極端な値をとると別の観測変数も極端になるという仮定のもと、極端な処置の観測を選んで交絡を漸近的に無視できるようにする識別法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "観測されない交絡があるとき、裾の重い変数の極端な値を使えば、操作変数や代理変数がなくても因果効果を識別できることを示した（抄録）。", "p3": "交絡因子が極端な値をとると系内のある観測変数（セーフガード）も高い確率で極端になると仮定し、処置が極端でセーフガードが極端でない観測を選んで交絡を漸近的に無視できるようにした（認証）。必要なグラフ上と分布上の条件を導いた（抄録）。", "p5": "枠組みは有効な操作変数と二重代理の構造を特別な場合として含み、多くの方法で無効な交絡した操作変数も扱える（抄録）。シミュレーションで非線形の交絡と裾の重い場合の性能向上と裾の軽い場合の限界を示し、河川流量の応用で真の流れを復元した（抄録）。", "fun": "原因と結果の関係を調べるとき、見えない第三の要因がじゃまをする。この研究は、まれに起こる極端な値に注目すると、そのじゃまがほとんど消える場面があることを示した。極端な出来事が、ふだんは見えない因果関係を照らし出すという発想が面白い。河川の流量のデータで実際に確かめている。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn43", "rank": 43, "field": "因果推論", "headline": "処置効果の比の回帰調整を直接行う", "title": "Regression Adjustment for Ratios of Treatment Effects in Randomized Experiments", "url": "https://arxiv.org/abs/2610.35666", "authors": "Haruo Kakehi", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Kakehi, H. (2026). Regression Adjustment for Ratios of Treatment Effects in Randomized Experiments (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35666", "why": "分子と分母を別々に調整すると効率を失う問題に対し、変換した結果を交差適合で予測する2段階推定量と疎性を仮定しないLASSO理論を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "完全無作為化実験で処置効果の比を共変量で回帰調整して推定するとき、分子と分母を別々に調整する従来法は効率の目標を外すとし、変換した結果を直接予測する2段階推定量を提案した（抄録）。", "p3": "交差適合で高次元の予測を使いながら最終的な調整は固定次元に保ち、スパース性を仮定せず、観測数より多い共変量と交差検証による罰則の選択を許すLASSOの理論を作った（抄録）。", "p5": "拡張した2段階推定量は基準の調整空間を含むため漸近的に基準の推定量より効率が劣らず、保守的な分散推定量も同じ順序を満たした（抄録）。シミュレーションと実データで既存法より良い性能を示した（抄録）。", "fun": "薬の効果を調べる実験で、「効果の大きさの比」を知りたいことがある。このとき、参加者の年齢などの情報を上手に使うと、同じ人数でもより正確に推定できる。この研究は、その情報の使い方を見直し、比を直接ねらって調整する方がよいことを数学的に示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn44", "rank": 44, "field": "因果推論", "headline": "限界処置効果モデルの本質的異質性を検定", "title": "Testing for Essential Heterogeneity in the Marginal Treatment Effects Model", "url": "https://arxiv.org/abs/2610.34198", "authors": "Yuhao Li ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Li, Y., Mao, M., & Song, X. (2026). Testing for Essential Heterogeneity in the Marginal Treatment Effects Model (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34198", "why": "加法分離を仮定せず、傾向スコアに対する条件付き平均のアフィン性を検定することで本質的な異質性を調べる方法を示し、ウガンダの事業に適用した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "限界処置効果（MTE）モデルで、加法分離性を仮定せずに「本質的な異質性」があるかを検定する方法を提案した（抄録）。背景：本質的な異質性とは、処置を受けるかどうかの選択が効果の大きさと結びついている状態を指す。", "p3": "異質性がなければ結果の条件付き平均が傾向スコアのアフィン関数になることを鋭い検定可能な含意として示し、第1段階の推定誤差にネイマン直交な射影ガウス過程統計量と乗数ブートストラップで検定を実装した（抄録）。", "p5": "モンテカルロ実験でサイズの制御が正確で検出力も良く、データに基づく中央値の規則は条件付けの次元が増えても検出力を保った（抄録）。ウガンダのELAプログラムへの応用では、中間追跡時の志について異質性なしの帰無仮説を棄却した（抄録）。", "fun": "同じ支援策でも、効果の大きい人ほど参加しやすいなら、平均の効果だけを見ても本当の姿は分からない。この研究は、そうした「効果の違いと参加の選び方の結びつき」があるかを、強い仮定なしで確かめる検定を作り、ウガンダの支援プログラムのデータで試した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn45", "rank": 45, "field": "因果推論", "headline": "短いコーチングが中学生の性別観と自信を変える", "title": "The Scope of Coaching: Experimental Evidence on Adolescents' Gender Beliefs, Self-Perceptions, and Preferences", "url": "https://doi.org/10.2139/ssrn.7665421", "authors": "Alessandro Castagnetti ほか", "venue": "SSRN", "date": "2026-10-27", "apa": "Castagnetti, A., Levati, M. V., & Matteazzi, E. (2026). The Scope of Coaching: Experimental Evidence on Adolescents’ Gender Beliefs, Self-Perceptions, and Preferences. https://doi.org/10.2139/ssrn.7665421", "why": "イタリア北部の中学生1,500人超のRCTで、6時間のコーチングが職業の性別適性の認識を弱め、自尊心と自己効力感を高めたことを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "北イタリアの中学生1,500人以上を対象としたランダム化比較試験で、ジェンダーの固定観念を振り返る活動と自己認識や将来の機会に関する活動を組み合わせた6時間のコーチングの効果を調べた（抄録）。", "p3": "コーチングを受けた群と受けない群で、職業やスポーツの向き不向きに関するジェンダー観、自尊心、自己効力感、仕事の属性の重視度、高校の進路の希望を比べた（抄録）。", "p5": "向き不向きのジェンダー観を0.10標準偏差減らし、自尊心と自己効力感を0.14と0.09標準偏差、男性的とされる認知的な仕事の属性の重視度を0.13標準偏差高めた（抄録）。広い性別役割の考え方や高校の進路の希望には効果がなく、男女の効果の差もほとんどなかった（抄録）。", "fun": "「この仕事は男向き、このスポーツは女向き」という思い込みは、進路選びにも影響する。この研究は、イタリアの中学生1,500人以上に6時間のコーチングを行い、思い込みが少し弱まり、自分への自信が少し高まることを確かめた。一方で、高校の進路の希望は変わらなかった。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn46", "rank": 46, "field": "組織行動・心理的安全性", "headline": "強い職業的アイデンティティと沈黙が共存する看護師", "title": "Professional Identity, Self-Silencing and Professional Voice in Nursing: A Qualitative Study of Australian Registered Nurses", "url": "https://doi.org/10.2139/ssrn.7650007", "authors": "Johanna Wilhelmina (Welma) van Schalkwyk ほか", "venue": "SSRN", "date": "2026-10-27", "apa": "van Schalkwyk, J. W. (., Ewens, B., Middlewick, Y., Towell-Barnard, A., & Hopkins, M. (2026). Professional Identity, Self-Silencing and Professional Voice in Nursing: A Qualitative Study of Australian Registered Nurses. https://doi.org/10.2139/ssrn.7650007", "why": "オーストラリアの看護師への質的調査で、強い職業的アイデンティティを持ちながら組織の階層や文化のために声を上げない経験を描いた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "オーストラリアの正看護師が、強い職業的アイデンティティを持ちながら懸念を口に出さない（自己沈黙）経験を、質的研究で探った（抄録）。", "p3": "職業的自己概念と自己沈黙に関する全国横断調査に続く質的段階として、調査の参加者から9人の正看護師と5回のオンライン半構造化セッション（小グループ3回、個別2回）を行い、再帰的テーマ分析で分析した（抄録）。", "p5": "抑えられた職業的正当性、沈黙の文化、自己犠牲の規範など5つのテーマが得られ、アイデンティティは必ずしも発言につながらなかった（抄録）。階層関係、対人的な懸念、限られた心理的安全性、言っても無駄という感覚が発言を妨げ、専門性、経験、指導、支え合う関係が後押しした（抄録）。", "fun": "患者のために働く誇りを強く持つ看護師でも、職場で「おかしい」と声を上げられないことがある。この研究は、9人の看護師への聞き取りから、黙ってしまうのは誇りが弱いからではなく、上下関係や「言っても変わらない」という職場の状況への反応だと示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn47", "rank": 47, "field": "ヒューマンコンピュータインタラクション", "headline": "シロイルカのAIアバターが環境配慮の選択を促す", "title": "Whale You Go Green? Immediate and Longitudinal Effects of Embodied Conversational AI Avatars on Sustainable Behavioral Tendencies and Pro-Environmental Attitudes", "url": "https://arxiv.org/abs/2610.33191", "authors": "Rachel Poonsiriwong ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Poonsiriwong, R., & Pataranutaporn, P. (2026). Whale You Go Green? Immediate and Longitudinal Effects of Embodied Conversational AI Avatars on Sustainable Behavioral Tendencies and Pro-Environmental Attitudes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33191", "why": "576人の無作為化実験で、具現化した会話AIアバターが文章のチャットボットより持続可能な商品の選択を増やし、シロイルカの条件では2か月後にも効果が残ることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "身体を持つ会話型AIのアバターが、持続可能な行動の傾向と環境への態度を高めるかを、576人のランダム化実験で、直後と2か月後について調べた（抄録）。", "p3": "シロイルカ、グレタ・トゥーンベリ、エマ・ワトソン、一般的な人物の4つのアバターを、文字だけのチャットボットと介入なしの対照群と比べた（抄録）。", "p5": "どのアバターも直後の持続可能な商品の選択を対照群とチャットボットより増やし、アバター間の差は有意でなかった（抄録）。補正後に直後の環境への態度を高めたのはシロイルカだけで、2か月後に戻った287人でもシロイルカは対照群より持続可能な商品を多く選んだ（抄録）。", "fun": "環境を守ろうと呼びかけるのは、有名人とかわいいシロイルカのどちらが効くだろうか。576人の実験では、どのアバターも話した直後のエコな買い物を増やした。2か月後に戻ってきた人でも、シロイルカと話した人は対照群より環境にやさしい商品を多く選んでいた。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn48", "rank": 48, "field": "ヒューマンコンピュータインタラクション", "headline": "AIエージェント時代にプルリクエストは何に代わるか", "title": "What Will Replace Pull Requests? Rethinking Software Collaboration for AI Agents", "url": "https://arxiv.org/abs/2610.34933", "authors": "Christoph Treude ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Treude, C., & Baltes, S. (2026). What Will Replace Pull Requests? Rethinking Software Collaboration for AI Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.34933", "why": "2025年10月〜2026年10月の灰色文献50件を分析し、エージェントが大量のプルリクエストを出す時代のソフトウェア協働の代替策と研究上の含意を整理した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "AIのコーディングエージェントが月に数百万件のプルリクエストを出す中、それに代わる仕組みとして実務者が何を提案・採用しているかと、それがソフトウェア工学の実証研究に与える意味を調べた（抄録）。", "p3": "31の組織や個人が公開した灰色文献50件を、挙げた問題、提案・採用した仕組み、プルリクエストの5つの役割（統合、レビュー、根拠、責任、外部からの貢献）のどれを引き継ぐか、示した証拠でコード化した（抄録）。", "p5": "多くの対応は道具の追加や参加の制限などでプルリクエストを何らかの形で残し、採用の報告が最も多いのは制限だった（抄録）。代替を実際に使うと報告したのはZedだけで、エージェントとの対話で行うレビューはプルリクエストのデータに残らず、従来のデータでは変化を捉えられないと指摘した（抄録）。", "fun": "ソフトウェアの共同開発では、変更案を「プルリクエスト」として出し、仲間が確認してから取り込む。ところがAIが大量の変更案を出すようになり、受け付けを制限する開発の場も出てきた。この研究は50件の文書を調べ、この仕組みがどう変わりつつあるかを整理した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn49", "rank": 49, "field": "ヒューマンコンピュータインタラクション", "headline": "視覚障害者が3Dモデリングするための言語記述", "title": "Beyond Being Accurate: Implications for Using Natural Language Descriptions for Accessible 3D Modeling with~Blind and Low Vision Makers", "url": "https://arxiv.org/abs/2610.35562", "authors": "Gene S-H Kim ほか", "venue": "arXiv", "date": "Tue, 27 Oct 2026", "apa": "Kim, G. S.-H., Oskiper, N., Follmer, S., & Hofmann, M. (2026). Beyond Being Accurate: Implications for Using Natural Language Descriptions for Accessible 3D Modeling with~Blind and Low Vision Makers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.35562", "why": "視覚障害のある第一著者の自己エスノグラフィーとWizard-of-Oz研究で、編集を支える3Dモデルの記述の戦略を体系化した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "視覚に障害のある人（BLV）が3Dモデルを編集できるよう、自然言語の説明だけで必要な空間理解を支えられるかを、2つの研究で調べた（抄録）。", "p3": "全盲の筆頭著者が晴眼の参加者12人と説明の戦略の分類を作る自己エスノグラフィーの予備研究と、その戦略を理想的な台本としてBLVの参加者10人に適用するオズの魔法使い法の本研究を行った（抄録）。", "p5": "正確だが不完全な心的モデルを支える説明では変更の指定に足りないという「利用と編集の溝」を見いだし、それが正確さ・完全さ・表現・ナビゲーションの4種類の失敗を生み、正確さだけの評価では検出できないと示した（抄録）。失敗の種類を診断する2段階の評価枠組みを提案した（抄録）。", "fun": "目の見えない人が3Dの立体を作るには、言葉で形を説明してもらう必要がある。見るだけなら正確な説明で足りても、作り変えるには「聞こうとも思わなかった部分」の情報まで要る。この研究は、全盲の研究者自身が参加者と共に、説明のどこが足りなくなるかを丁寧に分類した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}, {"id": "pn50", "rank": 50, "field": "情報システム", "headline": "SNSでの注目が政治的有能さと取り違えられる", "title": "From Visibility to Presumed Competence: Digital Performance and Attribution of Political Aptitude", "url": "https://doi.org/10.2139/ssrn.7663279", "authors": "Pablo Dietrich", "venue": "SSRN", "date": "2026-10-27", "apa": "Dietrich, P. (2026). From Visibility to Presumed Competence: Digital Performance and Attribution of Political Aptitude. https://doi.org/10.2139/ssrn.7663279", "why": "SNSでの成功が統治の能力の証拠とみなされる「推定された有能さ」を概念化し、その置き換えの3つの様態と5つの移行を整理した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたプレプリントの抄録を使用", "preprint": true, "short": true, "p1": "SNSでの成功が宣伝の道具を超えて公職を担う能力の証拠と受け取られる条件を論じ、職務の遂行を示さない指標から能力が推定されることを「推定された能力」と名づけた理論研究（抄録）。", "p3": "注目を集める力、票を得る力、公職の職務を果たす能力を区別し、マナン、ブルデュー、ハーバーマス、ポストマンの議論と情報の近道やデジタル基盤の文献に基づいて論じ、1994〜2026年のブラジルの事例で例示した（抄録）。", "p5": "発信の成功が職務に直接関わる証拠への要求を減らす置き換えを、3つの様式と5つの移行に分類し、任期中も見せ方が有権者による選択の修正を妨げうると論じた（抄録）。有権者の間での頻度は今後の実証課題とし、予測と方法を示した（抄録）。", "fun": "SNSで人気の人は、政治家としても有能だと思われがちだ。でも、注目を集める力と、選挙に勝つ力と、実際に良い政治をする力は別物だ。この論文は、人気が能力の証拠として扱われてしまう仕組みを理論的に整理し、ブラジルの事例で例示した。", "unverified": "本文を読んでいないため、手法の詳細と数値の検証は未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "人とLLMの討議は情報の結びつけ方が違う", "title": "Semantic network sharing in human versus LLM discussion groups", "url": "https://doi.org/10.1016/j.chbah.2026.100414", "authors": "Yoshiko Arima", "venue": "Computers in Human Behavior Artificial Humans", "date": "2026-10-23", "apa": "Arima, Y. (2026). Semantic network sharing in human versus LLM discussion groups. Computers in Human Behavior: Artificial Humans, 10, 100414. https://doi.org/10.1016/j.chbah.2026.100414", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、OpenAlex経由で得た抄録を使用", "preprint": false, "p1": "隠れたプロファイル課題での議論で、情報の意味ネットワークがメンバー間でどう共有されるかを、人間の模擬陪審の51グループと、人間の行動統計に較正したLLMのグループ（5条件、各24セッション）で比べた（抄録）。", "p2": "背景：隠れたプロファイル課題は、正解に必要な情報がメンバーに分散して配られ、共有されていない情報を議論で持ち寄れるかが問われる集団意思決定の課題である。", "p3": "共有されていない情報が他のメンバーに取り込まれる頻度（取り込み率）と、課題資料の語を節点とする意味ネットワークで異なるメンバーの語を結ぶ辺の割合（メンバー間の辺の比率）を、議論の全体にわたって計算した（抄録）。", "p4": "人間では辺の比率と解決の道筋への到達度の関係と段階ごとの推移を調べ、LLMでは記憶の保持の制約、情報の配置、行動の較正、生成モデルを変えて人間と比べた（抄録）。", "p5": "人間では辺の比率が高いグループほど到達度が高く（ρ=+.35、n=50）、比率は共有の段階から決定の段階へ.24→.50→.56と上がった（抄録）。LLMは人間より多くの情報を取り込み、比率と到達度の両方で人間を上回ったが、記憶の保持を制約すると人間の水準にそろった（抄録）。一方、辺のうち資料の語どうしを結ぶものは人間の88%に対しLLMでは45〜48%で、この差はどの条件でも変わらなかった（抄録）。", "p6": "人間では他者固有の情報を受け取った後に共通の情報へ戻る傾向が議論の初期に見られたが、LLMでは5つの条件のどれでも見られなかった（抄録）。解釈：LLMの集団は成績の指標では人間に近づけられても、語の出どころと議論の進み方は人間と異なり、人間の代わりに使うには注意が要る。", "fun": "話し合いで正解にたどり着くには、各自が持つ情報を出し合い、つなげることが大切だ。この研究は、人間の模擬陪審とAIのグループの話し合いを比べ、AIの方が情報をよくつなげて正解に近づいたが、AIの会話の語の半分以上は資料にない言葉だったことを示した。成績は似せられても、話の中身は人間と違うのが面白い。", "unverified": "本文を読んでいないため、使ったLLM、較正の方法、5つの条件の詳細は未確認。"}}, {"id": "jr02", "rank": 2, "headline": "口コミ8万件で顧客満足の非線形関数を推定", "title": "Interpretable machine learning for customer satisfaction optimization", "url": "https://doi.org/10.1108/ijchm-01-2026-0089", "authors": "Xin Li ほか", "venue": "International Journal of Contemporary Hospitality Management", "date": "2026-10-27", "sjr": 3.116, "citescore": 22.1, "citescore_year": "2025", "apa": "Li, X., Shao, Q., Li, G., & Law, R. (2026). Interpretable machine learning for customer satisfaction optimization. International Journal of Contemporary Hospitality Management, 1–24. https://doi.org/10.1108/ijchm-01-2026-0089", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "外食の体験が顧客満足の判断にどう変わるかについて、三要因理論の属性の分類が市場セグメント間で共有されつつ、満足との関係がセグメントごとに異なるかを、口コミの機械学習で調べた（抄録）。", "p2": "背景：三要因理論は、サービスの属性を、欠けると不満を生む基本要因、満足と不満の両方に効く性能要因、あると満足を高める興奮要因に分ける。", "p3": "価格帯、料理の種類、店の種類で分けた9つのセグメントのYelpの飲食店の口コミ82,105件から、BERTによる側面の抽出とクラスタリングで属性と感情の組を取り出し、アンサンブルモデルで非線形の予測関係を推定してSHAPで分解した（抄録）。", "p4": "SHAPの分解から属性の分類、セグメント別の満足の関数、改善の優先度の診断を行い、影響の非対称性の閾値を変えた場合と罰則–報酬の対比分析の手順でも確かめた（抄録）。", "p5": "基本要因が支配的なパターンが共通に見られる一方、罰則と報酬の大きさ、満足の関数の形、診断上の優先度はセグメントによって異なった（抄録）。この傾向は閾値や手順を変えてもおおむね安定で、共通の分類が不変の満足の関係を意味しないことを示した（抄録）。", "p6": "解釈：口コミの評価から推定した予測上の関係で、属性を改善すれば満足が実際に変わるという因果は示していない。Yelpの利用者と9つのセグメントへの限定も一般化の範囲を狭める。具体的な属性名と大きさは抄録にない（未確認）。", "fun": "飲食店では、たとえば清潔さが欠けると客は怒るが、あっても特に褒められない。こうした要素ごとの効き方の違いを、82,105件の口コミからAIで読み解いた研究だ。価格帯や料理の種類によって、同じ「基本」の要素でも不満につながる強さが違っていた。店の種類に合わせた改善の優先順位が見えてくる。", "unverified": "本文を読んでいないため、抽出した属性の一覧とセグメントごとの数値は未確認。"}}, {"id": "jr03", "rank": 3, "headline": "PCAOB検査の指摘でのれん減損が増える", "title": "Do PCAOB Inspection Deficiencies Related to Management Review Controls Affect Financial Reporting Decisions? Evidence From Goodwill Impairments", "url": "https://doi.org/10.1111/1911-3846.70098", "authors": "Kenneth L. Bills ほか", "venue": "Contemporary Accounting Research", "date": "2026-10-27", "sjr": 3.686, "citescore": 7.3, "citescore_year": "2025", "apa": "Bills, K. L., Hogan, C. E., & Puccia, J. E. (2026). Do PCAOB Inspection Deficiencies Related to Management Review Controls Affect Financial Reporting Decisions? Evidence From Goodwill Impairments. Contemporary Accounting Research. https://doi.org/10.1111/1911-3846.70098", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "米国の公開会社会計監視委員会（PCAOB）の検査で、経営者による見積もりの見直しの統制（MRC）の不備を指摘された監査人の顧客企業が、のれんの減損をより計上するかを調べた（抄録）。", "p2": "PCAOBの検査は監査人の行動に影響するとされてきたが、監査を受ける企業の財務報告の判断にまで影響するかは十分に分かっていない（抄録）。背景：のれんの減損の判断は経営者の見積もりに依存し、その見直しの手続きが監査の重点になっている。", "p3": "のれんの減損の場面を使い、監査人が受けたのれんのMRCに関する検査の不備の数と、顧客企業の減損の計上の関係を推定した（抄録）。", "p4": "不備が内部統制の設計や運用の変更につながりやすい場合（繰り返しの不備、MRCの精度に関する不備）と、のれんに関係しないMRCの不備でも関連があるかを調べた（抄録）。", "p5": "監査人ののれんのMRCに関する不備が多いほど顧客企業がのれんの減損を計上しやすく、関連は繰り返しの不備や精度に関する不備で強かった（抄録）。のれんと無関係なMRCの不備でも減損の可能性が高まる証拠がいくらかあり、MRCの監査の改善が財務報告に広く影響しうることを示した（抄録）。", "p6": "著者は、検査のフィードバックがMRCの監査と評価の変化を通じて報告の結果に影響する経路を示したとする（抄録）。解釈：監査人と顧客の組み合わせの選択による内生性への対処と、効果の大きさは抄録からは分からない（未確認）。", "fun": "会社が買収で払った「のれん」の価値が下がったら、帳簿に損を出す（減損）必要がある。でもその判断は会社の見積もり任せになりがちだ。この研究は、監査法人が規制当局の検査で「見直しの手順の確認が甘い」と指摘されると、その顧客企業がのれんの損を計上しやすくなることを示した。", "unverified": "本文を読んでいないため、標本の期間・企業数と効果の大きさは未確認。"}}, {"id": "jr04", "rank": 4, "headline": "確率密度発展法で杭スラブ構造の信頼性を評価", "title": "Copula/random field/probability density evolution method analysis of pile–slab structures with soil spatial variability", "url": "https://doi.org/10.1680/jgeen.26.00071", "authors": "Liang Huang ほか", "venue": "Proceedings of the Institution of Civil Engineers - Geotechnical Engineering", "date": "2026-10-27", "citescore": 5.7, "citescore_year": "2025", "apa": "Huang, L., Zhu, M., Xu, S., Qin, C., & Qie, X. (2026). Copula/random field/probability density evolution method analysis of pile–slab structures with soil spatial variability. Proceedings of the Institution of Civil Engineers - Geotechnical Engineering, 1–34. https://doi.org/10.1680/jgeen.26.00071", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "複雑な地質の地域にある杭–スラブ構造の地震時の信頼性を、地盤パラメータの依存性、空間的なばらつき、確率的な地震動を同時に考えて評価するため、コピュラ・確率場・確率密度発展法（PDEM）を組み合わせた変位に基づく枠組みを作った（抄録）。", "p2": "杭–スラブ構造の信頼できる耐震評価には、地盤の強度パラメータの相関、空間的なばらつき、地震動のランダム性を合わせて考える必要がある（抄録）。", "p3": "粘着力と内部摩擦角の42組の測定値から、ペアのブートストラップ、ベイズ情報量規準、代替モデルとの感度比較で不確かさを評価し、ワイブル分布、切断正規分布、フランク・コピュラを基準のモデルに選んだ。指数型の空間相関を持つ相互相関の確率場を多尺度の有限要素モデルに要素ごとに割り当て、物理的な確率モデルで重み付きの地震動100本を作った（抄録）。", "p4": "PDEMで、5つの杭頭変位の基準と3つの不確かさの表し方の下で初通過の使用性の信頼度を評価し、収束の解析と1000回のモンテカルロ法との比較で計算の設定を確かめた（抄録）。", "p5": "決定論的な解析では接続橋脚が変位の臨界の位置で、0.6gで最大変位68.4 mm、連続橋脚より18.6 mm大きかった（抄録）。相互相関の確率場のモデルでは、信頼度は杭頭の変位角の閾値1.2%で98.97%、0.4%で27.15%で、最も厳しい基準では地震のランダム性だけを考えたモデルより18.62ポイント低かった（抄録）。", "p6": "著者は、地盤の空間的なばらつきを無視すると、採用した仮定のもとで変位に基づく使用性の信頼度を過大評価しうるとする（抄録）。解釈：結果は42組の測定値と特定の構造に基づき、他の地盤や構造形式への一般化は確かめられていない。", "fun": "杭で支えた床（杭–スラブ構造）の安全性は、地面の強さが場所ごとにばらつくことで変わる。この研究は、そのばらつきと地震の揺れの不確かさを同時に計算する方法を組み合わせ、ばらつきを無視すると、最も厳しい基準で「問題なく使える確率」を18.62ポイントも高く見積もってしまうことを示した。", "unverified": "本文を読んでいないため、構造の寸法、有限要素モデルの詳細、相関長の設定は未確認。"}}, {"id": "jr05", "rank": 5, "headline": "入力が未知でも損傷を同定する物理LSTM", "title": "Physics-informed semi-supervised LSTM autoencoder framework for force-agnostic structural health monitoring", "url": "https://doi.org/10.1007/s13349-026-01150-w", "authors": "Smriti Sharma ほか", "venue": "Journal of Civil Structural Health Monitoring", "date": "2026-10-26", "citescore": 8.0, "citescore_year": "2025", "apa": "Sharma, S., Leander, J., & Karoumi, R. (2026). Physics-informed semi-supervised LSTM autoencoder framework for force-agnostic structural health monitoring. Journal of Civil Structural Health Monitoring, 16(6). https://doi.org/10.1007/s13349-026-01150-w", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "出版社のPDF本文（序論、方法§3、数値検証§4、実験検証§5、結論§6）を読んだ。数式の一部はPDFからの抽出で読めなかった", "preprint": false, "p1": "未知で時間変化する外力のもとでも、加速度だけの計測から構造の損傷を検出・位置特定・定量化するため、物理法則を組み込んだLSTMオートエンコーダーを半教師ありで学習する枠組みを提案した（抄録）。", "p2": "モデルに基づくSHMは解釈性と物理的な整合性があるが、材料やモデルの不確かさに弱く、境界条件や外力の情報を要することが多い。データ駆動の方法は柔軟だが、大量のラベル付きデータを要し、物理的な整合性を欠くことがある（抄録）。", "p3": "LSTMの符号化器が計測した加速度から変位と健全度指標（剛性の倍率）を推定し、物理に基づく復号器が出力を注入した状態空間の運動方程式（状態観測器の考え方）を学習の制約として課した。少数の網羅的でないラベル付きデータで最適化を導く半教師ありの学習とした（抄録、§3）。", "p4": "10自由度のせん断型建物の数値実験（1000サンプル、訓練25%）で、外力を与えたPINNや純粋なデータ駆動の基準と比べ、ノイズ、データ量、センサーの数を変えて調べた。4層の実験室規模の骨組みで筋交いを1本・2本外し、推定した剛性の変化を測定した固有振動数の変化と照合した（§4–5）。", "p5": "数値実験では提案法の正解率は0.917、F1は0.807で、外力既知のPINN（適合率0.420）より誤検出が大幅に少なく、5%のノイズでもR²は0.818を保った（§4.3–4.4）。実験では筋交い1本の除去で2層の剛性が約12.1%、2本で3層が約23.9%低下と推定され、1次と2次の固有振動数の低下（2本で−11.78%と−19.43%）と傾向が整合した（§5.3–5.4）。", "p6": "著者は、検証が10自由度のせん断型建物と小規模な実験室の骨組みに限られ、損傷の程度が小さいと複数の同時損傷の位置特定が難しくなることを限界に挙げ、大規模で複雑な構造と現場での適用を今後の課題とする（§6）。", "fun": "橋やビルの健康診断では、ふつう「どんな力で揺らしたか」を知る必要がある。この研究は、揺らした力が分からなくても、揺れ方の記録と物理の法則を組み合わせたAIで、どの階がどれだけ弱ったかを推定した。模型の建物で筋交いを1本外すと、2層の硬さが約12.1%下がったと見抜いた。", "unverified": "センサーを減らした場合の結果（§4.7）と計算費用の比較の数値は一部しか確認していない。"}}, {"id": "jr06", "rank": 6, "headline": "沈降する粒子群をVlasov–Stokes式で近似", "title": "Sedimentation of particles with very small inertia II: Derivation, Cauchy problem and hydrodynamic limit of the Vlasov–Stokes equation", "url": "https://doi.org/10.4171/jems/1813", "authors": "Richard M. Höfer ほか", "venue": "Journal of the European Mathematical Society", "date": "2026-10-27", "sjr": 3.687, "citescore": 4.9, "citescore_year": "2025", "apa": "Höfer, R. M., & Schubert, R. (2026). Sedimentation of particles with very small inertia II: Derivation, Cauchy problem and hydrodynamic limit of the Vlasov–Stokes equation. Journal of the European Mathematical Society. https://doi.org/10.4171/jems/1813", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "ストークス流の中で重力により沈降するN個の同じ半径Rの球形粒子について、慣性がごく小さい場合に、粒子数が無限大・半径が0に近づく平均場の極限で、N粒子系の時間発展がブラソフ–ストークス方程式でよく近似されることを証明した数学論文（抄録）。", "p2": "シリーズの第1部（Duke Math. J., 2025）は慣性を無視した輸送–ストークス方程式を扱った。本論文は小さな慣性を考慮したブラソフ–ストークス方程式を扱い、誤差の評価を改善した（抄録）。", "p3": "粒子は滑りなし境界条件と一定の重力に従い、運動はニュートンの法則で表した。証明は相対エネルギーの評価に基づき、2-ワッサースタイン距離での新しい安定性評価を示し、ラグランジュ的な方法とエネルギー散逸の解析を組み合わせて、任意に小さな慣性で一様な安定性評価を得た（抄録）。", "p4": "経験的な粒子密度が誤差を除いて形式的にブラソフ–ストークス方程式を満たすことに着目し、第1部の結果による粒子配置の一様な制御を使って、対応する安定性評価が粒子系にも成り立つことを示した（抄録）。", "p5": "N粒子系の近似の誤差評価が改善され、方程式のコーシー問題（初期値問題）と、慣性が消える極限での輸送–ストークス方程式への収束についての既存の結果も改善された（抄録）。", "p6": "解釈：結果は同じ大きさの球形粒子、平均場のスケーリング、3次元の全空間という理想化された設定での厳密な数学的結果である。誤差の具体的な次数や条件は抄録にない（未確認）。", "fun": "水の中で砂粒がゆっくり沈むとき、粒どうしは周りの水の流れを通じて影響し合う。この論文は、粒がとても多く、とても小さく、わずかに慣性を持つとき、ばらばらな粒の動きを一つの方程式の「雲」として扱ってよいことを厳密に証明した。目に見える現象の裏にある数学の土台を固める仕事だ。", "unverified": "本文を読んでいないため、定理の正確な仮定と誤差の評価の形は未確認。"}}, {"id": "jr07", "rank": 7, "headline": "エージェント型AIの人事は組織を硬直させる", "title": "The Efficiency Trap of Agentic AI in Human Resource Management", "url": "https://doi.org/10.1002/hrm.70106", "authors": "Miles M. Yang", "venue": "Human Resource Management (USA)", "date": "2026-10-27", "sjr": 4.598, "citescore": 15.0, "citescore_year": "2025", "apa": "Yang, M. M. (2026). The Efficiency Trap of Agentic AI in Human Resource Management. Human Resource Management. https://doi.org/10.1002/hrm.70106", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "人事管理（HRM）の実行を自律的に動くエージェント型AIに任せることが、短期的な効率と引き換えに組織の回復力を損なう「効率の罠」を、ワイクの緩やかな結合の理論に基づいて論じた概念論文（抄録）。", "p2": "エージェント型AIはHRMをデータに基づく支援から自律的な実行へと変え、組織は人による実施のばらつきをなくすためにこうした再帰的なワークフローを導入している（抄録）。", "p3": "著者らは、人事の実行をエージェント型AIに委ねるとアルゴリズムによる密な結合が生まれ、すぐに高い適合をもたらす一方で、戦略的なゆとりが取り除かれて構造が硬直化すると論じた（抄録）。", "p4": "現場の管理者が意味づけ（センスメイキング）によって衝撃を吸収する緩衝の役割と、道具的な合理性に支配されたAIのワークフローが欠く価値合理性を対比した（抄録）。", "p5": "構造の硬直化は複合的な危機（ポリクライシス）での組織の回復力を損ない、人の管理者は系全体の衝撃を吸収する重要な緩衝になると主張し、機械による一貫性と長期の適応力を保つ人の管理責任を両立させるガバナンスの枠組みを提案した（抄録）。", "p6": "解釈：理論的な主張で、実証的なデータによる検証は抄録に示されていない。ガバナンスの枠組みの具体的な内容は抄録にない（未確認）。", "fun": "人事の仕事をAIに任せると、ルールどおりに速く正確に進む。でもこの論文は、その「ぴったりさ」こそが落とし穴だと論じる。人の管理者が持つ「あそび」や臨機応変さがなくなると、想定外の危機が来たときに組織が折れやすくなるからだ。効率と柔軟さの綱引きを考えさせられる。", "unverified": "本文を読んでいないため、提案された枠組みの構成要素と事例の有無は未確認。"}}, {"id": "jr08", "rank": 8, "headline": "心理社会的職場環境と若年の障害年金", "title": "Psychosocial work environment and the risk of disability pension among 1.2 million individuals with and without psychiatric diagnoses: a Danish nationwide register-based cohort study", "url": "https://doi.org/10.1007/s00127-026-03224-y", "authors": "Jeppe Karl Sørensen ほか", "venue": "Social Psychiatry and Psychiatric Epidemiology", "date": "2026-10-26", "sjr": 1.584, "citescore": 7.7, "citescore_year": "2025", "apa": "Sørensen, J. K., Burr, H., Hoff, A., Lallukka, T., Melchior, M., Pedersen, J., Rod, N. H., Rugulies, R., Stansfeld, S., & Madsen, I. E. (2026). Psychosocial work environment and the risk of disability pension among 1.2 million individuals with and without psychiatric diagnoses: a Danish nationwide register-based cohort study. Social Psychiatry and Psychiatric Epidemiology. https://doi.org/10.1007/s00127-026-03224-y", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "出版社のPDF本文（方法、結果の要約、考察の強みと限界、結論）を読んだ。表の個々の値は一部のみ", "preprint": false, "p1": "心理社会的な労働条件が45歳未満での障害年金の受給の危険に寄与するか、また精神科の診断の有無によって関連が異なるかを、デンマークの全国登録データで調べた（抄録）。", "p2": "背景：若い年齢での障害年金の受給は本人の生活と社会保障の両方に大きな負担で、職場の条件は改善しうる要因として注目される。精神科の診断を持つ人は受給の基礎的な危険が高い（抄録）。", "p3": "1995〜2015年に労働市場に入った被雇用者1,214,772人のデンマーク職業生活コホートで、職業の曝露行列により量的な要求、仕事での裁量、仕事の緊張、感情的な要求、職場の暴力を毎年割り当て、精神科の診断（ICD-10のF00–F99）と障害年金は全国登録から特定した（抄録）。", "p4": "暦の時間を時間軸とするコックス比例ハザードモデルで年齢と共変量を調整し、精神科の診断の有無と性別で層別して、交互作用を検定した（抄録）。", "p5": "障害年金の発生率は、病院で記録された精神科の診断がある人で1万人年当たり女性48.4、男性64.2と、ない人（5.6と5.0）よりはるかに高かった（抄録）。診断のない人では仕事での裁量の低さなどが受給と関連し（ハザード比は女性1.58、男性1.69）、診断のある人では関連は弱いかなかった（抄録）。", "p6": "著者は、職業の曝露行列は職業内の平均で指導や支援など個人の違いを捉えられないこと、病院で記録された診断だけでプライマリケアの治療を捉えられないことを限界に挙げ、診断のある人の弱い関連が本当に小さい関連なのか誤分類や交絡によるのかは区別できないとする（考察）。基礎的な危険が高いため、相対的な効果が小さくても絶対的な影響は大きくなりうると指摘する（考察）。", "fun": "若いうちに働けなくなり障害年金を受け取る人は、職場の環境にも左右されるのだろうか。デンマークの120万人以上を追跡すると、心の病気の診断がない人では「仕事のやり方を自分で決められない」職場ほど危険が高かった。ところが診断がある人では、職場の条件との関係ははっきりしなかった。", "unverified": "量的な要求、感情的な要求、暴力など他の労働条件ごとのハザード比は確認していない。"}}, {"id": "jr09", "rank": 9, "headline": "ミニ・パブリックス参加で討議への自信が高まる", "title": "Gaining confidence – Examining the effects of participation in deliberative mini-publics on self- and other-regarding democratic beliefs", "url": "https://doi.org/10.1177/00323217261493272", "authors": "Frederik Pfeiffer ほか", "venue": "Political Studies", "date": "2026-10-27", "sjr": 1.989, "citescore": 8.2, "citescore_year": "2025", "apa": "Pfeiffer, F., Daw, T. M., & Telemo, V. (2026). Gaining confidence – Examining the effects of participation in deliberative mini-publics on self- and other-regarding democratic beliefs. Political Studies. https://doi.org/10.1177/00323217261493272", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "熟議型のミニ・パブリック（無作為に選ばれた市民の討議会）への参加が、政治的な対話への自信、すなわち自分の能力への信頼、他者の民主的な能力への信頼、反対意見への寛容を高めるかを、スウェーデンの3つの事例で調べた（抄録）。", "p2": "ミニ・パブリックの参加効果の研究は政治的な意見や知識に集中し、対話への自信への効果はあまり分かっていない。寛容と民主主義への信頼の低下が懸念される中、ダールの強い平等の原理に従えば、市民が他者も貢献できると信じることが重要だと著者らは論じる（抄録）。", "p3": "2024年のスウェーデンの3つのミニ・パブリックで参加の前後に調査を行い、内的な政治的有効性感覚、他者の民主的な能力への信頼、反対意見への寛容を測った（抄録）。", "p4": "参加者自身、他の参加者、一般の人々のそれぞれへの評価の変化を調べ、討議の時間と議題の政治化の程度で事例を比べた（抄録）。", "p5": "開始時の値が高かったにもかかわらず、参加者自身の能力と他の参加者の能力への信頼は有意に高まった（抄録）。一般の人々への認識と意見の不一致への寛容への効果はまちまちで、討議の時間が長く議題がより政治化していた事例で効果が強かった（抄録）。", "p6": "著者は、効果は設計、期間、文脈に依存しうるとする（抄録）。解釈：前後比較で対照群がないため時間の経過などによる変化と区別しにくく、3事例の比較で設計の効果を断定するのは難しい。参加人数は抄録にない（未確認）。", "fun": "くじで選ばれた普通の市民が集まり、社会の問題をじっくり話し合う「ミニ・パブリック」が各国で広がっている。スウェーデンの3つの会議で参加の前後に調べると、参加者は「自分も、隣の人も、ちゃんと議論できる」と感じるようになっていた。話し合う時間が長いほど効果も強かった。", "unverified": "本文を読んでいないため、参加人数、各事例の議題、効果の大きさは未確認。"}}, {"id": "jr10", "rank": 10, "headline": "曲線ロッキング橋の多変量地震フラジリティ", "title": "Multivariate Seismic Fragility Analysis of Curved Rocking Bridges Using Active Learning‐Enhanced Surrogate Modeling", "url": "https://doi.org/10.1002/eqe.70322", "authors": "Xueqi Zhong ほか", "venue": "Earthquake Engineering and Structural Dynamics", "date": "2026-10-27", "sjr":
