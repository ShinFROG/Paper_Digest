icro transformation which conserves physical quantities. Applied Mathematical Modelling, 164, 117394. https://doi.org/10.1016/j.apm.2026.117394", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Applied Mathematical Modellingの抄録（OpenAlex登録）を使用し、本文は入手できず", "preprint": false, "p1": "コッセラ連続体の有限要素法による巨視的な記述から、個別要素法による粒子の集まりの微視的な記述へ、質量・運動量・角運動量・運動エネルギー・力の仕事率を保存して切り替える変換の枠組みを示した（抄録）。", "p2": "有限要素法は広い領域を扱えるが大変形が苦手で、個別要素法は大変形に向く一方、要素の数とともに計算量が増える。タイヤと土の相互作用のように大変形が狭い領域だけに起き、その領域が時間とともに動く問題では、有限要素から粒子への変換が必要になる（抄録）。", "p3": "平均化した連続場の量に基づくコッセラ連続体（回転の自由度を持つ連続体）を有限要素で解き、指定した領域でそれを粒子の集まりに変換する手順を物理量が保存されるように定め、各段階の手法を2次元の例題で示した（抄録）。", "p4": "評価の対象は、変換の前後で保存されるべき物理量（質量、運動量、角運動量、運動エネルギー、力の仕事率）の一致である（抄録）。定量的な誤差の指標は抄録には示されていない。", "p5": "変換の手順と使った技法を2次元の例題で示し、巨視的な記述から微視的な記述への移行を、物理量を保存して実現できることを示した（抄録）。", "p6": "著者は、有限要素から個別要素へ局所的に切り替える基準（大変形、ひずみ、応力など）は扱っていないと明記している（抄録）。解釈：3次元への拡張と、粒子から連続体への逆の変換は抄録では確かめられない。", "fun": "砂や土をコンピュータで計算するとき、「なめらかな粘土」とみなす方法と、「一粒一粒の集まり」とみなす方法があります。前者は広い範囲を速く計算でき、後者は崩れたり大きく変形したりする様子が得意です。この研究は、必要な場所だけ粘土を粒に置き換え、そのときに重さや勢い、エネルギーが勝手に増えたり減ったりしないようにする方法を作りました。二つの見方の橋渡しが面白いところです。", "unverified": "抄録のみ読んだ。粒子の配置の決め方と、保存の精度の数値は未確認。"}}, {"id": "jr15", "rank": 15, "headline": "社会的支援が社会的幸福を介し共同体感覚へ", "title": "Social support and social wellbeing in relation to sense of community among adults in an urban–rural area of southern Peru: a network and latent factor analysis approach", "url": "https://doi.org/10.3389/fpsyg.2026.1877120", "authors": "Julio Cesar Huamani-Cahua ほか", "venue": "Frontiers in Psychology", "date": "2026-11-04", "citescore": 7.0, "citescore_year": "2025", "apa": "Huamani-Cahua, J. C., Ojeda-Flores, E., Alvarez Salinas, L. R., Nieto Bolaños, N. V., Rubin Roque, A. L., & Ojeda-Flores, M. A. (2026). Social support and social wellbeing in relation to sense of community among adults in an urban–rural area of southern Peru: a network and latent factor analysis approach. Frontiers in Psychology, 17. https://doi.org/10.3389/fpsyg.2026.1877120", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Frontiers in Psychology掲載のPDF本文（方法の尺度の説明、限界と提言の節）と抄録の結果を読んだ", "preprint": false, "p1": "ペルー南部の都市-農村地域の成人1,613人で、知覚された社会的支援が社会的well-beingを介して共同体感覚と結びつく完全媒介を示し、その構造が都市と農村で変わらないことをSEMとネットワーク分析で示した（抄録、結果）。", "p2": "社会的なつながりの弱まりを背景に、共同体感覚が集団のwell-beingの鍵として注目されているが、それを育む心理社会的な要因はよく分かっていなかった（抄録、序論）。", "p3": "非実験の横断的な相関研究で、社会的支援はVauxらの尺度のスペイン語版（15項目、家族・友人・他者の3因子）、社会的well-beingはKeyesの尺度、共同体感覚はKrause Jacobの枠組みに基づく9項目の一次元尺度（α=0.95）で測り、確認的因子分析で構造を確かめた（方法）。SEMで媒介と都市・農村の多群分析を行い、偏相関ネットワーク（EBICglasso）とネットワーク比較検定で不変性を調べた（抄録）。", "p4": "対象は平均36.7歳（SD 12.5）の成人1,613人で、調査員が都市と農村で戸別訪問により回答を集めた（方法）。", "p5": "社会的支援は社会的well-beingと正に関連し（β=0.248）、社会的well-beingは共同体感覚と正に関連した（β=0.316）。間接効果β=0.078、直接効果β=0.027の完全媒介で、共同体感覚の分散の10.5%を説明した。多群分析は都市と農村の構造の不変性を示し、ネットワークでは機能的な社会的統合が最も中心的な節点、友人からの支援が主な関係の経路だった（抄録）。", "p6": "著者は、横断研究で因果を確定できないこと、戸別訪問の便宜的な標本で日中に家にいない人が過小に代表されうること、都市と農村の母集団を代表しないことを限界とする（限界と提言）。解釈：説明率10.5%は小さく、共同体感覚の多くはほかの要因で決まる。", "fun": "「この地域の一員だ」と感じられることは、孤独を防ぎ暮らしを支えます。ペルーの調査では、家族や友人に支えられている人ほど社会の中でうまくやれていると感じ、その感覚が地域への帰属感につながっていました。都市でも農村でも同じ仕組みが見られ、とくに友人からの支えが要だった点が面白いところです。", "unverified": "社会的well-beingの尺度の項目数と、ネットワークの中心性の数値は確認していない。"}}, {"id": "jr16", "rank": 16, "headline": "生成AIは知識の多様化と収斂の両方を招く", "title": "The generative AI duality trap: a knowledge governance perspective on knowledge diversity and epistemic convergence in AI-augmented organisations", "url": "https://doi.org/10.1108/jkm-05-2026-1037", "authors": "Hui Chun Chan ほか", "venue": "Journal of Knowledge Management", "date": "2026-11-04", "sjr": 2.382, "citescore": 17.6, "citescore_year": "2025", "apa": "Chan, H. C., & Chu, K. M. (2026). The generative AI duality trap: a knowledge governance perspective on knowledge diversity and epistemic convergence in AI-augmented organisations. Journal of Knowledge Management, 1–19. https://doi.org/10.1108/jkm-05-2026-1037", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Journal of Knowledge Managementの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "生成AIの利用が組織によって知識の多様化にも収斂にもつながる理由を、技術ではなく知識統治の設計に求める枠組み（生成AIの二面性の罠）を示した（抄録）。", "p3": "組織調査（n=67）、従業員の測定（n=1,247）、SBERTによる意味的多様性の指標を組み合わせ、3つの制度レジームにわたる9つの仮説をPLS-SEMと多群分析で検証した（抄録）。", "p5": "知識統治は人とAIの相互作用の質を通じて多様性と関連した。透明性、分散的なアクセス、AIリテラシーへの投資は批判的な関与と関連し、それが知覚された多様性と意味的多様性に関連した。制度レジームは3つの経路すべてを調整し、市場主導で強く国家主導で弱かった（抄録）。", "fun": "同じ生成AIを使っても、ある会社では社員のアイデアが多様になり、別の会社では皆が似た考えに寄っていきます。この研究は、その分かれ道がAIの性能ではなく、情報の透明さや誰でも使えるかといった使い方のルールにあると示しました。文章の意味の多様さをAIで測って確かめている点も面白いところです。", "unverified": "経路係数の大きさと、3つの制度レジームの具体的な区分は抄録では未確認。"}}, {"id": "jr17", "rank": 17, "headline": "研究者が仮想社会に入り込む生成エージェント実験", "title": "Computational Multi-Agent Society Experiments: Social Modeling Framework Based on Generative Agents", "url": "https://doi.org/10.1145/3860291", "authors": "Hanzhong Zhang ほか", "venue": "ACM Transactions on Social Computing", "date": "2026-11-05", "apa": "Zhang, H., Huang, M., & Wang, J. (2026). Computational Multi-Agent Society Experiments: Social Modeling Framework Based on Generative Agents. ACM Transactions on Social Computing. https://doi.org/10.1145/3860291", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "ACM Transactions on Social Computingの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "研究者がシミュレーションの中に役割を持って入り込み、介入できる生成エージェント型の社会実験の枠組みCMASEを提案した（抄録）。", "p3": "シミュレーションを模擬的なエスノグラフィーの現場とみなし、研究者を外部の操作者から内部の参加者に変える。リアルタイムの介入、統制された計算実験と観察・インタビューの組み合わせ、介入の軌跡と社会的な反応の探索の3つを目指し、知覚・記憶・感情を持つエージェントで実現する（抄録）。", "p5": "取得できた抄録の範囲は枠組みの設計と目標が中心で、検証の結果は含まれていない（抄録）。", "fun": "AIの住人が暮らす仮想の町を作る研究はいくつもありますが、研究者は外から設定をいじるだけでした。この研究は、研究者自身が町の住人の一人として入り込み、話しかけたり出来事を起こしたりして反応を観察できるようにしました。フィールドワークを仮想社会で行う、という発想が面白いところです。", "unverified": "抄録は途中で切れており、エージェントの実装と検証の結果は未確認。"}}, {"id": "jr18", "rank": 18, "headline": "擬人的な言葉遣いのチャットボットと口コミ", "title": "Chatbot Schema Activation: When Anthropomorphic Language Leverages Word-of-Mouth", "url": "https://doi.org/10.1177/14413582261499475", "authors": "Mai Nguyen ほか", "venue": "Australasian Marketing Journal", "date": "2026-11-05", "citescore": 11.5, "citescore_year": "2025", "apa": "Nguyen, M., Pontes, N., Ferm, L.-E. C., Quach, S., & Thaichon, P. (2026). Chatbot Schema Activation: When Anthropomorphic Language Leverages Word-of-Mouth. Australasian Marketing Journal. https://doi.org/10.1177/14413582261499475", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Australasian Marketing Journalの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "共感的な言葉や絵文字などの擬人的な言葉遣いが電子口コミを増やすのは、顧客のチャットボット・スキーマ（チャットボットを理解する認知的な枠組み）が働いているときに限られることを示した（抄録）。", "p3": "2つの実験で、擬人的な言語、チャットボット・スキーマ、チャットボットの能力が、真正性の知覚と電子口コミに与える影響を調べた（抄録）。", "p5": "研究1ではスキーマが活性化しているときに擬人的な言語が口コミの増加と関連する方向の証拠を得た。研究2では、擬人的な言語の真正性と口コミへの効果がチャットボットの能力に左右されることを示した（抄録）。", "fun": "チャットボットが共感の言葉や絵文字で話しかけると、親しみがわいて人に勧めたくなるでしょうか。この研究は、相手をチャットボットだと意識しているときに限って効果があり、その効果も役に立つチャットボットかどうかで変わることを示しました。見た目より言葉づかいで印象が変わる点が面白いところです。", "unverified": "参加者数と効果量は抄録では未確認。"}}, {"id": "jr19", "rank": 19, "headline": "集積の便益と気候災害の費用で住宅立地を選ぶ", "title": "Urban densification to support climate adaptation: balancing costs and agglomeration benefits in the Netherlands", "url": "https://doi.org/10.1093/jeg/lbag077", "authors": "Yashvant R Premchand ほか", "venue": "Journal of Economic Geography", "date": "2026-11-04", "sjr": 1.949, "citescore": 7.1, "citescore_year": "2025", "apa": "Premchand, Y. R., & Mulder, P. (2026). Urban densification to support climate adaptation: balancing costs and agglomeration benefits in the Netherlands. Journal of Economic Geography. https://doi.org/10.1093/jeg/lbag077", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Journal of Economic Geographyの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "気候適応の費用を地点別に見積もっても高密度の都市は大きな純便益を生み、気候適応はむしろ高密度化を後押しすることを、オランダで示した（抄録）。", "p3": "集積の便益を地価で代理し、洪水防御と地盤沈下の工学的な費用推計から適応費用を求め、両者を組み合わせて空間的なトレードオフを地図にした（抄録）。", "p5": "高密度の都市は費用の高い場所でも強い純便益を生み、低密度の集落での新築は厚生の損失になった。開発が成り立つ密度の閾値を示し、多くの中規模都市はすでにそれを超えており、郊外への拡張より高密度化が有利だった（抄録）。", "fun": "洪水や地盤沈下のおそれがある土地には家を建てない方がよい、と考えがちです。でもオランダの計算では、守るための費用がかかっても、人が集まる都市の便利さ（集積の利益）の方が大きく、むしろ街を密にする方が得になりました。気候対策がコンパクトな街づくりを後押しする、という結論が面白いところです。", "unverified": "閾値となる密度の値と、費用推計の不確実性の扱いは抄録では未確認。"}}, {"id": "jr20", "rank": 20, "headline": "生成AIが青少年役を演じて指導者を訓練", "title": "Simulating Adolescents Using a Generative Text-Based AI Chatbot to Support Facilitator Training in a Motivational Interviewing-Based Prevention Program", "url": "https://doi.org/10.1007/s11121-026-02006-x", "authors": "Francisco Cardozo ほか", "venue": "Prevention Science", "date": "2026-11-05", "sjr": 1.477, "citescore": 7.0, "citescore_year": "2025", "apa": "Cardozo, F., Brown, E. C., Mejía-Trujillo, J., Balise, R., George, S. M. St., Pérez-Gómez, A., & Gabbay, V. (2026). Simulating Adolescents Using a Generative Text-Based AI Chatbot to Support Facilitator Training in a Motivational Interviewing-Based Prevention Program. Prevention Science. https://doi.org/10.1007/s11121-026-02006-x", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Prevention Scienceの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "動機づけ面接に基づく物質使用の予防プログラムで、青少年役を演じる生成AIチャットボットを作り、指導者の練習に使えるかを予備的に検証した（抄録）。", "p3": "チャットボットを反復的に改良し、認定を受けた指導者5人がそれぞれ2回の模擬セッションを行った（計374メッセージ）。訓練を受けた3人の評定者が一貫性・現実味・文脈への適合を評価し、指導者に半構造化面接を行った（抄録）。", "p5": "評定はセッション全体で高いメッセージの質を示し、一貫して文脈に合った青少年らしい応答が生成されていた。指導者はチャットボットを現実的と受け止めた（抄録）。", "fun": "カウンセリングの練習には相手役が必要ですが、人を集めるのは手間も費用もかかります。この研究は、生成AIに思春期の若者を演じさせ、指導者の練習相手にしました。AIが「それらしい若者」をどこまで演じられるかを、専門の評定者が一つひとつのメッセージで採点して確かめた点が面白いところです。", "unverified": "指導者5人の小規模な予備研究で、訓練の効果そのものは未検証。評定の数値は抄録では未確認。"}}, {"id": "jr21", "rank": 21, "headline": "STARAへの認識が社内起業行動を左右する", "title": "How STARA-enabled technological readiness shapes intrapreneurial behaviour and digital competence in China's electric vehicle (EV) manufacturing sector", "url": "https://doi.org/10.1108/jeim-04-2026-0576", "authors": "Syed Hussain Murtaza ほか", "venue": "Journal of Enterprise Information Management", "date": "2026-11-05", "sjr": 1.665, "citescore": 19.6, "citescore_year": "2025", "apa": "Murtaza, S. H., Khan, A., Lu, W., & Ali, A. (2026). How STARA-enabled technological readiness shapes intrapreneurial behaviour and digital competence in China’s electric vehicle (EV) manufacturing sector. Journal of Enterprise Information Management, 1–33. https://doi.org/10.1108/jeim-04-2026-0576", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Journal of Enterprise Information Managementの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "従業員がSTARA（スマート技術・AI・ロボット・アルゴリズム）を前向きに受け止めるほど社内起業行動とデジタル能力が高いことを、中国の電気自動車製造の従業員で示した（抄録）。", "p3": "動的能力理論や社会技術システム理論などに基づく統合モデルを作り、層化した目的的抽出によるオンライン調査の有効回答193件をPLS-SEMで分析した（抄録）。", "p5": "STARAへの前向きな認識は社内起業行動とデジタル能力の高さと関連し、社内起業行動がその媒介役だった。デジタル環境の変化の激しさは、STARAの認識とデジタル能力の正の関係を弱めた（抄録）。", "fun": "職場にAIやロボットが入ってくるとき、それを前向きに受け止めるかどうかで、働く人の行動は変わります。この研究では、前向きな人ほど自ら新しいことに挑戦し、その挑戦を通じてデジタルの力が身についていました。ただ、変化が激しすぎる環境ではその効果が弱まる、という点が面白いところです。", "unverified": "横断調査のため因果の向きは確定できない（解釈）。経路係数の値は抄録では未確認。"}}, {"id": "jr22", "rank": 22, "headline": "地下水上昇による斜面変動と建物被害のFE解析", "title": "Finite Element Greenfield Modelling for building damage assessment under groundwater-induced slope movements", "url": "https://doi.org/10.1139/cgj-2026-0245", "authors": "Davide Luongo ほか", "venue": "Canadian Geotechnical Journal", "date": "2026-11-05", "sjr": 1.282, "citescore": 5.8, "citescore_year": "2025", "apa": "Luongo, D., Franza, A., Nicodemo, G., Prada-Sarmiento, L. F., Ferlisi, S., Gullà, G., & Peduto, D. (2026). Finite Element Greenfield Modelling for building damage assessment under groundwater-induced slope movements. Canadian Geotechnical Journal. https://doi.org/10.1139/cgj-2026-0245", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Canadian Geotechnical Journalの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "地下水位の上昇による斜面の地盤変位を平面ひずみの有限要素法で解析し、浅い基礎の建物の被害を評価するグリーンフィールド斜面解析の枠組みを示した（抄録）。", "p3": "排水・定常浸透の条件でMohr–Coulombの構成則を使い、限界引張ひずみ法（LTSM）を緩速地すべりの影響を受ける建物の被害評価に適用した。変位とひずみの場から最大引張ひずみを求め、安定性の変化も評価した（抄録）。", "p5": "地下水位の上昇で地盤の変位は次第に増え、ひずみの分布は主に斜面の運動の形で決まった。中央部は並進的、頂部と先端部は回転的な成分を持ち、頂部は引張、先端部は圧縮の水平ひずみが主だった。斜面に平行な正規化変位が変形の水準の代理指標になりうる（抄録）。", "fun": "雨で地下水位が上がると、斜面はゆっくりと動き出します。この研究は、斜面の上の方では地面が引っ張られ、下の方では押し縮められることを計算で示し、同じ斜面でも建っている場所によって建物の傷み方が違うことを明らかにしました。斜面全体の動きの大きさから被害の目安を素早く見積もれる点が面白いところです。", "unverified": "層厚が一様な理想化した斜面での結果で、実測との照合は抄録では未確認。"}}, {"id": "jr23", "rank": 23, "headline": "水中の柔軟な茎の群れと流れの連成", "title": "Fluid–structure interaction in a square array of submerged flexible stems", "url": "https://doi.org/10.1017/jfm.2026.12218", "authors": "Weilin Chen ほか", "venue": "Journal of Fluid Mechanics", "date": "2026-11-05", "sjr": 1.283, "citescore": 6.8, "citescore_year": "2025", "apa": "Chen, W., & Li, Y. P. (2026). Fluid–structure interaction in a square array of submerged flexible stems. Journal of Fluid Mechanics, 1046. https://doi.org/10.1017/jfm.2026.12218", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Journal of Fluid Mechanicsの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "3次元の正方配列の柔軟な茎を通る流れを直接数値シミュレーションし、柔軟性によって3つの動的な領域が現れ、中間の柔軟性で固有振動数と振動の周波数のロックインが起きることを示した（抄録）。", "p3": "柔軟性のパラメータKを変えて、茎の連成した運動、流れの分布、渦の構造を調べ、抗力、底面せん断応力、底面せん断摩擦の二乗平均の分布でエネルギー散逸と土砂輸送の効果を定量化した（抄録）。", "p5": "Kが大きいと茎はほぼ剛で隙間の流れが加速し、中間では完全なロックインで大振幅の振動が起き、小さいと振幅は減るが変形が増えて不規則になった。中間のKの配列は、剛な配置を上回る最も高いエネルギー散逸の効率を示した（抄録）。", "fun": "水草の群れは、水の流れを弱め、川底の砂の動きを変えます。この計算では、茎が硬すぎず柔らかすぎないしなやかさのとき、茎の揺れと流れのリズムがぴったり合って大きく揺れ、流れのエネルギーを最もよく吸収しました。硬い杭よりもしなやかな茎の方が流れを弱めるという点が面白いところです。", "unverified": "Kの値の範囲と、底面せん断応力の結果は抄録が途中で切れているため未確認。"}}, {"id": "jr24", "rank": 24, "headline": "都市規模のSHMに向けた差し込み型の枠組み", "title": "Toward city-scale structural health monitoring: Architectural gaps, a modular plug-and-play framework, and research directions", "url": "https://doi.org/10.1177/13694332261506126", "authors": "Fatih Yesevi Okur", "venue": "Advances in Structural Engineering", "date": "2026-11-05", "citescore": 5.2, "citescore_year": "2025", "apa": "Okur, F. Y. (2026). Toward city-scale structural health monitoring: Architectural gaps, a modular plug-and-play framework, and research directions. Advances in Structural Engineering. https://doi.org/10.1177/13694332261506126", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Advances in Structural Engineeringの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "個々の構造物で成熟したSHMを、多数の異種の資産からなる都市規模に広げるためのモジュール型・差し込み型の構成枠組みMPnP-SHMを示した（抄録）。", "p3": "構造中心のSHM、無線センサネットワークとIoT、エッジ-クラウドとサイバーフィジカルシステム、デジタルツイン、集団ベースのSHMを概観して構成上の欠落を特定し、センサと解析部品が能力や状態を機械可読で示すメタデータ駆動の、制約つきの実行時の編成を導入した（抄録）。", "p5": "データ品質と来歴の管理、多忠実度のデジタルツイン、既存システムの統合、段階的な機能縮退、資産間・集団レベルの解析の接点を組み込んだ。差し込み型の運用は構造工学の判断の自動化ではないと明記している（抄録）。", "fun": "一つの橋を見張るセンサの仕組みはかなり成熟しましたが、街じゅうの橋や建物をまとめて見張ろうとすると、機器も形式もばらばらで、毎回専門家が手で組み合わせる必要がありました。この研究は、部品が自分の能力を名札のように示し、条件に合うものを自動で組み合わせる設計を提案しています。「差せば動く」監視を目指す発想が面白いところです。", "unverified": "実際の都市での運用による実証の有無は抄録では未確認。"}}, {"id": "jr25", "rank": 25, "headline": "温湿度と交通荷重を入れたLSTMで橋のたわみ予測", "title": "LSTM-Based Deflection Prediction for Medium and Small-Span Bridges Considering Temperature, Humidity, and Traffic Loads", "url": "https://doi.org/10.3390/computers15110783", "authors": "Chaoyu Yang ほか", "venue": "Computers", "date": "2026-11-02", "citescore": 9.1, "citescore_year": "2025", "apa": "Yang, C., Zhang, J., Wang, C., Guo, P., Wang, J., & Zheng, Y. (2026). LSTM-Based Deflection Prediction for Medium and Small-Span Bridges Considering Temperature, Humidity, and Traffic Loads. Computers, 15(11), 783. https://doi.org/10.3390/computers15110783", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Computers（MDPI）の抄録（OpenAlex登録）を使用", "preprint": false, "short": true, "p1": "ガウスフィルタで橋のたわみを傾向成分と細部成分に分け、物理的な特徴量を加えた2つのLSTMで予測する軽量な2段階の枠組みで、中小橋のたわみ予測の精度を上げた（抄録）。", "p3": "熱の遅れを考えた有効温度の特徴と、影響線の重みに基づく動的な荷重流の特徴を作り、傾向と細部を並列の2つのLSTMで別々に予測して足し合わせた（抄録）。", "p5": "対象の橋で、提案モデルはNaiveとBaselineのモデルよりRMSEとMAEが小さく、2つの枝の並列実行によりBaselineに対して推論が1.91倍速くなった（抄録）。", "fun": "橋のたわみには、気温による伸び縮みのようなゆっくりした変化と、車が通るたびの速い揺れが重なっています。この研究は、まずその二つを分け、それぞれを別のAIで予測してから足し合わせました。温まるまでの時間の遅れや、車の位置による効き方の違いといった物理の知識を入力に組み込んだ点が面白いところです。", "unverified": "対象は1つの橋で、誤差の具体的な数値は抄録では未確認。"}}, {"id": "jr26", "rank": 26, "headline": "GNSSが途切れる自動車LiDAR-慣性データセット", "title": "Odyssey: An automotive lidar-inertial odometry dataset with GNSS-denied situations", "url": "https://doi.org/10.1177/02783649261495584", "authors": "Aaron Kurda ほか", "venue": "International Journal of Robotics Research", "date": "2026-11-05", "sjr": 2.022, "citescore": 12.2, "citescore_year": "2025", "apa": "Kurda, A., Steuernagel, S., Jung, L., & Baum, M. (2026). Odyssey: An automotive lidar-inertial odometry dataset with GNSS-denied situations. The International Journal of Robotics Research. https://doi.org/10.1177/02783649261495584", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "International Journal of Robotics Researchの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "GNSSが長く使えない環境を含む自動車のLiDAR-慣性オドメトリのデータセットOdysseyを公開し、航法級の基準軌道で評価できるようにした（抄録）。", "p3": "リングレーザージャイロに基づくRTK/INSで基準軌道を作り、農村の屋外から都市・屋内まで36の系列を収録し、基準誤差の不確かさを実験で検証した。同じ軌道の3回の繰り返しと測地座標により、場所の認識や外部地図との統合にも使える（抄録）。", "p5": "既存の自動車のベンチマークが短いGNSS欠落区間に限られていたのに対し、長く続くGNSS欠落環境を含むデータとデータローダ、補足資料をオンラインで公開した（抄録）。", "fun": "カーナビの位置はふつう衛星（GNSS）で決まりますが、トンネルやビルの谷間では電波が途切れます。そこで車は自分のセンサだけで位置を推定しますが、その腕前を確かめるには正解の軌道が必要です。この研究は、航法級の精密なジャイロで正解を作り、長い電波なしの区間でも採点できるデータを用意した点が面白いところです。", "unverified": "系列ごとの長さとGNSS欠落の時間は抄録では未確認。"}}, {"id": "jr27", "rank": 27, "headline": "VRSとGNSS時間差分で構造変位を高頻度計測", "title": "Mixed use of multi-rate double-differenced VRS and time-differenced GNSS data for high-rate structural displacement monitoring", "url": "https://doi.org/10.1016/j.measurement.2026.123803", "authors": "Xuanyu Qu ほか", "venue": "Measurement: Journal of the International Measurement Confederation", "date": "2026-11-05", "sjr": 1.145, "citescore": 10.2, "citescore_year": "2025", "apa": "Qu, X., Paziewski, J., Hu, J., Mansour, A., Adham, M., & Ding, X. (2026). Mixed use of multi-rate double-differenced VRS and time-differenced GNSS data for high-rate structural displacement monitoring. Measurement, 123803. https://doi.org/10.1016/j.measurement.2026.123803", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "Measurementの記録は題名のみで、抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、多レートの二重差分VRS（仮想基準点）データと時間差分GNSSデータを併用し、構造物の変位を高頻度で計測する方法を扱う研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名が問うのは、衛星測位（GNSS）で建物や橋のわずかな動きをどこまで細かく、速く測れるかです。測る間隔の違うデータを組み合わせることで、精度と速さを両立できるのか、という問いそのものが面白いところです。", "unverified": "内容は題名からの推測で、手法と精度は未確認。"}}, {"id": "jr28", "rank": 28, "headline": "ノイズとモデル誤差の下での応答再構成のセンサ配置", "title": "Sensor placement optimization for structural response reconstruction with measurement noise and model error", "url": "https://doi.org/10.1016/j.ymssp.2026.115172", "authors": "Mingyue Wang ほか", "venue": "Mechanical Systems and Signal Processing", "date": "2026-11-05", "sjr": 2.342, "citescore": 17.6, "citescore_year": "2025", "apa": "Wang, M., Han, J., He, Y., & Sheng, X. (2027). Sensor placement optimization for structural response reconstruction with measurement noise and model error. Mechanical Systems and Signal Processing, 262, 115172. https://doi.org/10.1016/j.ymssp.2026.115172", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "Mechanical Systems and Signal Processingの記録は題名のみで、抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、計測ノイズとモデル誤差がある条件で、構造応答を再構成するためのセンサ配置を最適化する研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "限られた数のセンサで構造物全体の揺れを推定するには、どこにセンサを置くかが勝負です。測定のノイズと計算モデル自体のずれの両方を考えたとき、最適な置き場所はどう変わるのか、という問いが面白いところです。", "unverified": "内容は題名からの推測で、手法と結果は未確認。"}}, {"id": "jr29", "rank": 29, "headline": "異種センサ融合による橋梁モニタリングの凸最適化", "title": "Nonlinear Convex Optimization for Heterogeneous Sensor Data Fusion and Risk Assessment in Bridge Monitoring", "url": "https://doi.org/10.1587/transfun.2026eap1197", "authors": "Lianjiang LIU ほか", "venue": "IEICE Transactions on Fundamentals of Electronics, Communications and Computer Sciences", "date": "2026-11-04", "citescore": 1.1, "citescore_year": "2025", "apa": "LIU, L., YU, X., ZHANG, C., XIAO, Z., LIU, Z., LI, Z., YUAN, X., & XIAO, J. (2026). Nonlinear Convex Optimization for Heterogeneous Sensor Data Fusion and Risk Assessment in Bridge Monitoring. IEICE Transactions on Fundamentals of Electronics, Communications and Computer Sciences. https://doi.org/10.1587/transfun.2026eap1197", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "IEICE Transactionsの記録は題名のみで、抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、橋梁モニタリングで種類の異なるセンサのデータを非線形の凸最適化で融合し、リスクを評価する研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "橋には性質の違う何種類ものセンサが付けられますが、それぞれの情報をどう重ね合わせれば一番確かな判断になるのか。数学の最適化の道具でその組み合わせ方を決める、という問いが面白いところです。", "unverified": "内容は題名からの推測で、センサの種類と結果は未確認。"}}, {"id": "jr30", "rank": 30, "headline": "物質点法で黄天地すべり津波を3次元再現", "title": "Three-dimensional material point method modeling of the full-scale Huangtian landslide-tsunami with a phase-transition model", "url": "https://doi.org/10.1007/s10346-026-02869-9", "authors": "Hang Feng ほか", "venue": "Landslides", "date": "2026-11-06", "sjr": 1.778, "citescore": 12.5, "citescore_year": "2025", "apa": "Feng, H., Yin, Z.-Y., & Ouyang, C. (2026). Three-dimensional material point method modeling of the full-scale Huangtian landslide-tsunami with a phase-transition model. Landslides. https://doi.org/10.1007/s10346-026-02869-9", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "Landslidesの記録は題名のみで、抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、相転移モデルを組み込んだ3次元の物質点法（MPM）で、黄天の地すべりとそれに伴う津波を実規模で再現した研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "山の斜面が崩れて水に飛び込むと、津波が起きることがあります。崩れる土砂のふるまいの「状態の変わり目」を計算にどう組み込めば、地すべりから津波までを一続きに再現できるのか、という問いが面白いところです。", "unverified": "内容は題名からの推測で、相転移モデルの中身と再現の精度は未確認。"}}, {"id": "jr31", "rank": 31, "headline": "限界状態土質力学とμ(I)レオロジーをつなぐ", "title": "An elasto-plastic-inertial constitutive model bridging Critical State Soil Mechanics and μ(I)–ϕ(I) rheology", "url": "https://doi.org/10.1016/j.jmps.2026.106906", "authors": "Retief Lubbe ほか", "venue": "Journal of the Mechanics and Physics of Solids", "date": "2026-11-05", "sjr": 1.766, "citescore": 10.0, "citescore_year": "2025", "apa": "Lubbe, R., Cheng, H., Luding, S., & Magnanimo, V. (2026). An elasto-plastic-inertial constitutive model bridging Critical State Soil Mechanics and μ(I)–ϕ(I) rheology. Journal of the Mechanics and Physics of Solids, 106906. https://doi.org/10.1016/j.jmps.2026.106906", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "題名", "basis_note": "Journal of the Mechanics and Physics of Solidsの記録は題名のみで、抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、限界状態土質力学とμ(I)–ϕ(I)レオロジー（粒状流の慣性数に基づく摩擦と体積分率の法則）をつなぐ弾塑性-慣性の構成モデルを提案した研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "砂は、じっとしていれば固体のように建物を支え、勢いよく流れれば液体のようにふるまいます。土の止まった状態を扱う理論と、流れる粒の理論を一つの式でつなげられるのか、という問いが面白いところです。", "unverified": "内容は題名からの推測で、モデルの式と検証は未確認。"}}, {"id": "jr32", "rank": 32, "headline": "月面の重力下での粒状流の分級", "title": "Segregation in Granular Flow Under Lunar Conditions", "url": "https://doi.org/10.3390/fluids11110279", "authors": "Masami Nakagawa ほか", "venue": "Fluids", "date": "2026-11-04", "citescore": 4.1, "citescore_year": "2025", "apa": "Nakagawa, M., & Kioka, A. (2026). Segregation in Granular Flow Under Lunar Conditions. Fluids, 11(11), 279. https://doi.org/10.3390/fluids11110279", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Fluids（MDPI）の抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "月面での資源利用に必要な月の土の輸送で、地球の粒の偏析（分級）の理論がどこまで通用するかを、粒状ボンド数を軸に概念的に整理した（抄録）。", "p3": "月の土は細かく角ばり、凝集した粒を含み静電的に活発で、真空かつ6分の1の重力で扱われるため、凝集力と重力の釣り合いが変わると指摘した。粒状ボンド数と慣性数の平面に概念的な領域図を描き、7つの検証可能な仮説を導いた（抄録）。", "p5": "低重力の実験では凝集性の排出で目詰まりが起きやすく、データは重力より粒状ボンド数で整理されることが示されているが、偏析で同じことが成り立つかは未検証だと述べる（抄録）。", "fun": "月で酸素や水を取り出す計画は、どれも月の砂を運ぶことから始まります。砂を運ぶと大きな粒と小さな粒が分かれる現象は地球ではよく知られていますが、重力が6分の1で、砂が静電気を帯びてくっつきやすい月でも同じことが起きるのか。物差しを重力から「くっつく力と重さの比」に変えて考える点が面白いところです。", "unverified": "概念的な研究で、月の条件の実験データによる検証は行っていない（抄録）。"}}, {"id": "jr33", "rank": 33, "headline": "IoTで土石流と地すべりを実時間監視した事例", "title": "Case studies on IoT monitoring of debris flow and landslides", "url": "https://doi.org/10.1371/journal.pone.0361584", "authors": "Lei Huang ほか", "venue": "PLoS ONE", "date": "2026-11-04", "citescore": 4.8, "citescore_year": "2025", "apa": "Huang, L., Cheng, Y.-M., Wei, S.-m., & Gie, M.-m. (2026). Case studies on IoT monitoring of debris flow and landslides. PLOS One, 21(11), e0361584. https://doi.org/10.1371/journal.pone.0361584", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "PLoS ONEの抄録（OpenAlex登録）を使用", "preprint": false, "short": true, "p1": "土石流と地すべりの両方に使える統一的なIoT監視の構成を提案し、著者らの3つの工事事例で早期警報に役立つことを示した（抄録）。", "p3": "事例1では剛な防護堰の構造に合わせた土石流のIoT監視を、事例2と3では変形センサ、雨量計、映像監視などで降雨による地すべりの早期警報を行った。太陽電池と蓄電池の電源、データ伝送、警報の方式、クラウドでの処理を統合した（抄録）。", "p5": "提案した構成の有効性を、早期警報に成功した事例で確かめたと述べる（抄録）。", "fun": "山の斜面の見回りを人が手作業で行うと、記録が遅れたり途切れたりします。この研究は、センサ、太陽電池、映像、通信、クラウドをひとまとめにした見張りの仕組みを、土石流と地すべりの両方に使える形で示しました。現場で警報が実際に役立った例を示している点が面白いところです。", "unverified": "警報の的中率などの数値と、事例の所在地は抄録では未確認。"}}, {"id": "jr34", "rank": 34, "headline": "説明可能なAIで裁量的発生高から利益調整を検出", "title": "Detecting Earnings Management through Explainable Artificial Intelligence: A Machine Learning Approach Using Financial Statement Data", "url": "https://doi.org/10.70568/ijdafs.3.1.1", "authors": "Safwat Al Tal", "venue": "International Journal of Digital Accounting and Fintech Sustainability", "date": "2026-11-05", "apa": "Al Tal, S. (2026). Detecting Earnings Management through Explainable Artificial Intelligence: A Machine Learning Approach Using Financial Statement Data. International Journal of Digital Accounting and Fintech Sustainability, 3(1), 284–299. https://doi.org/10.70568/ijdafs.3.1.1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "International Journal of Digital Accounting and Fintech Sustainabilityの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "財務諸表データから、裁量的発生高が異常に大きい企業年（発生高による利益調整の代理）を分類する説明可能な機械学習の枠組みを作り、Beneish M-Scoreを上回ることを示した（抄録）。", "p3": "Compustat北米の非金融上場企業の2010〜2023年度の7,800企業年で、修正ジョーンズ・モデルの裁量的発生高が業種-年内で上位5分位のもの（1,560件、20.0%）をラベルとし、ラベルの構成要素を除いた財務比率で4つのアルゴリズムを学習した。2021〜2023年の1,000件で標本外評価した（抄録）。", "p5": "XGBoostのROC-AUCは0.748、PR-AUCは0.421で、Beneish M-Scoreの0.612を上回った。LightGBMは閾値0.50でF1が0.484、均衡正解率が0.653と最も高く、ROC-AUCの優位はDeLong検定で有意だった（p=0.004）（抄録）。", "fun": "会社が決算の数字を都合よく見せる「利益調整」は、外からは見えにくいものです。この研究は、決算書の比率だけから疑いの強い会社を見分けるAIを作り、昔からある判定式より成績が良いことを示しました。しかも答えのもとになった数字を入力から外して、いわばカンニングを防いでいる点が面白いところです。", "unverified": "利益調整の代理ラベルに基づく評価で、実際の不正事例での検証は未確認。SHAP分析の結果は抄録が途中で切れているため未確認。"}}, {"id": "jr35", "rank": 35, "headline": "ケベック州会計士の懲戒432件を類型化", "title": "A Profile of Disciplinary Offenses in Québec's Accounting Profession", "url": "https://doi.org/10.1111/1911-3838.70060", "authors": "Sylvie Côté ほか", "venue": "Accounting Perspectives", "date": "2026-11-05", "citescore": 2.5, "citescore_year": "2025", "apa": "Côté, S., Gosselin, A. M., Lecompte, A., Phaneuf, K., & Coulombe, P. (2026). A Profile of Disciplinary Offenses in Québec’s Accounting Profession. Accounting Perspectives. https://doi.org/10.1111/1911-3838.70060", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Accounting Perspectivesの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "ケベック州の公認会計士の倫理違反を、2012〜2023年の有罪裁定432件のクラスター分析で4つの違反者像に分類した（抄録）。", "p3": "Gower距離とk-medoidsのクラスター分析を使い、Jonesの道徳的強度モデルに沿って違反の型を特定した（抄録）。", "p5": "手続きの不備が中心の「怠慢者」、横領や詐欺など重大な違反の「不正者」、管理・資格の違反の「不遵守者」、監督への抵抗と再犯の多い「妨害者」の4類型が得られ、専門職の特徴、倫理的な重さ、再犯の可能性がそれぞれ異なった（抄録）。", "fun": "会計士の不祥事と聞くと横領のような大事件を思い浮かべますが、実際の懲戒には、うっかりした手続きの誤りから監督への抵抗まで、性質の違うものが混ざっています。この研究は、それらを統計で4つの型に分け、型ごとに再発のしやすさも違うことを示しました。一律の研修より型に合った対策が必要だ、という点が面白いところです。", "unverified": "各類型の件数と再犯率の数値は抄録では未確認。"}}, {"id": "jr36", "rank": 36, "headline": "環境公益訴訟の試行で監査報酬は上がったか", "title": "Does environmental judicial reform influence audit fees? Evidence from China's environmental public interest litigation", "url": "https://doi.org/10.1108/cafr-11-2025-0247", "authors": "Simiao Song ほか", "venue": "China Accounting and Finance Review", "date": "2026-11-05", "citescore": 0.4, "citescore_year": "2025", "apa": "Song, S., & Cui, G. (2026). Does environmental judicial reform influence audit fees? Evidence from China’s environmental public interest litigation. China Accounting and Finance Review, 1–28. https://doi.org/10.1108/cafr-11-2025-0247", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "China Accounting and Finance Reviewの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "中国の環境公益訴訟の試行政策を準自然実験として使い、試行地域の企業の監査報酬が4.7%高くなったことを示した（抄録）。", "p3": "試行地域と非試行地域の企業を差の差の枠組みで比べ、平行トレンドの確認、プラセボ検定、傾向スコアのマッチング、同時期の政策の統制で頑健性を確かめた（抄録）。", "p5": "試行政策は監査人が感じる訴訟・規制のリスクを高め、作業時間の増加を伴わないリスク・プレミアムとして報酬に上乗せされた。ESGが弱い、情報の非対称性が大きいなどの企業で効果が強く、報酬の上昇は監査品質の改善につながらなかった（抄録）。", "fun": "環境を汚した企業を訴えやすくする制度ができると、企業の決算をチェックする監査人は「この会社は訴えられるかも」と身構えます。その結果、監査の手間は増えないのに料金だけが上がり、監査の質は良くならなかった、という結果が面白いところです。", "unverified": "報酬の上昇幅以外の係数の値と、標本の規模・期間は抄録では未確認。"}}, {"id": "jr37", "rank": 37, "headline": "気候リスクと上場企業の財務困窮", "title": "Climate Risk and Corporate Financial Distress: Evidence from Chinese Listed Firms", "url": "https://doi.org/10.1080/1540496x.2026.2745695", "authors": "Lei Zhang ほか", "venue": "Emerging Markets Finance and Trade", "date": "2026-11-06", "citescore": 6.3, "citescore_year": "2025", "apa": "Zhang, L., & Xue, J. (2026). Climate Risk and Corporate Financial Distress: Evidence from Chinese Listed Firms. Emerging Markets Finance and Trade, 1–18. https://doi.org/10.1080/1540496x.2026.2745695", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "Emerging Markets Finance and Tradeの記録は題名のみで、抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、気候リスクと企業の財務困窮の関係を中国の上場企業で実証した研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "猛暑や洪水などの気候のリスクは、工場や物流を通じて会社の財布にも響きうるはずです。そのリスクが本当に会社を経営難に近づけているのかを、データで確かめようとする問いが面白いところです。", "unverified": "内容は題名からの推測で、気候リスクの測り方と結果は未確認。"}}, {"id": "jr38", "rank": 38, "headline": "食肉加工の副産物を内部回収する原価モデル", "title": "An Extended Sustainable Strategic Costing Model for Circular Value in the Meat Processing Industry", "url": "https://doi.org/10.3390/jrfm19110864", "authors": "Silviya Petrova Chukanska ほか", "venue": "Journal of risk and financial management", "date": "2026-11-01", "citescore": 5.5, "citescore_year": "2025", "apa": "Chukanska, S., & Petrova, R. (2026). An Extended Sustainable Strategic Costing Model for Circular Value in the Meat Processing Industry. Journal of Risk and Financial Management, 19(11), 864. https://doi.org/10.3390/jrfm19110864", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Journal of Risk and Financial Management（MDPI）の抄録（OpenAlex登録）を使用", "preprint": false, "short": true, "p1": "食肉加工企業が自社の動物性副産物を外部処理から内部回収に切り替える判断を、生産・経済・環境の面から評価する拡張した戦略的原価計算モデルを作り、適用した（抄録）。", "p3": "活動基準原価計算、マテリアルフローコスト会計、品質原価、ライフサイクルコスティングを、結合原価の配分、投資評価、限定的な排出評価と組み合わせ、共通の物質収支と二重計上を防ぐ規則でつないだ（抄録）。", "p5": "肉骨粉と動物油脂の収入は全部原価の99.76%を賄った。10年・割引率7%の事前評価で単独の正味現在価値は323万ユーロ、外部処理の回避分を含む比較の価値は1,442万ユーロで、パラメータを変えても比較上の優位は保たれた（抄録）。", "fun": "食肉工場では骨や脂などの副産物が大量に出ます。お金を払って外部で処理してもらう代わりに、自分で肉骨粉や油脂に加工して売ると得になるのか。この研究は、お金・ものの流れ・二酸化炭素の三つを同じ帳簿の上で数えて判断できるようにしました。捨てていたものを資源として数え直す会計の工夫が面白いところです。", "unverified": "対象企業の規模と所在国は抄録では未確認。排出の評価は限定的な範囲と記載。"}}, {"id": "jr39", "rank": 39, "headline": "家族・地域と公共サービスの微視的な協働", "title": "Digging Into the Subsoil: Considering and Theorizing Human Services Delivery at the Sub‐Micro‐Level of the Public Service Ecosystem", "url": "https://doi.org/10.1111/puar.70234", "authors": "Kate Broadhurst ほか", "venue": "Public Administration Review", "date": "2026-11-05", "sjr": 3.305, "citescore": 11.3, "citescore_year": "2025", "apa": "Broadhurst, K., & Parker, S. (2026). Digging Into the Subsoil: Considering and Theorizing Human Services Delivery at the Sub‐Micro‐Level of the Public Service Ecosystem. Public Administration Review. https://doi.org/10.1111/puar.70234", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Public Administration Reviewの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "公共サービス・エコシステム理論の最も微視的な層として、公共サービスの価値創造を下支えする家族と地域のエコシステムに注目する「下層土の感受性」という概念を示した（抄録）。", "p3": "家族と地域の非公式なシステムを価値の創造と破壊の場とみなし、マクロの政策をミクロの実践に翻訳する接続点として立法・政策のノードを提案した。児童保護の事例（ビネット）で枠組みを示した（抄録）。", "p5": "ノードが相互作用の条件を作る一方、力の非対称性や信念体系の違いの中で、下層の動きが価値の共創と共破壊のどちらになるかを左右することを示した（抄録）。", "fun": "公共サービスは役所だけで完結せず、家族や近所の人たちの支えの上に成り立っています。この研究は、そうした目に見えにくい家族や地域のつながりを、植物を支える「下層土」にたとえて理論の中に位置づけました。サービスが価値を生むか壊すかが、その土台との相性で決まるという視点が面白いところです。", "unverified": "概念研究で、量的な検証は行っていない（抄録）。"}}, {"id": "jr40", "rank": 40, "headline": "AIによるB2Bサービス回復で顧客は何を推論するか", "title": "More than the messenger: Industrial customer inferences and failure severity in AI-enabled B2B service recovery", "url": "https://doi.org/10.1016/j.indmarman.2026.10.003", "authors": "Cristiana Raquel Lages ほか", "venue": "Industrial Marketing Management", "date": "2026-11-01", "citescore": 15.7, "citescore_year": "2025", "apa": "Lages, C. R., Sands, S., Boukis, A., & Hollebeek, L. D. (2026). More than the messenger: Industrial customer inferences and failure severity in AI-enabled B2B service recovery. Industrial Marketing Management, 139, 57–68. https://doi.org/10.1016/j.indmarman.2026.10.003", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "Industrial Marketing Managementの記録は題名のみで、抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、AIが関わるB2Bのサービス回復で、産業顧客が何を推論し、失敗の深刻さがその受け止めにどう影響するかを扱う研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "取引先とのトラブルの対応をAIが担うとき、相手の会社はAIを単なる伝言役と見るのか、それとも対応の姿勢そのものを読み取るのか。失敗の深刻さによって受け止め方が変わるのか、という問いが面白いところです。", "unverified": "内容は題名からの推測で、手法と結果は未確認。"}}, {"id": "jr41", "rank": 41, "headline": "デジタル・サービス革新が価値共創を促す", "title": "Digital service innovation and ecosystem value co-creation: the moderating role of B2C contexts under service-dominant logic", "url": "https://doi.org/10.1108/jmtm-05-2026-0549", "authors": "Matilde Morales-Gallego ほか", "venue": "Journal of Manufacturing Technology Management", "date": "2026-11-05", "sjr": 1.566, "citescore": 14.4, "citescore_year": "2025", "apa": "Morales-Gallego, M., Molina Fernandez, L. M., & Rios de Haro, M. (2026). Digital service innovation and ecosystem value co-creation: the moderating role of B2C contexts under service-dominant logic. Journal of Manufacturing Technology Management, 1–18. https://doi.org/10.1108/jmtm-05-2026-0549", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Journal of Manufacturing Technology Managementの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "製造業のデジタル・サービス革新（スマートな対話型サービスとスマートな作業技術）がエコシステムでの価値共創の基盤になり、その効果がB2Cの文脈で強まることを示した（抄録）。", "p3": "サービス・ドミナント・ロジックに沿って、製造業者303社のデータに高次の構成概念を含むPLS-SEMを当てはめ、市場志向（B2CかB2Bか）の調整効果を調べた（抄録）。", "p5": "デジタル・サービス革新は価値共創を支え、B2Cの環境ではB2Bより関係が強かった。B2Bでは構造的な慣性と能力の壁が相互作用の摩擦を生んでいた。スマートな作業技術と対話型サービスには相乗効果があった（抄録）。", "fun": "製品を売って終わりではなく、使われている間もデジタルのサービスで顧客と価値を作っていく、という考え方が製造業に広がっています。この研究では、一般消費者向けの方が企業向けより効果が強く、企業間の取引では昔ながらの仕組みが壁になっていました。同じ技術でも相手によって効き方が違う点が面白いところです。", "unverified": "横断調査のため因果の向きは確定できない（解釈）。係数の値は抄録では未確認。"}}, {"id": "jr42", "rank": 42, "headline": "ラストワンマイル配送を体験価値から設計", "title": "Conceptualising and designing experiential consumer logistics: a literature synthesis towards a value-based framework", "url": "https://doi.org/10.1108/ijpdlm-01-2026-0015", "authors": "Xueqin Wang ほか", "venue": "International Journal of Physical Distribution and Logistics Management", "date": "2026-11-05", "sjr": 2.015, "citescore": 15.1, "citescore_year": "2025", "apa": "Wang, X., & Yuen, K. F. (2026). Conceptualising and designing experiential consumer logistics: a literature synthesis towards a value-based framework. International Journal of Physical Distribution & Logistics Management, 1–32. https://doi.org/10.1108/ijpdlm-01-2026-0015", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "International Journal of Physical Distribution and Logistics Managementの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "ラストワンマイル配送の価値を体験の面から捉える「体験型の消費者物流」を、物流とサービスデザインの文献の統合で概念化した（抄録）。", "p3": "2段階の文献レビューで、研究1は物流の文献から価値の構成と体験の仕組みを、研究2はサービスデザインの文献から体験価値を強める方法を整理した（抄録）。", "p5": "価値提案（ハイタッチかハイテクか）と価値の享受（個別か網の目か）の2軸で、伝統型・技術型・倫理型・プラットフォーム型の4つの構成を示し、関係構築と見えない設計の「寄り添い型」と、見える設計と共同体づくりの「力づけ型」の2つの設計の方向を対応づけた（抄録）。", "fun": "宅配便の価値は、早く確実に届くことだけではなくなりつつあります。配達する人とのやり取りや、倫理的な届け方といった「体験」も価値になる、という見方です。この研究は、その体験の型を2本の軸で4つに整理しました。毎日の荷物の受け取りを体験として設計し直す視点が面白いところです。", "unverified": "文献レビューで、実証データによる検証は行っていない（抄録）。"}}, {"id": "jr43", "rank": 43, "headline": "Instagramの日常行動から孤独の側面を読む", "title": "Everyday Instagram behavior maps distinct facets of loneliness in young adults", "url": "https://doi.org/10.1038/s44184-026-00252-z", "authors": "Yueyi Jiang ほか", "venue": "npj Mental Health Research", "date": "2026-11-06", "sjr": 1.814, "citescore": 7.2, "citescore_year": "2025", "apa": "Jiang, Y., Lewis, K., Palmer, B. W., Dai, F., & Winkielman, P. (2026). Everyday Instagram behavior maps distinct facets of loneliness in young adults. Npj Mental Health Research. https://doi.org/10.1038/s44184-026-00252-z", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "npj Mental Health Researchの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "米国の大学生415人のInstagramのデータから、孤独の社会的・情緒的な側面を行動の違いで見分けられる一方、構造的な孤立は捉えにくいことを示した（抄録）。", "p3": "同意を得たInstagramのデータの書き出しを使い、活動パターン、言語、画像から孤独に関する5つの妥当性の確認された尺度をモデル化し、モデルの説明分析で特徴を調べた（抄録）。", "p5": "マルチモーダルな痕跡は主観的な孤独を区別できたが、構造的な孤立には情報が少なかった。社会的な孤独は少ない「いいね」やコメントと、情緒的な孤独は否定的な言語、悲しい・怒った表情、深夜の活動と結びついていた（抄録）。", "fun": "孤独には、友達が少ないと感じる「社会的な孤独」と、心を通わせる相手がいないと感じる「情緒的な孤独」があります。SNSの使い方を調べると、前者は「いいね」やコメントの少なさに、後者は暗い言葉づかいや深夜の利用に表れていました。同じ孤独でも種類によって表れ方が違う点が面白いところです。", "unverified": "標本は大学生で女性とアジア系・白人が多く、一般化は今後の課題と著者が注記。予測精度の数値は抄録では未確認。"}}, {"id": "jr44", "rank": 44, "headline": "低所得高齢者のQOLは福祉レジームで違う", "title": "Comparing quality of life among older adults with relative low-income status across different welfare regimes in Europe", "url": "https://doi.org/10.1177/09589287261502284", "authors": "Shlomit Weiss-Dagan ほか", "venue": "Journal of European Social Policy", "date": "2026-11-05", "sjr": 1.181, "citescore": 6.8, "citescore_year": "2025", "apa": "Weiss-Dagan, S., Zhang, Y., & Zhao, P. (2026). Comparing quality of life among older adults with relative low-income status across different welfare regimes in Europe. Journal of European Social Policy. https://doi.org/10.1177/09589287261502284", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Journal of European Social Policyの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "欧州の4つの福祉レジームで、相対的低所得が高齢者の生活の質（QoL）を下げる程度が異なり、社会民主主義型と自由主義型で格差が小さいことを示した（抄録）。", "p3": "SHAREとELSAのデータ（N=120,577）で60歳以上を対象に、調査重み付きのOLSで、福祉レジームが相対的低所得とQoLの関係をどう調整するかを調べた（抄録）。", "p5": "相対的低所得はすべてのレジームでQoLを下げたが、社会民主主義型と自由主義型では低所得の有無によるQoLの差が有意に小さく、保守主義型と地中海型では大きく、両者の間に差はなかった。自由主義型（英国）は慢性疾患のある高齢者を的を絞って守っていた（抄録）。", "fun": "同じように所得が低い高齢者でも、住む国の福祉の仕組みによって暮らしの質は大きく違います。北欧型や英国型では低所得による差が小さく、大陸欧州型と南欧型では差が大きいままでした。個人の蓄えだけでなく、社会の仕組みが老後の暮らしを形づくるという点が面白いところです。", "unverified": "QoLの差の具体的な数値は抄録では未確認。"}}, {"id": "jr45", "rank": 45, "headline": "アイスランドの英語評議会と移民の地域参加", "title": "Language politics and immigrants’ inclusion in local governance in Iceland", "url": "https://doi.org/10.1515/soci-2026-0040", "authors": "Anna Wojtyńska ほか", "venue": "Sociolinguistica", "date": "2026-11-05", "sjr": 0.387, "citescore": 1.6, "citescore_year": "2025", "apa": "Wojtyńska, A., & Skaptadóttir, U. D. (2026). Language politics and immigrants’ inclusion in local governance in Iceland. Sociolinguistica. https://doi.org/10.1515/soci-2026-0040", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Sociolinguisticaの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "外国生まれの住民が人口の半分を超えるアイスランド南部の小さな自治体で、2022年に設けられた英語の評議会を、言語的正義の観点から民族誌的に分析した（抄録）。", "p3": "移民の包摂と言語政策が交わる点を、地域の参加者への民族誌的な調査で調べた（抄録）。", "p5": "評議会の設置は地域の参加者に好意的に受け止められたが、移民の統合と社会的結束にとってのアイスランド語の重要性をめぐる批判と報道での論争を招いた。英語が地域の統合政策の中心になる一方、評議会はアイスランド語の講座と社会への接点の改善を優先していた（抄録）。", "fun": "住民の半分以上が外国生まれの町で、行政の話し合いを英語で行う場を作ったら、国中で「アイスランド語を守るべきだ」という議論が起きました。ところが、その英語の評議会が力を入れたのは、移民がアイスランド語を学べる機会を増やすことでした。包摂のための言葉選びの難しさと工夫が見える点が面白いところです。", "unverified": "参加者の人数と調査の期間は抄録では未確認。"}}, {"id": "jr46", "rank": 46, "headline": "孤独な高齢者とAIの「デジタル親族」", "title": "Older adults’ social responses to AI virtual humans in digital kinship contexts: associations of loneliness, perceived cues and appraisals with purchase intention", "url": "https://doi.org/10.3389/fpsyg.2026.1882559", "authors": "Yanxue Zou ほか", "venue": "Frontiers in Psychology", "date": "2026-11-04", "citescore": 7.0, "citescore_year": "2025", "apa": "Zou, Y., & Huang, Q. (2026). Older adults’ social responses to AI virtual humans in digital kinship contexts: associations of loneliness, perceived cues and appraisals with purchase intention. Frontiers in Psychology, 17. https://doi.org/10.3389/fpsyg.2026.1882559", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Frontiers in Psychologyの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "短い動画の「デジタル親族」コンテンツに登場するAIバーチャルヒューマンへの高齢者の社会的・情緒的な反応と、購買意図との関係を調べた（抄録）。", "p3": "擬人化の3要因理論とCASA（コンピュータは社会的な行為者）のパラダイムに基づき、孤独、情緒的な訴え、人らしさ、同類性、社会的存在感、共感を位置づけた。65歳以上の中国人372人に標準化した動画を見せ、PLS-SEMとfsQCAで分析した（抄録）。", "p5": "PLS-SEMの結果は先行要因の異なるパターンを示したと述べるが、具体的な結果は取得した抄録の範囲に含まれない（抄録）。", "fun": "家族のような呼びかけで話しかけてくるAIの動画が、高齢者のスマホに流れてくるようになりました。そのやさしさが、いつの間にか商品のおすすめにつながっていることもあります。孤独な人ほどAIの「家族」に心を動かされ、物を買いたくなるのか、という問いが面白いところです。", "unverified": "抄録が途中で切れており、孤独と購買意図の関係の結果は未確認。"}}, {"id": "jr47", "rank": 47, "headline": "スポンジシティ移行の政策目的と社会技術変化", "title": "Governing Sponge City Transitions: Policy Objectives and Socio‐Technical Change", "url": "https://doi.org/10.1002/eet.70156", "authors": "Valentin Meilinger", "venue": "Environmental Policy and Governance", "date": "2026-11-05", "sjr": 1.394, "citescore": 7.6, "citescore_year": "2025", "apa": "Meilinger, V. (2026). Governing Sponge City Transitions: Policy Objectives and Socio‐Technical Change. Environmental Policy and Governance. https://doi.org/10.1002/eet.70156", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Environmental Policy and Governanceの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "ドイツとオーストリアのスポンジシティ（雨水をためて浸透させる都市）づくりが、目標どおりの政策の循環ではなく、関係者が制度や知識を少しずつ組み替える「絡み合った改良」として進むことを示した（抄録）。", "p3": "質的なインタビューと文書分析で、オッフェンバッハ、ボーフム、ウィーンでの取り組みが各規模でどう運用・統治されているかを調べた（抄録）。", "p5": "回復した都市の水循環をめぐる競合する描写が、スポンジ都市の考え方を目標主導の都市再生事業へ翻訳する仕方に影響し、植生の住みやすさ、健康、公正への関心が雨水管理の論理を押し返していた（抄録）。", "fun": "大雨をためて地面にしみこませる「スポンジのような街」づくりは、計画どおりに進む技術の話に見えます。でも実際の街では、緑の心地よさや健康、公平さといった別の願いがぶつかり合い、関係者が少しずつ手直しを重ねていました。都市の水の問題が「誰のための街か」という問いにつながる点が面白いところです。", "unverified": "インタビューの人数と期間は抄録では未確認。"}}, {"id": "jr48", "rank": 48, "headline": "都市道路の移動行動を観察する道具の開発", "title": "Development, Pilot Testing, and Validation of the System for Observing Travel-Related Activity on Urban Roads (SOTRAVEL)", "url": "https://doi.org/10.1007/s11524-026-01174-z", "authors": "Alejandra Jáuregui ほか", "venue": "Journal of Urban Health", "date": "2026-11-05", "sjr": 1.448, "citescore": 6.8, "citescore_year": "2025", "apa": "Jáuregui, A., Resendiz, E., Vignetta, S., Mandujano-Acevedo, N., Rios-Hernandez, M., Hermosillo-Gallardo, M. E., & Salvo, D. (2026). Development, Pilot Testing, and Validation of the System for Observing Travel-Related Activity on Urban Roads (SOTRAVEL). Journal of Urban Health. https://doi.org/10.1007/s11524-026-01174-z", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Journal of Urban Healthの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "都市の道路での歩行や自転車などの移動行動を、性別・年齢層・手段別に直接観察して数える道具SOTRAVELを開発し、妥当性を確かめた（抄録）。", "p3": "公園などでの観察法SOPARCの経路用の様式を、公道での能動的な移動に合わせて改変した。交通量の異なる8つの街路区間で15分の観察を、単独の観察者、2人の観察者、基準とする動画の3つの方法で行い、スピアマン相関とウィルコクソン符号順位検定で比べた（抄録）。", "p5": "動画と観察者による記録の相関は、性別・年齢などにわたって全体に強かった（r≥0.7）と述べる（抄録）。", "fun": "街を歩く人や自転車の数を数えるのに、高価なセンサではなく人の目で記録する方法を、信頼できる道具に仕立てました。動画を正解にして比べると、人の目の記録はよく一致していました。誰でも同じように使える「数え方の型」を作った点が面白いところです。", "unverified": "抄録は途中で切れており、手段別の一致度と調査した都市は未確認。"}}, {"id": "jr49", "rank": 49, "headline": "住民の土地提供で非正規居住地の道路を改良", "title": "Negotiating shared access space in informal settlements through micro-adjustments: Community leadership, land contribution and road upgrading in Dar Es Salaam", "url": "https://doi.org/10.1016/j.cities.2026.107748", "authors": "Gasper Kabendela ほか", "venue": "Cities", "date": "2026-11-04", "sjr": 1.772, "citescore": 11.5, "citescore_year": "2025", "apa": "Kabendela, G., Huybrechts, L., & Magina, F. B. (2026). Negotiating shared access space in informal settlements through micro-adjustments: Community leadership, land contribution and road upgrading in Dar Es Salaam. Cities, 179, 107748. https://doi.org/10.1016/j.cities.2026.107748", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "題名", "basis_note": "Citiesの記録は題名のみで、抄録・本文は入手できず", "preprint": false, "short": true, "p1": "題名から、ダルエスサラームの非正規居住地で、地域の指導者のもとで住民が土地を提供し、小さな調整を重ねて共有の通路を作り道路を改良した過程を扱う研究とみられる（題名）。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "家が密集した地区に道を通すには、誰かが土地を少しずつ差し出す必要があります。お金で土地を買い上げるのではなく、住民どうしの話し合いと小さな譲り合いで道を広げられるのか、という問いが面白いところです。", "unverified": "内容は題名からの推測で、対象地区と結果は未確認。"}}, {"id": "jr50", "rank": 50, "headline": "デジタル化と非倫理的な親組織行動", "title": "Digitalization and employees' unethical pro-organizational behavior in international engineering projects: mediating mechanisms and contextual moderators", "url": "https://doi.org/10.1108/ecam-03-2026-0451", "authors": "VanHieu Tran ほか", "venue": "Engineering, Construction and Architectural Management", "date": "2026-11-05", "sjr": 1.027, "citescore": 10.7, "citescore_year": "2025", "apa": "Tran, V., Chang, T., Deng, X., & Ibrahim, A. S. (2026). Digitalization and employees’ unethical pro-organizational behavior in international engineering projects: mediating mechanisms and contextual moderators. Engineering, Construction and Architectural Management, 1–18. https://doi.org/10.1108/ecam-03-2026-0451", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Engineering, Construction and Architectural Managementの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "国際建設プロジェクトでデジタル化は従業員の非倫理的な親組織行動（組織のためと称する不正）に直接は影響せず、デジタル・ストレスと情報の透明性を通じて間接的に影響することを示した（抄録）。", "p3": "予備調査で質問票を改良し、国際建設プロジェクトに従事する請負業者の従業員の有効回答201件をPLS-SEMとIPMAで分析した（抄録）。", "p5": "デジタル化の直接効果は有意でなく、デジタル・ストレスはリスクを高める経路、情報の透明性はリスクを下げる経路として働いた。文化の違いと地理的な分散がこの関係を調整した（抄録）。", "fun": "「会社のためなら多少のごまかしも」という行動は、デジタル化で減るのでしょうか、増えるのでしょうか。この研究の答えは「どちらにも転ぶ」でした。デジタル化でストレスが増えればごまかしが増え、情報が見えやすくなれば減る。道具そのものより、それが職場に何をもたらすかが分かれ道だという点が面白いところです。", "unverified": "横断調査のため因果は確定できない（解釈）。経路係数の値は抄録では未確認。"}}], "jnl_notable": [{"id": "jn01", "rank": 1, "field": "地球科学", "headline": "東北沖のプレート境界は地震前の固着に戻った", "title": "Seafloor geodesy delineates fast megathrust relocking after the giant 2011 Tohoku earthquake", "url": "https://doi.org/10.1126/science.aeg7301", "authors": "Fumiaki Tomita ほか", "venue": "Science", "date": "2026-11-05", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "apa": "Tomita, F., Sun, T., Kido, M., Iinuma, T., Uchida, N., Ohta, Y., Hino, R., He, J., & Wang, K. (2026). Seafloor geodesy delineates fast megathrust relocking after the giant 2011 Tohoku earthquake. Science, 394(6824), 676–681. https://doi.org/10.1126/science.aeg7301", "why": "14年間の海底地殻変動観測と陸上観測・数値モデルから、2011年東北沖地震の後の再固着が余効すべりに中断されつつ進み、すでに地震前に近い固着状態に戻ったことを示した。", "explain": {"basis": "抄録", "basis_note": "Scienceの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "2011年東北沖地震（M9）の後の14年間の海底地殻変動観測から、プレート境界の巨大断層の再固着の過程を描き出し、粘弾性の緩和が続く中でも、すでに地震前に近い固着状態に戻っていることを示した（抄録）。", "p2": "巨大地震の後に沈み込み帯の巨大断層がいつ、どのように固着を回復するかは、地震の周期の物理と将来の災害の理解に重要だが、震源域の上の海底での長期の観測は限られていた（抄録）。背景：陸上の観測だけでは沖合の断層の動きを細かく捉えにくい。", "p3": "14年間の地震後の海底地殻変動の観測に、陸上の測地観測、繰り返し地震の解析、数値モデリングを組み合わせ、余効すべりと上部マントルの粘弾性による応力緩和を区別しながら再固着の過程を推定した（抄録）。", "p4": "評価の対象は、断層上の固着の空間分布と時間変化、余効すべりによる中断、粘弾性の緩和の寄与である（抄録）。観測点の数や配置は抄録に記載がない。", "p5": "固着の回復は断層上の余効すべりによって中断され、粘弾性の上部マントルの応力緩和を伴っていた。巨大断層は、応力緩和が続いているにもかかわらず、現在すでに地震前と同様の固着状態に達していた（抄録）。", "p6": "抄録の範囲では、固着の回復の速さの定量値と推定の不確実性は確かめられない。解釈：固着の回復はひずみの蓄積の再開を示すもので、次の地震の時期を直接に予測するものではない。", "fun": "2011年の東日本大震災を起こしたプレートの境目は、地震でずれた後、再び「くっついて」ひずみをためていきます。その様子は海の底でしか正確に測れません。14年間の海底での観測から、境目はすでに地震前と同じようにくっついた状態に戻っていることが分かりました。思ったより速くひずみをためる状態に戻っていた点は、私たちの暮らしにも関わる大事な発見です。", "unverified": "抄録のみ読んだ。観測点の配置、固着率の数値、モデルの粘性率は未確認。"}}, {"id": "jn02", "rank": 2, "field": "経済学", "headline": "労働組合の賃金プレミアムの源泉を分解", "title": "Why Do Union Jobs Pay More? New Evidence from Matched Employer-Employee Data", "url": "https://doi.org/10.1093/qje/qjag054", "authors": "Pierre-Loup Beauregard ほか", "venue": "The Quarterly Journal of Economics", "date": "2026-11-03", "sjr": 33.069, "citescore": 23.8, "citescore_year": "2025", "apa": "Beauregard, P.-L., Lemieux, T., Messacar, D., & Saggio, R. (2026). Why Do Union Jobs Pay More? New Evidence from Matched Employer-Employee Data. The Quarterly Journal of Economics. https://doi.org/10.1093/qje/qjag054", "why": "カナダの雇用者-被用者データとAKMの二方向固定効果で、組合企業の賃金差のうち約4割が生産性の差、残りがレントの獲得によることを示した。", "explain": {"basis": "本文", "basis_note": "NBERワーキングペーパー版（w33740）の本文PDFを使用（QJEの出版社版は取得できず）", "preprint": false, "p1": "カナダの行政データで、労働組合のある企業の賃金が高い理由を分解し、約15対数ポイントの差のうち約6割は組合が企業の利益から多く引き出す力、残りは組合のある企業の生産性の高さによると示した（本文）。", "p2": "組合員の賃金が高いことは知られていたが、もともと儲かる企業に組合が多いだけかもしれない。組合結成の選挙で僅差の企業どうしを比べた研究は賃金への効果なしとしたが、僅差の選挙に限った局所的な効果だった（本文）。", "p3": "全国の転職のデータから、Abowd–Kramarz–Margolis（AKM）の二元固定効果モデルで企業ごとの賃金方針（企業効果）を推定し、組合の有無による差を、従業員1人当たり付加価値で説明できる部分とそれを超える部分に分解した。組合の判定には税の記録にある組合費の天引きを使った。個人効果が組合の職とそうでない職で異なってよいU-AKMも作り、組合の職でしか観察されない人の効果は再重みづけで補った（本文）。", "p4": "カナダ統計局のBEAM（2001–2019年）の民間企業が対象で、労働時間の記録がないため低い年収を除き、25〜59歳に限った。一部だけ組合のある企業の非組合員は、波及効果のおそれから比較から外した（本文）。", "p5": "組合のある企業は企業効果が約15対数ポイント、1人当たり付加価値が28対数ポイント高く、付加価値が同じでも約9対数ポイント多く払っていた。組合の職に就いた人への平均の効果は、両方の職を経験した人で9.8対数ポイント、組合の職だけの人を含めると約11対数ポイントだった。学歴の低い人ほど効果が大きく、高学歴の人は組合の職に移ると個人効果が下がり、組合が賃金の差を縮める働きと一致した（本文）。", "p6": "一部だけ組合のある企業で非組合員の賃金がどう調整されるかは今後の課題とされる（本文）。読んだのはNBERワーキングペーパー版で、QJE掲載版と数値が異なる可能性がある。解釈：組合費を全員から天引きするカナダの制度が組合の判定を正確にしており、加入が任意の米国の州にそのまま当てはめるには注意が要る。", "fun": "労働組合のある会社は給料が高い、とよく言われます。でも、それは組合が交渉で勝ち取った分なのか、もともと儲かっている会社に組合が多いだけなのか。カナダの税の記録で全国の働き手と会社をつなげて調べると、差のおよそ4割は会社の稼ぐ力の違い、残りの6割が組合の交渉の力でした。しかも学歴の高い人ほど組合の会社に移ると個人の上乗せが縮むという、平等化の働きも見えた点が面白いところです。", "unverified": "QJE掲載版との差分、頑健性の表の数値、産業別・創業年別の違いの詳細は未確認。"}}, {"id": "jn03", "rank": 3, "field": "統計学", "headline": "米国勢調査の差分プライバシーの雑音を回帰で除く", "title": "Denoising the US Census: Succinct block hierarchical regression", "url": "https://doi.org/10.1126/science.aej1765", "authors": "Badih Ghazi ほか", "venue": "Science", "date": "2026-11-05", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "apa": "Ghazi, B., Kamath, P., Kumar, R., Manurangsi, P., & Sealfon*, A. (2026). Denoising the US Census: Succinct block hierarchical regression. Science, 394(6824), 686–692. https://doi.org/10.1126/science.aej1765", "why": "2020年米国勢調査が差分プライバシーのために加えた雑音を、ブロック階層の簡潔な回帰で取り除き、人口統計の精度を高める方法を示した。", "explain": {"basis": "抄録", "basis_note": "Scienceの抄録（Semantic Scholarで取得）を使用し、本文は入手できず", "preprint": false, "p1": "2020年米国勢調査の開示回避システム（DAS）が雑音を加えた多数の測定から一貫した推定値を作る後処理を、同じプライバシー保証と構造制約のもとでより正確にする新手法BlueDownを示した（抄録）。", "p2": "DASの中心のTopDownは、6つの地理的な階層にわたる数十億の雑音入りの測定を組み合わせる発見的な後処理で、議席の配分や区割り、補助金の配分などに使われる統計の精度を左右する（抄録）。", "p3": "測定の階層構造を使う一般化最小二乗の回帰アルゴリズムを開発し、線形不偏推定量の中で統計的に最適な推定を、地域の数に対して行列積の時間ではなく線形時間で計算できるようにした。構造制約は相関した測定を扱えるよう拡張したTDAの最適化と組み合わせて入れ、対称性を使う簡潔な線形代数の演算で効率を上げた（抄録）。", "p4": "評価は、国勢調査局が提案した評価指標での郡・統計区（トラクト）のレベルの集計の精度である（抄録）。", "p5": "BlueDownは同じプライバシー保証と構造制約を満たしつつ、より正確で一貫した推定値を出し、とくに郡と統計区のレベルの集計で精度が大きく改善した（抄録）。改善の具体的な数値は取得した抄録にない。", "p6": "抄録の範囲では、改善の大きさ、計算時間、人種・年齢などの細かい集計での効果は確かめられない。解釈：最適性は線形不偏推定量の中でのもので、非線形の後処理との比較は別に要る。", "fun": "国勢調査の結果は、個人が特定されないように、わざと少し雑音を混ぜて公表されています。でも雑音が多いと地区ごとの人口が不正確になり、議席の配分や予算にも響きます。この研究は、数字が国・州・郡・地区と入れ子になっている構造をうまく使い、秘密を守ったまま雑音をより多く取り除く方法を作りました。プライバシーと正確さを両立させる工夫が面白いところです。", "unverified": "抄録のみ読んだ（Semantic Scholarで取得したもので、版の違いは未確認）。精度の改善の数値と計算時間は未確認。"}}, {"id": "jn04", "rank": 4, "field": "機械学習", "headline": "深層学習の再現性の限界は初期値の盆地の幾何から", "title": "Fractal basin geometry and the limits to predictability and reproducibility in deep learning", "url": "https://doi.org/10.1038/s42256-026-01336-3", "authors": "Andrew Ly ほか", "venue": "Nature Machine Intelligence", "date": "2026-11-05", "sjr": 6.902, "citescore": 40.9, "citescore_year": "2025", "apa": "Ly, A., & Gong, P. (2026). Fractal basin geometry and the limits to predictability and reproducibility in deep learning. Nature Machine Intelligence. https://doi.org/10.1038/s42256-026-01336-3", "why": "同じ解に至る初期値のすぐ近くに別の解に至る初期値が入り組む盆地の幾何から、深層学習の結果を予測・再現しにくい理由を説明した。", "explain": {"basis": "本文", "basis_note": "Nature Machine Intelligenceの出版社PDFの本文を使用（補足資料は未読）", "preprint": false, "p1": "深層学習で外部の乱数を固定しても学習結果が再現しない理由として、異なる解へ向かう初期値が任意に細かく入り組む「穴だらけの引き込み領域（riddled basin）」を提案し、初期値の精度を上げても結果の予測がほとんど良くならないことを示した（本文）。", "p2": "学習結果の予測しにくさは、初期化の乱数、ミニバッチの順序、GPUの数値誤差などのせいとされてきた。しかしそれらを除いても、パラメータを1ビット変えるだけで大きくばらつくという報告があり、仕組みは分かっていなかった（本文）。", "p3": "力学系の理論の「不確実性指数」を使う。ε以内だけずらした2つの初期値が異なる結果になる割合f(ε)がεのべき乗に比例するとき、その指数がほぼ0なら、精度を上げても再現性は上がらない。対称性が生む不変部分空間への収束という深層学習に広く見られる性質を持つ最小のネットワーク模型で、この状態が生じる道筋を解析的に示し、予測の食い違いに基づく関数版の指数も導入した（本文）。", "p4": "VGGNet・ResNet・BERT、MNIST・CIFAR-10・IMDB、SGD・AdamWなどの組み合わせで約五十万個のネットワークを学習させた。代表例はラベルの半分を誤らせたMNISTでのVGG-12の学習で、非決定的なGPUと決定的なCPUの両方で計算した（本文）。", "p5": "最小模型の指数は0.0126で、f(ε)を半分にするにはεを約24桁小さくする必要がある。VGG-12では千七百七十二通りの終着点が入り混じり、十桁にわたる当てはめで指数は0.000 ± 0.002（GPU・CPUとも）だった。予測が食い違う入力の割合は約2.9%で頭打ちになり、関数版の指数も0.00 ± 0.01で、文献の32の類似度の指標でも同様だった（本文）。", "p6": "著者は、多くのアーキテクチャで対称性による不変部分空間を特定するのは未解決で、終着点の判定も計算が重いと述べる。指数がほぼ0になる条件は最適な学習率と重なることが多く、性能と再現性のトレードオフが示唆されるが、その仕組みは今後の課題とされる（本文）。解釈：大規模言語モデルの事前学習で同じことが起こるかは確かめられていない。", "fun": "同じプログラムとデータで学習し直しても、計算機のわずかな誤差でAIの答えが変わることがあります。この研究は、その原因が「出発点の地図」の形そのものにあると考えました。ある答えに向かう出発点のすぐ隣に、別の答えに向かう出発点が無数に入り込み、どれだけ拡大しても混ざり合ったままなのです。出発点をどれほど精密に決めても結果を言い当てられない、という予測の限界が深層学習に現れる点が面白いところです。", "unverified": "補足資料（設定ごとの結果、汎化誤差との相関の詳細）は未読。"}}, {"id": "jn05", "rank": 5, "field": "経営学", "headline": "取締役会とCEOの信頼が悪材料の隠蔽を招くか", "title": "Board–CEO Trust and Concealing Adverse News", "url": "https://doi.org/10.2308/tar-2024-0298", "authors": "Kee-Hong Bae ほか", "venue": "The Accounting Review", "date": "2026-11-05", "sjr": 4.403, "citescore": 7.5, "citescore_year": "2025", "apa": "Bae, K.-H., El Ghoul, S., Gong, Z., Guedhami, O., & Su, L. (2026). Board–CEO Trust and Concealing Adverse News. The Accounting Review, 1–31. https://doi.org/10.2308/tar-2024-0298", "why": "祖先に基づく一般的信頼の指標を使い、取締役会とCEOの信頼が監督と悪い情報の隠蔽にどう影響するかを検証した。", "explain": {"basis": "抄録", "basis_note": "The Accounting Reviewの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "祖先の出身国に基づく取締役会とCEOの間の一般的信頼が高い企業ほど、株価の暴落リスク（悪材料の溜め込み）が高く、取締役会の監督が緩むことを示した（抄録）。", "p2": "見知らぬ他者を信頼するかという文化に根ざした一般的信頼が、取締役会の監督にどう影響するかは十分に調べられていなかった（抄録）。", "p3": "祖先の出身地と国の間の二国間の信頼スコアから取締役会とCEOの間の信頼を測り、株価暴落リスクとの関係を推定し、代替の暴落リスクの尺度、標本、信頼の尺度で頑健性を確かめた。好材料・悪材料への市場の反応の非対称性、重大な修正再表示、内部者取引のパターンも分析した（抄録）。", "p4": "評価は、信頼と暴落リスクの関連、市場の反応の非対称性、修正再表示の確率、取締役とCEOの情報の差（共謀か監督の緩みか）である（抄録）。", "p5": "取締役会とCEOの信頼は株価暴落リスクと有意に正に関連し、悪材料の溜め込みが多いことを示した。信頼の高い企業では好材料と悪材料への市場の反応がより非対称で、重大な修正再表示の確率も高かった。内部者取引の分析では、信頼の高い企業の取締役はCEOより悪い展開を知らず、共謀ではなく監督の緩みを支持した（抄録）。", "p6": "抄録の範囲では、標本の期間・企業数と効果の大きさは確かめられない。解釈：祖先に基づく信頼は、個人の実際の信頼関係の代理で測定誤差を含む。", "fun": "取締役会は社長（CEO）を監督する役目ですが、両者がお互いを信じすぎるとどうなるでしょうか。この研究では、祖先の出身国から見て信頼し合いやすい組み合わせの会社ほど、悪い知らせが隠され、後でまとめて株価が急落しやすいことが分かりました。信頼は社会の潤滑油ですが、見張り役には逆効果になりうる、という点が面白いところです。", "unverified": "抄録のみ読んだ。標本の期間・企業数、暴落リスクの尺度、効果の大きさは未確認。"}}, {"id": "jn06", "rank": 6, "field": "組織行動・心理的安全性", "headline": "昇進できるという錯覚がエリート職の排除を再生産", "title": "Co‐Constructing the Illusion of Progression: How Boundary Blurring and Affirming Reproduce Social Exclusion in Elite Professions", "url": "https://doi.org/10.1111/joms.70184", "authors": "Stefanie Gustafsson ほか", "venue": "Journal of Management Studies", "date": "2026-11-05", "sjr": 5.178, "citescore": 14.7, "citescore_year": "2025", "apa": "Gustafsson, S., & Empson, L. (2026). Co‐Constructing the Illusion of Progression: How Boundary Blurring and Affirming Reproduce Social Exclusion in Elite Professions. Journal of Management Studies. https://doi.org/10.1111/joms.70184", "why": "境界のぼかしと肯定という関係的な実践が、エリート専門職での社会的排除を再生産する仕組みを示した。", "explain": {"basis": "抄録", "basis_note": "Journal of Management Studiesの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "英国の一流法律事務所で、高地位と低地位の集団の間の境界を「ぼかす」実践と「確認する」実践が絡み合い、まれにしか起きない昇進を可能に見せる「昇進の錯覚」が社会的排除を再生産する仕組みを示した（抄録）。", "p2": "エリート専門職の社会的排除は根強い問題だが、研究は構造的・文化的な障壁に注目し、排除を維持する関係的な実践と仕組みはあまり知られていなかった（抄録）。", "p3": "英国の一流法律事務所の弁護士、パラリーガル、管理職の84人への面接から、専門的な仕事、専門的な空間、昇進の仕組みの3領域で、両集団が社会的・象徴的な境界をぼかし、確認する様子を概念モデルにまとめた（抄録）。", "p4": "評価の対象は、境界のぼかしと確認が排除の再生産にどう寄与するかという関係的な仕組みである（抄録）。", "p5": "境界のぼかしは象徴的な境界を浸透しやすくして低地位の人を「将来の専門職」に位置づけ、境界の確認は専門職の成員資格の社会的な境界を保った。両者の絡み合いから生じる昇進の錯覚は、希望を保たせ、失敗を個人の責任にし、低地位の集団の集合的な異議申し立てを弱めた（抄録）。", "p6": "著者は、この仕組みが組織の多様性と包摂の取り組みで実質的な変化が乏しかった理由の説明に役立つとする（抄録）。解釈：英国の法律事務所という特定の文脈の質的研究で、ほかの専門職への一般化には検証が要る。", "fun": "一流の法律事務所では、事務職から弁護士への道が開かれているように見えます。実際、仕事や職場の境界はあいまいにされ、「いつか君も」と期待させる場面が多いのです。ところが実際の昇進はまれで、うまくいかないのは本人のせいとされ、不公平を声に出しにくくなります。開かれているように見せることが、かえって壁を保つという逆説が面白いところです。", "unverified": "抄録のみ読んだ。面接の時期と、3領域の具体的な実践の例は未確認。"}}, {"id": "jn07", "rank": 7, "field": "経済学", "headline": "FRBの政治的偏りの認識がインフレ期待を変える", "title": "Perceived Political Bias of the Federal Reserve,", "url": "https://doi.org/10.1093/jeea/jvag072", "authors": "Pei Kuang ほか", "venue": "Journal of the European Economic Association", "date": "2026-11-04", "sjr": 7.259, "citescore": 6.7, "citescore_year": "2025", "apa": "Kuang, P., Weber, M., & Xie, S. (2026). Perceived Political Bias of the Federal Reserve,. Journal of the European Economic Association. https://doi.org/10.1093/jeea/jvag072", "why": "5,000人超の調査実験で、FRBを相手側の党派寄りとみる人はインフレ期待が高く信頼が低く、FRBの情報への接し方も異なることを示した。", "explain": {"basis": "抄録", "basis_note": "Journal of the European Economic Associationの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "米国の消費者5,000人超の調査実験で、FRBを相手側の党派寄りとみる少数派はインフレ期待が高く信頼が低く、FRBの情報への接触が少ない一方、触れるとより大きく期待を更新することを示した（抄録）。", "p2": "中央銀行の信認と情報発信の効果は政治的中立性の認識に支えられるが、その認識がマクロ経済の期待・信頼・情報処理をどう形づくるかは実証が乏しかった（抄録）。", "p3": "政治的に代表的な標本での調査実験で、FRBの政治的立場の認識（中立・自党寄り・相手党寄り）を測り、期待と信頼との関係を党派性と属性を統制して推定した。同じ記事にFRBのラベルを付けたときの更新の仕方、相手側のメディアを避けるための支払い意思、仮想のトランプ政権下での認識の変化も調べた（抄録）。", "p4": "評価は、認識の分布、インフレ期待と信頼の差、情報の受け取りやすさと更新の大きさ、仮想の政権下での中立の割合である（抄録）。", "p5": "回答者の63.5%はFRBを中立、9.4%が自党寄り、27.2%が相手党寄りとみた。相手党寄りとみる人は、党派性と属性を統制してもインフレ期待がかなり高く信頼が低かった。相手側のメディアを避けるためにより多く支払い、FRBの情報を受け取りにくいが、触れると事前の考えへの重みを下げて期待をより大きく更新した。仮想のトランプ政権では中立の割合が37.2%に下がり、両党の回答者がFRBを共和党寄りとみる方向に動いた（抄録）。", "p6": "抄録の範囲では、効果の大きさの数値と調査の時期は確かめられない。解釈：仮想の政権の設問は表明された認識で、実際の政権交代での変化とは異なりうる。", "fun": "中央銀行は「政治から中立」だと思われてこそ、物価の見通しを語ったときに人々が信じてくれます。この調査では、FRBを相手の党の味方と見る人ほど物価が上がると予想し、FRBを信頼していませんでした。ところが、そういう人ほどFRBの説明に触れると考えを大きく変えます。届きにくいけれど、届けば効く、という情報発信の難しさが面白いところです。", "unverified": "抄録のみ読んだ。調査の時期、インフレ期待の差の大きさ、実験の操作の詳細は未確認。"}}, {"id": "jn08", "rank": 8, "field": "経済学", "headline": "人種的な憤りの報道を生んだエリートの動機", "title": "The Political Economy of Propaganda: Evidence from US Newspapers,", "url": "https://doi.org/10.1093/jeea/jvag069", "authors": "Sebastian Ottinger ほか", "venue": "Journal of the European Economic Association", "date": "2026-11-04", "sjr": 7.259, "citescore": 6.7, "citescore_year": "2025", "apa": "Ottinger, S., & Posch, M. (2026). The Political Economy of Propaganda: Evidence from US Newspapers,. Journal of the European Economic Association. https://doi.org/10.1093/jeea/jvag069", "why": "19世紀末の米国南部の新聞を使い、社会を分断して政治的利益を得たいエリートの動機がメディアの人種的な憤りを生んだかを検証した。", "explain": {"basis": "抄録", "basis_note": "Journal of the European Economic Associationの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "19世紀末の米国南部で、社会を分断して政治的な利益を得ようとした民主党のエリートが、新聞を通じて人種的な憤りをあおる宣伝を組織したことと整合する証拠を、高頻度の新聞データで示した（抄録）。", "p2": "メディアの人種的な憤りが、社会の分断で政治的な利益を得たいエリートの動機から生まれうるかは、実証が難しかった（抄録）。", "p3": "当時、民主党は人種的な憤りをあおる強い政治的な動機を持ち、地元の民主党のエリートは唯一のマスメディアだった新聞に大きな影響力を持っていた。高頻度の歴史的な新聞データに、差の差と三重差の推定を当てはめた（抄録）。", "p4": "評価の対象は、宣伝の組織と整合する報道の変化と、その後の選挙結果との関係である（抄録）。比較の単位（新聞・郡・時期）は抄録に記載がない。", "p5": "推定の結果は、民主党のエリートが白人の有権者を動かすために人種差別的な宣伝を組織したことと整合した。補足の分析も、その後の選挙で民主党が反黒人の宣伝から利益を得たことと整合した（抄録）。", "p6": "抄録の範囲では、宣伝の測り方（記事の分類の方法）と効果の大きさは確かめられない。解釈：結論は「整合する」証拠で、宣伝の指示の系統を直接示す史料ではない。", "fun": "新聞が人々の怒りをあおる記事を載せるのは、売れるからだけでしょうか。この研究は、百年以上前のアメリカ南部で、選挙で勝ちたい政治家たちが新聞を使って人種への憎しみをかき立てていた形跡を、大量の古い新聞から統計的に見つけました。分断が誰かの得になるように作られることがある、という指摘が今の情報社会にも通じて面白いところです。", "unverified": "抄録のみ読んだ。対象の新聞・地域・期間と、報道の分類の方法は未確認。"}}, {"id": "jn09", "rank": 9, "field": "機械学習", "headline": "子ども一人ひとりの日常の発話から言語学習を再現", "title": "The first 1000 days: Modeling language learning from individual children’s everyday speech", "url": "https://doi.org/10.1126/science.aeh9311", "authors": "Hadas Raviv ほか", "venue": "Science", "date": "2026-11-05", "sjr": 10.948, "citescore": 44.6, "citescore_year": "2025", "apa": "Raviv, H., Tsyhanov, A., Gousios, K., Altenhof, A., Wang, H., Chen, B., Raviv, O., Rosenwein, T., Lew-Williams, C., Hasenfratz, L., & Hasson, U. (2026). The first 1000 days: Modeling language learning from individual children’s everyday speech. Science, 394(6824). https://doi.org/10.1126/science.aeh9311", "why": "8人の子どもが生後1000日に家庭で聞いた発話の縦断録音で子ども別のモデルを学習させ、音素や語形に似た表現が各自の学習ペースに沿って発達することを示した。", "explain": {"basis": "抄録", "basis_note": "Scienceの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "8人の子どもが生後1000日に家庭で聞いた日常の発話の縦断録音で子ども一人ひとりのモデルを学習させ、日常の経験には言語の学習に十分な構造があることを示した（抄録）。", "p2": "子どもは周りの発話から言葉を学ぶが、日常の入力がどう学習を形づくるかは未解決だった。大規模言語モデルはデータから言語を学べることを示したが、その規模と学習条件は子どもの自然な経験と大きく異なる（抄録）。", "p3": "認知的に無理のない子ども別のモデルを、その子どもの順序どおりの発話の入力から、事前の言語知識なしに逐次的に学習させた（抄録）。", "p4": "評価の対象は、音素や語形に似た表現が発達するか、その発達が各子どもの学習のペースに沿うか、学習に必要な条件（日々の密な標本と最近の入力の再生）である（抄録）。", "p5": "各モデルは音素に似た表現と語形の表現を発達させ、その発達は各子どもの学習のペースに沿っていた。学習は日々の密な標本と最近の入力の再生（リプレイ）に依存し、経験と記憶の両方の過程が必要なことを示した（抄録）。", "p6": "抄録の範囲では、学習した表現の評価方法と、子どもの実際の語彙の発達との一致の程度は確かめられない。解釈：8人という少数の家庭の録音で、言語や家庭環境の多様さへの一般化には限界がある。", "fun": "赤ちゃんは、だれにも文法を教わらずに言葉を話せるようになります。この研究は、8人の子どもが生まれてから1000日の間に家で聞いた声の録音で、子ども一人ひとり専用の小さなAIを育てました。するとAIも、その子と同じようなペースで音や単語のまとまりをつかんでいきました。毎日たくさん聞くことと、少し前に聞いたことを思い出すことが欠かせなかった点が面白いところです。", "unverified": "抄録のみ読んだ。録音の総時間、モデルの構造、評価の指標の数値は未確認。"}}, {"id": "jn10", "rank": 10, "field": "心理学・認知科学", "headline": "米国の潜在的・顕在的な偏見は2021年以降に増加", "title": "Patterns of implicit and explicit attitudes V: Increases in bias from 2021 to 2025", "url": "https://doi.org/10.1073/pnas.2619420123", "authors": "Tessa E. S. Charlesworth ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-04", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Charlesworth, T. E. S., Doyle, M. C., & Banaji, M. R. (2026). Patterns of implicit and explicit attitudes V: Increases in bias from 2021 to 2025. Proceedings of the National Academy of Sciences, 123(45). https://doi.org/10.1073/pnas.2619420123", "why": "2007〜2020年に減少していた集団間態度の偏りが、2021〜2025年の新しいデータでは増加に転じたことを示した。", "explain": {"basis": "抄録", "basis_note": "PNASの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "2007〜2020年に偏りが減り続けていた米国の潜在的・顕在的な集団間態度が、2021〜2025年の280万人のデータでは停滞し、一部では逆転して偏りが増えたことを示した（抄録）。", "p2": "2007〜2020年の傾向からは、集団間の態度は中立に向かい続けると予測されていたが、2020年以降の変化は分かっていなかった（抄録）。", "p3": "2021〜2025年の5年間の米国の回答者280万人の新しいデータで、潜在的な指標と顕在的な指標の時系列を過去の傾向と比べ、変化点の分析で転換の時期を調べた。米国外の274,884人の国際標本でも確かめた（抄録）。", "p4": "評価は、話題（性的指向、トランスジェンダー、人種、肌の色、年齢、障害、体重）ごとの偏りの変化率、潜在と顕在の転換の時期の差、属性による違いである（抄録）。", "p5": "最大の逆転は性的指向・トランスジェンダー・人種・肌の色で、潜在的な指標で12〜22%、顕在的な指標で24%から3倍超まで偏りが増えた。年齢・障害・体重の偏りもより緩やかに増えた。潜在的な態度は顕在的な報告より約1年早く反転した。以前に最も偏りが減った20歳未満の回答者が今は最も大きく増え、政治と性別とも交互作用した（若い保守系の男性が最も増えやすい）（抄録）。", "p6": "探索的な分析は単一の原因による説明を退け、著者は、コロナ禍の脅威、経済の不安、政治的な分断、ネットの有害さが重なった2020〜2021年の社会政治的な転換点が最も良い説明だと提案する（抄録）。解釈：回答者が自発的な参加者なら、母集団を代表しない可能性がある。", "fun": "差別や偏見は時代とともに少しずつ減っていく、と多くの人が思っていました。実際、2020年までのデータはそうでした。ところが、その後の280万人のデータでは、人種や性的指向などへの偏見が再び強まっていました。しかも、本人も気づかない「無意識の偏見」が、口に出す偏見より1年ほど早く変わり始めていました。社会の空気が個人の心にまで入り込む様子をとらえた点が面白いところです。", "unverified": "抄録のみ読んだ。標本の募集方法、測定課題の詳細、変化点の推定の不確実性は未確認。"}}, {"id": "jn11", "rank": 11, "field": "統計学", "headline": "連続時間マルコフ連鎖の遷移率をノンパラメトリックに推定", "title": "Nonparametric modelling of continuous-time Markov chains with scalable exact and approximate gradients", "url": "https://doi.org/10.1093/jrsssb/qkag138", "authors": "Filippo Monti ほか", "venue": "Journal of the Royal Statistical Society Series B: Statistical Methodology", "date": "2026-11-04", "sjr": 3.734, "citescore": 7.6, "citescore_year": "2025", "apa": "Monti, F., Ji, X., Shao, Y., & Suchard, M. A. (2026). Nonparametric modelling of continuous-time Markov chains with scalable exact and approximate gradients. Journal of the Royal Statistical Society Series B: Statistical Methodology. https://doi.org/10.1093/jrsssb/qkag138", "why": "状態数の二乗で増えるパラメータなどの課題に対し、スケーラブルな正確・近似勾配で連続時間マルコフ連鎖の遷移率を推定した。", "explain": {"basis": "抄録", "basis_note": "JRSS-Bの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "連続時間マルコフ連鎖（CTMC）の遷移率を、共変量をガウス過程で取り込む非パラメトリックなベイズモデルで推定し、ハミルトニアン・モンテカルロのための厳密・近似の勾配を安く計算する方法を示した（抄録）。", "p2": "CTMCの瞬間的な遷移率の推定は、状態空間とともに遷移率の数が2乗で増えること、遷移率どうしの強い依存、多くの遷移の情報の不足という3つの要因で難しく、従来法は共変量の線形の効果に限られていた（抄録）。", "p3": "遷移率を共変量のガウス過程として柔軟にモデル化して非線形の関係を捉え、事後推論にハミルトニアン・モンテカルロを使う。行列指数関数の微分を繰り返す高い費用を避けるため、厳密と近似の2つの勾配の計算法を作り、観測N個・状態K個のとき費用をO(NK³)からO(K³+NK²)に下げた（抄録）。", "p4": "合成データと実データでの系統学的・系統地理学的なベイズ推論に適用し、推定の性能と、状態の数Kに対する計算の伸び方を評価した（抄録）。", "p5": "合成データと実データの両方で良い性能を示し、計算時間はKに対して経験的に2乗で伸び、N<Kの場合でも同様だった（抄録）。", "p6": "抄録の範囲では、比較した既存の手法との精度の差と、共変量の選び方の影響は確かめられない。解釈：応用は系統地理学に限られ、人の移動など他分野の状態遷移データへの適用には検証が要る。", "fun": "天気が「晴れ→曇り→雨」と移り変わるように、状態がランダムに切り替わる現象は、切り替わりの起こりやすさ（遷移率）で表せます。状態の種類が増えると遷移率の数は2乗で増え、推定は大変になります。この研究は、外の要因が遷移率にどう効くかを曲線で柔軟に表しつつ、計算を大幅に軽くする工夫をしました。何が切り替えを後押ししているかまで読み解ける点が面白いところです。", "unverified": "抄録のみ読んだ。計算時間の比較の数値と、実データの内容は未確認。"}}, {"id": "jn12", "rank": 12, "field": "計算社会科学・ネットワーク科学", "headline": "人種と所得の差は日常の移動パターンに表れる", "title": "Beyond proximity: How racial and income differences are reflected in mobility patterns across neighborhoods in American cities", "url": "https://doi.org/10.1093/pnasnexus/pgag341", "authors": "Binzhe Wang ほか", "venue": "PNAS Nexus", "date": "2026-11-06", "sjr": 1.339, "citescore": 6.7, "citescore_year": "2025", "apa": "Wang, B., Sevtsuk, A., & Basu, R. (2026). Beyond proximity: How racial and income differences are reflected in mobility patterns across neighborhoods in American cities. PNAS Nexus. https://doi.org/10.1093/pnasnexus/pgag341", "why": "米国の都市で、近隣の人種・階層の違いが日常の移動パターンにどう反映されるかを一貫した指標で測った。", "explain": {"basis": "抄録", "basis_note": "PNAS Nexusの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "米国の大都市498の携帯電話の移動データで、近隣どうしの人種の違いは所得の違いより強く地区間の移動を減らし、その効果は平均の移動時間を17%（所得は8%）増やすのに相当することを示した（抄録）。", "p2": "都市の分離は広く研究されてきたが、人種と階層による近隣の違いが日々の移動にどう影響するかは、一貫した指標がなく理解が遅れていた。従来の空間的なアクセシビリティの指標や都市内の移動の理論モデルは、移動の社会的な側面を反映しない（抄録）。", "p3": "国勢調査のブロックグループ単位の携帯電話の移動データで、近隣間の社会的な特徴の違いが市内の移動先にどう表れるかを調べ、人種と所得の違いが近隣間の移動の減少とどれだけ結びつくかを、時間に換算する新しい指標で表した（抄録）。", "p4": "評価は、人種・所得の違いと近隣間の移動量の関連を平均の移動時間への上乗せに換算し、都市の中と都市の間で比べることである（抄録）。", "p5": "人種の違いは所得の違いより近隣間の移動と強く負に関連し、移動の減少は平均移動時間の17%（所得は8%）を足すのに相当した。米国の都市の移動は、地理的な近さだけでなく社会的な親和性も反映していた（抄録）。", "p6": "抄録の範囲では、携帯電話データの偏り（利用者の構成）と移動の目的の区別は確かめられない。解釈：関連の分析で、移動の減少が好みによるのか、制約や不安によるのかは区別できない。", "fun": "近所のお店に行くか、少し遠いお店に行くかは、ふつう距離や時間で決まると考えます。ところが米国の都市では、住んでいる人の人種が違う地区どうしの行き来は、まるで移動時間が17%長くなったかのように少なくなっていました。所得の違いの効果の2倍ほどです。地図の上の距離とは別の「心の距離」が人の動きを形づくっている点が面白いところです。", "unverified": "抄録のみ読んだ。指標の推定式、携帯電話データの提供元と期間、都市間の差の分布は未確認。"}}, {"id": "jn13", "rank": 13, "field": "統計学", "headline": "t-SNEが失うデータの構造を理論的に示す", "title": "Some theoretical limitations of t-SNE", "url": "https://doi.org/10.1073/pnas.2613435123", "authors": "Rupert Li ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-05", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Li, R., & Mossel, E. (2026). Some theoretical limitations of t-SNE. Proceedings of the National Academy of Sciences, 123(45). https://doi.org/10.1073/pnas.2613435123", "why": "可視化で広く使われるt-SNEで、重要な構造情報が失われる場合を数学的な枠組みで定量的に示した。", "explain": {"basis": "抄録", "basis_note": "PNASの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "可視化で広く使われるt-SNEで、重要な構造の情報がどのように失われるかを理解する数学的な枠組みを示し、いくつかの場面で定量的な結果を確立した（抄録）。", "p2": "次元削減が重要なデータの特徴を失いうることはよく知られているが、t-SNEでの損失を数学的に説明する理論は乏しかった（抄録）。", "p3": "高次元での近さの確率を低次元のt分布の近さに合わせて配置を決めるt-SNE（t分布の確率的近傍埋め込み）について、その情報の損失を数学的に扱う枠組みを作った（抄録）。背景：t-SNEの目的関数は非凸で、結果が初期値や設定に依存する。", "p4": "評価の対象は、異なる場面（データの構造の種類）で、どのような構造の情報が失われるかの定量的な結果である（抄録）。具体的な場面は抄録に記載がない。", "p5": "異なる場面にわたって重要な構造の情報が失われることを示す、いくつかの定量的な結果を確立した（抄録）。定理の具体的な内容は取得した抄録にない。", "p6": "抄録が短く、どのような構造（距離、クラスターの大きさ、大域的な配置など）が失われると示したかは確かめられない。解釈：理論的な限界の指摘で、実務での使い方の指針は本文で確かめる必要がある。", "fun": "たくさんの特徴を持つデータを平面の地図に描いてくれるt-SNEは、画像や文章のデータの可視化など幅広く使われています。でも、地図にすると見えなくなる情報があるはずです。この研究は、何が、どんな場合に失われるのかを数学で示そうとしました。きれいな図ほど信じてしまいがちな私たちに注意を促す点が面白いところです。", "unverified": "抄録のみ読んだ（抄録は3文）。定理の内容と前提、扱った場面は未確認。"}}, {"id": "jn14", "rank": 14, "field": "機械学習", "headline": "大人・子ども・AIの探索の内発的動機を比べる", "title": "Intrinsically motivated humans and agents in open-world exploration", "url": "https://doi.org/10.1073/pnas.2612366123", "authors": "Aly Lidayan ほか", "venue": "Proceedings of the National Academy of Sciences", "date": "2026-11-04", "sjr": 3.283, "citescore": 14.7, "citescore_year": "2025", "apa": "Lidayan, A., Du, Y., Kosoy, E., Rufova, M., Abbeel, P., & Gopnik, A. (2026). Intrinsically motivated humans and agents in open-world exploration. Proceedings of the National Academy of Sciences, 123(45). https://doi.org/10.1073/pnas.2612366123", "why": "開かれた環境Crafterでの探索を、エントロピー・情報利得・エンパワーメントという内発的目的から大人・子ども・AIエージェントで直接比べた。", "explain": {"basis": "抄録", "basis_note": "PNASの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "大人、8〜12歳の子ども、AIエージェントが開かれたゲーム環境Crafterを探索する様子を直接比べ、情報理論の3つの内発的な目的（エントロピー、情報利得、エンパワーメント）が探索の進み具合とどう結びつくかを示した（抄録）。", "p2": "何が探索を駆り立てるのかという内発的動機の理解は、認知科学とAIの両方で長年の課題だったが、人とAIを同じ複雑な環境で直接比べた研究は少なかった（抄録）。", "p3": "Crafterでの人とエージェントの行動から、エントロピー（訪れる状態の多様さ）、情報利得（環境について学べる量）、エンパワーメント（自分が環境をどれだけ制御できるか）を求め、探索の進捗との相関と時間変化を調べた。子どもの目標についての独り言（私的発話）も分析した（抄録）。", "p4": "評価は、3つの目的と探索の進捗の相関、子どもと大人の違い、探索の段階による目的の変化である（抄録）。参加者数は抄録に記載がない。", "p5": "3つの目的はいずれも子どもと大人の探索の進捗と正に相関し、子どもではエントロピーとエンパワーメントが情報利得より強く関連した。エージェントと人のどちらでも、エントロピーは最初に急に増えて頭打ちになり、エンパワーメントは増え続けた。初期は新しい状態を、後期は自分が制御できる状態を探していると示唆される。独り言が子どもの探索を助ける予備的な証拠もあった（抄録）。", "p6": "独り言の効果は予備的な証拠にとどまると著者は述べる（抄録）。解釈：相関の分析で、内発的な目的が探索の原因だとは言えない。", "fun": "子どもは誰に言われなくても新しい遊び場を探検します。この研究は、道具や建物を作る冒険ゲームのような環境で、大人・子ども・AIの探検の仕方を比べました。最初は「見たことのない場所」を求め、慣れてくると「自分の思いどおりにできること」を増やしていく、という共通の流れが見つかりました。「次はあれを作ろう」と独り言を言う子ほど探検が進むかもしれない、という点も面白いところです。", "unverified": "抄録のみ読んだ。参加者数、AIエージェントの種類、相関の大きさは未確認。"}}, {"id": "jn15", "rank": 15, "field": "因果推論", "headline": "画像の埋め込みでトピックを推定する構造トピックモデル", "title": "An Image Is Worth K Topics: A Visual Structural Topic Model with Pretrained Image Embeddings", "url": "https://doi.org/10.1017/pan.2026.10062", "authors": "Matías Piqueras ほか", "venue": "Political Analysis", "date": "2026-11-05", "sjr": 4.368, "citescore": 13.5, "citescore_year": "2025", "apa": "Piqueras, M., Segerberg, A., Magnani, M., Magnusson, M., & Sladoje, N. (2026). An Image Is Worth K Topics: A Visual Structural Topic Model with Pretrained Image Embeddings. Political Analysis, 1–20. https://doi.org/10.1017/pan.2026.10062", "why": "事前学習した画像の埋め込みを使い、画像の内容をトピックとして推定する視覚版の構造トピックモデルを示した。", "explain": {"basis": "本文", "basis_note": "Political Analysisの出版社HTMLの本文を使用（補足資料と図は未確認）", "preprint": false, "p1": "政治学で大量の画像を分析するため、事前学習済みの画像埋め込み（CLIPなど）を構造的トピックモデル（STM）に組み込んだ視覚STM（vSTM）を提案し、気候変動会議をめぐるX（旧Twitter）の画像で解釈しやすいトピックが得られることを示した（本文）。", "p2": "画像は文章と違う意味を伝えうるが、大規模な政治分析では添えられた文章に頼ることが多かった。既存の視覚トピックモデルは色や模様などの低レベルの特徴に頼るか、1枚を1つのグループにしか割り当てなかった（本文）。", "p3": "各画像の埋め込みを、トピックのベクトルをトピック比率で混ぜた点を平均とする正規分布でモデル化する。トピック比率はロジスティック正規分布に従い、その平均が共変量（年、発信者の種類、立場）に依存するので、どんな発信者がどのトピックを多く使うかを推定できる。推定は変分推論で、使いやすいソフトウェアも公開した（本文）。", "p4": "第21〜27回の国連気候変動会議（COP）のハッシュタグで、投稿の多い約千七百のアカウントが載せた約十五万枚の画像を使い、トピック数は45とした。既存の方法との比較には、専門家が意味の近さを評価した500組の画像を使った（本文）。", "p5": "4人の研究者が、同じトピックの3枚に紛れた別トピックの1枚を当てる課題で約65%正答した。気候行動に賛成の個人は穏やかなデモの画像を、反対の個人は警察との衝突や交通の妨害を強調する画像を投稿していた。CLIPやGPT-4oの説明文のような豊かな表現を使う方法は、視覚的な単語の袋や物体検出のラベルを使うSTMを、すべてのトピック数で大きく上回った（本文）。", "p6": "著者は、図の結果は投稿の多いアカウントの画像で人気の投稿ではなく、反対の立場のアカウントはごく少ないため慎重に解釈すべきだと述べる。変分推論では共変量とトピックの関係の不確実性を信頼できる形で示せず、埋め込みの選び方による偏りも今後の課題とされる（本文）。解釈：トピックの名付けは人の解釈に頼るため、分析者による差が出うる。", "fun": "「1枚の画像は千の言葉に値する」と言いますが、この論文の題は「1枚の画像はK個のトピックに値する」です。政治家や活動家がSNSに載せる大量の写真を、AIの画像理解を使って自動で話題に分け、誰がどんな写真を好んで使うかまで調べられます。気候デモの写真でも、賛成派は穏やかな行進を、反対派は警察との衝突を選んで載せていた、という違いが見えてくる点が面白いところです。", "unverified": "補足資料（埋め込みごとの比較、紛れた画像を当てる課題の詳細）と図の数値は未確認。"}}, {"id": "jn16", "rank": 16, "field": "組織行動・心理的安全性", "headline": "情熱の先行要因を生物心理社会の組合せで捉える", "title": "Rethinking the Anatomy of Passion: A Biopsychosocial Configurational Perspective on Antecedents of Work and Entrepreneurial Passion", "url": "https://doi.org/10.1002/job.70133", "authors": "Olivia Aronson ほか", "venue": "Journal of Organizational Behavior", "date": "2026-11-05", "sjr": 3.999, "citescore": 14.2, "citescore_year": "2025", "apa": "Aronson, O., Astakhova, M., Hamrick, A., Murnieks, C., & Switz, H. (2026). Rethinking the Anatomy of Passion: A Biopsychosocial Configurational Perspective on Antecedents of Work and Entrepreneurial Passion. Journal of Organizational Behavior. https://doi.org/10.1002/job.70133", "why": "仕事と起業の情熱の先行要因を、加算的にではなく生物・心理・社会的要因の組合せとして捉え直した。", "explain": {"basis": "抄録", "basis_note": "Journal of Organizational Behaviorの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "仕事と起業の情熱を、生物・心理・社会的な条件の組み合わせから生じる現象として捉え直し、調和的な情熱と強迫的な情熱、仕事と起業の領域ごとに異なる条件の組み合わせがあることを示した（抄録）。", "p3": "生物心理社会（BPS）の枠組みに基づき、時間差をおいて測った従業員と起業家の2つの標本にファジィ集合の質的比較分析（fsQCA）を当てはめ、異なる経路が同じ結果に至る等結果性を検討した（抄録）。", "p5": "調和的な情熱と強迫的な情熱、仕事と起業の情熱を区別する複数の構成が見つかり、情熱は領域に依存し、普遍的に働く先行要因より領域ごとに固有の組み合わせと結びついていた（抄録）。", "fun": "「好きなことに夢中になる」情熱には、生活と調和した健全なものと、やめられなくなる強迫的なものがあります。この研究は、体・心・人間関係の条件が単独ではなく組み合わせで情熱を生むと考え、会社員と起業家では情熱を生む組み合わせがほとんど違うことを示しました。情熱の「レシピ」は一つではない、という点が面白いところです。", "unverified": "標本の大きさと、構成の具体的な条件は抄録では未確認。"}}, {"id": "jn17", "rank": 17, "field": "経営学", "headline": "企業集団が世界中にある理由を所有権理論で説明", "title": "The Ubiquity of Business Groups around the World: A Property‐Rights Theory", "url": "https://doi.org/10.1111/joms.70179", "authors": "Ruth V. Aguilera ほか", "venue": "Journal of Management Studies", "date": "2026-11-05", "sjr": 5.178, "citescore": 14.7, "citescore_year": "2025", "apa": "Aguilera, R. V., Crespi‐Cladera, R., Martín‐Oliver, A., & Pascual‐Fuster, B. (2026). The Ubiquity of Business Groups around the World: A Property‐Rights Theory. Journal of Management Studies. https://doi.org/10.1111/joms.70179", "why": "所有関係でつながる企業集団が途上国と先進国の両方に広く存在する理由を所有権理論から説明した。", "explain": {"basis": "抄録", "basis_note": "Journal of Management Studiesの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "法的に独立した企業が所有関係でつながる企業集団が世界中に広く存在する理由を、所有権理論を資産の法的な分割にまで広げて説明した（抄録）。", "p3": "所有権の配分の仕組みとして資産の法的な分割を加えた理論枠組みを作り、世界の大規模な企業データで、企業固有の資産と所有の共有が、企業集団にするか単独の企業にするかの判断に与える影響を調べた（抄録）。", "p5": "支配的な所有者が企業固有の資産に依存するほど、また所有が共有されている（されうる）ほど、企業集団の形を選ぶ確率が高まった。結果は集中型・垂直統合型・多角化型の3つの戦略的な構成で頑健だった（抄録）。", "fun": "企業グループは、制度が整っていない国で頼れる仕組みとして生まれた、と説明されることが多くありました。でも先進国にも企業グループはたくさんあります。この研究は、資産を法的にいくつかの会社に分けて持つこと自体に、資産や共同所有の複雑さをうまく扱う意味があると説明しました。説明の土台を入れ替える発想が面白いところです。", "unverified": "データの規模（企業数・国数）と効果の大きさは抄録では未確認。"}}, {"id": "jn18", "rank": 18, "field": "統計学", "headline": "調整分析で欠測データに対処する実践ガイド", "title": "Mind the Gap: A Practical Guide for Effectively Addressing Missing Data in Moderation Analysis", "url": "https://doi.org/10.1177/25152459261450058", "authors": "Guyin Zhang ほか", "venue": "Advances in Methods and Practices in Psychological Science", "date": "2026-11-05", "sjr": 6.094, "citescore": 14.8, "citescore_year": "2025", "apa": "Zhang, G., Fairchild, A. J., Keller, B., & Shi, D. (2026). Mind the Gap: A Practical Guide for Effectively Addressing Missing Data in Moderation Analysis. Advances in Methods and Practices in Psychological Science, 9(4). https://doi.org/10.1177/25152459261450058", "why": "調整（交互作用）分析で欠測データを扱う現代的な手法の適切な使い方を実践的に示した。", "explain": {"basis": "抄録", "basis_note": "Advances in Methods and Practices in Psychological Scienceの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "調整（交互作用）分析で欠測データを扱う高度な手法である因子分解回帰の指定（FRS）を、尺度と項目の両レベルで実施するための実践的な手引きを示した（抄録）。", "p3": "交互作用項の非正規性による仮定の違反や、項目レベルの欠測と尺度レベルの分析の整合という課題に対し、連続変数とカテゴリ変数を含む様々な交互作用の場面でFRSを行う手順を段階的に示した（抄録）。", "p5": "項目レベルの欠測を含む連続変数の交互作用で単純傾斜を調べる新しいコード化の方法を導き、実装のためのRコードと実務上の推奨を提供した（抄録）。", "fun": "「ある条件で効果が強まるか」を調べる交互作用の分析では、アンケートの一部の項目に答えていない人がいると、扱い方を誤って結論がゆがむことがあります。この論文は、その落とし穴を避ける手順を、Rのコードつきで一歩ずつ示しました。地味でも多くの研究者の役に立つ道具を整えた点が面白いところです。", "unverified": "シミュレーションによる性能比較の有無は抄録では未確認。"}}, {"id": "jn19", "rank": 19, "field": "経営学", "headline": "過去のA/Bテストを統合して施策の価値を評価", "title": "Overall Evaluation Criteria for A/B Tests: A Meta-Analytic Approach", "url": "https://doi.org/10.1287/mksc.2025.0164", "authors": "Easton Huch ほか", "venue": "Marketing Science", "date": "2026-11-05", "sjr": 8.324, "citescore": 9.3, "citescore_year": "2025", "apa": "Huch, E., Nail, S. A., Melconian, T., Vongsathorn, X., & Feinberg, F. (2026). Overall Evaluation Criteria for A/B Tests: A Meta-Analytic Approach. Marketing Science. https://doi.org/10.1287/mksc.2025.0164", "why": "複数の結果変数を持つ過去のA/Bテストのデータベースから、マーケティング施策の価値をメタ分析で推定する方法を論じた。", "explain": {"basis": "抄録", "basis_note": "Marketing Scienceの抄録（1文のみ）を使用", "preprint": false, "short": true, "p1": "複数の結果変数を持つ過去のA/Bテストのデータベースから、マーケティング施策の価値をメタ分析の方法で推定することを論じた（抄録）。", "p3": "未確認（抄録は1文で、推定の方法とデータの記載なし）", "p5": "未確認（抄録に結果の記載なし）", "fun": "ネット企業は、表示の順番やデザインを少しずつ変えて効果を比べるA/Bテストを日常的に行っています。結果の指標はクリック、購入、継続などいくつもあり、どれで判断するかが悩みどころです。過去の大量のテストをまとめて分析し、施策の本当の価値を測る物差しを作ろうという問いが面白いところです。", "unverified": "抄録が1文のみで、手法・データ・結果はいずれも未確認。"}}, {"id": "jn20", "rank": 20, "field": "組織行動・心理的安全性", "headline": "朝の仕事の見通しがフローと回復を左右する", "title": "Waking Up to the Working Day Ahead: A Diary Study on the Role of Flow in Linking Morning Anticipatory Appraisals to Recovery", "url": "https://doi.org/10.1007/s10902-026-01112-5", "authors": "Kirsten Handschuch ほか", "venue": "Journal of Happiness Studies", "date": "2026-11-05", "sjr": 1.378, "citescore": 7.1, "citescore_year": "2025", "apa": "Handschuch, K., Syrek, C., & Peifer, C. (2026). Waking Up to the Working Day Ahead: A Diary Study on the Role of Flow in Linking Morning Anticipatory Appraisals to Recovery. Journal of Happiness Studies, 27(8). https://doi.org/10.1007/s10902-026-01112-5", "why": "日誌法で、朝の予期的な評価が仕事中のフロー経験と仕事後の回復にどうつながるかを調べた。", "explain": {"basis": "抄録", "basis_note": "Journal of Happiness Studiesの抄録（Crossref登録）を使用", "preprint": false, "short": true, "p1": "朝に仕事の一日をどう見通すか（予期的評価）が、仕事中のフロー経験を通じて、就寝時の仕事についての反すうを減らすことを日誌研究で示した（抄録）。", "p3": "従業員102人が連続10営業日、1日3回の調査に答え、肯定的・挑戦・脅威・阻害の4種類の朝の予期的評価、日中のフロー、夕方の活力、就寝時の感情的な反すうの関係を多層媒介分析で調べた（抄録）。", "p5": "朝の挑戦と肯定的な評価は日中のフローと正に、脅威の評価は負に関連した。フローは就寝時の反すうの少なさを予測し、朝の評価の効果を媒介したが、夕方の活力とは有意に関連しなかった（抄録）。", "fun": "朝に「今日の仕事は手応えがありそう」と思えた日は、仕事に没頭するフロー状態に入りやすく、夜に仕事のことをくよくよ考えずに眠れる。逆に「まずいことになりそう」と思った日はフローに入りにくい。一日の過ごし方が朝の見通しで方向づけられる、という身近な発見が面白いところです。", "unverified": "効果の大きさの数値は抄録では
