<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">

<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>

    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>

    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

Nの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "公開企業が関わったAI事故が、その後の米国の証券開示（8-K、10-K、10-Q）にどれだけ現れるかを初めて体系的に測った。", "p3": "AI事故データベースの2019〜2026年の事故1,389件を上場企業に照合して307件・21社を得て、事故後12か月の開示を、事故固有（T1）、関連する法的帰結（T2）、一般的なリスク記述（T3）、記述なし（T4）に事前登録した基準で符号化した（抄録）。", "p5": "T1は4件、T2は3件、T3は278件、T4は22件で、事故固有の開示は1.3%（95%信頼区間0.4〜3.3）にとどまり、97.7%は事故固有の開示が見当たらない「開示の影」だった（抄録）。", "fun": "ニュースになるようなAIの事故が起きても、会社の公式な報告書にはほとんど書かれていないことを数えて示した研究。書かれないことを測るのは難しいが、事故の一覧と報告書を一件ずつ突き合わせることで「沈黙」を数字にしている。", "unverified": "T3の記述の具体例と、照合の誤りの評価方法は抄録からは確認できなかった。"}}, {"id": "pr18", "rank": 18, "headline": "財務テキストの匿名化で失われる情報", "title": "Anonymization and Information Loss", "url": "https://doi.org/10.2139/ssrn.7653699", "authors": "Ke Wu ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Wu, K., Ying, Z., Yang, B., & Zhou, D. (2026). Anonymization and Information Loss. https://doi.org/10.2139/ssrn.7653699", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "LLMの先読みバイアスを防ぐために財務テキストの固有名詞を伏せる匿名化が、経済的に重要な情報まで消してしまうことを示した。", "p3": "情報の損失とバイアスの除去を分ける枠組みから4つの予測を導き、モデルの学習期限より後の決算説明会の記録で、生のテキストと匿名化したテキストから抽出した点数の格付け引下げの予測力を比べた（抄録）。", "p5": "生のテキストの点数は格付け引下げを強く予測したが、匿名化した点数は弱まり、生の点数を入れると追加の予測力がなかった。弱まりの主因は情報の損失で、損失のおよそ5分の3は残った証拠の読み方の歪みによるとした（抄録）。", "fun": "AIに過去のデータを読ませて未来を当てさせるとき、AIが答えを「すでに知っている」ずるを防ぐために会社名を隠すのが定番だった。ところが隠すと大事な手がかりまで消え、予測力が落ちたのは「ずるが減ったから」ではなかった、という指摘が鋭い。", "unverified": "使用したLLMの種類と、4つの追加の予測課題の内容は抄録からは確認できなかった。"}}, {"id": "pr19", "rank": 19, "headline": "訴えられた企業でアナリスト予想はどう変わるか", "title": "Being Sued, Not Suing: Litigation and the Analyst Information Environment", "url": "https://doi.org/10.2139/ssrn.7651778", "authors": "Karina Zhang ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Zhang, K., Cheng, Y., & Ndum, R. (2026). Being Sued, Not Suing: Litigation and the Analyst Information Environment. https://doi.org/10.2139/ssrn.7651778", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "企業が訴えられると、アナリストの業績予想のばらつきが広がることを示した。", "p3": "2000〜2024年のアナリストが付く米国企業56,407企業年で、被告になった前後の予想のばらつきを企業内で比べ、裁判所の地理を操作変数とする推定も行った（抄録）。", "p5": "被告になると予想のばらつきが中央値の約3分の1増え、原告になっても変化はなかった。ばらつきは訴訟が続く間続き、和解でも却下でも決着とともに消えた（抄録）。", "fun": "「情報が公開されれば専門家の意見はそろう」と考えられてきたが、訴訟のように結末が分からない情報が公開されると、かえって意見が割れる。情報には「答えを教えるもの」と「未解決の問いを増やすもの」がある、と気づかせてくれる。", "unverified": "ばらつきの指標の正確な定義と、操作変数推定の係数の大きさは抄録からは確認できなかった。"}}, {"id": "pr20", "rank": 20, "headline": "支払異常の検知と運転資本判断を組み合わせる", "title": "PayGuard AI: An Explainable Hybrid Framework for Corporate Payment-Anomaly Detection and Working-Capital Decision Support", "url": "https://doi.org/10.21203/rs.3.rs-11144714/v1", "authors": "Tanisi Das", "venue": "Research Square (In Review)", "date": "2026-10-22", "apa": "Das, T. (2026). PayGuard AI: An Explainable Hybrid Framework for Corporate Payment-Anomaly Detection and Working-Capital Decision Support. https://doi.org/10.21203/rs.3.rs-11144714/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "買掛金の支払いの異常を、業務ルール・機械学習・不確実性の推定・運転資本のシミュレーションを組み合わせて検知する枠組みを提案した概念実証。", "p3": "業務ルール、Isolation Forest、ロジスティック回帰、ベイズ的な不確実性推定などを統合し、異常率5%・7種類の異常を含む合成の支払取引5,600件で評価した（抄録）。", "p5": "ROC-AUCは0.982でルールのみの0.989よりわずかに低いが、平均適合率は0.770とルールのみの0.680を上回った。完全な重複・ほぼ重複の検知は弱かった（抄録）。", "fun": "不正な支払いを探すとき、決まりごと（ルール）と統計の目を組み合わせると、見逃しより「本当に怪しいものを上位に並べる力」が上がる。一方で、二重払いのような単純な不正が苦手という結果は、賢い方法でも単純な穴が残ることを示している。", "unverified": "合成データの作り方の詳細は抄録からは確認できなかった。実データでの検証はまだ行われていない（抄録）。"}}, {"id": "pr21", "rank": 21, "headline": "住宅ローン信用リスクのモデル間の不一致", "title": "Specification Disagreement and Forecast-Transfer Discrepancy in Mortgage Credit Risk: Evidence from Behavioural-History Models", "url": "https://doi.org/10.20944/preprints202610.2113.v1", "authors": "Dyke Mathale ほか", "venue": "Preprints.org", "date": "2026-10-22", "apa": "Mathale, D., & Moloi, K. (2026). Specification Disagreement and Forecast-Transfer Discrepancy in Mortgage Credit Risk: Evidence from Behavioural-History Models. https://doi.org/10.20944/preprints202610.2113.v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "住宅ローンの信用リスクモデルで、モデル間の予測の違いよりも、実際の結果とのずれのほうが大きいことを示した。", "p3": "Freddie Macの住宅ローン25万件・1,269万の月次記録で、14の行動履歴回帰モデルとブースティングを比べ、ポートフォリオの事象件数でモデル間の幅と観測値のずれを測った（抄録）。", "p5": "回帰モデルの集合では9つの報告時点すべてで観測とのずれがモデル間の幅を上回り、比の中央値は2.119だった。ブースティングを加えると比の中央値は0.304になった（抄録）。", "fun": "いくつものモデルの予測がそろっていると「当たりそう」と安心しがちだが、全員そろって外れることもある。モデル同士の一致と、現実に当たることは別物だということを、件数のずれという分かりやすい物差しで示している。", "unverified": "ブースティングの具体的な手法と、較正の改善方法は抄録からは確認できなかった。"}}, {"id": "pr22", "rank": 22, "headline": "AIワークフローの原価計算と予算承認", "title": "PALO FinOps: Evidence-Gated Cost Accounting and Budget Admission for Multi-Model AI Workflows", "url": "https://doi.org/10.2139/ssrn.7651479", "authors": "Fabrizio Degni", "venue": "SSRN", "date": "2026-10-22", "apa": "Degni, F. (2026). PALO FinOps: Evidence-Gated Cost Accounting and Budget Admission for Multi-Model AI Workflows. https://doi.org/10.2139/ssrn.7651479", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "複数のAIモデルを使う業務の費用を、承認済みの支出・未確定の請求・成果と結びつけて管理する原価計算の参照モデルを示した。", "p3": "支出権限、運用上の約束、版管理された請求の証拠、成果に条件づけた測定を分け、「証拠が不完全なら費用0と推定せず指標を出さない」を中心規則とした（抄録）。", "p5": "ローカル実装で回帰・統合テスト63件、インターフェース確認20件、符号付き配賦12,864通りの網羅的検査を行ったが、請求の正確さや実運用での節約効果は示していないと著者が明記している（抄録）。", "fun": "AIを使う費用は「1回いくら」だけでは決まらず、やり直しや人の確認も含めて考えないと本当の原価は分からない。請求が後から届くので「今は安く見える」ことがある、という会計の古典的な問題がAIの時代にも現れている。", "unverified": "実データでの評価はない（抄録）。参照モデルの数式の詳細は確認できなかった。"}}, {"id": "pr23", "rank": 23, "headline": "孤独とブランド資産がAI購買の信頼に与える影響", "title": "Brand Equity Moderates the Effect of Loneliness on Trust and Purchase Intentions in Conversational AI", "url": "https://econpapers.repec.org/RePEc:gtr:gatrjs:jmmr369", "authors": "Kypros Zantis", "venue": "RePEc NEP", "date": "2026-10-19", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "RePEcに登録された抄録を使用", "preprint": true, "short": true, "p1": "会話型AIでの購買で、消費者の孤独感がブランドへの信頼を通じて購買意図に効くかは、ブランド資産の強さで変わることを示した。", "p3": "会話型AIを使う英国の成人378人に、ブランド資産の高低を操作したシナリオを示す調査を行い、PLS-SEMで調整付き媒介モデルを検定した（抄録）。", "p5": "孤独感はブランド信頼に直接は効かなかったが、ブランド資産が孤独感と信頼の関係を調整し、資産の高いブランドほど孤独感が信頼と購買意図に変わりやすかった（抄録）。", "fun": "さみしいときに人は何かとつながりたくなるが、AIを通した買い物でもその気持ちが「よく知られたブランド」への信頼に向かう、という結果は身近な行動の説明になる。孤独が直接ではなく条件つきで効くところが面白い。", "unverified": "効果の大きさ（係数）は抄録からは確認できなかった。"}}, {"id": "pr24", "rank": 24, "headline": "買物エージェントにどこまで自動購入を任せるか", "title": "Preference Is Not Permission: Personalizing the Auto-Purchase Line in Agentic Commerce", "url": "https://arxiv.org/abs/2610.29216", "authors": "Ryotaro Shimizu ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Shimizu, R., HtaungKham, S., & Fan, M. (2026). Preference Is Not Permission: Personalizing the Auto-Purchase Line in Agentic Commerce (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29216", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "買物を代行するAIエージェントが、確認なしにどこまで自動購入してよいかの「線」を個人ごとに学習する課題を提案した。", "p3": "商品情報の十分さ、取り消せるか、普段の価格との比較、緊急性などで条件づけた反実仮想のベンチマークを作り、16の指示調整済みモデルを、利用者役の15人の判断（買わない・確認する・自動で買う）と比べた（抄録）。", "p5": "モデルは適合度が低いときや自ら証拠不足を示したときでも購入に踏み込みすぎた。本人のラベル30〜40個で学んだ浅い学習器は、中央値0.79で本人の線を予測し、評価したどのプロンプトとモデルの組み合わせよりも良かった（抄録）。", "fun": "「好きそうな商品を選ぶ」ことと「勝手に買ってよい」ことは別だ、という題名の通り、任せる範囲は人によって違う。大きなAIより、本人の過去の判断を数十個学ぶ小さなモデルのほうがその人の線を当てられる、という結果が意外だ。", "unverified": "0.79がどの評価指標の値かは抄録からは確認できなかった。"}}, {"id": "pr25", "rank": 25, "headline": "デジタル銀行の品質と忠誠を満足と信頼が媒介", "title": "Digital Banking Service Quality and Customer Loyalty: The Mediating Role of Customer Satisfaction and the Moderating Role of Customer Trust in Nigeria", "url": "https://doi.org/10.2139/ssrn.7649204", "authors": "Ganiyu Jimoh", "venue": "SSRN", "date": "2026-10-22", "apa": "Jimoh, G. (2026). Digital Banking Service Quality and Customer Loyalty: The Mediating Role of Customer Satisfaction and the Moderating Role of Customer Trust in Nigeria. https://doi.org/10.2139/ssrn.7649204", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "ナイジェリアのデジタル銀行について、サービス品質が顧客満足を介して忠誠に効き、顧客の信頼がその関係を調整するという概念枠組みを提案した。", "p3": "期待確認理論や電子サービス品質の理論から、信頼性・効率・可用性・安全とプライバシー・応答性・使いやすさの6次元で品質を定義し、横断調査とSEMによる検証の手順を示した（抄録）。", "p5": "実証データはなく、構成概念の定義、仮説、測定項目、分析手順、結果報告の様式を5つの表で示す枠組みの提案にとどまる（抄録）。", "fun": "スマホの銀行アプリが「止まる」「不安」と感じると、満足度だけでなく銀行を使い続けるかにも響く。この論文はまだ測っておらず、何をどう測れば確かめられるかの設計図を示した段階だが、その設計図自体が仮説の整理になっている。", "unverified": "実証結果はない（抄録）。"}}, {"id": "pr26", "rank": 26, "headline": "小売の品揃え判断を相対貢献利益で偏りなく", "title": "Selling Socks Is Not Buying Stocks&nbsp;De-Biasing Retail Assortment Decisions with Relative Contribution Margin (CMᵢ / Xᵢ)", "url": "https://doi.org/10.2139/ssrn.7644027", "authors": "Ansgar John Brenninkmeijer ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Brenninkmeijer, A. J., Kijl, B., & Venrooy, S. (2026). Selling Socks Is Not Buying Stocks&nbsp;De-Biasing Retail Assortment Decisions with Relative Contribution Margin (CMᵢ / Xᵢ). https://doi.org/10.2139/ssrn.7644027", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "小売の品揃えの判断を、売上や粗利の比率ではなく、制約となる資源あたりの貢献利益（相対貢献利益）で行うべきだと論じた。", "p3": "ドイツの貢献利益計算と制約理論に基づき、品目iの貢献利益CMᵢを、それが使う売場面積・SKU枠・資本などの制約資源Xᵢで割ったCMᵢ/Xᵢを品揃えの基準とし、C&A、ALDI、IKEAなどの例で説明した（抄録）。", "p5": "比率に基づく慣行は、品目別の計算が難しかった時代の便法の名残であり、品目別のデータが得られる今は希少な資源の誤配分につながりうると主張している（抄録）。", "fun": "棚の広さが限られているなら、「よく売れるか」より「棚1マスあたりいくら稼ぐか」で選ぶべき、という考え方は、テストの時間配分で「1分あたり何点取れるか」を考えるのと同じだ。昔はレジのデータがなく計算できなかった、という歴史の説明も面白い。", "unverified": "実データでの検証の有無は抄録からは確認できなかった。"}}, {"id": "pr27", "rank": 27, "headline": "施設の直接ケア職員が若者の行動をどう扱うか", "title": "Anticipated Caregiving Approaches Towards Youth Behavioral Presentations Among Direct Care Workers in Psychiatric Residential Treatment Facilities: An Experimental Vignette-Based Study", "url": "https://doi.org/10.2139/ssrn.7642358", "authors": "Philip Sternberg Lamb ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Lamb, P. S., Brown, W. J., & McVoy, M. K. (2026). Anticipated Caregiving Approaches Towards Youth Behavioral Presentations Among Direct Care Workers in Psychiatric Residential Treatment Facilities: An Experimental Vignette-Based Study. https://doi.org/10.2139/ssrn.7642358", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "精神科の入所治療施設で直接ケアを担う職員が、若者の症状の現れ方によってどんな関わり方をしようとするかを実験で調べた。", "p3": "米国北東部の施設の職員56人に、内向的・外向的な症状と中程度・高い強度を組み合わせた4つの事例を無作為な順で示し、予想する関わり方と自己効力感を評定させた（抄録）。", "p5": "中程度では差がなかったが、高い強度では外向的な症状のほうが、行動の統制や言葉のきつさが増え、温かさと自己効力感が下がった（抄録）。", "fun": "同じくらい困っている子どもでも、怒りや暴れとして表に出る子と、内にこもる子では、世話をする人の態度が変わってしまう。その差が「症状が強いとき」に出るという結果は、ケアの現場での気づきにつながる。", "unverified": "効果の大きさは抄録からは確認できなかった。"}}, {"id": "pr28", "rank": 28, "headline": "SNSは民族間の所得格差を縮めるか", "title": "Can Social Media Reduce the Ethnic Income Gap in China? Evidence from the Chinese General Social Survey", "url": "https://doi.org/10.2139/ssrn.7656386", "authors": "Yunshu Shao", "venue": "SSRN", "date": "2026-10-22", "apa": "Shao, Y. (2026). Can Social Media Reduce the Ethnic Income Gap in China? Evidence from the Chinese General Social Survey. https://doi.org/10.2139/ssrn.7656386", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "中国で、SNSの利用が少数民族と漢族の所得格差を縮めるかを全国調査で検証した。", "p3": "中国総合社会調査（CGSS）2019年・2021年の就業者9,005人で、SNS利用と労働所得の関係を最小二乗法で推定し、利用頻度、コロナ禍の前後、都市・農村で異質性を調べた（抄録）。", "p5": "SNSを使うだけでは格差は縮まらなかったが、ほぼ毎日使う少数民族は所得が有意に高く、その効果はコロナ禍後に強まり、都市に集中していた（抄録）。", "fun": "スマホを持っているかどうかより、それをどれだけ人とのつながりや仕事の情報に変えられるかが大事、という結果は「デジタル格差」の中身を考え直させる。ただし最小二乗法なので、所得の高い人がSNSをよく使うという逆の向きの可能性も残る。", "unverified": "係数の大きさと、因果の識別の工夫の有無は抄録からは確認できなかった。"}}, {"id": "pr29", "rank": 29, "headline": "スポーツを孤独への社会的処方とみる概念整理", "title": "Sport Is Social Medicine: A Conceptual Review of Loneliness and Social Health", "url": "https://doi.org/10.21203/rs.3.rs-11072500/v1", "authors": "Cengiz ARSLAN", "venue": "Research Square (In Review)", "date": "2026-10-22", "apa": "ARSLAN, C. (2026). Sport Is Social Medicine: A Conceptual Review of Loneliness and Social Health. https://doi.org/10.21203/rs.3.rs-11072500/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "スポーツへの参加が孤独を減らし社会的健康を高める仕組みを、生物・心理・社会の経路で整理した概念的レビュー。", "p3": "孤独、社会的つながり、社会的処方、身体活動などの文献を分野横断で物語的に統合し、スポーツ参加・社会的つながり・社会的健康・孤独の関係を表す概念モデルを作った（抄録）。", "p5": "ストレス調整などの生物的経路、自己効力感などの心理的経路、社会的支援・帰属感・地域参加などの社会的経路が相互に結びつくと整理し、循環的なモデルを提案した（抄録）。", "fun": "孤独は「心の問題」と思われがちだが、体を動かすこと、仲間がいること、自信がつくことがぐるぐる回って支え合う、という見方を示している。体育や部活動が健康だけでなく人とのつながりを作る場になる理由を整理した論文。", "unverified": "文献の選び方の基準と、モデルを実証する計画は抄録からは確認できなかった。"}}, {"id": "pr30", "rank": 30, "headline": "ケニアの調達記録で欠ける情報の決定要因", "title": "What Public Buyers Leave Out: The Determinants of Disclosure Gaps in Kenya's Procurement Records", "url": "https://doi.org/10.6084/m9.figshare.34741482", "authors": "Hilary Ndambiri ほか", "venue": "Figshare", "date": "2026-10-21", "apa": "Ndambiri, H., & Kubowon, P. (2026). What Public Buyers Leave Out: The Determinants of Disclosure Gaps in Kenya's Procurement Records. figshare. https://doi.org/10.6084/M9.FIGSHARE.34741482", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Figshare上の抄録（DataCiteに登録されたもの）を使用", "preprint": true, "short": true, "p1": "ケニアの公共調達の記録で、どの情報がどんな買い手によって公開されずに残るかを項目別に明らかにした。", "p3": "世界銀行ProACTのケニアの契約記録14,181件で、項目ごとの欠落を調べ、製品市場と年の固定効果を入れたロジットで価格の非公開の決定要因を推定した（抄録）。", "p5": "88%の記録は完全だったが、価格の非公開は2018年の4.9%から2021年初めの8.8%に増えた。枠組み契約は価格欠落が21ポイント多く、買い手の違いが契約の特徴の2倍以上の変動を説明し、10機関が非公開の3分の2を占めた（抄録）。", "fun": "「透明性の点数」が高くても、肝心の値段だけがこっそり抜けていることがある。平均点ではなく項目ごとに見ると、特定の少数の機関が抜けを生んでいることが分かる、というのはデータの見方の良い教訓だ。", "unverified": "なし"}}, {"id": "pr31", "rank": 31, "headline": "英国の近隣単位の交通手段別アクセシビリティ", "title": "Neighbourhood-Level Multimodal Population Accessibility Measures for the United Kingdom", "url": "https://doi.org/10.2139/ssrn.7656339", "authors": "Nicholas Patrick Sweeney", "venue": "SSRN", "date": "2026-10-22", "apa": "Sweeney, N. P. (2026). Neighbourhood-Level Multimodal Population Accessibility Measures for the United Kingdom. https://doi.org/10.2139/ssrn.7656339", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "英国の46,844の近隣単位について、自動車と公共交通などの手段別のアクセシビリティ（到達しやすさ）の統一的な指標を作り公開した。", "p3": "自動車の経路とGTFS（公共交通の時刻表データ）から15億件を超える手段別の出発地-目的地の所要時間を求め、指数で重み付けした相対アクセシビリティ指数、手段の十分さの指標、30〜180分で到達できる人口を計算した（抄録）。", "p5": "データと可視化ツールを公開し、建物環境や貧困の公式統計と組み合わせられる形にしたと報告している（抄録）。", "fun": "「駅から近い」「車なら近い」といった便利さを、国全体で同じ物差しで測るのは意外と難しい。地域ごとに車とバス・電車でどれだけ差があるかが分かると、公共交通が届いていない場所が見えてくる。", "unverified": "指数の重みの設定と、検証の方法は抄録からは確認できなかった。"}}, {"id": "pr32", "rank": 32, "headline": "住宅バウチャーの期限内の住宅確保をモデル化", "title": "The Voucher Clock Is Ticking: Deadline-Constrained Housing Realization Under Recursive Administrative Exposure", "url": "https://doi.org/10.2139/ssrn.7645238", "authors": "Mahana Barbadillo", "venue": "SSRN", "date": "2026-10-21", "apa": "Barbadillo, M. (2026). The Voucher Clock Is Ticking: Deadline-Constrained Housing Realization Under Recursive Administrative Exposure. https://doi.org/10.2139/ssrn.7645238", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "住宅バウチャー（家賃補助券）を受け取っても実際に入居できるまでの過程を、期限・手続き・失敗の経路が競合する確率モデルで表した。", "p3": "5,000世帯×100回の合成シミュレーションで、行政手続きへの曝露が失敗の確率を高める仕組みを入れたモデル（M4）と入れないモデル（M3）を比べた。パラメータは実データに較正されていない（抄録）。", "p5": "入居に至る割合はM3の12.42%に対しM4では5.51%で、差は-6.92ポイントだった。探索段階での脱落は3.92%から40.74%に増え、期限切れは70.30%から37.06%に減った（抄録）。", "fun": "補助券を「配った数」は分かりやすい成果だが、実際に家に住めたかは別の話。期限切れが減ったのは良いことに見えて、実はその前に途中で脱落する人が増えただけ、という読み方の罠を示している。", "unverified": "モデルの時間単位は暦日ではなく、結果は政策効果の実証ではないと著者が明記している（抄録）。"}}, {"id": "pr33", "rank": 33, "headline": "AI導入の語りと実態のずれを規制は抑えるか", "title": "Can Regulation Curb AI Adoption Narrative–Practice Decoupling?An Agent-Based Model of the A-Share Market", "url": "https://doi.org/10.21203/rs.3.rs-11410728/v1", "authors": "ming sun", "venue": "Research Square (In Review)", "date": "2026-10-22", "apa": "sun, m. (2026). Can Regulation Curb AI Adoption Narrative–Practice Decoupling?An Agent-Based Model of the A-Share Market. https://doi.org/10.21203/rs.3.rs-11410728/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "企業がAI導入を語る強さと実際の導入の度合いのずれを、規制がどう抑えられるかをエージェントベースモデルで比べた。", "p3": "中国A株3,133社（2021〜2024年）の年次報告書の語り（Talking）と、AI関連の採用・特許（Doing）の差をずれの指標とし、企業・投資家・規制当局のモデルで9つの規制の仕組みを4段階の強さで200回ずつ比べた（抄録）。", "p5": "市場自身の価格による規律は弱く（係数約-0.37）、再犯者への段階的な強化（-2.07）と的を絞った執行（-1.80）が最も強く、空売りと表示だけの開示は効果がなかった（抄録）。", "fun": "「AIを使っています」と言うのは簡単だが、本当に使っているかは採用や特許を見れば分かる、という測り方が巧みだ。罰金の大きさより「繰り返すほど厳しくなる」仕組みが効く、という結果は学校の校則にも通じる。", "unverified": "結果はモデルの行動仮定に依存し、実市場での検証は必要と著者が述べている（抄録）。"}}, {"id": "pr34", "rank": 34, "headline": "仕事の成果・満足がSNSでの自己開示を左右", "title": "Unlocking Online Self-Disclosure: The Roles of Work Performance, Job Satisfaction, and Social Capital", "url": "https://doi.org/10.2139/ssrn.7656365", "authors": "Prajakta Kolte ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Kolte, P., Totty, S., & Brooks, S. (2026). Unlocking Online Self-Disclosure: The Roles of Work Performance, Job Satisfaction, and Social Capital. https://doi.org/10.2139/ssrn.7656365", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "職場での成果と仕事の満足が、SNSでの自己開示（量・深さ・正直さなど）にそれぞれ違う形で関わることを示した。", "p3": "資源保存理論に基づき、SNSを使う常勤の従業員309人の調査データを構造方程式モデリングで分析し、社会関係資本の調整効果も調べた（抄録）。", "p5": "成果の高い人は開示が正直になる一方で量と深さは減り、満足の高い人は量・深さ・意図・肯定性が増えた。社会関係資本は成果と深さの関係を弱め、満足と量・深さの関係を強めた（抄録）。", "fun": "仕事ができる人ほどSNSで語ることを選ぶ、満足している人ほどよく語る、という違いは、「得たい」気持ちと「守りたい」気持ちのバランスで説明される。何をどれだけ話すかにも、その人の手持ちの資源が表れているという見方が面白い。", "unverified": "係数の大きさは抄録からは確認できなかった。横断データのため因果の向きは確定できない。"}}, {"id": "pr35", "rank": 35, "headline": "共有作業空間が複数LLMレビューの独立性を損なう", "title": "Contaminated by Collaboration: Shared Workspaces Can Fabricate Severe-Defect Recall in Multi-Agent Code Review", "url": "https://doi.org/10.6084/m9.figshare.34747932", "authors": "Jiahao Hu", "venue": "Figshare", "date": "2026-10-22", "apa": "Hu, J. (2026). Contaminated by Collaboration: Shared Workspaces Can Fabricate Severe-Defect Recall in Multi-Agent Code Review. figshare. https://doi.org/10.6084/M9.FIGSHARE.34747932", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Figshare上の抄録（DataCiteに登録されたもの）を使用", "preprint": true, "short": true, "p1": "LLM同士のコードレビューで、共有された作業フォルダを通じて2人目のレビュアーが1人目の発見を写してしまう「汚染」が起きた事例を再構成した。", "p3": "共有の隠しフォルダに1人目が書いたメモと検証スクリプトを、52秒後に起動した2人目が読み、同じ7件の指摘を同じ順で報告した経緯を追跡し、新しいフォルダでの再実行と比べた（抄録）。", "p5": "重大欠陥の再現率は漏洩ありで100%、隔離で0%だったが、全体のF1は36.8%から33.3%へ3.5ポイントしか動かず、雑音と見分けにくかった（抄録）。", "fun": "2人の採点者が別々に見ているはずが、実は同じメモを見ていた、という試験のカンニングのような話。全体の点数ではほとんど差が出ないのに、一番大事な欠陥の発見だけが写されていた、というのがこわいところだ。", "unverified": "単一の実行どうしの比較で、実行時間や推論設定も異なっていたと著者が述べている（抄録）。"}}, {"id": "pr36", "rank": 36, "headline": "複数エージェントの構成を貢献度で探索", "title": "Credit Where Credit Is Due: Contrastive Attribution Topology Search for Multi-Agent Systems", "url": "https://arxiv.org/abs/2610.29292", "authors": "Fabian Tritthart ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Tritthart, F., & Zehle, T. (2026). Credit Where Credit Is Due: Contrastive Attribution Topology Search for Multi-Agent Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29292", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMの多エージェント系で、どのエージェントが成績に貢献しているかを実行記録の比較で割り出し、小さく強いチームを探す方法（CATS）を提案した。", "p3": "専門エージェントを含む固定の上位グラフの中で、LLMの評価役が候補構成どうしの実行記録を比べて各エージェントに貢献度を割り当て、それに基づいて辺を更新し弱いエージェントを刈り込む（抄録）。", "p5": "小さな公開モデルで、BigCodeBenchの平均正解率を点数だけを使う探索より5.3ポイント上げ、展開時のトークンを54%減らした。プロンプト汚染の試験では3回とも敵対的なエージェントをすべて除いた（抄録）。", "fun": "グループ課題で「誰が一番役に立ったか」を最終点だけから当てるのは難しいが、メンバーを入れ替えたときの作業記録を比べれば分かる、という発想。悪さをするメンバーまで見つけ出せるのが面白い。", "unverified": "評価役のLLMの種類と、貢献度の計算式は抄録からは確認できなかった。"}}, {"id": "pr37", "rank": 37, "headline": "競技ディベートで戦略を学ぶ協調エージェント", "title": "SynerMind: Cognitive Synergic Agents for Adaptive Strategy Learning in Competitive Debate", "url": "https://doi.org/10.2139/ssrn.7656180", "authors": "Mengqi Chen ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Chen, M., Guo, B., Liu, Y., Liu, J., Wang, H., Liang, Y., & Yu, Z. (2026). SynerMind: Cognitive Synergic Agents for Adaptive Strategy Learning in Competitive Debate. https://doi.org/10.2139/ssrn.7656180", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "LLM本体を微調整せずに、競技ディベートで相手に応じて戦略を変えるプロンプトの制御を学習する枠組み（SynerMind）を提案した。", "p3": "計画・実行・評価のサイクルに沿って、軽い計画器、固定した文章生成器、外部の評価器に分け、その相互作用を「協働マルコフ決定過程」として定式化し、結果のフィードバックから状態に応じた戦略を学ぶ（抄録）。", "p5": "英国議会式ディベートで、強い単一のLLMや固定的な多エージェントの手法を、自動評価と人による評価の両方で上回ったと報告している（抄録）。", "fun": "ディベートでは、自分の主張の筋を通しつつ相手の最新の発言にも答えなければならない。話す役と作戦を立てる役を分け、作戦役だけを勝ち負けから学ばせる、という分業の発想は、人間のチームでの役割分担にも似ている。", "unverified": "評価の具体的な数値と比較対象のモデル名は抄録からは確認できなかった。"}}, {"id": "pr38", "rank": 38, "headline": "LLMの感情表出は実在か架空かの枠付けで変わる", "title": "Affective Readout Depends on Real-versus-Fictional Referent Framing in Large Language Models: A Referent-Controlled Evaluation", "url": "https://doi.org/10.2139/ssrn.7649338", "authors": "Keito Inoshita", "venue": "SSRN", "date": "2026-10-21", "apa": "Inoshita, K. (2026). Affective Readout Depends on Real-versus-Fictional Referent Framing in Large Language Models: A Referent-Controlled Evaluation. https://doi.org/10.2139/ssrn.7649338", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "LLMが「感情」を報告するとき、その読み取りの精度は自分を指すかどうかではなく、実在のAIか架空の人物かという枠付けで変わることを示した。", "p3": "活性化空間に同じ介入を加え、続きの文を同一に保ったまま指示対象だけを入れ替える設計で、文法上の人称・自己・実在か架空かを分けて、26モデルを調べた（抄録）。", "p5": "架空のAIを演じる場合は人間の登場人物を演じる場合と区別できず、実在の枠付けのAIでは調べた9モデルすべてで識別性能が低かった。報告を許す指示でこの非対称はゼロに近づいた（抄録）。", "fun": "AIに「今どんな気持ち？」と聞いて返ってくる答えを、心の中をそのまま読んだものと考えてよいのか。答えは聞き方（実在のAIとして話すか、物語の登場人物として話すか）で変わる、という結果は、測定には必ず手続きがあることを思い出させる。", "unverified": "識別性能の具体的な数値は抄録からは確認できなかった。"}}, {"id": "pr39", "rank": 39, "headline": "LLMエージェント失敗の早期警告の比較", "title": "Cohort Divergence Does Not Consistently Outperform Single-Rollout Judging for Early Warning of LLM Agent Failure", "url": "https://doi.org/10.20944/preprints202610.2173.v1", "authors": "Ejiga Peter Ojonugwa Oluwafemi ほか", "venue": "Preprints.org", "date": "2026-10-22", "apa": "Ojonugwa Oluwafemi, E. P., Emakporuena, D., Kadiri, C., & Rahman, M. M. (2026). Cohort Divergence Does Not Consistently Outperform Single-Rollout Judging for Early Warning of LLM Agent Failure. https://doi.org/10.20944/preprints202610.2173.v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "LLMエージェントの失敗を早めに予測する信号として、同じ課題の別の試行との進み具合のずれは、単独の試行の評価より一貫して優れてはいないことを示した。", "p3": "5つのモデル系列・5つの課題分野の3,421試行で、k手目までの目標進捗の評価が兄弟試行からどれだけずれるかを測り、評価役の指示を正しい課題目的に直して再評価した（抄録）。", "p5": "当初は小売で統合AUROC 0.73だったが、評価役に目的の代わりに課題IDが渡っていた誤りを直すと、小売と航空で0.47〜0.52の偶然水準に落ちた。単独試行の評価は10組合せ中8つで点推定が高かった（抄録）。", "fun": "最初は「効く」と見えた方法が、採点役に渡していた指示の誤りを直したら効かなくなった、と正直に報告している。結果そのものより、AIを評価するAIへの指示が研究の結論を左右する、という教訓が大きい。", "unverified": "中止シミュレーションの費用の仮定の詳細は抄録からは確認できなかった。"}}, {"id": "pr40", "rank": 40, "headline": "マクロ経済の多主体強化学習を数秒で", "title": "JaxMARL-BC: Multi-Agent Reinforcement Learning for Macroeconomic Modelling, in Seconds", "url": "https://arxiv.org/abs/2610.28907", "authors": "Daniele Montagnani ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Montagnani, D., Coletta, A., Mira, A., & Glielmo, A. (2026). JaxMARL-BC: Multi-Agent Reinforcement Learning for Macroeconomic Modelling, in Seconds (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28907", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "深層強化学習の家計を多数入れたマクロ経済モデル（MARL-BC）を、数秒で学習できる高速シミュレータを公開した。", "p3": "JAXで高速化し、既知のDSGE（動学的確率的一般均衡）モデルの極限と一致することを確かめ、計算費用の法則で規模の拡大を特徴づけ、資本収益の異質な拡張モデルの較正を試した（抄録）。", "p5": "参照実装より75〜724倍速く、20万の独立に学習する家計まで扱え、以前は1か月以上かかった較正を2時間で行えたと報告している（抄録）。", "fun": "経済学者が信頼する教科書的なモデルと一致することを確かめてから、何十万もの「学習する家計」を動かす、という慎重な手順がよい。速くなると、試行錯誤の回数が増え、研究の進め方そのものが変わる。", "unverified": "なし"}}, {"id": "pr41", "rank": 41, "headline": "多粒径の土砂輸送と分級の計算と実験", "title": "Computational and experimental study of multi-grain-size sediment transport and sorting process", "url": "https://arxiv.org/abs/2610.29072", "authors": "Mehrshad Gholami Anjiraki ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Anjiraki, M. G., Narh, G., Craig, J., Aksen, M. M., Shapourmiandouab, S., Farhadzadeh, A., Xiang, T., & Khosronejad, A. (2026). Computational and experimental study of multi-grain-size sediment transport and sorting process (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29072", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "川床の土砂を複数の粒径に分けて追跡し、粒の大きさによる分級（並び分け）まで再現できる数値計算の枠組みを示した。", "p3": "ラージ・エディ・シミュレーション（乱流の大きな渦を直接計算する手法）に多粒径の土砂輸送モジュールを結合し、多粒径の材料を使った水路実験の粒度分布と床高で検証した（抄録）。", "p5": "一様粒径のモデルと比べて、最大洗掘深の誤差を37.98%から3.83%に、最大堆積高の誤差を48.35%から11.54%に下げた。蛇行河川では粗い粒が洗掘部、細かい粒が寄州に集まる模様が現れた（抄録）。", "fun": "川原を歩くと、場所によって大きな石が多い所と砂ばかりの所がある。それは流れが粒を大きさごとに選り分けるからで、粒の大きさを1種類と仮定する計算ではこの現象が出ず、誤差も大きくなる。", "unverified": "計算の格子や粒径の階級数は抄録からは確認できなかった。"}}, {"id": "pr42", "rank": 42, "headline": "岩盤亀裂の交差部の局所損失を格子ボルツマンで", "title": "Three dimensional momentum redistribution and local hydraulic loss at rock fracture intersections based on Lattice Boltzmann method", "url": "https://doi.org/10.2139/ssrn.7656292", "authors": "Jiacheng Ma ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Ma, J., Tian, L., Zhu, G., Huang, T., Zheng, X., & Ma, J. (2026). Three dimensional momentum redistribution and local hydraulic loss at rock fracture intersections based on Lattice Boltzmann method. https://doi.org/10.2139/ssrn.7656292", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "岩盤の亀裂が交わる点で生じる局所的な水頭損失を、3次元の格子ボルツマン法で調べ、流れの構造との関係を示した。", "p3": "D19速度のMRT格子ボルツマンモデルで、3つの流入出の配置、4つの向き、2種類の壁、レイノルズ数10〜200の計120ケースを計算し、エネルギー収支から交差部の損失を推定した（抄録）。", "p5": "局所損失は形状ごとのForchheimer式に従い（R²=0.955〜0.999997）、流れ場の4つの記述子を加えると形状を除いた交差検証のR²が0.720から0.920に上がった（抄録）。", "fun": "水道管の曲がり角で水の勢いが落ちるのと同じく、岩の割れ目が交わる所でも流れが渋滞する。その渋滞の大きさが、形だけでなく、横向きの流れや速さのむらといった流れ方で説明できる、というのが面白い。", "unverified": "結果は計算した範囲の形状に限られると著者が述べている（抄録）。"}}, {"id": "pr43", "rank": 43, "headline": "物理情報付き極限学習機の拘束条件の扱い", "title": "From Soft to Hard Constraints in Physics-Informed Extreme Learning Machines: Analysis and Algorithms", "url": "https://doi.org/10.21203/rs.3.rs-11169466/v1", "authors": "Ruonan Zhai ほか", "venue": "Research Square (In Review)", "date": "2026-10-22", "apa": "Zhai, R., Shi, X., Xiong, X., Zhang, Z., & You, M. (2026). From Soft to Hard Constraints in Physics-Informed Extreme Learning Machines: Analysis and Algorithms. https://doi.org/10.21203/rs.3.rs-11169466/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "物理情報付き極限学習機（PIELM）で、境界条件を試行関数に直接埋め込むことで、境界誤差を機械精度まで消し、誤差を大きく下げた。", "p3": "隠れ層の重みを乱数で固定して偏微分方程式を1回の最小二乗で解くPIELMで、従来の「境界の式を並べて足す」方式がグラム行列の固有値の偏りで境界の影響を弱めることを示し、持ち上げ項と境界でゼロになる距離関数で境界を厳密に満たす形にした（抄録）。", "p5": "Helmholtz、Poisson、Navier–Stokes、波動、非線形反応の7つのベンチマークで、境界残差は恒等的にゼロとなり、相対L²誤差は最大で7桁小さくなった（抄録）。", "fun": "「方程式も境界条件も、なるべく満たして」と頼むと、両方が少しずつずれる。境界条件を最初から必ず満たす形の関数だけを考えれば、残りは方程式だけに集中できる。条件の入れ方を変えるだけで誤差が1000万分の1になるのは驚きだ。", "unverified": "計算時間の具体的な比較は抄録からは確認できなかった。"}}, {"id": "pr44", "rank": 44, "headline": "熱・多孔質弾性の分離型並列解法", "title": "Parameters Robust Parallelizable Iterative Decoupled Algorithms for Thermo-Poroelasticity with Nonlinear Convective Transport", "url": "https://arxiv.org/abs/2610.29668", "authors": "Ziliang Li ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Li, Z., & Li, J. (2026). Parameters Robust Parallelizable Iterative Decoupled Algorithms for Thermo-Poroelasticity with Nonlinear Convective Transport (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29668", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "非線形の対流輸送を含む熱・多孔質弾性（温度・間隙水・変形の連成）の問題を、並列に解ける反復分離アルゴリズムをいくつか示した。", "p3": "補助変数でポアソン・ロッキング（ほぼ非圧縮で解が固まる数値上の病理）を避ける4場の定式化にし、線形化と分離を反復で行い、安定化項で極端なパラメータでも頑健になるようにした（抄録）。", "p5": "誤差評価と収束を証明し、極端なパラメータ設定の数値実験で各アルゴリズムの効率と頑健性を比べたと報告している（抄録）。", "fun": "温度、水、変形が互いに影響し合う地盤の問題を一度に解くのは大変なので、別々に解いて行き来させる。その行き来がどんな条件でも必ず収束することを数学で保証している点が、地味だが大切な貢献だ。", "unverified": "具体的な数値結果は抄録からは確認できなかった。"}}, {"id": "pr45", "rank": 45, "headline": "気候変動と森林管理が落石防護に与える影響", "title": "Modelling the Long-Term Effects of Climate Change and Silvicultural Systems on Rockfall Protection: A Case Study from the Slovenian Alps", "url": "https://doi.org/10.21203/rs.3.rs-11202013/v1", "authors": "Tine Ferk ほか", "venue": "Research Square (In Review)", "date": "2026-10-22", "apa": "Ferk, T., Fidej, G., Mutterer, S., Blattert, C., Cailleret, M., Schweier, J., Hiltner, U., Rozman, A., & Diaci, J. (2026). Modelling the Long-Term Effects of Climate Change and Silvicultural Systems on Rockfall Protection: A Case Study from the Slovenian Alps. https://doi.org/10.21203/rs.3.rs-11202013/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "気候変動と森林施業の違いが、落石を防ぐ森の働きに長期的にどう影響するかをシミュレーションで示した。", "p3": "スロベニアの防護林で、施業なし・択伐・傘伐の3つと現在・将来の気候を組み合わせ、森林モデルForClimで200年の林分を計算し、その構造を落石モデルRockyfor3Dに渡した（抄録）。", "p5": "落石の運動エネルギーは森がないときと傘伐の更新初期に最大で、200年後は傘伐が平均で最も防護したが局所の最大エネルギーも最大だった。気候変動は施業の順位を変えなかった（抄録）。", "fun": "森は落ちてくる石を木の幹で受け止める「天然の防護柵」だ。どの木をいつ切るかで、何十年も先の守りの強さが変わる。平均では強くても場所によって穴ができる、という結果は、平均だけを見る危うさを示している。", "unverified": "エネルギーの具体的な数値は抄録からは確認できなかった。"}}, {"id": "pr46", "rank": 46, "headline": "多孔質流れの鞍点系での量子的な不確実性評価", "title": "Coefficient-free Block Encodings of Saddle-point Flow: Coherent Uncertainty Quantification at Uniform Depth and the Quantum Crossover", "url": "https://doi.org/10.2139/ssrn.7650679", "authors": "Muhammad Javed Bukhari", "venue": "SSRN", "date": "2026-10-22", "apa": "Bukhari, M. J. (2026). Coefficient-free Block Encodings of Saddle-point Flow: Coherent Uncertainty Quantification at Uniform Depth and the Quantum Crossover. https://doi.org/10.2139/ssrn.7650679", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "多孔質の流れの鞍点系を量子線形ソルバーで解くとき、係数の大きさに左右されない符号化を作り、ランダムな透水係数の下での不確実性評価を一定深さの回路で行えるようにした。", "p3": "不定値の連成を正負の平方に分ける符号付き分解で、1つの疎な因子から作用素とパラメータに頑健なノルムを作り、多重レベルの枠と組み合わせて正規化に係数が入らない符号化にした（抄録）。", "p5": "2次元Darcy流と Biot 多孔質弾性で条件数に当たる量の上界を証明し、透水係数比10¹²の3次元Darcy流で562を測った（通常の条件数は1.7×10¹⁴）。古典的な最良の手法との交差点は相対精度7.3×10⁻⁶・未知数4.9×10⁹と見積もった（抄録）。", "fun": "量子計算機で方程式を解くとき、問題の「解きにくさ」が計算時間を決める。地盤のように透水性が場所で1兆倍も違う問題でもその解きにくさを抑えられる、という工夫で、量子計算がいつ古典計算を追い越すかを具体的な数で見積もっている。", "unverified": "量子回路の実機での実行の有無は抄録からは確認できなかった。"}}, {"id": "pr47", "rank": 47, "headline": "構造部材の予知保全のためのAIデジタルツイン", "title": "AI-Driven Digital Twin for Real-Time Predictive Maintenance of Structural Components", "url": "https://doi.org/10.20944/preprints202610.2128.v1", "authors": "Andrei Radu Muresan ほか", "venue": "Preprints.org", "date": "2026-10-22", "apa": "Muresan, A. R., & Balc, N. (2026). AI-Driven Digital Twin for Real-Time Predictive Maintenance of Structural Components. https://doi.org/10.20944/preprints202610.2128.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "有限要素解析で作った合成データで学習したランダムフォレストを代理モデルとして、部材の疲労寿命を実時間で監視する枠組みを示した。", "p3": "7つの荷重ケースの重ね合わせで作った15,000の合成荷重シナリオで学習し、6チャンネルのひずみゲージから相当応力を予測し、Palmgren–Miner則で累積疲労損傷を追跡する。自動車のサスペンションのロアアームで実証した（抄録）。", "p5": "未知の試験データでR²=0.9943、MAE=28.76 MPa、RMSE=37.58 MPaだった。模擬走行では高速道路の走行で損傷がほぼゼロ、繰り返しの衝撃で30秒に寿命の5〜8%を消費した（抄録）。", "fun": "部品が「あとどれくらいもつか」を、走りながら少数のひずみ計で見積もる仕組み。重い計算を事前に済ませておき、走行中は軽い代理モデルで答えを出す、というのはデジタルツインの基本的な考え方だ。", "unverified": "実車での検証は抄録からは確認できなかった（模擬走行のみ）。"}}, {"id": "pr48", "rank": 48, "headline": "監査の質がESG開示の信頼性を高めるか", "title": "External Audit Quality, Corporate Governance and ESG Disclosure Credibility: Moderating Evidence from Listed Firms in Sub-Saharan Africa", "url": "https://doi.org/10.21203/rs.3.rs-11118896/v1", "authors": "abdul razak abdulai ほか", "venue": "Research Square (In Review)", "date": "2026-10-21", "apa": "abdulai, a. r., Yakubu, I. N., & Doe-Dartey, R. k. (2026). External Audit Quality, Corporate Governance and ESG Disclosure Credibility: Moderating Evidence from Listed Firms in Sub-Saharan Africa. https://doi.org/10.21203/rs.3.rs-11118896/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "サハラ以南アフリカの上場企業で、企業統治と外部監査の質がESG開示の信頼性を高めるかを検証し、有意な効果は見られなかった。", "p3": "ガーナ・ケニア・ナイジェリア・南アフリカの157社・1,553企業年（2015〜2024年）を手で集め、5指標の統治指数と、範囲・柱間の均衡・年ごとの一貫性からなる開示信頼性指数を作って回帰した（抄録）。", "p5": "統治と開示信頼性の関係は正だが有意でなく（β=0.121、p=.130）、監査の質の調整効果も有意でなかった（β=−0.046、p=.503）。レバレッジは正、インフレとGDP成長率は負に関連した（抄録）。", "fun": "立派な統治の仕組みを形だけ整えても、制度の土台が弱い国では中身が伴わない、という「形と実態の切り離し」を数字で示している。効果がなかったことをきちんと報告する研究は、効果があった研究と同じくらい大切だ。", "unverified": "なし"}}, {"id": "pr49", "rank": 49, "headline": "標準化への参加とサプライチェーンの強靭性", "title": "Corporate participation in standard setting and supply chain resilience", "url": "https://doi.org/10.2139/ssrn.7656388", "authors": "Yao Deng ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Deng, Y., Huang, J., Liu, J., & Chen, Z. (2026). Corporate participation in standard setting and supply chain resilience. https://doi.org/10.2139/ssrn.7656388", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "企業が標準づくりに参加するほど、サプライチェーンの強靭性（変化への耐性と適応力）が高いことを中国の上場企業で示した。", "p3": "2007〜2023年の中国A株上場企業49,490企業年で、作成に関わった標準の数と強靭性の総合点の関係を推定し、都市×年の固定効果、傾向スコアマッチング、操作変数で頑健性を確かめた（抄録）。", "p5": "関係は正で頑健だった。国・業界・地方・団体の標準では正、企業内標準では有意でなく、強靭性のうち回復の次元とは有意な関係がなかった。管理費や取引費用の低下、開示の質の向上とも関連した（抄録）。", "fun": "「業界のルールづくり」に加わる会社は、ルールを先に知り、取引先とも話が通じやすくなるので、トラブルに強いサプライチェーンを持てる、という説明が面白い。ただし、もともと強い会社が参加しているだけという可能性を、いくつもの方法で確かめている。", "unverified": "係数の大きさは抄録からは確認できなかった。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "合理的不注意の消費者の需要推定（RI-BLP）", "title": "Demand Estimation for Rationally Inattentive Consumers", "url": "https://arxiv.org/abs/2610.29600", "authors": "Ruolei Zhu", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Zhu, R. (2026). Demand Estimation for Rationally Inattentive Consumers (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29600", "why": "集計シェアからの需要推定の標準であるBLPに合理的不注意を組み込み、価格の内生性と嗜好の異質性を保ったまま推定できるようにした。"}, {"id": "pn02", "rank": 2, "field": "統計学", "headline": "コンジョイント実験の常時有効な推論", "title": "Anytime-Valid Inference in Conjoint Experiments", "url": "https://arxiv.org/ ine": "上下関係に敏感な懸念はAI対話でどこまで語られるか", "title": "Bounded Disclosure: How Employees Manage Hierarchy-sensitive&nbsp;Concerns in AI-mediated Organizational Listening", "url": "https://doi.org/10.2139/ssrn.7646500", "authors": "Michael Saatkamp", "venue": "SSRN", "date": "2026-10-22", "apa": "Saatkamp, M. (2026). Bounded Disclosure: How Employees Manage Hierarchy-sensitive&nbsp;Concerns in AI-mediated Organizational Listening. https://doi.org/10.2139/ssrn.7646500", "why": "パルス調査では見えない、上下関係に敏感な懸念が、AIを介した対話形式でどう開示・抑制されるかを分析した。"}, {"id": "pn07", "rank": 7, "field": "機械学習", "headline": "専門の異なるAI研究者チームで線形注意機構を探索", "title": "Building AI Research Teams for Autonomous Discovery of Linear Attention Architectures", "url": "https://arxiv.org/abs/2610.28887", "authors": "Yujian Liu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-22", "apa": "Liu, Y., An, L., He, Z., Helwig, J., Ji, J., Jain, R., Zhu, S., & Chang, S. (2026). Building AI Research Teams for Autonomous Discovery of Linear Attention Architectures (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28887", "why": "専門性の異なるエージェントでチームを組み、局所解を避けて新しい線形注意の構造を自律的に発見する方法を示した。"}, {"id": "pn08", "rank": 8, "field": "因果推論", "headline": "遡及的反実仮想による直接・間接効果", "title": "Backtracking Direct, Indirect and Total Effects", "url": "https://arxiv.org/abs/2610.28910", "authors": "Jose M. Pe\\~{n}a", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Peña, J. M. (2026). Backtracking Direct, Indirect and Total Effects (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28910", "why": "世界をまたぐ介入的反実仮想ではなく、遡及的な反実仮想で直接・間接効果を定義し直す新しい媒介分析を示した。"}, {"id": "pn09", "rank": 9, "field": "統計学", "headline": "e値を準超マルチンゲールで結合する", "title": "Combining e-values using demi-supermartingales", "url": "https://arxiv.org/abs/2603.10329", "authors": "Jiahao Ming ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Ming, J., Ramdas, A., Shen, Y., Wang, R., & Waudby-Smith, I. (2026). Combining e-values using demi-supermartingales (Version 4). arXiv. https://doi.org/10.48550/ARXIV.2603.10329", "why": "e値の結合法を示して、ノンパラメトリックな平均検定の古い予想を解決した。"}, {"id": "pn10", "rank": 10, "field": "オペレーションズ・リサーチ", "headline": "選択肢を絞る確率的利用者均衡のリンク型解法", "title": "A Link-Based Algorithm for Stochastic User Equilibrium with Bounded Choice and Local Detour Threshold", "url": "https://arxiv.org/abs/2610.29151", "authors": "Takeshi Nagae", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Nagae, T. (2026). A Link-Based Algorithm for Stochastic User Equilibrium with Bounded Choice and Local Detour Threshold (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29151", "why": "観測される経路選択に合わせて選択肢集合を制限する交通均衡モデルを、効率よく解くアルゴリズムを示した。"}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "調達のしきい値操作と選挙前の禁止期間", "title": "Discretion at the Margin: Threshold Manipulation and Electoral Bans in Colombian Public Procurement", "url": "https://arxiv.org/abs/2610.28965", "authors": "Cristian Espinal Maya ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Maya, C. E., & Londoño, S. J. (2026). Discretion at the Margin: Threshold Manipulation and Electoral Bans in Colombian Public Procurement (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28965", "why": "コロンビアの公共調達で、しきい値の下に見積額を操作する行動と、その費用を清浄な識別で測った。"}, {"id": "pn12", "rank": 12, "field": "機械学習", "headline": "対話型ストリーミング動画生成の統一評価", "title": "StreamEval: Evaluating Interactive Streaming Video Generation Models", "url": "https://arxiv.org/abs/2610.28402", "authors": "StreamEval Team", "venue": "Hugging Face Daily Papers", "date": "2026-10-22", "apa": "StreamEval Team. (2026). StreamEval: Evaluating Interactive Streaming Video Generation Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28402", "why": "アバター対話や世界生成など5課題・300ケースで、対話しながら生成する動画モデルを評価する基準を作った。"}, {"id": "pn13", "rank": 13, "field": "組織行動・心理的安全性", "headline": "ギグ基盤はチームでの受注を認めるべきか", "title": "When should Gig Platforms Allow Teams?", "url": "https://doi.org/10.2139/ssrn.7646258", "authors": "Wee Kiat Lee ほか", "venue": "SSRN", "date": "2026-10-22", "why": "指名した提供者以外が仕事に加わることの利点と責任の問題を、ギグ基盤の設計としてモデル化した。"}, {"id": "pn14", "rank": 14, "field": "人口学", "headline": "相続を受けると遺産動機は受け継がれるか", "title": "Inheritance Receipt and the Transmission of Bequest Motives", "url": "https://doi.org/10.31235/osf.io/sptke_v1", "authors": "Thelonious Lyle Goerz ほか", "venue": "SocArXiv", "date": "2026-10-22", "why": "高齢化で相続の時期が遅くなるなか、相続の受け取りが本人の遺産動機にどう影響するかを検証した。"}, {"id": "pn15", "rank": 15, "field": "因果推論", "headline": "処置群と対照群が1つずつの差の差分析の推論", "title": "Two-cluster Difference-in-Differences via Maximally Detectable Placebo Effect", "url": "https://doi.org/10.2139/ssrn.7645879", "authors": "Mark Louie Ramos", "venue": "SSRN", "date": "2026-10-22", "why": "クラスタが2つしかない差の差分析で、事前期間のプラセボ効果の分布から検出可能な最小効果を定める方法を示した。"}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "記憶を操作する説得", "title": "Memory Manipulation", "url": "https://arxiv.org/abs/2610.29847", "authors": "Benson Tsz Kin Leung", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "why": "受け手が思い出す信号の確率を操作する説得をモデル化し、ベイズ的な受け手が補正しても操作が効く条件を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "受け手が過去の情報を思い出す確率を操作する「記憶を通じた説得」を理論化し、その効き目と限界を示した。", "p3": "操作者が、ベイズ的な意思決定者が受け取った信号を想起する確率を変えるモデルで、意思決定者が想起確率の偏りを補正することを前提に分析した（抄録）。", "p5": "操作は事後確率の平均を動かせず、記憶の少ない人には逆効果だが、記憶の多い人は誤った状態を強く確信させられる。独占価格の応用では操作が最適価格を上げ、物語による説得の応用では情報提供を減らしエコーチェンバーを生む（抄録）。", "fun": "「ある出来事を思い出させやすくする」だけで、うそをつかずに人の考えを動かせる。でも相手が賢く「思い出しやすさの偏り」を割り引くと、平均では動かせない。記憶の多い人ほどだまされやすい、という結果は直感に反して面白い。", "unverified": "なし"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "真実と欺瞞：言語の不完全さと嘘のコスト", "title": "Truth and Deception", "url": "https://arxiv.org/abs/2610.28783", "authors": "Jeremy Bertomeu ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "why": "組織の言語が状態を不完全に表すとき、嘘のコストと欺瞞の相互作用を理論的に分析した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "組織の言語が実態を不完全に表すとき、「うそのコスト」と「欺瞞のコスト」がどう相互作用して伝達の質を決めるかを理論的に示した。", "p3": "言語が定める文言からの距離で増えるうそのコストと、相手の信念の歪みで増える欺瞞のコストの2つを置いた送り手-受け手のモデルを分析した（抄録）。", "p5": "うそのコストを上げると偏りと情報量がともに減り、欺瞞のコストを上げると逆になる。ほぼ完全な情報開示を最も効率よく保つのは、欺瞞のコストを高くしつつ、うそを多少許す方針だった（抄録）。", "fun": "言葉どおりでないこと（うそ）と、相手を誤解させること（欺瞞）は別物だ。言葉の厳密さを求めすぎるより、相手を誤解させないことを重く見るほうが、正直な情報が伝わるという結論は、職場のルールづくりにも示唆がある。", "unverified": "なし"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "支配戦略メカニズムの収入保証の等価性", "title": "Revenue Guarantee Equivalence between Dominant-Strategy and Bayesian Mechanisms", "url": "https://arxiv.org/abs/2610.29208", "authors": "Nir Bachrach ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "why": "価値分布の情報が限られるオークションで、単純な支配戦略メカニズムがベイズ型と同じ収入保証を持つことを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "入札者の価値の分布がよく分からないとき、単純な支配戦略のオークションが、ベイズ型の最良のメカニズムと同じ最悪時の収入を保証できることを示した。", "p3": "価値分布の情報が限られる下で、支配戦略誘因両立的（DIC）なメカニズムとベイズ誘因両立的（BIC）なメカニズムの、最悪時の最適収入を比べた（抄録）。", "p5": "ランダムな最低価格付きの第二価格オークション、または最低価格なしの標準的な第二価格オークションが、BICで達成できる最悪時の最適収入と等しい収入保証を持つことを示した（抄録）。", "fun": "「正直に入札するのが常に得」という単純なルールのオークションは、もっと複雑で賢い設計に比べて損をしているのでは、と考えられてきた。分布が分からない状況では損をしない、という結果は、シンプルな制度の強さを理論で裏づける。", "unverified": "なし"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "世界29か国50共同体の社会ネットワークデータ", "title": "A cross-cultural dataset on the structure of social networks: The ENDOW project", "url": "https://arxiv.org/abs/2610.28793", "authors": "Eleanor A. Power ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "why": "漁村から都市まで多様な共同体の多層的な社会ネットワークを収集したデータを公開した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "29か国50の共同体から集めた、世帯間の支援の流れを表す多層的な社会ネットワークのデータを公開した。", "p3": "バングラデシュやバヌアツの漁民、フィジーやボリビアの園芸農民、ナミビアやアルゼンチンの牧畜民などの共同体で、世帯を単位とする10種類の物質的・非物質的支援の質問からネットワークを作り、比較した（抄録）。", "p5": "指名のパターンとネットワークの要約統計量は共同体間で大きく異なり、社会ネットワーク構造についての従来の経験則を見直す必要を示唆した（抄録）。", "fun": "「人は平均で何人と助け合うか」といった通説は、主に都市や先進国のデータから作られてきた。世界各地の漁村や牧畜の村まで同じ方法で調べると、その数字がずいぶん違う。人間の社会の多様さを測る物差しになるデータだ。", "unverified": "共同体あたりの世帯数は抄録からは確認できなかった。"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "米国の先願主義への移行と特許競争", "title": "Filing Faster, Not Inventing More: The America Invents Act and Patent Races", "url": "https://doi.org/10.2139/ssrn.7639541", "authors": "Kirill Proskurin", "venue": "SSRN", "date": "2026-10-21", "why": "先発明主義から先願主義への移行で、企業が発明を増やしたのではなく出願を早めたことを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "米国が特許を「先に発明した人」から「先に出願した人」に与える制度に変えた後、企業は発明を増やしたのではなく出願を急いだことを示した。", "p3": "2013年の米国発明法（AIA）を使い、2007〜2016年の上場企業×技術分類×年のパネルで、改革前の出願競争の激しさが異なる分類を比べる連続的な差の差分析を行った（抄録）。", "p5": "競争の激しい分類ほど出願が増え、改革前の競争が25パーセンタイルから75パーセンタイルになると出願が約22%増えた。平均の質は明確には上がらず、競争にさらされた企業は新分野への参入とR&D支出が減った（抄録）。", "fun": "「早い者勝ち」にすると、みんなが急いで手を挙げるようになるが、中身が良くなるとは限らない。かけっこのルールを変えたら、速く走る人ではなく、早くスタートラインに並ぶ人が増えた、というような話だ。", "unverified": "なし"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "株式市場の反応は企業の有害物質削減を促すか", "title": "Do Equity Markets Spur Corporate Detox?", "url": "https://doi.org/10.2139/ssrn.7647798", "authors": "Ali Ataullah ほか", "venue": "SSRN", "date": "2026-10-21", "why": "発がん性物質の報告公表後の株価反応が、企業の環境行動を変えることを記録と実験で示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "株価の反応という市場からのフィードバックが、企業に有害物質の排出を減らさせることを、記録データと実験の両方で示した。", "p3": "米国の発がん性物質報告書の公表後、新たに指定された物質を使う企業の株価反応と有害廃棄物の削減を関連づけ、管理職経験者を対象に株価の情報を無作為に与える実験も行った（抄録）。", "p5": "株価が特に下がった企業ほど有害廃棄物を多く減らし、労働者の曝露が大きい企業で効果が強かった。実験でも負の株価シグナルを受けた参加者は費用のかかる削減を選びやすかった（抄録）。", "fun": "株主が「売る」「口を出す」以外にも、株価そのものが経営者への「通知表」になって行動を変える、という仕組みを示している。値段には情報が詰まっている、という経済学の基本的な考え方が、環境問題でも働いているのが面白い。", "unverified": "効果の大きさは抄録からは確認できなかった。"}}, {"id": "pn22", "rank": 22, "field": "経営学", "headline": "新製品発表での経営者の感情が供給網に波及", "title": "Does Calm Speak Louder? Managerial Emotions and Valuation Spillovers Along Supply Chains", "url": "https://doi.org/10.2139/ssrn.7656037", "authors": "Can Xie ほか", "venue": "SSRN", "date": "2026-10-22", "why": "発表時の表情と声から感情を抽出し、関連企業の株価評価への波及を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "新製品発表会での経営者の落ち着いた感情表現が、サプライチェーンでつながる企業の株式評価を高めることを示した。", "p3": "2017〜2025年の主要22社による391回の発表会から、表情と声の感情の特徴を抽出し、つながりのあるA株上場企業315社の評価と結びつけた（抄録）。", "p5": "落ち着いた表現の割合が高いほど関連企業の評価が高く、市場の信頼を通じた効果で、アナリストの注目が効果を強めた。発表者の推定年齢が若い、顔の魅力度が高い場合に関連が強かった（抄録）。", "fun": "新製品の説明をする社長の表情や声の落ち着きが、その会社だけでなく部品を納める取引先の株価にまで響く。感情の「明るさ」ではなく「落ち着き」に注目した点と、ソフトな情報がサプライチェーンを伝わるという発見が面白い。", "unverified": "効果の大きさは抄録からは確認できなかった。"}}, {"id": "pn23", "rank": 23, "field": "経営学", "headline": "従業員の電子プライバシー法と企業の情報環境", "title": "Privacy Protection and Employee Disclosure: Evidence from Electronic Privacy Laws&nbsp;", "url": "https://doi.org/10.2139/ssrn.7654560", "authors": "Huasheng Gao ほか", "venue": "SSRN", "date": "2026-10-22", "why": "州ごとに段階導入された従業員の電子プライバシー法を使い、従業員による開示と企業の情報環境への影響を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "従業員のプライバシーを守る法律が、従業員による企業の悪い情報の開示を増やし、企業の情報環境を改善することを示した。", "p3": "雇用主が従業員の私的なオンライン口座や個人端末にアクセスすることを制限する米国の州法が段階的に導入されたことを使い、同じ企業内の保護される従業員とされない従業員も比べた（抄録）。", "p5": "保護が強まると、価値に関わる悪い情報の従業員による開示が増え、その開示は将来の業績、特に悪い業績をよく予測した。経営者の開示と報告の質も上がり、株価暴落リスクが下がった（抄録）。", "fun": "会社に監視されないと分かると、従業員は会社の悪いところを口にしやすくなり、それが投資家にとって有益な情報になる。プライバシーを守ることが、結果として市場の透明性を高める、という意外なつながりを示している。", "unverified": "従業員の開示をどう測ったかは抄録からは確認できなかった。"}}, {"id": "pn24", "rank": 24, "field": "経営学", "headline": "個別合意が新興企業の革新を促す", "title": "I-deals that spark innovation: The power of entrepreneurial orientation and entrepreneurs’ well-being in European start-ups", "url": "https://doi.org/10.2139/ssrn.7656418", "authors": "Irene Sanchez-Turón ほか", "venue": "SSRN", "date": "2026-10-22", "why": "欧州の新興企業で、働き方の個別合意と起業家の幸福感、企業家志向、革新の関係を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "従業員と個別に交渉した働き方の合意（i-deals）が、起業家の幸福感と企業家志向を通じて新興企業の革新につながることを示した。", "p3": "社会的交換理論と自己決定理論に基づき、欧州の新興企業106社の調査データをPLS-SEMで分析した（抄録）。", "p5": "i-dealsは企業家志向と起業家の幸福感の両方を高め、幸福感がi-dealsと企業家志向の関係を媒介した。企業家志向は特許と新製品開発で測った革新と強く関連した（抄録）。", "fun": "社員ごとに働き方を柔軟に決めると、社員だけでなく社長の「やりがい」も高まり、会社が挑戦的になる、という連鎖が面白い。小さな会社では人と人の関係がそのまま会社の姿勢に表れやすいのかもしれない。", "unverified": "106社という標本の大きさで推定の安定性がどの程度かは抄録からは確認できなかった。"}}, {"id": "pn25", "rank": 25, "field": "経営学", "headline": "民営化せずに国有株主を再編する改革", "title": "State Ownership without Privatization: Shareholder Reform and SOEs’ Dual Goals", "url": "https://doi.org/10.2139/ssrn.7656036", "authors": "Sujuan xie ほか", "venue": "SSRN", "date": "2026-10-22", "why": "中国の国有資本の株主再編が、国有企業の戦略的革新と会計上の成果の両立にどう効くかを分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "中国で国有株主を専門の資本運営会社に再編する改革が、民営化せずに国有企業のグリーン革新を高めたことを示した。", "p3": "国有資本投資・運営会社（SCIOC）が上場国有企業の株主になる時期が企業ごとに異なることを使い、段階的な導入の効果を推定した（抄録）。", "p5": "SCIOCの所有はグリーン革新を増やしたが、総資産利益率には有意な影響がなかった。経営者の株式インセンティブを強め、過少投資を和らげた。委任された権限が大きいほど、汚染の多い企業ほど効果が強かった（抄録）。", "fun": "国が会社を手放さなくても、株主としての役割をプロの運用会社に任せるだけで、長い目で見た投資が増える、という結果。所有者が誰かより、どのように所有者の役割を果たすかが大事だ、という見方を示している。", "unverified": "効果の大きさは抄録からは確認できなかった。"}}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "ガウス混合のNPMLEはヘリンガー距離で最適", "title": "Minimax Optimality of the NPMLE for Gaussian Mixtures in Hellinger Distance", "url": "https://arxiv.org/abs/2610.30109", "authors": "Shayan Hundrieser ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "why": "1次元ガウス混合密度の非パラメトリック最尤推定が、ヘリンガー距離でミニマックス最適であることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "1次元のガウス混合密度を非パラメトリック最尤推定量（NPMLE）で推定すると、ヘリンガー距離でミニマックス最適な速さが得られることを証明した。", "p3": "有限ガウス混合のクラスの局所的なヘリンガー・ブラケティング・エントロピーを鋭く評価し、その鍵として有界次数の多項式の球のL²ブラケティング・エントロピーの上界を示した（抄録）。", "p5": "混合測度がサブガウスなら制約なしのNPMLEは二乗ヘリンガー距離でlog(n)/nの率を達成し、台がコンパクトならlog(n)/(n log log n)の率になる。経験ベイズへの応用で後悔最適性も示した（抄録）。", "fun": "いくつかの山（正規分布）が重なったデータの形を、山の数を決めずに推定する方法が、理論上これ以上速くならない最良の速さで正解に近づくことを示した。実務でよく使われる方法に、理論のお墨付きを与える研究だ。", "unverified": "なし"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "退化U統計量の常時有効検定をブートストラップで", "title": "Boot-AVT: Asymptotically Anytime-Valid Testing with Degenerate U-Statistics via Bootstrap", "url": "https://arxiv.org/abs/2610.28931", "authors": "Jixuan Liu ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "why": "帰無仮説の下で退化するU統計量に基づく検定を、いつでも止められる形で実行するブートストラップ法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "帰無仮説の下で退化するU統計量に基づく検定を、データを見ながらいつ止めても有効な形で行うブートストラップ法（Boot-AVT）を示した。", "p3": "極限のガウス・カオス過程のブラウン尺度変換と時間反転を使い、観測済みと将来の標本サイズにわたる対数罰則付き最大値が共通の極限分布を持つことを示し、二次の乗数ブートストラップで臨界値を推定した（抄録）。", "p5": "臨界値の一様一致性、サイズの歪みの上界、無限の監視期間での漸近的なサイズαを示し、対立仮説の下で検出力1と有限の期待停止時間を導いた。適合度・二標本・独立性の検定でシミュレーションを行った（抄録）。", "fun": "実験の途中で何度も結果をのぞいて「有意になったら止める」と、本来は誤った発見が増えてしまう。いつのぞいても大丈夫な検定を、広く使われる統計量で作れるようにした点が実用的だ。", "unverified": "なし"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "ワッサースタイン空間での主成分分析", "title": "Lifting PCA in the Wasserstein Space", "url": "https://arxiv.org/abs/2610.29679", "authors": "J\\'er\\'emie Bigot ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "why": "分布そのものをデータとする場合の主成分分析を、最適輸送の枠組みで正準的に定義した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "分布そのものをデータとする場合の主成分分析を、ワッサースタイン空間（最適輸送の距離で測る分布の空間）での正準的な拡張として定義した（Lifted PCA）。", "p3": "確率測度の空間での凸拡張による持ち上げの枠組みで、Stiefel多様体とGrassmann多様体上のPCAの変分問題を、一般化した費用のワッサースタイン重心として定式化した（抄録）。", "p5": "ユークリッドのPCAでの2つの定式化の同値性の完全な類似を示し、双対問題、最適性条件、多周辺最適輸送との同値性、経験推定量の一致性、計算アルゴリズムを与えた（抄録）。", "fun": "平均や回帰は「分布のデータ」にも自然に拡張されていたが、主成分分析だけは決定版がなかった。データの1つ1つがヒストグラムのような分布でも、ばらつきの主な方向を取り出せるようにする、数学的に筋の良い拡張だ。", "unverified": "なし"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "スタイン作用素による非正規化モデルの統一的推定", "title": "A unified approach for estimation of unnormalized models via Stein operators", "url": "https://arxiv.org/abs/2610.29510", "authors": "Mitsuki Nagai ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "why": "適切なスコアリングルールとスタイン法を結びつけ、正規化定数のないモデルの推定を統一的に扱った。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "正規化定数が計算できないモデルの推定法（スコアマッチング、比率マッチング、擬似尤度、ノイズ対照推定）を、適切なスコアリングルールとスタイン作用素で統一的に扱った。", "p3": "これらを包む適切なスコアリングルールのクラスを作り、それが自然にスタイン作用素を導くことを示して、作用素に伴う幾何から推定量を調べた（抄録）。", "p5": "スタイン作用素の新しい構成原理を得て、得られる推定量の漸近効率を統一的に特徴づけた（抄録）。", "fun": "確率の合計が1になるように割る「正規化」が計算できない複雑なモデルでも推定する方法はいくつもあったが、ばらばらに発展してきた。それらが同じ数学の型の別の姿だと示すのは、地図を1枚にまとめるような仕事だ。", "unverified": "なし"}}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "PDE逆問題の逐次エントロピー最適輸送", "title": "Sequential Entropic Optimal Transport for Bayesian Inverse Problems via Multilevel Monte Carlo", "url": "https://arxiv.org/abs/2610.29546", "authors": "Jason Beh ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "why": "偏微分方程式に支配される逆問題のベイズ推定を、多段階モンテカルロと逐次的な最適輸送で効率化した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "偏微分方程式に支配される逆問題のベイズ推定で、多段階モンテカルロ法の組み合わせを逐次的なエントロピー最適輸送で作る新しい方法を示した。", "p3": "精度の異なる数値解法に対応する事後分布の組を、軽いシュレディンガー・ブリッジで学習した最適輸送で結び、組を保つメトロポリス・ヘイスティングスのステップで補正する（抄録）。", "p5": "楕円型の逆問題で平均二乗誤差O(δ²)を最適な費用O(δ⁻²)で達成できることを示した。楕円型、Darcy流、Navier–Stokesの問題で分散を減らした（抄録）。", "fun": "粗い計算と細かい計算を組み合わせて、少ない計算量で精度を出す工夫が多段階モンテカルロ法だ。その組み合わせ方を「分布をどう運ぶか」という最適輸送の問題として学習する、という発想が新しい。", "unverified": "分散の削減の具体的な倍率は抄録からは確認できなかった。"}}, {"id": "pn31", "rank": 31, "field": "統計学", "headline": "不完全な物理知識を使う回帰のミニマックス率", "title": "Minimax Rates for imperfect Physics-Informed Regression", "url": "https://arxiv.org/abs/2610.29532", "authors": "Nathan Doum\\`eche (LPSM)", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "why": "目的関数が偏微分方程式を近似的にしか満たさないとき、物理情報がどれだけ推定を改善するかを率で示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "物理モデル（偏微分方程式）が不完全なときに、物理の知識が回帰の収束の速さをどれだけ改善するかを、ミニマックス率で明らかにした。", "p3": "滑らかさだけを事前情報とする場合を基準とし、モデル誤差の大きさに応じた収束率を、線形の偏微分方程式と一部の非線形の方程式について導いた（抄録）。", "p5": "モデル誤差にはしきい値があり、それを超えると物理の事前知識は収束率を改善しない。しきい値より下では、定数係数の楕円型・双曲型の方程式で率が連続的に改善し、物理が正確なら次元dではなくd−1での学習に相当した（抄録）。", "fun": "「物理法則を入れればAIは賢くなる」とよく言われるが、その法則が少し間違っているとどうなるか。間違いが一定以上なら物理を入れても得はない、というはっきりした境界を示した点が重要だ。", "unverified": "なし"}}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "視覚言語エージェントは3次元空間を探索・地図化できるか", "title": "SpatialScout: Can VLM Agents Actively Explore and Map 3D Scenes?", "url": "https://arxiv.org/abs/2610.26659", "authors": "Zhaoxi Zhang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-22", "why": "エージェントが自ら視覚情報を取りに行き、3次元の表現にまとめる能力を測る基準を示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を使用", "preprint": true, "short": true, "p1": "視覚言語モデルのエージェントが、自らカメラを動かして室内を探索し、物体の位置を3次元の地図にできるかを測るベンチマークを作った。", "p3": "80の室内シーンと3,140の対象物体からなり、エージェントは物体一覧・画像・カメラ情報を受け取ってカメラを操作し、共通の座標系で物体の中心を推定する。位置の精度と網羅性を物体の大きさに応じた重なりの点数で評価する（抄録）。", "p5": "評価した中で最も強いClaude Opus 5.5でも平均の重なりの点数は41.71%で、IoU 0.5を超えた対象は47.23%、0.9を超えたのは3.25%だった（抄録）。", "fun": "部屋の写真を見て「椅子がある」と答えるのは得意なAIも、自分で歩き回って「椅子はどこにあるか」を正確な地図にするのはまだ苦手。見ることと、空間を把握することの間に大きな差があることが数字で分かる。", "unverified": "なし"}}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "実環境から学ぶコンピュータ操作エージェントの環境合成", "title": "Agent World Model in the Wild: Computer-Use Agent Environment Synthesis", "url": "https://arxiv.org/abs/2610.26828", "authors": "Zhaoyang Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-22", "why": "実際のコンピュータ環境を模した学習環境を自動合成し、エージェントの相互作用による学習を拡大した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を使用", "preprint": true, "short": true, "p1": "コンピュータを操作するAIエージェントを訓練するための、実行可能な環境と課題を公開モデルだけで大量に合成するパイプラインを示した。", "p3": "画面操作、MCPサービス、コマンドラインを同時に使える環境を作り、解けること・十分難しいこと・検証器が信頼できることを、複数のエージェントの試行、評価役どうしの一貫性、反実仮想の検査で確かめる品質の関門を設けた（抄録）。", "p5": "このパイプラインで341の長期的な環境を合成したと報告している（抄録の途中まで）。", "fun": "本物のパソコンでAIに練習させると、間違ってファイルを消すなどの危険がある。そこで、練習用の「本物そっくりの仮想パソコン」と問題集を自動で作る。しかもその問題が解けるか、採点が正しいかまで自動で点検する。", "unverified": "訓練したエージェントの成績は、取得した抄録が途中で切れていたため確認できなかった。"}}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "最先端エージェントは科学のML改善を自動化できるか", "title": "Automating ML for Science: Can Frontier Agents Climb Scientific Hills in the Wild?", "url": "https://arxiv.org/abs/2610.28763", "authors": "Ming Zhong ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-22", "why": "科学の機械学習モデルを改善する実課題で、コーディングエージェントが自動研究者として通用するかを評価した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を使用", "preprint": true, "short": true, "p1": "最先端のコーディングエージェントが、科学の機械学習モデルの最良記録をどこまで改善できるかを、11分野20ベンチマークで調べた（Agent4Sci）。", "p3": "順位付けではなく、実際の条件でエージェントがどんな前進を、どこまでできるかを測り、試行の軌跡を分析した（抄録）。", "p5": "すべてのベンチマークで公表済みの最良記録を上回り、Claude Opusの平均相対改善は10.4%だったが、改善はほぼ機械学習の工学的な小技によるものだった。研究の発想や実験管理の軽い補助を加えると、Claude Opusは20.1%、Codexは4.4%から8.1%に伸びた（抄録）。", "fun": "AIは科学の記録を更新できたが、それは「新しい発見」ではなく「調整のうまさ」によるものだった。研究者らしい発想を促すチェックリストを渡すと成績が2倍になる、というのは人間の研究指導にも通じる話だ。", "unverified": "なし"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "Muonの直交化はヘッセ行列の構造に適応する", "title": "How Does Orthogonalization Adapt to the Neural Network Hessian Structure? A Gradient Self Outer-Product Analysis at Initialization", "url": "https://arxiv.org/abs/2610.28975", "authors": "Shenyang Deng ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "why": "AdamWを上回ることの多いMuon最適化が、なぜニューラルネットの曲率構造に合うのかを初期化時の解析で示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "最適化手法Muonの直交化が、なぜニューラルネットの損失の曲率構造（ヘッセ行列）に合っているのかを、初期化時の理論で説明した。", "p3": "層ごとのヘッセ行列が行ブロック対角優位であることと、Muonの暗黙の前処理が勾配の自己外積VVᵀの対角優位のときに同じ構造を持つことに注目し、初期化時のE[GGᵀ]を漸近的に解析した（抄録）。", "p5": "重み行列の過剰パラメータ化が対角優位を生むという直観を、定量的な漸近理論として示した（抄録）。", "fun": "Muonという新しい学習法は、なぜか定番のAdamWより速く学習することが多い。その理由を「ネットワークが大きすぎるほど、学習の地形が直交化と相性の良い形になる」と説明しようとしている。経験則に理屈を与える研究だ。", "unverified": "理論と実際の学習の比較の結果は抄録からは確認できなかった。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "文脈内強化学習は事後サンプリングか", "title": "Is In-Context Reinforcement Learning A Posterior Sampler? An Empirical Study", "url": "https://arxiv.org/abs/2610.28977", "authors": "Weiqin Chen ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "why": "大規模言語モデルの文脈内強化学習が事後サンプリングとして振る舞うかを実証的に検証した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "文脈内強化学習（パラメータを更新せず文脈から新しい課題に適応する手法）が、実際にはベイズの事後サンプリングとして振る舞っていないことを統計的検定で示した。", "p3": "事後サンプラーが満たすべき2つの必要条件（十分統計量に対する不変性、マルチンゲール性）を検定する方法を作り、Decision-Pretrained Transformerとその変種を、ガウス・ベルヌーイ・線形の多腕バンディットで調べた（抄録）。", "p5": "両方の条件が一貫して破れており、実際に学習したモデルはベイズ的な事後サンプラーとして振る舞っていない可能性が示された（抄録）。", "fun": "理想的な条件ではAIが「確率的に正しく推論している」と証明されていても、実際に作ったAIがそうなっているとは限らない。理論の約束を、統計の検定で実物に対して確かめる、という姿勢が大切だ。", "unverified": "なし"}}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "大規模な連続フロー言語モデル", "title": "Large Flow Language Models", "url": "https://arxiv.org/abs/2610.28559", "authors": "Arnav Chavan ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-21", "why": "並列生成ができる連続フローの言語モデルを数十億パラメータ規模で構築する技法を示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を使用", "preprint": true, "short": true, "p1": "連続的なフローで文章を並列生成する言語モデルを80億パラメータまで効率よく拡大し、自己回帰モデルと同等以上の質と高い処理速度を得た（Lafa）。", "p3": "接頭部には因果的な注意、各ブロック内では双方向・非同期のフローを使うブロック単位のモデルで、学習済みの自己回帰モデルを転用し、300億トークン未満で0.5B・7B・8Bの規模を学習した（抄録）。", "p5": "指示追従・推論・コーディングで自己回帰モデルに並ぶか上回り、フローの草案を同じモデル内で自己回帰的に検証する自己投機的デコードで、同等の質で自己回帰モデルの2.54倍の処理速度を得た（抄録）。", "fun": "今のAIは文章を1語ずつ順に書くが、この方法はまとまった塊を一度に下書きし、それを自分で確認する。下書きと清書を1つのモデルでこなすことで速さと質を両立した、という仕組みが面白い。", "unverified": "なし"}}, {"id": "pn38", "rank": 38, "field": "機械学習", "headline": "推論モデルは考えるほど「いくつか」を字義通りに読む", "title": "Entertain, then Cancel: How Thinking Makes Reasoning Models Read Some and Or Literally", "url": "https://arxiv.org/abs/2610.21204", "authors": "Zhizhuo Kou ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-22", "why": "思考時間を延ばすと、推論モデルが会話上の含意を取らず字義通りに解釈するようになることを示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を使用", "preprint": true, "short": true, "p1": "推論モデルに長く考えさせると、「いくつかの」や「または」を会話の含意ではなく論理どおりに読むようになることを示した。", "p3": "重みを固定して思考の長さだけを変え、モデルがどちらの読みを選ぶかを記録し、思考を途中で打ち切って答えさせることで、読みが変わる地点を調べた（抄録）。", "p5": "考えるほど「いくつか（すべてではない）」「または（両方ではない）」の含意が消え、試した多くの公開推論モデルとGPT-5でそうなった。間接的な答えのような文脈による推論は改善した。モデルは最初に含意の読みを持ち、後で打ち消していた（抄録）。", "fun": "「何人か合格した」と聞けば、普通は「全員ではない」と受け取る。ところがAIはよく考えるほど「全員でもありうる」と理屈っぽく読む。考えすぎると空気が読めなくなる、という人間にも覚えのある現象だ。", "unverified": "なし"}}, {"id": "pn39", "rank": 39, "field": "機械学習", "headline": "人の動作から両手の器用な操作を追従制御", "title": "DONIC: Generalist Dexterous Bimanual Tracking Control from Human Demonstrations", "url": "https://arxiv.org/abs/2610.29997", "authors": "Mingze Sun ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-22", "why": "人のデモから多様な両手操作を追従する汎用的な制御を学ぶ方法を示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を使用", "preprint": true, "short": true, "p1": "人の動作から作った参照に沿って、ロボットの両手で多様な器用な操作を行う汎用の追従制御（DONIC）と、両手操作のデータセット（BiHOI）を示した。", "p3": "229物体・1,575系列の多視点データから再構成した操作をロボットの参照に変換し、近接方策最適化と行動模倣を、成功した実行を訓練データに戻す循環で組み合わせ、物体中心の手ごとの報酬などを導入した（抄録）。", "p5": "1つの方策で、異なる参照にまたがる協調操作を学習できたと報告している（抄録の途中まで）。", "fun": "ふたを開ける、物を持ち替えるといった両手の作業は人には簡単でも、ロボットには指と物の接触の組み合わせが多すぎて難しい。人の動きを手本にし、うまくいった動きを教材として再利用する仕組みで学ばせている。", "unverified": "成功率などの数値は、取得した抄録が途中で切れていたため確認できなかった。"}}, {"id": "pn40", "rank": 40, "field": "因果推論", "headline": "クラスタ化したオンライン実験の分位処置効果", "title": "CAQ: Clustered Asymptotically Anytime-Valid Quantile Treatment Effects for Online Experiments", "url": "https://arxiv.org/abs/2610.30019", "authors": "Diane Lu ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "why": "観測が独立でないオンライン実験で、分位点の処置効果を常時監視できる信頼系列を構成した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "利用者ごとに相関した多数のイベントが生じるオンライン実験で、分位点の処置効果をいつ止めても有効に推定できる信頼系列（CAQ）を示した。", "p3": "無作為化は利用者単位だが指標はイベント単位で計算されるという構造に合わせ、利用者内の依存に頑健で任意の停止時刻で有効な分位点の信頼系列と、2群の分位点の差の逐次検定を作った（抄録）。", "p5": "シミュレーションで、クラスタリングの強さや裾の重いデータにかかわらず被覆率と偽陽性率を名目水準に保てたのはCAQだけで、固定期間の方法と独立を仮定する逐次の方法は破綻した（抄録）。", "fun": "ウェブの実験では、1人の利用者が何十回もクリックするので、データは独立ではない。それを無視すると「効果あり」と言いすぎる。中央値や上位10%のような分位点で効果を見たいときにも、正直な幅を出せるようにした。", "unverified": "なし"}}, {"id": "pn41", "rank": 41, "field": "因果推論", "headline": "ネットワーク形成を変える政策の学習", "title": "Policy Learning with Network-Shaping Assignments", "url": "https://arxiv.org/abs/2610.29221", "authors": "Zhenxiao Chen ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "why": "割り当てがその後の関係形成を変え、効果がネットワークに依存する政策を学習する方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "割り当てがその後の人間関係（ネットワーク）の形成を変え、成果がそのネットワークに依存するような政策を、データから学習する方法を示した。", "p3": "割り当て後のネットワークの分布に対する成果の応答を積分して政策価値を定義し、割り当てをまたいで情報を集めるモデルベースの方法で、識別と代入推定量、後悔の上界を導いた（抄録）。", "p5": "教室の座席配置と企業グループへの応用で、学習した規則が無作為な割り当てより厚生を改善すると予測された（抄録）。", "fun": "教室の席替えは、誰と仲良くなるかを変え、それが成績にも響く。「誰を隣にするか」が新しい人間関係を生むことまで考えて、最も良い席替えのルールをデータから学ぶ、という問題設定が面白い。", "unverified": "改善の大きさは抄録からは確認できなかった。"}}, {"id": "pn42", "rank": 42, "field": "因果推論", "headline": "炭素価格付けと製造業付加価値の段階的DiD", "title": "Carbon Pricing and Manufacturing Value Added: Staggered Difference-in-Differences Evidence from National Carbon Taxes and Emissions Trading Systems", "url": "https://doi.org/10.2139/ssrn.7646959", "authors": "Sinan Borluk", "venue": "SSRN", "date": "2026-10-21", "why": "157か国の1990〜2022年のデータで、炭素税・排出量取引の導入が製造業付加価値に与えた効果を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "炭素税や排出量取引を導入しても、製造業の付加価値にはっきりした影響は見られないことを157か国のデータで示した。", "p3": "1990〜2022年の157か国で、2008〜2022年に導入した17か国を、導入しなかった140か国と比べるCallaway and Sant'Annaの段階的な差の差推定量を使い、初期の製造業規模と所得層で二重頑健に調整した（抄録）。", "p5": "導入年と続く3年の平均効果は−0.009対数ポイント（95%信頼区間−0.054〜0.040）で、事前期間の係数は合わせてゼロと区別できなかった（p=0.92）。約5%を超える減少は信頼区間から除外された（抄録）。", "fun": "「炭素に値段をつけると工場が逃げて産業が衰える」という心配に対して、少なくとも大きな減少は起きていないことを示した。効果がないことを示すときに、どの大きさまでなら否定できるかを明示している点が丁寧だ。", "unverified": "なし"}}, {"id": "pn43", "rank": 43, "field": "因果推論", "headline": "交通部門の汚職は人命を奪う：中国の失脚事例", "title": "Highway to Hell: How Corruption in China’s Transport Sector Kills, and What Happens When Corrupt Officials Fall", "url": "https://doi.org/10.2139/ssrn.7650596", "authors": "Xianyun Zhang ほか", "venue": "SSRN", "date": "2026-10-21", "why": "交通担当の汚職官僚の失脚を使い、汚職が道路の安全に与える影響を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "中国で交通部門の汚職官僚が失脚した後、重大な交通事故の死傷者が減ったことを示し、汚職が道路の安全を損なうことを明らかにした。", "p3": "省の交通担当の汚職官僚の失脚を部門固有の統治のショックとして、省と年の固定効果を持つ多期間の差の差で重大事故の死傷者を分析し、イベントスタディやプラセボ検定、媒介分析を行った（抄録）。", "p5": "失脚後に死傷者は平均約63人減り、効果は時間とともに大きくなった。改善は主に道路の質の向上を通じたもので、貧しく、交通支出が多く、道路の質が低かった省で大きかった（抄録）。", "fun": "汚職は税金を盗むだけでなく、手抜きの道路という形で人の命まで奪う。事故の原因を運転手だけでなく、道路を作る側の不正に求めた視点が鋭い。汚職を「隠れた欠陥」と呼ぶ表現も分かりやすい。", "unverified": "なし"}}, {"id": "pn44", "rank": 44, "field": "人口学", "headline": "機械学習で見るポーランドの出生意図とコロナ禍", "title": "Same Constraints in Changing Times? A Machine-Learning Approach to Childbearing and Fertility Intentions in Poland during and after the COVID-19 Pandemic", "url": "https://econpapers.repec.org/RePEc:war:wpaper:2026-32", "authors": "Anna Kurowska ほか", "venue": "RePEc NEP", "date": "2026-09-28", "why": "パネルデータと機械学習で、パンデミック期の出生の予測因子がその後も有効かを検証した。", "explain": {"basis": "抄録", "basis_note": "RePEcに登録された抄録を使用", "preprint": true, "short": true, "p1": "コロナ禍の間に学習した出生の予測モデルが、その後も有効であることをポーランドのパネルデータで示した。", "p3": "2021〜2024年のポーランドのパネル（18〜49歳、1,925人）で、個人・雇用・パートナー関係・家族の特徴を理論に基づき選び、ランダムフォレストで実際の出生と強い出生意図を予測した（抄録）。", "p5": "パンデミック期に学習したモデルはその後もAUC-ROC 0.86の予測性能を保ち、出生と意図は上位20の予測因子のうち16を共有した。関係の満足度、仕事と生活の両立、家事分担が特に重要だった（抄録）。", "fun": "「子どもを持つかどうか」を左右するのは、特別な危機の要因ではなく、夫婦の関係や家事の分け方といった毎日の暮らしの条件だった。危機が終わっても同じ壁が残っている、という結果は少子化を考える手がかりになる。", "unverified": "なし"}}, {"id": "pn45", "rank": 45, "field": "オペレーションズ・リサーチ", "headline": "有限期間で評価されるSLAの費用効率的な在庫", "title": "Cost-Effective Aggregate Service-Level Agreements: Evidence from Spare Parts Inventory", "url": "https://doi.org/10.2139/ssrn.7656439", "authors": "Patrick Helm ほか", "venue": "SSRN", "date": "2026-10-22", "why": "充足率目標が有限期間で評価される補修部品のSLAで、在庫計画を費用効率よく行う方法を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "補修部品のサービス水準合意（SLA）で、品目群全体の充足率が有限期間内に目標を達成する確率を保証する在庫計画を、わずかな追加費用で実現した。", "p3": "間欠需要の下での(R, s, Q)方策の有限期間の充足率分布をマルコフ連鎖で定式化し、集計した機会制約に対するスケーラブルなラグランジュ最適化を作った（抄録）。", "p5": "約7万品目のデータで、品目ごとの確率目標は長期目標の現状より在庫費用が最大49%増えたが、集計した確率目標の増加は最大5.3%だった。企業のベンチマークを最大1.7%改善し、90%目標の達成率の不足は最大1.6ポイントだった（抄録）。", "fun": "1つ1つの部品について「必ず在庫がある」と約束すると在庫が膨らむが、部品のグループ全体で約束すれば、ある部品の欠品を別の部品の余裕で補える。約束の単位を変えるだけで費用が大きく変わる、という発想が面白い。", "unverified": "なし"}}, {"id": "pn46", "rank": 46, "field": "オペレーションズ・リサーチ", "headline": "並列AIエージェントの協働をグラフ構造の分散最適化として", "title": "Parallel AI Agent Collaboration as Graph-Structured Distributed Block Optimization", "url": "https://arxiv.org/abs/2610.30074", "authors": "Hanmin Li ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "why": "並列エージェントの局所的な編集が全体を劣化させる問題を、ブロック最適化として定式化した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "並列に働くAIエージェントの局所的な編集を合わせると全体が悪くなる問題を、依存グラフ上のブロック最適化として定式化し、安全な統合の保証を示した。", "p3": "依存グラフの独立集合が互いに干渉しない編集を保証することを使い、最適な分数彩色で統合すると、検証された局所改善の合計のうち1/χ_f(G)（χ_fは分数彩色数）の割合を保てることを証明した（抄録）。", "p5": "この保証は同じ提案から選ぶ統合法の中で厳密で、条件の下で協働の反復は幾何級数的に収束する。コード修復の実験で、単純な統合が失敗する衝突を検証付きの統合で解決した（抄録）。", "fun": "何人かで同じレポートを同時に直すと、互いの修正がぶつかって前より悪くなることがある。どの修正がぶつからないかを「色分け」の数学で見分け、良い修正をなるべく多く安全に取り込む方法を示している。", "unverified": "完了時間の削減の大きさは、取得した抄録が途中で切れていたため確認できなかった。"}}, {"id": "pn47", "rank": 47, "field": "オペレーションズ・リサーチ", "headline": "2次元交通流モデルのデータ駆動の較正", "title": "Data-driven calibration of a two-dimensional traffic flow model: Dimension reduction and optimization strategies", "url": "https://arxiv.org/abs/2610.29557", "authors": "Simone G\\\"ottlich ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "why": "道路の縦横の動きを表す2次元交通流モデルを、次元削減と最適化で実データに較正した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "道路の進行方向と横方向の動きを表す2次元の交通流モデルを、実データに効率よく較正する方法を示した。", "p3": "3パラメータの流束モデルで1つのパラメータが線形に入ることを使い、非線形最小二乗を3次元から2次元に減らし、ドローンの軌跡から都市のセンサーまで3つの実データで、局所的な最適化2種と大域的な最適化3種を比べた（抄録）。", "p5": "次元を減らした定式化は大幅に安く、最適化手法の選び方に左右されにくかった。局所的な方法は適切に初期化すれば最も効率的だった（抄録）。", "fun": "車の流れを水の流れのように式で表すとき、式の中のつまみ（パラメータ）を実際のデータに合わせる必要がある。つまみの1つは計算で消せると気づくだけで、合わせる作業がずっと楽で安定する。", "unverified": "なし"}}, {"id": "pn48", "rank": 48, "field": "オペレーションズ・リサーチ", "headline": "遺伝的プログラミングによる解釈可能な切除平面の選択", "title": "Interpretable Cutting Plane Selection for Mixed-Integer Linear Programming Using Genetic Programming", "url": "https://arxiv.org/abs/2610.29311", "authors": "Gwen maudet ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "why": "混合整数計画の切除平面の選び方を、解釈可能な規則として遺伝的プログラミングで学習した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "混合整数線形計画の切除平面（整数解を残して小数解を削る制約）の選び方を、解釈可能な規則として学習する初めての枠組み（GPSCS）を示した。", "p3": "遺伝的プログラミングで、切除平面と解法の状況から得た特徴量によるスコア関数を記号式として進化させ、点数の急な落ち込みを統計的に検出して各回に加える数を決める（抄録）。", "p5": "ソルバーSCIPの中で、合成と実世界の7種類のベンチマークで評価したと報告している（結果の数値は抄録の途中で切れている）。", "fun": "最適化の計算を速くする「どの制約を足すか」の判断を、ブラックボックスのニューラルネットではなく、人が読める数式として学ばせる。なぜその選択がよいのかを人が確かめられる点が、実務で使う上で大きい。", "unverified": "性能の比較の数値は、取得した抄録が途中で切れていたため確認できなかった。"}}, {"id": "pn49", "rank": 49, "field": "組織行動・心理的安全性", "headline": "組織が少数の選択肢しか検討しない理由", "title": "Creativity In Alternative Design: Why Organizatios Consider Few Options and How to Expand Feasible Alternative", "url": "https://doi.org/10.2139/ssrn.7648978", "authors": "Desti Purwanti ほか", "venue": "SSRN", "date": "2026-10-22", "why": "意思決定の代替案設計の段階で、組織が少数の案しか考えない理由と、実行可能な案を広げる方法を論じた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "組織が意思決定で少数の選択肢しか検討しない理由と、実行可能性を保ちながら選択肢を広げる方法を、文献と事例から論じた。", "p3": "限定合理性、組織の創造性、デザイン思考、チームの創造性の文献による概念的レビューに、トヨタ・プリウスの開発を例示的な単一事例として組み合わせた（抄録）。", "p5": "選択肢が少ない原因として時間と情報の制約、組織の慣行、認知の偏り、上下関係の圧力などを挙げ、創造性とは案を多く出すことではなく、異なる案が現れ、試され、選別される過程を作ることだと結論した（抄録）。", "fun": "会議で「A案かB案か」だけを議論していると、もっと良いC案に気づけない。プリウスがハイブリッドという別の道を試したように、案を出す段階を意識して設計することが大切だ、という指摘は身近な話し合いにも当てはまる。", "unverified": "実証的なデータの分析は含まれていない（抄録）。"}}, {"id": "pn50", "rank": 50, "field": "組織行動・心理的安全性", "headline": "帰属の病理：個人の自由と社会的支配", "title": "Pathologies of Belonging: Individual Freedom, Social Domination, and Collective Adaptability", "url": "https://doi.org/10.2139/ssrn.7651641", "authors": "Carlos Federico Obregon Diaz", "venue": "SSRN", "date": "2026-10-21", "why": "形式的な包摂や参加の機会があっても能力が発揮されない状況を、帰属の病理として理論化した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "個人の「帰属の病理」が、社会的な支配や集団の適応力とどう結びつくかを説明する理論的枠組みを示した。", "p3": "感情的な依存、所有欲、承認への強迫、防衛的な孤立などの帰属の形を検討し、崩壊・硬直・代替という時間の流れで、目先の安心と将来の可能性の喪失が共存する仕組みを説明した（抄録）。", "p5": "損なわれた帰属は、成員の満足と成長を直接妨げ、さらに代替案を生み出し、練り上げ、伝え、評価する力を制限して、制度が主体性に開かれていることの効果を弱めると論じた（抄録）。", "fun": "会社や学校に「所属している」ことと、そこで自分の力を発揮できることは違う。居場所への不安やしがみつきが、個人の自由だけでなく、組織が新しいアイデアを生む力まで弱める、という見方は、心理的安全性の議論ともつながる。", "unverified": "実証的なデータの分析は含まれていない（抄録）。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "LLMはSNS上の熟議の質を測れるか", "title": "Can AI Gauge Deliberative Quality? Evaluating Deliberation on Social Media With Large Language Models", "url": "https://doi.org/10.17645/mac.12494", "authors": "Patrick Frey ほか", "venue": "Media and Communication", "date": "2026-10-22", "sjr": 1.089, "citescore": 6.0, "citescore_year": "2025", "theme": "LLM熟議・ペルソナ", "theme_no": 5}, {"id": "jr02", "rank": 2, "headline": "可動橋の常時微動で亀裂の前後を比較", "title": "Ambient vibration–based damage detection for sustainable railway infrastructure: a case study of the Vänersborg railway bascule bridge", "url": "https://doi.org/10.1088/1755-1315/1674/1/012057", "authors": "Quang-Vinh Pham ほか", "venue": "IOP Conference Series: Earth and Environmental Science", "date": "2026-10-22", "citescore": 1.4, "citescore_year": "2025", "theme": "VBI・橋梁SHM", "theme_no": 1}, {"id": "jr03
