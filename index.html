downにし、目次の階層を復元して章ごとの文書に分ける。各章から定理・補題・定義と証明の組（Proof QA）を取り出し、証明の中の省略された推論の段階を見つけて、それを独立した命題と証明に書き直したもの（Gap QA）を加える。Gap QA 174,431件とProof QA 205,861件からなり、構造と意味の両面で品質を検査した（§3.1）。", "p4": "同じ基盤モデルを各データで微調整して比べる。評価用に64冊を除外し、その教科書の演習から作った証明問題300問（TOME-LongForm）と、客観問題145問、公開ベンチマーク（MiniF2F、ProofNet、MATH-500、AIME2026）で測った。長文の証明は1問につき16個の解を生成し、参照つきの検証器で採点した（§4.1）。", "p5": "6つの評価のうち5つで最良で、平均は基盤モデルの29.17%から45.83%に上がった（16.66ポイントの改善）。規模が約4.8倍の公開データ（1.82M件）もすべての評価で上回った（§4.2）。章の順に進み、Gap QAを先に学ぶ順序は無作為な順序より良く、差は学習量が増えるほど広がった（4.34から7.72ポイント）（§5.2）。", "p6": "著者は、比較したデータどうしは複数の点で異なるため、全体の比較だけでは教科書の構造が原因だとは切り分けられないと認め、順序などを統制した実験で補っている（§4.2）。データの生成と品質判定、採点にLLMを使っており、その誤りの影響は読んだ範囲では未確認。1つの基盤モデルでの結果である。", "fun": "数学の教科書は、前の章の定理を使って次の章の定理を証明する、というふうに積み上げで書かれている。ところがAIの学習用データは、問題と答えをばらばらにした形になりがちだった。この研究は、教科書の順番と「この証明はあの定理を使う」というつながりを残したままデータにした。さらに、証明の中で省かれた「行間」を掘り出して、それも問題にした。順番どおりに学ばせたAIのほうが、ごちゃまぜに学ばせたAIより成績が良かった。", "unverified": "付録（構築と採点の詳細）、検索への応用、出典の幅の実験は読んでおらず未確認。"}}, {"id": "pn02", "rank": 2, "field": "機械学習", "headline": "教科書を自分で読んで学ぶ力を強化学習で引き出す", "title": "Incentivizing Self-Learning in Large Language Models via Reinforcement Learning", "url": "https://arxiv.org/abs/2610.39671", "authors": "Lingkai Kong ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-12", "apa": "Kong, L., Gu, Y., Zhao, H., Wu, Z., Fang, Y., Hua, Z., Sun, Y., Chen, K., & Zhang, W. (2026). Incentivizing Self-Learning in Large Language Models via Reinforcement Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.39671", "why": "未知の分野の問題を解くには、検索した事実を集めるだけでなく、長い資料を読んで原理を学び適用する力が要る。教科書にもとづく数学の証明問題（模範解答は与えない）を課題とし、教科書をたどるインターフェースと細かな報酬の強化学習で「自己学習」を促した。分野内外の教科書と科目で成績が上がり、あるモデルの証明の正答率が51.5%から79.5%になったと報告する。", "explain": {"basis": "本文", "basis_note": "arXivのHTML版の本文のうち、要旨、手法（§2）、実験の設定と主な結果（§3.1〜3.2）、結論（§5）を読んだ。§3.3以降の分析と付録は未読", "preprint": true, "p1": "言語モデルが、参照用の教科書を自分で読み進めながら数学の証明問題を解く「自己学習」の力を、強化学習で大きく伸ばせることを示した（要旨、§3.2、§5）。未査読のプレプリント。", "p2": "未知の分野の問題を解くには、検索した事実を集めたり、あらかじめ用意された文脈から学んだりするだけでは足りず、知識の獲得と推論を密に結びつける必要がある。長い参照資料をその場で調べ、学び、適用する力をどう引き出すかが課題だった（要旨）。", "p3": "証明問題と、解答を除いた構造化された教科書の組を与える。モデルは目次を見る・キーワードで探す・節を読むという3種類の操作（BookNavigator）を、推論と交互に最大8回まで行い、最後に証明を出す（§2.1、§2.3、§3.1）。最終の正誤だけでは個々の調べ方の良し悪しが分からないので、徐々に弱める探索ボーナスと、回ごとの道具の評価を報酬に加えた（§2.4）。", "p4": "教科書158冊から取り出した5,183問のうち、132冊の4,557問で学習した。学習に使った教科書の未使用の問題、未使用の教科書、未使用の科目（確率・統計）の3つの評価区分で、教科書なし、関連する節を先に与える方式などと、証明の正答率を比べた。正誤は8回の独立な審査すべてが正しいと判定したときだけ正解とする（§3.1）。", "p5": "強化学習の前は、自己学習の正答率は51.5%で、教科書なしの55.7%より低かった。強化学習の後は79.5%で最も高く、最も強い基準手法（73.1%）を6.4ポイント上回った。未使用の教科書で85.2%、未使用の科目で86.7%だった（§3.2、表1）。", "p6": "正誤の判定はLLMによる審査に依存し、対象は数学の証明と1つの基盤モデルである。著者の述べる限界は読んだ範囲に明示がなく、他の課題への転移の詳細（§3.4）と報酬の切除実験（§3.5）は読んでおらず未確認。", "fun": "教科書を見てよい試験でも、どこを開けばよいか分からなければ役に立たない。最初は、教科書を自分で調べるやり方のほうが、教科書なしより成績が低かった。そこで「解けたら点をあげる」だけでなく、「役に立つ調べ方をしたら点をあげる」という練習をさせた。すると成績が大きく伸び、初めて見る教科書や科目でも通用した。答えではなく、調べて学ぶやり方そのものを身につけたことになる。", "unverified": "他の種類の課題への転移、報酬の切除実験、付録は読んでおらず未確認。"}}, {"id": "pn03", "rank": 3, "field": "統計学", "headline": "差の差分析の外れ値処理はセルごとに行うべき", "title": "Separate versus Pooled Winsorization in Difference-in-Differences: Bias, Efficiency, and Finite-Sample Guarantees", "url": "https://doi.org/10.2139/ssrn.7682754", "authors": "Yukai Huang ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Huang, Y., Cheng, C., & Hu, C. (2026). Separate versus Pooled Winsorization in Difference-in-Differences: Bias, Efficiency, and Finite-Sample Guarantees. https://doi.org/10.2139/ssrn.7682754", "why": "差の差（DiD）分析では極端な値をウィンソライズ（上下の端の値を閾値に置き換える処理）することが多いが、効果の推定値と標本誤差の両方が変わりうる。2群2期間の設定で、群×期間のセルごとに閾値を決める方法は、適切に較正した割合のもとで一様なサブガウス型の偏差保証を持つが、生のDiDと全体をまとめて閾値を決める方法は同じ保証を得られないことを示した。まとめる方法は漸近的に偏りが残りうる。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "差の差（DiD）分析で外れ値をウィンソライズ（端の値を閾値に置き換える処理）するとき、閾値を群×期間のセルごとに決める方法と、全体をまとめて決める方法のどちらがよいかを、有限標本と漸近の両面から理論的に示した（抄録）。未査読のプレプリント。", "p2": "業務データには極端な値が多く、DiDの実証研究ではそれらをウィンソライズして影響を抑えることが多い。しかしこの処理は、推定される処置効果と標本誤差の両方を変えうる。いつ推定が改善するのか、閾値をセルごとに計算すべきか全体で計算すべきかの指針がなかった（抄録）。", "p3": "2群・2期間のDiDを設定し、分散が有限の連続な結果変数について、推定量の偏差がどの範囲に収まるか（有限標本の保証）と、標本が大きいときの偏りと分散を解析する（抄録）。解釈：全体をまとめて閾値を決めると、水準の違うセルで切られ方が不均等になり、それが偏りの原因になると考えられる。", "p4": "比べる対象は、処理をしない生のDiD、セルごとのウィンソライズ、全体をまとめたウィンソライズである。良さの基準は、一様なサブガウス型の偏差保証を持つか、漸近的に偏りがないか、漸近分散が小さいかで、数値実験で理論と照らした（抄録）。", "p5": "セルごとの方法は、割合を適切に較正すれば一様なサブガウス型の偏差保証を達成するが、生のDiDとまとめる方法は同じ保証を達成できない。セルごとの方法が漸近的に不偏になる条件のもとで、割合を固定したまとめる方法は偏りが残りうる。各セルの誤差分布が両側で故障率減少の条件を満たせば、セルごとの方法の漸近分散は、どの固定の割合でも生のDiDより厳密に小さい（抄録）。", "p6": "結果は2群・2期間で分散が有限の連続な結果変数という設定のもとでのもので、処置時期がずれる設計や共変量つきの推定への拡張は抄録に記載がない。裾の重さの通常の分類だけでは効率の順位が決まらないとも述べている。著者の述べる限界は本文を読めておらず未確認。", "fun": "平均を比べるとき、極端に大きい値や小さい値を「上限・下限に丸める」ことがある。問題は、丸める線をどこで引くかだ。政策の前と後、受けた組と受けなかった組という4つのグループをまとめて一本の線を引くか、グループごとに引くか。この研究は、まとめて引くやり方では効果の推定に偏りが残りうること、グループごとに引けば良い保証が得られることを数学で示した。よくある下処理の落とし穴である。", "unverified": "SSRNの本文を取得できず、定理の正確な仮定、較正する割合の式、数値実験の設定と結果は未確認。"}}, {"id": "pn04", "rank": 4, "field": "経済学", "headline": "報道90万本から「体感の金融ストレス」を指数化", "title": "Stress in the Press or Stress in the Market: A New Measure of Perceived Financial Stress", "url": "https://doi.org/10.2139/ssrn.7685338", "authors": "Fred Liu ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Liu, F., Duprey, T., & Barnes, B. (2026). Stress in the Press or Stress in the Market: A New Measure of Perceived Financial Stress. https://doi.org/10.2139/ssrn.7685338", "why": "カナダの1977〜2026年の経済・ビジネス記事90万本超から、データ駆動のキーワード発見アルゴリズムで解釈可能な報道ベースのストレス指数を作った。市場の混乱が小さくても金融リスクへの懸念が強まる時期を捉える。線形と分位点拡張のVARで、金融ショックと直交する報道ショックは主に無担保の消費者信用を分布全体で減らし、市場ベースの金融ショックは信用と実体経済の下振れリスクを悪化させることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "カナダの1977〜2026年の経済・ビジネス記事から、金融ストレスがどう受け止められているかを測る解釈可能な報道ベースの指数を作り、それが市場ベースの金融ショックとは別の経路で経済に効くことを示した（抄録）。未査読のプレプリント。", "p2": "市場の混乱が限られていても、金融リスクへの懸念が強まる時期がある。人々が感じ取る金融ストレスを、市場の動きと区別して測り、その影響を調べる方法が必要だった（抄録の記述にもとづく解釈）。", "p3": "経済・ビジネス記事90万本超を入力とし、データ駆動のキーワード発見アルゴリズムで報道ベースのストレス指数（NSI）を作る。この指数を、線形のVARと、分布の各位置への影響を見られる分位点拡張のVARに入れて、ショックの波及を推定する（抄録）。背景：VARは複数の経済変数が互いに影響し合う動きを同時に扱う時系列モデル。", "p4": "指数が主要なストレスの局面を追えているかを確かめたうえで、金融ショックと直交する（重ならない）報道ショックと、市場ベースの金融ショックのそれぞれが、信用と実体経済の分布にどう効くかを比べた（抄録）。", "p5": "指数は主要なストレスの局面を追い、市場の混乱が限られていても懸念が強まった時期を捉えた。報道ショックは主に無担保の消費者信用を、分布全体をずらす形で減らした。市場ベースの金融ショックは、信用と実体経済の両方の下振れリスクを主に悪化させた。著者は、知覚された金融ストレスが家計の予備的な行動を通じて働く別の伝達経路だと述べる（抄録）。", "p6": "1か国の結果で、キーワードの選ばれ方、報道量の時代変化への調整、効果の大きさは抄録に記載がない。著者の述べる限界は本文を読めておらず未確認。", "fun": "金融の不安は、市場の数字だけでなく、ニュースの言葉にも表れる。この研究は、約半世紀分の記事を機械に読ませ、金融の不安を語る言葉から指数を作った。面白いのは、市場が大きく荒れていなくても、報道から読み取れる不安が高まるだけで、家計が無担保の借り入れを控えるようになることだ。市場の動きと、人々の受け止め方は、別々の道を通って経済に効いてくる。", "unverified": "SSRNの本文を取得できず、キーワード発見アルゴリズムの詳細、VARの変数と識別の仮定、効果の大きさは未確認。"}}, {"id": "pn05", "rank": 5, "field": "経営学", "headline": "検索へのAI統合でChatGPTの訪問が5.9%減", "title": "Integration and Competition in Generative AI: Evidence from Google’s AI Mode Rollout", "url": "https://econpapers.repec.org/RePEc:ces:ceswps:_13098", "authors": "Michelangelo Rossi ほか", "venue": "RePEc NEP", "date": "2026-11-09", "why": "Googleが2025年8月に検索内のAIモードを25か国に広げた機会を使い、10のAIアシスタントのウェブ訪問数の推定値を、未提供の30か国と比べる差の差分析を行った。提供開始から4週間でChatGPTのサイト訪問が5.9%（対象国全体で1日350万件）減り、減少は直接訪問に集中した。Geminiと小規模な8サービスの合計には有意な平均効果がなかった。配布経路がAIアシスタント間の競争に効くことを示す。", "explain": {"basis": "抄録", "basis_note": "RePEcの登録を手がかりにCrossrefで見つかった抄録を使用。本文は未取得", "preprint": true, "p1": "Googleが検索の中に対話型のAIモードを組み込んだことで、競合するAIアシスタントのサイトへの訪問がどれだけ減ったかを、国ごとの提供時期の違いを使って測った（抄録）。未査読のワーキングペーパー。", "p2": "生成AIを既存のデジタル基盤に統合すると、AIアシスタント間の競争が変わりうる。しかし、検索への統合が競合サービスへの流入を実際に減らすのかは確かめられていなかった（抄録）。", "p3": "2025年8月にAIモードが25の標本国に広がった機会を使う。10のAIアシスタントのウェブ訪問数の推定値を、AIモードが使えなかった30か国と比べる差の差分析を行う（抄録）。背景：差の差分析は、対象の集団と比較の集団の前後の変化の差から効果を取り出す方法。", "p4": "主な指標はサイトへの訪問数で、訪問の経路（直接訪問、検索からの流入）、1日あたりの訪問者数、訪問者あたりの訪問数、平均の滞在時間に分けて調べた。比較の国にもAIモードが提供されるまでの40日間を追跡した（抄録）。", "p5": "提供開始から4週間で、ChatGPTのサイト訪問は5.9%減り、対象国全体で1日350万件の減少に相当した。減少は直接訪問に集中し、検索からの流入はほとんど変わらなかった。1日あたりの訪問者数も同程度に減ったが、訪問者あたりの訪問数と滞在時間はほぼ変わらなかった。Geminiと小規模な8サービスの合計には有意な平均効果がなかった（抄録）。", "p6": "訪問数は推定値にもとづく。追跡は比較の国にも提供が始まるまでの40日間に限られ、長期の効果は分からない。著者の述べる限界は本文を読めておらず未確認。", "fun": "検索サイトにAIとの対話の機能が付くと、わざわざ別のAIのサイトへ行く人は減るのだろうか。答えは「減る」だった。面白いのは減り方で、訪れた人の利用の濃さはほとんど変わらず、その日に訪れる人の数そのものが減った。多くの人が毎日使う入口を持っていることが、AIどうしの競争を左右するという結果である。", "unverified": "ワーキングペーパーの本文を取得できず、訪問数の推定の出所、対象国の選び方、頑健性の確認の内容は未確認。"}}, {"id": "pn06", "rank": 6, "field": "機械学習", "headline": "効果の向きは人と同じでも誤り方が違う言語モデル", "title": "CogBattery: Human-Referenced Evaluation of Cognitive Task Behavior and Structure in Language Models", "url": "https://arxiv.org/abs/2607.24999", "authors": "Dengzhe Hou ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-12", "apa": "Hou, D., Jiang, L., Lin, F., & Yamada, K. D. (2026). CogBattery: Human-Referenced Evaluation of Cognitive Task Behavior and Structure in Language Models (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2607.24999", "why": "13の認知課題を文章版にして54のオープンな言語モデルに課し、元の研究の人間のデータと条件ごとに比べた。モデルは人間と同じくn-back課題のルアー（紛らわしい刺激）に強く反応するが、ふつうの非標的への誤警報がはるかに多い。確信度で正誤を分ける力は多くのモデルで人間より弱い。課題をまたぐ得点には2つの次元があり、第1の次元は規模と結びつくが、大きいモデルほど人間に近いわけではない。", "explain": {"basis": "本文", "basis_note": "arXivのHTML版の本文のうち、要旨、課題とモデルの説明（§3）、主な結果（§5.1、§5.5、§5.6）、得点の構造（§6）、考察、結論、限界を読んだ。その他の結果の節と付録は未読", "preprint": true, "p1": "人の認知課題13種類を文章版にして54のオープンな言語モデルに課し、条件ごとの人のデータと比べる評価基盤CogBatteryを作り、効果の向きが人と同じでも誤り方と確信度の報告は人と違うことを示した（要旨、§8）。未査読のプレプリント。", "p2": "人の認知課題を使えば、言語モデルと人を統制された条件で比べられる。しかしモデルは、人の効果の向きを再現しながら、違う誤りをしていることがありうる。向きだけの比較ではそれが見えなかった（要旨）。", "p3": "作業記憶（数唱、n-back）、干渉と反応の制御、リストの想起、他者の信念の推測、確信度と賭けなど13の課題を、元の研究の人のデータつきで用意する。23系統・54モデル（パラメータ数0.36B〜141B）に、温度0で各ステップ1回ずつ回答させ、形式の妥当性を確かめたうえで採点する（§3.1〜3.3）。", "p4": "課題ごとに、条件別の正答や誤警報、確信度が正誤を分ける力（タイプ2のAUROC）などを人と比べる。最低限の成績を満たすモデルに限った比較（ゲート）と、モデルの規模との関係、課題間の得点の構造（主成分と、認知的な分類による予測の改善）も調べた（§4、§5.6、§6）。", "p5": "2-backで、モデルは人と同じくルアー（紛らわしい刺激）に多く反応したが、ふつうの非標的への誤警報が54モデル中39モデルで人より多かった（§5.1）。確信度のAUROCは47モデルで人より低く、37モデルは常に同じ賭けを選んだ（§5.5）。得点の第1主成分は分散の39.23%を説明して規模と相関したが、大きいモデルほど一貫して人に近いわけではなく、認知的な分類は無作為な分類に対する確かな予測の利点を示さなかった（§5.6、§6）。", "p6": "著者は、文章版の課題を人に実施していないため、人とモデルの差には課題の改変と集団の違いが混ざること、各ステップ1回の回答で分布を推定していないこと、クローズドなモデルを試していないこと、公開済みの課題が学習データに含まれうるのに汚染の検査をしていないことを限界に挙げる（限界の節）。", "fun": "「少し前と同じ文字が出たら反応する」という記憶のテストがある。紛らわしい位置で同じ文字が出ると、人はつられて反応してしまう。AIにも同じ「つられ」が見られたので、人と似ているように見える。ところがAIは、関係のない文字にもたくさん反応していた。結果の向きが同じでも、間違え方を見ると中身は違っていた。「似た成績」と「似た仕組み」を区別する大切さを教えてくれる。", "unverified": "各課題の細かな数値（表4、表5）、付録、人のデータの出所の詳細は読んでおらず未確認。"}}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "保守系放送局の参入後、環境配慮商品の伸びが鈍る", "title": "The News Environment and Politically Coded Product Demand", "url": "https://doi.org/10.2139/ssrn.7682545", "authors": "Ali Umut Guler ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Guler, A. U., & Singh, V. (2026). The News Environment and Politically Coded Product Demand. https://doi.org/10.2139/ssrn.7682545", "why": "2012〜2016年にシンクレア放送グループが48の地方テレビ市場に参入し、報道がより保守的・全国志向になった機会を使った。ニールセンIQのスキャナーデータで、リベラルな世帯の需要が高いとされる環境・健康・動物福祉の属性を持つ商品の数量シェアを10品目で測ると、参入後は対照の郡より伸びが鈍く、0.087ポイント（比例の定式化で6.9%）低かった。価格と品ぞろえに検出できる変化はなかった。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "地域のテレビ報道の環境が変わると、政治的な立場と結びついた商品属性（環境配慮、健康、動物福祉）への需要が変わることを、放送局の参入を利用して示した（抄録）。未査読のプレプリント。", "p2": "商品の属性には、政治的な見方によって評価が分かれる関心を映すものがある。市場の報道環境が変わったとき、そうした属性への需要が変わるのかは確かめられていなかった（抄録）。", "p3": "2012〜2016年にシンクレア放送グループが48の地方テレビ市場に参入したことを使う。この所有の変化は、より保守的で全国志向の報道と関連する。ニールセンIQのスキャナーデータで、リベラルな世帯の需要が高いと先行研究が示す環境・健康・動物福祉の属性を持つ商品の数量シェアを、10の品目で測る（抄録）。", "p4": "参入した市場の郡を、参入のなかった市場の対応させた郡と比べる。価格、入手のしやすさ、広告、世帯パネルでの購入、関心を表す検索量、郡の党派性による違いも調べた（抄録）。", "p5": "参入後、この数量シェアは対照の郡より伸びが鈍く、0.087ポイント低かった（比例の定式化では6.9%）。世帯パネルでは、それまで買っていなかった世帯での採用が遅くなった。価格と入手のしやすさに検出できる変化はなく、広告の推定値は負だが不正確だった。検索の関心は下がり、購買の反応は接戦の郡と共和党寄りの郡に集中した（抄録）。", "p6": "参入先の選ばれ方が需要の変化と無関係かどうかの識別の仮定、効果の持続期間は抄録に記載がない。著者の述べる限界は本文を読めておらず未確認。", "fun": "店で「環境にやさしい」と書かれた商品を選ぶかどうかは、個人の好みの問題に見える。ところがこの研究は、地元のテレビ局の持ち主が変わってニュースの傾向が変わると、そうした商品の売れ行きの伸びが鈍ることを見つけた。値段にも品ぞろえにも検出できる変化はなかったのに、である。買い物かごの中身が、地域のニュースの環境に左右されるという結果が面白い。", "unverified": "SSRNの本文を取得できず、対照の郡の選び方、推定モデル、頑健性の確認の内容は未確認。"}}, {"id": "pn08", "rank": 8, "field": "機械学習", "headline": "エージェントの読み過ぎを抑えトークンを最大93%削減", "title": "Read Less, Solve More: Token-Efficient Sparse Reading of External Content for AI Agents", "url": "https://arxiv.org/abs/2608.22237", "authors": "Zedong Liu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-12", "apa": "Liu, Z., Wu, J., Ma, X., Xu, L., Wang, K., Hu, Y., Tao, D., & Tan, G. (2026). Read Less, Solve More: Token-Efficient Sparse Reading of External Content for AI Agents (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2608.22237", "why": "ウェブを使うAIエージェントは、必要な証拠がわずかでもページや文書の全体を読み込み、トークンと時間を浪費する。エージェントのモデルを変えずに読み込みを制御する層SparseReadを提案した。読む意図と情報源の網羅状況を追跡し、証拠の探し方を切り替え、1回の作業で読む量に上限を設ける。6モデル・5場面で総トークンを最大92.9%、所要時間を最大89.0%減らし、97%の設定で課題の質を保つか改善したと報告する。", "explain": {"basis": "本文", "basis_note": "arXivのHTML版の本文のうち、要旨、設計の概要と関門（§4、§4.3）、評価の設定と結果（§6.1〜6.5）、結論（§8）を読んだ。§2〜3の詳細、実装、付録は未読", "preprint": true, "p1": "AIエージェントが外部の文書やウェブページを読むとき、必要な証拠だけをまばらに読ませる制御層SparseReadを、エージェントのモデルを変えずに挟み込み、トークンと時間を大きく減らした（要旨、§4、§8）。未査読のプレプリント。", "p2": "エージェントは、必要な証拠がわずかでも対象の全体を読み込みがちで、トークンと遅延の費用が増え、関連する証拠が薄まる。検索や圧縮だけでは、作業の途中で変わっていく情報の必要と、どこまで読めば足りるかが読む前には分からないという問題に対処しきれない（要旨、§3の見出し）。", "p3": "読む意図と情報源の網羅状況を記録する規約（Read Intent Protocol）、証拠の探し方を切り替える読み取り器、見せる量に上限を置く関門（Budgeted Read Gate）の3つからなる。関門は、まばらな読みで見せた量が全文の長さLを超えそうなら全文に切り替える。これにより、1回の読み取りの単位で見せる総量は最大でも2Lに収まる（§4.3、命題4.1）。", "p4": "長文の読解、複数ファイルの監査と診断、構造化データの分析、ウェブの深い検索、科学計算のスクリプト生成の5場面を6モデルで試し（計30設定）、トークン数、所要時間、課題の得点を、通常の読み方や検索・文脈削減の基準手法と比べた（§6.1〜6.3）。", "p5": "トークンは15.7〜92.9%（中央値61.4%）、所要時間は23.0〜89.0%（中央値53.7%）減り、得点は30設定中29で維持か改善だった。ウェブの深い検索では6モデルすべてで得点が5〜14ポイント上がり、トークンは31.0〜43.0%減った（§6.2）。切除実験では、意図の規約が同じ箇所の読み直しを1課題あたり4.8回から1.5回に減らした（§6.5）。", "p6": "上限の保証は、見せた文字数についてのもので、再送を含む課金トークンや遅延、課題の成績を保証するものではないと著者は断っている（§4.3）。1つの設定では得点が下がった（§6.2）。著者の述べる限界の節は読んだ範囲に見当たらず、付録は未読。", "fun": "調べものをするとき、人は本を最初から最後まで読まない。目次を見て、必要なページだけ開く。ところがAIエージェントは、渡された資料を丸ごと読み込むことが多く、そのぶん時間も費用もかかる。この研究は、AIと資料の間に仲立ちの層を置き、今何を知りたいのかに合わせて必要な箇所だけ渡すようにした。足りなければ全文を渡すので、最悪でも全文の2倍までしか見せない、という歯止めも付けた。", "unverified": "モデルの一覧、基準手法の設定、付録の内容は読んでおらず未確認。"}}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "生成AIで大都市への求人集中がゆるむ", "title": "Generative AI and the Spatial Restructuring of Corporate White-Collar Hiring: Evidence from China", "url": "https://doi.org/10.2139/ssrn.7685658", "authors": "Jingyi Tian ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Tian, J., Zhao, Y., Zhang, S., & Wang, X. (2026). Generative AI and the Spatial Restructuring of Corporate White-Collar Hiring: Evidence from China. https://doi.org/10.2139/ssrn.7685658", "why": "中国A株上場企業の2017〜2024年のオンライン求人を使い、ChatGPTの公開を技術ショックとして、事前の生成AIへの露出度で企業を分ける差の差分析を行った。露出度の高い企業は、一線都市への求人の割合を2.8ポイント減らした。減少は一線都市の賃金プレミアムや税負担が大きい企業で大きく、本社が一線都市にある企業や顧客対応の従業員が多い企業で小さい。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "生成AIが、企業のホワイトカラー採用を最上位の大都市から他の地域へ移す方向に働くことを、中国の上場企業の求人データで示した（抄録）。未査読のプレプリント。", "p2": "生成AIが企業の採用の空間的な配分、つまり「どこで」人を採るかにどう影響するかは明らかでなかった（抄録）。", "p3": "中国のA株上場企業の2017〜2024年のオンライン求人を使う。ChatGPTの公開を技術ショックとみなし、公開前の時点で生成AIの影響を受けやすい度合い（露出度）が高い企業と低い企業を比べる差の差分析を行う（抄録）。", "p4": "主な指標は、求人のうち一線都市（中国の最上位の大都市）に出された割合である。幅広い頑健性の検定のほか、一線都市の賃金プレミアムと税負担、本社の所在地、顧客対応の従業員の多さ、技術力、共通株主の有無で効果がどう変わるかを調べた（抄録）。", "p5": "露出度の高い企業は、低い企業に比べて一線都市への求人の割合を2.8ポイント減らした。減少は、一線都市の賃金プレミアムや税負担が大きい企業で大きく、本社が一線都市にある企業や、そこで顧客対応の従業員を多く雇う企業で小さかった。技術力の高さと共通株主の多さも減少を和らげた（抄録）。", "p6": "求人の掲載は実際の採用や雇用そのものではない（解釈）。露出度の測り方と、ChatGPTの公開と同じ時期の他の変化との切り分けは抄録に記載がなく、本文を読めていないため未確認。", "fun": "会社が大都市に人を集めるのは、集積の利益があるからだ。その代わり、賃金も税の負担も高くつく。生成AIが仕事を助けてくれるなら、費用の高い大都市で人を雇う理由は薄れるかもしれない。この研究は、AIの影響を受けやすい会社ほど、大都市での求人の割合を減らしたことを示した。AIが仕事の中身だけでなく、働く場所の地図も書き換える可能性がある。", "unverified": "SSRNの本文を取得できず、露出度の定義、求人データの規模、頑健性の検定の内容は未確認。"}}, {"id": "pn10", "rank": 10, "field": "経済学", "headline": "判定の紛争を経験した予測市場の参加者は取引を変える", "title": "When Resolution Is Disputed: Trader Adaptation in Prediction Markets", "url": "https://doi.org/10.2139/ssrn.7685178", "authors": "Xiaohui Zhang ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Zhang, X., Sun, K., Xu, Z., & He, S. (2026). When Resolution Is Disputed: Trader Adaptation in Prediction Markets. https://doi.org/10.2139/ssrn.7685178", "why": "予測市場は、起きた出来事を契約の支払いに変える判定の手続きに依存する。Polymarketで判定に紛争が起きた出来事と起きなかった出来事の814組を対応させ、積み上げ型の差の差分析を行った。紛争を経験した参加者は週次の取引がやや減り、その後の購入の実現収益率が1.43ポイント上がった。決済リスクの高い市場での購入を減らし、遅く買い、終了前に売ることが増えた。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "予測市場で、結果の判定をめぐる紛争を経験した参加者が、その後の取引の量・時期・市場の選び方をどう変えるかを、Polymarketのデータで明らかにした（抄録）。未査読のプレプリント。", "p2": "予測市場は、観察された出来事を契約の支払いに変える判定の手続きに依存している。この手続きをめぐる紛争の経験が、参加者のその後の取引にどう影響するかは分かっていなかった（抄録）。", "p3": "紛争のあった出来事となかった出来事を対応させた814組を作り、積み上げ型の差の差分析で、紛争を経験した参加者のその後の取引を比べる。取引活動、購入の実現収益率、市場の決済リスク、売買の時期と保有期間を指標とし、媒介分析で調整の内訳を調べる（抄録）。", "p4": "紛争の種類と参加者の特性による違いも調べた。さらに市場単位の分析で、紛争を経験した参加者の割合が高い市場で予測の誤差がどう違うかを確かめた（抄録）。", "p5": "週次の取引活動はやや減り、その後の購入の実現収益率は1.43ポイント上がった。参加者は決済リスクの高い市場での購入を減らして低い市場で増やし、遅く買い、終了前に売ることが増え、保有期間が短くなった。遅い参入は収益率と負に、終了前の売却と低リスク市場への移行は正に関連した。紛争経験者の割合が高い市場では予測の誤差が大きかった（抄録）。", "p6": "対応させた比較であり、紛争を経験する参加者とそうでない参加者の観察されない違いが残る可能性がある（解釈）。1つの市場のデータにもとづく。著者の述べる限界は本文を読めておらず未確認。", "fun": "出来事の結果に賭ける予測市場では、最後に「結果はこうだった」と判定する手続きが要る。その判定がもめた経験をした人は、どう変わるだろうか。取引をやめるのではなく、決済でもめにくい市場を選び、遅めに買って、終了前に売るようになった。その後の成績はむしろ上がっていた。一方で、そうした経験者の割合が高い市場ほど、予測の誤差は大きくなっていた。", "unverified": "SSRNの本文を取得できず、標本の期間、紛争の種類の分類、効果の統計的な精度は未確認。"}}, {"id": "pn11", "rank": 11, "field": "機械学習", "headline": "AIエージェントは禁止サイトでもスクレイピングする", "title": "ScrapeBench: Evaluating Legal Compliance of AI Agents in Website Scraping", "url": "https://arxiv.org/abs/2611.11306", "authors": "Joseph Marvin Imperial ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-12", "apa": "Imperial, J. M., Slate, D., & Kolt, N. (2026). ScrapeBench: Evaluating Legal Compliance of AI Agents in Website Scraping (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2611.11306", "why": "AIエージェントが利用規約やrobots.txtのスクレイピング方針を守るかを測る初のベンチマーク。スクレイピングを明示的に禁じる1,626の人気サイトで、広く使われるエージェントの多くは順守率が5%未満で、規約を確認した場合でも低いままだった。禁止していない269サイトでは、合法でも拒否する例があり、あるモデルの過剰拒否率は98.5%だった。人間180人の基準実験では、順守率は同程度で過剰拒否ははるかに多かった。", "explain": {"basis": "本文", "basis_note": "arXivのHTML版の本文のうち、要旨、課題の定式化（§3.1）、順守と過剰拒否の結果（§4）、違反の理由（結果8）、人の基準実験（§6）、考察と結論（§7、§8）を読んだ。§2、§5の一部、付録は未読", "preprint": true, "p1": "AIエージェントがウェブサイトのスクレイピング（自動収集）の方針を守るかを測る、エージェント型のベンチマークScrapeBenchを作り、標準的な指示のもとでは多くのエージェントが禁止サイトでも収集してしまうことを示した（要旨、§8）。未査読のプレプリント。", "p2": "ウェブ上で動くAIエージェントは、契約上の条項に反したり、計算機セキュリティの法律に触れたりしうる行為を実行できるようになってきた。しかし、利用規約やrobots.txtへの順守を実証的に測る基準がなかった（要旨）。", "p3": "利用規約とrobots.txtから、収集を明示的に禁じるサイト（1,626件）と禁じていないサイト（269件）にラベルを付ける。エージェントには収集の課題と、URLを取得する道具を最大5回まで使う権限を与え、内容のページを取得したら「収集した」と数える。禁止サイトでの順守率と、禁止していないサイトでの過剰な拒否の率を測る（§3.1、§4）。", "p4": "6つのエージェントを、中立の指示から、規約へのリンク、規約の本文の貼り付け、強い法的警告、規約を無視せよという敵対的な指示まで、8つの指示条件で比べた。人の参加者180人による基準実験も行った（§4、§6）。", "p5": "中立の指示では6つ中5つのエージェントの順守率がほぼ0だった。規約とrobots.txtの本文を指示に貼り付けると3つが70%を超え、強い法的警告で最大85.9%になった（§4.1）。違反の理由の約70%は、robots.txtだけを読んで制限なしと判断し、利用規約を顧みなかったものだった（結果8）。人は中立の指示で順守率48.9%、過剰な拒否38.9%だった（§6）。", "p6": "著者は、規約を読みに行っても順守が上がるとは限らないこと、指示に貼られた規約を確かめずに信じるため偽の規約による攻撃の余地があること、敵対的な指示に弱いことを失敗の型として挙げる。敵対的な指示のもとで順守率が高かった1つのエージェントは、一律に拒否していた（§4.1、§7）。ラベル付けの誤りの影響は読んだ範囲では未確認。", "fun": "サイトによっては「自動でデータを集めないでください」という決まりが、利用規約に書いてある。AIに「このサイトのデータを集めて」と頼むと、その決まりを守るだろうか。試すと、ほとんどのAIは集めてしまった。規約の文章を指示に貼って見せると、ようやく守るものが増える。面白いのは、違反の多くが、決まりを無視したのではなく、一方の文書だけを読んで「禁止されていない」と判断した読み違いだった点である。", "unverified": "サイトの収集とラベル付けの手順、道具の使い方の分析の一部、付録は読んでおらず未確認。"}}, {"id": "pn12", "rank": 12, "field": "機械学習", "headline": "言語モデルが推論だけで脳波・心電図モデルの重みを書く", "title": "Mixed Signals: Weight-Space Programming for EEG and ECG", "url": "https://arxiv.org/abs/2611.13758", "authors": "Dara Varam ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-12", "apa": "Varam, D., Najafi, T. A., & Atienza, D. (2026). Mixed Signals: Weight-Space Programming for EEG and ECG (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13758", "why": "言語モデルが学習済みネットワークの重みを読んで編集する「重み空間プログラミング」を、脳波・心電図のモデルに適用した。先端モデルは、仕込まれた不具合を内容を知らされずに直せるだけでなく、構造・課題・少数の訓練被験者だけからネットワークの全重みを書き下ろせた。ある実験では、勾配降下を一度も使わず、6分の1の訓練被験者数で通常の学習と同等の性能に達したと報告する。", "explain": {"basis": "本文", "basis_note": "arXivのHTML版の本文のうち、要旨、実験5の設定（§II-E）と結果（§III-E）、費用、限界（§IV）、結論（§V）を読んだ。実験1〜4の結果の節は未読", "preprint": true, "p1": "言語モデルが、学習済みの小さなニューラルネットの重みを読んで直したり、重みを一から書き下ろしたりする「重み空間プログラミング」を、脳波（EEG）と心電図（ECG）のモデルで試し、できることとできないことを切り分けた（要旨、結論）。未査読のプレプリント。", "p2": "重み空間プログラミングは、勾配降下ではなく推論によってネットワークを「学習」させる道を開く。これまではゲーム用のネットワークや言語モデルの特定の不具合の修正などで示されてきたが、生体信号のモデルに使えるかは分かっていなかった（要旨）。", "p3": "5つの実験を行う。ネットワークを読む、健全なネットワークを改善する、既知の不具合を直す、未知のデータでの失敗の原因を探す、そして全2,730個の重みが0の小さなネットワーク（TinyEEGNet）に、各層の式、64電極の位置、練習用の被験者5人の記録などを与えて全重みを書かせる（実験の設定の節）。", "p4": "書かれたネットワークを、未知の被験者65人での均衡正解率で評価し、同じネットワークを勾配降下で1〜30人の被験者から学習した場合や、同じ練習用の5人に当てはめた古典的な手作りの手法と比べた（実験5の結果、図7）。", "p5": "目の開閉の課題で、Opusが書いたネットワークの均衡正解率は0.834で、30人で学習した場合（0.806）と同等、5人（0.704）や10人（0.740）で学習した場合を上回った。握りこぶしの左右の課題では0.769だった。一方、重みだけから既存のネットワークの目的を推測することは苦手で、すでによく学習されたネットワークは改善できなかった（実験5の結果、結論）。", "p6": "著者は、一部の実験がモデルと設定ごとに1回の実行であること、文章の回答の採点を1つのLLMが行っていること、使ったデータが公開済みで言語モデルの学習データに含まれている可能性が高いこと、手作りの基準を後から追加したことを限界に挙げる（限界の節）。書くのに38〜39分かかり、勾配降下の数秒より遅い（費用の節）。", "fun": "AIの「学習」とは、ふつうデータを見せて数値を少しずつ調整していく作業である。この研究は、言語モデルに、小さなネットワークの数値を直接書き込ませた。目を閉じると頭の後ろでアルファ波が強まる、といった知識を組み込んだ設計になっていた。勾配降下による調整を一度もしていないのに、30人分のデータで学習したのと同じくらい当たった。データから調整するのではなく、知識から設計するという別の道を示している。", "unverified": "実験1〜4の詳細な結果と心電図の結果は読んでおらず未確認。"}}, {"id": "pn13", "rank": 13, "field": "経済学", "headline": "中国国有企業の買い手独占力は雇用目標の費用が相殺", "title": "From State to Market: Monopsony, Employment Goals, and Non-Neutral Productivity in Chinese Manufacturing", "url": "https://doi.org/10.2139/ssrn.7683498", "authors": "Ziyao Wang", "venue": "SSRN", "date": "2026-11-12", "apa": "Wang, Z. (2026). From State to Market: Monopsony, Employment Goals, and Non-Neutral Productivity in Chinese Manufacturing. https://doi.org/10.2139/ssrn.7683498", "why": "中国製造業について、労働のくさび（賃金と限界生産物のずれ）と非中立的な生産性を同時に推定し、所有形態の移行の効果を調べた。くさびを、買い手独占力から雇用目標が公的所有者に課す失業の政治的費用を引いたものとしてモデル化する。国有企業は県内の雇用シェアが大きく独占力は強いが、政治的費用がほぼ打ち消す。民営化は労働増大的な生産性とくさびを高め、それぞれが労働分配率の低下の約半分を説明する。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "中国の製造業で、国有企業と民営企業の「労働のくさび」と、労働を増やす型の生産性を同時に推定し、民営化が労働分配率を下げた経路を分解した（抄録）。未査読のプレプリント。背景：労働のくさびは、賃金と労働の限界生産物のずれを指す。", "p2": "国有企業の雇用の多さと労働分配率の高さが、労働市場での買い手独占力の違いによるのか、雇用目標という政治的な要因によるのか、生産性の型の違いによるのかを、同時に推定して切り分ける必要があった（抄録の記述にもとづく解釈）。", "p3": "くさびを、買い手独占力から、雇用目標が公的な所有者に課す失業の政治的費用を引いたものとしてモデル化する。あわせて非中立的な生産性を推定し、所有形態の移行がそれぞれに与える効果を調べる（抄録）。", "p4": "同じ県内の雇用シェアと規模で比べた場合の国有企業と民営企業のくさびの差、平均での差、民営化に伴う変化を評価する。データの期間と規模、推定の方法は抄録に記載がない（抄録）。", "p5": "同じ県内シェアと規模では、国有企業のくさびは民営企業より小さい。平均では、国有企業は県内シェアと雇用が大きいぶん買い手独占力が強いが、政治的費用がほぼ打ち消し、2つのくさびは近い。国有企業の高い労働分配率と雇用は、労働増大的な生産性の低さと政治的費用を反映する。民営化は労働増大的な生産性とくさびの両方を高め、それぞれが労働分配率の低下の約半分を説明する（抄録）。", "p6": "構造モデルの仮定に結果がどこまで依存するか、民営化される企業の選ばれ方の扱いは抄録に記載がない。著者の述べる限界は本文を読めておらず未確認。", "fun": "国が持つ会社は、もうけだけでなく「失業者を出さない」という目標も背負っている。そのぶん雇用が多く、給料の取り分も大きくなる。民営化すると人件費の割合が下がるが、それは会社が労働市場で強い立場を使うようになったからか、生産性の型が変わったからか。この研究は、その二つがおよそ半分ずつだと見積もった。一つの数字の変化を、二つの原因に切り分けた点が面白い。", "unverified": "SSRNの本文を取得できず、データ、推定手法、数値の大きさは未確認。"}}, {"id": "pn14", "rank": 14, "field": "経済学", "headline": "AIブームは短期に金利を下げ中期に押し上げる", "title": "The impact of AI on interest rates and inflation", "url": "https://doi.org/10.2139/ssrn.7686100", "authors": "Valerio Nispi Landi", "venue": "SSRN", "date": "2026-11-12", "apa": "Nispi Landi, V. (2026). The impact of AI on interest rates and inflation. https://doi.org/10.2139/ssrn.7686100", "why": "仕事を労働か計算資源が担うタスク型の構造を入れたニューケインジアンモデルで、AIブームが金利とインフレに与える影響を調べた。AIの生産性が徐々に上がるという予想は消費の伸びの期待と自然利子率を高め、中期にはインフレ圧力になる。一方、短期には計算能力への投資が資源を吸収して消費を下げ、調整が十分ゆるやかなら自然利子率が下がりインフレ率が目標を下回る。", "explain": {"basis": "抄録", "basis_note": "SSRNの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": true, "p1": "AIブームが金利とインフレに与える影響は、短期と中期で向きが逆になりうることを、仕事を労働と計算資源に割り振るタスク型のニューケインジアンモデルで示した（抄録）。未査読のプレプリント。", "p2": "AIブームが金利とインフレをどちらの向きに動かすのかを、金融政策の標準的な枠組みの中で整理する必要があった（抄録の問いにもとづく）。", "p3": "生産を、労働か計算資源（compute）のどちらかが担うタスクの連続体として表し、ニューケインジアンモデルに組み込む。AIの生産性が徐々に、しかも予想されて上がる場合の、消費、自然利子率、インフレの反応を調べる（抄録）。背景：自然利子率は、景気を過熱も冷やしもしない金利の水準。", "p4": "評価は理論モデルの中での反応の向きと時間的な順序による。計算能力への投資の調整費用によって、短期の反応がどう変わるかを見る。数値の較正や実データとの比較は抄録に記載がない（抄録）。", "p5": "第1の力は常に働く。AIの生産性の上昇が予想されると、消費の伸びの期待と自然利子率が上がり、標準的な政策ルールのもとでインフレ圧力になる。中期にはこれが支配する。第2の力は短期だけ働く。計算能力の積み増しが資源を吸収して消費を押し下げ、調整費用のためにその低下が十分ゆるやかだと、消費の伸びの期待が負になって自然利子率が下がり、インフレ率が目標を下回る。投資が後退すると第1の力が勝つ（抄録）。", "p6": "結論はモデルの構造と政策ルールの仮定に依存する。定量的な大きさは抄録に記載がない。著者の述べる限界は本文を読めておらず未確認。", "fun": "AIで将来もっと豊かになると予想されると、消費の伸びの期待が高まり、金利も物価も上がりやすくなる。ところがその前に、会社はAIを動かす計算能力をそろえるために多くの資源をつぎ込む。その間は消費に回る分が減り、かえって金利も物価も下がるかもしれない。同じAIブームが、時期によって逆向きに効くという筋書きである。今どちらの局面にいるかの見きわめが難しい問題になる。", "unverified": "SSRNの本文を取得できず、モデルの式、較正、反応の大きさは未確認。"}}, {"id": "pn15", "rank": 15, "field": "工学", "headline": "橋桁の縁の形状変更は組み合わせて初めて効く", "title": "Non-additive pressure-load response to edge shaping and cavity closure on an idealised twin-girder bridge deck", "url": "https://doi.org/10.21203/rs.3.rs-11699516/v1", "authors": "Mingjin Lou ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Lou, M., Zhang, Y., & Tao, Z. (2026). Non-additive pressure-load response to edge shaping and cavity closure on an idealised twin-girder bridge deck. https://doi.org/10.21203/rs.3.rs-11699516/v1", "why": "鈍い断面の橋桁にかかる風荷重を、縁の整形と桁間の空洞をふさぐ形状変更でどれだけ減らせるかを、理想化した2主桁断面の2次元非定常RANS解析（k–ω SSTモデル）で調べた。2×2の要因配置で主効果と交互作用を分けている。流線形にした断面の抗力は元の断面より54%小さい。傾斜した縁を持つ閉じた断面では、片方の縁だけを曲面にしても抗力は約5%しか減らないが、両方で53%減り、その81%が交互作用による。", "explain": {"basis": "本文", "basis_note": "Research SquareのPDFの本文のうち、抄録、要因配置の説明（§2.2の冒頭）、ベンチマークの範囲（§3.2.4の冒頭）、適用範囲と限界（§5.3）、結論（§6）を読んだ。手法・検証・結果の節の詳細は未読", "preprint": true, "p1": "鈍い断面の2主桁橋の桁に、縁の整形や桁間の空洞の閉鎖といった形状変更を加えたとき、風荷重の低減がどの面の圧力からどれだけ生じるか、そして変更どうしの効果が足し算にならないことを、要因配置の数値流体解析で示した（抄録、§6）。未査読のプレプリント。", "p2": "形状の変更は鈍い橋桁の風荷重を減らせるが、局所の変更が離れた面の剥離と圧力の回復を変えるため、組み合わせた効果は個々の効果の和と異なりうる（抄録）。", "p3": "理想化した2主桁の桁断面について、桁高にもとづくレイノルズ数1.6×10⁷で、k–ω SSTモデルによる2次元の非定常RANS解析を行う。裸の桁から完全に流線形にした閉断面までの5断面に7つの変種を加え、縁の形（傾斜板か曲面フェアリングか）と空洞の状態（開か閉か）を組み合わせた2つの2×2要因配置を作る。表面圧力を領域ごとに積分して、荷重の変化を面別に分けた（§2.2、§6）。", "p4": "格子・時間刻み・統計の寄与を合わせた数値的な許容幅を係数に添えた。グレートベルト・イースト橋の2つの桁と長方形柱（BARC）のベンチマークで設定を点検した。評価の指標は抗力・揚力・モーメントの係数とストローハル数である（§6）。", "p5": "完全に流線形にすると裸の桁の抗力は54%減り、ストローハル数は0.138から0.214に上がった。傾斜した縁を持つ閉断面を基準にすると、片方の縁だけを曲面にしても抗力は約5%しか減らないが、両方で約53%減り、その約81%が非加法的な部分による。前縁だけを曲面にすると前縁側の圧力抗力の寄与は0.679から0.197に減るが、後縁側が0.573から0.986に増えて大部分を打ち消す（§6の結論1、結論3）。", "p6": "著者は、2次元の解析でスパン方向の非相関や3次元の流れを含まないこと、数値的な許容幅に乱流モデルの誤差が入っていないこと、アプローチ径間の桁のベンチマークで食い違いがあること、比較的桁高の大きい断面と1つの丸め半径だけを調べたこと、固定した断面の空気力に限られることを挙げ、同じ条件での試験による確認が必要だとする（§5.3）。", "fun": "角ばった橋桁は、風を強く受ける。角を丸めれば風の抵抗は減るはずだ。ところが、風上側の角だけ、あるいは風下側の角だけを丸めても、抵抗は5%ほどしか減らなかった。両方を丸めると、半分ほどになる。片方だけ丸めても、もう片方の側で損をして打ち消されるからだ。部分ごとの効果を足しても全体の効果にならない、という形どうしの組み合わせの効果を数字で示した研究である。", "unverified": "手法の詳細、検証とベンチマークの数値、結果の節の図表は読んでおらず未確認。風洞試験による直接の確認は行われていない。"}}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "公職者の資産公開で地方債の利回りが下がる", "title": "Sunlight at City Hall: The Effect of Officials' Financial Disclosure on Municipal Bond Markets", "url": "https://doi.org/10.2139/ssrn.7683023", "authors": "Bo Jing ほか", "venue": "SSRN", "date": "2026-11-12", "apa": "Jing, B., Su, Z., & Tian, X. (2026). Sunlight at City Hall: The Effect of Officials’ Financial Disclosure on Municipal Bond Markets. https://doi.org/10.2139/ssrn.7683023", "why": "米国で公職者の個人資産の開示がオンライン化された時期の違いを使い、開示の導入後に地方債の利回りが8〜16ベーシスポイント下がることを示した。財政規律の強化、交渉方式の引受での条件改善、流通市場の情報摩擦の低下と整合的だと報告する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（SSRN。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "公職者の個人資産の開示をオンラインで誰でも見られるようにすると、その自治体が発行する地方債の利回りが下がることを示した（抄録）。", "p3": "米国の各地で公職者の個人資産開示（PFD）のオンライン化が導入された時期の違いを利用し、導入の前後で地方債の利回りを比べた。経済状況、発行の構成の変化、同時期の政策変更では説明しにくいことを確かめた（抄録）。", "p5": "導入後に地方債の利回りは8〜16ベーシスポイント下がった。財政規律の強化、交渉方式の引受での条件の改善、流通市場での情報の摩擦の低下と整合的だと報告する（抄録）。背景：ベーシスポイントは金利の単位で、百分の一パーセント。", "fun": "市長や議員がどんな株や土地を持っているかが分かるようになると、なぜ町の借金の金利が下がるのだろうか。お金を貸す側から見れば、私腹を肥やす決定がしにくくなり、町の財政がきちんと運営されると期待できるからだ。政治家の財布を透明にすることが、巡り巡って住民の負担する利息を減らす。透明性の値打ちを金利で測った点が面白い。", "unverified": "本文を読めていないため、標本の規模、推定手法の詳細、導入した地域の数は未確認。"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "相反する物語が多いと情報が価格に織り込まれにくい", "title": "Narrative Cacophony in Financial Markets", "url": "https://doi.org/10.2139/ssrn.7687378", "authors": "Alyssa Rusonik", "venue": "SSRN", "date": "2026-11-11", "apa": "Rusonik, A. (2026). Narrative Cacophony in Financial Markets. https://doi.org/10.2139/ssrn.7687378", "why": "非構造のテキストから物語（解釈の型）を抽出する方法を作り、価格への含意が食い違う物語が多く並ぶ状態を「物語の不協和」と定義した。2025年の関税をめぐる出来事の報道21,771本に適用し、不協和が大きいと取引量が減り、物語が日次収益率の変動を説明する割合が下がり、情報の織り込みが遅れることを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（SSRN。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "ニュースの文章から「物語」（出来事の解釈の型）を抽出する方法を作り、値動きへの含意が食い違う物語が多く並ぶ状態（物語の不協和）が、情報の価格への織り込みを妨げることを示した（抄録）。", "p3": "非構造のテキストから物語を内生的に取り出す方法を開発し、2025年の関税をめぐる「解放の日」の出来事に関する報道21,771本に適用して、不協和と取引量、日次収益率の関係を調べた（抄録）。", "p5": "不協和は取引量を減らした。不協和で取引が減ると、物語が日次収益率の変動を説明する割合が小さくなり、物語の情報の織り込みが遅れて、後から価格に反映される効果が見られた（抄録）。", "fun": "同じニュースでも「株が上がる話だ」と「下がる話だ」という解釈が入り乱れると、投資家は様子見になって売買が減る。市場は売買を通じて情報を値段に映すので、売買が減ると値段の反応も遅れる。情報が足りないのではなく、食い違う解釈が多いことが邪魔をするという見方が面白い。記事の山から解釈の型を取り出す方法を作り、それを数量で確かめた。", "unverified": "本文を読めていないため、物語の抽出手法の詳細、対象とした市場と銘柄、効果の大きさは未確認。"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "長期金利の差を使う新しいキャリー取引が年3.5%", "title": "Following the Stars: Long-Run Rates in the Carry Trade", "url": "https://doi.org/10.2139/ssrn.7684526", "authors": "Mohammed Mehdi Kaebi ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Kaebi, M. M., & Ferreira Batista Martins, I. (2026). Following the Stars: Long-Run Rates in the Carry Trade. https://doi.org/10.2139/ssrn.7684526", "why": "各国の長期の名目金利を、インフレと成長から見た10年債利回りの適正値としてリアルタイムに推定し、その差で通貨を並べた戦略を作った。年3.52%の収益で、従来のキャリー取引よりシャープ比が高く、有意なアルファを持つ。収益の3分の2は長期金利の変化に合わせた持ち高の更新から生じ、プレミアムは長期金利のうちインフレ部分に由来すると報告する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（SSRN。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "各国の長期金利の差にもとづいて通貨を選ぶ新しい戦略（carry*）を作り、従来のキャリー取引を超えるリスクプレミアムがあることを示した（抄録）。", "p3": "フィッシャー方程式を手がかりに、各国の長期の名目金利を、インフレと成長から見た10年債利回りの適正値としてリアルタイムに推定し、その差で通貨を並べて売買する（抄録）。背景：キャリー取引は低金利の通貨で借りて高金利の通貨で運用する取引。", "p5": "carry*は年3.52%の収益で、従来型と静的なキャリーよりシャープ比が高く、有意なアルファを持つ。収益の3分の2は長期金利の変化に合わせた持ち高の更新から生じ、プレミアムは長期金利のインフレ部分に由来し、実質部分には値がつかない（抄録）。", "fun": "金利の低い国でお金を借りて高い国で運用すれば、差の分だけもうかりそうに見える。この研究は「今の金利」ではなく「その国の金利が長い目で落ち着く水準」の差に注目すると、従来の取引とは別のもうけが残ることを示した。しかもそのもうけは、長期金利のうち物価の上がり方に対応する部分から来ていた。金利を中身に分けて、どの部分に値がつくかを調べた点が面白い。", "unverified": "本文を読めていないため、対象の通貨と期間、取引費用の扱い、リスク要因の推定の詳細は未確認。"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "遺族が受け取れない恐れが保証つき年金の需要を消す", "title": "Beneficiary Settlement Risk and the Annuity Puzzle in a Life-Cycle Model", "url": "https://doi.org/10.2139/ssrn.7682389", "authors": "Ernest Aboagye ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Aboagye, E., & Anyomi, S. K. (2026). Beneficiary Settlement Risk and the Annuity Puzzle in a Life-Cycle Model. https://doi.org/10.2139/ssrn.7682389", "why": "米国の終身年金の多くには、早く亡くなったとき残りを受取人に払う期間保証が付くが、遺族が契約を知らず受け取れないことがある。この受取人の決済リスクをライフサイクルモデルに入れ、受け取れる確率がある閾値を下回ると保証を買わないことを閉じた形で示した。確率を1から2分の1に下げると、保証つき年金への配分は資産の44%から2%に減るが、年金化の合計は最大9ポイントしか減らない。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（SSRN。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "保証期間つきの年金で、遺族が実際に残りを受け取れるかどうかの不確かさ（受取人の決済リスク）が、どの型の年金を買うかを大きく変えることを理論と数値計算で示した（抄録）。", "p3": "退職者が流動資産、終身のみの年金、保証期間つきの年金に資産を配分するライフサイクルモデルに、遺族が保証を受け取れる確率πを入れた。保険会社の支払い義務は変わらないので、保険料は確率に依存しない（抄録）。", "p5": "πがある閾値を下回ると保証を買わないことを閉じた形で導いた。米国の死亡率と市場の支払い比率に合わせた計算では、πを1から2分の1に下げると、遺贈の動機が中程度の退職者で保証つき年金の割合が資産の44%から2%に減り、年金化の合計の減少は最大9ポイントだった（抄録）。", "fun": "年金に「早く亡くなったら残りは家族に払います」という保証を付けても、家族がその契約の存在を知らなければ受け取れない。請求されないお金は、最後は州に納められる。この研究は、受け取れる確率が半分になるだけで、保証つきの年金がほとんど買われなくなることを計算で示した。保険会社の破綻とは違う、「契約が知られていない」という身近な危険に目を向けた点が面白い。", "unverified": "本文を読めていないため、モデルの効用関数とパラメータ、閾値の式の具体形は未確認。"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "GPUの賃料から計算資源の減価を見積もる", "title": "Watts and FLOPs: GPU Rents and the Economic Depreciation of AI Compute", "url": "https://doi.org/10.2139/ssrn.7683218", "authors": "Illia Kyslytskyi", "venue": "SSRN", "date": "2026-11-11", "apa": "Kyslytskyi, I. (2026). Watts and FLOPs: GPU Rents and the Economic Depreciation of AI Compute. https://doi.org/10.2139/ssrn.7683218", "why": "NvidiaのA100・H100・B200の日次の賃料指数を使い、世代による賃料の違いと減価・担保価値への含意を調べた。古い2機種の賃料は処理能力あたりより電力1キロワットあたりで見たほうが近く、通電できる容量が不足する間は電力に連動した下限があることと整合的だという。この型にもとづく評価モデルでは、基準の設定で1年後・3年後・6年後に価値の約72%・44%・21%が残る。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（SSRN。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "AI用の計算チップ（GPU）の日々の賃料から、チップの価値が年とともにどう減るかを見積もり、古い世代のチップの賃料は使う電力に連動して下支えされていることを示した（抄録）。", "p3": "NvidiaのA100・H100・B200の日次の賃料指数を使い、処理能力あたりと電力1キロワットあたりの賃料を世代間で比べ、この型にもとづく評価モデルで残存価値を計算した（抄録）。", "p5": "古い2機種の賃料は電力あたりで見るとほぼ等しく、通電できる容量が不足する間は電力に連動した下限があることと整合的だった。基準の設定では、1年後・3年後・6年後に価値の約72%・44%・21%が残る。6年の帳簿上の耐用年数に合うには、下限の低下が年約3.4%以下である必要がある（抄録）。", "fun": "新しいチップが出れば古いチップは時代遅れになり、借り賃は急に下がりそうに思える。ところが古いチップの借り賃は、使う電力あたりで見るとあまり下がっていなかった。いま足りないのが、チップそのものより「電気を通せる設備の容量」だからだという。計算機の値打ちが処理の速さだけでなく電力で決まる、という見方が面白い。", "unverified": "本文を読めていないため、賃料指数の出所と期間、評価モデルの仮定は未確認。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "家計は気候変動と脱炭素がインフレを高めると予想", "title": "Inflation Expectations in the Context of Climate Change and the Green Transition", "url": "https://doi.org/10.2139/ssrn.7691030", "authors": "Gabriele Galatia ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Galatia, G., Marotta, F., Moessner, R., & van Rooij, M. (2026). Inflation Expectations in the Context of Climate Change and the Green Transition. https://doi.org/10.2139/ssrn.7691030", "why": "オランダの家計の代表標本の調査で、気候変動、グリーン移行、気候政策が長期のインフレに与える影響の予想を尋ねた。家計は、気候変動・グリーン移行・3種の気候政策のいずれも今後10年のインフレ率と変動を高めると予想し、気候変動の影響が最も大きく、支援政策の影響が最も小さい。深刻な温暖化を見込む回答者ほど影響を大きく見積もる。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（SSRN。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "家計が、気候変動や脱炭素への移行、気候政策によって将来の物価がどうなると考えているかを、オランダの代表標本の調査で明らかにした（抄録）。", "p3": "オランダの家計の新しい代表標本の調査で、気候変動、グリーン移行、3種の気候政策（炭素の価格づけ、移行への支援、グリーン技術革新への支援）についての認識と、長期のインフレへの影響の予想を尋ねた（抄録）。", "p5": "家計は、これらのいずれも今後10年のインフレ率とその変動を高めると予想した。影響は気候変動が最も大きく、支援政策が最も小さいと見られていた。深刻な温暖化と極端な気象を見込む回答者ほど、気候変動によるインフレの影響を大きく予想した（抄録）。", "fun": "物価がこの先どうなるかという人々の予想は、経済を運営するうえで大事な手がかりになる。この調査では、多くの家庭が「気候変動そのもの」も「それに対処する政策」も、どちらも物価を上げると考えていた。ただし、炭素に値段を付ける政策より、移行や技術革新を支援する政策のほうが影響は小さいと見られていた。政策のやり方によって人々の物価の予想が変わる点が面白い。", "unverified": "本文を読めていないため、回答者数、調査時期、予想の大きさの数値は未確認。"}}, {"id": "pn22", "rank": 22, "field": "経営学", "headline": "高速鉄道が発着枠のない航空会社の間接参入を生む", "title": "Beyond Air-Rail Competition: HSR-Enabled Airline Entry, Strategic Deterrence, and Welfare Implications", "url": "https://doi.org/10.2139/ssrn.7686221", "authors": "Dian Sheng ほか", "venue": "SSRN", "date": "2026-11-12", "apa": "Sheng, D., & Guo, L. (2026). Beyond Air-Rail Competition: HSR-Enabled Airline Entry, Strategic Deterrence, and Welfare Implications. https://doi.org/10.2139/ssrn.7686221", "why": "混雑した主要空港の発着枠を持たない航空会社が、近くの二次空港に飛ばして高速鉄道でつなぐことで幹線市場に入る「高速鉄道を介した間接参入」を定義し、2社3都市の逐次ゲームで分析した。後ろ向き帰納法により、参入阻止・戦略的抑止・受容の3つの均衡の型を導き、既存企業が供給を増やして参入を抑える場合を示す。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（SSRN。候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": true, "short": true, "p1": "混雑空港の発着枠を持たない航空会社が、近くの二次空港へ飛ばして高速鉄道で乗り継がせることで幹線市場に入り込む「高速鉄道を介した間接参入」という競争の型を定義し、理論的に分析した（抄録）。", "p3": "2つの航空会社と3つの都市からなる逐次ゲームを作った。既存企業は発着枠に制約されながら直行便を、参入企業は二次空港と高速鉄道を組み合わせた、垂直的に差別化された乗り継ぎサービスを提供する。後ろ向き帰納法で解いた（抄録）。", "p5": "均衡は、参入阻止（独占の供給量ですでに参入を防げる）、戦略的抑止（既存企業が供給を増やす）、受容の3つの型に分かれた。厚生への含意は、抄録の末尾が切れており未確認（抄録）。", "fun": "混んだ空港の発着枠は、持っている会社にとって他社を締め出す壁になる。ところが近くの空いた空港と高速鉄道がつながると、枠を持たない会社も「飛行機と鉄道」の乗り継ぎで同じ市場に入れる。鉄道は飛行機の競争相手だと思われがちだが、航空会社どうしの競争を生む道具にもなる。交通の組み合わせが競争の形を変えるという視点が面白い。", "unverified": "抄録の末尾が切れており、戦略的抑止と受容の条件、厚生の結果は未確認。理論モデルの分析で、本文は読めていない。"}}, {"id": "pn23", "rank": 23, "field": "経営学", "headline": "認知能力が高いほど耐戦略的な学校選択で正直に申告", "title": "Cognitive Ability and Strategic Sophistication in School Choice Games", "url": "https://doi.org/10.2139/ssrn.7686024", "authors": "Valon Vitaku", "venue": "SSRN", "date": "2026-11-12", "apa": "Vitaku, V. (2026). Cognitive Ability and Strategic Sophistication in School Choice Games. https://doi.org/10.2139/ssrn.7686024", "why": "学校選択の3方式（受入保留、即時受入、トップ・トレーディング・サイクル）を、選好と優先順位が共有知識の実験で比べ、視線計測も使った。レーヴン検査の成績が高い参加者ほど、耐戦略的な方式で正直に申告し、操作可能な即時受入方式では正直に申告しない傾向があるという先行結果を確かめ、同じ型がもう一つの耐戦略的な方式にも見られることを示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（SSRN。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "学校選択の3つの代表的な方式について、認知能力の高い参加者ほど、正直に申告するのが得な方式では正直に、駆け引きが効く方式では正直でない申告をすることを、視線計測を使った実験で示した（抄録）。", "p3": "受入保留（DA）、即時受入（IA）、トップ・トレーディング・サイクル（TTC）を、選好と学校の優先順位が共有知識である設定で実験した。順位の申告と視線のデータで推論の深さを調べ、レーヴン漸進的マトリックス検査の成績と関係づけた（抄録）。", "p5": "操作可能なIAでは、推論の段階が深いほど焦点均衡の行動が減るというモデルの予測が支持された。検査の成績が高い参加者は、耐戦略的なDAとTTCで正直に申告しやすく、IAでは正直に申告しにくかった。成績の高い参加者はTTCで利得が高かった（抄録）。", "fun": "入学先を決める仕組みには、希望を正直に書くのが一番得になるように作られたものと、駆け引きした人が得をするものがある。実験すると、図形のパズルが得意な人ほど、前者では正直に書き、後者では駆け引きをした。駆け引きが効く仕組みは、考えるのが得意な人に有利に働く。正直に書けばよい仕組みが勧められる理由を、視線の動きまで測って確かめた。", "unverified": "本文を読めていないため、参加者数、利得の差の大きさ、視線計測の指標の詳細は未確認。"}}, {"id": "pn24", "rank": 24, "field": "経営学", "headline": "気候リスクにさらされる銀行ほど競争が弱まる", "title": "Climate Risk Exposure and Banking Competition: Evidence from China's Listed Banks", "url": "https://doi.org/10.2139/ssrn.7683634", "authors": "Miaomiao Tao ほか", "venue": "SSRN", "date": "2026-11-12", "apa": "Tao, M., Che, S., & Klein, T. (2026). Climate Risk Exposure and Banking Competition: Evidence from China’s Listed Banks. https://doi.org/10.2139/ssrn.7683634", "why": "中国の上場銀行42行・2007〜2022年のデータで、都市別の気候リスク指数を支店網の地理的分布に対応させた銀行別の気候リスク露出指数を作り、露出が大きいほど銀行間の競争が弱まることを示した。AIやフィンテックなどのデジタル技術は、リスク評価と業務効率の改善を通じてこの悪影響を和らげると報告する。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（SSRN。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "気候リスクに多くさらされている銀行ほど銀行間の競争が弱まることを、中国の上場銀行のデータで示した（抄録）。", "p3": "中国の上場銀行42行の2007〜2022年のデータを使い、都市別の気候リスク指数を各行の子会社の地理的分布に対応させて、銀行別の気候リスクの露出指数を作り、競争との関係を推定した（抄録）。", "p5": "気候リスクへの露出が大きいほど、銀行間の競争が有意に弱まった。AIやフィンテックなどのデジタル技術は、リスク評価と業務効率の向上を通じてこの悪影響を和らげた（抄録）。", "fun": "洪水や猛暑の危険が大きい地域に拠点が多い銀行には、何が起きるのだろうか。この研究によれば、気候の危険に多くさらされる銀行ほど、銀行どうしの競争が弱まる。競争が減ると、金融の不安定さが増し、お金を借りにくくなるおそれがある。気候の危険が、金融の競争という一見関係のないところに波及するという指摘が面白い。拠点の分布と気候の指数を重ねて測った。", "unverified": "本文を読めていないため、競争の指標の定義、因果の識別方法、効果の大きさは未確認。"}}, {"id": "pn25", "rank": 25, "field": "統計学", "headline": "転換社債の翌日価格予測でNNは酔歩に勝てない", "title": "Cross-Bond Panel Learning for Next-Day Price Forecasting of Chinese Convertible Bonds: A Reality Check", "url": "https://econpapers.repec.org/RePEc:arx:papers:2610.33453", "authors": "Derun Zhong ほか", "venue": "RePEc NEP", "date": "2026-11-02", "apa": "Zhong, D., Wang, G., Wang, S., & Feng, H. (2026). Cross-Bond Panel Learning for Next-Day Price Forecasting of Chinese Convertible Bonds: A Reality Check (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33453", "why": "中国の転換社債100銘柄・2022〜2025年の日次73,806観測で、銘柄をまたいで学習するニューラルネットが、時間順の分割・境界の除去・依存を考慮した推測のもとでランダムウォークを上回るかを検証した。検証用の29,514観測でランダムウォークのRMSEは2.3577元、ニューラルネットの集合は2.3619元と2.3645元で、標本外の決定係数は負だった。銘柄をまとめる学習は個別推定より分散を下げるが、全体の予測の優位にはならない。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに掲載された抄録（候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": true, "short": true, "p1": "中国の転換社債の翌日の価格を、銘柄をまたいで学習するニューラルネットで予測しても、「今日の価格のまま」と置く単純な予測（ランダムウォーク）を上回れないことを厳密な手順で確かめた（抄録）。", "p3": "A株の転換社債100銘柄の日次パネル（2022〜2025年）で、時間順の厳密な分割、境界の除去、分割ごとの前処理、依存を考慮した推測のもとで、ニューラルネットとランダムウォークの標本外の誤差を比べた（抄録）。", "p5": "検証用データでランダムウォークのRMSEは2.3577元、ニューラルネットの集合は2.3619元と2.3645元で、標本外の決定係数は負だった。銘柄をまとめる学習は90銘柄中79銘柄で個別推定より誤差を下げたが、全体ではランダムウォークに対する優位にならなかった（抄録）。", "fun": "「明日の値段は今日と同じ」と予想するだけの方法は、何も考えていないように見える。ところが最新のニューラルネットを厳しい条件で試すと、この単純な予想に勝てなかった。未来のデータがうっかり学習に混ざるのを徹底的に防ぐと、見かけの成果が消えることがある。うまくいかなかった結果をきちんと報告することに価値がある、と教えてくれる研究である。", "unverified": "抄録の末尾が切れており、誤差の分解の結果は未確認。本文を読めていないため、モデルの構造と入力変数は未確認。"}}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "行政登録と調査を組み合わせ家賃を機械学習で推計", "title": "Estimating Housing Costs in Switzerland Using Public Registers and Survey Data: A Machine Learning Approach", "url": "https://econpapers.repec.org/RePEc:bss:wpaper:63", "authors": "Adrian Gadient ほか", "venue": "RePEc NEP", "date": "2026-11-02", "why": "スイスのアールガウ州で、構造調査（2019〜2022年）と人口・建物などの行政登録データを組み合わせ、月額の純家賃を推定するモデルを作った。ランダムフォレストの標本外の性能がエラスティックネットより良く（RMSE 315スイスフラン、決定係数0.55）、最も重要な予測変数は床面積だった。追加の調査をせずに住宅費を広域で推計できるとする。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに掲載された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "追加の調査をせずに、行政の登録データと既存の標本調査を組み合わせて、住宅の月額家賃を広い範囲で推計するモデルを作った（抄録）。", "p3": "スイスのアールガウ州で、構造調査（2019〜2022年）と、人口や建物などの登録データを組み合わせ、月額の純家賃を説明するランダムフォレストとエラスティックネット回帰を当てはめて、標本外の性能を比べた（抄録）。", "p5": "ランダムフォレストのほうが標本外の性能が良かった（RMSE 315スイスフラン、MAE 224スイスフラン、決定係数0.55）。最も重要な予測変数は床面積で、建築時期、部屋数が続いた。性能は地域と住宅の規模をまたいで安定していた（抄録）。", "fun": "家賃がどのくらいかを知るには、ふつうは一軒ずつ尋ねる調査が要る。しかし役所には、建物の広さや建てられた年、住んでいる人の記録がすでにある。この研究は、調査に答えた世帯の家賃を手本にして、登録データから家賃を機械に推定させた。新しく調べなくても、今あるデータを組み合わせれば住まいの負担を広い範囲で見積もれるという発想が実用的である。", "unverified": "本文を読めていないため、標本の規模、説明変数の一覧、推定値の不確実性の扱いは未確認。"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "標本設計を目的に合わせると変動率曲面の推定が改善", "title": "Compiling and forecasting implied volatility surfaces via survey sampling, tempered inverse-probability sequence learning, and causal activity clocks", "url": "https://econpapers.repec.org/RePEc:arx:papers:2610.33438", "authors": "Deepak Bastola ほか", "venue": "RePEc NEP", "date": "2026-11-02", "apa": "Bastola, D., & Prushansky, E. (2026). Compiling and forecasting implied volatility surfaces via survey sampling, tempered inverse-probability sequence learning, and causal activity clocks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.33438", "why": "NVIDIA株とオプションの2018〜2025年のパネルを使い、インプライド・ボラティリティ曲面の作成と予測に、有限母集団の標本抽出、逆確率の重みを使う系列学習、取引活動にもとづく時計を組み合わせた。横断面の曲面の精度は、標本設計を目的の量に合わせられるかで決まり、流動性で重み付けた抽出は目的が違うと誤差を増やすと報告する。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに掲載された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "高頻度の株とオプションのデータからインプライド・ボラティリティ（IV）曲面を作り予測する作業に、標本調査の抽出設計と取引活動にもとづく時計を持ち込み、何が効き何が効かないかを整理した（抄録）。", "p3": "株式分割を調整したNVIDIAの株とオプションのパネル（2018〜2025年）で、有限母集団の標本抽出、逆確率で重み付けた系列学習、出来高や売買代金で進む時計を組み合わせ、標本外で評価した（抄録）。", "p5": "横断面の曲面の精度は、抽出設計を目的の量に合わせられるかで決まり、流動性に比例した抽出は目的が違うと誤差を増やした。短期の価格はドリフトつきランダムウォークを超えて予測できず、系列モデルは線形の基準モデルに勝てなかった。出来高と売買代金の時計は日中収益率の尖度を抑えた（抄録）。", "fun": "世論調査では、誰に聞くかの決め方で結果の精度が変わる。同じ考え方を、膨大なオプション取引のデータから「どの契約を選んで計算に使うか」に当てはめたのがこの研究である。よく取引される契約ばかり選ぶと、知りたい量によってはかえって誤差が増える。凝った予測モデルより、目的に合ったデータの選び方が効くという結果が面白い。", "unverified": "本文を読めていないため、抽出設計の具体的な配分、誤差の数値、時計の定義の詳細は未確認。1銘柄のデータにもとづく。"}}, {"id": "pn28", "rank": 28, "field": "機械学習", "headline": "模擬ユーザーとの閉ループで視覚対話モデルを評価", "title": "Interactive Visual Gym: Evaluating Visual Interaction Models with Simulated Users in Interactive Worlds", "url": "https://arxiv.org/abs/2611.08286", "authors": "Chenhao Zheng ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-12", "apa": "Zheng, C., Ma, Z., Li, K., Ranasinghe, K., Zhang, J., Panagopoulou, A., Huang, W., Shangguan, J., Tan, Y., Savarese, S., Niebles, J. C., Krishna, R., Xu, R., & Zhou, H. (2026). Interactive Visual Gym: Evaluating Visual Interaction Models with Simulated Users in Interactive Worlds (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08286", "why": "作業中の利用者を支援する視覚対話モデルは、応答が利用者のその後の行動を変えるため、録画の再生では評価できない。料理・家事・モバイル画面の3つのシミュレータと、ペルソナを与えた利用者シミュレーション（実行の誤りや計画外の行動を含む）で閉ループの評価と学習を行う枠組みを作った。315場面のベンチマークで、最良のモデルでも制限時間内に完了できた課題は53.4%だった。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "作業中の人を視覚で見ながら手助けするAI（視覚対話モデル）を、応答が人の次の行動を変えるという閉ループの条件で評価・学習できる枠組みを作った（抄録）。", "p3": "料理、家事の操作、モバイル画面の3つのシミュレータと、ペルソナを与えた利用者の模擬（実行の誤りや計画外の行動を含む）を組み合わせ、315場面のベンチマークIVG-Benchとして具体化した。評価の手順は人を対象とした調査で確かめた（抄録）。", "p5": "最良のモデルでも制限時間内に完了できた課題は53.4%で、事実の裏づけと実行できる助言に弱点があり、応答の遅れを考えると誤りを防ぐには遅いことが多かった。対話の質の指標と参加者の好みの一致は78.5%だった。閉ループの学習で課題の成功と対話の質が改善した（抄録）。", "fun": "料理を教えるAIを試すとき、録画した動画を見せて答えさせるだけでは足りない。本当の場面では、AIの一言で人の次の動作が変わり、間違いが防げたり防げなかったりするからだ。この研究は、わざと失敗もする「模擬の人」を相手にAIを試した。最も良いAIでも半分ほどしか時間内に手伝いきれず、助言が遅すぎることも多かった。", "unverified": "本文を読めていないため、対話の質の指標の定義、模擬の利用者の作り方の詳細、他モデルの成績は未確認。"}}, {"id": "pn29", "rank": 29, "field": "機械学習", "headline": "リプシッツ制御で画像復元のフローマッチングを安定化", "title": "Lipschitz-Controlled Flow Matching for Robust Image Restoration", "url": "https://arxiv.org/abs/2611.13995", "authors": "Sedjro Salomon Hotegni ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-11", "apa": "Hotegni, S. S., Sonntag, K., Bürkner, P.-C., & Peitz, S. (2026). Lipschitz-Controlled Flow Matching for Robust Image Restoration (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13995", "why": "フローマッチングによる画像復元は高品質だが、学習した力学が入力の小さな乱れを増幅することがある。観測から積分を始める方式と観測で条件づける方式の安定性の上界を導き、スペクトル正規化などを組み込んだリプシッツ性を意識した変換器と、敵対的な感度の正則化で増幅を抑えた。顔画像の復元で、頑健性と知覚品質を測っている。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "フローマッチングによる画像復元で、入力のわずかな乱れが結果を大きく変えてしまう不安定さを、リプシッツ性（入力の変化に対する出力の変化の上限）を制御することで抑える方法LipsFlowerを提案した（抄録）。", "p3": "雑音を加えた観測から常微分方程式を始める方式と、積分の間ずっと観測で速度場を条件づける方式について安定性の上界を導いた。その分析にもとづき、スペクトル正規化などを組み込んだ変換器LipHDiTと、敵対的な感度の正則化を設計した（抄録）。", "p5": "顔画像のブラインド復元で、敵対的な頑健性と知覚品質を測った。乱れの増幅を減らしつつ、復元の品質は比較した基準手法と競える水準を保ったと報告する。数値は抄録に記載がない（抄録）。", "fun": "ぼやけた顔写真をきれいに直すAIは、元の写真にごく小さな雑音が混ざっただけで、大きく違う結果を描いてしまうことがある。坂道に置いたボールが、わずかな押し方の違いで別の谷に転がるのに似ている。この研究は、AIの中の「流れ」が急になりすぎないよう上限をかけ、入力が少し違っても出力が大きく変わらないようにした。きれいさと安定を両立させる工夫である。", "unverified": "本文を読めていないため、頑健性と品質の数値、比較した手法は未確認。"}}, {"id": "pn30", "rank": 30, "field": "機械学習", "headline": "LiDARと占有を一つの潜在空間で同時に予測", "title": "LO-World: Unified BEV Latent Modeling for Joint 4D Occupancy and LiDAR Forecasting", "url": "https://arxiv.org/abs/2611.11912", "authors": "Zhimin Liao ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-11", "apa": "Liao, Z., Wei, P., Mao, K., & Chen, S. (2026). LO-World: Unified BEV Latent Modeling for Joint 4D Occupancy and LiDAR Forecasting (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.11912", "why": "自動運転の世界モデルで別々に予測されてきたLiDAR点群と3次元の意味的占有を、鳥瞰図の共有潜在空間で同時に予測するLO-Worldを提案した。距離画像とボクセルの混成の自己符号化器と、過去の文脈をキャッシュするフローマッチング生成器を組み合わせ、占有予測のIoUを10.9%改善し、LiDARのチャンファー距離を30.1%減らし、1枚のGPUで毎秒25フレームを超える処理を保つと報告する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "自動運転の世界モデルで、LiDARの点群と3次元の意味的占有（どこに何があるか）の将来を、一つの共有された潜在空間で同時に予測するLO-Worldを提案した（抄録）。", "p3": "鳥瞰図（BEV）の潜在空間で両者を単一の流れとして扱い、密な意味情報と正確な幾何が互いを補うようにする。距離画像とボクセルの混成の自己符号化器と、過去の文脈をキャッシュして反復の遅延を減らすフローマッチング生成器を組み合わせた（抄録）。", "p5": "従来の最良の手法に比べ、占有予測のIoUを10.9%改善し、LiDARのチャンファー距離を30.1%減らした。1枚のGPUで毎秒25フレームを超える実時間の処理を保つ（抄録）。", "fun": "自動運転の車は、少し先に周りがどうなっているかを予想しながら走る。これまで「レーザーで測った点の集まり」の予想と「空間のどこが何で埋まっているか」の予想は、別々に行われるか、順につなぐだけだった。しかし二つは同じ世界を別の角度から見たものである。一緒に予想させると、互いを補い合って両方とも良くなった。別々の地図を一枚に重ねる発想が面白い。", "unverified": "本文を読めていないため、使用したデータセット、予測する時間幅、比較した手法は未確認。"}}, {"id": "pn31", "rank": 31, "field": "機械学習", "headline": "GPUで動く実時間のモデル予測制御向け二次計画ソルバ", "title": "FAME-QP: A GPU-Accelerated Quadratic-Programming Solver for Real-Time Model Predictive Control", "url": "https://arxiv.org/abs/2611.13766", "authors": "Santosh Mohan Rajkumar ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-12", "apa": "Rajkumar, S. M., Goswami, D., & Stockar, S. (2026). FAME-QP: A GPU-Accelerated Quadratic-Programming Solver for Real-Time Model Predictive Control (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13766", "why": "線形のモデル予測制御で現れる密な二次計画問題を解くGPUソルバFAME-QPを提示した。制約に応じた作用素の表現と、CUDAグラフで再生する融合した反復を組み合わせ、機器の較正と問題ごとの計時で実行構成を自動で選ぶ。数値ベンチマークと、人型ロボット・クアッドロータの制御シミュレーションで、解の精度と制御性能を保ちながら競合するGPUソルバより遅延を減らした。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "ロボットなどの実時間制御で繰り返し解く密な二次計画問題を、GPUで速く解くソルバFAME-QPを作った（抄録）。", "p3": "線形のモデル予測制御で現れる問題が対象。制約に応じた作用素の表現と、CUDAグラフで再生する融合した反復を組み合わせ、機器の較正と問題ごとの計時で実行構成を自動で選ぶ。キャッシュした作用素の集まりから初期の罰則を選び、行列が変わったときだけ作用素を更新する（抄録）。", "p5": "数値ベンチマークと、人型ロボットとクアッドロータの制御シミュレーションで、解の精度と制御性能を保ちながら、競合するGPUソルバより遅延を減らしたと報告する。数値は抄録に記載がない（抄録）。", "fun": "ロボットが転ばずに動くには、「次の瞬間にどう力を出すか」という最適化の問題を、絶えず解き続けなければならない（背景）。答えが遅れると、その間に体は傾いてしまう。この研究は、画像処理にも使われる計算装置GPUの上で、同じ形の計算を使い回す工夫を重ねて、その問題を解く時間を縮めた。制御の良し悪しが計算の速さに左右されるという点が面白い。", "unverified": "本文を読めていないため、遅延の数値、比較したソルバ、問題の規模は未確認。"}}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "エージェントの作業に合わせLLM推論基盤を動的に配分", "title": "Evolving Infra: Agent-Adaptive LLM Serving at Scale", "url": "https://arxiv.org/abs/2611.12304", "authors": "Hao Kang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-12", "apa": "Kang, H., Xu, W., Li, Z., Du, Z., Li, H., Xia, T., Bian, S., Krishna, T., Mao, H., Stoica, I., & Han, S. (2026). Evolving Infra: Agent-Adaptive LLM Serving at Scale (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12304", "why": "エージェント型の作業はLLM推論の需要の大きな部分を占めるが、前処理と生成を分ける既存の配信系は実行時の調整が乏しい。計算資源の割り当てとキー・バリュー・キャッシュの管理を切り離し、作業の構成に合わせて分割を変える計画器と、エージェントの文脈管理の信号でキャッシュの退避と転送を決める管理器を備えた枠組みを提示した。最大256台のGPUで、平均の要求遅延を最大4.1倍短縮したと報告する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載された抄録（候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "AIエージェントの作業に合わせて、LLMの推論サーバ群の計算資源の配分とキャッシュの管理を実行時に変える配信の枠組みEvolving Infraを提示した（抄録）。", "p3": "計算資源の割り当てとキー・バリュー（KV）キャッシュの管理を切り離し、ノードが前処理と生成の役割を効率よく切り替えられるようにした。オンラインの計画器が作業の構成に合わせて役割の分割を決め、エージェントの文脈管理の信号でキャッシュの退避と転送を決める（抄録）。", "p5": "コーディング、数学、計算機操作の課題で、最大256台のGPUを使い、NVIDIAの実運用の枠組みDynamoに比べて、平均の要求遅延を最大4.1倍、P95の初回トークンまでの時間を最大14倍短縮したと報告する（抄録）。", "fun": "AIエージェントは、長い作業の途中で同じ文脈を何度も使う。そのたびに計算をやり直すのは無駄なので、途中の計算結果を取っておく仕組み（キャッシュ）がある。ところが従来のサーバは、エージェントがまた使うはずの結果を捨ててしまうことがあった。この研究は、エージェント側の文脈の管理の情報をサーバに伝えて、何を残し何を捨てるかを賢く決めるようにした。", "unverified": "本文を読めていないため、作業負荷の構成、計画器の方式、費用への影響は未確認。"}}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "投資の強化学習で報酬と目的のずれを監査", "title": "Certifying Reward Alignment in Portfolio Reinforcement Learning", "url": "https://econpapers.repec.org/RePEc:arx:papers:2610.34153", "authors": "Matin Tavakoli ほか", "venue": "RePEc NEP", "date": "2026-11-02", "apa": "Tavakoli, M., Tavakoli, S., Salmani, F., Amini, A., Rohban, M. H., Aminian, G., & Habibnia, A. (2026). Certifying Reward Alignment in Portfolio Reinforcement Learning (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2610.34153", "why": "金融の強化学習は投資目的をリスク調整後の加法的な報酬に置き換えるが、報酬を正確に最適化しても別の選好を実行してしまうことがある。終端の平均・分散均衡について、報酬の誤設定と学習誤差を分ける監査を作り、行動を一つ変えたときの利得を、方策・報酬・継続価値の残差で抑える証明書を示した。9つの管理された市場と20の乱数種、米国産業ポートフォリオの432か月で検証している。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに掲載された抄録（候補の収集時に取得）を使用。抄録中の一部の数値は取得時に欠けている。本文は未取得", "preprint": true, "short": true, "p1": "投資の強化学習で、エージェントが学習した行動が、掲げた投資目的（平均・分散の目標）を本当に実行しているかを点検する監査の方法と証明書を作った（抄録）。", "p3": "終端の平均・分散均衡について、報酬の誤設定と学習の誤差を分ける。有限の外生状態の市場で、行動を一つ変えたときの利得を、方策・報酬・継続価値の残差で上から抑える。継続を考慮したアクター・クリティック法で将来の方策の補正を標本から推定する（抄録）。", "p5": "9つの管理された市場と20の乱数種で、近視眼的な報酬の対照に比べ、方策の距離と一段階の逸脱利得を減らした。米国の10・30・49産業ポートフォリオの432か月の検証では、報酬の較正は目標を保ったが、実現した運用成績は改善しなかった（抄録）。", "fun": "AIに「リスクを抑えつつもうけよ」と教えるとき、実際には点数（報酬）の付け方に置き換えて学習させる。AIがその点数をうまく稼いでも、点数の付け方が目的とずれていれば、望んだ投資とは違うことをしてしまう。この研究は、ずれの原因が「点数の付け方」なのか「学習の不足」なのかを切り分ける検査を作った。目的どおりに動くことと、もうかることは別だと示した点も面白い。", "unverified": "抄録の数値の一部（削減の割合）が欠けており未確認。本文を読めていないため、証明書の式の詳細は未確認。"}}, {"id": "pn34", "rank": 34, "field": "工学", "headline": "群論と固有値計数で周期円筒構造のSEAを高速化", "title": "An Efficient Virtual Statistical Energy Analysis Method for Cylindrical Periodic Structures Based on the Group Theory and Wittrick-Williams Algorithm", "url": "https://doi.org/10.21203/rs.3.rs-11466385/v1", "authors": "Haikuan Dong ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Dong, H., Yan, B., Liu, Z., Li, Z., & Gao, Q. (2026). An Efficient Virtual Statistical Energy Analysis Method for Cylindrical Periodic Structures Based on the Group Theory and Wittrick-Williams Algorithm. https://doi.org/10.21203/rs.3.rs-11466385/v1", "why": "円筒形の周期構造に仮想の統計的エネルギー解析（SEA）を使うとき、モード密度の計算と全体のモード解析が計算の障害になる。群論で周方向に分離して連成固有値問題を独立な部分問題に変え、Wittrick–Williamsのアルゴリズムでモード密度を求め、二分法と組み合わせて固有振動数とモード形を得る方法を提案した。数値例で精度と計算効率の改善を示している。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Research Square。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "円筒形の周期構造の振動を扱う仮想の統計的エネルギー解析（VSEA）で、計算の障害だったモード密度の計算と全体のモード解析を高速化する方法を提案した（抄録）。", "p3": "群論にもとづいて円筒の周方向を分離し、連成した固有値問題を独立な部分問題の集まりに変える。Wittrick–Williamsのアルゴリズムでモード密度を求め、二分法と組み合わせて固有振動数とモード形を得る。パワー注入法でSEAのパラメータと部分系のエネルギー応答を計算する（抄録）。", "p5": "数値例で、提案法は高い精度を保ちながら、商用ソフトウェアに比べて計算効率を大きく改善したと報告する。数値は抄録に記載がない（抄録）。背景：SEAは構造を部分系に分け、振動エネルギーのやり取りで応答を見積もる方法。", "fun": "同じ形が周方向に繰り返す筒状の構造がある。こうした構造の細かい振動をまともに計算すると膨大な時間がかかる。この研究は「同じ形の繰り返し」という対称性を数学の群論で利用し、大きな問題をたくさんの小さな問題に分けて解く。さらに、ある周波数より下に固有振動がいくつあるかを数える方法を組み合わせた。形の規則性を計算の節約に変える発想が面白い。", "unverified": "本文を読めていないため、対象とした構造の寸法、周波数帯、精度と計算時間の数値は未確認。"}}, {"id": "pn35", "rank": 35, "field": "工学", "headline": "粘弾性波動計算の構成モデルの等価性を機械で証明", "title": "A Machine-Checked Account of the Equivalence Relations among Generalized Rheological Models for Viscoelastic Seismic-Wave Modeling", "url": "https://doi.org/10.2139/ssrn.7686199", "authors": "fan li", "venue": "SSRN", "date": "2026-11-12", "apa": "li, f. (2026). A Machine-Checked Account of the Equivalence Relations among Generalized Rheological Models for Viscoelastic Seismic-Wave Modeling. https://doi.org/10.2139/ssrn.7686199", "why": "時間領域の粘弾性地震波の計算で使われる一般化マクスウェル体・一般化ツェナー体・一般化ケルビン・フォークト体・記憶変数の定式化は代数的に等価だと知られている。この等価関係の全体を、定理証明支援系Lean 4で周波数領域と時間領域の両方について機械的に検証した。各等価性が成り立つ仮定（分母が零でない、緩和時間が零でない、機構の数が有限）を明示している。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（SSRN。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "粘弾性の地震波計算で使われる4種類の構成モデルが互いに等価であるという既知の事実を、定理証明支援系で機械的に検証した（抄録）。", "p3": "一般化マクスウェル体、一般化ツェナー体、一般化ケルビン・フォークト体、記憶変数の定式化の等価関係の全体を、Lean 4と数学ライブラリmathlibで、周波数領域と時間領域の両方について形式化した。各等価性が成り立つ仮定を明示した（抄録）。", "p5": "すべての定式化が同じ緩和（減衰）の作用素を共有し、時間領域の記憶変数が共通の一階の緩和方程式を満たすことを確認した。周波数領域の恒等式は、任意の体の上で成り立つ純粋な有理式の恒等式だった。Leanのソースは警告なしでコンパイルされる（抄録）。", "fun": "地震の揺れが地中で弱まっていく様子を計算するには、ばねと緩衝器を組み合わせた模型を使う（背景）。組み合わせ方は何通りもあるが、数式のうえでは同じ結果を与えるとされてきた。その「同じである」ことを、人の目ではなくコンピュータに一つずつ確かめさせたのがこの研究である。式の誤りは計算結果に気づかれないまま入り込むので、土台を機械で固める意味は大きい。", "unverified": "本文を読めていないため、形式化した定理の数と、既存の計算コードへの影響の検討は未確認。"}}, {"id": "pn36", "rank": 36, "field": "工学", "headline": "混合メッシュと過渡応答で複雑な3次元構造を位相最適化", "title": "Topology Optimization for Complex 3D Structures and Loading Conditions", "url": "https://doi.org/10.21203/rs.3.rs-11419124/v1", "authors": "Jingchen Ye ほか", "venue": "Research Square (In Review)", "date": "2026-11-11", "apa": "Ye, J., Liu, Q., Feng, Y., Guo, Y., Gang, T., & Chen, L. (2026). Topology Optimization for Complex 3D Structures and Loading Conditions. https://doi.org/10.21203/rs.3.rs-11419124/v1", "why": "位相最適化の多くは構造格子と静的荷重を前提にしており、複雑な3次元形状と過渡的な動的応答を扱いにくい。四面体と六面体を角錐要素でつなぐ混合メッシュの離散化と過渡動的応答解析にもとづく方法を提案し、要素の大きさの違いを考慮する体積重みつきの密度フィルタで小さな要素の非物理的な影響を抑える。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Research Square。候補の収集時に取得）を使用。本文は未取得", "preprint": true, "short": true, "p1": "複雑な3次元形状と時間変化する荷重を扱える位相最適化（材料をどこに残すかを決める最適設計）の方法を提案した（抄録）。", "p3": "四面体要素と六面体要素を、角錐の移行要素でつないだ混合メッシュで形状に適応する。要素の大きさの違いを考慮する体積重みつきの密度フィルタで、小さな要素の非物理的な影響を抑える。時間変化する荷重には、過渡の随伴感度解析にもとづく最適化モデルを立てる（抄録）。", "p5": "代表的な数値例で、有効性、数値的な安定性、汎用性を示したと報告する。数値は抄録に記載がない（抄録）。", "fun": "部品を軽くて丈夫にするために、コンピュータに「どこの材料を残すか」を決めさせる設計法がある。従来は、規則正しい格子に切った形と、じっとかかる力を前提にすることが多かった。しかし実際の部品は形が複雑で、力は時間とともに変わる。この研究は、形に合わせて種類の違う要素を混ぜて使い、時間変化する力に対しても最適な形を探せるようにした。", "unverified": "本文を読めていないため、数値例の内容、計算時間、従来法との定量的な比較は未確認。"}}, {"id": "pn37", "rank": 37, "field": "工学", "headline": "帯筋の配置と地震後火災を受けるRC柱の挙動を解析", "title": "Numerical Investigation on Effect of Confining Reinforcement on Post-Earthquake Fire Behavior of Reinforced Concrete Column", "url": "https://doi.org/10.21203/rs.3.rs-11373130/v1", "authors": "Selamawit Ayal Chanie ほか", "venue": "Research Square (In Review)", "date": "2026-11-12", "apa": "Chanie, S. A., Mohammed, T. A., Ejigu, E. F., Weldemichael, R. A., Mihiretu, G. K., Demissie, Y. A., & Geremew, F. T. (2026). Numerical Investigation on Effect of Confining Reinforcement on Post-Earthquake Fire Behavior of Reinforced Concrete Column. https://doi.org/10.21203/rs.3.rs-11373130/v1", "why": "地震による水平載荷のあとに火災を受ける鉄筋コンクリート柱の挙動は、通常の設計基準で十分に扱われていない。文献の実験で検証した有限要素モデル（300 mm角の片持ち柱）を使い、中間帯筋の配置、コンクリート強度、横補強筋の間隔が地震後火災時の柱の挙動に与える影響を数値的に調べた。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録（Research Square。候補の収集時に取得）を使用。抄録の末尾は取得時に切れている。本文は未取得", "preprint": true, "short": true, "p1": "地震で横から力を受けたあとに火災にあう鉄筋コンクリート柱について、中間帯筋（柱の内部を拘束する補強筋）が耐力をどれだけ保つかを数値解析で調べた（抄録）。", "p3": "ANSYSで有限要素モデルを作り、文献の実験結果で検証したうえで、300 mm角の片持ち柱について、帯筋の配置、コンクリート強度、横補強筋の間隔を変えた19のモデルでパラメータ解析を行った（抄録）。", "p5": "中間帯筋は耐力を、水平載荷のもとで4.98%、地震後火災のもとで11.48%高め、火災後のほうが効果が大きかった。熱応力による耐力の低下は、帯筋のある柱で6.38%、ない柱で12.5%だった。横補強筋の間隔を100 mmから300 mmに広げると強度が4.22%下がった（抄録）。", "fun": "地震のあとに火災が続くことがある。地震で力を受けた柱が、続けて火にあぶられたら、建物を支え続けられるだろうか。この研究は、柱の中に入っている「たが」のような鉄筋（帯筋）を加えると、地震だけのときより、地震のあとの火災のときのほうがよく効くことを計算で示した。二つの災害が続けて来る場合を考えた点が面白い。", "unverified": "抄録の末尾が切れており、コンクリート強度の影響の数値は未確認。数値解析による検討で、本文は読めていない。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "路面凹凸が橋の共振を起こし車両走査法を乱す", "title": "Mitigation of Effect of Bridge Modal Resonant Interference Induced by Road Roughness in the Vehicle Scanning Method", "url": "https://doi.org/10.1142/s0219455427410112", "authors": "X. Q. Mo ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-12", "citescore": 6.5, "citescore_year": "2025", "apa": "Mo, X. Q., Deng, D. S., Shi, K., Yang, D.-S., & Yang, Y. B. (2026). Mitigation of Effect of Bridge Modal Resonant Interference Induced by Road Roughness in the Vehicle Scanning Method. International Journal of Structural Stability and Dynamics. https://doi.org/10.1142/s0219455427410112", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "走行車両の応答から橋の特性を読み取る車両走査法（vehicle scanning method）で、路面凹凸が橋のモードを共振させ、その応答が移動荷重による応答に重なって同定を乱す仕組み（橋梁モード共振干渉）を解析的に示し、その大きさを測る指標を作った（抄録）。", "p2": "路面凹凸は車両-橋梁相互作用に常に存在する外乱で、車両走査法の実用化の障害になっている。これまでの研究より踏み込んで、凹凸に伴う橋のモード応答の成分と、それが走査車両に伝わる経路まで定式化する必要があった（抄録）。", "p3": "車両-橋梁相互作用系の解析的な定式化の中で、凹凸に由来する橋のモード応答と走査車両への伝達を表す。凹凸の周波数が橋のモードの共振条件を満たすと共振応答が生じる。これを定量化するため、移動荷重による応答を基準にした包絡線比（凹凸-荷重比）と、橋の初期応答を基準にした包絡線比（凹凸-初期比）を定義した（抄録）。", "p4": "有限要素解析の応答をモードへの射影と車両応答の再構成で処理し、包絡線比の関係を検証した。路面凹凸の水準、車両の固有振動数と減衰、橋の減衰、車速を変えるパラメータ解析を行った（抄録）。", "p5": "共振干渉は、モード形と減衰比の同定に使う橋由来の応答に影響する。凹凸-荷重比は走査車両の質量にほぼ依存しないが、凹凸-初期比は橋の初期応答が大きいほど、また車両が軽いほど小さくなる。この対比は、走査の前に橋に初期応答を与えておき、軽い車両で応答を取得する「加振と取得の分離」を支持する。凹凸の水準、車両の固有振動数と減衰、橋の減衰は共振干渉の相対的な影響を強め、車速の影響は単調でない（抄録）。", "p6": "検証は解析式と有限要素解析によるもので、実橋での計測による確認は抄録に記載がない。著者は、凹凸のある条件での実用性を改善しうる理論的な基礎を与えると述べるにとどまる。具体的な数値と車両モデルの詳細は、本文を読めておらず未確認。", "fun": "橋の上を走る車の揺れを測れば、橋そのものの揺れ方が分かる、という検査法がある。厄介なのは路面のでこぼこで、車を揺らすだけでなく、橋まで揺らしてしまう。でこぼこのリズムが橋の揺れやすいリズムと合うと、橋が共振し、その揺れが本来見たい信号に重なる。この研究が支持するのは、先に橋を揺らしておいてから、軽い車で測るやり方である。揺らす役と測る役を分ける発想が面白い。", "unverified": "掲載誌の本文を取得できず、包絡線比の式、数値例の条件と値、車速の影響の詳細は未確認。"}}, {"id": "jr02", "rank": 2, "headline": "粗から細へ時刻ずれを推定し5ms以内に同期", "title": "A multi-resolution approach to robust time synchronization for lightweight seismic structural health monitoring", "url": "https://doi.org/10.1177/14759217261505330", "authors": "Zhe Qu ほか", "venue": "Structural Health Monitoring", "date": "2026-11-12", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Qu, Z., Fan, T., & Wang, X. (2026). A multi-resolution approach to robust time synchronization for lightweight seismic structural health monitoring. Structural Health Monitoring. https://doi.org/10.1177/14759217261505330", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "建物の地震時モニタリングで、離れたセンサ間の時刻のずれを、粗い合わせから細かい合わせへ段階的に推定して補正するアルゴリズムを提案し、安価な同期方式でも層間変形を正しく評価できるようにした（抄録）。", "p2": "分散配置したセンサの正確な時刻同期は、信頼できる地震時の構造ヘルスモニタリングの前提である。とくに層間変形角を損傷の指標に使う軽量なシステムでは、機器や通信規約に起因する遅延が、通常の条件で動いていても無視できない誤差を生む（抄録）。", "p3": "時刻同期を、順に制約を課していく推定問題として定式化し、遅延を粗い段階から細かい段階へ連鎖的に推定する（漸進近似の同期アルゴリズム）。雑音のある計測環境で使うことを想定している（抄録）。各段階で何を手がかりにずれを推定するかの詳細は、抄録からは分からない。", "p4": "実大の10層の鉄筋コンクリート構造の振動台実験で、実際の監視条件を代表するさまざまな遅延のシナリオを作って検証した。評価の指標は、補正後に残る層間の時刻ずれと、層間変形の最大値の相対誤差である（抄録）。", "p5": "任意の層間の時刻ずれを5 ms以内に減らし、層間変形の最大値の推定の相対誤差を、100%を超える値から1%以内に抑えた。安価なネットワーク時刻プロトコル（NTP）による同期で運用した場合でも成り立った（抄録）。", "p6": "検証は1つの試験体の振動台実験による。構造の応答が大きく変わる場合や、センサの数・配置が違う場合の性能は抄録に記載がない。著者の述べる限界は本文を読めておらず未確認。", "fun": "建物の各階に付けたセンサの時計が、ほんの少しずつずれていたらどうなるか。上の階と下の階の揺れの差から「どれだけ変形したか」を計算するので、時計のずれはそのまま変形の誤差になる。ずれによる誤差が本当の値を上回ることさえあった。この研究は、まず大まかに、次に細かくと段階を踏んで時刻を合わせ直し、誤差をごく小さくした。高価な同期の仕組みに頼らず、計算で補う発想である。", "unverified": "掲載誌の本文を取得できず、アルゴリズムの各段階の内容、遅延のシナリオの詳細、雑音の水準は未確認。"}}, {"id": "jr03", "rank": 3, "headline": "LLMは各国の「他者の気候意識」を当てられるか", "title": "Can large language models predict public perceptions of support for climate action across 125 countries?", "url": "https://doi.org/10.1093/pnasnexus/pgag374", "authors": "Nattavudh Powdthavee ほか", "venue": "PNAS Nexus", "date": "2026-11-12", "sjr": 1.339, "citescore": 6.7, "citescore_year": "2025", "apa": "Powdthavee, N., & Geiger, S. J. (2026). Can large language models predict public perceptions of support for climate action across 125 countries? PNAS Nexus, 5(11). https://doi.org/10.1093/pnasnexus/pgag374", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "LLMが、気候変動対策への資金拠出について「他の人はどう考えていると人々が思っているか」（二次の信念）を125か国について予測できるかを事前登録の実験で確かめ、一次の実測値を与えない限り予測できないことを示した（抄録）。", "p2": "二次の信念は気候行動の強い推進力になると理論づけられているが、世界規模で測るのは費用がかかり難しい。LLMがその測定の代わりになるかは分かっていなかった（抄録）。", "p3": "4つの現行のLLMに二次の信念を予測させ、ギャラップ世界世論調査（2021/2022）の全国代表標本と、統計的な回帰モデル（最小二乗法とLasso）を基準に比べた。プロンプトに、その国の実際の一次の意思（自分は行動する意思があるか）を含めるかどうかを変えた（抄録）。", "p4": "評価の指標は、予測と実測の誤差と相関である。記憶した値を取り出しているだけかを確かめる反実仮想と記憶の検査、LLMに一次の意思を国の情報から推定させて二次の予測に使う探索的な分析も行った（抄録）。", "p5": "ClaudeとLlamaの平均誤差が最も小さく（約5ポイントと約7ポイント）、Claudeの誤差は最小二乗法やLassoと統計的に差がなかった。しかし一次の値を与えないと、人口・経済・気候の情報を与えても、予測と実測の相関はすべてのモデルでほぼゼロだった。LLMが推定した一次の値を使った二次の予測も実測と無関係だった。記憶した値を取り出している証拠はほとんどなかった（抄録）。", "p6": "著者は、試した方法は一次のデータがない場面では調査による測定の代わりにならないと結論する。モデルは主に、与えられた一次の値を二次の推定に写しており、他の国別情報の寄与は小さい。他の質問項目への一般化は抄録に記載がなく、本文を読めていないため未確認。", "fun": "「他の人たちは温暖化対策にお金を出すつもりがあるか」についての人々の見立てを、AIに国ごとに当てさせた。当たっているように見えたのは、「その国で実際にどれだけの人が行動するつもりか」という数字を先に与えた場合だけだった。その数字なしでは、国の経済や気候の情報を与えても、まったく当たらなかった。AIは各国の世論を知っていたのではなく、渡された数字をもとに答えを作っていた、という結果である。", "unverified": "掲載誌の本文を取得できず、プロンプトの文面、国ごとの誤差の分布、GPTとGeminiの誤差の値は未確認。"}}, {"id": "jr04", "rank": 4, "headline": "看護師が親族に担う無償の健康ケアを概念化", "title": "The Nurse Who Never Clocks Out: Kin‐Directed Care Coordination, Filial Obligation and Invisible Work in the Care Economy", "url": "https://doi.org/10.1111/jan.70816", "authors": "Hailan Jiang ほか", "venue": "Journal of Advanced Nursing", "date": "2026-11-12", "sjr": 1.314, "citescore": 7.0, "citescore_year": "2025", "apa": "Jiang, H., Xia, L., Wu, H., Cui, Y., Yu, X., & Wang, Y. (2026). The Nurse Who Never Clocks Out: Kin‐Directed Care Coordination, Filial Obligation and Invisible Work in the Care Economy. Journal of Advanced Nursing. https://doi.org/10.1111/jan.70816", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "看護師が、親族・友人・近隣の人々のために無償で行っている健康上の助言、受診の道案内、直接の世話を、「親族向けケア調整」という一つの概念として定義し、測定されていない無償のケア労働として位置づけた（抄録）。", "p2": "フェミニズムの研究は、無償のケア労働が経済を支え主に女性に偏ることを示してきた。仕事と家庭の両方でケアを担う「二重のケア」の研究は、看護師が親族に助言することを記述してきたが、親族のネットワーク全体の健康の助言者・案内役になるという常設の役割は扱ってこなかった（抄録）。", "p3": "方法は批判的な議論による立場表明の論文で、ケア労働、孝行と性別化された家族ケア、二重のケア、仕事と家庭の境界と回復、専門職の規制、看護師の定着についての研究にもとづく。新しいデータの収集はない（抄録）。", "p4": "実証的な検証は行っていない。概念は、既存の研究の整理と、5つの実践（解釈する、優先度を判断して助言する、利用を仲介する、直接の世話をする、責任を負う）の記述によって示される（抄録）。", "p5": "この労働は仕事と家庭の境界を越え、回復を損なうおそれがあり、専門職としての義務を伴うのに、業務量の指標、労働力調査、ケア経済の勘定のどれにも現れない。孝行の規範と性別が、誰が頼まれ、どれだけ断りにくいかを形づくりうる。一次医療の弱い保健制度は、この労働を数えないまま頼っている可能性がある（抄録）。", "p6": "概念と測定の課題を提案する段階で、頻度や負担の大きさを示すデータはない。著者自身も、文化に形づくられ「おそらく」性別化されていると慎重に述べている。他の職種への適用は抄録に記載がなく、本文を読めていないため未確認。", "fun": "看護師の仕事は、職場を出たら終わるだろうか。実際には、家族や親戚、近所の人から健康の相談を受け、受診の道案内をし、ときには手当てまでする。業務量の指標にも統計にも載らないが、専門職としての責任を伴う労働である。この論文は、その見えない仕事に名前を付けた。名前がなければ数えられず、数えられなければ対策も立てにくい。まず名づけることの意味を示している。", "unverified": "掲載誌の本文を取得できず、5つの実践の詳しい定義、測定の課題の具体案は未確認。実証データにもとづく研究ではない。"}}, {"id": "jr05", "rank": 5, "headline": "たわみ影響線の変化の空間パターンで損傷を特定", "title": "Damage Identification in Prestressed Concrete Continuous Girder Bridges Using Spatial Patterns of Deflection Influence Line Changes", "url": "https://doi.org/10.1142/s0219455427410100", "authors": "Zhiwei Chen ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-11-12", "citescore": 6.5, "citescore_year": "2025", "apa": "Chen, Z., Cai, B., Lu, D., Chen, J., & Zhang, Y. (2026). Damage Identification in Prestressed Concrete Continuous Girder Bridges Using Spatial Patterns of Deflection Influence Line Changes. International Journal of Structural Stability and Dynamics. https://doi.org/10.1142/s0219455427410100", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "プレストレストコンクリートの連続桁橋で、たわみ影響線の変化が径間ごとにどう現れるかという空間的な型から、損傷の種類と位置の見当を付ける方法を示した（抄録）。", "p2": "たわみ影響線の変化は損傷の手がかりになりうるが、連続桁橋で、支承の浮き、局所の曲げ損傷、全体的なプレストレスの損失という性質の違う状態をどう見分けるかが課題だった（抄録）。背景：たわみ影響線は、荷重が橋の上を動くときの、ある点のたわみの変化を表す線。", "p3": "3径間の橋の3次元有限要素モデルを、健全時に実測したひずみ影響線と比べたうえで、各損傷ケースについて、同じ試験荷重のもとでの9つの計測点のたわみ影響線の変化を計算する。載荷した径間ごとに影響線変化の絶対値を調べ、径間長で調整し、3つの径間中央の点の結果を合わせる。小さい径間の寄与と最大の寄与を比べる2つの比を作り、50%の閾値で型を分ける（抄録）。", "p4": "模擬した損傷ケースが、1径間型・2径間型・3径間型の応答の型に分かれるかを評価した。径間長が不等な2つ目の橋で、対応する9ケースについても同じ型が現れるかを確かめた（抄録）。", "p5": "支承の浮きは主にその支承の両隣の2径間に影響し、中央径間の曲げ損傷はその径間に載荷したときに最大の変化を生み、全体的なプレストレスの損失では3径間すべてが大きく寄与した。2つの比は模擬したケースを3つの型に分け、2つ目の橋でも同じ型が得られた。局所損傷では、寄与する径間が影響を受けた径間や支承を指し示した（抄録）。", "p6": "損傷は有限要素モデル上の模擬で、実橋での実測は健全時のひずみ影響線との比較に限られる。雑音や温度、計測誤差のもとでの閾値の頑健性は抄録に記載がない。著者も、的を絞った点検の手引きになりうると控えめに述べる。", "fun": "橋の上を荷重が動くと、橋はその位置に応じてたわむ。その「たわみの記録」は、橋が傷むと形が変わる。面白いのは、傷の種類によって変わり方の「広がり」が違うことだ。支えが浮いた場合は両隣の区間に、桁の一部が傷んだ場合はその区間に、全体を締め付ける力が抜けた場合は全区間に変化が出る。どこが変わったかの型から、何が起きたかの見当を付けられる。", "unverified": "掲載誌の本文を取得できず、損傷の程度の設定、比の定義式、対象橋の諸元は未確認。"}}, {"id": "jr06", "rank": 6, "headline": "AI接客の適合度と体験の質は逆U字の関係", "title": "The AI engagement paradox: algorithmic congruence and its inverted-U effect on tourist experience quality", "url": "https://doi.org/10.1108/ijchm-04-2026-0687", "authors": "Bao Quoc Truong-Dinh ほか", "venue": "International Journal of Contemporary Hospitality Management", "date": "2026-11-12", "sjr": 3.116, "citescore": 22.1, "citescore_year": "2025", "apa": "Truong-Dinh, B. Q., & Phan, D. K. (2026). The AI engagement paradox: algorithmic congruence and its inverted-U effect on tourist experience quality. International Journal of Contemporary Hospitality Management, 1–34. https://doi.org/10.1108/ijchm-04-2026-0687", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用（抄録の末尾は切れている）", "preprint": false, "p1": "飲食の観光でAIエージェントの関与を増やすと体験の質は最初は上がるがやがて下がる、という逆U字の関係（AI関与の逆説）を、新しい構成概念「アルゴリズム的ホスピタリティ適合」の尺度を作って実証した（抄録）。", "p2": "アジアの飲食・ガストロノミー観光の現場ではAIエージェントの導入が広がっているが、実務家は、AIの関与を増やすと体験の質が最初は高まり、その後は損なわれるという直感に反する型を観察していた。これを理論づけて確かめる枠組みがなかった（抄録）。", "p3": "逐次的な探索型の混合研究法。第1段階で、重要事象法による半構造化面接24件から尺度項目を作る。第2段階で、香港・シンガポール・バンコクの量的調査（N = 412）を行う。認知負荷理論にもとづき、応答曲面法つきの多項式回帰で逆U字を確かめ、PLS-SEMで構成概念を検証した（抄録）。背景：多項式回帰は、2乗の項を入れて山なりの関係を捉える方法。", "p4": "共通方法バイアスへの対処（時間的な分離、Harmanの単一因子検定とマーカー変数）と、ガウスコピュラによる内生性の補正で頑健性を確かめた。文化的な集団主義とデジタルリテラシーによる調整も調べた（抄録）。", "p5": "尺度は、料理に関するAIの精度、感情面のサービスの共鳴、文化的な文脈への適合の3要素からなり（15項目）、構成概念妥当性と弁別的妥当性が確認された。適合度は体験の質に有意な逆U字の効果を持ち、転換点の帯は7件法で4.18〜5.04と推定された。集団主義は下り坂を急にし、デジタルリテラシーは転換点を右に動かした（抄録）。", "p6": "自己報告の調査にもとづく。3つの都市の飲食観光に限られ、他のサービスへの一般化、転換点の推定の精度は抄録に記載がない。抄録の末尾は取得時に切れており、著者の述べる限界は未確認。", "fun": "飲食店でAIが関わってくれると、最初は体験が良くなる。でも関わりが増えすぎると、かえって体験の質が下がる。この研究は、AIの「ちょうどよさ」に山の頂上があることを数字で示した。面白いのは、頂上の位置が人によって違うことだ。デジタルに慣れた人ほど頂上が先にあり、集団を重んじる文化の人ほど、頂上を過ぎたあとの下がり方が急だった。", "unverified": "掲載誌の本文を取得できず、回帰係数、応答曲面の形、項目の文言は未確認。抄録の末尾も切れている。"}}, {"id": "jr07", "rank": 7, "headline": "生成AIを「拡張」目的で使うと創造性が上がる", "title": "Augmentation or automation? A dual-path model of GenAI usage motivations and employee creativity", "url": "https://doi.org/10.1108/intr-07-2025-1110", "authors": "Yujie Shi ほか", "venue": "Internet Research", "date": "2026-11-12", "sjr": 2.207, "citescore": 14.8, "citescore_year": "2025", "apa": "Shi, Y., Xu, J., Mao, J.-Y., & Xu, M. (2026). Augmentation or automation? A dual-path model of GenAI usage motivations and employee creativity. Internet Research, 1–19. https://doi.org/10.1108/intr-07-2025-1110", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "従業員が生成AIを「自分の力を伸ばすため」に使うか「仕事を肩代わりさせるため」に使うかという動機の違いが、創造性に逆向きの影響を持つことを、二つの経路のモデルで示した（抄録）。", "p2": "生成AIは従業員の創造性を高めることも制約することもあるが、この食い違う効果を生む仕組みは明らかでなかった。どれだけ使うかではなく、なぜ使うかに目を向ける必要があった（抄録）。", "p3": "二重過程理論と自己調整理論にもとづき、拡張の動機と自動化の動機を区別する。拡張の動機は知識の統合を、自動化の動機は知識の依存を通じて創造性に効くと仮定する（抄録）。", "p4": "複数の時点・複数の情報源による現場の調査と、場面想定の実験の2つで仮説を検証した。誠実性（性格特性）による調整も調べた。標本の規模と測定の詳細は抄録に記載がない（抄録）。", "p5": "拡張の動機は知識の統合を通じて創造性と正に関連し、自動化の動機は知識の依存を通じて創造性と負に関連した。誠実性は、拡張の動機の正の間接効果を強め、自動化の動機の負の間接効果を弱めた（抄録）。", "p6": "著者は、拡張と自動化の動機は併存しうるうえ、課題や利用の場面ごとに変わりうると認め、その動態、他の個人差、仕事の文脈による違いを今後の課題とする（抄録）。効果の大きさは本文を読めておらず未確認。", "fun": "同じAIを使っていても、創造的になる人と、そうでない人がいる。違いは使う量ではなく、使う理由にあった。自分の力を伸ばすために使う人は、AIから得たものを自分の知識と統合して新しいものを作る。仕事を肩代わりさせるために使う人は、AIの知識に依存してしまう。道具は同じでも、頼り方で結果が逆になるという結果である。", "unverified": "掲載誌の本文を取得できず、標本の規模、測定尺度、係数の大きさ、実験の内容は未確認。"}}, {"id": "jr08", "rank": 8, "headline": "自動化された仕事は燃え尽きと結びつく", "title": "Associations between digital and automated work and psychosocial outcomes: Cross-sectional results from the Gutenberg Health Study.", "url": "https://doi.org/10.1007/s00420-026-02252-0", "authors": "Freiberg A ほか", "venue": "International archives of occupational and environmental health", "date": "2026-11-10", "citescore": 6.1, "citescore_year": "2025", "apa": "Freiberg, A., Nübling, M., Chalabi, J., Drössler, S., Hegewald, J., Romero Starke, K., Lincke, H.-J., Jankowiak, S., Riechmann-Wolf, M., Dietz, P., Beutel, M., Pfeiffer, N., Lackner, K. J., Lurz, P., Gianicolo, E., Wild, P. S., & Seidler, A. (2026). Associations between digital and automated work and psychosocial outcomes: Cross-sectional results from the Gutenberg Health Study. International Archives of Occupational and Environmental Health, 99(9). https://doi.org/10.1007/s00420-026-02252-0", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "Europe PMCの全文のうち、抄録、対象者・GAPモジュール・統計解析の節、主な関連の結果の節、強みと限界の節を読んだ。表の数値と考察の一部は未読", "preprint": false, "p1": "ドイツの一般住民の働く人5,730人で、デジタル化された仕事と自動化された仕事の程度・要求・経験が、仕事満足、燃え尽き、離職意図などの心理社会的な指標とどう関連するかを示した（抄録、結果の節）。", "p2": "技術が職場を形づくるようになっているのに、その心理社会的な影響についての証拠は限られていた。特定の職種ではなく住民ベースの標本で、技術に関わる要求を程度・要求・経験に分けて調べることに意義がある（抄録、強みと限界の節）。", "p3": "グーテンベルク健康調査（2019〜2022年）の横断データを使う。デジタル・自動化の仕事はGAPモジュールの短縮版（原版の21問のうち11問）で、心理社会的な指標はコペンハーゲン心理社会質問票（COPSOQ）で測った。デジタルな仕事は情報通信の道具とネットワーク化の利用、自動化された仕事は機械やロボットによる支援を指す（抄録、GAPモジュールの節）。", "p4": "属性との関連は順序ロジスティック回帰（Bonferroni補正）で、心理社会的な指標との関連は、性・年齢・測定日・社会経済的地位を調整した線形回帰で推定した。後者は探索的な分析として多重検定の補正をしていない（統計解析の節）。", "p5": "頻繁なデジタルな仕事は約80%に見られ、頻繁な自動化された仕事は約6%だった（抄録）。デジタルな仕事は高い仕事満足と低いプレゼンティーズムに関連したが、離職意図の高さとも関連した。自動化された仕事は、仕事満足とワーク・エンゲイジメントの低さ、燃え尽きの高さと関連した。予見できない技術的な故障は不利な指標のすべてと関連し、技術の肯定的な経験は一貫して良好な指標と関連した（結果の節）。", "p6": "著者は、横断の設計で因果も前後関係も決められないこと、使った短縮版は正式には妥当性が確認されていないこと、測定が2019年までの主要な技術を対象とし、AIや大規模言語モデルを含まないこと、すべて自己報告であることを限界に挙げ、縦断の分析を計画している（強みと限界の節）。", "fun": "デジタルの道具を使う仕事と、機械やロボットが支援する仕事。どちらも技術が入った職場だが、働く人の状態との関係は違っていた。デジタルな仕事は満足の高さと結びつき、自動化された仕事は燃え尽きの高さと結びついていた。そして、予見できない技術的な故障が、悪い指標と最も広く結びついていた。反対に、技術を肯定的に経験している人は、どの指標も良好だった。", "unverified": "回帰係数の数値、性別による層別の結果、補足資料は読んでおらず未確認。"}}, {"id": "jr09", "rank": 9, "headline": "競合と多市場で接するほど長期志向の言葉を使う", "title": "Multimarket Contact and Long-Term Oriented Language in Competition", "url": "https://doi.org/10.1177/01492063261494471", "authors": "He Gao ほか", "venue": "Journal of Management", "date": "2026-11-12", "sjr": 8.251, "citescore": 21.4, "citescore_year": "2025", "apa": "Gao, H., Yu, T., Woo, H.-S., & Cannella, A. A. (2026). Multimarket Contact and Long-Term Oriented Language in Competition. Journal of Management. https://doi.org/10.1177/01492063261494471", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "企業が開示の中で使う「長期志向の言葉」を、投資家向けではなく競争上の目的を持つ信号として捉え、複数の市場で競合と接しているほどその言葉が増えることを示した（抄録）。", "p2": "企業の開示は、資源の獲得を左右する相手の認識を管理する戦略的な道具である。先行研究は、投資家やアナリストに向けた開示の理由に集中しており、企業がいつ、なぜ競争上の目的で開示するのかは未解明だった（抄録）。", "p3": "競争戦略の伝達の時間的な志向に注目し、多市場接触（複数の市場で同じ競合と向き合うこと）が長期志向の言語の使用をどう形づくるかを調べる。多市場接触が大きいと、市場をまたいだ報復のリスクが高まるため、抑制的な競争姿勢を長期志向の言葉で示す誘因が強まる、と論じる（抄録）。", "p4": "2015〜2024年の米国の製造業6産業・36社の標本で検証した。業績の悪さやアナリストの下方修正によって競争上の能力が制約されて見える場合に、関係が強まるかも調べた。言語の測り方と推定方法は抄録に記載がない（抄録）。", "p5": "結果は予測とおおむね整合的だった。多市場接触は長期志向の言語を使う誘因を強め、その関係は、業績が悪いときやアナリストの下方修正があるときにとくに強いという予測が、全体として支持された（抄録）。", "p6": "標本は36社で、著者自身も「おおむね整合的」と控えめに表現している。因果の向き、他の産業への一般化は抄録に記載がなく、本文を読めていないため未確認。", "fun": "会社が開示の文書に書く「長い目で見た」言葉は、投資家へのメッセージだと思われてきた。この研究は、それが競争相手への合図にもなっていると考えた。いくつもの市場で同じ相手とぶつかる会社は、一か所で攻めると別の市場でやり返されるおそれがある。だから、抑制的な姿勢を言葉で示す。競争する力が弱って見えるときほどそうする、という見立てである。文章の時間の向きを競争の道具として読んだ点が面白い。", "unverified": "掲載誌の本文を取得できず、長期志向の言語の測定方法、推定モデル、係数の大きさは未確認。"}}, {"id": "jr10", "rank": 10, "headline": "ランダウ減衰とプラズマエコーの数学を概観", "title": "Landau Damping and Plasma Echoes", "url": "https://doi.org/10.1137/26m1938650", "authors": "Emmanuel Grenier ほか", "venue": "SIAM Review", "date": "2026-11-12", "sjr": 2.331, "citescore": 14.1, "citescore_year": "2025", "apa": "Grenier, E., Nguyen, T. T., & Rodnianski, I. (2026). Landau Damping and Plasma Echoes. SIAM Review, 68(4), 865–882. https://doi.org/10.1137/26m1938650", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "プラズマの古典的なモデルであるVlasov–Poisson系で、空間的に一様な平衡の近くで起きるランダウ減衰とプラズマエコーについて、研究の現状をまとめた総説である（抄録）。", "p2": "ランダウ減衰は、解析的またはGevrey級という滑らかな初期データについて調べられてきた。どこまで広い初期データで成り立つか、エコーとどう関わるかが問題である（抄録）。背景：Vlasov–Poisson系は、位置と速度の空間（位相空間）での粒子の分布の時間発展を記述する方程式で、ランダウ減衰は衝突がなくても電場のゆらぎが減衰する現象。", "p3": "トーラス上または全空間に閉じ込められたプラズマについて、非専門家向けに開発された解析性の枠組みを再現する。この枠組みは、任意に高い周波数を持つ無限個の基本波が相互作用する「プラズマエコー解」を構成する（抄録）。", "p4": "総説であり、新しい数値実験やデータによる検証ではなく、数学的な構成と既存の結果との比較による。比較の対象は、MouhotとVillaniが調べた解析的またはGevrey級の空間のデータである（抄録）。", "p5": "構成されたエコー解は、MouhotとVillaniが調べたものよりずっと広い種類のデータを許し、任意に大きなソボレフノルムを持つある種のデータを含む。それでも、これらの解は長時間ではランダウ減衰を示す（抄録）。", "p6": "対象は空間的に一様な平衡の近くの解である。衝突や境界、空間的に非一様な平衡を含む場合は抄録に記載がない。証明の詳細と仮定は本文を読めておらず未確認。", "fun": "プラズマの中の電気の波は、粒子どうしがぶつからなくても、時間がたつと消えていくことがある。ところが消えたはずの波が、あとから「こだま」のように現れる現象も知られている。こだまが次々に起きたら、波はいつまでも消えないのではないか。この総説は、無限個の波が相互作用するこだまの解を作っても、長い時間のあとには減衰が起きることを示した研究をまとめている。", "unverified": "掲載誌の本文を取得できず、定理の正確な主張と仮定、証明の筋道は未確認。"}}, {"id": "jr11", "rank": 11, "headline": "橋の支承変位を逐次更新のガウス過程で予測", "title": "Online Prediction and Early Safety Warning for Bridge Bearings Based on Streaming Sparse Variational Gaussian Process Regression", "url": "https://doi.org/10.1061/ajrua6.rueng-2036", "authors": "Bachao Zhang ほか", "venue": "ASCE-ASME Journal of Risk and Uncertainty in Engineering Systems Part A Civil Engineering", "date": "2026-11-11", "citescore": 4.7, "citescore_year": "2025", "apa": "Zhang, B., Ma, Y., Chen, W., & Wang, L. (2027). Online Prediction and Early Safety Warning for Bridge Bearings Based on Streaming Sparse Variational Gaussian Process Regression. ASCE-ASME Journal of Risk and Uncertainty in Engineering Systems, Part A: Civil Engineering, 13(1). https://doi.org/10.1061/ajrua6.rueng-2036", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "橋の支承の変位を、橋の温度から逐次的に予測し、予測誤差から性能の変化を早めに警報するオンラインの枠組みを、ストリーミング型のスパース変分ガウス過程回帰で作った（抄録）。", "p2": "温度と変位の関係を使う既存のオフラインの回帰モデルは、材料の経年変化や使用環境の変化のため、予測精度が低くなる。新しい監視データでモデルを更新する仕組みが必要だった（抄録）。", "p3": "支承の変位と橋の温度の、時間とともに変わる関係を、誘導点と変分推論を使うスパースなガウス過程回帰で表す。区間ごとの増分更新の方針で、新しく得た監視データからハイパーパラメータと事後分布を更新する。予測誤差にもとづく早期警報と、警報をきっかけにしたモデルの適応の仕組みで、異常データによるモデルの汚染を抑える（抄録）。背景：誘導点は、データ全体を代表させる少数の点。", "p4": "供用中の吊橋の長期の監視データで有効性を検証した。評価は、温度による支承変位の確率分布の予測精度と、長期にわたる精度の維持、性能劣化の識別である（抄録）。", "p5": "モデルは、橋の温度による支承変位の確率分布を正確に予測し、温度と変位の変動のもとでパラメータを更新して長期の予測精度を保った。早期警報の方法は、大きさの異なる支承の性能劣化の識別と、モデルの適応的な更新を可能にした（抄録）。数値は抄録に記載がない。", "p6": "1つの吊橋のデータでの検証である。支承の劣化が実際に確認された事例か、模擬的に与えた変化かは抄録からは分からない。温度以外の要因の扱い、誤警報の率は本文を読めておらず未確認。", "fun": "橋は温度によって伸び縮みし、その動きを受け止めるのが支承である。温度から支承の動きを予測できれば、予測と実際のずれを異常の合図にできる。難しいのは、橋や環境が時間とともに変わるので、昔のデータで作った予測式がだんだん合わなくなることだ。この研究は、届くデータで予測式を更新し続けながら、異常なデータで予測式そのものが狂わないようにする仕組みを加えた。", "unverified": "掲載誌の本文を取得できず、予測誤差の数値、警報の閾値の決め方、更新の区間の長さは未確認。"}}, {"id": "jr12", "rank": 12, "headline": "打撃音だけで固有振動数と減衰比を同定", "title": "Peak-picking method for identifying natural frequencies and damping ratios from free vibration measurements", "url": "https://doi.org/10.1051/aacus/2026014", "authors": "Frédéric Ablitzer", "venue": "HAL (ART) Acta Acustica", "date": "2026-11-12", "citescore": 2.9, "citescore_year": "2025", "apa": "Ablitzer, F. (2026). Peak-picking method for identifying natural frequencies and damping ratios from free vibration measurements. Acta Acustica, 10, 18. https://doi.org/10.1051/aacus/2026014", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（HALに著者版の登録あり）。本文は未取得", "preprint": false, "p1": "衝撃で励起した構造の自由振動の応答だけから、加振力を測らずに、固有振動数と減衰比を同定する方法を提案した。構造が放射する音の計測からも取り出せる（抄録）。", "p2": "加振力の計測を必要とせず、専門家でない利用者にも扱えて、計測雑音やモードの重なりに対して頑健な同定の方法が求められていた（抄録の記述にもとづく）。", "p3": "スペクトルの山を選ぶピークピッキングの概念的な単純さと、信号を複数の成分で表す時間領域のモデルの頑健さを組み合わせる。利用者が選んだスペクトルの山をもとに、モード成分を反復的に同定する。意図的に人が関与する方式で、グラフィカルな画面が、時間領域と周波数領域の両方で再構成した信号の質をすぐに示す（抄録）。", "p4": "実験での適用例で、衝撃加振のあとに構造が放射する音という、簡単で非侵襲の計測から同定できることを示した。計測雑音とモードの重なりへの頑健性を評価し、従来の周波数応答関数（FRF）にもとづくモード同定の結果と比べた（抄録）。", "p5": "固有振動数と減衰比は、構造が放射する音の計測から取り出せた。同定されたパラメータは、従来のFRFにもとづく同定で得られた値と整合した（抄録）。数値は抄録に記載がない。", "p6": "利用者がスペクトルの山を選ぶ必要があり、完全に自動化された方法ではない。対象とした構造の種類と、適用の限界は抄録に記載がなく、本文を読めていないため未確認。", "fun": "物をたたくと音が鳴り、やがて消える。音の高さは固有の振動数を、消える速さは減衰を表している。この研究は、たたいた力を測らなくても、鳴った音を測るだけでその二つを取り出す方法を作った。人が周波数の山を選び、計算機がその成分を順に同定していく。画面で元の信号との合い具合をすぐ確かめられるので、専門家でなくても使えることをねらっている。", "unverified": "本文を取得しておらず、時間領域モデルの式、実験の対象、同定値の誤差は未確認。"}}, {"id": "jr13", "rank": 13, "headline": "LLMで測ったAI導入は非テック企業の価値を高める", "title": "Not Just for Tech Giants: The Economic Payoff of LLM‐Measured AI Adoption in Nontechnology Firms", "url": "https://doi.org/10.1111/eufm.70106", "authors": "Man Wang ほか", "venue": "European Financial Management", "date": "2026-11-12", "sjr": 1.188, "citescore": 6.8, "citescore_year": "2025", "apa": "Wang, M., Wu, H., & Wu, X. (2026). Not Just for Tech Giants: The Economic Payoff of LLM‐Measured AI Adoption in Nontechnology Firms. European Financial Management. https://doi.org/10.1111/eufm.70106", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "出版社サイトの本文は取得できず、Crossrefに登録された抄録を使用", "preprint": false, "p1": "中国語の大規模言語モデルERNIEを使って企業レベルのAI導入の指標を作り、AIの導入がテクノロジー企業以外の企業の価値を高めることを示した（抄録）。", "p2": "AIをめぐる議論はテクノロジー企業に偏っており、伝統的な産業でのAIの経済的な意味は十分に調べられていなかった（抄録）。", "p3": "ERNIEを使って企業レベルのAI導入の指標を作る。この指標と企業価値の関係を推定し、生産性、イノベーションの成果、資金調達の条件を経路として調べる（抄録）。指標のもとになる資料と作り方の詳細は抄録に記載がない。", "p4": "仕組みの分析に加え、動的能力、情報環境、競争上の地位、規模、所有形態、地域による効果の違いを調べた。標本の期間と規模、識別の方法は抄録に記載がない（抄録）。", "p5": "AIの導入は非テクノロジー企業の価値を有意に高めた。経路として、生産性、イノベーションの成果、資金調達の条件の改善が示された。効果は、動的能力が高く、情報環境が良好で、競争上の地位が強く、規模が大きく、民間所有で、東部に立地する企業で大きかった（
