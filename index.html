できるようにした（抄録、§8）。", "p2": "平均の因果効果は周辺分布だけで決まるが、個人の因果効果の差（ICDE）や比（ICRE）のばらつきや分布は、同時には観測できない(Y1,Y0)の同時分布に依存するため、識別が難しかった（§3）。背景：潜在結果は、同じ人が処置を受けた場合と受けない場合の結果で、片方しか観測できない。", "p3": "Y1とY0が同じ順に並ぶ（共単調）か逆順に並ぶ（反共単調）と仮定すると、同時期待値は周辺分布で表せることを示した（定理1–2）。仮定なしでは2つの関数のクラスで鋭い上下限を導き、ICDEの偶数次のモーメントでより狭い限界、ICREのモーメントで新しい限界を得た（定理3、系1–5）。具体例：g=(Y1−Y0)²とすれば個人の効果の2次モーメントになる（§3.1）。共単調性は既存の識別の仮定より弱い（命題1–5）。", "p4": "シミュレーションで標本の大きさ100と1,000の有限標本の性質を確かめ、既存のモンテカルロ積分による限界や、最適輸送による数値的な推定（COT）と比べ、コレステロール低下のデータとLalondeのデータに適用した（§7、表2–7）。", "p5": "推定量はN=100でおおむね良く、N=1,000で安定し、偶数次のモーメントでは既存手法より狭い限界を与え、閉じた形のため最適輸送の推定より大幅に速かった（§7）。2つの実データでは、処置効果の大きな異質性と裾のリスクが見られた（§7）。", "p6": "著者は、共単調性・反共単調性は観測データからは一般に検定できず、鋭い限界は特定の関数のクラスに限られ、高次元の共変量のもとでの効率的な推定は今後の課題とする（§8）。解釈：実データでの大きな異質性という結論が、どの仮定にどれだけ依存するかは付録で確かめる必要がある。", "fun": "薬の効き目を調べるとき、普通は「平均でどれだけ効いたか」を見ますが、本当は大きく効く人も逆効果の人もいるかもしれません。ところが同じ人について「飲んだ場合」と「飲まなかった場合」を両方見ることはできません。この研究は、2つの世界の結果の並び方について弱い仮定を置くか、ありうる範囲を絞り込むことで、効き目のばらつきに迫る方法を示しました。見えない組み合わせを数学で囲い込む点が面白いところです。", "unverified": "実データでの分散・歪度・尖度の具体的な推定値（付録E）は確認していない。"}}, {"id": "pn05", "rank": 5, "field": "経済学", "headline": "混雑する選択肢の離散選択で均衡と厚生を識別", "title": "Discrete Choice under Congestion: Equilibrium and Welfare", "url": "https://arxiv.org/abs/2611.07787", "authors": "Debopam Bhattacharya ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Bhattacharya, D., & Makiranta, M. (2026). Discrete Choice under Congestion: Equilibrium and Welfare (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07787", "why": "選ぶ人が増えると価値が下がる選択肢がある場合に、効用の関数形や異質性に制約を置かずに均衡の存在と一意性を示し、ミクロデータから厚生効果を半パラメトリックに識別する枠組みを作った。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、ケンブリッジの出願制度§3、データと結果§5、今後の研究§7）を読んだ", "preprint": true, "p1": "選ぶ人が増えるとその選択肢の利得が下がる「混雑」のある離散選択で、効用の関数形や選好の異質性に制約を置かずに均衡の存在と一意性を示し、ミクロデータから一部の介入の厚生効果を半パラメトリックに識別する枠組みを作った（抄録）。", "p2": "混雑する選択肢の外部性を抑える介入は、需要を他の選択肢に移して別の混雑を生み、選好に基づく振り分けも崩すため、全体の厚生効果は理論的にあいまいだった（抄録、§2.1）。", "p3": "合格の確率が各カレッジの定員に対する出願数で決まるケンブリッジ大学の学部入試を経験的な対応物とし、線形の指数構造のもとで出願の選択データから効用の差と厚生効果を識別する（§3–4）。具体例：出願できるカレッジは1つだけで、人気のカレッジほど合格確率が下がる（§3）。", "p4": "2013〜2017年の英国在住の出願者25,325人（男性16,394人、女性8,931人）の6科目の行政個票とカレッジの特徴（家賃、規模、基金など）を使い、中央での無作為割当と、人気のキングズとトリニティの週家賃を100ポンド上げる介入の厚生を、週家賃で表した補償変分で評価した（§5）。", "p5": "無作為割当は全員の厚生を下げ、損失の中央値は男性94.84ポンド、女性61.54ポンドだった。選択の自由がなくなる一方、割り当てられる確率の上昇がそこでの合格確率の低下で正確に相殺されるためである（§5.1）。家賃の引き上げは得をする人と損をする人を生み、中央値では男性が損、女性が得をした（抄録、§5.2）。", "p6": "識別できるのは一部の介入の厚生効果で、すべての介入ではないと著者は述べる（抄録、§4.1）。解釈：100ポンドの家賃引き上げは意図的に標本外の大きさで、推定の外挿に依存する。行動上の摩擦を加えた拡張（§6）の結果は確認していない。", "fun": "人気の大学やカレッジほど出願者が集まって合格しにくくなるので、「行きたい所」と「受かりやすい所」の駆け引きが生まれます。この研究はケンブリッジ大学の出願データから、くじ引きで配属を決めると誰も得をしないことを示しました。選ぶ自由がなくなるのに、混雑はちょうど打ち消し合って減らないからです。混雑と選ぶ自由の関係を数式で見抜いた点が面白いところです。", "unverified": "行動上の摩擦を加えた分析と情報提供の効果の結果（§6）は確認していない。"}}, {"id": "pn06", "rank": 6, "field": "機械学習", "headline": "ベンチマークの縮約は無作為抽出でほぼ足りる", "title": "Random Is Almost Enough? Stable and Low-Cost Benchmark Compression via BestRand", "url": "https://arxiv.org/abs/2611.00883", "authors": "George Ling ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-06", "apa": "Ling, G., Zhong, S., Yang, L., Yang, H., Li, N., & Huang, Z. (2026). Random Is Almost Enough? Stable and Low-Cost Benchmark Compression via BestRand (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.00883", "why": "部分集合から全体の得点を推定する誤差の分布を解析的に近似し、無作為抽出でも多くは誤差が小さい一方、まれな大きな誤差が不安定さの原因になることを示して、安定で低コストの縮約法を提案した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（手法§2、実験§3、限界の付録D.1）を読んだ", "preprint": true, "p1": "ベンチマークの一部の問題だけで全体の得点を推定する「ベンチマークの縮約」で、無作為抽出の誤差の分布を解析的に近似して裾の長さが不安定さの原因であることを示し、その裾を抑える安価な方法BestRandを提案した（抄録、§2）。", "p2": "大規模モデルの評価は時間と費用がかかるため部分集合での評価が使われるが、どの程度正確でなぜ不安定になるのかの理論的な理解がなく、既存の方法は構築の費用が高かった（序論、抄録）。", "p3": "部分集合からの推定誤差の分布を多変量正規近似で導き、無作為抽出の多くは誤差が小さいが、まれな大誤差があることを示した（§2.1、定理2.1）。BestRandは、複数の無作為な候補の部分集合を作り、少数の安価な探針モデルの得点がプール全体の平均に最も近い候補を選ぶ。追加の費用は小さなプールへの一度の探針の実行だけである（§2.2）。", "p4": "テキスト44、マルチモーダル16、エージェント10の計70のベンチマークで、保持率2〜50%の6段階について、無作為抽出、SparseEval、Anchor Points、TinyBenchmarks、ZipBenchなど6つの基準と、推定誤差、大誤差の危険、構築費用、分布外の推定誤差で比べた（§3）。", "p5": "競合手法に比べ、BestRandは大誤差の危険を平均50.2%、推定誤差を16.4%減らし、構築費用は51.3%で済んだ。得点の範囲・モデルの系統・時期のずれのもとでの分布外の推定誤差も平均21.8%減らした（抄録）。不安定さは現代の基盤モデルに固有で、評価するモデルを増やしても残った（抄録）。", "p6": "著者は、推定誤差はゼロにはならないため最終的な評価では全体での結果の報告を勧め、探針モデルの推論の費用もゼロではないとする（付録D.1）。解釈：探針モデルが評価したいモデルと大きく異なる場合の頑健性は確認していない。", "fun": "テストの問題が多すぎて全部解かせるのが大変なとき、一部だけ解かせて全体の点数を予想したくなります。この研究は、でたらめに選んだ問題でもたいていはうまく予想できるが、まれに大外れする組み合わせがあることを数式で示しました。そこで候補をいくつか選んで「試し受験」させ、一番まともな組を使うだけで大外れを半分に減らしました。単純な工夫で信頼性を上げた点が面白いところです。", "unverified": "探針モデルの数や選び方への感度の詳細は確認しきれていない。"}}, {"id": "pn07", "rank": 7, "field": "統計学", "headline": "変化点の位置に分布によらない信頼区間を付ける", "title": "Changepoint localization via nested exchangeability tests: from point estimates to confidence intervals", "url": "https://arxiv.org/abs/2611.07399", "authors": "Rohan Hore ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Hore, R., & Ramdas, A. (2026). Changepoint localization via nested exchangeability tests: from point estimates to confidence intervals (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07399", "why": "任意の推定量が示した変化点の位置に、入れ子の窓での交換可能性の検定で有限標本の被覆を保証する信頼区間を与え、並べ替え検定の回数も対数オーダーに抑えた。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、手法§2の概要、実験§4、考察§6と図表キャプション）を読んだ", "preprint": true, "p1": "1つの変化点を持つ系列で、任意の方法で得た変化点の推定値のまわりに、分布によらず有限標本で被覆を保証する信頼区間を作る方法CLONEを提案した（抄録）。", "p2": "変化点の推定値の不確かさを分布を仮定せずに表す既存の方法は、候補の位置ごとに検定するため計算が重かった（§1.2–1.3、図1）。", "p3": "推定値を中心とする窓の半径を段階的に（各段階で半分に）縮めながら、窓の中の観測が交換可能かを並べ替え検定で調べ、棄却が続く間は窓を縮める。必要な検定はO(log n)回で、最適な窓ごとの得点（尤度比）と実用的な得点の作り方も示した（§2–3）。背景：交換可能性は、観測の順番を入れ替えても同時分布が変わらない性質で、窓の中に変化点がなければ成り立つ。", "p4": "n=500・変化点250の正規分布の平均シフト（変化の強さδ=0.1〜1、各200系列）、DomainNetの画像（実写からスケッチへ、n=800）、SST-2の文章の感情の変化で、信頼水準90%、並べ替え1,000回のp値を使い、経験的な被覆率と区間の幅を評価した（§4）。", "p5": "正規分布の例で平均の経験的被覆率は90%以上を保ち、変化が強いほど区間は狭くなった（§4.1、図3）。理論面では、穏やかな仮定のもとで正規化した区間の長さが漸近的に0に近づき、区間の大きさは情報理論的な下限の速さを達成する（抄録、§6）。", "p6": "著者は、複数の変化点やより一般的な時間的依存への拡張を今後の課題とする（§6）。解釈：変化の前後でそれぞれ交換可能という仮定は、自己相関の強い時系列では成り立ちにくい。", "fun": "長い記録の途中で「ここで何かが変わった」と推定できても、その位置がどれほど確かかは別の問題です。この研究は、推定した位置を中心に窓を少しずつ狭めながら「この窓の中は並べ替えても同じに見えるか」を確かめ、変化点がありそうな範囲を確率の保証つきで示す方法を作りました。データの分布を何も仮定しないのに保証が得られる点が面白いところです。", "unverified": "画像と文章の実験での区間の幅の具体的な値は確認していない。"}}, {"id": "pn08", "rank": 8, "field": "因果推論", "headline": "連続時間の確率過程に操作変数法を拡張", "title": "Instrumental Variables in Continuous-Time Stochastic Processes", "url": "https://arxiv.org/abs/2611.07674", "authors": "Lars Pennig ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Pennig, L., Mogensen, S. W., & Kilbertus, N. (2026). Instrumental Variables in Continuous-Time Stochastic Processes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07674", "why": "確率微分方程式で表される定常過程に、過程そのものを操作変数とする枠組みを作り、ドリフトの水準で因果効果を定めて、経路を使ったモーメント条件を導いた。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、実験§7と図表キャプション）を読んだ", "preprint": true, "p1": "確率微分方程式（SDE）で表される定常な連続時間の確率過程に、過程そのものを操作変数とする操作変数（IV）法を拡張し、観測されない交絡があっても因果効果を識別・推定できる枠組みを示した（抄録）。", "p2": "IV法は静的・離散時間の設定では確立しているが、地球システム・医療・マクロ経済などの連続時間の動的なシステムには拡張されていなかった。離散化したモデルにIVの仮定を置くと、無限小の水準の構造と食い違って偏る（§1、付録B）。背景：操作変数は、処置に影響し、交絡とは独立で、結果には処置を通じてのみ影響する変数。", "p3": "因果効果と構造の疎性をドリフト（SDEの決定論的な部分）の無限小の水準で定め、経路を値にとる操作変数からモーメント条件を導いた。線形のオルンシュタイン–ウーレンベック（OU）過程では条件が簡単になり、非線形の場合はシグネチャ・カーネルや小さなMLPでドリフトを表す（§4–6）。", "p4": "不規則な時点で観測した交絡のあるOU過程で、交絡を無視した最尤推定（MLE）と、離散時間のVAR(1)によるIV推定量と比べ、交絡の強さ、共変量の次元、操作変数と共変量の結びつきの強さを変えてパラメータのRMSEを評価し、2型糖尿病の薬物動態を模した半合成データでインスリン感受性の推定も試した（§7、図2、表1）。", "p5": "交絡が強くなるほどMLEは偏ったが、連続時間のIV推定は安定していた。静的なIVでは因果効果の数だけ操作変数が要るのに対し、1つの操作変数の過程で4次元の因果効果まで推定でき、平均誤差はMLEより小さかったが、次元とともに推定の分散は増えた（§7、図2）。交絡が弱いとIVはMLEより効率が低かった（§7）。", "p6": "著者は、IVは操作変数が説明する変動しか使わないため本質的にMLEより効率が低く、カーネルによる最適化は景観が複雑になると述べる（§7）。解釈：定常性やドリフトの疎性の仮定が現実のデータで成り立つかを確かめる方法は、読んだ範囲では示されていない。", "fun": "血糖とインスリンのように時間とともに変わる量では、見えない別の要因が両方を動かすので、本当の因果関係を見分けるのが難しくなります。この研究は、外から加えるインスリンの投与の計画のような「外からの揺さぶり」を手がかりに、連続的に変わる量の因果の強さを推定する方法を作りました。1本の揺さぶりで何本もの因果をまとめて推定できる点が面白いところです。", "unverified": "糖尿病の半合成データでの推定誤差の具体的な値（表1）は確認していない。"}}, {"id": "pn09", "rank": 9, "field": "経済学", "headline": "考慮集合が見えなくても厚生効果は識別できる", "title": "Unobserved Consideration and Consumer Welfare", "url": "https://arxiv.org/abs/2611.07774", "authors": "Debopam Bhattacharya ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Bhattacharya, D., & Martin, R. J. (2026). Unobserved Consideration and Consumer Welfare (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07774", "why": "消費者が一部の選択肢しか考慮しない場合でも、価格変化の厚生分布が完全に考慮する場合と同じ選択確率の汎関数で表せることを示し、考慮集合と選好が識別できなくても需要と厚生は識別できることを明らかにした。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、厚生の識別と観測同値性§4–5の見出し、例示§6.5）を読んだ", "preprint": true, "p1": "消費者が一部の選択肢しか考慮せず、その考慮集合が観測できない場合でも、考慮集合が安定していれば、価格変化の補償変分の分布全体が、完全な考慮の場合と同じ構造的な選択確率の汎関数で識別できることを示した（抄録、§1）。", "p2": "選ばれなかった商品が魅力がないのか単に見落とされたのかは区別しにくく、考慮集合が分からないと反実仮想の選択確率や消費者余剰の評価が妨げられると考えられてきた（§1）。背景：補償変分は、価格の変化の前と同じ満足を保つのに必要な所得の補償額。", "p3": "所得効果に制限を置かず、任意の次元の選好の異質性と選好と考慮の任意の相関を許すクラスで、安定した限定考慮のモデルはすべて、構造的な需要と金銭的な補償を保つ完全考慮の表現を持つこと（考慮から外れた選択肢に有限の不利な価値を割り当てる構成）を示した（§1、§4–5）。具体例：燃費の良い新車が売れないのが評価の低さか認知の欠如かを区別しなくても、価格を変える税や補助金の厚生分布は識別できる（§1）。", "p4": "検証は理論的な証明で、等価性が崩れる境界（十分に大きな補助金）、価格上昇で考慮集合が縮む場合の厚生の上下限、考慮の脱落率による較正、数値例を示した（§5.1、§6）。", "p5": "考慮と選好は識別できないままでも、需要と厚生は識別できる（抄録、§5）。価格が上がって考慮集合が縮む場合は、需要と脱落率の上限から厚生分布を限界づけられる（§6.1–6.2）。一方、需要と脱落率が完全に分かっていても、小さな脱落が大きな厚生の損失を隠しうることを例で示した（§6.5、例1）。", "p6": "結果は考慮集合が安定であることが前提で、縮む場合は点識別ではなく限界にとどまる（§6）。解釈：理論の結果であり、実際の需要推定で必要な価格と所得の組み合わせのもとで構造的な需要を識別できるかが実務上の課題となる。", "fun": "店で売れない商品は「人気がない」のか「そもそも気づかれていない」のか、外から見分けるのは難しいものです。この論文は、気づかれ方が変わらない限り、その区別がつかなくても、値上げや補助金で人々がどれだけ得や損をするかは正しく計算できることを証明しました。分からないことがあっても知りたい答えには届く場合がある、という点が面白いところです。", "unverified": "実データへの適用例の有無は確認していない（数値例のみ確認）。"}}, {"id": "pn10", "rank": 10, "field": "社会学", "headline": "メキシコの性暴力警報に暴力を減らした証拠なし", "title": "Mexico’s Gender Violence Alert and Violence Against Women and Girls: Causal Evidence from a Difference-in-Differences Analysis", "url": "https://doi.org/10.31235/osf.io/8n6se", "authors": "Finja Mailin Schneider", "venue": "SocArXiv", "date": "2026-11-06", "apa": "Schneider, F. M. (2026). Mexico’s Gender Violence Alert and Violence Against Women and Girls: Causal Evidence from a Difference-in-Differences Analysis. https://doi.org/10.31235/osf.io/8n6se", "why": "自治体ごとに時期の異なる警報の発令を差の差法で評価し、女性の殺害、自己申告の暴力、通報、意識のいずれにも明確な効果がないことを示した。", "explain": {"basis": "本文", "basis_note": "SocArXivのPDF本文（データと識別§4、結果§5.1と§5.4、考察§6、結論§7と図表キャプション）を読んだ", "preprint": true, "p1": "メキシコの性暴力警報（AVGM）の発令が女性と少女への暴力を減らしたかを、時期の異なる発令を利用した差の差法で自治体単位に評価し、女性殺害・自己申告の暴力・通報・中絶への意識のいずれにも明確な効果がないことを示した（抄録、§7）。", "p2": "AVGMは女性への暴力に対するメキシコの主要な制度的対応だが、その効果についての因果的な証拠は限られていた（抄録、§2）。", "p3": "2010〜2023年の複数の資料を2010年の自治体境界にそろえて結合し、警報が完全に有効な期間だけを処置ありとして、Callaway–Sant'Annaの推定量で集団・時点ごとの平均処置効果を求めた（§4.1–4.2）。背景：処置の時期がばらばらのとき、通常の二方向固定効果の推定は偏りうるため、この推定量が使われる。", "p4": "主な結果は女性10万人あたりの月次の女性殺害率で、調査データによる自己申告の暴力と、中間的な結果として通報行動と中絶への意識（ジェンダー規範の指標）を調べ、イベントスタディ、先住民の自治体別・都市農村別の分析、頑健性の確認と、人権の専門家6人の事前の期待とのベイズ更新を行った（§4–5）。", "p5": "AVGMは月次の女性殺害率を平均0.0314下げる方向だったが統計的に0と区別できず、男性の銃による殺人率を統制しても−0.0339で同様だった（§5.1、表1）。自己申告の暴力・通報・中絶への意識にも検出できる効果はなく、ベイズ更新は強い有益な効果への確信を下げる方向だった（§5.2–5.4、§7）。", "p6": "著者は、測定・実施・理論の面から帰無の結果の説明を検討し、設計上の大きな問題は見られないとしつつ、測定や実施の不十分さの可能性を論じる（§6）。ベイズ更新の事前分布は便宜的に選んだ専門家6人に基づく（§5.4）。解釈：帰無の結果は効果がないことの証明ではなく、検出力の限界も考える必要がある。", "fun": "女性への暴力が深刻な地域に「警報」を出して対策を強めれば、被害は減りそうに思えます。ところがメキシコの十数年分のデータを丁寧に比べると、警報の後に女性の殺害や暴力が減ったという確かな証拠は見つかりませんでした。良い政策に見えても、効いているかは確かめないと分からないという点が大事で面白いところです。", "unverified": "発令時期などによる異質性の分析の具体的な数値は確認していない。"}}, {"id": "pn11", "rank": 11, "field": "機械学習", "headline": "大きなLMほど圧縮の損傷を補いにくい", "title": "When Bigger Becomes Brittle: Why Compression Hurts More as Language Models Scale", "url": "https://arxiv.org/abs/2611.07891", "authors": "Gautam Gupta ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Gupta, G., Kukreja, D., Kumar, U., Mittal, A., Dabas, D., Sah, K., Cambria, E., Shah, R. R., Wang, Z., & Anand, A. (2026). When Bigger Becomes Brittle: Why Compression Hurts More as Language Models Scale (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07891", "why": "文脈内検索を担う注意ヘッドの除去による損失を、損傷とネットワークの補償に正確に分解し、ベンチマークの得点では見えない補償の働きがモデルの規模でどう変わるかを示した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（方法§2、規模の分析§3.2の一部、結論§4と限界の節）を読んだ", "preprint": true, "p1": "言語モデルの圧縮（量子化・枝刈り）の害を、内部の損傷とネットワークの残りによる補償に正確に分解し、同じ大きさの損傷でも小さいモデルは大部分を補うが、大きいモデルは大部分が出力に残ることを示した（抄録、§4）。", "p2": "圧縮の影響はふつうベンチマークの得点で報告されるが、得点は出力に残った損失しか記録せず、内部の損傷と補償を分けられない。その釣り合いがモデルの規模でどう変わるかも分かっていなかった（抄録）。", "p3": "文脈内の検索（間接目的語の特定、IOI課題）を担う少数の注意ヘッドを取り除いたときの期待損失を、コピー抑制の解除、バックアップの応答、最終正規化で回復される部分と、出力に届く部分に正確に分解し、モデルの大きさの間で比べた（§3）。背景：コピー抑制ヘッドは、文脈中の語をそのまま繰り返しすぎないよう抑える注意ヘッド。", "p4": "GPT-2 XLとLlama 3.1 8Bで単一モデルの分析を行い、同じデータ・同じ順序で学習したPythiaの410M〜12Bの6モデルで規模の比較を行い（OPTでも確認）、1,000の探索用と2,000の保留用のIOIプロンプトで、検索ヘッドの4ビット量子化と構造的な枝刈りも試した（§2、§3.2）。", "p5": "同程度の損傷に対し、小さいモデルは損失の大部分を回復したが、大きいモデルは大部分を保持した（抄録）。検索ヘッドの4ビット量子化でも、損傷に対する出力の害の割合はPythiaで410Mの0.55から12Bの0.91へとおおむね上がった（§3.2）。小さいモデルでほぼ無害な圧縮が大きいモデルでは高くつきうる（抄録）。", "p6": "著者は、量子化と枝刈りを浮動小数点の推論で模した実験で、コピー抑制ヘッドは保たれているため、それらも損傷する場合や実際の配備用のカーネルでは補償が異なりうるとする（限界の節）。解釈：分析は特定の検索能力と回路に限られ、他の能力への一般化は今後の検証が要る。", "fun": "AIを軽くするために計算の精度を落とす「圧縮」は、小さなAIではほとんど影響がないように見えます。ところがこの研究は、小さなAIは壊れた部分を他の部品が上手に補っているだけで、大きなAIほどその補いが効かず、損傷がそのまま答えに出てしまうことを示しました。大きいほど丈夫とは限らないという点が面白いところです。", "unverified": "OPTでの確認の数値と、枝刈りの詳細な結果（付録D.2）は確認していない。"}}, {"id": "pn12", "rank": 12, "field": "統計学", "headline": "p値を選択用と推論用に分けて選択後の推論", "title": "Inference after selection on randomized p-values", "url": "https://arxiv.org/abs/2611.07459", "authors": "Ronan Perry ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Perry, R., & Witten, D. (2026). Inference after selection on randomized p-values (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07459", "why": "p値を帰無仮説の下で独立な2つの成分に分ける手順で、p値だけから選択後の条件付きの第1種過誤を制御する検定と信頼区間を作り、出版バイアスや勝者の呪いへの応用を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、p値の分割§2.1、遺伝子関連解析への応用§6、考察§7）を読んだ", "preprint": true, "p1": "多数の仮説のp値から有望なものを選んだ後の推論を、元のデータなしにp値だけで行う方法を示した。p値を帰無仮説の下で独立な2つの成分（選択用と推論用）に分け、選択の後の条件付きの第1種過誤を制御する検定・信頼区間・推定量を作った（抄録、§7）。", "p2": "有意なものだけを報告するファイル・ドロワー問題や、最小のp値を選ぶ「勝者の呪い」では選択後の推論が偏るが、既存の選択的推論の多くは生データへのアクセスを必要とした（§1、§7）。", "p3": "データの分割を一般化したデータ・シニング、フィッション、カービングの考え方をp値に移し、帰無仮説の下で一様なp値を、互いに独立で一様な2つのp値に分け、両者から元のp値を再構成できるようにする（§2、補題1）。具体例：p値が閾値α以下のときだけ推論するなら、片方の成分で選び、もう片方の成分で条件付きに検定する（例1）。依存するp値への拡張も示した（§3）。", "p4": "ファイル・ドロワー問題、勝者の呪い、逐次検定の設定で、既存のランダム化した手法と検出力と被覆を比べ、英国バイオバンクの2型糖尿病の遺伝子関連解析の公開p値（5,021,046個）に適用した（§5–6）。", "p5": "提案法は選択後の条件付きの第1種過誤を名目水準に制御し、条件付きの被覆を達成する信頼区間と推定量を与え、理論と実験の両面で既存のランダム化した手法より有利だった（抄録、§5）。ゲノムワイド関連解析では、要約統計だけで選択による効果量の過大評価の補正に使えることを示した（§6）。", "p6": "著者は、ランダム化の量と選択の厳しさの選び方に課題があり、対立仮説の下の検出力を高める別のランダム化の方法や理論的な保証は今後の研究が必要とする（§7）。解釈：p値の情報の一部を選択に使うため、元のp値を全部使う場合より検出力は下がりうる。", "fun": "たくさんの実験の中から「効果がありそう」なものだけを選んで詳しく調べると、選んだという事実のせいで効果を大きく見積もりがちです。この研究は、一つのp値を、くじを使って「選ぶための半分」と「確かめるための半分」に分ける方法を考えました。元のデータがなくても、公表されたp値だけで公正に確かめ直せる点が面白いところです。", "unverified": "遺伝子関連解析での補正の具体的な数値は確認していない。"}}, {"id": "pn13", "rank": 13, "field": "開発経済学", "headline": "中国資本の排除はリチウムの供給を細らせる", "title": "Cross-Border Ownership and Input Access: Evidence from the Lithium Supply Chain", "url": "https://arxiv.org/abs/2611.08430", "authors": "Kei Irizawa", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Irizawa, K. (2026). Cross-Border Ownership and Input Access: Evidence from the Lithium Supply Chain (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08430", "why": "世界の鉱山と精錬所のデータで国境を越えた所有の効果を推定するモデルを作り、中国資本の売却や鉱石の輸出禁止といった安全保障上の政策の供給への影響を評価した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、産業構造§2.1、推定と当てはまり§6、反実仮想の要約、結論§8と図表キャプション）を読んだ", "preprint": true, "p1": "世界の鉱山と精錬所のデータで、国境を越えた所有（とくに中国資本の海外の権益）がリチウムの鉱石の調達・生産・価格をどう形づくるかを構造モデルで推定し、中国資本の売却と中国への鉱石の輸出禁止の効果を反実仮想で比べた（抄録、§8）。", "p2": "重要鉱物の調達の安全保障への懸念から所有や貿易の制限が議論されているが、所有が調達上の有利さ、鉱山のスポット販売の誘因、競合する生産者の利益への関心を通じて供給にどう効くかは定量化されていなかった（§1）。背景：2024年に中国は精錬の72%、採掘の21%を占め、持分で見ると中国の所有者が世界の採掘の38%を占める（§2.1）。", "p3": "所有の持分から、提携による調達の有利さと、他社の利益を考慮する誘因という2つの経路を持つ生産者の目的関数を作り、硬岩の鉱山・精錬所とかん水の生産者の生産と調達、市場の均衡をモデル化し、需要と費用の式をGMMで同時に推定した（§4–6）。", "p4": "2015〜2024年の鉱山・精錬所のパネルで推定し、139鉱山年の産出の当てはまりを確かめたうえで、能力と参入を固定し、観測された持分のもとでの売却、中国の精錬権益を統合した仮想の場合の売却、鉱石の対中輸出禁止を比べた（§3、§6–7）。", "p5": "鉱山産出の予測のR²は0.851で、総産出は17.25%過大に予測された（§6.2）。売却ではスポットの鉱石購入が20.93%増え鉱石価格が上がったが、リチウムの産出は0.06%しか増えず、権益を統合した仮想では2.22%増えた。輸出禁止は世界のリチウム供給を25.36%減らし価格を77.19%上げ、中国外の生産は中国の失った産出の41.0%しか補わなかった（序論）。", "p6": "反実仮想は生産能力と参入を固定し、地政学的な介入を所与とした評価である（§8）。解釈：新たな精錬能力の建設など長期の調整を含めると、輸出禁止の供給への影響は小さくなりうる。", "fun": "電池に欠かせないリチウムは、掘る国と精錬する国が違うことが多く、中国の会社が海外の鉱山の株を持っていることも少なくありません。この研究は、その株を手放させたり、中国への鉱石の輸出を止めたりした場合に何が起きるかを計算しました。輸出を止めると、中国以外では鉱石が安くなるのに、世界全体ではリチウムが足りなくなって値段が大きく上がるという皮肉な結果が面白いところです。", "unverified": "推定したパラメータの不確かさが反実仮想の結果に与える幅は確認していない。"}}, {"id": "pn14", "rank": 14, "field": "因果推論", "headline": "パネルの二重機械学習の識別と仕様を検証", "title": "Double Machine Learning for Panel Data: Identification, Specification, and a Bank Regulation Effect", "url": "https://arxiv.org/abs/2611.07249", "authors": "Ali Habibnia ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Habibnia, A., Maasoumi, E., & Shah, G. (2026). Double Machine Learning for Panel Data: Identification, Specification, and a Bank Regulation Effect (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07249", "why": "2018年の米国の銀行規制を例に、パネルデータでの二重機械学習の識別条件と変換による仕様の偏りを整理し、推定値の頑健性を検討した。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（序論、パネルの仕様§3の見出し、実証の解釈§6.7と図1のキャプション）を読んだ", "preprint": true, "p1": "パネルデータでの二重/脱偏の機械学習（DML）の推定が、固定効果・一階差分・相関ランダム効果のどの変換を使うかで、必要な制約や推定の対象そのものが変わることを整理し、2018年の米国の銀行規制緩和を例に推定値の頑健性と因果的な解釈を検討した（抄録、§1）。", "p2": "パネルのDMLでは、変換の選び方によって局外関数の形と識別の条件が変わるが、推定量の間で結果がそろうことが何を示し、どの条件で因果的に解釈できるかは明確でなかった（§1）。背景：DMLは、結果と処置を機械学習で予測した残差どうしを回帰し、局外関数の推定誤差の一次の影響を除く方法。", "p3": "処置の時期が共通の設定で、識別と局外関数への制約を整理し、「群内」と「一階差分」のスコアの銀行単位の正確な表現を導き、シミュレーションで変換による仕様の偏りと、重なり（overlap）が弱い場合の推論を評価した（§3–5）。", "p4": "2015年第2四半期〜2020年第1四半期の20四半期、銀行持株会社91社で、資産500億〜2,500億ドルの銀行を100億〜500億ドルの銀行と比べ、リスク加重資産の四半期の成長率を、4つの機械学習器と二重に頑健なATTの比較で推定した（§1、§6）。両群とも規制緩和を受けたため、推定されるのは規制への露出の差の効果である（§1）。", "p5": "元の線形の仕様は規模群の正の係数を再現し、群内平均を除いたフォレストの推定も近かったが、その大きさは分類の基準日、影響の大きい資産の変化、変換の順序、過去の成長の条件づけ、結果の作り方に敏感だった（§6.7）。過去の成長で調整すると推定は小さくなり、二重に頑健な推定は傾向スコアと集中した重みに依存した（抄録）。", "p6": "著者は、利用できる証拠ではどの仕様が反実仮想の成長経路を最もよく表すかを決められず、イベントスタディは不正確で事前の傾向の診断に限界があり、2020年第1四半期の感染症の影響の差も排除できないとする（§6.7）。結果は規制緩和全体の効果ではない（§6.7）。", "fun": "機械学習を使った因果推論は「柔軟だから仮定に頼らない」と思われがちです。ところがこの研究は、銀行規制の例で、データの前処理の順番や比べる時期の選び方しだいで結論の大きさが変わることを丁寧に示しました。道具がどれだけ賢くても、何と何を比べているかという設計が答えを決めるという点が面白いところです。", "unverified": "シミュレーションでの偏りの大きさと、各仕様の推定値の具体的な数値は確認していない。"}}, {"id": "pn15", "rank": 15, "field": "機械学習", "headline": "視覚的な計画の座標を一括で生成して高速化", "title": "VFlash: Fast, Accurate Visual Planning via Flash Primitive Decoding", "url": "https://arxiv.org/abs/2611.08449", "authors": "Yu-Cheng Chou ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-06", "apa": "Chou, Y.-C., Wang, S., Huang, J., Huang, C.-P., Yang, C.-A., Fan, X., Wang, J., Li, Z., Kuang, Y., Zheng, R., Bjorck, J., Liu, S., Su, H., Badki, A., Zhang, L., Yuille, A., Fan, L. \"J., Kautz, J., & Yu, Z. (2026). VFlash: Fast, Accurate Visual Planning via Flash Primitive Decoding (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08449", "why": "視覚言語モデルが点や軌道などの視覚的な計画を座標のトークンごとに生成する遅さを、図形の構造を使って一度に予測する方法で解消した（Hugging Faceで投票75）。", "explain": {"basis": "本文", "basis_note": "arXiv版のHTML本文（手法§2.2、処理速度の分析§3.3、結論§5と抄録の数値）を読んだ", "preprint": true, "p1": "視覚言語モデル（VLM）がロボットや自動運転の視覚的な計画（点・箱・軌道）を座標トークン1つずつ生成する遅さを、図形（プリミティブ）全体を1回の順伝播でまとめて予測する復号法で解消し、精度も上げた（抄録、§5）。", "p2": "自己回帰のVLMは座標を1トークンずつ生成するため、長い軌道のような豊かな予測ほど遅くなり、ロボットや車の組み込み機器での実時間の計画の妨げになっていた（抄録、§1）。", "p3": "図形の種類・座標の次元・長さを定める「スキーマ」で配置を先に決め、開始トークンに続くマスクされたトークンの塊を、軽い下書き器が一度に埋める。自己回帰モデルと同じトークン列の再現を求めず、注釈された図形で学習し、構造的に妥当な予測をそのまま受け入れる（§2.2–2.5）。具体例：軌道の2次元の画像座標と3次元の空間座標を1つの図形として同時に予測する（§2.2）。", "p4": "2次元と3次元のロボットの軌道の予測誤差、点の動きの予測の生成速度、計画に条件づけた行動モデルのMolmoSpacesの4つの課題群での成功率、Jetson Thor・DGX Spark・H100での1ステップの遅延を、自己回帰の復号と比べた（§3）。", "p5": "評価した2次元・3次元の軌道課題で自己回帰の復号より予測誤差が一貫して小さく、3次元の点の動きの予測を約25倍速く生成した。MolmoSpacesの平均成功率は70.2%（基準は62.6%）だった（抄録）。1ステップの遅延はThorとSparkのMolmoSpacesで5.1〜5.2倍、H100で3.6倍短くなり、改善はほぼ復号の段階によるものだった（§3.3、図4）。", "p6": "約25倍の高速化は単一の試行による予備的な測定だと著者は述べ、共有の観測から複数の補完的な図形を生成する拡張を今後の課題とする（抄録、§5）。解釈：下書きを照合せずに受け入れるため、構造は妥当でも意味的に誤った計画が混じる場合の扱いが残る。", "fun": "ロボットに「この道筋で動いて」と指示するAIは、道筋の座標を一つずつ順番に書き出すので、長い道筋ほど時間がかかります。この研究は、道筋の「形の決まり」を先に知っていることを利用して、座標を一気にまとめて書き出す方法を作りました。速くなっただけでなく、かえって正確にもなったという点が面白いところです。", "unverified": "自動運転のデータ（NAVSIM、Waymo）での精度の具体的な数値は確認していない。"}}, {"id": "pn16", "rank": 16, "field": "機械学習", "headline": "再起動の監視の良し悪しは精度で決まらない", "title": "Monitor Accuracy Isn't the Answer: A Decision-Value Framework for Evaluating AI Agent Restart Monitors", "url": "https://arxiv.org/abs/2610.36544", "authors": "Siddharth Jain ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-05", "apa": "Jain, S., & Vedam, V. N. (2026). Monitor Accuracy Isn't the Answer: A Decision-Value Framework for Evaluating AI Agent Restart Monitors (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.36544", "why": "AIエージェントを再起動するかを決める監視器について、同じ90%の精度でも成功率が下がる場合も大きく上がる場合もあることを解析的に示し、意思決定の価値で評価する方法を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "AIエージェントを再起動するかを決める監視器は分類の精度だけでは良し悪しが決まらないことを解析的に示し、意思決定の価値と統計的な裏付けで評価する2つの方法を提案した（抄録）。", "p3": "精度90%の監視器でも、再試行の成功確率しだいで成功率が5ポイント下がる場合から35ポイント上がる場合まであることを示し、ブラックウェルの実験比較を二値行動に特化した基準と、既存の軌跡だけで再起動・継続・保留を判定する有限標本の監査を作った（抄録）。", "p5": "SWE-bench VerifiedのSymPyの19課題で194回の実行を調べ、見かけの2.29ポイントの改善は1件の失敗に由来し、別のモデルでは42.29ポイント悪化し、103件の比較のどれも認証の基準を満たさなかった（抄録）。", "fun": "作業がうまく進まないAIを途中でやり直させるか決める見張り役は、正解率が高ければ良いと思いがちです。ところがこの研究は、同じ90%の正解率でも、やり直した後の成功の見込みしだいで、全体の成績が上がることも下がることもあると数式で示しました。見張りの良し悪しはその後の判断の価値で測るべきだ、という点が面白いところです。", "unverified": "選んだ19課題以外への一般化は抄録では未確認。"}}, {"id": "pn17", "rank": 17, "field": "機械学習", "headline": "推論の履歴を書き直すと以後の推論が短くなる", "title": "Why Pay for Long Reasoning When Rewrite Do Trick? Causal Effects of Reasoning History Compaction on Future Generation and Agent Cost", "url": "https://arxiv.org/abs/2611.03852", "authors": "Anton Hristov", "venue": "Hugging Face Daily Papers", "date": "2026-11-05", "apa": "Hristov, A. (2026). Why Pay for Long Reasoning When Rewrite Do Trick? Causal Effects of Reasoning History Compaction on Future Generation and Agent Cost (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03852", "why": "オープンなモデルが自分の過去の推論を簡潔な記録に書き直すと、再学習なしに以後の推論が短くなるかを、元の履歴との比較という介入で調べた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "オープンなモデルが自分の過去の推論を簡潔な状態の記録に書き直すと、再学習なしに以後の推論が短くなるかを、介入として調べた（抄録）。", "p3": "ツールの結果が明かされる前に、それまでの推論を簡潔な記録に書き換え、元の履歴と簡潔な履歴からの続きを比べた。コーディングの事例研究とソフトウェアのエージェントへの導入でも評価した（抄録）。", "p5": "受け入れた簡潔な履歴は、試したモデルの多くで以後の推論を短くし、コーディングでは繰り返しの検証も減った。エージェントでは総費用を下げうるが、課題の質と書き換えを含む時間は対象と圧縮器しだいだった（抄録）。", "fun": "難しい問題を解くAIは、長々と考えを書き連ねるほど賢くなりますが、そのぶん計算代がかさみます。この研究は、それまでのメモを要点だけに書き直して渡すと、AIがその後の考えも短く済ませるようになることを示しました。過去のメモの書き方が、未来の自分の考え方を変えるという点が面白いところです。", "unverified": "短縮の程度と正答率への影響の具体的な数値は抄録では未確認。"}}, {"id": "pn18", "rank": 18, "field": "機械学習", "headline": "Transformerは文脈だけで不安定な系を制御できるか", "title": "How do Transformers Perform Low-Level Control In-Context?", "url": "https://arxiv.org/abs/2611.07291", "authors": "Ebonye Smith ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Smith, E., Andrews, A., Wilson, P., Frias, A., Pandey, A., & Ranade, G. (2026). How do Transformers Perform Low-Level Control In-Context? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07291", "why": "系の種類と自由な時間発展のデータだけを文脈として与え、Transformerが倒立振子などの不安定な非線形系をパラメータを知らずに制御できるかを調べた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "Transformerが、系の種類と外力のない時間発展のデータだけを文脈として与えられて、パラメータを知らない不安定な非線形系を制御できる（文脈内制御）ことを示した（抄録）。", "p3": "複数ヘッドのGPT-2型の構造を使い、倒立振子（カートポール）と2リンクのアクロボットで、学習時だけ専門家の制御の軌跡が使える設定で訓練し、低レベルの制御を学ばせるのに不可欠な訓練の技法を特定した（抄録）。", "p5": "文脈内での制御は可能で、文脈が長いほど学習した方策の性能はおおむね向上し、分布外の系も安定化できた（抄録）。性能の具体的な数値は抄録に記載がない。", "fun": "棒を手のひらに立ててバランスを取るのは、棒の長さや重さを知らなくても、少し揺らしてみれば何とかなります。この研究は、文章を作るAIと同じ仕組みのTransformerに、揺れ方の記録を少し見せるだけで、倒れやすい振り子を立たせ続けられるかを試しました。文脈から学ぶ能力が体を動かす制御にも通じる点が面白いところです。", "unverified": "制御の成功率などの具体的な数値と、学習に使った専門家データの量は抄録では未確認。"}}, {"id": "pn19", "rank": 19, "field": "機械学習", "headline": "表形式の基盤モデルで能動的に文脈を選ぶ", "title": "When, Where, How: Active In-Context Learning for Tabular Foundation Models", "url": "https://arxiv.org/abs/2611.07886", "authors": "Christian M. M. Frey", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Frey, C. M. M. (2026). When, Where, How: Active In-Context Learning for Tabular Foundation Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07886", "why": "ラベルの付いた行だけで適応する表形式の基盤モデルに、多様性・不確実性・情報利得による能動的な選択がどう効くかを、文脈が増えるにつれて比較した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "文脈に入れたラベル付きの行だけで新しい課題に適応する表形式の基盤モデルで、どの行にラベルを付けると効率がよいか（能動的な文脈学習）を、時期・場所・方法の3点から明らかにした（抄録）。", "p3": "目的の入力に近い行を選ぶTANNと、文脈での予測情報利得の期待値EPICを、多様性や不確実性による古典的な規則と、20のベンチマーク、2つの基盤モデルと勾配ブースティング木で比べた（抄録）。", "p5": "初期の反復では多様性に基づく選択が最良で、目的の入力に役立つ行を選ぶことが大きく効いた。EPICは大きな8つのベンチマークで、プールの5〜10%のラベルで全データの性能（偶然補正後）の平均80〜87%を保った（抄録）。", "fun": "データに正解のラベルを付ける作業は、専門家の手間がかかって高くつきます。この研究は、表の形のデータを扱うAIに、どの行から正解を教えれば一番効率よく賢くなるかを調べました。最初は多様な例を、その後は知りたい対象に近い例を選ぶのが良いなど、教える順番に作戦があるという点が面白いところです。", "unverified": "個々のベンチマークでの差と計算時間は抄録では未確認。"}}, {"id": "pn20", "rank": 20, "field": "機械学習", "headline": "疎自己符号化器でMoEの専門家の役割を読み解く", "title": "SAE Interprets MoE: Sparse AutoEncoders Reveal That MoE Experts Exhibit Human-Interpretable Fine-Grained Specialization", "url": "https://arxiv.org/abs/2611.08089", "authors": "Anyuan Zhuo ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-06", "apa": "Zhuo, A., Zhang, S., Lin, Y., & Lu, P. (2026). SAE Interprets MoE: Sparse AutoEncoders Reveal That MoE Experts Exhibit Human-Interpretable Fine-Grained Specialization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08089", "why": "MoE層の出力に疎自己符号化器を学習させ、潜在特徴の活性を専門家ごとに正確に分解して、各専門家が人に解釈できる細かな役割を持つことを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録（Hugging Face Daily Papers経由）を使用", "preprint": true, "short": true, "p1": "Mixture-of-Experts（MoE）の各専門家の担当を、MoE層の出力で学習した疎な自己符号化器（SAE）の特徴を専門家ごとに正確に分解して調べ、細かく人に解釈できる分業があることを示した（抄録）。", "p3": "MoEの出力は専門家の出力の重み付き和で、SAEの符号化器はアフィンなので、各特徴の活性化前の値が専門家ごとに正確に分解できる。Qwen3-30B-A3Bの第4・30・46層でコーパス全体にわたり集計した（抄録）。", "p5": "寄与はゲートでの選択よりはるかに集中し、多くの特徴は1〜2個の専門家に支配されていた。Javaとフロントエンドのコード、幾何と算術・多項式のように粗い分野より細かい分業があった（抄録）。", "fun": "最近の大きなAIの中には多数の「専門家」の小さなネットワークがあり、入力ごとに数人だけが呼ばれます。でも、それぞれが本当は何の専門家なのかはよく分かっていませんでした。この研究は出力を細かい特徴に分解し、プログラミングの中でもJava担当とWeb画面担当が分かれているような細かな分業を見つけました。AIの中の役割分担が見える点が面白いところです。", "unverified": "ほかのモデルや層での一般性は抄録では未確認。"}}, {"id": "pn21", "rank": 21, "field": "機械学習", "headline": "LLMの重みの読解は推論より局所計算と記憶", "title": "Can an LLM Actually Reason and Program about Neural Network's Weights or is it just memorization on steroids? Exploring \"Weight-Space Programming\"", "url": "https://arxiv.org/abs/2611.08070", "authors": "Nazmus Sakib Ahmed", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Ahmed, N. S. (2026). Can an LLM Actually Reason and Program about Neural Network's Weights or is it just memorization on steroids? Exploring \"Weight-Space Programming\" (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08070", "why": "小さな畳み込みネットワークの重みを文字で与えたとき、LLMの読み取りが重みの流れについての推論なのか、局所的な計算と公開データの記憶なのかを検証した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMがニューラルネットの重みを直接読む能力が、重みの流れの推論なのか、局所的な計算と公開データの記憶なのかを、Claude Opus 5.5で探索的に検証した（抄録）。", "p3": "5つの画像データで学習した約125,000パラメータの畳み込みネットの全重みを、道具・順伝播・データ名なしの文字列で与えて読み取りと主張を検証した。多くは1回の実行による探索的な結果である（抄録）。", "p5": "バッチ正規化の統計から約3回の更新を推定するなど局所的な計算は正確だったが、意味の判断は既知のデータに頼り、ラベルの順番を入れ替えると解釈した組はすべて誤った（抄録）。", "fun": "AIが別のAIの中身（重みの数字）を読んで、何を学んだかを言い当てたという報告があります。この研究は、それが本当に中身の理解なのかを確かめるため、答えのラベルの順番をこっそり入れ替えてみました。すると説明はすべて外れ、有名なデータの並び順を覚えていただけだと分かりました。引っかけ問題で理解と暗記を見分けた点が面白いところです。", "unverified": "多くが1回の実行で、順伝播による直接の検証は行っていないと著者が記載（抄録）。"}}, {"id": "pn22", "rank": 22, "field": "機械学習", "headline": "トカマクの多様な計測を扱う生成的な基盤モデル", "title": "A Generative Foundation Model for Multimodal Tokamak Tasks", "url": "https://arxiv.org/abs/2611.08153", "authors": "Yingshuai Ji ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Ji, Y., Feng, H., Deng, G., Bian, G., & Wang, Y. (2026). A Generative Foundation Model for Multimodal Tokamak Tasks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08153", "why": "波形・分布・場などトカマク実験の多様な計測を、課題ごとの入出力の形に合わせて扱う生成的な基盤モデルを作り、再構成や予測など複数の課題を一つのモデルで行った。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "トカマク実験の波形・分布・場・スカラーなど多様な計測を、課題ごとの入出力の形に合わせて同時に生成する基盤モデルGenTokaを作り、複数の課題で既存のモデルを上回った（抄録）。", "p3": "TokaMarkベンチマークにアクチュエータ操作の逆推定とディスラプション予測を加えて6群20課題とし、共有の条件付き拡散Transformerと信号ごとの符号化器で目標を同時に生成した（抄録）。", "p5": "MASTの計測で、既存のTokaMindに比べ正規化誤差のマクロ平均を第1〜4群で4.7%、第5群で17.7%下げ、第6群のマクロ平均F1を8.4%改善した（抄録）。", "fun": "核融合を目指す装置トカマクでは、プラズマの状態をさまざまなセンサで同時に測っていますが、目的ごとに別々のAIを作るのが普通でした。この研究は、波形も分布も数値も一つのAIでまとめて扱い、状態の再現から崩壊の予告まで同じ土台でこなせるようにしました。何でも扱える土台のAIを実験物理に持ち込んだ点が面白いところです。", "unverified": "ほかの装置への転用の性能は抄録では未確認。"}}, {"id": "pn23", "rank": 23, "field": "機械学習", "headline": "内部の成分の整合性でLLMの回答の正誤を自己評価", "title": "Circe: Training-Free LLM Self-Evaluation via Component Interaction Consistency", "url": "https://arxiv.org/abs/2611.07948", "authors": "Shuyi Miao ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Miao, S., Li, Z., Xie, X., Xu, L., Shen, F., Du, X., & Chua, T.-S. (2026). Circe: Training-Free LLM Self-Evaluation via Component Interaction Consistency (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07948", "why": "注意機構と前向き層の相互作用の整合性という内部の信号から、参照解なしにLLMの回答の正しさを評価する訓練不要の方法を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "参照の答えも繰り返しの生成もなしに、LLMの回答が正しいかを、内部の成分の相互作用と出力の尤度から評価する訓練不要の方法Circeを提案した（抄録）。", "p3": "前の層の注意の更新と後の層の前向き層の出力変化の向きのそろい方（CIC）、層ごとの隠れ状態の軌跡の変位と角度（RG）、生成トークンの尤度による確信度（LC）を一つの得点に統合した（抄録）。", "p5": "4分野の6ベンチマークと5つのLLMで、既存の基準より正しい回答と誤った回答をよく区別し、多言語・マルチモーダル・開かれた設定にも一般化した（抄録）。差の数値は抄録に記載がない。", "fun": "AIの答えが合っているかを確かめるには、普通は正解と見比べる必要があります。この研究は、正解がなくても、AIの頭の中で部品どうしがどれだけ同じ向きに働いているかを見れば、正しい答えかどうかがある程度分かると考えました。答えの中身ではなく、考えている最中の足並みで正しさを測る点が面白いところです。", "unverified": "既存手法との差の大きさと計算の追加負担は抄録では未確認。"}}, {"id": "pn24", "rank": 24, "field": "統計学", "headline": "適応的な実験はモデルの誤りを隠しうる", "title": "Adaptive Experimentation Can Hide Model Error:Detection Limits and Falsification Budget", "url": "https://arxiv.org/abs/2611.07529", "authors": "Ramnarayan Choudhary", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Choudhary, R. (2026). Adaptive Experimentation Can Hide Model Error:Detection Limits and Falsification Budget (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07529", "why": "適応的な実験計画が誤ったモデルに合う設定を選び続けると、モデルの誤りが検出できなくなることを検定の検出力の上限として示し、反証のために計画の予算の一部を確保する規則を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "適応的な実験計画が誤ったモデルにうまく合う設定を選び続けると、モデルの誤りが検出できなくなることを、妥当な検定の検出力の上限として示した（抄録）。", "p3": "実験者自身の標本の分布で適合性検定の検出力を上から抑え、選んだデータにない情報と検出器が失う情報を区別し、未解決の誤差を測る診断と、計画の予算の一部を反証に回す規則を導いた（抄録）。", "p5": "実証の結果は混在し、事前に定めた主研究は検出の条件を満たさなかった。開示した修正版はT=240で誤った設定の35.8%を検出し（対照は31.7%）、T=480では差が定まらなかった（抄録）。", "fun": "実験を効率よく進めようと結果を見ながら次の条件を選んでいくと、知らないうちに自分のモデルがうまく当てはまる場所ばかり調べてしまうことがあります。この研究は、そうするとモデルの間違いが見つからなくなることを数式で示し、予算の一部を反証のために取っておく作戦を提案しました。うまくいかなかった検証も包み隠さず報告している点も面白いところです。", "unverified": "提案の規則の一般的な有効性は確立していないと著者が記載（抄録）。"}}, {"id": "pn25", "rank": 25, "field": "統計学", "headline": "ネットワークの部分グラフを結果とする非母数回帰", "title": "Nonparametric Subgraph Regression", "url": "https://arxiv.org/abs/2611.07240", "authors": "Wenxuan Ding", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Ding, W. (2026). Nonparametric Subgraph Regression (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07240", "why": "三角形の形成のように複数の主体の組で定まる結果について、観測の依存を考慮したカーネル回帰の収束速度と漸近正規性を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "三角形の形成のように、ネットワーク上の複数の主体の組で定まる結果の非母数回帰（部分グラフ回帰）を定式化し、カーネル回帰推定量の分散の上限、一様収束の速度、各点での漸近正規性を示した（抄録）。", "p3": "主体を共有する組の結果は依存しうるが、共通の主体がない組は独立という構造のもとで、ナダラヤ–ワトソン型のカーネル回帰の部分グラフ版を分析した。2者の組の回帰を特殊ケースとして含む（抄録）。", "p5": "観測の数はNのp乗の次数でも実効的な標本の大きさはNであり、収束の速さは1人の主体の共変量の次元で決まるため、次元の呪いが和らぐことを示した（抄録）。", "fun": "友人関係のネットワークで「3人が互いに友達になるか」を調べると、組み合わせの数は人数の3乗で増えます。でも同じ人が多くの組に入るので、データが本当に増えたわけではありません。この論文は、見かけの数に惑わされず、実際の情報量は人数程度だと正しく数え直しました。数え方一つで結論の確かさが変わる点が面白いところです。", "unverified": "シミュレーションや実データでの性能は抄録では未確認。"}}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "条件付き裾指数モデルの直交化した特定化検定", "title": "Neyman Orthogonalized Specification Tests for Conditional Tail Index Models", "url": "https://arxiv.org/abs/2611.07219", "authors": "Liuhua Peng ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Peng, L., Li, S., & Song, X. (2026). Neyman Orthogonalized Specification Tests for Conditional Tail Index Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07219", "why": "重い裾の分布の条件付き裾指数モデルについて、推定の影響とパレート近似の偏りを取り除いた検定を作り、より低い閾値でも正しい大きさを保てることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "重い裾の分布の条件付き裾指数モデルに対し、推定の影響を取り除いた射影経験過程による特定化検定を作り、より低い閾値でも検定の大きさを保てる条件を示した（抄録）。", "p3": "帰無仮説のパラメータ推定の一次の影響を除く射影を使い、条件付きHallクラスでパレート近似の偏りも消える条件を特定した。乗数ブートストラップで妥当性を示し、データ駆動の閾値選択規則も提案した（抄録）。", "p5": "対数線形モデルでは、閾値を超える観測の共変量が集中して情報行列の最小固有値がゼロに近づく場合にもブートストラップが妥当であることを示し、シミュレーションと実データで性能を調べた（抄録）。", "fun": "大地震や大暴落のような極端な出来事の起こりやすさは、分布の「裾」の重さで決まります。裾を調べるには大きな値だけを使いますが、使うデータを増やそうと基準を下げると誤差が混じります。この研究は、その誤差を打ち消す工夫で、より多くのデータを使って正しく検定できるようにしました。少ない極端な例を最大限に生かす工夫が面白いところです。", "unverified": "実データの内容と検出力の改善の大きさは抄録では未確認。"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "ガウス雲の要約で分散データの分位点回帰", "title": "Clouded Representatives and Score Matching for Distributed Quantile Regression", "url": "https://arxiv.org/abs/2611.07273", "authors": "Keren Li ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Li, K., & Wang, B. (2026). Clouded Representatives and Score Matching for Distributed Quantile Regression (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07273", "why": "各拠点のデータをスコアが一致する少数のガウス雲に要約して中央で分位点回帰を行う方法で、拠点の不均一や非同期の通信にも対応した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "個票を共有できない多数の拠点に分かれたデータで、各拠点の観測をスコアが一致する少数のガウス雲に要約し、中央で分位点回帰を行う方法cloudqrを提案した（抄録）。", "p3": "各拠点はいくつかのガウス雲（大きさ・中心・共分散）で観測を要約し、雲が元データのスコアに正確に一致するようにする。中央のサーバが全拠点の雲で分位点回帰を当てはめ、穏やかな条件で収束を示した（抄録）。", "p5": "シミュレーションと2つの実データの応用で、既存の分散型の方法より優れた性能を示した（抄録）。性能差の数値は抄録に記載がない。", "fun": "病院や会社ごとにデータを持っていても、個人の記録は外に出せないことがよくあります。この研究は、それぞれの場所でデータを「いくつかの雲の形」に要約して送るだけで、元のデータを集めたのと同じ分析ができるようにしました。中身を見せずに大事な性質だけを渡す工夫が面白いところです。", "unverified": "実データの内容と性能差の大きさは抄録では未確認。"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "部分マッチングからネイマン–ピアソンの補題を導く", "title": "A Partial-Matching Proof of the Neyman--Pearson Lemma", "url": "https://arxiv.org/abs/2611.07368", "authors": "Rami V. Tabri", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Tabri, R. V. (2026). A Partial-Matching Proof of the Neyman--Pearson Lemma (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07368", "why": "対立分布と尺度を変えた帰無分布の最大の部分マッチングとその双対問題から最適な検定が導かれることを示し、補題の新しい証明を与えた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "対立分布と尺度を変えた帰無分布の最大の部分マッチングから、ネイマン–ピアソンの補題（尤度比検定が最強力であること）を直接に証明した（抄録）。", "p3": "最大の部分マッチングで2つの分布を共通の成分と互いに特異な2つの残差に分け、初等的な双対問題の相補性条件から、対立側の残差で棄却し、帰無側の残差で棄却しない規則を導く（抄録）。", "p5": "最適な検定はあらかじめ提案されるのではなく最大のマッチングから現れ、尤度比の閾値でのみランダム化の自由が残る。マッチングの輪郭が最適な検出力の包絡線も決める（抄録）。", "fun": "統計の検定は「2つの分布を見分ける」こと、マッチングは「2つの分布の共通部分を見つける」ことで、正反対の作業に見えます。この論文は、共通部分をできるだけ多く取り除くと、残った部分がそのまま最良の検定の答えになることを示しました。教科書に載る有名な定理に、まったく違う方向から新しい証明を与えた点が面白いところです。", "unverified": "多次元や複合仮説への拡張は抄録では未確認。"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "値の範囲が決まった時系列のための有界GARCH", "title": "Bounded GARCH Processes", "url": "https://arxiv.org/abs/2611.08158", "authors": "Wagner Barreto-Souza", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Barreto-Souza, W. (2026). Bounded GARCH Processes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08158", "why": "失業率や相関のように区間に収まる時系列のために、予測が境界を越えない有界GARCH過程を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "実現相関・失業率・支出の割合など区間に収まる時系列のために、予測が境界を越えない有界GARCH過程を提案し、性質と推定の理論を整えた（抄録）。", "p3": "条件付き分散の式にパラメータの制約を課して過程全体がほぼ確実に有界の範囲に収まるようにし、厳密な定常性とエルゴード性を証明し、条件付き最尤推定の一致性と漸近正規性を導いた（抄録）。", "p5": "シミュレーションで有限標本の性能を確かめ、不動産ETF（VNQ）と長期国債ETF（TLT）の月次の実現相関で、変動の集中をとらえつつ通常のGARCHで起きる境界の逸脱を完全になくした（抄録）。", "fun": "相関係数や失業率は、決まった範囲の中にしか値をとりません。ところが、株価の変動のような値を想定した普通のモデルで予測すると、ありえない範囲の値が出てしまうことがあります。この研究は、範囲を必ず守る変動のモデルを作りました。データの当たり前の決まりを数式にきちんと組み込んだ点が面白いところです。", "unverified": "ほかの有界な系列での比較の結果は抄録では未確認。"}}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "試合結果から競争均衡の時代をベイズで検出", "title": "When Do Sports Leagues Stop Being Competitive? Bayesian Detection of Competitive-Balance Eras from Match-Level Data", "url": "https://arxiv.org/abs/2611.07335", "authors": "Xinran Li ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Li, X., Xu, M., & Hu, G. (2026). When Do Sports Leagues Stop Being Competitive? Bayesian Detection of Competitive-Balance Eras from Match-Level Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07335", "why": "試合ごとの結果から構造的な戦力差をベイズ推定し、区別できないチームの階層と競争均衡の時代の切り替わりを検出する枠組みを作った。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "試合ごとの結果から、運と区別した構造的な戦力差（競争均衡）をベイズ推定し、区別できないチームの階層と、リーグの競争均衡の時代の切り替わりを検出する枠組みを作った（抄録）。", "p3": "ガウスの補助変数をグラフで融合したℓ1の多面体に射影してチームの能力を求め、その半径で全体の能力差を測る。同点に正の確率を置くので区別できないチームが同じ階層になり、時代が現れ消える適応的なレジームモデルと組み合わせた（抄録）。", "p5": "イングランド・プレミアリーグ25季では、2005/06季から階層化の進んだ状態へ持続的に移り、その後に圧縮した状態に戻ったのは2010/11季だけだった（抄録）。", "fun": "サッカーのリーグで強いチームと弱いチームの差が広がったかは、順位表だけでは運の良し悪しと区別できません。この研究は一試合ごとの結果から本当の実力差を推定し、イングランドのリーグが2005/06シーズンから格差の大きい時代に入ったことを見つけました。優勝争いが接戦でも、リーグ全体の格差は大きいことがありうる点が面白いところです。", "unverified": "ほかのリーグへの適用と、収入の分配など政策との関係の分析は抄録では未確認。"}}, {"id": "pn31", "rank": 31, "field": "統計学", "headline": "テンソルトレイン核機械のランクをデータから推論", "title": "Bayesian Tensor Train Kernel Machines with Automatic Model Complexity Inference", "url": "https://arxiv.org/abs/2611.07129", "authors": "Afra Kilic ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Kilic, A., & Batselier, K. (2026). Bayesian Tensor Train Kernel Machines with Automatic Model Complexity Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07129", "why": "テンソルトレイン型の核機械に階層的な事前分布を置き、ランクと特徴の次元をデータから推論するベイズ版を作った。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "テンソルトレイン（TT）型の核機械に階層的な事前分布を置き、TTのランクと特徴の次元をデータから推論するベイズ版（BTT-KM）を提案した（抄録）。", "p3": "各TTコアに自動関連度決定型の階層事前分布を置き、平均場の変分推論で、決定的な版と同じ計算量のベイズ交互最小二乗法と閉じた形の予測分布を導いた（抄録）。", "p5": "合成データの実験で、過大に設定した初期値から真のTTのランクと特徴の次元を復元できることを示した（抄録）。実データでの性能は抄録に記載がない。", "fun": "大きな表を小さな部品の掛け算で表す「テンソル分解」は計算を軽くする強力な道具ですが、部品の大きさ（ランク）を人が決める必要がありました。この研究は、ベイズ推定で必要な大きさをデータに決めさせ、大きめに始めても余分な部分が自然に消えるようにしました。手で決めていた設定を自動にした点が面白いところです。", "unverified": "実データでの予測性能と計算時間は抄録では未確認。"}}, {"id": "pn32", "rank": 32, "field": "統計学", "headline": "奇ガウス過程でシャープレイ値の推定を高速化", "title": "ShapleyOG: Fast Adaptive Shapley Value Estimation with Odd Gaussian Processes", "url": "https://arxiv.org/abs/2611.07173", "authors": "David Rundel ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Rundel, D., Witter, R. T., Thies, S. M. A. R., Feurer, M., Fumagalli, F., & Bischl, B. (2026). ShapleyOG: Fast Adaptive Shapley Value Estimation with Odd Gaussian Processes (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07173", "why": "適応的にコアリションを選ぶシャープレイ値の推定を奇関数のガウス過程で効率化し、計算の負担を下げた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "機械学習の説明に使うシャープレイ値の適応的な推定を、ゲームの奇成分だけに置いたガウス過程で効率化し、精度を保ったまま計算の負担を最大3桁減らした（抄録）。", "p3": "シャープレイ値がゲームの奇成分だけに依存することを使い、対の抽出のもとで奇成分だけのガウス過程が半分の観測で同じ事後分布と選択基準を与えることを示した。代理モデルの再学習もまばらにした（抄録）。", "p5": "多様なゲームで既存のShaplEIGと同等の精度のまま負担を最大3桁減らし、1回の評価に十分の一秒かかり数千回の評価で足りる場合には、同じ計算時間で非適応の推定量を上回った（抄録）。", "fun": "AIがなぜその答えを出したかを説明するとき、各入力の貢献度を公平に分ける「シャープレイ値」がよく使われます。ただ正確に計算するには、入力の組み合わせを膨大な数だけ試す必要があります。この研究は、計算に本当に必要なのは奇関数の部分だけだと気づき、必要な観測を半分にしました。高校で習う偶関数・奇関数の考え方が効いている点が面白いところです。", "unverified": "説明の対象とした具体的なモデルとゲームの種類は抄録では未確認。"}}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "支払意思額空間と選好空間は同じモデルの言い換え", "title": "Willingness-to-pay space and preference space: a unified treatment of equivalence, heterogeneity and interpretation", "url": "https://arxiv.org/abs/2611.07698", "authors": "Stephane Hess", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Hess, S. (2026). Willingness-to-pay space and preference space: a unified treatment of equivalence, heterogeneity and interpretation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07698", "why": "選択モデルを支払意思額の空間で推定することが選好の空間の再パラメータ化にすぎない条件を整理し、異質性の扱いによって両者が一致する場合としない場合を明確にした。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "選択モデルを支払意思額（WTP）の空間で推定することは選好の空間の再パラメータ化にすぎず、両者が同じモデルになる単一の条件を軸に、等価性・異質性・解釈を整理した（抄録）。", "p3": "係数が確率的でない場合、決定的な異質性や非線形性がある場合、確率的な異質性（潜在クラスや混合）の場合に分け、2つの空間の尤度・WTPの推定値・標準誤差の関係を明確にした（抄録）。", "p5": "係数が確率的でなければ両空間は同一の尤度・推定値・標準誤差を与える。潜在クラスモデルは両空間で等価だが、ほかの混合は含意される分布が一致する場合のみ等価で、独立の仮定は中立ではない（抄録）。", "fun": "「この商品にいくらまで払うか」を調べる選択モデルには2つの書き方があり、どちらが当てはまりが良いかがよく比べられてきました。この論文は、多くの場合それは同じモデルを別の書き方で表しただけで、違いが出るのは仮定の置き方が違うときだけだと整理しました。見た目の違いと中身の違いを切り分けた点が面白いところです。", "unverified": "実データでの例示の有無は抄録では未確認。"}}, {"id": "pn34", "rank": 34, "field": "経済学", "headline": "ロボタクシーの充電と回送の最適な閾値構造", "title": "Stay, Reposition, or Recharge: Battery-Aware Operation of Robotaxi Fleets", "url": "https://arxiv.org/abs/2611.07699", "authors": "Philipp Af\\`eche (Kamessi) ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Afèche, P., Benjaafar, S., Jiayu, & Zhao. (2026). Stay, Reposition, or Recharge: Battery-Aware Operation of Robotaxi Fleets (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07699", "why": "電動ロボタクシーの運行・回送・待機・充電を連続時間の流体モデルで最適化し、電池残量の閾値による早めの帰庫と回送の判断という単純な構造を導いた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "電動ロボタクシーの運行・空車の回送・待機・充電を、位置と充電量の状態を持つ連続時間の流体モデルで最適化し、充電量の閾値による単純な最適構造を導いた（抄録）。", "p3": "従来の回送モデルにない「早めの帰庫」と「充電を考えた回送」を定式化し、各地点の電池の閾値と、行き先の電池感度という新しい概念で回送先を決める構造を示した。2025年のニューヨーク市のタクシー記録で較正した数値事例で評価した（抄録）。", "p5": "充電を考えない方策との性能差は際限なく大きくなりうることを示し、数値事例で充電を考える制御が大きな利得を生み、単純な閾値型の経験則が完全な解の価値の大半を回復した（抄録）。", "fun": "無人で走るロボタクシーは、客を乗せるだけでなく、電池の残りを見ながら充電に戻るタイミングも決めなければなりません。この研究は、場所ごとに「電池がこれより少なければ戻る」という線を一本引くだけで、ほぼ最適な運行になることを示しました。複雑な問題の答えが意外なほど単純な決まりになる点が面白いところです。", "unverified": "利得の具体的な大きさは抄録では未確認。"}}, {"id": "pn35", "rank": 35, "field": "経済学", "headline": "専門家の証拠収集に払う最適な報酬の設計", "title": "Brave New Data: Pricing Expertise and Discovery", "url": "https://arxiv.org/abs/2611.07278", "authors": "Dihan Zou", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Zou, D. (2026). Brave New Data: Pricing Expertise and Discovery (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07278", "why": "検証可能な証拠を専門家から調達する契約で、開示された証拠にだけ支払う契約が最適であり、収集費用が高いと片方の状態の証拠だけに報酬を払うのが最適になることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "二値の状態を私的に評価し、証拠集めの方向と強さを選ぶ専門家から検証可能な証拠を買う契約で、開示された証拠にだけ支払う契約が最適であることを示した（抄録）。", "p3": "買い手が、発見を促す容易さと、専門家の当初の評価を超えた意思決定への価値とをはかりにかける契約理論のモデルを分析した（抄録）。", "p5": "収集が安いときはどちらの状態の証拠にも等しく報い、失敗も情報になる集中的な探索を促す。費用が上がると、環境が対称でも片方の状態の証拠だけに報いるのが最適になり、支払いは減るが判断の正確さが下がる（抄録）。", "fun": "専門家に調査を頼むとき、「どちらの結論でも証拠を見つけたら同じ額を払う」のが公平に思えます。ところがこの研究は、調査にお金がかかる場合には、片方の結論の証拠にだけ報酬を出すほうが依頼主にとって得になることを示しました。状況が左右対称でも、最適な約束は非対称になりうるという点が面白いところです。", "unverified": "応用例や実証の有無は抄録では未確認。"}}, {"id": "pn36", "rank": 36, "field": "経済学", "headline": "チーム契約では完全な透明性がほぼ最適になる場合", "title": "Transparency in Team Contracts", "url": "https://arxiv.org/abs/2611.07494", "authors": "Paul D\\\"utting ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Dütting, P., Li, Y., Talgam-Cohen, I., & Wu, J. (2026). Transparency in Team Contracts (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07494", "why": "プリンシパルが契約と情報開示を組み合わせる問題で、生産が劣モジュラなら完全な透明性で最適の4/3以内に収まり、優モジュラならいくらでも悪くなりうることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "プリンシパルが契約とベイズ的説得（選択的な情報開示）を組み合わせてチームの努力を引き出す問題で、完全な透明性が生産の性質によってほぼ最適にも、いくらでも悪くもなりうることを示した（抄録）。", "p3": "単純さと最適性の観点から契約と情報開示の同時の設計を分析し、劣モジュラな生産関数の場合の差を抑える技法を開発した（抄録）。", "p5": "生産が劣モジュラなら完全な透明性は最適の4/3以内の近似になり、優モジュラならいくらでも離れうる。技法から、多主体の契約設計の近似比2.311の多項式時間アルゴリズムと、同時問題の3.081近似も得た（抄録）。", "fun": "チームのリーダーは、仕事の成功見込みをメンバーより知っていることがあります。全部正直に伝えるべきか、伏せるべきか。この研究は、メンバーの頑張りが足し算以下にしか効かない仕事なら、正直に全部伝えてもほぼ最善になることを示しました。仕事の性質によって「正直が一番」が成り立つかが変わる点が面白いところです。", "unverified": "実証的な応用は抄録では未確認。"}}, {"id": "pn37", "rank": 37, "field": "経済学", "headline": "複雑さの費用が下がるとメニューは際限なく増える", "title": "Complex Menus in Discriminatory Pricing", "url": "https://arxiv.org/abs/2611.07128", "authors": "Patrick Lahr ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Lahr, P., Niemeyer, A., & Pycia, M. (2026). Complex Menus in Discriminatory Pricing (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07128", "why": "多製品・多属性の価格差別では、複雑さの費用がなければ最適なメニューは一般に無限になり、費用が下がるにつれてメニューが際限なく大きくなることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "多製品・多属性の価格差別では、メニューの複雑さの費用がなければ最適なメニューは一般に無限になり、費用が下がるにつれて際限なく大きくなることを示した（抄録）。", "p3": "独占企業が消費者を選別（スクリーニング）するためにメニューを設計するモデルに複雑さの費用を導入し、多次元の場合の最適なメニューの大きさを分析した（抄録）。", "p5": "複雑さの費用はメニューを小さくしうるが、費用が下がるとメニューは際限なく大きくなる。この結果は1次元のモデルには類例がなく、費用や選好の非線形性にも依存せず、選別の動機だけで多様な製品の差別化が生じる（抄録）。", "fun": "スマホの料金プランやコーヒーのサイズなど、商品の選択肢はどんどん増えているように感じます。この研究は、売り手が客を見分けて値段を変えたい場合、選択肢を作る手間がなくなれば品ぞろえは限りなく増えることを理論で示しました。技術の進歩がメニューの洪水を生む理由を数学で説明した点が面白いところです。", "unverified": "実データでの検証は抄録では未確認。"}}, {"id": "pn38", "rank": 38, "field": "経済学", "headline": "助言の前に公表する調査の最適な設計", "title": "Designing Public Information for Strategic Advice", "url": "https://arxiv.org/abs/2611.07744", "authors": "Vasudha Jain ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Jain, V., & Roy, J. (2026). Designing Public Information for Strategic Advice (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07744", "why": "専門家の助言を受ける前に公表する調査の最適な設計が、コミュニケーションの仕組み（仲介・行動ルールへのコミット・チープトーク）によって変わることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "現地の事情を知る専門家の助言を受ける前にプリンシパルが公表する調査（将来の需要の予測など）の最適な設計が、コミュニケーションの仕組みによって変わることを示した（抄録）。", "p3": "最適な仲介、行動ルールへのコミット、仲介なしのチープトークの3つの仕組みのもとで、利害の対立の期待値を変える公開の調査の価値を比べた（抄録）。", "p5": "最適な仲介では完全な公開が最適になり、行動ルールにコミットする場合は情報なしが好まれうる。チープトークでは最適な調査が中間の領域を飛ばし、完全公開も情報なしも上回りうる（抄録）。", "fun": "上司が部下の意見を聞く前に、会社として市場予測を公表するべきかどうか。この研究は、その答えが話し合いのやり方しだいで正反対になることを示しました。わざと中途半端な情報を出すほうが、全部出すより、まったく出さないより良くなる場合がある点が面白いところです。", "unverified": "財政予測などへの応用の具体的な分析は抄録では未確認。"}}, {"id": "pn39", "rank": 39, "field": "経済学", "headline": "損失回避の競争者への頑健な賞金の設計", "title": "Robust prizes in all-pay contests with loss aversion", "url": "https://arxiv.org/abs/2611.07419", "authors": "Dmitry Ryvkin ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Ryvkin, D., & Wu, Q. (2026). Robust prizes in all-pay contests with loss aversion (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07419", "why": "努力の費用が分からないときの全員支払いコンテストで、最下位以外に等しい賞金を与える構造が頑健に最適であり、損失回避が強いと最下位にも正の賞金を与えるのが最適になることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "努力の費用が分からないまま、損失回避的な参加者の全員支払いコンテスト（負けても努力の費用を払う競争）の賞金を頑健に設計する問題で、最下位以外に等しい賞金を与える構造が最適であることを示した（抄録）。", "p3": "参加者の凸の努力費用を知らないプリンシパルが、総生産性の制約のもとで最悪の場合を最良にする賞金の構造を分析した（抄録）。", "p5": "損失回避が中程度なら最下位の賞金はゼロが最適だが、十分に強いと最下位の賞金は正になり、損失回避とともに増える。強い損失回避のもとでは一部の参加者だけが参加する解になる（抄録）。", "fun": "コンテストの賞金は「1位に大きく」が普通に思えます。ところがこの研究は、負けて損をすることを強く嫌う人たちが相手なら、最下位以外の全員に同じ賞金を出すのが一番確実だと示しました。損失への恐れがとても強い場合は、最下位にも賞金を出すほうがよくなります。人の心理で最適なルールが大きく変わる点が面白いところです。", "unverified": "実験や実データでの検証は抄録では未確認。"}}, {"id": "pn40", "rank": 40, "field": "経済学", "headline": "凸性がわずかに崩れた協力ゲームのコアの条件", "title": "Cores of $3$-distant convex games", "url": "https://arxiv.org/abs/2611.07572", "authors": "Keisuke Bando ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Bando, K., Hirai, T., Imamura, K., & Mizutani, R. (2026). Cores of $3$-distant convex games (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07572", "why": "近い提携の間でだけ凸性が崩れる3-距離凸ゲームのコアが空でない必要十分条件を示し、コアの配分を多項式時間で求める組合せアルゴリズムを作った。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "近い提携の間でだけ凸性が崩れる3-距離凸ゲームについて、コアが空でないための単純な必要十分条件を示し、コアの配分を強多項式時間で求める組合せアルゴリズムを作った（抄録）。", "p3": "凸な協力ゲームではコアが空でなく配分も効率よく作れるが、経済的に自然な局所的な摩擦が凸性を壊しうるため、凸性の破れを近い提携の間に限ったクラスを分析した（抄録）。", "p5": "コアは空になりうるが、空でないための単純な必要十分条件を示し、存在するときは強多項式時間で配分を見つけられる。合併の相乗効果がある寡占や、補完的な投入を持つ共同生産の利益配分に適用した（抄録）。", "fun": "何社かで協力して得た利益を、誰も抜けたくならないように分ける方法を「コア」と呼びます。条件がそろえば必ず見つかりますが、現実の小さなひずみで見つからなくなることがあります。この研究は、ひずみが近い者どうしに限られるなら、分け方が存在するかを簡単に判定し、すばやく計算できることを示しました。公平な分け前の計算を現実に近づけた点が面白いところです。", "unverified": "応用例での数値的な結果は抄録では未確認。"}}, {"id": "pn41", "rank": 41, "field": "社会学", "headline": "500ドルの給付小切手と2026年中間選挙の投票", "title": "Rebates on the Ballot: Exposure to the $500 ACA Checks and Voting Behavior in the 2026 Midterm Elections", "url": "https://doi.org/10.31235/osf.io/kev7w", "authors": "Tejendra Pratap Singh", "venue": "SocArXiv", "date": "2026-11-06", "apa": "Singh, T. P. (2026). Rebates on the Ballot: Exposure to the $500 ACA Checks and Voting Behavior in the 2026 Midterm Elections. https://doi.org/10.31235/osf.io/kev7w", "why": "2026年の医療保険の補助縮小の中で配られた500ドルの小切手への郡ごとの接触度と、中間選挙の投票参加・得票の関係を、補助のない加入者数の内生性に対処して推定した。", "explain": {"basis": "抄録", "basis_note": "SocArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "2026年の医療保険の補助縮小の中で配られた500ドルの小切手への郡ごとの接触度が、中間選挙の投票参加と共和党の得票率を高めたと推定した（抄録）。", "p3": "郡別の保険市場の加入・価格の記録、世帯調査の個票、経済指標、郡・選挙ごとの結果を結合し、補助のない加入者数の内生性に対して、税額表の法定の変更などの外生的な変動を使う模擬の操作変数で二段階最小二乗法を行い、ジャックナイフや無作為化推論で頑健性を確かめた（抄録）。", "p5": "小切手への接触は投票率と共和党の二大政党得票率を大きく高め、効果は低所得の郡と少数派の有権者の割合が高い地区で最も大きかった（抄録）。効果の大きさの数値は抄録に記載がない。", "fun": "選挙の直前に配られる給付金は、人々の投票にどれだけ影響するのでしょうか。この研究は、2026年に配られた500ドルの小切手が届いた度合いの地域差を利用し、投票率と共和党の得票が上がったと推定しました。制度の変更で偶然に生じた地域差を実験のように使う工夫で、お金と投票行動の関係に迫った点が面白いところです。", "unverified": "効果の具体的な大きさと地区ごとの違いの詳細は抄録では未確認。"}}, {"id": "pn42", "rank": 42, "field": "社会学", "headline": "被害を記録・集約する基盤で司法へのアクセスを広げる", "title": "The Moving Frontier: How the National Justice Project Is Using Digital Technology to Expand Access to Justice", "url": "https://arxiv.org/abs/2611.08052", "authors": "George Newhouse AM ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "AM, G. N., Ramesh, T., & de Silva, T. (2026). The Moving Frontier: How the National Justice Project Is Using Digital Technology to Expand Access to Justice (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.08052", "why": "ナショナル・ジャスティス・プロジェクトを例に、被害の経験を記録し集約する無料のデジタル報告基盤が、司法へのアクセスをどう広げるかを論じた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "ナショナル・ジャスティス・プロジェクトの取り組みを例に、人々が被害の経験を記録し、それを集約して権利擁護や制度の説明責任、法改正の証拠にする無料のデジタル報告基盤の可能性を論じた（抄録）。", "p3": "商業的な法務技術が生産性に向かう一方、採算の取れない無料の直接型の技術は見過ごされてきたとして、デジタル報告が周縁化された人々と法制度の間の知識と力の差を縮められるか、制度の責任を問う証拠を集められるかの2つの問いを立てた（抄録）。", "p5": "差別や行政による不当な扱いの経験は監督機関に個人の苦情として退けられがちであり、集約した記録がそれを変えうると論じた（抄録）。実証的な評価の結果は抄録に記載がない。", "fun": "一人が「不当な扱いを受けた」と訴えても、個人の不満として片づけられてしまうことがあります。ところが同じような体験を多くの人が記録して集めると、制度の問題を示す証拠になります。この論文は、そうした記録を集める無料のデジタルの仕組みが、弱い立場の人の声を力に変えうることを論じています。小さな声を束ねる発想が面白いところです。", "unverified": "報告基盤の利用状況や効果のデータは抄録では未確認。"}}, {"id": "pn43", "rank": 43, "field": "経営学", "headline": "似た精度のモデルの使い分けで監査をすり抜けうる", "title": "Adversarial Multiplicity: Cherry-Picked Models and the Limits of Disclosure", "url": "https://arxiv.org/abs/2611.07378", "authors": "Cassandra C. Chou ほか", "venue": "arXiv", "date": "Fri, 06 Nov 2026", "apa": "Chou, C. C., Huynh, B. Q., Koenecke, A., & Chin, E. T. (2026). Adversarial Multiplicity: Cherry-Picked Models and the Limits of Disclosure (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.07378", "why": "同程度の精度のモデルが個別の予測で食い違う性質を悪用すると、柔軟なモデルなら性能をほとんど落とさずに任意の個別予測を反転させ、外部からの監査も通過できることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "同程度の精度のモデルが個々の予測で食い違う「予測の多重性」を悪用すると、柔軟なモデルなら性能をほとんど落とさずに任意の個別の予測を反転させ、外からの監査も通過できることを示した（抄録）。", "p3": "ハイパーパラメータや特徴量の選択を最適化する柔らかい操作と、モデルのパラメータを直接いじる硬い操作を区別し、監査の種類ごとに通過できるかを調べた（抄録）。", "p5": "硬い操作はブラックボックスの監査を通り、柔らかい操作は効果が小さいがコードとデータを見る監査も通りうる。集計値も操作でき、気候変動が山火事に与える推定効果を完全に反転できた（抄録）。", "fun": "精度が同じくらいのAIモデルでも、個々の人への判定はモデルによって食い違うことがあります。この研究は、その食い違いを都合よく選べば、裁判や消費者との争いで特定の人への判定をひっくり返しつつ、監査もすり抜けられることを示しました。精度が同じなら公平とは限らないという警告が面白いところです。", "unverified": "現実の紛争での事例は抄録では未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "トラック走行試験を含む実橋の公開計測データ", "title": "Data Set of Load Tests and Structural Health Monitoring of a Concrete Box Girder Bridge", "url": "https://doi.org/10.1061/jbenf2.beeng-8394", "authors": "Martin Köhncke ほか", "venue": "Journal of Bridge Engineering", "date": "2026-11-06", "citescore": 7.2, "citescore_year": "2025", "apa": "Köhncke, M., Jaelani, Y., Mendler, A., Neumann, L., Wittenberg, P., Rode-Klemm, A., & Kessler, S. (2027). Data Set of Load Tests and Structural Health Monitoring of a Concrete Box Girder Bridge. Journal of Bridge Engineering, 32(1). https://doi.org/10.1061/jbenf2.beeng-8394", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Journal of Bridge Engineeringの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "1972年建設の供用中のプレストレストコンクリート箱桁橋で行った静的・動的な載荷試験と、128センサの常時の構造ヘルスモニタリングのデータをHDF5形式で公開し、その構成と品質の確認を示した（抄録）。", "p2": "実物大の橋梁の載荷試験の公開データは少なく、有限要素モデルの較正、影響線の抽出、データ駆動の異常検知などの手法を検証する基準データが不足していた（抄録）。", "p3": "橋はDTEC-SHMの研究計画で、加速度計、ひずみ計、傾斜計、変位計、埋込み温度計、気象観測装置を含む128センサで監視されている。試験は、680・1,420・2,160kgと段階的に質量を加える長期の静的載荷、21,250kgのトラックを3か所に止める短期の静的載荷、積載・空車（21,250kgと12,340kg）のトラックが最大13.9m/sで繰り返し通過する動的試験からなる（抄録）。", "p4": "車両の位置と通過時刻の確認に一時的なレーザーセンサを使い、同期した計測データと追跡した固有振動数の時系列を収め、駐車位置と通過の時間窓の確認、振動スペクトルとモード特性の追跡、低速通過時のひずみと変位の分布の再現性で主な応答量の妥当性を確かめた（抄録）。", "p5": "抄録によれば、レーザーによる駐車位置と通過時間の確認、振動のスペクトルとモード特性の追跡、這うような速度でのトラック通過によるひずみ・変位の分布の繰り返し性が示されている（抄録）。具体的な固有振動数や精度の数値は抄録に記載がない。", "p6": "抄録の範囲では、橋は匿名化されており、データの期間や欠測の扱いは確かめられない。解釈：トラックの速度は最大13.9m/sで、高速走行時の車両と橋の相互作用の評価には別のデータが要る。", "fun": "橋の安全を見守るセンサの研究では、実際の橋で本物のトラックを走らせたデータが欠かせませんが、そうしたデータが公開されることはまれです。この論文は、半世紀以上前に造られたコンクリートの橋に128個のセンサを付け、重さの分かるトラックを止めたり走らせたりした記録を、誰でも使える形で公開しました。研究者が同じデータで手法を比べられる共通の土俵を作った点が面白いところです。", "unverified": "抄録のみ読んだ。センサの配置、データの期間、固有振動数の値は未確認。"}}, {"id": "jr02", "rank": 2, "headline": "目的変数の漏れを除くと損傷診断の精度は大幅に低下", "title": "Leakage-controlled Bayesian structural health monitoring of earthquake-damaged RC frames using mechanism-aware evidence and experimental demonstration", "url": "https://doi.org/10.1177/14759217261498813", "authors": "Abdul Ghafar Wahab ほか", "venue": "Structural Health Monitoring", "date": "2026-11-06", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Wahab, A. G., Clementi, F., & Tao, Z. (2026). Leakage-controlled Bayesian structural health monitoring of earthquake-damaged RC frames using mechanism-aware evidence and experimental demonstration. Structural Health Monitoring. https://doi.org/10.1177/14759217261498813", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Structural Health Monitoringの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "地震で損傷したRC骨組の構造ヘルスモニタリングで、評価時の目的変数の漏れを統制したベイズ的な診断の枠組みを作り、漏れを除くと見かけの診断精度が大きく下がることを示した（抄録）。", "p2": "地震後のSHMには、解釈でき不確実性を示し、性能の過大評価に強い状態推定が必要だが、目的の状態を定義する応答量と同じ量から作った手がかりを使うと精度が水増しされる（抄録）。背景：データの漏れ（leakage）は、答えの情報が入力に紛れ込み、評価が実力以上に良く見える問題。", "p3": "損傷状態・剛性低下・残存耐力を、最大層間変形角、割線剛性の低下、ピーク後の耐力保持という別々の応答量で定義し、528の非線形FEMのプッシュオーバー解析（整形の実大・実験室規模の骨組と、高さの異なるピロティ形式の骨組）の手がかりを設計・機構・応答の記述子に整理した。目的の定義に使う応答量から作った記述子を除く「同一スカラーの漏れの統制」を導入し、ベイジアンネットワークで推定した（抄録）。", "p4": "評価は、交差検証のマクロF1、形状を1つずつ外す検証、期待較正誤差（予測確率の当てになり具合）、4体のRC骨組の実験への適用で行った（抄録）。", "p5": "漏れを統制すると、マクロF1は損傷状態で0.911から0.626、剛性低下で0.933から0.741、残存耐力で0.907から0.645に下がった。形状を外す検証の平均マクロF1は0.501、0.601、0.552、期待較正誤差は0.138、0.104、0.070だった。実験の4体では大きな損傷の確率0.888〜0.943、剛性低下の確率0.955〜0.996で観察と整合したが、試験体の区別は限られた（抄録）。", "p6": "形状を外した検証の結果から、別の形状への移転性は構成に依存すると著者は述べる（抄録）。解釈：シミュレーションで作ったデータで学習しており、実測の雑音や計測の欠けのもとでの性能は抄録からは分からない。", "fun": "AIの診断の正解率は、テストの問題の中に答えのヒントが紛れ込んでいると水増しされます。この研究は、地震で傷んだ建物の診断で、答えを決めるのと同じ測定値を手がかりから外すと、損傷の状態を当てる得点（マクロF1）が0.911から0.626に下がることを示しました。見かけの良さに頼らず、正直な評価の仕方を示した点が面白いところです。", "unverified": "抄録のみ読んだ。記述子の具体的な内容と、ベイジアンネットワークの構造は未確認。"}}, {"id": "jr03", "rank": 3, "headline": "実測変位とベイズ更新で百年鉄道橋の疲労信頼性を評価", "title": "Measurement-informed fatigue-driven reliability analysis for century-old corroded steel rail-bridge integrating Bayesian inference and FORM", "url": "https://doi.org/10.1007/s13349-026-01136-8", "authors": "S. Chowdhury ほか", "venue": "Journal of Civil Structural Health Monitoring", "date": "2026-11-06", "citescore": 8.0, "citescore_year": "2025", "apa": "Chowdhury, S., Arnold, R., & Kraus, M. (2026). Measurement-informed fatigue-driven reliability analysis for century-old corroded steel rail-bridge integrating Bayesian inference and FORM. Journal of Civil Structural Health Monitoring, 17(1). https://doi.org/10.1007/s13349-026-01136-8", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "Springerの出版社HTML本文（対象橋梁§4.1、剛性の更新§4.3、信頼性解析§4.6、結論§5）を読んだ", "preprint": false, "p1": "1904年ごろ建設され2010年に腐食による疲労損傷で供用を止めた支間6.4mのリベット接合の鋼鉄道橋で、実測変位によるベイズ更新を腐食モデルと疲労の累積損傷に組み込み、FORMで時間とともに変わる信頼性を評価する枠組みを示した（抄録、§4.1、§5）。", "p2": "歴史的なリベットの鉄道橋では疲労が主な破壊の仕組みで、腐食がそれを強めるが、実測データを腐食の進行と疲労の信頼性評価に直接結びつける方法は限られていた（§1）。", "p3": "2010年に4つの車輪を模した油圧ジャッキで載荷してLVDTで変位を測り、単純梁の閉じた形の解でベイズ的に曲げ剛性EIを更新し、それで基準の腐食モデル（断面欠損）を較正した。さらに幾何による応力の増幅と切欠きの効果を分けて時間とともに変わる切欠き係数を求め、パルムグレン–マイナー則の累積損傷と疲労の限界の確率変数による限界状態関数をFORMで評価した（§3、§4.3–4.6、式28–29）。", "p4": "断面欠損だけを考える場合（ケース1）と腐食による切欠きの効果を含む修正S–N曲線の場合（ケース2）で、1904〜2020年の117年の信頼性指標を、EN 1990の疲労の目標値3.8（50年）を117年に換算した3.58と比べた（§4.6）。", "p5": "EIの事前の変動係数0.1011は、6回の逐次更新で0.0282に下がった（図9）。累積損傷は2010年にD=0.30、2020年に0.34と予測された（§5）。ケース1では目標の信頼性指標は2018年ごろまで満たされたが、切欠きを含むケース2では全期間で損傷が支配的だった（§4.6、§5）。", "p6": "ベイズ更新は供用停止後の一時点の繰り返しの測定に基づき、剛性の時間変化ではなく認識論的な不確かさの減少を表すと著者は述べる（§4.3）。荷重が分からない出力のみのSHM（固有振動数やモード形など）でも枠組みは使えるとする（§5）。解釈：1橋の事例で、他の橋への適用には腐食と疲労のモデルの妥当性の確認が要る。", "fun": "100年近く使われた古い鉄の鉄道橋は、さびで部材が薄くなり、列車が通るたびの小さな傷も積み重なっていきます。この研究は、実際に橋を押してたわみを測ったデータから、さびの進み方の予測を補正し、橋がいつまで安全かを確率で計算しました。測るほど予測のあいまいさが減っていく様子を数字で示した点が面白いところです。", "unverified": "ケース2の信頼性指標の年ごとの値は記述が読み取りにくく、確認しきれていない。"}}, {"id": "jr04", "rank": 4, "headline": "加速度で有限要素モデルを更新し火災後の損傷を推定", "title": "A data-driven structural health monitoring framework for damage identification of composite beams under fire-induced extreme events", "url": "https://doi.org/10.1177/14759217261503606", "authors": "Caiwei Liu ほか", "venue": "Structural Health Monitoring", "date": "2026-11-06", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Liu, C., Wang, J., Wang, D., Yang, M., & Miao, J. (2026). A data-driven structural health monitoring framework for damage identification of composite beams under fire-induced extreme events. Structural Health Monitoring. https://doi.org/10.1177/14759217261503606", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Structural Health Monitoringの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "火災を受けた合成梁について、加速度の時刻歴から双方向LSTM（Bi-LSTM）で有限要素モデルの5つの更新パラメータを推定し、更新したモデルと火災の時間・低減係数から損傷を評価する、データ駆動の構造ヘルスモニタリングの枠組みを示した（抄録）。", "p2": "火災後の評価には、計測した構造応答、有限要素モデルの忠実度、定量的な損傷指標を直接つなぐことが必要だった（抄録）。背景：Bi-LSTMは、時系列を前後両方向から読む再帰型のニューラルネット。", "p3": "48,000の模擬標本のデータベースでBi-LSTM回帰を学習し、加速度の時刻歴から5つの連続的な更新パラメータ（E、Ds、K1、K2、K3）を推定してFEMを更新し、Bi-LSTMによる損傷の同定と組み合わせた（抄録）。", "p4": "数値の更新試験、独立した数値の損傷事例、学習とハイパーパラメータの選定から除いた6体の火災試験体で、パラメータ・火災時間・剛性と耐力の低減係数の誤差と、温度・たわみ・基本固有振動数の低下の再現を評価した（抄録）。", "p5": "数値の更新試験でのパラメータの最大誤差は7.4%、独立した数値の損傷事例での火災時間の最大誤差は5.8%だった。6体の火災試験体では、火災時間の絶対相対誤差が9.91±3.05%、剛性低減係数が5.05±1.23%、耐力低減係数が3.24±1.26%で、更新モデルは温度・たわみ・基本固有振動数の低下の傾向を再現した（抄録）。", "p6": "抄録の範囲では、学習はシミュレーションのデータで、実験による検証は6体に限られる。解釈：前処理を固定した模擬データの学習の枠組みで、実際の構造物の環境の変動や計測の雑音のもとでの性能は確かめられていない。", "fun": "火事にあった建物の梁がどれくらい弱くなったかを、外から見て判断するのは難しいものです。この研究は、梁の揺れ（加速度）の記録から、AIでコンピュータの中の梁の模型を実物に合わせ込み、どれだけ長く火にさらされ、どれだけ強さが落ちたかを推定しました。揺れという目に見えるデータから、見えない傷みを読み解く点が面白いところです。", "unverified": "抄録のみ読んだ。学習データの作り方と、加速度の計測条件は未確認。"}}, {"id": "jr05", "rank": 5, "headline": "チャットボットは職場の援助要請の気まずさを減らす", "title": "Revolutionising White‐Collar Help‐Seeking in Organisations: The Impact and Dynamics of Artificial Intelligence‐Driven Chatbots", "url": "https://doi.org/10.1111/ntwe.70053", "authors": "Filomena Pagnozzi ほか", "venue": "New Technology, Work and Employment", "date": "2026-11-06", "sjr": 3.193, "citescore": 13.3, "citescore_year": "2025", "apa": "Pagnozzi, F., Renkema, M., & Antonelli, G. (2026). Revolutionising White‐Collar Help‐Seeking in Organisations: The Impact and Dynamics of Artificial Intelligence‐Driven Chatbots. New Technology, Work and Employment. https://doi.org/10.1111/ntwe.70053", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "New Technology, Work and Employmentの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "ChatGPTが一般に広まり始めた2023年の5月から年末にかけて行ったホワイトカラー24人への深層面接から、AIチャットボットが職場での援助要請（人に助けを求めること）をどう変えるかを、アフォーダンス理論で示した（抄録）。", "p2": "援助要請は学習と協働に不可欠だが、社会的な障壁で抑えられがちで、AIチャットボットがその構図をどう変えるかは分かっていなかった（抄録）。背景：アフォーダンスとは、道具が使い手に可能にする行為の可能性。", "p3": "技術的・社会的なアフォーダンスと制約がチャットボットの利用をどう方向づけるかを、24人の深層面接の質的分析で調べた（抄録）。分析の手順の詳細は抄録に記載がない。", "p4": "分析の観点は、チャットボットが提供する支援の種類、利用を妨げる懸念、個人の考え方や年齢、組織文化（革新の風土など）の影響である（抄録）。", "p5": "チャットボットは繰り返しの作業や情報の作業について、評価を気にせず頼れる支援を提供し、自律を高めて対人的な気まずさを避けさせた。一方、信頼、能力の限界、監視、雇用の安定への懸念が利用を妨げ、個人の考え方と年齢、組織文化も利用に影響した。チャットボットは人の支援を置き換えずに補い、援助要請を人と機械の関係として捉え直させた（抄録）。", "p6": "抄録の範囲では、対象者の業種や国の構成は確かめられない。解釈：ChatGPTの普及の初期の面接で、AIが日常化した後の援助要請の変化は別に調べる必要がある。", "fun": "職場で分からないことを先輩に聞くのは、「こんなことも知らないのか」と思われそうで気が引けるものです。この研究では、AIのチャットボットには気兼ねなく聞けるので、ちょっとした疑問の解決が楽になったと語られました。一方で、見張られている気がする、仕事を取られるのではという不安も聞かれました。人に頼る気まずさをAIが肩代わりするという視点が面白いところです。", "unverified": "抄録のみ読んだ。面接の対象者の業種・国と、分析の手順は未確認。"}}, {"id": "jr06", "rank": 6, "headline": "財務報告から米多国籍企業の所得移転を企業別に推計", "title": "Using Financial Accounting Information to Estimate the Income Shifting of US Multinationals", "url": "https://doi.org/10.1111/1911-3846.70099", "authors": "Scott D. Dyreng ほか", "venue": "Contemporary Accounting Research", "date": "2026-11-06", "sjr": 3.686, "citescore": 7.3, "citescore_year": "2025", "apa": "Dyreng, S. D., Hills, R., & Markle, K. S. (2026). Using Financial Accounting Information to Estimate the Income Shifting of US Multinationals. Contemporary Accounting Research. https://doi.org/10.1111/1911-3846.70099", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Contemporary Accounting Researchの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "公開された財務報告のデータから、米国の多国籍企業が米国外へ移す所得（所得移転）を企業・年ごとに推計し、総額がマクロ経済のデータに基づく広く引用される推計より大幅に小さいことを示した（抄録）。", "p2": "米国の多国籍企業の所得移転の推計は研究によって大きく異なり、多くはどの企業が移転しているかを特定できなかった（抄録）。", "p3": "企業の公開の財務報告から、企業年ごとの外向きの所得移転の推計値を導いた（抄録）。推計の具体的な式と標本は抄録に記載がない。", "p4": "企業単位の推計を集計してマクロのデータに基づく推計と比べ、差の原因（外国所得の二重計上か、税率への感応度の違いか）と、移転の企業間の集中度を調べた（抄録）。", "p5": "米国からの外向きの所得移転の総額は、広く引用されるマクロの推計より大幅に小さく、その差は主にマクロのデータでの外国所得の二重計上によるもので、税率への感応度の違いによるものではなかった。移転は少数の企業、主にコンピュータや医薬品など無形資産の多い産業に集中し、多くの多国籍企業はほとんど移転していなかった（抄録）。", "p6": "抄録の範囲では、推計の誤差の大きさや、財務報告から捉えられない移転の範囲は確かめられない。著者は、OECDの第2の柱と米国の法人代替ミニマム税の規模の閾値は活発な移転企業を捉える一方、移転の少ない多くの企業にも遵守の負担を課しうると述べる（抄録）。", "fun": "多国籍企業が税金の安い国に利益を移す「所得移転」は、どのくらいの額なのかが研究によってばらばらでした。この研究は、各企業が公開している決算書から一社ずつ計算し直し、実際の額は国全体の統計から計算した値よりずっと小さく、その違いは主に統計で外国の利益を二重に数えていたためだと突き止めました。会計の数字を丁寧に読むことで統計の落とし穴を見つけた点が面白いところです。", "unverified": "抄録のみ読んだ。推計の方法、標本の期間と企業数、金額の数値は未確認。"}}, {"id": "jr07", "rank": 7, "headline": "LLMは言語変化の大筋を再現するが社会的層化を失う", "title": "The Sociolinguistic Interpretability of Large Language Models: Directional Accuracy but Social Simplification", "url": "https://doi.org/10.1111/josl.70067", "authors": "Viktorija Kostadinova ほか", "venue": "Journal of Sociolinguistics", "date": "2026-11-06", "sjr": 0.83, "citescore": 4.3, "citescore_year": "2025", "apa": "Kostadinova, V., & Gardner, M. H. (2026). The Sociolinguistic Interpretability of Large Language Models: Directional Accuracy but Social Simplification. Journal of Sociolinguistics. https://doi.org/10.1111/josl.70067", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Journal of Sociolinguisticsの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "LLMが言語の一般的なパターンだけでなく、社会的に構造化された変異をどこまで捉えるかを調べる「社会言語学的な解釈可能性」の枠組みを提案し、LLMは変異と変化の大きな流れを再現するが社会的な層化を失うことを示した（抄録）。", "p2": "言語生成システムは社会言語学的な現象を調べる新しい場になりつつあるが、LLMが社会的な変異をどの程度反映しているかを体系的に調べる枠組みはなかった（抄録）。背景：見かけの時間は、年齢層ごとの話し方の違いから言語の変化を推定する考え方。", "p3": "GPTで生成した2つの新しいコーパス（米国の方言調査に答える形の語彙の変異と、トロントの英語の面接）を作り、確立した知見と比べた（抄録）。", "p4": "比較の基準は、米国の語彙の変異の地理的な関連と、トロント英語の引用表現「be like」の見かけの時間での増加と社会的な層化の知見である（抄録）。", "p5": "方言調査の比較では、モデルは確立した地理的な関連を再現したが、地域ごとに競合する語形をより粗い区分に圧縮した。トロントの面接では「be like」の見かけの時間での増加を驚くほど忠実に再現したが、その始まりを滑らかにし、頑健な社会的な層化は再現しなかった（抄録）。", "p6": "抄録の範囲では、使ったGPTの版、生成の条件、標本の大きさは確かめられない。著者は、LLMは変異と変化の大規模な軌跡を近似しても、重要な社会的な仕組みを見逃しうると述べる（抄録）。", "fun": "言葉の使い方は年齢や地域や階層によって違い、若い世代から広がる言い回しもあります。この研究は、AIに架空のインタビューを書かせると、世代による流行の変化はよく再現できる一方、社会階層による違いは消えてしまうことを示しました。平均的な流れは写せても、社会の凸凹は写しきれないという点が面白いところです。", "unverified": "抄録のみ読んだ。使ったモデルの版、生成の件数、比較の統計の詳細は未確認。"}}, {"id": "jr08", "rank": 8, "headline": "生成AIとの共作で自分の貢献が曖昧になり意味が揺らぐ", "title": "Less effort, less meaning? Authorship ambiguity and impostor-like experiences in GenAI-mediated knowledge work", "url": "https://doi.org/10.1108/jeim-03-2026-0521", "authors": "Sudhanshu Maheshwari ほか", "venue": "Journal of Enterprise Information Management", "date": "2026-11-06", "sjr": 1.665, "citescore": 19.6, "citescore_year": "2025", "apa": "Maheshwari, S., Kaur, A., Malik, A., & Sethi, D. (2026). Less effort, less meaning? Authorship ambiguity and impostor-like experiences in GenAI-mediated knowledge work. Journal of Enterprise Information Management, 1–31. https://doi.org/10.1108/jeim-03-2026-0521", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Journal of Enterprise Information Managementの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "生成AIと共同で知的な仕事をする32人への深層面接から、成果のどこまでが自分の貢献かが曖昧になる「作者性の曖昧さ」が中心的な課題で、それが有能感の帰属、自己評価、仕事の意味を揺さぶることを示した（抄録）。", "p2": "人とAIの協働の研究は生産性と成果に偏り、生成AIとの共同生産を働き手がどう意味づけ、自分の貢献や有能さをどう捉えるかは十分に調べられていなかった（抄録）。", "p3": "生成AIを直接使う知識労働者32人への深層面接を、帰納的な符号化と仮説形成的な解釈を組み合わせたGioia法で分析し、意味づけ（センスメイキング）の観点から主題と集約的な次元を解釈した（抄録）。背景：Gioia法は、語りの概念を段階的にまとめて理論的な次元を作る質的分析の手順。", "p4": "分析の焦点は、生成AIが発想・分析・下書き・コーディングに関わるとき、働き手が自分の貢献をどう区別し、有能感・自己評価・有意味感をどう経験するかである（抄録）。", "p5": "作者性の曖昧さが中心的な課題として浮かび、反応は分かれた。判断・検証・文脈づけを中心に専門性を組み立て直した人は生成AIを能力の拡張と経験したが、成功した成果を自分の能力の証として内面化できない人は、インポスターのような経験と有意味感の低下を語った（抄録）。", "p6": "抄録の範囲では、対象者の職種・国の構成は確かめられない。著者は管理者に、人の判断を見える化し、生成AIの正当な使い方を明確にし、速さと質以外の貢献を認めることを提案する（抄録）。解釈：面接による質的研究で、こうした経験の広がりの大きさは測っていない。", "fun": "AIと一緒に作った企画書がほめられたとき、それは本当に自分の手柄なのか迷う人がいます。この研究で、AIを使う働き手の一部は、成果を自分の力と感じられず「自分は偽物ではないか」という気持ちや、やりがいの低下を語りました。一方で、AIの答えを判断し確かめる役こそ自分の専門だと捉え直した人は、AIを力の延長と感じていました。受け止め方で心への影響が分かれる点が面白いところです。", "unverified": "抄録のみ読んだ。対象者の属性と、反応の型ごとの人数は未確認。"}}, {"id": "jr09", "rank": 9, "headline": "拡張ボルツマン方程式から有限速度の熱と運動量の輸送", "title": "Structural viscosity, thermal waves, and the Mpemba effect from extended statistical dynamics", "url": "https://doi.org/10.1007/s00161-026-01542-9", "authors": "Patrick BarAvi", "venue": "Continuum Mechanics and Thermodynamics", "date": "2026-11-01", "citescore": 5.2, "citescore_year": "2025", "apa": "BarAvi, P. (2026). Structural viscosity, thermal waves, and the Mpemba effect from extended statistical dynamics. Continuum Mechanics and Thermodynamics, 38(6). https://doi.org/10.1007/s00161-026-01542-9", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "Research Squareに置かれたPDF版の本文（拡張位相空間と運動論§2.1、ムペンバ効果§5.1、比較§6.4、結論と付録Aの設定）を読んだ。数式の一部は変換で読み取りにくかった", "preprint": false, "p1": "流体の構成要素を点粒子ではなく、向き・角運動量・内部の変形モードを持つ広がった物体として扱う運動論の枠組み（拡張構造動力学、ESD）を作り、拡張した位相空間上のボルツマン方程式から、有限の速さで熱と運動量が伝わる輸送則を導いた（抄録、§2）。", "p2": "古典的な流体力学は点粒子の理想化に立つため、輸送方程式が放物型になって信号速度が無限になり、有限時間の緩和、異方的な輸送、フーリエの法則に従わない熱の現象を表せない（抄録）。背景：チャップマン–エンスコグ展開は、運動論の方程式から平衡からのずれの展開で流体の方程式を導く方法。", "p3": "一粒子の分布関数が、位置・運動量・向き・物体座標の角運動量・内部の変形モードからなる拡張位相空間上で、ポアソン括弧による流れと衝突項を持つ拡張ボルツマン方程式に従うとし（§2.1、式2.1–2.2）、BGK型の衝突の近似でチャップマン–エンスコグ展開して、渦度と向きの緩和をつなぐスピンの方程式とカッタネオ型の熱流束の緩和の方程式を得た（§3–4、付録A）。", "p4": "検証は理論の導出で、古典的な極限でナビエ–ストークスとフーリエの法則に戻ることを確かめ、マイクロポーラー流体、拡張不可逆熱力学、粒状体のJenkins–Richmanのモデルと特徴を比べ、温度の逆転（ムペンバ効果）と衝撃波の正則化の例を示した（§3.4、§4.3、§5–6）。新しい実験データは使っていない（宣言の節）。", "p5": "得られた方程式は、運動量と熱の有限の伝わる速さ、固有の衝撃波の正則化、異方的な輸送、熱の波を示し、並進と回転の2温度のモデルから、熱い系のほうが速く冷えるムペンバ効果を説明する道筋を示した（抄録、§5.1）。著者は、フーリエに従わない熱パルスや幅のある衝撃波などの「異常」は点粒子の理想化の帰結だと論じる（結論）。", "p6": "著者は、BGKの近似は輸送係数の粒子形状と緩和時間への依存性を正しく与えるが厳密な前因子やモード間の相関は与えず、回転の温度とリャプノフ不安定性の関係は導出ではなく物理的な見込みだとする（抄録）。定量的な完成と実験による検証は今後の課題とする（結論）。", "fun": "水や空気の流れの方程式は、分子を「大きさのない点」とみなして作られています。この研究は、分子にも向きや回転や形の変化があることを、位置と速さに加えて扱う広い「状態の空間」で考え直しました。すると、熱が波のように伝わることや、熱いお湯のほうが速く冷えることがあるという不思議な現象を、自然に説明する道筋が見えてきます。点を少しふくらませるだけで物理が広がる点が面白いところです。", "unverified": "数式の多くはPDFの変換で読み取りにくく、輸送係数の具体的な形は確認しきれていない。"}}, {"id": "jr10", "rank": 10, "headline": "二粒径の粒状流で縞状の分級が生じる仕組みを理論化", "title": "Transversely segregated longitudinal stripes in bidisperse granular flows", "url": "https://doi.org/10.1017/jfm.2026.12176", "authors": "Amber P. Pearse ほか", "venue": "Journal of Fluid Mechanics", "date": "2026-11-06", "sjr": 1.283, "citescore": 6.8, "citescore_year": "2025", "apa": "Pearse, A. P., Johnson, C. G., & Gray, J. M. N. T. (2026). Transversely segregated longitudinal stripes in bidisperse granular flows. Journal of Fluid Mechanics, 1046. https://doi.org/10.1017/jfm.2026.12176", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "Cambridge Coreの出版社HTML本文（序論、実験§6、結論§8）を読んだ", "preprint": false, "p1": "斜面を流れる二粒径の粒状流で、流れの向きにそろった逆回転の二次渦があると仮定し、大小の粒子が横方向に分級して安定な縞になる過程を、粒径分級の移流拡散モデルと、横方向の分級を表す深さ平均の理論で捉えた（抄録、§8）。", "p2": "薄く速い密な粒状流では流れの向きに縞ができ、二粒径の混合物では大粒子と小粒子の帯が流れの深さ全体に及ぶことが実験で示されていたが、二次渦のもとで縞がどう形成され、拡散がそれとどう競合するかは分かっていなかった（§1、§8）。", "p3": "粒径分級の移流拡散方程式に仮定した逆回転の二次渦の速度場を与え、断面内の2次元数値解を求めた（§2–3）。さらに横方向の拡散を含む深さ平均の分級理論と横断方向の1次元の深さ平均理論を導き、定常の「S」字形の界面の厳密解を得た（§4–5、式5.7、5.13）。具体例：二次渦は、大粒子が上・小粒子が下の鋭い界面を鉛直まで回転させ、純粋な大粒子と小粒子の帯に分ける（抄録）。", "p4": "長さ2.84m、側壁の間隔7.8cm、傾斜34.5°のシュートで、大きな緑（200〜250μm）と小さな白（60〜150μm）のガラス玉を30:70で混ぜた実験を行い、表面の粒径分布の流下方向の発達を2次元の深さ平均モデルの解と比べた（§6–7）。", "p5": "拡散がないと二次流は界面を鉛直まで回転させて、砕波型の分級波で隔てられた大小の帯を作るが、拡散と二次循環がつり合う領域では安定な波打つ界面ができ、表面の組成の差を抑えうる（抄録）。(Pe, Λ)=(500, 100)の例で深さ平均理論は非深さ平均の解の界面の変化をほぼ正確に捉え、表面の粒径分布の変化は実験とよく一致した（§8、抄録）。", "p6": "二次渦の存在と形は仮定であり、その発生の仕組み（膨張や第2法線応力差の可能性）はなお研究途上だと著者は述べる（抄録）。解釈：密度の同じガラス玉の実験に基づくため、密度差や形状の違う自然の土砂への適用には検証が要る。", "fun": "大きさの違う砂粒を斜面に流すと、普通は大きな粒が上に、小さな粒が下に分かれます。ところが条件によっては、流れの向きにそって大粒と小粒の縞模様ができ、その縞は流れの底まで続いています。この研究は、流れの中に目に見えない渦の列があると考えると、この不思議な縞ができる様子を数式で再現できることを示しました。砂の流れにも見えない渦の仕組みが隠れている点が面白いところです。", "unverified": "実験と理論の一致の度合いの定量的な指標は確認していない。"}}, {"id": "jr11", "rank": 11, "headline": "政治的議論の分類でLLMと人の一致は中程度", "title": "Explaining alignment between LLM classifications of political arguments and human judgments", "url": "https://doi.org/10.1007/s10791-026-10793-8", "authors": "Maud Reveilhac ほか", "venue": "Discover Computing", "date": "2026-11-05", "citescore": 2.0, "citescore_year": "2025", "apa": "Reveilhac, M., & Trembovelskyi, B. (2026). Explaining alignment between LLM classifications of political arguments and human judgments. Discover Computing, 29(1). https://doi.org/10.1007/s10791-026-10793-8", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "Springerの出版社PDF本文（データと方法§4、結果§5、限界§6.2と表・図のキャプション）を読んだ", "preprint": false, "p1": "スイスの国民投票の議論600件を、証拠に支えられた議論と修辞・価値に基づく議論に分ける作業で、4つのLLMの分類が人の判断とどの程度、どんな言語的特徴のもとで一致するかを示し、LLMの説明は推論の証拠ではなく事後的な合理化として読むべきだとした（抄録、§6）。", "p2": "政治的な議論の分類など市民的な課題でLLMの利用が広がっているが、いつLLMの分類が人の判断と一致し、その一致を何が説明するのかは分かっていなかった（抄録、§1）。", "p3": "1977〜2016年のスイスの国民投票の議論600件（フランス語とドイツ語）を人が2段階の裁定で正当化の種類に注釈し、GPT・DeepSeek・LLaMA・Mistralにゼロショットで分類させ（5回の多数決）、一致・不一致を、長さ、数値表現、限定の表現、可読性、因果の標識、否定、強調語などを説明変数とするロジスティック回帰で分析した（§4、表4）。", "p4": "評価は、人の合意ラベルとの一致率（正解率ではなく一致として扱う）、5回の実行での出力の安定性、一致の説明要因（疑似R²と変数重要度）、全モデルが外れた事例の質的な検討で行った（§4.4、§5、表3・5）。", "p5": "議論の種類の一致率は、GPTで0.76（仏）・0.75（独）、DeepSeekで0.72・0.74、LLaMAで0.65・0.68、Mistralで0.78・0.75で、LLaMAとMistralは5回の出力の安定性が0.34〜0.46と低かった（表5）。回帰の疑似R²は0.12〜0.26で、全モデルに共通して有意な説明変数はなかった（§5、図1–2）。", "p6": "著者は、人の注釈は解釈を伴う合意の基準で客観的な正解ではなく、2値の分類は議論を単純化し、言語的特徴は議論の質の代理にすぎず、ゼロショットのプロンプトは結果を不安定にすることを限界に挙げる（§6.2）。解釈：モデルごとに一致の理由が異なるため、熟議の評価に使う場合はモデルごとの検証が要る。", "fun": "「この意見は証拠にもとづくか、気持ちや価値観に訴えるものか」をAIに見分けさせると、人とかなりの割合で一致しました。でも、なぜ一致したかはAIごとにばらばらで、同じ質問を5回しても答えが変わるAIもありました。AIが付ける「理由」も後からのこじつけとして読むべきだという指摘が、AIを議論の採点に使うときの大事な注意として面白いところです。", "unverified": "個々の説明変数の係数の大きさは確認していない。"}}, {"id": "jr12", "rank": 12, "headline": "気候対応の報道の論調が翌年の売上と企業価値に関連", "title": "Investigating Associations Between Media Sentiment Surrounding Climate Change Engagement (SDG 13) and Performance Measures: A Study of FTSE 100 Listed Firms", "url": "https://doi.org/10.1002/bse.71807", "authors": "Liane W. Y. Lee ほか", "venue": "Business Strategy and the Environment", "date": "2026-11-06", "sjr": 3.678, "citescore": 23.8, "citescore_year": "2025", "apa": "Lee, L. W. Y., Barnes, B. R., & Krasnikov, A. V. (2026). Investigating Associations Between Media Sentiment Surrounding Climate Change Engagement (SDG 13) and Performance Measures: A Study of FTSE 100 Listed Firms. Business Strategy and the Environment. https://doi.org/10.1002/bse.71807", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Business Strategy and the Environmentの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "FTSE100の企業について、気候変動への対応（SDG13）に関する報道の論調が翌年の業績と関連するかを2013〜2022年の406,052件の記事から調べ、否定的な報道は売上・純利益・トービンのQの低さと、肯定的な報道は売上とトービンのQの高さと関連することを示した（抄録）。", "p2": "企業の気候対応の報道が評判と業績にどう結びつくかは、統合思考の観点から十分に検証されていなかった（抄録）。背景：トービンのQは企業の市場価値を資産の再取得費用で割った比率で、企業価値の指標。", "p3": "新しい書誌学的なキーワード抽出の方法で企業ごとのSDG13関連の報道の正負の論調を特定し、一般化モーメント法（GMM）で推定する動的パネルモデルで翌年の業績との関連を調べた（抄録）。", "p4": "業績の指標は売上・純利益・トービンのQで、論調と業績の関連を、制度理論と利害関係者理論をつなぐ統合思考の枠組みで解釈した（抄録）。", "p5": "SDG13に関する否定的な報道は売上・純利益・トービンのQのいずれとも負に関連し、肯定的な報道は売上とトービンのQの改善と関連した（抄録）。効果の大きさの数値は抄録に記載がない。", "p6": "抄録の範囲では、論調の分類の妥当性の確認や、業績から報道への逆の因果への対処は確かめられない。解釈：示されたのは関連であり、報道が業績を左右したとまでは言えない（著者も「関連」と表現している）。", "fun": "会社が地球温暖化対策で褒められたり批判されたりする報道は、会社のもうけに関係するのでしょうか。この研究は、イギリスの大企業について膨大な数の記事の論調を調べ、批判的な報道が多い会社ほど翌年の売上や企業価値が低い傾向を見つけました。新聞の空気と会社の成績がつながっている点が面白いところです。", "unverified": "抄録のみ読んだ。論調の分類の方法と、効果の大きさの数値は未確認。"}}, {"id": "jr13", "rank": 13, "headline": "AI生成広告は真正性の低いブランドで購買意図を高める", "title": "The AI trust paradox: how disclosure, brand authenticity and consumer mindset shape communication effectiveness", "url": "https://doi.org/10.1108/intr-12-2025-2025", "authors": "George Chung-Chi Shen ほか", "venue": "Internet Research", "date": "2026-11-06", "sjr": 2.207, "citescore": 14.8, "citescore_year": "2025", "apa": "Shen, G. C.-C., & Huang, W.-H. (2026). The AI trust paradox: how disclosure, brand authenticity and consumer mindset shape communication effectiveness. Internet Research, 1–21. https://doi.org/10.1108/intr-12-2025-2025", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Internet Researchの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "AIが生成した広告の画像の効果を、生成の由来（AIか本物か）、AI利用の開示、ブランドの真正性、消費者の思考の抽象度の組み合わせで3つの実験により調べ、効果は戦略的な適合しだいであることを示した（抄録）。", "p2": "AI生成のコンテンツには、効率の良さと真正性の欠如の知覚がぶつかる「信頼の逆説」があり、どんな条件で広告の効果を高め、または損なうのかは分かっていなかった（抄録）。背景：解釈レベル理論では、心理的に遠い対象は抽象的に、近い対象は具体的に捉えられる。", "p3": "情報源の信憑性理論と一致性理論を統合し、研究1で広告の由来と開示を操作して関与を、研究2でブランドの真正性の調整効果を購買意図で、研究3でAIの訴求（快楽的か実用的か）と消費者の解釈レベルの一致を検証した（抄録）。", "p4": "評価の指標は関与（エンゲージメント）と購買意図で、静止画を使ったオンラインの統制された実験で比べた（抄録）。標本の大きさは抄録に記載がない。", "p5": "本物の画像は全体にAI生成の画像より効果が高かった。開示は本物の広告の関与を高めたが、AI生成の広告の関与は下げた。AI広告は真正性の低いブランドでは購買意図を高めたが、真正性の高いブランドでは損ねた。快楽的なAI訴求は抽象的な思考の、実用的な訴求は具体的な思考の消費者に合った（抄録）。", "p6": "著者は、静止画とオンラインの統制された場面での実験で、動画やマルチモーダルなAIコンテンツと、クリック率や購入率などの実際の行動の指標での検証が必要とする（抄録）。", "fun": "広告にAIが作った写真を使うと、本物の写真より効果は落ちるのでしょうか。この研究では、全体としては本物が強い一方、真正性の評価が低いブランドではAIの写真がかえって購買意欲を高め、伝統を売りにするブランドでは逆効果になりました。また「AIで作りました」と書くと、AIの広告では効果が下がりました。正直さが常に得とは限らないという複雑さが面白いところです。", "unverified": "抄録のみ読んだ。各実験の標本の大きさと効果の大きさは未確認。"}}, {"id": "jr14", "rank": 14, "headline": "高齢者にやさしい環境づくりの証拠を網羅した地図", "title": "Mega-Map of Systematic Reviews and Evidence and Gap Maps on Interventions and Programs for Age-Friendly Environments", "url": "https://doi.org/10.1177/18911803261496874", "authors": "Amanda Fernandes ほか", "venue": "Campbell Systematic Reviews", "date": "2026-11-06", "sjr": 2.46, "citescore": 14.0, "citescore_year": "2025", "apa": "Fernandes, A., Lafortune, L., Nhandara, R., Katairo, T., Guo, N., Rafoss, A. B., Shankar, A., Tanjong Ghogomu, E., Dabelko-Schoeny, H., Ji, J. S., van Hoof, J., Perracini, M. R., Choi, M., Shousha, T., Hartland, T., Nduku, P., Ravat, Z., & Hérick de Sá, T. (2026). Mega-Map of Systematic Reviews and Evidence and Gap Maps on Interventions and Programs for Age-Friendly Environments. Campbell Systematic Reviews: Better Evidence for a Better World, 22(4). https://doi.org/10.1177/18911803261496874", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Campbell Systematic Reviewsの抄録（構造化抄録、Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "WHOの高齢者にやさしい都市と地域（AFCC）の8領域の介入とプログラムについて、1,542の系統的レビューと3つの証拠と空白の地図を集めたメガ・マップを作り、証拠の偏りと空白を示した（抄録）。", "p2": "高齢者にやさしい都市と地域づくりは広く採用された戦略だが、関係者が証拠を見つけて使うための包括的な証拠の地図と、研究の空白の体系的な評価がなかった（抄録）。", "p3": "系統的レビューと証拠の地図だけを対象に、18の学術データベースと23の組織のウェブサイトを含む40を超える情報源を2024年8月まで（AgeInfoは2025年10月まで）言語の制限なく検索し、中国語の検索も加え、標準化した符号化の道具で抽出し、迅速な評価の決定木でレビューの質を評価して、対話型のオンラインの地図にまとめた（抄録）。", "p4": "対象は都市・郊外・農村の50歳以上の成人で、介入を8領域・実施の水準・手段で、結果を中間的な結果、内在的な能力、機能的な能力、後期の健康、経済的な影響に分類し、公平性への注目（PROGRESS-Plus）も符号化した（抄録）。", "p5": "2002〜2025年の1,545件が含まれ、1,468件が低質、74件が高質と評価された。証拠は「地域の支援と保健サービス」（低質1,410件、高質65件）に集中し、交通（低質8件）、市民参加と雇用（低質7件）、尊重と社会的包摂（低質21件、高質4件）は乏しく、AFCCプログラムそのもののレビューは低質の2件だけだった（抄録）。", "p6": "著者は、AFCCプログラム、国・地方の水準の介入、経済的な結果、公平性、低中所得国と農村の証拠が不足しているとする（抄録）。解釈：レビューを地図にしたもので、介入の効果の大きさそのものは統合していない。", "fun": "お年寄りが暮らしやすい町をつくる取り組みは世界中で研究されていますが、どこに証拠がそろい、どこが手つかずなのかは見えていませんでした。この研究は1,545件のまとめの論文を一枚の地図に整理し、医療や介護の研究は山ほどある一方、交通や働く場、人として尊重されることの研究はほとんどないことを示しました。知識の空き地を見える化した点が面白いところです。", "unverified": "抄録のみ読んだ。地図の分類の詳細と、レビューの質の評価の基準は未確認。"}}, {"id": "jr15", "rank": 15, "headline": "地震計の列で土石流から高濃度流への遷移を捉えた", "title": "Seismic Evidence of the Transition from Debris Flow to Hyperconcentrated Flow at Mount Rainier, USA", "url": "https://doi.org/10.1785/0220260021", "authors": "Katherine M. Biegel ほか", "venue": "Seismological Research Letters", "date": "2026-11-06", "citescore": 6.0, "citescore_year": "2025", "apa": "Biegel, K. M., Collins, E. A., Allstadt, K. E., Conner, A., Thomas, A. M., Thelen, W., Iezzi, A. M., Beason, S., & Todd, C. (2026). Seismic Evidence of the Transition from Debris Flow to Hyperconcentrated Flow at Mount Rainier, USA. Seismological Research Letters. https://doi.org/10.1785/0220260021", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Seismological Research Lettersの抄録（Crossref登録）を使用し、本文は入手できず", "preprint": false, "p1": "2023年8月15日に氷河の決壊で起きたマウント・レーニア（米国）のタホマ川の土石流を、流路に沿って100〜200m間隔で並べた地震計で記録し、土石流から高濃度流への遷移を地震の信号の変化として捉えた（抄録）。", "p2": "土石流はこの川の季節的な災害だが、流れの性状が途中でどう変わるかを流路に沿って連続的に捉えた観測は限られ、土石流の多くの物理モデルは単純な前提を置いていた（抄録）。背景：高濃度流は土石流より土砂濃度が低く、両者は体積の土砂濃度や降伏強度などのレオロジーの基準で区別される。", "p3": "氷河の源から約2.5kmの約800mの区間で、土石流が約24,000m³の土砂を堆積させる間の地震記録を、流れの先端に対応する信号の立ち上がりの形、立ち上がりから最大振幅までの遅れ、卓越周波数、20Hz以下のエネルギーの変化で分析した（抄録）。", "p4": "評価の手がかりは流下に沿った地震信号の形と周波数の系統的な変化で、それを堆積による粒径と土砂濃度の変化と対応づけた（抄録）。", "p5": "堆積が進むと先端に対応する信号の立ち上がりの形が後退し、立ち上がりから最大振幅までの遅れが100秒から300秒に伸び、卓越周波数は20Hz以上高くなり、2
