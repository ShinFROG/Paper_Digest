もかかっていた。この研究は、直し方を「たくさんのスイッチを、入れるか切るか」というパズルに書き直した。磁石の向きがそろう様子を表す物理の模型と同じ形のパズルで、古くからある解き方が使える。結果は、1ドル足らずで、AIに任せた場合より良く直った。問題の書き直し方ひとつで費用が桁違いに変わる例である。", "unverified": "状態木による重みの表現（§3.1）、目的関数の切除実験（§4.5）、量子プロセッサでの実行（§6）の詳細は読んでいない。"}}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "横断面比較の動学効果の偏りをパネルLP-IVで除く", "title": "Hedging out the HEDGE Bias: Identifying Dynamic Partial-Equilibrium Effects with Panel LP-IV", "url": "https://arxiv.org/abs/2611.14434", "authors": "Endong Wang ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Wang, E., & Zhang, R. (2026). Hedging out the HEDGE Bias: Identifying Dynamic Partial-Equilibrium Effects with Panel LP-IV (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14434", "why": "集計的な処置の部分均衡効果を横断面の設計で推定すると、処置への曝露と集計的な交絡要因への曝露が相関する場合や交絡が処置に跳ね返る場合に偏ることを解析的に示した。曝露で重みづけたショックの代理変数で処置と交絡の経路を操作変数にするHELP-IVを提案し、州の財政乗数と株式資産効果に適用すると従来より小さい効果が得られた。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、実証の§6.1・§6.2の主要部分、表3・表5、結論§7）を読んだ。識別の証明、拡張（§3）、推論（§4）、シミュレーション（§5）の詳細は読んでいない", "preprint": true, "p1": "地域や企業の「曝露の違い」を使って集計的なショックの動学的な部分均衡効果を推定する標準的な設計が偏る条件を明らかにし、その偏りを取り除く回帰の枠組みHELP-IVを示した（抄録、§7）。", "p2": "この種の研究は、単位と時点の固定効果を入れた操作変数つき局所射影（TWFE-IV）を使い、時点効果が金融政策などの集計的な交絡を吸収すると仮定する。しかし時点効果が吸収するのは全単位に共通の部分だけで、処置への曝露が大きい単位ほど交絡にも敏感な場合や、交絡が処置に跳ね返る場合は偏る（§1）。", "p3": "各時点先hについて、結果を「曝露×処置」と「曝露×交絡要因のt期からt+h期までの経路」に回帰し、それぞれを「曝露×ショックの代理変数」で操作変数にする。h+2個の係数をh+2個のモーメント条件で識別し、経路の統制の係数を消す一次結合を取ることで、交絡の経路を固定した実験での効果が得られる（§1）。複数の曝露、複数の交絡、先読みする結果などへ拡張する（§7）。", "p4": "シミュレーションで、推定量が目標の効果を中心に分布するか、推論の被覆率が適切かを確かめる（§7）。実証では、米国46州の1969〜2007年の国防支出のパネルによる州の財政乗数と、株式資産ショックの地域への効果を、従来の推定と比べる（§6.1、§6.2）。", "p5": "累積の財政乗数は、従来のシフトシェアIVで1年後1.06、4年後2.35に対し、金利の経路を固定するHELP-IVでは0.66、1.69と小さい。複数の交絡を許す版ではさらに小さく0.21〜0.64だった（表3）。株式資産効果では、非貿易部門の賃金総額の係数から導く資産の限界消費性向が、1ドルあたり年3.2セントから0.8セントに下がり、構造モデルへの含意も変わる（表5、§6.2）。", "p6": "識別は、処置と交絡の両方のショックに妥当な代理変数があることに依存する。先読みの環境で代理変数が金利の経路を完全には相殺しない場合、推定は情報に制約された効果を測るにとどまる（§6.1）。異質な処置効果、単位間の連関、状態依存の動学への拡張は今後の課題とされる（§7）。乗数の標準誤差は大きい（表3）。", "fun": "国が軍事費を増やすと、軍需工場の多い州の景気は、少ない州よりどれだけ良くなるか。州どうしを比べれば、全国共通の影響は差し引かれて消える、と考えられてきた。ところが、たとえば金利が動くと、軍需の多い州ほど金利にも敏感かもしれない。すると「共通だから消える」はずの影響が、差の中に残ってしまう。この論文は、その残り方を式で示し、消し方を回帰の工夫として与えた。直すと、効果の推定値はかなり小さくなった。", "unverified": "識別の命題の正確な仮定、シミュレーションの数値、株式資産効果の推定の詳細（表4）は確認していない。"}}, {"id": "pn04", "rank": 4, "field": "因果推論", "headline": "表形式基盤モデルで媒介分析の信頼区間を償却推論", "title": "MediPFN: Amortized In-Context Nuisance Learning and Inference for Causal Mediation Analysis", "url": "https://arxiv.org/abs/2611.13219", "authors": "Shi Bo ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Bo, S., & Hu, J. (2026). MediPFN: Amortized In-Context Nuisance Learning and Inference for Causal Mediation Analysis (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13219", "why": "事前学習した表形式基盤モデルを条件付き平均と傾向スコアの推定に使い、交差適合した影響関数推定量で組み合わせて因果媒介分析を行う。推定量の標準化誤差の分位点を、間接効果が既知の模擬データから別のヘッドで学習して信頼区間を作り、被覆率の限界を示した。ブートストラップより59.1倍速いと報告する。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、構造と学習§3.2、評価の設計§4.1、結果§4.2、切除とストレステスト§4.3、考察）を読んだ。識別の節（§2）、被覆率の上下界の証明、付録は読んでいない", "preprint": true, "p1": "事前学習済みの表形式基盤モデルを因果媒介分析の部品として使い、間接効果の点推定だけでなく、名目に近い被覆率を持つ信頼区間を、ブートストラップなしで速く作れるようにした（抄録、§5）。", "p2": "影響関数に基づく半パラメトリックな推定は、処置の割当て・媒介変数の分布・結果の応答という局外関数を研究ごとに当てはめる必要があり、それらの推定誤差の伝わり方で不確実性が決まる。表形式基盤モデルは局外関数の学習を使い回せるが、そこから妥当な信頼区間を作る方法が課題だった（§1）。", "p3": "TabPFNの重みは固定したまま、入力の調整と出力の調整だけを学習して、傾向スコアと条件付き平均の推定に適応させ、交差適合した影響関数推定量で組み合わせて間接効果を推定する。別のヘッドが、間接効果が既知の合成の表から、推定量の標準化誤差の分位点を学習し、教師つき微調整、区間の対称化、独立した較正を経て信頼区間を作る（§3.2、図1）。", "p4": "標本数200・600・1000の合成の表1,152個（学習と同じ系統、未使用の系統、未使用の組合せ）と、実データの共変量を使った半合成の表で、名目95%に対する被覆率、区間の長さ、点推定の誤差、計算時間を、線形の構造方程式モデル、ランダムフォレスト、元のTabPFNなど5手法と比べる（§4.1）。", "p5": "被覆率は合成の3設定で94.01%、92.97%、91.67%、実共変量で94.14%と、比較手法の中で95%に最も近かった。元のTabPFNは99.72%以上を覆うが区間が長く、提案法の区間はそれより約84〜91%短い。線形の構造方程式モデルは区間が短いが被覆率が低い（78.48%など）（表1、図2）。ブートストラップより59.1倍速い（抄録）。", "p6": "標本が小さいと被覆率が下がる（実共変量の評価で標本数200のとき88.55%）。未使用の組合せへの移行でも名目を下回る（91.67%）。評価は合成・半合成のデータが中心で、被覆率の保証は標準的な仮定のもとでの上下界である（§4.3、§3.3）。実際の研究データでの検証は示されていない。", "fun": "ある処置が効くのは、途中の指標が変わるからなのか、それ以外の道筋なのか。この「途中の道筋」の効果を見積もるとき、答えの数字だけでなく「どのくらい確かか」という幅も必要になる。従来は、データを何度も作り直して計算をやり直すことで幅を出していた。この研究は、あらかじめ正解の分かった練習問題を大量に解かせて「自分の答えがどのくらい外れるか」を覚えさせ、一回の計算で幅まで出せるようにした。自分の間違い方を学ぶAIである。", "unverified": "識別の仮定（§2）、被覆率の上下界の式（§3.3）、付録の追加結果と計算時間の内訳は確認していない。"}}, {"id": "pn05", "rank": 5, "field": "機械学習", "headline": "重みを更新せず文脈だけでロボット操作を学ぶ", "title": "World In-Context Learning for Agentic Robot Manipulation", "url": "https://arxiv.org/abs/2611.12885", "authors": "Heng Fang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-11", "apa": "Fang, H., Guo, Z., Zhang, Y., Du, M., Liang, D., & Bai, X. (2026). World In-Context Learning for Agentic Robot Manipulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12885", "why": "凍結したモデルが1回の実演から出発し、シミュレータで課題を予行して得たフィードバックを重みでなく文脈（タスクメモリ）に書き込む学習の枠組みを提案した。RoboTwin 2.0の50課題で、課題ごとに実演1回・勾配更新なしで平均成功率83.4%となり、学習済みの行動方策の最良を20ポイント以上上回ったと報告する。", "explain": {"basis": "本文", "basis_note": "arXiv版のPDF本文（手法の概要と主な発見、実機への展開、結論、付録の限界）を読んだ。実験の表と付録の詳細は読んでいない", "preprint": true, "p1": "ロボットの操作技能を、ニューラルネットの重みに書き込む代わりに、凍結した基盤モデルの「文脈」に書き込む学習の枠組み（World In-Context Learning）を提案し、実演1回と模擬環境での予行だけで、学習済みの行動方策を上回る成功率を得た（抄録、Conclusion）。", "p2": "学習した行動方策は技能を重みに書き込むため、学習した分布に縛られる。文脈内学習はこの縛りを避けられるが、別の場面で記録した実演には、いまロボットが向き合う世界からのフィードバックが含まれず、学習済みの方策に及ばなかった（抄録）。", "p3": "凍結したモデルが実演から出発し、シミュレータなどの「世界」で課題を予行して、その結果を重みでなく文脈（タスクメモリ）に書き込む。文脈に蓄えるのは見た目でなく、課題の手順や物体の役割といった意味的な知識なので、別の世界に移せる。行動するエージェントは実機でも得られる入力（深度つきのカメラ画像と自己受容感覚）だけを見て、シミュレータの特権的な情報は学習時の教師にだけ使う（Method、図2）。", "p4": "RoboTwin 2.0の全50課題で、通常の場面と無作為化した場面の平均成功率を、50回の実演で学習した行動方策と比べる。基盤モデルを替えた場合、振り返りの効果、実機の双腕ロボットへの移行も調べる（Method、Experiments）。", "p5": "課題ごとに実演1回・勾配更新なしで平均成功率は83.4%で、最も強い学習済みの方策の61.7%を上回った。学習済みの方策は無作為化のもとで元の成功率の最大65.1%しか保てないが、提案法は同程度の成功率を保つ（Method）。実機では4課題を各10回試し、10回中10回、7回、7回、6回成功した（Real-Robot Deployment）。", "p6": "著者は、商用の基盤モデルのAPIに依存し、提供側の品質の変動で成功率が数ポイント動くこと、1回の評価に平均54.7回のモデル呼び出しを要し、学習済みの方策より推論が遅いことを限界として挙げる（付録 Limitations）。実機の検証は4課題・各10回と小さい。", "fun": "ロボットに仕事を教えるには、何十回も手本を見せて、頭の中の配線を書き換えるのが普通である。この研究のロボットは配線を一切変えない。手本を一度見たあと、仮想の世界で自分でやってみて、「こうしたら失敗した」「この順番ならうまくいった」という気づきを、覚え書きにためていく。本番ではその覚え書きを読みながら動く。覚えるのは体の動かし方でなく作業の意味なので、覚え書きは体つきの違う別のロボットにも渡せた。", "unverified": "課題別の成功率の表、切除実験、振り返りの効果の数値は確認していない。限界の節は取得したテキストでは途中で切れている。"}}, {"id": "pn06", "rank": 6, "field": "因果推論", "headline": "処置をまとめた操作変数推定が何を識別するか", "title": "Instrumental variables with treatment clusters", "url": "https://arxiv.org/abs/2611.13313", "authors": "Didier Nibbering ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Nibbering, D., Oosterveen, M., & Silva, P. L. (2026). Instrumental variables with treatment clusters (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13313", "why": "順序のない多数の処置をいくつかの群にまとめて2値処置として操作変数法を使う慣行について、まとめる前の処置の水準での仮定のもとで、局所平均処置効果の加重平均が識別されることを示した。まとめる前の選択のデータがあれば因果的解釈の必要条件を検定でき、専攻分野の効果の例で示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、2群の結果§6.2.1と表5、結論§7）を読んだ。理論の節（§2〜§5）の定理と証明、8群の結果は読んでいない", "preprint": true, "p1": "順序のない多数の処置（専攻分野など）をいくつかの群にまとめて操作変数法を使ったとき、推定されるものが何であるか、どんな仮定があれば因果的に解釈できるかを明らかにした（抄録、§7）。", "p2": "研究者はSTEMと非STEMのように処置を群にまとめ、群を2値の処置とみなして、群の水準で操作変数の仮定を置くことが多い。しかし個人は群の中の個々の処置を選ぶので、操作変数は群の間だけでなく群の中の選択も動かしうる。群の水準だけで考えると、仮定の違反が見えないままになる（§1）。", "p3": "処置と操作変数がともに同じ値の集合を持つ順序のない多値変数である設定で、まとめる前の処置の水準で置いた仮定のもと、群の水準のIV推定量が、二つの群にまたがるすべての処置の対と、対応するすべての操作変数の値についての局所平均処置効果（LATE）の加重平均を識別することを示す。まとめる前の処置のデータがあれば検定できる必要条件も導く（§1）。", "p4": "ポルトガルの公立高等教育の4つの入学年次の行政データで、合格点の境界を使うファジーな回帰不連続デザインから操作変数を作り、専攻の群が取得単位数に与える効果を、STEM対非STEMの分類と、国際標準教育分類による8つの群で推定する（§1）。", "p5": "STEMを非STEMより好む学生では、STEMへの入学が2年目の取得単位を平均3.15単位減らし、非STEMを好む学生では非STEMへの入学が1.33単位増やした。この推定値は、STEMの8分野と非STEMの14分野にまたがる12,544個のLATEの加重平均と解釈できる。境界を超えて合格の通知を受けることは、入学確率をそれぞれ88ポイント、82ポイント上げた（§6.2.1、表5）。", "p6": "加重平均の重みそのものを識別するには、追加の制約が要る（付録Bの見出しによる）。まとめる前の処置のデータがなければ、必要条件の検定はできない。実証は一つの国の高等教育の事例である（§7）。", "fun": "「理系に進むと、文系に進むより単位が取りにくくなるか」を調べたいとする。ところが「理系」の中には物理も情報もあり、「文系」にも多くの分野がある。ひとまとめにして比べた答えは、いったい何と何を比べた結果なのか。この論文は、それが一万通りを超える「分野対分野」の比較を混ぜ合わせた平均であることを示した。まとめて比べることは便利だが、何を平均しているのかを知らないと、答えの意味を取り違える。", "unverified": "定理の正確な仮定、検定の方法（§4）、8群の推定結果（§6.2.2）、付録の識別の結果は確認していない。"}}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "関税は仕入先を通じて輸入しない企業にも及ぶ", "title": "Trade Wars on the Income Statement: The Effects of Tariffs on Firms", "url": "https://doi.org/10.2139/ssrn.7683087", "authors": "Omar Barbiero ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Barbiero, O., Sheremirov, V., Silva, A., & Stein, H. (2026). Trade Wars on the Income Statement: The Effects of Tariffs on Firms. https://doi.org/10.2139/ssrn.7683087", "why": "2018年と2025年の米国の関税への企業別の曝露を、自社の輸入・仕入先の輸入・報復関税の3経路で作り、四半期財務諸表で効果を推定した。2025年は費用面の曝露が3四半期以内に売上高と売上原価を同程度（直接輸入企業の平均で約1.2%、仕入先経由で0.5%）減らし、企業は利幅を削らず価格転嫁と生産縮小で対応した。報復関税は粗利益率を圧縮した。", "explain": {"basis": "本文", "basis_note": "オープンアクセス版（ボストン連銀のワーキングペーパー）のPDF本文（序論、推定の方法§6.1、結果の冒頭§6.2、結論§8、図表の説明）を読んだ。曝露の指標の作り方と記述統計、理論的な含意（§7）は読んでいない", "preprint": true, "p1": "2018年と2025年の米国の関税が、上場企業の売上・原価・利益にどう及んだかを、企業ごとの曝露を自社の輸入、仕入先の輸入、報復関税の3経路で測って推定した（抄録、§8）。", "p2": "関税の負担はふつう品目・国境・産業の水準で測られるが、経済的に意味のある影響の多くは企業の内部で決まる。企業は一部を輸入し、関税の影響を受ける国内の仕入先からも調達し、報復の対象となる市場でも売る。これらを合算した企業の実際の財務成績への影響は十分に調べられていなかった（§1）。", "p3": "船荷証券による品目・国別の輸入データを財務諸表と親会社の水準で結び、企業間の供給網のデータと地域別の売上のデータを加えて、3経路の曝露の指標を作る。各時点先について、売上・売上原価・両者の比・EBITDAの変化を、企業の固定効果と産業×時点の固定効果を入れた局所射影で、3つの曝露に同時に回帰する（§1、§6.1）。", "p4": "四半期の財務諸表を使い、2つの局面を別々に推定する。曝露の指標は、株価の反応と決算説明会での論調で妥当性を確かめた（§8）。係数は平均的な曝露を持つ企業に対する効果として表す（§6.2）。", "p5": "2025年の局面は、直接の輸入費用のショックとして2018年の約10倍の大きさだった。2025年には、輸入費用と仕入先費用の曝露がそれぞれ、平均的な曝露の企業の売上と変動費を約0.4〜1.3%減らし、両者の比は変わらなかった。企業は利幅でなく数量で利益を失ったことになる。報復関税だけは、売上が減るのに原価が減らず、粗利益率が圧縮された。2018年の局面では、どの経路もほとんど効果がなかった（§8）。", "p6": "輸入データは海上輸送が中心でカナダからの陸路・空路の輸入を含まず、輸入の集約度は下限になる（§1の脚注）。対象は上場企業に限られる。設備投資はショックの2四半期後まで反応が見られない（§8）。名目値での分析である（§6.1）。", "fun": "関税は「輸入した会社が払う税」だが、影響はそこで止まらなかった。自分では何も輸入していない会社も、仕入先が輸入品を使っていれば、値上がりした部品を買うことになる。こうして関税は取引の鎖を伝って広がっていた。もう一つの発見は、会社が利幅を削って耐えたのではなく、値段に上乗せして、その分売れる量が減ったことである。関税の負担が最後に誰に行くのかを、会社の決算書から読み解いた研究である。", "unverified": "時点先ごとの係数の図、曝露の記述統計（§4）、妥当性の検証の数値（§5）は確認していない。抄録の数値（約1.2%、0.5%）と結論の範囲（約0.4〜1.3%）の対応の詳細も未確認。"}}, {"id": "pn08", "rank": 8, "field": "統計学", "headline": "末尾平均SGDのリスクの上界と下界の隙間を解消", "title": "Settling the Burn-in Gap: Sharp Risk Bounds for Tail-Averaged SGD in Linear Regression", "url": "https://arxiv.org/abs/2611.13383", "authors": "Qingyue Zhao ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Zhao, Q., Li, X., & Gu, Q. (2026). Settling the Burn-in Gap: Sharp Risk Bounds for Tail-Averaged SGD in Linear Regression (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13383", "why": "高次元線形回帰での一定ステップ幅のオンラインSGD（末尾平均）について、初期値を明示した一致する上界と下界を、軌跡のスペクトル条件のもとで示した。従来の上界は初期誤差の寄与を減衰なしで残し、下界は落としていたが、初期の4次モーメントのエネルギーが遅いモードに散って平均区間まで残ることを示し、両者の緩さを明らかにした。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、標準的な設定での比較§4.3の冒頭、結論§6）を読んだ。定理の正確な式と証明（§4.1、§5、付録）は読み込んでいない", "preprint": true, "p1": "高次元の線形回帰を、一定のステップ幅のオンライン確率的勾配降下法（SGD）と末尾平均で解くときの超過リスクについて、初期値の影響まで明示した上界と下界を一致させ、既存の解析の間にあった隙間を埋めた（抄録、§6）。", "p2": "末尾平均は、最初の反復を「慣らし」として捨て、その後の反復を平均する方法で、初期誤差を速く減らせる。先行研究の上界は、固有値の大きい方向（ヘッド）の初期誤差の寄与を減衰なしで残し、下界はその寄与を完全に落としていて、両者は一致していなかった（抄録、§1）。", "p3": "母集団の共分散の固有値の並びと初期値のずれで表す、インスタンスに依存したスペクトルの枠組みを使う。4次モーメントを通じた軌跡のフィードバックの累積を「スペクトル・フィードバック比」で抑える条件を置き、そのもとで上界と下界を導く（§6）。直観：ヘッドの初期誤差のうち、速いモードを一度だけ通る寄与は慣らしの間に指数的に減るが、初期の数歩で遅いモードへ散らされた4次のエネルギーは、減衰せずに平均の区間まで残る（抄録）。", "p4": "理論の論文で、評価は証明による。条件が成り立つ具体的な場合として、任意の固有値の並びと有限の反復数に対する（反復数に依存する）ステップ幅と、べき的に減衰する固有値に対する（反復数によらない）一つのステップ幅の二つを示す（抄録、§6）。先行研究の下界との差は、1次元と2次元の分離の構成例で示す（抄録）。", "p5": "慣らしの長さが平均の長さと同じオーダーの標準的な設定で、有効バイアスと有効分散の一致する上下界が得られた（§4.3、系4.5）。2次元のガウス分布の構成例では、先行研究の下界に対して「指数的対べき的」な差があることを示し、スカラーの構成例では、4次モーメントの仮定だけでは漸近的な指数減衰率が決まらず、追加の構造条件が要ることを示した（§6）。", "p6": "結果は線形回帰と、先行研究と同じ分布の仮定のもとでのものである。一致する上下界は、スペクトル・フィードバック条件が成り立つ場合に限られる（§6）。数値実験は確認できず、深層学習での重み平均への含意は直接には示されていない。", "fun": "少しずつ答えに近づいていく計算法では、出発点が悪いと最初のうちは大きく外れる。そこで最初の何歩かを捨て、落ち着いてからの歩みだけを平均する工夫がある。最初の外れは、捨てれば消えるはずだと考えられてきた。しかしこの論文は、最初の数歩の「乱れ」がゆっくり動く方向へ飛び移り、捨てたあとにも残り続けることを見つけた。捨てたはずの過去が、形を変えて残っていたのである。", "unverified": "定理4.1・4.2の式の具体形、条件の定数、証明の技法（§5）は確認していない。"}}, {"id": "pn09", "rank": 9, "field": "機械学習", "headline": "記憶の教訓を元の軌跡で確かめるLLMエージェント", "title": "Don't Just Trust Your Memory: Evidence-Linked Memory Reduces Memory-Induced Degradation in LLM Agents", "url": "https://arxiv.org/abs/2611.14320", "authors": "Yukyeong Lee ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-11", "apa": "Lee, Y., Choi, Y., Baek, J., & Hwang, S. J. (2026). Don't Just Trust Your Memory: Evidence-Linked Memory Reduces Memory-Induced Degradation in LLM Agents (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14320", "why": "LLMエージェントの外部記憶は、誤った教訓や誤用によって、記憶なしなら解ける課題を落とすことがある。各教訓を、成功・失敗の理由の要約と元の軌跡に結びつけて保存し、詳細が足りない・矛盾する・失敗由来の教訓は元をたどって確かめる記憶システムを提案し、5つのベンチマークで既存の記憶手法を上回ったと報告する。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（記憶による悪化の分析§3.2、実験§4、費用と汎化§5.4〜5.5、結論）を読んだ。関連研究、記憶の構築の詳細、限界の節と付録は読んでいない", "preprint": true, "p1": "LLMエージェントが過去の経験から引き出した教訓を、元の実行記録に結びつけて保存し、使う前に元の記録で確かめられるようにすることで、記憶のせいで解けなくなる課題を減らした（抄録、§6）。", "p2": "外部の記憶は経験からの改善を可能にするが、記憶なしなら解ける課題を、記憶があると落とすことがある。教訓は成功・失敗のラベルしかない軌跡から推測され、元の軌跡と切り離して渡されるので、エージェントには確かめる手段がない（抄録、§3.2）。", "p3": "各教訓を、簡潔な洞察、その実行がなぜ成功・失敗したかの要約、生の軌跡の3層で保存し、互いにリンクする。新しい課題では、まずすべての洞察を読み、行動に必要な詳細が足りない、他の洞察と矛盾する、失敗した課題に由来する、といった場合に、端末のツールでリンクをたどって元の記録を調べ、詳細を補うか洞察を修正してから行動する（抄録、§3.3、§3.4）。", "p4": "5つのベンチマーク・8つの課題群（テキスト世界とツール利用の環境）で、記憶なし、既存の記憶手法、同じ洞察だけを与える条件と比べる。各手法は同じ訓練課題の実行記録から一度だけ記憶を作る。成績のほか、以前失敗した課題の改善（Gain）と、以前解けた課題の悪化（Regression）を分けて報告する（§4.1、§4.3）。", "p5": "記憶で失敗に転じた事例の52%は、エージェントが従った記憶の項目に原因があり、最多は項目そのものの誤り（20%）だった（§3.2）。提案法は8つの課題群すべてで最高の成績で、平均90.2（記憶なしは79.5）、洞察だけの条件を平均3.2ポイント上回った（§4.2）。Regressionは4.5%で、洞察だけの6.5%より低い（§4.3）。テスト時の費用は洞察だけの1.17倍だった（§5.4）。", "p6": "原因の分類はLLMの判定によるもので、失敗の約半数は記憶の項目との結びつきが見つからなかった（§3.2）。主な実験は一つの言語モデルで行われ、別のモデルでは3つの課題群だけを調べている（§5.5）。", "fun": "失敗から学んだ教訓は役に立つ。けれども「これをしたら課題は終わり」のように、一度の経験から早合点した教訓は、次に害になる。この研究で面白いのは、教訓をただ信じさせるのでなく、「なぜそう言えるのか」を元の記録までさかのぼって確かめられるようにした点である。結論だけを覚えるより、根拠までたどれるほうが、間違った結論にだまされにくい。AIにも同じことが言えた。", "unverified": "著者の述べる限界の節、課題群ごとの成績の表、失敗した経験からの学習の分析（§5.3）は確認していない。"}}, {"id": "pn10", "rank": 10, "field": "経営学", "headline": "差の差分析で企業の同時反応を測る統計量", "title": "From Two Effects to Joint Responses: Difference-in-Differences Diagnostics for Strategy Research", "url": "https://doi.org/10.2139/ssrn.7682778", "authors": "Josh Feng ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Feng, J., & Mahalingam, A. (2026). From Two Effects to Joint Responses: Difference-in-Differences Diagnostics for Strategy Research. https://doi.org/10.2139/ssrn.7682778", "why": "環境変化に対して企業が相互依存する選択を一緒に変えるという理論に対し、選択ごとの差の差推定は平均の反応しか識別せず、独立な反応・決定の依存・共通要因が同じ推定値を生むことを示した。両方を変えた処置企業の割合から独立の場合の期待を引く超過同時反応（EJR）統計量と、連続結果・段階的導入への拡張を示し、4つの実証例に適用した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたSSRNの抄録を使用（本文は取得できず）", "preprint": true, "p1": "環境の変化に対して企業が二つの選択を「同じ企業が一緒に」変えたのかどうかを、差の差分析の枠組みで診断する統計量（超過同時反応、EJR）を提案した（抄録）。", "p2": "経営戦略の理論の多くは、環境が変わると企業が相互に依存する選択をまとめて調整すると予測する。しかし二つの選択について別々に差の差推定を行っても、分かるのは平均の反応だけで、同じ企業が両方を変えたかは分からない。独立な反応、決定の依存、企業に共通の要因の三つが、同じ一組の平均効果を生みうる（抄録）。", "p3": "EJRは、処置を受けた企業のうち両方の選択を変えた割合から、二つの反応が独立だった場合に期待される割合を引いたものである。値が正なら、独立では説明できないほど同じ企業が両方を変えていることを意味する。連続の結果変数と段階的な処置の導入に対応する版と、異質性・依存の変化・時間的な順序を調べる三つの拡張も与える（抄録）。", "p4": "発明者の移動と特許出願、特許訴訟、環境規制、医薬品の買収という四つの実証の場面に統計量を適用し、企業が出来事にどう反応するかの推論を改善できるかを例示する（抄録）。比較の基準や統計量の検定の方法は抄録に記載なし。", "p5": "抄録は、四つの場面への適用で統計量の使い方を例示したと述べるにとどまり、各場面でのEJRの値や結論は記載していない（抄録）。", "p6": "抄録には限界の記載がない。EJRが正であっても、決定の依存と共通の要因のどちらによるのかをどこまで切り分けられるか、推定量の統計的な性質は、本文を読めておらず未確認。", "fun": "ある規制が始まったあと、企業全体で見ると「研究開発が増え」「人の採用も増えた」とする。これは、同じ会社が両方を増やしたのか、ある会社は研究だけ、別の会社は採用だけを増やしたのか。平均の数字はどちらでも同じになる。この研究は「両方変えた会社の割合が、偶然に重なる分よりどれだけ多いか」を数えることで、二つを見分けようとする。平均の裏に隠れた「誰が」を取り出す工夫である。", "unverified": "本文は取得できず、統計量の正確な定義と推論の方法、四つの実証例の結果は未確認。"}}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "若年失業者への就職支援の4年間の因果効果", "title": "Active Labor Market Policy for Unemployed Youths", "url": "https://doi.org/10.2139/ssrn.7690604", "authors": "Jeremy Hervelin ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Hervelin, J., Villedieu, P., & Terriau, A. (2026). Active Labor Market Policy for Unemployed Youths. https://doi.org/10.2139/ssrn.7690604", "why": "フランスの大規模な若年失業者向けプログラム（集中的な求職支援と訓練への配置）を、担当者への準ランダムな割当てと担当者ごとの登録傾向を操作変数にして評価した。修了後の就業確率は約10%上がるが、賃金・契約の安定・職種の向上は伴わず、非参加者への負の波及もモデルと合わせて示した。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたSSRNの抄録を使用（本文は取得できず）", "preprint": true, "p1": "フランスの若年失業者向けの大規模な就職支援プログラムが、修了後の就業確率を高めるが、仕事の質は変えず、非参加者には負の波及があることを、四年間の追跡で示した（抄録）。", "p2": "集中的な求職支援と訓練への配置を行う積極的労働市場政策が、参加者本人にどれだけ効くのか、効果は賃金や雇用の安定にも及ぶのか、参加しなかった人に影響はないのかを、因果的に評価する必要があった（抄録）。", "p3": "求職とマッチングのモデルを指針として、詳細な行政データを使い、若者が担当者にほぼ無作為に割り当てられることと、担当者ごとにプログラムへ登録させる傾向が違うことを操作変数として利用する。担当者の「登録させやすさ」だけが違う若者どうしを比べることで、参加の因果効果を取り出す（抄録）。", "p4": "プログラム（PACEA）への参加の効果を、修了後の就業確率、賃金、契約の安定、職種の向上について、四年間にわたって推定する。モデルをデータに当てはめて、非参加者への波及と費用対便益も調べる（抄録）。標本の大きさは抄録に記載なし。", "p5": "参加は修了後の就業確率を約10%高めた。この効果は就業するかどうかの面だけに現れ、賃金の上昇、契約の安定、職種の向上は伴わなかった。仕組みとしては、担当者とのやり取りの増加、より構造化された求職の進め方、短期の職業訓練が示唆された。非参加者には負の波及があった（抄録）。", "p6": "抄録には限界の記載がない。担当者への割当てが実際にどの程度無作為か、波及の大きさと費用対便益の値、他国への一般化は、本文を読めておらず未確認。", "fun": "仕事を探す若者に、担当者がつきっきりで支援すると、仕事に就ける人は増えた。ここまでは期待どおりである。ところが、給料が上がったわけでも、安定した契約になったわけでもなかった。さらに、支援を受けなかった若者は、かえって仕事に就きにくくなっていた。席の数が変わらなければ、誰かが座れば誰かが座れなくなる。一人ひとりへの効果と、社会全体への効果は別物だと分かる研究である。", "unverified": "本文は取得できず、対象の人数と期間、推定値の信頼区間、波及の推定方法は未確認。"}}, {"id": "pn12", "rank": 12, "field": "組織行動・心理的安全性", "headline": "チーム固有の技能への投資は過少だが誘因に反応", "title": "Dynamic investment and coordination in teams: Theory and experimental evidence", "url": "https://arxiv.org/abs/2611.13230", "authors": "David Gill ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Gill, D., Prowse, V., & Reddinger, J. L. (2026). Dynamic investment and coordination in teams: Theory and experimental evidence (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13230", "why": "チーム内に蓄積して協調生産の収益を高める技能への投資を、動学ゲームとして初めて体系的に分析し、実験室で検証した。効率的な水準より投資は少ないが、誘因には理論の予測どおり強く反応し、事前登録した特性（心の理論、協調の傾向）が投資とチームの効率を予測した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（ゲームの構造§II.A、実験の手続き§III.A・§III.C、結果§V.A・§V.B、結論§IX）を読んだ。均衡分析、仮説の導出、機械学習による異質性の分析、付録は読んでいない", "preprint": true, "p1": "チームの中に蓄積されて協調の成果を高める「チーム固有の技能」への投資を、動学ゲームとして定式化し、実験室で調べて、投資は効率的な水準に届かないが、誘因と個人の特性に強く反応することを示した（抄録、§IX）。", "p2": "協働が経済で重要になる一方、チーム固有の技能や資本への投資の動学は理解されていない。投資は将来にわたる利益と相手への正の外部性を生むが、利益は協調が成功して初めて得られるので、投資にはリスクがある（§IX）。", "p3": "2人が複数回のラウンドを繰り返す。各ラウンドの前半で、費用を払ってチームの技能に投資するかを同時に決め、投資のたびに技能がbだけ、その試合の終わりまで増える。後半で「チーム課題」か「個人課題」を選ぶ。両者がチーム課題を選べば現在の技能の水準が利得になるが、片方だけだと安全な個人課題より低い利得になる、鹿狩りゲームの構造である（§II.A、図1）。", "p4": "事前登録した実験で、学生606人が30回のセッションに参加した。3ラウンドの試合を9回（最初の1回は練習）、毎回相手を無作為に替えて行い、技能の増分bを試合ごとに無作為に変えた。投資率、チーム課題の選択率、社会的に効率的な結果の達成率を、理論の予測と比べる（§III.A、§III.C、§V.A）。", "p5": "被験者は65%の割合で投資し、86%の割合でチーム課題を選んだが、試合全体で完全な効率を達成したのは43%だった（§V.A、図4、図5）。bが1単位増えると投資率は平均で約4ポイント上がり（係数0.042）、理論が「投資しない」から「投資する」への切替えを予測する境目で増加が大きかった（§V.B、表2）。心の理論と協調の傾向が投資を予測した（§IX）。", "p6": "学生を対象とした2人・3ラウンドの実験室の設定で、現実の長期のチームへの一般化は検証されていない。試合を重ねても平均では学習がほとんど見られなかった（§V.A）。チームの人数の影響や、管理者による誘因の設計と人選は今後の課題とされる（§IX）。", "fun": "二人で息を合わせるための練習は、手間がかかるし、相手が合わせてくれなければ無駄になる。だから、練習すれば二人とも得をすると分かっていても、人は十分には練習しない。この研究は、その「もったいない」状況を実験室のゲームで再現した。面白いのは、練習の見返りを少し大きくすると投資がはっきり増えたことと、相手の気持ちを読むのが得意な人ほどよく投資したことである。チームの力は、報酬の設計と人の組合せで引き出せる。", "unverified": "均衡の導出（§II.C）、心の理論などの特性の効果の大きさ（§V.D）、機械学習による分類（§VI）、効率からの乖離の分析（§VII）は確認していない。"}}, {"id": "pn13", "rank": 13, "field": "機械学習", "headline": "文脈内学習の「汎化」は暗記の途中段階だった", "title": "You Don't Need Feature Learning to Do In-Context Learning", "url": "https://arxiv.org/abs/2611.13431", "authors": "Joseph Turnbull ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Turnbull, J., & Simon, J. (2026). You Don't Need Feature Learning to Do In-Context Learning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13431", "why": "回転不変なカーネル機械が文脈内の線形回帰課題を学ぶ過程を固有基底で分解し、標本が増えるにつれ暗記解の高次成分を順に学ぶことを示した。汎化解は暗記解の低次の打ち切りに近く、モデルはまず汎化してから暗記へ移る。特徴学習は文脈内学習に必須でなく、Transformerの実験でも理論が予測する高次統計を通じた暗記が確認された。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論と図1の説明、§5、Transformerの実験§8、議論§9）を読んだ。固有構造の導出（§4）、課題空間での解析（§6、§7）、付録は読んでいない", "preprint": true, "p1": "文脈内学習で「まず汎化し、のちに暗記へ移る」という現象が、特徴学習をしないカーネル機械でも起きること、汎化解は暗記解の低次の近似にすぎないことを、解ける模型で示した（抄録、§5）。", "p2": "言語モデルが文脈から課題を推測する文脈内学習は、いつ訓練課題の暗記になり、いつ未知の課題への汎化になるのかが分かっていない。有限個の訓練課題だけで訓練の目的関数を最小化しているのに、なぜ汎化できるのかという逆説があった（§1、§5）。", "p3": "文脈内の線形回帰課題を、回転不変なカーネルによるカーネル回帰に学習させ、課題をカーネルの固有基底で分解する。標本数が増えるにつれ、カーネルは目的の関数の成分を次数の低いものから順に学ぶ。暗記解の各次数の成分は、訓練課題の集合の対応する次数の統計量で決まり、汎化解は暗記解を低い次数で打ち切ったものに近い（抄録、§5、図1）。", "p4": "カーネル回帰の誤差の理論予測を、実験で届く標本数の範囲で実測と比べる。さらに12層のGPT-2型のTransformerを256個の訓練課題で学習させ、訓練課題の集合の4次のキュムラント（尖度）だけを変えて、未知の課題と訓練課題での誤差の推移を見る（図1、§8、図5）。", "p5": "カーネルは、まず訓練課題の平均を学び、次に汎化解に近づき、最後に訓練課題を暗記するという3つの段階をたどり、未知の課題での誤差は第2段階の終わりで最小になる。理論と実験は実験可能な範囲でよく一致した（図1）。Transformerでは、尖度をなくすと訓練の間ずっと汎化にとどまり、尖度を一部だけ残すと通常より長く汎化にとどまった。理論が予測する順序どおりである（§8、図5）。", "p6": "解析はガウス分布の入力を持つ文脈内の線形回帰に限られ、非線形の課題や自然言語については示していない。特徴学習をしないモデルは暗記の段階に達しにくい。単純で解ける模型から導いた結果である（§9）。", "fun": "たくさんの例題で勉強したAIが、見たことのない問題も解けるようになるのは、問題の「解き方」を身につけたからだと考えたくなる。この論文の答えは意外で、AIは最初から例題の丸暗記に向かって進んでおり、その途中の「まだ粗くしか覚えていない段階」が、解き方を身につけた状態とほぼ同じになる、というものだ。勉強を続けすぎると丸暗記に行き着いて、かえって応用がきかなくなる。汎化とは、ちょうどよい「覚えかけ」のことだった。", "unverified": "定理1の正確な内容、最適に止めても汎化解に届かない要因（§7）の解析、実験の設定の詳細（付録B）は確認していない。"}}, {"id": "pn14", "rank": 14, "field": "計算社会科学・ネットワーク科学", "headline": "確信度の表示は情報源選びを変えるが精度は上げず", "title": "Displayed judgment certainty reorganizes source selection in self-formed networks", "url": "https://doi.org/10.31234/osf.io/fja3d_v5", "authors": "Gaël Carniel ほか", "venue": "PsyArXiv", "date": "2026-11-10", "apa": "Carniel, G., Guigon, V., Moisan, F., Barrat, A., & Dreher, J.-C. (2026). Displayed judgment certainty reorganizes source selection in self-formed networks. https://doi.org/10.31234/osf.io/fja3d_v5", "why": "273人が真偽のニュース見出しを評価し、費用を払って観察相手を選ぶネットワークを作る実験で、相手の確信度（確率判断の極端さ）を表示する効果を調べた。表示はネットワークを密にし確信の強い相手へリンクを向けたが、確信が強く誤った判断への接触を増やし、正確さの明確な改善は検出されなかった。", "explain": {"basis": "本文", "basis_note": "PsyArXiv（OSF）のPDF本文（実験の設計§2.1、正確さの結果§2.4、考察§3）を読んだ。情報源の選択の回帰、信念の更新のモデル比較、方法の詳細（§4）と補足資料は読んでいない", "preprint": true, "p1": "人が自分で観察相手を選んでネットワークを作る状況で、相手の「確信度」を表示すると、確信の強い人が選ばれやすくなるが、判断の正確さは良くならないことを実験で示した（抄録、§3）。", "p2": "集合知は、人が他人の判断をどう統合するかだけでなく、そもそも誰の判断を見ることにするかに左右される。確信度の表示が情報源の選び方を組み替えるのか、その結果として正確さが上がるのかは分かっていなかった（抄録、§3）。", "p3": "参加者はニュースの見出しごとに、真である確率を0〜100で私的に答え、次に費用を払って最大5人まで観察相手を選び、相手の判断を見ながら5回、自分の判断を更新する。確信度は、確率の答えが50からどれだけ離れているかで定義する。確信度の表示の有無だけを変え、判断の向き（真か偽か）と正確さは隠したままにする（§2.1）。", "p4": "8つのオンラインのセッション（条件ごとに4つ）で273人が真偽の見出し14本を評価し、112のネットワークが作られた。ネットワークの密度、誰が選ばれたか、判断の正確さ（真の値への近さ）の変化、リンクの費用を引いた得点を、表示あり・なしで比べる（抄録、§2.1、§2.4）。", "p5": "表示はネットワークを密にし、確信の強い相手へリンクを向け、確信が強く誤った判断への接触を増やした（抄録）。正確さは全体で64.42から73.04へ上がったが、上昇幅は表示ありで8.12、なしで9.11で、表示による改善は検出されなかった。リンクの費用は表示ありで34.47、なしで23.27で、費用を引いた得点は24.73対42.12と、表示ありのほうが低かった（§2.4、図4）。", "p6": "著者は、観察相手の選択は無作為化されておらず、選んだ相手の正確さと改善の関連は因果効果ではないこと、課題の得点の差がオンラインの場での一般的な損失を示すわけではないこと、試した更新のモデルはどれも最初の大きな反応を捉えられなかったことを述べる（§3）。セッションは8つと少ない。", "fun": "「絶対にこうだ」と言い切る人の意見は、つい聞きたくなる。この実験で、相手がどれだけ自信を持っているかを見えるようにすると、人は自信の強い人を選んで話を聞くようになった。ところが、自信の強さと正しさは別物である。結果として、選ぶための費用を多く使ったのに、正確さは良くならなかった。目を引く手がかりと、役に立つ手がかりは違う。「自信があるように見える」ことの影響力と危うさを示した実験である。", "unverified": "情報源の選択の回帰係数（§2.3）、信念の更新のモデル比較（§2.7）、統計的推論の方法（§4.6）は確認していない。"}}, {"id": "pn15", "rank": 15, "field": "経営学", "headline": "ブラウザ選択画面はSafariからChromeへ移した", "title": "The Limits of Product Market Remedies in Platform Ecosystems: Evidence from Browser Choice Screens on iPhones", "url": "https://doi.org/10.2139/ssrn.7682467", "authors": "Leon Knoke ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Knoke, L., & Peukert, C. (2026). The Limits of Product Market Remedies in Platform Ecosystems: Evidence from Browser Choice Screens on iPhones. https://doi.org/10.2139/ssrn.7682467", "why": "EUのデジタル市場法で2024年に導入されたiPhoneの既定ブラウザ選択画面の効果を、EUと非EUの国の比較で推定した。SafariからGoogle Chromeへの大きなシェア移動と他ブラウザの小幅な増加が起き、補完的な検索市場ではGoogleのシェアはほぼ変わらなかった。エコシステムの補完性が個別市場の是正措置の届く範囲を限ることを示す。", "explain": {"basis": "抄録", "basis_note": "Crossrefに登録されたSSRNの抄録を使用（本文は取得できず）", "preprint": true, "p1": "EUがiPhoneに義務づけたブラウザの選択画面は、SafariからGoogle Chromeへの大きなシェアの移動を起こしたが、検索市場の競争はほとんど変えなかったことを示した（抄録）。", "p2": "競争上の是正措置は個別の製品市場を対象にするが、その市場は、補完的なサービスと市場をまたぐ協力関係で形づくられたプラットフォームのエコシステムの中にある。この関係が是正措置の効果をどう左右するかが問われていた（抄録）。", "p3": "デジタル市場法のもとで2024年に導入された、既定のブラウザを消費者に能動的に選ばせる画面を対象に、導入の前後で、EUの国と非EUの国のブラウザと検索のシェアを比べる（抄録）。背景：EUの国だけに導入されたので、非EUの国の推移を「導入がなかった場合」の目安として使える。", "p4": "ブラウザのシェアと検索のシェアの変化を指標とし、導入前のエコシステムの浸透度（デスクトップでのSafariの利用、Googleのエコシステムの定着度）による効果の違いも調べる（抄録）。データの出どころと国の数は抄録に記載なし。", "p5": "支配的なSafariからChromeへ大きなシェアの移動があり、他のブラウザの増加は絶対値で小さかった。Safariの減少はデスクトップでのSafari利用が多い国で小さく、Chromeの増加はGoogleのエコシステムが定着した国で大きかった。検索市場では、どちらのブラウザでもGoogleが既定の検索エンジンのため、Googleのシェアへの効果はごく小さかった（抄録）。数値は抄録に記載なし。", "p6": "抄録には限界の記載がない。シェアの計測方法、国ごとの比較可能性、選択画面の設計の細部による違いは、本文を読めておらず未確認。", "fun": "スマートフォンを買うと最初から入っているブラウザを、そのまま使う人は多い。そこでEUは「どのブラウザにしますか」と必ず選ばせる画面を義務づけた。確かに人は動いた。ただし行き先は、小さな新顔ではなく、もう一つの巨人だった。しかも検索は、どちらのブラウザでも同じ会社のものが使われる。一つの市場に手を入れても、つながった別の市場まで届くとは限らないことを、きれいに示した例である。", "unverified": "本文は取得できず、シェアの変化の大きさ、推定の方法、対象期間は未確認。"}}, {"id": "pn16", "rank": 16, "field": "統計学", "headline": "選択後推論を擬似周辺MCMCで効率よくサンプリング", "title": "Pseudo-marginal Sampling for Selective Inference", "url": "https://arxiv.org/abs/2611.13492", "authors": "Jiali He ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "He, J., & Liu, S. (2026). Pseudo-marginal Sampling for Selective Inference (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13492", "why": "適応的な選択のあとの推論で、選択事象で条件づけた分布からのサンプリングを擬似周辺MCMCで行う方法を提案した。選択事象がまれなときに棄却サンプリングが高価になる問題に対処し、弱ポアンカレ不等式で棄却法に対する計算効率を解析した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "適応的な選択のあとの推論（選択後推論）で、選択事象で条件づけた分布からのサンプリングを、擬似周辺MCMCで効率よく行う方法を示した（抄録）。", "p3": "提案分布から引いて観測と同じ選択を再現した標本だけを残す棄却サンプリングは、選択事象がまれだと極端に高価になる。これに代えて、選択的な分布を標的とする擬似周辺マルコフ連鎖モンテカルロを使い、弱ポアンカレ不等式で棄却法に対する効率を解析した（抄録）。", "p5": "古典的な「お蔵入り問題」で両手法の計算費用を厳密に導き、選択事象がまれになるほど指数的に改善することを示した。複雑な選択手続きの数値実験では棄却法の数百倍効率的なことが多く、検定は名目の選択的第一種過誤を保った（抄録）。", "fun": "たくさん試して、うまくいったものだけを報告すると、偶然の当たりを本物と見間違える。これを正すには「選ばれたという条件」のもとで確率を計算し直す必要があるが、その計算がとても重い。この研究は、めったに起きない選ばれ方ほど、従来より桁違いに楽に計算できる方法を示した。正直な統計を、実際に計算できるものにする工夫である。", "unverified": "本文未読のため、数値実験の選択手続きの内容と効率の具体的な倍率は未確認。"}}, {"id": "pn17", "rank": 17, "field": "統計学", "headline": "スパース性を仮定しない偏相関の推論", "title": "Projection-Based Partial Correlation Inference Beyond Sparsity", "url": "https://arxiv.org/abs/2611.13657", "authors": "Youwu Lin ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Lin, Y., Zhou, Z., Shi, S., & Sun, X. (2026). Projection-Based Partial Correlation Inference Beyond Sparsity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13657", "why": "条件づけ変数が密に依存する高次元ガウスモデルで、座標のスパース性を仮定せずに偏相関を推定・検定する、対象に特化した射影の枠組みを示した。線形の次元削減が保つ情報を2次の基準で特徴づけ、条件のもとで1次元の射影が元の偏相関を保つことを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "条件づける変数どうしが密に依存し、スパース性を仮定できない高次元ガウスモデルで、偏相関を推定・検定できる射影の枠組みを示した（抄録）。", "p3": "線形の次元削減が保つ情報を母集団の2次の基準で表すと、最適なのは1次元の射影になり、ランク1の整合条件のもとで元の偏相関が保たれる。この方向を、独立な学習用標本で対角リッジ正則化を使って推定する（抄録）。", "p5": "方向の推定誤差が偏相関に与える影響は2次であることを示し、分割標本の推定量の漸近正規性と、偏相関ゼロの帰無仮説の漸近的に妥当な検定を導いた。次元が標本数を超える密なモデルでも必要な収束率が成り立つ（抄録）。", "fun": "「AとBは、他の全部の影響を除いても関係があるか」を調べるのが偏相関である。変数が何千もあると、ふつうは「本当に効くのは少数だけ」と仮定して計算する。しかし現実には全部が少しずつ絡むことも多い。この研究は、その仮定なしで、多数の変数を一本の物差しにまとめ直すだけで正しく検定できる条件を示した。", "unverified": "抄録の末尾が切れており、数値実験の結果は未確認。整合条件が実データでどの程度成り立つかも未確認。"}}, {"id": "pn18", "rank": 18, "field": "統計学", "headline": "ロジスティック回帰の混合のノンパラメトリック最尤推定", "title": "Nonparametric Maximum Likelihood Estimation for Mixtures of Logistic Regressions", "url": "https://arxiv.org/abs/2611.14445", "authors": "Muheng Li ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Li, M., Zhang, P., & Bing, X. (2026). Nonparametric Maximum Likelihood Estimation for Mixtures of Logistic Regressions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14445", "why": "混合分布を特定しないロジスティック回帰の混合モデルについて、ふるい（sieve）型のノンパラメトリック最尤推定量の非漸近的な誤差の上界を、固定・確率的な計画の両方で導き、推定誤差と近似誤差のトレードオフから収束率を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "混合分布の形を特定しないロジスティック回帰の混合モデルについて、ふるい型のノンパラメトリック最尤推定量の誤差の上界と、それを計算する有限粒子アルゴリズムを示した（抄録）。", "p3": "固定・確率的な計画のもとで混合回帰関数の推定誤差の非漸近的な上界を導き、推定誤差とふるいの半径による近似誤差のトレードオフから収束率を求めた。計算には、有限個の点に台を持つ混合分布の位置と重みを最適化する方法を使う（抄録）。", "p5": "任意の固定データについて、粒子数が有限のしきい値を超えれば尤度が制限つき最尤値へ大域的に収束することを示し、真の混合分布が有限個の点に台を持つ場合は、アルゴリズムの誤差と統計的誤差を分けた上界を導いた（抄録）。", "fun": "「買う・買わない」のような二択を説明するロジスティック回帰は、全員が同じ傾向を持つと仮定する。だが実際は、値段に敏感な人も鈍い人もいる。この研究は「何種類の人がいるか」を決めずに、データに一番合う人の混ざり方を探す方法について、どれだけ正確に推定できるか、計算が正解に届くかを数学的に保証した。", "unverified": "抄録の末尾が切れており、識別可能性の結果の内容と数値実験は未確認。"}}, {"id": "pn19", "rank": 19, "field": "統計学", "headline": "種標本抽出過程の厳密な有限表現と事前分布の構成", "title": "Species sampling priors through exact augmentation", "url": "https://arxiv.org/abs/2611.13323", "authors": "Rams\\'es H. Mena ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Mena, R. H., Merkatas, C., Nicoleris, T., & Rodríguez, C. E. (2026). Species sampling priors through exact augmentation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13323", "why": "ベイズノンパラメトリクスの混合モデルで使う離散確率測度について、すべての適正な種標本抽出過程が、有限個の原子の選択と再重みづけからなる厳密な2段階の有限表現を持つことを示し、これを逆にたどって事前分布を作る一般的な方法を与えた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "ベイズノンパラメトリクスで使う種標本抽出過程（species sampling process）が、有限個の原子を使う厳密な二段階の表現を持つことを示し、そこから新しい事前分布を作る方法を与えた（抄録）。", "p3": "ほとんど確実に有限な指数が最初の原子の集合を選び、そこから明示的に重みを付け直した確率で抽出する。減少する「可視性の予定表」が重みの付け直しと指数の法則を決め、有限の条件付き測度をこの法則で平均すると元の過程が復元される（抄録）。", "p5": "この恒等式を逆にたどると、無限個の重みを直接指定する代わりに、指数の分布と有限の割当確率から事前分布を構成できる。裾の軽い・重い・多峰の指数分布を使って、完全な弱い台を持つ新しい事前分布を作った（抄録）。", "fun": "データをいくつのグループに分けるかを前もって決めず、「必要なら新しいグループを作る」統計モデルがある。その裏側には無限個の重みを持つ確率分布があり、扱いが難しい。この研究は、その無限の対象を「まず有限個を選び、そこから引く」という二段階で正確に言い換えられることを示した。無限を有限で扱う道具が一つ増えた。", "unverified": "抄録の末尾が切れており、具体的な分割則・予測則の式と応用例は未確認。"}}, {"id": "pn20", "rank": 20, "field": "統計学", "headline": "一対比較からの順位推定を差分プライバシーつきで", "title": "Differentially Private Statistical Inference for Rankings from Pairwise Comparisons", "url": "https://arxiv.org/abs/2611.13485", "authors": "Xintao Xia ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Xia, X., & Gu, J. (2026). Differentially Private Statistical Inference for Rankings from Pairwise Comparisons (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13485", "why": "人による一対比較から言語モデルなどの順位を推論するとき、個々の選好記録の秘匿を保つ方法を、Bradley–Terryモデルと辺の差分プライバシーのもとで開発した。摂動つき推定量の有限標本の誤差の上界と、得点・得点差の漸近的に妥当な信頼区間を導いた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "人による一対比較から言語モデルなどの順位を推論するとき、個々の選好の記録を差分プライバシーで守りながら、得点と順位の信頼区間を作る方法を示した（抄録）。", "p3": "Bradley–Terryモデルと辺の差分プライバシーのもとで、目的関数に摂動を加える推定量を使い、新しい1個抜きの解析で有限標本の誤差の上界を導いた。リッジの偏りの補正とガウス・ラプラスの較正を組み合わせ、同時の順位推論にはブートストラップを使う（抄録）。", "p5": "個々の得点と得点差の漸近的に妥当な信頼区間、個々の順位の信頼集合、上位K位に入るかの検定が得られる。比較の確率が公開で既知なら、追加のプライバシー予算は要らない。創作文の課題で言語モデルの順位づけに適用した（抄録）。", "fun": "「AとBのどちらの回答が良いか」という投票を集めてAIの順位を決める仕組みがある。投票の記録には個人の好みが表れるので、そのまま公開すると危ない。この研究は、わざと少し雑音を混ぜて個人を守りつつ、「この順位はどのくらい確かか」という幅まで正しく出せる方法を作った。守ることと正確さの両立を数学で示している。", "unverified": "本文未読のため、シミュレーションの結果と実データでの順位の具体的な内容は未確認。"}}, {"id": "pn21", "rank": 21, "field": "統計学", "headline": "LLM審査員と適応的に集めた人手評価で順位を推定", "title": "Prediction-Powered LLM Ranking with Adaptively Collected Human Feedback", "url": "https://arxiv.org/abs/2611.13186", "authors": "Gabriel Sargent ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Sargent, G., Sun, W. W., Zhang, Z., & Liu, Y. (2026). Prediction-Powered LLM Ranking with Adaptively Collected Human Feedback (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13186", "why": "言語モデルの順位づけで、適応的に集めた高価な人手評価に、安価なLLM審査員の予測を組み合わせて精度を上げつつ、審査員の偏りと適応的な標本抽出のもとでも妥当な推論を与える枠組み（PP-Rank）を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "言語モデルの順位づけで、適応的に集めた高価な人手評価に安価なLLM審査員の予測を組み合わせ、精度を上げつつ妥当な推論を保つ枠組みPP-Rankを提案した（抄録）。", "p3": "審査員の偏りと、過去の結果に応じて比較を選ぶ適応的な標本抽出による依存を、同時マルチンゲール解析で扱う。予測に付ける重みはデータから決め、提案した推定量の族の中で漸近共分散のトレースを最小にする（抄録）。", "p5": "一般の評価対象と同時の順位推論について漸近正規性を示した。半合成の実験で、人手評価だけの基準より得点の推定、信頼区間の幅、順位の認証が改善した（抄録）。改善の大きさは抄録に記載なし。", "fun": "AIの出来を人が採点するのは正確だが高い。AIにAIを採点させるのは安いが、ひいきや癖がある。この研究は、安い採点をたくさん使って大まかな形をつかみ、少しの人手の採点で癖を直す。しかも、次にどれを比べるかをその場で決める集め方をしても、統計の保証が崩れないようにした点が技術的に難しいところである。", "unverified": "抄録の末尾が切れており、合成実験の結果の詳細は未確認。"}}, {"id": "pn22", "rank": 22, "field": "統計学", "headline": "雑音だけから型紙に似た像が出る現象を統計的に解析", "title": "Statistical Analysis of the Structure from Noise Phenomenon in Generalized Procrustes Problems", "url": "https://arxiv.org/abs/2611.13546", "authors": "Jiayang Yin ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Yin, J., & Ling, S. (2026). Statistical Analysis of the Structure from Noise Phenomenon in Generalized Procrustes Problems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13546", "why": "クライオ電子顕微鏡で、参照の型紙を使う照合と平均化が、観測が雑音だけでも型紙に似た出力を生む現象（Einstein from noise）を、一般化プロクラステス問題として統計的に解析した研究。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "クライオ電子顕微鏡で、型紙（テンプレート）を使った位置合わせと平均化が、雑音だけの観測からも型紙に似た像を作ってしまう現象を、一般化直交プロクラステス問題で解析した（抄録）。", "p3": "連続な直交群の作用と、順序つき点群の低次元への射影を含む、解析的に扱える設定で型紙との照合と平均化を調べ、純粋なガウス雑音のもとでの推定量の平均の構造を特異値分解で特徴づけた（抄録）。", "p5": "雑音だけのとき、位置合わせして平均した推定量の平均は型紙と同じ左右の特異ベクトルの基底を持ち、特異値だけが歪む。特異値の歪みの上界、有限標本の作用素ノルムの上界、母平均が揺らぎを上回るのに十分な標本数を示した（抄録）。", "fun": "有名な人物の顔写真を型紙にして、ただの砂嵐の画像を大量に「顔に合うように」回して重ねると、砂嵐の中からその顔が浮かび上がる。信号は何もないのに、探し方そのものが答えを作ってしまうのである。この現象は「雑音からのアインシュタイン」と呼ばれる。この研究は、型紙のどの性質が結果に写り込むのかを数学的に突き止めた。", "unverified": "抄録の末尾が切れており、弱い信号がある場合の結果の後半は未確認。"}}, {"id": "pn23", "rank": 23, "field": "統計学", "headline": "媒介確率の比で重みづける媒介分析を一つの枠組みに", "title": "Ratio-of-mediator-probability weighting for causal mediation analysis: estimation, extensions, and practical guidance", "url": "https://arxiv.org/abs/2611.13206", "authors": "Ariel Linden", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Linden, A. (2026). Ratio-of-mediator-probability weighting for causal mediation analysis: estimation, extensions, and practical guidance (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13206", "why": "結果をモデル化せず媒介変数の分布を重みづけ直して自然な直接・間接効果を推定する方法（RMPW）を共通の推定の枠組みにまとめ、連続の媒介変数の不均一分散モデルと2段階の分散推定の拡張を加え、全国健康調査などで例示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "結果をモデル化せず、媒介変数の分布を重みづけ直して自然な直接・間接効果を推定する方法（RMPW）を、一つの推定の枠組みにまとめ、実用上の指針を示した（抄録）。", "p3": "既存の手法を共通の枠組みに置き、連続の媒介変数に不均一分散の正規モデルを入れ、2段階の分散推定を複数のパラメトリックな重みに拡張した。全国健康調査と福祉から就労への無作為化実験で例示し、目的を絞ったシミュレーションで評価した（抄録）。", "p5": "モデルが適切で重みが安定していれば性能は良いが、正しい特定だけでは重みの集中による不安定を防げない。層別による重みづけは誤特定にある程度強く、推定した重みを固定とみなす標準誤差は信頼できず、2段階とブートストラップの推論は良好だった（抄録）。", "fun": "「就労支援を受けた母親の気分の落ち込みが変わった」として、それは就職できたからなのか、それ以外の経路なのか。この二つを分けるのが媒介分析である。この研究が扱う方法は、結果の式を立てる代わりに「重み」で調整する。ただし重みが一部の人に集中すると答えがぐらつく。使う前に重みの様子を確かめよ、という実用的な教訓が得られる。", "unverified": "抄録の末尾が切れており、指針の全体と例示の推定値は未確認。"}}, {"id": "pn24", "rank": 24, "field": "機械学習", "headline": "条件をずらして偽スコア網なしで数ステップ動画生成", "title": "Few-Step Streaming Video Generation via Condition Shifting", "url": "https://arxiv.org/abs/2611.14033", "authors": "Deyuan Liu ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-11", "apa": "Liu, D., Li, J., Zheng, K., Jiang, K., Chen, J., Wang, Y., Lin, M., Lin, T., Chen, J., Zhu, J., & Zhang, J. (2026). Few-Step Streaming Video Generation via Condition Shifting (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14033", "why": "ストリーミング動画生成の数ステップ蒸留で、別に学習する偽スコアのネットワークを使わず、条件をずらすことで同じ生成器の中で生成分布の速度場を推定する方法を示した。同じ学習設定でGPUメモリの最大値が4.4%、反復時間が9.2%減ったと報告する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由の抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "ストリーミング動画生成の数ステップ蒸留で、別に学習させる偽スコアのネットワークをなくし、同じ生成器の中で条件をずらして代用する方法を示した（抄録）。", "p3": "元の文章条件は生成に、ずらした条件は生成分布の速度場の推定に使い、同じパラメータで両方を担わせる。凍結した参照教師などの要素は保ち、180秒の動画で、70件の人手評価と320件のベンチマーク比較を行った（抄録）。", "p5": "比較対象より、指示の達成度（3.856対3.831）と見た目の美しさが高く、人の評価では指示への追従で+30.0%の純選好を得た。動きの質は比較対象が上回った。同じ学習設定でGPUメモリの最大値は4.4%、反復時間は9.2%減った（抄録）。", "fun": "動画を作るAIを速くするには、時間のかかる先生役のモデルから、数歩で作れる生徒役へ技を移す。従来は、生徒の出来を見張る「もう一つの見張り役」を別に育てる必要があり、その分メモリと時間を食っていた。この研究は、生徒自身に合図を変えて見張り役も兼ねさせた。一人二役で、部品を一つ減らす発想である。", "unverified": "本文未読のため、評価指標の定義と、差の統計的な有意性は未確認。"}}, {"id": "pn25", "rank": 25, "field": "機械学習", "headline": "k-meansを10分の1のエポックで超える", "title": "e-means: outperforming k-means (in one-tenth the epochs)", "url": "https://arxiv.org/abs/2611.09501", "authors": "Swann Bessa ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-10", "apa": "Bessa, S., Mazaré, P.-E., Szilvasy, G., Touvron, H., Picard, D., Douze, M., & Jégou, H. (2026). e-means: outperforming k-means (in one-tenth the epochs) (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.09501", "why": "ミニバッチ更新と指数移動平均によるk-meansの最適化手順（e-means）と、減衰率・バッチサイズの決め方のスケーリング則を示した。Lloyd法の25エポック時の損失を1.4〜2.6エポックで下回り、100億件の埋め込みを1,600万クラスタに2.5エポックで分割したと報告する。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由の抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "クラスタリングの定番k-meansを、ミニバッチ更新と指数移動平均で最適化し直した手法e-meansを示し、はるかに少ない計算で低い損失に達することを示した（抄録）。", "p3": "深層学習の最適化の道具を使った指数移動平均の更新手順を導入し、減衰率とバッチサイズが最終性能に与える影響のスケーリング則を定めて、問題の大きさが変わっても調整なしで値を決められる規則を作った（抄録）。", "p5": "多くの埋め込みデータで、Lloyd法の25エポック時の損失を1.4〜2.6エポックで下回り、GPUでの実時間で10〜45倍の高速化に当たる。100億件の埋め込みを1,600万クラスタに2.5エポックで分割した（抄録）。", "fun": "k-meansは、点の集まりをいくつかのグループに分ける、長く使われてきた定番の方法である。全部の点を何十回も見直すのが普通だったが、この研究は、少しずつ見ては重心を「なめらかに」動かす更新に変えるだけで、十分の一ほどの回数で、より良い分け方に届くことを示した。古典的な方法にも、まだ大きな改善の余地が残っていた。", "unverified": "本文未読のため、スケーリング則の式と、比較した実装の詳細は未確認。"}}, {"id": "pn26", "rank": 26, "field": "機械学習", "headline": "答えを変えるニューロン群は一つに決まらない", "title": "Are Causal Neuron Circuits Unique and Transferable?", "url": "https://arxiv.org/abs/2611.13885", "authors": "Ömer Tekin Yavuz", "venue": "Hugging Face Daily Papers", "date": "2026-11-11", "apa": "Yavuz, Ö. T. (2026). Are Causal Neuron Circuits Unique and Transferable? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13885", "why": "ニューロン群への介入でモデルの答えが変わる実演について、選んだ12個のMLPニューロンの全4,096通りの部分集合を測り、群全体が必要なことはまれで、互いに重ならない部分集合がそれぞれ単独で答えを変える場合があること、効果は言い換えには移るが他の連鎖では弱いことを示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由の抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "ニューロン群への介入でモデルの答えが変わるという解釈可能性の実演について、その群のどれだけが本当に必要か、他の群でも同じことが起きるかを系統的に調べた（抄録）。", "p3": "選んだ12個のMLPニューロンの全4,096通りの部分集合について効果を測り、首都を答える二択課題と、二段階の関係をたどる課題で、ゼロにする介入と、別の質問の値に差し替える介入を比べた（抄録）。", "p5": "二択課題では12個をゼロにすると答えの余裕が27%下がるが、別の質問の値に差し替えてもほとんど変わらず、質問に固有の内容を運んでいる証拠はなかった。二段階の課題では、群全体が必要なことはまれで、重ならない部分集合がそれぞれ単独で答えを変える場合が多い（抄録）。", "fun": "AIの頭の中で「この18個のニューロンを止めると答えが変わる」という実験は、そこに知識がしまってあるように見える。しかし本当にその18個でなければいけないのか。この研究が全部の組合せを試すと、数個で足りたり、別の組でも同じことが起きたりした。「ここが原因だ」と言い切ることの難しさを示す、慎重で大事な検証である。", "unverified": "抄録の末尾が切れており、他の入力への転移の結果の詳細は未確認。小さいモデルでの検証である。"}}, {"id": "pn27", "rank": 27, "field": "機械学習", "headline": "有限予算での神経回路のスケーリング則のずれを解析", "title": "Beyond the Log-Linear Frontier: Pre-Asymptotic Analysis of Finite-Budget Neural Scaling Laws", "url": "https://arxiv.org/abs/2611.13534", "authors": "Tianyu Zhao ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Zhao, T., & Ren, Z. (2026). Beyond the Log-Linear Frontier: Pre-Asymptotic Analysis of Finite-Budget Neural Scaling Laws (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13534", "why": "モデル容量とデータ量の分離したべき乗則からの有限規模でのずれを、スペクトルと領域の不均一性から解析し、容量方向について3項の展開を導いた。損失の下限を差分で消して安定に当てはめる方法も示す。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "モデル容量とデータ量についてのべき乗則（スケーリング則）が、有限の計算予算ではずれていく様子を理論的に解析し、ずれを補正する推定法を示した（抄録）。", "p3": "容量の方向では共分散のレゾルベントの解析から3項の展開を導き、損失の下限を1階の差分で消して安定な閉形式の初期値を得る。データの方向では複数領域の混合を水充填の問題に帰着させ、計算量一定の線上で最適な配分の指数がずれることを証明した（抄録）。", "p5": "45の作用素スペクトルと、既存の言語モデル群の学習記録（245回の実行など）、17領域の混合データで、ホールドアウトの平均絶対パーセント誤差5.89%を達成し、大きな計算量での配分の後悔を最大76.4%、混合の誤差を59.4%減らした（抄録）。", "fun": "AIは「モデルを大きくし、データを増やせば、決まった割合で賢くなる」という経験則に支えられて巨大化してきた。両対数グラフで直線になる、きれいな法則である。しかし限られた予算の範囲では、その線は実は曲がっている。この研究は曲がり方を式で表し、小さな試し計算から大きな計算の最適な配分を、より正確に見積もれるようにした。", "unverified": "本文未読のため、展開の式の具体形と、検証に使ったデータの詳細は未確認。"}}, {"id": "pn28", "rank": 28, "field": "機械学習", "headline": "事前学習・微調整・強化学習の計算配分を解析モデルで", "title": "An Analytical Model of Compute-limited Multistage Training Pipelines", "url": "https://arxiv.org/abs/2611.13276", "authors": "Nishil Patel ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Patel, N., Lee, J. H., Confavreux, B., & Saxe, A. (2026). An Analytical Model of Compute-limited Multistage Training Pipelines (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13276", "why": "教師なし事前学習、雑音のある教師つき微調整、疎な報酬の強化学習を組み合わせた高次元の解析可能なモデルを導入し、ランダム行列理論で低次元の学習ダイナミクスを導いて、段階間の相互作用と計算資源の配分を論じた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "基盤モデルの多段階の学習（事前学習、教師つき微調整、強化学習）の相互作用と、計算資源の配分を、解析的に解けるモデルで調べた（抄録）。", "p3": "線形オートエンコーダによる教師なし事前学習、雑音のある段階的なラベルによる微調整、疎な報酬の強化学習を組み合わせた高次元モデルを導入し、ランダム行列理論などで低次元の学習ダイナミクスを近似的に導いた。結果はシミュレーションとよく合う（抄録）。", "p5": "事前学習データが有限だと表現に依存した性能の限界が生じ、ベイズ分類誤差は事前学習の標本比の平方根の逆数で減る。微調整を先に行うと、疎な報酬による強化学習の初期の停滞が短くなる。最適な計算配分は教師の質と総予算に依存する（抄録）。", "fun": "いまのAIは、まず大量の文章を読み、次にお手本で練習し、最後に「正解なら報酬」という訓練を受ける、という三段階で育てられる。では限られた計算時間を、どの段階にどれだけ使うのが良いか。この研究は、数式で解ける小さな模型を作ってその答えを探した。お手本の質と予算の大きさで、最適な配分が変わることが分かった。", "unverified": "抄録の末尾が切れており、補完的な合成モデルの結果は未確認。実モデルでの確認は一例にとどまる。"}}, {"id": "pn29", "rank": 29, "field": "機械学習", "headline": "記号的な推論機構はデータの多様性から生まれる", "title": "What drives the emergence of symbolic mechanisms in large language models?", "url": "https://arxiv.org/abs/2611.13270", "authors": "Melody Zixuan Li ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Li, M. Z., & Webb, T. (2026). What drives the emergence of symbolic mechanisms in large language models? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13270", "why": "抽象的な系列課題でニューラルネットを一から学習させ、構造とデータ分布の要因を変えて、抽象推論を支える記号的な機構の出現条件を調べた。データの多様性が大きいほど機構が強く現れることを、表現・注意・因果媒介の分析で示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "ニューラルネットの中に抽象推論を支える記号的な機構が現れる主な要因は、構造ではなくデータの多様性であることを示した（抄録）。", "p3": "抽象的な系列課題でネットワークを一から学習させ、構造とデータ分布の要因を変えて、表現・注意・因果媒介の分析で記号的な機構の現れ方を調べた（抄録）。", "p5": "データの多様性が大きいほど記号的な特徴が強く現れた。同じ特徴は、改変したTransformerや多層パーセプトロンでも現れ、構造上の帰納バイアスは必要でなかった。実体と属性を結びつける課題でも同じ傾向だった（抄録）。数値は抄録に記載なし。", "fun": "AIが抽象的な規則を扱えるのは、Transformerという特別な構造のおかげだと考えられがちだった。ところが、ずっと単純な構造のネットワークでも同じ仕組みが現れた。決め手は、どれだけ多様な例を見せたかだった。賢さの源は器の形より、中に入れる経験の幅にある、という結果が面白い。", "unverified": "本文未読のため、課題の具体的な内容、モデルの規模、特徴の強さの指標は未確認。"}}, {"id": "pn30", "rank": 30, "field": "因果推論", "headline": "競合事象があるときの生存時間の因果媒介分析", "title": "Causal mediation analysis for a time-to-event endpoint in the presence of competing events", "url": "https://arxiv.org/abs/2611.13327", "authors": "Yuhao Deng ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Deng, Y., Gilbert, P., Fong, Y., & Zhang, B. (2026). Causal mediation analysis for a time-to-event endpoint in the presence of competing events (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13327", "why": "主要な事象を妨げる競合事象があるときの生存時間エンドポイントについて、原因別累積発生率への総効果を、直接効果、対象の媒介変数を通る間接効果、競合事象を通る間接効果に分ける統一的な扱いを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "主要な事象の発生を妨げる競合事象があるとき、生存時間の結果についての因果媒介分析を統一的に扱う方法を示した（抄録）。", "p3": "原因別の累積発生率への総効果を、直接効果、対象の媒介変数を通る間接効果、競合事象を通る間接効果に分ける。この分解を自然効果・確率的介入効果・分離可能効果の3つの枠組みで定式化し、効率的影響関数に基づく二重機械学習型の推定量を提案した（抄録）。", "p5": "ある設定では、3つの枠組みは異なる識別の仮定に立ちながら同じ統計的な汎関数になる。提案した推定量は多重頑健で半パラメトリック効率限界に達し、未測定の共通原因への感度分析も備える（抄録）。応用例の数値は抄録に記載なし。", "fun": "ある処置が効くのは、途中のある指標が変わるからなのかを調べたいとする。ところが観察の途中で別の出来事が起きると、目当ての出来事が起きたかどうかは永遠に分からなくなる。この「邪魔をする出来事」があると、効果の経路を分ける計算は一気に難しくなる。この研究は分け方を整理し、三つの流儀が同じ答えに行き着く条件を示した。", "unverified": "本文未読のため、応用したデータと推定結果、シミュレーションの内容は未確認。"}}, {"id": "pn31", "rank": 31, "field": "因果推論", "headline": "因果構造が部分的にしか分からないときの介入の選び方", "title": "Generalizing Causal Decision-Making: Markov Equivalence, Transportability and Counterfactuals", "url": "https://arxiv.org/abs/2611.14066", "authors": "Min Woo Park ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Park, M. W., & Lee, S. (2026). Generalizing Causal Decision-Making: Markov Equivalence, Transportability and Counterfactuals (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14066", "why": "構造的因果バンディットを、因果構造が部分的にしか分からない場合（マルコフ同値類）、他の環境の情報（輸送可能性）、実現可能な反実仮想の行動へ拡張し、最小の介入集合の図的な基準と探索アルゴリズム、目標環境の報酬の上下界を導いた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "因果の知識を使って試すべき介入を絞る構造的因果バンディットを、因果構造が部分的にしか分からない場合、他の環境の情報がある場合、反実仮想の行動ができる場合へ広げた（抄録）。", "p3": "マルコフ同値のもとでの最小介入集合の図的な基準を作り、部分的な輸送可能性によって元の環境の分布から目標環境の報酬の上下界を導き、実験でできることに支えられた反実仮想の行動を定式化した（抄録）。", "p5": "同値な選択肢や劣った選択肢を、最適な行動を残したまま取り除くアルゴリズムが得られ、妥当な事前の上下界のもとで後悔の保証を示した。構造的因果モデルを指定した実験で、これらの削減と移した上下界が学習に与える影響を調べた（抄録）。", "fun": "たくさんのスイッチのうち、どれを押すと一番良い結果になるかを、試しながら探す問題がある。全部を片端から試すのは無駄が多い。因果関係の図が分かっていれば「これを押しても意味がない」ものを先に外せる。この研究は、図が一部しか分からない場合や、別の場所での経験しかない場合でも、どこまで外せるかを明らかにした。", "unverified": "抄録の末尾が切れており、実験の結果の数値と結論の後半は未確認。"}}, {"id": "pn32", "rank": 32, "field": "因果推論", "headline": "予測による反実仮想で波及効果のある処置を評価", "title": "Causal Inference under Interference with Forecast-Based Counterfactuals", "url": "https://doi.org/10.2139/ssrn.7682605", "authors": "Viviana Celli ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Celli, V., Cerqua, A., & Pellegrini, G. (2026). Causal Inference under Interference with Forecast-Based Counterfactuals. https://doi.org/10.2139/ssrn.7682605", "why": "処置の波及（干渉）があるとき、汚染されていない対照群や相互作用の構造への強い仮定に頼らず、予測に基づく反実仮想の方法で平均処置効果を識別・推定できる条件を、潜在結果の枠組みで形式的に分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "処置の影響が他の単位にも及ぶ（波及がある）場合でも、予測に基づく反実仮想の方法で平均処置効果と波及効果を識別・推定できる条件を、初めて形式的に分析した（抄録）。", "p3": "潜在結果の枠組みで、処置がなかった場合の結果を予測で作る方法（FBCM）の識別を検討し、シミュレーションと実証の応用で、対照群に基づく通常の方法と比べた（抄録）。", "p5": "波及が広く及ぶ場合や、誰が誰に影響するか（曝露の写像）が分からない場合でも、主要な集計的な因果効果を識別できることを示した（抄録）。応用の内容と数値は抄録に記載なし。", "fun": "ある町に補助金を出すと、隣の町の景気も良くなるかもしれない。すると「隣の町」を比べる相手に使えなくなる。比べる相手がいなくなったらどうするか。この研究は、過去のデータから「補助金がなかったら自分はどうなっていたか」を予測して、それと比べる方法を調べた。他人ではなく、もう一人の自分と比べる発想である。", "unverified": "本文未読のため、識別に必要な仮定の内容、実証の対象、この方法の限界の具体的な記述は未確認。"}}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "災害の前に注目だけが高まると住宅価格はどう動くか", "title": "Environmental Risk Salience and Real Estate Markets", "url": "https://econpapers.repec.org/RePEc:ces:ceswps:_13073", "authors": "Marco Letta ほか", "venue": "RePEc NEP", "date": "2026-11-02", "why": "以前から知られていた地震リスクが、被害や区分変更なしに注目だけ高まったイタリアの事例を自然実験として使い、最も曝露の大きい持ち家市場で売買価格が下がり、家賃は上がることを示した。", "explain": {"basis": "抄録", "basis_note": "RePEc NEP経由の抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "以前から知られていた環境リスクが、被害が出る前に急に注目されたとき、不動産市場がどう反応するかを、イタリアの事例で示した（抄録）。", "p3": "地震活動の再燃によって、広い破壊・死者・公式の危険区分の変更なしに世間の注目が高まった状況を自然実験として使い、売買価格と家賃、および注目が他の出来事と競合するときの反応を調べた（抄録）。", "p5": "最も曝露の大きい持ち家市場で売買価格が下がり、家賃は上がった。無関係な出来事が注目を奪うときには、地震の信号への反応が弱まった（抄録）。変化の大きさは抄録に記載なし。", "fun": "「ここは地震の危険がある」ことは前から誰もが知っている。それでも、実際に揺れが続いて話題になると、被害がなくても家の値段が下がった。危険そのものは変わっていないのに、である。しかも、他の大きな出来事があると反応は弱まった。人は「知っている」だけでは動かず、「気になった」ときに初めて動くことが分かる。", "unverified": "本文未読のため、対象の地域と期間、価格・家賃の変化の大きさは未確認。"}}, {"id": "pn34", "rank": 34, "field": "経済学", "headline": "関税の報道で家計のインフレ予想が上がる", "title": "Tariff News and Household Inflation Expectations: The Role of Prior Beliefs", "url": "https://doi.org/10.2139/ssrn.7683852", "authors": "Vandana Ramakrishnan", "venue": "SSRN", "date": "2026-11-10", "apa": "Ramakrishnan, V. (2026). Tariff News and Household Inflation Expectations: The Role of Prior Beliefs. https://doi.org/10.2139/ssrn.7683852", "why": "2018〜2025年の米国の7つの関税の局面について、検索の注目のピーク前後で同じ人の予想の改定を比べ、2018年の鉄鋼・アルミ関税で1.18ポイント、2025年7月の相互関税の再開で1.72ポイントの1年先予想の上昇を見いだした。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "大きな関税の発表が家計のインフレ予想を上げること、その反応はもともとの予想が不安定な家計で大きいことを示した（抄録）。", "p3": "2018〜2025年の米国の7つの関税の局面について、検索の注目のピークを特定し、ニューヨーク連銀の消費者予想調査の面接日を使って、ピークの前後で同じ人の予想の改定を比べた（抄録）。", "p5": "1年先の予想は、2018年の鉄鋼・アルミ関税で1.18ポイント、2025年7月の相互関税の再開で1.72ポイント上がった。金融知識の低さは大きな反応を予測したが、消費・住宅・地域の関税への曝露は改定を系統的には予測しなかった（抄録）。", "fun": "関税の知らせを聞いて「これから物価が上がりそうだ」と思うかどうかは、人によって違う。面白いのは、実際に関税の影響を受けやすい暮らしをしているかどうかは関係がなく、もともと物価の見通しがぐらついていた人ほど大きく反応したことである。同じ知らせでも、受け取る側の「前からの思い込み」で効き方が変わる。", "unverified": "本文未読のため、有意でなかった他の局面の推定値と標本の大きさは未確認。"}}, {"id": "pn35", "rank": 35, "field": "経済学", "headline": "中堅国の協調関税は相手が報復すると損になる", "title": "Strength in Numbers? Middle-Power Coalitions and the Gains from Coordinated Tariffs", "url": "https://doi.org/10.2139/ssrn.7681518", "authors": "Oliver Loertscher ほか", "venue": "SSRN", "date": "2026-11-10", "apa": "Loertscher, O., Pujolas, P., & Rossbach, J. (2026). Strength in Numbers? Middle-Power Coalitions and the Gains from Coordinated Tariffs. https://doi.org/10.2139/ssrn.7681518", "why": "2025年の米国の関税引き上げを受け、10の中堅国とEUの連合が協調して関税をかける利益を多部門の一般均衡貿易モデルで計算した。米国の関税が固定なら連合の厚生は0.23%上がるが、米国が反応すると0.03%の損失になる。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "中堅国が協調して関税をかけることで得をするかは、相手国が反応するかどうかと連合の設計に大きく左右されることを示した（抄録）。", "p3": "2025年の米国の関税引き上げを受け、10の中堅国とEUの連合について、投入産出の連関を持つ多部門の一般均衡貿易モデルで、協調関税の効果を引き上げの前後で比べた（抄録）。", "p5": "米国の関税が固定なら共通関税は連合の厚生を0.23%上げるが、米国が反応すると0.03%の損失になる。輸出の多くが米国向けのカナダとメキシコは損をし、加盟国間の関税撤廃のほうが協調的な報復より頑健な利益を生む（抄録）。", "fun": "大国に関税をかけられたとき、中くらいの国が団結してやり返せば勝てるだろうか。計算すると、相手が黙っていれば少し得をするが、相手がやり返すと、わずかな損に変わった。しかも仲間の中で得する国と損する国が分かれてしまう。数を集めるより、仲間どうしの壁をなくすほうが確実に得になる、という結論が意外である。", "unverified": "本文未読のため、連合に含まれる国の一覧とモデルの較正の詳細は未確認。"}}, {"id": "pn36", "rank": 36, "field": "経済学", "headline": "状態が3つ以上だと群集行動は事前分布しだい", "title": "Herding with Multiple States: When the Prior Matters", "url": "https://arxiv.org/abs/2611.13632", "authors": "Xiaoyu Chen", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Chen, X. (2026). Herding with Multiple States: When the Prior Matters (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13632", "why": "逐次的な観察学習で状態が3つ以上あると、同じ情報構造と選好でも、事前分布によって学習が起きる場合と群集行動に陥る場合があることを反例で示し、既存の予想を否定した。学習のための必要条件も導入した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "他人の行動を順に観察して学ぶ状況で、起こりうる状態が3つ以上あると、正しく学べるか群集行動に陥るかが事前の信念に左右されうることを示した（抄録）。", "p3": "同じ情報構造と選好のもとで、ある事前分布では学習が、別の事前分布では群集行動が起きる反例を作り、既存の予想を否定した。そのうえで、信号がどの行動についても「事後的に最適でない」という強い証拠を与えうるという条件（脱出可能性）と、その対ごとの版を導入した（抄録）。", "p5": "脱出可能性が成り立たないと、ある事前分布で群集行動が起き、対ごとの版が成り立たないと、すべての事前分布で起きる。区間最適性と単調尤度比を持つ環境では、脱出可能性が学習と群集行動を事前分布によらず完全に特徴づける（抄録）。", "fun": "行列のできている店に、理由も知らず並んでしまうことがある。前の人の行動を見て、自分の情報を捨ててしまう現象で、経済学では「群集行動」と呼ぶ。選択肢が二つのときは、どんな情報があれば皆が正解に行き着くかが知られていた。この研究は、三つ以上になると話が変わり、最初の思い込みしだいで結末が分かれることを示した。", "unverified": "本文未読のため、反例の具体的な構成と証明の詳細は未確認。"}}, {"id": "pn37", "rank": 37, "field": "経済学", "headline": "貧困層が借りられない国のマクロプルーデンス政策", "title": "Macroprudential Policy When the Poor Cannot Borrow", "url": "https://doi.org/10.2139/ssrn.7682498", "authors": "Fernando Arce ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Arce, F., Levin, Y., & Tran-Xuan, M. (2026). Macroprudential Policy When the Poor Cannot Borrow. https://doi.org/10.2139/ssrn.7682498", "why": "不平等の大きい新興国ほど資本規制が少ないという傾向を、実質為替レートを通じた分配上の外部性で説明する小国開放経済モデルを示し、最適な借入課税をフィッシャー的な部分と分配的な部分に分けた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "不平等の大きい新興国ほど資本規制が少ないという傾向を、実質為替レートを通じた分配上の外部性で説明するモデルを示した（抄録）。", "p3": "非相似的な選好、ときどき効く担保制約に直面する高所得の借り手、その日暮らしの低所得家計からなる小国開放経済モデルを作り、最適な借入課税をフィッシャー的な部分と分配的な部分に分解した（抄録）。", "p5": "不平等を取り入れると、平均の最適なマクロプルーデンス税は大きく下がり、補助金に変わることさえある。生産のある経済に拡張しても、賃金が伸縮的であるかぎり仕組みは量的に重要なままだった（抄録）。数値は抄録に記載なし。", "fun": "外国からお金を借りすぎると危ないので、借入に税をかけて抑える、というのが標準的な考え方である。ところが、貧しい人が借金をできない国では話が変わる。豊かな人の借入が為替レートを動かし、それが貧しい人の買える物の値段に効くからだ。この研究は、貧しい人のためには借入を抑えすぎないほうが良い場合があると示した。", "unverified": "本文未読のため、較正に使った国と、税率の変化の具体的な値は未確認。"}}, {"id": "pn38", "rank": 38, "field": "経営学", "headline": "LLMの束ね売り事業者は補完か競合か", "title": "LLM Competition and the Aggregator Economy", "url": "https://doi.org/10.2139/ssrn.7683780", "authors": "Fupeng Sun ほか", "venue": "SSRN", "date": "2026-11-10", "apa": "Sun, F., Liu, Z., & Wiesemann, W. (2026). LLM Competition and the Aggregator Economy. https://doi.org/10.2139/ssrn.7683780", "why": "複数の提供者の言語モデルを1つの定額契約で使える仲介事業者は、提供者にとって卸売の収入源であり直販の競合でもある。得意分野の異なる2社と利用者の選択をゲーム理論でモデル化した研究。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "複数の提供者の言語モデルを一つの定額契約で使える仲介事業者（アグリゲーター）が、提供者の収入と技術開発の誘因をどう変えるかを、ゲーム理論で分析した（抄録）。", "p3": "それぞれ別の機能に強い二つの提供者と、機能の好みが異なる利用者を考え、利用者が直接契約するか、仲介事業者と契約するか、使わないかを選ぶモデルを作った（抄録）。", "p5": "仲介事業者は好みの偏りが小さい利用者を引き受ける。市場が飽和していないときは利用者を広げるが、直接契約を食って提供者の収入を減らしうる。飽和した市場では既存の契約者を移すだけで、API価格が十分高いときにだけ提供者の得になる（抄録）。", "fun": "いくつものAIを一つの料金でまとめて使えるサービスがある。AIを作る会社から見ると、これは自社のAIを卸売りで買ってくれるお客であり、同時に自社の直接の契約者を奪う競争相手でもある。この研究は、その板ばさみを数式にした。市場がまだ伸びているか、もう行き渡ったかで、味方にも敵にもなることが分かる。", "unverified": "抄録の末尾が切れており、技術開発の誘因についての結論の後半は未確認。理論モデルで実証データは使っていないと読める。"}}, {"id": "pn39", "rank": 39, "field": "経営学", "headline": "四半期報告の任意化案に年次予想のみの企業は株安", "title": "When Quarterly Reporting Becomes Optional: The Role of Prior Disclosure Practices", "url": "https://doi.org/10.2139/ssrn.7685701", "authors": "Francois Brochet ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Brochet, F., & Moonmoon, S. (2026). When Quarterly Reporting Becomes Optional: The Role of Prior Disclosure Practices. https://doi.org/10.2139/ssrn.7685701", "why": "2025〜2026年の米国の3つの政策イベントで、四半期の業績予想を出してきた企業と年次の予想だけの企業を比べ、後者の発表時のリターンが約100ベーシスポイント低いことを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "四半期報告を任意にする案が出たとき、投資家の反応は、その企業がこれまで自発的にどう情報を出してきたかで違うことを示した（抄録）。", "p3": "2025〜2026年の米国の3つの政策イベントの前後で、四半期ごとの業績予想を出してきた企業と、年次の予想しか出していない企業の株価の反応を比べた（抄録）。", "p5": "年次の予想だけの企業は、発表時のリターンが約100ベーシスポイント低かった。差はどのイベントでも負で、定義や測定期間を変えても残り、偽のイベント日と比べても異例に大きい。制度はまだ実施されておらず、反応は投資家の予想を映す（抄録）。", "fun": "「三か月ごとの決算報告を、やってもやらなくてもよいことにする」という案が出た。すると、ふだんから三か月ごとに見通しを話している会社に比べ、年に一度しか話さない会社の株価の反応が悪かった。投資家は「この会社は任意になったら情報を出さなくなる」と先読みしたと解釈できる。ふだんの振る舞いが信用の貯金になっている。", "unverified": "本文未読のため、標本の企業数と、3つのイベントの具体的な内容は未確認。"}}, {"id": "pn40", "rank": 40, "field": "経営学", "headline": "特許保護が弱まると企業は説明会で多くを語る", "title": "Patent Protection and Disclosure", "url": "https://doi.org/10.2139/ssrn.7690238", "authors": "Nemit Shroff ほか", "venue": "SSRN", "date": "2026-11-11", "apa": "Shroff, N., Xie, Y., Yoon, R., & Zhang, B. (2026). Patent Protection and Disclosure. https://doi.org/10.2139/ssrn.7690238", "why": "特許保護の弱まりが特許の担保価値を下げ、無担保の借入への移行を通じて開示の誘因を高めるという仮説を、2014年の米最高裁のAlice判決を使って検証し、影響の大きい企業ほど決算説明会で情報を多く出すことを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "特許保護が弱まると、資金調達の経路を通じて企業の自発的な情報開示が増えることを示した（抄録）。", "p3": "特許保護の弱まりは特許の担保価値を下げ、担保つきの借入から無担保の借入への移行を促す。無担保の貸し手は将来の資金の流れの情報に頼るので開示の誘因が高まる、という仮説を、特定の特許の保護を弱めた2014年の米最高裁のAlice判決を使って検証した（抄録）。", "p5": "判決の影響が大きい企業ほど決算説明会で多くを語るようになり、反応は負債面の資金制約がある企業や特許を担保に入れていた企業で強く、小規模企業や製品市場の競争が激しい企業では弱い。影響を受けた特許は担保に入れられにくくなった（抄録）。", "fun": "特許は発明を守る盾であると同時に、お金を借りるときの担保にもなる。判決で特許の守りが弱くなると、担保としての値打ちが下がり、会社は担保なしで借りるしかなくなる。担保のない貸し手は会社の将来を知りたがるので、会社は自分から多くを語るようになった。発明の法律が、会社のおしゃべりの量を変えるという連鎖が面白い。", "unverified": "本文未読のため、開示の量の測り方と効果の大きさは未確認。"}}, {"id": "pn41", "rank": 41, "field": "経営学", "headline": "フィギュア審判は同国選手を上げ競争相手を下げる", "title": "Taste or Strategy? Nationalistic Bias and Competitor Penalties in Figure Skating Judging", "url": "https://arxiv.org/abs/2611.13194", "authors": "Jialin Liu ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Liu, J., & Shen, S. (2026). Taste or Strategy? Nationalistic Bias and Competitor Penalties in Figure Skating Judging (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13194", "why": "フィギュアスケートの採点データから、審判の同国選手への加点と、その選手の近い競争相手への減点を見いだした。加点は無作為な滑走順に沿って下がり、減点は入賞の見込みとともに大きくなることから、好みでなく戦略的な偏りだと論じる。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "フィギュアスケートの審判が同国の選手を高く採点するだけでなく、その選手の近い競争相手を低く採点することを示し、好みでなく戦略による偏りだと論じた（抄録）。", "p3": "採点の詳しいデータを使い、同国選手への加点が、無作為に決まる滑走順や、競争相手の国の審判がパネルにいるかどうかでどう変わるか、相手への減点が入賞の見込みでどう変わるかを調べた（抄録）。", "p5": "加点は滑走順に沿って下がり、2022/23シーズンより前は、近い競争相手の国の審判がパネルにいると上がった。減点は同国選手の入賞の見込みとともに大きくなり、見込みがなくなると消える。反実仮想の分析では、これらの偏りは接戦の結果を左右しうる（抄録）。", "fun": "自分の国の選手に甘い点を付けるのは、単にその国の演技の好みが似ているだけかもしれない。しかし、ライバル選手にだけ辛い点を付け、しかも自国選手にメダルの見込みがあるときだけそうするなら、好みでは説明できない。この研究は、採点の「いつ・誰に」という細かい型から、ひいきが計算ずくであることを見分けた。", "unverified": "本文未読のため、データの期間と規模、偏りの大きさの数値は未確認。"}}, {"id": "pn42", "rank": 42, "field": "組織行動・心理的安全性", "headline": "公式・非公式のリーダーの役割を実証的に分類", "title": "Mapping Leadership in Teams: An Empirically Grounded Taxonomy of Formal and Peer Leadership Roles.", "url": "https://doi.org/10.31234/osf.io/5b9sy", "authors": "Charlotte Marie Edelmann ほか", "venue": "PsyArXiv", "date": "2026-11-10", "apa": "Edelmann, C. M., Boen, F., Stouten, J., & Fransen, K. (2026). Mapping Leadership in Teams: An Empirically Grounded Taxonomy of Formal and Peer Leadership Roles. https://doi.org/10.31234/osf.io/5b9sy", "why": "職位・学歴・業種の異なる従業員35人への面接から、公式のリーダーと同僚リーダーが担うリーダーシップの機能を帰納的に抽出し、文献と統合した分類を作った研究。", "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "公式のリーダーと同僚の中の非公式なリーダーの両方について、実際に担われているリーダーシップの機能を分類した体系を、面接から帰納的に作った（抄録）。", "p3": "職位・学歴・業種・性別の異なる従業員35人に面接し、質的な内容分析でリーダーシップの機能を抽出した。参加者が個人と集団でカードを並べ分ける作業を行い、機能を上位の役割にまとめた（抄録）。", "p5": "公式のリーダーの役割が10、同僚リーダーの役割が10からなる分類ができた。既存のリーダーシップの枠組みと比べ、先行研究と一致する点と、参加者が挙げた機能によって広がる点を示した（抄録）。", "fun": "リーダーというと、課長や部長のような肩書きのある人を思い浮かべる。しかし職場には、肩書きはないのに皆をまとめたり励ましたりする人がいる。この研究は、働く人に聞き取りをして、両方のリーダーが実際に何をしているかを同じ数の役割に整理した。理論から決めるのでなく、現場の言葉から分類を作った点が特徴である。", "unverified": "本文未読のため、役割の具体的な名称と、分類の信頼性の検討は未確認。"}}, {"id": "pn43", "rank": 43, "field": "組織行動・心理的安全性", "headline": "同じ会社でもチームでAI利用に大きな差", "title": "Uneven Self-Reported AI Use: An Embedded Case Study Across Eleven Teams in a Software Organization", "url": "https://arxiv.org/abs/2611.14154", "authors": "Daniele Veri'", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Veri', D. (2026). Uneven Self-Reported AI Use: An Embedded Case Study Across Eleven Teams in a Software Organization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14154", "why": "ソフトウェア企業の11チーム・98件の構造化面接から自己申告のAI利用を記述し、高頻度利用の割合がチームにより20.0%から71.4%まで開くこと、利用頻度にかかわらず組織のAI方針がほとんど知られていないことを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "一つのソフトウェア企業の中でも、自己申告のAI利用の頻度がチームによって大きく違うことを記述した事例研究である（抄録）。", "p3": "11チームにわたる98件の構造化面接の記録を使い、標準化した尺度で測った65人と、回答の目盛りが異なる尺度で測った33人を分けて集計した（抄録）。", "p5": "標準化した尺度では65人中36人（55.4%）が高頻度の利用を報告し、チームごとの割合は20.0%から71.4%まで開いた。組織のAI方針は、高頻度の人の86.1%、低頻度の人の96.6%が「知らない」か「詳しくは分からない」と答えた（抄録）。", "fun": "同じ会社で同じ道具が使えるのに、あるチームではほとんどの人がAIを毎日使い、別のチームでは少数しか使っていない。しかも、よく使う人も使わない人も、会社のAIの決まりをほとんど知らなかった。道具を配り、規則を作るだけでは、使われ方も守られ方もそろわないことを、数字で示している。", "unverified": "抄録の末尾が切れており、質的な観察の内容は未確認。一社の記述的な事例で、差の原因は示していない。"}}, {"id": "pn44", "rank": 44, "field": "組織行動・心理的安全性", "headline": "裁判所の所長交代で破産手続が速まり融資が増える", "title": "Judicial Performance, Bank Lending and Firms' Investments: Evidence from Court Leadership Turnover", "url": "https://doi.org/10.2139/ssrn.7683845", "authors": "Davide Moretti ほか", "venue": "SSRN", "date": "2026-11-10", "apa": "Moretti, D., Fiordelisi, F., Ruggiero, N., & Baltas, K. (2026). Judicial Performance, Bank Lending and Firms’ Investments: Evidence from Court Leadership Turnover. https://doi.org/10.2139/ssrn.7683845", "why": "イタリアの裁判所長の任命を外生的な変動として使い、所長の交代が破産手続の長期化を抑え、銀行融資の拡大、支払遅延の減少、無形資産への投資につながることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "裁判所の所長の交代が破産手続の長期化を抑え、それが銀行融資の拡大と企業の投資の変化につながることを、イタリアのデータで示した（抄録）。", "p3": "裁判所長の任命を外生的とみなせる変動として使い、所長の交代の前後で破産手続の期間、銀行融資、支払いの遅延、企業の投資を比べた（抄録）。", "p5": "交代は手続期間の伸びを遅くし、効果は新しい所長が若い、管理職の経験がある、地元に根ざしている場合に大きい。司法の効率の改善により銀行融資が増え、支払遅延が減り、大きい企業は無形資産へ投資を移した（抄録）。効果の大きさは抄録に記載なし。", "fun": "裁判所のトップが替わると、会社がお金を借りやすくなる。一見つながりのない話だが、道筋はこうである。新しい所長が仕事の進め方を改めると、破産の手続きが早く終わる。すると貸したお金を取り戻しやすくなるので、銀行が安心して貸す。組織の長の交代が、建物の外の経済まで動かすことを示した点が面白い。", "unverified": "本文未読のため、標本の期間と規模、推定値の大きさは未確認。"}}, {"id": "pn45", "rank": 45, "field": "計算社会科学・ネットワーク科学", "headline": "少数の観測者から拡散源を早期に特定", "title": "EAGLE: Early Identification of Information Propagation Sources through Generalized Bayesian Inference in Large-scale Social Networks", "url": "https://arxiv.org/abs/2611.13919", "authors": "Tao Wen ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Wen, T., Chen, Y.-wang, Zhao, J., Pan, C., Syed, T. A., Ahn, Y.-Y., & Cheong, K. H. (2026). EAGLE: Early Identification of Information Propagation Sources through Generalized Bayesian Inference in Large-scale Social Networks (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13919", "why": "大規模な社会ネットワークで情報拡散の発信源を早期に特定するため、進化計算で少数の観測者を配置し、信頼度の異なる観測を一般化ベイズ推論で統合する枠組みを提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "大規模な社会ネットワークで、少数の観測者の情報から情報拡散の発信源を早い段階で特定する枠組みEAGLEを提案した（抄録）。", "p3": "進化計算で少数の観測者を戦略的に配置し、信頼度の異なる観測データを一般化ベイズ推論で統合する。データの不確かさと雑音を明示的に取り込み、拡散の特性や利用者の属性についての仮定に頼らない（抄録）。", "p5": "多様なネットワークと拡散の筋書きで既存の最良のモデルを一貫して上回り、Twitterの実際の拡散経路のデータでも、限られた観測者から大規模ネットワークの発信源の候補を特定できた（抄録）。数値は抄録に記載なし。", "fun": "うわさがどこから始まったかを突き止めるのは難しい。全員に聞いて回ることはできないからだ。この研究は、ネットワークの中の「ここに立てば流れがよく見える」という見張り場所を少数選び、そこに届いた時刻や内容から出どころを逆算する。見張りの言うことが少し当てにならなくても、確からしさを重みにして答えを絞り込む。", "unverified": "抄録の末尾が切れており、精度の数値とネットワークの規模は未確認。"}}, {"id": "pn46", "rank": 46, "field": "計算社会科学・ネットワーク科学", "headline": "2回の接触が要る伝染で採用と放棄の波が生まれる", "title": "Oscillations in two-stage contagion on networks: contagion structure, turnover and connectivity", "url": "https://arxiv.org/abs/2611.12920", "authors": "Francisco J. Mu\\~noz ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Muñoz, F. J., Nuño, J. C., Meacci, L., & Primicerio, M. (2026). Oscillations in two-stage contagion on networks: contagion structure, turnover and connectivity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.12920", "why": "採用に2回の接触が必要な2段階伝染のモデルに人口の入れ替わりを加えると、採用と放棄の振動が超臨界ホップ分岐で生じ、初回接触での採用確率が小さく入れ替わりが遅いことが条件になることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "採用するまでに採用者と二回接触する必要がある伝染の過程に、人の入れ替わりを加えると、採用と放棄の波が生まれる条件を明らかにした（抄録）。", "p3": "不活性な人の貯まりを通じた入れ替わりと、小さな自発的活性化を持つ二段階伝染のモデルを、平均場の記述、有限の人口での揺らぎ、ネットワーク上の対近似とシミュレーションで調べた（抄録）。", "p5": "平均場では振動は超臨界ホップ分岐で生じ、初回の接触での採用確率が約0.17以下で、入れ替わりが遅いことが必要である。有限の人口では人口学的な雑音がこの領域の外でも準周期を保ち、ネットワークのつながりを減らすと振動は弱まる（抄録）。", "fun": "流行は、一人から聞いただけでは乗らず、二人目から聞いて初めて乗る、ということが多い。そこに「飽きてやめる人」と「新しく入ってくる人」が加わると、流行は一度きりで終わらず、寄せては返す波になることがある。この研究は、波が生まれる条件を数式で突き止めた。流行り廃りの繰り返しに、単純な仕組みがありうることが分かる。", "unverified": "抄録の末尾が切れており、四つ目の発見と臨界の平均次数の値は未確認。"}}, {"id": "pn47", "rank": 47, "field": "計算社会科学・ネットワーク科学", "headline": "集計データだけで都市の移動を個人単位で再現", "title": "Spatial patterns of transportation choice in Niter\\'oi", "url": "https://arxiv.org/abs/2611.14499", "authors": "Sandro Martinelli Reia ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Reia, S. M., Anderson, T., & Pfoser, D. (2026). Spatial patterns of transportation choice in Niterói (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14499", "why": "集計的で静的な都市データから、合成人口・建物・交通網を組み合わせて日々のトリップと交通手段を生成する枠組みを作り、ブラジル・ニテロイ市の約47万5千人の合成住民に適用して実測と照合した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "集計的で静的な都市データだけから、個人単位の一日の移動と交通手段の選択を再現する計算の枠組みを作り、ブラジルのニテロイ市に適用した（抄録）。", "p3": "既存の活動シミュレータを基に、合成人口、建物などの環境、交通網を組み合わせて日々のトリップを生成し、徒歩・自動車・公共交通を割り当てる（抄録）。", "p5": "約475,000人の合成住民で、地区ごとの公共交通の利用の模様は実測の活動の代理指標と強く関連した（相関係数0.885）。バス停までの徒歩時間を30%減らすと、公共交通と自動車の比が11.3%上がり、周辺部のいくつかの地区で伸びが大きかった（抄録）。", "fun": "人が街をどう動いているかを知るには、ふつう携帯電話の位置情報のような高価なデータが要る。この研究は、人口や建物や路線図という、どの街にもある大づかみのデータだけから、コンピュータの中に仮想の住民を作って一日を過ごさせた。すると実際の動きとよく合い、バス停を近くすると車よりバスが選ばれる地区まで分かった。", "unverified": "本文未読のため、実測の代理指標の内容と、交通手段の割当ての規則は未確認。"}}, {"id": "pn48", "rank": 48, "field": "計算社会科学・ネットワーク科学", "headline": "携帯・センサ・GPSを分担させた地域交通の再現", "title": "Data-driven regional traffic simulation from heterogeneous mobility sources", "url": "https://arxiv.org/abs/2611.13947", "authors": "Federico Bellisardi ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Bellisardi, F., Mizzi, C., Fabbri, A., Micheli, D., Vannelli, A., & Bazzani, A. (2026). Data-driven regional traffic simulation from heterogeneous mobility sources (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.13947", "why": "イタリアのエミリア＝ロマーニャ州の日々の交通を、携帯データでトリップと時刻、路側センサで交通量、GPS軌跡で経路選択を与えるエージェントベースのシミュレータで再現し、各データ源の寄与を測った。総交通量は冬に観測の1%以内、夏に10%以内だった。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "携帯電話・路側センサ・GPSという異なるデータを役割分担させた地域交通のシミュレータを作り、それぞれのデータが何に寄与するかを測った（抄録）。", "p3": "イタリアのエミリア＝ロマーニャ州の日々の交通について、携帯データでトリップと時刻を、半数の路側センサで交通量の水準を、全センサで局所の補正を、GPS軌跡で経路選択を与え、シミュレーションを使わない予測と比べた（抄録）。", "p5": "総交通量は冬に観測の1%以内、夏に10%以内で、道路の順位づけは道路種別による予測より良かった（順位相関0.67〜0.68対0.41〜0.48、冬）。個々の道路の誤差は単純な予測と同程度にとどまった（抄録）。", "fun": "交通の予測には、携帯の位置、道路のセンサ、車のGPSなど、いろいろなデータが使われる。全部混ぜれば良くなるはずだが、どれが何の役に立っているのかは意外に分かっていない。この研究は、データを一つずつ役割に割り当てて効き目を測り、「うまくいかなかった点」まで正直に報告している。道具の実力を冷静に確かめる姿勢が参考になる。", "unverified": "本文未読のため、センサの数と誤差の指標の定義は未確認。著者自身が評価は完全には独立でないと述べている。"}}, {"id": "pn49", "rank": 49, "field": "計算社会科学・ネットワーク科学", "headline": "AIの研究支援は開発国に有利な偏りを持つか", "title": "Can AI be a 'Researcher Without Borders'? Auditing Bias in AI-Assisted Social Science Research about China and the US", "url": "https://arxiv.org/abs/2611.14288", "authors": "Yuan Zhang ほか", "venue": "arXiv", "date": "Wed, 11 Nov 2026", "apa": "Zhang, Y., Bertaglia, T., & Schroeder, R. (2026). Can AI be a 'Researcher Without Borders'? Auditing Bias in AI-Assisted Social Science Research about China and the US (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.14288", "why": "中国と米国に関する社会科学の問いについて、言語モデルが開発国やその学術的伝統の理論を優遇するかを監査した研究。合意された正解のない社会科学でのAI利用の偏りを扱う。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用（本文は未取得。抄録の末尾は取得時に切れている）", "preprint": true, "short": true, "p1": "言語モデルを社会科学の研究補助に使うとき、開発された国やその学術的伝統の理論をひいきする偏りがあるかを監査する課題を設計した（抄録）。", "p3": "米国と中国に関する社会科学の問いと、より一般的な問いについて短い小論を書かせ、問いの種類（国の比較、特定の国、一般）、モデル（米国製・中国製・欧州製）、指示の出し方の3つの条件を変えて比べた（抄録）。", "p5": "取得できた抄録は方法の説明の途中で切れており、偏りの有無と大きさの結果は未確認（抄録・本文を入手できた範囲に記載なし）。", "fun": "数学の問題には正解があるので、AIの答えが合っているかはすぐ分かる。しかし「なぜこの国は経済成長したか」のような社会科学の問いには、決まった正解がない。そこでAIが自分の生まれた国に都合のよい説明を選んでいても気づきにくい。この研究は、同じ問いを作られた国の違うAIに書かせて比べる、という確かめ方を考えた。", "unverified": "抄録が途中で切れており、結果と結論は未確認。"}}, {"id": "pn50", "rank": 50, "field": "人口学", "headline": "国の富を人口と領土から測り直す", "title": "The Wealth of Nations According to Adam Population, Territory, and Welfare", "url": "https://doi.org/10.2139/ssrn.7685298", "authors": "Juan Carlos Cordoba", "venue": "SSRN", "date": "2026-11-11", "apa": "Cordoba, J. C. (2026). The Wealth of Nations According to Adam Population, Territory, and Welfare. https://doi.org/10.2139/ssrn.7685298", "why": "1人あたりの豊かさと国の富を区別し、王朝的な選好のもとで「統計的生命の価値×土地あたりの有効な人数」として国の富を測った。87か国のうち米国は、この富では19位、消費等価で測った厚生のストックでは48位になると報告する。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録を使用（本文は未取得）", "preprint": true, "short": true, "p1": "一人あたりの豊かさと「国の富」を区別し、人口と領土を含めて国の富を測り直す方法を示した（抄録）。", "p3": "王朝的な選好（Barro–Becker型）を使い、土地一単位あたり一人の創始者を所与として、その厚生で人口の歴史を評価する。国の富は、統計的生命の価値に、土地あたりの有効な人数を掛けたものになる（抄録）。", "p5": "87か国の中で、米国は富では十九位、消費等価で測った厚生のストックでは四十八位だった。中国の富は米国の45%で、一人あたりでは14%である。1500年以降、世界の代表的な集計の富は約173倍になった（抄録）。", "fun": "国の豊かさは、ふつう一人あたりの所得で比べる。しかしアダム・スミスは「一人ひとりの暮らし」と「国全体の富」を分けて考えていた。この研究は、人がどれだけ多く生きられるかも勘定に入れて国の富を測った。すると順位が大きく入れ替わる。何を「豊か」と呼ぶかで、世界の見え方が変わることが分かる。", "unverified": "本文未読のため、指標の式の詳細、使用データ、比較対象の指標（3,714倍とされる別の測り方）の定義は未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "PC橋の継手のひび割れ幅を橋をまたいで評価", "title": "A Data‐Driven Framework for Assessing Damage Development in Coupling Joints of Prestressed Concrete Bridges", "url": "https://doi.org/10.1155/stc/3195765", "authors": "Yasser Alqasem ほか", "venue": "Structural Control and Health Monitoring", "date": "2026-11-11", "citescore": 10.3, "citescore_year": "2025", "apa": "Alqasem, Y., & Puttkamer, L. (2026). A Data‐Driven Framework for Assessing Damage Development in Coupling Joints of Prestressed Concrete Bridges. Structural Control and Health Monitoring, 2026(1). https://doi.org/10.1155/stc/3195765", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず）", "preprint": false, "p1": "プレストレストコンクリート橋の連結継手の状態を、ひび割れ幅の監視データから、異なる橋どうしで比べられるようにするデータ駆動の枠組みを示した（抄録）。", "p2": "既設のプレストレストコンクリート構造の連結継手は疲労上の弱点で、静的な照査でも不足が見られることが多い。ひび割れ幅の変化の連続監視で状態を評価できるが、橋ごとに形状・スパン・構造形式が違い、監視データをそのままでは比べられない（抄録）。", "p3": "継手部と参照断面の両方を変位計で測り、ひび割れ幅の変化を得る。ひび割れのない状態では付着による疲労の危険は小さく、ひび割れた状態では応力を主に緊張材が受け持つ。交通と温度の荷重によってひび割れは開いたり閉じたりする。異なる橋の不均質な監視データを共通の尺度の範囲に正規化して比較可能なデータベースを作り、教師なし学習によるクラスタリングと、順伝播型ニューラルネットによる回帰で状態を評価する（抄録）。", "p4": "3つの橋の監視データを使う概念実証で、ニューラルネットは橋を単位とする交差検証で評価する。正規化したデータが状態に対応する群に分かれるか、未知の橋へ予測を移せるかを見る（抄録）。評価指標の値は抄録に記載なし。", "p5": "正規化により、形状・スパン・構造形式が違っても、損傷の状態の水準で橋どうしを比べられた。正規化したデータは状態に関連する群に分けられた。ニューラルネットは、未知の橋のデータでもひび割れ幅の変化の傾向を捉えたが、絶対値の予測には差があり、予測の水準の移転可能性は限られた（抄録）。数値は抄録に記載なし。", "p6": "著者は、対象が3つの橋に限られることを明記している。傾向は移せても絶対値は移せないため、橋ごとの較正なしに閾値の管理へ使えるかは示されていない（抄録）。計測期間、センサの数、荷重の分離の方法は、本文を読めておらず未確認。", "fun": "橋のひび割れの幅は、車が通るたび、気温が変わるたびに、わずかに開いたり閉じたりしている。その動きを測り続ければ継手の傷み具合が分かるが、橋は一つひとつ大きさも造りも違うので、ある橋で分かった目安を、別の橋にそのまま当てはめられない。この研究は、数字を共通の物差しにそろえることで、違う橋の経験を持ち寄れるかを試した。「変化の仕方」は共有できたが、「値そのもの」は共有しきれなかった、という率直な結果が興味深い。", "unverified": "本文は取得できず、3橋の諸元、監視期間、正規化の式、クラスタの数と誤差の数値は未確認。"}}, {"id": "jr02", "rank": 2, "headline": "センサ故障診断の予測と説明の一致をエッジで検証", "title": "Edge-based explainable multisensor fault diagnosis for structural health monitoring", "url": "https://doi.org/10.1177/14759217261504351", "authors": "Heba Al-Nasser ほか", "venue": "Structural Health Monitoring", "date": "2026-11-11", "sjr": 1.364, "citescore": 14.4, "citescore_year": "2025", "apa": "Al-Nasser, H., Dragos, K., & Smarsly, K. (2026). Edge-based explainable multisensor fault diagnosis for structural health monitoring. Structural Health Monitoring. https://doi.org/10.1177/14759217261504351", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず）", "preprint": false, "p1": "構造ヘルスモニタリングのセンサ故障の診断を、センサの近くの小型計算機（エッジ）で行い、その予測と「どのセンサが根拠か」という説明が一致するかを数量的に評価する方法を示した（抄録）。", "p2": "監視システムは信頼できる計測に頼るため、センサ故障の診断はデータ品質の維持に欠かせない。エッジ計算の研究の多くは予測性能と計算の実行可能性に注目し、予測と説明が合っているかはほとんど調べられていなかった（抄録）。", "p3": "故障を「どのセンサが」「どんな種類の故障か」の組合せのクラスとして定式化し、検出・切り分け・同定を一つの分類課題で行う。ゲート付き回帰ユニット（GRU）による系列分類器が、複数センサの時系列の窓を「故障なし」か各故障クラスに分類する。勾配×入力で時刻ごとの寄与を求めてセンサごとに集計し、最も寄与の大きいセンサが、予測クラスに含まれるセンサと一致するかを測る（抄録）。", "p4": "独立に学習させたエッジ上の実装を、条件をそろえた集中型の実装と比べ、予測性能、説明の忠実さ、センサ水準での予測と説明の一致を評価する。集中型では説明の安定性と帰属手法への依存も調べ、エッジでは実行時間を測る（抄録）。対象の構造物とデータの規模は抄録に記載なし。", "p5": "二つの実装は予測性能とセンサ水準の帰属の傾向がほぼ同等だったが、どちらも予測と説明の完全な一致には達しなかった。局所的な忠実さは中程度、センサの帰属の分布の安定性は高く、最も寄与の大きいセンサの選択は帰属手法によって変わった。予測と説明の生成は、平均して窓の更新間隔の中でエッジの計算機上で終わった（抄録）。数値は抄録に記載なし。", "p6": "著者は概念実証と位置づけ、より大きなセンサ網、異なる構造物、変化する運用・環境条件での検討を今後の課題とする。特定の故障クラスでは、応答のどの時間部分を使うかに分類性能が敏感だった（抄録）。精度と一致率の数値は、本文を読めておらず未確認。", "fun": "橋や建物を見張るセンサ自身が壊れることがある。壊れたセンサの値を信じると、構造物が傷んだと誤解してしまう。そこでAIに「どのセンサがおかしいか」を当てさせるのだが、この研究はさらに一歩進めて、AIに「なぜそう思ったか」も答えさせ、その理由が答えと食い違っていないかを調べた。あるセンサの故障だと答えながら、根拠として見ていたのは別のセンサだった、ということが起こりうる。答えだけでなく理由の筋が通っているかを確かめる姿勢が大切である。", "unverified": "本文は取得できず、対象の構造物、センサの数、故障の種類、精度・一致率・実行時間の数値は未確認。"}}, {"id": "jr03", "rank": 3, "headline": "データが乏しい構造物のベイズ更新を整理", "title": "Bayesian Updating for Safety-Critical Structures under Limited Data", "url": "https://doi.org/10.1061/ajrua6.rueng-2074", "authors": "Xin Gu ほか", "venue": "ASCE-ASME Journal of Risk and Uncertainty in Engineering Systems Part A Civil Engineering", "date": "2026-11-10", "citescore": 4.7, "citescore_year": "2025", "apa": "Gu, X., Li, Y., Zhao, Z., & Zhang, W. (2027). Bayesian Updating for Safety-Critical Structures under Limited Data. ASCE-ASME Journal of Risk and Uncertainty in Engineering Systems, Part A: Civil Engineering, 13(1). https://doi.org/10.1061/ajrua6.rueng-2074", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず）", "preprint": false, "p1": "安全上重要な構造物の信頼性評価で、観測データがごく少ないときのベイズ更新の方法を、4つの系統に整理した総説である（抄録）。", "p2": "ベイズ更新は事前の知識と現場の観測を融合する厳密な確率の枠組みだが、実務では監視データがきわめて疎で、尤度関数の不良設定、事前分布への強い依存、次元の呪い、尤度の誤特定といった根本的な困難が生じる（抄録）。", "p3": "少数データの障害を乗り越える戦略として、効率的なサンプリングと近似の技法、代替モデルを使った更新、複数の忠実度・複数の情報源のデータ融合、物理を組み込んだベイズ機械学習の4つを系統的に概観する（抄録）。背景：代替モデルは、重い数値解析を速い近似で置き換えて、多数回の評価を可能にするもの。", "p4": "総説であり、独自のデータによる検証はない。橋梁工学、地盤工学、海洋プラットフォームの基礎での典型的な適用例をまとめる（抄録）。対象文献の数と選び方は抄録に記載なし。", "p5": "大きな進歩がある一方、デジタルツインのための実時間の更新、不精確確率の理論との統合、時間とともに変わる劣化のモデル、水理特性と構造物の相互作用の考慮が、残された重要な研究課題として挙げられている（抄録）。数値は抄録に記載なし。", "p6": "抄録には総説としての限界の記載がない。各手法の比較が定量的かどうか、適用例の網羅性、推奨される手順の有無は、本文を読めておらず未確認。", "fun": "橋の強さを確かめたくても、測れるデータはほんの少ししかないことが多い。データが少ないと、「測る前の思い込み」が結論を大きく左右してしまう。ベイズ更新は、思い込みとデータを確率の計算で混ぜ合わせる方法だが、データが少ないほど計算は不安定になる。この総説は、その難しさにどう立ち向かうかを四つの道具箱に分けて見せてくれる。少ない手がかりからどこまで確かなことが言えるか、という問いは、工学に限らず多くの場面に通じる。", "unverified": "本文は取得できず、取り上げた手法の具体名、適用例の詳細、文献の範囲は未確認。"}}, {"id": "jr04", "rank": 4, "headline": "非線形サスペンションで車体の変形応答が下がる", "title": "Effects of Nonlinear Suspension Stiffness on Vehicle Chassis Dynamics", "url": "https://doi.org/10.1115/1.4072781", "authors": "Zhong-Yi Fan ほか", "venue": "ASME Open Journal of Engineering", "date": "2026-11-11", "citescore": 3.8, "citescore_year": "2025", "apa": "Fan, Z.-Y., & Tien, M.-H. (2026). Effects of Nonlinear Suspension Stiffness on Vehicle Chassis Dynamics. ASME Open Journal of Engineering, 1–26. https://doi.org/10.1115/1.4072781", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず）", "preprint": false, "p1": "サスペンションの剛性の非線形性が、変形する車体（シャシー）の局所的な応答に与える影響を、有限要素モデルと縮約手法を組み合わせて効率よく計算できる枠組みを示した（抄録）。", "p2": "サスペンションの剛性は非線形であることが多く、車両全体の挙動への影響を予測しにくい。従来の集中定数モデルによる非線形の車両の動力学の研究は、変形する車体構造の局所的な応答を捉えられなかった（抄録）。", "p3": "車体を有限要素でモデル化し、Craig–Bamptonの部分構造モード合成法で自由度を減らして、サスペンションの剛性の設定を変えたときの動的応答を計算する。ピッチ、ロール、両者を合わせた加振のもとでの局所の変位と構造の変形に注目する（抄録）。背景：この縮約手法は、部品どうしをつなぐ境界の自由度を残し、内部は少数の固有モードで表す。", "p4": "線形の剛性と強い非線形の剛性の設定を、調べた加振周波数の範囲で比べ、車体の変位と変形の振幅の最大値を指標とする（抄録）。車両の諸元、実験との比較の有無、計算時間は抄録に記載なし。", "p5": "強い非線形の剛性の設定は、調べた周波数の範囲で、線形の設定より車体の変位と変形の振幅の最大値が小さかった。枠組みは車体の動力学を効率よく正確に計算できるとする（抄録）。数値は抄録に記載なし。", "p6": "抄録には限界の記載がない。結果は調べた周波数範囲と加振の種類に限られる。実車の計測による検証、路面からの入力やタイヤの扱い、非線形の剛性の具体的な形は、本文を読めておらず未確認。", "fun": "車のばねは、縮むほど固くなるなど、単純な比例関係では動かないことが多い。一方、車体そのものも完全に固い箱ではなく、わずかにたわんだり、ねじれたりする。この二つを同時に扱うと計算が重くなるので、車体を「変形しない塊」とみなすことが多かった。この研究は、車体の変形を少数の「揺れ方の型」の足し合わせで表して計算を軽くした。すると、固くなるばねのほうが車体の揺れの山が低くなる、という結果が得られた。", "unverified": "本文は取得できず、モデルの自由度と縮約後の次元、非線形剛性の式、振幅の低減の大きさは未確認。"}}, {"id": "jr05", "rank": 5, "headline": "開示イベントの順序で財務困窮を1〜2年前に予測", "title": "Regulatory Disclosure Sequences and Corporate Distress Risk: Evidence from Korean DART Filings", "url": "https://doi.org/10.1007/s10690-026-09651-w", "authors": "Yuyong Kim", "venue": "Asia-Pacific Financial Markets", "date": "2026-11-11", "citescore": 5.8, "citescore_year": "2025", "apa": "Kim, Y. (2026). Regulatory Disclosure Sequences and Corporate Distress Risk: Evidence from Korean DART Filings. Asia-Pacific Financial Markets. https://doi.org/10.1007/s10690-026-09651-w", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "出版社（Springer）のPDF本文（データ§3.1、予測の設計§4.1・§4.2、主な結果§5.1・§5.2と表2、限界§7）を読んだ。株価の拡張分析（§5.9）とLLMによる事例検討の詳細は読んでいない", "preprint": false, "p1": "企業が規制当局に出す主要事項の開示が「どんな種類を、どんな順序と頻度で」出されたかという系列から、財務指標だけでは捉えきれない財務困窮の兆しを、1〜2年先について予測できることを示した（抄録、§8）。", "p2": "財務困窮の予測は、会計の基礎的な指標と市場の信号に頼ってきた。規制上の開示イベントの系列が、それらを超える追加の情報を持つかどうかは、韓国の資本市場について検証されていなかった（抄録）。", "p3": "韓国の電子開示システムDARTの主要事項の報告を、倒産・再生、上場・売買の状態、債務不履行、資本構成のストレス、ガバナンス・支配の変更、その他の6分類に対応づける。企業・年の基準日ごとに、その日までに入手できた開示と財務報告だけから、累積件数、直近90〜730日の件数、分類の多様性、最後のイベントからの日数、特定の組合せの有無といった特徴量を作り、基準日から365日以内・730日以内に困窮のイベントが起きるかを予測する（§3.1、§4.1、§4.2）。", "p4": "2015〜2024年の19,924企業・年（2,798社）のパネルで、時間的に後の期間をテストにする時間外検証を行う。系列だけのロジット、財務だけのロジット、両方を使うランダムフォレストを、ROC AUC、平均適合率、上位10%に絞ったときの的中の濃さ（リフト）で比べる（抄録、表2）。", "p5": "365日先の予測のAUCは、系列のみ0.7686、財務のみ0.7312に対し、両方を使うランダムフォレストは0.9060で、上位10%のリフトは6.90だった。730日先でも、較正したランダムフォレストは0.8998だった（表2）。最良の365日モデルのAUCの95%信頼区間は0.8778〜0.9387である（§5.2）。弱い代理ラベルを除いても中心の結果は保たれた（抄録）。", "p6": "著者は、困窮のラベルが再生・不履行・上場状態・解散という性質の異なるイベントをまとめたもので、合併や自主的な上場廃止を含みうること、財務の基準モデルが公開情報から組める範囲の代理であること、株価の拡張分析が厳密なイベントスタディでないこと、LLMによる検討は30件で定量的な主張を支えないことを挙げる（§7）。", "fun": "会社が傾く前には、決算の数字が悪くなるより先に、「増資をします」「転換社債を出します」「経営の体制が変わります」といったお知らせが続けて出ることがある。この研究は、お知らせの文章を細かく読むのではなく、どの種類が、どんな間隔で、どんな組合せで出たかという「並び方」を数えた。それだけで、決算書の数字だけを見るより、危ない会社を上位に並べる精度がはっきり上がった。数字より先に、行動の並びに兆しが表れるという発見である。", "unverified": "株価の特徴量を加えた分析（§5.9）の数値、特徴量の重要度（§5.5）、LLMによる事例検討の内容は確認していない。"}}, {"id": "jr06", "rank": 6, "headline": "MPMの時空間の局所細分化を重合Schwarzで", "title": "An overlapping Schwarz space-time refinement framework for multi-resolution material point method", "url": "https://doi.org/10.1007/s00466-026-02884-6", "authors": "Zhaofeng Luo ほか", "venue": "Computational Mechanics", "date": "2026-11-11", "sjr": 1.223, "citescore": 7.7, "citescore_year": "2025", "apa": "Luo, Z., Li, M., & Jiang, Y. (2026). An overlapping Schwarz space-time refinement framework for multi-resolution material point method. Computational Mechanics. https://doi.org/10.1007/s00466-026-02884-6", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "出版社（Springer）のPDF本文（手法の§3.1・§3.3、介在物の問題§4.3の冒頭、重なり幅の検討§4.4、結論§5）を読んだ。界面の演算子の式（§3.2）と各ベンチマークの詳細な数値は読んでいない", "preprint": false, "p1": "粒子法の一種である物質点法（MPM）で、細かい格子と小さい時間刻みを必要な場所にだけ使い、残りは粗いままで計算できる、重合Schwarz法による時空間の局所細分化の枠組みを示した（抄録、§5）。", "p2": "局所的な変形、接触、大きな幾何学的非線形がある問題では、精度を決めるのは一部の領域なのに、全体を一様に細かくすると計算が高価になる。既存の細分化は、基底関数の修正、特別な遷移カーネル、界面の拘束の強制などを要し、標準のMPMの構造を保てなかった（抄録、§5）。", "p3": "材料の領域を、粗い格子と大きい時間刻みの背景領域と、細かい格子と小さい時間刻みの細分化領域に、重なりを持たせて分ける。各領域は独自の粒子の組と標準のMPMの離散化を持つ。粗い領域が1ステップ進む間に細かい領域は複数のサブステップを進み、質量で重みづけた空間の伝達と、時間方向の補間で境界条件を受け渡すSchwarzの反復を、収束するまで繰り返す（§3.1、§3.3）。", "p4": "重力を受ける片持ち梁、Hertzの接触、弾性の介在物（解析解のある問題）のベンチマークで、解析解または細かい一様格子の参照解と比べ、応力の誤差と計算時間を評価する。重なりの幅への感度と、3次元の折りたたみの例も示す（§4.3、§4.4、抄録）。", "p5": "介在物の問題では、最も細かい解像度で、単一領域の細かい計算と同程度の応力の誤差を保ちながら、一様な細格子のMPMに対して4.3〜9.1倍の高速化を得た（抄録、§5）。重なりを広げるとSchwarzの反復回数は粗い1ステップあたり3〜4回から約2回に減るが、1回あたりの費用は増えるため、全体の費用は重なり幅が粗い格子幅の約10倍までほぼ平坦だった（§4.4、図17）。", "p6": "著者は、同じ精度と計算条件での他の局所細分化・適応型のMPMとの比較は行っておらず、今後の課題とする。弾塑性材料、領域の適応的な配置、多数の部分領域、大規模な並列実装への拡張も今後の課題である（§5）。サブサイクルの比の上限に一般的な解析的な保証はない（§3.1）。", "fun": "粘土をこねる様子をコンピュータで再現するとき、形が大きく変わるのは指が当たる部分だけで、ほかはあまり動かない。それなのに全体を同じ細かさで計算するのはもったいない。この研究は、大事な部分だけを細かいマス目と短い時間の歩幅で、残りを粗いマス目と長い歩幅で計算し、境目で互いの結果を何度か見せ合って、つじつまが合うまで調整する。地図の一部だけ拡大して見るようなやり方で、同じ精度のまま数倍速くなった。", "unverified": "片持ち梁とHertz接触の誤差の数値（§4.1、§4.2）、界面の演算子の定義（§3.2）、収束判定の詳細（§3.4）は確認していない。"}}, {"id": "jr07", "rank": 7, "headline": "浅い地すべりが尾根近くで始まる位置を予測", "title": "Deep Learning and Mechanistic Framework Reveal Key Controls on Upper‐Slope Initiation of Rainfall‐Induced Shallow Landslides", "url": "https://doi.org/10.1029/2026jf009303", "authors": "Junyu Wu ほか", "venue": "Journal of Geophysical Research: Earth Surface", "date": "2026-11-10", "sjr": 1.437, "citescore": 6.6, "citescore_year": "2025", "apa": "Wu, J., Lü, Q., Liao, Z., Yu, Y., Song, J., & Wang, L. (2026). Deep Learning and Mechanistic Framework Reveal Key Controls on Upper‐Slope Initiation of Rainfall‐Induced Shallow Landslides. Journal of Geophysical Research: Earth Surface, 131(11). https://doi.org/10.1029/2026jf009303", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（出版社サイトの本文は取得できず）", "preprint": false, "p1": "降雨による浅い地すべりが、同じ斜面の中でなぜ尾根に近い特定の位置から始まるのかを、深層学習による予測と、浸透と安
