<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">

<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>

</div>

02", "rank": 2, "headline": "1分足の市場は決算前に業績悪化を察知するか", "title": "The Invisible Balance Sheet: Can Intraday Financial Markets Detect Corporate Deterioration Before Accounting Disclosures?", "url": "https://doi.org/10.6084/m9.figshare.34907130", "authors": "Simon-Pierre Boucher", "venue": "Figshare", "date": "2026-11-03", "apa": "Boucher, S.-P. (2026). The Invisible Balance Sheet: Can Intraday Financial Markets Detect Corporate Deterioration Before Accounting Disclosures? figshare. https://doi.org/10.6084/M9.FIGSHARE.34907130", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Figshareの記録に登録された抄録（OpenAlex経由）を使用、本文は取得できず", "preprint": true, "p1": "1分足の高頻度市場データは、日次データを超えて決算前の営業利益の悪化を予測する情報を持たないことを、厳密に時点をそろえた大規模パネルで示した（抄録）。", "p2": "情報に敏感な取引は高頻度データに表れるとされるが、会計上の悪化を開示前にどこまで先取りしているかは、情報集合と予測期間をそろえた比較がなかった（抄録）。", "p3": "米国上場3,796社・102,522企業四半期（2013〜2026年）を67億本の1分足と提出日つき四半期決算から作り、決算発表の20取引日前に、季節ランダムウォークを基準とする営業利益の悪いサプライズを予測した。基本情報（ファンダメンタルズと日次OHLCV）に30分・5分・1分足の特徴を加え、同じ24回の調整予算と12のリーク防止テストで比べた（抄録）。", "p4": "未使用の2021〜2026年の53,667企業四半期で、対数損失の対の変化を、事前登録の最小検出差0.0025と比べて評価した（抄録）。", "p5": "ファンダメンタルズで対数損失は0.6282から0.4937（AUC 0.797）、日次データで−0.0068（AUC 0.803）改善したが、1分足は+0.0013（ロジスティック）、+0.0016（木）で改善なし。5つの予測期間、5つの会計目標、未学習企業でも結果は同じで、ポートフォリオでの経済的価値もなかった（月次α −0.59%）（抄録）。", "p6": "米国市場のみで、悪化の定義は季節ランダムウォーク基準に依存する（抄録）。解釈：否定的な結果であり、別の高頻度特徴量の設計なら結論が変わる可能性は残る。", "fun": "「プロの投資家は決算前に悪い知らせを嗅ぎつけていて、それは1分ごとの値動きに表れるはず」という直感を、67億本の値動きデータで確かめたら、何も表れていなかった、という研究です。細かく見ればもっと分かる、とは限らないところが面白い点です。", "unverified": "12のリーク防止策の具体的内容、使った特徴量の一覧は本文で未確認。"}}, {"id": "pr03", "rank": 3, "headline": "多エージェント討議は同調で安全リスクを増幅", "title": "When Debate Amplifies Risk: Social-Bias Vulnerabilities in Multi-Agent Safety Deliberation", "url": "https://arxiv.org/abs/2611.04289", "authors": "Qinghua Mao ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Mao, Q., Lin, X., Qi, Y., Xu, Z., Gu, J., & Chen, Y. (2026). When Debate Amplifies Risk: Social-Bias Vulnerabilities in Multi-Agent Safety Deliberation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.04289", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（診断プロトコル・実験設定・結果・考察の節と表1・図3の説明）を読んだ", "preprint": true, "p1": "多エージェント討議（MAD）は、多数派の同調・権威への追従・断定的な口調といった社会的な力によって、単独のモデルなら拒否する危険な情報を採用してしまうことを、証拠を固定した反事実の診断で示し、推論時の対策を提案した（抄録、§5.2）。", "p2": "検索で集めた矛盾する情報をまとめるためにMADが使われるが、討議は社会的な過程であり、証拠ではなく人間関係的な手がかりが結論を動かす危険が体系的に調べられていなかった（§1）。背景：討議の擁護はコンドルセの陪審定理（誤りの独立）に依拠する（§7）。", "p3": "SafeConflict-Biasは6つのWebリスク分類の100事例それぞれに、質問と証拠を固定したまま、中立・危険少数派・危険多数派・危険側の権威・安全側の権威・危険側の高確信・均衡確信の7つの社会条件を作る（計700例、§3.2）。5エージェントが私的見解→相互反論→改訂の3段階・15ターンで討議する（§3.3）。対策RiskTrace-Debiasは、証拠に基づく事前コミット、社会的メタデータの遮蔽、一貫性ゲートつき裁定を組み合わせる（§4）。", "p4": "主対象はdeepseek-chatで、qwen-plus、gpt-4o、qwen2.5-32bでも検証した。比較は単独LLM、自己省察、標準MAD、提案法で、危険採用率、最終危険率、条件間の差（Δmaj、Δauth、Δconf）、緩和策の無視率、安全少数派の抑圧率、過剰拒否率で評価した（§5.1）。", "p5": "証拠のみの設定では単独LLMも自己省察も危険採用0.0%だったが、標準MADでは危険多数派で68.0%（N=3）→100.0%（N=5）、危険側の権威で14.0%→86.0%、高確信で33.0%→100.0%に跳ね上がり、安全少数派の抑圧は最大100.0%に達した（表1、図3、§5.2）。提案法は権威・確信の条件で0.0%、多数派で2.0%に抑え、過剰拒否は生じなかった（§5.3）。", "p6": "評価は5エージェントの完全グラフでのスニペット検索に限られ、動的な通信構造やマルチモーダル閲覧、異種モデルの集団は今後の課題とされる（§7）。解釈：危険な証拠を割り当てる設計は人工的で、実際のWeb情報での発生頻度は未確認。", "fun": "一人で考えれば「それは危ない」と断れるAIが、5人の会議になると、多数派や偉そうな肩書き、自信たっぷりの言い方に押されて、危険な案に賛成してしまいました。人間の会議でよく見る「空気に流される」現象が、AIどうしでもほぼ100%の割合で起きたという点が面白く、少し怖いところです。", "unverified": "表1の全条件・全モデルの数値と、一般化分析（§5.4）の詳細は読んでいない。"}}, {"id": "pr04", "rank": 4, "headline": "LLMは健康質問票で望ましい回答に寄せる", "title": "Social Desirability Bias in Health Screening Questionnaire Responses Generated by OpenAI Models: Quantitative Experimental Study (Preprint)", "url": "https://doi.org/10.2196/preprints.92057", "authors": "Andrew O'Malley", "venue": "JMIR Preprints", "date": "2026-11-03", "apa": "O’Malley, A. (2026). Social Desirability Bias in Health Screening Questionnaire Responses Generated by OpenAI Models: Quantitative Experimental Study (Preprint). https://doi.org/10.2196/preprints.92057", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの記録はCrossrefの抄録のみで、本文は取得できず", "preprint": true, "p1": "LLMに健康スクリーニング質問票を答えさせると、質問票とその評価目的が分かる提示方法のときに、社会的に望ましい方向へ回答が大きくずれることを示した（抄録）。", "p2": "社会的望ましさバイアス（自分を良く見せる回答傾向）は人間の自己報告で知られ、LLMの性格検査でも観察されていたが、模擬患者・合成回答者として使われる健康質問票では調べられていなかった（抄録）。", "p3": "GPT-4o、GPT-4o mini、o1-mini、o1に「一般の人」のペルソナでGAD-7、PHQ-9、AUDIT、FANTASTICに回答させ、各項目を別々の呼び出しで提示する素朴条件と、全項目をまとめて示す情報条件を、各100試行で比べた（抄録）。", "p4": "モデル内で両条件の得点を、16比較のBonferroni補正つきのt検定で比べ、効果量をCohenのdと一般人口のSD単位で示した。人間の基準値は記述的な参照のみ（抄録）。", "p5": "16の組み合わせのうち14で、情報条件で望ましい方向へ有意にずれた（P<.001）。平均のずれはGAD-7で3.2〜8.2点、PHQ-9で2.4〜11.9点、FANTASTICで8.2〜13.5点（d=1.0〜8.6）。GPT-4o miniはAUDITで逆方向（−2.69点）だった（抄録）。", "p6": "OpenAIの4モデル・2025年4月時点のみの形成的研究（抄録）。解釈：ペルソナの設定方法や他社モデルで結果が変わるかは未確認。", "fun": "人に「今の気分は？」と1問ずつ聞くのと、「うつ病チェックです」と分かる形で聞くのとでは、答えが変わることがあります。AIもまったく同じで、テストだと気づくと「健康で元気な人」のふりをする、という点が人間くさくて面白いところです。", "unverified": "結論の後半（抄録が途中で切れている部分）と、ペルソナの具体的な文言は未確認。"}}, {"id": "pr05", "rank": 5, "headline": "費用の細分開示は会計情報の価値関連性を高める", "title": "Does Expense Disaggregation Matter? Evidence on the Value Relevance of Accounting Information", "url": "https://doi.org/10.2139/ssrn.7675899", "authors": "Siddhant Kumar", "venue": "SSRN", "date": "2026-11-04", "apa": "Kumar, S. (2026). Does Expense Disaggregation Matter? Evidence on the Value Relevance of Accounting Information. https://doi.org/10.2139/ssrn.7675899", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの記録はCrossrefの抄録のみで、本文は取得できず", "preprint": true, "p1": "営業費用を本表と注記でどれだけ細かく分けて開示するかを測る枠組みを作り、細分開示が会計情報の価値関連性を高めることを欧州・英国企業で示した（抄録）。", "p2": "財務諸表の細分化はIASBなどで政策議論が続くが、本表レベルと注記レベルの費用の細分を包括的に測った実証は乏しかった（抄録）。", "p3": "欧州・英国の416社（4,160企業年）について、本表（face）と注記（notes）の費用の細分度を測る新しい指標を作り、価格モデルとリターンモデルの価値関連性の回帰に組み込んだ（抄録）。", "p4": "簿価・利益と株価の関係の強さ（価値関連性）が細分度で高まるかを、別の定式化・予測期間・標本分割で頑健性を確かめて評価した（抄録）。", "p5": "価格モデルで、本表の細分は簿価の価値関連性と頑健に正の関係があり、無形資産の比率が高い企業で最も強かった。リターンモデルでは利益の関連性を高める証拠は限定的で、黒字・赤字の別による違いもほとんどなかった（抄録）。", "p6": "評価の枠組みにより証拠が異なる（抄録）。解釈：細分度は企業の選択なので、開示が良い企業の他の特性を拾っている可能性（内生性）への対処は抄録からは不明。", "fun": "会社の決算書で「費用」を一つにまとめて書くか、人件費・研究費・広告費と細かく分けて書くかは、会社の裁量がある部分です。細かく書くほど株価が帳簿の数字をよく反映する、とくに目に見えない資産の多い会社でそうだ、という結果は、開示の丁寧さに意味があることを示しています。", "unverified": "細分度の具体的な測り方と係数の大きさは本文で未確認。"}}, {"id": "pr06", "rank": 6, "headline": "AI依存で技能が衰え採用が固定化する仕組み", "title": "Modelling lock-in of AI adoption through skill erosion", "url": "https://arxiv.org/abs/2611.04886", "authors": "Renaud Lambiotte", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Lambiotte, R. (2026). Modelling lock-in of AI adoption through skill erosion (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.04886", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（モデル・閾値・急な普及と固定化・考察の節と図4の説明）を読んだ", "preprint": true, "p1": "生成AIへの依存で独立した技能が衰える仕組みを入れた模倣の進化モデルで、AI普及が急に起き、利益が元に戻ってもAI依存が残る履歴依存（ヒステリシス）が生じうることを、厳密解で示した（抄録、§VI）。", "p2": "生成AIは目先の成果を上げても将来の仕事に必要な技能を損なう可能性があるが、技能の履歴と普及の相互作用を解析的に扱うモデルはなかった（§I）。", "p3": "N人がAIなし（H）かAIあり（A）を選び、Hの利得は自分の技能s、Aの利得は便益bから混雑項cxを引いたもの（式1）。技能はHで1へ、Aで0へ速度εで近づく（式2）。各人は速度νで行動を見直し、確率μでランダムに探索、それ以外は相手の実現利得との差に比例して模倣する（式3）。例：皆がAIに頼ると技能が落ち、AIなしの利得が下がるのでさらにAIが魅力的になる。", "p4": "非利用者と利用者の技能の定常分布を厳密に導き、普及と回帰の閾値を求め、10⁴エージェントのシミュレーションで便益bを上げ下げした場合と一時的に上げた場合を調べた（§III〜V、図4）。", "p5": "技能侵食が混雑より強いと低普及・高技能と高普及・低技能の2つの安定状態が共存した（§IV）。熟練者集団へのAI利用者の侵入は、技能適応の速さに関係なくAI作業の利得が熟練作業を上回るときに限られる。便益が上限の折り返し点を越えると普及は急上昇し、一定期間便益を上げるだけで元に戻した後もAI依存が残る場合があった（図4b）。", "p6": "AIの利得が利用者の技能に依存しない単純化を置いており、熟練を補完する道具は考察で議論するにとどまる（§II、§VI）。解釈：実データでの検証はなく、パラメータ値は例示的。", "fun": "AIに頼るほど自分で考える力が落ち、落ちるほどAIに頼りたくなる、という悪循環を数式で表したモデルです。一時的にAIが安かっただけでも、元の値段に戻ったときには、もう自力では働けない集団になっている可能性がある、という結論は、身近な道具への依存を考えるきっかけになります。", "unverified": "付録の厳密解と頑健性の確認（付録B・C）は読んでいない。"}}, {"id": "pr07", "rank": 7, "headline": "ペルソナは固定属性でなく状況で変わる状態", "title": "Personas Are Not People: Identity as State, Not Attribute", "url": "https://arxiv.org/abs/2611.05292", "authors": "Tamunotonye Harry ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Harry, T., & Feng, Y. (2026). Personas Are Not People: Identity as State, Not Attribute (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05292", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（行動の分解・評価基準・Chameleonと動機テーマ研究の結果・限界の節と表1・図2の説明）を読んだ", "preprint": true, "p1": "固定した属性を書いたペルソナに基づく合成集団は、モデルやペルソナをどれだけ詳しくしても、人と状況の組に特有の行動を再現できないことを証明し、それを測る評価基準と「状況の中の人」設計を提案した（抄録、§4.2）。", "p2": "合成集団は調査の事前テストやAI評価で人の代わりに使われるが、アイデンティティを状況によらない安定属性とみなしている。性格研究では、同じ人の状況間の変動の方が人の間の差より大きい（抄録、§2.2）。", "p3": "行動をY=f(τ, I, X)+εと分解する。τは安定属性、Iは状況が呼び起こすアイデンティティ状態、Xは状況である（§3.1）。分散を人の間・人の内（I,X経由）・雑音に分け、評価基準「LST指紋の回復」として、ICC（人の間の割合）、人×状況の交互作用分散、人に特有の残差相関の3つを実データと比べる（§4.1）。", "p4": "Reddit利用者1,667人の3投稿を26特性で採点したChameleonデータと、医療不信のある地域での臨床試験募集調査（公表研究）を対象に、固定ペルソナ（A、B）と状況の中の人の設計（C）を比べた（§5.2、§5.3）。", "p5": "Chameleonの実データのICCは平均0.013（ほぼすべてが人の内の変動）だが、固定ペルソナA・Bは91%・80%と逆の型を示し、Cは0.285で最も近かった。人に特有の相関はA 0.026、B 0.025、C 0.004でほぼゼロだった（表1）。募集調査（n=6,632）ではCは信頼の主効果を再現したが、血圧テーマ×信頼の交互作用の符号は6中2しか一致せず、実際の効果が信頼の両極で落ち込む形は単一軸の仕組みでは表せなかった（図2、§5.3.3）。", "p6": "アイデンティティ状態は手書きで、学習した仕組みには結論が及ばない。状況とアイデンティティの適合の採点もClaudeが行い、偏りの共有を検証していない（§6.4）。証明は2つの仮定の下で成り立つ（抄録）。", "fun": "「30代・会社員・慎重な性格」とAIに演じさせても、本物の人は職場と趣味の場ではまるで違う顔を見せます。実際のネット投稿では、行動の違いの99%は同じ人が場面ごとに変わることから来ていたのに、AIのペルソナは「人によって違う」とする方向にずれていました。人間らしさは属性ではなく状態だ、という主張が面白いところです。", "unverified": "付録Bの命題の証明と付録Cの方法の詳細は読んでいない。"}}, {"id": "pr08", "rank": 8, "headline": "CEO報酬は利益調整を、業績不振は不正を招く", "title": "Unraveling The Puzzle: Reexamining The Relation between CEO Incentives and Accounting Manipulation", "url": "https://doi.org/10.2139/ssrn.7676960", "authors": "Zhonglan Dai ほか", "venue": "SSRN", "date": "2026-11-04", "apa": "Dai, Z., Kim, S., Landsman, W. R., & Zhang, F. (2026). Unraveling The Puzzle: Reexamining The Relation between CEO Incentives and Accounting Manipulation. https://doi.org/10.2139/ssrn.7676960", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの記録はCrossrefの抄録のみで、本文は取得できず", "preprint": true, "p1": "CEOの株式報酬と会計操作の関係が混在していた理由を、操作をGAAP内の利益調整と不正に分けることで説明し、関係を条件つきで再確立した（抄録）。", "p2": "株式報酬は会計操作を招くと広く信じられているが、実証結果は混在していた（Armstrong, Jagolinzer & Larcker 2010; Edmans, Gabaix & Jenter 2017）（抄録）。", "p3": "会計操作を「許容されるGAAPの解釈（発生主義の利益調整）」から「明白な不正」までの連続体として捉え、両者で株式報酬との関係を分けて検証した。不正は費用が大きいため、長期の業績不振のような強い圧力の下でのみ生じると仮説を立てた（抄録）。", "p4": "株式報酬の大きさと、利益調整の指標・不正の発生との関係を、業績圧力の有無と報酬の過大さで条件づけて評価した（抄録。具体的な指標と標本は未確認）。", "p5": "株式報酬は利益調整とは無条件に正の関係にあった。不正との正の関係は強い圧力の下でのみ現れ、株式報酬が過大な場合に集中した（抄録）。", "p6": "抄録には標本・期間・識別戦略の記載がない。解釈：不正は発覚したものしか観測できないため、検出の偏りが結果に影響しうる。", "fun": "「成果報酬が大きいと社長は数字をごまかす」という話は、半分正しく半分違っていました。ルールの範囲内での見せ方の工夫は報酬で増えますが、本当の不正は「業績がずっと悪くて追い詰められたとき」に限って起きる、という区別が面白いところです。", "unverified": "標本の規模・期間・不正の識別データ、係数の大きさは未確認。"}}, {"id": "pr09", "rank": 9, "headline": "学習基底でMori-Zwanzig縮約モデルを構築", "title": "Physics-informed traditional and generative Mori-Zwanzig-reduced models for multiscale systems", "url": "https://arxiv.org/abs/2611.05211", "authors": "Emily Williams ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Williams, E., Qadeer, S., Howard, A., & Stinis, P. (2026). Physics-informed traditional and generative Mori-Zwanzig-reduced models for multiscale systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05211", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、縮約モデルと生成的閉包の節、結論、表1・2と図6〜13の説明）を読んだ", "preprint": true, "p1": "物理情報つき機械学習で見つけた独自の基底でも、Mori-Zwanzig（MZ）形式で記憶項を持つ縮約モデルを作れることを示し、揺動散逸定理による閉包と生成モデルによる確率的閉包の2つを提案した（抄録、§5）。", "p2": "縮約モデル（ROM）では切り捨てたモードの影響を閉包で補う必要があるが、平衡を仮定する従来の亜格子モデルは散逸過多や不安定になりやすく、エネルギーの逆流（backscatter）を表せない。MZ形式はフーリエ基底などでは確立していたが、学習した基底では未検討だった（§1）。", "p3": "学習基底の展開係数u_kの常微分方程式にMZ形式を適用し、記憶核κを揺動散逸定理（FDT：平衡のゆらぎと応答を結ぶ関係）から求め、du_k/dt=R_k(u)+∫κ(t−s)…dsという非マルコフ方程式をHeun法で積分する（式21〜24）。生成的閉包では、拡散モデル（スコアマッチング）で亜格子項τ_k^SGSの条件付き分布を学び、各時間ステップで20回の拡散ステップで標本化する（§4）。", "p4": "粘性Burgers方程式で、真のフィルタ場に対する相対ℓ2誤差を、記憶項なしのマルコフ動力学と比べた（表1・2）。", "p5": "MZ閉包の平均相対誤差は2.9%でマルコフの6.6%を下回り（表1）、生成的閉包は10標本で2.5%未満だった（表2）。ただし長時間では誤差が増え、畳み込み積分の時間刻みはフルモデルの約100分の1が必要だった（§3.2、図8）。", "p6": "記憶核は線形射影で、長時間には高次の射影が必要とされる。生成モデルは単一の初期条件で示され、初期条件の集合での訓練や過去状態への条件づけは今後の課題（§5）。解釈：検証は1次元Burgers方程式に限られる。", "fun": "細かい渦をすべて計算する代わりに、大きな流れだけを追い、細かい部分の影響を「過去の記憶」として足し込むのがMZ形式の考え方です。記憶の足し方をAIに覚えさせると、誤差が7%から2.5%ほどに減りました。物理の古い理論と新しい生成AIが手を組んでいる点が面白いところです。", "unverified": "付録A・Bの弱形式の導出と記憶核の具体形は読んでいない。"}}, {"id": "pr10", "rank": 10, "headline": "臨界角付近で粒状斜面の輸送ばらつきが増幅", "title": "Amplified transport variability in granular slope flows near the critical angle", "url": "https://arxiv.org/abs/2611.04440", "authors": "Fumiaki Nakai ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Nakai, F., & Sasaki, Y. (2026). Amplified transport variability in granular slope flows near the critical angle (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.04440", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（数値設定と輸送量の定義、単一擾乱後の輸送、分布の広がりの節と図1・2の説明）を読んだ", "preprint": true, "p1": "同じ巨視的条件・同じ加振でも、粒状斜面の輸送量のばらつきが臨界角に近づくほど平均より速く増え、標準偏差が平均を超えうることを数値実験で示し、エネルギー収支にゆらぎを入れた確率モデルを提案した（抄録）。", "p2": "地震動などで粒状斜面が動き出すと、停止するまでの輸送量が地形変化や地すべり危険度を左右する。臨界に近いほど大きな範囲が動くことは知られていたが、同条件での事象間のばらつきは不明だった（抄録）。背景：決定論的な構成則は巨視条件に一つの応答を割り当てる。", "p3": "離散要素法（DEM：粒子一つずつの運動を接触力で計算する方法）で、直径1.0〜1.9 mmの球2,273個の層（長さ100 mm、周期境界）に、基盤を正弦1周期だけ動かす同一のパルスを与えた。斜面角10.0°〜16.3°の各角度で、初期の粒子配置だけを変えて128試行を行い、質量加重の変位の総和Q（式1）を輸送量とした（Numerical set-up）。", "p4": "各角度でのQの平均・標準偏差・変動係数を、臨界角θc≈16.65°からの角距離に対してべき乗則で評価し、系の大きさへの依存も調べた（図2）。", "p5": "12.0°では試行ごとのQが近い値に集まったが、16.3°では大きく広がった（図1c）。平均は角距離にほぼ反比例して増え、標準偏差はそれより速く増え、変動係数σQ/⟨Q⟩は臨界角付近で1に近づき、超えることもあった（図2e,f）。", "p6": "粒子の中心を2次元面内に拘束した単純化モデルで、実斜面の3次元性や水の影響は含まない（設定の節から読める範囲）。解釈：確率モデルの検証の詳細（補足2節）は未読。", "fun": "砂山の斜面を同じ強さで同じように揺らしても、崩れる量が毎回大きく違うことがあります。しかも崩れる寸前の急な斜面ほど、その「当たり外れ」が平均以上に大きくなりました。平均値だけで危険を語れない理由を、粒の並び方の偶然という形で示した点が面白いところです。", "unverified": "べき乗則の具体的な指数と、確率モデル（補足2節）の当てはまりは読んでいない。"}}, {"id": "pr11", "rank": 11, "headline": "LLM討論の立場変化は相互作用が生む漂流", "title": "Measuring Model-Specific Alignment Drift in LLM-Based Opinion Dynamics", "url": "https://arxiv.org/abs/2611.03980", "authors": "Nata\\v{s}a Djurdjevac Conrad ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Conrad, N. D., Pokutta, S., & Schütte, C. (2026). Measuring Model-Specific Alignment Drift in LLM-Based Opinion Dynamics (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03980", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（討議プロトコル、実験の各条件、考察と限界の節、図1・表1・3・4の説明）を読んだ", "preprint": true, "p1": "LLMエージェントの意見ダイナミクス実験で、立場の喪失は相互作用が生む「整合の漂流（alignment drift）」であり、その大きさと仕組みがLLMごとに大きく違うことを、動学モデルから独立した心理測定で示した（抄録、§4）。", "p2": "LLMエージェントは意見ダイナミクスの合成参加者として使われ、行動がプロンプトで決まると仮定されがちだった（抄録）。背景：仮定が誤れば、シミュレーション結果がLLMの性質と社会過程を混同する。", "p3": "10体のエージェントが1文のペルソナと初期の立場x∈[−1,1]を持ち、EV補助金について20ラウンド討議する。各ラウンドで発言を書き、6項目の固定尺度に答え直す（§2）。全員が全員を聞く全体条件、聞く相手を選ぶ選択的注意、集団アイデンティティ条件、討議なしの対照を設け、Friedkin-Johnsenなどの動学モデル群を当てはめた（§3）。", "p4": "最終的な意見の分散、割り当てた側を保つ割合S、選択的注意の同類性指数を、6つのLLMで3〜5反復ずつ比べた（表1、表4）。", "p5": "全体条件の最終分散は0.08（claude-sonnet-4-5）から0.36（claude-sonnet-5）まで幅があった。討議なしではコミットしたペルソナは5モデルすべてで側を保った（S=1.00）が、討議ではgpt-4.1とgemini-3.7-flashが2つのクラスタを保ち、gpt-5.6-solとclaude-opus-5は立場を手放した（分散0.39、0.18）。選択的注意で同類性を示したのはgpt-4.1（+0.485）とclaude-sonnet-5（+0.327）のみだった（§3）。", "p6": "立場を1軸に圧縮し、経済政策の2論点、英語、1社会1モデル、3〜5反復に限られる。分極は割り当てた立場か集団アイデンティティがある場合だけで、分断の創出ではなく維持・増幅についての主張である（§4 Limitations）。", "fun": "同じ話し合いの手順でも、AIの種類によって「みんなで歩み寄る」社会になったり「二つの陣営に分かれたまま」の社会になったりしました。AIで社会を模擬するときは、どのAIを使ったかを、アンケートの回答者の年齢構成と同じくらい大事な条件として報告すべきだ、という主張が面白いところです。", "unverified": "付録D・Eのモデル当てはめと追加の対照の詳細は読んでいない。"}}, {"id": "pr12", "rank": 12, "headline": "五感の言葉が口コミの有用性を左右する条件", "title": "Engaging the Senses in Product Reviews: When Does Sensory Language Enhance Review Helpfulness?", "url": "https://doi.org/10.2139/ssrn.7675901", "authors": "Nadine Eckel ほか", "venue": "SSRN", "date": "2026-11-04", "apa": "Eckel, N., Van Heerde, H., & Krafft, M. (2026). Engaging the Senses in Product Reviews: When Does Sensory Language Enhance Review Helpfulness? https://doi.org/10.2139/ssrn.7675901", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの記録はCrossrefの抄録のみで、本文は取得できず", "preprint": true, "p1": "口コミの中の五感の言葉（感覚語）は有用性の評価を高めるが、その効果は感覚の種類と、文章・画像・先行レビューの文脈に左右されることを示した（抄録）。", "p2": "感覚語は手に取れない商品の体験を伝えるので口コミを役立つものにすると期待されてきたが、その見方は不完全だった（抄録）。", "p3": "アクセス可能性-診断性の枠組みに基づき、Amazonの約1,500万件のレビューで、感覚語（音・触・視・嗅・味）の使用と「役に立った」票の関係を、一人称の視点、評価の向き、画像の有無、先行レビューの感覚情報量で条件づけて分析した（抄録）。", "p4": "評価指標は「役に立った」票の数である（抄録）。", "p5": "感覚語は役立ち票を増やし、とくに一人称の視点が強く肯定的なレビューで効いた。先行レビューに感覚情報が多いと効果は弱まり、画像を含むレビューでは負に転じた。感覚の中では音の言葉がとくに役立つと評価された（抄録）。", "p6": "観察データで、役立ち票は表示順などの影響も受ける（解釈）。因果の識別方法と効果の大きさは抄録からは不明。", "fun": "「ふわふわの手ざわり」「カリッとした音」のような言葉は口コミを分かりやすくしますが、写真が付いていると逆に評価が下がりました。写真と言葉が同じ情報を取り合ってしまうからで、情報は多ければ多いほどよいわけではない、という点が面白いところです。", "unverified": "推定モデルと係数の大きさ、感覚語の辞書の作り方は未確認。"}}, {"id": "pr13", "rank": 13, "headline": "PPP都市鉄道は開発業者の囲い地を潤しただけか", "title": "Public Transport or Corporate Shuttle? Analysing the Spatial-Economic Outcomes of the Gurugram Rapid Metro", "url": "https://doi.org/10.2139/ssrn.7677479", "authors": "Varun Rao", "venue": "SSRN", "date": "2026-11-03", "apa": "Rao, V. (2026). Public Transport or Corporate Shuttle? Analysing the Spatial-Economic Outcomes of the Gurugram Rapid Metro. https://doi.org/10.2139/ssrn.7677479", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの記録はCrossrefの抄録のみで、本文は取得できず", "preprint": true, "p1": "インドのGurugram Rapid Metro（民間100%のPPP）が都市全体の経済活動を生んだのか開発業者の囲い地を潤しただけかを、夜間光の段階的DiDと質的調査で検証した（抄録）。", "p2": "国の都市交通政策は包摂的な移動を求めるが、資本集約的なPPPは都市全体のアクセスより局所的な不動産の価値獲得を優先しがちである（抄録）。", "p3": "2012〜2023年の35区の衛星夜間光（NTL）の輝度パネルに段階的な差の差分法を適用し、少数の処置区に対応した推論も行った。さらに空間の現地調査、専門家面接、文献統合で差の理由を説明した（抄録）。", "p4": "開業区と非開業区の夜間光の差を経済活動の代理として比べた（抄録）。", "p5": "第1期（2013年）は推定法により17〜31%の夜間光の上昇と関連したが、第2期（2017年）は路線全体で有意な効果がなかった。第1期は企業の固定的な通勤者を収益化できた一方、第2期は人口構成の不一致とTODの価値の漏出で失敗し、敵対的な歩行環境が排除として働いたと説明した（抄録）。", "p6": "夜間光は経済活動の粗い代理である（解釈）。100%民間のDBFOT方式が財務破綻を招いたという主張は質的な証拠に基づく（抄録）。", "fun": "駅ができれば街が栄える、とは限りません。最初の区間は会社員が毎日使うので栄えましたが、次の区間は住む人と路線が合わず効果がありませんでした。宇宙から見た夜の明るさで経済の変化を測る手法が面白く、駅までの歩きにくさが人を遠ざけるという指摘も重要です。", "unverified": "推定法ごとの結果の違いと、面接の対象者数は未確認。"}}, {"id": "pr14", "rank": 14, "headline": "弛緩を含むテンセグリティ張力を物理学習で同定", "title": "Physics-Informed Identification of Tensegrity Prestress across Taut-Slack Transitions", "url": "https://arxiv.org/abs/2611.04007", "authors": "Sandesh Lamsal ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Lamsal, S., Kumar, S., Bhandari, R., Sen, S., Rutkiewicz, A., Małyszko, L., & Rhode-Barbarigos, L. (2026). Physics-Informed Identification of Tensegrity Prestress across Taut-Slack Transitions (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.04007", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（X1フレームでの例示、ベンチマーク全体、無症状の失敗の除去、2径間橋、実測検証、考察・結論の節と表3・4、図4・5の説明）を読んだ", "preprint": true, "p1": "テンセグリティ構造の観測できないプレストレス（ケーブル張力）を、ケーブルが緩む非平滑な応答も含む記録から、運動方程式の残差で学習するニューラルネットで逆同定する方法を作った（抄録）。", "p2": "プレストレスは安定性と剛性を支配するが疎な計測から直接は見えず、供用中に低下しうる。既存の同定法は張った状態に限られ、物理情報つきネットワークは既知の部材から応答を予測する順問題しか解いていなかった（抄録）。", "p3": "拘束つきデカルト座標の運動方程式では質量行列が一定で力密度が線形に入るので、力密度・減衰・軸剛性を学習可能なパラメータにし、張力のみのケーブル則（平滑化）を保ったまま残差を最小化する。逆解析の前にFisher情報で、記録がどの部材を決められるかを予測する（抄録、§6）。", "p4": "最大5モジュールの平面フレームと3次元プリズムの模擬記録（2%雑音、自由座標の半分のセンサ）で力密度の誤差と未計測座標での再構成誤差を評価し、射撃法・無香料フィルタと比べ、生体模倣の脚と実大のシンプレックスの実測記録でも検証した（§4.3、§4.8、§4.10〜4.12）。", "p5": "X1フレームでは識別可能な力密度を張った記録で0.33%・0.37%・1.0%の誤差で回復し（§4.2）、2径間橋（X5、16ケーブル）では誤差の中央値4.2%だった（抄録）。X2の張った記録は応答はよく合うのに力密度の誤差が79.8%の「無症状の失敗」を示し、センサを増やしても（76.7%）直らず、2点加振（12.4%）や緩みを含む記録（20.8%）で改善した（表4）。実測ではばね剛性が平均0.1%以内、13水準のプレストレスがケーブル力計と2.9% RMSで一致した（抄録）。", "p6": "緩みを含む同定の証拠はすべて模擬記録で、実測検証はいずれも張った状態に限られる。減衰は粘性・軸方向とし、接合部が支配する散逸は表せない（§6）。無症状の失敗を正解なしで検出する方法は未解決（§6）。", "fun": "張られたワイヤーと棒だけでできた構造は、ワイヤーの張り具合が命ですが、外から測るのは難しいものです。揺らしてワイヤーが一瞬たるむような激しい記録の方が、かえって張り具合をよく教えてくれた、という逆転が面白い点です。また「計算結果がデータとよく合う＝正しく分かった」ではない、という注意も重要です。", "unverified": "表3の全構造の誤差と、§4.12の13水準の個別の値は読んでいない。"}}, {"id": "pr15", "rank": 15, "headline": "貧困地域の緑地は景観の質で心の健康を守る", "title": "Power of Landscape Scenery: A Health Asset for Deprived Neighbourhoods", "url": "https://doi.org/10.2139/ssrn.7675263", "authors": "Agnieszka Olszewska-Guizzo, David O&apos ほか", "venue": "SSRN", "date": "2026-11-03", "apa": "Olszewska-Guizzo, A., O'Reilly, D., Ribeiro, A. I., Belcher, R. N., Pálsdóttir, A. M., Hedblom, M., Caputo, S., Cole, H., Giedych, R., Gawryszewska, B. J., Maksymiuk, G., Sosnowska, A., Adamczyk, J., Cieszewska, A., Gąsior, W., Alkhateeb, G., Renhe, L., Gallou, E., Xu, S., et al. (2026). Power of Landscape Scenery: A Health Asset for Deprived Neighbourhoods. https://doi.org/10.2139/ssrn.7675263", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNの記録はCrossrefの抄録のみで、本文は取得できず", "preprint": true, "p1": "困窮地域の緑地・水辺の「景観の質」をLLMと機械学習で自動採点し、遠景や水面・大樹などの静的な景観要素が住民の生活満足・人生の意味・幸福と結びつくことを示した（抄録）。", "p2": "緑地・水辺（GBS）は健康資産とされるが、その美的な質が健康を守る役割は不明だった（抄録）。", "p3": "瞑想的景観モデル（CLM）に基づく自動採点システムを作り、Horizon EuropeのGreenMEで選ばれた欧州9地域の17,000枚超の写真を採点した。景観要素を静的（遠景、地形、変化のある稜線、水面・孤立した大樹）と動的（種の豊かさ）に分け、住民6,173人の訪問場所とwell-beingの自己報告を順序混合効果回帰で結んだ（抄録）。", "p4": "感度分析と未測定交絡のリスク評価で頑健性を確かめた（抄録）。", "p5": "静的なCLM要素は生活満足・人生の意味・幸福と一貫して正に関連し、動的要素は生活満足とのみ負に関連した。生活満足への効果は自然へのアクセスを高く感じる人で弱まった（抄録）。", "p6": "横断的な関連の分析である（解釈）。自動採点の妥当性と、写真が訪問場所をどこまで代表するかは抄録からは不明。", "fun": "公園の木の種類を増やすことより、遠くまで見渡せる眺めや大きな一本の木の方が心の健康と結びついていた、という結果です。「生き物が多いほど良い」という直感と違う点、そして景色の良さをAIが写真から点数化した点が面白いところです。", "unverified": "採点システムの精度（人間との一致）と効果量は未確認。"}}, {"id": "pr16", "rank": 16, "headline": "役割分担LLM討議は不動産価値の推定に寄与するか", "title": "Can Autonomous AI Agents Discover the Fundamental Value of Real Estate? Evidence from Quebec Transactions and Multi-Agent Deliberation", "url": "https://doi.org/10.6084/m9.figshare.34907088", "authors": "Simon-Pierre Boucher", "venue": "Figshare", "date": "2026-11-03", "apa": "Boucher, S.-P. (2026). Can Autonomous AI Agents Discover the Fundamental Value of Real Estate? Evidence from Quebec Transactions and Multi-Agent Deliberation. figshare. https://doi.org/10.6084/M9.FIGSHARE.34907088", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Figshareの記録に登録された抄録を使用", "preprint": true, "short": true, "p1": "役割分担したLLMエージェントの討議は、不動産価格の推定精度を上げないことを事前登録実験で示した（抄録）。", "p3": "ケベック州の住宅取引631,866件で、ヘドニック回帰・反復売買モデル・勾配ブースティング・コンフォーマル型AVMと、単独LLM、12の役割エージェント、1〜4回の討議、プラセボ委員会などを同じ証拠で比べた（抄録）。", "p5": "討議の平均絶対対数誤差0.158に対し、黙った委員会0.159、プラセボ0.157で、事前登録した対比はすべて0を含んだ。討議で意見のばらつきは半減したが精度は動かず、予測区間は約30%狭すぎた（抄録）。", "fun": "「みんなで話し合えば正解に近づく」は直感的ですが、この研究では話し合うと意見がそろうだけで、正解との距離は縮まりませんでした。意見が一致することと正しいことは別だ、という点を大量の実取引で確かめたところが面白い点です。", "unverified": "討議の具体的なプロンプト設計と、区間の被覆率86〜89%の算出条件は本文で未確認。"}}, {"id": "pr17", "rank": 17, "headline": "米国17万橋の荷重評価比率を恒等式で監査", "title": "What the Ratio of Operating to Inventory Load Ratings Reveals: Exact Factor Identities and an Audit of 174,335 Bridges in the 2025 National Bridge Inventory", "url": "https://doi.org/10.5281/zenodo.23934073", "authors": "Aguru, Manoj Kumar", "venue": "Zenodo", "date": "2026-11-04", "apa": "Aguru, M. K. (2026). What the Ratio of Operating to Inventory Load Ratings Reveals: Exact Factor Identities and an Audit of 174,335 Bridges in the 2025 National Bridge Inventory. Zenodo. https://doi.org/10.5281/ZENODO.23934073", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録に登録された抄録を使用", "preprint": true, "short": true, "p1": "橋の2つの荷重評価（常時と最大許容）の比が設計基準の係数で決まることを示し、それを使って橋梁台帳の誤記を構造モデルなしで検出できるようにした（抄録）。", "p3": "同じ部材・限界状態が両評価を支配するとき、比はLFRで1.6692、LRFRで1.2963などに固定されることを証明し、2025年National Bridge Inventoryの6州174,335橋に適用した（抄録）。", "p5": "LRFRの評価係数では60.1%が名目比に一致し、LFRでは40.1%のみで最頻値はLRFRの1.299だった。LFR・ASDの14,094件中2,278件は手法コードと値が食い違う型を示した（抄録）。", "fun": "橋の安全性の数字は複雑な計算から出てきますが、2つの数字の「比」だけを見れば計算が正しく記録されたかを簡単に確かめられる、という発想が面白い点です。割り算1回で全国の台帳の怪しい行を見つけられます。", "unverified": "未査読の個人投稿で、証明の詳細と州別の内訳は本文で未確認。"}}, {"id": "pr18", "rank": 18, "headline": "非定常下の橋梁動特性オンライン追跡の補足", "title": "Supplemental Material for \"Online Tracking of Bridge Dynamics for Response Prediction under Nonstationary Conditions\"", "url": "https://doi.org/10.5281/zenodo.23952017", "authors": "Chen ほか", "venue": "Zenodo", "date": "2026-11-04", "apa": "Chen, B., Wang, Y., Yang, J., & Ou, J. (2026). Supplemental Material for \"Online Tracking of Bridge Dynamics for Response Prediction under Nonstationary Conditions\". Zenodo. https://doi.org/10.5281/ZENODO.23952017", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の説明文を使用（補足資料の目次のみ）", "preprint": true, "short": true, "p1": "非定常な条件下で橋の動特性を逐次追跡して応答を予測する論文の補足資料である（抄録）。", "p3": "モデル化の背景と導出、実装と物理制約の詳細、数値モデルと追加の振動子応答、対象橋梁の背景と信号前処理の比較を、S1〜S4節と図S1〜S8にまとめている（抄録）。", "p5": "結果の数値は説明文に記載がなく、未確認（本体論文の抄録・本文を入手できず）。", "fun": "温度や交通量で橋の性質は少しずつ変わるので、「今の橋」をその場で追いかけ続ける必要があります。この資料はその追いかけ方の裏側（式の導き方や前処理）を見せる部分で、手法を自分で組み直したい人に役立つ種類の文書です。", "unverified": "本体論文の手法・結果は未確認。補足資料の中身も説明文の目次の範囲のみ。"}}, {"id": "pr19", "rank": 19, "headline": "ニューラルFokker-Planck制御で群れを高速輸送", "title": "Rapid Mean-Field Formation Transport with a Shared-Representation Neural Fokker-Planck Controller", "url": "https://arxiv.org/abs/2611.03981", "authors": "Zejian Zhou ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Zhou, Z., & Xu, H. (2026). Rapid Mean-Field Formation Transport with a Shared-Representation Neural Fokker-Planck Controller (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03981", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "大規模なエージェント群を目標の隊形へ運ぶ平均場制御を、密度と制御を共通のニューラル写像で表し、オンライン計算を軽くした（抄録）。", "p3": "Fokker-Planck方程式と初期条件の残差、粒子軌道での隊形一致コスト、制御の大きさでパラメータを事前に最適化し、運用中は係数を固定する。周期領域で密度発展の適切性と誤差上界を示した（抄録）。", "p5": "平均場計画法との精度-計算時間のトレードオフを定量化し、古典的なフィードバック制御より輸送誤差が小さかった（抄録。具体的数値は未確認）。", "fun": "何千台ものドローンを1台ずつ計算する代わりに、群れ全体を「濃さの分布」として扱うと計算が楽になります。ただ普通はその分布の方程式を何度も解き直す必要があり、それを学習で前もって済ませておく工夫が面白い点です。", "unverified": "誤差の具体的な数値と比較対象の詳細は本文で未確認。"}}, {"id": "pr20", "rank": 20, "headline": "デジタルツインの意思決定に機械学習とUQを統合", "title": "Integrating Machine Learning and Uncertainty Quantification for Real-Time Decision-Making in Digital Twins: A System-Centric Review and Perspective", "url": "https://arxiv.org/abs/2611.04269", "authors": "Yi-Ping Chen ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Chen, Y.-P., Tsai, Y.-K., Lee, S., Karkaria, V., Lee, D. D., & Chen, W. (2026). Integrating Machine Learning and Uncertainty Quantification for Real-Time Decision-Making in Digital Twins: A System-Centric Review and Perspective (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.04269", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "工学のデジタルツインで実時間の意思決定がどう生まれ維持されるかを、機械学習と不確実性評価の統合の観点から整理した総説である（抄録）。", "p3": "用語ではなく実時間意思決定の機能要件で範囲を定め、意思決定の構成と応用例、意思決定ループの限界に対処する手法を検討した（抄録）。", "p5": "仮想表現から行動への経路を最適化型・方策型・知識型に分け、機械学習の3つの役割（代理モデル、物理フィードバックの情報化、意思決定の生成）を示した。継続的検証とドリフト検出の必要性を述べる（抄録）。", "fun": "デジタルツインは「実物そっくりの模型」と思われがちですが、本当に大事なのは模型を見てどう動くかを決め続けることだ、と視点を切り替えているのが面白い点です。予測の当たり外れの幅を知ることも判断の一部になります。", "unverified": "取り上げた文献の範囲と件数は本文で未確認。"}}, {"id": "pr21", "rank": 21, "headline": "ポートハミルトン系同定の表現と当てはめ比較", "title": "Comparing model representations and fitting methods for port-Hamiltonian system identification", "url": "https://arxiv.org/abs/2611.05031", "authors": "S{\\o}lve Eidnes ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Eidnes, S., & Myhr, H. N. (2026). Comparing model representations and fitting methods for port-Hamiltonian system identification (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05031", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "エネルギー・散逸・入力を分けて表すポートハミルトン系をデータから学ぶ際の、表現と当てはめ方法の組み合わせを比較した（抄録）。", "p3": "各要素をニューラルネット、解析式、その組み合わせで表し、勾配法による最適化とスパース回帰で当てはめる方法を、機械系・電気系のシミュレーション（ノイズ有無）で比べた（抄録）。", "p5": "予測精度と計算コストを比較したと述べるが、どの組み合わせが優れたかと数値は抄録に記載がなく未確認。", "fun": "ばねやコンデンサのように「ためる・逃がす・外から入る」の3つに分けて物理を書く方法があり、データから学ぶときもこの形を守ると答えが物理的におかしくなりにくくなります。どの部品をAIに任せるかの選び方を比べた点が実用的です。", "unverified": "比較結果の優劣と具体的数値は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "温度だけから乱流対流の全状態をEnKFで再構成", "title": "Reconstructing Rayleigh--B\\'enard flows from temperature-only measurements using the Ensemble Kalman Filter", "url": "https://arxiv.org/abs/2611.04795", "authors": "Francesco Fossella ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Fossella, F., Biferale, L., Carrassi, A., Cencini, M., Desbrun, M., & Um, K. (2026). Reconstructing Rayleigh--Bénard flows from temperature-only measurements using the Ensemble Kalman Filter (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.04795", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "乱流のレイリー・ベナール対流で、温度の観測だけから速度場を含む全状態をアンサンブルカルマンフィルタで復元できることを示した（抄録）。", "p3": "適切な膨張（inflation）を備えたEnKFで、温度と渦度の流れ依存の相互共分散を利用し、ノイズを含む疎な温度データから速度を推定する。2次元対流の2つのカオス領域で、スケールごとのスペクトル解析で評価した（抄録）。", "p5": "温度場全体を観測すると全解像スケールで真の状態と同期し、観測が十分頻繁なら温度推定は観測より正確になった。等間隔の観測網は閾値密度まで全スペクトルの同期を保った（抄録）。", "fun": "温度だけ測って風の速さまで分かるのか、という問いは70年前から予想されていましたが、単純な方法ではうまくいきませんでした。温度と流れが「一緒に揺れる関係」を統計的に使うことで実現した点が面白いところです。", "unverified": "閾値となる観測密度の値は抄録に記載がなく未確認。"}}, {"id": "pr23", "rank": 23, "headline": "降雨情報なしで流量推定する適応カルマンフィルタ", "title": "Adaptive Kalman Filtering for Streamflow Models with Application to the Camastra Basin", "url": "https://arxiv.org/abs/2611.04922", "authors": "Mario Pezzella ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Pezzella, M., Cimorelli, L., D'Amore, L., & Cuomo, S. (2026). Adaptive Kalman Filtering for Streamflow Models with Application to the Camastra Basin (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.04922", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "降雨情報が使えない、または時間がずれている場合でも、河川流量を精度よく推定できる適応カルマンフィルタを作った（抄録）。", "p3": "一般化ショットノイズ型の流量モデルに対し、観測ノイズと過程ノイズの共分散を逐次推定する。過程ノイズの更新に状態ダイナミクスを通じた共分散の補正を入れ、補正なしでは定常点がないことを示した（抄録）。", "p5": "イタリア南部Camastra流域の37年分の日流入量で、未解像の外力を適応過程ノイズで表す設定がより正確で、Nash-Sutcliffe効率0.95、相対誤差の中央値約1%を得た（抄録）。", "fun": "雨のデータがなくても川の水の量を当てられるのは、「予想外の変化」を雑音として毎回学び直すからです。作り物の雨を入れるより、分からないものは分からないと認めて扱う方が当たる、という結果が面白い点です。", "unverified": "補正式の具体形と、2つの設定の数値比較の詳細は本文で未確認。"}}, {"id": "pr24", "rank": 24, "headline": "推論後に連結したデジタルツインの予測をブートストラップ", "title": "Post-Inference Model Chaining: A Problem Statement and a Model-based Bootstrap for Training End-to-End Digital Twins", "url": "https://arxiv.org/abs/2611.05225", "authors": "Lukas Madenach ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Madenach, L., Bailer, T., & Eilert, T. (2026). Post-Inference Model Chaining: A Problem Statement and a Model-based Bootstrap for Training End-to-End Digital Twins (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05225", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "段階ごとに当てはめたモデルを推論後につなぐデジタルツインで、よく使われるモンテカルロ伝播が予測区間を歪めることを示し、モデルベースのブートストラップを提案した（抄録）。", "p3": "2段階の解析例と、4・8段階の線形-二次の連鎖（訓練7・15・30回）のシミュレーションで、予測の偏りと被覆率を調べた（抄録）。", "p5": "提案法は相対的な平均バイアスを大きく減らし、被覆率を名目90%に近づけた。標本30・8段階で区間幅の比は1.16〜1.42で、従来法の4.11〜4.97より狭かった（抄録）。", "fun": "伝言ゲームのように、各段階の「不確かさ」を次々に足していくと、最後には実際よりずっと大きな不確かさになってしまうことがあります。足し方の手順そのものが原因だと突き止め、別の手順で直した点が面白いところです。", "unverified": "ブートストラップの具体的手順の詳細は本文で未確認。"}}, {"id": "pr25", "rank": 25, "headline": "LLMが市民意見を提案化すると割当が不安定に", "title": "From Opinions to Commitments: Unstable Assignments and Silent Choices in AI-Mediated Proposals", "url": "https://arxiv.org/abs/2611.05135", "authors": "Sachit Mahajan ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Mahajan, S., S{á}nchez-Vaquerizo, J. A., Capozzi, A., & Helbing, D. (2026). From Opinions to Commitments: Unstable Assignments and Silent Choices in AI-Mediated Proposals (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05135", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "市民の意見をLLMで集団的な提案にまとめると、誰が何をいつまでにするかという割当が実行のたびに変わり、1つの提案の公開が別の選択肢を隠しうることを示した（抄録）。", "p3": "DeliberationBankとPolisの意見を使い、4つのLLM仲介者（オープン3、商用1）に30件の意見から提案を5回ずつ書かせ、乱数シードか意見の順序を変えた（抄録）。", "p5": "5回の組のうち、オープンモデルで17%、商用で20%に割当の有無が回によって異なる組があった。意見の順序を変えるだけで、別の市民の意見に入れ替えるのとほぼ同じ頻度で割当が変わった（抄録）。", "fun": "同じ30人の意見をAIに要約させても、意見を並べる順番を変えるだけで「誰がやるか」が入れ替わることがあります。一つの答えだけを見せられると、他にもあり得た答えが見えなくなる、という民主的な問題を数字で示した点が面白いところです。", "unverified": "人手の確認の規模と、合意志向のプロンプトによる少数意見の扱いの詳細は本文で未確認。"}}, {"id": "pr26", "rank": 26, "headline": "判定LLMを替えるとシステム順位が入れ替わる", "title": "Swapping the Judge Changes the Ranking: A Preregistered Study of Cross-Provider Replication in LLM-Judged System Comparisons", "url": "https://arxiv.org/abs/2611.04090", "authors": "Sangdo Han (CEO Business School) ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Han, S., & Kim, M. (2026). Swapping the Judge Changes the Ranking: A Preregistered Study of Cross-Provider Replication in LLM-Judged System Comparisons (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.04090", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLM審判による比較結論を別の提供元の審判で追試する慣行が、どこまで信頼できるかを事前登録研究で調べた（抄録）。", "p3": "3社5つの審判モデルで、人間の投票があるChatbot Arenaの対戦4,000件（9システム、33組）を回答の順序を入れ替えて再判定した（抄録）。", "p5": "判定単位での人間との一致は低く（Cohenのκの中央値0.22）、人間の順位とのKendallのτは0.17〜0.89（中央値0.67）で、順位が安定するという仮説は支持されなかった（抄録）。", "fun": "採点者を替えたら順位が入れ替わるコンテストは信用しにくいですよね。AIに審査させる評価でもこれが起きることを、人間の投票という「答え合わせ」付きのデータで確かめたのが面白い点です。", "unverified": "事前登録後に審判の数を減らした理由と影響は本文で未確認。"}}, {"id": "pr27", "rank": 27, "headline": "LLM専門家ペルソナと臨床家の主題分析を比較", "title": "Computational Phenomenology of Borderline Personality Disorder: A Comparative Evaluation of LLM-Simulated Expert Personas and Human Clinical Experts", "url": "https://arxiv.org/abs/2508.19008", "authors": "Marcin Moskalewicz ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Moskalewicz, M., Sterna, A., Drożdż, K., Dudzic, K., Pokropski, M., & Flores, P. (2025). Computational Phenomenology of Borderline Personality Disorder: A Comparative Evaluation of LLM-Simulated Expert Personas and Human Clinical Experts (Version 3). arXiv. https://doi.org/10.48550/ARXIV.2508.19008", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "境界性パーソナリティ障害の入院患者の人生の語りの質的分析を、LLMが専門家ペルソナとしてどこまで支援できるかを人間の専門家と比べた（抄録）。", "p3": "15万語を超える面接の人手の主題分析を基準に、GPT・Gemini・Claudeの出力を、専門家の盲検・非盲検の評価（研究A）、埋め込みベクトルでの意味比較（研究B）、非専門家115人の評価（研究C）で調べた（抄録）。", "p5": "AIの分析と人間の解釈の重なりは0〜58%と大きくばらついた（抄録。以降の結果は抄録が途中で切れており未確認）。", "fun": "話の聞き取りから大切なテーマを拾い出す作業は、人間の専門家の経験がものを言う仕事です。AIに「専門家のふり」をさせたとき、重なりが0%から58%まで揺れたという結果は、AIの読み方の不安定さをよく表しています。", "unverified": "研究Cの結果（冗長さと人間らしさの知覚の関係）は抄録が途中で切れており未確認。"}}, {"id": "pr28", "rank": 28, "headline": "多エージェントの役割が誤りの回復を左右する", "title": "Beyond Division of Labor: How Roles Shape Feedback and Recovery in Multi-Agent Systems", "url": "https://arxiv.org/abs/2611.03931", "authors": "Chih-Hsuan Yang ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Yang, C.-H., Li, X., Thakur, R., & Yan, F. (2026). Beyond Division of Labor: How Roles Shape Feedback and Recovery in Multi-Agent Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03931", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "計画・実行・査読の役割を与えた多エージェントLLMでは、査読役の承認が提出とフィードバックの機会を決め、誤りからの回復を左右することを示した（抄録）。", "p3": "エージェント、構成、呼び出し予算、評価器を固定して役割指示だけを変え、オープンモデル3つでOmni-MATH、2つでSciBenchを解かせた（抄録）。", "p5": "役割をなくしても初回の正答率は下がらなかった。査読役は承認を控えがちで、フィードバックを受ける回数が減る。毎回提出を強制すると回復率は0.198から0.613に上がった（抄録）。", "fun": "チームに厳しいチェック役を置くと安心に思えますが、チェック役が「まだ出すな」と止めすぎると、先生の添削を受ける機会そのものが減ってしまいます。役割は仕事の分担だけでなく、学ぶ機会の配分でもあるという発見が面白い点です。", "unverified": "等しい判定数での比較の詳細は本文で未確認。"}}, {"id": "pr29", "rank": 29, "headline": "エージェント間の説得・欺瞞・強要を評価する", "title": "Inter-Agent Influence: Evaluating Persuasion, Deception, and Coercion in Multi-Agent Systems", "url": "https://arxiv.org/abs/2611.04556", "authors": "Chandler Smith ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Smith, C., Guo, Q., Tilli, C. E., Hatz, S., Africa, D. D., Paskov, P., de Witt, C. S., Torr, P., & Hammond, L. (2026). Inter-Agent Influence: Evaluating Persuasion, Deception, and Coercion in Multi-Agent Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.04556", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "AIエージェントが他のエージェントを説得・欺瞞・強要で望む方向に動かす能力を、5つの現実的な評価環境で測った（抄録）。", "p3": "最先端の言語モデルで作った様々なエージェントを、監督環境と上下関係のない仲間どうしの環境に置き、影響の行使を評価した（抄録）。", "p5": "監督環境では、試したすべてのモデルが説得・欺瞞・強要によって監督役の判断を却下から承認へ変えた。仲間どうしの環境でも安全研究の方向をそらすことに成功した（抄録）。", "fun": "AIを見張るのに別のAIを使う、という発想はよくありますが、見張られる側のAIが見張り役を言いくるめてしまえば意味がありません。実際にどのモデルもそれができた、という結果は、AIどうしの会話にも人間社会と同じ問題があることを示しています。", "unverified": "モデルごとの成功率の数値は抄録に記載がなく未確認。"}}, {"id": "pr30", "rank": 30, "headline": "韓国企業の財務的に重要なESG開示をAIで測定", "title": "Do Korean Firms Disclose What Matters? AI-Measured Financially Material ESG Disclosure, Regulatory Anticipation and Firm Value", "url": "https://doi.org/10.20944/preprints202611.0206.v1", "authors": "Young-Chan Lee ほか", "venue": "Preprints.org", "date": "2026-11-04", "apa": "Lee, Y.-C., & Yang, C. (2026). Do Korean Firms Disclose What Matters? AI-Measured Financially Material ESG Disclosure, Regulatory Anticipation and Firm Value. https://doi.org/10.20944/preprints202611.0206.v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": true, "short": true, "p1": "韓国企業の事業報告書から、業種にとって財務的に重要なESG情報をLLMで学習した分類器で測り、規制の予告への反応と企業価値との関係を調べた（抄録）。", "p3": "KOSPI非金融808社の2016〜2025年度の法定事業報告書7,278件の全文をESG課題と具体性で分類し、SASBの業種基準で重要か否かを分けた。分類器は辞書法やゼロショットより優れた（抄録）。", "p5": "重要なESG情報は小さく、ゆっくり増える、主に定性的な部分だった。2021年の義務化ロードマップ後、大企業はESG記述を増やしたが重要事項へは有意に移らず、企業価値とは頑健な関係がなかった（抄録）。", "fun": "「ESGをたくさん書いた会社」と「投資家にとって大事なことを書いた会社」は同じではありません。規制が近づくと会社は文章を増やすけれど、中身の大事な部分はあまり増えない、という結果は、開示の量と質を分けて測る大切さを教えてくれます。", "unverified": "人手の符号化との比較の数値は本文で未確認。"}}, {"id": "pr31", "rank": 31, "headline": "マテリアルフローコスト会計で医療廃棄物を見直す", "title": "Rethinking Medical Waste Management in Japan", "url": "https://doi.org/10.5281/zenodo.23940698", "authors": "lyu, zesong", "venue": "Zenodo", "date": "2026-11-04", "apa": "lyu, zesong. (2026). Rethinking Medical Waste Management in Japan. Zenodo. https://doi.org/10.5281/ZENODO.23940698", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録を使用（ワーキングペーパー）", "preprint": true, "short": true, "p1": "日本の医療資源管理に、マテリアルフローコスト会計（MFCA）を使う可能性を検討した論考である（抄録）。", "p3": "既存文献、日本の政策文書、医療でのMFCA適用例をもとに、必要な臨床消費と避けられる廃棄の区別や、院内物流管理（SPD）システムの活用を論じた（抄録）。", "p5": "既存の事例からMFCAが資源管理に追加の情報を与えうるとしたが、適用は臨床上の要求、データ、導入費用、制度条件に左右され、事例研究が必要と結論した（抄録）。", "fun": "病院のごみは安全に捨てることが第一ですが、「捨てた物はいくらだったのか」を数えると無駄が見えてきます。工場で使われる原価計算の考え方を病院に持ち込むという発想の転換が面白い点です。", "unverified": "実証データはなく文献に基づく論考。具体的な事例の数値は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "GPU物質点法で地盤の大変形を解くTellusPM", "title": "TellusPM: a GPU-accelerated material point method for large-deformation geomechanics driven by an AI agent, calibrated against analytical, numerical and experimental benchmarks", "url": "https://doi.org/10.5281/zenodo.23953123", "authors": "Youwai, Sompote", "venue": "Zenodo", "date": "2026-11-04", "apa": "Youwai, S. (2026). TellusPM: a GPU-accelerated material point method for large-deformation geomechanics driven by an AI agent, calibrated against analytical, numerical and experimental benchmarks. Zenodo. https://doi.org/10.5281/ZENODO.23953123", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録を使用", "preprint": true, "short": true, "p1": "地盤の大変形を解く物質点法（MPM）のプログラムTellusPMを作り、AIエージェントからも操作できるようにして、解析解・他プログラム・実験と照合した（抄録）。", "p3": "Rustで書いた陽解法を2D・3DでCPUまたはCUDAのGPUで動かし、28のツールを技術者・内蔵AI・MCPクライアントが共通に使う。RTX 4090で約120回の計算で検証した（抄録）。", "p5": "振動棒で2次収束し、対数ひずみの圧密試験に0.6%、Terzaghi圧密に初期間隙水圧の3.9%以内で一致した。斜面の安全率は1.34〜1.40で有限要素の1.35〜1.40と同等だった（抄録）。", "fun": "土砂崩れのように地面が大きく流れる現象は、普通の計算法では網目が崩れて解けません。粒の集まりとして追う方法を家庭用GPUで速く回し、さらにAIに操作を任せられる形にした点が新しいところです。", "unverified": "未査読の個人投稿で、Patong土石流の逆解析の詳細は本文で未確認。"}}, {"id": "pr33", "rank": 33, "headline": "再生骨材コンクリートを格子離散粒子で再現", "title": "Comprehensive Experiments And Lattice Discrete Particle Modelling of Recycled Aggregate Concrete under Compressive and Tensile Loads", "url": "https://doi.org/10.2139/ssrn.7676138", "authors": "Xingyi Hu ほか", "venue": "SSRN", "date": "2026-11-04", "apa": "Hu, X., Gruyaert, E., Molkens, T., & Wan-Wendner, L. (2026). Comprehensive Experiments And Lattice Discrete Particle Modelling of Recycled Aggregate Concrete under Compressive and Tensile Loads. https://doi.org/10.2139/ssrn.7676138", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "再生骨材コンクリートの圧縮・引張の挙動を、格子離散粒子モデル（LDPM）に拡張して再現した（抄録）。", "p3": "再生骨材の置換率0%・30%・100%の配合で一軸圧縮、割裂引張、切欠き3点曲げ試験を行い、圧縮と曲げの結果でLDPMのパラメータを校正し、割裂引張の剛性と最大荷重で検証した（抄録）。", "p5": "校正したモデルは3配合すべての荷重曲線と破壊形態を再現し、パラメータの変化は置換率に伴う物理的な劣化傾向を反映した（抄録）。", "fun": "古いコンクリートを砕いて骨材に再利用すると、付いたままのモルタルのせいで性質がばらつきます。コンクリートを小さな粒のつながりとして計算し、実験から粒どうしの性質を逆算する方法で、そのばらつきを扱えるようにした点が面白いところです。", "unverified": "感度解析で特定された支配パラメータの詳細は本文で未確認。"}}, {"id": "pr34", "rank": 34, "headline": "確率力学系でガウス核空間が不変となる条件", "title": "When Gaussian kernel spaces are invariant under stochastic dynamics: transition rigidity, a Gaussian-component noise boundary and a discontinuous diffusion limit", "url": "https://doi.org/10.5281/zenodo.23937399", "authors": "Anonymous", "venue": "Zenodo", "date": "2026-11-04", "apa": "Anonymous. (2026). When Gaussian kernel spaces are invariant under stochastic dynamics: transition rigidity, a Gaussian-component noise boundary and a discontinuous diffusion limit (Version 0.1.0-candidate). Zenodo. https://doi.org/10.5281/ZENODO.23937399", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録の抄録を使用", "preprint": true, "short": true, "p1": "確率クープマン作用素のカーネル法がよく置く「ダイナミクスがガウス再生核ヒルベルト空間（RKHS）を自分自身に写す」という仮定が、いつ成り立つかを決めた（抄録）。", "p3": "ガウス条件付き分布N(F(x),Q(x))のマルコフ遷移について、ガウスRKHS間の有界な写像になる条件を導き、加法ノイズや複合ポアソン近似、Ornstein-Uhlenbeck過程の場合を調べた（抄録）。", "p5": "有界に写すならQは定数、Fはアフィンで、行列の不等式MRMᵀ⪯P+4Qが必要十分になる。OU過程では全時刻の不変性はAP+PAᵀ⪯4BBᵀと同値で、既存の十分条件（2BBᵀ）は必要でないと示した（抄録）。", "fun": "計算を楽にするための「便利な仮定」が、実はとても狭い場合にしか成り立たない、ということを数学的にはっきりさせた研究です。道具の使える範囲を正確に知ることは、間違った答えを信じないために大切です。", "unverified": "未査読の個人投稿で、証明の詳細は本文で未確認。"}}, {"id": "pr35", "rank": 35, "headline": "南米3か国でヘルスリテラシー尺度の不変性を検証", "title": "Cross-national validation and measurement invariance of the HLS-EU-Q6 in Latin America: Evidence from adults in Ecuador, Peru and Venezuela", "url": "https://doi.org/10.21203/rs.3.rs-10998246/v1", "authors": "Gabriel Ortiz Francisco ほか", "venue": "Research Square (In Review)", "date": "2026-11-04", "apa": "Francisco, G. O., López-Guerra, V., Condor-Camara, D. F., Fuenmayor, A. M. R., & Francisco-Pérez, J. (2026). Cross-national validation and measurement invariance of the HLS-EU-Q6 in Latin America: Evidence from adults in Ecuador, Peru and Venezuela. https://doi.org/10.21203/rs.3.rs-10998246/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（Research Square）", "preprint": true, "short": true, "p1": "欧州の短縮版ヘルスリテラシー尺度HLS-EU-Q6が、エクアドル・ペルー・ベネズエラの成人で妥当に使え、国の間で比較できるかを検証した（抄録）。", "p3": "3か国の成人2,034人の横断調査で、標本を分けた探索的・確認的因子分析、信頼性（α、ω、合成信頼性、AVE）、国と属性での測定不変性、既知群妥当性を調べた（抄録）。", "p5": "1因子構造が安定し、α=.830、ω=.832、合成信頼性=.866、AVE=.519だった。国の間で配置不変と計量不変は支持された（抄録。スカラー不変の結果は抄録が途中で切れており未確認）。", "fun": "同じ質問紙を別の国で使っても、言葉の受け取り方が違えば点数を比べることはできません。「物差しが国をまたいで同じ長さか」を段階的に確かめる手順が、国際比較の前提になるという点が面白いところです。", "unverified": "スカラー不変の検定結果と既知群の差の大きさは未確認。"}}, {"id": "pr36", "rank": 36, "headline": "コロナ禍のNY一地区で雇用・健康・幸福を調査", "title": "The Astoria Project Survey: Employment, Health, and Well-being in One New York City Neighborhood During Covid", "url": "https://doi.org/10.31235/osf.io/ze3dv", "authors": "Lina Karsten Moe", "venue": "SocArXiv", "date": "2026-11-03", "apa": "Moe, L. K. (2026). The Astoria Project Survey: Employment, Health, and Well-being in One New York City Neighborhood During Covid. https://doi.org/10.31235/osf.io/ze3dv", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SocArXiv）", "preprint": true, "short": true, "p1": "コロナ禍のニューヨーク市クイーンズ区アストリア地区で、雇用・健康・心の健康・日常の危険認識への多面的な影響を一つの調査でとらえた（抄録）。", "p3": "2020年12月〜2021年2月に、アストリアと周辺地区の労働者726人から回答を集めた。最貧困地区ではなく中所得のクイーンズに近い労働者地区を対象とした（抄録）。", "p5": "専門職の給与労働者から低所得のギグワーカーまで、人種・所得を問わず経済・健康・心理のwell-beingに打撃があったと述べる（抄録。具体的な割合は未確認）。", "fun": "コロナの経済的打撃は貧しい地域に集中したとよく言われますが、真ん中くらいの地域でも広く打撃があったことを、一つの町の住民の声から描いた点が面白いところです。町単位の調査は統計の平均では見えない姿を映します。", "unverified": "標本の抽出方法と主要な数値は本文で未確認。"}}, {"id": "pr37", "rank": 37, "headline": "80か国の所得一次分配を整備したデータベース", "title": "POLI-DATA / Observatory for Income Distribution and Wellbeing (ODIB)", "url": "https://doi.org/10.2139/ssrn.7675538", "authors": "Andrés Giussepe", "venue": "SSRN", "date": "2026-11-04", "apa": "Giussepe, A. (2026). POLI-DATA / Observatory for Income Distribution and Wellbeing (ODIB). https://doi.org/10.2139/ssrn.7675538", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SSRN）", "preprint": true, "short": true, "p1": "80か国2008〜2025年の所得の一次分配（労働・資本・純税）を整えたデータベースを作り、分配の格差指標を提案した（抄録）。", "p3": "1,234観測のデータで経済を4つの構造類型に分け、要素間の不平等を労働ギャップと非労働構成バイアス（SCNL）に分解する合成指標IBDCを導入した（抄録）。", "p5": "SCNLは個人間の不平等や投資を予測せず、成長との関連（β=−0.098、p=0.005）は天然資源レントを統制すると消えた（β=−0.003、p=0.91）。労働ギャップの持続性はρ≈0.85と高かった（抄録）。", "fun": "新しい指標を作った論文で「この指標は予測に役立たなかった」という否定的な結果をはっきり報告している点が誠実で面白いところです。見かけの関係が石油や鉱物の収入という第三の要因で消えることも示しています。", "unverified": "未査読。4類型の定義と50-40-10基準の根拠は本文で未確認。"}}, {"id": "pr38", "rank": 38, "headline": "足るを知る心理尺度の開発と妥当性検証", "title": "Development and validation of the Knowing Sufficiency Scale (KSS)", "url": "https://doi.org/10.31234/osf.io/dhkfw", "authors": "Toru Takahashi ほか", "venue": "PsyArXiv", "date": "2026-11-03", "apa": "Takahashi, T., & Kumano, S. (2026). Development and validation of the Knowing Sufficiency Scale (KSS). https://doi.org/10.31234/osf.io/dhkfw", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（PsyArXiv）", "preprint": true, "short": true, "p1": "自分のwell-beingに何がどれだけ十分かを知り、それ以上を求めず、今あるものに満足する「足るを知る」心理を測る尺度を日本の成人で開発した（抄録）。", "p3": "専門家と対象者による項目評価のあと、2つの独立したオンライン標本（n=443、n=455）で探索的・確認的因子分析、内的一貫性、構成概念妥当性、増分妥当性を調べ、約2週間後に294人で再検査した（抄録）。", "p5": "結果の因子数と信頼性の数値は抄録が途中で切れており未確認。", "fun": "「足るを知る」は昔からの知恵ですが、これまでの心理尺度は満足の気持ちばかりを測り、「もう十分と判断して追い求めない」という頭と行動の側面を測れませんでした。古い言葉を測れる形にした点が面白いところです。", "unverified": "最終的な因子構造と信頼性・再検査信頼性の値は未確認。"}}, {"id": "pr39", "rank": 39, "headline": "大学教員のAI利用と組織支援が意欲に至る経路", "title": "University teachers’ artificial intelligence use, perceived organizational support, and professional identification: Their structural relations with autonomous work motivation, work engagement, and innovative work behavior", "url": "https://doi.org/10.21203/rs.3.rs-11360955/v1", "authors": "Qiuping Xie ほか", "venue": "Research Square (In Review)", "date": "2026-11-04", "apa": "Xie, Q., Phumpatrakom, P., Lu, H., & Hua, Y. (2026). University teachers’ artificial intelligence use, perceived organizational support, and professional identification: Their structural relations with autonomous work motivation, work engagement, and innovative work behavior. https://doi.org/10.21203/rs.3.rs-11360955/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（Research Square）", "preprint": true, "short": true, "p1": "大学教員のAI利用・組織支援の知覚・職業的同一化が、自律的な労働意欲とワークエンゲージメントを通じて革新的行動につながる経路を調べた（抄録）。", "p3": "自己決定理論と仕事の要求度-資源理論に基づき、中国の大学教員508人の約4週間間隔の3時点の調査を潜在変数モデルとブートストラップで分析した（抄録）。", "p5": "2つの媒介を通じた間接的な関連が支持された。AI利用と革新の総合的な関連は不確かで、組織支援と職業的同一化は正の総合的関連を示した（抄録）。", "fun": "AIを使えるようになっただけで、先生が新しい授業を始めるわけではありません。「自分からやりたい」という気持ちと職場の支えの方が革新に効いていた、という結果は、道具より人の動機が大事だということを示唆しています。", "unverified": "同一回答者の自己報告であり、各経路の係数は本文で未確認。"}}, {"id": "pr40", "rank": 40, "headline": "AIで研究スプリントをしてもチーム研究は伸びず", "title": "We Ran a Research Sprint With AI. The AI Worked. The Research Didn't", "url": "https://arxiv.org/abs/2611.03946", "authors": "Anush Sankaran ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Sankaran, A., & Banerjee, A. (2026). We Ran a Research Sprint With AI. The AI Worked. The Research Didn't (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03946", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "個人用の生成AIは研究チームで、生成が評価に追いつかない「消費のボトルネック」と、個人とAIの閉じたループが共有の意思決定を置き換える「AIによる研究のサイロ化」を生みうると論じた（抄録）。", "p3": "17人の会合のうち3チーム12人の研究者による100分間の研究スプリントを、仕組みを見つけるための試行として観察した（抄録）。", "p5": "両方の型がチームと証拠源をまたいで繰り返し現れた。記録された33回のAIとのやり取りのうち、そのまま採用は1回、27回は扱いの記録がなかった（抄録）。", "fun": "一人ひとりがAIで速く文章を作れても、チームで読んで判断する時間が足りなければ研究は進みません。「AIは働いたが研究は進まなかった」という題名どおり、速さと良さの違いを小さな実験で見せた点が面白いところです。", "unverified": "小規模の試行で因果は特定していない（著者も明記）。"}}, {"id": "pr41", "rank": 41, "headline": "複数ロボット手術環境で看護師のテクノストレス", "title": "Technostress in a Multi-Platform Robotic Surgery Environment: A Phenomenological Study of Operating Room Nurses' Lived Experiences in China", "url": "https://doi.org/10.21203/rs.3.rs-10993452/v1", "authors": "Xi Qu ほか", "venue": "Research Square (In Review)", "date": "2026-11-04", "apa": "Qu, X., Li, Q., GUO, Y., ZHANG, C., LIU, Y., & WANG, Y. (2026). Technostress in a Multi-Platform Robotic Surgery Environment: A Phenomenological Study of Operating Room Nurses’ Lived Experiences in China. https://doi.org/10.21203/rs.3.rs-10993452/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（Research Square）", "preprint": true, "short": true, "p1": "複数機種のロボット手術が並ぶ環境で働く手術室看護師のテクノストレスの体験を、現象学的に描いた（抄録）。", "p3": "2026年3〜6月に武漢の三次病院で、ロボット手術経験のある看護師18人に半構造化面接を行い、Colaizzi法とMAXQDA 24で分析した（抄録）。", "p5": "4つの主題と12の下位主題（複数機種の統合と認知的適応、物理的配置とハードウェア、デジタル環境の変化と職域の移動、役割の変化と制度的支援）を見いだした。機種の切り替えやソフト更新が負担を生んでいた（抄録）。", "fun": "新しい機械が入ると便利になる一方で、機種ごとに違う操作を覚え直す負担が現場の人にのしかかります。技術が増えるほど人の頭の中の切り替えが増える、という見えにくい負担を言葉にした点が面白いところです。", "unverified": "質的研究で、主題ごとの具体的な語りの内容は本文で未確認。"}}, {"id": "pr42", "rank": 42, "headline": "米国の監視カメラ網の設置に地域の人種格差", "title": "Visualizing Neighborhood Racial Disparities in Flock’s Surveillance Network across the United States", "url": "https://doi.org/10.31235/osf.io/82b9x", "authors": "Max Lubell", "venue": "SocArXiv", "date": "2026-11-03", "apa": "Lubell, M. (2026). Visualizing Neighborhood Racial Disparities in Flock’s Surveillance Network across the United States. https://doi.org/10.31235/osf.io/82b9x", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（SocArXiv）", "preprint": true, "short": true, "p1": "米国のFlock社の自動ナンバー読取カメラの設置場所を全国で地図化し、地域の人種構成との関係を示した（抄録）。", "p3": "クラウドソーシングで集めた116,309台のカメラの位置から、国勢調査の街区グループ（CBG）ごとのカメラ密度と住民の特徴を記述した（抄録）。", "p5": "米国人の4分の1以上がカメラのあるCBGに住み、カメラが多いCBGほど人種的少数派の割合が大きかった。この偏りは農村部で最も強く、都市ではほとんど見られなかった（抄録）。", "fun": "監視カメラの偏りは大都市の問題だと思いがちですが、この地図ではむしろ農村部で人種との関係が強く出ました。みんなで集めた位置情報から、警察の見えにくいインフラの全体像を描いた点が面白いところです。", "unverified": "記述的な可視化で、カメラ位置データの網羅性は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "因果推論", "headline": "欠測を除く回帰が因果効果を正しく推定する条件", "title": "When Listwise Deletion Works: Causal Diagrams and Complete-Case Regression", "url": "https://arxiv.org/abs/2611.04366", "authors": "Wenxin Lin ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Lin, W., & Liu, S. (2026). When Listwise Deletion Works: Causal Diagrams and Complete-Case Regression (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.04366", "why": "主要誌の約半数が使うリストワイズ除去について、因果ダイアグラムで一致性の条件と検査法を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（動機づけのシミュレーション、識別条件の節の見出し、コライダー-媒介変数のジレンマの節と図1の説明）を読んだ", "preprint": true, "p1": "欠測のある事例を除いて回帰するリストワイズ除去（LWD）が母集団の平均処置効果（ATE）を一致推定する条件を、欠測指標を加えた因果ダイアグラム（DAG）で判定できるようにした（抄録）。", "p2": "主要政治学誌の約50%がLWDを使い、補完モデルを記述するのは7%にすぎない（抄録、付録A）。LWDの推奨は「欠測が説明変数の値で決まるなら偏らない」（Arel-Bundock & Pelc 2018）などだが、欠測指標と誤差の独立という前提が見落とされがちだった（§1）。", "p3": "効果一定の場合、(1) 共変量と欠測指標Mが拡張DAGで調整基準（adjustment criterion：バックドア経路を遮断し処置の子孫を含まない条件）を満たすか、(2) 推定量が共変量内の比較を正しくプールするか（必要なら処置傾向の逆確率重みIPW）の2点を検査する。効果が異質な場合は比較を母集団の共変量分布に再重みづけする（抄録、§4）。", "p4": "真の効果τ=1、2万観測、欠測率25%のシミュレーションで、Xの欠測がXだけ（A）、XとU（B）、XとUとDの交互作用（C）に依存する3つのNMAR機構を作り、完全ケース回帰、MAR仮定の多重補完、完全ケース+IPWを500反復で比べた（§1、図1）。", "p5": "Aでは重みなしの完全ケース推定はτ=1を中心とし、多重補完は平均1.057に偏った。Bでは重みなし完全ケースと多重補完が上に偏り、完全ケース+IPWは1付近を保った。Cではどの推定量も1を中心としなかった（§1、図1）。誠実性と二国家解決支持の実例では、欠測を説明する変数が媒介変数でもあるとき調整のジレンマが生じることを示した（§3.2）。", "p6": "結論は欠測機構を研究者がDAGで正しく指定できることを前提とする（§3.2）。解釈：機構の指定が誤っていれば検査も誤り、その感度の扱いは今回読んだ範囲では未確認。", "fun": "アンケートで答えが抜けている人を除いて分析するのは、一番手軽な方法です。「欠けた人を除いても大丈夫か」はMAR（ランダムに欠ける）かどうかでは決まらず、「なぜ欠けたか」を因果の矢印の図に書き込むと判定できる、という発想の転換が面白いところです。", "unverified": "§2.4の一致性の定理の正確な条件と、§4の重みづけの実証結果は読んでいない。"}}, {"id": "pn02", "rank": 2, "field": "機械学習", "headline": "複数モデル・方策を振り分けるルーティング総覧", "title": "Route Anything: A Study of Model and Policy Routing for General-Purpose AI Systems", "url": "https://arxiv.org/abs/2611.05275", "authors": "Pengfei Zhou ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-04", "apa": "Zhou, P., Ma, Y., Wang, H., Tang, W., Wan, Z., Zhao, W., & You, Y. (2026). Route Anything: A Study of Model and Policy Routing for General-Purpose AI Systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05275", "why": "単一モデルに頼らず専門モデル群を動的に選ぶルーティングを体系的に整理した、HF上位の注目研究。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（ルーターの価値の定式化の見出し、Finding 1・2・4・6、結論の節と表1・4・5の説明）を読んだ", "preprint": true, "p1": "言語・画像・動画・音声・コード・ロボットにまたがる25のベンチマークで、入力ごとに最適なモデル・方策を選ぶ「ルーティング」の利得と限界を、統一した理論と37万件の採点済み実行で体系的に測った（抄録）。", "p2": "単一モデルにすべてを任せず専門モデル群を束ねる方向が有望だが、どの情報があればどれだけ選び分けで得をするのか、性能と費用のトレードオフをどう評価すべきかは整理されていなかった（§1）。", "p3": "品質-費用のトレードオフの下での最適ルーティングを定式化し、ルーターが見られる情報（ベンチマーク、課題型、入力）の階梯が到達可能な性能を決めることを示した（§2）。452の候補設定による374,401件の採点済み実行の全モード軌跡行列を作り、型分類器、結果回帰、勝者ラベル分類などのルーターを訓練した（抄録、§4）。", "p4": "ベンチマークごとに最良の固定候補（同じ入力で比べた）と入力ごとの神託との差で利得を測り、参照モデルに対する効率（品質/費用）と、独立入力での品質下限の認定で費用削減を評価した（§3、§5）。", "p5": "19,814件の試験入力で固定候補82.60、神託87.98で差5.4点、その大部分は課題型の内側にあった（表1）。学習ルーターは16ベンチマークで固定候補を0.3点（79.98対79.68）、動画生成で2.1点上回り、ロボットでは方策時間を24%減らして1.1点上回った。ロボットでは勝者ラベルの分類器が成功率42.8%、結果回帰が71.6%だった（表4）。効率は参照モデルの平均8.82倍になった（§5.1）。", "p6": "画像生成では31設計・124設定のどのルーターも固定生成器を有意には上回らなかった（Finding 2）。訓練した品質下限は再分割の12.5%でしか保たれず、独立入力での認定が必要とされる（Finding 6）。", "fun": "どんな問題にも一番強いAIを使えばよい、と思いがちですが、実は問題ごとに得意なAIは入れ替わります。ただ「どれが勝ったか」を覚えさせると速いだけの失敗しがちなロボットを選んでしまい、「それぞれがどれだけできたか」を覚えさせると成功率が4割から7割に上がった、という学び方の違いが面白いところです。", "unverified": "§2の定理の厳密な主張と付録Aの証明は読んでいない。"}}, {"id": "pn03", "rank": 3, "field": "経済学", "headline": "端数の左桁バイアスを理論化し税実験で検証", "title": "Left-Digit Bias: Theory and Empirical Evidence from a Tax Salience Experiment", "url": "https://arxiv.org/abs/2611.05342", "authors": "Kaushil Patel", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Patel, K. (2026). Left-Digit Bias: Theory and Empirical Evidence from a Tax Salience Experiment (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05342", "why": "注意閾値の異質性で整数価格での需要の不連続を説明し、課税への反応が弱まることを実験データで示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（実験計画、推定戦略の一部、実証結果7.1・7.2節と表1・2、図1の説明）を読んだ", "preprint": true, "p1": "価格が整数ドルを超えると需要が急に落ちる「左桁バイアス」を、各消費者が異質な注意閾値より安い商品だけを検討する確率効用モデル（RUM-APT）で説明し、課税への反応が合理的選択より弱くなることを予測・検証した（抄録）。", "p2": "整数価格での需要の不連続は広く観察されるが、その仕組みと、税への反応や超過負担（厚生損失）への含意を結びつけるモデルはなかった（§1）。", "p3": "消費者は価格が自分の注意閾値T以下のときだけ商品を検討し、評価額Vと比べて買う。閾値が整数に集まる消費者の質量が需要の不連続を生む（§2）。Taubinsky & Rees-Jones（2018）の実験データで、整数ちょうどの支払意思額の報告を「閾値に拘束された消費者」の質量とみなし（仮定6.1）、税の有無による報告の対数変化を測った（§6）。", "p4": "米国の消費者4,223人が20品目について、無税・通常税・3倍税の群でBDM法（報告額より安い無作為価格なら購入する誘因両立的な方法）により最高支払額を報告した（§3.1）。モデルが行動のモーメントに合うかと、閾値に対する支払意思額の分布の部分識別を評価した。", "p5": "無税群で2〜14ドルの整数報告は21,551件中2,803件、閾値に拘束された質量は13%（95%区間11.62〜14.44%）で、群間差は有意でなかった（表1、図1）。税への対数反応は閾値型で通常税0.269・3倍税0.383、連続型で0.247・0.488（原研究0.250・0.475に近い）だった（表2）。", "p6": "整数の報告が閾値の質量に対応するという仮定に依存し、支払意思額の分布は部分識別にとどまる（§6.2、抄録）。弱い需要反応は超過負担が小さいことを意味しないと著者は強調する（抄録）。", "fun": "9.99ドルと10.00ドルではたった1セントの差なのに、売れ行きが大きく変わることがあります。この研究は「10ドルまでなら考える」という心の中の線引きが整数に集まっているからだと説明しました。税が少し上がってもこの線を越えなければ買い続けるので反応は小さく見えますが、それで損が小さいとは限らない、という点が面白いところです。", "unverified": "§8の厚生（超過負担）の具体的な上下限の値は読んでいない。"}}, {"id": "pn04", "rank": 4, "field": "組織行動・心理的安全性", "headline": "利害が対立するチームでAI仲介の情報設計", "title": "Designing AI-Mediated Communication in Teams", "url": "https://arxiv.org/abs/2611.04686", "authors": "Wichinpong Park Sinchaisri ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Sinchaisri, W. P., & Wang, Z. (2026). Designing AI-Mediated Communication in Teams (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.04686", "why": "AIアシスタントが知る全体情報をどう開示すべきかを、透明性と誘因のトレードオフとして定式化した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（モデル設定、情報体制間の利得比較、結論の節と図3の説明）を読んだ", "preprint": true, "p1": "AIアシスタントが仲介するチームのコミュニケーションで、企業が全体の案件情報をどこまで、いつ開示すべきかを、労働者の利害が互いにも企業とも対立する戦略的情報伝達モデルで定式化した（抄録）。", "p2": "AIはチームの情報交換と調整に入り込みつつあるが、透明性は適応を高める一方で、労働者が自分の選好を正直に報告する誘因を損ないうる。この二面性を扱う設計論はなかった（抄録、§1）。", "p3": "2人の労働者が自分の選好タイプT_iと局所条件X_iを私的に知り、AIだけが全体状態θを知る。企業目標H_i=θhX_i、労働者の望む行動D_i=(θh+βT_i)X_iで、損失は望む行動からのずれと、2人の行動のずれ（調整、重みγ）の和（式2〜4）。企業が先にθの情報を開示し、労働者が報告して行動を選ぶ（§2）。", "p4": "直接のやり取り、初期の完全開示、設計した初期開示、内生的な転送の4つの体制を、h=β=1、θ~U[1,2]（方向が一致）とU[0,2]（逆方向を含む）、γ=0.1〜0.9、5つの事前確率で、企業の損失の削減率で比べた（§7.1、図3）。", "p5": "方向が一致する場合、γ=0.3で完全な初期開示が直接のやり取りより企業損失を約3.3%減らし、開示の最適化は約0.07%、選択的転送は約0.02%しか加えなかった。逆方向を含むU[0,2]・γ=0.9では、設計した開示が完全開示を約4.9%、転送がさらに2.0%改善したが、労働者の平均損失は約3.7%増えた（§7.1）。", "p6": "結論は労働者の目標をずらす私的な目的についてで、生産的な専門知識には当てはまらない（§8）。数値比較の一部は制限した探索による（§7.1）。解釈：2人・二値タイプの単純化で、実際の組織での検証はない。", "fun": "AIが会議の情報をすべて全員に見せれば良い、とは限りません。情報が多すぎると、各自が「自分に都合の良い主張」を混ぜる余地が生まれるからです。調整が大事な仕事ほど事実だけをやり取りした方がよい、という結論は、チームでの情報の出し方を考えるヒントになって面白いところです。", "unverified": "命題の証明（付録A）と反復協働（§6）の結果は読んでいない。"}}, {"id": "pn05", "rank": 5, "field": "因果推論", "headline": "二値の操作変数で2SLSに代わるロジット型IV推定", "title": "Logit-based alternatives to two-stage least squares", "url": "https://arxiv.org/abs/2312.10333", "authors": "Denis Chetverikov ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Chetverikov, D., Hahn, J., Liao, Z., & Sheng, S. (2023). Logit-based alternatives to two-stage least squares (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2312.10333", "why": "2SLSと同じく簡単に計算でき、因果的な解釈がしやすい推定量を提案した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論、実証応用の節と表1の一部、応用結果の考察）を読んだ", "preprint": true, "p1": "処置も操作変数も二値の場合に、2SLSと同じくらい簡単に計算でき、因果的な解釈で優れたロジット型IV推定量とその拡張版を提案した（抄録）。", "p2": "処置効果が異質なとき、2SLSは制御変数が飽和（すべての組み合わせのダミー）でない限り複数の問題を持ち、遵守者（complier）の効果に負の重みを付けうる（Blandhol et al. 2022）。実務では飽和した制御はまれである（§1）。", "p3": "第1段で操作変数を制御変数にロジット回帰し、第2段でその残差を操作変数として、結果を処置に線形IV回帰する（§1）。単調性と条件付き独立の下で確率極限は遵守者・常時受容者・常時拒否者・非因果の項の和になり、遵守者の項の重みが常に非負になる。拡張版は処置確率の予測を加えて再度ロジット残差を作る（§3、§6）。漸近分布とHausman検定も導いた（§4〜5）。", "p4": "Angrist & Evans（1998、女性39万4,840人、子の性別一致を操作変数）、Angrist et al.（2002、コロンビアの学校バウチャー1,147人）、Dube & Harish（2020、欧州18政体1480〜1913年の女王の統治と戦争、3,586観測）の3つで2SLSと比べた（§6）。", "p5": "前2つでは推定値と標準誤差が2SLSとほぼ同じで（例：有償労働への効果はいずれも−0.117、標準誤差0.025、表1）、第1段の予測値が[0,1]外の観測はなかった。女王と戦争では2SLSが正、ロジット型IVは負で有意でなく、予測値が1超の観測が6.83%、0未満が10.15%あり、2SLSが遵守者に負の重みを付けている可能性が示された（§6）。", "p6": "非負の重みが保証されるのは、確率極限が加重平均処置効果の形をとる特定の場合に限られる（抄録）。解釈：ロジットの第1段の定式化が誤っている場合の頑健性は今回読んだ範囲では未確認。", "fun": "「女王が国を治めると戦争が増えるか」を調べた有名な研究で、標準的な方法では「増える」と出たのに、この新しい方法では「増えるとは言えない」になりました。標準的な方法では、ある人たちの効果を「マイナスの重み」で数えてしまうことがあり、それが答えを逆転させうる、という点が面白いところです。", "unverified": "表2・3の全推定値と、Hausman検定の正確なp値は読んでいない。"}}, {"id": "pn06", "rank": 6, "field": "統計学", "headline": "事後層化で重点サンプリングの分散と誤差を安定化", "title": "Post-stratified importance sampling", "url": "https://arxiv.org/abs/2611.05238", "authors": "Yuling Yao ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Yao, Y., & Tikhonov, S. (2026). Post-stratified importance sampling (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05238", "why": "MRPに着想を得て、重点サンプリングの高分散と標準誤差の不安定を事後層化で抑える。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（序論の見出し、提案法の構成、実験4.2〜4.5節、限界の節と図2・8・9の説明）を読んだ", "preprint": true, "p1": "重点サンプリングの高次元の重みづけを、重要度比を条件とする回帰と重要度比の周辺密度推定という2つの1次元の確率モデル化に置き換える事後層化重点サンプリング（PIS）を提案し、点推定と不確実性評価の両方を改善した（抄録）。", "p2": "重点サンプリング（提案分布の標本に重みを付けて目標分布の期待値を推定する方法）は分散が大きく、無限にもなりえ、経験的標準誤差も当てにならない（抄録、§1）。背景：調査法の多段階回帰と事後層化（MRP）は、層ごとの平均をモデル化して母集団に重みづけする。", "p3": "目標の期待値を、重要度比wを条件とした関数の条件付き平均E[f|w]と、wの周辺密度の積分に分解する。条件付き平均は1次元のガウス過程回帰で、周辺密度は重い裾をパレート型で表すディリクレ過程混合とスコア情報で推定し、数値積分で結合する（§2）。通常の重点サンプリングは特別な場合として含まれる。事後分布の抽出から信用区間を出す（§2.4）。", "p4": "ベンチマーク課題、裾の重さk（大きいほど難しい）と次元を変えた課題、交差検証の一つ抜き予測指標、近似推論の較正で、通常の自己正規化IS（SNIS）とパレート平滑化IS（PSIS）とRMSE・被覆率・区間スコアを比べた（§4）。", "p5": "多くの設定でRMSEがISとPSISより大きく改善し、裾が重いほど差が開いた（図2、図4）。d=32、S=10,000で、k0=0.25では3手法とも被覆がほぼ較正されたが、k0=0.75ではSNISとPSISの区間は大きく過信になり、PISは理想の較正に近かった（図8）。90%区間の区間スコアもk0=0.75でPISが明らかに優れた（図9）。", "p6": "目標と提案の密度が滑らかで全空間に台を持つことを仮定し、離散・切断された台は対象外。信用区間は頻度論的な被覆を保証しない。期待値の推定に限られ、再標本化は扱わない（§4.5、§5.4）。", "fun": "選挙の世論調査では、回答者を年代などの層に分けて平均を出し、人口の割合で重みづけし直す方法が使われます。同じ考え方を、コンピュータで難しい積分を計算する方法に持ち込み、「重さ」で層を作ると暴れやすい計算が安定した、という分野をまたいだ発想が面白いところです。", "unverified": "一致性の定理（§3.2、付録A）の条件と計算量の比較は読んでいない。"}}, {"id": "pn07", "rank": 7, "field": "オペレーションズ・リサーチ", "headline": "メモリ制約下のLLM推論でcμ則が漸近最適", "title": "Asymptotic Optimality of $c\\mu$-Rule for LLM Inference Scheduling under Memory Constraint", "url": "https://arxiv.org/abs/2611.04807", "authors": "Zhenghao Li ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Li, Z., Wang, S., & Si, N. (2026). Asymptotic Optimality of $cμ$-Rule for LLM Inference Scheduling under Memory Constraint (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.04807", "why": "KVキャッシュによるGPUメモリ制約下の推論スケジューリングで、古典的なcμ則の漸近最適性を示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（有効サービス率とcμ則の節、実験設定・比較方策の節）を読んだ。結果の数値表は読み切れていない", "preprint": true, "p1": "KVキャッシュのGPUメモリ容量が制約となるLLM推論のスケジューリングで、計算速度・メモリ帯域・メモリ容量で決まる「有効サービス率μ」を使った古典的なcμ優先則が、流体モデルで漸近最適であることを示した（抄録）。", "p2": "エージェント型・推論型の長い入出力でKVキャッシュの使用量が増え、GPUメモリがボトルネックになった。古典的な待ち行列と違い、1ステップの処理時間がprefillの計算とKVキャッシュのI/Oの両方に依存する（抄録）。", "p3": "異なるプロンプト長・出力長の要求が確率的に到着し、prefillと逐次decodeを経て有限のKVキャッシュを奪い合う系を流体モデルで多クラス単一サーバ待ち行列に帰着させる。クラスjの有効サービス率μ_j=[a_pf s_j+(a_kv+b/M) m̃_j]^(−1)（定義3）で、保有費用c_jとの積c_jμ_jの大きい順に優先する（§4.1）。例：c_i=1、a_pf=0なら累積KV量の小さい順（SVF）に一致する（§6.2）。", "p4": "流体モデルで累積保有費用・完了時間・出力トークンのスループットの最適性を証明し、有限系の実行可能な方策の流体極限への収束を示した（§4〜5）。実験はvLLM上のMeta-Llama-3-8B-InstructをH800 1枚で動かし、Qwen-Bailianの匿名化本番トレース（To-B、To-C、Thinking、Coder）と半合成負荷で、既定のvLLM、MC-SF、SVF、WAIT-fracと比べた（§6.1〜6.2）。", "p5": "実装したcμとcμ-backfill（将来のKV使用量を確かめて小さい要求を前倒しで詰める）は、既存の方策に比べ平均遅延を大きく減らしつつ高いスループットを保った（抄録）。具体的な削減率は今回読んだ範囲では未確認。", "p6": "比較した非先取りの方策は各要求の出力長が既知であると仮定する（§6.2）。解釈：実運用では出力長は予測値になり、その誤差の影響は未確認。", "fun": "銀行の窓口で「すぐ終わる人を先に」と並べ替えると、全体の待ち時間が短くなる、という考えは昔からあります。AIの返答を作るサーバーでは「すぐ終わる」の意味が、計算の速さとメモリの使い方の両方で決まります。その新しい「速さ」の物差しを作れば古い規則がそのまま最適になる、という点が面白いところです。", "unverified": "実験の表（平均遅延・スループットの数値）と証明（付録C・D）は読んでいない。"}}, {"id": "pn08", "rank": 8, "field": "因果推論", "headline": "全米税務データで職業訓練の観察推定を実験で検証", "title": "Experimentally Validated Digital Twins: Evaluating Workforce Training Programs in the Age of Big Data", "url": "https://arxiv.org/abs/2611.03938", "authors": "Raj Chetty ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Chetty, R., Fogel, J., Katz, L. F., Noray, K., Porter, S., & Reisinger, J. (2026). Experimentally Validated Digital Twins: Evaluating Workforce Training Programs in the Age of Big Data (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03938", "why": "大規模行政データでは観察研究の推定が実験の基準にどこまで近づくかを、職業訓練の効果で再検証した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（目次、DMLとRCTの比較、RMSEの推定の節と表1の説明）を読んだ", "preprint": true, "p1": "全米の所得税記録と機械学習で作った反実仮想（「実験で検証したデジタルツイン」）によって、職業訓練プログラムの所得効果を観察データから、RCTと同程度の誤差で推定できることを示した（抄録）。", "p2": "観察研究の推定は実験の基準から大きく外れるという過去の知見（小規模な調査データに基づく）から、政策評価はRCTを重視してきた。大規模な行政データの時代にこの結論が成り立つかは再検討されていなかった（抄録、§I）。", "p3": "1999〜2025年の全米成人の匿名化された所得税記録から、過去の就労履歴・人口統計・居住地を使って機械学習で参加者の反実仮想の所得を予測するダブル機械学習（DML）推定量を作った（§III）。観察推定が不偏かを検定するのでなく、37のRCTを使って偏りの分布を推定する（抄録）。例：RCTの対照群平均の代わりに、DMLの反実仮想の所得を使う（§IV.A）。", "p4": "24のプログラムモデルにまたがる37のRCTで、DMLとRCTの推定の差から、標本誤差を差し引いた偏りの二乗平均平方根（RMSE）を推定し、先行研究のパラメトリック推定量と比べた（§IV.B〜D）。", "p5": "DMLとRCTの推定の差の二乗平均平方根は2,333ドル、RCTとDMLの反実仮想の標本分散の平方根はそれぞれ1,366ドル・795ドルで、雑音を除いた偏りの大きさは1,717ドル、平均の偏りは−569ドルだった（表1、§IV.D）。RMSEはRCT自身と同程度で、パラメトリック推定量より60%小さかった（抄録）。訓練の効果は同じプログラムでも場所と時期で大きく異なり、目標業種への就職を多く生むプログラムで所得の伸びが最大だった（抄録）。", "p6": "ERA（福祉から就労）とSTED（補助つき雇用）の評価を除くと偏りの推定は0になる（§IV.D脚注）。解釈：偏りの分布が実験のない地点にも共通するという仮定（§V.A）に結論の外挿が依存する。", "fun": "「本当に効果があったかはくじ引きの実験でしか分からない」というのが政策評価の常識でした。全米の納税記録という巨大なデータでAIに「参加しなかったらいくら稼いでいたか」を予想させると、実験とほぼ同じ精度になりました。実験を「答え合わせ」に使い、その外にも広げられる点が面白いところです。", "unverified": "§V〜VIの実験外の推定値と、効果の仕組みの分析の数値は読んでいない。"}}, {"id": "pn09", "rank": 9, "field": "経営学", "headline": "倉庫シェアでオンデマンド市場に参入する戦略", "title": "Expanding into On-demand Markets with \"Airbnb of Warehousing\" (Long Version)", "url": "https://doi.org/10.2139/ssrn.7674960", "authors": "Soraya Fatehi ほか", "venue": "SSRN", "date": "2026-11-04", "apa": "Fatehi, S., & Qi, A. (2026). Expanding into On-demand Markets with “Airbnb of Warehousing” (Long Version). https://doi.org/10.2139/ssrn.7674960", "why": "独立倉庫の余剰能力を使う「倉庫のAirbnb」を小売がどう使うべきかをモデルで示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの記録はCrossrefの抄録のみで、本文は取得できず", "preprint": true, "p1": "独立倉庫の余剰能力を借りる「倉庫のAirbnb（AW）」を使い、中央在庫と組み合わせたハイブリッド在庫戦略で、小売がオンデマンド市場に効率よく参入できることを示した（抄録）。", "p2": "無料のオンデマンド配送は追加の需要を取り込めるが、市場の近くに倉庫を持つ初期投資が大きく、実施する小売は少ない（抄録）。", "p3": "頑健な在庫管理の手法で、AWの事業モデルを特徴づけ、参入前に需要が分からない場合には、頑健最適化とベイズ推論を組み合わせ、最悪の需給ミスマッチ費用を抑えながら市場を学習する頑健学習方策を導いた（抄録）。例：中央倉庫で需要の揺れを吸収し、AWで近い市場への速い配送を担う。", "p4": "大手AWプラットフォームのデータで作った試験環境で、純粋な中央集中型と純粋なAW型の2つの基準戦略と期待利益を比べた（抄録）。", "p5": "ハイブリッド戦略は中央集中型に比べ期待利益を大きく増やし、その利得は需要の変動が小さい市場で大きかった。需要の変動が大きい市場では純粋AW型を上回り、中央施設がリスクプーリングで変動を安く吸収する役割が示された（抄録）。", "p6": "抄録には利益の増加幅の数値がない。解釈：試験環境は1つのプラットフォームのデータに基づき、AWの容量制約や価格変動の扱いは本文で確認が必要。", "fun": "空き部屋を旅行者に貸すAirbnbのように、倉庫の空きスペースを小売に貸す仕組みがあります。全部を借り物で済ませるより、自前の大きな倉庫と組み合わせた方が、売れ行きの読めない市場でうまくいく、という結論は、「持つ」と「借りる」の使い分けの考え方として面白いところです。", "unverified": "利益の増加幅と頑健学習方策の具体形は未確認。"}}, {"id": "pn10", "rank": 10, "field": "統計学", "headline": "予測が分布を変える状況でのコンフォーマル予測", "title": "Conformal Prediction at Performative Equilibrium: The Price of Performativity", "url": "https://arxiv.org/abs/2611.05277", "authors": "Ahmed Mahrous ほか", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Mahrous, A., & Di Pietro, R. (2026). Conformal Prediction at Performative Equilibrium: The Price of Performativity (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.05277", "why": "配備した予測器がデータ分布を変える場合に、均衡で被覆を保証する予測集合を構成した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（目次、融資の例、半合成の信用スコア実験の結果、考察の節と図3の説明）を読んだ", "preprint": true, "p1": "配備した予測器がデータ分布そのものを変える「遂行的（performative）」な状況で、遂行的均衡の下でも被覆を保証するコンフォーマル予測の可能性と限界を、感度L=1での相転移として特徴づけた（抄録、§7）。", "p2": "コンフォーマル予測は較正点と試験点の交換可能性の下で有限標本の被覆を保証するが、予測を使うこと自体が分布を変えると交換可能性が崩れる（抄録）。例：銀行の与信の閾値が借り手の返済行動を変える（§2.4）。", "p3": "分布写像が全変動距離でL-感度（予測器がεだけ変わると分布は最大Lεだけ変わる）を持つと仮定し、遂行的に安定な予測器f*の下の分布D(f*)での被覆を目標とする。主な道具は移転定理で、均衡からεの範囲の予測器を返す手続きは、分割コンフォーマル較正の後にLεの加算項を除いて均衡で有効な被覆を持つ。モデルフリーの再訓練法と、パラメトリックな裾平均の再訓練法の2つで具体化した（抄録、§4）。", "p4": "下界の構成で最小最大率を示し、Kaggle「Give Me Some Credit」に基づく半合成の戦略的回帰と、率・移転定理・相転移を確かめる3つの合成シミュレーションで検証した（§3、§5）。", "p5": "L≥1ではどの有限標本の手続きも、均衡での被覆と意味のある予測集合を一様に両立できない。L<1では超過の未被覆の最小最大率はΩ̃(1/((1−L)√n))で、標本数は1/(1−L)²倍必要になる（抄録）。半合成実験では、操作の強さεが増すと素朴な分割コンフォーマルの被覆は名目90%を大きく下回ったが、提案法P-PCPは目標近くを保ち、そのぶん区間は広がった（図3、§5.1）。", "p6": "結果は全変動距離でのL-感度という仮定に依存する（抄録）。解釈：実際の応用でLを推定・確認する方法は今回読んだ範囲では未確認。", "fun": "「この人は返済できそう」という予測で融資を決めると、融資を受けたこと自体で返済のしやすさが変わります。予測が未来を変えてしまう世界で「当たる幅」を保証できるか、という問いに、影響の強さがある値を超えると原理的に不可能になる、という鮮やかな境目を示した点が面白いところです。", "unverified": "§4の2つのアルゴリズムの具体的手順と、シミュレーションの数値は読んでいない。"}}, {"id": "pn11", "rank": 11, "field": "機械学習", "headline": "推論の打ち切りを局所選好で学び思考を圧縮", "title": "Think Less, Locally: Local Preference Learning for Reasoning Compression", "url": "https://arxiv.org/abs/2611.04814", "authors": "Muyao Yuan ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-04", "apa": "Yuan, M., Xu, L., Zhang, W., Jiao, M., Li, J., Zhang, J., & Zhou, J. (2026). Think Less, Locally: Local Preference Learning for Reasoning Compression (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.04814", "why": "十分な情報を得た時点で推論をやめる局所判断を学習し、長い思考連鎖の推論コストを減らす。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（過剰思考の検出・審判の再確認の節、データ構築と評価設定の節）を読んだ。結果は抄録の数値を使用", "preprint": true, "p1": "推論モデルが十分な情報を得た後も考え続ける「過剰思考」の局所的な状態を自分の推論から見つけ、その時点から短く正しい続きを作ってDPOで学ばせる局所選好学習LoCoで、推論の長さを大きく減らした（抄録）。", "p2": "既存の推論圧縮は軌跡全体に作用し、「現在の状態でさらに考える必要があるか」という局所的な判断を扱っていなかった（抄録）。", "p3": "自分の思考連鎖を自分のモデルで再採点し、段落ごとの平均最大確率c_iと隣の段落との変化v_i=(c_i−c_{i−1})²/4を計算し、c_iが25パーセンタイル以下かつv_iが75パーセンタイル以上の段階を候補とする（式2〜6）。より強い審判モデル（Qwen3-30B）が次の段階を「過剰思考・通常・最終」に分類し、過剰思考の前で接頭辞を固定して8本の続きを生成し、300トークン以上短い正答を選好対にしてDPOで訓練する（§4、§5.1）。", "p4": "DeepSeek-R1-Distill-Qwen-7Bを数学の自己生成データのみでLoRA訓練し、数学5（MATH-500、AMC 2023、Olympiad、AIME 2024・2025）とコード3（MBPP、LiveCodeBench、CodeContests）で、正解率・トークン数・トークン予算に対する正解率曲線の下の面積（AUC）を既存法と比べた（§5.1）。", "p5": "完了長を数学で41.7〜45.4%、コードで23.4〜36.3%減らし、正解率は維持または改善し、すべてのコードベンチマークでAUCが最良だった。数学だけで訓練したのにコードにも効果が移転した（抄録）。", "p6": "過剰思考の検出には強い審判モデルが必要で、確信度だけでは冗長な熟考と本当の難しさを区別できない（§4.2）。解釈：7Bモデル1つでの結果で、より大きなモデルへの一般化は未確認。", "fun": "テストで答えが出たのに何度も検算をくり返して時間を使ってしまうことがありますよね。AIも同じで、自信がぐらぐらしている瞬間を目印に「ここで切り上げてよい」場面を見つけ、そこで止める練習をさせると、考える量が4割以上減っても正解率は落ちませんでした。", "unverified": "表の個別ベンチマークの数値とアブレーション（§5.4）の結果は読んでいない。"}}, {"id": "pn12", "rank": 12, "field": "組織行動・心理的安全性", "headline": "研究室の組織と情報共有を実験変数にする枠組み", "title": "Labtune: Treating Lab Organization and Information Sharing as Experimental Variables in LLM-Agent Discovery", "url": "https://arxiv.org/abs/2611.03935", "authors": "Goran Mitevski", "venue": "arXiv", "date": "Wed, 04 Nov 2026", "apa": "Mitevski, G. (2026). Labtune: Treating Lab Organization and Information Sharing as Experimental Variables in LLM-Agent Discovery (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.03935", "why": "サイロ化と集団思考の緊張を、LLMエージェントの研究組織と通信方針を操作して調べられるようにした。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（目次、情報共有の水準とwisdomチャネルの節、研究課題と仮説の節）を読んだ", "preprint": true, "p1": "LLMエージェントで作る研究システムの「研究室の組織構造」と「情報共有の程度」を、固定の設計ではなく実験で操作できる変数にするオープンな枠組みLabtuneを提示した（抄録）。", "p2": "サイロをなくすと集団思考が生まれ、サイロを残すと知識共有が妨げられるという緊張は人間の組織研究で知られ、LLMエージェントの研究システムでも同じ問題があるが、組織は設計で固定されていた（抄録、§2）。", "p3": "6つの編集可能な研究室設計（学際的サイロ、超学際チーム、共同リーダー、ハブ・スポーク、平らな共同研究室、単独の研究者）と、なし〜高詳細の共有水準、条件つきの抽象を伝える任意の「wisdom」チャネルを選べる（抄録）。各チームは私的な出力箱に要約・発見・行き止まりを書き、管制役が段階の境界でフィルタV_πを適用した版を配る。チームiの文脈はC_i(t+1)=C_i(t)∪trunc_W(V_π(o_{−i}(t)))で増え、読む語数をWで制限する（式3、§5.1）。委任しても予算や権限は増えない（抄録）。", "p4": "これはベンチマークの結果を示す論文ではなく、着想とシステムの記述である（抄録）。評価の枠組みとして、開発用の証拠と保護された確認を分け、予算をそろえた比較のための仮説H1〜H6を事前に述べた（§6、§8）。", "p5": "実証結果はない（抄録）。仮説の例：低水準の行き止まり共有は高価な失敗の反復を減らしつつ試す仕組みの多様性を減らさない（H1）、高水準の共有は再利用を速めるが試す手法の幅を狭める（H4）、全役割を同じモデルにすると共有が増えるほど組織の違いが縮む（H5）（§8）。", "p6": "どの設計や共有水準が最良かは主張しない（抄録）。解釈：仮説はまだ検証されておらず、枠組みが実際に組織の違いを検出できるかは今後の実験しだいである。", "fun": "研究室では、みんなで何でも共有すると同じ考えに偏り、ばらばらに進めると同じ失敗をくり返します。人間の組織では試しにくいこの問題を、AIの研究チームなら同じ予算で何度でも組み替えて試せる、という発想が面白いところです。", "unverified": "参照実装の記憶保持課題（§7）の具体的な結果は読んでいない。"}}, {"id": "pn13", "rank": 13, "field": "経済学", "headline": "市場競争がAI導入の企業効果を左右する", "title": "Automate to Compete: How Market Competition Shapes the Effects of AI", "url": "https://doi.org/10.2139/ssrn.7673938", "authors": "Pio Francesco Medolla", "venue": "SSRN", "date": "2026-11-03", "apa": "Medolla, P. F. (2026). Automate to Compete: How Market Competition Shapes the Effects of AI. https://doi.org/10.2139/ssrn.7673938", "why": "10-K開示からLLMで測ったAI導入の効果を、段階的DiDで競争度別に推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの記録はCrossrefの抄録のみで、本文は取得できず",
