<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

d": "pr17", "rank": 17, "headline": "PE傘下の会計事務所でスタッフ監査人の士気低下", "title": "(Pay)check Please. Staff Auditor Apathy in PE-Backed Accounting Firms", "url": "https://doi.org/10.2139/ssrn.7635558", "authors": "Joshua Khavis ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Khavis, J., Landy, C., Li, M., & Tighe, A. (2026). (Pay)check Please. Staff Auditor Apathy in PE-Backed Accounting Firms. https://doi.org/10.2139/ssrn.7635558", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "プライベート・エクイティ（PE）が出資した会計事務所で、若手のスタッフ監査人の職場経験がどう変わったかを示した（抄録）。", "p3": "アーカイバルデータの比較と、PE傘下の事務所のスタッフ監査人17人への面接を組み合わせた混合研究法（抄録）。", "p5": "PE傘下ではPE出資後に労働時間が減ったが、報酬と全体の職務満足は変わらず、キャリア機会・組織文化・上級経営陣への評価が下がった。面接ではAI依存、オフショア化、コスト削減、パートナー制度の変化が将来性を損なうと受け止められていた（抄録）。", "fun": "投資ファンドが会計事務所を買うと、働く時間は減ったのに若手の気持ちは冷めていった、という一見逆向きの結果です。給料や満足度の数字だけでは見えない「この職業に将来はあるのか」という不安を、面接で掘り起こしたところが面白い点です。", "unverified": "労働時間の減少幅などの具体的な数値は抄録になく未確認。"}}, {"id": "pr18", "rank": 18, "headline": "インドのESG開示と実績の乖離を検証", "title": "The Gap between ESG Disclosure and Actual Performance: Evidence from India’s BRSR Core Reporting", "url": "https://doi.org/10.21203/rs.3.rs-11408132/v1", "authors": "Kanika Jindal", "venue": "Research Square (In Review)", "date": "2026-10-20", "apa": "Jindal, K. (2026). The Gap between ESG Disclosure and Actual Performance: Evidence from India’s BRSR Core Reporting. https://doi.org/10.21203/rs.3.rs-11408132/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "インドの保証付き必須ESG開示（BRSR Core）で、開示の質が実際のESG成果を反映していないことを示した（抄録）。", "p3": "NIFTY 50企業の2期分（99企業年）のXBRL開示について、55項目で開示の質を、23指標で業種調整した成果を測り、相関と合成指標の構造モデル、ブートストラップと並べ替え検定で乖離を評価した（抄録）。", "p5": "開示の質は高く収束していた（0〜1で平均0.92）が成果とは無関係で、9属性中8属性で乖離は無作為な組合せと同程度、全体では開示の質と成果が逆相関（β = −0.38、並べ替えp = 0.002）だった（抄録）。", "fun": "報告書がきちんと書けている会社ほど、実際の環境・社会の成績は良くない、という逆の関係が出ました。「書類が完璧」と「中身が良い」は別物だということを、数字で確かめた点が面白いところです。", "unverified": "対象は2年・50社で因果関係は主張していない（抄録）。各属性の個別の数値は未確認。"}}, {"id": "pr19", "rank": 19, "headline": "アルバニア企業の倒産パターンの傾向", "title": "Insolvency Pattern Trends in Albanian Enterprises: An in-depth Investigation", "url": "https://doi.org/10.2139/ssrn.7626499", "authors": "Erjole Barbullushi ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Barbullushi, E., Kastrati, A., & Kinka, A. (2026). Insolvency Pattern Trends in Albanian Enterprises: An in-depth Investigation. https://doi.org/10.2139/ssrn.7626499", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "アルバニア企業向けの倒産予測モデル（段階的Zスコア）を作った（抄録）。", "p3": "70社の財務データから25の財務比率を計算し、多変量判別分析で段階的にZスコアモデルを構築した（抄録）。", "p5": "流動性・回転率・財務構造・収益性の比率が有意な予測因子で、全体の分類精度は84.3%、倒産企業の予測精度は91.4%だった（抄録）。", "fun": "会社がつぶれる前には、お金の回り方や借金の割合に兆しが出ます。それをいくつかの比率の重み付き合計（Zスコア）にまとめ、国ごとの事情に合わせて作り直すと、どこまで当たるかを試した研究です。", "unverified": "70社という小標本で検証用標本の扱いは抄録から未確認。"}}, {"id": "pr20", "rank": 20, "headline": "IFRS強制・任意適用企業の利益水準の違い", "title": "Switching Standards or Changing Standards? Reported Profitability of Mandatory and Voluntary IFRS Adopters in Europe", "url": "https://doi.org/10.2139/ssrn.7630519", "authors": "Sidhartha Sharma", "venue": "SSRN", "date": "2026-10-20", "apa": "Sharma, S. (2026). Switching Standards or Changing Standards? Reported Profitability of Mandatory and Voluntary IFRS Adopters in Europe. https://doi.org/10.2139/ssrn.7630519", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "2005年の欧州のIFRS強制適用で報告利益が上がった理由が、基準の切替えだけでなく基準自体の改訂にもあることを示した（抄録）。", "p3": "欧州17か国1,399社の適用企業と、IFRSが強制されない8か国6,335社の対照企業を比べ、ROAの変化と、その内訳（発生高、減価償却、営業キャッシュフロー）を分解した（抄録）。", "p5": "適用企業のROAは2006〜07年に対照より2.5%上昇（0.19標準偏差）し、増加の約75%は新たな発生高に関係し、減価償却の減少は総資産比1.1ポイント、営業キャッシュフローの変化はゼロと区別できなかった（抄録）。", "fun": "会計のルールを変えると、会社の中身は同じでも利益の数字が変わります。その変化が「ルールを乗り換えたから」なのか「ルール自体が書き換わったから」なのかを、乗り換えなかった会社と比べて切り分けたところが面白い点です。", "unverified": "抄録の「2.5 percent」と「0.19標準偏差」の対応関係の詳細は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "LLMは内部監査人試験に通るか", "title": "Evaluating LLMs on the Certified Internal Auditor Exam", "url": "https://doi.org/10.32545/ev202610001907.v1", "authors": "Malgorzata Pankowska ほか", "venue": "MDPI AG", "date": "2026-10-20", "apa": "Pankowska, M., & Żytniewski, M. (2026). Evaluating LLMs on the Certified Internal Auditor Exam. https://doi.org/10.32545/ev202610001907.v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": true, "short": true, "p1": "題名から、大規模言語モデルを公認内部監査人（CIA）試験で評価した研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「AIは監査の専門資格試験に受かるほど監査を理解しているか」です。試験の点数が実務の力をどこまで表すのか、という問いそのものも面白いところです。", "unverified": "対象モデル・評価方法・結果はすべて未確認。"}}, {"id": "pr22", "rank": 22, "headline": "LLMはエージェントベースモデルの各段階で使える", "title": "Large Language Models for Agent-Based Modelling: Current and possible uses across the modelling cycle", "url": "https://arxiv.org/abs/2507.05723", "authors": "Lo\\\"is Vanh\\'ee ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Vanhée, L., Borit, M., Siebers, P.-O., Cremades, R., Frantz, C., Gürcan, Ö., Kalvas, F., Kera, D. R., Nallur, V., Narasimhan, K., & Neumann, M. (2025). Large Language Models for Agent-Based Modelling: Current and possible uses across the modelling cycle (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2507.05723", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "エージェントベースモデル（ABM）の作成サイクルの各段階で、LLMがどう使えるかを批判的に整理した（抄録）。", "p3": "ABMでのLLMの現在の利用をレビューし、問題設定から結果の文書化・伝達までのモデリングサイクルに沿って機会と課題を検討した（抄録）。", "p5": "抄録は整理の枠組みを述べるにとどまり、具体的な結論の内容は書かれていない（未確認）。", "fun": "たくさんの「小さな人」をコンピュータの中で動かして社会を再現するのがABMです。LLMはその「人」役にも、モデルを作る助手役にもなれますが、どの段階で使うと得で、どこが危ないのかを順を追って考えた点が役に立ちます。", "unverified": "各段階についての具体的な提言の内容は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "財務文書レビューで単一LLMと複数エージェントを比較", "title": "The More the Better? A Comparison of Single- and Multi-Agent LLM Setups on a Financial Review Task", "url": "https://arxiv.org/abs/2610.27488", "authors": "Pei Liu", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Liu, P. (2026). The More the Better? A Comparison of Single- and Multi-Agent LLM Setups on a Financial Review Task (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27488", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "文書レビューを複数エージェントに分担させると欠陥は少し多く見つかるが、誤警報が増え、総合精度はほぼ変わらないことを示した（抄録）。", "p3": "与信審査メモ300件（合成）を6要件で点検する課題で、1エージェントが6要件を見る場合と3エージェントが2要件ずつ見る場合を4モデルで比較し、見逃しと誤警報を別々に測った（抄録）。", "p5": "チームは説明付きの欠陥を0.08〜0.10多く検出したが誤警報は4モデルすべてで増え、バランス精度の変化は0.02以下、トークンは2.2〜2.4倍だった。単一エージェントを3回試行していずれかで指摘する方式の方が高いバランス精度だった（抄録）。", "fun": "「みんなで分担すれば見落としが減る」という常識を厳密に試すと、確かに見つける数は増えるけれど、空振りの警報も増えて差し引きほぼ同じでした。同じ人に3回見直させる方が良い、という結果は人間の仕事の分け方にも通じる面白さがあります。", "unverified": "モデル別の詳細な数値は抄録の範囲でのみ確認。"}}, {"id": "pr24", "rank": 24, "headline": "利用者と対話する場面で多エージェント協調は得か", "title": "Does Multi-Agent Collaboration Pay When Agents Serve Users? Testing Agent Scaling in Dual-Control Settings", "url": "https://arxiv.org/abs/2610.27655", "authors": "Ethan Yang ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Yang, E., & Shi, X. (2026). Does Multi-Agent Collaboration Pay When Agents Serve Users? Testing Agent Scaling in Dual-Control Settings (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27655", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "利用者と対話しながら働く場面では、多エージェント構成が単一エージェントに勝たないことを事前登録の実験で示した（抄録）。", "p3": "τ2-benchの航空・小売・通信の3領域で、標準の単一エージェントと同じモデルの集中型多エージェントを、3系統6モデル・約7,950の模擬会話で、エピソードごとのトークン台帳をそろえて比較した（抄録）。", "p5": "有効な13セル中12で多エージェントが劣り、1つは同等で、能力の範囲全体で利得は負（加重平均 −28ポイント、95%CI [−44, −12]）。先行研究の規則が利得を予測する2セルでも13・22ポイント負けた（抄録）。", "fun": "AIをチームにすれば強くなると思われがちですが、人と会話しながら規則を守って動く仕事では、かえって成績が下がりました。相談役が増えるほど話がこじれる、という人間の会議でもよくある現象と重なって見える点が面白いところです。", "unverified": "多エージェントの計画役が道具の仕様を見ていなかったという妥当性の限界がある（抄録）。"}}, {"id": "pr25", "rank": 25, "headline": "LLMによる議論グラフ生成の検証方法", "title": "On the LLM Verification for Argument Graph Generation", "url": "https://arxiv.org/abs/2610.27361", "authors": "Jakub B\\k{a}ba ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Bąba, J., & Chudziak, J. A. (2026). On the LLM Verification for Argument Graph Generation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27361", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "LLMが作る議論グラフの検証は、決定的な検査を先に置き、LLMの審査は不確実な部分に限るべきだと示した（抄録）。", "p3": "決定的検査→ソルバーとLLMの審査→不確実なときだけ討論→最後に人間、という層状の検証を提案し、構造的な欠陥を注入した人手注釈グラフで検証した（抄録）。", "p5": "LLMの審査役は欠陥をほぼ上限の再現率で見つけたが、正しいグラフの約10件に1件に異議を唱え、同じ入力で判定が揺れ、同等の厳密検査より大幅に遅かった（抄録）。", "fun": "AIの答えをAIにチェックさせるのが流行していますが、「矛盾した循環があるか」のように機械的に確かめられることは、普通のプログラムで確かめた方が確実で速い、という指摘です。道具ごとに保証できることが違う、という当たり前を思い出させてくれます。", "unverified": "欠陥の種類別の検出率などの数値は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "LLMエージェントの意思決定ルールを推定する", "title": "Estimating Decision Rules from Large Language Model Agents: An Application to Bank Balance-Sheet Management", "url": "https://doi.org/10.21203/rs.3.rs-11429290/v1", "authors": "Zlatin Sarastov", "venue": "Research Square (In Review)", "date": "2026-10-20", "apa": "Sarastov, Z. (2026). Estimating Decision Rules from Large Language Model Agents: An Application to Bank Balance-Sheet Management. https://doi.org/10.21203/rs.3.rs-11429290/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "LLMエージェントが生成した銀行の資産負債管理の判断を、簡単な方程式で近似できることを示した（抄録）。", "p3": "ユーロ圏の預金中心の銀行が預金金利・貸出利ざや・債券再投資を決める月次のリーダー・フォロワー型ABMで、LLMの判断を方程式で近似し、推定に使わないシミュレーションで評価した（抄録）。", "p5": "10の検証シミュレーションでROEを0.31ポイント以内で再現し、7つですべての適合基準を満たしたが、預金流出シナリオでは満たさなかった。別系統のLLMではROE差0.71ポイント以内、全基準を満たしたのは18中6だった（抄録）。", "fun": "AIの判断はブラックボックスですが、それを「金利がこう動けばこう決める」という簡単な式に置き換えられれば、中身を説明できるようになります。経済学者が人間の行動を式で表してきたやり方を、AIの行動に当てはめた点が面白いところです。", "unverified": "方程式の具体的な形は抄録になく未確認。"}}, {"id": "pr27", "rank": 27, "headline": "FBG受信器でガイド波SHMの感度と環境ドリフトを補償", "title": "FBG acoustic receivers for Guided Waves Structural Health Monitoring: sensitivity optimization and environmental drift compensation", "url": "https://cea.hal.science/cea-05820852v1", "authors": "Arnaud Recoquillay ほか", "venue": "HAL", "date": "2026-10-20", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "HALの抄録（3文のみ）を使用", "preprint": true, "short": true, "p1": "ファイバブラッググレーティング（FBG）で、環境条件が変わる中で構造のガイド波（超音波）を測る仕組みを作った（抄録）。", "p3": "FBGで超音波を測る装置を設計し、曲げ試験中に試験した。FBGの長さも最適化した（抄録）。", "p5": "抄録には結果の記載がない（未確認）。", "fun": "光ファイバの中に刻んだ細かい縞（FBG）は、伸び縮みすると反射する光の色が変わります。この仕組みで構造物を伝わる超音波を聞き取り、温度などの変化による「ずれ」を補正しようという発想です。", "unverified": "感度や補償の効果の数値は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "振動診断はランダム分割で性能を過大評価する", "title": "Beyond Random Splits: Domain-Shift Evaluation of Fiber BraggGrating Accelerometer-Based Electric Motor Fault Diagnosis AcrossUnseen Operating Conditions", "url": "https://doi.org/10.2139/ssrn.7643321", "authors": "Douglas Soprani ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Soprani, D., Santos, K. F. d. O., Macedo, L., Villani, L. G., Leal-Junior, A., & Frizera-Neto, A. (2026). Beyond Random Splits: Domain-Shift Evaluation of Fiber BraggGrating Accelerometer-Based Electric Motor Fault Diagnosis AcrossUnseen Operating Conditions. https://doi.org/10.2139/ssrn.7643321", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "同じ計測から切り出した窓を学習と評価に混ぜると、振動による故障診断の性能が過大に見積もられることを示した（抄録）。", "p3": "FBG加速度計2台による電動機の5クラス故障診断を、計測ごとに学習・評価を分けるグループ分割と、回転速度条件をまたぐ転移で再評価し、手作り特徴量と1次元CNN、MMDによる教師なし領域適応、少数ショット適応を比べた（抄録）。", "p5": "同じ実験の先行研究の混合条件評価では平均精度が約99%だったのに対し、グループを考慮した評価では約79%で、CNN–Spectrumが最良だった（抄録）。", "fun": "テストの問題が練習問題とほとんど同じなら満点が取れて当然です。振動データでも同じ測定から切り出した断片を学習とテストに混ぜると「カンニング」に近くなり、本当の実力は約99%ではなく約79%だった、という指摘が面白いところです。", "unverified": "CNN–SpectrumのマクロF1の値は抄録が途中で切れており未確認。"}}, {"id": "pr29", "rank": 29, "headline": "CLT床の衝撃加振源ごとの振動音響特性", "title": "Vibroacoustic Characterisation of Cross-Laminated Timber Floor Assemblies under Different Impact Excitation Sources", "url": "https://doi.org/10.2139/ssrn.7641837", "authors": "Mohammad Hossein Asadi Jafari ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Asadi Jafari, M. H., Zhou, J., Lee, J., & Schoenwald, S. (2026). Vibroacoustic Characterisation of Cross-Laminated Timber Floor Assemblies under Different Impact Excitation Sources. https://doi.org/10.2139/ssrn.7641837", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "CLT（直交集成板）床の低周波の衝撃音を、加振源・モード・放射音響パワーを結び付けて評価した（抄録）。", "p3": "4種類の床構成を20〜315 Hzで歩行・ゴムボール・ISOタッピングマシンで加振し、運用モード解析（OMA）で固有振動数・減衰・モード形を、波数領域の積分変換法で放射音響パワーを求めた（抄録）。", "p5": "タッピングマシンは70 Hz以下で減衰比を歩行・ゴムボールより5〜29倍低く与え、16.8 Hzの基本モードを励起できず、低周波の応答を過小評価した（抄録）。", "fun": "木造の床の「ドスン」という響きを評価するとき、規格の打撃装置ではいちばん低い揺れ（16.8 Hz）がそもそも起きない、という結果です。測る道具によって見える現象が変わることを、振動の測り方から示した点が面白いところです。", "unverified": "波数領域解析の結論部分は抄録が途中で切れており未確認。"}}, {"id": "pr30", "rank": 30, "headline": "フラクタル次元をもつ自己相似梁の減衰自由振動", "title": "Fractal-dimensional structural dynamics of self-similar beams: A matrix-based formulation", "url": "https://doi.org/10.2139/ssrn.7643647", "authors": "Gelasio Velázquez ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Velázquez, G., Jacobo Armendáriz, V. H., Ortiz Prado, A., Damián Adame, L., & Gutiérrez-Torres, C. d. C. (2026). Fractal-dimensional structural dynamics of self-similar beams: A matrix-based formulation. https://doi.org/10.2139/ssrn.7643647", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "フラクタル次元をもつ自己相似梁の減衰自由振動を、行列形式で解析する定式化を示した（抄録）。", "p3": "フラクタル効果を質量・剛性行列に組み込み、それから減衰行列と多自由度の運動方程式を作り、フラクタル座標からデカルト座標に書き直した。空間と時間のフラクタル性を表す2つのパラメータが加わる（抄録）。", "p5": "フラクタル次元の異なる2種類の梁で数値解を求め、フラクタルパラメータが減衰振動に与える影響を図で示した（抄録）。具体的な数値は抄録にない。", "fun": "雪の結晶のように、拡大しても同じ形が現れる図形をフラクタルといいます。そんな複雑な形の梁の揺れを、普通の構造力学と同じ行列の形で扱えるように書き直した点が面白いところです。", "unverified": "応答の具体的な数値や検証の有無は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "GNSS観測点速度場の不確実性の記述を改善", "title": "Improved description of GNSS station velocity field uncertainty for high-precision applications", "url": "https://doi.org/10.22541/essoar.15010725/v1", "authors": "K. Gobron ほか", "venue": "ESS Open Archive", "date": "2026-10-20", "apa": "Gobron, K., Rebischung, P., Chanard, K., & Altamimi, Z. (2026). Improved description of GNSS station velocity field uncertainty for high-precision applications. https://doi.org/10.22541/essoar.15010725/v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossref登録の抄録を使用", "preprint": true, "short": true, "p1": "GNSS観測点の位置時系列の雑音の空間相関を考慮して、全球の観測点速度場の誤差共分散を導いた（抄録）。", "p3": "GNSS位置時系列の雑音の時空間相関の最近の特徴付けをもとに、多尺度の時空間雑音相関モデルを作り、速度場の誤差の完全な共分散行列を導いた（抄録）。", "p5": "抄録の結果の部分が途中で切れており、具体的な結論は未確認。", "fun": "GNSSの観測点は地面の動きを年に数ミリの精度で追いますが、遠く離れた観測点の誤差が似た動きをすると、速度の不確かさを小さく見積もりすぎます。誤差同士のつながりまで数えて「本当の不確かさ」を出し直す試みです。", "unverified": "不確実性がどれだけ変わるかの数値は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "高層コンクリート煙突のGNSS構造モニタリング", "title": "GNSS BASED STRUCTURAL HEALTH MONITORING SYSTEM FOR HIGH-RISE CONCRETE CHIMNEYS", "url": "https://doi.org/10.5593/sgem2014/b22/s9.037", "authors": "Maciej Wrona", "venue": "HAL", "date": "2026-10-20", "apa": "Wrona, M. (2014). GNSS BASED STRUCTURAL HEALTH MONITORING SYSTEM FOR HIGH-RISE CONCRETE CHIMNEYS. 14th SGEM GeoConference on INFORMATICS, GEOINFORMATICS AND REMOTE SENSING, 2. https://doi.org/10.5593/sgem2014/b22/s9.037", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": true, "short": true, "p1": "題名から、高層コンクリート煙突の構造ヘルスモニタリングをGNSSで行うシステムの研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "題名から読み取れる問いは「衛星測位で背の高い煙突の揺れや傾きを見張れるか」です。カーナビと同じ仕組みを、構造物の健康診断に使うという発想が面白いところです。", "unverified": "システム構成・精度・結果はすべて未確認。"}}, {"id": "pr33", "rank": 33, "headline": "再生核ヒルベルト空間でのノルム最適な縮約", "title": "Norm-optimal model order reduction in reproducing kernel Hilbert spaces", "url": "https://arxiv.org/abs/2610.28224", "authors": "Tam\\'as D\\'ozsa ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Dózsa, T., Angino, A., Krause, R., & Voigt, M. (2026). Norm-optimal model order reduction in reproducing kernel Hilbert spaces (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28224", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "再生核ヒルベルト空間（RKHS）でのモデル次数縮約（MOR）について、ノルム最適な縮約モデルの条件とアルゴリズムを与えた（抄録）。", "p3": "H2空間の有理関数で知られる補間型の必要条件をRKHSに一般化し、微分可能な核向けにIRKAの代替を作った。さらに一般化マルムクィスト・タケナカ関数で正規直交基底を作り、微分不可能な核にも拡張した（抄録）。", "p5": "サポートベクターマシンや深いReLUネットワークなど機械学習モデルのノルム最適な縮約を数値実験で示した（抄録）。", "fun": "複雑なモデルを、性能をなるべく落とさずに小さなモデルで置き換えるのが縮約です。制御工学で使われてきた「最適な縮め方」の理論を、機械学習のモデルにまで広げた点が面白いところです。", "unverified": "数値実験での誤差の大きさは未確認。"}}, {"id": "pr34", "rank": 34, "headline": "周波数依存境界をもつ振動音響系のモデル縮約", "title": "Model Order Reduction of Broadband Vibroacoustic Systems with Frequency-dependent Boundary Conditions", "url": "https://doi.org/10.2139/ssrn.7642155", "authors": "Laurits Bachmann Theil ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Theil, L. B., Andersen, P. R., Engsig-Karup, A. P., & Aage, N. (2026). Model Order Reduction of Broadband Vibroacoustic Systems with Frequency-dependent Boundary Conditions. https://doi.org/10.2139/ssrn.7642155", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "周波数に依存する境界条件（完全整合層など）をもつ振動音響系でも、射影型のモデル縮約ができる定式化を示した（抄録）。", "p3": "微分が容易に得られる関数のクラスを使って安定なテイラー級数近似を作り、完全整合層などの有限要素行列への寄与を導いた（抄録）。", "p5": "抄録の後半が途中で切れており、計算時間の削減などの結果は未確認。", "fun": "音や振動が遠くへ逃げていく様子を計算するには、計算領域の端で波を吸い込む特殊な境界が必要です。その境界が周波数ごとに性質を変えるため、従来の縮約が使えなかったところを工夫で解決した研究です。", "unverified": "縮約による高速化の程度は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "年次衛星データの事後情報が地すべり感受性を水増し", "title": "Post-event information in calendar-year satellite products inflates landslide susceptibility assessments", "url": "https://doi.org/10.31223/x5rb93", "authors": "Yifan Du ほか", "venue": "EarthArXiv", "date": "2026-10-20", "apa": "Du, Y., Zheng, T., Yang, P., Li, Y., Zhou, J., & Yang, K. (2026). Post-event information in calendar-year satellite products inflates landslide susceptibility assessments. https://doi.org/10.31223/x5rb93", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossref登録の抄録を使用", "preprint": true, "short": true, "p1": "年単位の衛星データ製品を使うと、発生後の情報が混入して地すべり感受性の評価が水増しされることを示した（抄録）。", "p3": "地震7件・豪雨11件の計18事象（61,402か所の地すべり）で、点・空間分割・モデル・ブートストラップを固定したまま入力の年だけを変えて比較した（抄録）。", "p5": "発生前年のAlphaEarth製品を発生年のものに替えると、点モデルの交差検証AUCが0.087（95%CI 0.065–0.110、18事象すべて）上がり、パッチCNNでは0.071上がった。水増しは地すべり跡など事象の地表変化を学習することによる（抄録）。", "fun": "「ここは崩れやすい」と予測するつもりが、実は崩れた跡を見て当てていた、という落とし穴です。答えを見てから解いたテストの点数が上がるのと同じで、データの時間の順序を守ることの大切さを示した点が面白いところです。", "unverified": "予測時だけ発生年を使う場合の詳細は抄録の範囲でのみ確認。"}}, {"id": "pr36", "rank": 36, "headline": "等価剛性を辺属性にしたGAT-LSTMで地すべり変位予測", "title": "Topographic and Equivalent-Stiffness Edge-Attribute-Enhanced GAT-LSTM for Multi-Point Displacement Prediction of Rainfall-Induced Soil Landslides: A Case Study", "url": "https://doi.org/10.2139/ssrn.7642449", "authors": "Faquan Wu ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Wu, F., Wang, S., Zhang, F., Zhou, Y., Jin, L., Wen, S., Wu, J., Hu, Y., & Saroglou, C. (2026). Topographic and Equivalent-Stiffness Edge-Attribute-Enhanced GAT-LSTM for Multi-Point Displacement Prediction of Rainfall-Induced Soil Landslides: A Case Study. https://doi.org/10.2139/ssrn.7642449", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "地形と等価剛性を辺の属性にしたグラフ注意ネットワークとLSTMで、降雨による地すべりの多点変位を予測した（抄録）。", "p3": "地表の監視点6か所をグラフの節点とし、過去変位・気象・地形・地盤定数を節点入力、斜面頂部からの距離差・方位・傾斜・等価剛性の差を辺属性にした。過去24時間から72時間先の鉛直変位増分を予測する（抄録）。", "p5": "中国浙江省新昌県の並進型地すべりで、時間分割の評価でRMSEは1.9409 mmだった（抄録）。", "fun": "斜面の何か所かの動きは、互いの位置関係や地盤の硬さでつながっています。その「つながり」をネットワークとして機械学習に教え込むと、崩れる前の動きをより正確に予測できるかを試した研究です。", "unverified": "比較手法との差は抄録が途中で切れており未確認。"}}, {"id": "pr37", "rank": 37, "headline": "設計向けの無次元地盤-構造物相互作用モデル", "title": "A Simplified Dimensionless Analytical Model For Design-Oriented Soil-Structure Interaction Analysis", "url": "https://doi.org/10.2139/ssrn.7633939", "authors": "Javier Sánchez-Haro ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Sánchez-Haro, J., Costa, A. d., & Gil, A. (2026). A Simplified Dimensionless Analytical Model For Design-Oriented Soil-Structure Interaction Analysis. https://doi.org/10.2139/ssrn.7633939", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "地盤-構造物相互作用（SSI）を、3つの無次元パラメータだけで表す設計向けの閉じた解析解で評価できるようにした（抄録）。", "p3": "地盤と構造の連成挙動を等価な2自由度系で表し、地盤の有効慣性を明示的に入れた無次元の閉形式解から、地盤と構造の変位と連成系の固有振動数を直接求める（抄録）。", "p5": "SSIが応答を大きく変える領域や共振条件を示す無次元の設計図表を作れるとしている。具体的な数値は抄録にない。", "fun": "建物は地面の上に立っているので、地震のときは地面と建物が一緒に揺れ合います。その複雑な関係を、たった3つの比率で読み取れる地図にまとめた点が、設計で使いやすく面白いところです。", "unverified": "有限要素解析との比較結果などは未確認。"}}, {"id": "pr38", "rank": 38, "headline": "長さゲージ時間依存リウヴィル方程式の一般化", "title": "Generalized length-gauge time-dependent Liouville equation", "url": "https://doi.org/10.48550/arxiv.2610.22799", "authors": "G. P. Zhang ほか", "venue": "arXiv (Cornell University)", "date": "2026-10-16", "apa": "Zhang, G. P., & Si, M. S. (2026). Generalized length-gauge time-dependent Liouville equation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.22799", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "arXiv版の抄録（OpenAlex登録）を使用", "preprint": true, "short": true, "p1": "超高速の電子ダイナミクスに使う長さゲージの時間依存リウヴィル方程式で、長年食い違っていた交換子の2つの形の正しい一般形を示した（抄録）。", "p3": "密度演算子と位置演算子の交換子について、Kohn–Luttingerの形（k微分2つ）とAversa–Sipeの形（微分1つとデルタ関数）を比較し、一般化した方程式を導いた（抄録）。", "p5": "一般化した方程式は微分を2つもち、デルタ関数をもたないことを示した。位置演算子のk非対角成分が、電場によって密度演算子のk非対角成分を生む経路になる（抄録）。", "fun": "同じ物理を表すはずの式に、数十年間2つの食い違う書き方が併存していたという話です。どちらが正しいかを詰めると、電場が電子の状態を思わぬ形で混ぜる経路が見えてくる点が面白いところです。", "unverified": "数値計算での違いの大きさは未確認。"}}, {"id": "pr39", "rank": 39, "headline": "バングラデシュのUber利用者の品質と満足", "title": "Service Quality and Customer Satisfaction with AI-Enabled App-Based Ride-Sharing: Evidence from Uber Users in Bangladesh", "url": "https://doi.org/10.21203/rs.3.rs-11431268/v1", "authors": "Mashrafi ahmed ほか", "venue": "Research Square (In Review)", "date": "2026-10-20", "apa": "ahmed, M., & Mannan, Prof. D. K. A. (2026). Service Quality and Customer Satisfaction with AI-Enabled App-Based Ride-Sharing: Evidence from Uber Users in Bangladesh. https://doi.org/10.21203/rs.3.rs-11431268/v1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "バングラデシュのUber利用者で、確実性・信頼性・応答性がサービス満足の最も強い予測因子であることを示した（抄録）。", "p3": "注意確認を通過した385件の5点リッカート尺度の横断調査を、階層回帰、多変量回帰、探索的なブートストラップ間接効果分析で分析した（抄録）。", "p5": "確実性・信頼性・応答性が満足の最も強い同時予測因子で、知覚された安全は小さいが有意な寄与をもった（抄録）。", "fun": "配車アプリの満足を決めるのは、値段よりも「約束どおり来るか」「安心して任せられるか」だった、という結果です。新しい技術のサービスでも、昔ながらのサービス品質の要素が効いている点が面白いところです。", "unverified": "係数の大きさや継続利用意図への効果は未確認。"}}, {"id": "pr40", "rank": 40, "headline": "ブランド嫌悪・過去の不満と否定的口コミ", "title": "An Examination on The Relationship Among Brand Hate, Negative Past Experience and Negative Word-of-Mouth: Empirical Evidences from The Cargo Sector", "url": "https://doi.org/10.5281/zenodo.23516874", "authors": "Burucuoğlu, Murat", "venue": "Zenodo", "date": "2026-10-20", "apa": "Burucuoğlu, M. (2021). An Examination on The Relationship Among Brand Hate, Negative Past Experience and Negative Word-of-Mouth: Empirical Evidences from The Cargo Sector. IJOPEC Publication. https://doi.org/10.5281/ZENODO.23516874", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録を使用", "preprint": true, "short": true, "p1": "貨物輸送サービスで、過去の否定的経験がブランド嫌悪を介して否定的な口コミにつながることを示した（抄録）。", "p3": "貨物輸送ブランドの顧客を便宜的抽出で調査し、有効な408件で構造方程式モデルにより仮説を検証した（抄録）。", "p5": "過去の否定的経験と否定的口コミ、否定的経験とブランド嫌悪、ブランド嫌悪と否定的口コミの間に正の有意な関係があった（抄録）。", "fun": "嫌な思いをした客は悪い評判を広めますが、その間に「このブランドが嫌い」という感情が挟まっているかを確かめた研究です。不満がただの不満で終わらず、嫌悪という強い感情に育つと口コミの力が増す、という見方が面白いところです。", "unverified": "媒介効果の大きさは抄録が途中で切れており未確認。"}}, {"id": "pr41", "rank": 41, "headline": "推薦アルゴリズムが消費者の信頼と購買を左右", "title": "Personalised by Algorithm: How AI-driven Recommendation Systems Shape Consumer Trust and Purchase Behaviour in Indian E-commerce", "url": "https://doi.org/10.2139/ssrn.7630521", "authors": "Sidra Siddiqui", "venue": "SSRN", "date": "2026-10-20", "apa": "Siddiqui, S. (2026). Personalised by Algorithm: How AI-driven Recommendation Systems Shape Consumer Trust and Purchase Behaviour in Indian E-commerce. https://doi.org/10.2139/ssrn.7630521", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "AIによる推薦・パーソナライズがインドの消費者の信頼と購買に与える影響を、既存研究から整理した（抄録）。", "p3": "近年の実証研究、業界調査、インドの新しいデータ保護制度を素材とする二次研究（抄録）。", "p5": "関連性の高い推薦は購買・再購買意図を高めるが、主に知覚された関連性・満足・信頼を介しており、経路については研究間で一致しない。インドの消費者はAIの提案を受け入れやすい一方で、データ漏洩や個人情報の悪用を心配している（抄録）。", "fun": "買い物サイトが「あなたへのおすすめ」を出すとき、それが効くのは単に便利だからではなく「この店は自分を分かってくれる」という信頼を通じてだ、という整理です。便利さと気味悪さが同居する点が面白いところです。", "unverified": "新しいデータを用いた実証ではない（抄録）。"}}, {"id": "pr42", "rank": 42, "headline": "孤独の概念を理論的に整理する", "title": "Theoretical View to The Concept of Loneliness", "url": "https://doi.org/10.5281/zenodo.23516949", "authors": "Köse ほか", "venue": "Zenodo", "date": "2026-10-20", "apa": "Köse, S., & Özmen, A. Ö. (2021). Theoretical View to The Concept of Loneliness. IJOPEC Publication. https://doi.org/10.5281/ZENODO.23516949", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録を使用", "preprint": true, "short": true, "p1": "現代社会の大きな社会的・心理的問題である孤独を、理論的な観点から整理した（抄録）。", "p3": "産業革命による社会秩序の変化と家族の解体、個人主義の高まり、競争的な労働条件といった孤独の背景を文献にもとづいて論じる（抄録）。", "p5": "孤独は社会学的・心理学的な帰結をもつ多次元・学際的な概念であり、孤独から離れることが個人の心理的well-beingと組織への統合に寄与すると述べる（抄録）。", "fun": "孤独は個人の気持ちの問題に見えますが、産業や家族の形、働き方の変化といった社会の仕組みから生まれる面もあります。身近な感情を社会の歴史の流れの中に置いて考える点が面白いところです。", "unverified": "会議論文で実証データは用いていない（抄録）。"}}, {"id": "pr43", "rank": 43, "headline": "包摂的インフラのジェンダー平等・社会包摂の論拠", "title": "Inclusive infrastructure under pressure: The business case for Gender Equality and Social Inclusion (GESI)", "url": "https://doi.org/10.5281/zenodo.22046389", "authors": "GESI Unit: Climate Compatible Growth", "venue": "Zenodo", "date": "2026-10-20", "apa": "GESI Unit: Climate Compatible Growth. (2026). Inclusive infrastructure under pressure: The business case for Gender Equality and Social Inclusion (GESI). Climate Compatible Growth (CCG). https://doi.org/10.5281/ZENODO.22046389", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録（報告書の概要）を使用", "preprint": true, "short": true, "p1": "インフラ開発にジェンダー平等・社会包摂（GESI）を組み込む「事業上の論拠」をどう示すかを検討するワークショップの報告（抄録）。", "p3": "2025年3月の第1回会合（政策担当者・実務家・研究者30人）を受けた第2回会合で、問題の把握から解決策の設計へ進めることを目指す（抄録）。", "p5": "抄録は会合の目的を述べるにとどまり、結論は書かれていない（未確認）。", "fun": "道路や電力などのインフラは、誰にとっても同じように役立つとは限りません。女性や弱い立場の人も恩恵を受けられるように作ることが、投資として見ても得だと示せるか、という問いが面白いところです。", "unverified": "会合で得られた具体的な提言は未確認。"}}, {"id": "pr44", "rank": 44, "headline": "スマートシティ革新エコシステムの2都市比較", "title": "A Case Study on Smart City Innovation Ecosystems: Florianópolis (Brazil) vs. Bangalore (India)", "url": "https://doi.org/10.2139/ssrn.7633998", "authors": "Dr. Shyam Shukla", "venue": "SSRN", "date": "2026-10-20", "apa": "Shukla, Dr. S. (2026). A Case Study on Smart City Innovation Ecosystems: Florianópolis (Brazil) vs. Bangalore (India). https://doi.org/10.2139/ssrn.7633998", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "フロリアノポリス（ブラジル）とバンガロール（インド）のスマートシティ革新エコシステムを、ライフサイクルモデルで比較した（抄録）。", "p3": "両都市が技術拠点から社会技術的なエコシステムへ移る過程を、ライフサイクルモデルの観点から事例比較した（抄録）。", "p5": "両都市とも「成長段階」に分類されたが、フロリアノポリスは自治体の統治の分断、バンガロールは過剰な都市開発と実施上の欠陥という異なる理由による（抄録）。", "fun": "どちらもスマートシティの上位に入る2都市が、同じ「成長途中」の段階にとどまっている理由は正反対でした。ボランティア中心と大企業・政府中心という対照的な二都市を比べることで、技術より統治のあり方が問われることが見えてくる点が面白いところです。", "unverified": "評価の具体的な指標は未確認。"}}, {"id": "pr45", "rank": 45, "headline": "グラフDEMATELで鉄道の価値ベース維持管理を優先付け", "title": "Graph-based DEMATEL extension framework to support value-based maintenance and Asset Management decisions prioritization for railways infrastructure managers", "url": "https://doi.org/10.2139/ssrn.7644116", "authors": "Irene Roda ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Roda, I., Polenghi, A., Zappa, S., Fochesato, D., & Kopsalidou, K. (2026). Graph-based DEMATEL extension framework to support value-based maintenance and Asset Management decisions prioritization for railways infrastructure managers. https://doi.org/10.2139/ssrn.7644116", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "鉄道インフラ管理者が価値ベースの維持管理・アセットマネジメントの判断を優先付けるための、グラフ型の意思決定支援の枠組みを提案した（抄録）。", "p3": "組織の価値要素間の因果的影響をDEMATELでモデル化し、その総影響行列を重み付き有向グラフとして解釈して、意思決定案の価値への影響を評価する（抄録）。", "p5": "抄録が途中で切れており、適用事例の結果は未確認。", "fun": "線路の補修を「どれから先にやるか」は、安全・費用・サービス・環境など、互いに影響し合う多くの価値の綱引きです。価値同士の影響関係をネットワーク図にして、優先順位に反映させようとした点が面白いところです。", "unverified": "事例での検証結果は未確認。"}}, {"id": "pr46", "rank": 46, "headline": "移動計測で都市交通回廊のPM2.5を転移予測", "title": "Transferable Mobile Sensing-Based PM2.5 Prediction along Urban-Transport Corridors using Low-Rank-Adapted Spatially-Attentive-Graph-Neural-Network Framework", "url": "https://doi.org/10.2139/ssrn.7644117", "authors": "Om Chiddarwar ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Chiddarwar, O., Mandal, P., Chandaliya, P. K., & Arkatkar, S. S. (2026). Transferable Mobile Sensing-Based PM2.5 Prediction along Urban-Transport Corridors using Low-Rank-Adapted Spatially-Attentive-Graph-Neural-Network Framework. https://doi.org/10.2139/ssrn.7644117", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "都市の幹線道路沿いの移動計測データで、交通由来PM2.5の高解像度予測モデルを作り、別の路線への転移を評価した（抄録）。", "p3": "PM2.5・気象・土地利用の移動計測データを作り、クラスター別GRU・グラフ注意ネットワーク・低ランク適応（LoRA）を組み合わせたSA-GNN-LoRAで予測した（抄録）。", "p5": "元の路線（Route A）ではR² = 0.95（RMSE 6.84 μg/m³、MAE 4.19 μg/m³）。別路線（Route B）では、少量データでの微調整によりR²が0.724に上がり、ゼロショットに比べMAEが57.8%、RMSEが49.7%減った（抄録）。", "fun": "同じ通勤路でも、渋滞する交差点のそばでは空気の汚れ方が急に変わります。ある道で学んだ予測モデルを、少しのデータで別の道に「引っ越し」させられるかを試した点が面白いところです。", "unverified": "予測の時間幅ごとの結果は未確認。"}}, {"id": "pr47", "rank": 47, "headline": "仕事は変えられるという手がかりと組織の士気喪失", "title": "Learning Whether Work Can Still Move: Repairability Cues, Hope, and Organizational Demoralization", "url": "https://doi.org/10.31234/osf.io/ubhst_v2", "authors": "Robin Umbra", "venue": "PsyArXiv", "date": "2026-10-20", "apa": "Umbra, R. (2026). Learning Whether Work Can Still Move: Repairability Cues, Hope, and Organizational Demoralization. https://doi.org/10.31234/osf.io/ubhst_v2", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "職場の望ましくない状態が「まだ動かせるか」を従業員が手がかりから学ぶ過程を、修復可能性の手がかりという概念で理論化した（抄録）。", "p3": "手がかり-評価の学習理論をもとに、繰り返し現れる組織の手がかりが、望ましくない仕事の状態について動き・停滞・変化可能性の増大・閉鎖のどれを意味するようになるかを説明する（抄録）。", "p5": "理論的な論文で、実証結果はない（抄録）。", "fun": "上司に意見を言っても毎回無視されると、人は「この職場は何をしても変わらない」と学んでしまいます。つらさそのものではなく「変わる見込みがあるか」の学習が士気を左右する、という見方が面白いところです。", "unverified": "命題の実証的な検証は行われていない（抄録）。"}}, {"id": "pr48", "rank": 48, "headline": "DEI施策と組織文化・従業員成果", "title": "Diversity, Equity, and Inclusion Practices and Their Influence on Organizational Culture and Employee Performance", "url": "https://doi.org/10.2139/ssrn.7637818", "authors": "Hardik Shah", "venue": "SSRN", "date": "2026-10-20", "apa": "Shah, H. (2026). Diversity, Equity, and Inclusion Practices and Their Influence on Organizational Culture and Employee Performance. https://doi.org/10.2139/ssrn.7637818", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "DEI（多様性・公平性・包摂）施策と組織文化・従業員成果の関係を、理論と実証研究から整理した叙述的レビュー（抄録）。", "p3": "職場の包摂、組織文化、多様性マネジメントの理論と、メタ分析・実証研究、企業のDEIへの反発に関する近年の研究を統合した（抄録）。", "p5": "包摂的リーダーシップと心理的安全性は、人員構成の多様さだけよりも、発言・エンゲージメント・革新と直接結び付いていた。単純な事業上の論拠を支持する証拠は限られる（抄録）。", "fun": "いろいろな人を雇うだけでは成果に直結せず、その人たちが安心して意見を言える雰囲気があって初めて効果が出る、という整理です。「数をそろえる」より「声を出せる場を作る」ことの大切さを示す点が面白いところです。", "unverified": "叙述的レビューで系統的な選定基準は未確認。"}}, {"id": "pr49", "rank": 49, "headline": "高等教育での教員と生成AIの共同主体性", "title": "Beyond AI Adoption: Teacher-AI Entanglement and Co-Agency in Higher Education", "url": "https://doi.org/10.2139/ssrn.7644057", "authors": "David Sulistiawan Aditya ほか", "venue": "SSRN", "date": "2026-10-20", "apa": "Aditya, D. S., Herczegh, J., & Febrianto, D. (2026). Beyond AI Adoption: Teacher-AI Entanglement and Co-Agency in Higher Education. https://doi.org/10.2139/ssrn.7644057", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "教員の考えと生成AIの貢献の境目が曖昧になる「教員-AIのもつれ」を定義し、それが授業と学習成果に影響するかを検証した（抄録）。", "p3": "バラッドの行為的実在論にもとづき、AI方針・基盤・文化・研修という制度的装置が教員-AIのもつれと授業でのAIとの共同主体性を予測し、それらが学生の学習成果の認知を予測する構造モデルをPLSで検証した（抄録）。", "p5": "抄録が途中で切れており、推定結果は未確認。", "fun": "AIの導入研究は「使うかどうか」を測るものが多いのですが、使い込むうちに「どこまでが自分の考えか分からなくなる」状態こそが重要だ、という問いの立て方が面白いところです。", "unverified": "標本の規模と推定結果は未確認。"}}, {"id": "pr50", "rank": 50, "headline": "労働時間短縮の因果的証拠と制度設計", "title": "Working-Time Reduction: Causal Evidence, Distributional Incidence, and Institutional Design", "url": "https://doi.org/10.2139/ssrn.7630859", "authors": "Ricardo Alonzo Fernandez Salguero", "venue": "SSRN", "date": "2026-10-20", "apa": "Fernandez Salguero, R. A. (2026). Working-Time Reduction: Causal Evidence, Distributional Incidence, and Institutional Design. https://doi.org/10.2139/ssrn.7630859", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "週労働時間の短縮政策について、因果的証拠・分配上の帰着・制度設計を整理した構造化された批判的統合（抄録）。", "p3": "35の研究・制度資料と40の数値記録を証拠の性質で区別し、準実験的な改革の推定、実験的な職場介入、観察研究、対照のない組織の試行を明示的に分けて評価した（抄録）。", "p5": "最も一般化できる知見は非常な長時間労働の害に関するものだと述べる（抄録の途中まで）。", "fun": "週4日勤務はよく話題になりますが、「法律上の上限」と「実際の労働時間」、「給料を保つか減らすか」などで効果は大きく変わります。証拠の強さごとに仕分けて、どこまで本当に分かっているかを見極めようとする点が面白いところです。", "unverified": "抄録の後半が切れており、他の結論は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "組織行動・心理的安全性", "headline": "大規模チームは科学を発展させ小規模は破壊する", "title": "Large Teams Consistently Develop Science", "url": "https://arxiv.org/abs/2610.27649", "authors": "Yiling Lin ほか", "venue": "arXiv", "date": "Wed, 21 Oct 2026", "apa": "Lin, Y., Yang, L., & Wu, L. (2026). Large Teams Consistently Develop Science (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.27649", "why": "チーム規模と科学の破壊性をめぐる論争に対し、代替指標の欠陥を数学的分析と大規模データで示した再反論。"}, {"id": "pn02", "rank": 2, "field": "機械学習（Hugging Face）", "headline": "LLMエージェントは実務のOR案件をこなせるか", "title": "OR-License: Evaluating LLM Agents as Real-World Operations Research Practitioners", "url": "https://arxiv.org/abs/2610.24087", "authors": "Peisong Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-20", "apa": "Wang, P., Liu, F., Meng, Y., Liu, B., Chen, R., Dai, G., He, X., Li, A., Yuan, F., Chen, A., Zi, C., Li, Y., Zeng, H., Yan, Y., Chen, N., Fu, J., Shen, Z.-J. M., KUO, Y.-H., & Li, J. (2026). OR-License: Evaluating LLM Agents as Real-World Operations Research Practitioners (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.24087",
