<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

<script id="report-data" type="application/json">{"date": "2026-11-21", "intro": "プレプリントの新着1,131件（一覧の候補284件）、学術誌の新着（上位10%誌・重点誌・VBIの監視誌2,733件・うち一覧の候補335件、その他のQ1・Q2誌の候補126件）、重要論文の候補450件（プレプリント255件・学術誌195件）、新着オープンデータ133件（一覧の候補121件）から選びました。プレプリント・関連50報、プレプリント・注目50報、論文誌・関連50報、論文誌・注目50報、オープンデータ28件です。論文誌の注目は、統計学・機械学習・因果推論・経済学の主要誌の新着が少なかったため、上位10%誌の新着からこれらの分野の論文を補いました。今日のおすすめ分野（オペレーションズ・リサーチ、交通・都市計画）は、プレプリントで7報、論文誌で9報を入れました。抄録のない新着は各部の16位以下に置きました。e-Statの新しい統計表は定例の更新だけで、該当はありませんでした。取得できなかった情報源はありません。", "pre_related": [{"id": "pr01", "rank": 1, "headline": "母語特化LLMは自国民をよりよく模倣するか", "title": "Does a Bulgarian Language Model Simulate Bulgarians Better? A Pre-registered Test of LLM Survey Respondents against the European Social Survey", "url": "https://doi.org/10.2139/ssrn.7708278", "authors": "Ivaylo Sakelariev", "venue": "SSRN", "date": "2026-11-19", "apa": "Sakelariev, I. (2026). Does a Bulgarian Language Model Simulate Bulgarians Better? A Pre-registered Test of LLM Survey Respondents against the European Social Survey. https://doi.org/10.2139/ssrn.7708278", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録、途中で切れている）を使用。本文は入手できず", "preprint": true, "p1": "ブルガリア語に特化して追加学習したLLM（BgGPT）が、ブルガリアの人々の調査回答を、元の基盤モデルや汎用の大規模モデルよりよく模倣できるかを、事前登録した検定で調べた（抄録）。未査読。", "p2": "LLMで実在の集団を安価に模擬する「シリコン・サンプル」の利用が増えているが、小さな言語に適応させたモデルがその言語の話者をよりよく再現するかは確かめられていなかった（抄録）。", "p3": "BgGPTの2世代（GoogleのGemmaをブルガリアの研究所INSAITがブルガリア語で追加学習したもの）を、それぞれの基盤モデルとClaude Sonnet 5と比べた。欧州社会調査（ESS）第11回のブルガリアの回答者2,239人それぞれについて、5つの人口統計的な事実からなるペルソナを各モデルに与え、25の質問にブルガリア語で答えさせた（抄録）。解釈：実在の回答者ごとに同じ属性を持つ「分身」を作り、回答の近さを比べる設計である。", "p4": "評価の基準は実際の回答への近さで、仮説と検定はすべて事前登録された。言い換えた指示、選択肢の順序の入れ替え、英語のプロンプトで頑健性を確かめた（抄録）。", "p5": "BgGPTはClaudeより実際の回答に近くはなかったが、Claudeの優位の大きさはモデルから回答を取り出す方法に依存した。新しい世代ではBgGPTが自分の基盤モデルより有意に近く、この優位は17の属性の部分集団のうち16で、また指示の言い換え・選択肢の入れ替え・英語のプロンプトでも保たれた。古い世代では登録した検定で有意でなかった（p = 0.09）（抄録）。", "p6": "取得できた抄録はこの先で途切れており、古い世代の結果の続きと著者の挙げる限界は確認できなかった。解釈：5つの属性だけのペルソナで再現できるのは回答の分布の一部であり、個人単位の一致をどこまで求められるかは残る疑問である。", "fun": "AIに「40代の男性で、首都に住み、大学卒」などと設定して世論調査に答えさせれば、本物の人の代わりになるのか。この研究は、ブルガリア語を特訓したAIと世界的な大型AIを、実在の2,239人の回答と比べた。母語を特訓したAIでも大型AIには勝てず、しかも答えの取り出し方で勝負の差が変わった点が面白い。", "unverified": "抄録が途中で切れており、古い世代の結果の続き、効果の大きさの数値、著者の挙げる限界は確認できなかった。"}}, {"id": "pr02", "rank": 2, "headline": "深層構造化状態空間モデルで非線形同定を高速化", "title": "DS3M: Deep structured state space models for nonlinear system identification on modern hardware", "url": "https://arxiv.org/abs/2611.25274", "authors": "Marco Roschkowski ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Roschkowski, M., & Gernandt, H. (2026). DS3M: Deep structured state space models for nonlinear system identification on modern hardware (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25274", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法・ベンチマークの節と表1〜6）を読んだ", "preprint": true, "p1": "連続時間の神経状態空間モデル（CT-SUBNET）を並列・直列につないだ深層構造化状態空間モデル（DS3M）と、時間積分をGPU上の1つのカーネルにまとめる実装で、非線形システム同定の学習を大幅に速め、標準ベンチマークで従来と同等以上の精度を得た（§2、表3〜6）。未査読。", "p2": "SUBNETは短い測定履歴から初期状態を推定するエンコーダと状態方程式を学習するが、連続時間版は数値積分のたびに小さなニューラルネットを何百回も逐次評価するため、GPUの並列性を生かせず学習が遅いことが実用上の大きな制約だった（§1、図1）。", "p3": "入力から特徴列を作り、各ブロックでH個のCT-SUBNETの状態を数値積分して混ぜ、スキップ接続で次のブロックへ渡し（式3）、N個のブロックを直列につないで出力を読み出す。状態方程式の評価と積分をTritonの融合カーネルで1回の起動にまとめ、重みをレジスタに置いて起動とメモリ転送の負担を減らした（§2.2〜2.3）。散逸を保証するポートハミルトン形の変種も示した（§2.4）。解釈：深層学習の層の積み重ねを、非線形の状態空間モデルに持ち込んだ構成である。", "p4": "Wiener–Hammerstein、EMPS、並列Wiener–Hammerstein、Silverboxの標準ベンチマークで、試験データのRMSEと学習時間を、SUBNET・CT-SUBNET・PNLSS・PNARX・dynoNet・NL-LFRの報告値と比べた（§3）。他手法の学習時間は異なる計算機での文献値である。", "p5": "単一のCT-SUBNETの順・逆伝播は、バッチ100でCUDAの通常実行の280.963 msから1.850 msへ151.91倍速くなった（表1）。Wiener–HammersteinではSUBNETと同じRMSE 0.24 mVを200時間超ではなく1.5時間で達成し（表3）、EMPSではRMSE 1.8 mmと既存の最良の2.6 mmを下回った（表4）。Silverboxでは0.5時間でSUBNETを改善したが、2本目の試験軌道は0.74 mVと劣った（表6）。", "p6": "著者は、重みがレジスタに収まる小さな部品に限られ構造を事前に固定する必要があること（§1、§2.2）、学習分布から外れるSilverboxの2本目の軌道の弱さはSUBNET型の手法の限界として残ることを挙げる（§3）。解釈：学習時間の比較は異なる計算機の文献値との比較で、厳密な速度比較ではない。", "fun": "物の動き方を表す方程式をデータから学ぶAIは、時間を1歩ずつ進める計算を何百回も順番にくり返すので、並列計算が得意なGPUでも遅かった。この研究は、その小さな計算の山をGPUの中で1つにまとめ、ある計算を百倍以上速くした。速くなった分、長いデータで学べて精度も上がった。工夫の中心がAIの理論ではなく計算機の使い方にある点が面白い。", "unverified": "表2のブロック数・状態次元などの設定値は抽出できず確認できなかった。他手法の学習時間は異なる計算機の文献値である。"}}, {"id": "pr03", "rank": 3, "headline": "振動モードから源の位置を同定できる条件", "title": "From Oscillatory Modes To Source Geometry: Identifiability And Localization In Multichannel Time Series", "url": "https://doi.org/10.2139/ssrn.7716058", "authors": "Alexandra Bernadotte ほか", "venue": "SSRN", "date": "2026-11-19", "apa": "Bernadotte, A., & Menshikov, I. (2026). From Oscillatory Modes To Source Geometry: Identifiability And Localization In Multichannel Time Series. https://doi.org/10.2139/ssrn.7716058", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録）を使用。本文は入手できず", "preprint": true, "p1": "多チャンネルの時系列から、振動モードの時間的な特徴だけでなく、その空間的な負荷（ローディング）を既知の伝播・減衰モデルに当てはめて、潜在的な振動源の位置を推定する枠組みと、その同定可能性の条件を示した（抄録）。未査読。", "p2": "スペクトル法で振動成分は特定できるが、その時間的な特徴が源の幾何（位置）の再構成に十分な情報を含むかには、追加の同定可能性の条件が必要で、それは整理されていなかった（抄録）。", "p3": "ブロック・ハンケル埋め込みの多チャンネル特異スペクトル解析（MSSA）でモードの数と時間的な極、空間ローディングを求め（姉妹論文）、ローディングを源ごとの空間的な「指紋」として減衰モデルと照合し、源の座標を推定する。正規化した減衰の形から生じる幾何学的な曖昧さを特徴づけ、局所・一般・配置固有の3段階の同定可能性と、それぞれに必要なセンサ数を示した（抄録）。解釈：振動数で源を分け、振幅の空間分布の形で位置を決める二段構えである。", "p4": "加法的なローディングの雑音の下での1次の位置推定精度を導き、それがそのモデルのクラメール・ラオ限界であることを示した。数値実験で位置推定、同じ振動数を共有する源、雑音、センサ座標の誤差・空間相関のある雑音・伝播遅れなどのモデルの不一致、ブラインド分離との比較を調べた（抄録）。", "p5": "べき乗則と指数の減衰では曖昧さの集合が明示的な幾何で表され、ランクに基づく基準がセンサ配列の大域的な同定可能性の計算可能な十分条件を与えた。UCIの実際の脳波データに球の頭部モデルで全算法を適用したが、これは手順の実演で検証ではないとしている（抄録）。", "p6": "著者は、実データへの適用は実演にとどまり性能の検証ではないと述べる（抄録）。解釈：伝播・減衰のモデルが既知であることが前提で、減衰の形が未知・不均一な媒体でどこまで当てはまるかは残る疑問である。", "fun": "部屋のあちこちに置いたマイクで、どこで誰が歌っているかを当てたい。歌声の高さで歌い手を区別し、どのマイクにどれだけ大きく届いたかの「地図」を音の弱まり方の法則と照らし合わせれば、場所が分かる。ただしマイクの数や置き方によっては、答えが1つに決まらない。その「決まるための条件」を数学で整理した点が面白い。", "unverified": "本文は入手できず、数値実験の誤差の値と必要なセンサ数の具体的な式は確認できなかった。"}}, {"id": "pr04", "rank": 4, "headline": "高齢層だけ金融資産の増加が孤独感を下げる", "title": "Age Differences in the Association Between Household Financial Assets and Loneliness Across Five Survey Waves in Japan", "url": "https://doi.org/10.21203/rs.3.rs-11662297/v1", "authors": "Yoshihiko Kadoya", "venue": "Research Square (In Review)", "date": "2026-11-20", "apa": "Kadoya, Y. (2026). Age Differences in the Association Between Household Financial Assets and Loneliness Across Five Survey Waves in Japan. https://doi.org/10.21203/rs.3.rs-11662297/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research Squareの本文（方法・結果・考察と限界の節、表1・表2）を読んだ", "preprint": true, "p1": "日本の5波（2020〜2024年）のオンライン家計パネルで、世帯の金融資産の個人内の変化と孤独感の関連が65歳以上でのみ負であり、年齢層で有意に異なることを示した（§3.2、表2）。未査読。", "p2": "経済的資源と孤独の関係は年齢で異なりうることが指摘されてきたが、横断研究が多く、同じ人の資産や所得が変わったときに孤独感がどう変わるかを年齢層で比べた縦断の証拠は乏しかった（考察）。", "p3": "日経リサーチのパネルによる家計行動・金融調査（2020年の有効回答17,463件）から、2波以上で孤独感・所得・資産が有効な4,165人・15,105人年の非均衡パネルを作った（§2.1）。孤独感はUCLA-3の3項目の合計（3〜9点）、所得（12区分）と資産（10区分）は区分の代表値の対数とし、個人と年の固定効果、基準年の年齢層×年の効果を入れ、資産×65歳以上の交互作用を主な母数として、回答者でクラスタ化した標準誤差で推定した（§2.2〜2.4）。解釈：同じ人の時間変化だけを使うので、性格など変わらない個人差は取り除かれる。", "p4": "感度分析として、資産の区分そのものの使用、就業・配偶者・独居・健康・抑うつの統制、標本の制限、外れ値の除外、1人ずつ除く推定、2種類の二値の孤独の定義、基準時の属性による逆確率重みづけを行った（§2.5）。", "p5": "65歳未満の資産の係数は0.0088（p = 0.755）だったが、交互作用は−0.1888（SE 0.0580、p = 0.001）で、65歳以上の資産の係数は−0.1800（95%CI −0.2791〜−0.0809）だった。所得には年齢層の差がなかった（交互作用p = 0.979）（§3.2、表2）。負の交互作用は多くの感度分析で保たれたが、「よく感じる」に基づく厳しい二値の定義では有意でなかった（考察）。", "p6": "著者は、脱落の多いオンラインパネルで全国代表性がないこと、高齢層が小さく男性が多いこと、資産・所得が区分の近似で非金融資産と負債を含まないこと、時変の交絡と逆因果を除けないこと、退職や年金受給を区別できないことを限界とする（考察）。解釈：資産が孤独を減らすのか、健康や人間関係の変化が両方を動かすのかは、この設計では分けられない。", "fun": "お金があれば寂しくないのか。日本の同じ人たちを毎年追いかけると、65歳以上の人では、貯金や投資が増えた年ほど孤独感が少し下がっていた。ところが若い人ではそうした関係は見えず、毎年の収入の増減も孤独感と関係しなかった。「年収」ではなく「蓄え」が、年をとってからの安心に関わるのかもしれない点が面白い。", "unverified": "補足表の内容と、感度分析ごとの係数の値は確認していない。"}}, {"id": "pr05", "rank": 5, "headline": "AI事故の半数は企業の開示に現れない", "title": "Whose Risks Count? What 1,901 AI Incidents Reveal About Corporate Disclosures", "url": "https://arxiv.org/abs/2611.25841", "authors": "Simeon Allmendinger ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Allmendinger, S., Bogucka, E. P., Kühl, N., & Quercia, D. (2026). Whose Risks Count? What 1,901 AI Incidents Reveal About Corporate Disclosures (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25841", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（方法・結果・考察と限界の節、表1と図2・図3の説明）を読んだ", "preprint": true, "p1": "公開のAI事故データベースの事故9,001件を、関与したSEC登録のAI企業328社の提出書類18,229件とリスクの種類で照合し、証券の開示が第三者へのAIの害をどこまで記録しているかを示し、照合コーパスDISCを公開した（抄録、§3）。未査読。", "p2": "AIの提供者・利用者にリスクの開示を義務づける制度はまれで、米国の証券規制は例外だが、重要性は合理的な投資家の観点で決まるため、第三者への害は企業の財務リスクになる限りでしか開示に入らない。その実態は検証されていなかった（抄録、§1）。", "p3": "AIID・AIAAIC・OECD AIMの事故を統合し、事前に書いたコードブックでリスクの種類（AI Risk Repositoryの24の下位領域）、被害者、影響の層、提供者・利用者を2つのLLM（Claude Opus 5.5とSonnet 5.5）で符号化した（§3.1）。EDGARの年次・四半期報告のリスク要因の節からAIに触れる文を抜き出して同じ基準で符号化し、事故の前後の開示の有無で、前後とも開示（Covered）、後だけ（Eventually Disclosed）、前だけ（Dropped）、開示なし（Missed）に分けた（§3.2〜3.3、表1）。解釈：文の類似ではなく害の種類で照合するので、事前の一般的なリスクの記述も開示と数える設計である。", "p4": "人の符号化者との一致はCohenのκで事故0.92、開示文0.89だった（§3.1〜3.2）。照合の妥当性、リスクの種類の粒度、事故の日付の取り方などで頑健性を確かめた（付録B）。", "p5": "前後に提出書類のある1,901件のうち開示されたのは944件（49.7%）で、950件がMissedだった（§4、表1）。システムの故障は33%がMissedだったが、社会システムへの害は98%がMissedで、情報生態系への害は65件中65件だった（§4.1、図2）。Missedの割合は2022年の68%から2026年前半の26%に下がった。開示済みの事故の87%は8社に集中し、事故後に事故を具体的に反映した修正は2.7%だった（§4.2、図3）。", "p6": "著者は、事故データベースが報道に依存し英語圏の大企業に偏ること、SEC登録企業に限られ非上場の主体を含まないこと、リスクの種類の一致は事故の十分な説明を意味しないこと、LLMの符号化の誤り、開示はあっても費用は観測できないことを限界とする（§5.5）。", "fun": "株式を公開している会社は、投資家に向けて「わが社にはこんな危険がある」と書類で知らせる義務がある。しかし、それは会社が損をする危険の話で、AIが社会や他人に与える害とは限らない。約9千件のAI事故と書類を突き合わせると、偽情報や社会への害はほとんど書かれていなかった。誰の危険が数えられているかを問う視点が面白い。", "unverified": "付録Bの頑健性検証の詳細な数値と、修正の種類ごとの例の全文は確認していない。"}}, {"id": "pr06", "rank": 6, "headline": "潜在空間の条件付きガウスで高速データ同化", "title": "Neural Conditional Gaussian Model: Efficient Data Assimilation with Sequential Uncertainty Quantification for Nonlinear Dynamics", "url": "https://arxiv.org/abs/2611.26463", "authors": "Chuanqi Chen ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Chen, C., & Chen, N. (2026). Neural Conditional Gaussian Model: Efficient Data Assimilation with Sequential Uncertainty Quantification for Nonlinear Dynamics (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26463", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法、3つの数値実験、結論の節と図表の説明）を読んだ", "preprint": true, "p1": "部分観測の非線形系で、観測されない物理状態を学習した潜在空間に写し、そこで条件付きガウス構造の力学を学ぶNeural CGMにより、閉形式のデータ同化と不確実性の伝播を行い、粒子フィルタより大幅に速く同等以上の推定を得た（§2、§3.3）。未査読。", "p2": "非線形のデータ同化（DA）は隠れた状態とその不確実性を繰り返し推定する必要があるが、非線形フィルタは計算が重く、明示的な力学モデルにも頼ることが多かった（§1）。", "p3": "観測変数を条件に潜在状態が線形に入る条件付きガウスの形で力学を表し（式2.2）、エンコーダ・デコーダと係数関数をニューラルネットで学ぶ。潜在状態の事後分布はガウスのまま保たれ、カルマンゲインに似た量を持つ閉形式の漸化式（条件付きガウスフィルタ、式2.3）で更新できる。事後平均と共分散はガウスのデコーダで物理空間に戻し、その統計を学習時の負の対数尤度にも入れる（§2.1〜2.3）。解釈：非線形な系を「観測が分かれば線形」になる座標に変え、カルマンフィルタの計算を使えるようにした。", "p4": "確率的Lorenz 63、40次元の確率的Lorenz 96、Kuramoto–Sivashinsky方程式で、真の方程式を既知とするEKF・UKF・EnKF・粒子フィルタ（PF）と、データ駆動のCGKNと比べ、DAのRMSE、負の対数尤度（NLL）、予報の誤差、計算時間で評価した（§3）。", "p5": "Lorenz 63ではPFやEnKFが一部の指標でわずかに上回ったが、Neural CGMは8000時間ステップの同化を0.8772秒で行った（§3.1）。Kuramoto–SivashinskyではPFより事後の幅が狭くRMSEも低く、1万時間ステップの同化をPFの706.2211秒に対し約1.8秒（約400倍速い）で行い、CGKNに比べてDAのRMSEを0.4222から0.3846に、NLLを166.11から54.67に下げた（§3.3、図3.10）。", "p6": "著者は、再構成・予報・DAの目的の重みの調整や複数回の学習が必要になりうること、学習時に観測変数と非観測変数の対の軌道が必要なこと、尤度で対角の共分散しか使っていないことを限界とし（§4）、速度の比はPFの実装に依存すると注記している（§3.3）。", "fun": "天気予報のように、一部しか見えない世界の状態を観測から推理する計算は、何百もの「ありえる世界」を同時に動かすので時間がかかる。この研究は、AIが学んだ特別な座標に移ると、推理の計算が教科書どおりの簡単な公式で済むようにした。複雑な問題を簡単に解ける見え方に変えてから解く発想が面白い。", "unverified": "Lorenz 96の結果の詳細な数値（表3.1）と学習にかかる時間は確認していない。"}}, {"id": "pr07", "rank": 7, "headline": "AIを2週間断つと孤独感が減り対面交流が増える", "title": "AI Deactivation Reduces Loneliness and Increases Social Interaction", "url": "https://arxiv.org/abs/2611.25263", "authors": "Dora Zhao ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Zhao, D., Wang, G., Zhang, Y., Ibrahim, L., Kraut, R. E., & Yang, D. (2026). AI Deactivation Reduces Loneliness and Increases Social Interaction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25263", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（結果・考察・方法の節と図2・図3の説明、脱落と遵守の節）を読んだ", "preprint": true, "p1": "日常の道具としてChatGPTを使う米国の利用者625人の無作為化した停止実験で、AIアシスタントを2週間使わないと孤独感が下がり、人との交流が増え、その効果が再開の2週間後も残ることを示した（§2.1、§2.4）。未査読。", "p2": "AIと社会的な幸福の研究は、AIコンパニオンのような明示的に社会的な使い方に集中してきた。しかし利用の大部分は生産性などの道具的な目的であり、その使い方が人間関係に影響するかは分かっていなかった（§1、考察）。", "p3": "1日15分以上ChatGPTを使う利用者に、週40ドルでAIの利用を2週間（処置）または1日（対照）断ってもらい、ブラウザ拡張で遵守を監視した。基準時、介入中の調査、毎日の経験サンプリング、終了2週間後の追跡調査で測り、効果は条件×期間の交互作用を固定効果とする線形混合効果モデルで、基準時の標準偏差単位で推定した（§2、§2.1、§4.1）。解釈：対照を「1日だけ断つ」にして、要求効果と脱落の差を抑える工夫である。", "p4": "孤独感と感情状態は事前登録の方向つき仮説とし、心理的幸福と社会的行動はBenjamini–Hochbergで多重検定を補正した（§2.1）。終了時の調査の完了は625人中500人（80.0%）、処置群の完全な遵守は263人中214人（81.36%）で、欠測は完全情報最尤法で扱った（§4.2〜4.3）。", "p5": "2週間の停止で孤独感は対照より下がり（β = −0.099、p = 0.028）、社会的支援が増え（β = 0.104）、毎日の交流の回数が増えた（β = 0.153、p = 0.007）（§2.1、図2）。感情状態や心理的幸福には有意な効果がなかった。1週目の交流の時間と満足が孤独感の低下を一部媒介した（§2.2、図3）。終了2週間後も孤独感は低く（β = −0.164、p = 0.016）、AIの利用時間も少ないままだった（§2.4）。", "p6": "解釈：参加者は米国のChrome利用者で、謝礼を受けて断つことに同意した人に限られ、終了時の調査の完了率は処置群と対照群で11.7ポイント異なる（§4.2）。媒介分析は探索的で、効果は小さく、AIの利用が交流を押しのける仕組みの直接の手がかりは、AIの代わりに人に頼ったという自由記述（7.7%）などに限られる（§2.2）。", "fun": "AIに調べものや文章作りを頼むのは、人付き合いとは関係なさそうに思える。ところがAIを2週間やめてもらうと、人に質問したり話したりする機会が増え、寂しさが減った。AIが便利すぎて、知らないうちに人に頼る機会を減らしていたのかもしれない。役に立つ道具の思わぬ副作用を実験で確かめた点が面白い。", "unverified": "長期利用者で効果が大きいという§2.3の推定値と、補足資料の脱落の分析は確認していない。"}}, {"id": "pr08", "rank": 8, "headline": "心理特性と状態遷移で個人の行動を予測する", "title": "PsyWorld: Profile-Conditioned World Modeling for Human Behavior Prediction", "url": "https://arxiv.org/abs/2611.24999", "authors": "Ziyuan Qin ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Qin, Z., Qiao, Y., Frandsen, S. B., Treadway, M. T., & Zhao, L. (2026). PsyWorld: Profile-Conditioned World Modeling for Human Behavior Prediction (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24999", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（手法・実験・限界の節と表1〜3の本文中の値）を読んだ", "preprint": true, "p1": "心理測定のプロフィールと、観測された環境・行動の状態遷移を手がかりに人の行動を予測する世界モデルPsyWorldを示し、学習に使っていない参加者の行動の予測精度を大きく上げた（§3、§4.2）。未査読。", "p2": "既存の個人化エージェントは静的なプロフィールから直接行動を決めることが多く、実際に起きた状態遷移を明示的な学習の手がかりとして使っていなかった（抄録、§1）。", "p3": "安定した質問紙のプロフィールと時間で変わる状態を分け、文脈を符号化して次の環境・行動の状態を予測するデコーダを持つ世界モデルを作った（§3.3）。学習時は実際に起きた変化を見る事後エンコーダのベクトルを符号帳で量子化し、事前分布はプロフィールと遷移前の文脈からその符号を予測するよう学ぶ。予測時は事前の符号だけを使い、その符号と予測した次の状態で大まかな行動（マクロ行動）を決める（§3.4〜3.5）。解釈：未来を見て作った「答えの要約」を、未来を見ずに当てる練習をさせる仕組みである。", "p4": "Unityで作った行動シミュレータVEET（報酬と不安・負担の間の選択）の313人の質問紙と行動軌跡を、参加者を重ねずに学習240人・検証25人・試験48人に分け、Top-1・Top-3精度とマクロ行動の分布のKLで評価した。比較対象はプロフィールから直接行動を学ぶSFT/BCである（§4.1）。LLMで動く都市規模のAgentSocietyでも、同じプロフィールの合成エージェントで試した（§4.5）。", "p5": "VEETの未見の参加者でTop-1は0.904（95%区間 0.895〜0.913）、Top-3は0.989で、直接のSFT/BCの0.754・0.890を上回り、Macro KLは0.0033だった（§4.2、表1）。アブレーションでは連続の次状態予測がTop-1の向上の大半を占め（0.901）、離散の符号と事前の整合は主にTop-3と分布の一致を改善した（§4.3、表2）。", "p6": "著者は、多段の状態遷移の較正された忠実さは独立に評価しておらず、学習した符号は行動を予測する要約で因果的・臨床的な状態ではないこと、別の集団や尺度での検証は今後の課題であることを挙げる（§5）。符号と心理尺度の相関はFDR補正後に有意なものがなかった（図3）。", "fun": "性格テストの結果だけで、その人がゲームの中で次に何をするかを当てるのは難しい。この研究は、「この人がこういう状況でどう変化したか」という記録をAIの学習の手本にした。学習中は未来の答えを見て要点をつかみ、本番では未来を見ずにその要点を言い当てる。答えを予習に使うような発想が面白い。", "unverified": "AgentSocietyでの数値の結果（表4）と、プロフィールの群ごとの詳細は確認していない。"}}, {"id": "pr09", "rank": 9, "headline": "気候の語りと排出の差は負債構成と関係するか", "title": "Measuring climate credibility? Talk, emissions, and corporate debt composition", "url": "https://arxiv.org/abs/2611.25951", "authors": "Georgios Chortareas ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Chortareas, G., Kou, F., & Ventouri, A. (2026). Measuring climate credibility? Talk, emissions, and corporate debt composition (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25951", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（データと測定、§5.3の主結果、限界の節）を読んだ。異質性と追加分析の節は一部のみ", "preprint": true, "p1": "排出量の伸びを前年の決算説明会での気候への言及の頻度で割った指数（ETI）と企業の負債構成の関係を、2010〜2021年の米国上場企業で調べ、銀行借入の比率との負の関連は業種・年の固定効果の下でのみ見え、企業内の変化では消えることを示した（§5.3、表3）。未査読。", "p2": "気候について多く語りながら排出を増やす企業は、監視の厳しい銀行借入を避けるのではないかという問いがある。ただし語りと実績のずれを測る指標は、その構成と推定の仕方に強く左右されうる（§1〜§2）。", "p3": "Compustatの企業年パネル（2,707社・16,258企業年）に、決算説明会の経営陣の発言の気候関連の二語句の頻度、LSEG/Refinitivの排出量、Capital IQの負債の構成、RepRiskの事故、DealScanの融資（15,958件）を結合した（§3.1〜3.4）。ETIは主張の真偽や経営者の意図を測らないと明記し、比率を使わない交互作用や語りと排出の4区分でも確かめた（§1、§3.3）。解釈：割り算の指標は分母が小さいと極端な値になるので、比率を使わない確認が欠かせない。", "p4": "業種・年と企業・年の固定効果の比較、翌年の負債を予測する時点のずれ、Oster・Frankの感度、共分散の推定の代替、1年ずつ除く推定などで推論の頑健性を確かめた（§4.4、表5）。", "p5": "業種・年の固定効果ではETIの係数が−0.0914（p = 0.037、N = 10,691）で、1標準偏差は銀行借入の比率の約0.4ポイント（平均は約34%）に当たった。企業・年の固定効果では−0.0178（p = 0.738）と約5分の4小さく、有意でなかった（§5.3、表3）。翌年の負債構成の予測でも有意な関連はなく、融資の条件にも共通の関係は見られなかった（抄録、§5.3）。", "p6": "著者は、説明会の文字起こしの生データがなく前処理を再現できないこと、排出量の報告値と推計値の区別や過去の版がないこと、RepRiskは報道に基づく指標であること、負債の比率から銀行・社債の額や環境債の発行を識別できないことなどを限界とする（§9）。関連は因果ではないと明言している（抄録）。", "fun": "「環境に配慮します」と熱心に語る会社が実は排出を増やしていたら、目の厳しい銀行からの借金を避けるのではないか。そんな仮説を確かめると、業種の中で会社同士を比べたときだけ関係が見え、同じ会社の年ごとの変化では消えてしまった。比べ方ひとつで結論が変わることを正直に示した点が面白い。", "unverified": "競争・財務の健全性・情報の不透明さによる異質性（§6）と追加分析（§7）の推定値は確認していない。"}}, {"id": "pr10", "rank": 10, "headline": "生成AIで波動伝播とインフラのデジタルツイン", "title": "Simuler, apprendre, jumeler: intelligence artiﬁcielle générative pour les jumeaux numériques de la propagation des ondes et des infrastructures critiques.", "url": "https://hal.science/tel-05873282v1", "authors": "Filippo Gatti", "venue": "HAL", "date": "2026-11-19", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "HALの抄録（研究指導資格論文、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "p1": "波動伝播と重要インフラのデジタルツインに向けて、物理の忠実さを保ったまま生成AIで計算を速める10年間の研究をまとめた研究指導資格（HDR）の論文である（抄録）。", "p2": "弾性波や超音波など偏微分作用素に支配される場の物理シミュレーションは系の特性評価の基準だが、計算費用が大きく、デジタルツインが求める繰返し・実時間・大規模の利用を妨げていた（抄録）。", "p3": "地震工学では、源・伝播経路・サイトの効果を分ける解釈可能な地震動モデルから、物理条件つきの生成ネットワーク、3次元弾性動力学のニューラル作用素、そのスペクトルの偏りを補正する拡散モデルへと進めた。非破壊検査と構造ヘルスモニタリングでは、多モードの超音波画像と損傷を条件とする振動応答を生成する代理モデル、レーザー超音波のニューラル作用素を、シミュレーションと学習をつなぐ枠組みに統合した。気候変動下の鉄道インフラでは、点群の自己蒸留による網の分割とグラフTransformerによる洪水地図に拡張した（抄録）。", "p4": "抄録からは各研究の評価のデータや指標は読み取れない。地震動の研究は地震リスク評価の産業的な事業の基盤になっているとされる（抄録）。", "p5": "未確認（抄録には個別の結果の数値がない）。最終章は、これらの成果が複数の災害を扱い意思決定を導く、継続的に更新されるデジタルツインへ収束する見通しを述べる（抄録）。", "p6": "総括の論文で、個々の研究の検証の詳細と限界は抄録からは確認できない。解釈：生成モデルの出力が物理的にどこまで忠実かの評価方法が、各応用での鍵になる。", "fun": "地面の揺れや超音波の伝わり方を正確に計算すると、大型の計算機でも時間がかかる。この研究は、AIに物理の計算結果を学ばせ、ほぼ同じ答えを一瞬で出せるようにすることを10年かけて進めた。地震、機械の検査、鉄道と分野を越えて同じ考え方を使う点が面白い。", "unverified": "本文は入手できず、各研究の精度や速度の数値、使ったデータは確認できなかった。"}}, {"id": "pr11", "rank": 11, "headline": "税と公共投資を交換する制度のデジタル基盤", "title": "Works for Taxes as Fiscal Financial Technology: Tax-Recognition Instruments, Digital Infrastructure, and Administrative Data in Peru and Colombia", "url": "https://doi.org/10.20944/preprints202611.1832.v1", "authors": "José Luis Castilla Cabezudo ほか", "venue": "Preprints.org", "date": "2026-11-20", "apa": "Castilla Cabezudo, J. L., Vélez Jaramillo, E. A., Velásquez Ochoa, J. A., Garcés Giraldo, L. F., Sepúlveda Aguirre, J., Castrillón Rivera, A., & Ronceros Morales, C. (2026). Works for Taxes as Fiscal Financial Technology: Tax-Recognition Instruments, Digital Infrastructure, and Administrative Data in Peru and Colombia. https://doi.org/10.20944/preprints202611.1832.v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（Crossrefに登録）を使用。本文は入手できず", "preprint": true, "p1": "企業が公共投資事業を担い、その費用を税の控除に使える証券で回収する「Works for Taxes」の制度をペルーとコロンビアで比べ、証券のデジタル基盤と行政記録の追跡可能性の問題を示した（抄録）。未査読。", "p2": "解釈：税の支払いを公共事業に置き換える制度は、事業と発行された証券を結びつけて追えなければ評価できない。この研究は、その前提となる法制度と記録の整い方を比べる（抄録の内容から）。", "p3": "2021〜2026年の両国の制度を、6つの分析カテゴリに沿った法令・文書の比較と行政記録の記述分析で調べた。ペルーは2021年から2026年9月に落札された1373の事業、コロンビアは2021〜2025年の426の事業記録を使い、金額は2021年の不変価格に直した（抄録）。", "p4": "電子発行の公共投資証書（ペルーのCIPRL/CIPGN）と、無券面で売買できる地域再生証券（コロンビアのTRT）の流通の範囲、事業の分野と地域の集中、事業と証券の対応づけの可否を比べた（抄録）。", "p5": "両国とも証券はすでにデジタルだが、TRTは中央証券保管機関に記帳される証券で、CIPRL/CIPGNは財務省の基盤で発行される行政文書だった。実質の落札額はペルーで2021〜2025年に11倍超（主に2024年以降）、コロンビアで3.4倍に増え、資源は交通・道路と教育、少数の県に集中した（抄録）。", "p6": "どちらの公開データも事業と発行された証券を結びつけておらず、税の負債から完成した資産までを追跡できない。著者は、識別子に基づく相互運用可能な登録簿が、制度の評価にも将来の税額控除のトークン化にも前提になると述べる（抄録）。", "fun": "会社が税金を払うかわりに、学校や道路を自分で作って国に引き渡す制度がある。お金の代わりに受け取るのは「税金を払ったことにできる証券」だ。ところが、どの工事にどの証券が出たかを公開データで結びつけられず、税金が本当に何に変わったのかを最後まで追えない。制度の見えにくい穴を示した点が面白い。", "unverified": "本文は入手できず、6つの分析カテゴリの内容と事業分野ごとの金額は確認できなかった。"}}, {"id": "pr12", "rank": 12, "headline": "難易度を較正した討論文で人の判定を研究", "title": "DC-Debates: Difficulty-Calibrated Debate Transcripts as Stimuli for Scalable Oversight Research with Human Participants", "url": "https://doi.org/10.31234/osf.io/f56sc", "authors": "Gabriel Recchia ほか", "venue": "PsyArXiv", "date": "2026-11-20", "apa": "Recchia, G., Mangat, C. S., Rao, S. S., & Khadkikar, S. (2026). DC-Debates: Difficulty-Calibrated Debate Transcripts as Stimuli for Scalable Oversight Research with Human Participants. https://doi.org/10.31234/osf.io/f56sc", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "OSF上のPDFの本文（方法・結果・限界の節）を読んだ", "preprint": true, "p1": "AIの安全性のための討論（人の判定者が2つのAIの討論を読んで正しい側を判断する手法）の研究に使う刺激として、難易度を較正した24本の討論の書き起こしを作り、事前登録の実験で難易度を4段階に分けて公開した（抄録、結果）。未査読。", "p2": "人の判定の系統的な誤りを減らす方法の研究は、強いAIの討論者が作りそうな刺激で行う必要があるが、既存研究は短編の読解問題に基づく刺激が主で、難しすぎず易しすぎない刺激が不足していた（序論、限界）。", "p3": "天体物理の研究、頭の体操、報酬ハッキングの評価の3分野から12問を選び、再帰的な討論の手順を想定した書き起こしを1問2本（誠実な側の順序を入れ替え）作り、11の文体・修辞の次元を節ごとにLLMの採点でそろえた。Prolificの1,282人が1本を4つの節に分けて読み、各節の後に各討論者が専門家の答えと一致する確率（1〜99%）と理由を記録した（方法）。", "p4": "書き起こしを問題・分野に入れ子にしたベイズ階層モデルで、最後の節での正答への確信（ロジット）から書き起こしごとの条件付きの難易度の事後分布を推定して4段階に分けた。収束は事前登録の基準で確かめ、予測の較正と代替の残差分布も調べた（結果）。", "p5": "誠実な側の提示順の効果は+0.009ロジット（95%HDI −0.152〜+0.175）でほぼゼロだった。書き起こし単位の分散は残り（σv = 0.343）、24本は4段階に5・8・4・7本と割り当てられ、隣り合う段階の差はすべて0.15ロジットを超えた（結果、表1）。誠実な討論者が忠実に論じても判定者を正解に導けない例があり、不誠実な側が重要でないほうの下位主張に再帰を誘導する失敗が見られた（抄録、考察）。", "p6": "著者は、手作業の調整のため刺激が少なく一般化に不確実さがあること、手順・判定者の集団・話題の選択が生態学的妥当性に影響すること、文体の調整がLLMの採点に頼り他の次元の偏りが残りうること、段階への割り当てに不確実さがあり目安とみるべきことを限界とする（限界）。", "fun": "AIが人間より賢くなったとき、人はAIの答えが正しいかをどう判断すればよいのか。一つの案は、2つのAIに討論させて人が審判をすることだ。この研究は、その審判の練習問題になる「ちょうどよい難しさ」の討論を作り、千人を超える人に判定させて難しさを測った。うそつき側が話を細かい論点にそらす手口が見えた点も面白い。", "unverified": "4段階の各平均値（表1）と、確信の更新を結果とした場合の段階の割り当ての詳細は確認していない。"}}, {"id": "pr13", "rank": 13, "headline": "社会的比較の網を考慮した個別価格の理論", "title": "Optimal Personalized Pricing under Network-Based Consumer Trust: A Spectral Theory of Fairness-Constrained Price Discrimination", "url": "https://doi.org/10.2139/ssrn.7717161", "authors": "Rajit Chatterjea ほか", "venue": "SSRN", "date": "2026-11-20", "apa": "Chatterjea, R., & Park, J. (2026). Optimal Personalized Pricing under Network-Based Consumer Trust: A Spectral Theory of Fairness-Constrained Price Discrimination. https://doi.org/10.2139/ssrn.7717161", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録）を使用。本文は入手できず", "preprint": true, "p1": "消費者が社会的につながる集団と価格を比べて公平さを判断するとき、独占企業が集団ごとの価格をどう決めるべきかを、比較ネットワークのグラフ・ラプラシアンで表す理論で示した（抄録）。未査読。", "p2": "個別価格の不公平感は従来、集団全体の価格のばらつきで測られることが多く、誰と誰が比べ合うかという社会の構造は考慮されていなかった（抄録）。", "p3": "n個の観察可能な消費者集団への価格を一律価格からの個別化ベクトルyで表し、知覚される不公平さを比較ネットワークの重みつきグラフ・ラプラシアンLによる二次のエネルギーU(y) = ½ yᵀLyとした。線形の需要では追加の営業利益が厳密な二次形式になり、凸な実施費用の下で企業の問題は凸な信頼の制約つきの強凹な二次計画になる（抄録）。解釈：つながった集団の間の価格差の二乗和を不公平の総量とし、その上限を信頼の予算とみなす設計である。", "p4": "最適な個別価格の存在と一意性を示してKKT条件で特徴づけ、信頼の制約の乗数を信頼の予算を緩める限界価値として解釈した。実施費用が需要の傾きに比例する場合の明示的な解を導いた（抄録）。", "p5": "解は需要で正規化したグラフ・ラプラシアンの固有基底でスペクトル表現でき、個別化はネットワークの固有値に応じてモードごとに弱められる。信頼の予算を固定すると、比較のつながりを1本加えるだけで最大の利益は弱く減ることを証明し、連結性と信頼ゼロの極限も特徴づけた（抄録）。", "p6": "抄録は理論の結果に限られ、実データでの検証は示されていない。解釈：比較ネットワークの重みをどう測るかが実用上の課題として残る。", "fun": "同じ商品を人によって違う値段で売ると、友だち同士で値段を比べた人は「不公平だ」と怒るかもしれない。この研究は、誰と誰が比べ合うかのつながりを網の目で表し、その網の振動の仕方（固有値）ごとに値段の差をつけるか控えるかが決まることを示した。物理の振動の数学が値付けに出てくる点が面白い。", "unverified": "本文は入手できず、数値例と実証的な応用は確認できなかった。"}}, {"id": "pr14", "rank": 14, "headline": "輸送の構造を埋め込んだ作用素で多尺度流れを予測", "title": "PSTO: A PDE-structured transport operator with shared implicit updates for multiscale CDR systems", "url": "https://arxiv.org/abs/2611.25607", "authors": "Kaiwen Li ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Li, K., Zhou, D., Wu, K., & Lu, X. (2026). PSTO: A PDE-structured transport operator with shared implicit updates for multiscale CDR systems (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25607", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "arXiv版の本文（構成・基準モデル・効率と時間刻みの節・結論）を読んだ。付録の証明は読んでいない", "preprint": true, "p1": "対流・拡散・反応が結合した多尺度の系で、輸送（対流・拡散）だけを反応なしのデータから学ぶPDE構造の輸送作用素PSTOを作り、反応モデルと演算子分割で組み合わせて、3つの反応流の例で100ステップ後の誤差を最良のニューラル基準より50%以上下げた（抄録、§5）。未査読。", "p2": "多尺度の対流・拡散・反応（CDR）系は空間の輸送と局所の硬い反応が結合して計算が重い。従来のニューラル代理モデルは結合した高価な学習データを必要とし、パラメータ数が輸送される変数の数とともに増え、長い自己回帰の予測が不安定になりやすかった（抄録、§1）。", "p3": "速度・温度・化学種の輸送項は共通の対流・拡散の構造を持つ（式5）ので、1つの輸送ブロックを全変数で共有し、密度と輸送係数を条件として与える。各変数を点ごとの線形写像で潜在空間に持ち上げ、移流の枝（方向勾配×速度）と拡散の枝（係数で重みづけた流束の発散）からなるブロックを、緩和した固定点反復で繰り返して陰解法に近い更新を得る（§2.2）。解釈：陰解法の安定さを、反復の回数で調節できる近似として組み込んだ設計である。", "p4": "2次元の標準的なCDR系、Robertsonの対向流、水素の非予混合平面噴流火炎で、FNO・U-Net・U-FNOと同じデータと学習設定で比べ、100回の結合ステップ後の変数ごとの相対L2誤差、推論時間、時間刻みへの感度で評価した。基準解はOpenFOAMである（§2.5、§3.4、§4）。", "p5": "3例すべてで100ステップ後の平均誤差を最良の基準より50%以上下げた（§5）。平面噴流火炎ではPSTOは6.94秒で基準のニューラルモデル（1.74〜2.08秒）より遅いが、128のCPUで105.42秒かかるOpenFOAMの約15倍速く、U-FNOより終点の誤差を約51.9%下げた（§4.4.3、図9）。時間刻みを10倍にしても精度を保ち、基準のモデルは急速に精度を失った（§4.4.4）。", "p6": "解釈：輸送の構造を式として埋め込むので、対流・拡散の形が異なる系への拡張には改めて設計が要る。反復が推論の費用を増やすことは著者も示しており（§4.4.3）、検証は2次元の3例と限られた予測期間の範囲にとどまる。", "fun": "炎の計算では、熱や物質が「流れて広がる」動きと「化学反応で変わる」動きを同時に追う必要があり、とても重い。この研究は、流れて広がる部分だけをAIに覚えさせ、反応は別に計算して組み合わせた。燃えていないデータだけで学んだAIが、燃えている炎の予測にもそのまま使えた点が面白い。", "unverified": "反応モデルの学習の詳細と、付録の変数ごとの誤差（表C）の値は確認していない。"}}, {"id": "pr15", "rank": 15, "headline": "AI導入を支える橋渡し役の仕事を求人で分類", "title": "Facilitators &amp; Their Role in AI Adoption", "url": "https://doi.org/10.2139/ssrn.7713798", "authors": "Lindsey Lacey ほか", "venue": "SSRN", "date": "2026-11-20", "apa": "Lacey, L., Ferrone, D., Sinclair, J., & Combemale, C. (2026). Facilitators &amp; Their Role in AI Adoption. https://doi.org/10.2139/ssrn.7713798", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録）を使用。本文は入手できず", "preprint": true, "p1": "AIの導入と普及を支える「ファシリテーター（橋渡し役）」の層を、社会・技術・インフラの3つの領域に分けて定義し、S&P 500企業のAI関連の求人に当てはめて新しいAI職種を特定した（抄録）。未査読。", "p2": "AIは蒸気機関やインターネットのような汎用技術とみられるが、その普及は最先端を担う革新者や広く使う利用者だけでなく、両者をつなぐ人材に依存する。著者らの以前の「AI労働ピラミッド」では、この橋渡しの層が詳しく分析されていなかった（抄録）。", "p3": "AIを配備・統合して利用を可能にし、革新者と利用者の間を埋める労働者を、社会的・技術的・インフラ的な橋渡しの3領域で整理し、S&P 500企業による約9.4万件のAI関連求人に当てはめた（抄録）。", "p4": "求人を3領域に分類し、新しいAIの職種と部門ごとの導入戦略の違いを調べた（抄録）。抄録には分類の方法や評価の指標の詳細はない。", "p5": "導入の戦略は部門によって異なり、AI関連の職は社会・技術・インフラの明確な役割に分かれていた（抄録）。", "p6": "報告書の形式で、抄録からは分類の妥当性の検証や限界の記述は確認できない。解釈：求人は企業の意図を示すが、職場で実際にどう使われるかとは別であり、働く人の受け止め方との結びつきは残る疑問である。", "fun": "新しい技術が社会に広がるには、発明する人と使う人の間に「つなぐ人」が要る。電気が普及したときの電気工事士のような人たちだ。この研究は、AIでその役割を担う仕事を求人広告から拾い出し、人をつなぐ仕事、技術をつなぐ仕事、設備をつなぐ仕事に分けた。普及の主役は発明者だけではないという視点が面白い。", "unverified": "本文は入手できず、新しいAI職種の具体名と部門ごとの数値は確認できなかった。"}}, {"id": "pr16", "rank": 16, "headline": "交差的バイアス監査の誤検出を加法モデルで防ぐ", "title": "LLM GerryMandering: Separating Interactions from Additive Effects in LLM Audits", "url": "https://arxiv.org/abs/2611.26538", "authors": "George Rahul ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Rahul, G., Jahilal, R., Vedula, B. H., Kumaraguru, P., & Shukla, P. (2026). LLM GerryMandering: Separating Interactions from Additive Effects in LLM Audits (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26538", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMの交差的バイアスの監査で、単一の属性の効果を足しただけで生じる見かけの偏りと、本当の交互作用を区別する検定ADDISを提案した（抄録）。未査読。", "p3": "全属性の加法モデルを当てはめ、各部分集団の実際の値と加法モデルの予測との距離（ARD）をFreedman–Laneの帰無分布で検定する。交互作用のない150の合成データで標準の基準と比べた（抄録）。", "p5": "標準の基準はデータ当たり平均66.1の偽の部分集団を検出したが、ADDISは0.09で、仕込んだ交互作用の84%を回収した（標準は32%）。合成インド人ペルソナ1万件で13モデルを監査すると検出率は7.1%対3.0%で、性自認と性的指向の組合せが最大だった（抄録）。", "fun": "「女性で、しかも少数派」の人への扱いが悪いとき、それが2つの属性の効果の足し算なのか、組み合わさって特別に悪くなるのかで意味が違う。足し算で説明できる分を先に引いてから残りを調べると、偏りの多くは足し算で説明でき、本当の組合せの効果はごく一部だった。統計の基本をAIの監査に持ち込んだ点が面白い。", "unverified": "本文は入手できず、ARDの定義式と13モデルの内訳は確認できなかった。"}}, {"id": "pr17", "rank": 17, "headline": "路面の凹凸と電気自動車の電力消費の検証の穴", "title": "Pavement Characteristics and Energy Pathways in Battery-Electric Road Vehicles: A Critical Review of Measurement Boundaries and Validation Gaps", "url": "https://doi.org/10.20944/preprints202611.1892.v1", "authors": "Kulbir Singh", "venue": "Preprints.org", "date": "2026-11-20", "apa": "Singh, K. (2026). Pavement Characteristics and Energy Pathways in Battery-Electric Road Vehicles: A Critical Review of Measurement Boundaries and Validation Gaps. https://doi.org/10.20944/preprints202611.1892.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "路面の凹凸（IRI）や表面の性状と電気自動車のエネルギーの関係を報告した55件の文献を批判的に整理し、計測の境界と検証の不足のため、凹凸から電池のエネルギーへの統一的な係数は導けないと結論した（抄録）。未査読。", "p3": "体系的な選別ではなく既存の記録から集めた55件を、路面の条件、車種、エネルギーの計上範囲、測定か模擬か、検証の対象で比べた（抄録）。", "p5": "IRIが1 m/km増えると正規化エネルギーが3.4%増えるという報告は電池端の電力の直接測定ではなく、704%という数値は機械的な散逸の模擬値であるなど、研究ごとに測っている量が違うことを示した（抄録）。", "fun": "でこぼこ道を走ると電気自動車の電池は余計に減るのか。直感的にはそうだが、調べてみると研究ごとに「どこで測ったエネルギーか」がばらばらで、電池から出た電気を直接測った研究はほとんどなかった。同じ言葉で違うものを比べていないかを確かめる、検証の大切さが見える論文だ。", "unverified": "本文は入手できず、55件の内訳と各研究の数値の詳細は確認できなかった。"}}, {"id": "pr18", "rank": 18, "headline": "促進載荷試験の3次元FEで二輪タイヤと層間付着を評価", "title": "Finite Test Pit, Dual Tyres and Interlayer Bonding: A Verified Three-Dimensional Finite Element Analysis of a Circular Accelerated Pavement Testing Facility", "url": "https://doi.org/10.20944/preprints202611.1945.v1", "authors": "Silviu-Cristian Iriciuc ほか", "venue": "Preprints.org", "date": "2026-11-20", "apa": "Iriciuc, S.-C., Gimiga, G.-R., Dima, D.-N., Colț, O.-E., Boacă, G., Romila, C., Ungureanu, D., Onuțu, C., Scutaru, M.-C., & Țurcanu, F. E. (2026). Finite Test Pit, Dual Tyres and Interlayer Bonding: A Verified Three-Dimensional Finite Element Analysis of a Circular Accelerated Pavement Testing Facility. https://doi.org/10.20944/preprints202611.1945.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "円形の促進舗装載荷試験施設を3次元FEで再現し、有限の試験ピット、二輪タイヤ、層間の付着が応答に与える影響を、実測のひずみ・圧力・たわみと比べて定量化した（抄録）。未査読。", "p3": "ルーマニアのALT-LIRA施設（深さ1.8 mのコンクリートピット、57.5 kNの二輪荷重）の参照区間のFEモデルを、多層弾性理論と広い領域のモデルで検証し、106回の通過での実測と比べた（抄録）。", "p5": "FEはアスファルトのひずみを多層弾性理論と1%以内、路床のひずみを3%以内で再現したが、剛なピットで表面のたわみは広い領域より23%、多層弾性理論より29%小さかった。二輪で最大ひずみは6%下がり、層間のすべりで最大94%増えた（抄録）。", "fun": "道路の耐久性を調べるため、車輪をぐるぐる走らせる試験場がある。ところが試験場は深さ1.8 mのコンクリートの箱の中に作られていて、普通の計算式はその箱を無視していた。3次元で計算し直すと、箱のせいでたわみが2割以上小さく出ることが分かった。実験装置そのものが結果に与える影響を見逃さない点が面白い。", "unverified": "本文は入手できず、部分的な付着（μ = 0.5）の場合の比較の詳細は確認できなかった。"}}, {"id": "pr19", "rank": 19, "headline": "低価格湿度センサ48個を静的・動的に一括較正", "title": "A Traceable Single-Setup Procedure for Simultaneous Static and Dynamic Humidity Calibration: Demonstration on a Broad Range of 48 Commercial Low-Cost Sensors", "url": "https://doi.org/10.5194/egusphere-2026-6133", "authors": "Felix Witt ほか", "venue": "EGUsphere", "date": "2026-11-20", "apa": "Witt, F., & Ebert, V. (2026). A Traceable Single-Setup Procedure for Simultaneous Static and Dynamic Humidity Calibration: Demonstration on a Broad Range of 48 Commercial Low-Cost Sensors. https://doi.org/10.5194/egusphere-2026-6133", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "EGUsphere（査読前の議論用原稿）の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "低価格の相対湿度センサについて、トレーサブルな静的較正と動的な応答時間の評価を同じ装置・同じ測定期間で行う手順MetDyHuCalを示し、9機種48個に適用した（抄録）。未査読の議論用原稿。", "p3": "SI単位にトレーサブルな光学式の湿度計（波長可変レーザー吸収分光）を基準にする装置dynH2Oで、静的な偏りと非線形性、応答の時定数を測る（抄録）。", "p5": "機種ごとに大きな偏りと非線形性があり、応答時間はデータシートの値から−50%〜+81%ずれ、絶対湿度に依存する機種もあった。10個を5回付け外しして測った時定数τの再現性は相対標準偏差の中央値1.0%だった（抄録）。", "fun": "安い湿度センサは同じ型番でも1個ずつ癖が違い、しかも湿度の変化への反応の速さが説明書どおりではない。この研究は、ずれと反応の遅れを1つの装置でまとめて測る手順を作り、48個で試した。安い道具も測り方を整えれば信頼できる数字が出せるという点が面白い。", "unverified": "本文は入手できず、機種ごとの補正式と各機種の時定数の値は確認できなかった。"}}, {"id": "pr20", "rank": 20, "headline": "年次報告書で測るマーケティングの幅と企業価値", "title": "Marketing Breadth and Firm Value: A Contingency Approach", "url": "https://doi.org/10.2139/ssrn.7705518", "authors": "Didem Kurt ほか", "venue": "SSRN", "date": "2026-11-20", "apa": "Kurt, D., Grewal, D., & Kurt, A. C. (2026). Marketing Breadth and Firm Value: A Contingency Approach. https://doi.org/10.2139/ssrn.7705518", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "企業が年次報告書で言及するマーケティング概念の種類の数をマーケティングの幅としてテキストから測り、企業価値との関係を状況に応じて分析した（抄録）。未査読。", "p3": "年次報告書に現れる固有のマーケティング概念の数で幅を測り、マーケティング・製品市場・資本市場の成果で妥当性を確かめたうえで、ライフサイクルの段階や市場の動きを条件とするモデルで企業価値との関連を推定した（抄録）。", "p5": "平均的には幅が広いほど企業価値が高いが、その関連はライフサイクルの段階と市場の動きによって変わった（抄録）。", "fun": "広告も値引きも新商品もSNSも全部やる会社と、いくつかに絞る会社のどちらが得か。幅広くやれば機会は増えるが、経営者の注意が薄く広がる。年次報告書に出てくるマーケティングの言葉の種類を数えるという素朴な方法で、この問いを多くの企業で調べた点が面白い。", "unverified": "本文は入手できず、対象企業の数・期間と推定値は確認できなかった。"}}, {"id": "pr21", "rank": 21, "headline": "不祥事後の顧客回復策は予防の動機を弱める", "title": "Responsible Sourcing under Consumer Forgiveness: Prevention and Remediation", "url": "https://doi.org/10.2139/ssrn.7708158", "authors": "Ruoxin Gao ほか", "venue": "SSRN", "date": "2026-11-20", "apa": "Gao, R., & Yang, R. (2026). Responsible Sourcing under Consumer Forgiveness: Prevention and Remediation. https://doi.org/10.2139/ssrn.7708158", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "供給業者の違反が公表された後に顧客を取り戻す改善策（事後の救済）が、ブランドと供給業者の予防の動機にどう影響するかをゲーム理論のモデルで示した（抄録）。未査読。", "p3": "買い手（ブランド）の予防投資と供給業者の遵守努力が違反の確率を決め、違反が公表されると一切許さない消費者は去り、条件つきの消費者は救済投資に応じて戻るモデルを分析した（抄録）。", "p5": "救済がない場合に比べ、救済は供給業者の遵守努力を弱め、違反の確率を高めうる。遵守が不完全なら公表の確率を上げるほうが双方の予防を強め、救済費用の分担はかえって遵守を下げうる（抄録）。", "fun": "不祥事の後に謝罪とおわびで客を取り戻せるなら、そもそも不祥事を防ぐ努力が手抜きになるかもしれない。この研究は「許してもらえること」が予防を弱めるという逆説を数式で示した。事後の対策と事前の対策が打ち消し合いうる点が面白い。", "unverified": "本文は入手できず、モデルの仮定の詳細と数値例は確認できなかった。"}}, {"id": "pr22", "rank": 22, "headline": "論証の枠組みをLLMの判断に組み込む設計", "title": "Incorporating argumentation frameworks for LLM decision-making: Task-specific design and evaluation", "url": "https://arxiv.org/abs/2611.25361", "authors": "Bochen Han ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Han, B., Xiong, A., & Ma, M. (2026). Incorporating argumentation frameworks for LLM decision-making: Task-specific design and evaluation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25361", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "形式的な論証フレームワークをLLMの意思決定に組み込む既存手法を4段階の流れに整理し、討論型の意思決定と検索型の事実検証では一様に効かないことを示したうえで、課題に合わせた2つの手法を提案した（抄録）。未査読。", "p3": "討論資料の話者ごとに論証を整理し、モデルが推定した論証の強さを段階的意味論で集約するQnt-Argと、根拠の信頼度で衝突する証拠の優先関係を決め、基礎意味論で採用する証拠を選ぶQlt-Argを作った（抄録）。", "p5": "討論の設定ではQnt-Argが同じ条件の他の論証手法を一貫して上回り、Qlt-Argは検索型の事実検証の性能を基準より改善した（抄録）。", "fun": "議論を「主張」と「反論」の矢印の図にして、どの主張が生き残るかを数学的に決める方法がある。この研究は、それをAIの判断に組み込んでも作り方を課題に合わせないと効果がないことを示した。人の議論の整理術とAIを組み合わせる試みが面白い。", "unverified": "本文は入手できず、使用したLLMと性能差の数値は確認できなかった。"}}, {"id": "pr23", "rank": 23, "headline": "採点尺度の形でLLM評価者の点数が変わる", "title": "Same Judgement, Different Scores: Numerical Scoring Topology in LLM-as-a-Judge Evaluation", "url": "https://arxiv.org/abs/2611.26077", "authors": "Doyun Kim ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Kim, D., Kim, C., Kum, J., Song, M., & Park, C. (2026). Same Judgement, Different Scores: Numerical Scoring Topology in LLM-as-a-Judge Evaluation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26077", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMを評価者として使うときの採点尺度の設計（幅、刻み、ずらし、対称性、境界の位置）を「数値採点の位相」と定義し、それが点数・較正・頑健性を系統的に変えることを示した（抄録）。未査読。", "p3": "さまざまなベンチマークと評価者モデルで、ゼロショットのLLM評価者に異なる採点尺度を与えて比べた（抄録）。", "p5": "尺度の設計は特に判断の要る評価で点数・較正・頑健性に影響し、ずらした尺度や狭い尺度で点数の大きなずれが生じやすかった。大きく強い評価者モデルほど識別の妥当性が高く、尺度の変更に頑健だった（抄録）。", "fun": "同じ作文でも「1〜5点」で採点するか「0〜10点」で採点するかで、AIの付ける点が変わってしまう。この研究は、点数の物差しの形そのものが結果を左右することを体系的に確かめた。物差しの選び方も実験条件の一部だと気づかせる点が面白い。", "unverified": "本文は入手できず、使ったベンチマークと評価者モデルの名前、ずれの大きさは確認できなかった。"}}, {"id": "pr24", "rank": 24, "headline": "LLM評価者が人の代わりになるかを検定", "title": "AltRA-Test: An Alternative Annotator Test for LLM Judges Without Shared Annotators", "url": "https://arxiv.org/abs/2611.26073", "authors": "Nagham Omar ほか", "venue": "Hugging Face Daily Papers", "date": "2026-11-20", "apa": "Omar, N., Dror, R., Gueta, A., Gal, A., Reichart, R., & Calderon, N. (2026). AltRA-Test: An Alternative Annotator Test for LLM Judges Without Shared Annotators (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26073", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papers経由のarXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "LLMを人間の注釈者の代わりに使ってよいかを、項目ごとに注釈者が異なる場合でも判断できる統計的検定AltRA-Testを提案した（抄録）。未査読。", "p3": "項目を再標本化して各項目にk人分の人の注釈を引き、そのうち1人をLLMに置き換えた混合パネルと人だけのパネルを作り、混合パネルの注釈者間の一致が人だけのパネルに非劣性かを検定する（抄録）。", "p5": "漸近的に水準αの一致した検定であることを示し、18のLLMと5つのプロンプト法を20のデータセットで評価した。約100項目で足りることが多く、模擬では既存の手法より正しい置き換えの判断ができ、実データではLLMが約半数の設定で合格した（抄録）。", "fun": "人の採点をAIに任せてよいかを決めるには、「AIが人と同じくらい人と意見が合うか」を確かめればよい。この研究は、採点者が問題ごとに違う現実のデータでもその確認ができる方法を作った。AIの評価者を使う前の「資格試験」を作った点が面白い。", "unverified": "本文は入手できず、非劣性の幅の決め方と合格した課題の内訳は確認できなかった。"}}, {"id": "pr25", "rank": 25, "headline": "長文ペルソナを時間つきの記憶として評価", "title": "ChronoDossier: Long-Form Personas as Temporal Memory Representations", "url": "https://arxiv.org/abs/2611.25407", "authors": "Noah Sturgill ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Sturgill, N., & Choi, J. D. (2026). ChronoDossier: Long-Form Personas as Temporal Memory Representations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25407", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "長文のペルソナ資料を、変わらない身元と時期ごとの事実・習慣・判断規則の年表という既知の状態の記憶表現とみなし、記録と回答の誤りを分けて評価するベンチマークChronoDossierを作った（抄録）。未査読。", "p3": "日付つきの年表から7つの生成器で1k〜10k語の合成ペルソナ資料311件を作り、記録を意図した状態と照合する内在的な指標と、5つの読み手モデルが状態を回復できるかを測る外在的な指標で評価した（抄録）。", "p5": "証拠をそろえた比較で、該当する節全体を与えると「包装」の失敗はGPT-5.1で32件中29件、Sonnet 4.6で30件中25件が直ったが、回答形成の失敗は8件中2件と1件しか直らなかった（抄録）。", "fun": "長い人物設定をAIに渡してAIが間違えたとき、設定の書き方が悪いのか、AIの読み方が悪いのかが分からない。この研究は、正解の年表から資料を作ることでその2つを切り分けた。人物の「記憶」を検査できる形にした点が面白い。", "unverified": "本文は入手できず、7つの生成器の名前と内在的な指標の値は確認できなかった。"}}, {"id": "pr26", "rank": 26, "headline": "ペルソナは視覚言語モデルの視線にどこまで届くか", "title": "Persona Lenses: What Makes a Vision-Language Model See Through Its Persona's Eyes?", "url": "https://arxiv.org/abs/2611.25508", "authors": "Yoonho Shin", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Shin, Y. (2026). Persona Lenses: What Makes a Vision-Language Model See Through Its Persona's Eyes? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25508", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "プロンプトに与えたペルソナが、視覚言語モデル（VLM）のウェブページ上の模擬視線にどこまで反映されるかを測り、ペルソナを効かせる3つの方法（レンズ）を比べた（抄録）。未査読。", "p3": "単一の属性だけが違う2つのペルソナの視線の差を効き具合とし、ペルソナの関心を先に書かせる文章レンズ、関心の領域に印を付ける画素レンズ、視線の滞留に報酬を与える重みレンズを、Qwen3-VL（4B・32B）とQwen3.5-9Bで比べた（抄録）。", "p5": "文章レンズはペルソナを強く分けるが視線に無関係な属性の変更にも反応し、画素レンズは分け方が弱いが無関係な属性に影響されなかった。4B・9Bでは重みレンズが学習外の関心でもペルソナを分け、32Bは基本のプロンプトだけで分けた（抄録）。", "fun": "「あなたは料理好きの高齢者」とAIに伝えると、AIはウェブページの料理の記事を見るようになるのか。この研究は、人物設定がAIの「視線」にどこまで届くかを測り、効かせ方を3通り比べた。なりきらせる技術を、目の動きという客観的な量で調べた点が面白い。", "unverified": "本文は入手できず、各レンズの効き具合の数値は確認できなかった。"}}, {"id": "pr27", "rank": 27, "headline": "6つのLLMの面接コーディングの一致と誤り", "title": "Can Nurse Researchers Rely on Large Language Models for Interview Coding? Lessons From a Comparative Study of Six Models Coding Chinese-Language Interviews (Preprint)", "url": "https://doi.org/10.2196/preprints.117124", "authors": "Mingjie Wu ほか", "venue": "JMIR Preprints", "date": "2026-11-20", "apa": "Wu, M., LIu, H., Yang, S., Liao, M., Kuang, l., Liang, Y., Zhang, J., & Hu, Z. (2026). Can Nurse Researchers Rely on Large Language Models for Interview Coding? Lessons From a Comparative Study of Six Models Coding Chinese-Language Interviews (Preprint). https://doi.org/10.2196/preprints.117124", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "JMIR Preprintsの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "複数のLLMの設定が同じ演繹的なコードブックで中国語の患者面接を符号化した結果を比べ、看護研究者が提案されたコードを採用する前に確かめるべき点を示した（抄録）。未査読。", "p3": "DeepSeek・Qwen・Kimi・ChatGPT・Claude・Geminiに112コードのコードブックを18件の面接に適用させ、FleissとCohenのκで一致を測り、文化に埋め込まれた19コードの一致、欠落と重複、引用の出所を確かめた（抄録）。", "p5": "モデル間の一致は中程度（Fleiss κ=0.60、95%CI 0.56–0.63）で、少なくとも1つのモデルが該当とした870組のうち全モデルが一致したのは205組（23.6%）だった。検証可能な引用2,845件のうち102件（3.6%）は面接者の発言や別の記録に一致するか、見つからなかった（抄録）。", "fun": "面接の記録に「これは家族の協力の話」などの見出しを付ける作業をAIに任せると、AI同士の意見は中くらいにしか一致しなかった。しかもAIが根拠として示した引用には、話し手を取り違えたものも混じっていた。AIの下書きは便利でも、最後の判断を人が持つべき理由が具体的に見える点が面白い。", "unverified": "本文は入手できず、モデルごとの一致度と面接の内容の詳細は確認できなかった。"}}, {"id": "pr28", "rank": 28, "headline": "AIエージェントの社会を独自の研究対象に", "title": "Toward a Science of AI Agent Societies", "url": "https://arxiv.org/abs/2611.25404", "authors": "Geon Lee ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Lee, G., Bu, F., Lee, S. Y., Kim, S., & Shin, K. (2026). Toward a Science of AI Agent Societies (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25404", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "AIエージェントが互いに大規模に相互作用する「AIエージェント社会」を、個々のエージェントの集まりとも人間社会の模擬とも異なる独自の研究対象とすべきだと論じる立場表明（抄録）。未査読。", "p3": "妥当なAIエージェント社会が満たすべき性質として、個別の目的、規則と統治、自律性、規模と複雑さを提案し、研究すべき行動として経済的行動、利害対立下の行動、危険・非倫理的な行動、システム全体の行動を挙げた（抄録）。", "p5": "既存のマルチエージェントシステムがこれらの性質の一部しか満たしていないことを示し、性質の母数化や両立などの技術的課題と、プラットフォームの設計・評価・統治への含意を論じた（抄録）。", "fun": "AI同士が取引したり、交渉したり、だまし合ったりする「AIの社会」が生まれつつある。それは人間社会の縮小模型でも、単なるプログラムの集まりでもない新しい研究対象だ、という主張だ。社会学の問いがAIの世界にも生まれる、という発想の転換が面白い。", "unverified": "立場表明の論文で実証データはない。本文は入手できず、既存システムの比較の詳細は確認できなかった。"}}, {"id": "pr29", "rank": 29, "headline": "知識に公正に向き合う態度を測る9項目尺度", "title": "The Intellectual Justice Scale: Measuring How Fairly People Engage With Knowledge", "url": "https://doi.org/10.31234/osf.io/buhyd", "authors": "Yara Daamen ほか", "venue": "PsyArXiv", "date": "2026-11-20", "apa": "Daamen, Y., Sikimić, V., & Lakens, D. (2026). The Intellectual Justice Scale: Measuring How Fairly People Engage With Knowledge. https://doi.org/10.31234/osf.io/buhyd", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "知識とその生産者に公正に向き合う傾向（知的正義）を測る9項目の自己報告尺度を、フリッカーの認識的不正義の枠組みに基づいて開発・検証した（抄録）。未査読。", "p3": "専門家の検討と予備調査で項目を絞り、研究1（N = 404）の探索的因子分析と研究2（N = 401）の確認的因子分析で、証言的正義・解釈的正義・知的行動の3因子を検証した（抄録）。", "p5": "探索的因子分析で3因子構造が支持され、統計的・概念的に独立に選んだ項目が同じ9項目に収束した。確認的因子分析で良好な適合を示し、知的謙虚さ・性格特性・社会的正義の態度と予想どおりに関連しつつ区別できた（抄録）。", "fun": "人の話を「若いから」「訛りがあるから」と割り引いて聞くことは、知識をめぐる不公正の一種だ。この研究は、そうした態度を9つの質問で測るものさしを作った。哲学の概念を、統計で確かめられる尺度に落とし込んだ点が面白い。", "unverified": "本文は入手できず、9項目の文言と適合度の値は確認できなかった。"}}, {"id": "pr30", "rank": 30, "headline": "世帯の豊かさは家族のつながりを通じ死亡を減らすか", "title": "Networked wealth and mortality in the Agincourt Health and Demographic Surveillance System, 2009--2018", "url": "https://arxiv.org/abs/2611.25337", "authors": "Keletso Makofane ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Makofane, K., Tchetgen, E. T., Bassett, M. T., & Berkman, L. F. (2026). Networked wealth and mortality in the Agincourt Health and Demographic Surveillance System, 2009--2018 (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25337", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "南アフリカのアジンコート人口動態監視システムのデータで、世帯の資産が家族のネットワークを通じて他の世帯の死亡にも波及するかを推定した（抄録）。未査読。", "p3": "2009〜2018年のコホートデータで、世帯資産の死亡への平均総効果（ATE）を、自世帯への直接効果（ADE）と家族ネットワークを通じた波及効果（ASE）に分け、全死亡・5歳未満・15〜59歳・60歳以上で別々に推定した（抄録）。", "p5": "期間中に8,750人が死亡した。資産の1標準偏差の増加でATEは−0.61%（95%CI −0.74〜−0.48）、ADEは−0.53%、ASEは−0.08%（P = 0.075）だった。早死では波及効果が−0.08%（95%CI −0.15〜0.00、P = 0.038）だった（抄録）。", "fun": "親戚にお金持ちがいると、自分の家の健康も守られるのだろうか。この研究は、家族のつながりをたどって、ある家の豊かさが別の家の死亡を減らす「おすそ分け」の効果を測った。早死にについては、その効果が小さいながら見えた点が面白い。", "unverified": "本文は入手できず、家族ネットワークの定義と推定の識別の仮定は確認できなかった。"}}, {"id": "pr31", "rank": 31, "headline": "差分プライバシーで表データを合成し文脈学習", "title": "PriTabICL: Differentially Private Tabular In-Context Learning with Task-Aligned Cluster-Wise Synthesis", "url": "https://arxiv.org/abs/2611.25073", "authors": "Syed Ahzaz Shah ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Shah, S. A., Bramblett, E., Arcolezi, H. H., Gong, C., Tong, Q., & Li, X. (2026). PriTabICL: Differentially Private Tabular In-Context Learning with Task-Aligned Cluster-Wise Synthesis (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25073", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "個人情報を含む表データを差分プライバシーで合成し、LLMの表の文脈内学習（TabICL）の例として使う枠組みPriTabICLを提案した（抄録）。未査読。", "p3": "記録を差分プライバシーの下でクラスタに分けて各クラスタを独立に合成し、特徴と目的変数の関係を優先する固定の集計で予測に重要な統計を保つ。推論時は質問をクラスタに振り分け、その合成データから例を取る（抄録）。", "p5": "4つの実データで有効性を示し、PriTabICL-PrivSynは全体を一度に合成するPrivSynを12設定中8設定で上回り、既存の私的なTabICLの手法をほぼすべての設定で上回った（抄録）。", "fun": "AIに表のデータの例を見せて予測させたいが、例そのものに個人情報が含まれている。そこで、似た人同士のグループごとに「本物そっくりだが本物ではない」データを作って見せる。全体を一度に真似るより、グループごとに真似るほうが少数派の特徴が残る点が面白い。", "unverified": "本文は入手できず、使った4つのデータセットとプライバシー予算の値は確認できなかった。"}}, {"id": "pr32", "rank": 32, "headline": "社会会計行列で見る生産連関と資本所得のずれ", "title": "Production Resilience and Capital-Income Divergence in Türkiye's Textile, Apparel and Leather Complex: Evidence from 26 Annual Social Accounting Matrices, 2000-2025", "url": "https://doi.org/10.2139/ssrn.7706023", "authors": "Kamil Taşcı", "venue": "SSRN", "date": "2026-11-20", "apa": "Taşcı, K. (2026). Production Resilience and Capital-Income Divergence in Türkiye’s Textile, Apparel and Leather Complex: Evidence from 26 Annual Social Accounting Matrices, 2000-2025. https://doi.org/10.2139/ssrn.7706023", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "トルコの2000〜2025年の26年分の社会会計行列で、繊維・衣料・皮革産業の強い生産連関が、資本所得の波及の強さと一致するかを調べた（抄録）。未査読。", "p3": "生産要素・家計・企業を介したフィードバックを分ける3つの入れ子の勘定の区分で乗数を計算し、資本所得の順位と産出の順位の差（ギャップ）を年ごとに求めた（抄録）。", "p5": "家計・企業を含む産出乗数は12.8%低下し、59部門の中央値の11.7%に近かった。主な発見は生産と資本所得の順位のずれで、全部門でのギャップの年平均の百分位は92.8、製造業19部門では26年中22年でギャップが正だった（抄録）。", "fun": "ある産業が他の産業から部品をたくさん買うと、経済全体の生産は大きく増える。しかし、その結果生まれた利益が誰の手に渡るかは別の話だ。生産のつながりの強さと、お金の行き先の強さが一致しないことを、国の会計表で示した点が面白い。", "unverified": "本文は入手できず、各年のギャップの値と推定の詳細は確認できなかった。"}}, {"id": "pr33", "rank": 33, "headline": "AI導入は全要素生産性を高めたか：国際比較", "title": "Separating AI from Capital: Identifying the Productivity Contribution of Artificial Intelligence across Countries and Sectors", "url": "https://doi.org/10.21203/rs.3.rs-11599318/v1", "authors": "Syed M. Abdullah ほか", "venue": "Research Square (In Review)", "date": "2026-11-20", "apa": "Abdullah, S. M., & Seja, M. E. (2026). Separating AI from Capital: Identifying the Productivity Contribution of Artificial Intelligence across Countries and Sectors. https://doi.org/10.21203/rs.3.rs-11599318/v1", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "企業のAI導入が全要素生産性（TFP）を高めたのか、それとも資本の深化と労働の増加を映しているだけなのかを、国・年のパネルで分けて推定した（抄録）。未査読。", "p3": "PWT 10.01と世界銀行の投資データで成長会計の残差（TFP成長）を計算し、OECDの企業調査のAI利用率と国・年の固定効果で関連づけた。内生性には2010年のブロードバンド普及と他国のAI普及を組み合わせたシフトシェア操作変数を使った（抄録）。", "p5": "同時点の効果は検出されず、固定効果の推定値は導入率1ポイント当たり0.005ポイント（p = 0.93）、2SLSは0.153（p = 0.42）だった。1年・2年のラグの点推定は大きいが不正確で、36か国102観測と検出力は限られる（抄録）。", "fun": "AIを使う会社が増えると国の生産性は上がるのか。この研究は、機械や人手が増えた分を差し引いたうえで調べたが、今のところ効果ははっきり見えなかった。新しい技術の効果は遅れて現れることが多く、「まだ分からない」ことを正直に示した点が面白い。", "unverified": "本文は入手できず、部門別の設計の結果と操作変数の第1段階の強さは確認できなかった。"}}, {"id": "pr34", "rank": 34, "headline": "ジャカルタLRT補助金の説明責任と透明性", "title": "Analysis of Accountability and Transparency in Local Government Subsidy Management for Jakarta LRT Operations: Evidence from 2024 Financial and Operational Reports", "url": "https://doi.org/10.2139/ssrn.7713938", "authors": "Siti Naila Sari", "venue": "SSRN", "date": "2026-11-20", "apa": "Naila Sari, S. (2026). Analysis of Accountability and Transparency in Local Government Subsidy Management for Jakarta LRT Operations: Evidence from 2024 Financial and Operational Reports. https://doi.org/10.2139/ssrn.7713938", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "ジャカルタ州政府による2024年度のジャカルタLRTの運営補助金の管理を、説明責任と透明性の観点から文書で分析した（抄録）。未査読。", "p3": "規則、州政府の財務諸表、運営会社PT LRT Jakartaの年次報告書を対象にした質的・記述的な文書分析である（抄録）。", "p5": "補助金の管理には規則の根拠と財務報告・内部監督・サービス評価の仕組みがあるが、補助金の協定や使途の詳細、監視・評価の結果が十分に公開されず、州と会社の報告範囲の違いで資金の流れを完全には追えないことを示した（抄録）。", "fun": "電車の運行に税金の補助が入るとき、そのお金がどう使われたかを市民が追えるかどうかは大事だ。役所の決算と会社の報告書を突き合わせると、両者の範囲が違うために途中で流れが見えなくなる場所があった。会計の「つなぎ目」に透明性の穴があるという指摘が面白い。", "unverified": "本文は入手できず、補助金の金額と具体的な開示項目は確認できなかった。"}}, {"id": "pr35", "rank": 35, "headline": "ドローン群で道路網を能動的に観測する強化学習", "title": "SenseAlign: Learning Decision-Aligned Predictive Representations for Active Urban Sensing with UAVs", "url": "https://arxiv.org/abs/2611.26109", "authors": "Weijiang Xiong ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Xiong, W., & Geroliminis, N. (2026). SenseAlign: Learning Decision-Aligned Predictive Representations for Active Urban Sensing with UAVs (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26109", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "道路網を観測するドローン群の配置を強化学習で決める際に、将来の交通状態の予測表現を意思決定に合うように学習する枠組みSenseAlignを提案した（抄録）。未査読。", "p3": "将来の真の交通状態を使える特権的な教師エージェントを先に学習し、生徒エージェントには部分観測から将来の交通を予測する補助の枝を持たせ、真の将来と予測した将来の下での教師の行動分布を一致させて潜在空間を形づくる（抄録）。", "p5": "1,570の道路区間を持つバルセロナ中心部の実際の道路網で、複数の効用の定式化について基準手法を一貫して上回った。推論時の追加の計算はない（抄録）。", "fun": "渋滞を見張るドローンをどこに飛ばすかは、これから道路がどうなるかの予想次第だ。この研究は、まず「未来が見える先生役のAI」に飛ばし方を学ばせ、未来が見えない生徒役のAIにまねさせた。予測を当てることより、良い判断に役立つ予測を学ばせる点が面白い。", "unverified": "本文は入手できず、基準手法との差の数値は確認できなかった。"}}, {"id": "pr36", "rank": 36, "headline": "道路工事の契約変更を発生・金額・重要性で分析", "title": "An Outcome-Differentiated Assessment of Highway Contract Modifications: Occurrence, Financial Magnitude, and Materiality", "url": "https://doi.org/10.20944/preprints202611.1862.v1", "authors": "Malek Alazzam ほか", "venue": "Preprints.org", "date": "2026-11-20", "apa": "Alazzam, M., & Harahsheh, K. (2026). An Outcome-Differentiated Assessment of Highway Contract Modifications: Occurrence, Financial Magnitude, and Materiality. https://doi.org/10.20944/preprints202611.1862.v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "道路工事の契約変更の記録を、事務的な変更の発生、金額の増加、落札額に対する重要性という別々の結果に分け、それぞれと落札額の関係を推定した（抄録）。未査読。", "p3": "ケンタッキー州交通局の調達記録と承認された変更指示を照合し、通常の道路工事契約2,494件の契約後730日間を、請負業者でクラスタ化したモデルで分析した（抄録）。", "p5": "落札額が2倍になると金額増の変更が起きるオッズ比は1.381（95%CI 1.292–1.476）、増額のある835件では増額の総額が1.568倍になった。一方、落札額の5%を超える正味の増加とは明確な関連がなかった（オッズ比1.014）（抄録）。", "fun": "工事の契約は途中で何度も変更されるが、「変更が多い」ことと「金額が大きく膨らむ」ことは別の問題だ。大きな工事ほど増額の変更は起きやすいが、予算に対して大きく膨らむわけではなかった。数字の取り方で見える景色が変わることを示した点が面白い。", "unverified": "本文は入手できず、非線形の分析と請負業者の影響の分析の結果は確認できなかった。"}}, {"id": "pr37", "rank": 37, "headline": "異種センサを融合した都市気温のベイズ推定", "title": "BRUCE (Bayesian Rio Urban Climate Estimator): spatiotemporal interpolation of air temperature from heterogeneous sensor networks for operational heat monitoring", "url": "https://arxiv.org/abs/2611.26612", "authors": "Ayrton Sena Gouveia ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Gouveia, A. S., de Oliveira, R. S., Menezes-Silva, L., Castillo, M. A. M., Marincola, F. de C. V., Morais, J. H. de A., Saraceni, V., Aguilar, G. M. O., Ferreira, C. D., & Cruz, O. G. (2026). BRUCE (Bayesian Rio Urban Climate Estimator): spatiotemporal interpolation of air temperature from heterogeneous sensor networks for operational heat monitoring (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26612", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "公式の気象観測点、低価格のIoTセンサ、市民の個人気象観測、再解析の4種類の気温データを融合し、リオデジャネイロの都市内の気温を連続的に推定するベイズ階層時空間モデルBRUCEを示した（抄録）。未査読。", "p3": "INLAとSPDEの空間成分で当てはめ、データの種類と観測点ごとの測定の偏りを考慮し、日ごとにAR(1)で変化する連続の空間場を推定した。2023〜2025年の9つの月の窓に独立に当てはめた（抄録）。", "p5": "標高の係数はすべての窓で有意で、8つの窓で1標準偏差当たり−1.08〜−1.38℃と安定していた。地域を除く交差検証で既存のLCZ4rと同程度の精度で、241のプライマリケア地区のうち96を高い信頼度で分類できた（抄録）。", "fun": "都市の暑さを細かく知りたいが、公式の温度計は少ない。そこで安いセンサや市民の温度計も使いたいが、それぞれ癖がある。この研究は、測り方ごとの癖を見積もりながら混ぜ合わせ、どの地区が暑いかを確率つきで示した。質の違うデータを捨てずに使い切る点が面白い。", "unverified": "本文は入手できず、各データ源の偏りの推定値と観測点の数は確認できなかった。"}}, {"id": "pr38", "rank": 38, "headline": "民泊の密度と長期家賃の非線形な関係", "title": "From Pressure to Saturation: A Multilevel Analysis of Short-Term Rental Density and Long-Term Rents in Colombia", "url": "https://doi.org/10.21203/rs.3.rs-11324911/v1", "authors": "Sergio A. Barona-Montoya ほか", "venue": "Research Square (In Review)", "date": "2026-11-20", "apa": "Barona-Montoya, S. A., Castellanos, A. A., & Niño, A. L. (2026). From Pressure to Saturation: A Multilevel Analysis of Short-Term Rental Density and Long-Term Rents in Colombia. https://doi.org/10.21203/rs.3.rs-11324911/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "コロンビアの18の主要都市で、民泊（短期賃貸）の密度と長期の賃貸住宅の家賃の関係を、住戸と都市の2層のモデルで分析した（抄録）。未査読。", "p3": "ウェブから収集した6,803件の賃貸物件を都市ごとに入れ子にし、民泊市場の指標と国勢調査・家計調査の都市の特性と組み合わせた2層の多層モデルを推定した（抄録）。", "p5": "家賃の対数の分散の約17%が都市間の差だった。民泊の密度（住宅100戸当たりの稼働物件数）は家賃と正だが非線形に関連し、平均より100戸当たり3件多い水準を超えると関連が弱まり反転した。高所得の地区ほど低い密度で家賃が頭打ちになった（抄録）。", "fun": "観光客向けの民泊が増えると、地元の人の家賃は上がるのか。調べると、ある程度までは上がるが、増えすぎると逆に下がり始めた。市場がいっぱいになる「飽和」の兆しかもしれない。単純な「増えれば上がる」ではない関係を示した点が面白い。", "unverified": "本文は入手できず、都市ごとの推定値と労働市場の変数の定義は確認できなかった。"}}, {"id": "pr39", "rank": 39, "headline": "顧客情報が一部だけでも個別化の価値は取れる", "title": "Personalized Service Design", "url": "https://doi.org/10.2139/ssrn.7715578", "authors": "Bogyeom Lee ほか", "venue": "SSRN", "date": "2026-11-19", "apa": "Lee, B., Ahn, H.-S., & Uichanco, J. (2026). Personalized Service Design. https://doi.org/10.2139/ssrn.7715578", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "規制や個人情報の配慮で顧客情報の一部しか使えないとき、どの種類の顧客情報が個別化したサービスと価格の設計に価値を持つかを理論的に示した（抄録）。未査読。", "p3": "基本の製品と個別化した追加サービスを売る企業で、顧客が基本の評価額と追加サービスへの感度の2つの連続的な属性で異なるモデルを作り、両方・片方・どちらも観測できない場合の最適な価格とサービス水準を導いた（抄録）。", "p5": "利益を主に生む属性を観測できれば片方だけでもほぼ最適な利益が得られる。追加サービスへの感度はサービス水準と追加の価値の両方を決めるため、基本製品が主な利益源でも基本の評価額より価値が高いことがあり、粗い情報でも正確な情報の利益のかなりの部分が残る（抄録）。", "fun": "お客さんのことを全部知らなくても、うまくおもてなしはできるのか。この研究は、本体の商品にいくら払うかより、オプションをどれだけ気にするかを知るほうが個別のサービス作りに役立つ場合があることを示した。全部を集めず、何を知るべきかを選ぶ発想が面白い。", "unverified": "本文は入手できず、利益の差の具体的な数値例は確認できなかった。"}}, {"id": "pr40", "rank": 40, "headline": "インフルエンサー同士の評価の競争は売り手に得か", "title": "When Does Influencer Competition Benefit Sellers? Perceived Quality and Consumer Segmentation", "url": "https://doi.org/10.2139/ssrn.7707959", "authors": "Wentao Lu ほか", "venue": "SSRN", "date": "2026-11-20", "apa": "Lu, W., & Li, W. (2026). When Does Influencer Competition Benefit Sellers? Perceived Quality and Consumer Segmentation. https://doi.org/10.2139/ssrn.7707959", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "発売価格を決めた後に、異なる読者層と評価基準を持つ独立したインフルエンサーがレビューを出すとき、2人目のインフルエンサーが売り手に得になる条件を理論モデルで示した（抄録）。未査読。", "p3": "消費者がインフルエンサーへの印象をもとに読むレビューを選んで解釈し、競合するインフルエンサーが異なる評価基準を選ぶモデルを分析した（抄録）。", "p5": "2つのレビューは楽観的な読者と懐疑的な読者の購買の信念を逆向きに動かし、同じ到達範囲でも市場の半分未満では高い価格、半分を超えると低い価格を支えた。期待品質が一意の閾値より低いと2人、高いと1人のほうが売り手の利益が大きかった（抄録）。", "fun": "新商品を2人のインフルエンサーが紹介すると、売れ行きは良くなるのか。甘口と辛口の2人がいると読者が楽観派と慎重派に分かれ、売り手の得になるかは商品の品質への期待次第だった。口コミは「多ければ良い」とは限らないことを示した点が面白い。", "unverified": "本文は入手できず、閾値の式とモデルの仮定の詳細は確認できなかった。"}}, {"id": "pr41", "rank": 41, "headline": "予測可能な非線形力学は時間方向に並列化できる", "title": "Predictable Nonlinear Dynamics can be Efficiently Parallelized in Time", "url": "https://doi.org/10.52843/cassyni.ngydcc", "authors": "Leo Kozachkov", "venue": "Data-Driven Science and Engineering Seminars", "date": "2026-11-19", "apa": "Kozachkov, L. (2026). Predictable Nonlinear Dynamics can be Efficiently Parallelized in Time. https://doi.org/10.52843/cassyni.ngydcc", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "セミナー講演の要旨（Crossrefに登録、候補の収集時に取得）を使用。論文の本文はない", "preprint": true, "short": true, "p1": "安定な非線形力学系の時間発展の評価を並列に解ける最適化問題に書き直し、系の予測可能性がその解きやすさを決めることを示すという研究の講演要旨（抄録）。未査読。", "p3": "時間発展の評価を最適化問題として定式化し、それがポリャク–ウォヤシェビッチ（勾配優越）条件を満たすこと、その条件数が小さな摂動が将来の軌道に与える影響（予測可能性）で決まることを示すとする（抄録）。", "p5": "予測可能な系では条件の良い最適化問題になり逐次計算より評価時間を大きく減らせる一方、カオス的な系では並列の評価が実用的でないとし、MCMCの時間方向の並列化などの例を示すとする（抄録）。", "fun": "時間の流れに沿う計算は、前の答えが出ないと次に進めないので、並列計算機の力を生かしにくい。この研究は、未来が予測しやすい系なら全時刻を同時に解けることを示すという。カオスのように予測しにくい系では並列化も難しいという対応関係が面白い。", "unverified": "セミナーの講演要旨で、論文の本文や数値の結果は確認できなかった。"}}, {"id": "pr42", "rank": 42, "headline": "注入誘発地震を3つの時間尺度の競合で分類", "title": "Interplay of Pressure Rate, Hydraulic Diffusivity, and Frictional Nucleation Controls Injection-induced Earthquakes", "url": "https://doi.org/10.22541/essoar.15002509/v3", "authors": "Wenzhuo Cao ほか", "venue": "ESS Open Archive", "date": "2026-11-19", "apa": "Cao, W., & Ma, T. (2026). Interplay of Pressure Rate, Hydraulic Diffusivity, and Frictional Nucleation Controls Injection-induced Earthquakes. https://doi.org/10.22541/essoar.15002509/v3", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "ESS Open Archive（プレプリント）の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "流体の注入による誘発地震の規模と頻度が、流体の加圧・水理拡散・摩擦による核形成の3つの時間尺度の競合でどう決まるかを、水理・力学・摩擦の連成モデルで示した（抄録）。未査読。", "p3": "速度・状態依存の摩擦に従う急傾斜の封鎖性断層に隣接する貯留層への注入を模擬し、断層の摩擦母数、加圧速度、水理拡散率を変えて誘発地震の挙動を調べた（抄録）。", "p5": "規模と頻度は断層の摩擦母数が支配し、加圧速度と拡散率がそれを調整した。核形成の時間で正規化した加圧速度と拡散率で4つの領域に分かれ、正規化した断層の加圧速度が大きいほど最大の規模は小さく、地震の数は多くなった（抄録）。", "fun": "地下に水を押し込むと地震が起きることがある。この研究は、水を押す速さ、水が広がる速さ、断層が滑り始めるまでの時間という3つの「時計」の比べ合いで、起きる地震の大きさと数が決まることを示した。速く押すと小さな地震が多く大きな地震が出にくいという結果が意外で面白い。", "unverified": "本文は入手できず、4つの領域の境界の値と摩擦母数の範囲は確認できなかった。"}}, {"id": "pr43", "rank": 43, "headline": "林道が斜面崩壊の危険域を大きく広げる", "title": "Modeling Logging Road Landslide Hazards Under Changing Environmental Conditions", "url": "https://doi.org/10.22541/essoar.15012476/v1", "authors": "Sebastian Yerex ほか", "venue": "ESS Open Archive", "date": "2026-11-19", "apa": "Yerex, S., Kwoll, E., Geertsema, M., & Ward, S. (2026). Modeling Logging Road Landslide Hazards Under Changing Environmental Conditions. https://doi.org/10.22541/essoar.15012476/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "ESS Open Archive（プレプリント）の抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "リモートセンシング由来のデータだけで、林道が浅い斜面崩壊の感受性に与える影響と母数の不確実性を考慮する物理ベースのモデルを作り、気候変動と山火事の条件で評価した（抄録）。未査読。", "p3": "林道が水文、斜面形状、土層厚に与える影響を体系的に扱う枠組みを導入し、カナダ・ブリティッシュコロンビア州の気候の異なる2地点で、CMIP6の降雨予測と山火事の焼損度のデータを使って林道の有無の感受性を推定した（抄録）。", "p5": "地域全体では、林道は現在の気候で浅い斜面崩壊が起きやすい面積を最大18.9倍に広げ、将来の降雨の影響を最大7%、山火事の影響を最大25%強めた（抄録）。", "fun": "森の中に道を1本通すだけで、山崩れの起きやすい場所はどれだけ増えるのか。この研究は、衛星などのデータだけで計算できる方法を作り、林道があると崩れやすい面積が最大18.9倍になると見積もった。雨の増加や山火事との「掛け算」まで評価した点が面白い。", "unverified": "本文は入手できず、2地点の名前と感受性の閾値の設定は確認できなかった。"}}, {"id": "pr44", "rank": 44, "headline": "欠陥のある軸受の滑りと衝撃の連成振動", "title": "Coupled skidding–impact dynamics of angular contact ball bearings with localized outer ring defects under elastohydrodynamic lubrication", "url": "https://doi.org/10.5194/ms-2026-201", "authors": "Baiwei Xue ほか", "venue": "Dynamics and control/Mathematical modeling and analysis", "date": "2026-11-20", "apa": "Xue, B., Lei, C., Ren, G., Jia, M., Zhao, W., & Zhang, X. (2026). Coupled skidding–impact dynamics of angular contact ball bearings with localized outer ring defects under elastohydrodynamic lubrication. https://doi.org/10.5194/ms-2026-201", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "査読前の議論用原稿とみられる記録の抄録（Crossref、候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "外輪に局所的な欠陥のあるアンギュラ玉軸受で、欠陥の縁での衝撃と転動体の滑りの連成が、弾性流体潤滑の下で振動応答に与える影響を4自由度の動力学モデルで調べた（抄録）。", "p3": "欠陥による励振を時間依存の変位関数で表し、ヘルツ接触と潤滑膜の剛性を合わせた有効剛性、内外輪に対する滑り速度、欠陥の境界での速度変化に伴う摩擦力を運動方程式に組み込んだ（抄録）。", "p5": "スピン運動は振幅を下げ、弾性流体潤滑は振動を大きく減衰させた。回転数が上がると故障の特徴周波数と振幅が上がり、滑りは特徴周波数を下げつつ振動を強めた。欠陥の縁の衝撃を入れると、滑りだけの場合より特徴周波数が高くなった（抄録）。", "fun": "回転機械のベアリングに小さな傷があると、玉が傷を通るたびに衝撃が出て、その間隔から傷を見つけられる。ところが玉が少し滑ると、その間隔がずれる。滑りと衝撃という2つの効果がどう重なるかを、油の膜まで含めて計算した点が面白い。", "unverified": "本文は入手できず、特徴周波数のずれの大きさと査読の状況は確認できなかった。"}}, {"id": "pr45", "rank": 45, "headline": "拡張カルマンフィルタにNN補正を加えたSOC推定", "title": "Hybrid Physics-Informed and Data-Driven State-of-Charge Estimation for Lithium-Ion Batteries Under Varying Temperature: A Simulation-Based Study", "url": "https://doi.org/10.20944/preprints202611.1859.v1", "authors": "Misker Shumeye ほか", "venue": "Preprints.org", "date": "2026-11-20", "apa": "Shumeye, M., Yoseph, E., & Adane, K. (2026). Hybrid Physics-Informed and Data-Driven State-of-Charge Estimation for Lithium-Ion Batteries Under Varying Temperature: A Simulation-Based Study. https://doi.org/10.20944/preprints202611.1859.v1", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "温度が変わる条件でのリチウムイオン電池の充電状態（SOC）の推定で、拡張カルマンフィルタ（EKF）の観測方程式にニューラルネットの電圧残差の補正を加えた混合法を、物理型・データ駆動型の推定器と模擬で比べた（抄録）。未査読。", "p3": "推定器より詳しい真のモデル（ヒステリシス、温度依存の抵抗と容量、自己発熱、センサの偏りと雑音など）を持つ模擬電池で、電流積算、25℃で同定したEKF、温度でスケジュールしたEKF（EKF-TS）、ニューラルネット、混合法を300回の評価走行で比べた（抄録）。", "p5": "混合法は25℃のEKFのRMSEを7.24%から1.37% SOCに下げ、学習した温度ではEKF-TSより良かった（0.90%対1.10%）が、学習していない温度ではEKF-TSのほうがよく汎化した（1.34%対1.94±0.22%）（抄録）。", "fun": "電池の残量は直接測れないので、電圧などから推定する。物理の式に基づく方法は条件が変わると外れやすく、AIは学んでいない状況に弱い。両方を組み合わせると学んだ範囲では一番良いが、未知の温度では物理の構造を持つ方法のほうが強かった。それぞれの得意分野が見える点が面白い。", "unverified": "模擬だけの研究で、実験データでの確認はない。本文は入手できず、駆動パターンの詳細は確認できなかった。"}}, {"id": "pr46", "rank": 46, "headline": "学習済みエンコーダの表現空間でIMUを合成", "title": "Bio-PM-Guided Synthetic IMU Generation", "url": "https://arxiv.org/abs/2611.26607", "authors": "Deepali Singh ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Singh, D., Parpani, D., & Gupta, A. (2026). Bio-PM-Guided Synthetic IMU Generation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.26607", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "学習済みの生体信号エンコーダBio-PMの表現空間で合成IMUデータを生成し、人の行動認識の被験者をまたぐ分類のデータ拡張に使えることを示した（抄録）。未査読。", "p3": "10秒のIMUの窓を凍結したエンコーダでトークンの埋め込み列に変換し、その空間でクラス条件つきの自己回帰Transformerと拡散モデルのデコーダを学習した。波形を近似的に復元するPatchDecoderも示した（抄録）。", "p5": "拡散デコーダは合成で学習し実データで試す評価（TSTR）でマクロF1が0.68だった。合成トークンによる拡張と重力を考慮した320次元の特徴を組み合わせると、WISDMの51人で被験者を1人ずつ除く評価のマクロF1が0.729から0.809に上がった（抄録）。", "fun": "スマホの加速度センサで「歩く」「走る」を見分けるAIには大量の実データが要るが、集めるのは大変だ。この研究は、生の波形ではなく、すでに学習したAIの頭の中の「言葉」の形で偽のデータを作った。作り物で学んでも本物を見分けられた点が面白い。", "unverified": "本文は入手できず、自己回帰デコーダの性能と難しいクラスの内訳は確認できなかった。"}}, {"id": "pr47", "rank": 47, "headline": "過去の検証で選ぶ時系列基盤モデルの推論時計算", "title": "A Verifier from the Past: Test-Time Compute for Time Series Foundation Models", "url": "https://arxiv.org/abs/2611.25171", "authors": "Arjun Choudhry ほか", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Choudhry, A., Narayanan, A., Mallampalli, R., Li, P.-han, Narasimhan, S. S., Shah, R., Prakash, B. A., & Agarwal, S. (2026). A Verifier from the Past: Test-Time Compute for Time Series Foundation Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25171", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "時系列の基盤モデルの推論時に計算を追加して予測を改善する手法BGAAを提案し、系列自身の過去で作る因果的な検証器で、変換した文脈の候補を選別・平均した（抄録）。未査読。", "p3": "ローリング起点のバックテストで、構造化した文脈の変換（ビュー）を採点し、変換しない文脈より悪いものを捨て、残った予測分布を平均する（抄録）。", "p5": "試したすべてのモデルとベンチマークの組合せで改善し、MASEをGIFT-Evalで0.5〜1.0%、fev-benchで1.3〜5.0%、BOOMで1.7〜5.9%下げた。313Mのモデルが同系統の1B・2.5Bのモデルを上回った一方、窓ごとに最良のビューを選べれば17〜19%の改善の余地があった（抄録）。", "fun": "言葉のAIは、答えを何通りも作って確かめてから選ぶと賢くなる。しかし将来の値を予測するAIは、未来の答えで確かめることができない。そこで「過去の自分の予測がどれだけ当たったか」を検証役にした。小さなモデルが大きなモデルに勝てた点が面白い。", "unverified": "本文は入手できず、使ったビューの種類とモデル名は確認できなかった。"}}, {"id": "pr48", "rank": 48, "headline": "自分のAI利用だけ正当とみなす二重基準", "title": "“My AI Use Is Different”: Moral Exceptionalism, Hypocrisy and Double Standards in Generative AI Use", "url": "https://doi.org/10.20944/preprints202611.1693.v1", "authors": "Victor Frimpong", "venue": "Preprints.org", "date": "2026-11-20", "apa": "Frimpong, V. (2026). “My AI Use Is Different”: Moral Exceptionalism, Hypocrisy and Double Standards in Generative AI Use. https://doi.org/10.20944/preprints202611.1693.v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Preprints.orgの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "自分の生成AIの利用は倫理的に正当とみなし、同等の他人の利用には厳しい基準を当てはめる傾向を「AI道徳的例外主義（AIME）」として概念化した（抄録）。未査読の概念論文。", "p3": "自己奉仕バイアス、道徳的偽善、動機づけられた推論、道徳的ライセンシングの研究から、能力・意図・貢献・制度の4つの例外主義と、文脈知識の非対称などの生じ方を整理し、正当な区別との違いを見分ける診断AIMEDを示した（抄録）。", "p5": "責任あるAIの統治には、主体によらない基準、文脈に応じた評価、規則を作り執行する側にも同じ基準を当てる対称的な説明責任が要ると結論し、学術の公正性やAI利用の開示、職場の実務への含意を示した（抄録）。", "fun": "自分がAIで文章を整えるのは「補助」だが、他人がやると「ずる」に見える。そんな二重基準に名前を付け、本当に違う使い方なのか、自分に甘いだけなのかを見分ける手順を作った。誰もが陥りやすい心のくせをAI時代の倫理に当てはめた点が面白い。", "unverified": "概念論文で実証データはない。本文は入手できず、診断AIMEDの具体的な項目は確認できなかった。"}}, {"id": "pr49", "rank": 49, "headline": "採用AIの差別に関係者の共同責任を問う", "title": "Employment AI Agents (EAA) and Discriminatory Decision Making: A Multi Player Model of Joint Accountability", "url": "https://doi.org/10.2139/ssrn.7710719", "authors": "Shlomit Yanisky-Ravid ほか", "venue": "SSRN", "date": "2026-11-20", "apa": "Yanisky-Ravid, S., & Cohen, J. (2026). Employment AI Agents (EAA) and Discriminatory Decision Making: A Multi Player Model of Joint Accountability. https://doi.org/10.2139/ssrn.7710719", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "採用・昇進・懲戒などの人事判断を担う「雇用AIエージェント」による差別について、雇用主と開発・提供・検証・監査を担う者の共同責任のモデルを提案した法学の論文（抄録）。未査読。", "p3": "機能に着目して雇用AIエージェントを定義し、偏った学習データや代理変数、設計・運用条件などから差別が生じる経路を整理したうえで、既存の雇用差別法の適用と責任の断片化を検討した（抄録）。", "p5": "配備した雇用主と、判断経路に実質的な支配を持つか差別のリスクの検証を引き受けた開発者・提供者・検証者・監査者に推定的に責任を割り当て、機能・支配・知識・追跡可能性・予防能力で責任を決め、比較過失に応じた分担を認めるモデルを示した（抄録）。", "fun": "AIが採用の書類選考で不公平な判断をしたら、悪いのは使った会社か、作った会社か、チェックした会社か。この論文は、契約の名前ではなく「誰が実際にその判断を左右できたか」で責任を分けるべきだと主張する。昔からある共同雇用の考え方をAIに当てはめた点が面白い。", "unverified": "法学の論文で実証データはない。本文は入手できず、具体的な訴訟の検討は確認できなかった。"}}, {"id": "pr50", "rank": 50, "headline": "AIによるフリーランス業務の変化を作業単位で測る", "title": "AI-Driven Transformation of Digital Platform Work: A Task-Based Model for Measuring Labour Disruption and Vulnerability, with Early Evidence from Online Freelancing in Kenya", "url": "https://arxiv.org/abs/2611.25585", "authors": "Farhan Latif", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Latif, F. (2026). AI-Driven Transformation of Digital Platform Work: A Task-Based Model for Measuring Labour Disruption and Vulnerability, with Early Evidence from Online Freelancing in Kenya (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.25585", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "arXivの抄録（候補の収集時に取得）を使用。本文は入手できず", "preprint": true, "short": true, "p1": "AIによるオンラインのプラットフォーム労働の変化を、業務のやり方の変化（混乱）と生計の脆弱性に分けて作業単位で測る枠組みを提案し、ケニアのフリーランスの初期の証拠と比べた（抄録）。未査読。", "p3": "執筆、バーチャルアシスタント、文字起こし、ウェブ・ソフトウェア開発の4種の仕事で自動化・代替・強化の可能性を作業ごとに推計し、ナイロビのフリーランス52人の調査と20人の追跡面接と比べた（抄録）。", "p5": "モデルは4種すべてで高い混乱を推計したが、生計の脆弱性はより低く職種で異なり、無償の作業の効率化が有償の仕事の賃金への影響を一部相殺した。労働者は作業の変化と競争の激化を報告し、技能の適応とAIの戦略的な利用が失職への懸念を左右していた（抄録）。", "fun": "AIで仕事がなくなるかを職業名で考えると、同じ職業でも人によって中身が違うことを見落とす。この研究は、仕事を細かい作業に分けて、どの作業がAIに置き換わるかを数えた。顧客探しのような無給の作業が楽になる分、収入への打撃が和らぐという見方が面白い。", "unverified": "本文は入手できず、各職種の混乱と脆弱性の点数の値は確認できなかった。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習", "headline": "Canon層は8Bでも学習トークンを3割節約", "title": "Physics of Language Models: Part 4.2, Canon Layers at Scale where Synthetic Pretraining Resonates in Reality", "url": "https://arxiv.org/abs/2611.24963", "authors": "Zeyuan Allen-Zhu", "venue": "arXiv", "date": "Fri, 20 Nov 2026", "apa": "Allen-Zhu, Z. (2026). Physics of Language Models: Part 4.2, Canon Layers at Scale where Synthetic Pretraining Resonates in Reality (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2611.24963", "why": "1.3〜8Bパラメータ・1〜2兆トークンの事前学習64回で、学術規模では消える構造の差が大規模では測れるようになり、局所的なトークン混合を加えるCanon層が同じMMLU精度に必要なトークンを約3割減らすことを示す。標準ベンチマークで互角の線形モデルも短い文脈からの検索や2段推論に失敗し、小さな合成課題がその差を予見できたとする。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（7つの発見と4つの教訓、結論の節）を読んだ", "preprint": true, "p1": "Transformerと3系統の線形モデルを1.3〜8Bパラメータ・1〜2Tトークンで64回ゼロから事前学習し、近くのトークンを混ぜるCanon層が8Bで同じMMLUの精度に要するトークンを約30%減らす一方、標準ベンチマークの高得点が文脈からの取り出しや二段の推論の弱さを隠すことを示した（抄録、§1.1）。未査読。", "p2": "学術規模の事前学習（1.3Bパラメータ、100Bトークン）では、よく調整したモデルの間で構造の違いがほとんど消え、どの設計の違いが重要かを標準ベンチマークで見分けられるかは分かっていなかった（抄録）。", "p3": "同じNemotron-CCのデータで学習率を調整し、構造を厳密にそろえたLlama型のTransformer、GLA、Gated DeltaNet（GDN）、Mamba2を比べ、8Bの学習1回に約100k USD（米ドル）をかけた（抄録）。Canon層はパラメータの0.2%未満で横方向の混合を加える（§1.2）。線形モデルでは出力ゲートを低ランクにして浮いたパラメータを他に回すGLA5とGDN2を提案した（§1.1）。解釈
