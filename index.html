<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="表示の切り替え"></div>
    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="controls" id="controls">
    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>
    <button class="btn icon" id="speak" type="button" aria-label="読み上げ">🔊</button>
    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>
    <button class="btn icon" id="auto" type="button" aria-label="連続で読み上げ" aria-pressed="false">⏯</button>
    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

で外れることを示しました。高校の確率と分散だけで現場の常識を検定できる点が面白いです。", "unverified": "点検頻度の指定自体が状態で選ばれるため、混合以外の要因の切り分けは未確認。"}}, {"id": "pr02", "rank": 2, "headline": "地震波形から土石流の底面衝撃力を深層学習で逆推定", "title": "Inverting Debris Flow Basal Impact Forces from Seismic Waveforms via Deep Learning", "url": "https://doi.org/10.22541/essoar.15011398/v1", "authors": "Kshitij Kar ほか", "venue": "ESS Open Archive", "date": "2026-11-01", "apa": "Kar, K., Zhou, Q., Tang, H., Walter, F., Zhang, Z., & McArdell, B. (2026). Inverting Debris Flow Basal Impact Forces from Seismic Waveforms via Deep Learning. https://doi.org/10.22541/essoar.15011398/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社サイトは取得できず（HTTP 403）、Crossrefに登録された抄録を使用", "preprint": true, "p1": "土石流が通過するときの地震波形から、流れの底面にかかる衝撃力の時系列を深層学習（LSTM・xLSTM）で逆推定し、ピーク力を平均5%以内の誤差で再現した（抄録）。", "p2": "底面衝撃力は土石流の動力学と被害軽減の鍵だが、直接測る装置は高価で維持が難しい。地震信号から理論模型で逆算する方法はあるが、データ駆動の深層学習の性能は十分に調べられていない（抄録）。", "p3": "入力は土石流の地震信号、出力は底面衝撃力の時系列という回帰問題として定式化し、LSTMとその拡張版xLSTMを学習させた。背景：LSTMは時系列の長い依存関係を記憶できる再帰型ニューラルネット。", "p4": "スイス・イルグラーベンの2019年の7事象の地震・衝撃力データで学習・検証し、2020〜2023年の21事象で評価した。指標は二乗平均平方根誤差とピーク衝撃力の誤差で、衝撃力と物理量の経験式とも比べた（抄録）。", "p5": "xLSTMはLSTMと同程度の性能で、ピーク力の平均絶対百分率誤差は5%以下（10 kN以下相当）。xLSTMで推定した累積衝撃力と観測された流量体積の相関はr=0.867で、流れを直接測らずに体積を推定できる可能性を示した（抄録）。", "p6": "未確認（抄録・本文を入手できず）：単一流域での学習・評価であり、他流域や観測点配置への一般化、地震計の位置依存性は抄録からは分からない。解釈：学習事象が7件と少なく、未知の規模の事象への外挿は慎重に見る必要がある。", "fun": "土石流は危険すぎて、中に計測器を入れて力を測るのは大変です。そこで、少し離れた地面の揺れ（地震計の記録）から、流れが川底をたたく力を逆算しようとしたのがこの研究です。過去の7回の土石流で学ばせただけで、その後の21回の力の山をよく当て、流れた土砂の量まで見積もれそうだという点が面白いです。", "unverified": "モデル構成、入力の前処理、他の指標の値は本文未入手のため未確認。"}}, {"id": "pr03", "rank": 3, "headline": "公共工事の労務単価倍増は警備員の賃金に届いたか", "title": "Who Gets the Raise? Japan's Public Works Pay Rates and the Wages of Security Guards", "url": "https://doi.org/10.5281/zenodo.23852893", "authors": "Azom, Kazi Affnann", "venue": "Zenodo", "date": "2026-11-01", "apa": "Azom, K. A. (2026). Who Gets the Raise? Japan's Public Works Pay Rates and the Wages of Security Guards. Zenodo. https://doi.org/10.5281/ZENODO.23852893", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "本文", "basis_note": "ZenodoのPDF本文（手法・結果・考察・結論の節と表3〜5の説明）を読んだ", "preprint": true, "p1": "公共工事の設計労務単価（交通誘導警備員）が2012〜2025年度に2倍超になったのに、警備員の賃金は29.2%しか上がらず、単価との差が広がったことを事前登録した分析計画で示した（抄録、§9）。", "p2": "国土交通省は職種・都道府県ごとに積算用の日額単価を定め、交通誘導警備員の単価は大きく引き上げられてきた。しかし、その引き上げが実際の賃金に届いたかは検証されていない（§1、§2）。", "p3": "47都道府県・2012〜2025年の単価、賃金構造基本統計調査、最低賃金を結合。賃金は「8時間あたり（所定内月給＋賞与/12）」で単価と同じ要素にそろえる（式1）。県内で賃金/単価の対数比のトレンドτ（H1、式2）、県・年の固定効果で単価との連動β（H2、式3）、最低賃金との連動γ（H3、式4）、単価の対象外の職種（ビル清掃員）との比較θ（H4、式5）を、県クラスタの頑健標準誤差つき加重最小二乗で推定（§5）。", "p4": "分析計画は検定の実行前の2026年11月1日に公開リポジトリへ登録され、事後の追加分析は区別して報告される。12種の頑健性検査も計画どおりに実施（§5、§7）。", "p5": "単価は107.7%上昇（日額8,326円→17,292円）、警備員の8時間賃金は29.2%上昇（9,491円→12,259円）で、単価比は1.14倍から0.71倍へ（§6.1、図1）。県内の差は年3.9%ずつ拡大（τ=−0.040、95%区間−0.045〜−0.035、表3）。清掃員との比較θ=−0.16（−1.06〜0.74）でH4は不成立（表4）。賃金は最低賃金と連動したが、全検査では一貫しなかった。", "p6": "調査上の「警備員」は施設・身辺警備で、交通誘導警備員を含む職種は2020年以降しかない（同期間の賃金上昇5.1%、単価28.6%）。単価が全国で同程度に上がったため県間検定の検出力が低い。5人以上の事業所のみが対象で、差額が誰に渡ったか（企業の利幅か、単価に含まれる社会保険料等か）は公開データでは分けられないと著者は述べる（§8）。", "fun": "国が「工事の見積もりでは警備員に1日これだけ払う想定で」と決める単価は、13年で2倍以上になりました。ところが実際の警備員の給料は3割ほどしか上がっていません。お金が途中のどこかで止まっているのか、それとも単価に給料以外のものが含まれているのか。公共のお金の流れを統計で追いかける点が面白いところです。", "unverified": "表2・表5の個々の数値の一部と、追加分析の詳細は読み切れていない。"}}, {"id": "pr04", "rank": 4, "headline": "SERVQUALは尺度より概念として40年使われてきた", "title": "SERVQUAL Outgrew Its Originators: A Bibliometric and Conceptual Analysis of Four Decades of Research, 1985–2025", "url": "https://doi.org/10.5281/zenodo.23852220", "authors": "Moteki, Yasutoshi", "venue": "Zenodo", "date": "2026-11-01", "apa": "Moteki, Y. (2026). SERVQUAL Outgrew Its Originators: A Bibliometric and Conceptual Analysis of Four Decades of Research, 1985–2025 (Version v1.0). Zenodo. https://doi.org/10.5281/ZENODO.23852220", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "本文", "basis_note": "ZenodoのPDF本文（データと方法、結果の4.1・4.4節、考察・限界・結論）を読んだ", "preprint": true, "p1": "SERVQUAL（サービス品質の尺度）に言及するScopusの全3,746件を、1つの再現可能な検索式とスクリプトで40年分マッピングし、「尺度」から「前提とされる枠組み」へ変わった経緯を示した（抄録、§7）。", "p2": "SERVQUALは知覚サービス品質を測る尺度として1985年に提案されたが、今は尺度としてより「モデル」として引用される。既存の計量書誌は検索期間が短く、再現手順が公開されていなかった（§1、§6.1）。", "p3": "2026年11月1日に検索式TITLE-ABS-KEY(\"SERVQUAL\")で得た全件をbibliometrixで分析。概念の歴史に沿って4期（1985–94、95–04、05–14、15–25）に分け、主題の変遷、局所・大域引用、歴史図、題名に含む822件の部分集合、キーワード規則による応用領域を調べた。背景：看護学の概念分析（定義属性・先行要因・帰結・関連概念）を読みの枠に使う（§2、§3）。", "p4": "Scopusの引用文献の区切り文字の問題と、短い題名での局所引用の誤一致を、著者名と題名の先頭8語の照合で補正した（§3.2）。", "p5": "件数は第1期31件から第4期2,418件へ（年成長率17.6%、§4.1）。2004年まで米国中心、その後は中国・インド・インドネシアなどが中心。主題は応用分野→成果概念（満足・品質）→次元や派生（信頼性、患者満足、e-servqual）へ移った。医療が全期間で最大の応用領域で、1985・1988年の原論文はコーパスの3分の1超から引用される（§6.1）。", "p6": "単一データベース・単一語で、本文でだけ使う研究は拾えない。領域の割り当ては粗く、主題地図はパラメータに依存し、局所引用の照合は下限である（§6.4）。概念分析は集計構造の読みで、文献を読んだ質的分析ではない。", "fun": "「サービスの良さ」を測るために40年前に作られた物差しが、いつの間にか作った本人たちの意図を超えて「モデル」と呼ばれ、広く使われるようになりました。この研究は、論文のキーワードや引用の網の目をたどって、その変化を地図にしています。言葉や考え方が生みの親の手を離れて育っていく様子を数字で見られる点が面白いです。", "unverified": "第2・3期の主題地図や応用領域の比率（表7）の個々の数値は読み切れていない。"}}, {"id": "pr05", "rank": 5, "headline": "制約論理プログラムで保証付きの反実仮想説明", "title": "CERTIFIED COUNTERFACTUAL RECOURSE VIA GOAL-DIRECTED CONSTRAINT LOGIC PROGRAMMING: INVERTING FOLD-SE DEFAULT RULES IN HIGH-STAKES CLINICAL AND FINANCIAL DOMAINS", "url": "https://doi.org/10.5281/zenodo.23847579", "authors": "Korlapati, Shreyas", "venue": "Zenodo", "date": "2026-10-31", "apa": "Korlapati, S. (2026). CERTIFIED COUNTERFACTUAL RECOURSE VIA GOAL-DIRECTED CONSTRAINT LOGIC PROGRAMMING: INVERTING FOLD-SE DEFAULT RULES IN HIGH-STAKES CLINICAL AND FINANCIAL DOMAINS. Zenodo. https://doi.org/10.5281/ZENODO.23847579", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録を使用（本文は入手できず）。審査のない置き場の文書", "preprint": true, "p1": "規則学習器FOLD-SEと、接地なしで動く制約解集合プログラミングs(CASP)を組み合わせ、表データの判定に「必ず成り立つ」反実仮想の救済策（recourse）を付ける仕組みを作った（抄録）。", "p2": "医療・金融の判断には透明性と、不利な判定を受けた人が何を変えればよいかの提示が求められる。LIMEやSHAPなどの事後説明や、勾配による反実仮想（Wachter、DiCE）は近似誤差があり、年齢など変えられない属性の変更を勧めたり、正しさを保証できない（抄録）。", "p3": "FOLD-SEで「既定規則＋例外（否定を失敗として扱うNAF）」の一階述語規則をデータから学び、その規則をs(CASP)で逆向きに解いて、変えられない属性を固定した制約のもとで望む判定に届く条件を探す。解釈：学習したモデル自体が規則なので、説明は近似ではなく導出そのものになる。", "p4": "UCI皮膚科データ（366例・34特徴・6クラス）とGerman Credit（1,000人・61特徴）で層化10分割交差検証。比較は深層ニューラルネット＋事後説明。精度、説明の忠実度、救済策の到達率、6観点のTOPSIS多基準評価を使う（抄録）。", "p5": "精度は皮膚科94.54%、与信72.30%で、深層学習との差は有意でなかった（t(9)=−2.133、p=0.0617／t(9)=−1.313、p=0.2218）。忠実度と到達率はともに100.0%で、深層学習＋事後説明の72.6%・50.5%を上回った。TOPSISでも両データで1位（0.9655／0.9496）（抄録）。", "p6": "未確認（本文を入手できず）。解釈：評価は小規模な公開ベンチマーク2つに限られ、与信の精度72.30%は高いとは言えない。忠実度100%は規則モデルでは定義上ほぼ自明で、救済策が現実に実行可能かは別問題として残る。", "fun": "AIに「融資は不可」と言われたとき、「何を変えれば可になるのか」を知りたいものです。ところが、よくある説明の方法は「年齢を下げれば可」のように無理なことを勧めることがあります。この研究は、AIの判断を最初から「もし〜なら〜」という規則で作り、その規則を逆にたどって、本当に実行できる変え方だけを探す点が面白いです。", "unverified": "規則の数・長さ、救済策の具体例、深層学習の構成は未確認。"}}, {"id": "pr06", "rank": 6, "headline": "交通事業の分配効果をログサム型アクセシビリティで", "title": "A utility-based framework for evaluating the distributive effects of public transport projects on perceived accessibility", "url": "https://doi.org/10.31235/osf.io/v74n8_v1", "authors": "Matheus Fontenelle Siqueira ほか", "venue": "SocArXiv", "date": "2026-11-01", "apa": "Siqueira, M. F., & Loureiro, C. F. G. (2026). A utility-based framework for evaluating the distributive effects of public transport projects on perceived accessibility. https://doi.org/10.31235/osf.io/v74n8_v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "本文", "basis_note": "SocArXivのPDF本文（3.4〜3.5節の方法、4章の結果、5章の考察と表4・表5の説明）を読んだ", "preprint": true, "p1": "交通計画の便益指標「ログサム」を、尺度に依存しない「雇用換算（job equivalents）」に直すことで、功利主義以外の分配原理（平等・優先・充足・ケイパビリティ）でも公共交通の効果を評価できることを、ブラジル・フォルタレザの鉄道で示した（抄録、§5）。", "p2": "費用便益分析は便益を金銭で足し合わせるため功利主義的と批判され、効用に基づくログサムも同じ立場とみなされて公平性の分析から外されてきた。著者はセンの区別を使い、問題は「足し合わせ」で、効用という情報そのものではないと論じる（§2、§5）。", "p3": "目的地-手段選択の入れ子ロジット（2024年の表明・顕示選好データ、性別×所得で層別）のログサムを、鉄道あり・なしの手段集合で計算した差Δを便益とする（式5）。雇用はlog形で効用に入るので、Δは「全ゾーンの雇用をk倍にする」効果に換算でき、k=exp(Δ/E[θs])（式7）で尺度が消える。手段集合を「全手段」と「公共交通＋徒歩のみ（車を持たない人）」で切り替える（§3.4〜3.5）。", "p4": "低所得労働者を対象に、ヘキサゴン単位・層別に便益を比較し、構造方程式モデルで便益が実際の鉄道利用にどれだけ結びつくかを調べた（§3.6）。", "p5": "雇用換算では最低所得層が最も得をし（男性6.4%、女性5.7%）、金銭では2〜4最低賃金の男性が最大（R$1.50）と逆転した（表4、§4.2）。公共交通しか使えない人では便益が2〜3倍（低所得女性17.6%）に増えた（§4.3、図7）。便益の鉄道利用への総効果は標準化0.07で、駅への近さと利用の関連の約7%しか説明しなかった（§4.4）。", "p6": "適応的選好（不遇な条件で形成された好み）はそのまま受け入れてしまう。目的地の認知や体験されたアクセシビリティは表現していない。解釈：単一都市・単一時点の事後評価で、反実仮想は鉄道を手段集合から外すだけの単純なもの。", "fun": "同じ鉄道でも、「お金」で便益を測るとお金持ちの男性が一番得をし、「行ける職場の数」で測ると一番貧しい人たちが一番得をする、という逆転が起きました。物差しを変えるだけで、政策の評価がひっくり返るわけです。さらに、車を持たない人にとっての恩恵は、普通の計算の2〜3倍あるという点も見逃されがちで面白いです。", "unverified": "表明選好調査の標本規模とモデルの推定値の詳細は読んでいない。"}}, {"id": "pr07", "rank": 7, "headline": "中国の高齢者でデジタル排除が虚弱化を予測", "title": "Digital Exclusion and Frailty Among Older Adults: A Longitudinal Analysis From China", "url": "https://doi.org/10.21203/rs.3.rs-11102480/v1", "authors": "Chang Liu ほか", "venue": "Research Square (In Review)", "date": "2026-11-01", "apa": "Liu, C., Lv, H., Zhou, W., & Yan, S. (2026). Digital Exclusion and Frailty Among Older Adults: A Longitudinal Analysis From China. https://doi.org/10.21203/rs.3.rs-11102480/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research SquareのHTML本文（方法、結果の表と部分集団・感度分析、考察・限界）を読んだ", "preprint": true, "p1": "中国の高齢者約1万人を2年追跡し、4領域のデジタル排除が虚弱（frailty）の新規発生を約1.4倍に高め、関わる領域が多いほど危険が段階的に下がることを示した（抄録）。", "p2": "生活サービスがオンラインに移る中、デジタルから取り残されることが高齢期の虚弱を予測するかは十分に定量化されていない。既存の多国コホート研究はインターネット利用の1項目だけで排除を測っており、範囲を過小評価しうる（Background）。", "p3": "CHARLSの2018年（基線）と2020年（追跡）を使い、インターネット、スマートフォン、モバイル決済、オンライン社会活動の4領域の利用を0〜4点で数え、0点を完全排除とした。虚弱は46項目の欠損累積型虚弱指数（FI）で、FI≥0.25を虚弱とする。基線で非虚弱の人に修正ポアソン回帰で調整済み相対危険（RR）、線形回帰で年あたりFI変化を推定（Methods）。", "p4": "主モデルは年齢・性別・婚姻・居住地・教育・資産・喫煙・慢性疾患・社会活動・基線FIで調整。脱落の逆確率重み付け、ADL困難者の除外、閾値0.20/0.30、認知機能の追加調整で頑健性を確認した。", "p5": "10,216人（平均67.8歳）の61.4%が完全排除で、2年間で非虚弱者の17.3%が虚弱化。完全排除のRRは1.42（95%CI 1.24–1.63）、FIの年変化は0.01単位あたり0.29多い。領域数が増えるほどRRは単調に低下（傾向P<0.001）。農村（RR 1.58）と初等教育以下（RR 1.51）で関連が強く、感度分析でもRRは1.36〜1.48だった。", "p6": "利用は自己申告で頻度や質は測っていない。未測定の交絡と逆因果（潜在的な機能低下が技術の利用を妨げる）を完全には排除できない。追跡期間がCOVID-19と重なり、完全ケース分析による選択の偏りもありうると著者は述べる。", "fun": "スマホ決済や病院のネット予約が当たり前になるほど、それを使えない高齢者は困ることが増えます。この研究では、中国の高齢者の6割がネットを全く使っておらず、その人たちは2年後に体が弱る危険が4割ほど高いことが分かりました。「デジタルの壁」が体の健康にまで関わるかもしれないという点が面白いです。", "unverified": "表1の基線特性の詳細は確認していない。"}}, {"id": "pr08", "rank": 8, "headline": "線形輸送方程式の源の寄与を経路積分で配分する", "title": "Path Integral Methods and Source Propagators for Linear Transport Operators", "url": "https://doi.org/10.5281/zenodo.23847611", "authors": "Fillmore, David", "venue": "Zenodo", "date": "2026-10-31", "apa": "Fillmore, D. (2026). Path Integral Methods and Source Propagators for Linear Transport Operators (Version v2). Zenodo. https://doi.org/10.5281/ZENODO.23847611", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "本文", "basis_note": "ZenodoのPDF本文（序論、4章の経路和とサンプリング、7章の煙の例、結論）を読んだ。5〜6章の導出は概略のみ", "preprint": true, "p1": "与えられた線形輸送（移流・交換・変換・増減）で、観測された量のうち「どの源からいつ入った分か」を厳密に配分する理論を、前向きの源タグ、重み付き随伴、有限経路和の3通りで導き、同じ量を評価することを示した（抄録、§8）。", "p2": "線形輸送の計算は観測点に届く総量を与えるが、その源の内訳は保持しない。さらに観測で総量場が与えられ予報と食い違うとき、その差（残差）をどの源に割り当てるかは慣習の選択になる（§1）。", "p3": "状態ごとの推移行列を掛け合わせた伝播子で、源kが区間nに入れた量の寄与A_k,nを経路の和として展開する（式18）。前向きには入力量に比例して粒子を出発させ重みを掛けて進め（式21〜22）、後ろ向きには観測から逆にたどる。どちらも不偏で、同じ和を異なる確率でサンプリングするだけである。例：総入力B=8の小例で、経路(1,1,2)の確率1/9×推定量9/2=1/2が列挙と一致（§4.3）。残差は加法的な残差タグと既存タグの比例補正の2慣習で配分する（§5）。", "p4": "各章に手計算の例を置き、最後に疎水性・親水性で除去のされ方が違う山火事の煤（BC・OC）が風下の受容点に届く例で、定常寄与、排出形態への感度、残差配分の違いを示す（§7）。", "p5": "2つの火災は同じ量を排出しても、近い火災が受容点の煙の57%、遠い火災が40%、背景が3%を占めた（§7.2、表1）。定常風では疎水性で排出された粒子は親水性の1.6〜1.9倍の質量を受容点に保つ（§8）。2慣習の違いは主に受容点での補正を独立の取り分として示すかどうかに現れる。", "p6": "厳密な会計は指定した輸送と配分慣習についてのもので、未知の物理的な源の割合を識別するものではないと著者は明記する（抄録）。個々の源の割合にはサンプリング分散が残り、符号付きの残差にはより強い支持条件が要る（§8）。JAMES向け原稿とあるが、審査のない置き場の版。", "fun": "川に何か所から色水を流したとき、下流の一杯の水のうち「どこの色水が何割か」を知りたいとします。この論文は、その内訳を、水の流れを前から追う方法と、下流から逆にたどる方法と、たくさんの道筋をくじ引きで選ぶ方法の3通りで計算でき、どれも同じ答えになることを示しました。山火事の煙の例で、同じ量を出しても近い火事の分が多く届くことも計算しています。", "unverified": "5〜6章の連続経路の導出と付録は読み切れていない。"}}, {"id": "pr09", "rank": 9, "headline": "他社モデルの審査員と自己一致でLLM回答を採点", "title": "LLM Trust Score: Scoring the Reliability of Language-Model Answers with Cross-Model Judges and Self-Consistency", "url": "https://doi.org/10.5281/zenodo.23843238", "authors": "Kapade, Khushbu", "venue": "Zenodo", "date": "2026-10-31", "apa": "Kapade, K. (2026). LLM Trust Score: Scoring the Reliability of Language-Model Answers with Cross-Model Judges and Self-Consistency. Zenodo. https://doi.org/10.5281/ZENODO.23843238", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの記録は取り下げ（HTTP 410）で本文は取得できず、OpenAlexに登録された抄録を使用", "preprint": true, "p1": "トークン確率を使わず、複数社のLLMを審査員にしてLLMの回答に0〜100の信頼スコアを付ける黒箱の仕組みを作り、正答と誤答をある程度分けられるが確率としては較正されていないことを示した（抄録）。", "p2": "LLMは流暢だが誤った答えを出し、利用者には安くそれを見分ける方法がない（抄録）。", "p3": "書き手モデル（gpt-4o-mini）が温度0.9で3回答え、Geminiが3回答の結論の一致を確認、Qwen・Mistral・Llamaの3審査員がWeb検索の抜粋を使って各回答を正誤判定し、最良の回答にスコアとHigh/Medium/Lowのラベルを付ける。別のモデル（NVIDIA Nemotron）が勝者の回答だけを確認し、多数派と食い違えば10点引く（抄録）。", "p4": "TruthfulQA 66問、HaluEval 66問、TriviaQA 68問の新しい200問で、採点に関与しないClaude Haiku 5.5が正誤を判定。指標はAUROC（正答・誤答の識別力）、正誤間の平均点差、Brierスコア（較正）（抄録）。", "p5": "書き手の正答率は61.0%。AUROCは0.674（95%区間0.604–0.740）、正誤の平均差は18.1点。ラベルの正答率はHigh 71.1%、Medium 55.0%、Low 26.3%と意図どおりに並んだ。一方、100点の回答の28.0%は誤りで、Brier 0.272は基準率予測（0.238）より悪い。審査員の誤り判定だけを使う単純な代理指標のAUROC 0.721は全体スコア以上だった（抄録）。", "p6": "TruthfulQAでは識別力が弱い（AUROC 0.568）。決選役の減点はAUROCを0.013しか上げず、各部品を単独では評価していないと著者が述べる（抄録）。解釈：200問と規模が小さく、判定役も単一のLLMである。", "fun": "AIの答えが正しいかを、別のAIたちに審査させる仕組みを作った研究です。審査員を何社分も集め、念入りに点数を付けても、満点を付けた答えの3割近くが間違いでした。しかも、審査員の「怪しい」という印だけを数えた簡単な方法のほうが成績が良かったという、手間をかけても良くなるとは限らない結果が面白いです。", "unverified": "本文の設計理由やプロンプトの詳細は未確認。"}}, {"id": "pr10", "rank": 10, "headline": "案内サインの視覚的複雑さと探索効率は非単調", "title": "How does the visual complexity of architectural signage affect wayfinding search efficiency? Nonlinear evidence from a semantic-computational dual-channel experiment", "url": "https://doi.org/10.21203/rs.3.rs-11098365/v1", "authors": "Zonghui Wang ほか", "venue": "Research Square (In Review)", "date": "2026-11-01", "apa": "Wang, Z., & Liu, H. (2026). How does the visual complexity of architectural signage affect wayfinding search efficiency? Nonlinear evidence from a semantic-computational dual-channel experiment. https://doi.org/10.21203/rs.3.rs-11098365/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "本文", "basis_note": "Research SquareのHTML本文（AVSTの構成、操作確認、仮説検定の結果と表1・表2）を読んだ", "preprint": true, "p1": "建物内の案内サインの視覚的な複雑さと探索の速さの関係はU字型で、「単純なほど速い」という通説に反して中程度の複雑さが最も速いことを、オンライン実験で示した（抄録）。", "p2": "サインは公共建築で道を探す主な手がかりだが、複雑さが探索効率に与える影響の定量的な証拠がなく、乱雑さの研究は単純なほど速いと仮定しがちだった（抄録）。", "p3": "多モーダルLLMによる意味的な採点と、物体検出（Grounding DINO）・顕著性推定（U2-Net、ResNet50）による18の計算指標を組み合わせた道具AVSTを開発し、色の組織化エントロピー（COE）、図と地の明瞭さ（FGI）などに複雑さを分解した。AIで生成した242枚のサインを低・中・高の複雑さに分けて刺激とした（§AVST）。", "p4": "150人のオンラインのクリック探索実験で10,233試行の反応時間（RT）を得て、線形混合モデル、分散分析、5,000回のブートストラップ媒介分析で検定した。LLM採点と計算指標の収束も相関で確認した（表1）。", "p5": "平均RTは低870.5 ms、中789.1 ms、高821.5 msでU字型（表2A）。側面設置は柱設置より86.1 ms遅く、その差は低複雑さで最大（941.4対799.1 ms）。COEはRTを短くし（β=−.15）、FGIは複雑さの効果の約18%を媒介（ab=.012、95%CI .003–.024）。LLMの密度採点と計算指標VCIはr=.895と強く一致したが、質感はr=−.066で一致しなかった。", "p6": "正答率が99%超の天井効果で正確さの仮説は当初の形では検定できなかった。固定効果が説明するのは分散の8.7%で、残りは個人差による（周辺R²=.087）。解釈：刺激はAI生成画像で、オンラインのクリック課題は実際の建物内の移動とは異なる。", "fun": "駅や病院の案内板は、シンプルなほど見つけやすいと思いがちです。ところがこの実験では、単純すぎても複雑すぎても探すのが遅くなり、ほどほどの複雑さが一番速いという結果でした。AIに画像の「ごちゃごちゃ度」を採点させ、コンピュータの画像解析と照らし合わせて測った点も面白いところです。", "unverified": "補足資料の指標定義（表S1）と非線形探索（RQ1）の詳細は読んでいない。"}}, {"id": "pr11", "rank": 11, "headline": "神経多様な働き手の擬態がビデオ会議疲労を強める", "title": "Social Camouflaging and Videoconferencing Fatigue in Neurodivergent Workers: Examining Gender as a Moderator", "url": "https://doi.org/10.21203/rs.3.rs-11088656/v1", "authors": "Grace Winder ほか", "venue": "Research Square (In Review)", "date": "2026-11-01", "apa": "Winder, G., & Allen, J. (2026). Social Camouflaging and Videoconferencing Fatigue in Neurodivergent Workers: Examining Gender as a Moderator. https://doi.org/10.21203/rs.3.rs-11088656/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "本文", "basis_note": "Research SquareのHTML本文（デザイン・参加者・尺度、階層的回帰、媒介・調整媒介、限界）を読んだ", "preprint": true, "p1": "神経多様（neurodivergent）な働き手で、自閉的特性を隠す「社会的カモフラージュ」がビデオ会議疲労（Zoom疲労）と強く関連し、特性→カモフラージュ→疲労の間接効果は女性で男性の約2倍であることを示した（抄録）。", "p2": "バーンアウト、神経多様性、会議科学は別々に発展し、その交点が手薄だった。ビデオ会議は自分の映像の常時表示や顔の格子、非言語手がかりの乏しさでカモフラージュの負荷を増やしうる（抄録）。", "p3": "自閉的特性（AQ、50項目）、カモフラージュ（CAT-Q、25項目、α=.91）、Zoom疲労（ZEF、15項目、α=.94）を匿名のオンライン調査で測り、人口統計を統制した階層的回帰と、PROCESS Model 7による調整媒介分析（ブートストラップ5,000回）を行った（Measures、Mediation）。", "p4": "ResearchMatchとスノーボールで募集した417人から欠損除外後332人（平均33.3歳）。過去1週間に仕事か学校の会議に出た成人に限った（Participants）。", "p5": "AQはカモフラージュの分散をΔR²=0.255説明し（β=0.531）、カモフラージュはZoom疲労をΔR²=0.241説明した（β=0.499）。カモフラージュは特性と疲労の関係を部分媒介し、間接効果は女性.359（95%CI .250–.481）、男性.171（.029–.349）、調整媒介指標−.188で女性が約2倍（表III）。", "p6": "横断研究で因果の向きは確定できない。性別は二値のみで、神経多様性は自己申告で診断の確認がない。CAT-Qは自閉症で開発された尺度でADHD特有の隠し方は測れない。対象はオンライン会議だけと著者は述べる（Limitations）。", "fun": "オンライン会議では、自分の顔がずっと画面に映り、たくさんの顔が並びます。周りに合わせようと自分の特性を隠しながら参加する人にとって、それは見えない重労働かもしれません。この研究は、その「隠す努力」が会議疲れと強く結びつき、特に女性で大きいことを示しました。疲れの原因が会議の長さだけではないという点が面白いです。", "unverified": "記述統計と相関表の数値は確認していない。"}}, {"id": "pr12", "rank": 12, "headline": "ネパールのがん患者の家族介護者408人の心理的苦痛", "title": "Psychological distress among informal caregivers of patients with cancer: a cross- sectional hospital-based study from Nepal", "url": "https://doi.org/10.21203/rs.3.rs-10823856/v1", "authors": "Subash Wagle ほか", "venue": "Research Square (In Review)", "date": "2026-11-01", "apa": "Wagle, S., Kafle, P., Bhattarai, G., Neupane, D. R., Rana, A., Niroula, S., Gautam, S., Thapa, A., Pant, S. B., Koirala, R., Khanal, P., & Bhurtyal, A. (2026). Psychological distress among informal caregivers of patients with cancer: a cross- sectional hospital-based study from Nepal. https://doi.org/10.21203/rs.3.rs-10823856/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research SquareのHTML本文（方法、自己負担の測定、回帰の結果、限界）を読んだ", "preprint": true, "p1": "ネパールのがん患者を支える家族などの無償の介護者408人で、約6割に心理的苦痛の症状があり、介護者自身の医療費の自己負担が多いほど苦痛が段階的に強いことを示した（Results）。", "p2": "低・中所得国のがんの無償介護者は大きな心の負担を負うが、その要因、特に経済的負担との関係の証拠は乏しい（Background）。", "p3": "2つの公立がん専門病院で面接による横断調査。苦痛はネパール語版HSCL-25（不安10項目、抑うつ15項目）で測り、介護者が個人として負担した直接医療費・非医療費（交通・宿泊・食事など）を対数変換して5分位にした。非正規の結果に対し、5,000回のブートストラップによる重回帰（BCa 95%CI）で関連要因を推定した（Data collection、Statistical analysis）。", "p4": "多重共線性をGVIFで確認し、診断からの期間を除外。二変量でp<0.2の変数を多変量モデルに入れた。", "p5": "不安61.8%、抑うつ52.7%、全体の苦痛58.8%（図2）。年間の自己負担は平均NRS 325,041（USD 2,243）。自己負担の最上位5分位は最下位に比べて不安B=9.73、抑うつB=13.52、苦痛B=23.25高い（表3）。女性介護者（苦痛B=7.19）、患者の親（B=7.48）、病期III・IV・不明が全指標で苦痛の高さと関連した。", "p6": "横断研究で自己負担と苦痛の因果は言えない。費用は想起に頼り、治療中のため総費用を過小評価しうる。公立病院2施設に限られ、心の不調への偏見による過少報告もありうると著者は述べる（Strength and Limitations）。", "fun": "がんの治療では、患者本人だけでなく、付き添う家族も心と財布に大きな負担を抱えます。この研究では、ネパールの付き添いの家族の約6割が強い不安や落ち込みを抱え、自分で払ったお金が多いほどそれが強いことが分かりました。病院の外にいる「もう一人の当事者」に光を当てている点が面白いです。", "unverified": "表1・表2の対象者の属性の詳細は確認していない。"}}, {"id": "pr13", "rank": 13, "headline": "保険会社のAIチャットボットの機能と顧客満足", "title": "The Impact of AI Chatbot Features on Customer Satisfaction in the Insurance Industry: Evidence from Parsian Insurance Company, Iran", "url": "https://doi.org/10.6084/m9.figshare.34877712", "authors": "somaye musavi Gheydari", "venue": "Figshare", "date": "2026-11-01", "apa": "musavi Gheydari, somaye. (2026). The Impact of AI Chatbot Features on Customer Satisfaction in the Insurance Industry: Evidence from Parsian Insurance Company, Iran. figshare. https://doi.org/10.6084/M9.FIGSHARE.34877712", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Figshareの抄録（DataCiteから取得）を使用。抄録に結果の記載はなく、本文は入手できず", "preprint": true, "p1": "イランの保険会社で、AIチャットボットの5つの機能（信頼、応答の速さと正確さ、対話性、個別化、使いやすさ）と顧客満足の関係を調べた質問紙調査（抄録）。", "p2": "保険会社は速く安いセルフサービスとしてAIチャットボットを導入しているが、どの機能が顧客満足に効くかの実証はイラン市場でほとんどない（抄録）。", "p3": "相関研究の設計。著者が作成した12項目のチャットボット機能尺度と10項目の顧客満足尺度（5件法、クロンバックのα=0.93、0.89）を使い、SPSS 21でコルモゴロフ-スミルノフ検定、ピアソン相関、単回帰で分析した（抄録）。", "p4": "テヘランのParsian保険の顧客300人を3か月間に便宜抽出し、275人が完全回答した（抄録）。比較対象となる統制群や他社はない。", "p5": "未確認（抄録に結果の記載がなく、本文を入手できず）。", "p6": "未確認（抄録・本文を入手できず）。解釈：便宜標本・単一企業・独自尺度・単回帰の設計で、機能間の相関や共通方法バイアスを扱えているかは分からない。", "fun": "保険の相談をAIのチャットに任せる会社が増えています。お客さんが満足するのは、返事の速さなのか、自分に合わせた提案なのか、それとも「信頼できる」と感じることなのか。機械と人の接点で何が満足を生むのかを分けて調べようとする問いが面白いところです。", "unverified": "結果（相関係数・回帰係数）はすべて未確認。"}}, {"id": "pr14", "rank": 14, "headline": "米国バス事業者の運転士負傷と賃金支出のパネル", "title": "Reported Operator Injuries and Wage Expenditure in U.S. Bus Agencies: A Fiscal-Year Panel, 2019–2024", "url": "https://doi.org/10.5281/zenodo.23850479", "authors": "Ankam, Kruthik", "venue": "Zenodo", "date": "2026-11-01", "apa": "Ankam, K. (2026). Reported Operator Injuries and Wage Expenditure in U.S. Bus Agencies: A Fiscal-Year Panel, 2019–2024 (Version v6). Zenodo. https://doi.org/10.5281/ZENODO.23850479", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "本文", "basis_note": "ZenodoのPDF本文（分析戦略、結果6.1〜6.2節、考察・結論）を読んだ", "preprint": true, "p1": "米国のバス事業者の会計年度パネル（2019〜2024年）で、前年の運転士の負傷率と翌年の時間あたり実質賃金支出の間に、明確な関連が見つからないことを透明に報告した（§8）。", "p2": "危険な職ほど賃金が上乗せされる（補償賃金）という考えがあるが、公共交通の運転士で負傷の情報が賃金支出に反映されるかは、会計年度をそろえた行政データで検証されていない（§1〜2）。", "p3": "全米交通データベース（NTD）の直営の通常バスを事業者の会計年度に突合し、log(実質賃金支出/労働時間)を前年の負傷率（車両営業10万時間あたり）に回帰する。事業者固定効果と年固定効果を入れ、前年の業務・人員構成と州の民間賃金を統制。事業者クラスタの頑健標準誤差で推論する（§5、式）。", "p4": "当初計画（全職員）は推定前に内部で記録され、運転士限定の拡張は結果を見た後・推定前に記録された探索的分析と区別して報告。別実装で係数を照合した（§5）。", "p5": "選別後1,670事業者年・304事業者、主モデルは1,345観測・284事業者。全職員の係数−0.000149（95%CI −0.008255〜0.007957、p=.971）、運転士限定−0.000917（p=.838）。負傷率の10〜90パーセンタイル幅で賃金支出差は−0.14%（−1.49%〜+1.22%）で、予測した正の関連は支持されなかった（§6.2）。前年の負傷率の57.77%はゼロ。", "p6": "賃金支出は残業や人員構成で動く会計比率で、交渉で決まる賃率ではない。非検出は同等性の証明ではなく、6年は短くパンデミックとも重なる。事後の重み付け監査では負の関連（−0.019266、p=0.0217）が出たが推定対象が変わり確証的ではないと著者は述べる（抄録、§7）。", "fun": "危ない仕事ほど給料が高くなるはずだ、という経済学の考え方があります。この研究は、全米のバス会社で運転士のけがが多かった翌年に給料の支出が増えるかを調べ、はっきりした関係は見つからなかったと正直に報告しています。何も見つからなかった結果を、どこまで言えてどこから言えないかを丁寧に区切っている点が面白いです。", "unverified": "感度分析10種と州×年効果のモデルの個々の係数は読んでいない。"}}, {"id": "pr15", "rank": 15, "headline": "患者と家族に医療ケアを教える方法のDelphi合意", "title": "Recommendations on teaching medical and nursing tasks to patients and informal caregivers: a Delphi study", "url": "https://doi.org/10.21203/rs.3.rs-10947417/v1", "authors": "Matthijs H. Bosveld ほか", "venue": "Research Square (In Review)", "date": "2026-11-01", "apa": "Bosveld, M. H., Bokhoven, M. A. v., Zandvoort, M. J. J. M. v., Mertens, H. J. M. M., & Mook, W. N. K. A. v. (2026). Recommendations on teaching medical and nursing tasks to patients and informal caregivers: a Delphi study. https://doi.org/10.21203/rs.3.rs-10947417/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "本文", "basis_note": "Research SquareのHTML本文（参加者・声明の作成・合意基準、各ラウンドの結果、強みと限界）を読んだ", "preprint": true, "p1": "オランダの政策担当者・医療職・研究者・患者や家族介護者の専門家43人のデルファイ法で、医療・看護行為を患者と家族介護者に教え移すための45の推奨を合意形成した（抄録）。", "p2": "患者や家族介護者は医療チームの対等な一員として、医療・看護行為を自分で行うことが増えているが、準備不足と過重負担を感じている。組織・訓練・移管の進め方に合意された指針がない（抄録）。", "p3": "文献と実践経験から54の声明を作り、組織戦略、物流的な前提、患者・介護者の適格基準、訓練と移管の4区分に整理。7件法で評価し、80%以上が6以上をつければ推奨として採用、80%以上が2以下なら棄却と事前に定めた。各ラウンドの自由記述を主題分析して声明を修正し、最大3ラウンド実施（Data collection、Data analysis）。", "p4": "全国組織と協力して目的的に専門家を集め、最終案は保健・青少年ケア監察局による外部レビューで確認した（External review）。", "p5": "43人（政策26%、提供者30%、研究者28%、受け手の立場を持つ人12人）が参加。第1ラウンドで54声明中25が基準に達し、3ラウンドで計45の推奨に合意、3声明は基準にわずかに届かなかった。最多は訓練と移管の過程に関する26件（抄録、Round 3）。", "p6": "全員がオランダ在住で、医療制度の異なる国への移転可能性は限られる。二重の役割を持つ参加者の扱い、80%という基準の恣意性を著者は認める。人手不足の中で患者・介護者が道具化され負担が増すことへの警告も記している（Strengths and limitations、抄録）。", "fun": "病院の人手が足りなくなると、注射や包帯の交換などを家族が担う場面が増えます。でも、誰がどう教え、どこまで任せてよいのかは決まっていませんでした。この研究は、医療者だけでなく患者や家族も交えた何度ものアンケートで45の約束事をまとめました。家族を便利な人手にしてはいけないという専門家の警告も含めている点が面白いです。", "unverified": "表2の45の推奨の全文と、合意に至らなかった3声明の内容は確認していない。"}}, {"id": "pr16", "rank": 16, "headline": "社内SNSの論争で発言しない多数派の影響を探る", "title": "The Silent Majority: The Social and Organizational Impact of Lurking during Controversial Workplace Discussions", "url": "https://osf.io/3fmhy", "authors": "Haijiao Luo", "venue": "OSF Preprints (OSF Preprints)", "date": "2026-10-29", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "OSF Preprintsの抄録（OpenAlexから取得）を使用", "preprint": true, "short": true, "p1": "社内の論争的な議論で「読むだけで発言しない人（lurker）」の行動と、その社会的・組織的な影響を調べる研究計画（抄録）。", "p3": "期待違反理論と心理的リアクタンス理論に基づき、匿名性などの基盤の特徴と企業文化（価値重視か業績重視か）を要因、情報探索や否定的な口コミを結果、期待違反や自由への脅威の知覚を心理機構として整理する（抄録）。", "p5": "抄録は研究の枠組みを示す段階で、データや結果の記載はない（抄録）。", "fun": "ネットの議論では、書き込む人より読むだけの人のほうがずっと多く、抄録では75〜90%とされます。でも、黙っている人が何を感じ、職場の空気にどう効いているかはほとんど測られてきませんでした。「声を上げない多数派」を研究対象にしようという発想の転換が面白いところです。", "unverified": "実際のデータ収集の有無と結果は抄録からは不明。"}}, {"id": "pr17", "rank": 17, "headline": "意味の置換でLLMの議論に本当の対立を生む実験", "title": "Argumentative Tension through Semantic Displacement. An Experiment Applied to the Debate on AI Development.", "url": "https://doi.org/10.5281/zenodo.23843834", "authors": "Mosquera, Mariano", "venue": "Zenodo", "date": "2026-10-31", "apa": "Mosquera, M. (2026). Argumentative Tension through Semantic Displacement. An Experiment Applied to the Debate on AI Development. Zenodo. https://doi.org/10.5281/ZENODO.23843834", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録（DataCiteから取得）を使用", "preprint": true, "short": true, "p1": "AIが生成した議論の立場を、外部の概念体系を使って「ずらす」ことで、対立を消さずに論点の多様性を広げられるかを試した探索的実験（抄録）。", "p3": "合成コーパスsyncIALOのAI開発をめぐる討論（20論点）を、言語モデル、SKOSで表したオントロジー、反対の立場を立てる手順で変換し、21論点の討論と比べた。質的分析と規模を調整した多様性の合成指標で評価（抄録）。", "p5": "8種類の変換が見つかり、総合的な多様性指数は5.87%増え、SKOSの豊かさは22.49%増えた一方、正規化した意味距離は2.98%減った（抄録）。", "fun": "AIに議論させると、似たような意見ばかりになりがちだという問題があります。この研究は、概念の辞書を使って論点を少しずらし、本物の対立を残したまま意見の幅を広げようとしました。ただ、多様性が増えても意味の距離は少し縮んでいて、「幅」と「隔たり」は別物だと分かるのが面白い点です。", "unverified": "討論は1組のみで、指標の定義の詳細は抄録からは不明。"}}, {"id": "pr18", "rank": 18, "headline": "非線形の転換点推定をRCS・ベイズRCS・SHAPで比較", "title": "A Comparison of Frequentist RCS, Bayesian RCS, and SHAP for Estimating Risk Inflection Points and Crossing Points of Biomarkers", "url": "https://doi.org/10.21203/rs.3.rs-11522242/v1", "authors": "Yue-peng Liu", "venue": "Research Square (In Review)", "date": "2026-11-01", "apa": "Liu, Y.-p. (2026). A Comparison of Frequentist RCS, Bayesian RCS, and SHAP for Estimating Risk Inflection Points and Crossing Points of Biomarkers. https://doi.org/10.21203/rs.3.rs-11522242/v1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefから取得）を使用", "preprint": true, "short": true, "p1": "非線形な用量反応曲線の「向きが変わる点（変曲点）」と「効果が保護から有害に変わる点（交差点）」の推定法を、シミュレーションで比べ、使い分けの指針を示した（抄録）。", "p3": "頻度論の制限付き3次スプライン（RCS）、ベイズRCS、SHAPを、曲線の形・共線性・結果変数の種類を変えたモンテカルロ実験で比較し、実例2件にも適用した（抄録）。", "p5": "交差点はベイズMCMCが最良で、単調・対称U字型の偏りは約±0.03（頻度論RCSは−0.23〜+0.39）。変曲点は頻度論RCSが良く、SHAPには約−0.18〜−0.24の消えない偏りがあり探索用にとどめるべきとした（抄録）。", "fun": "「ちょうどいい量」を超えると害になる、というU字型の関係はよくあります。その境目をデータから読み取るのは意外と難しく、人気の説明手法SHAPには、調整しても消えない「ずれ」があると分かりました。道具によって得意な点が違い、目的に合わせて選ぶ必要があるという教訓が面白いです。", "unverified": "偏りの単位（標準化の有無）とシミュレーション条件の詳細は抄録からは不明。"}}, {"id": "pr19", "rank": 19, "headline": "亀裂のある帽岩からのCO2漏洩を水理-力学連成で", "title": "Coupled hydromechanical controls on CO2 leakage through fractured caprocks", "url": "https://doi.org/10.22541/essoar.15011388/v1", "authors": "Atefeh Vafaie ほか", "venue": "ESS Open Archive", "date": "2026-11-01", "apa": "Vafaie, A., Kivi, I. R., Makhnenko, R. Y., & Vilarrasa, V. (2026). Coupled hydromechanical controls on CO2 leakage through fractured caprocks. https://doi.org/10.22541/essoar.15011388/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "ESS Open Archiveの抄録（Crossrefから取得）を使用", "preprint": true, "short": true, "p1": "亀裂のある帽岩（CO2を閉じ込める上部の岩盤）からの漏洩を、水理と力学の連成を現場スケールで解くことで評価する枠組みを示した（抄録）。", "p3": "亀裂のある頁岩の二相流・水理力学特性の室内測定を現場スケールの数値シミュレーションに取り込んだ（抄録）。", "p5": "帽岩の封じ込め能力にかかわらずCO2の移動は亀裂に沿って局在するが、その速さと広がりは周囲の地層との非局所的な相互作用で決まった。亀裂を抜けても上の帯水層への流出は限られ、高透水の帯水層で圧力が速く抜けCO2が溶けるためとした（抄録）。", "fun": "地下にCO2を埋めて温暖化を抑える計画では、ふたになる岩に割れ目があると漏れが心配です。この研究では、割れ目を抜けても上の地層で圧力が逃げCO2が水に溶けるため、漏れが広がりにくい場合があると示しました。割れ目だけでなく周りの地層全体を一緒に見ないと危険度は分からない、という点が面白いです。", "unverified": "漏洩量の具体的な数値と対象地点は抄録からは不明。"}}, {"id": "pr20", "rank": 20, "headline": "海氷変形をラグランジュ的に多尺度で診断する", "title": "Stretching Near and Far: Unstructured Multiscale Lagrangian Sea Ice Deformation and Dynamic Regimes", "url": "https://doi.org/10.22541/essoar.15011409/v1", "authors": "Lluïsa Puig-Moner ほか", "venue": "ESS Open Archive", "date": "2026-11-01", "apa": "Puig-Moner, L., & Aksamit, N. O. (2026). Stretching Near and Far: Unstructured Multiscale Lagrangian Sea Ice Deformation and Dynamic Regimes. https://doi.org/10.22541/essoar.15011409/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "ESS Open Archiveの抄録（Crossrefから取得）を使用", "preprint": true, "short": true, "p1": "海氷の変形を、粒子の対ごとの距離の伸び方で多尺度に追うラグランジュ的な診断の枠組みを作り、漂流データの比較やレジーム転移の検出に使えるようにした（抄録）。", "p3": "漂流速度場だけを入力に、対ごとの分離行列を時期や漂流製品の間で比べる方法と、特定の空間尺度での変形の時系列を調べる方法を開発した（抄録）。", "p5": "2000〜2020年の汎北極45日積分と2017年春のボーフォート環流域4日積分に適用し、独立観測と整合する漂流の異常とレジーム転移を検出した。neXtSIMとOSI SAFの漂流製品はタイミングはおおむね一致するが、伸びの強さの尺度配分が異なった（抄録）。", "fun": "海氷は割れやすく、ある場所では砕け、隣では固まったままという不均一な動きをします。この研究は、氷の上に置いた目印どうしの距離がどう伸びるかを追うことで、近い尺度と遠い尺度の変形を同時に捉えようとしました。流れに乗って見る（ラグランジュ的）視点が、点ごとの比較の弱点を補う発想が面白いです。", "unverified": "変形指標の具体的な定義と検出精度の数値は抄録からは不明。"}}, {"id": "pr21", "rank": 21, "headline": "InSARとGNSSで都市の不同沈下とひずみを評価", "title": "Integrated InSAR Assessment of Surface Strain, Differential", "url": "https://doi.org/10.22541/essoar.15011411/v1", "authors": "Shayan Shirafkan ほか", "venue": "ESS Open Archive", "date": "2026-11-01", "apa": "Shirafkan, S., Zarei, M., Mehrabi, H., & shirafkan, s. (2026). Integrated InSAR Assessment of Surface Strain, Differential. https://doi.org/10.22541/essoar.15011411/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "ESS Open Archiveの抄録（Crossrefから取得）を使用", "preprint": true, "short": true, "p1": "イランのイスファハンで、衛星干渉SAR（InSAR）とGNSSを統合し、都市の地盤沈下を水平ひずみ・不同沈下・曲率・沈下盆の形まで一体で評価した（抄録）。", "p3": "2020〜2024年の昇交・降交軌道のSentinel-1観測から3成分の変位を推定し、方向別ひずみ、有限基線の歪み、2階微分、形状記述子を定義し、長期成分と周期成分に分解した。4観測点のGNSSで成分ごとに検証（抄録）。", "p5": "GNSSとInSARの変位の差は10〜30 mmだった（抄録）。", "fun": "地下水のくみ上げなどで地面がゆっくり沈むと、沈む量そのものより「場所による沈み方の差」が建物や管路を傷めます。この研究は、宇宙からのレーダー観測で沈下の大きさだけでなく、傾きや曲がり方、沈下のくぼみの形まで地図にしました。地面の『しわ』を測るような発想が面白いところです。", "unverified": "沈下量や不同沈下の最大値などの結果の数値は抄録からは不明。"}}, {"id": "pr22", "rank": 22, "headline": "逆問題による診断が失敗する型を7分野で分類", "title": "Natural and Engineering Systems: A Taxonomy of Failure Modes in Inverse-Problem Diagnostics", "url": "https://doi.org/10.5281/zenodo.23854761", "authors": "Avtonomov, Petr", "venue": "Zenodo", "date": "2026-11-01", "apa": "Avtonomov, P. (2026). Natural and Engineering Systems: A Taxonomy of Failure Modes in Inverse-Problem Diagnostics. Zenodo. https://doi.org/10.5281/ZENODO.23854761", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録（DataCiteから取得）を使用。審査のない置き場の文書", "preprint": true, "short": true, "p1": "共通の逆問題の枠組みを7分野に当てはめた技術ノート集の序論で、逆問題による診断がどこで失敗するかを整理した（抄録）。", "p3": "ダムの浸透、火山微動、ネットワーク流、構造ヘルスモニタリング、カオス的データ同化、複合材の超音波検査、乱流の間欠性の7つのノートを比較した（抄録）。", "p5": "結果は否定的4、肯定的1、部分的2で、「診断は検出器であって予言者ではない。どこが脆いかは示せても、いつ壊れるかは外部の物理なしには分からない」と結論した（抄録）。", "fun": "観測データから原因をさかのぼる「逆問題」は、医者の診断のようなものです。この文書は、7つの分野で試した結果、うまくいかなかった例のほうが多かったことを隠さず並べています。「弱い場所は分かるが、いつ壊れるかまでは分からない」という線引きをはっきりさせた点が面白いです。", "unverified": "各ノートの手法と判定基準は抄録からは不明。著者・査読の有無も未確認。"}}, {"id": "pr23", "rank": 23, "headline": "媽祖祭りが高齢観光客の幸福を高める経路", "title": "How Does Mazu Festival Affect the Well-being of Elderly Tourists?An Empirical Study from the Perspective of Restorative Experience", "url": "https://doi.org/10.21203/rs.3.rs-10760302/v1", "authors": "Mian Wang ほか", "venue": "Research Square (In Review)", "date": "2026-11-01", "apa": "Wang, M., Chen, W., Cao, Y., & Wang, L. (2026). How Does Mazu Festival Affect the Well-being of Elderly Tourists?An Empirical Study from the Perspective of Restorative Experience. https://doi.org/10.21203/rs.3.rs-10760302/v1", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossrefから取得）を使用", "preprint": true, "short": true, "p1": "民俗祭り（媽祖祭）に参加した高齢観光客で、回復をもたらす環境の知覚が幸福感を高める2つの経路を示した（抄録）。", "p3": "刺激-生体-反応（S-O-R）の枠組みに注意回復理論と場所への愛着を組み合わせた直列媒介モデルを、55歳以上の552人の質問紙調査とPLS-SEMで検証した（抄録）。", "p5": "回復的環境の知覚は、直接の感情的な経路と、場所への愛着と心理的回復を経る経路の両方で快楽的幸福感を高めた。わかりやすさ（legibility）の説明力が強く、短期参加では主に注意の回復が得られ、深い回復は滞在の短さで限られた（抄録）。", "fun": "森や海で心が休まるという研究は多いのですが、この研究は人でにぎわうお祭りでも心の回復が起きるかを調べました。にぎやかでも「わかりやすい」空間だと回復につながる一方、短い滞在では深い回復までは届かない、という時間の制約が見えてくる点が面白いです。", "unverified": "効果量などの数値は抄録からは不明。"}}, {"id": "pr24", "rank": 24, "headline": "フィレンツェの観光と再開発がもたらす紳士化", "title": "Gentrification and Tourism: Urban Renewal and Economic Impacts in Florence", "url": "https://doi.org/10.5281/zenodo.23822516", "authors": "Canacik, Gaye", "venue": "Zenodo", "date": "2026-10-31", "apa": "Canacik, G. (2026). Gentrification and Tourism: Urban Renewal and Economic Impacts in Florence [Zenodo]. https://doi.org/10.5281/ZENODO.23822516", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録を使用（ローマ・トル・ヴェルガータ大学の修士論文）", "preprint": true, "short": true, "p1": "フィレンツェの歴史地区での観光と紳士化（ジェントリフィケーション）の関係を、新自由主義的な都市政策と文化遺産の商品化の過程として論じた修士論文（抄録）。", "p3": "ハーヴェイの空間的回避、ズーキンの象徴経済、略奪による蓄積の概念を用い、イタリア都市の歴史と、観光・不動産市場・短期賃貸によるサン・ロレンツォやオルトラルノ地区の変化を分析した（抄録）。", "p5": "住宅価格の上昇、商業の再編、労働の不安定化、住民の追い出しなどの帰結を評価し、政策対応と住民主導の代替策を検討した（抄録）。", "fun": "観光客が増えると街が潤う一方で、家賃が上がって住民が住めなくなることがあります。この論文は、それを単なる経済成長の副作用ではなく、文化遺産を商品として売る政策の結果として読み解きます。美しい街並みの「価値」が誰のものになるのかという問いが面白いところです。", "unverified": "定量的なデータの有無と数値は抄録からは不明。"}}, {"id": "pr25", "rank": 25, "headline": "地盤災害の早期警報で観測の鮮度を危険度で価格付け", "title": "Risk-Priced Freshness Scheduling for Geohazard Early Warning over Coupled Sensor–Edge Observation Networks", "url": "https://doi.org/10.22541/essoar.15011371/v1", "authors": "Ardit Hoxha ほか", "venue": "ESS Open Archive", "date": "2026-11-01", "apa": "Hoxha, A., Vela, E., Duka, L., Kodra, A., & Baci, I. (2026). Risk-Priced Freshness Scheduling for Geohazard Early Warning over Coupled Sensor–Edge Observation Networks. https://doi.org/10.22541/essoar.15011371/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "ESS Open Archiveの抄録（Crossrefから取得）を使用", "preprint": true, "short": true, "p1": "地盤災害の早期警報で、観測データの「鮮度」の遅れを災害リスクで重みづけて通信と計算資源を割り当てる方式を提案した（抄録）。", "p3": "資源枠の地球科学的価値を予測するSIV-Net、期限と横取りの罰を入れた制約付きマルコフ決定過程をラグランジュ緩和してWhittle型の指標を得るPRISM、計算の分担先選択と統合するTANDEMからなる（抄録）。", "p5": "SMAP/MSL、Weather、EuroSAT、FloodNetでF1 0.9002/0.9648、MSE 0.168、正解率98.91%、mIoU 82.4を得て、見逃し率を2.71%から0.96%に下げ、新しい気候帯・センサ・季節でも元の性能の89%超を保った（抄録）。", "fun": "気象データが10分遅れても困りませんが、地震の始まりの10分遅れは致命的です。それなのに、従来の通信の割り当ては「古さ」をどれも同じ重さで扱っていました。データの古さを災害の危険度で値付けするという発想で、見逃しを減らせたというのが面白いところです。", "unverified": "比較対象の手法と各数値の対応は抄録からは不明。"}}, {"id": "pr26", "rank": 26, "headline": "監査人の交代とナイジェリア医療企業の利益調整", "title": "Auditor Rotation And Earnings Management Of Listed Healthcare Companies In Nigeria", "url": "https://doi.org/10.5281/zenodo.23814725", "authors": "Edidiong Godwin Asuquo ほか", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-10-30", "apa": "Edidiong Godwin Asuquo; Emmanuel O. Emenyi & Uwem E. Uwah. (2026). Auditor Rotation And Earnings Management Of Listed Healthcare Companies In Nigeria. Zenodo. https://doi.org/10.5281/ZENODO.23814725", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": true, "short": true, "p1": "題名からは、ナイジェリアの上場医療企業で、監査人の交代と利益調整（会計数値の裁量的な操作）の関係を調べた研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "会社の決算書をチェックする監査人が長く同じだと、なれ合いで甘くなるのではないか、という心配があります。逆に交代させると、新しい監査人はまだ会社をよく知りません。監査人を替えることが利益の『お化粧』を減らすのか増やすのか、という問いが題名から読み取れます。", "unverified": "手法・データ・結果はすべて未確認。"}}, {"id": "pr27", "rank": 27, "headline": "個別価格設定は効率を上げ消費者厚生を下げる", "title": "Personalized Pricing: Efficiency Gains At The Expense Of Consumer Welfare", "url": "https://doi.org/10.5281/zenodo.23851207", "authors": "Haddad ほか", "venue": "Zenodo", "date": "2026-11-01", "apa": "Haddad, M., & Al-Qaisi, A. (2026). Personalized Pricing: Efficiency Gains At The Expense Of Consumer Welfare. Zenodo. https://doi.org/10.5281/ZENODO.23851207", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "題名", "basis_note": "題名のみ。抄録・本文とも入手できず", "preprint": true, "short": true, "p1": "題名からは、客ごとに価格を変える個別価格設定が、効率を高める一方で消費者の厚生を下げると主張する研究と読める。", "p3": "未確認（抄録・本文を入手できず）", "p5": "未確認（抄録・本文を入手できず）", "fun": "同じ商品でも、人によって払ってもいい金額は違います。お店がそれを正確に見抜いて一人ひとりに値段を付けると、売れ残りは減るかもしれませんが、その得は誰のものになるのでしょうか。『全体として効率的』と『買う人にとって良い』が食い違うという問いが題名から読み取れます。", "unverified": "手法・データ・結果はすべて未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "経済学", "headline": "26万本の論文で経済学の合理性概念の歴史を追う", "title": "One Sentence at a Time: A Quantitative History of Rationality in Economic Thought", "url": "https://econpapers.repec.org/RePEc:hal:journl:hal-05431080", "authors": "Thomas Delcey ほか", "venue": "RePEc NEP", "date": "2026-10-19", "why": "1900〜2009年の経済学論文約26万本をLLMによる意味解析と書誌ネットワークで分析し、合理性概念の変遷を定量的に描いた学説史の新手法。"}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "同じ現金給付契約が受給者を逆の立場に置く", "title": "Presuming or Building Capacity? Contractualisation, Matrices of Agency and the Position of Recipients in Local Welfare", "url": "https://doi.org/10.31235/osf.io/6t5ws_v1", "authors": "Tommaso Vitale", "venue": "SocArXiv", "date": "2026-11-01", "apa": "Vitale, T. (2026). Presuming or Building Capacity? Contractualisation, Matrices of Agency and the Position of Recipients in Local Welfare. https://doi.org/10.31235/osf.io/6t5ws_v1", "why": "イタリアの2つの地域福祉の現金給付を比較し、同じ契約形式でも行政の規制役割しだいで受給者の主体性が正反対に位置づけられることを示した政策手段の分析。"}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "車両サスペンションの同調で減衰橋の振動を抑える", "title": "Tuning Moving Vehicle Suspensions for Vibration Mitigation of Damped Bridges", "url": "https://doi.org/10.1142/s1758825126501073", "authors": "X CHENG ほか", "venue": "International Journal of Applied Mechanics", "date": "2026-10-31", "citescore": 4.3, "citescore_year": "2025", "apa": "Cheng, X., Tan, C. A., Michael McFarland, D., Hua, X., & Lu, H. (2026). Tun rt Barriers Among Newly Arrived Immigrant Family Caregivers With Limited English Proficiency. Health & Social Care in the Community, 2026(1). https://doi.org/10.1155/hsc/6905711", "theme": "包摂的コミュニティ・社会", "theme_no": 4}, {"id": "jr14", "rank": 14, "headline": "都市成長境界の15年分228文献を総覧する", "title": "Urban Growth Boundaries in Urban Development: A Holistic Review of Literature From 2011 to 2025", "url": "https://doi.org/10.1111/joes.70180", "authors": "Yingyi. Ya ほか", "venue": "Journal of Economic Surveys", "date": "2026-11-01", "sjr": 2.483, "citescore": 14.1, "citescore_year": "2025", "apa": "Ya, Yingyi., Chen, Jiamin., Lin, Muxi., Li, C. Zhengdao., & Tam, V. W. Y. (2026). Urban Growth Boundaries in Urban Development: A Holistic Review of Literature From 2011 to 2025. Journal of Economic Surveys. https://doi.org/10.1111/joes.70180", "theme": "都市・インフラ政策", "theme_no": 6}, {"id": "jr15", "rank": 15, "headline": "店舗規模で品質と満足の関係が変わるかを検証", "title": "Relationship between Service Quality and Customer Satisfaction: Does Business Size Matter?", "url": "https://doi.org/10.37745/ijbmr.2013/vol14n95982", "authors": "Assumpta Chiwango Nalitolela ほか", "venue": "International Journal of Business and Management Review", "date": "2026-11-01", "apa": "Nalitolela, A. C., Shayo, F., & Matonya, J. (2026). Relationship between Service Quality and Customer Satisfaction: Does Business Size Matter? International Journal of Business and Management Review, 14(9), 59–82. https://doi.org/10.37745/ijbmr.2013/vol14n95982", "theme": "サービス・マーケティング", "theme_no": 3}, {"id": "jr16", "rank": 16, "headline": "GEEとSHAPでネパールの斜面崩壊危険度を地図化", "title": "A GeoAI framework for landslide susceptibility mapping using Google Earth Engine, ensemble machine learning, and SHAP explainable AI", "url": "https://doi.org/10.3389/feart.2026.1961388", "authors": "Pawan Thapa", "venue": "Frontiers in Earth Science", "date": "2026-10-30", "citescore": 4.9, "citescore_year": "2025", "apa": "Thapa, P. (2026). A GeoAI framework for landslide susceptibility mapping using Google Earth Engine, ensemble machine learning, and SHAP explainable AI. Frontiers in Earth Science, 14. https://doi.org/10.3389/feart.2026.1961388", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "無料の衛星データ、クラウド計算（Google Earth Engine）、説明可能な機械学習を組み合わせ、ネパール中部の斜面崩壊危険度地図を再現可能な手順で作った（抄録）。", "p3": "崩壊4,743地点と非崩壊4,736地点の計9,479観測に、標高・傾斜・方位・降雨・NDVI・土地被覆・人口密度の7因子を付け、RFとXGBoostを層化分割と10分割交差検証で学習し、SHAPで寄与を解釈した（抄録）。", "p5": "XGBoostは正解率88.3%・ROC-AUC 0.952でRF（87.9%・0.945）を上回った。最も効いた因子は傾斜で、次いで降雨（16%）、標高（15%）。高危険域はシンドゥパルチョークなど6郡に集中した（抄録）。", "fun": "山の斜面がどこで崩れやすいかを、誰でも使える衛星データとクラウド上の計算だけで地図にした研究です。機械学習は「なぜその答えか」が見えにくいのですが、SHAPという道具で、傾きが一番効いていると説明できるようにしました。データの少ない地域でも防災地図を作れる点が面白いです。", "unverified": "空間的な交差検証の有無は抄録からは不明。"}}, {"id": "jr17", "rank": 17, "headline": "病院の患者満足をサービス回復が媒介する", "title": "Beyond Service Quality: Service Recovery Mediates Orientation, Experience, and Customer Satisfaction", "url": "https://doi.org/10.59653/jbmed.v4i03.2917", "authors": "Deby Santyo Rusandy", "venue": "Journal of Business Management and Economic Development", "date": "2026-11-01", "apa": "Rusandy, D. S. (2026). Beyond Service Quality: Service Recovery Mediates Orientation, Experience, and Customer Satisfaction. Journal of Business Management and Economic Development, 4(03), 1243–1263. https://doi.org/10.59653/jbmed.v4i03.2917", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "病院で、職員の顧客志向と患者の体験が、サービスの失敗からの回復（サービス回復）を通じて患者満足を高めることを示した（抄録）。", "p3": "サービス回復パラドックスと期待確認理論に基づくモデルを、インドネシアの公立病院の患者266人の調査とPLS-SEMで検証した（抄録）。", "p5": "職員の顧客志向と顧客体験はサービス回復と満足を直接高め、サービス回復は両者と満足の関係を補完的に媒介した（抄録）。", "fun": "病院でもミスや待たせすぎなどの「サービスの失敗」は起こります。この研究は、普段の対応の良さだけでなく、失敗したときにどう立て直すかが患者の満足を左右すると示しました。うまく謝って直すと、失敗しなかったとき以上に満足することもある、という考え方が背景にあるのが面白い点です。", "unverified": "効果の大きさ（係数）は抄録からは不明。単一病院の調査。"}}, {"id": "jr18", "rank": 18, "headline": "財務困窮がグリーンウォッシングを促すかを検証", "title": "Dampak Kesulitan Keuangan terhadap Indikasi Praktik Greenwashing: Analisis Peran Mediasi Inovasi Hijau", "url": "https://doi.org/10.32502/myws2b19", "authors": "Steve Ivant Immanuel Hallen ほか", "venue": "BALANCE Jurnal Akuntansi dan Bisnis", "date": "2026-11-01", "apa": "Hallen, S. I. I., & Widianingsih, L. P. (2026). Dampak Kesulitan Keuangan terhadap Indikasi Praktik <i>Greenwashing<\/i>: Analisis Peran Mediasi Inovasi Hijau. Balance : Jurnal Akuntansi Dan Bisnis, 11(2), 233–252. https://doi.org/10.32502/myws2b19", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用（本文はインドネシア語）", "preprint": false, "short": true, "p1": "インドネシアのエネルギー企業で、財務困窮がグリーンウォッシング（見せかけの環境配慮）を促すかを検証し、関連は見られなかったと報告した（抄録）。", "p3": "2020〜2024年の上場エネルギー企業87社（外れ値除外後267観測）で、グリーンイノベーションを媒介変数とする重回帰とパス解析を行った（抄録）。", "p5": "財務困窮はグリーンウォッシングの兆候にもグリーンイノベーションにも有意な影響がなく、媒介も見られなかった。企業規模はグリーンウォッシングの兆候と有意に正に関連した（抄録）。", "fun": "お金に困った会社は、実際以上に環境に優しいふりをして評判を保とうとするのではないか、という予想があります。ところがこの研究では、その関係は見られず、むしろ大きい会社ほど見せかけの兆候が強かったという結果でした。予想が外れたことをそのまま報告している点が面白いです。", "unverified": "グリーンウォッシングの兆候の測り方は抄録からは不明。"}}, {"id": "jr19", "rank": 19, "headline": "修正Altman Zで建設大手の破綻危険を4年追う", "title": "Analisis Financial Distress PT. Wijaya Karya (Persero) Tbk Menggunakan Model Altman Z-Score Modifikasi", "url": "https://doi.org/10.32502/1hwmv425", "authors": "Keishia Alifa Zahra ほか", "venue": "MOTIVASI", "date": "2026-11-01", "apa": "Zahra, K. A., & Puspita, V. A. (2026). <b>Analisis <i>Financial Distress<\/i> PT. Wijaya Karya (Persero) Tbk Menggunakan Model <i>Altman Z-Score<\/i> Modifikasi <\/b> Motivasi, 11(2), 120–132. https://doi.org/10.32502/1hwmv425", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "インドネシアの国営建設大手WIKAの2021〜2024年の財務状態を修正Altman Zスコアで評価し、全期間で「困窮域」にあったと示した（抄録）。", "p3": "年次財務諸表から、運転資本/総資産、利益剰余金/総資産、EBIT/総資産、自己資本簿価/総負債の4比率を計算する記述的分析（抄録）。", "p5": "観測期間を通じて困窮域にとどまり、流動性・収益性・資本構成の弱さを反映していた（抄録）。", "fun": "会社が倒産しそうかどうかを、決算書の4つの比率を組み合わせた一つの点数で判断するのがAltman Zスコアです。1960年代に作られた古い指標ですが、今でも早期警報として使われています。大きな国営企業でも4年続けて危険域にいたという事例は、点数の分かりやすさと怖さの両方を感じさせます。", "unverified": "各年のZスコアの値は抄録からは不明。"}}, {"id": "jr20", "rank": 20, "headline": "心理的安全性が教職員の幸福と革新を高める", "title": "The Impact of Psychological Safety on Employees Well-being and Innovation in the Educational Sector of Karachi", "url": "https://doi.org/10.67785/pjpp.9.413", "authors": "Amna Anwar ほか", "venue": "Pakistan Journal of Positive Psychology", "date": "2026-11-01", "apa": "Amna Anwar, & Sana Hussain. (2026). The Impact of Psychological Safety on Employees Well-being and Innovation in the Educational Sector of Karachi. Pakistan Journal of Positive Psychology, 3(9), 128–137. https://doi.org/10.67785/pjpp.9.413", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "パキスタン・カラチの教育機関の職員で、心理的安全性が幸福感と革新的行動を高め、幸福感がその一部を媒介することを示した（抄録）。", "p3": "250人の自己記入式調査の横断研究。心理的安全性はEdmondson、幸福感はRyff、革新的行動はJanssenの尺度で測り、相関・回帰・媒介分析を行った（抄録）。", "p5": "三者の間に有意な正の関連があり、心理的安全性は幸福感と革新を予測し、幸福感は心理的安全性と革新の関係を部分的に媒介した（抄録）。", "fun": "「こんなことを言ったら笑われるかも」と心配せずに発言できる職場の雰囲気を、心理的安全性と呼びます。この研究は、それが働く人の心の健康と新しいアイデアの両方につながると示しました。ただし同じ時点の自己申告なので、どちらが原因かまでは決められない点にも注意が要ります。", "unverified": "係数の大きさは抄録からは不明。横断調査のため因果は未確認。"}}, {"id": "jr21", "rank": 21, "headline": "AI受容と革新行動を倫理的風土が調整する理論模型", "title": "A Proposed Model of the Relationship between Artificial Intelligence Acceptance and Innovative Work Behavior: The Moderating Role of Ethical Climate", "url": "https://doi.org/10.70877/joma.51", "authors": "Yavuz Selim Özyer", "venue": "Journal of Management Archive", "date": "2026-10-31", "apa": "Özyer, Y. S. (2026). Yapay Zeka Kabulü ve Yenilikçi İş Davranışı Arasındaki İlişkiye Yönelik Bir Model Önerisi: Etik İklimin Düzenleyici Rolü. Journal of Management Archive, 3(2), 67–82. https://doi.org/10.70877/joma.51", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "従業員のAI受容が革新的な働き方を促し、倫理的な組織風土がその関係を強めるという理論モデルを提案した（抄録）。", "p3": "技術受容モデル、仕事の要求度-資源モデル、社会的情報処理理論を統合した命題ベースの理論的アプローチ（抄録）。", "p5": "実証データはなく、AI受容が革新的行動に正の影響を与え、倫理的風土がそれを強めるという命題を示した（抄録）。", "fun": "職場にAIが入ってきたとき、それを受け入れる人ほど新しい工夫をするのでしょうか。この論文は、そこに「会社の倫理的な雰囲気」が効くと考えました。AIを使ってよいか不安な職場では受け入れても工夫につながりにくい、という見立ては、技術と組織の文化の関係を考えるうえで面白い問いです。", "unverified": "実証データはなく、命題は未検証。"}}, {"id": "jr22", "rank": 22, "headline": "Z世代の定着を適合と裁量が幸福経由で高める", "title": "The Effects of Person–Organization Fit and Work Discretion on Generation Z Employees' Intention to Stay: The Mediating Role of Employee Well-Being", "url": "https://doi.org/10.35870/ijmsit.v6i2.8721", "authors": "Diah Amelia Azzahra ほか", "venue": "International Journal of Management Science and Information Technology", "date": "2026-11-01", "apa": "Azzahra, D. A., & Fajri, A. (2026). The Effects of Person–Organization Fit and Work Discretion on Generation Z Employees’ Intention to Stay: The Mediating Role of Employee Well-Being. International Journal of Management Science and Information Technology, 6(2), 2965–2982. https://doi.org/10.35870/ijmsit.v6i2.8721", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "インドネシアのZ世代の従業員で、組織との価値の適合と仕事の裁量が、幸福感を通じて残留意思を高めることを示した（抄録）。", "p3": "140人の自己記入式調査の横断研究で、SmartPLS 4によるPLS-SEMで分析した（抄録）。", "p5": "個人-組織適合と裁量は幸福感と残留意思に正の有意な影響を持ち、幸福感がその影響を媒介した（抄録）。", "fun": "若い世代は「会社の価値観が自分と合うか」「仕事のやり方を自分で決められるか」を重視すると言われます。この研究は、それらが働く人の心の満足を高め、その結果として辞めずにいたい気持ちにつながると示しました。お金以外の理由で人が職場に残る仕組みを考えるきっかけになる点が面白いです。", "unverified": "係数の大きさは抄録からは不明。標本は140人。"}}, {"id": "jr23", "rank": 23, "headline": "AIによる適応的リスキリングの3つの仕組み", "title": "Adaptive AI-Driven Reskilling as a Bridge between Digital Transformation and Employee Competency Development", "url": "https://doi.org/10.56557/jgembr/2026/v18i311295", "authors": "Dimas Firmansyah ほか", "venue": "Journal of Global Economics, Management and Business Research", "date": "2026-10-30", "apa": "Firmansyah, D., & Phuliza, Y. (2026). Adaptive AI-Driven Reskilling as a Bridge between Digital Transformation and Employee Competency Development. Journal of Global Economics, Management and Business Research, 18(3), 541–559. https://doi.org/10.56557/jgembr/2026/v18i311295", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用（既存研究を整理した論考）", "preprint": false, "short": true, "p1": "AIによる適応的なリスキリング（学び直し）が、デジタル化と従業員の能力開発をつなぐ3つの仕組みを、近年の研究から整理した論考（抄録）。", "p3": "データに基づく技能差の特定、個別化された学習経路、実時間のフィードバックという3つの仕組みについて、2024〜2026年の研究を整理した（抄録）。", "p5": "引用研究では、AIを通じた関与が技能開発の最も強い予測因子（β=0.371）、動的な学習経路で修了率が8〜14%上昇。訓練の完全自動化は自律性や意欲を下げ、部分的自動化のほうが良かったとする（抄録、いずれも他研究の数値）。", "fun": "AIが一人ひとりに合わせて学び直しの道筋を作ってくれる仕組みが広がっています。ところが、すべてを自動にすると、かえってやる気や自分で決める感覚が落ちるという研究もあるそうです。AIは人の成長を置き換えるのではなく、つなぐ道具だという整理が面白いところです。", "unverified": "数値はすべて引用された他研究のもので、原典は未確認。"}}, {"id": "jr24", "rank": 24, "headline": "高齢者の暑熱対応力を虚弱・エネルギー・社会資源で", "title": "New horizons in adaptive capacity and heat-related health in older people: integrating frailty, energy insecurity and social resources", "url": "https://doi.org/10.1093/ageing/afag315", "authors": "Laura Petraglia ほか", "venue": "Age and Ageing", "date": "2026-11-01", "sjr": 2.152, "citescore": 11.2, "citescore_year": "2025", "apa": "Petraglia, L., Conte, M., Parisi, V., Femminella, G. D., & Leosco, D. (2026). New horizons in adaptive capacity and heat-related health in older people: integrating frailty, energy insecurity and social resources. Age and Ageing, 55(11). https://doi.org/10.1093/ageing/afag315", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "出版社サイトの抄録を使用（叙述的総説）", "preprint": false, "short": true, "p1": "高齢者が猛暑に対応する力（適応能力）を、虚弱、エネルギー不安、社会的資源を統合して捉える枠組みを示した総説（抄録）。", "p3": "老年医学・環境保健・気候科学の文献と機関報告を構造化した非系統的な検索で集め、叙述的に統合した（抄録）。", "p5": "虚弱、内在的能力、住宅、エネルギーの支払い能力、社会的虚弱が、危険の認識、保護へのアクセス、対応の力に影響すると整理し、夏の冷房貧困に注目した。暑熱に合わせた高齢者総合機能評価の開発の土台を提案した（抄録）。", "fun": "猛暑で一番危ないのは高齢者ですが、その原因は体の弱さだけではありません。電気代が払えずエアコンを使えない、頼れる人がいない、といった暮らしの条件も効いてきます。体と社会の両方の弱さを「適応する力」という一つの物差しでつなごうとする発想が面白いです。", "unverified": "総説のため新しいデータはない。"}}, {"id": "jr25", "rank": 25, "headline": "受刑者の向社会的価値を測る尺度の開発と検証", "title": "Development and psychometric properties of the Prison Fellowship Good Citizenship Inventory (GCI): a values-based assessment for correctional settings.", "url": "https://doi.org/10.1108/ijoph-11-2025-0093", "authors": "Denhof M ほか", "venue": "International journal of prison health", "date": "2026-11-02", "apa": "Denhof, M., Scott, L., Hunsucker, C., King, A., & Ferry, T. (2026). Development and psychometric properties of the Prison Fellowship Good Citizenship Inventory (GCI): a values-based assessment for correctional settings. International Journal of Prison Health, 1–16. https://doi.org/10.1108/ijoph-11-2025-0093", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Europe PMCの抄録を使用", "preprint": false, "short": true, "p1": "受刑者が6つの向社会的価値をどれだけ内面化したかを測る、欠点ではなく強みに注目した尺度（GCI）を開発し、心理測定上の性質を検証した（抄録）。", "p3": "項目作成・予備調査・専門家審査を経て、5つの州立矯正施設の受刑者559人に実施し、主因子法と確認的因子分析、内的一貫性、性別間の測定不変性、収束妥当性、基準関連妥当性を調べた（抄録）。", "p5": "責任と誠実が1因子にまとまる5因子構造が支持され、信頼性α=0.66〜0.86、性別間の測定等価性が確認された。既存の性格・責任尺度とr=0.42〜0.57で相関した（抄録）。", "fun": "刑務所のプログラムの効果は、ふつう「再び罪を犯したか」で測られます。この研究は逆に、責任感や地域への貢献などの『良い価値』がどれだけ育ったかを測る物差しを作りました。悪い点を減らすだけでなく、良い点を伸ばすことを数字で見ようとする発想の転換が面白いところです。", "unverified": "基準関連妥当性の係数は抄録からは不明。"}}, {"id": "jr26", "rank": 26, "headline": "インドネシアのスマートシティ政策と失業率", "title": "The Effect of the Smartcity Policy on the Open Unemployment Rate in Java Bali in 2017-2021", "url": "https://jdess.ub.ac.id/index.php/jdess/article/view/757", "authors": "Raditya Muzakki Mashuri", "venue": "Journal of Development Economic and Social Studies.", "date": "2026-10-30", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "OpenAlexに登録された抄録を使用", "preprint": false, "short": true, "p1": "インドネシアのジャワ・バリ地域で、スマートシティ政策の期間（2017〜2021年）の地域経済指標と公開失業率の関係を分析した（抄録）。", "p3": "県・市のパネルデータで、1人当たり域内総生産、総固定資本形成、人口密度、携帯基地局数、医療施設数、学校数を説明変数とし、Chow検定とHausman検定で固定効果モデルを選んだ（抄録）。", "p5": "1人当たり域内総生産、人口密度、基地局数は失業率と正に、総固定資本形成と医療施設数は負に関連し、学校数は有意でなかった（抄録）。", "fun": "町じゅうにデジタル設備を整えれば仕事が増える、と期待されがちです。ところがこの分析では、携帯電話の基地局が多い地域ほど失業率が高いという、意外な関連が出ました。設備だけでは雇用は生まれず、人の技能が追いつく必要があるという解釈が示されている点が面白いです。", "unverified": "スマートシティ政策そのものの効果を識別する設計かどうかは抄録からは不明。"}}, {"id": "jr27", "rank": 27, "headline": "ホーチミンの大学生の分別行動を計画行動理論で", "title": "Waste sorting behavior among university students: A step towards green urban development", "url": "https://doi.org/10.71374/jfar.v26.i1.14", "authors": "Thi Thoan Le ほか", "venue": "Journal of Finance and Accounting Research", "date": "2026-10-30", "apa": "Le, T. T., & Nguyen, T. N. (2026). Waste sorting behavior among university students: A step towards green urban development. Journal of Finance and Accounting Research, 26(38), 70–73. https://doi.org/10.71374/jfar.v26.i1.14", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "ホーチミン市の大学生のごみ分別行動の要因を、拡張した計画行動理論で調べた（抄録）。", "p3": "環境意識、知覚された行動統制、個人的道徳規範が意図を通じて分別行動に至るモデルを、478人の有効回答とSmartPLSで分析した（抄録）。", "p5": "環境意識、行動統制、道徳規範はいずれも意図と分別行動に有意に影響した（抄録）。", "fun": "環境問題をよく知っている人でも、実際にごみを分けるとは限りません。この研究は、知識だけでなく「自分でもできる」という感覚や「やるべきだ」という気持ちが行動を後押しすると示しました。知っていることとやることの間のすき間を埋めるものは何か、という問いが面白いところです。", "unverified": "係数の大きさは抄録からは不明。行動は自己申告。"}}, {"id": "jr28", "rank": 28, "headline": "長居客がカフェの混雑感と公平感を損なうか", "title": "LOW-PURCHASE LONG-STAY BEHAVIOUR AT ZUS COFFEE: CROWDING, FAIRNESS AND REVISIT INTENTION", "url": "https://doi.org/10.55197/qjssh.v7i5.1401", "authors": "ZHENDONG JIANG ほか", "venue": "Quantum Journal of Social Sciences and Humanities", "date": "2026-10-31", "apa": "JIANG, Z., & ARIFFIN, S. Z. M. (2026). LOW-PURCHASE LONG-STAY B       }
      if (ex.unverified) card.appendChild(labelled("unverified", "確認できなかった点", ex.unverified));
    } else if (it.summary) {
      if (it.kind === "data") {
        var dbasis = el("p", "basis");
        dbasis.appendChild(el("span", "pill", "オープンデータ"));
        dbasis.appendChild(el("span", null, "リポジトリに登録された説明をもとに要約"));
        card.appendChild(dbasis);
      }
      card.appendChild(el("p", "summary", it.summary));
      if (it.venue === "e-Stat") card.appendChild(el("p", "meta", "このサービスは、政府統計総合窓口(e-Stat)のAPI機能を使用していますが、サービスの内容は国によって保証されたものではありません。"));
    } else {
      card.appendChild(el("p", "empty", "この論文の解説はまだありません。"));
    }
    if (it.why) card.appendChild(labelled("reason", "重要な理由", it.why));
    var orig = el("p", "orig");
    var a = el("a", null, it.title); a.href = it.url; a.target = "_blank"; a.rel = "noopener";
    orig.appendChild(a); card.appendChild(orig);
    // three texts to hand on: a question for an AI, a note for another person, a reproduction request for an AI
    var askrow = el("div", "askrow"), askStatus = el("p", "askstatus");
    askStatus.setAttribute("aria-live", "polite");
    HANDOFFS.forEach(function (h) {
      var b = el("button", "ask"); b.type = "button";
      h.label.forEach(function (part, i) {
        if (i) b.appendChild(document.createElement("wbr"));
        b.appendChild(document.createTextNode(part));
      });
      b.addEventListener("click", function () { copyText(h.make(it), askStatus, h.done); });
      askrow.appendChild(b);
    });
    card.appendChild(askrow); card.appendChild(askStatus);
    var metrics = [it.sjr ? "SJR " + it.sjr : "", it.citescore ? "CiteScore " + it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "") : ""].filter(Boolean).join("・");
    var venue = (it.venue || "") + (metrics ? "（" + metrics + "）" : "");
    card.appendChild(el("p", "meta", [it.authors, venue, it.date].filter(Boolean).join("｜") + (it.fromDate ? "｜" + it.fromDate + " のレポート" : "")));
    if (state.view === views[0] && state.index === 0 && REPORT.intro) card.appendChild(el("p", "intro", REPORT.intro));
    stage.appendChild(card);
    updateControls();
  }

  function renderList() {
    stage.innerHTML = "";
    var wrap = el("div", "list");
    parts.forEach(function (p) {
      var list = items(p[0]);
      wrap.appendChild(el("div", "label", p[2] + "（" + list.length + "）"));
      list.forEach(function (it, i) {
        var row = el("button", "row"); row.type = "button";
        row.appendChild(el("span", "n", String(i + 1)));
        var box = el("span");
        box.appendChild(el("div", "h", (marks[it.url] ? "★ " : "") + (it.headline || it.title)));
        var basis = it.explain ? ((it.explain.short ? "短い・" : "") + (it.explain.basis === "本文" ? "本文" : it.explain.basis === "抄録" ? "抄録" : "題名のみ")) : (it.kind === "data" ? "データ" : "");
        box.appendChild(el("div", "s", [it.theme || it.field, it.venue, basis, it.explain && it.explain.preprint ? "未査読" : ""].filter(Boolean).join("｜")));
        row.appendChild(box);
        row.addEventListener("click", function () { select(p[0]); state.index = i; render(); window.scrollTo(0, 0); });
        wrap.appendChild(row);
      });
    });
    stage.appendChild(wrap);
    updateControls();
  }

  function updateControls() {
    var list = items(state.view), card = state.view !== "list" && list.length > 0;
    document.getElementById("prev").disabled = !card || state.index <= 0;
    document.getElementById("next").disabled = !card || state.index >= list.length - 1;
    document.getElementById("speak").disabled = !card || !("speechSynthesis" in window);
    document.getElementById("auto").disabled = !card || !("speechSynthesis" in window);
    var m = document.getElementById("mark"), it = card ? current() : null;
    m.disabled = !card;
    var on = !!(it && marks[it.url]);
    m.setAttribute("aria-pressed", String(on)); m.textContent = on ? "★" : "☆";
  }

  function render() { renderTabs(); if (state.view === "list") renderList(); else renderCard(); save(); }

  function go(delta) {
    var list = items(state.view);
    var n = Math.max(0, Math.min(state.index + delta, list.length - 1));
    if (n !== state.index) { state.index = n; stopSpeech(false); render(); window.scrollTo(0, 0); }
  }

  // speech
  var auto = false, wakeLock = null, rate = store.get("pd-rate", 1.1);
  function jaVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (v) { return /^ja/i.test(v.lang); })[0] || null;
  }
  function textOf(it) {
    var out = [it.headline || it.title], ex = it.explain;
    if (ex) {
      LABELS.forEach(function (l) { if (ex[l[0]]) out.push(l[1].replace(/^\(\d\)\s*/, "") + "。" + ex[l[0]]); });
    } else if (it.summary && it.summary.indexOf("概要なし") !== 0) {
      out.push(it.summary);
    }
    if (it.why) out.push("重要な理由。" + it.why);
    return out.join(" ");
  }
  function speak() {
    if (!("speechSynthesis" in window)) return;
    var it = current(); if (!it) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(textOf(it));
    u.lang = "ja-JP"; u.rate = rate; var v = jaVoice(); if (v) u.voice = v;
    u.onend = function () {
      if (!auto) return;
      var list = items(state.view);
      if (state.index < list.length - 1) { state.index++; render(); window.scrollTo(0, 0); setTimeout(speak, 600); }
      else { setAuto(false); }
    };
    speechSynthesis.speak(u);
  }
  function stopSpeech(keepAuto) { if (window.speechSynthesis) speechSynthesis.cancel(); if (!keepAuto && auto) setAuto(false); }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    if (on && navigator.wakeLock) { navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {}); }
    if (!on && wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.getElementById("speak").addEventListener("click", function () {
    if (window.speechSynthesis && speechSynthesis.speaking) { stopSpeech(false); } else { speak(); }
  });
  document.getElementById("auto").addEventListener("click", function () {
    if (auto) { setAuto(false); stopSpeech(true); } else { setAuto(true); speak(); }
  });

  // marks
  document.getElementById("mark").addEventListener("click", function () {
    var it = current(); if (!it) return;
    if (marks[it.url]) { delete marks[it.url]; }
    else {
      marks[it.url] = { headline: it.headline, title: it.title, url: it.url, summary: it.summary, why: it.why, explain: it.explain,
        theme: it.theme, theme_no: it.theme_no, field: it.field, kind: it.kind, venue: it.venue, sjr: it.sjr, citescore: it.citescore, citescore_year: it.citescore_year, apa: it.apa, authors: it.authors, date: it.date,
        fromDate: it.fromDate || REPORT.date, markedAt: new Date().toISOString() };
    }
    store.set("pd-marks-v1", marks);
    if (state.view === "marks") render(); else updateControls();
  });

  // text to send to another person: the interesting point in Japanese, the link, the citation and the CiteScore
  function shareText(it) {
    var ex = it.explain || {}, lines = [];
    if (ex.fun) lines.push("面白いポイント", ex.fun, "");
    else if (it.summary) lines.push(it.kind === "data" ? "データの説明" : "要約", it.summary, "");
    lines.push(it.url);
    lines.push("APA: " + (it.apa || "（取得できていません。上のリンクのDOIから引用情報を取り寄せてください）"));
    if (it.kind !== "data") {
      lines.push("Journal CiteScore: " + (it.citescore
        ? it.citescore + (it.citescore_year ? "（" + it.citescore_year + "）" : "")
        : (ex.preprint ? "（未査読プレプリント。掲載誌なし）" : "（Scopus収録なし、または未取得）")));
    }
    return lines.join("\n");
  }
  // phones and tablets have a share menu (AI apps, messengers, mail): there it is offered after the copy
  var CAN_SHARE = typeof navigator.share === "function" && !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  // copies text and says so under the card; when the clipboard is blocked, shows the text to copy by hand
  function copyText(text, status, ok) {
    var card = status.parentNode;
    [].forEach.call(card.querySelectorAll(".copybox, .sharemenu"), function (n) { n.remove(); });
    var offerShare = function () {
      if (!CAN_SHARE) return;
      var b = el("button", "ask sharemenu", "共有メニューで送る"); b.type = "button";
      b.addEventListener("click", function () { navigator.share({ text: text }).catch(function () {}); });
      card.insertBefore(b, status.nextSibling);
    };
    var byHand = function () {
      var ta = document.createElement("textarea");
      ta.className = "copybox"; ta.rows = 8; ta.value = text; ta.readOnly = false;
      status.textContent = "自動でコピーできませんでした。下の文を選んでコピーしてください。";
      card.insertBefore(ta, status.nextSibling);
      offerShare();
      ta.focus(); ta.select();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { status.textContent = ok; offerShare(); }, byHand);
    } else { byHand(); }
  }

  // the requests are pasted into an AI chat (Claude, ChatGPT, Gemini, or a coding agent), on a phone too:
  // self-contained, with no skills, local files or PC tools; the question follows the owner's paper-review rules
  var QUESTION = [
    "次の論文を、私向けにわかりやすく解説してください。",
    "",
    "- 論文：{paper}",
    "- 読者：私（研究者。この論文の分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）があれば、それも使う。",
    "- 本文が読めず、抄録や紹介文しか読めないときは、そのことを最初に書き、読めた範囲だけで解説する。読めていない部分を推測で埋めない。",
    "",
    "説明の順序",
    "(1) 一言で：この論文で何ができるようになったか（題名の言い換えにしない）",
    "(2) 問い：何が課題で、従来の方法のどこが足りないか",
    "(3) 手法：入力・出力と、なぜそれで解けるかの直観。核の式は意味を言葉で添え、具体例を一つ通す",
    "(4) 検証：データ・比較対象・評価指標。何をもって良いとするかを結果より先に示す",
    "(5) 結果：主要な図表の読み方（軸、どこを見るか、何が言えるか）と数値",
    "(6) 限界：著者が認める限界と、残る疑問（私の研究への示唆は、聞いたときだけ書く）",
    "",
    "書き方",
    "- 数値・主張には節・図・表・ページを添える（例：「（§4.2、図5）」）。論文の主張、補った背景、あなたの解釈を区別する。",
    "- 数値を孫引きしない。未査読のプレプリントならその旨を書く。専門用語は初出で短く定義し、英語の原語を添える。比喩で正確さを落とさない。",
    "- 答える前に、書いた数値・図表番号・主張を原文と照らし合わせる。確かめられなかった箇所は「未確認」と書く。",
    "- スマホで読むので、表や長い数式は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。",
    "- 最後に「確認できなかった点」を1〜3行で書く（なければ「なし」）。"
  ].join("\n");
  var QUESTION_DATA = [
    "次のデータセットについて、私向けにわかりやすく解説してください。",
    "",
    "- データ：{paper}",
    "- 読者：私（研究者。このデータの分野の専門家とは限らない）",
    "",
    "進め方",
    "- 上のリンクを開いて説明ページを読む。関連する論文やコードが示されていれば、それも確かめる。",
    "- 説明ページに書かれていないことは推測で埋めず、「記載なし」と書く。",
    "",
    "説明の順序",
    "(1) 一言で：何のデータで、何に使えるか",
    "(2) 作り方：誰が、いつ、どうやって集めたか（出典・期間・対象）",
    "(3) 中身：ファイル、変数、単位、件数、欠損",
    "(4) 使い方：どんな分析や研究に使えるか。具体例を一つ",
    "(5) 注意：偏り、利用条件（ライセンス）、関連する論文との関係",
    "(6) 確認できなかった点：1〜3行（なければ「なし」）",
    "",
    "書き方",
    "- スマホで読むので、表は使わず、(1)〜(6)の見出しと短い段落で、日本語のチャットの文章として書く（ファイルは作らない）。"
  ].join("\n");
  var REPRO = [
    "次の論文の主要な結果を、自分で書いたコードで再現してください。",
    "",
    "- 論文：{paper}",
    "- 目的：中心となる主張を1つ選び、それを示す表か図の数値を再現できるかを確かめる",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 原文を読む。無料で読めるPDFや別の版（arXiv・著者版など）、公式のコードとデータ（GitHub、補足資料、データのリポジトリ）があるかを最初に確かめ、あれば場所とライセンスを書く。",
    "2. 再現する対象を決める。中心となる主張と、それを示す表か図を1つ選び、節・表・図の番号と選んだ理由を書く。合成や測定など実験室での作業が中心の論文では、実験の手順は対象にせず、公開データの再解析や論文中の計算・シミュレーションに絞る。計算で再現できるものがなければ、そう書いて終える。",
    "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
