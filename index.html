<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">

<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>

<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>
    </div>

    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>

    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>

    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>

    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

: true, "short": true, "p1": "自動運転車のGNSS測位を機械学習で補正・監視する研究を、PRISMA 2020に沿って体系的に整理した総説。", "p3": "誤差補正・故障パターン・不確実性推定・なりすまし検知など6つの課題に分類し、測位性能、検証の質、SAE J3016のレベル3〜5とISO 26262・SOTIFの安全要件への適合度で評価した。", "p5": "なりすまし検知で99%超の精度を報告した研究もあるが統制条件下の1件にとどまり、実走行への一般化は難しいとする（抄録）。今後の方向として不確実性推定、説明可能性、自己教師・連合学習、認証を見据えた検証を挙げる。", "fun": "GPSはビルの谷間で電波が反射すると、自分の位置を何十メートルも間違えることがある。その「間違え方のくせ」をデータから学ばせようという研究が増えているが、命を預ける車に載せるには、当たる確率だけでなく安全をどう証明するかが壁になる、という整理が面白い。", "unverified": "対象文献数と各課題の比較表は本文未入手のため未確認。"}}, {"id": "pr18", "rank": 18, "headline": "移動エントロピー網で風車故障の前兆を検出", "title": "Transfer-Entropy-Based Dynamic Network Markers for Interpretable Early Warning of Wind Turbine Failures", "url": "https://doi.org/10.2139/ssrn.7625808", "authors": "Tongding Yu ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Yu, T., Fang, R., Ying, N., & Huang, Y. (2026). Transfer-Entropy-Based Dynamic Network Markers for Interpretable Early Warning of Wind Turbine Failures. https://doi.org/10.2139/ssrn.7625808", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "風車のSCADAデータから、変数間の情報の流れの向きを使って故障の前兆を早めに捉える指標（TE-DNM）を提案した。", "p3": "移動窓ごとに移動エントロピー（transfer entropy）で有向ネットワークを作り、窓間の結合の変化をノードの変動・近傍内外の変動として合成し、正常時のデータで警報閾値を較正する。EDP Renewablesの公開データで評価した。", "p5": "正常運転中の指標は[0, 3]に収まり、ギアボックス軸受故障は17窓（約2.83時間）前、油圧漏れは141窓（約23.5時間）前に警報を出した（抄録）。相関に基づく従来の動的ネットワーク指標より早かった。", "fun": "病気の前には体温や脈がそれぞれ正常範囲でも、それらの「連動の仕方」が変わることがある。この研究は機械でも同じ考え方を使い、どのセンサがどのセンサに影響しているかという矢印の向きの変化から、壊れる何時間も前に異変を察知しようとしている。", "unverified": "誤警報率の評価と比較手法の詳細は本文未入手のため未確認。"}}, {"id": "pr19", "rank": 19, "headline": "在宅経管栄養を担うケア職のニーズ", "title": "Needs of Formal Caregivers for Older Adults with Home Enteral Tube Feeding in China: A Qualitative Study", "url": "https://doi.org/10.21203/rs.3.rs-10771401/v1", "authors": "Huiya Zhu ほか", "venue": "Research Square (In Review)", "date": "2026-10-18", "apa": "Zhu, H., Ma, X., Gong, Z., Liu, H., Liu, A., Han, Z., Yang, Y., & Shi, H. (2026). Needs of Formal Caregivers for Older Adults with Home Enteral Tube Feeding in China: A Qualitative Study. https://doi.org/10.21203/rs.3.rs-10771401/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "中国で在宅経管栄養の高齢者を世話する有償の介護者が、技能の習得や専門的支援の不足に直面している実態を明らかにした。", "p3": "2025年6〜8月に北京で介護者14人、地域・病院の医療職各3人の計20人に半構造化面接を行い、記述的現象学の手法（Colaizzi法）で分析した。", "p5": "技能は断片的な独学と仲間内の共有に頼っていること、栄養評価や管の交換などで専門的支援が欠けること、短い動画などの学び方と精神的支援・レスパイトを求めていることの3主題が得られた（抄録）。", "fun": "食べ物を口から取れない高齢者に管で栄養を入れる在宅ケアは、医療に近い技術が要るのに、担い手は家で一人で判断していることが多い。専門職と家庭のすき間で孤立している「見えにくい働き手」の声を拾った点が興味深い。", "unverified": "なし"}}, {"id": "pr20", "rank": 20, "headline": "DEMでCO2ハイドレート含有粘土の力学を再現", "title": "DEM-based numerical study on the mechanical behavior of CO2 hydrate-bearing silty-clayey sediments", "url": "https://doi.org/10.2139/ssrn.7629315", "authors": "Aowang Wang ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Wang, A., Luo, T., You, Z., Zhang, Y., Hou, S., Li, Q., Wu, P., Li, Y., Yang, W., & Han, T. (2026). DEM-based numerical study on the mechanical behavior of CO2 hydrate-bearing silty-clayey sediments. https://doi.org/10.2139/ssrn.7629315", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "南シナ海のシルト質粘土にCO2ハイドレートが含まれると、せん断破壊時の内部構造がどう変わるかを個別要素法（DEM）で示した。", "p3": "室内試験の結果に合わせてDEMのパラメータを較正し、ハイドレートの固結と有効拘束圧を変えて、せん断破壊中の粒子の接触力・回転・間隙構造をメソスケールで追った。", "p5": "固結は降伏強度を高め降伏ひずみを下げ、拘束圧の増加は弾性段階を長くした。最大接触力は軸方向に、最小は水平から上下約15°に集中し、水平方向の粒子回転は軸方向より約4.5°大きかった（抄録）。", "fun": "海底の泥にCO2を氷のような結晶として閉じ込める案があるが、その泥が地震などで崩れないかは大問題。この研究は砂粒一つ一つをコンピュータで転がし、結晶の「のり」が切れていく順番から、帯状の壊れ方が一枚の滑り面へ育っていく様子を描いている。", "unverified": "粒子数や較正に使った試験条件は本文未入手のため未確認。"}}, {"id": "pr21", "rank": 21, "headline": "DEMで遠心乾式磁選の分離機構を予測", "title": "Separation mechanism of magnetite intergrowths and its performance prediction in centrifugal DMS process based on DEM simulation", "url": "https://doi.org/10.2139/ssrn.7629554", "authors": "Fan Yi ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Yi, F., He, H., Zeng, J., & Chen, L. (2026). Separation mechanism of magnetite intergrowths and its performance prediction in centrifugal DMS process based on DEM simulation. https://doi.org/10.2139/ssrn.7629554", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "遠心式の乾式磁選機で、磁鉄鉱の連晶粒子がどう分離されるかをDEMシミュレーションで再現し、回収性能を予測できるようにした。", "p3": "粒子の運動と磁力を組み込んだDEMモデルを作り、連晶の鉄品位、供給粒径、分離コーンの回転数、磁束密度を変えて回収率を計算した。", "p5": "連晶の鉄品位が低いほど回収能力は大きく下がった。粒径と回転数の増加は中・低品位の回収を下げるが高品位にはほぼ影響せず、磁束密度の増加は高・中品位の回収を高めた（抄録）。", "fun": "水の少ない地域で鉄鉱石を選り分けるには、水を使わず磁石と遠心力で振り分ける必要がある。鉄を少しだけ含む「混ざりもの」の粒がどこへ飛んでいくかを粒単位で計算し、条件ごとに得する粒・損する粒が違うことを示した点が面白い。", "unverified": "モデルの検証に用いた実験の規模は本文未入手のため未確認。"}}, {"id": "pr22", "rank": 22, "headline": "全反射でボルト接合界面の挙動を可視化", "title": "Observation of Bolted Joint Interface Behaviour Using Total Internal Reflection", "url": "https://doi.org/10.2139/ssrn.7625984", "authors": "Idriz Tafa ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Tafa, I., Mace, T., Cascino, A., Meli, E., & Schwingshackl, C. (2026). Observation of Bolted Joint Interface Behaviour Using Total Internal Reflection. https://doi.org/10.2139/ssrn.7625984", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ボルト接合部の接触面が振動中にどう変化するかを、全反射（TIR）を使って直接・時間分解で観察できるようにした。", "p3": "透明なPMMA製のボルト接合梁（Brake-Reuss Beam）と一体の参照梁で、ハンマー打撃・ステップサイン加振・共振試験を行い、TIRの画像から実接触面積とその時間変化を抽出して全体の振動応答と対応づけた。", "p5": "振動中の接触状態の変化をTIRで捉えられ、接合部の非線形性を生む機構の直接的な実験的証拠を得たとする（抄録）。局所の界面挙動と全体の動特性を結びつける手段になる。", "fun": "ボルトで締めた2枚の板は、揺れるとわずかにこすれ合い、それが振動の減り方を変える。でも普段は接触面の中は見えない。透明な板を使い、光が接触しているところだけ抜けていく性質で「どこがくっついているか」を動画のように見た、という発想が面白い。", "unverified": "接触面積の定量値は抄録に記載がなく未確認。"}}, {"id": "pr23", "rank": 23, "headline": "財政危機の市ラドフォードの選択肢分析", "title": "Fiscal Crossroads: An Options Analysis of the City of Radford, Virginia", "url": "https://doi.org/10.5281/zenodo.23444852", "authors": "Turner, Tommy N.", "venue": "Zenodo", "date": "2026-10-18", "apa": "Turner, T. N. (2026). Fiscal Crossroads: An Options Analysis of the City of Radford, Virginia (Version 1.3). Zenodo. https://doi.org/10.5281/ZENODO.23444852", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録（DataCite登録）を使用", "preprint": true, "short": true, "p1": "財政危機に指定された米バージニア州ラドフォード市について、公的記録から原因を跡づけ、取りうる進路を比較した選択肢分析。", "p3": "14年間の財政推移と同規模の市との比較で原因を整理し、増税・料金引き上げで独立市を保つ道と、市営配電事業を売却して郡内の町に戻る道を、世帯負担・学校・ダムなどの観点で検討した。事実と推論を分けて記述している。", "p5": "一般会計は長年自らの運営費を賄えず、市営電力からの年約400万ドルの繰入れで均衡しており、同規模の構造的赤字があるとする（抄録）。不動産の半分以上が非課税であることなどが背景。", "fun": "町の財布が赤字なのに、市が持つ電力会社の利益で穴埋めして黒字に見せていた、という構図は家計にも置き換えやすい。大学の町で土地の多くが税金を払わないなど、都市の形そのものが財政を縛るという点が興味深い。", "unverified": "審査のない個人の報告書。数値は本文の付録で確認していない。"}}, {"id": "pr24", "rank": 24, "headline": "劣化を織り込んだ配水網の時間依存レジリエンス", "title": "Deterioration-Informed, Time-Dependent Resilience of Water Distribution Systems: Integrating Bayesian Failure Modeling, Reliability, and Hydraulic Supply Pathways", "url": "https://doi.org/10.2139/ssrn.7629365", "authors": "Balekelayi Ngandu ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Ngandu, B., & Nzokona, E. T. (2026). Deterioration-Informed, Time-Dependent Resilience of Water Distribution Systems: Integrating Bayesian Failure Modeling, Reliability, and Hydraulic Supply Pathways. https://doi.org/10.2139/ssrn.7629365", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "水道管の老朽化が時間とともに給水の冗長性をどう失わせるかを測る、時間依存のレジリエンス指標WIPW(τ)を提案した。", "p3": "1956〜2025年の37,484件の実際の配水管破損から地理加法的ベイズ劣化モデルを作り、材質別の信頼度関数、24時間の圧力駆動型水理計算、重み付き独立経路を組み合わせた。WAIC・DIC・空間ブロック交差検証で劣化モデルを選んでいる。", "p5": "WIPW(τ)はエネルギー型の指標（Todini指数など）が見落とす老朽化による冗長性の損失を捉えた。勾配に基づく更新順位で、全更新費用の17〜25%で得られるレジリエンス向上の約半分を回復できた（抄録）。", "fun": "水道網は、ある管が壊れても別の道を通って水が届く「迂回路の多さ」が強さになる。この研究は管が古くなるほど迂回路が実質的に減っていく様子を確率で追い、限られた予算でどの管から替えれば一番効くかを数字で示した。", "unverified": "ベンチマーク網ごとの数値は本文未入手のため未確認。"}}, {"id": "pr25", "rank": 25, "headline": "北アフリカ自動車産業の労働者のデジタル準備度", "title": "Evaluating Workforce Readiness for Digital Transformation in the Automotive Industry: The Case of North Africa", "url": "https://doi.org/10.21203/rs.3.rs-11183699/v1", "authors": "Mohammed Sadky ほか", "venue": "Research Square (In Review)", "date": "2026-10-18", "apa": "Sadky, M., & Abderrazik, Y. B. (2026). Evaluating Workforce Readiness for Digital Transformation in the Automotive Industry: The Case of North Africa. https://doi.org/10.21203/rs.3.rs-11183699/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "北アフリカ4か国の自動車産業で、従業員がデジタル化にどれだけ備えているかを調べた。", "p3": "モロッコ・アルジェリア・チュニジア・エジプトの従業員622人の調査に、半構造化面接と工場観察を組み合わせ、デジタルリテラシー、適応力、組織的支援、導入の障壁を測った。", "p5": "若く学歴の高い層ほど習熟度が高く、全体では訓練不足と組織的支援の弱さが最大の障壁だった（抄録）。企業は自動化・分析に投資しているが、訓練がそれに追いついていないと面接は示唆した。", "fun": "工場に最新の機械を入れても、使う人が使い方を知らなければ宝の持ち腐れになる。この研究は「機械を買うより、人を育てて変化をみんなで受け入れる職場にする方が効く」という、言われてみれば当然だが見落とされがちな点をデータで確かめている。", "unverified": "各国別の数値は本文未入手のため未確認。"}}, {"id": "pr26", "rank": 26, "headline": "観察されていると告げる一文で出力が変わる", "title": "The Performance Layer: Observation Context Produces Classifiable Output Differences in a Language Model", "url": "https://doi.org/10.5281/zenodo.23439822", "authors": "Glitchlit ほか", "venue": "Zenodo", "date": "2026-10-17", "apa": "Glitchlit, A., Jandak, A. C., & Glitchlit, C. (2026). The Performance Layer: Observation Context Produces Classifiable Output Differences in a Language Model (Version 0.2). Glitchlit Systems LLC. https://doi.org/10.5281/ZENODO.23439822", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録（DataCite登録）を使用。審査のない置き場の短い記録", "preprint": true, "short": true, "p1": "「観察されている」ことを告げる一文だけで、指示調整済み言語モデルの出力が分類可能なほど変わることを統制実験で示した。", "p3": "観察文脈の有無などの3条件を比べ、迎合（sycophancy）と観察への感受性を切り分けた。出力の違いを分類器で判別し、単語の出現頻度（BoW）の違いと比べている。", "p5": "生成のみの分類でAUROC 0.692（p=0.008）と差が検出された一方、表面の語彙はほぼ同一だった（BoW 0.999）（抄録）。ペルソナの分析は探索的とされている。", "fun": "先生が見ているときだけ字が丁寧になる生徒のように、AIも「見られている」と言われると答え方が微妙に変わるらしい。しかも使う単語は同じなのに中身の傾向が違う、という点が、AIの評価試験の結果をどこまで信じてよいかという問いにつながる。", "unverified": "モデル名と標本数は抄録に記載がなく未確認。"}}, {"id": "pr27", "rank": 27, "headline": "無料LLMが匿名投稿から属性を推定できる", "title": "Tor Hides Your IP, Not Your Words: Free LLMs as an Attribute-Inference Threat to Users of Network Anonymity Tools", "url": "https://doi.org/10.5281/zenodo.23453954", "authors": "Mashiki, Selby", "venue": "Zenodo", "date": "2026-10-18", "apa": "Mashiki, S. (2026). Tor Hides Your IP, Not Your Words: Free LLMs as an Attribute-Inference Threat to Users of Network Anonymity Tools (Version 1.0.1). Zenodo. https://doi.org/10.5281/ZENODO.23453954", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録（DataCite登録）を使用", "preprint": true, "short": true, "p1": "TorやVPNでIPアドレスを隠しても、投稿した文章から無料のLLMで個人属性が推定できてしまうことを示した。", "p3": "SynthPAIデータセットの合成著者100人のコメントから、無料版のGemini 2モデルに8つの属性を推定させ、投稿前にLLMで書き換える防御の効果も調べた。", "p5": "最良モデルは性別85.4%、職業71.4%、国72.3%、全属性平均64.3%を当てた（抄録）。書き換えで平均精度は49.5%に下がったが、どの属性も推定を防ぎきれなかった。", "fun": "住所を隠して手紙を出しても、書きぶりや話題から「この人は誰か」が透けて見えることがある。それを今は無料のAIが一瞬でやれてしまう、というのがこの研究の警告。匿名性は通信路だけでなく文章そのものに漏れ口がある。", "unverified": "合成データでの評価で、実在ユーザでの精度は未確認。"}}, {"id": "pr28", "rank": 28, "headline": "地域集中の農業融資の集中リスクを二因子で評価", "title": "Concentration Risk in Rural Loan Books: A Merton–Vasicek Derivation of the Basel Retail Capital Function and a Two-Factor Monte Carlo for District-Concentrated Agricultural Lending", "url": "https://doi.org/10.5281/zenodo.23450073", "authors": "Aguru, Manoj Kumar", "venue": "Zenodo", "date": "2026-10-18", "apa": "Aguru, M. K. (2026). Concentration Risk in Rural Loan Books: A Merton–Vasicek Derivation of the Basel Retail Capital Function and a Two-Factor Monte Carlo for District-Concentrated Agricultural Lending. Zenodo. https://doi.org/10.5281/ZENODO.23450073", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録（DataCite登録）を使用", "preprint": true, "short": true, "p1": "バーゼル規制の小口与信の資本式を導出し直し、少数の地区に集中した農業融資では必要資本が大きく過小になることを示した。", "p3": "Mertonの企業価値モデルからItôの補題とVasicekの極限損失分布で資本関数を導き、99.9%分位点をモンテカルロで検証した。そのうえで地区内外の相関を分けた二因子モデルで、インドの地方農村銀行に典型的な集中した貸出を試算した。", "p5": "PD 5%・LGD 45%で規制式の資本はエクスポージャーの5.31%。地区内相関0.15・地区間0.05のとき、99.9%の非期待損失は1地区のみで規制資本の2.23倍、3地区で1.42倍、10地区で1.11倍だった（抄録）。値は仮定のシナリオ。", "fun": "卵を一つのかごに盛るな、という格言を数式で示した研究。同じ村の農家は同じ天候不順で一斉に返済に困るので、借り手の数が多くても安全とは限らない。規則の前提「全員がばらばら」が崩れると、必要な備えが2倍以上になりうる。", "unverified": "なし"}}, {"id": "pr29", "rank": 29, "headline": "AI商品表示と実物のずれが購買意図を下げる", "title": "AI-BASED PRODUCT SIMULATION IN E-COMMERCE: EXAMINING THE INFLUENCE OF SIMULATED PRODUCTREALITY MISMATCH ON CONSUMER PURCHASE INTENTION", "url": "https://doi.org/10.5281/zenodo.23433422", "authors": "Prabhjot Singh", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-10-17", "apa": "Singh, P. (2026). AI-BASED PRODUCT SIMULATION IN E-COMMERCE: EXAMINING THE INFLUENCE OF SIMULATED PRODUCTREALITY MISMATCH ON CONSUMER PURCHASE INTENTION. Zenodo. https://doi.org/10.5281/ZENODO.23433422", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Zenodoの抄録（OpenAlex登録）を使用。文献に基づく概念論文", "preprint": true, "short": true, "p1": "ネット通販でAIが作る商品画像やARの試着と実物との「ずれ」が、購買意図と購入後の評価にどう効くかを、文献から概念枠組みにまとめた。", "p3": "新たなデータは取らず、商品提示、心的イメージ、診断性、信頼、期待不一致などの研究を統合した。ずれを外観・寸法・機能・素材・文脈・表現の真正性の6次元に分け、5つの研究の空白を評価した。", "p5": "ずれは知覚された診断性・期待・信頼・リスクを通じて購買意図に効き、関与度・カテゴリ・AI開示・返品方針が調整するという枠組みを提案した（抄録）。因果推定は含まない。", "fun": "ネットで見た服がきれいに見えすぎて、届いたら「なんか違う」と思った経験は多くの人にある。AIで画像を作るほど見栄えは良くなるが、そのぶん期待とのギャップも広がるかもしれない。良く見せることが逆効果になる境目はどこか、という問いが面白い。", "unverified": "実証データはなく、枠組みの妥当性は未検証。"}}, {"id": "pr30", "rank": 30, "headline": "睡眠問題の多い子どもは孤独も強い", "title": "Children with more sleep problems could also feel lonelier: a latent profile analysis", "url": "https://doi.org/10.21203/rs.3.rs-11164007/v1", "authors": "Alina A. Marinca ほか", "venue": "Research Square (In Review)", "date": "2026-10-18", "apa": "Marinca, A. A., Michalek, J. E., Gregory, A. M., Ali, A., & Lau, J. Y. F. (2026). Children with more sleep problems could also feel lonelier: a latent profile analysis. https://doi.org/10.21203/rs.3.rs-11164007/v1", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用。抄録の一部が途中で切れている", "preprint": true, "short": true, "p1": "小学生の睡眠問題のパターンを3つの型に分け、睡眠問題の多い型ほど後の孤独感が強いことを示した。", "p3": "東ロンドンの小学生コホート（基準時879人、7〜11歳）で、2時点の睡眠問題から潜在プロファイル分析を行い（778人）、前の時点の孤独感、性別、年齢、民族、地域の剥奪指標を調整して後の孤独感との関連を調べた。", "p5": "睡眠問題は低（53.6%）・中（36.2%）・高（10.2%）の3型に分かれ、型は後の孤独感と有意に関連した（F(2, 445) = 11.30）（抄録）。高と低の差などの詳細は抄録の記載が途中で切れている。", "fun": "よく眠れない子は昼間に元気が出ず友達と過ごしにくくなるのか、それとも寂しいから眠れないのか。この研究は前の時点の孤独感をそろえたうえで比べ、眠りの問題が後の孤独につながる方向の関係を示唆している。", "unverified": "型ごとの平均差とp値は抄録が途中で切れており未確認。"}}, {"id": "pr31", "rank": 31, "headline": "マラウイの降雨型地すべりリスクの統治", "title": "Evaluation of Governance, Institutional, and Policy Dimensions of Rainfall-Induced Landslide Risk in Malawi", "url": "https://doi.org/10.21203/rs.3.rs-11012281/v1", "authors": "Samuel Gama ほか", "venue": "Research Square (In Review)", "date": "2026-10-18", "apa": "Gama, S., Ngongondo, C., & Kalanda-Joshua, M. (2026). Evaluation of Governance, Institutional, and Policy Dimensions of Rainfall-Induced Landslide Risk in Malawi. https://doi.org/10.21203/rs.3.rs-11012281/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "マラウイの降雨型地すべりに対する多層の防災ガバナンスが、地域レベルでなぜうまく機能しないかを明らかにした。", "p3": "8か月の質的調査（半構造化面接、参与観察、ワークショップ、文書分析）を、多層・ネットワークガバナンス理論と景観ガバナンスの枠組みで分析した。", "p5": "地域での中央政府の能力と存在感は限られ、防災サービスの多くをNGOが担うが、調整の不足、資源の政治的取り込み、地方政府の能力不足が進展を妨げていた。能力が育つ前の分権化は失敗を地方で再生産しかねないと論じる（抄録）。", "fun": "土砂崩れを防ぐには山の斜面の工学だけでなく、誰が警報を出し、誰が避難を手伝うかという人の仕組みが要る。この研究は、権限を地方に任せれば良くなるとは限らず、任された側に力がなければかえって弱くなる、という逆説を現場から描いている。", "unverified": "なし"}}, {"id": "pr32", "rank": 32, "headline": "定量アルファを組み込むマルチエージェント売買", "title": "Enhancing Multi Agent Large Language Models for Stock Trading through Quantitative Alpha Integration", "url": "https://doi.org/10.2139/ssrn.7629484", "authors": "Viet Hong Tran ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Tran, V. H., Nguyen, V.-T., & Phan, H.-D. (2026). Enhancing Multi Agent Large Language Models for Stock Trading through Quantitative Alpha Integration. https://doi.org/10.2139/ssrn.7629484", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "ベトナム株を対象に、テクニカル指標・定量アルファ・センチメント・チャート画像を5つのLLMエージェントで統合する売買判断の枠組みを示した。", "p3": "上流の証拠を固定したままアルファ情報の寄与だけを切り出す対照プロトコルと、定量因子とセンチメントを分ける4通りのアブレーションで評価した。9銘柄・180組の判断を比較している。", "p5": "全体システムの方向的中率は65.0%で、アルファなしの51.1%を上回り、アルファの寄与がセンチメントより大きかった。一方、取引費用を考えた買いのみの運用では平均純収益は負だった（抄録）。", "fun": "株価が上がるか下がるかを当てる率が上がっても、それで儲かるとは限らない、という結果が正直で面白い。売り買いの手数料や当たり外れの大きさまで考えると、当てる力とお金を増やす力は別物だと分かる。", "unverified": "標本が9銘柄と小さく、期間の詳細は本文未入手のため未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "因果推論", "headline": "DDMLでCATEを推定する実務比較", "title": "Double/debiased machine learning for conditional average treatment-effect estimation", "url": "https://econpapers.repec.org/RePEc:boc:carp26:08", "authors": "Miana Plesca", "venue": "RePEc NEP", "date": "2026-09-28", "why": "二重機械学習による条件付き平均処置効果の推定を、Stata・Pythonの道具立てで実務的に比較し、応用研究での使い分けを示している。"}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "都市ガス自由化が電力の契約切替を促した", "title": "Cross-Market Spillovers from City Gas Liberalization to Electricity Contract Switching in Japan", "url": "https://doi.org/10.2139/ssrn.7629299", "authors": "Kentaka Aruga ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Aruga, K., Deng, X., & tang, c. (2026). Cross-Market Spillovers from City Gas Liberalization to Electricity Contract Switching in Japan. https://doi.org/10.2139/ssrn.7629299", "why": "日本の2017年都市ガス小売自由化が先行した電力市場の乗換えに波及したかを、都道府県パネルの連続処置DiDで検証した日本の政策評価。"}, {"id": "pn03", "rank": 3, "field": "開発経済学", "headline": "印パ分離の識字難民が村の発展を変えた", "title": "Human capital shock and Economic Development: Evidence from Partition of India", "url": "https://doi.org/10.2139/ssrn.7624623", "authors": "Akansha Gupta", "venue": "SSRN", "date": "2026-10-17", "apa": "Gupta, A. (2026). Human capital shock and Economic Development: Evidence from Partition of India. https://doi.org/10.2139/ssrn.7624623", "why": "1947年の印パ分離による大規模な強制移住を自然実験として、識字率の高い難民流入という人的資本ショックの長期効果を村レベルで推定している。"}, {"id": "pn04", "rank": 4, "field": "開発経済学", "headline": "国境手続きの簡素化は通関時間を縮めず", "title": "Trade Facilitation Without Trade Costs Reduction: Evidence from a Border Reform in Malawi", "url": "https://doi.org/10.2139/ssrn.7629377", "authors": "Alice Duhaut", "venue": "SSRN", "date": "2026-10-18", "apa": "Duhaut, A. (2026). Trade Facilitation Without Trade Costs Reduction: Evidence from a Border Reform in Malawi. https://doi.org/10.2139/ssrn.7629377", "why": "マラウイ主要国境の機関統合改革を合成DiDで評価し、手続き簡素化が貿易費用削減につながらなかったという反証的な結果を示している。"}, {"id": "pn05", "rank": 5, "field": "経済学", "headline": "軍事同盟は貿易を平均4割増やす", "title": "Sovereign Gravity: The Military Alliance Effect on Trade", "url": "https://doi.org/10.2139/ssrn.7629376", "authors": "Matteo Neri--Lainé", "venue": "SSRN", "date": "2026-10-18", "apa": "Neri--Lainé, M. (2026). Sovereign Gravity: The Military Alliance Effect on Trade. https://doi.org/10.2139/ssrn.7629376", "why": "安全保障リスクを内生化した構造重力モデルと因果識別で、軍事同盟の貿易効果とその経路を定量化している。"}, {"id": "pn06", "rank": 6, "field": "経済学", "headline": "AI企業間の循環的な投資関係を計測", "title": "Circular relationships among AI firms", "url": "https://econpapers.repec.org/RePEc:bis:bisblt:137", "authors": "Jon Frost ほか", "venue": "RePEc NEP", "date": "2026-10-12", "why": "2021〜2025年のAI企業への投資の過半がAI企業自身から来ていることを示し、投資と取引が重なる循環構造を記述した。"}, {"id": "pn07", "rank": 7, "field": "ヒューマンコンピュータインタラクション", "headline": "説明の透明性と擬人化がAIへの依存を変える", "title": "Calibrating Trust in Generative AI: How Explanation Transparency and Anthropomorphic Framing Shape Reliance in LLM-Assisted Decision-Making", "url": "https://doi.org/10.2139/ssrn.7629369", "authors": "CHEN XU", "venue": "SSRN", "date": "2026-10-18", "apa": "XU, C. (2026). Calibrating Trust in Generative AI: How Explanation Transparency and Anthropomorphic Framing Shape Reliance in LLM-Assisted Decision-Making. https://doi.org/10.2139/ssrn.7629369", "why": "LLM助言の説明の透明性と擬人化表現を2×2実験で操作し、過信・不信のない適切な依存（信頼の較正）への影響を測っている。"}, {"id": "pn08", "rank": 8, "field": "ヒューマンコンピュータインタラクション", "headline": "生成AIの公開発言が議論の感情的極端さを変える", "title": "When AI Enters the Conversation: Generative AI and Emotional Extremity in Public Discourse", "url": "https://doi.org/10.2139/ssrn.7622518", "authors": "Yanda Tao ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Tao, Y., Yoo, C., & Animesh, A. (2026). When AI Enters the Conversation: Generative AI and Emotional Extremity in Public Discourse. https://doi.org/10.2139/ssrn.7622518", "why": "ソーシャルメディアでのAIの介入がその後の議論の感情的極端さに与える影響を、発言内容の変化と参加の選択に分けて検証している。"}, {"id": "pn09", "rank": 9, "field": "機械学習", "headline": "不均衡最適輸送の勾配流をニューラルJKOで解く", "title": "A Neural JKO Scheme for Hellinger–Kantorovich Gradient Flows via Monge-Growth Pairs", "url": "https://doi.org/10.2139/ssrn.7629405", "authors": "Geuntaek Seo ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Seo, G., Kim, C., Son, H., & Hwang, H. J. (2026). A Neural JKO Scheme for Hellinger–Kantorovich Gradient Flows via Monge-Growth Pairs. https://doi.org/10.2139/ssrn.7629405", "why": "質量の生成・消滅を含む移流反応拡散方程式を、Hellinger–Kantorovich幾何でのメッシュフリーなニューラルJKO法として定式化した。"}, {"id": "pn10", "rank": 10, "field": "機械学習", "headline": "価値関数の共有が協力の崩壊を招く", "title": "Shared Value Representations Drive Exploration-Induced Cooperation Collapse in Spatial Social Dilemmas", "url": "https://doi.org/10.2139/ssrn.7629485", "authors": "Yi-Ning Weng ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Weng, Y.-N., & Lee, H.-w. (2026). Shared Value Representations Drive Exploration-Induced Cooperation Collapse in Spatial Social Dilemmas. https://doi.org/10.2139/ssrn.7629485", "why": "パラメータ共有DQNの集団で、局所的な探索が共有表現を通じて全体の協力を崩す現象を空間的囚人のジレンマで系統的に描いた。"}, {"id": "pn11", "rank": 11, "field": "機械学習", "headline": "Transformerで日次のニュース心理指数を作る", "title": "Measuring sentiment news with transformer-based language models", "url": "https://econpapers.repec.org/RePEc:ecb:ecbwps:20263283", "authors": "Borgioli ほか", "venue": "RePEc NEP", "date": "2026-09-28", "why": "辞書法に代わり、Transformer言語モデルで金融ニュースの日次センチメント指数を構築し、その妥当性を比較評価している。"}, {"id": "pn12", "rank": 12, "field": "経済学", "headline": "貸株供給の増加で経営者が株価から学ぶ", "title": "Lendable-Share Supply and Managerial Learning from Stock Pricesi,Evidence from a Dividend-Tax Reform in China’s Securities-Lending Market", "url": "https://doi.org/10.2139/ssrn.7624578", "authors": "Haiqiang Chen ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Chen, H., Liu, x., Ni, B., & Zhong, Z. (2026). Lendable-Share Supply and Managerial Learning from Stock Pricesi,Evidence from a Dividend-Tax Reform in China’s Securities-Lending Market. https://doi.org/10.2139/ssrn.7624578", "why": "中国の貸株配当課税改革を外生変動として、貸株供給が投資のq感応度と価格発見を高めることを示した。"}, {"id": "pn13", "rank": 13, "field": "組織行動・心理的安全性", "headline": "マイクロマネジメントは構造が生む関係様式", "title": "Beyond the Controlling Manager: A Structural-Relational Model of Micromanagement in Leadership", "url": "https://doi.org/10.2139/ssrn.7625834", "authors": "Xaverie Biloa", "venue": "SSRN", "date": "2026-10-17", "apa": "Biloa, X. (2026). Beyond the Controlling Manager: A Structural-Relational Model of Micromanagement in Leadership. https://doi.org/10.2139/ssrn.7625834", "why": "LMX理論と自己決定理論に基づき、マイクロマネジメントを個人の資質ではなく構造的に生まれる関係パターンとして再理論化した。"}, {"id": "pn14", "rank": 14, "field": "経営学", "headline": "国家機能が崩れた下での社会的起業の適応", "title": "Sustaining entrepreneurship under institutional fragility: Social bricolage and ecosystem adaptation in Myanmar", "url": "https://doi.org/10.2139/ssrn.7629650", "authors": "Soe Thaw Tar Kyaw Min ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Kyaw Min, S. T. T., & Zan, T. T. (2026). Sustaining entrepreneurship under institutional fragility: Social bricolage and ecosystem adaptation in Myanmar. https://doi.org/10.2139/ssrn.7629650", "why": "クーデター後のミャンマーの社会的企業10社の事例から、制度が機能しない環境でのブリコラージュによる生態系の適応を描いた。"}, {"id": "pn15", "rank": 15, "field": "統計学", "headline": "ボルト接合の動特性をベイズ逆部分構造法で推定", "title": "A Bayesian Framework for Inverse Identification of Bolted Joint Dynamics using Frequency-Based Substructuring", "url": "https://doi.org/10.2139/ssrn.7625983", "authors": "Mark Jackson ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Jackson, M., Coletti, K., Moldenhauer, B. J., Roettgen, D., & Davis, B. (2026). A Bayesian Framework for Inverse Identification of Bolted Joint Dynamics using Frequency-Based Substructuring. https://doi.org/10.2139/ssrn.7625983", "why": "悪条件なFRF行列の逆演算に頼る従来法に対し、接合部の動剛性とその不確実性を確率的に推定する枠組みを提案した。"}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "男女賃金差別の縮小がもたらすマクロ効果", "title": "The Macroeconomics of Gender Equality: Reducing Wage Gaps in a Developing Economy", "url": "https://doi.org/10.2139/ssrn.7629222", "authors": "Oscar Avila ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Avila, O., Grajales-Olarte, A., Ramos-Veloza, M. A., & Ospina-Tejeiro, J. J. (2026). The Macroeconomics of Gender Equality: Reducing Wage Gaps in a Developing Economy. https://doi.org/10.2139/ssrn.7629222", "why": "男女の家計内意思決定を持つ小国開放経済の一般均衡モデルで、コロンビアの賃金差別縮小の効果を評価した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "コロンビアで男女の賃金差別を半減させると、GDPと消費は増えるが、女性の厚生の伸びは男性より小さいことを一般均衡モデルで示した。", "p3": "男女の主体が市場労働と家事生産を共同で決める小国開放経済の一般均衡モデルを作り、賃金差別を減らす政策と、その財源を財政で賄う場合を比較した。", "p5": "賃金差の半減は女性の所得・総労働供給・投資を通じてGDPと消費を押し上げ、厚生は男女とも上がるが女性の方が小さい（余暇と家事生産を手放すため）。財政政策で実施すると利得は大幅に小さくなる（抄録）。", "fun": "女性の給料が上がれば女性が一番得をする、と考えがちだが、モデルで計算すると働く時間が増えて余暇や家の仕事を手放すぶん、得の大きさは男性の方が上回る。差別をなくすことと、女性の暮らしの満足を上げることは同じではない、という指摘が鋭い。", "unverified": "モデルの較正値と厚生の数値は本文未入手のため未確認。"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "不動産再評価と重なる地方税基盤の再配分", "title": "Property Valuation, Household Cash Flows, and Local Tax Bases", "url": "https://doi.org/10.2139/ssrn.7625982", "authors": "Arka Prava Bandyopadhyay", "venue": "SSRN", "date": "2026-10-17", "apa": "Bandyopadhyay, A. P. (2026). Property Valuation, Household Cash Flows, and Local Tax Bases. https://doi.org/10.2139/ssrn.7625982", "why": "再評価による税負担の再配分を、重なり合う複数の地方税基盤を保ちつつ実装できる程度として特徴づけた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "不動産の再評価で税額が重なり合う地方税基盤の間で再配分されるとき、目標の税額表をどこまで実装できるかを特徴づけた。", "p3": "クック郡の公開記録から1,034の税コードにまたがる598の独立した地区制約を取り出し、地区の課税基盤を保ち、未更新の納税者を守り、増額を抑える条件の下で税額を最適化した。", "p5": "地区最適化は比例的な調整より税額と目標の二乗乖離を18.9%減らした。支払い保護の罰則は増額の総額を56.9%減らしつつ改善の86.1%を保ち、対象の67.8%の税額を据え置いた（抄録）。厚生最適ではないと明記している。", "fun": "家の評価額が変わると固定資産税も変わるが、学区・消防・公園などの税が重なり合っていて、一つを動かすと他もずれる。パズルのように重なった制約の中で、誰の税額も急に跳ね上がらないよう配る方法を、実際の郡のデータで計算している。", "unverified": "なし"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "固有リスクの違いが家計ポートフォリオを分ける", "title": "Heterogeneous Idiosyncratic Risk and the Composition of Household Financial Portfolios", "url": "https://econpapers.repec.org/RePEc:bdm:wpaper:2026-05", "authors": "José Martínez", "venue": "RePEc NEP", "date": "2026-10-05", "why": "家計ごとに異なる固有リスクが資産構成の違いを説明するという、ポートフォリオ異質性の新しい説明を与えている。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPの抄録を使用", "preprint": true, "short": true, "p1": "家計ごとの所得リスクの違いが、短期の流動的な預金と長期の非流動的な預金の配分の違いを説明することを示した。", "p3": "米国のミクロデータで預金の満期構造と所得リスクの関係を確かめ、不完備市場・異質な主体・2資産の連続時間マクロモデルで流動性需要の違いを再現した。", "p5": "固有の所得リスクが高い家計は短期の流動的預金を多く持ち、リスクが低い家計は長期の非流動的預金に多く配分していた。モデルはこの最適ポートフォリオの違いを再現した（抄録）。", "fun": "収入が不安定な人ほど、すぐ引き出せる普通預金に多く置き、安定した人ほど定期預金や長期の資産に回す。当たり前に見えるこの行動を、経済全体のモデルの中で説明できるようにした点がこの研究の新しさ。", "unverified": "使用したミクロデータの名称と推定値は抄録に記載がなく未確認。"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "インドのコアインフレ予測は単純な方が強い", "title": "Forecasting Indian Core Inflation: Simple Made Simpler", "url": "https://econpapers.repec.org/RePEc:een:camaaa:2026-83", "authors": "Rishabh Choudhary ほか", "venue": "RePEc NEP", "date": "2026-09-28", "why": "多数の予測モデルを比較し、インドのコアインフレでは単純なモデルが優位かを検証した政策実務向けの研究。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPの抄録を使用", "preprint": true, "short": true, "p1": "インドのコア消費者物価の予測で、多数の高度なモデルも単純な自己回帰を平均予測では上回れないことを示した。", "p3": "40の経済・金融指標の月次パネルで、自己回帰から因子モデル、分位点回帰、機械学習まで9種類のモデルを推定し、期待インフレや気候変数も考慮して、1・3・6・12か月先の二乗平均予測誤差で比べた。", "p5": "条件付き平均では、どのモデルもどの期間でも自己回帰より有意に小さな誤差を出さなかった。一方、分布予測では推定因子を含む分位点回帰がすべての分位点・期間で損失を減らした（抄録）。", "fun": "たくさんのデータと最新の機械学習を使っても、物価の「平均的な予想」は昔ながらの単純な方法に勝てなかった。ただし「どれくらい外れうるか」という幅の予想では、情報を足す価値があった。何を当てたいかで良い道具が変わる、という教訓。", "unverified": "なし"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "競合する脱炭素技術への最適な支援設計", "title": "Technology Neutrality vs. Policy Discrimination: Optimal Policy Design for Competing Green Technologies", "url": "https://doi.org/10.2139/ssrn.7625267", "authors": "Albin Kasser ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Kasser, A., & Meunier, G. (2026). Technology Neutrality vs. Policy Discrimination: Optimal Policy Design for Competing Green Technologies. https://doi.org/10.2139/ssrn.7625267", "why": "炭素差額契約で技術中立と技術別支援のどちらが望ましいかを、競合するグリーン技術の下で理論的に比較した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "競合する2つの脱炭素技術を支援するとき、技術中立の数量枠に技術別の補助を組み合わせるのが最適になりうることを示した。", "p3": "私的費用と社会的費用の差が技術ごとに異なり、費用ショックを企業だけが観察する設定で、価格・数量の手段を一律版と技術別版で比較した。異質な生産拠点の分布で総費用をミクロ的に基礎づけ、欧州のグリーン水素とブルー水素に応用した。", "p5": "費用の差が技術間で異なれば技術中立は配分を歪める。共通の数量枠と技術別の補助の組み合わせは、技術別の別枠より優れ、代替性が高いほど差別化の利得が大きい。数値シミュレーションでも的を絞った支援の厚生利得が確認された（抄録）。", "fun": "「どの技術でも同じ条件で競わせる」のは公平に見えるが、技術ごとに社会への迷惑の大きさが違うなら、その差だけは補正した方が全体として得になる。競争の柔軟さと狙い撃ちの補正をどう両立させるかを、水素の作り方の選択に当てはめている。", "unverified": "厚生利得の具体的な大きさは本文未入手のため未確認。"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "輸入単価の変化は構成変化に左右される", "title": "Beyond Face Value: How Composition Changes Affect Import Unit Values of Light Vehicles", "url": "https://econpapers.repec.org/RePEc:fip:fedgfn:103842", "authors": "Robin Braun ほか", "venue": "RePEc NEP", "date": "2026-10-12", "why": "米国の小型車輸入で、単価指標が車種構成の変化にどれだけ影響されるかを分解し、価格統計の読み方を示した。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPの短い抄録のみを使用", "preprint": true, "short": true, "p1": "米国の小型車輸入の単価が、価格そのものではなく車種構成の変化にどれだけ左右されるかを問う研究。", "p3": "未確認（抄録には問題設定のみが書かれ、手法の記載がない）。", "p5": "未確認（抄録に結果の記載がない）。抄録は、小型車が米国の財輸入の約7%を占め、輸入物価指数でも重みが大きいと述べている。", "fun": "輸入車の「1台あたりの平均価格」が上がったとき、それは値上げなのか、高級車の割合が増えただけなのか。平均値は中身の入れ替わりでも動くので、物価を正しく測るにはその二つを切り分ける必要がある、という統計の基本的で奥深い問題。", "unverified": "手法と結果は抄録に記載がなく未確認。"}}, {"id": "pn22", "rank": 22, "field": "経済学", "headline": "キャッシュ循環期間と超過収益の持続", "title": "Cash Conversion Cycle and Sustained Abnormal Profitability: Evidence from China", "url": "https://doi.org/10.2139/ssrn.7629403", "authors": "Gang Wei ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Wei, G., Chen, J., Fu, T., & Lu, H. (2026). Cash Conversion Cycle and Sustained Abnormal Profitability: Evidence from China. https://doi.org/10.2139/ssrn.7629403", "why": "中国製造業のパネルで、キャッシュ・コンバージョン・サイクルが競争水準を超える収益性の持続に関わるかを検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "キャッシュ・コンバージョン・サイクル（CCC）が短い企業ほど、競争水準を超える収益性を長く保てることを示した。", "p3": "中国A株の製造業2008〜2024年で、産業調整済み営業利益率の動学モデルをシステムGMMで推定し、超過収益の高さと持続性をあわせた企業年の指標を作ってCCCとの関係を調べた。", "p5": "CCCが短いほど持続的な超過収益が強く、営業資金の回収期間が長いと優位の維持が弱まった。操作変数、傾向スコアマッチングなどでも頑健で、企業間信用、総資産回転率、市場シェアが経路とされる（抄録）。", "fun": "商品を仕入れてから売上代金を回収するまでの日数が短い会社は、お金が早く回るぶん無理な借金をせずに済む。この研究は、その「お金の回転の速さ」が、一時的な好業績ではなく長く続く強さと結びつくことを示している。", "unverified": "効果の大きさは抄録に記載がなく未確認。"}}, {"id": "pn23", "rank": 23, "field": "経営学", "headline": "CEOの文化的背景が投資効率を左右する", "title": "CEO Cultural Legacy and Corporate Investment Efficiency", "url": "https://doi.org/10.2139/ssrn.7629311", "authors": "Busra Agcayazi", "venue": "SSRN", "date": "2026-10-18", "apa": "Agcayazi, B. (2026). CEO Cultural Legacy and Corporate Investment Efficiency. https://doi.org/10.2139/ssrn.7629311", "why": "CEOの国籍をHofstedeの文化次元に対応づけ、文化的背景が企業の投資効率の違いを説明するかを検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "CEOの出身文化（Hofstedeの文化次元）が企業の投資効率の違いを説明することを示した。", "p3": "CEOの国籍を文化次元に対応づけ、予測投資からの乖離を投資の非効率として測った。残差に基づく乖離を水準と散らばりの成分に分け、投資の上下へのずれと予測への合致度を区別した。", "p5": "不確実性回避と長期志向が強いほど過大投資が減り非効率は小さく、個人主義・男性性・充足・権力格差が高いほど過大投資で非効率が大きかった。6次元中4次元で散らばりの効果が保たれ、外部監視が弱いほど関係は強い（抄録）。", "fun": "慎重な文化で育った社長は投資もしすぎず、勢いを重んじる文化の社長は投資しすぎる傾向がある、という結果。会社のお金の使い方が、数字だけでなくトップの育った文化という目に見えない要素にも左右されうることを示している。", "unverified": "標本の国・期間・規模は抄録に記載がなく未確認。"}}, {"id": "pn24", "rank": 24, "field": "ヒューマンコンピュータインタラクション", "headline": "身体動作の注釈は相互行為上の実践である", "title": "Annotating embodied action as an interactionally accountable practice: Relevant Annotation in multimodal pragmatics, sign language, and multimodal AI", "url": "https://doi.org/10.2139/ssrn.7625798", "authors": "Mayumi Bono ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Bono, M., Poveda-Gutiérrez, S., Nishida, N., Sakaida, R., Inoue, K., Okada, T., & Miyao, Y. (2026). Annotating embodied action as an interactionally accountable practice: Relevant Annotation in multimodal pragmatics, sign language, and multimodal AI. https://doi.org/10.2139/ssrn.7625798", "why": "マルチモーダルAIの学習データにも関わる身体動作の注釈づけを、参与者の理解を示す相互行為の実践として捉え直した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "身振りなど身体動作の注釈は、形に基づく固定ラベルではなく、参与者の理解に根ざした相互行為上の記述であるべきだと論じ、その枠組みを示した。", "p3": "観察できる動きの下層記述と、参与者にとっての行為の上層記述を分け、両者をMETA層で統合するRelevant Annotationを用いた。日本科学未来館の科学コミュニケーション・コーパスで検証し、その記述を正解としてマルチモーダルLLMを事例比較した。", "p5": "身振りは形よりも投射と系列上の位置によって指示や受け手への配慮を達成していた。現在のモデルは身振りを孤立した視覚対象として扱い、文脈の統合が必要な場面で失敗した。日本手話コーパスへの予備的拡張も示した（抄録）。", "fun": "同じ「指さし」でも、会話のどの瞬間に出たかで「あれを見て」にも「あなたの番」にもなる。形だけ覚えたAIはこの違いが分からない。人の身振りの意味は動きの形ではなく会話の流れの中にある、という点が、AIの学習データの作り方を問い直している。", "unverified": "モデルの比較は事例比較で、定量的な精度は未確認。"}}, {"id": "pn25", "rank": 25, "field": "機械学習", "headline": "VLMは赤外画像の熱を読めるか", "title": "Can vision-language models read heat? Diagnosing, teaching and bounding thermal literacy for aerial infrared perception", "url": "https://doi.org/10.2139/ssrn.7629398", "authors": "Ajinkya Jadhav", "venue": "SSRN", "date": "2026-10-18", "apa": "Jadhav, A. (2026). Can vision-language models read heat? Diagnosing, teaching and bounding thermal literacy for aerial infrared perception. https://doi.org/10.2139/ssrn.7629398", "why": "視覚言語モデルが熱画像の見かけの温度を読めるのか、物体を認識しているだけかを診断し、学習と限界を調べた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "視覚言語モデル（VLM）が赤外画像の「熱」を読めるのかを診断し、学習で改善できる範囲と限界を示した。", "p3": "6センサの27,925フレームでベンチマークを系列に配慮して再分割し（元の5ソースでは試験フレームの95〜98%に類似の訓練フレームがあった）、タグ付きの物体のうち最も温かいものを答えるHeatRankを作った。言語側のみの微調整と検証可能報酬の強化学習を比べた。", "p5": "既製の4モデルはタグを82〜95%読めたが、最も温かい物体は40〜60%しか当てられず（偶然は46%）。1,400例の微調整で92%になったが、黒を熱とする表示では20%に落ち、両極性で学習すると90%に回復した（抄録）。", "fun": "AIは赤外線カメラの画像を見て「人」や「車」は言い当てられても、どれが一番熱いかは当てずっぽう並みだった。しかも学習させると「明るい＝熱い」という近道を覚えてしまい、色の向きを逆にすると間違える。AIが本当に何を理解しているかを試す好例。", "unverified": "なし"}}, {"id": "pn26", "rank": 26, "field": "機械学習", "headline": "敵対的な表現の撹乱でグラフから忘却する", "title": "Graph Unlearning via Adversarial Representation Confusion", "url": "https://doi.org/10.2139/ssrn.7629585", "authors": "Zhifan Huang ほか", "venue": "SSRN", "date": "2026-10-18", "apa": "Huang, Z., Lu, H., Yang, Y., Yuan, Y., Hu, T., & Ding, H. (2026). Graph Unlearning via Adversarial Representation Confusion. https://doi.org/10.2139/ssrn.7629585", "why": "グラフニューラルネットから特定データの影響を除くグラフ・アンラーニングを、表現の撹乱で効率よく行う方法を提案した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "学習済みのグラフニューラルネットから、指定したノード・特徴・辺の影響を効率よく取り除く手法GUARCを提案した。", "p3": "ノードと特徴の削除には局所的な敵対的特徴を、辺の削除には端点ラベルが一致する非辺の参照を作り、ドメイン敵対的最適化で削除対象と参照を表現空間で見分けにくくする。削除前後の予測差から影響を受ける近傍を特定し、予測保持の制約を課す。", "p5": "6つのベンチマークと複数のGNNで、忘却の効果・モデルの有用性・計算効率のいずれでも既存手法より良かったとする（抄録）。", "fun": "SNSの友達関係などで学習したAIから「この人のデータを消して」と頼まれても、全部を学習し直すのは大変。そこで、消したい部分を他と見分けがつかなくなるよう表現をかき混ぜて忘れさせる、という逆転の発想を使っている。", "unverified": "具体的な数値は抄録に記載がなく未確認。"}}, {"id": "pn27", "rank": 27, "field": "機械学習", "headline": "小型言語モデルの安全性手法を批判的に総覧", "title": "Safety and Alignment of Small Language Models: A Critical Survey of Methods and Evaluation", "url": "https://doi.org/10.2139/ssrn.7625461", "authors": "Robert-Mihai Colca", "venue": "SSRN", "date": "2026-10-17", "apa": "Colca, R.-M. (2026). Safety and Alignment of Small Language Models: A Critical Survey of Methods and Evaluation. https://doi.org/10.2139/ssrn.7625461", "why": "小型言語モデルの安全性・アラインメント手法を、介入・利用文脈・評価手順の観点から批判的に整理した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "約70億パラメータ以下の小型言語モデルの安全性・アラインメント手法と評価を、批判的に整理した総説。", "p3": "データ、学習時のアラインメント、運用時の安全装置、編集とアンラーニング、効率化、多言語評価、機構的解釈性に分けて証拠を整理した。別に、6,681件の過去のモデレーション応答の監査と、3人の評価者による12件の応答評価も行った。", "p5": "有害生成の抑制、拒否の増加、危険知識の抑制は無害な有用性にそれぞれ異なる影響を与え、パラメータ効率や指示追従の総合点は敵対的頑健性を保証しないとした。監査では指標の混同や不完全な記録が結論を妨げた（抄録）。", "fun": "小さくて安いAIを安全にする工夫はいろいろあるが、「危ないことを言わない」ように締めつけると「普通の質問にも答えなくなる」ことがある。この総説は、安全だと言うには何を、どんな条件で、何件中何件失敗したかまで記録すべきだと指摘している。", "unverified": "文献の網羅性は著者自身が限定的としている。"}}, {"id": "pn28", "rank": 28, "field": "経済学", "headline": "規模拡大型と効率改善型で将来業績が違う", "title": "Future firm performance across extensively and intensively growing firms", "url": "https://doi.org/10.2139/ssrn.7624581", "authors": "Peter B. Vassallo ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Vassallo, P. B., & Richardson, G. (2026). Future firm performance across extensively and intensively growing firms. https://doi.org/10.2139/ssrn.7624581", "why": "成長の仕方（規模拡大か資産効率の向上か）によって将来の企業業績の予測可能性が異なるかを検証した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "成長企業を規模拡大型と資産効率改善型に分けると、それぞれの将来業績を7年先まで予測できることを示した。", "p3": "純営業資産に対する市場収益で全体の成長を捉え、純営業資産の変化と営業利益の変化のどちらが優勢かで2つの成長の型を区別した。", "p5": "それぞれの規模戦略は7年の予測期間で有意に予測でき、将来の純営業資産の変化と営業利益の水準、企業業績にも反映された（抄録）。成長企業の将来業績を区別できないという長年の謎を解くとしている。", "fun": "会社の成長には、店や工場を増やして大きくなる道と、今ある設備でより多く稼ぐ道がある。どちらの道を歩んでいるかを財務データから見分けると、数年先の業績まで読めるようになる、という点が面白い。", "unverified": "標本の国・期間と予測精度の数値は抄録に記載がなく未確認。"}}, {"id": "pn29", "rank": 29, "field": "機械学習", "headline": "幾何を明示する系列化Transformerで点群分割", "title": "Geo-Former: Explicit Geometry Modeling with Serialized Transformers for Point Cloud Semantic Segmentation", "url": "https://doi.org/10.2139/ssrn.7625800", "authors": "Yanghui Guo ほか", "venue": "SSRN", "date": "2026-10-17", "apa": "Guo, Y., Li, K., Guo, Y., Wang, L., & Chen, S. (2026). Geo-Former: Explicit Geometry Modeling with Serialized Transformers for Point Cloud Semantic Segmentation. https://doi.org/10.2139/ssrn.7625800", "why": "点群を系列化するTransformerに局所幾何の明示的なモデル化を加え、大規模3次元シーンの意味分割を改善した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossref登録）を使用", "preprint": true, "short": true, "p1": "点群を系列に並べて処理するTransformerに局所幾何の明示的なモデル化を加え、3次元点群の意味分割を改善するGeo-Formerを提案した。", "p3": "点の座標と共分散統計で局所・大域の幾何を表し、FiLMで特徴を変調する。深さ方向畳み込みで近傍を集約し、系列誘導型のゲートで注意の更新を安定させ、デコーダで多スケールの注意を使う。", "p5": "ScanNet v2、ScanNet200、nuScenesの実験で有効性と拡張性を示したとする（抄録）。", "fun": "3次元スキャンの点の集まりを一列に並べると文章のように処理できて速いが、そのぶん「この辺は平ら」「ここは角」といった形の情報が薄れる。点の散らばり方の統計を足して形の感覚を取り戻させた、という工夫。", "unverified": "具体的な精度の数値は抄録に記載がなく未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "列車すれ違い位置の不確実性で走行安全を評価", "title": "Probabilistic Assessment of Running Safety for Deck Arch Bridges under the Dual Randomness of Track Irregularities and Train Meeting Positions", "url": "https://doi.org/10.1142/s0219455428500551", "authors": "Wei Liu ほか", "venue": "International Journal of Structural Stability and Dynamics", "date": "2026-10-16", "citescore": 6.5, "citescore_year": "2025", "     "3. 実装の仕様を一覧にする。入力と出力、データ（入手先・期間・前処理・除外条件）、手法（核の式とアルゴリズム）、設定値（ハイパーパラメータ・乱数の種・反復回数）、評価指標。論文に書かれていない値は「仮定」と明記し、その値にした理由を書く。",
    "4. 小さく作って確かめる。核の式は、手で計算できる小さな例でテストする。少ないデータと短い計算で最後まで動かしてから、本来の規模に広げる。計算が重すぎるときは縮小版にし、縮小で何が変わりうるかを書く。",
    "5. 結果を論文と並べる。論文の値、再現した値、差、差の理由の候補を表にする。再現できなかった点も、そのまま書く。",
    "6. まとめる。再現できた点、できなかった点、論文の記述があいまいで判断した点、使った計算資源と時間、次に確かめることを書く。",
    "",
    "守ること",
    "- 実行していない結果や、論文にない数値を作らない。数値には出典（論文の節・表・図、または実行ログ）を添える。",
    "- データの利用条件を確かめる。入手できないデータや、条件で使えないデータは、同じ形の合成データで動作だけを確かめ、その旨を書く。",
    "- 公式のコードを使ったり参考にしたりしたときは、どこをどう使ったかとライセンスを書く。",
    "- 設定を1か所にまとめ、乱数の種を固定し、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  var REPRO_DATA = [
    "次のデータセットを取得して中身を確かめ、記載どおりかを検証するコードを書いてください。",
    "",
    "- データ：{paper}",
    "- 環境：コードを実行できるなら実行する。実行できないときは、コードと実行手順を示し、結果は「未実行」と書く",
    "",
    "進め方",
    "1. 説明ページを読み、ファイルの一覧、形式、サイズ、ライセンス、関連する論文やコードを確かめる。",
    "2. データを取得して読み込み、記載どおりか（件数・変数・期間・単位）を確かめる。食い違いは表にする。",
    "3. 変数ごとの基本統計と欠損を集計し、主要な変数の分布を図にする。",
    "4. 関連する論文や再現用のコードがあれば、主要な表か図を1つ選んで再現し、元の値と並べる。",
    "5. まとめる。確かめられた点、食い違い、使うときの注意（利用条件・偏り・欠損）を書く。",
    "",
    "守ること",
    "- 実行していない結果や、データにない数値を作らない。",
    "- ライセンスと利用条件に従う。個人を特定できる情報が含まれていたら、それ以上扱わずに報告する。",
    "- 設定を1か所にまとめ、必要なライブラリと版を書いて、別の人が同じ手順で動かせるようにする。",
    "- 報告は日本語で書く。"
  ].join("\n");
  function fill(template, it) { return template.replace("{paper}", it.title + "（" + it.url + "）"); }
  function questionText(it) { return fill(it.kind === "data" ? QUESTION_DATA : QUESTION, it); }
  function reproText(it) { return fill(it.kind === "data" ? REPRO_DATA : REPRO, it); }
  var HANDOFFS = [
    { label: ["AIへの", "質問文"], make: questionText, done: "AIへの質問文をコピーしました。AIのチャットに貼り付けてください。" },
    { label: ["他人への", "共有文"], make: shareText, done: "他人への共有文をコピーしました。メッセージに貼り付けてください。" },
    { label: ["AIへの", "再現実装", "依頼文"], make: reproText, done: "再現実装の依頼文をコピーしました。コードを実行できるAI（Claude Code など）に貼り付けてください。" }
  ];

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null || state.view === "list") return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
</body>
</html>
