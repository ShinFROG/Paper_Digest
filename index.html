λ+λE_i)は超マルチンゲールなので、標本数nについての上限はVilleの不等式で扱える。しかし、データを見た後に最良の賭け方λを選ぶsup_λ M_n(λ)が1/xの確率の上界を満たすかは長年の予想で、M_n(λ)はλについて超マルチンゲールでないため従来の技法が使えなかった（§1）。", "p3": "基本対称多項式で作る統計量が非負の準超マルチンゲールになることを示し、Villeの不等式がこの場合にも成り立つことを証明した（§2〜3）。独立より弱く逐次的妥当性より強い依存構造「共有効（co-valid）」なe変数を定義し、その下でsup_λ M_n(λ)より大きい統計量で不等式を示した（定理3.3）。", "p4": "応用として、有界な確率変数の平均の信頼区間、多腕バンディットで使われるKL-inf統計量の集中不等式、平均が異なる場合と複合e値への拡張、SymPolの高速アルゴリズムを示した（§4〜6）。", "p5": "KL-infについて、従来のlog(n+1)/2+log 2の上乗せがない「後悔のない」集中不等式P(nKL_inf≥log(1/α))≤αを得た（系4.5）。この信頼区間の長さは√n倍すると2σ√(2log(2/α))に概収束し、典型的な1/√nの速さで縮む（定理4.6）。SymPolのp値はKL-infのp値以下になる（§7）。", "p6": "著者は、Gaffkeのより強い予想は別の研究（Vlassis and Thomas 2026）が本論文の初版の4か月後に証明しており、仮定と範囲が異なると述べている（§7）。また本論文の区間は固定標本数のもので、任意の停止時刻で有効な区間とは性質が異なる（§4.2）。", "fun": "いくつもの実験の「証拠の強さ」をまとめるとき、結果を見てから一番良いまとめ方を選ぶと、ずるになりそうに思える。ところが、それでも誤りの確率がちゃんと抑えられることを、20年以上前の予想を解く形で証明した。数学の古い宿題が、統計の実用的な道具につながっている。", "unverified": "§5の不均一な平均への一般化（定理5.2）と§6のアルゴリズムの詳細は読んでいない。"}}, {"id": "pn10", "rank": 10, "field": "オペレーションズ・リサーチ", "headline": "選択肢を絞る確率的利用者均衡のリンク型解法", "title": "A Link-Based Algorithm for Stochastic User Equilibrium with Bounded Choice and Local Detour Threshold", "url": "https://arxiv.org/abs/2610.29151", "authors": "Takeshi Nagae", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Nagae, T. (2026). A Link-Based Algorithm for Stochastic User Equilibrium with Bounded Choice and Local Detour Threshold (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29151", "why": "観測される経路選択に合わせて選択肢集合を制限する交通均衡モデルを、効率よく解くアルゴリズムを示した。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（定式化、リンク単位の負荷計算、Anderson加速、数値実験と表1、結論）を読んだ。付録Bの追加ネットワークの詳細は読んでいない", "preprint": true, "p1": "遠回りの度合いで経路の選択肢を制限する確率的利用者均衡（BCM-LDT SUE）を、経路を一切保存せずリンク交通量だけで解く方法を作り、選択肢が合計1,000万経路規模でもパソコンで数分〜15分程度で均衡を求められるようにした。", "p2": "BCM-LDTは、総費用が上限を超える経路や局所的な遠回りがしきい値を超える経路の確率をゼロにし、観測される経路選択に合う選択肢集合を作るが、元の解法は経路交通量を更新するので経路数が増えると計算が重い（§1）。", "p3": "経路の選択確率は、費用の項と局所的遠回り度φ_k（式1）の項の積を重みとする（式2、5）。上限と遠回りのしきい値で枝刈りした深さ優先探索で正の重みの経路をその場で列挙しながら、各リンクを通る重みの和を積算して負荷L(t)を計算する（§2）。未知数がリンク交通量だけになるので、不動点問題x=L(t(x))を準ニュートン型のAnderson加速で解ける（式8、§3）。", "p4": "Anaheimネットワーク（416ノード、914リンク、1,406のOD対）で元の研究と同じ設定（θ₁=θ₂=0.2、τ=1.6）を使い、選択肢集合の一致、反復回数、計算時間を調べた（§4）。", "p5": "OD対(4,7)の均衡時の選択肢はγ=0.8で351経路と元の報告と一致した。γ=0.6・0.8・1.0のすべてで24反復以内に相対残差10⁻⁹に収束し、計算時間は21秒・69秒・156秒、均衡時の選択肢集合の合計は約97万・379万・1,162万経路だった（表1）。元の研究ではγ=1.0で1反復平均180分かかっていた（脚注7）。", "p6": "著者は、BCM-LDT SUEの解の一意性が未確立で、Anderson加速の収束理論も局所的なので大域収束は保証されないこと、シカゴ広域のような大規模網では上限としきい値を厳しくしても選択肢が多すぎることを課題としている（§5）。", "fun": "カーナビが提案する道は1本でも、実際の運転者は「少し遠回りでも慣れた道」を選ぶ。そのような現実的な選び方を全員分考えると候補の道は1,000万本を超えるが、道を1本ずつ覚えずに、各道路を通る量だけを数えていけば、普通のパソコンで解ける。", "unverified": "Winnipeg・Barcelonaでの計算時間の詳細（付録B.2）は読んでいない。"}}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "調達のしきい値操作と選挙前の禁止期間", "title": "Discretion at the Margin: Threshold Manipulation and Electoral Bans in Colombian Public Procurement", "url": "https://arxiv.org/abs/2610.28965", "authors": "Cristian Espinal Maya ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Maya, C. E., & Londoño, S. J. (2026). Discretion at the Margin: Threshold Manipulation and Electoral Bans in Colombian Public Procurement (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28965", "why": "コロンビアの公共調達で、しきい値の下に見積額を操作する行動と、その費用を清浄な識別で測った。", "explain": {"basis": "本文", "basis_note": "arXiv版の抄録、実証戦略、競争と落札者の節（表6）、考察と限界を読んだ。頑健性の節の詳細は読んでいない", "preprint": true, "p1": "コロンビアの公共調達の全記録で、発注者が見積額を法定のしきい値のすぐ下に操作して競争の少ない手続きを使っていること、その結果入札者が半減し値引きも小さくなることを、清浄な識別で示した。", "p2": "調達法は、しきい値の下では速く競争の少ない手続きを認めるが、どれだけ操作され、その費用がいくらかは、丸い数字への集中（例：100万ペソ単位）と区別しにくかった（§1）。", "p3": "見積額を各機関・各年のしきい値で割って規格化し、しきい値の近くを除いた多項式で反事実の密度を当てはめ、しきい値の下の過剰な集中（バンチング）を推定した（式1、§4.1）。しきい値は5つの予算帯ごとに異なり毎年1月に最低賃金とともに動くが、丸い数字は動かない。上限のない手続きでは集中が出ないこと、他の帯の機関を反事実に使うことも確かめた（§4.2）。", "p4": "SECOP IとII（2011〜2026年、SECOP IIだけで8,569,218件）を使い、入札者数・単独入札の割合・値引き率・落札後の増額、大統領選挙前4か月の随意契約の禁止を比べ、チリの固定しきい値とも比べた（§3、§7〜8）。", "p5": "少額購入のしきい値の下に49,631件、入札のしきい値の下に3,157件の過剰があり、しきい値直下5%に観察される件数のそれぞれ86%と63%に当たった（抄録、§9）。入札のしきい値の下に集まった案件の入札者は平均3.52社で、しきい値のすぐ上の6.97社の約半分、値引きは4.6%対8.7%だった（表6）。選挙前の禁止期間には随意契約が95%減り、直前の2週間に209%増えた（抄録）。", "p6": "著者は、標本の93%が機関自身の申告したしきい値を使っていること、プラセボが完全にはゼロでないこと、しきい値の上の欠落が過剰の一部しか説明しないこと、予算帯×年のショックを考慮すると標準誤差が約5倍になること、成果の比較は記述的で因果効果への変換は今後の課題であることを挙げている（§9の限界）。", "fun": "「この金額以下なら簡単な手続きでよい」というルールがあると、見積額がその少し下にぎっしり集まる。しきい値が毎年動くのに集まる場所も一緒に動くので、偶然ではなく意図的だと分かる。しかも、その結果入札する会社が半分になり、税金が余計にかかっている可能性がある。", "unverified": "選挙で選ばれた地方政府と任命された国の機関の差の数値（§6.5）は読んでいない。"}}, {"id": "pn12", "rank": 12, "field": "機械学習", "headline": "対話型ストリーミング動画生成の統一評価", "title": "StreamEval: Evaluating Interactive Streaming Video Generation Models", "url": "https://arxiv.org/abs/2610.28402", "authors": "StreamEval Team", "venue": "Hugging Face Daily Papers", "date": "2026-10-22", "apa": "StreamEval Team. (2026). StreamEval: Evaluating Interactive Streaming Video Generation Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28402", "why": "アバター対話や世界生成など5課題・300ケースで、対話しながら生成する動画モデルを評価する基準を作った。", "explain": {"basis": "本文", "basis_note": "arXiv版の本文（ベンチマークの構築、品質検証、評価設定、指標と集計、分析、結論）を読んだ。各課題の結果表の個別の数値は読んでいない", "preprint": true, "p1": "会話するアバター、指示で変わる世界生成、走っている映像の編集など、対話しながら生成するストリーミング動画のモデルを5つの課題で一貫して評価するベンチマークStreamEvalを作り、37モデルを評価した。", "p2": "ストリーミング動画生成は進歩しているが、途中で次々に届く要求を実行し、確立した状態を保ち続けられるかを統一的に測る基準がなかった（§1）。", "p3": "15〜300秒の300の台本つき試験ケース（各課題60）を作り、各ケースに初期素材、時刻つきで届くマルチモーダルの要求、各チェックポイントで確立・保持・取消・復元すべき状態の正解（オラクル）を定めた（§2.2）。合成音声は単語誤り率0.25以下、自動判定器は偽陽性5%以下などの基準で較正した（§2.5）。", "p4": "課題実行（Dialogue、Following、Edit Success）、状態の一貫性、視覚的忠実度、音声と映像の同期の4次元・10指標を0〜100で測り、各ケース3回の繰り返しと5つの長さの層を平均して集計した（式1〜3）。未出力や未対応の操作は0点とした（§3.2.2）。", "p5": "視覚品質と同一性の保持が高くても、要求の実行や状態の一貫性が高いとは限らなかった。最も高い課題別の点数でも、アバターの動作でFollowing 36.90、テキスト条件の世界生成でFollowing 25.93、参照画像による編集でEdit Success 15.00だった（抄録、§6）。記録した編集の例では、マントを金色に替える要求の後も元の灰色のマントが残った（§4.1、図5）。", "p6": "著者は、人による対比較の判断を集めて採点規則との一致を調べることを次の課題としている（§6）。また編集の表は評価後にOverall 5以上の構成だけを示しており、掲載の選び方が評価後に決まっている点に注意が要る（§3.1）。", "fun": "AIが作る動画はとてもきれいになったが、「今から帽子をかぶって」「やっぱり外して」と話しかけながら作らせると、ほとんど言うことを聞かない。見た目の美しさと、指示どおりに動き続ける力は別物で、後者はまだ100点満点で十数点〜30点台にとどまっている。", "unverified": "課題別の各モデルの点数（表2〜6）は読んでいない。"}}, {"id": "pn13", "rank": 13, "field": "組織行動・心理的安全性", "headline": "ギグ基盤はチームでの受注を認めるべきか", "title": "When should Gig Platforms Allow Teams?", "url": "https://doi.org/10.2139/ssrn.7646258", "authors": "Wee Kiat Lee ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Lee, W. K., & Luo, D. (2026). When should Gig Platforms Allow Teams? https://doi.org/10.2139/ssrn.7646258", "why": "指名した提供者以外が仕事に加わることの利点と責任の問題を、ギグ基盤の設計としてモデル化した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "ギグ基盤で、指名された提供者以外の作業者が仕事に加わることを、禁止・都度の顧客承認・正式なチームの承認のどれで扱うべきかをゲーム理論で分析し、中程度の損失では都度承認が最も良いことを示した。", "p2": "顧客は特定の提供者を選んで契約するので、別の作業者が関わると許可と責任の問題が生じる。一方で、別の技能が必要なときや最初の試みが失敗したときに、もう1人がいれば完了できる仕事もある（抄録）。", "p3": "基盤が、別の作業者の参加を禁止する、顧客の都度の承認を求める、正式なチームとして認める、という3つの規則を選び、提供者と顧客が反応するゲーム理論のモデルを作った（抄録）。", "p4": "別の作業者が関わったサービス失敗が基盤に与える損失の大きさ、責任の執行の強さ、隠れた参加の可能性に応じて、どの規則が基盤にとって良いかを比べた（抄録）。", "p5": "失敗の損失が中程度のとき、都度承認は価値のある補助を残しつつ採算の合わない再割当てを抑えることで、禁止とチーム承認の両方を上回った。責任の執行を強めるとこの中間の領域は広がるが、参加を制限すると同じ責任の仕組みが隠れた補助を促しうる（抄録）。", "p6": "抄録からは、モデルの具体的な仮定（作業者の技能の分布、情報の非対称性）は分からない。解釈：実データでの検証は示されておらず、理論の予測が実際の基盤でどこまで当てはまるかは今後の課題である。", "fun": "指名した人とは別の人がこっそり手伝うのは、悪いことなのか助けになるのか。禁止すると隠れて手伝うようになり、全面的に認めると責任があいまいになる。「その都度お客さんに聞く」という中間のルールが一番うまくいく場合がある、というのは身近な職場のルールづくりにも通じる。", "unverified": "モデルの仮定の詳細と、中間の領域の具体的な条件は抄録からは確認できなかった。"}}, {"id": "pn14", "rank": 14, "field": "人口学", "headline": "相続を受けると遺産動機は受け継がれるか", "title": "Inheritance Receipt and the Transmission of Bequest Motives", "url": "https://doi.org/10.31235/osf.io/sptke_v1", "authors": "Thelonious Lyle Goerz ほか", "venue": "SocArXiv", "date": "2026-10-22", "apa": "Goerz, T. L., & Reyes, A. (2026). Inheritance Receipt and the Transmission of Bequest Motives. https://doi.org/10.31235/osf.io/sptke_v1", "why": "高齢化で相続の時期が遅くなるなか、相続の受け取りが本人の遺産動機にどう影響するかを検証した。", "explain": {"basis": "本文", "basis_note": "SocArXiv（OSF）のPDF本文（データと標本、イベントスタディの方法、結果、他の臨時収入との比較、限界、結論）を読んだ", "preprint": true, "p1": "米国の高齢者パネルで、親から相続を受けると、本人が自分も遺産を残そうとする動機が持続的に高まり、その効果は資産の増加や他の臨時収入では説明できないことを示した。", "p2": "高齢化で相続を受ける年齢が上がり、少子化で相続が少数の相続人に集中しているが、相続が資産だけでなく「次世代に残す」という規範を伝えるかは検証されていなかった（抄録）。", "p3": "健康と退職の調査（HRS、1994〜2018年）で、相続を受けた時期が人によって異なることを使い、個人と調査年の固定効果を入れたイベントスタディ（式1、受け取りの2年前を基準）と、2000〜2010年の6コホートを使う積み重ね型のイベントスタディで推定した（方法）。", "p4": "1万ドル・10万ドルの遺産を残す主観的確率を結果とし、資産の対数を統制した場合としない場合、保険金や示談金などの他の臨時収入との比較、受け取り年齢・子の数による違いを調べた（結果）。", "p5": "受け取った回に1万ドルの動機は3.66ポイント（標本平均63.7の5.7%）、10万ドルの動機は5.79ポイント（平均40.0の14.5%）上がり、8年後も10万ドルで5.21ポイントが残った（結果、図1〜2）。積み重ね型でも同程度だった（図3）。10万ドルの動機への効果は親の相続5.15ポイントに対し他の臨時収入1.06ポイントで、差4.09（p=.007）だった（表2）。効果は子の少ない親で最も大きかった（抄録）。", "p6": "著者は、実際の遺産ではなく主観的確率を使っていること、受け取り年齢による違いは選択を含み記述的に解釈すべきこと、対象は50歳以上の米国人に限られること、窓を12年に広げると最も早い期間で1万ドルの動機にずれが見られることを限界に挙げている（限界の節）。", "fun": "親から遺産を受け取った人は、お金が増えたからではなく「自分も子に残すものだ」という気持ちを受け継ぐらしい。宝くじのような臨時収入ではこの効果は小さい。子どもが少ないほど、その気持ちが少数の相続人に集中して伝わり、家族間の格差を広げうるという点が、少子化社会への示唆になる。", "unverified": "子の数による異質性の具体的な係数（表）は読んでいない。"}}, {"id": "pn15", "rank": 15, "field": "因果推論", "headline": "処置群と対照群が1つずつの差の差分析の推論", "title": "Two-cluster Difference-in-Differences via Maximally Detectable Placebo Effect", "url": "https://doi.org/10.2139/ssrn.7645879", "authors": "Mark Louie Ramos", "venue": "SSRN", "date": "2026-10-22", "apa": "Ramos, M. L. (2026). Two-cluster Difference-in-Differences via Maximally Detectable Placebo Effect. https://doi.org/10.2139/ssrn.7645879", "why": "クラスタが2つしかない差の差分析で、事前期間のプラセボ効果の分布から検出可能な最小効果を定める方法を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用。本文は入手できず", "preprint": true, "p1": "処置群と対照群がそれぞれ1つのクラスタしかない差の差分析で、介入前のプラセボ効果の分布から「プラセボのばらつきと区別できる最小の処置効果（MDPE）」を求める推論の枠組みを提案した。", "p2": "処置のクラスタが1つと対照のクラスタが1つしかないDiDでは、クラスタ単位の情報が少なすぎて、通常のクラスタ頑健な推論ができないという長年の問題がある（抄録）。", "p3": "漸近近似でクラスタのばらつきを推定する代わりに、介入前の期間で観察されるプラセボ効果の経験分布に直接合わせて推論を較正し、観察されたデータの下で区別できる最小の効果を求める（抄録）。", "p4": "シミュレーションで、従来のクラスタ頑健な推論が使えない場合に、この枠組みが処置効果のもっともらしさについて解釈しやすい証拠を出せるかを示した（抄録）。", "p5": "シミュレーションにより、従来の方法が使えない状況でも、推定された効果がプラセボの変動の範囲を超えるかどうかを判断できることを示したと報告している（抄録）。", "p6": "抄録からは、介入前の期間がどれだけ必要か、プラセボ効果が時間的に相関する場合にどう扱うかは分からない。解釈：介入前と介入後でばらつきの性質が変わると、較正が適切でなくなる可能性がある。", "fun": "1つの町に政策を入れ、隣の町と比べるだけでは、差が出ても「たまたまかも」と言われてしまう。そこで、政策を入れる前の時期に「偽の政策」を入れたことにして、どれくらいの差なら偶然でも出るかを調べ、それを超える差かどうかで判断する。比べる相手が少ないときの知恵だ。", "unverified": "シミュレーションの設定と数値結果は抄録からは確認できなかった。"}}, {"id": "pn16", "rank": 16, "field": "経済学", "headline": "記憶を操作する説得", "title": "Memory Manipulation", "url": "https://arxiv.org/abs/2610.29847", "authors": "Benson Tsz Kin Leung", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Leung, B. T. K. (2026). Memory Manipulation (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29847", "why": "受け手が思い出す信号の確率を操作する説得をモデル化し、ベイズ的な受け手が補正しても操作が効く条件を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "受け手が過去の情報を思い出す確率を操作する「記憶を通じた説得」を理論化し、その効き目と限界を示した。", "p3": "操作者が、ベイズ的な意思決定者が受け取った信号を想起する確率を変えるモデルで、意思決定者が想起確率の偏りを補正することを前提に分析した（抄録）。", "p5": "操作は事後確率の平均を動かせず、記憶の少ない人には逆効果だが、記憶の多い人は誤った状態を強く確信させられる。独占価格の応用では操作が最適価格を上げ、物語による説得の応用では情報提供を減らしエコーチェンバーを生む（抄録）。", "fun": "「ある出来事を思い出させやすくする」だけで、うそをつかずに人の考えを動かせる。でも相手が賢く「思い出しやすさの偏り」を割り引くと、平均では動かせない。記憶の多い人ほどだまされやすい、という結果は直感に反して面白い。", "unverified": "なし"}}, {"id": "pn17", "rank": 17, "field": "経済学", "headline": "真実と欺瞞：言語の不完全さと嘘のコスト", "title": "Truth and Deception", "url": "https://arxiv.org/abs/2610.28783", "authors": "Jeremy Bertomeu ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Bertomeu, J., & Cheynel, E. (2026). Truth and Deception (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28783", "why": "組織の言語が状態を不完全に表すとき、嘘のコストと欺瞞の相互作用を理論的に分析した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "組織の言語が実態を不完全に表すとき、「うそのコスト」と「欺瞞のコスト」がどう相互作用して伝達の質を決めるかを理論的に示した。", "p3": "言語が定める文言からの距離で増えるうそのコストと、相手の信念の歪みで増える欺瞞のコストの2つを置いた送り手-受け手のモデルを分析した（抄録）。", "p5": "うそのコストを上げると偏りと情報量がともに減り、欺瞞のコストを上げると逆になる。ほぼ完全な情報開示を最も効率よく保つのは、欺瞞のコストを高くしつつ、うそを多少許す方針だった（抄録）。", "fun": "言葉どおりでないこと（うそ）と、相手を誤解させること（欺瞞）は別物だ。言葉の厳密さを求めすぎるより、相手を誤解させないことを重く見るほうが、正直な情報が伝わるという結論は、職場のルールづくりにも示唆がある。", "unverified": "なし"}}, {"id": "pn18", "rank": 18, "field": "経済学", "headline": "支配戦略メカニズムの収入保証の等価性", "title": "Revenue Guarantee Equivalence between Dominant-Strategy and Bayesian Mechanisms", "url": "https://arxiv.org/abs/2610.29208", "authors": "Nir Bachrach ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Bachrach, N., Chen, Y.-C., Talgam-Cohen, I., Yang, X., & Zhang, W. (2026). Revenue Guarantee Equivalence between Dominant-Strategy and Bayesian Mechanisms (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29208", "why": "価値分布の情報が限られるオークションで、単純な支配戦略メカニズムがベイズ型と同じ収入保証を持つことを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "入札者の価値の分布がよく分からないとき、単純な支配戦略のオークションが、ベイズ型の最良のメカニズムと同じ最悪時の収入を保証できることを示した。", "p3": "価値分布の情報が限られる下で、支配戦略誘因両立的（DIC）なメカニズムとベイズ誘因両立的（BIC）なメカニズムの、最悪時の最適収入を比べた（抄録）。", "p5": "ランダムな最低価格付きの第二価格オークション、または最低価格なしの標準的な第二価格オークションが、BICで達成できる最悪時の最適収入と等しい収入保証を持つことを示した（抄録）。", "fun": "「正直に入札するのが常に得」という単純なルールのオークションは、もっと複雑で賢い設計に比べて損をしているのでは、と考えられてきた。分布が分からない状況では損をしない、という結果は、シンプルな制度の強さを理論で裏づける。", "unverified": "なし"}}, {"id": "pn19", "rank": 19, "field": "経済学", "headline": "世界29か国50共同体の社会ネットワークデータ", "title": "A cross-cultural dataset on the structure of social networks: The ENDOW project", "url": "https://arxiv.org/abs/2610.28793", "authors": "Eleanor A. Power ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Power, E. A., Redhead, D., Rutter, T., Subramanyam, S., Koster, J., Mulder, M. B., Bowles, S., Jackson, M. O., Alam, N., Alami, S., Alvergne, A., Atkisson, C., Barnes, M., Beheim, B., Beitl, C. M., Brown, M., Caudell, M., Chávez-Páez, W., Chauhan, K., … Ziker, J. P. (2026). A cross-cultural dataset on the structure of social networks: The ENDOW project (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28793", "why": "漁村から都市まで多様な共同体の多層的な社会ネットワークを収集したデータを公開した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "29か国50の共同体から集めた、世帯間の支援の流れを表す多層的な社会ネットワークのデータを公開した。", "p3": "バングラデシュやバヌアツの漁民、フィジーやボリビアの園芸農民、ナミビアやアルゼンチンの牧畜民などの共同体で、世帯を単位とする10種類の物質的・非物質的支援の質問からネットワークを作り、比較した（抄録）。", "p5": "指名のパターンとネットワークの要約統計量は共同体間で大きく異なり、社会ネットワーク構造についての従来の経験則を見直す必要を示唆した（抄録）。", "fun": "「人は平均で何人と助け合うか」といった通説は、主に都市や先進国のデータから作られてきた。世界各地の漁村や牧畜の村まで同じ方法で調べると、その数字がずいぶん違う。人間の社会の多様さを測る物差しになるデータだ。", "unverified": "共同体あたりの世帯数は抄録からは確認できなかった。"}}, {"id": "pn20", "rank": 20, "field": "経済学", "headline": "米国の先願主義への移行と特許競争", "title": "Filing Faster, Not Inventing More: The America Invents Act and Patent Races", "url": "https://doi.org/10.2139/ssrn.7639541", "authors": "Kirill Proskurin", "venue": "SSRN", "date": "2026-10-21", "apa": "Proskurin, K. (2026). Filing Faster, Not Inventing More: The America Invents Act and Patent Races. https://doi.org/10.2139/ssrn.7639541", "why": "先発明主義から先願主義への移行で、企業が発明を増やしたのではなく出願を早めたことを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "米国が特許を「先に発明した人」から「先に出願した人」に与える制度に変えた後、企業は発明を増やしたのではなく出願を急いだことを示した。", "p3": "2013年の米国発明法（AIA）を使い、2007〜2016年の上場企業×技術分類×年のパネルで、改革前の出願競争の激しさが異なる分類を比べる連続的な差の差分析を行った（抄録）。", "p5": "競争の激しい分類ほど出願が増え、改革前の競争が25パーセンタイルから75パーセンタイルになると出願が約22%増えた。平均の質は明確には上がらず、競争にさらされた企業は新分野への参入とR&D支出が減った（抄録）。", "fun": "「早い者勝ち」にすると、みんなが急いで手を挙げるようになるが、中身が良くなるとは限らない。かけっこのルールを変えたら、速く走る人ではなく、早くスタートラインに並ぶ人が増えた、というような話だ。", "unverified": "なし"}}, {"id": "pn21", "rank": 21, "field": "経済学", "headline": "株式市場の反応は企業の有害物質削減を促すか", "title": "Do Equity Markets Spur Corporate Detox?", "url": "https://doi.org/10.2139/ssrn.7647798", "authors": "Ali Ataullah ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Ataullah, A., Le, H., & Wagner, A. F. (2026). Do Equity Markets Spur Corporate Detox? https://doi.org/10.2139/ssrn.7647798", "why": "発がん性物質の報告公表後の株価反応が、企業の環境行動を変えることを記録と実験で示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "株価の反応という市場からのフィードバックが、企業に有害物質の排出を減らさせることを、記録データと実験の両方で示した。", "p3": "米国の発がん性物質報告書の公表後、新たに指定された物質を使う企業の株価反応と有害廃棄物の削減を関連づけ、管理職経験者を対象に株価の情報を無作為に与える実験も行った（抄録）。", "p5": "株価が特に下がった企業ほど有害廃棄物を多く減らし、労働者の曝露が大きい企業で効果が強かった。実験でも負の株価シグナルを受けた参加者は費用のかかる削減を選びやすかった（抄録）。", "fun": "株主が「売る」「口を出す」以外にも、株価そのものが経営者への「通知表」になって行動を変える、という仕組みを示している。値段には情報が詰まっている、という経済学の基本的な考え方が、環境問題でも働いているのが面白い。", "unverified": "効果の大きさは抄録からは確認できなかった。"}}, {"id": "pn22", "rank": 22, "field": "経営学", "headline": "新製品発表での経営者の感情が供給網に波及", "title": "Does Calm Speak Louder? Managerial Emotions and Valuation Spillovers Along Supply Chains", "url": "https://doi.org/10.2139/ssrn.7656037", "authors": "Can Xie ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Xie, C., Du, X., & Xu, Z. (2026). Does Calm Speak Louder? Managerial Emotions and Valuation Spillovers Along Supply Chains. https://doi.org/10.2139/ssrn.7656037", "why": "発表時の表情と声から感情を抽出し、関連企業の株価評価への波及を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "新製品発表会での経営者の落ち着いた感情表現が、サプライチェーンでつながる企業の株式評価を高めることを示した。", "p3": "2017〜2025年の主要22社による391回の発表会から、表情と声の感情の特徴を抽出し、つながりのあるA株上場企業315社の評価と結びつけた（抄録）。", "p5": "落ち着いた表現の割合が高いほど関連企業の評価が高く、市場の信頼を通じた効果で、アナリストの注目が効果を強めた。発表者の推定年齢が若い、顔の魅力度が高い場合に関連が強かった（抄録）。", "fun": "新製品の説明をする社長の表情や声の落ち着きが、その会社だけでなく部品を納める取引先の株価にまで響く。感情の「明るさ」ではなく「落ち着き」に注目した点と、ソフトな情報がサプライチェーンを伝わるという発見が面白い。", "unverified": "効果の大きさは抄録からは確認できなかった。"}}, {"id": "pn23", "rank": 23, "field": "経営学", "headline": "従業員の電子プライバシー法と企業の情報環境", "title": "Privacy Protection and Employee Disclosure: Evidence from Electronic Privacy Laws&nbsp;", "url": "https://doi.org/10.2139/ssrn.7654560", "authors": "Huasheng Gao ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Gao, H., Song, W., Xu, B., & Zhang, Z. (2026). Privacy Protection and Employee Disclosure: Evidence from Electronic Privacy Laws&nbsp; https://doi.org/10.2139/ssrn.7654560", "why": "州ごとに段階導入された従業員の電子プライバシー法を使い、従業員による開示と企業の情報環境への影響を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "従業員のプライバシーを守る法律が、従業員による企業の悪い情報の開示を増やし、企業の情報環境を改善することを示した。", "p3": "雇用主が従業員の私的なオンライン口座や個人端末にアクセスすることを制限する米国の州法が段階的に導入されたことを使い、同じ企業内の保護される従業員とされない従業員も比べた（抄録）。", "p5": "保護が強まると、価値に関わる悪い情報の従業員による開示が増え、その開示は将来の業績、特に悪い業績をよく予測した。経営者の開示と報告の質も上がり、株価暴落リスクが下がった（抄録）。", "fun": "会社に監視されないと分かると、従業員は会社の悪いところを口にしやすくなり、それが投資家にとって有益な情報になる。プライバシーを守ることが、結果として市場の透明性を高める、という意外なつながりを示している。", "unverified": "従業員の開示をどう測ったかは抄録からは確認できなかった。"}}, {"id": "pn24", "rank": 24, "field": "経営学", "headline": "個別合意が新興企業の革新を促す", "title": "I-deals that spark innovation: The power of entrepreneurial orientation and entrepreneurs’ well-being in European start-ups", "url": "https://doi.org/10.2139/ssrn.7656418", "authors": "Irene Sanchez-Turón ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Sanchez-Turón, I., Elgoibar, P., Miranda-Terraza, L. F., & Cruz-Cázares, C. (2026). I-deals that spark innovation: The power of entrepreneurial orientation and entrepreneurs’ well-being in European start-ups. https://doi.org/10.2139/ssrn.7656418", "why": "欧州の新興企業で、働き方の個別合意と起業家の幸福感、企業家志向、革新の関係を分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "従業員と個別に交渉した働き方の合意（i-deals）が、起業家の幸福感と企業家志向を通じて新興企業の革新につながることを示した。", "p3": "社会的交換理論と自己決定理論に基づき、欧州の新興企業106社の調査データをPLS-SEMで分析した（抄録）。", "p5": "i-dealsは企業家志向と起業家の幸福感の両方を高め、幸福感がi-dealsと企業家志向の関係を媒介した。企業家志向は特許と新製品開発で測った革新と強く関連した（抄録）。", "fun": "社員ごとに働き方を柔軟に決めると、社員だけでなく社長の「やりがい」も高まり、会社が挑戦的になる、という連鎖が面白い。小さな会社では人と人の関係がそのまま会社の姿勢に表れやすいのかもしれない。", "unverified": "106社という標本の大きさで推定の安定性がどの程度かは抄録からは確認できなかった。"}}, {"id": "pn25", "rank": 25, "field": "経営学", "headline": "民営化せずに国有株主を再編する改革", "title": "State Ownership without Privatization: Shareholder Reform and SOEs’ Dual Goals", "url": "https://doi.org/10.2139/ssrn.7656036", "authors": "Sujuan xie ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "xie, S., Xu, Y., & Lin, B.-X. (2026). State Ownership without Privatization: Shareholder Reform and SOEs’ Dual Goals. https://doi.org/10.2139/ssrn.7656036", "why": "中国の国有資本の株主再編が、国有企業の戦略的革新と会計上の成果の両立にどう効くかを分析した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "中国で国有株主を専門の資本運営会社に再編する改革が、民営化せずに国有企業のグリーン革新を高めたことを示した。", "p3": "国有資本投資・運営会社（SCIOC）が上場国有企業の株主になる時期が企業ごとに異なることを使い、段階的な導入の効果を推定した（抄録）。", "p5": "SCIOCの所有はグリーン革新を増やしたが、総資産利益率には有意な影響がなかった。経営者の株式インセンティブを強め、過少投資を和らげた。委任された権限が大きいほど、汚染の多い企業ほど効果が強かった（抄録）。", "fun": "国が会社を手放さなくても、株主としての役割をプロの運用会社に任せるだけで、長い目で見た投資が増える、という結果。所有者が誰かより、どのように所有者の役割を果たすかが大事だ、という見方を示している。", "unverified": "効果の大きさは抄録からは確認できなかった。"}}, {"id": "pn26", "rank": 26, "field": "統計学", "headline": "ガウス混合のNPMLEはヘリンガー距離で最適", "title": "Minimax Optimality of the NPMLE for Gaussian Mixtures in Hellinger Distance", "url": "https://arxiv.org/abs/2610.30109", "authors": "Shayan Hundrieser ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Hundrieser, S., & Manole, T. (2026). Minimax Optimality of the NPMLE for Gaussian Mixtures in Hellinger Distance (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30109", "why": "1次元ガウス混合密度の非パラメトリック最尤推定が、ヘリンガー距離でミニマックス最適であることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "1次元のガウス混合密度を非パラメトリック最尤推定量（NPMLE）で推定すると、ヘリンガー距離でミニマックス最適な速さが得られることを証明した。", "p3": "有限ガウス混合のクラスの局所的なヘリンガー・ブラケティング・エントロピーを鋭く評価し、その鍵として有界次数の多項式の球のL²ブラケティング・エントロピーの上界を示した（抄録）。", "p5": "混合測度がサブガウスなら制約なしのNPMLEは二乗ヘリンガー距離でlog(n)/nの率を達成し、台がコンパクトならlog(n)/(n log log n)の率になる。経験ベイズへの応用で後悔最適性も示した（抄録）。", "fun": "いくつかの山（正規分布）が重なったデータの形を、山の数を決めずに推定する方法が、理論上これ以上速くならない最良の速さで正解に近づくことを示した。実務でよく使われる方法に、理論のお墨付きを与える研究だ。", "unverified": "なし"}}, {"id": "pn27", "rank": 27, "field": "統計学", "headline": "退化U統計量の常時有効検定をブートストラップで", "title": "Boot-AVT: Asymptotically Anytime-Valid Testing with Degenerate U-Statistics via Bootstrap", "url": "https://arxiv.org/abs/2610.28931", "authors": "Jixuan Liu ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Liu, J., Feng, L., Peng, L., & Wang, Z. (2026). Boot-AVT: Asymptotically Anytime-Valid Testing with Degenerate U-Statistics via Bootstrap (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28931", "why": "帰無仮説の下で退化するU統計量に基づく検定を、いつでも止められる形で実行するブートストラップ法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "帰無仮説の下で退化するU統計量に基づく検定を、データを見ながらいつ止めても有効な形で行うブートストラップ法（Boot-AVT）を示した。", "p3": "極限のガウス・カオス過程のブラウン尺度変換と時間反転を使い、観測済みと将来の標本サイズにわたる対数罰則付き最大値が共通の極限分布を持つことを示し、二次の乗数ブートストラップで臨界値を推定した（抄録）。", "p5": "臨界値の一様一致性、サイズの歪みの上界、無限の監視期間での漸近的なサイズαを示し、対立仮説の下で検出力1と有限の期待停止時間を導いた。適合度・二標本・独立性の検定でシミュレーションを行った（抄録）。", "fun": "実験の途中で何度も結果をのぞいて「有意になったら止める」と、本来は誤った発見が増えてしまう。いつのぞいても大丈夫な検定を、広く使われる統計量で作れるようにした点が実用的だ。", "unverified": "なし"}}, {"id": "pn28", "rank": 28, "field": "統計学", "headline": "ワッサースタイン空間での主成分分析", "title": "Lifting PCA in the Wasserstein Space", "url": "https://arxiv.org/abs/2610.29679", "authors": "J\\'er\\'emie Bigot ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Bigot, J., & Bonet, C. (2026). Lifting PCA in the Wasserstein Space (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29679", "why": "分布そのものをデータとする場合の主成分分析を、最適輸送の枠組みで正準的に定義した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "分布そのものをデータとする場合の主成分分析を、ワッサースタイン空間（最適輸送の距離で測る分布の空間）での正準的な拡張として定義した（Lifted PCA）。", "p3": "確率測度の空間での凸拡張による持ち上げの枠組みで、Stiefel多様体とGrassmann多様体上のPCAの変分問題を、一般化した費用のワッサースタイン重心として定式化した（抄録）。", "p5": "ユークリッドのPCAでの2つの定式化の同値性の完全な類似を示し、双対問題、最適性条件、多周辺最適輸送との同値性、経験推定量の一致性、計算アルゴリズムを与えた（抄録）。", "fun": "平均や回帰は「分布のデータ」にも自然に拡張されていたが、主成分分析だけは決定版がなかった。データの1つ1つがヒストグラムのような分布でも、ばらつきの主な方向を取り出せるようにする、数学的に筋の良い拡張だ。", "unverified": "なし"}}, {"id": "pn29", "rank": 29, "field": "統計学", "headline": "スタイン作用素による非正規化モデルの統一的推定", "title": "A unified approach for estimation of unnormalized models via Stein operators", "url": "https://arxiv.org/abs/2610.29510", "authors": "Mitsuki Nagai ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Nagai, M., & Yano, K. (2026). A unified approach for estimation of unnormalized models via Stein operators (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29510", "why": "適切なスコアリングルールとスタイン法を結びつけ、正規化定数のないモデルの推定を統一的に扱った。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "正規化定数が計算できないモデルの推定法（スコアマッチング、比率マッチング、擬似尤度、ノイズ対照推定）を、適切なスコアリングルールとスタイン作用素で統一的に扱った。", "p3": "これらを包む適切なスコアリングルールのクラスを作り、それが自然にスタイン作用素を導くことを示して、作用素に伴う幾何から推定量を調べた（抄録）。", "p5": "スタイン作用素の新しい構成原理を得て、得られる推定量の漸近効率を統一的に特徴づけた（抄録）。", "fun": "確率の合計が1になるように割る「正規化」が計算できない複雑なモデルでも推定する方法はいくつもあったが、ばらばらに発展してきた。それらが同じ数学の型の別の姿だと示すのは、地図を1枚にまとめるような仕事だ。", "unverified": "なし"}}, {"id": "pn30", "rank": 30, "field": "統計学", "headline": "PDE逆問題の逐次エントロピー最適輸送", "title": "Sequential Entropic Optimal Transport for Bayesian Inverse Problems via Multilevel Monte Carlo", "url": "https://arxiv.org/abs/2610.29546", "authors": "Jason Beh ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Beh, J., Del Moral, P., & Jasra, A. (2026). Sequential Entropic Optimal Transport for Bayesian Inverse Problems via Multilevel Monte Carlo (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29546", "why": "偏微分方程式に支配される逆問題のベイズ推定を、多段階モンテカルロと逐次的な最適輸送で効率化した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "偏微分方程式に支配される逆問題のベイズ推定で、多段階モンテカルロ法の組み合わせを逐次的なエントロピー最適輸送で作る新しい方法を示した。", "p3": "精度の異なる数値解法に対応する事後分布の組を、軽いシュレディンガー・ブリッジで学習した最適輸送で結び、組を保つメトロポリス・ヘイスティングスのステップで補正する（抄録）。", "p5": "楕円型の逆問題で平均二乗誤差O(δ²)を最適な費用O(δ⁻²)で達成できることを示した。楕円型、Darcy流、Navier–Stokesの問題で分散を減らした（抄録）。", "fun": "粗い計算と細かい計算を組み合わせて、少ない計算量で精度を出す工夫が多段階モンテカルロ法だ。その組み合わせ方を「分布をどう運ぶか」という最適輸送の問題として学習する、という発想が新しい。", "unverified": "分散の削減の具体的な倍率は抄録からは確認できなかった。"}}, {"id": "pn31", "rank": 31, "field": "統計学", "headline": "不完全な物理知識を使う回帰のミニマックス率", "title": "Minimax Rates for imperfect Physics-Informed Regression", "url": "https://arxiv.org/abs/2610.29532", "authors": "Nathan Doum\\`eche (LPSM)", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Doumèche, N. (2026). Minimax Rates for imperfect Physics-Informed Regression (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29532", "why": "目的関数が偏微分方程式を近似的にしか満たさないとき、物理情報がどれだけ推定を改善するかを率で示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "物理モデル（偏微分方程式）が不完全なときに、物理の知識が回帰の収束の速さをどれだけ改善するかを、ミニマックス率で明らかにした。", "p3": "滑らかさだけを事前情報とする場合を基準とし、モデル誤差の大きさに応じた収束率を、線形の偏微分方程式と一部の非線形の方程式について導いた（抄録）。", "p5": "モデル誤差にはしきい値があり、それを超えると物理の事前知識は収束率を改善しない。しきい値より下では、定数係数の楕円型・双曲型の方程式で率が連続的に改善し、物理が正確なら次元dではなくd−1での学習に相当した（抄録）。", "fun": "「物理法則を入れればAIは賢くなる」とよく言われるが、その法則が少し間違っているとどうなるか。間違いが一定以上なら物理を入れても得はない、というはっきりした境界を示した点が重要だ。", "unverified": "なし"}}, {"id": "pn32", "rank": 32, "field": "機械学習", "headline": "視覚言語エージェントは3次元空間を探索・地図化できるか", "title": "SpatialScout: Can VLM Agents Actively Explore and Map 3D Scenes?", "url": "https://arxiv.org/abs/2610.26659", "authors": "Zhaoxi Zhang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-22", "apa": "Zhang, Z., Liang, H., Wu, L., Wu, Y., Yuan, Y., Liang, K., Tang, C., Qiang, M., Zhang, W., & Li, W. (2026). SpatialScout: Can VLM Agents Actively Explore and Map 3D Scenes? (Version 2). arXiv. https://doi.org/10.48550/ARXIV.2610.26659", "why": "エージェントが自ら視覚情報を取りに行き、3次元の表現にまとめる能力を測る基準を示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を使用", "preprint": true, "short": true, "p1": "視覚言語モデルのエージェントが、自らカメラを動かして室内を探索し、物体の位置を3次元の地図にできるかを測るベンチマークを作った。", "p3": "80の室内シーンと3,140の対象物体からなり、エージェントは物体一覧・画像・カメラ情報を受け取ってカメラを操作し、共通の座標系で物体の中心を推定する。位置の精度と網羅性を物体の大きさに応じた重なりの点数で評価する（抄録）。", "p5": "評価した中で最も強いClaude Opus 5.5でも平均の重なりの点数は41.71%で、IoU 0.5を超えた対象は47.23%、0.9を超えたのは3.25%だった（抄録）。", "fun": "部屋の写真を見て「椅子がある」と答えるのは得意なAIも、自分で歩き回って「椅子はどこにあるか」を正確な地図にするのはまだ苦手。見ることと、空間を把握することの間に大きな差があることが数字で分かる。", "unverified": "なし"}}, {"id": "pn33", "rank": 33, "field": "機械学習", "headline": "実環境から学ぶコンピュータ操作エージェントの環境合成", "title": "Agent World Model in the Wild: Computer-Use Agent Environment Synthesis", "url": "https://arxiv.org/abs/2610.26828", "authors": "Zhaoyang Wang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-22", "apa": "Wang, Z., Wu, Q., Wang, H., Yu, S., Peng, B., Xu, C., Cheng, H., Yao, W., Liu, B., Wang, Y., Gao, J., & Yao, H. (2026). Agent World Model in the Wild: Computer-Use Agent Environment Synthesis (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.26828", "why": "実際のコンピュータ環境を模した学習環境を自動合成し、エージェントの相互作用による学習を拡大した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を使用", "preprint": true, "short": true, "p1": "コンピュータを操作するAIエージェントを訓練するための、実行可能な環境と課題を公開モデルだけで大量に合成するパイプラインを示した。", "p3": "画面操作、MCPサービス、コマンドラインを同時に使える環境を作り、解けること・十分難しいこと・検証器が信頼できることを、複数のエージェントの試行、評価役どうしの一貫性、反実仮想の検査で確かめる品質の関門を設けた（抄録）。", "p5": "このパイプラインで341の長期的な環境を合成したと報告している（抄録の途中まで）。", "fun": "本物のパソコンでAIに練習させると、間違ってファイルを消すなどの危険がある。そこで、練習用の「本物そっくりの仮想パソコン」と問題集を自動で作る。しかもその問題が解けるか、採点が正しいかまで自動で点検する。", "unverified": "訓練したエージェントの成績は、取得した抄録が途中で切れていたため確認できなかった。"}}, {"id": "pn34", "rank": 34, "field": "機械学習", "headline": "最先端エージェントは科学のML改善を自動化できるか", "title": "Automating ML for Science: Can Frontier Agents Climb Scientific Hills in the Wild?", "url": "https://arxiv.org/abs/2610.28763", "authors": "Ming Zhong ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-22", "apa": "Zhong, M., Li, S., Carlini, N., & Jagielski, M. (2026). Automating ML for Science: Can Frontier Agents Climb Scientific Hills in the Wild? (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28763", "why": "科学の機械学習モデルを改善する実課題で、コーディングエージェントが自動研究者として通用するかを評価した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を使用", "preprint": true, "short": true, "p1": "最先端のコーディングエージェントが、科学の機械学習モデルの最良記録をどこまで改善できるかを、11分野20ベンチマークで調べた（Agent4Sci）。", "p3": "順位付けではなく、実際の条件でエージェントがどんな前進を、どこまでできるかを測り、試行の軌跡を分析した（抄録）。", "p5": "すべてのベンチマークで公表済みの最良記録を上回り、Claude Opusの平均相対改善は10.4%だったが、改善はほぼ機械学習の工学的な小技によるものだった。研究の発想や実験管理の軽い補助を加えると、Claude Opusは20.1%、Codexは4.4%から8.1%に伸びた（抄録）。", "fun": "AIは科学の記録を更新できたが、それは「新しい発見」ではなく「調整のうまさ」によるものだった。研究者らしい発想を促すチェックリストを渡すと成績が2倍になる、というのは人間の研究指導にも通じる話だ。", "unverified": "なし"}}, {"id": "pn35", "rank": 35, "field": "機械学習", "headline": "Muonの直交化はヘッセ行列の構造に適応する", "title": "How Does Orthogonalization Adapt to the Neural Network Hessian Structure? A Gradient Self Outer-Product Analysis at Initialization", "url": "https://arxiv.org/abs/2610.28975", "authors": "Shenyang Deng ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Deng, S., Goyal, G., Pang, T., Yu, S., & Yang, Y. (2026). How Does Orthogonalization Adapt to the Neural Network Hessian Structure? A Gradient Self Outer-Product Analysis at Initialization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28975", "why": "AdamWを上回ることの多いMuon最適化が、なぜニューラルネットの曲率構造に合うのかを初期化時の解析で示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "最適化手法Muonの直交化が、なぜニューラルネットの損失の曲率構造（ヘッセ行列）に合っているのかを、初期化時の理論で説明した。", "p3": "層ごとのヘッセ行列が行ブロック対角優位であることと、Muonの暗黙の前処理が勾配の自己外積VVᵀの対角優位のときに同じ構造を持つことに注目し、初期化時のE[GGᵀ]を漸近的に解析した（抄録）。", "p5": "重み行列の過剰パラメータ化が対角優位を生むという直観を、定量的な漸近理論として示した（抄録）。", "fun": "Muonという新しい学習法は、なぜか定番のAdamWより速く学習することが多い。その理由を「ネットワークが大きすぎるほど、学習の地形が直交化と相性の良い形になる」と説明しようとしている。経験則に理屈を与える研究だ。", "unverified": "理論と実際の学習の比較の結果は抄録からは確認できなかった。"}}, {"id": "pn36", "rank": 36, "field": "機械学習", "headline": "文脈内強化学習は事後サンプリングか", "title": "Is In-Context Reinforcement Learning A Posterior Sampler? An Empirical Study", "url": "https://arxiv.org/abs/2610.28977", "authors": "Weiqin Chen ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Chen, W., Du, X., Scutari, G., & Honnappa, H. (2026). Is In-Context Reinforcement Learning A Posterior Sampler? An Empirical Study (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28977", "why": "大規模言語モデルの文脈内強化学習が事後サンプリングとして振る舞うかを実証的に検証した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "文脈内強化学習（パラメータを更新せず文脈から新しい課題に適応する手法）が、実際にはベイズの事後サンプリングとして振る舞っていないことを統計的検定で示した。", "p3": "事後サンプラーが満たすべき2つの必要条件（十分統計量に対する不変性、マルチンゲール性）を検定する方法を作り、Decision-Pretrained Transformerとその変種を、ガウス・ベルヌーイ・線形の多腕バンディットで調べた（抄録）。", "p5": "両方の条件が一貫して破れており、実際に学習したモデルはベイズ的な事後サンプラーとして振る舞っていない可能性が示された（抄録）。", "fun": "理想的な条件ではAIが「確率的に正しく推論している」と証明されていても、実際に作ったAIがそうなっているとは限らない。理論の約束を、統計の検定で実物に対して確かめる、という姿勢が大切だ。", "unverified": "なし"}}, {"id": "pn37", "rank": 37, "field": "機械学習", "headline": "大規模な連続フロー言語モデル", "title": "Large Flow Language Models", "url": "https://arxiv.org/abs/2610.28559", "authors": "Arnav Chavan ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-21", "apa": "Chavan, A., Lee, C., Bamba, U., Yoo, J., Hong, S., Raghunathan, A., & Kim, J. (2026). Large Flow Language Models (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.28559", "why": "並列生成ができる連続フローの言語モデルを数十億パラメータ規模で構築する技法を示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を使用", "preprint": true, "short": true, "p1": "連続的なフローで文章を並列生成する言語モデルを80億パラメータまで効率よく拡大し、自己回帰モデルと同等以上の質と高い処理速度を得た（Lafa）。", "p3": "接頭部には因果的な注意、各ブロック内では双方向・非同期のフローを使うブロック単位のモデルで、学習済みの自己回帰モデルを転用し、300億トークン未満で0.5B・7B・8Bの規模を学習した（抄録）。", "p5": "指示追従・推論・コーディングで自己回帰モデルに並ぶか上回り、フローの草案を同じモデル内で自己回帰的に検証する自己投機的デコードで、同等の質で自己回帰モデルの2.54倍の処理速度を得た（抄録）。", "fun": "今のAIは文章を1語ずつ順に書くが、この方法はまとまった塊を一度に下書きし、それを自分で確認する。下書きと清書を1つのモデルでこなすことで速さと質を両立した、という仕組みが面白い。", "unverified": "なし"}}, {"id": "pn38", "rank": 38, "field": "機械学習", "headline": "推論モデルは考えるほど「いくつか」を字義通りに読む", "title": "Entertain, then Cancel: How Thinking Makes Reasoning Models Read Some and Or Literally", "url": "https://arxiv.org/abs/2610.21204", "authors": "Zhizhuo Kou ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-22", "apa": "Kou, Z., Yang, J., Hao, P., Luo, J., Peng, J., Han, S., & Guo, Y. (2026). Entertain, then Cancel: How Thinking Makes Reasoning Models Read Some and Or Literally (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.21204", "why": "思考時間を延ばすと、推論モデルが会話上の含意を取らず字義通りに解釈するようになることを示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を使用", "preprint": true, "short": true, "p1": "推論モデルに長く考えさせると、「いくつかの」や「または」を会話の含意ではなく論理どおりに読むようになることを示した。", "p3": "重みを固定して思考の長さだけを変え、モデルがどちらの読みを選ぶかを記録し、思考を途中で打ち切って答えさせることで、読みが変わる地点を調べた（抄録）。", "p5": "考えるほど「いくつか（すべてではない）」「または（両方ではない）」の含意が消え、試した多くの公開推論モデルとGPT-5でそうなった。間接的な答えのような文脈による推論は改善した。モデルは最初に含意の読みを持ち、後で打ち消していた（抄録）。", "fun": "「何人か合格した」と聞けば、普通は「全員ではない」と受け取る。ところがAIはよく考えるほど「全員でもありうる」と理屈っぽく読む。考えすぎると空気が読めなくなる、という人間にも覚えのある現象だ。", "unverified": "なし"}}, {"id": "pn39", "rank": 39, "field": "機械学習", "headline": "人の動作から両手の器用な操作を追従制御", "title": "DONIC: Generalist Dexterous Bimanual Tracking Control from Human Demonstrations", "url": "https://arxiv.org/abs/2610.29997", "authors": "Mingze Sun ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-22", "apa": "Sun, M., Cao, Z., Fei, Y., Tao, Q., Wang, Z., Liu, T., Chen, J., Diao, H., Hong, F., Chen, Z., & Liu, Z. (2026). DONIC: Generalist Dexterous Bimanual Tracking Control from Human Demonstrations (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29997", "why": "人のデモから多様な両手操作を追従する汎用的な制御を学ぶ方法を示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を使用", "preprint": true, "short": true, "p1": "人の動作から作った参照に沿って、ロボットの両手で多様な器用な操作を行う汎用の追従制御（DONIC）と、両手操作のデータセット（BiHOI）を示した。", "p3": "229物体・1,575系列の多視点データから再構成した操作をロボットの参照に変換し、近接方策最適化と行動模倣を、成功した実行を訓練データに戻す循環で組み合わせ、物体中心の手ごとの報酬などを導入した（抄録）。", "p5": "1つの方策で、異なる参照にまたがる協調操作を学習できたと報告している（抄録の途中まで）。", "fun": "ふたを開ける、物を持ち替えるといった両手の作業は人には簡単でも、ロボットには指と物の接触の組み合わせが多すぎて難しい。人の動きを手本にし、うまくいった動きを教材として再利用する仕組みで学ばせている。", "unverified": "成功率などの数値は、取得した抄録が途中で切れていたため確認できなかった。"}}, {"id": "pn40", "rank": 40, "field": "因果推論", "headline": "クラスタ化したオンライン実験の分位処置効果", "title": "CAQ: Clustered Asymptotically Anytime-Valid Quantile Treatment Effects for Online Experiments", "url": "https://arxiv.org/abs/2610.30019", "authors": "Diane Lu ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Lu, D., & Oh, E. J. (2026). CAQ: Clustered Asymptotically Anytime-Valid Quantile Treatment Effects for Online Experiments (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30019", "why": "観測が独立でないオンライン実験で、分位点の処置効果を常時監視できる信頼系列を構成した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "利用者ごとに相関した多数のイベントが生じるオンライン実験で、分位点の処置効果をいつ止めても有効に推定できる信頼系列（CAQ）を示した。", "p3": "無作為化は利用者単位だが指標はイベント単位で計算されるという構造に合わせ、利用者内の依存に頑健で任意の停止時刻で有効な分位点の信頼系列と、2群の分位点の差の逐次検定を作った（抄録）。", "p5": "シミュレーションで、クラスタリングの強さや裾の重いデータにかかわらず被覆率と偽陽性率を名目水準に保てたのはCAQだけで、固定期間の方法と独立を仮定する逐次の方法は破綻した（抄録）。", "fun": "ウェブの実験では、1人の利用者が何十回もクリックするので、データは独立ではない。それを無視すると「効果あり」と言いすぎる。中央値や上位10%のような分位点で効果を見たいときにも、正直な幅を出せるようにした。", "unverified": "なし"}}, {"id": "pn41", "rank": 41, "field": "因果推論", "headline": "ネットワーク形成を変える政策の学習", "title": "Policy Learning with Network-Shaping Assignments", "url": "https://arxiv.org/abs/2610.29221", "authors": "Zhenxiao Chen ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Chen, Z., & You, Z. (2026). Policy Learning with Network-Shaping Assignments (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29221", "why": "割り当てがその後の関係形成を変え、効果がネットワークに依存する政策を学習する方法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "割り当てがその後の人間関係（ネットワーク）の形成を変え、成果がそのネットワークに依存するような政策を、データから学習する方法を示した。", "p3": "割り当て後のネットワークの分布に対する成果の応答を積分して政策価値を定義し、割り当てをまたいで情報を集めるモデルベースの方法で、識別と代入推定量、後悔の上界を導いた（抄録）。", "p5": "教室の座席配置と企業グループへの応用で、学習した規則が無作為な割り当てより厚生を改善すると予測された（抄録）。", "fun": "教室の席替えは、誰と仲良くなるかを変え、それが成績にも響く。「誰を隣にするか」が新しい人間関係を生むことまで考えて、最も良い席替えのルールをデータから学ぶ、という問題設定が面白い。", "unverified": "改善の大きさは抄録からは確認できなかった。"}}, {"id": "pn42", "rank": 42, "field": "因果推論", "headline": "炭素価格付けと製造業付加価値の段階的DiD", "title": "Carbon Pricing and Manufacturing Value Added: Staggered Difference-in-Differences Evidence from National Carbon Taxes and Emissions Trading Systems", "url": "https://doi.org/10.2139/ssrn.7646959", "authors": "Sinan Borluk", "venue": "SSRN", "date": "2026-10-21", "apa": "Borluk, S. (2026). Carbon Pricing and Manufacturing Value Added: Staggered Difference-in-Differences Evidence from National Carbon Taxes and Emissions Trading Systems. https://doi.org/10.2139/ssrn.7646959", "why": "157か国の1990〜2022年のデータで、炭素税・排出量取引の導入が製造業付加価値に与えた効果を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "炭素税や排出量取引を導入しても、製造業の付加価値にはっきりした影響は見られないことを157か国のデータで示した。", "p3": "1990〜2022年の157か国で、2008〜2022年に導入した17か国を、導入しなかった140か国と比べるCallaway and Sant'Annaの段階的な差の差推定量を使い、初期の製造業規模と所得層で二重頑健に調整した（抄録）。", "p5": "導入年と続く3年の平均効果は−0.009対数ポイント（95%信頼区間−0.054〜0.040）で、事前期間の係数は合わせてゼロと区別できなかった（p=0.92）。約5%を超える減少は信頼区間から除外された（抄録）。", "fun": "「炭素に値段をつけると工場が逃げて産業が衰える」という心配に対して、少なくとも大きな減少は起きていないことを示した。効果がないことを示すときに、どの大きさまでなら否定できるかを明示している点が丁寧だ。", "unverified": "なし"}}, {"id": "pn43", "rank": 43, "field": "因果推論", "headline": "交通部門の汚職は人命を奪う：中国の失脚事例", "title": "Highway to Hell: How Corruption in China’s Transport Sector Kills, and What Happens When Corrupt Officials Fall", "url": "https://doi.org/10.2139/ssrn.7650596", "authors": "Xianyun Zhang ほか", "venue": "SSRN", "date": "2026-10-21", "apa": "Zhang, X., Wu, Q., & Liu, Q. (2026). Highway to Hell: How Corruption in China’s Transport Sector Kills, and What Happens When Corrupt Officials Fall. https://doi.org/10.2139/ssrn.7650596", "why": "交通担当の汚職官僚の失脚を使い、汚職が道路の安全に与える影響を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "中国で交通部門の汚職官僚が失脚した後、重大な交通事故の死傷者が減ったことを示し、汚職が道路の安全を損なうことを明らかにした。", "p3": "省の交通担当の汚職官僚の失脚を部門固有の統治のショックとして、省と年の固定効果を持つ多期間の差の差で重大事故の死傷者を分析し、イベントスタディやプラセボ検定、媒介分析を行った（抄録）。", "p5": "失脚後に死傷者は平均約63人減り、効果は時間とともに大きくなった。改善は主に道路の質の向上を通じたもので、貧しく、交通支出が多く、道路の質が低かった省で大きかった（抄録）。", "fun": "汚職は税金を盗むだけでなく、手抜きの道路という形で人の命まで奪う。事故の原因を運転手だけでなく、道路を作る側の不正に求めた視点が鋭い。汚職を「隠れた欠陥」と呼ぶ表現も分かりやすい。", "unverified": "なし"}}, {"id": "pn44", "rank": 44, "field": "人口学", "headline": "機械学習で見るポーランドの出生意図とコロナ禍", "title": "Same Constraints in Changing Times? A Machine-Learning Approach to Childbearing and Fertility Intentions in Poland during and after the COVID-19 Pandemic", "url": "https://econpapers.repec.org/RePEc:war:wpaper:2026-32", "authors": "Anna Kurowska ほか", "venue": "RePEc NEP", "date": "2026-09-28", "why": "パネルデータと機械学習で、パンデミック期の出生の予測因子がその後も有効かを検証した。", "explain": {"basis": "抄録", "basis_note": "RePEcに登録された抄録を使用", "preprint": true, "short": true, "p1": "コロナ禍の間に学習した出生の予測モデルが、その後も有効であることをポーランドのパネルデータで示した。", "p3": "2021〜2024年のポーランドのパネル（18〜49歳、1,925人）で、個人・雇用・パートナー関係・家族の特徴を理論に基づき選び、ランダムフォレストで実際の出生と強い出生意図を予測した（抄録）。", "p5": "パンデミック期に学習したモデルはその後もAUC-ROC 0.86の予測性能を保ち、出生と意図は上位20の予測因子のうち16を共有した。関係の満足度、仕事と生活の両立、家事分担が特に重要だった（抄録）。", "fun": "「子どもを持つかどうか」を左右するのは、特別な危機の要因ではなく、夫婦の関係や家事の分け方といった毎日の暮らしの条件だった。危機が終わっても同じ壁が残っている、という結果は少子化を考える手がかりになる。", "unverified": "なし"}}, {"id": "pn45", "rank": 45, "field": "オペレーションズ・リサーチ", "headline": "有限期間で評価されるSLAの費用効率的な在庫", "title": "Cost-Effective Aggregate Service-Level Agreements: Evidence from Spare Parts Inventory", "url": "https://doi.org/10.2139/ssrn.7656439", "authors": "Patrick Helm ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Helm, P., Kiesmüller, G., & Minner, S. (2026). Cost-Effective Aggregate Service-Level Agreements: Evidence from Spare Parts Inventory. https://doi.org/10.2139/ssrn.7656439", "why": "充足率目標が有限期間で評価される補修部品のSLAで、在庫計画を費用効率よく行う方法を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "補修部品のサービス水準合意（SLA）で、品目群全体の充足率が有限期間内に目標を達成する確率を保証する在庫計画を、わずかな追加費用で実現した。", "p3": "間欠需要の下での(R, s, Q)方策の有限期間の充足率分布をマルコフ連鎖で定式化し、集計した機会制約に対するスケーラブルなラグランジュ最適化を作った（抄録）。", "p5": "約7万品目のデータで、品目ごとの確率目標は長期目標の現状より在庫費用が最大49%増えたが、集計した確率目標の増加は最大5.3%だった。企業のベンチマークを最大1.7%改善し、90%目標の達成率の不足は最大1.6ポイントだった（抄録）。", "fun": "1つ1つの部品について「必ず在庫がある」と約束すると在庫が膨らむが、部品のグループ全体で約束すれば、ある部品の欠品を別の部品の余裕で補える。約束の単位を変えるだけで費用が大きく変わる、という発想が面白い。", "unverified": "なし"}}, {"id": "pn46", "rank": 46, "field": "オペレーションズ・リサーチ", "headline": "並列AIエージェントの協働をグラフ構造の分散最適化として", "title": "Parallel AI Agent Collaboration as Graph-Structured Distributed Block Optimization", "url": "https://arxiv.org/abs/2610.30074", "authors": "Hanmin Li ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Li, H., Demidovich, Y., & Richtárik, P. (2026). Parallel AI Agent Collaboration as Graph-Structured Distributed Block Optimization (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.30074", "why": "並列エージェントの局所的な編集が全体を劣化させる問題を、ブロック最適化として定式化した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "並列に働くAIエージェントの局所的な編集を合わせると全体が悪くなる問題を、依存グラフ上のブロック最適化として定式化し、安全な統合の保証を示した。", "p3": "依存グラフの独立集合が互いに干渉しない編集を保証することを使い、最適な分数彩色で統合すると、検証された局所改善の合計のうち1/χ_f(G)（χ_fは分数彩色数）の割合を保てることを証明した（抄録）。", "p5": "この保証は同じ提案から選ぶ統合法の中で厳密で、条件の下で協働の反復は幾何級数的に収束する。コード修復の実験で、単純な統合が失敗する衝突を検証付きの統合で解決した（抄録）。", "fun": "何人かで同じレポートを同時に直すと、互いの修正がぶつかって前より悪くなることがある。どの修正がぶつからないかを「色分け」の数学で見分け、良い修正をなるべく多く安全に取り込む方法を示している。", "unverified": "完了時間の削減の大きさは、取得した抄録が途中で切れていたため確認できなかった。"}}, {"id": "pn47", "rank": 47, "field": "オペレーションズ・リサーチ", "headline": "2次元交通流モデルのデータ駆動の較正", "title": "Data-driven calibration of a two-dimensional traffic flow model: Dimension reduction and optimization strategies", "url": "https://arxiv.org/abs/2610.29557", "authors": "Simone G\\\"ottlich ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "Göttlich, S., & Heieck, J. (2026). Data-driven calibration of a two-dimensional traffic flow model: Dimension reduction and optimization strategies (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29557", "why": "道路の縦横の動きを表す2次元交通流モデルを、次元削減と最適化で実データに較正した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "道路の進行方向と横方向の動きを表す2次元の交通流モデルを、実データに効率よく較正する方法を示した。", "p3": "3パラメータの流束モデルで1つのパラメータが線形に入ることを使い、非線形最小二乗を3次元から2次元に減らし、ドローンの軌跡から都市のセンサーまで3つの実データで、局所的な最適化2種と大域的な最適化3種を比べた（抄録）。", "p5": "次元を減らした定式化は大幅に安く、最適化手法の選び方に左右されにくかった。局所的な方法は適切に初期化すれば最も効率的だった（抄録）。", "fun": "車の流れを水の流れのように式で表すとき、式の中のつまみ（パラメータ）を実際のデータに合わせる必要がある。つまみの1つは計算で消せると気づくだけで、合わせる作業がずっと楽で安定する。", "unverified": "なし"}}, {"id": "pn48", "rank": 48, "field": "オペレーションズ・リサーチ", "headline": "遺伝的プログラミングによる解釈可能な切除平面の選択", "title": "Interpretable Cutting Plane Selection for Mixed-Integer Linear Programming Using Genetic Programming", "url": "https://arxiv.org/abs/2610.29311", "authors": "Gwen maudet ほか", "venue": "arXiv", "date": "Thu, 22 Oct 2026", "apa": "maudet, G., Da Cunha, M., & Danoy, G. (2026). Interpretable Cutting Plane Selection for Mixed-Integer Linear Programming Using Genetic Programming (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.29311", "why": "混合整数計画の切除平面の選び方を、解釈可能な規則として遺伝的プログラミングで学習した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を使用", "preprint": true, "short": true, "p1": "混合整数線形計画の切除平面（整数解を残して小数解を削る制約）の選び方を、解釈可能な規則として学習する初めての枠組み（GPSCS）を示した。", "p3": "遺伝的プログラミングで、切除平面と解法の状況から得た特徴量によるスコア関数を記号式として進化させ、点数の急な落ち込みを統計的に検出して各回に加える数を決める（抄録）。", "p5": "ソルバーSCIPの中で、合成と実世界の7種類のベンチマークで評価したと報告している（結果の数値は抄録の途中で切れている）。", "fun": "最適化の計算を速くする「どの制約を足すか」の判断を、ブラックボックスのニューラルネットではなく、人が読める数式として学ばせる。なぜその選択がよいのかを人が確かめられる点が、実務で使う上で大きい。", "unverified": "性能の比較の数値は、取得した抄録が途中で切れていたため確認できなかった。"}}, {"id": "pn49", "rank": 49, "field": "組織行動・心理的安全性", "headline": "組織が少数の選択肢しか検討しない理由", "title": "Creativity In Alternative Design: Why Organizatios Consider Few Options and How to Expand Feasible Alternative", "url": "https://doi.org/10.2139/ssrn.7648978", "authors": "Desti Purwanti ほか", "venue": "SSRN", "date": "2026-10-22", "apa": "Purwanti, D., & Imron, A. (2026). Creativity In Alternative Design: Why Organizatios Consider Few Options and How to Expand Feasible Alternative. https://doi.org/10.2139/ssrn.7648978", "why": "意思決定の代替案設計の段階で、組織が少数の案しか考えない理由と、実行可能な案を広げる方法を論じた。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "組織が意思決定で少数の選択肢しか検討しない理由と、実行可能性を保ちながら選択肢を広げる方法を、文献と事例から論じた。", "p3": "限定合理性、組織の創造性、デザイン思考、チームの創造性の文献による概念的レビューに、トヨタ・プリウスの開発を例示的な単一事例として組み合わせた（抄録）。", "p5": "選択肢が少ない原因として時間と情報の制約、組織の慣行、認知の偏り、上下関係の圧力などを挙げ、創造性とは案を多く出すことではなく、異なる案が現れ、試され、選別される過程を作ることだと結論した（抄録）。", "fun": "会議で「A案かB案か」だけを議論していると、もっと良いC案に気づけない。プリウスがハイブリッドという別の道を試したように、案を出す段階を意識して設計することが大切だ、という指摘は身近な話し合いにも当てはまる。", "unverified": "実証的なデータの分析は含まれていない（抄録）。"}}, {"id": "pn50", "rank": 50, "field": "組織行動・心理的安全性", "headline": "帰属の病理：個人の自由と社会的支配", "title": "Pathologies of Belonging: Individual Freedom, Social Domination, and Collective Adaptability", "url": "https://doi.org/10.2139/ssrn.7651641", "authors": "Carlos Federico Obregon Diaz", "venue": "SSRN", "date": "2026-10-21", "apa": "Obregon Diaz, C. F. (2026). Pathologies of Belonging: Individual Freedom, Social Domination, and Collective Adaptability. https://doi.org/10.2139/ssrn.7651641", "why": "形式的な包摂や参加の機会があっても能力が発揮されない状況を、帰属の病理として理論化した。", "explain": {"basis": "抄録", "basis_note": "SSRNの抄録（Crossrefに登録されたもの）を使用", "preprint": true, "short": true, "p1": "個人の「帰属の病理」が、社会的な支配や集団の適応力とどう結びつくかを説明する理論的枠組みを示した。", "p3": "感情的な依存、所有欲、承認への強迫、防衛的な孤立などの帰属の形を検討し、崩壊・硬直・代替という時間の流れで、目先の安心と将来の可能性の喪失が共存する仕組みを説明した（抄録）。", "p5": "損なわれた帰属は、成員の満足と成長を直接妨げ、さらに代替案を生み出し、練り上げ、伝え、評価する力を制限して、制度が主体性に開かれていることの効果を弱めると論じた（抄録）。", "fun": "会社や学校に「所属している」ことと、そこで自分の力を発揮できることは違う。居場所への不安やしがみつきが、個人の自由だけでなく、組織が新しいアイデアを生む力まで弱める、という見方は、心理的安全性の議論ともつながる。", "unverified": "実証的なデータの分析は含まれていない（抄録）。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "LLMはSNS上の熟議の質を測れるか", "title": "Can AI Gauge Deliberative Quality? Evaluating Deliberation on Social Media With Large Language Models", "url": "https://doi.org/10.17645/mac.12494", "authors": "Patrick Frey ほか", "venue": "Media and Communication", "date": "2026-10-22", "sjr": 1.089, "citescore": 6.0, "citescore_year": "2025", "apa": "Frey, P., Bhattacharya, S., Wiedemann, G., & Puschmann, C. (2026). Can AI Gauge Deliberative Quality? Evaluating Deliberation on Social Media With Large Language Models. Media and Communication, 14. https://doi.org/10.17645/mac.12494", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "本文", "basis_note": "出版社のPDF本文（方法とデータ、人手による符号表の検証、LLMの分類手順と性能（表1）、考察、結論と限界）を読んだ", "preprint": false, "p1": "SNS上の議論の熟議の質を、合理性や礼節のような古典的な次元（Type I）だけでなく、感情・共感・語り・内省・ユーモアのような包摂的な次元（Type II）まで含めて、公開重みのLLMで信頼できる精度で測れることを示した。", "p2": "オンラインの議論は大量で、どこにカウンタースピーチ（無礼な発言への対抗発言）の介入が必要かを見極めにくい。既存の自動測定はType Iに偏り、試したLLMも少なかった（抄録、§3）。", "p3": "13の熟議の次元の符号表を作り、各コメントを返信先のコメントと組にして人が符号化した。LLMには役割の指示、対象の投稿と文脈、カテゴリの定義、正例と負例を1つずつ、ラベルの分布の情報を与える1ショットの方式で、温度0でラベルを付けさせた（§4.2、§5.1）。", "p4": "人の符号化（Krippendorffのα、層化標本で13中11カテゴリが.80超）を正解とし、8つの公開重みモデルを、不均衡なデータに適したマクロ平均の適合率・再現率・F1で比べた。選んだモデルを、ドイツ語の気候変動に関するXの議論6万4,223件（公人3,447件、一般利用者6万776件、1,251会話）に適用した（§4.1、§5.2）。", "p5": "マクロF1はGPT-OSS:120Bが.77で最高、思考型の小さいGPT-OSS:20BとGemma4:26Bが.75で、より大きいLlama3.3:70B（.71）を上回り、Llama3.1:8Bは.54だった（表1、§5.2）。公人は礼節・合理性・建設性・公益志向のType Iの発言が多く、一般利用者は相互の応答・ユーモア・否定的な感情が多く、無礼な発言も多かった（抄録、§6.2）。", "p6": "著者は、2回目の検証で層化抽出したため、全体より検出しやすい例が多く含まれた可能性と、ラベル分布の情報をプロンプトに入れる方法が他のデータに移せるかは未検証であることを限界に挙げている（§7）。", "fun": "「良い議論」とは理屈が通っていて礼儀正しいことだけではなく、自分の体験を語ったり、相手の気持ちに寄り添ったりすることも含まれる。そうした見えにくい良さまでAIで数えられるようになった。しかも、考えてから答える小さめのAIが、大きなAIに勝つこともある。", "unverified": "次元別の分類性能（付録C）と、公人と一般利用者の差の具体的な割合は読んでいない。"}}, {"id": "jr02", "rank": 2, "headline": "可動橋の亀裂前後で常時微動の卓越周波数が変化", "title": "Ambient vibration–based damage detection for sustainable railway infrastructure: a case study of the Vänersborg railway bascule bridge", "url": "https://doi.org/10.1088/1755-1315/1674/1/012057", "authors": "Quang-Vinh Pham ほか", "venue": "IOP Conference Series: Earth and Environmental Science", "date": "2026-10-22", "citescore": 1.4, "citescore_year": "2025", "apa": "Pham, Q.-V., Tien, T. D., & Thi, T. V. T. (2026). Ambient vibration–based damage detection for sustainable railway infrastructure: a case study of the Vänersborg railway bascule bridge. IOP Conference Series: Earth and Environmental Science, 1674(1), 12057. https://doi.org/10.1088/1755-1315/1674/1/012057", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "本文", "basis_note": "出版社のPDF本文（橋とデータ、手法、損傷前後の卓越スペクトルピークの変化と表1、センサー間の比較）を読んだ", "preprint": false, "p1": "損傷の前後の実測加速度が公開されているスウェーデンの鉄道可動橋（Vänersborg橋）で、常時微動の卓越スペクトルピークを追跡し、亀裂の近くのセンサーで明確な変化を捉えた事例研究。", "p2": "橋梁のSHMの研究は多いが、確認された損傷の前と後の両方を計測した実橋の事例はまれで、振動に基づく指標が現場でどう振る舞うかの検証が不足している（§1）。", "p3": "200 Hzで記録された約10分の開閉時の記録を3・5・10秒の窓に分け、ピーク加速度が0.005 m/s²未満の窓だけを常時微動として残し、オフセット除去とトレンド除去の後、ハン窓をかけて0.5〜50 HzのFFTを行い、目立ちの基準を満たす最大の振幅のピークを卓越ピークとした（§3）。", "p4": "2023年3月9日にカウンターウェイト付近のトラス部材で亀裂が確認された前後で、5つの加速度計（A1〜A5、A4は水平）の卓越ピークの平均・中央値・標準偏差を比べた（§2、表1）。", "p5": "A5では、損傷前の卓越ピークの中央値が約1.3〜1.4 Hzだったのに対し、損傷後は10.2〜10.33 Hzに集中し、ばらつきも小さくなった（表1）。窓長は5秒（周波数分解能約0.20 Hz）が最も安定した（§4.1）。同じ位置で水平方向を測るA4では変化が見られず、A3はわずかな変化だった（§4.2、抄録）。", "p6": "著者は、追跡したのは一貫して同定した固有振動数ではなくFFTの最大ピークなので、1.5 Hzから10 Hzへの変化はピークやモードの入れ替わりを含みうること、環境・運用・励振・処理の影響は正規化とモード追跡なしには除外できないことを認めている（§4.1）。", "fun": "橋の亀裂を見つけたのは、揺れの中で一番目立つ「音の高さ」が変わったことだった。ただし同じ場所でも横向きのセンサーは変化に気づかず、縦向きのセンサーだけが気づいた。どこに、どの向きでセンサーを付けるかで、異常が見えたり見えなかったりする。", "unverified": "A1・A2の結果の詳細と、しきい値0.005 m/s²の感度分析の有無は確認できなかった。"}}, {"id": "jr03", "rank": 3, "headline": "孝行規範の下の介護燃え尽きの尺度開発", "title": "Filial Caregiving Burnout in the Chinese Cultural Context: Conceptualization, Scale Development, and Longitudinal Validation", "url": "https://doi.org/10.1111/famp.70212", "authors": "Bingyan Zhou ほか", "venue": "Family Process", "date": "2026-10-21", "sjr": 1.024, "citescore": 4.9, "citescore_year": "2025", "apa": "Zhou, B., Li, Y., Wang, W., & Li, Y. (2026). Filial Caregiving Burnout in the Chinese Cultural Context: Conceptualization, Scale Development, and Longitudinal Validation. Family Process, 65(4). https://doi.org/10.1111/famp.70212", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は入手できず", "preprint": false, "p1": "中国の儒教的な孝行規範の下で、成人した子が親を介護するときの「孝行介護の燃え尽き（FCB）」を概念化し、17項目・3因子の尺度を開発して縦断的に妥当性を確かめた。", "p2": "従来の介護負担の尺度は、感情的な離脱、関係の緊張、内面化した義務と介護の現実がぶつかるときの価値の不協和のような、役割と文化に根ざした経験を捉えにくい。FCBは見出されていたが、定義と測定道具がなかった（抄録）。", "p3": "探索的な順次型の混合研究法で、まず質的インタビューから項目候補を作り、3つの独立した介護者の標本（計1,653人）で探索的・確認的因子分析と測定の不変性の検定を行い、2時点の縦断デザインで予測的妥当性を調べた（抄録）。", "p4": "内的一貫性（α）、モデルの適合、性別と戸籍（都市・農村）による測定の不変性、ベースラインのFCBがその後の家庭と仕事の成果を予測するかで評価した（抄録）。", "p5": "最終的な17項目の尺度は、心身の消耗、関係からの離脱、孝行の価値の調節不全の3因子構造で、α=0.948、適合は許容範囲、性別と戸籍で測定が不変だった。ベースラインのFCBが高いほど、その後の家庭と仕事の成果が低く、家族への足の引っ張りと非生産的な職務行動が多かった（抄録）。", "p6": "抄録からは、標本の募集方法と、他の介護負担尺度との弁別的妥当性の結果は分からない。解釈：中国の文化に根ざした尺度なので、他の文化圏で使うには再検証が必要だ。", "fun": "親の介護で疲れ果てるのは体だけではない。「子として当然」という思いと、もう続けられないという現実がぶつかると、心が親から離れていく。そうした文化特有の苦しさを測る物差しを作り、それが仕事ぶりにまで影響することを追跡で確かめている。", "unverified": "項目の具体的な内容と、縦断の追跡期間は抄録からは確認できなかった。"}}, {"id": "jr04", "rank": 4, "headline": "顧客のサイバー侵害後に監査人は専門家を増やす", "title": "Auditors' Response to Clients' Cyber Breaches: A Human‐Capital Perspective", "url": "https://doi.org/10.1111/1911-3846.70092", "authors": "Bing Li ほか", "venue": "Contemporary Accounting Research", "date": "2026-10-22", "sjr": 3.686, "citescore": 7.3, "citescore_year": "2025", "apa": "Li, B., Li, Y., Pittman, J., & Wang, W. (2026). Auditors’ Response to Clients’ Cyber Breaches: A Human‐Capital Perspective. Contemporary Accounting Research. https://doi.org/10.1111/1911-3846.70092", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は入手できず", "preprint": false, "p1": "顧客企業がサイバー攻撃の被害を受けた後、監査事務所がサイバーセキュリティの専門家の採用を増やすことを、求人データで示した。", "p2": "サイバー侵害は顧客のリスクを変えるが、監査人の生産のやり方（人的資本の構成）まで変えるのかは分かっていなかった（抄録）。", "p3": "オンラインの求人データで、監査事務所ごとのサイバーセキュリティ専門家の需要を測り、顧客の侵害の前後で比べた。自分の顧客の侵害か同じ監査法人の他事務所の顧客か、財務情報が関わるかで違いを調べた（抄録）。", "p4": "サイバー重視の事務所とそうでない事務所の両方で効果を確かめ、サイバーの人的資本への投資が多い事務所が、高リスク業種の顧客の市場シェアを保てるかも調べた（抄録）。", "p5": "顧客の侵害の後、監査事務所はサイバーセキュリティ専門家の需要を増やし、その効果は自分の顧客の侵害で、財務情報が直接関わる場合に大きかった。サイバーの人的資本への投資が比較的多い事務所は、侵害後も高リスク業種での市場シェアをよりよく保った（抄録）。", "p6": "抄録からは、効果の大きさと、求人が実際の採用に結びついたかは分からない。解釈：求人は需要の代理指標であり、実際の人員構成の変化は別のデータで確かめる必要がある。", "fun": "取引先がハッキングされると、会計監査の会社は「パソコンに詳しい人」を慌てて募集する。監査はお金の数字を確かめる仕事だが、今やITの安全まで見なければならない。求人広告という意外なデータから、仕事の中身の変化を読み取っている。", "unverified": "効果の大きさと標本の期間は抄録からは確認できなかった。"}}, {"id": "jr05", "rank": 5, "headline": "ブランド共同体の信頼を担う人々の組み合わせ", "title": "Trust Portfolios in Online Brand Communities: Distributed Human Credibility, Trust Transfer, and Effortless Marketing", "url": "https://doi.org/10.3390/admsci16100520", "authors": "Mara F. Singer ほか", "venue": "Administrative Sciences", "date": "2026-10-21", "citescore": 6.6, "citescore_year": "2025", "apa": "Singer, M. F., & Wilkinson, M. (2026). Trust Portfolios in Online Brand Communities: Distributed Human Credibility, Trust Transfer, and Effortless Marketing. Administrative Sciences, 16(10), 520. https://doi.org/10.3390/admsci16100520", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は入手できず", "preprint": false, "p1": "オンラインのブランド共同体で、信頼をつくる複数の人々の声の組み合わせを「信頼ポートフォリオ」として概念化し、それがブランドへの信頼を集合的に築く枠組みを示した。", "p2": "ブランド共同体では信頼性が複数の人に分散しているのに、研究は信頼の源を個別に、あるいは1つの推奨者の集団だけを扱ってきた（抄録）。", "p3": "情報源の信頼性、信頼の移転、ブランド共同体、社会関係資本、従業員による推奨の研究から、信頼性を確立する仕組み（専門性、実体験、聴衆との関係、立場上の権威、独立性、手続きの公正）で役割を区別した（抄録）。", "p4": "概念的な枠組みと例示的な事例で、ポートフォリオの価値が何で決まるか、統治をどう役割ごとに変えるべきかを検討した（抄録）。", "p5": "役割は交換できず、ポートフォリオの価値は役割の多様さ、質問と役割の適合、信頼性の個人と役割への分散で決まる。透明性と監督は関係者の信頼性を強める一方で、他の成員の信頼性の基礎である独立性を損ないうるので、統治は役割ごとに区別すべきだと論じた（抄録）。", "p6": "実証的なデータの分析は含まれておらず、事例は例示にとどまる（抄録）。解釈：枠組みが示す役割の区別を測定する尺度は、今後の研究で作る必要がある。", "fun": "ある商品を信じるきっかけは、専門家の説明、実際に使った人の体験談、公平な第三者の評価などさまざまで、1人の声では足りない。会社が口を出しすぎると、第三者の「独立しているからこそ信じられる」価値が失われる、という指摘が面白い。", "unverified": "例示した事例の具体的な内容は抄録からは確認できなかった。"}}, {"id": "jr06", "rank": 6, "headline": "変革型リーダーシップと教師のwell-being", "title": "Exploring the link between transformational leadership and teacher professional well-being through work engagement and psychological safety", "url": "https://doi.org/10.1177/17411432261500577", "authors": "Didem Koşar ほか", "venue": "Educational Management Administration and Leadership", "date": "2026-10-22", "sjr": 1.797, "citescore": 11.2, "citescore_year": "2025", "apa": "Koşar, D., Has Erdogan, B., Arslan, Y. B., Süt, M., & Sönmez, E. (2026). Exploring the link between transformational leadership and teacher professional well-being through work engagement and psychological safety. Educational Management Administration & Leadership. https://doi.org/10.1177/17411432261500577", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は入手できず", "preprint": false, "p1": "変革型リーダーシップが教師の職業上のwell-beingを高める経路で、仕事への熱意（ワーク・エンゲージメント）が媒介し、心理的安全性がその効き目を左右することを多層の分析で示した。", "p2": "校長のリーダーシップと教師のwell-beingの関係が、どんな条件でどう生じるかという条件付きの関係は十分に検討されていなかった（抄録）。", "p3": "トルコの基礎教育・後期中等教育の83校の教師976人のデータに、ベイズ推定による多層構造方程式モデリングで、学校レベルをまたぐ調整付き媒介モデルを当てはめた（抄録）。", "p4": "変革型リーダーシップ→ワーク・エンゲージメント→職業上のwell-beingの間接効果と、心理的安全性による調整を検定した（抄録）。", "p5": "変革型リーダーシップはwell-beingと正に関連し、ワーク・エンゲージメントが有意な間接効果を担った。心理的安全性は、リーダーシップとエンゲージメントの関係、およびwell-beingへの間接効果を有意に調整した（抄録）。", "p6": "抄録からは、横断データか縦断データかは明示されておらず、効果の大きさも分からない。解釈：横断データであれば因果の向きは確定できず、トルコの教育の文脈に限られる。", "fun": "「やる気を引き出す校長」がいても、先生たちが「失敗を話しても大丈夫」と感じられる職場でなければ、その効果は弱まる。リーダーの力と職場の空気が掛け算で効く、という結果は、学校以外の職場にも当てはまりそうだ。", "unverified": "調査の時点の数（横断か縦断か）と効果の大きさは抄録からは確認できなかった。"}}, {"id": "jr07", "rank": 7, "headline": "仏の公営住宅割当法は所得混住を進めたか", "title": "Building without income mixing: public housing quotas in France", "url": "https://doi.org/10.1093/jeg/lbag072", "authors": "Guillaume Chapelle ほか", "venue": "Journal of Economic Geography", "date": "2026-10-21", "sjr": 1.949, "citescore": 7.1, "citescore_year": "2025", "apa": "Chapelle, G., Gobillon, L., & Vignolles, B. (2026). Building without income mixing: public housing quotas in France. Journal of Economic Geography. https://doi.org/10.1093/jeg/lbag072", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は入手できず", "preprint": false, "p1": "フランスで市町村に公営住宅20%を義務づけたSRU法は、公営住宅の建設を増やしたが、低所得世帯の居住や所得による住み分けの改善にはほとんどつながらなかったことを示した。", "p2": "公営住宅を都市に分散させて社会的な混住を進める法律が、実際に誰の居住を増やし、住み分けを変えたかは、網羅的なデータで評価されていなかった（抄録）。", "p3": "網羅的な税務データで、1996〜2008年の市町村と近隣のレベルで差の差分析を行った（抄録）。", "p4": "対象の市町村での公営住宅の建設、低所得世帯の存在、市町村内の公営住宅の住み分けと低所得の住み分けを比べた（抄録）。", "p5": "法律は対象の市町村で公営住宅の建設を促したが、低所得世帯の存在はわずかしか増えなかった。新しい公営住宅は中所得層も入れる区分で、追加の入居者の多くは貧しくなかった。市町村内では公営住宅の住み分けは減ったが、低所得の住み分けはほとんど減らなかった（抄録）。", "p6": "抄録からは、効果の大きさと、平行トレンドの確認の結果は分からない。解釈：2008年までの評価なので、その後の長期的な効果は別に検討が必要だ。", "fun": "「どの町にも公営住宅を2割」という決まりで建物は増えたが、入ったのは主に中所得の人で、本当に困っている人の混住はあまり進まなかった。しかも建てる場所は、もともと低所得の人が多い地区に寄っていた。数を義務づけるだけでは目的が達成されない例だ。", "unverified": "効果の大きさは抄録からは確認できなかった。"}}, {"id": "jr08", "rank": 8, "headline": "橋梁SHMのセンサ最適配置の体系的レビュー", "title": "Optimal Sensor Placement for Bridge Structural Health Monitoring: A Systematic Review with Bibliometric Analysis and Methodological Quality Assessment", "url": "https://doi.org/10.3390/s26206661", "authors": "Gastón Luis Rodríguez Wlack ほか", "venue": "Sensors", "date": "2026-10-22", "citescore": 9.4, "citescore_year": "2025", "apa": "Rodríguez Wlack, G. L., Fuentes, N., Peña Fritz, Á., Crawford, B., & Soto, R. (2026). Optimal Sensor Placement for Bridge Structural Health Monitoring: A Systematic Review with Bibliometric Analysis and Methodological Quality Assessment. Sensors, 26(20), 6661. https://doi.org/10.3390/s26206661", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は入手できず", "preprint": false, "p1": "橋梁の構造ヘルスモニタリングのセンサー最適配置（OSP）の研究49件を、PRISMA 2020に沿って体系的にレビューし、現地での検証と不確実性への頑健性が弱点であることを示した。", "p2": "OSPは橋梁SHMの設計の要で、土木の制約と計算による最適化を組み合わせる必要があるが、研究の傾向と方法の質は整理されていなかった（抄録）。", "p3": "49件について、書誌計量分析、最適化戦略・センサーの種類・研究の動機の統合、独自の品質評価の採点表による方法の質の評価を行った（抄録）。", "p4": "結果は橋の動的パラメータではなく、出版の傾向、符号化したカテゴリ、方法の質の点数を記述するものと位置づけた（抄録）。", "p5": "加速度計が最も多く使われ、データの質の改善が最も多い動機（49件中45件）で、費用削減・通信効率・エネルギー効率はそれぞれ11件だった。実橋での実験・現地検証を含むのは15件だけで、不確実性への頑健性が最も弱い品質の次元だった（抄録）。", "p6": "著者が提案する成熟度の類型（SPO-ML）と統一的な意思決定の枠組みは、文献に基づく予備的な指針と位置づけられている（抄録）。解釈：49件という数で、最適化手法間の性能の定量比較までは行えない。", "fun": "橋のどこにセンサーを付けるかを数学で最適化する研究はたくさんあるが、実際の橋で確かめたものは3分の1もない。計算の上ではうまくいっても、現実のばらつきに強いかは分からない、という「シミュレーションと現実のすき間」を、数で示している。", "unverified": "品質評価の採点表の項目と各研究の点数は抄録からは確認できなかった。"}}, {"id": "jr09", "rank": 9, "headline": "粒径と形状の相関を保つ砂粒子の生成", "title": "Generation of Realistic Sand Particles Preserving Marginal Distributions and Intrinsic Correlations of Size and Multilevel Morphology", "url": "https://doi.org/10.1139/cgj-2026-0643", "authors": "Meng Fan ほか", "venue": "Canadian Geotechnical Journal", "date": "2026-10-21", "sjr": 1.282, "citescore": 5.8, "citescore_year": "2025", "apa": "Fan, M., Su, D., Zhang, N., Cai, G., & Chen, X. (2026). Generation of Realistic Sand Particles Preserving Marginal Distributions and Intrinsic Correlations of Size and Multilevel Morphology. Canadian Geotechnical Journal. https://doi.org/10.1139/cgj-2026-0643", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は入手できず", "preprint": false, "p1": "砂粒子の大きさと多段階の形状（細長さ・扁平さ・角ばり・粗さ）の分布と相関を同時に保つ仮想粒子の生成法を作り、個別要素法（DEM）で相関が力学挙動に与える影響を切り分けられるようにした。", "p2": "粒子の大きさ・形・角ばり・粗さは、詰まり方・接触・変形に一緒に効くが、既存の粒子生成法は形や一部の分布は再現できても、大きさと形状の内在的な相関を保てなかった（抄録）。", "p3": "粒子の体積、細長さ（EI）、扁平さ（FI）、角ばり（AI）、粗さ（RG）の経験的な周辺分布を、Spearmanの順位相関で補正したガウス・コピュラで結合して整合的な記述子のベクトルを抽出し、球面調和関数の逆最適化で三角形メッシュの粒子に変換した（抄録）。", "p4": "生成した粒子群が目標の周辺分布と順位相関を再現するかを調べ、排水三軸のDEMシミュレーションで元の粒子と比べ、相関を除いた独立コピュラの対照とも比べた（抄録）。", "p5": "生成した粒子群は目標の周辺分布と主な順位相関の構造を再現し、相関を保った複製粒子は元の粒子の巨視的・微視的な応答を再現した。相関を除いても大ひずみの強度と体積変化への影響は限られたが、限界状態の前の接触の振る舞いは変わった（抄録）。", "p6": "結論は、調べた単調な排水三軸の条件に限られる（抄録）。解釈：繰り返し載荷や非排水の条件で相関の影響がどうなるかは、別に確かめる必要がある。", "fun": "砂の粒は、大きいものほど丸い、小さいものほど角ばっている、といった「性質どうしのつながり」を持つ。それを無視して形を作ると、最終的な強さは同じでも、途中の粒どうしの接し方が変わる。コンピュータで砂を作るときにも、こうした隠れたつながりが大事になる。", "unverified": "元の砂の種類と粒子の数は抄録からは確認できなかった。"}}, {"id": "jr10", "rank": 10, "headline": "財務困窮予測はモデルよりしきい値の選び方が効く", "title": "Model Selection and Threshold Selection in Financial Distress Prediction: An Empirical Analysis Based on Listed Manufacturing Companies in China", "url": "https://doi.org/10.26689/pbes.v9i9.15611", "authors": "Siqi Duan", "venue": "Proceedings of Business and Economic Studies", "date": "2026-10-22", "apa": "Duan, S. (2026). Model Selection and Threshold Selection in Financial Distress Prediction: An Empirical Analysis Based on Listed Manufacturing Companies in China. Proceedings of Business and Economic Studies, 9(9), 123–130. https://doi.org/10.26689/pbes.v9i9.15611", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "本文", "basis_note": "出版社のPDF本文（研究デザイン、しきい値の設定、主な結果、結論）を読んだ", "preprint": false, "p1": "中国の製造業の上場企業で、財務困窮の早期警告の成否を決めるのは、機械学習モデルの選び方よりも判定のしきい値の設定であることを示し、基準率の変化に合わせて動かすしきい値（PAT）を提案した。", "p2": "財務困窮予測の研究は、特徴量の選択やパラメータ、再標本化などモデルの設計に力を注いできたが、実際の分布の下でのしきい値の最適化と、モデル選択との定量的な比較はほとんどなかった（§1）。", "p3": "2期連続の純損失（ST制度の基本的な基準）を困窮と定義し、先読みの偏りを避けるためT−2期の16の財務指標（Ohlsonの9変数＋8項目）でT期を予測した（§2）。見逃しと誤警報の費用を10対1とし、困窮の基準率が学習時からずれる倍率で事前確率を補正した閉じた形のしきい値PATを導いた（§2〜3）。", "p4": "3,837社・37,983観測（困窮476件）を時期で学習と試験に分け、Logit・PCA-Logit・LASSO-Logit・木のモデル・XGBoostの5手法をAUC-ROC、AUC-PR、適合率、再現率、費用で比べた（§2、§4）。", "p5": "5手法のAUC-ROCは0.8401〜0.8772で、最良のXGBoostでもLogitより0.037の改善にとどまった（§4.1）。0.5の固定しきい値では警告はほとんど機能しなかった（抄録）。費用の分散のうち98.34%がしきい値で、モデル選択は0.06%だった。最適しきい値の下でも木のモデルは線形モデルより費用を13.6〜21.6%節約した（§5）。試験期間のPATは0.0601から0.0192へ下がり、平均0.0381は数値最適化した0.0380とほぼ一致した（§3）。", "p6": "著者は、製造業だけの標本であること、上場廃止企業を含めていないので市場の総リスクを過小評価しうることを限界に挙げている（§5）。解釈：費用比10対1という前提がしきい値と結論に効くので、異なる費用比での感度の確認が必要だ。", "fun": "倒産しそうな会社を見つけるAIは、どれだけ賢いモデルを使うかより、「何%以上の危険なら警告するか」の線の引き方で成績が大きく変わる。倒産はまれなので、普通の50%の線では誰にも警告が出ない。賢さより使い方が大事、という教訓だ。", "unverified": "表1の各モデルの平均しきい値と費用の数値の一部は抽出が乱れていて確認できなかった。"}}, {"id": "jr11", "rank": 11, "headline": "通関サービスの品質と顧客満足・忠誠", "title": "The impact of perceived service quality in customs services on customer satisfaction and customer loyalty: an analysis with structural equation modeling", "url": "https://doi.org/10.1108/jeim-04-2026-0701", "authors": "Ozgur Ozsoy ほか", "venue": "Journal of Enterprise Information Management", "date": "2026-10-22", "sjr": 1.665, "citescore": 19.6, "citescore_year": "2025", "apa": "Ozsoy, O., Bal, T., Oner, G., Celik, E., Gul, M., & Oral, V. (2026). The impact of perceived service quality in customs services on customer satisfaction and customer loyalty: an analysis with structural equation modeling. Journal of Enterprise Information Management, 1–31. https://doi.org/10.1108/jeim-04-2026-0701", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は入手できず", "preprint": false, "p1": "トルコの貿易会社が通関業者から受けるサービスについて、知覚されたサービス品質が顧客満足を通じて顧客ロイヤルティを高めることを構造方程式モデリングで示し、品質の次元構造を業界に合わせて見直した。", "p2": "サービス品質と満足・ロイヤルティの研究は多いが、規制が強く情報システムを介する通関仲介の業界はほとんど調べられていなかった（抄録）。", "p3": "トルコの貿易会社で働く404人の調査で、SERVQUALモデルでサービス品質を測り、構造方程式モデリング（SEM）で満足とロイヤルティとの関係を調べた（抄録）。", "p4": "品質→満足→ロイヤルティの媒介経路の有意性と、尺度の因子構造を評価した（抄録）。", "p5": "知覚されたサービス品質は顧客満足と顧客ロイヤルティに正に関連し、満足が有意な媒介経路だった。品質は信頼性・相互作用の質・有形性の3要素で表された（抄録）。", "p6": "著者は、SERVQUALの適応の過程で因子構造の中で十分に分かれない項目を削除したため、次元構造についての結論には限界があり、通関仲介の場面でのさらなる検証が必要だと認めている（抄録）。解釈：横断の自己申告データなので、共通方法バイアスと因果の向きに注意が要る。", "fun": "書類手続きが中心の通関の仕事でも、「約束どおりにやってくれる」「話が通じる」ことが客の満足と再利用を左右する。おなじみの5次元の品質の物差しが、この業界では3つにまとまった、という点は、業界ごとに物差しを作り直す必要を示している。", "unverified": "経路係数の大きさと、削除した項目の数は抄録からは確認できなかった。"}}, {"id": "jr12", "rank": 12, "headline": "緊急対応での生成AI導入の障壁と促進要因", "title": "Human-AI collaboration in crisis response: understanding adoption barriers and enablers for generative AI in emergency decision-making", "url": "https://doi.org/10.1057/s41599-026-09366-3", "authors": "Liguo Fei ほか", "venue": "Humanities and Social Sciences Communications", "date": "2026-10-22", "sjr": 0.904, "citescore": 5.7, "citescore_year": "2025", "apa": "Fei, L., Sun, J., & Sun, Z. (2026). Human-AI collaboration in crisis response: understanding adoption barriers and enablers for generative AI in emergency decision-making. Humanities and Social Sciences Communications. https://doi.org/10.1057/s41599-026-09366-3", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は入手できず", "preprint": false, "p1": "中国の緊急管理の実務者が生成AIを意思決定に取り入れるときの障壁と促進要因を、専門家インタビューと直観的ファジィDEMATEL（要因間の因果関係を専門家の評価から構造化する手法）で整理した。", "p2": "緊急管理での人とAIの協働は、技術の能力と人間の要因の両方の理解を必要とする社会技術的な課題だが、高リスクの場面での生成AIの採用要因は十分に分かっていなかった（抄録）。", "p3": "中国の緊急管理の実務者への専門家インタビューで要因を挙げ、直観的ファジィDEMATELで要因間の影響関係を分析した（抄録）。", "p4": "技術受容、意思決定過程、状況要因、リスクと信頼、個人要因の5つの次元について、どれが原因側（駆動要因）でどれが結果側かを評価した（抄録）。", "p5": "状況要因と意思決定過程が主な駆動要因と認識され、技術受容と個人要因は組織環境に形づくられる重要な促進要因だった。組織の支援、信頼の構築、個人の自己効力感が基本的な要件として浮かび上がった（抄録）。", "p6": "抄録からは、専門家の人数と選び方は分からない。解釈：専門家の認識に基づく構造化であり、実際の採用行動や成果との関係は検証されていない。", "fun": "災害の現場でAIを使うかどうかは、AIの性能だけでは決まらない。その場の状況や決め方の手順、組織が後押ししてくれるか、自分が使いこなせる自信があるかが重なって決まる。技術と人と組織を一緒に整えないと、良い道具も使われない。", "unverified": "専門家の人数と各要因の影響の強さの数値は抄録からは確認できなかった。"}}, {"id": "jr13", "rank": 13, "headline": "健康な人ほど介護を担う：英国の加齢軌跡", "title": "Age trajectories of informal caregiving for older people in England: Testing the healthy caregiver hypothesis", "url": "https://doi.org/10.1093/geront/gnag249", "authors": "Bo Hu", "venue": "Gerontologist", "date": "2026-10-21", "sjr": 1.552, "citescore": 7.0, "citescore_year": "2025", "apa": "Hu, B. (2026). Age trajectories of informal caregiving for older people in England: Testing the healthy caregiver hypothesis. The Gerontologist. https://doi.org/10.1093/geront/gnag249", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は入手できず", "preprint": false, "p1": "英国の50歳以上の縦断データで、健康な人ほど年齢とともに配偶者や親の介護を担うようになるという「健康な介護者仮説」を支持する結果を示した。", "p2": "健康状態が、配偶者や高齢の親への非公式な介護の加齢による軌跡をどう形づくるかは十分に分かっていなかった（抄録）。", "p3": "英国高齢化縦断調査（ELSA）の5波（2012〜2023年）、50歳以上の12,420人・41,997人年の観測で、機能・精神・身体・認知の領域を統合した潜在的な健康の構成概念を階層的確認的因子分析で作り、初期条件を補正した動的ランダム効果モデルで、前の時点の健康がその後の介護に与える影響を推定した（抄録）。", "p4": "配偶者・親・義理の親がいる人について、年齢ごとの介護の確率と健康の関係を、配偶者の介護と親の介護で分けて調べた（抄録）。", "p5": "健康な人ほど年齢とともに介護の確率が急に上がり、健康の悪い人は横ばいか低下した。配偶者の介護では、50歳では健康が良いほど介護が少なかったが、70歳以降は正の関係に変わった。親の介護では、53歳以降、健康が良いほど介護が多かった（抄録）。", "p6": "抄録からは、介護の時間や強度は扱われているか分からない。解釈：介護を担うこと自体が健康に影響するという逆の因果は、前の時点の健康を使うことで一部対処しているが、完全には除けない。", "fun": "高齢化というと「介護が必要な人が増える」面ばかりが注目されるが、元気な高齢者が増えれば「介護できる人」も増える。介護の担い手の多くは高齢の配偶者や子で、その人たちの健康が介護の力そのものになっている、という見方は大切だ。", "unverified": "係数の大きさは抄録からは確認できなかった。"}}, {"id": "jr14", "rank": 14, "headline": "温度と相関を考慮した架設中アーチ橋の信頼性", "title": "Reliability Analysis of Uncertain Correlation During the Construction Period of a Cantilevered Arch Considering Temperature Effects", "url": "https://doi.org/10.3390/buildings16204172", "authors": "Zujun Zhang ほか", "venue": "Buildings", "date": "2026-10-22", "sjr": 0.686, "citescore": 5.6, "citescore_year": "2025", "apa": "Zhang, Z., Tian, Z., Peng, W., Zeng, G., & Zhang, J. (2026). Reliability Analysis of Uncertain Correlation During the Construction Period of a Cantilevered Arch Considering Temperature Effects. Buildings, 16(20), 4172. https://doi.org/10.3390/buildings16204172", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は入手できず", "preprint": false, "p1": "張出し架設の鉄筋コンクリートアーチ橋の施工中の信頼性を、温度の影響と変数間の相関を考慮し、監視データで逐次更新できる枠組み（ガウス・コピュラ＋ベイズ動的モデル）で評価した。", "p2": "従来の信頼性評価は変数の独立を仮定し、現場の監視データで信頼性の推定を動的に更新できなかった（抄録）。", "p3": "ケーブル張力・材料特性・気温などの非線形な依存をガウス・コピュラで表し、AR(1)に基づくベイズ動的モデル（BDM）で状態を逐次予測して信頼性を実時間で更新する。大規模な有限要素モデルの代わりに、6手法と比べて選んだXGBoostの代理モデル（R²=0.97、RMSE=0.76 MPa）と改良NSGA-IIで部材と系の信頼性指標を計算した（抄録）。", "p4": "代理モデルを使う10⁶回のモンテカルロ、FORMと独立仮定の方法との比較、解析的な基準で検証し、支間240 mの沙沱大橋に適用した（抄録）。", "p5": "モンテカルロとの相対誤差は3.2%未満、解析基準との誤差は1.2%だった。温度の影響でアーチリブの応力の信頼性指標は理想条件のβ=4.25から実際の施工条件のβ=3.98へ約6.3%下がった。破壊モードの相関を考えた系の信頼性指標はβ=3.921で、独立を仮定したβ=4.11より低いが、中国の基準の目標3.5は上回った。Sobol指数では弾性係数の寄与が38%で最大だった（抄録）。", "p6": "著者は、代理モデルの誤差（1.1%）、モデル形式の不確実性（4.2%）、パラメータ推定の不確実性（1.5%）を見込んで、信頼性指標の幅をβ=3.81〜3.97と示した（抄録）。解釈：1つの橋への適用なので、他の形式の橋への一般化は確かめられていない。", "fun": "橋を作っている途中は、完成後より不安定で、日差しによる温度の変化でも力のかかり方が変わる。材料の強さや温度などのばらつきは互いに関連しているので、別々に考えると安全側に見誤る。測りながら「今どれくらい安全か」を更新し続ける仕組みが面白い。", "unverified": "監視データの種類と更新の頻度は抄録からは確認できなかった。"}}, {"id": "jr15", "rank": 15, "headline": "デザイン思考で回す多エージェントのペルソナ生成", "title": "Design Thinking–Driven Multi-Agent Method for Persona Generation", "url": "https://doi.org/10.1177/10711813261498765", "authors": "Qing Ao ほか", "venue": "Proceedings of the Human Factors and Ergonomics Society Annual Meeting", "date": "2026-10-22", "citescore": 1.1, "citescore_year": "2025", "apa": "Ao, Q., Yu, S., Chu, J., & Fang, C. (2026). Design Thinking–Driven Multi-Agent Method for Persona Generation. Proceedings of the Human Factors and Ergonomics Society Annual Meeting. https://doi.org/10.1177/10711813261498765", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用。本文は入手できず", "preprint": false, "p1": "デザイン思考の5段階（共感・定義・発想・試作・検証）を閉じたループにした多エージェントの方法で、調査資料から根拠をたどれるペルソナを作る手順と試作システムを示した。", "p2": "ユーザー中心設計で使うペルソナは、作るのに手間がかかり、更新しにくく、根拠のたどりやすさが弱い（抄録）。", "p3": "生の調査資料を、構造化された根拠、要求の仮説、ペルソナの草案、視覚的な概念のプロンプト、検証のフィードバックへと段階的に変換し、段階をまたいで繰り返し改善する。各段階の成果物を保存して、追跡可能性・解釈可能性・版管理を高めた（抄録）。", "p4": "試作システムで方法を実装し、初期の適用と評価を行った（抄録）。", "p5": "初期の結果は、場面に根ざしたペルソナの生成と、協働的なデザインでの初期の概念づくりを支援できることを示唆した（抄録）。", "p6": "著者は、より広いデザインの文脈での検証と、下流の仕様作成への支援の強化を今後の課題としている（抄録）。解釈：評価の方法と規模が抄録からは分からず、生成したペルソナの妥当性（実際の利用者をどれだけ代表するか）の検証は限られている可能性がある。", "fun": "「30代の共働きで、朝は忙しい」といった架空の利用者像（ペルソナ）を、AIのチームが調査メモから作り、どのメモに基づくかをたどれるようにした。人が作ると根拠があいまいになりがちな人物像を、作る過程ごと記録に残すのが工夫だ。", "unverified": "評価の方法、参加者の数、使用したLLMは抄録からは確認できなかった。"}}, {"id": "jr16", "rank": 16, "headline": "橋梁資産管理のための信頼できるAI意思決定支援", "title": "Toward a Trustworthy AI-Based Decision Support for Bridge Asset Management", "url": "https://doi.org/10.1061/jbenf2.beeng-8087", "authors": "Alireza Ghavidel ほか", "venue": "Journal of Bridge Engineering", "date": "2026-10-22", "citescore": 7.2, "citescore_year": "2025", "apa": "Ghavidel, A., Kameshwar, S., & Du, A. (2027). Toward a Trustworthy AI-Based Decision Support for Bridge Asset Management. Journal of Bridge Engineering, 32(1). https://doi.org/10.1061/jbenf2.beeng-8087", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "橋梁の資産管理で、劣化の予測・ライフサイクル費用・個々の橋の最適な維持の順序を結ぶAIの意思決定支援の方法を示した。", "p3": "マルコフ状態遷移による状態の模擬、直接・間接費用を長期で集計するライフサイクル費用分析、個々の橋の逐次的な維持行動を決めるAIの3つのモジュールからなる。実務上の行動制約と判断理由の提示、AIの判断の上書きの影響も調べた（抄録）。", "p5": "従来の事後的・状態基準の方針と比べ、AIの方針はより先手を打つ適応的な判断を示し、ライフサイクル費用の最小化で優れていた（抄録）。", "fun": "壊れてから直すのではなく、劣化の進み方を確率で予測して「いつ手を入れると一番安く済むか」を橋ごとに決める。AIに任せきりにせず、人が判断を上書きしたときの影響まで調べているのが、実際の管理者の信頼を得る工夫だ。", "unverified": "費用の削減の具体的な数値は抄録からは確認できなかった。"}}, {"id": "jr17", "rank": 17, "headline": "防風柵が車両の安定と橋の空力に与える影響", "title": "Influence of Wind Barriers on Vehicle Stability and Bridge Aerodynamic Performance", "url": "https://doi.org/10.1088/1755-1315/1674/1/012041", "authors": "Hoang Trong Lam ほか", "venue": "IOP Conference Series: Earth and Environmental Science", "date": "2026-10-22", "citescore": 1.4, "citescore_year": "2025", "apa": "Lam, H. T., Vilaivong, A., & Quang, N. D. (2026). Influence of Wind Barriers on Vehicle Stability and Bridge Aerodynamic Performance. IOP Conference Series: Earth and Environmental Science, 1674(1), 12041. https://doi.org/10.1088/1755-1315/1674/1/012041", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "長大橋の防風柵が、車両の高さの風速を下げる一方で、橋桁の空力的な安定性を損なう場合があることを風洞実験で示した。", "p3": "幅高さ比3.44と4.98の2種類の箱桁の1/100部分模型で、空隙率25%・50%の水平柵、部分設置、柵の間隔の変更、フラップ付きの対策を比べ、空気力の測定、ばね支持の自由振動試験、熱線風速計の測定を行った（抄録）。", "p5": "防風柵は車両の高さの最大風速を、厚い桁で最大約4分の1、薄い桁で約3.2分の1に下げたが、抗力を増やし、いくつかの条件で鉛直の渦励振を大きくした（抄録）。", "fun": "強風から車を守るための柵が、橋そのものを揺らしやすくすることがある。車と橋という2つの「お客さん」の都合がぶつかる例で、片方だけを見た対策が別の問題を生むことを実験で確かめている。", "unverified": "渦励振の振幅の増加の具体的な値は抄録からは確認できなかった。"}}, {"id": "jr18", "rank": 18, "headline": "2次元モード曲率でプレストレス床版の損傷位置推定", "title": "Damage localization in pretensioned prestressed concrete slabs based on two-dimensional modal curvature", "url": "https://doi.org/10.1088/1755-1315/1674/1/012056", "authors": "Lam N Pham ほか", "venue": "IOP Conference Series: Earth and Environmental Science", "date": "2026-10-22", "citescore": 1.4, "citescore_year": "2025", "apa": "Pham, L. N., Nguyen, D. H., Dang, H. V., & Nguyen, H. T. (2026). Damage localization in pretensioned prestressed concrete slabs based on two-dimensional modal curvature. IOP Conference Series: Earth and Environmental Science, 1674(1), 12056. https://doi.org/10.1088/1755-1315/1674/1/012056", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "プレテンション方式のプレストレストコンクリート床版で、2次元のモード曲率から損傷の位置を特定する方法を示した。", "p3": "床版の有限要素モデルを作り、実験と比べて妥当性を確かめたうえで、局所的な開口で2つの損傷シナリオを作り、固有振動数、MAC（モード形の一致度）、モード曲率に基づく損傷指標を比べた（抄録）。", "p5": "数値と実験の差は1次から3次の曲げ固有振動数で4.1%未満、MACは0.836を超えた。損傷は固有振動数やMACの変化では検出できなかったが、損傷指標では位置を明確に特定でき、低次のモード形で十分だった（抄録）。", "fun": "板に穴が開いても、揺れる速さ（固有振動数）はほとんど変わらず、損傷に気づけない。ところが、揺れの形の「曲がり具合」を見ると、どこに傷があるかがはっきり分かる。測りやすい低次の揺れで足りる、というのも実用的だ。", "unverified": "なし"}}, {"id": "jr19", "rank": 19, "headline": "変換器由来の汚染下での出力のみモード同定", "title": "Physical Energy Relevance for Output-Only Modal Identification Under Converter-Induced Spectral Contamination in Power Systems", "url": "https://doi.org/10.3390/electricity7040126", "authors": "Ángel González-Domínguez ほか", "venue": "Electricity", "date": "2026-10-22", "citescore": 4.4, "citescore_year": "2025", "apa": "González-Domínguez, Á., García, H., Arjona, M. A., & Hernandez, C. (2026). Physical Energy Relevance for Output-Only Modal Identification Under Converter-Induced Spectral Contamination in Power Systems. Electricity, 7(4), 126. https://doi.org/10.3390/electricity7040126", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "電力系統で、太陽光発電の変換器による周波数成分の汚染が、出力のみのモード同定を誤らせる問題を調べ、物理的な重要度を測る指標を提案した。", "p3": "Kundurの2地域の標準系統で同期発電機1台を太陽光発電所に置き換え、Prony解析とTLS-ESPRITの2つの出力のみ同定法を比べ、同定したモードが物理的なエネルギーをどれだけ担うかを測る指標（PER）を提案した（抄録）。", "p5": "変換器の制御がモードのエネルギーを再配分し、従来の同定法の物理的な解釈可能性を下げることを示した（抄録の範囲）。", "fun": "揺れの記録だけから固有の揺れ方（モード）を取り出す方法は、橋でも電力網でも使われる。制御装置が出す「にせの揺れ」が混ざると、どれが本物のモードか分からなくなる。そこで、エネルギーを本当に運んでいるかで見分けようとしている。", "unverified": "PERの数値結果は抄録が途中で切れていたため確認できなかった。"}}, {"id": "jr20", "rank": 20, "headline": "画像とジャイロの融合で路面状態を監視", "title": "Multimodal Fusion of Visual and Gyroscopic Data for Road Surface Monitoring Using ResNet50-Based Transfer Learning", "url": "https://doi.org/10.3390/app162010409", "authors": "Woohoon Jeon ほか", "venue": "Applied Sciences", "date": "2026-10-21", "citescore": 6.1, "citescore_year": "2025", "apa": "Jeon, W., & Kim, S. (2026). Multimodal Fusion of Visual and Gyroscopic Data for Road Surface Monitoring Using ResNet50-Based Transfer Learning. Applied Sciences, 16(20), 10409. https://doi.org/10.3390/app162010409", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "車載の動画とジャイロの衝撃データを組み合わせて、路面の悪い区間を自動で検出するシステムを示した。", "p3": "学習済みResNet50の大域平均プーリング層から取り出した画像の特徴と、同期したジャイロの時系列を後段で融合する構成で、データの不均衡を補正して学習した（抄録）。", "p5": "基準モデルの再現率0.75・F1 0.55が、補正後に再現率0.98・F1 0.65に上がった。地理的に独立した高速道路の区間で44の悪い区間を検出し、実際の悪い区間の時間の94%を含んだが、予測の総時間は741秒で、正解の564秒より長かった（抄録）。", "fun": "高価なレーザー計測車の代わりに、カメラとスマホにも入っているジャイロで道路の傷みを見つける。少し多めに「悪い」と判定する癖があるが、見逃しが少ないので点検の候補を絞るには十分役に立つ、という割り切りが現実的だ。", "unverified": "なし"}}, {"id": "jr21", "rank": 21, "headline": "液状化した海底上の界面波と土砂の巻き上げ", "title": "Characteristics of Interfacial Waves Over a Liquefied Seabed and Their Effects on Sediment Suspension", "url": "https://doi.org/10.1029/2026jc024954", "authors": "Heyu Yu ほか", "venue": "Journal of Geophysical Research: Oceans", "date": "2026-10-22", "sjr": 1.376, "citescore": 5.5, "citescore_year": "2025", "apa": "Yu, H., Zhang, H., Lu, Y., Meng, X., Babanin, A., Li, R., Cartigny, M., & Liu, X. (2026). Characteristics of Interfacial Waves Over a Liquefied Seabed and Their Effects on Sediment Suspension. Journal of Geophysical Research: Oceans, 131(10). https://doi.org/10.1029/2026jc024954", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "出版社が登録した抄録を使用", "preprint": false, "short": true, "p1": "波で液状化した海底の泥の表面に生じる界面波が、土砂の巻き上げを大きく変えることを水路実験で示した。", "p3": "シルト質の床で、2つの規則波の条件の下、液状化していない状態と液状化した状態の底面付近の流れと浮遊土砂濃度を比べた（抄録）。", "p5": "液状化後は泥の表面に二乗平均振幅約1.4 cmの界面波が持続し、その開始前後で底面付近の濃度は4〜5周期で約1.3から2.6 g/Lに増え、周期内の濃度の山が2つから1つに変わった。泥の表面が急に下がるとき、上向きの乱流輸送が最も強く、正の輸送の約93%を占めた（抄録）。", "fun": "波で海底の泥が液体のようになると、泥の表面そのものが波打ち始め、それが砂ぼこりのように泥を巻き上げる。流れのせん断で巻き上がる通常の仕組みとは別の仕組みが働く、という発見が面白い。", "unverified": "なし"}}, {"id": "jr22", "rank": 22, "headline": "大規模な振動音響連成問題の縮約モデルの拡張性", "title": "Numerical Scalability of Model Order Reduction Techniques for Very Large, Strongly Coupled Vibroacoustic Problems", "url": "https://doi.org/10.1007/s40857-026-00410-5", "authors": "Linus Taenzer ほか", "venue": "Acoustics Australia", "date": "2026-10-22", "citescore": 3.8, "citescore_year": "2025", "apa": "Taenzer, L., van Rijn, S. M., Tiso, P., & Van Damme, B. (2026). Numerical Scalability of Model Order Reduction Techniques for Very Large, Strongly Coupled Vibroacoustic Problems. Acoustics Australia. https://doi.org/10.1007/s40857-026-00410-5", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Crossrefに登録された抄録を使用", "preprint": false, "short": true, "p1": "水を満たした円筒のような強く連成した振動音響問題で、モデル縮約の手法の効率・精度・規模の拡大を比べ、ベンチマークを公開した。", "p3": "水を満たしたアクリル円筒の、1万〜100万自由度まで規模を変えられるモデルを作り、実験と比べて妥当性を確かめ、モード縮約とクリロフ部分空間による縮約を比べた（抄録）。", "p5": "約10万自由度までの中規模モデルではモード法とクリロフ法の両方が実行可能だった。形状・モデル・実験データを公開した（抄録）。", "fun": "大きな計算を小さな計算に置き換える「縮約」は、空気と違って重い水が構造と強く影響し合うと難しくなる。どの方法がどの規模まで使えるかを、実験とともに確かめ、誰でも比べられる問題として公開している点が貴重だ。", "unverified": "100万自由度での比較結果は抄録が途中で切れていたため確認できなかった。"}}, {"id": "jr23", "rank": 23, "headline": "移動を考慮した洪水曝露と回避手段の格差", "title": "From Equality to Equity: The Dual Socioeconomic Inequalities of Mo
