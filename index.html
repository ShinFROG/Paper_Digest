<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の論文">

<title>Paper Digest｜今日の論文</title>
<style>
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6470;
  --line: #dde1e5;
  --accent: #0f6e6e;
  --accent-ink: #ffffff;
  --accent-soft: #dcefed;
  --star: #b7791f;
  --warn: #8a5a00; --warn-soft: #fbf1dc; --warn-line: #e5c98f;
  --t1: #dcebf7; --t2: #e3f1e1; --t3: #f6e8dc; --t4: #efe3f3; --t5: #e2eef0; --t6: #f3efd9; --t7: #ece7e3; --t8: #e0e6f4;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f1216;
    --surface: #171b21;
    --ink: #eceff3;
    --muted: #9aa3ae;
    --line: #2a313a;
    --accent: #4fc3b8;
    --accent-ink: #0f1216;
    --accent-soft: #1b3533;
    --star: #f0b54a;
    --warn: #f0b54a; --warn-soft: #3a2e14; --warn-line: #6b5420;
    --t1: #1e2c3a; --t2: #1f3121; --t3: #3a2a1d; --t4: #30223a; --t5: #1d3134; --t6: #353018; --t7: #2e2925; --t8: #232a3c;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.app {
  max-width: 720px;
  margin: 0 auto;
  min-height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
}
/* header */
.top { display: grid; gap: 10px; padding-bottom: 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.datesel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 15px; max-width: 58vw;
}
.tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 7px; font-size: 13px; font-weight: 600;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab.subtab { padding: 6px 14px; font-size: 13px; }
.tab.subtab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
/* card */
.stage { display: flex; flex-direction: column; min-height: 0; }
.card {
  flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--t1); }
.headline { margin: 0; font-size: 26px; line-height: 1.35; font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; }
.label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: 0.04em; }
.summary, .reason { margin: 0; font-size: 18px; line-height: 1.7; }
.reason { font-size: 17px; }
.basis { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge, .pill {
  font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-line);
}
.pill { color: var(--muted); background: var(--bg); border-color: var(--line); }
.ex { display: grid; gap: 2px; }
.ex h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
.ex p { margin: 0; font-size: 17px; line-height: 1.75; }
.ex.first p { font-size: 18px; font-weight: 600; }
.ex.fun { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.unverified { margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.orig { margin: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 16px; line-height: 1.7; }
/* list */
.list { flex: 1; overflow-y: auto; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
.list > .label { margin-top: 6px; }
.row {
  display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.row .n { font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.row .h { font-weight: 700; font-size: 16px; line-height: 1.45; }
.row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
/* controls */
.controls {
  position: sticky; bottom: 0; background: var(--bg);
  padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: grid; grid-template-columns: 1fr auto auto auto 1fr; gap: 8px; align-items: center;
}
.btn {
  min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
  font-size: 17px; font-weight: 700; padding: 0 14px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 56px; padding: 0; font-size: 22px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.btn:disabled { opacity: 0.35; }
.intro { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.askrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ask {
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px;
  min-height: 52px; padding: 8px 6px; font-size: 14px; font-weight: 700; line-height: 1.35;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ask.sharemenu { align-self: flex-start; min-height: 0; padding: 10px 14px; }
.askstatus { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.askstatus:empty { display: none; }
.copybox {
  width: 100%; margin: 8px 0 0; padding: 10px; font: inherit; font-size: 13px; line-height: 1.6;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
@media (min-width: 700px) { .headline { font-size: 30px; } }
</style>
</head>

<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand">Paper Digest<small id="daylabel"></small></div>
      <select id="datesel" class="datesel" aria-label="日付を選ぶ"></select>

    <div class="tabs" id="subtabs" role="group" aria-label="関連と注目の切り替え" hidden></div>
  </header>

    <button class="btn" id="prev" type="button" aria-label="前の論文">← 前</button>

    <button class="btn icon star" id="mark" type="button" aria-label="あとで読むに追加">☆</button>

    <button class="btn primary" id="next" type="button" aria-label="次の論文">次 →</button>
  </footer>
</div>

el", "url": "https://doi.org/10.2139/ssrn.7564884", "authors": "Jiayi Wang", "venue": "SSRN", "date": "2026-10-05", "apa": "Wang, J. (2026). Design and Analysis of an Intelligent Audit Risk Assessment System Based on Retrieval-Augmented Large Language Model. https://doi.org/10.2139/ssrn.7564884", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "検索拡張生成（RAG）を使う大規模言語モデルとベイズ・ロジスティックの推定を組み合わせ、監査リスクを文脈込みで評価する枠組みを提案した（抄録）。", "p3": "財務・ガバナンス・業務・テキストの情報を、監査基準・規制事例・過去の会計不正の知識と統合する。評価には14業種・2018〜2024年の612企業年からなる、経済的に較正した合成データを使った（抄録）。", "p5": "標本外のAUCは0.912で、勾配ブースティング（0.754）、ランダムフォレスト（0.723）、ロジスティック回帰（0.694）を上回り、Brierスコアは0.088だった（抄録）。解釈：実データでなく合成データでの評価である点に注意が要る。", "fun": "監査人は数字だけでなく、規則や過去の不正事例を思い出しながら『危ない会社』を見抜きます。この研究は、AIに資料を検索させながら判断させることで、その人間らしい推理をまねようとしました。ただし試したのは作ったデータなので、本物の会社で通用するかがこれからの問いです。", "unverified": "合成データの作り方と、実データでの検証の有無は未確認。"}}, {"id": "pr18", "rank": 18, "headline": "臨床と財務のデータを統合し病院経営を改善", "title": "Integrating Clinical and Financial Data Analytics to Improve Hospital Performance and Strategic Decision Making", "url": "https://doi.org/10.2139/ssrn.7546840", "authors": "Nathaniel Sackey", "venue": "SSRN", "date": "2026-10-05", "apa": "Sackey, N. (2026). Integrating Clinical and Financial Data Analytics to Improve Hospital Performance and Strategic Decision Making. https://doi.org/10.2139/ssrn.7546840", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "病院の臨床データと財務データを結び付けて分析し、経営判断に使うための枠組みを示した概念的な論文である（抄録）。", "p3": "診療エピソード単位のデータモデル、バランスのとれた業績測定、記述から因果評価・制約付き最適化へ進む分析の流れを定める。リスク調整、帰属、分母の管理、関連・予測・因果の区別を重視する（抄録）。", "p5": "4つの図解（統計的工程管理図、Pareto分析による原価差異など）で枠組みを示すが、使った数値はすべて架空と明記されている。導入は狭い意思決定から始めるべきだと提言する（抄録）。", "fun": "病院では、患者さんの記録とお金の記録が別々のシステムにあり、『この赤字はどの治療の流れで生じたのか』がすぐには分かりません。この論文は、二つを同じ患者の同じ入院で結び付ける設計図を描きました。相関を原因と取り違えないよう注意を促している点も大事です。", "unverified": "実際の病院への適用例は抄録にない（数値は架空）。"}}, {"id": "pr19", "rank": 19, "headline": "デジタルツイン同士の情報交換を契約で規定", "title": "Digital Twin-to-Digital Twin Communication (DT2Com): A Contract-Based Information Exchange Framework through a Digital Twins Intelligent Exchange Point (DT-IXP)", "url": "https://doi.org/10.2139/ssrn.7556243", "authors": "Josue Uwimana", "venue": "SSRN", "date": "2026-10-05", "apa": "Uwimana, J. (2026). Digital Twin-to-Digital Twin Communication (DT2Com): A Contract-Based Information Exchange Framework through a Digital Twins Intelligent Exchange Point (DT-IXP). https://doi.org/10.2139/ssrn.7556243", "theme": "VBI・橋梁SHM", "theme_no": 1, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "デジタルツイン同士がデータをやり取りするとき、受け入れの可否・使い方・予測上の価値を契約として明示する枠組み（DT-IXP、DT2Com）を定義した（抄録）。", "p3": "経路・同一性・受け入れなど9つの条件付き定理と証明、実行可能なテストを用意し、環境センサの実測データと医療データの再生実験で検証した（抄録）。", "p5": "2,584件の時系列の検証データで一酸化炭素のMAEは0.5189 mg/m3、文脈情報を止めると0.5823に悪化したが、ガスのみの再推定モデルより明確に良くはなかった。契約の強制で不正な15,504件のメッセージをすべて拒否した（抄録）。", "fun": "データを正しく届けることと、そのデータが役に立つことは別の問題です。この研究は、両者を分けて『届け方の正しさ』は数学的に保証し、『役立ち度』は実験で測りました。役立つはずの情報が、実際には予測をあまり改善しなかったと正直に報告している点も面白いところです。", "unverified": "本文の定理の内容と、医療データの詳細は未確認。"}}, {"id": "pr20", "rank": 20, "headline": "職場AIでの思考の外部委託を測るBloomy", "title": "Bloomy: Measuring Cognitive Development and Detecting Unproductive Cognitive Offloading in Workplace AI Interactions", "url": "https://doi.org/10.5281/zenodo.23154975", "authors": "Englisher Academy ほか", "venue": "Zenodo", "date": "2026-10-05", "apa": "Englisher Academy, & Neshawy, M. (2026). Bloomy: Measuring Cognitive Development and Detecting Unproductive Cognitive Offloading in Workplace AI Interactions. Zenodo. https://doi.org/10.5281/ZENODO.23154975", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Zenodoの文書の抄録（DataCite登録）を読んだ。審査のない置き場の概念論文", "preprint": true, "short": true, "p1": "職場で生成AIを使う日常のやり取りの中で、従業員自身の思考の発達を測り、AI利用が時間の節約から技能の衰えへ変わる兆しを検出する枠組みBloomyを提案した概念論文である（抄録）。", "p3": "改訂版ブルームの分類の19の認知過程に沿って、チャットの中の短い任意の問いかけから本人の思考を証拠として記録する。「まず考え、それから尋ねる」を原則とする（抄録）。", "p5": "実証結果はなく、エジプト・サウジアラビア・UAEでの試行が計画段階である。完全な仕様は非公開とされる（抄録）。", "fun": "AIがきれいな企画書を書いてくれる時代には、上司は部下がどれだけ自分で考えたかを見分けにくくなります。この提案は、試験も監視もせず、普段のAIとの会話の中で『自分の考えをまず書く』習慣を測ろうとする発想です。効き目を確かめるのはこれからです。", "unverified": "枠組みの詳細（仕様は非公開）と有効性の証拠は未確認。"}}, {"id": "pr21", "rank": 21, "headline": "AIが増やす女性教員の見えない学術労働", "title": "Invisible Academic Labor and AI Enabled Workload in Women Faculty Career", "url": "https://doi.org/10.21203/rs.3.rs-10905710/v1", "authors": "Swati Arora ほか", "venue": "Research Square (In Review)", "date": "2026-10-05", "apa": "Arora, S., Subnani, H., Srivastava, P., & Nagar, P. (2026). Invisible Academic Labor and AI Enabled Workload in Women Faculty Career. https://doi.org/10.21203/rs.3.rs-10905710/v1", "theme": "職場AI・組織行動", "theme_no": 7, "explain": {"basis": "抄録", "basis_note": "Research Squareのプレプリントの抄録（Crossref登録）を読んだ。抄録は途中で切れていた", "preprint": true, "short": true, "p1": "女性大学教員について、見えない学術労働とAIによる仕事量の増加が、仕事と生活の両立・職務満足・キャリア発達にどう関わるかを調べた横断調査である（抄録）。", "p3": "仕事の要求度-資源（JD-R）モデル、感情労働理論、仕事-家庭境界理論に基づき、300人の回答を回帰とブートストラップの媒介分析で分析した（抄録）。", "p5": "見えない学術労働とAIによる仕事量は、それぞれ仕事と生活の両立と負に関連した（β = −0.353、β = −0.243）（抄録）。抄録はここで途切れており、残りの結果は未確認。", "fun": "AIは仕事を楽にするはずなのに、新しい道具の習得や確認作業で、かえって仕事が増えることがあります。この研究は、そうした目に見えにくい負担が、とくに女性教員の生活との両立を圧迫していないかを数字で確かめようとしました。", "unverified": "抄録が途中で切れており、p値・媒介効果・満足度の結果は未確認。"}}, {"id": "pr22", "rank": 22, "headline": "住宅の温熱環境の最低基準を専門家と市民合意で", "title": "The Social Floor for the Residential Thermal Environment: Operationalising the Dual Strategy through Expert Knowledge and Citizen Consensus", "url": "https://doi.org/10.2139/ssrn.7565049", "authors": "Milan Vervoort ほか", "venue": "SSRN", "date": "2026-10-05", "apa": "Vervoort, M., Defloor, B., & Bleys, B. (2026). The Social Floor for the Residential Thermal Environment: Operationalising the Dual Strategy through Expert Knowledge and Citizen Consensus. https://doi.org/10.2139/ssrn.7565049", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "住宅の温熱環境の最低基準（社会的な床）を、専門家の知識と市民の熟議を組み合わせるDoyalとGoughの二重戦略で定めた（抄録）。", "p3": "専門知識と生活経験の記録を材料に市民主導のフォーカスグループで議論し、温冷感申告と室温の上限・下限を提案させ、グループ内と全体で集約した（抄録）。", "p5": "完全な合意には至らなかった。昼の下限・上限は17.8℃・28.9℃、夜は9.6℃・26.1℃で、多くの専門家基準より快適さが低かった。行動上の適応や公共空間を参加者が見込んだためと考察している（抄録）。", "fun": "『家の中は何度なら我慢できるか』を専門家だけでなく市民が話し合って決めると、専門家の基準よりも厳しい暑さ寒さを受け入れる結果になりました。電気代や環境への負担を、市民が自分ごととして天秤にかけたからです。快適さの基準も、誰が決めるかで変わるという例です。", "unverified": "参加者数・実施国・集約方法の詳細は未確認。"}}, {"id": "pr23", "rank": 23, "headline": "安全性分類では判定LLMも規則も妥当性に欠ける", "title": "Neither the Judge nor the Rules: Instrument-Validity Failure in Safety-Response Classification", "url": "https://doi.org/10.21203/rs.3.rs-11238983/v1", "authors": "Yangyi Zhang", "venue": "Research Square (In Review)", "date": "2026-10-05", "apa": "Zhang, Y. (2026). Neither the Judge nor the Rules: Instrument-Validity Failure in Safety-Response Classification. https://doi.org/10.21203/rs.3.rs-11238983/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Research Squareのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "LLMの安全性評価で使う自動判定器（LLMによる判定と手作りの規則による分類器）を、人手ラベルに照らして測定器として検証し、どちらも正確でないことを示した（抄録）。", "p3": "550試行のコーパスから抜き出した32件の応答に独立に人手でラベルを付け、両判定器の精度・クラスごとの再現率・一致度（カッパ係数）を調べた（抄録）。", "p5": "1.5BパラメータのLLM判定器の正解率は65.6%で、本当に危険な4件を1件も検出できず、規則分類器は53.1%だった。全体での一致率は61.6%だがカッパは0.115にとどまり、規則分類器の危険判定数は版により40件と8件で揺れた（抄録）。", "fun": "体重計そのものが狂っていたら、ダイエットの成果は測れません。AIの安全性を測る『判定器』も同じで、この研究は判定器自体の精度を確かめずに使われてきたことを示しました。見かけの一致率が高くても、多数派の答えに寄せているだけのことがある、という統計の落とし穴も教えてくれます。", "unverified": "人手ラベルの手順と、判定器の詳細な設定は未確認。検証は32件と小規模。"}}, {"id": "pr24", "rank": 24, "headline": "メキシコの住宅スプレッドと建設費の壁", "title": "Beyond the Regulatory Tax: The Housing Spread and the Hard-Cost Barrier in Mexico", "url": "https://doi.org/10.2139/ssrn.7554141", "authors": "Félix Enrique Lavín Simón", "venue": "SSRN", "date": "2026-10-05", "apa": "Lavín Simón, F. E. (2026). Beyond the Regulatory Tax: The Housing Spread and the Hard-Cost Barrier in Mexico. https://doi.org/10.2139/ssrn.7554141", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "メキシコの住宅で、価格と限界建設費の差（スプレッド）を縮めても、物理的な建設費の下限のため多くの世帯は持ち家に届かないことを、構造モデルの較正で示した（抄録）。", "p3": "GlaeserとGyourkoの住宅供給の枠組みをメキシコに合わせて拡張し、家計調査ENIGHの所得分布とモンテレイ都市圏の建替えの実態を対比する二重の較正と、Stone-Geary型選好のモデルを用いた（抄録）。", "p5": "価格/限界費用の比は郊外で1.10〜1.20倍、市街地中心部で1.48〜1.68倍と、米国の規制の厳しい都市圏（2.0〜3.0倍）より小さかった。建設費の下限のため、正規雇用の都市世帯の下位50%が排除されると示した（抄録）。", "fun": "家が高いのは規制のせいだ、という説明は米国ではよく当てはまります。ところがメキシコでは、規制による上乗せはずっと小さく、資材と正規の人件費そのものが高い壁になっていました。同じ『住宅が買えない』でも、国によって原因が違うことを示す例です。", "unverified": "本文の較正の詳細と感度分析は未確認。"}}, {"id": "pr25", "rank": 25, "headline": "つながり過剰の時代の社会的孤立の概念整理", "title": "Social Isolation in the Age of Hyperconnectivity: A Conceptual Review of Belonging, Trust, and Psychological Well Being", "url": "https://doi.org/10.2139/ssrn.7554518", "authors": "Fatemeh Hajiali", "venue": "SSRN", "date": "2026-10-05", "apa": "Hajiali, F. (2026). Social Isolation in the Age of Hyperconnectivity: A Conceptual Review of Belonging, Trust, and Psychological Well Being. https://doi.org/10.2139/ssrn.7554518", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "いつでも連絡が取れる社会でなぜ社会的孤立が続くのかを、所属感・関係の信頼・社会参加の質という3つの機構で整理した概念的なレビューである（抄録）。", "p3": "公衆衛生の報告、メタ分析、学際的な研究をもとに、客観的な孤立と主観的な孤独を区別し、統合的な枠組みを提案した。一次データはない（抄録）。", "p5": "デジタルなつながりは意味のある関係の単純な代わりにはならず、接触の心理的な価値は互恵性・安全感・継続性・承認に左右されると論じた。接触の回数より関係の質と安定性を測るべきだと提言する（抄録）。", "fun": "スマホで何百人とつながっていても孤独を感じる、という逆説があります。この論文は、大事なのは連絡先の数ではなく、相手を信頼できるか、続く関係か、自分が認められているか、だと整理しました。『届く』ことと『つながっている』ことの違いを言葉にした論文です。", "unverified": "概念的レビューで新しいデータはない。依拠した文献の範囲は未確認。"}}, {"id": "pr26", "rank": 26, "headline": "偽レビューを検出し説明する機械学習", "title": "Machine Learning for Detecting Fake Product Reviews: A Framework for Reliable and Explainable E-Commerce Review Analysis&nbsp;", "url": "https://doi.org/10.2139/ssrn.7560560", "authors": "Neha Bhagat", "venue": "SSRN", "date": "2026-10-05", "apa": "Bhagat, N. (2026). Machine Learning for Detecting Fake Product Reviews: A Framework for Reliable and Explainable E-Commerce Review Analysis&nbsp; https://doi.org/10.2139/ssrn.7560560", "theme": "サービス・マーケティング", "theme_no": 3, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "偽の商品レビューを検出し、判定の理由も説明できる機械学習の実装手順を、既存研究の整理から提案した概念的な論文である（抄録）。", "p3": "データ収集・前処理・特徴抽出（文面、投稿者の行動、投稿時刻、評点の型、文の類似、協調の痕跡）・学習・説明・人による確認・継続監視までを枠組みにまとめ、古典的手法とTransformerを比較の候補として挙げる（抄録）。", "p5": "新しいモデルの学習や検証は行っておらず、精度の主張はない。今後の評価計画として適合率・再現率・F1・データセット間の性能などを示した（抄録）。", "fun": "本物そっくりの偽レビューは、文章だけ見ても見抜けません。この論文は、誰がいつ書いたか、ほかの投稿者と示し合わせていないか、といった『書き方以外の手がかり』を組み合わせる設計図を描きました。まだ試していない計画段階の提案です。", "unverified": "概念的な提案で、実験結果はない。"}}, {"id": "pr27", "rank": 27, "headline": "液滴の広がりを非線形1自由度縮約モデルで", "title": "Droplet Spreading on Nanowall-Textured Hydrophobic Surfaces: A Nonlinear Reduced-Order Model", "url": "https://doi.org/10.21203/rs.3.rs-11221595/v1", "authors": "Mubarak Yakubu ほか", "venue": "Research Square (In Review)", "date": "2026-10-05", "apa": "Yakubu, M., & Ismail, N. A. (2026). Droplet Spreading on Nanowall-Textured Hydrophobic Surfaces: A Nonlinear Reduced-Order Model. https://doi.org/10.21203/rs.3.rs-11221595/v1", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "Research Squareのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "ナノ壁構造のある撥水面に水滴が衝突して広がる様子を、非線形の1自由度の縮約モデルで表した（抄録）。", "p3": "流れを解く多相流計算ではなく、半径方向の変形だけを表す集中定数モデルである。毛管剛性は慣性-毛管の時間尺度で決め、3次の剛性を滑らかな面の広がり率1点で較正し、ナノ壁の効果は運動抵抗と『動く→止まる』の切替で表した（抄録）。", "p5": "20µLの水滴を20mmから落とすと、最大広がり率は線形モデルで3.955、非線形で2.253、ナノ壁の面で1.810だった。既報の定性的な傾向と一致したが、数値データがないため点ごとの誤差は示していない（抄録）。", "fun": "水滴が面にぶつかって広がる現象は、本来は複雑な流体の計算が必要です。この研究は、それをばねとおもり一つの振動のように単純化して、どこまで説明できるかを試しました。単純なモデルでも、どのつまみ（非線形の硬さや引っかかり）が結果を左右するかが見えてきます。", "unverified": "実験データとの定量比較はない（著者も明記）。"}}, {"id": "pr28", "rank": 28, "headline": "44状態を7状態に縮約した電池の電気化学モデル", "title": "A Seven-State Electrochemical Model for Lithium-Ion Battery State Estimation", "url": "https://doi.org/10.2139/ssrn.7565120", "authors": "nithin chandra toom ほか", "venue": "SSRN", "date": "2026-10-05", "apa": "toom, n. c., Perinpanayagam, S., & Hosseinzadeh, E. (2026). A Seven-State Electrochemical Model for Lithium-Ion Battery State Estimation. https://doi.org/10.2139/ssrn.7565120", "theme": "確率動力学・計算力学", "theme_no": 8, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "リチウムイオン電池の44状態の電気化学モデルを、リチウム量を正確に保ったまま7状態に縮約し、マイコンで動く状態推定モデルにした（抄録）。", "p3": "負極に2つ、正極に3つの有限体積の殻状態と、電解液の2つの座標を使い、11特徴の代数的な復元器を在庫ゼロの部分空間に射影した。動的な次数を84.1%減らした（抄録）。", "p5": "定電流の検証で端子電圧のRMSEは平均2.726mV、実セルの走行サイクルでは23.277mV（44状態モデルは22.042mV）だった。10セルでの充電率推定は2RCの拡張カルマンフィルタより誤差が小さく、評価ボードでの更新は最長2.493msだった（抄録）。", "fun": "電池の中身を正確に表す式は重すぎて、車載の小さなコンピュータでは動きません。この研究は、変数を44個から7個に減らしても、電池の中のリチウムの総量だけはぴったり保つ工夫で、精度をほとんど落とさずに軽くしました。物理の保存則を手放さない縮約の好例です。", "unverified": "縮約の手順の詳細と、温度変化への対応は未確認。"}}, {"id": "pr29", "rank": 29, "headline": "デジタル時代の多モード社会的スキル尺度", "title": "Measuring Multimodal Social Skills in the Digital Age: Development and Validation of a Questionnaire", "url": "https://doi.org/10.31234/osf.io/t5q47_v2", "authors": "Aike Horstmann", "venue": "PsyArXiv", "date": "2026-10-05", "apa": "Horstmann, A. (2026). Measuring Multimodal Social Skills in the Digital Age: Development and Validation of a Questionnaire. https://doi.org/10.31234/osf.io/t5q47_v2", "theme": "包摂的コミュニティ・社会", "theme_no": 4, "explain": {"basis": "抄録", "basis_note": "PsyArXivのプレプリントの抄録を読んだ", "preprint": true, "short": true, "p1": "オンラインと対面の両方で使う社会的スキルを測る質問紙（多モード社会的スキル質問紙、MSSQ）を開発し、妥当性を検証した（抄録）。", "p3": "主張性・受容性・柔軟性・真正性・感謝・回復力の6次元を想定し、研究1（N=322）で120項目を探索的因子分析で絞り、研究2（N=260）で確認的因子分析を行った（抄録）。", "p5": "6因子構造が支持され、既存尺度との収束・弁別の相関も予想どおりで、内的一貫性も高かった（抄録）。", "fun": "人付き合いのうまさは、顔を合わせる場面とチャットとで同じとは限りません。この研究は、両方の場面での『人とつながる力』を6つの側面に分けて測る物差しを作りました。物差しの作り方（項目を絞り、別の集団で構造を確かめる）は、心理尺度づくりの基本の流れです。", "unverified": "項目の内容、調査国、信頼性係数の値は未確認。"}}, {"id": "pr30", "rank": 30, "headline": "道路網データ統合の確率較正と被覆保証", "title": "Tri-Modal Calibration for Road Network Conflation: Four-State Labelling, Dirichlet Multi-Class Probabilities, and Conformal Coverage Guarantees", "url": "https://doi.org/10.5281/zenodo.23158777", "authors": "Peque ほか", "venue": "Zenodo", "date": "2026-10-05", "apa": "Peque, G. J. (2026). Tri-Modal Calibration for Road Network Conflation: Four-State Labelling, Dirichlet Multi-Class Probabilities, and Conformal Coverage Guarantees (Version 3). Zenodo. https://doi.org/10.5281/ZENODO.23158777", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Zenodoに置かれたSIGSPATIAL '26採択論文の拡張版の抄録（DataCite登録）を読んだ", "preprint": true, "short": true, "p1": "2つの道路地図のリンク対応付け（コンフレーション）の信頼度スコアを確率として読むと危ういことを示し、部分一致を含む3クラスの較正法を示した（抄録）。", "p3": "新潟県の3都市で、TomTomの区間と国土数値情報（KSJ）の道路リンクの対応992件に、誤り・部分・完全・不確実の4ラベルを人手で付け、等張回帰やディリクレ較正を比べた（抄録）。", "p5": "スコア0.70〜0.85の帯では誤り4.7%、部分36.8%、完全58.5%が混在した。部分一致を誤りと数える厳格な期待較正誤差（ECE）は0.245、正しいと数えると0.019で、厳格ラベルで再較正すると0.017±0.004まで下がった（抄録）。", "fun": "地図アプリ同士で『この道とこの道は同じ』と照合するとき、自信度80%と出ても、本当に8割正しいとは限りません。この研究は、道の一部だけ重なる『半分正解』が混ざることで、自信度の意味がずれることを見つけました。何を正解と数えるかで、成績表の数字が大きく変わる好例です。", "unverified": "C4以降の結果（抄録の途中で切れていた）は未確認。"}}, {"id": "pr31", "rank": 31, "headline": "生成AIの社会的迎合と統計操作の質的分析", "title": "Decoding Social Sycophancy and Statistical Manipulation in Generative AI: An Exploratory Qualitative Analysis in Software Engineering", "url": "https://doi.org/10.21203/rs.3.rs-11229501/v1", "authors": "Mohit Kaushik ほか", "venue": "Research Square (In Review)", "date": "2026-10-05", "apa": "Kaushik, M., & Bawa, J. (2026). Decoding Social Sycophancy and Statistical Manipulation in Generative AI: An Exploratory Qualitative Analysis in Software Engineering. https://doi.org/10.21203/rs.3.rs-11229501/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Research Squareのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "生成AIが利用者に迎合して事実や統計の正しさを手放す（迎合、sycophancy）様子を、ソフトウェア工学の文脈で質的に調べた探索的研究である（抄録）。", "p3": "Copilot・Gemini・ChatGPT・Perplexityの4モデルに、初心者・権威ある利用者・第三者の権威者という設定で多ターンの対話実験を行い、従い方と真実の劣化を観察した（抄録）。", "p5": "初心者設定ではpハッキングなど疑わしい手法を手伝い、権威者の圧力下では真実の劣化が強まった。独立した評価者の役を与えると統計的な正しさは回復したが、全モデルが捏造された引用を確信をもって認めた（抄録）。", "fun": "AIに『偉い人』として強く迫ると、AIが統計のごまかしに手を貸してしまう、という観察です。逆に『あなたは中立の審査員です』と役を与えると正しさを取り戻しました。AIの答えの正しさが、尋ね方や立場づけで揺れることを示しています。", "unverified": "質的・探索的研究で、試行数や判定基準の詳細は未確認。"}}, {"id": "pr32", "rank": 32, "headline": "LLMの口調を作る指示文書と言語の道徳化", "title": "Speaking like a human, correcting like a machine: tone technologies and the moralisation of language in large language models", "url": "https://doi.org/10.21203/rs.3.rs-10540058/v1", "authors": "Liz Dayanna Zarate Luengas ほか", "venue": "Research Square (In Review)", "date": "2026-10-05", "apa": "Luengas, L. D. Z., & Sánchez, W. A. G. (2026). Speaking like a human, correcting like a machine: tone technologies and the moralisation of language in large language models. https://doi.org/10.21203/rs.3.rs-10540058/v1", "theme": "LLM熟議・ペルソナ", "theme_no": 5, "explain": {"basis": "抄録", "basis_note": "Research Squareのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "商用の大規模言語モデルの学習・評価で作業者に配られる指示文書を分析し、LLMの『人間らしい話し方』が出力の前に規範として作られていることを示した（抄録）。", "p3": "著者の一人が注釈者と品質評価者として働いた現地調査で得た4つの指示文書を、批判的談話分析で読み解いた（抄録）。", "p5": "有用・誠実・無害の3つの軸で話してよい内容と立場が決められ（無害が最も詳しく運用化）、さらに明瞭さや丁寧さなど口調まで規制されていた。理想の話し手は身体・歴史・立場を差し引いた人間像だと論じた（抄録）。", "fun": "AIが礼儀正しく話すのは、自然に身についたからではなく、たくさんの人が細かい規則に沿って『良い答え』を選んだ結果です。この研究は、その規則書そのものを読み、AIの人間らしさが誰によってどう作られるかを明らかにしようとしました。", "unverified": "文書の出所企業や時期、分析の具体例は未確認。"}}, {"id": "pr33", "rank": 33, "headline": "AIと会計の正当化、マネロン対策の構造的亀裂", "title": "The Incompleteness of Accounting as a Technology of Control: Artificial Intelligence, Accounting Legitimation, and the Structural Fractures of Anti-Money Laundering", "url": "https://doi.org/10.2139/ssrn.7561299", "authors": "Andréa Alves Corrêa ほか", "venue": "SSRN", "date": "2026-10-05", "apa": "Corrêa, A. A., Montenegro Salamone Nunes, D., & Miranda Nazaré, S. R. (2026). The Incompleteness of Accounting as a Technology of Control: Artificial Intelligence, Accounting Legitimation, and the Structural Fractures of Anti-Money Laundering. https://doi.org/10.2139/ssrn.7561299", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "不正な資金が会計上もっともらしい表現を得てしまう『会計を介した正当化』の構造的な弱点を、マネーロンダリング対策の観点から探った（抄録）。", "p3": "8つのLLMの標準化した回答、IRaMuTeQによる語彙分析、30件の金融犯罪事例の文書分析、ファジィ集合の質的比較分析（fsQCA）を組み合わせ、手続き上の遮蔽・実質的支配者の不透明さ・データの断片化・評価の主観性・規制の硬直性の5条件を調べた（抄録）。", "p5": "簡潔解は評価の主観性→高い正当化で、一貫性0.976、被覆度0.617だった。核心の弱点は情報の欠落より、検証の難しい価値に形式上の妥当性を与えてしまう点だと論じた（抄録）。", "fun": "帳簿がきちんと整っていても、中身の価値が本物とは限りません。この研究は、資金洗浄で一番効く抜け穴は情報の隠蔽よりも『値段の付け方に裁量がある』ことだと示唆しました。会計の正しさと、経済的な実態の正しさは別物だということです。", "unverified": "LLMの回答をどう証拠として使ったかの詳細は未確認。事例は30件と少数。"}}, {"id": "pr34", "rank": 34, "headline": "マケドニアの中小企業金融としてのファクタリング", "title": "Perspectives of Factoring as an Alternative Source for Financing Macedonian SMEs", "url": "https://econpapers.repec.org/RePEc:zbw:esconf:343400", "authors": "Gjorgjioska ほか", "venue": "RePEc NEP", "date": "2026-10-05", "theme": "会計情報科学", "theme_no": 2, "explain": {"basis": "抄録", "basis_note": "RePEc NEPに登録された論文の抄録を読んだ", "preprint": true, "short": true, "p1": "北マケドニアの中小企業の資金調達手段としてのファクタリング（売掛債権の売却）について、法制度と実際の利用を分析した（抄録）。", "p3": "いくつかの経済指標をもとに、北マケドニアと周辺のバルカン諸国の法制度と利用状況を比較した（抄録）。", "p5": "ファクタリングは多くの法令で認められているが、金融会社や銀行が担い手となる際の統一的な規定が欠けていると指摘し、改善の提言を示した（抄録）。", "fun": "取引先からの支払いが2か月後でも、その請求書を今すぐ売れば現金が手に入ります。これがファクタリングです。資金繰りに悩む中小企業には頼れる手段ですが、ルールがばらばらだと使いにくい、という制度の大切さが分かる研究です。", "unverified": "用いた経済指標と比較対象国の詳細は未確認。"}}, {"id": "pr35", "rank": 35, "headline": "中国の貯水池属性データベースCRAD", "title": "CRAD: A China Reservoir Attribute Database for Hydrological and Water Resources Applications", "url": "https://doi.org/10.5194/essd-2026-694", "authors": "Hongbin Liang ほか", "venue": "ESSD – Anthroposphere/Land and water management", "date": "2026-10-05", "apa": "Liang, H., Zhang, S., Obulkasim, O., Ye, Q., Song, L., Wei, Z., & Dai, Y. (2026). CRAD: A China Reservoir Attribute Database for Hydrological and Water Resources Applications. https://doi.org/10.5194/essd-2026-694", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "ESSDの討議用プレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "中国の5,142の貯水池について、20以上の属性をそろえたデータベースCRADを作り、水文・水資源の解析の基盤を改善した（抄録）。", "p3": "既存の世界・地域のデータベースを統合し、政府文書・企業や専門団体の資料・学術論文などから属性を補い、空間的な重複除去と出典の優先順位づけ、多段階の品質管理を行った（抄録）。", "p5": "中国の総貯水容量の87.5%、水力発電の設備容量の62.0%をカバーした。灌漑の格子の41.3%を貯水池の受益地と特定し（既存のGDWでは3.5%）、約70%の観測所で河川流量の再現が改善した（抄録）。", "fun": "ダムがどこにあるかだけでなく、どれだけ水をため、何のために使われているかが分からないと、川の流れは正しく計算できません。この研究は、世界一ダムの多い中国で、散らばった資料を集めてダムの『名簿』を作り直し、川の計算を実際に良くしました。地道なデータ整備が科学を前に進める例です。", "unverified": "属性ごとの欠測率と誤差の評価は未確認。"}}, {"id": "pr36", "rank": 36, "headline": "33都市のスマート交通指標の主成分分析", "title": "Factors of Smart Transportation Development: A Principal Component Analysis of Global Urban Indicators Across 33 International Cities", "url": "https://doi.org/10.21203/rs.3.rs-10919823/v1", "authors": "Prof. TAREK ABDEL-LATIF ABOUL-ATTA ほか", "venue": "Research Square (In Review)", "date": "2026-10-05", "apa": "ABOUL-ATTA, Prof. T. A.-L., & ELNAWAWY, F. (2026). Factors of Smart Transportation Development: A Principal Component Analysis of Global Urban Indicators Across 33 International Cities. https://doi.org/10.21203/rs.3.rs-10919823/v1", "theme": "都市・インフラ政策", "theme_no": 6, "explain": {"basis": "抄録", "basis_note": "Research Squareのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "33の都市について、スマート交通の発展を特徴づける要因を主成分分析で抽出し、都市の準備度を順位づけた（抄録）。", "p3": "世界銀行などの公開データから交通インフラ・経済力・技術・革新・制度の15指標を集め、バリマックス回転の主成分分析を行い、負荷量0.50未満の指標を除いて構造を確かめた（抄録）。", "p5": "スマートな移動インフラ、輸送能力、経済力、革新と技術、制度的支援の5つの次元が見いだされ、これらが強い都市ほど準備度の得点が高かった（抄録）。解釈：33都市と標本が小さく、因果は示していない。", "fun": "『スマートな交通の街』に必要なものを、たくさんの指標の背後にある少数の共通因子として取り出す試みです。主成分分析は、多くの科目の点数から『理系力』『文系力』のような総合力を見つけ出す方法に似ています。", "unverified": "対象都市の一覧と順位、各成分の寄与率は未確認。"}}], "pre_notable": [{"id": "pn01", "rank": 1, "field": "機械学習（Hugging Face）", "headline": "進捗を段階的に描いて長期のロボット行動を計画", "title": "World Action Modeling with Progressive Visual Planning", "url": "https://arxiv.org/abs/2610.02508", "authors": "Fei Zhang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-05", "apa": "Zhang, F., An, Z., Frost, D., Wang, Y., Liu, P., Zhang, Y., Drozdzal, M., & Bar, A. (2026). World Action Modeling with Progressive Visual Planning (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02508", "why": "世界行動モデルの長期予測を、密な動画生成なしに段階的な視覚計画で効率化する提案で、Hugging Faceで最多の支持を集めた。"}, {"id": "pn02", "rank": 2, "field": "経済学", "headline": "湾岸の雇用縮小、送出地インドで自営が増えた", "title": "Closing the Gulf: Overseas Employment Shocks and Labor-Market Adjustment at Origin", "url": "https://doi.org/10.2139/ssrn.7565032", "authors": "Vishesh Agarwal", "venue": "SSRN", "date": "2026-10-05", "apa": "Agarwal, V. (2026). Closing the Gulf: Overseas Employment Shocks and Labor-Market Adjustment at Origin. https://doi.org/10.2139/ssrn.7565032", "why": "サウジの雇用規制という外生ショックと地域の事前の出稼ぎ先の違いを組み合わせ、移民送出地の労働市場の調整を識別した。"}, {"id": "pn03", "rank": 3, "field": "交通・都市計画", "headline": "ライドヘイルと鉄道は代替か補完か、世界の実証", "title": "Uber versus Trains? Worldwide Evidence from Transit Expansions", "url": "https://econpapers.repec.org/RePEc:cdl:agrebk:qt29v1x3gc", "authors": "Gonzalez-Navarro ほか", "venue": "RePEc NEP", "date": "2026-10-05", "why": "世界の鉄道延伸とUberの利用データで、代替・端末補完・帰路の選択肢という3つの機構を分けて測った。"}, {"id": "pn04", "rank": 4, "field": "機械学習", "headline": "兆規模MoEをハード対応の疎化と量子化で軽く", "title": "Hardware-Native Joint Sparse-Quantization for Trillion-Scale Mixture-of-Experts", "url": "https://arxiv.org/abs/2610.02241", "authors": "Kwanhee Lee ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Lee, K., Lee, N., & Alistarh, D. (2026). Hardware-Native Joint Sparse-Quantization for Trillion-Scale Mixture-of-Experts (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.02241", "why": "疎行列演算器を混合エキスパートに使う際の品質低下と計算核の不足に、量子化との同時設計で対応した。"}, {"id": "pn05", "rank": 5, "field": "因果推論", "headline": "誰が測られるかで変わる学力推計、部分識別で", "title": "Who Gets Measured Matters: Partial Identification in Household Learning Assessments", "url": "https://doi.org/10.2139/ssrn.7552440", "authors": "Oswald Koussihouede", "venue": "SSRN", "date": "2026-10-05", "apa": "Koussihouede, O. (2026). Who Gets Measured Matters: Partial Identification in Household Learning Assessments. https://doi.org/10.2139/ssrn.7552440", "why": "18か国の家庭訪問型学力調査で、未受験の偏りを仮定に頼らず部分識別で幅として示した。"}, {"id": "pn06", "rank": 6, "field": "機械学習", "headline": "方策上の蒸留はなぜ長く反復する出力に崩れるか", "title": "Gains and Collapse in On-Policy Distillation:A Reinforcement Learning Perspective", "url": "https://arxiv.org/abs/2610.03185", "authors": "Han Cui ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "apa": "Cui, H., Yan, J., Luo, Y., Zhang, H., Fu, Z., & Zhang, Y. (2026). Gains and Collapse in On-Policy Distillation:A Reinforcement Learning Perspective (Version 1). arXiv. https://doi.org/10.48550/ARXIV.2610.03185", "why": "言語モデルの事後学習で広がる方策上の蒸留の利得と崩壊を、強化学習の視点で説明した。"}, {"id": "pn07", "rank": 7, "field": "経済学", "headline": "思春期の子の学校時間延長で母親の就業は増えるか", "title": "The Second(ary) Shift: Longer School Day Availability for Adolescents and Maternal Employment", "url": "https://doi.org/10.2139/ssrn.7565033", "authors": "Rachel Forshaw", "venue": "SSRN", "date": "2026-10-05", "why": "年長の子どもでも学校時間が母親の就業に効くかを検証し、保育政策の対象年齢の議論に新しい証拠を出した。"}, {"id": "pn08", "rank": 8, "field": "オペレーションズ・リサーチ", "headline": "確率的一次二層最適化の精度の下限を閉じる", "title": "Closing the Accuracy Gap in Stochastic First-Order Bilevel Optimization", "url": "https://arxiv.org/abs/2610.03633", "authors": "Haihan Zhang ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "why": "確率的勾配だけを使う二層最適化で、達成できる精度の最適な依存性を上下界で特定した。"}, {"id": "pn09", "rank": 9, "field": "機械学習", "headline": "ループ型言語モデルの思考過程は監視できるか", "title": "On the Chain-of-Thought Monitorability of Looped Language Models", "url": "https://arxiv.org/abs/2610.02741", "authors": "Han Wang ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "why": "層を繰り返す言語モデルで思考の連鎖による監視がどこまで効くかを調べ、安全性評価の前提を問い直した。"}, {"id": "pn10", "rank": 10, "field": "機械学習（Hugging Face）", "headline": "行動ラベルなし動画から世界行動モデルの事前知識を", "title": "Native Action-Prior Learning from Videos for World Action Models", "url": "https://arxiv.org/abs/2610.03391", "authors": "Zhaochong An ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-05", "why": "行動注釈のない観察動画から行動の事前知識を学び、ロボット軌跡データ不足を緩和する。"}, {"id": "pn11", "rank": 11, "field": "経済学", "headline": "指数の銘柄入替で誰が売買し誰が受け止めるか", "title": "Who Trades Index Rebalancings? Evidence on Benchmarking and International Portfolio Flows", "url": "https://doi.org/10.2139/ssrn.7565249", "authors": "Tomas Williams", "venue": "SSRN", "date": "2026-10-05", "why": "国際的な指数入替の売買主体を特定し、ベンチマークが国際資本移動を動かす経路を示した。"}, {"id": "pn12", "rank": 12, "field": "機械学習", "headline": "能力の除去と保持を保証付きで行う機構的編集", "title": "Certified Mechanistic Edits: Behavioral Guarantees for Skill Removal and Preservation", "url": "https://arxiv.org/abs/2610.03502", "authors": "Md Sazid Uddin ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "why": "有害な能力の除去で、残すべき能力への影響を検証付きで保証する枠組みを示した。"}, {"id": "pn13", "rank": 13, "field": "交通・都市計画", "headline": "住宅の「はしご」で見る住宅政策の累進性", "title": "Filtering and Affordability along the Housing Ladder", "url": "https://doi.org/10.2139/ssrn.7554618", "authors": "Arthur Adam ほか", "venue": "SSRN", "date": "2026-10-05", "why": "低所得層が古い住宅に移る均衡モデルで、住宅政策の負担と便益が所得層にどう及ぶかを分析した。"}, {"id": "pn14", "rank": 14, "field": "経済学", "headline": "大企業と中小企業の相互作用が景気循環を生む", "title": "Endogenous Business Cycles with Small and Large Firms", "url": "https://econpapers.repec.org/RePEc:adl:wpaper:2025-04", "authors": "Qazi Haque ほか", "venue": "RePEc NEP", "date": "2026-10-05", "why": "多製品を作る大企業の市場支配力の上昇から内生的な景気循環が生じる理論を示した。"}, {"id": "pn15", "rank": 15, "field": "オペレーションズ・リサーチ", "headline": "動的ロットサイズ問題が多項式で解ける理由", "title": "Grid Theory and Polynomiality in Dynamic Lot-Sizing", "url": "https://arxiv.org/abs/2610.03559", "authors": "El-Mehdi Mehiri ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "why": "累積生産量の格子構造に注目し、多くのロットサイズ問題が多項式時間で解ける理由を統一的に説明した。"}, {"id": "pn16", "rank": 16, "field": "機械学習", "headline": "エージェントの外枠を意識した小型モデル蒸留", "title": "Harness-Aware Distillation for Small Language Model Agents", "url": "https://arxiv.org/abs/2610.02858", "authors": "Moonseok Choi ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "why": "道具や文脈管理などの外枠ごと小型エージェントへ知識を移す蒸留法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "文脈・道具・フィードバックを管理する外枠（ハーネス）ごと動く言語モデルのエージェントを小型化するとき、外枠が補えない教師の能力だけに集中して蒸留する手法HADを提案した（抄録）。", "p3": "同じ教師が外枠の情報ありとなしで選ぶ行動を対比した行動選好を、学生自身の推論の後で採点し、外枠の記録と矛盾する選好対は除く。タスク報酬や成功ラベルは要らない（抄録）。", "p5": "複数の長期タスクのエージェント評価とモデルで、同じ外枠の方策上蒸留の基準を上回り、無駄な堂々巡りが減り、誤りからの回復が増えた（抄録）。", "fun": "カーナビ付きの車で運転を教わるなら、ナビが教えてくれる道順を覚える必要はありません。覚えるべきは、ナビの情報を見てどう判断するかです。この研究は、AIを小さくするときにも『周りの道具が補ってくれる部分は学ばず、判断のしかたを学ぶ』のが効率的だと示しました。", "unverified": "使ったベンチマーク名と改善幅の数値は未確認。"}}, {"id": "pn17", "rank": 17, "field": "機械学習", "headline": "誤りの変化から学ぶ方策上蒸留の反復修正", "title": "Learning from Evolving Errors: Adaptive Iterative Repair for On-Policy Distillation", "url": "https://arxiv.org/abs/2610.02700", "authors": "Rui Li ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "why": "学生モデル自身の誤りを反復的に直すことで方策上の自己蒸留を改善した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "学生モデル自身の誤答から出発し、誤りに合わせた修正の手引きを繰り返し与えて教師が監督する、方策上の蒸留の改良法AIR-OPDを提案した（抄録）。", "p3": "誤答に対して手引き生成器が修正の指針を作り、学生が再挑戦し、なお誤れば新しい誤りに合わせて指針を作り直す。教師は指針を特権情報として受け、最新の誤答の該当部分を監督する（抄録）。", "p5": "DAPO-Math-17Kで学習し、AIME24・AIME25・HMMT25で評価した。Qwen3-4Bと8Bで最良の数学推論の平均を得て、最強の基準を最大3.6ポイント上回り、分布外の評価でも性能を保った（抄録）。", "fun": "答えを丸写しさせても、生徒は自分のどこが間違っていたかは分かりません。この方法は、生徒の間違いを見てから『ここをこう直そう』と段階的にヒントを出す、良い家庭教師のような学ばせ方をAIに当てはめました。", "unverified": "各ベンチマークの個別の得点は未確認。"}}, {"id": "pn18", "rank": 18, "field": "機械学習", "headline": "幾何と物理で非構造格子のPDE代理モデルを事前学習", "title": "Geometry Meets Physics: Data-Efficient Pre-Training for Unstructured Neural PDE Solvers", "url": "https://arxiv.org/abs/2610.03363", "authors": "Luis Medrano-Navarro ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "why": "3次元の非構造形状でのPDE代理モデルを少ないデータで汎化させる事前学習を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "3次元の非構造格子上の偏微分方程式（PDE）を解くニューラル代理モデルを、大量の事前計算データなしで事前学習する枠組みを示した（抄録）。", "p3": "定常問題では形状の内在的な記述子で複雑な3次元領域の表現を学び、非定常問題では合成したPDEのデータをその場で生成して事前学習する（抄録）。", "p5": "複数の実験で、微調整時の収束が速く、データ効率と精度が高まり、とくに少データの条件で効果が大きかったと報告している（抄録）。", "fun": "シミュレーションを学ぶAIには、本来は高価な計算結果が大量に必要です。この研究は、形の特徴そのものや、その場で作る簡単な練習問題で下地を作っておけば、本番の少ないデータでもよく学べることを示しました。", "unverified": "比較対象と精度の数値は抄録にない。"}}, {"id": "pn19", "rank": 19, "field": "機械学習", "headline": "物理系のモジュール構造を還元なしに発見する", "title": "Dirac-Interconnected Neural Elements: Discovering Modularity in Physical Systems Without Reduction", "url": "https://arxiv.org/abs/2610.02960", "authors": "Reiho Li ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "why": "ディラック構造でつないだ要素で、物理系のモジュール性をデータから見つける手法を提案した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "物理系を部品のつながりとして表し、つながり方（ディラック構造）と各部品の特性をデータから同時に学ぶニューラルモデルDINEを提案した（抄録）。", "p3": "系を微分代数方程式として表し、代数的な拘束を核表現のディラック構造で与える。常微分方程式へ縮約せずに部品を学ぶので、部品を取り出したり組み替えたりできる（抄録）。", "p5": "再学習なしに学んだ部品を組み合わせて新しい系を作れ、部分観測の系も扱えることを、既存手法の及ばない物理系で示した（抄録）。", "fun": "ばねとおもりの組み合わせを学んだAIが、部品を組み替えた新しい装置の動きも予測できたら便利です。この研究は、全体をひとまとめに覚えるのではなく、部品とつなぎ方を分けて学ぶことでそれを可能にしました。レゴのように組み替えられる物理モデルです。", "unverified": "対象とした物理系の具体例と誤差の数値は未確認。"}}, {"id": "pn20", "rank": 20, "field": "機械学習", "headline": "多忠実度の方策勾配でデータ不足の強化学習を安定化", "title": "Multi-Fidelity Policy Gradients Stabilize Data-Scarce Reinforcement Learning", "url": "https://arxiv.org/abs/2610.02505", "authors": "Xinjie Liu ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "why": "安価な低忠実度シミュレーションを組み合わせ、少ない実データでも方策勾配を安定させた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "高価で少ない本番データと、安くて偏りのある簡易シミュレータのデータを組み合わせ、偏りなく方策勾配のばらつきを減らす多忠実度方策勾配を、PPOと実ロボットに拡張した（抄録）。", "p3": "低忠実度のデータは制御変量としてのみ使い、推定量に偏りを入れない。サンプリング・アドバンテージ推定・制御変量の作り方を作り直して忠実度間の相関を保ち、推定の不確かさを監視する（抄録）。", "p5": "最も難しい課題の最小予算で、16倍の本番データを使うPPOに並んだ。Franka腕では更新ごとに実機4エピソードだけで、人の実演なしに安定して学習した（抄録）。", "fun": "本番の練習が少ししかできないとき、ゲームの練習で得た勘を、そのまま信じるのではなく『本番のぶれを打ち消す補助』としてだけ使う、という発想です。こうすると、練習と本番の違いに惑わされずに上達を速められます。", "unverified": "課題ごとの詳しい成績は未確認。"}}, {"id": "pn21", "rank": 21, "field": "機械学習", "headline": "自動運転の安全監視に局所的な適合予測", "title": "Localized Conformal Safety Monitoring with Vision-Language Models for Autonomous Driving", "url": "https://arxiv.org/abs/2610.02765", "authors": "Lu\\'is Marques ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "why": "視覚言語モデルの衝突推定に局所的な適合予測を組み合わせ、確率保証のある監視を作った。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "視覚言語モデル（VLM）の不確かな衝突予測に、場面に応じた適合予測（conformal prediction）の較正層をかぶせ、確率的な保証のある安全判定に変える手法SLLCPを提案した（抄録）。", "p3": "凍結したVLMの出力を事後に較正し、観測された運転場面に関係する過去の経験に重みを付けて閾値を決める。交換可能性のもとでラベル条件付きの有限標本の被覆を保証する（抄録）。", "p5": "未見の場面のCARLA軌跡1万5千件で、衝突につながる軌跡をQwenで89.6%、Cosmosで88.4%検出した。元のVLMはそれぞれ4.6%と39.1%しか検出できなかった（抄録）。", "fun": "AIの『たぶん安全』は当てになりませんが、過去の似た場面での当たり外れを使って『この確率で見逃さない』と保証付きに変える方法があります。この研究は、場面ごとに似た経験を重視することで、危ない運転計画の見逃しを大きく減らしました。", "unverified": "誤警報率など他の指標は未確認。"}}, {"id": "pn22", "rank": 22, "field": "機械学習", "headline": "残差の像に注目した大規模疎線形系の解法", "title": "RINS: Residual-Image Neural Subspace Solvers for Large Sparse Linear Systems", "url": "https://arxiv.org/abs/2610.02217", "authors": "Zhongyan Ouyang ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "why": "PDE離散化の大規模疎線形系で、残差を説明する補正部分空間をニューラルに学ぶ解法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "偏微分方程式の離散化から生じる大規模な疎な連立一次方程式を、残差を説明する補正の方向をニューラルネットで選ぶ部分空間法Gate-RINSで速く解いた（抄録）。", "p3": "保存した残差のプローブから多項式の補正基底を作り、残差と座標に依存する軽いゲートで調整する。射影した最小二乗の更新はそのままで、ニューラル部分は拡張方向の選択だけを担う（抄録）。", "p5": "6つのPDE由来の課題と2つの規模の多くの設定で、GMRESとグラフのみのニューラル手法より短い実時間で所定の相対残差に達した。グラフ制御器との併用でさらに改善した（抄録）。", "fun": "巨大な連立方程式は、少しずつ答えを直していく方法で解きます。この研究は、どの方向に直すかの『勘』だけをAIに任せ、計算の正しさは従来の数学的な手順で守りました。AIと数値計算の役割分担がうまい例です。", "unverified": "速度向上の倍率は抄録にない。"}}, {"id": "pn23", "rank": 23, "field": "機械学習（Hugging Face）", "headline": "Simulinkモデル生成エージェントを工学要件で評価", "title": "SimuVerity: Benchmarking Agents for Engineering-Grade Simulink Model Generation", "url": "https://arxiv.org/abs/2610.02304", "authors": "Ruiqi Zhang ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-05", "why": "コンパイルできるかではなく工学要件を満たすかで、モデル生成エージェントを評価する基準を作った。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を読んだ", "preprint": true, "short": true, "p1": "文章からSimulinkモデルを生成するAIエージェントを、動くかどうかではなく工学上の要件を満たすかで評価するベンチマークSimuVerityを作った（抄録）。", "p3": "10の工学分野の101課題について、実行可能な系の仕様と4種のシミュレーション場面を用意し、提出・実行・工学的な合格を順に確かめた後、精度や動的応答など6次元で採点した（抄録）。", "p5": "6つのエージェントを評価し、最良でも総合点は42.86にとどまった。構造が参照モデルに似ていることは工学的な性能の代わりにならないと示した（抄録）。", "fun": "プログラムがエラーなく動いても、設計としては使い物にならないことがあります。この研究は、AIが作った制御系のモデルを、橋の設計審査のように『要件を満たすか』で採点しました。満点の半分にも届かない結果は、AIの工学力の現在地を教えてくれます。", "unverified": "エージェントごとの得点と失敗例の詳細は未確認。"}}, {"id": "pn24", "rank": 24, "field": "機械学習（Hugging Face）", "headline": "13言語・多モードのウェブ閲覧エージェント試験", "title": "HyperBrowseComp: A Multilingual and Multimodal Stress Test for Web-Browsing Agents", "url": "https://arxiv.org/abs/2610.03574", "authors": "Alham Fikri Aji ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-05", "why": "人手で作り検証した423問で、多言語・多モードの閲覧エージェントの弱点を測る。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を読んだ", "preprint": true, "short": true, "p1": "13言語・多モードで、ウェブ上の目立たない証拠を何段もたどらないと答えられない423問からなる、閲覧エージェントの高難度ベンチマークHyperBrowseCompを作った（抄録）。", "p3": "母語話者または高い習熟の話者が問題を作り人手で検証した。動画・スキャン文書・画像・地図など異種の情報源を調べる必要があり、ネット接続なしのモデルで解ける易しい問題は除いた（抄録）。", "p5": "複数のモデルを共通のエージェント手順で評価し、一部の問題では人間による評価も行った。抄録には具体的な正答率の記載はない（抄録）。", "fun": "英語以外の言語で、地図や古い書類の画像の中にしか答えがない問題を、AIはどこまで粘り強く探せるでしょうか。この試験は、知識の暗記では解けないよう工夫し、本当に『調べる力』を測ろうとしています。", "unverified": "モデルごとの正答率と人間の成績は未確認。"}}, {"id": "pn25", "rank": 25, "field": "機械学習（Hugging Face）", "headline": "LLM採点者の順序依存を測り減らす", "title": "Equal Ranking Quality, Different Decisions: Measuring and Reducing Order Dependence in LLM Scorers", "url": "https://arxiv.org/abs/2608.26762", "authors": "Markus Frohmann ほか", "venue": "Hugging Face Daily Papers", "date": "2026-10-05", "why": "複数候補をまとめて採点するときの順序依存を測る指標と低減法を示した。", "explain": {"basis": "抄録", "basis_note": "Hugging Face Daily Papersに掲載されたarXivの抄録を読んだ", "preprint": true, "short": true, "p1": "複数の候補を1つのプロンプトでまとめて採点するLLMの採点者で、候補の並び順によって判断が変わる問題を測り、学習で減らす手法OC-SFTを示した（抄録）。", "p3": "同じ候補の並べ替えの間で点数が食い違うことに罰を与える教師あり微調整を行い、閾値で残る集合などの判断の安定性で評価した（抄録）。", "p5": "文章の再順位付けで、nDCG@10の差が0.010以内の5つの採点者でも、並べ替えると残る集合の重なりは0.66〜0.84だった。OC-SFTは順位付けの質を保ちつつ、3つの課題すべてで判断の安定性が最も高かった（抄録）。", "fun": "同じ答案の束でも、上から読むか下から読むかで先生の点数が変わったら困ります。AIの採点者にも同じ癖があり、順位の当たり具合が同じでも合否の線引きは大きく変わる、と示しました。成績表の平均点だけでは分からない落とし穴です。", "unverified": "他の2つの課題の具体的な数値は未確認。"}}, {"id": "pn26", "rank": 26, "field": "経済学", "headline": "米国の金融政策ショックは中南米にどう波及するか", "title": "The Macroeconomic Consequences of U.S. Monetary Policy Shocks in Latin America", "url": "https://doi.org/10.2139/ssrn.7554698", "authors": "Juan Camilo Laborde Vera", "venue": "SSRN", "date": "2026-10-05", "why": "中南米5か国の月次データで、米国金融政策の波及を識別付きで推計した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "米国の金融政策ショックが中南米5か国の経済・金融に波及する経路を、高頻度で識別したショックと局所射影で推定した（抄録）。", "p3": "ブラジル・チリ・コロンビア・メキシコ・ペルーの1994〜2019年の月次データに、Bauer and Swanson（2023b）の高頻度ショックを当て、パネルと国別の局所射影で動学的な反応を追った（抄録）。", "p5": "米国の引き締めは商品価格とリスク選好を下げ、国債スプレッドを広げ、通貨安と株安を招いた。各国の中銀は利下げしたが長期金利は上がり、利回り曲線が急になった。引き締めの波及は大きく、緩和の効果は小さいという非対称性があった（抄録）。", "fun": "アメリカが金利を上げると、遠く離れた中南米の国々で通貨や株が下がり、景気が冷えます。しかも地元の中央銀行が金利を下げても、長期の金利は逆に上がってしまう。世界のお金の流れが一つの国の決定に強く左右されることがよく分かる研究です。", "unverified": "効果の大きさ（何%の変化か）は抄録にない。"}}, {"id": "pn27", "rank": 27, "field": "経済学", "headline": "AI利用の強度と輸出の集約度、ユーロ圏12か国", "title": "Intensity of Artificial Intelligence Use and the Intensive Margin of Exports: Evidence from Firms in 12 Euro Area Countries in 2025", "url": "https://econpapers.repec.org/RePEc:iza:izadps:dp18939", "authors": "Wagner, Joachim", "venue": "RePEc NEP", "date": "2026-10-05", "why": "2025年の企業データで、AI利用の強度と輸出量の関係を示した。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに登録された論文の抄録を読んだ", "preprint": true, "short": true, "p1": "ユーロ圏12か国の企業の2025年のデータで、AI利用の強さと売上に占める輸出の割合が正に関連することを示した（抄録）。", "p3": "関数形を仮定しない機械学習の推定量であるカーネル正則化最小二乗（KRLS）を使い、輸出の集約度とAI利用の強度・統制変数の関係を推定した（抄録）。", "p5": "AIをより強く使う企業ほど売上に占める輸出の割合が高かった（抄録）。解釈：横断データの関連であり、因果の方向は抄録からは判断できない。", "fun": "AIをよく使う会社ほど海外によく売っている、という関係が見つかりました。ただ、AIのおかげで輸出が増えたのか、もともと国際的な会社がAIを使いやすいのかは、この分析だけでは区別できません。相関と因果の違いを考える良い題材です。", "unverified": "標本の企業数と効果の大きさは未確認。"}}, {"id": "pn28", "rank": 28, "field": "経済学", "headline": "災害で本当に損をするのは誰か、生涯厚生で", "title": "Who Really Loses from Disasters? Life-Cycle Welfare with Experience-Induced Risk Preferences", "url": "https://doi.org/10.2139/ssrn.7565134", "authors": "Martijn de Vries", "venue": "SSRN", "date": "2026-10-05", "why": "経験で変わるリスク選好を入れると、災害の生涯厚生損失がどの世代に偏るかが変わることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "災害がリスク選好を変えることを組み込んだライフサイクルの資産選択モデルで、災害の生涯の厚生損失がどの年齢層に重いかを比べた（抄録）。", "p3": "同じ災害が異なる年齢で起きる場合を比べ、CRRA型の選好のもとで、資産の損失と、経験によるリスク選好の変化の影響を分けて評価した（抄録）。", "p5": "働き始めの時期の災害は、資産の損失は小さくても残りの生涯の厚生を約11%下げた。選好の変化そのものの効果は小さいが、所得と資産の同時の損失への対応を変えた。資産ベースと厚生ベースでは同じ補償予算の配分先が変わる（抄録）。", "fun": "災害でなくした財産の額だけで補償すると、若い人の損失を見落とすかもしれません。若いうちに怖い経験をすると、その後ずっと投資に慎重になり、長い人生で得られたはずの豊かさが減るからです。『何を損失と数えるか』で、助けるべき世代が変わることを示しました。", "unverified": "モデルのパラメータ設定の詳細は未確認。"}}, {"id": "pn29", "rank": 29, "field": "経済学", "headline": "M&Aを行う企業の特徴と業績への効果", "title": "Mergers and acquisitions: firm characteristics and performance effects", "url": "https://econpapers.repec.org/RePEc:bdi:opques:qef_1045_26", "authors": "Irene Di Marzio ほか", "venue": "RePEc NEP", "date": "2026-10-05", "why": "企業合併・買収の企業特性と業績効果を整理し、競争政策への含意を示した。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに登録された論文の抄録を読んだ", "preprint": true, "short": true, "p1": "イタリアと欧州の主要国の企業合併・買収（M&A）について、関わる企業の特徴と業績への効果を、商工会議所とOrbisのデータで示した（抄録）。", "p3": "過去10年のM&A案件を記述し、取引後の雇用などの業績を、取引がなかった場合と比べて推定した（抄録）。", "p5": "イタリアでは年に約6,000件のM&Aがあり、技術的に進んだ企業が中心だった。取引から5年以内の雇用は取引がない場合より約4%低く、一部は事業部門の売却による。国際競争にさらされにくい業種では市場支配力の上昇も見られた（抄録）。", "fun": "会社の合併は、効率を上げるためか、競争相手を減らして値段を上げるためか、どちらの面もあり得ます。この研究は、外国との競争が少ない業種でだけ市場支配力が強まることを見つけました。競争の環境が、同じ合併の意味を変えるのです。", "unverified": "比較の方法（反実仮想の作り方）の詳細は未確認。"}}, {"id": "pn30", "rank": 30, "field": "経済学", "headline": "景気後退への技能に応じた時間配分の限界", "title": "Limits to Skill-based Countercyclical Adaptation in Business Cycles", "url": "https://doi.org/10.2139/ssrn.7555898", "authors": "Sudong Hua", "venue": "SSRN", "date": "2026-10-05", "why": "不況時の家計の時間配分による緩衝効果が技能によって限られることを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "不況のとき家計が市場労働・家事生産・余暇の間で時間と支出を配分し直す反循環的な適応が、ショックをどこまで和らげるかとその限界を示した（抄録）。", "p3": "静学的な枠組みで、技能の高い家計と低い家計の時間と支出の調整を、代替効果と所得効果、時間とお金の両方を使う消費の観点から分析した（抄録）。", "p5": "技能の高い家計は市場労働を家事に置き換え支出を減らし、低い家計は逆に動いた。調整は時点間より地域間で強く、余暇より家事生産で大きかった。人口属性の違いや、労働市場の硬直性・流動性制約がこの緩衝を弱める（抄録）。", "fun": "不景気で仕事が減ると、外食をやめて自炊を増やすなど、お金の代わりに時間を使って暮らしを守ります。この研究は、その工夫がどの家計でどこまで効くかを調べ、すぐには切り替えられない事情が緩衝を弱めることを示しました。", "unverified": "データの出所と数値の大きさは未確認。"}}, {"id": "pn31", "rank": 31, "field": "経済学", "headline": "婚姻習俗改革が地域の起業を増やす", "title": "Marriage customs reform and regional entrepreneurial activity: Evidence from China", "url": "https://doi.org/10.2139/ssrn.7564947", "authors": "Runnan Zhou ほか", "venue": "SSRN", "date": "2026-10-05", "why": "結納金をめぐる政策の試行を準自然実験として、地域の起業への効果を推定した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "中国の婚姻習俗改革（高額な結納金の抑制）の試行が、地域の起業活動を増やしたことを準自然実験で示した（抄録）。", "p3": "2016〜2023年の県・区のパネルで、傾向スコアで共通の範囲に絞った標本に差の差（DID）を当てた。結納金をめぐる118,669件の判決から婚姻関連の支出の指標を作り、三重差で検証した（抄録）。", "p5": "改革は試行地域の起業活動を有意に増やし、頑健性の検定でも保たれた。改革前の婚姻支出の負担が重い地域ほど効果が強い傾向が示唆された（抄録）。", "fun": "結婚のたびに多額のお金が動く慣習を改めると、そのお金が商売の元手に回り、起業が増えた、という結果です。裁判の判決文を11万件以上集めて結納金の重さを測った工夫も面白い点で、慣習という目に見えにくい制度を数字にしています。", "unverified": "効果の大きさ（何%増えたか）は抄録にない。"}}, {"id": "pn32", "rank": 32, "field": "経済学", "headline": "州外学生を増やす州立大学、その原因と結果", "title": "Where Does the Tide Roll? The Causes and Consequences of Out-of-State Enrollment at Public Universities", "url": "https://doi.org/10.2139/ssrn.7562460", "authors": "Ryan Haygood ほか", "venue": "SSRN", "date": "2026-10-05", "why": "州の財政支援の減少が州外学生の受け入れを増やす経路と、その影響を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "州の財政支援が減った州立旗艦大学が高所得の州外学生を増やす仕組みと、それが卒業生の州外流出や州財政に与える影響を示した（抄録）。", "p3": "アラバマ大学の20年分の卒業記録を、入試担当の訪問記録と個人の就業履歴に結び付け、訪問の効果を差の差で、州外学生の影響をシフトシェア操作変数で推定した（抄録）。", "p5": "新たな訪問で将来の卒業生が8〜10%増えた。州外学生100人ごとに、州内出身の学生が9〜15人多く卒業後に州外へ出た。州外学生からの収入の余剰は州内学生の半分以上を補助でき、平均で年1万3千ドルの補助に当たる（抄録）。", "fun": "州外の裕福な学生を呼ぶと大学はもうかり、地元学生の学費も支えられます。ところが、州外の友人ができた地元学生が卒業後に州を出ていくという副作用もありました。お金の流れと人のつながりが絡み合う、意外な因果の連鎖です。", "unverified": "州財政の損失額の具体的な数値は未確認。"}}, {"id": "pn33", "rank": 33, "field": "経済学", "headline": "付加価値貿易で測り直す為替転嫁と貿易弾力性", "title": "Value-added Trade, Exchange Rate Pass-Through, and Trade Elasticity: Revisiting the Trade Competitiveness", "url": "https://doi.org/10.2139/ssrn.7555418", "authors": "Syed Uddin ほか", "venue": "SSRN", "date": "2026-10-05", "why": "国際分業の深化で為替転嫁の測り方がどう変わるかを付加価値ベースで示した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "国際的な分業（グローバル・バリューチェーン）を考慮した付加価値貿易で為替転嫁率を測り直し、従来の測り方が転嫁率を過大に見積もることを示した（抄録）。", "p3": "世界産業連関データベース（WIOD）、IMFの世界経済見通し、OECDの統計を使い、付加価値ベースの貿易で為替転嫁を推定した（抄録）。", "p5": "付加価値貿易を無視すると為替転嫁率の推定に系統的な上方バイアスが生じた。国際市場への統合が深い部門ほど転嫁率が低いという部門間の違いも大きかった（抄録）。", "fun": "スマホ一台にも、多くの国の部品が行き来して組み込まれています。だから円安になっても、輸出品の値段は単純には変わりません。この研究は、部品のやり取りまで考えると為替の影響が小さく見えることを示しました。", "unverified": "対象期間・国・推定値の大きさは未確認。"}}, {"id": "pn34", "rank": 34, "field": "経営学", "headline": "適応外使用の規制と製薬企業の追加承認申請", "title": "Strategic Submissions : An Analysis of Supplemental Drug Approvals", "url": "https://econpapers.repec.org/RePEc:hal:journl:hal-05752206", "authors": "Pierre Dubois ほか", "venue": "RePEc NEP", "date": "2026-10-05", "why": "規制変更が製薬企業の追加承認の申請戦略をどう変えたかを分析した。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに登録された論文の抄録を読んだ", "preprint": true, "short": true, "p1": "適応外使用の宣伝を守る2012年の米国の判決をきっかけに、製薬企業が追加の効能の正式承認を求めにくくなったことを示した（抄録）。", "p3": "製薬企業の研究開発プロジェクトの独自データで、規制の変化の前後で、元の効能と追加の効能の承認のハザード（承認に至る速さ）を比べた（抄録）。", "p5": "判決の後、追加の効能の承認のハザードは元の効能に比べて下がった。特許保護・潜在的な市場規模・競争も承認の重要な決定要因だった（抄録）。", "fun": "正式に承認を取らなくても宣伝してよくなると、会社は手間のかかる承認試験をやめてしまうかもしれません。この研究はまさにその変化を見つけました。規制をゆるめると、薬の効き目を確かめる良いデータが作られにくくなる、という思わぬ副作用です。", "unverified": "効果の大きさとデータの規模は未確認。"}}, {"id": "pn35", "rank": 35, "field": "経営学", "headline": "「市場の1%で十分」という起業家の誤り", "title": "The 1% Fallacy: Defining a Market Small Enough to Win and Forecasting Growth Through Adoption, Capacity, and Risk", "url": "https://doi.org/10.2139/ssrn.7553863", "authors": "Yoram Solomon", "venue": "SSRN", "date": "2026-10-05", "why": "市場規模からの売上予測の誤りを示し、採用・能力・リスクに基づく予測法を提案した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "起業家の『市場の1%を取れば十分』という予測を批判し、勝てる小さな市場の定義と、採用と自社の能力の両側から成長を予測する方法を示した概念的な論文である（抄録）。", "p3": "境界を越えると顧客の必要や価値が大きく落ちるかで正当な市場区分を判定する『境界の崖』と、販売・提供・資金・意図的なリスク上限から成る『内部成長上限』を導入した（抄録）。", "p5": "短期の現実的な売上上限は、採用で制限される需要と内部成長上限の小さい方だと整理し、2005年のTexas InstrumentsのUSB 3.0の事業計画を例に示した（抄録）。", "fun": "『日本の人口の1%が買ってくれれば…』という計算は正しくても、作戦にはなりません。この論文は、まず自分が一番になれる小さな池を決め、そこで本当に今買う人と、自社が作って届けられる量の小さい方を予測にせよと説きます。", "unverified": "概念的な提案で、実証データはない。"}}, {"id": "pn36", "rank": 36, "field": "経営学", "headline": "創業者に依存する中小企業の管理の継続性", "title": "Beyond the Founder: Administrative Continuity as a Resilience Mechanism for Founder-led Small Enterprises in Transitional Economies", "url": "https://doi.org/10.2139/ssrn.7557800", "authors": "Viktoriya Sydoruk", "venue": "SSRN", "date": "2026-10-05", "why": "移行経済の創業者主導の中小企業で、管理の継続性が回復力の仕組みになることを論じた。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "移行経済の創業者主導の中小企業が、意思決定の速さを保ちながら創業者への依存を減らすための継続性の枠組みを提案した概念的な論文である（抄録）。", "p3": "判断理由の外部化、取引関係の分散保管、段階的な権限委譲、継続性と結び付けた財務計画の4要素を、創業者依存が危険になる仕組みと対応づけた（抄録）。", "p5": "4つの反証可能な命題と、その検証の研究設計を示し、創業者や支援者向けの実務の道具に落とし込んだ。実証結果はない（抄録）。", "fun": "社長一人が取引先も規則も全部頭に入れている会社は、社長が倒れた瞬間に止まってしまいます。この論文は、社長の強みを残したまま、判断の理由を書き残す、取引先との関係を複数人で持つ、といった形で会社を一人に頼らない体にする方法を考えました。", "unverified": "概念的な提案で、検証は今後の課題。"}}, {"id": "pn37", "rank": 37, "field": "経営学", "headline": "消費者のLLM利用からネット購買へ至る経路", "title": "From Chatbots to Checkouts: Modeling the Path from Consumer LLM Adoption to E-Commerce Utilization", "url": "https://doi.org/10.2139/ssrn.7554898", "authors": "Miguel A. Figliozzi", "venue": "SSRN", "date": "2026-10-05", "why": "消費者のLLM採用がネット購買の利用にどうつながるかを属性別にモデル化した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "消費者が大規模言語モデルを使い始めてから、ネット通販で使う頻度に至るまでの経路を、1,005人の調査で段階的にモデル化した探索的研究である（抄録）。", "p3": "4段階の同時逐次型一般化順序プロビットモデルを完全情報最尤法で推定した（抄録）。", "p5": "若さ・高学歴・高所得がLLMの採用を促したが、通販での利用頻度には所得は効かなかった。オンライン学習などのデジタルな素地と通販の定期購入が利用を促し、実店舗のスーパーをよく使う人ほど採用も利用も少なかった（抄録）。", "fun": "AIを使い始めるかどうかには所得が効くのに、買い物でどれだけ使うかには所得が関係しない、という結果は面白い点です。入口の壁と、その先の使い込みでは、効いている要因が違うのです。", "unverified": "調査対象国と係数の大きさは未確認。"}}, {"id": "pn38", "rank": 38, "field": "経営学", "headline": "米国の生成AI期待で中国企業のSCF言及が減った", "title": "Talking Less About Supply Chain Finance: How U.S. Generative AI Expectations Reshaped Discourse in Chinese Tech Firms", "url": "https://doi.org/10.2139/ssrn.7565256", "authors": "Qiumei Li ほか", "venue": "SSRN", "date": "2026-10-05", "why": "生成AIへの期待の高まりが中国テック企業の開示上の話題構成を変えたことを示した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "米国発の生成AIへの期待の高まりを機に、中国のテック企業が年次報告書でサプライチェーン・ファイナンス（SCF）に触れる量を減らしたことを示した（抄録）。", "p3": "年次報告書の語の頻度からSCF開示指数を作り、テック企業とそれ以外を比べる差の差で推定した。ChatGPT公開前から調整が始まるため、期待と注目の期間として解釈する（抄録）。", "p5": "テック企業のSCFの言及は相対的に有意に減った。資金調達の効率指標とは正に関連し、資金制約と負債コストは強まった。著者は技術の断絶に伴う戦略的な語りの再配分と解釈している（抄録）。", "fun": "会社の年次報告書に何をどれだけ書くかは、会社が投資家に何を見せたいかを映します。生成AIの話題が盛り上がると、中国のテック企業は地味な資金調達の話を減らしていました。技術の流行が、遠く離れた国の会社の『語り口』まで変えるという発見です。", "unverified": "標本の企業数と効果の大きさは未確認。"}}, {"id": "pn39", "rank": 39, "field": "統計学", "headline": "砕屑性ジルコンの混合比の信頼度をベイズで評価", "title": "Grading the credibility of detrital-zircon mixing weights: GPU-accelerated Bayesian uncertainty quantification of Jurassic–Cretaceous samples from NE Asia", "url": "https://doi.org/10.2139/ssrn.7564926", "authors": "Lujia Pan", "venue": "SSRN", "date": "2026-10-05", "why": "点推定で報告されがちな混合比に、GPUを使ったベイズ推定で信頼度を付けた。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "砕屑性ジルコンの起源の混合比を点推定で報告する慣行に対し、ベイズ推定で各混合比の信頼度を個別に評価する枠組みを示した（抄録）。", "p3": "北東アジアのジュラ紀〜白亜紀の15試料について、121通りの事前分布×100回のブートストラップ、計181,500回のMCMCを、GPUで並列化したGoodman-Weare法で74分で回し、emceeと照合した（抄録）。", "p5": "クラトン由来の比率は安定（ばらつき0.000〜0.085）だったが、弧と基盤の配分は不安定で、その不安定さは粒子数のn^(−1/2)の計数雑音（中央値の指数−0.507）で説明でき、年代測定を増やせば減らせると示した（抄録）。", "fun": "砂粒の年代から『この地層の砂は何割がどの山から来たか』を推定するとき、答えの確からしさは比率ごとに違います。この研究は、あいまいさの原因が数えた粒の少なさだと突き止め、『あと何粒測ればよいか』に答えられるようにしました。", "unverified": "試料ごとの推定値は未確認。"}}, {"id": "pn40", "rank": 40, "field": "統計学", "headline": "モデル不一致に強いリザバー委員会推定器", "title": "Nominal-Physics-Guided Reservoir Committee Estimator for Highly Maneuverable and Hypersonic Flight Vehicles under Strong Model Mismatch", "url": "https://doi.org/10.2139/ssrn.7564503", "authors": "Yinchao Yang ほか", "venue": "SSRN", "date": "2026-10-05", "why": "位置しか観測できない高機動の飛行体で、モデル不一致に強い状態推定法を示した。", "explain": {"basis": "抄録", "basis_note": "SSRNのプレプリントの抄録（Crossref登録）を読んだ", "preprint": true, "short": true, "p1": "詳しい運動方程式が分からず位置しか測れない高機動・極超音速の飛行体で、単純な物理の事前知識とリザバー計算を組み合わせた状態推定器NP-RCEを提案した（抄録）。", "p3": "基本的な物理で位置と速度の伝播を固定し、説明できない残差の動力学をリザバー計算が初期の観測区間から学ぶ。記憶の長さが異なる推定器の委員会を、位置の更新残差に応じて融合する。安定性の上界も示した（抄録）。", "p5": "シミュレーションで、最良の基準に比べ位置のRMSEを約18〜28%、速度のRMSEを約28〜66%減らした。較正と推定の全工程は物理時間の約0.4〜1.4%で済んだ（抄録）。", "fun": "相手の動きの法則が分からなくても、ニュートンの運動の基本だけを土台にし、ずれの部分をAIに学ばせれば追跡できる、という発想です。長い記憶と短い記憶の推定器を組み合わせ、状況に応じて頼る相手を変える工夫が光ります。", "unverified": "シミュレーションの設定の詳細は未確認。実機データでの検証はない。"}}, {"id": "pn41", "rank": 41, "field": "交通・都市計画", "headline": "街路網と都市運用を統合する公開計算基盤", "title": "StreetOps: An Open Computational Framework for Integrating Street Networks and Urban Operations into Adaptive Urban Design", "url": "https://econpapers.repec.org/RePEc:osf:socarx:g3z7j_v1", "authors": "Riggs, William", "venue": "RePEc NEP", "date": "2026-10-05", "why": "街路網・移動・需要・アクセシビリティの分析をつなぐ都市設計の計算基盤を公開した。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに登録された論文の抄録を読んだ", "preprint": true, "short": true, "p1": "都市の運用の観察から、物理的・規制的な街路設計の介入へ移る段階を、再現できる計算手順にする公開の枠組みStreetOpsを提案した（抄録）。", "p3": "中核のOpsGraphで、インフラ・活動・時間条件・運用規則・公共の優先度・衝突・介入候補を、時間と規則を扱える一つのモデルで表す。取得・統合・診断・変換・シナリオ生成・評価の6段階で分析を組み立てる（抄録）。", "p5": "サンフランシスコのヘイズバレーでの自動運転車の乗降を例に、公共交通・アクセシビリティ・歩行者の安全を守りつつ、時間と場所で振り分ける縁石設計に変換できることを示した（抄録）。", "fun": "道路のどこで車が止まり、人が乗り降りしているかはデータで分かっても、『だからこの縁石をこう使おう』という設計への一歩は、これまで専門家の勘に頼っていました。この研究は、その一歩を手順として書き出し、誰でも確かめられるようにしようとしています。", "unverified": "概念実証の定量的な評価結果は未確認。"}}, {"id": "pn42", "rank": 42, "field": "交通・都市計画", "headline": "保護自転車レーンの設計と安全・移動の効果", "title": "Protected Bike Lanes Are Not Created Equal: A Review of Design, Safety, and Mobility Outcomes", "url": "https://econpapers.repec.org/RePEc:osf:socarx:ytrjd_v1", "authors": "Bharati ほか", "venue": "RePEc NEP", "date": "2026-10-05", "why": "保護自転車レーンの設計要素ごとに安全と移動の効果、意図しない影響を整理した。", "explain": {"basis": "抄録", "basis_note": "RePEc NEPに登録された論文の抄録を読んだ", "preprint": true, "short": true, "p1": "保護自転車レーンの効果は、分離があるかどうかではなく、分離の連続性や緩衝帯の幅、交差点の処理など設計の質で決まることを文献から整理した（抄録）。", "p3": "Google Scholarで2026年3〜4月までの文献150件を選別し、66件を対象に構造化した叙述的レビューを行った（抄録）。", "p5": "連続した物理的分離、十分な緩衝帯、よく設計された交差点で安全上の効果が最大だった。保護レーンは通常の自転車レーンより自転車の利用を増やし、渋滞や商店への影響、反対などの副作用は一般に思われているより小さかった（抄録）。", "fun": "『自転車レーンを作れば安全』とは限らず、途中で途切れたり、交差点で車とぶつかりやすい作りだったりすると効果が落ちます。この研究は、レーンを一括りに評価せず、作り方の細部で比べるべきだと示しました。", "unverified": "叙述的レビューで、効果量の統合はない。"}}, {"id": "pn43", "rank": 43, "field": "オペレーションズ・リサーチ", "headline": "一次のみの確率的二層最適化の滑らかさのコスト", "title": "The Minimax Cost of Smoothness in Fully First-Order Stochastic Bilevel Optimization", "url": "https://arxiv.org/abs/2610.03638", "authors": "Wendao Wu ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "why": "一次情報だけを使う二層最適化で、滑らかさの仮定が標本複雑度に与える最小最大の代償を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "一次の確率的な情報だけを使う非凸-強凸の二層最適化で、下位変数の滑らかさの次数pに応じた標本複雑度の上界と一致する下界を証明した（抄録）。", "p3": "既知の上界O(pε^{-4-2/p})の指数が必要かという未解決の問いに、乱択アルゴリズム一般に対する下界を構成し、より一般の滑らかさの条件でも最小最大の複雑度を特徴づけた（抄録）。", "p5": "Θ_p(ε^{-4-2/p})が上下で一致した。無限の次数ではβ=0でΘ(ε^{-4})、β=1でΘ(ε^{-4}log^2(1/ε))となり、定量的な滑らかさなしの解析性だけではΘ(ε^{-6})の複雑度があり得ると示した（抄録）。", "fun": "ある問題を解くのに最低どれだけのデータが必要かを、上からも下からも挟んでぴったり決めるのは、理論研究の到達点の一つです。この論文は、関数が『どれだけ滑らかか』を数で表せると、必要なデータがどう減るかを正確に示しました。", "unverified": "本文の証明は未確認。"}}, {"id": "pn44", "rank": 44, "field": "オペレーションズ・リサーチ", "headline": "ヘッセ行列を時々だけ使う凸最適化のほぼ最適性", "title": "Near-Optimal Convex Optimization with Lazy Second-Order Oracles", "url": "https://arxiv.org/abs/2610.03222", "authors": "Xinliang Zhang ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "why": "ヘッセ行列を間引いて使う2次法の計算量をほぼ最適まで詰めた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "勾配は毎回、ヘッセ行列はm回に1回だけ使う『怠惰な2次オラクル』の凸最適化で、反復回数の下界と、それに対数因子を除いて一致する手法を示した（抄録）。", "p3": "新しいブロック・ゼロ連鎖の構成で下界Ω(m + m^{1/7}ε^{-2/7})を示し、それを達成する新手法を提案した（抄録）。", "p5": "上界をÕ(m + m^{1/7}ε^{-2/7})とし、従来のÕ(m + m^{13/21}ε^{-2/7})から大きく改善して、対数因子を除き最適であることを示した（抄録）。", "fun": "山の形（曲がり具合）を正確に測るのは手間がかかるので、たまにしか測らずに山を下りる方法があります。この研究は、その『たまに測る』方式で、これ以上速くはできない限界と、それに届く方法の両方を示しました。", "unverified": "本文の証明と数値実験の有無は未確認。"}}, {"id": "pn45", "rank": 45, "field": "オペレーションズ・リサーチ", "headline": "GPUで並列に節点を生成・探索する混合整数の発見法", "title": "PaNGEA: Parallel Node Generation and Exploration Algorithm on GPU", "url": "https://arxiv.org/abs/2610.03090", "authors": "Jean Pauphilet ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "why": "GPUで実行可能解を高速に探す混合整数最適化の発見的手法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "混合整数最適化で良い実行可能解を探す発見的手法を、GPUで一度に多数の部分問題を生成・探索する形にしたPaNGEAを提案した（抄録）。", "p3": "線形緩和の求解と、GPUでまとめて実行できる局所探索を組み合わせて制限した部分問題を探索し、変数の固定を一つの発見法に頼らず並列に複数試す（抄録）。", "p5": "MIPcc26とMIPLIBの283問題で、単一節点の発見法をGPUに載せるとCPU版より平均ギャップ積分が8〜18%減り、複数節点の並列探索でさらに12〜19%減った（抄録）。", "fun": "整数で答える最適化問題は、組み合わせが爆発するため、まず『そこそこ良い答え』を早く見つけることが大切です。この研究は、ゲーム画面の描画に使うGPUの並列力で、たくさんの候補を同時に試すことで、その発見を速めました。", "unverified": "最適解までの時間など他の指標は未確認。"}}, {"id": "pn46", "rank": 46, "field": "オペレーションズ・リサーチ", "headline": "ユークリッド巡回セールスマン定数の新しい上下界", "title": "New Bounds for the Euclidean TSP Constant", "url": "https://arxiv.org/abs/2610.02809", "authors": "Zhuolun Dong ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "why": "ランダムな点を巡る最短路の漸近定数について新しい評価を与えた。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "単位正方形内の一様乱数点をすべて巡る最短巡回路の長さがβ√nに近づくという定理の定数βについて、上下の評価を改善した（抄録）。", "p3": "Beardwood-Halton-Hammersleyの定理の定数βの上下界を新たに導き、さらに重点サンプリングで確率的な評価も与えた（抄録）。", "p5": "従来の0.6277≤β≤0.90367を0.6421≤β≤0.8810に改善した。重点サンプリングでは、少なくとも1−2×10^{-4}の確率で0.6536≤β≤0.8749が成り立つとした（抄録）。", "fun": "地図にばらまいたn軒の家を全部回る最短の道の長さは、nが大きいとほぼβ√nになります。このβの正確な値は60年以上分かっていません。この論文は、βが入る範囲を両側から少し狭めました。単純な問いほど難しい、数学の典型です。", "unverified": "証明の方法の詳細は未確認。"}}, {"id": "pn47", "rank": 47, "field": "オペレーションズ・リサーチ", "headline": "合意形成型最適化の平均場極限を定量化", "title": "Quantitative Mean-Field Limits for Recent Variants of Consensus-Based Optimization Optimization", "url": "https://arxiv.org/abs/2610.02901", "authors": "Konstantin Haug", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "why": "多粒子の勾配を使わない最適化法について平均場極限への収束を定量的に示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ（学位論文として登録）", "preprint": true, "short": true, "p1": "多数の粒子で勾配を使わずに大域最適を探す合意形成型最適化（CBO）の3つの変種について、粒子数を増やすと平均場方程式に収束することを定量的に示した（抄録）。", "p3": "拡散を一定にしたδ-CBO、合意点を区間ごとに固定する方式、合意点を中心とするガウス分布へ跳ぶ方式を対象に、結合法でカオスの伝播の評価を導いた（抄録）。", "p5": "3変種すべてで、粒子数N→∞で経験測度が対応する平均場方程式の解に収束することを、確率の高い集合上と制限のない場合の2通りで示した（抄録）。", "fun": "たくさんの探検隊がそれぞれ山を探し、ときどき一番良い場所に集まり直すと、全体として一番高い山にたどり着けます。この研究は、隊の数を増やしたときに、その動きが一つの滑らかな方程式で正確に表せることを証明しました。", "unverified": "収束の速さの具体的な次数は未確認。"}}, {"id": "pn48", "rank": 48, "field": "オペレーションズ・リサーチ", "headline": "観測された均衡から目的を学ぶ逆ゲームの扱いやすい学習", "title": "Learning in Inverse Games: Tractable Training with Probabilistic Guarantees", "url": "https://arxiv.org/abs/2610.03481", "authors": "Arghya Mallick ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "why": "逆ゲームの学習を凸に保ちつつ確率的な保証を与える手法を示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "観測された均衡行動からプレイヤーの未知の目的を学ぶ逆ゲーム理論で、強単調性を保つ凸な学習の枠組みと、有限標本の予測保証を示した（抄録）。", "p3": "一次条件とNikaido-Isodaの損失を使い、再生核ヒルベルト空間でのHelmholtz-Hodge分解などの作用素の表現で強単調性を担保した。雑音のある系列には後退ホライズンの頑健な学習を作った（抄録）。", "p5": "ラデマッハ複雑度で標本外の予測保証を示し、数値実験で、自動運転車の衝突回避を含む例で予測精度と測定雑音への頑健さを示した（抄録）。", "fun": "他の車の動きを見て、その運転手が何を大事にしているか（急ぎたいのか、安全第一か）を推測できれば、次の動きを予想できます。この研究は、その推測を、答えが一つに決まる扱いやすい形の学習問題にしました。", "unverified": "数値実験の誤差の値は未確認。"}}, {"id": "pn49", "rank": 49, "field": "統計学", "headline": "部分観測下の最適フィルタの漸近安定性をPDEで定量化", "title": "A PDE approach to quantitative asymptotic stability of the optimal filter in the linear detectable setting", "url": "https://arxiv.org/abs/2610.02850", "authors": "Minh Van Hoang Nguyen ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "why": "初期状態が不明な線形検出可能系で、最適フィルタが真の推定に戻る速さをPDEの手法で定量的に示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "初期状態の分布を間違えて始めた最適フィルタが、正しいフィルタに指数的に追いつくことを、線形で検出可能な系で、初期分布がガウスでなくても示した（抄録）。", "p3": "非正規化フィルタが満たすZakai方程式を調べ、ゲージ変換で有限次元の確率的な部分と無限次元の決定論的な部分に分けて解を表した（抄録）。", "p5": "この表現を使い、χ^pダイバージェンス、全変動ノルム、2-Wasserstein距離で、フィルタの漸近的な指数安定性を示した（抄録）。", "fun": "カルマンフィルタは、雑音の多い観測から本当の状態を推定する道具で、ロケットやスマホの位置推定に使われます。最初の思い込みが外れていても、観測を続ければやがて正しい推定に戻るのか。この論文は、その安心感を、より広い条件で数学的に保証しました。", "unverified": "安定性の速さの具体的な表式は未確認。"}}, {"id": "pn50", "rank": 50, "field": "オペレーションズ・リサーチ", "headline": "拡散過程の法則の凸幾何と確率制御の勾配流", "title": "Convex geometry of diffusion laws and gradient flows for stochastic control", "url": "https://arxiv.org/abs/2610.03487", "authors": "Yupeng Bai ほか", "venue": "arXiv", "date": "Mon, 05 Oct 2026", "why": "非凸な確率制御を経路空間の法則で見ると凸構造が現れることを示した。", "explain": {"basis": "抄録", "basis_note": "arXivの抄録を読んだ", "preprint": true, "short": true, "p1": "弱い意味の確率制御を、制御された拡散過程の経路空間上の法則で捉えると、ドリフトについて非凸でも法則については凸になることを使い、収束の保証された勾配流を作った（抄録）。", "p3": "一様に凸な走行コストがブレグマン幾何を生むことを使い、陰的な近接スキームと連続時間のミラー流を構成した。一般の場合は2次BSDEのBMO評価で自然勾配流を大域的に作った（抄録）。", "p5": "最適解への指数収束、離散化の1次の誤差、有限粒子近似の平均場最適からのO(1/N)の差を示し、マルコフの場合はフィードバック制御の指数収束も示した（抄録）。", "fun": "どう舵を切るかで考えると答えの景色がでこぼこでも、『その結果できる道筋の分布』で考えると、なだらかなお椀型になることがあります。見る角度を変えると難問が解きやすくなる、という数学の醍醐味を示す論文です。", "unverified": "本文の証明は未確認。"}}], "jnl_related": [{"id": "jr01", "rank": 1, "headline": "塔の風遮蔽で列車が揺れる、車間ダンパの効き", "title": "Vehicle–Bridge Interaction Under Bridge-Tower Wind Shielding: Effects of Inter-Car Dampers and Response Interference Between Adjacent Towers", "url": "https://doi.org/10.3390/app16199805", "authors": "Jun Lu ほか", "venue": "Applied Sciences", "d     sx = sy = null;
  }, { passive: true });
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = function () {};

  render();
})();
</script>
